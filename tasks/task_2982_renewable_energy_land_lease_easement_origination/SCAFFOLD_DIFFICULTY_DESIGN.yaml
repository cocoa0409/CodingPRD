  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: exercise_blocked_by_open_blocking_curative_item
        entity_pair: [OptionAgreement, TitleCurativeItem]
        grounds:
          - validations[priority=26]
          - errors.ERR_TITLE_CURATIVE_BLOCKING
          - state_machines.OptionAgreement.EXECUTED_to_EXERCISED
          - state_machines.TitleCurativeItem.OPEN_to_CLEARED
          - entities.Parcel.fields.blocking_curative_open_count
        distinguishing_aspect: |
          The gate sits on OptionAgreement but the governing state lives on a
          TitleCurativeItem two hops away, reached through the Parcel's
          blocking_curative_open_count. The pair is proved in both directions
          within one instance: with the item OPEN the exercise is refused, and
          after the very same item is cleared the identical request succeeds and
          mints the lease. Note the parcel stays OPTIONED throughout, because
          requalification never fires on an optioned parcel, so the refusal cannot
          be attributed to the parcel's own status.
        test_recipe:
          setup:
            - "One Landowner 'Caprock Ranch Holdings LLC' with w9_on_file true, three 48453 SetbackRule rows and the 125.00-acre Parcel with buildable_acres 100.00."
            - "One OptionAgreement sent, accepted and executed by pm-user-01 at the default clock, so the option is EXECUTED with option_expiry_at 2027-08-01T00:00:00Z and the parcel is OPTIONED."
            - "One TitleCurativeItem of severity BLOCKING (ACCESS_EASEMENT_GAP, curative_cost_cents 310000) raised by tc-user-01 after execution, so blocking_curative_open_count is 1 while the parcel remains OPTIONED."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Caprock Ranch Holdings LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "land@caprock.example", w9_on_file: true, payment_hold: false }
