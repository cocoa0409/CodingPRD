scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: fund_creation_defaults_and_system_fields
        claim_type: creation_defaults
        grounds:
          - "entities.Fund"
        distinguishing_aspect: "POST /funds with required inputs returns 201; status PENDING_AGREEMENT; cash_balance/invested_units 0; version 1; client-supplied status/cash_balance ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /funds"
              payload: { fund_name: "Corner Fund", fund_type: "DONOR_ADVISED", endowed: false }
              as: FoundationAdmin
              captures: { cf_id: $.data.id, cf_status: $.data.status, cf_cash: $.data.cash_balance, cf_v: $.data.version }
          assert:
            - "Fund.status == PENDING_AGREEMENT"
            - "Fund.cash_balance == 0.00 and invested_units == 0.0000"
            - "Fund.version == 1; id is a bare UUID"

      - name: fund_not_found_returns_404
        claim_type: not_found
        grounds:
          - "entities.Fund"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /funds/{random-uuid} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /funds/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: FoundationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: fund_list_pagination_envelope
        claim_type: listing_pagination
        grounds:
          - "entities.Fund"
          - "response_envelope"
        distinguishing_aspect: "GET /funds with limit=1 after creating 2 funds returns exactly 1 row, total_count 2, has_more true; second page offset=1 returns the other."
        test_recipe:
          setup: ["two funds exist"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "Page Fund A", fund_type: "DESIGNATED", endowed: false }
              as: FoundationAdmin
            - call: "POST /funds"
              payload: { fund_name: "Page Fund B", fund_type: "SCHOLARSHIP", endowed: true }
              as: FoundationAdmin
          trigger:
            - call: "GET /funds?limit=1&offset=0"
              as: FoundationAdmin
          assert:
            - "response envelope contains meta.api_request_id and response_type == 'array'"
            - "data length == 1; pagination reports total_count == 2 and has_more == true"

      - name: fund_name_uniqueness_enforced
        claim_type: uniqueness_constraint
        grounds:
          - "entities.Fund.fields.fund_name"
          - "validations[priority=11]"
          - "errors[ERR_UNIQUENESS_VIOLATION]"
        distinguishing_aspect: "Second POST /funds reusing the same fund_name returns ERR_UNIQUENESS_VIOLATION 409."
        test_recipe:
          setup: ["fund 'Dup Fund' exists"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "Dup Fund", fund_type: "DESIGNATED", endowed: false }
              as: FoundationAdmin
          trigger:
            - call: "POST /funds"
              payload: { fund_name: "Dup Fund", fund_type: "SCHOLARSHIP", endowed: true }
              as: FoundationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNIQUENESS_VIOLATION"

      - name: grantee_tax_id_uniqueness_enforced
        claim_type: uniqueness_constraint
        grounds:
          - "entities.Grantee.fields.tax_id"
          - "validations[priority=11]"
        distinguishing_aspect: "Second grantee with same 9-digit tax_id returns ERR_UNIQUENESS_VIOLATION."
        test_recipe:
          setup: ["grantee with tax_id 111222333 exists"]
          setup_api_calls:
            - call: "POST /grantees"
              payload: { legal_name: "Org One", tax_id: "111222333", irs_subsection: "C3_501" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /grantees"
              payload: { legal_name: "Org Two", tax_id: "111222333", irs_subsection: "GOVERNMENT" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNIQUENESS_VIOLATION"

      - name: grantee_er_flag_computed_from_subsection
        claim_type: computed_field
        grounds:
          - "entities.Grantee.fields.expenditure_responsibility_required"
        distinguishing_aspect: "irs_subsection C3_PRIVATE_FOUNDATION computes expenditure_responsibility_required true; C3_501 computes false; client-supplied value ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /grantees"
              payload: { legal_name: "PF Org", tax_id: "999000111", irs_subsection: "C3_PRIVATE_FOUNDATION" }
              as: ComplianceOfficer
              captures: { er1: $.data.expenditure_responsibility_required }
            - call: "POST /grantees"
              payload: { legal_name: "PC Org", tax_id: "999000222", irs_subsection: "C3_501" }
              as: ComplianceOfficer
              captures: { er2: $.data.expenditure_responsibility_required }
          assert:
            - "Grantee(PF).expenditure_responsibility_required == true"
            - "Grantee(PC).expenditure_responsibility_required == false"

      - name: immutable_asset_lot_has_no_version
        claim_type: immutability
        grounds:
          - "entities.AssetLot"
        distinguishing_aspect: "AssetLot (common_fields: false) exposes id and created_at but no version/updated_at; no update endpoint exists."
        test_recipe:
          setup: ["fund + ACCEPTED-pledge contribution exist"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "Lot Fund", fund_type: "DESIGNATED", endowed: false }
              as: FoundationAdmin
              captures: { lf_id: $.data.id }
            - call: "POST /contributions"
              payload: { fund_id: "${lf_id}", donor_name: "D", asset_kind: "REAL_PROPERTY", declared_value: 80000.00 }
              as: GiftOfficer
              captures: { lc_id: $.data.id }
          trigger:
            - call: "POST /contributions/${lc_id}/lots"
              payload: { description: "Parcel 9", quantity: 1, appraised_value: 80000.00 }
              as: GiftOfficer
              captures: { lot: $.data.id }
          assert:
            - "AssetLot response contains id and created_at"
            - "AssetLot response contains no version field"

      - name: body_fk_reference_must_exist
        claim_type: fk_integrity
        grounds:
          - "entities.Contribution.fields.fund_id"
          - "errors[ERR_REFERENCE_NOT_FOUND]"
        distinguishing_aspect: "POST /contributions with a random fund_id returns ERR_REFERENCE_NOT_FOUND 404 (body-FK existence, priority 4, distinct from path 404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /contributions"
              payload: { fund_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", donor_name: "Ghost", asset_kind: "CASH", declared_value: 100.00 }
              as: GiftOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REFERENCE_NOT_FOUND"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: grant_invalid_transition_draft_to_disburse
        claim_type: invalid_transition
        grounds:
          - "state_machines.GrantRecommendation"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /grants/{id}/disburse while DRAFT fails ERR_INVALID_STATE; no Disbursement created; cash unchanged."
        test_recipe:
          setup: ["fund ACTIVE cash 50000; cleared grantee; grant DRAFT"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "SM Fund", fund_type: "DESIGNATED", endowed: false }
              as: FoundationAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /funds/${sm_id}/agreements"
              payload: { spending_rate_pct: 4.5, spending_formula: "AVERAGE_12Q", fee_tier_schedule: "STANDARD", min_initial_contribution: 10000.00 }
              as: FoundationAdmin
              captures: { sm_ag: $.data.id }
            - call: "POST /agreements/${sm_ag}/execute"
              payload: {}
              as: FoundationAdmin
            - call: "POST /contributions"
              payload: { fund_id: "${sm_id}", donor_name: "Seed", asset_kind: "CASH", declared_value: 50000.00 }
              as: GiftOfficer
              captures: { sm_c: $.data.id }
            - call: "POST /contributions/${sm_c}/accept"
              payload: {}
              as: GiftOfficer
            - call: "POST /funds/${sm_id}/activate"
              payload: {}
              as: FoundationAdmin
            - call: "POST /grantees"
              payload: { legal_name: "SM Org", tax_id: "121212121", irs_subsection: "C3_501" }
              as: ComplianceOfficer
              captures: { sm_g: $.data.id }
            - call: "POST /grantees/${sm_g}/begin-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /grantees/${sm_g}/clear"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /funds/${sm_id}"
              as: FoundationAdmin
              captures: { sm_v: $.data.version }
            - call: "POST /grants"
              payload: { fund_id: "${sm_id}", grantee_id: "${sm_g}", amount: 500.00, purpose: "X", expected_fund_version: "${sm_v}" }
              as: FoundationAdmin
              captures: { sm_gr: $.data.id }
          trigger:
            - call: "POST /grants/${sm_gr}/disburse"
              payload: {}
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Fund.cash_balance == 50000.00; GET /funds/{id}/disbursements returns empty array"

      - name: terminal_state_lockdown_denied_grant
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.GrantRecommendation"
        distinguishing_aspect: "A DENIED grant rejects every further transition (submit/approve/return/deny/cancel/disburse) with ERR_INVALID_STATE."
        test_recipe:
          setup: ["grant in DENIED"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "TL Fund", fund_type: "DESIGNATED", endowed: false }
              as: FoundationAdmin
              captures: { tl_id: $.data.id }
            - call: "POST /funds/${tl_id}/agreements"
              payload: { spending_rate_pct: 4.5, spending_formula: "AVERAGE_12Q", fee_tier_schedule: "STANDARD", min_initial_contribution: 10000.00 }
              as: FoundationAdmin
              captures: { tl_ag: $.data.id }
            - call: "POST /agreements/${tl_ag}/execute"
              payload: {}
              as: FoundationAdmin
            - call: "POST /contributions"
              payload: { fund_id: "${tl_id}", donor_name: "Seed", asset_kind: "CASH", declared_value: 50000.00 }
              as: GiftOfficer
              captures: { tl_c: $.data.id }
            - call: "POST /contributions/${tl_c}/accept"
              payload: {}
              as: GiftOfficer
            - call: "POST /funds/${tl_id}/activate"
              payload: {}
              as: FoundationAdmin
            - call: "POST /grantees"
              payload: { legal_name: "TL Org", tax_id: "343434343", irs_subsection: "C3_501" }
              as: ComplianceOfficer
              captures: { tl_g: $.data.id }
            - call: "POST /grantees/${tl_g}/begin-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /grantees/${tl_g}/clear"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /funds/${tl_id}"
              as: FoundationAdmin
              captures: { tl_v: $.data.version }
            - call: "POST /grants"
              payload: { fund_id: "${tl_id}", grantee_id: "${tl_g}", amount: 500.00, purpose: "Y", expected_fund_version: "${tl_v}" }
              as: FoundationAdmin
              captures: { tl_gr: $.data.id }
            - call: "POST /grants/${tl_gr}/submit"
              payload: {}
              as: FoundationAdmin
            - call: "POST /grants/${tl_gr}/claim-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /grants/${tl_gr}/deny"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /grants/${tl_gr}/submit"
              payload: {}
              as: FoundationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "GrantRecommendation.status remains DENIED"

      - name: contribution_decline_side_effect_records_reason
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Contribution.PLEDGED_to_DECLINED"
        distinguishing_aspect: "Decline stores decline_reason; acceptance_status DECLINED; fund cash untouched."
        test_recipe:
          setup: ["fund PENDING_AGREEMENT; cash contribution PLEDGED"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "Dec Fund", fund_type: "DESIGNATED", endowed: false }
              as: FoundationAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /contributions"
              payload: { fund_id: "${dc_id}", donor_name: "D", asset_kind: "CASH", declared_value: 5000.00 }
              as: GiftOfficer
              captures: { dc_c: $.data.id }
          trigger:
            - call: "POST /contributions/${dc_c}/decline"
              payload: { decline_reason: "Donor restriction unacceptable" }
              as: GiftOfficer
              captures: { st: $.data.acceptance_status, rs: $.data.decline_reason }
          assert:
            - "acceptance_status == DECLINED"
            - "decline_reason == 'Donor restriction unacceptable'"
            - "Fund.cash_balance == 0.00"

      - name: pool_suspend_blocks_buyin
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.InvestmentPool.OPEN_to_SUSPENDED"
          - "errors[ERR_POOL_NOT_OPEN]"
        distinguishing_aspect: "BUY_IN while pool SUSPENDED fails ERR_POOL_NOT_OPEN; MARK_TO_MARKET remains allowed on SUSPENDED pools is NOT asserted (repricing allowed only OPEN per scaffold — assert rejection too)."
        test_recipe:
          setup: ["pool OPEN nav 100000 units 5000; fund ACTIVE cash 20000"]
          setup_api_calls:
            - call: "POST /pools"
              payload: { pool_name: "Susp Pool", pool_kind: "GROWTH", initial_nav: 100000.00, initial_units: 5000.0000 }
              as: InvestmentManager
              captures: { sp_id: $.data.id }
            - call: "POST /funds"
              payload: { fund_name: "Susp Fund", fund_type: "DESIGNATED", endowed: false }
              as: FoundationAdmin
              captures: { sf_id: $.data.id }
            - call: "POST /funds/${sf_id}/agreements"
              payload: { spending_rate_pct: 4.5, spending_formula: "AVERAGE_12Q", fee_tier_schedule: "STANDARD", min_initial_contribution: 10000.00 }
              as: FoundationAdmin
              captures: { sf_ag: $.data.id }
            - call: "POST /agreements/${sf_ag}/execute"
              payload: {}
              as: FoundationAdmin
            - call: "POST /contributions"
              payload: { fund_id: "${sf_id}", donor_name: "Seed", asset_kind: "CASH", declared_value: 20000.00 }
              as: GiftOfficer
              captures: { sf_c: $.data.id }
            - call: "POST /contributions/${sf_c}/accept"
              payload: {}
              as: GiftOfficer
            - call: "POST /funds/${sf_id}/activate"
              payload: {}
              as: FoundationAdmin
            - call: "POST /pools/${sp_id}/suspend"
              payload: {}
              as: InvestmentManager
            - call: "GET /pools/${sp_id}"
              as: InvestmentManager
              captures: { sp_v: $.data.version }
          trigger:
            - call: "POST /pools/${sp_id}/unitization-events"
              payload: { event_kind: "BUY_IN", fund_id: "${sf_id}", cash_amount: 1000.00, expected_pool_version: "${sp_v}" }
              as: InvestmentManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_POOL_NOT_OPEN"

      - name: award_accept_cascades_application
        claim_type: cross_entity_side_effect
        grounds:
          - "state_machines.ScholarshipAward.OFFERED_to_ACCEPTED"
          - "state_machines.ScholarshipApplication.SELECTED_to_ACCEPTED_AWARD"
        distinguishing_aspect: "Award accept moves its application SELECTED -> ACCEPTED_AWARD; decline moves it to DECLINED_AWARD; verify both entities."
        test_recipe:
          setup: ["program AWARDED; one award OFFERED whose application is SELECTED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: FoundationAdmin
            - call: "POST /funds"
              payload: { fund_name: "Aw Fund", fund_type: "SCHOLARSHIP", endowed: false }
              as: FoundationAdmin
              captures: { aw_id: $.data.id }
            - call: "POST /funds/${aw_id}/agreements"
              payload: { spending_rate_pct: 4.5, spending_formula: "AVERAGE_12Q", fee_tier_schedule: "STANDARD", min_initial_contribution: 10000.00 }
              as: FoundationAdmin
              captures: { aw_ag: $.data.id }
            - call: "POST /agreements/${aw_ag}/execute"
              payload: {}
              as: FoundationAdmin
            - call: "POST /contributions"
              payload: { fund_id: "${aw_id}", donor_name: "Seed", asset_kind: "CASH", declared_value: 100000.00 }
              as: GiftOfficer
              captures: { aw_c: $.data.id }
            - call: "POST /contributions/${aw_c}/accept"
              payload: {}
              as: GiftOfficer
            - call: "POST /funds/${aw_id}/activate"
              payload: {}
              as: FoundationAdmin
            - call: "POST /funds/${aw_id}/scholarship-programs"
              payload: { program_name: "Aw Prog", application_open: "2026-02-01T00:00:00Z", application_close: "2026-03-01T00:00:00Z", award_amount: 2500.00, max_awards: 1 }
              as: ProgramOfficer
              captures: { awp_id: $.data.id }
            - call: "POST /programs/${awp_id}/committee-members"
              payload: { member_name: "A One", email: "a1@x.com" }
              as: ProgramOfficer
              captures: { awm1: $.data.id }
            - call: "POST /programs/${awp_id}/committee-members"
              payload: { member_name: "A Two", email: "a2@x.com" }
              as: ProgramOfficer
              captures: { awm2: $.data.id }
            - call: "POST /programs/${awp_id}/committee-members"
              payload: { member_name: "A Three", email: "a3@x.com" }
              as: ProgramOfficer
            - call: "POST /programs/${awp_id}/open"
              payload: {}
              as: ProgramOfficer
            - call: "POST /programs/${awp_id}/applications"
              payload: { applicant_name: "Aw App", applicant_email: "awa@x.com" }
              as: Applicant
              captures: { awapp: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: FoundationAdmin
            - call: "POST /programs/${awp_id}/close-applications"
              payload: {}
              as: ProgramOfficer
            - call: "POST /applications/${awapp}/scores"
              payload: { member_id: "${awm1}", academic: 90, financial_need: 90, essay: 90, interview: 90 }
              as: CommitteeMember
              as_user_id: "${awm1}"
            - call: "POST /applications/${awapp}/scores"
              payload: { member_id: "${awm2}", academic: 90, financial_need: 90, essay: 90, interview: 90 }
              as: CommitteeMember
              as_user_id: "${awm2}"
            - call: "POST /programs/${awp_id}/select-winners"
              payload: { winner_application_ids: ["${awapp}"] }
              as: ProgramOfficer
              captures: { aw_awards: $.data.award_ids }
          trigger:
            - call: "GET /programs/${awp_id}/awards"
              as: ProgramOfficer
              captures: { award1: "$.data[0].id" }
            - call: "POST /awards/${award1}/accept"
              payload: {}
              as: Applicant
              as_user_id: "${awapp}"
              captures: { awst: $.data.status }
            - call: "GET /applications/${awapp}"
              as: ProgramOfficer
              captures: { appst: $.data.status }
          assert:
            - "ScholarshipAward.status == ACCEPTED"
            - "ScholarshipApplication.status == ACCEPTED_AWARD (cascade)"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: spending_allowance_average_12q_correct_result
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_INSUFFICIENT_HISTORY]"
        excluded_because:
          difficulty_instance: dual_variant_calc / spending_allowance_average_12q_vs_fixed_3yr
          rationale: "Correct-result coverage for AVERAGE_12Q and FIXED_3YR asserted there with literals 4666.87 / 4687.50."

      - name: spending_run_insufficient_history
        claim_type: input_set_filtering
        grounds:
          - "calculations.spending_allowance"
          - "errors[ERR_INSUFFICIENT_HISTORY]"
        distinguishing_aspect: "AVERAGE_12Q run with only 11 quarter-end snapshots fails ERR_INSUFFICIENT_HISTORY; adding the 12th succeeds — the input-set count is enforced exactly."
        test_recipe:
          setup: ["fund ACTIVE endowed AVERAGE_12Q; 11 snapshots recorded"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "Hist Fund", fund_type: "DESIGNATED", endowed: true }
              as: FoundationAdmin
              captures: { hf_id: $.data.id }
            - call: "POST /funds/${hf_id}/agreements"
              payload: { spending_rate_pct: 4.5, spending_formula: "AVERAGE_12Q", fee_tier_schedule: "STANDARD", min_initial_contribution: 10000.00 }
              as: FoundationAdmin
              captures: { hf_ag: $.data.id }
            - call: "POST /agreements/${hf_ag}/execute"
              payload: {}
              as: FoundationAdmin
            - call: "POST /contributions"
              payload: { fund_id: "${hf_id}", donor_name: "Seed", asset_kind: "CASH", declared_value: 200000.00 }
              as: GiftOfficer
              captures: { hf_c: $.data.id }
            - call: "POST /contributions/${hf_c}/accept"
              payload: {}
              as: GiftOfficer
            - call: "POST /funds/${hf_id}/activate"
              payload: {}
              as: FoundationAdmin
            - call: "POST /funds/${hf_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2023-06-30T00:00:00Z", market_value: 102000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${hf_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2023-09-30T00:00:00Z", market_value: 98000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${hf_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2023-12-31T00:00:00Z", market_value: 101500.00 }
              as: FinanceOfficer
            - call: "POST /funds/${hf_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2024-03-31T00:00:00Z", market_value: 104000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${hf_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2024-06-30T00:00:00Z", market_value: 99000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${hf_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2024-09-30T00:00:00Z", market_value: 103000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${hf_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2024-12-31T00:00:00Z", market_value: 105500.00 }
              as: FinanceOfficer
            - call: "POST /funds/${hf_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2025-03-31T00:00:00Z", market_value: 107000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${hf_id}/market-value-snapshots"
