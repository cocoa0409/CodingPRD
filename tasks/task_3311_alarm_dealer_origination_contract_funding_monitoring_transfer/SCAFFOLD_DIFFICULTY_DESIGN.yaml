# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3311_alarm_dealer_origination_contract_funding_monitoring_transfer
#
# Machine-readable index of the difficulty features SCAFFOLD.yaml claims to
# exhibit, cross-referenced against the nine Difficulty Rules of §0.5. Every
# instance grounds in elements already declared in §1.1–§1.7. Both this file and
# SCAFFOLD_CORNER_DESIGN.yaml are transcribed verbatim into pytest fixtures by
# the downstream unit-test-generator, so every setup_api_calls chain is a working
# prototype: callable, placeholder-closed, and replayed against §1.2/§1.4/§1.6.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: refund_floor_deferred_monitoring_surplus_vs_deficit
        grounds:
          - calculations.equipment_and_rescission_refund_floor
          - calculations.equipment_and_rescission_refund_floor.variants.surplus_case
          - calculations.equipment_and_rescission_refund_floor.variants.deficit_case
          - entities.Contract.fields.financed_charge_at_apr_cents
          - entities.Dealer.fields.chargeback_balance_due_cents
        distinguishing_aspect: |
          The surplus_case and deficit_case variants of equipment_and_rescission_refund_floor
          compute different adjudication_amount_cents for identical contract inputs, because
          deficit_case forces deferred_monitoring_amount_cents to 0 while surplus_case retains
          the 10% deferral plus the financed charge — so the two variants cannot be reconciled
          to a single number.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
            - "Dealer D1 with holdback_rate 0.10, quality_tier TIER_1."
            - "Customer C1 and Customer C2 registered."
            - "DIRECT contract K1 for C1, ELITE config, credit 700, term 60, financed_charge_at_apr_cents 0, premier address in TX, scheduled 2026-09-02T00:00:00Z."
            - "Installation I1 completed and its monitoring account provisioned so K1 may fund; K1 funded ACTIVE at the logical clock with capex_cents 34900."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alarm-funding/dealers"
              payload: { dealer_code: "D1", legal_name: "Northstar Security LLC", holdback_rate: 0.10, quality_tier: "TIER_1" }
              as: ChannelManager
              captures: { d1_id: $.data.id, d1_v: $.data.version }
            - call: "POST /alarm-funding/customers"
              payload: { full_name: "Casey Owner", email: "casey.owner@example.com", phone: "+15550001001" }
              as: ChannelManager
              captures: { c1_id: $.data.id }
            - call: "POST /alarm-funding/customers"
              payload: { full_name: "Dana Incoming", email: "dana.incoming@example.com", phone: "+15550001002" }
              as: ChannelManager
              captures: { c2_id: $.data.id }
            - call: "POST /alarm-funding/contracts"
              payload: { customer_id: "${c1_id}", equipment_config_code: "ELITE", credit_score: 700, contract_term_months: 60, monthly_monitoring_cents: 4999, financed_charge_at_apr_cents: 0, premises_address_line: "10 Elm St", premises_city: "Dallas", premises_state_code: "TX", premises_postal_code: "75001", installation_scheduled_at: "2026-09-02T00:00:00Z", installation_duration_minutes: 180, installation_engineer_id: "ENG-1" }
              as: ChannelManager
              captures: { k1_id: $.data.id }
            - call: "GET /alarm-funding/monitoring-accounts"
              payload: { contract_id: "${k1_id}" }
              as: MonitoringOperator
              captures: { ma1_id: "$.data[0].id" }
            - call: "POST /alarm-funding/monitoring-transfers/${ma1_id}/trigger"
              payload: {}
              as: MonitoringOperator
            - call: "GET /alarm-funding/installations"
              payload: { contract_id: "${k1_id}" }
              as: ServiceCoordinator
              captures: { i1_id: "$.data[0].id" }
            - call: "POST /alarm-funding/installations/${i1_id}/complete"
              payload: {}
              as: ServiceCoordinator
            - call: "GET /alarm-funding/contracts/${k1_id}"
              payload: {}
              as: FundingAnalyst
              captures: { k1_v: $.data.version }
            - call: "POST /alarm-funding/contracts/${k1_id}/fund"
              payload: { expected_contract_version: "${k1_v}" }
              as: FundingAnalyst
          trigger:
            - call: "POST /alarm-funding/rescission-requests"
              payload: { contract_id: "${k1_id}", operator_id: "ops-requestor-1" }
              as: Customer
              as_user_id: "${c1_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /alarm-funding/rescission-requests/${rr_id}/decision"
              payload: { outcome: "APPROVED" }
              as: ComplianceOfficer
              as_user_id: "ops-approver-1"
              captures: { rr_status: $.data.request_status }
          assert:
            - "the surplus_case adjudication_amount_cents == 5235"
            - "the deficit_case adjudication_amount_cents == 1745"
            - "the two variants differ by 3490 cents on identical contract inputs"

      - name: dealer_chargeback_rate_inadvertent_alarm_dependent
        grounds:
          - calculations.dealer_chargeback_rate
          - entities.Contract.cancelled_from_status
          - entities.Contract.fields.activated_at
          - entities.Dealer.fields.chargeback_rate_12mo_sum
        distinguishing_aspect: |
          The D numerator of dealer_chargeback_rate counts only cancellations whose ACTIVE
          interval contains a verified alarm, so an identical cancellation count yields two
          different dealer chargeback_rate_percent values depending on whether each
          cancelled contract carries a counted_for_false_alarm AlarmEvent.
          This instance pins that a single cancelled contract with a verified alarm reads
          chargeback_rate_12mo_sum == 1 where the same cancellation without one reads 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
            - "Dealer D2 with holdback_rate 0.10, quality_tier TIER_2."
            - "Contract K2 funded ACTIVE at 2026-07-10T00:00:00Z under package P2; exactly one INADVERTENT alarm verified on its account before cancellation."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alarm-funding/dealers"
              payload: { dealer_code: "D2", legal_name: "Bugle Alarm Partners", holdback_rate: 0.10, quality_tier: "TIER_2" }
              as: ChannelManager
              captures: { d2_id: $.data.id, d2_v: $.data.version }
            - call: "POST /alarm-funding/customers"
              payload: { full_name: "Rae Subscriber", email: "rae.subscriber@example.com", phone: "+15550001003" }
              as: ChannelManager
              captures: { c3_id: $.data.id }
            - call: "POST /alarm-funding/dealer-packages"
              payload: { package_reference: "PKG-P2", dealer_id: "${d2_id}" }
              as: FundingAnalyst
              captures: { p2_id: $.data.id }
            - call: "POST /alarm-funding/dealer-packages/${p2_id}/contracts"
              payload: { customer_id: "${c3_id}", equipment_config_code: "PREMIUM", credit_score: 700, contract_term_months: 60, monthly_monitoring_cents: 4999, premises_address_line: "20 Oak St", premises_city: "Tulsa", premises_state_code: "OK", premises_postal_code: "74101", installation_scheduled_at: "2026-07-10T00:00:00Z", installation_engineer_id: "ENG-2" }
              as: FundingAnalyst
              captures: { k2_id: $.data.id }
            - call: "GET /alarm-funding/monitoring-accounts"
              payload: { contract_id: "${k2_id}" }
              as: MonitoringOperator
              captures: { ma2_id: "$.data[0].id" }
            - call: "POST /alarm-funding/monitoring-transfers/${ma2_id}/trigger"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-funding/dealer-packages/${p2_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${d2_id}"
            - call: "GET /alarm-funding/dealer-packages/${p2_id}"
              payload: {}
              as: FundingAnalyst
              captures: { p2_v: $.data.version }
            - call: "POST /alarm-funding/dealer-packages/${p2_id}/approve"
              payload: { expected_dealer_package_version: "${p2_v}" }
              as: FundingAnalyst
              captures: { p2_v2: $.data.version }
            - call: "POST /alarm-funding/dealer-packages/${p2_id}/fund"
              payload: { expected_dealer_package_version: "${p2_v2}" }
              as: FundingAnalyst
            - call: "POST /alarm-funding/alarm-events"
              payload: { monitoring_account_id: "${ma2_id}", signal_source: "ZONE-3", occurred_at: "2026-07-15T00:00:00Z", entered_at_utc: "2026-07-15T00:00:30Z" }
              as: MonitoringOperator
              captures: { ae2_id: $.data.id }
            - call: "POST /alarm-funding/alarm-events/${ae2_id}/verification"
              payload: { outcome: "VERIFIED" }
              as: MonitoringOperator
            - call: "POST /alarm-funding/contracts/${k2_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c3_id}"
              captures: { k2_v: $.data.version }
          trigger:
            - call: "POST /alarm-funding/dealers/${d2_id}/chargeback-rate-recompute"
              payload: { expected_dealer_version: "${d2_v}" }
              as: FundingAnalyst
          assert:
            - "Dealer.${d2_id}.funding_package_count_12mo == 1"
            - "Dealer.${d2_id}.chargeback_rate_12mo_sum == 1"
            - "Dealer.${d2_id}.standing == ACTIVE"
            - "the same dealer without the verified alarm would report chargeback_rate_12mo_sum == 0, so the two readings differ by exactly 1"
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: equipment_financing_split_incremental_residual_reconciliation
        grounds:
          - calculations.equipment_financing_split
          - calculations.equipment_financing_split.variants.disclosure_snapshot
          - entities.Contract.fields.equipment_payment_cents
          - entities.Contract.fields.equipment_financed_cents
        distinguishing_aspect: |
          equipment_financing_split rounds each monthly installment to cents and then
          multiplies by the term (mode (b), nested rounding where order matters), whereas
          the disclosure_snapshot variant re-derives equipment_payment_cents for a term that
          changed after funding — the two paths settle different total_of_payments_cents for
          the same funded equipment balance, so the reconciliation amount is load-bearing.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
            - "DIRECT contract K4 for C4, BASE config, credit 700, term 36, financed 0."
            - "K4 funded ACTIVE with capex_cents 14900 and equipment_financed_cents 182 (rounded per-installment)."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alarm-funding/customers"
              payload: { full_name: "Kirby Base", email: "kirby.base@example.com", phone: "+15550001004" }
              as: ChannelManager
              captures: { c4_id: $.data.id }
            - call: "POST /alarm-funding/contracts"
              payload: { customer_id: "${c4_id}", equipment_config_code: "BASE", credit_score: 700, contract_term_months: 36, monthly_monitoring_cents: 3999, financed_charge_at_apr_cents: 0, premises_address_line: "30 Pine St", premises_city: "Norman", premises_state_code: "OK", premises_postal_code: "73019", installation_scheduled_at: "2026-09-02T00:00:00Z", installation_engineer_id: "ENG-4" }
              as: ChannelManager
              captures: { k4_id: $.data.id }
            - call: "GET /alarm-funding/monitoring-accounts"
              payload: { contract_id: "${k4_id}" }
              as: MonitoringOperator
              captures: { ma4_id: "$.data[0].id" }
            - call: "POST /alarm-funding/monitoring-transfers/${ma4_id}/trigger"
              payload: {}
              as: MonitoringOperator
            - call: "GET /alarm-funding/installations"
              payload: { contract_id: "${k4_id}" }
              as: ServiceCoordinator
              captures: { i4_id: "$.data[0].id" }
            - call: "POST /alarm-funding/installations/${i4_id}/complete"
              payload: {}
              as: ServiceCoordinator
            - call: "GET /alarm-funding/contracts/${k4_id}"
              payload: {}
              as: FundingAnalyst
              captures: { k4_v: $.data.version }
            - call: "POST /alarm-funding/contracts/${k4_id}/fund"
              payload: { expected_contract_version: "${k4_v}" }
              as: FundingAnalyst
          trigger:
            - call: "GET /alarm-funding/contracts/${k4_id}"
              payload: {}
              as: FundingAnalyst
              captures: { k4_eq: $.data.equipment_financed_cents, k4_pay: $.data.equipment_payment_cents }
          assert:
            - "Contract.${k4_id}.equipment_financed_cents == 182"
            - "Contract.${k4_id}.equipment_payment_cents == 5"
            - "the funded total_of_payments_cents == 5 * 36 and equals 180, NOT round(182/36) taken after summation"
            - "the disclosure_snapshot variant for a 24-month term reports equipment_payment_cents == 8 and total_of_payments_cents == 192, so the two paths differ by 12"

      - name: post_warranty_sweep_holdback_waterfall_cash_balance_cascade
        grounds:
          - calculations.post_warranty_service_sweep
          - calculations.post_warranty_service_sweep.variants.post_warranty_cancel
          - calculations.dealer_standing_derivation
          - entities.Dealer.fields.holdback_reserve_cents
          - entities.Dealer.fields.chargeback_balance_due_cents
        distinguishing_aspect: |
          post_warranty_service_sweep distributes a rounded draw across a fixed bucket order
          (mode (a), a conditional formula whose branch depends on the dealer's remaining
          holdback), so the same visit produces either HOLDBACK_ONLY or CASH depending on the
          reserve balance — and the CASH branch then cascades into
          Dealer.chargeback_balance_due_cents, which re-derives Dealer.standing.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
            - "Dealer D1 (holdback_rate 0.10) with a funded PREMIUM contract K3 under package P3, activated_at 2026-09-01T00:00:00Z, so the warranty window ends 2027-03-01T00:00:00Z."
            - "A Post-Warranty Dealer-Billable visit scheduled at 2027-06-15T00:00:00Z exceeds the warranty window."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alarm-funding/dealers"
              payload: { dealer_code: "D1", legal_name: "Northstar Security LLC", holdback_rate: 0.10, quality_tier: "TIER_1" }
              as: ChannelManager
              captures: { d1_id: $.data.id }
            - call: "POST /alarm-funding/customers"
              payload: { full_name: "Marlow Premium", email: "marlow.premium@example.com", phone: "+15550001005" }
              as: ChannelManager
              captures: { c5_id: $.data.id }
            - call: "POST /alarm-funding/dealer-packages"
              payload: { package_reference: "PKG-P3", dealer_id: "${d1_id}" }
              as: FundingAnalyst
              captures: { p3_id: $.data.id }
            - call: "POST /alarm-funding/dealer-packages/${p3_id}/contracts"
              payload: { customer_id: "${c5_id}", equipment_config_code: "PREMIUM", credit_score: 700, contract_term_months: 60, monthly_monitoring_cents: 4999, financed_charge_at_apr_cents: 0, premises_address_line: "40 Cedar St", premises_city: "Dallas", premises_state_code: "TX", premises_postal_code: "75002", installation_scheduled_at: "2026-09-02T00:00:00Z", installation_engineer_id: "ENG-1" }
              as: FundingAnalyst
              captures: { k3_id: $.data.id }
            - call: "GET /alarm-funding/monitoring-accounts"
              payload: { contract_id: "${k3_id}" }
              as: MonitoringOperator
              captures: { ma3_id: "$.data[0].id" }
            - call: "POST /alarm-funding/monitoring-transfers/${ma3_id}/trigger"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-funding/dealer-packages/${p3_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${d1_id}"
            - call: "GET /alarm-funding/dealer-packages/${p3_id}"
              payload: {}
              as: FundingAnalyst
              captures: { p3_v: $.data.version }
            - call: "POST /alarm-funding/dealer-packages/${p3_id}/approve"
              payload: { expected_dealer_package_version: "${p3_v}" }
              as: FundingAnalyst
              captures: { p3_v2: $.data.version }
            - call: "POST /alarm-funding/dealer-packages/${p3_id}/fund"
              payload: { expected_dealer_package_version: "${p3_v2}" }
              as: FundingAnalyst
            - call: "POST /alarm-funding/service-visits"
              payload: { contract_id: "${k3_id}", scheduled_at: "2027-06-15T00:00:00Z", work_type: "WARRANTY_REPAIR", technician_id: "TECH-1" }
              as: ServiceCoordinator
              captures: { sv_id: $.data.id }
            - call: "POST /alarm-funding/service-visits/${sv_id}/schedule"
              payload: { scheduled_at: "2027-06-15T00:00:00Z" }
              as: ServiceCoordinator
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /alarm-funding/service-visits/${sv_id}/perform"
              payload: {}
              as: ServiceCoordinator
              captures: { billed: $.data.billed_cents, route: $.data.billing_route, sweep: $.data.dealer_sweep_cents }
          assert:
            - "ServiceVisit.${sv_id}.billing_route == DEALER_HOLDBACK and billed_cents == 89"
            - "the draw == round(0.20 * post_warranty_cents) == 14940"
            - "Dealer.${d1_id}.holdback_reserve_cents == 0 after the sweep (the 2490 holdback is fully drawn)"
            - "Dealer.${d1_id}.chargeback_balance_due_cents == 14940 - 2490 == 12450"
            - "Dealer.${d1_id}.standing == ACTIVE because 12450 does not exceed the 500000 suspend threshold"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: assumption_request_failed_negotiation_round_cycle
        grounds:
          - state_machines.AssumptionRequest.transitions.PENDING_NEGOTIATION_to_PENDING_NEGOTIATION
          - state_machines.AssumptionRequest.transitions.PENDING_NEGOTIATION_to_REJECTED
          - state_machines.AssumptionRequest.transitions.ACCEPTED_to_PENDING_NEGOTIATION
          - endpoints.POST_/alarm-funding/assumption-requests/{id}/reject
        distinguishing_aspect: |
          AssumptionRequest is cyclic, not linear: two reject rounds from PENDING_NEGOTIATION
          return to PENDING_NEGOTIATION while the third transitions to the terminal REJECTED,
          and an ACCEPTED round that is rejected re-enters PENDING_NEGOTIATION rather than
          terminating — the negotiation can loop arbitrarily before it closes.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
            - "Contract K5 ACTIVE under C6 with an intent to relocate to an out-of-radius state."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alarm-funding/customers"
              payload: { full_name: "Nico Relocator", email: "nico.relocator@example.com", phone: "+15550001006" }
              as: ChannelManager
              captures: { c6_id: $.data.id }
            - call: "POST /alarm-funding/customers"
              payload: { full_name: "Wallis Incoming", email: "wallis.incoming@example.com", phone: "+15550001007" }
              as: ChannelManager
              captures: { c7_id: $.data.id }
            - call: "POST /alarm-funding/contracts"
              payload: { customer_id: "${c6_id}", equipment_config_code: "PREMIUM", credit_score: 700, contract_term_months: 60, monthly_monitoring_cents: 4999, financed_charge_at_apr_cents: 0, premises_address_line: "50 Birch St", premises_city: "Tulsa", premises_state_code: "OK", premises_postal_code: "74102", installation_scheduled_at: "2026-09-02T00:00:00Z", installation_engineer_id: "ENG-2" }
              as: ChannelManager
              captures: { k5_id: $.data.id }
            - call: "GET /alarm-funding/monitoring-accounts"
              payload: { contract_id: "${k5_id}" }
              as: MonitoringOperator
              captures: { ma5_id: "$.data[0].id" }
            - call: "POST /alarm-funding/monitoring-transfers/${ma5_id}/trigger"
              payload: {}
              as: MonitoringOperator
            - call: "GET /alarm-funding/installations"
              payload: { contract_id: "${k5_id}" }
              as: ServiceCoordinator
              captures: { i5_id: "$.data[0].id" }
            - call: "POST /alarm-funding/installations/${i5_id}/complete"
              payload: {}
              as: ServiceCoordinator
            - call: "GET /alarm-funding/contracts/${k5_id}"
              payload: {}
              as: FundingAnalyst
              captures: { k5_v: $.data.version }
            - call: "POST /alarm-funding/contracts/${k5_id}/fund"
              payload: { expected_contract_version: "${k5_v}" }
              as: FundingAnalyst
            - call: "POST /alarm-funding/assumption-requests"
              payload: { contract_id: "${k5_id}", incoming_customer_id: "${c7_id}", incoming_credit_score: 700, residence_state_code: "AZ" }
              as: Customer
              as_user_id: "${c6_id}"
              captures: { ar_id: $.data.id }
          trigger:
            - call: "POST /alarm-funding/assumption-requests/${ar_id}/reject"
              payload: {}
              as: FundingAnalyst
              captures: { rc1: $.data.rejection_count, st1: $.data.request_status }
            - call: "POST /alarm-funding/assumption-requests/${ar_id}/reject"
              payload: {}
              as: FundingAnalyst
              captures: { rc2: $.data.rejection_count, st2: $.data.request_status }
            - call: "POST /alarm-funding/assumption-requests/${ar_id}/reject"
              payload: {}
              as: FundingAnalyst
              captures: { rc3: $.data.rejection_count, st3: $.data.request_status }
          assert:
            - "first reject reads rejection_count == 1 and request_status == PENDING_NEGOTIATION"
            - "second reject reads rejection_count == 2 and request_status == PENDING_NEGOTIATION"
            - "third reject reads rejection_count == 3 and request_status == REJECTED (terminal)"
            - "AssumptionRequest.${ar_id}.request_status == REJECTED"

      - name: dispatch_request_branch_divergent_guards
        grounds:
          - state_machines.DispatchRequest.transitions.REQUESTED_to_DISPATCHED
          - state_machines.DispatchRequest.transitions.DISPATCHED_to_ABORTED
          - state_machines.DispatchRequest.transitions.REQUESTED_to_CLOSED
          - state_machines.DispatchRequest.transitions.DISPATCHED_to_COMPLETED
          - entities.DispatchRequest.fields.dispatch_status
        distinguishing_aspect: |
          DispatchRequest forks from REQUESTED into two terminal families (DISPATCH then
          ABORT-or-COMPLETE, or immediate CLOSE), and each family applies a different guard —
          the abort guard is time-gated and mass-cancel gated while the close branch is not —
          so the shape is fork-with-divergent-guards, not a pipeline.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
            - "Monitoring account MA6 PROVISIONED with two PENDING alarm events."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alarm-funding/customers"
              payload: { full_name: "Ona Dispatcher", email: "ona.dispatcher@example.com", phone: "+15550001008" }
              as: ChannelManager
