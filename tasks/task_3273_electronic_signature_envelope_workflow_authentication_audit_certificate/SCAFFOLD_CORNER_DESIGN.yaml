              as: Account
              as_user_id: "${acct_id}"
              captures: { tpl_id: $.data.id }
            - call: "POST /esign/templates/${tpl_id}/publish"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/bulk-sends"
              payload: { account_id: "${acct_id}", template_id: "${tpl_id}", total_rows: 2 }
              as: Account
              as_user_id: "${acct_id}"
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /esign/bulk-sends/${batch_id}/process"
              payload: { rows: [{ email: "ok@example.com" }, { email: "bad-email" }] }
              as: Account
              as_user_id: "${acct_id}"
              captures: { batch_status: $.data.status, succ: $.data.succeeded_count, fail: $.data.failed_count }
          assert:
            - "BulkSendBatch.${batch_id}.status == \"PARTIAL\""
            - "BulkSendBatch.${batch_id}.succeeded_count == 1"
            - "BulkSendBatch.${batch_id}.failed_count == 1"
