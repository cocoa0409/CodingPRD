scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: package_cost_budgetary_versus_firm_on_same_package
        grounds:
          - calculations.equipment_package_cost
          - entities.EquipmentPackage.fields.budgetary_cost_cents
          - entities.EquipmentPackage.fields.firm_cost_cents
          - entities.EquipmentPackage.fields.cost_variance_pct
          - entities.EquipmentPackage.fields.variance_flag
          - state_machines.EquipmentPackage.IN_REVIEW_to_APPROVED
        distinguishing_aspect: |
          The two variants live on EquipmentPackage and diverge because BUDGETARY substitutes
          MATERIAL_FACTOR_NOMINAL (1.0) for the selected MaterialSpec.cost_index (1.10) while FIRM
          applies it: for identical package data budgetary_cost_cents == 260832000 and
          firm_cost_cents == 286915200, a pinned delta of exactly 26083200 cents.
        test_recipe:
          setup:
            - "logical clock left at its startup value 2026-08-01T00:00:00.000Z"
            - "MaterialSpec MAT-316L with cost_index 1.10, awwa_compliant true, max_pressure_psig 300"
            - "ProcessTechnology TECH-FILT-A: FILTRATION, unit_capex_cents_per_mgd 40000000, footprint_sf_per_mgd 900, requires_code_stamp AWWA, chemical_service_class NEUTRAL"
            - "Project with footprint_allowance_sf_per_stage 6000, one ACCEPTED influent profile at design_flow_mgd 4.000 / peak_factor 1.500, one ACTIVE TURBIDITY_NTU objective"
            - "one SELECTED FILTRATION TreatmentStage at design_flow_mgd 6.000 with equipment_base_cost_cents 240000000"
            - "one EquipmentPackage F-100 in IN_REVIEW at design_pressure_psig 150, designed by user eng-1"
          setup_api_calls:
            - call: "POST /water-treatment/material-specs"
              payload: { code: "MAT-316L", max_chloride_ppm: 200.0, max_temp_c: 80.0, max_pressure_psig: 300, ph_min: 4.0, ph_max: 11.0, asme_u_capable: true, nsf61_certified: true, awwa_compliant: true, cost_index: 1.10, service_classes_allowed: ["NEUTRAL", "CHLORINATED", "CAUSTIC"] }
              as: PlatformAdmin
              captures: { mat_316l_id: "$.data.id" }
            - call: "POST /water-treatment/process-technologies"
              payload: { code: "TECH-FILT-A", name: "Submerged MF membrane rack", role: "FILTRATION", max_feed_turbidity_ntu: 50.0, max_feed_tds_mg_l: 3000.0, min_design_flow_mgd: 0.500, max_design_flow_mgd: 20.000, unit_capex_cents_per_mgd: 40000000, energy_kwh_per_mg: 250.0, footprint_sf_per_mgd: 900.0, requires_code_stamp: "AWWA", chemical_service_class: "NEUTRAL", consumable_item_code: "MF-ELEM-8", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { tech_filt_id: "$.data.id" }
            - call: "POST /water-treatment/projects"
              payload: { name: "Northgate WTP Membrane Upgrade", owner_agency_name: "City of Northgate", procurement_type: "MUNICIPAL_BID", bid_due_at: "2026-09-15T00:00:00.000Z", guarantee_deadline_at: "2027-06-30T00:00:00.000Z", footprint_allowance_sf_per_stage: 6000.0 }
              as: ContractsAdministrator
              as_user_id: "ca-1"
              captures: { proj_id: "$.data.id" }
            - call: "POST /water-treatment/projects/${proj_id}/influent-profiles"
              payload: { sample_label: "RAW-2026-07", design_flow_mgd: 4.000, peak_factor: 1.500, turbidity_ntu: 12.0, tds_mg_l: 800.0, toc_mg_l: 3.2, chloride_mg_l: 150.0, temperature_c: 22.0, ph: 7.4 }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { prof_id: "$.data.id" }
            - call: "POST /water-treatment/influent-profiles/${prof_id}/qa-decision"
              payload: { decision: "ACCEPT", qa_note: "Composite of four grab samples" }
              as: QualityEngineer
              as_user_id: "qa-1"
            - call: "POST /water-treatment/projects/${proj_id}/treatment-objectives"
              payload: { parameter: "TURBIDITY_NTU", limit_value: 0.300, basis: "MAX_DAY", regulatory_driver: "40 CFR 141.73 SWTR" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /water-treatment/projects/${proj_id}/process-selection"
              payload: {}
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { stage_filt_id: "$.data[0].id" }
            - call: "POST /water-treatment/treatment-stages/${stage_filt_id}/equipment-packages"
              payload: { material_spec_id: "${mat_316l_id}", tag_number: "F-100", design_pressure_psig: 150, design_temp_c: 30.0 }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { pkg_f_id: "$.data.id", pkg_f_budgetary: "$.data.budgetary_cost_cents" }
            - call: "POST /water-treatment/equipment-packages/${pkg_f_id}/submit-for-review"
              payload: { submittal_note: "Rev 0 for review" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
          trigger:
            - call: "POST /water-treatment/equipment-packages/${pkg_f_id}/review-decision"
              payload: { decision: "APPROVE", review_note: "Hydraulics and materials accepted" }
              as: DesignReviewer
              as_user_id: "rev-1"
          assert:
            - "EquipmentPackage.${pkg_f_id}.budgetary_cost_cents == 260832000"
            - "EquipmentPackage.${pkg_f_id}.firm_cost_cents == 286915200"
            - "EquipmentPackage.${pkg_f_id}.firm_cost_cents - EquipmentPackage.${pkg_f_id}.budgetary_cost_cents == 26083200"
            - "EquipmentPackage.${pkg_f_id}.cost_variance_pct == 0.1000"
            - "EquipmentPackage.${pkg_f_id}.variance_flag == false"
            - "EquipmentPackage.${pkg_f_id}.status == APPROVED"
            - "TreatmentStage.${stage_filt_id}.status == ENGINEERED"
            - "Project.${proj_id}.delivery_posture == ON_TRACK"
      - name: reserve_draw_accrual_versus_settled_on_membrane_replacement
        grounds:
          - calculations.service_reserve_balance
          - entities.ConsumableDraw.fields.accrual_amount_cents
          - entities.ConsumableDraw.fields.settled_amount_cents
          - entities.ConsumableDraw.fields.warranty_credit_cents
          - entities.ServiceAgreement.fields.reserve_committed_accrual_cents
          - entities.ServiceAgreement.fields.reserve_committed_settled_cents
          - entities.ServiceAgreement.fields.settlement_variance_cents
        distinguishing_aspect: |
          A different entity domain from the package-cost pair: the two variants live on
          ConsumableDraw / ServiceAgreement, and they diverge on THREE structural axes rather than a
          single factor - catalog versus invoiced unit cost, CONSUMABLE_MARKUP_PCT (0.22) versus
          FREIGHT_PCT (0.065), and a prorated membrane warranty credit that only the SETTLED line
          subtracts - so accrual_amount_cents == 2196000 while settled_amount_cents == 930000, and
          only the ACCRUAL line moves reserve_available_cents.
        test_recipe:
          setup:
            - "logical clock left at its startup value 2026-08-01T00:00:00.000Z"
            - "the full single-stage delivery chain driven to Project.status SERVICE_ACTIVE"
            - "one ServiceAgreement with reserve_funded_cents 12200000, membrane_installed_at 2026-08-01T00:00:00.000Z, status ACTIVE and reserve_available_cents 12200000"
            - "no ConsumableDraw rows exist yet"
          setup_api_calls:
            - call: "POST /water-treatment/material-specs"
              payload: { code: "MAT-316L", max_chloride_ppm: 200.0, max_temp_c: 80.0, max_pressure_psig: 300, ph_min: 4.0, ph_max: 11.0, asme_u_capable: true, nsf61_certified: true, awwa_compliant: true, cost_index: 1.10, service_classes_allowed: ["NEUTRAL", "CHLORINATED", "CAUSTIC"] }
              as: PlatformAdmin
              captures: { mat_316l_id: "$.data.id" }
            - call: "POST /water-treatment/process-technologies"
              payload: { code: "TECH-FILT-A", name: "Submerged MF membrane rack", role: "FILTRATION", max_feed_turbidity_ntu: 50.0, max_feed_tds_mg_l: 3000.0, min_design_flow_mgd: 0.500, max_design_flow_mgd: 20.000, unit_capex_cents_per_mgd: 40000000, energy_kwh_per_mg: 250.0, footprint_sf_per_mgd: 900.0, requires_code_stamp: "AWWA", chemical_service_class: "NEUTRAL", consumable_item_code: "MF-ELEM-8", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { tech_filt_id: "$.data.id" }
            - call: "POST /water-treatment/test-bays"
              payload: { bay_code: "BAY-1", max_skid_footprint_sf: 6000.0, changeover_buffer_minutes: 120, crane_capacity_tons: 40.0, status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { bay1_id: "$.data.id" }
            - call: "POST /water-treatment/projects"
              payload: { name: "Northgate WTP Membrane Upgrade", owner_agency_name: "City of Northgate", procurement_type: "MUNICIPAL_BID", bid_due_at: "2026-09-15T00:00:00.000Z", guarantee_deadline_at: "2027-06-30T00:00:00.000Z", footprint_allowance_sf_per_stage: 6000.0 }
              as: ContractsAdministrator
              as_user_id: "ca-1"
              captures: { proj_id: "$.data.id" }
            - call: "POST /water-treatment/projects/${proj_id}/influent-profiles"
              payload: { sample_label: "RAW-2026-07", design_flow_mgd: 4.000, peak_factor: 1.500, turbidity_ntu: 12.0, tds_mg_l: 800.0, toc_mg_l: 3.2, chloride_mg_l: 150.0, temperature_c: 22.0, ph: 7.4 }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { prof_id: "$.data.id" }
            - call: "POST /water-treatment/influent-profiles/${prof_id}/qa-decision"
              payload: { decision: "ACCEPT" }
              as: QualityEngineer
              as_user_id: "qa-1"
            - call: "POST /water-treatment/projects/${proj_id}/treatment-objectives"
              payload: { parameter: "TURBIDITY_NTU", limit_value: 0.300, basis: "MAX_DAY", regulatory_driver: "40 CFR 141.73 SWTR" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /water-treatment/projects/${proj_id}/process-selection"
              payload: {}
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { stage_filt_id: "$.data[0].id" }
            - call: "POST /water-treatment/treatment-stages/${stage_filt_id}/equipment-packages"
              payload: { material_spec_id: "${mat_316l_id}", tag_number: "F-100", design_pressure_psig: 150, design_temp_c: 30.0 }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { pkg_f_id: "$.data.id" }
            - call: "POST /water-treatment/equipment-packages/${pkg_f_id}/submit-for-review"
              payload: {}
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /water-treatment/equipment-packages/${pkg_f_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: DesignReviewer
              as_user_id: "rev-1"
            - call: "POST /water-treatment/or-equal-submittals"
              payload: { project_id: "${proj_id}", spec_section: "11 21 13", named_basis_of_design: "Acme MF-6" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { sub_id: "$.data.id", sub_v0: "$.data.version" }
            - call: "POST /water-treatment/or-equal-submittals/${sub_id}/spec-deviations"
