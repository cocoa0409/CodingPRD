# =============================================================================
# Task 0042 — Data Annotation Crowdsourcing Platform (SCAFFOLD)
# Generated from scenario description only; no sibling tasks consulted.
# =============================================================================

scenario: |
  Data annotation crowdsourcing platform: project creation with annotation-task
  type definition (classification/bounding-box/segmentation/keypoint/text-NER/
  audio-transcription), annotation guideline document, sample data preview,
  golden-sample preparation, and pricing strategy; task splitting and
  distribution with batch task splitting rules, single-package size
  configuration, task-pool and grabbing/dispatch hybrid modes,
  annotator-tier-based task allocation, and re-distribution on timeout;
  annotator qualification grading with entry test, tier classification
  (junior/senior/expert), domain-skill tagging, periodic re-evaluation, and
  demotion-and-suspension rules; quality inspection sampling with random
  sampling rate by tier, golden-sample insertion, full inspection for low-tier
  annotators, multi-round inspection, and rework dispatch; annotation
  consistency calculation with multi-annotator agreement metrics
  (Kappa/IoU/F1), majority voting and expert arbitration, low-consistency task
  isolation, and annotator-pair consistency analysis; piece-rate salary with
  unit price by task type and difficulty, pass-rate-based bonus and penalty,
  payout cycle, withholding for re-inspection period, and tax handling;
  dispute arbitration with annotator-submitted appeal, expert review, decision
  and salary adjustment, repeated-dispute pattern detection, and arbitration
  record archiving; event-driven synchronization with payment, IM, and
  storage systems; audit logging for task status and salary adjustments.

domain_name: data-annotation-crowdsourcing
api_prefix: /annotation-projects

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - tiered_pricing
    - cascading_side_effects
    - rate_threshold_triggers
    - selector_policy
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: AnnotationProject
    parent: null
    common_fields: true
    fields:
      - { name: project_name, type: string, source: input, description: "Human-readable project name" }
      - { name: task_type, type: enum, source: input, description: "Annotation task type", constraints: "one of CLASSIFICATION | BBOX | SEGMENTATION | KEYPOINT | TEXT_NER | AUDIO_TRANSCRIPTION" }
      - { name: difficulty, type: enum, source: input, description: "Project difficulty band", constraints: "one of EASY | MEDIUM | HARD" }
      - { name: guideline_doc_url, type: string, source: input, description: "URL to the annotation guideline document; required at creation" }
      - { name: sample_preview_urls, type: array, source: input, description: "Non-empty list of sample data preview URLs shown to annotators" }
      - { name: package_size, type: integer, source: input, description: "Number of items per TaskPackage when splitting", constraints: "integer in [10, 500]" }
      - { name: distribution_mode, type: enum, source: input, description: "How packages are claimed", constraints: "one of GRAB | DISPATCH | HYBRID" }
      - { name: unit_price_cents, type: integer, source: input, description: "Base unit price per item in cents at EASY difficulty" }
      - { name: pass_rate_target, type: number, source: input, description: "Target pass rate for bonus computation, e.g. 0.90", constraints: "0 < value <= 1" }
      - { name: timeout_seconds, type: integer, source: input, description: "Per-package timeout before redistribution", default: 86400 }
      - { name: golden_sample_count, type: integer, source: computed, description: "Count of GoldenSample rows on this project" }
      - { name: status, type: enum, source: system, description: "Project lifecycle", constraints: "DRAFT → OPEN → CLOSED → ARCHIVED" }

  - name: GoldenSample
    parent: AnnotationProject
    common_fields: false
    fields:
      - { name: project_id, type: string, source: system, description: "Owning project id" }
      - { name: payload_url, type: string, source: input, description: "URL to the golden item content" }
      - { name: expected_label, type: object, source: input, description: "Ground-truth label payload used to score golden hits" }

  - name: TaskPackage
    parent: AnnotationProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "Owning project id" }
      - { name: batch_no, type: integer, source: system, description: "1-based batch number assigned by the splitter" }
      - { name: item_count, type: integer, source: system, description: "Items in this package; equals project.package_size except possibly the last batch" }
      - { name: golden_inserted_count, type: integer, source: computed, description: "Number of GoldenSample items injected into this package" }
      - { name: assigned_annotator_id, type: string, source: system, description: "AnnotatorProfile.id currently holding the package; null when in POOL", default: null }
      - { name: claimed_at, type: datetime, source: system, description: "When the current annotator claimed/was dispatched the package; null when in POOL" }
      - { name: deadline_at, type: datetime, source: computed, description: "claimed_at + project.timeout_seconds; null when in POOL" }
      - { name: rework_round, type: integer, source: computed, description: "Number of completed rework cycles for this package", default: 0 }
      - { name: tier_required, type: enum, source: system, description: "Minimum tier eligible at claim time", constraints: "one of JUNIOR | SENIOR | EXPERT" }
      - { name: status, type: enum, source: system, description: "Package lifecycle", constraints: "POOL → IN_PROGRESS → SUBMITTED → INSPECTING → {APPROVED | REWORK_PENDING | ARBITRATING} ; REWORK_PENDING → IN_PROGRESS (cycle); ARBITRATING → APPROVED | REJECTED" }

  - name: AnnotatorProfile
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Public name for the annotator" }
      - { name: domain_tags, type: array, source: input, description: "Domain-skill tags, e.g. [\"medical\",\"automotive\"]" }
      - { name: entry_test_score, type: number, source: input, description: "Score from the entry test, 0..100", constraints: "0 <= value <= 100" }
      - { name: tier, type: enum, source: system, description: "Tier classification", constraints: "JUNIOR | SENIOR | EXPERT" }
      - { name: lifetime_pass_rate, type: number, source: computed, description: "Approved-package count / submitted-package count over all time, 0..1" }
      - { name: rolling_pass_rate, type: number, source: computed, description: "Pass rate over last LOOKBACK_PACKAGES submitted packages (LOOKBACK_PACKAGES = 20)" }
      - { name: golden_hit_rate, type: number, source: computed, description: "Correct golden answers / total golden answers seen, 0..1" }
      - { name: status, type: enum, source: system, description: "Operational status", constraints: "ACTIVE | SUSPENDED" }
      - { name: last_evaluated_at, type: datetime, source: system, description: "Timestamp of the last periodic re-evaluation; null until first run" }

  - name: AnnotationSubmission
    parent: TaskPackage
    common_fields: false
    fields:
      - { name: package_id, type: string, source: system, description: "Owning TaskPackage id" }
      - { name: annotator_id, type: string, source: system, description: "AnnotatorProfile id submitting" }
      - { name: rework_round, type: integer, source: system, description: "Round on which this submission was produced (matches package.rework_round at submit time)" }
      - { name: labels, type: array, source: input, description: "Per-item label payload list, length must equal package.item_count" }
      - { name: golden_correct, type: integer, source: computed, description: "Count of golden items in this submission whose label equals GoldenSample.expected_label" }
      - { name: golden_total, type: integer, source: computed, description: "Count of golden items present in the package at submission time (= package.golden_inserted_count)" }

  - name: QualityInspection
    parent: TaskPackage
    common_fields: true
    fields:
      - { name: package_id, type: string, source: system, description: "Owning TaskPackage id" }
      - { name: submission_id, type: string, source: system, description: "Inspected AnnotationSubmission id" }
      - { name: inspector_id, type: string, source: system, description: "AnnotatorProfile id of the EXPERT-tier inspector" }
      - { name: sample_size, type: integer, source: computed, description: "Number of items inspected (full or sampled, per rules)" }
      - { name: defects_found, type: integer, source: input, description: "Items the inspector marked wrong; 0 <= defects_found <= sample_size" }
      - { name: pass_rate, type: number, source: computed, description: "1 - defects_found / sample_size, four-decimal precision" }
      - { name: outcome, type: enum, source: system, description: "Result of inspection", constraints: "PASS | FAIL | DISPUTED" }

  - name: Appeal
    parent: TaskPackage
    common_fields: true
    fields:
      - { name: package_id, type: string, source: system, description: "TaskPackage being appealed" }
      - { name: inspection_id, type: string, source: system, description: "QualityInspection being appealed" }
      - { name: annotator_id, type: string, source: system, description: "AnnotatorProfile filing the appeal (must be the package's submitter)" }
      - { name: reason, type: string, source: input, description: "Free-text appeal reason" }
      - { name: arbiter_id, type: string, source: system, description: "EXPERT-tier annotator selected to arbitrate; null until UNDER_REVIEW", default: null }
      - { name: decision, type: enum, source: system, description: "Arbitration outcome", constraints: "null | UPHELD | REJECTED" }
      - { name: status, type: enum, source: system, description: "Appeal lifecycle", constraints: "SUBMITTED → UNDER_REVIEW → {UPHELD | REJECTED}" }

  - name: SalaryLedgerEntry
    parent: AnnotatorProfile
    common_fields: false
    fields:
      - { name: annotator_id, type: string, source: system, description: "Owning AnnotatorProfile id" }
      - { name: package_id, type: string, source: system, description: "Triggering TaskPackage id" }
      - { name: payroll_period_id, type: string, source: system, description: "PayrollPeriod the entry is booked into" }
      - { name: kind, type: enum, source: system, description: "Entry kind", constraints: "PIECE_RATE | BONUS | PENALTY | ADJUSTMENT_UPHELD | ADJUSTMENT_REJECTED | TAX | WITHHOLD | RELEASE" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "Signed gross amount in cents (positive = credit, negative = debit)" }
      - { name: settlement_state, type: enum, source: system, description: "Whether the entry is held back or finalized", constraints: "WITHHELD | RELEASED" }

  - name: PayrollPeriod
    parent: null
    common_fields: true
    fields:
      - { name: cycle_label, type: string, source: input, description: "Human-readable label, e.g. 2026-05" }
      - { name: opens_at, type: datetime, source: input, description: "Inclusive start of the period" }
      - { name: closes_at, type: datetime, source: input, description: "Exclusive end of the period; closes_at > opens_at" }
      - { name: tax_rate, type: number, source: input, description: "Flat tax rate applied at settlement, 0..1", constraints: "0 <= value <= 1" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "OPEN → LOCKED → SETTLED" }

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - { name: actor_id, type: string, source: system, description: "X-User-ID of the actor; for system events, the literal string \"system\"" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the actor; \"system\" for system events" }
      - { name: subject_kind, type: enum, source: system, description: "Subject of the log", constraints: "TASK_PACKAGE | SALARY" }
      - { name: subject_id, type: string, source: system, description: "Id of the package or ledger entry the event concerns" }
      - { name: event_type, type: enum, source: system, description: "Event class", constraints: "STATUS_CHANGE | SALARY_ADJUSTMENT" }
      - { name: from_value, type: string, source: system, description: "Previous status or amount string; null for creation events" }
      - { name: to_value, type: string, source: system, description: "New status or amount string" }

  - name: ExternalEvent
    parent: null
    common_fields: false
    fields:
      - { name: target_system, type: enum, source: system, description: "Downstream system the event is queued for", constraints: "PAYMENT | IM | STORAGE" }
      - { name: event_type, type: string, source: system, description: "Event name, e.g. payroll.settled, package.approved, golden_sample.uploaded" }
      - { name: payload_ref_id, type: string, source: system, description: "Id of the entity that produced this event" }
      - { name: dispatch_status, type: enum, source: system, description: "Tracking only — events are queued synchronously on triggering transition", constraints: "PENDING | DISPATCHED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: AnnotationProject
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /annotation-projects/{projectId}/open"
        actor: ProjectManager
        preconditions:
          - "guideline_doc_url is non-empty (ERR_GUIDELINE_REQUIRED)"
          - "sample_preview_urls length >= 1 (ERR_SAMPLE_PREVIEW_REQUIRED)"
          - "GoldenSample count for this project >= MIN_GOLDENS (=5) (ERR_GOLDEN_SAMPLES_INSUFFICIENT)"
          - "At least one TaskPackage exists for this project (ERR_NO_TASK_PACKAGES)"
        side_effects:
          - "Each TaskPackage on this project: status POOL is preserved; tier_required is initialized via assign_tier_required (see §1.3)"
          - "Emit ExternalEvent(target_system=STORAGE, event_type='project.opened', payload_ref_id=project.id)"
      - from: OPEN
        to: CLOSED
        trigger: "POST /annotation-projects/{projectId}/close"
        actor: ProjectManager
        preconditions:
          - "No TaskPackage on this project is in IN_PROGRESS, SUBMITTED, INSPECTING, REWORK_PENDING, or ARBITRATING (ERR_PACKAGES_STILL_OPEN)"
        side_effects:
          - "Any TaskPackage in POOL is auto-cancelled by deletion of its assigned_annotator_id field (already null) and is excluded from listing — no salary effect"
      - from: CLOSED
        to: ARCHIVED
        trigger: "POST /annotation-projects/{projectId}/archive"
        actor: ProjectManager
        preconditions:
          - "All SalaryLedgerEntry rows referencing this project's packages are in settlement_state=RELEASED (ERR_SALARY_NOT_FINALIZED)"
        side_effects:
          - "Emit ExternalEvent(target_system=STORAGE, event_type='project.archived', payload_ref_id=project.id)"

  - entity: TaskPackage
    initial_state: POOL
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: POOL
        to: IN_PROGRESS
        trigger: "POST /task-packages/{packageId}/claim  (GRAB or HYBRID mode)  OR  POST /task-packages/{packageId}/dispatch  (DISPATCH or HYBRID mode)"
        actor: Annotator (claim) | ProjectManager (dispatch)
        preconditions:
          - "Project.status == OPEN (ERR_PROJECT_NOT_OPEN)"
          - "AnnotatorProfile.status == ACTIVE (ERR_ANNOTATOR_SUSPENDED)"
          - "AnnotatorProfile.tier rank >= package.tier_required rank (ERR_TIER_INSUFFICIENT)"
          - "claim allowed only if project.distribution_mode in {GRAB, HYBRID} (ERR_GRAB_NOT_ALLOWED)"
          - "dispatch allowed only if project.distribution_mode in {DISPATCH, HYBRID} (ERR_DISPATCH_NOT_ALLOWED)"
          - "Package.assigned_annotator_id IS NULL at the moment of claim/dispatch (ERR_PACKAGE_ALREADY_TAKEN, see concurrency_rules)"
        side_effects:
          - "assigned_annotator_id := annotator.id"
          - "claimed_at := now()"
          - "deadline_at := now() + project.timeout_seconds"
          - "Insert golden samples into the package per insert_golden_samples (§1.3); golden_inserted_count is set"
      - from: IN_PROGRESS
        to: POOL
        trigger: "POST /_clock/advance  (system reclamation when now() >= deadline_at)"
        actor: system
        preconditions:
          - "Package status == IN_PROGRESS"
          - "now() >= deadline_at"
        side_effects:
          - "assigned_annotator_id := null"
          - "claimed_at := null"
          - "deadline_at := null"
          - "AnnotatorProfile.lifetime_pass_rate and rolling_pass_rate are NOT changed (no submission)"
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /task-packages/{packageId}/submit"
        actor: Annotator
        preconditions:
          - "Acting Annotator.id == package.assigned_annotator_id (ERR_NOT_PACKAGE_OWNER)"
          - "labels.length == package.item_count (ERR_LABEL_COUNT_MISMATCH)"
          - "now() < deadline_at (ERR_PACKAGE_TIMED_OUT)"
        side_effects:
          - "Create AnnotationSubmission; compute golden_correct/golden_total"
          - "Compute consistency metric per consistency_score (§1.3) when 2+ submissions exist on the same package across rework rounds"
      - from: SUBMITTED
        to: INSPECTING
        trigger: "POST /task-packages/{packageId}/start-inspection"
        actor: QAReviewer
        preconditions:
          - "Package status == SUBMITTED"
        side_effects:
          - "Create QualityInspection with sample_size computed by sample_size_for_inspection (§1.3)"
      - from: INSPECTING
        to: APPROVED
        trigger: "POST /task-packages/{packageId}/inspections/{inspectionId}/finalize  with body {outcome:\"PASS\"}"
        actor: QAReviewer
        preconditions:
          - "QualityInspection.outcome == PASS, i.e. defects_found / sample_size <= MAX_DEFECT_RATIO (=0.10) (ERR_PASS_RATE_TOO_LOW for FAIL routing)"
        side_effects:
          - "AnnotatorProfile counters updated: approved++, submitted++"
          - "Compute and create SalaryLedgerEntry of kind PIECE_RATE per piece_rate_amount (§1.3); settlement_state := WITHHELD"
          - "Compute and create SalaryLedgerEntry of kind BONUS or PENALTY per bonus_penalty (§1.3) when applicable; settlement_state := WITHHELD"
          - "Emit ExternalEvent(target_system=IM, event_type='package.approved')"
          - "Emit ExternalEvent(target_system=STORAGE, event_type='package.approved')"
          - "AuditLog STATUS_CHANGE row written"
      - from: INSPECTING
        to: REWORK_PENDING
        trigger: "POST /task-packages/{packageId}/inspections/{inspectionId}/finalize  with body {outcome:\"FAIL\"}"
        actor: QAReviewer
        preconditions:
          - "QualityInspection.outcome == FAIL, i.e. defects_found / sample_size > MAX_DEFECT_RATIO"
          - "package.rework_round + 1 <= MAX_REWORK_ROUNDS (=2)  (else automatic ARBITRATING — see next transition)"
        side_effects:
          - "package.rework_round := package.rework_round + 1 (the INSPECTING result counts as a completed round)"
          - "AnnotatorProfile counters updated: submitted++ (NOT approved)"
          - "AuditLog STATUS_CHANGE row written"
      - from: REWORK_PENDING
        to: IN_PROGRESS
        trigger: "POST /task-packages/{packageId}/rework-claim"
        actor: Annotator (same package owner) | system (auto-reassign on /rework-dispatch)
        preconditions:
          - "Package status == REWORK_PENDING"
          - "Acting AnnotatorProfile.id == package.assigned_annotator_id (the original owner reworks unless it has been suspended; if suspended, package transitions back to POOL via /rework-dispatch instead)"
        side_effects:
          - "claimed_at := now()"
          - "deadline_at := now() + project.timeout_seconds"
      - from: INSPECTING
        to: ARBITRATING
        trigger: "POST /task-packages/{packageId}/inspections/{inspectionId}/finalize  with body {outcome:\"FAIL\"}  (when rework cap exceeded)"
        actor: QAReviewer
        preconditions:
          - "QualityInspection.outcome == FAIL"
          - "package.rework_round + 1 > MAX_REWORK_ROUNDS"
        side_effects:
          - "QualityInspection.outcome is recorded as DISPUTED (override of FAIL when arbitration auto-triggered)"
          - "An expert arbiter is selected by select_arbiter (§1.3)"
      - from: ARBITRATING
        to: APPROVED
        trigger: "POST /task-packages/{packageId}/arbitrate  with body {decision:\"APPROVE\"}"
        actor: ExpertArbiter
        preconditions:
          - "Acting AnnotatorProfile.tier == EXPERT"
          - "Acting AnnotatorProfile.id != package.assigned_annotator_id (ERR_ARBITER_IS_OWNER)"
        side_effects:
          - "AnnotatorProfile counters: approved++, submitted++ (this final round counts once)"
          - "Create PIECE_RATE ledger entry as in INSPECTING→APPROVED"
          - "Bonus/penalty entry per bonus_penalty (§1.3)"
          - "Emit ExternalEvent(target_system=IM, event_type='package.approved')"
      - from: ARBITRATING
        to: REJECTED
        trigger: "POST /task-packages/{packageId}/arbitrate  with body {decision:\"REJECT\"}"
        actor: ExpertArbiter
        preconditions:
          - "Acting AnnotatorProfile.tier == EXPERT"
          - "Acting AnnotatorProfile.id != package.assigned_annotator_id (ERR_ARBITER_IS_OWNER)"
        side_effects:
          - "AnnotatorProfile counters: submitted++ (rejected round)"
          - "Create PENALTY ledger entry of -PENALTY_REJECT_CENTS (=200)"
          - "Emit ExternalEvent(target_system=IM, event_type='package.rejected')"

  - entity: AnnotatorProfile
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /annotators/{annotatorId}/re-evaluate"
        actor: ProjectManager | system
        preconditions:
          - "AnnotatorProfile.status == ACTIVE"
        side_effects:
          - "tier may be promoted/demoted per tier_recompute (§1.3)"
          - "last_evaluated_at := now()"
          - "If demotion crosses into JUNIOR AND golden_hit_rate < SUSPEND_GOLDEN_THRESHOLD (=0.60), see ACTIVE→SUSPENDED below"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /annotators/{annotatorId}/re-evaluate  OR  POST /quality-inspections/{inspectionId}  (when computed metrics breach suspension thresholds)"
        actor: system
        preconditions:
          - "Either: rolling_pass_rate < SUSPEND_PASS_RATE_THRESHOLD (=0.70)"
          - "Or: golden_hit_rate < SUSPEND_GOLDEN_THRESHOLD (=0.60)"
        side_effects:
          - "tier := JUNIOR (forced demotion to floor)"
          - "Any TaskPackage with assigned_annotator_id == annotator.id and status IN_PROGRESS reverts to POOL (assigned_annotator_id := null, claimed_at := null, deadline_at := null)"
          - "Any TaskPackage with assigned_annotator_id == annotator.id and status REWORK_PENDING reverts to POOL"
          - "Emit ExternalEvent(target_system=IM, event_type='annotator.suspended')"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /annotators/{annotatorId}/reinstate"
        actor: ProjectManager
        preconditions:
          - "AnnotatorProfile.status == SUSPENDED"
        side_effects:
          - "Counters not reset; further metric breach can re-suspend"

  - entity: Appeal
    initial_state: SUBMITTED
    terminal_states: [UPHELD, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{appealId}/assign-arbiter"
        actor: ProjectManager
        preconditions:
          - "An EXPERT-tier ACTIVE AnnotatorProfile exists who is not the package owner (ERR_NO_ELIGIBLE_ARBITER)"
        side_effects:
          - "arbiter_id := selection result of select_arbiter (§1.3)"
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /appeals/{appealId}/decide  with body {decision:\"UPHOLD\"}"
        actor: ExpertArbiter
        preconditions:
          - "Acting AnnotatorProfile.id == appeal.arbiter_id (ERR_NOT_ASSIGNED_ARBITER)"
        side_effects:
          - "QualityInspection.outcome := DISPUTED (record override)"
          - "Reverse penalty ledger entries booked from the disputed inspection by inserting an offsetting ADJUSTMENT_UPHELD entry of equal magnitude with opposite sign — global invariant: sum(penalty_debit_cents) + sum(adjustment_upheld_credit_cents) for that inspection == 0"
          - "Promote package status from REJECTED to APPROVED if applicable; create the PIECE_RATE ledger entry that the rejected outcome had withheld (settlement_state := WITHHELD)"
          - "Emit ExternalEvent(target_system=IM, event_type='appeal.upheld')"
          - "AuditLog SALARY_ADJUSTMENT row written"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /appeals/{appealId}/decide  with body {decision:\"REJECT\"}"
        actor: ExpertArbiter
        preconditions:
          - "Acting AnnotatorProfile.id == appeal.arbiter_id"
        side_effects:
          - "ADJUSTMENT_REJECTED ledger entry of -PENALTY_APPEAL_REJECTED_CENTS (=100) is created (penalty for unfounded appeal)"
          - "If the same annotator has accumulated >= REPEATED_DISPUTE_THRESHOLD (=3) REJECTED appeals over the trailing DISPUTE_WINDOW_PACKAGES (=20) packages, AnnotatorProfile.status → SUSPENDED via the same ACTIVE→SUSPENDED transition above (cascade)"
          - "Emit ExternalEvent(target_system=IM, event_type='appeal.rejected')"
          - "AuditLog SALARY_ADJUSTMENT row written"

  - entity: PayrollPeriod
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /payroll-periods/{periodId}/lock"
        actor: ProjectManager
        preconditions:
          - "now() >= closes_at (ERR_PERIOD_NOT_DUE)"
        side_effects:
          - "All SalaryLedgerEntry rows referencing approved packages whose APPROVED transition timestamp falls in [opens_at, closes_at) are stamped with payroll_period_id := this period (those previously WITHHELD remain WITHHELD)"
      - from: LOCKED
        to: SETTLED
        trigger: "POST /payroll-periods/{periodId}/settle"
        actor: ProjectManager
        preconditions:
          - "PayrollPeriod.status == LOCKED"
          - "No package referenced by any SalaryLedgerEntry of this period is in INSPECTING or REWORK_PENDING or ARBITRATING (ERR_REINSPECTION_PENDING; this enforces the withholding-for-re-inspection rule)"
        side_effects:
          - "For every SalaryLedgerEntry in this period, settlement_state := RELEASED"
          - "TAX entry inserted per annotator: -round_half_up(sum_of_positive_entries * tax_rate)"
          - "Emit ExternalEvent(target_system=PAYMENT, event_type='payroll.settled', payload_ref_id=period.id)"
          - "AuditLog SALARY_ADJUSTMENT rows written for each generated TAX entry"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two annotators call /claim for the same POOL package simultaneously"
    guarantee: "At most one annotator becomes assigned_annotator_id; the other is rejected"
    error_id: ERR_PACKAGE_ALREADY_TAKEN
    http_status: 409
    serialization: "First-writer-wins on TaskPackage.assigned_annotator_id; second writer aborts when assigned_annotator_id is non-null"

  - scenario: "QAReviewer finalizes inspection while annotator submits an appeal"
    guarantee: "If the appeal SUBMITTED row is created before the package transitions out of INSPECTING, the inspection finalize is rejected with ERR_INSPECTION_LOCKED_BY_APPEAL; otherwise the appeal create is rejected because the inspection is already terminal"
    error_id: ERR_INSPECTION_LOCKED_BY_APPEAL
    http_status: 409
    serialization: "First-writer-wins on QualityInspection.outcome (null vs non-null)"

  - scenario: "Two PUT updates to AnnotationProject with stale version"
    guarantee: "Optimistic concurrency control; second update with same version is rejected"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "version field comparison; loser receives current version in error message"

  - scenario: "Re-evaluation auto-suspends an annotator while that annotator is mid-claim on a different package"
    guarantee: "If the claim transition has already set assigned_annotator_id before suspension reverts in-progress packages, the package stays IN_PROGRESS; otherwise the claim is rejected with ERR_ANNOTATOR_SUSPENDED"
    error_id: ERR_ANNOTATOR_SUSPENDED
    http_status: 403
    serialization: "First-writer-wins on AnnotatorProfile.status; reads inside the claim handler use the post-write status"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: assign_tier_required
    trigger: "Project DRAFT→OPEN; also re-evaluated on every TaskPackage POOL→IN_PROGRESS read of tier_required"
    algorithm: threshold
    formula: |
      Per-package tier_required is determined at /open time from project.difficulty:
        if project.difficulty == EASY:    tier_required = JUNIOR
        if project.difficulty == MEDIUM:  tier_required = SENIOR
        if project.difficulty == HARD:    tier_required = EXPERT
      Tier rank ordering (low → high): JUNIOR=1, SENIOR=2, EXPERT=3.
      An annotator may claim a package only if annotator.tier rank >= tier_required rank.
    constants:
      RANK_JUNIOR: 1
      RANK_SENIOR: 2
      RANK_EXPERT: 3
    precision: "integer"

  - name: piece_rate_amount
    trigger: "TaskPackage INSPECTING→APPROVED, ARBITRATING→APPROVED, Appeal UPHELD that promotes a rejected package"
    algorithm: tiered_pricing
    formula: |
      Inputs:
        base_unit_price_cents = project.unit_price_cents
        item_count            = package.item_count
        difficulty            = project.difficulty in {EASY, MEDIUM, HARD}
        tier                  = annotator.tier in {JUNIOR, SENIOR, EXPERT}
      DIFFICULTY_MULTIPLIER:
        EASY=1.00, MEDIUM=1.50, HARD=2.00
      TIER_MULTIPLIER:
        JUNIOR=0.80, SENIOR=1.00, EXPERT=1.20
      Per-item rate (cents, before rounding) =
        base_unit_price_cents * DIFFICULTY_MULTIPLIER[difficulty] * TIER_MULTIPLIER[tier]
      Pinned rounding order — round per-item first, then sum:
        per_item_rounded_cents = round_half_up(per_item_rate_cents)
        gross_amount_cents     = per_item_rounded_cents * item_count
      Distinguished from the alternative "sum then round" (which would compute
      per_item_rate_cents * item_count first and then round); the scaffold pins
      "round per item first" so two identical inputs always produce the same
      ledger amount.
    constants:
      DIFFICULTY_MULTIPLIER_EASY: 1.00
      DIFFICULTY_MULTIPLIER_MEDIUM: 1.50
      DIFFICULTY_MULTIPLIER_HARD: 2.00
      TIER_MULTIPLIER_JUNIOR: 0.80
      TIER_MULTIPLIER_SENIOR: 1.00
      TIER_MULTIPLIER_EXPERT: 1.20
    precision: "integer cents, round_half_up at per-item step"

  - name: bonus_penalty
    trigger: "Same triggers as piece_rate_amount, evaluated immediately after the PIECE_RATE entry is written"
    algorithm: threshold
    formula: |
      Inputs:
        package_pass_rate = 1 - inspection.defects_found / inspection.sample_size
        target            = project.pass_rate_target  (e.g. 0.90)
        gross             = piece_rate_amount.gross_amount_cents
      If package_pass_rate >= target + BONUS_BAND (=0.05):
        bonus_cents   = round_half_up(gross * BONUS_RATE) where BONUS_RATE = 0.10
        write SalaryLedgerEntry kind=BONUS, gross_amount_cents = +bonus_cents
      Else if package_pass_rate <= target - PENALTY_BAND (=0.10):
        penalty_cents = round_half_up(gross * PENALTY_RATE) where PENALTY_RATE = 0.20
        write SalaryLedgerEntry kind=PENALTY, gross_amount_cents = -penalty_cents
      Else:
        no bonus/penalty entry is written.
      Boundary precision: comparisons use ">=" and "<=" exactly as written; e.g.
      pass_rate exactly equal to target+BONUS_BAND triggers a bonus.
    constants:
      BONUS_BAND: 0.05
      PENALTY_BAND: 0.10
      BONUS_RATE: 0.10
      PENALTY_RATE: 0.20
    precision: "integer cents, round_half_up"

  - name: sample_size_for_inspection
    trigger: "TaskPackage SUBMITTED→INSPECTING (creation of QualityInspection)"
    algorithm: tiered_pricing
    formula: |
      Inputs:
        item_count = package.item_count
        tier       = annotator.tier
      Sampling rate by tier:
        JUNIOR  → FULL  (sample_size = item_count)            # full inspection for low tier
        SENIOR  → 0.30  (sample_size = ceil(0.30 * item_count))
        EXPERT  → 0.10  (sample_size = ceil(0.10 * item_count))
      Plus golden insertion (always within the sampled subset):
        golden_inserted_count = floor(item_count * GOLDEN_RATIO) where GOLDEN_RATIO = 0.05
        Boundary: when item_count < 1/GOLDEN_RATIO (i.e. item_count < 20), golden_inserted_count == 0
        and that package contributes nothing to the annotator's golden_hit_rate
      The QualityInspection.sample_size is the tier-derived value above.
      Boundary: an EASY 10-item package for an EXPERT samples ceil(1.0)=1 item.
    constants:
      SENIOR_SAMPLE_RATE: 0.30
      EXPERT_SAMPLE_RATE: 0.10
      GOLDEN_RATIO: 0.05
      MAX_DEFECT_RATIO: 0.10
    precision: "integer"

  - name: consistency_score
    trigger: "Every AnnotationSubmission insert when 2+ submissions exist for the same package across rework rounds OR when an appeal references a multi-annotator package"
    algorithm: weighted_scoring
    formula: |
      Inputs:
        labels_a, labels_b — two annotators' label arrays of equal length n
        task_type         — project.task_type
      Compute pairwise agreement score in [0,1]:
        if task_type == CLASSIFICATION or task_type == TEXT_NER:
            cohen_kappa = (po - pe) / (1 - pe), where
              po = (#agree) / n
              pe = sum_over_classes_c( p_a(c) * p_b(c) )    # marginal probability product
            score = max(0, cohen_kappa)
        if task_type == BBOX or task_type == SEGMENTATION or task_type == KEYPOINT:
            score = mean over items of IoU(box_a_i, box_b_i)
              with IoU = intersection_area / union_area; if both empty, IoU=1
        if task_type == AUDIO_TRANSCRIPTION:
            score = F1 over token-level matches (precision = TP/(TP+FP), recall = TP/(TP+FN))
      Pinned rounding: score is rounded to 4 decimal places, round_half_up.
      Low-consistency isolation:
        if score < CONSISTENCY_LOW_THRESHOLD (=0.50):
            package status is forced to ARBITRATING regardless of inspection outcome,
            and select_arbiter is invoked to assign an EXPERT.
      Aggregate: AnnotatorProfile.lifetime_pass_rate is updated only when a
      package reaches APPROVED; consistency_score itself is stored on the
      AnnotationSubmission via a derived helper field on the package
      (computed read at GET).
    constants:
      CONSISTENCY_LOW_THRESHOLD: 0.50
    precision: "4 decimal places, round_half_up"

  - name: tier_recompute
    trigger: "POST /annotators/{id}/re-evaluate; also runs implicitly after each QualityInspection finalize"
    algorithm: threshold
    formula: |
      Inputs:
        rolling_pass_rate, golden_hit_rate, lifetime_pass_rate, last_evaluated_at
      Promotion (cumulative — the highest tier whose conditions are met wins):
        EXPERT  if rolling_pass_rate >= 0.95 AND golden_hit_rate >= 0.95 AND submitted_count >= EXPERT_MIN_PACKAGES (=50)
        SENIOR  if rolling_pass_rate >= 0.85 AND golden_hit_rate >= 0.85 AND submitted_count >= SENIOR_MIN_PACKAGES (=20)
        else JUNIOR
      Demotion: any drop below the band of the current tier moves the annotator
      to the highest-band tier whose conditions still hold (cascading down until
      JUNIOR).
      Suspension overlay: if rolling_pass_rate < 0.70 OR golden_hit_rate < 0.60,
      tier is forced to JUNIOR AND the AnnotatorProfile.status transitions to
      SUSPENDED via the state machine above (cascade).
      Boundary: rolling_pass_rate exactly == 0.85 AND golden_hit_rate == 0.85
      AND submitted_count == 20 → SENIOR (>= comparisons throughout).
    constants:
      EXPERT_PASS: 0.95
      EXPERT_GOLDEN: 0.95
      SENIOR_PASS: 0.85
      SENIOR_GOLDEN: 0.85
      EXPERT_MIN_PACKAGES: 50
      SENIOR_MIN_PACKAGES: 20
      SUSPEND_PASS_RATE_THRESHOLD: 0.70
      SUSPEND_GOLDEN_THRESHOLD: 0.60
    precision: "decimals: 4 dp; counts: integer"

  - name: select_arbiter
    trigger: "Appeal SUBMITTED→UNDER_REVIEW; TaskPackage INSPECTING→ARBITRATING (rework cap exceeded); consistency_score forces ARBITRATING"
    algorithm: constraint_propagation
    formula: |
      Eligibility filter (the candidate set):
        AnnotatorProfile.tier == EXPERT
        AND AnnotatorProfile.status == ACTIVE
        AND id != package.assigned_annotator_id
        AND id != appeal.annotator_id (when invoked from an appeal)
      Ranking expression (sort key, descending):
        primary:   golden_hit_rate
        secondary: rolling_pass_rate
      Tie-break:
        deterministic: lexicographic ascending on AnnotatorProfile.id
      Empty-set fallback:
        the request that triggered selection is rejected with ERR_NO_ELIGIBLE_ARBITER (HTTP 409)
    precision: "n/a"

  - name: rolling_and_lifetime_pass_rate
    trigger: "Every QualityInspection finalize (PASS, FAIL, or DISPUTED→UPHELD/REJECTED)"
    algorithm: aggregation
    formula: |
      Inputs:
        Two algorithms are defined for the SAME submitted-vs-approved counts:

        VARIANT A — chronological (running aggregator):
          on each inspection finalize, increment counters in commit order:
            submitted_count += 1
            approved_count  += (outcome resolves to APPROVED, including via appeal upheld)
          rates are read from the running counters.

        VARIANT B — forward_looking (recompute on read):
          rates are recomputed by scanning all QualityInspection rows for the
          annotator and treating the LATEST appeal decision per inspection as
          the truth (e.g., UPHELD overrides earlier FAIL).
      The scaffold pins VARIANT A as the truth used for tier_recompute and for
      suspension threshold checks. VARIANT B is exposed only via
      GET /annotators/{id}/projected-pass-rate for what-if queries.
      The two variants can produce DIFFERENT rates when an appeal is upheld
      AFTER a tier_recompute has already booked the FAIL — Variant A's
      committed rate stays unchanged until the next inspection event;
      Variant B reflects the appeal upheld immediately.
    constants:
      LOOKBACK_PACKAGES: 20
    variants:
      - name: chronological_running
        when: "Default — what suspension and tier_recompute use"
        difference: "Counters are running aggregators; appeal upheld inserts an offsetting ledger but does NOT retroactively alter rolling_pass_rate"
      - name: projected_forward_looking
        when: "GET /annotators/{id}/projected-pass-rate"
        difference: "Recomputes rates from QualityInspection scan, applying latest appeal decision per inspection"
    precision: "4 decimal places, round_half_up"

  - name: payroll_period_total
    trigger: "POST /payroll-periods/{id}/settle"
    algorithm: aggregation
    formula: |
      For each AnnotatorProfile that has any SalaryLedgerEntry with payroll_period_id = period.id:
        gross_total_cents = sum of entry.gross_amount_cents over kinds in
                            {PIECE_RATE, BONUS, PENALTY, ADJUSTMENT_UPHELD, ADJUSTMENT_REJECTED}
        Pinned evaluation order — circular-looking dependency:
          tax_basis = max(0, gross_total_cents)             # tax never negative
          tax_cents = round_half_up(tax_basis * period.tax_rate)
          net_total_cents = gross_total_cents - tax_cents
        A TAX SalaryLedgerEntry of gross_amount_cents = -tax_cents is written.
        WITHHOLD/RELEASE entries are accounting markers only and net to 0 in
        gross_total_cents (their amounts are 0; the settlement_state field is
        the truth).
      Compensating-invariant: for any package whose lifetime contains both a
      PENALTY and a subsequent ADJUSTMENT_UPHELD that fully reverses it,
      sum(PENALTY.gross_amount_cents) + sum(ADJUSTMENT_UPHELD.gross_amount_cents)
      for that package == 0. The TAX entry is recomputed on the post-reversal
      gross_total_cents.
    precision: "integer cents, round_half_up"

  - name: golden_hit_rate
    trigger: "Every AnnotationSubmission insert"
    algorithm: aggregation
    formula: |
      For the submitting AnnotatorProfile:
        golden_hits   = sum of submission.golden_correct over all submissions ever
        golden_total  = sum of submission.golden_total   over all submissions ever
        if golden_total == 0:
            golden_hit_rate = 1.0      # boundary: zero gold seen → presumed 1.0
        else:
            golden_hit_rate = golden_hits / golden_total
      Empty-set boundary: an annotator who has submitted only packages with
      zero golden injections has golden_hit_rate exactly 1.0 — deliberate so
      brand-new annotators are not auto-suspended.
    precision: "4 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All resource ids in the URL path resolve, validated left-to-right"
    error_id: "ERR_PROJECT_NOT_FOUND | ERR_PACKAGE_NOT_FOUND | ERR_ANNOTATOR_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_APPEAL_NOT_FOUND | ERR_PERIOD_NOT_FOUND"
    http_status: 404
    applies_to: "all nested resource endpoints"

  - priority: 4
    category: state
    check: "Project is in the lifecycle state required by the operation"
    error_id: "ERR_PROJECT_NOT_OPEN | ERR_PROJECT_NOT_DRAFT | ERR_PROJECT_NOT_CLOSED"
    http_status: 409
    applies_to: "project lifecycle endpoints, claim/dispatch, golden-sample upload"

  - priority: 5
    category: state
    check: "Target resource is in the correct state for the operation (package, inspection, appeal, period)"
    error_id: "ERR_PACKAGE_STATE_INVALID | ERR_INSPECTION_STATE_INVALID | ERR_APPEAL_STATE_INVALID | ERR_PERIOD_STATE_INVALID"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "Annotator status must be ACTIVE for any claim, submit, dispatch, or rework-claim"
    error_id: ERR_ANNOTATOR_SUSPENDED
    http_status: 403
    applies_to: "POST /task-packages/{id}/claim, /dispatch, /submit, /rework-claim, /rework-dispatch"

  - priority: 7
    category: business_referential
    check: "Annotator tier rank >= package.tier_required rank (per assign_tier_required)"
    error_id: ERR_TIER_INSUFFICIENT
    http_status: 403
    applies_to: "POST /task-packages/{id}/claim, /dispatch"

  - priority: 8
    category: business_constraint
    check: "Project distribution_mode permits the requested action: claim allowed only for GRAB or HYBRID; dispatch allowed only for DISPATCH or HYBRID"
    error_id: "ERR_GRAB_NOT_ALLOWED | ERR_DISPATCH_NOT_ALLOWED"
    http_status: 409
    applies_to: "POST /task-packages/{id}/claim, /dispatch"

  - priority: 9
    category: business_referential
    check: "On submit: acting Annotator.id == package.assigned_annotator_id"
    error_id: ERR_NOT_PACKAGE_OWNER
    http_status: 403
    applies_to: "POST /task-packages/{id}/submit, /rework-claim"

  - priority: 10
    category: business_temporal
    check: "Package deadline_at has not yet passed at submit time (now() < deadline_at)"
    error_id: ERR_PACKAGE_TIMED_OUT
    http_status: 409
    applies_to: "POST /task-packages/{id}/submit"

  - priority: 11
    category: business_constraint
    check: "Submitted labels.length == package.item_count"
    error_id: ERR_LABEL_COUNT_MISMATCH
    http_status: 400
    applies_to: "POST /task-packages/{id}/submit"

  - priority: 12
    category: business_constraint
    check: "On project DRAFT→OPEN: GoldenSample count for the project >= MIN_GOLDENS (=5)"
    error_id: ERR_GOLDEN_SAMPLES_INSUFFICIENT
    http_status: 409
    applies_to: "POST /annotation-projects/{id}/open"

  - priority: 13
    category: business_constraint
    check: "On project DRAFT→OPEN: at least one TaskPackage exists for the project"
    error_id: ERR_NO_TASK_PACKAGES
    http_status: 409
    applies_to: "POST /annotation-projects/{id}/open"

  - priority: 14
    category: business_safety
    check: "On arbitrate: acting role is EXPERT-tier ACTIVE annotator AND not the package owner"
    error_id: ERR_ARBITER_IS_OWNER
    http_status: 403
    applies_to: "POST /task-packages/{id}/arbitrate, POST /appeals/{id}/decide"

  - priority: 15
    category: business_temporal
    check: "Payroll period lock is allowed only when now() >= closes_at"
    error_id: ERR_PERIOD_NOT_DUE
    http_status: 409
    applies_to: "POST /payroll-periods/{id}/lock"

  - priority: 16
    category: business_fiscal
    check: "Payroll period settle blocked while any referenced package is in INSPECTING, REWORK_PENDING, or ARBITRATING (re-inspection withholding)"
    error_id: ERR_REINSPECTION_PENDING
    http_status: 409
    applies_to: "POST /payroll-periods/{id}/settle"

  - priority: 17
    category: business_constraint
    check: "Package size in [10, 500]; pass_rate_target in (0, 1]; tax_rate in [0, 1]; timeout_seconds >= 60"
    error_id: ERR_INVALID_PARAMETER
    http_status: 400
    applies_to: "POST /annotation-projects, POST /payroll-periods, PATCH endpoints"

  - priority: 18
    category: business_constraint
    check: "QualityInspection.defects_found in [0, sample_size]"
    error_id: ERR_DEFECTS_OUT_OF_RANGE
    http_status: 400
    applies_to: "POST /task-packages/{id}/inspections/{id}/finalize"

  - priority: 19
    category: business_temporal
    check: "PayrollPeriod intervals on the same calendar must not overlap; using half-open semantics [opens_at, closes_at), two periods overlap iff a.opens_at < b.closes_at AND b.opens_at < a.closes_at"
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /payroll-periods"

  - priority: 20
    category: business_constraint
    check: "A POOL→IN_PROGRESS claim/dispatch is rejected if package.assigned_annotator_id is already non-null at the moment of write (single-occupancy interval [claimed_at, deadline_at) on the package as a resource)"
    error_id: ERR_PACKAGE_ALREADY_TAKEN
    http_status: 409
    applies_to: "POST /task-packages/{id}/claim, /dispatch"

  - priority: 21
    category: business_constraint
    check: "Pagination: limit in [1, 100], offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 22
    category: business_constraint
    check: "version field on PUT/PATCH must equal the current entity version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PUT/PATCH endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- AnnotationProject ---
  - method: POST
    path: "/annotation-projects"
    description: "Create a new annotation project in DRAFT"
    roles: [ProjectManager]
    code: 201
    input: [project_name, task_type, difficulty, guideline_doc_url, sample_preview_urls, package_size, distribution_mode, unit_price_cents, pass_rate_target, "timeout_seconds?"]
    output: AnnotationProject
    side_effects: ["status := DRAFT", "golden_sample_count := 0"]

  - method: GET
    path: "/annotation-projects"
    description: "List annotation projects"
    roles: [ProjectManager, QAReviewer, Annotator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "AnnotationProject[]"
    side_effects: []

  - method: GET
    path: "/annotation-projects/{projectId}"
    description: "Read a project"
    roles: [ProjectManager, QAReviewer, Annotator]
    code: 200
    input: []
    output: AnnotationProject
    side_effects: []

  - method: PATCH
    path: "/annotation-projects/{projectId}"
    description: "Update editable fields while DRAFT (guideline_doc_url, sample_preview_urls, unit_price_cents, pass_rate_target, timeout_seconds, package_size, distribution_mode); requires version"
    roles: [ProjectManager]
    code: 200
    input: ["version", "guideline_doc_url?", "sample_preview_urls?", "unit_price_cents?", "pass_rate_target?", "timeout_seconds?", "package_size?", "distribution_mode?"]
    output: AnnotationProject
    side_effects: ["Rejected with ERR_PROJECT_NOT_DRAFT if status != DRAFT"]

  - method: POST
    path: "/annotation-projects/{projectId}/golden-samples"
    description: "Add a golden sample to the project"
    roles: [ProjectManager]
    code: 201
    input: [payload_url, expected_label]
    output: GoldenSample
    side_effects: ["project.golden_sample_count := project.golden_sample_count + 1", "Emit STORAGE event golden_sample.uploaded"]

  - method: GET
    path: "/annotation-projects/{projectId}/golden-samples"
    description: "List golden samples"
    roles: [ProjectManager, QAReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "GoldenSample[]"
    side_effects: []

  - method: POST
    path: "/annotation-projects/{projectId}/task-packages/split"
    description: "Split the dataset into TaskPackages of project.package_size; allowed in DRAFT or OPEN"
    roles: [ProjectManager]
    code: 201
    input: [total_item_count]
    output: "TaskPackage[]"
    side_effects: ["Creates ceil(total_item_count / package_size) TaskPackages with batch_no 1..N; last batch may have item_count < package_size; each package status := POOL"]

  - method: POST
    path: "/annotation-projects/{projectId}/open"
    description: "Open the project for claim/dispatch"
    roles: [ProjectManager]
    code: 200
    input: []
    output: AnnotationProject
    side_effects: ["status := OPEN", "Each TaskPackage tier_required initialized via assign_tier_required", "Emit STORAGE project.opened"]

  - method: POST
    path: "/annotation-projects/{projectId}/close"
    description: "Close the project — no new claims; existing IN_PROGRESS work continues"
    roles: [ProjectManager]
    code: 200
    input: []
    output: AnnotationProject
    side_effects: ["status := CLOSED"]

  - method: POST
    path: "/annotation-projects/{projectId}/archive"
    description: "Archive a closed project after all salary entries are RELEASED"
    roles: [ProjectManager]
    code: 200
    input: []
    output: AnnotationProject
    side_effects: ["status := ARCHIVED", "Emit STORAGE project.archived"]

  # --- TaskPackage ---
  - method: GET
    path: "/annotation-projects/{projectId}/task-packages"
    description: "List TaskPackages for a project"
    roles: [ProjectManager, QAReviewer, Annotator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "TaskPackage[]"
    side_effects: []

  - method: GET
    path: "/task-packages/{packageId}"
    description: "Read a TaskPackage"
    roles: [ProjectManager, QAReviewer, Annotator]
    code: 200
    input: []
    output: TaskPackage
    side_effects: []

  - method: POST
    path: "/task-packages/{packageId}/claim"
    description: "Annotator claims a POOL package (GRAB or HYBRID mode)"
    roles: [Annotator]
    code: 200
    input: []
    output: TaskPackage
    side_effects: ["See TaskPackage POOL→IN_PROGRESS"]

  - method: POST
    path: "/task-packages/{packageId}/dispatch"
    description: "ProjectManager dispatches a POOL package to a specific annotator (DISPATCH or HYBRID mode)"
    roles: [ProjectManager]
    code: 200
    input: [annotator_id]
    output: TaskPackage
    side_effects: ["See TaskPackage POOL→IN_PROGRESS"]

  - method: POST
    path: "/task-packages/{packageId}/submit"
    description: "Annotator submits labels for an IN_PROGRESS package"
    roles: [Annotator]
    code: 200
    input: [labels]
    output: TaskPackage
    side_effects: ["Creates AnnotationSubmission", "Computes golden_hit_rate", "May compute consistency_score"]

  - method: POST
    path: "/task-packages/{packageId}/start-inspection"
    description: "Move a SUBMITTED package into INSPECTING and create the QualityInspection row"
    roles: [QAReviewer]
    code: 200
    input: []
    output: QualityInspection
    side_effects: ["Creates QualityInspection with sample_size from sample_size_for_inspection"]

  - method: POST
    path: "/task-packages/{packageId}/inspections/{inspectionId}/finalize"
    description: "Finalize a QualityInspection with PASS or FAIL"
    roles: [QAReviewer]
    code: 200
    input: [outcome, defects_found]
    output: QualityInspection
    side_effects: ["See TaskPackage INSPECTING→APPROVED, →REWORK_PENDING, or →ARBITRATING"]

  - method: POST
    path: "/task-packages/{packageId}/rework-claim"
    description: "Original owner reclaims a REWORK_PENDING package"
    roles: [Annotator]
    code: 200
    input: []
    output: TaskPackage
    side_effects: ["See TaskPackage REWORK_PENDING→IN_PROGRESS"]

  - method: POST
    path: "/task-packages/{packageId}/rework-dispatch"
    description: "If the original owner is suspended, ProjectManager pushes the package back to POOL (assigned_annotator_id := null) for re-grab"
    roles: [ProjectManager]
    code: 200
    input: []
    output: TaskPackage
    side_effects: ["status := POOL", "assigned_annotator_id := null"]

  - method: POST
    path: "/task-packages/{packageId}/arbitrate"
    description: "Expert arbiter records a final decision on an ARBITRATING package"
    roles: [Annotator]
    code: 200
    input: [decision]
    output: TaskPackage
    side_effects: ["See TaskPackage ARBITRATING→APPROVED or →REJECTED"]

  # --- Appeal ---
  - method: POST
    path: "/task-packages/{packageId}/appeals"
    description: "Submit an appeal on a finalized inspection"
    roles: [Annotator]
    code: 201
    input: [inspection_id, reason]
    output: Appeal
    side_effects: ["status := SUBMITTED"]

  - method: GET
    path: "/appeals/{appealId}"
    description: "Read an appeal"
    roles: [ProjectManager, QAReviewer, Annotator]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: POST
    path: "/appeals/{appealId}/assign-arbiter"
    description: "Assign an EXPERT-tier arbiter to the appeal"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Appeal
    side_effects: ["arbiter_id := select_arbiter(...)", "status := UNDER_REVIEW"]

  - method: POST
    path: "/appeals/{appealId}/decide"
    description: "Expert arbiter decides UPHOLD or REJECT"
    roles: [Annotator]
    code: 200
    input: [decision]
    output: Appeal
    side_effects: ["See Appeal UNDER_REVIEW→UPHELD or →REJECTED"]

  # --- AnnotatorProfile ---
  - method: POST
    path: "/annotators"
    description: "Register a new AnnotatorProfile; tier is determined from entry_test_score (>=80 → SENIOR; >=95 → EXPERT; else JUNIOR)"
    roles: [ProjectManager]
    code: 201
    input: [display_name, domain_tags, entry_test_score]
    output: AnnotatorProfile
    side_effects: ["status := ACTIVE", "tier := initial tier from entry_test_score", "lifetime_pass_rate := 1.0", "rolling_pass_rate := 1.0", "golden_hit_rate := 1.0"]

  - method: GET
    path: "/annotators"
    description: "List annotators"
    roles: [ProjectManager, QAReviewer]
    code: 200
    input: ["limit?", "offset?", "tier?", "status?"]
    output: "AnnotatorProfile[]"
    side_effects: []

  - method: GET
    path: "/annotators/{annotatorId}"
    description: "Read an annotator"
    roles: [ProjectManager, QAReviewer, Annotator]
    code: 200
    input: []
    output: AnnotatorProfile
    side_effects: []

  - method: POST
    path: "/annotators/{annotatorId}/re-evaluate"
    description: "Re-run tier_recompute and apply demotion/suspension if conditions are breached"
    roles: [ProjectManager]
    code: 200
    input: []
    output: AnnotatorProfile
    side_effects: ["See AnnotatorProfile ACTIVE→ACTIVE or ACTIVE→SUSPENDED"]

  - method: POST
    path: "/annotators/{annotatorId}/reinstate"
    description: "Move SUSPENDED → ACTIVE"
    roles: [ProjectManager]
    code: 200
    input: []
    output: AnnotatorProfile
    side_effects: ["status := ACTIVE"]

  - method: GET
    path: "/annotators/{annotatorId}/projected-pass-rate"
    description: "Read forward-looking projected pass rate (Variant B of rolling_and_lifetime_pass_rate)"
    roles: [ProjectManager, QAReviewer, Annotator]
    code: 200
    input: []
    output: object
    side_effects: []

  # --- PayrollPeriod ---
  - method: POST
    path: "/payroll-periods"
    description: "Open a new payroll period"
    roles: [ProjectManager]
    code: 201
    input: [cycle_label, opens_at, closes_at, tax_rate]
    output: PayrollPeriod
    side_effects: ["status := OPEN"]

  - method: GET
    path: "/payroll-periods"
    description: "List payroll periods"
    roles: [ProjectManager]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "PayrollPeriod[]"
    side_effects: []

  - method: POST
    path: "/payroll-periods/{periodId}/lock"
    description: "Lock the period and stamp candidate ledger entries"
    roles: [ProjectManager]
    code: 200
    input: []
    output: PayrollPeriod
    side_effects: ["status := LOCKED", "Candidate ledger entries get payroll_period_id"]

  - method: POST
    path: "/payroll-periods/{periodId}/settle"
    description: "Settle the period — release ledger entries and write TAX entries"
    roles: [ProjectManager]
    code: 200
    input: []
    output: PayrollPeriod
    side_effects: ["See PayrollPeriod LOCKED→SETTLED"]

  - method: GET
    path: "/payroll-periods/{periodId}/ledger-entries"
    description: "List SalaryLedgerEntry rows for a payroll period"
    roles: [ProjectManager, Annotator]
    code: 200
    input: ["limit?", "offset?", "annotator_id?"]
    output: "SalaryLedgerEntry[]"
    side_effects: []

  # --- AuditLog and ExternalEvent (read-only) ---
  - method: GET
    path: "/audit-logs"
    description: "List audit logs (for tests and ops)"
    roles: [ProjectManager]
    code: 200
    input: ["limit?", "offset?", "subject_kind?", "subject_id?"]
    output: "AuditLog[]"
    side_effects: []

  - method: GET
    path: "/external-events"
    description: "List queued external events (for tests and ops)"
    roles: [ProjectManager]
    code: 200
    input: ["limit?", "offset?", "target_system?"]
    output: "ExternalEvent[]"
    side_effects: []

  # --- Test-driving endpoints (per §1.5 testability-completeness) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance the system clock to a specific ISO 8601 instant; drives all now()-based transitions including timeout reclamation"
    roles: [ProjectManager]
    code: 200
    input: [to]
    output: object
    side_effects: ["For every TaskPackage with status IN_PROGRESS where deadline_at <= new_now: status := POOL, assigned_annotator_id := null, claimed_at := null, deadline_at := null"]

  - method: POST
    path: "/_events/dispatch-pending"
    description: "Mark all PENDING ExternalEvent rows as DISPATCHED (test-only synchronous flush)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: object
    side_effects: ["dispatch_status := DISPATCHED for all pending events"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth / authz
  - { id: ERR_MISSING_AUTH_HEADERS, http: 400, condition: "X-User-ID or X-User-Role missing" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for operation" }

  # not-found
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "AnnotationProject id does not resolve" }
  - { id: ERR_PACKAGE_NOT_FOUND, http: 404, condition: "TaskPackage id does not resolve" }
  - { id: ERR_ANNOTATOR_NOT_FOUND, http: 404, condition: "AnnotatorProfile id does not resolve" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "QualityInspection id does not resolve" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "Appeal id does not resolve" }
  - { id: ERR_PERIOD_NOT_FOUND, http: 404, condition: "PayrollPeriod id does not resolve" }
  - { id: ERR_GOLDEN_NOT_FOUND, http: 404, condition: "GoldenSample id does not resolve" }

  # state
  - { id: ERR_PROJECT_NOT_OPEN, http: 409, condition: "Operation requires project.status == OPEN" }
  - { id: ERR_PROJECT_NOT_DRAFT, http: 409, condition: "Operation requires project.status == DRAFT" }
  - { id: ERR_PROJECT_NOT_CLOSED, http: 409, condition: "Operation requires project.status == CLOSED" }
  - { id: ERR_PACKAGE_STATE_INVALID, http: 409, condition: "TaskPackage is not in the state required by the operation" }
  - { id: ERR_INSPECTION_STATE_INVALID, http: 409, condition: "QualityInspection is not in the state required by the operation" }
  - { id: ERR_APPEAL_STATE_INVALID, http: 409, condition: "Appeal is not in the state required by the operation" }
  - { id: ERR_PERIOD_STATE_INVALID, http: 409, condition: "PayrollPeriod is not in the state required by the operation" }
  - { id: ERR_PACKAGE_ALREADY_TAKEN, http: 409, condition: "Package was claimed/dispatched by another writer first" }
  - { id: ERR_INSPECTION_LOCKED_BY_APPEAL, http: 409, condition: "Inspection finalize blocked because an appeal is already pending on the inspection" }
  - { id: ERR_PACKAGES_STILL_OPEN, http: 409, condition: "Project close blocked because packages are still in non-terminal non-POOL states" }
  - { id: ERR_SALARY_NOT_FINALIZED, http: 409, condition: "Project archive blocked because some SalaryLedgerEntry is still WITHHELD" }

  # business / open
  - { id: ERR_GUIDELINE_REQUIRED, http: 409, condition: "Project /open requires non-empty guideline_doc_url" }
  - { id: ERR_SAMPLE_PREVIEW_REQUIRED, http: 409, condition: "Project /open requires non-empty sample_preview_urls" }
  - { id: ERR_GOLDEN_SAMPLES_INSUFFICIENT, http: 409, condition: "Project /open requires GoldenSample count >= 5" }
  - { id: ERR_NO_TASK_PACKAGES, http: 409, condition: "Project /open requires at least one TaskPackage" }

  # business / claim, dispatch, submit
  - { id: ERR_TIER_INSUFFICIENT, http: 403, condition: "Annotator tier rank below package.tier_required rank" }
  - { id: ERR_GRAB_NOT_ALLOWED, http: 409, condition: "Project distribution_mode does not allow /claim" }
  - { id: ERR_DISPATCH_NOT_ALLOWED, http: 409, condition: "Project distribution_mode does not allow /dispatch" }
  - { id: ERR_ANNOTATOR_SUSPENDED, http: 403, condition: "Annotator is SUSPENDED" }
  - { id: ERR_NOT_PACKAGE_OWNER, http: 403, condition: "Acting annotator is not package.assigned_annotator_id" }
  - { id: ERR_LABEL_COUNT_MISMATCH, http: 400, condition: "labels.length != package.item_count" }
  - { id: ERR_PACKAGE_TIMED_OUT, http: 409, condition: "Submit attempted after deadline_at" }

  # business / arbitration & appeal
  - { id: ERR_ARBITER_IS_OWNER, http: 403, condition: "Arbiter must not be the package owner" }
  - { id: ERR_NOT_ASSIGNED_ARBITER, http: 403, condition: "Acting annotator is not the appeal's assigned arbiter" }
  - { id: ERR_NO_ELIGIBLE_ARBITER, http: 409, condition: "No EXPERT-tier ACTIVE annotator other than the package owner is available" }

  # business / payroll
  - { id: ERR_PERIOD_NOT_DUE, http: 409, condition: "Payroll period lock requires now() >= closes_at" }
  - { id: ERR_REINSPECTION_PENDING, http: 409, condition: "Settle blocked while a referenced package is in INSPECTING/REWORK_PENDING/ARBITRATING" }
  - { id: ERR_PERIOD_OVERLAP, http: 409, condition: "New PayrollPeriod overlaps an existing period under half-open [opens_at, closes_at) semantics" }

  # validation generic
  - { id: ERR_INVALID_PARAMETER, http: 400, condition: "Parameter value out of accepted range or wrong shape" }
  - { id: ERR_DEFECTS_OUT_OF_RANGE, http: 400, condition: "defects_found not in [0, sample_size]" }
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit out of [1,100] or offset < 0" }
  - { id: ERR_VERSION_CONFLICT, http: 409, condition: "PUT/PATCH version does not match current entity version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: ProjectManager
    description: "Owns project lifecycle, package splitting/dispatch, annotator registration, payroll periods"
    identity: "opaque"
    exclusive_operations:
      - "POST /annotation-projects"
      - "PATCH /annotation-projects/{projectId}"
      - "POST /annotation-projects/{projectId}/golden-samples"
      - "POST /annotation-projects/{projectId}/task-packages/split"
      - "POST /annotation-projects/{projectId}/open"
      - "POST /annotation-projects/{projectId}/close"
      - "POST /annotation-projects/{projectId}/archive"
      - "POST /task-packages/{packageId}/dispatch"
      - "POST /task-packages/{packageId}/rework-dispatch"
      - "POST /annotators"
      - "POST /annotators/{annotatorId}/re-evaluate"
      - "POST /annotators/{annotatorId}/reinstate"
      - "POST /appeals/{appealId}/assign-arbiter"
      - "POST /payroll-periods"
      - "POST /payroll-periods/{periodId}/lock"
      - "POST /payroll-periods/{periodId}/settle"
      - "GET /audit-logs"
      - "GET /external-events"
      - "POST /_clock/advance"
      - "POST /_events/dispatch-pending"
    shared_operations:
      - "GET /annotation-projects, /annotation-projects/{id}"
      - "GET /annotation-projects/{id}/task-packages, /task-packages/{id}"
      - "GET /annotation-projects/{id}/golden-samples"
      - "GET /annotators, /annotators/{id}, /annotators/{id}/projected-pass-rate"
      - "GET /appeals/{id}"
      - "GET /payroll-periods, /payroll-periods/{id}/ledger-entries"

  - name: QAReviewer
    description: "Quality inspection lifecycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /task-packages/{packageId}/start-inspection"
      - "POST /task-packages/{packageId}/inspections/{inspectionId}/finalize"
    shared_operations:
      - "GET /annotation-projects, /annotation-projects/{id}"
      - "GET /annotation-projects/{id}/task-packages, /task-packages/{id}"
      - "GET /annotation-projects/{id}/golden-samples"
      - "GET /annotators, /annotators/{id}, /annotators/{id}/projected-pass-rate"
      - "GET /appeals/{id}"

  - name: Annotator
    description: "Crowdsourced annotator; entity-backed by AnnotatorProfile. Submits labels, files appeals, arbitrates when EXPERT-tier"
    identity: "entity_backed:AnnotatorProfile"
    exclusive_operations:
      - "POST /task-packages/{packageId}/claim"
      - "POST /task-packages/{packageId}/submit"
      - "POST /task-packages/{packageId}/rework-claim"
      - "POST /task-packages/{packageId}/arbitrate"
      - "POST /task-packages/{packageId}/appeals"
      - "POST /appeals/{appealId}/decide"
    shared_operations:
      - "GET /annotation-projects, /annotation-projects/{id}"
      - "GET /annotation-projects/{id}/task-packages, /task-packages/{id}"
      - "GET /annotators/{id}, /annotators/{id}/projected-pass-rate"
      - "GET /appeals/{id}"
      - "GET /payroll-periods/{id}/ledger-entries"
