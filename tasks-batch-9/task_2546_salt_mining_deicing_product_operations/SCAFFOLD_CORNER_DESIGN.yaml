      - name: capacity_refit_holds_only_scheduled_runs_and_spares_the_hoisted_one
        claim_type: conditional_cascade
        grounds:
          - state_machines.Mine.hoist_state.HOIST_AVAILABLE_to_HOIST_DERATED
          - state_machines.ProductionRun.SCHEDULED_to_HELD
          - entities.ProductionRun.fields.held_reason
          - calculations.hoist_window_aggregate_capacity
        distinguishing_aspect: |
          The capacity re-fit cascade is conditional on child state: derating the shaft to
          13200.00 t/day (550.00 t/h) holds only the SCHEDULED run whose 600.0000 t/h no longer
          fits, stamping held_reason CAPACITY, while the already-HOISTED run at 1000.0000 t/h — a
          rate that now exceeds capacity outright — is deliberately left alone.
        test_recipe:
          setup:
            - "Mine rated 24000 t/day (1000.00 t/h) with PRODUCING panel P-1; run A of 24000 t over 24 h (rate 1000.0000) already HOISTED, run B of 14400 t over a later 24 h window (rate 600.0000) still SCHEDULED."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v1: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 24000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v1}" }
              as: MinePlanner
              captures: { run_a: "$.data.id" }
            - call: "POST /salt/production-runs/${run_a}/hoist"
              payload: { hoisted_tons: 24000 }
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v2: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 14400, hoist_window_start: "2026-08-05T00:00:00Z", hoist_window_end: "2026-08-06T00:00:00Z", expected_mine_version: "${mine_v2}" }
              as: MinePlanner
              captures: { run_b: "$.data.id" }
          trigger:
            - call: "POST /salt/mines/${mine_id}/hoist-status"
              payload: { hoist_state: "HOIST_DERATED", note: "skip damage, half hoist" }
              as: MinePlanner
              captures: { eff: "$.data.effective_hoist_tons_per_day" }
            - call: "GET /salt/mines/${mine_id}/hoist-capacity"
              payload: {}
              as: MinePlanner
              captures: { hourly: "$.data.mine_hourly_capacity", open_tons: "$.data.scheduled_hoist_tons_open", open_runs: "$.data.scheduled_run_count" }
          assert:
            - "run B accepted at create with planned_tons_per_hour == 600.0000 (600 <= 1000 before the derate)"
            - "HTTP 200 and ${eff} == 13200.00 with ${hourly} == 550.00"
            - "ProductionRun.${run_b}.status == HELD and held_reason == CAPACITY"
            - "ProductionRun.${run_a}.status == HOISTED and held_reason == null and hoisted_tons == 24000"
            - "${open_tons} == 0 and ${open_runs} == 0 (a HELD run is no longer open capacity)"
            - "Panel.${panel_id}.mined_tons == 24000 and status == PRODUCING"

      - name: treatment_batch_rework_self_loop
        claim_type: cyclic
        excluded_because:
          difficulty_instance: treatment_batch_pending_self_loop_bounded_at_two_reworks
          rationale: |
            The PENDING -> PENDING self-loop and its termination condition (the third REWORK is
            refused with ERR_REWORK_LIMIT_EXCEEDED while rework_count stays at 2 and the yield keeps
            decaying by the 0.97 factor) are already driven end to end by that §1.8 instance.

      - name: panel_suspend_resume_guarded_by_open_defect
        claim_type: guarded_transitions
        excluded_because:
          difficulty_instance: panel_producing_suspended_producing_cycle_guarded_by_open_defect
          rationale: |
            The cross-entity guard on SUSPENDED -> PRODUCING (blocked while Panel.open_defect is
            true, allowed after remediate-defect) is the whole subject of that §1.8 instance,
            including the ERR_GROUND_CONTROL_DEFECT_OPEN leg and the mine counter bookkeeping.

      - name: defect_inspection_cascade_down_the_mine_tree
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: defect_inspection_cascades_panel_mine_run_and_open_tonnage
          rationale: |
            The three-hop DEFECT cascade (panel PRODUCING -> SUSPENDED, mine hoist derate or
            HOIST_DOWN depending on the surviving producing panels, and SCHEDULED runs -> HELD with
            held_reason GROUND_CONTROL while HOISTED runs are spared) is asserted there in full.

  # ===========================================================================
  # 3. From Table 3 (Calculations)
  #    Declared algorithms: threshold, constraint_propagation, interval_merge,
  #    weighted_scoring, forward_looking, waterfall_allocation, tiered_pricing,
  #    aggregation, decay_function — plus the two `variants:` blocks.
  # ===========================================================================
  - section: calculations
    instances:
      - name: three_screen_specs_on_one_run_yield_three_distinct_tonnages
        claim_type: correct_result
        grounds:
          - calculations.treatment_yield_and_purity
          - entities.TreatmentBatch.fields.yield_tons
          - entities.TreatmentBatch.fields.purity_pct_nacl
        distinguishing_aspect: |
          Holding input_tons at 1000 and moisture at 0.00 isolates the screen weights: COARSE 0.94,
          MEDIUM 0.90 and FINE 0.82 give 940.00 / 900.00 / 820.00 tons and the matching upgrades
          +0.5 / +1.2 / +2.5 give 96.500 / 97.200 / 98.500 purity off the same 96.00 panel grade.
        test_recipe:
          setup:
            - "Mine, PRODUCING panel P-1 (grade 96.00), one run hoisted with 3000 t and Syracuse Depot."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 3000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id" }
            - call: "POST /salt/production-runs/${run_id}/hoist"
              payload: { hoisted_tons: 3000 }
              as: MinePlanner
            - call: "POST /salt/depots"
              payload: { name: "Syracuse Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 12.500 }
