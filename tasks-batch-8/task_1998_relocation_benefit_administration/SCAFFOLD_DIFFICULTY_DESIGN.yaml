      - name: vendor_survey_two_hour_buffer
        grounds:
          - validations[priority=9]
          - errors[ERR_SURVEY_CONFLICT]
          - state_machines.MoveAssignment.REQUESTED_to_SURVEY_SCHEDULED
        distinguishing_aspect: |
          Resource: Vendor's survey calendar. Semantics: point-in-time with a
          +/-2 hour exclusion buffer — a survey 1.5h from an existing
          SURVEY_SCHEDULED survey conflicts, while one exactly 2h away is
          allowed (strict < 2h comparison). Different resource and different
          interval geometry from the sibling's half-open stay intervals.
        test_recipe:
          setup:
            - "MANAGER/DOMESTIC/RENTER policy; case IN_PROGRESS; vendor V ACTIVE; assignment A1 SURVEY_SCHEDULED at 2026-08-10T10:00:00Z; assignment A2 REQUESTED for the same vendor"
          setup_api_calls:
            - call: "POST /policies"
              payload: { job_level: MANAGER, move_scope: DOMESTIC, home_ownership: RENTER, hhg_cap_cents: 500000, temp_housing_cap_cents: 300000, temp_housing_max_nights: 30, travel_cap_cents: 100000, loss_on_sale_cap_cents: 0, misc_cap_cents: 200000, home_sale_eligible: false, repayment_window_months: 24, gross_up_method: FLAT_SUPPLEMENTAL, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: APPRAISED }
