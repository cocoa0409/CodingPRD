      - name: validation_priority_ordering_is_covered_by_the_difficulty_design
        claim_type: priority_ordering
        grounds:
          - validations[priority=30]
          - validations[priority=65]
        excluded_because:
          difficulty_instance: stale_policy_version_on_overlapping_term_returns_412_not_overlap_conflict
          rationale: "A single request violates both the OCC rule at priority 30 and the overlap rule at priority 65 and is asserted to return the 412, which is the priority-ordering claim."

      - name: state_versus_aggregate_priority_conflict_is_covered_by_the_difficulty_design
        claim_type: priority_conflict
        grounds:
          - validations[priority=41]
          - validations[priority=86]
        excluded_because:
          difficulty_instance: replayed_payment_on_paid_negotiation_rejected_for_state_not_aggregate_limit
          rationale: "The replayed payment violates both the negotiation-state rule and the aggregate-limit rule, and the state error at the lower priority number is asserted to win."

      - name: cascading_existence_before_state_is_covered_by_the_difficulty_design
        claim_type: cascading_validation
        grounds:
          - validations[priority=52]
          - validations[priority=78]
        excluded_because:
          difficulty_instance: counsel_request_on_denied_claim_rejected_for_coverage_not_empty_panel
          rationale: "The coverage-denial check is asserted to run before the panel-eligibility check even though both would fail, which is the cascading-validation ordering claim."

  # =========================================================================
  # Table 5 (Endpoints): 65 endpoints. There are no bulk endpoints and no
  # update or delete verbs, so the CRUD row is a create / read / list round
  # trip and the bulk-action row is not applicable.
  # =========================================================================
  - section: endpoints
    instances:
      - name: counsel_firm_create_read_and_filtered_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /mpl/counsel-firms]
          - endpoints[GET /mpl/counsel-firms/{id}]
          - endpoints[GET /mpl/counsel-firms]
        distinguishing_aspect: "A created firm reads back identically by id and appears under a venue_code plus allegation_category filter, while a KINGS_NY filter excludes it - and no update or delete verb exists for the resource."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z with no DefenseCounselFirm rows."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ClaimsCommitteeApprover
              as_user_id: "appr-1"
          trigger:
            - call: "POST /mpl/counsel-firms"
              payload: { firm_name: "Halloran Defense LLP", admitted_venue_codes: ["COOK_IL", "TRAVIS_TX"], allegation_specialties: ["OBSTETRIC_INJURY", "SURGICAL_ERROR"], blended_hourly_rate: 500.00, quality_score: 95 }
              as: ClaimsCommitteeApprover
              as_user_id: "appr-1"
              captures: { firm_h: $.data.id }
            - call: "GET /mpl/counsel-firms/${firm_h}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "GET /mpl/counsel-firms"
              payload: { venue_code: "COOK_IL", allegation_category: "OBSTETRIC_INJURY", limit: 10, offset: 0 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "GET /mpl/counsel-firms"
              payload: { venue_code: "KINGS_NY" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          assert:
            - "create response.status == 201"
            - "get response.status == 200 and returns firm ${firm_h}"
            - "DefenseCounselFirm.${firm_h}.panel_status == ACTIVE"
            - "DefenseCounselFirm.${firm_h}.max_concurrent_assignments == 5"
            - "DefenseCounselFirm.${firm_h}.conflict_insured_ids == []"
            - "DefenseCounselFirm.${firm_h}.open_assignment_count == 0"
            - "DefenseCounselFirm.${firm_h}.billed_expense_total == 0"
            - "DefenseCounselFirm.${firm_h}.panel_status_reason == null"
            - "filtered list response.total_count == 1 and has_more == false"
            - "KINGS_NY list response.total_count == 0"

