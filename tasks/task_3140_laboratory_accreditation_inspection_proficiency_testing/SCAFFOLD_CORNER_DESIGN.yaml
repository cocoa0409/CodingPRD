            - "PTShipment.${sh1}.status == CLOSED and closure_reason == DEADLINE_ELAPSED (fired by the clock advance)"
            - "A subsequent POST /pt-results for ${sh1} is rejected (ERR_SHIPMENT_CLOSED wins over the also-violated deadline check)"

