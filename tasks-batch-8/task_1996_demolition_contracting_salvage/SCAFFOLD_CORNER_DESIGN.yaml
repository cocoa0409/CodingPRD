            - { call: "POST /demolition/projects/${p_id}/final-inspections", payload: { inspection_type: "EROSION_CLOSEOUT", scheduled_date: "2026-08-21" }, as: MunicipalInspector, captures: { err: $.data.error_id } }
            - { call: "POST /demolition/final-inspections/${fi1}/transition", payload: { action: "FAIL" }, as: MunicipalInspector }
            - { call: "POST /demolition/projects/${p_id}/final-inspections", payload: { inspection_type: "EROSION_CLOSEOUT", scheduled_date: "2026-08-28" }, as: MunicipalInspector, captures: { fi2: $.data.id } }
          assert:
            - "while first is SCHEDULED: ${err} == ERR_INSPECTION_OUTSTANDING"
            - "after first FAILs: second create succeeds (${fi2} is a valid id)"

      - name: error_invalid_state_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / release_state_beats_safety"
          rationale: "ERR_INVALID_STATE asserted as the winning error in the named §1.8 instance and in §1.9 ticket_receive_twice_rejected / permit_transition_from_rejected_rejected."

      - name: error_quiet_hours_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_QUIET_HOURS]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / quiet_hours_delivery_occupation_window"
          rationale: "ERR_QUIET_HOURS asserted at 18:45 in the named §1.8 instance."

      - name: error_disconnect_overlap_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_DISCONNECT_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / disconnect_windows_half_open_adjacency"
          rationale: "ERR_DISCONNECT_WINDOW_OVERLAP asserted for the 11:00 overlapping window in the named §1.8 instance."

      - name: error_pin_stale_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_ENGINEERING_PIN_STALE]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / release_blocked_by_stale_engineering_pin"
          rationale: "ERR_ENGINEERING_PIN_STALE asserted on release in the named §1.8 instance."

      - name: error_hazmat_unresolved_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_HAZMAT_UNRESOLVED]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / release_safety_beats_temporal"
          rationale: "ERR_HAZMAT_UNRESOLVED asserted as the priority-8 winner in the named §1.8 instance."

      - name: error_backfill_incomplete_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_BACKFILL_INCOMPLETE]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / final_pass_referential_beats_fiscal"
          rationale: "ERR_BACKFILL_INCOMPLETE asserted as the priority-10 winner in the named §1.8 instance."

      - name: error_notification_window_open_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOTIFICATION_WINDOW_OPEN]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / notification_wait_window_exactly_72h"
          rationale: "ERR_NOTIFICATION_WINDOW_OPEN asserted one second before the boundary in the named §1.8 instance."

      - name: error_erosion_coverage_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_EROSION_COVERAGE_INSUFFICIENT]"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / erosion_provisional_vs_final_divergence"
          rationale: "ERR_EROSION_COVERAGE_INSUFFICIENT asserted at final coverage 0.88 in the named §1.8 instance."

      - name: error_compaction_below_spec_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_COMPACTION_BELOW_SPEC]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / compaction_exactly_required_passes"
          rationale: "ERR_COMPACTION_BELOW_SPEC asserted at 94.99 in the named §1.8 instance."

      - name: error_survey_incomplete_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_SURVEY_INCOMPLETE]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / abatement_clearance_requires_survey_complete"
          rationale: "ERR_SURVEY_INCOMPLETE asserted on REQUEST_CLEARANCE in the named §1.8 instance."

      - name: error_utility_unverified_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_UTILITY_UNVERIFIED]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / permit_activate_requires_all_utilities_confirmed"
          rationale: "ERR_UTILITY_UNVERIFIED asserted on ACTIVATE in the named §1.8 instance and in §1.9 permit_activate_with_zero_disconnects_rejected."

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: rbac_surveyor_cannot_create_project
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Surveyor is not in POST /demolition/projects roles -> ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - { call: "POST /demolition/projects", payload: { name: "Nope", address: "1 Role St", lot_area_sqft: 12000 }, as: Surveyor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN"

      - name: rbac_hauler_cannot_certify_engineering
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "HaulingDispatcher calling the engineering-surveys transition endpoint is rejected ERR_FORBIDDEN before any state logic (endpoint roles are StructuralEngineer/PeerReviewEngineer only)."
        test_recipe:
          setup: ["Project with a SUBMITTED engineering survey."]
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "RoleGate", address: "3 Role St", lot_area_sqft: 12000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/engineering-surveys", payload: { demolition_method: "MECHANICAL", structural_stability_rating: "STABLE", max_structure_height_ft: 20, adjacent_structure_distance_ft: 50 }, as: StructuralEngineer, as_user_id: "rg-a-1", captures: { es_id: $.data.id } }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "SUBMIT" }, as: StructuralEngineer, as_user_id: "rg-a-1" }
          trigger:
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "CERTIFY" }, as: HaulingDispatcher, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN"
            - "EngineeringSurvey.${es_id}.status remains SUBMITTED"

      - name: rbac_monitor_cannot_read_debris_tickets
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Read-side RBAC: EnvironmentalMonitor is not in the debris-tickets sub-list roles -> ERR_FORBIDDEN even for GET."
        test_recipe:
          setup: ["Project exists."]
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "ReadGate", address: "5 Role St", lot_area_sqft: 12000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "GET /demolition/projects/${p_id}/debris-tickets", as: EnvironmentalMonitor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN"

      - name: rbac_clock_set_non_admin_forbidden
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Only ContractorAdmin may set the logical clock; SiteSupervisor gets ERR_FORBIDDEN."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SiteSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN"

      - name: sod_abatement_certify_by_starter_rejected
        claim_type: rbac_denial
        grounds: ["validations[priority=7]", "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "Segregation of duties: the ClearanceOfficer role user who is ALSO the recorded started_by_user_id cannot CERTIFY_CLEARANCE — same person, different role hat, still rejected."
        test_recipe:
          setup: ["Project; COMPLETE survey; abatement CLEARANCE_PENDING started by user ab-1."]
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "SoD1", address: "7 Role St", lot_area_sqft: 12000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/structure-surveys", payload: { structure_label: "Main" }, as: Surveyor, captures: { sv_id: $.data.id } }
            - { call: "POST /demolition/structure-surveys/${sv_id}/transition", payload: { action: "COMPLETE", hazmat_found: true, findings_summary: "asbestos" }, as: Surveyor }
            - { call: "POST /demolition/structure-surveys/${sv_id}/abatements", payload: { material_type: "ASBESTOS", description: "pipe wrap", containment_method: "wet" }, as: Surveyor, captures: { ab_id: $.data.id } }
            - { call: "POST /demolition/abatements/${ab_id}/transition", payload: { action: "START" }, as: AbatementSupervisor, as_user_id: "ab-1" }
            - { call: "POST /demolition/abatements/${ab_id}/transition", payload: { action: "REQUEST_CLEARANCE" }, as: AbatementSupervisor, as_user_id: "ab-1" }
          trigger:
            - { call: "POST /demolition/abatements/${ab_id}/transition", payload: { action: "CERTIFY_CLEARANCE" }, as: ClearanceOfficer, as_user_id: "ab-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_SOD_VIOLATION (certifier user id equals started_by_user_id)"
            - "HazmatAbatement.${ab_id}.status remains CLEARANCE_PENDING"

      - name: sod_utility_confirm_by_verifier_rejected
        claim_type: rbac_denial
        grounds: ["validations[priority=7]", "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "Same user id may VERIFY but not then CONFIRM the same disconnect; a different user id confirms successfully."
        test_recipe:
          setup: ["Project; one disconnect at REPORTED_DISCONNECTED x FIELD_VERIFIED with verified_by_user_id ut-1."]
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "SoD2", address: "9 Role St", lot_area_sqft: 12000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/utility-disconnects", payload: { utility_type: "ELECTRIC", provider_name: "City Power", disconnect_window_start: "2026-08-03T08:00:00Z", disconnect_window_end: "2026-08-03T10:00:00Z" }, as: UtilityCoordinator, captures: { ud_id: $.data.id } }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "REPORT_DISCONNECTED" }, as: UtilityCoordinator, as_user_id: "ut-0" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "VERIFY" }, as: UtilityCoordinator, as_user_id: "ut-1" }
          trigger:
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "CONFIRM" }, as: UtilityCoordinator, as_user_id: "ut-1", captures: { err: $.data.error_id } }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "CONFIRM" }, as: UtilityCoordinator, as_user_id: "ut-2", captures: { v_st: $.data.verification_status } }
          assert:
            - "${err} == ERR_SOD_VIOLATION (confirmer == verifier)"
            - "with a different user: ${v_st} == CONFIRMED"

      - name: sod_engineering_certify_by_author_rejected
        claim_type: rbac_denial
        grounds: ["validations[priority=7]", "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "The authoring engineer (author_user_id) may not CERTIFY their own survey even with the PeerReviewEngineer role; a different peer certifies successfully."
        test_recipe:
          setup: ["Project; engineering survey SUBMITTED by user eng-9."]
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "SoD3", address: "11 Role St", lot_area_sqft: 12000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/engineering-surveys", payload: { demolition_method: "MECHANICAL", structural_stability_rating: "STABLE", max_structure_height_ft: 20, adjacent_structure_distance_ft: 50 }, as: StructuralEngineer, as_user_id: "eng-9", captures: { es_id: $.data.id } }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "SUBMIT" }, as: StructuralEngineer, as_user_id: "eng-9" }
          trigger:
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "CERTIFY" }, as: PeerReviewEngineer, as_user_id: "eng-9", captures: { err: $.data.error_id } }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "CERTIFY" }, as: PeerReviewEngineer, as_user_id: "eng-10", captures: { st: $.data.status } }
          assert:
            - "${err} == ERR_SOD_VIOLATION (certifier == author)"
            - "with a different peer user: ${st} == CERTIFIED"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_engineering_pin_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[project-pin-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Project.version: after a first successful pin advances the version, a second pin carrying the previously observed version is rejected ERR_STALE_VERSION (412); re-reading and re-pinning succeeds (supersede semantics)."
        test_recipe:
          setup:
            - "Project PRECONDITIONS_PENDING (clean COMPLETE survey); TWO CERTIFIED engineering surveys exist."
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "OCC1", address: "13 Role St", lot_area_sqft: 12000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/structure-surveys", payload: { structure_label: "Main" }, as: Surveyor, captures: { sv_id: $.data.id } }
            - { call: "POST /demolition/structure-surveys/${sv_id}/transition", payload: { action: "COMPLETE", hazmat_found: false, findings_summary: "clean" }, as: Surveyor }
            - { call: "POST /demolition/projects/${p_id}/engineering-surveys", payload: { demolition_method: "MECHANICAL", structural_stability_rating: "STABLE", max_structure_height_ft: 20, adjacent_structure_distance_ft: 50 }, as: StructuralEngineer, as_user_id: "oc-a-1", captures: { es1: $.data.id } }
            - { call: "POST /demolition/engineering-surveys/${es1}/transition", payload: { action: "SUBMIT" }, as: StructuralEngineer, as_user_id: "oc-a-1" }
            - { call: "POST /demolition/engineering-surveys/${es1}/transition", payload: { action: "CERTIFY" }, as: PeerReviewEngineer, as_user_id: "oc-p-1" }
            - { call: "POST /demolition/projects/${p_id}/engineering-surveys", payload: { demolition_method: "SELECTIVE_DECONSTRUCTION", structural_stability_rating: "STABLE", max_structure_height_ft: 20, adjacent_structure_distance_ft: 50 }, as: StructuralEngineer, as_user_id: "oc-a-2", captures: { es2: $.data.id } }
            - { call: "POST /demolition/engineering-surveys/${es2}/transition", payload: { action: "SUBMIT" }, as: StructuralEngineer, as_user_id: "oc-a-2" }
            - { call: "POST /demolition/engineering-surveys/${es2}/transition", payload: { action: "CERTIFY" }, as: PeerReviewEngineer, as_user_id: "oc-p-2" }
            - { call: "GET /demolition/projects/${p_id}", as: SiteSupervisor, captures: { p_v: $.data.version } }
          trigger:
            - { call: "POST /demolition/projects/${p_id}/engineering-pin", payload: { engineering_survey_id: "${es1}", expected_project_version: "${p_v}" }, as: SiteSupervisor, captures: { pin1: $.data.pinned_engineering_survey_id, v_after: $.data.version } }
            - { call: "POST /demolition/projects/${p_id}/engineering-pin", payload: { engineering_survey_id: "${es2}", expected_project_version: "${p_v}" }, as: SiteSupervisor, captures: { err: $.data.error_id } }
            - { call: "POST /demolition/projects/${p_id}/engineering-pin", payload: { engineering_survey_id: "${es2}", expected_project_version: "${v_after}" }, as: SiteSupervisor, captures: { pin2: $.data.pinned_engineering_survey_id } }
          assert:
            - "first pin succeeds: ${pin1} == ${es1} and ${v_after} == ${p_v} + 1"
            - "stale second pin: ${err} == ERR_STALE_VERSION (HTTP 412)"
            - "with fresh version the supersede succeeds: ${pin2} == ${es2}"

      - name: occ_permit_renewal_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[permit-renew-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on DemolitionPermit.version: after one renewal extends expiry by 90 days and bumps the version, a second renewal with the pre-renewal version fails ERR_STALE_VERSION; with the fresh version it extends again."
        test_recipe:
          setup:
            - "Project with permit ACTIVE (activated 2026-08-01T09:00:00Z, expires 2026-10-30T09:00:00Z)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/projects", payload: { name: "OCC2", address: "15 Role St", lot_area_sqft: 12000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/utility-disconnects", payload: { utility_type: "GAS", provider_name: "City Gas", disconnect_window_start: "2026-08-02T08:00:00Z", disconnect_window_end: "2026-08-02T10:00:00Z" }, as: UtilityCoordinator, captures: { ud_id: $.data.id } }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "REPORT_DISCONNECTED" }, as: UtilityCoordinator, as_user_id: "oc2-r-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "VERIFY" }, as: UtilityCoordinator, as_user_id: "oc2-v-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "CONFIRM" }, as: UtilityCoordinator, as_user_id: "oc2-c-1" }
            - { call: "POST /demolition/projects/${p_id}/permits", payload: { permit_number: "P-1", gross_floor_area_sqft: 15000 }, as: PermitCoordinator, captures: { pm_id: $.data.id } }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "SUBMIT" }, as: PermitCoordinator }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "APPROVE" }, as: AuthorityReviewer }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "ACTIVATE" }, as: PermitCoordinator }
            - { call: "GET /demolition/projects/${p_id}/permits", as: PermitCoordinator, captures: { pm_v: "$.data[0].version" } }
          trigger:
            - { call: "POST /demolition/permits/${pm_id}/renewals", payload: { expected_permit_version: "${pm_v}" }, as: PermitCoordinator, captures: { exp1: $.data.expires_at, v1: $.data.version, rc1: $.data.renewal_count } }
            - { call: "POST /demolition/permits/${pm_id}/renewals", payload: { expected_permit_version: "${pm_v}" }, as: PermitCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /demolition/permits/${pm_id}/renewals", payload: { expected_permit_version: "${v1}" }, as: PermitCoordinator, captures: { exp2: $.data.expires_at, rc2: $.data.renewal_count } }
          assert:
            - "first renewal: ${exp1} == 2027-01-28T09:00:00Z (+90d) and ${rc1} == 1 and ${v1} == ${pm_v} + 1"
            - "stale renewal: ${err} == ERR_STALE_VERSION (HTTP 412)"
            - "fresh renewal: ${exp2} == 2027-04-28T09:00:00Z and ${rc2} == 2"

      - name: version_increments_on_every_mutation
        claim_type: derived_field_reconciliation
        grounds: [entities.Project]
        distinguishing_aspect: "Project.version is 1 at create, 2 after the first survey create (auto DRAFT->SURVEY_PHASE), 3 after survey COMPLETE bubble-up; StructureSurvey.version bumps independently on its own transition."
        test_recipe:
          setup: ["Project DRAFT."]
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Ver", address: "17 Role St", lot_area_sqft: 12000 }, as: ContractorAdmin, captures: { p_id: $.data.id, v0: $.data.version } }
          trigger:
            - { call: "POST /demolition/projects/${p_id}/structure-surveys", payload: { structure_label: "Main" }, as: Surveyor, captures: { sv_id: $.data.id, sv_v: $.data.version } }
            - { call: "GET /demolition/projects/${p_id}", as: SiteSupervisor, captures: { v1: $.data.version } }
            - { call: "POST /demolition/structure-surveys/${sv_id}/transition", payload: { action: "COMPLETE", hazmat_found: false, findings_summary: "clean" }, as: Surveyor, captures: { sv_v2: $.data.version } }
            - { call: "GET /demolition/projects/${p_id}", as: SiteSupervisor, captures: { v2: $.data.version } }
          assert:
            - "${v0} == 1, ${v1} == 2, ${v2} == 3 (cascades count as mutations)"
            - "survey version: ${sv_v} == 1 at create, ${sv_v2} == 2 after COMPLETE"

      - name: ticket_disposed_tons_reconciled_on_receive
        claim_type: derived_field_reconciliation
        grounds: [entities.DebrisTicket.fields.disposed_tons, calculations.diversion_rate]
        excluded_because:
          difficulty_instance: "compensating_invariant / debris_mass_invariant_through_receive_and_void"
          rationale: "RECEIVE counter moves (landfill_tons 6.0 / diverted_tons 4.0) asserted in the named §1.8 instance; disposed_tons = gross - diverted is the same derivation."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_read_yields_write_effects
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the POST response and a subsequent GET of the same project show identical status/counters — no eventual lag."
        test_recipe:
          setup: ["Project created; one survey created."]
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Cons", address: "19 Role St", lot_area_sqft: 12000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/structure-surveys", payload: { structure_label: "Main" }, as: Surveyor }
          trigger:
            - { call: "GET /demolition/projects/${p_id}", as: SiteSupervisor, captures: { st: $.data.status, v: $.data.version } }
          assert:
            - "GET immediately after the cascade shows ${st} == SURVEY_PHASE and ${v} == 2 — the auto-transition is visible in the same logical instant"
