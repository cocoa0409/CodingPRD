              as: TransactionManager
              as_user_id: tm-001
              captures: { post_score: "$.data.score", post_tier: "$.data.tier", post_complaint: "$.data.complaint_penalty", post_sla: "$.data.sla_penalty" }
          assert:
            - "${pre_score} == 92 and ${pre_tier} == LOW and ${pre_complaint} == 0 (PRE_AWARD reads only the counterparty row: rating 0, capital 0, approvals (2-1)*8 = 8)"
            - "${post_score} == 62 and ${post_tier} == MEDIUM"
            - "${post_complaint} == 30 (1 case over 4 transferred loans = 25.00 percent, 25.00 * 3 = 75 capped at 30)"
            - "${post_sla} == 0 (acknowledged 1 day after opening and resolved 5 days after opening, both inside the 5- and 30-day deadlines)"
            - "a second GET /msr/counterparties/${buyer_id}/risk-score with no variant still returns 92, proving PRE_AWARD is the default and ignores post-transfer history"
            - "GET /msr/counterparties/${buyer_id} shows servicer_rating TIER_1 and net_worth_cents 1200000000 unchanged — no Counterparty field moved between the two reads"

  - rule_id: combinatorial_formula
    instances:

      - name: msr_fair_value_combines_delinquency_multiplier_and_loss_mit_surcharge
        grounds:
          - calculations.msr_fair_value
          - calculations.msr_fair_value.constants.DELINQUENCY_COST_MULTIPLIER
          - calculations.msr_fair_value.constants.LOSS_MIT_SURCHARGE_CENTS
          - entities.Loan.fields.delinquency_bucket
          - entities.Loan.fields.loss_mit_status
          - entities.Loan.fields.servicing_fee_bps
          - entities.Loan.fields.escrow_balance_cents
        distinguishing_aspect: |
          Combinatorial in the SERVICING-COST direction: the per-loan cash flow multiplies the base
          cost-to-service by DELINQUENCY_COST_MULTIPLIER[delinquency_bucket] and then adds
          LOSS_MIT_SURCHARGE_CENTS[loss_mit_status] before discounting, so three independent inputs
          (bucket, loss-mit status, escrow float) interact inside one loan's value. Two pools that
          differ ONLY in loan V-0002's bucket/loss-mit pair value at 209186 versus 246489: that one
          loan is worth 43202 as DQ_60_89 + FORBEARANCE and 80505 as CURRENT + NONE, a 37303 swing
          that neither factor alone explains (2.5x cost multiplier AND a 1500-per-year surcharge).
        test_recipe:
          setup:
            - "Seller Alpha, AssumptionSet desk-base (cost_to_service_annual_cents 9000), RateCurveSnapshot C1 at 4000 bps."
            - "Pool-V holds Fixture V; loan V-0002 is DQ_60_89 with loss_mit_status FORBEARANCE."
            - "Pool-Vb is byte-identical to Pool-V except loan Vb-0002 is CURRENT with loss_mit_status NONE."
            - "Both pools are TAPE_LOCKED; Pool-V already has a DETERMINISTIC_STATIC valuation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-001
            - call: "POST /msr/counterparties"
              payload: { legal_name: "Alpha Servicing LLC", role_type: SELLER, net_worth_cents: 500000000, servicer_rating: TIER_1, agency_approvals: [FNMA, FHLMC] }
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { seller_id: "$.data.id" }
            - call: "POST /msr/assumption-sets"
              payload: { assumption_name: "desk-base", cpr_pct: 8.0, discount_rate_pct: 10.0, cost_to_service_annual_cents: 9000, float_earnings_rate_pct: 4.0, projection_years: 3 }
              as: ValuationAnalyst
              as_user_id: va-001
              captures: { as_id: "$.data.id" }
            - call: "POST /msr/rate-curves"
              payload: { as_of_date: "2026-07-31", base_rate_bps: 4000, primary_secondary_spread_bps: 85 }
              as: HedgeDesk
              as_user_id: hd-001
            - call: "POST /msr/portfolios"
              payload: { seller_id: "${seller_id}", portfolio_name: "Pool-V", agency_type: FNMA }
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { pfv_id: "$.data.id" }
            - call: "POST /msr/portfolios/${pfv_id}/loans"
              payload: { loan_number: "V-0001", upb_cents: 20000000, note_rate_pct: 6.5, servicing_fee_bps: 25, escrow_balance_cents: 300000, suspense_balance_cents: 0, delinquency_bucket: CURRENT, loss_mit_status: NONE, state_code: "CA" }
              as: SellerServicer
              as_user_id: "${seller_id}"
            - call: "POST /msr/portfolios/${pfv_id}/loans"
              payload: { loan_number: "V-0002", upb_cents: 15000000, note_rate_pct: 7.25, servicing_fee_bps: 25, escrow_balance_cents: 200000, suspense_balance_cents: 50000, delinquency_bucket: DQ_60_89, loss_mit_status: FORBEARANCE, state_code: "TX" }
