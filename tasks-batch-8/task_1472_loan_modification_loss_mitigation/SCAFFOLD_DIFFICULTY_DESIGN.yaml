        grounds:
          - state_machines.Appeal.SUBMITTED_to_OVERTURNED
          - state_machines.DenialNotice.APPEALED_to_SUPERSEDED
          - state_machines.ForeclosureCase.SALE_SCHEDULED_to_SALE_HOLD
        distinguishing_aspect: |
          Depth-3 chain from POST /appeals/{id}/decision: appeal overturn mutates the
          DenialNotice (L1 SUPERSEDED); the supersession moves the Application back to
          the blocking state COMPLETE_PACKAGE (L2); the application entering a blocking
          state forces the loan's SALE_SCHEDULED ForeclosureCase to SALE_HOLD (L3).
