            - "regeneration: ${tf1_st} == VOIDED (superseded) and new draft ${tf2} has ${gp2} == 60000"

      - name: tax_form_finalized_blocks_then_void_allows
        claim_type: conditional_action
        grounds: ["errors[ERR_TAX_FORM_FINALIZED_EXISTS]", "state_machines.TaxForm1099"]
        distinguishing_aspect: "A FINALIZED form locks the year: regeneration returns ERR_TAX_FORM_FINALIZED_EXISTS until the finalized form is voided; finalize from DRAFT is the only valid finalize."
        test_recipe:
          setup: ["agent with a DRAFT 2026 form"]
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Lock Lois", email: "ll5@x.com", license_number: "LIC-LK2", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /brokerage/agents/${ag_id}/tax-forms"
              payload: { tax_year: 2026 }
              as: BrokerAdmin
              captures: { tf: $.data.id }
          trigger:
            - call: "POST /brokerage/tax-forms/${tf}/finalize"
              payload: {}
              as: BrokerAdmin
              captures: { st1: $.data.status }
            - call: "POST /brokerage/agents/${ag_id}/tax-forms"
              payload: { tax_year: 2026 }
              as: BrokerAdmin
              captures: { err: $.data.error_id }
            - call: "POST /brokerage/tax-forms/${tf}/void"
              payload: {}
              as: BrokerAdmin
              captures: { st2: $.data.status }
            - call: "POST /brokerage/agents/${ag_id}/tax-forms"
              payload: { tax_year: 2026 }
              as: BrokerAdmin
              captures: { st3: $.data.status }
          assert:
            - "${st1} == FINALIZED; regeneration blocked with ${err} == ERR_TAX_FORM_FINALIZED_EXISTS"
            - "after void (${st2} == VOIDED) regeneration succeeds: ${st3} == DRAFT"

      - name: tax_year_range_validation
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_TAX_YEAR_INVALID]"]
        distinguishing_aspect: "tax_year before the agent's join year (2024 < 2025) and after the clock year (2027 > 2026) are both ERR_TAX_YEAR_INVALID."
        test_recipe:
          setup: ["agent joined 2025-09-01, clock at default 2026-08-01"]
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Year Yara", email: "yy@x.com", license_number: "LIC-TY1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id }
          trigger:
            - call: "POST /brokerage/agents/${ag_id}/tax-forms"
              payload: { tax_year: 2024 }
              as: BrokerAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /brokerage/agents/${ag_id}/tax-forms"
              payload: { tax_year: 2027 }
              as: BrokerAdmin
              captures: { e2: $.data.error_id }
          assert:
            - "${e1} == ERR_TAX_YEAR_INVALID and ${e2} == ERR_TAX_YEAR_INVALID"

      - name: debit_write_off_floor_and_audit_trail
        claim_type: boundary_edge
        grounds: ["calculations.debit_balance_reconciliation", "errors[ERR_WRITE_OFF_EXCEEDS_DEBIT]", "errors[ERR_DEBIT_ADJUSTMENT_INVALID]"]
        distinguishing_aspect: "Write-off floor at zero: +50000 manual debit then -20000 write-off leaves 30000 with an exact running-balance audit trail; a -30001 write-off is rejected ERR_WRITE_OFF_EXCEEDS_DEBIT and amount 0 is ERR_DEBIT_ADJUSTMENT_INVALID."
        test_recipe:
          setup: ["agent with debit 30000 after the two adjustments"]
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Debt Doug", email: "dd3@x.com", license_number: "LIC-DB1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /brokerage/agents/${ag_id}/debit-adjustments"
              payload: { amount_cents: 50000, reason: "advance E&O" }
              as: BrokerAdmin
              captures: { bal1: $.data.resulting_balance_cents }
            - call: "POST /brokerage/agents/${ag_id}/debit-adjustments"
              payload: { amount_cents: -20000, reason: "goodwill write-off" }
              as: BrokerAdmin
              captures: { bal2: $.data.resulting_balance_cents }
          trigger:
            - call: "POST /brokerage/agents/${ag_id}/debit-adjustments"
              payload: { amount_cents: -30001, reason: "too much" }
              as: BrokerAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /brokerage/agents/${ag_id}/debit-adjustments"
              payload: { amount_cents: 0, reason: "no-op" }
              as: BrokerAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /brokerage/ledger-entries?agent_id=${ag_id}"
              payload: {}
              as: Auditor
              captures: { t0: "$.data[0].entry_type", b0: "$.data[0].resulting_balance_cents", t1: "$.data[1].entry_type", b1: "$.data[1].resulting_balance_cents" }
            - call: "GET /brokerage/agents/${ag_id}"
              payload: {}
              as: Auditor
              captures: { deb: $.data.debit_balance_cents }
          assert:
            - "${bal1} == 50000 and ${bal2} == 30000"
            - "${e1} == ERR_WRITE_OFF_EXCEEDS_DEBIT and ${e2} == ERR_DEBIT_ADJUSTMENT_INVALID"
            - "audit trail: ${t0} == MANUAL_DEBIT (${b0} == 50000), ${t1} == DEBIT_WRITE_OFF (${b1} == 30000); ${deb} == 30000"

      - name: deal_void_reverses_trust_receipt
        claim_type: compensation
        grounds: [calculations.trust_conservation, state_machines.Deal.CLOSED_to_VOIDED, entities.TrustTransaction]
        distinguishing_aspect: "Compensation side effect: voiding a CLOSED deal posts RECEIPT_REVERSAL -1000000, zeroes trust_received_cents, and returns the global trust position to its pre-close value."
        test_recipe:
          setup: ["agent ACTIVE; deal gross 1000000 CLOSED (trust receipt posted)"]
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Void Vera", email: "vv3@x.com", license_number: "LIC-VD1", joined_at: "2025-09-01" }
