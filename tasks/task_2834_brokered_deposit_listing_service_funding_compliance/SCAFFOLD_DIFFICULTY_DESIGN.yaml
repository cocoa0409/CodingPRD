            - call: "POST /broker-agreements/${agr_l_id}/diligence-actions"
              payload: { action: "SUSPEND" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /broker-agreements/${agr_l_id}/diligence-actions"
              payload: { action: "RESUME_DILIGENCE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /broker-agreements/${agr_l_id}/diligence-actions"
