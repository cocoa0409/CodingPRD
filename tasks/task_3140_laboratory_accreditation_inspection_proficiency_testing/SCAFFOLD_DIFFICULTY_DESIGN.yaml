  - rule_id: boundary_precision_check
    instances:

      - name: pt_event_score_exactly_80_is_satisfactory
        grounds:
          - calculations.pt_event_score
          - entities.PTResult.fields.event_evaluation
        distinguishing_aspect: "Boundary on the PT event-score metric via POST /pt-results: event_score == 80.0 exactly (4 of 5 analytes >= 80, no critical failure) is SATISFACTORY because the threshold is >= 80.0, not > — and a 79 analyte score on the failing fifth analyte proves the per-analyte >= 80 boundary is also inclusive."
        test_recipe:
          setup:
            - "Clock default. Lab with one ACTIVE CHEMISTRY enrollment (section assigned). PT subscription with analytes: glucose (critical), plus sodium, potassium, chloride, calcium (non-critical)."
            - "One shipment S."
          setup_api_calls:
            - call: "POST /laboratories"
              payload: { name: "Boundary Lab", clia_number: "45D0000050" }
              as: AccreditationOfficer
              captures: { lab_id: $.data.id }
            - call: "POST /enrollments"
              payload: { laboratory_id: "${lab_id}", discipline: "CHEMISTRY" }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /sections"
              payload: { enrollment_id: "${enr_id}", section_name: "Chem", critical_testing: false }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /checklist-editions"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /sections/${sec_id}/assign-checklist"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /pt-subscriptions"
              payload: { enrollment_id: "${enr_id}", analytes: [{ name: "glucose", critical: true }, { name: "sodium", critical: false }, { name: "potassium", critical: false }, { name: "chloride", critical: false }, { name: "calcium", critical: false }] }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /pt-shipments"
              payload: { subscription_id: "${sub_id}", event_code: "C-2026-A" }
