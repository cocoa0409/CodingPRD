            - "Spawned case ${spawned_tc1}.status == RECEIVED with reopened_from_case_id == ${c_tc1} (hop 3, caused by hop 2's transition side effect)"
            - "ClinicalReview.${cr_tc1}.status == SUPERSEDED (hop 4, caused by the new review context created at hop 3)"
            - "Member.open_case_count after == open_case_count before + 1 (spawned case counted; source case was already excluded when CLOSED)"

      - name: ire_overturn_effectuation_referral_cascade
