  # ---------------- RetentionSample ----------------
  - method: POST
    path: "/retention-samples"
    description: "Draw a retention aliquot from a released lot and store it in a cabinet for a half-open interval"
    roles: [LabTech]
    code: 201
    input: [sample_lot_id, cabinet_id, quantity_g, stored_from, stored_until]
    output: RetentionSample
    side_effects:
      - "runs calculations.retention_slot_occupancy: writes slot_count and admits only when the aggregate slot demand over the overlapping half-open intervals fits capacity_slots"
      - "runs calculations.sample_mass_ledger: raises SampleLot.allocated_g by quantity_g and lowers available_g"
      - "if available_g reaches 0: SampleLot disposition_status RELEASED -> CONSUMED"

  - method: GET
    path: "/retention-samples"
    description: "List retention aliquots, filtered by lot, cabinet or status"
    roles: [AccountManager, TechnicalDirector, Flavorist, RegulatoryAffairs, LabTech, PurchasingManager]
    code: 200
    input: ["sample_lot_id?", "cabinet_id?", "status?", "limit?", "offset?"]
    output: RetentionSample[]
    side_effects: []

  - method: GET
    path: "/retention-samples/{retention_id}"
    description: "Read one retention aliquot"
    roles: [AccountManager, TechnicalDirector, Flavorist, RegulatoryAffairs, LabTech, PurchasingManager]
    code: 200
    input: []
    output: RetentionSample
    side_effects: []

  - method: POST
    path: "/retention-samples/{retention_id}/withdraw"
    description: "Withdraw a stored aliquot, freeing both its cabinet slots and its grams"
    roles: [LabTech]
    code: 200
    input: [withdrawal_reason]
    output: RetentionSample
    side_effects:
      - "STORED -> WITHDRAWN with withdrawn_at set to the logical clock"
      - "the row leaves both calculations.retention_slot_occupancy and calculations.sample_mass_ledger, restoring cabinet.slots_available and lot.available_g exactly"
      - "if the lot was CONSUMED and available_g > 0 afterwards: disposition_status CONSUMED -> RELEASED"

