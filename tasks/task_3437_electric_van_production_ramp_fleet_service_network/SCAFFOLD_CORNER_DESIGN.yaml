      - name: close_month_with_no_in_service_fleet_rejected
        claim_type: Input Set Filtering
        grounds:
          - calculations.uptime_credit
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "The uptime input set is empty: with zero vehicles in {AT_DEPOT, COMMISSIONED} for the customer, close-month divides by an empty fleet and is rejected with ERR_INVALID_STATE rather than producing 100%."
        test_recipe:
          setup:
            - "Logical clock set; customer exists with a ROUTE_DAY contract (committed 97.0, fee 2000000, start 2026-09-01) but no vehicles at all."
          setup_api_calls:
            - *c_clock
            - *c_cust
            - call: "POST /evfleet/uptime-contracts"
              payload: { fleet_customer_id: "${cust_id}", committed_uptime_pct: 97.0, monthly_service_fee_cents: 2000000, pro_rating: "ROUTE_DAY", measurement_start_date: "2026-09-01" }
              as: PlatformAdmin
              captures: { uc_id: $.data.id }
          trigger:
