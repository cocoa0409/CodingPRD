            - call: "POST /senior-games/medical-screenings"
              payload: { athlete_id: "${ath_b_id}", screened_by_user_id: "md-lopez", systolic_bp: 128, resting_hr: 70, prior_cardiac_event: false }
              as: MedicalDirector
            - call: "POST /senior-games/sport-entries/${en_a_id}/review"
              payload: { decision: "TAKE_UP" }
              as: RegistrationOfficer
            - call: "POST /senior-games/sport-entries/${en_a_id}/review"
              payload: { decision: "ACCEPT" }
              as: RegistrationOfficer
            - call: "POST /senior-games/sport-entries/${en_b_id}/review"
              payload: { decision: "TAKE_UP" }
              as: RegistrationOfficer
            - call: "POST /senior-games/sport-entries/${en_b_id}/review"
              payload: { decision: "WAITLIST" }
              as: RegistrationOfficer
              captures: { en_b_status_0: $.data.status }
          trigger:
            - call: "POST /senior-games/sport-entries/${en_a_id}/withdraw"
              payload: { reason: "travel cancelled" }
              as: RegistrationOfficer
              captures: { en_a_status: $.data.status }
            - call: "GET /senior-games/sport-entries/${en_b_id}"
              payload: {}
              as: RegistrationOfficer
              captures: { en_b_status_1: $.data.status }
            - call: "GET /senior-games/sport-events/${ev_id}"
              payload: {}
              as: RegistrationOfficer
              captures: { ev_status_1: $.data.status, ev_slots_1: $.data.available_slots, ev_count_1: $.data.accepted_entry_count }
            - call: "POST /senior-games/games-editions/${ed_id}/ops-run"
              payload: {}
              as: GamesAdmin
              captures: { ed_epoch_1: $.data.ops_epoch, ed_prov_1: $.data.provisional_impact_cents, ed_status_1: $.data.status }
            - call: "GET /senior-games/sport-entries/${en_b_id}"
              payload: {}
              as: RegistrationOfficer
              captures: { en_b_status_2: $.data.status }
            - call: "GET /senior-games/sport-events/${ev_id}"
              payload: {}
              as: RegistrationOfficer
              captures: { ev_status_2: $.data.status, ev_slots_2: $.data.available_slots, ev_count_2: $.data.accepted_entry_count }
            - call: "POST /senior-games/games-editions/${ed_id}/ops-run"
              payload: {}
              as: GamesAdmin
              captures: { ed_epoch_2: $.data.ops_epoch, ed_prov_2: $.data.provisional_impact_cents }
            - call: "GET /senior-games/sport-entries/${en_b_id}"
              payload: {}
              as: RegistrationOfficer
              captures: { en_b_status_3: $.data.status }
          assert:
            - "${en_b_status_0} == \"WAITLISTED\" from the review, and ${en_a_status} == \"WITHDRAWN\" from the withdrawal"
            - "${ev_status_1} == \"UNDERSUBSCRIBED\" with ${ev_count_1} == 0 and ${ev_slots_1} == 1: the withdrawal freed the slot and dropped the event below min_entries_to_stage in the same write"
            - "${en_b_status_1} == \"WAITLISTED\": with a free slot and a fully eligible candidate, the system still does not promote outside a checkpoint"
            - "${ed_epoch_1} == 1 and ${en_b_status_2} == \"ACCEPTED\": phase 3 of the single ops-run call performed the promotion"
            - "${ev_status_2} == \"OPEN\" with ${ev_count_2} == 1 and ${ev_slots_2} == 0: the promotion's own side effects carried the event back UNDERSUBSCRIBED -> OPEN because accepted_entry_count regained min_entries_to_stage"
            - "${ed_prov_1} == 600880: phase 6 recomputed provisional_impact_cents over 2 REGISTERED heads (2 + 3.6 visitor heads = 5.6 * 18500 * 4 = 414400, then * 1.45), and withdrawing an ENTRY left both athletes' registration_status untouched"
            - "${ed_status_1} == \"REGISTRATION_OPEN\": the checkpoint advanced no status step, since the logical clock is still before the registration deadline"
            - "${ed_epoch_2} == 2, ${ed_prov_2} == 600880 and ${en_b_status_3} == \"ACCEPTED\": a second checkpoint is idempotent in effect — the waitlist is now empty, so phase 3 is the declared silent no-op"

      - name: corner_layer_cascading_side_effects_four_level_chain_end_to_end
        claim_type: N-level chain verified end-to-end
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.Venue.OPEN_to_CLOSED
          - state_machines.SessionSlot.SCHEDULED_to_DISPLACED
          - state_machines.PersonnelAssignment.CONFIRMED_to_RELEASED
          - entities.Personnel.fields.assigned_minutes_total
        excluded_because:
          difficulty_instance: venue_close_cascades_slots_assignments_and_personnel_minutes_ledger
          rationale: "The layer's own claim — one write propagating four levels down (Venue -> SessionSlot -> PersonnelAssignment -> Personnel.assigned_minutes_total) with the SportEvent SEEDED -> SCHEDULE_HOLD roll-up and the minutes ledger reconciled at every level — is exactly what that §1.8 instance drives and asserts; repeating it here would duplicate the deepest chain in the scaffold rather than probe a new corner."

      - name: corner_layer_cascading_side_effects_ordering_and_ledger_reversal
        claim_type: Ordering sensitivity and reversal
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.Athlete.REGISTERED_to_WITHDRAWN
          - state_machines.VillageStay.RESERVED_to_CANCELLED
          - entities.AccommodationBlock.fields.reserved_bed_nights
        excluded_because:
          difficulty_instance: athlete_withdraw_cascades_entry_event_slot_and_bed_night_ledger
          rationale: "Ordering sensitivity within a cascade — the entry must leave ACCEPTED before SportEvent capacity is restored, and the stay must be cancelled before the bed-night ledger is decremented — plus the exact reversal of both ledgers is the declared subject of that §1.8 instance, which reconciles every counter before and after the single withdraw."

      - name: corner_layer_dual_variant_selection_by_context
        claim_type: Variant Selection
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.age_group_assignment.variants
          - entities.GamesEdition.fields.age_basis
        excluded_because:
          difficulty_instance: age_basis_variant_flips_athlete_age_group_band
          rationale: "Variant selection driven by configuration — the same date_of_birth landing in a different age_group_code under REFERENCE_DATE than under FIRST_COMPETITION_DAY, with the band boundary chosen so the two variants disagree — is that §1.8 instance's whole construction, including the eligibility knock-on."

      - name: corner_layer_dual_variant_divergence_and_switch_delta
        claim_type: Variant Divergence and reconciliation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.economic_impact_projection.variants
          - entities.GamesEdition.fields.provisional_impact_cents
          - entities.GamesEdition.fields.final_impact_cents
        excluded_because:
          difficulty_instance: economic_impact_provisional_versus_final_divergence
          rationale: "Both variants on one database with a computed delta — provisional_forward_looking at 901320 against final_chronological at 375550, with provisional deliberately left in place after finalization so the pair stays observable — is asserted end to end in that §1.8 instance."

  - section: consistency_model
    instances:

      - name: corner_consistency_immediate_derived_state_visible_without_a_reread
        claim_type: Immediate consistency
        grounds:
          - complexity_profile.consistency_model[immediate]
          - calculations.athlete_fee_settlement
          - calculations.medical_risk_score
          - calculations.bed_night_occupancy
          - entities.SportEvent.fields.available_slots
        distinguishing_aspect: "Every derived value this API owns is settled inside the response of the write that causes it — pay-fees returns the whole seven-key fee_breakdown and the flipped registration_status, a screening returns its own risk_score and recommendation, a stay returns nights and total_charge_cents — and every cross-row ledger (SportEvent capacity, AccommodationBlock bed-nights, the Athlete medical dimension) is already correct on the very next read with no settling call in between. The one bounded exception is stated too: provisional_impact_cents is still 0 for a REGISTERED athlete because that recompute is bound to the ops-run checkpoint by design, which is a scheduled phase and not a denormalization lag."
        test_recipe:
          setup:
            - "Standard fixture: one edition in REGISTRATION_OPEN, one LOW-contact TRACK sport, one 60-64 event T100M with capacity 8 and min_entries_to_stage 1."
            - "One AccommodationBlock with bed_capacity 4 and nightly_rate_cents 12000 for the stay leg."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
            - call: "POST /senior-games/sports"
              payload: { sport_code: "TRACK", name: "Track and Field", contact_class: "LOW", mark_direction: "LOWER_IS_BETTER", required_certification_level: 2, min_age: 50 }
              as: GamesAdmin
              captures: { sp_track_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T100M", age_group_code: "60-64", gender_division: "MEN", entry_fee_cents: 6000, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_id: $.data.id, ev_slots_0: $.data.available_slots, ev_count_0: $.data.accepted_entry_count }
            - call: "POST /senior-games/games-editions/${ed_id}/open-registration"
              payload: {}
              as: GamesAdmin
            - call: "POST /senior-games/accommodation-blocks"
              payload: { games_edition_id: "${ed_id}", name: "Maple Hall", bed_capacity: 4, nightly_rate_cents: 12000 }
              as: GamesAdmin
              captures: { blk_id: $.data.id, blk_v0: $.data.version, blk_nights_0: $.data.reserved_bed_nights }
          trigger:
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Ada Fenn", email: "ada.fenn@example.org", date_of_birth: "1966-03-02", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { ath_id: $.data.id, fee_total_0: $.data.fee_total_cents, reg_status_0: $.data.registration_status, age_group_0: $.data.age_group_code, age_ref_0: $.data.age_at_reference }
            - call: "POST /senior-games/sport-entries"
              payload: { athlete_id: "${ath_id}", sport_event_id: "${ev_id}", qualification_source: "ORGANIZER_INVITE" }
              as: RegistrationOfficer
              captures: { en_id: $.data.id, en_status_0: $.data.status, en_priority_0: $.data.qualification_priority }
            - call: "POST /senior-games/athletes/${ath_id}/pay-fees"
              payload: { amount_cents: 15500 }
              as: GamesAdmin
              captures: { fee_total_1: $.data.fee_total_cents, fee_paid_1: $.data.fee_paid_cents, reg_status_1: $.data.registration_status }
            - call: "GET /senior-games/athletes/${ath_id}"
              payload: {}
              as: RegistrationOfficer
              captures: { fee_total_2: $.data.fee_total_cents, reg_status_2: $.data.registration_status }
            - call: "POST /senior-games/medical-screenings"
              payload: { athlete_id: "${ath_id}", screened_by_user_id: "md-lopez", systolic_bp: 128, resting_hr: 70, prior_cardiac_event: false }
              as: MedicalDirector
              captures: { scr_risk: $.data.risk_score, scr_rec: $.data.recommendation, scr_contact: $.data.contact_sport_count }
            - call: "GET /senior-games/athletes/${ath_id}"
              payload: {}
              as: MedicalDirector
              captures: { med_status_1: $.data.medical_status }
            - call: "POST /senior-games/sport-entries/${en_id}/review"
              payload: { decision: "TAKE_UP" }
              as: RegistrationOfficer
            - call: "POST /senior-games/sport-entries/${en_id}/review"
              payload: { decision: "ACCEPT" }
              as: RegistrationOfficer
              captures: { en_status_1: $.data.status }
            - call: "GET /senior-games/sport-events/${ev_id}"
              payload: {}
              as: RegistrationOfficer
              captures: { ev_slots_1: $.data.available_slots, ev_count_1: $.data.accepted_entry_count, ev_status_1: $.data.status }
            - call: "POST /senior-games/village-stays"
              payload: { athlete_id: "${ath_id}", accommodation_block_id: "${blk_id}", check_in_date: "2026-09-09", check_out_date: "2026-09-14", expected_block_version: "${blk_v0}" }
              as: GamesAdmin
              captures: { stay_nights: $.data.nights, stay_charge: $.data.total_charge_cents, stay_status: $.data.status }
            - call: "GET /senior-games/accommodation-blocks/${blk_id}"
              payload: {}
              as: GamesAdmin
              captures: { blk_nights_1: $.data.reserved_bed_nights }
            - call: "GET /senior-games/games-editions/${ed_id}"
              payload: {}
              as: GamesAdmin
              captures: { ed_prov_0: $.data.provisional_impact_cents, ed_epoch_0: $.data.ops_epoch }
          assert:
            - "${ev_slots_0} == 8 and ${ev_count_0} == 0 in the creation response itself: the capacity ledger is derived at insert time, not on first read"
            - "${age_ref_0} == 60 and ${age_group_0} == \"60-64\" in the athlete creation response, computed from date_of_birth against age_reference_date 2026-12-31 with no second call"
            - "${fee_total_0} == 0 and ${reg_status_0} == \"PENDING_PAYMENT\": fee_total_cents is settled by pay-fees, so it is legitimately 0 beforehand rather than stale"
            - "${en_status_0} == \"SUBMITTED\" and ${en_priority_0} == 4, the ORGANIZER_INVITE priority, both present in the entry creation response"
            - "${fee_total_1} == 15500 and ${fee_paid_1} == 15500 and ${reg_status_1} == \"REGISTERED\" in the pay-fees response itself, together with fee_breakdown {entry_count: 1, event_fees_cents: 6000, subtotal_cents: 15500, discount_pct: 0.00, discount_cents: 0, discounted_cents: 15500, surcharge_cents: 0}"
            - "${fee_total_2} == ${fee_total_1} and ${reg_status_2} == ${reg_status_1}: the follow-up read reveals nothing the write response did not already carry"
            - "${scr_risk} == 7.5, ${scr_rec} == \"CLEARED\" and ${scr_contact} == 0 in the screening response, and ${med_status_1} == \"SCREENED_CLEARED\" on the immediately following athlete read — the driven dimension needs no settling call"
            - "${en_status_1} == \"ACCEPTED\" in the review response, and ${ev_count_1} == 1 with ${ev_slots_1} == 7 and ${ev_status_1} == \"OPEN\" on the immediately following event read, with no ops-run in between"
            - "${stay_nights} == 5, ${stay_charge} == 60000 and ${stay_status} == \"RESERVED\" in the stay creation response, while ${blk_nights_0} == 0 and ${blk_nights_1} == 5 bracket the ledger write"
            - "${ed_prov_0} == 0 and ${ed_epoch_0} == 0 even though one athlete is REGISTERED: provisional_impact_cents is bound to phase 6 of the ops-run checkpoint by design, which is the one derivation this API does not settle at write time"

      - name: corner_consistency_immediate_ledger_reconciles_after_source_removal
        claim_type: Immediate consistency after delete
        grounds:
          - complexity_profile.consistency_model[immediate]
          - state_machines.VillageStay.RESERVED_to_CANCELLED
          - entities.AccommodationBlock.fields.reserved_bed_nights
        excluded_because:
          difficulty_instance: village_stay_cancel_restores_block_bed_nights_and_frees_the_night
          rationale: "The remaining consistency claim — a derived aggregate being correct immediately after the source row is removed, with the freed night re-bookable on the very next request — is asserted in that §1.8 instance, which reconciles reserved_bed_nights across create, cancel and re-book without any intervening checkpoint."
