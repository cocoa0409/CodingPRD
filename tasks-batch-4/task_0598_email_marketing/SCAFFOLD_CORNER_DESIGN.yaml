      - name: import_row_disposition_conserves_rows_and_prefers_suppression
        claim_type: Correct Result
        grounds: [calculations.import_row_disposition, entities.ImportJob.fields.suppressed_count, entities.ImportJob.fields.duplicate_count]
        distinguishing_aspect: "The pinned per-row order is format -> suppression -> duplicate: the row sup@x.com, which is BOTH an existing (unsubscribed) subscriber AND a suppressed address, is counted as suppressed, never as duplicate. Across 6 rows the conservation identity holds exactly: 2 accepted + 1 rejected + 2 duplicate + 1 suppressed == 6."
        test_recipe:
          setup:
            - "One single-opt-in audience already holding x1@x.com (CONFIRMED) and sup@x.com (CONFIRMED then UNSUBSCRIBED, so sup@x.com is on the account suppression list). subscriber_count == 2."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "author@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { author: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { aud: $.data.id }
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "x1@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "sup@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { sup: $.data.id, suptok: $.data.unsubscribe_token }
            - call: "POST /subscribers/${sup}/unsubscribe"
              payload: { unsubscribe_token: "${suptok}" }
              as: Anonymous
            - call: "GET /audiences/${aud}"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { aud_v: $.data.version }
          trigger:
            - call: "POST /audiences/${aud}/import-jobs"
              payload:
                rows: [{ email: "bad-address" }, { email: "sup@x.com" }, { email: "x1@x.com" }, { email: "n1@x.com" }, { email: "n1@x.com" }, { email: "n2@x.com" }]
                expected_audience_version: "${aud_v}"
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { job: $.data.id, acc: $.data.accepted_count, rej: $.data.rejected_count, dup: $.data.duplicate_count, sup_c: $.data.suppressed_count, st: $.data.status, rc: $.data.row_count }
          assert:
            - "${rc} == 6"
            - "${acc} == 2   # n1@x.com (first occurrence) and n2@x.com"
            - "${rej} == 1   # 'bad-address' has no '@'"
            - "${dup} == 2   # x1@x.com already exists; n1@x.com repeats inside the batch"
            - "${sup_c} == 1 # sup@x.com is suppressed -- the suppression check runs BEFORE the duplicate check"
            - "${st} == \"PARTIAL\""
            - "INVARIANT: accepted + rejected + duplicate + suppressed == row_count -> 2 + 1 + 2 + 1 == 6"
            - "Audience.${aud}.subscriber_count == 4"
            - "ImportJob.${job}.created_subscriber_ids has length 2"

  # =========================================================================
  - section: validations
    instances:

      - name: review_forbidden_role_precedes_campaign_not_found
        claim_type: Priority Ordering
        grounds: ["validations[priority=2]", "validations[priority=5]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Role authorization (priority 2) runs before path existence (priority 5): a CampaignAuthor calling POST /campaigns/{nonexistent}/review gets 403 ERR_FORBIDDEN_ROLE, not 404 ERR_CAMPAIGN_NOT_FOUND."
        test_recipe:
          setup: ["One account with a CAMPAIGN_AUTHOR user."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "author@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { author: $.data.id }
          trigger:
            - call: "POST /campaigns/11111111-2222-4333-8444-555555555555/review"
              payload: { decision: "APPROVE" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err} == \"ERR_FORBIDDEN_ROLE\"   # NOT ERR_CAMPAIGN_NOT_FOUND"

      - name: schedule_in_past_precedes_empty_recipient_set
        claim_type: Priority conflict
        grounds: ["validations[priority=22]", "validations[priority=30]", "errors[ERR_SCHEDULE_IN_PAST]", "errors[ERR_EMPTY_RECIPIENT_SET]"]
        distinguishing_aspect: "Error-category pair (business_temporal, business_constraint): the request violates BOTH priority 22 (scheduled_at before the clock) and priority 30 (its segment matches zero subscribers); the temporal check wins with 422 ERR_SCHEDULE_IN_PAST."
        test_recipe:
          setup:
            - "One single-opt-in audience with 1 CONFIRMED subscriber whose engagement_score is 50."
            - "Segment SEG requires min_engagement_score 90, so it has 0 members."
            - "Campaign C1 targets SEG and is APPROVED. The clock is at its default 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", initial_send_credits: 100 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "author@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { author: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "appr@acme.com", user_role: "COMPLIANCE_APPROVER" }
              as: PlatformAdmin
              captures: { approver: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { aud: $.data.id }
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /audiences/${aud}/segments"
              payload: { name: "SEG", consent_states: ["CONFIRMED"], min_engagement_score: 90 }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { seg: $.data.id, mc: $.data.member_count }
            - call: "POST /templates"
              payload: { account_id: "${acct}", name: "T", subject: "S", html_body: "<a href=\"{{unsubscribe_url}}\">u</a>" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { tpl: $.data.id }
            - call: "POST /templates/${tpl}/publish"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", audience_id: "${aud}", template_id: "${tpl}", segment_id: "${seg}", name: "C1" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { c1: $.data.id }
            - call: "POST /campaigns/${c1}/submit-review"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /campaigns/${c1}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceApprover
              as_user_id: "${approver}"
            - call: "GET /accounts/${acct}"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { av: $.data.version }
          trigger:
            - call: "POST /campaigns/${c1}/schedule"
              payload: { scheduled_at: "2026-04-01T00:00:00Z", send_window_minutes: 60, expected_account_version: "${av}" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { err: $.data.error_id }
          assert:
            - "${mc} == 0"
            - "HTTP status == 422"
            - "${err} == \"ERR_SCHEDULE_IN_PAST\"   # NOT ERR_EMPTY_RECIPIENT_SET"
            - "Campaign.${c1}.status == \"APPROVED\""

      - name: empty_recipient_set_blocks_schedule
        claim_type: Violation → Error
        grounds: ["validations[priority=30]", "errors[ERR_EMPTY_RECIPIENT_SET]", calculations.campaign_recipient_snapshot]
        distinguishing_aspect: "With a future scheduled_at (so the temporal check passes) and a segment matching zero subscribers, the schedule is rejected with 422 ERR_EMPTY_RECIPIENT_SET and reserves no credits."
        test_recipe:
          setup:
            - "Identical to schedule_in_past_precedes_empty_recipient_set: one CONFIRMED subscriber scoring 50, one segment requiring 90, campaign C1 APPROVED against that segment."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", initial_send_credits: 100 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "author@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { author: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "appr@acme.com", user_role: "COMPLIANCE_APPROVER" }
              as: PlatformAdmin
              captures: { approver: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { aud: $.data.id }
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /audiences/${aud}/segments"
              payload: { name: "SEG", consent_states: ["CONFIRMED"], min_engagement_score: 90 }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { seg: $.data.id }
            - call: "POST /templates"
              payload: { account_id: "${acct}", name: "T", subject: "S", html_body: "<a href=\"{{unsubscribe_url}}\">u</a>" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { tpl: $.data.id }
            - call: "POST /templates/${tpl}/publish"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", audience_id: "${aud}", template_id: "${tpl}", segment_id: "${seg}", name: "C1" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { c1: $.data.id }
            - call: "POST /campaigns/${c1}/submit-review"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /campaigns/${c1}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceApprover
              as_user_id: "${approver}"
            - call: "GET /accounts/${acct}"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { av: $.data.version }
          trigger:
            - call: "POST /campaigns/${c1}/schedule"
              payload: { scheduled_at: "2026-05-02T10:00:00Z", send_window_minutes: 60, expected_account_version: "${av}" }
              as: CampaignAuthor
