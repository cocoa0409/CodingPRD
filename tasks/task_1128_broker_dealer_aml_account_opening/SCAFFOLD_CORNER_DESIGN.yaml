        grounds: [state_machines.Match314A.CONFIRMED_to_RESOLVED, state_machines.BrokerageAccount.aml_posture]
        distinguishing_aspect: "Resolving the only CONFIRMED match recomputes posture SEVERE -> STANDARD (no other elevation trigger); reinstate remains blocked while the match is CONFIRMED (ERR_MATCH_314A_UNRESOLVED) and succeeds after resolve."
        test_recipe:
          setup: ["OPEN LOW account with confirmed 314(a) match (RESTRICTED + SEVERE)."]
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep V12", crd_number: "CRD-V12" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "V12", tax_id: "TIN-V12", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-V12", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_id: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_id}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["CASH"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /aml/fincen-314a-requests", payload: { request_reference: "FIN-V12", subjects: [{ name: "V12", tax_id: "TIN-V12", subject_type: "INDIVIDUAL" }] }, as: ComplianceOfficer, captures: { req_id: "$.data.id" } }
            - { call: "POST /aml/fincen-314a-requests/${req_id}/scan", payload: {}, as: ComplianceOfficer }
            - { call: "GET /aml/fincen-314a-matches", payload: { request_id: "${req_id}" }, as: ComplianceOfficer, captures: { match_id: "$.data[0].id" } }
            - { call: "POST /aml/fincen-314a-matches/${match_id}/confirm", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /aml/accounts/${acct_id}/reinstate", payload: {}, as: ComplianceOfficer, captures: { err: "$.data.error_id" } }
            - { call: "POST /aml/fincen-314a-matches/${match_id}/resolve", payload: {}, as: ComplianceOfficer }
            - { call: "GET /aml/accounts/${acct_id}", payload: {}, as: ComplianceOfficer, captures: { posture: "$.data.aml_posture" } }
            - { call: "POST /aml/accounts/${acct_id}/reinstate", payload: {}, as: ComplianceOfficer, captures: { lc: "$.data.lifecycle_status" } }
          assert:
            - "captured err == ERR_MATCH_314A_UNRESOLVED"
            - "captured posture == STANDARD (SEVERE trigger cleared)"
            - "captured lc == OPEN"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: pagination_limit_bounds_rejected
        claim_type: standard_crud
        grounds: [response_envelope, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "limit=0 and limit=101 violate pagination defaults (min 1, max 100) -> ERR_INVALID_REQUEST (400); limit=100 is accepted."
        test_recipe:
          setup: ["Rep exists (one row to list)."]
          setup_api_calls:
            - { call: "POST /aml/reps", payload: { full_name: "Rep P1", crd_number: "CRD-P01" }, as: SystemAdmin }
          trigger:
            - { call: "GET /aml/reps", payload: { limit: 0 }, as: SystemAdmin, captures: { err0: "$.data.error_id" } }
            - { call: "GET /aml/reps", payload: { limit: 101 }, as: SystemAdmin, captures: { err101: "$.data.error_id" } }
            - { call: "GET /aml/reps", payload: { limit: 100 }, as: SystemAdmin, captures: { ok: "$.data" } }
          assert:
            - "captured err0 == ERR_INVALID_REQUEST and err101 == ERR_INVALID_REQUEST"
            - "limit=100 request succeeds with exactly 1 row"

      - name: alerts_filtered_list_scoped_by_account
        claim_type: computed_read
        grounds: [endpoints, entities.MonitoringAlert.fields.account_id]
