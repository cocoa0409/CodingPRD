            - { call: "POST /api/events/${ev}/open-registration", payload: {}, as: EventDirector }
            - { call: "POST /api/athletes", payload: { full_name: "Ann", date_of_birth: "2010-05-01" }, as: TeamCoach, as_user_id: "coach-1", captures: { a1: $.data.id } }
            - { call: "POST /api/athletes", payload: { full_name: "Bob", date_of_birth: "2010-06-01" }, as: TeamCoach, as_user_id: "coach-2", captures: { a2: $.data.id } }
            - { call: "POST /api/athletes", payload: { full_name: "Cat", date_of_birth: "2010-07-01" }, as: TeamCoach, as_user_id: "coach-3", captures: { a3: $.data.id } }
