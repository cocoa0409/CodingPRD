          Money boundary (strictly-greater comparison) at draw approval on two parallel
          holdbacks: cumulative approved == holdback_amount exactly (230000) creates NO
          pledge (excess == 0 is not > 0), while one cent over (230001) creates a pledge of
          exactly 1 cent. Distinct metric (integer cents) and endpoint (draw approve) from
          expire_deadline_date_boundary (date metric, expire endpoint).
