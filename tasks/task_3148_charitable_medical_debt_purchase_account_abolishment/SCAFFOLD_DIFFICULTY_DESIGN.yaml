      - call: POST /api/portfolios/${pf_id}/accounts
        payload:
          accounts:
          - external_ref: B1
            debtor_household_key: H1
            debtor_zip: '75001'
            debtor_state: TX
            household_size: 1
            annual_income_cents: 1000000
            is_insolvent: false
            balance_cents: 1000000
            accrued_adjustment_cents: 0
            reported_to_bureau: false
            bureau_name: null
            mailing_address: 1 Main St
          - external_ref: B2
            debtor_household_key: H1
            debtor_zip: '75001'
            debtor_state: TX
            household_size: 1
            annual_income_cents: 1000000
            is_insolvent: false
            balance_cents: 500000
            accrued_adjustment_cents: 0
            reported_to_bureau: false
            bureau_name: null
            mailing_address: 1 Main St
          - external_ref: B3
            debtor_household_key: H2
            debtor_zip: '75009'
            debtor_state: TX
            household_size: 1
            annual_income_cents: 1000000
            is_insolvent: false
            balance_cents: 700000
            accrued_adjustment_cents: 0
            reported_to_bureau: false
            bureau_name: null
            mailing_address: 9 Elm St
        as: PortfolioAnalyst
        captures:
          b1: $.data[0].id
          b2: $.data[1].id
          b3: $.data[2].id
      - call: POST /api/portfolios/${pf_id}/submit
        payload: {}
        as: PortfolioAnalyst
      - call: POST /api/portfolios/${pf_id}/screening-runs
        payload:
          policy_id: ${pol_id}
        as: EligibilityOfficer
        captures:
