      distinguishing_aspect: 'The two identity gates sit ABOVE every authorization and existence check: an empty X-User-ID returns ERR_MISSING_USER_ID and an X-User-Role of ''Franchisee'' returns ERR_INVALID_ROLE, both 401, on a request that would otherwise have been a perfectly valid read.'
