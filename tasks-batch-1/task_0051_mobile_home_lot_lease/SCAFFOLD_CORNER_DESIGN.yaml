              captures: { lot_v: $.data.version }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_b}", start_date: "2026-02-01", supersedes_lease_id: "${lease_a}", expected_lot_version: "${lot_v}" }
              as: ParkManager
