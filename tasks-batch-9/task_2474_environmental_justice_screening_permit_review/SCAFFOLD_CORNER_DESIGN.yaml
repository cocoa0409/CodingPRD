  - section: errors
    instances:
      - name: request_without_auth_headers_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_AUTH_HEADERS]
        distinguishing_aspect: "A GET that omits both X-User-Role and X-User-ID returns 401 ERR_MISSING_AUTH_HEADERS before any existence check, so a non-existent path id still produces 401 rather than 404."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; no ScreeningArea rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /ej/screening-areas/33333333-3333-3333-3333-333333333333"
              payload: {}
              as: "(request sent with no X-User-Role and no X-User-ID header)"
              captures: { err_no_headers: $.data.error_id }
          assert:
            - "HTTP status == 401"
            - "${err_no_headers} == ERR_MISSING_AUTH_HEADERS"
            - "response_type == error"

      - name: request_with_undeclared_role_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_UNKNOWN_ROLE]
        distinguishing_aspect: "X-User-Role AuditorGeneral is not one of the eight declared roles, so the request returns 401 ERR_UNKNOWN_ROLE rather than the 403 ERR_ROLE_NOT_PERMITTED used for a declared but unauthorised role."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one ScreeningArea AREA_H."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
