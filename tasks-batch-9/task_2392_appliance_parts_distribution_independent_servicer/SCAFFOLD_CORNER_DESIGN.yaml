      - name: model_part_xref_links_one_model_to_two_parts_in_both_directions
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/model-part-xrefs
          - endpoints.GET_/model-part-xrefs
          - entities.ModelPartXref.fields.model_number
          - entities.ModelPartXref.fields.part_id
        distinguishing_aspect: "Two xref rows for model WTW5000DW1 (positions P-14 and M-02) make GET /model-part-xrefs?model_number=WTW5000DW1 return 2 rows while GET /model-part-xrefs?part_id=<P1> returns exactly 1 — the junction is navigable from both sides."
        test_recipe:
          setup:
            - "Parts P1 W10-PUMP and P4 W10-MOTOR."
