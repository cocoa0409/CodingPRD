              as: RouteSupervisor
            - call: "POST /dsd/route-days"
              payload: { route_id: "${route_id}", service_date: "2026-09-01" }
              as: RouteSupervisor
              captures: { day_id: $.data.id }
            - call: "POST /dsd/route-days/${day_id}/load"
              payload: { lots: [{ product_id: "${prod_a_id}", lot_code: "L-A", expiration_date: "2026-09-20", loaded_cases: 50 }, { product_id: "${prod_b_id}", lot_code: "L-B", expiration_date: "2026-09-06", loaded_cases: 10 }] }
              as: RouteSalesRep
