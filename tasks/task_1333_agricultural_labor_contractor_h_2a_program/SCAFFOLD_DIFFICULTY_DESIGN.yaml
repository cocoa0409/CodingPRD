  - rule_id: boundary_precision_check
    instances:
      - name: consular_daily_quota_sixth_ok_seventh_rejected
        grounds:
          - calculations.consular_capacity_check
          - errors[ERR_CONSULATE_CAPACITY_FULL]
        distinguishing_aspect: |
          Count boundary on the (consulate, date) quota: with MAX 6, the 6th
          SCHEDULED appointment succeeds and the 7th fails — the check is
          existing >= 6, so existing == 5 admits exactly one more.
        test_recipe:
          setup:
            - "J3 in PETITIONING with petition RCPT-3 APPROVED (requested 7, workers W1..W7 linked); clock 2026-09-01"
