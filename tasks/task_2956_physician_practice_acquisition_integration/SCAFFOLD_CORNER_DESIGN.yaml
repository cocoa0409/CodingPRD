  # ===========================================================================
  # Section 7 — RBAC (§1.7)
  #
  # Six roles, role_model segregation_of_duties. Every role's exclusive
  # operations are closed to the other five, several status endpoints are
  # shared at role level but partitioned by target_status, and two user-level
  # separations (opinion preparer, pinned-opinion accepter) sit underneath the
  # role checks.
  # ===========================================================================
  - section: rbac
    instances:
      - name: deal_lead_cannot_author_a_valuation_opinion
        claim_type: Cannot perform another role's exclusive operation
        grounds:
          - roles[DealLead].exclusive_operations
          - roles[ValuationAnalyst].exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
          - validations[priority=2]
        distinguishing_aspect: |
          The DealLead owns the deal but is structurally excluded from the valuation it
          depends on, so the role that can create the acquisition and drive its status
          cannot file a single opinion against it — and the analyst who can file one
          cannot accept it, which makes POST /valuation-opinions/{opinionId}/status a
          role-shared endpoint whose target_status values are partitioned.
        test_recipe:
          setup:
            - "One Acquisition in deal_status DILIGENCE with one Physician."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /physicians"
              payload: { acquisition_id: "${acq_id}", npi: "1548392017", full_name: "Amara Vance MD", specialty: "PRIMARY_CARE", board_certified: true, state_license_expires_on: "2028-06-30" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { phys_id: "$.data.id" }
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "DILIGENCE" }
              as: DealLead
              as_user_id: "dl-1"
            - call: "GET /acquisitions/${acq_id}"
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_v1: "$.data.version" }
          trigger:
            - call: "POST /valuation-opinions"
              payload: { acquisition_id: "${acq_id}", expected_acquisition_version: "${acq_v1}", opinion_type: "FMV", method: "MARKET_APPROACH", normalized_ebitda_cents: 290000000, market_multiple_bps: 50000, independence_attested: true, effective_on: "2026-08-01" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { error_id: "$.data.error_id" }
          assert:
            - "response error_id == ERR_FORBIDDEN_ROLE with HTTP 403"
            - "GET /valuation-opinions with acquisition_id ${acq_id} reports total_count == 0"
            - "Acquisition.${acq_id}.version is unchanged at ${acq_v1}: a role rejection never consumes the optimistic-concurrency token"
            - "the identical body sent as ValuationAnalyst va-1 is accepted with HTTP 201"
            - "a ComplianceOfficer and a CompensationDesigner sending the same body are also refused with ERR_FORBIDDEN_ROLE (403)"
            - "ValuationAnalyst va-1 can move the resulting opinion DRAFT -> SUBMITTED, but the same analyst requesting target_status ACCEPTED is refused with ERR_FORBIDDEN_ROLE (403): the endpoint is shared, the target_status values are not"

      - name: officer_sharing_the_preparers_user_id_cannot_accept_the_opinion
        claim_type: Segregation of duties
        grounds:
          - complexity_profile.role_model
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_NOT_PLAN_OWNER]
          - state_machines.ValuationOpinion.status.SUBMITTED_to_ACCEPTED
          - validations[priority=16]
        distinguishing_aspect: |
          The separation is at user level, not role level: an X-User-Role of
          ComplianceOfficer clears the role check and is then refused because the X-User-Id
          is the one recorded as the opinion's preparer. The mirror-image rule on the
          submit side runs the comparison the other way round, so a second analyst is
          refused with ERR_NOT_PLAN_OWNER for a draft that is not his.
        test_recipe:
          setup:
            - "One Acquisition in deal_status DILIGENCE with one Physician."
            - "One FMV ValuationOpinion prepared by user va-1 in status SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /physicians"
              payload: { acquisition_id: "${acq_id}", npi: "1548392017", full_name: "Amara Vance MD", specialty: "PRIMARY_CARE", board_certified: true, state_license_expires_on: "2028-06-30" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { phys_id: "$.data.id" }
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "DILIGENCE" }
              as: DealLead
              as_user_id: "dl-1"
            - call: "GET /acquisitions/${acq_id}"
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { acq_v1: "$.data.version" }
            - call: "POST /valuation-opinions"
              payload: { acquisition_id: "${acq_id}", expected_acquisition_version: "${acq_v1}", opinion_type: "FMV", method: "MARKET_APPROACH", normalized_ebitda_cents: 290000000, market_multiple_bps: 50000, independence_attested: true, effective_on: "2026-08-01" }
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { fmv_id: "$.data.id" }
            - call: "POST /valuation-opinions/${fmv_id}/status"
              payload: { target_status: "SUBMITTED" }
              as: ValuationAnalyst
              as_user_id: "va-1"
          trigger:
            - call: "POST /valuation-opinions/${fmv_id}/status"
              payload: { target_status: "ACCEPTED", review_note: "Reviewing my own work" }
              as: ComplianceOfficer
              as_user_id: "va-1"
              captures: { error_id: "$.data.error_id" }
          assert:
            - "response error_id == ERR_SEGREGATION_OF_DUTIES with HTTP 403"
            - "ValuationOpinion.${fmv_id}.status == SUBMITTED and accepted_by_user_id is null"
            - "the same request with target_status REJECTED and X-User-Id va-1 is refused identically, so both dispositions are covered"
            - "the same request sent by ComplianceOfficer co-1 succeeds and stores accepted_by_user_id == co-1"
            - "a second analyst va-2 submitting a fresh DRAFT opinion that va-1 prepared is refused with ERR_NOT_PLAN_OWNER (403), the preparer-side half of the same separation"

      - name: integration_manager_cannot_move_the_deal_status
        claim_type: Cannot perform another role's exclusive operation
        grounds:
          - roles[IntegrationManager].exclusive_operations
          - roles[DealLead].exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          The IntegrationManager owns every operational workstream and can therefore move
          almost every entity on the deal, yet the deal_status dimension itself is closed
          to it — and so is the compliance_clearance dimension, which belongs to a third
          role. Three roles write three different dimensions of the same Acquisition row.
        test_recipe:
          setup:
            - "One Acquisition in deal_status SOURCING with one Physician."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
