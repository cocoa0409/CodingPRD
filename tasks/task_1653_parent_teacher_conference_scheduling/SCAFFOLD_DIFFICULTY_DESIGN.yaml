            - { call: "POST /conf/students/${st2}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/students/${st3}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
          trigger:
            - { call: "POST /conf/bookings", payload: { slot_id: "${s0}", student_id: "${st1}", channel: "IN_PERSON" }, as: FamilyGuardian, as_user_id: "${fam}" }
            - { call: "POST /conf/bookings", payload: { slot_id: "${s1}", student_id: "${st2}", channel: "IN_PERSON" }, as: FamilyGuardian, as_user_id: "${fam}" }
            - { call: "POST /conf/bookings", payload: { slot_id: "${s2}", student_id: "${st3}", channel: "IN_PERSON" }, as: FamilyGuardian, as_user_id: "${fam}", captures: { err: $.data.error_id } }
            - { call: "GET /conf/windows/${w}", as: SchoolAdmin, captures: { confirmed: $.data.bookings_confirmed_count } }
          assert:
            - "bookings 1 and 2 succeed (count == cap is allowed)"
            - "3rd booking rejected with error_id == ERR_TEACHER_DAY_FULL"
            - "window.bookings_confirmed_count == 2 after the rejection"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_requires_window_booking_open
        grounds:
          - state_machines.ConferenceWindow
          - state_machines.Booking
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pair Booking -> ConferenceWindow: booking creation is rejected while the
          window is PUBLISHED (slots generated but booking not opened); the same request
          succeeds identically once the window is BOOKING_OPEN, isolating the cross-entity
          state gate.
        test_recipe:
          setup:
            - "Window PUBLISHED with slots generated but open-booking NOT called; family F, student st1 linked to T1"
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
