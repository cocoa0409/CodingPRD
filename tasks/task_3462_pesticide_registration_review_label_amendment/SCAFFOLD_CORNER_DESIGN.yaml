              as_user_id: "reg-alice"
              captures: { app: $.data.id }
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app}", study_type: "EFFICACY", guideline_reference: "OCSPP 810.3000" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { se: $.data.id }
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app}", study_type: "TOXICOLOGY", guideline_reference: "OCSPP 870.1100" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { st: $.data.id }
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app}", study_type: "ENVIRONMENTAL_FATE", guideline_reference: "OCSPP 835.2120" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { sf: $.data.id }
            - call: "POST /pesticide-registry/study-submissions/${se}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/study-submissions/${st}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/study-submissions/${sf}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/registration-applications/${app}/submit"
              payload: { payment_cents: 150000 }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
            - call: "POST /pesticide-registry/risk-assessments"
              payload: { application_id: "${app}", tier: "SCREENING" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/registration-applications/${app}/review-decisions"
              payload: { decision: "APPROVE", final_classification: "GENERAL_USE" }
              as: RegistrationReviewer
              as_user_id: "rr-1"
            - call: "POST /pesticide-registry/registration-review-cases"
              payload: { product_id: "${p}", opened_at: "2027-01-05T00:00:00Z", due_at: "2027-07-04T00:00:00Z" }
              as: RegistrationReviewer
              as_user_id: "rr-1"
              captures: { case1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: SystemAdministrator
              as_user_id: "sys-1"
            - call: "POST /pesticide-registry/data-call-ins"
              payload: { review_case_id: "${case1}", required_study_types: ["TOXICOLOGY"], response_deadline: "2027-02-09T00:00:00Z" }
              as: RegistrationReviewer
              as_user_id: "rr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-10T00:00:00Z" }
              as: SystemAdministrator
              as_user_id: "sys-1"
            - call: "GET /pesticide-registry/cancellation-proceedings"
              payload: { product_id: "${p}" }
              as: RegistrationReviewer
              as_user_id: "rr-1"
              captures: { pr: "$.data[0].id" }
          trigger:
            - call: "POST /pesticide-registry/cancellation-proceedings/${pr}/existing-stocks-disposals"
              payload: { units: 10, method: "DESTRUCTION" }
              as: RegistrationReviewer
              as_user_id: "rr-1"
              captures: { err: $.data.error_id }
          assert:
            - "the auto-created proceeding ${pr}: auto_created == true, proceeding_type == SUSPENSION, reason == DCI_DELINQUENCY, status == EFFECTIVE, initiated_by_ref == \"system\""
            - "existing_stocks_authorized_units, stocks_method, allow_sale_until, allow_use_until are all null on ${pr}"
            - "the disposal attempt: 409, error_id == ERR_PROCEEDING_INVALID_STEP (no stocks provision to dispose against)"

