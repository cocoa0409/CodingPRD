    side_effects: ["status->UNDER_REVIEW"]
  - method: POST
    path: /plat-drawings/{id}/seal
    description: UNDER_REVIEW -> SEALED (OCC on order)
    roles: [Surveyor]
    code: 200
    input: ["sealed_by_id", "expected_order_version"]
    output: PlatDrawing
    side_effects: ["status->SEALED; set sealed_by_id/sealed_at; advance order DRAFTING->SEALED; increments SurveyOrder.version by 1"]
  - method: POST
    path: /plat-drawings/{id}/resume-draft
    description: IN_REVISION -> DRAFTED
    roles: [Drafter]
    code: 200
    input: []
    output: PlatDrawing
    side_effects: ["status->DRAFTED"]

  # ---- RevisionRequest ----
  - method: POST
    path: /revision-requests
    description: Request a revision against a plat
    roles: [Coordinator]
    code: 201
    input: ["plat_id", "reason", "notes?"]
    output: RevisionRequest
    side_effects: ["status=REQUESTED; compute reseal_fee_cents from reason (not yet applied to order)"]
  - method: GET
    path: /revision-requests/{id}
    description: Get a revision request
    roles: [Coordinator, Drafter, Surveyor]
    code: 200
    input: []
    output: RevisionRequest
    side_effects: []
  - method: GET
    path: /revision-requests
    description: List revision requests (filter by plat_id)
    roles: [Coordinator, Drafter, Surveyor]
    code: 200
    input: ["plat_id?", "status?", "limit?", "offset?"]
    output: RevisionRequest[]
    side_effects: []
  - method: POST
    path: /revision-requests/{id}/apply
    description: REQUESTED -> APPLIED; drives plat into IN_REVISION
    roles: [Coordinator]
    code: 200
    input: []
    output: RevisionRequest
    side_effects: ["status->APPLIED; plat SEALED|UNDER_REVIEW -> IN_REVISION; if plat was SEALED add reseal_fee_cents to order.estimated_fee_cents and revert order SEALED->DRAFTING; increment order.revision_count"]
  - method: POST
    path: /revision-requests/{id}/reject
    description: REQUESTED -> REJECTED
    roles: [Coordinator]
    code: 200
    input: []
    output: RevisionRequest
    side_effects: ["status->REJECTED; no order changes"]

  # ---- Deliverable ----
  - method: POST
    path: /deliverables
    description: Assemble a deliverable package for a sealed plat
    roles: [Coordinator]
    code: 201
    input: ["order_id", "plat_id", "format"]
    output: Deliverable
    side_effects: ["status=ASSEMBLED (requires plat SEALED)"]
  - method: GET
    path: /deliverables/{id}
    description: Get a deliverable
    roles: [Coordinator, BillingClerk]
    code: 200
    input: []
    output: Deliverable
    side_effects: []
  - method: GET
    path: /deliverables
    description: List deliverables (filter by order_id or plat_id)
    roles: [Coordinator, BillingClerk]
    code: 200
    input: ["order_id?", "plat_id?", "status?", "limit?", "offset?"]
    output: Deliverable[]
    side_effects: []
  - method: POST
    path: /deliverables/{id}/release
    description: ASSEMBLED -> RELEASED; drives order SEALED->DELIVERED
    roles: [Coordinator]
    code: 200
    input: []
    output: Deliverable
    side_effects: ["status->RELEASED; advance order SEALED->DELIVERED (requires order has an ISSUED invoice)"]

  # ---- Invoice ----
  - method: POST
    path: /invoices
    description: Create a draft invoice for an order
    roles: [BillingClerk]
    code: 201
    input: ["order_id", "issued_by_id"]
    output: Invoice
    side_effects: ["lifecycle_status=DRAFT; payment_status=UNPAID; totals=0"]
  - method: GET
    path: /invoices/{id}
    description: Get an invoice
    roles: [Coordinator, BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: /invoices
    description: List invoices (filter by order_id or issued_by_id)
    roles: [Coordinator, BillingClerk]
    code: 200
    input: ["order_id?", "issued_by_id?", "lifecycle_status?", "payment_status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: /invoices/{id}/issue
    description: DRAFT -> ISSUED; freezes final fee (OCC on order)
    roles: [BillingClerk]
    code: 200
    input: ["expected_order_version"]
    output: Invoice
    side_effects: ["lifecycle_status->ISSUED; compute invoice_final_fee; set order.final_fee_cents; increments SurveyOrder.version by 1"]
  - method: POST
    path: /invoices/{id}/payments
    description: Apply a payment to an issued invoice
    roles: [BillingClerk]
    code: 200
    input: ["amount_cents"]
    output: Invoice
    side_effects: ["amount_paid_cents+=amount; recompute balance_due_cents; payment_status UNPAID->PARTIAL->PAID; on zero balance lifecycle_status->CLOSED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Authenticated role is not permitted for the endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, bad type, or invalid enum value"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition not defined from the resource's current state"
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version does not match SurveyOrder.version on seal/issue"
  - id: ERR_ROLE_MISMATCH
    http: 422
    condition: "Assigned crew member's role_type is wrong for the operation (researcher/tech/PLS)"
  - id: ERR_SEGREGATION_VIOLATION
    http: 422
    condition: "Sealing PLS is the same person who recorded the source dataset"
  - id: ERR_SEAL_NOT_LICENSED
    http: 422
    condition: "Sealer is not an active PLS or the PLS license is expired"
  - id: ERR_CLOSURE_OUT_OF_TOLERANCE
    http: 422
    condition: "Source dataset closure_error_ppm exceeds MAX_SEALABLE_CLOSURE_PPM"
  - id: ERR_TITLE_NOT_CLEAR
    http: 422
    condition: "Research clear attempted while encumbrance_count > 0"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "FieldAssignment scheduled_end not strictly after scheduled_start"
  - id: ERR_CREW_DOUBLE_BOOKED
    http: 409
    condition: "Crew member already has an overlapping SCHEDULED/IN_PROGRESS assignment (half-open intervals)"
  - id: ERR_INSTRUMENT_UNAVAILABLE
    http: 409
    condition: "Instrument already HELD for an overlapping buffered window"
  - id: ERR_INSTRUMENT_OUT_OF_CALIBRATION
    http: 422
    condition: "Instrument calibration_due_on is not after the assignment scheduled_end"
  - id: ERR_DUPLICATE_ASSET_TAG
    http: 409
    condition: "Instrument asset_tag already exists"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "Payment amount_cents <= 0 or would exceed balance_due_cents"
  - id: ERR_DUPLICATE_CHILD
    http: 409
    condition: "Second ResearchPacket per order, or a second issued invoice per order"
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic business-rule violation not covered by a more specific code"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Coordinator
    description: Project coordinator; owns order lifecycle, scheduling, reservations, revisions, deliverables.
    identity: "entity_backed:CrewMember"
    exclusive_operations:
      - "POST /crew-members"
      - "POST /instruments"
      - "POST /survey-orders"
      - "POST /survey-orders/{id}/start-research"
      - "POST /survey-orders/{id}/clear-research"
      - "POST /survey-orders/{id}/cancel"
      - "GET /crew-members/{id}/risk-score"
      - "POST /field-assignments"
      - "POST /instrument-reservations"
      - "POST /revision-requests"
      - "POST /revision-requests/{id}/apply"
      - "POST /revision-requests/{id}/reject"
      - "POST /deliverables"
      - "POST /deliverables/{id}/release"
    shared_operations:
      - "POST /research-packets"
      - "POST /field-assignments/{id}/cancel"
      - "GET endpoints across orders, packets, assignments, reservations, datasets, plats, revisions, deliverables, invoices"
  - name: Researcher
    description: Deed/parcel research analyst; owns the research packet lifecycle.
    identity: "entity_backed:CrewMember"
    exclusive_operations:
      - "POST /research-packets/{id}/begin"
      - "POST /research-packets/{id}/clear"
      - "POST /research-packets/{id}/hold"
    shared_operations:
      - "POST /research-packets"
      - "GET research-packets, crew-members, survey-orders"
  - name: FieldTech
    description: Field technician; runs assignments and records raw data.
    identity: "entity_backed:CrewMember"
    exclusive_operations:
      - "POST /field-assignments/{id}/start"
      - "POST /field-assignments/{id}/complete"
    shared_operations:
      - "POST /data-sets"
      - "POST /field-assignments/{id}/cancel"
      - "GET field-assignments, instruments, reservations, datasets, crew-members, survey-orders"
  - name: Drafter
    description: CAD drafter; reduces data and produces plat drawings (cannot seal).
    identity: "entity_backed:CrewMember"
    exclusive_operations:
      - "POST /plat-drawings"
      - "POST /plat-drawings/{id}/submit-review"
      - "POST /plat-drawings/{id}/resume-draft"
    shared_operations:
      - "POST /data-sets/reduce"
      - "GET plat-drawings, data-sets, revisions, crew-members, survey-orders"
  - name: Surveyor
    description: Licensed Professional Land Surveyor (PLS); accepts data and seals plats.
    identity: "entity_backed:CrewMember"
    exclusive_operations:
      - "POST /data-sets/{id}/accept"
      - "POST /plat-drawings/{id}/seal"
    shared_operations:
      - "POST /data-sets"
      - "POST /data-sets/{id}/reduce"
      - "GET data-sets, plat-drawings, revisions, crew-members, survey-orders"
  - name: BillingClerk
    description: Billing clerk; owns invoice lifecycle and payments (cannot seal or schedule).
    identity: "entity_backed:CrewMember"
    exclusive_operations:
      - "POST /invoices"
      - "POST /invoices/{id}/issue"
      - "POST /invoices/{id}/payments"
    shared_operations:
      - "GET invoices, deliverables, survey-orders, crew-members"
