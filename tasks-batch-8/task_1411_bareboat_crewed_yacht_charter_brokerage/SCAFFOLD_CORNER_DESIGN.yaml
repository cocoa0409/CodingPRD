        claim_type: invalid_transition
        grounds: [state_machines.CharterRequest, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Rebook requires a terminal source (CANCELLED/DECLINED/EXPIRED); rebooking an OFFERED request fails ERR_INVALID_STATE."
