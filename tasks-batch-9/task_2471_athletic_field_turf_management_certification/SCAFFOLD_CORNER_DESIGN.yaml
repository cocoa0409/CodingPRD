            - "Clock advanced to 2026-08-02T20:30:00Z and the booking closed out PLAYED, 1.50 hours, 40 participants, WET: wear 3.65, rest requirement 3.83, so Field.rest_debt_hours is 3.83 and play_status is RESTRICTED."
            - "One AERATION task 2026-08-02T21:00:00Z-2026-08-02T22:00:00Z (which does not overlap the booking window, so the task-versus-booking guard cannot fire), already STARTed after the clock reaches 2026-08-02T22:00:00Z."
