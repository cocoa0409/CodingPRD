# =============================================================================
# Task 1561: Referral Management & Network Leakage — §1.9 Coverage Index
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: referral_create_missing_required_urgency_rejected
        claim_type: required_fields
        grounds: [entities.Referral.fields.urgency, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /referrals without required field `urgency` fails with ERR_INVALID_REQUEST (400); no referral persisted."
        test_recipe:
          setup: ["plan + provider + patient exist"]
          setup_api_calls:
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
          trigger:
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"
            - "GET /referrals?patient_id=${pt1} returns 0 rows"

      - name: referral_create_defaults_applied
        claim_type: defaults
        grounds: [entities.Referral.fields.in_network_preference, entities.Referral.fields.insurance_plan_id, entities.Referral.fields.patient_choice_documented]
        distinguishing_aspect: "Omitting optional inputs applies defaults: in_network_preference=true, insurance_plan_id=patient's plan, patient_choice_documented=false, patient_choice_type=NONE."
        test_recipe:
          setup: ["plan + provider + patient exist"]
          setup_api_calls:
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
          trigger:
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { r: $.data.id }
          assert:
            - "response.in_network_preference == true"
            - "response.insurance_plan_id == ${plan1} (defaulted from patient)"
            - "response.patient_choice_documented == false and patient_choice_type == NONE"
            - "response.referring_provider_id == ${pa} (forced from X-User-ID, never from payload)"

      - name: patient_create_client_id_input_ignored
        claim_type: system_fields
        grounds: [entities.Patient]
        distinguishing_aspect: "Server mints id/created_at/version: a client-supplied `id` is ignored, version starts at 1, created_at equals the logical clock default 2026-08-01T00:00:00Z."
        test_recipe:
          setup: ["plan exists; clock never set (default 2026-08-01T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
          trigger:
            - call: "POST /patients"
              payload: { id: "client-supplied", mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }
              as: NetworkAdmin
              captures: { pt: $.data.id }
          assert:
            - "response.id != \"client-supplied\" and is a server-minted UUID"
            - "response.version == 1"
            - "response.created_at == \"2026-08-01T00:00:00Z\" (logical clock default, not wall clock)"

      - name: referral_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Referral.fields.urgency, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "urgency \"STATT\" is not in {STAT, URGENT, ROUTINE} -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["plan + provider + patient exist"]
          setup_api_calls:
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
          trigger:
            - call: "POST /referrals"
              payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "STATT" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: referral_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_REFERRAL_NOT_FOUND]"]
        distinguishing_aspect: "GET /referrals/{random uuid} -> ERR_REFERRAL_NOT_FOUND (404) with error envelope shape."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /referrals/00000000-0000-0000-0000-000000000000"
              as: ReferralCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REFERRAL_NOT_FOUND, HTTP 404"
            - "error envelope contains meta.api_request_id and data.message"

      - name: referral_create_bogus_patient_returns_not_found
        claim_type: parent_relationships
        grounds: [entities.Referral.fields.patient_id, "errors[ERR_PATIENT_NOT_FOUND]"]
        distinguishing_aspect: "Flat-topology FK integrity: referral body referencing a nonexistent patient_id -> ERR_PATIENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["provider exists"]
          setup_api_calls:
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
          trigger:
            - call: "POST /referrals"
              payload: { patient_id: "00000000-0000-0000-0000-000000000000", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }
              as: ReferringProvider
              as_user_id: "${pa}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PATIENT_NOT_FOUND, HTTP 404"

      - name: referral_age_days_computed_from_clock
        claim_type: computed_fields
        grounds: [entities.Referral.fields.age_days, entities.Referral.fields.sla_due_at]
        distinguishing_aspect: "age_days derives from the logical clock: created 2026-08-01, read at 2026-08-04 -> 3; sla_due_at stays null before accept."
        test_recipe:
          setup: ["clock 2026-08-01T00:00:00Z; plan, provider, patient; referral created but not accepted"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: NetworkAdmin }
          trigger:
            - { call: "GET /referrals/${r}", as: ReferralCoordinator }
          assert:
            - "Referral.${r}.age_days == 3"
            - "Referral.${r}.sla_due_at == null (not yet accepted)"

      - name: consult_note_immutability
        claim_type: immutability
        grounds: [entities.ConsultNote]
        distinguishing_aspect: "common_fields:false ConsultNote carries no version/updated_at keys in its response, and no update/delete endpoint exists for it (append-only event)."
        test_recipe:
          setup:
            - "full chain to a COMPLETED appointment (clock 2026-08-01 bootstrap, appointment 2026-08-02T10:00-11:00, confirm, clock to 11:00, complete)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /specialty-providers", payload: { name: "S1", npi: "1000000001", specialty: "CARDIOLOGY", base_region: "NORTH", weekly_capacity: 10 }, as: NetworkAdmin, captures: { s1: $.data.id } }
            - { call: "POST /network-participations", payload: { specialist_id: "${s1}", insurance_plan_id: "${plan1}", tier: "PREFERRED", effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: NetworkAdmin }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r: $.data.id } }
            - { call: "POST /referrals/${r}/accept", as: ReferralCoordinator }
            - { call: "POST /referrals/${r}/assign-specialist", payload: { specialist_id: "${s1}" }, as: ReferralCoordinator, captures: { r_v: $.data.version } }
            - { call: "POST /referrals/${r}/appointments", payload: { expected_referral_version: "${r_v}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }, as: ReferralCoordinator, captures: { a: $.data.id } }
            - { call: "POST /appointments/${a}/confirm", payload: { confirmation_channel: "PHONE" }, as: ReferralCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T11:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /appointments/${a}/complete", as: SpecialistProvider, as_user_id: "${s1}" }
          trigger:
            - call: "POST /appointments/${a}/consult-note"
              payload: { findings_summary: "OK", follow_up_recommended: false }
              as: SpecialistProvider
              as_user_id: "${s1}"
              captures: { note: $.data.id }
          assert:
            - "ConsultNote response has no `version` key and no `updated_at` key"
            - "ConsultNote.${note}.note_sequence == 1 and returned_within_sla == true (same-day return, NOTE_RETURN_DAYS=14)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: referral_initial_states_on_create
        claim_type: initial_state
        grounds: [state_machines.Referral, state_machines.ReferralAuthStatus]
        distinguishing_aspect: "New referral starts status=PENDING_TRIAGE and auth_status=NOT_EVALUATED with ever_scheduled=false, leaked=false, version=1."
        test_recipe:
          setup: ["plan + provider + patient exist"]
          setup_api_calls:
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
          trigger:
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}" }
          assert:
            - "response.status == PENDING_TRIAGE and response.auth_status == NOT_EVALUATED"
            - "response.ever_scheduled == false, leaked == false, out_of_network == false, version == 1"

      - name: double_accept_rejected_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Referral.PENDING_TRIAGE_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accept is defined only from PENDING_TRIAGE; repeating it on an ACCEPTED referral (idempotency probe) fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["bootstrap; referral accepted"]
          setup_api_calls:
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r: $.data.id } }
            - { call: "POST /referrals/${r}/accept", as: ReferralCoordinator }
          trigger:
            - call: "POST /referrals/${r}/accept"
              as: ReferralCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409"
            - "Referral.${r}.version unchanged by the failed call"

      - name: complete_without_confirm_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Appointment.CONFIRMED_to_COMPLETED, "errors[ERR_NOT_CONFIRMED]"]
        distinguishing_aspect: "complete from SCHEDULED (never confirmed) fails with domain error ERR_NOT_CONFIRMED (409), enforcing the closed-loop confirmation step."
        test_recipe:
          setup: ["full bootstrap; appointment booked 2026-08-02T10:00-11:00, left SCHEDULED; clock 2026-08-02T11:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /specialty-providers", payload: { name: "S1", npi: "1000000001", specialty: "CARDIOLOGY", base_region: "NORTH", weekly_capacity: 10 }, as: NetworkAdmin, captures: { s1: $.data.id } }
            - { call: "POST /network-participations", payload: { specialist_id: "${s1}", insurance_plan_id: "${plan1}", tier: "PREFERRED", effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: NetworkAdmin }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r: $.data.id } }
            - { call: "POST /referrals/${r}/accept", as: ReferralCoordinator }
            - { call: "POST /referrals/${r}/assign-specialist", payload: { specialist_id: "${s1}" }, as: ReferralCoordinator, captures: { r_v: $.data.version } }
            - { call: "POST /referrals/${r}/appointments", payload: { expected_referral_version: "${r_v}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }, as: ReferralCoordinator, captures: { a: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T11:00:00Z" }, as: NetworkAdmin }
          trigger:
            - call: "POST /appointments/${a}/complete"
              as: SpecialistProvider
              as_user_id: "${s1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_CONFIRMED, HTTP 409"
            - "Appointment.${a}.status remains SCHEDULED; Referral.${r}.status remains SCHEDULED"

      - name: cancel_rejected_referral_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Referral, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal: cancel on a REJECTED referral fails with ERR_INVALID_STATE and no side effects fire."
        test_recipe:
          setup: ["bootstrap; referral rejected"]
          setup_api_calls:
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r: $.data.id } }
            - { call: "POST /referrals/${r}/reject", payload: { reason: "Duplicate order" }, as: ReferralCoordinator }
          trigger:
            - call: "POST /referrals/${r}/cancel"
              payload: { reason: "PATIENT_DECLINED" }
              as: ReferralCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409"

      - name: auth_evaluation_on_accept
        claim_type: side_effect_execution
        grounds: [state_machines.ReferralAuthStatus.NOT_EVALUATED_to_AUTH_REQUIRED, state_machines.ReferralAuthStatus.NOT_EVALUATED_to_NOT_REQUIRED]
        distinguishing_aspect: "Accept evaluates the ACTIVE PriorAuthRule matching (specialty, plan): CARDIOLOGY referral with a requires_auth rule -> AUTH_REQUIRED; DERMATOLOGY referral with no matching rule -> NOT_REQUIRED."
        test_recipe:
          setup: ["plan; ACTIVE rule (CARDIOLOGY, plan1, requires_auth=true, validity 10); provider; patient; two referrals"]
          setup_api_calls:
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /prior-auth-rules", payload: { specialty: "CARDIOLOGY", insurance_plan_id: "${plan1}", requires_auth: true, auth_validity_days: 10 }, as: NetworkAdmin, captures: { rule1: $.data.id } }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "DERMATOLOGY", diagnosis_code: "L20", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r2: $.data.id } }
          trigger:
            - { call: "POST /referrals/${r1}/accept", as: ReferralCoordinator }
            - { call: "POST /referrals/${r2}/accept", as: ReferralCoordinator }
          assert:
            - "Referral.${r1}.auth_status == AUTH_REQUIRED (rule match flags prior-authorization requirement)"
            - "Referral.${r2}.auth_status == NOT_REQUIRED"
            - "both referrals have sla_due_at == triaged_at + 30 days"

      - name: auth_denied_retry_cycle_and_obtained
        claim_type: valid_transition
        grounds: [state_machines.ReferralAuthStatus.AUTH_PENDING_to_AUTH_DENIED, state_machines.ReferralAuthStatus.AUTH_DENIED_to_AUTH_PENDING, state_machines.ReferralAuthStatus.AUTH_PENDING_to_AUTH_OBTAINED]
        distinguishing_aspect: "The auth dimension cycles AUTH_PENDING -> AUTH_DENIED -> AUTH_PENDING -> AUTH_OBTAINED; OBTAINED mints an AuthorizationRecord with expires_on = obtained_at + auth_validity_days."
        test_recipe:
          setup: ["clock 2026-08-01T00:00:00Z; plan; ACTIVE rule (CARDIOLOGY, plan1, requires_auth, validity 10); provider; patient; referral accepted (AUTH_REQUIRED)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /prior-auth-rules", payload: { specialty: "CARDIOLOGY", insurance_plan_id: "${plan1}", requires_auth: true, auth_validity_days: 10 }, as: NetworkAdmin }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r: $.data.id } }
            - { call: "POST /referrals/${r}/accept", as: ReferralCoordinator }
          trigger:
            - { call: "POST /referrals/${r}/auth/submit", as: ReferralCoordinator }
            - { call: "POST /referrals/${r}/auth/record-outcome", payload: { outcome: "DENIED" }, as: ReferralCoordinator }
            - { call: "POST /referrals/${r}/auth/submit", as: ReferralCoordinator }
            - { call: "POST /referrals/${r}/auth/record-outcome", payload: { outcome: "OBTAINED", auth_number: "AUTH-123" }, as: ReferralCoordinator }
            - { call: "GET /referrals/${r}/authorization-records", as: ReferralCoordinator }
          assert:
            - "auth_status sequence observed: AUTH_PENDING -> AUTH_DENIED -> AUTH_PENDING -> AUTH_OBTAINED"
            - "AuthorizationRecord created: auth_number == \"AUTH-123\", status == ACTIVE"
            - "AuthorizationRecord.obtained_at == \"2026-08-01T00:00:00Z\" and expires_on == \"2026-08-11T00:00:00Z\" (+10 days)"

      - name: booking_blocked_while_auth_required
        claim_type: precondition_enforcement
        grounds: [state_machines.Referral.ACCEPTED_to_SCHEDULED, "errors[ERR_AUTH_NOT_SATISFIED]"]
        distinguishing_aspect: "Booking while auth_status == AUTH_REQUIRED fails with ERR_AUTH_NOT_SATISFIED (409); the prior-auth flag gates scheduling assistance."
        test_recipe:
          setup: ["clock 2026-08-01; plan; rule requires_auth for CARDIOLOGY; S1 cardio with participation; provider; patient; referral accepted + assigned S1 (auth_status AUTH_REQUIRED)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /prior-auth-rules", payload: { specialty: "CARDIOLOGY", insurance_plan_id: "${plan1}", requires_auth: true, auth_validity_days: 10 }, as: NetworkAdmin }
            - { call: "POST /specialty-providers", payload: { name: "S1", npi: "1000000001", specialty: "CARDIOLOGY", base_region: "NORTH", weekly_capacity: 10 }, as: NetworkAdmin, captures: { s1: $.data.id } }
            - { call: "POST /network-participations", payload: { specialist_id: "${s1}", insurance_plan_id: "${plan1}", tier: "PREFERRED", effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: NetworkAdmin }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r: $.data.id } }
            - { call: "POST /referrals/${r}/accept", as: ReferralCoordinator }
            - { call: "POST /referrals/${r}/assign-specialist", payload: { specialist_id: "${s1}" }, as: ReferralCoordinator, captures: { r_v: $.data.version } }
          trigger:
            - call: "POST /referrals/${r}/appointments"
              payload: { expected_referral_version: "${r_v}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }
              as: ReferralCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_AUTH_NOT_SATISFIED, HTTP 409"
            - "Referral.${r}.status remains ACCEPTED"

      - name: auth_record_expiry_via_sweep
        claim_type: valid_transition
        grounds: [state_machines.ReferralAuthStatus.AUTH_OBTAINED_to_AUTH_EXPIRED, calculations.auth_validity_window]
        distinguishing_aspect: "Aging sweep expires the ACTIVE AuthorizationRecord when now >= expires_on (inclusive) and flips referral.auth_status to AUTH_EXPIRED while the referral is still ACCEPTED."
        test_recipe:
          setup: ["clock 2026-08-01T00:00:00Z; plan; rule requires_auth validity 2 for CARDIOLOGY; referral accepted, auth submitted + OBTAINED (expires_on 2026-08-03T00:00:00Z); clock advanced to exactly 2026-08-03T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /prior-auth-rules", payload: { specialty: "CARDIOLOGY", insurance_plan_id: "${plan1}", requires_auth: true, auth_validity_days: 2 }, as: NetworkAdmin }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r: $.data.id } }
            - { call: "POST /referrals/${r}/accept", as: ReferralCoordinator }
            - { call: "POST /referrals/${r}/auth/submit", as: ReferralCoordinator }
            - { call: "POST /referrals/${r}/auth/record-outcome", payload: { outcome: "OBTAINED", auth_number: "AUTH-9" }, as: ReferralCoordinator }
            - { call: "GET /referrals/${r}/authorization-records", as: ReferralCoordinator, captures: { ar: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /referrals/aging-sweep", as: ReferralCoordinator }
          assert:
            - "sweep response expired_auth_record_ids contains ${ar}; expired_count == 0 (referral ROUTINE sla not yet due)"
            - "AuthorizationRecord.${ar}.status == EXPIRED (now == expires_on is inclusive)"
            - "Referral.${r}.auth_status == AUTH_EXPIRED"

      - name: cancel_cascades_appointment_and_no_leakage_for_declined
        claim_type: side_effect_execution
        grounds: [state_machines.Referral.SCHEDULED_to_CANCELLED, state_machines.Appointment.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "Cancelling a SCHEDULED referral cascade-cancels its active appointment and frees the slot; reason PATIENT_DECLINED creates NO LeakageRecord (conditional cascade)."
        test_recipe:
          setup: ["full bootstrap; referral booked (appointment A)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /specialty-providers", payload: { name: "S1", npi: "1000000001", specialty: "CARDIOLOGY", base_region: "NORTH", weekly_capacity: 10 }, as: NetworkAdmin, captures: { s1: $.data.id } }
            - { call: "POST /network-participations", payload: { specialist_id: "${s1}", insurance_plan_id: "${plan1}", tier: "PREFERRED", effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: NetworkAdmin }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r: $.data.id } }
            - { call: "POST /referrals/${r}/accept", as: ReferralCoordinator }
            - { call: "POST /referrals/${r}/assign-specialist", payload: { specialist_id: "${s1}" }, as: ReferralCoordinator, captures: { r_v: $.data.version } }
            - { call: "POST /referrals/${r}/appointments", payload: { expected_referral_version: "${r_v}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }, as: ReferralCoordinator, captures: { a: $.data.id } }
          trigger:
            - { call: "POST /referrals/${r}/cancel", payload: { reason: "PATIENT_DECLINED" }, as: ReferralCoordinator }
          assert:
            - "Referral.${r}.status == CANCELLED, cancel_reason == PATIENT_DECLINED"
            - "Appointment.${a}.status == CANCELLED and SpecialistProvider.${s1}.booked_appointments_count == 0"
            - "GET /referrals/${r}/leakage-records returns 0 rows (declined is not leakage)"

      - name: closure_reopen_cycle_with_amended_note
        claim_type: valid_transition
        grounds: [state_machines.Referral.PENDING_VERIFICATION_to_VISIT_COMPLETED, state_machines.Referral.VISIT_COMPLETED_to_PENDING_VERIFICATION, entities.ConsultNote.fields.note_sequence]
        distinguishing_aspect: "REOPENED sends the referral back to VISIT_COMPLETED; an amended consult note (note_sequence 2) returns it to PENDING_VERIFICATION and a second verify closes it — a guarded review cycle."
        test_recipe:
          setup: ["full chain to PENDING_VERIFICATION (note 1 submitted); scheduler user coord-1; auditor audit-1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /specialty-providers", payload: { name: "S1", npi: "1000000001", specialty: "CARDIOLOGY", base_region: "NORTH", weekly_capacity: 10 }, as: NetworkAdmin, captures: { s1: $.data.id } }
            - { call: "POST /network-participations", payload: { specialist_id: "${s1}", insurance_plan_id: "${plan1}", tier: "PREFERRED", effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: NetworkAdmin }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r: $.data.id } }
            - { call: "POST /referrals/${r}/accept", as: ReferralCoordinator }
            - { call: "POST /referrals/${r}/assign-specialist", payload: { specialist_id: "${s1}" }, as: ReferralCoordinator, captures: { r_v3: $.data.version } }
            - { call: "POST /referrals/${r}/appointments", payload: { expected_referral_version: "${r_v3}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }, as: ReferralCoordinator, as_user_id: "coord-1", captures: { a: $.data.id } }
            - { call: "POST /appointments/${a}/confirm", payload: { confirmation_channel: "PHONE" }, as: ReferralCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T11:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /appointments/${a}/complete", as: SpecialistProvider, as_user_id: "${s1}" }
            - { call: "POST /appointments/${a}/consult-note", payload: { findings_summary: "v1", follow_up_recommended: false }, as: SpecialistProvider, as_user_id: "${s1}" }
            - { call: "GET /referrals/${r}", as: ReferralCoordinator, captures: { r_v6: $.data.version } }
          trigger:
            - { call: "POST /referrals/${r}/loop-closures", payload: { expected_referral_version: "${r_v6}", outcome: "REOPENED", verification_note: "Note incomplete" }, as: ComplianceAuditor, as_user_id: "audit-1" }
            - { call: "POST /appointments/${a}/consult-note", payload: { findings_summary: "v2 amended", follow_up_recommended: true }, as: SpecialistProvider, as_user_id: "${s1}", captures: { note2: $.data.id } }
            - { call: "GET /referrals/${r}", as: ReferralCoordinator, captures: { r_v8: $.data.version } }
            - { call: "POST /referrals/${r}/loop-closures", payload: { expected_referral_version: "${r_v8}", outcome: "VERIFIED_CLOSED", verification_note: "Now complete" }, as: ComplianceAuditor, as_user_id: "audit-1" }
          assert:
            - "after REOPENED: Referral.${r}.status == VISIT_COMPLETED"
            - "amended ConsultNote.${note2}.note_sequence == 2"
            - "after amended note: status == PENDING_VERIFICATION; after second verify: status == CLOSED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: utilization_penalty_at_exact_threshold_and_tiebreak
        claim_type: constants_applied
        grounds: [calculations.panel_utilization, calculations.specialty_match_ranking]
        distinguishing_aspect: "Utilization exactly 0.8 (4 booked of capacity 5) IS penalized (inclusive >=); the resulting 65==65 tie with a STANDARD specialist is broken by created_at ASC (earlier-created S1 wins), and match_score 65 (not 80) proves the penalty fired."
        test_recipe:
          setup:
            - "clock 2026-08-01; plan; patient PT region SOUTH; provider PA"
            - "S1 CARDIOLOGY region NORTH capacity 5 PREFERRED (created first) with 4 bookings (utilization exactly 0.8); S2 CARDIOLOGY region NORTH capacity 10 STANDARD, 0 bookings; patient region NORTH"
            - "subject referral R CARDIOLOGY ROUTINE accepted"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /specialty-providers", payload: { name: "S1", npi: "1000000001", specialty: "CARDIOLOGY", base_region: "NORTH", weekly_capacity: 5 }, as: NetworkAdmin, captures: { s1: $.data.id } }
            - { call: "POST /specialty-providers", payload: { name: "S2", npi: "1000000002", specialty: "CARDIOLOGY", base_region: "NORTH", weekly_capacity: 10 }, as: NetworkAdmin, captures: { s2: $.data.id } }
            - { call: "POST /network-participations", payload: { specialist_id: "${s1}", insurance_plan_id: "${plan1}", tier: "PREFERRED", effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: NetworkAdmin }
            - { call: "POST /network-participations", payload: { specialist_id: "${s2}", insurance_plan_id: "${plan1}", tier: "STANDARD", effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: NetworkAdmin }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { b1: $.data.id } }
            - { call: "POST /referrals/${b1}/accept", as: ReferralCoordinator }
            - { call: "POST /referrals/${b1}/assign-specialist", payload: { specialist_id: "${s1}" }, as: ReferralCoordinator, captures: { b1_v: $.data.version } }
            - { call: "POST /referrals/${b1}/appointments", payload: { expected_referral_version: "${b1_v}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }, as: ReferralCoordinator }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I11", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { b2: $.data.id } }
            - { call: "POST /referrals/${b2}/accept", as: ReferralCoordinator }
            - { call: "POST /referrals/${b2}/assign-specialist", payload: { specialist_id: "${s1}" }, as: ReferralCoordinator, captures: { b2_v: $.data.version } }
            - { call: "POST /referrals/${b2}/appointments", payload: { expected_referral_version: "${b2_v}", scheduled_start: "2026-08-02T12:00:00Z", scheduled_end: "2026-08-02T13:00:00Z" }, as: ReferralCoordinator }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I20", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { b3: $.data.id } }
            - { call: "POST /referrals/${b3}/accept", as: ReferralCoordinator }
            - { call: "POST /referrals/${b3}/assign-specialist", payload: { specialist_id: "${s1}" }, as: ReferralCoordinator, captures: { b3_v: $.data.version } }
            - { call: "POST /referrals/${b3}/appointments", payload: { expected_referral_version: "${b3_v}", scheduled_start: "2026-08-02T14:00:00Z", scheduled_end: "2026-08-02T15:00:00Z" }, as: ReferralCoordinator }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I21", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { b4: $.data.id } }
            - { call: "POST /referrals/${b4}/accept", as: ReferralCoordinator }
            - { call: "POST /referrals/${b4}/assign-specialist", payload: { specialist_id: "${s1}" }, as: ReferralCoordinator, captures: { b4_v: $.data.version } }
            - { call: "POST /referrals/${b4}/appointments", payload: { expected_referral_version: "${b4_v}", scheduled_start: "2026-08-02T16:00:00Z", scheduled_end: "2026-08-02T17:00:00Z" }, as: ReferralCoordinator }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I25", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r: $.data.id } }
            - { call: "POST /referrals/${r}/accept", as: ReferralCoordinator }
          trigger:
            - { call: "POST /referrals/${r}/auto-match", as: ReferralCoordinator }
          assert:
            - "S1 booked_appointments_count == 4 => utilization 4/5 == 0.8, penalty applies (inclusive threshold)"
            - "scores tie at 65: S1 = 50 + 25 PREFERRED - 15 utilization + 0 ROUTINE + 5 region; S2 = 50 + 10 STANDARD + 0 + 0 + 5 region"
            - "Referral.${r}.target_specialist_id == ${s1} (tie-break created_at ASC: S1 created before S2)"
            - "Referral.${r}.match_score == 65 (proves the -15 penalty fired at exactly 0.8; without it S1 would score 80)"

      - name: match_tiebreak_created_at_when_scores_equal
        claim_type: precision
        grounds: [calculations.specialty_match_ranking]
        distinguishing_aspect: "Identical scores (two STANDARD, same region, no penalties) are broken by specialist.created_at ASC — never by id; the earlier-created specialist wins deterministically."
        test_recipe:
          setup: ["clock 2026-08-01; plan; patient region NORTH; provider; S1 then S2 both CARDIOLOGY NORTH capacity 10 STANDARD (S1 created first); referral ROUTINE accepted"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /specialty-providers", payload: { name: "S1", npi: "1000000001", specialty: "CARDIOLOGY", base_region: "NORTH", weekly_capacity: 10 }, as: NetworkAdmin, captures: { s1: $.data.id } }
            - { call: "POST /specialty-providers", payload: { name: "S2", npi: "1000000002", specialty: "CARDIOLOGY", base_region: "NORTH", weekly_capacity: 10 }, as: NetworkAdmin, captures: { s2: $.data.id } }
            - { call: "POST /network-participations", payload: { specialist_id: "${s1}", insurance_plan_id: "${plan1}", tier: "STANDARD", effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: NetworkAdmin }
            - { call: "POST /network-participations", payload: { specialist_id: "${s2}", insurance_plan_id: "${plan1}", tier: "STANDARD", effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: NetworkAdmin }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r: $.data.id } }
            - { call: "POST /referrals/${r}/accept", as: ReferralCoordinator }
          trigger:
            - { call: "POST /referrals/${r}/auto-match", as: ReferralCoordinator }
          assert:
            - "both candidates score 65 (50 + 10 STANDARD + 0 + 0 + 5 region)"
            - "Referral.${r}.target_specialist_id == ${s1} (created_at ASC tie-break) and match_score == 65"

      - name: sla_days_constants_applied_per_urgency
        claim_type: constants_applied
        grounds: [calculations.referral_sla_and_aging]
        distinguishing_aspect: "sla_due_at = triaged_at + {STAT:2, URGENT:7, ROUTINE:30} days exactly; three referrals accepted at the same instant expose all three constants."
        test_recipe:
          setup: ["clock 2026-08-01T00:00:00Z; plan; provider; patient; three referrals STAT/URGENT/ROUTINE"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I21", urgency: "STAT" }, as: ReferringProvider, as_user_id: "${pa}", captures: { rs: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I20", urgency: "URGENT" }, as: ReferringProvider, as_user_id: "${pa}", captures: { ru: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { rr: $.data.id } }
          trigger:
            - { call: "POST /referrals/${rs}/accept", as: ReferralCoordinator }
            - { call: "POST /referrals/${ru}/accept", as: ReferralCoordinator }
            - { call: "POST /referrals/${rr}/accept", as: ReferralCoordinator }
          assert:
            - "Referral.${rs}.sla_due_at == \"2026-08-03T00:00:00Z\""
            - "Referral.${ru}.sla_due_at == \"2026-08-08T00:00:00Z\""
            - "Referral.${rr}.sla_due_at == \"2026-08-31T00:00:00Z\""

      - name: snapshot_input_set_excludes_out_of_window_and_rejected
        claim_type: input_set_filtering
        grounds: [calculations.conversion_rate, calculations.period_close_aggregation]
        distinguishing_aspect: "Intake set = created_at in [period_start, period_end) AND status != REJECTED: a referral created 2026-07-31 (before window) and one REJECTED inside the window are both excluded; intake_count == 1."
        test_recipe:
          setup: ["plan; provider PA; patient PT; R0 created at clock 2026-07-31; clock 2026-08-05: R1 created then rejected, R2 created then accepted; clock 2026-09-01"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-31T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r0: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I11", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r1: $.data.id } }
            - { call: "POST /referrals/${r1}/reject", payload: { reason: "Duplicate" }, as: ReferralCoordinator }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I20", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r2: $.data.id } }
            - { call: "POST /referrals/${r2}/accept", as: ReferralCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /analytics/periods/close", payload: { period_start: "2026-08-01", period_end: "2026-09-01" }, as: NetworkAdmin }
            - { call: "GET /analytics/snapshots?referring_provider_id=${pa}", as: NetworkAdmin }
          assert:
            - "exactly 1 snapshot row; intake_count == 1 (only R2)"
            - "row.completed_count == 0, scheduled_basis_count == 0, conversion_rate_scheduled == 0.0000 (zero-denominator guard)"
            - "row.leakage_rate == 0.0000 and row has no `version` key (common_fields false)"

      - name: period_close_skips_providers_with_empty_intake
        claim_type: correct_result
        grounds: [calculations.period_close_aggregation]
        distinguishing_aspect: "Providers with zero non-REJECTED referrals in the window produce NO snapshot row (division-by-zero avoided by skipping, not by emitting 0.0000 rates)."
        test_recipe:
          setup: ["provider PA exists with no referrals; clock 2026-09-01"]
          setup_api_calls:
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /analytics/periods/close", payload: { period_start: "2026-08-01", period_end: "2026-09-01" }, as: NetworkAdmin, captures: { n: $.data.snapshot_count } }
          assert:
            - "snapshot_count == 0"
            - "GET /analytics/snapshots?referring_provider_id=${pa} returns 0 rows"

      - name: live_report_basis_selection_and_default
        claim_type: variant_selection
        grounds: [calculations.conversion_rate]
        distinguishing_aspect: "Live leakage-report picks the variant by basis param: INTAKE -> 1/2 = 0.5000, SCHEDULED -> 1/1 = 1.0000; omitting basis defaults to INTAKE."
        test_recipe:
          setup: ["clock 2026-08-01 bootstrap; provider PA with R1 fully completed (book 2026-08-02, confirm, complete) and R2 accepted only, never scheduled"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
            - { call: "POST /specialty-providers", payload: { name: "S1", npi: "1000000001", specialty: "CARDIOLOGY", base_region: "NORTH", weekly_capacity: 10 }, as: NetworkAdmin, captures: { s1: $.data.id } }
            - { call: "POST /network-participations", payload: { specialist_id: "${s1}", insurance_plan_id: "${plan1}", tier: "PREFERRED", effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: NetworkAdmin }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r1: $.data.id } }
            - { call: "POST /referrals/${r1}/accept", as: ReferralCoordinator }
            - { call: "POST /referrals/${r1}/assign-specialist", payload: { specialist_id: "${s1}" }, as: ReferralCoordinator, captures: { r1_v: $.data.version } }
            - { call: "POST /referrals/${r1}/appointments", payload: { expected_referral_version: "${r1_v}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }, as: ReferralCoordinator, captures: { a1: $.data.id } }
            - { call: "POST /appointments/${a1}/confirm", payload: { confirmation_channel: "PHONE" }, as: ReferralCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T11:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /appointments/${a1}/complete", as: SpecialistProvider, as_user_id: "${s1}" }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I11", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r2: $.data.id } }
            - { call: "POST /referrals/${r2}/accept", as: ReferralCoordinator }
          trigger:
            - { call: "GET /referring-providers/${pa}/leakage-report?basis=INTAKE", as: ReferralCoordinator }
            - { call: "GET /referring-providers/${pa}/leakage-report?basis=SCHEDULED", as: ReferralCoordinator }
            - { call: "GET /referring-providers/${pa}/leakage-report", as: ReferralCoordinator }
          assert:
            - "basis=INTAKE: conversion_rate == 0.5000 (1 completed / 2 intake)"
            - "basis=SCHEDULED: conversion_rate == 1.0000 (1 / 1 ever_scheduled)"
            - "omitted basis defaults to INTAKE: conversion_rate == 0.5000 and response.basis == \"INTAKE\""
            - "all three responses agree on intake_count == 2, completed_count == 1, leaked_count == 0"

      - name: no_show_risk_forward_capped_at_100
        claim_type: precision
        grounds: [calculations.no_show_risk_score]
        distinguishing_aspect: "Ceiling honored: 4 strikes + 1 overdue-unconfirmed give 25 x 4.5 = 112.5 pre-cap; the exposed forward score is capped at 100."
        test_recipe:
          setup:
            - "clock 2026-08-01; bootstrap; patient PT with 5 booked appointments at 10/12/14/16/18:00 on 2026-08-01; first four marked NO_SHOW once past grace; fifth left SCHEDULED; clock 2026-08-03 (fifth overdue > 24h)"
