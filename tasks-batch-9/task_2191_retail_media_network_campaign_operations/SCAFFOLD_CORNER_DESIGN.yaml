              as: CreditAnalyst
              as_user_id: "u_ca_1"
              captures: { child_v: $.data.version }
            - call: "POST /rmn/budget-plans"
              payload: { advertiser_id: "${child_id}", fiscal_period_code: "2026-Q3", committed_total_cents: 2000000, trade_fund_share_cents: 0, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-10-01T00:00:00Z", expected_advertiser_version: "${child_v}" }
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { child_plan_id: $.data.id }
            - call: "POST /rmn/budget-plans/${child_plan_id}/submit"
              payload: {}
              as: AccountManager
              as_user_id: "u_am_1"
            - call: "POST /rmn/budget-plans/${child_plan_id}/approve"
              payload: {}
              as: CreditAnalyst
              as_user_id: "u_ca_1"
          trigger:
            - call: "GET /rmn/advertisers/${child_id}/credit-summary"
