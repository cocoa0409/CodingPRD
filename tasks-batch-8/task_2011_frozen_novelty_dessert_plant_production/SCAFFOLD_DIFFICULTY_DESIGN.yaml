  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: start_wrong_state_beats_allergen_check
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ALLERGEN_CLEAN_NOT_VERIFIED]
        distinguishing_aspect: |
          Error-category pair (state, business_safety): the run is SCHEDULED (never
          mix-assigned, so start is not a valid transition — priority 6) AND the line
          has no VERIFIED changeover (priority 9 safety). The request must return
          ERR_INVALID_STATE because state preconditions outrank safety checks.
        test_recipe:
          setup:
            - "Product BAR-VAN-70 ACTIVE; NOVELTY line L-1 IDLE with NO changeover at all (allergen safety unmet)"
            - "Run R-W created for the product on L-1 and left in SCHEDULED (no mix assigned)"
          setup_api_calls:
            - { call: "POST /products", payload: { sku_code: "BAR-VAN-70", product_name: "Vanilla Bar 70ml", format: NOVELTY, flavor_family: VANILLA, allergens: [MILK], fill_volume_ml_per_unit: 70, target_overrun_pct: 40, units_per_pallet: 100, shelf_life_days: 540 }, as: PlantManager, captures: { p_bar: $.data.id } }
            - { call: "POST /lines", payload: { line_code: "L-1", format: NOVELTY, rate_units_per_hour: 12000 }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /production-runs", payload: { run_code: "R-W", product_id: "${p_bar}", line_id: "${l1}", planned_units: 1000, scheduled_start: "2026-08-10T14:00:00Z" }, as: ProductionPlanner, captures: { r1: $.data.id } }
          trigger:
            - call: "POST /production-runs/${r1}/start"
              payload: {}
              as: LineOperator
              as_user_id: "op_1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (priority 6 state beats priority 9 business_safety)"
            - "the allergen-clean failure is masked: error_id != ERR_ALLERGEN_CLEAN_NOT_VERIFIED"
            - "Run.${r1}.status remains SCHEDULED (no side effects fired)"

      - name: booking_temporal_vs_referential_priority
        grounds:
          - validations[priority=15]
          - validations[priority=17]
          - errors[ERR_TUNNEL_WINDOW_CONFLICT]
          - errors[ERR_RUN_NOT_SCHEDULABLE]
        distinguishing_aspect: |
          Different error-category pair than the sibling instance: (business_temporal,
          business_referential). The booking window overlaps an existing booking
          (priority 15 temporal) AND the referenced run is CANCELED (priority 17
          referential). ERR_TUNNEL_WINDOW_CONFLICT must win because temporal checks
          outrank referential checks.
        test_recipe:
          setup:
            - "Tunnel T-1 with existing BOOKED booking 2026-08-10T10:00-12:00 for run R-A"
            - "Run R-B exists but is CANCELED"
          setup_api_calls:
            - { call: "POST /products", payload: { sku_code: "BAR-VAN-70", product_name: "Vanilla Bar 70ml", format: NOVELTY, flavor_family: VANILLA, allergens: [MILK], fill_volume_ml_per_unit: 70, target_overrun_pct: 40, units_per_pallet: 100, shelf_life_days: 540 }, as: PlantManager, captures: { p_bar: $.data.id } }
            - { call: "POST /lines", payload: { line_code: "L-1", format: NOVELTY, rate_units_per_hour: 12000 }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /tunnels", payload: { tunnel_code: "T-1", max_units_per_hour: 20000 }, as: PlantManager, captures: { t1: $.data.id } }
            - { call: "POST /production-runs", payload: { run_code: "R-A", product_id: "${p_bar}", line_id: "${l1}", planned_units: 1000, scheduled_start: "2026-08-10T10:00:00Z" }, as: ProductionPlanner, captures: { ra: $.data.id } }
            - { call: "POST /tunnel-bookings", payload: { tunnel_id: "${t1}", run_id: "${ra}", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T12:00:00Z" }, as: ProductionPlanner }
            - { call: "POST /production-runs", payload: { run_code: "R-B", product_id: "${p_bar}", line_id: "${l1}", planned_units: 1000, scheduled_start: "2026-08-10T11:00:00Z" }, as: ProductionPlanner, captures: { rb: $.data.id } }
            - { call: "POST /production-runs/${rb}/cancel", payload: {}, as: ProductionPlanner }
          trigger:
            - call: "POST /tunnel-bookings"
              payload: { tunnel_id: "${t1}", run_id: "${rb}", start_at: "2026-08-10T11:00:00Z", end_at: "2026-08-10T13:00:00Z" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TUNNEL_WINDOW_CONFLICT (priority 15 temporal beats priority 17 referential)"
            - "the canceled-run failure is masked: error_id != ERR_RUN_NOT_SCHEDULABLE"
            - "no booking is created for run ${rb}"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: abuse_threshold_strictly_greater_boundary
        grounds:
          - calculations.temperature_replay
          - entities.TempAbuseClaim.fields.abuse_minutes
        distinguishing_aspect: |
          Boundary on the TEMPERATURE metric via the open-review endpoint: readings at
          exactly -18.0 C contribute ZERO abuse minutes because the threshold is
          strictly-greater (temp_c > -18.0); an off-by-one-epsilon implementation using
          >= would report 120 abuse minutes here.
        test_recipe:
          setup:
            - "Delivered shipment SH-E with readings 08:00 -18.0 and 09:00 -18.0, closed_at 10:00 (both intervals sit exactly on the threshold)"
            - "Claim CL-E declared_value_cents 50000 filed by the customer"
          setup_api_calls:
            - { call: "POST /products", payload: { sku_code: "BAR-VAN-70", product_name: "Vanilla Bar 70ml", format: NOVELTY, flavor_family: VANILLA, allergens: [MILK], fill_volume_ml_per_unit: 70, target_overrun_pct: 40, units_per_pallet: 100, shelf_life_days: 540 }, as: PlantManager, captures: { p_bar: $.data.id } }
            - { call: "POST /lines", payload: { line_code: "L-1", format: NOVELTY, rate_units_per_hour: 12000 }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /tunnels", payload: { tunnel_code: "T-1", max_units_per_hour: 20000 }, as: PlantManager, captures: { t1: $.data.id } }
            - { call: "POST /freezer-zones", payload: { zone_code: "Z-A", pallet_capacity: 400 }, as: PlantManager, captures: { z_a: $.data.id } }
            - { call: "POST /customers", payload: { customer_code: "C-DIST", display_name: "Distributor Co", kind: DISTRIBUTOR }, as: PlantManager, captures: { c_dist: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: PlantManager }
            - { call: "POST /mix-batches", payload: { batch_code: "MB-1", product_id: "${p_bar}", litres_produced: 500 }, as: ProductionPlanner, captures: { m1: $.data.id } }
            - { call: "POST /mix-batches/${m1}/pasteurize", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /mix-batches/${m1}/release", payload: {}, as: QAManager, as_user_id: "qa_1" }
            - { call: "POST /production-runs", payload: { run_code: "R-E", product_id: "${p_bar}", line_id: "${l1}", planned_units: 2000, scheduled_start: "2026-08-10T14:00:00Z" }, as: ProductionPlanner, captures: { r1: $.data.id } }
            - { call: "POST /changeovers", payload: { line_id: "${l1}", to_product_id: "${p_bar}" }, as: ProductionPlanner, captures: { ch1: $.data.id } }
            - { call: "POST /changeovers/${ch1}/complete", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /changeovers/${ch1}/verify", payload: { outcome: PASS }, as: QAManager, as_user_id: "qa_1" }
            - { call: "POST /tunnel-bookings", payload: { tunnel_id: "${t1}", run_id: "${r1}", start_at: "2026-08-10T13:00:00Z", end_at: "2026-08-10T14:00:00Z" }, as: ProductionPlanner }
            - { call: "POST /production-runs/${r1}/assign-mix", payload: { mix_batch_id: "${m1}" }, as: ProductionPlanner }
            - { call: "POST /production-runs/${r1}/start", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /production-runs/${r1}/complete", payload: { actual_units: 2000, mix_metered_litres: 100.0, zone_id: "${z_a}" }, as: LineOperator, as_user_id: "op_1" }
            - { call: "GET /inventory-lots", payload: { run_id: "${r1}" }, as: QAManager, captures: { lot1: "$.data[0].id" } }
            - { call: "POST /shipments", payload: { shipment_code: "SH-E", customer_id: "${c_dist}" }, as: WarehouseLead, captures: { s1: $.data.id } }
            - { call: "POST /shipments/${s1}/allocations", payload: { lot_id: "${lot1}", units: 500 }, as: WarehouseLead }
            - { call: "POST /shipments/${s1}/load", payload: {}, as: WarehouseLead }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T08:00:00Z" }, as: PlantManager }
            - { call: "POST /shipments/${s1}/dispatch", payload: {}, as: WarehouseLead }
            - { call: "POST /shipments/${s1}/temperature-readings", payload: { readings: [ { recorded_at: "2026-08-12T08:00:00Z", temp_c: -18.0 }, { recorded_at: "2026-08-12T09:00:00Z", temp_c: -18.0 } ] }, as: WarehouseLead }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: PlantManager }
            - { call: "POST /shipments/${s1}/deliver", payload: {}, as: WarehouseLead }
            - { call: "POST /temp-abuse-claims", payload: { claim_code: "CL-E", shipment_id: "${s1}", declared_value_cents: 50000 }, as: CustomerRep, as_user_id: "${c_dist}", captures: { cl1: $.data.id } }
          trigger:
            - call: "POST /temp-abuse-claims/${cl1}/open-review"
              payload: {}
              as: ClaimsAdjuster
              captures: { abuse: $.data.abuse_minutes, peak: $.data.peak_temp_c, pay: $.data.payout_standard_cents }
          assert:
            - "abuse_minutes == 0 (both intervals start at exactly -18.0; strictly-greater threshold excludes them)"
            - "peak_temp_c == -18.0"
            - "payout_standard_cents == 0 (minutes <= 30 free allowance)"

      - name: tunnel_buffer_exact_boundary
        grounds:
          - calculations.tunnel_window_conflict
          - state_machines.TunnelBooking
        distinguishing_aspect: |
          Boundary on the MINUTES-GAP metric via the tunnel-bookings endpoint (different
          metric and endpoint than the temperature instance): a booking starting at
          exactly existing.end + 30 minutes is ALLOWED (>= buffer), while 29 minutes is
          rejected — the two calls bracket the exact boundary.
        test_recipe:
          setup:
            - "Tunnel T-1 (20000 u/h); run R-A holds BOOKED booking 10:00-12:00"
            - "Run R-B (SCHEDULED, 1000 planned units) needs a window right after"
          setup_api_calls:
