  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: election_data_cleanliness_safety_beats_eligibility_constraint
        grounds:
          - validations.priority_53_ERR_PARTICIPANT_DATA_NOT_CLEAN
          - validations.priority_65_ERR_LUMP_SUM_NOT_ELIGIBLE
          - calculations.benefit_recomputation
          - calculations.lump_sum_present_value
          - state_machines.BenefitAudit.PASSED_CLOSED_to_SUPERSEDED
        distinguishing_aspect: |
          A single election request violates BOTH priority 53 (business_safety:
          benefit_audit_status must be PASSED_CLOSED or CORRECTED) and priority 65
          (business_constraint: raw_pv_cents must be at most the window's
          eligibility_max_lump_sum_cents). 53 is twelve rungs higher, so
          ERR_PARTICIPANT_DATA_NOT_CLEAN is returned and ERR_LUMP_SUM_NOT_ELIGIBLE
          is never reached. Reachability is delicate: the notice fan-out itself
          filters on the eligibility ceiling, so the participant has to be
          eligible at 12000000 when the notice is cut and only afterwards be
          pushed to 12072000 by an APPLY_CORRECTION — the eligibility breach is
          created after the election row already exists.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z, moved to 2026-09-01T00:00:00Z to open the window"
            - "one PensionPlan authorized for LUMP_SUM_ONLY settlement"
            - "one DEFERRED_VESTED participant, stated monthly 100000, FAME 251500, 320 months — so the independent recomputation is 100600 and the variance is -600, six hundred cents outside the 500 tolerance"
            - "one OPEN LumpSumWindow with eligibility_max_lump_sum_cents set to exactly 12000000, the raw_pv of the STATED benefit, so the notice is cut but any upward correction breaks eligibility"
            - "audit round 1 resolved with APPLY_CORRECTION so audited_monthly_benefit_cents becomes 100600 and raw_pv becomes 12072000"
            - "audit round 2 opened afterwards, superseding round 1 and leaving benefit_audit_status at CORRECTION_REQUIRED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
