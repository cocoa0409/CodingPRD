              as_user_id: "${s_id}"
              captures: { c_a_id: $.data.id }
            - call: "POST /coaches"
              payload: { school_id: "${s_id}", full_name: "Coach Bravo", email: "bravo@example.org" }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { c_b_id: $.data.id }
            - call: "POST /coaches"
              payload: { school_id: "${s_id}", full_name: "Coach Charlie", email: "charlie@example.org" }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { c_c_id: $.data.id }
            - call: "POST /coaches/${c_a_id}/certification"
              payload: { action: "CERTIFY", background_check_expires_on: "2027-06-30" }
              as: AthleticDirector
              as_user_id: "${s_id}"
            - call: "POST /coaches/${c_b_id}/certification"
              payload: { action: "CERTIFY", background_check_expires_on: "2027-06-30" }
              as: AthleticDirector
              as_user_id: "${s_id}"
            - call: "POST /coaches/${c_c_id}/certification"
              payload: { action: "CERTIFY", background_check_expires_on: "2027-06-30" }
              as: AthleticDirector
              as_user_id: "${s_id}"
            - call: "POST /titles"
              payload: { name: "Rocket Arena", publisher: "Nova Interactive", age_rating: "T", min_player_age: 13, server_pool_id: "POOL-A", server_pool_capacity: 1, match_duration_minutes: 60 }
              as: LeagueAdmin
              captures: { t_id: $.data.id }
            - call: "POST /title-approvals"
