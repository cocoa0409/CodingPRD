        test_recipe:
          setup: ["An empty database with the clock pinned"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ArtisticAdmin
          trigger:
            - call: "GET /orchestra/seasons/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ArtisticAdmin
              captures: { e_season: "$.data.error_id" }
            - call: "GET /orchestra/venues/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: ArtisticAdmin
              captures: { e_venue: "$.data.error_id" }
            - call: "GET /orchestra/sections/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: ArtisticAdmin
              captures: { e_section: "$.data.error_id" }
            - call: "GET /orchestra/concerts/00000000-0000-4000-8000-000000000004"
              payload: {}
