          - endpoints.POST_/auxiliary-systems/{id}/commission
        distinguishing_aspect: |
          The comparison is strict on the commission endpoint as well as on the witness calendar: a
          zero-length window with identical endpoints is 422, an inverted window is 422, and the same
          row commissions cleanly once start precedes end. The two refusals leave status PROPOSED and
          both outage timestamps null, so no partial window is stored.
