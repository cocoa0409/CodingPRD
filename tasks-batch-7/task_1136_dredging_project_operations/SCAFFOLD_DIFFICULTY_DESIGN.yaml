  - rule_id: compensating_invariant
    instances:
      - name: confirm_void_restores_capacity_invariant
        grounds:
          - calculations.disposal_remaining_capacity
          - state_machines.PlacementTicket.CONFIRMED_to_VOIDED
          - state_machines.DisposalSite.FULL_to_OPEN
        distinguishing_aspect: |
          Conserved quantity = capacity accounting (cubic yards): the forward action confirm (witnessed 3218 into
          capacity 3218) paired with its compensation void leaves used_cy + remaining_cy == capacity_cy exactly as
          before the pair, and the FULL -> OPEN side transition unwinds with it.
        test_recipe:
          setup:
            - "ACTIVE project, reach DREDGING, one COMPLETED event; site capacity 3218 bulking 1.6; clock 2026-05-13"
