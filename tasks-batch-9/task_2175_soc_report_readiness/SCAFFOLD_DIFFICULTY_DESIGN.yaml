        grounds:
          - state_machines.Control.design_status.DESIGN_APPROVED_to_DESIGN_DEFICIENT
          - state_machines.Control.operating_status.IN_OBSERVATION_to_TESTED_EXCEPTION
          - entities.Control.fields.design_status
          - entities.Control.fields.operating_status
          - state_machines.AuditException.UNEVALUATED_to_PERVASIVE
        distinguishing_aspect: |
          PARALLEL DIMENSIONS on one Control row: concluding the sample moves operating_status
          IN_OBSERVATION -> TESTED_EXCEPTION while design_status stays DESIGN_APPROVED, and the later
          PERVASIVE evaluation moves design_status DESIGN_APPROVED -> DESIGN_DEFICIENT while
          operating_status stays TESTED_EXCEPTION — neither dimension is a state of the other.
        test_recipe:
          setup:
            - "Engagement 'Northwind' (SOC_2_TYPE_2, categories [SECURITY]) is in FIELDWORK with gap_posture OPEN."
            - "Control S-01 (QUARTERLY / MANUAL / MODERATE, population_size 20) is DESIGN_APPROVED and IN_OBSERVATION."
            - "Its AuditSample has sample_size 4 and allowed_deviations 0, with three PASS items and one FAIL item recorded and status TESTING."
