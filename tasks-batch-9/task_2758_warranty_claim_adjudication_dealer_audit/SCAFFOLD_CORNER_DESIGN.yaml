          - entities.AuditFinding.fields.claim_id
          - entities.DealerAudit.fields.period_end
        distinguishing_aspect: |
          Eligibility joins three entities at once - the claim's dealer must be the audited dealer, its
          repair_date must fall in the HALF-OPEN audit period, and no sibling finding of the same audit may
          already name it - so a perfectly valid APPROVED PAID claim is still refused for the wrong reason set.
        test_recipe:
          setup:
            - "WORLD-AUDIT: dealer DA's claim RO-AUD-1 (2026-02-15, 20000) is APPROVED and PAID, inside the audit period [2026-01-01, 2026-04-01)."
            - "DA also holds RO-AUD-OLD dated 2025-12-10, APPROVED and PAID, before period_start."
            - "A second dealer DB holds RO-OTH-1 dated 2026-02-20, APPROVED and PAID, inside the period window but on the wrong dealer."
            - "The audit is IN_FIELD, so the priority-40 state gate passes and eligibility is what decides."
            - "Both extra claims were paid before the audit existed, so no audit hold interfered."
