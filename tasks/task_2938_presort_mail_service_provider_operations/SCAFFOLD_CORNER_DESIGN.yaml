              as: PresortOperator
              captures: { ship_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T14:00:00.000Z" }
              as: BureauAdmin
            - call: "POST /drop-shipments/${ship_id}/depart"
              payload: {}
              as: PresortOperator
            - call: "POST /drop-shipments/${ship_id}/deposit"
              payload: {}
              as: AcceptanceClerk
              as_user_id: "clerk-007"
            - call: "GET /sort-containers/${cont_1_id}/service-level-records"
              payload: {}
              as: AcceptanceClerk
              captures: { slr_1_id: "$.data[0].id" }
            - call: "GET /sort-containers/${cont_2_id}/service-level-records"
              payload: {}
              as: AcceptanceClerk
              captures: { slr_2_id: "$.data[0].id" }
          trigger:
            - call: "GET /clients/${cl_a_id}/service-level"
              payload: {}
              as: PostageManager
              captures: { zwi_0: $.data.zone_weighted_index, pwi_0: $.data.piece_weighted_index, count_0: $.data.record_count, ontime_0: $.data.on_time_count }
            - call: "POST /service-level-records/${slr_1_id}/delivery-scan"
              payload: { actual_delivery_days: 4, scanned_at_utc: "2026-08-16T10:00:00.000Z" }
              as: AcceptanceClerk
              as_user_id: "clerk-007"
              captures: { ontime_1: $.data.on_time }
            - call: "GET /clients/${cl_a_id}/service-level"
              payload: {}
              as: PostageManager
              captures: { zwi_1: $.data.zone_weighted_index, pwi_1: $.data.piece_weighted_index, count_1: $.data.record_count, ontime_count_1: $.data.on_time_count }
          assert:
            - "Before any scan: ${zwi_0} == null, ${pwi_0} == null, ${count_0} == 0 and ${ontime_0} == 0 — two records exist but none is in the input set"
            - "The scan settles the verdict: ${ontime_1} == true because actual_delivery_days 4 <= committed_days 4"
            - "After one scan: ${count_1} == 1, ${ontime_count_1} == 1, ${zwi_1} == 100.00 and ${pwi_1} == 100.00"
            - "Record ${slr_2_id} is still excluded (actual_delivery_days null) — treating it as late would have given 28.57 / 33.33 instead"
            - "Client BORE sees the identical numbers from the same commingled containers, because records are reached through BatchMember -> MailJob.client_id"

      - name: precision_service_index_rounds_half_up_to_two_decimals
        claim_type: precision
        grounds:
          - calculations.client_service_level_index.precision
          - calculations.client_service_level_index.constants.ZONE_WEIGHT
        distinguishing_aspect: "Both indexes are round_half_up to exactly two decimals, and this fixture forces UPWARD rounding in both variants from the same two records: zone-weighted 5*100/7 = 71.428571 -> 71.43 and piece-weighted 2000*100/3000 = 66.666666 -> 66.67. Truncation would report 71.42 and 66.66, and it is the on-time zone-8 record (weight 5, 2000 pieces) carrying the score, which is the mirror image of the 28.57 / 33.33 case."
        test_recipe:
          setup:
            - "Same deposited canonical batch as the filtering case: record 1 is zone 2 / committed_days 4 / 1000 pieces and record 2 is zone 8 / committed_days 7 / 2000 pieces, both unscanned."
          setup_api_calls: *corner_chain_deposited
          trigger:
            - call: "POST /service-level-records/${slr_1_id}/delivery-scan"
              payload: { actual_delivery_days: 5, scanned_at_utc: "2026-08-17T10:00:00.000Z" }
              as: AcceptanceClerk
              as_user_id: "clerk-007"
              captures: { ontime_1: $.data.on_time }
            - call: "POST /service-level-records/${slr_2_id}/delivery-scan"
              payload: { actual_delivery_days: 7, scanned_at_utc: "2026-08-19T10:00:00.000Z" }
              as: AcceptanceClerk
              as_user_id: "clerk-007"
              captures: { ontime_2: $.data.on_time }
            - call: "GET /clients/${cl_a_id}/service-level"
              payload: {}
              as: PostageManager
              captures: { zwi: $.data.zone_weighted_index, pwi: $.data.piece_weighted_index, count: $.data.record_count, ontime_count: $.data.on_time_count }
          assert:
            - "${ontime_1} == false: 5 > committed_days 4 for the zone-2 container"
            - "${ontime_2} == true: 7 <= committed_days 7 for the zone-8 container, because the comparison is <="
            - "${count} == 2 and ${ontime_count} == 1"
            - "${zwi} == 71.43 exactly (ZONE_WEIGHT 8 -> 5 on time over 5 + 2 = 7 total weight, 71.428571 rounded half up), not 71.42 and not 71.4"
            - "${pwi} == 66.67 exactly (2000 on-time pieces over 3000, 66.666666 rounded half up), not 66.66"

      - name: tiered_pricing_service_fee_ladder_on_the_invoice
        claim_type: tiered_pricing
        grounds:
          - calculations.client_invoice_charges
        excluded_because:
          difficulty_instance: combinatorial_formula / invoice_service_fee_ceil_tier_and_floor_interaction
          rationale: "That instance drives the per-thousand ceil ladder at both a partial thousand and the minimum-fee floor, asserting 2500 and 4400 against the naive proportional alternatives."

      - name: weighted_scoring_zone_versus_piece_weights
        claim_type: weighted_scoring
        grounds:
          - calculations.client_service_level_index
        excluded_because:
          difficulty_instance: dual_variant_calc / zone_weighted_versus_piece_weighted_service_index
          rationale: "Weight sourcing, the 28.57 / 33.33 divergence from identical records and the no-drift rounding are all asserted there."

      - name: waterfall_allocation_pro_rata_remainder_placement
        claim_type: waterfall_allocation
        grounds:
          - calculations.pro_rata_cost_allocation
        excluded_because:
          difficulty_instance: combinatorial_formula / pro_rata_remainder_goes_to_larger_contributor
          rationale: "The floor-then-largest-remainder waterfall is asserted there with the 31660 / 47492 split and the naive-half-up counterfactual 31661 / 47491."

      - name: constraint_propagation_cumulative_finding_severity
        claim_type: constraint_propagation
        grounds:
          - calculations.verification_adjustment
        excluded_because:
          difficulty_instance: combinatorial_formula / cumulative_finding_severity_is_order_sensitive
          rationale: "Order-sensitive severity escalation through the finding chain is asserted there, including the 11346 result versus 13720 for the reversed order."

      - name: interval_merge_dock_and_billing_windows
        claim_type: interval_merge
        grounds:
          - calculations.dock_capacity_occupancy
          - calculations.billing_period_exclusivity
        excluded_because:
          difficulty_instance: resource_temporal_overlap / dock_half_open_aggregate_capacity_at_facility
          rationale: "Half-open aggregate dock occupancy is asserted there (including the abutting window that must NOT overlap), and closed-interval pairwise billing exclusivity is asserted in resource_temporal_overlap / billing_period_closed_interval_pairwise_exclusivity."

      - name: variant_divergence_standalone_versus_commingled_rate
        claim_type: variant_divergence
        grounds:
          - calculations.commingled_postage_assessment.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / standalone_versus_commingled_rate_divergence
          rationale: "Both variants are computed over the identical jobs there and the 9168 c commingling delta is asserted."

      - name: variant_selection_estimate_endpoint_uses_the_standalone_variant
        claim_type: variant_selection
        grounds:
          - calculations.commingled_postage_assessment.variants
          - endpoints[GET /mail-jobs/{id}/postage-estimate]
        excluded_because:
          difficulty_instance: dual_variant_calc / standalone_versus_commingled_rate_divergence
          rationale: "Variant selection by context is asserted in the same instance: the estimate endpoint reports the job_standalone tier and rate while the batch and its members carry the commingled ones, from the same underlying rows."

  # ===========================================================================
  # Section 4 — Validations (§1.4)
  # ===========================================================================
  - section: validations
    instances:

      - name: violation_to_error_address_quality_below_the_floor_blocks_pooling
        claim_type: violation_to_error
        grounds:
          - validations[priority=24]
          - errors.ERR_ADDRESS_QUALITY_BELOW_MINIMUM
          - calculations.address_hygiene_metrics.constants.MIN_ADDRESS_QUALITY_PCT
        distinguishing_aspect: "The hygiene floor is enforced at POOLING, not at the hygiene run: a run with address_quality_pct 94.90 is accepted and recorded (the job even reaches HYGIENE_CLEARED) and only the member add is refused with 422. Nothing about the batch may move — total_piece_count stays 0 and achieved_tier stays NONE — and a corrective second run lifting quality to 96.00 makes the identical pooling call succeed."
        test_recipe:
          setup:
            - "Client FLOOR is ACTIVE with commingle_opt_in true and an ACTIVE permit account."
            - "One MARKETING_MAIL/LETTERS job of 1000 declared pieces and an OPEN MARKETING_MAIL/LETTERS batch at an OPEN SCF facility."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Floorline Mail", client_code: "FLOOR", service_fee_rate_per_thousand_cents: 1000 }
              as: BureauAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_id}", permit_number: "PI-310310", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_id: $.data.id }
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_id}", permit_account_id: "${pa_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1000, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { job_id: $.data.id }
            - call: "POST /mail-jobs/${job_id}/hygiene-runs"
              payload: { submitted_piece_count: 1000, cass_matched_count: 949, ncoa_move_updated_count: 30, undeliverable_removed_count: 0, move_update_age_days: 30 }
              as: PresortOperator
              captures: { quality_1: $.data.address_quality_pct }
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_id}" }
              as: PresortOperator
              captures: { err_id: $.data.error_id }
            - call: "POST /mail-jobs/${job_id}/hygiene-runs"
              payload: { submitted_piece_count: 1000, cass_matched_count: 960, ncoa_move_updated_count: 30, undeliverable_removed_count: 0, move_update_age_days: 30 }
              as: PresortOperator
              captures: { quality_2: $.data.address_quality_pct }
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_id}" }
              as: PresortOperator
              captures: { mem_id: $.data.id, contributed: $.data.contributed_piece_count }
          assert:
            - "${quality_1} == 94.90 (949*100/1000) and the run itself is accepted with HTTP 201 — the floor does not gate the hygiene run"
            - "Pooling refused: HTTP 422 with ${err_id} == ERR_ADDRESS_QUALITY_BELOW_MINIMUM, MailJob.${job_id}.status still HYGIENE_CLEARED (not POOLED) and commingle_batch_id still null"
            - "The batch is untouched: CommingleBatch.${batch_id}.total_piece_count == 0, member_job_count == 0, achieved_tier == NONE"
            - "${quality_2} == 96.00 from the corrective run, whose run_index is 1 and which replaces the mirror on the job"
            - "The identical pooling call now succeeds: BatchMember ${mem_id} exists with ${contributed} == 1000 and the batch reports total_piece_count 1000 with achieved_tier BASIC"

      - name: satisfaction_to_pass_address_quality_exactly_at_the_floor_pools
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=24]
          - calculations.address_hygiene_metrics.constants.MIN_ADDRESS_QUALITY_PCT
        distinguishing_aspect: "The floor comparison is >=, so a job sitting EXACTLY on 95.00 (950 CASS matches out of 950 + 50 = 1000 submitted) must pool successfully. A strict `>` implementation would refuse it, and comparing the rounded percentage against 95 as an integer would also mis-handle the two-decimal value."
        test_recipe:
          setup:
            - "Client EXACT is ACTIVE with commingle_opt_in true and an ACTIVE permit account."
            - "One MARKETING_MAIL/LETTERS job of 1000 declared pieces whose single hygiene run matched exactly 950 of 1000 submitted pieces, and an OPEN MARKETING_MAIL/LETTERS batch."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Exactline Mail", client_code: "EXACT", service_fee_rate_per_thousand_cents: 1000 }
              as: BureauAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_id}", permit_number: "PI-320320", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_id: $.data.id }
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_id}", permit_account_id: "${pa_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1000, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { job_id: $.data.id }
            - call: "POST /mail-jobs/${job_id}/hygiene-runs"
              payload: { submitted_piece_count: 1000, cass_matched_count: 950, ncoa_move_updated_count: 30, undeliverable_removed_count: 40, move_update_age_days: 95 }
              as: PresortOperator
              captures: { quality: $.data.address_quality_pct, net: $.data.net_piece_count, compliant: $.data.move_update_compliant }
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_id}" }
              as: PresortOperator
              captures: { mem_id: $.data.id, contributed: $.data.contributed_piece_count }
          assert:
            - "${quality} == 95.00 exactly, ${net} == 960 (1000 - 40 undeliverable) and ${compliant} == true at exactly MOVE_UPDATE_MAX_AGE_DAYS 95"
            - "HTTP 201: BatchMember ${mem_id} is created with ${contributed} == 960 — the snapshot is the NET count, not the submitted count"
            - "MailJob.${job_id}.status == POOLED with commingle_batch_id == ${batch_id}"
            - "CommingleBatch.${batch_id}.total_piece_count == 960 and achieved_tier == BASIC"

      - name: conditional_validation_commingle_opt_in_flag_gates_pooling
        claim_type: conditional_validation
        grounds:
          - validations[priority=27]
          - errors.ERR_COMMINGLE_OPT_OUT
          - entities.Client.fields.commingle_opt_in
        distinguishing_aspect: "Priority 27 fires only for clients configured with commingle_opt_in == false; the with/without pair proves the rule is read from the CLIENT's flag and not from the batch or the job. Two jobs identical in class, category, quality and move-update currency therefore get opposite outcomes on the same batch, and the refused one must leave the batch ledger at 0."
        test_recipe:
          setup:
            - "Client OPTOUT has commingle_opt_in false; client OPTIN takes the default true. Both are ACTIVE with ACTIVE permit accounts."
            - "Each owns one hygiene-cleared MARKETING_MAIL/LETTERS job of 1000 accepted pieces at 99.00 quality with move-update age 10."
            - "One OPEN MARKETING_MAIL/LETTERS batch at an OPEN SCF facility."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Solo Mailer", client_code: "OPTOUT", service_fee_rate_per_thousand_cents: 1500, commingle_opt_in: false }
              as: BureauAdmin
              captures: { cl_out_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Pooling Mailer", client_code: "OPTIN", service_fee_rate_per_thousand_cents: 1500 }
              as: BureauAdmin
              captures: { cl_in_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_out_id}", permit_number: "PI-330330", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_out_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_in_id}", permit_number: "PI-340340", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_in_id: $.data.id }
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_out_id}", permit_account_id: "${pa_out_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1000, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { job_out_id: $.data.id }
            - call: "POST /mail-jobs/${job_out_id}/hygiene-runs"
              payload: { submitted_piece_count: 1000, cass_matched_count: 990, ncoa_move_updated_count: 30, undeliverable_removed_count: 0, move_update_age_days: 10 }
              as: PresortOperator
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_in_id}", permit_account_id: "${pa_in_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1000, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { job_in_id: $.data.id }
            - call: "POST /mail-jobs/${job_in_id}/hygiene-runs"
              payload: { submitted_piece_count: 1000, cass_matched_count: 990, ncoa_move_updated_count: 30, undeliverable_removed_count: 0, move_update_age_days: 10 }
              as: PresortOperator
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_out_id}" }
              as: PresortOperator
              captures: { err_id: $.data.error_id }
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_in_id}" }
              as: PresortOperator
              captures: { mem_id: $.data.id }
          assert:
            - "Opt-out job: HTTP 422 with ${err_id} == ERR_COMMINGLE_OPT_OUT and MailJob.${job_out_id}.status still HYGIENE_CLEARED"
            - "After the refusal CommingleBatch.${batch_id}.total_piece_count == 0 and member_job_count == 0"
            - "Opt-in job with byte-identical hygiene numbers: HTTP 201, BatchMember ${mem_id} created, MailJob.${job_in_id}.status == POOLED"
            - "CommingleBatch.${batch_id}.total_piece_count == 1000, member_job_count == 1, achieved_tier == BASIC"

      - name: cascading_validation_sort_gates_run_empty_then_qualification_then_pieces
        claim_type: cascading_validation
        grounds:
          - validations[priority=32]
          - validations[priority=33]
          - validations[priority=34]
          - calculations.container_qualification
        distinguishing_aspect: "The three sortation gates are strictly ordered and each later check would be meaningless without the earlier one: an empty batch reports ERR_BATCH_HAS_NO_CONTAINERS (not a piece mismatch of 0 vs 0), a batch whose only container is a 100-piece FIVE_DIGIT tray reports ERR_CONTAINER_NOT_QUALIFIED even though its piece sum ALSO mismatches (100 vs 1000), and only once every container qualifies does ERR_CONTAINER_PIECE_MISMATCH surface."
