      - name: a_restricted_campaign_refuses_gate_waivers_but_still_accepts_reviewer_approvals
        claim_type: Error triggerable
        grounds:
          - errors[ERR_CAMPAIGN_POSTURE_RESTRICTED]
          - validations[priority=23]
          - calculations.campaign_governance_posture
        distinguishing_aspect: "RESTRICTED is a narrower gate than FROZEN: it blocks exactly one operation, the gate waiver, and nothing else. Two breached SLAs put the campaign at RESTRICT_GATE_COUNT precisely, and the ACCESSIBILITY gate that is itself still inside its 36-hour SLA cannot be waived — yet the same gate is approved by its own reviewer on the very next call."
        test_recipe:
          setup:
            - "Clock at 2026-08-03T08:00:00.000Z. One DRAFT item created by me-1 on an AWARENESS brief under a PRACTITIONER campaign, so no SLA factors apply and the gates open with 24h (SME), 24h (BRAND) and 36h (ACCESSIBILITY)."
            - "The item is submitted for review at 2026-08-03T08:00:00.000Z and the clock is then advanced to 2026-08-04T14:00:00.000Z — 30 hours later, past the two 24-hour deadlines but short of the 36-hour one."
            - "A governance sweep flags exactly the two overdue gates, taking breached_gate_count to the RESTRICT_GATE_COUNT threshold of 2."
