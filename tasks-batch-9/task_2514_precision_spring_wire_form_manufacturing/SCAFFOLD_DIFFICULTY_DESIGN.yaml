          setup:
            - "Oven OV-6 with capacity_kg 100.0 and max_temp_c 450.0."
            - "An INDUSTRIAL program with unpeened stainless design D2 and a RUNNING 1000-piece run to hang batches on, at logical clock 2026-08-05T04:30:00Z."
