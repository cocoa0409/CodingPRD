  # ===========================================================================
  - section: calculations
    instances:
      - name: income_tier_at_50pct_boundary_selects_low_over_standard
        claim_type: Constants Applied
        grounds:
          - calculations.household_income_check
          - calculations.applicant_priority_score
        distinguishing_aspect: "The 50% AMI tier edge is integer-exact and inclusive downward: 2700000 cents (exactly 50% of the size-1 AMI) keeps the 1.25 multiplier, while 2700001 drops to 1.0 — scores 50 vs 40 for an older-adult base."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. One STANDARD cycle; two older-adult applicants (base 40), household_size 1, incomes 2700000 and 2700001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27", fiscal_year: 2027, total_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { cyc: $.data.id }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "Tier At", date_of_birth: "1960-05-05", household_size: 1, household_income_cents: 2700000, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "14 Tier St" }
              as: Anonymous
              captures: { app_a: $.data.id }
            - call: "PATCH /rebuild/applications/${app_a}"
              payload: { status: "UNDER_VERIFICATION" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/applications/${app_a}"
              payload: { status: "VERIFIED" }
              as: AffiliateStaff
              captures: { score_a: $.data.priority_score }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "Tier Over", date_of_birth: "1960-05-05", household_size: 1, household_income_cents: 2700001, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "15 Tier St" }
              as: Anonymous
              captures: { app_b: $.data.id }
            - call: "PATCH /rebuild/applications/${app_b}"
              payload: { status: "UNDER_VERIFICATION" }
              as: AffiliateStaff
          trigger:
            - call: "PATCH /rebuild/applications/${app_b}"
              payload: { status: "VERIFIED" }
              as: AffiliateStaff
              captures: { score_b: $.data.priority_score }
          assert:
            - "score_a == 50 (2700000 * 100 <= 50 * 5400000 with equality, so TIER_LOW: 40 * 1.25)"
            - "score_b == 40 (2700001 * 100 > 50 * 5400000, so TIER_STD: 40 * 1.0)"

