          - calculations.lot_exposure.variants.expiration
          - endpoints.GET_/drug-lots/{id}/exposure
        distinguishing_aspect: "With no ADMINISTERED vial of the drug anywhere in the trailing 30-day window the burn rate is exactly zero, so projected_consumable floors to 0 and the EXPIRATION basis writes off all five unconsumed vials at 660000 cents even though the lot does not expire until 2027-06-30 — the expiration variant never looks at how far away the expiry is once the burn rate is zero."
        test_recipe:
          setup:
            - "the corner prologue with lot RX-9001 untouched: 5 IN_STOCK vials, no encounters anywhere"
            - "logical clock 2026-08-01T00:00:00Z, 31 days after the lot's received_date"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_lot
          trigger:
            - call: "GET /drug-lots/${k_lot_id}/exposure"
              payload: { basis: "EXPIRATION" }
              as: PharmacyTech
              captures: { k_exp_basis: $.data.basis, k_exp_cents: $.data.exposure_cents, k_exp_burn: $.data.projected_burn_vials, k_exp_risk: $.data.at_risk_vials, k_exp_unconsumed: $.data.unconsumed_vials, k_exp_days: $.data.days_held }
          assert:
            - "${k_exp_basis} == \"EXPIRATION\""
            - "${k_exp_burn} == 0 and ${k_exp_risk} == 5 and ${k_exp_unconsumed} == 5"
            - "${k_exp_cents} == 660000 == 5 * 132000"
            - "${k_exp_days} == 31 (whole days from received_date to the clock, reported on both bases)"
            - "the call persists nothing: DrugLot.${k_lot_id}.carrying_cost_accrued_cents is still 0 and version is unchanged"

      - name: corner_lot_exposure_carrying_and_expiration_diverge_on_one_lot
        claim_type: variant_divergence
        grounds:
          - calculations.lot_exposure.variants.carrying
          - calculations.lot_exposure.variants.expiration
        excluded_because:
          difficulty_instance: dual_variant_calc / lot_exposure_carrying_vs_expiration_diverge_on_one_lot
          rationale: "That §1.8 instance reads both bases off the same lot in one scenario and pins the two independent numbers."

      - name: corner_capacity_window_is_closed_at_twenty_four_hours
        claim_type: aggregation_boundary
        grounds:
          - calculations.clinician_day_capacity.constants.CAPACITY_WINDOW_HOURS
        excluded_because:
          difficulty_instance: boundary_precision_check / capacity_window_closed_at_exactly_twenty_four_hours
          rationale: "That §1.8 instance probes an encounter at exactly 86400 seconds before the request and one at 86401 seconds and pins the inclusive lower bound."

      - name: corner_step_therapy_count_ignores_draft_history_and_clears_the_gate
        claim_type: input_set_filtering
        grounds:
          - calculations.step_therapy_failure_count
          - entities.PayerDrugPolicy.step_therapy_prerequisite_drug_id
          - endpoints.POST_/prior-authorizations/{id}/submit
        distinguishing_aspect: "The failure count is keyed on effective_drug_id over statuses {DOCUMENTED, ATTESTED, BILLED, CLOSED} with ACTIVE imaging: the patient has one DOCUMENTED prerequisite injection and one DRAFT one, so step_therapy_failures_documented is 1, not 2, which exactly satisfies required_prior_failures 1 and lets the submission through."
        test_recipe:
          setup:
            - "payer ST requires step therapy on target Drug T with prerequisite Drug REF and required_prior_failures 1"
            - "patient P-S has an OD plan on REF with one DOCUMENTED encounter (2026-08-01) and one DRAFT encounter (2026-08-29), both against ACTIVE studies"
