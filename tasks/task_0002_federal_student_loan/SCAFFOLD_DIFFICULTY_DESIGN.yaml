            - call: "POST /loan-servicing/loans/${ln_id}/start-repayment"
              payload: {}
              as: LoanServicer
              captures: { ln_v: $.data.version }
            - call: "POST /loan-servicing/repayment-plans"
              payload: { loan_id: "${ln_id}", plan_type: "STANDARD", effective_date: "2025-06-01T00:00:00Z", expected_loan_version: "${ln_v}" }
              as: LoanServicer
              captures: { rp_id: $.data.id }
            - call: "POST /loan-servicing/repayment-plans/${rp_id}/activate"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/qualifying-employments"
              payload: { borrower_id: "${b_id}", employer_name: "Dept of W", employer_type: "GOVERNMENT", period_start: "2025-01-01T00:00:00Z", period_end: "2027-12-31T00:00:00Z" }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { qe_id: $.data.id }
            - call: "POST /loan-servicing/qualifying-employments/${qe_id}/certify"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/payments"
              payload: { loan_id: "${ln_id}", amount_cents: 100000, payment_date: "2026-04-15T00:00:00Z" }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /loan-servicing/payments/${pay_id}/apply"
              payload: {}
              as: LoanServicer
            - call: "GET /loan-servicing/loans/${ln_id}"
              payload: {}
              as: LoanServicer
              captures: { pslf_after_apply: $.data.pslf_qualifying_payment_count }
          trigger:
            - call: "POST /loan-servicing/payments/${pay_id}/reverse"
              payload: {}
              as: LoanServicer
            - call: "GET /loan-servicing/loans/${ln_id}"
              payload: {}
              as: LoanServicer
              captures: { pslf_after_reverse: $.data.pslf_qualifying_payment_count }
          assert:
            - "${pslf_after_apply} == 1"
            - "${pslf_after_reverse} == 0"
