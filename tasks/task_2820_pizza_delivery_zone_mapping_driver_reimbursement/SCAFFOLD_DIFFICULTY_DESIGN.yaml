  - rule_id: resource_temporal_overlap
    instances:

      - name: driver_occupation_interval_is_closed_so_touching_at_1834_conflicts
        grounds:
          - validations.priority_22
          - errors.ERR_DRIVER_WINDOW_CONFLICT
          - calculations.route_duration_model
          - entities.Store.fields.dispatch_reset_buffer_minutes
          - entities.Dispatch.fields.expected_return_at
          - state_machines.Dispatch.STACKED_to_LOCKED
        distinguishing_aspect: |
          The contended resource is ONE DRIVER and the interval is CLOSED at both
          ends: [planned_depart_at, expected_return_at + reset buffer]. A locked
          one-stop route departing 18:00 models 24 minutes, returns 18:24 and,
          with the store's 10 minute reset buffer, occupies the driver through
          18:34 INCLUSIVE. A second route for the same driver departing at exactly
          18:34 shares that single instant and must be refused, while 18:35 is
          accepted. Because the two hot-bag windows are disjoint in both cases,
          only the driver rule can fire, isolating it from the aggregate hot-bag
          rule tested by the sibling instance.
        test_recipe:
          setup:
            - "A store with dispatch_reset_buffer_minutes 10, hot_bag_count 4, handoff_minutes_per_stop 6 and the ceiling-40 zone model."
            - "Two IN_ZONE addresses at grid 3.00 miles, a CAR cost model, one QUALIFIED insured CAR driver."
            - "Two fee-disclosed READY orders."
            - "A first dispatch for that driver departing 18:00:00Z with one stop, LOCKED, whose route_minutes is 24 and expected_return_at is 18:24:00Z."
            - "A second dispatch for the SAME driver with planned_depart_at exactly 18:34:00Z holding the other order, STACKED and awaiting its lock."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: StoreManager
