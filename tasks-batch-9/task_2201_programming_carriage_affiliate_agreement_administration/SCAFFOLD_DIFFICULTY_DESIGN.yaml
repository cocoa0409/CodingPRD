            - "GET /carriage/blackout-rules with agreement_id=${a1_id} still returns exactly 2 rules"
            - "a differently-placed request for 2026-09-20T00:00:00Z..2026-09-21T00:00:00Z — clear of every 24-hour buffer but carrying the September total to 96.00 hours — returns 422 with data.error_id == \"ERR_BLACKOUT_MONTHLY_CAP_EXCEEDED\""

  # ===========================================================================
  # RULE 6 — boundary_precision_check
  # ===========================================================================
  - rule_id: boundary_precision_check
    rule_summary: >-
      Four boundaries where the admissible answer changes on the last digit: an
      inclusive penetration comparison evaluated at exactly four decimal places,
      an inclusive penalty-tier threshold, a half-cent that must round up rather
      than to even, and an inclusive co-op band lower bound. Each is paired with
      the adjacent value on the wrong side of the line.
    instances:

      - instance_id: BP-1
        name: penetration_floor_inclusive_at_exact_threshold
        grounds:
          - calculations.agreement_penetration_compliance
          - calculations.subscriber_report_license_fee
          - entities.SubscriberReport.fields.penetration_pct
          - entities.CarriageAgreement.fields.penetration_floor_pct
        title: "Penetration floor is inclusive, and the comparison happens at exactly 4 decimal places"
        boundary: "report.penetration_pct >= agreement.penetration_floor_pct, both rounded to 4 dp"
        rationale: >-
          agreement_penetration_compliance pins two things at once: the
          comparison is inclusive, so exactly meeting the floor is compliant and
          does not start the breach ladder; and both sides are rounded to four
          decimal places BEFORE comparison, which means a report that is
          arithmetically below the floor can still be compliant if it rounds onto
          it. The second effect is a consequence of the pinned precision, not an
          accident, and an implementation comparing raw ratios disagrees on
          exactly one subscriber.
        distinguishing_aspect: >-
          At 100,000 of 200,000 subscribers against a 0.50 floor,
          penetration_pct == 0.5000 and penetration_compliance_status ==
          COMPLIANT with penetration_breach_count == 0. At 99,999 subscribers the
          raw ratio 0.499995 rounds half-up to 0.5000 and the period is STILL
          COMPLIANT; only at 99,000 (0.4950) does the status flip to BREACH. Note
          that the FINAL billable count is 100,000 in all three cases, so the
          licence fee is an identical 4,000,000 cents whether the period is
          compliant or in breach — compliance and billing are decided by
          different comparisons.
        test_recipe:
          setup: >-
            Cliffside Telco has 200,000 total video subscribers and a 50%
            penetration floor on a flat 40.0000 BASIC agreement, so the
            enforceable floor is floor(0.50 * 200,000) = 100,000 subscribers. The
            operator reports exactly 100,000 for 2026-06 — the boundary value.
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Cliffside Telco"
                distributor_type: "TELCO"
                rate_card_class: "CLASS_B"
                total_subscribers: 200000
                credit_limit_cents: 100000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                d4_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${d4_id}"
                contract_code: "CT-2025-01"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
                launch_fee_cents: 0
                marketing_commitment_cents: 0
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a4_id: "id"
            - call: "POST /carriage/agreements/${a4_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${a4_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a4_version: "version"
            - call: "POST /carriage/subscriber-reports"
              payload:
                agreement_id: "${a4_id}"
                period_month: "2026-06"
                reported_subscribers: 100000
                reported_tier: "BASIC"
                expected_agreement_version: "${a4_version}"
              as: DistributorLiaison
              as_user_id: "${d4_id}"
              captures:
                rep_bound_id: "id"
          trigger:
            call: "POST /carriage/subscriber-reports/${rep_bound_id}/review"
            payload:
              action: "ACCEPT"
            as: RevenueAccountant
            as_user_id: "u-rev-1"
          assert:
            - "response body penetration_pct == 0.5000"
            - "response body billable_subscribers == 100000"
            - "response body license_fee_due_cents == 4000000"
            - "GET /carriage/agreements/${a4_id} returns penetration_compliance_status == \"COMPLIANT\""
            - "GET /carriage/agreements/${a4_id} returns penetration_breach_count == 0 and consecutive_compliant_periods == 1"
            - "GET /carriage/agreements/${a4_id} returns lifecycle_status == \"EXECUTED\""
            - "rerunning this recipe with reported_subscribers == 99999 yields penetration_pct == 0.5000, penetration_compliance_status == \"COMPLIANT\", penetration_breach_count == 0 and license_fee_due_cents == 4000000"
            - "rerunning this recipe with reported_subscribers == 99000 yields penetration_pct == 0.4950, penetration_compliance_status == \"BREACH\", penetration_breach_count == 1, consecutive_compliant_periods == 0 and license_fee_due_cents == 4000000"

      - instance_id: BP-2
        name: underreporting_penalty_threshold_inclusive_at_five_percent
        grounds:
          - calculations.audit_recovery_amount
          - entities.AuditEngagement.fields.underreporting_pct
          - entities.AuditEngagement.fields.penalty_multiplier
          - entities.AuditEngagement.fields.audit_cost_shift_cents
        title: "Underreporting penalty tier and audit-cost shift both trip at exactly 0.0500"
        boundary: "underreporting_pct >= PENALTY_TIER_1_THRESHOLD (0.05) and >= AUDIT_COST_SHIFT_THRESHOLD (0.05)"
        rationale: >-
          Two independent consequences hang off one inclusive threshold: the
          penalty multiplier steps from 1.00 to 1.10, and a flat 2,500,000-cent
          audit cost is shifted onto the operator. Both use >= on a value rounded
          to four decimal places. Because the audit cost is ADDED after the
          penalty multiplication rather than inside it, the boundary produces a
          discontinuity of 2,544,330 cents for a variance difference of 100
          subscribers.
        distinguishing_aspect: >-
          At 10,000 variance on 200,000 reported, underreporting_pct == 0.0500
          exactly, penalty_multiplier == 1.10, audit_cost_shift_cents == 2500000
          and recovery_amount_cents == 2943300. At 9,900 variance,
          underreporting_pct == 0.0495, penalty_multiplier == 1.00,
          audit_cost_shift_cents == 0 and recovery_amount_cents == 398970. An
          exclusive > comparison returns 1.00 and 398970-shaped output at the
          boundary; folding the audit cost inside the multiplication returns
          3187300.
        test_recipe:
          setup: >-
            Harbor Point Cable (CABLE_MSO, 400,000 total subscribers) carries the
            network on BASIC at a flat 40.0000 with a 40% penetration floor. It
            reports 200,000 subscribers for 2026-06 — 50.00% penetration, well
            clear of the floor — and the month is accepted at 8,000,000 cents. An
            audit engagement over 2026-06 on the PERIOD_RATE basis finds 210,000
            actual subscribers, a variance of exactly 10,000, which is
            round_half_up(10000/200000, 4) = 0.0500 of what was reported. The
            single finding prices at 10,000 * 40.0000 = 400,000 cents and accrues
            one month of interest at 0.75% (3,000 cents) because findings issue at
            the 2026-08-01 clock, one whole calendar month after 2026-06-30.
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Harbor Point Cable"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_C"
                total_subscribers: 400000
                credit_limit_cents: 150000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                d5_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${d5_id}"
                contract_code: "HP-2025-01"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.40
                committed_tier: "BASIC"
                launch_fee_cents: 0
                marketing_commitment_cents: 0
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a5_id: "id"
            - call: "POST /carriage/agreements/${a5_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${a5_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a5_version: "version"
            - call: "POST /carriage/subscriber-reports"
              payload:
                agreement_id: "${a5_id}"
                period_month: "2026-06"
                reported_subscribers: 200000
                reported_tier: "BASIC"
                expected_agreement_version: "${a5_version}"
              as: DistributorLiaison
              as_user_id: "${d5_id}"
              captures:
                rep5_id: "id"
                rep5_pen: "penetration_pct"
            - call: "POST /carriage/subscriber-reports/${rep5_id}/review"
              payload:
                action: "ACCEPT"
              as: RevenueAccountant
              as_user_id: "u-rev-1"
              captures:
                rep5_fee: "license_fee_due_cents"
            - call: "POST /carriage/audit-engagements"
              payload:
                agreement_id: "${a5_id}"
                sample_period_start: "2026-06"
                sample_period_end: "2026-06"
                rate_basis: "PERIOD_RATE"
              as: AuditManager
              as_user_id: "u-audit-1"
              captures:
                eng5_id: "id"
            - call: "POST /carriage/audit-engagements/${eng5_id}/lifecycle"
              payload:
                action: "START_FIELDWORK"
              as: AuditManager
              as_user_id: "u-audit-1"
            - call: "POST /carriage/audit-engagements/${eng5_id}/findings"
              payload:
                subscriber_report_id: "${rep5_id}"
                audited_subscribers: 210000
              as: AuditManager
              as_user_id: "u-audit-1"
              captures:
                find5_id: "id"
                find5_variance: "variance_subscribers"
          trigger:
            call: "POST /carriage/audit-engagements/${eng5_id}/lifecycle"
            payload:
              action: "ISSUE_FINDINGS"
            as: AuditManager
            as_user_id: "u-audit-1"
          assert:
            - "the captured rep5_fee equals 8000000 and find5_variance equals 10000"
            - "response body total_variance_subscribers == 10000"
            - "response body total_reported_subscribers == 200000"
            - "response body underreporting_pct == 0.0500"
            - "response body penalty_multiplier == 1.10"
            - "response body audit_cost_shift_cents == 2500000"
            - "response body base_recovery_cents == 400000"
            - "response body interest_cents == 3000"
            - "response body recovery_amount_cents == 2943300"
            - "response body recovery_amount_cents is NOT 3187300, which is what multiplying the audit cost by the penalty would give"
            - "rerunning this recipe with audited_subscribers == 209900 yields underreporting_pct == 0.0495, penalty_multiplier == 1.00, audit_cost_shift_cents == 0, base_recovery_cents == 396000, interest_cents == 2970 and recovery_amount_cents == 398970"

      - instance_id: BP-3
        name: license_fee_half_cent_rounds_half_up
        grounds:
          - calculations.subscriber_report_license_fee
          - entities.CarriageAgreement.fields.base_license_fee_cents_per_sub
          - entities.SubscriberReport.fields.license_fee_due_cents
        title: "A licence fee landing on exactly half a cent must round up, not to even"
        boundary: "round_half_up(billable * rate * tier_multiplier, 0) where the product is exactly x.5"
        rationale: >-
          Rates carry four decimal places of a cent, so a monthly fee can land on
          a fraction of a cent that is exactly one half. The scaffold pins
          round_half_up and pins that the rounding happens once per report before
          any summation. Python's default round() and IEEE round-half-to-even both
          answer 40000 here; the required answer is 40001. This is the only place
          the two rounding conventions can be told apart from the API surface.
        distinguishing_aspect: >-
          license_fee_due_cents == 40001, not 40000. The product is exactly
          1,000 * 40.0005 * 1.00 = 40000.5 cents. rate_applied_cents_per_sub is
          reported as 40.0005, confirming the four-decimal rate survived to the
          multiplication rather than being pre-rounded to 40 (which would give
          40000 as well, by a different mistake).
        test_recipe:
          setup: >-
            Ridgeway Cable is a small rural system with 2,000 total video
            subscribers. Its agreement is priced at 40.0005 cents per subscriber
            per month with no escalator, a 50% penetration floor (enforceable
            floor floor(0.50 * 2,000) = 1,000 subscribers, comfortably above the
            1-subscriber enforceability minimum) and a BASIC tier commitment whose
            multiplier is exactly 1.00, so nothing else perturbs the product. The
            operator reports exactly 1,000 subscribers for 2026-06.
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Ridgeway Cable Cooperative"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_C"
                total_subscribers: 2000
                credit_limit_cents: 5000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                d6_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${d6_id}"
                contract_code: "RC-2025-01"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0005
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
                launch_fee_cents: 0
                marketing_commitment_cents: 0
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a6_id: "id"
            - call: "POST /carriage/agreements/${a6_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${a6_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a6_version: "version"
                a6_rate: "effective_rate_cents_per_sub"
            - call: "POST /carriage/subscriber-reports"
              payload:
                agreement_id: "${a6_id}"
                period_month: "2026-06"
                reported_subscribers: 1000
                reported_tier: "BASIC"
                expected_agreement_version: "${a6_version}"
              as: DistributorLiaison
              as_user_id: "${d6_id}"
              captures:
                rep6_id: "id"
                rep6_provisional: "provisional_fee_cents"
          trigger:
            call: "POST /carriage/subscriber-reports/${rep6_id}/review"
            payload:
              action: "ACCEPT"
            as: RevenueAccountant
            as_user_id: "u-rev-1"
          assert:
            - "the captured a6_rate equals 40.0005 and rep6_provisional equals 40001"
            - "response body rate_applied_cents_per_sub == 40.0005"
            - "response body billable_subscribers == 1000"
            - "response body penetration_pct == 0.5000"
            - "response body license_fee_due_cents == 40001"
            - "response body license_fee_due_cents is NOT 40000"
            - "GET /carriage/agreements/${a6_id} returns recognized_revenue_cents == 40001"

      - instance_id: BP-4
        name: coop_band_lower_bound_inclusive_at_five_million_gross
        grounds:
          - calculations.invoice_net_due
          - entities.Invoice.fields.coop_cap_pct
          - entities.Invoice.fields.gross_license_fee_cents
          - entities.Invoice.fields.net_due_cents
        title: "Co-op ceiling band lower bound is inclusive at exactly 5,000,000 cents of gross"
        boundary: "coop_cap_pct = 0.08 when gross >= COOP_BAND_1_MAX (5,000,000), 0.05 below it"
        rationale: >-
          The co-op ceiling bands are specified with inclusive lower bounds, so a
          gross of exactly 5,000,000 belongs to the 0.08 band, not the 0.05 band.
          One subscriber less takes the gross to 4,999,960 and drops the whole
          invoice into the 0.05 band. Because the pool of earned-unbilled co-op
          support (500,000) exceeds both ceilings, the ceiling alone decides the
          offset, which makes the band change directly visible in net_due_cents.
        distinguishing_aspect: >-
          At gross 5000000: coop_cap_pct == 0.08, coop_offset_cents == 400000,
          net_due_cents == 4600000. At gross 4999960: coop_cap_pct == 0.05,
          coop_offset_cents == 249998, net_due_cents == 4749962. Note the
          perversity the inclusive boundary creates — 40 cents less gross leaves
          the operator owing 149,962 cents MORE, which is exactly the kind of
          discontinuity an exclusive comparison would move by one subscriber.
        test_recipe:
          setup: >-
            Cliffside Telco on the flat 40.0000 BASIC agreement with a 50%
            penetration floor. A COOP_ADVERTISING commitment of 1,000,000 cents
            has 500,000 earned and nothing billed. The operator reports exactly
            125,000 subscribers for 2026-06, which bills 125,000 * 40.0000 =
            5,000,000 cents — precisely the band-2 lower bound.
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Cliffside Telco"
                distributor_type: "TELCO"
                rate_card_class: "CLASS_B"
                total_subscribers: 200000
                credit_limit_cents: 100000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                d4_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${d4_id}"
                contract_code: "CT-2025-01"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
                launch_fee_cents: 0
                marketing_commitment_cents: 0
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a4_id: "id"
            - call: "POST /carriage/agreements/${a4_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${a4_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a4_version: "version"
            - call: "POST /carriage/marketing-commitments"
              payload:
                agreement_id: "${a4_id}"
                commitment_type: "COOP_ADVERTISING"
                committed_cents: 1000000
                performance_deadline: "2026-12-31T00:00:00Z"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                coop1_id: "id"
            - call: "POST /carriage/marketing-commitments/${coop1_id}/earn"
              payload:
                earned_cents: 500000
                proof_reference: "COOP-Q2-2026-INSERTION-ORDER"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/subscriber-reports"
              payload:
                agreement_id: "${a4_id}"
                period_month: "2026-06"
                reported_subscribers: 125000
                reported_tier: "BASIC"
                expected_agreement_version: "${a4_version}"
              as: DistributorLiaison
              as_user_id: "${d4_id}"
              captures:
                rep_band_id: "id"
            - call: "POST /carriage/subscriber-reports/${rep_band_id}/review"
              payload:
                action: "ACCEPT"
              as: RevenueAccountant
              as_user_id: "u-rev-1"
              captures:
                rep_band_fee: "license_fee_due_cents"
            - call: "GET /carriage/distributors/${d4_id}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "u-rev-1"
              captures:
                d4_version: "version"
          trigger:
            call: "POST /carriage/invoices"
            payload:
              distributor_id: "${d4_id}"
              agreement_id: "${a4_id}"
              period_month: "2026-06"
              invoice_kind: "LICENSE_FEE"
              expected_distributor_version: "${d4_version}"
            as: RevenueAccountant
            as_user_id: "u-rev-1"
          assert:
            - "the captured rep_band_fee equals 5000000"
            - "response body gross_license_fee_cents == 5000000"
            - "response body coop_cap_pct == 0.08"
            - "response body coop_offset_cents == 400000"
            - "response body net_due_cents == 4600000"
            - "response body coop_cap_pct is NOT 0.05 and coop_offset_cents is NOT 250000"
            - "rerunning this recipe with reported_subscribers == 124999 yields gross_license_fee_cents == 4999960, coop_cap_pct == 0.05, coop_offset_cents == 249998 and net_due_cents == 4749962"
            - "GET /carriage/marketing-commitments/${coop1_id} still returns billed_cents == 0 and earned_unbilled_cents == 500000, because a DRAFT invoice reserves nothing"

  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    rule_summary: >-
      Three operations whose own entity is in a perfectly admissible source state
      and which still fail, because admissibility is a property of a DIFFERENT
      aggregate: the parent agreement's lifecycle for report acceptance, the
      operator's credit standing for invoice issuance, and the content title's
      rights standing for window clearance. In each case the guard has an
      admissible set that is not simply one state.
    instances:

      - instance_id: CE-1
        name: report_acceptance_requires_executed_or_suspended_agreement
        grounds:
          - validations[priority=40]
          - errors[ERR_AGREEMENT_NOT_EXECUTED]
          - state_machines.SubscriberReport.SUBMITTED_to_ACCEPTED
          - entities.CarriageAgreement.fields.lifecycle_status
        title: "Report acceptance depends on the agreement's lifecycle, whose admissible set is {EXECUTED, SUSPENDED}"
        dependency: "SubscriberReport.status == SUBMITTED is admissible, but CarriageAgreement.lifecycle_status must be EXECUTED or SUSPENDED"
        rationale: >-
          A report may be filed against an agreement that has not yet been
          executed — operators often begin reporting during a launch overlap — but
          it may not be ACCEPTED, because acceptance recognizes revenue against a
          contract that does not yet exist. The admissible set is deliberately
          {EXECUTED, SUSPENDED} rather than {EXECUTED}: a suspended agreement must
          keep settling its reported periods, since three consecutive compliant
          acceptances are the ONLY way to clear penetration_breach_count and
          become eligible for reinstatement. So the guard is neither "any state"
          nor "one state".
        distinguishing_aspect: >-
          Accepting a SUBMITTED report on a DRAFT agreement returns 409
          ERR_AGREEMENT_NOT_EXECUTED and leaves the report at SUBMITTED with
          license_fee_due_cents == null; accepting the identically-shaped report on
          a SUSPENDED agreement returns 200 and stamps the fee. An implementation
          that tests lifecycle_status == "EXECUTED" fails the second half; one that
          omits the check entirely fails the first.
        test_recipe:
          setup: >-
            Two Cliffside-shaped agreements exist. The first is left in DRAFT — it
            has never been submitted for negotiation — and carries a filed 2026-06
            report at 130,000 subscribers. The second is executed and then manually
            suspended, and carries an identically-shaped 2026-06 report. Both
            reports sit at SUBMITTED, the admissible source state for ACCEPT.
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Cliffside Telco"
                distributor_type: "TELCO"
                rate_card_class: "CLASS_B"
                total_subscribers: 200000
                credit_limit_cents: 100000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                d4_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${d4_id}"
                contract_code: "CT-DRAFT-01"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
                launch_fee_cents: 0
                marketing_commitment_cents: 0
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a_draft_id: "id"
                a_draft_version: "version"
                a_draft_lifecycle: "lifecycle_status"
            - call: "POST /carriage/subscriber-reports"
              payload:
                agreement_id: "${a_draft_id}"
                period_month: "2026-06"
                reported_subscribers: 130000
                reported_tier: "BASIC"
                expected_agreement_version: "${a_draft_version}"
              as: DistributorLiaison
              as_user_id: "${d4_id}"
              captures:
                rep_draft_id: "id"
                rep_draft_status: "status"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${d4_id}"
                contract_code: "CT-SUSP-02"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
                launch_fee_cents: 0
                marketing_commitment_cents: 0
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a_susp_id: "id"
            - call: "POST /carriage/agreements/${a_susp_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${a_susp_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a_susp_version: "version"
            - call: "POST /carriage/subscriber-reports"
              payload:
                agreement_id: "${a_susp_id}"
                period_month: "2026-06"
                reported_subscribers: 130000
                reported_tier: "BASIC"
                expected_agreement_version: "${a_susp_version}"
              as: DistributorLiaison
              as_user_id: "${d4_id}"
              captures:
                rep_susp_id: "id"
            - call: "POST /carriage/agreements/${a_susp_id}/lifecycle"
              payload:
                action: "SUSPEND"
                suspension_reason: "MANUAL_SUSPENSION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a_susp_lifecycle: "lifecycle_status"
          trigger:
            call: "POST /carriage/subscriber-reports/${rep_draft_id}/review"
