  - section: rbac
    instances:

      - name: customer_role_cannot_create_network
        claim_type: role_denial
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "CustomerOps (an entity-backed customer identity) calling the PlatformAdmin-exclusive network create is 403 ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup:
            - "Customer Fabrikam exists."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
          trigger:
            - call: "POST /gas-supply/pipeline-networks"
              payload: { name: "Rogue Net", nameplate_capacity_nm3h: 1000 }
              as: CustomerOps
              as_user_id: "${c_fab}"
              captures: { err_rb1: $.data.error_id }
          assert:
            - "the response status is 403 and ${err_rb1} == ERR_UNAUTHORIZED_ROLE"

      - name: analyst_cannot_certify_role
        claim_type: role_denial
        grounds:
          - roles.QualityCertifier.exclusive_operations
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "The QualityAnalyst role is denied the certify action outright (403), independent of identity — segregation is enforced at BOTH role and identity layers."
        test_recipe:
          setup:
            - "Delivery confirmed; certificate RECORDED by qa-1."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_tank_std
            - *k_rd1
            - *k_rd2
            - call: "GET /gas-supply/deliveries"
              payload: { tank_id: "${t_std}" }
              as: PipelineDispatcher
              captures: { d_rb: "$.data[0].id" }
            - call: "POST /gas-supply/deliveries/${d_rb}/confirm-delivery"
              payload: { delivered_quantity_liters: 30000 }
              as: PipelineDispatcher
            - call: "POST /gas-supply/deliveries/${d_rb}/quality-certificates"
              payload: { sampled_at: "2026-10-01T08:00:00Z", measured_purity_percent: 99.9995, measured_impurity_ppm: 5 }
              as: QualityAnalyst
              as_user_id: "qa-1"
              captures: { qc_rb: $.data.id }
          trigger:
            - call: "POST /gas-supply/quality-certificates/${qc_rb}/certify"
              payload: { decision: "CERTIFIED" }
              as: QualityAnalyst
              as_user_id: "qa-2"
              captures: { err_rb2: $.data.error_id }
          assert:
            - "the response status is 403 and ${err_rb2} == ERR_UNAUTHORIZED_ROLE (role gate fires before the identity check)"

      - name: segregation_same_user_certify_rejected
        claim_type: Segregation of duties
        grounds:
          - validations[priority=5]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "A QualityCertifier whose X-User-ID equals the certificate's analyst_user_id is rejected 422 ERR_SEGREGATION_OF_DUTIES — the same PERSON may pass the role gate but never the identity gate."
        test_recipe:
          setup:
            - "Delivery confirmed; certificate RECORDED with analyst_user_id \"qa-shared\"."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_tank_std
            - *k_rd1
            - *k_rd2
            - call: "GET /gas-supply/deliveries"
              payload: { tank_id: "${t_std}" }
              as: PipelineDispatcher
              captures: { d_sd: "$.data[0].id" }
            - call: "POST /gas-supply/deliveries/${d_sd}/confirm-delivery"
              payload: { delivered_quantity_liters: 30000 }
              as: PipelineDispatcher
            - call: "POST /gas-supply/deliveries/${d_sd}/quality-certificates"
              payload: { sampled_at: "2026-10-01T08:00:00Z", measured_purity_percent: 99.9995, measured_impurity_ppm: 5 }
              as: QualityAnalyst
              as_user_id: "qa-shared"
              captures: { qc_sd: $.data.id }
          trigger:
            - call: "POST /gas-supply/quality-certificates/${qc_sd}/certify"
              payload: { decision: "CERTIFIED" }
              as: QualityCertifier
              as_user_id: "qa-shared"
              captures: { err_sd: $.data.error_id }
          assert:
            - "the response status is 422 and ${err_sd} == ERR_SEGREGATION_OF_DUTIES"
            - "QualityCertificate.${qc_sd}.result remains RECORDED"

      - name: customer_accepting_others_evaluation_forbidden
        claim_type: role_denial
        grounds:
          - roles.CustomerOps
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "CustomerOps with X-User-ID of customer B cannot accept customer A's evaluation (403) — entity-backed identity pins ownership."
        test_recipe:
          setup:
            - "Customers Fabrikam and OtherCo exist; Fabrikam's evaluation is EVALUATED."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - call: "POST /gas-supply/customers"
              payload: { name: "OtherCo", segment: "CHEMICAL" }
              as: PlatformAdmin
              captures: { c_oth: $.data.id }
            - *k_eval_fab
          trigger:
            - call: "POST /gas-supply/supply-mode-evaluations/${e_fab}/accept"
              payload: {}
              as: CustomerOps
              as_user_id: "${c_oth}"
              captures: { err_rb3: $.data.error_id }
          assert:
            - "the response status is 403 and ${err_rb3} == ERR_UNAUTHORIZED_ROLE"
            - "SupplyModeEvaluation.${e_fab}.status remains EVALUATED"

      - name: telemetry_gateway_cannot_confirm_delivery
        claim_type: role_denial
        grounds:
          - roles.PipelineDispatcher.exclusive_operations
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "The TelemetryGateway role (write access to telemetry only) is denied confirm-delivery with 403."
        test_recipe:
          setup:
            - "Tank-triggered delivery exists."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_tank_std
            - *k_rd1
            - *k_rd2
            - call: "GET /gas-supply/deliveries"
              payload: { tank_id: "${t_std}" }
              as: PipelineDispatcher
              captures: { d_tg: "$.data[0].id" }
          trigger:
            - call: "POST /gas-supply/deliveries/${d_tg}/confirm-delivery"
              payload: { delivered_quantity_liters: 30000 }
              as: TelemetryGateway
              captures: { err_rb4: $.data.error_id }
          assert:
            - "the response status is 403 and ${err_rb4} == ERR_UNAUTHORIZED_ROLE"

  # ===========================================================================
  - section: complexity_layers
    instances:

      - name: occ_contract_amendment_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[contract-amendment-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "A successful AMENDMENT bumps SupplyContract.version (2 -> 3); replaying the same call with the pre-amendment version 2 is rejected 412 ERR_STALE_VERSION — deterministic, sequential, no overlap needed."
        test_recipe:
          setup:
            - "K_FAB ACTIVE at version 2."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_eval_fab
            - *k_accept_fab
            - *k_contract_fab
            - *k_activate_fab
          trigger:
            - call: "POST /gas-supply/supply-contracts/${k_fab}/amendments"
              payload: { kind: "AMENDMENT", expected_contract_version: "${kfab_v0}", new_monthly_facility_fee_cents: 510000 }
              as: SupplyPlanner
              captures: { k_v3: $.data.version, k_fee3: $.data.monthly_facility_fee_cents }
            - call: "POST /gas-supply/supply-contracts/${k_fab}/amendments"
              payload: { kind: "AMENDMENT", expected_contract_version: "${kfab_v0}", new_monthly_facility_fee_cents: 520000 }
              as: SupplyPlanner
              captures: { err_occ1: $.data.error_id }
          assert:
            - "first amendment succeeds: version == ${kfab_v0} + 1 and monthly_facility_fee_cents == 510000"
            - "replayed amendment with the stale version: 412 ${err_occ1} == ERR_STALE_VERSION"
            - "monthly_facility_fee_cents remains 510000 (the stale write changed nothing)"

      - name: occ_turnaround_respond_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[turnaround-respond-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "The same OCC pattern on a DIFFERENT parent: after a COUNTER bumps Turnaround.version, an AGREE carrying the pre-counter version is rejected 412 — the customer cannot agree to a window they never saw."
        test_recipe:
          setup:
            - "K_FAB ACTIVE; P_FAB OPERATING; turnaround proposed at version 1."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_eval_fab
            - *k_accept_fab
            - *k_contract_fab
            - *k_activate_fab
            - *k_plant_fab
            - *k_adv1
            - *k_adv2
            - *k_adv3
            - call: "POST /gas-supply/onsite-plants/${p_fab}/turnarounds"
              payload: { window_start: "2026-11-01T00:00:00Z", window_end: "2026-11-05T00:00:00Z", scope: "OCC check" }
              as: PlantOperator
              captures: { ta_oc: $.data.id, ta_oc_v: $.data.version }
          trigger:
            - call: "POST /gas-supply/turnarounds/${ta_oc}/respond"
              payload: { decision: "COUNTER", expected_turnaround_version: "${ta_oc_v}", counter_window_start: "2026-11-10T00:00:00Z", counter_window_end: "2026-11-14T00:00:00Z" }
              as: CustomerOps
              as_user_id: "${c_fab}"
            - call: "POST /gas-supply/turnarounds/${ta_oc}/respond"
              payload: { decision: "AGREE", expected_turnaround_version: "${ta_oc_v}" }
              as: CustomerOps
              as_user_id: "${c_fab}"
              captures: { err_occ2: $.data.error_id }
          assert:
            - "stale AGREE: 412 ${err_occ2} == ERR_STALE_VERSION"
            - "Turnaround.${ta_oc}.status remains PROPOSED with the counter window [2026-11-10, 2026-11-14)"

      - name: renewal_window_opens_exactly_at_boundary
        claim_type: scheduled_actions
        grounds:
          - state_machines.SupplyContract.ACTIVE_to_RENEWAL_OPEN
        excluded_because:
          difficulty_instance: non_linear_state_machine / contract_renewal_cycle
          rationale: "The §1.8 instance sets the clock to exactly end_date - 90d (2036-07-03) and asserts RENEWAL_OPEN before renewing."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_read_after_write_consistency
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Writes are visible in the same request's response and in the immediately following GET: a created tank already shows computed posture NORMAL with null level, and a confirmed delivery reads back DELIVERED."
        test_recipe:
          setup:
            - "Customer Fabrikam exists."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
          trigger:
            - call: "POST /gas-supply/storage-tanks"
              payload: { customer_id: "${c_fab}", site_label: "FAB-1", product: "N2", capacity_liters: 50000, reorder_point_liters: 20000, safety_stock_liters: 5000, required_purity_percent: 99.9, max_impurity_ppm: 50 }
              as: PlantOperator
              captures: { t_ic: $.data.id, t_ic_st: $.data.status }
            - call: "GET /gas-supply/storage-tanks/${t_ic}"
              payload: {}
              as: PlantOperator
              captures: { t_ic_st2: $.data.status, t_ic_lvl: $.data.current_level_liters }
          assert:
            - "create response already carries status == NORMAL (computed eagerly, not eventually)"
            - "immediate GET agrees: status == NORMAL and current_level_liters is null"
            - "tank version == 1 on both the create response and the GET (no hidden mutation between them)"
