            - call: "POST /api/bypass-events"
              payload: { vehicle_id: "11111111-2222-4333-8444-555555555555", station_id: "11111111-2222-4333-8444-555555555556", approach_at: "2026-08-01T00:00:00Z" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { r4: $.data.error_id }
            - call: "POST /api/invoices/11111111-2222-4333-8444-555555555555/record-payment"
