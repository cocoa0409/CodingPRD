scenario: |
  Generate task harder than expert level!

  2458. Convention Housing Bureau Operations (event housing management company): housing block
  assembly across participating hotels with rate, commission and cutoff standardization, attendee
  reservation portal with hotel selection, rate display and sub-block eligibility, poacher and rogue
  housing company monitoring with attendee warnings, room block pickup reporting to the event
  organizer and hotels with pace analysis, attrition management with block reduction rights exercised
  before penalty deadlines, VIP, staff and exhibitor block segregation with approval workflows,
  rooming list transmission, change management and no-show handling, commission and rebate collection
  post-event with reconciliation to hotel pickup reports

domain_name: convention-housing-bureau-operations
api_prefix: "/housing"

complexity_profile:
  difficulty_level: expert_plus          # §0.4 Expert band, deliberately denser coupling
  primary_archetype: quota_allocation    # finite room-night pool: carved, committed, released, reduced
  secondary_archetype: ledger_reconciliation  # commission/rebate ledger reconciled to hotel pickup reports
  complexity_layers:
    - optimistic_concurrency             # OCC on HotelBlock.version for terms revisions + sub-block carves
    - cascading_side_effects             # reduction-exercise and poacher-confirm cascades (depth 3-4)
    - dual_variant_calculation           # pickup pace (2 projections) + commission basis (2 bases)
    - rate_threshold_triggers            # attrition penalty tiers, pace target ratio, risk-score gate

  entity_topology: graph
  # HotelBlock is a junction of Event x Hotel; SubBlock is self-referential (parent_sub_block_id);
  # PoachingIncident joins RogueHousingVendor x Attendee; Reservation joins SubBlock x Attendee.
  state_machine_shape: parallel
  # Reservation carries two independent axes (reservation_status x transmission_status). HotelBlock is
  # cyclic (TERMS_SUBMITTED <-> CHANGES_REQUESTED), SubBlock / AttritionReduction / RogueHousingVendor
  # are branching, CommissionInvoice is cyclic (PAID -> PARTIALLY_PAID via reversal).
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  # Requesting user id may never equal approving user id on sub-block approval, attrition-reduction
  # approval, or commission-invoice adjustment.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Event
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: convention name
        constraints: "1-160 chars"
      - name: code
        type: string
        source: input
        description: bureau-facing event code
        constraints: "unique across Event; 3-16 chars uppercase"
      - name: event_start_date
        type: string
        source: input
        description: first arrival date of the official housing window (ISO date, YYYY-MM-DD)
      - name: event_end_date
        type: string
        source: input
        description: final departure date of the official housing window (ISO date); must be > event_start_date
      - name: cutoff_date
        type: string
        source: input
        description: standard reservation cutoff date every HotelBlock must match (ISO date)
      - name: attrition_deadline_date
        type: string
        source: input
        description: last date on which block-reduction rights may be requested; requests must arrive strictly before this date at 00:00:00Z (ISO date)
      - name: standard_commission_pct
        type: number
        source: input
        description: bureau standard commission rate; a HotelBlock may not be contracted below it
        constraints: "0 < value <= 0.25"
      - name: standard_rebate_per_room_night_cents
        type: integer
        source: input
        description: bureau standard per-room-night rebate; a HotelBlock may not be contracted below it
        constraints: ">= 0"
      - name: night_count
        type: integer
        source: computed
        description: "(event_end_date - event_start_date) in days; the number of billable nights in the housing window"
      - name: housing_posture
        type: enum
        source: computed
        description: derived gate over child HotelBlocks; see calculations.event_housing_posture
        constraints: "PLANNING | OPEN | RESTRICTED | CLOSED"
      - name: total_contracted_room_nights
        type: integer
        source: computed
        description: sum of HotelBlock.contracted_room_nights over blocks with status IN {CONTRACTED, OPEN, CUTOFF_PASSED, CLOSED}
      - name: total_confirmed_room_nights
        type: integer
        source: computed
        description: sum of Reservation.room_nights over reservations with reservation_status == CONFIRMED in any SubBlock of any block of this Event
      - name: commission_collected_cents
        type: integer
        source: computed
        description: sum of CommissionInvoice.paid_cents over invoices of every HotelBlock of this Event

  - name: Hotel
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: hotel property name
      - name: distance_to_venue_miles
        type: number
        source: input
        description: walking distance to the convention centre; the tie-break-free ranking key of the portal hotel list
        constraints: ">= 0"
      - name: room_tax_pct
        type: number
        source: input
        description: combined occupancy/city tax applied per night on top of the negotiated rate
        constraints: "0 <= value < 1"
      - name: total_rooms
        type: integer
        source: input
        description: physical room inventory of the property
        constraints: ">= 1"
      - name: standing
        type: enum
        source: input
        description: bureau standing of the property; only ACTIVE properties may sign a block contract
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"

  - name: HotelBlock
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the event this block belongs to"
      - name: hotel_id
        type: string
        source: input
        description: "FK -> Hotel.id; the property holding the block"
      - name: status
        type: enum
        source: system
        description: block lifecycle state
        default: DRAFT
        constraints: "DRAFT | TERMS_SUBMITTED | CHANGES_REQUESTED | CONTRACTED | OPEN | CUTOFF_PASSED | CLOSED"
      - name: revision_round
        type: integer
        source: system
        description: number of times terms have been submitted; incremented on every DRAFT->TERMS_SUBMITTED and CHANGES_REQUESTED->TERMS_SUBMITTED transition
        default: 0
      - name: negotiated_nightly_rate_cents
        type: integer
        source: input
        description: pre-tax negotiated room rate per night, quoted to attendees and snapshotted onto each Reservation
        constraints: ">= 1"
      - name: commission_pct
        type: number
        source: input
        description: commission the hotel owes the bureau on pre-tax room revenue
        constraints: "0 < value <= 0.25"
      - name: rebate_per_room_night_cents
        type: integer
        source: input
        description: per-room-night rebate the hotel owes the event organizer
        constraints: ">= 0"
      - name: cutoff_date
        type: string
        source: input
        description: reservation cutoff for this block (ISO date); standardization requires equality with Event.cutoff_date at contract time
      - name: reduction_rights_pct
        type: number
        source: input
        description: fraction of the originally contracted rooms-per-night the bureau may reduce without penalty
        constraints: "0 <= value <= 0.50"
      - name: contracted_rooms_per_night
        type: integer
        source: input
        description: current contracted rooms per night; decreases when an AttritionReduction is exercised
        constraints: ">= 1"
      - name: original_contracted_rooms_per_night
        type: integer
        source: system
        description: snapshot of contracted_rooms_per_night taken on the TERMS_SUBMITTED->CONTRACTED transition; the base of the reduction-rights cap
      - name: unassigned_rooms_per_night
        type: integer
        source: system
        description: rooms per night not yet carved into any SubBlock; initialised to contracted_rooms_per_night on CONTRACTED
        default: 0
      - name: released_rooms_per_night
        type: integer
        source: system
        description: rooms per night permanently released back to the hotel by sub-block release or by the cutoff sweep
        default: 0
      - name: contracted_room_nights
        type: integer
        source: computed
        description: contracted_rooms_per_night * Event.night_count
      - name: attrition_liability_cents
        type: integer
        source: computed
        description: current attrition penalty exposure; see calculations.attrition_penalty_exposure
        default: 0
      - name: confirmation_number
        type: string
        source: input
        description: hotel-side contract confirmation number recorded on the CONTRACTED transition
        default: null

  - name: SubBlock
    parent: HotelBlock
    common_fields: true
    fields:
      - name: hotel_block_id
        type: string
        source: input
        description: "FK -> HotelBlock.id; the block these rooms are carved from"
      - name: parent_sub_block_id
        type: string
        source: input
        description: "FK -> SubBlock.id; set when this sub-block is carved out of another sub-block's allotment (e.g. a VIP carve inside the STAFF sub-block); null for a direct block carve"
        default: null
      - name: segment
        type: enum
        source: input
        description: audience segment this allotment is reserved for
        constraints: "GENERAL | VIP | STAFF | EXHIBITOR"
      - name: allotted_rooms
        type: integer
        source: input
        description: rooms per night allotted to this sub-block
        constraints: ">= 1 on create"
      - name: eligibility_code
        type: string
        source: input
        description: code an Attendee must carry in eligibility_codes to book here; required when segment != GENERAL, must be null when segment == GENERAL
        default: null
      - name: approval_status
        type: enum
        source: system
        description: segregated-block approval state
        default: PENDING_APPROVAL
        constraints: "PENDING_APPROVAL | APPROVED | REJECTED | RELEASED"
      - name: carve_seq
        type: integer
        source: system
        description: monotonic 1-based sequence assigned to every SubBlock at creation (global counter); the deterministic within-segment ordering key of the reduction waterfall, so no two sub-blocks can tie
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the caller that carved this sub-block
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the BureauController that approved it; must differ from requested_by_user_id
        default: null
      - name: committed_rooms
        type: integer
        source: computed
        description: peak-night committed rooms; see calculations.sub_block_night_occupancy
      - name: available_rooms
        type: integer
        source: computed
        description: allotted_rooms - committed_rooms
      - name: released_rooms
        type: integer
        source: system
        description: rooms per night released back to the parent block's released_rooms_per_night
        default: 0
      - name: inventory_status
        type: enum
        source: computed
        description: OPEN when available_rooms > 0, FULL when available_rooms == 0
        constraints: "OPEN | FULL"

  - name: Attendee
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the event this attendee is registered for"
      - name: email
        type: string
        source: input
        description: attendee contact email
        constraints: "unique per event_id"
      - name: full_name
        type: string
        source: input
        description: attendee name transmitted on the rooming list
      - name: registration_id
        type: string
        source: input
        description: registration-system identifier
      - name: attendee_type
        type: enum
        source: input
        description: audience segment the attendee belongs to; must equal SubBlock.segment for non-GENERAL sub-blocks
        constraints: "GENERAL | VIP | STAFF | EXHIBITOR"
      - name: eligibility_codes
        type: array
        source: input
        description: sub-block eligibility codes granted to this attendee
        default: []
      - name: warning_count
        type: integer
        source: system
        description: number of poacher warnings issued to this attendee
        default: 0
      - name: housing_risk_flag
        type: boolean
        source: system
        description: set true when warning_count reaches HOUSING_RISK_WARNING_THRESHOLD; blocks new and modified reservations until a BureauController clears it
        default: false
      - name: no_show_strikes
        type: integer
        source: system
        description: number of no-shows recorded against this attendee
        default: 0

  - name: Reservation
    parent: SubBlock
    common_fields: true
    fields:
      - name: sub_block_id
        type: string
        source: input
        description: "FK -> SubBlock.id; the allotment this room is drawn from"
      - name: attendee_id
        type: string
        source: input
        description: "FK -> Attendee.id; the guest of record"
      - name: check_in_date
        type: string
        source: input
        description: arrival date (ISO date); the stay occupies the half-open night interval [check_in_date, check_out_date)
      - name: check_out_date
        type: string
        source: input
        description: departure date (ISO date); must be > check_in_date
      - name: occupants
        type: integer
        source: input
        description: guests in the room, transmitted on the rooming list
        default: 1
        constraints: "1..4"
      - name: intake_seq
        type: integer
        source: system
        description: monotonic 1-based sequence assigned to every Reservation at creation (global counter); the deterministic ordering key for reduction-cascade waitlisting (highest first) and waitlist promotion (lowest first), so no two reservations can tie
      - name: room_nights
        type: integer
        source: computed
        description: "(check_out_date - check_in_date) in days"
      - name: quoted_nightly_rate_cents
        type: integer
        source: system
        description: snapshot of HotelBlock.negotiated_nightly_rate_cents at creation; later terms changes never re-price an existing reservation
      - name: room_tax_pct_snapshot
        type: number
        source: system
        description: snapshot of Hotel.room_tax_pct at creation
      - name: total_room_charge_cents
        type: integer
        source: computed
        description: tax-inclusive stay total; see calculations.reservation_total_charge
      - name: reservation_status
        type: enum
        source: system
        description: occupancy axis of the reservation
        default: CONFIRMED
        constraints: "CONFIRMED | WAITLISTED | CANCELLED | NO_SHOW"
      - name: transmission_status
        type: enum
        source: system
        description: rooming-list axis of the reservation, independent of reservation_status
        default: NOT_TRANSMITTED
        constraints: "NOT_TRANSMITTED | TRANSMITTED | CHANGE_PENDING"
      - name: eligibility_review_required
        type: boolean
        source: system
        description: set true when the guest's Attendee.housing_risk_flag flips false->true by the poacher-confirmation cascade
        default: false
      - name: no_show_billed_cents
        type: integer
        source: system
        description: tax-inclusive one-night charge billed when the reservation is marked NO_SHOW
        default: 0

  - name: RoomingListTransmission
    parent: HotelBlock
    common_fields: false
    fields:
      - name: hotel_block_id
        type: string
        source: input
        description: "FK -> HotelBlock.id; the block whose rooming list was sent"
      - name: transmission_type
        type: enum
        source: input
        description: INITIAL for the first transmission of a block, CHANGE for a delta batch, FINAL for the post-cutoff list
        constraints: "INITIAL | CHANGE | FINAL"
      - name: batch_seq
        type: integer
        source: system
        description: 1-based sequence number of this transmission within the block, assigned in transmitted_at order
      - name: reservation_count
        type: integer
        source: system
        description: number of reservations included in this batch
      - name: transmitted_at
        type: datetime
        source: system
        description: logical clock value at transmission (ISO 8601 UTC, three fractional digits)
      - name: included_reservation_ids
        type: array
        source: system
        description: ids of the reservations included, ordered by Reservation.created_at ASC

  - name: PickupReport
    parent: HotelBlock
    common_fields: false
    fields:
      - name: hotel_block_id
        type: string
        source: input
        description: "FK -> HotelBlock.id; the block being reported on"
      - name: as_of_date
        type: string
        source: input
        description: cumulative-as-of date of the hotel's pickup snapshot (ISO date); must be strictly greater than the latest existing report's as_of_date for this block
      - name: reported_rooms_picked_up
        type: integer
        source: input
        description: cumulative distinct rooms the hotel shows booked in the block
        constraints: ">= 0"
      - name: reported_room_nights
        type: integer
        source: input
        description: cumulative room nights the hotel shows booked in the block
        constraints: ">= 0"
      - name: reported_gross_revenue_cents
        type: integer
        source: input
        description: cumulative pre-tax room revenue the hotel attributes to the block
        constraints: ">= 0"
      - name: source
        type: enum
        source: input
        description: reporting party
        default: HOTEL
        constraints: "HOTEL"

  - name: AttritionReduction
    parent: HotelBlock
    common_fields: true
    fields:
      - name: hotel_block_id
        type: string
        source: input
        description: "FK -> HotelBlock.id; the block whose contracted rooms shrink"
      - name: requested_reduction_rooms
        type: integer
        source: input
        description: rooms per night to strike from the contract
        constraints: ">= 1"
      - name: effective_date
        type: string
        source: input
        description: contractual effective date of the reduction (ISO date); the ordering key when several reductions are applied
      - name: justification_code
        type: string
        source: input
        description: bureau justification code recorded for the hotel
      - name: status
        type: enum
        source: system
        description: reduction lifecycle
        default: SUBMITTED
        constraints: "SUBMITTED | APPROVED | REJECTED | EXERCISED"
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the BureauCoordinator that filed the request
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the BureauController that approved it; must differ from requested_by_user_id
        default: null
      - name: rooms_absorbed_from_unassigned
        type: integer
        source: system
        description: portion of the reduction absorbed from HotelBlock.unassigned_rooms_per_night by the waterfall
        default: 0
      - name: rooms_absorbed_from_sub_blocks
        type: integer
        source: system
        description: portion of the reduction absorbed from SubBlock allotments by the waterfall
        default: 0
      - name: penalty_avoided_cents
        type: integer
        source: computed
        description: attrition penalty avoided by exercising this reduction; see calculations.attrition_penalty_exposure
        default: null

  - name: RogueHousingVendor
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the event whose attendees are being poached"
      - name: name
        type: string
        source: input
        description: reported name of the rogue housing company
      - name: contact_domain
        type: string
        source: input
        description: email/web domain used to contact attendees
      - name: detection_source
        type: enum
        source: input
        description: how the bureau learned about the vendor
        constraints: "ATTENDEE_REPORT | HOTEL_REPORT | WEB_MONITORING"
      - name: status
        type: enum
        source: system
        description: monitoring state
        default: REPORTED
        constraints: "REPORTED | UNDER_REVIEW | CONFIRMED_POACHER | CLEARED"
      - name: risk_score
        type: integer
        source: computed
        description: 0-100 poaching risk; see calculations.rogue_vendor_risk_score
        default: 0
      - name: verified_incident_count
        type: integer
        source: computed
        description: count of PoachingIncident rows for this vendor with verified == true and status IN {RECORDED, WARNING_ISSUED}
        default: 0
      - name: warning_issued_count
        type: integer
        source: system
        description: number of attendee warnings issued by the confirmation cascade
        default: 0

  - name: PoachingIncident
    parent: RogueHousingVendor
    common_fields: true
    fields:
      - name: rogue_vendor_id
        type: string
        source: input
        description: "FK -> RogueHousingVendor.id; the vendor that made contact"
      - name: attendee_id
        type: string
        source: input
        description: "FK -> Attendee.id; the attendee that was contacted"
      - name: contact_channel
        type: enum
        source: input
        description: channel used to solicit the attendee
        constraints: "EMAIL | PHONE | SMS | WEB"
      - name: occurred_at
        type: datetime
        source: input
        description: when the contact happened (ISO 8601 UTC)
      - name: verified
        type: boolean
        source: input
        description: whether the bureau verified the contact with the attendee
      - name: solicited_payment
        type: boolean
        source: input
        description: whether the vendor asked the attendee for a card or deposit
        default: false
      - name: status
        type: enum
        source: system
        description: incident lifecycle
        default: RECORDED
        constraints: "RECORDED | WARNING_ISSUED | DISMISSED"
      - name: warning_issued_at
        type: datetime
        source: system
        description: logical clock value when the confirmation cascade issued the attendee warning
        default: null
      - name: warning_severity
        type: enum
        source: system
        description: ADVISORY for the attendee's first warning, URGENT from the second onward
        default: null
        constraints: "ADVISORY | URGENT"

  - name: CommissionInvoice
    parent: HotelBlock
    common_fields: true
    fields:
      - name: hotel_block_id
        type: string
        source: input
        description: "FK -> HotelBlock.id; the block being billed"
      - name: basis
        type: enum
        source: input
        description: which computed basis becomes commission_due_cents
        constraints: "BUREAU_CONFIRMED | HOTEL_REPORTED"
      - name: bureau_confirmed_commission_cents
        type: integer
        source: computed
        description: commission from bureau-side reservation data; see calculations.commission_due
      - name: hotel_reported_commission_cents
        type: integer
        source: computed
        description: commission from the latest PickupReport; see calculations.commission_due
        default: null
      - name: commission_due_cents
        type: integer
        source: computed
        description: the basis-selected commission amount
      - name: rebate_due_cents
        type: integer
        source: computed
        description: rebate owed to the organizer on the basis-selected room nights
      - name: billable_room_nights
        type: integer
        source: computed
        description: room nights of the basis-selected side
      - name: variance_cents
        type: integer
        source: computed
        description: bureau_confirmed_commission_cents - hotel_reported_commission_cents (signed; null when no PickupReport exists)
        default: null
      - name: paid_cents
        type: integer
        source: system
        description: cumulative commission cash received from the hotel
        default: 0
      - name: written_off_cents
        type: integer
        source: system
        description: variance written off by a BureauController adjustment
        default: 0
      - name: outstanding_cents
        type: integer
        source: computed
        description: commission_due_cents - paid_cents - written_off_cents
      - name: status
        type: enum
        source: system
        description: collection state
        default: ISSUED
        constraints: "ISSUED | PARTIALLY_PAID | PAID | DISPUTED | ADJUSTED"

state_machines:
  - entity: HotelBlock
    initial_state: DRAFT
    terminal_states: [CLOSED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: TERMS_SUBMITTED
        trigger: "POST /housing/hotel-blocks/{id}/terms"
        actor: BureauCoordinator
        preconditions:
          - "status == DRAFT"
          - "payload expected_hotel_block_version == HotelBlock.version (else ERR_STALE_BLOCK_VERSION)"
          - "revision_round < MAX_NEGOTIATION_ROUNDS (3)"
        side_effects:
          - "negotiated_nightly_rate_cents, commission_pct, rebate_per_room_night_cents, cutoff_date, reduction_rights_pct overwritten from payload"
          - "revision_round += 1"
          - "increments HotelBlock.version by 1"
      - from: CHANGES_REQUESTED
        to: TERMS_SUBMITTED
        trigger: "POST /housing/hotel-blocks/{id}/terms"
        actor: BureauCoordinator
        preconditions:
          - "status == CHANGES_REQUESTED"
          - "payload expected_hotel_block_version == HotelBlock.version (else ERR_STALE_BLOCK_VERSION)"
          - "revision_round < MAX_NEGOTIATION_ROUNDS (3) (else ERR_NEGOTIATION_ROUNDS_EXHAUSTED)"
        side_effects:
          - "negotiated terms overwritten from payload"
          - "revision_round += 1"
          - "increments HotelBlock.version by 1"
        note: "the negotiation cycle TERMS_SUBMITTED -> CHANGES_REQUESTED -> TERMS_SUBMITTED may run at most 3 submissions in total"
      - from: TERMS_SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /housing/hotel-blocks/{id}/request-changes"
        actor: HotelManager
        preconditions:
          - "status == TERMS_SUBMITTED"
          - "HotelBlock.hotel_id == X-User-ID (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "status := CHANGES_REQUESTED"
          - "increments HotelBlock.version by 1"
      - from: TERMS_SUBMITTED
        to: CONTRACTED
        trigger: "POST /housing/hotel-blocks/{id}/contract"
        actor: HotelManager
        preconditions:
          - "status == TERMS_SUBMITTED"
          - "HotelBlock.hotel_id == X-User-ID (else ERR_NOT_RESOURCE_OWNER)"
          - "Hotel.standing == ACTIVE (else ERR_HOTEL_SUSPENDED) — cross-entity gate on Hotel"
          - "commission_pct >= Event.standard_commission_pct AND rebate_per_room_night_cents >= Event.standard_rebate_per_room_night_cents AND cutoff_date == Event.cutoff_date (else ERR_TERMS_NOT_STANDARDIZED)"
        side_effects:
          - "original_contracted_rooms_per_night := contracted_rooms_per_night"
          - "unassigned_rooms_per_night := contracted_rooms_per_night"
          - "confirmation_number := payload confirmation_number"
          - "Event.total_contracted_room_nights recomputed"
          - "Event.housing_posture recomputed (calculations.event_housing_posture)"
          - "increments HotelBlock.version by 1"
      - from: CONTRACTED
        to: OPEN
        trigger: "POST /housing/hotel-blocks/{id}/open"
        actor: BureauCoordinator
        preconditions:
          - "status == CONTRACTED"
          - "at least one SubBlock of this block has approval_status == APPROVED (else ERR_NO_APPROVED_SUB_BLOCK) — cross-entity gate on SubBlock"
          - "logical clock < cutoff_date at 00:00:00Z (else ERR_CUTOFF_PASSED)"
        side_effects:
          - "status := OPEN; the attendee portal now lists this block"
          - "Event.housing_posture recomputed"
          - "increments HotelBlock.version by 1"
      - from: OPEN
        to: CUTOFF_PASSED
        trigger: "POST /housing/hotel-blocks/{id}/cutoff"
        actor: BureauCoordinator
        preconditions:
          - "status == OPEN"
          - "logical clock >= cutoff_date at 00:00:00Z (else ERR_CUTOFF_NOT_REACHED)"
        side_effects:
          - "for each SubBlock with approval_status == APPROVED, ordered by carve_seq ASC: released := allotted_rooms - committed_rooms; SubBlock.released_rooms += released; SubBlock.allotted_rooms := committed_rooms; HotelBlock.released_rooms_per_night += released"
          - "HotelBlock.released_rooms_per_night += unassigned_rooms_per_night; unassigned_rooms_per_night := 0"
          - "every SubBlock whose allotted_rooms became 0 transitions approval_status APPROVED -> RELEASED"
          - "Event.housing_posture recomputed"
          - "increments HotelBlock.version by 1"
        note: "the room-accounting invariant contracted_rooms_per_night == unassigned_rooms_per_night + released_rooms_per_night + SUM(SubBlock.allotted_rooms WHERE approval_status IN {PENDING_APPROVAL, APPROVED, RELEASED}) holds before and after this sweep"
      - from: CUTOFF_PASSED
        to: CLOSED
        trigger: "POST /housing/hotel-blocks/{id}/close"
        actor: BureauCoordinator
        preconditions:
          - "status == CUTOFF_PASSED"
          - "logical clock >= Event.event_end_date at 00:00:00Z (else ERR_EVENT_NOT_ENDED)"
        side_effects:
          - "attrition_liability_cents := calculations.attrition_penalty_exposure (post-reduction variant)"
          - "Event.total_confirmed_room_nights recomputed"
          - "Event.housing_posture recomputed"
          - "increments HotelBlock.version by 1"

  - entity: SubBlock
    initial_state: PENDING_APPROVAL
    terminal_states: [REJECTED, RELEASED]
    shape: branching
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /housing/hotel-blocks/{id}/sub-blocks with segment == GENERAL (auto-approval on create)"
        actor: system
        preconditions:
          - "segment == GENERAL"
          - "eligibility_code is null"
        side_effects:
          - "approval_status := APPROVED immediately in the creating request; approved_by_user_id stays null"
        note: "GENERAL inventory needs no segregated-block approval; the created resource is returned already APPROVED"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /housing/sub-blocks/{id}/approve"
        actor: BureauController
        preconditions:
          - "approval_status == PENDING_APPROVAL"
          - "X-User-ID != SubBlock.requested_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "parent HotelBlock.status IN {CONTRACTED, OPEN}"
        side_effects:
          - "approved_by_user_id := X-User-ID"
          - "increments SubBlock.version by 1"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /housing/sub-blocks/{id}/reject"
        actor: BureauController
        preconditions:
          - "approval_status == PENDING_APPROVAL"
          - "X-User-ID != SubBlock.requested_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "rooms return to inventory: if parent_sub_block_id is null then HotelBlock.unassigned_rooms_per_night += allotted_rooms else SubBlock(parent_sub_block_id).allotted_rooms += allotted_rooms"
          - "allotted_rooms := 0"
          - "increments SubBlock.version by 1 and increments HotelBlock.version by 1"
      - from: APPROVED
        to: APPROVED
        trigger: "POST /housing/sub-blocks/{id}/release with rooms < allotted_rooms"
        actor: BureauCoordinator
        preconditions:
          - "approval_status == APPROVED"
          - "rooms <= allotted_rooms - committed_rooms (else ERR_SUB_BLOCK_HAS_COMMITTED_ROOMS)"
        side_effects:
          - "allotted_rooms -= rooms; released_rooms += rooms; HotelBlock.released_rooms_per_night += rooms"
          - "increments SubBlock.version by 1 and increments HotelBlock.version by 1"
      - from: APPROVED
        to: RELEASED
        trigger: "POST /housing/sub-blocks/{id}/release with rooms == allotted_rooms"
        actor: BureauCoordinator
        preconditions:
          - "approval_status == APPROVED"
          - "committed_rooms == 0 (else ERR_SUB_BLOCK_HAS_COMMITTED_ROOMS)"
        side_effects:
          - "released_rooms += rooms; allotted_rooms := 0; HotelBlock.released_rooms_per_night += rooms"
          - "approval_status := RELEASED (terminal)"
          - "increments SubBlock.version by 1 and increments HotelBlock.version by 1"

  - entity: Reservation
    dimension: reservation_status
    initial_state: CONFIRMED
    terminal_states: [CANCELLED, NO_SHOW]
    shape: branching_with_promotion_cycle
    transitions:
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /housing/reservations/{id}/cancel"
        actor: Attendee | BureauCoordinator
        preconditions:
          - "reservation_status == CONFIRMED"
          - "parent HotelBlock.status IN {OPEN, CUTOFF_PASSED} (else ERR_RESERVATION_NOT_MODIFIABLE)"
          - "when acting as Attendee: Reservation.attendee_id == X-User-ID (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "reservation_status := CANCELLED"
          - "if transmission_status == TRANSMITTED then transmission_status := CHANGE_PENDING (a retraction must still reach the hotel)"
          - "SubBlock.committed_rooms / available_rooms / inventory_status recomputed"
          - "Event.total_confirmed_room_nights recomputed"
          - "waitlist promotion: among Reservations of the same SubBlock with reservation_status == WAITLISTED whose every night in [check_in_date, check_out_date) now has available capacity, the one with the lowest intake_seq transitions WAITLISTED -> CONFIRMED; at most one promotion per cancel"
          - "increments Reservation.version by 1"
      - from: CONFIRMED
        to: WAITLISTED
        trigger: "system, inside the POST /housing/attrition-reductions/{id}/exercise cascade"
        actor: system
        preconditions:
          - "after the waterfall, SubBlock.committed_rooms > SubBlock.allotted_rooms"
          - "this reservation has the highest intake_seq among the SubBlock's CONFIRMED reservations still overshooting the allotment"
        side_effects:
          - "reservation_status := WAITLISTED"
          - "if transmission_status == TRANSMITTED then transmission_status := CHANGE_PENDING"
          - "SubBlock.committed_rooms recomputed; Event.total_confirmed_room_nights recomputed"
          - "increments Reservation.version by 1"
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "system, inside the POST /housing/reservations/{id}/cancel cascade (promotion)"
        actor: system
        preconditions:
          - "every night of [check_in_date, check_out_date) has available capacity in the SubBlock after the cancel"
          - "lowest intake_seq among promotable WAITLISTED reservations of that SubBlock"
        side_effects:
          - "reservation_status := CONFIRMED"
          - "if transmission_status == TRANSMITTED then transmission_status := CHANGE_PENDING"
          - "SubBlock.committed_rooms recomputed; Event.total_confirmed_room_nights recomputed"
          - "increments Reservation.version by 1"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /housing/reservations/{id}/no-show"
        actor: HotelManager
        preconditions:
          - "reservation_status == CONFIRMED"
          - "parent HotelBlock.status == CUTOFF_PASSED (else ERR_RESERVATION_NOT_MODIFIABLE)"
          - "HotelBlock.hotel_id == X-User-ID (else ERR_NOT_RESOURCE_OWNER)"
          - "logical clock >= check_in_date at 00:00:00Z (else ERR_RESERVATION_NOT_MODIFIABLE)"
        side_effects:
          - "reservation_status := NO_SHOW"
          - "no_show_billed_cents := calculations.no_show_billing"
          - "Attendee.no_show_strikes += 1"
          - "SubBlock.committed_rooms recomputed (NO_SHOW leaves the committed set); no waitlist promotion runs on a no-show"
          - "Event.total_confirmed_room_nights recomputed"
          - "increments Reservation.version by 1"

  - entity: Reservation
    dimension: transmission_status
    initial_state: NOT_TRANSMITTED
    terminal_states: []
    shape: parallel_dimension
    transitions:
      - from: NOT_TRANSMITTED
        to: TRANSMITTED
        trigger: "POST /housing/hotel-blocks/{id}/rooming-lists"
        actor: BureauCoordinator
        preconditions:
          - "this reservation is in the transmission set (calculations.rooming_list_transmission_set)"
        side_effects:
          - "transmission_status := TRANSMITTED"
          - "increments Reservation.version by 1"
      - from: TRANSMITTED
        to: CHANGE_PENDING
        trigger: "PATCH /housing/reservations/{id} | POST /housing/reservations/{id}/cancel | poacher-confirmation cascade"
        actor: Attendee | BureauCoordinator | system
        preconditions:
          - "transmission_status == TRANSMITTED"
        side_effects:
          - "transmission_status := CHANGE_PENDING; the reservation re-enters the next CHANGE batch"
          - "increments Reservation.version by 1"
      - from: CHANGE_PENDING
        to: TRANSMITTED
        trigger: "POST /housing/hotel-blocks/{id}/rooming-lists with transmission_type IN {CHANGE, FINAL}"
        actor: BureauCoordinator
        preconditions:
          - "this reservation is in the transmission set"
        side_effects:
          - "transmission_status := TRANSMITTED"
          - "increments Reservation.version by 1"
        note: "reservation_status and transmission_status evolve independently: a CANCELLED reservation can still be CHANGE_PENDING and then TRANSMITTED"

  - entity: AttritionReduction
    initial_state: SUBMITTED
    terminal_states: [REJECTED, EXERCISED]
    shape: branching
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /housing/attrition-reductions/{id}/approve"
        actor: BureauController
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != AttritionReduction.requested_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "parent HotelBlock.status IN {OPEN, CUTOFF_PASSED}"
        side_effects:
          - "approved_by_user_id := X-User-ID"
          - "increments AttritionReduction.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /housing/attrition-reductions/{id}/reject"
        actor: BureauController
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != AttritionReduction.requested_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status := REJECTED (terminal); the reserved reduction-rights headroom is returned (the row stops counting against calculations.reduction_rights_headroom)"
          - "increments AttritionReduction.version by 1"
      - from: APPROVED
        to: EXERCISED
        trigger: "POST /housing/attrition-reductions/{id}/exercise"
        actor: BureauCoordinator
        preconditions:
          - "status == APPROVED"
          - "parent HotelBlock.status IN {OPEN, CUTOFF_PASSED} (else ERR_INVALID_BLOCK_STATE)"
        side_effects:
          - "LINK 1: HotelBlock.contracted_rooms_per_night -= requested_reduction_rooms; HotelBlock.contracted_room_nights recomputed; increments HotelBlock.version by 1"
          - "LINK 2: because the contract shrank, calculations.sub_block_reduction_waterfall runs: rooms are absorbed first from HotelBlock.unassigned_rooms_per_night (recorded on rooms_absorbed_from_unassigned), then from SubBlocks in segment order GENERAL, EXHIBITOR, STAFF, VIP and within a segment by carve_seq ASC, lowering SubBlock.allotted_rooms (recorded on rooms_absorbed_from_sub_blocks)"
          - "LINK 3: because a SubBlock's allotted_rooms dropped below its committed_rooms, its CONFIRMED reservations transition CONFIRMED -> WAITLISTED in intake_seq DESC order until committed_rooms <= allotted_rooms"
          - "LINK 4: because reservations left the CONFIRMED set, SubBlock.committed_rooms / available_rooms / inventory_status and Event.total_confirmed_room_nights are recomputed, and each affected Reservation with transmission_status == TRANSMITTED becomes CHANGE_PENDING"
          - "AFTER the four links settle: HotelBlock.attrition_liability_cents := calculations.attrition_penalty_exposure and AttritionReduction.penalty_avoided_cents := pre-reduction penalty - post-reduction penalty, both evaluated against the post-cascade CONFIRMED room nights"
          - "increments AttritionReduction.version by 1"

  - entity: RogueHousingVendor
    initial_state: REPORTED
    terminal_states: [CONFIRMED_POACHER, CLEARED]
    shape: branching
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "system, on POST /housing/rogue-vendors/{id}/incidents when the recomputed risk_score >= VENDOR_REVIEW_SCORE_THRESHOLD (60)"
        actor: system
        preconditions:
          - "status == REPORTED"
          - "calculations.rogue_vendor_risk_score >= 60 after this incident is recorded"
        side_effects:
          - "status := UNDER_REVIEW"
          - "increments RogueHousingVendor.version by 1"
      - from: UNDER_REVIEW
        to: CONFIRMED_POACHER
        trigger: "POST /housing/rogue-vendors/{id}/confirm"
        actor: ComplianceOfficer
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_VENDOR_STATE)"
          - "at least one PoachingIncident with verified == true AND status == RECORDED exists"
        side_effects:
          - "LINK 1: every PoachingIncident of this vendor with verified == true AND status == RECORDED transitions RECORDED -> WARNING_ISSUED in (occurred_at ASC, contact_channel ASC) order; warning_issued_at := logical clock; warning_severity := ADVISORY when the target Attendee.warning_count is 0 at that moment, else URGENT; warning_issued_count += 1 per warning"
          - "LINK 2: because a warning was issued, Attendee.warning_count += 1 for each warning, and when warning_count reaches HOUSING_RISK_WARNING_THRESHOLD (2) the Attendee.housing_risk_flag flips false -> true"
          - "LINK 3: because housing_risk_flag flipped false -> true, every Reservation of that Attendee with reservation_status == CONFIRMED gets eligibility_review_required := true, and any such reservation with transmission_status == TRANSMITTED becomes CHANGE_PENDING"
          - "increments RogueHousingVendor.version by 1"
      - from: UNDER_REVIEW
        to: CLEARED
        trigger: "POST /housing/rogue-vendors/{id}/clear"
        actor: ComplianceOfficer
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_VENDOR_STATE)"
        side_effects:
          - "every PoachingIncident of this vendor with status == RECORDED transitions RECORDED -> DISMISSED; no warnings are issued and no Attendee counter changes"
          - "increments RogueHousingVendor.version by 1"

  - entity: PoachingIncident
    initial_state: RECORDED
    terminal_states: [WARNING_ISSUED, DISMISSED]
    shape: branching
    transitions:
      - from: RECORDED
        to: WARNING_ISSUED
        trigger: "system, inside the POST /housing/rogue-vendors/{id}/confirm cascade"
        actor: system
        preconditions:
          - "verified == true"
        side_effects:
          - "warning_issued_at := logical clock; warning_severity := ADVISORY | URGENT per the target attendee's prior warning_count"
          - "increments PoachingIncident.version by 1"
      - from: RECORDED
        to: DISMISSED
        trigger: "system, inside the POST /housing/rogue-vendors/{id}/clear cascade"
        actor: system
        preconditions:
          - "vendor transitions UNDER_REVIEW -> CLEARED"
        side_effects:
          - "no attendee counters change"
          - "increments PoachingIncident.version by 1"

  - entity: CommissionInvoice
    initial_state: ISSUED
    terminal_states: []
    shape: cyclic
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /housing/commission-invoices/{id}/payments with amount_cents < outstanding_cents"
        actor: HotelManager
        preconditions:
          - "status IN {ISSUED, PARTIALLY_PAID} (else ERR_INVOICE_NOT_PAYABLE)"
          - "amount_cents <= outstanding_cents (else ERR_PAYMENT_EXCEEDS_OUTSTANDING)"
        side_effects:
          - "paid_cents += amount_cents; outstanding_cents recomputed; Event.commission_collected_cents recomputed"
          - "increments CommissionInvoice.version by 1"
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /housing/commission-invoices/{id}/payments with amount_cents < outstanding_cents"
        actor: HotelManager
        preconditions:
          - "status == PARTIALLY_PAID"
          - "amount_cents <= outstanding_cents"
        side_effects:
          - "paid_cents += amount_cents; outstanding_cents recomputed; Event.commission_collected_cents recomputed"
          - "increments CommissionInvoice.version by 1"
      - from: ISSUED
        to: PAID
        trigger: "POST /housing/commission-invoices/{id}/payments with amount_cents == outstanding_cents"
        actor: HotelManager
        preconditions:
          - "status IN {ISSUED, PARTIALLY_PAID}"
          - "amount_cents == outstanding_cents"
        side_effects:
          - "paid_cents += amount_cents; outstanding_cents := 0; Event.commission_collected_cents recomputed"
          - "increments CommissionInvoice.version by 1"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /housing/commission-invoices/{id}/payments with amount_cents == outstanding_cents"
        actor: HotelManager
        preconditions:
          - "status == PARTIALLY_PAID"
          - "amount_cents == outstanding_cents"
        side_effects:
          - "paid_cents += amount_cents; outstanding_cents := 0; Event.commission_collected_cents recomputed"
          - "increments CommissionInvoice.version by 1"
      - from: PAID
        to: PARTIALLY_PAID
        trigger: "POST /housing/commission-invoices/{id}/payment-reversals with amount_cents < paid_cents"
        actor: BureauController
        preconditions:
          - "status IN {PARTIALLY_PAID, PAID}"
          - "amount_cents <= paid_cents (else ERR_REVERSAL_EXCEEDS_PAID)"
          - "paid_cents - amount_cents > 0"
        side_effects:
          - "paid_cents -= amount_cents; outstanding_cents recomputed; Event.commission_collected_cents recomputed"
          - "increments CommissionInvoice.version by 1"
        note: "the collection axis is cyclic: a fully PAID invoice returns to PARTIALLY_PAID or ISSUED when cash is reversed"
      - from: PARTIALLY_PAID
        to: ISSUED
        trigger: "POST /housing/commission-invoices/{id}/payment-reversals with amount_cents == paid_cents"
        actor: BureauController
        preconditions:
          - "status IN {PARTIALLY_PAID, PAID}"
          - "amount_cents == paid_cents"
        side_effects:
          - "paid_cents := 0; outstanding_cents := commission_due_cents - written_off_cents; Event.commission_collected_cents recomputed"
          - "increments CommissionInvoice.version by 1"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /housing/commission-invoices/{id}/dispute"
        actor: HotelManager
        preconditions:
          - "status IN {ISSUED, PARTIALLY_PAID} (else ERR_INVOICE_NOT_PAYABLE)"
          - "HotelBlock.hotel_id == X-User-ID (else ERR_NOT_RESOURCE_OWNER)"
          - "abs(variance_cents) > calculations.commission_variance_tolerance (else ERR_VARIANCE_WITHIN_TOLERANCE)"
        side_effects:
          - "status := DISPUTED; disputed_by_user_id is not stored — the dispute is asserted through status only"
          - "increments CommissionInvoice.version by 1"
      - from: PARTIALLY_PAID
        to: DISPUTED
        trigger: "POST /housing/commission-invoices/{id}/dispute"
        actor: HotelManager
        preconditions:
          - "status == PARTIALLY_PAID"
          - "abs(variance_cents) > calculations.commission_variance_tolerance"
        side_effects:
          - "status := DISPUTED"
          - "increments CommissionInvoice.version by 1"
      - from: DISPUTED
        to: ADJUSTED
        trigger: "POST /housing/commission-invoices/{id}/adjust"
        actor: BureauController
        preconditions:
          - "status == DISPUTED (else ERR_INVOICE_NOT_PAYABLE)"
          - "write_off_cents <= outstanding_cents (else ERR_PAYMENT_EXCEEDS_OUTSTANDING)"
        side_effects:
          - "written_off_cents += write_off_cents; outstanding_cents recomputed"
          - "status := ADJUSTED"
          - "increments CommissionInvoice.version by 1"
      - from: ADJUSTED
        to: PAID
        trigger: "POST /housing/commission-invoices/{id}/payments with amount_cents == outstanding_cents"
        actor: HotelManager
        preconditions:
          - "status == ADJUSTED"
          - "amount_cents == outstanding_cents"
        side_effects:
          - "paid_cents += amount_cents; outstanding_cents := 0; Event.commission_collected_cents recomputed"
          - "increments CommissionInvoice.version by 1"

concurrency_rules:
  - rule_id: block-terms-revision-stale-block
    parent_entity: HotelBlock
    write_endpoint: "POST /housing/hotel-blocks/{id}/terms"
    occ_field: "expected_hotel_block_version"
    description: |
      Submitting negotiated terms against a HotelBlock whose version has advanced since the
      coordinator last read it is rejected. A terms submission legitimately supersedes the
      previously submitted terms (rate, commission, rebate, cutoff and reduction rights are all
      overwritten), so the write cannot be rejected by any state precondition — the block is in
      DRAFT or CHANGES_REQUESTED in both cases. The stale-version check is what stops the
      coordinator from overwriting terms they never saw.
    error_id: ERR_STALE_BLOCK_VERSION
    http_status: 412
  - rule_id: subblock-carve-stale-block
    parent_entity: HotelBlock
    write_endpoint: "POST /housing/hotel-blocks/{id}/sub-blocks"
    occ_field: "expected_hotel_block_version"
    description: |
      Carving a SubBlock out of a HotelBlock whose version has advanced since the caller last read
      its unassigned_rooms_per_night is rejected. Carving is additive and legitimately succeeds from
      the same block state, so no state precondition covers it; the stale-version check is what
      stops a carve computed against an inventory figure the caller never re-read.
    error_id: ERR_STALE_BLOCK_VERSION
    http_status: 412

calculations:
  - name: event_housing_posture
    trigger: "recomputed whenever any HotelBlock of the Event changes status, and whenever a SubBlock allotment or a Reservation changes the Event's available inventory"
    algorithm: aggregation
    formula: |
      blocks = HotelBlock WHERE event_id == Event.id
      open_blocks   = blocks WHERE status == OPEN
      ended_blocks  = blocks WHERE status IN {CUTOFF_PASSED, CLOSED}
      available     = SUM(SubBlock.available_rooms) over SubBlocks of open_blocks
                      WHERE SubBlock.approval_status == APPROVED
      if open_blocks is empty and ended_blocks is empty: PLANNING
      elif open_blocks is not empty and available > 0:    OPEN
      elif open_blocks is not empty and available == 0:    RESTRICTED
      else:                                                CLOSED
    input_set: "HotelBlocks of the event in any status; only APPROVED SubBlocks of OPEN blocks contribute available rooms"
    constants: {}
    precision: "integer room counts"

  - name: reservation_total_charge
    trigger: "on POST /housing/reservations (creation) and on PATCH /housing/reservations/{id} when the dates change"
    algorithm: tiered_pricing
    formula: |
      # ROUNDING ORDER IS PINNED: round the taxed nightly amount to whole cents FIRST,
      # then multiply across nights. Summing the untaxed nights and taxing the sum is WRONG
      # and produces a different total (e.g. 21900 @ 14.75% over 4 nights: 100520 vs 100521).
      per_night_cents        = round_half_up(quoted_nightly_rate_cents * (1 + room_tax_pct_snapshot))
      room_nights            = (check_out_date - check_in_date) in days
      total_room_charge_cents = per_night_cents * room_nights
    input_set: "the reservation's own snapshotted rate and tax; later HotelBlock terms revisions never re-price it"
    constants: {}
    precision: "whole cents, round_half_up, applied per night before multiplication"

  - name: no_show_billing
    trigger: "on POST /housing/reservations/{id}/no-show"
    algorithm: threshold
    formula: |
      per_night_cents      = round_half_up(quoted_nightly_rate_cents * (1 + room_tax_pct_snapshot))
      no_show_billed_cents = per_night_cents * NO_SHOW_BILLED_NIGHTS
    input_set: "the single reservation being marked NO_SHOW"
    constants:
      NO_SHOW_BILLED_NIGHTS: 1
    precision: "whole cents, round_half_up per night"

  - name: sub_block_night_occupancy
    trigger: "on every Reservation create / date change / cancel / waitlist / no-show, and whenever SubBlock.allotted_rooms changes"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN night semantics: a stay occupies nights [check_in_date, check_out_date).
      # A departure on date D and an arrival on date D therefore do NOT collide.
      committed_on(d) = COUNT(Reservation r of this SubBlock
                              WHERE r.reservation_status == CONFIRMED
                                AND r.check_in_date <= d < r.check_out_date)
      SubBlock.committed_rooms = MAX over d in [Event.event_start_date, Event.event_end_date) of committed_on(d)
      SubBlock.available_rooms = allotted_rooms - committed_rooms
      SubBlock.inventory_status = FULL when available_rooms == 0 else OPEN
      # admission test for a candidate stay N:
      admit(N) = for every d in [N.check_in_date, N.check_out_date): committed_on(d) + 1 <= allotted_rooms
    input_set: "only reservation_status == CONFIRMED rows occupy inventory; WAITLISTED, CANCELLED and NO_SHOW rows do not"
    constants: {}
    precision: "integer rooms per night; the peak night defines committed_rooms"

  - name: attendee_stay_overlap_check
    trigger: "on POST /housing/reservations and on PATCH /housing/reservations/{id}"
    algorithm: interval_merge
    formula: |
      # CLOSED, BUFFERED pairwise semantics — deliberately different geometry from
      # sub_block_night_occupancy: each existing stay of the same attendee is inflated by
      # SHOULDER_BUFFER_DAYS on both ends and compared as a CLOSED date interval, so a
      # same-day hotel switch (checkout D / checkin D) and a one-day gap both collide.
      for each existing Reservation E WHERE E.attendee_id == N.attendee_id
                                       AND E.id != N.id
                                       AND E.reservation_status IN {CONFIRMED, WAITLISTED}:
          E_lo = E.check_in_date  - SHOULDER_BUFFER_DAYS
          E_hi = E.check_out_date + SHOULDER_BUFFER_DAYS
          if NOT (N.check_out_date < E_lo OR N.check_in_date > E_hi): reject ERR_ATTENDEE_STAY_OVERLAP
    input_set: "every reservation of the same Attendee across all SubBlocks, blocks and hotels of the event, in status CONFIRMED or WAITLISTED"
    constants:
      SHOULDER_BUFFER_DAYS: 1
    precision: "whole days; both endpoints inclusive after inflation"

  - name: block_pickup_pace
    trigger: "on GET /housing/hotel-blocks/{id}/pickup-pace"
    algorithm: forward_looking
    formula: |
      reports = PickupReport WHERE hotel_block_id == block.id, ordered by as_of_date ASC
                (as_of_date is strictly increasing per block, so the order is total)
      if COUNT(reports) < 2: both projections = latest reported_room_nights, pace_variance = 0
      first  = reports[0]; last = reports[-1]; prev = reports[-2]
      days_remaining_to_cutoff = (block.cutoff_date - last.as_of_date) in days
      # variant A — forward_looking_projection: average pace over the WHOLE observed window
      span_days_all = (last.as_of_date - first.as_of_date) in days
      avg_daily     = (last.reported_room_nights - first.reported_room_nights) / span_days_all
      forward_looking_projection_room_nights =
          round_half_up(last.reported_room_nights + avg_daily * days_remaining_to_cutoff)
      # variant B — chronological_run_rate: pace of the MOST RECENT consecutive report pair only
      span_days_last = (last.as_of_date - prev.as_of_date) in days
      last_rate      = (last.reported_room_nights - prev.reported_room_nights) / span_days_last
      chronological_run_rate_projection_room_nights =
          round_half_up(last.reported_room_nights + last_rate * days_remaining_to_cutoff)
      pace_variance_room_nights = chronological_run_rate_projection_room_nights
                                - forward_looking_projection_room_nights
      pace_target_room_nights = round_half_up(block.contracted_room_nights * PACE_TARGET_RATIO)
      on_pace = forward_looking_projection_room_nights >= pace_target_room_nights
    input_set: "every PickupReport of the block, no status filter (PickupReport is append-only and immutable); at least two reports are required for the projections to diverge"
    constants:
      PACE_TARGET_RATIO: 0.80
    precision: "integer room nights, round_half_up at the very end of each projection"
    variants:
      - name: forward_looking_projection
        when: "always computed; it is the contractual pace figure that decides on_pace"
        difference: "extrapolates the average daily pace measured across the full report history (first..last)"
      - name: chronological_run_rate
        when: "always computed; it is the operational figure the bureau shows the organizer"
        difference: "extrapolates only the most recent consecutive report pair, so acceleration or deceleration late in the window changes the answer"

  - name: reduction_rights_headroom
    trigger: "on POST /housing/attrition-reductions"
    algorithm: aggregation
    formula: |
      cap      = floor(HotelBlock.original_contracted_rooms_per_night * HotelBlock.reduction_rights_pct)
      consumed = SUM(AttritionReduction.requested_reduction_rooms)
                 WHERE hotel_block_id == block.id AND status IN {SUBMITTED, APPROVED, EXERCISED}
      headroom = cap - consumed
      reject ERR_REDUCTION_RIGHTS_EXCEEDED when requested_reduction_rooms > headroom
    input_set: "AttritionReduction rows in status SUBMITTED, APPROVED or EXERCISED; REJECTED rows release their headroom"
    constants: {}
    precision: "integer rooms; the cap floors (never rounds up) the fractional entitlement"

  - name: sub_block_reduction_waterfall
    trigger: "inside the AttritionReduction APPROVED -> EXERCISED cascade (LINK 2)"
    algorithm: waterfall_allocation
    formula: |
      remaining = requested_reduction_rooms
      # bucket 0 — unassigned inventory absorbs first
      take = min(remaining, HotelBlock.unassigned_rooms_per_night)
      HotelBlock.unassigned_rooms_per_night -= take
      AttritionReduction.rooms_absorbed_from_unassigned = take
      remaining -= take
      # buckets 1..n — sub-block allotments, in pinned segment order, then carve_seq ASC
      for sb in SubBlocks of the block WHERE approval_status == APPROVED
                ordered by segment_rank(GENERAL=1, EXHIBITOR=2, STAFF=3, VIP=4) ASC, carve_seq ASC:
          take = min(remaining, sb.allotted_rooms)
          sb.allotted_rooms -= take
          remaining -= take
          if remaining == 0: break
      AttritionReduction.rooms_absorbed_from_sub_blocks = requested_reduction_rooms - rooms_absorbed_from_unassigned
    input_set: "only SubBlocks with approval_status == APPROVED absorb; PENDING_APPROVAL, REJECTED and RELEASED sub-blocks are skipped"
    constants:
      SEGMENT_RANK: { GENERAL: 1, EXHIBITOR: 2, STAFF: 3, VIP: 4 }
    precision: "integer rooms; no rounding remainder is possible"

  - name: attrition_penalty_exposure
    trigger: "at the end of the AttritionReduction APPROVED -> EXERCISED cascade, and on the HotelBlock CUTOFF_PASSED -> CLOSED transition"
    algorithm: threshold
    formula: |
      # EVALUATION ORDER IS PINNED (steps 1..6). The reduction changes the DENOMINATOR
      # (adjusted contract) and, through its own cascade, also the NUMERATOR (confirmed room
      # nights, because over-committed reservations were waitlisted). The cascade must settle
      # fully BEFORE step 2 is read, and the tier in step 5 must be selected from the ratio
      # computed in step 4 — never from a pre-cascade ratio.
      # 1) adjusted contract (exercised reductions already applied to contracted_rooms_per_night
      #    in effective_date ASC, created_at ASC order)
      adjusted_contracted_room_nights = HotelBlock.contracted_rooms_per_night * Event.night_count
      # 2) realised pickup, read AFTER the cascade settles
      actual_room_nights = SUM(Reservation.room_nights WHERE reservation_status == CONFIRMED)
                         + COUNT(Reservation WHERE reservation_status == NO_SHOW) * NO_SHOW_BILLED_NIGHTS
                           over all SubBlocks of the block
      # 3) contractual protection
      protected_room_nights = round_half_up(adjusted_contracted_room_nights * ALLOWED_PICKUP_RATIO)
      # 4) shortfall and its ratio against the ADJUSTED contract
      shortfall_room_nights = max(0, protected_room_nights - actual_room_nights)
      shortfall_ratio       = shortfall_room_nights / adjusted_contracted_room_nights   # 0 when adjusted == 0
      # 5) tier selection from step 4
      penalty_pct = 0.50 if shortfall_ratio <= 0.10
                    else 0.70 if shortfall_ratio <= 0.25
                    else 0.90
      # 6) money
      penalty_cents = round_half_up(shortfall_room_nights
                                    * HotelBlock.negotiated_nightly_rate_cents
                                    * penalty_pct)
    input_set: "Reservations of every SubBlock of the block; CONFIRMED rows contribute their full room_nights, NO_SHOW rows contribute one night each, CANCELLED and WAITLISTED rows contribute nothing"
    constants:
      ALLOWED_PICKUP_RATIO: 0.80
      NO_SHOW_BILLED_NIGHTS: 1
      TIER_1_MAX_RATIO: 0.10
      TIER_1_PCT: 0.50
      TIER_2_MAX_RATIO: 0.25
      TIER_2_PCT: 0.70
      TIER_3_PCT: 0.90
    precision: "whole cents, round_half_up once at step 6; protected_room_nights rounds half up to whole room nights at step 3"
    variants:
      - name: post_reduction
        when: "written to HotelBlock.attrition_liability_cents"
        difference: "uses HotelBlock.contracted_rooms_per_night as it stands after the reduction is applied"
      - name: pre_reduction
        when: "computed only to fill AttritionReduction.penalty_avoided_cents = pre_reduction penalty - post_reduction penalty"
        difference: "adds this reduction's requested_reduction_rooms back into contracted_rooms_per_night while keeping the SAME post-cascade actual_room_nights, so a tier change between the two runs shows up as avoided penalty"

  - name: commission_due
    trigger: "on POST /housing/hotel-blocks/{id}/commission-invoice"
    algorithm: chronological
    formula: |
      # bureau side
      bureau_room_nights = SUM(Reservation.room_nights WHERE reservation_status == CONFIRMED)
                         + COUNT(Reservation WHERE reservation_status == NO_SHOW) * NO_SHOW_BILLED_NIGHTS
      bureau_pre_tax_cents = SUM(Reservation.quoted_nightly_rate_cents * Reservation.room_nights
                                 WHERE reservation_status == CONFIRMED)
                           + SUM(Reservation.quoted_nightly_rate_cents * NO_SHOW_BILLED_NIGHTS
                                 WHERE reservation_status == NO_SHOW)
      bureau_confirmed_commission_cents = round_half_up(bureau_pre_tax_cents * HotelBlock.commission_pct)
      # hotel side — the single latest report (as_of_date is strictly increasing per block)
      latest = PickupReport of the block with MAX(as_of_date); null when the block has no report
      hotel_reported_commission_cents = null if latest is null
                                        else round_half_up(latest.reported_gross_revenue_cents
                                                           * HotelBlock.commission_pct)
      # basis selection
      if basis == BUREAU_CONFIRMED:
          commission_due_cents  = bureau_confirmed_commission_cents
          billable_room_nights  = bureau_room_nights
      else:  # HOTEL_REPORTED — requires latest is not null (ERR_PICKUP_REPORT_REQUIRED)
          commission_due_cents  = hotel_reported_commission_cents
          billable_room_nights  = latest.reported_room_nights
      rebate_due_cents  = HotelBlock.rebate_per_room_night_cents * billable_room_nights
      variance_cents    = null if latest is null
                          else bureau_confirmed_commission_cents - hotel_reported_commission_cents
      outstanding_cents = commission_due_cents - paid_cents - written_off_cents
    input_set: "bureau side: CONFIRMED reservations at full room_nights plus NO_SHOW reservations at one night each, CANCELLED and WAITLISTED excluded; hotel side: only the single PickupReport with the maximum as_of_date"
    constants:
      NO_SHOW_BILLED_NIGHTS: 1
    precision: "whole cents, round_half_up applied once per side (never per reservation)"
    variants:
      - name: bureau_confirmed_basis
        when: "basis == BUREAU_CONFIRMED"
        difference: "commission is billed on the bureau's own reservation ledger, so rooms the hotel failed to attribute to the block are still billed"
      - name: hotel_reported_basis
        when: "basis == HOTEL_REPORTED"
        difference: "commission is billed on the hotel's latest pickup report, so unattributed rooms silently disappear from the bill and surface only as variance_cents"

  - name: commission_variance_tolerance
    trigger: "on POST /housing/commission-invoices/{id}/dispute"
    algorithm: threshold
    formula: |
      tolerance_cents = max(VARIANCE_FLOOR_CENTS,
                            round_half_up(bureau_confirmed_commission_cents * VARIANCE_PCT))
      dispute is admissible only when abs(variance_cents) > tolerance_cents
    input_set: "the invoice's own two computed commission figures"
    constants:
      VARIANCE_FLOOR_CENTS: 5000
      VARIANCE_PCT: 0.01
    precision: "whole cents, round_half_up inside the max()"

  - name: rogue_vendor_risk_score
    trigger: "on POST /housing/rogue-vendors/{id}/incidents (every incident recorded) and on the CLEARED transition"
    algorithm: weighted_scoring
    formula: |
      counted = PoachingIncident of the vendor WHERE verified == true
                                               AND status IN {RECORDED, WARNING_ISSUED}
      verified_incident_count = COUNT(counted)
      distinct_channels       = COUNT(DISTINCT counted.contact_channel)
      payment_bonus           = PAYMENT_SOLICITATION_BONUS if any counted.solicited_payment == true else 0
      risk_score = min(SCORE_CEILING,
                       max(SCORE_FLOOR,
                           BASE_SCORE
                           + PER_VERIFIED_INCIDENT * verified_incident_count
                           + PER_DISTINCT_CHANNEL * distinct_channels
                           + payment_bonus))
      # gate: REPORTED -> UNDER_REVIEW fires the moment risk_score >= VENDOR_REVIEW_SCORE_THRESHOLD
    input_set: "only incidents with verified == true and status in {RECORDED, WARNING_ISSUED}; DISMISSED incidents drop out of the score"
    constants:
      BASE_SCORE: 10
      PER_VERIFIED_INCIDENT: 25
      PER_DISTINCT_CHANNEL: 15
      PAYMENT_SOLICITATION_BONUS: 20
      SCORE_FLOOR: 0
      SCORE_CEILING: 100
      VENDOR_REVIEW_SCORE_THRESHOLD: 60
    precision: "integer score, clamped to [0, 100]"

  - name: rooming_list_transmission_set
    trigger: "on POST /housing/hotel-blocks/{id}/rooming-lists"
    algorithm: projection
    formula: |
      candidates = Reservations of every SubBlock of the block WHERE
          transmission_status IN {NOT_TRANSMITTED, CHANGE_PENDING}
          AND reservation_status IN {CONFIRMED, CANCELLED, NO_SHOW}
          AND NOT (reservation_status IN {CANCELLED, NO_SHOW}
                   AND transmission_status == NOT_TRANSMITTED)   # never sent, nothing to retract
      # WAITLISTED reservations are never transmitted.
      included_reservation_ids = candidates ordered by created_at ASC, then intake_seq ASC
      reservation_count        = COUNT(candidates)
      batch_seq                = COUNT(existing RoomingListTransmission of the block) + 1
      transmitted_at           = logical clock
      reject ERR_NO_TRANSMITTABLE_RESERVATIONS when reservation_count == 0
    input_set: "reservations of all SubBlocks of the block regardless of approval_status of the sub-block; the two status axes jointly decide inclusion"
    constants: {}
    precision: "integer counts; ordering is total because intake_seq is unique"

validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 20
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 25
    category: business_constraint
    check: "request body shape: every required field present, enums within their declared value set, integers non-negative where constrained, check_out_date > check_in_date, occupants in 1..4, limit in 1..100, offset >= 0, eligibility_code non-null exactly when segment != GENERAL"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 30
    category: existence
    check: "path and body resource ids resolve, validated left-to-right (path ids before body ids): Event, Hotel, HotelBlock, SubBlock, Attendee, Reservation, AttritionReduction, RogueHousingVendor, CommissionInvoice"
    error_id: ERR_EVENT_NOT_FOUND | ERR_HOTEL_NOT_FOUND | ERR_HOTEL_BLOCK_NOT_FOUND | ERR_SUB_BLOCK_NOT_FOUND | ERR_ATTENDEE_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_REDUCTION_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 32
    category: business_constraint
    check: "Event.code unique across events"
    error_id: ERR_EVENT_CODE_DUPLICATE
    http_status: 409
    applies_to: "POST /housing/events"
  - priority: 33
    category: business_constraint
    check: "Attendee.email unique within event_id"
    error_id: ERR_ATTENDEE_EMAIL_DUPLICATE
    http_status: 409
    applies_to: "POST /housing/attendees"
  - priority: 34
    category: business_constraint
    check: "(rogue_vendor_id, attendee_id, contact_channel, occurred_at) unique across PoachingIncident"
    error_id: ERR_DUPLICATE_INCIDENT
    http_status: 409
    applies_to: "POST /housing/rogue-vendors/{id}/incidents"
  - priority: 40
    category: business_referential
    check: "ownership: HotelManager may only act on blocks/reservations/invoices whose HotelBlock.hotel_id == X-User-ID; EventOrganizer only on blocks whose event_id == X-User-ID; Attendee only on reservations whose attendee_id == X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /housing/hotel-blocks/{id}/request-changes, POST /housing/hotel-blocks/{id}/contract, POST /housing/hotel-blocks/{id}/pickup-reports, POST /housing/hotel-blocks/{id}/sub-blocks, PATCH /housing/reservations/{id}, POST /housing/reservations/{id}/cancel, POST /housing/reservations/{id}/no-show, POST /housing/commission-invoices/{id}/payments, POST /housing/commission-invoices/{id}/dispute"
  - priority: 45
    category: business_safety
    check: "segregation of duties: the approving/adjusting X-User-ID must differ from the requesting X-User-ID recorded on the resource"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /housing/sub-blocks/{id}/approve, POST /housing/sub-blocks/{id}/reject, POST /housing/attrition-reductions/{id}/approve, POST /housing/attrition-reductions/{id}/reject"
  - priority: 50
    category: state
    check: "target resource is in a state from which the requested transition exists (HotelBlock terms/request-changes/contract/open/cutoff/close; SubBlock approve/reject/release; Reservation cancel/no-show/patch; AttritionReduction approve/reject/exercise; RogueHousingVendor confirm/clear; CommissionInvoice payment/reversal/dispute/adjust)"
    error_id: ERR_INVALID_BLOCK_STATE | ERR_BLOCK_NOT_OPEN | ERR_INVALID_SUB_BLOCK_STATE | ERR_RESERVATION_NOT_MODIFIABLE | ERR_INVALID_REDUCTION_STATE | ERR_INVALID_VENDOR_STATE | ERR_INVOICE_NOT_PAYABLE
    http_status: 409
    applies_to: all
  - priority: 52
    category: state
    check: "cross-entity state gates: Hotel.standing == ACTIVE at contract time; at least one APPROVED SubBlock before a block may open"
    error_id: ERR_HOTEL_SUSPENDED | ERR_NO_APPROVED_SUB_BLOCK
    http_status: 409
    applies_to: "POST /housing/hotel-blocks/{id}/contract, POST /housing/hotel-blocks/{id}/open"
  - priority: 54
    category: state
    check: "OCC: payload expected_hotel_block_version equals the current HotelBlock.version"
    error_id: ERR_STALE_BLOCK_VERSION
    http_status: 412
    applies_to: "POST /housing/hotel-blocks/{id}/terms, POST /housing/hotel-blocks/{id}/sub-blocks"
  - priority: 56
    category: business_temporal
    check: "clock gates on block lifecycle: open requires clock < block.cutoff_date 00:00:00Z; cutoff requires clock >= block.cutoff_date 00:00:00Z; close requires clock >= Event.event_end_date 00:00:00Z; reservation create/patch requires clock < block.cutoff_date 00:00:00Z"
    error_id: ERR_CUTOFF_PASSED | ERR_CUTOFF_NOT_REACHED | ERR_EVENT_NOT_ENDED
    http_status: 409
    applies_to: "POST /housing/hotel-blocks/{id}/open, POST /housing/hotel-blocks/{id}/cutoff, POST /housing/hotel-blocks/{id}/close, POST /housing/reservations, PATCH /housing/reservations/{id}"
  - priority: 58
    category: business_temporal
    check: "block-reduction rights may only be requested strictly before Event.attrition_deadline_date at 00:00:00Z (clock == deadline is already closed)"
    error_id: ERR_REDUCTION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /housing/attrition-reductions"
  - priority: 60
    category: business_safety
    check: "the guest Attendee.housing_risk_flag must be false — a poacher-warned attendee cannot open or change housing until a controller clears the flag"
    error_id: ERR_ATTENDEE_HOUSING_RISK_HOLD
    http_status: 409
    applies_to: "POST /housing/reservations, PATCH /housing/reservations/{id}"
  - priority: 62
    category: business_constraint
    check: "Event.housing_posture != CLOSED when carving new inventory"
    error_id: ERR_EVENT_NOT_ACCEPTING_HOUSING
    http_status: 409
    applies_to: "POST /housing/hotel-blocks/{id}/sub-blocks"
  - priority: 70
    category: business_referential
    check: "sub-block eligibility: when SubBlock.segment != GENERAL, Attendee.attendee_type == SubBlock.segment AND SubBlock.eligibility_code IN Attendee.eligibility_codes; the attendee's event_id must equal the block's event_id"
    error_id: ERR_SUB_BLOCK_ELIGIBILITY_MISMATCH
    http_status: 422
    applies_to: "POST /housing/reservations"
  - priority: 72
    category: business_constraint
    check: "stay window: check_in_date >= Event.event_start_date - 1 day AND check_out_date <= Event.event_end_date + 1 day"
    error_id: ERR_INVALID_STAY_WINDOW
    http_status: 422
    applies_to: "POST /housing/reservations, PATCH /housing/reservations/{id}"
  - priority: 75
    category: business_constraint
    check: "calculations.attendee_stay_overlap_check finds no buffered collision with another CONFIRMED/WAITLISTED stay of the same attendee"
    error_id: ERR_ATTENDEE_STAY_OVERLAP
    http_status: 409
    applies_to: "POST /housing/reservations, PATCH /housing/reservations/{id}"
  - priority: 80
    category: business_fiscal
    check: "calculations.sub_block_night_occupancy admits the stay on every night of [check_in_date, check_out_date)"
    error_id: ERR_SUB_BLOCK_NIGHT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /housing/reservations, PATCH /housing/reservations/{id}"
  - priority: 82
    category: business_fiscal
    check: "carve inventory: allotted_rooms <= HotelBlock.unassigned_rooms_per_night for a direct carve, or <= SubBlock(parent_sub_block_id).available_rooms for a nested carve"
    error_id: ERR_BLOCK_UNASSIGNED_ROOMS_EXCEEDED
    http_status: 409
    applies_to: "POST /housing/hotel-blocks/{id}/sub-blocks"
  - priority: 84
    category: business_fiscal
    check: "requested_reduction_rooms <= calculations.reduction_rights_headroom"
    error_id: ERR_REDUCTION_RIGHTS_EXCEEDED
    http_status: 422
    applies_to: "POST /housing/attrition-reductions"
  - priority: 86
    category: business_fiscal
    check: "release: rooms <= allotted_rooms - committed_rooms"
    error_id: ERR_SUB_BLOCK_HAS_COMMITTED_ROOMS
    http_status: 409
    applies_to: "POST /housing/sub-blocks/{id}/release"
  - priority: 88
    category: business_fiscal
    check: "amount_cents (payment) or write_off_cents (adjustment) <= outstanding_cents"
    error_id: ERR_PAYMENT_EXCEEDS_OUTSTANDING
    http_status: 422
    applies_to: "POST /housing/commission-invoices/{id}/payments, POST /housing/commission-invoices/{id}/adjust"
  - priority: 90
    category: business_fiscal
    check: "reversal amount_cents <= paid_cents"
    error_id: ERR_REVERSAL_EXCEEDS_PAID
    http_status: 422
    applies_to: "POST /housing/commission-invoices/{id}/payment-reversals"
  - priority: 92
    category: business_constraint
    check: "calculations.rooming_list_transmission_set is non-empty"
    error_id: ERR_NO_TRANSMITTABLE_RESERVATIONS
    http_status: 422
    applies_to: "POST /housing/hotel-blocks/{id}/rooming-lists"
  - priority: 94
    category: business_constraint
    check: "transmission_type INITIAL only when the block has no prior transmission; CHANGE only when at least one prior transmission exists; FINAL only when block.status IN {CUTOFF_PASSED, CLOSED}"
    error_id: ERR_INVALID_TRANSMISSION_TYPE
    http_status: 409
    applies_to: "POST /housing/hotel-blocks/{id}/rooming-lists"
  - priority: 96
    category: business_constraint
    check: "standardization at contract time: commission_pct >= Event.standard_commission_pct, rebate_per_room_night_cents >= Event.standard_rebate_per_room_night_cents, cutoff_date == Event.cutoff_date"
    error_id: ERR_TERMS_NOT_STANDARDIZED
    http_status: 422
    applies_to: "POST /housing/hotel-blocks/{id}/contract"
  - priority: 98
    category: business_constraint
    check: "revision_round < MAX_NEGOTIATION_ROUNDS (3) before a terms submission is accepted"
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /housing/hotel-blocks/{id}/terms"
  - priority: 100
    category: business_temporal
    check: "as_of_date strictly greater than the latest existing PickupReport.as_of_date of the block"
    error_id: ERR_PICKUP_REPORT_OUT_OF_ORDER
    http_status: 422
    applies_to: "POST /housing/hotel-blocks/{id}/pickup-reports"
  - priority: 102
    category: business_referential
    check: "basis == HOTEL_REPORTED requires at least one PickupReport on the block"
    error_id: ERR_PICKUP_REPORT_REQUIRED
    http_status: 422
    applies_to: "POST /housing/hotel-blocks/{id}/commission-invoice"
  - priority: 104
    category: business_constraint
    check: "at most one CommissionInvoice per HotelBlock"
    error_id: ERR_INVOICE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /housing/hotel-blocks/{id}/commission-invoice"
  - priority: 106
    category: business_fiscal
    check: "abs(variance_cents) > calculations.commission_variance_tolerance"
    error_id: ERR_VARIANCE_WITHIN_TOLERANCE
    http_status: 422
    applies_to: "POST /housing/commission-invoices/{id}/dispute"

endpoints:
  # ---------- events ----------
  - method: POST
    path: "/housing/events"
    description: "register an event the bureau will house"
    roles: [BureauCoordinator]
    code: 201
    input: [name, code, event_start_date, event_end_date, cutoff_date, attrition_deadline_date, standard_commission_pct, standard_rebate_per_room_night_cents]
    output: Event
    side_effects: ["night_count computed", "housing_posture initialised to PLANNING", "aggregate counters initialised to 0"]
  - method: GET
    path: "/housing/events/{id}"
    description: "read one event including derived posture and aggregate room-night counters"
    roles: [BureauCoordinator, BureauController, EventOrganizer, ComplianceOfficer, HotelManager, Attendee]
    code: 200
    input: []
    output: Event
    side_effects: []

  # ---------- hotels ----------
  - method: POST
    path: "/housing/hotels"
    description: "register a participating hotel property"
    roles: [BureauCoordinator]
    code: 201
    input: [name, distance_to_venue_miles, room_tax_pct, total_rooms, "standing?"]
    output: Hotel
    side_effects: ["standing defaults to ACTIVE"]
  - method: GET
    path: "/housing/hotels/{id}"
    description: "read one hotel"
    roles: [BureauCoordinator, BureauController, EventOrganizer, ComplianceOfficer, HotelManager, Attendee]
    code: 200
    input: []
    output: Hotel
    side_effects: []
  - method: GET
    path: "/housing/hotels"
    description: "list hotels for the attendee portal, ordered by distance_to_venue_miles ASC then name ASC"
    roles: [BureauCoordinator, BureauController, EventOrganizer, HotelManager, Attendee]
    code: 200
    input: ["standing?", "limit?", "offset?"]
    output: Hotel[]
    side_effects: []
  - method: PATCH
    path: "/housing/hotels/{id}/standing"
    description: "suspend or reinstate a property; SUSPENDED properties cannot sign a block contract"
    roles: [BureauCoordinator]
    code: 200
    input: [standing]
    output: Hotel
    side_effects: ["increments Hotel.version by 1"]

  # ---------- hotel blocks ----------
  - method: POST
    path: "/housing/hotel-blocks"
    description: "assemble a draft housing block on a hotel for an event"
    roles: [BureauCoordinator]
    code: 201
    input: [event_id, hotel_id, contracted_rooms_per_night, negotiated_nightly_rate_cents, commission_pct, rebate_per_room_night_cents, cutoff_date, reduction_rights_pct]
    output: HotelBlock
    side_effects: ["status := DRAFT", "revision_round := 0", "contracted_room_nights computed from Event.night_count"]
  - method: GET
    path: "/housing/hotel-blocks/{id}"
    description: "read one housing block with its current inventory accounting"
    roles: [BureauCoordinator, BureauController, EventOrganizer, ComplianceOfficer, HotelManager, Attendee]
    code: 200
    input: []
    output: HotelBlock
    side_effects: []
  - method: GET
    path: "/housing/hotel-blocks"
    description: "list housing blocks, filterable by event, hotel and status"
    roles: [BureauCoordinator, BureauController, EventOrganizer, HotelManager, Attendee]
    code: 200
    input: ["event_id?", "hotel_id?", "status?", "limit?", "offset?"]
    output: HotelBlock[]
    side_effects: []
  - method: POST
    path: "/housing/hotel-blocks/{id}/terms"
    description: "submit or resubmit standardized block terms (rate, commission, rebate, cutoff, reduction rights)"
    roles: [BureauCoordinator]
    code: 200
    input: [negotiated_nightly_rate_cents, commission_pct, rebate_per_room_night_cents, cutoff_date, reduction_rights_pct, expected_hotel_block_version]
    output: HotelBlock
    side_effects: ["status := TERMS_SUBMITTED", "revision_round += 1", "increments HotelBlock.version by 1"]
  - method: POST
    path: "/housing/hotel-blocks/{id}/request-changes"
    description: "hotel bounces the submitted terms back to the bureau"
    roles: [HotelManager]
    code: 200
    input: []
    output: HotelBlock
    side_effects: ["status := CHANGES_REQUESTED", "increments HotelBlock.version by 1"]
  - method: POST
    path: "/housing/hotel-blocks/{id}/contract"
    description: "hotel signs the block; standardization and hotel standing are enforced here"
    roles: [HotelManager]
    code: 200
    input: ["confirmation_number?"]
    output: HotelBlock
    side_effects: ["status := CONTRACTED", "original_contracted_rooms_per_night and unassigned_rooms_per_night initialised", "Event.total_contracted_room_nights and Event.housing_posture recomputed", "increments HotelBlock.version by 1"]
  - method: POST
    path: "/housing/hotel-blocks/{id}/open"
    description: "open the block on the attendee reservation portal"
    roles: [BureauCoordinator]
    code: 200
    input: []
    output: HotelBlock
    side_effects: ["status := OPEN", "Event.housing_posture recomputed", "increments HotelBlock.version by 1"]
  - method: POST
    path: "/housing/hotel-blocks/{id}/cutoff"
    description: "pass the cutoff: release every unsold room back to the hotel"
    roles: [BureauCoordinator]
    code: 200
    input: []
    output: HotelBlock
    side_effects: ["status := CUTOFF_PASSED", "per-sub-block unsold rooms released, sub-blocks emptied to committed_rooms, zero-allotment sub-blocks become RELEASED", "unassigned rooms released", "Event.housing_posture recomputed", "increments HotelBlock.version by 1"]
  - method: POST
    path: "/housing/hotel-blocks/{id}/close"
    description: "close the block post-event and freeze the attrition liability"
    roles: [BureauCoordinator]
    code: 200
    input: []
    output: HotelBlock
    side_effects: ["status := CLOSED", "attrition_liability_cents := calculations.attrition_penalty_exposure (post_reduction)", "Event counters and housing_posture recomputed", "increments HotelBlock.version by 1"]
  - method: GET
    path: "/housing/hotel-blocks/{id}/pickup-pace"
    description: "pace analysis for the organizer and the hotel: both projection variants side by side"
    roles: [BureauCoordinator, BureauController, EventOrganizer, HotelManager]
    code: 200
    input: []
    output: { hotel_block_id: string, report_count: integer, latest_reported_room_nights: integer, days_remaining_to_cutoff: integer, forward_looking_projection_room_nights: integer, chronological_run_rate_projection_room_nights: integer, pace_variance_room_nights: integer, pace_target_room_nights: integer, on_pace: boolean }
    side_effects: []

  # ---------- sub-blocks ----------
  - method: POST
    path: "/housing/hotel-blocks/{id}/sub-blocks"
    description: "carve a segregated sub-block (GENERAL auto-approves; VIP/STAFF/EXHIBITOR need controller approval)"
    roles: [BureauCoordinator, EventOrganizer]
    code: 201
    input: [segment, allotted_rooms, "eligibility_code?", "parent_sub_block_id?", expected_hotel_block_version]
    output: SubBlock
    side_effects: ["carve_seq assigned from the global counter", "requested_by_user_id := X-User-ID", "rooms move out of HotelBlock.unassigned_rooms_per_night (or the parent sub-block's allotment)", "approval_status := APPROVED immediately when segment == GENERAL, else PENDING_APPROVAL", "increments HotelBlock.version by 1"]
  - method: GET
    path: "/housing/sub-blocks/{id}"
    description: "read one sub-block with its committed/available room accounting"
    roles: [BureauCoordinator, BureauController, EventOrganizer, HotelManager, Attendee]
    code: 200
    input: []
    output: SubBlock
    side_effects: []
  - method: GET
    path: "/housing/sub-blocks"
    description: "list sub-blocks; filter by block, parent sub-block, segment or approval status"
    roles: [BureauCoordinator, BureauController, EventOrganizer, HotelManager, Attendee]
    code: 200
    input: ["hotel_block_id?", "parent_sub_block_id?", "segment?", "approval_status?", "limit?", "offset?"]
    output: SubBlock[]
    side_effects: []
  - method: POST
    path: "/housing/sub-blocks/{id}/approve"
    description: "controller approves a segregated sub-block (segregation of duties enforced)"
    roles: [BureauController]
    code: 200
    input: []
    output: SubBlock
    side_effects: ["approval_status := APPROVED", "approved_by_user_id := X-User-ID", "Event.housing_posture recomputed", "increments SubBlock.version by 1"]
  - method: POST
    path: "/housing/sub-blocks/{id}/reject"
    description: "controller rejects a segregated sub-block and returns its rooms to inventory"
    roles: [BureauController]
    code: 200
    input: []
    output: SubBlock
    side_effects: ["approval_status := REJECTED", "allotted rooms returned to HotelBlock.unassigned_rooms_per_night or to the parent sub-block", "allotted_rooms := 0", "increments SubBlock.version and HotelBlock.version by 1"]
  - method: POST
    path: "/housing/sub-blocks/{id}/release"
    description: "release unsold sub-block rooms back to the hotel before cutoff"
    roles: [BureauCoordinator]
    code: 200
    input: [rooms]
    output: SubBlock
    side_effects: ["allotted_rooms -= rooms", "released_rooms += rooms and HotelBlock.released_rooms_per_night += rooms", "approval_status := RELEASED when allotted_rooms reaches 0", "increments SubBlock.version and HotelBlock.version by 1"]

  # ---------- attendees ----------
  - method: POST
    path: "/housing/attendees"
    description: "import a registered attendee into the housing portal"
    roles: [BureauCoordinator]
    code: 201
    input: [event_id, email, full_name, registration_id, attendee_type, "eligibility_codes?"]
    output: Attendee
    side_effects: ["warning_count := 0", "housing_risk_flag := false", "no_show_strikes := 0"]
  - method: GET
    path: "/housing/attendees/{id}"
    description: "read one attendee including poacher-warning counters"
    roles: [BureauCoordinator, BureauController, EventOrganizer, ComplianceOfficer, HotelManager, Attendee]
    code: 200
    input: []
    output: Attendee
    side_effects: []
  - method: GET
    path: "/housing/attendees"
    description: "list attendees of an event, optionally only the poacher-warned ones"
    roles: [BureauCoordinator, BureauController, EventOrganizer, ComplianceOfficer]
    code: 200
    input: ["event_id?", "housing_risk_flag?", "limit?", "offset?"]
    output: Attendee[]
    side_effects: []
  - method: GET
    path: "/housing/attendees/{id}/poaching-incidents"
    description: "every rogue-vendor contact recorded against this attendee"
    roles: [BureauCoordinator, BureauController, ComplianceOfficer, EventOrganizer]
    code: 200
    input: []
    output: PoachingIncident[]
    side_effects: []

  # ---------- reservations ----------
  - method: POST
    path: "/housing/reservations"
    description: "attendee portal booking into a specific sub-block"
    roles: [Attendee, BureauCoordinator]
    code: 201
    input: [sub_block_id, attendee_id, check_in_date, check_out_date, "occupants?"]
    output: Reservation
    side_effects: ["intake_seq assigned from the global counter", "rate and tax snapshotted from HotelBlock/Hotel", "total_room_charge_cents computed", "reservation_status := CONFIRMED, transmission_status := NOT_TRANSMITTED", "SubBlock occupancy and Event.total_confirmed_room_nights recomputed", "Event.housing_posture recomputed"]
  - method: GET
    path: "/housing/reservations/{id}"
    description: "read one reservation with both status axes and the quoted rate"
    roles: [BureauCoordinator, BureauController, EventOrganizer, HotelManager, Attendee]
    code: 200
    input: []
    output: Reservation
    side_effects: []
  - method: GET
    path: "/housing/reservations"
    description: "list reservations; filter by sub-block, attendee or either status axis"
    roles: [BureauCoordinator, BureauController, EventOrganizer, HotelManager, Attendee]
    code: 200
    input: ["sub_block_id?", "attendee_id?", "reservation_status?", "transmission_status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []
  - method: PATCH
    path: "/housing/reservations/{id}"
    description: "change management: move the stay dates or occupant count"
    roles: [Attendee, BureauCoordinator]
    code: 200
    input: ["check_in_date?", "check_out_date?", "occupants?"]
    output: Reservation
    side_effects: ["room_nights and total_room_charge_cents recomputed at the ORIGINAL snapshotted rate", "transmission_status TRANSMITTED -> CHANGE_PENDING", "SubBlock occupancy and Event.total_confirmed_room_nights recomputed", "increments Reservation.version by 1"]
  - method: POST
    path: "/housing/reservations/{id}/cancel"
    description: "cancel a reservation; frees inventory and may promote one waitlisted stay"
    roles: [Attendee, BureauCoordinator]
    code: 200
    input: []
    output: Reservation
    side_effects: ["reservation_status := CANCELLED", "transmission_status TRANSMITTED -> CHANGE_PENDING", "SubBlock occupancy and Event counters recomputed", "at most one WAITLISTED reservation promoted to CONFIRMED (lowest intake_seq)", "increments Reservation.version by 1"]
  - method: POST
    path: "/housing/reservations/{id}/no-show"
    description: "hotel reports a no-show after arrival date"
    roles: [HotelManager]
    code: 200
    input: []
    output: Reservation
    side_effects: ["reservation_status := NO_SHOW", "no_show_billed_cents := calculations.no_show_billing", "Attendee.no_show_strikes += 1", "SubBlock occupancy and Event counters recomputed (no promotion runs)", "increments Reservation.version by 1"]

  # ---------- rooming lists ----------
  - method: POST
    path: "/housing/hotel-blocks/{id}/rooming-lists"
    description: "transmit the rooming list batch for a block"
    roles: [BureauCoordinator]
    code: 201
    input: [transmission_type]
    output: RoomingListTransmission
    side_effects: ["batch_seq assigned", "included_reservation_ids and reservation_count from calculations.rooming_list_transmission_set", "transmitted_at := logical clock", "every included Reservation moves to transmission_status TRANSMITTED"]
  - method: GET
    path: "/housing/hotel-blocks/{id}/rooming-lists"
    description: "transmission history of a block, ordered by batch_seq ASC"
    roles: [BureauCoordinator, BureauController, EventOrganizer, HotelManager]
    code: 200
    input: []
    output: RoomingListTransmission[]
    side_effects: []

  # ---------- pickup reporting ----------
  - method: POST
    path: "/housing/hotel-blocks/{id}/pickup-reports"
    description: "hotel files a cumulative pickup snapshot for the block"
    roles: [HotelManager]
    code: 201
    input: [as_of_date, reported_rooms_picked_up, reported_room_nights, reported_gross_revenue_cents, "source?"]
    output: PickupReport
    side_effects: ["append-only; RogueHousingVendor and block statuses are untouched", "the block's pace analysis and any later HOTEL_REPORTED invoice read the report with the maximum as_of_date"]
  - method: GET
    path: "/housing/hotel-blocks/{id}/pickup-reports"
    description: "pickup report history of a block, ordered by as_of_date ASC"
    roles: [BureauCoordinator, BureauController, EventOrganizer, HotelManager]
    code: 200
    input: []
    output: PickupReport[]
    side_effects: []

  # ---------- attrition ----------
  - method: POST
    path: "/housing/attrition-reductions"
    description: "file a block-reduction request against the contractual reduction rights"
    roles: [BureauCoordinator]
    code: 201
    input: [hotel_block_id, requested_reduction_rooms, effective_date, justification_code]
    output: AttritionReduction
    side_effects: ["status := SUBMITTED", "requested_by_user_id := X-User-ID", "reduction-rights headroom consumed while SUBMITTED"]
  - method: GET
    path: "/housing/attrition-reductions/{id}"
    description: "read one reduction request"
    roles: [BureauCoordinator, BureauController, EventOrganizer, HotelManager]
    code: 200
    input: []
    output: AttritionReduction
    side_effects: []
  - method: GET
    path: "/housing/hotel-blocks/{id}/attrition-reductions"
    description: "reduction requests filed against a block, ordered by effective_date ASC then created_at ASC"
    roles: [BureauCoordinator, BureauController, EventOrganizer, HotelManager]
    code: 200
    input: []
    output: AttritionReduction[]
    side_effects: []
  - method: POST
    path: "/housing/attrition-reductions/{id}/approve"
    description: "controller approves the reduction (segregation of duties enforced)"
    roles: [BureauController]
    code: 200
    input: []
    output: AttritionReduction
    side_effects: ["status := APPROVED", "approved_by_user_id := X-User-ID", "increments AttritionReduction.version by 1"]
  - method: POST
    path: "/housing/attrition-reductions/{id}/reject"
    description: "controller rejects the reduction and returns the rights headroom"
    roles: [BureauController]
    code: 200
    input: []
    output: AttritionReduction
    side_effects: ["status := REJECTED", "headroom released", "increments AttritionReduction.version by 1"]
  - method: POST
    path: "/housing/attrition-reductions/{id}/exercise"
    description: "exercise the reduction against the hotel: shrink the contract and cascade through sub-blocks and reservations"
    roles: [BureauCoordinator]
    code: 200
    input: []
    output: AttritionReduction
    side_effects: ["status := EXERCISED", "HotelBlock.contracted_rooms_per_night reduced", "calculations.sub_block_reduction_waterfall applied", "over-committed reservations waitlisted in intake_seq DESC order", "HotelBlock.attrition_liability_cents and penalty_avoided_cents computed after the cascade settles", "increments AttritionReduction.version and HotelBlock.version by 1"]

  # ---------- poacher monitoring ----------
  - method: POST
    path: "/housing/rogue-vendors"
    description: "record a suspected rogue housing company"
    roles: [ComplianceOfficer]
    code: 201
    input: [event_id, name, contact_domain, detection_source]
    output: RogueHousingVendor
    side_effects: ["status := REPORTED", "risk_score := calculations.rogue_vendor_risk_score with zero incidents (10)"]
  - method: GET
    path: "/housing/rogue-vendors/{id}"
    description: "read one rogue vendor with its risk score"
    roles: [BureauCoordinator, BureauController, EventOrganizer, ComplianceOfficer]
    code: 200
    input: []
    output: RogueHousingVendor
    side_effects: []
  - method: GET
    path: "/housing/rogue-vendors"
    description: "list rogue vendors of an event"
    roles: [BureauCoordinator, BureauController, EventOrganizer, ComplianceOfficer]
    code: 200
    input: ["event_id?", "status?", "limit?", "offset?"]
    output: RogueHousingVendor[]
    side_effects: []
  - method: POST
    path: "/housing/rogue-vendors/{id}/incidents"
    description: "record a poaching contact against an attendee"
    roles: [ComplianceOfficer]
    code: 201
    input: [attendee_id, contact_channel, occurred_at, verified, "solicited_payment?"]
    output: PoachingIncident
    side_effects: ["status := RECORDED", "vendor risk_score and verified_incident_count recomputed", "vendor auto-transitions REPORTED -> UNDER_REVIEW when risk_score >= 60"]
  - method: GET
    path: "/housing/rogue-vendors/{id}/incidents"
    description: "incidents recorded against a vendor, ordered by occurred_at ASC then contact_channel ASC"
    roles: [BureauCoordinator, BureauController, EventOrganizer, ComplianceOfficer]
    code: 200
    input: []
    output: PoachingIncident[]
    side_effects: []
  - method: POST
    path: "/housing/rogue-vendors/{id}/confirm"
    description: "confirm the vendor as a poacher and warn every verified contacted attendee"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RogueHousingVendor
    side_effects: ["status := CONFIRMED_POACHER", "verified RECORDED incidents become WARNING_ISSUED with ADVISORY/URGENT severity", "Attendee.warning_count incremented and housing_risk_flag set at threshold 2", "flagged attendees' CONFIRMED reservations get eligibility_review_required and re-enter the CHANGE batch", "increments RogueHousingVendor.version by 1"]
  - method: POST
    path: "/housing/rogue-vendors/{id}/clear"
    description: "clear the vendor; recorded incidents are dismissed and no warnings are issued"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RogueHousingVendor
    side_effects: ["status := CLEARED", "RECORDED incidents become DISMISSED", "risk_score recomputed over the remaining counted incidents", "increments RogueHousingVendor.version by 1"]

  # ---------- commission and rebate collection ----------
  - method: POST
    path: "/housing/hotel-blocks/{id}/commission-invoice"
    description: "issue the post-event commission and rebate invoice on the chosen basis; both bases are computed and reconciled"
    roles: [BureauCoordinator]
    code: 201
    input: [basis]
    output: CommissionInvoice
    side_effects: ["both commission bases and variance_cents computed (calculations.commission_due)", "status := ISSUED", "outstanding_cents := commission_due_cents"]
  - method: GET
    path: "/housing/commission-invoices/{id}"
    description: "read one commission invoice with both bases and the variance"
    roles: [BureauCoordinator, BureauController, EventOrganizer, HotelManager]
    code: 200
    input: []
    output: CommissionInvoice
    side_effects: []
  - method: GET
    path: "/housing/hotel-blocks/{id}/commission-invoices"
    description: "the invoice(s) issued for a block (at most one)"
    roles: [BureauCoordinator, BureauController, EventOrganizer, HotelManager]
    code: 200
    input: []
    output: CommissionInvoice[]
    side_effects: []
  - method: POST
    path: "/housing/commission-invoices/{id}/payments"
    description: "hotel remits commission cash against the invoice"
    roles: [HotelManager]
    code: 200
    input: [amount_cents, "reference?"]
    output: CommissionInvoice
    side_effects: ["paid_cents += amount_cents", "status advances to PARTIALLY_PAID or PAID", "Event.commission_collected_cents recomputed", "increments CommissionInvoice.version by 1"]
  - method: POST
    path: "/housing/commission-invoices/{id}/payment-reversals"
    description: "reverse previously posted commission cash (compensating action)"
    roles: [BureauController]
    code: 200
    input: [amount_cents, "reference?"]
    output: CommissionInvoice
    side_effects: ["paid_cents -= amount_cents", "status falls back to PARTIALLY_PAID or ISSUED", "Event.commission_collected_cents recomputed", "increments CommissionInvoice.version by 1"]
  - method: POST
    path: "/housing/commission-invoices/{id}/dispute"
    description: "hotel disputes the invoice when the reconciliation variance exceeds tolerance"
    roles: [HotelManager]
    code: 200
    input: []
    output: CommissionInvoice
    side_effects: ["status := DISPUTED", "increments CommissionInvoice.version by 1"]
  - method: POST
    path: "/housing/commission-invoices/{id}/adjust"
    description: "controller writes off part of a disputed invoice"
    roles: [BureauController]
    code: 200
    input: [write_off_cents]
    output: CommissionInvoice
    side_effects: ["written_off_cents += write_off_cents", "outstanding_cents recomputed", "status := ADJUSTED", "increments CommissionInvoice.version by 1"]

  # ---------- test-driving surface ----------
  - method: POST
    path: "/housing/_clock/set_current_utc"
    description: "set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time. Every cutoff, attrition-deadline, arrival and close gate reads this clock."
    roles: [BureauCoordinator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, previous_utc: string }
    side_effects: ["logical clock repositioned; no entity state changes and no sweeps run"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role / X-User-ID missing or role not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role is not listed on the endpoint"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum value, check_out_date <= check_in_date, occupants outside 1..4, limit outside 1..100, negative money/room value, or eligibility_code present for a GENERAL sub-block / absent for a segregated one"
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "event_id does not resolve"
  - id: ERR_HOTEL_NOT_FOUND
    http: 404
    condition: "hotel_id does not resolve"
  - id: ERR_HOTEL_BLOCK_NOT_FOUND
    http: 404
    condition: "hotel block id does not resolve"
  - id: ERR_SUB_BLOCK_NOT_FOUND
    http: 404
    condition: "sub-block id (path, sub_block_id or parent_sub_block_id) does not resolve"
  - id: ERR_ATTENDEE_NOT_FOUND
    http: 404
    condition: "attendee_id does not resolve"
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "reservation id does not resolve"
  - id: ERR_REDUCTION_NOT_FOUND
    http: 404
    condition: "attrition reduction id does not resolve"
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "rogue vendor id does not resolve"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "commission invoice id does not resolve"
  - id: ERR_EVENT_CODE_DUPLICATE
    http: 409
    condition: "Event.code already used by another event"
  - id: ERR_ATTENDEE_EMAIL_DUPLICATE
    http: 409
    condition: "another attendee of the same event already uses this email"
  - id: ERR_DUPLICATE_INCIDENT
    http: 409
    condition: "an incident with the same vendor, attendee, channel and occurred_at already exists"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity-backed role acting on a resource it does not own (hotel, event or attendee mismatch against X-User-ID)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "approver/rejector X-User-ID equals the requester recorded on the sub-block or reduction"
  - id: ERR_INVALID_BLOCK_STATE
    http: 409
    condition: "HotelBlock is not in a state from which the requested block transition exists"
  - id: ERR_BLOCK_NOT_OPEN
    http: 409
    condition: "reservation create attempted while the sub-block's HotelBlock.status != OPEN"
  - id: ERR_INVALID_SUB_BLOCK_STATE
    http: 409
    condition: "sub-block approve/reject/release from a non-permitting approval_status, or reservation create into a sub-block whose approval_status != APPROVED"
  - id: ERR_RESERVATION_NOT_MODIFIABLE
    http: 409
    condition: "reservation cancel/patch/no-show attempted from a terminal reservation_status, from a CLOSED block, or a no-show before the arrival date"
  - id: ERR_INVALID_REDUCTION_STATE
    http: 409
    condition: "reduction approve/reject/exercise from a status that does not permit it"
  - id: ERR_INVALID_VENDOR_STATE
    http: 409
    condition: "vendor confirm/clear attempted while status != UNDER_REVIEW"
  - id: ERR_INVOICE_NOT_PAYABLE
    http: 409
    condition: "payment/reversal/dispute/adjust attempted from an invoice status that does not permit it"
  - id: ERR_HOTEL_SUSPENDED
    http: 409
    condition: "block contract attempted while Hotel.standing == SUSPENDED"
  - id: ERR_NO_APPROVED_SUB_BLOCK
    http: 409
    condition: "block open attempted with no APPROVED sub-block"
  - id: ERR_STALE_BLOCK_VERSION
    http: 412
    condition: "expected_hotel_block_version does not equal the current HotelBlock.version"
  - id: ERR_CUTOFF_PASSED
    http: 409
    condition: "block open or reservation create/patch attempted when the logical clock has reached the block cutoff date"
  - id: ERR_CUTOFF_NOT_REACHED
    http: 409
    condition: "cutoff sweep attempted before the logical clock reaches the block cutoff date"
  - id: ERR_EVENT_NOT_ENDED
    http: 409
    condition: "block close attempted before the logical clock reaches Event.event_end_date"
  - id: ERR_REDUCTION_WINDOW_CLOSED
    http: 409
    condition: "reduction request filed at or after Event.attrition_deadline_date 00:00:00Z"
  - id: ERR_ATTENDEE_HOUSING_RISK_HOLD
    http: 409
    condition: "reservation create/patch for an attendee whose housing_risk_flag is true"
  - id: ERR_EVENT_NOT_ACCEPTING_HOUSING
    http: 409
    condition: "sub-block carve attempted while Event.housing_posture == CLOSED"
  - id: ERR_SUB_BLOCK_ELIGIBILITY_MISMATCH
    http: 422
    condition: "attendee_type != sub-block segment, missing eligibility code, or attendee registered for a different event"
  - id: ERR_INVALID_STAY_WINDOW
    http: 422
    condition: "stay falls outside [event_start_date - 1 day, event_end_date + 1 day]"
  - id: ERR_ATTENDEE_STAY_OVERLAP
    http: 409
    condition: "the stay collides with another CONFIRMED/WAITLISTED stay of the same attendee once inflated by the one-day shoulder buffer"
  - id: ERR_SUB_BLOCK_NIGHT_CAPACITY_EXCEEDED
    http: 409
    condition: "at least one night of the stay would push committed rooms above the sub-block allotment"
  - id: ERR_BLOCK_UNASSIGNED_ROOMS_EXCEEDED
    http: 409
    condition: "carve exceeds the block's unassigned rooms per night, or the parent sub-block's available rooms"
  - id: ERR_REDUCTION_RIGHTS_EXCEEDED
    http: 422
    condition: "requested reduction exceeds the remaining reduction-rights headroom"
  - id: ERR_SUB_BLOCK_HAS_COMMITTED_ROOMS
    http: 409
    condition: "release would drop the allotment below the sub-block's committed rooms"
  - id: ERR_PAYMENT_EXCEEDS_OUTSTANDING
    http: 422
    condition: "payment amount or write-off exceeds the invoice's outstanding balance"
  - id: ERR_REVERSAL_EXCEEDS_PAID
    http: 422
    condition: "reversal amount exceeds the invoice's paid_cents"
  - id: ERR_NO_TRANSMITTABLE_RESERVATIONS
    http: 422
    condition: "rooming-list transmission requested while the transmission set is empty"
  - id: ERR_INVALID_TRANSMISSION_TYPE
    http: 409
    condition: "INITIAL on a block that already transmitted, CHANGE on a block that never transmitted, or FINAL before cutoff"
  - id: ERR_TERMS_NOT_STANDARDIZED
    http: 422
    condition: "commission, rebate or cutoff of the block violates the event's standardization floor at contract time"
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http: 409
    condition: "a fourth terms submission attempted on the same block"
  - id: ERR_PICKUP_REPORT_OUT_OF_ORDER
    http: 422
    condition: "pickup report as_of_date is not strictly after the block's latest report"
  - id: ERR_PICKUP_REPORT_REQUIRED
    http: 422
    condition: "HOTEL_REPORTED invoice basis requested on a block with no pickup report"
  - id: ERR_INVOICE_ALREADY_EXISTS
    http: 409
    condition: "a commission invoice already exists for the block"
  - id: ERR_VARIANCE_WITHIN_TOLERANCE
    http: 422
    condition: "dispute filed while the reconciliation variance is inside the tolerance band"

roles:
  - name: BureauCoordinator
    description: "housing bureau operator: assembles blocks, carves inventory, opens/cuts off/closes blocks, transmits rooming lists, files reductions, issues invoices, and drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /housing/events"
      - "POST /housing/hotels"
      - "PATCH /housing/hotels/{id}/standing"
      - "POST /housing/hotel-blocks"
      - "POST /housing/hotel-blocks/{id}/terms"
      - "POST /housing/hotel-blocks/{id}/open"
      - "POST /housing/hotel-blocks/{id}/cutoff"
      - "POST /housing/hotel-blocks/{id}/close"
      - "POST /housing/sub-blocks/{id}/release"
      - "POST /housing/attendees"
      - "POST /housing/hotel-blocks/{id}/rooming-lists"
      - "POST /housing/attrition-reductions"
      - "POST /housing/attrition-reductions/{id}/exercise"
      - "POST /housing/hotel-blocks/{id}/commission-invoice"
      - "POST /housing/_clock/set_current_utc"
    shared_operations:
      - "POST /housing/hotel-blocks/{id}/sub-blocks (with EventOrganizer)"
      - "POST /housing/reservations, PATCH /housing/reservations/{id}, POST /housing/reservations/{id}/cancel (with Attendee)"
      - "all GET reads"
  - name: BureauController
    description: "second pair of eyes: approves or rejects segregated sub-blocks and attrition reductions, reverses commission cash and adjusts disputed invoices; never the requester"
    identity: "opaque"
    exclusive_operations:
      - "POST /housing/sub-blocks/{id}/approve"
      - "POST /housing/sub-blocks/{id}/reject"
      - "POST /housing/attrition-reductions/{id}/approve"
      - "POST /housing/attrition-reductions/{id}/reject"
      - "POST /housing/commission-invoices/{id}/payment-reversals"
      - "POST /housing/commission-invoices/{id}/adjust"
    shared_operations:
      - "all GET reads"
  - name: HotelManager
    description: "participating hotel: negotiates and signs the block, files pickup reports, reports no-shows, remits commission and disputes the invoice"
    identity: "entity_backed:Hotel"
    exclusive_operations:
      - "POST /housing/hotel-blocks/{id}/request-changes"
      - "POST /housing/hotel-blocks/{id}/contract"
      - "POST /housing/hotel-blocks/{id}/pickup-reports"
      - "POST /housing/reservations/{id}/no-show"
      - "POST /housing/commission-invoices/{id}/payments"
      - "POST /housing/commission-invoices/{id}/dispute"
    shared_operations:
      - "GET reads scoped to blocks, sub-blocks, reservations, transmissions and invoices"
  - name: EventOrganizer
    description: "the client association: requests segregated VIP/staff/exhibitor sub-blocks and consumes pickup and pace reporting"
    identity: "entity_backed:Event"
    exclusive_operations: []
    shared_operations:
      - "POST /housing/hotel-blocks/{id}/sub-blocks (with BureauCoordinator)"
      - "GET /housing/hotel-blocks/{id}/pickup-pace, GET /housing/hotel-blocks/{id}/pickup-reports and other GET reads"
  - name: Attendee
    description: "convention delegate using the housing portal to book, change and cancel a room in an eligible sub-block"
    identity: "entity_backed:Attendee"
    exclusive_operations: []
    shared_operations:
      - "POST /housing/reservations, PATCH /housing/reservations/{id}, POST /housing/reservations/{id}/cancel (with BureauCoordinator)"
      - "GET reads of hotels, blocks, sub-blocks and own reservations"
  - name: ComplianceOfficer
    description: "poacher and rogue-housing monitoring: records vendors and incidents, confirms poachers (issuing attendee warnings) or clears them"
    identity: "opaque"
    exclusive_operations:
      - "POST /housing/rogue-vendors"
      - "POST /housing/rogue-vendors/{id}/incidents"
      - "POST /housing/rogue-vendors/{id}/confirm"
      - "POST /housing/rogue-vendors/{id}/clear"
    shared_operations:
      - "GET reads of events, attendees, vendors and incidents"

