        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers against a non-existent order id fails authentication at priority 1 (400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER) — the existence check at priority 3 never runs, so no 404 leaks."
        test_recipe:
