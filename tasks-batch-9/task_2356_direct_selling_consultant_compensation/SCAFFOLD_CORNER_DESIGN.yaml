  - section: endpoints
    instances:
      - name: plan_patch_updates_only_declared_mutable_fields
        claim_type: Standard CRUD
        grounds: ["endpoints[PATCH /direct-selling/compensation-plans/{plan_id}]", "validations[priority=69]", "entities.CompensationPlan"]
        distinguishing_aspect: "Only the twelve declared mutable knobs move, one version bump covers the whole patch, and an empty body is an error rather than a no-op."
        test_recipe:
          setup:
            - "A single plan PLAN-A created at defaults; §1.5 declares a twelve-field mutable subset for PATCH and no DELETE anywhere in the API."
          setup_api_calls:
          - call: "POST /direct-selling/compensation-plans"
            payload: { plan_code: "PLAN-A", name: "Consultant Plan A" }
            as: PlatformAdmin
            captures: { plan_id: "$.data.id", plan_ver: "$.data.version" }
          trigger:
          - call: "PATCH /direct-selling/compensation-plans/${plan_id}"
            payload: {}
            as: PlatformAdmin
            captures: { e_nomut: "$.data.error_id" }
          - call: "PATCH /direct-selling/compensation-plans/${plan_id}"
            payload: { compression_mode: "STATIC", min_payout_cents: 1, seventy_rule_bp: 8000, appeal_window_days: 30 }
            as: PlatformAdmin
            captures: { u_mode: "$.data.compression_mode", u_min: "$.data.min_payout_cents", u_seventy: "$.data.seventy_rule_bp", u_appeal: "$.data.appeal_window_days", u_ver: "$.data.version", u_point: "$.data.point_value_cents" }
          - call: "GET /direct-selling/compensation-plans"
            payload: { compression_mode: "STATIC" }
            as: PlatformAdmin
            captures: { l_code: "$.data[0].plan_code", l_mode: "$.data[0].compression_mode" }
          assert:
            - "e_nomut == ERR_NO_MUTABLE_FIELDS with HTTP 422 for an empty patch body, and the plan version is unchanged at 1"
            - "u_mode == STATIC, u_min == 1, u_seventy == 8000, u_appeal == 30 and u_ver == 2: one version bump for the whole multi-field patch, not one per field"
            - "u_point == 100: point_value_cents is absent from the mutable subset, so a live plan can never reprice a volume point"
            - "sending point_value_cents in the patch body is rejected with ERR_VALIDATION (undeclared input field) rather than silently ignored"
            - "l_code == PLAN-A and l_mode == STATIC: the list filter reads the updated value immediately"
            - "no endpoint in §1.5 deletes a plan, a product, a jurisdiction, a consultant or a run, so the D of CRUD is deliberately absent from this API"

      - name: fulfillment_action_endpoint_enforces_its_own_sequence_and_a_payment_guard
        claim_type: Action endpoint
        grounds: ["endpoints[POST /direct-selling/product-orders/{order_id}/fulfillment]", "validations[priority=35]", "validations[priority=32]", "state_machines.ProductOrder.transitions"]
        distinguishing_aspect: "The fulfillment action reads across to the payment dimension for SHIP and refuses to skip or repeat a step."
        test_recipe:
          setup:
            - "Mini fixture, period 2026-08 OPEN, consultant A with one UNPAID order of 5 SERUM whose total_due_cents is 12645."
          setup_api_calls:
          - call: "POST /direct-selling/compensation-plans"
            payload: { plan_code: "PLAN-A", name: "Consultant Plan A" }
            as: PlatformAdmin
            captures: { plan_id: "$.data.id", plan_ver: "$.data.version" }
          - call: "POST /direct-selling/tax-jurisdictions"
            payload: { state_code: "TX", tax_rate_bp: 825, facilitator_agreement_active: true }
            as: PlatformAdmin
          - call: "POST /direct-selling/products"
            payload: { sku: "KIT-STD", name: "Starter Kit", wholesale_price_cents: 9900, srp_cents: 14900, volume_points_per_unit: 0, is_starter_kit: true }
            as: PlatformAdmin
            captures: { kit_id: "$.data.id" }
          - call: "POST /direct-selling/products"
            payload: { sku: "SERUM", name: "Renewal Serum", wholesale_price_cents: 2000, srp_cents: 4000, volume_points_per_unit: 20 }
            as: PlatformAdmin
            captures: { serum_id: "$.data.id" }
          - call: "POST /direct-selling/qualification-periods"
            payload: { compensation_plan_id: "${plan_id}", period_code: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
            as: CommissionAnalyst
            captures: { p8_id: "$.data.id", p8_ver: "$.data.version" }
          - call: "POST /direct-selling/enrollment-applications"
            payload: { applicant_email: "ann@ex.test", applicant_full_name: "Ann Root", applicant_state_code: "TX", compensation_plan_id: "${plan_id}", starter_kit_product_id: "${kit_id}", identity_document_reference: "DOC-A" }
            as: PlatformAdmin
            captures: { app_a_id: "$.data.id" }
          - call: "POST /direct-selling/enrollment-applications/${app_a_id}/accept-agreement"
            payload: { agreement_version: "AGR-2026-01" }
            as: Applicant
            as_user_id: "${app_a_id}"
          - call: "POST /direct-selling/enrollment-applications/${app_a_id}/identity-decision"
            payload: { decision: "VERIFY" }
            as: ComplianceOfficer
          - call: "POST /direct-selling/enrollment-applications/${app_a_id}/pay-starter-kit"
            payload: { amount_cents: 11129, payment_reference: "KIT-PAY-A" }
            as: PlatformAdmin
          - call: "POST /direct-selling/enrollment-applications/${app_a_id}/approve"
            payload: {}
            as: ComplianceOfficer
            captures: { cons_a_id: "$.data.id" }
          - call: "POST /direct-selling/product-orders"
            payload: { consultant_id: "${cons_a_id}", order_type: "BUSINESS_SUPPLY", posted_period_code: "2026-08", ship_to_state_code: "TX", lines: [ { product_id: "${serum_id}", quantity: 5 } ] }
            as: PlatformAdmin
            captures: { o1_id: "$.data.id" }
          trigger:
          - call: "POST /direct-selling/product-orders/${o1_id}/fulfillment"
            payload: { event: "SHIP" }
            as: PlatformAdmin
            captures: { e_unpaid_ship: "$.data.error_id" }
          - call: "POST /direct-selling/product-orders/${o1_id}/pay"
            payload: { amount_cents: 12000, payment_reference: "SHORT" }
            as: PlatformAdmin
            captures: { e_amount: "$.data.error_id" }
          - call: "POST /direct-selling/product-orders/${o1_id}/pay"
            payload: { amount_cents: 12645, payment_reference: "PAY-1" }
            as: PlatformAdmin
            captures: { o_pay: "$.data.payment_status", o_ful: "$.data.fulfillment_status" }
          - call: "POST /direct-selling/product-orders/${o1_id}/fulfillment"
            payload: { event: "DELIVER" }
            as: PlatformAdmin
            captures: { e_skip: "$.data.error_id" }
          - call: "POST /direct-selling/product-orders/${o1_id}/fulfillment"
            payload: { event: "SHIP" }
            as: PlatformAdmin
            captures: { f1: "$.data.fulfillment_status", f1_pay: "$.data.payment_status" }
          - call: "POST /direct-selling/product-orders/${o1_id}/fulfillment"
            payload: { event: "SHIP" }
            as: PlatformAdmin
            captures: { e_reship: "$.data.error_id" }
          - call: "POST /direct-selling/product-orders/${o1_id}/fulfillment"
            payload: { event: "DELIVER" }
            as: PlatformAdmin
            captures: { f2: "$.data.fulfillment_status" }
          assert:
            - "e_unpaid_ship == ERR_FULFILLMENT_SEQUENCE_INVALID with HTTP 409: SHIP requires fulfillment_status NEW and payment_status PAID, so the guard reaches across dimensions"
            - "e_amount == ERR_ORDER_AMOUNT_MISMATCH with HTTP 422 for 12000, because the amount must equal total_due_cents exactly (no partial payments, no overpayment)"
            - "o_pay == PAID with o_ful still NEW after a correct payment"
            - "e_skip == ERR_FULFILLMENT_SEQUENCE_INVALID: DELIVER requires SHIPPED, so the NEW-to-DELIVERED shortcut is closed"
            - "f1 == SHIPPED with f1_pay == PAID, then e_reship == ERR_FULFILLMENT_SEQUENCE_INVALID for a repeat SHIP, then f2 == DELIVERED"
            - "the two dimensions never interfere in the other direction: shipping and delivering leave payment_status PAID untouched"

