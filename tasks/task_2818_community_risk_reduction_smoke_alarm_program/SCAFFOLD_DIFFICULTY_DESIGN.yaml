              as: GrantOfficer
            - call: "POST /crr/grants/${g2_id}/activate"
              payload: {}
              as: GrantOfficer
            - call: "POST /crr/device-lots"
              payload: { funding_grant_id: "${g1_id}", sku: "SMK-10Y-A", device_type: "SMOKE_10YR", unit_cost_cents: 1850, received_qty: 10, expiry_date: "2028-06-30" }
              as: GrantOfficer
              captures: { l1s_id: $.data.id }
            - call: "POST /crr/device-lots"
              payload: { funding_grant_id: "${g1_id}", sku: "CO-A", device_type: "CO_ALARM", unit_cost_cents: 2990, received_qty: 5, expiry_date: "2028-06-30" }
              as: GrantOfficer
              captures: { l1c_id: $.data.id }
            - call: "POST /crr/device-lots"
              payload: { funding_grant_id: "${g2_id}", sku: "SMK-10Y-B", device_type: "SMOKE_10YR", unit_cost_cents: 1850, received_qty: 10, expiry_date: "2028-06-30" }
              as: GrantOfficer
              captures: { l2s_id: $.data.id }
            - call: "POST /crr/device-lots"
              payload: { funding_grant_id: "${g2_id}", sku: "CO-B", device_type: "CO_ALARM", unit_cost_cents: 2990, received_qty: 5, expiry_date: "2028-06-30" }
              as: GrantOfficer
              captures: { l2c_id: $.data.id }
            - call: "POST /crr/households"
              payload: { zone_id: "${z_b_id}", address_line: "22 Birch Road", occupant_count: 4, sleeping_areas_count: 3, storeys: 2, children_under5: 1, mobility_impaired_occupants: 1, fuel_burning_appliance: true }
              as: CanvassCoordinator
              captures: { hh_b_id: $.data.id }
            - call: "POST /crr/routes"
              payload: { zone_id: "${z_b_id}", crew_id: "${crew_b_id}", service_date: "2026-08-03", window_start_utc: "2026-08-03T13:00:00Z", window_end_utc: "2026-08-03T21:00:00Z", planned_slots: 4 }
              as: CanvassCoordinator
              captures: { r_b_id: $.data.id }
            - call: "POST /crr/routes/${r_b_id}/publish"
              payload: {}
              as: CanvassCoordinator
            - call: "POST /crr/visits"
              payload: { household_id: "${hh_b_id}", route_id: "${r_b_id}", scheduled_start_utc: "2026-08-03T14:00:00Z", appointment_option: "SCHEDULED_APPOINTMENT" }
              as: CanvassCoordinator
              captures: { v_b_id: $.data.id }
            - call: "POST /crr/visits/${v_b_id}/arrive"
              payload: { occupant_present: true, pre_existing_working_smoke_alarms: 1, pre_existing_working_co_alarms: 0 }
              as: CrrTechnician
              as_user_id: "${crew_b_id}"
            - call: "POST /crr/installations"
              payload: { visit_id: "${v_b_id}", device_type: "SMOKE_10YR", placement_location: "SLEEPING_AREA", storey: 1, device_lot_id: "${l1s_id}" }
              as: CrrTechnician
              as_user_id: "${crew_b_id}"
              captures: { i1_id: $.data.id }
            - call: "POST /crr/installations"
              payload: { visit_id: "${v_b_id}", device_type: "SMOKE_10YR", placement_location: "HALLWAY_OUTSIDE_SLEEPING", storey: 2, device_lot_id: "${l1s_id}" }
              as: CrrTechnician
              as_user_id: "${crew_b_id}"
              captures: { i2_id: $.data.id }
            - call: "POST /crr/installations"
              payload: { visit_id: "${v_b_id}", device_type: "CO_ALARM", placement_location: "LIVING_LEVEL", storey: 1, device_lot_id: "${l1c_id}" }
              as: CrrTechnician
              as_user_id: "${crew_b_id}"
              captures: { i3_id: $.data.id }
            - call: "POST /crr/installations"
              payload: { visit_id: "${v_b_id}", device_type: "SMOKE_10YR", placement_location: "LIVING_LEVEL", storey: 1, device_lot_id: "${l2s_id}" }
              as: CrrTechnician
              as_user_id: "${crew_b_id}"
              captures: { i4_id: $.data.id }
            - call: "POST /crr/installations"
              payload: { visit_id: "${v_b_id}", device_type: "SMOKE_10YR", placement_location: "BASEMENT_STAIR_TOP", storey: 1, device_lot_id: "${l2s_id}" }
              as: CrrTechnician
              as_user_id: "${crew_b_id}"
              captures: { i5_id: $.data.id }
            - call: "POST /crr/installations"
              payload: { visit_id: "${v_b_id}", device_type: "CO_ALARM", placement_location: "BASEMENT_STAIR_TOP", storey: 1, device_lot_id: "${l2c_id}" }
              as: CrrTechnician
              as_user_id: "${crew_b_id}"
              captures: { i6_id: $.data.id }
            - call: "POST /crr/visits/${v_b_id}/education"
              payload: { education_outcome: "DELIVERED", topics_covered: ["ALARM_TESTING", "ESCAPE_PLANNING"], escape_plan_walkthrough: true }
              as: CrrTechnician
              as_user_id: "${crew_b_id}"
            - call: "POST /crr/visits/${v_b_id}/complete"
              payload: { install_outcome: "COMPLETE", occupant_signature_name: "R. Diaz" }
              as: CrrTechnician
              as_user_id: "${crew_b_id}"
            - call: "POST /crr/installations/${i1_id}/verify"
              payload: {}
              as: CrrTechnician
              as_user_id: "${crew_v_id}"
            - call: "POST /crr/installations/${i2_id}/verify"
              payload: {}
              as: CrrTechnician
              as_user_id: "${crew_v_id}"
            - call: "POST /crr/installations/${i3_id}/verify"
              payload: {}
              as: CrrTechnician
              as_user_id: "${crew_v_id}"
            - call: "POST /crr/installations/${i4_id}/verify"
              payload: {}
              as: CrrTechnician
              as_user_id: "${crew_v_id}"
            - call: "POST /crr/installations/${i5_id}/verify"
              payload: {}
              as: CrrTechnician
              as_user_id: "${crew_v_id}"
            - call: "POST /crr/installations/${i6_id}/verify"
              payload: {}
              as: CrrTechnician
              as_user_id: "${crew_v_id}"
          trigger:
            - call: "POST /crr/grant-reports"
              payload: { grant_id: "${g1_id}", period_start_date: "2026-07-01", period_end_date: "2026-08-31" }
              as: GrantOfficer
              as_user_id: "officer-compile-1"
              captures: { rep1_id: $.data.id }
            - call: "POST /crr/grant-reports"
              payload: { grant_id: "${g2_id}", period_start_date: "2026-07-01", period_end_date: "2026-08-31" }
              as: GrantOfficer
              as_user_id: "officer-compile-1"
              captures: { rep2_id: $.data.id }
          assert:
            - "AlarmInstallation.${i1_id}.reserved_cost_cents == 1850"
            - "AlarmInstallation.${i1_id}.reimbursable_cents == 1921"
            - "AlarmInstallation.${i3_id}.reimbursable_cents == 3058"
            - "AlarmInstallation.${i4_id}.reserved_cost_cents == 1850"
            - "AlarmInstallation.${i4_id}.reimbursable_cents == 2266"
            - "AlarmInstallation.${i6_id}.reimbursable_cents == 3264"
            - "GrantReport.${rep1_id}.installation_count == 3"
            - "GrantReport.${rep1_id}.household_count == 1"
            - "GrantReport.${rep1_id}.served_zone_count == 1"
            - "GrantReport.${rep1_id}.reimbursable_total_cents == 6900"
            - "GrantReport.${rep2_id}.installation_count == 3"
            - "GrantReport.${rep2_id}.reimbursable_total_cents == 7796"
            - "GrantReport.${rep1_id}.reimbursable_total_cents != GrantReport.${rep2_id}.reimbursable_total_cents"
            - "AlarmInstallation.${i2_id}.status == VERIFIED"
            - "AlarmInstallation.${i5_id}.status == VERIFIED"

  - rule_id: combinatorial_formula
    instances:
      - name: visit_demand_minutes_nested_max_then_grid_ceiling
        grounds:
          - calculations.visit_demand_minutes
          - entities.HomeSafetyVisit.fields.demand_minutes
          - entities.HomeSafetyVisit.fields.scheduled_end_utc
          - entities.Household.fields.sleeping_areas_count
          - entities.Household.fields.mobility_impaired_occupants
        distinguishing_aspect: |
          Mode (a) nested max/min: vulnerability_minutes is max(accessibility_minutes,
          age_related_minutes) - NOT their sum - and only then is the tier multiplier applied and
          the result ceilinged onto the 5-minute grid. A household with one mobility-impaired
          occupant (accessibility 20) and one child under 5 (age 10) in a TIER_2 zone yields
          raw 60 * 1.10 = 66 -> 70 minutes; summing the two branches would give raw 77 -> 80.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One zone scored 54.52 / TIER_2 so the tier multiplier is exactly 1.10."
            - "One household with 3 sleeping areas (2 above the free first area), 2 storeys (1 extra), one mobility-impaired occupant and one child under 5."
            - "One PUBLISHED route for that zone on 2026-08-03 with a 13:00-21:00Z window and 4 slots."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-B54", name: "Birchwood Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12 }
              as: RiskAnalyst
              captures: { z_b_id: $.data.id, z_b_v0: $.data.version }
            - call: "POST /crr/zones/${z_b_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${z_b_v0}" }
              as: RiskAnalyst
              captures: { asmt_b_id: $.data.id }
            - call: "POST /crr/crews"
              payload: { crew_code: "CREW-B1", member_count: 2, certification_level: "ADVANCED", max_daily_minutes: 480 }
              as: ProgramAdmin
              captures: { crew_b_id: $.data.id }
            - call: "POST /crr/households"
              payload: { zone_id: "${z_b_id}", address_line: "22 Birch Road", occupant_count: 4, sleeping_areas_count: 3, storeys: 2, children_under5: 1, mobility_impaired_occupants: 1 }
              as: CanvassCoordinator
              captures: { hh_b_id: $.data.id }
            - call: "POST /crr/routes"
              payload: { zone_id: "${z_b_id}", crew_id: "${crew_b_id}", service_date: "2026-08-03", window_start_utc: "2026-08-03T13:00:00Z", window_end_utc: "2026-08-03T21:00:00Z", planned_slots: 4 }
              as: CanvassCoordinator
              captures: { r_b_id: $.data.id }
            - call: "POST /crr/routes/${r_b_id}/publish"
              payload: {}
              as: CanvassCoordinator
          trigger:
            - call: "POST /crr/visits"
              payload: { household_id: "${hh_b_id}", route_id: "${r_b_id}", scheduled_start_utc: "2026-08-03T14:00:00Z", appointment_option: "SCHEDULED_APPOINTMENT" }
              as: CanvassCoordinator
              captures: { v_b_id: $.data.id }
          assert:
            - "ZoneAssessment.${asmt_b_id}.risk_score == 54.52"
            - "ZoneAssessment.${asmt_b_id}.risk_tier == TIER_2"
            - "HomeSafetyVisit.${v_b_id}.demand_minutes == 70"
            - "HomeSafetyVisit.${v_b_id}.demand_minutes != 80"
            - "HomeSafetyVisit.${v_b_id}.scheduled_end_utc == 2026-08-03T15:10:00Z"
            - "HomeSafetyVisit.${v_b_id}.visit_status == SCHEDULED"
            - "CanvassRoute.${r_b_id}.booked_slot_count == 1"
            - "CanvassRoute.${r_b_id}.committed_minutes == 70"

      - name: report_total_rounds_each_installation_before_summing
        grounds:
          - calculations.installation_reimbursement
          - calculations.grant_report_totals
          - entities.AlarmInstallation.fields.reimbursable_cents
          - entities.GrantReport.fields.reimbursable_total_cents
        distinguishing_aspect: |
          Mode (b) rounding at a specific step: reimbursable_cents is rounded HALF_UP to whole cents
          per installation and the already-rounded per-installation figures are summed. Two smoke
          alarms at 2195 and one CO alarm at 3495, all at 87.5 pct, give 1921 + 1921 + 3058 = 6900;
          rounding only the sum (0.875 * 7885 = 6899.375) would give 6899.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One TIER_2 zone, one crew, one nonprofit partner."
            - "One ACTIVE grant on UNIT_RATE over 2026-07-01..2026-12-31, authorised 500000 cents, unit rates SMOKE_10YR 2195 and CO_ALARM 3495, reimbursement_pct 87.5, indirect_rate_pct 12.5, match_pct 20.0."
