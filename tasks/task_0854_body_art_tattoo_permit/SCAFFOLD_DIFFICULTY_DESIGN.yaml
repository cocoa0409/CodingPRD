            - call: "POST /body-art/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "PREOPENING", scheduled_start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-05-01T02:00:00Z" }
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { ins_pre_id: $.data.id }
            - call: "POST /body-art/inspections/${ins_pre_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
            - call: "POST /body-art/inspections/${ins_pre_id}/finalize"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
            - call: "POST /body-art/establishments/${est_id}/activate"
              payload: {}
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "GET /body-art/establishments/${est_id}"
              payload: {}
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { oc_before: $.data.open_violation_count, risk_before: $.data.risk_score }
            - call: "POST /body-art/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "ROUTINE", scheduled_start_at: "2026-05-05T00:00:00Z", scheduled_end_at: "2026-05-05T02:00:00Z" }
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { ins1_id: $.data.id }
            - call: "POST /body-art/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "POST /body-art/inspections/${ins1_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
          trigger:
            - call: "POST /body-art/inspections/${ins1_id}/violations"
              payload: { violation_code: "STER_004", severity: "NONCRITICAL", narrative: "Autoclave log gap." }
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { v1_id: $.data.id }
            - call: "GET /body-art/establishments/${est_id}"
              payload: {}
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { oc_after_issue: $.data.open_violation_count, risk_after_issue: $.data.risk_score }
