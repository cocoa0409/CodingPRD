  - rule_id: resource_temporal_overlap
    instances:
      - name: agreement_window_half_open_adjacency
        grounds:
          - validations[priority=8]
          - entities.SponsorAgreement.fields.effective_start_date
          - entities.SponsorAgreement.fields.effective_end_date
          - errors[ERR_AGREEMENT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) on the SponsorAgreement timeline of one
          (sponsor, cycle). A2 starting exactly at A1's end date is ADJACENT and accepted;
          A3 starting one day earlier overlaps and is rejected. Adjacency-is-legal is the
          falsifiable half-open marker.
        test_recipe:
          setup:
            - "A cycle (any posture) and a sponsor with one agreement A1 [2027-01-01, 2027-06-30)."
          setup_api_calls:
            - call: "POST /api/program-cycles"
              payload: { name: "CYC-OVL", target_graduation_year: 2028, total_semifinalist_slots: 5, national_award_slots: 0, national_award_amount_cents: 250000, confirming_floor: 200, application_deadline: "2027-12-15T00:00:00Z", semifinalist_embargo_until: "2027-09-10T00:00:00Z", finalist_embargo_until: "2028-02-10T00:00:00Z", award_embargo_until: "2028-03-01T00:00:00Z", public_embargo_until: "2028-03-01T00:00:00Z", state_populations: [ { state_code: "ZZ", graduating_population: 10000 } ] }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - call: "POST /api/corporate-sponsors"
