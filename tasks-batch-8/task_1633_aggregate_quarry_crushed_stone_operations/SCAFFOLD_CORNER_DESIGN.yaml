      - name: inspection_close_with_open_citations_rejected_then_succeeds
        claim_type: precondition_enforcement
        grounds: [state_machines.MshaInspection, "errors[ERR_OPEN_CITATIONS]"]
        distinguishing_aspect: "Child-gated transition: close fails while any citation is ISSUED, succeeds after abatement (cross-aggregate child gate)."
        test_recipe:
          setup: ["site; OPEN inspection with one ISSUED citation (not overdue: due 2026-09-01)"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
