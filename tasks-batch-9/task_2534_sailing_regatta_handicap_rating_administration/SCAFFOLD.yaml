  # --- DutyAssignment -------------------------------------------------------
  - method: POST
    path: "/regatta-ops/duty-assignments"
    description: "Proposes a race-committee duty over a half-open window [window_start_utc, window_end_utc). A null race_id means the duty covers the whole regatta and counts towards every race of it."
    roles: [RegattaChair]
    code: 201
    input: [regatta_id, "race_id?", member_id, "mark_boat_id?", position, window_start_utc, window_end_utc]
    output: DutyAssignment
    side_effects:
      - "status starts at PROPOSED"
      - "duty_minutes is computed as the whole-minute length of the half-open window"
      - "adds duty_minutes to ClubMember.assigned_duty_minutes, and to MarkBoat.committed_minutes when mark_boat_id is set, because calculations.duty_minutes_ledger counts PROPOSED rows"
      - "increments ClubMember.version by 1"
  - method: POST
    path: "/regatta-ops/duty-assignments/{id}/confirm"
    description: "Confirms a proposed duty, putting the volunteer on station and moving both minute ledgers."
    roles: [RegattaChair]
    code: 200
    input: []
    output: DutyAssignment
    side_effects:
      - "DutyAssignment.status PROPOSED -> CONFIRMED"
      - "both minute ledgers are unchanged: calculations.duty_minutes_ledger already counted the PROPOSED row"
      - "re-derives staffing_ready and staffed_position_codes on every PENDING Race whose coverage window this assignment now fully covers, because only CONFIRMED rows count towards staffing"
      - "increments DutyAssignment.version by 1"
  - method: POST
    path: "/regatta-ops/duty-assignments/{id}/release"
    description: "Releases a confirmed or proposed duty, reversing exactly the ledger amounts the confirmation added."
    roles: [RegattaChair]
    code: 200
    input: [release_reason_code]
    output: DutyAssignment
    side_effects:
      - "DutyAssignment.status -> RELEASED, a terminal state, from either PROPOSED or CONFIRMED"
      - "subtracts duty_minutes from ClubMember.assigned_duty_minutes, leaving the ledger exactly at its pre-create value with no drift"
      - "subtracts duty_minutes from MarkBoat.committed_minutes when mark_boat_id is set"
      - "re-derives staffing_ready and staffed_position_codes on every PENDING Race the window had covered"
      - "increments ClubMember.version by 1"
  - method: GET
    path: "/regatta-ops/duty-assignments/{id}"
    description: "Reads one duty assignment with its window and computed duty_minutes."
    roles: [ClubAdmin, RegattaChair, RaceOfficer, JuryChair]
    code: 200
    input: []
    output: DutyAssignment
    side_effects: []
  - method: GET
    path: "/regatta-ops/duty-assignments"
    description: "Lists duty assignments, filterable by regatta, race, volunteer, mark boat, position or status."
    roles: [ClubAdmin, RegattaChair, RaceOfficer, JuryChair]
    code: 200
    input: ["regatta_id?", "race_id?", "member_id?", "mark_boat_id?", "position?", "status?", "limit?", "offset?"]
    output: DutyAssignment[]
    side_effects: []

  # --- Race -----------------------------------------------------------------
  - method: POST
    path: "/regatta-ops/races"
    description: "Schedules a race with its course and start time. The prestart occupancy window is the closed interval [scheduled_start_utc - 5 minutes, scheduled_start_utc] and no two non-abandoned races of a regatta may share it."
    roles: [RegattaChair, RaceOfficer]
    code: 201
    input: [regatta_id, race_number, course_code, course_distance_nm, scheduled_start_utc]
    output: Race
    side_effects:
      - "start_status starts at PENDING and scoring_status at NOT_SCORED"
      - "start_blocked_reason is set to DIVISION_UNDER_MINIMUM at creation when some division of the regatta with at least one assigned entry is still under max(min_entries, Regatta.fleet_minimum)"
      - "runs calculations.race_staffing_readiness to seed staffing_ready and staffed_position_codes"
  - method: POST
    path: "/regatta-ops/races/{id}/start-sequence"
    description: "Begins the warning-signal sequence, from PENDING or after a general recall. Refuses to run when a division is under the fleet minimum or the race committee is not fully on station."
    roles: [RaceOfficer]
    code: 200
    input: []
    output: Race
    side_effects:
      - "Race.start_status PENDING -> SEQUENCE_STARTED, or GENERAL_RECALLED -> SEQUENCE_STARTED, only once the newest SI revision is in force"
      - "refreshes staffing_ready and staffed_position_codes from calculations.race_staffing_readiness"
      - "leaves general_recall_count and black_flag_active untouched, so a third attempt still runs under black flag"
  - method: POST
    path: "/regatta-ops/races/{id}/recall"
    description: "Signals an individual or a general recall. INDIVIDUAL names the offending entry and leaves the start standing; GENERAL restarts the whole sequence and drives the black-flag threshold."
    roles: [RaceOfficer]
    code: 201
    input: [recall_type, "entry_id?", signal_utc, reason_code]
    output: RecallEvent
    side_effects:
      - "appends an immutable RecallEvent with recorded_by_member_id set from X-User-ID and resulting_start_status set to the race state after the signal"
      - "GENERAL: Race.start_status SEQUENCE_STARTED -> GENERAL_RECALLED, increments general_recall_count, and sets black_flag_active true once the count reaches 2"
      - "INDIVIDUAL under black_flag_active false: race start_status stays SEQUENCE_STARTED and no result is minted"
      - "INDIVIDUAL under black_flag_active true: mints an OCS RaceResult for the named entry, which moves scoring_status NOT_SCORED -> PROVISIONAL and sets results_closed_utc"
      - "sets black_flag_applied on the RecallEvent to the value of Race.black_flag_active at signal time"
  - method: POST
    path: "/regatta-ops/races/{id}/start"
    description: "Records the valid start of the race."
    roles: [RaceOfficer]
    code: 200
    input: [actual_start_utc]
    output: Race
    side_effects:
      - "Race.start_status SEQUENCE_STARTED -> STARTED and actual_start_utc is stored"
  - method: POST
    path: "/regatta-ops/races/{id}/abandon"
    description: "Abandons the race, which is the compensating action for the whole scoring chain: results are voided and every series standing is recomputed without this race."
    roles: [RaceOfficer]
    code: 200
    input: [reason_code]
    output: Race
    side_effects:
      - "Race.start_status -> ABANDONED, abandon_reason_code stored, scoring_status forced to NOT_SCORED and points_pool_total set to 0"
      - "every RaceResult of the race gets voided true, points 0, place null and corrected_seconds null"
      - "calculations.series_standing re-runs for every ACCEPTED entry, so each series_points_gross drops by exactly the points this race had awarded"
      - "refreshes Regatta.final_race_count"
  - method: POST
    path: "/regatta-ops/races/{id}/score"
    description: "Closes scoring for the race: mints DNC results for absent accepted entries, computes corrected times, places and points per division, then rolls the series standings forward."
    roles: [RaceOfficer]
    code: 200
    input: []
    output: Race
    side_effects:
      - "Race.scoring_status PROVISIONAL -> FINAL"
      - "hop 1: mints a DNC RaceResult for every ACCEPTED entry of the regatta with no result for this race"
      - "hop 2: runs calculations.corrected_time then calculations.race_points_and_places per division, writing corrected_seconds, place, points and Race.points_pool_total"
      - "hop 3: runs calculations.series_standing for every ACCEPTED entry, writing series_points_gross, series_points_net, discarded_race_numbers and series_rank"
      - "hop 4: refreshes Regatta.final_race_count and may bubble the Regatta up RACING -> SCORED"
  - method: GET
    path: "/regatta-ops/races/{id}"
    description: "Reads one race with both status dimensions, the recall counters, the black-flag flag and the scoring totals."
    roles: [ClubAdmin, RegattaChair, Measurer, RaceOfficer, JuryChair, Competitor]
    code: 200
    input: []
    output: Race
    side_effects: []
  - method: GET
    path: "/regatta-ops/races"
    description: "Lists races of a regatta, filterable by either status dimension or by course."
    roles: [ClubAdmin, RegattaChair, Measurer, RaceOfficer, JuryChair, Competitor]
    code: 200
    input: ["regatta_id?", "start_status?", "scoring_status?", "course_code?", "limit?", "offset?"]
    output: Race[]
    side_effects: []
  - method: GET
    path: "/regatta-ops/races/{id}/staffing"
    description: "Computed read: runs calculations.race_staffing_readiness and returns the coverage window, the positions actually on station across it and the positions still missing."
    roles: [ClubAdmin, RegattaChair, RaceOfficer]
    code: 200
    input: []
    output: "{ race_id: string, staffing_ready: boolean, staffed_position_codes: string[], missing_position_codes: string[], coverage_window_start_utc: string, coverage_window_end_utc: string }"
    side_effects: []

  # --- RaceResult -----------------------------------------------------------
  - method: POST
    path: "/regatta-ops/race-results"
    description: "Records one finisher or non-finisher of a started race. elapsed_seconds is required for FINISHED and forbidden otherwise."
    roles: [RaceOfficer]
    code: 201
    input: [race_id, entry_id, finish_status, "elapsed_seconds?", "penalty_percent?"]
    output: RaceResult
    side_effects:
      - "runs calculations.corrected_time for a FINISHED result, writing corrected_seconds under the variant selected by Regatta.handicap_basis and the certificate rule_code"
      - "the first result of a race moves Race.scoring_status NOT_SCORED -> PROVISIONAL and stamps results_closed_utc from the logical clock, which opens the protest window"
      - "place, points and Race.points_pool_total stay unwritten until POST /races/{id}/score"
      - "discardable starts true for every finish_status except DSQ"
  - method: GET
    path: "/regatta-ops/race-results/{id}"
    description: "Reads one result with its corrected time, place, points, discardability and void flag."
    roles: [ClubAdmin, RegattaChair, Measurer, RaceOfficer, JuryChair, Competitor]
    code: 200
    input: []
    output: RaceResult
    side_effects: []
  - method: GET
    path: "/regatta-ops/race-results"
    description: "Lists results, filterable by race, entry, finish status or void flag. Reverse-reachability channel for the DNC rows minted by scoring and the OCS rows minted by a black-flag recall."
    roles: [ClubAdmin, RegattaChair, Measurer, RaceOfficer, JuryChair, Competitor]
    code: 200
    input: ["race_id?", "entry_id?", "finish_status?", "voided?", "limit?", "offset?"]
    output: RaceResult[]
    side_effects: []

