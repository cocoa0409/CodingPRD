  - rule_id: priority_pair_validation_conflict
    instances:
      - name: redemption_state_error_beats_safety_error
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_RIDE_NOT_OPEN]
          - errors[ERR_HEIGHT_RESTRICTION]
        distinguishing_aspect: |
          Category pair (state, business_safety): a redemption against a ride whose
          daily_status is CLOSED (post-incident-clear) with a guest height also outside
          the ride's range must return ERR_RIDE_NOT_OPEN, because priority 7 (state)
          outranks priority 8 (business_safety).
