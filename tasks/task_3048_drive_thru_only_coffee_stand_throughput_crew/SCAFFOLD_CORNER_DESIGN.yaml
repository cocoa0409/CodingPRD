  - section: consistency_model
    instances:

      - name: order_create_response_reflects_all_writes_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/orders
        distinguishing_aspect: "Immediate consistency: the POST /orders 201 response already carries computed totals, lane_seq, and all three status dimensions — no follow-up GET is needed to observe the writes of the same request."
        test_recipe:
          setup: ["Stand OPEN with recipe activated."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
            - *k_op
            - *k_taker
            - *k_agr
            - *k_agr_ok
            - *k_agr_act
            - *k_open
            - *k_recipe
            - *k_dist
            - *k_dist_act
            - *k_stand_v
          trigger:
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: ["EXTRA_SHOT"] }], expected_stand_version: "${stand_v}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { total: $.data.total_cents, seq: $.data.lane_seq, q: $.data.queue_status, p: $.data.payment_status, b: $.data.build_status }
          assert:
            - "create response: total_cents == 500 (450 + 50 modifier), lane_seq == 1, queue MERGED / payment UNPAID / build QUEUED — all in the same response body"

