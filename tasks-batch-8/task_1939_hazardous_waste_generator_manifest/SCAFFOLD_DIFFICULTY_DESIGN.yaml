  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: generator_category_exactly_1000kg
        grounds:
          - calculations.generator_category
          - entities.GeneratorSite.fields.current_month_generated_kg
        distinguishing_aspect: |
          Metric = monthly generated kilograms, reached via POST /hazwaste/containers:
          999.9 kg is SQG and exactly 1000.0 kg is LQG (>= inclusive). Distinct
          metric and endpoint from the 45-day manifest boundary.
        test_recipe:
          setup:
            - "Default clock 2026-08-01T00:00:00Z; site with ACTIVE stream and central area; month total 0"
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 21.5, expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_id}", name: "Central A", area_type: "CENTRAL_90DAY" }, as: WasteCoordinator, captures: { area_id: "$.data.id" } }
          trigger:
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_id}", quantity_gallons: 10, quantity_kg: 999.9 }, as: WasteCoordinator }
            - { call: "GET /hazwaste/generator-sites/${site_id}", as: EHSManager }
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_id}", quantity_gallons: 1, quantity_kg: 0.1 }, as: WasteCoordinator }
            - { call: "GET /hazwaste/generator-sites/${site_id}", as: EHSManager }
          assert:
            - "After 999.9 kg: current_month_generated_kg == 999.9 and generator_category == SQG (1000.0 not yet reached)"
            - "After +0.1 kg: current_month_generated_kg == 1000.0 and generator_category == LQG (>= boundary inclusive)"

      - name: manifest_return_exactly_45_days
        grounds:
          - calculations.manifest_return_window
          - entities.Manifest.fields.return_due_at
        distinguishing_aspect: |
          Metric = elapsed days on the manifest return window, reached via
          POST /hazwaste/_clock/set_current_utc: at exactly return_due_at the
          manifest is NOT overdue; one second later it transitions. Distinct
          metric and endpoint from the monthly-kg boundary.
        test_recipe:
          setup:
            - "Default clock 2026-08-01T00:00:00Z; manifest IN_TRANSIT shipped 2026-08-01T00:00:00Z, return_due_at 2026-09-15T00:00:00Z"
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 21.5, expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_id}", name: "Central A", area_type: "CENTRAL_90DAY" }, as: WasteCoordinator, captures: { area_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners", payload: { partner_type: "TRANSPORTER", name: "HaulCo", epa_id_number: "EPA-TR-1", permitted_waste_codes: ["D001"] }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { transp_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners/${transp_id}/status", payload: { to_status: "APPROVED" }, as: ComplianceAuditor, as_user_id: "aud-2" }
            - { call: "POST /hazwaste/waste-partners/${transp_id}/audits", payload: { coverage_from: "2026-01-01T00:00:00Z", coverage_to: "2027-01-01T00:00:00Z", outcome: "PASS" }, as: ComplianceAuditor }
            - { call: "POST /hazwaste/waste-partners", payload: { partner_type: "TSDF", name: "DispCo", epa_id_number: "EPA-TS-1", permitted_waste_codes: ["D001"] }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { tsdf_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners/${tsdf_id}/status", payload: { to_status: "APPROVED" }, as: ComplianceAuditor, as_user_id: "aud-2" }
            - { call: "POST /hazwaste/waste-partners/${tsdf_id}/audits", payload: { coverage_from: "2026-01-01T00:00:00Z", coverage_to: "2027-01-01T00:00:00Z", outcome: "PASS" }, as: ComplianceAuditor }
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_id}", quantity_gallons: 10, quantity_kg: 100.0 }, as: WasteCoordinator, as_user_id: "wc-1", captures: { cont_id: "$.data.id" } }
            - { call: "POST /hazwaste/containers/${cont_id}/label", payload: { label_text: "Hazardous Waste — D001", label_accumulation_start_marked: "2026-08-01T00:00:00Z" }, as: WasteCoordinator, as_user_id: "wc-1" }
            - { call: "POST /hazwaste/containers/${cont_id}/inspections", payload: { result: "PASS" }, as: WasteCoordinator, as_user_id: "wc-2" }
            - { call: "POST /hazwaste/containers/${cont_id}/stage", as: WasteCoordinator, as_user_id: "wc-1" }
            - { call: "POST /hazwaste/manifests", payload: { site_id: "${site_id}", transporter_id: "${transp_id}", tsdf_id: "${tsdf_id}", manifest_tracking_number: "MT-800", line_items: [{ waste_stream_id: "${stream_id}", container_id: "${cont_id}", quantity_kg: 100.0 }] }, as: WasteCoordinator, as_user_id: "wc-1", captures: { man_id: "$.data.id" } }
            - { call: "POST /hazwaste/manifests/${man_id}/ldr-notifications", payload: { treatment_standard_codes: ["TLV-01"], certification_statement: "certified" }, as: EHSManager }
            - { call: "POST /hazwaste/manifests/${man_id}/sign-generator", as: EHSManager, as_user_id: "mgr-9" }
            - { call: "POST /hazwaste/manifests/${man_id}/sign-transporter", as: TransporterAgent, as_user_id: "${transp_id}" }
          trigger:
            - { call: "POST /hazwaste/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: EHSManager }
            - { call: "GET /hazwaste/manifests/${man_id}", as: EHSManager }
            - { call: "POST /hazwaste/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:01Z" }, as: EHSManager }
            - { call: "GET /hazwaste/manifests/${man_id}", as: EHSManager }
          assert:
            - "At exactly 2026-09-15T00:00:00Z: Manifest.${man_id}.status == IN_TRANSIT (strictly-greater rule; not yet overdue)"
            - "At 2026-09-15T00:00:01Z: status == EXCEPTION_REQUIRED and GeneratorSite.${site_id}.open_exception_count == 1"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: manifest_create_requires_containers_staged
        grounds:
          - state_machines.Manifest.DRAFT_to_GENERATOR_SIGNED
          - validations[priority=7]
          - errors[ERR_CONTAINER_NOT_STAGED]
        distinguishing_aspect: |
          Entity pair Container -> Manifest: a manifest line item is rejected
          while its container sits IN_CENTRAL_ACCUMULATION, and accepted once the
          container reaches STAGED_FOR_SHIPMENT. Different pair than
          AccumulationArea -> Container.
        test_recipe:
          setup:
            - "Default clock; site with ACTIVE stream, central area, approved+audited partners; container labeled and inspected but NOT staged"
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 21.5, expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_id}", name: "Central A", area_type: "CENTRAL_90DAY" }, as: WasteCoordinator, captures: { area_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners", payload: { partner_type: "TRANSPORTER", name: "HaulCo", epa_id_number: "EPA-TR-1", permitted_waste_codes: ["D001"] }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { transp_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners/${transp_id}/status", payload: { to_status: "APPROVED" }, as: ComplianceAuditor, as_user_id: "aud-2" }
            - { call: "POST /hazwaste/waste-partners/${transp_id}/audits", payload: { coverage_from: "2026-01-01T00:00:00Z", coverage_to: "2027-01-01T00:00:00Z", outcome: "PASS" }, as: ComplianceAuditor }
            - { call: "POST /hazwaste/waste-partners", payload: { partner_type: "TSDF", name: "DispCo", epa_id_number: "EPA-TS-1", permitted_waste_codes: ["D001"] }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { tsdf_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners/${tsdf_id}/status", payload: { to_status: "APPROVED" }, as: ComplianceAuditor, as_user_id: "aud-2" }
            - { call: "POST /hazwaste/waste-partners/${tsdf_id}/audits", payload: { coverage_from: "2026-01-01T00:00:00Z", coverage_to: "2027-01-01T00:00:00Z", outcome: "PASS" }, as: ComplianceAuditor }
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_id}", quantity_gallons: 10, quantity_kg: 100.0 }, as: WasteCoordinator, as_user_id: "wc-1", captures: { cont_id: "$.data.id" } }
            - { call: "POST /hazwaste/containers/${cont_id}/label", payload: { label_text: "Hazardous Waste — D001", label_accumulation_start_marked: "2026-08-01T00:00:00Z" }, as: WasteCoordinator, as_user_id: "wc-1" }
            - { call: "POST /hazwaste/containers/${cont_id}/inspections", payload: { result: "PASS" }, as: WasteCoordinator, as_user_id: "wc-2" }
          trigger:
            - { call: "POST /hazwaste/manifests", payload: { site_id: "${site_id}", transporter_id: "${transp_id}", tsdf_id: "${tsdf_id}", manifest_tracking_number: "MT-900", line_items: [{ waste_stream_id: "${stream_id}", container_id: "${cont_id}", quantity_kg: 100.0 }] }, as: WasteCoordinator, as_user_id: "wc-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /hazwaste/containers/${cont_id}/stage", as: WasteCoordinator, as_user_id: "wc-1" }
            - { call: "POST /hazwaste/manifests", payload: { site_id: "${site_id}", transporter_id: "${transp_id}", tsdf_id: "${tsdf_id}", manifest_tracking_number: "MT-900", line_items: [{ waste_stream_id: "${stream_id}", container_id: "${cont_id}", quantity_kg: 100.0 }] }, as: WasteCoordinator, as_user_id: "wc-1", captures: { man_id: "$.data.id" } }
          assert:
            - "First create: err == ERR_CONTAINER_NOT_STAGED while container is IN_CENTRAL_ACCUMULATION"
            - "After POST /stage, the identical create succeeds: Manifest.${man_id}.status == DRAFT"

      - name: container_move_requires_central_area_type
        grounds:
          - state_machines.Container.ACCUMULATING_AT_SATELLITE_to_IN_CENTRAL_ACCUMULATION
          - validations[priority=20]
          - errors[ERR_AREA_TYPE_MISMATCH]
        distinguishing_aspect: |
          Entity pair AccumulationArea -> Container: the move transition is
          guarded by the target area's area_type; a SATELLITE target is rejected
          while a CENTRAL_90DAY target starts the accumulation clock. Different
          pair than Container -> Manifest.
        test_recipe:
          setup:
            - "Default clock 2026-08-01T00:00:00Z; site with ACTIVE stream; one SATELLITE area and one CENTRAL_90DAY area"
            - "Container (50 kg) sits ACCUMULATING_AT_SATELLITE in the satellite area"
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 21.5, expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_id}", name: "Booth SAA", area_type: "SATELLITE" }, as: WasteCoordinator, captures: { saa_id: "$.data.id" } }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_id}", name: "Central A", area_type: "CENTRAL_90DAY" }, as: WasteCoordinator, captures: { cen_id: "$.data.id" } }
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${saa_id}", quantity_gallons: 20, quantity_kg: 50.0 }, as: WasteCoordinator, as_user_id: "wc-1", captures: { cont_id: "$.data.id" } }
          trigger:
            - { call: "POST /hazwaste/containers/${cont_id}/move", payload: { target_area_id: "${saa_id}" }, as: WasteCoordinator, as_user_id: "wc-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /hazwaste/containers/${cont_id}/move", payload: { target_area_id: "${cen_id}" }, as: WasteCoordinator, as_user_id: "wc-1" }
          assert:
            - "Move to the SATELLITE area: err == ERR_AREA_TYPE_MISMATCH"
            - "Move to the CENTRAL_90DAY area: status == IN_CENTRAL_ACCUMULATION"
            - "Container.${cont_id}.accumulation_start_date == 2026-08-01T00:00:00Z and deadline_days == 180 (site still VSQG at 50 kg)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: biennial_report_grid_cell_collision
        grounds:
          - validations[priority=23]
          - errors[ERR_REPORT_PERIOD_OVERLAP]
          - entities.BiennialReport.fields.period_start
        distinguishing_aspect: |
          Interval semantics = grid-aligned odd-year cells on GeneratorSite's
          reporting timeline: the same (site, report_year) cell collides, while
          abutting cells (2025 vs 2027) and the same cell on another site do not.
          Different semantics and resource than the audit-window instance.
        test_recipe:
          setup:
            - "Two sites A and B; no reports yet"
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_a: "$.data.id" } }
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site B", epa_id_number: "EPA-SITE-B" }, as: EHSManager, captures: { site_b: "$.data.id" } }
          trigger:
            - { call: "POST /hazwaste/biennial-reports", payload: { site_id: "${site_a}", report_year: 2027 }, as: EHSManager, captures: { rep_a27: "$.data.id" } }
            - { call: "POST /hazwaste/biennial-reports", payload: { site_id: "${site_a}", report_year: 2027 }, as: EHSManager, captures: { dup_err: "$.data.error_id" } }
            - { call: "POST /hazwaste/biennial-reports", payload: { site_id: "${site_a}", report_year: 2025 }, as: EHSManager, captures: { rep_a25: "$.data.id" } }
            - { call: "POST /hazwaste/biennial-reports", payload: { site_id: "${site_b}", report_year: 2027 }, as: EHSManager, captures: { rep_b27: "$.data.id" } }
          assert:
            - "dup_err == ERR_REPORT_PERIOD_OVERLAP (same site, same grid cell)"
            - "BiennialReport.${rep_a27}.period_start == 2027-01-01T00:00:00Z, period_end == 2028-01-01T00:00:00Z, due_at == 2028-03-01T00:00:00Z"
            - "Adjacent cell 2025 on site A succeeds: ${rep_a25} != ${rep_a27}"
            - "Same cell on site B succeeds: ${rep_b27} is a distinct id"

      - name: audit_window_abut_merges_fail_overlap_rejects
        grounds:
          - calculations.audit_currency
          - validations[priority=28]
          - errors[ERR_AUDIT_COVERAGE_OVERLAP]
          - entities.WastePartner.fields.audit_coverage_end
        distinguishing_aspect: |
          Interval semantics = free half-open coverage windows on WastePartner's
          timeline: an exactly abutting PASS window (gap == 0) merges and extends
          coverage_end, while a strict-interior-overlapping FAIL window is
          rejected. Different arithmetic (half-open merge vs grid-cell collision)
          and different resource entity than the report-period instance.
        test_recipe:
          setup:
            - "TSDF partner APPROVED with one PASS audit covering [2026-01-01, 2027-01-01)"
          setup_api_calls:
            - { call: "POST /hazwaste/waste-partners", payload: { partner_type: "TSDF", name: "DispCo", epa_id_number: "EPA-TS-1", permitted_waste_codes: ["D001"] }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { tsdf_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners/${tsdf_id}/status", payload: { to_status: "APPROVED" }, as: ComplianceAuditor, as_user_id: "aud-2" }
            - { call: "POST /hazwaste/waste-partners/${tsdf_id}/audits", payload: { coverage_from: "2026-01-01T00:00:00Z", coverage_to: "2027-01-01T00:00:00Z", outcome: "PASS" }, as: ComplianceAuditor }
          trigger:
            - { call: "POST /hazwaste/waste-partners/${tsdf_id}/audits", payload: { coverage_from: "2027-01-01T00:00:00Z", coverage_to: "2028-01-01T00:00:00Z", outcome: "PASS" }, as: ComplianceAuditor }
            - { call: "GET /hazwaste/waste-partners/${tsdf_id}", as: ComplianceAuditor }
            - { call: "POST /hazwaste/waste-partners/${tsdf_id}/audits", payload: { coverage_from: "2026-06-01T00:00:00Z", coverage_to: "2026-12-01T00:00:00Z", outcome: "FAIL" }, as: ComplianceAuditor, captures: { err: "$.data.error_id" } }
          assert:
            - "Abutting PASS audit merges: audit_coverage_start == 2026-01-01T00:00:00Z and audit_coverage_end == 2028-01-01T00:00:00Z"
            - "WastePartner.${tsdf_id}.is_audit_current == true at the default clock 2026-08-01"
            - "Interior-overlapping FAIL audit: err == ERR_AUDIT_COVERAGE_OVERLAP"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: container_void_restores_month_mass
        grounds:
          - state_machines.Container.IN_CENTRAL_ACCUMULATION_to_VOIDED
          - calculations.monthly_generated_kg
          - entities.GeneratorSite.fields.current_month_generated_kg
        distinguishing_aspect: |
          Conserved quantity = generated mass (kg): create-then-void is the
          forward+compensating pair, and the invariant
          month_total_after_void == month_total_before_create must hold exactly,
          including the derived generator_category returning to VSQG.
        test_recipe:
          setup:
            - "Default clock; site with ACTIVE stream and central area; month total 0.0, category VSQG"
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 21.5, expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_id}", name: "Central A", area_type: "CENTRAL_90DAY" }, as: WasteCoordinator, captures: { area_id: "$.data.id" } }
          trigger:
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_id}", quantity_gallons: 10, quantity_kg: 250.0 }, as: WasteCoordinator, as_user_id: "wc-1", captures: { cont_id: "$.data.id" } }
            - { call: "GET /hazwaste/generator-sites/${site_id}", as: EHSManager }
            - { call: "POST /hazwaste/containers/${cont_id}/void", as: WasteCoordinator, as_user_id: "wc-1" }
            - { call: "GET /hazwaste/generator-sites/${site_id}", as: EHSManager }
            - { call: "GET /hazwaste/waste-streams/${stream_id}", as: EHSManager }
          assert:
            - "After create: current_month_generated_kg == 250.0 and generator_category == SQG"
            - "After void: current_month_generated_kg == 0.0 (== pre-create value; no drift)"
            - "After void: generator_category == VSQG and Container.${cont_id}.status == VOIDED"
            - "WasteStream.${stream_id}.total_generated_kg == 0.0 after the pair"

      - name: discrepancy_raise_resolve_restores_counter
        grounds:
          - state_machines.Manifest.DELIVERED_to_DISCREPANCY_RAISED
          - state_machines.Manifest.DISCREPANCY_RAISED_to_DELIVERED
          - entities.GeneratorSite.fields.open_discrepancy_count
        distinguishing_aspect: |
          Conserved quantity = the site's open-discrepancy counter (integer):
          raise (+1) paired with resolve (-1) must leave
          open_discrepancy_count identical to its pre-raise value — a different
          conserved quantity type than generated mass.
        test_recipe:
          setup:
            - "Default clock; manifest DELIVERED (full chain through TSDF receipt); open_discrepancy_count == 0"
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 21.5, expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_id}", name: "Central A", area_type: "CENTRAL_90DAY" }, as: WasteCoordinator, captures: { area_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners", payload: { partner_type: "TRANSPORTER", name: "HaulCo", epa_id_number: "EPA-TR-1", permitted_waste_codes: ["D001"] }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { transp_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners/${transp_id}/status", payload: { to_status: "APPROVED" }, as: ComplianceAuditor, as_user_id: "aud-2" }
            - { call: "POST /hazwaste/waste-partners/${transp_id}/audits", payload: { coverage_from: "2026-01-01T00:00:00Z", coverage_to: "2027-01-01T00:00:00Z", outcome: "PASS" }, as: ComplianceAuditor }
            - { call: "POST /hazwaste/waste-partners", payload: { partner_type: "TSDF", name: "DispCo", epa_id_number: "EPA-TS-1", permitted_waste_codes: ["D001"] }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { tsdf_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners/${tsdf_id}/status", payload: { to_status: "APPROVED" }, as: ComplianceAuditor, as_user_id: "aud-2" }
            - { call: "POST /hazwaste/waste-partners/${tsdf_id}/audits", payload: { coverage_from: "2026-01-01T00:00:00Z", coverage_to: "2027-01-01T00:00:00Z", outcome: "PASS" }, as: ComplianceAuditor }
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_id}", quantity_gallons: 10, quantity_kg: 100.0 }, as: WasteCoordinator, as_user_id: "wc-1", captures: { cont_id: "$.data.id" } }
            - { call: "POST /hazwaste/containers/${cont_id}/label", payload: { label_text: "Hazardous Waste — D001", label_accumulation_start_marked: "2026-08-01T00:00:00Z" }, as: WasteCoordinator, as_user_id: "wc-1" }
            - { call: "POST /hazwaste/containers/${cont_id}/inspections", payload: { result: "PASS" }, as: WasteCoordinator, as_user_id: "wc-2" }
            - { call: "POST /hazwaste/containers/${cont_id}/stage", as: WasteCoordinator, as_user_id: "wc-1" }
            - { call: "POST /hazwaste/manifests", payload: { site_id: "${site_id}", transporter_id: "${transp_id}", tsdf_id: "${tsdf_id}", manifest_tracking_number: "MT-950", line_items: [{ waste_stream_id: "${stream_id}", container_id: "${cont_id}", quantity_kg: 100.0 }] }, as: WasteCoordinator, as_user_id: "wc-1", captures: { man_id: "$.data.id" } }
            - { call: "POST /hazwaste/manifests/${man_id}/ldr-notifications", payload: { treatment_standard_codes: ["TLV-01"], certification_statement: "certified" }, as: EHSManager }
            - { call: "POST /hazwaste/manifests/${man_id}/sign-generator", as: EHSManager, as_user_id: "mgr-9" }
            - { call: "POST /hazwaste/manifests/${man_id}/sign-transporter", as: TransporterAgent, as_user_id: "${transp_id}" }
            - { call: "POST /hazwaste/manifests/${man_id}/receive", as: TSDFAgent, as_user_id: "${tsdf_id}" }
          trigger:
            - { call: "POST /hazwaste/manifests/${man_id}/raise-discrepancy", as: TSDFAgent, as_user_id: "${tsdf_id}" }
            - { call: "GET /hazwaste/generator-sites/${site_id}", as: EHSManager }
            - { call: "POST /hazwaste/manifests/${man_id}/resolve-discrepancy", as: ComplianceAuditor }
            - { call: "GET /hazwaste/generator-sites/${site_id}", as: EHSManager }
          assert:
            - "After raise: open_discrepancy_count == 1 and Manifest.${man_id}.status == DISCREPANCY_RAISED"
            - "After resolve: open_discrepancy_count == 0 (== pre-raise value; the pair conserves the counter)"
            - "After resolve: Manifest.${man_id}.status == DELIVERED"
