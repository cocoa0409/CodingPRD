      - name: unit_title_dimension_cycles_lost_and_back_while_funding_dimension_holds
        grounds:
          - state_machines.InventoryUnit.title_custody_status
          - state_machines.InventoryUnit.LENDER_HELD_to_LOST
          - state_machines.InventoryUnit.LOST_to_LENDER_HELD
          - state_machines.InventoryUnit.funding_status
          - entities.InventoryUnit.fields.eligibility_status
          - entities.InventoryUnit.fields.ineligibility_reason_code
          - calculations.credit_line_availability
          - endpoints["POST /floorplan/units/{id}/title-custody"]
        distinguishing_aspect: |
          Non-linearity here is PARALLEL DIMENSIONS PLUS A CYCLE on one entity: the
          title dimension traverses LENDER_HELD -> LOST -> LENDER_HELD and drags
          eligibility_status with it, while funding_status stays FLOORED and
          outstanding_principal_cents stays 3000000 through both hops, so
          eligible_collateral_cents falls to 0 and returns to 3000000 without
          available_credit_cents ever moving off 497000000.
