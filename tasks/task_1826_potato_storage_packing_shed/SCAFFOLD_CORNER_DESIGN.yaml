            - "GET /potato-shed/sheds/${s_id}/bins shows bin B-1 occupied_cwt == 0 and variety_lock == null (cleared at zero occupancy)"

      - name: c_settlement_dispute_refinalize_cycle
        claim_type: valid_transition
        grounds:
          - "state_machines.GrowerSettlement.FINALIZED_to_DISPUTED"
          - "state_machines.GrowerSettlement.DISPUTED_to_FINALIZED"
        distinguishing_aspect: "The dispute cycle runs FINALIZED -> DISPUTED -> FINALIZED; the re-finalize updates finalized_by_clerk_id to the second clerk, and pay then succeeds; disputing a PAID settlement is rejected."
        test_recipe:
          setup: ["grower with one lot 100.00 condemned WASTE at intake day (0 storage weeks); settlement created and finalized by clerk_one"]
          setup_api_calls:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/growers", payload: { name: "Grower P", grower_code: "G-P" }, as: ShedAdmin, captures: { g_id: "$.data.id", g_v: "$.data.version" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed CK" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-28", original_weight_cwt: 100.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk }
            - { call: "POST /potato-shed/field-lots/${l_id}/quality-transition", payload: { to_status: "ON_HOLD" }, as: QualityAssuranceManager }
            - { call: "POST /potato-shed/field-lots/${l_id}/quality-transition", payload: { to_status: "CONDEMNED", diversion_channel: "WASTE" }, as: QualityAssuranceManager }
            - { call: "POST /potato-shed/growers/${g_id}/settlements", payload: { season_label: "2026-storage", expected_grower_version: "${g_v}" }, as: SettlementClerk, captures: { st_id: "$.data.id" } }
            - { call: "POST /potato-shed/settlements/${st_id}/finalize", payload: {}, as: SettlementClerk, as_user_id: "clerk_one" }
          trigger:
            - { call: "POST /potato-shed/settlements/${st_id}/dispute", payload: { reason: "packout dispute" }, as: Grower, as_user_id: "${g_id}", captures: { s1: "$.data.status" } }
            - { call: "POST /potato-shed/settlements/${st_id}/finalize", payload: {}, as: SettlementClerk, as_user_id: "clerk_two", captures: { s2: "$.data.status", s2_clerk: "$.data.finalized_by_clerk_id" } }
            - { call: "POST /potato-shed/settlements/${st_id}/pay", payload: {}, as: SettlementClerk, captures: { s3: "$.data.status" } }
            - { call: "POST /potato-shed/settlements/${st_id}/dispute", payload: { reason: "too late" }, as: Grower, as_user_id: "${g_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "s1 == DISPUTED, s2 == FINALIZED and s2_clerk == 'clerk_two' (clerk hand-off recorded)"
            - "s3 == PAID; disputing a PAID settlement returns err == ERR_SETTLEMENT_INVALID_STATE"
            - "throughout the cycle net_payable_cents == 0 (100.00 condemned, 0 packed, 0 weeks: 0 - 0 - 0 + 0)"

  - section: calculations
    instances:
      - name: c_assessment_rebaselines_shrink_not_additive
        claim_type: correct_result
        grounds:
          - "calculations.shrink_reconciliation"
          - "entities.FieldLot.fields.shrink_cwt"
        distinguishing_aspect: "A second assessment REPLACES the shrink baseline (cumulative, not additive): assessments 20.00 then 30.00 leave shrink_cwt == 30.00 and available == original - 30.00, never 50.00."
        test_recipe:
          setup: ["BINNED lot of 500.00 cwt"]
          setup_api_calls:
            - { call: "POST /potato-shed/growers", payload: { name: "Grower Q", grower_code: "G-Q" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed DA" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
