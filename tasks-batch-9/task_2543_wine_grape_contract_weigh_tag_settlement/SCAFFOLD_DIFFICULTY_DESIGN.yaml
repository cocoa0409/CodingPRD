              payload: { measured_brix: 24.5, measured_ta_gl: 6.5, measured_ph: 3.45, measured_rot_pct: 1.0 }
              as: HarvestCoordinator
            - call: "POST /grower-relations/pick-calls"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}", target_pick_at: "2026-08-25T14:00:00Z", estimated_tons: 40.000 }
              as: HarvestCoordinator
              captures: { pick_id: $.data.id }
          assert:
            - "Call 1 (no SamplingVisit at all) returns 422 with error_id == ERR_BLOCK_NOT_PICK_READY"
            - "Call 3 (a SamplingVisit exists but its status is SCHEDULED) still returns 422 ERR_BLOCK_NOT_PICK_READY"
            - "After the first record, SamplingVisit.${visit_1_id}.status == COMPLETED, maturity_flag == IMMATURE and sampled_at == 2026-08-20T08:00:00Z"
            - "Call 5 (a COMPLETED but IMMATURE visit) still returns 422 ERR_BLOCK_NOT_PICK_READY"
            - "After the second record, SamplingVisit.${visit_2_id}.maturity_flag == PICK_READY and VineyardBlock.${block_id}.latest_sampling_brix == 24.5"
            - "Call 8 returns 201: PickCall.${pick_id}.status == ISSUED, notice_hours == 126 and ack_deadline_at == 2026-08-21T08:00:00Z"
            - "No PickCall row was created by any of the three refused calls"

      - name: delivery_appointment_requires_acknowledged_pick_call
        entity_pair: "DeliveryAppointment depends on PickCall"
        grounds:
          - validations.priority_21
          - state_machines.PickCall.ISSUED_to_ACKNOWLEDGED
          - entities.PickCall.fields.appointed_tons
        distinguishing_aspect: |
          Pair 2: DeliveryAppointment <- PickCall, a different pair of entities from instance 1
