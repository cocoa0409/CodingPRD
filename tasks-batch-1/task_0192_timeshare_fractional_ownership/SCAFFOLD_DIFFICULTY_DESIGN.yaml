              payload: { resort_id: "${resort_id}", owner_id: "${seller_id}", ownership_type: "DEEDED", inventory_model: "POINTS", annual_points_allotment: 10000 }
              as: ResortManager
              captures: { contract_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-08T00:00:00Z" }
              as: ResortManager
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ResortManager
            - call: "POST /resale-transfers"
              payload: { source_contract_id: "${contract_id}", buyer_owner_id: "${buyer_id}", sale_price_cents: 5000000, transfer_use_year: 2026, transfer_day_of_year: 120 }
              as: ResaleAgent
              captures: { transfer_id: $.data.id }
            - call: "POST /invoices"
              payload: { contract_id: "${contract_id}", source_type: "ANNUAL", use_year: 2026, due_date: "2026-02-01T00:00:00Z" }
              as: ResortManager
              captures: { invoice_id: $.data.id }
            - call: "POST /invoices/${invoice_id}/issue"
              payload: {}
              as: ResortManager
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-03-10T00:00:00Z" }
              as: ResortManager
            - call: "POST /invoices/${invoice_id}/mark-delinquent"
              payload: {}
              as: ResortManager
          trigger:
            - call: "POST /resale-transfers/${transfer_id}/complete"
              payload: {}
              as: ResaleAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_CONTRACT_DELINQUENT"
            - "ResaleTransfer.${transfer_id}.status remains PENDING_RESCISSION; Contract.${contract_id}.status remains SUSPENDED-or-ACTIVE (not TRANSFERRED)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: unit_week_exclusive_occupancy_confirm
        grounds:
          - validations[priority=10]
          - state_machines.Reservation.HELD_to_CONFIRMED
          - entities.InventoryUnit.fields.status
        distinguishing_aspect: |
          Exclusive single-slot occupancy semantics on the InventoryUnit resource: a unit-week may be
          held by many HELD reservations but only ONE may CONFIRM (occupy) it; a second confirm of the
          same unit-week collides and returns ERR_UNIT_NOT_AVAILABLE (point/exclusive interval, no
          adjacency or aggregate capacity).
        test_recipe:
          setup:
            - "Resort R; GOLD unit U (1000 pts); two contracts C1, C2 each ACTIVE allotment 5000, each with a HELD reservation on U."
            - "C1's reservation confirmed first -> U.status RESERVED."
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "R", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000 }
              as: ResortManager
              captures: { resort_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-01T00:00:00Z" }
              as: ResortManager
            - call: "POST /owners"
              payload: { resort_id: "${resort_id}", full_name: "O1", email: "o1@x.com" }
              as: ResortManager
              captures: { owner1: $.data.id }
            - call: "POST /owners"
              payload: { resort_id: "${resort_id}", full_name: "O2", email: "o2@x.com" }
              as: ResortManager
              captures: { owner2: $.data.id }
            - call: "POST /inventory-units"
              payload: { resort_id: "${resort_id}", unit_label: "Villa Gold", week_number: 40, season: "GOLD" }
              as: ResortManager
              captures: { unit_id: $.data.id }
            - call: "POST /contracts"
              payload: { resort_id: "${resort_id}", owner_id: "${owner1}", ownership_type: "DEEDED", inventory_model: "POINTS", annual_points_allotment: 5000 }
              as: ResortManager
              captures: { contract1: $.data.id }
            - call: "POST /contracts"
              payload: { resort_id: "${resort_id}", owner_id: "${owner2}", ownership_type: "DEEDED", inventory_model: "POINTS", annual_points_allotment: 5000 }
              as: ResortManager
              captures: { contract2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-08T00:00:00Z" }
              as: ResortManager
            - call: "POST /contracts/${contract1}/activate"
              payload: {}
              as: ResortManager
            - call: "POST /contracts/${contract2}/activate"
              payload: {}
              as: ResortManager
            - call: "GET /points-accounts?contract_id=${contract1}&use_year=2026"
              as: Owner
              as_user_id: "${owner1}"
              captures: { acct1_v: $.data.0.version }
            - call: "POST /reservations"
              payload: { contract_id: "${contract1}", inventory_unit_id: "${unit_id}", use_year: 2026, expected_points_account_version: "${acct1_v}" }
              as: Owner
              as_user_id: "${owner1}"
              captures: { resv1: $.data.id }
            - call: "GET /points-accounts?contract_id=${contract2}&use_year=2026"
              as: Owner
              as_user_id: "${owner2}"
              captures: { acct2_v: $.data.0.version }
            - call: "POST /reservations"
              payload: { contract_id: "${contract2}", inventory_unit_id: "${unit_id}", use_year: 2026, expected_points_account_version: "${acct2_v}" }
              as: Owner
              as_user_id: "${owner2}"
              captures: { resv2: $.data.id }
            - call: "POST /reservations/${resv1}/confirm"
              payload: {}
              as: Owner
              as_user_id: "${owner1}"
          trigger:
            - call: "POST /reservations/${resv2}/confirm"
              payload: {}
              as: Owner
              as_user_id: "${owner2}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_UNIT_NOT_AVAILABLE (single-slot exclusive occupancy)"
            - "Reservation.${resv2}.status remains HELD; InventoryUnit.${unit_id}.status == RESERVED (held by resv1)"

      - name: points_account_aggregate_capacity_borrow_overflow
        grounds:
          - validations[priority=14]
          - calculations.reservation_points_cost
          - entities.PointsAccount.fields.available_points
          - errors[ERR_INSUFFICIENT_POINTS]
        distinguishing_aspect: |
          Aggregate-capacity-over-adjacent-interval semantics on the PointsAccount resource (distinct
          from the unit's exclusive occupancy): a reservation that must borrow from the adjacent
          use_year+1 account is rejected with ERR_INSUFFICIENT_POINTS when the borrowed_points exceed
          that next-year account's available_points — collision is on summed capacity, not on a slot.
        test_recipe:
          setup:
            - "Resort R with points_per_week_base=10000 so a PLATINUM unit costs round_half_up(10000*1.5)=15000 points; DEEDED POINTS contract C allotment 1000 (2026), ACTIVE; clock 2026-01-08."
            - "2026 account available 1000; cost 15000 -> shortfall 14000; the lazily-created 2027 account has allotment 1000, so 14000 > 1000 available -> ERR_INSUFFICIENT_POINTS."
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "R", points_per_week_base: 10000, annual_fee_cents_per_1000_points: 20000, borrow_surcharge_pct: 0.10 }
              as: ResortManager
              captures: { resort_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-01T00:00:00Z" }
              as: ResortManager
            - call: "POST /owners"
              payload: { resort_id: "${resort_id}", full_name: "O1", email: "o1@x.com" }
              as: ResortManager
              captures: { owner_id: $.data.id }
            - call: "POST /inventory-units"
              payload: { resort_id: "${resort_id}", unit_label: "Villa Plat", week_number: 45, season: "PLATINUM" }
              as: ResortManager
              captures: { unit_id: $.data.id }
            - call: "POST /contracts"
              payload: { resort_id: "${resort_id}", owner_id: "${owner_id}", ownership_type: "DEEDED", inventory_model: "POINTS", annual_points_allotment: 1000 }
              as: ResortManager
              captures: { contract_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-08T00:00:00Z" }
              as: ResortManager
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ResortManager
            - call: "GET /points-accounts?contract_id=${contract_id}&use_year=2026"
              as: Owner
              as_user_id: "${owner_id}"
              captures: { acct_2026_v: $.data.0.version }
          trigger:
            - call: "POST /reservations"
              payload: { contract_id: "${contract_id}", inventory_unit_id: "${unit_id}", use_year: 2026, expected_points_account_version: "${acct_2026_v}" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INSUFFICIENT_POINTS (PLATINUM cost 15000; 2026 avail 1000; shortfall 14000 > 2027 lazily-created account avail 1000)"
            - "No Reservation row is created on overflow"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: points_conservation_confirm_then_cancel
        grounds:
          - state_machines.Reservation.HELD_to_CONFIRMED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - entities.PointsAccount.fields.available_points
          - entities.PointsAccount.fields.committed_points
        distinguishing_aspect: |
          Conserved quantity = PointsAccount.available_points. Forward (confirm) commits
          (points_cost - borrowed_points); compensating (cancel of a CONFIRMED reservation) releases
          exactly that amount, so available_points returns to its pre-confirm value with zero drift.
        test_recipe:
          setup:
            - "Resort R; DEEDED POINTS contract C ACTIVE allotment 5000; GOLD unit U (1000 pts)."
            - "2026 account available_points == 5000 before booking."
            - "CONFIRMED reservation on U (no borrow): committed 1000, available 4000."
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "R", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000 }
              as: ResortManager
              captures: { resort_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-01T00:00:00Z" }
              as: ResortManager
            - call: "POST /owners"
              payload: { resort_id: "${resort_id}", full_name: "O1", email: "o1@x.com" }
              as: ResortManager
              captures: { owner_id: $.data.id }
            - call: "POST /inventory-units"
              payload: { resort_id: "${resort_id}", unit_label: "Villa Gold", week_number: 12, season: "GOLD" }
              as: ResortManager
              captures: { unit_id: $.data.id }
            - call: "POST /contracts"
              payload: { resort_id: "${resort_id}", owner_id: "${owner_id}", ownership_type: "DEEDED", inventory_model: "POINTS", annual_points_allotment: 5000 }
              as: ResortManager
              captures: { contract_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-08T00:00:00Z" }
              as: ResortManager
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ResortManager
            - call: "GET /points-accounts?contract_id=${contract_id}&use_year=2026"
              as: Owner
              as_user_id: "${owner_id}"
              captures: { acct_id: $.data.0.id, acct_v: $.data.0.version }
            - call: "POST /reservations"
              payload: { contract_id: "${contract_id}", inventory_unit_id: "${unit_id}", use_year: 2026, expected_points_account_version: "${acct_v}" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { reservation_id: $.data.id }
            - call: "POST /reservations/${reservation_id}/confirm"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /reservations/${reservation_id}/cancel"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
          assert:
            - "Before confirm: PointsAccount.${acct_id}.available_points == 5000"
            - "After confirm: PointsAccount.${acct_id}.committed_points == 1000, available_points == 4000"
            - "After cancel: PointsAccount.${acct_id}.committed_points == 0, available_points == 5000 (conserved, no drift)"

      - name: receivables_conservation_payment_clear_then_reverse
        grounds:
          - state_machines.Payment.INITIATED_to_CLEARED
          - state_machines.Payment.CLEARED_to_REVERSED
          - entities.MaintenanceFeeInvoice.fields.amount_due_cents
          - entities.MaintenanceFeeInvoice.fields.amount_paid_cents
        distinguishing_aspect: |
          Conserved quantity = the contract's total outstanding sum(MaintenanceFeeInvoice.amount_due_cents)
          (cents, a different conserved quantity than points). Forward (clear) reduces amount_due to 0
          and flips ISSUED->PAID; compensating (reverse) restores amount_due and flips PAID->ISSUED,
          leaving the contract's total receivable unchanged.
        test_recipe:
          setup:
            - "Resort R; DEEDED POINTS contract C ACTIVE allotment 10000; ANNUAL invoice ISSUED amount_cents=200000 (amount_due 200000)."
            - "Payment P of 200000 INITIATED then CLEARED -> invoice PAID, amount_due 0."
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "R", points_per_week_base: 1000, annual_fee_cents_per_1000_points: 20000 }
              as: ResortManager
              captures: { resort_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-01T00:00:00Z" }
              as: ResortManager
            - call: "POST /owners"
              payload: { resort_id: "${resort_id}", full_name: "O1", email: "o1@x.com" }
              as: ResortManager
              captures: { owner_id: $.data.id }
            - call: "POST /contracts"
              payload: { resort_id: "${resort_id}", owner_id: "${owner_id}", ownership_type: "DEEDED", inventory_model: "POINTS", annual_points_allotment: 10000 }
              as: ResortManager
              captures: { contract_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { resort_id: "${resort_id}", to_iso8601: "2026-01-08T00:00:00Z" }
              as: ResortManager
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ResortManager
            - call: "POST /invoices"
              payload: { contract_id: "${contract_id}", source_type: "ANNUAL", use_year: 2026, due_date: "2026-02-01T00:00:00Z" }
              as: ResortManager
              captures: { invoice_id: $.data.id }
            - call: "POST /invoices/${invoice_id}/issue"
              payload: {}
              as: ResortManager
            - call: "POST /payments"
              payload: { contract_id: "${contract_id}", amount_cents: 200000, invoice_id: "${invoice_id}" }
              as: ResortManager
              captures: { payment_id: $.data.id }
            - call: "POST /payments/${payment_id}/clear"
              payload: {}
              as: ResortManager
          trigger:
            - call: "POST /payments/${payment_id}/reverse"
              payload: {}
              as: ResortManager
          assert:
            - "After clear: MaintenanceFeeInvoice.${invoice_id}.status == PAID, amount_due_cents == 0, amount_paid_cents == 200000"
            - "After reverse: MaintenanceFeeInvoice.${invoice_id}.status == ISSUED, amount_due_cents == 200000, amount_paid_cents == 0 (receivable conserved)"

