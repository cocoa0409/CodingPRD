  - section: validations
    instances:
      - name: missing_auth_headers_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role fails with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role or existence check."
        test_recipe:
          setup: ["Airport exists"]
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KAU", name: "Auth Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_au: $.data.id }
          trigger:
            - call: "GET /airports/${ap_au}"
              as: Anonymous
              captures: { err_au: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: offer_on_suspended_airport_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
