      - name: rent_override_below_floor_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_RENT_OVERRIDE_TOO_LOW]"]
        distinguishing_aspect: "Rent override floor: computed rent 200000 → floor round_half_up(0.8*200000)=160000; override 159999 fails 422 ERR_RENT_OVERRIDE_TOO_LOW while 160000 succeeds and pins monthly_rent_cents to the override."
        test_recipe:
          setup:
            - "Property P, agent A, floorplan F rent 200000 / 2 units; application APPROVED (no published offer → computed rent = base 200000)"
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "Override Oaks", code: "OV1" }
              as: PropertyManager
              captures: { p_id: $.data.id }
