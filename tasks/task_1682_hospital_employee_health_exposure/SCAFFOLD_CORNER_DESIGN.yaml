            - call: "POST /employee-health/employees/${emp_id}/exposure-cases"
              payload: { exposure_type: "PERCUTANEOUS", exposure_datetime: "2026-07-30T10:00:00Z", source_known: false, body_fluid: "BLOOD" }
              as: EmployeeHealthNurse
              captures: { case_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
