              payload: { to_status: "BAKED" }
              as: Baker
              as_user_id: "${baker_id}"
          trigger:
            - call: "POST /bakery/batches/${batch_cookie}/confirm-yield"
              payload: { actual_yield_units: 40 }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { cookie_surplus: $.data.surplus_units, cookie_status: $.data.batch_status }
            - call: "POST /bakery/batches/${batch_bread}/confirm-yield"
              payload: { actual_yield_units: 3 }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { bread_surplus: $.data.surplus_units, bread_status: $.data.batch_status }
          assert:
            - "${cookie_planned} == 48 and ${bread_planned} == 12"
            - "surplus fork: OrderLine.${line_cookie}.allocated_units == 26, shorted_units == 0, line_status == ALLOCATED"
            - "${cookie_surplus} == 14 and 26 + 14 == 40 == actual_yield_units"
            - "${cookie_status} == ALLOCATED"
            - "shortfall fork: OrderLine.${line_bread}.allocated_units == 3, shorted_units == 1, line_status == CREDITED"
            - "${bread_surplus} == 0 and 3 + 0 == 3 == actual_yield_units"
            - "${bread_status} == ALLOCATED"
            - "a MoneyMovement exists with order_id ${o1}, movement_kind SHORTFALL_CREDIT, reason SHORTFALL, ledger_scope CUSTOMER_CREDIT, amount_cents 900"
            - "Customer.${cust_id}.credit_balance_cents == 900 and Order.${o1}.shortfall_flag == true"

      - name: refund_waterfall_conserves_money_while_tip_leg_never_touches_gross_sales
        grounds:
          - conservation_invariants[order_money_conservation]
