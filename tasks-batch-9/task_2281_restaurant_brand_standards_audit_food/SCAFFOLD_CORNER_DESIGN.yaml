    - name: section_percents_round_each_item_before_averaging
      claim_type: precision
      grounds:
      - calculations.visit_section_percent
      excluded_because:
        difficulty_instance: combinatorial_formula / per_item_rounding_order_pinned_and_flips_the_grade
        rationale: The rounding order is the whole point of the pinned formula, and the difficulty instance already contrasts round-each-item-then-average (92.83 rubric, composite 90.70, PASS) against the
          forbidden sum-then-divide order (89.80, CONDITIONAL) on the same score sheet. A corner precision test would restate the same comparison.
