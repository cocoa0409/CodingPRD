# =============================================================================
# Scaffold: Personal Budgeting & Account Aggregation (task_0601)
# =============================================================================

scenario: |
  601. Personal Budgeting & Account Aggregation (Mint/YNAB/Monarch Money style):
  multi-institution aggregation (Plaid), auto-categorization & rules, zero-based/envelope
  budget allocation, recurring-bill calendar & cash-flow forecast, goal & sinking-fund
  tracking, net-worth rollup, shared-household ledger, overspend alert & category rollover

domain_name: personal-budgeting

api_prefix: /households

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - dual_variant_calculation        # pending-aware vs cleared net worth; allocated vs available envelope
    - cascading_side_effects          # transaction post -> envelope spent -> household posture -> goal funding
    - derived_field_reconciliation    # envelope spent/available, household net_worth, posture stay consistent
    - optimistic_concurrency          # OCC on Household.version for budget-period rollover create

  entity_topology: hybrid
  # Household is the aggregate root (tree: Household -> Account -> Transaction),
  # with cross-cutting flat references (Transaction -> BudgetCategory, Goal -> BudgetCategory).

  state_machine_shape: compound
  # Household posture is derived from child BudgetCategory overspend state; Transaction
  # and Goal carry non-linear (cyclic / branching) machines of their own.

  relationship_patterns:
    - one_to_many        # Household -> Account, Account -> Transaction, Household -> BudgetCategory
    - cross_aggregate    # Transaction -> BudgetCategory, Goal -> BudgetCategory funding source
    - self_referential   # CategoryRule evaluation order; BudgetCategory rollover from prior period

  role_model: peer_roles
  # HouseholdOwner (full control), HouseholdMember (spends/categorizes within household),
  # PlatformAdmin (opaque operator running aggregation sync + period close).

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — emitted verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Household
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Household display name" }
      - { name: base_currency, type: enum, source: input, default: "USD", description: "USD | EUR | GBP — all monetary amounts are integer minor units (cents) in this currency" }
      - { name: owner_member_id, type: string, source: system, description: "Reference to the Member.id created as OWNER when the household is created (back-reference; reverse lookup via Member.household_id list)" }
      - { name: current_period_id, type: string, source: system, description: "Reference to the OPEN BudgetPeriod.id the household is currently allocating against, null until first period opened (back-reference; reverse lookup via BudgetPeriod.household_id list)" }
      - { name: posture, type: enum, source: computed, description: "HEALTHY | OVERSPENT | FROZEN — derived: FROZEN if owner froze; else OVERSPENT if any BudgetCategory in the current period is OVER; else HEALTHY" }
      - { name: net_worth_cents, type: integer, source: computed, description: "Cleared net worth: sum of Account.cleared_balance_cents across non-archived accounts, asset accounts positive and liability accounts negated (see net_worth_rollup)" }
      - { name: projected_net_worth_cents, type: integer, source: computed, description: "Pending-aware net worth using Account.available_balance_cents (includes PENDING transactions) — diverges from net_worth_cents (see net_worth_rollup variants)" }
      - { name: frozen_by_owner, type: boolean, source: system, default: false, description: "True after POST /households/{id}/freeze; cleared by /unfreeze" }

  - name: Member
    parent: Household
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; household this member belongs to" }
      - { name: email, type: string, source: input, description: "Member email, unique within the household" }
      - { name: display_name, type: string, source: input, description: "Member display name" }
      - { name: role, type: enum, source: input, default: "MEMBER", description: "OWNER | MEMBER — OWNER for the founding member, MEMBER for invited members" }

  - name: Account
    parent: Household
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; owning household" }
      - { name: institution_name, type: string, source: input, description: "Plaid institution display name" }
      - { name: account_type, type: enum, source: input, description: "DEPOSITORY | CREDIT | LOAN | INVESTMENT — DEPOSITORY/INVESTMENT are assets, CREDIT/LOAN are liabilities" }
      - { name: cleared_balance_cents, type: integer, source: computed, description: "Opening balance plus sum of signed amount_cents of POSTED (non-removed) transactions on this account" }
      - { name: available_balance_cents, type: integer, source: computed, description: "Opening balance plus sum of signed amount_cents of POSTED and PENDING (non-removed) transactions on this account" }
      - { name: opening_balance_cents, type: integer, source: input, default: 0, description: "Balance at the moment the account was linked, before any tracked transaction" }
      - { name: status, type: enum, source: system, description: "LINKED | ARCHIVED — ARCHIVED accounts are excluded from net-worth rollup and aggregation sync" }

  - name: Transaction
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; account this transaction belongs to" }
      - { name: budget_category_id, type: string, source: system, description: "FK -> BudgetCategory.id; category this transaction is assigned to (null until categorized)" }
      - { name: amount_cents, type: integer, source: input, description: "Signed minor-unit amount: negative for outflow/spend, positive for inflow/income" }
      - { name: merchant_name, type: string, source: input, description: "Merchant string used by auto-categorization matching" }
      - { name: posted_period_id, type: string, source: system, description: "FK -> BudgetPeriod.id; the budget period whose envelope this transaction's spend counts against (set when it first POSTS while categorized)" }
      - { name: status, type: enum, source: system, description: "PENDING -> POSTED -> RECATEGORIZED (cyclic) ; PENDING/POSTED -> REMOVED" }
      - { name: state, type: enum, source: system, description: "Alias view of status; terminal REMOVED" }

  - name: CategoryRule
    parent: Household
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; household whose transactions this rule auto-categorizes" }
      - { name: match_substring, type: string, source: input, description: "Case-insensitive substring matched against Transaction.merchant_name" }
      - { name: budget_category_id, type: string, source: input, description: "FK -> BudgetCategory.id; category assigned when this rule matches" }
      - { name: priority, type: integer, source: input, description: "Lower number wins when multiple rules match the same merchant; ties broken by created_at ASC" }
      - { name: enabled, type: boolean, source: input, default: true, description: "Disabled rules are skipped during auto-categorization" }

  - name: BudgetPeriod
    parent: Household
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; owning household" }
      - { name: month, type: string, source: input, description: "Period month as YYYY-MM (e.g. 2026-02); unique per household" }
      - { name: status, type: enum, source: system, description: "OPEN -> CLOSED — only one OPEN period per household at a time" }
      - { name: income_expected_cents, type: integer, source: input, default: 0, description: "Planned income for the period; zero-based rule requires total allocated to equal this on close" }
      - { name: total_allocated_cents, type: integer, source: computed, description: "Sum of BudgetCategory.allocated_cents for categories in this period" }

  - name: BudgetCategory
    parent: BudgetPeriod
    common_fields: true
    fields:
      - { name: budget_period_id, type: string, source: input, description: "FK -> BudgetPeriod.id; period this envelope belongs to" }
      - { name: household_id, type: string, source: system, description: "FK -> Household.id; denormalized owning household" }
      - { name: name, type: string, source: input, description: "Envelope name (e.g. Groceries); unique per period" }
      - { name: allocated_cents, type: integer, source: input, default: 0, description: "Funds allocated to this envelope this period" }
      - { name: rollover_in_cents, type: integer, source: system, default: 0, description: "Positive leftover carried in from the prior period's same-named category on close (see rollover_carry)" }
      - { name: spent_cents, type: integer, source: computed, description: "Absolute sum of outflow amount_cents (negative txns) for POSTED transactions whose budget_category_id is this category and posted_period_id is this period" }
      - { name: available_cents, type: integer, source: computed, description: "allocated_cents + rollover_in_cents - spent_cents (envelope variant — may go negative)" }
      - { name: envelope_state, type: enum, source: computed, description: "FUNDED | DRAWN | OVER — OVER when available_cents < 0, DRAWN when spent_cents > 0 and available_cents >= 0, else FUNDED" }
      - { name: rollover_enabled, type: boolean, source: input, default: true, description: "If false, leftover is forfeited on close instead of carried forward" }

  - name: Goal
    parent: Household
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; owning household" }
      - { name: name, type: string, source: input, description: "Goal / sinking-fund name" }
      - { name: target_cents, type: integer, source: input, description: "Target amount to accumulate; must be > 0" }
      - { name: funded_cents, type: integer, source: computed, description: "Sum of GoalContribution.amount_cents for non-reversed contributions to this goal" }
      - { name: funding_category_id, type: string, source: input, description: "FK -> BudgetCategory.id; the envelope contributions are drawn from" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> FUNDED (cyclic back to ACTIVE on target raise) ; ACTIVE -> ABANDONED" }

  - name: GoalContribution
    parent: Goal
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: goal_id, type: string, source: input, description: "FK -> Goal.id; goal being funded" }
      - { name: amount_cents, type: integer, source: input, description: "Positive contribution amount drawn from the goal's funding_category envelope" }
      - { name: reversed, type: boolean, source: system, default: false, description: "True after the contribution is reversed; reversed contributions are excluded from Goal.funded_cents" }

  - name: RecurringBill
    parent: Household
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; owning household" }
      - { name: payee, type: string, source: input, description: "Bill payee name" }
      - { name: amount_cents, type: integer, source: input, description: "Positive amount due each occurrence" }
      - { name: day_of_month, type: integer, source: input, description: "Due day 1..28 (clamped domain)" }
      - { name: funding_category_id, type: string, source: input, description: "FK -> BudgetCategory.id; envelope expected to cover this bill" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PAUSED — PAUSED bills are excluded from the cash-flow forecast" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Household posture (compound / posture-driven; derived) ---
  - entity: Household
    field: posture
    derivation: |
      Recomputed after every transaction post/recategorize/remove, every category allocation
      change, every freeze/unfreeze, and on period rollover:
        1) FROZEN  if Household.frozen_by_owner == true
        2) OVERSPENT if any BudgetCategory in current_period_id has envelope_state == OVER
        3) HEALTHY otherwise
      While posture == FROZEN: all spend-affecting writes (categorize/recategorize a transaction,
      create transaction, allocate funds, goal-contribute) are rejected with ERR_HOUSEHOLD_FROZEN.

  # --- Transaction (cyclic: RECATEGORIZED loops; plus REMOVED terminal) ---
  - entity: Transaction
    initial_state: PENDING
    terminal_states: [REMOVED]
    transitions:
      - from: PENDING
        to: POSTED
        trigger: "POST /accounts/{account_id}/transactions/{id}/post"
        actor: PlatformAdmin
        preconditions:
          - "Household.posture != FROZEN (ERR_HOUSEHOLD_FROZEN)"
          - "parent Account.status == LINKED (ERR_ACCOUNT_ARCHIVED)"
        side_effects:
          - "Auto-categorization runs: if budget_category_id is null, assign via highest-priority enabled matching CategoryRule (auto_categorize)"
          - "If now categorized, set posted_period_id = Household.current_period_id and recompute that BudgetCategory.spent_cents/available_cents/envelope_state (envelope_accounting)"
          - "Recompute parent Account.cleared_balance_cents and available_balance_cents (account_balance)"
          - "Recompute Household.net_worth_cents and projected_net_worth_cents (net_worth_rollup)"
          - "Recompute Household.posture (cascade: category OVER -> OVERSPENT)"

      - from: POSTED
        to: RECATEGORIZED
        trigger: "POST /accounts/{account_id}/transactions/{id}/recategorize"
        actor: HouseholdMember
        preconditions:
          - "Household.posture != FROZEN (ERR_HOUSEHOLD_FROZEN)"
          - "target BudgetCategory exists and belongs to Household.current_period_id (ERR_CATEGORY_PERIOD_MISMATCH)"
        side_effects:
          - "Old category (if any): subtract this txn's outflow, recompute spent_cents/available_cents/envelope_state"
          - "Set budget_category_id = target; set posted_period_id = current_period_id; recompute new category spent_cents/available_cents/envelope_state"
          - "Recompute Household.posture (old category may leave OVER; new category may enter OVER)"
        note: "Status returns to POSTED-equivalent (re-enters POSTED) after recategorize completes; modeled as RECATEGORIZED then immediately POSTED so the loop POSTED->RECATEGORIZED->POSTED is cyclic."

      - from: RECATEGORIZED
        to: POSTED
        trigger: "system (recategorize completes)"
        actor: system
        preconditions: []
        side_effects:
          - "Transaction is again POSTED and can be recategorized again (cycle)"

      - from: PENDING
        to: REMOVED
        trigger: "POST /accounts/{account_id}/transactions/{id}/remove"
        actor: PlatformAdmin
        preconditions:
          - "Household.posture != FROZEN (ERR_HOUSEHOLD_FROZEN)"
        side_effects:
          - "Recompute parent Account.available_balance_cents (PENDING was only in available)"
          - "Recompute Household.projected_net_worth_cents"

      - from: POSTED
        to: REMOVED
        trigger: "POST /accounts/{account_id}/transactions/{id}/remove"
        actor: PlatformAdmin
        preconditions:
          - "Household.posture != FROZEN (ERR_HOUSEHOLD_FROZEN)"
        side_effects:
          - "If categorized: subtract outflow from BudgetCategory.spent_cents, recompute available_cents/envelope_state"
          - "Recompute parent Account.cleared_balance_cents and available_balance_cents"
          - "Recompute Household.net_worth_cents and projected_net_worth_cents"
          - "Recompute Household.posture (category may leave OVER -> HEALTHY)"

  # --- Goal (branching ACTIVE->{FUNDED,ABANDONED}; cyclic FUNDED->ACTIVE) ---
  - entity: Goal
    initial_state: ACTIVE
    terminal_states: [ABANDONED]
    transitions:
      - from: ACTIVE
        to: FUNDED
        trigger: "system (GoalContribution brings funded_cents >= target_cents)"
        actor: system
        preconditions:
          - "funded_cents >= target_cents after the contribution (goal_funding)"
        side_effects:
          - "status = FUNDED"

      - from: FUNDED
        to: ACTIVE
        trigger: "PATCH /households/{household_id}/goals/{id} (raising target_cents above funded_cents)"
        actor: HouseholdOwner
        preconditions:
          - "new target_cents > current funded_cents (ERR_GOAL_TARGET_BELOW_FUNDED)"
        side_effects:
          - "status = ACTIVE (goal reopened; cycle FUNDED->ACTIVE->FUNDED)"

      - from: ACTIVE
        to: ABANDONED
        trigger: "POST /households/{household_id}/goals/{id}/abandon"
        actor: HouseholdOwner
        preconditions: []
        side_effects:
          - "All non-reversed GoalContributions are reversed; each reversal credits its amount_cents back to funding_category.available (contribution_reversal — conserves household_allocated_cents)"
          - "Recompute funding BudgetCategory.available_cents/envelope_state and Household.posture"

  # --- BudgetPeriod (linear OPEN->CLOSED, gate for rollover) ---
  - entity: BudgetPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /households/{household_id}/budget-periods/{id}/close"
        actor: HouseholdOwner
        preconditions:
          - "expected_household_version matches Household.version (OCC, ERR_STALE_HOUSEHOLD)"
          - "Zero-based check: total_allocated_cents == income_expected_cents (ERR_BUDGET_NOT_ZERO_BASED)"
          - "This period is Household.current_period_id (ERR_INVALID_STATE)"
        side_effects:
          - "status = CLOSED"
          - "A new OPEN BudgetPeriod is created for the next month; Household.current_period_id points to it; Household.version increments by 1"
          - "For each category with rollover_enabled and available_cents > 0: a same-named category is created in the new period with rollover_in_cents = available_cents (rollover_carry — conserves household_carried_cents)"
          - "Recompute Household.posture against the new period (becomes HEALTHY unless a rolled category is already OVER)"

  # --- Account (linked -> archived; gates aggregation/net-worth) ---
  - entity: Account
    initial_state: LINKED
    terminal_states: [ARCHIVED]
    transitions:
      - from: LINKED
        to: ARCHIVED
        trigger: "POST /households/{household_id}/accounts/{id}/archive"
        actor: HouseholdOwner
        preconditions:
          - "Account has no PENDING transactions (ERR_PENDING_TRANSACTIONS_EXIST)"
        side_effects:
          - "Account excluded from net-worth rollup; recompute Household.net_worth_cents and projected_net_worth_cents"

  # --- RecurringBill (scheduled <-> paused; affects forecast) ---
  - entity: RecurringBill
    initial_state: SCHEDULED
    terminal_states: []
    transitions:
      - from: SCHEDULED
        to: PAUSED
        trigger: "POST /households/{household_id}/recurring-bills/{id}/pause"
        actor: HouseholdMember
        preconditions: []
        side_effects:
          - "Bill excluded from cash-flow forecast"
      - from: PAUSED
        to: SCHEDULED
        trigger: "POST /households/{household_id}/recurring-bills/{id}/resume"
        actor: HouseholdMember
        preconditions:
          - "No existing SCHEDULED bill of the same payee occupies the +/-2-day due-day slot (ERR_BILL_SLOT_CONFLICT)"
        side_effects:
          - "Bill re-enters cash-flow forecast"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on Household.version)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: period-close-stale-household
    parent_entity: Household
    write_endpoint: "POST /households/{household_id}/budget-periods/{id}/close"
    occ_field: "expected_household_version"
    description: |
      Closing the current BudgetPeriod against a Household whose version has advanced
      since the client last observed it is rejected. Closing a period legitimately
      supersedes the household's allocation state by minting a new OPEN period and
      bumping the version; a second close request still carrying the prior version
      is operating on a stale view of which period is current and is rejected.
    error_id: ERR_STALE_HOUSEHOLD
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: net_worth_rollup
    trigger: "transaction post/remove, account archive, account create"
    algorithm: aggregation
    formula: |
      sign(account) = +1 if account_type in {DEPOSITORY, INVESTMENT} else -1   # CREDIT, LOAN -> -1
      cleared_balance_cents(a)  = a.opening_balance_cents
                                + sum(t.amount_cents for t in a.transactions if t.status in {POSTED} and t.status != REMOVED)
      available_balance_cents(a)= a.opening_balance_cents
                                + sum(t.amount_cents for t in a.transactions if t.status in {POSTED, PENDING} and t.status != REMOVED)
      net_worth_cents           = sum(sign(a) * cleared_balance_cents(a)   for a in accounts if a.status == LINKED)
      projected_net_worth_cents = sum(sign(a) * available_balance_cents(a) for a in accounts if a.status == LINKED)
    input_set: "Only LINKED accounts; cleared variant counts POSTED only, projected variant counts POSTED+PENDING."
    precision: "integer cents, no rounding"
    variants:
      - name: cleared
        when: "net_worth_cents — settled view"
        difference: "Excludes PENDING transactions entirely."
      - name: pending_aware
        when: "projected_net_worth_cents — forward view"
        difference: "Includes PENDING transactions in the balance, so it diverges from cleared whenever an account has open PENDING transactions."

  - name: envelope_accounting
    trigger: "transaction post (categorized), recategorize, remove, goal-contribute, contribution-reversal, allocate"
    algorithm: aggregation
    formula: |
      spent_cents(c)     = sum( -t.amount_cents
                                for t in transactions
                                if t.budget_category_id == c.id
                                and t.posted_period_id == c.budget_period_id
                                and t.status == POSTED
                                and t.amount_cents < 0 )          # outflows only; spent is a positive magnitude
      contributions(c)   = sum( gc.amount_cents
                                for gc in goal_contributions
                                if gc reversed == false
                                and gc.goal.funding_category_id == c.id )
      available_cents(c) = c.allocated_cents + c.rollover_in_cents - spent_cents(c) - contributions(c)
      envelope_state(c)  = OVER   if available_cents(c) < 0
                           DRAWN  if available_cents(c) >= 0 and (spent_cents(c) > 0 or contributions(c) > 0)
                           FUNDED otherwise
    input_set: "Only POSTED outflow transactions in the same period as the category; only non-reversed contributions whose goal draws from this category."
    constants: {}
    precision: "integer cents, no rounding"

  - name: cash_flow_forecast
    trigger: "GET /households/{household_id}/cash-flow-forecast"
    algorithm: chronological
    formula: |
      Inputs: horizon_days (request, 1..90), Household.current cleared cash balance =
        sum(cleared_balance_cents(a) for a in accounts if a.status==LINKED and account_type==DEPOSITORY).
      Walk days d = clock_today+1 .. clock_today+horizon_days in chronological order:
        running = cash_balance
        for each day d:
          for each RecurringBill b with status==SCHEDULED whose day_of_month == day_of_month(d):
            running -= b.amount_cents
          record point {date: d, projected_balance_cents: running}
        Bills due on the SAME day are applied in ascending (day_of_month, created_at ASC) order
        (created_at tie-break; never id).
      min_projected_balance_cents = min(projected_balance_cents over all points)
      shortfall = min_projected_balance_cents < 0
    input_set: "Only SCHEDULED bills (PAUSED excluded). DEPOSITORY accounts only for starting cash. Clock from /_clock."
    precision: "integer cents, no rounding"
    variants:
      - name: optimistic
        when: "include_pending == false (default) — start from cleared DEPOSITORY balance"
        difference: "Starting cash uses cleared_balance_cents (POSTED only)."
      - name: conservative
        when: "include_pending == true — start from available DEPOSITORY balance"
        difference: "Starting cash uses available_balance_cents (POSTED+PENDING); a pending outflow lowers the starting point and can flip shortfall true that the optimistic variant reports false."

  - name: auto_categorize
    trigger: "transaction post when budget_category_id is null"
    algorithm: selector_policy
    formula: |
      candidates = [ r for r in CategoryRule
                       if r.household_id == txn.household_id
                       and r.enabled == true
                       and r.match_substring (case-insensitive) in lower(txn.merchant_name) ]
      eligibility: enabled == true AND case-insensitive substring match on merchant_name
      ranking:     priority ASC (lower number wins)
      tie_break:   created_at ASC (earliest rule wins); never id
      empty_pool:  leave budget_category_id null (transaction posts uncategorized, no envelope impact)
      The winning rule's budget_category_id is assigned ONLY IF that category belongs to
      Household.current_period_id; otherwise leave uncategorized (rule references a stale period).
    input_set: "Enabled CategoryRules in the household; substring match; lowest priority number, earliest created_at."
    precision: "n/a"

  - name: goal_funding
    trigger: "goal-contribute, contribution-reversal, target raise"
    algorithm: threshold
    formula: |
      funded_cents(g) = sum(gc.amount_cents for gc in g.contributions if gc.reversed == false)
      On contribution: if funded_cents >= target_cents -> Goal.status = FUNDED (boundary: == funds it, < does not).
      On target raise to T': if T' > funded_cents -> reopen to ACTIVE.
      A contribution is rejected if funding_category.available_cents < amount_cents BEFORE the
      contribution (ERR_INSUFFICIENT_ENVELOPE) — the envelope must cover it.
    input_set: "Non-reversed contributions to the goal."
    constants: {}
    precision: "integer cents, no rounding; threshold is >= (exactly target funds the goal)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7; entity_backed roles must act within their own household"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right (household, then account, then transaction, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Referenced foreign keys in body exist and belong to the same household (account_id, budget_category_id, funding_category_id, goal_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "create/recategorize/contribute endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: state
    check: "Parent Account must be LINKED for transaction create/post"
    error_id: ERR_ACCOUNT_ARCHIVED
    http_status: 409
    applies_to: "transaction create, transaction post"

  - priority: 7
    category: business_safety
    check: "Household.posture must not be FROZEN for any spend-affecting write (create txn, post, recategorize, allocate, goal-contribute)"
    error_id: ERR_HOUSEHOLD_FROZEN
    http_status: 409
    applies_to: "transaction create/post/recategorize, category allocate, goal-contribute"

  - priority: 8
    category: business_referential
    check: "Recategorize target category and contribution funding category must belong to the household's current OPEN period"
    error_id: ERR_CATEGORY_PERIOD_MISMATCH
    http_status: 409
    applies_to: "transaction recategorize"

  - priority: 9
    category: business_temporal
    check: "Account being archived must have zero PENDING transactions"
    error_id: ERR_PENDING_TRANSACTIONS_EXIST
    http_status: 409
    applies_to: "account archive"

  - priority: 10
    category: business_constraint
    check: "BudgetCategory.name unique within its period; BudgetPeriod.month unique within household; only one OPEN period per household"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "category create, period create"

  - priority: 10b
    category: business_temporal
    check: |
      A new SCHEDULED RecurringBill collides with an existing SCHEDULED bill if it occupies the same
      monthly due-day slot for the same payee: rejected when an existing SCHEDULED bill in the household
      has the SAME payee AND a day_of_month within the recurrence buffer of +/-2 days (cyclically clamped
      to 1..28) of the new bill's day_of_month. PAUSED bills do not occupy a slot. Interval semantics:
      recurring monthly day-slot with a +/-2-day adjacency buffer (distinct from BudgetPeriod's exact
      single-month point occupancy).
    error_id: ERR_BILL_SLOT_CONFLICT
    http_status: 409
    applies_to: "recurring-bill create, recurring-bill resume"

  - priority: 11
    category: business_fiscal
    check: "Goal contribution amount must not exceed funding_category.available_cents at contribution time"
    error_id: ERR_INSUFFICIENT_ENVELOPE
    http_status: 422
    applies_to: "goal-contribute"

  - priority: 12
    category: business_fiscal
    check: "Period close requires total_allocated_cents == income_expected_cents (zero-based)"
    error_id: ERR_BUDGET_NOT_ZERO_BASED
    http_status: 422
    applies_to: "period close"

  - priority: 13
    category: concurrency
    check: "expected_household_version must equal Household.version on period close (OCC)"
    error_id: ERR_STALE_HOUSEHOLD
    http_status: 412
    applies_to: "period close"

  - priority: 14
    category: business_constraint
    check: "Goal target_cents must be > 0; on raise must exceed current funded_cents"
    error_id: ERR_GOAL_TARGET_BELOW_FUNDED
    http_status: 422
    applies_to: "goal create, goal patch"

  - priority: 15
    category: validation
    check: "Required body fields present and well-typed (amount_cents integer, day_of_month 1..28, enum members valid, target_cents>0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all create/patch

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock used by cash_flow_forecast and period dating. Server startup default is 2026-01-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advances to the given instant"]

  # --- Household ---
  - method: POST
    path: "/households"
    description: "Create a household and its founding OWNER member"
    roles: [PlatformAdmin]
    code: 201
    input: [name, owner_email, owner_display_name, "base_currency?"]
    output: Household
    side_effects:
      - "creates Household (posture=HEALTHY, net_worth_cents=0)"
      - "creates the OWNER Member; sets owner_member_id"

  - method: GET
    path: "/households/{household_id}"
    description: "Get a household with computed posture and net worth"
    roles: [HouseholdOwner, HouseholdMember, PlatformAdmin]
    code: 200
    input: []
    output: Household
    side_effects: []

  - method: POST
    path: "/households/{household_id}/freeze"
    description: "Owner freezes the household ledger (blocks spend-affecting writes)"
    roles: [HouseholdOwner]
    code: 200
    input: []
    output: Household
    side_effects: ["frozen_by_owner=true", "posture recomputed -> FROZEN"]

  - method: POST
    path: "/households/{household_id}/unfreeze"
    description: "Owner unfreezes the household ledger"
    roles: [HouseholdOwner]
    code: 200
    input: []
    output: Household
    side_effects: ["frozen_by_owner=false", "posture recomputed (OVERSPENT if any category OVER else HEALTHY)"]

  - method: GET
    path: "/households/{household_id}/cash-flow-forecast"
    description: "Cash-flow forecast over a horizon (computed read, cash_flow_forecast)"
    roles: [HouseholdOwner, HouseholdMember]
    code: 200
    input: [horizon_days, "include_pending?"]
    output: "{ points: object[], min_projected_balance_cents: integer, shortfall: boolean }"
    side_effects: []

  # --- Member (flat-prefixed GETs for reverse-reachability) ---
  - method: POST
    path: "/households/{household_id}/members"
    description: "Owner invites a MEMBER into the household"
    roles: [HouseholdOwner]
    code: 201
    input: [email, display_name]
    output: Member
    side_effects: ["creates Member with role=MEMBER"]

  - method: GET
    path: "/households/members/{id}"
    description: "Get a member"
    roles: [HouseholdOwner, HouseholdMember, PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/households/members"
    description: "List members, filterable by household (reverse-reachability for Member.household_id)"
    roles: [HouseholdOwner, HouseholdMember, PlatformAdmin]
    code: 200
    input: ["household_id?"]
    output: Member[]
    side_effects: []

  # --- Account ---
  - method: POST
    path: "/households/{household_id}/accounts"
    description: "Link a Plaid account to the household"
    roles: [HouseholdOwner, PlatformAdmin]
    code: 201
    input: [institution_name, account_type, "opening_balance_cents?"]
    output: Account
    side_effects: ["creates Account status=LINKED", "recompute net_worth"]

  - method: GET
    path: "/households/accounts/{id}"
    description: "Get an account with computed balances"
    roles: [HouseholdOwner, HouseholdMember, PlatformAdmin]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: GET
    path: "/households/accounts"
    description: "List accounts, filterable by household and status (reverse-reachability for Account.household_id)"
    roles: [HouseholdOwner, HouseholdMember, PlatformAdmin]
    code: 200
    input: ["household_id?", "status?"]
    output: Account[]
    side_effects: []

  - method: POST
    path: "/households/{household_id}/accounts/{id}/archive"
    description: "Archive (soft-deactivate) an account"
    roles: [HouseholdOwner]
    code: 200
    input: []
    output: Account
    side_effects: ["status=ARCHIVED", "recompute net_worth"]

  # --- Transaction ---
  - method: POST
    path: "/accounts/{account_id}/transactions"
    description: "Ingest a transaction (Plaid sync) in PENDING state"
    roles: [PlatformAdmin]
    code: 201
    input: [amount_cents, merchant_name, "budget_category_id?"]
    output: Transaction
    side_effects: ["creates Transaction status=PENDING", "recompute Account.available_balance_cents and Household.projected_net_worth_cents"]

  - method: GET
    path: "/households/transactions/{id}"
    description: "Get a transaction"
    roles: [HouseholdOwner, HouseholdMember, PlatformAdmin]
    code: 200
    input: []
    output: Transaction
    side_effects: []

  - method: GET
    path: "/households/transactions"
    description: "List transactions, filterable by account, status, category, posted period (reverse-reachability for Transaction.account_id / budget_category_id / posted_period_id)"
    roles: [HouseholdOwner, HouseholdMember, PlatformAdmin]
    code: 200
    input: ["account_id?", "status?", "budget_category_id?", "posted_period_id?"]
    output: Transaction[]
    side_effects: []

  - method: POST
    path: "/accounts/{account_id}/transactions/{id}/post"
    description: "Post a PENDING transaction (clears it); runs auto-categorization and envelope/posture cascade"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Transaction
    side_effects:
      - "status PENDING->POSTED"
      - "auto_categorize if uncategorized"
      - "envelope_accounting, account_balance, net_worth_rollup, posture cascade"

  - method: POST
    path: "/accounts/{account_id}/transactions/{id}/recategorize"
    description: "Reassign a POSTED transaction to a different category"
    roles: [HouseholdOwner, HouseholdMember]
    code: 200
    input: [budget_category_id]
    output: Transaction
    side_effects:
      - "old and new envelope recompute"
      - "posture cascade"

  - method: POST
    path: "/accounts/{account_id}/transactions/{id}/remove"
    description: "Remove a transaction (Plaid deleted it)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Transaction
    side_effects:
      - "status->REMOVED"
      - "envelope (if categorized), account_balance, net_worth, posture recompute"

  # --- CategoryRule ---
  - method: POST
    path: "/households/{household_id}/category-rules"
    description: "Create an auto-categorization rule"
    roles: [HouseholdOwner, HouseholdMember]
    code: 201
    input: [match_substring, budget_category_id, priority, "enabled?"]
    output: CategoryRule
    side_effects: ["creates CategoryRule"]

  - method: GET
    path: "/households/category-rules/{id}"
    description: "Get a category rule"
    roles: [HouseholdOwner, HouseholdMember]
    code: 200
    input: []
    output: CategoryRule
    side_effects: []

  - method: GET
    path: "/households/category-rules"
    description: "List category rules, filterable by household and target category (reverse-reachability for CategoryRule.household_id / budget_category_id)"
    roles: [HouseholdOwner, HouseholdMember]
    code: 200
    input: ["household_id?", "budget_category_id?"]
    output: CategoryRule[]
    side_effects: []

  # --- BudgetPeriod ---
  - method: POST
    path: "/households/{household_id}/budget-periods"
    description: "Open the first/next budget period for a household"
    roles: [HouseholdOwner]
    code: 201
    input: [month, "income_expected_cents?"]
    output: BudgetPeriod
    side_effects: ["creates OPEN BudgetPeriod", "if no current period, sets Household.current_period_id and bumps Household.version"]

  - method: GET
    path: "/households/budget-periods/{id}"
    description: "Get a budget period"
    roles: [HouseholdOwner, HouseholdMember, PlatformAdmin]
    code: 200
    input: []
    output: BudgetPeriod
    side_effects: []

  - method: GET
    path: "/households/budget-periods"
    description: "List budget periods, filterable by household and status (reverse-reachability for BudgetPeriod.household_id)"
    roles: [HouseholdOwner, HouseholdMember, PlatformAdmin]
    code: 200
    input: ["household_id?", "status?"]
    output: BudgetPeriod[]
    side_effects: []

  - method: PATCH
    path: "/households/{household_id}/budget-periods/{id}"
    description: "Update planned income for an OPEN period"
    roles: [HouseholdOwner]
    code: 200
    input: [income_expected_cents]
    output: BudgetPeriod
    side_effects: ["income_expected_cents updated"]

  - method: POST
    path: "/households/{household_id}/budget-periods/{id}/close"
    description: "Close the current period (zero-based + OCC); opens next period and rolls leftover envelopes"
    roles: [HouseholdOwner]
    code: 200
    input: [expected_household_version]
    output: BudgetPeriod
    side_effects:
      - "status->CLOSED; new OPEN period minted; Household.current_period_id updated; Household.version increments by 1"
      - "rollover_carry for rollover-enabled categories with positive available_cents"
      - "posture recomputed against new period"

  # --- BudgetCategory ---
  - method: POST
    path: "/households/{household_id}/budget-periods/{period_id}/categories"
    description: "Create an envelope/category in a period"
    roles: [HouseholdOwner, HouseholdMember]
    code: 201
    input: [name, "allocated_cents?", "rollover_enabled?"]
    output: BudgetCategory
    side_effects: ["creates BudgetCategory", "recompute period.total_allocated_cents"]

  - method: GET
    path: "/households/budget-categories/{id}"
    description: "Get a category with computed spent/available/envelope_state"
    roles: [HouseholdOwner, HouseholdMember, PlatformAdmin]
    code: 200
    input: []
    output: BudgetCategory
    side_effects: []

  - method: GET
    path: "/households/budget-categories"
    description: "List categories, filterable by household, period, envelope_state (reverse-reachability for BudgetCategory.household_id / budget_period_id)"
    roles: [HouseholdOwner, HouseholdMember, PlatformAdmin]
    code: 200
    input: ["household_id?", "budget_period_id?", "envelope_state?"]
    output: BudgetCategory[]
    side_effects: []

  - method: POST
    path: "/households/{household_id}/budget-categories/{id}/allocate"
    description: "Set/adjust an envelope's allocated_cents (zero-based allocation)"
    roles: [HouseholdOwner, HouseholdMember]
    code: 200
    input: [allocated_cents]
    output: BudgetCategory
    side_effects: ["allocated_cents set", "recompute available_cents/envelope_state, period.total_allocated_cents, posture"]

  # --- Goal ---
  - method: POST
    path: "/households/{household_id}/goals"
    description: "Create a goal / sinking fund"
    roles: [HouseholdOwner]
    code: 201
    input: [name, target_cents, funding_category_id]
    output: Goal
    side_effects: ["creates Goal status=ACTIVE, funded_cents=0"]

  - method: GET
    path: "/households/goals/{id}"
    description: "Get a goal with computed funded_cents"
    roles: [HouseholdOwner, HouseholdMember, PlatformAdmin]
    code: 200
    input: []
    output: Goal
    side_effects: []

  - method: GET
    path: "/households/goals"
    description: "List goals, filterable by household, status, funding category (reverse-reachability for Goal.household_id / funding_category_id)"
    roles: [HouseholdOwner, HouseholdMember, PlatformAdmin]
    code: 200
    input: ["household_id?", "status?", "funding_category_id?"]
    output: Goal[]
    side_effects: []

  - method: PATCH
    path: "/households/{household_id}/goals/{id}"
    description: "Update a goal's target (raising above funded reopens FUNDED->ACTIVE)"
    roles: [HouseholdOwner]
    code: 200
    input: [target_cents]
    output: Goal
    side_effects: ["target_cents updated", "goal_funding re-evaluated; may reopen to ACTIVE"]

  - method: POST
    path: "/households/{household_id}/goals/{id}/contribute"
    description: "Contribute to a goal from its funding envelope"
    roles: [HouseholdOwner, HouseholdMember]
    code: 201
    input: [amount_cents]
    output: GoalContribution
    side_effects:
      - "creates GoalContribution"
      - "funding envelope available_cents decreases (envelope_accounting)"
      - "goal_funding re-evaluated; may transition to FUNDED"

  - method: POST
    path: "/households/{household_id}/goals/{id}/abandon"
    description: "Abandon a goal; reverses all contributions back to the funding envelope"
    roles: [HouseholdOwner]
    code: 200
    input: []
    output: Goal
    side_effects:
      - "status->ABANDONED"
      - "contribution_reversal: all non-reversed contributions reversed, amounts credited back to funding envelope"
      - "recompute envelope available/state and posture"

  - method: GET
    path: "/households/goal-contributions/{id}"
    description: "Get a goal contribution"
    roles: [HouseholdOwner, HouseholdMember, PlatformAdmin]
    code: 200
    input: []
    output: GoalContribution
    side_effects: []

  - method: GET
    path: "/households/goal-contributions"
    description: "List goal contributions, filterable by goal (reverse-reachability for GoalContribution.goal_id)"
    roles: [HouseholdOwner, HouseholdMember, PlatformAdmin]
    code: 200
    input: ["goal_id?"]
    output: GoalContribution[]
    side_effects: []

  # --- RecurringBill ---
  - method: POST
    path: "/households/{household_id}/recurring-bills"
    description: "Create a recurring bill"
    roles: [HouseholdOwner, HouseholdMember]
    code: 201
    input: [payee, amount_cents, day_of_month, funding_category_id]
    output: RecurringBill
    side_effects: ["creates RecurringBill status=SCHEDULED"]

  - method: GET
    path: "/households/recurring-bills/{id}"
    description: "Get a recurring bill"
    roles: [HouseholdOwner, HouseholdMember, PlatformAdmin]
    code: 200
    input: []
    output: RecurringBill
    side_effects: []

  - method: GET
    path: "/households/recurring-bills"
    description: "List recurring bills, filterable by household, status, funding category (reverse-reachability for RecurringBill.household_id / funding_category_id)"
    roles: [HouseholdOwner, HouseholdMember, PlatformAdmin]
    code: 200
    input: ["household_id?", "status?", "funding_category_id?"]
    output: RecurringBill[]
    side_effects: []

  - method: POST
    path: "/households/{household_id}/recurring-bills/{id}/pause"
    description: "Pause a recurring bill (excludes from forecast)"
    roles: [HouseholdOwner, HouseholdMember]
    code: 200
    input: []
    output: RecurringBill
    side_effects: ["status->PAUSED"]

  - method: POST
    path: "/households/{household_id}/recurring-bills/{id}/resume"
    description: "Resume a paused recurring bill"
    roles: [HouseholdOwner, HouseholdMember]
    code: 200
    input: []
    output: RecurringBill
    side_effects: ["status->SCHEDULED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, bad type, or out-of-domain value (e.g. day_of_month outside 1..28, target_cents<=0)"
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header missing or unrecognized"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for the operation, or entity_backed user acting outside their own household"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A resource named in the path does not exist"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "A foreign-key referenced in the body does not exist or belongs to another household"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state (e.g. post an already POSTED txn, close a non-current period)"
  - id: ERR_ACCOUNT_ARCHIVED
    http: 409
    condition: "Transaction create/post attempted on an ARCHIVED account"
  - id: ERR_HOUSEHOLD_FROZEN
    http: 409
    condition: "Spend-affecting write attempted while Household.posture == FROZEN"
  - id: ERR_CATEGORY_PERIOD_MISMATCH
    http: 409
    condition: "Recategorize/contribute target category does not belong to the household's current OPEN period"
  - id: ERR_PENDING_TRANSACTIONS_EXIST
    http: 409
    condition: "Account archive attempted while the account still has PENDING transactions"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "Category name duplicate within a period, duplicate period month, or a second OPEN period for the household"
  - id: ERR_INSUFFICIENT_ENVELOPE
    http: 422
    condition: "Goal contribution exceeds the funding envelope's available_cents at contribution time"
  - id: ERR_BUDGET_NOT_ZERO_BASED
    http: 422
    condition: "Period close attempted while total_allocated_cents != income_expected_cents"
  - id: ERR_STALE_HOUSEHOLD
    http: 412
    condition: "expected_household_version does not match Household.version on period close (OCC)"
  - id: ERR_GOAL_TARGET_BELOW_FUNDED
    http: 422
    condition: "Goal target_cents not > 0 on create, or raise target not strictly above current funded_cents"
  - id: ERR_BILL_SLOT_CONFLICT
    http: 409
    condition: "A new/resumed SCHEDULED RecurringBill collides with an existing SCHEDULED bill of the same payee within the +/-2-day monthly due-day buffer"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HouseholdOwner
    description: "Owning member of a household — full control over accounts, periods, goals, freeze"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /households/{id}/freeze — freeze ledger"
      - "POST /households/{id}/unfreeze — unfreeze ledger"
      - "POST /households/{id}/members — invite member"
      - "POST /households/{id}/accounts/{id}/archive — archive account"
      - "POST /households/{id}/budget-periods — open period"
      - "PATCH /households/{id}/budget-periods/{id} — set income"
      - "POST /households/{id}/budget-periods/{id}/close — close period"
      - "POST /households/{id}/goals — create goal"
      - "PATCH /households/{id}/goals/{id} — raise target"
      - "POST /households/{id}/goals/{id}/abandon — abandon goal"
    shared_operations:
      - "GET household/account/transaction/category/goal/period reads"
      - "POST .../accounts — link account (shared with PlatformAdmin)"
      - "POST .../transactions/{id}/recategorize — recategorize (shared with HouseholdMember)"
      - "POST .../category-rules — create rule (shared with HouseholdMember)"
      - "POST .../budget-categories/{id}/allocate — allocate (shared with HouseholdMember)"
      - "POST .../goals/{id}/contribute — contribute (shared with HouseholdMember)"
      - "POST .../recurring-bills + pause/resume (shared with HouseholdMember)"
      - "POST .../budget-periods/{period_id}/categories — create category (shared with HouseholdMember)"

  - name: HouseholdMember
    description: "Non-owner member — can spend, categorize, allocate, contribute within their household"
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "GET household/account/transaction/category/goal/period reads"
      - "POST .../transactions/{id}/recategorize"
      - "POST .../category-rules"
      - "POST .../budget-periods/{period_id}/categories"
      - "POST .../budget-categories/{id}/allocate"
      - "POST .../goals/{id}/contribute"
      - "POST .../recurring-bills + pause/resume"
      - "GET .../cash-flow-forecast"

  - name: PlatformAdmin
    description: "Operational role running Plaid aggregation sync (ingest/post/remove transactions) and provisioning households"
    identity: "opaque"
    exclusive_operations:
      - "POST /households — create household"
      - "POST /accounts/{account_id}/transactions — ingest transaction"
      - "POST /accounts/{account_id}/transactions/{id}/post — post transaction"
      - "POST /accounts/{account_id}/transactions/{id}/remove — remove transaction"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "GET reads"
      - "POST /households/{id}/accounts — link account (shared with HouseholdOwner)"
