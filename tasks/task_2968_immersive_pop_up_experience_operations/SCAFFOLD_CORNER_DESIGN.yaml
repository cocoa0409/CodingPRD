            - "trigger 2 responds 200 with outcome == PASS and allowed_occupancy_cap == 177 (floor(360 / 2.03)): 360 is exactly the 90% floor and the comparison is strict less-than, so the edge passes"
            - "trigger 3 responds 200 with outcome == FAIL and allowed_occupancy_cap == 197: branch 2 fires on CRITICAL regardless of the single finding and the compliant 400 cm width"
            - "trigger 4 responds 200 with outcome == CONDITIONAL: branch 3 with findings_count 5 == FINDINGS_MAJOR_MAX, and > is strict, so the edge is CONDITIONAL rather than FAIL"
            - "trigger 5 responds 200 with outcome == FAIL: the same branch one finding higher"
            - "trigger 6 responds 200 with outcome == CONDITIONAL and allowed_occupancy_cap == 98 (floor(200 / 2.03)): branch 4 with findings_count 3 > FINDINGS_PASS_MAX 2. The 200 cm width does NOT trip branch 1 because the inspection_type is SENSORY, not EGRESS"
            - "trigger 7 responds 200 with outcome == PASS: branch 4 with findings_count 2 == FINDINGS_PASS_MAX is the PASS side of the edge, and findings_note may be omitted precisely because the outcome is PASS"
            - "trigger 8 responds 200 with outcome == PASS and allowed_occupancy_cap == 197: branch 5, and the cap is still written on the PASS branch"
            - "trigger 9 reports effective_capacity_cap == 98 and effective_capacity == 98 — the last CONDITIONAL (trigger 6) is the only probe that copied its cap into the run, and the two later PASS results left both figures alone"
            - "trigger 9 reports clearance_status == SUSPENDED with suspending_inspection_id == ${p5}, the last FAIL, confirming that PASS and CONDITIONAL results do not clear a suspension"

