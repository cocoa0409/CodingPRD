            - { call: "POST /aog/inventory-units", payload: { part_id: "${p1}", serial_number: "SN-SR-OLD", condition: "OVERHAULED", trace_doc_level: "DUAL_RELEASE", warehouse_code: "WH-1" }, as: WarehouseOperator, captures: { u_old: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${p1}", serial_number: "SN-SR-NEW", condition: "OVERHAULED", trace_doc_level: "DUAL_RELEASE", warehouse_code: "WH-1" }, as: WarehouseOperator, captures: { u_new: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${p1}", serial_number: "SN-SR-COND", condition: "AS_REMOVED", trace_doc_level: "DUAL_RELEASE", warehouse_code: "WH-1" }, as: WarehouseOperator }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${p1}", serial_number: "SN-SR-TRACE", condition: "OVERHAULED", trace_doc_level: "TEARDOWN_REPORT", warehouse_code: "WH-1" }, as: WarehouseOperator }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N6SR", airport_code: "LAX", part_id: "${p1}", quantity: 1, condition_acceptable: ["OVERHAULED"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog: $.data.id } }
          trigger:
            - { call: "POST /aog/aog-requests/${aog}/source-search", payload: {}, as: AogDeskAgent, captures: { picked: $.data.reserved_unit_id, pool: $.data.last_search_candidate_count } }
            - { call: "GET /aog/inventory-units/${u_new}", payload: {}, as: AogDeskAgent, captures: { new_st: $.data.status } }
          assert:
            - "reserved_unit_id == ${u_old} (oldest created_at among eligibles — FIFO, never UUID ordering)"
            - "last_search_candidate_count == 2 (AS_REMOVED and TEARDOWN_REPORT units excluded)"
            - "InventoryUnit.${u_old}.status == RESERVED with reserved_by_request_id == ${aog}; ${u_new} remains AVAILABLE"

      - name: sourcing_empty_pool_fallback
        claim_type: correct_result
        grounds: [calculations.sourcing_rank, "errors[ERR_NO_SOURCE_AVAILABLE]"]
        distinguishing_aspect: "Empty eligible pool: the selector's fallback is the 422 error, the request stays OPEN, and reserved_unit_id remains null — no partial reservation is left behind."
        test_recipe:
          setup: ["part PN-EP with zero units; OPEN request"]
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "EmptyAir", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-EP", description: "x", rotable: false, list_price_cents: 100000 }, as: WarehouseOperator, captures: { p1: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N6EP", airport_code: "LAX", part_id: "${p1}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog: $.data.id } }
          trigger:
            - { call: "POST /aog/aog-requests/${aog}/source-search", payload: {}, as: AogDeskAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NO_SOURCE_AVAILABLE, HTTP 422"
            - "AogRequest.status == OPEN and reserved_unit_id == null and last_search_candidate_count == 0 on read-back"

      - name: charter_flat_floor_binds
        claim_type: constants_applied
        grounds: [calculations.freight_cost]
        distinguishing_aspect: "CHARTER pricing ignores weight and uses max(CHARTER_MIN, 2900*km): at 100km the per-km term 290000 loses to the 750000 floor; non-hazmat, non-escalated so no surcharges apply."
        test_recipe:
          setup: ["customer + part + request escalated=false"]
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "FloorAir", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-CF", description: "x", rotable: false, list_price_cents: 100000 }, as: WarehouseOperator, captures: { p1: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N3CF", airport_code: "LAX", part_id: "${p1}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog: $.data.id } }
          trigger:
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog}", customer_id: "${cust_id}", lines: [ { part_id: "${p1}", quantity: 1, sale_type: "OUTRIGHT", unit_price_cents: 100000, discount_pct: 0, condition_required: "NEW" } ], validity_hours: 24, freight_mode: "CHARTER", distance_km: 100, chargeable_weight_kg: 500, destination_country: "US" }, as: AogDeskAgent, captures: { q1: $.data.id, fr: $.data.freight_cost_cents } }
          assert:
            - "Quote.freight_cost_cents == 750000 (floor binds: 2900*100 = 290000 < 750000; weight 500kg is irrelevant in CHARTER mode)"

  - section: validations
    instances:
      - name: auth_header_missing_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Requests without X-User-Role/X-User-ID are rejected 401 before any role, existence, or state check runs."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /aog/customers", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED, HTTP 401"

      - name: role_not_permitted_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "WarehouseOperator may not create quotes (AogDeskAgent-exclusive); the role check fires before body validation."
        test_recipe:
          setup: ["none needed"]
          setup_api_calls: []
          trigger:
            - { call: "POST /aog/quotes", payload: {}, as: WarehouseOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403"

      - name: authz_beats_existence_on_path
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]"]
        distinguishing_aspect: "A WarrantyApprover calling suspend on a NON-EXISTENT customer gets ERR_FORBIDDEN (priority 2), not ERR_CUSTOMER_NOT_FOUND (priority 3) — role authorization precedes path existence."
        test_recipe:
          setup: ["none needed"]
          setup_api_calls: []
          trigger:
            - { call: "POST /aog/customers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/suspend", payload: {}, as: WarrantyApprover, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403 (never reaches existence)"

      - name: needed_by_in_past_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_NEEDED_BY_IN_PAST]"]
        distinguishing_aspect: "needed_by_utc must be strictly after the current clock; a past timestamp is 422 and no request row is persisted."
        test_recipe:
          setup: ["customer + part exist; clock default 2026-05-01"]
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "PastAir", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-NP", description: "x", rotable: false, list_price_cents: 1000 }, as: WarehouseOperator, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N9NP", airport_code: "LAX", part_id: "${p1}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-04-30T23:59:59Z" }, as: AogDeskAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NEEDED_BY_IN_PAST, HTTP 422"

      - name: validity_cap_enforced_per_tier
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_VALIDITY_EXCEEDS_TIER_CAP]"]
        distinguishing_aspect: "Issue-time cap is read from the tier in effect: STANDARD caps at 24h, so validity_hours 48 fails at issue; validity_hours 24 succeeds — the same quote cannot be issued until revised within cap."
        test_recipe:
          setup: ["STANDARD customer; DRAFT quote with validity_hours 48"]
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "CapAir", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-VC", description: "x", rotable: false, list_price_cents: 10000 }, as: WarehouseOperator, captures: { p1: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N9VC", airport_code: "LAX", part_id: "${p1}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog: $.data.id } }
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog}", customer_id: "${cust_id}", lines: [ { part_id: "${p1}", quantity: 1, sale_type: "OUTRIGHT", unit_price_cents: 10000, discount_pct: 0, condition_required: "NEW" } ], validity_hours: 48, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "US" }, as: AogDeskAgent, captures: { q1: $.data.id } }
          trigger:
            - { call: "POST /aog/quotes/${q1}/issue", payload: {}, as: AogDeskAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDITY_EXCEEDS_TIER_CAP, HTTP 422; quote remains DRAFT"

      - name: duplicate_active_quote_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_ACTIVE_QUOTE]"]
        distinguishing_aspect: "One AOG request carries at most one DRAFT-or-ISSUED quote; a second create is 409 until the first is CANCELLED (terminal quotes do not block)."
        test_recipe:
          setup: ["request with one DRAFT quote"]
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "DupQAir", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-DQ", description: "x", rotable: false, list_price_cents: 10000 }, as: WarehouseOperator, captures: { p1: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N9DQ", airport_code: "LAX", part_id: "${p1}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog: $.data.id } }
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog}", customer_id: "${cust_id}", lines: [ { part_id: "${p1}", quantity: 1, sale_type: "OUTRIGHT", unit_price_cents: 10000, discount_pct: 0, condition_required: "NEW" } ], validity_hours: 24, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "US" }, as: AogDeskAgent, captures: { q1: $.data.id } }
          trigger:
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog}", customer_id: "${cust_id}", lines: [ { part_id: "${p1}", quantity: 1, sale_type: "OUTRIGHT", unit_price_cents: 10000, discount_pct: 0, condition_required: "NEW" } ], validity_hours: 24, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "US" }, as: AogDeskAgent, captures: { err: $.data.error_id } }
            - { call: "POST /aog/quotes/${q1}/cancel", payload: {}, as: AogDeskAgent }
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog}", customer_id: "${cust_id}", lines: [ { part_id: "${p1}", quantity: 1, sale_type: "OUTRIGHT", unit_price_cents: 10000, discount_pct: 0, condition_required: "NEW" } ], validity_hours: 24, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "US" }, as: AogDeskAgent, captures: { q2: $.data.id } }
          assert:
            - "second create while first is DRAFT: error_id == ERR_DUPLICATE_ACTIVE_QUOTE, HTTP 409"
            - "after cancelling the first, a fresh create succeeds (201)"

      - name: hazmat_declaration_and_export_license_gates
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_HAZMAT_DECLARATION_MISSING]", "errors[ERR_EXPORT_LICENSE_REQUIRED]", "errors[ERR_EXPORT_DESTINATION_DENIED]"]
        distinguishing_aspect: "Safety gates at tender: missing hazmat declaration and missing export license are per-part-class 422s; a denied destination (KP) is rejected even when a license string is supplied — destination denial is checked first within priority 7."
        test_recipe:
          setup: ["allocated order for a CLASS_3 + EAR9X610 part; shipment in DRAFT without refs"]
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "HazAir", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-HZ", description: "x", rotable: false, list_price_cents: 50000, hazmat_class: "CLASS_3", export_control_code: "EAR9X610" }, as: WarehouseOperator, captures: { p1: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${p1}", serial_number: "SN-HZ1", condition: "NEW", trace_doc_level: "FAA_8130", warehouse_code: "WH-1" }, as: WarehouseOperator, captures: { u1: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N9HZ", airport_code: "LAX", part_id: "${p1}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog: $.data.id } }
            - { call: "POST /aog/aog-requests/${aog}/source-search", payload: {}, as: AogDeskAgent }
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog}", customer_id: "${cust_id}", lines: [ { part_id: "${p1}", quantity: 1, sale_type: "OUTRIGHT", unit_price_cents: 50000, discount_pct: 0, condition_required: "NEW" } ], validity_hours: 24, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "GB" }, as: AogDeskAgent, captures: { q1: $.data.id } }
            - { call: "POST /aog/quotes/${q1}/issue", payload: {}, as: AogDeskAgent, captures: { qv: $.data.version } }
            - { call: "POST /aog/quotes/${q1}/accept", payload: { expected_quote_version: "${qv}" }, as: CustomerContact, as_user_id: "${cust_id}" }
            - { call: "GET /aog/orders", payload: { quote_id: "${q1}" }, as: AogDeskAgent, captures: { ord: "$.data[0].id" } }
            - { call: "GET /aog/order-lines", payload: { order_id: "${ord}" }, as: AogDeskAgent, captures: { ln: "$.data[0].id" } }
            - { call: "POST /aog/order-lines/${ln}/allocate", payload: { unit_id: "${u1}" }, as: WarehouseOperator }
            - { call: "POST /aog/orders/${ord}/compliance-decision", payload: { decision: "CLEARED" }, as: ComplianceOfficer }
            - { call: "POST /aog/shipments", payload: { order_id: "${ord}" }, as: WarehouseOperator, captures: { sh: $.data.id } }
          trigger:
            - { call: "POST /aog/shipments/${sh}/tender", payload: {}, as: WarehouseOperator, captures: { err1: $.data.error_id } }
            - { call: "POST /aog/shipments/${sh}/tender", payload: { hazmat_declaration_ref: "DG-2026-001" }, as: WarehouseOperator, captures: { err2: $.data.error_id } }
            - { call: "POST /aog/shipments/${sh}/tender", payload: { hazmat_declaration_ref: "DG-2026-001", export_license_ref: "EXP-GB-777" }, as: WarehouseOperator, captures: { st3: $.data.status } }
          assert:
            - "tender with neither ref: error_id == ERR_HAZMAT_DECLARATION_MISSING (hazmat checked before export within priority 7)"
            - "tender with hazmat_declaration_ref only: error_id == ERR_EXPORT_LICENSE_REQUIRED"
            - "tender with both refs: succeeds, status TENDERED (then auto IN_TRANSIT)"

  - section: endpoints
    instances:
      - name: error_envelope_shape_on_400
        claim_type: standard_crud
        grounds: [response_envelope, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Every error body matches the fixed envelope: meta block present, response_type == 'error', data carries exactly error_id and message."
        test_recipe:
          setup: ["none"]
          setup_api_calls: []
          trigger:
            - { call: "POST /aog/customers", payload: { name: "BadEnum", country_code: "US", credit_limit_cents: -5 }, as: FinanceController, captures: { err: $.data.error_id, msg: $.data.message } }
          assert:
            - "HTTP 400; response_type == 'error'; data.error_id == ERR_INVALID_REQUEST; data.message is a non-empty string; meta.api_request_id present"

      - name: quote_create_rejects_extra_computed_field
        claim_type: standard_crud
        grounds: [entities.Quote.fields.subtotal_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Client-supplied computed fields (subtotal_cents, total_cents, status, expires_at) are not in the endpoint's input schema and are rejected with 400 rather than silently ignored."
        test_recipe:
          setup: ["customer + part + request exist"]
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "XtraAir", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-XF", description: "x", rotable: false, list_price_cents: 10000 }, as: WarehouseOperator, captures: { p1: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N9XF", airport_code: "LAX", part_id: "${p1}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog: $.data.id } }
          trigger:
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog}", customer_id: "${cust_id}", lines: [ { part_id: "${p1}", quantity: 1, sale_type: "OUTRIGHT", unit_price_cents: 10000, discount_pct: 0, condition_required: "NEW" } ], validity_hours: 24, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "US", subtotal_cents: 1 }, as: AogDeskAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400 (unknown field subtotal_cents)"

      - name: rma_rejected_before_delivery
        claim_type: conditional_action
        grounds: [entities.ReturnAuthorization, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A return can only be opened against a DELIVERED line: requesting one while the order is still pre-shipment is a 400, regardless of the 30-day window."
        test_recipe:
          setup: ["accepted order, line allocated, not yet shipped"]
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "EarlyRet", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-ER", description: "x", rotable: false, list_price_cents: 20000 }, as: WarehouseOperator, captures: { p1: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${p1}", serial_number: "SN-ER1", condition: "NEW", trace_doc_level: "FAA_8130", warehouse_code: "WH-1" }, as: WarehouseOperator, captures: { u1: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N9ER", airport_code: "LAX", part_id: "${p1}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog: $.data.id } }
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog}", customer_id: "${cust_id}", lines: [ { part_id: "${p1}", quantity: 1, sale_type: "OUTRIGHT", unit_price_cents: 20000, discount_pct: 0, condition_required: "NEW" } ], validity_hours: 24, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "US" }, as: AogDeskAgent, captures: { q1: $.data.id } }
            - { call: "POST /aog/quotes/${q1}/issue", payload: {}, as: AogDeskAgent, captures: { qv: $.data.version } }
            - { call: "POST /aog/quotes/${q1}/accept", payload: { expected_quote_version: "${qv}" }, as: CustomerContact, as_user_id: "${cust_id}" }
            - { call: "GET /aog/orders", payload: { quote_id: "${q1}" }, as: AogDeskAgent, captures: { ord: "$.data[0].id" } }
            - { call: "GET /aog/order-lines", payload: { order_id: "${ord}" }, as: AogDeskAgent, captures: { ln: "$.data[0].id" } }
          trigger:
            - { call: "POST /aog/return-authorizations", payload: { customer_id: "${cust_id}", order_line_id: "${ln}", reason: "too early" }, as: CustomerContact, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400 (delivered_at is null)"

      - name: release_after_ship_rejected
        claim_type: conditional_action
        grounds: [state_machines.InventoryUnit.ALLOCATED_to_AVAILABLE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Release is a compensating action only while the order is pre-shipment; once the shipment is tendered the line's unit is SHIPPED and release fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["order allocated and shipment tendered"]
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "LateRel", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-LR", description: "x", rotable: false, list_price_cents: 20000 }, as: WarehouseOperator, captures: { p1: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${p1}", serial_number: "SN-LR1", condition: "NEW", trace_doc_level: "FAA_8130", warehouse_code: "WH-1" }, as: WarehouseOperator, captures: { u1: $.data.id } }
