          The boundary metric here is slot_occupancy_overlap RULE A's overlap_count against
          max_concurrent_line_items = 2 under the strict `<` comparison, reached through POST
          /rmn/line-items/{id}/eligibility-decision: a candidate whose window overlaps exactly two
          occupying line items is refused with ERR_SLOT_CAPACITY_EXCEEDED, while a candidate whose
