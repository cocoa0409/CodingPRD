      - name: mini_bid_closed_window_conflict_cooldown_and_rolling_quota
        interval_semantics: "closed [window_open_at, window_close_at] — touching endpoints DO intersect, plus a 7-day cooldown measured from the last applied_at and a 90-day rolling quota"
