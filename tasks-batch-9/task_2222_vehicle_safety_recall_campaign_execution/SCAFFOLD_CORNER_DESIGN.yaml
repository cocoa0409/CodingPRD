  - section: errors
    instances:
      - name: unknown_affected_vehicle_id_returns_affected_vehicle_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_AFFECTED_VEHICLE_NOT_FOUND
          - validations.priority_5
        distinguishing_aspect: |
          A population row is addressed by its own id, not by a VIN, so an unknown AffectedVehicle id
          must raise its own 404 code rather than ERR_VEHICLE_NOT_FOUND.
        test_recipe:
          setup:
            - "The clock reads 2026-08-03T09:00:00Z; no AffectedVehicle row carries the probed id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
          trigger:
            - call: "GET /affected-vehicles/00000000-0000-4000-8000-000000000901"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "response.data.error_id == \"ERR_AFFECTED_VEHICLE_NOT_FOUND\""

      - name: unknown_wave_id_returns_wave_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_WAVE_NOT_FOUND
          - validations.priority_6
        distinguishing_aspect: |
          Existence of the wave is checked at priority 6, before the wave-state rule at priority 16, so
          releasing a wave that does not exist is a 404 and never a 409.
        test_recipe:
          setup:
            - "The clock reads 2026-08-03T09:00:00Z; no NotificationWave carries the probed id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
          trigger:
            - call: "POST /notification-waves/00000000-0000-4000-8000-000000000902/release"
              payload: {}
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "response.data.error_id == \"ERR_WAVE_NOT_FOUND\""

      - name: unknown_allocation_id_returns_allocation_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_ALLOCATION_NOT_FOUND
          - validations.priority_7
        distinguishing_aspect: |
          The allocation collection has its own existence code at priority 7, distinct from the wave code
          that guards the neighbouring /notification-waves/{id} paths.
        test_recipe:
          setup:
            - "The clock reads 2026-08-03T09:00:00Z; no PartsAllocation carries the probed id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
          trigger:
            - call: "GET /parts-allocations/00000000-0000-4000-8000-000000000903"
              payload: {}
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "response.data.error_id == \"ERR_ALLOCATION_NOT_FOUND\""

      - name: unknown_claim_id_returns_claim_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CLAIM_NOT_FOUND
          - validations.priority_8
        distinguishing_aspect: |
          Auditing a claim that does not exist is refused at priority 8, ahead of both the claim-state
          rule at priority 17 and the RBAC-independent business checks that follow.
        test_recipe:
          setup:
            - "The clock reads 2026-08-03T09:00:00Z; no RepairClaim carries the probed id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClaimsAuditor
              as_user_id: "u-aud-1"
          trigger:
            - call: "POST /repair-claims/00000000-0000-4000-8000-000000000904/audit"
              payload: { decision: "APPROVE" }
              as: ClaimsAuditor
              as_user_id: "u-aud-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "response.data.error_id == \"ERR_CLAIM_NOT_FOUND\""

      - name: unknown_reimbursement_id_returns_reimbursement_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_REIMBURSEMENT_NOT_FOUND
          - validations.priority_9
        distinguishing_aspect: |
          Adjudicating a reimbursement that does not exist yields the reimbursement-specific 404 rather
          than the reimbursement-state 409, proving the existence tier runs first on this path too.
        test_recipe:
          setup:
            - "The clock reads 2026-08-03T09:00:00Z; no OwnerReimbursementRequest carries the probed id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClaimsAuditor
              as_user_id: "u-aud-1"
          trigger:
            - call: "POST /owner-reimbursements/00000000-0000-4000-8000-000000000905/adjudicate"
              payload: { decision: "DENY", denial_reason: "Probe against a non-existent request" }
              as: ClaimsAuditor
              as_user_id: "u-aud-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "response.data.error_id == \"ERR_REIMBURSEMENT_NOT_FOUND\""

      - name: allocation_naming_an_unknown_dealer_returns_dealer_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DEALER_NOT_FOUND
          - validations.priority_11
        distinguishing_aspect: |
          The body carries a real RemedyPart with its current version and a dealer id that matches no
          row: priority 11 must resolve every body reference before the OCC comparison at priority 21,
          so the answer is a 404 on the dealer and not a 412 on the part version.
        test_recipe:
          setup:
            - "Campaign 26V-330 is FILED (determined by u-eng-1, defect notice filed by u-comp-1) and owns part P-88330 with 100 units."
            - "No Dealer row carries the probed id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-330", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { camp_id: $.data.id }
            - call: "POST /recall-campaigns/${camp_id}/defect-determination"
              payload: { defect_determination_date: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns/${camp_id}/filings"
              payload: { filing_type: "DEFECT_NOTICE", narrative: "Part 573 defect information report for 26V-330" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "POST /recall-campaigns/${camp_id}/remedy-parts"
              payload: { part_number: "P-88330", unit_cost: 21.90, total_procured_qty: 100 }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { part_id: $.data.id, part_v: $.data.version }
          trigger:
            - call: "POST /parts-allocations"
              payload: { remedy_part_id: "${part_id}", dealer_id: "00000000-0000-4000-8000-000000000906", requested_qty: 2, expected_part_version: "${part_v}" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "response.data.error_id == \"ERR_DEALER_NOT_FOUND\""
            - "GET /recall-campaigns/${camp_id}/remedy-parts with part_number == \"P-88330\" still shows unallocated_qty == 100"

      - name: allocation_naming_an_unknown_part_returns_part_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PART_NOT_FOUND
          - validations.priority_11
        distinguishing_aspect: |
          The mirror image of the dealer probe: a real ACTIVE dealer with a syntactically valid but
          unknown remedy_part_id yields the part-specific 404, which keeps the two body references of
          POST /parts-allocations independently diagnosable.
        test_recipe:
          setup:
            - "Campaign 26V-331 is FILED and owns part P-88331 with 100 units (used only to obtain a real version token)."
