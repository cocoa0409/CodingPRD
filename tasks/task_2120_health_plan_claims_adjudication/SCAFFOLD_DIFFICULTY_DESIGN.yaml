              captures: { cov_id: $.data.id }
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-XENT-1", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id, c_cov: $.data.coverage_id }
          trigger:
            - call: "POST /adjudication/claims/${c_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
          assert:
            - "${c_cov} == null (the half-open interval [2026-01-01, 2026-02-01) excludes 2026-02-10)"
            - "Claim.${c_id}.status == DENIED"
            - "Claim.${c_id}.deny_reason_code == DENY_NO_COVERAGE"
            - "Claim.${c_id}.total_allowed_cents == 0 and total_plan_paid_cents == 0"
            - "MemberCoverage.${cov_id}.status == ACTIVE (the coverage row was never terminated; only its date range matters)"

      - name: claim_line_pends_when_matched_authorization_is_revoked
        grounds:
          - calculations.claim_outcome_resolution
          - state_machines.Authorization.status.ACTIVE_to_REVOKED
          - state_machines.ClaimLine.line_status.PENDING_to_PENDED
          - entities.ClaimLine.fields.edit_reason_code
        distinguishing_aspect: |
          Cross-entity pair (ClaimLine, Authorization) — a different pair from (Claim, MemberCoverage):
