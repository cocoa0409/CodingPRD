scenario: "306. Cooking Class & Culinary Workshop Booking: class catalog & skill level, seat capacity & waitlist, ingredient/station prep & cost, private vs group event, dietary substitution, gift card, no-show/cancellation, recurring series"
domain_name: cooking-class-workshop-booking
api_prefix: /culinary

# ---------------------------------------------------------------------------
# Complexity profile
# ---------------------------------------------------------------------------
complexity_profile:
  primary_archetype: quota_allocation          # seat capacity competed for; waitlist promotion; over-subscription policy
  secondary_archetype: temporal_windowing      # station/kitchen prep windows must not overlap on a shared station
  complexity_layers:
    - dual_variant_calculation                 # provisional vs final refund (Booking); provisional vs final reliability (Member)
    - cascading_side_effects                   # cancel -> seat freed -> waitlist promoted -> prep recosted -> series rollup
    - rate_threshold_triggers                  # group-discount tiers, refund-percent tiers, reliability block threshold
    - optimistic_concurrency                   # OCC on ClassSession.version for seat-claim races; OCC on GiftCard.version for redemption

  entity_topology: flat                        # peer entities linked by FK; no deep URL nesting
  state_machine_shape: parallel                # Booking carries (lifecycle_status x payment_status); ClassSession branches; Substitution reverts
  relationship_patterns:
    - one_to_many                              # Series -> Sessions; Session -> Bookings; Member -> Bookings
    - many_to_many                             # Member <-> Session via Booking junction
    - self_referential                         # WaitlistEntry ordered queue references its Session; promotion order by created_at
    - cross_aggregate                          # SubstitutionRequest crosses Booking and Session/IngredientLine cost ledgers
  role_model: peer_roles                       # Member owns own bookings; Instructor owns own sessions; StudioAdmin operational superset for ops
  consistency_model: immediate                 # all cascades atomic within the triggering request

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: instructor display name
      - name: email
        type: string
        source: input
        description: unique login email
        constraints: unique across Instructor
      - name: max_skill_level
        type: enum
        source: input
        description: highest skill level this instructor is certified to teach
        constraints: one of {BEGINNER, INTERMEDIATE, ADVANCED, PROFESSIONAL}
      - name: status
        type: enum
        source: system
        description: lifecycle of the instructor account
        default: ACTIVE
        constraints: one of {ACTIVE, SUSPENDED}

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: member display name
      - name: email
        type: string
        source: input
        description: unique login email
        constraints: unique across Member
      - name: dietary_flags
        type: array
        source: input
        description: list of dietary restriction tags the member carries (e.g. GLUTEN_FREE, VEGAN, NUT_ALLERGY); empty array allowed
        default: []
      - name: wallet_credit_cents
        type: integer
        source: system
        description: non-withdrawable studio credit balance in cents; credited by refunds; debited in the payment waterfall
        default: 0
        constraints: ">= 0"
      - name: no_show_count
        type: integer
        source: computed
        description: count of NoShowRecord rows for this member with kind=NO_SHOW that are SETTLED; recomputed by reliability calc
        default: 0
      - name: late_cancel_count
        type: integer
        source: computed
        description: count of NoShowRecord rows for this member with kind=LATE_CANCEL that are SETTLED; recomputed by reliability calc
        default: 0
      - name: reliability_score
        type: integer
        source: computed
        description: computed final reliability score in [0,100]; see calculations.member_reliability_score (FINAL variant)
        default: 100
      - name: booking_status
        type: enum
        source: system
        description: gating posture derived from reliability_score; GOOD_STANDING or BLOCKED
        default: GOOD_STANDING
        constraints: one of {GOOD_STANDING, BLOCKED}

  - name: RecurringSeries
    parent: null
    common_fields: true
    fields:
      - name: template_id
        type: string
        source: input
        description: "FK -> ClassTemplate.id; the catalog template every session in this series instantiates"
      - name: instructor_id
        type: string
        source: input
        description: "FK -> Instructor.id; instructor assigned to every session spawned by this series"
      - name: cadence
        type: enum
        source: input
        description: spacing between consecutive sessions
        constraints: one of {WEEKLY, BIWEEKLY, MONTHLY}
      - name: occurrence_count
        type: integer
        source: input
        description: number of ClassSession rows spawned when the series is published
        constraints: integer in [1, 52]
      - name: first_start_at
        type: datetime
        source: input
        description: start_at of the first session; subsequent sessions offset by cadence
      - name: status
        type: enum
        source: system
        description: series lifecycle
        default: DRAFT
        constraints: one of {DRAFT, PUBLISHED, CANCELLED}
      - name: active_session_count
        type: integer
        source: computed
        description: count of child ClassSession rows whose status NOT IN {CANCELLED, COMPLETED}; recomputed on every child session transition
        default: 0

  - name: ClassTemplate
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: catalog title of the class
      - name: skill_level
        type: enum
        source: input
        description: required skill level for the class; drives skill surcharge
        constraints: one of {BEGINNER, INTERMEDIATE, ADVANCED, PROFESSIONAL}
      - name: base_price_cents
        type: integer
        source: input
        description: per-seat base price in cents before surcharges and discounts
        constraints: ">= 0"
      - name: default_capacity
        type: integer
        source: input
        description: default planned seat capacity copied onto sessions created from this template
        constraints: integer in [1, 40]
      - name: station_fixed_cost_cents
        type: integer
        source: input
        description: fixed per-session station/kitchen setup cost in cents, allocated across planned seats (ceil) in prep cost
        constraints: ">= 0"
      - name: prep_minutes
        type: integer
        source: input
        description: minutes of station occupation BEFORE start_at required to prep; used in station temporal-overlap detection
        constraints: integer in [0, 480]
      - name: cleanup_minutes
        type: integer
        source: input
        description: mandatory cleanup buffer AFTER end_at during which the station is still occupied; used in overlap detection
        constraints: integer in [0, 240]
      - name: status
        type: enum
        source: system
        description: catalog publication state
        default: DRAFT
        constraints: one of {DRAFT, PUBLISHED, RETIRED}

  - name: ClassSession
    parent: null
    common_fields: true
    fields:
      - name: template_id
        type: string
        source: input
        description: "FK -> ClassTemplate.id; the catalog template this session instantiates"
      - name: series_id
        type: string
        source: input
        description: "FK -> RecurringSeries.id; the series that spawned this session, or null for a standalone session"
        default: null
      - name: instructor_id
        type: string
        source: input
        description: "FK -> Instructor.id; instructor teaching this session"
      - name: station_id
        type: string
        source: input
        description: identifier of the physical station/kitchen this session occupies; sessions sharing a station_id contend for temporal exclusivity
      - name: event_type
        type: enum
        source: input
        description: GROUP allows many members to book seats with tiered group discount; PRIVATE is a single-party buyout with flat private_event_fee_cents and no group discount
        constraints: one of {GROUP, PRIVATE}
      - name: start_at
        type: datetime
        source: input
        description: scheduled session start (ISO 8601 UTC)
      - name: end_at
        type: datetime
        source: input
        description: scheduled session end (ISO 8601 UTC); must be strictly after start_at
      - name: planned_seats
        type: integer
        source: input
        description: total seat capacity for this session; station_fixed_cost is allocated across this count
        constraints: integer in [1, 40]
      - name: confirmed_seats
        type: integer
        source: computed
        description: sum of seats_requested over child Booking rows whose lifecycle_status = CONFIRMED; recomputed on every booking lifecycle transition
        default: 0
      - name: private_event_fee_cents
        type: integer
        source: input
        description: flat buyout fee in cents charged for a PRIVATE event in place of per-seat pricing; ignored when event_type=GROUP
        default: 0
        constraints: ">= 0"
      - name: prep_cost_per_seat_cents
        type: integer
        source: computed
        description: computed per-seat prep cost; see calculations.prep_cost_per_seat. Recomputed when IngredientLine set or planned_seats changes
        default: 0
      - name: status
        type: enum
        source: system
        description: session lifecycle posture; gates booking operations on its children
        default: SCHEDULED
        constraints: one of {SCHEDULED, OPEN, FULL, LOCKED, COMPLETED, CANCELLED}

  - name: IngredientLine
    parent: ClassSession
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> ClassSession.id; the session whose recipe this ingredient line belongs to"
      - name: name
        type: string
        source: input
        description: ingredient name
      - name: qty_per_seat
        type: number
        source: input
        description: quantity of this ingredient consumed per booked seat (decimal allowed)
        constraints: ">= 0"
      - name: unit_cost_cents
        type: integer
        source: input
        description: cost in cents of one unit of this ingredient
        constraints: ">= 0"
      - name: dietary_tag
        type: enum
        source: input
        description: dietary classification of this ingredient line; a SubstitutionRequest may swap a CONTAINS_ALLERGEN line for an alternate
        default: NEUTRAL
        constraints: one of {NEUTRAL, CONTAINS_GLUTEN, CONTAINS_NUT, CONTAINS_DAIRY, ANIMAL_PRODUCT}

  - name: Booking
    parent: ClassSession
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> ClassSession.id; the session being booked"
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member who owns this booking"
      - name: seats_requested
        type: integer
        source: input
        description: number of seats this booking holds; for PRIVATE events must equal session.planned_seats
        constraints: integer in [1, 40]
      - name: charge_cents
        type: integer
        source: computed
        description: total booking charge in cents; see calculations.booking_charge
        default: 0
      - name: gift_card_applied_cents
        type: integer
        source: computed
        description: portion of charge settled from gift cards in the payment waterfall
        default: 0
      - name: wallet_applied_cents
        type: integer
        source: computed
        description: portion of charge settled from member wallet credit in the payment waterfall
        default: 0
      - name: card_applied_cents
        type: integer
        source: computed
        description: residual portion of charge settled to external card in the payment waterfall
        default: 0
      - name: refund_cents
        type: integer
        source: computed
        description: amount refunded to wallet on cancellation; provisional at request, final at session start; see calculations.cancellation_refund
        default: 0
      - name: refilled_from_waitlist
        type: boolean
        source: computed
        description: true if the seat this booking vacated was taken by a promoted waitlist booking before session start; drives FINAL refund variant
        default: false
      - name: lifecycle_status
        type: enum
        source: system
        description: booking lifecycle dimension (independent of payment_status)
        default: PENDING
        constraints: one of {PENDING, CONFIRMED, CANCELLED, NO_SHOW, ATTENDED}
      - name: payment_status
        type: enum
        source: system
        description: payment dimension (independent of lifecycle_status)
        default: UNPAID
        constraints: one of {UNPAID, PAID, REFUNDED, PARTIALLY_REFUNDED}

  - name: WaitlistEntry
    parent: ClassSession
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> ClassSession.id; the full session this entry is waiting on"
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the waiting member"
      - name: seats_requested
        type: integer
        source: input
        description: seats the member wants when promoted
        constraints: integer in [1, 40]
      - name: queue_status
        type: enum
        source: system
        description: waitlist entry lifecycle
        default: WAITING
        constraints: one of {WAITING, PROMOTED, EXPIRED, WITHDRAWN}
      - name: promoted_booking_id
        type: string
        source: system
        description: "FK -> Booking.id; the Booking created when this entry was promoted, or null while WAITING"
        default: null

  - name: SubstitutionRequest
    parent: Booking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the confirmed booking requesting a dietary substitution"
      - name: ingredient_line_id
        type: string
        source: input
        description: "FK -> IngredientLine.id; the offending line to be swapped out"
      - name: alternate_unit_cost_cents
        type: integer
        source: input
        description: per-unit cost in cents of the substitute ingredient; surcharge is the positive delta over the original line's unit_cost_cents
        constraints: ">= 0"
      - name: surcharge_cents
        type: integer
        source: computed
        description: computed surcharge billed to the booking; see calculations.substitution_surcharge
        default: 0
      - name: status
        type: enum
        source: system
        description: substitution lifecycle (branching with revert)
        default: REQUESTED
        constraints: one of {REQUESTED, APPROVED, REJECTED, REVERTED}

  - name: GiftCard
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: unique redemption code
        constraints: unique across GiftCard
      - name: owner_member_id
        type: string
        source: input
        description: "FK -> Member.id; the member who owns and may redeem this card"
      - name: initial_value_cents
        type: integer
        source: input
        description: face value loaded at issuance, in cents
        constraints: ">= 1"
      - name: balance_cents
        type: integer
        source: computed
        description: remaining redeemable balance; equals initial_value_cents minus sum of REDEEM txns plus sum of RELOAD txns plus REFUND_TO_CARD reversals
        default: 0
      - name: status
        type: enum
        source: system
        description: gift card lifecycle
        default: ACTIVE
        constraints: one of {ACTIVE, DEPLETED, VOIDED}

  - name: GiftCardTxn
    parent: GiftCard
    common_fields: false
    fields:
      - name: gift_card_id
        type: string
        source: input
        description: "FK -> GiftCard.id; the card this ledger entry mutates"
      - name: booking_id
        type: string
        source: system
        description: "FK -> Booking.id; the booking that triggered this txn, or null for ISSUE/RELOAD"
        default: null
      - name: kind
        type: enum
        source: system
        description: ledger entry kind; signed effect on balance
        constraints: one of {ISSUE, REDEEM, RELOAD, REVERSAL}
      - name: amount_cents
        type: integer
        source: system
        description: signed delta applied to GiftCard.balance_cents (ISSUE/RELOAD/REVERSAL positive, REDEEM negative)

  - name: NoShowRecord
    parent: Member
    common_fields: false
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member who incurred the strike"
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking that produced the strike"
      - name: kind
        type: enum
        source: system
        description: NO_SHOW (member never showed) or LATE_CANCEL (member cancelled within the no-refund window)
        constraints: one of {NO_SHOW, LATE_CANCEL}
      - name: settlement_status
        type: enum
        source: system
        description: PENDING while the session is still open; flips to SETTLED at session start, at which point it counts toward reliability
        default: PENDING
        constraints: one of {PENDING, SETTLED, WAIVED}

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: RecurringSeries
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /culinary/series/{id}/publish"
        actor: StudioAdmin
        preconditions:
          - "series.status == DRAFT"
          - "referenced ClassTemplate.status == PUBLISHED"
          - "referenced Instructor.status == ACTIVE"
          - "Instructor.max_skill_level >= template.skill_level on the ordered scale BEGINNER<INTERMEDIATE<ADVANCED<PROFESSIONAL"
        side_effects:
          - "spawn occurrence_count ClassSession rows, the k-th at first_start_at + k*cadence_interval (k from 0), each in status SCHEDULED with series_id=this.id, planned_seats=template.default_capacity, event_type=GROUP"
          - "set series.active_session_count = occurrence_count"
        note: "cadence_interval: WEEKLY=7d, BIWEEKLY=14d, MONTHLY=28d (fixed, not calendar-month)"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /culinary/series/{id}/cancel"
        actor: StudioAdmin
        preconditions:
          - "series.status == PUBLISHED"
        side_effects:
          - "CASCADE: every child ClassSession whose status NOT IN {COMPLETED, CANCELLED} transitions to CANCELLED (which itself cascades to its bookings — see ClassSession SCHEDULED/OPEN/FULL/LOCKED -> CANCELLED)"
          - "set series.active_session_count = 0"

  - entity: ClassSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /culinary/sessions/{id}/open"
        actor: Instructor
        preconditions:
          - "session.status == SCHEDULED"
          - "session has >= 1 IngredientLine"
          - "no other ClassSession sharing this station_id with status IN {OPEN, FULL, LOCKED, SCHEDULED} has an occupation interval that overlaps this session's occupation interval (see validations priority 22)"
        side_effects:
          - "recompute prep_cost_per_seat (calculations.prep_cost_per_seat)"
        note: "opening publishes the session for booking"
      - from: OPEN
        to: FULL
        trigger: "system: confirmed_seats reaches planned_seats after a booking confirms"
        actor: system
        preconditions:
          - "session.status == OPEN"
          - "session.confirmed_seats == session.planned_seats"
        side_effects:
          - "no further PENDING->CONFIRMED booking transitions accepted; new requests join the waitlist"
      - from: FULL
        to: OPEN
        trigger: "system: confirmed_seats drops below planned_seats after a CONFIRMED booking is cancelled and no waitlist entry refilled the seat"
        actor: system
        preconditions:
          - "session.status == FULL"
          - "session.confirmed_seats < session.planned_seats"
          - "no WAITING WaitlistEntry was promoted to fill the freed seats"
        side_effects:
          - "session re-opens for direct booking"
        note: "cyclic edge OPEN<->FULL: capacity oscillates as bookings confirm and cancel"
      - from: OPEN
        to: LOCKED
        trigger: "POST /culinary/sessions/{id}/lock"
        actor: Instructor
        preconditions:
          - "session.status IN {OPEN, FULL}"
        side_effects:
          - "freeze the roster; no new bookings, no waitlist promotion; substitution requests still allowed"
      - from: FULL
        to: LOCKED
        trigger: "POST /culinary/sessions/{id}/lock"
        actor: Instructor
        preconditions:
          - "session.status IN {OPEN, FULL}"
        side_effects:
          - "freeze the roster; no new bookings, no waitlist promotion; substitution requests still allowed"
      - from: LOCKED
        to: COMPLETED
        trigger: "POST /culinary/sessions/{id}/complete"
        actor: Instructor
        preconditions:
          - "session.status == LOCKED"
        side_effects:
          - "CASCADE: every child Booking with lifecycle_status=CONFIRMED transitions to ATTENDED unless already marked NO_SHOW"
          - "CASCADE: every child Booking still PENDING transitions to CANCELLED with refund_cents computed FINAL"
          - "every NoShowRecord for child bookings with settlement_status=PENDING flips to SETTLED"
          - "recompute reliability_score (FINAL) for every affected Member; if any Member.reliability_score < 40 set that Member.booking_status=BLOCKED"
          - "decrement parent RecurringSeries.active_session_count by 1 if series_id is set"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /culinary/sessions/{id}/cancel"
        actor: StudioAdmin
        preconditions:
          - "session.status IN {SCHEDULED, OPEN, FULL, LOCKED}"
        side_effects:
          - "CASCADE: every child Booking with lifecycle_status IN {PENDING, CONFIRMED} transitions to CANCELLED with refund_cents = full charge (studio-fault, cancellation_fee waived), payment_status -> REFUNDED, wallet credited"
          - "CASCADE: every WAITING WaitlistEntry transitions to EXPIRED"
          - "decrement parent RecurringSeries.active_session_count by 1 if series_id is set"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /culinary/sessions/{id}/cancel"
        actor: StudioAdmin
        preconditions:
          - "session.status IN {SCHEDULED, OPEN, FULL, LOCKED}"
        side_effects:
          - "CASCADE: every child Booking with lifecycle_status IN {PENDING, CONFIRMED} transitions to CANCELLED with refund_cents = full charge (studio-fault, cancellation_fee waived), payment_status -> REFUNDED, wallet credited"
          - "CASCADE: every WAITING WaitlistEntry transitions to EXPIRED"
          - "decrement parent RecurringSeries.active_session_count by 1 if series_id is set"
      - from: FULL
        to: CANCELLED
        trigger: "POST /culinary/sessions/{id}/cancel"
        actor: StudioAdmin
        preconditions:
          - "session.status IN {SCHEDULED, OPEN, FULL, LOCKED}"
        side_effects:
          - "CASCADE: every child Booking with lifecycle_status IN {PENDING, CONFIRMED} transitions to CANCELLED with refund_cents = full charge (studio-fault, cancellation_fee waived), payment_status -> REFUNDED, wallet credited"
          - "CASCADE: every WAITING WaitlistEntry transitions to EXPIRED"
          - "decrement parent RecurringSeries.active_session_count by 1 if series_id is set"
      - from: LOCKED
        to: CANCELLED
        trigger: "POST /culinary/sessions/{id}/cancel"
        actor: StudioAdmin
        preconditions:
          - "session.status IN {SCHEDULED, OPEN, FULL, LOCKED}"
        side_effects:
          - "CASCADE: every child Booking with lifecycle_status IN {PENDING, CONFIRMED} transitions to CANCELLED with refund_cents = full charge (studio-fault, cancellation_fee waived), payment_status -> REFUNDED, wallet credited"
          - "CASCADE: every WAITING WaitlistEntry transitions to EXPIRED"
          - "decrement parent RecurringSeries.active_session_count by 1 if series_id is set"

  - entity: Booking
    initial_state: PENDING
    terminal_states: [CANCELLED, NO_SHOW, ATTENDED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /culinary/bookings/{id}/confirm"
        actor: Member
        preconditions:
          - "booking.lifecycle_status == PENDING"
          - "session.status == OPEN"
          - "session.confirmed_seats + booking.seats_requested <= session.planned_seats"
          - "acting Member.booking_status == GOOD_STANDING"
          - "expected_session_version matches session.version (OCC)"
        side_effects:
          - "run payment waterfall (calculations.payment_waterfall): debit gift cards then wallet then card; set gift_card_applied_cents, wallet_applied_cents, card_applied_cents; payment_status -> PAID"
          - "increment session.confirmed_seats by seats_requested; refresh session.prep_cost_per_seat (calculations.prep_cost_per_seat)"
          - "increments ClassSession.version by 1"
          - "if session.confirmed_seats == session.planned_seats then session OPEN -> FULL (auto)"
        note: "parallel dimensions: this transition advances BOTH lifecycle_status (PENDING->CONFIRMED) and payment_status (UNPAID->PAID)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /culinary/bookings/{id}/cancel"
        actor: Member
        preconditions:
          - "booking.lifecycle_status == CONFIRMED"
          - "session.status IN {OPEN, FULL}"
        side_effects:
          - "compute refund_cents PROVISIONAL (calculations.cancellation_refund, assume seat will refill); credit Member.wallet_credit_cents by refund_cents; reverse gift-card portion first via REVERSAL txns up to gift_card_applied_cents, remainder to wallet; set payment_status REFUNDED if refund==charge else PARTIALLY_REFUNDED"
          - "decrement session.confirmed_seats by seats_requested; refresh session.prep_cost_per_seat"
          - "increments ClassSession.version by 1"
          - "CASCADE: promote the oldest WAITING WaitlistEntry whose seats_requested <= freed seats (calculations.waitlist_promotion); that promotion creates a CONFIRMED Booking and sets this booking.refilled_from_waitlist=true; the promoted booking itself runs the payment waterfall (depth-3 cascade)"
          - "if no waitlist entry refills and session was FULL, session FULL -> OPEN (auto)"
          - "if cancellation falls within 24h of start_at, create a NoShowRecord kind=LATE_CANCEL settlement_status=PENDING for the member"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /culinary/bookings/{id}/mark-no-show"
        actor: Instructor
        preconditions:
          - "booking.lifecycle_status == CONFIRMED"
          - "session.status == LOCKED"
        side_effects:
          - "create a NoShowRecord kind=NO_SHOW settlement_status=PENDING for the member"
          - "refund_cents = 0; charge is forfeit; payment_status unchanged"
      - from: CONFIRMED
        to: ATTENDED
        trigger: "system: session LOCKED -> COMPLETED"
        actor: system
        preconditions:
          - "booking.lifecycle_status == CONFIRMED"
          - "session.status transitioning LOCKED -> COMPLETED"
        side_effects:
          - "booking finalized as attended; no payment change"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /culinary/bookings/{id}/cancel OR system on session cancel/complete"
        actor: Member
        preconditions:
          - "booking.lifecycle_status == PENDING"
        side_effects:
          - "refund_cents = 0 (never paid); payment_status unchanged (UNPAID)"

  - entity: SubstitutionRequest
    initial_state: REQUESTED
    terminal_states: [REJECTED, REVERTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /culinary/substitutions/{id}/approve"
        actor: Instructor
        preconditions:
          - "substitution.status == REQUESTED"
          - "parent Booking.lifecycle_status == CONFIRMED"
          - "session.status IN {OPEN, FULL, LOCKED}"
          - "ingredient_line.dietary_tag != NEUTRAL"
        side_effects:
          - "compute surcharge_cents (calculations.substitution_surcharge)"
          - "add surcharge_cents to parent Booking.charge_cents and settle it via the payment waterfall (gift card -> wallet -> card); set card_applied_cents/wallet_applied_cents/gift_card_applied_cents deltas"
          - "increments parent Booking.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /culinary/substitutions/{id}/reject"
        actor: Instructor
        preconditions:
          - "substitution.status == REQUESTED"
        side_effects:
          - "no charge change"
      - from: APPROVED
        to: REVERTED
        trigger: "POST /culinary/substitutions/{id}/revert"
        actor: Instructor
        preconditions:
          - "substitution.status == APPROVED"
          - "session.status IN {OPEN, FULL, LOCKED}"
        side_effects:
          - "COMPENSATION: subtract the exact surcharge_cents previously added back from parent Booking.charge_cents; reverse the payment-waterfall debits in reverse order (card first, then wallet, then gift card via REVERSAL txns) so each funding source returns to its pre-approval value"
          - "increments parent Booking.version by 1"
        note: "compensating invariant: Booking.charge_cents and the sum of the three funding sources both return to their pre-approval totals"

  - entity: GiftCard
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system: REDEEM txn drives balance_cents to 0"
        actor: system
        preconditions:
          - "giftcard.status == ACTIVE"
          - "giftcard.balance_cents == 0 after a REDEEM"
        side_effects:
          - "card no longer selected by the payment waterfall"
      - from: DEPLETED
        to: ACTIVE
        trigger: "POST /culinary/gift-cards/{id}/reload"
        actor: Member
        preconditions:
          - "giftcard.status == DEPLETED"
          - "expected_gift_card_version matches giftcard.version (OCC)"
        side_effects:
          - "append RELOAD GiftCardTxn; increase balance_cents by amount; status back to ACTIVE"
          - "increments GiftCard.version by 1"
        note: "cyclic edge ACTIVE<->DEPLETED across redeem and reload"
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /culinary/gift-cards/{id}/void"
        actor: StudioAdmin
        preconditions:
          - "giftcard.status == ACTIVE"
        side_effects:
          - "balance frozen; card no longer redeemable"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC only — true races)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: booking-confirm-stale-session
    parent_entity: ClassSession
    write_endpoint: "POST /culinary/bookings/{id}/confirm"
    occ_field: "expected_session_version"
    description: |
      Confirming a PENDING booking against a ClassSession whose version has
      advanced since the client last observed it is rejected as stale. A
      second writer may have just confirmed a booking that consumed the last
      seat (a legitimate confirm under the open-seat semantics), so the
      current writer's seat count view is stale and the confirm is rejected
      on the version mismatch rather than on a seat-count precondition.
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412

  - rule_id: giftcard-reload-stale
    parent_entity: GiftCard
    write_endpoint: "POST /culinary/gift-cards/{id}/reload"
    occ_field: "expected_gift_card_version"
    description: |
      Reloading a GiftCard whose version has advanced since the client last
      observed it is rejected as stale. Another redemption may have legitimately
      depleted or already reloaded the card, so the reloading client's balance
      view is stale and the reload is rejected on the version mismatch.
    error_id: ERR_STALE_GIFT_CARD_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: prep_cost_per_seat
    trigger: "on session open; on each booking confirm/cancel; on IngredientLine create/delete; on planned_seats change"
    algorithm: aggregation
    formula: |
      # MODE (b): round per line THEN sum (this order is PINNED).
      ingredient_per_seat = 0
      for line in IngredientLine where session_id == session.id (sorted by created_at ASC):
          line_cost = round_half_up(line.qty_per_seat * line.unit_cost_cents)   # to integer cents, per line
          ingredient_per_seat += line_cost
      station_per_seat = ceil(template.station_fixed_cost_cents / session.planned_seats)   # ceiling division
      prep_cost_per_seat_cents = ingredient_per_seat + station_per_seat
    input_set: "all IngredientLine rows with session_id == session.id (no status filter — IngredientLine has no lifecycle); planned_seats from the session row"
    constants:
      ROUNDING: round_half_up
      STATION_ALLOCATION: ceil_division
    precision: "integer cents; per-line round_half_up to whole cents BEFORE summing; station allocation uses ceiling division"
    variants: []

  - name: booking_charge
    trigger: "on booking create (POST /culinary/bookings) — pins charge_cents before confirm"
    algorithm: tiered_pricing
    formula: |
      # MODE (a): >=3 inputs (base_price, seats, skill_level, event_type) with non-linear tier selection.
      # Evaluation order is PINNED.
      if session.event_type == PRIVATE:
          # private buyout: flat fee, no per-seat pricing, no group discount, no skill surcharge
          charge_cents = session.private_event_fee_cents
      else:  # GROUP
          skill_surcharge_per_seat = SKILL_SURCHARGE[template.skill_level]
          line_base   = template.base_price_cents * booking.seats_requested
          skill_total = skill_surcharge_per_seat * booking.seats_requested
          subtotal    = line_base + skill_total
          # group discount tier keyed on seats_requested
          if   booking.seats_requested <= 2: pct = 0.00
          elif booking.seats_requested <= 5: pct = 0.05
          elif booking.seats_requested <= 9: pct = 0.10
          else:                              pct = 0.15
          discount    = round_half_up(subtotal * pct)   # to integer cents
          charge_cents = subtotal - discount
    input_set: "single Booking row plus its session and the session's template; no aggregation over siblings"
    constants:
      SKILL_SURCHARGE: { BEGINNER: 0, INTERMEDIATE: 500, ADVANCED: 1200, PROFESSIONAL: 2500 }
      GROUP_DISCOUNT_TIERS: "seats<=2:0%, 3-5:5%, 6-9:10%, >=10:15%"
    precision: "integer cents; round_half_up on the discount before subtracting"
    variants: []

  - name: cancellation_refund
    trigger: "PROVISIONAL on member-initiated CONFIRMED->CANCELLED; FINAL on session start (LOCKED->COMPLETED) reconciliation"
    algorithm: forward_looking
    formula: |
      # base refund-percent tier keyed on hours between cancel-time (current_utc) and session.start_at
      hours_before = (session.start_at - current_utc) / 3600 seconds
      if   hours_before >= 168: pct = 1.00
      elif hours_before >=  72: pct = 0.75
      elif hours_before >=  24: pct = 0.50
      else:                     pct = 0.00
      gross = round_half_up(booking.charge_cents * pct)
      base_refund = max(0, gross - CANCELLATION_FEE_CENTS)
    input_set: "single Booking and its session; clock from /_clock current_utc"
    constants:
      CANCELLATION_FEE_CENTS: 300
      REFUND_TIERS: ">=168h:100%, >=72h:75%, >=24h:50%, <24h:0%"
    precision: "integer cents; round_half_up on the gross before subtracting the flat fee; floor at 0"
    variants:
      - name: PROVISIONAL
        when: "forward-looking, computed at the moment the member cancels; assumes the freed seat WILL be refilled is NOT credited — only the tier percentage applies"
        difference: "refund_cents = base_refund using the hours_before tier; refilled_from_waitlist is not yet known so it does not affect the figure"
      - name: FINAL
        when: "chronological, reconciled when the session locks->completes; the actual waitlist-refill outcome is now known"
        difference: "if booking.refilled_from_waitlist == true then refund_cents = max(0, booking.charge_cents - CANCELLATION_FEE_CENTS) (full minus fee, because the studio lost no seat revenue); else refund_cents = base_refund (the PROVISIONAL figure stands). The delta between FINAL and PROVISIONAL is credited/clawed on the member wallet at completion."

  - name: member_reliability_score
    trigger: "PROVISIONAL on read of a member; FINAL on session LOCKED->COMPLETED when PENDING NoShowRecords settle"
    algorithm: weighted_scoring
    formula: |
      score = 100 - (NO_SHOW_PENALTY * no_show_count) - (LATE_CANCEL_PENALTY * late_cancel_count)
      reliability_score = max(0, min(100, score))
      booking_status = BLOCKED if reliability_score < BLOCK_THRESHOLD else GOOD_STANDING
    input_set: "NoShowRecord rows for this member; the variant decides which records count (see variants)"
    constants:
      NO_SHOW_PENALTY: 25
      LATE_CANCEL_PENALTY: 10
      BLOCK_THRESHOLD: 40
    precision: "integer; clamp to [0,100]"
    variants:
      - name: PROVISIONAL
        when: "forward-looking, computed on member read; counts ONLY NoShowRecord rows with settlement_status=SETTLED (pending strikes are not yet counted)"
        difference: "no_show_count/late_cancel_count exclude PENDING strikes; a member with a PENDING no-show still shows the pre-strike score"
      - name: FINAL
        when: "chronological, computed at session completion AFTER that session's PENDING strikes flip to SETTLED"
        difference: "the just-settled strikes are now included; score may drop and cross BLOCK_THRESHOLD, flipping booking_status to BLOCKED in the same transaction"

  - name: payment_waterfall
    trigger: "on booking confirm; on substitution approve (incremental for the surcharge)"
    algorithm: waterfall_allocation
    formula: |
      # Distribute `amount_due` across ordered funding buckets. Order is PINNED.
      remaining = amount_due
      # bucket 1: member's ACTIVE gift cards, ordered by created_at ASC (NOT id), oldest first
      for gc in GiftCard where owner_member_id==member.id and status==ACTIVE order by created_at ASC:
          use = min(gc.balance_cents, remaining)
          if use > 0: append REDEEM txn(amount=-use); gc.balance_cents -= use; remaining -= use
          if gc.balance_cents == 0: gc -> DEPLETED
      gift_card_applied_cents = amount_due - remaining
      # bucket 2: member wallet credit
      wallet_use = min(member.wallet_credit_cents, remaining)
      member.wallet_credit_cents -= wallet_use; remaining -= wallet_use
      wallet_applied_cents = wallet_use
      # bucket 3: external card absorbs the rest
      card_applied_cents = remaining
    input_set: "member's ACTIVE GiftCards ordered by created_at ASC; member.wallet_credit_cents; amount_due is booking.charge_cents on confirm or surcharge_cents on substitution approve"
    constants:
      BUCKET_ORDER: "gift_card (oldest created_at first) -> wallet -> card"
    precision: "integer cents; exact (no rounding); the three applied fields sum to amount_due"
    variants: []

  - name: substitution_surcharge
    trigger: "on SubstitutionRequest REQUESTED->APPROVED"
    algorithm: threshold
    formula: |
      delta_per_unit = max(0, alternate_unit_cost_cents - ingredient_line.unit_cost_cents)
      surcharge_cents = round_half_up(delta_per_unit * ingredient_line.qty_per_seat * booking.seats_requested)
    input_set: "single SubstitutionRequest, its IngredientLine, and its parent Booking"
    constants:
      FLOOR: 0
    precision: "integer cents; round_half_up once at the end; negative delta floored to 0 (a cheaper substitute is free, never a credit)"
    variants: []

  - name: waitlist_promotion
    trigger: "on CONFIRMED Booking cancel that frees seats while session.status IN {OPEN, FULL}"
    algorithm: chronological
    formula: |
      freed = cancelled_booking.seats_requested
      # candidate set: WaitlistEntry for this session with queue_status==WAITING and seats_requested <= freed
      # ranking: created_at ASC (oldest waiting first); tie-break created_at ASC then NO further tie-break needed
      candidate = first WaitlistEntry
                    where session_id==session.id and queue_status==WAITING and seats_requested <= freed
                    order by created_at ASC
      if candidate exists:
          create Booking(member=candidate.member_id, seats=candidate.seats_requested,
                         lifecycle_status=CONFIRMED, charge=booking_charge(...))
          run payment_waterfall for the new booking
          candidate.queue_status = PROMOTED; candidate.promoted_booking_id = new booking.id
          cancelled_booking.refilled_from_waitlist = true
          session.confirmed_seats += candidate.seats_requested
      else:
          no promotion; if session was FULL it returns to OPEN
    input_set: "WaitlistEntry rows for the session with queue_status==WAITING; ordered by created_at ASC (never by id)"
    constants:
      PROMOTION_ORDER: created_at_ascending
    precision: "exact; at most one entry promoted per freed booking (single-seat-block fill, no splitting)"
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "acting role is permitted to call this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "for entity_backed roles, the resource being mutated is owned by X-User-ID (Member owns the booking/gift card; Instructor teaches the session)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Member and Instructor ownership-scoped endpoints"

  - priority: 4
    category: existence
    check: "every path/body referenced resource exists, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "request body has all required fields with correct types and enum membership"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 6
    category: state
    check: "target resource is in a state from which the requested transition is defined (per §1.2 from-state list)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: state
    check: "OCC: expected_session_version / expected_gift_card_version equals the parent's current version"
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412
    applies_to: "POST /culinary/bookings/{id}/confirm (session); POST /culinary/gift-cards/{id}/reload (gift card)"

  - priority: 10
    category: business_safety
    check: "on series publish / session open: assigned Instructor.max_skill_level >= template.skill_level on the ordered scale; otherwise the instructor is not certified to teach"
    error_id: ERR_INSTRUCTOR_SKILL_INSUFFICIENT
    http_status: 422
    applies_to: "POST /culinary/series/{id}/publish, POST /culinary/sessions (create)"

  - priority: 11
    category: business_safety
    check: "the acting Member.booking_status == GOOD_STANDING; a BLOCKED member cannot confirm new bookings"
    error_id: ERR_MEMBER_BLOCKED
    http_status: 403
    applies_to: "POST /culinary/bookings/{id}/confirm"

  - priority: 12
    category: business_referential
    check: "on substitution create: the IngredientLine belongs to the same session as the booking, and its dietary_tag != NEUTRAL"
    error_id: ERR_SUBSTITUTION_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /culinary/substitutions"

  - priority: 13
    category: business_referential
    check: "on booking confirm via gift card: every selected GiftCard.owner_member_id == acting member id"
    error_id: ERR_GIFT_CARD_NOT_OWNED
    http_status: 403
    applies_to: "POST /culinary/bookings/{id}/confirm"

  - priority: 20
    category: business_constraint
    check: "for PRIVATE events, booking.seats_requested must equal session.planned_seats (whole-buyout); for GROUP events seats_requested >= 1"
    error_id: ERR_PRIVATE_REQUIRES_FULL_BUYOUT
    http_status: 422
    applies_to: "POST /culinary/bookings"

  - priority: 21
    category: business_constraint
    check: "session.confirmed_seats + booking.seats_requested <= session.planned_seats on confirm; otherwise the seat block does not fit"
    error_id: ERR_INSUFFICIENT_SEATS
    http_status: 409
    applies_to: "POST /culinary/bookings/{id}/confirm"

  - priority: 22
    category: business_temporal
    check: "on session open: no other ClassSession sharing this station_id (status IN {SCHEDULED, OPEN, FULL, LOCKED}) has a station-occupation interval [start_at - prep_minutes, end_at + cleanup_minutes) that overlaps this session's occupation interval (half-open; adjacency at a shared endpoint does NOT overlap)"
    error_id: ERR_STATION_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /culinary/sessions/{id}/open"

  - priority: 23
    category: business_temporal
    check: "on session create: end_at strictly after start_at"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /culinary/sessions"

  - priority: 24
    category: business_constraint
    check: "on waitlist join: session.status == FULL (you may only wait on a full session) and the member has no existing WAITING entry or CONFIRMED booking on this session"
    error_id: ERR_WAITLIST_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /culinary/sessions/{id}/waitlist"

  - priority: 25
    category: business_fiscal
    check: "on gift-card reload: reload amount >= 1 cent"
    error_id: ERR_INVALID_RELOAD_AMOUNT
    http_status: 422
    applies_to: "POST /culinary/gift-cards/{id}/reload"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # ---- Instructor ----
  - method: POST
    path: "/culinary/instructors"
    description: "register an instructor"
    roles: [StudioAdmin]
    code: 201
    input: [full_name, email, max_skill_level]
    output: Instructor
    side_effects: ["create Instructor in ACTIVE"]
  - method: GET
    path: "/culinary/instructors/{id}"
    description: "fetch an instructor"
    roles: [StudioAdmin, Instructor]
    code: 200
    input: []
    output: Instructor
    side_effects: []

  # ---- Member ----
  - method: POST
    path: "/culinary/members"
    description: "register a member"
    roles: [StudioAdmin, Member]
    code: 201
    input: [full_name, email, "dietary_flags?"]
    output: Member
    side_effects: ["create Member with wallet_credit_cents=0, reliability_score=100, booking_status=GOOD_STANDING"]
  - method: GET
    path: "/culinary/members/{id}"
    description: "fetch a member; reliability_score reflects PROVISIONAL variant (settled strikes only)"
    roles: [StudioAdmin, Member]
    code: 200
    input: []
    output: Member
    side_effects: ["recompute reliability_score PROVISIONAL on read"]
  - method: GET
    path: "/culinary/members/{id}/no-show-records"
    description: "list NoShowRecord rows for a member (reverse-reachability for NoShowRecord.member_id)"
    roles: [StudioAdmin, Member]
    code: 200
    input: []
    output: NoShowRecord[]
    side_effects: []
  - method: POST
    path: "/culinary/members/{id}/wallet/adjustments"
    description: "operational wallet credit adjustment (admin seeding / goodwill)"
    roles: [StudioAdmin]
    code: 200
    input: [amount_cents]
    output: Member
    side_effects: ["increment Member.wallet_credit_cents by amount_cents (must keep balance >= 0)"]

  # ---- ClassTemplate ----
  - method: POST
    path: "/culinary/templates"
    description: "create a catalog template in DRAFT"
    roles: [StudioAdmin]
    code: 201
    input: [title, skill_level, base_price_cents, default_capacity, station_fixed_cost_cents, prep_minutes, cleanup_minutes]
    output: ClassTemplate
    side_effects: ["create ClassTemplate in DRAFT"]
  - method: POST
    path: "/culinary/templates/{id}/publish"
    description: "publish a template so series and sessions may instantiate it"
    roles: [StudioAdmin]
    code: 200
    input: []
    output: ClassTemplate
    side_effects: ["ClassTemplate DRAFT -> PUBLISHED"]
  - method: GET
    path: "/culinary/templates/{id}"
    description: "fetch a template"
    roles: [StudioAdmin, Instructor, Member]
    code: 200
    input: []
    output: ClassTemplate
    side_effects: []

  # ---- RecurringSeries ----
  - method: POST
    path: "/culinary/series"
    description: "create a recurring series in DRAFT"
    roles: [StudioAdmin]
    code: 201
    input: [template_id, instructor_id, cadence, occurrence_count, first_start_at]
    output: RecurringSeries
    side_effects: ["create RecurringSeries in DRAFT with active_session_count=0"]
  - method: POST
    path: "/culinary/series/{id}/publish"
    description: "publish a series, spawning its sessions"
    roles: [StudioAdmin]
    code: 200
    input: []
    output: RecurringSeries
    side_effects: ["RecurringSeries DRAFT -> PUBLISHED; spawn occurrence_count ClassSessions; set active_session_count"]
  - method: POST
    path: "/culinary/series/{id}/cancel"
    description: "cancel a series and cascade-cancel its non-terminal sessions"
    roles: [StudioAdmin]
    code: 200
    input: []
    output: RecurringSeries
    side_effects: ["RecurringSeries PUBLISHED -> CANCELLED; cascade session cancels; active_session_count=0"]
  - method: GET
    path: "/culinary/series/{id}"
    description: "fetch a series"
    roles: [StudioAdmin, Instructor, Member]
    code: 200
    input: []
    output: RecurringSeries
    side_effects: []
  - method: GET
    path: "/culinary/series"
    description: "list/filter series; supports template_id and instructor_id filters (reverse-reachability for RecurringSeries.template_id and RecurringSeries.instructor_id)"
    roles: [StudioAdmin, Instructor, Member]
    code: 200
    input: ["template_id?", "instructor_id?", "status?", "limit?", "offset?"]
    output: RecurringSeries[]
    side_effects: []
  - method: GET
    path: "/culinary/series/{id}/sessions"
    description: "list sessions spawned by a series (reverse-reachability for ClassSession.series_id)"
    roles: [StudioAdmin, Instructor, Member]
    code: 200
    input: []
    output: ClassSession[]
    side_effects: []

  # ---- ClassSession ----
  - method: POST
    path: "/culinary/sessions"
    description: "create a standalone session (series_id null) in SCHEDULED"
    roles: [StudioAdmin]
    code: 201
    input: [template_id, instructor_id, station_id, event_type, start_at, end_at, planned_seats, "private_event_fee_cents?", "series_id?"]
    output: ClassSession
    side_effects: ["create ClassSession in SCHEDULED; validate instructor skill and time window"]
  - method: GET
    path: "/culinary/sessions/{id}"
    description: "fetch a session with computed confirmed_seats and prep_cost_per_seat"
    roles: [StudioAdmin, Instructor, Member]
    code: 200
    input: []
    output: ClassSession
    side_effects: []
  - method: GET
    path: "/culinary/sessions"
    description: "list/filter sessions; supports template_id, series_id, instructor_id filters (reverse-reachability for ClassSession.template_id, ClassSession.series_id, ClassSession.instructor_id)"
    roles: [StudioAdmin, Instructor, Member]
    code: 200
    input: ["template_id?", "series_id?", "instructor_id?", "status?", "limit?", "offset?"]
    output: ClassSession[]
    side_effects: []
  - method: POST
    path: "/culinary/sessions/{id}/open"
    description: "open a session for booking"
    roles: [Instructor]
    code: 200
    input: []
    output: ClassSession
    side_effects: ["SCHEDULED -> OPEN; recompute prep_cost_per_seat; station-overlap check"]
  - method: POST
    path: "/culinary/sessions/{id}/lock"
    description: "lock the roster"
    roles: [Instructor]
    code: 200
    input: []
    output: ClassSession
    side_effects: ["OPEN/FULL -> LOCKED"]
  - method: POST
    path: "/culinary/sessions/{id}/complete"
    description: "complete a session; cascade-finalize bookings and settle strikes"
    roles: [Instructor]
    code: 200
    input: []
    output: ClassSession
    side_effects: ["LOCKED -> COMPLETED; CONFIRMED bookings -> ATTENDED; settle strikes; FINAL reliability; FINAL refund reconciliation; series rollup"]
  - method: POST
    path: "/culinary/sessions/{id}/cancel"
    description: "studio-cancel a session with full refunds"
    roles: [StudioAdmin]
    code: 200
    input: []
    output: ClassSession
    side_effects: ["-> CANCELLED; full refund cascade; expire waitlist; series rollup"]

  # ---- IngredientLine ----
  - method: POST
    path: "/culinary/sessions/{id}/ingredient-lines"
    description: "add an ingredient line to a session recipe"
    roles: [StudioAdmin, Instructor]
    code: 201
    input: [name, qty_per_seat, unit_cost_cents, "dietary_tag?"]
    output: IngredientLine
    side_effects: ["create IngredientLine; recompute session.prep_cost_per_seat"]
  - method: GET
    path: "/culinary/sessions/{id}/ingredient-lines"
    description: "list ingredient lines for a session (reverse-reachability for IngredientLine.session_id)"
    roles: [StudioAdmin, Instructor, Member]
    code: 200
    input: []
    output: IngredientLine[]
    side_effects: []

  # ---- Booking ----
  - method: POST
    path: "/culinary/bookings"
    description: "create a PENDING booking; pins charge_cents"
    roles: [Member, StudioAdmin]
    code: 201
    input: [session_id, member_id, seats_requested]
    output: Booking
    side_effects: ["create Booking PENDING/UNPAID; compute charge_cents (booking_charge)"]
  - method: POST
    path: "/culinary/bookings/{id}/confirm"
    description: "confirm a booking, running the payment waterfall under session OCC"
    roles: [Member]
    code: 200
    input: [expected_session_version]
    output: Booking
    side_effects: ["PENDING -> CONFIRMED; payment waterfall; UNPAID -> PAID; session.confirmed_seats += seats; increments ClassSession.version by 1; auto OPEN->FULL at capacity"]
  - method: POST
    path: "/culinary/bookings/{id}/cancel"
    description: "member-cancel a booking; provisional refund + waitlist promotion cascade"
    roles: [Member]
    code: 200
    input: []
    output: Booking
    side_effects: ["CONFIRMED -> CANCELLED; PROVISIONAL refund to wallet; gift-card reversal; increments ClassSession.version by 1; promote oldest fitting waitlist entry (depth-3 cascade); FULL->OPEN if unfilled; LATE_CANCEL strike if within 24h"]
  - method: POST
    path: "/culinary/bookings/{id}/mark-no-show"
    description: "instructor marks a confirmed booking a no-show"
    roles: [Instructor]
    code: 200
    input: []
    output: Booking
    side_effects: ["CONFIRMED -> NO_SHOW; create NO_SHOW strike; refund 0"]
  - method: GET
    path: "/culinary/bookings/{id}"
    description: "fetch a booking"
    roles: [StudioAdmin, Instructor, Member]
    code: 200
    input: []
    output: Booking
    side_effects: []
  - method: GET
    path: "/culinary/bookings"
    description: "list bookings; filter by session_id or member_id (reverse-reachability for Booking.session_id and Booking.member_id)"
    roles: [StudioAdmin, Instructor, Member]
    code: 200
    input: ["session_id?", "member_id?", "lifecycle_status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  # ---- WaitlistEntry ----
  - method: POST
    path: "/culinary/sessions/{id}/waitlist"
    description: "join the waitlist of a FULL session"
    roles: [Member]
    code: 201
    input: [member_id, seats_requested]
    output: WaitlistEntry
    side_effects: ["create WaitlistEntry WAITING"]
  - method: POST
    path: "/culinary/waitlist-entries/{id}/withdraw"
    description: "withdraw a waitlist entry"
    roles: [Member]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["WAITING -> WITHDRAWN"]
  - method: GET
    path: "/culinary/sessions/{id}/waitlist"
    description: "list waitlist entries for a session (reverse-reachability for WaitlistEntry.session_id)"
    roles: [StudioAdmin, Instructor, Member]
    code: 200
    input: []
    output: WaitlistEntry[]
    side_effects: []
  - method: GET
    path: "/culinary/waitlist-entries/{id}"
    description: "fetch a single waitlist entry"
    roles: [StudioAdmin, Instructor, Member]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []
  - method: GET
    path: "/culinary/waitlist-entries"
    description: "list waitlist entries; filter by member_id or promoted_booking_id (reverse-reachability for WaitlistEntry.member_id and WaitlistEntry.promoted_booking_id)"
    roles: [StudioAdmin, Member]
    code: 200
    input: ["member_id?", "session_id?", "promoted_booking_id?", "queue_status?", "limit?", "offset?"]
    output: WaitlistEntry[]
    side_effects: []

  # ---- SubstitutionRequest ----
  - method: POST
    path: "/culinary/substitutions"
    description: "request a dietary substitution against a confirmed booking"
    roles: [Member]
    code: 201
    input: [booking_id, ingredient_line_id, alternate_unit_cost_cents]
    output: SubstitutionRequest
    side_effects: ["create SubstitutionRequest REQUESTED"]
  - method: POST
    path: "/culinary/substitutions/{id}/approve"
    description: "approve a substitution; bill the surcharge"
    roles: [Instructor]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: ["REQUESTED -> APPROVED; compute surcharge; add to Booking.charge_cents; settle via waterfall; increments Booking.version by 1"]
  - method: POST
    path: "/culinary/substitutions/{id}/reject"
    description: "reject a substitution"
    roles: [Instructor]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: ["REQUESTED -> REJECTED"]
  - method: POST
    path: "/culinary/substitutions/{id}/revert"
    description: "revert an approved substitution; compensate the surcharge"
    roles: [Instructor]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: ["APPROVED -> REVERTED; compensating reversal of surcharge and funding debits; increments Booking.version by 1"]
  - method: GET
    path: "/culinary/substitutions/{id}"
    description: "fetch a substitution request"
    roles: [StudioAdmin, Instructor, Member]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: []
  - method: GET
    path: "/culinary/substitutions"
    description: "list substitutions; filter by booking_id (reverse-reachability for SubstitutionRequest.booking_id) or ingredient_line_id"
    roles: [StudioAdmin, Instructor, Member]
    code: 200
    input: ["booking_id?", "ingredient_line_id?", "status?", "limit?", "offset?"]
    output: SubstitutionRequest[]
    side_effects: []

  # ---- GiftCard ----
  - method: POST
    path: "/culinary/gift-cards"
    description: "issue a gift card to a member"
    roles: [StudioAdmin, Member]
    code: 201
    input: [code, owner_member_id, initial_value_cents]
    output: GiftCard
    side_effects: ["create GiftCard ACTIVE; balance_cents=initial_value_cents; append ISSUE txn"]
  - method: POST
    path: "/culinary/gift-cards/{id}/reload"
    description: "reload a depleted gift card under OCC"
    roles: [Member]
    code: 200
    input: [amount_cents, expected_gift_card_version]
    output: GiftCard
    side_effects: ["DEPLETED -> ACTIVE; balance += amount; append RELOAD txn; increments GiftCard.version by 1"]
  - method: POST
    path: "/culinary/gift-cards/{id}/void"
    description: "void an active gift card"
    roles: [StudioAdmin]
    code: 200
    input: []
    output: GiftCard
    side_effects: ["ACTIVE -> VOIDED"]
  - method: GET
    path: "/culinary/gift-cards/{id}"
    description: "fetch a gift card with current balance"
    roles: [StudioAdmin, Member]
    code: 200
    input: []
    output: GiftCard
    side_effects: []
  - method: GET
    path: "/culinary/gift-cards"
    description: "list gift cards; filter by owner_member_id (reverse-reachability for GiftCard.owner_member_id)"
    roles: [StudioAdmin, Member]
    code: 200
    input: ["owner_member_id?", "status?", "limit?", "offset?"]
    output: GiftCard[]
    side_effects: []
  - method: GET
    path: "/culinary/gift-cards/{id}/transactions"
    description: "list ledger txns for a gift card (reverse-reachability for GiftCardTxn.gift_card_id)"
    roles: [StudioAdmin, Member]
    code: 200
    input: []
    output: GiftCardTxn[]
    side_effects: []
  - method: GET
    path: "/culinary/gift-card-transactions/{id}"
    description: "fetch a single gift-card txn (ledger entry)"
    roles: [StudioAdmin, Member]
    code: 200
    input: []
    output: GiftCardTxn
    side_effects: []
  - method: GET
    path: "/culinary/gift-card-transactions"
    description: "list gift-card txns; filter by booking_id or gift_card_id (reverse-reachability for GiftCardTxn.booking_id)"
    roles: [StudioAdmin, Member]
    code: 200
    input: ["booking_id?", "gift_card_id?", "kind?", "limit?", "offset?"]
    output: GiftCardTxn[]
    side_effects: []

  # ---- NoShowRecord ----
  - method: GET
    path: "/culinary/no-show-records/{id}"
    description: "fetch a single no-show/late-cancel strike record"
    roles: [StudioAdmin, Member]
    code: 200
    input: []
    output: NoShowRecord
    side_effects: []
  - method: GET
    path: "/culinary/no-show-records"
    description: "list strike records; filter by member_id or booking_id (reverse-reachability for NoShowRecord.booking_id)"
    roles: [StudioAdmin, Member]
    code: 200
    input: ["member_id?", "booking_id?", "kind?", "limit?", "offset?"]
    output: NoShowRecord[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server's logical current UTC clock (test-driving; controls refund tier and strike-window arithmetic)"
    roles: [StudioAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["set logical clock used by cancellation_refund hours_before and the 24h LATE_CANCEL window"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "acting role not permitted for this endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed actor is not the owner of the resource (member not booking owner, instructor not session teacher)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced resource does not exist"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, wrong type, or invalid enum value"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "resource not in a valid from-state for the requested transition"
  - id: ERR_STALE_SESSION_VERSION
    http: 412
    condition: "expected_session_version does not match ClassSession.version on confirm"
  - id: ERR_STALE_GIFT_CARD_VERSION
    http: 412
    condition: "expected_gift_card_version does not match GiftCard.version on reload"
  - id: ERR_INSTRUCTOR_SKILL_INSUFFICIENT
    http: 422
    condition: "assigned instructor.max_skill_level below template.skill_level on series publish or session create"
  - id: ERR_MEMBER_BLOCKED
    http: 403
    condition: "acting member.booking_status == BLOCKED on booking confirm"
  - id: ERR_SUBSTITUTION_NOT_APPLICABLE
    http: 422
    condition: "ingredient line not on the booking's session, or dietary_tag == NEUTRAL"
  - id: ERR_GIFT_CARD_NOT_OWNED
    http: 403
    condition: "a selected gift card is not owned by the acting member"
  - id: ERR_PRIVATE_REQUIRES_FULL_BUYOUT
    http: 422
    condition: "PRIVATE event booking seats_requested != session.planned_seats"
  - id: ERR_INSUFFICIENT_SEATS
    http: 409
    condition: "confirmed_seats + seats_requested would exceed planned_seats on confirm"
  - id: ERR_STATION_DOUBLE_BOOKED
    http: 409
    condition: "session-open station occupation interval overlaps another session on the same station"
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "session end_at not strictly after start_at"
  - id: ERR_WAITLIST_NOT_ALLOWED
    http: 409
    condition: "waitlist join on a non-FULL session, or member already WAITING/CONFIRMED on the session"
  - id: ERR_INVALID_RELOAD_AMOUNT
    http: 422
    condition: "gift-card reload amount_cents < 1"
  - id: ERR_INVALID_WALLET_ADJUSTMENT
    http: 422
    condition: "wallet adjustment would drive wallet_credit_cents below 0"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: StudioAdmin
    description: "studio operator; owns catalog/series/session lifecycle and operational seeding"
    identity: opaque
    exclusive_operations:
      - "create/publish/retire ClassTemplate"
      - "create/publish/cancel RecurringSeries"
      - "create/cancel ClassSession"
      - "void GiftCard"
      - "wallet adjustments"
      - "register Instructor"
    shared_operations:
      - "register Member (with Member)"
      - "issue GiftCard (with Member)"
      - "create Booking (with Member)"
      - "GET reads"

  - name: Instructor
    description: "teaches sessions; owns session OPEN/LOCK/COMPLETE and roster operations on own sessions"
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "open/lock/complete own ClassSession"
      - "mark-no-show on bookings of own session"
      - "approve/reject/revert SubstitutionRequest on own session"
      - "add IngredientLine to own session (shared with StudioAdmin)"
    shared_operations:
      - "GET reads"

  - name: Member
    description: "books seats, manages own gift cards, requests substitutions"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "confirm/cancel own Booking"
      - "join/withdraw own WaitlistEntry"
      - "request SubstitutionRequest on own booking"
      - "reload own GiftCard"
    shared_operations:
      - "register Member (with StudioAdmin)"
      - "issue GiftCard (with StudioAdmin)"
      - "create Booking (with StudioAdmin)"
      - "GET reads"
