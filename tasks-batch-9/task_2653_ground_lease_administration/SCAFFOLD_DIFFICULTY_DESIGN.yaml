          setup:
            - "Clock at its 2026-08-01T00:00:00Z default; lease with arrears 0, improvements 60000000, land 40000000."
            - "Two RECORDED mortgages: M1 priority 1 principal 3000000, M2 priority 2 principal 2000000."
