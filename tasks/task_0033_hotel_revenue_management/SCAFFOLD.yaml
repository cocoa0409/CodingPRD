scenario: |
  Hotel revenue management system: room-type inventory management with room-type configuration,
  physical-room-to-room-type binding, maintenance-block handling, room-status synchronization
  (vacant/occupied/dirty/out-of-order), and inventory pool partitioning by channel; dynamic
  pricing engine with demand forecasting based on historical occupancy/lead time/event calendar,
  competitor rate monitoring, rate-shopping integration, price-recommendation rules by room type
  and date, and manual override approval; overbooking strategy with overbooking ratio by room
  type and date, walk-out compensation cost estimation, no-show probability modeling,
  overbooking limit enforcement, and walk-out execution workflow; channel distribution with
  OTA/GDS/direct/wholesaler configuration, rate-plan and inventory mapping per channel,
  channel-priority rules, rate-parity monitoring, and channel-commission settlement; reservation
  modification, cancellation, and no-show penalty with modification rules by rate plan,
  cancellation deadline tiers, refund-ratio calculation, no-show charge execution, and dispute
  handling; event-driven synchronization with PMS, payment, channel-manager, and accounting
  systems; audit logging for rate changes and overbooking decisions.

domain_name: "hotel-revenue-management"
api_prefix: "/hotel"

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - temporal_windowing
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_deferred_actions

  entity_topology: hybrid
  state_machine_shape: parallel        # Reservation parallel + RateOverride branching + Room parallel housekeeping/operational
  relationship_patterns:
    - one_to_many                      # RoomType -> Rooms, Reservation -> Charges
    - many_to_many                     # RatePlan <-> Channel via ChannelMapping
    - cross_aggregate                  # Reservation references Channel + RatePlan + RoomType + Room
  role_model: approval_chain           # RevenueAnalyst proposes, RevenueManager approves rate overrides
  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: RoomType
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Short room type code, e.g. STD, DLX, STE"
        constraints: "uppercase, 2-8 chars, unique across active room types"
      - name: name
        type: string
        source: input
        description: "Human-readable room type name"
      - name: base_rate_cents
        type: integer
        source: input
        description: "Default nightly rate in cents (currency=USD); used as floor when no override applies"
        constraints: ">= 1000 (>= $10)"
      - name: max_occupancy
        type: integer
        source: input
        description: "Maximum guests per room of this type"
        constraints: ">= 1, <= 10"
      - name: total_physical_rooms
        type: integer
        source: computed
        description: "Count of Room entities with room_type_id == this and lifecycle_status == ACTIVE"
      - name: status
        type: enum
        source: system
        description: "Lifecycle status of the room type"
        constraints: "values: ACTIVE, RETIRED"
        default: ACTIVE

  - name: Room
    parent: null
    common_fields: true
    fields:
      - name: room_number
        type: string
        source: input
        description: "Physical room identifier, e.g. '305', '12B'"
        constraints: "unique across rooms with lifecycle_status == ACTIVE"
      - name: room_type_id
        type: string
        source: input
        description: "FK to RoomType.id; must reference a RoomType with status == ACTIVE on creation"
      - name: housekeeping_status
        type: enum
        source: system
        description: "Independent housekeeping dimension (parallel state)"
        constraints: "values: VACANT_CLEAN, OCCUPIED, DIRTY"
        default: VACANT_CLEAN
      - name: operational_status
        type: enum
        source: system
        description: "Independent operational dimension (parallel state)"
        constraints: "values: IN_SERVICE, OUT_OF_ORDER"
        default: IN_SERVICE
      - name: lifecycle_status
        type: enum
        source: system
        description: "ACTIVE rooms count toward inventory; ARCHIVED do not"
        constraints: "values: ACTIVE, ARCHIVED"
        default: ACTIVE
      - name: current_reservation_id
        type: string
        source: computed
        description: "FK to Reservation when housekeeping_status == OCCUPIED, else null"

  - name: MaintenanceBlock
    parent: null
    common_fields: true
    fields:
      - name: room_id
        type: string
        source: input
        description: "FK to Room"
      - name: start_date
        type: datetime
        source: input
        description: "ISO date (YYYY-MM-DD); inclusive"
      - name: end_date
        type: datetime
        source: input
        description: "ISO date (YYYY-MM-DD); EXCLUSIVE (half-open interval [start, end))"
        constraints: "end_date > start_date"
      - name: reason
        type: string
        source: input
        description: "Free-text reason"
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the block"
        constraints: "values: SCHEDULED, ACTIVE, RELEASED, CANCELLED"
        default: SCHEDULED

  - name: Channel
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Channel short code, e.g. DIRECT, EXPEDIA, BOOKING_COM, AMADEUS, WHOLESALER_X"
        constraints: "uppercase, unique across active channels"
      - name: channel_type
        type: enum
        source: input
        description: "Distribution channel category"
        constraints: "values: DIRECT, OTA, GDS, WHOLESALER"
      - name: commission_basis_points
        type: integer
        source: input
        description: "Commission charged by channel, in basis points (100 bp = 1.00%)"
        constraints: ">= 0, <= 5000"
      - name: priority_rank
        type: integer
        source: input
        description: "Lower rank = higher priority for inventory release; unique across active channels"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Lifecycle status"
        constraints: "values: ACTIVE, SUSPENDED"
        default: ACTIVE

  - name: RatePlan
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Rate plan code, e.g. BAR, AAA, PKG_NYE"
        constraints: "uppercase, unique across active rate plans"
      - name: room_type_id
        type: string
        source: input
        description: "FK to RoomType (rate plan is scoped to one room type)"
      - name: refund_tier_code
        type: enum
        source: input
        description: "Determines cancellation refund tier mapping (see Calculation refund_ratio)"
        constraints: "values: FLEXIBLE, MODERATE, STRICT, NON_REFUNDABLE"
      - name: modification_allowed
        type: boolean
        source: input
        description: "If false, Reservation.modify is rejected for this rate plan"
        default: true
      - name: status
        type: enum
        source: system
        description: "Lifecycle status"
        constraints: "values: ACTIVE, RETIRED"
        default: ACTIVE

  - name: ChannelRatePlanMapping
    parent: null
    common_fields: false      # immutable join row; only id + created_at
    fields:
      - name: channel_id
        type: string
        source: input
        description: "FK to Channel"
      - name: rate_plan_id
        type: string
        source: input
        description: "FK to RatePlan"
      - name: inventory_share_basis_points
        type: integer
        source: input
        description: "Share of room-type inventory allocated to this channel for this rate plan, in basis points (sum across mappings for one (room_type, date) <= 10000)"
        constraints: ">= 0, <= 10000"
      - name: enabled
        type: boolean
        source: system
        description: "Toggleable flag — if false, channel-side inventory release is suppressed"
        default: true

  - name: RateOverride
    parent: null
    common_fields: true
    fields:
      - name: room_type_id
        type: string
        source: input
        description: "FK to RoomType"
      - name: stay_date
        type: datetime
        source: input
        description: "Single date this override applies to (ISO YYYY-MM-DD)"
      - name: proposed_rate_cents
        type: integer
        source: input
        description: "Proposed nightly rate (cents) overriding base_rate_cents"
        constraints: ">= 1000"
      - name: recommendation_source
        type: enum
        source: input
        description: "Where the proposal came from"
        constraints: "values: SYSTEM_ENGINE, MANUAL_OVERRIDE"
      - name: status
        type: enum
        source: system
        description: "Approval lifecycle"
        constraints: "values: DRAFT, PENDING_APPROVAL, APPROVED, REJECTED, SUPERSEDED"
        default: DRAFT
      - name: approved_by
        type: string
        source: system
        description: "X-User-ID of the RevenueManager that approved; null until approved"
      - name: applied_rate_cents
        type: integer
        source: computed
        description: "Equals proposed_rate_cents once status == APPROVED, else null"

  - name: OverbookingPolicy
    parent: null
    common_fields: true
    fields:
      - name: room_type_id
        type: string
        source: input
        description: "FK to RoomType"
      - name: stay_date
        type: datetime
        source: input
        description: "Single date the policy applies to"
      - name: overbook_ratio_basis_points
        type: integer
        source: input
        description: "Allowed overbooking as basis points above physical inventory (e.g., 1500 = +15%)"
        constraints: ">= 0, <= 5000"
      - name: estimated_no_show_probability_basis_points
        type: integer
        source: input
        description: "Forecast no-show probability for the date (basis points)"
        constraints: ">= 0, <= 10000"
      - name: walkout_compensation_cents
        type: integer
        source: input
        description: "Per-walked-out-guest compensation cost (cents) used for cost estimation"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Lifecycle"
        constraints: "values: ACTIVE, SUPERSEDED"
        default: ACTIVE

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: guest_name
        type: string
        source: input
        description: "Primary guest full name"
      - name: room_type_id
        type: string
        source: input
        description: "FK to RoomType reserved"
      - name: rate_plan_id
        type: string
        source: input
        description: "FK to RatePlan; rate_plan.room_type_id MUST equal room_type_id"
      - name: channel_id
        type: string
        source: input
        description: "FK to Channel that originated the booking"
      - name: assigned_room_id
        type: string
        source: computed
        description: "FK to Room set at check-in; null until CHECKED_IN"
      - name: check_in_date
        type: datetime
        source: input
        description: "ISO date; inclusive (first night)"
      - name: check_out_date
        type: datetime
        source: input
        description: "ISO date; EXCLUSIVE (half-open). nights = check_out - check_in"
        constraints: "check_out_date > check_in_date"
      - name: nights
        type: integer
        source: computed
        description: "check_out_date - check_in_date (whole days)"
      - name: booking_status
        type: enum
        source: system
        description: "Primary lifecycle dimension"
        constraints: "values: PENDING, CONFIRMED, CHECKED_IN, CHECKED_OUT, CANCELLED, NO_SHOW, WALKED_OUT"
        default: PENDING
      - name: payment_status
        type: enum
        source: system
        description: "Independent parallel dimension on the same row"
        constraints: "values: UNPAID, AUTHORIZED, CAPTURED, REFUNDED_PARTIAL, REFUNDED_FULL, CHARGEBACK"
        default: UNPAID
      - name: booked_total_cents
        type: integer
        source: computed
        description: "Locked at CONFIRMED: nights * applicable_nightly_rate_cents (see calc booked_total)"
      - name: refund_amount_cents
        type: integer
        source: computed
        description: "Set at CANCELLED or NO_SHOW finalization (see calc refund_amount). Equals 0 until finalized."
        default: 0
      - name: no_show_charge_cents
        type: integer
        source: computed
        description: "Set when booking_status -> NO_SHOW (see calc no_show_charge)"
        default: 0
      - name: walkout_compensation_cents
        type: integer
        source: computed
        description: "Set when booking_status -> WALKED_OUT (see calc walkout_compensation_actual)"
        default: 0
      - name: cancelled_at
        type: datetime
        source: system
        description: "Server clock at cancellation; used for refund tier lookup"
      - name: dispute_status
        type: enum
        source: system
        description: "Independent dispute dimension; affects no_show charge finality"
        constraints: "values: NONE, OPEN, RESOLVED_GUEST, RESOLVED_HOTEL"
        default: NONE

  - name: AuditLog
    parent: null
    common_fields: false      # append-only event
    fields:
      - name: event_type
        type: enum
        source: system
        description: "Audit event category"
        constraints: "values: RATE_OVERRIDE_APPROVED, RATE_OVERRIDE_REJECTED, OVERBOOKING_ACCEPTED, OVERBOOKING_REJECTED, WALKOUT_EXECUTED, RATE_PARITY_VIOLATION_DETECTED"
      - name: actor_role
        type: string
        source: system
        description: "Role of the actor that triggered the event (or 'system')"
      - name: actor_id
        type: string
        source: system
        description: "X-User-ID of actor or 'system'"
      - name: subject_entity
        type: string
        source: system
        description: "Entity name e.g. 'Reservation', 'RateOverride'"
      - name: subject_id
        type: string
        source: system
        description: "id of the subject entity"
      - name: payload
        type: object
        source: system
        description: "Snapshot fields relevant to event (e.g., before/after rate cents, decision reason)"
      - name: occurred_at
        type: datetime
        source: system
        description: "Server clock at event"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Reservation
    initial_state: PENDING
    terminal_states: [CHECKED_OUT, CANCELLED, NO_SHOW, WALKED_OUT]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /hotel/reservations/{id}/confirm"
        actor: ReservationsAgent
        preconditions:
          - "Reservation.booking_status == PENDING"
          - "RatePlan.status == ACTIVE AND RatePlan.room_type_id == Reservation.room_type_id"
          - "Channel.status == ACTIVE"
          - "ChannelRatePlanMapping(channel_id, rate_plan_id).enabled == true"
          - "For each date d in [check_in_date, check_out_date): channel-allowed inventory remains (see calc channel_inventory_remaining)"
          - "For each date d: room-type overbooking limit not exceeded (see calc overbooking_limit_check)"
        side_effects:
          - "Compute booked_total_cents via calc booked_total (locks the rate)"
          - "Set payment_status = AUTHORIZED (payment system event)"
          - "If overbooking limit binds (i.e., physical inventory exceeded but ratio allows), emit AuditLog event_type=OVERBOOKING_ACCEPTED"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /hotel/reservations/{id}/cancel"
        actor: Guest | ReservationsAgent
        preconditions:
          - "Reservation.booking_status == PENDING"
        side_effects:
          - "Set cancelled_at = now()"
          - "Set refund_amount_cents = 0 (PENDING never charged)"
          - "Set payment_status = REFUNDED_FULL if previously AUTHORIZED, else unchanged"
      - from: CONFIRMED
        to: CONFIRMED
        trigger: "POST /hotel/reservations/{id}/modify"
        actor: Guest | ReservationsAgent
        preconditions:
          - "Reservation.booking_status == CONFIRMED"
          - "RatePlan.modification_allowed == true"
          - "Modification arrival is at least 24 hours before original check_in_date OR channel_type IN {DIRECT}"
          - "New (check_in_date, check_out_date) availability satisfies inventory + overbooking checks"
        side_effects:
          - "Recompute booked_total_cents using current applicable rate (re-lock)"
          - "Increment version; updated_at = now()"
        note: "Cyclic transition CONFIRMED->CONFIRMED captures iterative modifications"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /hotel/reservations/{id}/cancel"
        actor: Guest | ReservationsAgent
        preconditions:
          - "Reservation.booking_status == CONFIRMED"
        side_effects:
          - "Set cancelled_at = now()"
          - "Compute refund_amount_cents via calc refund_amount (uses RatePlan.refund_tier_code and lead time at cancelled_at)"
          - "If refund_amount_cents > 0: payment_status -> REFUNDED_PARTIAL when refund_amount_cents < booked_total_cents else REFUNDED_FULL"
          - "If refund_amount_cents == 0: payment_status -> CAPTURED (penalty retained)"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /hotel/reservations/{id}/check-in (body: room_id)"
        actor: FrontDeskClerk
        preconditions:
          - "Reservation.booking_status == CONFIRMED"
          - "Today >= check_in_date"
          - "Room.room_type_id == Reservation.room_type_id"
          - "Room.lifecycle_status == ACTIVE"
          - "Room.operational_status == IN_SERVICE"
          - "Room.housekeeping_status == VACANT_CLEAN"
          - "No MaintenanceBlock with status IN {SCHEDULED, ACTIVE} overlapping any night in [check_in_date, check_out_date)"
        side_effects:
          - "Set Reservation.assigned_room_id = room_id"
          - "Cascade: Room.housekeeping_status VACANT_CLEAN -> OCCUPIED; Room.current_reservation_id = Reservation.id"
          - "payment_status -> CAPTURED"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /_clock/advance with new_now > check_in_date + 24h AND no check-in occurred"
        actor: system
        preconditions:
          - "Reservation.booking_status == CONFIRMED"
          - "now() >= check_in_date + 24h"
          - "assigned_room_id IS NULL"
        side_effects:
          - "Compute no_show_charge_cents via calc no_show_charge"
          - "Set dispute_status = NONE (initial)"
          - "If no_show_charge_cents > 0: payment_status -> CAPTURED"
      - from: CONFIRMED
        to: WALKED_OUT
        trigger: "POST /hotel/reservations/{id}/walk-out"
        actor: FrontDeskClerk
        preconditions:
          - "Reservation.booking_status == CONFIRMED"
          - "Today == check_in_date (walk-out only at intended arrival)"
          - "Physical room of Reservation.room_type_id is unavailable: count of Rooms with room_type_id == Reservation.room_type_id AND housekeeping_status == VACANT_CLEAN AND operational_status == IN_SERVICE AND no overlapping MaintenanceBlock == 0"
        side_effects:
          - "Set walkout_compensation_cents via calc walkout_compensation_actual"
          - "payment_status -> REFUNDED_FULL"
          - "Emit AuditLog event_type=WALKOUT_EXECUTED with payload={compensation_cents, reason}"
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /hotel/reservations/{id}/check-out"
        actor: FrontDeskClerk
        preconditions:
          - "Reservation.booking_status == CHECKED_IN"
        side_effects:
          - "Cascade: Room.housekeeping_status OCCUPIED -> DIRTY; Room.current_reservation_id = null"

  - entity: Room
    initial_state: VACANT_CLEAN
    terminal_states: []
    transitions:
      - from: VACANT_CLEAN
        to: OCCUPIED
        trigger: "Reservation check-in (cascaded)"
        actor: system
        preconditions:
          - "operational_status == IN_SERVICE"
          - "lifecycle_status == ACTIVE"
        side_effects: []
      - from: OCCUPIED
        to: DIRTY
        trigger: "Reservation check-out (cascaded)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DIRTY
        to: VACANT_CLEAN
        trigger: "POST /hotel/rooms/{id}/clean"
        actor: HousekeepingStaff
        preconditions:
          - "operational_status == IN_SERVICE"
        side_effects: []
      # Operational dimension (parallel — independent of housekeeping)
      - from: IN_SERVICE
        to: OUT_OF_ORDER
        trigger: "POST /hotel/rooms/{id}/out-of-service"
        actor: HousekeepingStaff
        preconditions:
          - "housekeeping_status != OCCUPIED"
        side_effects:
          - "Cascade: any MaintenanceBlock for this room currently SCHEDULED with start_date <= today < end_date transitions to ACTIVE"
      - from: OUT_OF_ORDER
        to: IN_SERVICE
        trigger: "POST /hotel/rooms/{id}/return-to-service"
        actor: HousekeepingStaff
        preconditions:
          - "No MaintenanceBlock with status == ACTIVE for this room"
        side_effects: []
    note: "Two parallel state dimensions: housekeeping_status (VACANT_CLEAN/OCCUPIED/DIRTY) and operational_status (IN_SERVICE/OUT_OF_ORDER) evolve independently."

  - entity: MaintenanceBlock
    initial_state: SCHEDULED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /_clock/advance crosses start_date OR Room.operational_status -> OUT_OF_ORDER while block window covers today"
        actor: system
        preconditions:
          - "now() >= start_date"
          - "now() < end_date"
        side_effects:
          - "Cascade: Room.operational_status -> OUT_OF_ORDER (if currently IN_SERVICE and housekeeping_status != OCCUPIED)"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /_clock/advance crosses end_date OR POST /hotel/maintenance-blocks/{id}/release"
        actor: system | HousekeepingStaff
        preconditions:
          - "now() >= end_date OR explicit release call"
        side_effects:
          - "Cascade: if no other ACTIVE block covers Room and operational_status == OUT_OF_ORDER, transition Room.operational_status -> IN_SERVICE; then Room.housekeeping_status -> DIRTY (assume technician left dust)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /hotel/maintenance-blocks/{id}/cancel"
        actor: HousekeepingStaff
        preconditions:
          - "status == SCHEDULED"
        side_effects: []

  - entity: RateOverride
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /hotel/rate-overrides/{id}/submit"
        actor: RevenueAnalyst
        preconditions:
          - "RoomType.status == ACTIVE"
          - "stay_date >= today"
        side_effects: []
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /hotel/rate-overrides/{id}/approve"
        actor: RevenueManager
        preconditions:
          - "Approver actor_id != submitter actor_id (segregation of duties)"
          - "No existing RateOverride with same (room_type_id, stay_date) and status == APPROVED — if present, that one is SUPERSEDED first"
        side_effects:
          - "Set applied_rate_cents = proposed_rate_cents"
          - "Set approved_by = X-User-ID"
          - "Cascade: any prior APPROVED RateOverride for same (room_type_id, stay_date) -> SUPERSEDED"
          - "Cascade: trigger rate_parity_check across all enabled ChannelRatePlanMappings for this room_type_id; on violation, emit AuditLog event_type=RATE_PARITY_VIOLATION_DETECTED"
          - "Emit AuditLog event_type=RATE_OVERRIDE_APPROVED with payload={before_rate_cents, after_rate_cents}"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /hotel/rate-overrides/{id}/reject"
        actor: RevenueManager
        preconditions:
          - "Approver actor_id != submitter actor_id"
        side_effects:
          - "Emit AuditLog event_type=RATE_OVERRIDE_REJECTED"
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /hotel/rate-overrides/{id}/withdraw"
        actor: RevenueAnalyst
        preconditions:
          - "Submitter == acting RevenueAnalyst"
        side_effects: []
        note: "Cyclic — supports revision rounds before approval"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two confirm requests on the same Reservation race"
    guarantee: "First-writer-wins on booking_status; second sees stale state and is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Reservation.booking_status field"

  - scenario: "Confirm of Reservation A and confirm of Reservation B race when only one channel-allotted slot remains"
    guarantee: "Exactly one confirm succeeds; loser is rejected for inventory"
    error_id: ERR_INVENTORY_EXHAUSTED
    http_status: 409
    serialization: "First-writer-wins on (room_type_id, stay_date, channel_id) inventory decrement"

  - scenario: "Confirm pushes overall room-type reservations beyond physical+overbooking limit (race past the cap)"
    guarantee: "Loser rejected for overbooking ceiling"
    error_id: ERR_OVERBOOKING_LIMIT_EXCEEDED
    http_status: 409
    serialization: "First-writer-wins on (room_type_id, stay_date) overbooking counter"

  - scenario: "Two check-ins target the same Room concurrently"
    guarantee: "At most one check-in succeeds; loser rejected"
    error_id: ERR_ROOM_UNAVAILABLE
    http_status: 409
    serialization: "First-writer-wins on Room.housekeeping_status VACANT_CLEAN -> OCCUPIED"

  - scenario: "Approve and reject the same RateOverride simultaneously"
    guarantee: "Exactly one transition wins; loser is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on RateOverride.status"

  - scenario: "Two MaintenanceBlocks created concurrently with overlapping date ranges on the same Room"
    guarantee: "First created block wins; second rejected for overlap"
    error_id: ERR_MAINTENANCE_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on (room_id, date) maintenance occupation"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: applicable_nightly_rate
    trigger: "Used during Reservation.confirm and Reservation.modify to determine per-night rate for each date in [check_in_date, check_out_date)"
    algorithm: threshold
    formula: |
      for each date d in [check_in_date, check_out_date):
        override = the unique RateOverride with status == APPROVED AND room_type_id == reservation.room_type_id AND stay_date == d
        if override exists: nightly_rate_cents[d] = override.applied_rate_cents
        else:               nightly_rate_cents[d] = RoomType.base_rate_cents
      return nightly_rate_cents
    input_set: "RateOverride rows with status == APPROVED only; DRAFT/PENDING_APPROVAL/REJECTED/SUPERSEDED ignored"
    constants: {}
    precision: "integer cents"

  - name: booked_total
    trigger: "Reservation transitions PENDING -> CONFIRMED, or CONFIRMED -> CONFIRMED (modify)"
    algorithm: aggregation
    formula: |
      rates = applicable_nightly_rate(reservation)
      booked_total_cents = sum(rates[d] for d in [check_in_date, check_out_date))
      # Per-night totals are integer cents; final sum stays in integer cents (no rounding loss).
    input_set: "All nights in [check_in_date, check_out_date)"
    constants: {}
    precision: "integer cents (sum of integers)"

  - name: refund_amount
    trigger: "Reservation transitions CONFIRMED -> CANCELLED"
    algorithm: tiered_pricing
    formula: |
      lead_time_hours = (check_in_date_at_local_midnight - cancelled_at) / 1 hour
      tier = RatePlan.refund_tier_code
      ratio_basis_points = REFUND_TIER_TABLE[tier][bucket_for(lead_time_hours)]
      # round-then-multiply: ratio first, multiply integer cents, integer divide by 10000 with round_half_up
      refund_amount_cents = round_half_up(booked_total_cents * ratio_basis_points / 10000)
      # Order is fixed: ratio lookup -> single multiplication -> single rounding (no per-night refund rounding).
    input_set: "REFUND_TIER_TABLE buckets:
        FLEXIBLE: { lead_time_hours >= 24: 10000, < 24: 5000 }
        MODERATE: { >= 168: 10000, [72,168): 5000, < 72: 0 }
        STRICT:   { >= 336: 5000, < 336: 0 }
        NON_REFUNDABLE: { any: 0 }"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents, single rounding step at end"

  - name: no_show_charge
    trigger: "Reservation transitions CONFIRMED -> NO_SHOW (system, after check_in_date + 24h)"
    algorithm: tiered_pricing
    formula: |
      tier = RatePlan.refund_tier_code
      if tier == NON_REFUNDABLE: charge_cents = booked_total_cents
      elif tier == STRICT:       charge_cents = booked_total_cents
      elif tier == MODERATE:     charge_cents = round_half_up(booked_total_cents * 5000 / 10000)   # 50% of total
      elif tier == FLEXIBLE:     charge_cents = round_half_up(booked_total_cents * 1000 / 10000)   # 10% of total
      # Charge is single rounding step. Refund_amount is informational (0 for no-show); payment_status -> CAPTURED for the charge portion.
    input_set: "Reservation.booked_total_cents and RatePlan.refund_tier_code"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents, single rounding step at end"

  - name: walkout_compensation_estimated
    trigger: "Read-only computation exposed via GET /hotel/overbooking-policies/{room_type_id}/{stay_date}/walkout-cost-estimate; used by revenue team for planning"
    algorithm: forward_looking
    formula: |
      policy = OverbookingPolicy(room_type_id, stay_date) with status == ACTIVE
      reservations_for_date = count(Reservation r where r.booking_status == CONFIRMED AND r.room_type_id == room_type_id AND stay_date IN [r.check_in_date, r.check_out_date))
      physical_capacity = count(Room where room_type_id == room_type_id AND lifecycle_status == ACTIVE) - count(MaintenanceBlock where room_id in those rooms AND status IN {SCHEDULED, ACTIVE} AND stay_date IN [start_date, end_date))
      expected_arrivals = reservations_for_date * (10000 - policy.estimated_no_show_probability_basis_points) / 10000
      expected_walkouts = max(0, expected_arrivals - physical_capacity)
      estimated_cost_cents = round_half_up(expected_walkouts * policy.walkout_compensation_cents)
    input_set: "All CONFIRMED reservations spanning stay_date; physical capacity at calculation time"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents"
    variants:
      - name: forecast_estimated
        when: "Pre-arrival, called from planning endpoint"
        difference: "Uses no_show_probability and current confirmed-reservation count to PROJECT future walkouts (forward_looking)"

  - name: walkout_compensation_actual
    trigger: "Reservation transitions CONFIRMED -> WALKED_OUT (POST /reservations/{id}/walk-out)"
    algorithm: chronological
    formula: |
      policy = OverbookingPolicy(reservation.room_type_id, reservation.check_in_date) with status == ACTIVE
      walkout_compensation_cents = policy.walkout_compensation_cents * reservation.nights
      # Computed at moment of execution from current reservation; no probability factor.
    input_set: "Single Reservation being walked out and the active OverbookingPolicy for its (room_type, check_in_date)"
    constants: {}
    precision: "integer cents"
    variants:
      - name: actual_chronological
        when: "At walk-out execution"
        difference: "Computed from the actual reservation's nights and per-guest compensation; NO probability factor — produces a different number than walkout_compensation_estimated for the same date even when only one walk-out occurs."

  - name: channel_inventory_remaining
    trigger: "Pre-confirm gating during Reservation.confirm and Reservation.modify"
    algorithm: aggregation
    formula: |
      for each date d in [check_in_date, check_out_date):
        physical_capacity = count(Room with room_type_id == reservation.room_type_id AND lifecycle_status == ACTIVE)
                           - count(MaintenanceBlock for those rooms with status IN {SCHEDULED, ACTIVE} AND d IN [start_date, end_date))
        channel_share = floor(physical_capacity * ChannelRatePlanMapping(channel_id, rate_plan_id).inventory_share_basis_points / 10000)
        # Floor first (integer division) — partial allotments do NOT round up.
        used_by_channel = count(Reservation r where r.channel_id == reservation.channel_id AND r.rate_plan_id == reservation.rate_plan_id AND r.booking_status IN {CONFIRMED, CHECKED_IN} AND d IN [r.check_in_date, r.check_out_date))
        remaining[d] = channel_share - used_by_channel
      return min(remaining[d] for d in dates) > 0
    input_set: "All Rooms ACTIVE; ChannelRatePlanMapping.enabled == true; Reservations with booking_status IN {CONFIRMED, CHECKED_IN}"
    constants: {}
    precision: "integer rooms; floor on share allocation"

  - name: overbooking_limit_check
    trigger: "Pre-confirm gating during Reservation.confirm and Reservation.modify (gates the cumulative cap, AFTER channel-share check)"
    algorithm: threshold
    formula: |
      for each date d in [check_in_date, check_out_date):
        physical_capacity = count(Room with room_type_id == reservation.room_type_id AND lifecycle_status == ACTIVE)
                           - count(MaintenanceBlock for those rooms with status IN {SCHEDULED, ACTIVE} AND d IN [start_date, end_date))
        policy = OverbookingPolicy(reservation.room_type_id, d) with status == ACTIVE; if none, treat ratio = 0
        ceiling = physical_capacity + floor(physical_capacity * policy.overbook_ratio_basis_points / 10000)
        # Boundary: strict less-than. ceiling is the FIRST-FORBIDDEN count; cumulative reservations < ceiling is OK; == ceiling is FULL; > ceiling is exceeded.
        cumulative_total = count(Reservation r where r.room_type_id == reservation.room_type_id AND r.booking_status IN {CONFIRMED, CHECKED_IN} AND d IN [r.check_in_date, r.check_out_date)) + 1   # +1 for the candidate
        if cumulative_total > ceiling: return EXCEEDED
        return OK
    input_set: "All ACTIVE Rooms; non-cancelled MaintenanceBlocks; CONFIRMED/CHECKED_IN Reservations"
    constants: {}
    precision: "integer rooms"

  - name: rate_parity_check
    trigger: "Cascade after RateOverride approval (state_machines.RateOverride.PENDING_APPROVAL_to_APPROVED side_effects)"
    algorithm: aggregation
    formula: |
      effective_rate = applicable_nightly_rate(room_type_id, stay_date)
      for each enabled ChannelRatePlanMapping(channel_id, rate_plan_id) where rate_plan.room_type_id == room_type_id:
        channel_observed_rate = effective_rate * (10000 + channel.commission_basis_points) / 10000   # Compute commission-grossed rate
        # Parity rule: across all enabled OTA/GDS channels, the gross rate must match within +/- 100 bp tolerance
      if (max(channel_observed_rate over OTA+GDS) - min(channel_observed_rate over OTA+GDS)) / min > 0.01:
        emit AuditLog event_type=RATE_PARITY_VIOLATION_DETECTED with payload={room_type_id, stay_date, max, min}
    input_set: "All enabled ChannelRatePlanMappings whose rate_plan belongs to room_type_id, restricted to channels with channel_type IN {OTA, GDS}"
    constants:
      PARITY_TOLERANCE_BP: 100
    precision: "integer cents per channel; tolerance comparison in basis points"

  - name: channel_commission_settlement
    trigger: "Reservation transitions CHECKED_IN -> CHECKED_OUT (post-stay accounting)"
    algorithm: aggregation
    formula: |
      commission_amount_cents = round_half_up(booked_total_cents * channel.commission_basis_points / 10000)
      net_to_hotel_cents = booked_total_cents - commission_amount_cents
      # Multiply integer cents, then single round_half_up.
    input_set: "The single completed Reservation and its Channel.commission_basis_points"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents, single rounding"

# =============================================================================
# §1.4 Validation Rules Table (ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "Request includes X-User-Role and X-User-ID headers"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: "all (except GET /_health)"

  - priority: 2
    category: auth
    check: "X-User-Role is valid for the endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-referenced ids exist (validated left-to-right): RoomType, Room, Channel, RatePlan, RateOverride, MaintenanceBlock, OverbookingPolicy, Reservation"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path id parameters"

  - priority: 4
    category: existence
    check: "All body-referenced FK ids exist (room_type_id, room_id, channel_id, rate_plan_id) and are ACTIVE where applicable"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST/PATCH endpoints accepting FK fields"

  - priority: 5
    category: state
    check: "Target entity is in a state from which the requested transition is allowed (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (confirm, cancel, modify, check-in, check-out, walk-out, approve, reject, etc.)"

  - priority: 6
    category: state
    check: "On Reservation.modify: RatePlan.modification_allowed == true"
    error_id: ERR_MODIFICATION_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /hotel/reservations/{id}/modify"

  - priority: 7
    category: business_safety
    check: "On RateOverride.approve / reject: approver X-User-ID != submitter X-User-ID (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /hotel/rate-overrides/{id}/approve, POST /hotel/rate-overrides/{id}/reject"

  - priority: 8
    category: business_safety
    check: "On Reservation.check-in: Room.operational_status == IN_SERVICE AND no overlapping MaintenanceBlock with status IN {SCHEDULED, ACTIVE}"
    error_id: ERR_ROOM_UNAVAILABLE
    http_status: 409
    applies_to: "POST /hotel/reservations/{id}/check-in"

  - priority: 9
    category: business_safety
    check: "On Reservation.check-in: Room.room_type_id MUST equal Reservation.room_type_id"
    error_id: ERR_ROOM_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /hotel/reservations/{id}/check-in"

  - priority: 10
    category: business_referential
    check: "On Reservation.create/modify: RatePlan.room_type_id MUST equal Reservation.room_type_id AND ChannelRatePlanMapping(channel_id, rate_plan_id) exists with enabled == true"
    error_id: ERR_RATE_PLAN_NOT_DISTRIBUTED
    http_status: 422
    applies_to: "POST /hotel/reservations, POST /hotel/reservations/{id}/modify"

  - priority: 11
    category: business_temporal
    check: "On MaintenanceBlock.create: end_date > start_date AND no other MaintenanceBlock for same Room with status IN {SCHEDULED, ACTIVE} overlapping the half-open interval [start_date, end_date)"
    error_id: ERR_MAINTENANCE_OVERLAP
    http_status: 409
    applies_to: "POST /hotel/maintenance-blocks"

  - priority: 12
    category: business_temporal
    check: "On MaintenanceBlock.create: at least one CONFIRMED Reservation already booked into a room of this room_type with check_in_date < end_date AND check_out_date > start_date does NOT block creation by itself, BUT MaintenanceBlock cannot be created on a Room currently OCCUPIED (housekeeping_status == OCCUPIED)"
    error_id: ERR_ROOM_CURRENTLY_OCCUPIED
    http_status: 409
    applies_to: "POST /hotel/maintenance-blocks"

  - priority: 13
    category: business_constraint
    check: "On Channel.create/update: priority_rank is unique across ACTIVE channels"
    error_id: ERR_DUPLICATE_PRIORITY_RANK
    http_status: 409
    applies_to: "POST /hotel/channels, PATCH /hotel/channels/{id}"

  - priority: 14
    category: business_constraint
    check: "On ChannelRatePlanMapping.create: sum of inventory_share_basis_points across all mappings sharing the same rate_plan_id MUST be <= 10000 after this insertion"
    error_id: ERR_INVENTORY_SHARE_EXCEEDED
    http_status: 422
    applies_to: "POST /hotel/channel-rate-plan-mappings"

  - priority: 15
    category: business_fiscal
    check: "On Reservation.confirm: per-channel inventory share must remain >= 1 for every night (calc channel_inventory_remaining)"
    error_id: ERR_INVENTORY_EXHAUSTED
    http_status: 409
    applies_to: "POST /hotel/reservations/{id}/confirm"

  - priority: 16
    category: business_fiscal
    check: "On Reservation.confirm: cumulative reservations across all channels for the room_type, for each night, must not exceed physical_capacity + floor(physical_capacity * overbook_ratio / 10000) (calc overbooking_limit_check; boundary > strict)"
    error_id: ERR_OVERBOOKING_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /hotel/reservations/{id}/confirm, POST /hotel/reservations/{id}/modify"

  - priority: 17
    category: business_temporal
    check: "On Reservation.modify: original check_in_date is more than 24h in the future at modification time, OR Channel.channel_type == DIRECT"
    error_id: ERR_MODIFICATION_TOO_LATE
    http_status: 409
    applies_to: "POST /hotel/reservations/{id}/modify"

  - priority: 18
    category: business_temporal
    check: "On Reservation.cancel: cancellation is processed regardless of time, but refund_amount is computed via tiered formula (no error — just affects refund)"
    error_id: ERR_NONE
    http_status: 200
    applies_to: "POST /hotel/reservations/{id}/cancel"

  - priority: 19
    category: business_constraint
    check: "On RateOverride.create: at most one DRAFT or PENDING_APPROVAL RateOverride per (room_type_id, stay_date)"
    error_id: ERR_OVERRIDE_ALREADY_PENDING
    http_status: 409
    applies_to: "POST /hotel/rate-overrides"

  - priority: 20
    category: business_constraint
    check: "Pagination params: 1 <= limit <= 100; offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all GET list endpoints"

  - priority: 21
    category: business_constraint
    check: "OCC: when request body includes version, it MUST equal current entity version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH/PUT endpoints accepting version"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- RoomType ---
  - method: POST
    path: "/hotel/room-types"
    description: "Create a room type"
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, base_rate_cents, max_occupancy]
    output: RoomType
    side_effects: []

  - method: GET
    path: "/hotel/room-types"
    description: "List room types (filter by status)"
    roles: [PlatformAdmin, RevenueAnalyst, RevenueManager, ReservationsAgent, FrontDeskClerk, HousekeepingStaff]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RoomType[]
    side_effects: []

  - method: GET
    path: "/hotel/room-types/{id}"
    description: "Read a room type"
    roles: [PlatformAdmin, RevenueAnalyst, RevenueManager, ReservationsAgent, FrontDeskClerk, HousekeepingStaff]
    code: 200
    input: []
    output: RoomType
    side_effects: []

  # --- Room ---
  - method: POST
    path: "/hotel/rooms"
    description: "Create a physical room and bind to a room type"
    roles: [PlatformAdmin]
    code: 201
    input: [room_number, room_type_id]
    output: Room
    side_effects: []

  - method: GET
    path: "/hotel/rooms"
    description: "List rooms (filter by room_type_id, housekeeping_status, operational_status, lifecycle_status)"
    roles: [PlatformAdmin, FrontDeskClerk, HousekeepingStaff, RevenueAnalyst, RevenueManager]
    code: 200
    input: ["room_type_id?", "housekeeping_status?", "operational_status?", "lifecycle_status?", "limit?", "offset?"]
    output: Room[]
    side_effects: []

  - method: POST
    path: "/hotel/rooms/{id}/clean"
    description: "Mark a DIRTY room as VACANT_CLEAN"
    roles: [HousekeepingStaff]
    code: 200
    input: []
    output: Room
    side_effects: ["Room.housekeeping_status DIRTY -> VACANT_CLEAN"]

  - method: POST
    path: "/hotel/rooms/{id}/out-of-service"
    description: "Mark a Room operational_status as OUT_OF_ORDER"
    roles: [HousekeepingStaff]
    code: 200
    input: []
    output: Room
    side_effects: ["Room.operational_status IN_SERVICE -> OUT_OF_ORDER; covering MaintenanceBlock SCHEDULED -> ACTIVE"]

  - method: POST
    path: "/hotel/rooms/{id}/return-to-service"
    description: "Mark a Room operational_status as IN_SERVICE"
    roles: [HousekeepingStaff]
    code: 200
    input: []
    output: Room
    side_effects: ["Room.operational_status OUT_OF_ORDER -> IN_SERVICE"]

  # --- MaintenanceBlock ---
  - method: POST
    path: "/hotel/maintenance-blocks"
    description: "Schedule a maintenance block on a room (half-open [start, end))"
    roles: [HousekeepingStaff, PlatformAdmin]
    code: 201
    input: [room_id, start_date, end_date, reason]
    output: MaintenanceBlock
    side_effects: ["If now() in [start_date, end_date): cascade Room.operational_status -> OUT_OF_ORDER and block.status -> ACTIVE"]

  - method: POST
    path: "/hotel/maintenance-blocks/{id}/release"
    description: "Manually release an ACTIVE maintenance block"
    roles: [HousekeepingStaff, PlatformAdmin]
    code: 200
    input: []
    output: MaintenanceBlock
    side_effects: ["MaintenanceBlock.status -> RELEASED; cascade Room.operational_status -> IN_SERVICE if no other ACTIVE block; Room.housekeeping_status -> DIRTY"]

  - method: POST
    path: "/hotel/maintenance-blocks/{id}/cancel"
    description: "Cancel a SCHEDULED maintenance block"
    roles: [HousekeepingStaff, PlatformAdmin]
    code: 200
    input: []
    output: MaintenanceBlock
    side_effects: ["MaintenanceBlock.status -> CANCELLED"]

  # --- Channel ---
  - method: POST
    path: "/hotel/channels"
    description: "Create a distribution channel"
    roles: [PlatformAdmin]
    code: 201
    input: [code, channel_type, commission_basis_points, priority_rank]
    output: Channel
    side_effects: []

  - method: GET
    path: "/hotel/channels"
    description: "List channels"
    roles: [PlatformAdmin, RevenueAnalyst, RevenueManager, ReservationsAgent]
    code: 200
    input: ["channel_type?", "status?", "limit?", "offset?"]
    output: Channel[]
    side_effects: []

  # --- RatePlan ---
  - method: POST
    path: "/hotel/rate-plans"
    description: "Create a rate plan scoped to one room type"
    roles: [PlatformAdmin, RevenueManager]
    code: 201
    input: [code, room_type_id, refund_tier_code, modification_allowed]
    output: RatePlan
    side_effects: []

  - method: POST
    path: "/hotel/channel-rate-plan-mappings"
    description: "Map a rate plan to a channel with an inventory share"
    roles: [PlatformAdmin, RevenueManager]
    code: 201
    input: [channel_id, rate_plan_id, inventory_share_basis_points]
    output: ChannelRatePlanMapping
    side_effects: []

  # --- RateOverride ---
  - method: POST
    path: "/hotel/rate-overrides"
    description: "Create a rate override (DRAFT)"
    roles: [RevenueAnalyst, RevenueManager]
    code: 201
    input: [room_type_id, stay_date, proposed_rate_cents, recommendation_source]
    output: RateOverride
    side_effects: []

  - method: POST
    path: "/hotel/rate-overrides/{id}/submit"
    description: "Submit DRAFT rate override for approval"
    roles: [RevenueAnalyst]
    code: 200
    input: []
    output: RateOverride
    side_effects: ["RateOverride.status DRAFT -> PENDING_APPROVAL"]

  - method: POST
    path: "/hotel/rate-overrides/{id}/approve"
    description: "Approve a PENDING_APPROVAL rate override"
    roles: [RevenueManager]
    code: 200
    input: []
    output: RateOverride
    side_effects:
      - "RateOverride.status PENDING_APPROVAL -> APPROVED; applied_rate_cents = proposed_rate_cents"
      - "Cascade prior APPROVED override on same (room_type_id, stay_date) -> SUPERSEDED"
      - "Cascade rate_parity_check across enabled ChannelRatePlanMappings; emit AuditLog RATE_PARITY_VIOLATION_DETECTED on violation"
      - "Emit AuditLog RATE_OVERRIDE_APPROVED"

  - method: POST
    path: "/hotel/rate-overrides/{id}/reject"
    description: "Reject a PENDING_APPROVAL rate override"
    roles: [RevenueManager]
    code: 200
    input: []
    output: RateOverride
    side_effects: ["RateOverride.status PENDING_APPROVAL -> REJECTED; emit AuditLog RATE_OVERRIDE_REJECTED"]

  - method: POST
    path: "/hotel/rate-overrides/{id}/withdraw"
    description: "Withdraw a PENDING_APPROVAL rate override back to DRAFT (revision loop)"
    roles: [RevenueAnalyst]
    code: 200
    input: []
    output: RateOverride
    side_effects: ["RateOverride.status PENDING_APPROVAL -> DRAFT"]

  # --- OverbookingPolicy ---
  - method: POST
    path: "/hotel/overbooking-policies"
    description: "Create an overbooking policy for (room_type, date)"
    roles: [RevenueManager]
    code: 201
    input: [room_type_id, stay_date, overbook_ratio_basis_points, estimated_no_show_probability_basis_points, walkout_compensation_cents]
    output: OverbookingPolicy
    side_effects: ["Any prior ACTIVE OverbookingPolicy on same (room_type_id, stay_date) -> SUPERSEDED"]

  - method: GET
    path: "/hotel/overbooking-policies/{room_type_id}/{stay_date}/walkout-cost-estimate"
    description: "Read forward-looking estimated walkout cost for a (room_type, date)"
    roles: [RevenueAnalyst, RevenueManager]
    code: 200
    input: []
    output: "object: { room_type_id, stay_date, expected_walkouts, estimated_cost_cents }"
    side_effects: []

  # --- Reservation ---
  - method: POST
    path: "/hotel/reservations"
    description: "Create a Reservation in PENDING"
    roles: [ReservationsAgent, Guest]
    code: 201
    input: [guest_name, room_type_id, rate_plan_id, channel_id, check_in_date, check_out_date]
    output: Reservation
    side_effects: []

  - method: GET
    path: "/hotel/reservations"
    description: "List reservations (filter by booking_status, channel_id, room_type_id, check_in_date_from, check_in_date_to)"
    roles: [ReservationsAgent, FrontDeskClerk, RevenueAnalyst, RevenueManager, PlatformAdmin]
    code: 200
    input: ["booking_status?", "channel_id?", "room_type_id?", "check_in_date_from?", "check_in_date_to?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: GET
    path: "/hotel/reservations/{id}"
    description: "Read a reservation"
    roles: [ReservationsAgent, FrontDeskClerk, RevenueAnalyst, RevenueManager, PlatformAdmin, Guest]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: POST
    path: "/hotel/reservations/{id}/confirm"
    description: "Confirm a PENDING reservation; locks rate"
    roles: [ReservationsAgent]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "channel_inventory_remaining check"
      - "overbooking_limit_check"
      - "booked_total computed and stored"
      - "payment_status -> AUTHORIZED"
      - "If overbooking accepted: emit AuditLog OVERBOOKING_ACCEPTED"

  - method: POST
    path: "/hotel/reservations/{id}/modify"
    description: "Modify a CONFIRMED reservation's dates"
    roles: [ReservationsAgent, Guest]
    code: 200
    input: [check_in_date, check_out_date, "version?"]
    output: Reservation
    side_effects:
      - "Re-run channel_inventory_remaining and overbooking_limit_check"
      - "Recompute booked_total"
      - "Increment version"

  - method: POST
    path: "/hotel/reservations/{id}/cancel"
    description: "Cancel a PENDING or CONFIRMED reservation; computes refund"
    roles: [ReservationsAgent, Guest]
    code: 200
    input: []
    output: Reservation
    side_effects: ["refund_amount computed; payment_status updated"]

  - method: POST
    path: "/hotel/reservations/{id}/check-in"
    description: "Check the guest into a specific Room"
    roles: [FrontDeskClerk]
    code: 200
    input: [room_id]
    output: Reservation
    side_effects: ["Room.housekeeping_status VACANT_CLEAN -> OCCUPIED; payment_status -> CAPTURED"]

  - method: POST
    path: "/hotel/reservations/{id}/check-out"
    description: "Check the guest out"
    roles: [FrontDeskClerk]
    code: 200
    input: []
    output: Reservation
    side_effects: ["Room.housekeeping_status OCCUPIED -> DIRTY; channel_commission_settlement computed"]

  - method: POST
    path: "/hotel/reservations/{id}/walk-out"
    description: "Execute walk-out workflow at intended arrival when no room available"
    roles: [FrontDeskClerk]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "walkout_compensation_actual computed and stored"
      - "payment_status -> REFUNDED_FULL"
      - "Emit AuditLog WALKOUT_EXECUTED"

  - method: POST
    path: "/hotel/reservations/{id}/dispute"
    description: "Open a dispute against a NO_SHOW or CANCELLED reservation's penalty"
    roles: [Guest, ReservationsAgent]
    code: 200
    input: []
    output: Reservation
    side_effects: ["Reservation.dispute_status NONE -> OPEN"]

  - method: POST
    path: "/hotel/reservations/{id}/resolve-dispute"
    description: "Resolve an OPEN dispute in favor of guest (refund) or hotel (no refund)"
    roles: [PlatformAdmin]
    code: 200
    input: [resolution]   # "GUEST" | "HOTEL"
    output: Reservation
    side_effects:
      - "If resolution == GUEST: refund_amount_cents = no_show_charge_cents OR booked_total_cents (depending on prior state); payment_status -> REFUNDED_FULL; dispute_status -> RESOLVED_GUEST"
      - "If resolution == HOTEL: no monetary change; dispute_status -> RESOLVED_HOTEL"

  # --- AuditLog ---
  - method: GET
    path: "/hotel/audit-logs"
    description: "List audit log events (filter by event_type, subject_entity, subject_id, occurred_at_from/to)"
    roles: [PlatformAdmin, RevenueManager]
    code: 200
    input: ["event_type?", "subject_entity?", "subject_id?", "occurred_at_from?", "occurred_at_to?", "limit?", "offset?"]
    output: AuditLog[]
    side_effects: []

  # --- Test-driving system endpoints ---
  - method: POST
    path: "/_clock/advance"
    description: "Test-only: advance the server's logical clock to drive time-gated transitions (NO_SHOW, MaintenanceBlock activation/release)"
    roles: [PlatformAdmin]
    code: 200
    input: [new_now]   # ISO 8601 datetime
    output: "object: { now: ISO8601, transitions_triggered: [{entity, id, from, to}] }"
    side_effects:
      - "Reservation CONFIRMED -> NO_SHOW (when now > check_in_date + 24h)"
      - "MaintenanceBlock SCHEDULED -> ACTIVE / ACTIVE -> RELEASED at boundaries"

  - method: GET
    path: "/_clock"
    description: "Read current logical clock"
    roles: [PlatformAdmin, RevenueAnalyst, RevenueManager, ReservationsAgent, FrontDeskClerk, HousekeepingStaff, Guest]
    code: 200
    input: []
    output: "object: { now: ISO8601 }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-Role or X-User-ID missing"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not authorized for this endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced id does not exist"

  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Body-referenced FK id does not exist or is not ACTIVE where required"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Entity is not in a state from which the requested transition is allowed"

  - id: ERR_MODIFICATION_NOT_ALLOWED
    http: 409
    condition: "RatePlan.modification_allowed == false on Reservation.modify"

  - id: ERR_MODIFICATION_TOO_LATE
    http: 409
    condition: "Reservation.modify within 24h of check_in_date and channel_type != DIRECT"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Approver X-User-ID equals submitter X-User-ID on RateOverride approve/reject"

  - id: ERR_ROOM_UNAVAILABLE
    http: 409
    condition: "Target Room not VACANT_CLEAN, not IN_SERVICE, or under an active/scheduled MaintenanceBlock"

  - id: ERR_ROOM_TYPE_MISMATCH
    http: 422
    condition: "Room.room_type_id != Reservation.room_type_id at check-in"

  - id: ERR_RATE_PLAN_NOT_DISTRIBUTED
    http: 422
    condition: "RatePlan not mapped to the requested channel (or mapping disabled), or RatePlan.room_type_id mismatch"

  - id: ERR_MAINTENANCE_OVERLAP
    http: 409
    condition: "MaintenanceBlock half-open interval overlaps another non-cancelled block on the same Room"

  - id: ERR_ROOM_CURRENTLY_OCCUPIED
    http: 409
    condition: "MaintenanceBlock create attempted on a Room with housekeeping_status == OCCUPIED"

  - id: ERR_DUPLICATE_PRIORITY_RANK
    http: 409
    condition: "Channel.priority_rank already taken by another ACTIVE channel"

  - id: ERR_INVENTORY_SHARE_EXCEEDED
    http: 422
    condition: "Sum of inventory_share_basis_points across mappings of a rate_plan would exceed 10000"

  - id: ERR_INVENTORY_EXHAUSTED
    http: 409
    condition: "Per-channel inventory share for at least one night reduced to < 1 by candidate reservation"

  - id: ERR_OVERBOOKING_LIMIT_EXCEEDED
    http: 409
    condition: "Cumulative reservations across channels for a (room_type, night) would exceed physical_capacity + floor(physical_capacity * overbook_ratio / 10000)"

  - id: ERR_OVERRIDE_ALREADY_PENDING
    http: 409
    condition: "Another DRAFT or PENDING_APPROVAL RateOverride exists for the same (room_type_id, stay_date)"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC version supplied does not match current entity version"

  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit out of [1,100] or offset < 0"

  - id: ERR_INVALID_INPUT
    http: 422
    condition: "Body field has wrong type, fails declared bounds, or is missing where required (e.g., end_date <= start_date, base_rate_cents < 1000)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Hotel IT/operations admin — manages room types, rooms, channels, performs dispute resolution, drives test clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /hotel/room-types"
      - "POST /hotel/rooms"
      - "POST /hotel/channels"
      - "POST /hotel/reservations/{id}/resolve-dispute"
      - "POST /_clock/advance"
    shared_operations:
      - "GET /hotel/audit-logs (with RevenueManager)"
      - "POST /hotel/maintenance-blocks (with HousekeepingStaff)"
      - "POST /hotel/rate-plans (with RevenueManager)"

  - name: RevenueAnalyst
    description: "Proposes rate overrides; cannot approve own"
    identity: "opaque"
    exclusive_operations:
      - "POST /hotel/rate-overrides/{id}/submit"
      - "POST /hotel/rate-overrides/{id}/withdraw"
    shared_operations:
      - "POST /hotel/rate-overrides (with RevenueManager)"
      - "GET /hotel/overbooking-policies/{room_type_id}/{stay_date}/walkout-cost-estimate (with RevenueManager)"

  - name: RevenueManager
    description: "Approves rate overrides; configures rate plans, overbooking policies, channel mappings"
    identity: "opaque"
    exclusive_operations:
      - "POST /hotel/rate-overrides/{id}/approve"
      - "POST /hotel/rate-overrides/{id}/reject"
      - "POST /hotel/overbooking-policies"
    shared_operations:
      - "POST /hotel/rate-plans (with PlatformAdmin)"
      - "POST /hotel/channel-rate-plan-mappings (with PlatformAdmin)"
      - "GET /hotel/audit-logs (with PlatformAdmin)"

  - name: ReservationsAgent
    description: "Books, modifies, cancels reservations on behalf of guests; not present at check-in/out"
    identity: "opaque"
    exclusive_operations:
      - "POST /hotel/reservations/{id}/confirm"
    shared_operations:
      - "POST /hotel/reservations (with Guest)"
      - "POST /hotel/reservations/{id}/modify (with Guest)"
      - "POST /hotel/reservations/{id}/cancel (with Guest)"
      - "POST /hotel/reservations/{id}/dispute (with Guest)"

  - name: FrontDeskClerk
    description: "Performs check-in, check-out, and walk-out at the property"
    identity: "opaque"
    exclusive_operations:
      - "POST /hotel/reservations/{id}/check-in"
      - "POST /hotel/reservations/{id}/check-out"
      - "POST /hotel/reservations/{id}/walk-out"
    shared_operations:
      - "GET /hotel/reservations (with multiple roles)"

  - name: HousekeepingStaff
    description: "Cleans rooms, marks operational status, manages maintenance blocks"
    identity: "opaque"
    exclusive_operations:
      - "POST /hotel/rooms/{id}/clean"
      - "POST /hotel/rooms/{id}/out-of-service"
      - "POST /hotel/rooms/{id}/return-to-service"
    shared_operations:
      - "POST /hotel/maintenance-blocks (with PlatformAdmin)"
      - "POST /hotel/maintenance-blocks/{id}/release (with PlatformAdmin)"
      - "POST /hotel/maintenance-blocks/{id}/cancel (with PlatformAdmin)"

  - name: Guest
    description: "End user (guest) — can self-serve booking, modification, cancellation, dispute via portal"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /hotel/reservations (with ReservationsAgent)"
      - "POST /hotel/reservations/{id}/modify (with ReservationsAgent)"
      - "POST /hotel/reservations/{id}/cancel (with ReservationsAgent)"
      - "POST /hotel/reservations/{id}/dispute (with ReservationsAgent)"
      - "GET /hotel/reservations/{id} (own reservation only — server enforces by guest_name match is NOT used; instead, all roles can read by id; cross-tenant isolation is out of scope)"
