  - section: rbac
    instances:

      - name: the_presiding_officer_exercises_the_gavel_operations_no_other_role_holds
        claim_type: exclusive_operation_permitted
        grounds: ["roles[PresidingOfficer].exclusive_operations", "endpoints[POST /clerk/meetings/{meeting_id}/convene]", "endpoints[POST /clerk/meetings/{meeting_id}/adjourn]", "endpoints[POST /clerk/instruments/{instrument_id}/veto]"]
        distinguishing_aspect: "All three of the PresidingOfficer's exclusive operations succeed for that role on one meeting — convene, adjourn and the clerical GETs it shares — even though the same actor is barred from every write on the record itself."
        test_recipe:
          setup: ["A NOTICED meeting with a posted one-item packet."]
          setup_api_calls:
            - call: "POST /clerk/venues"
