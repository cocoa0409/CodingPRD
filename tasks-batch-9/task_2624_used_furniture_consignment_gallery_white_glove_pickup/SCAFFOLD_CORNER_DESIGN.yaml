              as: GalleryManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "00000000-0000-4000-8000-000000000000", sequence: 1, start_day_offset: 0, markdown_pct: 0.15, min_price_cents: 0 }
