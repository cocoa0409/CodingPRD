  # ===========================================================================
  # Rule 6 — boundary_precision_check (2 instances, different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: nights_exactly_at_max_allowed
        grounds:
          - calculations.temp_housing_charge
          - errors[ERR_NIGHTS_LIMIT_EXCEEDED]
          - entities.ServiceBooking.fields.nights
        distinguishing_aspect: |
          Metric: night count. nights == temp_housing_max_nights (30) is allowed
          (<= semantics); nights == 31 is rejected with
          ERR_NIGHTS_LIMIT_EXCEEDED. Reached via POST /service-bookings —
          a different metric and endpoint from the repayment-balance sibling.
        test_recipe:
          setup:
            - "MANAGER/DOMESTIC/RENTER policy (temp_housing_max_nights 30, temp_housing_cap_cents 300000); case IN_PROGRESS"
