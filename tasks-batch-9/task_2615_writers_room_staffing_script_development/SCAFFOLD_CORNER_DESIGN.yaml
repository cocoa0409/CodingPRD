            - "Episode.${ep1}.clearance_posture == PENDING after trigger call 1"
            - "After trigger call 2: decided_item_count == 2, risk_score == 0, ClearanceReview.${cr}.posture == CLEARED and Episode.${ep1}.clearance_posture == CLEARED"
            - "Season.${se}.ready_script_count == 1, coverage_gap == 0 and coverage_posture == COVERED (EP1 is READY and CLEARED)"

      - name: the_arbitration_panel_stays_in_panel_voting_across_all_three_ballots
        claim_type: valid_transition
        grounds:
          - state_machines.CreditArbitration.transitions.STATEMENTS_OPEN_to_PANEL_VOTING
          - state_machines.CreditArbitration.transitions.PANEL_VOTING_to_PANEL_VOTING
          - entities.CreditArbitration.fields.vote_ledger
          - entities.CreditArbitration.fields.concurrence_pct
        distinguishing_aspect: |
          The first ballot advances STATEMENTS_OPEN -> PANEL_VOTING and the next two are self-loops, so the
          status must NOT auto-determine on the third ballot; leading_writer_id and concurrence_pct are
          nevertheless recomputed after every ballot, which makes the running values observable: the first
          ballot is a 50/50 tie whose leader is decided by the earlier CreditSubmission.created_at, the
          second ballot moves the lead to the other writer on a 45/55 mean, and the third leaves the lead
          alone - with the concurrence at 1.0 throughout, because every ballot sits inside the 10-point
          band around the leader's mean.
        test_recipe:
          setup:
            - "Arbitration ARB on EP1 with participants [W1, W2] and arbiters AR1, AR2, AR3, in status STATEMENTS_OPEN."
            - "Provisional shares from the close were W1 67 / W2 33; W1's submission was created first."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W2
            - *C_SE
            - *C_AW1
            - *C_AW2
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_GRV
            - *C_S2
            - *C_ACC2
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - *C_MLIST
            - *C_D1
            - *C_D2
            - *C_D3
            - *C_APP1
            - *C_GEP
            - *C_A2
            - *C_MLIST2
            - *C_D2A
            - *C_APP2
            - *C_SUB1
            - *C_SUB2
            - *C_CLOSE
            - *C_AR1
            - *C_AR2
            - *C_AR3
            - *C_ARBIT
          trigger:
            - &C_V1
              call: "POST /credit-arbitrations/${arb}/votes"
              payload: { vote_shares: { "${w1}": 50, "${w2}": 50 } }
              as: Writer
              as_user_id: "${ar1}"
            - &C_V2
              call: "POST /credit-arbitrations/${arb}/votes"
              payload: { vote_shares: { "${w1}": 40, "${w2}": 60 } }
              as: Writer
              as_user_id: "${ar2}"
            - &C_V3
              call: "POST /credit-arbitrations/${arb}/votes"
