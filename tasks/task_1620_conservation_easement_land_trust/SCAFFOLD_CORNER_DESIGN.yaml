# =============================================================================
# §1.9 Scaffold Corner Design — task_1620_conservation_easement_land_trust
# Breadth coverage of every §1.1–§1.7 claim not already probed by §1.8.
# Standard matrix literal: { RESIDENTIAL_CONSTRUCTION: PROHIBITED,
#   AGRICULTURE: PERMITTED, TIMBER_HARVEST: DISCRETIONARY,
#   ROAD_CONSTRUCTION: DISCRETIONARY, COMMERCIAL_RECREATION: PROHIBITED,
#   HUNTING: PERMITTED, SUBDIVISION: PROHIBITED, CELL_TOWER: PROHIBITED }
# Default logical clock at server start: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_easement_applies_defaults_and_initial_state
        claim_type: creation
        grounds: [entities.Easement, state_machines.Easement]
        distinguishing_aspect: "POST with only required fields yields status DRAFT, posture GOOD_STANDING, monitoring_interval_months default 12, version 1, recorded_on null."
        test_recipe:
          setup: ["empty database; clock at default"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-DEF", grantor_name: "G", parcel_acreage: 320, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id, st: $.data.status, posture: $.data.posture, iv: $.data.monitoring_interval_months, ver: $.data.version, rec: $.data.recorded_on } }
          trigger:
            - { call: "GET /stewardship/easements/${e_id}", payload: {}, as: TrustAdmin }
          assert:
            - "st == DRAFT and posture == GOOD_STANDING"
            - "iv == 12 (default applied when monitoring_interval_months omitted)"
            - "ver == 1 and rec == null"
            - "id is a server-minted UUID with no type prefix"

      - name: create_easement_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.Easement, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting parcel_acreage (a required input with no default) is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-BAD", grantor_name: "G", permitted_use_matrix: { AGRICULTURE: PERMITTED } }, as: TrustAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST with http 400"

      - name: easement_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, entities.Easement]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more per the fixed envelope."
        test_recipe:
          setup: ["two easements exist"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-P1", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED } }, as: TrustAdmin, captures: { p1: $.data.id } }
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-P2", grantor_name: "G", parcel_acreage: 200, permitted_use_matrix: { AGRICULTURE: PERMITTED } }, as: TrustAdmin, captures: { p2: $.data.id } }
          trigger:
            - { call: "GET /stewardship/easements", payload: { limit: 1, offset: 0 }, as: TrustAdmin }
          assert:
            - "response envelope carries meta.api_request_id, meta.api_request_timestamp, response_type == array"
            - "data has exactly 1 item; pagination fields total_count == 2 and has_more == true"
            - "a second call with limit=1&offset=1 returns the other easement and has_more == false"

      - name: get_easement_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_EASEMENT_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields the typed 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /stewardship/easements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: TrustAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EASEMENT_NOT_FOUND with http 404 and data.message present"

      - name: get_violation_not_found_returns_typed_404
        claim_type: not_found
        grounds: ["errors[ERR_VIOLATION_NOT_FOUND]"]
        distinguishing_aspect: "The typed-404 scheme extends to child resources, not just easements."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /stewardship/violations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: StewardshipCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VIOLATION_NOT_FOUND with http 404"

      - name: initial_landowner_defaults_active
        claim_type: defaults
        grounds: [entities.Landowner, state_machines.Landowner]
        distinguishing_aspect: "Initial landowner creation sets status ACTIVE, acquired_on = clock date, predecessor_landowner_id null, and back-fills Easement.current_landowner_id."
        test_recipe:
          setup: ["DRAFT easement exists"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-LO", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
          trigger:
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "Owner A", contact_email: "a@x.com" }, as: TrustAdmin, captures: { lo_id: $.data.id, st: $.data.status, acq: $.data.acquired_on, pred: $.data.predecessor_landowner_id } }
            - { call: "GET /stewardship/easements/${e_id}", payload: {}, as: TrustAdmin, captures: { cur: $.data.current_landowner_id } }
          assert:
            - "st == ACTIVE, pred == null, acq == 2026-08-01 (default clock date)"
            - "Easement.${e_id}.current_landowner_id == ${lo_id}"

      - name: endowment_transaction_immutable_ledger_shape
        claim_type: immutability
        grounds: [entities.EndowmentTransaction]
        distinguishing_aspect: "EndowmentTransaction has common_fields: false — entries expose id and created_at but no version/updated_at, and no update/delete endpoint exists for the ledger."
        test_recipe:
          setup: ["a fund with one contribution"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-TX", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/endowment-funds", payload: { easement_id: "${e_id}", spending_rate_bps: 400, principal_floor_cents: 1000 }, as: TrustAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /stewardship/endowment-funds/${f_id}/contributions", payload: { amount_cents: 100000 }, as: TrustAdmin }
          trigger:
            - { call: "GET /stewardship/endowment-funds/${f_id}/transactions", payload: {}, as: TrustAdmin, captures: { t0: "$.data[0].txn_type", t0u: "$.data[0].units", t0a: "$.data[0].amount_cents" } }
          assert:
            - "exactly one transaction: txn_type == CONTRIBUTION, amount_cents == 100000, units == 1000.0000"
            - "the transaction object has id and created_at but no version or updated_at field (common_fields: false)"

  - section: state_machines
    instances:
      - name: baseline_revision_loop_increments_review_round
        claim_type: valid_transition
        grounds: [state_machines.BaselineReport]
        distinguishing_aspect: "The DRAFT->SUBMITTED->REVISION_REQUESTED->SUBMITTED->ACCEPTED loop is cyclic and review_round counts submissions (1 then 2)."
        test_recipe:
          setup: ["DRAFT easement with landowner and baseline"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-BL", grantor_name: "G", parcel_acreage: 500, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 5 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
          trigger:
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator, captures: { r1: $.data.review_round, s1: $.data.status } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/request-revision", payload: { revision_notes: "add photos" }, as: TrustBoardReviewer, captures: { s2: $.data.status } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator, captures: { r2: $.data.review_round, s3: $.data.status } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1", captures: { s4: $.data.status } }
          assert:
            - "r1 == 1 and s1 == SUBMITTED; s2 == REVISION_REQUESTED; r2 == 2 and s3 == SUBMITTED; s4 == ACCEPTED"

      - name: baseline_submit_incomplete_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.BaselineReport.DRAFT_to_SUBMITTED, "errors[ERR_INCOMPLETE_BASELINE]"]
        distinguishing_aspect: "500-acre parcel requires max(4, ceil(500/100)) = 5 photo points; submitting with 4 fails."
        test_recipe:
          setup: ["DRAFT easement (500 ac) with a baseline carrying photo_point_count 4"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-INC", grantor_name: "G", parcel_acreage: 500, permitted_use_matrix: { AGRICULTURE: PERMITTED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 4 }, as: StewardshipCoordinator, captures: { br_id: $.data.id, req: $.data.required_photo_points } }
          trigger:
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "required_photo_points == 5"
            - "err == ERR_INCOMPLETE_BASELINE (422); baseline stays DRAFT"

      - name: baseline_accept_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.BaselineReport, "errors[ERR_INVALID_BASELINE_STATE]"]
        distinguishing_aspect: "accept is defined only from SUBMITTED; from DRAFT it returns ERR_INVALID_BASELINE_STATE."
        test_recipe:
          setup: ["DRAFT baseline"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-BS", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 4 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
          trigger:
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_BASELINE_STATE (409)"

      - name: visit_complete_after_cancel_rejected
        claim_type: invalid_transition
        grounds: [state_machines.MonitoringVisit, "errors[ERR_INVALID_VISIT_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: complete after cancel returns ERR_INVALID_VISIT_STATE."
        test_recipe:
          setup: ["RECORDED easement with a SCHEDULED visit that is then cancelled"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-VC", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 4 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin }
            - { call: "POST /stewardship/monitoring-visits", payload: { easement_id: "${e_id}", monitor_user_id: "mon-1", window_start_on: "2026-09-01", window_end_on: "2026-09-10" }, as: StewardshipCoordinator, captures: { mv_id: $.data.id } }
            - { call: "POST /stewardship/monitoring-visits/${mv_id}/cancel", payload: {}, as: StewardshipCoordinator }
          trigger:
            - { call: "POST /stewardship/monitoring-visits/${mv_id}/complete", payload: { actual_visit_on: "2026-09-05", findings_summary: "f", stewardship_cost_cents: 1000 }, as: FieldMonitor, as_user_id: "mon-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_VISIT_STATE (409); visit remains CANCELLED"

      - name: violation_resolve_from_open_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Violation, "errors[ERR_INVALID_VIOLATION_STATE]"]
        distinguishing_aspect: "resolve is defined only from CURE_IN_PROGRESS; from OPEN it returns ERR_INVALID_VIOLATION_STATE."
        test_recipe:
          setup: ["RECORDED easement with an OPEN violation"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-VR", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 4 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin }
            - { call: "POST /stewardship/violations", payload: { easement_id: "${e_id}", detected_by_user_id: "coord-9", violation_type: SUBDIVISION, severity: MINOR, detected_on: "2026-08-02" }, as: StewardshipCoordinator, captures: { v_id: $.data.id } }
          trigger:
            - { call: "POST /stewardship/violations/${v_id}/resolve", payload: {}, as: StewardshipCoordinator, as_user_id: "coord-2", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_VIOLATION_STATE (409); violation remains OPEN"

      - name: manual_escalate_from_cure_in_progress_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Violation.NOTICE_SENT_to_ESCALATED, "errors[ERR_INVALID_VIOLATION_STATE]"]
        distinguishing_aspect: "The manual escalate endpoint only fires from NOTICE_SENT; once the landowner started curing, manual escalation is rejected (only the clock sweep may escalate from CURE_IN_PROGRESS)."
        test_recipe:
          setup: ["RECORDED easement; violation NOTICE_SENT then CURE_IN_PROGRESS"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-ME", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin, captures: { lo_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 4 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin }
            - { call: "POST /stewardship/violations", payload: { easement_id: "${e_id}", detected_by_user_id: "coord-9", violation_type: SUBDIVISION, severity: MINOR, detected_on: "2026-08-02" }, as: StewardshipCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /stewardship/violations/${v_id}/send-notice", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/violations/${v_id}/start-cure", payload: {}, as: Landowner, as_user_id: "${lo_id}" }
          trigger:
            - { call: "POST /stewardship/violations/${v_id}/escalate", payload: {}, as: StewardshipCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_VIOLATION_STATE (409); violation remains CURE_IN_PROGRESS"

      - name: amendment_approve_after_withdraw_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AmendmentRequest, "errors[ERR_INVALID_AMENDMENT_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal; any further transition returns ERR_INVALID_AMENDMENT_STATE."
        test_recipe:
          setup: ["RECORDED easement with a SUBMITTED amendment that is then withdrawn"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-AW", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 4 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin, captures: { ev: $.data.version } }
            - { call: "POST /stewardship/amendment-requests", payload: { easement_id: "${e_id}", expected_easement_version: "${ev}", submitted_by_user_id: "coord-1", requested_changes: [ { use_type: SUBDIVISION, new_level: DISCRETIONARY } ], affected_acreage: 10 }, as: StewardshipCoordinator, captures: { am_id: $.data.id } }
            - { call: "POST /stewardship/amendment-requests/${am_id}/withdraw", payload: {}, as: StewardshipCoordinator }
          trigger:
            - { call: "POST /stewardship/amendment-requests/${am_id}/approve", payload: {}, as: StewardshipCoordinator, as_user_id: "coord-2", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_AMENDMENT_STATE (409); amendment remains WITHDRAWN"

      - name: succession_acknowledge_after_clock_expiry_rejected
        claim_type: side_effect_execution
        grounds: [state_machines.SuccessionNotice.NOTICE_GIVEN_to_EXPIRED, "errors[ERR_INVALID_NOTICE_STATE]", calculations.cure_deadline]
        distinguishing_aspect: "The clock sweep expires a NOTICE_GIVEN succession notice once clock date > ack_deadline_on (notice 2026-08-01 + 45 = 2026-09-15); a later acknowledge hits ERR_INVALID_NOTICE_STATE."
        test_recipe:
          setup: ["RECORDED easement with ACTIVE landowner; succession notice given at default clock (ack deadline 2026-09-15)"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-SX", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin, captures: { lo_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 4 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin }
            - { call: "POST /stewardship/succession-notices", payload: { easement_id: "${e_id}", successor_owner_name: "B", successor_contact_email: "b@x.com", transfer_on: "2026-10-01" }, as: Landowner, as_user_id: "${lo_id}", captures: { sn_id: $.data.id, ack_dl: $.data.ack_deadline_on } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T00:00:00Z" }, as: TrustAdmin }
          trigger:
            - { call: "POST /stewardship/succession-notices/${sn_id}/acknowledge", payload: {}, as: TrustAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /stewardship/succession-notices/${sn_id}", payload: {}, as: TrustAdmin, captures: { sn_st: $.data.status } }
          assert:
            - "ack_dl == 2026-09-15"
            - "after clock 2026-09-16 the sweep set sn_st == EXPIRED"
            - "err == ERR_INVALID_NOTICE_STATE (409)"

      - name: enforcement_breach_from_proposed_rejected
        claim_type: invalid_transition
        grounds: [state_machines.EnforcementAction, "errors[ERR_INVALID_ENFORCEMENT_STATE]"]
        distinguishing_aspect: "breach is defined only from EXECUTED; from PROPOSED it returns ERR_INVALID_ENFORCEMENT_STATE."
        test_recipe:
          setup: ["RECORDED easement; violation escalated so a PROPOSED enforcement action exists"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-EB", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin }
