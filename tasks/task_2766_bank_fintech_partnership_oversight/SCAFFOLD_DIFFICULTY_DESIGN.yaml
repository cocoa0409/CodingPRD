  - rule_id: transitive_cascade
    instances:
      - name: fund_cascade_flips_reserve_basis_then_posture_then_blocks_the_next_funding
        grounds:
          - state_machines.SettlementBatch.funding_status=UNFUNDED_to_funding_status=FUNDED
          - calculations.settlement_funding_computation
          - calculations.required_reserve_computation
          - calculations.oversight_posture_computation
          - validations[priority=86]
        distinguishing_aspect: |
          A depth-5 chain in which each link is caused strictly by the previous
          link: (1) funding batch A moves gross into settlement_base and debits
          FBO_END_USER by net_to_partner; (2) because FBO_END_USER now holds 0,
          the required_reserve max flips from the end-user-balance branch to the
          trailing-settlement-volume branch; (3) because reserve_funding added
          only 20000 to RESERVE while the requirement rose, reserve_shortfall
          becomes strictly positive; (4) because shortfall > 0, oversight_posture
          escalates OPEN -> HEIGHTENED; (5) because shortfall > 0, funding batch
          B is refused 402 and B's funding_status stays UNFUNDED. The triggering
          transition is a funding_status advance, unlike the second instance
          which is triggered by an alert intake.
