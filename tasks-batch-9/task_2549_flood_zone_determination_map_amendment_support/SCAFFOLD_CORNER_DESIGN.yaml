          assert:
            - "the premature agency-review returns 409 with data.error_id == ERR_INVALID_DISPUTE_STATE: SUBMITTED -> agency-review is not a declared transition"
            - "the provider-review acted by analyst-1 returns 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES, because Determination.${det_a_id}.issued_by_user_id == analyst-1"
            - "the provider-review acted by reviewer-1 returns 200: Dispute.${disp_id}.status == JOINT_AGENCY_REVIEW, .provider_recommendation == UPHOLD_BORROWER, .provider_reviewed_by_user_id == reviewer-1"
            - "Dispute.${disp_id}.agency_concurrence == null and .resolution == null - the provider stage records a recommendation, it does not decide"
            - "Determination.${det_a_id}.status == UNDER_DISPUTE throughout, and the folio's required_coverage_cents == 25000000 is unchanged by either stage"
            - "the agency stage acted by reviewer-1 would now fail priority 9 in turn, because Dispute.provider_reviewed_by_user_id == reviewer-1"

      - name: corner_monitoring_run_with_empty_scope
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/flood-zone/monitoring-runs
        excluded_because:
          difficulty_instance: boundary_precision_check / notice_expiry_strict_instant_and_empty_sweep_zero_counts
          rationale: "The empty-scope success with all counts 0, and the strict response_deadline_at < clock expiry instant, are both asserted there."

  # ===========================================================================
  - section: errors
    instances:
      - name: corner_write_without_acting_user_is_unauthenticated
        claim_type: violation_to_error
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations.priority_1_ERR_UNAUTHENTICATED
        distinguishing_aspect: "The identity gate is the first rung of the ladder and it applies to writes only: the same POST body that succeeds with an acting user returns 401 without one, while every GET is readable anonymously."
        test_recipe:
          setup:
            - "an empty database and the clock at 2026-08-01"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
          trigger:
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL", participation_status: "REGULAR" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
            - call: "GET /flood-zone/communities"
              as: ProviderAnalyst
              captures: { list_row0_code: "$.data[0].community_id_code" }
          assert:
            - "the same POST /flood-zone/communities body sent with the X-User-ID header omitted returns 401 with data.error_id == ERR_UNAUTHENTICATED, and no Community row is created"
            - "the same POST sent with X-User-ID present but X-User-Role omitted also returns 401 ERR_UNAUTHENTICATED - both headers form the identity"
            - "with both headers present the call returns 201 and Community.${c_fl_id} exists"
            - "GET /flood-zone/communities returns 200 with total_count == 1 even with no X-User-ID header, because §1.7 requires the acting user on every request EXCEPT GET"
            - "the 401 is returned ahead of any body validation: the same headerless call with an empty body still reports ERR_UNAUTHENTICATED, not ERR_INVALID_REQUEST"

      - name: corner_role_outside_the_endpoint_roles_is_forbidden
        claim_type: violation_to_error
        grounds:
          - errors.ERR_FORBIDDEN_ROLE
          - validations.priority_3_ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Role authorization is evaluated per endpoint against §1.5's roles list, before existence and before state: a Borrower attempting an AgencyOfficer-only panel write is refused even when the referenced community does not exist."
        test_recipe:
          setup:
            - "one FL community so that the authorized version of the call can succeed"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL", participation_status: "REGULAR" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
          trigger:
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 1, zone_code: "AE", base_flood_elevation_ft: 7.75, effective_date: "2020-06-05T00:00:00Z" }
              as: AgencyOfficer
              captures: { p1_id: $.data.id }
          assert:
            - "the identical body sent with X-User-Role: Borrower returns 403 with data.error_id == ERR_FORBIDDEN_ROLE, because §1.5 lists roles [AgencyOfficer] for POST /flood-zone/map-panels"
            - "sent with X-User-Role: ProviderAnalyst it also returns 403 - panel authorship is exclusive to the agency, not merely restricted to staff"
            - "the Borrower attempt with community_id replaced by a random UUID still returns 403 ERR_FORBIDDEN_ROLE, not 404 ERR_COMMUNITY_NOT_FOUND: priority 3 precedes priority 6"
            - "with X-User-Role: AgencyOfficer the call returns 201 and MapPanel.${p1_id}.revision_status == EFFECTIVE"

      - name: corner_out_of_range_confidence_score_is_invalid_request
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INVALID_REQUEST
          - entities.Property.geocode_confidence_score
        distinguishing_aspect: "A numerically well-typed but out-of-domain value (1.50 against the declared 0.00-1.00 constraint) is a 400 schema failure, not the 422 business refusal that an in-range but low score produces."
        test_recipe:
          setup:
            - "one FL community and one EFFECTIVE panel"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL", participation_status: "REGULAR" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
            - call: "POST /flood-zone/map-panels"
