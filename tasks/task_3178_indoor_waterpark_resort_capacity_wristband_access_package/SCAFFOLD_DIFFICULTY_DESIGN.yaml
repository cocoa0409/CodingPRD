  - rule_id: cross_entity_state_dependency
    instances:

      - name: cabana_confirm_requires_group_confirmed
        grounds:
          - state_machines.CabanaBooking.transitions.HELD_to_BOOKED
          - state_machines.GroupBooking.transitions.PENDING_DEPOSIT_to_CONFIRMED
        distinguishing_aspect: |
          CabanaBooking's HELD to BOOKED transition is gated on GroupBooking.group_status
          reaching CONFIRMED, so the same confirm call is rejected while the group is still
          PENDING_DEPOSIT and accepted after the deposit posts.
        test_recipe:
          setup:
            - "Resort with a cabana held by a group booking that has paid 0 of its 1000-cent deposit requirement"
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Mason", park_capacity_occupancy_units: 30, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { r16_id: "$.data.id" }
            - call: "POST /resorts/${r16_id}/group-bookings"
              payload: { group_kind: "BIRTHDAY", service_date: "2026-09-16", member_count: 2, deposit_paid_cents: 0 }
              as: Group
              as_user_id: "gb-placeholder"
              captures: { gb16_id: "$.data.id" }
            - call: "POST /resorts/${r16_id}/cabanas"
              payload: { cabana_label: "CAB-4", cabana_kind: "PARTY_ROOM", capacity_units: 8 }
              as: platform_ops
              captures: { cab16_id: "$.data.id", cab16_v: "$.data.version" }
            - call: "POST /resorts/${r16_id}/cabana-bookings"
              payload: { cabana_id: "${cab16_id}", group_booking_id: "${gb16_id}", service_date: "2026-09-16", start_minute: 600, end_minute: 720, member_units: 2, expected_cabana_version: "${cab16_v}" }
              as: Group
              as_user_id: "${gb16_id}"
              captures: { cb16_id: "$.data[0].id" }
          trigger:
            - call: "POST /resorts/${r16_id}/cabana-bookings/${cb16_id}/confirm"
              payload: {}
              as: Group
              as_user_id: "${gb16_id}"
              captures: { err16: "$.data.error_id" }
          assert:
            - "${err16} == ERR_CABANA_OCCUPIED"
            - "CabanaBooking.${cb16_id}.cabana_booking_status == HELD"
            - "GroupBooking.${gb16_id}.group_status == PENDING_DEPOSIT"

      - name: activity_confirm_requires_group_confirmed
        grounds:
          - state_machines.ActivityBooking.transitions.PENDING_PAYMENT_to_CONFIRMED
          - state_machines.GroupBooking.transitions.PENDING_DEPOSIT_to_CONFIRMED
        distinguishing_aspect: |
          A second, distinct entity pair — ActivityBooking depends on the same
          GroupBooking.group_status, so the confirm is rejected at PENDING_DEPOSIT and
          succeeds once the group reaches CONFIRMED.
        test_recipe:
          setup:
            - "Resort with an activity booking attached to a group that has not yet met its deposit condition"
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Sandusky", park_capacity_occupancy_units: 30, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { r17_id: "$.data.id" }
            - call: "POST /resorts/${r17_id}/activities"
              payload: { name: "Wolf Walk", tier_code: "VIP", base_price_cents: 2500, capacity_units: 10 }
              as: platform_ops
              captures: { sess17_id: "$.data.id" }
            - call: "POST /resorts/${r17_id}/group-bookings"
              payload: { group_kind: "BIRTHDAY", service_date: "2026-09-17", member_count: 4, deposit_paid_cents: 0 }
              as: Group
              as_user_id: "gb-placeholder"
              captures: { gb17_id: "$.data.id" }
            - call: "POST /resorts/${r17_id}/activity-bookings"
              payload: { activity_session_id: "${sess17_id}", group_booking_id: "${gb17_id}", attendees: 4, reservation_id: null }
              as: Group
              as_user_id: "${gb17_id}"
              captures: { ab17_id: "$.data.id" }
          trigger:
