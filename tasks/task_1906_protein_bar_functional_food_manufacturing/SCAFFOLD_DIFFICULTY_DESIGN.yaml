  - rule_id: resource_temporal_overlap
    instances:
      - name: slot_changeover_buffer_gap_rule
        grounds:
          - validations[priority=20]
          - validations[priority=21]
          - calculations.changeover_level_matrix
        distinguishing_aspect: |
          Interval semantics 1 (half-open + allergen-dependent buffer) on ProductionLine:
          half-open overlap [09:30,11:00) vs [08:00,10:00) is ERR_SLOT_OVERLAP; a touching-but-
          too-close slot at gap 30 min after a PEANUT run is ERR_SLOT_CHANGEOVER_BUFFER_VIOLATION
          (SWAB_VALIDATE buffer 90); exactly gap == 90 succeeds (inclusive >=).
        test_recipe:
          setup:
            - "fixture: PEANUT_FLOUR (PROTEIN, [PEANUT], 0.50), SYRUP, COCOA (FLAVOR, []); lots PFL 100kg + SL 100kg released; AG3 ACTIVE; line LP"
            - "revision RP (PEANUT_FLOUR 30, profile [PEANUT]) APPROVED; runP scheduled 2026-08-05T08:00-10:00Z on LP"
            - "revision R0 (SYRUP 10 + COCOA 5, profile []) APPROVED; run0 created PLANNED"
