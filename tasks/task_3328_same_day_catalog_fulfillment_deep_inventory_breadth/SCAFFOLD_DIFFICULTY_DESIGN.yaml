  # ===========================================================================
  # Rule 6 — boundary-precision checks on different metrics/endpoints
  #   boundary 1: DISTINCT-SKU count, inclusive at the threshold (POST /distribution-centers/{id}/roll_cutoff)
  #   boundary 2: COUNT of lines crossing the handling-fee reduction threshold (POST /orders/{id}/allocate)
  #   boundary 3: damaged-cent trigger, inclusive at the boundary (GET /items/{id})
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: dc_positioning_sku_count_boundary_inclusive
        grounds:
          - calculations.inventory_positioning_decision
          - entities.InventoriedStock.fields.positioning_flag
          - entities.CatalogItem.fields.long_tail
          - endpoints.POST_/distribution-centers/{id}/roll_cutoff
        distinguishing_aspect: "Numeric threshold crossing judged inclusively: two DISTINCT in-stock SKUs at a DC already satisfy in_stock_count >= POSITIONING_SKU_THRESHOLD 2 and set positioning OK, while one in-stock SKU of a long-tail item lands LONG_TAIL_DEFICIT and one in-stock SKU of a non-long-tail item lands UNDERSTOCKED — same metric, so only the count decides the flag."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z (Monday)."
            - "Three DCs, each with a different in-stock SKU census: BOS has two distinct in-stock SKUs (one long-tail, one not); DAL has one in-stock SKU and that item is long_tail true; SEA has one in-stock SKU and that item is long_tail false."
            - "BAC also holds a second SKU row whose on_hand_units is 0, which does not count towards the SKU census (SEA is the DC that exercises this exclusion)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
