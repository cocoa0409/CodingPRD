          rationale: "ERR_BATCH_EMPTY is asserted as the zero-member boundary failure of the named §1.8 instance."

      - name: error_retort_window_conflict_excluded
        claim_type: Temporal validation
        grounds:
          - "errors[ERR_RETORT_WINDOW_CONFLICT]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / overlap_retort_firing_window_halfopen
          rationale: "ERR_RETORT_WINDOW_CONFLICT is asserted by the named §1.8 overlap instance."

      - name: error_viewing_room_conflict_excluded
        claim_type: Temporal validation
        grounds:
