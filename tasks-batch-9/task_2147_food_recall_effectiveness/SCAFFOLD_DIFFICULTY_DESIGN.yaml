          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T23:00:00Z" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "GET /consignees/${c1_id}"
              as: FirmRecallOfficer
