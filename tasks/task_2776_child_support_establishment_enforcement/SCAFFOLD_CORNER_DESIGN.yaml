            - "${n_prin} == 225000 and ${n_cert} == 226125  # 225000 principal plus the statutory 1125"
            - "${n_total} == 3 and ${n_first} == 2026-08-15  # the listing orders by due_date ascending, i.e. reverse insertion order"

      - name: withholding_floors_at_zero_when_the_employer_fee_exceeds_the_cap
        claim_type: threshold
        grounds:
          - "calculations.withholding_amount"
          - "calculations.withholding_amount.note"
          - "validations[priority 41]"
          - "errors[ERR_WITHHOLDING_CAP_EXHAUSTED]"
          - "endpoints[POST /child-support/orders/{order_id}/withholding-orders]"
        distinguishing_aspect: >
          The employer reports three nearly empty paycheques - 835, 834 and 832
          cents of disposable income - against a remittance fee of 500. floor(835 *
          0.60) is 501 so exactly ONE cent of room survives the fee and the IWO
          issues with withholding_amount_cents 1; floor(834 * 0.60) is 500 (0.60 *
          834 is 500.4 and the cap floors, never rounds) so the room is exactly 0
          and priority 41 rejects; 832 gives room -1 and is also rejected, proving
          the max(0, ...) clamp never produces a negative withholding. A cap that
          rounded instead of flooring would let the 834 case through at 1 cent.
        test_recipe:
          setup:
            - "Empty database. Clock pinned to 2026-08-01T00:00:00Z."
            - "CP income 200000, NCP income 300000 VERIFIED_WAGE_RECORD, no second family, two children."
            - "ENTERED order, monthly_obligation_cents 75000, medical 0, and no charges at all so arrears_principal_cents is 0."
            - "One MN employer (EMPLOYER_STATE_CAPS[MN] is null) with remittance_fee_cents 500."
            - "Each attempt re-reads SupportOrder.version immediately beforehand for the expected_order_version guard."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Beatriz Kowalczyk", ssn_last4: "6171", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cpq: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Tomas Kowalczyk", ssn_last4: "6172", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncpq: "$.data.id" }
            - call: "POST /child-support/participants/${ncpq}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cpq}", noncustodial_party_id: "${ncpq}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { caseq: "$.data.id" }
            - call: "POST /child-support/cases/${caseq}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${caseq}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { orderq: "$.data.id" }
            - call: "POST /child-support/orders/${orderq}/guideline-calculation"
              payload: {}
              as: CaseWorker
            - call: "POST /child-support/orders/${orderq}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { monq: "$.data.monthly_obligation_cents" }
            - call: "POST /child-support/employers"
              payload: { legal_name: "Iron Range Castings", fein: "41-0000106", state_code: "MN", pay_frequency: "MONTHLY", remittance_fee_cents: 500 }
              as: ProgramAdmin
              captures: { empq: "$.data.id" }
          trigger:
            - call: "GET /child-support/orders/${orderq}"
              as: CaseWorker
              captures: { vq1: "$.data.version" }
            - call: "POST /child-support/orders/${orderq}/withholding-orders"
              payload: { employer_id: "${empq}", expected_order_version: "${vq1}", reported_disposable_income_cents: 835 }
              as: CaseWorker
              captures: { q_wh: "$.data.withholding_amount_cents", q_cap_pct: "$.data.ccpa_cap_pct", q_cap_amt: "$.data.ccpa_cap_amount_cents", q_req: "$.data.requested_amount_cents", q_ar: "$.data.arrears_recovery_cents", q_fee: "$.data.employer_fee_cents", q_juris: "$.data.jurisdiction_state_code" }
            - call: "GET /child-support/orders/${orderq}"
              as: CaseWorker
              captures: { vq2: "$.data.version" }
            - call: "POST /child-support/orders/${orderq}/withholding-orders"
              payload: { employer_id: "${empq}", expected_order_version: "${vq2}", reported_disposable_income_cents: 834 }
              as: CaseWorker
              captures: { q_err0: "$.data.error_id" }
            - call: "GET /child-support/orders/${orderq}"
              as: CaseWorker
              captures: { vq3: "$.data.version" }
            - call: "POST /child-support/orders/${orderq}/withholding-orders"
              payload: { employer_id: "${empq}", expected_order_version: "${vq3}", reported_disposable_income_cents: 832 }
              as: CaseWorker
              captures: { q_errneg: "$.data.error_id" }
          assert:
            - "${monq} == 75000 and ${q_ar} == 15000  # round_half_up(75000 * 0.20)"
            - "${q_req} == 90000  # 75000 + medical 0 + arrears recovery 15000"
            - "${q_juris} == MN and ${q_cap_pct} == 0.60  # EMPLOYER_STATE_CAPS[MN] is null so the federal base percentage governs; no second family and arrears 0 < 3 * 75000 so no bump"
            - "${q_cap_amt} == 501  # floor(835 * 0.60) == floor(501.0) == 501"
            - "${q_wh} == 1  # max(0, min(90000, 501 - 500)) == 1: the requested 90000 is irrelevant once the fee eats the cap"
            - "${q_fee} == 500  # the fee is charged because withholding_amount_cents > 0"
            - "HTTP status is 409 and ${q_err0} == ERR_WITHHOLDING_CAP_EXHAUSTED  # floor(834 * 0.60) == floor(500.4) == 500, room 0, and priority 41 demands > 0"
            - "HTTP status is 409 and ${q_errneg} == ERR_WITHHOLDING_CAP_EXHAUSTED  # floor(832 * 0.60) == 499, room -1, clamped to 0 by max(0, ...) rather than reported as negative"
            - "${vq2} == ${vq3}  # the rejected attempt left SupportOrder.version untouched"
            - "GET /child-support/withholding-orders?order_id=${orderq} returns total_count 1  # neither rejected attempt persisted an IWO"

      - name: controlling_order_falls_back_to_the_first_issued_order_without_a_home_state_order
        claim_type: topological
        grounds:
          - "calculations.controlling_order_determination"
          - "calculations.controlling_order_determination.input_set"
          - "entities.InterstateReferral.fields.controlling_order_id"
          - "entities.InterstateReferral.fields.controlling_order_state_code"
          - "endpoints[POST /child-support/interstate-referrals/{interstate_referral_id}/registration]"
        distinguishing_aspect: >
          The case carries four orders, three of which are decoys the candidate
          filter must drop: an ENTERED MEDICAL_SUPPORT order from MN with the
          smallest effective_date of all (2026-05-01), a VACATED WI CURRENT_SUPPORT
          order (2026-06-01) and a merely CALCULATED WI CURRENT_SUPPORT order
          (2026-06-15). Only the ENTERED WI CURRENT_SUPPORT order of 2026-07-01 is a
          candidate, so with child_home_state_code MN the home_orders set is EMPTY
          and the else branch - smallest effective_date - selects it and stamps
          controlling_order_state_code WI. Dropping the order_type filter selects
          the MN medical order and reports MN, which would also silently satisfy the
          continuing-exclusive-jurisdiction test in validation priority 17.
        test_recipe:
          setup:
            - "Empty database. Clock pinned to 2026-08-01T00:00:00Z."
            - "CP income 200000, NCP income 300000 VERIFIED_WAGE_RECORD, two children, non-TANF, PRESUMED_MARITAL paternity."
            - "Order M: MEDICAL_SUPPORT, origin MN, effective 2026-05-01, entered (a legal co-existence: priority 22 only compares orders of the SAME order_type)."
            - "Order A: CURRENT_SUPPORT, origin WI, effective 2026-06-01, entered and then VACATED for CLERICAL_ERROR."
            - "Order B: CURRENT_SUPPORT, origin WI, effective 2026-06-15, left in CALCULATED."
            - "Order C: CURRENT_SUPPORT, origin WI, effective 2026-07-01, ENTERED (legal because A is no longer ENTERED)."
            - "A DRAFT RESPONDING referral with other_state_code WI, child_home_state_code MN, transmittal_type ENFORCEMENT."
