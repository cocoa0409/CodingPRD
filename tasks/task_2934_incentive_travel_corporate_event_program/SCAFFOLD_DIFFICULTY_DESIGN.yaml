- rule_id: resource_temporal_overlap
  instances:
  - name: activity_agenda_overlap_uses_closed_transfer_buffer_boundary
    grounds:
    - §1.3 activity_schedule_conflict.formula (both-sided buffer, strict < comparison)
    - §1.3 activity_schedule_conflict.constants (TRANSFER_BUFFER_MINUTES 45)
    - §1.4 priority 24 ERR_ACTIVITY_TIME_CONFLICT
    - §1.5 POST /activity-signups
    - §1.1 OnsiteActivity.start_at, end_at
    distinguishing_aspect: |-
      One participant's agenda intervals are padded by a 45-minute transfer buffer on both sides and compared strictly, so a follow-on activity starting 13:44:00Z after one ending 13:00:00Z is rejected with ERR_ACTIVITY_TIME_CONFLICT while one starting at exactly 13:45:00Z — the buffer boundary itself — is accepted and BOOKED.
    test_recipe:
      setup:
      - Empty database, logical clock at its 2026-08-01T00:00:00Z default.
      - Program ONSITE on budget 5000000 with winner A CONFIRMED and waiver_on_file true.
