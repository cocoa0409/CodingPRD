        distinguishing_aspect: "POST /orders/{id}/line-items with a stale expected_order_version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["DRAFT order at version 1"]
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload: { student_number: "SC006001", full_name: "OCC L", date_of_birth: "2000-01-01", email: "occl@x.edu" }
              as: RegistrarAdmin
              captures: { sid: $.data.id }
            - call: "POST /registrar/recipients"
              payload: { kind: "EMAIL_PDF", display_name: "Self", email_address: "occl@x.edu" }
              as: RegistrarAdmin
