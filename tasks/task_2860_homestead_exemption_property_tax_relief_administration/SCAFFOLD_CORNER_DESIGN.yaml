          setup:
            - "Parcel P-0009 (base_year 2026, base 1000000, market 1200000) assesses to 1000000."
            - "HOMESTEAD_BASIC rank 10 relief 9000 bps -> benefit 900000; AGRICULTURAL_USE rank 40 relief 5000 bps -> benefit 500000."
            - "Taxpayer T holds a CLOSED-ended PRIMARY_RESIDENCE interval [2019-06-01, 2030-01-01) and an open-ended AGRICULTURAL interval from 2019-01-01, so creating the second record supersedes nothing (only open-ended predecessors are truncated)."
