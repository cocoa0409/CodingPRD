            - "the refused execution is inert: ${sd_notice_still} == 'ISSUED', the notice was neither EXECUTED nor SUPERSEDED"
            - "the issuer is not otherwise disabled on the account: ${sd_pay_by_issuer} is non-null and ${sd_pay_fee} == 0, because 1000 cents does not cover the 4497 fee whole and flows on to the past-due installment"
            - "a second analyst completes the cancellation: ${sd_exec_reqs} == 1 and ${sd_exec_unearned} == 516164 == round_half_up(600000 * 314 / 365), with term_days 365 and elapsed_days 51 from 2026-09-01 to 2026-10-22"
            - "THE REBATE CAP BITES: ${sd_exec_rebate} == 36650, not 37650 — the Rule-of-78s quotient is round_half_up(37650 * 6 * 7 / (6 * 7)) == 37650 because r == 6 (no installment ever reached PAID), but rebate_cents is then min-ed against unpaid_finance_charge_cents, which the 1000-cent payment had already pulled down to 36650 by retiring finance charge before principal inside past-due installment 1"
            - "${sd_exec_gross} == 506497 == 502000 principal + 36650 unpaid finance charge - 36650 rebate + 4497 late fee balance - 0 unapplied credit"
            - "${sd_b_stage} == 'CANCELLATION_REQUESTED' and ${sd_b_status} == 'ACTIVE' — the two dimensions moved independently"
            - "CODES CLOSED HERE: ERR_SOD_ORIGINATOR_CANNOT_APPROVE, ERR_SOD_NOTICE_ISSUER_CANNOT_EXECUTE"

  # ---------------------------------------------------------------------------
  # §1.9 — Cross-Cutting Complexity Layers. complexity_profile.complexity_layers
  # declares four active layers: dual_variant_calculation, cascading_side_effects,
  # rate_threshold_triggers and optimistic_concurrency. The OCC layer is walked
  # live here because §1.8 never exercises a stale expected_*_version; the other
  # three are already carried by named §1.8 instances and are stubbed.
  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:

      - name: optimistic_concurrency_stale_agreement_version_on_endorsement_financing
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.endorsement-financing-stale-agreement
          - endpoints.POST_/agreements/{id}/endorsement-financings
          - errors.ERR_STALE_AGREEMENT_VERSION
        distinguishing_aspect: |
          §1.2.1 declares the write_endpoint and occ_field explicitly, so the mechanical part is easy;
          the parts that break implementations are the three around it. First, the guard cannot be
          collapsed into a state precondition — financing endorsements is legitimately repeatable, so a
          server that "solves" concurrency by refusing a second financing is wrong in a different way.
          Second, the version that was correct a moment ago becomes stale the instant a financing
          succeeds, so the replay of a previously-accepted number must be refused: the check is against
          the CURRENT stored version, not against a set of numbers ever seen. Third, a refused stale
          request must be completely inert — no endorsement folded, no schedule rebuilt, and critically
          the version itself must NOT advance, otherwise the client's next retry with the freshly read
          version fails too and the account becomes unfinanceable. The replay leg is set up with a
          second PENDING endorsement precisely so that the 412 cannot be confused with the 422 the
          endpoint raises when there is nothing to finance.
        test_recipe:
          setup:
            - "the clock is advanced to 2026-08-15 and the canonical TX regime has an effective License"
            - "the canonical 600000 policy is verified by both parties and the note is activated"
            - "one ADDITIONAL_PREMIUM endorsement of 60000 is filed and left PENDING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
              payload: { state_code: "TX", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3, license_required: true }
              as: ComplianceOfficer
              captures: { occ_rule: "$.data.id" }
            - call: "POST /state-rate-rules/${occ_rule}/licenses"
              payload: { license_number: "PFC-TX-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
            - call: "POST /insureds"
              payload: { legal_name: "Cascade Logistics Inc", mailing_state_code: "TX", email: "ap@cascade.example" }
              as: FinanceAnalyst
              captures: { occ_insured: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Lone Star Brokers", state_code: "TX", agent_commission_bps: 1200, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 500000, initial_reserve_balance_cents: 100000 }
              as: ComplianceOfficer
              captures: { occ_agent: "$.data.id" }
            - call: "POST /insurers"
              payload: { carrier_name: "Meridian Casualty", naic_code: "10123", status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { occ_insurer: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${occ_insured}", producer_agent_id: "${occ_agent}", state_rule_id: "${occ_rule}", down_payment_cents: 100000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { occ_agr: "$.data.id", occ_v_create: "$.data.version" }
            - call: "POST /agreements/${occ_agr}/policies"
              payload: { insurer_id: "${occ_insurer}", policy_number: "MC-OCC-1", gross_premium_cents: 600000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { occ_pol: "$.data.id" }
            - call: "GET /agreements/${occ_agr}"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { occ_v_policy: "$.data.version" }
            - call: "POST /agreements/${occ_agr}/submit"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { occ_v_submit: "$.data.version" }
            - call: "POST /policies/${occ_pol}/verifications"
              payload: { decision: "CONFIRMED" }
              as: Insurer
              as_user_id: "${occ_insurer}"
            - call: "POST /policies/${occ_pol}/verifications"
              payload: { decision: "CONFIRMED" }
              as: ProducerAgent
              as_user_id: "${occ_agent}"
            - call: "GET /agreements/${occ_agr}"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { occ_v_verified: "$.data.version" }
            - call: "POST /agreements/${occ_agr}/activate"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { occ_v_activate: "$.data.version", occ_top_0: "$.data.total_of_payments_cents" }
            - call: "POST /policies/${occ_pol}/endorsements"
              payload: { endorsement_type: "ADDITIONAL_PREMIUM", amount_cents: 60000, effective_date: "2026-09-15" }
              as: ProducerAgent
              as_user_id: "${occ_agent}"
              captures: { occ_end1: "$.data.id", occ_end1_signed: "$.data.signed_amount_cents" }
          trigger:
            - call: "POST /agreements/${occ_agr}/endorsement-financings"
              payload: { expected_agreement_version: "${occ_v_submit}" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { occ_e_stale: "$.data.error_id" }
            - call: "GET /agreements/${occ_agr}"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { occ_v_after_stale: "$.data.version", occ_top_after_stale: "$.data.total_of_payments_cents", occ_prin_after_stale: "$.data.principal_balance_cents" }
            - call: "GET /policies/${occ_pol}/endorsements"
              payload: { status: "PENDING", limit: 50 }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { occ_end1_status: "$.data[0].status" }
            - call: "POST /agreements/${occ_agr}/endorsement-financings"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { occ_e_missing: "$.data.error_id" }
            - call: "POST /agreements/${occ_agr}/endorsement-financings"
              payload: { expected_agreement_version: "${occ_v_activate}" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { occ_v_fin1: "$.data.version", occ_top_1: "$.data.total_of_payments_cents", occ_af_1: "$.data.amount_financed_cents", occ_fc_1: "$.data.finance_charge_cents", occ_prin_1: "$.data.principal_balance_cents", occ_ufc_1: "$.data.unpaid_finance_charge_cents", occ_rate_1: "$.data.effective_annual_rate_bps", occ_basis_1: "$.data.quote_basis" }
            - call: "GET /agreements/${occ_agr}/installments"
              payload: { limit: 50 }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { occ_i1_amt: "$.data[0].amount_cents", occ_i1_fc: "$.data[0].finance_charge_component_cents", occ_i6_amt: "$.data[5].amount_cents" }
            - call: "POST /policies/${occ_pol}/endorsements"
              payload: { endorsement_type: "ADDITIONAL_PREMIUM", amount_cents: 30000, effective_date: "2026-09-20" }
              as: ProducerAgent
              as_user_id: "${occ_agent}"
              captures: { occ_end2: "$.data.id" }
            - call: "POST /agreements/${occ_agr}/endorsement-financings"
              payload: { expected_agreement_version: "${occ_v_activate}" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { occ_e_replay: "$.data.error_id" }
            - call: "POST /agreements/${occ_agr}/endorsement-financings"
              payload: { expected_agreement_version: "${occ_v_fin1}" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { occ_v_fin2: "$.data.version", occ_top_2: "$.data.total_of_payments_cents", occ_af_2: "$.data.amount_financed_cents", occ_fc_2: "$.data.finance_charge_cents", occ_prin_2: "$.data.principal_balance_cents", occ_ufc_2: "$.data.unpaid_finance_charge_cents" }
            - call: "GET /policies/${occ_pol}"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { occ_pol_endorsed: "$.data.endorsed_premium_cents", occ_pol_financed: "$.data.financed_premium_cents" }
          assert:
            - "VERSION INCREMENTS ON EVERY WRITE TO THE ROW: ${occ_v_create} == 1 at creation, ${occ_v_policy} == 2 after the policy is attached and ${occ_v_submit} == 3 after submit — the three writes whose §1.5 side_effects declare the increment"
            - "the two attestations are writes to FinancedPolicy, not to the note, so the test READS the note's version rather than assuming it: ${occ_v_activate} == ${occ_v_verified} + 1 after activate"
            - "the pre-endorsement note is the canonical one: ${occ_top_0} == 539650 and ${occ_end1_signed} == 60000 (ADDITIONAL_PREMIUM signs positive)"
            - "STALE VERSION REJECTED: expected_agreement_version ${occ_v_submit} against a stored version of ${occ_v_activate} yields ${occ_e_stale} == 'ERR_STALE_AGREEMENT_VERSION' at HTTP 412"
            - "THE REFUSED REQUEST IS COMPLETELY INERT: ${occ_v_after_stale} == ${occ_v_activate} (the version did NOT advance, so the client's next retry with the version it just read can succeed), ${occ_top_after_stale} == 539650, ${occ_prin_after_stale} == 502000 and ${occ_end1_status} == 'PENDING' with total_count == 1"
            - "the OCC field is mandatory, not optional: omitting expected_agreement_version yields ${occ_e_missing} == 'ERR_INVALID_REQUEST' at HTTP 422 — a server that treats a missing version as 'no concurrency check' has no concurrency control at all"
            - "CORRECT VERSION SUCCEEDS: ${occ_v_fin1} == ${occ_v_activate} + 1, ${occ_basis_1} == 'FINAL', ${occ_af_1} == 562000 == 660000 - 100000 + 2000, ${occ_rate_1} == 1500 (562000 is above TIER1_MAX_AMOUNT_FINANCED_CENTS 500000 and at or below TIER2_MAX_AMOUNT_FINANCED_CENTS 2000000, and 1500 <= the 1800 statutory ceiling), ${occ_fc_1} == 42150 == round_half_up(562000 * 1500 * 6 / 120000), ${occ_top_1} == 604150, ${occ_prin_1} == 562000 and ${occ_ufc_1} == 42150"
            - "the schedule was rebuilt, not patched: ${occ_i1_amt} == 100691 == floor(604150 / 6), ${occ_i1_fc} == 7025 == round_half_up(42150 / 6) and ${occ_i6_amt} == 100695 == 604150 - 100691 * 5"
            - "REPLAY OF THE PREVIOUSLY-VALID VERSION IS REFUSED: with endorsement ${occ_end2} PENDING — so the endpoint's state precondition is satisfied and a 422 is not available — resending expected_agreement_version ${occ_v_activate} yields ${occ_e_replay} == 'ERR_STALE_AGREEMENT_VERSION' at HTTP 412; the check compares against the CURRENT stored version, not against any number the server once accepted"
            - "the freshly read version finances the second endorsement: ${occ_v_fin2} == ${occ_v_fin1} + 1, ${occ_af_2} == 592000 == 690000 - 100000 + 2000, ${occ_fc_2} == 44400 == round_half_up(592000 * 1500 * 6 / 120000), ${occ_top_2} == 636400, ${occ_prin_2} == 592000 and ${occ_ufc_2} == 44400"
            - "financing is repeatable rather than once-only, which is exactly why a state precondition could not have replaced the version check: ${occ_pol_endorsed} == 90000 == 60000 + 30000 and ${occ_pol_financed} == 690000 == 600000 verified premium + 90000 endorsed"
            - "CODES CLOSED HERE: ERR_STALE_AGREEMENT_VERSION"

      - name: cascading_side_effects_carrier_return_through_deficiency_to_agency_credit
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / return_posting_to_agency_suspension_cascade
          rationale: |
            The layer's deepest chain in this domain is the four-level one that starts at
            POST /carrier-cancellation-requests/{id}/return-posting and propagates through the
            agreement's unearned_premium_received_cents, the deficiency_and_agent_chargeback
            constraint-propagation calculation, the minted AgentChargeback row and finally the
            agency's outstanding_chargeback_cents / reserve balance. That §1.8 instance already
            drives the whole chain end-to-end and asserts every level's field, including the
            ordering sensitivity (the fee tier reads the PRE-fee residual) and the
            partial-completion case where one of several carrier requests has not yet posted, so
            the intermediate levels stay untouched. A §1.9 clone would repeat a very long setup
            without adding a distinguishable claim.

      - name: rate_threshold_triggers_instantaneous_and_cumulative_boundaries
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: combinatorial_formula / tiered_rate_boundary_nested_under_statutory_ceiling
          rationale: |
            The layer's instantaneous thresholds are the volume rate tiers and the deficiency fee
            tiers, and its cumulative threshold is StateRateRule.max_late_fees_per_agreement. That
            §1.8 instance tests the amount-financed tier at exactly TIER1_MAX_AMOUNT_FINANCED_CENTS
            and one cent either side while nested under max_annual_rate_bps; its sibling
            deficiency_fee_tier_keyed_on_pre_fee_balance does the same for the fee tier boundary at
            25000; and grace_period_boundary_and_late_fee_clamp_on_servicing_run plus §1.9's
            aggregate_validation_late_fee_count_cap_holds_across_successive_sweeps cover the
            cumulative counter at the cap and the fact that waiver does not reset it. Nothing in the
            layer's row is left unclaimed.

      - name: dual_variant_calculation_pro_rata_versus_short_rate_unearned_premium_return
        claim_type: dual_variant_calculation
        grounds:
          - calculations.unearned_premium_return_estimate.variants
          - endpoints.POST_/agreements/{id}/cancellation-executions
          - entities.StateRateRule.unearned_premium_method
        distinguishing_aspect: |
          Of the four `variants` blocks in §1.3, three are already driven elsewhere (the
          provisional/final premium basis and the two chargeback bases by §1.8, the Rule-of-78s /
          actuarial rebate pair by §1.9's calculations section). The unearned-premium pair is the one
          left, and it is also the pair with the nastiest arithmetic, because the SHORT_RATE branch is
          NOT "premium times unexpired fraction times 0.9 in one expression": the penalty is applied to
          the ALREADY ROUNDED pro-rata figure, and the aggregate reported by the execution endpoint
          rounds PER POLICY and then sums. Both orderings are made observable rather than asserted on
          faith: policies of 302000 and 305000 cancelled on this date differ by exactly one cent
          between the two-step and one-step penalty computations, and their aggregate differs by one
          cent between per-policy rounding and round-the-sum. The same 600000 policy, on the same
          effective and cancellation dates, is financed under both regimes so the variant delta itself
          is a single subtraction with no confounding input.
