      - name: cert_expiry_priority_22_beats_shelf_life_priority_29
        grounds:
          - validations[priority=22]
          - validations[priority=29]
          - errors.ERR_CERT_EXPIRED
          - errors.ERR_SHELF_LIFE_EXCEEDS_POLICY
