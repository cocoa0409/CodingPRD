# =============================================================================
# PRD Benchmark Seed Tables — Resilient Flooring Plant Operations
# Difficulty band: Expert+ (15 entities / 71 endpoints / 11 calculations /
#                  9 state machines / 2 OCC races / 65 validation rows across
#                  15 priority bands / 61 error codes / 7 roles)
# =============================================================================

scenario: |
  2286. Resilient Flooring Plant Operations (luxury vinyl flooring plant): raw material formulation across vinyl, plasticizer, filler and stabilizer with cost and performance tradeoffs, layer construction with wear layer thickness, print film registration and embossing alignment, press or calender line operation with dimensional stability and curl control, click-lock profile milling with tolerance control for installation performance, product testing for indentation, dimensional stability under heat and slip resistance, print film design library, licensing and pattern repeat management, batch traceability for warranty claims on wear layer or delamination, waterproof and underlayment attached product variants with inventory complexity

domain_name: resilient-flooring-plant-ops
api_prefix: "/"   # flat topology: every resource collection is mounted at the API root

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - version_pinning_on_approval
    - optimistic_concurrency

  entity_topology: graph
  # Peer entities linked by foreign keys at the API root (no nesting in URL paths
  # for identity), plus two junction entities (FormulationComponent, AllocationLine)
  # and two self-referential edges (Formulation.supersedes_formulation_id,
  # DesignLicense.supersedes_license_id). No single aggregate root.

  state_machine_shape: cyclic
  # Formulation:    DRAFT -> UNDER_REVIEW -> REJECTED -> DRAFT (revision loop)
  # TestPanel:      IN_TEST -> RETEST_REQUIRED -> IN_TEST (retest loop)
  # DesignLicense:  ACTIVE -> SUSPENDED -> ACTIVE
  # Batch:          IN_STOCK -> HELD -> IN_STOCK
  # Allocation:     OPEN -> PARTIALLY_FILLED -> FILLED -> PARTIALLY_FILLED (line voids)
  # ProductSku:     parallel dimensions certification_status x commercial_status
  # ProductionRun:  parallel dimensions run_status x qc_disposition
  # WarrantyClaim:  branching fork-join (TRIAGE -> {materials,field} -> ADJUDICATION_READY)

  relationship_patterns:
    - one_to_many
    - many_to_many          # Formulation<->RawMaterial, Allocation<->Batch
    - self_referential      # Formulation.supersedes_formulation_id, DesignLicense.supersedes_license_id
    - cross_aggregate       # WarrantyClaim -> Batch -> ProductionRun -> ProductSku -> Formulation

  role_model: segregation_of_duties
  # S1 formulation review-decision: reviewer != authored_by_user_id
  # S2 sku certify: certifier must not be any qualifying TestResult.recorded_by_user_id
  # S3 batch RELEASE_HOLD: releaser != batch.held_by_user_id
  # S4 warranty adjudicate: adjudicator != claim.assigned_adjuster_user_id

  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table  (§1.1)
# =============================================================================
entities:

  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - name: account_code
        type: string
        source: input
        description: "External distributor account code"
        constraints: "unique across Distributor; 3-32 chars"
      - name: name
        type: string
        source: input
        description: "Legal name of the distributor"
      - name: territory_code
        type: string
        source: input
        description: "ISO-3166 alpha-2 territory the distributor sells into"
        constraints: "exactly 2 uppercase letters"
      - name: certified_installer_program
        type: boolean
        source: input
        default: false
        description: "True when the distributor participates in the certified-installer program"
      - name: status
        type: enum
        source: input
        default: ACTIVE
        description: "Commercial standing of the distributor"
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: RawMaterial
    parent: null
    common_fields: true
    fields:
      - name: material_code
        type: string
        source: input
        description: "Plant material code"
        constraints: "unique across RawMaterial"
      - name: name
        type: string
        source: input
        description: "Trade name of the material"
      - name: category
        type: enum
        source: input
        description: "Formulation role of the material"
        constraints: "one of {VINYL_RESIN, PLASTICIZER, FILLER, STABILIZER}"
      - name: cost_per_kg_cents
        type: integer
        source: input
        description: "Current purchase cost in whole cents per kilogram"
        constraints: ">= 1"
      - name: indentation_index
        type: number
        source: input
        description: "Contribution to residual-indentation resistance, 0-100 (higher is better)"
        constraints: "0 <= value <= 100; max 2 decimals"
      - name: thermal_stability_index
        type: number
        source: input
        description: "Contribution to dimensional stability under heat, 0-100 (higher is better)"
        constraints: "0 <= value <= 100; max 2 decimals"
      - name: plasticizer_migration_index
        type: number
        source: input
        description: "Contribution to plasticizer migration, 0-100 (higher is worse)"
        constraints: "0 <= value <= 100; max 2 decimals"
      - name: max_phr
        type: number
        source: input
        description: "Maximum parts-per-hundred-resin permitted for this material in any formulation"
        constraints: "> 0"
      - name: status
        type: enum
        source: input
        default: ACTIVE
        description: "Procurement status; RESTRICTED and DISCONTINUED bar the material from approved formulations"
        constraints: "one of {ACTIVE, RESTRICTED, DISCONTINUED}"

  - name: Formulation
    parent: null
    common_fields: true
    fields:
      - name: formulation_code
        type: string
        source: input
        description: "Compound recipe code"
        constraints: "unique across Formulation"
      - name: revision
        type: integer
        source: computed
        default: 1
        description: "Revision number; a revision created from formulation P gets P.revision + 1"
      - name: supersedes_formulation_id
        type: string
        source: input
        description: "FK -> Formulation.id; the APPROVED formulation this revision will supersede on approval; null for an original recipe"
        default: null
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: "Recipe lifecycle state"
        constraints: "one of {DRAFT, UNDER_REVIEW, APPROVED, REJECTED, SUPERSEDED, RETIRED}"
      - name: authored_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Formulator that created the recipe; drives SoD rule S1"
      - name: submitted_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the Formulator that last submitted the recipe for review"
      - name: approved_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the TechnicalDirector that approved the recipe"
      - name: approved_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of approval, ISO 8601 UTC with three fractional digits"
      - name: rejection_count
        type: integer
        source: computed
        default: 0
        description: "Number of times this recipe has been rejected in review"
      - name: open_revision_count
        type: integer
        source: computed
        default: 0
        description: "Number of DRAFT revisions created from this recipe; incremented by POST /formulations/{id}/revisions"
      - name: total_phr
        type: number
        source: computed
        description: "Sum of FormulationComponent.phr over all components, 2 decimals"
      - name: resin_phr
        type: number
        source: computed
        description: "Sum of phr over components whose RawMaterial.category == VINYL_RESIN, 2 decimals"
      - name: plasticizer_phr
        type: number
        source: computed
        description: "Sum of phr over components whose RawMaterial.category == PLASTICIZER, 2 decimals"
      - name: filler_phr
        type: number
        source: computed
        description: "Sum of phr over components whose RawMaterial.category == FILLER, 2 decimals"
      - name: stabilizer_phr
        type: number
        source: computed
        description: "Sum of phr over components whose RawMaterial.category == STABILIZER, 2 decimals"
      - name: blended_cost_per_kg_cents
        type: integer
        source: computed
        description: "phr-weighted blended compound cost per kg in whole cents; see calculations.formulation_blend_metrics"
      - name: performance_score
        type: number
        source: computed
        description: "Weighted blend performance score 0-100 with 2 decimals; see calculations.formulation_blend_metrics"
      - name: indentation_resistance_class
        type: enum
        source: computed
        description: "Derived EN-685-style class from the blend"
        constraints: "one of {CLASS_23_31, CLASS_33_42, CLASS_34_43}"
      - name: cost_basis
        type: enum
        source: computed
        default: LIVE
        description: "LIVE while status IN {DRAFT, UNDER_REVIEW, REJECTED}; PINNED once status IN {APPROVED, SUPERSEDED, RETIRED}"
        constraints: "one of {LIVE, PINNED}"

  - name: FormulationComponent
    parent: Formulation
    common_fields: true
    fields:
      - name: formulation_id
        type: string
        source: input
        description: "FK -> Formulation.id; the recipe this component belongs to"
      - name: raw_material_id
        type: string
        source: input
        description: "FK -> RawMaterial.id; the material dosed by this component"
      - name: phr
        type: number
        source: input
        description: "Parts per hundred resin dosed for this material"
        constraints: "> 0; max 2 decimals. The per-material ceiling is NOT a shape constraint: it depends on stored RawMaterial state and is enforced by validation V-CON-4 (ERR_PHR_EXCEEDS_MATERIAL_MAX, 422), never by V-REQ-1"
      - name: material_cost_snapshot_cents
        type: integer
        source: computed
        default: null
        description: "RawMaterial.cost_per_kg_cents captured at the instant the parent recipe was APPROVED; null while the recipe has never been approved"
      - name: snapshot_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant the cost snapshot was taken, ISO 8601 UTC"

  - name: DesignLicense
    parent: null
    common_fields: true
    fields:
      - name: license_code
        type: string
        source: input
        description: "Licensing agreement code"
        constraints: "unique across DesignLicense"
      - name: licensor_name
        type: string
        source: input
        description: "Name of the licensor granting the pattern rights"
      - name: license_type
        type: enum
        source: input
        description: "Commercial form of the grant"
        constraints: "one of {EXCLUSIVE, NON_EXCLUSIVE, INTERNAL}"
      - name: royalty_rate_bps
        type: integer
        source: input
        description: "Royalty rate in basis points applied to the SKU royalty basis price"
        constraints: "0 <= value <= 2000"
      - name: valid_from
        type: datetime
        source: input
        description: "Inclusive start of the licensed term, ISO 8601 UTC"
      - name: valid_until
        type: datetime
        source: input
        description: "Exclusive end of the licensed term, ISO 8601 UTC"
        constraints: "> valid_from"
      - name: term_volume_cap_sqm
        type: number
        source: input
        description: "Maximum square metres that may be produced under this license across the whole term"
        constraints: "> 0; max 2 decimals"
      - name: reserved_volume_sqm
        type: number
        source: computed
        default: 0
        description: "Sum of planned_quantity_sqm over ProductionRuns in run_status IN {PLANNED, SETUP, RUNNING} drawing on this license, 2 decimals"
      - name: consumed_volume_sqm
        type: number
        source: computed
        default: 0
        description: "Sum of actual_quantity_sqm over ProductionRuns in run_status COMPLETED with qc_disposition IN {PENDING, RELEASED, QUARANTINED} drawing on this license, 2 decimals"
      - name: accrued_royalty_cents
        type: integer
        source: computed
        default: 0
        description: "Running royalty ledger in whole cents; see calculations.license_royalty_accrual"
      - name: territory_codes
        type: array
        source: input
        description: "ISO-3166 alpha-2 territories the grant covers"
        constraints: "non-empty array of 2-letter uppercase codes"
      - name: status
        type: enum
        source: computed
        default: ACTIVE
        description: "Grant lifecycle state"
        constraints: "one of {ACTIVE, SUSPENDED, EXPIRED, SUPERSEDED, TERMINATED}"
      - name: supersedes_license_id
        type: string
        source: input
        description: "FK -> DesignLicense.id; the grant this amendment replaces; null for an original grant"
        default: null
      - name: amendment_note
        type: string
        source: input
        default: null
        description: "Free-text rationale recorded when this row was created as an amendment"

  - name: PrintFilm
    parent: null
    common_fields: true
    fields:
      - name: design_code
        type: string
        source: input
        description: "Print film design code in the design library"
        constraints: "unique across PrintFilm"
      - name: license_id
        type: string
        source: input
        description: "FK -> DesignLicense.id; the grant that authorises this design"
      - name: pattern_repeat_mm_length
        type: number
        source: input
        description: "Longitudinal pattern repeat in millimetres"
        constraints: "> 0"
      - name: pattern_repeat_mm_width
        type: number
        source: input
        description: "Transverse pattern repeat in millimetres"
        constraints: "> 0"
      - name: registration_tolerance_mm
        type: number
        source: input
        description: "Maximum permitted absolute print-to-emboss registration drift in millimetres"
        constraints: "> 0"
      - name: emboss_plate_code
        type: string
        source: input
        description: "Embossing plate paired with this design"
      - name: emboss_alignment_offset_mm
        type: number
        source: input
        description: "Nominal emboss alignment offset in millimetres for this plate"
      - name: master_roll_sets
        type: integer
        source: input
        description: "Number of physical master roll sets available; caps how many production runs may occupy overlapping windows on this design"
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        default: AVAILABLE
        description: "Library availability; set by POST /print-films/{id}/status and by DesignLicense suspension/termination cascades"
        constraints: "one of {AVAILABLE, RESTRICTED, WITHDRAWN}"

  - name: ProductSku
    parent: null
    common_fields: true
    fields:
      - name: sku_code
        type: string
        source: input
        description: "Finished-goods SKU code"
        constraints: "unique across ProductSku"
      - name: formulation_id
        type: string
        source: input
        description: "FK -> Formulation.id; the core compound recipe"
      - name: print_film_id
        type: string
        source: input
        description: "FK -> PrintFilm.id; the decor layer design"
      - name: construction_type
        type: enum
        source: input
        description: "Layer construction and installation method"
        constraints: "one of {GLUE_DOWN, LOOSE_LAY, CLICK_LOCK_SPC, CLICK_LOCK_WPC}"
      - name: wear_layer_mil
        type: number
        source: input
        description: "Wear layer thickness in mil (thousandths of an inch)"
        constraints: "> 0; <= 40; max 1 decimal"
      - name: overall_thickness_mm
        type: number
        source: input
        description: "Total plank thickness in millimetres"
        constraints: "> 0; <= 12; max 2 decimals"
      - name: waterproof_rated
        type: boolean
        source: input
        default: false
        description: "True when the SKU is marketed as waterproof; adds a slip-resistance test requirement"
      - name: attached_underlayment_type
        type: enum
        source: input
        default: NONE
        description: "Factory-attached underlayment variant"
        constraints: "one of {NONE, IXPE_1MM, EVA_1_5MM, CORK_2MM}"
      - name: profile_family
        type: enum
        source: input
        default: NONE
        description: "Click-lock profile milling family; NONE for glue-down and loose-lay"
        constraints: "one of {NONE, UNILIN_5G, VALINGE_2G, DROP_LOCK}"
      - name: tongue_thickness_target_mm
        type: number
        source: input
        default: null
        description: "Target milled tongue thickness in millimetres; required when profile_family != NONE"
      - name: tolerance_plus_mm
        type: number
        source: input
        default: null
        description: "Upper milling tolerance in millimetres; required when profile_family != NONE"
        constraints: "> 0 when present"
      - name: tolerance_minus_mm
        type: number
        source: input
        default: null
        description: "Lower milling tolerance in millimetres; required when profile_family != NONE"
        constraints: "> 0 when present"
      - name: target_lock_shear_n_per_mm
        type: number
        source: input
        default: null
        description: "Target locking-strength shear in N/mm; required when profile_family != NONE and used as the LOCK_SHEAR spec limit"
      - name: royalty_basis_price_cents_per_sqm
        type: integer
        source: input
        description: "Published price-list value per square metre in whole cents; the pinned royalty basis that breaks the cost/price circularity"
        constraints: ">= 1"
      - name: target_margin_bps
        type: integer
        source: input
        default: 3500
        description: "Target gross margin in basis points used to derive list_price_cents_per_sqm from standard cost"
        constraints: "0 <= value <= 9000"
      - name: certification_status
        type: enum
        source: computed
        default: UNCERTIFIED
        description: "Technical certification dimension; evolves independently of commercial_status"
        constraints: "one of {UNCERTIFIED, TESTING, PROVISIONAL, CERTIFIED, SUSPENDED, DECERTIFIED}"
      - name: commercial_status
        type: enum
        source: computed
        default: DEVELOPMENT
        description: "Commercial availability dimension; evolves independently of certification_status"
        constraints: "one of {DEVELOPMENT, RELEASED, HOLD, DISCONTINUED}"
      - name: warranty_years
        type: integer
        source: computed
        description: "Residential warranty term in years; see calculations.sku_warranty_terms"
      - name: light_commercial_warranty_years
        type: integer
        source: computed
        description: "Light-commercial warranty term in years; see calculations.sku_warranty_terms"
      - name: pinned_formulation_version
        type: integer
        source: computed
        default: null
        description: "Formulation.version captured at certification; null until certified"
      - name: pinned_print_film_version
        type: integer
        source: computed
        default: null
        description: "PrintFilm.version captured at certification; null until certified"
      - name: pin_stale
        type: boolean
        source: computed
        default: false
        description: "True when the referenced Formulation has moved to SUPERSEDED or RETIRED since certification, or its version no longer equals pinned_formulation_version"
      - name: standard_cost_cents_per_sqm
        type: integer
        source: computed
        default: null
        description: "PINNED_BASIS standard cost stamped at certification; null until certified. See calculations.sku_standard_cost"
      - name: list_price_cents_per_sqm
        type: integer
        source: computed
        default: null
        description: "standard_cost_cents_per_sqm grossed up by target_margin_bps; null until certified"
      - name: certified_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of certification, ISO 8601 UTC"
      - name: certified_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the TechnicalDirector that certified the SKU"

  - name: PressLine
    parent: null
    common_fields: true
    fields:
      - name: line_code
        type: string
        source: input
        description: "Plant line code"
        constraints: "unique across PressLine"
      - name: line_type
        type: enum
        source: input
        description: "Forming technology of the line"
        constraints: "one of {MULTI_DAY_PRESS, CALENDER}"
      - name: min_thickness_mm
        type: number
        source: input
        description: "Minimum plank thickness the line can form, millimetres"
        constraints: "> 0"
      - name: max_thickness_mm
        type: number
        source: input
        description: "Maximum plank thickness the line can form, millimetres"
        constraints: "> min_thickness_mm"
      - name: changeover_minutes
        type: integer
        source: input
        description: "Base changeover allowance in minutes between two consecutive runs on this line"
        constraints: ">= 0"
      - name: curl_control_index
        type: number
        source: input
        description: "Curl-control capability index 0-100; sets the permitted curl deviation band"
        constraints: "0 <= value <= 100"
      - name: status
        type: enum
        source: computed
        default: AVAILABLE
        description: "Line availability"
        constraints: "one of {AVAILABLE, MAINTENANCE, DOWN}"

  - name: TestPanel
    parent: null
    common_fields: true
    fields:
      - name: panel_code
        type: string
        source: input
        description: "Laboratory panel identifier"
        constraints: "unique across TestPanel"
      - name: sku_id
        type: string
        source: input
        description: "FK -> ProductSku.id; the SKU whose construction this panel represents"
      - name: status
        type: enum
        source: computed
        default: SCHEDULED
        description: "Panel lifecycle state"
        constraints: "one of {SCHEDULED, IN_TEST, PASSED, FAILED, RETEST_REQUIRED, VOIDED}"
      - name: attempt_no
        type: integer
        source: computed
        default: 1
        description: "Current test attempt; incremented when a RETEST_REQUIRED panel is restarted. Required-type coverage is evaluated within the current attempt only"
      - name: retest_count
        type: integer
        source: computed
        default: 0
        description: "Number of times this panel has entered RETEST_REQUIRED; MAX_RETESTS is 2, so a value of 3 means the panel may no longer be restarted (validation V-CON-8)"
      - name: required_test_types
        type: array
        source: computed
        description: "Test types the panel must cover, derived from the SKU configuration; see calculations.sku_required_test_types"
      - name: started_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the QaTechnician that last started the panel"
      - name: void_reason
        type: string
        source: input
        default: null
        description: "Reason recorded when the panel was voided"

  - name: TestResult
    parent: TestPanel
    common_fields: false
    fields:
      - name: test_panel_id
        type: string
        source: input
        description: "FK -> TestPanel.id; the panel this measurement belongs to"
      - name: attempt_no
        type: integer
        source: system
        description: "TestPanel.attempt_no at the instant the measurement was recorded"
      - name: test_type
        type: enum
        source: input
        description: "Which standardised test produced this measurement"
        constraints: "one of {RESIDUAL_INDENTATION, DIMENSIONAL_STABILITY_HEAT, SLIP_RESISTANCE, PEEL_ADHESION_DELAMINATION, LOCK_SHEAR}"
      - name: measured_value
        type: number
        source: input
        description: "Laboratory reading in the unit implied by test_type"
        constraints: ">= 0; max 4 decimals"
      - name: unit
        type: string
        source: computed
        description: "Unit of measure implied by test_type (mm, PCT, DCOF, N_PER_25MM, N_PER_MM)"
      - name: spec_limit
        type: number
        source: computed
        description: "Effective specification limit for this SKU and test_type; see calculations.test_spec_limit_and_outcome"
      - name: outcome
        type: enum
        source: computed
        description: "Grading of measured_value against spec_limit"
        constraints: "one of {PASS, MARGINAL, FAIL}"
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the QaTechnician that recorded the measurement; drives SoD rule S2"

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - name: run_code
        type: string
        source: input
        description: "Shop-floor run identifier"
        constraints: "unique across ProductionRun"
      - name: sku_id
        type: string
        source: input
        description: "FK -> ProductSku.id; the SKU being formed"
      - name: press_line_id
        type: string
        source: input
        description: "FK -> PressLine.id; the line the run occupies"
      - name: planned_start_utc
        type: datetime
        source: input
        description: "Inclusive start of the planned line occupation, ISO 8601 UTC"
      - name: planned_end_utc
        type: datetime
        source: input
        description: "Exclusive end of the planned line occupation, ISO 8601 UTC"
        constraints: "> planned_start_utc"
      - name: planned_quantity_sqm
        type: number
        source: input
        description: "Planned output in square metres; reserved against the license term cap at creation"
        constraints: "> 0; max 2 decimals"
      - name: run_status
        type: enum
        source: computed
        default: PLANNED
        description: "Execution dimension of the run"
        constraints: "one of {PLANNED, SETUP, RUNNING, COMPLETED, ABORTED}"
      - name: qc_disposition
        type: enum
        source: computed
        default: PENDING
        description: "Quality dimension of the run; evolves independently of run_status"
        constraints: "one of {PENDING, RELEASED, QUARANTINED, SCRAPPED}"
      - name: changeover_minutes_applied
        type: integer
        source: computed
        default: null
        description: "Changeover allowance actually charged at setup; see calculations.press_line_changeover_gap"
      - name: actual_quantity_sqm
        type: number
        source: computed
        default: 0
        description: "Measured output in square metres, recorded at completion"
      - name: registration_drift_mm
        type: number
        source: input
        default: null
        description: "Measured print-to-emboss registration drift in millimetres, recorded at completion"
      - name: curl_deviation_mm
        type: number
        source: input
        default: null
        description: "Measured curl deviation in millimetres, recorded at completion"
      - name: emboss_alignment_offset_mm
        type: number
        source: input
        default: null
        description: "Measured emboss alignment offset in millimetres, recorded at completion"
      - name: measured_tongue_thickness_mm
        type: number
        source: input
        default: null
        description: "Measured milled tongue thickness in millimetres, recorded at completion; null for profile_family NONE"
      - name: wear_layer_measured_mil
        type: number
        source: input
        default: null
        description: "Measured wear layer thickness in mil, recorded at completion and carried onto the Batch for warranty traceability"
      - name: pattern_waste_sqm
        type: number
        source: computed
        default: null
        description: "Pattern-repeat matching waste in square metres; see calculations.run_quality_metrics"
      - name: registration_within_tolerance
        type: boolean
        source: computed
        default: null
        description: "QC gate 1; see calculations.run_quality_metrics"
      - name: emboss_within_tolerance
        type: boolean
        source: computed
        default: null
        description: "QC gate 2; see calculations.run_quality_metrics"
      - name: curl_within_tolerance
        type: boolean
        source: computed
        default: null
        description: "QC gate 3; see calculations.run_quality_metrics"
      - name: tongue_within_tolerance
        type: boolean
        source: computed
        default: null
        description: "QC gate 4; see calculations.run_quality_metrics"
      - name: auto_disposition_recommendation
        type: enum
        source: computed
        default: null
        description: "RELEASED when all four QC gates hold, otherwise QUARANTINED"
        constraints: "one of {RELEASED, QUARANTINED}"
      - name: royalty_accrued_cents
        type: integer
        source: computed
        default: 0
        description: "Royalty this run contributed to its license ledger; reversed exactly when the run is scrapped"
      - name: completed_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the ProductionPlanner that completed the run"
      - name: abort_reason
        type: string
        source: input
        default: null
        description: "Reason recorded when the run was aborted"

  - name: Batch
    parent: null
    common_fields: true
    fields:
      - name: batch_code
        type: string
        source: computed
        description: "Traceability code minted as '<run_code>-B1' when the run completes"
        constraints: "unique across Batch"
      - name: production_run_id
        type: string
        source: computed
        description: "FK -> ProductionRun.id; the run that produced this batch"
      - name: sku_id
        type: string
        source: computed
        description: "FK -> ProductSku.id; denormalised from the producing run for stock selection"
      - name: quantity_sqm
        type: number
        source: computed
        description: "Square metres produced; equals the producing run's actual_quantity_sqm and never changes"
      - name: available_quantity_sqm
        type: number
        source: computed
        default: 0
        description: "Square metres free for allocation; 0 until the batch reaches IN_STOCK"
      - name: wear_layer_measured_mil
        type: number
        source: computed
        description: "Wear layer reading copied from the producing run; the warranty-claim defect evidence"
      - name: status
        type: enum
        source: computed
        default: IN_PRODUCTION
        description: "Stock lifecycle state"
        constraints: "one of {IN_PRODUCTION, IN_STOCK, HELD, SCRAPPED}"
      - name: hold_reason
        type: string
        source: input
        default: null
        description: "Reason recorded when the batch was placed on hold"
      - name: held_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the QaTechnician that placed the current hold; drives SoD rule S3"
      - name: traceability_snapshot
        type: object
        source: computed
        description: "Immutable warranty evidence captured at batch creation: {formulation_code, formulation_revision, blended_cost_per_kg_cents, print_film_design_code, license_code, press_line_code, planned_start_utc, planned_end_utc, wear_layer_mil_spec}"

  - name: Allocation
    parent: null
    common_fields: true
    fields:
      - name: allocation_code
        type: string
        source: input
        description: "Distributor allocation request code"
        constraints: "unique across Allocation"
      - name: distributor_id
        type: string
        source: input
        description: "FK -> Distributor.id; the owner of this allocation request"
      - name: sku_id
        type: string
        source: input
        description: "FK -> ProductSku.id; the SKU the distributor asked for"
      - name: requested_quantity_sqm
        type: number
        source: input
        description: "Square metres requested"
        constraints: "> 0; max 2 decimals"
      - name: allocated_quantity_sqm
        type: number
        source: computed
        default: 0
        description: "Sum of quantity_sqm over AllocationLines with status ACTIVE, 2 decimals"
      - name: substitution_policy
        type: enum
        source: input
        default: STRICT_SKU
        description: "Which non-exact batches the fill selector may draw on"
        constraints: "one of {STRICT_SKU, ALLOW_UNDERLAYMENT_UPGRADE, ALLOW_WEAR_LAYER_UPGRADE}"
      - name: upgrade_cost_total_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of per-line rounded upgrade_cost_delta_cents over ACTIVE lines; see calculations.allocation_fill_plan"
      - name: status
        type: enum
        source: computed
        default: OPEN
        description: "Allocation lifecycle state"
        constraints: "one of {OPEN, PARTIALLY_FILLED, FILLED, RELEASED, CANCELLED}"

  - name: AllocationLine
    parent: Allocation
    common_fields: true
    fields:
      - name: allocation_id
        type: string
        source: computed
        description: "FK -> Allocation.id; the request this line fills"
      - name: batch_id
        type: string
        source: computed
        description: "FK -> Batch.id; the stock drawn on"
      - name: quantity_sqm
        type: number
        source: computed
        description: "Square metres drawn from the batch by this line"
      - name: substitution_kind
        type: enum
        source: computed
        description: "How this batch relates to the requested SKU"
        constraints: "one of {EXACT, UNDERLAYMENT_UPGRADE, WEAR_LAYER_UPGRADE}"
      - name: upgrade_cost_delta_cents
        type: integer
        source: computed
        description: "Rounded cost premium of substituting this batch for the requested SKU; 0 for EXACT"
      - name: status
        type: enum
        source: computed
        default: ACTIVE
        description: "Line state; VOIDED lines return their quantity to the batch"
        constraints: "one of {ACTIVE, VOIDED}"
      - name: void_reason
        type: string
        source: computed
        default: null
        description: "Cascade reason recorded when the line was voided"
        constraints: "one of {ALLOCATION_RELEASED, ALLOCATION_CANCELLED, BATCH_HELD, BATCH_SCRAPPED}"

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: claim_code
        type: string
        source: input
        description: "Warranty claim reference"
        constraints: "unique across WarrantyClaim"
      - name: batch_id
        type: string
        source: input
        description: "FK -> Batch.id; the traceable batch the flooring came from"
      - name: distributor_id
        type: string
        source: input
        description: "FK -> Distributor.id; the distributor filing on behalf of the end customer"
      - name: claim_type
        type: enum
        source: input
        description: "Failure mode claimed"
        constraints: "one of {WEAR_LAYER_WEARTHROUGH, DELAMINATION, DIMENSIONAL_MOVEMENT, LOCK_FAILURE}"
      - name: claimed_area_sqm
        type: number
        source: input
        description: "Affected floor area in square metres"
        constraints: "> 0; max 2 decimals"
      - name: installed_on
        type: datetime
        source: input
        description: "Installation date, ISO 8601 UTC"
      - name: reported_on
        type: datetime
        source: input
        description: "Date the failure was reported, ISO 8601 UTC"
        constraints: ">= installed_on"
      - name: installed_by_certified_installer
        type: boolean
        source: input
        default: false
        description: "True when the installation was performed under the certified-installer program; unlocks the labour allowance"
      - name: status
        type: enum
        source: computed
        default: SUBMITTED
        description: "Claim adjudication state"
        constraints: "one of {SUBMITTED, TRIAGE, ADJUDICATION_READY, APPROVED, DENIED}"
      - name: required_reviews
        type: array
        source: computed
        description: "Review kinds that must both be answered before adjudication; set at triage from claim_type"
      - name: materials_review_outcome
        type: enum
        source: computed
        default: null
        description: "Outcome of the MATERIALS review branch"
        constraints: "one of {DEFECT_CONFIRMED, NO_DEFECT, INCONCLUSIVE}"
      - name: field_review_outcome
        type: enum
        source: computed
        default: null
        description: "Outcome of the FIELD review branch"
        constraints: "one of {DEFECT_CONFIRMED, NO_DEFECT, INCONCLUSIVE}"
      - name: assigned_adjuster_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the WarrantyAdjuster that triaged the claim; drives SoD rule S4"
      - name: elapsed_months
        type: integer
        source: computed
        default: null
        description: "Whole calendar months from installed_on to reported_on, floored; computed at adjudication"
      - name: settlement_variant
        type: enum
        source: computed
        default: null
        description: "Which settlement algorithm was applied"
        constraints: "one of {PRORATED_STRAIGHT_LINE, STEPPED_SCHEDULE}"
      - name: replacement_value_cents
        type: integer
        source: computed
        default: null
        description: "claimed_area_sqm valued at the SKU royalty basis price, whole cents"
      - name: labor_allowance_cents
        type: integer
        source: computed
        default: null
        description: "Labour allowance granted when installed_by_certified_installer is true"
      - name: settlement_amount_cents
        type: integer
        source: computed
        default: null
        description: "Approved settlement in whole cents; see calculations.warranty_settlement_amount"
      - name: denial_reason
        type: string
        source: input
        default: null
        description: "Reason recorded when the claim was denied"

# =============================================================================
# Table 2: State Machine Table  (§1.2)
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # Formulation — CYCLIC (DRAFT -> UNDER_REVIEW -> REJECTED -> DRAFT)
  # ---------------------------------------------------------------------------
  - entity: Formulation
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: "POST /formulations/{id}/components  or  DELETE /formulations/{id}/components/{component_id}"
        actor: Formulator
        preconditions:
          - "formulation.status IN {DRAFT, REJECTED}"
          - "RawMaterial.status == ACTIVE for the material being added (add only)"
          - "phr <= RawMaterial.max_phr (add only)"
          - "no other FormulationComponent on this formulation already references the same raw_material_id (add only)"
        side_effects:
          - "recomputes calculations.formulation_blend_metrics -> total_phr, resin_phr, plasticizer_phr, filler_phr, stabilizer_phr, blended_cost_per_kg_cents, performance_score, indentation_resistance_class"
          - "increments Formulation.version by 1 and refreshes updated_at"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /formulations/{id}/components  or  DELETE /formulations/{id}/components/{component_id}"
        actor: Formulator
        preconditions:
          - "formulation.status == REJECTED"
        side_effects:
          - "recomputes calculations.formulation_blend_metrics (all seven derived fields)"
          - "increments Formulation.version by 1 and refreshes updated_at"
        note: "Closes the revision loop DRAFT -> UNDER_REVIEW -> REJECTED -> DRAFT. rejection_count is NOT reset."

      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /formulations/{id}/submit"
        actor: Formulator
        preconditions:
          - "formulation.status == DRAFT"
          - "at least one FormulationComponent exists"
          - "resin_phr == 100.00 exactly"
          - "every component's RawMaterial.status == ACTIVE"
        side_effects:
          - "sets submitted_by_user_id = X-User-ID"
          - "recomputes calculations.formulation_blend_metrics (all seven derived fields)"
          - "increments Formulation.version by 1"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /formulations/{id}/review-decision { decision: APPROVE }"
        actor: TechnicalDirector
        preconditions:
          - "formulation.status == UNDER_REVIEW"
          - "SoD S1: X-User-ID != formulation.authored_by_user_id"
          - "every component's RawMaterial.status == ACTIVE"
          - "performance_score >= 60.00 (MIN_APPROVAL_SCORE, inclusive)"
          - "indentation_resistance_class != CLASS_23_31"
        side_effects:
          - "writes material_cost_snapshot_cents = RawMaterial.cost_per_kg_cents and snapshot_at = clock onto EVERY FormulationComponent of this formulation (version-pinning on approval)"
          - "sets cost_basis = PINNED and recomputes blended_cost_per_kg_cents from the snapshots"
          - "sets approved_by_user_id = X-User-ID, approved_at = clock"
          - "CASCADE hop 1: when supersedes_formulation_id is not null, the referenced Formulation transitions APPROVED -> SUPERSEDED"
          - "CASCADE hop 2: because that formulation became SUPERSEDED, every ProductSku whose formulation_id points at it has pin_stale set to true (its own version bumped)"
          - "increments Formulation.version by 1 (and the superseded formulation's version by 1)"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /formulations/{id}/review-decision { decision: REJECT, review_note }"
        actor: TechnicalDirector
        preconditions:
          - "formulation.status == UNDER_REVIEW"
          - "SoD S1: X-User-ID != formulation.authored_by_user_id"
        side_effects:
          - "increments rejection_count by 1"
          - "increments Formulation.version by 1"

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: a revision whose supersedes_formulation_id == this id is APPROVED"
        actor: system
        preconditions:
          - "formulation.status == APPROVED"
        side_effects:
          - "sets pin_stale = true on every ProductSku whose formulation_id == this id"
          - "increments Formulation.version by 1"

      - from: APPROVED
        to: RETIRED
        trigger: "system: a RawMaterial referenced by one of this formulation's components moves to RESTRICTED (POST /raw-materials/{id}/status)"
        actor: system
        preconditions:
          - "formulation.status IN {APPROVED, SUPERSEDED}"
        side_effects:
          - "CASCADE hop 2 of raw_material_restriction: because the formulation is RETIRED, every ProductSku whose formulation_id == this id and whose certification_status IN {TESTING, PROVISIONAL, CERTIFIED} moves to SUSPENDED and whose commercial_status == RELEASED moves to HOLD"
          - "increments Formulation.version by 1"

      - from: SUPERSEDED
        to: RETIRED
        trigger: "system: a RawMaterial referenced by one of this formulation's components moves to RESTRICTED"
        actor: system
        preconditions:
          - "formulation.status == SUPERSEDED"
        side_effects:
          - "same ProductSku cascade as APPROVED -> RETIRED"
          - "increments Formulation.version by 1"

  # ---------------------------------------------------------------------------
  # ProductSku — PARALLEL DIMENSIONS (certification_status x commercial_status)
  # ---------------------------------------------------------------------------
  - entity: ProductSku
    initial_state: "certification_status=UNCERTIFIED, commercial_status=DEVELOPMENT"
    terminal_states: ["certification_status=DECERTIFIED", "commercial_status=DISCONTINUED"]
    transitions:
      # --- certification dimension ---
      - from: "certification_status=UNCERTIFIED"
        to: "certification_status=TESTING"
        trigger: "POST /product-skus/{id}/begin-testing"
        actor: QaTechnician
        preconditions:
          - "sku.certification_status IN {UNCERTIFIED, SUSPENDED}"
          - "sku.commercial_status != DISCONTINUED"
          - "CROSS-ENTITY (ProductSku <- Formulation): Formulation(sku.formulation_id).status == APPROVED"
          - "CROSS-ENTITY (ProductSku <- PrintFilm): PrintFilm(sku.print_film_id).status == AVAILABLE"
          - "DesignLicense(PrintFilm.license_id).status == ACTIVE and valid_from <= clock < valid_until"
          - "no ProductionRun for this sku has run_status IN {SETUP, RUNNING}"
        side_effects:
          - "sets pin_stale = false, clears pinned_formulation_version, pinned_print_film_version, standard_cost_cents_per_sqm, list_price_cents_per_sqm, certified_at, certified_by_user_id"
          - "increments ProductSku.version by 1"

      - from: "certification_status=SUSPENDED"
        to: "certification_status=TESTING"
        trigger: "POST /product-skus/{id}/begin-testing"
        actor: QaTechnician
        preconditions:
          - "same preconditions as UNCERTIFIED -> TESTING"
        side_effects:
          - "same side effects as UNCERTIFIED -> TESTING"
        note: "Retest loop: SUSPENDED -> TESTING -> ... -> CERTIFIED is a cycle on the certification dimension."

      - from: "certification_status=TESTING"
        to: "certification_status=PROVISIONAL"
        trigger: "system: a TestPanel for this sku reaches PASSED and the PASSED coverage includes RESIDUAL_INDENTATION and DIMENSIONAL_STABILITY_HEAT"
        actor: system
        preconditions:
          - "sku.certification_status == TESTING"
        side_effects:
          - "increments ProductSku.version by 1"

      - from: "certification_status=TESTING"
        to: "certification_status=CERTIFIED"
        trigger: "POST /product-skus/{id}/certify"
        actor: TechnicalDirector
        preconditions:
          - "sku.certification_status IN {TESTING, PROVISIONAL}"
          - "for EVERY test_type in calculations.sku_required_test_types there exists a TestResult with outcome == PASS whose attempt_no == its TestPanel.attempt_no and whose TestPanel.sku_id == this sku and TestPanel.status == PASSED"
          - "SoD S2: X-User-ID is not the recorded_by_user_id of any of those qualifying TestResults"
          - "CROSS-ENTITY: Formulation(sku.formulation_id).status == APPROVED"
          - "CROSS-ENTITY: DesignLicense(PrintFilm(sku.print_film_id).license_id).status == ACTIVE"
        side_effects:
          - "pins pinned_formulation_version = Formulation.version, pinned_print_film_version = PrintFilm.version"
          - "stamps standard_cost_cents_per_sqm from calculations.sku_standard_cost variant PINNED_BASIS and list_price_cents_per_sqm from it"
          - "sets pin_stale = false, certified_at = clock, certified_by_user_id = X-User-ID"
          - "increments ProductSku.version by 1"

      - from: "certification_status=PROVISIONAL"
        to: "certification_status=CERTIFIED"
        trigger: "POST /product-skus/{id}/certify"
        actor: TechnicalDirector
        preconditions:
          - "same preconditions as TESTING -> CERTIFIED"
        side_effects:
          - "same side effects as TESTING -> CERTIFIED"

      - from: "certification_status=TESTING"
        to: "certification_status=UNCERTIFIED"
        trigger: "system: a TestPanel for this sku reaches FAILED"
        actor: system
        preconditions:
          - "sku.certification_status == TESTING"
        side_effects:
          - "CASCADE hop 2 of panel_failure: because certification collapsed, every ProductionRun for this sku with run_status IN {PLANNED, SETUP} transitions to ABORTED with abort_reason = 'SKU_CERTIFICATION_LOST'"
          - "increments ProductSku.version by 1"

      - from: "certification_status=PROVISIONAL"
        to: "certification_status=SUSPENDED"
        trigger: "system: a TestPanel for this sku reaches FAILED, or the sku's Formulation is RETIRED, or the sku's DesignLicense is TERMINATED"
        actor: system
        preconditions:
          - "sku.certification_status IN {PROVISIONAL, CERTIFIED}"
        side_effects:
          - "CASCADE: every ProductionRun for this sku with run_status IN {PLANNED, SETUP} transitions to ABORTED"
          - "increments ProductSku.version by 1"

      - from: "certification_status=CERTIFIED"
        to: "certification_status=SUSPENDED"
        trigger: "system: a TestPanel for this sku reaches FAILED, or the sku's Formulation is RETIRED"
        actor: system
        preconditions:
          - "sku.certification_status == CERTIFIED"
        side_effects:
          - "CASCADE: every ProductionRun for this sku with run_status IN {PLANNED, SETUP} transitions to ABORTED"
          - "CASCADE: commercial_status RELEASED -> HOLD on the same row (cross-dimension coupling)"
          - "increments ProductSku.version by 1"

      # --- commercial dimension ---
      - from: "commercial_status=DEVELOPMENT"
        to: "commercial_status=RELEASED"
        trigger: "POST /product-skus/{id}/commercial-status { to_status: RELEASED }"
        actor: PlantAdmin
        preconditions:
          - "sku.commercial_status IN {DEVELOPMENT, HOLD}"
          - "PARALLEL-DIMENSION GUARD: sku.certification_status == CERTIFIED"
          - "sku.pin_stale == false"
        side_effects:
          - "increments ProductSku.version by 1"

      - from: "commercial_status=RELEASED"
        to: "commercial_status=HOLD"
        trigger: "POST /product-skus/{id}/commercial-status { to_status: HOLD }  or  system cascade from certification loss / license suspension / license termination"
        actor: PlantAdmin
        preconditions:
          - "sku.commercial_status == RELEASED"
        side_effects:
          - "CASCADE hop 3 of license_termination and raw_material_restriction: because the sku went on HOLD, every Batch for this sku with status == IN_STOCK transitions to HELD with hold_reason = 'SKU_ON_HOLD'"
          - "increments ProductSku.version by 1"

      - from: "commercial_status=HOLD"
        to: "commercial_status=RELEASED"
        trigger: "POST /product-skus/{id}/commercial-status { to_status: RELEASED }"
        actor: PlantAdmin
        preconditions:
          - "sku.commercial_status == HOLD"
          - "PARALLEL-DIMENSION GUARD: sku.certification_status == CERTIFIED"
          - "sku.pin_stale == false"
        side_effects:
          - "increments ProductSku.version by 1"
        note: "Cyclic on the commercial dimension: RELEASED -> HOLD -> RELEASED. Batches HELD by the hold cascade are NOT auto-released; they need POST /batches/{id}/hold-status."

      - from: "commercial_status=DEVELOPMENT"
        to: "commercial_status=DISCONTINUED"
        trigger: "POST /product-skus/{id}/commercial-status { to_status: DISCONTINUED }"
        actor: PlantAdmin
        preconditions:
          - "sku.commercial_status IN {DEVELOPMENT, RELEASED, HOLD}"
        side_effects:
          - "CROSS-DIMENSION: certification_status is forced to DECERTIFIED on the same row"
          - "CASCADE: every Allocation for this sku with status IN {OPEN, PARTIALLY_FILLED} transitions to CANCELLED (conditional cascade — FILLED allocations are left alone)"
          - "CASCADE (caused by the cancellation above): every ACTIVE AllocationLine of those allocations becomes VOIDED with void_reason = ALLOCATION_CANCELLED, and each referenced Batch's available_quantity_sqm is increased by the voided line's quantity_sqm"
          - "increments ProductSku.version by 1"

      - from: "commercial_status=RELEASED"
        to: "commercial_status=DISCONTINUED"
        trigger: "POST /product-skus/{id}/commercial-status { to_status: DISCONTINUED }"
        actor: PlantAdmin
        preconditions:
          - "sku.commercial_status IN {DEVELOPMENT, RELEASED, HOLD}"
        side_effects:
          - "same as DEVELOPMENT -> DISCONTINUED"

  # ---------------------------------------------------------------------------
  # TestPanel — CYCLIC (IN_TEST -> RETEST_REQUIRED -> IN_TEST)
  # ---------------------------------------------------------------------------
  - entity: TestPanel
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: IN_TEST
        trigger: "POST /test-panels/{id}/start"
        actor: QaTechnician
        preconditions:
          - "panel.status IN {SCHEDULED, RETEST_REQUIRED}"
          - "CROSS-ENTITY (TestPanel <- ProductSku): ProductSku(panel.sku_id).certification_status IN {TESTING, PROVISIONAL}"
        side_effects:
          - "sets started_by_user_id = X-User-ID"
          - "recomputes required_test_types from calculations.sku_required_test_types"
          - "increments TestPanel.version by 1"

      - from: RETEST_REQUIRED
        to: IN_TEST
        trigger: "POST /test-panels/{id}/start"
        actor: QaTechnician
        preconditions:
          - "panel.status == RETEST_REQUIRED"
          - "ProductSku(panel.sku_id).certification_status IN {TESTING, PROVISIONAL}"
          - "panel.retest_count <= 2 (MAX_RETESTS = 2 permitted restarts, i.e. at most three attempts); a fourth attempt is rejected by validation V-CON-8"
        side_effects:
          - "increments attempt_no by 1 (prior-attempt TestResults stay immutable but no longer count toward coverage)"
          - "sets started_by_user_id = X-User-ID"
          - "increments TestPanel.version by 1"
        note: "Retest loop. The cycle terminates HERE and only here: V-CON-8 refuses the restart once retest_count has passed MAX_RETESTS, leaving the panel parked in RETEST_REQUIRED (from which POST /test-panels/{id}/void is the only exit). The coverage-completion path never fails a panel for being MARGINAL, so there is exactly one cap mechanism."

      - from: IN_TEST
        to: IN_TEST
        trigger: "POST /test-panels/{id}/results"
        actor: QaTechnician
        preconditions:
          - "panel.status == IN_TEST"
          - "no TestResult with this test_type already exists for this panel at the current attempt_no"
          - "test_type is a member of panel.required_test_types"
        side_effects:
          - "creates a TestResult with computed unit, spec_limit and outcome (calculations.test_spec_limit_and_outcome)"
          - "increments TestPanel.version by 1"
        note: "Stays IN_TEST while coverage of required_test_types at the current attempt is incomplete."

      - from: IN_TEST
        to: PASSED
        trigger: "system: on POST /test-panels/{id}/results, coverage of required_test_types at the current attempt_no is complete and every outcome == PASS"
        actor: system
        preconditions:
          - "panel.status == IN_TEST"
        side_effects:
          - "CASCADE: ProductSku(panel.sku_id) certification TESTING -> PROVISIONAL when the PASSED coverage includes RESIDUAL_INDENTATION and DIMENSIONAL_STABILITY_HEAT"
          - "increments TestPanel.version by 1"

      - from: IN_TEST
        to: RETEST_REQUIRED
        trigger: "system: on POST /test-panels/{id}/results, coverage of required_test_types at the current attempt_no is complete, no outcome == FAIL, and at least one outcome == MARGINAL"
        actor: system
        preconditions:
          - "panel.status == IN_TEST"
        side_effects:
          - "increments retest_count by 1 — unconditionally, so the counter can reach 3 and V-CON-8 has a reachable trigger state"
          - "increments TestPanel.version by 1"
        note: "No cap is applied here; a MARGINAL never fails a panel. The cap lives on RETEST_REQUIRED -> IN_TEST (V-CON-8)."

      - from: IN_TEST
        to: FAILED
        trigger: "system: on POST /test-panels/{id}/results any outcome == FAIL"
        actor: system
        preconditions:
          - "panel.status == IN_TEST"
        side_effects:
          - "CASCADE hop 1 of panel_failure: ProductSku(panel.sku_id) certification TESTING -> UNCERTIFIED, or PROVISIONAL/CERTIFIED -> SUSPENDED"
          - "increments TestPanel.version by 1"

      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /test-panels/{id}/void"
        actor: QaTechnician
        preconditions:
          - "panel.status IN {SCHEDULED, IN_TEST, RETEST_REQUIRED}"
        side_effects:
          - "sets void_reason"
          - "increments TestPanel.version by 1"

      - from: IN_TEST
        to: VOIDED
        trigger: "POST /test-panels/{id}/void"
        actor: QaTechnician
        preconditions:
          - "panel.status IN {SCHEDULED, IN_TEST, RETEST_REQUIRED}"
        side_effects:
          - "sets void_reason; existing TestResults remain but no longer qualify for certification because the panel is not PASSED"
          - "increments TestPanel.version by 1"

      - from: RETEST_REQUIRED
        to: VOIDED
        trigger: "POST /test-panels/{id}/void"
        actor: QaTechnician
        preconditions:
          - "panel.status IN {SCHEDULED, IN_TEST, RETEST_REQUIRED}"
        side_effects:
          - "sets void_reason; existing TestResults remain but no longer qualify for certification"
          - "increments TestPanel.version by 1"
        note: "The only exit from a panel parked in RETEST_REQUIRED by V-CON-8."

  # ---------------------------------------------------------------------------
  # PrintFilm — LINEAR with one revert edge (AVAILABLE <-> RESTRICTED)
  # ---------------------------------------------------------------------------
  - entity: PrintFilm
    initial_state: AVAILABLE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: AVAILABLE
        to: RESTRICTED
        trigger: "POST /print-films/{id}/status { to_status: RESTRICTED }  or  system cascade from DesignLicense ACTIVE -> SUSPENDED"
        actor: PlantAdmin
        preconditions:
          - "film.status == AVAILABLE"
        side_effects:
          - "the design may no longer found a begin-testing, run creation or run start (validation V-REF-3); existing PLANNED runs keep their windows"
          - "increments PrintFilm.version by 1"
        note: "Operator path: a damaged emboss plate or a licensor hold takes the design off the library without touching the grant."

      - from: RESTRICTED
        to: AVAILABLE
        trigger: "POST /print-films/{id}/status { to_status: AVAILABLE }  or  system cascade from DesignLicense SUSPENDED -> ACTIVE"
        actor: PlantAdmin
        preconditions:
          - "film.status == RESTRICTED"
          - "CROSS-ENTITY (PrintFilm -> DesignLicense): DesignLicense(film.license_id).status == ACTIVE"
        side_effects:
          - "increments PrintFilm.version by 1"

      - from: AVAILABLE
        to: WITHDRAWN
        trigger: "POST /print-films/{id}/status { to_status: WITHDRAWN }  or  system cascade from DesignLicense -> TERMINATED"
        actor: PlantAdmin
        preconditions:
          - "film.status IN {AVAILABLE, RESTRICTED}"
        side_effects:
          - "the design is permanently retired from the library"
          - "increments PrintFilm.version by 1"

      - from: RESTRICTED
        to: WITHDRAWN
        trigger: "POST /print-films/{id}/status { to_status: WITHDRAWN }  or  system cascade from DesignLicense -> TERMINATED"
        actor: PlantAdmin
        preconditions:
          - "film.status IN {AVAILABLE, RESTRICTED}"
        side_effects:
          - "same as AVAILABLE -> WITHDRAWN"
          - "increments PrintFilm.version by 1"

  # ---------------------------------------------------------------------------
  # DesignLicense — CYCLIC (ACTIVE <-> SUSPENDED) + supersede + lazy expiry
  # ---------------------------------------------------------------------------
  - entity: DesignLicense
    initial_state: ACTIVE
    terminal_states: [EXPIRED, SUPERSEDED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /design-licenses/{id}/status { to_status: SUSPENDED }"
        actor: PlantAdmin
        preconditions:
          - "license.status == ACTIVE"
        side_effects:
          - "CASCADE hop 1: every PrintFilm with license_id == this id and status == AVAILABLE moves to RESTRICTED"
          - "CASCADE hop 2 (caused by hop 1): every ProductSku whose print_film_id points at one of those films and whose commercial_status == RELEASED moves to HOLD"
          - "CASCADE hop 3 (caused by hop 2): every Batch of those SKUs with status == IN_STOCK moves to HELD with hold_reason = 'SKU_ON_HOLD'"
          - "increments DesignLicense.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /design-licenses/{id}/status { to_status: ACTIVE }"
        actor: PlantAdmin
        preconditions:
          - "license.status == SUSPENDED"
          - "clock < license.valid_until"
        side_effects:
          - "every PrintFilm with license_id == this id and status == RESTRICTED moves back to AVAILABLE"
          - "increments DesignLicense.version by 1"
        note: "Asymmetric cycle: reactivation restores films but NOT the SKUs put on HOLD nor the Batches put on HELD."

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /design-licenses/{id}/status { to_status: TERMINATED }"
        actor: TechnicalDirector
        preconditions:
          - "license.status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "CASCADE hop 1 of license_termination: every PrintFilm with license_id == this id moves to WITHDRAWN"
          - "CASCADE hop 2 (caused by hop 1): every ProductSku on a WITHDRAWN film with commercial_status == RELEASED moves to HOLD, and with certification_status IN {PROVISIONAL, CERTIFIED} moves to SUSPENDED"
          - "CASCADE hop 3 (caused by hop 2): every Batch of those SKUs with status == IN_STOCK moves to HELD with hold_reason = 'SKU_ON_HOLD'"
          - "CASCADE hop 4 (caused by hop 3): every ACTIVE AllocationLine on those batches becomes VOIDED with void_reason = BATCH_HELD, its quantity_sqm returns to Batch.available_quantity_sqm, and the owning Allocation's allocated_quantity_sqm and status are recomputed (FILLED -> PARTIALLY_FILLED or OPEN)"
          - "increments DesignLicense.version by 1"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /design-licenses/{id}/status { to_status: TERMINATED }"
        actor: TechnicalDirector
        preconditions:
          - "license.status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "same four-hop cascade as ACTIVE -> TERMINATED"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /design-licenses/{id}/amendments"
        actor: TechnicalDirector
        preconditions:
          - "license.status == ACTIVE"
          - "amendment term_volume_cap_sqm >= this license's consumed_volume_sqm + reserved_volume_sqm"
        side_effects:
          - "creates a new DesignLicense row in ACTIVE with supersedes_license_id = this id, carrying over reserved_volume_sqm, consumed_volume_sqm and accrued_royalty_cents unchanged (ledger continuity)"
          - "repoints every PrintFilm with license_id == this id to the new license id and increments each film's version by 1"
          - "increments DesignLicense.version by 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system: lazy expiry evaluated at POST /production-runs, POST /production-runs/{id}/start and POST /product-skus/{id}/begin-testing when clock >= license.valid_until"
        actor: system
        preconditions:
          - "license.status == ACTIVE"
          - "clock >= license.valid_until"
        side_effects:
          - "sets status = EXPIRED and increments DesignLicense.version by 1, then the triggering request is rejected with ERR_LICENSE_EXPIRED"
        note: "Deterministic against the logical clock; no wall-clock dependency."

  # ---------------------------------------------------------------------------
  # ProductionRun — PARALLEL DIMENSIONS (run_status x qc_disposition)
  # ---------------------------------------------------------------------------
  - entity: ProductionRun
    initial_state: "run_status=PLANNED, qc_disposition=PENDING"
    terminal_states: ["run_status=ABORTED", "qc_disposition=SCRAPPED"]
    transitions:
      - from: "(creation)"
        to: "run_status=PLANNED"
        trigger: "POST /production-runs"
        actor: ProductionPlanner
        preconditions:
          - "ProductSku.certification_status IN {TESTING, PROVISIONAL, CERTIFIED}"
          - "ProductSku.commercial_status != DISCONTINUED"
          - "PressLine.status == AVAILABLE and min_thickness_mm <= sku.overall_thickness_mm <= max_thickness_mm"
          - "DesignLicense.status == ACTIVE and valid_from <= planned_start_utc < valid_until"
          - "press-line interval rule (half-open + changeover buffer) satisfied"
          - "print-film roll-set rule (closed interval + aggregate capacity) satisfied"
          - "license term cap: consumed_volume_sqm + reserved_volume_sqm + planned_quantity_sqm <= term_volume_cap_sqm"
        side_effects:
          - "reserves license volume: DesignLicense.reserved_volume_sqm += planned_quantity_sqm (RESERVED_VOLUME_BASIS variant of calculations.license_volume_ledger)"
          - "increments DesignLicense.version by 1"

      - from: "run_status=PLANNED"
        to: "run_status=SETUP"
        trigger: "POST /production-runs/{id}/setup"
        actor: ProductionPlanner
        preconditions:
          - "run.run_status == PLANNED"
          - "CROSS-ENTITY (ProductionRun <- ProductSku): sku.certification_status IN {PROVISIONAL, CERTIFIED} and sku.commercial_status IN {DEVELOPMENT, RELEASED}"
          - "CROSS-ENTITY (ProductionRun <- PressLine): PressLine.status == AVAILABLE"
          - "clock >= planned_start_utc - 120 minutes (SETUP_LEAD_MINUTES)"
        side_effects:
          - "computes changeover_minutes_applied via calculations.press_line_changeover_gap against the latest earlier run on the same line"
          - "increments ProductionRun.version by 1"

      - from: "run_status=SETUP"
        to: "run_status=RUNNING"
        trigger: "POST /production-runs/{id}/start"
        actor: ProductionPlanner
        preconditions:
          - "run.run_status == SETUP"
          - "CROSS-ENTITY: PressLine.status == AVAILABLE"
          - "CROSS-ENTITY (ProductionRun <- PrintFilm): PrintFilm.status == AVAILABLE"
          - "DesignLicense.status == ACTIVE and clock < valid_until"
          - "SAFETY: when sku.waterproof_rated is true, a TestResult with test_type == SLIP_RESISTANCE and outcome == PASS must exist on a PASSED TestPanel for this sku whose updated_at is strictly later than clock - 180 days (see validation V-SAFE-1: a DCOF qualification older than that has lapsed)"
        side_effects:
          - "increments ProductionRun.version by 1"

      - from: "run_status=RUNNING"
        to: "run_status=COMPLETED"
        trigger: "POST /production-runs/{id}/complete"
        actor: ProductionPlanner
        preconditions:
          - "run.run_status == RUNNING"
        side_effects:
          - "stores actual_quantity_sqm and the five measured metrics"
          - "computes calculations.run_quality_metrics -> pattern_waste_sqm and the four QC gate booleans and auto_disposition_recommendation"
          - "license ledger (ACTUAL_VOLUME_BASIS): reserved_volume_sqm -= planned_quantity_sqm; consumed_volume_sqm += actual_quantity_sqm"
          - "computes run royalty via calculations.license_royalty_accrual, stores it in royalty_accrued_cents and adds it to DesignLicense.accrued_royalty_cents"
          - "creates exactly one Batch in IN_PRODUCTION with quantity_sqm = actual_quantity_sqm and available_quantity_sqm = 0, ONLY when actual_quantity_sqm > 0 (zero-quantity boundary: no Batch is created at exactly 0)"
          - "sets completed_by_user_id = X-User-ID"
          - "increments ProductionRun.version by 1 and DesignLicense.version by 1"

      - from: "run_status=PLANNED"
        to: "run_status=ABORTED"
        trigger: "POST /production-runs/{id}/abort  or  system cascade from certification loss"
        actor: ProductionPlanner
        preconditions:
          - "run.run_status IN {PLANNED, SETUP, RUNNING}"
        side_effects:
          - "COMPENSATION: DesignLicense.reserved_volume_sqm -= planned_quantity_sqm, restoring the reserved-entitlement ledger to its pre-creation value"
          - "increments DesignLicense.version by 1 and ProductionRun.version by 1"

      - from: "run_status=SETUP"
        to: "run_status=ABORTED"
        trigger: "POST /production-runs/{id}/abort  or  system cascade from certification loss"
        actor: ProductionPlanner
        preconditions:
          - "run.run_status IN {PLANNED, SETUP, RUNNING}"
        side_effects:
          - "same compensation as PLANNED -> ABORTED"

      - from: "run_status=RUNNING"
        to: "run_status=ABORTED"
        trigger: "POST /production-runs/{id}/abort"
        actor: ProductionPlanner
        preconditions:
          - "run.run_status IN {PLANNED, SETUP, RUNNING}"
        side_effects:
          - "same compensation as PLANNED -> ABORTED; no Batch is created and no royalty is accrued"

      - from: "qc_disposition=PENDING"
        to: "qc_disposition=RELEASED"
        trigger: "POST /production-runs/{id}/qc-disposition { to_disposition: RELEASED }"
        actor: QaTechnician
        preconditions:
          - "run.run_status == COMPLETED"
          - "run.qc_disposition IN {PENDING, QUARANTINED}"
          - "SAFETY: registration_within_tolerance AND emboss_within_tolerance AND curl_within_tolerance AND tongue_within_tolerance are all true"
        side_effects:
          - "the run's Batch transitions IN_PRODUCTION -> IN_STOCK (or HELD -> IN_STOCK) and available_quantity_sqm is set to quantity_sqm"
          - "increments ProductionRun.version by 1 and Batch.version by 1"

      - from: "qc_disposition=PENDING"
        to: "qc_disposition=QUARANTINED"
        trigger: "POST /production-runs/{id}/qc-disposition { to_disposition: QUARANTINED }"
        actor: QaTechnician
        preconditions:
          - "run.run_status == COMPLETED"
          - "run.qc_disposition == PENDING"
        side_effects:
          - "the run's Batch transitions IN_PRODUCTION -> HELD with hold_reason = 'QC_QUARANTINE' and held_by_user_id = X-User-ID"
          - "increments ProductionRun.version by 1 and Batch.version by 1"

      - from: "qc_disposition=QUARANTINED"
        to: "qc_disposition=RELEASED"
        trigger: "POST /production-runs/{id}/qc-disposition { to_disposition: RELEASED }"
        actor: QaTechnician
        preconditions:
          - "same as PENDING -> RELEASED"
        side_effects:
          - "same as PENDING -> RELEASED"

      - from: "qc_disposition=PENDING"
        to: "qc_disposition=SCRAPPED"
        trigger: "POST /production-runs/{id}/qc-disposition { to_disposition: SCRAPPED }"
        actor: QaTechnician
        preconditions:
          - "run.run_status == COMPLETED"
          - "run.qc_disposition IN {PENDING, QUARANTINED, RELEASED}"
        side_effects:
          - "COMPENSATION hop 1: DesignLicense.consumed_volume_sqm -= run.actual_quantity_sqm and DesignLicense.accrued_royalty_cents -= run.royalty_accrued_cents; run.royalty_accrued_cents is then set to 0"
          - "CASCADE hop 2: the run's Batch transitions to SCRAPPED with available_quantity_sqm = 0"
          - "CASCADE hop 3 (caused by hop 2): every ACTIVE AllocationLine on that Batch becomes VOIDED with void_reason = BATCH_SCRAPPED, and each owning Allocation's allocated_quantity_sqm and upgrade_cost_total_cents are recomputed and its status moves FILLED -> PARTIALLY_FILLED or PARTIALLY_FILLED -> OPEN"
          - "increments ProductionRun.version, DesignLicense.version and Batch.version by 1"

      - from: "qc_disposition=QUARANTINED"
        to: "qc_disposition=SCRAPPED"
        trigger: "POST /production-runs/{id}/qc-disposition { to_disposition: SCRAPPED }"
        actor: QaTechnician
        preconditions:
          - "same as PENDING -> SCRAPPED"
        side_effects:
          - "same three-hop chain as PENDING -> SCRAPPED"

      - from: "qc_disposition=RELEASED"
        to: "qc_disposition=SCRAPPED"
        trigger: "POST /production-runs/{id}/qc-disposition { to_disposition: SCRAPPED }"
        actor: QaTechnician
        preconditions:
          - "same as PENDING -> SCRAPPED"
        side_effects:
          - "same three-hop chain as PENDING -> SCRAPPED"

  # ---------------------------------------------------------------------------
  # Batch — CYCLIC (IN_STOCK <-> HELD)
  # ---------------------------------------------------------------------------
  - entity: Batch
    initial_state: IN_PRODUCTION
    terminal_states: [SCRAPPED]
    transitions:
      - from: IN_PRODUCTION
        to: IN_STOCK
        trigger: "system: producing run's qc_disposition becomes RELEASED"
        actor: system
        preconditions:
          - "batch.status == IN_PRODUCTION"
        side_effects:
          - "available_quantity_sqm = quantity_sqm"
          - "increments Batch.version by 1"

      - from: IN_PRODUCTION
        to: HELD
        trigger: "system: producing run's qc_disposition becomes QUARANTINED"
        actor: system
        preconditions:
          - "batch.status == IN_PRODUCTION"
        side_effects:
          - "sets hold_reason = 'QC_QUARANTINE', held_by_user_id = the acting QaTechnician"
          - "increments Batch.version by 1"

      - from: IN_STOCK
        to: HELD
        trigger: "POST /batches/{id}/hold-status { action: HOLD, hold_reason }  or  system cascade from ProductSku HOLD"
        actor: QaTechnician
        preconditions:
          - "batch.status == IN_STOCK"
        side_effects:
          - "sets held_by_user_id = X-User-ID (or 'system' for the cascade path)"
          - "CASCADE: every ACTIVE AllocationLine on this batch becomes VOIDED with void_reason = BATCH_HELD; each line's quantity_sqm is added back to available_quantity_sqm"
          - "CASCADE (caused by the voids above): each owning Allocation recomputes allocated_quantity_sqm and upgrade_cost_total_cents and moves FILLED -> PARTIALLY_FILLED or PARTIALLY_FILLED -> OPEN"
          - "increments Batch.version by 1"

      - from: HELD
        to: IN_STOCK
        trigger: "POST /batches/{id}/hold-status { action: RELEASE_HOLD }"
        actor: QaTechnician
        preconditions:
          - "batch.status == HELD"
          - "SoD S3: X-User-ID != batch.held_by_user_id"
          - "CROSS-ENTITY (Batch <- ProductionRun): ProductionRun(batch.production_run_id).qc_disposition == RELEASED"
          - "CROSS-ENTITY (Batch <- ProductSku): ProductSku(batch.sku_id).commercial_status != DISCONTINUED and certification_status NOT IN {SUSPENDED, DECERTIFIED}"
        side_effects:
          - "clears hold_reason and held_by_user_id; available_quantity_sqm is recomputed as quantity_sqm minus the sum of ACTIVE AllocationLine quantities on this batch"
          - "increments Batch.version by 1"
        note: "Closes the IN_STOCK -> HELD -> IN_STOCK cycle."

      - from: IN_STOCK
        to: SCRAPPED
        trigger: "POST /batches/{id}/hold-status { action: SCRAP, hold_reason }  or  system cascade from qc_disposition SCRAPPED"
        actor: QaTechnician
        preconditions:
          - "batch.status IN {IN_PRODUCTION, IN_STOCK, HELD}"
        side_effects:
          - "available_quantity_sqm = 0"
          - "CASCADE: every ACTIVE AllocationLine on this batch becomes VOIDED with void_reason = BATCH_SCRAPPED and each owning Allocation is recomputed"
          - "increments Batch.version by 1"

      - from: HELD
        to: SCRAPPED
        trigger: "POST /batches/{id}/hold-status { action: SCRAP, hold_reason }"
        actor: QaTechnician
        preconditions:
          - "batch.status IN {IN_PRODUCTION, IN_STOCK, HELD}"
        side_effects:
          - "same as IN_STOCK -> SCRAPPED"

  # ---------------------------------------------------------------------------
  # Allocation — CYCLIC (FILLED -> PARTIALLY_FILLED -> OPEN via line voids)
  # ---------------------------------------------------------------------------
  - entity: Allocation
    initial_state: OPEN
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: OPEN
        to: PARTIALLY_FILLED
        trigger: "POST /allocations/{id}/fill"
        actor: Distributor
        preconditions:
          - "allocation.status IN {OPEN, PARTIALLY_FILLED} — a FILLED allocation is refused by V-CON-9 (ERR_ALLOCATION_OVER_REQUEST, 422), a RELEASED or CANCELLED one by V-STATE-9 (ERR_INVALID_ALLOCATION_STATE, 409)"
          - "OCC: expected_allocation_version == allocation.version"
          - "Distributor ownership: X-User-ID == allocation.distributor_id"
          - "candidate batch set from calculations.allocation_fill_plan is non-empty"
        side_effects:
          - "creates one AllocationLine per selected batch with computed quantity_sqm, substitution_kind and upgrade_cost_delta_cents"
          - "decrements each selected Batch.available_quantity_sqm by the line quantity and increments each Batch.version by 1"
          - "recomputes allocated_quantity_sqm and upgrade_cost_total_cents"
          - "increments Allocation.version by 1"
        note: "Reached when total drawn is strictly less than requested_quantity_sqm."

      - from: OPEN
        to: FILLED
        trigger: "POST /allocations/{id}/fill"
        actor: Distributor
        preconditions:
          - "same as OPEN -> PARTIALLY_FILLED"
        side_effects:
          - "same as OPEN -> PARTIALLY_FILLED"
        note: "Reached when allocated_quantity_sqm == requested_quantity_sqm after the fill."

      - from: PARTIALLY_FILLED
        to: FILLED
        trigger: "POST /allocations/{id}/fill"
        actor: Distributor
        preconditions:
          - "same as OPEN -> PARTIALLY_FILLED"
        side_effects:
          - "same as OPEN -> PARTIALLY_FILLED"

      - from: FILLED
        to: PARTIALLY_FILLED
        trigger: "system: an ACTIVE AllocationLine of this allocation is VOIDED by a Batch HELD or SCRAPPED cascade"
        actor: system
        preconditions:
          - "allocation.status == FILLED"
        side_effects:
          - "recomputes allocated_quantity_sqm and upgrade_cost_total_cents"
          - "increments Allocation.version by 1"

      - from: PARTIALLY_FILLED
        to: OPEN
        trigger: "system: the last ACTIVE AllocationLine of this allocation is VOIDED by a Batch cascade"
        actor: system
        preconditions:
          - "allocation.status IN {FILLED, PARTIALLY_FILLED}"
        side_effects:
          - "allocated_quantity_sqm becomes 0 and upgrade_cost_total_cents becomes 0"
          - "increments Allocation.version by 1"
        note: "Completes the OPEN -> PARTIALLY_FILLED -> FILLED -> PARTIALLY_FILLED -> OPEN cycle."

      - from: PARTIALLY_FILLED
        to: RELEASED
        trigger: "POST /allocations/{id}/release"
        actor: Distributor
        preconditions:
          - "allocation.status IN {OPEN, PARTIALLY_FILLED, FILLED}"
          - "Distributor ownership: X-User-ID == allocation.distributor_id"
        side_effects:
          - "COMPENSATION: every ACTIVE AllocationLine becomes VOIDED with void_reason = ALLOCATION_RELEASED and its quantity_sqm is added back to Batch.available_quantity_sqm, restoring the stock ledger exactly"
          - "allocated_quantity_sqm and upgrade_cost_total_cents become 0"
          - "increments Allocation.version by 1 and each touched Batch.version by 1"

      - from: FILLED
        to: RELEASED
        trigger: "POST /allocations/{id}/release"
        actor: Distributor
        preconditions:
          - "same as PARTIALLY_FILLED -> RELEASED"
        side_effects:
          - "same as PARTIALLY_FILLED -> RELEASED"

      - from: OPEN
        to: RELEASED
        trigger: "POST /allocations/{id}/release"
        actor: Distributor
        preconditions:
          - "same as PARTIALLY_FILLED -> RELEASED"
        side_effects:
          - "no lines to void; allocated_quantity_sqm stays 0"

      - from: OPEN
        to: CANCELLED
        trigger: "system: ProductSku(allocation.sku_id).commercial_status becomes DISCONTINUED"
        actor: system
        preconditions:
          - "allocation.status IN {OPEN, PARTIALLY_FILLED}"
        side_effects:
          - "every ACTIVE AllocationLine becomes VOIDED with void_reason = ALLOCATION_CANCELLED and its quantity returns to the batch"
          - "increments Allocation.version by 1"

      - from: PARTIALLY_FILLED
        to: CANCELLED
        trigger: "system: ProductSku(allocation.sku_id).commercial_status becomes DISCONTINUED"
        actor: system
        preconditions:
          - "allocation.status IN {OPEN, PARTIALLY_FILLED}"
        side_effects:
          - "same as OPEN -> CANCELLED"
        note: "Conditional cascade: FILLED allocations are deliberately NOT cancelled."

  # ---------------------------------------------------------------------------
  # WarrantyClaim — BRANCHING FORK-JOIN
  # ---------------------------------------------------------------------------
  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: TRIAGE
        trigger: "POST /warranty-claims/{id}/triage"
        actor: WarrantyAdjuster
        preconditions:
          - "claim.status == SUBMITTED"
          - "CROSS-ENTITY (WarrantyClaim <- Batch): Batch(claim.batch_id).status != SCRAPPED"
          - "Batch.traceability_snapshot is present"
        side_effects:
          - "sets assigned_adjuster_user_id = X-User-ID"
          - "FORK: sets required_reviews = ['MATERIALS','FIELD'] when claim_type IN {DELAMINATION, LOCK_FAILURE}, else ['FIELD'] when claim_type IN {WEAR_LAYER_WEARTHROUGH, DIMENSIONAL_MOVEMENT}"
          - "increments WarrantyClaim.version by 1"

      - from: TRIAGE
        to: TRIAGE
        trigger: "POST /warranty-claims/{id}/reviews { review_kind, outcome, note }"
        actor: WarrantyAdjuster
        preconditions:
          - "claim.status == TRIAGE"
          - "review_kind is a member of claim.required_reviews"
          - "the matching outcome field (materials_review_outcome / field_review_outcome) is still null"
        side_effects:
          - "writes the outcome into materials_review_outcome or field_review_outcome"
          - "increments WarrantyClaim.version by 1"
        note: "Branch arm; stays in TRIAGE while any required review arm is unanswered."

      - from: TRIAGE
        to: ADJUDICATION_READY
        trigger: "system: on POST /warranty-claims/{id}/reviews, every review_kind in required_reviews now has a non-null outcome"
        actor: system
        preconditions:
          - "claim.status == TRIAGE"
        side_effects:
          - "increments WarrantyClaim.version by 1"
        note: "JOIN point of the fork."

      - from: ADJUDICATION_READY
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/adjudicate { decision: APPROVE }"
        actor: WarrantyAdjuster
        preconditions:
          - "claim.status == ADJUDICATION_READY"
          - "SoD S4: X-User-ID != claim.assigned_adjuster_user_id"
          - "every required review outcome == DEFECT_CONFIRMED"
          - "elapsed_months < ProductSku.warranty_years * 12 (coverage not exhausted)"
        side_effects:
          - "computes calculations.warranty_settlement_amount -> elapsed_months, settlement_variant, replacement_value_cents, labor_allowance_cents, settlement_amount_cents"
          - "increments WarrantyClaim.version by 1"

      - from: ADJUDICATION_READY
        to: DENIED
        trigger: "POST /warranty-claims/{id}/adjudicate { decision: DENY, denial_reason }"
        actor: WarrantyAdjuster
        preconditions:
          - "claim.status == ADJUDICATION_READY"
          - "SoD S4: X-User-ID != claim.assigned_adjuster_user_id"
        side_effects:
          - "sets denial_reason; settlement_amount_cents stays null"
          - "increments WarrantyClaim.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: formulation-revision-supersede-stale
    parent_entity: Formulation
    write_endpoint: "POST /formulations/{id}/revisions"
    occ_field: "expected_formulation_version"
    description: |
      Creating a DRAFT revision against an APPROVED Formulation whose version
      has advanced since the client last observed it is rejected. The parent
      stays APPROVED after a revision is created (only open_revision_count
      moves), so a later revision request is legitimate under the product
      semantics and cannot be caught by a state precondition; only the stale
      version check distinguishes a client working from an outdated view of the
      recipe it intends to supersede.
    error_id: ERR_STALE_FORMULATION_VERSION
    http_status: 412

  - rule_id: allocation-fill-stale-view
    parent_entity: Allocation
    write_endpoint: "POST /allocations/{id}/fill"
    occ_field: "expected_allocation_version"
    description: |
      Filling an Allocation whose version has advanced since the client last
      observed it is rejected. A partially filled Allocation legitimately
      accepts a further fill, so no state precondition rejects the second
      request; the stale version check is what prevents a client that computed
      its remaining requirement from an outdated allocated_quantity_sqm from
      drawing stock it did not intend to draw.
    error_id: ERR_STALE_ALLOCATION_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules  (§1.3)
# All money is whole cents. All rounding is ROUND_HALF_UP unless stated.
# No calculation ever consults a random value or an entity `id` for a business
# decision; `created_at` is the only tie-break of last resort.
# =============================================================================
calculations:

  # ---------------------------------------------------------------------------
  - name: formulation_blend_metrics
    algorithm_type: weighted_scoring
    output_fields:
      - "Formulation.total_phr"
      - "Formulation.resin_phr"
      - "Formulation.plasticizer_phr"
      - "Formulation.filler_phr"
      - "Formulation.stabilizer_phr"
      - "Formulation.blended_cost_per_kg_cents"
      - "Formulation.performance_score"
      - "Formulation.indentation_resistance_class"
    input_set: "every FormulationComponent whose formulation_id == this Formulation, joined to its RawMaterial"
    constants:
      WEIGHT_INDENTATION: 0.40
      WEIGHT_THERMAL: 0.35
      WEIGHT_MIGRATION_RESISTANCE: 0.25
      SOFTNESS_PENALTY_HIGH: 12          # plasticizer_ratio > 0.35
      SOFTNESS_PENALTY_MID: 5            # plasticizer_ratio > 0.25
      BRITTLENESS_PENALTY_HIGH: 8        # filler_ratio >= 3.00
      BRITTLENESS_PENALTY_MID: 3         # filler_ratio >= 2.00
      CLASS_34_43_MIN_INDENTATION: 88.00
      CLASS_33_42_MIN_INDENTATION: 70.00
    formula: |
      total_phr        = ROUND_HALF_UP(SUM(c.phr), 2)
      resin_phr        = ROUND_HALF_UP(SUM(c.phr WHERE material.category == VINYL_RESIN), 2)
      plasticizer_phr  = ROUND_HALF_UP(SUM(c.phr WHERE material.category == PLASTICIZER), 2)
      filler_phr       = ROUND_HALF_UP(SUM(c.phr WHERE material.category == FILLER), 2)
      stabilizer_phr   = ROUND_HALF_UP(SUM(c.phr WHERE material.category == STABILIZER), 2)

      # cost basis switch: PINNED recipes read the per-component snapshot, never the live material
      cost_of(c) = (Formulation.cost_basis == PINNED)
                     ? c.material_cost_snapshot_cents
                     : material(c).cost_per_kg_cents

      blended_cost_per_kg_cents = ROUND_HALF_UP( SUM(c.phr * cost_of(c)) / total_phr , 0 )

      # three phr-weighted blend indices, each carried at 6 decimals (NO intermediate
      # rounding to 2 dp — that is the precision trap)
      blended_indentation          = ROUND_HALF_UP( SUM(c.phr * material(c).indentation_index)        / total_phr , 6 )
      blended_thermal              = ROUND_HALF_UP( SUM(c.phr * material(c).thermal_stability_index)  / total_phr , 6 )
      blended_migration_resistance = ROUND_HALF_UP( SUM(c.phr * (100 - material(c).plasticizer_migration_index)) / total_phr , 6 )

      # nested ratios drive two independent penalty ladders
      plasticizer_ratio = ROUND_HALF_UP(plasticizer_phr / resin_phr, 4)   # resin_phr is > 0 whenever a VINYL_RESIN component exists
      filler_ratio      = ROUND_HALF_UP(filler_phr      / resin_phr, 4)

      softness_penalty    = (plasticizer_ratio > 0.35) ? 12 : ((plasticizer_ratio > 0.25) ? 5 : 0)
      brittleness_penalty = (filler_ratio     >= 3.00) ? 8  : ((filler_ratio     >= 2.00) ? 3 : 0)

      raw_score = 0.40 * blended_indentation
                + 0.35 * blended_thermal
                + 0.25 * blended_migration_resistance
                - softness_penalty
                - brittleness_penalty

      # SINGLE final rounding, applied after the clamp
      performance_score = ROUND_HALF_UP( MAX(0, MIN(100, raw_score)), 2 )

      # class is derived from blended_indentation ONLY — never from performance_score,
      # so two recipes with the same score can land in different classes
      indentation_resistance_class =
          (blended_indentation >= 88.00) ? CLASS_34_43
        : (blended_indentation >= 70.00) ? CLASS_33_42
        : CLASS_23_31
    precision: "phr fields 2 dp; blend indices 6 dp; performance_score 2 dp; blended_cost_per_kg_cents whole cents"
    recomputed_on:
      - "POST /formulations/{id}/components"
      - "DELETE /formulations/{id}/components/{component_id}"
      - "POST /formulations/{id}/submit"
      - "POST /formulations/{id}/review-decision (APPROVE flips cost_basis to PINNED and re-derives blended_cost_per_kg_cents from the snapshots)"
    edge_cases:
      - "no components: total_phr = 0.00 and all other outputs are null; submit is rejected"
      - "resin_phr == 0: plasticizer_ratio and filler_ratio are null, both penalties are 0, and submit is rejected by ERR_RESIN_PHR_NOT_NORMALIZED"
      - "performance_score exactly 60.00 is approvable (MIN_APPROVAL_SCORE is inclusive)"

  # ---------------------------------------------------------------------------
  - name: sku_required_test_types
    algorithm_type: constraint_propagation
    output_fields: ["TestPanel.required_test_types"]
    input_set: "the single ProductSku referenced by TestPanel.sku_id"
    constants:
      CANONICAL_ORDER: ["RESIDUAL_INDENTATION", "DIMENSIONAL_STABILITY_HEAT", "SLIP_RESISTANCE", "PEEL_ADHESION_DELAMINATION", "LOCK_SHEAR"]
    formula: |
      required = ["RESIDUAL_INDENTATION", "DIMENSIONAL_STABILITY_HEAT"]
      if sku.waterproof_rated == true:                              required += ["SLIP_RESISTANCE"]
      if sku.attached_underlayment_type != NONE:                    required += ["PEEL_ADHESION_DELAMINATION"]
      if sku.construction_type IN {CLICK_LOCK_SPC, CLICK_LOCK_WPC}: required += ["LOCK_SHEAR"]
      required_test_types = required sorted into CANONICAL_ORDER
    precision: "n/a — deterministic ordered array"
    recomputed_on:
      - "POST /test-panels (at creation)"
      - "POST /test-panels/{id}/start (re-derived, so a SKU edit between attempts changes coverage)"
    edge_cases:
      - "a GLUE_DOWN, non-waterproof, NONE-underlayment SKU requires exactly two test types"
      - "a waterproof CLICK_LOCK_WPC SKU with CORK_2MM underlayment requires all five"

  # ---------------------------------------------------------------------------
  - name: test_spec_limit_and_outcome
    algorithm_type: threshold
    output_fields: ["TestResult.unit", "TestResult.spec_limit", "TestResult.outcome"]
    input_set: "the submitted measured_value plus ProductSku(panel.sku_id) and Formulation(sku.formulation_id)"
    constants:
      MARGINAL_BAND_BPS: 500                  # +/- 5% of the limit
      INDENT_LIMIT_MM_CLASS_34_43: 0.10
      INDENT_LIMIT_MM_CLASS_33_42: 0.20
      INDENT_LIMIT_MM_CLASS_23_31: 0.30
      DIM_STAB_LIMIT_PCT_CLICK: 0.15
      DIM_STAB_LIMIT_PCT_OTHER: 0.25
      DCOF_LIMIT_WATERPROOF: 0.42
      DCOF_LIMIT_STANDARD: 0.36
      PEEL_LIMIT_IXPE_1MM: 35.0
      PEEL_LIMIT_EVA_1_5MM: 30.0
      PEEL_LIMIT_CORK_2MM: 45.0
    formula: |
      # per-test unit, direction and conditional limit
      RESIDUAL_INDENTATION        -> unit "mm",         LOWER_IS_BETTER,
          spec_limit = 0.10 if formulation.indentation_resistance_class == CLASS_34_43
                     : 0.20 if CLASS_33_42
                     : 0.30
      DIMENSIONAL_STABILITY_HEAT  -> unit "PCT",        LOWER_IS_BETTER,
          spec_limit = 0.15 if sku.construction_type IN {CLICK_LOCK_SPC, CLICK_LOCK_WPC} else 0.25
      SLIP_RESISTANCE             -> unit "DCOF",       HIGHER_IS_BETTER,
          spec_limit = 0.42 if sku.waterproof_rated else 0.36
      PEEL_ADHESION_DELAMINATION  -> unit "N_PER_25MM", HIGHER_IS_BETTER,
          spec_limit = 35.0 if sku.attached_underlayment_type == IXPE_1MM
                     : 30.0 if EVA_1_5MM
                     : 45.0 if CORK_2MM
      LOCK_SHEAR                  -> unit "N_PER_MM",   HIGHER_IS_BETTER,
          spec_limit = sku.target_lock_shear_n_per_mm

      marginal_edge = LOWER_IS_BETTER ? ROUND_HALF_UP(spec_limit * 1.05, 4)
                                      : ROUND_HALF_UP(spec_limit * 0.95, 4)

      outcome (LOWER_IS_BETTER)  = (measured_value <= spec_limit)    ? PASS
                                : (measured_value <= marginal_edge) ? MARGINAL : FAIL
      outcome (HIGHER_IS_BETTER) = (measured_value >= spec_limit)    ? PASS
                                : (measured_value >= marginal_edge) ? MARGINAL : FAIL
    precision: "spec_limit stored at the constant's own precision; marginal_edge 4 dp; measured_value accepted to 4 dp"
    recomputed_on:
      - "POST /test-panels/{id}/results (computed once and then immutable — TestResult has common_fields: false)"
    edge_cases:
      - "measured_value exactly equal to spec_limit is PASS in both directions (inclusive limit)"
      - "measured_value exactly equal to marginal_edge is MARGINAL, one increment beyond is FAIL"
      - "a test_type outside required_test_types is rejected before any limit is computed"

  # ---------------------------------------------------------------------------
  - name: sku_warranty_terms
    algorithm_type: tiered_pricing
    output_fields: ["ProductSku.warranty_years", "ProductSku.light_commercial_warranty_years"]
    input_set: "the single ProductSku row being written"
    constants:
      RESIDENTIAL_TIERS: "{wear >= 20: 25, wear >= 12: 20, wear >= 6: 15, else: 10}"
      COMMERCIAL_TIERS: "{wear >= 20: 15, wear >= 12: 10, wear >= 6: 5, else: 0}"
      WATERPROOF_CLICK_BONUS_YEARS: 5
      RESIDENTIAL_CAP_YEARS: 30
      COMMERCIAL_CAP_YEARS: 20
    formula: |
      residential = (wear_layer_mil >= 20) ? 25 : (wear_layer_mil >= 12) ? 20 : (wear_layer_mil >= 6) ? 15 : 10
      commercial  = (wear_layer_mil >= 20) ? 15 : (wear_layer_mil >= 12) ? 10 : (wear_layer_mil >= 6) ?  5 :  0
      bonus = (waterproof_rated == true AND construction_type IN {CLICK_LOCK_SPC, CLICK_LOCK_WPC}) ? 5 : 0
      warranty_years                   = MIN(residential + bonus, 30)
      light_commercial_warranty_years  = MIN(commercial  + bonus, 20)
    precision: "whole years"
    recomputed_on:
      - "POST /product-skus"
    edge_cases:
      - "wear_layer_mil exactly 20 lands on the top tier (inclusive)"
      - "wear_layer_mil exactly 12 gives residential 20 / commercial 10"
      - "the bonus requires BOTH waterproof_rated and a click-lock construction; a waterproof GLUE_DOWN gets nothing"

  # ---------------------------------------------------------------------------
  - name: sku_standard_cost
    algorithm_type: aggregation
    output_fields:
      - "ProductSku.standard_cost_cents_per_sqm"
      - "ProductSku.list_price_cents_per_sqm"
      - "GET /product-skus/{id}/cost-summary.data.component_breakdown"
    input_set: "the ProductSku, its Formulation, its PrintFilm and that film's DesignLicense"
    variants:
      - variant: LIVE_BASIS
        applies_when: "GET /product-skus/{id}/cost-summary — an indicative replacement-cost quote, readable at any certification state"
        description: |
          The core-compound component is re-blended from the CURRENT
          RawMaterial.cost_per_kg_cents of every FormulationComponent of the SKU's
          recipe, ignoring material_cost_snapshot_cents entirely:
            live_blended = ROUND_HALF_UP(SUM(c.phr * material(c).cost_per_kg_cents) / total_phr, 0)
          A purchase-cost revaluation via POST /raw-materials/{id}/cost therefore moves
          this variant immediately, even for an APPROVED recipe.
      - variant: PINNED_BASIS
        applies_when: "POST /product-skus/{id}/certify — the value stamped into standard_cost_cents_per_sqm, and the basis for allocation upgrade deltas"
        description: |
          The core-compound component is priced from the FormulationComponent
          material_cost_snapshot_cents captured when the recipe was APPROVED — i.e.
          exactly Formulation.blended_cost_per_kg_cents of a PINNED recipe, which is what
          the SKU's pinned_formulation_version refers to. A material revaluation leaves
          this variant bit-identical, so the two variants diverge by the revaluation.
    constants:
      SPECIFIC_GRAVITY_KG_PER_SQM_PER_MM: 1.90
      WEAR_LAYER_CENTS_PER_MIL_PER_SQM: 3.5
      PRINT_FILM_BASE_CENTS_PER_SQM: 18
      REPEAT_SURCHARGE_LARGE_CENTS: 6          # max repeat >= 1800 mm
      REPEAT_SURCHARGE_MEDIUM_CENTS: 2         # max repeat >= 1200 mm
      UNDERLAYMENT_CENTS: "{NONE: 0, IXPE_1MM: 22, EVA_1_5MM: 17, CORK_2MM: 41}"
      WATERPROOF_SEAL_CENTS_PER_SQM: 9
      CONVERSION_BASE_CENTS_PER_SQM: 35
      CLICK_LOCK_MILLING_CENTS_PER_SQM: 12
    formula: |
      # ---- EVALUATION ORDER IS PART OF THE CONTRACT -------------------------
      # (1) the six physical cost components, EACH rounded to whole cents on its own
      # (2) the royalty component, computed from ProductSku.royalty_basis_price_cents_per_sqm
      #     (an INPUT field) — never from list_price_cents_per_sqm, which is what breaks
      #     the cost -> price -> royalty -> cost circularity
      # (3) standard_cost_cents_per_sqm = the sum of those seven already-rounded integers
      # (4) list_price_cents_per_sqm    = standard cost grossed up by target_margin_bps
      # Summing unrounded components and rounding once at the end is NOT the contract.

      core_cost   = ROUND_HALF_UP( blended_cost_per_kg_cents
                                   * 1.90 * sku.overall_thickness_mm , 0 )
      wear_cost   = ROUND_HALF_UP( sku.wear_layer_mil * 3.5 , 0 )
      max_repeat  = MAX(film.pattern_repeat_mm_length, film.pattern_repeat_mm_width)
      film_cost   = 18 + ((max_repeat >= 1800) ? 6 : ((max_repeat >= 1200) ? 2 : 0))
      under_cost  = UNDERLAYMENT_CENTS[sku.attached_underlayment_type]
      water_cost  = sku.waterproof_rated ? 9 : 0
      conv_cost   = 35 + (sku.construction_type IN {CLICK_LOCK_SPC, CLICK_LOCK_WPC} ? 12 : 0)

      royalty_cost = ROUND_HALF_UP( sku.royalty_basis_price_cents_per_sqm
                                    * license.royalty_rate_bps / 10000 , 0 )

      standard_cost_cents_per_sqm = core_cost + wear_cost + film_cost
                                  + under_cost + water_cost + conv_cost + royalty_cost

      list_price_cents_per_sqm = ROUND_HALF_UP(
          standard_cost_cents_per_sqm * (10000 + sku.target_margin_bps) / 10000 , 0 )
    precision: "every component and both outputs are whole cents; ROUND_HALF_UP per component, then an exact integer sum"
    recomputed_on:
      - "POST /product-skus/{id}/certify (PINNED_BASIS, stamped)"
      - "GET /product-skus/{id}/cost-summary (both variants returned side by side with their delta)"
    edge_cases:
      - "target_margin_bps == 0 makes list_price equal standard_cost"
      - "a license with royalty_rate_bps == 0 contributes a royalty component of 0"
      - "max_repeat exactly 1800 takes the large surcharge; exactly 1200 takes the medium one"

  # ---------------------------------------------------------------------------
  - name: press_line_changeover_gap
    algorithm_type: interval_merge
    output_fields: ["ProductionRun.changeover_minutes_applied", "the required_gap_minutes used by validation V-TEMP-2"]
    input_set: |
      the ProductionRun being scheduled or set up, plus the immediately preceding run on the
      same press_line_id: the row with the greatest planned_end_utc that is <= this run's
      planned_start_utc and whose run_status != ABORTED (ties broken by created_at ASC)
    constants:
      MULTIPLIER_SAME_FORMULATION: 0.50
      MULTIPLIER_SAME_FILM: 0.75
      MULTIPLIER_UNRELATED: 1.00
      THICKNESS_SURCHARGE_LARGE_MIN: 30        # abs thickness delta >= 2.0 mm
      THICKNESS_SURCHARGE_SMALL_MIN: 10        # abs thickness delta >= 0.5 mm
    formula: |
      if no preceding run exists: required_gap_minutes = 0

      multiplier = (prev.sku.formulation_id == this.sku.formulation_id) ? 0.50
                 : (prev.sku.print_film_id  == this.sku.print_film_id)  ? 0.75
                 : 1.00
      # NOTE the ladder is ordered: a pair sharing BOTH keys takes 0.50, not 0.75.

      delta_thk  = ABS(this.sku.overall_thickness_mm - prev.sku.overall_thickness_mm)
      surcharge  = (delta_thk >= 2.0) ? 30 : ((delta_thk >= 0.5) ? 10 : 0)

      required_gap_minutes = CEIL(press_line.changeover_minutes * multiplier) + surcharge
    precision: "whole minutes; CEIL is applied to the multiplied base BEFORE the surcharge is added"
    recomputed_on:
      - "POST /production-runs (as the V-TEMP-2 gap check)"
      - "POST /production-runs/{id}/setup (persisted into changeover_minutes_applied)"
    edge_cases:
      - "a gap exactly equal to required_gap_minutes is accepted (the check is >=)"
      - "changeover_minutes == 0 with unrelated SKUs and a 2.5 mm thickness step still requires 30 minutes"
      - "an ABORTED predecessor is skipped entirely, so the gap is measured against the run before it"

  # ---------------------------------------------------------------------------
  - name: license_volume_ledger
    algorithm_type: forward_looking
    output_fields: ["DesignLicense.reserved_volume_sqm", "DesignLicense.consumed_volume_sqm"]
    input_set: "every ProductionRun whose SKU's PrintFilm points at this DesignLicense"
    variants:
      - variant: RESERVED_VOLUME_BASIS
        applies_when: "the term-cap admission check on POST /production-runs"
        description: |
          Forward-looking: the projection counts already-consumed volume PLUS volume
          merely reserved by PLANNED / SETUP / RUNNING runs PLUS the planned quantity of
          the run being admitted. This is what makes an admission fail even though nothing
          has physically been produced yet.
      - variant: ACTUAL_VOLUME_BASIS
        applies_when: "the ledger settlement on POST /production-runs/{id}/complete"
        description: |
          Backward-looking: the reservation is released at its planned size and the
          measured actual_quantity_sqm is consumed. When actual != planned the two
          variants diverge, and the cap is deliberately NOT re-checked at completion,
          so consumed_volume_sqm may exceed what the admission projection assumed.
    constants: {}
    formula: |
      # admission (RESERVED_VOLUME_BASIS)
      projected_volume_sqm = license.consumed_volume_sqm
                           + license.reserved_volume_sqm
                           + run.planned_quantity_sqm
      admit iff projected_volume_sqm <= license.term_volume_cap_sqm      # equality admits

      # on create
      reserved_volume_sqm += run.planned_quantity_sqm

      # on abort (exact compensation)
      reserved_volume_sqm -= run.planned_quantity_sqm

      # on complete (ACTUAL_VOLUME_BASIS)
      reserved_volume_sqm -= run.planned_quantity_sqm
      consumed_volume_sqm += run.actual_quantity_sqm

      # on qc_disposition SCRAPPED (exact compensation of the completion)
      consumed_volume_sqm -= run.actual_quantity_sqm
    precision: "2 dp square metres; both fields are non-negative at all times"
    recomputed_on:
      - "POST /production-runs"
      - "POST /production-runs/{id}/abort"
      - "POST /production-runs/{id}/complete"
      - "POST /production-runs/{id}/qc-disposition (SCRAPPED)"
      - "GET /design-licenses/{id}/utilization"
    edge_cases:
      - "projected_volume_sqm exactly equal to term_volume_cap_sqm is admitted"
      - "create-then-abort leaves reserved_volume_sqm bit-identical to its pre-create value"
      - "an amendment carries reserved / consumed / accrued across to the successor license unchanged"

  # ---------------------------------------------------------------------------
  - name: license_royalty_accrual
    algorithm_type: aggregation
    output_fields: ["ProductionRun.royalty_accrued_cents", "DesignLicense.accrued_royalty_cents"]
    input_set: "each COMPLETED ProductionRun drawing on the license whose qc_disposition != SCRAPPED"
    constants:
      ROUNDING_ORDER: ROUND_PER_RUN_THEN_SUM
    formula: |
      # ---- ROUNDING ORDER IS PART OF THE CONTRACT ---------------------------
      # Each run's royalty is rounded to whole cents on its own and only then added to
      # the license ledger (ROUND_PER_RUN_THEN_SUM). Accumulating the unrounded products
      # first and rounding the total once (SUM_THEN_ROUND) is NOT the contract and can
      # differ by one cent per run that lands on a half cent.

      run_royalty_cents = ROUND_HALF_UP(
          run.actual_quantity_sqm
          * sku.royalty_basis_price_cents_per_sqm
          * license.royalty_rate_bps / 10000 , 0 )

      ProductionRun.royalty_accrued_cents = run_royalty_cents
      DesignLicense.accrued_royalty_cents += run_royalty_cents

      # reversal on scrap is the stored integer, not a recomputation
      on SCRAPPED: DesignLicense.accrued_royalty_cents -= run.royalty_accrued_cents
                   ProductionRun.royalty_accrued_cents  = 0
    precision: "whole cents, ROUND_HALF_UP, applied once per run"
    recomputed_on:
      - "POST /production-runs/{id}/complete"
      - "POST /production-runs/{id}/qc-disposition (SCRAPPED reverses the stored integer exactly)"
      - "GET /design-licenses/{id}/utilization"
    edge_cases:
      - "actual_quantity_sqm == 0 accrues 0 and creates no Batch"
      - "10.10 sqm at 2100 cents/sqm and 500 bps is 1060.50 -> 1061 per run; two such runs total 2122, whereas summing first would give 2121"
      - "an aborted run never accrues, so the ledger is untouched"

  # ---------------------------------------------------------------------------
  - name: run_quality_metrics
    algorithm_type: threshold
    output_fields:
      - "ProductionRun.pattern_waste_sqm"
      - "ProductionRun.registration_within_tolerance"
      - "ProductionRun.emboss_within_tolerance"
      - "ProductionRun.curl_within_tolerance"
      - "ProductionRun.tongue_within_tolerance"
      - "ProductionRun.auto_disposition_recommendation"
    input_set: "the completing ProductionRun plus its ProductSku, PrintFilm and PressLine"
    constants:
      PATTERN_WASTE_DIVISOR_MM: 60000
      PATTERN_WASTE_FACTOR: 0.35
      EMBOSS_ALIGNMENT_TOLERANCE_MM: 0.30
      CURL_BASE_ALLOWANCE_MM: 2.00
    formula: |
      max_repeat = MAX(film.pattern_repeat_mm_length, film.pattern_repeat_mm_width)
      pattern_waste_sqm = ROUND_HALF_UP(
          run.actual_quantity_sqm * max_repeat / 60000 * 0.35 , 2 )

      registration_within_tolerance = ABS(run.registration_drift_mm) <= film.registration_tolerance_mm

      emboss_within_tolerance = ABS(run.emboss_alignment_offset_mm
                                    - film.emboss_alignment_offset_mm) <= 0.30

      curl_allowance_mm    = ROUND_HALF_UP(2.00 * (100 - press_line.curl_control_index) / 100 , 2)
      curl_within_tolerance = ABS(run.curl_deviation_mm) <= curl_allowance_mm

      tongue_within_tolerance =
          (sku.profile_family == NONE)
            ? true
            : ( (sku.tongue_thickness_target_mm - sku.tolerance_minus_mm) <= run.measured_tongue_thickness_mm
                AND run.measured_tongue_thickness_mm <= (sku.tongue_thickness_target_mm + sku.tolerance_plus_mm) )

      auto_disposition_recommendation =
          (registration_within_tolerance AND emboss_within_tolerance
           AND curl_within_tolerance AND tongue_within_tolerance) ? RELEASED : QUARANTINED
    precision: "pattern_waste_sqm 2 dp; curl_allowance_mm 2 dp; all gates are inclusive comparisons"
    recomputed_on:
      - "POST /production-runs/{id}/complete"
    edge_cases:
      - "a measurement exactly on its tolerance passes the gate (all four comparisons are <= / inclusive)"
      - "auto_disposition_recommendation is only advisory: the QaTechnician may still QUARANTINE a run whose gates all hold, but may NOT RELEASE one whose gates do not"
      - "profile_family NONE forces tongue_within_tolerance true and ignores measured_tongue_thickness_mm entirely"

  # ---------------------------------------------------------------------------
  - name: allocation_fill_plan
    algorithm_type: waterfall_allocation
    output_fields:
      - "AllocationLine.batch_id"
      - "AllocationLine.quantity_sqm"
      - "AllocationLine.substitution_kind"
      - "AllocationLine.upgrade_cost_delta_cents"
      - "Allocation.allocated_quantity_sqm"
      - "Allocation.upgrade_cost_total_cents"
      - "Allocation.status"
    input_set: |
      every Batch B with B.status == IN_STOCK, B.available_quantity_sqm > 0 and
      ProductionRun(B.production_run_id).qc_disposition == RELEASED, whose ProductSku S
      satisfies the allocation's substitution_policy and has S.commercial_status != DISCONTINUED
    constants:
      SUBSTITUTION_RANK: "{EXACT: 0, UNDERLAYMENT_UPGRADE: 1, WEAR_LAYER_UPGRADE: 2}"
    formula: |
      # ---- STEP ORDER IS PART OF THE CONTRACT -------------------------------
      # (1) eligibility  (2) ranking  (3) waterfall quantities  (4) per-line cost delta
      # The ranking in step 2 MUST NOT consult upgrade_cost_delta_cents; the deltas do
      # not even exist until step 4. Ranking by cheapest-upgrade-first is NOT the
      # contract and produces a different line set.

      # --- (1) eligibility, per substitution_policy ---
      requested = ProductSku(allocation.sku_id)
      EXACT                : B.sku_id == allocation.sku_id
      UNDERLAYMENT_UPGRADE : policy == ALLOW_UNDERLAYMENT_UPGRADE
                             AND requested.attached_underlayment_type == NONE
                             AND S.attached_underlayment_type != NONE
                             AND S.formulation_id     == requested.formulation_id
                             AND S.print_film_id      == requested.print_film_id
                             AND S.construction_type  == requested.construction_type
                             AND S.wear_layer_mil     == requested.wear_layer_mil
      WEAR_LAYER_UPGRADE   : policy == ALLOW_WEAR_LAYER_UPGRADE
                             AND S.wear_layer_mil     >  requested.wear_layer_mil
                             AND S.formulation_id     == requested.formulation_id
                             AND S.print_film_id      == requested.print_film_id
                             AND S.construction_type  == requested.construction_type
                             AND S.attached_underlayment_type == requested.attached_underlayment_type
                             AND S.waterproof_rated   == requested.waterproof_rated
      # STRICT_SKU admits EXACT only. Each policy admits EXACT plus its own one kind.

      # --- (2) deterministic ranking (no random values, no id comparisons) ---
      ORDER BY SUBSTITUTION_RANK[substitution_kind] ASC,
               Batch.created_at ASC,
               Batch.batch_code ASC

      # --- (3) waterfall ---
      remaining = ROUND_HALF_UP(allocation.requested_quantity_sqm
                                - allocation.allocated_quantity_sqm, 2)
      for each candidate in rank order while remaining > 0:
          draw = MIN(remaining, B.available_quantity_sqm)
          emit AllocationLine(batch_id = B.id, quantity_sqm = draw, substitution_kind = k)
          B.available_quantity_sqm -= draw
          remaining -= draw

      # --- (4) per-line cost delta, rounded per line then summed ---
      per_sqm_delta = (S.standard_cost_cents_per_sqm IS NULL
                       OR requested.standard_cost_cents_per_sqm IS NULL)
                        ? 0
                        : MAX(0, S.standard_cost_cents_per_sqm
                                 - requested.standard_cost_cents_per_sqm)
      upgrade_cost_delta_cents = (substitution_kind == EXACT)
                                   ? 0
                                   : ROUND_HALF_UP(line.quantity_sqm * per_sqm_delta, 0)

      allocated_quantity_sqm    = ROUND_HALF_UP(SUM(ACTIVE line.quantity_sqm), 2)
      upgrade_cost_total_cents  = SUM(ACTIVE line.upgrade_cost_delta_cents)   # sum of rounded integers
      status = (allocated_quantity_sqm >= allocation.requested_quantity_sqm) ? FILLED
             : (allocated_quantity_sqm > 0)                                  ? PARTIALLY_FILLED
             : OPEN
    precision: "quantities 2 dp; per-line deltas rounded to whole cents individually, then summed exactly"
    recomputed_on:
      - "POST /allocations/{id}/fill"
      - "POST /allocations/{id}/release"
      - "every AllocationLine void cascade from Batch HELD / SCRAPPED or Allocation CANCELLED"
    edge_cases:
      - "an empty candidate set is rejected with ERR_NO_ELIGIBLE_BATCH and leaves the allocation untouched"
      - "the first candidate is drained completely before the second is touched, even when the second alone would cover the whole request"
      - "an EXACT batch always outranks any upgrade batch, however much older the upgrade batch is"
      - "an upgrade whose standard cost is below the requested SKU's contributes 0, never a credit"

  # ---------------------------------------------------------------------------
  - name: warranty_settlement_amount
    algorithm_type: decay_function
    output_fields:
      - "WarrantyClaim.elapsed_months"
      - "WarrantyClaim.settlement_variant"
      - "WarrantyClaim.replacement_value_cents"
      - "WarrantyClaim.labor_allowance_cents"
      - "WarrantyClaim.settlement_amount_cents"
    input_set: "the claim, its Batch, that Batch's ProductSku and the SKU's warranty terms"
    variants:
      - variant: PRORATED_STRAIGHT_LINE
        applies_when: "claim_type IN {WEAR_LAYER_WEARTHROUGH, DIMENSIONAL_MOVEMENT}"
        description: |
          The remaining share of the warranty term decays one month at a time:
          replacement value is multiplied by remaining_months / coverage_months.
      - variant: STEPPED_SCHEDULE
        applies_when: "claim_type IN {DELAMINATION, LOCK_FAILURE}"
        description: |
          The remaining share decays in whole-year steps: 100% through year 1, then
          80%, 60%, 40% and finally 20%, so identical inputs settle differently from
          the straight-line variant everywhere except inside the first step.
    constants:
      LABOR_ALLOWANCE_CENTS_PER_SQM: 350
      MANUFACTURING_DEFECT_TOLERANCE_MIL: 0.5
      STEP_SCHEDULE: "{elapsed_years <= 1: 100, <= 3: 80, <= 7: 60, <= 12: 40, else: 20}"
    formula: |
      elapsed_months = whole calendar months from installed_on to reported_on, floored
                       (a partial month does not count)
      coverage_months  = sku.warranty_years * 12
      remaining_months = MAX(0, coverage_months - elapsed_months)

      replacement_value_cents = ROUND_HALF_UP(
          claim.claimed_area_sqm * sku.royalty_basis_price_cents_per_sqm , 0 )

      labor_allowance_cents = claim.installed_by_certified_installer
          ? ROUND_HALF_UP(claim.claimed_area_sqm * 350 , 0 )
          : 0

      # --- manufacturing-defect override, evaluated BEFORE the variant decay ---
      defect_confirmed = batch.wear_layer_measured_mil
                         < (sku.wear_layer_mil - 0.5)
      if defect_confirmed:
          covered_value = replacement_value_cents          # 100%, no decay at all
      else if settlement_variant == PRORATED_STRAIGHT_LINE:
          covered_value = ROUND_HALF_UP(replacement_value_cents
                                        * remaining_months / coverage_months , 0 )
      else:  # STEPPED_SCHEDULE
          elapsed_years = FLOOR(elapsed_months / 12)
          step_pct = (elapsed_years <= 1) ? 100 : (elapsed_years <= 3) ? 80
                   : (elapsed_years <= 7) ? 60  : (elapsed_years <= 12) ? 40 : 20
          covered_value = ROUND_HALF_UP(replacement_value_cents * step_pct / 100 , 0 )

      settlement_amount_cents = covered_value + labor_allowance_cents
    precision: "whole cents; the decay factor is applied to the already-rounded replacement value, then the labour allowance is added as a separate rounded integer"
    recomputed_on:
      - "POST /warranty-claims/{id}/adjudicate (APPROVE only; a DENY leaves settlement_amount_cents null)"
    edge_cases:
      - "elapsed_months == coverage_months leaves remaining_months at 0 and the claim is rejected by ERR_WARRANTY_EXPIRED before any settlement is computed"
      - "a confirmed under-thickness batch settles at 100% under either variant, so the variant becomes unobservable in the amount but is still recorded in settlement_variant"
      - "wear_layer_measured_mil exactly equal to sku.wear_layer_mil - 0.5 is NOT a defect (the comparison is strict)"

# =============================================================================
# Table 4: Validation Rules — strictly ordered  (§1.4)
# The server evaluates rules in ascending `priority`. The FIRST violated rule
# wins and short-circuits; no later rule is evaluated. Two rules at the same
# priority can never both be violated by one request.
# =============================================================================
validation_priority_bands:
  1:  authentication
  2:  authorization
  3:  request_shape
  4:  path_resource_existence
  5:  body_reference_existence
  6:  resource_ownership
  7:  own_entity_state
  8:  optimistic_concurrency
  9:  segregation_of_duties
  10: cross_entity_state
  11: business_safety
  12: business_constraint
  13: business_temporal
  14: business_referential
  15: business_fiscal

validations:

  # --- P1 authentication -----------------------------------------------------
  - priority: 1
    rule_id: V-AUTH-1
    category: authentication
    applies_to: "ALL endpoints"
    condition: "X-User-ID header is absent or empty, or X-Role header is absent or empty, or X-Role is not one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401

  # --- P2 authorization ------------------------------------------------------
  - priority: 2
    rule_id: V-RBAC-1
    category: authorization
    applies_to: "ALL endpoints"
    condition: "X-Role is not listed in the endpoint's allowed_roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403

  - priority: 2
    rule_id: V-RBAC-2
    category: authorization
    applies_to: "POST /design-licenses/{id}/status"
    condition: "to_status == TERMINATED while X-Role != TechnicalDirector, or to_status IN {ACTIVE, SUSPENDED} while X-Role != PlantAdmin"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    note: "payload-dependent role split on a shared endpoint"

  # --- P3 request shape ------------------------------------------------------
  - priority: 3
    rule_id: V-REQ-1
    category: request_shape
    applies_to: "ALL endpoints"
    condition: "a required body field is missing, a field has the wrong JSON type, an enum value is outside its declared set, a numeric field breaks its declared range or decimal-place constraint, or limit/offset fall outside {1..100} / {>=0}"
    error_id: ERR_INVALID_REQUEST
    http_status: 400

  - priority: 3
    rule_id: V-REQ-2
    category: request_shape
    applies_to: "POST /product-skus"
    condition: "profile_family != NONE while any of tongue_thickness_target_mm, tolerance_plus_mm, tolerance_minus_mm, target_lock_shear_n_per_mm is null; OR profile_family == NONE while any of them is non-null; OR construction_type IN {CLICK_LOCK_SPC, CLICK_LOCK_WPC} while profile_family == NONE"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    note: "conditional-required-field validation driven by the SKU's own configuration"

  - priority: 3
    rule_id: V-REQ-3
    category: request_shape
    applies_to: "POST /production-runs, POST /design-licenses, POST /design-licenses/{id}/amendments, POST /press-lines"
    condition: "planned_end_utc <= planned_start_utc, or valid_until <= valid_from, or max_thickness_mm <= min_thickness_mm"
    error_id: ERR_INVALID_REQUEST
    http_status: 400

  - priority: 3
    rule_id: V-REQ-4
    category: request_shape
    applies_to: "POST /warranty-claims"
    condition: "reported_on < installed_on"
    error_id: ERR_CLAIM_DATES_INVALID
    http_status: 400

  # --- P4 path resource existence -------------------------------------------
  - priority: 4
    rule_id: V-EXIST-1
    category: path_resource_existence
    applies_to: "every endpoint carrying a path parameter"
    condition: "the {id} (or {component_id}) in the path matches no row of the addressed collection"
    error_id: "the matching ERR_<ENTITY>_NOT_FOUND"
    http_status: 404

  # --- P5 body reference existence ------------------------------------------
  - priority: 5
    rule_id: V-EXIST-2
    category: body_reference_existence
    applies_to: "every endpoint whose body carries a foreign key"
    condition: "a foreign key in the body matches no row of the referenced collection (formulation_id, raw_material_id, license_id, print_film_id, sku_id, press_line_id, distributor_id, batch_id, supersedes_formulation_id, supersedes_license_id)"
    error_id: "the matching ERR_<ENTITY>_NOT_FOUND"
    http_status: 404

  # --- P6 resource ownership -------------------------------------------------
  - priority: 6
    rule_id: V-OWN-1
    category: resource_ownership
    applies_to: "POST /allocations/{id}/fill, POST /allocations/{id}/release, GET /allocations/{id}, GET /allocations/{id}/lines, GET /warranty-claims/{id}"
    condition: "X-Role == Distributor and the addressed row's distributor_id != X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403

  - priority: 6
    rule_id: V-OWN-2
    category: resource_ownership
    applies_to: "POST /allocations, POST /warranty-claims"
    condition: "X-Role == Distributor and the body's distributor_id != X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403

  # --- P7 own-entity state ---------------------------------------------------
  - priority: 7
    rule_id: V-STATE-1
    category: own_entity_state
    applies_to: "POST /formulations/{id}/components, DELETE /formulations/{id}/components/{component_id}, POST /formulations/{id}/submit, POST /formulations/{id}/review-decision, POST /formulations/{id}/revisions"
    condition: "the Formulation's status is not in the transition's declared from-set"
    error_id: ERR_INVALID_FORMULATION_STATE
    http_status: 409

  - priority: 7
    rule_id: V-STATE-2
    category: own_entity_state
    applies_to: "POST /design-licenses/{id}/status, POST /design-licenses/{id}/amendments"
    condition: "the DesignLicense's status is not in the transition's declared from-set (an amendment requires ACTIVE; a TERMINATED, SUPERSEDED or EXPIRED grant accepts nothing)"
    error_id: ERR_INVALID_LICENSE_STATE
    http_status: 409

  - priority: 7
    rule_id: V-STATE-3
    category: own_entity_state
    applies_to: "POST /product-skus/{id}/begin-testing, POST /product-skus/{id}/certify"
    condition: "the SKU's certification_status is not in the transition's declared from-set"
    error_id: ERR_INVALID_SKU_CERTIFICATION_STATE
    http_status: 409

  - priority: 7
    rule_id: V-STATE-4
    category: own_entity_state
    applies_to: "POST /product-skus/{id}/commercial-status"
    condition: "the SKU's commercial_status is not in the requested transition's from-set (DISCONTINUED is terminal on this dimension)"
    error_id: ERR_INVALID_COMMERCIAL_STATE
    http_status: 409

  - priority: 7
    rule_id: V-STATE-5
    category: own_entity_state
    applies_to: "POST /test-panels/{id}/start, POST /test-panels/{id}/results, POST /test-panels/{id}/void"
    condition: "the TestPanel's status is not in the transition's declared from-set (PASSED, FAILED and VOIDED accept nothing)"
    error_id: ERR_INVALID_PANEL_STATE
    http_status: 409

  - priority: 7
    rule_id: V-STATE-6
    category: own_entity_state
    applies_to: "POST /production-runs/{id}/setup, /start, /complete, /abort"
    condition: "the ProductionRun's run_status is not in the transition's declared from-set"
    error_id: ERR_INVALID_RUN_STATE
    http_status: 409

  - priority: 7
    rule_id: V-STATE-7
    category: own_entity_state
    applies_to: "POST /production-runs/{id}/qc-disposition"
    condition: "run_status != COMPLETED, or the current qc_disposition is not in the requested transition's from-set (SCRAPPED is terminal)"
    error_id: ERR_INVALID_QC_TRANSITION
    http_status: 409

  - priority: 7
    rule_id: V-STATE-8
    category: own_entity_state
    applies_to: "POST /batches/{id}/hold-status"
    condition: "the Batch's status is not in the requested action's from-set (HOLD needs IN_STOCK, RELEASE_HOLD needs HELD, SCRAP needs a non-SCRAPPED batch)"
    error_id: ERR_INVALID_BATCH_STATE
    http_status: 409

  - priority: 7
    rule_id: V-STATE-9
    category: own_entity_state
    applies_to: "POST /allocations/{id}/fill, POST /allocations/{id}/release"
    condition: "for fill: allocation.status IN {RELEASED, CANCELLED}; for release: allocation.status IN {RELEASED, CANCELLED}. A FILLED allocation is deliberately NOT rejected here — it is a legitimate fill target as far as the lifecycle goes and is refused later, by V-CON-9 at priority 12, for having nothing left to draw"
    error_id: ERR_INVALID_ALLOCATION_STATE
    http_status: 409
    priority_conflict_note: "CONFLICT A — wins over V-REF-7 (ERR_NO_ELIGIBLE_BATCH, priority 14) when a RELEASED allocation is filled against an empty candidate pool"

  - priority: 7
    rule_id: V-STATE-10
    category: own_entity_state
    applies_to: "POST /warranty-claims/{id}/triage, /reviews, /adjudicate"
    condition: "the WarrantyClaim's status is not in the transition's declared from-set"
    error_id: ERR_INVALID_CLAIM_STATE
    http_status: 409

  - priority: 7
    rule_id: V-STATE-11
    category: own_entity_state
    applies_to: "POST /raw-materials/{id}/cost"
    condition: "RawMaterial.status == RESTRICTED — a restricted material can no longer be revalued"
    error_id: ERR_RAW_MATERIAL_NOT_ACTIVE
    http_status: 409

  - priority: 7
    rule_id: V-STATE-12
    category: own_entity_state
    applies_to: "POST /print-films/{id}/status"
    condition: "the PrintFilm's status is not in the requested transition's declared from-set (WITHDRAWN is terminal; AVAILABLE -> AVAILABLE and RESTRICTED -> RESTRICTED are not declared), or to_status == AVAILABLE while DesignLicense(film.license_id).status != ACTIVE"
    error_id: ERR_INVALID_PRINT_FILM_STATE
    http_status: 409

  # --- P8 optimistic concurrency --------------------------------------------
  - priority: 8
    rule_id: V-OCC-1
    category: optimistic_concurrency
    applies_to: "POST /formulations/{id}/revisions"
    condition: "expected_formulation_version != Formulation.version"
    error_id: ERR_STALE_FORMULATION_VERSION
    http_status: 412

  - priority: 8
    rule_id: V-OCC-2
    category: optimistic_concurrency
    applies_to: "POST /allocations/{id}/fill"
    condition: "expected_allocation_version != Allocation.version"
    error_id: ERR_STALE_ALLOCATION_VERSION
    http_status: 412

  # --- P9 segregation of duties ---------------------------------------------
  - priority: 9
    rule_id: V-SOD-1
    category: segregation_of_duties
    applies_to: "POST /formulations/{id}/review-decision"
    condition: "X-User-ID == Formulation.authored_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    priority_conflict_note: "CONFLICT D — wins over V-REF-2 (ERR_RAW_MATERIAL_NOT_ACTIVE, priority 14) when the recipe's author reviews a recipe containing a RESTRICTED material"

  - priority: 9
    rule_id: V-SOD-2
    category: segregation_of_duties
    applies_to: "POST /product-skus/{id}/certify"
    condition: "X-User-ID equals the recorded_by_user_id of any TestResult that is being counted toward this SKU's required-type coverage"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403

  - priority: 9
    rule_id: V-SOD-3
    category: segregation_of_duties
    applies_to: "POST /batches/{id}/hold-status { action: RELEASE_HOLD }"
    condition: "X-User-ID == Batch.held_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403

  - priority: 9
    rule_id: V-SOD-4
    category: segregation_of_duties
    applies_to: "POST /warranty-claims/{id}/adjudicate"
    condition: "X-User-ID == WarrantyClaim.assigned_adjuster_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403

  # --- P10 cross-entity state -----------------------------------------------
  - priority: 10
    rule_id: V-XSTATE-1
    category: cross_entity_state
    applies_to: "POST /test-panels, POST /test-panels/{id}/start"
    condition: "ProductSku(sku_id).certification_status NOT IN {TESTING, PROVISIONAL}"
    error_id: ERR_INVALID_SKU_CERTIFICATION_STATE
    http_status: 409

  - priority: 10
    rule_id: V-XSTATE-2
    category: cross_entity_state
    applies_to: "POST /production-runs, POST /production-runs/{id}/setup"
    condition: "for creation: ProductSku.certification_status NOT IN {TESTING, PROVISIONAL, CERTIFIED} or commercial_status == DISCONTINUED; for setup: certification_status NOT IN {PROVISIONAL, CERTIFIED} or commercial_status NOT IN {DEVELOPMENT, RELEASED}"
    error_id: ERR_SKU_NOT_PRODUCIBLE
    http_status: 409

  - priority: 10
    rule_id: V-XSTATE-3
    category: cross_entity_state
    applies_to: "POST /production-runs, POST /production-runs/{id}/setup, POST /production-runs/{id}/start"
    condition: "PressLine(press_line_id).status != AVAILABLE"
    error_id: ERR_PRESS_LINE_UNAVAILABLE
    http_status: 409

  - priority: 10
    rule_id: V-XSTATE-4
    category: cross_entity_state
    applies_to: "POST /batches/{id}/hold-status { action: RELEASE_HOLD }"
    condition: "ProductionRun(batch.production_run_id).qc_disposition != RELEASED"
    error_id: ERR_RUN_NOT_RELEASED
    http_status: 409

  - priority: 10
    rule_id: V-XSTATE-5
    category: cross_entity_state
    applies_to: "POST /warranty-claims/{id}/triage"
    condition: "Batch(batch_id).status == SCRAPPED"
    error_id: ERR_INVALID_BATCH_STATE
    http_status: 409

  - priority: 10
    rule_id: V-XSTATE-6
    category: cross_entity_state
    applies_to: "POST /allocations/{id}/fill"
    condition: "ProductSku(allocation.sku_id).commercial_status != RELEASED"
    error_id: ERR_SKU_NOT_PRODUCIBLE
    http_status: 409

  - priority: 10
    rule_id: V-XSTATE-7
    category: cross_entity_state
    applies_to: "POST /product-skus/{id}/commercial-status { to_status: RELEASED }"
    condition: "sku.certification_status != CERTIFIED, or sku.pin_stale == true"
    error_id: ERR_SKU_NOT_PRODUCIBLE
    http_status: 409
    note: "the parallel-dimension guard: the commercial dimension may only reach RELEASED while the certification dimension is CERTIFIED against a pin that is still fresh. A pin goes stale when the SKU's recipe is SUPERSEDED or RETIRED, so a certified SKU can lose the right to be released without any commercial action at all"

  # --- P11 business safety ---------------------------------------------------
  - priority: 11
    rule_id: V-SAFE-1
    category: business_safety
    applies_to: "POST /production-runs/{id}/start"
    condition: |
      SLIP QUALIFICATION LAPSE — ProductSku.waterproof_rated == true and there is NO
      TestPanel of that SKU with status == PASSED that both (a) holds a TestResult with
      test_type == SLIP_RESISTANCE and outcome == PASS at that panel's attempt_no and
      (b) has updated_at > logical_clock - SLIP_REQUALIFICATION_DAYS (180) days.
      A never-qualified SKU and a SKU whose DCOF qualification has aged out are both
      rejected, so the rule stays reachable after certification: a waterproof SKU cannot
      even reach PROVISIONAL without a passing SLIP_RESISTANCE result, but that result
      lapses 180 days later and the run start must then be blocked until it is repeated.
    error_id: ERR_SLIP_RESISTANCE_NOT_QUALIFIED
    http_status: 422
    note: "the 180-day clock is read at POST /production-runs/{id}/start, not at creation, so a run planned inside the qualification window but started after it lapses is rejected"

  - priority: 11
    rule_id: V-SAFE-2
    category: business_safety
    applies_to: "POST /production-runs/{id}/qc-disposition { to_disposition: RELEASED }"
    condition: "any of registration_within_tolerance, emboss_within_tolerance, curl_within_tolerance, tongue_within_tolerance is false"
    error_id: ERR_QC_GATES_NOT_MET
    http_status: 422

  - priority: 11
    rule_id: V-SAFE-3
    category: business_safety
    applies_to: "POST /product-skus/{id}/certify"
    condition: "some test_type in calculations.sku_required_test_types has no PASS TestResult at the current attempt_no of a PASSED TestPanel for this SKU"
    error_id: ERR_TEST_COVERAGE_INCOMPLETE
    http_status: 422
    priority_conflict_note: "CONFLICT B — wins over V-REF-1 (ERR_FORMULATION_NOT_APPROVED, priority 14) when a SKU with no passing coverage is certified after its recipe has been SUPERSEDED by an approved revision"

  # --- P12 business constraint ----------------------------------------------
  - priority: 12
    rule_id: V-CON-1
    category: business_constraint
    applies_to: "POST /formulations/{id}/review-decision { decision: APPROVE }"
    condition: "Formulation.performance_score < 60.00"
    error_id: ERR_PERFORMANCE_SCORE_BELOW_MINIMUM
    http_status: 422

  - priority: 12
    rule_id: V-CON-2
    category: business_constraint
    applies_to: "POST /formulations/{id}/review-decision { decision: APPROVE }"
    condition: "Formulation.indentation_resistance_class == CLASS_23_31"
    error_id: ERR_INDENTATION_CLASS_TOO_LOW
    http_status: 422
    note: "evaluated after V-CON-1, so a recipe that clears the score but not the class returns this error"

  - priority: 12
    rule_id: V-CON-3
    category: business_constraint
    applies_to: "POST /formulations/{id}/submit"
    condition: "Formulation has no components, or resin_phr != 100.00"
    error_id: ERR_RESIN_PHR_NOT_NORMALIZED
    http_status: 422

  - priority: 12
    rule_id: V-CON-4
    category: business_constraint
    applies_to: "POST /formulations/{id}/components"
    condition: "phr > RawMaterial.max_phr"
    error_id: ERR_PHR_EXCEEDS_MATERIAL_MAX
    http_status: 422

  - priority: 12
    rule_id: V-CON-5
    category: business_constraint
    applies_to: "POST /distributors, /raw-materials, /formulations, /design-licenses, /print-films, /product-skus, /press-lines, /test-panels, /production-runs, /allocations, /warranty-claims, POST /formulations/{id}/components"
    condition: "the natural key already exists (account_code, material_code, formulation_code, license_code, design_code, sku_code, line_code, panel_code, run_code, allocation_code, claim_code), or a FormulationComponent already references the same raw_material_id on the same recipe"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409

  - priority: 12
    rule_id: V-CON-6
    category: business_constraint
    applies_to: "POST /production-runs"
    condition: "ProductSku.overall_thickness_mm < PressLine.min_thickness_mm or > PressLine.max_thickness_mm"
    error_id: ERR_THICKNESS_OUT_OF_LINE_RANGE
    http_status: 422

  - priority: 12
    rule_id: V-CON-7
    category: business_constraint
    applies_to: "POST /product-skus"
    condition: "profile_family != NONE and tolerance_minus_mm >= tongue_thickness_target_mm, or tolerance_plus_mm + tolerance_minus_mm > 0.50 (the milling tolerance band may not exceed half a millimetre in total)"
    error_id: ERR_TOLERANCE_BAND_INVALID
    http_status: 422

  - priority: 12
    rule_id: V-CON-8
    category: business_constraint
    applies_to: "POST /test-panels/{id}/start"
    condition: "panel.status == RETEST_REQUIRED and panel.retest_count > 2 — the panel has already consumed its two permitted retests (three attempts), so it may not be restarted a fourth time"
    error_id: ERR_RETEST_LIMIT_EXCEEDED
    http_status: 422

  - priority: 12
    rule_id: V-CON-9
    category: business_constraint
    applies_to: "POST /allocations/{id}/fill"
    condition: "allocation.allocated_quantity_sqm >= allocation.requested_quantity_sqm — i.e. the allocation is FILLED and its remaining requirement is 0.00, so there is nothing left to draw"
    error_id: ERR_ALLOCATION_OVER_REQUEST
    http_status: 422
    note: "the only rule that rejects a fill on a FILLED allocation (V-STATE-9 deliberately leaves FILLED out of its from-set so this 422 is reachable); it also wins over V-REF-7 (priority 14) when the candidate pool is empty as well"

  - priority: 12
    rule_id: V-CON-10
    category: business_constraint
    applies_to: "POST /test-panels/{id}/results"
    condition: "test_type is not a member of panel.required_test_types, or a TestResult for that test_type already exists at the panel's current attempt_no"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    note: "shape-like but resolvable only against stored state, so it is checked here rather than at priority 3"

  # --- P13 business temporal ------------------------------------------------
  - priority: 13
    rule_id: V-TEMP-1
    category: business_temporal
    applies_to: "POST /production-runs"
    condition: |
      PRESS LINE OCCUPATION — half-open intervals [planned_start_utc, planned_end_utc)
      on the same press_line_id. Two runs collide when
        new.planned_start_utc < other.planned_end_utc AND other.planned_start_utc < new.planned_end_utc
      over runs whose run_status NOT IN {ABORTED}. Touching endpoints do NOT collide:
      a run starting exactly at another's planned_end_utc is disjoint.
    error_id: ERR_PRESS_LINE_WINDOW_CONFLICT
    http_status: 409
    priority_conflict_note: "CONFLICT C — wins over V-FISC-1 (ERR_LICENSE_VOLUME_CAP_EXCEEDED, priority 15) when an overlapping run also breaks the term cap"

  - priority: 13
    rule_id: V-TEMP-2
    category: business_temporal
    applies_to: "POST /production-runs"
    condition: |
      CHANGEOVER BUFFER — beyond mere disjointness, the gap in whole minutes between the
      preceding run's planned_end_utc and this run's planned_start_utc must be
      >= calculations.press_line_changeover_gap.required_gap_minutes. Equality passes.
    error_id: ERR_CHANGEOVER_GAP_INSUFFICIENT
    http_status: 409

  - priority: 13
    rule_id: V-TEMP-3
    category: business_temporal
    applies_to: "POST /production-runs"
    condition: |
      PRINT FILM ROLL SETS — CLOSED intervals [planned_start_utc, planned_end_utc] on the
      same print_film_id, with a DIFFERENT geometry from V-TEMP-1: touching endpoints DO
      collide, because a roll set cannot be re-threaded instantaneously. This is an
      AGGREGATE capacity rule, not a pairwise exclusion: reject only when the number of
      intersecting runs with run_status NOT IN {ABORTED} is >= PrintFilm.master_roll_sets.
    error_id: ERR_PRINT_FILM_ROLL_CAPACITY_EXCEEDED
    http_status: 409

  - priority: 13
    rule_id: V-TEMP-4
    category: business_temporal
    applies_to: "POST /production-runs, POST /production-runs/{id}/start, POST /product-skus/{id}/begin-testing"
    condition: "the governing DesignLicense's valid_until <= the relevant instant (planned_start_utc for creation, the logical clock otherwise), which also lazily flips its status to EXPIRED; or planned_start_utc < valid_from"
    error_id: ERR_LICENSE_EXPIRED
    http_status: 409

  - priority: 13
    rule_id: V-TEMP-5
    category: business_temporal
    applies_to: "POST /production-runs/{id}/setup"
    condition: "the logical clock is earlier than planned_start_utc minus 120 minutes (SETUP_LEAD_MINUTES)"
    error_id: ERR_SETUP_TOO_EARLY
    http_status: 409

  - priority: 13
    rule_id: V-TEMP-6
    category: business_temporal
    applies_to: "POST /warranty-claims/{id}/adjudicate { decision: APPROVE }"
    condition: "elapsed_months >= ProductSku.warranty_years * 12"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 409

  # --- P14 business referential ---------------------------------------------
  - priority: 14
    rule_id: V-REF-1
    category: business_referential
    applies_to: "POST /product-skus/{id}/begin-testing, POST /product-skus/{id}/certify"
    condition: "Formulation(sku.formulation_id).status != APPROVED"
    error_id: ERR_FORMULATION_NOT_APPROVED
    http_status: 409
    priority_conflict_note: "CONFLICT B — loses to V-SAFE-3 (ERR_TEST_COVERAGE_INCOMPLETE, priority 11)"

  - priority: 14
    rule_id: V-REF-2
    category: business_referential
    applies_to: "POST /formulations/{id}/components, POST /formulations/{id}/submit, POST /formulations/{id}/review-decision"
    condition: "a RawMaterial referenced by any component of the recipe has status != ACTIVE"
    error_id: ERR_RAW_MATERIAL_NOT_ACTIVE
    http_status: 409

  - priority: 14
    rule_id: V-REF-3
    category: business_referential
    applies_to: "POST /product-skus/{id}/begin-testing, POST /production-runs, POST /production-runs/{id}/start"
    condition: "PrintFilm(sku.print_film_id).status != AVAILABLE"
    error_id: ERR_PRINT_FILM_NOT_AVAILABLE
    http_status: 409

  - priority: 14
    rule_id: V-REF-4
    category: business_referential
    applies_to: "POST /print-films, POST /product-skus/{id}/begin-testing, POST /product-skus/{id}/certify, POST /production-runs, POST /production-runs/{id}/start"
    condition: "the governing DesignLicense's status != ACTIVE (SUSPENDED, SUPERSEDED or TERMINATED)"
    error_id: ERR_LICENSE_NOT_ACTIVE
    http_status: 409

  - priority: 14
    rule_id: V-REF-5
    category: business_referential
    applies_to: "POST /warranty-claims, POST /warranty-claims/{id}/triage"
    condition: "Batch(batch_id).traceability_snapshot is absent, or Batch.status == IN_PRODUCTION (stock that never reached the market cannot found a field claim)"
    error_id: ERR_BATCH_NOT_TRACEABLE
    http_status: 409

  - priority: 14
    rule_id: V-REF-6
    category: business_referential
    applies_to: "POST /allocations"
    condition: "ProductSku(sku_id).certification_status != CERTIFIED"
    error_id: ERR_SKU_NOT_PRODUCIBLE
    http_status: 409

  - priority: 14
    rule_id: V-REF-7
    category: business_referential
    applies_to: "POST /allocations/{id}/fill"
    condition: "the candidate batch set computed by calculations.allocation_fill_plan step 1 is empty"
    error_id: ERR_NO_ELIGIBLE_BATCH
    http_status: 409
    priority_conflict_note: "CONFLICT A — loses to V-STATE-9 (ERR_INVALID_ALLOCATION_STATE, priority 7)"

  - priority: 14
    rule_id: V-REF-8
    category: business_referential
    applies_to: "POST /warranty-claims/{id}/adjudicate { decision: APPROVE }"
    condition: "any review_kind in required_reviews has an outcome != DEFECT_CONFIRMED"
    error_id: ERR_REVIEW_OUTCOME_CONFLICT
    http_status: 409

  # --- P15 business fiscal --------------------------------------------------
  - priority: 15
    rule_id: V-FISC-1
    category: business_fiscal
    applies_to: "POST /production-runs"
    condition: "consumed_volume_sqm + reserved_volume_sqm + planned_quantity_sqm > DesignLicense.term_volume_cap_sqm (equality is admitted)"
    error_id: ERR_LICENSE_VOLUME_CAP_EXCEEDED
    http_status: 422
    priority_conflict_note: "CONFLICT C — loses to V-TEMP-1 (ERR_PRESS_LINE_WINDOW_CONFLICT, priority 13)"

  - priority: 15
    rule_id: V-FISC-2
    category: business_fiscal
    applies_to: "POST /design-licenses/{id}/amendments"
    condition: "the amendment's term_volume_cap_sqm < the current license's consumed_volume_sqm + reserved_volume_sqm"
    error_id: ERR_LICENSE_VOLUME_CAP_EXCEEDED
    http_status: 422

# =============================================================================
# Table 5: API Endpoints  (§1.5)
# Every collection is mounted at the API root (api_prefix "/"). Every
# sub-resource GET uses the literal parent segment `{id}`.
# Endpoint inventory: 31 reads + 40 writes = 71.
# =============================================================================
endpoints:

  # ---------------------------------------------------------------------------
  # Distributor
  # ---------------------------------------------------------------------------
  - method: POST
    path: /distributors
    roles: [PlantAdmin]
    input: [account_code, name, territory_code, "certified_installer_program?", "status?"]
    output: Distributor
    side_effects: ["creates the Distributor in status ACTIVE unless overridden"]

  - method: GET
    path: /distributors
    roles: [PlantAdmin, ProductionPlanner, WarrantyAdjuster, Distributor]
    input: ["limit?", "offset?", "status?", "territory_code?"]
    output: Distributor[]

  - method: GET
    path: /distributors/{id}
    roles: [PlantAdmin, ProductionPlanner, WarrantyAdjuster, Distributor]
    input: []
    output: Distributor

  # ---------------------------------------------------------------------------
  # RawMaterial
  # ---------------------------------------------------------------------------
  - method: POST
    path: /raw-materials
    roles: [PlantAdmin]
    input: [material_code, name, category, cost_per_kg_cents, indentation_index, thermal_stability_index, plasticizer_migration_index, max_phr, "status?"]
    output: RawMaterial
    side_effects: ["creates the RawMaterial in status ACTIVE unless overridden"]

  - method: GET
    path: /raw-materials
    roles: [PlantAdmin, Formulator, TechnicalDirector, QaTechnician]
    input: ["limit?", "offset?", "category?", "status?"]
    output: RawMaterial[]

  - method: GET
    path: /raw-materials/{id}
    roles: [PlantAdmin, Formulator, TechnicalDirector, QaTechnician]
    input: []
    output: RawMaterial

  - method: GET
    path: /raw-materials/{id}/formulation-components
    roles: [PlantAdmin, Formulator, TechnicalDirector]
    input: ["limit?", "offset?"]
    output: FormulationComponent[]
    notes: "reverse reachability for FormulationComponent.raw_material_id"

  - method: POST
    path: /raw-materials/{id}/status
    roles: [PlantAdmin]
    input: [to_status]
    output: RawMaterial
    side_effects:
      - "to_status RESTRICTED starts the five-hop restriction cascade: APPROVED/SUPERSEDED formulations using the material -> RETIRED; their pinned SKUs -> certification SUSPENDED and commercial HOLD; those SKUs' IN_STOCK batches -> HELD; ACTIVE allocation lines on those batches -> VOIDED with quantities returned; the owning allocations step back to PARTIALLY_FILLED or OPEN"

  - method: POST
    path: /raw-materials/{id}/cost
    roles: [PlantAdmin]
    input: [cost_per_kg_cents]
    output: RawMaterial
    notes: |
      purchase-cost revaluation. Rejected with ERR_RAW_MATERIAL_NOT_ACTIVE (409) when
      material.status == RESTRICTED (validation V-STATE-11). Does NOT touch FormulationComponent.material_cost_snapshot_cents
      on any recipe whose cost_basis == PINNED, which is precisely how the LIVE_BASIS and
      PINNED_BASIS variants of calculations.sku_standard_cost are made to diverge.
    side_effects:
      - "every Formulation with cost_basis == LIVE (status DRAFT / UNDER_REVIEW / REJECTED) that has a component on this material has calculations.formulation_blend_metrics recomputed and its version incremented"
      - "recipes with cost_basis == PINNED are untouched, so Formulation.blended_cost_per_kg_cents and every ProductSku.standard_cost_cents_per_sqm stamped from them are unchanged"
      - "increments RawMaterial.version by 1"

  # ---------------------------------------------------------------------------
  # Formulation + FormulationComponent
  # ---------------------------------------------------------------------------
  - method: POST
    path: /formulations
    roles: [Formulator]
    input: [formulation_code, "supersedes_formulation_id?"]
    output: Formulation
    side_effects: ["creates the Formulation in DRAFT with revision 1, cost_basis LIVE and authored_by_user_id = X-User-ID"]

  - method: GET
    path: /formulations
    roles: [PlantAdmin, Formulator, TechnicalDirector, QaTechnician, ProductionPlanner]
    input: ["limit?", "offset?", "status?", "supersedes_formulation_id?", "indentation_resistance_class?"]
    output: Formulation[]
    notes: "reverse reachability for Formulation.supersedes_formulation_id"

  - method: GET
    path: /formulations/{id}
    roles: [PlantAdmin, Formulator, TechnicalDirector, QaTechnician, ProductionPlanner]
    input: []
    output: Formulation

  - method: GET
    path: /formulations/{id}/components
    roles: [PlantAdmin, Formulator, TechnicalDirector, QaTechnician]
    input: ["limit?", "offset?"]
    output: FormulationComponent[]
    notes: "reverse reachability for FormulationComponent.formulation_id"

  - method: POST
    path: /formulations/{id}/components
    roles: [Formulator]
    input: [raw_material_id, phr]
    output: FormulationComponent
    side_effects:
      - "recomputes calculations.formulation_blend_metrics on the parent"
      - "a REJECTED parent returns to DRAFT"

  - method: DELETE
    path: /formulations/{id}/components/{component_id}
    roles: [Formulator]
    input: []
    output: Formulation
    side_effects:
      - "removes the component and recomputes calculations.formulation_blend_metrics"
      - "a REJECTED parent returns to DRAFT"

  - method: POST
    path: /formulations/{id}/submit
    roles: [Formulator]
    input: []
    output: Formulation
    side_effects: ["DRAFT -> UNDER_REVIEW; stamps submitted_by_user_id"]

  - method: POST
    path: /formulations/{id}/review-decision
    roles: [TechnicalDirector]
    input: [decision, "review_note?"]
    output: Formulation
    side_effects:
      - "APPROVE: UNDER_REVIEW -> APPROVED, writes material_cost_snapshot_cents onto every component, flips cost_basis to PINNED, supersedes the predecessor and marks its SKUs pin_stale"
      - "REJECT: UNDER_REVIEW -> REJECTED and increments rejection_count"

  - method: POST
    path: /formulations/{id}/revisions
    roles: [Formulator]
    input: [formulation_code, expected_formulation_version]
    output: Formulation
    side_effects:
      - "creates a new DRAFT Formulation with revision = parent.revision + 1 and supersedes_formulation_id = {id}, copying every FormulationComponent (phr only, no snapshots)"
      - "increments the parent's open_revision_count and version; the parent stays APPROVED"
    notes: "OCC write endpoint for concurrency rule formulation-revision-supersede-stale"

  # ---------------------------------------------------------------------------
  # DesignLicense
  # ---------------------------------------------------------------------------
  - method: POST
    path: /design-licenses
    roles: [PlantAdmin]
    input: [license_code, licensor_name, license_type, royalty_rate_bps, valid_from, valid_until, term_volume_cap_sqm, territory_codes]
    output: DesignLicense
    side_effects: ["creates the grant in ACTIVE with a zeroed volume and royalty ledger"]

  - method: GET
    path: /design-licenses
    roles: [PlantAdmin, TechnicalDirector, ProductionPlanner, Formulator]
    input: ["limit?", "offset?", "status?", "supersedes_license_id?", "license_type?"]
    output: DesignLicense[]
    notes: "reverse reachability for DesignLicense.supersedes_license_id"

  - method: GET
    path: /design-licenses/{id}
    roles: [PlantAdmin, TechnicalDirector, ProductionPlanner, Formulator]
    input: []
    output: DesignLicense

  - method: GET
    path: /design-licenses/{id}/utilization
    roles: [PlantAdmin, TechnicalDirector, ProductionPlanner]
    input: []
    output: { term_volume_cap_sqm: number, reserved_volume_sqm: number, consumed_volume_sqm: number, projected_volume_sqm: number, remaining_volume_sqm: number, accrued_royalty_cents: integer, contributing_run_count: integer }
    notes: "computed read over calculations.license_volume_ledger and calculations.license_royalty_accrual"

  - method: POST
    path: /design-licenses/{id}/amendments
    roles: [TechnicalDirector]
    input: [license_code, term_volume_cap_sqm, "valid_until?", "royalty_rate_bps?", "amendment_note?"]
    output: DesignLicense
    side_effects:
      - "creates a successor grant in ACTIVE with supersedes_license_id = {id}, carrying reserved_volume_sqm, consumed_volume_sqm and accrued_royalty_cents across unchanged"
      - "repoints every PrintFilm of the amended grant at the successor"
      - "the amended grant moves ACTIVE -> SUPERSEDED"
    notes: "deliberately NOT an OCC endpoint: the parent leaves ACTIVE, so a second amendment is already rejected by V-STATE-2"

  - method: POST
    path: /design-licenses/{id}/status
    roles: [PlantAdmin, TechnicalDirector]
    input: [to_status]
    output: DesignLicense
    side_effects:
      - "SUSPENDED: films AVAILABLE -> RESTRICTED, their RELEASED SKUs -> HOLD, those SKUs' IN_STOCK batches -> HELD"
      - "ACTIVE: RESTRICTED films return to AVAILABLE; SKUs and batches are NOT restored"
      - "TERMINATED: four-hop cascade films -> WITHDRAWN, SKUs -> HOLD/SUSPENDED, batches -> HELD, allocation lines -> VOIDED"
    notes: "shared endpoint with a payload-dependent role split enforced by V-RBAC-2"

  # ---------------------------------------------------------------------------
  # PrintFilm
  # ---------------------------------------------------------------------------
  - method: POST
    path: /print-films
    roles: [PlantAdmin]
    input: [design_code, license_id, pattern_repeat_mm_length, pattern_repeat_mm_width, registration_tolerance_mm, emboss_plate_code, emboss_alignment_offset_mm, master_roll_sets]
    output: PrintFilm
    side_effects: ["creates the design in AVAILABLE"]

  - method: GET
    path: /print-films
    roles: [PlantAdmin, TechnicalDirector, ProductionPlanner, QaTechnician]
    input: ["limit?", "offset?", "status?", "license_id?"]
    output: PrintFilm[]
    notes: "reverse reachability for PrintFilm.license_id"

  - method: GET
    path: /print-films/{id}
    roles: [PlantAdmin, TechnicalDirector, ProductionPlanner, QaTechnician]
    input: []
    output: PrintFilm

  - method: POST
    path: /print-films/{id}/status
    roles: [PlantAdmin]
    input: [to_status]
    output: PrintFilm
    side_effects:
      - "RESTRICTED and WITHDRAWN block POST /product-skus/{id}/begin-testing, POST /production-runs and POST /production-runs/{id}/start through validation V-REF-3, while existing PLANNED windows stay reserved"
      - "AVAILABLE is only reachable again while the governing DesignLicense is ACTIVE"
    notes: |
      Library curation independent of the licence: a damaged emboss plate or a
      licensor hold on one design must be expressible without suspending the whole
      grant. This is also what makes ERR_PRINT_FILM_NOT_AVAILABLE triggerable on
      its own — every licence-driven route to a non-AVAILABLE film simultaneously
      violates V-REF-4 at the same priority.

  # ---------------------------------------------------------------------------
  # ProductSku
  # ---------------------------------------------------------------------------
  - method: POST
    path: /product-skus
    roles: [PlantAdmin]
    input: [sku_code, formulation_id, print_film_id, construction_type, wear_layer_mil, overall_thickness_mm, royalty_basis_price_cents_per_sqm, "waterproof_rated?", "attached_underlayment_type?", "profile_family?", "tongue_thickness_target_mm?", "tolerance_plus_mm?", "tolerance_minus_mm?", "target_lock_shear_n_per_mm?", "target_margin_bps?"]
    output: ProductSku
    side_effects:
      - "creates the SKU with certification_status UNCERTIFIED and commercial_status DEVELOPMENT"
      - "computes calculations.sku_warranty_terms"
    notes: "an APPROVED formulation is deliberately NOT required at creation; it is required at begin-testing"

  - method: GET
    path: /product-skus
    roles: [PlantAdmin, Formulator, TechnicalDirector, QaTechnician, ProductionPlanner, Distributor]
    input: ["limit?", "offset?", "certification_status?", "commercial_status?", "formulation_id?", "print_film_id?", "construction_type?"]
    output: ProductSku[]
    notes: "reverse reachability for ProductSku.formulation_id and ProductSku.print_film_id"

  - method: GET
    path: /product-skus/{id}
    roles: [PlantAdmin, Formulator, TechnicalDirector, QaTechnician, ProductionPlanner, Distributor]
    input: []
    output: ProductSku

  - method: GET
    path: /product-skus/{id}/cost-summary
    roles: [PlantAdmin, TechnicalDirector, Formulator]
    input: []
    output: { live_basis_core_cost_cents: integer, pinned_basis_core_cost_cents: integer, live_basis_blended_cost_per_kg_cents: integer, pinned_basis_blended_cost_per_kg_cents: integer, wear_layer_cost_cents: integer, print_film_cost_cents: integer, underlayment_cost_cents: integer, waterproof_cost_cents: integer, conversion_cost_cents: integer, royalty_cost_cents: integer, live_basis_standard_cost_cents_per_sqm: integer, pinned_basis_standard_cost_cents_per_sqm: integer, basis_delta_cents_per_sqm: integer, live_basis_list_price_cents_per_sqm: integer, pinned_basis_list_price_cents_per_sqm: integer, pin_stale: boolean }
    notes: "computed read returning BOTH variants of calculations.sku_standard_cost and their delta"

  - method: POST
    path: /product-skus/{id}/begin-testing
    roles: [QaTechnician]
    input: []
    output: ProductSku
    side_effects: ["certification UNCERTIFIED/SUSPENDED -> TESTING; clears the pinned versions, stamped costs and certification stamps"]

  - method: POST
    path: /product-skus/{id}/certify
    roles: [TechnicalDirector]
    input: []
    output: ProductSku
    side_effects:
      - "certification TESTING/PROVISIONAL -> CERTIFIED"
      - "pins pinned_formulation_version and pinned_print_film_version"
      - "stamps standard_cost_cents_per_sqm and list_price_cents_per_sqm from the PINNED_BASIS variant"

  - method: POST
    path: /product-skus/{id}/commercial-status
    roles: [PlantAdmin]
    input: [to_status]
    output: ProductSku
    side_effects:
      - "RELEASED requires certification_status CERTIFIED and pin_stale false (validation V-XSTATE-7, ERR_SKU_NOT_PRODUCIBLE)"
      - "HOLD cascades IN_STOCK batches of this SKU to HELD"
      - "DISCONTINUED forces certification_status DECERTIFIED and cancels OPEN/PARTIALLY_FILLED allocations, voiding their lines"

  # ---------------------------------------------------------------------------
  # PressLine
  # ---------------------------------------------------------------------------
  - method: POST
    path: /press-lines
    roles: [PlantAdmin]
    input: [line_code, line_type, min_thickness_mm, max_thickness_mm, changeover_minutes, curl_control_index, "status?"]
    output: PressLine
    side_effects: ["creates the line in AVAILABLE unless overridden"]

  - method: GET
    path: /press-lines
    roles: [PlantAdmin, ProductionPlanner, QaTechnician]
    input: ["limit?", "offset?", "status?", "line_type?"]
    output: PressLine[]

  - method: GET
    path: /press-lines/{id}
    roles: [PlantAdmin, ProductionPlanner, QaTechnician]
    input: []
    output: PressLine

  - method: POST
    path: /press-lines/{id}/status
    roles: [PlantAdmin]
    input: [to_status]
    output: PressLine
    side_effects: ["MAINTENANCE and DOWN block run creation, setup and start but leave existing windows reserved"]

  # ---------------------------------------------------------------------------
  # TestPanel + TestResult
  # ---------------------------------------------------------------------------
  - method: POST
    path: /test-panels
    roles: [QaTechnician]
    input: [panel_code, sku_id]
    output: TestPanel
    side_effects: ["creates the panel in SCHEDULED with attempt_no 1 and required_test_types from calculations.sku_required_test_types"]

  - method: GET
    path: /test-panels
    roles: [PlantAdmin, QaTechnician, TechnicalDirector, Formulator]
    input: ["limit?", "offset?", "status?", "sku_id?"]
    output: TestPanel[]
    notes: "reverse reachability for TestPanel.sku_id"

  - method: GET
    path: /test-panels/{id}
    roles: [PlantAdmin, QaTechnician, TechnicalDirector, Formulator]
    input: []
    output: TestPanel

  - method: GET
    path: /test-panels/{id}/results
    roles: [PlantAdmin, QaTechnician, TechnicalDirector, Formulator]
    input: ["limit?", "offset?", "test_type?"]
    output: TestResult[]
    notes: "reverse reachability for TestResult.test_panel_id"

  - method: POST
    path: /test-panels/{id}/start
    roles: [QaTechnician]
    input: []
    output: TestPanel
    side_effects:
      - "SCHEDULED/RETEST_REQUIRED -> IN_TEST; a RETEST_REQUIRED restart increments attempt_no"
      - "re-derives required_test_types"

  - method: POST
    path: /test-panels/{id}/results
    roles: [QaTechnician]
    input: [test_type, measured_value]
    output: TestResult
    side_effects:
      - "computes unit, spec_limit and outcome via calculations.test_spec_limit_and_outcome"
      - "when the current attempt's coverage completes: all PASS -> panel PASSED (and the SKU may reach PROVISIONAL); any MARGINAL and no FAIL -> panel RETEST_REQUIRED with retest_count incremented"
      - "any FAIL -> panel FAILED immediately and the SKU loses certification, aborting its PLANNED/SETUP runs"

  - method: POST
    path: /test-panels/{id}/void
    roles: [QaTechnician]
    input: [void_reason]
    output: TestPanel
    side_effects: ["SCHEDULED/IN_TEST/RETEST_REQUIRED -> VOIDED; recorded results survive but stop qualifying for certification"]

  # ---------------------------------------------------------------------------
  # ProductionRun
  # ---------------------------------------------------------------------------
  - method: POST
    path: /production-runs
    roles: [ProductionPlanner]
    input: [run_code, sku_id, press_line_id, planned_start_utc, planned_end_utc, planned_quantity_sqm]
    output: ProductionRun
    side_effects:
      - "creates the run with run_status PLANNED and qc_disposition PENDING"
      - "reserves planned_quantity_sqm against the governing DesignLicense (RESERVED_VOLUME_BASIS)"
    notes: "enforces the half-open press-line interval rule, the changeover buffer, the closed-interval print-film roll-set capacity rule and the license term cap"

  - method: GET
    path: /production-runs
    roles: [PlantAdmin, ProductionPlanner, QaTechnician, TechnicalDirector]
    input: ["limit?", "offset?", "run_status?", "qc_disposition?", "sku_id?", "press_line_id?"]
    output: ProductionRun[]
    notes: "reverse reachability for ProductionRun.sku_id and ProductionRun.press_line_id"

  - method: GET
    path: /production-runs/{id}
    roles: [PlantAdmin, ProductionPlanner, QaTechnician, TechnicalDirector]
    input: []
    output: ProductionRun

  - method: POST
    path: /production-runs/{id}/setup
    roles: [ProductionPlanner]
    input: []
    output: ProductionRun
    side_effects: ["PLANNED -> SETUP; persists changeover_minutes_applied from calculations.press_line_changeover_gap"]

  - method: POST
    path: /production-runs/{id}/start
    roles: [ProductionPlanner]
    input: []
    output: ProductionRun
    side_effects: ["SETUP -> RUNNING"]

  - method: POST
    path: /production-runs/{id}/complete
    roles: [ProductionPlanner]
    input: [actual_quantity_sqm, registration_drift_mm, curl_deviation_mm, emboss_alignment_offset_mm, wear_layer_measured_mil, "measured_tongue_thickness_mm?"]
    output: ProductionRun
    side_effects:
      - "RUNNING -> COMPLETED; computes calculations.run_quality_metrics"
      - "settles the license ledger on ACTUAL_VOLUME_BASIS and accrues the run royalty"
      - "mints exactly one Batch in IN_PRODUCTION with the traceability snapshot, but only when actual_quantity_sqm > 0"

  - method: POST
    path: /production-runs/{id}/abort
    roles: [ProductionPlanner]
    input: [abort_reason]
    output: ProductionRun
    side_effects: ["PLANNED/SETUP/RUNNING -> ABORTED; releases the license reservation exactly, mints no Batch and accrues no royalty"]

  - method: POST
    path: /production-runs/{id}/qc-disposition
    roles: [QaTechnician]
    input: [to_disposition, "hold_reason?"]
    output: ProductionRun
    side_effects:
      - "RELEASED requires all four QC gates and moves the Batch to IN_STOCK with its full available quantity"
      - "QUARANTINED moves the Batch to HELD"
      - "SCRAPPED reverses consumed volume and accrued royalty exactly, scraps the Batch and voids its ACTIVE allocation lines"

  # ---------------------------------------------------------------------------
  # Batch
  # ---------------------------------------------------------------------------
  - method: GET
    path: /batches
    roles: [PlantAdmin, ProductionPlanner, QaTechnician, WarrantyAdjuster, Distributor]
    input: ["limit?", "offset?", "status?", "sku_id?", "production_run_id?"]
    output: Batch[]
    notes: "reverse reachability for Batch.sku_id and Batch.production_run_id"

  - method: GET
    path: /batches/{id}
    roles: [PlantAdmin, ProductionPlanner, QaTechnician, WarrantyAdjuster, Distributor]
    input: []
    output: Batch

  - method: GET
    path: /batches/{id}/allocation-lines
    roles: [PlantAdmin, ProductionPlanner, QaTechnician, Distributor]
    input: ["limit?", "offset?", "status?"]
    output: AllocationLine[]
    notes: "reverse reachability for AllocationLine.batch_id"

  - method: POST
    path: /batches/{id}/hold-status
    roles: [QaTechnician]
    input: [action, "hold_reason?"]
    output: Batch
    side_effects:
      - "HOLD: IN_STOCK -> HELD, voids ACTIVE allocation lines and returns their quantities"
      - "RELEASE_HOLD: HELD -> IN_STOCK, requires a different user than held_by_user_id and a RELEASED producing run"
      - "SCRAP: -> SCRAPPED with available_quantity_sqm 0 and every ACTIVE line voided"

  # ---------------------------------------------------------------------------
  # Allocation + AllocationLine
  # ---------------------------------------------------------------------------
  - method: POST
    path: /allocations
    roles: [Distributor, PlantAdmin]
    input: [allocation_code, distributor_id, sku_id, requested_quantity_sqm, "substitution_policy?"]
    output: Allocation
    side_effects: ["creates the allocation in OPEN with substitution_policy STRICT_SKU unless overridden"]

  - method: GET
    path: /allocations
    roles: [PlantAdmin, ProductionPlanner, Distributor]
    input: ["limit?", "offset?", "status?", "distributor_id?", "sku_id?"]
    output: Allocation[]
    notes: "reverse reachability for Allocation.distributor_id and Allocation.sku_id"

  - method: GET
    path: /allocations/{id}
    roles: [PlantAdmin, ProductionPlanner, Distributor]
    input: []
    output: Allocation

  - method: GET
    path: /allocations/{id}/lines
    roles: [PlantAdmin, ProductionPlanner, Distributor]
    input: ["limit?", "offset?", "status?"]
    output: AllocationLine[]
    notes: "reverse reachability for AllocationLine.allocation_id"

  - method: POST
    path: /allocations/{id}/fill
    roles: [Distributor]
    input: [expected_allocation_version]
    output: Allocation
    side_effects:
      - "runs calculations.allocation_fill_plan and mints one AllocationLine per drawn batch"
      - "decrements each drawn Batch.available_quantity_sqm"
      - "moves the allocation to PARTIALLY_FILLED or FILLED"
    notes: "OCC write endpoint for concurrency rule allocation-fill-stale-view"

  - method: POST
    path: /allocations/{id}/release
    roles: [Distributor]
    input: []
    output: Allocation
    side_effects: ["-> RELEASED; voids every ACTIVE line and returns each quantity to its Batch, restoring the stock ledger exactly"]

  # ---------------------------------------------------------------------------
  # WarrantyClaim
  # ---------------------------------------------------------------------------
  - method: POST
    path: /warranty-claims
    roles: [Distributor, WarrantyAdjuster]
    input: [claim_code, batch_id, distributor_id, claim_type, claimed_area_sqm, installed_on, reported_on, "installed_by_certified_installer?"]
    output: WarrantyClaim
    side_effects: ["creates the claim in SUBMITTED"]

  - method: GET
    path: /warranty-claims
    roles: [PlantAdmin, WarrantyAdjuster, QaTechnician, Distributor]
    input: ["limit?", "offset?", "status?", "batch_id?", "distributor_id?", "claim_type?"]
    output: WarrantyClaim[]
    notes: "reverse reachability for WarrantyClaim.batch_id and WarrantyClaim.distributor_id"

  - method: GET
    path: /warranty-claims/{id}
    roles: [PlantAdmin, WarrantyAdjuster, QaTechnician, Distributor]
    input: []
    output: WarrantyClaim

  - method: POST
    path: /warranty-claims/{id}/triage
    roles: [WarrantyAdjuster]
    input: []
    output: WarrantyClaim
    side_effects: ["SUBMITTED -> TRIAGE; stamps assigned_adjuster_user_id and forks required_reviews from claim_type"]

  - method: POST
    path: /warranty-claims/{id}/reviews
    roles: [WarrantyAdjuster]
    input: [review_kind, outcome, "note?"]
    output: WarrantyClaim
    side_effects: ["records the branch outcome; joins to ADJUDICATION_READY once every required review has an outcome"]

  - method: POST
    path: /warranty-claims/{id}/adjudicate
    roles: [WarrantyAdjuster]
    input: [decision, "denial_reason?"]
    output: WarrantyClaim
    side_effects: ["APPROVE computes calculations.warranty_settlement_amount; DENY records denial_reason and leaves settlement_amount_cents null"]

  # ---------------------------------------------------------------------------
  # Test-driving endpoint (last resort, §1.5 priority ladder)
  # ---------------------------------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    roles: [PlantAdmin]
    input: [current_utc]
    output: { current_utc: datetime }
    notes: |
      MANDATORY logical clock. Every datetime the server stamps (created_at, updated_at,
      approved_at, certified_at, snapshot_at) and every "now" comparison (license expiry,
      setup lead time) reads this value, never the wall clock.
      Default at boot: 2026-08-01T00:00:00Z.
      Justification for a `/_`-prefixed endpoint: license expiry, the 120-minute setup
      lead window and multi-year warranty proration cannot be exercised by composing
      business endpoints, because no business endpoint accepts "now" as an input.

