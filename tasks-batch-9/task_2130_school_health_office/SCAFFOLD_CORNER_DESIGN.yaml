      - name: guardian_consent_missing_is_masked_by_plan_state_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=7]
          - validations[priority=25]
          - errors[ERR_PLAN_INVALID_STATE]
          - errors[ERR_GUARDIAN_CONSENT_MISSING]
        distinguishing_aspect: "The only reachable state in which ActionPlan.guardian_consent_at is null is a plan outside PENDING_PROVIDER, so a decision on a PENDING_GUARDIAN plan violates both the priority-7 state row and the priority-25 safety row; the state row wins and the response is ERR_PLAN_INVALID_STATE, never ERR_GUARDIAN_CONSENT_MISSING."
        test_recipe:
          setup:
            - "School WREN51 with one RN and one ENROLLED student."
