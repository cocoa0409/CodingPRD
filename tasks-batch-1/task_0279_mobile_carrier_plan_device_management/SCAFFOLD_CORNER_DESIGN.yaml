  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_succeeds_then_increments
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[line-provision-stale-account]", endpoints, entities.Account.fields.version]
        distinguishing_aspect: "POST /lines with the current expected_account_version succeeds (201) and bumps Account.version by exactly 1."
        test_recipe:
          setup: ["A fresh ACTIVE account (version 1) and an ACTIVE plan."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "OK", holder_email: "ok@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /plans"
              payload: { code: "P-OK", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "ESIM", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: CarrierAgent
              captures: { new_v: $.data.version }
          assert:
            - "First POST /lines returns 201"
            - "Account.${acc_id}.version == 2 after provisioning (was 1)"

      - name: occ_stale_version_on_second_provision_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[line-provision-stale-account]", "errors[ERR_STALE_ACCOUNT_VERSION]"]
        distinguishing_aspect: "A second POST /lines still carrying the original expected_account_version (now stale after the first provision bumped it) returns 412 ERR_STALE_ACCOUNT_VERSION."
        test_recipe:
          setup: ["A fresh ACTIVE account (version 1) and a plan; one line already provisioned with version 1 (account now version 2)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "SV", holder_email: "sv@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /plans"
              payload: { code: "P-SV", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "ESIM", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { l1: $.data.id }
          trigger:
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "ESIM", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { err: $.data.error_id }
          assert: ["HTTP 412 with error_id == ERR_STALE_ACCOUNT_VERSION (acc_v is now stale)"]

      - name: esim_activation_code_populated_on_activate
        claim_type: derived_field_reconciliation
        grounds: [entities.SimAssignment.fields.esim_activation_code, state_machines.Line.PENDING_ACTIVATION_to_ACTIVE]
        distinguishing_aspect: "Activating a line whose SIM is ESIM populates SimAssignment.esim_activation_code and moves the SIM ISSUED->ACTIVATED; a PHYSICAL SIM leaves esim_activation_code null."
        test_recipe:
          setup: ["An ESIM line with an ISSUED eSIM SimAssignment."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "ES", holder_email: "es@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /plans"
              payload: { code: "P-ES", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "ESIM", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${line_id}", sim_type: "ESIM" }
              as: CarrierAgent
              captures: { sim_id: $.data.id }
            - call: "POST /lines/${line_id}/activate"
              payload: {}
              as: CarrierAgent
          trigger:
            - call: "GET /sim-assignments/${sim_id}"
              payload: {}
              as: CarrierAgent
              captures: { code: $.data.esim_activation_code, st: $.data.status }
          assert:
            - "SimAssignment.${sim_id}.status == ACTIVATED"
            - "SimAssignment.${sim_id}.esim_activation_code is non-null (eSIM LPA string issued)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_eip_outstanding_after_create
        claim_type: immediate
        grounds: [entities.Account.fields.total_eip_outstanding_cents, calculations.eip_schedule]
        distinguishing_aspect: "After POST /installment-plans (financed 90000), an immediate GET /accounts/{id} shows total_eip_outstanding_cents==90000 in the same request cycle (immediate consistency)."
        test_recipe:
          setup: ["ACTIVE line; device retail 99900 down 9900; no other EIPs."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "IM", holder_email: "im@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /plans"
              payload: { code: "P-IM", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /devices"
              payload: { model: "Phone IM", sku: "IM-1", retail_price_cents: 99900, stock_count: 5 }
              as: CarrierAgent
              captures: { dev_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${line_id}", sim_type: "PHYSICAL", iccid: "8901000000000000320" }
              as: CarrierAgent
            - call: "POST /lines/${line_id}/activate"
              payload: {}
              as: CarrierAgent
            - call: "POST /installment-plans"
              payload: { line_id: "${line_id}", device_id: "${dev_id}", term_months: 24, down_payment_cents: 9900 }
              as: CarrierAgent
              captures: { eip_id: $.data.id }
          trigger:
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: CarrierAgent
              captures: { out: $.data.total_eip_outstanding_cents }
          assert: ["Account.${acc_id}.total_eip_outstanding_cents == 90000 (immediate, same-request visibility)"]

  # ===========================================================================
  # excluded_because stubs — corners fully exercised by named §1.8 instances
  # ===========================================================================
  - section: state_machines
    instances:
      - name: stub_line_cancel_cascade_covered_by_difficulty
        claim_type: Side Effect Execution
        grounds: [state_machines.Line.ACTIVE_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / line_cancel_depth3_cascade_eip_addon_account
          rationale: "The full cancel cascade (EIP PAID_OFF, add-on CANCELLED, total_eip_outstanding recompute) is asserted end-to-end by that §1.8 instance."

      - name: stub_portin_revert_number_release_covered
        claim_type: Compensation
        grounds: [state_machines.PortRequest.COMPLETED_to_REVERTED]
        excluded_because:
          difficulty_instance: compensating_invariant / number_pool_conserved_on_portin_revert
          rationale: "PORT_IN revert releasing the number (phone_number -> null) and the conserved live-number count are asserted by that §1.8 instance."

  - section: calculations
    instances:
      - name: stub_account_cycle_total_rounding_order_covered
