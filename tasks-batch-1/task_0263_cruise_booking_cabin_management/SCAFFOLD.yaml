# =============================================================================
# Scaffold: Cruise Booking & Cabin Management (v1) — Expert
# =============================================================================

scenario: |
  Cruise Booking & Cabin Management: sailing/itinerary inventory, cabin category
  & deck assignment, per-guest fare + taxes/port fees, deposit & final-payment
  schedule, dining/excursion add-on, group block, cancellation tiers/FCC,
  onboard folio

domain_name: cruise-booking-cabin-management
api_prefix: /

complexity_profile:
  primary_archetype: "Quota / allocation"            # finite cabin pool per category reserved/committed/released
  secondary_archetype: "Pricing engine"              # per-guest fare + taxes/port fees, deposit schedule, cancellation tiers/FCC
  complexity_layers:
    - optimistic_concurrency                          # OCC on Sailing.version for cabin-consuming booking creation (CREATE-with-supersede on a finite pool)
    - cascading_side_effects                          # cancel booking -> release cabin -> restore category counts -> decrement group-block materialization
    - dual_variant_calculation                        # cancellation CASH refund vs FCC credit; provisional guest fare at QUOTE vs final fare at CONFIRMED
    - rate_threshold_triggers                          # cancellation penalty tiers keyed on days-before-sailing; deposit floor per-guest
  entity_topology: flat                                # peer entities linked by FK fields in bodies; no nesting in URL paths
  state_machine_shape: cyclic                          # Booking re-quote loop and GroupBlock renegotiation loop
  relationship_patterns:
    - one_to_many                                      # Sailing->CabinCategory->Cabin; Booking->Guest/AddOn/Payment
    - cross_aggregate                                  # Booking references Cabin and GroupBlock across aggregate boundaries
  role_model: peer_roles                               # GuestUser owns own Booking; ReservationsAgent/RevenueManager/PortAgent own different surfaces
  consistency_model: immediate                          # all cascades atomic within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Sailing
    parent: null
    common_fields: true
    fields:
      - { name: ship_name, type: string, source: input, description: "Name of the ship" }
      - { name: itinerary_code, type: string, source: input, description: "Itinerary identifier (e.g., WCAR7N)" }
      - { name: embark_date, type: datetime, source: input, description: "Embarkation date/time (ISO 8601 UTC)" }
      - { name: disembark_date, type: datetime, source: input, description: "Disembarkation date/time (ISO 8601 UTC); must be strictly after embark_date" }
      - { name: nights, type: integer, source: input, description: "Number of nights for the voyage; must be >= 1 and consistent with embark/disembark dates" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | OPEN | CLOSED | SAILED | CANCELLED" }
      - { name: total_cabins, type: integer, source: computed, default: 0, description: "Sum of total_cabins over all CabinCategory children" }
      - { name: available_cabins, type: integer, source: computed, default: 0, description: "Sum of available_cabins over all CabinCategory children" }

  - name: CabinCategory
    parent: Sailing
    common_fields: true
    fields:
      - { name: sailing_id, type: string, source: input, description: "FK -> Sailing.id; the sailing this category belongs to" }
      - { name: code, type: enum, source: input, description: "INTERIOR | OCEANVIEW | BALCONY | SUITE; unique per sailing" }
      - { name: deck_low, type: integer, source: input, description: "Lowest deck number occupied by this category" }
      - { name: deck_high, type: integer, source: input, description: "Highest deck number; must be >= deck_low" }
      - { name: base_fare_per_guest_cents, type: integer, source: input, description: "Full per-guest fare in cents for occupancy positions 1 and 2; must be > 0" }
      - { name: max_occupancy, type: integer, source: input, description: "Maximum guests per cabin in this category (2, 3, or 4); must be between 1 and 4" }
      - { name: total_cabins, type: integer, source: computed, default: 0, description: "Count of Cabin children in this category" }
      - { name: available_cabins, type: integer, source: computed, default: 0, description: "Count of Cabin children whose status == AVAILABLE" }
      - { name: held_cabins, type: integer, source: computed, default: 0, description: "Count of Cabin children whose status == HELD" }
      - { name: assigned_cabins, type: integer, source: computed, default: 0, description: "Count of Cabin children whose status == ASSIGNED" }
      - { name: blocked_cabins, type: integer, source: computed, default: 0, description: "Count of Cabin children whose status == BLOCKED" }

  - name: Cabin
    parent: CabinCategory
    common_fields: true
    fields:
      - { name: cabin_category_id, type: string, source: input, description: "FK -> CabinCategory.id; the category that owns this cabin" }
      - { name: sailing_id, type: string, source: system, description: "FK -> Sailing.id; denormalized from the parent category for filtering" }
      - { name: cabin_number, type: string, source: input, description: "Cabin number/label; unique per sailing" }
      - { name: deck, type: integer, source: input, description: "Deck this cabin sits on; must fall within the category deck_low..deck_high range" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE | HELD | ASSIGNED | BLOCKED" }
      - { name: group_block_id, type: string, source: system, default: null, description: "FK -> GroupBlock.id; set while the cabin is BLOCKED for a group, else null" }
      - { name: booking_id, type: string, source: system, default: null, description: "FK -> Booking.id; set while the cabin is HELD or ASSIGNED to a booking, else null" }

  - name: GroupBlock
    parent: Sailing
    common_fields: true
    fields:
      - { name: sailing_id, type: string, source: input, description: "FK -> Sailing.id; the sailing this block reserves cabins on" }
      - { name: group_name, type: string, source: input, description: "Display name of the group" }
      - { name: cabin_category_id, type: string, source: input, description: "FK -> CabinCategory.id; the category the block draws cabins from" }
      - { name: block_size, type: integer, source: input, description: "Number of cabins requested for the block; must be > 0" }
      - { name: group_discount_pct, type: number, source: input, default: 0.15, description: "Fractional discount applied to per-guest fares of bookings drawn from this block (0..0.5)" }
      - { name: release_cutoff_date, type: datetime, source: input, description: "Date after which unmaterialized blocked cabins auto-release (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, default: "NEGOTIATING", description: "NEGOTIATING | HELD | PARTIALLY_MATERIALIZED | RELEASED" }
      - { name: blocked_count, type: integer, source: computed, default: 0, description: "Count of Cabin children whose status == BLOCKED and group_block_id == this block" }
      - { name: materialized_count, type: integer, source: computed, default: 0, description: "Count of Booking children whose group_block_id == this block and status NOT IN {CANCELLED, EXPIRED}" }

  - name: Booking
    parent: Sailing
    common_fields: true
    fields:
      - { name: sailing_id, type: string, source: input, description: "FK -> Sailing.id; the sailing being booked" }
      - { name: cabin_category_id, type: string, source: input, description: "FK -> CabinCategory.id; the cabin category requested" }
      - { name: group_block_id, type: string, source: input, default: null, description: "FK -> GroupBlock.id; optional group block this booking draws from (null for individual bookings)" }
      - { name: cabin_id, type: string, source: system, default: null, description: "FK -> Cabin.id; the specific cabin held/assigned to this booking, null until a cabin is held" }
      - { name: owner_user_id, type: string, source: input, description: "X-User-ID of the GuestUser who owns this booking" }
      - { name: expected_sailing_version, type: integer, source: input, description: "OCC: the Sailing.version the client last observed; checked on creation to guard the finite cabin pool" }
      - { name: status, type: enum, source: system, default: "QUOTE", description: "QUOTE | DEPOSIT_HELD | CONFIRMED | EMBARKED | COMPLETED | CANCELLED | EXPIRED" }
      - { name: guest_count, type: integer, source: computed, default: 0, description: "Count of Guest children" }
      - { name: fare_total_cents, type: integer, source: computed, default: 0, description: "Sum over guests of final_fare_cents (provisional rack fare while QUOTE, group/promo fare once CONFIRMED)" }
      - { name: tax_port_total_cents, type: integer, source: computed, default: 0, description: "Sum over guests of tax_port_cents (round-per-guest-then-sum)" }
      - { name: booking_total_cents, type: integer, source: computed, default: 0, description: "fare_total_cents + tax_port_total_cents" }
      - { name: deposit_due_cents, type: integer, source: computed, default: 0, description: "Deposit amount required to move QUOTE -> DEPOSIT_HELD" }
      - { name: final_due_cents, type: integer, source: computed, default: 0, description: "booking_total_cents - deposit_due_cents, due before CONFIRMED" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Sum of Payment.amount_cents for CAPTURED deposit/final payments minus REFUNDED refunds" }
      - { name: fcc_credit_cents, type: integer, source: computed, default: 0, description: "Future cruise credit minted when cancelling under the FCC variant; 0 otherwise" }
      - { name: cancel_refund_cents, type: integer, source: computed, default: 0, description: "Cash refund issued when cancelling under the CASH variant; 0 otherwise" }
      - { name: cancellation_mode, type: enum, source: system, default: null, description: "CASH | FCC; recorded at cancellation, null while active" }

  - name: Guest
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking this guest belongs to" }
      - { name: full_name, type: string, source: input, description: "Guest full name" }
      - { name: age, type: integer, source: input, description: "Guest age in years at embarkation; must be >= 0" }
      - { name: occupancy_index, type: integer, source: system, description: "1-based position of this guest within the cabin (assigned in Guest.created_at ascending order); positions 1-2 pay full fare, 3-4 pay the reduced occupancy rate" }
      - { name: base_fare_cents, type: integer, source: computed, default: 0, description: "Per-guest fare before group/promo discount: full base for occupancy_index 1-2, THIRD_FOURTH_PCT*base (half-up) for 3-4" }
      - { name: final_fare_cents, type: integer, source: computed, default: 0, description: "Per-guest fare after group discount: equals base_fare_cents while Booking is QUOTE; group-discounted once Booking is CONFIRMED and group_block_id is set" }
      - { name: tax_port_cents, type: integer, source: computed, default: 0, description: "Per-guest taxes + port fees: half_up(final_fare_cents * PORT_FEE_PCT) + FLAT_PORT_PER_GUEST_CENTS" }

  - name: AddOn
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking this add-on attaches to" }
      - { name: guest_id, type: string, source: input, default: null, description: "FK -> Guest.id; the guest an EXCURSION is assigned to (required for EXCURSION, null for DINING)" }
      - { name: kind, type: enum, source: input, description: "DINING | EXCURSION" }
      - { name: title, type: string, source: input, description: "Add-on title (excursion name or dining package)" }
      - { name: price_cents, type: integer, source: input, description: "Add-on price in cents; must be >= 0" }
      - { name: window_start, type: datetime, source: input, default: null, description: "Excursion start (ISO 8601 UTC); required for EXCURSION, null for DINING" }
      - { name: window_end, type: datetime, source: input, default: null, description: "Excursion end (ISO 8601 UTC); required for EXCURSION, must be strictly after window_start" }
      - { name: status, type: enum, source: system, default: "RESERVED", description: "RESERVED | CANCELLED" }

  - name: DiningReservation
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking holding this seating" }
      - { name: venue_code, type: enum, source: input, description: "MAIN | SPECIALTY_A | SPECIALTY_B" }
      - { name: seating_start, type: datetime, source: input, description: "Seating start time (ISO 8601 UTC)" }
      - { name: party_size, type: integer, source: input, description: "Number of seats requested; must be >= 1 and <= booking.guest_count" }
      - { name: status, type: enum, source: system, default: "BOOKED", description: "BOOKED | CANCELLED" }

  - name: Payment
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking this payment applies to" }
      - { name: kind, type: enum, source: input, description: "DEPOSIT | FINAL | REFUND" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents; must be > 0" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | CAPTURED | FAILED | REFUNDED" }

  - name: Folio
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking this onboard folio belongs to (1:1)" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | SETTLED | VOID" }
      - { name: gratuity_mode, type: enum, source: system, default: "PROVISIONAL", description: "PROVISIONAL (auto-charge estimated at embark) | FINAL (recomputed at disembark/settle)" }
      - { name: charges_total_cents, type: integer, source: computed, default: 0, description: "Sum of FolioCharge.amount_cents for POSTED charges on this folio" }
      - { name: gratuity_total_cents, type: integer, source: computed, default: 0, description: "Auto-gratuity component: GRATUITY_PER_GUEST_PER_NIGHT_CENTS * guest_count * sailing.nights" }
      - { name: balance_due_cents, type: integer, source: computed, default: 0, description: "charges_total_cents + gratuity_total_cents minus folio payments applied" }

  - name: FolioCharge
    parent: Folio
    common_fields: true
    fields:
      - { name: folio_id, type: string, source: input, description: "FK -> Folio.id; the folio this charge posts to" }
      - { name: guest_id, type: string, source: input, default: null, description: "FK -> Guest.id; the guest who incurred the charge (null for booking-level charges)" }
      - { name: description, type: string, source: input, description: "Charge description" }
      - { name: amount_cents, type: integer, source: input, description: "Charge amount in cents; must be > 0" }
      - { name: status, type: enum, source: system, default: "POSTED", description: "POSTED | REVERSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Sailing
    initial_state: DRAFT
    terminal_states: [SAILED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /sailings/{id}/open"
        actor: RevenueManager
        preconditions:
          - "Sailing has at least one CabinCategory with at least one Cabin (ERR_NO_INVENTORY)"
        side_effects:
          - "status -> OPEN"
          - "increments Sailing.version by 1"

      - from: OPEN
        to: CLOSED
        trigger: "POST /sailings/{id}/close"
        actor: RevenueManager
        preconditions: []
        side_effects:
          - "status -> CLOSED (no new bookings may reach DEPOSIT_HELD; existing bookings continue)"
          - "increments Sailing.version by 1"

      - from: CLOSED
        to: OPEN
        trigger: "POST /sailings/{id}/open"
        actor: RevenueManager
        preconditions: []
        side_effects:
          - "status -> OPEN"
          - "increments Sailing.version by 1"
        note: "Re-open loop: a CLOSED sailing may be re-opened (cyclic shape on Sailing)."

      - from: OPEN
        to: SAILED
        trigger: "POST /sailings/{id}/depart"
        actor: PortAgent
        preconditions:
          - "current clock time >= embark_date (ERR_SAILING_NOT_DEPARTABLE)"
        side_effects:
          - "status -> SAILED"
          - "Each CONFIRMED Booking on this sailing transitions to EMBARKED (cascade), which opens its Folio in PROVISIONAL gratuity mode"
          - "increments Sailing.version by 1"

      - from: CLOSED
        to: SAILED
        trigger: "POST /sailings/{id}/depart"
        actor: PortAgent
        preconditions:
          - "current clock time >= embark_date (ERR_SAILING_NOT_DEPARTABLE)"
        side_effects:
          - "status -> SAILED"
          - "Each CONFIRMED Booking on this sailing transitions to EMBARKED (cascade)"
          - "increments Sailing.version by 1"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /sailings/{id}/cancel"
        actor: RevenueManager
        preconditions: []
        side_effects:
          - "status -> CANCELLED"
          - "increments Sailing.version by 1"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /sailings/{id}/cancel"
        actor: RevenueManager
        preconditions: []
        side_effects:
          - "status -> CANCELLED"
          - "CASCADE: every non-terminal Booking (status NOT IN {CANCELLED, EXPIRED, COMPLETED}) on this sailing transitions to CANCELLED with cancellation_mode=FCC and a full-value FCC credit (no penalty, sailing-cancelled goodwill); that booking-cancel itself releases its held/assigned Cabin and voids its Folio (depth-2 cascade)"
          - "increments Sailing.version by 1"

      - from: CLOSED
        to: CANCELLED
        trigger: "POST /sailings/{id}/cancel"
        actor: RevenueManager
        preconditions: []
        side_effects:
          - "status -> CANCELLED"
          - "CASCADE: every non-terminal Booking on this sailing transitions to CANCELLED with cancellation_mode=FCC and full-value FCC credit; releases cabins and voids folios"
          - "increments Sailing.version by 1"

  - entity: GroupBlock
    initial_state: NEGOTIATING
    terminal_states: [RELEASED]
    transitions:
      - from: NEGOTIATING
        to: NEGOTIATING
        trigger: "PATCH /group-blocks/{id}"
        actor: RevenueManager
        preconditions:
          - "block_size and group_discount_pct within bounds (ERR_INVALID_REQUEST)"
        side_effects:
          - "Updates block_size / group_discount_pct / release_cutoff_date"
          - "increments GroupBlock.version by 1"
        note: "Renegotiation self-loop while still NEGOTIATING (cyclic shape on GroupBlock)."

      - from: NEGOTIATING
        to: HELD
        trigger: "POST /group-blocks/{id}/hold"
        actor: RevenueManager
        preconditions:
          - "Sailing.status IN {OPEN, CLOSED} (ERR_SAILING_NOT_BOOKABLE)"
          - "CabinCategory.available_cabins >= block_size (ERR_INSUFFICIENT_INVENTORY)"
        side_effects:
          - "Selects block_size Cabin children of cabin_category_id whose status == AVAILABLE, ordered by Cabin.created_at ASC, and sets each to BLOCKED with group_block_id = this block"
          - "CabinCategory.available_cabins decreases by block_size; CabinCategory.blocked_cabins increases by block_size"
          - "GroupBlock.blocked_count = block_size; status -> HELD"

      - from: HELD
        to: NEGOTIATING
        trigger: "POST /group-blocks/{id}/recall"
        actor: RevenueManager
        preconditions:
          - "materialized_count == 0 (ERR_BLOCK_HAS_BOOKINGS)"
        side_effects:
          - "Every BLOCKED Cabin with this group_block_id returns to AVAILABLE and group_block_id cleared"
          - "CabinCategory.blocked_cabins decreases; available_cabins increases; GroupBlock.blocked_count = 0; status -> NEGOTIATING"
        note: "Revert edge back into NEGOTIATING for further renegotiation."

      - from: HELD
        to: PARTIALLY_MATERIALIZED
        trigger: "system (automatic when a Booking with group_block_id == this block reaches DEPOSIT_HELD)"
        actor: system
        preconditions: []
        side_effects:
          - "materialized_count increases by 1; status -> PARTIALLY_MATERIALIZED"

      - from: PARTIALLY_MATERIALIZED
        to: PARTIALLY_MATERIALIZED
        trigger: "system (additional Booking from this block reaches DEPOSIT_HELD, or a materialized Booking cancels)"
        actor: system
        preconditions: []
        side_effects:
          - "materialized_count increases or decreases by 1 (decrement caused by the Booking-cancel cascade)"

      - from: HELD
        to: RELEASED
        trigger: "POST /group-blocks/{id}/release OR system (automatic on /_clock/set_current_utc advancing past release_cutoff_date)"
        actor: RevenueManager | system
        preconditions:
          - "materialized_count == 0 (ERR_BLOCK_HAS_BOOKINGS) for the manual release; the automatic cutoff release only frees still-BLOCKED cabins"
        side_effects:
          - "Every still-BLOCKED Cabin with this group_block_id returns to AVAILABLE; CabinCategory counts restored; status -> RELEASED"

      - from: PARTIALLY_MATERIALIZED
        to: RELEASED
        trigger: "system (automatic on /_clock/set_current_utc advancing past release_cutoff_date)"
        actor: system
        preconditions: []
        side_effects:
          - "Every still-BLOCKED (unmaterialized) Cabin with this group_block_id returns to AVAILABLE; CabinCategory counts restored; already-materialized bookings keep their cabins; status -> RELEASED"

  - entity: Booking
    initial_state: QUOTE
    terminal_states: [COMPLETED, CANCELLED, EXPIRED]
    transitions:
      - from: QUOTE
        to: DEPOSIT_HELD
        trigger: "POST /bookings/{id}/hold-deposit"
        actor: GuestUser
        preconditions:
          - "Sailing.status == OPEN (ERR_SAILING_NOT_BOOKABLE)"
          - "Booking has at least one Guest (ERR_NO_GUESTS)"
          - "guest_count <= CabinCategory.max_occupancy (ERR_OCCUPANCY_EXCEEDED)"
          - "CabinCategory.available_cabins >= 1, OR the booking draws from a group_block_id whose status IN {HELD, PARTIALLY_MATERIALIZED} with a still-BLOCKED cabin (ERR_INSUFFICIENT_INVENTORY)"
          - "A captured DEPOSIT Payment with amount_cents == deposit_due_cents exists (ERR_DEPOSIT_NOT_SATISFIED)"
        side_effects:
          - "Holds one Cabin: from the group block's BLOCKED cabins (Cabin.created_at ASC) if group_block_id set, else an AVAILABLE cabin of the category (Cabin.created_at ASC); sets that Cabin.status -> HELD, Cabin.booking_id = this booking; Booking.cabin_id set"
          - "CabinCategory.available_cabins (or blocked_cabins for group draw) decreases by 1; held_cabins increases by 1"
          - "If group_block_id set: GroupBlock.materialized_count increases by 1 and GroupBlock auto-transitions HELD -> PARTIALLY_MATERIALIZED (cross-entity cascade)"
          - "status -> DEPOSIT_HELD"

      - from: DEPOSIT_HELD
        to: QUOTE
        trigger: "POST /bookings/{id}/revise"
        actor: GuestUser
        preconditions:
          - "Sailing.status == OPEN (ERR_SAILING_NOT_BOOKABLE)"
        side_effects:
          - "Releases the held Cabin back to its prior pool (AVAILABLE for individual, BLOCKED for group draw); Cabin.booking_id cleared; Booking.cabin_id cleared"
          - "If group_block_id set: GroupBlock.materialized_count decreases by 1"
          - "Recomputes fare_total_cents/deposit_due_cents after the guest roster change; status -> QUOTE"
        note: "Re-quote loop (cyclic shape on Booking): guest roster edits require dropping back to QUOTE."

      - from: DEPOSIT_HELD
        to: CONFIRMED
        trigger: "POST /bookings/{id}/confirm"
        actor: GuestUser
        preconditions:
          - "Sailing.status IN {OPEN, CLOSED} (ERR_SAILING_NOT_BOOKABLE)"
          - "amount_paid_cents >= booking_total_cents (ERR_BALANCE_OUTSTANDING)"
        side_effects:
          - "Cabin.status HELD -> ASSIGNED; CabinCategory.held_cabins decreases, assigned_cabins increases"
          - "Each Guest.final_fare_cents recomputed with the group discount if group_block_id set; fare_total_cents/tax_port_total_cents/booking_total_cents refreshed (final-fare variant)"
          - "status -> CONFIRMED"

      - from: CONFIRMED
        to: EMBARKED
        trigger: "system (cascade from Sailing depart) OR POST /bookings/{id}/embark"
        actor: PortAgent | system
        preconditions:
          - "Sailing.status == SAILED (ERR_SAILING_NOT_DEPARTED)"
        side_effects:
          - "Creates the Folio (status OPEN, gratuity_mode PROVISIONAL) and posts the provisional auto-gratuity = GRATUITY_PER_GUEST_PER_NIGHT_CENTS * guest_count * sailing.nights"
          - "status -> EMBARKED"

      - from: EMBARKED
        to: COMPLETED
        trigger: "POST /bookings/{id}/settle-folio"
        actor: PortAgent
        preconditions:
          - "Folio.balance_due_cents == 0 (ERR_FOLIO_OUTSTANDING)"
        side_effects:
          - "Folio.gratuity_mode -> FINAL and gratuity recomputed at disembark; Folio.status -> SETTLED"
          - "Cabin.status ASSIGNED -> AVAILABLE; CabinCategory.assigned_cabins decreases, available_cabins increases"
          - "status -> COMPLETED"

      - from: QUOTE
        to: EXPIRED
        trigger: "system (automatic on /_clock/set_current_utc advancing past Sailing.embark_date for a still-QUOTE booking)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> EXPIRED (no cabin was held, nothing to release)"

      - from: QUOTE
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: GuestUser | ReservationsAgent
        preconditions: []
        side_effects:
          - "cancellation_mode recorded; no penalty applies at QUOTE; any captured DEPOSIT payment is fully refunded (cash) or converted to FCC per requested mode"
          - "status -> CANCELLED"

      - from: DEPOSIT_HELD
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: GuestUser | ReservationsAgent
        preconditions: []
        side_effects:
          - "Computes refund per cancellation tier and requested mode (CASH or FCC) — see calculations.cancellation_refund"
          - "CASCADE depth-3: releases the held Cabin (HELD -> AVAILABLE or -> BLOCKED for group draw) -> that change restores CabinCategory.available_cabins/blocked_cabins -> if group draw, decrements GroupBlock.materialized_count (which may auto-revert PARTIALLY_MATERIALIZED toward HELD semantics)"
          - "Records cancel_refund_cents (CASH) or fcc_credit_cents (FCC); a CASH refund mints a REFUND Payment"
          - "status -> CANCELLED"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: GuestUser | ReservationsAgent
        preconditions: []
        side_effects:
          - "Computes refund per cancellation tier (days-before-sailing) and requested mode (CASH or FCC)"
          - "CASCADE depth-3: releases the ASSIGNED Cabin (-> AVAILABLE or -> BLOCKED for group draw) -> restores CabinCategory counts -> decrements GroupBlock.materialized_count if group draw"
          - "Records cancel_refund_cents or fcc_credit_cents; CASH refund mints a REFUND Payment"
          - "status -> CANCELLED"

  - entity: Payment
    initial_state: PENDING
    terminal_states: [CAPTURED, FAILED, REFUNDED]
    transitions:
      - from: PENDING
        to: CAPTURED
        trigger: "POST /payments/{id}/capture"
        actor: ReservationsAgent | GuestUser
        preconditions:
          - "Booking.status NOT IN {CANCELLED, EXPIRED} (ERR_BOOKING_INACTIVE)"
        side_effects:
          - "status -> CAPTURED; Booking.amount_paid_cents increases by amount_cents"

      - from: PENDING
        to: FAILED
        trigger: "POST /payments/{id}/fail"
        actor: ReservationsAgent
        preconditions: []
        side_effects:
          - "status -> FAILED"

      - from: CAPTURED
        to: REFUNDED
        trigger: "system (cascade from Booking cancel when CASH mode) OR POST /payments/{id}/refund"
        actor: ReservationsAgent | system
        preconditions:
          - "Payment.kind IN {DEPOSIT, FINAL} (ERR_INVALID_STATE)"
        side_effects:
          - "status -> REFUNDED; Booking.amount_paid_cents decreases by amount_cents"

  - entity: Folio
    initial_state: OPEN
    terminal_states: [SETTLED, VOID]
    transitions:
      - from: OPEN
        to: SETTLED
        trigger: "system (cascade from Booking settle-folio)"
        actor: system
        preconditions:
          - "balance_due_cents == 0 (ERR_FOLIO_OUTSTANDING)"
        side_effects:
          - "gratuity_mode -> FINAL; status -> SETTLED"

      - from: OPEN
        to: VOID
        trigger: "system (cascade from Booking cancel or Sailing cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "All POSTED FolioCharge children set to REVERSED; charges_total_cents -> 0; status -> VOID"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: booking-create-stale-sailing
    parent_entity: Sailing
    write_endpoint: "POST /bookings"
    occ_field: "expected_sailing_version"
    description: |
      Creating a Booking against a Sailing whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just opened, closed, or consumed inventory on the sailing (each
      of which legitimately advances the finite cabin pool's epoch via
      Sailing.version), so the current writer's view of available inventory is
      stale and its cabin-pool assumptions can no longer be trusted.
    error_id: ERR_STALE_SAILING_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: guest_fare_assessment
    trigger: "Guest create/delete; Booking revise; Booking confirm"
    algorithm: tiered_pricing
    formula: |
      # Occupancy positions assigned by Guest.created_at ASC within the booking.
      base = CabinCategory.base_fare_per_guest_cents
      for each guest at occupancy_index k (1-based):
        if k <= 2:
          base_fare_cents = base
        else:                       # k in {3, 4}
          base_fare_cents = half_up(base * THIRD_FOURTH_PCT)
      # PROVISIONAL variant (Booking.status == QUOTE or DEPOSIT_HELD):
      #   final_fare_cents = base_fare_cents          (rack fare, no group discount)
      # FINAL variant (Booking.status == CONFIRMED and group_block_id set):
      #   final_fare_cents = half_up(base_fare_cents * (1 - GroupBlock.group_discount_pct))
      tax_port_cents = half_up(final_fare_cents * PORT_FEE_PCT) + FLAT_PORT_PER_GUEST_CENTS
    input_set: "All Guest children of the booking, ordered by created_at ASC for occupancy_index assignment"
    constants:
      THIRD_FOURTH_PCT: 0.55
      PORT_FEE_PCT: 0.115
      FLAT_PORT_PER_GUEST_CENTS: 8900
    precision: "integer cents, half_up at each per-guest rounding step"
    variants:
      - name: provisional_rack_fare
        when: "Booking.status IN {QUOTE, DEPOSIT_HELD}"
        difference: "final_fare_cents = base_fare_cents (no group discount applied yet)"
      - name: final_group_fare
        when: "Booking.status == CONFIRMED AND group_block_id is set"
        difference: "final_fare_cents = half_up(base_fare_cents * (1 - group_discount_pct)); diverges from provisional for the same guest roster"

  - name: booking_total
    trigger: "any guest_fare_assessment recompute (create/delete guest, revise, confirm)"
    algorithm: aggregation
    formula: |
      fare_total_cents = sum over guests of final_fare_cents
      # taxes: ROUND PER GUEST then SUM (pinned order; sum-then-round is forbidden)
      tax_port_total_cents = sum over guests of tax_port_cents
      booking_total_cents = fare_total_cents + tax_port_total_cents
    input_set: "All Guest children of the booking (no status filter; guests are not independently cancellable)"
    constants: {}
    precision: "integer cents; the per-guest rounding inside guest_fare_assessment is summed without re-rounding"

  - name: deposit_schedule
    trigger: "booking_total recompute"
    algorithm: threshold
    formula: |
      pct_component = half_up(booking_total_cents * DEPOSIT_PCT)
      floor_component = DEPOSIT_MIN_PER_GUEST_CENTS * guest_count
      deposit_due_cents = max(pct_component, floor_component)
      final_due_cents = booking_total_cents - deposit_due_cents
    input_set: "Single booking"
    constants:
      DEPOSIT_PCT: 0.20
      DEPOSIT_MIN_PER_GUEST_CENTS: 25000
    precision: "integer cents, half_up on the percentage component"

  - name: cancellation_refund
    trigger: "POST /bookings/{id}/cancel from DEPOSIT_HELD or CONFIRMED"
    algorithm: tiered_pricing
    formula: |
      days_before = floor((Sailing.embark_date - current_clock_utc) / 1 day)   # whole days, truncated
      penalty_pct =
        0.00 if days_before >= 90
        0.25 if 60 <= days_before < 90
        0.50 if 30 <= days_before < 60
        0.75 if 15 <= days_before < 30
        1.00 if days_before < 15
      penalty_cents = half_up(booking_total_cents * penalty_pct)
      # CASH variant:
      #   admin_fee = CANCEL_ADMIN_FEE_CENTS if penalty_pct == 0.0 else 0
      #   cancel_refund_cents = amount_paid_cents - penalty_cents - admin_fee   (floored at 0)
      #   fcc_credit_cents = 0
      # FCC variant:
      #   fcc_penalty_cents = half_up(penalty_cents * FCC_PENALTY_FACTOR)
      #   fcc_credit_cents = amount_paid_cents - fcc_penalty_cents              (floored at 0)
      #   cancel_refund_cents = 0; no admin fee
    input_set: "Single booking + its Sailing.embark_date + clock"
    constants:
      CANCEL_ADMIN_FEE_CENTS: 5000
      FCC_PENALTY_FACTOR: 0.50
    precision: "integer cents, half_up; results floored at 0"
    variants:
      - name: cash_refund
        when: "cancel request body cancellation_mode == CASH"
        difference: "Cash back to the payer minus full tier penalty and (only at 0% tier) a flat admin fee; no FCC minted"
      - name: fcc_credit
        when: "cancel request body cancellation_mode == FCC"
        difference: "Future cruise credit equal to amount paid minus HALF the tier penalty and NO admin fee; diverges from cash for identical inputs"

  - name: folio_gratuity
    trigger: "Booking embark (PROVISIONAL); Booking settle-folio (FINAL)"
    algorithm: aggregation
    formula: |
      gratuity_total_cents = GRATUITY_PER_GUEST_PER_NIGHT_CENTS * guest_count * Sailing.nights
      charges_total_cents = sum over FolioCharge children where status == POSTED of amount_cents
      balance_due_cents = charges_total_cents + gratuity_total_cents - folio_payments_applied_cents
    input_set: "Folio + its booking's Guest children (for guest_count) + Sailing.nights + POSTED FolioCharge children"
    constants:
      GRATUITY_PER_GUEST_PER_NIGHT_CENTS: 1800
    precision: "integer cents"
    variants:
      - name: provisional_gratuity
        when: "Folio.gratuity_mode == PROVISIONAL (posted at embark)"
        difference: "Estimated using guest_count at embark time"
      - name: final_gratuity
        when: "Folio.gratuity_mode == FINAL (recomputed at settle)"
        difference: "Recomputed against the final guest_count and nights; same formula, re-evaluated at disembark"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every resource id in the path and FK body fields exists (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_referential
    check: "GuestUser acting on a Booking must be its owner (Booking.owner_user_id == X-User-ID)"
    error_id: ERR_NOT_BOOKING_OWNER
    http_status: 403
    applies_to: "GuestUser-initiated Booking write endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "Cross-entity gating: Booking transitions require the parent Sailing to be in the required status (OPEN to hold deposit; OPEN/CLOSED to confirm; SAILED to embark); Folio charge posting requires the Booking to be EMBARKED"
    error_id: ERR_SAILING_NOT_BOOKABLE
    http_status: 409
    applies_to: "POST /bookings/{id}/hold-deposit, /confirm, /revise, POST /folios/{id}/charges"

  - priority: 7
    category: business_constraint
    check: "guest_count must not exceed CabinCategory.max_occupancy; DiningReservation.party_size must not exceed booking.guest_count; deck must be within category range; cabin_number/category code uniqueness"
    error_id: ERR_OCCUPANCY_EXCEEDED
    http_status: 422
    applies_to: "POST /bookings/{id}/hold-deposit, POST /guests, POST /dining-reservations, POST /cabins, POST /cabin-categories"

  - priority: 8
    category: business_temporal
    check: "An EXCURSION AddOn must not overlap, on the same Guest, another RESERVED EXCURSION using half-open intervals [window_start, window_end) — touching endpoints do NOT conflict; a DiningReservation must not collide with another BOOKED seating on the same Booking within DINING_TURNOVER_MINUTES (closed interval expanded by the buffer — touching within buffer DOES conflict)"
    error_id: ERR_TIME_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /add-ons, POST /dining-reservations"

  - priority: 9
    category: business_safety
    check: "Finite cabin pool: a deposit hold or group-block hold requires sufficient inventory in the category (available_cabins for individual draw, BLOCKED cabins for group draw)"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /bookings/{id}/hold-deposit, POST /group-blocks/{id}/hold"

  - priority: 10
    category: business_fiscal
    check: "Deposit/balance gates: hold-deposit requires a captured DEPOSIT payment equal to deposit_due_cents; confirm requires amount_paid_cents >= booking_total_cents; settle-folio requires Folio.balance_due_cents == 0"
    error_id: ERR_BALANCE_OUTSTANDING
    http_status: 402
    applies_to: "POST /bookings/{id}/hold-deposit, /confirm, /settle-folio"

  - priority: 11
    category: business_referential
    check: "OCC: POST /bookings requires expected_sailing_version to equal the current Sailing.version"
    error_id: ERR_STALE_SAILING_VERSION
    http_status: 412
    applies_to: "POST /bookings"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Clock (test-driving) ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the simulated current UTC clock; advancing it fires time-gated transitions (QUOTE->EXPIRED for past-embark bookings, GroupBlock release past cutoff)"
    roles: [RevenueManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "current_clock_utc = to_iso8601"
      - "Each still-QUOTE Booking whose Sailing.embark_date <= clock -> EXPIRED"
      - "Each HELD/PARTIALLY_MATERIALIZED GroupBlock whose release_cutoff_date < clock -> RELEASED (frees still-BLOCKED cabins)"

  # ---------- Sailing ----------
  - method: POST
    path: "/sailings"
    description: "Create a Sailing in DRAFT"
    roles: [RevenueManager]
    code: 201
    input: [ship_name, itinerary_code, embark_date, disembark_date, nights]
    output: Sailing
    side_effects: ["status=DRAFT; version=1; total_cabins=0; available_cabins=0"]

  - method: GET
    path: "/sailings/{id}"
    description: "Get a Sailing"
    roles: [RevenueManager, ReservationsAgent, PortAgent, GuestUser]
    code: 200
    input: []
    output: Sailing
    side_effects: []

  - method: GET
    path: "/sailings"
    description: "List Sailings"
    roles: [RevenueManager, ReservationsAgent, PortAgent, GuestUser]
    code: 200
    input: ["status?", "itinerary_code?"]
    output: "Sailing[]"
    side_effects: []

  - method: POST
    path: "/sailings/{id}/open"
    description: "Open (or re-open) a sailing for booking"
    roles: [RevenueManager]
    code: 200
    input: []
    output: Sailing
    side_effects: ["status -> OPEN; increments Sailing.version by 1"]

  - method: POST
    path: "/sailings/{id}/close"
    description: "Close a sailing to new deposit holds"
    roles: [RevenueManager]
    code: 200
    input: []
    output: Sailing
    side_effects: ["status -> CLOSED; increments Sailing.version by 1"]

  - method: POST
    path: "/sailings/{id}/depart"
    description: "Depart the sailing (embark confirmed bookings)"
    roles: [PortAgent]
    code: 200
    input: []
    output: Sailing
    side_effects:
      - "status -> SAILED; increments Sailing.version by 1"
      - "Cascade: each CONFIRMED Booking -> EMBARKED (creates Folio, posts provisional gratuity)"

  - method: POST
    path: "/sailings/{id}/cancel"
    description: "Cancel the sailing"
    roles: [RevenueManager]
    code: 200
    input: []
    output: Sailing
    side_effects:
      - "status -> CANCELLED; increments Sailing.version by 1"
      - "Cascade: each non-terminal Booking -> CANCELLED (mode FCC, full-value credit), releasing cabins and voiding folios"

  # ---------- CabinCategory ----------
  - method: POST
    path: "/cabin-categories"
    description: "Create a CabinCategory on a sailing"
    roles: [RevenueManager]
    code: 201
    input: [sailing_id, code, deck_low, deck_high, base_fare_per_guest_cents, max_occupancy]
    output: CabinCategory
    side_effects: ["total_cabins=0; available_cabins=0; ERR_DUPLICATE_CATEGORY_CODE if code already used on the sailing"]

  - method: GET
    path: "/cabin-categories/{id}"
    description: "Get a CabinCategory"
    roles: [RevenueManager, ReservationsAgent, PortAgent, GuestUser]
    code: 200
    input: []
    output: CabinCategory
    side_effects: []

  - method: GET
    path: "/cabin-categories"
    description: "List CabinCategories, filterable by sailing"
    roles: [RevenueManager, ReservationsAgent, PortAgent, GuestUser]
    code: 200
    input: ["sailing_id?", "code?"]
    output: "CabinCategory[]"
    side_effects: []

  # ---------- Cabin ----------
  - method: POST
    path: "/cabins"
    description: "Create a Cabin in a category"
    roles: [RevenueManager]
    code: 201
    input: [cabin_category_id, cabin_number, deck]
    output: Cabin
    side_effects:
      - "status=AVAILABLE; sailing_id denormalized from category"
      - "CabinCategory.total_cabins/available_cabins increment; Sailing.total_cabins/available_cabins increment"
      - "ERR_DUPLICATE_CABIN_NUMBER if cabin_number already used on the sailing; ERR_DECK_OUT_OF_RANGE if deck outside category range"

  - method: GET
    path: "/cabins/{id}"
    description: "Get a Cabin"
    roles: [RevenueManager, ReservationsAgent, PortAgent, GuestUser]
    code: 200
    input: []
    output: Cabin
    side_effects: []

  - method: GET
    path: "/cabins"
    description: "List Cabins, filterable by category, sailing, group block, booking, or status"
    roles: [RevenueManager, ReservationsAgent, PortAgent, GuestUser]
    code: 200
    input: ["cabin_category_id?", "sailing_id?", "group_block_id?", "booking_id?", "status?"]
    output: "Cabin[]"
    side_effects: []

  # ---------- GroupBlock ----------
  - method: POST
    path: "/group-blocks"
    description: "Create a GroupBlock in NEGOTIATING"
    roles: [RevenueManager]
    code: 201
    input: [sailing_id, group_name, cabin_category_id, block_size, "group_discount_pct?", release_cutoff_date]
    output: GroupBlock
    side_effects: ["status=NEGOTIATING; blocked_count=0; materialized_count=0"]

  - method: GET
    path: "/group-blocks/{id}"
    description: "Get a GroupBlock"
    roles: [RevenueManager, ReservationsAgent, GuestUser]
    code: 200
    input: []
    output: GroupBlock
    side_effects: []

  - method: GET
    path: "/group-blocks"
    description: "List GroupBlocks, filterable by sailing or cabin category"
    roles: [RevenueManager, ReservationsAgent, GuestUser]
    code: 200
    input: ["sailing_id?", "cabin_category_id?", "status?"]
    output: "GroupBlock[]"
    side_effects: []

  - method: PATCH
    path: "/group-blocks/{id}"
    description: "Renegotiate block_size / discount / cutoff while NEGOTIATING"
    roles: [RevenueManager]
    code: 200
    input: ["block_size?", "group_discount_pct?", "release_cutoff_date?"]
    output: GroupBlock
    side_effects: ["Updates fields; increments GroupBlock.version by 1; ERR_INVALID_STATE if not NEGOTIATING"]

  - method: POST
    path: "/group-blocks/{id}/hold"
    description: "Hold cabins for the block (NEGOTIATING -> HELD)"
    roles: [RevenueManager]
    code: 200
    input: []
    output: GroupBlock
    side_effects:
      - "Blocks block_size AVAILABLE cabins (Cabin.created_at ASC) -> BLOCKED; category available_cabins down, blocked_cabins up"
      - "status -> HELD; blocked_count = block_size"

  - method: POST
    path: "/group-blocks/{id}/recall"
    description: "Recall a held block back to NEGOTIATING"
    roles: [RevenueManager]
    code: 200
    input: []
    output: GroupBlock
    side_effects: ["Frees BLOCKED cabins -> AVAILABLE; status -> NEGOTIATING; ERR_BLOCK_HAS_BOOKINGS if materialized_count > 0"]

  - method: POST
    path: "/group-blocks/{id}/release"
    description: "Permanently release the block"
    roles: [RevenueManager]
    code: 200
    input: []
    output: GroupBlock
    side_effects: ["Frees still-BLOCKED cabins -> AVAILABLE; status -> RELEASED; ERR_BLOCK_HAS_BOOKINGS if materialized_count > 0"]

  # ---------- Booking ----------
  - method: POST
    path: "/bookings"
    description: "Create a Booking in QUOTE (OCC-guarded against the sailing inventory epoch)"
    roles: [GuestUser, ReservationsAgent]
    code: 201
    input: [sailing_id, cabin_category_id, owner_user_id, expected_sailing_version, "group_block_id?"]
    output: Booking
    side_effects:
      - "status=QUOTE; cabin_id=null; totals=0"
      - "ERR_STALE_SAILING_VERSION (412) if expected_sailing_version != Sailing.version"
      - "ERR_GROUP_BLOCK_NOT_HELD if group_block_id set and block status NOT IN {HELD, PARTIALLY_MATERIALIZED}"

  - method: GET
    path: "/bookings/{id}"
    description: "Get a Booking"
    roles: [RevenueManager, ReservationsAgent, PortAgent, GuestUser]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/bookings"
    description: "List Bookings, filterable by sailing, category, group block, cabin, or owner"
    roles: [RevenueManager, ReservationsAgent, PortAgent, GuestUser]
    code: 200
    input: ["sailing_id?", "cabin_category_id?", "group_block_id?", "cabin_id?", "owner_user_id?", "status?"]
    output: "Booking[]"
    side_effects: []

  - method: POST
    path: "/bookings/{id}/hold-deposit"
    description: "Move QUOTE -> DEPOSIT_HELD (holds a cabin)"
    roles: [GuestUser, ReservationsAgent]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "Holds a cabin; category counts update; group materialized_count++ and HELD -> PARTIALLY_MATERIALIZED if group draw"
      - "status -> DEPOSIT_HELD"

  - method: POST
    path: "/bookings/{id}/revise"
    description: "Drop DEPOSIT_HELD -> QUOTE to edit the guest roster"
    roles: [GuestUser, ReservationsAgent]
    code: 200
    input: []
    output: Booking
    side_effects: ["Releases held cabin; group materialized_count--; recomputes totals; status -> QUOTE"]

  - method: POST
    path: "/bookings/{id}/confirm"
    description: "Move DEPOSIT_HELD -> CONFIRMED (assigns cabin, applies final group fare)"
    roles: [GuestUser, ReservationsAgent]
    code: 200
    input: []
    output: Booking
    side_effects: ["Cabin HELD -> ASSIGNED; final-fare variant recompute; status -> CONFIRMED"]

  - method: POST
    path: "/bookings/{id}/embark"
    description: "Move CONFIRMED -> EMBARKED (opens folio, posts provisional gratuity)"
    roles: [PortAgent]
    code: 200
    input: []
    output: Booking
    side_effects: ["Creates Folio; posts provisional gratuity; status -> EMBARKED; ERR_SAILING_NOT_DEPARTED if sailing not SAILED"]

  - method: POST
    path: "/bookings/{id}/settle-folio"
    description: "Move EMBARKED -> COMPLETED (settles folio, finalizes gratuity, frees cabin)"
    roles: [PortAgent]
    code: 200
    input: []
    output: Booking
    side_effects: ["Folio -> SETTLED (gratuity FINAL); cabin ASSIGNED -> AVAILABLE; status -> COMPLETED; ERR_FOLIO_OUTSTANDING if balance_due_cents != 0"]

  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Cancel a booking with CASH or FCC settlement"
    roles: [GuestUser, ReservationsAgent]
    code: 200
    input: [cancellation_mode]
    output: Booking
    side_effects:
      - "Computes refund per cancellation tier and mode"
      - "Cascade: releases held/assigned cabin -> restores category counts -> decrements group materialized_count; voids folio if present"
      - "Records cancel_refund_cents (CASH, mints REFUND Payment) or fcc_credit_cents (FCC); status -> CANCELLED"

  # ---------- Guest ----------
  - method: POST
    path: "/guests"
    description: "Add a Guest to a QUOTE booking"
    roles: [GuestUser, ReservationsAgent]
    code: 201
    input: [booking_id, full_name, age]
    output: Guest
    side_effects:
      - "occupancy_index assigned by created_at ASC; guest_fare_assessment + booking_total + deposit_schedule recompute"
      - "ERR_INVALID_STATE if booking not in QUOTE; ERR_OCCUPANCY_EXCEEDED if guest_count would exceed category max_occupancy"

  - method: DELETE
    path: "/guests/{id}"
    description: "Remove a Guest from a QUOTE booking"
    roles: [GuestUser, ReservationsAgent]
    code: 200
    input: []
    output: Guest
    side_effects: ["Re-indexes remaining guests; recomputes totals; ERR_INVALID_STATE if booking not in QUOTE"]

  - method: GET
    path: "/guests/{id}"
    description: "Get a Guest"
    roles: [RevenueManager, ReservationsAgent, PortAgent, GuestUser]
    code: 200
    input: []
    output: Guest
    side_effects: []

  - method: GET
    path: "/guests"
    description: "List Guests, filterable by booking"
    roles: [RevenueManager, ReservationsAgent, PortAgent, GuestUser]
    code: 200
    input: ["booking_id?"]
    output: "Guest[]"
    side_effects: []

  # ---------- AddOn ----------
  - method: POST
    path: "/add-ons"
    description: "Attach a DINING or EXCURSION add-on to a booking"
    roles: [GuestUser, ReservationsAgent]
    code: 201
    input: [booking_id, kind, title, price_cents, "guest_id?", "window_start?", "window_end?"]
    output: AddOn
    side_effects:
      - "status=RESERVED"
      - "ERR_TIME_WINDOW_CONFLICT if an EXCURSION overlaps another RESERVED EXCURSION on the same guest (half-open intervals)"
      - "ERR_INVALID_REQUEST if EXCURSION missing guest_id/window, or DINING supplies them"

  - method: GET
    path: "/add-ons/{id}"
    description: "Get an AddOn"
    roles: [RevenueManager, ReservationsAgent, PortAgent, GuestUser]
    code: 200
    input: []
    output: AddOn
    side_effects: []

  - method: GET
    path: "/add-ons"
    description: "List AddOns, filterable by booking or guest"
    roles: [RevenueManager, ReservationsAgent, PortAgent, GuestUser]
    code: 200
    input: ["booking_id?", "guest_id?", "kind?", "status?"]
    output: "AddOn[]"
    side_effects: []

  - method: POST
    path: "/add-ons/{id}/cancel"
    description: "Cancel an add-on"
    roles: [GuestUser, ReservationsAgent]
    code: 200
    input: []
    output: AddOn
    side_effects: ["status -> CANCELLED; ERR_INVALID_STATE if already CANCELLED"]

  # ---------- DiningReservation ----------
  - method: POST
    path: "/dining-reservations"
    description: "Book a dining seating for a booking"
    roles: [GuestUser, ReservationsAgent]
    code: 201
    input: [booking_id, venue_code, seating_start, party_size]
    output: DiningReservation
    side_effects:
      - "status=BOOKED"
      - "ERR_TIME_WINDOW_CONFLICT if seating collides with another BOOKED seating on the same booking within DINING_TURNOVER_MINUTES (buffer-expanded closed interval)"
      - "ERR_OCCUPANCY_EXCEEDED if party_size > booking.guest_count"

  - method: GET
    path: "/dining-reservations/{id}"
    description: "Get a DiningReservation"
    roles: [RevenueManager, ReservationsAgent, PortAgent, GuestUser]
    code: 200
    input: []
    output: DiningReservation
    side_effects: []

  - method: GET
    path: "/dining-reservations"
    description: "List DiningReservations, filterable by booking"
    roles: [RevenueManager, ReservationsAgent, PortAgent, GuestUser]
    code: 200
    input: ["booking_id?", "venue_code?", "status?"]
    output: "DiningReservation[]"
    side_effects: []

  - method: POST
    path: "/dining-reservations/{id}/cancel"
    description: "Cancel a dining seating"
    roles: [GuestUser, ReservationsAgent]
    code: 200
    input: []
    output: DiningReservation
    side_effects: ["status -> CANCELLED; ERR_INVALID_STATE if already CANCELLED"]

  # ---------- Payment ----------
  - method: POST
    path: "/payments"
    description: "Create a DEPOSIT, FINAL, or REFUND payment in PENDING"
    roles: [GuestUser, ReservationsAgent]
    code: 201
    input: [booking_id, kind, amount_cents]
    output: Payment
    side_effects: ["status=PENDING; ERR_BOOKING_INACTIVE if booking CANCELLED/EXPIRED"]

  - method: GET
    path: "/payments/{id}"
    description: "Get a Payment"
    roles: [RevenueManager, ReservationsAgent, PortAgent, GuestUser]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/payments"
    description: "List Payments, filterable by booking"
    roles: [RevenueManager, ReservationsAgent, PortAgent, GuestUser]
    code: 200
    input: ["booking_id?", "kind?", "status?"]
    output: "Payment[]"
    side_effects: []

  - method: POST
    path: "/payments/{id}/capture"
    description: "Capture a pending payment"
    roles: [GuestUser, ReservationsAgent]
    code: 200
    input: []
    output: Payment
    side_effects: ["status -> CAPTURED; Booking.amount_paid_cents += amount_cents"]

  - method: POST
    path: "/payments/{id}/fail"
    description: "Mark a pending payment failed"
    roles: [ReservationsAgent]
    code: 200
    input: []
    output: Payment
    side_effects: ["status -> FAILED"]

  - method: POST
    path: "/payments/{id}/refund"
    description: "Refund a captured DEPOSIT/FINAL payment"
    roles: [ReservationsAgent]
    code: 200
    input: []
    output: Payment
    side_effects: ["status -> REFUNDED; Booking.amount_paid_cents -= amount_cents; ERR_INVALID_STATE if not a captured DEPOSIT/FINAL"]

  # ---------- Folio ----------
  - method: GET
    path: "/folios/{id}"
    description: "Get a Folio"
    roles: [RevenueManager, ReservationsAgent, PortAgent, GuestUser]
    code: 200
    input: []
    output: Folio
    side_effects: []

  - method: GET
    path: "/folios"
    description: "List Folios, filterable by booking (1:1, returns 0-1)"
    roles: [RevenueManager, ReservationsAgent, PortAgent, GuestUser]
    code: 200
    input: ["booking_id?", "status?"]
    output: "Folio[]"
    side_effects: []

  - method: POST
    path: "/folios/{id}/charges"
    description: "Post an onboard charge to a folio"
    roles: [PortAgent]
    code: 201
    input: [description, amount_cents, "guest_id?"]
    output: FolioCharge
    side_effects:
      - "status=POSTED; folio charges_total_cents and balance_due_cents recompute"
      - "ERR_INVALID_STATE if folio not OPEN; ERR_SAILING_NOT_BOOKABLE if owning booking not EMBARKED"

  # ---------- FolioCharge ----------
  - method: GET
    path: "/folio-charges/{id}"
    description: "Get a FolioCharge"
    roles: [RevenueManager, ReservationsAgent, PortAgent, GuestUser]
    code: 200
    input: []
    output: FolioCharge
    side_effects: []

  - method: GET
    path: "/folio-charges"
    description: "List FolioCharges, filterable by folio or guest"
    roles: [RevenueManager, ReservationsAgent, PortAgent, GuestUser]
    code: 200
    input: ["folio_id?", "guest_id?", "status?"]
    output: "FolioCharge[]"
    side_effects: []

  - method: POST
    path: "/folio-charges/{id}/reverse"
    description: "Reverse a posted folio charge"
    roles: [PortAgent]
    code: 200
    input: []
    output: FolioCharge
    side_effects: ["status -> REVERSED; folio totals recompute; ERR_INVALID_STATE if already REVERSED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth / existence / request ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource id (path or FK body field) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, bad enum, negative/zero amount, or EXCURSION/DINING field mismatch" }
  - { id: ERR_NOT_BOOKING_OWNER, http: 403, condition: "GuestUser acting on a booking they do not own (owner_user_id != X-User-ID)" }

  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource is in a state from which the requested transition is not allowed" }

  # --- Sailing / inventory gating ---
  - { id: ERR_SAILING_NOT_BOOKABLE, http: 409, condition: "Sailing not in the required status for the booking transition or folio-charge posting" }
  - { id: ERR_SAILING_NOT_DEPARTABLE, http: 409, condition: "Depart attempted before the clock reaches embark_date" }
  - { id: ERR_SAILING_NOT_DEPARTED, http: 409, condition: "Embark attempted while the sailing is not SAILED" }
  - { id: ERR_NO_INVENTORY, http: 409, condition: "Open attempted on a sailing with no cabin category or no cabin" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "Not enough cabins to satisfy a deposit hold or group-block hold" }

  # --- Booking lifecycle ---
  - { id: ERR_NO_GUESTS, http: 409, condition: "Deposit hold attempted on a booking with zero guests" }
  - { id: ERR_OCCUPANCY_EXCEEDED, http: 422, condition: "Guest count exceeds category max_occupancy, or dining party_size exceeds guest_count" }
  - { id: ERR_DEPOSIT_NOT_SATISFIED, http: 402, condition: "Deposit hold attempted without a captured DEPOSIT payment equal to deposit_due_cents" }
  - { id: ERR_BALANCE_OUTSTANDING, http: 402, condition: "Confirm attempted with amount_paid_cents < booking_total_cents" }
  - { id: ERR_BOOKING_INACTIVE, http: 409, condition: "Payment created or captured against a CANCELLED/EXPIRED booking" }

  # --- Group block ---
  - { id: ERR_GROUP_BLOCK_NOT_HELD, http: 409, condition: "Booking references a group block not in HELD/PARTIALLY_MATERIALIZED" }
  - { id: ERR_BLOCK_HAS_BOOKINGS, http: 409, condition: "Recall/release attempted on a block with materialized bookings" }

  # --- Temporal ---
  - { id: ERR_TIME_WINDOW_CONFLICT, http: 409, condition: "Excursion overlaps another excursion on the same guest, or dining seating collides within the turnover buffer" }

  # --- Folio ---
  - { id: ERR_FOLIO_OUTSTANDING, http: 402, condition: "Settle attempted while Folio.balance_due_cents != 0" }

  # --- Uniqueness / range ---
  - { id: ERR_DUPLICATE_CATEGORY_CODE, http: 409, condition: "Cabin category code already used on the sailing" }
  - { id: ERR_DUPLICATE_CABIN_NUMBER, http: 409, condition: "Cabin number already used on the sailing" }
  - { id: ERR_DECK_OUT_OF_RANGE, http: 422, condition: "Cabin deck outside the category deck_low..deck_high range" }

  # --- Concurrency ---
  - { id: ERR_STALE_SAILING_VERSION, http: 412, condition: "expected_sailing_version does not match the current Sailing.version on booking creation" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RevenueManager
    description: "Manages sailings, inventory (cabin categories/cabins), and group blocks; sets the simulated clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /sailings — Create sailing"
      - "POST /sailings/{id}/open — Open/re-open sailing"
      - "POST /sailings/{id}/close — Close sailing"
      - "POST /sailings/{id}/cancel — Cancel sailing"
      - "POST /cabin-categories — Create cabin category"
      - "POST /cabins — Create cabin"
      - "POST /group-blocks — Create group block"
      - "PATCH /group-blocks/{id} — Renegotiate group block"
      - "POST /group-blocks/{id}/hold — Hold group block"
      - "POST /group-blocks/{id}/recall — Recall group block"
      - "POST /group-blocks/{id}/release — Release group block"
      - "POST /_clock/set_current_utc — Set simulated clock"
    shared_operations:
      - "GET endpoints (read sailings, categories, cabins, group blocks, bookings, guests, add-ons, dining, payments, folios, charges)"

  - name: ReservationsAgent
    description: "Agent acting on behalf of guests: creates/edits/cancels bookings, guests, add-ons, dining, and payments; processes refunds"
    identity: "opaque"
    exclusive_operations:
      - "POST /payments/{id}/fail — Fail a payment"
      - "POST /payments/{id}/refund — Refund a captured payment"
    shared_operations:
      - "POST /bookings, /bookings/{id}/hold-deposit, /revise, /confirm, /cancel — Booking lifecycle (shared with GuestUser)"
      - "POST /guests, DELETE /guests/{id} — Guest roster (shared with GuestUser)"
      - "POST /add-ons, /add-ons/{id}/cancel — Add-ons (shared with GuestUser)"
      - "POST /dining-reservations, /dining-reservations/{id}/cancel — Dining (shared with GuestUser)"
      - "POST /payments, /payments/{id}/capture — Payments (shared with GuestUser)"
      - "GET endpoints — Reads"

  - name: GuestUser
    description: "End customer who owns and manages their own bookings; X-User-ID equals Booking.owner_user_id"
    identity: "entity_backed:Booking"
    exclusive_operations: []
    shared_operations:
      - "POST /bookings, /bookings/{id}/hold-deposit, /revise, /confirm, /cancel — own bookings only (ownership enforced via owner_user_id)"
      - "POST /guests, DELETE /guests/{id} — own booking roster"
      - "POST /add-ons, /add-ons/{id}/cancel — own booking add-ons"
      - "POST /dining-reservations, /dining-reservations/{id}/cancel — own booking dining"
      - "POST /payments, /payments/{id}/capture — own booking payments"
      - "GET endpoints — Reads"

  - name: PortAgent
    description: "Onboard/terminal operator: departs sailings, embarks/settles bookings, posts and reverses folio charges"
    identity: "opaque"
    exclusive_operations:
      - "POST /sailings/{id}/depart — Depart sailing"
      - "POST /bookings/{id}/embark — Embark booking"
      - "POST /bookings/{id}/settle-folio — Settle folio / complete booking"
      - "POST /folios/{id}/charges — Post folio charge"
      - "POST /folio-charges/{id}/reverse — Reverse folio charge"
    shared_operations:
      - "GET endpoints — Reads"

  - name: system
    description: "Automation actor for cascaded transitions (sailing-cancel propagation, clock-driven expiry/release, embark cascade)"
    identity: "opaque"
    exclusive_operations: []
    shared_operations: []
