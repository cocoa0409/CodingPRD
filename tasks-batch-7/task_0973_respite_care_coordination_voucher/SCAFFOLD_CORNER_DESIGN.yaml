        grounds: ["validations[priority=5]", "errors[ERR_BOOKING_NOT_FOUND]"]
        distinguishing_aspect: "Cancelling a non-existent booking id yields ERR_BOOKING_NOT_FOUND (404) — existence (priority 5) is evaluated before any state-machine check."
