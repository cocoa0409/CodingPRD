          assert:
            - "trigger returns 422 ERR_ALTERNATE_SUPPLY_INSUFFICIENT"
            - "WaterSupplySystem.${sys_id}.alternate_verified remains false"

      - name: appeal_window_expired_returns_error
        claim_type: temporal_validation
        grounds: ["validations[priority=40]", calculations.schedule_windows]
        distinguishing_aspect: "An appeal filed more than 90 days after published_at (clock moved to 2026-12-01 vs published 2026-09-01) is rejected 422."
        test_recipe:
