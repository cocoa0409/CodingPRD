          meeting sits at 2026-09-01T05:00:00Z, one hour inside the blackout that only came into existence
          when the round was created). Only the 409 ERR_CASE_POSTURE_BLOCKED may be returned - an
          implementation that analyses the message before the parent case answers 422.
