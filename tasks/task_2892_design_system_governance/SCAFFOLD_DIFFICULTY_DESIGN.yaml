# Scaffold Difficulty Design (§1.8) — Test Targeting Index
# Task 2892 Design System Governance. Every instance grounds in SCAFFOLD.yaml §1.1–§1.7.
# Logical clock default: 2026-08-01T00:00:00.000Z (pinned explicitly in every chain).

scaffold_difficulty_design:

  # =========================================================================
  # RULE 1 — dual_variant_calc
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: a11y_governance_sweep_scores_below_latest_evidence
        grounds:
          - calculations.a11y_conformance_score
          - entities.PlatformImplementation.fields.conformance_score
          - entities.Component.fields.governance_conformance_score
          - entities.Component.fields.conformance_baseline_at
          - entities.AccessibilityAudit.fields.audit_sequence
          - entities.AccessibilityAudit.fields.defect_load
        distinguishing_aspect: |
          The two variants of a11y_conformance_score differ ONLY in per-method row selection:
          latest_evidence takes the greatest-audit_sequence AA row per method (AUTOMATED
          defect_load 1) while governance_sweep takes the WORST AA row per method inside the
          conformance_baseline_at window (AUTOMATED defect_load 14). On one identical evidence
          set the implementation reads 97.20 and the component reads 92.00 — a pinned 5.00 gap.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `platform-ui` with debt_budget_points 40.00, debt_state CLEAR"
            - "Component `action-button` owned by that team, EXPERIMENTAL / ACTIVE, conformance_baseline_at == 2026-08-01T00:00:00.000Z"
            - "one WEB PlatformImplementation of that component, status PLANNED"
            - "three AA AccessibilityAudit rows on that implementation, filed in this order: AUTOMATED defect_load 14 (audit_sequence 1), AUTOMATED defect_load 1 (audit_sequence 2), MANUAL defect_load 4 (audit_sequence 3)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Platform UI", slug: "platform-ui", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Action Button", slug: "action-button", owning_team_id: "${team_id}", docs_state: "DRAFT" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/components/${comp_id}/platform-implementations"
              payload: { platform: "WEB", package_name: "@ds/action-button-web", package_version: "1.0.0", token_compliance_ratio: 0.95 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { impl_id: $.data.id }
            - call: "POST /design-system/platform-implementations/${impl_id}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 0, violations_serious: 3, violations_moderate: 2, evidence_url: "https://ds.example.com/a11y/auto-1" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { a1_seq: $.data.audit_sequence, a1_load: $.data.defect_load }
            - call: "POST /design-system/platform-implementations/${impl_id}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 1, evidence_url: "https://ds.example.com/a11y/auto-2" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { a2_seq: $.data.audit_sequence, a2_load: $.data.defect_load }
            - call: "POST /design-system/platform-implementations/${impl_id}/accessibility-audits"
              payload: { method: "MANUAL", wcag_level: "AA", violations_critical: 0, violations_serious: 1, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/manual-1" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { a3_seq: $.data.audit_sequence, a3_load: $.data.defect_load }
          trigger:
            - call: "POST /design-system/platform-implementations/${impl_id}/ship"
              payload: { package_version: "1.0.0", token_compliance_ratio: 0.95 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { impl_score: $.data.conformance_score, impl_status: $.data.status }
          assert:
            - "${a1_seq} == 1 and ${a1_load} == 14"
            - "${a2_seq} == 2 and ${a2_load} == 1"
            - "${a3_seq} == 3 and ${a3_load} == 4"
            - "PlatformImplementation.${impl_id}.status == SHIPPED"
            - "PlatformImplementation.${impl_id}.conformance_score == 97.20"
            - "Component.${comp_id}.governance_conformance_score == 92.00"
            - "PlatformImplementation.${impl_id}.conformance_score - Component.${comp_id}.governance_conformance_score == 5.00"
            - "Component.${comp_id}.shipped_platform_count == 1 and Component.${comp_id}.coverage_state == WEB_ONLY"

      - name: team_adoption_trailing_window_reads_below_latest_scan
        grounds:
          - calculations.team_adoption_index
          - entities.Team.fields.adoption_index_latest
          - entities.Team.fields.adoption_index_trailing
          - entities.AdoptionScan.fields.adoption_ratio
          - endpoints["GET /design-system/teams/{id}/dashboard"]
        distinguishing_aspect: |
          Second dual-variant pair, on a DIFFERENT calculation and a different entity domain
          (Team adoption rather than component accessibility): latest_scan weights one row per
          scan_kind (0.70*90.00 + 0.30*80.00 = 87.00) while trailing_window first averages the
          two most recent rows per kind (65.00 and 65.00) giving 65.00 — a pinned 22.00 gap on
          the same four immutable scan rows, and the dashboard surfaces whichever `view` asks.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `web-checkout` with default debt budget"
            - "two CODE_SCAN AdoptionScan rows: [2026-06-01,2026-06-30] ratio 40.00 and [2026-07-01,2026-07-31] ratio 90.00"
            - "two DESIGN_LINT AdoptionScan rows: [2026-06-01,2026-06-30] ratio 50.00 and [2026-07-01,2026-07-31] ratio 80.00"
            - "no scan windows share an endpoint instant within a scan_kind, so no overlap rule fires"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Web Checkout", slug: "web-checkout", platform_scope: "WEB_ONLY", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/teams/${team_id}/adoption-scans"
              payload: { scan_kind: "CODE_SCAN", window_start_at: "2026-06-01T00:00:00.000Z", window_end_at: "2026-06-30T00:00:00.000Z", system_instance_count: 40, legacy_instance_count: 60, one_off_instance_count: 0 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { cs_old_ratio: $.data.adoption_ratio }
            - call: "POST /design-system/teams/${team_id}/adoption-scans"
              payload: { scan_kind: "CODE_SCAN", window_start_at: "2026-07-01T00:00:00.000Z", window_end_at: "2026-07-31T00:00:00.000Z", system_instance_count: 90, legacy_instance_count: 10, one_off_instance_count: 0 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { cs_new_ratio: $.data.adoption_ratio }
            - call: "POST /design-system/teams/${team_id}/adoption-scans"
              payload: { scan_kind: "DESIGN_LINT", window_start_at: "2026-06-01T00:00:00.000Z", window_end_at: "2026-06-30T00:00:00.000Z", system_instance_count: 50, legacy_instance_count: 50, one_off_instance_count: 0 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { dl_old_ratio: $.data.adoption_ratio }
            - call: "POST /design-system/teams/${team_id}/adoption-scans"
              payload: { scan_kind: "DESIGN_LINT", window_start_at: "2026-07-01T00:00:00.000Z", window_end_at: "2026-07-31T00:00:00.000Z", system_instance_count: 80, legacy_instance_count: 20, one_off_instance_count: 0 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { dl_new_ratio: $.data.adoption_ratio }
          trigger:
            - call: "GET /design-system/teams/${team_id}/dashboard"
              payload: { view: "LATEST_SCAN" }
              as: DesignSystemLead
              captures: { latest_index: $.data.adoption_index, latest_cs: $.data.code_scan_ratio, latest_dl: $.data.design_lint_ratio }
            - call: "GET /design-system/teams/${team_id}/dashboard"
              payload: { view: "TRAILING_WINDOW" }
              as: DesignSystemLead
              captures: { trailing_index: $.data.adoption_index, trailing_cs: $.data.code_scan_ratio, trailing_dl: $.data.design_lint_ratio }
          assert:
            - "${cs_old_ratio} == 40.00 and ${cs_new_ratio} == 90.00"
            - "${dl_old_ratio} == 50.00 and ${dl_new_ratio} == 80.00"
            - "${latest_index} == 87.00 and ${latest_cs} == 90.00 and ${latest_dl} == 80.00"
            - "${trailing_index} == 65.00 and ${trailing_cs} == 65.00 and ${trailing_dl} == 65.00"
            - "Team.${team_id}.adoption_index_latest == 87.00"
            - "Team.${team_id}.adoption_index_trailing == 65.00"
            - "Team.${team_id}.adoption_index_latest - Team.${team_id}.adoption_index_trailing == 22.00"

  # =========================================================================
  # RULE 2 — combinatorial_formula
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: release_bump_pins_breaking_ratio_to_step_two_classes
        grounds:
          - calculations.release_version_bump
          - entities.Release.fields.breaking_ratio
          - entities.Release.fields.policy_tier
          - entities.Release.fields.semver
          - entities.Release.fields.escalated_proposal_count
          - entities.ContributionProposal.fields.raw_change_class
          - entities.ContributionProposal.fields.effective_change_class
          - state_machines.Release.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          release_version_bump combines six interacting inputs (proposal_kind, touches_public_api,
          target-component maturity_level at publish time, carried-set cardinality,
          BATCHED_RATIO_THRESHOLD and semver_base) in a single forward pass: breaking_ratio is
          computed from the STEP-2 maturity-adjusted classes (1/3 = 0.3333 -> INCREMENTAL), never
          from the STEP-1 raw classes (which would give 2/3 = 0.6667 -> BATCHED and three MAJORs).
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; TokenSet `core-foundations` with no tokens added after any submit"
            - "Component `data-table` promoted to BETA (WEB implementation SHIPPED, governance_conformance_score 100.00)"
            - "Components `chart-legend` and `tag-chip` left EXPERIMENTAL with no implementations"
            - "DRAFT Release with semver_base 4.2.1"
            - "three ACCEPTED proposals carried by that release: P1 BREAKING_CHANGE on the BETA `data-table`, P2 BREAKING_CHANGE on the EXPERIMENTAL `chart-legend`, P3 ENHANCEMENT with touches_public_api true on the EXPERIMENTAL `tag-chip`"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/token-sets"
              payload: { name: "Core Foundations 2026", slug: "core-foundations", default_brand: "BASE", default_mode: "LIGHT" }
              as: DesignSystemLead
              captures: { ts_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Data Table", slug: "data-table", owning_team_id: "${team_id}", docs_state: "PUBLISHED" }
              as: DesignSystemLead
              captures: { c_a: $.data.id }
            - call: "POST /design-system/components/${c_a}/platform-implementations"
              payload: { platform: "WEB", package_name: "@ds/data-table-web", package_version: "1.0.0", token_compliance_ratio: 1.00 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { impl_a: $.data.id }
            - call: "POST /design-system/platform-implementations/${impl_a}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/dt-auto" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/platform-implementations/${impl_a}/accessibility-audits"
              payload: { method: "MANUAL", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/dt-manual" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/platform-implementations/${impl_a}/ship"
              payload: { package_version: "1.0.0", token_compliance_ratio: 1.00 }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/components/${c_a}/promote-maturity"
              payload: { target_maturity_level: "BETA" }
              as: DesignSystemLead
              as_user_id: "lead-1"
            - call: "POST /design-system/components"
              payload: { name: "Chart Legend", slug: "chart-legend", owning_team_id: "${team_id}", docs_state: "DRAFT" }
              as: DesignSystemLead
              captures: { c_b: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Tag Chip", slug: "tag-chip", owning_team_id: "${team_id}", docs_state: "DRAFT" }
              as: DesignSystemLead
              captures: { c_c: $.data.id }
            - call: "POST /design-system/releases"
              payload: { semver_base: "4.2.1", channel: "STABLE" }
              as: SystemAdmin
              captures: { rel_id: $.data.id }
            - call: "POST /design-system/contribution-proposals"
              payload: { title: "Data table column API rewrite", author_team_id: "${team_id}", target_component_id: "${c_a}", pinned_token_set_id: "${ts_id}", proposal_kind: "BREAKING_CHANGE", touches_public_api: true }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { p1: $.data.id }
            - call: "POST /design-system/contribution-proposals/${p1}/submit"
              payload: {}
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/contribution-proposals/${p1}/acceptance-evidence"
              payload: { evidence_kinds: ["A11Y_AUTOMATED", "A11Y_MANUAL", "DOC_PAGE", "MIGRATION_GUIDE", "TOKEN_COMPLIANCE"], evidence_url: "https://ds.example.com/evidence/p1" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/contribution-proposals/${p1}/reviews"
              payload: { stage: "DESIGN_CRITIQUE", verdict: "APPROVE", notes: "Visual language consistent." }
              as: DesignCritiqueReviewer
              as_user_id: "critic-1"
            - call: "POST /design-system/contribution-proposals/${p1}/reviews"
              payload: { stage: "ENGINEERING_REVIEW", verdict: "APPROVE", notes: "API break documented." }
              as: EngineeringReviewer
              as_user_id: "eng-1"
            - call: "GET /design-system/components/${c_a}"
              payload: {}
              as: DesignSystemLead
              captures: { c_a_v1: $.data.version }
            - call: "POST /design-system/contribution-proposals/${p1}/accept"
              payload: { release_id: "${rel_id}", expected_component_version: "${c_a_v1}" }
              as: DesignSystemLead
              as_user_id: "lead-1"
            - call: "POST /design-system/contribution-proposals"
              payload: { title: "Chart legend marker API rewrite", author_team_id: "${team_id}", target_component_id: "${c_b}", pinned_token_set_id: "${ts_id}", proposal_kind: "BREAKING_CHANGE", touches_public_api: true }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { p2: $.data.id }
            - call: "POST /design-system/contribution-proposals/${p2}/submit"
              payload: {}
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/contribution-proposals/${p2}/acceptance-evidence"
              payload: { evidence_kinds: ["A11Y_AUTOMATED", "A11Y_MANUAL", "DOC_PAGE", "MIGRATION_GUIDE", "TOKEN_COMPLIANCE"], evidence_url: "https://ds.example.com/evidence/p2" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/contribution-proposals/${p2}/reviews"
              payload: { stage: "DESIGN_CRITIQUE", verdict: "APPROVE", notes: "Legend markers reviewed." }
              as: DesignCritiqueReviewer
              as_user_id: "critic-1"
            - call: "POST /design-system/contribution-proposals/${p2}/reviews"
              payload: { stage: "ENGINEERING_REVIEW", verdict: "APPROVE", notes: "Experimental surface, break acceptable." }
              as: EngineeringReviewer
              as_user_id: "eng-1"
            - call: "GET /design-system/components/${c_b}"
              payload: {}
              as: DesignSystemLead
              captures: { c_b_v1: $.data.version }
            - call: "POST /design-system/contribution-proposals/${p2}/accept"
              payload: { release_id: "${rel_id}", expected_component_version: "${c_b_v1}" }
              as: DesignSystemLead
              as_user_id: "lead-1"
            - call: "POST /design-system/contribution-proposals"
              payload: { title: "Tag chip adds dismissible prop", author_team_id: "${team_id}", target_component_id: "${c_c}", pinned_token_set_id: "${ts_id}", proposal_kind: "ENHANCEMENT", touches_public_api: true }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { p3: $.data.id }
            - call: "POST /design-system/contribution-proposals/${p3}/submit"
              payload: {}
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/contribution-proposals/${p3}/acceptance-evidence"
              payload: { evidence_kinds: ["A11Y_AUTOMATED", "TOKEN_COMPLIANCE"], evidence_url: "https://ds.example.com/evidence/p3" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/contribution-proposals/${p3}/reviews"
              payload: { stage: "DESIGN_CRITIQUE", verdict: "APPROVE", notes: "Dismiss affordance fine." }
              as: DesignCritiqueReviewer
              as_user_id: "critic-1"
            - call: "POST /design-system/contribution-proposals/${p3}/reviews"
              payload: { stage: "ENGINEERING_REVIEW", verdict: "APPROVE", notes: "Additive prop." }
              as: EngineeringReviewer
              as_user_id: "eng-1"
            - call: "GET /design-system/components/${c_c}"
              payload: {}
              as: DesignSystemLead
              captures: { c_c_v1: $.data.version }
            - call: "POST /design-system/contribution-proposals/${p3}/accept"
              payload: { release_id: "${rel_id}", expected_component_version: "${c_c_v1}" }
              as: DesignSystemLead
              as_user_id: "lead-1"
          trigger:
            - call: "POST /design-system/releases/${rel_id}/publish"
              payload: {}
              as: SystemAdmin
              captures: { semver: $.data.semver, tier: $.data.policy_tier, ratio: $.data.breaking_ratio, bc_count: $.data.breaking_change_count, esc_count: $.data.escalated_proposal_count }
          assert:
            - "${ratio} == 0.3333"
            - "${tier} == INCREMENTAL"
            - "${semver} == \"5.0.0\""
            - "${bc_count} == 1"
            - "${esc_count} == 1"
            - "ContributionProposal.${p1}.raw_change_class == MAJOR and ContributionProposal.${p1}.effective_change_class == MAJOR"
            - "ContributionProposal.${p2}.raw_change_class == MAJOR and ContributionProposal.${p2}.effective_change_class == MINOR"
            - "ContributionProposal.${p3}.raw_change_class == MINOR and ContributionProposal.${p3}.effective_change_class == MINOR"
            - "Release.${rel_id}.state == PUBLISHED and Release.${rel_id}.release_notes_state == PUBLISHED"
            - "Component.${c_a}.pending_breaking_change_count == 0 and Component.${c_a}.current_major_version == 2"
            - "Component.${c_b}.pending_breaking_change_count == 0 and Component.${c_b}.current_major_version == 2"

      - name: release_batched_tier_escalates_public_api_minor_to_major
        grounds:
          - calculations.release_version_bump
          - entities.Release.fields.policy_tier
          - entities.Release.fields.breaking_change_count
          - entities.ContributionProposal.fields.touches_public_api
          - entities.ContributionProposal.fields.effective_change_class
          - validations[priority=24]
        distinguishing_aspect: |
          Second combinatorial instance crossing a DIFFERENT threshold of the same formula: with
          two carried proposals the step-2 major count 1/2 lands exactly ON
          BATCHED_RATIO_THRESHOLD 0.50 (inclusive), so policy_tier becomes BATCHED and STEP 5
          escalates the public-API MINOR to MAJOR, doubling breaking_change_count to 2 while
          breaking_ratio stays 0.5000 because STEP 6 forbids re-running STEP 3 on the new classes.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; TokenSet `core-foundations`"
            - "Component `data-table` promoted to BETA; Component `tag-chip` left EXPERIMENTAL"
            - "DRAFT Release with semver_base 2.7.3"
            - "two ACCEPTED proposals: P1 BREAKING_CHANGE on the BETA `data-table`; P2 ENHANCEMENT with touches_public_api true on `tag-chip`, whose evidence set deliberately includes MIGRATION_GUIDE so the publish-time guide gate survives the escalation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/token-sets"
              payload: { name: "Core Foundations 2026", slug: "core-foundations", default_brand: "BASE", default_mode: "LIGHT" }
              as: DesignSystemLead
              captures: { ts_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Data Table", slug: "data-table", owning_team_id: "${team_id}", docs_state: "PUBLISHED" }
              as: DesignSystemLead
              captures: { c_a: $.data.id }
            - call: "POST /design-system/components/${c_a}/platform-implementations"
              payload: { platform: "WEB", package_name: "@ds/data-table-web", package_version: "1.0.0", token_compliance_ratio: 1.00 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { impl_a: $.data.id }
            - call: "POST /design-system/platform-implementations/${impl_a}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/dt-auto" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/platform-implementations/${impl_a}/accessibility-audits"
              payload: { method: "MANUAL", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/dt-manual" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/platform-implementations/${impl_a}/ship"
