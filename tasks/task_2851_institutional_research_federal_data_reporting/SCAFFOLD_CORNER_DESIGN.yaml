# §1.9 Scaffold Corner Design — Institutional Research & Federal Data Reporting
# Claim-coverage index for tasks/task_2851_institutional_research_federal_data_reporting.
# One instance per applicable row of references/claim-extraction-guide.md, walked against
# SCAFFOLD.yaml §1.1-§1.7. Corners already carried by §1.8 appear as excluded_because stubs
# naming the difficulty instance that owns them. Deleting this file leaves the declared
# behaviour unchanged; every numeric assert was computed from the §1.3 formulas.
scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_cycle_creation_returns_declared_defaults_and_version_one
        claim_type: Creation
        grounds:
          - entities.ReportingCycle
          - endpoints[POST /ir/reporting-cycles]
          - entities.ReportingCycle.fields.snapshot_posture
        distinguishing_aspect: |
          A freshly created ReportingCycle echoes its four input fields verbatim and carries
          snapshot_posture OPEN, reopen_count 0, active_record_count 0, version 1 and null
          census_locked_at / frozen_at / reopen_reason in the very same 201 response.
        test_recipe:
          setup:
            - "Empty store; the logical clock is at the 2026-08-01T00:00:00Z startup default."
          setup_api_calls: []
          trigger:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id }
          assert:
            - "HTTP status == 201"
            - "ReportingCycle.${cyc}.cycle_code == \"IPEDS-2027\""
            - "ReportingCycle.${cyc}.collection_year == 2027"
            - "ReportingCycle.${cyc}.census_date == \"2026-10-15\""
            - "ReportingCycle.${cyc}.collection_deadline == \"2027-02-15T23:59:59.000Z\""
            - "ReportingCycle.${cyc}.snapshot_posture == OPEN"
            - "ReportingCycle.${cyc}.reopen_count == 0"
            - "ReportingCycle.${cyc}.active_record_count == 0"
            - "ReportingCycle.${cyc}.version == 1"
            - "ReportingCycle.${cyc}.census_locked_at is null and frozen_at is null and reopen_reason is null"
            - "ReportingCycle.${cyc}.id is a UUID with no type prefix"

      - name: corner_frozen_file_retrieval_matches_registration
        claim_type: Retrieval
        grounds:
          - entities.FrozenFile
          - endpoints[GET /ir/frozen-files/{frozen_file_id}]
        distinguishing_aspect: |
          GET /ir/frozen-files/{id} returns exactly the stored extract — the same domain,
          record_count, both coverage dates and checksum that were registered — with status
          ACTIVE and version 1, not a projection of the parent cycle.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is OPEN; one ENROLLMENT extract covers 2026-09-01 to 2026-10-15 with record_count 1000."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60101", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff1: $.data.id }
          trigger:
            - call: "GET /ir/frozen-files/${ff1}"
              payload: {}
              as: IRAnalyst
          assert:
            - "HTTP status == 200"
            - "FrozenFile.${ff1}.cycle_id == ${cyc}"
            - "FrozenFile.${ff1}.domain == ENROLLMENT"
            - "FrozenFile.${ff1}.record_count == 1000"
            - "FrozenFile.${ff1}.coverage_start_date == \"2026-09-01\""
            - "FrozenFile.${ff1}.coverage_end_date == \"2026-10-15\""
            - "FrozenFile.${ff1}.checksum == \"c1d2e3f4a5b60101\""
            - "FrozenFile.${ff1}.status == ACTIVE"
            - "FrozenFile.${ff1}.version == 1"
            - "ReportingCycle.${cyc}.active_record_count == 1000"

      - name: corner_frozen_file_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /ir/frozen-files]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three extracts on the cycle, limit 2 / offset 0 returns two rows with
          total_count 3 and has_more true, while limit 2 / offset 2 returns one row with
          total_count 3 and has_more false — total_count counts the filtered set, not the page.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is OPEN with three ACTIVE extracts: ENROLLMENT, COMPLETIONS and FINANCE."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60102", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
            - call: "GET /ir/reporting-cycles/${cyc}"
              payload: {}
              as: RegistrarOfficer
              captures: { cyc_v2: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "COMPLETIONS", record_count: 250, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60103", expected_cycle_version: "${cyc_v2}" }
              as: RegistrarOfficer
            - call: "GET /ir/reporting-cycles/${cyc}"
              payload: {}
              as: RegistrarOfficer
              captures: { cyc_v3: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "FINANCE", record_count: 4, coverage_start_date: "2026-07-01", coverage_end_date: "2027-06-30", checksum: "c1d2e3f4a5b60104", expected_cycle_version: "${cyc_v3}" }
              as: RegistrarOfficer
          trigger:
            - call: "GET /ir/frozen-files?cycle_id=${cyc}&limit=2&offset=0"
              payload: {}
              as: IRAnalyst
              captures: { first_row: "$.data[0].id" }
            - call: "GET /ir/frozen-files?cycle_id=${cyc}&limit=2&offset=2"
              payload: {}
              as: IRAnalyst
            - call: "GET /ir/frozen-files?cycle_id=${cyc}&domain=FINANCE"
              payload: {}
              as: IRAnalyst
          assert:
            - "First page: data has length 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second page: data has length 1, total_count == 3, has_more == false, offset == 2"
            - "Domain filter FINANCE: data has length 1, total_count == 1, has_more == false"
            - "ReportingCycle.${cyc}.active_record_count == 1254"
            - "The two pages are disjoint: ${first_row} does not appear in the second page"

      - name: corner_unknown_cohort_uuid_is_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /ir/cohorts/{cohort_id}]
          - errors[ERR_COHORT_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: |
          A syntactically valid but unknown UUID on GET /ir/cohorts/{cohort_id} yields
          ERR_COHORT_NOT_FOUND with HTTP 404 — not an empty 200 body and not the generic
          ERR_INVALID_REQUEST, because path resolution (priority 4) runs after schema checks.
        test_recipe:
          setup:
            - "Empty store; no CohortDefinition has ever been created."
          setup_api_calls: []
          trigger:
            - call: "GET /ir/cohorts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: IRAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.error_id == \"ERR_COHORT_NOT_FOUND\""
            - "response.response_type == \"error\" and response.data.message is a non-empty string"

      - name: corner_component_creation_missing_component_code_is_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints[POST /ir/survey-components]
          - entities.SurveyComponent.fields.component_code
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          component_code is source input with no default, so omitting it returns
          ERR_INVALID_REQUEST (400) before any cycle-posture check runs — the cycle is
          CENSUS_LOCKED and would otherwise admit the create.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is CENSUS_LOCKED with one ACTIVE ENROLLMENT extract; clock at 2026-11-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60105", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
          trigger:
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ff1}" }
              as: IRAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /ir/survey-components?cycle_id=${cyc} -> total_count == 0 (nothing was created)"

      - name: corner_data_request_defaults_avoidance_method_and_min_cell_size
        claim_type: Defaults
        grounds:
          - entities.DataRequest.fields.avoidance_method
          - entities.DataRequest.fields.min_cell_size
          - entities.DataRequest.fields.status
          - endpoints[POST /ir/reporting-cycles/{cycle_id}/data-requests]
        distinguishing_aspect: |
          Omitting both optional inputs yields avoidance_method SMALL_CELL_SUPPRESSION and
          min_cell_size 5 (the §1.1 defaults), with status RECEIVED, cell_count 0 and
          residual_disclosure_risk false — the server does not leave them null.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is FROZEN (one CERTIFIED ENROLLMENT component); clock at 2026-11-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60106", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ff1}", component_code: "ENROLLMENT" }
              as: IRAnalyst
              captures: { comp: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "TOTAL_HEADCOUNT", reported_value: 1000, prior_year_value: 1000, source_field_path: "sis.enrollment.headcount" }
              as: IRAnalyst
            - call: "POST /ir/survey-components/${comp}/prepare"
              payload: {}
              as: IRAnalyst
              as_user_id: "analyst-1"
            - call: "POST /ir/survey-components/${comp}/certify"
              payload: { certification_statement: "I certify the enrollment component as reported to the federal collection." }
              as: IRDirector
              as_user_id: "director-1"
            - call: "POST /ir/reporting-cycles/${cyc}/freeze"
              payload: {}
              as: IRDirector
          trigger:
            - call: "POST /ir/reporting-cycles/${cyc}/data-requests"
              payload: { requester_org: "State Higher Education Coordinating Board", requester_type: "INTERNAL", requested_metric_key: "TOTAL_HEADCOUNT" }
              as: DisclosureOfficer
              as_user_id: "disclosure-1"
              captures: { dr: $.data.id }
          assert:
            - "HTTP status == 201"
            - "DataRequest.${dr}.avoidance_method == SMALL_CELL_SUPPRESSION"
            - "DataRequest.${dr}.min_cell_size == 5"
            - "DataRequest.${dr}.status == RECEIVED"
            - "DataRequest.${dr}.cell_count == 0 and suppressed_cell_count == 0 and released_cell_count == 0"
            - "DataRequest.${dr}.residual_disclosure_risk == false"
            - "DataRequest.${dr}.screened_at is null and refusal_reason is null"

      - name: corner_cohort_member_outcome_defaults_to_still_enrolled
        claim_type: Defaults
        grounds:
          - entities.CohortMember.fields.outcome
          - entities.CohortMember.fields.exclusion_status
          - endpoints[POST /ir/cohorts/{cohort_id}/members]
        distinguishing_aspect: |
          A member added without an outcome is STILL_ENROLLED with exclusion_status NONE, so
          it counts in retained_count but not in completers_count — the default participates
          in the rate variants exactly like an explicit STILL_ENROLLED.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is CENSUS_LOCKED; a DRAFT GRAD_RATE_150 cohort for FALL2020 exists with one COMPLETED_150 member S001."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 2, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60107", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/cohorts"
              payload: { cohort_type: "GRAD_RATE_150", entry_term: "FALL2020", publication_metric_key: "GRAD_RATE_150_FALL2020" }
              as: RegistrarOfficer
              captures: { coh: $.data.id }
            - call: "POST /ir/cohorts/${coh}/members"
              payload: { student_local_id: "S001", entry_status: "FULL_TIME", outcome: "COMPLETED_150" }
              as: RegistrarOfficer
          trigger:
            - call: "POST /ir/cohorts/${coh}/members"
              payload: { student_local_id: "S002", entry_status: "PART_TIME" }
              as: RegistrarOfficer
              captures: { m2: $.data.id }
            - call: "GET /ir/cohorts/${coh}/rate-summary"
              payload: {}
              as: IRAnalyst
          assert:
            - "CohortMember.${m2}.outcome == STILL_ENROLLED"
            - "CohortMember.${m2}.exclusion_status == NONE"
            - "CohortMember.${m2}.exclusion_code is null and exclusion_claimed_by_user_id is null"
            - "GET /ir/cohorts/${coh}/rate-summary -> data.initial_count == 2"
            - "GET /ir/cohorts/${coh}/rate-summary -> data.completers_count == 1"
            - "GET /ir/cohorts/${coh}/rate-summary -> data.retained_count == 2"
            - "GET /ir/cohorts/${coh}/rate-summary -> data.federal_rate_pct == 50.0"

      - name: corner_cohort_counts_are_server_computed_from_the_roster
        claim_type: Computed Fields
        grounds:
          - entities.CohortDefinition.fields.initial_count
          - entities.CohortDefinition.fields.adjusted_count
          - entities.CohortDefinition.fields.completers_count
          - calculations.cohort_rate_variants
          - endpoints[GET /ir/cohorts/{cohort_id}/rate-summary]
        distinguishing_aspect: |
          POST /ir/reporting-cycles/{cycle_id}/cohorts accepts no count field at all, so the
          new cohort reports initial_count 0 and null rates; after two members are added the
          same fields read 2 / 2 / 1 with federal_rate_pct 50.0 without any client input.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is CENSUS_LOCKED with no cohort yet."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 2, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60108", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
          trigger:
            - call: "POST /ir/reporting-cycles/${cyc}/cohorts"
              payload: { cohort_type: "GRAD_RATE_150", entry_term: "FALL2020", publication_metric_key: "GRAD_RATE_150_FALL2020" }
              as: RegistrarOfficer
              captures: { coh: $.data.id }
            - call: "POST /ir/cohorts/${coh}/members"
              payload: { student_local_id: "S001", entry_status: "FULL_TIME", outcome: "COMPLETED_150" }
              as: RegistrarOfficer
            - call: "POST /ir/cohorts/${coh}/members"
              payload: { student_local_id: "S002", entry_status: "FULL_TIME", outcome: "NO_LONGER_ENROLLED" }
              as: RegistrarOfficer
            - call: "GET /ir/cohorts/${coh}"
              payload: {}
              as: IRAnalyst
          assert:
            - "In the cohort creation response: initial_count == 0, exclusion_count == 0, adjusted_count == 0, completers_count == 0, retained_count == 0"
            - "In the cohort creation response: federal_rate_pct is null and ranking_rate_pct is null (adjusted_count 0)"
            - "CohortDefinition.${coh}.initial_count == 2"
            - "CohortDefinition.${coh}.adjusted_count == 2"
            - "CohortDefinition.${coh}.completers_count == 1"
            - "CohortDefinition.${coh}.retained_count == 1"
            - "CohortDefinition.${coh}.federal_rate_pct == 50.0"
            - "CohortDefinition.${coh}.ranking_rate_pct == 50.0"
            - "CohortDefinition.${coh}.status == DRAFT"

      - name: corner_system_fields_are_minted_from_the_logical_clock
        claim_type: System Fields
        grounds:
          - entities.FrozenFile.fields.snapshot_taken_at
          - entities.FrozenFile.fields.status
          - entities.FrozenFile.fields.supersedes_frozen_file_id
          - entities.ReportingCycle.fields.census_locked_at
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          snapshot_taken_at and census_locked_at are stamped from the logical clock at the
          instant of the write (2026-08-15T09:30:00.000Z and 2026-11-01T00:00:00.000Z
          respectively), and supersedes_frozen_file_id stays null because no peer held the
          identical window — the client never supplies any of the three.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 exists; the logical clock is moved to 2026-08-15T09:30:00Z before the extract is registered and to 2026-11-01T00:00:00Z before the census lock."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T09:30:00Z" }
              as: RegistrarOfficer
          trigger:
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60109", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
          assert:
            - "FrozenFile.${ff1}.snapshot_taken_at == \"2026-08-15T09:30:00.000Z\""
            - "FrozenFile.${ff1}.supersedes_frozen_file_id is null"
            - "FrozenFile.${ff1}.status == LOCKED (after the census lock)"
            - "ReportingCycle.${cyc}.census_locked_at == \"2026-11-01T00:00:00.000Z\""
            - "ReportingCycle.${cyc}.frozen_at is null"
            - "FrozenFile.${ff1}.created_at is an ISO 8601 UTC instant with three fractional digits"

      - name: corner_type_constraints_reject_bad_enum_negative_count_and_out_of_range
        claim_type: Type Constraints
        grounds:
          - entities.CohortMember.fields.outcome
          - entities.FrozenFile.fields.record_count
          - entities.DataRequest.fields.min_cell_size
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Three separate type-domain violations all resolve to ERR_INVALID_REQUEST (400):
          an undeclared outcome member "GRADUATED", a negative record_count -5, and
          min_cell_size 11 which exceeds the declared maximum of 10.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is CENSUS_LOCKED with one ACTIVE ENROLLMENT extract and a DRAFT GRAD_RATE_150 cohort for FALL2020."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 2, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60110", expected_cycle_version: "${cyc_v}" }
