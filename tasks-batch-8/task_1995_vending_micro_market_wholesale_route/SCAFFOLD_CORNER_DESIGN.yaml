            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders/${ord}/confirm", as: RoutePlanner }
            - { call: "POST /wholesale/orders/${ord}/mark-delivered", as: WarehouseOps }
            - { call: "POST /wholesale/credit-claims", payload: { order_id: "${ord}", lines: [{ product_id: "${pr}", quantity_units: 1, expiration_date: "2026-07-30" }] }, as: OperatorManager, as_user_id: "${op}", captures: { cl: $.data.id } }
            - { call: "POST /wholesale/credit-claims/${cl}/reject", as: CreditAdjuster }
          trigger:
            - { call: "POST /wholesale/credit-claims/${cl}/approve", as: CreditAdjuster, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLAIM_NOT_SUBMITTED"
            - "CreditClaim.${cl}.status == REJECTED"
            - "Operator.${op}.credit_balance_cents == 0"

      - name: claim_approve_twice_rejected
        claim_type: idempotency
        grounds:
          - "state_machines.CreditClaim.SUBMITTED_to_APPROVED"
          - "errors[ERR_CLAIM_NOT_SUBMITTED]"
        distinguishing_aspect: "Approving an already-APPROVED claim (not auto-settled because no order is OPEN) fails ERR_CLAIM_NOT_SUBMITTED; credit is issued exactly once."
        test_recipe:
          setup: ["order delivered then SETTLED (so approve finds no OPEN order); claim (10 units, exp 2026-07-30, credit 1000) APPROVED once"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op A2x" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-A2X", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "A2X-1", name: "A2x item", category: "CHILLED", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 21, perishability_class: "CHILLED" }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-A2x", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-A2x", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 10, vend_price_cents: 180 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders/${ord}/confirm", as: RoutePlanner }
            - { call: "POST /wholesale/orders/${ord}/mark-delivered", as: WarehouseOps }
            - { call: "POST /wholesale/telemetry-events", payload: { location_id: "${loc}", recorded_at: "2026-08-04T09:00:00Z", cash_collected_cents: 0, cashless_sales_cents: 0, items: [{ product_id: "${pr}", units_vended: 0, on_hand_units: 10 }] }, as: TelemetryGateway, captures: { ev: $.data.id } }
            - { call: "POST /wholesale/orders/${ord}/settle", payload: { tender_type: "CASH", telemetry_event_id: "${ev}" }, as: WholesaleAdmin }
            - { call: "POST /wholesale/credit-claims", payload: { order_id: "${ord}", lines: [{ product_id: "${pr}", quantity_units: 10, expiration_date: "2026-07-30" }] }, as: OperatorManager, as_user_id: "${op}", captures: { cl: $.data.id } }
            - { call: "POST /wholesale/credit-claims/${cl}/approve", as: CreditAdjuster }
          trigger:
            - { call: "POST /wholesale/credit-claims/${cl}/approve", as: CreditAdjuster, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLAIM_NOT_SUBMITTED"
            - "CreditClaim.${cl}.status == APPROVED and applied_cents == 0"
            - "Operator.${op}.credit_balance_cents == 1000   # credited exactly once"

      - name: planogram_activate_twice_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Planogram.DRAFT_to_ACTIVE"
          - "errors[ERR_PLANOGRAM_NOT_DRAFT]"
        distinguishing_aspect: "activate requires DRAFT: re-activating the now-ACTIVE planogram fails ERR_PLANOGRAM_NOT_DRAFT."
        test_recipe:
          setup: ["planogram activated once"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Pg2" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-PG2", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "PG2-1", name: "Pg2 item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Pg2", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Twice", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 10, vend_price_cents: 150 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}", captures: { loc_v2: $.data.version } }
          trigger:
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v2}" }, as: OperatorManager, as_user_id: "${op}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PLANOGRAM_NOT_DRAFT"
            - "Planogram.${pg}.status == ACTIVE"

      - name: planogram_activation_supersedes_incumbent
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Planogram.DRAFT_to_ACTIVE"
          - "state_machines.Planogram.ACTIVE_to_ARCHIVED"
        distinguishing_aspect: "Activating a second planogram archives the incumbent: PG1 ACTIVE -> ARCHIVED, PG2 DRAFT -> ACTIVE, and Location.version has advanced once per activation."
        test_recipe:
          setup: ["PG1 active; PG2 drafted for the same location"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Sup" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-SUP", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "SUP-1", name: "Sup item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Sup", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-One", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 10, vend_price_cents: 150 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg1: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg1}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "GET /wholesale/locations/${loc}", as: WholesaleAdmin, captures: { loc_v2: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Two", slots: [{ slot_code: "B1", product_id: "${pr}", par_level_units: 30, vend_price_cents: 160 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg2: $.data.id } }
          trigger:
            - { call: "POST /wholesale/planograms/${pg2}/activate", payload: { expected_location_version: "${loc_v2}" }, as: OperatorManager, as_user_id: "${op}" }
          assert:
            - "Planogram.${pg2}.status == ACTIVE and activated_at == 2026-08-01T00:00:00.000Z (logical clock)"
            - "Planogram.${pg1}.status == ARCHIVED   # superseded"
            - "Location.${loc}.version advanced by exactly 1 from the second activation"

      - name: cull_evaluate_requires_active_planogram
        claim_type: precondition_enforcement
        grounds:
          - "calculations.weekly_velocity_cull"
          - "errors[ERR_PLANOGRAM_NOT_ACTIVE]"
        distinguishing_aspect: "cull-evaluate on a DRAFT planogram fails ERR_PLANOGRAM_NOT_ACTIVE; no cull flags are written."
        test_recipe:
          setup: ["DRAFT planogram (never activated)"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op CullD" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-CLD", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "CLD-1", name: "Cld item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-CullD", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Draft", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 10, vend_price_cents: 150 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
          trigger:
            - { call: "POST /wholesale/planograms/${pg}/cull-evaluate", as: OperatorManager, as_user_id: "${op}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PLANOGRAM_NOT_ACTIVE"
            - "Planogram.${pg}.status == DRAFT and slots[0].cull_flag == false"

      - name: ticket_state_gates
        claim_type: invalid_transition
        grounds:
          - "state_machines.ServiceTicket.OPEN_to_SCHEDULED"
          - "state_machines.ServiceTicket.SCHEDULED_to_COMPLETED"
          - "errors[ERR_TICKET_NOT_OPEN]"
          - "errors[ERR_TICKET_NOT_SCHEDULED]"
        distinguishing_aspect: "complete on an OPEN ticket fails ERR_TICKET_NOT_SCHEDULED; scheduling an already-SCHEDULED ticket fails ERR_TICKET_NOT_OPEN — both from-state guards on the same linear machine."
        test_recipe:
          setup: ["two tickets: T1 left OPEN; T2 scheduled"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Tkt" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-TKT", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Tkt", location_type: "GYM", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id } }
            - { call: "POST /wholesale/service-tickets", payload: { location_id: "${loc}", equipment_model: "VENDO-540", issue_type: "REPAIR", parts: [] }, as: OperatorManager, as_user_id: "${op}", captures: { t1: $.data.id } }
            - { call: "POST /wholesale/service-tickets", payload: { location_id: "${loc}", equipment_model: "VENDO-540", issue_type: "PREVENTIVE", parts: [] }, as: OperatorManager, as_user_id: "${op}", captures: { t2: $.data.id } }
            - { call: "POST /wholesale/service-tickets/${t2}/schedule", payload: { service_date: "2026-08-05" }, as: RoutePlanner }
          trigger:
            - { call: "POST /wholesale/service-tickets/${t1}/complete", as: WarehouseOps, captures: { err1: $.data.error_id } }
            - { call: "POST /wholesale/service-tickets/${t2}/schedule", payload: { service_date: "2026-08-06" }, as: RoutePlanner, captures: { err2: $.data.error_id } }
          assert:
            - "complete on OPEN error_id == ERR_TICKET_NOT_SCHEDULED"
            - "schedule on SCHEDULED error_id == ERR_TICKET_NOT_OPEN"
            - "ServiceTicket.${t1}.status == OPEN and ServiceTicket.${t2}.status == SCHEDULED and ServiceTicket.${t2}.service_date == 2026-08-05"

      - name: product_rediscontinue_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Product.ACTIVE_to_DISCONTINUED"
          - "errors[ERR_PRODUCT_DISCONTINUED]"
        distinguishing_aspect: "DISCONTINUED is terminal: discontinuing twice fails with ERR_PRODUCT_DISCONTINUED (state-tier rejection)."
        test_recipe:
          setup: ["product already DISCONTINUED"]
          setup_api_calls:
            - { call: "POST /wholesale/products", payload: { sku: "DSC-1", name: "Disc item", category: "CANDY", eligible_location_types: ["GYM"], case_pack_qty: 10, base_price_cents: 500, cost_cents: 300, shelf_life_days: 120 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/products/${pr}/discontinue", as: WholesaleAdmin }
          trigger:
            - { call: "POST /wholesale/products/${pr}/discontinue", as: WholesaleAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PRODUCT_DISCONTINUED"
            - "Product.${pr}.status == DISCONTINUED"

      - name: operator_suspend_reinstate_cycle_guards
        claim_type: invalid_transition
        grounds:
          - "state_machines.Operator.ACTIVE_to_SUSPENDED"
          - "state_machines.Operator.SUSPENDED_to_ACTIVE"
          - "errors[ERR_OPERATOR_NOT_ACTIVE]"
        distinguishing_aspect: "The ACTIVE<->SUSPENDED cycle rejects same-state re-entry both ways: suspending a SUSPENDED operator and reinstating an ACTIVE operator each fail ERR_OPERATOR_NOT_ACTIVE."
        test_recipe:
          setup: ["operator suspended once"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Cyc" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/operators/${op}/suspend", as: WholesaleAdmin }
          trigger:
            - { call: "POST /wholesale/operators/${op}/suspend", as: WholesaleAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /wholesale/operators/${op}/reinstate", as: WholesaleAdmin }
            - { call: "POST /wholesale/operators/${op}/reinstate", as: WholesaleAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "re-suspend error_id == ERR_OPERATOR_NOT_ACTIVE"
            - "re-reinstate error_id == ERR_OPERATOR_NOT_ACTIVE"
            - "Operator.${op}.status == ACTIVE"

  # ============================================================ calculations
  - section: calculations
    instances:
      - name: suggestion_ceil_and_exclusion_rules
        claim_type: correct_result
        grounds:
          - "calculations.suggested_replenishment_qty"
        distinguishing_aspect: "Suggested cases use ceil division against case_pack (par 25, on_hand 3, pack 10 -> ceil(22/10) = 3); a slot with no telemetry item and a slot at/above par are both EXCLUDED from the generated order."
        test_recipe:
          setup:
            - "ACTIVE planogram: S1 (PS-1 pack 10, par 25), S2 (PS-2 pack 10, par 10), S3 (PS-3 pack 10, par 10)"
            - "One telemetry event: PS-1 on_hand 3, PS-3 on_hand 12; PS-2 has NO telemetry item"
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Sug" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-SUG", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "PS-1", name: "Sug 1", category: "BEVERAGE", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "PS-2", name: "Sug 2", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 800, cost_cents: 500, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { p2: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "PS-3", name: "Sug 3", category: "CANDY", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 700, cost_cents: 400, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { p3: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Sug", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Sug", slots: [{ slot_code: "S1", product_id: "${p1}", par_level_units: 25, vend_price_cents: 150 }, { slot_code: "S2", product_id: "${p2}", par_level_units: 10, vend_price_cents: 120 }, { slot_code: "S3", product_id: "${p3}", par_level_units: 10, vend_price_cents: 110 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/telemetry-events", payload: { location_id: "${loc}", recorded_at: "2026-08-01T06:00:00Z", cash_collected_cents: 0, cashless_sales_cents: 0, items: [{ product_id: "${p1}", units_vended: 4, on_hand_units: 3 }, { product_id: "${p3}", units_vended: 0, on_hand_units: 12 }] }, as: TelemetryGateway }
          trigger:
            - { call: "POST /wholesale/orders/generate-from-telemetry", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03" }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
          assert:
            - "ReplenishmentOrder.${ord}.lines == exactly one line: product_id ${p1}, quantity_cases 3   # ceil((25-3)/10)"
            - "lines contain no entry for product PS-2 (no telemetry item) and none for PS-3 (on_hand 12 >= par 10)"
            - "ReplenishmentOrder.${ord}.total_cases == 3 and source == TELEMETRY_SUGGESTED"

      - name: cull_velocity_window_filtering
        claim_type: input_set_filtering
        grounds:
          - "calculations.weekly_velocity_cull"
        distinguishing_aspect: "Only telemetry inside [now-28d, now] counts: a product with 100 units vended BEFORE the window and 1 unit inside it is culled (in-window velocity 1 < 2); a product with zero in-window items is NOT culled (insufficient data)."
        test_recipe:
          setup:
            - "ACTIVE planogram: CW-1 (has old+new events), CW-2 (only an old event)"
            - "CW-1: 100 units at 2026-06-15 (outside), 1 unit at 2026-07-20 (inside); CW-2: 50 units at 2026-06-15 only"
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op CullW" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-CLW", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "CW-1", name: "CullW 1", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 800, cost_cents: 500, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "CW-2", name: "CullW 2", category: "CANDY", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 700, cost_cents: 400, shelf_life_days: 120 }, as: WholesaleAdmin, captures: { p2: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-CullW", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-CullW", slots: [{ slot_code: "A1", product_id: "${p1}", par_level_units: 20, vend_price_cents: 120 }, { slot_code: "A2", product_id: "${p2}", par_level_units: 20, vend_price_cents: 110 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/telemetry-events", payload: { location_id: "${loc}", recorded_at: "2026-06-15T10:00:00Z", cash_collected_cents: 0, cashless_sales_cents: 0, items: [{ product_id: "${p1}", units_vended: 100, on_hand_units: 0 }, { product_id: "${p2}", units_vended: 50, on_hand_units: 0 }] }, as: TelemetryGateway }
            - { call: "POST /wholesale/telemetry-events", payload: { location_id: "${loc}", recorded_at: "2026-07-20T10:00:00Z", cash_collected_cents: 0, cashless_sales_cents: 0, items: [{ product_id: "${p1}", units_vended: 1, on_hand_units: 5 }] }, as: TelemetryGateway }
          trigger:
            - { call: "POST /wholesale/planograms/${pg}/cull-evaluate", as: OperatorManager, as_user_id: "${op}" }
          assert:
            - "Planogram.${pg}.slots[product_id=${p1}].cull_flag == true    # in-window velocity 1 < 2; the 100 pre-window units are excluded"
            - "Planogram.${pg}.slots[product_id=${p2}].cull_flag == false   # zero in-window items -> insufficient data -> not culled"

      - name: promo_exclusive_overrides_stackable
        claim_type: constants_applied
        grounds:
          - "calculations.promo_price_resolution"
          - "calculations.order_pricing"
        distinguishing_aspect: "When an EXCLUSIVE promotion and a STACKABLE promotion are both eligible, the EXCLUSIVE one applies ALONE: base 1000 with EXCLUSIVE 20% beats the additional STACKABLE 100 cents — line total 800, discount 200 (not 700/300)."
        test_recipe:
          setup: ["product base 1000 pack 1; global EXCLUSIVE 20% + operator-specific STACKABLE 100 cents, both covering 2026-08"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Excl" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-EXC", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "EXC-1", name: "Excl item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 1, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/promotions", payload: { product_id: "${pr}", discount_type: "PERCENT_OFF", discount_value: 20, starts_at: "2026-07-01T00:00:00Z", ends_at: "2026-09-01T00:00:00Z", stacking_class: "EXCLUSIVE" }, as: WholesaleAdmin }
            - { call: "POST /wholesale/promotions", payload: { product_id: "${pr}", operator_id: "${op}", discount_type: "CENTS_OFF", discount_value: 100, starts_at: "2026-07-01T00:00:00Z", ends_at: "2026-09-01T00:00:00Z", stacking_class: "STACKABLE" }, as: WholesaleAdmin }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Excl", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Excl", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 10, vend_price_cents: 200 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}" }
          assert:
            - "ReplenishmentOrder.${ord}.order_total_cents == 800    # EXCLUSIVE 20% applies alone"
            - "ReplenishmentOrder.${ord}.promo_discount_cents == 200  # stackable 100 ignored (not 300 off / 700 total)"

      - name: promo_stackable_sum_and_scope_filtering
        claim_type: input_set_filtering
        grounds:
          - "calculations.promo_price_resolution"
        distinguishing_aspect: "With only STACKABLE promotions eligible they SUM: operator OpS (global 30 + operator-scoped 20) pays 950; operator OpT (global only) pays 970 for the identical line — operator scope filters eligibility."
        test_recipe:
          setup: ["product base 1000 pack 1; promos: global STACKABLE 30 (created first), OpS-scoped STACKABLE 20; two operators each with location/planogram and a 1-case order"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op StkS" }, as: WholesaleAdmin, captures: { opS: $.data.id } }
            - { call: "POST /wholesale/operators", payload: { name: "Op StkT" }, as: WholesaleAdmin, captures: { opT: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-STK", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "STK-1", name: "Stk item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 1, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/promotions", payload: { product_id: "${pr}", discount_type: "CENTS_OFF", discount_value: 30, starts_at: "2026-07-01T00:00:00Z", ends_at: "2026-09-01T00:00:00Z", stacking_class: "STACKABLE" }, as: WholesaleAdmin }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${opS}", name: "L-StkS", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { locS: $.data.id, locS_v: $.data.version } }
            - { call: "POST /wholesale/promotions", payload: { product_id: "${pr}", operator_id: "${opS}", discount_type: "CENTS_OFF", discount_value: 20, starts_at: "2026-07-01T00:00:00Z", ends_at: "2026-09-01T00:00:00Z", stacking_class: "STACKABLE" }, as: WholesaleAdmin }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${locS}", name: "PG-StkS", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 10, vend_price_cents: 200 }] }, as: OperatorManager, as_user_id: "${opS}", captures: { pgS: $.data.id } }
            - { call: "POST /wholesale/planograms/${pgS}/activate", payload: { expected_location_version: "${locS_v}" }, as: OperatorManager, as_user_id: "${opS}" }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${opT}", name: "L-StkT", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { locT: $.data.id, locT_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${locT}", name: "PG-StkT", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 10, vend_price_cents: 200 }] }, as: OperatorManager, as_user_id: "${opT}", captures: { pgT: $.data.id } }
            - { call: "POST /wholesale/planograms/${pgT}/activate", payload: { expected_location_version: "${locT_v}" }, as: OperatorManager, as_user_id: "${opT}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${locS}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${opS}", captures: { ordS: $.data.id } }
            - { call: "POST /wholesale/orders", payload: { location_id: "${locT}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${opT}", captures: { ordT: $.data.id } }
          trigger:
            - { call: "POST /wholesale/orders/${ordS}/submit", as: OperatorManager, as_user_id: "${opS}" }
            - { call: "POST /wholesale/orders/${ordT}/submit", as: OperatorManager, as_user_id: "${opT}" }
          assert:
            - "ReplenishmentOrder.${ordS}.order_total_cents == 950   # 30 + 20 stackable sum"
            - "ReplenishmentOrder.${ordS}.promo_discount_cents == 50"
            - "ReplenishmentOrder.${ordT}.order_total_cents == 970   # global 30 only"
            - "ReplenishmentOrder.${ordT}.promo_discount_cents == 30"

      - name: promo_expired_window_not_applied
        claim_type: correct_result
        grounds:
          - "calculations.promo_price_resolution"
        distinguishing_aspect: "A promotion whose half-open window already closed (ends_at 2026-07-31T00:00:00Z, now 2026-08-01) is ineligible: the line prices at full base with promo_discount_cents 0."
        test_recipe:
          setup: ["product base 1000 pack 1; EXCLUSIVE 50% promo window [2026-07-01, 2026-07-31)"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op ExpP" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-EXPP", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "EXP-1", name: "Exp promo item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 1, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/promotions", payload: { product_id: "${pr}", discount_type: "PERCENT_OFF", discount_value: 50, starts_at: "2026-07-01T00:00:00Z", ends_at: "2026-07-31T00:00:00Z", stacking_class: "EXCLUSIVE" }, as: WholesaleAdmin }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-ExpP", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-ExpP", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 10, vend_price_cents: 200 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}" }
          assert:
            - "ReplenishmentOrder.${ord}.order_total_cents == 1000   # expired window -> no discount"
            - "ReplenishmentOrder.${ord}.promo_discount_cents == 0"

      - name: promo_floor_zero_and_auto_settle_on_delivery
        claim_type: boundary_edge
        grounds:
          - "calculations.order_pricing"
          - "state_machines.ReplenishmentOrder.CONFIRMED_to_DELIVERED"
        distinguishing_aspect: "A discount larger than the base price floors the line at 0 (never negative); delivering the resulting zero-total order auto-settles it (amount_due 0 -> settlement_status SETTLED directly from UNINVOICED)."
        test_recipe:
          setup: ["product base 1000 pack 10 vend 150; global STACKABLE CENTS_OFF 1500 covering 2026-08; order 1 case submitted/confirmed"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Floor" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-FLR", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "FLR-1", name: "Floor item", category: "CANDY", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 400, shelf_life_days: 120 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/promotions", payload: { product_id: "${pr}", discount_type: "CENTS_OFF", discount_value: 1500, starts_at: "2026-07-01T00:00:00Z", ends_at: "2026-09-01T00:00:00Z", stacking_class: "STACKABLE" }, as: WholesaleAdmin }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Floor", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Floor", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 10, vend_price_cents: 150 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders/${ord}/confirm", as: RoutePlanner }
          trigger:
            - { call: "POST /wholesale/orders/${ord}/mark-delivered", as: WarehouseOps }
          assert:
            - "ReplenishmentOrder.${ord}.order_total_cents == 0   # max(0, 1000-1500)"
            - "ReplenishmentOrder.${ord}.promo_discount_cents == 1000"
            - "ReplenishmentOrder.${ord}.provisional_margin_per_vend_cents == 150   # round_half_up((150*10*1 - 0)/10)"
            - "after mark-delivered: settlement_status == SETTLED (amount_due 0 auto-settles, never stops at OPEN)"
            - "ReplenishmentOrder.${ord}.amount_due_cents == 0"

      - name: realized_margin_zero_units_vended
        claim_type: boundary_edge
        grounds:
          - "calculations.margin_per_vend"
        distinguishing_aspect: "Settlement DEX event with zero total units_vended yields realized_margin_per_vend_cents == 0 (pinned no-division branch), while cashless_fee_cents is still computed from cashless sales (round_half_up(1000*275/10000) = 28)."
        test_recipe:
          setup: ["order 1 case base 1000 delivered; settlement event with items [] and cashless_sales 1000"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Zero" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-ZRO", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "ZRO-1", name: "Zero item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Zero", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-Zero", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 10, vend_price_cents: 150 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id } }
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${op}" }
            - { call: "POST /wholesale/orders/${ord}/confirm", as: RoutePlanner }
            - { call: "POST /wholesale/orders/${ord}/mark-delivered", as: WarehouseOps }
            - { call: "POST /wholesale/telemetry-events", payload: { location_id: "${loc}", recorded_at: "2026-08-04T09:00:00Z", cash_collected_cents: 500, cashless_sales_cents: 1000, items: [] }, as: TelemetryGateway, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /wholesale/orders/${ord}/settle", payload: { tender_type: "CASHLESS", telemetry_event_id: "${ev}" }, as: WholesaleAdmin }
          assert:
            - "ReplenishmentOrder.${ord}.cashless_fee_cents == 28   # round_half_up(1000*275/10000)=round_half_up(27.5)"
            - "ReplenishmentOrder.${ord}.realized_margin_per_vend_cents == 0   # units_vended == 0 branch"
            - "ReplenishmentOrder.${ord}.settlement_status == SETTLED"

      - name: cashless_fee_rounding_half_up
        claim_type: precision
        grounds:
          - "calculations.margin_per_vend"
        distinguishing_aspect: "Cashless fee rounds half-up at the half-cent boundary; already exercised with 900 -> 25."
        excluded_because:
          difficulty_instance: dual_variant_calc / margin_per_vend_provisional_vs_realized
          rationale: "That instance pins cashless_fee_cents == 25 from round_half_up(24.75) — the precision claim is asserted there."

  # ============================================================ validations
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers fails priority-1 auth with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) even on a trivially valid endpoint."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /wholesale/operators", as: WholesaleAdmin, captures: { err: $.data.error_id } }
          assert:
            - "request sent WITHOUT X-User-ID and X-User-Role headers -> error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: missing_auth_beats_not_found
        claim_type: priority_ordering
        grounds:
          - "validations[priority=1]"
          - "validations[priority=4]"
        distinguishing_aspect: "Priority conflict auth vs existence: a headerless GET on a non-existent order returns ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, not ERR_ORDER_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /wholesale/orders/77777777-7777-7777-7777-777777777777", as: WholesaleAdmin, captures: { err: $.data.error_id } }
          assert:
            - "request sent WITHOUT headers -> error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER   # priority 1 beats priority 5"

      - name: submit_nonexistent_order_returns_not_found
        claim_type: priority_ordering
        grounds:
          - "validations[priority=4]"
          - "validations[priority=7]"
          - "errors[ERR_ORDER_NOT_FOUND]"
        distinguishing_aspect: "Existence beats state: submit on a non-existent order id returns ERR_ORDER_NOT_FOUND (404), never a state error."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /wholesale/orders/77777777-7777-7777-7777-777777777777/submit", as: OperatorManager, as_user_id: "11111111-1111-1111-1111-111111111111", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ORDER_NOT_FOUND"

      - name: operator_manager_cannot_touch_other_operators_order
        claim_type: cross_entity_validation
        grounds:
          - "validations[priority=5]"
          - "roles[OperatorManager].identity"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Ownership check: OperatorManager of operator B submitting operator A's (existing, valid, DRAFT) order fails ERR_FORBIDDEN at priority 4 — before any state or business rule."
        test_recipe:
          setup: ["operator A with a ready-to-submit DRAFT order; operator B exists with no resources"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op A-own" }, as: WholesaleAdmin, captures: { opA: $.data.id } }
            - { call: "POST /wholesale/operators", payload: { name: "Op B-own" }, as: WholesaleAdmin, captures: { opB: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-OWN", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "OWN-1", name: "Own item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${opA}", name: "L-A", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id } }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${opA}", captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /wholesale/orders/${ord}/submit", as: OperatorManager, as_user_id: "${opB}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN   # X-User-ID ${opB} != order.operator_id ${opA}"
            - "ReplenishmentOrder.${ord}.fulfillment_status == DRAFT"

      - name: order_create_zero_quantity_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_INVALID_QUANTITY]"
        distinguishing_aspect: "quantity_cases 0 is a shape violation (ERR_INVALID_QUANTITY, 400) at priority 2 — before existence or state checks."
        test_recipe:
          setup: ["operator + route + location + product exist"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Qty" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-QTY", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "QTY-1", name: "Qty item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Qty", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id } }
          trigger:
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 0 }] }, as: OperatorManager, as_user_id: "${op}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_QUANTITY"

  # ============================================================ endpoints
  - section: endpoints
    instances:
      - name: patch_draft_order_updates_lines_and_bumps_version
        claim_type: standard_action
        grounds:
          - "concurrency_rules[order-patch-stale-version]"
          - "endpoints.PATCH /wholesale/orders/{orderId}"
        distinguishing_aspect: "PATCH with the correct expected_order_version succeeds: lines replaced, total_cases recomputed to 3, version increments by exactly 1 (v1 -> v2)."
        test_recipe:
          setup: ["DRAFT order with 1 case (version 1)"]
          setup_api_calls:
            - { call: "POST /wholesale/operators", payload: { name: "Op Patch" }, as: WholesaleAdmin, captures: { op: $.data.id } }
            - { call: "POST /wholesale/routes", payload: { route_code: "R-PATCH", delivery_weekdays: ["MON"], daily_case_capacity: 50, min_order_cents: 0 }, as: WholesaleAdmin, captures: { rt: $.data.id } }
            - { call: "POST /wholesale/products", payload: { sku: "PTC-1", name: "Patch item", category: "SNACK", eligible_location_types: ["OFFICE"], case_pack_qty: 10, base_price_cents: 1000, cost_cents: 600, shelf_life_days: 90 }, as: WholesaleAdmin, captures: { pr: $.data.id } }
            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-Patch", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id } }
            - { call: "POST /wholesale/orders", payload: { location_id: "${loc}", requested_delivery_date: "2026-08-03", lines: [{ product_id: "${pr}", quantity_cases: 1 }] }, as: OperatorManager, as_user_id: "${op}", captures: { ord: $.data.id, ord_v: $.data.version } }
          trigger:
            - { call: "PATCH /wholesale/orders/${ord}", payload: { expected_order_version: "${ord_v}", lines: [{ product_id: "${pr}", quantity_cases: 3 }] }, as: OperatorManager, as_user_id: "${op}" }
          assert:
            - "ReplenishmentOrder.${ord}.total_cases == 3"
            - "ReplenishmentOrder.${ord}.version == ${ord_v} + 1"
            - "ReplenishmentOrder.${ord}.fulfillment_status == DRAFT"

