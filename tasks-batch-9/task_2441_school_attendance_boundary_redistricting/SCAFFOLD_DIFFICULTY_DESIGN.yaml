scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: projection_variant_divergence_cohort_survival_vs_development_weighted
    grounds:
    - calculations.area_enrollment_projection
    - entities.ProjectionRun.fields.variant
    - entities.ProjectionRun.fields.area_projections
    - entities.ProjectionRun.fields.projected_total_students
    - concurrency_rules[projection-run-create-stale-study]
    distinguishing_aspect: 'This instance''s variant switch lives in the ENROLLMENT-PROJECTION domain (ProjectionRun): the two variants differ by the DEVELOPMENT INCLUSION SET plus entitlement/occupancy weighting, so identical study data yields projected_total_students 638 under COHORT_SURVIVAL and 646 under DEVELOPMENT_WEIGHTED - a 8-student delta that no single-variant implementation can produce.'
    test_recipe:
      setup:
      - Study 'Riverbend USD / 2028 Elementary Boundary Study' is DATA_LOCKED with horizon_years 5, two ACTIVE ELEMENTARY schools and three ELEMENTARY planning areas (resident counts 300 / 200 / 150).
      - Logical clock is pinned at 2026-09-01T00:00:00Z, so PROJECTION_EPOCH = 2026-09-01 and horizon_end = 2026-09-01 + 5*365 days = 2031-08-31.
      - 'Housing pipeline: ''Willow Ridge'' on A-01 is SINGLE_FAMILY / 120 units / first occupancy 2027-01-01 / 24-month buildout, advanced to UNDER_CONSTRUCTION; ''Maple Flats'' on A-02 is MULTI_FAMILY / 200 units / 2027-03-01 / 20 months, still PROPOSED; ''Juniper Commons'' on A-03 is TOWNHOME / 90 units / 2031-01-01 / 36 months, still PROPOSED (its buildout runs past horizon_end, so occupancy is fractional).'
      - No ProjectionRun exists yet.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: DistrictPlanner
        as_user_id: planner-1
      - call: POST /redistricting/studies
        payload:
          name: 2028 Elementary Boundary Study
          district_name: Riverbend USD
          target_school_year: 2028
          horizon_years: 5
          capacity_target_low_pct: 85.0
          capacity_target_high_pct: 100.0
          portables_count_toward_capacity: true
          required_program_types:
          - DUAL_LANGUAGE
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          st_id: $.data.id
      - call: POST /redistricting/studies/${st_id}/schools
        payload:
          name: Cedar Elementary
          level: ELEMENTARY
          core_capacity_seats: 500
          portable_capacity_seats: 40
          program_types:
          - DUAL_LANGUAGE
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          s1_id: $.data.id
      - call: POST /redistricting/studies/${st_id}/schools
        payload:
          name: Birch Elementary
          level: ELEMENTARY
          core_capacity_seats: 400
          portable_capacity_seats: 0
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          s2_id: $.data.id
      - call: POST /redistricting/planning-areas
        payload:
          study_id: ${st_id}
          area_code: A-01
          grade_band: ELEMENTARY
          current_school_id: ${s1_id}
          resident_student_count: 300
          frl_student_count: 90
          ell_student_count: 40
          median_household_income_usd: 78000
          annual_absorption_cap_units: 120
          travel_options:
          - school_id: ${s1_id}
            walk_distance_miles: 0.6
            bus_minutes: 10
            has_safe_route: true
          - school_id: ${s2_id}
            walk_distance_miles: 2.2
            bus_minutes: 22
            has_safe_route: false
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          a1_id: $.data.id
      - call: POST /redistricting/planning-areas
        payload:
          study_id: ${st_id}
          area_code: A-02
          grade_band: ELEMENTARY
          current_school_id: ${s1_id}
          resident_student_count: 200
          frl_student_count: 100
          ell_student_count: 30
          median_household_income_usd: 52000
          annual_absorption_cap_units: 150
          travel_options:
          - school_id: ${s1_id}
            walk_distance_miles: 1.4
            bus_minutes: 9
            has_safe_route: false
          - school_id: ${s2_id}
            walk_distance_miles: 0.8
            bus_minutes: 12
            has_safe_route: true
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          a2_id: $.data.id
      - call: POST /redistricting/planning-areas
        payload:
          study_id: ${st_id}
          area_code: A-03
          grade_band: ELEMENTARY
          current_school_id: ${s2_id}
          resident_student_count: 150
          frl_student_count: 30
          ell_student_count: 10
          median_household_income_usd: 96000
          annual_absorption_cap_units: 90
          travel_options:
          - school_id: ${s1_id}
            walk_distance_miles: 3.0
            bus_minutes: 26
            has_safe_route: false
          - school_id: ${s2_id}
            walk_distance_miles: 0.9
            bus_minutes: 14
            has_safe_route: true
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          a3_id: $.data.id
      - call: POST /redistricting/area-adjacencies
        payload:
          area_id: ${a1_id}
          neighbor_area_id: ${a2_id}
          shared_boundary_length_ft: 5200
        as: DistrictPlanner
        as_user_id: planner-1
      - call: POST /redistricting/area-adjacencies
        payload:
          area_id: ${a2_id}
          neighbor_area_id: ${a3_id}
          shared_boundary_length_ft: 4100
        as: DistrictPlanner
        as_user_id: planner-1
      - call: POST /redistricting/studies/${st_id}/lock-data
        payload: {}
        as: DistrictPlanner
        as_user_id: planner-1
      - call: POST /redistricting/planning-areas/${a1_id}/housing-developments
        payload:
          name: Willow Ridge
          unit_type: SINGLE_FAMILY
          total_units: 120
          first_occupancy_date: '2027-01-01T00:00:00Z'
          buildout_months: 24
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          d1_id: $.data.id
      - call: POST /redistricting/housing-developments/${d1_id}/entitlement-advance
        payload:
          to_status: ENTITLED
        as: DistrictPlanner
        as_user_id: planner-1
      - call: POST /redistricting/housing-developments/${d1_id}/entitlement-advance
        payload:
          to_status: PERMITTED
        as: DistrictPlanner
        as_user_id: planner-1
      - call: POST /redistricting/housing-developments/${d1_id}/entitlement-advance
        payload:
          to_status: UNDER_CONSTRUCTION
        as: DistrictPlanner
        as_user_id: planner-1
      - call: POST /redistricting/planning-areas/${a2_id}/housing-developments
        payload:
          name: Maple Flats
          unit_type: MULTI_FAMILY
          total_units: 200
          first_occupancy_date: '2027-03-01T00:00:00Z'
          buildout_months: 20
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          d2_id: $.data.id
      - call: POST /redistricting/planning-areas/${a3_id}/housing-developments
        payload:
          name: Juniper Commons
          unit_type: TOWNHOME
          total_units: 90
          first_occupancy_date: '2031-01-01T00:00:00Z'
          buildout_months: 36
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          d3_id: $.data.id
      trigger:
      - call: GET /redistricting/studies/${st_id}
        payload: {}
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          st_v1: $.data.version
      - call: POST /redistricting/studies/${st_id}/projection-runs
        payload:
          variant: COHORT_SURVIVAL
          expected_study_version: ${st_v1}
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          run_cs_id: $.data.id
      - call: GET /redistricting/studies/${st_id}
        payload: {}
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          st_v2: $.data.version
      - call: POST /redistricting/studies/${st_id}/projection-runs
        payload:
          variant: DEVELOPMENT_WEIGHTED
          expected_study_version: ${st_v2}
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          run_dw_id: $.data.id
      assert:
      - ProjectionRun.${run_cs_id}.variant == COHORT_SURVIVAL and ProjectionRun.${run_cs_id}.status == COMPLETE
      - ProjectionRun.${run_dw_id}.variant == DEVELOPMENT_WEIGHTED and ProjectionRun.${run_dw_id}.status == COMPLETE
      - ProjectionRun.${run_cs_id}.status is still COMPLETE after the second run is created (SUPERSEDED applies only to an earlier run of the SAME variant)
      - ProjectionRun.${run_cs_id}.projected_total_students == 638
      - ProjectionRun.${run_dw_id}.projected_total_students == 646
      - ProjectionRun.${run_cs_id}.area_projections entry for area_id ${a1_id} has base_students == 271, development_students == 50.40, projected_students == 321
      - ProjectionRun.${run_cs_id}.area_projections entry for area_id ${a2_id} has base_students == 181, development_students == 0.00, projected_students == 181
      - ProjectionRun.${run_cs_id}.area_projections entry for area_id ${a3_id} has base_students == 136, development_students == 0.00, projected_students == 136
      - ProjectionRun.${run_dw_id}.area_projections entry for area_id ${a1_id} has development_students == 50.40 and projected_students == 321
      - ProjectionRun.${run_dw_id}.area_projections entry for area_id ${a2_id} has development_students == 6.50 and projected_students == 188
      - ProjectionRun.${run_dw_id}.area_projections entry for area_id ${a3_id} has development_students == 1.25 and projected_students == 137
      - ProjectionRun.${run_dw_id}.projected_total_students - ProjectionRun.${run_cs_id}.projected_total_students == 8
      - BoundaryStudy.${st_id}.status == SCENARIO_DEVELOPMENT (the first COMPLETE run auto-advanced the study)
  - name: impact_index_variant_divergence_resident_vs_projected
