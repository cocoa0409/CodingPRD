scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: engineering_estimate_vs_final_diverge_on_overtime
        grounds:
          - calculations.engineering_charge
          - state_machines.EngineerAssignment.ASSIGNED_to_RELEASED
          - entities.EngineerAssignment.fields.scheduled_hours
          - entities.EngineerAssignment.fields.billed_hours
        distinguishing_aspect: |
          The forward-looking assignment_estimate variant (scheduled_hours only)
          and the chronological assignment_final variant (scheduled_hours + rounded
          overtime hours) produce different EngineerAssignment.charge_cents for the
          SAME assignment — 28000 at assignment time, 30000 after check-out records
          15 billable overtime minutes. This dual-variant logic operates on the
          EngineerAssignment (labor) domain.
        test_recipe:
          setup:
            - "studio (deposit_pct 0.60, overtime_grace 10, overtime_multiplier 1.5), room (hourly 6000), engineer (rate 8000), client"
            - "HOURLY booking 09:00->12:30 (3.5h), deposit 14400 paid, CONFIRMED, checked in, then checked out at 12:55 (15 billable overtime min after grace)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs", deposit_pct: 0.60, overtime_multiplier: 1.5, overtime_grace_minutes: 10, cancellation_tier_hours: 48, late_cancel_fee_pct: 0.25 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000, block_hours: 8, turnaround_minutes: 30 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/engineers"
              payload: { studio_id: "${studio_id}", full_name: "Sam Senior", tier: "SENIOR", hourly_rate_cents: 8000 }
              as: StudioManager
              captures: { eng_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "The Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id, deposit_due: $.data.deposit_due_cents }
            - call: "POST /studio/bookings/${booking_id}/engineer-assignments"
              payload: { engineer_id: "${eng_id}" }
              as: StudioManager
              captures: { assign_id: $.data.id, est_charge: $.data.charge_cents }
            - call: "POST /studio/bookings/${booking_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 14400 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/bookings/${booking_id}/confirm"
              payload: {}
              as: StudioManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T09:05:00Z" }
              as: StudioManager
            - call: "POST /studio/bookings/${booking_id}/check-in"
              payload: {}
              as: StudioManager
          trigger:
            - call: "POST /studio/bookings/${booking_id}/check-out"
              payload: { actual_end_at: "2026-07-10T12:55:00Z" }
              as: StudioManager
          assert:
            - "EngineerAssignment.${assign_id}.charge_cents == 28000 immediately after assignment (estimate variant)"
            - "EngineerAssignment.${assign_id}.scheduled_hours == 3.5"
            - "EngineerAssignment.${assign_id}.billed_hours == 3.75 after check-out"
            - "EngineerAssignment.${assign_id}.charge_cents == 30000 after check-out (final variant)"
      - name: cancellation_held_full_vs_confirmed_tiered_refund
        grounds:
          - calculations.cancellation_refund
          - state_machines.Booking.HELD_to_CANCELLED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - entities.Booking.fields.base_charge_cents
        distinguishing_aspect: |
          The held_full_refund variant always refunds amount_paid in full, while the
          confirmed_tiered variant retains late_cancel_fee_pct of base_charge inside
          the partial tier — same deposit (14400) yields a 14400 refund when cancelled
          while HELD but only an 8400 refund when cancelled while CONFIRMED inside the
          partial tier. This dual-variant logic operates on the Booking (refund) domain,
          a different entity from instance 1's EngineerAssignment.
        test_recipe:
          setup:
            - "studio (deposit_pct 0.60, late_cancel_fee_pct 0.25, cancellation_tier_hours 48), room, client"
            - "two HOURLY bookings 09:00->12:30 (base 24000, deposit 14400); booking_held cancelled while HELD after deposit; booking_conf confirmed then cancelled 1h before start (partial tier)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs", deposit_pct: 0.60, cancellation_tier_hours: 48, late_cancel_fee_pct: 0.25 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "The Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_held: $.data.id }
            - call: "POST /studio/bookings/${booking_held}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 14400 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-20T09:00:00Z", end_at: "2026-07-20T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_conf: $.data.id }
            - call: "POST /studio/bookings/${booking_conf}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 14400 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/bookings/${booking_conf}/confirm"
              payload: {}
              as: StudioManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-20T08:00:00Z" }
              as: StudioManager
          trigger:
            - call: "POST /studio/bookings/${booking_held}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/bookings/${booking_conf}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          assert:
            - "Booking.${booking_held} REFUND Payment.amount_cents == 14400 (held_full_refund variant)"
            - "Booking.${booking_conf} REFUND Payment.amount_cents == 8400 (confirmed_tiered: 14400 - round_half_up(24000*0.25)=6000)"

  # =================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: overtime_surcharge_multi_input_nonlinear_mode_a
        grounds:
          - calculations.overtime_surcharge
          - state_machines.Booking.IN_SESSION_to_COMPLETED
          - entities.OvertimeRecord.fields.room_surcharge_cents
          - entities.OvertimeRecord.fields.engineer_surcharge_cents
        distinguishing_aspect: |
          Mode (a): overtime_cents is a >=3-input non-linear formula combining
          (actual_end - end), the grace subtraction, the room hourly rate, the studio
          overtime_multiplier, AND a per-assignment sum with its own quarter-hour ceil
          — room_surcharge=2250 + engineer_surcharge=2000 = 4250 for 15 billable minutes.
          Grace is subtracted from raw minutes BEFORE the /60 conversion.
        test_recipe:
          setup:
            - "studio (overtime_grace 10, overtime_multiplier 1.5), room (hourly 6000), engineer (rate 8000), client"
            - "HOURLY booking 09:00->12:30, deposit paid, confirmed, checked in, one engineer assigned"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs", deposit_pct: 0.60, overtime_multiplier: 1.5, overtime_grace_minutes: 10 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/engineers"
              payload: { studio_id: "${studio_id}", full_name: "Sam", tier: "STAFF", hourly_rate_cents: 8000 }
              as: StudioManager
              captures: { eng_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /studio/bookings/${booking_id}/engineer-assignments"
              payload: { engineer_id: "${eng_id}" }
              as: StudioManager
            - call: "POST /studio/bookings/${booking_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 14400 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/bookings/${booking_id}/confirm"
              payload: {}
              as: StudioManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T09:05:00Z" }
              as: StudioManager
            - call: "POST /studio/bookings/${booking_id}/check-in"
              payload: {}
              as: StudioManager
          trigger:
            - call: "POST /studio/bookings/${booking_id}/check-out"
              payload: { actual_end_at: "2026-07-10T12:55:00Z" }
              as: StudioManager
              captures: { ot_cents: $.data.overtime_cents }
          assert:
            - "Booking.${booking_id}.overtime_cents == 4250"
            - "OvertimeRecord(booking ${booking_id}).overage_minutes == 15"
            - "OvertimeRecord(booking ${booking_id}).room_surcharge_cents == 2250"
            - "OvertimeRecord(booking ${booking_id}).engineer_surcharge_cents == 2000"
      - name: engineering_charge_quarter_hour_then_cents_rounding_order_mode_b
        grounds:
          - calculations.engineering_charge
          - state_machines.EngineerAssignment.ASSIGNED_to_RELEASED
          - entities.EngineerAssignment.fields.charge_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Hours are ceil-rounded to the
          next quarter-hour FIRST (3h10m -> 3.25h), THEN multiplied by the rate, THEN
          rounded to cents — pinned order yields 26000. Rounding cents-per-minute first
          and summing would give a different figure; the scaffold pins quarter-hour-then-rate.
        test_recipe:
          setup:
            - "studio, room, engineer (rate 8000), client"
            - "HOURLY booking 09:00->12:10 (3h10m duration)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/engineers"
              payload: { studio_id: "${studio_id}", full_name: "Sam", tier: "STAFF", hourly_rate_cents: 8000 }
              as: StudioManager
              captures: { eng_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:10:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /studio/bookings/${booking_id}/engineer-assignments"
              payload: { engineer_id: "${eng_id}" }
              as: StudioManager
              captures: { assign_id: $.data.id, charge: $.data.charge_cents, sched: $.data.scheduled_hours }
          assert:
            - "EngineerAssignment.${assign_id}.scheduled_hours == 3.25 (ceil(3.1667h*4)/4)"
            - "EngineerAssignment.${assign_id}.charge_cents == 26000 (round_half_up(3.25*8000))"

  # =================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_parallel_schedule_and_settlement_dimensions
        grounds:
          - state_machines.Booking.HELD_to_CONFIRMED
          - state_machines.Booking.AWAITING_DEPOSIT_to_DEPOSIT_PAID
          - entities.Booking.fields.schedule_status
          - entities.Booking.fields.settlement_status
        distinguishing_aspect: |
          Booking carries TWO independent state dimensions on one row: schedule_status
          (HELD->CONFIRMED->IN_SESSION) and settlement_status (AWAITING_DEPOSIT->
          DEPOSIT_PAID->BALANCE_DUE). After deposit the booking is (HELD, DEPOSIT_PAID);
          after confirm it is (CONFIRMED, DEPOSIT_PAID) — the money axis did not move.
          This parallel-dimension shape is on the Booking entity.
        test_recipe:
          setup:
            - "studio, room, client; HOURLY booking created (HELD, AWAITING_DEPOSIT)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs", deposit_pct: 0.60 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /studio/bookings/${booking_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 14400 }
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /studio/bookings/${booking_id}/confirm"
              payload: {}
              as: StudioManager
              captures: { sched: $.data.schedule_status, settle: $.data.settlement_status }
          assert:
            - "Booking.${booking_id}.schedule_status == CONFIRMED after confirm"
            - "Booking.${booking_id}.settlement_status == DEPOSIT_PAID (unchanged by confirm; the two axes advance independently)"
      - name: session_delivery_revision_cycle
        grounds:
          - state_machines.SessionDelivery.DELIVERED_to_REVISION_REQUESTED
          - state_machines.SessionDelivery.REVISION_REQUESTED_to_DELIVERED
          - entities.SessionDelivery.fields.revision_round
        distinguishing_aspect: |
          SessionDelivery is cyclic: DELIVERED -> REVISION_REQUESTED -> DELIVERED, with
          revision_round incrementing only on the re-delivery hop. Two revision rounds
          drive revision_round from 0 to 2. This cyclic shape is on the SessionDelivery
          entity, distinct from instance 1's Booking parallel dimensions.
        test_recipe:
          setup:
            - "a COMPLETED + SETTLED booking with an assigned engineer; delivery first DELIVERED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs", deposit_pct: 0.60, overtime_grace_minutes: 10 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/engineers"
              payload: { studio_id: "${studio_id}", full_name: "Sam", tier: "STAFF", hourly_rate_cents: 8000 }
              as: StudioManager
              captures: { eng_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /studio/bookings/${booking_id}/engineer-assignments"
              payload: { engineer_id: "${eng_id}" }
              as: StudioManager
            - call: "POST /studio/bookings/${booking_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 14400 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/bookings/${booking_id}/confirm"
              payload: {}
              as: StudioManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T09:05:00Z" }
              as: StudioManager
            - call: "POST /studio/bookings/${booking_id}/check-in"
              payload: {}
              as: StudioManager
            - call: "POST /studio/bookings/${booking_id}/check-out"
              payload: { actual_end_at: "2026-07-10T12:30:00Z" }
              as: StudioManager
              captures: { total: $.data.total_charge_cents, paid: $.data.amount_paid_cents }
            - call: "POST /studio/bookings/${booking_id}/payments"
              payload: { kind: "BALANCE", amount_cents: 37600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/bookings/${booking_id}/delivery/deliver"
              payload: { file_manifest: [{ name: "mix_v1.wav", size: 1000 }] }
              as: Engineer
              as_user_id: "${eng_id}"
              captures: { delivery_id: $.data.id }
            - call: "POST /studio/bookings/${booking_id}/delivery/request-revision"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/bookings/${booking_id}/delivery/deliver"
              payload: { file_manifest: [{ name: "mix_v2.wav", size: 1100 }] }
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/bookings/${booking_id}/delivery/request-revision"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /studio/bookings/${booking_id}/delivery/deliver"
              payload: { file_manifest: [{ name: "mix_v3.wav", size: 1200 }] }
              as: Engineer
              as_user_id: "${eng_id}"
              captures: { rr: $.data.revision_round, st: $.data.status }
          assert:
            - "SessionDelivery.${delivery_id}.status == DELIVERED after the third deliver"
            - "SessionDelivery.${delivery_id}.revision_round == 2 (incremented on each re-delivery, not on the first deliver)"

  # =================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: lockout_terminate_cascades_to_occurrence_to_assignment_release
        grounds:
          - state_machines.LockoutContract.ACTIVE_to_TERMINATED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.EngineerAssignment.ASSIGNED_to_RELEASED
        distinguishing_aspect: |
          Depth-3 cascade from a LockoutContract terminate: terminate -> each future
          occurrence Booking goes CONFIRMED->CANCELLED -> that booking's
          EngineerAssignment goes ASSIGNED->RELEASED. Each link is caused by the
          previous (contract mutates booking; booking mutation releases its assignment),
          not directly by the terminate call.
        test_recipe:
          setup:
            - "studio, room, client, engineer; ACTIVE lockout (Mon/Wed) with 2 future occurrences; an engineer assigned to one future occurrence"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000, block_hours: 8 }
              as: StudioManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /studio/engineers"
              payload: { studio_id: "${studio_id}", full_name: "Sam", tier: "STAFF", hourly_rate_cents: 8000 }
              as: StudioManager
              captures: { eng_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/lockout-contracts"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", weekday_mask: [1, 3], daily_start_local: "18:00", daily_end_local: "22:00", window_start_date: "2026-07-06T00:00:00Z", window_end_date: "2026-07-08T00:00:00Z" }
              as: StudioManager
              captures: { contract_id: $.data.id }
            - call: "POST /studio/lockout-contracts/${contract_id}/activate"
              payload: { expected_room_version: "${room_v}" }
              as: StudioManager
              captures: { occ_count: $.data.occurrences_generated }
            - call: "GET /studio/bookings?parent_series_id=${contract_id}"
              payload: {}
              as: StudioManager
              captures: { occ1_id: "$.data[0].id" }
            - call: "POST /studio/bookings/${occ1_id}/engineer-assignments"
              payload: { engineer_id: "${eng_id}" }
              as: StudioManager
              captures: { assign_id: $.data.id }
          trigger:
            - call: "POST /studio/lockout-contracts/${contract_id}/terminate"
              payload: {}
              as: StudioManager
          assert:
            - "LockoutContract.${contract_id}.status == TERMINATED"
            - "Room.${room_id}.status == OPEN"
            - "Booking.${occ1_id}.schedule_status == CANCELLED"
            - "EngineerAssignment.${assign_id}.status == RELEASED (released transitively via the cancelled occurrence)"
      - name: booking_cancel_cascades_to_refund_to_wallet_credit
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.Booking.REFUNDING_to_REFUNDED
          - entities.Client.fields.wallet_credit_cents
          - calculations.cancellation_refund
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (booking cancel, not contract
          terminate): cancel -> create REFUND Payment (refund_destination WALLET) ->
          that refund settling increments Client.wallet_credit_cents. The wallet credit
          is caused by the refund payment, which is caused by the cancel.
        test_recipe:
          setup:
            - "studio (deposit_pct 0.60, cancellation_tier_hours 48), room, client; CONFIRMED booking with deposit 14400 paid; cancelled early (full-refund tier) to WALLET"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs", deposit_pct: 0.60, cancellation_tier_hours: 48, late_cancel_fee_pct: 0.25 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /studio/bookings/${booking_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 14400 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/bookings/${booking_id}/confirm"
              payload: {}
              as: StudioManager
          trigger:
            - call: "POST /studio/bookings/${booking_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          assert:
            - "Booking.${booking_id}.schedule_status == CANCELLED"
            - "Booking.${booking_id}.settlement_status == REFUNDED"
            - "a REFUND Payment of amount_cents == 14400 with refund_destination WALLET exists for ${booking_id}"
            - "Client.${client_id}.wallet_credit_cents == 14400 (cascaded from the refund settling)"

  # =================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_state_beats_room_overlap_constraint
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ROOM_UNAVAILABLE]
        distinguishing_aspect: |
          Category pair {state (p5) vs business_constraint (p9)}. A confirm on an
          already-CANCELLED booking that ALSO overlaps a confirmed booking returns
          ERR_INVALID_STATE (p5), not ERR_ROOM_UNAVAILABLE (p9) — state precondition
          is checked before the room-overlap constraint.
        test_recipe:
          setup:
            - "studio, room, client; booking_x cancelled while HELD; another CONFIRMED booking occupies the same overlapping window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs", deposit_pct: 0.60 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { other_id: $.data.id }
            - call: "POST /studio/bookings/${other_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 14400 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/bookings/${other_id}/confirm"
              payload: {}
              as: StudioManager
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T10:00:00Z", end_at: "2026-07-10T11:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_x: $.data.id }
            - call: "POST /studio/bookings/${booking_x}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /studio/bookings/${booking_x}/confirm"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (state p5 wins over the room-overlap business_constraint p9)"
            - "HTTP status == 409"
      - name: ownership_referential_beats_state_on_cancel
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_FORBIDDEN]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Category pair {business_referential (p4) vs state (p5)}, a different pair from
          instance 1. A non-owning Client cancels a booking that is also already
          CANCELLED: ownership (p4) is checked before state (p5), so ERR_FORBIDDEN wins
          over ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "studio, room, two clients (owner + intruder); owner's booking already cancelled while HELD"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs", deposit_pct: 0.60 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Owner", email: "owner@x.com" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Intruder", email: "intruder@x.com" }
              as: Anonymous
              captures: { intruder_id: $.data.id }
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${owner_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Client
              as_user_id: "${owner_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /studio/bookings/${booking_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /studio/bookings/${booking_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${intruder_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN (business_referential p4 wins over state p5)"
            - "HTTP status == 403"

  # =================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: overtime_grace_exact_boundary_no_charge_on_checkout
        grounds:
          - calculations.overtime_surcharge
          - state_machines.Booking.IN_SESSION_to_COMPLETED
          - entities.OvertimeRecord.fields.overage_minutes
        distinguishing_aspect: |
          Boundary on the overtime-minutes metric reached through POST check-out: an
          actual_end exactly grace (10) minutes past end_at yields overage_minutes == 0
          and overtime_cents == 0 (raw - grace == 0, not > 0), while 11 minutes yields
          overage_minutes == 1. The threshold is strict-greater-than grace.
        test_recipe:
          setup:
            - "studio (overtime_grace 10), room (hourly 6000), client; booking checked in"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs", deposit_pct: 0.60, overtime_grace_minutes: 10, overtime_multiplier: 1.5 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
