scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: allocation_share_provisional_vs_final_surplus_carryover
        grounds:
          - calculations.allocation_share
          - entities.DealerModelLine.fields.earned_credit_units
          - state_machines.AllocationRun.DRAFT_to_PUBLISHED
          - state_machines.AllocationRun.PUBLISHED_to_LOCKED
        distinguishing_aspect: |
          The allocation_share calculation has a provisional variant (publish:
          writes base_units) and a final variant (lock: recomputes surplus and
          writes DealerModelLine.earned_credit_units for the next run). Same
          run data, two evaluation contexts, different persisted results:
          after lock, dealer A's earned_credit_units is 6 (surplus want 12 -
          consumed 6) while its provisional base_units stayed 6 — the domain
          here is DealerAllocation / DealerModelLine (allocation).
        test_recipe:
          setup:
            - "Region R1 ACTIVE with dealers A (opened 2020-01-01), B (2020-01-01), C (2026-06-01, new point), D (2020-01-01)"
            - "Model line L; run r1: period 2026-09, base_units 12, lookback [2026-06-01, 2026-09-01), retail_priority_pct 50"
            - "Lookback sales preloaded via a prior superseded run r0: A 6 delivered, B 2, C 1, D 1"
            - "DealerModelLine avg inventory at publish: A=2, B=4, C=0, D=1"
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "R1", name: "Region One" }
              as: RegionalAllocator
              captures: { r1_id: $.data.id }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${r1_id}", dealer_code: "D-A", name: "Dealer A", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { d_a: $.data.id }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${r1_id}", dealer_code: "D-B", name: "Dealer B", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { d_b: $.data.id }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${r1_id}", dealer_code: "D-C", name: "Dealer C", opened_on: "2026-06-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { d_c: $.data.id }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${r1_id}", dealer_code: "D-D", name: "Dealer D", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { d_d: $.data.id }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "L1", name: "Line One" }
              as: RegionalAllocator
              captures: { l1_id: $.data.id }
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-06", model_line_id: "${l1_id}", base_units: 10, lookback_start: "2026-03-01T00:00:00Z", lookback_end: "2026-06-01T00:00:00Z", retail_priority_pct: 0 }
              as: RegionalAllocator
              captures: { run0_id: $.data.id }
            - call: "POST /wholesale/allocation-runs/${run0_id}/publish"
              payload: {}
              as: RegionalAllocator
            - call: "GET /wholesale/allocation-runs/${run0_id}/dealer-allocations"
              payload: { dealer_id: "${d_a}" }
              as: RegionalAllocator
              captures: { da0_a: "$.data[0].id", da0_a_v: "$.data[0].version "}
            - call: "GET /wholesale/allocation-runs/${run0_id}/dealer-allocations"
              payload: { dealer_id: "${d_b}" }
              as: RegionalAllocator
              captures: { da0_b: "$.data[0].id", da0_b_v: "$.data[0].version "}
            - call: "POST /wholesale/orders"
              payload: { dealer_id: "${d_a}", model_line_id: "${l1_id}", run_id: "${run0_id}", order_kind: "STOCK", expected_dealer_allocation_version: "${da0_a_v}", configuration: { trim: "XLT", commodity_codes: [] } }
              as: Dealer
              as_user_id: "${d_a}"
              captures: { o0_a1: $.data.id }
            - call: "POST /wholesale/orders"
              payload: { dealer_id: "${d_b}", model_line_id: "${l1_id}", run_id: "${run0_id}", order_kind: "STOCK", expected_dealer_allocation_version: "${da0_b_v}", configuration: { trim: "XLT", commodity_codes: [] } }
              as: Dealer
              as_user_id: "${d_b}"
              captures: { o0_b1: $.data.id }
          trigger:
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-09", model_line_id: "${l1_id}", base_units: 12, lookback_start: "2026-06-01T00:00:00Z", lookback_end: "2026-09-01T00:00:00Z", retail_priority_pct: 50 }
              as: RegionalAllocator
              captures: { run1_id: $.data.id }
            - call: "POST /wholesale/allocation-runs/${run1_id}/publish"
              payload: {}
              as: RegionalAllocator
          assert:
            - "DealerAllocation(run1, A).base_units == 6"
            - "DealerAllocation(run1, B).base_units == 1"
            - "DealerAllocation(run1, C).base_units == 1 and final_units == 2 (new-point floor)"
            - "DealerAllocation(run1, C).retail_reserved_units == 1 (round_half_up(2 * 50 / 100))"
            - "provisional variant: base_units written at publish; earned_credit_units untouched (still 0) until run1 locks"

      - name: incentive_accrual_provisional_vs_final_freeze
        grounds:
          - calculations.incentive_accrual
          - state_machines.VehicleOrder.BUILT_to_DELIVERED
        distinguishing_aspect: |
          incentive_accrual operates on the IncentiveProgram / VehicleOrder
          domain (money, not units). The provisional variant accrues per
          delivery and can shift as volume tiers straddle; the final variant
          freezes at program close. Same deliveries, two contexts: before
          close the accrual is provisional and recomputed; after close the
          same GET returns the frozen figure and further deliveries in the
          window do not change it. Entity domain differs from instance 1
          (incentive money vs allocation units).
        test_recipe:
          setup:
            - "Region/dealer/line as fixtures; VOLUME_BONUS program with tier1_threshold 3 (bonus 500 cents), tier2_threshold 5 (bonus 900 cents), window [2026-09-01, 2026-12-01)"
            - "Dealer has 3 delivered orders in window (accrual 0) and a 4th about to deliver"
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "R9", name: "Region Nine" }
              as: RegionalAllocator
              captures: { r9_id: $.data.id }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${r9_id}", dealer_code: "D-Z", name: "Dealer Z", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { d_z: $.data.id }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "L9", name: "Line Nine" }
              as: RegionalAllocator
              captures: { l9_id: $.data.id }
            - call: "POST /wholesale/incentive-programs"
              payload: { code: "VB1", model_line_id: "${l9_id}", kind: "VOLUME_BONUS", params: { tier1_threshold: 3, tier1_bonus_cents: 500, tier2_threshold: 5, tier2_bonus_cents: 900 }, window_start: "2026-09-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /wholesale/incentive-programs/${prog_id}/close"
              payload: {}
              as: RegionalAllocator
            - call: "GET /wholesale/incentive-programs/${prog_id}/accruals"
              payload: { dealer_id: "${d_z}" }
              as: RegionalAllocator
          assert:
            - "after close with S == 4 deliveries in window: amount_cents == 500 (marginal: (4-3) * 500), variant == 'final'"
            - "a 5th in-window delivery after close does NOT change the frozen 500"
            - "provisional read before close with S == 3 would have been 0; the 4th delivery flips the tier"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: allocation_share_waterfall_nonlinear_floor_carryover
        grounds:
          - calculations.allocation_share
          - calculations.new_point_floor
        distinguishing_aspect: |
          Mode (a): allocation_share has >= 3 inputs (sales, inventory turn,
          pool, earned carryover) with non-linear interaction — nested min()
          in the waterfall, floor() per dealer before distribution, and a
          max() floor for new points. Dealer A's raw share 0.578182 * 12
          floors to 6; the remaining 3 pool units are NOT redistributed
          (waterfall takes min(want, remaining)), so sum(taken)=9 of 12 —
          proving the floor-then-waterfall order is pinned and the remainder
          strands rather than cascading.
        test_recipe:
          setup:
            - "Same fixture as allocation_share_provisional_vs_final_surplus_carryover: 4 dealers, pool 12, raw shares A 0.578182 / B 0.156364 / C 0.132727 / D 0.132727"
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "R1", name: "Region One" }
              as: RegionalAllocator
              captures: { r1_id: $.data.id }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${r1_id}", dealer_code: "D-A", name: "Dealer A", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { d_a: $.data.id }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "L1", name: "Line One" }
              as: RegionalAllocator
              captures: { l1_id: $.data.id }
          trigger:
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-09", model_line_id: "${l1_id}", base_units: 12, lookback_start: "2026-06-01T00:00:00Z", lookback_end: "2026-09-01T00:00:00Z", retail_priority_pct: 50 }
              as: RegionalAllocator
              captures: { run1_id: $.data.id }
            - call: "POST /wholesale/allocation-runs/${run1_id}/publish"
              payload: {}
              as: RegionalAllocator
          assert:
            - "sum of base_units across the 4 dealers == 9, not 12: floor-per-dealer truncates before the waterfall and the min() caps each take"
            - "DealerAllocation(A).base_units == floor(0.578182 * 12) == 6 exactly"

      - name: commodity_cap_circular_evaluation_order
        grounds:
          - calculations.commodity_cap
        distinguishing_aspect: |
          Mode (c): commodity_cap has a circular-looking dependency — the cap
          on the (A+1)th order depends on A and F, which themselves change on
          accept. The scaffold pins evaluation with PRE-accept A and F against
          post-accept counts: F+1 <= floor((A+1)*rate/100). At rate 50 with
          A=0, F=0 the first feature order is REJECTED (1 <= floor(0.5) = 0 is
          false); the naive variant (evaluate F <= floor(A*rate/100) after
          incrementing) would accept it. Different mode than instance 1
          (order-of-evaluation, not non-linear inputs).
        test_recipe:
          setup:
            - "Dealer with 4-unit allocation on a published run; commodity MOONROOF restricted on the line at install_rate_pct 50, allow_partial_build true"
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "R2", name: "Region Two" }
              as: RegionalAllocator
              captures: { r2_id: $.data.id }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${r2_id}", dealer_code: "D-E", name: "Dealer E", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { d_e: $.data.id }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "L2", name: "Line Two" }
              as: RegionalAllocator
              captures: { l2_id: $.data.id }
            - call: "POST /wholesale/commodities"
              payload: { code: "MOONROOF", name: "Moonroof" }
              as: CommodityManager
              captures: { c_moon: $.data.id }
            - call: "POST /wholesale/commodity-restrictions"
              payload: { commodity_id: "${c_moon}", model_line_id: "${l2_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: null, install_rate_pct: 50, allow_partial_build: true }
              as: CommodityManager
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-09", model_line_id: "${l2_id}", base_units: 4, lookback_start: "2026-06-01T00:00:00Z", lookback_end: "2026-09-01T00:00:00Z", retail_priority_pct: 0 }
              as: RegionalAllocator
              captures: { run2_id: $.data.id }
            - call: "POST /wholesale/allocation-runs/${run2_id}/publish"
              payload: {}
              as: RegionalAllocator
            - call: "GET /wholesale/allocation-runs/${run2_id}/dealer-allocations"
              payload: { dealer_id: "${d_e}" }
              as: RegionalAllocator
              captures: { da_e: "$.data[0].id", da_e_v: "$.data[0].version "}
            - call: "POST /wholesale/orders"
              payload: { dealer_id: "${d_e}", model_line_id: "${l2_id}", run_id: "${run2_id}", order_kind: "STOCK", expected_dealer_allocation_version: "${da_e_v}", configuration: { trim: "XLT", commodity_codes: [] } }
              as: Dealer
              as_user_id: "${d_e}"
              captures: { o_e1: $.data.id }
          trigger:
            - call: "GET /wholesale/allocation-runs/${run2_id}/dealer-allocations"
              payload: { dealer_id: "${d_e}" }
              as: RegionalAllocator
              captures: { da_e_v2: "$.data[0].version "}
            - call: "POST /wholesale/orders"
              payload: { dealer_id: "${d_e}", model_line_id: "${l2_id}", run_id: "${run2_id}", order_kind: "STOCK", expected_dealer_allocation_version: "${da_e_v2}", configuration: { trim: "XLT", commodity_codes: ["MOONROOF"] } }
              as: Dealer
              as_user_id: "${d_e}"
              captures: { o_e2: $.data.id, o_e2_state: $.data.state }
          assert:
            - "order o_e2 (first MOONROOF at A=1, F=0, rate 50) is ACCEPTED: 0+1 <= floor(2*50/100) = 1"
            - "a THIRD order also carrying MOONROOF (A=2, F=1) is REJECTED with ERR_COMMODITY_CAP_EXCEEDED: 1+1 <= floor(3*50/100) = 1 is false"
            - "the reject proves pre-accept evaluation: naive post-accept would compute floor(3*50/100)=1 >= F=1 and wrongly accept"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dealer_trade_counter_loop_and_multi_terminal
        grounds:
          - state_machines.DealerTrade
        distinguishing_aspect: |
          DealerTrade has a cyclic counter loop (PROPOSED -> COUNTERED ->
          PROPOSED) plus FOUR terminal branches (DECLINED, EXPIRED, CANCELLED,
          EXECUTED) reachable from different loop positions — a branching /
          cyclic shape, not a pipeline.
        test_recipe:
          setup:
            - "Two same-region dealers A and B with a PUBLISHED run; trade proposed A->B for 2 units"
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "R3", name: "Region Three" }
              as: RegionalAllocator
              captures: { r3_id: $.data.id }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${r3_id}", dealer_code: "D-F", name: "Dealer F", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { d_f: $.data.id }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${r3_id}", dealer_code: "D-G", name: "Dealer G", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { d_g: $.data.id }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "L3", name: "Line Three" }
              as: RegionalAllocator
              captures: { l3_id: $.data.id }
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-09", model_line_id: "${l3_id}", base_units: 10, lookback_start: "2026-06-01T00:00:00Z", lookback_end: "2026-09-01T00:00:00Z", retail_priority_pct: 0 }
              as: RegionalAllocator
              captures: { run3_id: $.data.id }
            - call: "POST /wholesale/allocation-runs/${run3_id}/publish"
              payload: {}
              as: RegionalAllocator
            - call: "POST /wholesale/dealer-trades"
              payload: { from_dealer_id: "${d_f}", to_dealer_id: "${d_g}", run_id: "${run3_id}", units: 2 }
              as: Dealer
              as_user_id: "${d_f}"
              captures: { tr1: $.data.id }
          trigger:
            - call: "POST /wholesale/dealer-trades/${tr1}/counter"
              payload: { counter_units: 1 }
              as: Dealer
              as_user_id: "${d_g}"
            - call: "POST /wholesale/dealer-trades/${tr1}/counter"
              payload: { counter_units: 2 }
              as: Dealer
              as_user_id: "${d_f}"
            - call: "POST /wholesale/dealer-trades/${tr1}/accept"
              payload: {}
              as: Dealer
              as_user_id: "${d_g}"
          assert:
            - "trade state after loop: PROPOSED -> COUNTERED (B counters 1) -> PROPOSED (A re-counters 2) -> ACCEPTED (B accepts)"
            - "a second accept after ACCEPTED is rejected ERR_INVALID_STATE (accept only from PROPOSED)"
            - "decline from ACCEPTED is rejected ERR_INVALID_STATE (decline only from PROPOSED/COUNTERED)"

      - name: vehicle_order_parallel_build_state_dimension
        grounds:
          - state_machines.VehicleOrder
          - state_machines.VehicleOrderBuildRetrofit
        distinguishing_aspect: |
          VehicleOrder carries TWO independent state dimensions: lifecycle
          state (DRAFT...DELIVERED) and build_state (NOT_APPLICABLE /
          PENDING_RETROFIT / RETROFITTED). A unit can be DELIVERED (terminal
          lifecycle) while still PENDING_RETROFIT, and the retrofit dimension
          later completes — parallel dimensions on one entity, not a branch.
          Different entity than instance 1 (DealerTrade).
        test_recipe:
          setup:
            - "Dealer E fixture from commodity_cap instance; order accepted WITHOUT_FEATURE-eligible line, scheduled, built with build_mode=WITHOUT_FEATURE, shipment delivered; restriction still ACTIVE"
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "R2", name: "Region Two" }
              as: RegionalAllocator
              captures: { r2_id: $.data.id }
            - call: "POST /wholesale/dealers"
              payload: { region_id: "${r2_id}", dealer_code: "D-E", name: "Dealer E", opened_on: "2020-01-01T00:00:00Z" }
              as: RegionalAllocator
              captures: { d_e: $.data.id }
            - call: "POST /wholesale/model-lines"
              payload: { model_code: "L2", name: "Line Two" }
              as: RegionalAllocator
              captures: { l2_id: $.data.id }
            - call: "POST /wholesale/commodities"
              payload: { code: "MOONROOF", name: "Moonroof" }
              as: CommodityManager
              captures: { c_moon: $.data.id }
            - call: "POST /wholesale/commodity-restrictions"
              payload: { commodity_id: "${c_moon}", model_line_id: "${l2_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: null, install_rate_pct: 50, allow_partial_build: true }
              as: CommodityManager
            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-09", model_line_id: "${l2_id}", base_units: 4, lookback_start: "2026-06-01T00:00:00Z", lookback_end: "2026-09-01T00:00:00Z", retail_priority_pct: 0 }
              as: RegionalAllocator
              captures: { run2_id: $.data.id }
            - call: "POST /wholesale/allocation-runs/${run2_id}/publish"
              payload: {}
              as: RegionalAllocator
            - call: "GET /wholesale/allocation-runs/${run2_id}/dealer-allocations"
              payload: { dealer_id: "${d_e}" }
              as: RegionalAllocator
              captures: { da_e: "$.data[0].id", da_e_v: "$.data[0].version "}
            - call: "POST /wholesale/orders"
              payload: { dealer_id: "${d_e}", model_line_id: "${l2_id}", run_id: "${run2_id}", order_kind: "STOCK", expected_dealer_allocation_version: "${da_e_v}", configuration: { trim: "XLT", commodity_codes: [] } }
              as: Dealer
              as_user_id: "${d_e}"
              captures: { o_p1: $.data.id }
            - call: "POST /wholesale/orders"
              payload: { dealer_id: "${d_e}", model_line_id: "${l2_id}", run_id: "${run2_id}", order_kind: "STOCK", expected_dealer_allocation_version: "${da_e_v}", configuration: { trim: "XLT", commodity_codes: ["MOONROOF"] } }
              as: Dealer
              as_user_id: "${d_e}"
              captures: { o_p2: $.data.id }
            - call: "POST /wholesale/orders/${o_p2}/schedule"
              payload: { build_week: "2026-W36" }
              as: ProductionScheduler
            - call: "POST /wholesale/orders/${o_p2}/build"
              payload: { build_mode: "WITHOUT_FEATURE" }
              as: ProductionScheduler
            - call: "POST /wholesale/carriers"
              payload: { code: "CAR1", name: "Carrier One", weekly_capacity: 10 }
              as: LogisticsCoordinator
              captures: { car1: $.data.id }
            - call: "POST /wholesale/shipments"
              payload: { order_id: "${o_p2}", carrier_id: "${car1}", pickup_week: "2026-W36" }
              as: LogisticsCoordinator
              captures: { sh1: $.data.id }
            - call: "POST /wholesale/shipments/${sh1}/pickup"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /wholesale/shipments/${sh1}/deliver"
              payload: {}
              as: LogisticsCoordinator
          trigger:
            - call: "POST /wholesale/commodities/${c_moon}/resolve"
              payload: {}
              as: CommodityManager
            - call: "POST /wholesale/orders/${o_p2}/retrofit"
              payload: {}
              as: ProductionScheduler
          assert:
            - "after build WITHOUT_FEATURE: o_p2.state == BUILT and o_p2.build_state == PENDING_RETROFIT (dimensions diverge)"
            - "after shipment deliver: o_p2.state == DELIVERED (lifecycle terminal) while build_state still PENDING_RETROFIT"
            - "retrofit before resolve is rejected ERR_RETROFIT_BLOCKED; after resolve: build_state == RETROFITTED and a child order with retrofit_of_order_id == o_p2 exists with consumed_units == 0"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers, depth >= 3 and >= 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: shipment_deliver_cascades_order_sales_credit_incentive
        grounds:
          - state_machines.Shipment.PICKED_UP_to_DELIVERED
          - state_machines.VehicleOrder.BUILT_to_DELIVERED
          - calculations.inventory_turn
          - calculations.incentive_accrual
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /shipments/{id}/deliver: Shipment
          PICKED_UP -> DELIVERED (link 1) causes VehicleOrder BUILT ->
          DELIVERED (link 2, caused by the shipment, not the API call), which
          itself causes DealerModelLine.reported_sales_units recompute AND
          incentive_accrual provisional recompute (link 3). Each link is
          caused by the previous link's mutation.
        test_recipe:
          setup:
            - "Dealer with an order in BUILT, shipment PICKED_UP, and an ACTIVE AGED_INVENTORY_CREDIT program whose window covers delivery; dealer's reported_sales_units == 0 before"
          setup_api_calls:
            - call: "POST /wholesale/regions"
              payload: { code: "R4", name: "Region Four" }
              as: RegionalAllocator
              captures: { r4_id: $.data.id }
            - call: "POST /wholesale/dealers"
