            - call: "POST /franchise/clubs/${c1_id}/open"
              payload: {}
              as: FranchiseOwner
              as_user_id: "${f1_id}"
            - call: "POST /franchise/clubs"
              payload: { territory_id: "${t2_id}", name: "Host Club", opened_on: "2021-06-01", guest_fee_cents: 1250 }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /franchise/clubs/${c2_id}/open"
              payload: {}
              as: FranchiseOwner
              as_user_id: "${f1_id}"
            - call: "POST /franchise/plan-templates"
              payload: { code: "CORE12", monthly_dues_cents: 4500, initiation_fee_cents: 4900, term_months: 12, cancellation_notice_days: 30, floor_price_cents: 3600 }
              as: BrandAdministrator
              captures: { pt_id: $.data.id }
            - call: "POST /franchise/plan-templates/${pt_id}/publish"
              payload: {}
              as: BrandAdministrator
            - call: "POST /franchise/members"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@example.com", home_state_code: "CA" }
              as: ClubManager
              as_user_id: "${c1_id}"
              captures: { m1_id: $.data.id }
            - call: "GET /franchise/clubs/${c1_id}"
              payload: {}
              as: BrandAdministrator
              captures: { c1_v: $.data.version }
            - call: "POST /franchise/agreements"
              payload: { member_id: "${m1_id}", home_club_id: "${c1_id}", plan_template_id: "${pt_id}", expected_club_version: "${c1_v}", signed_on: "2026-08-01", multi_club_access: true }
              as: ClubManager
              as_user_id: "${c1_id}"
              captures: { ag1_id: $.data.id }
            - call: "POST /franchise/billing-events"
              payload: { agreement_id: "${ag1_id}", event_type: "DUES_POSTED", amount_cents: 4432, occurred_on: "2026-08-01", due_on: "2026-09-05" }
              as: BillingPartner
            - call: "POST /franchise/billing-events"
              payload: { agreement_id: "${ag1_id}", event_type: "PAYMENT_RECEIVED", amount_cents: 4432, occurred_on: "2026-08-02" }
              as: BillingPartner
            - call: "POST /franchise/guest-usage-events"
