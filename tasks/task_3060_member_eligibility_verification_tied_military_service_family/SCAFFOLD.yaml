  # --- Test-driving endpoints (declared surface, not back-doors) ---------------
  - method: POST
    path: "/membership/_clock/set_current_utc"
    description: "Set the logical clock. Before any call the logical clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["every REGISTERED DeploymentOrder whose start_date <= the new clock auto-activates to ACTIVE (with the Member posture cascade when the member is ACTIVE)", "no other retroactive recomputation"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for the endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, undeclared enum value, or missing resolution_note on survivor close" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Trigger not listed for the resource's current state (includes terminal lockdown and wrong-state transitions)" }
  - { id: ERR_DUPLICATE_EVIDENCE, http: 409, condition: "Evidence (case_id, content_hash) collision" }
  - { id: ERR_DUPLICATE_ORDER, http: 409, condition: "DeploymentOrder orders_number collision" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same officer reconstructed and would approve a case; or member approves own protection claim" }
  - { id: ERR_ADDRESS_OVERLAP, http: 409, condition: "Same-addr_type half-open interval overlap for the member (touching allowed); or effective_to <= effective_from" }
  - { id: ERR_DEPLOYMENT_OVERLAP, http: 409, condition: "Inclusive deployment interval collision for the member (adjacent days conflict); or end_date < start_date" }
  - { id: ERR_INVALID_REFERENCE, http: 422, condition: "FK field in body does not resolve to an existing row" }
  - { id: ERR_LINEAGE_DEPTH_EXCEEDED, http: 422, condition: "sponsor.lineage_depth + 1 > 3" }
  - { id: ERR_LINEAGE_PROOF_INSUFFICIENT, http: 422, condition: "Extended lineage verification failed (adoption/divorce chain)" }
  - { id: ERR_ELIGIBILITY_DERIVATION_FAILED, http: 422, condition: "Basis derivation rule not satisfied (bad paper, no category derivable)" }
  - { id: ERR_PRODUCT_CATEGORY_FORBIDDEN, http: 422, condition: "Offering's allowed_categories lacks the member's eligibility_category or offering retired" }
  - { id: ERR_HOUSEHOLD_NOT_EMPTY, http: 422, condition: "Dissolve attempted with linked ACTIVE/SUSPENDED members" }
  - { id: ERR_SCRA_NOT_ELIGIBLE, http: 422, condition: "RATE_REDUCTION without an ACTIVE scra_eligible deployment order" }
  - { id: ERR_RELIEF_CAP_EXCEEDED, http: 422, condition: "Net relief plus outstanding approved relief exceeds member exposure cap" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_member_version mismatch on OCC-guarded write" }
  - { id: ERR_SPONSOR_NOT_ACTIVE, http: 422, condition: "Family derivation against a non-ACTIVE sponsor" }
  - { id: ERR_BENEFICIARY_NOT_ACTIVE, http: 422, condition: "Survivor grant against a non-ACTIVE beneficiary" }
  - { id: ERR_SERVICE_RECORD_REQUIRED, http: 422, condition: "DIRECT_SERVICE/CADET submit without a service record" }
  - { id: ERR_EVIDENCE_REQUIRED, http: 422, condition: "Submit without any evidence document" }
  - { id: ERR_NO_NEW_EVIDENCE, http: 422, condition: "Resubmit from MORE_INFO_REQUIRED without newly uploaded evidence" }
  - { id: ERR_SERVICE_RECORD_UNVERIFIED, http: 422, condition: "Approval attempted with unverified service records" }
  - { id: ERR_DEPLOYMENT_NOT_ENDED, http: 422, condition: "Complete attempted with end_date in the future relative to the logical clock" }
  - { id: ERR_DEPLOYMENT_END_DATE_REQUIRED, http: 422, condition: "Complete attempted on an open-ended order" }
  - { id: ERR_NO_RELIEF_AVAILABLE, http: 422, condition: "Rate reduction yields zero relief (base rate at/below cap or no periods)" }
  - { id: ERR_REINSTATEMENT_EVIDENCE_REQUIRED, http: 422, condition: "Reinstate without post-loss restoration evidence" }
  - { id: ERR_DUTY_STATION_CONFLICT, http: 409, condition: "Retroactive duty-station change without closing the prior open duty interval" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: EligibilityApplicant
    description: "A person pursuing membership; owns their eligibility cases, service records and evidence."
    identity: opaque
    exclusive_operations:
      - "POST /membership/eligibility-cases"
      - "POST /membership/eligibility-cases/{caseId}/service-records"
      - "POST /membership/eligibility-cases/{caseId}/evidence"
      - "POST /membership/eligibility-cases/{caseId}/submit"
    shared_operations:
      - "GET /membership/eligibility-cases (and by id)"

  - name: VerificationOfficer
    description: "Eligibility adjudicator; decides cases, reconstructs lost records, processes loss/reinstatement, deployment orders and protection claims."
    identity: opaque
    exclusive_operations:
      - "POST /membership/eligibility-cases/{caseId}/decide"
      - "POST /membership/eligibility-cases/{caseId}/record-reconstruction"
      - "POST /membership/members/{memberId}/eligibility-loss"
      - "POST /membership/members/{memberId}/reinstate"
      - "POST /membership/protection-claims/{claimId}/decide"
      - "POST /membership/deployment-orders/{orderId}/complete"
      - "POST /membership/deployment-orders/{orderId}/cancel"
      - "POST /membership/households/{householdId}/dissolve"
    shared_operations:
      - "POST /membership/members/{memberId}/deployment-orders"
      - "POST /membership/members/{memberId}/link-household (and delink)"
      - "POST /membership/members/{memberId}/addresses"
      - "GET reads across the surface"

  - name: Member
    description: "An approved member acting on their own row (ownership enforced by X-User-ID == Member.id)."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /membership/members/{memberId}/protection-claims"
    shared_operations:
      - "POST /membership/members/{memberId}/entitlements (and close)"
      - "POST /membership/members/{memberId}/link-household (and delink)"
      - "POST /membership/members/{memberId}/addresses, PATCH /membership/addresses/{addressId}"
      - "POST /membership/households"
      - "GET own member record, matrices, claims, entitlements"

  - name: BenefitsOfficer
    description: "Survivor and beneficiary services; death processing, survivor grants, entitlement administration."
    identity: opaque
    exclusive_operations:
      - "POST /membership/members/{memberId}/deceased"
      - "POST /membership/survivor-cases/{caseId}/grant"
      - "POST /membership/survivor-cases/{caseId}/close"
    shared_operations:
      - "POST /membership/members/{memberId}/entitlements (and close)"
      - "GET reads across members, claims, entitlements, survivor cases"

  - name: ProductAdministrator
    description: "Owns the product catalog and category gates."
    identity: opaque
    exclusive_operations:
      - "POST /membership/product-offerings"
      - "PATCH /membership/product-offerings/{offeringId}"
    shared_operations:
      - "GET /membership/product-offerings (and by id)"

  - name: PlatformAdmin
    description: "Operational administrator; drives the logical clock and unrestricted reads."
    identity: opaque
    exclusive_operations:
      - "POST /membership/_clock/set_current_utc"
    shared_operations:
      - "GET reads across the whole surface"
