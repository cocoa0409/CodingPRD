# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Residential Appraisal Practice Management.
# 9 rules x >=2 instances (21 instances). Every chain replays from empty-DB
# against SCAFFOLD.yaml §1.5 exactly; all numeric asserts pre-computed.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: fee_quote_provisional_vs_final_on_schedule_supersede
        grounds:
          - calculations.fee_quote
          - state_machines.AppraisalOrder.RECEIVED_to_SCOPE_DETERMINED
          - state_machines.AppraisalOrder.SCOPE_DETERMINED_to_ACCEPTED
          - concurrency_rules[fee-schedule-create-stale-client]
        distinguishing_aspect: |
          Entity domain: AppraisalOrder fiscal. The provisional variant prices the
          order against the fee-schedule window effective at scope time (40000),
          while the final variant re-prices at acceptance time after a superseding
          schedule window took effect (52000) — identical order data, two
          spec-valid fees, 12000 cents apart.
        test_recipe:
          setup:
            - "Client with two STANDARD-tier schedules: A [2026-07-01, 2026-08-01T12:00) base 40000, B [2026-08-01T12:00, open) base 52000"
            - "One SFR CONVENTIONAL order, est 45000000, requested_turn_days 7 == client default 7 (no rush), scoped at 2026-08-01T00:00 while window A is in force"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
            - call: "POST /appraisal/clients"
              payload: { name: "AMC One", client_type: AMC, contact_email: "ops@amc1.example", default_turn_time_days: 7 }
              as: FirmAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /appraisal/fee-schedules"
              payload: { client_id: "${c_id}", complexity_tier: STANDARD, base_fee_cents: 40000, rush_multiplier_bps: 1000, revision_fee_cents: 12000, effective_from: "2026-07-01T00:00:00Z", expected_client_version: "${c_v}" }
              as: FirmAdmin
            - call: "POST /appraisal/orders"
              payload: { client_id: "${c_id}", property_address: "123 Main St", property_type: SFR, estimated_value_cents: 45000000, loan_type: CONVENTIONAL, requested_turn_days: 7 }
              as: ClientUser
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - call: "POST /appraisal/orders/${o_id}/determine-scope"
              payload: {}
              as: FirmAdmin
            - call: "GET /appraisal/clients/${c_id}"
              as: FirmAdmin
              captures: { c_v2: $.data.version }
            - call: "POST /appraisal/fee-schedules"
              payload: { client_id: "${c_id}", complexity_tier: STANDARD, base_fee_cents: 52000, rush_multiplier_bps: 1000, revision_fee_cents: 12000, effective_from: "2026-08-01T12:00:00Z", expected_client_version: "${c_v2}" }
              as: FirmAdmin
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FirmAdmin }
          trigger:
            - { call: "POST /appraisal/orders/${o_id}/accept", payload: {}, as: FirmAdmin }
            - call: "GET /appraisal/orders/${o_id}"
              as: FirmAdmin
              captures: { oq: $.data.fee_quoted_cents, oc: $.data.fee_current_cents }
          assert:
            - "AppraisalOrder.${o_id}.fee_quoted_cents == 40000 (provisional variant, window A at scope time)"
            - "AppraisalOrder.${o_id}.fee_current_cents == 52000 (final variant, window B at acceptance time)"
            - "captured ${oq} == 40000 and ${oc} == 52000"

      - name: retention_standard_vs_judicial_variant
        grounds:
          - calculations.retention_expiry
          - state_machines.WorkfileRecord.ACTIVE_to_LEGAL_HOLD
          - state_machines.Complaint.RESPONSE_SUBMITTED_to_CLOSED_SANCTIONED
        distinguishing_aspect: |
          Entity domain: WorkfileRecord compliance. Two orders delivered the same
          day share the standard 5-year retention (2031-08-02); the order whose
          complaint closed CLOSED_SANCTIONED on 2030-06-01 switches to the
          judicial variant max(standard, closed_at + 2y) = 2032-06-01 — same
          delivery timestamp, different retention_until.
        test_recipe:
          setup:
            - "Two desktop STANDARD orders for the same client and appraiser, both first delivered 2026-08-02"
            - "Order2 later receives a complaint, response submitted within 21 days, closed SANCTIONED at 2030-06-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
            - call: "POST /appraisal/clients"
              payload: { name: "Lender Two", client_type: DIRECT_LENDER, contact_email: "ops@dl2.example", default_turn_time_days: 7 }
              as: FirmAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /appraisal/fee-schedules"
              payload: { client_id: "${c_id}", complexity_tier: STANDARD, base_fee_cents: 45000, rush_multiplier_bps: 1500, revision_fee_cents: 15000, effective_from: "2026-07-01T00:00:00Z", expected_client_version: "${c_v}" }
              as: FirmAdmin
            - call: "POST /appraisal/appraisers"
              payload: { full_name: "Ann Appraiser", license_level: CERTIFIED_RESIDENTIAL, license_number: "CR-1001", license_expiry: "2027-06-01" }
              as: FirmAdmin
              captures: { a_id: $.data.id }
            - call: "POST /appraisal/appraisers"
              payload: { full_name: "Quinn Reviewer", license_level: CERTIFIED_RESIDENTIAL, license_number: "CR-2001", license_expiry: "2027-06-01" }
              as: FirmAdmin
              captures: { q_id: $.data.id }
            - call: "POST /appraisal/panel-memberships"
              payload: { client_id: "${c_id}", appraiser_id: "${a_id}" }
              as: FirmAdmin
            # --- order 1 (desktop, no inspection) ---
            - call: "POST /appraisal/orders"
              payload: { client_id: "${c_id}", property_address: "10 Oak Ave", property_type: SFR, estimated_value_cents: 45000000, loan_type: CONVENTIONAL, requested_turn_days: 7 }
              as: ClientUser
              as_user_id: "${c_id}"
              captures: { o1_id: $.data.id }
            - { call: "POST /appraisal/orders/${o1_id}/determine-scope", payload: { requires_inspection: false }, as: FirmAdmin }
            - { call: "POST /appraisal/orders/${o1_id}/accept", payload: {}, as: FirmAdmin }
            - { call: "POST /appraisal/orders/${o1_id}/assign", payload: { appraiser_id: "${a_id}" }, as: FirmAdmin }
            - { call: "POST /appraisal/orders/${o1_id}/start-analysis", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            - call: "POST /appraisal/comparables"
