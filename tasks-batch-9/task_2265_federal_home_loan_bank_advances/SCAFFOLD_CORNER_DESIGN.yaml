            - call: "POST /fhlb/collateral-assets/${asset_sf}/safekeeping-receipts"
              payload: { file_count: 12, delivery_date: "2026-08-10T00:00:00Z", return_date: "2026-09-30T00:00:00Z" }
              as: CollateralCustodian
              captures: { receipt_id: "$.data.id" }
          trigger:
            call: "POST /fhlb/safekeeping-receipts/${receipt_id}/confirm"
            payload: { outcome: "RECEIVED" }
            as: CollateralCustodian
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_INVALID_STATE\""
            - "the receipt is still PENDING_DELIVERY with received_at == null"
            - "the asset still reports custody_location == \"MEMBER_VAULT\", effective_listing_mode == \"BLANKET\", discount_factor_bps == 7800, lendable_value_cents == 15600000"
            - "after POST /_clock/set_current_utc with 2026-08-10T00:00:00Z the identical confirm succeeds"

      - name: escalate_shortfall_during_cure_period_rejected
        claim_type: precondition_enforcement
