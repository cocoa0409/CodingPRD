scenario: "789. Genealogy & Family-History Research Service: research request & objective/scope, record search & source citation, family-tree build & verification, deliverable (report/tree) & hours/package, DNA-result interpretation add-on, document retrieval/translation, heirloom/archive, milestone billing"
domain_name: "genealogy-research"
api_prefix: "/genealogy"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
    - rate_threshold_triggers
  entity_topology: graph
  # Flat FK peers + self-referential Person (father_id/mother_id) forming a family-tree DAG.
  state_machine_shape: cyclic
  # Person is cyclic (VERIFIED -> UNDER_REVIEW reopen); DocumentRequest carries parallel
  # dimensions (retrieval_status x translation_status); Deliverable has revision cycle.
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  # Client owns projects/deliverable-acceptance; Researcher owns research artifacts;
  # ProjectManager is an opaque operator that provisions actors and runs billing.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "client full name"
      - name: email
        type: string
        source: input
        description: "contact email; unique"
        constraints: "unique across clients"
      - name: tier
        type: enum
        source: input
        description: "billing tier; drives invoice discount"
        default: "STANDARD"
        constraints: "one of {STANDARD, PREMIUM}"
      - name: status
        type: enum
        source: system
        description: "lifecycle marker"
        default: "ACTIVE"
        constraints: "one of {ACTIVE, ARCHIVED}"

  - name: Researcher
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "genealogist full name"
      - name: email
        type: string
        source: input
        description: "contact email; unique"
        constraints: "unique across researchers"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "labor rate in cents used for informational costing"
        constraints: ">= 0"
      - name: specialties
        type: array
        source: input
        description: "free-text specialty tags"
        default: "[]"

  - name: Repository
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "archive/repository name"
      - name: location
        type: string
        source: input
        description: "physical location"
      - name: concurrent_capacity
        type: integer
        source: input
        description: "max simultaneously-overlapping BOOKED appointments this repository can host"
        default: "2"
        constraints: ">= 1"

  - name: ResearchProject
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the paying client"
      - name: lead_researcher_id
        type: string
        source: input
        description: "FK -> Researcher.id; lead genealogist for the request"
      - name: title
        type: string
        source: input
        description: "research request title"
      - name: objective
        type: string
        source: input
        description: "primary research objective statement"
      - name: scope_note
        type: string
        source: input
        description: "scope boundaries / constraints"
        default: "\"\""
      - name: package_type
        type: enum
        source: input
        description: "engagement package"
        constraints: "one of {HOURLY, BASIC_PACKAGE, PREMIUM_PACKAGE}"
      - name: package_price_cents
        type: integer
        source: input
        description: "fixed package price in cents (base of project cost)"
        constraints: ">= 0"
      - name: budget_hours
        type: number
        source: input
        description: "included research hours before overage pricing applies"
        constraints: "> 0"
      - name: priority
        type: enum
        source: input
        description: "scheduling priority; RUSH adds an invoice surcharge"
        default: "STANDARD"
        constraints: "one of {STANDARD, RUSH}"
      - name: target_person_count
        type: integer
        source: input
        description: "number of verified persons that marks research complete"
        default: "1"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "engagement lifecycle state"
        default: "DRAFT"
        constraints: "one of {DRAFT, ACTIVE, CLOSED}"
      - name: research_status
        type: enum
        source: computed
        description: "derived research progress; flips to RESEARCH_COMPLETE when verified_person_count >= target_person_count"
        default: "IN_PROGRESS"
        constraints: "one of {IN_PROGRESS, RESEARCH_COMPLETE}"
      - name: consumed_hours
        type: number
        source: computed
        description: "sum of TimeEntry.hours where status == ACTIVE for this project"
        default: "0"
      - name: verified_person_count
        type: integer
        source: computed
        description: "count of Person rows with verification_status == VERIFIED for this project"
        default: "0"
      - name: accepted_deliverable_count
        type: integer
        source: computed
        description: "count of Deliverable rows with status == ACCEPTED for this project"
        default: "0"
      - name: ready_milestone_amount_cents
        type: integer
        source: computed
        description: "sum of Milestone.amount_cents where status == READY for this project"
        default: "0"
      - name: estimated_cost_cents
        type: integer
        source: computed
        description: "project_cost estimate variant (see calculations.project_cost)"
        default: "0"
      - name: actual_cost_cents
        type: integer
        source: computed
        description: "project_cost actual variant (see calculations.project_cost)"
        default: "0"
      - name: invoiced_total_cents
        type: integer
        source: computed
        description: "running sum of line totals for milestones currently INVOICED or PAID"
        default: "0"
      - name: credited_total_cents
        type: integer
        source: computed
        description: "running sum of line totals reversed by milestone cancellation"
        default: "0"
      - name: paid_total_cents
        type: integer
        source: computed
        description: "running sum of line totals for milestones in PAID"
        default: "0"
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "invoiced_total_cents - paid_total_cents - credited_total_cents"
        default: "0"
      - name: billable_amount_cents
        type: integer
        source: computed
        description: "project_billable_amount (see calculations.project_billable_amount)"
        default: "0"

  - name: RecordSearch
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> ResearchProject.id; owning project"
      - name: performed_by_id
        type: string
        source: system
        description: "FK -> Researcher.id; set from the acting researcher's X-User-ID"
      - name: repository_name
        type: string
        source: input
        description: "free-text name of the repository searched"
      - name: search_terms
        type: string
        source: input
        description: "search query / criteria"
      - name: estimated_hours
        type: number
        source: input
        description: "estimated hours for this search; feeds project_cost estimate variant"
        constraints: ">= 0"
      - name: result_summary
        type: string
        source: input
        description: "summary written at completion"
        default: "\"\""
      - name: status
        type: enum
        source: system
        description: "search lifecycle"
        default: "PENDING"
        constraints: "one of {PENDING, COMPLETED, NO_RESULTS, CANCELLED}"

  - name: SourceCitation
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: system
        description: "FK -> ResearchProject.id; copied from the referenced record search"
      - name: record_search_id
        type: string
        source: input
        description: "FK -> RecordSearch.id; the search that produced this citation"
      - name: person_id
        type: string
        source: input
        description: "FK -> Person.id; the tree person this citation supports"
      - name: citation_text
        type: string
        source: input
        description: "formatted source citation"
      - name: source_type
        type: enum
        source: input
        description: "kind of source"
        constraints: "one of {VITAL_RECORD, CENSUS, CHURCH, DNA, OTHER}"
      - name: quality
        type: enum
        source: input
        description: "evidence quality; drives person_confidence weight"
        constraints: "one of {PRIMARY, SECONDARY, INDIRECT}"
      - name: verification_status
        type: enum
        source: system
        description: "citation verification state"
        default: "UNVERIFIED"
        constraints: "one of {UNVERIFIED, VERIFIED, DISPUTED}"

  - name: Person
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> ResearchProject.id; owning project"
      - name: father_id
        type: string
        source: input
        description: "FK -> Person.id; tree parent (father), nullable"
        default: "null"
      - name: mother_id
        type: string
        source: input
        description: "FK -> Person.id; tree parent (mother), nullable"
        default: "null"
      - name: full_name
        type: string
        source: input
        description: "person full name"
      - name: birth_year
        type: integer
        source: input
        description: "birth year"
        default: "null"
      - name: death_year
        type: integer
        source: input
        description: "death year"
        default: "null"
      - name: verification_status
        type: enum
        source: system
        description: "tree-node verification state"
        default: "DRAFT"
        constraints: "one of {DRAFT, UNDER_REVIEW, VERIFIED}"
      - name: citation_count
        type: integer
        source: computed
        description: "count of SourceCitation rows with person_id == this.id and verification_status != DISPUTED"
        default: "0"
      - name: verified_citation_count
        type: integer
        source: computed
        description: "count of SourceCitation rows with person_id == this.id and verification_status == VERIFIED"
        default: "0"
      - name: provisional_confidence
        type: number
        source: computed
        description: "person_confidence provisional variant (all non-disputed citations)"
        default: "0"
      - name: confidence_score
        type: number
        source: computed
        description: "person_confidence verified variant (only VERIFIED citations); gates verification"
        default: "0"

  - name: DnaInterpretation
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> ResearchProject.id; owning project"
      - name: subject_person_id
        type: string
        source: input
        description: "FK -> Person.id; the tested individual (must be VERIFIED to interpret)"
      - name: match_person_id
        type: string
        source: input
        description: "FK -> Person.id; the matched relative, nullable"
        default: "null"
      - name: test_provider
        type: string
        source: input
        description: "DNA test vendor"
      - name: cm_shared
        type: integer
        source: input
        description: "shared centimorgans, supplied at interpretation"
        default: "null"
        constraints: ">= 0 when interpreting"
      - name: predicted_relationship
        type: enum
        source: computed
        description: "dna_predicted_relationship output"
        default: "null"
        constraints: "one of {PARENT_CHILD, FULL_SIBLING, CLOSE_FAMILY, COUSIN, UNRELATED}"
      - name: addon_fee_cents
        type: integer
        source: input
        description: "add-on fee for the DNA interpretation service"
        default: "15000"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "interpretation lifecycle"
        default: "ORDERED"
        constraints: "one of {ORDERED, INTERPRETED, CANCELLED}"

  - name: DocumentRequest
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> ResearchProject.id; owning project"
      - name: repository_id
        type: string
        source: input
        description: "FK -> Repository.id; repository the document lives in"
      - name: document_type
        type: string
        source: input
        description: "type of document requested"
      - name: source_language
        type: string
        source: input
        description: "original language of the document"
      - name: pages
        type: integer
        source: input
        description: "page count"
        default: "1"
        constraints: ">= 1"
      - name: retrieval_status
        type: enum
        source: system
        description: "retrieval dimension (independent of translation)"
        default: "REQUESTED"
        constraints: "one of {REQUESTED, RETRIEVED, UNAVAILABLE}"
      - name: translation_status
        type: enum
        source: system
        description: "translation dimension (independent of retrieval)"
        default: "NOT_NEEDED"
        constraints: "one of {NOT_NEEDED, PENDING, TRANSLATED}"

  - name: HeirloomItem
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> ResearchProject.id; owning project"
      - name: related_person_id
        type: string
        source: input
        description: "FK -> Person.id; person the heirloom relates to, nullable"
        default: "null"
      - name: description
        type: string
        source: input
        description: "heirloom description"
      - name: category
        type: enum
        source: input
        description: "heirloom category"
        constraints: "one of {PHOTO, DOCUMENT, ARTIFACT, TEXTILE, OTHER}"
      - name: storage_location
        type: string
        source: input
        description: "archive storage location"
        default: "\"\""
      - name: archive_status
        type: enum
        source: system
        description: "linear archival pipeline state"
        default: "RECEIVED"
        constraints: "one of {RECEIVED, CATALOGUED, DIGITIZED, RETURNED}"

  - name: Deliverable
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> ResearchProject.id; owning project"
      - name: milestone_id
        type: string
        source: input
        description: "FK -> Milestone.id; milestone this deliverable unlocks, nullable"
        default: "null"
      - name: deliverable_type
        type: enum
        source: input
        description: "deliverable kind"
        constraints: "one of {RESEARCH_REPORT, FAMILY_TREE, DNA_SUMMARY}"
      - name: page_count
        type: integer
        source: input
        description: "report/tree page count"
        default: "1"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "deliverable review state (revision cycle)"
        default: "DRAFT"
        constraints: "one of {DRAFT, SUBMITTED, ACCEPTED, REVISION_REQUESTED}"

  - name: Milestone
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> ResearchProject.id; owning project"
      - name: deliverable_id
        type: string
        source: input
        description: "FK -> Deliverable.id; deliverable whose acceptance readies this milestone, nullable"
        default: "null"
      - name: title
        type: string
        source: input
        description: "milestone title"
      - name: amount_cents
        type: integer
        source: input
        description: "base billing amount before discount/surcharge"
        constraints: ">= 0"
      - name: sequence_no
        type: integer
        source: input
        description: "ordering index within the project"
        constraints: ">= 1"
      - name: invoiced_amount_cents
        type: integer
        source: computed
        description: "milestone_invoice_amount output, stamped at invoice time"
        default: "0"
      - name: line_total_cents
        type: integer
        source: computed
        description: "invoiced_amount_cents + per-milestone agency fee (see project_billable_amount)"
        default: "0"
      - name: status
        type: enum
        source: system
        description: "billing lifecycle"
        default: "PENDING"
        constraints: "one of {PENDING, READY, INVOICED, PAID, CANCELLED}"

  - name: TimeEntry
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> ResearchProject.id; project the hours are logged against"
      - name: researcher_id
        type: string
        source: system
        description: "FK -> Researcher.id; set from the acting researcher's X-User-ID"
      - name: record_search_id
        type: string
        source: input
        description: "FK -> RecordSearch.id; optional search the hours belong to, nullable"
        default: "null"
      - name: hours
        type: number
        source: input
        description: "hours worked"
        constraints: "> 0"
      - name: activity_type
        type: enum
        source: input
        description: "kind of work"
        constraints: "one of {RESEARCH, WRITING, TRANSLATION, ADMIN, TRAVEL}"
      - name: billable
        type: boolean
        source: input
        description: "whether the hours count toward consumed_hours"
        default: "true"
      - name: status
        type: enum
        source: system
        description: "entry state; VOIDED entries drop out of consumed_hours"
        default: "ACTIVE"
        constraints: "one of {ACTIVE, VOIDED}"

  - name: RepositoryAppointment
    parent: null
    common_fields: true
    fields:
      - name: repository_id
        type: string
        source: input
        description: "FK -> Repository.id; repository being visited (capacity resource)"
      - name: project_id
        type: string
        source: input
        description: "FK -> ResearchProject.id; owning project"
      - name: researcher_id
        type: string
        source: input
        description: "FK -> Researcher.id; researcher attending (exclusive resource)"
      - name: start_utc
        type: datetime
        source: input
        description: "appointment start (ISO 8601 UTC)"
      - name: end_utc
        type: datetime
        source: input
        description: "appointment end (ISO 8601 UTC); must be after start_utc"
      - name: purpose
        type: string
        source: input
        description: "visit purpose"
        default: "\"\""
      - name: status
        type: enum
        source: system
        description: "appointment lifecycle"
        default: "BOOKED"
        constraints: "one of {BOOKED, CANCELLED, COMPLETED}"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: ResearchProject
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /genealogy/projects/{id}/activate"
        actor: ProjectManager
        preconditions: ["project.status == DRAFT"]
        side_effects: ["increments ResearchProject.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /genealogy/projects/{id}/close"
        actor: ProjectManager
        preconditions: ["project.status == ACTIVE"]
        side_effects: ["increments ResearchProject.version by 1"]
      - from: DRAFT
        to: DRAFT
        trigger: "POST /genealogy/projects/{id}/reconfigure"
        actor: ProjectManager
        preconditions: ["project.status == DRAFT", "expected_project_version == project.version"]
        side_effects:
          - "updates package_type/budget_hours/package_price_cents/priority as supplied"
          - "increments ResearchProject.version by 1"
        note: "OCC-guarded reconfigure; see §1.2.1 concurrency rule project-reconfigure-stale-version"
      - from: ACTIVE
        to: ACTIVE
        trigger: "system: research_status recompute on Person verify/reopen"
        actor: system
        preconditions: []
        side_effects:
          - "recomputes verified_person_count"
          - "sets research_status = RESEARCH_COMPLETE when verified_person_count >= target_person_count, else IN_PROGRESS"

  - entity: RecordSearch
    initial_state: PENDING
    terminal_states: [COMPLETED, NO_RESULTS, CANCELLED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /genealogy/record-searches/{id}/complete (outcome=COMPLETED)"
        actor: Researcher
        preconditions: ["search.status == PENDING"]
        side_effects: ["stores result_summary", "increments RecordSearch.version by 1"]
      - from: PENDING
        to: NO_RESULTS
        trigger: "POST /genealogy/record-searches/{id}/complete (outcome=NO_RESULTS)"
        actor: Researcher
        preconditions: ["search.status == PENDING"]
        side_effects: ["increments RecordSearch.version by 1"]

  - entity: SourceCitation
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /genealogy/citations/{id}/verify"
        actor: Researcher
        preconditions: ["citation.verification_status == UNVERIFIED"]
        side_effects:
          - "recomputes Person(person_id).confidence_score and verified_citation_count (cascade link 1)"
          - "when Person is UNDER_REVIEW and confidence_score >= 0.75 and verified_citation_count >= 2, drives Person UNDER_REVIEW->VERIFIED (cascade link 2)"
          - "increments SourceCitation.version by 1"
      - from: UNVERIFIED
        to: DISPUTED
        trigger: "POST /genealogy/citations/{id}/dispute"
        actor: Researcher
        preconditions: ["citation.verification_status == UNVERIFIED"]
        side_effects:
          - "recomputes Person(person_id).confidence_score, citation_count and verified_citation_count"
          - "increments SourceCitation.version by 1"
      - from: VERIFIED
        to: DISPUTED
        trigger: "POST /genealogy/citations/{id}/dispute"
        actor: Researcher
        preconditions: ["citation.verification_status == VERIFIED"]
        side_effects:
          - "recomputes Person(person_id).confidence_score and verified_citation_count (cascade link 1)"
          - "when Person is VERIFIED and (confidence_score < 0.75 or verified_citation_count < 2), drives Person VERIFIED->UNDER_REVIEW reopen (cascade link 2)"
          - "increments SourceCitation.version by 1"

  - entity: Person
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /genealogy/persons/{id}/submit-review"
        actor: Researcher
        preconditions: ["person.verification_status == DRAFT"]
        side_effects: ["increments Person.version by 1"]
      - from: UNDER_REVIEW
        to: VERIFIED
        trigger: "POST /genealogy/persons/{id}/verify OR system auto on 2nd citation verify"
        actor: Researcher
        preconditions:
          - "person.verification_status == UNDER_REVIEW"
          - "person.verified_citation_count >= 2"
          - "person.confidence_score >= 0.75"
        side_effects:
          - "increments ResearchProject(project_id).verified_person_count by 1 (cascade link 3)"
          - "recomputes ResearchProject.research_status (cascade link 4)"
          - "increments Person.version by 1"
      - from: VERIFIED
        to: UNDER_REVIEW
        trigger: "system: citation dispute drops confidence below threshold (reopen)"
        actor: system
        preconditions: ["person.verification_status == VERIFIED", "confidence_score < 0.75 OR verified_citation_count < 2"]
        side_effects:
          - "decrements ResearchProject(project_id).verified_person_count by 1"
          - "recomputes ResearchProject.research_status"
          - "increments Person.version by 1"
        note: "cyclic reopen edge — this is the non-linear shape for Person"

  - entity: DnaInterpretation
    initial_state: ORDERED
    terminal_states: [INTERPRETED, CANCELLED]
    transitions:
      - from: ORDERED
        to: INTERPRETED
        trigger: "POST /genealogy/dna-interpretations/{id}/interpret"
        actor: Researcher
        preconditions:
          - "dna.status == ORDERED"
          - "Person(subject_person_id).verification_status == VERIFIED"
        side_effects:
          - "computes predicted_relationship from cm_shared (dna_predicted_relationship)"
          - "increments DnaInterpretation.version by 1"
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /genealogy/dna-interpretations/{id}/interpret rejected path is not this; cancellation is system/admin"
        actor: ProjectManager
        preconditions: ["dna.status == ORDERED"]
        side_effects: ["increments DnaInterpretation.version by 1"]
        note: "cancellation reachable only when project closes; kept for enum closure"

  - entity: DocumentRequest
    initial_state: REQUESTED
    terminal_states: []
    transitions:
      - from: "retrieval_status=REQUESTED"
        to: "retrieval_status=RETRIEVED"
        trigger: "POST /genealogy/document-requests/{id}/update-retrieval (outcome=RETRIEVED)"
        actor: Researcher
        preconditions: ["retrieval_status == REQUESTED"]
        side_effects: ["increments DocumentRequest.version by 1"]
        note: "retrieval dimension — independent of translation_status"
      - from: "retrieval_status=REQUESTED"
        to: "retrieval_status=UNAVAILABLE"
        trigger: "POST /genealogy/document-requests/{id}/update-retrieval (outcome=UNAVAILABLE)"
        actor: Researcher
        preconditions: ["retrieval_status == REQUESTED"]
        side_effects: ["increments DocumentRequest.version by 1"]
      - from: "translation_status=PENDING"
        to: "translation_status=TRANSLATED"
        trigger: "POST /genealogy/document-requests/{id}/update-translation (outcome=TRANSLATED)"
        actor: Researcher
        preconditions: ["translation_status == PENDING"]
        side_effects: ["increments DocumentRequest.version by 1"]
        note: "translation dimension — independent of retrieval_status; PENDING only when created with needs_translation=true"

  - entity: HeirloomItem
    initial_state: RECEIVED
    terminal_states: [RETURNED]
    transitions:
      - from: RECEIVED
        to: CATALOGUED
        trigger: "POST /genealogy/heirlooms/{id}/advance (target_status=CATALOGUED)"
        actor: Researcher
        preconditions: ["archive_status == RECEIVED"]
        side_effects: ["increments HeirloomItem.version by 1"]
      - from: CATALOGUED
        to: DIGITIZED
        trigger: "POST /genealogy/heirlooms/{id}/advance (target_status=DIGITIZED)"
        actor: Researcher
        preconditions: ["archive_status == CATALOGUED"]
        side_effects: ["increments HeirloomItem.version by 1"]
      - from: DIGITIZED
        to: RETURNED
        trigger: "POST /genealogy/heirlooms/{id}/advance (target_status=RETURNED)"
        actor: Researcher
        preconditions: ["archive_status == DIGITIZED"]
        side_effects: ["increments HeirloomItem.version by 1"]

  - entity: Deliverable
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /genealogy/deliverables/{id}/submit"
        actor: Researcher
        preconditions: ["deliverable.status == DRAFT"]
        side_effects: ["increments Deliverable.version by 1"]
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /genealogy/deliverables/{id}/submit"
        actor: Researcher
        preconditions: ["deliverable.status == REVISION_REQUESTED"]
        side_effects: ["increments Deliverable.version by 1"]
        note: "revision cycle re-entry"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /genealogy/deliverables/{id}/accept"
        actor: Client
        preconditions: ["deliverable.status == SUBMITTED"]
        side_effects:
          - "increments ResearchProject(project_id).accepted_deliverable_count by 1"
          - "when milestone_id is set, drives Milestone(milestone_id) PENDING->READY (cascade link 1)"
          - "Milestone READY recomputes ResearchProject.ready_milestone_amount_cents (cascade link 2)"
          - "increments Deliverable.version by 1"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /genealogy/deliverables/{id}/request-revision"
        actor: Client
        preconditions: ["deliverable.status == SUBMITTED"]
        side_effects: ["increments Deliverable.version by 1"]

  - entity: Milestone
    initial_state: PENDING
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: PENDING
        to: READY
        trigger: "system: linked Deliverable accepted (cascade)"
        actor: system
        preconditions: ["milestone.status == PENDING"]
        side_effects: ["recomputes ResearchProject.ready_milestone_amount_cents", "increments Milestone.version by 1"]
      - from: READY
        to: INVOICED
        trigger: "POST /genealogy/milestones/{id}/invoice"
        actor: ProjectManager
        preconditions: ["milestone.status == READY"]
        side_effects:
          - "stamps invoiced_amount_cents = milestone_invoice_amount"
          - "stamps line_total_cents = invoiced_amount_cents + per-milestone agency fee"
          - "adds line_total_cents to ResearchProject.invoiced_total_cents (never decremented)"
          - "recomputes ResearchProject.outstanding_balance_cents and billable_amount_cents"
          - "increments Milestone.version by 1"
      - from: INVOICED
        to: PAID
        trigger: "POST /genealogy/milestones/{id}/record-payment"
        actor: ProjectManager
        preconditions: ["milestone.status == INVOICED"]
        side_effects:
          - "adds line_total_cents to ResearchProject.paid_total_cents"
          - "recomputes ResearchProject.outstanding_balance_cents"
          - "increments Milestone.version by 1"
      - from: INVOICED
        to: CANCELLED
        trigger: "POST /genealogy/milestones/{id}/cancel"
        actor: ProjectManager
        preconditions: ["milestone.status == INVOICED"]
        side_effects:
          - "adds line_total_cents to ResearchProject.credited_total_cents (compensating credit)"
          - "recomputes ResearchProject.outstanding_balance_cents and billable_amount_cents"
          - "increments Milestone.version by 1"
        note: "compensating action for the invoice transition — invoiced_total_cents stays put, credited_total_cents offsets it so net billed money (invoiced_total - credited_total) and outstanding_balance return to their pre-invoice values"
      - from: READY
        to: CANCELLED
        trigger: "POST /genealogy/milestones/{id}/cancel"
        actor: ProjectManager
        preconditions: ["milestone.status == READY"]
        side_effects: ["recomputes ResearchProject.ready_milestone_amount_cents", "increments Milestone.version by 1"]

  - entity: TimeEntry
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /genealogy/time-entries/{id}/void"
        actor: Researcher
        preconditions: ["entry.status == ACTIVE"]
        side_effects:
          - "subtracts hours from ResearchProject.consumed_hours when billable"
          - "recomputes ResearchProject.actual_cost_cents"
          - "increments TimeEntry.version by 1"
        note: "compensating action for time-entry creation — consumed_hours is conserved"

  - entity: RepositoryAppointment
    initial_state: BOOKED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /genealogy/appointments/{id}/cancel"
        actor: Researcher
        preconditions: ["appointment.status == BOOKED"]
        side_effects: ["frees the researcher/repository interval", "increments RepositoryAppointment.version by 1"]

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: project-reconfigure-stale-version
    parent_entity: ResearchProject
    write_endpoint: "POST /genealogy/projects/{id}/reconfigure"
    occ_field: "expected_project_version"
    description: |
      Reconfiguring a ResearchProject (package/budget/price/priority) whose
      version has advanced since the client last observed it is rejected. A
      reconfigure legitimately supersedes the prior package terms, so a second
      reconfigure carrying a now-stale expected_project_version is refused
      rather than silently overwriting the newer terms.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: project_cost
    trigger: "computed on read of ResearchProject (GET /genealogy/projects/{id}) and refreshed on RecordSearch/TimeEntry mutations"
    algorithm: dual_variant
    formula: |
      OVERAGE_RATE_CENTS = 8000 (per whole overage hour)
      base = package_price_cents
      # estimate variant (forward_looking):
      estimated_total_hours = sum(RecordSearch.estimated_hours
                                   for searches where status in {PENDING, COMPLETED, NO_RESULTS})
      est_overage = max(0, estimated_total_hours - budget_hours)
      estimated_cost_cents = base + ceil(est_overage) * OVERAGE_RATE_CENTS
      # actual variant (chronological over created_at ASC):
      consumed_hours = sum(TimeEntry.hours for entries where status == ACTIVE and billable == true)
      act_overage = max(0, consumed_hours - budget_hours)
      actual_cost_cents = base + ceil(act_overage) * OVERAGE_RATE_CENTS
    input_set: "estimate includes non-cancelled searches (planned work); actual includes only ACTIVE billable time entries (logged work)"
    constants:
      OVERAGE_RATE_CENTS: 8000
    precision: "integer cents; ceil applied to overage hours before multiplying"
    variants:
      - name: estimate
        when: "forward-looking projection from RecordSearch.estimated_hours"
        difference: "inclusion set is planned searches; ignores logged time"
      - name: actual
        when: "chronological accounting from ACTIVE billable TimeEntry rows"
        difference: "inclusion set is logged hours; ignores search estimates"

  - name: person_confidence
    trigger: "recomputed whenever a SourceCitation for the person is created/verified/disputed"
    algorithm: weighted_scoring
    formula: |
      WEIGHT = { PRIMARY: 3, SECONDARY: 2, INDIRECT: 1 }
      CONFIDENCE_DIVISOR = 6
      # provisional variant (all non-disputed citations):
      prov_sum = sum(WEIGHT[c.quality] for c in citations
                     where c.person_id == person.id and c.verification_status != DISPUTED)
      provisional_confidence = round_half_up(min(1.0, prov_sum / CONFIDENCE_DIVISOR), 2)
      # verified variant (only VERIFIED citations):
      ver_sum = sum(WEIGHT[c.quality] for c in citations
                    where c.person_id == person.id and c.verification_status == VERIFIED)
      confidence_score = round_half_up(min(1.0, ver_sum / CONFIDENCE_DIVISOR), 2)
    input_set: "provisional counts UNVERIFIED+VERIFIED (not DISPUTED); verified counts only VERIFIED"
    constants:
      WEIGHT_PRIMARY: 3
      WEIGHT_SECONDARY: 2
      WEIGHT_INDIRECT: 1
      CONFIDENCE_DIVISOR: 6
    precision: "2 decimal places, round_half_up; clamped to 1.00"
    variants:
      - name: provisional
        when: "displayed confidence before evidence is verified"
        difference: "includes UNVERIFIED citations"
      - name: verified
        when: "authoritative confidence gating Person verification"
        difference: "excludes UNVERIFIED citations"

  - name: milestone_invoice_amount
    trigger: "POST /genealogy/milestones/{id}/invoice"
    algorithm: threshold
    formula: |
      TIER_DISCOUNT = { STANDARD: 0.00, PREMIUM: 0.10 }
      RUSH_SURCHARGE_CENTS = 5000
      PRICE_CAP_MULTIPLIER = 1.5
      base = milestone.amount_cents
      discount_pct = TIER_DISCOUNT[Client(project.client_id).tier]
      discounted = round_half_up(base * (1 - discount_pct))          # round BEFORE surcharge
      surcharge = (project.priority == RUSH) ? RUSH_SURCHARGE_CENTS : 0
      pre_cap = discounted + surcharge
      invoiced_amount_cents = min(pre_cap, round_half_up(base * PRICE_CAP_MULTIPLIER))
    input_set: "single milestone; depends on client.tier and project.priority"
    constants:
      TIER_DISCOUNT_STANDARD: 0.00
      TIER_DISCOUNT_PREMIUM: 0.10
      RUSH_SURCHARGE_CENTS: 5000
      PRICE_CAP_MULTIPLIER: 1.5
    precision: "integer cents; round_half_up; discount rounded before surcharge is added (pinned order)"

  - name: project_billable_amount
    trigger: "recomputed on milestone invoice and cancel"
    algorithm: aggregation
    formula: |
      AGENCY_FEE_PCT = 0.075
      # per-milestone rounding, THEN sum (pinned order):
      billable_amount_cents = 0
      for m in Milestone where m.project_id == project.id and m.status in {INVOICED, PAID}:
          fee_m = round_half_up(m.invoiced_amount_cents * AGENCY_FEE_PCT)
          m.line_total_cents = m.invoiced_amount_cents + fee_m
          billable_amount_cents += m.line_total_cents
      # NOTE: this differs from round_half_up(sum(invoiced_amount)*AGENCY_FEE_PCT) + sum(invoiced_amount)
    input_set: "milestones with status in {INVOICED, PAID}; ordered by sequence_no ASC, tie-break created_at ASC"
    constants:
      AGENCY_FEE_PCT: 0.075
    precision: "integer cents; agency fee rounded round_half_up per milestone BEFORE summation (pinned order)"

  - name: dna_predicted_relationship
    trigger: "POST /genealogy/dna-interpretations/{id}/interpret"
    algorithm: threshold
    formula: |
      cm = dna.cm_shared
      if   cm >= 3400: PARENT_CHILD
      elif cm >= 2000: FULL_SIBLING
      elif cm >= 1300: CLOSE_FAMILY
      elif cm >= 200:  COUSIN
      else:            UNRELATED
    input_set: "single DnaInterpretation.cm_shared value"
    constants:
      T_PARENT_CHILD: 3400
      T_FULL_SIBLING: 2000
      T_CLOSE_FAMILY: 1300
      T_COUSIN: 200
    precision: "integer centimorgans; each band is inclusive lower bound (>=)"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for the endpoint per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "all path ids and body FK references exist, validated left-to-right"
    error_id: ERR_*_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_referential
    check: "entity_backed actor owns the target resource (Client acting on a project must equal project.client_id)"
    error_id: ERR_FORBIDDEN_NOT_OWNER
    http_status: 403
    applies_to: "POST /genealogy/deliverables/{id}/accept, POST /genealogy/deliverables/{id}/request-revision"
  - priority: 5
    category: state
    check: "target resource is in a state that admits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 5
    category: state
    check: "project.status == ACTIVE when creating a RecordSearch or logging a TimeEntry"
    error_id: ERR_PROJECT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /genealogy/record-searches, POST /genealogy/time-entries"
  - priority: 6
    category: business_referential
    check: "SourceCitation.record_search and SourceCitation.person belong to the same project"
    error_id: ERR_CROSS_PROJECT_REFERENCE
    http_status: 409
    applies_to: "POST /genealogy/citations"
  - priority: 7
    category: business_temporal
    check: "new RepositoryAppointment does not fall within RESEARCHER_BUFFER_MINUTES (30) of another BOOKED appointment for the same researcher (buffered-exclusive interval)"
    error_id: ERR_RESEARCHER_UNAVAILABLE
    http_status: 409
    applies_to: "POST /genealogy/appointments"
  - priority: 8
    category: business_temporal
    check: "new RepositoryAppointment would not push the count of time-overlapping BOOKED appointments on the same repository above Repository.concurrent_capacity (aggregate-capacity interval)"
    error_id: ERR_REPOSITORY_AT_CAPACITY
    http_status: 409
    applies_to: "POST /genealogy/appointments"
  - priority: 9
    category: business_constraint
    check: "SourceCitation.record_search.status == COMPLETED (cannot cite a search that has not completed)"
    error_id: ERR_SEARCH_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /genealogy/citations"
  - priority: 9
    category: business_constraint
    check: "Person.verified_citation_count >= 2 when verifying a Person"
    error_id: ERR_INSUFFICIENT_CITATIONS
    http_status: 422
    applies_to: "POST /genealogy/persons/{id}/verify"
  - priority: 10
    category: business_constraint
    check: "Person.confidence_score >= 0.75 when verifying a Person"
    error_id: ERR_CONFIDENCE_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /genealogy/persons/{id}/verify"
  - priority: 11
    category: business_constraint
    check: "DnaInterpretation.subject_person.verification_status == VERIFIED when interpreting"
    error_id: ERR_SUBJECT_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /genealogy/dna-interpretations/{id}/interpret"
  - priority: 12
    category: business_fiscal
    check: "consumed_hours + new billable hours <= budget_hours * MAX_OVERAGE_MULTIPLIER (1.5) hard cap"
    error_id: ERR_HOURS_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /genealogy/time-entries"
  - priority: 13
    category: business_temporal
    check: "RepositoryAppointment.end_utc is strictly after start_utc"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /genealogy/appointments"
  - priority: 14
    category: business_constraint
    check: "expected_project_version == project.version for OCC-guarded reconfigure"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /genealogy/projects/{id}/reconfigure"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Clients ----
  - method: POST
    path: "/genealogy/clients"
    description: "provision a client"
    roles: [ProjectManager]
    code: 201
    input: ["name", "email", "tier?"]
    output: Client
    side_effects: []
  - method: GET
    path: "/genealogy/clients/{id}"
    description: "fetch a client"
    roles: [ProjectManager, Client]
    code: 200
    input: []
    output: Client
    side_effects: []

  # ---- Researchers ----
  - method: POST
    path: "/genealogy/researchers"
    description: "provision a researcher"
    roles: [ProjectManager]
    code: 201
    input: ["name", "email", "hourly_rate_cents", "specialties?"]
    output: Researcher
    side_effects: []
  - method: GET
    path: "/genealogy/researchers/{id}"
    description: "fetch a researcher"
    roles: [ProjectManager, Researcher]
    code: 200
    input: []
    output: Researcher
    side_effects: []

  # ---- Repositories ----
  - method: POST
    path: "/genealogy/repositories"
    description: "provision a repository/archive with a concurrent_capacity"
    roles: [ProjectManager]
    code: 201
    input: ["name", "location", "concurrent_capacity?"]
    output: Repository
    side_effects: []
  - method: GET
    path: "/genealogy/repositories/{id}"
    description: "fetch a repository"
    roles: [ProjectManager, Researcher]
    code: 200
    input: []
    output: Repository
    side_effects: []

  # ---- Research Projects ----
  - method: POST
    path: "/genealogy/projects"
    description: "open a research request/project (DRAFT)"
    roles: [Client, ProjectManager]
    code: 201
    input: ["client_id", "lead_researcher_id", "title", "objective", "scope_note?", "package_type", "package_price_cents", "budget_hours", "priority?", "target_person_count?"]
    output: ResearchProject
    side_effects: []
  - method: GET
    path: "/genealogy/projects/{id}"
    description: "fetch a project with computed cost/billing/verification fields"
    roles: [Client, Researcher, ProjectManager]
    code: 200
    input: []
    output: ResearchProject
    side_effects: ["recomputes estimated_cost_cents, actual_cost_cents on read"]
  - method: GET
    path: "/genealogy/projects"
    description: "list projects, filterable"
    roles: [Client, Researcher, ProjectManager]
    code: 200
    input: ["client_id?", "lead_researcher_id?", "status?", "limit?", "offset?"]
    output: ResearchProject[]
    side_effects: []
  - method: POST
    path: "/genealogy/projects/{id}/activate"
    description: "activate a project (DRAFT->ACTIVE)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: ResearchProject
    side_effects: ["increments ResearchProject.version by 1"]
  - method: POST
    path: "/genealogy/projects/{id}/close"
    description: "close a project (ACTIVE->CLOSED)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: ResearchProject
    side_effects: ["increments ResearchProject.version by 1"]
  - method: POST
    path: "/genealogy/projects/{id}/reconfigure"
    description: "OCC-guarded reconfigure of package/budget/price/priority while DRAFT"
    roles: [ProjectManager]
    code: 200
    input: ["expected_project_version", "package_type?", "budget_hours?", "package_price_cents?", "priority?"]
    output: ResearchProject
    side_effects: ["updates supplied package fields", "increments ResearchProject.version by 1"]

  # ---- Record Searches ----
  - method: POST
    path: "/genealogy/record-searches"
    description: "log a record search (requires project ACTIVE)"
    roles: [Researcher, ProjectManager]
    code: 201
    input: ["project_id", "repository_name", "search_terms", "estimated_hours"]
    output: RecordSearch
    side_effects: ["sets performed_by_id from X-User-ID", "refreshes ResearchProject.estimated_cost_cents"]
  - method: GET
    path: "/genealogy/record-searches/{id}"
    description: "fetch a record search"
    roles: [Client, Researcher, ProjectManager]
    code: 200
    input: []
    output: RecordSearch
    side_effects: []
  - method: GET
    path: "/genealogy/record-searches"
    description: "list record searches, filterable"
    roles: [Client, Researcher, ProjectManager]
    code: 200
    input: ["project_id?", "performed_by_id?", "status?", "limit?", "offset?"]
    output: RecordSearch[]
    side_effects: []
  - method: POST
    path: "/genealogy/record-searches/{id}/complete"
    description: "complete a search (PENDING->COMPLETED or NO_RESULTS)"
    roles: [Researcher]
    code: 200
    input: ["outcome", "result_summary?"]
    output: RecordSearch
    side_effects: ["increments RecordSearch.version by 1"]

  # ---- Source Citations ----
  - method: POST
    path: "/genealogy/citations"
    description: "attach a source citation to a person from a completed search"
    roles: [Researcher]
    code: 201
    input: ["record_search_id", "person_id", "citation_text", "source_type", "quality"]
    output: SourceCitation
    side_effects: ["copies project_id from record search", "recomputes Person.citation_count and provisional_confidence"]
  - method: GET
    path: "/genealogy/citations/{id}"
    description: "fetch a citation"
    roles: [Client, Researcher, ProjectManager]
    code: 200
    input: []
    output: SourceCitation
    side_effects: []
  - method: GET
    path: "/genealogy/citations"
    description: "list citations, filterable"
    roles: [Client, Researcher, ProjectManager]
    code: 200
    input: ["project_id?", "person_id?", "record_search_id?", "verification_status?", "limit?", "offset?"]
    output: SourceCitation[]
    side_effects: []
  - method: POST
    path: "/genealogy/citations/{id}/verify"
    description: "verify a citation; cascades to person confidence/verification"
    roles: [Researcher, ProjectManager]
    code: 200
    input: []
    output: SourceCitation
    side_effects: ["cascade: Person confidence recompute -> possible Person auto-verify -> project verified_person_count/research_status"]
  - method: POST
    path: "/genealogy/citations/{id}/dispute"
    description: "dispute a citation; may reopen a VERIFIED person"
    roles: [Researcher, ProjectManager]
    code: 200
    input: ["reason?"]
    output: SourceCitation
    side_effects: ["cascade: Person confidence recompute -> possible Person reopen -> project verified_person_count/research_status"]

  # ---- Persons (family tree) ----
  - method: POST
    path: "/genealogy/persons"
    description: "add a person node to the family tree"
    roles: [Researcher]
    code: 201
    input: ["project_id", "full_name", "birth_year?", "death_year?", "father_id?", "mother_id?"]
    output: Person
    side_effects: []
  - method: GET
    path: "/genealogy/persons/{id}"
    description: "fetch a person with confidence fields"
    roles: [Client, Researcher, ProjectManager]
    code: 200
    input: []
    output: Person
    side_effects: []
  - method: GET
    path: "/genealogy/persons"
    description: "list persons, filterable (incl. self-ref father_id/mother_id)"
    roles: [Client, Researcher, ProjectManager]
    code: 200
    input: ["project_id?", "father_id?", "mother_id?", "verification_status?", "limit?", "offset?"]
    output: Person[]
    side_effects: []
  - method: POST
    path: "/genealogy/persons/{id}/submit-review"
    description: "submit a person for verification (DRAFT->UNDER_REVIEW)"
    roles: [Researcher]
    code: 200
    input: []
    output: Person
    side_effects: ["increments Person.version by 1"]
  - method: POST
    path: "/genealogy/persons/{id}/verify"
    description: "verify a person (UNDER_REVIEW->VERIFIED); enforces citation/confidence gates"
    roles: [Researcher, ProjectManager]
    code: 200
    input: []
    output: Person
    side_effects: ["cascade: project verified_person_count++ and research_status recompute"]

  # ---- DNA Interpretations ----
  - method: POST
    path: "/genealogy/dna-interpretations"
    description: "order a DNA interpretation add-on"
    roles: [Researcher]
    code: 201
    input: ["project_id", "subject_person_id", "test_provider", "match_person_id?", "addon_fee_cents?"]
    output: DnaInterpretation
    side_effects: []
  - method: GET
    path: "/genealogy/dna-interpretations/{id}"
    description: "fetch a DNA interpretation"
    roles: [Client, Researcher, ProjectManager]
    code: 200
    input: []
    output: DnaInterpretation
    side_effects: []
  - method: GET
    path: "/genealogy/dna-interpretations"
    description: "list DNA interpretations, filterable"
    roles: [Client, Researcher, ProjectManager]
    code: 200
    input: ["project_id?", "subject_person_id?", "match_person_id?", "limit?", "offset?"]
    output: DnaInterpretation[]
    side_effects: []
  - method: POST
    path: "/genealogy/dna-interpretations/{id}/interpret"
    description: "interpret cm_shared into a predicted relationship (requires subject VERIFIED)"
    roles: [Researcher]
    code: 200
    input: ["cm_shared"]
    output: DnaInterpretation
    side_effects: ["computes predicted_relationship", "increments DnaInterpretation.version by 1"]

  # ---- Document Requests (retrieval/translation) ----
  - method: POST
    path: "/genealogy/document-requests"
    description: "request document retrieval (and optional translation)"
    roles: [Researcher]
    code: 201
    input: ["project_id", "repository_id", "document_type", "source_language", "needs_translation?", "pages?"]
    output: DocumentRequest
    side_effects: ["translation_status = PENDING when needs_translation=true else NOT_NEEDED"]
  - method: GET
    path: "/genealogy/document-requests/{id}"
    description: "fetch a document request"
    roles: [Client, Researcher, ProjectManager]
    code: 200
    input: []
    output: DocumentRequest
    side_effects: []
  - method: GET
    path: "/genealogy/document-requests"
    description: "list document requests, filterable"
    roles: [Client, Researcher, ProjectManager]
    code: 200
    input: ["project_id?", "repository_id?", "limit?", "offset?"]
    output: DocumentRequest[]
    side_effects: []
  - method: POST
    path: "/genealogy/document-requests/{id}/update-retrieval"
    description: "advance the retrieval dimension (REQUESTED->RETRIEVED|UNAVAILABLE)"
    roles: [Researcher]
    code: 200
    input: ["outcome"]
    output: DocumentRequest
    side_effects: ["increments DocumentRequest.version by 1"]
  - method: POST
    path: "/genealogy/document-requests/{id}/update-translation"
    description: "advance the translation dimension (PENDING->TRANSLATED)"
    roles: [Researcher]
    code: 200
    input: ["outcome"]
    output: DocumentRequest
    side_effects: ["increments DocumentRequest.version by 1"]

  # ---- Heirloom / Archive ----
  - method: POST
    path: "/genealogy/heirlooms"
    description: "accession an heirloom/archive item (RECEIVED)"
    roles: [Researcher, ProjectManager]
    code: 201
    input: ["project_id", "description", "category", "related_person_id?", "storage_location?"]
    output: HeirloomItem
    side_effects: []
  - method: GET
    path: "/genealogy/heirlooms/{id}"
    description: "fetch an heirloom item"
    roles: [Client, Researcher, ProjectManager]
    code: 200
    input: []
    output: HeirloomItem
    side_effects: []
  - method: GET
    path: "/genealogy/heirlooms"
    description: "list heirloom items, filterable"
    roles: [Client, Researcher, ProjectManager]
    code: 200
    input: ["project_id?", "related_person_id?", "limit?", "offset?"]
    output: HeirloomItem[]
    side_effects: []
  - method: POST
    path: "/genealogy/heirlooms/{id}/advance"
    description: "advance archive pipeline one step (RECEIVED->CATALOGUED->DIGITIZED->RETURNED)"
    roles: [Researcher, ProjectManager]
    code: 200
    input: ["target_status"]
    output: HeirloomItem
    side_effects: ["increments HeirloomItem.version by 1"]

  # ---- Deliverables ----
  - method: POST
    path: "/genealogy/deliverables"
    description: "create a deliverable (report/tree) in DRAFT"
    roles: [Researcher]
    code: 201
    input: ["project_id", "deliverable_type", "milestone_id?", "page_count?"]
    output: Deliverable
    side_effects: []
  - method: GET
    path: "/genealogy/deliverables/{id}"
    description: "fetch a deliverable"
    roles: [Client, Researcher, ProjectManager]
    code: 200
    input: []
    output: Deliverable
    side_effects: []
  - method: GET
    path: "/genealogy/deliverables"
    description: "list deliverables, filterable"
    roles: [Client, Researcher, ProjectManager]
    code: 200
    input: ["project_id?", "milestone_id?", "limit?", "offset?"]
    output: Deliverable[]
    side_effects: []
  - method: POST
    path: "/genealogy/deliverables/{id}/submit"
    description: "submit for client review (DRAFT|REVISION_REQUESTED->SUBMITTED)"
    roles: [Researcher]
    code: 200
    input: []
    output: Deliverable
    side_effects: ["increments Deliverable.version by 1"]
  - method: POST
    path: "/genealogy/deliverables/{id}/accept"
    description: "client accepts (SUBMITTED->ACCEPTED); cascades to milestone/project"
    roles: [Client, ProjectManager]
    code: 200
    input: []
    output: Deliverable
    side_effects: ["cascade: project.accepted_deliverable_count++ ; linked Milestone PENDING->READY ; project.ready_milestone_amount_cents recompute"]
  - method: POST
    path: "/genealogy/deliverables/{id}/request-revision"
    description: "client requests revision (SUBMITTED->REVISION_REQUESTED)"
    roles: [Client, ProjectManager]
    code: 200
    input: ["notes?"]
    output: Deliverable
    side_effects: ["increments Deliverable.version by 1"]

  # ---- Milestones (billing) ----
  - method: POST
    path: "/genealogy/milestones"
    description: "create a billing milestone (PENDING)"
    roles: [ProjectManager]
    code: 201
    input: ["project_id", "title", "amount_cents", "sequence_no", "deliverable_id?"]
    output: Milestone
    side_effects: []
  - method: GET
    path: "/genealogy/milestones/{id}"
    description: "fetch a milestone"
    roles: [Client, Researcher, ProjectManager]
    code: 200
    input: []
    output: Milestone
    side_effects: []
  - method: GET
    path: "/genealogy/milestones"
    description: "list milestones, filterable"
    roles: [Client, Researcher, ProjectManager]
    code: 200
    input: ["project_id?", "deliverable_id?", "limit?", "offset?"]
    output: Milestone[]
    side_effects: []
  - method: POST
    path: "/genealogy/milestones/{id}/invoice"
    description: "invoice a READY milestone; stamps invoiced/line totals"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Milestone
    side_effects: ["stamps invoiced_amount_cents/line_total_cents", "updates project invoiced_total/outstanding/billable"]
  - method: POST
    path: "/genealogy/milestones/{id}/record-payment"
    description: "record payment on an INVOICED milestone (INVOICED->PAID)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Milestone
    side_effects: ["updates project paid_total/outstanding_balance"]
  - method: POST
    path: "/genealogy/milestones/{id}/cancel"
    description: "cancel/credit a milestone (compensating; READY|INVOICED->CANCELLED)"
    roles: [ProjectManager]
    code: 200
    input: ["reason?"]
    output: Milestone
    side_effects: ["reverses invoiced/outstanding, credits credited_total, recomputes billable"]

  # ---- Time Entries (hours ledger) ----
  - method: POST
    path: "/genealogy/time-entries"
    description: "log hours against a project (requires ACTIVE; hard cap enforced)"
    roles: [Researcher]
    code: 201
    input: ["project_id", "hours", "activity_type", "record_search_id?", "billable?"]
    output: TimeEntry
    side_effects: ["sets researcher_id from X-User-ID", "adds billable hours to consumed_hours", "recomputes actual_cost_cents"]
  - method: GET
    path: "/genealogy/time-entries/{id}"
    description: "fetch a time entry"
    roles: [Client, Researcher, ProjectManager]
    code: 200
    input: []
    output: TimeEntry
    side_effects: []
  - method: GET
    path: "/genealogy/time-entries"
    description: "list time entries, filterable"
    roles: [Client, Researcher, ProjectManager]
    code: 200
    input: ["project_id?", "researcher_id?", "record_search_id?", "limit?", "offset?"]
    output: TimeEntry[]
    side_effects: []
  - method: POST
    path: "/genealogy/time-entries/{id}/void"
    description: "void an ACTIVE time entry (compensating; restores consumed_hours)"
    roles: [Researcher, ProjectManager]
    code: 200
    input: ["reason?"]
    output: TimeEntry
    side_effects: ["subtracts hours from consumed_hours", "recomputes actual_cost_cents"]

  # ---- Repository Appointments (temporal) ----
  - method: POST
    path: "/genealogy/appointments"
    description: "book a repository visit (researcher-exclusive + repository-capacity overlap checks)"
    roles: [Researcher]
    code: 201
    input: ["repository_id", "project_id", "researcher_id", "start_utc", "end_utc", "purpose?"]
    output: RepositoryAppointment
    side_effects: []
  - method: GET
    path: "/genealogy/appointments/{id}"
    description: "fetch an appointment"
    roles: [Client, Researcher, ProjectManager]
    code: 200
    input: []
    output: RepositoryAppointment
    side_effects: []
  - method: GET
    path: "/genealogy/appointments"
    description: "list appointments, filterable"
    roles: [Client, Researcher, ProjectManager]
    code: 200
    input: ["repository_id?", "project_id?", "researcher_id?", "limit?", "offset?"]
    output: RepositoryAppointment[]
    side_effects: []
  - method: POST
    path: "/genealogy/appointments/{id}/cancel"
    description: "cancel an appointment (BOOKED->CANCELLED)"
    roles: [Researcher, ProjectManager]
    code: 200
    input: ["reason?"]
    output: RepositoryAppointment
    side_effects: ["frees the interval", "increments RepositoryAppointment.version by 1"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/genealogy/_clock/set_current_utc"
    description: "set the server logical clock (test-driving). Startup default is 2026-03-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock time."
    roles: [ProjectManager]
    code: 200
    input: ["to_iso8601"]
    output: null
    side_effects: ["sets logical clock used for appointment interval comparisons"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or missing X-User-ID"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for the endpoint"
  - id: ERR_FORBIDDEN_NOT_OWNER
    http: 403
    condition: "entity_backed actor is not the owner of the target resource"
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required field, bad type, or invalid enum value"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "referenced client does not exist"
  - id: ERR_RESEARCHER_NOT_FOUND
    http: 404
    condition: "referenced researcher does not exist"
  - id: ERR_REPOSITORY_NOT_FOUND
    http: 404
    condition: "referenced repository does not exist"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "referenced project does not exist"
  - id: ERR_RECORD_SEARCH_NOT_FOUND
    http: 404
    condition: "referenced record search does not exist"
  - id: ERR_CITATION_NOT_FOUND
    http: 404
    condition: "referenced citation does not exist"
  - id: ERR_PERSON_NOT_FOUND
    http: 404
    condition: "referenced person does not exist"
  - id: ERR_DNA_NOT_FOUND
    http: 404
    condition: "referenced DNA interpretation does not exist"
  - id: ERR_DOCUMENT_REQUEST_NOT_FOUND
    http: 404
    condition: "referenced document request does not exist"
  - id: ERR_HEIRLOOM_NOT_FOUND
    http: 404
    condition: "referenced heirloom item does not exist"
  - id: ERR_DELIVERABLE_NOT_FOUND
    http: 404
    condition: "referenced deliverable does not exist"
  - id: ERR_MILESTONE_NOT_FOUND
    http: 404
    condition: "referenced milestone does not exist"
  - id: ERR_TIME_ENTRY_NOT_FOUND
    http: 404
    condition: "referenced time entry does not exist"
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "referenced appointment does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition not allowed from the resource's current state"
  - id: ERR_PROJECT_NOT_ACTIVE
    http: 409
    condition: "project is not ACTIVE when creating a record search or logging time"
  - id: ERR_CROSS_PROJECT_REFERENCE
    http: 409
    condition: "citation's record search and person belong to different projects"
  - id: ERR_SEARCH_NOT_COMPLETED
    http: 409
    condition: "citing a record search whose status is not COMPLETED"
  - id: ERR_INSUFFICIENT_CITATIONS
    http: 422
    condition: "verifying a person with fewer than 2 VERIFIED citations"
  - id: ERR_CONFIDENCE_BELOW_THRESHOLD
    http: 422
    condition: "verifying a person whose verified confidence_score < 0.75"
  - id: ERR_SUBJECT_NOT_VERIFIED
    http: 409
    condition: "interpreting DNA whose subject person is not VERIFIED"
  - id: ERR_RESEARCHER_UNAVAILABLE
    http: 409
    condition: "appointment within 30-minute buffer of another BOOKED appointment for the same researcher"
  - id: ERR_REPOSITORY_AT_CAPACITY
    http: 409
    condition: "appointment would exceed the repository's concurrent_capacity over an overlapping window"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "appointment end_utc not strictly after start_utc"
  - id: ERR_HOURS_CAP_EXCEEDED
    http: 409
    condition: "logging time would push consumed_hours above budget_hours * 1.5 hard cap"
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version does not match the project's current version on reconfigure"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Client
    description: "the paying customer; opens research requests and accepts/rejects deliverables"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "accept a deliverable (must own the project)"
      - "request revision on a deliverable (must own the project)"
    shared_operations:
      - "open a project (shared with ProjectManager)"
      - "read projects/persons/citations/deliverables/milestones/etc."
  - name: Researcher
    description: "the genealogist; performs searches, builds the tree, cites sources, logs hours, books visits, drafts deliverables"
    identity: "entity_backed:Researcher"
    exclusive_operations:
      - "create/complete record searches"
      - "create persons and submit-review"
      - "create/verify/dispute citations"
      - "order/interpret DNA"
      - "create document requests and update retrieval/translation"
      - "create deliverables and submit"
      - "log/void time entries"
      - "book/cancel appointments"
    shared_operations:
      - "verify a person (shared with ProjectManager)"
      - "accession/advance heirlooms (shared with ProjectManager)"
      - "read most resources"
  - name: ProjectManager
    description: "opaque operator; provisions actors/repositories, runs the project lifecycle and all milestone billing"
    identity: "opaque"
    exclusive_operations:
      - "provision clients/researchers/repositories"
      - "activate/close/reconfigure projects"
      - "create/invoice/record-payment/cancel milestones"
      - "set the logical clock"
    shared_operations:
      - "open a project (shared with Client)"
      - "verify a person (shared with Researcher)"
      - "accession/advance heirlooms (shared with Researcher)"
      - "read most resources"
