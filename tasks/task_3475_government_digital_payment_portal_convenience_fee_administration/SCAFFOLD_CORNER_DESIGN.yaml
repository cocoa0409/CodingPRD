          - roles.TreasuryOfficer
          - endpoints.POST_/portal/settlement-batches/{id}/confirm-deposit
          - errors.ERR_FORBIDDEN_FOR_ROLE
        distinguishing_aspect: "The settlement pipeline splits duties by role: PlatformAdmin closes and submits but cannot confirm the deposit (403); TreasuryOfficer confirms."
        test_recipe:
          setup:
            - "CF agency base chain; CARD transaction captured 2026-09-10; batch 2026-09-11 closed and submitted."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_card
            - *c_clk10
            - *c_quote100k
            - *c_txn
            - *c_capture
            - call: "POST /portal/settlement-batches"
              payload: { agency_id: "${ag_id}", business_date: "2026-09-11" }
              as: PlatformAdmin
              captures: { batch_id: $.data.id }
            - call: "POST /portal/settlement-batches/${batch_id}/close"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portal/settlement-batches/${batch_id}/submit"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /portal/settlement-batches/${batch_id}/confirm-deposit"
              payload: { actual_deposit_cents: 100000 }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /portal/settlement-batches/${batch_id}/confirm-deposit"
              payload: { actual_deposit_cents: 100000 }
              as: TreasuryOfficer
          assert:
            - "PlatformAdmin's confirm returns 403 and err_id == ERR_FORBIDDEN_FOR_ROLE; batch stays SUBMITTED"
            - "TreasuryOfficer's confirm returns 200 and batch becomes CONFIRMED"

      - name: compliance_auditor_cannot_create_agency
        claim_type: Violation → Error
        grounds:
          - roles.ComplianceAuditor
          - endpoints.POST_/portal/agencies
          - errors.ERR_FORBIDDEN_FOR_ROLE
        distinguishing_aspect: "ComplianceAuditor is read-only outside attestations: agency creation is 403."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /portal/agencies"
              payload: { legal_name: "Auditor's Agency", agency_type: "STATE", default_fee_model: "ABSORBED" }
              as: ComplianceAuditor
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 403 and err_id == ERR_FORBIDDEN_FOR_ROLE"
            - "GET /portal/agencies (via PlatformAdmin view) still shows no agencies — nothing persisted"

      - name: refund_same_user_decide_segregation
        claim_type: Segregation of duties
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES
          - entities.Refund.fields.initiated_by_user_id
          - entities.Refund.fields.decided_by_user_id
          - validations[priority=7]
        distinguishing_aspect: "The same X-User-ID cannot initiate and decide a refund: aa-lead's decide is 403 ERR_SEGREGATION_OF_DUTIES, aa-peer's decide on the same refund succeeds."
        test_recipe:
          setup:
            - "CF agency base chain; CAPTURED CARD transaction; OPEN batch; refund 10000 REQUESTED by aa-lead."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_card
            - *c_quote100k
            - *c_txn
            - *c_capture
            - call: "POST /portal/settlement-batches"
              payload: { agency_id: "${ag_id}", business_date: "2026-09-02" }
              as: PlatformAdmin
              captures: { batch_id: $.data.id }
            - call: "POST /portal/refunds"
              payload: { transaction_id: "${txn_id}", amount_cents: 10000, reason: "duplicate payment" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /portal/refunds/${ref_id}/decide"
              payload: { decision: "APPROVE" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { err_id: $.data.error_id }
            - call: "POST /portal/refunds/${ref_id}/decide"
              payload: { decision: "APPROVE" }
              as: AgencyAdmin
              as_user_id: "aa-peer"
          assert:
            - "same-user decide returns 403 and err_id == ERR_SEGREGATION_OF_DUTIES; refund stays REQUESTED with decided_by_user_id null"
            - "aa-peer's decide returns 200: status APPROVED, decided_by_user_id == \"aa-peer\""
            - "PaymentTransaction.${txn_id}.refunded_cents == 10000 and SettlementBatch.${batch_id}.refund_debits_cents == 10000"

      - name: payer_cannot_read_other_payer_record
        claim_type: Violation → Error
        grounds:
          - roles.Payer
          - errors.ERR_NOT_RESOURCE_OWNER
          - validations[priority=10]
        distinguishing_aspect: "Payer is entity_backed: X-User-ID of payer2 reading payer1's record is 403 ERR_NOT_RESOURCE_OWNER, while PlatformAdmin reads it fine."
        test_recipe:
