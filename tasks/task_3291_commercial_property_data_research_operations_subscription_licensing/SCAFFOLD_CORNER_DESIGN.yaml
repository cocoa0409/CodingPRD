  - name: error_property_frozen_on_attribute_proposal
    claim_type: Violation -> Error
    grounds:
    - errors.ERR_PROPERTY_FROZEN
    - state_machines.Property.RESEARCHING_to_RESEARCHING
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / state_gate_outranks_business_safety_on_a_frozen_property
      rationale: A FROZEN property is driven and observed in the named §1.8 instance, including the refusal path that would otherwise be this corner.
  - name: error_listing_overlap_on_publication
    claim_type: Violation -> Error
    grounds:
    - errors.ERR_LISTING_OVERLAP
    excluded_because:
      difficulty_instance: resource_temporal_overlap / listing_availability_intervals_collide_on_the_same_property
      rationale: The overlap refusal is the asserted failure path of the named §1.8 instance.
  - name: error_empty_index_set_on_an_empty_market
    claim_type: Violation -> Error
    grounds:
    - errors.ERR_EMPTY_INDEX_SET
    excluded_because:
      difficulty_instance: boundary_precision_check / market_index_run_on_an_empty_and_on_a_single_comparable_set
      rationale: ERR_EMPTY_INDEX_SET is asserted directly in the named §1.8 boundary instance.
  - name: error_subscription_reach_exceeded_on_market_addition
    claim_type: Violation -> Error
    grounds:
    - errors.ERR_SUBSCRIPTION_REACH_EXCEEDED
    excluded_because:
      difficulty_instance: resource_temporal_overlap / licensed_market_occupancy_share_caps_a_second_contract
      rationale: The aggregate reach refusal is the asserted failure path of the named §1.8 instance.
  - name: error_penalty_below_litigation_floor_on_escalation
    claim_type: Violation -> Error
    grounds:
    - errors.ERR_PENALTY_BELOW_LITIGATION_FLOOR
    - calculations.enforcement_penalty
    excluded_because:
      difficulty_instance: transitive_cascade / litigation_escalation_cascade_to_contract_seat_and_billed_fee
      rationale: The exact-floor escalation boundary is asserted in the named §1.8 instance.
  - name: error_stale_version_on_the_occ_guarded_writes
    claim_type: Violation -> Error
    grounds:
    - errors.ERR_STALE_VERSION
    - concurrency_rules[contract-renewal-stale-contract]
    excluded_because:
      difficulty_instance: combinatorial_formula / market_addition_fee_nested_product_and_tier_branching
      rationale: A stale expected_contract_version on a market addition is asserted in the named §1.8 instance; the remaining OCC endpoints are covered under cross_cutting_complexity_layers.
