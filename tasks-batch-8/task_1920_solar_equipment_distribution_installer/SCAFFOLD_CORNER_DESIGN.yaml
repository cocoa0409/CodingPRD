scaffold_corner_design:
  # ===========================================================================
  # Section: entities — creation, retrieval, listing, not-found, defaults,
  # computed, system fields, type constraints, parent relationships
  # ===========================================================================
  - section: entities
    instances:
      - name: product_creation_sets_initial_state_and_computed_defaults
        claim_type: creation
        grounds: ["entities.Product", "state_machines.Product"]
        distinguishing_aspect: "POST /products with valid input returns 201; status=ACTIVE, id is a UUID without type prefix."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /solar-dist/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DistributionAdmin
          trigger:
            - call: "POST /solar-dist/products"
              payload: { sku: "M-INIT", product_kind: "MODULE", manufacturer_name: "S", wattage_w: 400, ac_output_w: 0, dc_input_max_w: 0, technology_generation: 1, hts_code: "8541.43", list_price_cents: 22000 }
              as: DistributionAdmin
              captures: { p: $.data }
          assert:
            - "Product.status == ACTIVE"
            - "Product.id is a UUID (no prefix)"
            - "Product.version == 1"
            - "Product.created_at == 2026-08-01T00:00:00.000Z (logical clock)"

      - name: product_get_returns_stored_data
        claim_type: retrieval
        grounds: ["entities.Product"]
        distinguishing_aspect: "GET /products/{id} returns the stored record with all fields intact."
        test_recipe:
          setup: ["One product exists"]
          setup_api_calls:
            - call: "POST /solar-dist/products"
              payload: { sku: "M-R", product_kind: "MODULE", manufacturer_name: "S", wattage_w: 400, ac_output_w: 0, dc_input_max_w: 0, technology_generation: 1, hts_code: "8541.43", list_price_cents: 22000 }
              as: DistributionAdmin
              captures: { pid: $.data.id }
          trigger:
            - call: "GET /solar-dist/products/${pid}"
              payload: {}
              as: ChannelManager
              captures: { p: $.data }
          assert:
            - "Product.${pid}.sku == M-R"
            - "Product.${pid}.wattage_w == 400"

      - name: product_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors.ERR_PRODUCT_NOT_FOUND"]
        distinguishing_aspect: "GET with random UUID returns 404 + ERR_PRODUCT_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /solar-dist/products/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PRODUCT_NOT_FOUND"
            - "HTTP status == 404"

      - name: product_list_pagination_defaults
        claim_type: listing
        grounds: ["entities.Product", "response_envelope"]
        distinguishing_aspect: "GET /products returns paginated envelope with limit/offset/total_count/has_more defaults."
        test_recipe:
          setup: ["Three products"]
          setup_api_calls:
            - call: "POST /solar-dist/products"
              payload: { sku: "M1", product_kind: "MODULE", manufacturer_name: "S", wattage_w: 400, ac_output_w: 0, dc_input_max_w: 0, technology_generation: 1, hts_code: "8541.43", list_price_cents: 22000 }
              as: DistributionAdmin
            - call: "POST /solar-dist/products"
              payload: { sku: "M2", product_kind: "MODULE", manufacturer_name: "S", wattage_w: 410, ac_output_w: 0, dc_input_max_w: 0, technology_generation: 1, hts_code: "8541.43", list_price_cents: 23000 }
              as: DistributionAdmin
            - call: "POST /solar-dist/products"
              payload: { sku: "I1", product_kind: "INVERTER", manufacturer_name: "I", wattage_w: 0, ac_output_w: 5000, dc_input_max_w: 8000, technology_generation: 1, hts_code: "8504.40", list_price_cents: 250000 }
              as: DistributionAdmin
          trigger:
            - call: "GET /solar-dist/products?limit=2&offset=0"
              payload: {}
              as: ChannelManager
              captures: { total: $.data }
          assert:
            - "Response envelope includes total_count and has_more"
            - "Data length == 2 (limit=2)"

      - name: product_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Product", "errors.ERR_INVALID_REQUEST"]
        distinguishing_aspect: "POST /products missing sku returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /solar-dist/products"
              payload: { product_kind: "MODULE", manufacturer_name: "S", wattage_w: 400, ac_output_w: 0, dc_input_max_w: 0, technology_generation: 1, hts_code: "8541.43", list_price_cents: 22000 }
              as: DistributionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: project_computed_system_size_kw_dc_at_design_lock
        claim_type: computed_fields
        grounds: ["entities.Project.fields.system_size_kw_dc"]
        distinguishing_aspect: "system_size_kw_dc is computed at lock-design from module wattage × qty."
        test_recipe:
          setup: ["Module product with wattage_w=400, project with module_qty=10"]
          setup_api_calls:
            - call: "POST /solar-dist/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/products"
              payload: { sku: "M", product_kind: "MODULE", manufacturer_name: "S", wattage_w: 400, ac_output_w: 0, dc_input_max_w: 0, technology_generation: 1, hts_code: "8541.43", list_price_cents: 22000 }
              as: DistributionAdmin
              captures: { mod_id: $.data.id }
            - call: "POST /solar-dist/products"
              payload: { sku: "I", product_kind: "INVERTER", manufacturer_name: "I", wattage_w: 0, ac_output_w: 5000, dc_input_max_w: 8000, technology_generation: 1, hts_code: "8504.40", list_price_cents: 250000 }
              as: DistributionAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /solar-dist/compatibility-rules"
              payload: { module_product_id: "${mod_id}", inverter_product_id: "${inv_id}", max_modules_per_inverter: 20, min_modules_per_inverter: 5, effective_from: "2026-07-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/installers"
              payload: { legal_name: "P", license_number: "L", credit_limit_cents: 100000000, progress_payment_pct_bp: 10000, payment_terms_days: 30 }
              as: ChannelManager
              captures: { inst_id: $.data.id }
            - call: "POST /solar-dist/installers/${inst_id}/activate"
              payload: {}
              as: ChannelManager
            - call: "POST /solar-dist/installers/${inst_id}/projects"
              payload: { project_name: "P1", site_postal_code: "94110", module_product_id: "${mod_id}", inverter_product_id: "${inv_id}", module_qty: 10, inverter_qty: 1 }
              as: InstallerRep
              as_user_id: "${inst_id}"
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /solar-dist/projects/${proj_id}/lock-design"
              payload: {}
              as: InstallerRep
              as_user_id: "${inst_id}"
              captures: { p: $.data }
          assert:
            - "Project.system_size_kw_dc == 10 × 400 / 1000 == 4.0"
            - "Project.design_locked_at is set (non-null)"

      - name: installer_invalid_progress_pct_rejected
        claim_type: type_constraints
        grounds: ["entities.Installer.fields.progress_payment_pct_bp", "errors.ERR_INVALID_PROGRESS_PCT"]
        distinguishing_aspect: "progress_payment_pct_bp > 10000 is rejected at activation."
        test_recipe:
          setup: ["Installer created with progress_payment_pct_bp = 15000"]
          setup_api_calls:
            - call: "POST /solar-dist/installers"
              payload: { legal_name: "P", license_number: "L", credit_limit_cents: 100000000, progress_payment_pct_bp: 15000, payment_terms_days: 30 }
              as: ChannelManager
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /solar-dist/installers/${inst_id}/activate"
              payload: {}
              as: ChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_PROGRESS_PCT"
            - "HTTP status == 400"

  # ===========================================================================
  # Section: state_machines — valid transitions, precondition enforcement,
  # invalid transitions, initial state, terminal lockdown, side effects
  # ===========================================================================
  - section: state_machines
    instances:
      - name: installer_suspend_cascades_to_cancel_open_allocations
        claim_type: side_effect_execution
        grounds: ["state_machines.Installer.ACTIVE_to_SUSPENDED", "state_machines.Allocation"]
        distinguishing_aspect: "Suspending an installer cancels all OPEN allocations across their projects."
        test_recipe:
          setup: ["Installer with one OPEN allocation"]
          setup_api_calls:
            - call: "POST /solar-dist/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/tariff-rates"
              payload: { hts_code: "8541.43", duty_rate_bp: 1000, effective_from: "2026-07-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/products"
              payload: { sku: "M", product_kind: "MODULE", manufacturer_name: "S", wattage_w: 400, ac_output_w: 0, dc_input_max_w: 0, technology_generation: 3, hts_code: "8541.43", list_price_cents: 22000 }
              as: DistributionAdmin
              captures: { mod_id: $.data.id }
            - call: "POST /solar-dist/products"
              payload: { sku: "I", product_kind: "INVERTER", manufacturer_name: "I", wattage_w: 0, ac_output_w: 5000, dc_input_max_w: 8000, technology_generation: 3, hts_code: "8504.40", list_price_cents: 250000 }
              as: DistributionAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /solar-dist/tariff-rates"
              payload: { hts_code: "8504.40", duty_rate_bp: 500, effective_from: "2026-07-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/compatibility-rules"
              payload: { module_product_id: "${mod_id}", inverter_product_id: "${inv_id}", max_modules_per_inverter: 20, min_modules_per_inverter: 5, effective_from: "2026-07-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/installers"
              payload: { legal_name: "P", license_number: "L", credit_limit_cents: 100000000, progress_payment_pct_bp: 10000, payment_terms_days: 30 }
              as: ChannelManager
              captures: { inst_id: $.data.id }
            - call: "POST /solar-dist/installers/${inst_id}/activate"
              payload: {}
              as: ChannelManager
            - call: "POST /solar-dist/installers/${inst_id}/projects"
              payload: { project_name: "P1", site_postal_code: "94110", module_product_id: "${mod_id}", inverter_product_id: "${inv_id}", module_qty: 5, inverter_qty: 1 }
              as: InstallerRep
              as_user_id: "${inst_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /solar-dist/projects/${proj_id}/lock-design"
              payload: {}
              as: InstallerRep
              as_user_id: "${inst_id}"
            - call: "POST /solar-dist/containers"
              payload: { container_number: "C", bol_number: "B", origin_port: "P", eta_utc: "2026-08-05T00:00:00Z", freight_cost_cents: 0, insurance_cost_cents: 0 }
              as: DistributionAdmin
              captures: { cont_id: $.data.id }
            - call: "POST /solar-dist/containers/${cont_id}/lines"
              payload: { product_id: "${mod_id}", qty_booked: 5, declared_unit_value_cents: 50000 }
              as: DistributionAdmin
              captures: { line_mod: $.data.id, lot_mod: $.data.inventory_lot_id }
            - call: "POST /solar-dist/containers/${cont_id}/depart"
              payload: {}
              as: DistributionAdmin
            - call: "POST /solar-dist/containers/${cont_id}/arrive"
              payload: {}
              as: DistributionAdmin
              captures: { cv: $.data.version }
            - call: "POST /solar-dist/containers/${cont_id}/receive"
              payload:
                expected_container_version: "${cv}"
                line_receipts: [{ container_line_id: "${line_mod}", qty_received: 5, qty_damaged: 0 }]
              as: DistributionAdmin
            - call: "GET /solar-dist/inventory-lots/${lot_mod}"
              payload: {}
              as: DistributionAdmin
              captures: { lot_v: $.data.version }
            - call: "POST /solar-dist/projects/${proj_id}/allocations"
              payload: { inventory_lot_id: "${lot_mod}", qty_allocated: 5, expected_lot_version: "${lot_v}" }
              as: InstallerRep
              as_user_id: "${inst_id}"
              captures: { alloc: $.data.id }
          trigger:
            - call: "POST /solar-dist/installers/${inst_id}/suspend"
              payload: {}
              as: CreditOfficer
            - call: "GET /solar-dist/allocations/${alloc}"
              payload: {}
              as: ChannelManager
              captures: { a_status: $.data.status }
          assert:
            - "Allocation.${alloc}.status == CANCELLED (cascade from suspend)"
            - "Installer.${inst_id}.status == SUSPENDED"

      - name: allocation_release_from_shipped_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Allocation", "errors.ERR_ALLOCATION_NOT_OPEN"]
        distinguishing_aspect: "Allocation in SHIPPED state cannot be released."
        test_recipe:
          setup: ["Allocation in SHIPPED state"]
          setup_api_calls:
            - call: "POST /solar-dist/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/tariff-rates"
              payload: { hts_code: "8541.43", duty_rate_bp: 1000, effective_from: "2026-07-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/products"
              payload: { sku: "M", product_kind: "MODULE", manufacturer_name: "S", wattage_w: 400, ac_output_w: 0, dc_input_max_w: 0, technology_generation: 3, hts_code: "8541.43", list_price_cents: 22000 }
              as: DistributionAdmin
              captures: { mod_id: $.data.id }
            - call: "POST /solar-dist/products"
              payload: { sku: "I", product_kind: "INVERTER", manufacturer_name: "I", wattage_w: 0, ac_output_w: 5000, dc_input_max_w: 8000, technology_generation: 3, hts_code: "8504.40", list_price_cents: 250000 }
              as: DistributionAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /solar-dist/tariff-rates"
              payload: { hts_code: "8504.40", duty_rate_bp: 500, effective_from: "2026-07-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/compatibility-rules"
              payload: { module_product_id: "${mod_id}", inverter_product_id: "${inv_id}", max_modules_per_inverter: 20, min_modules_per_inverter: 5, effective_from: "2026-07-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/installers"
              payload: { legal_name: "P", license_number: "L", credit_limit_cents: 100000000, progress_payment_pct_bp: 10000, payment_terms_days: 30 }
              as: ChannelManager
              captures: { inst_id: $.data.id }
            - call: "POST /solar-dist/installers/${inst_id}/activate"
              payload: {}
              as: ChannelManager
            - call: "POST /solar-dist/installers/${inst_id}/projects"
              payload: { project_name: "P1", site_postal_code: "94110", module_product_id: "${mod_id}", inverter_product_id: "${inv_id}", module_qty: 5, inverter_qty: 1 }
              as: InstallerRep
              as_user_id: "${inst_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /solar-dist/projects/${proj_id}/lock-design"
              payload: {}
              as: InstallerRep
              as_user_id: "${inst_id}"
            - call: "POST /solar-dist/containers"
              payload: { container_number: "C", bol_number: "B", origin_port: "P", eta_utc: "2026-08-05T00:00:00Z", freight_cost_cents: 0, insurance_cost_cents: 0 }
              as: DistributionAdmin
              captures: { cont_id: $.data.id }
            - call: "POST /solar-dist/containers/${cont_id}/lines"
              payload: { product_id: "${mod_id}", qty_booked: 5, declared_unit_value_cents: 50000 }
              as: DistributionAdmin
              captures: { line_mod: $.data.id, lot_mod: $.data.inventory_lot_id }
            - call: "POST /solar-dist/containers/${cont_id}/depart"
              payload: {}
              as: DistributionAdmin
            - call: "POST /solar-dist/containers/${cont_id}/arrive"
              payload: {}
              as: DistributionAdmin
              captures: { cv: $.data.version }
            - call: "POST /solar-dist/containers/${cont_id}/receive"
              payload:
                expected_container_version: "${cv}"
                line_receipts: [{ container_line_id: "${line_mod}", qty_received: 5, qty_damaged: 0 }]
              as: DistributionAdmin
            - call: "GET /solar-dist/inventory-lots/${lot_mod}"
              payload: {}
              as: DistributionAdmin
              captures: { lot_v: $.data.version }
            - call: "POST /solar-dist/projects/${proj_id}/allocations"
              payload: { inventory_lot_id: "${lot_mod}", qty_allocated: 5, expected_lot_version: "${lot_v}" }
              as: InstallerRep
              as_user_id: "${inst_id}"
              captures: { alloc: $.data.id }
            - call: "POST /solar-dist/allocations/${alloc}/ship"
              payload: {}
              as: DistributionAdmin
          trigger:
            - call: "POST /solar-dist/allocations/${alloc}/release"
              payload: {}
              as: InstallerRep
              as_user_id: "${inst_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ALLOCATION_NOT_OPEN"
            - "HTTP status == 409"

      - name: product_discontinue_terminal_obsolete_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Product"]
        distinguishing_aspect: "OBSOLETE Product cannot transition further (no exit transitions declared)."
        test_recipe:
          setup: ["Product in DISCONTINUED for > 90 days with no inventory; clock advanced to trigger obsolescence sweep"]
          setup_api_calls:
            - call: "POST /solar-dist/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/products"
              payload: { sku: "M", product_kind: "MODULE", manufacturer_name: "S", wattage_w: 400, ac_output_w: 0, dc_input_max_w: 0, technology_generation: 1, hts_code: "8541.43", list_price_cents: 22000 }
              as: DistributionAdmin
              captures: { pid: $.data.id }
            # Create a newer product (gen 5) so the old one is >2 generations behind
            - call: "POST /solar-dist/products"
              payload: { sku: "M2", product_kind: "MODULE", manufacturer_name: "S", wattage_w: 500, ac_output_w: 0, dc_input_max_w: 0, technology_generation: 5, hts_code: "8541.43", list_price_cents: 25000 }
              as: DistributionAdmin
            - call: "POST /solar-dist/products/${pid}/discontinue"
              payload: {}
              as: DistributionAdmin
            - call: "POST /solar-dist/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: DistributionAdmin
          trigger:
            - call: "GET /solar-dist/products/${pid}"
              payload: {}
              as: DistributionAdmin
              captures: { p_status: $.data.status }
          assert:
            - "Product.${pid}.status == OBSOLETE (gen 1 vs max gen 5, lag=4 > 2; no lots reference it)"
            - "No transitions out of OBSOLETE exist (terminal)"

  # ===========================================================================
  # Section: calculations — correct results, precision, constants
  # ===========================================================================
  - section: calculations
    instances:
      - name: credit_exposure_aggregation_correct
        claim_type: correct_result
        grounds: ["calculations.credit_exposure"]
        distinguishing_aspect: "credit_exposure = sum of balance_due across OPEN/PARTIALLY_PAID/PAST_DUE invoices (WRITE_OFF excluded)."
        excluded_because:
          difficulty_instance: rma_approval_cascades_to_credit_memo_to_invoice_balance_to_installer_exposure
          rationale: "Aggregation verified end-to-end in §1.8 cascade test."

      - name: damage_claim_amount_uses_base_plus_freight
        claim_type: correct_result
        grounds: ["calculations.damage_claim_amount"]
        distinguishing_aspect: "Damage claim amount = qty_damaged × (declared_unit + per-unit freight share), insurance NOT included."
        test_recipe:
          setup: ["Container with one line, freight=10000c, insurance=5000c, qty_booked=10, declared=50000c; receive with 2 damaged"]
          setup_api_calls:
            - call: "POST /solar-dist/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/tariff-rates"
              payload: { hts_code: "8541.43", duty_rate_bp: 1000, effective_from: "2026-07-01T00:00:00Z" }
              as: DistributionAdmin
            - call: "POST /solar-dist/products"
              payload: { sku: "M", product_kind: "MODULE", manufacturer_name: "S", wattage_w: 400, ac_output_w: 0, dc_input_max_w: 0, technology_generation: 3, hts_code: "8541.43", list_price_cents: 22000 }
              as: DistributionAdmin
              captures: { mod_id: $.data.id }
            - call: "POST /solar-dist/containers"
              payload: { container_number: "C", bol_number: "B", origin_port: "P", eta_utc: "2026-08-05T00:00:00Z", freight_cost_cents: 10000, insurance_cost_cents: 5000 }
              as: DistributionAdmin
              captures: { cont_id: $.data.id }
            - call: "POST /solar-dist/containers/${cont_id}/lines"
              payload: { product_id: "${mod_id}", qty_booked: 10, declared_unit_value_cents: 50000 }
              as: DistributionAdmin
              captures: { line_mod: $.data.id, lot_mod: $.data.inventory_lot_id }
            - call: "POST /solar-dist/containers/${cont_id}/depart"
              payload: {}
              as: DistributionAdmin
            - call: "POST /solar-dist/containers/${cont_id}/arrive"
              payload: {}
              as: DistributionAdmin
              captures: { cv: $.data.version }
            - call: "POST /solar-dist/containers/${cont_id}/receive"
              payload:
                expected_container_version: "${cv}"
                line_receipts: [{ container_line_id: "${line_mod}", qty_received: 8, qty_damaged: 2 }]
              as: DistributionAdmin
            - call: "POST /solar-dist/containers/${cont_id}/damage-claims"
              payload: { container_line_id: "${line_mod}", qty_damaged: 2 }
              as: DistributionAdmin
              captures: { claim: $.data.id }
          trigger:
            - call: "POST /solar-dist/damage-claims/${claim}/file"
              payload: {}
              as: DistributionAdmin
              captures: { amt: $.data.claimed_amount_cents }
          assert:
            - "freight_per_unit = round_half_up(10000 / 10) = 1000"
            - "claimed_amount_cents = 2 × (50000 + 1000) = 102000 (insurance NOT included)"
            - "DamageClaim.${claim}.claimed_amount_cents == 102000"

  # ===========================================================================
  # Section: validations — violation→error, satisfaction→pass, priority ordering
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["\"validations[priority=1\"]", "errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"]
        distinguishing_aspect: "Missing X-User-Role header returns 400 with the auth error id."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /solar-dist/products"
              payload: {}
              as: __NO_ROLE__  # test layer omits headers
              captures: { err: $.data.error_id }
          assert:
