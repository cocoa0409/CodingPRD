          assert:
            - "err_id == ERR_STALE_VERSION (http 412): version advanced to 3 by the first proposal"
            - "first assignment remains the only non-SUPERSEDED one; retry with a fresh GET-captured version succeeds"

      - name: occ_determination_draft_stale_version_returns_412
        claim_type: violation_to_error
        grounds:
          - 'concurrency_rules[determination-draft-stale-case]'
          - 'validations[priority=7]'
          - 'errors[ERR_STALE_VERSION]'
        distinguishing_aspect: "Determination create with a case version captured before a prior draft creation is rejected 412; the prior draft is NOT superseded by the failed call."
        test_recipe:
          setup: ["full staff; case UNDER_INVESTIGATION; draft d1 created at captured version cv1"]
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
