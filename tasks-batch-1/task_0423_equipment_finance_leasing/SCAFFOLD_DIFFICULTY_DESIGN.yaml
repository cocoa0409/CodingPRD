  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: credit_conservation_book_then_terminate
        grounds:
          - state_machines.Lease.transitions.ORIGINATION_to_BOOKED
          - state_machines.Lease.transitions.END_OF_TERM_to_TERMINATED
          - entities.Lessee.fields.committed_credit_cents
          - entities.Lessee.fields.available_credit_cents
          - entities.Lessee.fields.approved_credit_cents
        distinguishing_aspect: |
          Conserved quantity = CREDIT CENTS: the invariant committed_credit_cents + available_credit_cents
          == approved_credit_cents holds before and after the book(commit)/terminate(release) pair; after
          a full lifecycle to TERMINATED, available_credit_cents returns to the full approved 1000000 and
          committed returns to 0 — zero drift.
