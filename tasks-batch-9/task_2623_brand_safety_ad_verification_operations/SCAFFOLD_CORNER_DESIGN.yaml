            - "${e_pub} == ERR_INVALID_PUBLISHER_STATE (ACTIVE -> ACTIVE is not a declared transition; the publisher was never RESTRICTED so ERR_RESTRICTION_STILL_JUSTIFIED is not the answer)"
            - "${e_mv} == ERR_INVALID_METHODOLOGY_STATE (SUSPENDED is terminal)"
