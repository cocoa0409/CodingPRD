# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: student_create_returns_201_with_system_fields
        claim_type: Creation
        grounds: ["entities.Student.fields.status", "entities.Student.fields.interim_paid_cents"]
        distinguishing_aspect: "POST /sbmb/students returns 201 with server-minted id/created_at/version, status ACTIVE, and both ledger fields initialized to 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: MedicaidCoordinator
          trigger:
            - call: "POST /sbmb/students"
              payload: { medicaid_id: "MA-C1", first_name: "Cor", last_name: "Ner", date_of_birth: "2012-02-01", district_student_id: "DC-1" }
              as: MedicaidCoordinator
              captures: { stu: $.data.id }
          assert:
            - "response_type == object"
            - "meta.api_request_id present"
            - "Student.${stu}.status == ACTIVE"
            - "Student.${stu}.interim_paid_cents == 0"
            - "Student.${stu}.verified_service_units == 0"
            - "Student.${stu}.version == 1"

      - name: student_create_missing_required_last_name
        claim_type: Required Fields
        grounds: ["entities.Student.fields.last_name", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting the required last_name field on student create returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /sbmb/students"
              payload: { medicaid_id: "MA-C2", first_name: "NoLast", date_of_birth: "2012-02-01", district_student_id: "DC-2" }
              as: MedicaidCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_VALIDATION"

      - name: student_get_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_STUDENT_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent student id returns ERR_STUDENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /sbmb/students/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: MedicaidCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_STUDENT_NOT_FOUND"

      - name: iep_authorization_invalid_enum_service_type
        claim_type: Type Constraints
        grounds: ["entities.IEPAuthorization.fields.service_type", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "A service_type outside the declared enum set returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["One student exists."]
          setup_api_calls:
            - call: "POST /sbmb/students"
              payload: { medicaid_id: "MA-C3", first_name: "En", last_name: "Um", date_of_birth: "2012-02-01", district_student_id: "DC-3" }
              as: MedicaidCoordinator
              captures: { stu: $.data.id }
          trigger:
            - call: "POST /sbmb/iep-authorizations"
              payload: { student_id: "${stu}", service_type: "NOT_A_REAL_TYPE", procedure_code: "92507", unit_minutes: 15, unit_rate_cents: 3000, authorized_minutes_per_session: 30, sessions_per_week: 2, effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: MedicaidCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_VALIDATION"

      - name: iep_authorization_create_bad_student_returns_not_found
        claim_type: Parent Relationships
        grounds: ["entities.IEPAuthorization.fields.student_id", "errors[ERR_STUDENT_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "Creating an authorization referencing a non-existent student_id returns ERR_STUDENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /sbmb/iep-authorizations"
              payload: { student_id: "00000000-0000-4000-8000-000000000000", service_type: "SPEECH_THERAPY", procedure_code: "92507", unit_minutes: 15, unit_rate_cents: 3000, authorized_minutes_per_session: 30, sessions_per_week: 2, effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: MedicaidCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_STUDENT_NOT_FOUND"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: consent_grant_when_already_granted_invalid_state
        claim_type: Idempotency
        grounds: ["state_machines.ParentalConsent.PENDING_to_GRANTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Granting a consent already in GRANTED returns ERR_INVALID_STATE (409); no second grant."
        test_recipe:
          setup: ["One GRANTED consent for a student."]
          setup_api_calls:
            - call: "POST /sbmb/students"
              payload: { medicaid_id: "MA-C4", first_name: "St", last_name: "Ate", date_of_birth: "2012-02-01", district_student_id: "DC-4" }
              as: MedicaidCoordinator
              captures: { stu: $.data.id }
            - call: "POST /sbmb/parental-consents"
              payload: { student_id: "${stu}", consent_type: "BILLING", signed_by: "Parent" }
              as: MedicaidCoordinator
              captures: { con: $.data.id }
            - call: "POST /sbmb/parental-consents/${con}/grant"
              payload: {}
              as: MedicaidCoordinator
          trigger:
            - call: "POST /sbmb/parental-consents/${con}/grant"
              payload: {}
              as: MedicaidCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"
            - "ParentalConsent.${con}.status == GRANTED"

      - name: cost_settlement_settle_before_certify_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.CostSettlement.CERTIFIED_to_SETTLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Settling a settlement still in CALCULATED (not CERTIFIED) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A CALCULATED settlement against a CLOSED quarter (4 coded moments, 2 eligible)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/providers"
              payload: { npi: "NPI-C5", first_name: "Se", last_name: "Ttl", discipline: "OT" }
              as: MedicaidCoordinator
              captures: { prov: $.data.id }
            - call: "POST /sbmb/rmts-quarters"
              payload: { fiscal_quarter: "2026-Q4" }
              as: MedicaidCoordinator
              captures: { q: $.data.id }
            - call: "POST /sbmb/rmts-moments"
              payload: { rmts_quarter_id: "${q}", provider_id: "${prov}", moment_timestamp: "2026-02-01T10:00:00Z" }
              as: MedicaidCoordinator
              captures: { m1: $.data.id }
            - call: "POST /sbmb/rmts-moments/${m1}/respond"
              payload: { activity_response: "a" }
              as: ServiceProvider
              as_user_id: "${prov}"
            - call: "POST /sbmb/rmts-moments/${m1}/code"
              payload: { activity_category: "DIRECT_MEDICAL" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/rmts-moments"
              payload: { rmts_quarter_id: "${q}", provider_id: "${prov}", moment_timestamp: "2026-02-02T10:00:00Z" }
              as: MedicaidCoordinator
              captures: { m2: $.data.id }
            - call: "POST /sbmb/rmts-moments/${m2}/respond"
              payload: { activity_response: "b" }
              as: ServiceProvider
              as_user_id: "${prov}"
            - call: "POST /sbmb/rmts-moments/${m2}/code"
              payload: { activity_category: "MEDICAL_ADMIN" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/rmts-moments"
              payload: { rmts_quarter_id: "${q}", provider_id: "${prov}", moment_timestamp: "2026-02-03T10:00:00Z" }
              as: MedicaidCoordinator
              captures: { m3: $.data.id }
            - call: "POST /sbmb/rmts-moments/${m3}/respond"
              payload: { activity_response: "c" }
              as: ServiceProvider
              as_user_id: "${prov}"
            - call: "POST /sbmb/rmts-moments/${m3}/code"
              payload: { activity_category: "NON_MEDICAL" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/rmts-moments"
              payload: { rmts_quarter_id: "${q}", provider_id: "${prov}", moment_timestamp: "2026-02-04T10:00:00Z" }
              as: MedicaidCoordinator
              captures: { m4: $.data.id }
            - call: "POST /sbmb/rmts-moments/${m4}/respond"
              payload: { activity_response: "d" }
              as: ServiceProvider
              as_user_id: "${prov}"
            - call: "POST /sbmb/rmts-moments/${m4}/code"
              payload: { activity_category: "GENERAL_ADMIN" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/rmts-quarters/${q}/close"
              payload: {}
              as: MedicaidCoordinator
              captures: { qver: $.data.version }
            - call: "POST /sbmb/cost-settlements"
              payload: { rmts_quarter_id: "${q}", certified_cost_cents: 1000000, iep_ratio_bps: 4000, fmap_bps: 5000, interim_paid_cents: 0, expected_rmts_quarter_version: "${qver}" }
              as: MedicaidCoordinator
              captures: { settle: $.data.id }
          trigger:
            - call: "POST /sbmb/cost-settlements/${settle}/settle"
              payload: {}
              as: StateReviewer
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"
            - "CostSettlement.${settle}.status == CALCULATED"

      - name: moment_respond_when_already_coded_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.RMTSMoment.GENERATED_to_RESPONDED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Responding to a moment already CODED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["One CODED moment for a provider in an OPEN quarter."]
          setup_api_calls:
            - call: "POST /sbmb/providers"
              payload: { npi: "NPI-C6", first_name: "Mo", last_name: "Ment", discipline: "PT" }
              as: MedicaidCoordinator
              captures: { prov: $.data.id }
            - call: "POST /sbmb/rmts-quarters"
              payload: { fiscal_quarter: "2027-Q1" }
              as: MedicaidCoordinator
              captures: { q: $.data.id }
            - call: "POST /sbmb/rmts-moments"
              payload: { rmts_quarter_id: "${q}", provider_id: "${prov}", moment_timestamp: "2026-02-01T10:00:00Z" }
              as: MedicaidCoordinator
              captures: { m1: $.data.id }
            - call: "POST /sbmb/rmts-moments/${m1}/respond"
              payload: { activity_response: "a" }
              as: ServiceProvider
              as_user_id: "${prov}"
            - call: "POST /sbmb/rmts-moments/${m1}/code"
              payload: { activity_category: "DIRECT_MEDICAL" }
              as: MedicaidCoordinator
          trigger:
            - call: "POST /sbmb/rmts-moments/${m1}/respond"
              payload: { activity_response: "again" }
              as: ServiceProvider
              as_user_id: "${prov}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: verify_zero_billable_units_returns_error
        claim_type: Violation → Error
        grounds: ["validations[priority=16]", "errors[ERR_ZERO_BILLABLE_UNITS]", "calculations.service_log_billable_units"]
        distinguishing_aspect: "A log delivered_minutes=3 (unit 15 rounds to 0 units) is rejected at verify with ERR_ZERO_BILLABLE_UNITS (422)."
        test_recipe:
          setup: ["Consented student, active auth (unit_minutes=15), credentialed provider, one DOCUMENTED log of 3 minutes."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/students"
              payload: { medicaid_id: "MA-C7", first_name: "Ze", last_name: "Ro", date_of_birth: "2012-02-01", district_student_id: "DC-7" }
              as: MedicaidCoordinator
              captures: { stu: $.data.id }
            - call: "POST /sbmb/providers"
              payload: { npi: "NPI-C7", first_name: "Za", last_name: "Ru", discipline: "SLP" }
              as: MedicaidCoordinator
              captures: { prov: $.data.id }
            - call: "POST /sbmb/provider-credentials"
              payload: { provider_id: "${prov}", credential_type: "STATE_LICENSE", license_number: "LC7", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: MedicaidCoordinator
              captures: { cred: $.data.id }
            - call: "POST /sbmb/provider-credentials/${cred}/activate"
              payload: {}
              as: MedicaidCoordinator
            - call: "POST /sbmb/iep-authorizations"
              payload: { student_id: "${stu}", service_type: "SPEECH_THERAPY", procedure_code: "92507", unit_minutes: 15, unit_rate_cents: 3000, authorized_minutes_per_session: 30, sessions_per_week: 2, effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: MedicaidCoordinator
              captures: { auth: $.data.id }
            - call: "POST /sbmb/iep-authorizations/${auth}/activate"
              payload: {}
              as: MedicaidCoordinator
            - call: "POST /sbmb/parental-consents"
              payload: { student_id: "${stu}", consent_type: "BILLING", signed_by: "Parent" }
              as: MedicaidCoordinator
              captures: { con: $.data.id }
            - call: "POST /sbmb/parental-consents/${con}/grant"
              payload: {}
              as: MedicaidCoordinator
            - call: "POST /sbmb/service-logs"
              payload: { iep_authorization_id: "${auth}", provider_id: "${prov}", student_id: "${stu}", service_date: "2026-03-01", start_time: "2026-03-01T09:00:00Z", end_time: "2026-03-01T09:03:00Z", delivered_minutes: 3 }
              as: ServiceProvider
              as_user_id: "${prov}"
              captures: { log: $.data.id }
            - call: "POST /sbmb/service-logs/${log}/document"
              payload: { documentation_note: "brief" }
              as: ServiceProvider
              as_user_id: "${prov}"
          trigger:
            - call: "POST /sbmb/service-logs/${log}/verify"
              payload: {}
              as: BillingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_ZERO_BILLABLE_UNITS"
            - "ServiceLog.${log}.status == DOCUMENTED"

      - name: claim_submit_with_no_encounters_returns_error
        claim_type: Violation → Error
        grounds: ["validations[priority=17]", "errors[ERR_CLAIM_NO_ENCOUNTERS]"]
        distinguishing_aspect: "Submitting a DRAFT claim with attached_log_count==0 returns ERR_CLAIM_NO_ENCOUNTERS (422)."
        test_recipe:
          setup: ["An empty DRAFT claim for a student."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/students"
              payload: { medicaid_id: "MA-C8", first_name: "Em", last_name: "Pty", date_of_birth: "2012-02-01", district_student_id: "DC-8" }
              as: MedicaidCoordinator
              captures: { stu: $.data.id }
            - call: "POST /sbmb/claims"
              payload: { student_id: "${stu}", service_month: "2026-03" }
              as: BillingCoordinator
              captures: { claim: $.data.id }
          trigger:
            - call: "POST /sbmb/claims/${claim}/submit"
              payload: {}
              as: BillingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_CLAIM_NO_ENCOUNTERS"
            - "Claim.${claim}.status == DRAFT"

      - name: service_log_outside_auth_window_returns_error
        claim_type: Temporal validation
        grounds: ["validations[priority=12]", "errors[ERR_SERVICE_OUTSIDE_AUTH_WINDOW]"]
        distinguishing_aspect: "A service_date after the authorization's expiration_date is rejected with ERR_SERVICE_OUTSIDE_AUTH_WINDOW (422)."
        test_recipe:
          setup: ["Consented student, credentialed provider, active auth with window 2026-01-01..2026-02-28; log dated 2026-03-01 (outside)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/students"
              payload: { medicaid_id: "MA-C9", first_name: "Wi", last_name: "Nd", date_of_birth: "2012-02-01", district_student_id: "DC-9" }
              as: MedicaidCoordinator
              captures: { stu: $.data.id }
            - call: "POST /sbmb/providers"
              payload: { npi: "NPI-C9", first_name: "Ow", last_name: "In", discipline: "SLP" }
              as: MedicaidCoordinator
              captures: { prov: $.data.id }
            - call: "POST /sbmb/provider-credentials"
              payload: { provider_id: "${prov}", credential_type: "STATE_LICENSE", license_number: "LC9", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: MedicaidCoordinator
              captures: { cred: $.data.id }
            - call: "POST /sbmb/provider-credentials/${cred}/activate"
              payload: {}
              as: MedicaidCoordinator
            - call: "POST /sbmb/iep-authorizations"
              payload: { student_id: "${stu}", service_type: "SPEECH_THERAPY", procedure_code: "92507", unit_minutes: 15, unit_rate_cents: 3000, authorized_minutes_per_session: 30, sessions_per_week: 2, effective_date: "2026-01-01", expiration_date: "2026-02-28" }
              as: MedicaidCoordinator
              captures: { auth: $.data.id }
            - call: "POST /sbmb/iep-authorizations/${auth}/activate"
              payload: {}
              as: MedicaidCoordinator
            - call: "POST /sbmb/parental-consents"
              payload: { student_id: "${stu}", consent_type: "BILLING", signed_by: "Parent" }
              as: MedicaidCoordinator
              captures: { con: $.data.id }
            - call: "POST /sbmb/parental-consents/${con}/grant"
              payload: {}
              as: MedicaidCoordinator
          trigger:
            - call: "POST /sbmb/service-logs"
              payload: { iep_authorization_id: "${auth}", provider_id: "${prov}", student_id: "${stu}", service_date: "2026-03-01", start_time: "2026-03-01T09:00:00Z", end_time: "2026-03-01T09:40:00Z", delivered_minutes: 40 }
              as: ServiceProvider
              as_user_id: "${prov}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_SERVICE_OUTSIDE_AUTH_WINDOW"

      - name: service_log_authorization_not_active_returns_error
        claim_type: Cross-entity validation
        grounds: ["validations[priority=11]", "errors[ERR_AUTHORIZATION_NOT_ACTIVE]"]
        distinguishing_aspect: "Logging against a DRAFT (never-activated) authorization returns ERR_AUTHORIZATION_NOT_ACTIVE (422), with consent granted and provider credentialed."
        test_recipe:
          setup: ["Consented student, credentialed provider, authorization left in DRAFT (not activated)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/students"
              payload: { medicaid_id: "MA-C10", first_name: "Dr", last_name: "Aft", date_of_birth: "2012-02-01", district_student_id: "DC-10" }
              as: MedicaidCoordinator
              captures: { stu: $.data.id }
            - call: "POST /sbmb/providers"
              payload: { npi: "NPI-C10", first_name: "In", last_name: "Ac", discipline: "SLP" }
              as: MedicaidCoordinator
              captures: { prov: $.data.id }
            - call: "POST /sbmb/provider-credentials"
              payload: { provider_id: "${prov}", credential_type: "STATE_LICENSE", license_number: "LC10", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: MedicaidCoordinator
              captures: { cred: $.data.id }
            - call: "POST /sbmb/provider-credentials/${cred}/activate"
              payload: {}
              as: MedicaidCoordinator
            - call: "POST /sbmb/iep-authorizations"
              payload: { student_id: "${stu}", service_type: "SPEECH_THERAPY", procedure_code: "92507", unit_minutes: 15, unit_rate_cents: 3000, authorized_minutes_per_session: 30, sessions_per_week: 2, effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: MedicaidCoordinator
              captures: { auth: $.data.id }
            - call: "POST /sbmb/parental-consents"
              payload: { student_id: "${stu}", consent_type: "BILLING", signed_by: "Parent" }
              as: MedicaidCoordinator
              captures: { con: $.data.id }
            - call: "POST /sbmb/parental-consents/${con}/grant"
              payload: {}
              as: MedicaidCoordinator
          trigger:
            - call: "POST /sbmb/service-logs"
              payload: { iep_authorization_id: "${auth}", provider_id: "${prov}", student_id: "${stu}", service_date: "2026-01-15", start_time: "2026-01-15T09:00:00Z", end_time: "2026-01-15T09:40:00Z", delivered_minutes: 40 }
              as: ServiceProvider
              as_user_id: "${prov}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_AUTHORIZATION_NOT_ACTIVE"

      - name: cost_settlement_quarter_not_closed_returns_error
        claim_type: Cross-entity validation
        grounds: ["validations[priority=19]", "errors[ERR_QUARTER_NOT_CLOSED]"]
        distinguishing_aspect: "Creating a settlement against an OPEN quarter returns ERR_QUARTER_NOT_CLOSED (422)."
        test_recipe:
          setup: ["An OPEN quarter (never closed)."]
          setup_api_calls:
            - call: "POST /sbmb/rmts-quarters"
              payload: { fiscal_quarter: "2027-Q2" }
              as: MedicaidCoordinator
              captures: { q: $.data.id }
          trigger:
            - call: "POST /sbmb/cost-settlements"
              payload: { rmts_quarter_id: "${q}", certified_cost_cents: 1000000, iep_ratio_bps: 4000, fmap_bps: 5000, interim_paid_cents: 0, expected_rmts_quarter_version: "${q}" }
              as: MedicaidCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_QUARTER_NOT_CLOSED"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: attach_non_verified_log_returns_error
        claim_type: Action endpoint
        grounds: ["validations[priority=8]", "errors[ERR_LOG_NOT_BILLABLE]", "state_machines.ServiceLog.VERIFIED_to_CLAIMED"]
        distinguishing_aspect: "Attaching a LOGGED (not yet VERIFIED) service log to a claim returns ERR_LOG_NOT_BILLABLE (409)."
        test_recipe:
          setup: ["A LOGGED service log and a DRAFT claim for the same student."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/students"
              payload: { medicaid_id: "MA-C11", first_name: "At", last_name: "Ch", date_of_birth: "2012-02-01", district_student_id: "DC-11" }
              as: MedicaidCoordinator
              captures: { stu: $.data.id }
            - call: "POST /sbmb/providers"
