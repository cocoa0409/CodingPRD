# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3105_oncology_practice_network_purchasing_practice_support
#
# One rule_id block per §0.5 Difficulty Rule; ≥ 2 instances each (≥ 18 total).
# Every grounds: entry resolves into SCAFFOLD.yaml §1.1–§1.6; every
# setup_api_calls ./ trigger: chain replays against §1.5 endpoint-by-endpoint.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: network_spend_provisional_versus_final
        grounds:
          - calculations.network_spend_provisional_and_final
          - calculations.practice_observed_unit_price_cents
          - entities.RebateQualification.fields.rebate_amount_cents
          - endpoints.GET_/networks/{networkId}/reporting/rebate-share
        distinguishing_aspect: "Two valid readings of credited network spend diverge on the same order rows — the provisional variant credits every shipped/received order at its observed price, the final variant excludes every fallback-priced order — so final_network_spend_cents is strictly lower whenever any order fell back to list price."
        test_recipe:
          setup:
            - "Network N with ladder boundaries TIER_2 at 0 and TIER_3 at 50000000 cents; rebate program scope ALL at rebate_pct 0.02; practice P (baseline 500) with an AffiliationContract 2026-01-01..2027-01-01 and an ACTIVE TIER_1 agreement at discount_pct 0.10 whose window is 2026-06-01..2026-12-31; drug D at network_base_price 1000; logical clock 2026-07-01T00:00:00Z."
            - "Order A of 1000 units is received on 2026-07-05 while the agreement is live; order B of 1000 units is received on 2027-03-05 after the agreement window has closed and the practice's affiliation contract has expired, so B prices at list."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { name: "Corn Belt Oncology Network", network_agreement_code: "GPO-CB-1", shortage_allocation_method: "PRO_RATA_BASELINE", tier_market_share_boundaries: [ { tier: "TIER_3", min_trailing_12m_purchases_cents: 50000000 }, { tier: "TIER_2", min_trailing_12m_purchases_cents: 0 } ] }
              as: NetworkAdmin
              captures: { n_id: $.data.id, n_v: $.data.version }
            - call: "POST /networks/${n_id}/practices"
              payload: { practice_name: "Prairie Cancer Care", practice_npi: "1234567890", state_code: "IA", drug_shortage_baseline_units: 500, pathway_steering_target_pct: 0.75, denial_ratio_threshold_pct: 0.20 }
              as: NetworkAdmin
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /networks/practices/${p_id}/affiliation-contracts"
              payload: { contract_type: "FULL_AFFILIATION", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z", notice_period_days: 30 }
              as: NetworkAdmin
              captures: { c_id: $.data.id }
            - call: "POST /networks/affiliation-contracts/${c_id}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /networks/practices/${p_id}/pricing-agreements"
              payload: { tier_level: "TIER_1", discount_pct: 0.10, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", routing_includes_out_of_scope: false }
              as: PracticeAdmin
              as_user_id: "${p_id}"
              captures: { ag_id: $.data.id }
            - call: "POST /networks/pricing-agreements/${ag_id}/submit"
              payload: { expected_practice_version: "${p_v}" }
              as: PracticeAdmin
              as_user_id: "${p_id}"
            - call: "POST /networks/pricing-agreements/${ag_id}/approve"
              payload: {}
              as: NetworkAdmin
            - call: "POST /networks/practices/${p_id}/affiliate"
              payload: {}
              as: NetworkAdmin
              captures: { p_v2: $.data.version }
            - call: "GET /networks/practices/${p_id}"
              payload: {}
              as: NetworkAdmin
              captures: { p_v3: $.data.version }
            - call: "POST /networks/${n_id}/drug-products"
              payload: { ndc: "00000000001", brand_name: "Pembrovex", generic_name: "pembrolizumab-xyz", therapeutic_class: "IMMUNOTHERAPY", unit_type: "MG", network_base_price_cents: 1000, is_shortage_candidate: false }
              as: NetworkAdmin
              captures: { d_id: $.data.id }
            - call: "POST /networks/${n_id}/rebate-programs"
              payload: { program_name: "Immunotherapy Routing FY26", drug_ndc_scope: "ALL", market_share_threshold_pct: 0.50, rebate_pct: 0.02, compliance_min_score: 0.75, period_epoch_index: 7, weight_reporting_compliance: 1, weight_adherence_steering: 1, weight_transparency: 1 }
              as: NetworkAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /networks/rebate-programs/${prog_id}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks/drug-purchase-orders"
              payload: { practice_id: "${p_id}", drug_product_id: "${d_id}", quantity_units: 1000, shortage_allocation_id: null }
              as: PracticeAdmin
              as_user_id: "${p_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /networks/drug-purchase-orders/${o1_id}/confirm"
              payload: {}
              as: NetworkAdmin
            - call: "POST /networks/drug-purchase-orders/${o1_id}/ship"
              payload: {}
              as: NetworkAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks/drug-purchase-orders/${o1_id}/receive"
              payload: { lot_number: "L-2026-07A", expires_at: "2027-07-05T00:00:00Z" }
              as: PracticeAdmin
              as_user_id: "${p_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks/drug-purchase-orders"
              payload: { practice_id: "${p_id}", drug_product_id: "${d_id}", quantity_units: 1000, shortage_allocation_id: null }
              as: PracticeAdmin
              as_user_id: "${p_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /networks/drug-purchase-orders/${o2_id}/confirm"
              payload: {}
              as: NetworkAdmin
            - call: "POST /networks/drug-purchase-orders/${o2_id}/ship"
              payload: {}
              as: NetworkAdmin
            - call: "POST /networks/drug-purchase-orders/${o2_id}/receive"
              payload: { lot_number: "L-2027-03B", expires_at: "2028-03-05T00:00:00Z" }
              as: PracticeAdmin
              as_user_id: "${p_id}"
          trigger:
            - call: "GET /networks/${n_id}/reporting/rebate-share"
              payload: { practice_id: "${p_id}", rebate_program_id: "${prog_id}", window_start_at: "2026-01-01T00:00:00Z", window_end_at: "2028-01-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { r_prov: $.data.provisional_network_spend_cents, r_final: $.data.final_network_spend_cents }
          assert:
            - "GET returns provisional_network_spend_cents == 1800000 — both orders billed at their own observed unit price (900 x 1000 for the agreement-priced order, 1000 x 1000 for the list-priced order)"
            - "GET returns final_network_spend_cents == 900000 — the fallback-priced order contributes nothing once the period is closed"
            - "final_network_spend_cents != provisional_network_spend_cents"
            - "GET /networks/drug-purchase-orders?practice_id=${p_id} returns order ${o1_id} with pricing_tier_applied == TIER_1 and unit_price_cents == 900"
            - "GET /networks/drug-purchase-orders?practice_id=${p_id} returns order ${o2_id} with unit_price_cents == 1000, the undiscounted list price"

      - name: market_share_routing_denominator_divergence
        grounds:
          - calculations.rebate_routing_market_share
          - entities.PracticePricingAgreement.fields.routing_includes_out_of_scope
          - entities.RebateQualification.fields.market_share_pct
          - validations[priority=4]
        distinguishing_aspect: "The same practice and window yield two market-share figures because the agreement's rebate routing term controls whether out-of-scope billed claims join the denominator — 0.6032 under the narrow denominator and 0.4318 under the wide one on identical data, so the practice crosses a 0.50 threshold under one reading and falls below it under the other."
        test_recipe:
          setup:
            - "Network N; practice P affiliated with an ACTIVE contract and an ACTIVE TIER_2 agreement at discount_pct 0.05 with routing_includes_out_of_scope false. Two products: D1 in the program's NDC scope at 1000 cents (760 routed units received), D2 outside it at 1000 cents (500 units received and administered). One claim from the D2 treatment is ADJUDICATED_PAID at 500000 cents allowed, which the wide reading counts as non-network billed volume."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks"
              payload: { name: "Corn Belt Oncology Network", network_agreement_code: "GPO-CB-2", shortage_allocation_method: "PRO_RATA_BASELINE", tier_market_share_boundaries: [ { tier: "TIER_3", min_trailing_12m_purchases_cents: 50000000 }, { tier: "TIER_2", min_trailing_12m_purchases_cents: 0 } ] }
              as: NetworkAdmin
              captures: { n_id: $.data.id }
            - call: "POST /networks/${n_id}/practices"
              payload: { practice_name: "Loess Hills Hematology", practice_npi: "2345678901", state_code: "IA", drug_shortage_baseline_units: 400, pathway_steering_target_pct: 0.75, denial_ratio_threshold_pct: 0.20 }
              as: NetworkAdmin
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /networks/practices/${p_id}/affiliation-contracts"
              payload: { contract_type: "FULL_AFFILIATION", term_start: "2026-01-01T00:00:00Z", term_end: "2028-01-01T00:00:00Z", notice_period_days: 60 }
              as: NetworkAdmin
              captures: { c_id: $.data.id }
            - call: "POST /networks/affiliation-contracts/${c_id}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /networks/practices/${p_id}/pricing-agreements"
              payload: { tier_level: "TIER_2", discount_pct: 0.05, effective_from: "2026-06-01T00:00:00Z", effective_to: null, routing_includes_out_of_scope: false }
              as: PracticeAdmin
              as_user_id: "pa-loess"
              captures: { ag_id: $.data.id }
            - call: "POST /networks/pricing-agreements/${ag_id}/submit"
              payload: { expected_practice_version: "${p_v}" }
              as: PracticeAdmin
              as_user_id: "pa-loess"
            - call: "POST /networks/pricing-agreements/${ag_id}/approve"
              payload: {}
              as: NetworkAdmin
            - call: "POST /networks/practices/${p_id}/affiliate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /networks/${n_id}/drug-products"
              payload: { ndc: "00000000002", brand_name: "Trastumax", generic_name: "trastuzumab-xyz", therapeutic_class: "IMMUNOTHERAPY", unit_type: "MG", network_base_price_cents: 1000, is_shortage_candidate: false }
              as: NetworkAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /networks/${n_id}/drug-products"
              payload: { ndc: "00000000003", brand_name: "Zoledrex", generic_name: "zoledronic-xyz", therapeutic_class: "SUPPORTIVE_CARE", unit_type: "MG", network_base_price_cents: 1000, is_shortage_candidate: false }
              as: NetworkAdmin
              captures: { d2_id: $.data.id }
            - call: "POST /networks/${n_id}/rebate-programs"
              payload: { program_name: "Scope-Limited Routing FY26", drug_ndc_scope: "00000000002", market_share_threshold_pct: 0.50, rebate_pct: 0.02, compliance_min_score: 0.00, period_epoch_index: 7, weight_reporting_compliance: 1, weight_adherence_steering: 1, weight_transparency: 1 }
              as: NetworkAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /networks/rebate-programs/${prog_id}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /networks/practices/${p_id}/providers"
              payload: { full_name: "Dr. Marta Voss", npi: "1000000004", specialty: "MEDICAL_ONCOLOGY", is_billing_provider: true }
              as: PracticeAdmin
              as_user_id: "pa-loess"
              captures: { pr_id: $.data.id }
            - call: "POST /networks/${n_id}/pathway-protocols"
              payload: { protocol_code: "SUPPORTIVE-1L", indication: "BREAST", on_pathway_regimen_codes: ["ZOL-MONO"], declared_regimen_codes: ["ZOL-MONO", "OTHER"], off_pathway_penalty_score: 0.25, version_label: "2026.1" }
              as: NetworkAdmin
              captures: { prot_id: $.data.id }
            - call: "PUT /networks/pathway-protocols/${prot_id}"
              payload: { status: "PUBLISHED" }
              as: NetworkAdmin
            - call: "POST /networks/practices/${p_id}/pathways/adopt"
              payload: {}
              as: PracticeAdmin
              as_user_id: "pa-loess"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /networks/drug-purchase-orders"
              payload: { practice_id: "${p_id}", drug_product_id: "${d1_id}", quantity_units: 800, shortage_allocation_id: null }
              as: PracticeAdmin
