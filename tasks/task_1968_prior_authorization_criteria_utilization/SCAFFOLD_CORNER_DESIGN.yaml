            - { call: "GET /um/determinations", payload: { request_id: "${req}" }, as: UMAdmin, captures: { det: "$.data[0].id" } }
            - { call: "POST /um/determinations/${det}/appeals", payload: { appeal_reason: "More records" }, as: AppealsClerk, captures: { ap: $.data.id } }
            - { call: "POST /um/appeals/${ap}/begin-review", payload: {}, as: AppealsReviewer, as_user_id: "u-ar-1" }
            - { call: "POST /um/appeals/${ap}/decide", payload: { outcome: "UPHELD" }, as: AppealsReviewer, as_user_id: "u-ar-1", captures: { decided1: $.data.decided_at } }
          trigger:
            - { call: "POST /um/appeals/${ap}/decide", payload: { outcome: "OVERTURNED" }, as: AppealsReviewer, as_user_id: "u-ar-1", captures: { err: $.data.error_id } }
            - { call: "GET /um/appeals/${ap}", payload: {}, as: AppealsClerk, captures: { st: $.data.status, decided2: $.data.decided_at } }
          assert:
            - "err == ERR_INVALID_APPEAL_STATE"
            - "st == UPHELD and decided2 == decided1 (terminal state locked)"

      - name: p2p_resolve_after_completed_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.PeerToPeerConference, "errors[ERR_P2P_NOT_RESOLVABLE]"]
        distinguishing_aspect: "A COMPLETED conference rejects a second resolve with ERR_P2P_NOT_RESOLVABLE; status stays COMPLETED."
        test_recipe:
          setup: ["Active criteria set; provider; escalated request; conference SCHEDULED by u-md-1"]
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv_id: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "2000000008", name: "Resolve Provider" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { req: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${req}/reviewer-decision", payload: { decision: "ESCALATE" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests/${req}/peer-to-peer-conferences", payload: { scheduled_start: "2026-08-10T14:00:00Z", scheduled_end: "2026-08-10T15:00:00Z" }, as: MedicalDirector, as_user_id: "u-md-1", captures: { p2p: $.data.id } }
            - { call: "POST /um/peer-to-peer-conferences/${p2p}/resolve", payload: { outcome: "COMPLETED" }, as: MedicalDirector, as_user_id: "u-md-1" }
          trigger:
            - { call: "POST /um/peer-to-peer-conferences/${p2p}/resolve", payload: { outcome: "NO_SHOW" }, as: MedicalDirector, as_user_id: "u-md-1", captures: { err: $.data.error_id } }
            - { call: "GET /um/prior-auth-requests/${req}/peer-to-peer-conferences", payload: {}, as: UMAdmin, captures: { st: "$.data[0].status" } }
          assert:
            - "err == ERR_P2P_NOT_RESOLVABLE"
            - "st == COMPLETED"

      - name: withdraw_cascades_cancel_scheduled_p2p
        claim_type: side_effect_execution
        grounds: [state_machines.PriorAuthRequest.ESCALATED_MD_to_WITHDRAWN, state_machines.PeerToPeerConference.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "Withdrawing an escalated request conditionally cascades: the SCHEDULED conference flips to CANCELLED while an already-COMPLETED conference on another request would be untouched (conditional cascade over child state)."
        test_recipe:
          setup: ["Active criteria set; provider; escalated request with a SCHEDULED conference"]
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv_id: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "2000000009", name: "Cascade Withdraw Provider" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { req: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${req}/reviewer-decision", payload: { decision: "ESCALATE" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests/${req}/peer-to-peer-conferences", payload: { scheduled_start: "2026-08-10T14:00:00Z", scheduled_end: "2026-08-10T15:00:00Z" }, as: MedicalDirector, as_user_id: "u-md-1", captures: { p2p: $.data.id } }
          trigger:
            - { call: "POST /um/prior-auth-requests/${req}/withdraw", payload: {}, as: IntakeSpecialist, captures: { st: $.data.status } }
            - { call: "GET /um/prior-auth-requests/${req}/peer-to-peer-conferences", payload: {}, as: UMAdmin, captures: { p2p_st: "$.data[0].status" } }
          assert:
            - "st == WITHDRAWN"
            - "p2p_st == CANCELLED (cascade fired only because the conference was SCHEDULED)"

      - name: criteria_set_activation_without_published_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ClinicalCriteriaSet.DRAFT_to_ACTIVE, "errors[ERR_NO_ACTIVE_GUIDELINE]"]
        distinguishing_aspect: "DRAFT -> ACTIVE requires at least one PUBLISHED guideline version in the set; with only a DRAFT version the activation fails with ERR_NO_ACTIVE_GUIDELINE."
        test_recipe:
          setup: ["Criteria set with one DRAFT guideline version (none published)"]
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Empty Library Set", line_of_business: "MEDICAID", service_category: "DME" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "0.1", content: "draft only", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor }
          trigger:
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor, captures: { err: $.data.error_id } }
            - { call: "GET /um/criteria-sets/${cs_id}", payload: {}, as: ClinicalPolicyEditor, captures: { st: $.data.status } }
          assert:
            - "err == ERR_NO_ACTIVE_GUIDELINE"
            - "st == DRAFT"

      - name: appeal_begin_review_assigns_reviewer
        claim_type: valid_transition
        grounds: [state_machines.Appeal.RECEIVED_to_IN_REVIEW, entities.Appeal.fields.reviewer_id]
        distinguishing_aspect: "begin-review moves RECEIVED -> IN_REVIEW and stamps reviewer_id with the caller's X-User-ID; the appeal due_at is received_at + 720h."
        test_recipe:
          setup: ["Active criteria set; provider; denied request; appeal filed at default clock"]
          setup_api_calls:
