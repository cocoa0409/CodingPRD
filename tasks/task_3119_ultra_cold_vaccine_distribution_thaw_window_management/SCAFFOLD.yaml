    input: ["dispatch_order_id?", "packing_status?", "limit?", "offset?"]
    output: "ColdChainShipper[]"
    side_effects: []
  - method: GET
    path: "/vaccine-distribution/shippers/{id}"
    description: "Get one cold chain shipper"
