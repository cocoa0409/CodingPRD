              as: LibraryAdmin
              captures: { work_id: $.data.id }
            - call: "POST /library/rental-sets"
              payload: { work_id: "${work_id}", set_code: "SET-801", copy_count: 30, replacement_value_cents: 240000 }
              as: LibraryAdmin
              captures: { set_id: $.data.id }
            - call: "POST /library/customer-accounts"
