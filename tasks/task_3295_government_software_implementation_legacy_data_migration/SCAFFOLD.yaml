- method: POST
  path: /programs/go-live-events/{id}/revise
  description: READINESS_CHECKED -> PROPOSED with new date
  roles:
  - ImplementationManager
  code: 200
  input:
  - planned_date
  output: GoLiveEvent
  side_effects: []
- method: POST
  path: /programs/go-live-events/{id}/execute
  description: APPROVED -> EXECUTED on exact planned_date; creates SupportTransition; releases retainage
  roles:
  - ImplementationManager
  code: 200
  input: []
  output: GoLiveEvent
  side_effects:
  - create SupportTransition
  - retainage release
  - append AuditLogEntry
- method: POST
  path: /programs/go-live-events/{id}/rollback
  description: EXECUTED -> ROLLED_BACK within 14 days
  roles:
  - ImplementationManager
  code: 200
  input:
  - rollback_reason
  output: GoLiveEvent
  side_effects:
  - block maintenance activation
  - append AuditLogEntry
- method: POST
  path: /programs/go-live-events/{id}/replan
  description: ROLLED_BACK -> PROPOSED with future date
  roles:
  - ImplementationManager
  code: 200
  input:
  - planned_date
  output: GoLiveEvent
  side_effects: []
- method: POST
  path: /programs/go-live-events/{id}/cancel
  description: PROPOSED -> CANCELLED
  roles:
  - ImplementationManager
  code: 200
  input: []
  output: GoLiveEvent
  side_effects: []
