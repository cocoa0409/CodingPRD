              as: MerchandisingManager
              captures: { oE: $.data.id }
            - *c_channel
            - *c_provision
            - *c_health_ok
            - *c_ready
            - *c_clock_prelive
            - *c_golive
            - *c_clock_live
            - call: "POST /flash-offers/${oE}/activate"
              payload: {}
              as: MerchandisingManager
            - *c_cart1
            - call: "POST /products/${p1}/claim-substantiations"
              payload: { decision: "REJECTED", evidence_ref: "COMPLAINT-12" }
              as: ComplianceOfficer
              as_user_id: "co-claims-1"
          trigger:
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${oE}", qty: 5 }
              as: Viewer
              as_user_id: "${v1}"
              captures: { err_claim: $.data.error_id }
            - call: "POST /products/${p1}/claim-substantiations"
              payload: { decision: "SUBSTANTIATED", evidence_ref: "LAB-90" }
              as: ComplianceOfficer
              as_user_id: "co-claims-1"
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${oE}", qty: 5 }
              as: Viewer
              as_user_id: "${v1}"
              captures: { err_qty: $.data.error_id }
          assert:
            - "First add: HTTP 422 with ${err_claim} == ERR_CLAIM_NOT_SUBSTANTIATED (not ERR_OFFER_QTY_EXCEEDED)"
            - "Second add, identical qty 5 with the claim restored: HTTP 422 with ${err_qty} == ERR_OFFER_QTY_EXCEEDED"
            - "No CartItem row exists for Cart.${ct1} and Cart.${ct1}.held_item_count == 0"
            - "Product.${p1}.reserved_qty == 0 and available_qty == 50; FlashOffer.${oE}.held_qty == 0 and remaining_qty == 1"
            - "FlashOffer.${oE}.status == ACTIVE throughout (a rejected claim does not cancel the offer)"

      - name: checkout_stale_version_beats_empty_cart
        grounds:
          - validations[priority=7]
          - validations[priority=28]
          - concurrency_rules[cart-checkout-stale-cart]
          - errors[ERR_STALE_CART_VERSION]
          - errors[ERR_EMPTY_CART]
        distinguishing_aspect: |
          Category pair: state/optimistic-concurrency (priority 7,
          ERR_STALE_CART_VERSION, 412) beats business_constraint (priority 28,
          ERR_EMPTY_CART, 422) — a third distinct pair. The cart is simultaneously
          empty and addressed with a stale expected_cart_version, and the conflict
          error must win; replaying with the current version surfaces the empty-cart
          error, so neither check is dead.
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z with the ACTIVE 3500-cent offer; viewer 1's cart is OPEN with zero lines and version 1."
          setup_api_calls:
            - *c_clock_t0
            - *c_host
            - *c_cert
            - *c_viewer1
            - *c_product
            - *c_substantiate
            - *c_show
            - *c_booking
            - *c_disclosure
            - *c_confirm
            - *c_ack
            - *c_slot
            - *c_offer
            - *c_channel
            - *c_provision
            - *c_health_ok
            - *c_ready
            - *c_clock_prelive
            - *c_golive
            - *c_clock_live
            - *c_activate
            - *c_cart1
            - call: "GET /carts/${ct1}"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
              captures: { ct1_v: $.data.version }
          trigger:
            - call: "POST /carts/${ct1}/checkout"
