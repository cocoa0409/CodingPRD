scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: session_gross_hourly_vs_piece_diverge
        grounds:
          - calculations.session_gross
          - state_machines.Appointment.CONFIRMED_to_COMPLETED
          - entities.Appointment.fields.gross_cents
        distinguishing_aspect: |
          Two valid algorithms on the Appointment domain produce different gross
          for the same booking subject: HOURLY (ceil(actual_minutes/15)*hourly_rate/4
          = 63000 for 200 min @ 18000/hr) vs PIECE (flat 55000). Different result, same entity domain.
        test_recipe:
          setup:
            - "One Artist with hourly_rate_cents=18000; one VERIFIED Client; one active Chair."
            - "Two HELD->CONFIRMED appointments: A1 HOURLY (rate 18000, est 180), A2 PIECE (flash, price 55000)."
            - "A1 completed with actual_minutes=200; A2 completed (PIECE ignores actual_minutes)."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: StudioManager
            - call: "POST /studio/artists"
              payload: { display_name: "Ink One", discipline: "TATTOO", hourly_rate_cents: 18000, commission_pct: 0.70 }
              as: StudioManager
              captures: { artist_id: $.data.id }
            - call: "POST /studio/chairs"
              payload: { label: "Station 1", cleanup_buffer_minutes: 30 }
              as: StudioManager
              captures: { chair_id: $.data.id, chair_v: $.data.version }
            - call: "POST /studio/flash-designs"
              payload: { artist_id: "${artist_id}", title: "Rose", piece_price_cents: 55000, estimated_minutes: 120 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { flash_id: $.data.id }
            - call: "POST /studio/clients"
              payload: { full_name: "Casey Verified", email: "casey@x.com", date_of_birth: "2000-01-01" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/clients/${client_id}/id-verification"
              payload: { id_document_type: "PASSPORT" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/clients/${client_id}/id-verification/approve"
              payload: {}
              as: StudioManager
            - call: "POST /studio/appointments"
              payload: { artist_id: "${artist_id}", client_id: "${client_id}", chair_id: "${chair_id}", expected_chair_version: "${chair_v}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 180, start_at: "2026-06-10T10:00:00Z", end_at: "2026-06-10T13:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { a1_id: $.data.id, a1_v: $.data.version, a1_rd: $.data.required_deposit_cents }
            - call: "POST /studio/appointments/${a1_id}/deposits"
              payload: { amount_cents: 10800, expected_appointment_version: "${a1_v}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/appointments/${a1_id}/waiver"
              payload: { client_id: "${client_id}", medical_flags: [], aftercare_acknowledged: true }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/appointments/${a1_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /studio/chairs/${chair_id}"
              payload: {}
              as: StudioManager
              captures: { chair_v2: $.data.version }
            - call: "POST /studio/appointments"
              payload: { artist_id: "${artist_id}", client_id: "${client_id}", chair_id: "${chair_id}", expected_chair_version: "${chair_v2}", pricing_mode: "PIECE", flash_design_id: "${flash_id}", piece_price_cents: 55000, estimated_minutes: 120, start_at: "2026-06-11T10:00:00Z", end_at: "2026-06-11T12:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { a2_id: $.data.id, a2_v: $.data.version }
            - call: "POST /studio/appointments/${a2_id}/deposits"
              payload: { amount_cents: 11000, expected_appointment_version: "${a2_v}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/appointments/${a2_id}/waiver"
              payload: { client_id: "${client_id}", medical_flags: [], aftercare_acknowledged: true }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/appointments/${a2_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /studio/appointments/${a1_id}/complete"
              payload: { actual_minutes: 200 }
              as: Artist
              as_user_id: "${artist_id}"
            - call: "POST /studio/appointments/${a2_id}/complete"
              payload: {}
              as: Artist
              as_user_id: "${artist_id}"
          assert:
            - "Appointment.${a1_id}.gross_cents == 63000"
            - "Appointment.${a2_id}.gross_cents == 55000"
            - "Appointment.${a1_id}.gross_cents != Appointment.${a2_id}.gross_cents"

      - name: artist_reliability_strict_vs_lenient_diverge
        grounds:
          - calculations.artist_reliability_score
          - state_machines.Appointment.CONFIRMED_to_CANCELLED
          - entities.Artist.fields.reliability_score
        distinguishing_aspect: |
          On the Artist domain (different entity than session_gross's Appointment),
          STRICT (100 - 5*cancel - 10*late_resched) and LENIENT (100 - 5*cancel)
          variants of the same counters produce different scores: after 1 artist
          cancel + 1 late reschedule, strict=85 but lenient=95.
        test_recipe:
          setup:
            - "One Artist; one VERIFIED Client; two active Chairs."
            - "Two CONFIRMED appointments far in the future for that artist."
            - "One appointment forfeit-rescheduled (within 48h window) -> late_reschedule_count=1; the other artist-cancelled -> artist_cancel_count=1."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: StudioManager
            - call: "POST /studio/artists"
              payload: { display_name: "Ink Two", discipline: "TATTOO", hourly_rate_cents: 18000, commission_pct: 0.70 }
              as: StudioManager
              captures: { artist_id: $.data.id }
            - call: "POST /studio/chairs"
              payload: { label: "Station A", cleanup_buffer_minutes: 30 }
              as: StudioManager
              captures: { chair1_id: $.data.id, chair1_v: $.data.version }
            - call: "POST /studio/chairs"
              payload: { label: "Station B", cleanup_buffer_minutes: 30 }
              as: StudioManager
              captures: { chair2_id: $.data.id, chair2_v: $.data.version }
            - call: "POST /studio/clients"
              payload: { full_name: "Dana V", email: "dana@x.com", date_of_birth: "1999-05-05" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/clients/${client_id}/id-verification"
              payload: { id_document_type: "DRIVERS_LICENSE" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/clients/${client_id}/id-verification/approve"
              payload: {}
              as: StudioManager
            - call: "POST /studio/appointments"
              payload: { artist_id: "${artist_id}", client_id: "${client_id}", chair_id: "${chair1_id}", expected_chair_version: "${chair1_v}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 180, start_at: "2026-06-02T12:00:00Z", end_at: "2026-06-02T15:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { ap1_id: $.data.id, ap1_v: $.data.version }
            - call: "POST /studio/appointments/${ap1_id}/deposits"
              payload: { amount_cents: 10800, expected_appointment_version: "${ap1_v}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/appointments/${ap1_id}/waiver"
              payload: { client_id: "${client_id}", medical_flags: [], aftercare_acknowledged: true }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/appointments/${ap1_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/appointments"
              payload: { artist_id: "${artist_id}", client_id: "${client_id}", chair_id: "${chair2_id}", expected_chair_version: "${chair2_v}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 180, start_at: "2026-06-20T12:00:00Z", end_at: "2026-06-20T15:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { ap2_id: $.data.id, ap2_v: $.data.version }
            - call: "POST /studio/appointments/${ap2_id}/deposits"
              payload: { amount_cents: 10800, expected_appointment_version: "${ap2_v}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/appointments/${ap2_id}/waiver"
              payload: { client_id: "${client_id}", medical_flags: [], aftercare_acknowledged: true }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/appointments/${ap2_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /studio/appointments/${ap1_id}/reschedule"
              payload: { start_at: "2026-06-02T16:00:00Z", end_at: "2026-06-02T19:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/appointments/${ap2_id}/cancel-by-artist"
              payload: {}
              as: Artist
              as_user_id: "${artist_id}"
          assert:
            - "Artist.${artist_id}.artist_cancel_count == 1"
            - "Artist.${artist_id}.late_reschedule_count == 1"
            - "Artist.${artist_id}.reliability_score == 85"
            - "GET /studio/artists/${artist_id} -> data.reliability_score_lenient == 95"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: payout_three_input_nonlinear_floor
        grounds:
          - calculations.artist_payout
          - entities.Artist.fields.commission_pct
          - entities.Appointment.fields.gross_cents
        distinguishing_aspect: |
          Mode (a): a formula with 3 inputs (gross_cents, commission_pct,
          SUPPLY_FEE_CENTS) and a non-linear max(0, ...) floor —
          artist_cut = max(0, round(63000*0.70) - 3500) = 40600, studio_cut = 22400.
        test_recipe:
          setup:
            - "One Artist commission_pct=0.70; one VERIFIED Client; one Chair."
            - "One HOURLY appointment completed with actual_minutes=200 -> gross 63000."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: StudioManager
            - call: "POST /studio/artists"
              payload: { display_name: "Payout Artist", discipline: "TATTOO", hourly_rate_cents: 18000, commission_pct: 0.70 }
              as: StudioManager
              captures: { artist_id: $.data.id }
            - call: "POST /studio/chairs"
              payload: { label: "Station P", cleanup_buffer_minutes: 30 }
              as: StudioManager
              captures: { chair_id: $.data.id, chair_v: $.data.version }
            - call: "POST /studio/clients"
              payload: { full_name: "Pat V", email: "pat@x.com", date_of_birth: "1990-03-03" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/clients/${client_id}/id-verification"
              payload: { id_document_type: "PASSPORT" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/clients/${client_id}/id-verification/approve"
              payload: {}
              as: StudioManager
            - call: "POST /studio/appointments"
              payload: { artist_id: "${artist_id}", client_id: "${client_id}", chair_id: "${chair_id}", expected_chair_version: "${chair_v}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 180, start_at: "2026-06-10T10:00:00Z", end_at: "2026-06-10T13:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { ap_id: $.data.id, ap_v: $.data.version }
            - call: "POST /studio/appointments/${ap_id}/deposits"
              payload: { amount_cents: 10800, expected_appointment_version: "${ap_v}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/appointments/${ap_id}/waiver"
              payload: { client_id: "${client_id}", medical_flags: [], aftercare_acknowledged: true }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/appointments/${ap_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/appointments/${ap_id}/complete"
              payload: { actual_minutes: 200 }
              as: Artist
              as_user_id: "${artist_id}"
          trigger:
            - call: "GET /studio/appointments/${ap_id}/payout"
              payload: {}
              as: StudioManager
              captures: { ac: $.data.artist_cut_cents, sc: $.data.studio_cut_cents }
          assert:
            - "payout.artist_cut_cents == 40600"
            - "payout.studio_cut_cents == 22400"
            - "payout.gross_cents == 63000"

      - name: final_balance_pinned_tax_after_deposit_order
        grounds:
          - calculations.session_final_balance
          - calculations.session_gross
          - entities.Appointment.fields.balance_due_cents
        distinguishing_aspect: |
          Mode (c): circular-looking deposit/tax dependency with a PINNED order —
          tax is charged on the post-deposit balance (pre_tax = gross - deposit = 52200,
          tax = round(52200*0.08)=4176, balance = 56376), NOT on gross
          (which would yield 58040). The pinned order changes the result.
        test_recipe:
          setup:
            - "One Artist hourly_rate_cents=18000; one VERIFIED Client; one Chair."
            - "One HOURLY appointment, deposit_paid 10800, completed actual_minutes=200 -> gross 63000."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: StudioManager
            - call: "POST /studio/artists"
              payload: { display_name: "Bal Artist", discipline: "TATTOO", hourly_rate_cents: 18000, commission_pct: 0.70 }
              as: StudioManager
              captures: { artist_id: $.data.id }
            - call: "POST /studio/chairs"
              payload: { label: "Station Bal", cleanup_buffer_minutes: 30 }
              as: StudioManager
              captures: { chair_id: $.data.id, chair_v: $.data.version }
            - call: "POST /studio/clients"
              payload: { full_name: "Bal V", email: "bal@x.com", date_of_birth: "1991-04-04" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/clients/${client_id}/id-verification"
              payload: { id_document_type: "PASSPORT" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/clients/${client_id}/id-verification/approve"
              payload: {}
              as: StudioManager
            - call: "POST /studio/appointments"
              payload: { artist_id: "${artist_id}", client_id: "${client_id}", chair_id: "${chair_id}", expected_chair_version: "${chair_v}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 180, start_at: "2026-06-10T10:00:00Z", end_at: "2026-06-10T13:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { ap_id: $.data.id, ap_v: $.data.version }
            - call: "POST /studio/appointments/${ap_id}/deposits"
              payload: { amount_cents: 10800, expected_appointment_version: "${ap_v}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/appointments/${ap_id}/waiver"
              payload: { client_id: "${client_id}", medical_flags: [], aftercare_acknowledged: true }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/appointments/${ap_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /studio/appointments/${ap_id}/complete"
              payload: { actual_minutes: 200 }
              as: Artist
              as_user_id: "${artist_id}"
          assert:
            - "Appointment.${ap_id}.gross_cents == 63000"
            - "Appointment.${ap_id}.balance_due_cents == 56376"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: custom_request_quote_revision_cycle
        grounds:
          - state_machines.CustomDesignRequest.QUOTED_to_REVISION_REQUESTED
          - state_machines.CustomDesignRequest.REVISION_REQUESTED_to_QUOTED
          - entities.CustomDesignRequest.fields.status
        distinguishing_aspect: |
          Cyclic shape on CustomDesignRequest: QUOTED -> REVISION_REQUESTED -> QUOTED
          (negotiation round) is a true loop returning to a prior state, distinct
          from any linear pipeline.
        test_recipe:
          setup:
            - "One Artist; one Client; one PENDING custom request."
            - "Artist quotes -> QUOTED; client requests revision -> REVISION_REQUESTED; artist re-quotes -> QUOTED."
          setup_api_calls:
            - call: "POST /studio/artists"
              payload: { display_name: "Cyc Artist", discipline: "TATTOO", hourly_rate_cents: 16000, commission_pct: 0.70 }
              as: StudioManager
              captures: { artist_id: $.data.id }
            - call: "POST /studio/clients"
              payload: { full_name: "Cyc Client", email: "cyc@x.com", date_of_birth: "1995-06-06" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/custom-requests"
              payload: { artist_id: "${artist_id}", client_id: "${client_id}", brief: "Dragon sleeve" }
              as: Client
              as_user_id: "${client_id}"
              captures: { req_id: $.data.id }
            - call: "POST /studio/custom-requests/${req_id}/quote"
              payload: { quoted_price_cents: 60000, estimated_minutes: 240 }
              as: Artist
              as_user_id: "${artist_id}"
            - call: "POST /studio/custom-requests/${req_id}/request-revision"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /studio/custom-requests/${req_id}/quote"
              payload: { quoted_price_cents: 50000, estimated_minutes: 200 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { st: $.data.status, qp: $.data.quoted_price_cents }
          assert:
            - "CustomDesignRequest.${req_id}.status == QUOTED"
            - "CustomDesignRequest.${req_id}.quoted_price_cents == 50000"
            - "CustomDesignRequest.${req_id}.estimated_minutes == 200"

      - name: appointment_branching_cancel_vs_artist_cancel
        grounds:
          - state_machines.Appointment.CONFIRMED_to_CANCELLED
          - state_machines.Appointment.HELD_to_CANCELLED
          - entities.Appointment.fields.status
        distinguishing_aspect: |
          Branching on Appointment (different entity than CustomDesignRequest):
          from CONFIRMED the machine forks to CANCELLED via client cancel (forfeit
          deposit, no reliability change) OR via artist cancel (preserve deposit,
          debit reliability) — divergent side-effect sets per branch.
        test_recipe:
          setup:
            - "One Artist; one VERIFIED Client; two Chairs."
            - "Two CONFIRMED appointments A (client-cancel target) and B (artist-cancel target), each deposit_paid 10800."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: StudioManager
            - call: "POST /studio/artists"
              payload: { display_name: "Branch Artist", discipline: "TATTOO", hourly_rate_cents: 18000, commission_pct: 0.70 }
              as: StudioManager
              captures: { artist_id: $.data.id }
            - call: "POST /studio/chairs"
              payload: { label: "Br A", cleanup_buffer_minutes: 30 }
              as: StudioManager
              captures: { chairA_id: $.data.id, chairA_v: $.data.version }
            - call: "POST /studio/chairs"
              payload: { label: "Br B", cleanup_buffer_minutes: 30 }
              as: StudioManager
              captures: { chairB_id: $.data.id, chairB_v: $.data.version }
            - call: "POST /studio/clients"
              payload: { full_name: "Br Client", email: "br@x.com", date_of_birth: "1992-07-07" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/clients/${client_id}/id-verification"
              payload: { id_document_type: "PASSPORT" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/clients/${client_id}/id-verification/approve"
              payload: {}
              as: StudioManager
            - call: "POST /studio/appointments"
              payload: { artist_id: "${artist_id}", client_id: "${client_id}", chair_id: "${chairA_id}", expected_chair_version: "${chairA_v}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 180, start_at: "2026-06-20T10:00:00Z", end_at: "2026-06-20T13:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { apA_id: $.data.id, apA_v: $.data.version }
            - call: "POST /studio/appointments/${apA_id}/deposits"
              payload: { amount_cents: 10800, expected_appointment_version: "${apA_v}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/appointments/${apA_id}/waiver"
              payload: { client_id: "${client_id}", medical_flags: [], aftercare_acknowledged: true }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/appointments/${apA_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/appointments"
              payload: { artist_id: "${artist_id}", client_id: "${client_id}", chair_id: "${chairB_id}", expected_chair_version: "${chairB_v}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 180, start_at: "2026-06-21T10:00:00Z", end_at: "2026-06-21T13:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { apB_id: $.data.id, apB_v: $.data.version }
            - call: "POST /studio/appointments/${apB_id}/deposits"
              payload: { amount_cents: 10800, expected_appointment_version: "${apB_v}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/appointments/${apB_id}/waiver"
              payload: { client_id: "${client_id}", medical_flags: [], aftercare_acknowledged: true }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/appointments/${apB_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /studio/appointments/${apA_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/appointments/${apB_id}/cancel-by-artist"
              payload: {}
              as: Artist
              as_user_id: "${artist_id}"
          assert:
            - "Appointment.${apA_id}.status == CANCELLED"
            - "Appointment.${apA_id}.deposit_paid_cents == 0"
