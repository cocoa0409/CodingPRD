        distinguishing_aspect: "Each of the four uniqueness scopes — global ServiceArea.code, global PesticideProduct.epa_reg_no, TrapSite.site_code within its area, and one WeatherObservation per (area, obs_date) — returns ERR_DUPLICATE_RESOURCE with HTTP 409."
