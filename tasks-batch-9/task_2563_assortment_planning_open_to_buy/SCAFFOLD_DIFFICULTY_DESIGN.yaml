      - name: plan_month_state_beats_vendor_capacity
        grounds:
          - validations[priority=10].ERR_PLAN_MONTH_NOT_OPEN
          - validations[priority=31].ERR_VENDOR_CAPACITY_EXCEEDED
          - calculations.vendor_window_load
          - errors.ERR_PLAN_MONTH_NOT_OPEN
