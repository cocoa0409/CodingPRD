              as: Surgeon
              as_user_id: "${surgeon_id}"
              captures: { request_id: $.data.id, tier: $.data.priority_tier, score: $.data.priority_score }
            - call: "POST /eye-bank/allocations"
              payload: { tissue_id: "${tissue_id}", request_id: "${request_id}" }
              as: EyeBankCoordinator
              captures: { alloc_id: $.data.id, fee: $.data.processing_fee_cents }
            - call: "GET /eye-bank/surgeons/${surgeon_id}"
              payload: {}
              as: EyeBankCoordinator
              captures: { gross_t0: $.data.gross_billed_cents, credited_t0: $.data.credited_fee_cents, outstanding_t0: $.data.outstanding_fee_cents }
          trigger:
            - call: "POST /eye-bank/allocations/${alloc_id}/confirm"
              payload: {}
              as: EyeBankCoordinator
            - call: "GET /eye-bank/surgeons/${surgeon_id}"
              payload: {}
              as: EyeBankCoordinator
              captures: { gross_t1: $.data.gross_billed_cents, credited_t1: $.data.credited_fee_cents, outstanding_t1: $.data.outstanding_fee_cents }
            - call: "POST /eye-bank/shipments"
              payload: { allocation_id: "${alloc_id}", carrier: "COLDCHAIN_EXPRESS" }
              as: EyeBankCoordinator
              captures: { ship_id: $.data.id }
            - call: "POST /eye-bank/shipments/${ship_id}/temperature-readings"
              payload: { recorded_at: "2026-08-03T10:00:00.000Z", temperature_c: 4.0 }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/shipments/${ship_id}/dispatch"
              payload: { shipped_at: "2026-08-03T10:00:00.000Z" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/shipments/${ship_id}/temperature-readings"
              payload: { recorded_at: "2026-08-03T11:00:00.000Z", temperature_c: 5.0 }
              as: Surgeon
              as_user_id: "${surgeon_id}"
            - call: "POST /eye-bank/shipments/${ship_id}/deliver"
              payload: { delivered_at: "2026-08-03T12:00:00.000Z" }
              as: Surgeon
              as_user_id: "${surgeon_id}"
              captures: { verdict: $.data.integrity_verdict }
            - call: "POST /eye-bank/tissues/${tissue_id}/return"
              payload: { return_reason: "RECIPIENT_UNFIT_FOR_SURGERY" }
              as: Surgeon
              as_user_id: "${surgeon_id}"
              captures: { disp_final: $.data.disposition_status, reissue_gen: $.data.reissue_generation }
            - call: "GET /eye-bank/surgeons/${surgeon_id}"
              payload: {}
              as: EyeBankCoordinator
              captures: { gross_t2: $.data.gross_billed_cents, credited_t2: $.data.credited_fee_cents, outstanding_t2: $.data.outstanding_fee_cents }
          assert:
            - "${tier} == \"PLATINUM\" and ${score} == 85 and ${fee} == 277464"
            - "t0 (RESERVED only) — ${gross_t0} == 0, ${credited_t0} == 0, ${outstanding_t0} == 0 and 0 + 0 == 0"
            - "t1 (CONFIRMED) — ${gross_t1} == 277464, ${credited_t1} == 0, ${outstanding_t1} == 277464 and 277464 + 0 == 277464"
            - "${verdict} == \"PASS\" and ${disp_final} == \"ELIGIBLE\" and ${reissue_gen} == 1"
            - "t2 (RELEASED) — ${gross_t2} == 277464, ${credited_t2} == 277464, ${outstanding_t2} == 0 and 0 + 277464 == 277464"
            - "${outstanding_t2} == ${outstanding_t0} — the compensation returns outstanding to its exact pre-confirm value"
            - "${gross_t2} == ${gross_t1} — gross_billed_cents NEVER decreases; the credit is recorded, not erased"
            - "Allocation.${alloc_id}.status == \"RELEASED\", Shipment.${ship_id}.status == \"RETURNED\" and SurgeonRequest.${request_id}.status == \"OPEN\""
