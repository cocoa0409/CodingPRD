# =============================================================================
# task_0659_artificial_turf_putting_green — §1.9 Scaffold Corner Design
# Breadth coverage of testable claims from §1.1-§1.7 not already covered by §1.8.
# Sections / claim_types drawn from references/claim-extraction-guide.md.
# excluded_because stubs cite §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_project_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Project.fields.workflow_status
          - entities.Project.fields.finance_status
          - endpoints[POST /projects]
        distinguishing_aspect: "POST /projects with customer_id+site_address returns 201; workflow_status=DRAFT, finance_status=UNBILLED, version=1, all computed totals 0."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cust One", email: "c1@x.com" }
              as: OpsAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "1 Test St" }
              as: SalesRep
              captures: { proj_id: $.data.id }
          assert:
            - "Project.${proj_id}.workflow_status == DRAFT"
            - "Project.${proj_id}.finance_status == UNBILLED"
            - "Project.${proj_id}.version == 1"
            - "Project.${proj_id}.billable_area_sqft == 0"
            - "Project.${proj_id}.open_callback_count == 0"

      - name: get_project_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /projects/{id}]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /projects/{random uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /projects/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "returns ERR_NOT_FOUND (404)"

      - name: create_project_missing_customer_id_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints[POST /projects]
          - validations[priority=6]
        distinguishing_aspect: "POST /projects omitting required customer_id returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { site_address: "no customer" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "returns ERR_INVALID_REQUEST (422)"

      - name: site_measure_defaults_applied_when_omitted
        claim_type: Defaults
        grounds:
          - entities.SiteMeasure.fields.obstruction_area_sqft
          - entities.SiteMeasure.fields.soil_drains_freely
          - endpoints[POST /site-measures]
        distinguishing_aspect: "Omitting obstruction_area_sqft defaults 0; omitting soil_drains_freely defaults true; net_area uses gross with no obstruction subtracted."
        test_recipe:
          setup: ["A DRAFT project exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cust Def", email: "cdef@x.com" }
              as: OpsAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "2 Test St" }
              as: SalesRep
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /site-measures"
              payload: { project_id: "${proj_id}", gross_area_sqft: 600, longest_run_ft: 20, slope_pct: 1.0 }
              as: SalesRep
              captures: { m_id: $.data.id }
          assert:
            - "SiteMeasure.${m_id}.obstruction_area_sqft == 0"
            - "SiteMeasure.${m_id}.soil_drains_freely == true"
            - "SiteMeasure.${m_id}.status == RECORDED"

      - name: turf_product_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.TurfProduct.fields.id
          - endpoints[POST /turf-products]
        distinguishing_aspect: "id and created_at are server-minted; TurfProduct has common_fields:false so there is no version field on it."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /turf-products"
              payload: { sku: "T-SYS", name: "Sys Turf", pile_height_mm: 35, price_per_sqft_cents: 500, roll_width_ft: 15 }
              as: OpsAdmin
              captures: { turf_id: $.data.id, sku: $.data.sku }
          assert:
            - "TurfProduct.${turf_id}.id is a server-minted UUID"
            - "TurfProduct.${turf_id}.active == true (default)"
            - "TurfProduct.${turf_id}.sku == T-SYS"

      - name: net_area_computed_input_value_ignored
        claim_type: Computed Fields
        grounds:
          - entities.DesignLayout.fields.net_area_sqft
          - calculations.waste_factor
        distinguishing_aspect: "net_area_sqft is computed (gross 600, run 20 -> waste 8% -> 648), never accepted from client input; client cannot set it."
        test_recipe:
          setup: ["MEASURED project (gross 600, run 20); turf roll_width 15."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cust Comp", email: "ccomp@x.com" }
              as: OpsAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /turf-products"
              payload: { sku: "T-COMP", name: "Comp Turf", pile_height_mm: 35, price_per_sqft_cents: 500, roll_width_ft: 15 }
              as: OpsAdmin
              captures: { turf_id: $.data.id }
            - call: "POST /infill-products"
              payload: { sku: "I-COMP", name: "Comp Infill", material: "SILICA", price_per_sqft_cents: 100, coverage_lbs_per_sqft: 2 }
              as: OpsAdmin
              captures: { infill_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "3 Test St" }
              as: SalesRep
              captures: { proj_id: $.data.id }
            - call: "POST /site-measures"
              payload: { project_id: "${proj_id}", gross_area_sqft: 600, longest_run_ft: 20, slope_pct: 1.0 }
              as: SalesRep
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /design-layouts"
              payload: { project_id: "${proj_id}", site_measure_id: "${m_id}", turf_product_id: "${turf_id}", infill_product_id: "${infill_id}", variant: "STANDARD" }
              as: SalesRep
              captures: { d_id: $.data.id, net: $.data.net_area_sqft, waste: $.data.waste_factor_pct }
          assert:
            - "DesignLayout.${d_id}.waste_factor_pct == 8.0"
            - "DesignLayout.${d_id}.net_area_sqft == 648.0"
            - "DesignLayout.${d_id}.status == DRAFT"

      - name: customer_duplicate_email_returns_duplicate_resource
        claim_type: Type Constraints
        grounds:
          - validations[priority=7]
          - errors[ERR_DUPLICATE_RESOURCE]
          - entities.Customer.fields.email
        distinguishing_aspect: "Second Customer create with a case-insensitively equal email returns ERR_DUPLICATE_RESOURCE (409)."
        test_recipe:
          setup: ["A customer with email dup@x.com exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "First", email: "dup@x.com" }
              as: OpsAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Second", email: "DUP@x.com" }
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "returns ERR_DUPLICATE_RESOURCE (409)"

      - name: design_invalid_variant_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.DesignLayout.fields.variant
          - validations[priority=6]
        distinguishing_aspect: "POST design-layouts with variant=GOLF (not in STANDARD|PET|PLAYGROUND|PUTTING_GREEN) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["MEASURED project, catalog turf+infill exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cust Enum", email: "cenum@x.com" }
              as: OpsAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /turf-products"
              payload: { sku: "T-ENUM", name: "Enum Turf", pile_height_mm: 35, price_per_sqft_cents: 500, roll_width_ft: 15 }
              as: OpsAdmin
              captures: { turf_id: $.data.id }
            - call: "POST /infill-products"
              payload: { sku: "I-ENUM", name: "Enum Infill", material: "SILICA", price_per_sqft_cents: 100, coverage_lbs_per_sqft: 2 }
              as: OpsAdmin
              captures: { infill_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "4 Test St" }
              as: SalesRep
              captures: { proj_id: $.data.id }
            - call: "POST /site-measures"
              payload: { project_id: "${proj_id}", gross_area_sqft: 600, longest_run_ft: 20, slope_pct: 1.0 }
              as: SalesRep
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /design-layouts"
              payload: { project_id: "${proj_id}", site_measure_id: "${m_id}", turf_product_id: "${turf_id}", infill_product_id: "${infill_id}", variant: "GOLF" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "returns ERR_INVALID_REQUEST (422)"

      - name: list_projects_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints[GET /projects]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /projects returns array response_type with total_count and has_more; limit/offset honored."
        test_recipe:
          setup: ["At least 2 projects for one customer exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cust List", email: "clist@x.com" }
              as: OpsAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "5a Test St" }
              as: SalesRep
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "5b Test St" }
              as: SalesRep
          trigger:
            - call: "GET /projects"
              payload: { customer_id: "${cust_id}", limit: 1, offset: 0 }
              as: OpsAdmin
          assert:
            - "response_type == array; data length == 1"
            - "total_count == 2; has_more == true"

      - name: pagination_limit_over_max_returns_validation_error
        claim_type: Type Constraints
        grounds:
          - endpoints[GET /projects]
          - errors[ERR_VALIDATION_PAGINATION]
        distinguishing_aspect: "GET /projects with limit=101 (> max 100) returns ERR_VALIDATION_PAGINATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /projects"
              payload: { limit: 101 }
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "returns ERR_VALIDATION_PAGINATION (422)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: design_reject_branch_sets_rejected_no_project_change
        claim_type: Valid Transition
        grounds:
          - state_machines.DesignLayout.DRAFT_to_REJECTED
          - endpoints[POST /design-layouts/{id}/reject]
        distinguishing_aspect: "Rejecting a DRAFT design sets status REJECTED and leaves Project.workflow_status at MEASURED (no DESIGNED advance) — the divergent branch of the accept/reject fork."
        test_recipe:
          setup: ["MEASURED project with a DRAFT design."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cust Rej", email: "crej@x.com" }
              as: OpsAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /turf-products"
              payload: { sku: "T-REJ", name: "Rej Turf", pile_height_mm: 35, price_per_sqft_cents: 500, roll_width_ft: 15 }
              as: OpsAdmin
              captures: { turf_id: $.data.id }
            - call: "POST /infill-products"
              payload: { sku: "I-REJ", name: "Rej Infill", material: "SILICA", price_per_sqft_cents: 100, coverage_lbs_per_sqft: 2 }
              as: OpsAdmin
              captures: { infill_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "6 Test St" }
              as: SalesRep
              captures: { proj_id: $.data.id }
            - call: "POST /site-measures"
              payload: { project_id: "${proj_id}", gross_area_sqft: 600, longest_run_ft: 20, slope_pct: 1.0 }
              as: SalesRep
              captures: { m_id: $.data.id }
            - call: "POST /design-layouts"
              payload: { project_id: "${proj_id}", site_measure_id: "${m_id}", turf_product_id: "${turf_id}", infill_product_id: "${infill_id}", variant: "STANDARD" }
              as: SalesRep
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /design-layouts/${d_id}/reject"
              payload: {}
              as: SalesRep
              captures: { st: $.data.status }
          assert:
            - "DesignLayout.${d_id}.status == REJECTED"
            - "Project.${proj_id}.workflow_status == MEASURED"
            - "Project.${proj_id}.variant == null"

      - name: callback_open_to_resolved_recomputes_open_count
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Callback.IN_PROGRESS_to_RESOLVED
          - entities.Project.fields.open_callback_count
        distinguishing_aspect: "Resolving the only open callback (non-billable) drops Project.open_callback_count from 1 to 0 (bubble-up recompute)."
        test_recipe:
          setup: ["INSTALLED PAID_IN_FULL STANDARD project with PREMIUM ACTIVE warranty; one OPEN warranty-covered SEAM_LIFT callback (non-billable) started (IN_PROGRESS)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cust CB", email: "ccb@x.com" }
              as: OpsAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /turf-products"
              payload: { sku: "T-CB", name: "CB Turf", pile_height_mm: 35, price_per_sqft_cents: 500, roll_width_ft: 15 }
              as: OpsAdmin
              captures: { turf_id: $.data.id }
            - call: "POST /infill-products"
              payload: { sku: "I-CB", name: "CB Infill", material: "SILICA", price_per_sqft_cents: 100, coverage_lbs_per_sqft: 2 }
              as: OpsAdmin
              captures: { infill_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew CB", daily_capacity_sqft: 2000 }
              as: OpsAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "7 Test St" }
              as: SalesRep
              captures: { proj_id: $.data.id }
            - call: "POST /site-measures"
              payload: { project_id: "${proj_id}", gross_area_sqft: 600, longest_run_ft: 20, slope_pct: 1.0 }
              as: SalesRep
              captures: { m_id: $.data.id }
            - call: "POST /design-layouts"
              payload: { project_id: "${proj_id}", site_measure_id: "${m_id}", turf_product_id: "${turf_id}", infill_product_id: "${infill_id}", variant: "STANDARD" }
              as: SalesRep
              captures: { d_id: $.data.id }
            - call: "POST /design-layouts/${d_id}/accept"
              payload: {}
              as: SalesRep
            - call: "POST /base-prep-scopes"
              payload: { project_id: "${proj_id}", design_layout_id: "${d_id}", base_depth_in: 3 }
              as: SalesRep
              captures: { s_id: $.data.id }
            - call: "POST /base-prep-scopes/${s_id}/finalize"
              payload: {}
              as: SalesRep
            - call: "POST /warranty-plans"
              payload: { project_id: "${proj_id}", tier: "PREMIUM" }
              as: SalesRep
              captures: { w_id: $.data.id }
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", design_layout_id: "${d_id}", base_prep_scope_id: "${s_id}", deposit_pct: 0.30 }
              as: SalesRep
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/send"
              payload: {}
              as: SalesRep
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: OpsAdmin
              captures: { v_pre: $.data.version }
            - call: "POST /quotes/${q_id}/accept"
              payload: { expected_project_version: "${v_pre}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /payments"
              payload: { project_id: "${proj_id}", kind: "DEPOSIT", amount_cents: 129470 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { dep_id: $.data.id }
            - call: "POST /_payments/settle"
              payload: { payment_id: "${dep_id}" }
              as: OpsAdmin
            - call: "POST /install-jobs"
              payload: { project_id: "${proj_id}", crew_id: "${crew_id}", scheduled_start: "2026-04-28T09:00:00Z", scheduled_end: "2026-04-28T17:00:00Z" }
              as: Scheduler
              captures: { j_id: $.data.id }
            - call: "POST /install-jobs/${j_id}/start"
              payload: {}
              as: Scheduler
            - call: "POST /install-jobs/${j_id}/complete"
              payload: {}
              as: Scheduler
            - call: "POST /payments"
              payload: { project_id: "${proj_id}", kind: "BALANCE", amount_cents: 302098 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bal_id: $.data.id }
            - call: "POST /_payments/settle"
              payload: { payment_id: "${bal_id}" }
              as: OpsAdmin
            - call: "POST /callbacks"
              payload: { project_id: "${proj_id}", reason: "SEAM_LIFT", warranty_plan_id: "${w_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { cb_id: $.data.id, billable: $.data.billable }
            - call: "POST /callbacks/${cb_id}/start"
              payload: {}
              as: Scheduler
          trigger:
            - call: "POST /callbacks/${cb_id}/resolve"
              payload: {}
              as: Scheduler
          assert:
            - "Callback.${cb_id}.billable == false (SEAM_LIFT covered by ACTIVE warranty)"
            - "Callback.${cb_id}.charge_cents == 0"
            - "Callback.${cb_id}.status == RESOLVED"
            - "Project.${proj_id}.open_callback_count == 0"

      - name: send_already_sent_quote_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Quote.DRAFT_to_SENT
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / conflict_scope_not_finalized_vs_invalid_state_on_send
          rationale: "Re-sending an already-SENT quote -> ERR_INVALID_STATE is asserted as the winning error of that §1.8 priority-conflict instance."

      - name: terminal_quote_void_cannot_transition
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Quote.transitions.VOID
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A VOIDed quote (sibling of an accepted quote) cannot be sent or accepted; send/accept returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Project with two SENT quotes q1,q2; q1 accepted (which VOIDs q2)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cust Void", email: "cvoid@x.com" }
              as: OpsAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /turf-products"
              payload: { sku: "T-VOID", name: "Void Turf", pile_height_mm: 35, price_per_sqft_cents: 500, roll_width_ft: 15 }
              as: OpsAdmin
              captures: { turf_id: $.data.id }
            - call: "POST /infill-products"
              payload: { sku: "I-VOID", name: "Void Infill", material: "SILICA", price_per_sqft_cents: 100, coverage_lbs_per_sqft: 2 }
              as: OpsAdmin
              captures: { infill_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "8 Test St" }
              as: SalesRep
              captures: { proj_id: $.data.id }
            - call: "POST /site-measures"
              payload: { project_id: "${proj_id}", gross_area_sqft: 600, longest_run_ft: 20, slope_pct: 1.0 }
              as: SalesRep
              captures: { m_id: $.data.id }
            - call: "POST /design-layouts"
              payload: { project_id: "${proj_id}", site_measure_id: "${m_id}", turf_product_id: "${turf_id}", infill_product_id: "${infill_id}", variant: "STANDARD" }
              as: SalesRep
              captures: { d_id: $.data.id }
            - call: "POST /design-layouts/${d_id}/accept"
              payload: {}
              as: SalesRep
            - call: "POST /base-prep-scopes"
              payload: { project_id: "${proj_id}", design_layout_id: "${d_id}", base_depth_in: 3 }
              as: SalesRep
              captures: { s_id: $.data.id }
            - call: "POST /base-prep-scopes/${s_id}/finalize"
              payload: {}
              as: SalesRep
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", design_layout_id: "${d_id}", base_prep_scope_id: "${s_id}", deposit_pct: 0.30 }
              as: SalesRep
              captures: { q1: $.data.id }
            - call: "POST /quotes/${q1}/send"
              payload: {}
              as: SalesRep
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", design_layout_id: "${d_id}", base_prep_scope_id: "${s_id}", deposit_pct: 0.40 }
              as: SalesRep
              captures: { q2: $.data.id }
            - call: "POST /quotes/${q2}/send"
              payload: {}
              as: SalesRep
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: OpsAdmin
              captures: { v_pre: $.data.version }
            - call: "POST /quotes/${q1}/accept"
              payload: { expected_project_version: "${v_pre}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: OpsAdmin
              captures: { v_now: $.data.version }
            - call: "POST /quotes/${q2}/accept"
              payload: { expected_project_version: "${v_now}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Quote.${q2}.status == VOID after q1 accept"
            - "accepting VOID Quote.${q2} returns ERR_INVALID_STATE (409)"
            - "Project.${proj_id}.finance_status == DEPOSIT_DUE"

      - name: start_install_before_scheduled_start_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.InstallJob.SCHEDULED_to_IN_PROGRESS
          - endpoints[POST /_clock/set_current_utc]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Starting an install while clock (default 2026-04-01T00:00:00Z) is before scheduled_start 2026-05-01T09:00Z returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["STANDARD project DEPOSIT_PAID with one SCHEDULED install whose scheduled_start is 2026-05-01T09:00Z; clock left at startup default 2026-04-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cust Clk", email: "cclk@x.com" }
              as: OpsAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /turf-products"
