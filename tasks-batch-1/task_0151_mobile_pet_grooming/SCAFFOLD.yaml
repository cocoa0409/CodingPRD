scenario: "Mobile Pet Grooming: breed/coat-based service & duration, vaccination-proof requirement, van route/time window, add-on (de-shed/nail/teeth), groomer assignment, no-show/late fee, recurring grooming plan, behavioral/muzzle flag"
domain_name: "mobile-pet-grooming"
api_prefix: ""

complexity_profile:
  primary_archetype: "Temporal windowing"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Rate / threshold triggers"
    - "Selector policy"
    - "Derived field reconciliation"

  entity_topology: hybrid
  # RouteStop nests under RouteDay (hierarchical), while Appointment, Pet,
  # Customer, Groomer link by FK (flat) and AppointmentAddOn is a junction
  # (many-to-many Appointment<->AddOn).

  state_machine_shape: cyclic
  # Appointment carries a branching+revert+cyclic lifecycle (REQUESTED ->
  # QUOTE rounds can loop, fork into COMPLETED vs NO_SHOW/CANCELLED), RouteDay
  # is posture-style compound over its stops, RecurringPlan is cyclic
  # (ACTIVE -> PAUSED -> ACTIVE), and Pet carries a parallel vaccination x
  # behavioral dimension pair.

  relationship_patterns:
    - one_to_many        # Customer -> Pet, RouteDay -> RouteStop, Pet -> VaccinationRecord
    - many_to_many       # Appointment <-> AddOn via AppointmentAddOn
    - cross_aggregate    # Appointment references Pet, Groomer, RouteStop across aggregates

  role_model: peer_roles
  # Customer owns Pets/own appointments; Groomer owns their assigned stops;
  # Dispatcher owns routes and groomer assignment; PlatformAdmin owns catalog
  # configuration and test-driving endpoints.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Breed
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Breed display name, unique"
        constraints: "unique across Breed"
      - name: coat_type
        type: enum
        source: input
        description: "Coat classification driving base service duration"
        constraints: "one of SMOOTH, DOUBLE, CURLY, WIRE, HAIRLESS"
      - name: size_class
        type: enum
        source: input
        description: "Body-size class adding a duration surcharge"
        constraints: "one of TOY, SMALL, MEDIUM, LARGE, GIANT"
      - name: base_service_minutes
        type: integer
        source: input
        description: "Coat+size baseline grooming minutes used as the duration seed"
        constraints: ">= 15 and <= 240"

  - name: ServiceTier
    parent: null
    common_fields: true
    fields:
      - name: code
        type: enum
        source: input
        description: "Service tier code"
        constraints: "one of BATH_ONLY, FULL_GROOM, SHOW_CUT; unique across ServiceTier"
      - name: base_price_cents
        type: integer
        source: input
        description: "Tier base price in cents before coat/size and add-on adjustments"
        constraints: ">= 0"
      - name: duration_multiplier
        type: number
        source: input
        description: "Multiplier applied to Breed.base_service_minutes for this tier"
        constraints: ">= 1.0 and <= 3.0, two decimal places"

  - name: AddOn
    parent: null
    common_fields: true
    fields:
      - name: code
        type: enum
        source: input
        description: "Add-on code"
        constraints: "one of DESHED, NAIL_TRIM, TEETH_CLEAN; unique across AddOn"
      - name: price_cents
        type: integer
        source: input
        description: "Flat add-on price in cents"
        constraints: ">= 0"
      - name: duration_minutes
        type: integer
        source: input
        description: "Minutes this add-on adds to appointment duration"
        constraints: ">= 0 and <= 60"
      - name: requires_calm
        type: boolean
        source: input
        description: "If true, this add-on may not be applied when the pet's behavioral_flag is AGGRESSIVE"
        default: false

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Owner contact email, unique"
        constraints: "unique across Customer"
      - name: full_name
        type: string
        source: input
        description: "Owner full name"
      - name: service_zip
        type: string
        source: input
        description: "5-digit service ZIP the van must cover"
        constraints: "exactly 5 digits"
      - name: no_show_strikes
        type: integer
        source: computed
        description: "Rolling count of NO_SHOW + LATE_CANCEL strikes in the trailing STRIKE_WINDOW_DAYS window; recomputed on each strike event and read at booking time"
        default: 0
      - name: account_status
        type: enum
        source: computed
        description: "ACTIVE normally; SUSPENDED once no_show_strikes reaches STRIKE_SUSPEND_THRESHOLD"
        default: "ACTIVE"
        constraints: "one of ACTIVE, SUSPENDED"
      - name: outstanding_fee_cents
        type: integer
        source: computed
        description: "Sum of unpaid FeeCharge.amount_cents for this customer; debited on fee assessment, credited on settlement"
        default: 0

  - name: Pet
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the owner"
      - name: breed_id
        type: string
        source: input
        description: "FK -> Breed.id; drives coat/size duration"
      - name: name
        type: string
        source: input
        description: "Pet name"
      - name: weight_lbs
        type: number
        source: input
        description: "Body weight in pounds; feeds the size duration surcharge"
        constraints: "> 0"
      - name: coat_condition
        type: enum
        source: input
        description: "Current coat condition; MATTED adds de-matting minutes"
        default: "NORMAL"
        constraints: "one of NORMAL, MATTED"
      - name: behavioral_flag
        type: enum
        source: input
        description: "Temperament classification; AGGRESSIVE forces muzzle and a specialist groomer"
        default: "CALM"
        constraints: "one of CALM, NERVOUS, AGGRESSIVE"
      - name: muzzle_required
        type: boolean
        source: computed
        description: "Derived true whenever behavioral_flag == AGGRESSIVE; reconciled whenever behavioral_flag changes"
        default: false
      - name: vaccination_status
        type: enum
        source: computed
        description: "VALID when a non-expired RABIES VaccinationRecord exists relative to current clock; otherwise EXPIRED; recomputed on vaccination upload and read at booking time"
        default: "EXPIRED"
        constraints: "one of VALID, EXPIRED"

  - name: VaccinationRecord
    parent: null
    common_fields: false
    fields:
      - name: pet_id
        type: string
        source: input
        description: "FK -> Pet.id; the vaccinated pet"
      - name: vaccine_type
        type: enum
        source: input
        description: "Vaccine kind; only RABIES gates booking"
        constraints: "one of RABIES, BORDETELLA, DISTEMPER"
      - name: issued_on
        type: datetime
        source: input
        description: "Date the vaccine was administered (ISO 8601 UTC)"
      - name: expires_on
        type: datetime
        source: input
        description: "Vaccination expiry (ISO 8601 UTC); compared to current clock for validity"
        constraints: "must be strictly after issued_on"

  - name: Groomer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Groomer login email, unique"
        constraints: "unique across Groomer"
      - name: full_name
        type: string
        source: input
        description: "Groomer full name"
      - name: skill_level
        type: enum
        source: input
        description: "JUNIOR or SENIOR; SENIOR required for SHOW_CUT and aggressive pets"
        constraints: "one of JUNIOR, SENIOR"
      - name: handles_aggressive
        type: boolean
        source: input
        description: "True if certified to groom AGGRESSIVE/muzzle-required pets"
        default: false
      - name: status
        type: enum
        source: input
        description: "Availability; only AVAILABLE groomers enter the assignment candidate pool"
        default: "AVAILABLE"
        constraints: "one of AVAILABLE, OFF_DUTY"

  - name: Van
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: "Van identifier label, unique"
        constraints: "unique across Van"
      - name: max_stops
        type: integer
        source: input
        description: "Maximum RouteStop count allowed on a RouteDay for this van"
        constraints: ">= 1 and <= 20"
      - name: has_show_equipment
        type: boolean
        source: input
        description: "True if van carries SHOW_CUT equipment"
        default: false

  - name: RouteDay
    parent: null
    common_fields: true
    fields:
      - name: van_id
        type: string
        source: input
        description: "FK -> Van.id; the van running this route"
      - name: service_date
        type: datetime
        source: input
        description: "Calendar date of the route (ISO 8601 UTC, midnight)"
      - name: window_start
        type: datetime
        source: input
        description: "Earliest clock time stops may begin (ISO 8601 UTC)"
      - name: window_end
        type: datetime
        source: input
        description: "Latest clock time stops must end by (ISO 8601 UTC)"
        constraints: "must be strictly after window_start"
      - name: coverage_zip
        type: string
        source: input
        description: "5-digit ZIP this route serves; a pet's owner service_zip must match"
        constraints: "exactly 5 digits"
      - name: status
        type: enum
        source: computed
        description: "OPEN while accepting stops; LOCKED once dispatched (no new stops); CLOSED once all stops terminal"
        default: "OPEN"
        constraints: "one of OPEN, LOCKED, CLOSED"
      - name: booked_minutes
        type: integer
        source: computed
        description: "Denormalized route load: sum of (scheduled_minutes + TRAVEL_BUFFER_MIN) over non-VOIDED RouteStops on this day (status IN {RESERVED, SERVICED, NO_SHOW}); reconciled on every stop add/cancel; see route_load_capacity"
        default: 0

  - name: RouteStop
    parent: RouteDay
    common_fields: true
    fields:
      - name: route_day_id
        type: string
        source: input
        description: "FK -> RouteDay.id; the day this stop belongs to"
      - name: slot_start
        type: datetime
        source: input
        description: "Stop start time (ISO 8601 UTC); must fall within the RouteDay window"
      - name: scheduled_minutes
        type: integer
        source: computed
        description: "Service minutes reserved for this stop, copied from the linked Appointment.estimated_minutes at booking"
        default: 0
      - name: slot_end
        type: datetime
        source: computed
        description: "slot_start + scheduled_minutes; the occupied interval end (exclusive)"
      - name: status
        type: enum
        source: computed
        description: "RESERVED on creation; SERVICED, NO_SHOW, or VOIDED as the linked appointment resolves"
        default: "RESERVED"
        constraints: "one of RESERVED, SERVICED, NO_SHOW, VOIDED"

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: pet_id
        type: string
        source: input
        description: "FK -> Pet.id; the pet to groom"
      - name: service_tier_id
        type: string
        source: input
        description: "FK -> ServiceTier.id; the requested tier"
      - name: route_stop_id
        type: string
        source: computed
        description: "FK -> RouteStop.id; set when the appointment is scheduled onto a route"
      - name: groomer_id
        type: string
        source: computed
        description: "FK -> Groomer.id; set by auto-assignment at scheduling"
      - name: recurring_plan_id
        type: string
        source: input
        description: "FK -> RecurringPlan.id; present when this appointment was generated from a plan"
      - name: estimated_minutes
        type: integer
        source: computed
        description: "Output of the duration calculation; pinned at QUOTED and copied to the RouteStop"
        default: 0
      - name: quoted_price_cents
        type: integer
        source: computed
        description: "Forward-looking estimated price pinned when the quote is issued (QUOTED)"
        default: 0
      - name: final_price_cents
        type: integer
        source: computed
        description: "Chronological actual price computed from delivered tier + add-ons at completion"
        default: 0
      - name: quote_round
        type: integer
        source: computed
        description: "Number of times a quote has been (re)issued; increments on each REQUESTED->QUOTED loop"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state"
        default: "REQUESTED"
        constraints: "one of REQUESTED, QUOTED, SCHEDULED, COMPLETED, NO_SHOW, CANCELLED"

  - name: AppointmentAddOn
    parent: Appointment
    common_fields: false
    fields:
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; the appointment the add-on attaches to"
      - name: add_on_id
        type: string
        source: input
        description: "FK -> AddOn.id; the selected add-on"
      - name: price_cents_snapshot
        type: integer
        source: computed
        description: "AddOn.price_cents copied at attach time so later catalog edits do not change this appointment's quote"
        default: 0

  - name: RecurringPlan
    parent: null
    common_fields: true
    fields:
      - name: pet_id
        type: string
        source: input
        description: "FK -> Pet.id; the pet on the plan"
      - name: service_tier_id
        type: string
        source: input
        description: "FK -> ServiceTier.id; tier auto-applied to generated appointments"
      - name: cadence_days
        type: integer
        source: input
        description: "Days between generated appointments"
        constraints: "one of 28, 42, 56"
      - name: discount_pct
        type: number
        source: input
        description: "Loyalty discount applied to plan-generated appointment quotes"
        constraints: ">= 0 and <= 0.20, two decimal places"
      - name: status
        type: enum
        source: computed
        description: "ACTIVE generates appointments; PAUSED suspends generation; CANCELLED is terminal"
        default: "ACTIVE"
        constraints: "one of ACTIVE, PAUSED, CANCELLED"

  - name: FeeCharge
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the charged owner"
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; the appointment that triggered the fee"
      - name: fee_type
        type: enum
        source: input
        description: "NO_SHOW or LATE_CANCEL"
        constraints: "one of NO_SHOW, LATE_CANCEL"
      - name: amount_cents
        type: integer
        source: computed
        description: "Computed fee amount in cents"
        default: 0
      - name: settlement_status
        type: enum
        source: computed
        description: "PENDING when assessed; SETTLED once paid; WAIVED if an admin waives it"
        default: "PENDING"
        constraints: "one of PENDING, SETTLED, WAIVED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Appointment
    initial_state: REQUESTED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: REQUESTED
        to: QUOTED
        trigger: "POST /appointments/{id}/quote"
        actor: Dispatcher
        preconditions:
          - "appointment.status == REQUESTED"
          - "Pet.vaccination_status == VALID at current clock"
        side_effects:
          - "compute estimated_minutes via duration_estimate calculation and store it"
          - "compute quoted_price_cents via quote_price (forward_looking) calculation and store it"
          - "increment quote_round by 1"
          - "increments Appointment.version by 1"
        note: "Re-quoting an already-QUOTED appointment uses the QUOTED->QUOTED loop below."
      - from: QUOTED
        to: QUOTED
        trigger: "POST /appointments/{id}/quote"
        actor: Dispatcher
        preconditions:
          - "appointment.status == QUOTED"
          - "appointment.route_stop_id is null (not yet scheduled)"
        side_effects:
          - "recompute estimated_minutes and quoted_price_cents from current Pet/add-on/tier inputs"
          - "increment quote_round by 1"
          - "increments Appointment.version by 1"
        note: "Cyclic re-quote loop; lets add-ons or coat_condition change before scheduling."
      - from: QUOTED
        to: SCHEDULED
        trigger: "POST /appointments/{id}/schedule"
        actor: Dispatcher
        preconditions:
          - "appointment.status == QUOTED"
          - "Customer.account_status == ACTIVE"
          - "Pet.vaccination_status == VALID at current clock"
          - "target RouteDay.status == OPEN"
          - "RouteDay.coverage_zip == owning Customer.service_zip"
          - "requested slot interval [slot_start, slot_start+estimated_minutes) fits within RouteDay window and the van buffer rule (resource_overlap_route_stop)"
          - "RouteDay.booked_minutes + estimated_minutes <= van capacity-by-window (route_load_capacity)"
          - "an eligible Groomer exists per groomer_assignment selector"
        side_effects:
          - "create RouteStop (RESERVED) with scheduled_minutes = estimated_minutes, slot_end = slot_start + estimated_minutes"
          - "set appointment.route_stop_id and groomer_id (groomer_assignment selector)"
          - "recompute RouteDay.booked_minutes (derived_route_load reconciliation)"
          - "increments Appointment.version by 1"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: Groomer
        preconditions:
          - "appointment.status == SCHEDULED"
          - "acting Groomer.id == appointment.groomer_id"
        side_effects:
          - "compute final_price_cents via final_price (chronological) calculation"
          - "set linked RouteStop.status = SERVICED"
          - "if linked RouteDay now has all stops terminal, RouteDay auto-transitions to CLOSED (bubble-up)"
          - "increments Appointment.version by 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/no-show"
        actor: Dispatcher
        preconditions:
          - "appointment.status == SCHEDULED"
          - "current clock >= linked RouteStop.slot_start"
        side_effects:
          - "set linked RouteStop.status = NO_SHOW"
          - "assess FeeCharge(NO_SHOW) via no_show_fee calculation; debit Customer.outstanding_fee_cents (cascade depth-3: appointment -> fee -> customer)"
          - "register a strike: recompute Customer.no_show_strikes; if it reaches STRIKE_SUSPEND_THRESHOLD set Customer.account_status = SUSPENDED"
          - "recompute RouteDay.booked_minutes (NO_SHOW stop still consumed the slot, remains counted)"
          - "increments Appointment.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: Customer
        preconditions:
          - "appointment.status == REQUESTED"
          - "acting Customer.id == owning Customer.id"
        side_effects:
          - "no fee (never scheduled)"
          - "increments Appointment.version by 1"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: Customer
        preconditions:
          - "appointment.status == QUOTED"
          - "acting Customer.id == owning Customer.id"
        side_effects:
          - "no fee (never scheduled)"
          - "increments Appointment.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: Customer
        preconditions:
          - "appointment.status == SCHEDULED"
          - "acting Customer.id == owning Customer.id"
        side_effects:
          - "set linked RouteStop.status = VOIDED"
          - "recompute RouteDay.booked_minutes (VOIDED frees the slot)"
          - "if current clock is within LATE_CANCEL_HOURS of slot_start: assess FeeCharge(LATE_CANCEL) via late_cancel_fee; debit Customer.outstanding_fee_cents; register a strike and recompute no_show_strikes/account_status (cascade depth-3: appointment -> fee -> customer)"
          - "increments Appointment.version by 1"

  - entity: RouteDay
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /route-days/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "routeday.status == OPEN"
          - "at least one RouteStop exists with status == RESERVED"
        side_effects:
          - "no new RouteStops may be created (schedule transition rejects with ERR_ROUTE_LOCKED)"
          - "increments RouteDay.version by 1"
      - from: LOCKED
        to: CLOSED
        trigger: "system: all RouteStops terminal (SERVICED/NO_SHOW/VOIDED)"
        actor: system
        preconditions:
          - "routeday.status == LOCKED"
          - "every RouteStop on the day is in a terminal status (SERVICED, NO_SHOW, VOIDED)"
        side_effects:
          - "routeday.status = CLOSED (bubble-up compound transition)"
          - "increments RouteDay.version by 1"
        note: "Auto-transition; fired as a side effect of the last stop becoming terminal."

  - entity: RecurringPlan
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /recurring-plans/{id}/pause"
        actor: Customer
        preconditions:
          - "plan.status == ACTIVE"
          - "acting Customer.id == owning Pet's Customer.id"
        side_effects:
          - "generation suspended"
          - "increments RecurringPlan.version by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /recurring-plans/{id}/resume"
        actor: Customer
        preconditions:
          - "plan.status == PAUSED"
          - "acting Customer.id == owning Pet's Customer.id"
        side_effects:
          - "generation resumes"
          - "increments RecurringPlan.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /recurring-plans/{id}/generate-appointment"
        actor: Dispatcher
        preconditions:
          - "plan.status == ACTIVE"
          - "Customer.account_status == ACTIVE"
        side_effects:
          - "create a new Appointment in REQUESTED with recurring_plan_id set and service_tier_id copied from the plan"
          - "increments RecurringPlan.version by 1"
        note: "Cyclic self-loop generating child appointments."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /recurring-plans/{id}/cancel"
        actor: Customer
        preconditions:
          - "plan.status == ACTIVE"
          - "acting Customer.id == owning Pet's Customer.id"
        side_effects:
          - "increments RecurringPlan.version by 1"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /recurring-plans/{id}/cancel"
        actor: Customer
        preconditions:
          - "plan.status == PAUSED"
          - "acting Customer.id == owning Pet's Customer.id"
        side_effects:
          - "increments RecurringPlan.version by 1"

  - entity: FeeCharge
    initial_state: PENDING
    terminal_states: [SETTLED, WAIVED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /fee-charges/{id}/settle"
        actor: Customer
        preconditions:
          - "fee.settlement_status == PENDING"
          - "acting Customer.id == fee.customer_id"
        side_effects:
          - "credit Customer.outstanding_fee_cents by amount_cents (compensating_invariant: outstanding_fee_cents == sum PENDING FeeCharge.amount_cents)"
          - "increments FeeCharge.version by 1"
      - from: PENDING
        to: WAIVED
        trigger: "POST /fee-charges/{id}/waive"
        actor: PlatformAdmin
        preconditions:
          - "fee.settlement_status == PENDING"
        side_effects:
          - "credit Customer.outstanding_fee_cents by amount_cents (compensating_invariant)"
          - "decrement Customer.no_show_strikes by 1 and recompute account_status (waiving removes the strike; compensating_invariant on strike count)"
          - "increments FeeCharge.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: schedule-stale-routeday
    parent_entity: RouteDay
    write_endpoint: "POST /appointments/{id}/schedule"
    occ_field: "expected_route_day_version"
    description: |
      Scheduling an appointment onto a RouteDay whose version has advanced since
      the client last observed it is rejected. A prior schedule legitimately
      created a RouteStop and recomputed booked_minutes (bumping the RouteDay
      version); a second schedule still carrying the pre-update version holds a
      stale view of remaining capacity and the route window and is rejected with
      a precondition-failed status before any overlap or capacity check runs.
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: duration_estimate
    trigger: "Appointment REQUESTED->QUOTED and QUOTED->QUOTED (quote issuance)"
    algorithm: threshold
    formula: |
      base = Breed.base_service_minutes
      tier_minutes = ceil(base * ServiceTier.duration_multiplier)
      size_surcharge = 0
      if Pet.weight_lbs > HEAVY_LBS_THRESHOLD: size_surcharge = HEAVY_SURCHARGE_MIN
      matting = MATTED_DEMAT_MIN if Pet.coat_condition == MATTED else 0
      addon_minutes = sum(AddOn.duration_minutes for each AppointmentAddOn on this appointment)
      estimated_minutes = tier_minutes + size_surcharge + matting + addon_minutes
    input_set: "The owning Breed, the chosen ServiceTier, the Pet, and all AppointmentAddOn rows attached to this appointment at quote time."
    constants:
      HEAVY_LBS_THRESHOLD: 60
      HEAVY_SURCHARGE_MIN: 20
      MATTED_DEMAT_MIN: 25
    precision: "integer minutes; ceil applied once to tier_minutes only, then integer additions"
    variants: []

  - name: quote_price
    trigger: "Appointment REQUESTED->QUOTED and QUOTED->QUOTED (forward-looking estimate)"
    algorithm: forward_looking
    formula: |
      tier = ServiceTier.base_price_cents
      coat_loading = 0
      if Pet.coat_condition == MATTED: coat_loading = round(tier * MATTED_PRICE_PCT)   # round per-component
      size_loading = 0
      if Pet.weight_lbs > HEAVY_LBS_THRESHOLD: size_loading = round(tier * HEAVY_PRICE_PCT)
      addon_total = sum(AppointmentAddOn.price_cents_snapshot for this appointment)
      gross = tier + coat_loading + size_loading + addon_total
      discount = 0
      if appointment.recurring_plan_id is not null: discount = round(gross * RecurringPlan.discount_pct)  # round AFTER summing gross
      quoted_price_cents = gross - discount
    input_set: "ServiceTier base price, the Pet's coat/size loadings, snapshotted add-on prices, and the RecurringPlan discount when the appointment is plan-generated. This is the projected price at booking, BEFORE knowing which add-ons are actually delivered."
    constants:
      MATTED_PRICE_PCT: 0.30
      HEAVY_PRICE_PCT: 0.15
      HEAVY_LBS_THRESHOLD: 60
    precision: "cents (integer); coat_loading and size_loading each rounded round_half_up at the per-component step; plan discount rounded round_half_up AFTER gross is summed"
    variants:
      - name: provisional_at_quote
        when: "issued at QUOTED"
        difference: "Includes every add-on the customer requested at quote time (forward projection of the full requested basket)."

  - name: final_price
    trigger: "Appointment SCHEDULED->COMPLETED"
    algorithm: chronological
    formula: |
      tier = ServiceTier.base_price_cents
      coat_loading = round(tier * MATTED_PRICE_PCT) if Pet.coat_condition == MATTED else 0
      size_loading = round(tier * HEAVY_PRICE_PCT) if Pet.weight_lbs > HEAVY_LBS_THRESHOLD else 0
      delivered_addon_total = sum(AppointmentAddOn.price_cents_snapshot
                                  for attached add-ons whose add_on_id is NOT in
                                  the complete call's skipped_add_on_ids)
      gross = tier + coat_loading + size_loading + delivered_addon_total
      discount = round(gross * RecurringPlan.discount_pct) if appointment.recurring_plan_id is not null else 0
      final_price_cents = gross - discount
    input_set: "Same loadings as quote_price, but the add-on total counts only add-ons actually delivered — any add_on_id the groomer lists in skipped_add_on_ids at completion drops out. Discount recomputed on the delivered gross."
    constants:
      MATTED_PRICE_PCT: 0.30
      HEAVY_PRICE_PCT: 0.15
      HEAVY_LBS_THRESHOLD: 60
    precision: "cents (integer); same per-component rounding then discount-after-gross order as quote_price"
    variants:
      - name: final_at_completion
        when: "computed at COMPLETED"
        difference: "Add-on total restricted to delivered add-ons; differs from quote_price whenever a requested add-on was skipped, so quoted_price_cents != final_price_cents."

  - name: no_show_fee
    trigger: "Appointment SCHEDULED->NO_SHOW"
    algorithm: tiered_pricing
    formula: |
      base = round(appointment.quoted_price_cents * NO_SHOW_PCT)   # percent of the quote
      strikes_before = Customer.no_show_strikes      # count BEFORE this event is registered
      if strikes_before >= REPEAT_STRIKE_THRESHOLD:
          fee = base + REPEAT_PENALTY_CENTS
      else:
          fee = base
      amount_cents = min(fee, NO_SHOW_FEE_CAP_CENTS)
    input_set: "The appointment's pinned quoted_price_cents and the owning Customer's strike count immediately before this no-show is registered."
    constants:
      NO_SHOW_PCT: 0.50
      REPEAT_STRIKE_THRESHOLD: 2
      REPEAT_PENALTY_CENTS: 1500
      NO_SHOW_FEE_CAP_CENTS: 8000
    precision: "cents (integer); percent step rounded round_half_up, then penalty added, then capped via min"
    variants:
      - name: standard_no_show
        when: "Customer.no_show_strikes < REPEAT_STRIKE_THRESHOLD before this event"
        difference: "Fee is the bare percent-of-quote with no repeat penalty; same no-show on the same appointment yields a strictly smaller charge than the escalated variant — risk scoring lives on the Customer, not on the Appointment."
      - name: repeat_escalated_no_show
        when: "Customer.no_show_strikes >= REPEAT_STRIKE_THRESHOLD before this event"
        difference: "Adds REPEAT_PENALTY_CENTS before the cap, so the identical appointment/quote produces a different (larger) fee purely because of the Customer's strike posture."

  - name: late_cancel_fee
    trigger: "Appointment SCHEDULED->CANCELLED within LATE_CANCEL_HOURS of slot_start"
    algorithm: threshold
    formula: |
      hours_out = (RouteStop.slot_start - current_clock) in whole hours, floored
      if hours_out >= LATE_CANCEL_HOURS:
          amount_cents = 0     # not late; no fee, no strike
      else:
          amount_cents = LATE_CANCEL_FLAT_CENTS
    input_set: "The whole-hour gap between current clock and the reserved slot_start at cancel time."
    constants:
      LATE_CANCEL_HOURS: 24
      LATE_CANCEL_FLAT_CENTS: 2500
    precision: "cents (integer); hour gap floored to whole hours; boundary is inclusive at exactly LATE_CANCEL_HOURS (24h out is NOT late)"
    variants: []

  - name: strike_accounting
    trigger: "On every NO_SHOW assessment and every late LATE_CANCEL assessment (a strike event); also reversed on FeeCharge waive"
    algorithm: aggregation
    formula: |
      # A strike is recorded for each NO_SHOW FeeCharge and each LATE_CANCEL FeeCharge
      # whose settlement_status != WAIVED. The rolling count is the number of such
      # strike events whose triggering appointment slot_start is within the trailing
      # STRIKE_WINDOW_DAYS of current clock.
      no_show_strikes = count(strike events with status != WAIVED
                              whose slot_start >= current_clock - STRIKE_WINDOW_DAYS)
      account_status = SUSPENDED if no_show_strikes >= STRIKE_SUSPEND_THRESHOLD else ACTIVE
    input_set: "All NO_SHOW and late-LATE_CANCEL strike events for the customer not yet WAIVED, counted within the trailing STRIKE_WINDOW_DAYS window relative to current clock."
    constants:
      STRIKE_SUSPEND_THRESHOLD: 3
      STRIKE_WINDOW_DAYS: 90
    precision: "integer count; window boundary inclusive at exactly STRIKE_WINDOW_DAYS ago; suspension boundary inclusive (>= threshold suspends)"
    variants: []

  - name: route_load_capacity
    trigger: "Appointment QUOTED->SCHEDULED (capacity gate, validation priority 13)"
    algorithm: aggregation
    formula: |
      window_minutes = floor((RouteDay.window_end - RouteDay.window_start) in minutes)
      # Each stop's LOAD = its service minutes plus one TRAVEL_BUFFER_MIN of travel time,
      # so a day's load accounts for both grooming and inter-stop travel.
      existing_load = sum(RouteStop.scheduled_minutes + TRAVEL_BUFFER_MIN
                          for stops on this RouteDay with status IN {RESERVED, SERVICED, NO_SHOW})
      new_load = appointment.estimated_minutes + TRAVEL_BUFFER_MIN
      # VOIDED stops are excluded (their slot and travel were freed).
      capacity_ok = (existing_load + new_load) <= window_minutes
      # The persisted RouteDay.booked_minutes denormalizes existing_load (service+buffer
      # per non-VOIDED stop) and is reconciled on every add/cancel.
    input_set: "All RouteStops on the target RouteDay whose status IN {RESERVED, SERVICED, NO_SHOW}, each contributing scheduled_minutes + TRAVEL_BUFFER_MIN, compared to the route window length in whole minutes. VOIDED stops are excluded."
    constants:
      TRAVEL_BUFFER_MIN: 15
    precision: "integer minutes; boundary inclusive (existing_load + new_load == window_minutes is allowed; one more minute is rejected)"
    variants: []

  - name: stop_overlap_check
    trigger: "Appointment QUOTED->SCHEDULED (validation priority 10 and 8's groomer filter)"
    algorithm: interval_merge
    formula: |
      req = [slot_start, slot_start + estimated_minutes)            # half-open
      # (a) Van/route geometry: every RESERVED/SERVICED/NO_SHOW stop interval on the
      #     SAME RouteDay is expanded by TRAVEL_BUFFER_MIN on BOTH ends, then tested:
      for each other stop S on the RouteDay (status IN {RESERVED, SERVICED, NO_SHOW}):
          buffered = [S.slot_start - TRAVEL_BUFFER_MIN, S.slot_end + TRAVEL_BUFFER_MIN)
          if req overlaps buffered: reject ERR_SLOT_OVERLAP
      # also req must fit inside [window_start, window_end)
      # (b) Groomer geometry: a candidate groomer's existing RESERVED/SERVICED stops use
      #     RAW half-open intervals with NO buffer — back-to-back (slot_end == slot_start)
      #     is allowed; only true overlap excludes the groomer from the pool.
    input_set: "On the route side, all non-VOIDED stops on the RouteDay with a TRAVEL_BUFFER_MIN buffer; on the groomer side, the candidate groomer's own non-VOIDED stops with no buffer."
    constants:
      TRAVEL_BUFFER_MIN: 15
    precision: "minutes; intervals half-open [start,end); van side adds TRAVEL_BUFFER_MIN both ends, groomer side uses raw intervals (adjacency allowed)"
    variants: []

  - name: groomer_assignment
    trigger: "Appointment QUOTED->SCHEDULED (server picks the groomer)"
    algorithm: weighted_scoring
    formula: |
      candidate_pool = Groomers where:
        status == AVAILABLE
        AND (Pet.muzzle_required == false OR handles_aggressive == true)
        AND (ServiceTier.code != SHOW_CUT OR skill_level == SENIOR)
        AND groomer has no non-VOIDED RouteStop whose RAW [slot_start, slot_end) interval
            overlaps the requested [slot_start, slot_start+estimated_minutes)
            (stop_overlap_check variant b — no buffer, adjacency allowed)
      ranking: prefer skill_level SENIOR over JUNIOR (SENIOR ranks higher),
               then fewer RESERVED stops already assigned to the groomer on this RouteDay (ascending),
               then created_at ASC as the final deterministic tie-break
      selected = first candidate by ranking; if candidate_pool empty -> ERR_NO_QUALIFIED_GROOMER
    input_set: "AVAILABLE groomers satisfying the muzzle and SHOW_CUT skill predicates and free at the requested interval; ranked by skill then current load then created_at."
    constants: {}
    precision: "n/a (selector); tie-break uses created_at ASC, never id"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role permitted for this endpoint per §1.7; ownership-scoped roles act only on their own resources"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enum members valid, numbers in range"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 4
    category: business_temporal
    check: "Field-relationship invariants on the body: VaccinationRecord.expires_on must be strictly after issued_on; RouteDay.window_end must be strictly after window_start"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "POST /pets/{id}/vaccinations, POST /route-days"
  - priority: 5
    category: state
    check: "Target resource is in a state from which this transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: state
    check: "Scheduling onto a LOCKED or CLOSED RouteDay is rejected"
    error_id: ERR_ROUTE_LOCKED
    http_status: 409
    applies_to: "POST /appointments/{id}/schedule"
  - priority: 7
    category: business_safety
    check: "Pet.vaccination_status must be VALID (a non-expired RABIES record at current clock) to quote or schedule"
    error_id: ERR_VACCINATION_REQUIRED
    http_status: 422
    applies_to: "POST /appointments/{id}/quote, POST /appointments/{id}/schedule"
  - priority: 8
    category: business_safety
    check: "An AGGRESSIVE/muzzle-required pet may only be scheduled when the assigned Groomer.handles_aggressive is true; if no such groomer is in the candidate pool, scheduling is rejected"
    error_id: ERR_NO_QUALIFIED_GROOMER
    http_status: 422
    applies_to: "POST /appointments/{id}/schedule"
  - priority: 9
    category: business_referential
    check: "RouteDay.coverage_zip must equal the owning Customer.service_zip for the pet"
    error_id: ERR_ZIP_NOT_COVERED
    http_status: 422
    applies_to: "POST /appointments/{id}/schedule"
  - priority: 10
    category: business_temporal
    check: "Requested stop interval [slot_start, slot_start+estimated_minutes) must fit fully inside the RouteDay [window_start, window_end) and must not overlap any other non-VOIDED stop's interval expanded by TRAVEL_BUFFER_MIN on both ends (stop_overlap_check variant a — buffered van geometry)"
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /appointments/{id}/schedule"
  - priority: 11
    category: business_constraint
    check: "RouteStop count on the day must not exceed Van.max_stops (resource_overlap_van_stop_count: aggregate-capacity overlap)"
    error_id: ERR_VAN_STOPS_FULL
    http_status: 409
    applies_to: "POST /appointments/{id}/schedule"
  - priority: 12
    category: business_fiscal
    check: "Customer.account_status must be ACTIVE (not SUSPENDED for strikes) to schedule a new appointment"
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 422
    applies_to: "POST /appointments/{id}/schedule, POST /recurring-plans/{id}/generate-appointment"
  - priority: 13
    category: business_fiscal
    check: "Route load (RouteDay.booked_minutes which already includes per-stop travel buffers) plus the new stop's (estimated_minutes + TRAVEL_BUFFER_MIN) must not exceed the window length in minutes (route_load_capacity)"
    error_id: ERR_ROUTE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /appointments/{id}/schedule"
  - priority: 14
    category: business_constraint
    check: "A requires_calm AddOn cannot be attached to an Appointment whose Pet.behavioral_flag == AGGRESSIVE"
    error_id: ERR_ADDON_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /appointments/{id}/add-ons"
  - priority: 15
    category: state
    check: "OCC: expected_route_day_version must match the target RouteDay.version"
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412
    applies_to: "POST /appointments/{id}/schedule"
  - priority: 16
    category: business_constraint
    check: "SHOW_CUT tier requires a Van with has_show_equipment == true and a SENIOR groomer in the pool"
    error_id: ERR_SHOW_CUT_UNSUPPORTED
    http_status: 422
    applies_to: "POST /appointments/{id}/schedule"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Configuration: Breed / ServiceTier / AddOn / Van ----
  - method: POST
    path: "/breeds"
    description: "Create a breed configuration"
    roles: [PlatformAdmin]
    code: 201
    input: [name, coat_type, size_class, base_service_minutes]
    output: Breed
    side_effects: []
  - method: GET
    path: "/breeds/{id}"
    description: "Fetch a breed"
    roles: [PlatformAdmin, Dispatcher, Customer, Groomer]
    code: 200
    input: []
    output: Breed
    side_effects: []
  - method: POST
    path: "/service-tiers"
    description: "Create a service tier"
    roles: [PlatformAdmin]
    code: 201
    input: [code, base_price_cents, duration_multiplier]
    output: ServiceTier
    side_effects: []
  - method: POST
    path: "/add-ons"
    description: "Create an add-on catalog entry"
    roles: [PlatformAdmin]
    code: 201
    input: [code, price_cents, duration_minutes, "requires_calm?"]
    output: AddOn
    side_effects: []
  - method: POST
    path: "/vans"
    description: "Register a van"
    roles: [PlatformAdmin, Dispatcher]
    code: 201
    input: [label, max_stops, "has_show_equipment?"]
    output: Van
    side_effects: []

  # ---- Customer / Pet / Vaccination ----
  - method: POST
    path: "/customers"
    description: "Register an owner"
    roles: [PlatformAdmin, Customer]
    code: 201
    input: [email, full_name, service_zip]
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers/{id}"
    description: "Fetch an owner with computed strike/fee fields"
    roles: [PlatformAdmin, Dispatcher, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers/{id}/pets"
    description: "List a customer's pets (FK reverse-reachability for Pet.customer_id)"
    roles: [PlatformAdmin, Dispatcher, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: Pet[]
    side_effects: []
  - method: GET
    path: "/customers/{id}/fee-charges"
    description: "List a customer's fee charges (FK reverse-reachability for FeeCharge.customer_id)"
    roles: [PlatformAdmin, Dispatcher, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: FeeCharge[]
    side_effects: []
  - method: POST
    path: "/pets"
    description: "Create a pet under an owner"
    roles: [PlatformAdmin, Customer]
    code: 201
    input: [customer_id, breed_id, name, weight_lbs, "coat_condition?", "behavioral_flag?"]
    output: Pet
    side_effects:
      - "set muzzle_required = (behavioral_flag == AGGRESSIVE)"
      - "set vaccination_status = EXPIRED (no records yet)"
  - method: GET
    path: "/pets/{id}"
    description: "Fetch a pet with computed muzzle/vaccination fields"
    roles: [PlatformAdmin, Dispatcher, Customer, Groomer]
    code: 200
    input: []
    output: Pet
    side_effects: []
  - method: GET
    path: "/pets"
    description: "List pets, filterable by owner or breed (FK reverse-reachability for Pet.customer_id and Pet.breed_id)"
    roles: [PlatformAdmin, Dispatcher, Customer]
    code: 200
    input: ["customer_id?", "breed_id?", "limit?", "offset?"]
    output: Pet[]
    side_effects: []
  - method: PATCH
    path: "/pets/{id}"
    description: "Update mutable pet fields; reconciles derived fields"
    roles: [PlatformAdmin, Customer]
    code: 200
    input: ["coat_condition?", "behavioral_flag?", "weight_lbs?"]
    output: Pet
    side_effects:
      - "reconcile muzzle_required from behavioral_flag (derived_field reconciliation)"
      - "increments Pet.version by 1"
  - method: GET
    path: "/pets/{id}/vaccinations"
    description: "List a pet's vaccination records (FK reverse-reachability for VaccinationRecord.pet_id)"
    roles: [PlatformAdmin, Dispatcher, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: VaccinationRecord[]
    side_effects: []
  - method: POST
    path: "/pets/{id}/vaccinations"
    description: "Upload a vaccination proof record for a pet"
    roles: [PlatformAdmin, Customer]
    code: 201
    input: [vaccine_type, issued_on, expires_on]
    output: VaccinationRecord
    side_effects:
      - "recompute Pet.vaccination_status against current clock (derived_field reconciliation)"
      - "increments Pet.version by 1"

  # ---- Groomer ----
  - method: POST
    path: "/groomers"
    description: "Create a groomer"
    roles: [PlatformAdmin]
    code: 201
    input: [email, full_name, skill_level, "handles_aggressive?", "status?"]
    output: Groomer
    side_effects: []
  - method: GET
    path: "/groomers/{id}"
    description: "Fetch a groomer"
    roles: [PlatformAdmin, Dispatcher, Groomer]
    code: 200
    input: []
    output: Groomer
    side_effects: []

  # ---- RouteDay / RouteStop ----
  - method: POST
    path: "/route-days"
    description: "Create a route day for a van"
    roles: [PlatformAdmin, Dispatcher]
    code: 201
    input: [van_id, service_date, window_start, window_end, coverage_zip]
    output: RouteDay
    side_effects: []
  - method: GET
    path: "/route-days/{id}"
    description: "Fetch a route day with computed status and booked_minutes"
    roles: [PlatformAdmin, Dispatcher, Groomer]
    code: 200
    input: []
    output: RouteDay
    side_effects: []
  - method: GET
    path: "/route-days/{id}/stops"
    description: "List stops on a route day (FK reverse-reachability for RouteStop.route_day_id)"
    roles: [PlatformAdmin, Dispatcher, Groomer]
    code: 200
    input: ["limit?", "offset?"]
    output: RouteStop[]
    side_effects: []
  - method: POST
    path: "/route-days/{id}/dispatch"
    description: "Lock a route day so no new stops may be added"
    roles: [PlatformAdmin, Dispatcher]
    code: 200
    input: []
    output: RouteDay
    side_effects:
      - "RouteDay OPEN->LOCKED"
      - "increments RouteDay.version by 1"
  - method: GET
    path: "/route-days"
    description: "List route days, filterable by van"
    roles: [PlatformAdmin, Dispatcher]
    code: 200
    input: ["van_id?", "limit?", "offset?"]
    output: RouteDay[]
    side_effects: []
  - method: GET
    path: "/route-stops/{id}"
    description: "Fetch a route stop"
    roles: [PlatformAdmin, Dispatcher, Groomer]
    code: 200
    input: []
    output: RouteStop
    side_effects: []
  - method: GET
    path: "/route-stops"
    description: "List route stops, filterable by groomer's assigned appointment (FK reverse-reachability for RouteStop slot ownership via appointment) — primarily filtered by route_day_id"
    roles: [PlatformAdmin, Dispatcher, Groomer]
    code: 200
    input: ["route_day_id?", "limit?", "offset?"]
    output: RouteStop[]
    side_effects: []

  # ---- Appointment lifecycle ----
  - method: POST
    path: "/appointments"
    description: "Create an appointment request for a pet at a tier"
    roles: [PlatformAdmin, Dispatcher, Customer]
    code: 201
    input: [pet_id, service_tier_id, "recurring_plan_id?"]
    output: Appointment
    side_effects: []
  - method: GET
    path: "/appointments/{id}"
    description: "Fetch an appointment with computed pricing/duration/assignment fields"
    roles: [PlatformAdmin, Dispatcher, Customer, Groomer]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: GET
    path: "/appointments"
    description: "List appointments, filterable by pet, service tier, route stop, groomer, or recurring plan (FK reverse-reachability for Appointment.pet_id, service_tier_id, route_stop_id, groomer_id, recurring_plan_id)"
    roles: [PlatformAdmin, Dispatcher, Customer, Groomer]
    code: 200
    input: ["pet_id?", "service_tier_id?", "route_stop_id?", "groomer_id?", "recurring_plan_id?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []
  - method: POST
    path: "/appointments/{id}/add-ons"
    description: "Attach an add-on to a not-yet-scheduled appointment"
    roles: [PlatformAdmin, Dispatcher, Customer]
    code: 201
    input: [add_on_id]
    output: AppointmentAddOn
    side_effects:
      - "snapshot AddOn.price_cents into price_cents_snapshot"
      - "increments Appointment.version by 1"
  - method: GET
    path: "/appointments/{id}/add-ons"
    description: "List add-ons attached to an appointment (FK reverse-reachability for AppointmentAddOn.appointment_id)"
    roles: [PlatformAdmin, Dispatcher, Customer, Groomer]
    code: 200
    input: ["limit?", "offset?"]
    output: AppointmentAddOn[]
    side_effects: []
  - method: GET
    path: "/add-on-links/{id}"
    description: "Fetch a single appointment-addon link"
    roles: [PlatformAdmin, Dispatcher, Customer, Groomer]
    code: 200
    input: []
    output: AppointmentAddOn
    side_effects: []
  - method: GET
    path: "/add-on-links"
    description: "List appointment-addon links, filterable by add_on_id (FK reverse-reachability for AppointmentAddOn.add_on_id)"
    roles: [PlatformAdmin, Dispatcher]
    code: 200
    input: ["add_on_id?", "appointment_id?", "limit?", "offset?"]
    output: AppointmentAddOn[]
    side_effects: []
  - method: POST
    path: "/appointments/{id}/quote"
    description: "Issue or re-issue a quote (duration + price)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "duration_estimate -> estimated_minutes"
      - "quote_price -> quoted_price_cents"
      - "increment quote_round"
      - "increments Appointment.version by 1"
  - method: POST
    path: "/appointments/{id}/schedule"
    description: "Schedule a quoted appointment onto a route day slot (creates a RouteStop, assigns a groomer)"
    roles: [Dispatcher]
    code: 200
    input: [route_day_id, slot_start, expected_route_day_version]
    output: Appointment
    side_effects:
      - "create RouteStop (RESERVED), set scheduled_minutes/slot_end"
      - "groomer_assignment selector sets appointment.groomer_id"
      - "set appointment.route_stop_id, status SCHEDULED"
      - "derived_route_load reconciliation recomputes RouteDay.booked_minutes"
      - "increments RouteDay.version by 1"
      - "increments Appointment.version by 1"
  - method: POST
    path: "/appointments/{id}/complete"
    description: "Groomer marks the appointment completed; final price computed"
    roles: [Groomer]
    code: 200
    input: ["skipped_add_on_ids?"]
    output: Appointment
    side_effects:
      - "final_price -> final_price_cents (delivered add-ons only)"
      - "RouteStop -> SERVICED"
      - "RouteDay bubble-up to CLOSED if all stops terminal"
      - "increments Appointment.version by 1"
  - method: POST
    path: "/appointments/{id}/no-show"
    description: "Dispatcher records a no-show; assesses fee and strike"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "RouteStop -> NO_SHOW"
      - "no_show_fee -> FeeCharge(NO_SHOW), debit Customer.outstanding_fee_cents"
      - "recompute Customer.no_show_strikes; suspend at threshold"
      - "increments Appointment.version by 1"
  - method: POST
    path: "/appointments/{id}/cancel"
    description: "Owner cancels; late cancels of scheduled appointments assess a flat fee + strike"
    roles: [Customer]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "if SCHEDULED: RouteStop -> VOIDED, recompute RouteDay.booked_minutes"
      - "if late: late_cancel_fee -> FeeCharge(LATE_CANCEL), debit outstanding_fee_cents, strike"
      - "increments Appointment.version by 1"

  # ---- RecurringPlan ----
  - method: POST
    path: "/recurring-plans"
    description: "Create a recurring grooming plan for a pet"
    roles: [PlatformAdmin, Dispatcher, Customer]
    code: 201
    input: [pet_id, service_tier_id, cadence_days, discount_pct]
    output: RecurringPlan
    side_effects: []
  - method: GET
    path: "/recurring-plans/{id}"
    description: "Fetch a recurring plan"
    roles: [PlatformAdmin, Dispatcher, Customer]
    code: 200
    input: []
    output: RecurringPlan
    side_effects: []
  - method: GET
    path: "/recurring-plans"
    description: "List recurring plans, filterable by pet or service tier (FK reverse-reachability for RecurringPlan.pet_id and RecurringPlan.service_tier_id)"
    roles: [PlatformAdmin, Dispatcher, Customer]
    code: 200
    input: ["pet_id?", "service_tier_id?", "limit?", "offset?"]
    output: RecurringPlan[]
    side_effects: []
  - method: POST
    path: "/recurring-plans/{id}/pause"
    description: "Pause generation"
    roles: [Customer]
    code: 200
    input: []
    output: RecurringPlan
    side_effects: ["increments RecurringPlan.version by 1"]
  - method: POST
    path: "/recurring-plans/{id}/resume"
    description: "Resume generation"
    roles: [Customer]
    code: 200
    input: []
    output: RecurringPlan
    side_effects: ["increments RecurringPlan.version by 1"]
  - method: POST
    path: "/recurring-plans/{id}/cancel"
    description: "Cancel a plan (terminal)"
    roles: [Customer]
    code: 200
    input: []
    output: RecurringPlan
    side_effects: ["increments RecurringPlan.version by 1"]
  - method: POST
    path: "/recurring-plans/{id}/generate-appointment"
    description: "Generate the next appointment from an active plan"
    roles: [Dispatcher]
    code: 201
    input: []
    output: Appointment
    side_effects:
      - "create Appointment REQUESTED with recurring_plan_id and tier from plan"
      - "increments RecurringPlan.version by 1"

  # ---- FeeCharge ----
  - method: GET
    path: "/fee-charges/{id}"
    description: "Fetch a fee charge"
    roles: [PlatformAdmin, Dispatcher, Customer]
    code: 200
    input: []
    output: FeeCharge
    side_effects: []
  - method: GET
    path: "/fee-charges"
    description: "List fee charges, filterable by customer or appointment (FK reverse-reachability for FeeCharge.customer_id and FeeCharge.appointment_id)"
    roles: [PlatformAdmin, Dispatcher, Customer]
    code: 200
    input: ["customer_id?", "appointment_id?", "limit?", "offset?"]
    output: FeeCharge[]
    side_effects: []
  - method: POST
    path: "/fee-charges/{id}/settle"
    description: "Owner settles a pending fee"
    roles: [Customer]
    code: 200
    input: []
    output: FeeCharge
    side_effects:
      - "FeeCharge PENDING->SETTLED"
      - "credit Customer.outstanding_fee_cents (compensating_invariant)"
      - "increments FeeCharge.version by 1"
  - method: POST
    path: "/fee-charges/{id}/waive"
    description: "Admin waives a pending fee and reverses its strike"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FeeCharge
    side_effects:
      - "FeeCharge PENDING->WAIVED"
      - "credit Customer.outstanding_fee_cents and decrement no_show_strikes (compensating_invariant)"
      - "increments FeeCharge.version by 1"

  # ---- Test-driving (clock) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC clock for deterministic time-gated tests"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "subsequent vaccination_status / late-cancel-hour computations use this clock"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Authenticated role not permitted for this endpoint, or ownership-scoped role acting on another's resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource (path id or FK body field) does not exist"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Malformed body: missing required field, invalid enum, out-of-range number"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition not allowed from the resource's current state"
  - id: ERR_ROUTE_LOCKED
    http: 409
    condition: "Scheduling onto a LOCKED or CLOSED RouteDay"
  - id: ERR_VACCINATION_REQUIRED
    http: 422
    condition: "Pet has no non-expired RABIES record at current clock when quoting or scheduling"
  - id: ERR_NO_QUALIFIED_GROOMER
    http: 422
    condition: "No AVAILABLE groomer in the candidate pool satisfies the pet's muzzle/skill requirements"
  - id: ERR_ZIP_NOT_COVERED
    http: 422
    condition: "RouteDay.coverage_zip does not match the owning Customer.service_zip"
  - id: ERR_SLOT_OVERLAP
    http: 409
    condition: "Requested stop interval falls outside the route window or overlaps another stop's buffered interval"
  - id: ERR_VAN_STOPS_FULL
    http: 409
    condition: "Adding a stop would exceed Van.max_stops on the route day"
  - id: ERR_ACCOUNT_SUSPENDED
    http: 422
    condition: "Customer.account_status == SUSPENDED prevents scheduling or plan generation"
  - id: ERR_ROUTE_CAPACITY_EXCEEDED
    http: 409
    condition: "booked_minutes + estimated_minutes would exceed the window-derived route capacity"
  - id: ERR_ADDON_NOT_ALLOWED
    http: 422
    condition: "A requires_calm add-on attached to an appointment whose pet is AGGRESSIVE"
  - id: ERR_STALE_ROUTE_VERSION
    http: 412
    condition: "expected_route_day_version does not match the target RouteDay.version (OCC)"
  - id: ERR_SHOW_CUT_UNSUPPORTED
    http: 422
    condition: "SHOW_CUT tier scheduled on a van without show equipment or with no SENIOR groomer available"
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic body validation fallback (e.g., expires_on not after issued_on, window_end not after window_start)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator owning catalog configuration (breeds, tiers, add-ons, vans, groomers), fee waivers, and the test-driving clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /breeds"
      - "POST /service-tiers"
      - "POST /add-ons"
      - "POST /groomers"
      - "POST /fee-charges/{id}/waive"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /vans (with Dispatcher)"
      - "POST /customers, POST /pets, POST /pets/{id}/vaccinations (with Customer)"
      - "POST /route-days, POST /route-days/{id}/dispatch (with Dispatcher)"
      - "POST /recurring-plans (with Dispatcher, Customer)"
      - "all GET reads"
  - name: Dispatcher
    description: "Operates routes, quotes, scheduling, no-show recording, and plan-driven appointment generation"
    identity: "opaque"
    exclusive_operations:
      - "POST /appointments/{id}/quote"
      - "POST /appointments/{id}/schedule"
      - "POST /appointments/{id}/no-show"
      - "POST /recurring-plans/{id}/generate-appointment"
    shared_operations:
      - "POST /vans, POST /route-days, POST /route-days/{id}/dispatch (with PlatformAdmin)"
      - "POST /appointments, POST /appointments/{id}/add-ons (with Customer)"
      - "POST /recurring-plans (with PlatformAdmin, Customer)"
      - "route/appointment/customer GET reads"
  - name: Customer
    description: "Pet owner; manages own pets, vaccinations, appointment requests, cancellations, plan pause/resume/cancel, and fee settlement"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /appointments/{id}/cancel"
      - "POST /recurring-plans/{id}/pause"
      - "POST /recurring-plans/{id}/resume"
      - "POST /recurring-plans/{id}/cancel"
      - "POST /fee-charges/{id}/settle"
    shared_operations:
      - "POST /customers, POST /pets, POST /pets/{id}/vaccinations, PATCH /pets/{id} (with PlatformAdmin)"
      - "POST /appointments, POST /appointments/{id}/add-ons (with Dispatcher)"
      - "POST /recurring-plans (with PlatformAdmin, Dispatcher)"
      - "reads of own pets, appointments, fee-charges, plans"
  - name: Groomer
    description: "Field groomer; completes appointments assigned to them and reads their route/stop data"
    identity: "entity_backed:Groomer"
    exclusive_operations:
      - "POST /appointments/{id}/complete"
    shared_operations:
      - "reads of route-days, route-stops, appointments, pets, groomers"
