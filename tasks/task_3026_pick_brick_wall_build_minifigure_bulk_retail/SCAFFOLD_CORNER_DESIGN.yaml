      - name: shrinkage_excludes_open_orders_from_both_numerator_and_denominator
        claim_type: Input Set Filtering
        grounds: ["calculations.store_shrinkage_basis_points", "entities.Store.fields.shrinkage_basis_points"]
        distinguishing_aspect: "A store holding one PENDING order and one SETTLED order reads zero basis points until the second order is voided, at which point only the voided order enters both the numerator and the denominator."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0211 with element 4801, one member and one bin holding 1000 g."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
