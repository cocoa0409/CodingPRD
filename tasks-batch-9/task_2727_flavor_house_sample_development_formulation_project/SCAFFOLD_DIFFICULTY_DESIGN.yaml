          - state_machines.Formula.SUBMITTED_to_APPROVED
          - entities.Formula.fields.rework_reason
          - calculations.formula_bench_cost
        distinguishing_aspect: |
          CYCLIC shape on Formula (a different entity from the SampleLot parallel
          dimensions): the row visits DRAFT and SUBMITTED twice within one test.
          The rework return path is only reachable by REMOVING a component line
          (adding one is impossible at total_weight_pct 100.0000), the re-entry
          wipes bench_cost_per_kg_cents back to null, and the second costing pass
