              as: ServiceManager
              captures: { vto: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech One", weekly_capacity_hours: 40 }
              as: ServiceManager
              captures: { tto1: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech Two", weekly_capacity_hours: 40 }
              as: ServiceManager
              captures: { tto2: $.data.id }
            - call: "POST /service-tickets"
              payload: { site_id: "${sto}", vessel_id: "${vto}", job_type: "INSPECTION", requires_entry: false, est_hours: 2, crew_size: 1 }
              as: ServiceManager
              captures: { tto: $.data.id }
            - call: "POST /service-tickets/${tto}/quote"
              payload: {}
              as: ServiceManager
            - call: "POST /service-tickets/${tto}/approve"
              payload: {}
              as: PlantOperator
              as_user_id: "${sto}"
            - call: "POST /service-tickets/${tto}/schedule"
              payload: { technician_id: "${tto1}", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T10:00:00Z" }
              as: ServiceManager
          trigger:
            - call: "POST /service-tickets/${tto}/start"
              payload: {}
              as: Technician
              as_user_id: "${tto2}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN and http status 403"
            - "ticket remains SCHEDULED"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_vessel_version_rejected
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[vessel-config-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "PATCH /vessels/{id} with the version observed before another update is rejected with ERR_STALE_VERSION (412); the same version succeeds once, then fails after the vessel advanced to version+1."
        test_recipe:
          setup: ["Site and vessel exist; the vessel create response carries version 1."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "OC Site", state_code: "IA" }
              as: ServiceManager
              captures: { soc: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${soc}", name: "SILO-OC", vessel_kind: "SILO", capacity_tons: 100, material_name: "corn", reorder_point_pct: 30 }
              as: ServiceManager
              captures: { voc: $.data.id, voc_ver: $.data.version }
          trigger:
            - call: "PATCH /vessels/${voc}"
              payload: { expected_vessel_version: "${voc_ver}", reorder_point_pct: 35 }
              as: ServiceManager
            - call: "PATCH /vessels/${voc}"
              payload: { expected_vessel_version: "${voc_ver}", reorder_point_pct: 40 }
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "first PATCH succeeds: reorder_point_pct == 35 and version == ${voc_ver} + 1"
            - "second PATCH with the same observed version fails: error_id == ERR_STALE_VERSION and http status 412"
            - "after rejection reorder_point_pct remains 35"

