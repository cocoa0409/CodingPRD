      - name: one_to_one_coverage_consumes_the_whole_4_0_bedside_capacity_whatever_the_acuity
        claim_type: Correct Result
        grounds:
          - calculations.care_assignment_unit_debit
          - calculations.encounter_required_coverage_units
          - entities.CareAssignment.fields.coverage_mode
          - entities.CareAssignment.fields.acuity_units_consumed
          - entities.LaborEncounter.fields.staffing_state
          - endpoints[POST /care-assignments]
        distinguishing_aspect: |
          care_assignment_unit_debit has two branches and the ONE_TO_ONE branch ignores acuity entirely:
          the debit is the covering shift's capacity_units_effective, not ACUITY_UNITS * PHASE_MULTIPLIER.
          A TIER_I ANTEPARTUM encounter — whose ratio-shared price would be a mere 0.5 — therefore
          consumes all 4.0 units of a BEDSIDE/ADVANCED shift, filling it exactly to its inclusive
          capacity limit. The encounter's required_coverage_units stays 0.5 while its
          assigned_coverage_units jumps to 4.0, so the two numbers deliberately disagree; an
          implementation that prices the one-to-one row by acuity records 0.5 and leaves the shift 87.5%
          idle, and one that treats required and assigned as the same quantity cannot produce this pair.
        test_recipe:
          setup: |
            Clock at 2026-08-01T06:00:00Z. One unit with one AVAILABLE LDR bed left unoccupied so the
            posture is never DIVERT. One ADVANCED RN on an ACTIVE BEDSIDE shift 05:00-15:00, whose
            capacity_units_effective is min(BASE[BEDSIDE] 4.0, CERT_CAP[ADVANCED] 4.0) = 4.0 with no
            admin offset and no TIER_IV focus penalty. One term singleton vertex encounter in
            ANTEPARTUM, acuity_tier TIER_I, required_coverage_units 0.5, staffing_state UNASSIGNED, and
            the shift carries no coverage yet (assigned_acuity_load_units 0.0), so the nurse is still
            exclusively available as 11.2 demands.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Larkspur Perinatal Institute LDR", licensed_ldr_beds: 5, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Rosalind Ferraro RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-06-30T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bedside_staff_id: $.data.id }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${bedside_staff_id}", role_slot: "BEDSIDE", shift_start_utc: "2026-08-01T05:00:00Z", shift_end_utc: "2026-08-01T15:00:00Z" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { bedside_shift_id: $.data.id }
            - call: POST /shift-assignments/${bedside_shift_id}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { bedside_capacity: $.data.capacity_units_effective, load_before: $.data.assigned_acuity_load_units }
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-ONE21-2323", parity: 2, gestational_age_weeks: 40 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { enc_id: $.data.id, required_at_birth: $.data.required_coverage_units }
            - call: GET /labor-encounters/${enc_id}
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { enc_v: $.data.version }
          trigger:
            - call: POST /care-assignments
              payload: { encounter_id: "${enc_id}", shift_assignment_id: "${bedside_shift_id}", coverage_mode: "ONE_TO_ONE", expected_encounter_version: "${enc_v}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { assignment_id: $.data.id, debit: $.data.acuity_units_consumed, mode: $.data.coverage_mode }
          assert:
            - "HTTP 201"
            - "bedside_capacity == 4.0"
            - "load_before == 0.0"
            - "required_at_birth == 0.5"
            - "mode == \"ONE_TO_ONE\""
            - "debit == 4.0"
            - "CareAssignment.${assignment_id}.acuity_units_consumed == 4.0"
            - "ShiftAssignment.${bedside_shift_id}.assigned_acuity_load_units == 4.0"
            - "LaborEncounter.${enc_id}.staffing_state == \"ONE_TO_ONE_COVERED\""
            - "LaborEncounter.${enc_id}.required_coverage_units == 0.5"
            - "LaborEncounter.${enc_id}.assigned_coverage_units == 4.0"
            - "LaborEncounter.${enc_id}.acuity_tier == \"TIER_I\""
            - "ObstetricUnit.${unit_id}.coverage_deficit_units == 0.0"
            - "the shift now sits exactly at its inclusive limit — assigned_acuity_load_units equals capacity_units_effective at 4.0"

      - name: occupying_the_last_available_ldr_bed_drives_divert_with_a_deficit_of_only_0_5
        claim_type: Correct Result
        grounds:
          - calculations.unit_posture_derivation
          - entities.ObstetricUnit.fields.staffing_posture
          - entities.ObstetricUnit.fields.coverage_deficit_units
          - entities.Bed.fields.status
          - endpoints[POST /labor-encounters/{encounterId}/assign-bed]
        distinguishing_aspect: |
          unit_posture_derivation is a first-match-wins ladder, and the DIVERT branch is a THREE-way OR:
          coverage_deficit_units >= 8.0, OR available_ldr_beds == 0, OR a stage-3 massive transfusion.
          Occupying the unit's only LDR bed fires the second disjunct while the deficit is a trivial 0.5
          — far below the 4.0 that would even reach INDUCTION_FROZEN and the 8.0 the first disjunct
          needs. The declared side effect of assign-bed ("consuming the last AVAILABLE LDR bed raises
          DIVERT") is therefore observable with almost no coverage pressure at all. An implementation
          that treats posture as a pure function of the deficit lands on RATIO_STRAINED here, and one
          that counts licensed beds (5) rather than AVAILABLE LDR rows (0) never reaches DIVERT.
        test_recipe:
          setup: |
            Clock at 2026-08-01T06:00:00Z. One unit declaring 5 licensed LDR beds but with exactly ONE
            Bed row created, LDR-01, status AVAILABLE. One term singleton vertex encounter exists,
            created while that bed was still AVAILABLE (so the 8.02 admission gate passed), acuity_tier
            TIER_I, required_coverage_units 0.5, staffing_state UNASSIGNED and no CareAssignment
            anywhere — assigned_coverage_units 0.0.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Quillbrook Womens Hospital LDR", licensed_ldr_beds: 5, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_1: $.data.id, bed_status_before: $.data.status }
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-DIVERT-2424", parity: 3, gestational_age_weeks: 40 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { enc_id: $.data.id }
          trigger:
            - call: POST /labor-encounters/${enc_id}/assign-bed
              payload: { bed_id: "${bed_ldr_1}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { enc_bed_id: $.data.bed_id }
          assert:
            - "HTTP 200"
            - "bed_status_before == \"AVAILABLE\""
            - "enc_bed_id == \"${bed_ldr_1}\""
            - "Bed.${bed_ldr_1}.status == \"OCCUPIED\""
            - "ObstetricUnit.${unit_id}.staffing_posture == \"DIVERT\""
            - "ObstetricUnit.${unit_id}.coverage_deficit_units == 0.5"

