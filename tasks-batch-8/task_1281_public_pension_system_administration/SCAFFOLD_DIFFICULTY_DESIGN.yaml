            - { call: "POST /contribution-reports/${rep1}/lines/${l23}/review", payload: { decision: "REJECT", review_note: "salary unverified" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep1}/finalize", payload: {}, as: MemberServicesAnalyst, captures: { rep_status_var: $.data.status } }
          trigger:
