        distinguishing_aspect: "The survey version captured at creation is stale after submit; filing a claim with it returns ERR_STALE_SURVEY_VERSION 412 (not ERR_INVALID_STATE — the survey is legitimately SUBMITTED), and the post-submit version files successfully."
