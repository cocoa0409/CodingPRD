              as: ComplianceAdmin
              as_user_id: adm-1
            - call: "POST /monitoring-assignments/${ma1}/reinstate"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
              captures: { err_second_reinstate: "$.data.error_id" }
            - call: "GET /stations/${station_id}/compliance-summary"
              as: ComplianceAdmin
              as_user_id: adm-1
          assert:
            - "baseline: ${acc_before} == 2, required_source_count == 2, missing_source_count == 0, ${score_base} == 100.00, compliance_posture == COMPLIANT"
            - "after decommission: ma1.status == DECOMMISSIONED with counts_toward_required_sources == false; accessible_source_count == 1, missing_source_count == 1, compliance_score == 75.00 == 100.00 - 25.00, compliance_posture == WATCH"
            - "after reinstate: ma1.status == ACTIVE again, accessible_source_count == ${acc_before} == 2, missing_source_count == 0, compliance_score == ${score_base} == 100.00, compliance_posture == COMPLIANT — the compensation is exact, not approximate"
            - "reinstate did NOT touch last_receipt_at or silence_flagged_at: ma1.silence_flagged_at == null and silent_assignment_count == 0 throughout"
            - "${err_second_reinstate} == 'ERR_ASSIGNMENT_NOT_DECOMMISSIONED' with HTTP 409 (precondition 'status == DECOMMISSIONED')"
            - "after the rejected second reinstate the summary is byte-identical: accessible_source_count == 2 and compliance_score == 100.00 — no double count, no drift"

      - name: supersede_conserves_exactly_one_active_row_per_source_type
        grounds:
          - "§1.2 state_machines.MonitoringAssignment ACTIVE -> DECOMMISSIONED (system supersede): 'the new row's superseded_assignment_id is set to this row's id', 'Station.accessible_source_count recomputed once, after the supersede'"
          - "§1.1 MonitoringAssignment.superseded_assignment_id (self-referential FK) and §1.5 GET /monitoring-assignments filter superseded_assignment_id"
          - "§1.6 ERR_SOURCE_TYPE_ALREADY_COVERED (409): 'reinstate while another ACTIVE assignment of the same station already covers that source_type'"
          - "§1.0 consistency_model immediate"
        distinguishing_aspect: "Creating a replacement row for a source_type already covered is a swap, not an addition: the invariant 'exactly one ACTIVE row per (station, source_type)' holds before, during and after — accessible_source_count stays 1 with no observable dip (the recompute runs ONCE, after the supersede), and the older row cannot be resurrected while its successor is ACTIVE."
        test_recipe:
          setup:
            - "Plan KS 2026-R1 requiring PEP only, activated; station KWEA; devices dev1 and dev2 both READY."
            - "ma1 PEP/WXPEP on dev1, ACTIVE -> accessible_source_count 1, compliance_score 100.00, COMPLIANT."
          setup_api_calls:
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /eas-devices"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", model_code: "DASDEC-3", device_role: "DECODER", firmware_version: "5.2.1" }
              captures: { dev1: "$.data.id" }
            - call: "POST /eas-devices/${dev1}/readiness-check"
              as: StationEngineer
              as_user_id: eng-1
              payload: { self_test_passed: true, firmware_current: true }
            - call: "POST /eas-devices"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", model_code: "DASDEC-3", device_role: "MONITOR", firmware_version: "5.2.1" }
              captures: { dev2: "$.data.id" }
            - call: "POST /eas-devices/${dev2}/readiness-check"
              as: StationEngineer
              as_user_id: eng-1
              payload: { self_test_passed: true, firmware_current: true }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv1: "$.data.version" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "PEP", source_call_sign: "WXPEP", expected_station_version: "${sv1}" }
              captures: { ma1: "$.data.id" }
            - call: "GET /stations/${station_id}/compliance-summary"
              as: ComplianceAdmin
              as_user_id: adm-1
              captures: { acc_pre: "$.data.accessible_source_count", score_pre: "$.data.compliance_score" }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv2: "$.data.version" }
          trigger:
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev2}", source_type: "PEP", source_call_sign: "WXPEP2", expected_station_version: "${sv2}" }
              captures: { ma2: "$.data.id" }
            - call: "GET /monitoring-assignments/${ma1}"
              as: StationEngineer
              as_user_id: eng-1
            - call: "GET /stations/${station_id}/compliance-summary"
              as: ComplianceAdmin
              as_user_id: adm-1
            - call: "GET /monitoring-assignments"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "${station_id}", superseded_assignment_id: "${ma1}" }
            - call: "GET /monitoring-assignments"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "${station_id}", source_type: "PEP", status: "ACTIVE" }
            - call: "POST /monitoring-assignments/${ma1}/reinstate"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
              captures: { err_covered: "$.data.error_id" }
            - call: "GET /stations/${station_id}/compliance-summary"
              as: ComplianceAdmin
              as_user_id: adm-1
          assert:
            - "baseline: ${acc_pre} == 1 and ${score_pre} == 100.00"
            - "ma2 is created 201 with status == ACTIVE, counts_toward_required_sources == true, and superseded_assignment_id == ${ma1}"
            - "ma1 is now DECOMMISSIONED with counts_toward_required_sources == false and its own superseded_assignment_id still null (the pointer lives on the NEW row)"
            - "accessible_source_count == ${acc_pre} == 1 and compliance_score == ${score_pre} == 100.00 with compliance_posture == COMPLIANT — the recompute ran once AFTER the supersede, so no 75.00/WATCH dip is ever observable (consistency_model immediate: the create response already shows the settled value)"
            - "GET /monitoring-assignments filtered by superseded_assignment_id == ${ma1} returns exactly one row, ${ma2} — the self-referential FK is reverse-reachable"
            - "GET /monitoring-assignments filtered by source_type PEP and status ACTIVE returns exactly one row, ${ma2} — the invariant 'one ACTIVE row per (station, source_type)' held before and after"
            - "${err_covered} == 'ERR_SOURCE_TYPE_ALREADY_COVERED' with HTTP 409 — the create path swaps, but the reinstate path refuses to create a second ACTIVE PEP row"
            - "final summary unchanged: accessible_source_count == 1, compliance_score == 100.00, silent_assignment_count == 0"
