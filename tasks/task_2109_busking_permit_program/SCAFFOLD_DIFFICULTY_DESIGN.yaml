  - rule_id: cross_entity_state_dependency
    instances:

      - name: booking_admission_depends_on_permit_compliance_axis
        grounds:
          - validations[priority=52]
          - state_machines.Permit.WARNED_to_SUSPENDED
          - state_machines.Permit.SUSPENDED_to_CLEAR
          - errors[ERR_PERMIT_SUSPENDED]
          - calculations.effective_noise_cap
        distinguishing_aspect: |
          Entity pair SessionBooking -> Permit: whether POST /busking/session-bookings is admitted at
          all is decided by a field on a DIFFERENT row (Permit.compliance_status). The identical
          request is refused with ERR_PERMIT_SUSPENDED while the permit is SUSPENDED and succeeds
          with 201 after a reinstatement, with nothing about the booking payload changing.
        test_recipe:
          setup:
            - "Performer Ada holds an ACTIVE, CLEAR 2026 permit with the 5400-cent invoice paid and a 120-minute booking on RP-01 from 2026-08-12T10:00:00Z to 12:00:00Z, so season_minutes_used is 120."
            - "The clock sits at 2026-08-12T10:30:00Z and four VIOLATION readings of 85 dB have been filed inside that session: readings 1 and 2 against a cap of 78 push noise_violation_count to 2 and flip CLEAR -> WARNED; readings 3 and 4 against the WARNED cap of 75 push it to 4 and flip WARNED -> SUSPENDED."
            - "The suspension cancels nothing, because the only booking already started at 10:00:00Z."
