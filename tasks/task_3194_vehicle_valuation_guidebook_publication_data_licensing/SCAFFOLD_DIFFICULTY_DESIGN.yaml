# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — Vehicle Valuation Guidebook Publication & Data Licensing
# §1.8 Test Targeting Index: 9 Difficulty Rules x 2 instances each = 18 instances.
# Every numeric literal in assert: was computed by executing the §1.3 formulas
# against the pinned fixture inputs (Decimal, ROUND_HALF_UP).
# Legend: "std bootstrap" = region EAST, config (segment as noted,
# annual_expected_miles 10000), one ACTIVE DEALER source, one ACCEPTED batch
# with the pinned items, series effective_from 2026-09-01T00:00:00Z.
# The logical clock defaults to 2026-09-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: offer_self_declared_good_vs_inspected_fair_reprice
        grounds:
          - calculations.offer_amount
          - calculations.mileage_option_adjustment
          - state_machines.CashOffer.QUOTED_to_INSPECTED
        distinguishing_aspect: |
          Two valid interpretations of the same vehicle — the consumer's
          self-declared tier GOOD versus the dealer's inspected tier FAIR —
          produce different cash amounts on the same offer inputs:
          16509.50 quoted versus 14858.55 after inspection, where the
          inspection result is the max of the raw FAIR re-price (13658.08)
          and the 90%-of-quote floor (14858.55) — the floor binds.
        test_recipe:
          setup:
            - "Edition E_dv1 (ref 20010.00, private_party 19009.50) PUBLISHED for series S_dv1 (cfg_dv1 SUV, region WEST); funding dealer src_dv1 ACTIVE; consumer cons_dv1 exists; clock at default 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /regions"
              payload: { region_code: "WEST", name: "West Region" }
              as: ValuationAdmin
              captures: { r_dv1: $.data.id }
            - call: "POST /configurations"
              payload: { make: "Acme", model: "CUV", year: 2022, trim: "LX", segment: "SUV", annual_expected_miles: 10000, external_key: "cfg-dv1" }
              as: ValuationAdmin
              captures: { cfg_dv1: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "DEALER", region_id: "${r_dv1}", name: "Dealer DV1", external_key: "src-dv1" }
              as: DataOps
              captures: { src_dv1: $.data.id }
            - call: "POST /sources/${src_dv1}/activate"
              payload: {}
              as: DataOps
            - call: "POST /batches"
              payload: { source_id: "${src_dv1}", submission_ref: "b-dv1", items: [ { configuration_id: "${cfg_dv1}", region_id: "${r_dv1}", sold_price_cents: 2001000, sale_date: "2026-08-20", mileage: 30000 } ] }
              as: DataOps
              captures: { b_dv1: $.data.id }
            - call: "POST /batches/${b_dv1}/validate"
              payload: {}
              as: DataOps
            - call: "POST /batches/${b_dv1}/accept"
              payload: {}
              as: DataOps
            - call: "POST /valuation-series"
              payload: { configuration_id: "${cfg_dv1}", region_id: "${r_dv1}", effective_from: "2026-09-01T00:00:00Z", cadence: "WEEKLY", external_key: "ser-dv1" }
              as: ValuationAdmin
              captures: { s_dv1: $.data.id }
            - call: "POST /valuation-series/${s_dv1}/activate"
              payload: {}
              as: ValuationAdmin
            - call: "POST /valuation-editions"
              payload: { series_id: "${s_dv1}", effective_at: "2026-09-01T00:00:00Z" }
              as: ValuationAdmin
              captures: { e_dv1: $.data.id }
            - call: "POST /valuation-editions/${e_dv1}/publish"
              payload: {}
              as: ValuationAdmin
            - call: "POST /consumer-profiles"
              payload: { email: "dv1@x.com", full_name: "Dv One" }
              as: Consumer
              captures: { cons_dv1: $.data.id }
          trigger:
            - call: "POST /cash-offers"
              payload: { edition_id: "${e_dv1}", funding_dealer_id: "${src_dv1}", consumer_id: "${cons_dv1}", mileage: 40000, age_years: 2, declared_condition_tier: "GOOD", option_ids: [] }
              as: DealerPartner
              as_user_id: "${src_dv1}"
              captures: { o_dv1: $.data.id }
            - call: "POST /cash-offers/${o_dv1}/inspect"
              payload: { inspected_condition_tier: "FAIR" }
              as: DealerPartner
              as_user_id: "${src_dv1}"
          assert:
            - "CashOffer.${o_dv1}.offer_amount_cents == 1650950"
            - "CashOffer.${o_dv1}.final_amount_cents == 1485855"
            - "CashOffer.${o_dv1}.final_amount_cents != 1365808 (raw FAIR re-price loses to the 90% floor)"
            - "CashOffer.${o_dv1}.status == INSPECTED"

      - name: market_shift_additive_vs_compounded_blending
        grounds:
          - calculations.trailing_market_reference
          - calculations.market_shift_blending
          - state_machines.MarketShift.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Two valid readings of "apply two +2% shifts" — additive sum
          (1 + 0.02 + 0.02 = 1.04, pinned) versus sequential compounding
          (1.02 * 1.02 = 1.0404) — diverge on identical transaction data:
          additive yields reference 31616.00, compounding would yield
          31628.16. A different entity domain (market reference construction
          on ValuationEdition) than the offer-amount variant.
        test_recipe:
          setup:
            - "Series S_dv2 for cfg_dv2 (TRUCK) in region EAST has 3 ACCEPTED txns (30000.00 dated 2026-08-20 weight 2; 28000.00 dated 2026-07-10 weight 1; 32000.00 dated 2026-08-25 weight 2) giving raw reference 30400.00; two ACTIVE shifts of +2% each: one region-scoped EAST, one global; both effective 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /regions"
              payload: { region_code: "EAST", name: "East Region" }
              as: ValuationAdmin
              captures: { r_dv2: $.data.id }
            - call: "POST /configurations"
              payload: { make: "Acme", model: "Truck", year: 2023, trim: "XLT", segment: "TRUCK", annual_expected_miles: 10000, external_key: "cfg-dv2" }
              as: ValuationAdmin
              captures: { cfg_dv2: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "DEALER", region_id: "${r_dv2}", name: "D1", external_key: "src-dv2a" }
              as: DataOps
              captures: { src_dv2a: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "AUCTION", region_id: "${r_dv2}", name: "A1", external_key: "src-dv2b" }
              as: DataOps
              captures: { src_dv2b: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "LENDER", region_id: "${r_dv2}", name: "L1", external_key: "src-dv2c" }
              as: DataOps
              captures: { src_dv2c: $.data.id }
            - call: "POST /sources/${src_dv2a}/activate"
              payload: {}
              as: DataOps
            - call: "POST /sources/${src_dv2b}/activate"
              payload: {}
              as: DataOps
            - call: "POST /sources/${src_dv2c}/activate"
              payload: {}
              as: DataOps
            - call: "POST /batches"
              payload: { source_id: "${src_dv2a}", submission_ref: "b-dv2a", items: [ { configuration_id: "${cfg_dv2}", region_id: "${r_dv2}", sold_price_cents: 3000000, sale_date: "2026-08-20", mileage: 20000 } ] }
              as: DataOps
              captures: { b_dv2a: $.data.id }
            - call: "POST /batches/${b_dv2a}/validate"
              payload: {}
              as: DataOps
            - call: "POST /batches/${b_dv2a}/accept"
              payload: {}
              as: DataOps
            - call: "POST /batches"
              payload: { source_id: "${src_dv2b}", submission_ref: "b-dv2b", items: [ { configuration_id: "${cfg_dv2}", region_id: "${r_dv2}", sold_price_cents: 2800000, sale_date: "2026-07-10", mileage: 25000 } ] }
              as: DataOps
              captures: { b_dv2b: $.data.id }
            - call: "POST /batches/${b_dv2b}/validate"
              payload: {}
              as: DataOps
            - call: "POST /batches/${b_dv2b}/accept"
              payload: {}
              as: DataOps
            - call: "POST /batches"
              payload: { source_id: "${src_dv2c}", submission_ref: "b-dv2c", items: [ { configuration_id: "${cfg_dv2}", region_id: "${r_dv2}", sold_price_cents: 3200000, sale_date: "2026-08-25", mileage: 18000 } ] }
              as: DataOps
              captures: { b_dv2c: $.data.id }
            - call: "POST /batches/${b_dv2c}/validate"
              payload: {}
              as: DataOps
            - call: "POST /batches/${b_dv2c}/accept"
              payload: {}
              as: DataOps
            - call: "POST /market-shifts"
              payload: { region_id: "${r_dv2}", segment: null, effective_at: "2026-09-01T00:00:00Z", pct_adjustment: 0.02 }
              as: ValuationAdmin
              captures: { sh_dv2a: $.data.id }
            - call: "POST /market-shifts"
              payload: { region_id: null, segment: null, effective_at: "2026-09-01T00:00:00Z", pct_adjustment: 0.02 }
              as: ValuationAdmin
              captures: { sh_dv2b: $.data.id }
            - call: "POST /market-shifts/${sh_dv2a}/activate"
              payload: {}
              as: ValuationAdmin
            - call: "POST /market-shifts/${sh_dv2b}/activate"
              payload: {}
              as: ValuationAdmin
            - call: "POST /valuation-series"
              payload: { configuration_id: "${cfg_dv2}", region_id: "${r_dv2}", effective_from: "2026-09-01T00:00:00Z", cadence: "WEEKLY", external_key: "ser-dv2" }
              as: ValuationAdmin
              captures: { s_dv2: $.data.id }
            - call: "POST /valuation-series/${s_dv2}/activate"
              payload: {}
              as: ValuationAdmin
          trigger:
            - call: "POST /valuation-editions"
              payload: { series_id: "${s_dv2}", effective_at: "2026-09-01T00:00:00Z" }
              as: ValuationAdmin
              captures: { e_dv2: $.data.id }
          assert:
            - "ValuationEdition.${e_dv2}.reference_price_cents == 3161600"
            - "ValuationEdition.${e_dv2}.reference_price_cents != 3162816 (compounding rejected)"
            - "ValuationEdition.${e_dv2}.trade_in_cents == 2750592"
            - "ValuationEdition.${e_dv2}.retail_cents == 3414528"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: mileage_option_adjustment_three_input_nonlinear
        grounds:
          - calculations.mileage_option_adjustment
          - entities.Configuration.fields.annual_expected_miles
        distinguishing_aspect: |
          Mode (a): the offer amount is a >= 3-input non-linear composition —
          two-slab mileage deduction (0.15/mile up to 10000 excess miles, then
          0.10/mile), a capped options credit (min(sum, 8% of reference)), and
          a price floor (max(..., 20% of reference)); each input exercises a
          different branch of the formula.
        test_recipe:
          setup:
            - "Edition E_cf1 PUBLISHED with reference 30400.00 (private_party 28880.00) for series S_cf1 (cfg_cf1 TRUCK, annual_expected_miles 10000, region EAST); options opt_tow 800.00 and opt_bed 600.00 on cfg_cf1; funding dealer src_cf1 ACTIVE; consumer cons_cf1 exists"
          setup_api_calls:
            - call: "POST /regions"
              payload: { region_code: "EAST", name: "East Region" }
              as: ValuationAdmin
              captures: { r_cf1: $.data.id }
            - call: "POST /configurations"
              payload: { make: "Acme", model: "Truck", year: 2023, trim: "XLT", segment: "TRUCK", annual_expected_miles: 10000, external_key: "cfg-cf1" }
              as: ValuationAdmin
              captures: { cfg_cf1: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "DEALER", region_id: "${r_cf1}", name: "CF1D", external_key: "src-cf1" }
              as: DataOps
              captures: { src_cf1: $.data.id }
            - call: "POST /sources/${src_cf1}/activate"
              payload: {}
              as: DataOps
            - call: "POST /batches"
              payload: { source_id: "${src_cf1}", submission_ref: "b-cf1", items: [ { configuration_id: "${cfg_cf1}", region_id: "${r_cf1}", sold_price_cents: 3040000, sale_date: "2026-08-20", mileage: 20000 } ] }
              as: DataOps
              captures: { b_cf1: $.data.id }
            - call: "POST /batches/${b_cf1}/validate"
              payload: {}
              as: DataOps
            - call: "POST /batches/${b_cf1}/accept"
              payload: {}
              as: DataOps
            - call: "POST /valuation-series"
              payload: { configuration_id: "${cfg_cf1}", region_id: "${r_cf1}", effective_from: "2026-09-01T00:00:00Z", cadence: "WEEKLY", external_key: "ser-cf1" }
              as: ValuationAdmin
              captures: { s_cf1: $.data.id }
            - call: "POST /valuation-series/${s_cf1}/activate"
              payload: {}
              as: ValuationAdmin
            - call: "POST /valuation-editions"
              payload: { series_id: "${s_cf1}", effective_at: "2026-09-01T00:00:00Z" }
              as: ValuationAdmin
              captures: { e_cf1: $.data.id }
            - call: "POST /valuation-editions/${e_cf1}/publish"
              payload: {}
              as: ValuationAdmin
            - call: "POST /configurations/${cfg_cf1}/option-packages"
              payload: { option_code: "TOW", credit_cents: 80000 }
              as: ValuationAdmin
              captures: { opt_tow: $.data.id }
            - call: "POST /configurations/${cfg_cf1}/option-packages"
              payload: { option_code: "BED", credit_cents: 60000 }
              as: ValuationAdmin
              captures: { opt_bed: $.data.id }
            - call: "POST /consumer-profiles"
              payload: { email: "cf1@x.com", full_name: "Cf One" }
              as: Consumer
              captures: { cons_cf1: $.data.id }
          trigger:
            - call: "POST /cash-offers"
              payload: { edition_id: "${e_cf1}", funding_dealer_id: "${src_cf1}", consumer_id: "${cons_cf1}", mileage: 50000, age_years: 3, declared_condition_tier: "GOOD", option_ids: ["${opt_tow}", "${opt_bed}"] }
              as: DealerPartner
              as_user_id: "${src_cf1}"
              captures: { o_cf1: $.data.id }
          assert:
            - "CashOffer.${o_cf1}.offer_amount_cents == 2778000"
            - "excess = 50000 - 3*10000 = 20000 -> deduction 10000*0.15 + 10000*0.10 = 2500.00; options credit min(140000, 243200) = 140000; 2888000 - 250000 + 140000 = 2778000"
            - "CashOffer.${o_cf1}.status == QUOTED"
            - "CashOffer.${o_cf1}.expires_at == published_at of ${e_cf1} plus 7 days"

      - name: offer_floor_and_cap_evaluation_order_pinned
        grounds:
          - calculations.offer_amount
          - calculations.mileage_option_adjustment
          - calculations.tier_values
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order —
          reference_price drives private_party (tier table), private_party
          drives the tier-conditioned base, the options cap is 8% OF THE
          REFERENCE (not of the conditioned base), and the floor is 20% OF THE
          REFERENCE; evaluating cap/floor against the conditioned base instead
          of the reference yields different money. With POOR tier and
          300000 excess miles the raw amount (20216.00 - 30500.00 + capped
          credit) collapses onto the reference-derived floor 6080.00.
        test_recipe:
          setup:
            - "Edition E_cf2 PUBLISHED with reference 30400.00 (private_party 28880.00) for series S_cf2 (cfg_cf2 SEDAN, annual_expected_miles 10000, region EAST); option opt_lux 5000.00 on cfg_cf2; funding dealer src_cf2 ACTIVE; consumer cons_cf2 exists"
          setup_api_calls:
            - call: "POST /regions"
              payload: { region_code: "EAST", name: "East Region" }
              as: ValuationAdmin
              captures: { r_cf2: $.data.id }
            - call: "POST /configurations"
              payload: { make: "Acme", model: "Sedan", year: 2020, trim: "S", segment: "SEDAN", annual_expected_miles: 10000, external_key: "cfg-cf2" }
              as: ValuationAdmin
              captures: { cfg_cf2: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "DEALER", region_id: "${r_cf2}", name: "CF2D", external_key: "src-cf2" }
              as: DataOps
              captures: { src_cf2: $.data.id }
            - call: "POST /sources/${src_cf2}/activate"
              payload: {}
              as: DataOps
            - call: "POST /batches"
              payload: { source_id: "${src_cf2}", submission_ref: "b-cf2", items: [ { configuration_id: "${cfg_cf2}", region_id: "${r_cf2}", sold_price_cents: 3040000, sale_date: "2026-08-20", mileage: 20000 } ] }
              as: DataOps
              captures: { b_cf2: $.data.id }
            - call: "POST /batches/${b_cf2}/validate"
              payload: {}
              as: DataOps
            - call: "POST /batches/${b_cf2}/accept"
              payload: {}
              as: DataOps
            - call: "POST /valuation-series"
              payload: { configuration_id: "${cfg_cf2}", region_id: "${r_cf2}", effective_from: "2026-09-01T00:00:00Z", cadence: "WEEKLY", external_key: "ser-cf2" }
              as: ValuationAdmin
              captures: { s_cf2: $.data.id }
            - call: "POST /valuation-series/${s_cf2}/activate"
              payload: {}
              as: ValuationAdmin
            - call: "POST /valuation-editions"
              payload: { series_id: "${s_cf2}", effective_at: "2026-09-01T00:00:00Z" }
              as: ValuationAdmin
              captures: { e_cf2: $.data.id }
            - call: "POST /valuation-editions/${e_cf2}/publish"
              payload: {}
              as: ValuationAdmin
            - call: "POST /configurations/${cfg_cf2}/option-packages"
              payload: { option_code: "LUX", credit_cents: 500000 }
              as: ValuationAdmin
              captures: { opt_lux: $.data.id }
            - call: "POST /consumer-profiles"
              payload: { email: "cf2@x.com", full_name: "Cf Two" }
              as: Consumer
              captures: { cons_cf2: $.data.id }
          trigger:
            - call: "POST /cash-offers"
              payload: { edition_id: "${e_cf2}", funding_dealer_id: "${src_cf2}", consumer_id: "${cons_cf2}", mileage: 320000, age_years: 2, declared_condition_tier: "POOR", option_ids: ["${opt_lux}"] }
              as: DealerPartner
              as_user_id: "${src_cf2}"
              captures: { o_cf2: $.data.id }
          assert:
            - "CashOffer.${o_cf2}.offer_amount_cents == 608000"
            - "raw = 2888000*0.70 = 2021600; deduction = 10000*0.15 + 290000*0.10 = 3050000; options credit = min(500000, 8%*3040000 = 243200) = 243200; 2021600 - 3050000 + 243200 = -786200 < floor 20%*3040000 = 608000 -> floor binds"
            - "CashOffer.${o_cf2}.offer_amount_cents != 404320 (the wrong value produced when the floor is computed from the conditioned base instead of the reference: 20%*2021600)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: source_probation_active_suspension_cycle
        grounds:
          - state_machines.Source
          - entities.Source.fields.consecutive_rejections
        distinguishing_aspect: |
          Cyclic machine on Source: PROBATION -> ACTIVE -> SUSPENDED ->
          PROBATION loops without bound, driven by the consecutive_rejections
          accumulator (a numeric field, not a pure enum), and the cycle's
          re-entry edge (reinstate) resets the accumulator.
        test_recipe:
          setup:
            - "Source src_cyc (AUCTION, region EAST) ACTIVE; configuration cfg_cyc exists; five batches submitted from src_cyc and REJECTED in turn"
          setup_api_calls:
            - call: "POST /regions"
              payload: { region_code: "EAST", name: "East Region" }
              as: ValuationAdmin
              captures: { r_cyc: $.data.id }
            - call: "POST /configurations"
              payload: { make: "Acme", model: "Cyc", year: 2021, trim: "S", segment: "SEDAN", annual_expected_miles: 10000, external_key: "cfg-cyc" }
              as: ValuationAdmin
              captures: { cfg_cyc: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "AUCTION", region_id: "${r_cyc}", name: "Cyc", external_key: "src-cyc" }
              as: DataOps
              captures: { src_cyc: $.data.id }
            - call: "POST /sources/${src_cyc}/activate"
              payload: {}
              as: DataOps
            - call: "POST /batches"
              payload: { source_id: "${src_cyc}", submission_ref: "cyc-1", items: [ { configuration_id: "${cfg_cyc}", region_id: "${r_cyc}", sold_price_cents: 1000000, sale_date: "2026-08-20", mileage: 10000 } ] }
              as: DataOps
              captures: { cyc_b1: $.data.id }
            - call: "POST /batches/${cyc_b1}/reject"
              payload: {}
              as: DataOps
            - call: "POST /batches"
              payload: { source_id: "${src_cyc}", submission_ref: "cyc-2", items: [ { configuration_id: "${cfg_cyc}", region_id: "${r_cyc}", sold_price_cents: 1000000, sale_date: "2026-08-20", mileage: 10000 } ] }
              as: DataOps
              captures: { cyc_b2: $.data.id }
            - call: "POST /batches/${cyc_b2}/reject"
              payload: {}
              as: DataOps
            - call: "POST /batches"
              payload: { source_id: "${src_cyc}", submission_ref: "cyc-3", items: [ { configuration_id: "${cfg_cyc}", region_id: "${r_cyc}", sold_price_cents: 1000000, sale_date: "2026-08-20", mileage: 10000 } ] }
              as: DataOps
              captures: { cyc_b3: $.data.id }
            - call: "POST /batches/${cyc_b3}/reject"
              payload: {}
              as: DataOps
            - call: "POST /batches"
              payload: { source_id: "${src_cyc}", submission_ref: "cyc-4", items: [ { configuration_id: "${cfg_cyc}", region_id: "${r_cyc}", sold_price_cents: 1000000, sale_date: "2026-08-20", mileage: 10000 } ] }
              as: DataOps
              captures: { cyc_b4: $.data.id }
            - call: "POST /batches/${cyc_b4}/reject"
              payload: {}
              as: DataOps
            - call: "POST /batches"
              payload: { source_id: "${src_cyc}", submission_ref: "cyc-5", items: [ { configuration_id: "${cfg_cyc}", region_id: "${r_cyc}", sold_price_cents: 1000000, sale_date: "2026-08-20", mileage: 10000 } ] }
              as: DataOps
              captures: { cyc_b5: $.data.id }
            - call: "POST /batches/${cyc_b5}/reject"
              payload: {}
              as: DataOps
          trigger:
            - call: "POST /sources/${src_cyc}/reinstate"
              payload: {}
              as: DataOps
          assert:
            - "Source.${src_cyc}.status == PROBATION"
            - "Source.${src_cyc}.consecutive_rejections == 0"
            - "a subsequent POST /batches for ${src_cyc} succeeds (re-entry into the cycle is legal)"

      - name: license_agreement_active_suspended_reactivation_cycle
        grounds:
          - state_machines.LicenseAgreement
          - entities.LicenseAgreement.fields.activation_version
        distinguishing_aspect: |
          Cyclic machine on a different entity (LicenseAgreement):
          ACTIVE -> SUSPENDED -> ACTIVE may repeat, and every reactivation
          captures a fresh methodology Snapshot and bumps activation_version —
          the cycle carries monotonic snapshot state across loops.
        test_recipe:
          setup:
            - "Methodology m_lc PUBLISHED; agreement ag_lc created and activated once (activation_version == 1, one Snapshot row)"
          setup_api_calls:
            - call: "POST /methodologies"
              payload: { version_label: "v2026.09", formula_hash: "hash-lc" }
              as: ValuationAdmin
              captures: { m_lc: $.data.id }
            - call: "POST /methodologies/${m_lc}/publish"
              payload: {}
              as: ValuationAdmin
            - call: "POST /license-agreements"
              payload: { licensee_ref: "lic-cyc", permitted_uses: ["UNDERWRITING"], monthly_event_quota: 1500 }
              as: ValuationAdmin
              captures: { ag_lc: $.data.id }
            - call: "POST /license-agreements/${ag_lc}/activate"
              payload: {}
              as: ValuationAdmin
          trigger:
