            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 33333, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 33333, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p2: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/properties/${p2}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "CA", report_year: 2026 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r1: $.data.id, r1_v1: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${r1}/line-items", payload: { property_id: "${p1}", expected_report_version: "${r1_v1}" }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "GET /escheatment/holder-reports/${r1}", as: Any, captures: { r1_v2: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${r1}/line-items", payload: { property_id: "${p2}", expected_report_version: "${r1_v2}" }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-11-11T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/submit", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-12-11T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
