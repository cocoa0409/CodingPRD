              captures: { v_order: $.data.version }
            - call: "POST /changeover-orders"
              payload: { from_booking_id: "${b_ice}", to_booking_id: "${b_con}", crew_headcount: 40, expected_venue_version: "${v_order}" }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
              captures: { order_id: $.data.id }
            - call: "POST /equipment-assets/${asset_floor}/maintenance"
              payload: { action: "START" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { status_after_start: $.data.status, available_after_start: $.data.units_available }
          trigger:
            - call: "POST /equipment-issues"
              payload: { asset_id: "${asset_floor}", changeover_order_id: "${order_id}", units_issued: 3 }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
            - call: "POST /equipment-assets/${asset_floor}/maintenance"
              payload: { action: "COMPLETE" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /equipment-issues"
              payload: { asset_id: "${asset_floor}", changeover_order_id: "${order_id}", units_issued: 3 }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
              captures: { issue_id: $.data.id }
          assert:
            - "the captured status_after_start == OUT_OF_SERVICE and available_after_start == 10, so no unit shortage exists at the moment of refusal"
            - "the first trigger call returns HTTP 409 with error_id ERR_ASSET_OUT_OF_SERVICE and not ERR_EQUIPMENT_UNITS_UNAVAILABLE"
            - "the third trigger call returns HTTP 201"
            - "EquipmentIssue.${issue_id}.status == ISSUED"
            - "EquipmentIssue.${issue_id}.units_issued == 3"
            - "EquipmentAsset.${asset_floor}.status == IN_SERVICE"
            - "EquipmentAsset.${asset_floor}.units_available == 7"
            - "EquipmentAsset.${asset_floor}.units_out_of_service == 0"
            - "EquipmentAsset.${asset_floor}.cycles_since_service == 0"
            - "EquipmentAsset.${asset_floor}.service_due == false"

      - name: ice_meltout_is_vetoed_by_a_booking_whose_start_sits_exactly_on_the_closed_build_window_edge
        grounds:
          - validations[priority=64]
          - state_machines.IceSheet.IN_SERVICE_to_MELTING
          - entities.EventBooking.fields.event_start_utc
          - entities.ConfigurationProfile.fields.requires_ice
          - errors.ERR_ICE_EVENT_DEPENDENCY
        distinguishing_aspect: |
          Two ice bookings sit one minute apart around the closed build-window edge now +
          ICE_BUILD_MINUTES = 2026-08-01T12:00:00Z: the one starting exactly at 12:00:00Z vetoes the
          melt-out because the window is closed on the right, while the one starting at 12:01:00Z
          does not, so releasing only the first booking makes the identical melt call succeed — and a
          non-ice booking inside the same window is irrelevant because the guard reads the
          booking's ConfigurationProfile.requires_ice, not the booking itself.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, so the closed veto window is [2026-08-01T00:00:00Z, 2026-08-01T12:00:00Z]."
            - "Lakeside Arena registered; PROFILE ICE (requires_ice true) and PROFILE CONCERT (requires_ice false) declared."
            - "An IceSheet with dehumidification_lph_applied 120 and sheet_thickness_mm 32 is IN_SERVICE with condensation_risk_score 0.00."
            - "Booking EDGE uses PROFILE ICE and starts exactly 2026-08-01T12:00:00Z; booking LATE uses PROFILE ICE and starts 2026-08-01T12:01:00Z; booking DECOY uses PROFILE CONCERT and starts 2026-08-01T06:00:00Z. All three are HELD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "ICE_HOCKEY", requires_ice: true, ice_cover_required: false, seating_mode: "FULL_BOWL", nominal_seats: 17000, base_changeover_minutes: 240, crew_size_required: 30, floor_protection_panels_required: 0, dehumidification_required_lph: 120, rigging_points_required: 40 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_ice: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "CONCERT_END_STAGE", requires_ice: false, ice_cover_required: true, seating_mode: "CURTAINED_HALF", nominal_seats: 9000, base_changeover_minutes: 300, crew_size_required: 40, floor_protection_panels_required: 120, dehumidification_required_lph: 0, rigging_points_required: 220 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_con: $.data.id }
            - call: "POST /venues/${venue_id}/ice-sheets"
              payload: { config_profile_id: "${p_ice}", dehumidification_lph_applied: 120, sheet_thickness_mm: 32 }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
              captures: { sheet_id: $.data.id }
            - call: "POST /ice-sheets/${sheet_id}/transition"
              payload: { to_status: "IN_SERVICE" }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Edge ice event", promoter_name: "Lakeside Hockey Club", event_start_utc: "2026-08-01T12:00:00Z", event_end_utc: "2026-08-01T15:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: BookingManager
              captures: { b_edge: $.data.id }
            - call: "POST /event-bookings/${b_edge}/hold"
              payload: {}
              as: BookingManager
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Late ice event", promoter_name: "Riverton Athletics", event_start_utc: "2026-08-01T12:01:00Z", event_end_utc: "2026-08-01T15:01:00Z", expected_attendance: 14000, rigging_load_kg: 2000 }
              as: BookingManager
              captures: { b_late: $.data.id }
            - call: "POST /event-bookings/${b_late}/hold"
              payload: {}
              as: BookingManager
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_con}", title: "Decoy concert inside the window", promoter_name: "Northline Live", event_start_utc: "2026-08-01T06:00:00Z", event_end_utc: "2026-08-01T09:00:00Z", expected_attendance: 8000, rigging_load_kg: 4000 }
              as: BookingManager
              captures: { b_decoy: $.data.id }
            - call: "POST /event-bookings/${b_decoy}/hold"
              payload: {}
              as: BookingManager
          trigger:
            - call: "POST /ice-sheets/${sheet_id}/transition"
              payload: { to_status: "MELTING" }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
            - call: "POST /event-bookings/${b_edge}/release"
              payload: { reason: "Tenant withdrew the edge date" }
              as: BookingManager
            - call: "POST /ice-sheets/${sheet_id}/transition"
              payload: { to_status: "MELTING" }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
          assert:
            - "the first trigger call returns HTTP 409 with error_id ERR_ICE_EVENT_DEPENDENCY, vetoed by the booking starting exactly at 2026-08-01T12:00:00Z"
            - "the third trigger call returns HTTP 200, because the 12:01:00Z booking is outside the closed window and the concert booking inside it does not require ice"
            - "IceSheet.${sheet_id}.status == MELTING"
            - "IceSheet.${sheet_id}.condensation_risk_score == 0.00"
            - "EventBooking.${b_edge}.status == RELEASED"
            - "EventBooking.${b_late}.status == HELD"
            - "EventBooking.${b_decoy}.status == HELD"
            - "Venue.${venue_id}.ice_deck_status == MELTING"
            - "Venue.${venue_id}.open_hold_count == 2"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: dock_windows_accept_a_gap_of_exactly_the_buffer_and_reject_one_minute_less_on_the_same_dock
        grounds:
          - validations[priority=70]
          - entities.Venue.fields.dock_buffer_minutes
          - entities.DockSlotReservation.fields.dock_number
          - state_machines.DockSlotReservation.null_to_RESERVED
          - errors.ERR_DOCK_WINDOW_CONFLICT
        distinguishing_aspect: |
          Dock 2 and dock 3 each already hold a RESERVED 2026-09-09T10:00Z..14:00Z window, and the
          two new requests differ by exactly one minute: 14:30Z is accepted because a gap of exactly
          dock_buffer_minutes 30 fails the strict `new.start < existing.end + buffer` test, while
          14:29Z on the other dock is refused — so the reservation contest is per (venue,
          dock_number) and buffered, not per booking and not bare interval intersection.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Lakeside Arena registered with dock_count 4 and dock_buffer_minutes 30; PROFILE ICE declared."
            - "One promoter ice booking 2026-09-09T00:00Z..03:00Z is HELD and owns every reservation below."
            - "Dock 2 has a RESERVED LOAD_IN window 2026-09-09T10:00Z..14:00Z; dock 3 has an identical RESERVED window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "ICE_HOCKEY", requires_ice: true, ice_cover_required: false, seating_mode: "FULL_BOWL", nominal_seats: 17000, base_changeover_minutes: 240, crew_size_required: 30, floor_protection_panels_required: 0, dehumidification_required_lph: 120, rigging_points_required: 40 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_ice: $.data.id }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Hockey Sep 9", promoter_name: "Lakeside Hockey Club", event_start_utc: "2026-09-09T00:00:00Z", event_end_utc: "2026-09-09T03:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: BookingManager
              captures: { b_ice: $.data.id }
            - call: "POST /event-bookings/${b_ice}/hold"
              payload: {}
              as: BookingManager
            - call: "POST /event-bookings/${b_ice}/dock-slot-reservations"
              payload: { dock_number: 2, purpose: "LOAD_IN", window_start_utc: "2026-09-09T10:00:00Z", window_end_utc: "2026-09-09T14:00:00Z", truck_count: 6 }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
              captures: { r2: $.data.id }
            - call: "POST /event-bookings/${b_ice}/dock-slot-reservations"
              payload: { dock_number: 3, purpose: "LOAD_IN", window_start_utc: "2026-09-09T10:00:00Z", window_end_utc: "2026-09-09T14:00:00Z", truck_count: 6 }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
              captures: { r3: $.data.id }
          trigger:
            - call: "POST /event-bookings/${b_ice}/dock-slot-reservations"
              payload: { dock_number: 2, purpose: "LOAD_OUT", window_start_utc: "2026-09-09T14:30:00Z", window_end_utc: "2026-09-09T16:00:00Z", truck_count: 4 }
              as: LaborCoordinator
              captures: { r_ok: $.data.id }
            - call: "POST /event-bookings/${b_ice}/dock-slot-reservations"
              payload: { dock_number: 3, purpose: "LOAD_OUT", window_start_utc: "2026-09-09T14:29:00Z", window_end_utc: "2026-09-09T16:00:00Z", truck_count: 4 }
              as: LaborCoordinator
          assert:
            - "the first trigger call returns HTTP 201, because a gap of exactly 30 minutes is accepted"
            - "the second trigger call returns HTTP 409 with error_id ERR_DOCK_WINDOW_CONFLICT"
            - "DockSlotReservation.${r_ok}.status == RESERVED"
            - "DockSlotReservation.${r_ok}.dock_number == 2"
            - "DockSlotReservation.${r_ok}.window_start_utc == 2026-09-09T14:30:00.000Z"
            - "DockSlotReservation.${r2}.status == RESERVED"
            - "DockSlotReservation.${r3}.status == RESERVED"
            - "GET /event-bookings/${b_ice}/dock-slot-reservations returns total_count == 3, so the rejected request created nothing"

      - name: changeover_windows_reject_a_one_minute_overlap_and_accept_windows_that_merely_touch
        grounds:
          - validations[priority=72]
          - calculations.changeover_turnaround_minutes
          - entities.ChangeoverOrder.fields.window_start_utc
          - entities.Venue.fields.min_turnaround_buffer_minutes
          - errors.ERR_CHANGEOVER_WINDOW_CONFLICT
        distinguishing_aspect: |
          An existing turnaround occupies [2026-09-09T03:45Z, 16:00Z) and the two candidate orders
          differ only in their outgoing event's end minute — 15:14Z pushes the new window start to
          15:59Z, one minute inside the incumbent, and is refused, whereas 15:15Z produces a window
          starting exactly at 16:00Z which is accepted because the arithmetic is unbuffered and
          half-open; the contested window start is never supplied by the client but derived as
          from_booking.event_end_utc + min_turnaround_buffer_minutes 45.
