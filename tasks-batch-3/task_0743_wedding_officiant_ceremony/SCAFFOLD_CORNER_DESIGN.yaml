              as: Coordinator
              captures: { cp_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "Classic", tier: "CLASSIC", base_price_cents: 200000, deposit_pct: 0.30 }
              as: Coordinator
              captures: { pkg_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Fir Hall", jurisdiction: "CA", address: "22 Fir" }
              as: Coordinator
              captures: { ven_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { officiant_id: "77777777-7777-4777-8777-777777777777", couple_id: "${cp_id}", package_id: "${pkg_id}", venue_id: "${ven_id}", ceremony_start: "2026-09-01T15:00:00Z", ceremony_end: "2026-09-01T16:00:00Z", travel_distance_km: 10, required_style: "SECULAR" }
              as: Couple
