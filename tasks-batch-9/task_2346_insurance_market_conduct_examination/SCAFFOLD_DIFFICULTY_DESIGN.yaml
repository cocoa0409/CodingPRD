  # =============================================================================
  # RULE 2 - combinatorial_formula
  # =============================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: composite_score_stacks_tier_two_caps_and_volume_multiplier
        grounds:
          - calculations.composite_analysis_score
          - calculations.complaint_ratio_per_1k
          - entities.AnalysisScore.fields.complaint_component
          - entities.AnalysisScore.fields.financial_component
          - entities.AnalysisScore.fields.trend_component
          - entities.AnalysisScore.fields.volume_multiplier
          - entities.AnalysisScore.fields.composite_score
        distinguishing_aspect: |
          Mode (a) - one score exercises FIVE mechanisms in a single formula at once: the discrete
          complaint-ratio tier (ratio 6.00 -> 40), the financial component cap (0.30 * 120 = 36.00
          clamped to FINANCIAL_CAP 30.00), the trend component cap (0.20 * 200 = 40.00 clamped to
          TREND_CAP 30.00), the large-premium volume multiplier (6000000000 >= 5000000000 -> 1.10)
          and the COMPOSITE_CAP (100 * 1.10 = 110.00 clamped to 100.00). Dropping any one mechanism
          - or applying the multiplier before the caps - changes the answer.
        test_recipe:
          setup:
            - "Insurer GRANITE: 50000 policies, 300 confirmed complaints (ratio 6.00 -> HIGH tier), financial_stress_score 120, consumer_trend_score 200, annual_premium_written_cents 6000000000."
            - "Insurer AURORA: 40000 policies, 120 complaints (ratio 3.00 -> ELEVATED tier), financial_stress_score 60, consumer_trend_score 50, annual_premium_written_cents 1200000000 (below the large-premium threshold)."
            - "One DRAFT analysis cycle with target_slot_capacity 2 covering reference period 2025-07-01 .. 2026-06-30."
            - "Logical clock at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Granite Casualty Insurance Company", naic_code: "10007", annual_premium_written_cents: 6000000000, policy_count_in_force: 50000, confirmed_complaints_12mo: 300, financial_stress_score: 120, consumer_trend_score: 200 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { granite_id: "$.data.id", granite_ratio: "$.data.complaint_ratio_per_1k", granite_tier: "$.data.risk_tier" }
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_id: "$.data.id", aurora_ratio: "$.data.complaint_ratio_per_1k" }
            - call: "POST /market-conduct/analysis-cycles"
              payload: { cycle_label: "FY2026 Market Analysis", reference_period_start: "2025-07-01", reference_period_end: "2026-06-30", target_slot_capacity: 2, default_fieldwork_start: "2026-09-01", default_fieldwork_end: "2026-11-30" }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { cycle_id: "$.data.id", cycle_status_initial: "$.data.status" }
          trigger:
            - call: "POST /market-conduct/analysis-cycles/${cycle_id}/score"
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { scored_count: "$.data.scored_insurer_count", cycle_status_after: "$.data.status" }
            - call: "GET /market-conduct/insurers/${granite_id}/analysis-scores"
              payload: { cycle_id: "${cycle_id}" }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { granite_composite: "$.data[0].composite_score", granite_fin: "$.data[0].financial_component", granite_trend: "$.data[0].trend_component", granite_mult: "$.data[0].volume_multiplier", granite_rank: "$.data[0].rank_position" }
            - call: "GET /market-conduct/insurers/${aurora_id}/analysis-scores"
              payload: { cycle_id: "${cycle_id}" }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_composite: "$.data[0].composite_score", aurora_rank: "$.data[0].rank_position" }
          assert:
            - "Insurer.${granite_id}.complaint_ratio_per_1k == 6.00 and risk_tier == HIGH"
            - "Insurer.${aurora_id}.complaint_ratio_per_1k == 3.00 and risk_tier == ELEVATED"
            - "GRANITE AnalysisScore.complaint_component == 40 (ratio 6.00 >= 5.00 tier)"
            - "GRANITE AnalysisScore.financial_component == 30.00 (0.30 * 120 = 36.00 capped at FINANCIAL_CAP)"
            - "GRANITE AnalysisScore.trend_component == 30.00 (0.20 * 200 = 40.00 capped at TREND_CAP)"
            - "GRANITE AnalysisScore.volume_multiplier == 1.10"
            - "GRANITE AnalysisScore.composite_score == 100.00 (uncapped (40 + 30.00 + 30.00) * 1.10 = 110.00 clamped by COMPOSITE_CAP)"
            - "GRANITE AnalysisScore.composite_score != 110.00 and != 100.10 and != 90.91"
            - "AURORA AnalysisScore.complaint_component == 28 and financial_component == 18.00 and trend_component == 10.00 and volume_multiplier == 1.00"
            - "AURORA AnalysisScore.composite_score == 56.00"
            - "GRANITE AnalysisScore.rank_position == 1 and AURORA AnalysisScore.rank_position == 2"
            - "MarketAnalysisCycle.${cycle_id}.status == SCORED and scored_insurer_count == 2 and scored_at is not null"
            - "MarketAnalysisCycle.${cycle_id}.selected_target_count == 0 and slots_available == 2 (scoring does not select)"

