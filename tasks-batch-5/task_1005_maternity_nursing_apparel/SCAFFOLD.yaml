scenario: "1005. Maternity & Nursing Apparel DTC: size/trimester fitment, bump-friendly fit guide, rental vs buy (maternity), subscription capsule, return/exchange, registry, postpartum & nursing, loyalty"
domain_name: maternity-nursing-apparel-dtc
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation          # finite rental-unit pool reserved / committed / released
  secondary_archetype: pricing_engine          # tiered loyalty + subscriber perks + shipping + redemption
  complexity_layers:
    - dual_variant_calculation                 # rental provisional-vs-final; loyalty provisional-vs-settled tier
    - cascading_side_effects                    # order-cancel and return-approve propagation chains
    - optimistic_concurrency                    # OCC on ProductVariant.version and Customer.version
    - rate_threshold_triggers                   # loyalty tiers, free-ship threshold, late-fee boundary
    - temporal_windowing                        # rental occupation windows + capsule possession windows

  entity_topology: hybrid                       # Product->Variant / Subscription->Capsule trees + flat FK peers (Order, Rental, Return)
  state_machine_shape: parallel                 # Order carries payment_status x fulfillment_status; plus cyclic Subscription, branching Rental/Return
  relationship_patterns:
    - one_to_many                               # Product->Variant, Subscription->Capsule, Customer->Order
    - cross_aggregate                           # Order/Rental reference ProductVariant across the Product aggregate
  role_model: peer_roles                        # Shopper owns customer resources; FulfillmentAgent runs ops; PlatformAdmin configures; Guest registers/reads
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: login / contact email; unique
      - name: full_name
        type: string
        source: input
        description: customer display name
      - name: due_date
        type: datetime
        source: input
        description: estimated delivery date; null if not provided; required to place a RENTAL order
        default: null
      - name: postpartum_flag
        type: boolean
        source: input
        description: customer is in postpartum phase
        default: false
      - name: nursing_flag
        type: boolean
        source: input
        description: customer wants nursing-friendly items
        default: false
      - name: loyalty_points
        type: integer
        source: system
        description: "redeemable point balance; invariant: equals sum of LoyaltyLedger.points_delta for this customer"
        default: 0
      - name: lifetime_points
        type: integer
        source: system
        description: cumulative points earned from COMPLETED orders plus ADJUSTMENT entries; drives settled loyalty_tier
        default: 0
      - name: loyalty_tier
        type: enum
        source: computed
        description: settled tier from lifetime_points thresholds
        constraints: one of {BRONZE, SILVER, GOLD}
      - name: current_trimester
        type: integer
        source: computed
        description: 0 if due_date null else 1/2/3 derived from due_date vs logical clock (see calculations.current_trimester)
        default: 0
      - name: store_credit_cents
        type: integer
        source: system
        description: non-cash credit balance accrued from refunds/returns
        default: 0

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: product title
      - name: category
        type: enum
        source: input
        description: merchandising category
        constraints: one of {MATERNITY, NURSING, POSTPARTUM, CAPSULE}
      - name: rentable
        type: boolean
        source: input
        description: whether maternity item may be rented
        default: false
      - name: buy_price_cents
        type: integer
        source: input
        description: retail purchase price in cents; also used as rental deposit
      - name: rental_weekly_cents
        type: integer
        source: input
        description: weekly rental rate in cents; 0 when not rentable
        default: 0
      - name: size_system
        type: string
        source: input
        description: sizing system label
        default: "US"
      - name: status
        type: enum
        source: input
        description: lifecycle; may be created DISCONTINUED to model an end-of-life SKU
        default: ACTIVE
        constraints: one of {ACTIVE, DISCONTINUED}

  - name: ProductVariant
    parent: Product
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: FK -> Product.id
      - name: size_label
        type: string
        source: input
        description: size code within the product's size_system (e.g., S, M, L)
      - name: trimester_fit
        type: array
        source: input
        description: integer trimesters this variant fits, subset of [1,2,3]
      - name: bump_room_cm
        type: number
        source: input
        description: bump allowance in centimetres for fit-guide matching
        default: 0
      - name: inventory_on_hand
        type: integer
        source: input
        description: buyable stock units
        default: 0
      - name: rental_units_total
        type: integer
        source: input
        description: physical units in the rental pool for this variant
        default: 0
      - name: reserved_rental_units
        type: integer
        source: system
        description: "units committed to RESERVED/ACTIVE/OVERDUE rentals; invariant: rental_units_total == (available units) + reserved_rental_units"
        default: 0
      - name: status
        type: enum
        source: computed
        description: mirrors parent Product.status (ACTIVE or DISCONTINUED)
        constraints: one of {ACTIVE, DISCONTINUED}

  - name: FitProfile
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id
      - name: bust_cm
        type: number
        source: input
        description: bust circumference
      - name: waist_cm
        type: number
        source: input
        description: natural waist circumference
      - name: hip_cm
        type: number
        source: input
        description: hip circumference
      - name: pre_pregnancy_size
        type: string
        source: input
        description: size worn before pregnancy
      - name: recommended_size
        type: string
        source: computed
        description: bump-friendly size recommendation from measurements + current_trimester (see calculations.fit_recommended_size)

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; must equal acting Shopper's X-User-ID
      - name: variant_id
        type: string
        source: input
        description: FK -> ProductVariant.id
      - name: order_type
        type: enum
        source: input
        description: purchase vs rental
        constraints: one of {BUY, RENTAL}
      - name: quantity
        type: integer
        source: input
        description: units purchased (BUY only); must be >= 1
        default: 1
      - name: rental_weeks
        type: integer
        source: input
        description: planned rental duration in weeks (RENTAL only); must be >= 1 for RENTAL
        default: 0
      - name: rental_start
        type: datetime
        source: input
        description: requested rental window start (RENTAL only)
        default: null
      - name: is_gift
        type: boolean
        source: input
        description: registry / gift order flag
        default: false
      - name: expected_variant_version
        type: integer
        source: input
        description: OCC guard; client's last-observed ProductVariant.version (see concurrency_rules.occ-order-variant-stock)
      - name: subtotal_cents
        type: integer
        source: computed
        description: pre-discount line value (see calculations.order_discount_pricing)
        default: 0
      - name: discount_cents
        type: integer
        source: computed
        description: loyalty + subscriber discount applied (see calculations.order_discount_pricing)
        default: 0
      - name: redeemed_points
        type: integer
        source: system
        description: loyalty points redeemed at pay (1 point = 1 cent); set by pay endpoint
        default: 0
      - name: redeemed_cents
        type: integer
        source: computed
        description: cents covered by redeemed points (see calculations.order_grand_total)
        default: 0
      - name: shipping_cents
        type: integer
        source: computed
        description: shipping fee keyed on discounted subtotal (see calculations.order_grand_total)
        default: 0
      - name: grand_total_cents
        type: integer
        source: computed
        description: amount charged at pay (see calculations.order_grand_total)
        default: 0
      - name: earned_points
        type: integer
        source: computed
        description: loyalty points granted at fulfillment (see calculations.order_discount_pricing note)
        default: 0
      - name: payment_status
        type: enum
        source: system
        description: payment dimension of the parallel state machine
        default: UNPAID
        constraints: one of {UNPAID, PAID, REFUNDED}
      - name: fulfillment_status
        type: enum
        source: system
        description: fulfillment dimension of the parallel state machine
        default: UNFULFILLED
        constraints: one of {UNFULFILLED, FULFILLED, CANCELLED}

  - name: Rental
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: FK -> Order.id; the RENTAL order that spawned this rental
      - name: variant_id
        type: string
        source: input
        description: FK -> ProductVariant.id
      - name: rental_start
        type: datetime
        source: system
        description: window start copied from the spawning order
      - name: rental_end
        type: datetime
        source: system
        description: rental_start + planned_weeks*7 days
      - name: planned_weeks
        type: integer
        source: system
        description: booked duration in weeks copied from the order
      - name: weekly_rate_cents
        type: integer
        source: system
        description: snapshot of variant.rental_weekly_cents at reservation
      - name: deposit_cents
        type: integer
        source: system
        description: snapshot of variant/product buy_price_cents; caps late fees
      - name: provisional_charge_cents
        type: integer
        source: computed
        description: forward-looking estimate at reservation (see calculations.rental_settlement variant=provisional)
        default: 0
      - name: final_charge_cents
        type: integer
        source: computed
        description: chronological settlement at return/convert/lost (see calculations.rental_settlement variant=final)
        default: 0
      - name: late_fee_cents
        type: integer
        source: computed
        description: late portion of the final settlement; capped at deposit_cents
        default: 0
      - name: returned_at
        type: datetime
        source: system
        description: logical-clock instant the unit was returned; null until RETURNED
        default: null
      - name: status
        type: enum
        source: system
        description: rental lifecycle
        default: RESERVED
        constraints: one of {RESERVED, ACTIVE, OVERDUE, RETURNED, CONVERTED_TO_BUY, CANCELLED, LOST}

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; must equal acting Shopper's X-User-ID
      - name: plan_tier
        type: enum
        source: input
        description: capsule plan tier
        constraints: one of {CAPSULE_BASIC, CAPSULE_PLUS}
      - name: monthly_fee_cents
        type: integer
        source: input
        description: recurring monthly fee in cents
      - name: items_per_capsule
        type: integer
        source: input
        description: number of variants shipped per capsule
        default: 3
      - name: next_ship_date
        type: datetime
        source: input
        description: scheduled date of the next capsule
      - name: capsules_shipped
        type: integer
        source: system
        description: count of capsules that have reached SHIPPED
        default: 0
      - name: status
        type: enum
        source: system
        description: subscription lifecycle (cyclic ACTIVE<->PAUSED)
        default: ACTIVE
        constraints: one of {ACTIVE, PAUSED, CANCELLED}

  - name: Capsule
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: FK -> Subscription.id
      - name: item_variant_ids
        type: array
        source: input
        description: variant ids packed in this capsule
      - name: ship_date
        type: datetime
        source: input
        description: intended ship / possession-start date
      - name: possession_end
        type: datetime
        source: computed
        description: ship_date + CAPSULE_LOAN_DAYS; end of the half-open possession window [ship_date, possession_end)
      - name: retail_value_cents
        type: integer
        source: computed
        description: keep-price retail value of packed items (see calculations.capsule_retail_value)
        default: 0
      - name: status
        type: enum
        source: system
        description: capsule lifecycle
        default: PACKED
        constraints: one of {PACKED, SHIPPED, VOIDED}

  - name: Return
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: FK -> Order.id; the COMPLETED order being returned
      - name: reason
        type: string
        source: input
        description: free-text reason
      - name: return_type
        type: enum
        source: input
        description: resolution requested
        constraints: one of {REFUND, STORE_CREDIT, EXCHANGE}
      - name: refund_cents
        type: integer
        source: computed
        description: cash/credit refunded on approval (see calculations.return_settlement)
        default: 0
      - name: restocking_fee_cents
        type: integer
        source: computed
        description: restocking fee withheld (see calculations.return_settlement)
        default: 0
      - name: status
        type: enum
        source: system
        description: return lifecycle (branching)
        default: REQUESTED
        constraints: one of {REQUESTED, APPROVED, REJECTED}

  - name: LoyaltyLedger
    parent: null
    common_fields: false
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id
      - name: points_delta
        type: integer
        source: system
        description: signed point change recorded by this entry
      - name: reason
        type: enum
        source: system
        description: what produced the entry
        constraints: one of {EARNED, REDEEMED, REVERSAL_REDEEM, CLAWBACK_EARNED, ADJUSTMENT}
      - name: balance_after
        type: integer
        source: system
        description: Customer.loyalty_points immediately after applying this entry
      - name: related_order_id
        type: string
        source: system
        description: id of the Order that produced this entry, or null for manual ADJUSTMENT (soft reference, not an ownership FK)
        default: null
# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  # ---- Order: PARALLEL dimensions (payment_status x fulfillment_status) ----
  - entity: Order
    initial_state: "UNPAID/UNFULFILLED"
    terminal_states: ["PAID/CANCELLED", "REFUNDED/CANCELLED", "PAID/FULFILLED_then_REFUNDED", "PAID/FULFILLED"]
    note: >
      Two independent dimensions evolve on one row. payment_status:
      UNPAID->PAID->REFUNDED. fulfillment_status: UNFULFILLED->FULFILLED, and
      UNFULFILLED->CANCELLED. An order is COMPLETED when payment_status==PAID
      AND fulfillment_status==FULFILLED. Transitions below name the dimension
      each affects via from/to on that dimension.
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /orders/{id}/pay"
        actor: Shopper
        preconditions:
          - "payment_status == UNPAID (else ERR_ORDER_NOT_PAYABLE)"
          - "fulfillment_status != CANCELLED"
          - "expected_customer_version matches Customer.version (else ERR_STALE_CUSTOMER_VERSION)"
          - "redeemed_points <= Customer.loyalty_points (else ERR_INSUFFICIENT_POINTS)"
          - "redeemed_points (as cents) <= floor(0.5 * subtotal_cents) (else ERR_REDEMPTION_EXCEEDS_LIMIT)"
          - "if any effective discount uses subscriber perk, Customer's Subscription.status == ACTIVE"
        side_effects:
          - "recompute discount_cents, redeemed_cents, shipping_cents, grand_total_cents (calculations.order_grand_total)"
          - "store earned_points = floor((subtotal_cents - discount_cents)/100) (computed now, GRANTED to balances only at fulfill)"
          - "set redeemed_points; append LoyaltyLedger REDEEMED entry with points_delta = -redeemed_points; Customer.loyalty_points -= redeemed_points"
          - "increments Customer.version by 1"
      - from: UNFULFILLED
        to: FULFILLED
        trigger: "POST /orders/{id}/fulfill"
        actor: FulfillmentAgent
        preconditions:
          - "payment_status == PAID (else ERR_ORDER_NOT_PAID)"
          - "fulfillment_status == UNFULFILLED"
        side_effects:
          - "for BUY: ProductVariant.inventory_on_hand -= quantity (permanent commit)"
          - "GRANT the stored earned_points: Customer.lifetime_points += earned_points; Customer.loyalty_points += earned_points; append LoyaltyLedger EARNED entry (points_delta = +earned_points)"
          - "recompute Customer.loyalty_tier from lifetime_points"
      - from: UNFULFILLED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Shopper
        preconditions:
          - "fulfillment_status == UNFULFILLED (else ERR_ORDER_ALREADY_FULFILLED)"
        side_effects:
          - "CASCADE hop1: for a RENTAL order, the linked Rental (Rental.order_id == this order, status RESERVED or ACTIVE) transitions to CANCELLED"
          - "if payment_status == PAID: set payment_status = REFUNDED; Customer.store_credit_cents += grand_total_cents"
          - "if redeemed_points > 0: Customer.loyalty_points += redeemed_points; append LoyaltyLedger REVERSAL_REDEEM entry (points_delta = +redeemed_points)"

  # ---- Rental: BRANCHING with divergent side effects + system transitions ----
  - entity: Rental
    initial_state: RESERVED
    terminal_states: [RETURNED, CONVERTED_TO_BUY, CANCELLED, LOST]
    transitions:
      - from: RESERVED
        to: ACTIVE
        trigger: "POST /rentals/{id}/activate"
        actor: FulfillmentAgent
        preconditions:
          - "rental.status == RESERVED (else ERR_RENTAL_NOT_ACTIVE)"
          - "ProductVariant.status == ACTIVE (cross-entity; else ERR_PRODUCT_DISCONTINUED)"
        side_effects:
          - "possession window [rental_start, rental_end] is now occupied by an ACTIVE unit"
      - from: RESERVED
        to: CANCELLED
        trigger: "system: Order cancel cascade (hop2)"
        actor: system
        preconditions:
          - "spawning Order.fulfillment_status transitioned to CANCELLED"
        side_effects:
          - "CASCADE hop3: ProductVariant.reserved_rental_units -= 1 (unit released back to available pool)"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system: Order cancel cascade (hop2)"
        actor: system
        preconditions:
          - "spawning Order.fulfillment_status transitioned to CANCELLED"
        side_effects:
          - "CASCADE hop3: ProductVariant.reserved_rental_units -= 1 (unit released back to available pool)"
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /rentals/{id}/return"
        actor: FulfillmentAgent
        preconditions:
          - "rental.status == ACTIVE or OVERDUE (else ERR_RENTAL_NOT_ACTIVE)"
        side_effects:
          - "set returned_at = clock now"
          - "compute final_charge_cents + late_fee_cents (calculations.rental_settlement variant=final)"
          - "ProductVariant.reserved_rental_units -= 1 (unit released after cleaning buffer)"
      - from: OVERDUE
        to: RETURNED
        trigger: "POST /rentals/{id}/return"
        actor: FulfillmentAgent
        preconditions:
          - "rental.status == OVERDUE"
        side_effects:
          - "set returned_at = clock now"
          - "compute final_charge_cents + late_fee_cents (late branch; late_fee capped at deposit_cents)"
          - "ProductVariant.reserved_rental_units -= 1"
      - from: ACTIVE
        to: CONVERTED_TO_BUY
        trigger: "POST /rentals/{id}/convert-to-buy"
        actor: Shopper
        preconditions:
          - "rental.status == ACTIVE (else ERR_RENTAL_NOT_ACTIVE)"
        side_effects:
          - "final_charge_cents = deposit_cents - min(provisional_charge_cents, deposit_cents) (rental credit applied to purchase)"
          - "ProductVariant.reserved_rental_units -= 1 AND ProductVariant.rental_units_total -= 1 (unit leaves the rental pool permanently as a sale)"
      - from: ACTIVE
        to: OVERDUE
        trigger: "system: POST /_clock/set_current_utc advances clock past rental_end"
        actor: system
        preconditions:
          - "rental.status == ACTIVE and clock now > rental_end"
        side_effects:
          - "no charge yet; unit still counts against reserved_rental_units"
      - from: OVERDUE
        to: LOST
        trigger: "system: POST /_clock/set_current_utc advances clock past rental_end + LOST_GRACE_DAYS"
        actor: system
        preconditions:
          - "rental.status == OVERDUE and clock now > rental_end + LOST_GRACE_DAYS days"
        side_effects:
          - "final_charge_cents = deposit_cents (full deposit forfeited); late_fee_cents = 0"
          - "ProductVariant.reserved_rental_units -= 1 AND ProductVariant.rental_units_total -= 1 (unit written off)"

  # ---- Subscription: CYCLIC (ACTIVE <-> PAUSED) ----
  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /subscriptions/{id}/pause"
        actor: Shopper
        preconditions:
          - "status == ACTIVE (else ERR_SUBSCRIPTION_NOT_ACTIVE)"
        side_effects:
          - "no new capsules may ship while PAUSED"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/resume"
        actor: Shopper
        preconditions:
          - "status == PAUSED (else ERR_SUBSCRIPTION_NOT_PAUSED)"
        side_effects:
          - "capsule shipping re-enabled"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Shopper
        preconditions:
          - "status in {ACTIVE, PAUSED} (else ERR_SUBSCRIPTION_TERMINAL)"
        side_effects:
          - "CASCADE: every Capsule of this subscription with status == PACKED transitions to VOIDED"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Shopper
        preconditions:
          - "status in {ACTIVE, PAUSED} (else ERR_SUBSCRIPTION_TERMINAL)"
        side_effects:
          - "CASCADE: every Capsule of this subscription with status == PACKED transitions to VOIDED"

  # ---- Capsule: guarded on parent Subscription state ----
  - entity: Capsule
    initial_state: PACKED
    terminal_states: [SHIPPED, VOIDED]
    transitions:
      - from: PACKED
        to: SHIPPED
        trigger: "POST /capsules/{id}/ship"
        actor: FulfillmentAgent
        preconditions:
          - "capsule.status == PACKED (else ERR_CAPSULE_NOT_PACKED)"
          - "parent Subscription.status == ACTIVE (cross-entity; else ERR_SUBSCRIPTION_NOT_ACTIVE)"
          - "no other Capsule of this subscription with status==SHIPPED has an overlapping possession window (else ERR_CAPSULE_WINDOW_OVERLAP)"
        side_effects:
          - "Subscription.capsules_shipped += 1"
      - from: PACKED
        to: VOIDED
        trigger: "system: Subscription cancel cascade"
        actor: system
        preconditions:
          - "parent Subscription transitioned to CANCELLED"
        side_effects:
          - "capsule removed from shipping queue"

  # ---- Return: BRANCHING (approve vs reject) ----
  - entity: Return
    initial_state: REQUESTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /returns/{id}/approve"
        actor: FulfillmentAgent
        preconditions:
          - "return.status == REQUESTED (else ERR_RETURN_NOT_REQUESTED)"
        side_effects:
          - "compute refund_cents + restocking_fee_cents (calculations.return_settlement)"
          - "CASCADE hop1: linked Order.payment_status = REFUNDED"
          - "CASCADE hop2: Customer clawback -> lifetime_points -= Order.earned_points; loyalty_points -= Order.earned_points (floored at 0); append LoyaltyLedger CLAWBACK_EARNED entry; recompute loyalty_tier; if STORE_CREDIT, Customer.store_credit_cents += refund_cents"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /returns/{id}/reject"
        actor: FulfillmentAgent
        preconditions:
          - "return.status == REQUESTED (else ERR_RETURN_NOT_REQUESTED)"
        side_effects:
          - "no financial change; Order unchanged"

# =====================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =====================================================================
concurrency_rules:
  - rule_id: occ-order-variant-stock
    parent_entity: ProductVariant
    write_endpoint: "POST /orders"
    occ_field: "expected_variant_version"
    description: |
      Creating an Order against a ProductVariant whose version has advanced
      since the client last observed it is rejected. A prior order has already
      consumed a buyable unit or committed a rental unit (legitimately
      superseding the client's stale view of remaining capacity), so the
      current writer's expected_variant_version is stale.
    error_id: ERR_STALE_VARIANT_VERSION
    http_status: 412
  - rule_id: occ-pay-loyalty-redeem
    parent_entity: Customer
    write_endpoint: "POST /orders/{id}/pay"
    occ_field: "expected_customer_version"
    description: |
      Paying an Order while redeeming loyalty points against a Customer whose
      version has advanced since the client last observed it is rejected.
      Another write (an earlier redemption, a cancel reversal, or an EARNED
      grant) has already moved loyalty_points, so the client's
      expected_customer_version no longer reflects the balance being spent.
    error_id: ERR_STALE_CUSTOMER_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: order_discount_pricing
    trigger: "POST /orders (initial estimate) and recomputed on POST /orders/{id}/pay"
    algorithm: tiered_pricing
    formula: |
      # MODE (a): >=3 inputs, non-linear interaction (tier selection + conditional perk + min cap)
      if order_type == BUY:
          subtotal_cents = variant.buy_price_cents * quantity
      else:  # RENTAL
          subtotal_cents = variant.rental_weekly_cents * rental_weeks   # == provisional rental charge
      base_rate = TIER_RATE[customer.loyalty_tier]           # settled tier (see loyalty_lifetime_valuation)
      perk_rate = SUBSCRIBER_PERK_RATE if customer has a Subscription with status == ACTIVE else 0.00
      effective_rate = min(MAX_DISCOUNT_RATE, base_rate + perk_rate)
      discount_cents = round_half_up(subtotal_cents * effective_rate)
      # earned_points (granted later at fulfill): floor((subtotal_cents - discount_cents) / 100)
    input_set: "the single ordered variant; subscriber perk keyed on the customer's Subscription.status == ACTIVE at the moment of computation"
    constants:
      TIER_RATE: { BRONZE: 0.00, SILVER: 0.05, GOLD: 0.10 }
      SUBSCRIBER_PERK_RATE: 0.05
      MAX_DISCOUNT_RATE: 0.20
    precision: "integer cents, round_half_up on the discount product"

  - name: order_grand_total
    trigger: "POST /orders/{id}/pay (redeemed_points known); estimate also produced at POST /orders with redeemed_points=0"
    algorithm: waterfall_allocation
    formula: |
      # MODE (c): circular-looking dependency; shipping sits inside grand_total yet is
      # keyed on the pre-shipping discounted subtotal. Evaluation order is PINNED:
      #   1. discount_cents            (from order_discount_pricing)
      #   2. redeemed_cents = min(redeemed_points, floor(0.5*subtotal_cents), customer.loyalty_points)   # 1 point = 1 cent
      #   3. net_after_discount = subtotal_cents - discount_cents
      #   4. shipping_cents = 0 if net_after_discount >= FREE_SHIP_THRESHOLD_CENTS else FLAT_SHIP_CENTS
      #   5. grand_total_cents = max(0, net_after_discount - redeemed_cents + shipping_cents)
    input_set: "single order; redeemed_points supplied at pay (0 at create-time estimate)"
    constants:
      FREE_SHIP_THRESHOLD_CENTS: 8000
      FLAT_SHIP_CENTS: 799
    precision: "integer cents; floor on the 0.5*subtotal redemption cap"

  - name: rental_settlement
    trigger: "provisional at reservation (POST /orders for RENTAL); final at POST /rentals/{id}/return, /convert-to-buy, or system LOST"
    algorithm: chronological
    formula: |
      # provisional and final DIVERGE for identical inputs (early return / late return).
      provisional_charge_cents = weekly_rate_cents * planned_weeks
      # --- final ---
      days_used = ceil((returned_at - rental_start) / 1 day)
      actual_weeks = max(1, ceil(days_used / DAYS_PER_WEEK))
      if returned_at <= rental_end:        # BOUNDARY: equality is NOT late
          final_charge_cents = weekly_rate_cents * min(actual_weeks, planned_weeks)
          late_fee_cents = 0
      else:
          late_days = ceil((returned_at - rental_end) / 1 day)
          late_fee_cents = min(late_days * LATE_FEE_PER_DAY_CENTS, deposit_cents)
          final_charge_cents = weekly_rate_cents * planned_weeks + late_fee_cents
    input_set: "one Rental; final branch chosen by returned_at vs rental_end (closed boundary at equality)"
    constants:
      LATE_FEE_PER_DAY_CENTS: 500
      DAYS_PER_WEEK: 7
      LOST_GRACE_DAYS: 14
    precision: "integer cents; ceil on day counts"
    variants:
      - name: provisional
        when: "at reservation (RENTAL order created)"
        difference: "forward-looking; weekly_rate * planned_weeks with no regard to actual return"
      - name: final
        when: "at return / convert / lost"
        difference: "chronological over actual possession; early return bills min(actual,planned) weeks, late return adds capped late_fee"

  - name: loyalty_lifetime_valuation
    trigger: "read on GET /customers/{id}; base_rate for order_discount_pricing uses the SETTLED variant"
    algorithm: threshold
    formula: |
      def tier(points):
          return GOLD if points >= 5000 else (SILVER if points >= 2000 else BRONZE)   # BOUNDARY >= 5000, >= 2000
      settled_tier = tier(lifetime_points)                        # lifetime_points = earned from COMPLETED orders + ADJUSTMENT
      pending = sum(order.earned_points for order in customer's orders
                    where payment_status == PAID and fulfillment_status == UNFULFILLED)
      provisional_tier = tier(lifetime_points + pending)
    input_set: "customer.lifetime_points plus, for the provisional variant, earned_points of PAID-but-UNFULFILLED orders only"
    constants:
      SILVER_THRESHOLD: 2000
      GOLD_THRESHOLD: 5000
    precision: "integer points; tier boundaries are inclusive (>=)"
    variants:
      - name: settled
        when: "pricing and the persisted loyalty_tier field"
        difference: "counts only points already earned from COMPLETED orders + manual adjustments"
      - name: provisional
        when: "forward-looking projection of tier if all in-flight PAID orders fulfill"
        difference: "adds earned_points of PAID+UNFULFILLED orders before applying thresholds"

  - name: rental_unit_availability
    trigger: "POST /orders for a RENTAL order (before reserving a unit)"
    algorithm: interval_merge
    formula: |
      # aggregate-capacity overlap on the rental pool; CLOSED intervals with a cleaning buffer
      # appended to each EXISTING occupation.
      occupied = count( Rental R : R.variant_id == V.id
                        and R.status in {RESERVED, ACTIVE, OVERDUE}
                        and overlaps_closed([R.rental_start, R.rental_end + CLEANING_BUFFER_DAYS days],
                                            [req_start, req_end]) )
      available_units = V.rental_units_total - occupied
      # reject when available_units <= 0 -> ERR_NO_RENTAL_UNITS
      # on success: V.reserved_rental_units += 1
    input_set: "all non-terminal rentals of variant V; buffer appended to the END of each existing window"
    constants:
      CLEANING_BUFFER_DAYS: 2
    precision: "integer unit count; intervals closed on both ends"

  - name: capsule_retail_value
    trigger: "POST /subscriptions/{id}/capsules (capsule packed)"
    algorithm: aggregation
    formula: |
      # MODE (b): rounding order PINNED to round-per-item-then-sum.
      retail_value_cents = sum over v in item_variant_ids of
                             round_half_up( variant(v).buy_price_cents * CAPSULE_KEEP_PCT )
      # NOT round_half_up( CAPSULE_KEEP_PCT * sum(buy_price_cents) ) -- the two differ by up to (N-1) cents.
      possession_end = ship_date + CAPSULE_LOAN_DAYS days
    input_set: "the variants listed in item_variant_ids"
    constants:
      CAPSULE_KEEP_PCT: 0.70
      CAPSULE_LOAN_DAYS: 30
    precision: "integer cents; round each item BEFORE summing"

  - name: fit_recommended_size
    trigger: "POST /fit-profiles (recommended_size computed)"
    algorithm: threshold
    formula: |
      base = XS if bust_cm < 86 else
             S  if bust_cm < 94 else        # BOUNDARY: bust_cm == 94 -> M (>= is the higher band)
             M  if bust_cm < 102 else
             L  if bust_cm < 110 else XL
      # maternity bump adjustment
      recommended_size = bump_up_one(base) if customer.current_trimester >= 2 else base
      # bump_up_one order: XS->S->M->L->XL->XL (XL is the ceiling)
    input_set: "fit profile measurements + the owning customer's current_trimester"
    constants:
      SIZE_ORDER: [XS, S, M, L, XL]
    precision: "banded; boundaries are lower-inclusive"

  - name: current_trimester
    trigger: "read on GET /customers/{id}; recomputed whenever the logical clock changes"
    algorithm: threshold
    formula: |
      if due_date is null: return 0
      weeks_to_due = (due_date - clock_now) / 7 days     # may be negative post-due
      gestational_weeks = 40 - weeks_to_due
      if gestational_weeks < 13: t = 1
      elif gestational_weeks < 27: t = 2                 # BOUNDARY at 13 and 27 weeks (lower-inclusive)
      else: t = 3
      return clamp(t, 1, 3)
    input_set: "customer.due_date vs logical clock (default 2026-07-01T00:00:00Z until set)"
    constants:
      FULL_TERM_WEEKS: 40
    precision: "integer trimester 1..3; boundaries lower-inclusive"

  - name: return_settlement
    trigger: "POST /returns/{id}/approve"
    algorithm: aggregation
    formula: |
      restocking_fee_cents = round_half_up(order.subtotal_cents * RESTOCK_RATE) if return_type == REFUND else 0
      refund_cents = max(0, order.grand_total_cents - restocking_fee_cents)
    input_set: "the linked COMPLETED order"
    constants:
      RESTOCK_RATE: 0.10
    precision: "integer cents, round_half_up"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "acting role is permitted for this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every resource named in the path exists, validated left-to-right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: all
  - priority: 4
    category: existence
    check: "ownership: an entity_backed Shopper's X-User-ID equals the customer_id of the resource being acted on"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "Shopper-owned writes (orders, subscriptions, fit-profiles, pay/cancel/convert/pause/resume/returns)"
  - priority: 5
    category: business_constraint
    check: "request body well-formed: required fields present, correct types, enum members valid, quantity>=1, rental_weeks>=1 for RENTAL"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST/PATCH"
  - priority: 6
    category: state
    check: "target resource is in a state that permits this transition (payment/fulfillment/rental/subscription/capsule/return preconditions)"
    error_id: "ERR_<STATE_SPECIFIC>"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_referential
    check: "referenced ProductVariant's parent Product.status == ACTIVE (not DISCONTINUED)"
    error_id: ERR_PRODUCT_DISCONTINUED
    http_status: 409
    applies_to: "POST /orders, POST /rentals/{id}/activate"
  - priority: 8
    category: business_temporal
    check: "RENTAL order rental_start present and Customer.due_date present; return requested within RETURN_WINDOW_DAYS of fulfillment; capsule possession window does not overlap an existing SHIPPED capsule"
    error_id: "ERR_DUE_DATE_REQUIRED | ERR_RETURN_WINDOW_EXPIRED | ERR_CAPSULE_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "POST /orders (RENTAL), POST /returns, POST /capsules/{id}/ship"
  - priority: 9
    category: business_constraint
    check: "capacity: BUY quantity <= inventory_on_hand; RENTAL availability (rental_unit_availability) > 0"
    error_id: "ERR_INSUFFICIENT_STOCK | ERR_NO_RENTAL_UNITS"
    http_status: 409
    applies_to: "POST /orders"
  - priority: 10
    category: business_fiscal
    check: "loyalty redemption: redeemed_points <= Customer.loyalty_points; redeemed cents <= floor(0.5*subtotal_cents)"
    error_id: "ERR_INSUFFICIENT_POINTS | ERR_REDEMPTION_EXCEEDS_LIMIT"
    http_status: 409
    applies_to: "POST /orders/{id}/pay"
  - priority: 11
    category: state
    check: "OCC: expected_variant_version / expected_customer_version equals the parent's current version"
    error_id: "ERR_STALE_VARIANT_VERSION | ERR_STALE_CUSTOMER_VERSION"
    http_status: 412
    applies_to: "POST /orders, POST /orders/{id}/pay"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Products / Variants ----
  - method: POST
    path: "/products"
    description: "create a product (may be created DISCONTINUED)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, category, buy_price_cents, "rentable?", "rental_weekly_cents?", "size_system?", "status?"]
    output: Product
    side_effects: []
  - method: GET
    path: "/products/{id}"
    description: "read a product"
    roles: [Shopper, FulfillmentAgent, PlatformAdmin, Guest]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: POST
    path: "/products/{id}/variants"
    description: "add a size variant to a product"
    roles: [PlatformAdmin]
    code: 201
    input: [size_label, trimester_fit, "bump_room_cm?", "inventory_on_hand?", "rental_units_total?"]
    output: ProductVariant
    side_effects: ["ProductVariant.status initialized from parent Product.status"]
  - method: GET
    path: "/products/{id}/variants"
    description: "list variants of a product (FK reverse-reachability for ProductVariant.product_id)"
    roles: [Shopper, FulfillmentAgent, PlatformAdmin, Guest]
    code: 200
    input: ["limit?", "offset?"]
    output: ProductVariant[]
    side_effects: []
  - method: GET
    path: "/variants/{id}"
    description: "read a single variant (exposes reserved_rental_units / version for observability)"
    roles: [Shopper, FulfillmentAgent, PlatformAdmin, Guest]
    code: 200
    input: []
    output: ProductVariant
    side_effects: []

  # ---- Customers / Fit / Loyalty ----
  - method: POST
    path: "/customers"
    description: "self-register a customer account"
    roles: [Guest]
    code: 201
    input: [email, full_name, "due_date?", "postpartum_flag?", "nursing_flag?"]
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers/{id}"
    description: "read a customer (loyalty_tier and current_trimester computed on read)"
    roles: [Shopper, FulfillmentAgent, PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/customers/{id}/loyalty-adjustments"
    description: "operator grant/deduct of loyalty points (business admin surface); appends an ADJUSTMENT ledger entry"
    roles: [PlatformAdmin]
    code: 201
    input: [points_delta, "note?"]
    output: LoyaltyLedger
    side_effects:
      - "Customer.loyalty_points += points_delta; if points_delta>0 Customer.lifetime_points += points_delta; recompute loyalty_tier"
      - "append LoyaltyLedger ADJUSTMENT entry (balance_after = new loyalty_points)"
  - method: GET
    path: "/customers/{id}/loyalty-ledger"
    description: "list a customer's ledger entries (FK reverse-reachability for LoyaltyLedger.customer_id)"
    roles: [Shopper, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: LoyaltyLedger[]
    side_effects: []
  - method: POST
    path: "/fit-profiles"
    description: "create a bump-friendly fit profile; computes recommended_size"
    roles: [Shopper]
    code: 201
    input: [customer_id, bust_cm, waist_cm, hip_cm, pre_pregnancy_size]
    output: FitProfile
    side_effects: ["recommended_size computed from measurements + customer.current_trimester"]
  - method: GET
    path: "/customers/{id}/fit-profiles"
    description: "list a customer's fit profiles (FK reverse-reachability for FitProfile.customer_id)"
    roles: [Shopper, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: FitProfile[]
    side_effects: []

  # ---- Orders ----
  - method: POST
    path: "/orders"
    description: "place a BUY or RENTAL order; reserves capacity under OCC on the variant"
    roles: [Shopper]
    code: 201
    input: [customer_id, variant_id, order_type, expected_variant_version, "quantity?", "rental_weeks?", "rental_start?", "is_gift?"]
    output: Order
    side_effects:
      - "compute subtotal_cents, discount_cents, shipping_cents, grand_total_cents estimate (redeemed_points=0)"
      - "BUY: verify quantity <= inventory_on_hand (stock not yet decremented until fulfill)"
      - "RENTAL: verify Customer.due_date present and rental_unit_availability>0; ProductVariant.reserved_rental_units += 1; create linked Rental (status RESERVED) with provisional_charge_cents"
      - "increments ProductVariant.version by 1"
  - method: GET
    path: "/orders/{id}"
    description: "read an order"
    roles: [Shopper, FulfillmentAgent, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "list orders filtered by customer or variant (FK reverse-reachability for Order.customer_id and Order.variant_id)"
    roles: [Shopper, FulfillmentAgent, PlatformAdmin]
    code: 200
    input: ["customer_id?", "variant_id?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/orders/{id}/pay"
    description: "pay an order, optionally redeeming loyalty points; OCC on Customer.version"
    roles: [Shopper]
    code: 200
    input: [expected_customer_version, "redeemed_points?"]
    output: Order
    side_effects:
      - "payment_status UNPAID->PAID; recompute grand_total_cents with redemption"
      - "Customer.loyalty_points -= redeemed_points; append LoyaltyLedger REDEEMED entry"
      - "increments Customer.version by 1"
  - method: POST
    path: "/orders/{id}/cancel"
    description: "cancel an unfulfilled order; cascades rental cancel + refunds + loyalty reversal"
    roles: [Shopper]
    code: 200
    input: []
    output: Order
    side_effects:
      - "fulfillment_status UNFULFILLED->CANCELLED"
      - "CASCADE: linked Rental->CANCELLED->ProductVariant.reserved_rental_units-=1"
      - "if PAID: payment_status->REFUNDED, store_credit += grand_total; reverse redeemed points (LoyaltyLedger REVERSAL_REDEEM)"
  - method: POST
    path: "/orders/{id}/fulfill"
    description: "fulfill a paid order; commits stock and grants loyalty points"
    roles: [FulfillmentAgent]
    code: 200
    input: []
    output: Order
    side_effects:
      - "fulfillment_status UNFULFILLED->FULFILLED"
      - "BUY: inventory_on_hand -= quantity"
      - "grant earned_points; Customer.lifetime_points/loyalty_points += earned_points; append LoyaltyLedger EARNED; recompute loyalty_tier"

  # ---- Rentals (created via RENTAL order; discoverable via reverse GET) ----
  - method: GET
    path: "/rentals/{id}"
    description: "read a rental"
    roles: [Shopper, FulfillmentAgent, PlatformAdmin]
    code: 200
    input: []
    output: Rental
    side_effects: []
  - method: GET
    path: "/rentals"
    description: "list rentals filtered by order or variant (FK reverse-reachability for Rental.order_id and Rental.variant_id)"
    roles: [Shopper, FulfillmentAgent, PlatformAdmin]
    code: 200
    input: ["order_id?", "variant_id?", "limit?", "offset?"]
    output: Rental[]
    side_effects: []
  - method: POST
    path: "/rentals/{id}/activate"
    description: "ship a reserved rental (RESERVED->ACTIVE)"
    roles: [FulfillmentAgent]
    code: 200
    input: []
    output: Rental
    side_effects: ["possession window opens"]
  - method: POST
    path: "/rentals/{id}/return"
    description: "return an active/overdue rental; computes final settlement + late fee"
    roles: [FulfillmentAgent]
    code: 200
    input: []
    output: Rental
    side_effects:
      - "status->RETURNED; returned_at set; final_charge_cents + late_fee_cents computed"
      - "ProductVariant.reserved_rental_units -= 1"
  - method: POST
    path: "/rentals/{id}/convert-to-buy"
    description: "convert an active rental into a purchase (ACTIVE->CONVERTED_TO_BUY)"
    roles: [Shopper]
    code: 200
    input: []
    output: Rental
    side_effects:
      - "final_charge_cents = deposit - min(provisional_charge, deposit)"
      - "ProductVariant.reserved_rental_units -= 1 AND rental_units_total -= 1"

  # ---- Subscriptions / Capsules ----
  - method: POST
    path: "/subscriptions"
    description: "start a capsule subscription"
    roles: [Shopper]
    code: 201
    input: [customer_id, plan_tier, monthly_fee_cents, next_ship_date, "items_per_capsule?"]
    output: Subscription
    side_effects: []
  - method: GET
    path: "/subscriptions/{id}"
    description: "read a subscription"
    roles: [Shopper, FulfillmentAgent, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/subscriptions"
    description: "list subscriptions filtered by customer (FK reverse-reachability for Subscription.customer_id)"
    roles: [Shopper, FulfillmentAgent, PlatformAdmin]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/subscriptions/{id}/pause"
    description: "pause an active subscription (ACTIVE->PAUSED)"
    roles: [Shopper]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: POST
    path: "/subscriptions/{id}/resume"
    description: "resume a paused subscription (PAUSED->ACTIVE)"
    roles: [Shopper]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: POST
    path: "/subscriptions/{id}/cancel"
    description: "cancel a subscription; cascades void of PACKED capsules"
    roles: [Shopper]
    code: 200
    input: []
    output: Subscription
    side_effects: ["CASCADE: all PACKED capsules -> VOIDED"]
  - method: POST
    path: "/subscriptions/{id}/capsules"
    description: "pack a capsule for a subscription (creates Capsule PACKED); computes retail_value + possession_end"
    roles: [FulfillmentAgent]
    code: 201
    input: [item_variant_ids, ship_date]
    output: Capsule
    side_effects: ["retail_value_cents computed (round-per-item-then-sum); possession_end = ship_date + CAPSULE_LOAN_DAYS"]
  - method: GET
    path: "/subscriptions/{id}/capsules"
    description: "list a subscription's capsules (FK reverse-reachability for Capsule.subscription_id)"
    roles: [Shopper, FulfillmentAgent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Capsule[]
    side_effects: []
  - method: POST
    path: "/capsules/{id}/ship"
    description: "ship a packed capsule (PACKED->SHIPPED); guarded on subscription ACTIVE and window non-overlap"
    roles: [FulfillmentAgent]
    code: 200
    input: []
    output: Capsule
    side_effects: ["Subscription.capsules_shipped += 1"]

  # ---- Returns ----
  - method: POST
    path: "/returns"
    description: "request a return/exchange on a completed order"
    roles: [Shopper]
    code: 201
    input: [order_id, reason, return_type]
    output: Return
    side_effects: []
  - method: GET
    path: "/returns/{id}"
    description: "read a return"
    roles: [Shopper, FulfillmentAgent, PlatformAdmin]
    code: 200
    input: []
    output: Return
    side_effects: []
  - method: GET
    path: "/returns"
    description: "list returns filtered by order (FK reverse-reachability for Return.order_id)"
    roles: [Shopper, FulfillmentAgent, PlatformAdmin]
    code: 200
    input: ["order_id?", "limit?", "offset?"]
    output: Return[]
    side_effects: []
  - method: POST
    path: "/returns/{id}/approve"
    description: "approve a return (REQUESTED->APPROVED); cascades refund + loyalty clawback"
    roles: [FulfillmentAgent]
    code: 200
    input: []
    output: Return
    side_effects:
      - "refund_cents + restocking_fee_cents computed"
      - "CASCADE: linked Order.payment_status->REFUNDED; Customer earned-points clawback; store_credit if STORE_CREDIT"
  - method: POST
    path: "/returns/{id}/reject"
    description: "reject a return (REQUESTED->REJECTED)"
    roles: [FulfillmentAgent]
    code: 200
    input: []
    output: Return
    side_effects: []

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock. Advancing past rental_end drives ACTIVE->OVERDUE; past rental_end+LOST_GRACE_DAYS drives OVERDUE->LOST."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "recompute current_trimester on read; ACTIVE rentals past rental_end -> OVERDUE; OVERDUE rentals past rental_end+LOST_GRACE_DAYS -> LOST (forfeit deposit, release+writeoff unit)"

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for endpoint, or Shopper acting on a resource it does not own"
  - id: ERR_VALIDATION
    http: 422
    condition: "malformed body: missing required field, bad type, invalid enum, quantity<1, rental_weeks<1 for RENTAL"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "customer id in path/body does not exist"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "product id does not exist"
  - id: ERR_VARIANT_NOT_FOUND
    http: 404
    condition: "variant id does not exist"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "order id does not exist"
  - id: ERR_RENTAL_NOT_FOUND
    http: 404
    condition: "rental id does not exist"
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "subscription id does not exist"
  - id: ERR_CAPSULE_NOT_FOUND
    http: 404
    condition: "capsule id does not exist"
  - id: ERR_RETURN_NOT_FOUND
    http: 404
    condition: "return id does not exist"
  - id: ERR_PRODUCT_DISCONTINUED
    http: 409
    condition: "ordering/activating against a variant whose parent Product.status == DISCONTINUED"
  - id: ERR_DUE_DATE_REQUIRED
    http: 409
    condition: "placing a RENTAL order while Customer.due_date is null, or rental_start missing"
  - id: ERR_INSUFFICIENT_STOCK
    http: 409
    condition: "BUY quantity exceeds ProductVariant.inventory_on_hand"
  - id: ERR_NO_RENTAL_UNITS
    http: 409
    condition: "no rental unit available for the requested window (availability <= 0)"
  - id: ERR_ORDER_NOT_PAYABLE
    http: 409
    condition: "pay attempted on an order whose payment_status != UNPAID"
  - id: ERR_ORDER_NOT_PAID
    http: 409
    condition: "fulfill attempted on an order whose payment_status != PAID"
  - id: ERR_ORDER_ALREADY_FULFILLED
    http: 409
    condition: "cancel attempted on an order whose fulfillment_status == FULFILLED"
  - id: ERR_ORDER_NOT_RETURNABLE
    http: 409
    condition: "return requested on an order that is not COMPLETED (PAID & FULFILLED)"
  - id: ERR_INSUFFICIENT_POINTS
    http: 409
    condition: "redeemed_points exceeds Customer.loyalty_points"
  - id: ERR_REDEMPTION_EXCEEDS_LIMIT
    http: 409
    condition: "redeemed cents exceeds floor(0.5 * subtotal_cents)"
  - id: ERR_RENTAL_NOT_ACTIVE
    http: 409
    condition: "activate/return/convert attempted from a rental state that forbids it"
  - id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http: 409
    condition: "pause or capsule ship attempted while subscription is not ACTIVE"
  - id: ERR_SUBSCRIPTION_NOT_PAUSED
    http: 409
    condition: "resume attempted while subscription is not PAUSED"
  - id: ERR_SUBSCRIPTION_TERMINAL
    http: 409
    condition: "pause/resume/cancel attempted on a CANCELLED subscription"
  - id: ERR_CAPSULE_NOT_PACKED
    http: 409
    condition: "ship attempted on a capsule whose status != PACKED"
  - id: ERR_CAPSULE_WINDOW_OVERLAP
    http: 409
    condition: "shipping a capsule whose possession window overlaps an existing SHIPPED capsule of the same subscription"
  - id: ERR_RETURN_WINDOW_EXPIRED
    http: 409
    condition: "return requested more than RETURN_WINDOW_DAYS (30) after fulfillment"
  - id: ERR_RETURN_NOT_REQUESTED
    http: 409
    condition: "approve/reject attempted on a return whose status != REQUESTED"
  - id: ERR_STALE_VARIANT_VERSION
    http: 412
    condition: "expected_variant_version != ProductVariant.version on POST /orders"
  - id: ERR_STALE_CUSTOMER_VERSION
    http: 412
    condition: "expected_customer_version != Customer.version on POST /orders/{id}/pay"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Shopper
    description: "a registered customer acting on their own account resources"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /orders"
      - "POST /orders/{id}/pay"
      - "POST /orders/{id}/cancel"
      - "POST /rentals/{id}/convert-to-buy"
      - "POST /fit-profiles"
      - "POST /subscriptions"
      - "POST /subscriptions/{id}/pause"
      - "POST /subscriptions/{id}/resume"
      - "POST /subscriptions/{id}/cancel"
      - "POST /returns"
    shared_operations:
      - "GET /orders, GET /orders/{id}, GET /rentals, GET /rentals/{id}"
      - "GET /subscriptions, GET /subscriptions/{id}, GET /subscriptions/{id}/capsules"
      - "GET /returns, GET /returns/{id}, GET /customers/{id}"
      - "GET /customers/{id}/fit-profiles, GET /customers/{id}/loyalty-ledger"
      - "GET /products/{id}, GET /products/{id}/variants"
  - name: FulfillmentAgent
    description: "operations staff running fulfillment, rentals, capsules, returns"
    identity: "opaque"
    exclusive_operations:
      - "POST /orders/{id}/fulfill"
      - "POST /rentals/{id}/activate"
      - "POST /rentals/{id}/return"
      - "POST /subscriptions/{id}/capsules"
      - "POST /capsules/{id}/ship"
      - "POST /returns/{id}/approve"
      - "POST /returns/{id}/reject"
    shared_operations:
      - "GET /orders, GET /orders/{id}, GET /rentals, GET /rentals/{id}"
      - "GET /subscriptions, GET /subscriptions/{id}, GET /subscriptions/{id}/capsules"
      - "GET /returns, GET /returns/{id}, GET /customers/{id}"
      - "GET /products/{id}, GET /products/{id}/variants"
  - name: PlatformAdmin
    description: "catalog + loyalty configuration and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /products"
      - "POST /products/{id}/variants"
      - "POST /customers/{id}/loyalty-adjustments"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /customers/{id}, GET /customers/{id}/loyalty-ledger, GET /customers/{id}/fit-profiles"
      - "GET /orders, GET /orders/{id}, GET /rentals, GET /rentals/{id}"
      - "GET /subscriptions, GET /subscriptions/{id}, GET /subscriptions/{id}/capsules"
      - "GET /returns, GET /returns/{id}, GET /products/{id}, GET /products/{id}/variants"
  - name: Guest
    description: "an unauthenticated prospect who may register and browse the catalog"
    identity: "opaque"
    exclusive_operations:
      - "POST /customers"
    shared_operations:
      - "GET /products/{id}, GET /products/{id}/variants"
