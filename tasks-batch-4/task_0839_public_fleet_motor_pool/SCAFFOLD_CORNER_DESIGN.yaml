scaffold_corner_design:
  # ===================================================================
  - section: entities
    instances:
      - name: create_vehicle_returns_201_defaults
        claim_type: Creation
        grounds: ["entities.Vehicle", "endpoints"]
        distinguishing_aspect: "POST /vehicles with all required fields returns 201 with server-minted id and defaults operational_status=IN_SERVICE, lifecycle_status=ACTIVE, assignment_type=POOL, odometer_miles=0, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vehicles"
              payload: { vin: "VIN-NEW-1", vehicle_class: "SUV", acquisition_cost_cents: 3000000, in_service_date: "2024-05-01T00:00:00Z" }
              as: FleetAdmin
              captures: { vid: $.data.id }
          assert:
            - "Vehicle.${vid}.operational_status == IN_SERVICE"
            - "Vehicle.${vid}.lifecycle_status == ACTIVE"
            - "Vehicle.${vid}.assignment_type == POOL"
            - "Vehicle.${vid}.odometer_miles == 0"
            - "Vehicle.${vid}.version == 1"
      - name: create_vehicle_missing_vin_returns_validation
        claim_type: Required Fields
        grounds: ["entities.Vehicle.fields.vin", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required vin on POST /vehicles returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vehicles"
              payload: { vehicle_class: "SUV", acquisition_cost_cents: 3000000, in_service_date: "2024-05-01T00:00:00Z" }
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"
      - name: get_vehicle_unknown_id_returns_not_found
        claim_type: Not Found
        grounds: ["entities.Vehicle", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /vehicles/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /vehicles/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"
      - name: list_vehicles_bad_limit_returns_pagination_invalid
        claim_type: Type Constraints
        grounds: ["errors[ERR_PAGINATION_INVALID]", "endpoints"]
        distinguishing_aspect: "GET /vehicles?limit=0 violates the [1,100] bound and returns ERR_PAGINATION_INVALID (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /vehicles?limit=0"
              payload: {}
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PAGINATION_INVALID"
      - name: duplicate_vin_returns_duplicate
        claim_type: Type Constraints
        grounds: ["entities.Vehicle.fields.vin", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Creating a second vehicle with an existing vin returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["One vehicle vin VIN-DUP already exists."]
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "VIN-DUP", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2024-01-01T00:00:00Z" }
              as: FleetAdmin
          trigger:
            - call: "POST /vehicles"
              payload: { vin: "VIN-DUP", vehicle_class: "VAN", acquisition_cost_cents: 2500000, in_service_date: "2024-02-01T00:00:00Z" }
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE"
      - name: fuel_log_advances_vehicle_odometer
        claim_type: Computed Fields
        grounds: ["entities.Vehicle.fields.odometer_miles", "entities.Vehicle.fields.lifetime_fuel_cents"]
        distinguishing_aspect: "POST /vehicles/{id}/fuel-logs with odometer_miles 1200 advances Vehicle.odometer_miles to 1200 and lifetime_fuel_cents by fuel_cost_cents 4500 (derived-field reconciliation)."
        test_recipe:
          setup: ["One vehicle at odometer 0."]
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "VIN-ODO", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2024-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { vid: $.data.id }
          trigger:
            - call: "POST /vehicles/${vid}/fuel-logs"
              payload: { reading_at: "2026-03-02T00:00:00Z", gallons: 12, fuel_cost_cents: 4500, odometer_miles: 1200, idle_minutes: 10 }
              as: ShopTech
          assert:
            - "Vehicle.${vid}.odometer_miles == 1200"
            - "Vehicle.${vid}.lifetime_fuel_cents == 4500"
  # ===================================================================
  - section: state_machines
    instances:
      - name: sell_disposal_not_in_bidding_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.DisposalRecord.BIDDING_to_SOLD", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /disposals/{id}/sell while the disposal is LISTED (open-bidding not yet called) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Flagged vehicle listed for disposal (status LISTED)."]
          setup_api_calls:
            - call: "POST /vehicle-class-policies"
              payload: { vehicle_class: "SEDAN", assignment_fee_cents_per_month: 30000, mileage_tier1_rate_cents: 50, mileage_tier2_rate_cents: 80, mileage_tier_boundary_miles: 1000, fuel_surcharge_multiplier: 1.1, idle_free_minutes: 60, idle_penalty_cents_per_min: 25, replacement_age_years: 10, replacement_mileage: 150000, replacement_maint_ratio: 0.6 }
              as: FleetAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /vehicles"
              payload: { vin: "VIN-DSP-1", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2010-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { vid: $.data.id }
            - call: "POST /vehicles/${vid}/fuel-logs"
              payload: { reading_at: "2026-06-01T06:00:00Z", gallons: 1, fuel_cost_cents: 0, odometer_miles: 150000 }
              as: ShopTech
            - call: "POST /vehicles/${vid}/replacement-evaluation"
              payload: {}
              as: FleetAdmin
            - call: "GET /vehicles/${vid}"
              payload: {}
              as: FleetAdmin
              captures: { vv: $.data.version }
            - call: "POST /vehicles/${vid}/disposals"
              payload: { reserve_price_cents: 100000, expected_vehicle_version: "${vv}" }
              as: FleetAdmin
              captures: { did: $.data.id }
          trigger:
            - call: "POST /disposals/${did}/sell"
              payload: { sale_price_cents: 200000, buyer_name: "Bidder" }
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
      - name: cancel_returned_reservation_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Reservation.CONFIRMED_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a RETURNED (terminal) reservation returns ERR_INVALID_STATE — no transition is defined from a terminal state."
        test_recipe:
          setup: ["A reservation driven all the way to RETURNED."]
          setup_api_calls:
            - call: "POST /vehicle-class-policies"
              payload: { vehicle_class: "SEDAN", assignment_fee_cents_per_month: 30000, mileage_tier1_rate_cents: 50, mileage_tier2_rate_cents: 80, mileage_tier_boundary_miles: 1000, fuel_surcharge_multiplier: 1.1, idle_free_minutes: 60, idle_penalty_cents_per_min: 25, replacement_age_years: 10, replacement_mileage: 150000, replacement_maint_ratio: 0.6 }
              as: FleetAdmin
            - call: "POST /departments"
              payload: { name: "DepT", cost_center_code: "CC-T1", monthly_budget_cents: 10000000 }
              as: FleetAdmin
              captures: { dep_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-RET-1", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2024-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { vid: $.data.id }
            - call: "POST /reservations"
              payload: { department_id: "${dep_id}", requested_start: "2026-06-05T09:00:00Z", requested_end: "2026-06-05T11:00:00Z", driver_name: "D", purpose: "x" }
              as: MotorPoolClerk
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: MotorPoolClerk
            - call: "POST /reservations/${res_id}/checkout"
              payload: { checkout_odometer: 0 }
              as: MotorPoolClerk
            - call: "POST /reservations/${res_id}/return"
              payload: { return_odometer: 100 }
              as: MotorPoolClerk
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: MotorPoolClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
      - name: workorder_awaiting_parts_resume_cycle
        claim_type: valid_transition
        grounds: ["state_machines.WorkOrder.IN_PROGRESS_to_AWAITING_PARTS", "state_machines.WorkOrder.AWAITING_PARTS_to_IN_PROGRESS"]
        distinguishing_aspect: "A work order can loop IN_PROGRESS -> AWAITING_PARTS (hold-parts) -> IN_PROGRESS (start) and then complete; the cyclic resume path works."
        test_recipe:
          setup: ["A started (IN_PROGRESS) work order."]
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "VIN-WOC-1", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2024-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { vid: $.data.id }
            - call: "POST /shop-bays"
              payload: { name: "Bay-WOC", bay_type: "GENERAL" }
              as: FleetAdmin
              captures: { bay_id: $.data.id }
            - call: "POST /work-orders"
              payload: { vehicle_id: "${vid}", bay_id: "${bay_id}", wo_type: "REPAIR", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z", labor_rate_cents: 100 }
              as: ShopTech
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: ShopTech
            - call: "POST /work-orders/${wo_id}/hold-parts"
              payload: {}
              as: ShopTech
          trigger:
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: ShopTech
              captures: { st: $.data.status }
          assert:
            - "WorkOrder.${wo_id}.status == IN_PROGRESS"
      - name: disposal_relist_no_sale_to_listed_cycle
        claim_type: valid_transition
        grounds: ["state_machines.DisposalRecord.BIDDING_to_NO_SALE", "state_machines.DisposalRecord.NO_SALE_to_LISTED"]
        distinguishing_aspect: "A NO_SALE disposal relists: open-bidding from NO_SALE returns it to bidding via LISTED, the cyclic relist path."
        test_recipe:
          setup: ["A disposal driven to NO_SALE."]
          setup_api_calls:
            - call: "POST /vehicle-class-policies"
              payload: { vehicle_class: "SEDAN", assignment_fee_cents_per_month: 30000, mileage_tier1_rate_cents: 50, mileage_tier2_rate_cents: 80, mileage_tier_boundary_miles: 1000, fuel_surcharge_multiplier: 1.1, idle_free_minutes: 60, idle_penalty_cents_per_min: 25, replacement_age_years: 10, replacement_mileage: 150000, replacement_maint_ratio: 0.6 }
              as: FleetAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /vehicles"
              payload: { vin: "VIN-RLS-1", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2010-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { vid: $.data.id }
            - call: "POST /vehicles/${vid}/fuel-logs"
              payload: { reading_at: "2026-06-01T06:00:00Z", gallons: 1, fuel_cost_cents: 0, odometer_miles: 150000 }
              as: ShopTech
            - call: "POST /vehicles/${vid}/replacement-evaluation"
              payload: {}
              as: FleetAdmin
            - call: "GET /vehicles/${vid}"
              payload: {}
              as: FleetAdmin
              captures: { vv: $.data.version }
            - call: "POST /vehicles/${vid}/disposals"
              payload: { reserve_price_cents: 100000, expected_vehicle_version: "${vv}" }
              as: FleetAdmin
              captures: { did: $.data.id }
            - call: "POST /disposals/${did}/open-bidding"
              payload: {}
              as: FleetAdmin
            - call: "POST /disposals/${did}/no-sale"
              payload: {}
              as: FleetAdmin
          trigger:
            - call: "POST /disposals/${did}/open-bidding"
              payload: {}
              as: FleetAdmin
              captures: { st: $.data.status }
          assert:
            - "DisposalRecord.${did}.status == BIDDING"
  # ===================================================================
  - section: validations
    instances:
      - name: checkout_below_vehicle_odometer_returns_rollback
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_ODOMETER_ROLLBACK]"]
        distinguishing_aspect: "checkout_odometer 500 below the assigned vehicle's odometer_miles 1000 returns ERR_ODOMETER_ROLLBACK (409)."
        test_recipe:
          setup: ["One POOL vehicle at odometer 1000; a CONFIRMED reservation on it."]
          setup_api_calls:
            - call: "POST /vehicle-class-policies"
              payload: { vehicle_class: "SEDAN", assignment_fee_cents_per_month: 30000, mileage_tier1_rate_cents: 50, mileage_tier2_rate_cents: 80, mileage_tier_boundary_miles: 1000, fuel_surcharge_multiplier: 1.1, idle_free_minutes: 60, idle_penalty_cents_per_min: 25, replacement_age_years: 10, replacement_mileage: 150000, replacement_maint_ratio: 0.6 }
              as: FleetAdmin
            - call: "POST /departments"
              payload: { name: "DepR", cost_center_code: "CC-R1", monthly_budget_cents: 10000000 }
              as: FleetAdmin
              captures: { dep_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-ORB-1", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2024-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { vid: $.data.id }
            - call: "POST /vehicles/${vid}/fuel-logs"
              payload: { reading_at: "2026-03-02T00:00:00Z", gallons: 10, fuel_cost_cents: 0, odometer_miles: 1000 }
              as: ShopTech
            - call: "POST /reservations"
              payload: { department_id: "${dep_id}", requested_start: "2026-06-05T09:00:00Z", requested_end: "2026-06-05T11:00:00Z", driver_name: "D", purpose: "x" }
              as: MotorPoolClerk
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: MotorPoolClerk
          trigger:
            - call: "POST /reservations/${res_id}/checkout"
              payload: { checkout_odometer: 500 }
              as: MotorPoolClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ODOMETER_ROLLBACK"
      - name: confirm_over_budget_returns_budget_exceeded
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_BUDGET_EXCEEDED]"]
        distinguishing_aspect: "With a POOL vehicle available but department budget 5000 < 4h hold 6000, confirm returns ERR_BUDGET_EXCEEDED (fiscal check reached because no higher-priority check fails)."
        test_recipe:
          setup: ["SEDAN policy; dept budget 5000; one available POOL vehicle; a 4h reservation (hold 6000)."]
          setup_api_calls:
            - call: "POST /vehicle-class-policies"
              payload: { vehicle_class: "SEDAN", assignment_fee_cents_per_month: 30000, mileage_tier1_rate_cents: 50, mileage_tier2_rate_cents: 80, mileage_tier_boundary_miles: 1000, fuel_surcharge_multiplier: 1.1, idle_free_minutes: 60, idle_penalty_cents_per_min: 25, replacement_age_years: 10, replacement_mileage: 150000, replacement_maint_ratio: 0.6 }
              as: FleetAdmin
            - call: "POST /departments"
              payload: { name: "DepB", cost_center_code: "CC-B1", monthly_budget_cents: 5000 }
              as: FleetAdmin
              captures: { dep_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-BUD-1", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2024-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { vid: $.data.id }
            - call: "POST /reservations"
              payload: { department_id: "${dep_id}", requested_start: "2026-06-05T09:00:00Z", requested_end: "2026-06-05T13:00:00Z", driver_name: "D", purpose: "x" }
              as: MotorPoolClerk
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: MotorPoolClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_BUDGET_EXCEEDED"
      - name: sell_below_reserve_returns_below_reserve
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_BELOW_RESERVE]"]
        distinguishing_aspect: "A sale price 90000 below reserve_price_cents 100000 on a BIDDING disposal returns ERR_BELOW_RESERVE."
        test_recipe:
          setup: ["A disposal in BIDDING with reserve 100000."]
          setup_api_calls:
            - call: "POST /vehicle-class-policies"
              payload: { vehicle_class: "SEDAN", assignment_fee_cents_per_month: 30000, mileage_tier1_rate_cents: 50, mileage_tier2_rate_cents: 80, mileage_tier_boundary_miles: 1000, fuel_surcharge_multiplier: 1.1, idle_free_minutes: 60, idle_penalty_cents_per_min: 25, replacement_age_years: 10, replacement_mileage: 150000, replacement_maint_ratio: 0.6 }
              as: FleetAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /vehicles"
              payload: { vin: "VIN-BR-1", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2010-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { vid: $.data.id }
            - call: "POST /vehicles/${vid}/fuel-logs"
              payload: { reading_at: "2026-06-01T06:00:00Z", gallons: 1, fuel_cost_cents: 0, odometer_miles: 150000 }
              as: ShopTech
            - call: "POST /vehicles/${vid}/replacement-evaluation"
              payload: {}
              as: FleetAdmin
            - call: "GET /vehicles/${vid}"
              payload: {}
              as: FleetAdmin
              captures: { vv: $.data.version }
            - call: "POST /vehicles/${vid}/disposals"
              payload: { reserve_price_cents: 100000, expected_vehicle_version: "${vv}" }
              as: FleetAdmin
              captures: { did: $.data.id }
            - call: "POST /disposals/${did}/open-bidding"
              payload: {}
              as: FleetAdmin
          trigger:
            - call: "POST /disposals/${did}/sell"
              payload: { sale_price_cents: 90000, buyer_name: "Low" }
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_BELOW_RESERVE"
      - name: subrogate_at_fault_claim_returns_subrogation_invalid
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_SUBROGATION_INVALID]", "state_machines.AccidentClaim.UNDER_INVESTIGATION_to_SUBROGATION_PENDING"]
        distinguishing_aspect: "Subrogating an at_fault==true claim returns ERR_SUBROGATION_INVALID (subrogation requires at_fault false and liability > 0)."
        test_recipe:
          setup: ["Vehicle; at_fault claim moved to UNDER_INVESTIGATION."]
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "VIN-SUB-1", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2024-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { vid: $.data.id }
            - call: "POST /accident-claims"
              payload: { vehicle_id: "${vid}", reported_at: "2026-03-05T00:00:00Z", at_fault: true, estimated_damage_cents: 100000 }
              as: FinanceOfficer
              captures: { ac_id: $.data.id }
            - call: "POST /accident-claims/${ac_id}/investigate"
              payload: {}
              as: FinanceOfficer
          trigger:
            - call: "POST /accident-claims/${ac_id}/subrogate"
              payload: {}
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SUBROGATION_INVALID"
      - name: assign_department_without_id_returns_assignment_invalid
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_ASSIGNMENT_INVALID]"]
        distinguishing_aspect: "PATCH /vehicles/{id}/assignment with assignment_type=DEPARTMENT_ASSIGNED but no assigned_department_id returns ERR_ASSIGNMENT_INVALID."
        test_recipe:
          setup: ["One POOL vehicle."]
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "VIN-ASG-1", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2024-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { vid: $.data.id }
          trigger:
            - call: "PATCH /vehicles/${vid}/assignment"
              payload: { assignment_type: "DEPARTMENT_ASSIGNED" }
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ASSIGNMENT_INVALID"
      - name: disposal_blocked_by_open_accident
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_DISPOSAL_BLOCKED]", "entities.Vehicle.fields.open_accident_count"]
        distinguishing_aspect: "Listing a FLAGGED_FOR_REPLACEMENT vehicle that also has open_accident_count>0 returns ERR_DISPOSAL_BLOCKED (safety before OCC/fiscal)."
        test_recipe:
          setup: ["Flagged vehicle (score>=70) with one open non-at-fault accident claim (operational stays IN_SERVICE)."]
          setup_api_calls:
            - call: "POST /vehicle-class-policies"
              payload: { vehicle_class: "SEDAN", assignment_fee_cents_per_month: 30000, mileage_tier1_rate_cents: 50, mileage_tier2_rate_cents: 80, mileage_tier_boundary_miles: 1000, fuel_surcharge_multiplier: 1.1, idle_free_minutes: 60, idle_penalty_cents_per_min: 25, replacement_age_years: 10, replacement_mileage: 150000, replacement_maint_ratio: 0.6 }
              as: FleetAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /vehicles"
              payload: { vin: "VIN-DB-1", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2010-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { vid: $.data.id }
            - call: "POST /vehicles/${vid}/fuel-logs"
              payload: { reading_at: "2026-06-01T06:00:00Z", gallons: 1, fuel_cost_cents: 0, odometer_miles: 150000 }
              as: ShopTech
            - call: "POST /vehicles/${vid}/replacement-evaluation"
              payload: {}
              as: FleetAdmin
            - call: "POST /accident-claims"
              payload: { vehicle_id: "${vid}", reported_at: "2026-05-05T00:00:00Z", at_fault: false, estimated_damage_cents: 10000, third_party_liable_pct: 0.5 }
              as: FinanceOfficer
            - call: "GET /vehicles/${vid}"
              payload: {}
              as: FleetAdmin
              captures: { vv: $.data.version }
          trigger:
            - call: "POST /vehicles/${vid}/disposals"
              payload: { reserve_price_cents: 100000, expected_vehicle_version: "${vv}" }
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DISPOSAL_BLOCKED"
  # ===================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_vehicle_version_on_disposal_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[disposal-create-stale-vehicle]", "errors[ERR_STALE_VEHICLE_VERSION]"]
        distinguishing_aspect: "POST /vehicles/{id}/disposals with expected_vehicle_version one behind the current version returns ERR_STALE_VEHICLE_VERSION (412)."
        test_recipe:
          setup: ["Flagged vehicle; client holds a stale version (current-1)."]
          setup_api_calls:
            - call: "POST /vehicle-class-policies"
              payload: { vehicle_class: "SEDAN", assignment_fee_cents_per_month: 30000, mileage_tier1_rate_cents: 50, mileage_tier2_rate_cents: 80, mileage_tier_boundary_miles: 1000, fuel_surcharge_multiplier: 1.1, idle_free_minutes: 60, idle_penalty_cents_per_min: 25, replacement_age_years: 10, replacement_mileage: 150000, replacement_maint_ratio: 0.6 }
              as: FleetAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /vehicles"
              payload: { vin: "VIN-OCC-1", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2010-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { vid: $.data.id }
            - call: "POST /vehicles/${vid}/fuel-logs"
              payload: { reading_at: "2026-06-01T06:00:00Z", gallons: 1, fuel_cost_cents: 0, odometer_miles: 150000 }
              as: ShopTech
            - call: "POST /vehicles/${vid}/replacement-evaluation"
              payload: {}
              as: FleetAdmin
            - call: "GET /vehicles/${vid}"
              payload: {}
              as: FleetAdmin
              captures: { vv: $.data.version }
          trigger:
            - call: "POST /vehicles/${vid}/disposals"
              payload: { reserve_price_cents: 100000, expected_vehicle_version: "${vv} - 1" }
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VEHICLE_VERSION"
      - name: stale_department_version_on_invoice_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[chargeback-create-stale-department]", "errors[ERR_STALE_DEPARTMENT_VERSION]"]
        distinguishing_aspect: "POST /departments/{id}/chargeback-invoices with expected_department_version behind the current version returns ERR_STALE_DEPARTMENT_VERSION (412)."
        test_recipe:
          setup: ["A fresh department (version 1); client submits expected_department_version 0."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "DepOCC", cost_center_code: "CC-OCC", monthly_budget_cents: 10000000 }
              as: FleetAdmin
              captures: { dep_id: $.data.id }
            - call: "GET /departments/${dep_id}"
              payload: {}
              as: FinanceOfficer
              captures: { dv: $.data.version }
          trigger:
            - call: "POST /departments/${dep_id}/chargeback-invoices"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", basis: "FINAL", expected_department_version: "${dv} - 1" }
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_DEPARTMENT_VERSION"
      - name: disposal_sell_credits_department_billed_ytd
        claim_type: cascading_side_effects
        grounds: ["state_machines.DisposalRecord.BIDDING_to_SOLD", "calculations.disposal_net_proceeds", "entities.Department.fields.billed_ytd_cents"]
        distinguishing_aspect: "Selling an assigned vehicle for 1000000 (tier 0.08 -> commission 80000, net 920000) disposes the vehicle and credits the department: billed_ytd_cents -= 920000 -> -920000."
        test_recipe:
          setup: ["Department; DEPARTMENT_ASSIGNED SEDAN vehicle flagged and in BIDDING disposal, reserve 100000."]
          setup_api_calls:
            - call: "POST /vehicle-class-policies"
              payload: { vehicle_class: "SEDAN", assignment_fee_cents_per_month: 30000, mileage_tier1_rate_cents: 50, mileage_tier2_rate_cents: 80, mileage_tier_boundary_miles: 1000, fuel_surcharge_multiplier: 1.1, idle_free_minutes: 60, idle_penalty_cents_per_min: 25, replacement_age_years: 10, replacement_mileage: 150000, replacement_maint_ratio: 0.6 }
              as: FleetAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /departments"
              payload: { name: "DepD", cost_center_code: "CC-D1", monthly_budget_cents: 10000000 }
              as: FleetAdmin
              captures: { dep_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-SELL-1", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2010-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { vid: $.data.id }
            - call: "PATCH /vehicles/${vid}/assignment"
              payload: { assignment_type: "DEPARTMENT_ASSIGNED", assigned_department_id: "${dep_id}" }
              as: FleetAdmin
            - call: "POST /vehicles/${vid}/fuel-logs"
              payload: { reading_at: "2026-06-01T06:00:00Z", gallons: 1, fuel_cost_cents: 0, odometer_miles: 150000 }
              as: ShopTech
            - call: "POST /vehicles/${vid}/replacement-evaluation"
              payload: {}
              as: FleetAdmin
            - call: "GET /vehicles/${vid}"
              payload: {}
              as: FleetAdmin
              captures: { vv: $.data.version }
            - call: "POST /vehicles/${vid}/disposals"
              payload: { reserve_price_cents: 100000, expected_vehicle_version: "${vv}" }
              as: FleetAdmin
              captures: { did: $.data.id }
            - call: "POST /disposals/${did}/open-bidding"
              payload: {}
              as: FleetAdmin
          trigger:
            - call: "POST /disposals/${did}/sell"
              payload: { sale_price_cents: 1000000, buyer_name: "Winner" }
              as: FleetAdmin
              captures: { net: $.data.net_proceeds_cents }
          assert:
            - "DisposalRecord.${did}.commission_cents == 80000"
            - "DisposalRecord.${did}.net_proceeds_cents == 920000"
            - "Vehicle.${vid}.lifecycle_status == DISPOSED"
            - "Department.${dep_id}.billed_ytd_cents == -920000"
      - name: work_order_on_disposed_vehicle_returns_vehicle_disposed
        claim_type: cascading_side_effects
        grounds: ["entities.Vehicle.fields.lifecycle_status", "errors[ERR_VEHICLE_DISPOSED]", "validations[priority=6]"]
        distinguishing_aspect: "After a vehicle is DISPOSED, POST /work-orders on it returns ERR_VEHICLE_DISPOSED."
        test_recipe:
          setup: ["A vehicle driven to DISPOSED via full disposal chain; one bay."]
          setup_api_calls:
            - call: "POST /vehicle-class-policies"
              payload: { vehicle_class: "SEDAN", assignment_fee_cents_per_month: 30000, mileage_tier1_rate_cents: 50, mileage_tier2_rate_cents: 80, mileage_tier_boundary_miles: 1000, fuel_surcharge_multiplier: 1.1, idle_free_minutes: 60, idle_penalty_cents_per_min: 25, replacement_age_years: 10, replacement_mileage: 150000, replacement_maint_ratio: 0.6 }
              as: FleetAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /vehicles"
              payload: { vin: "VIN-DIS-1", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2010-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { vid: $.data.id }
            - call: "POST /vehicles/${vid}/fuel-logs"
              payload: { reading_at: "2026-06-01T06:00:00Z", gallons: 1, fuel_cost_cents: 0, odometer_miles: 150000 }
              as: ShopTech
            - call: "POST /vehicles/${vid}/replacement-evaluation"
              payload: {}
              as: FleetAdmin
            - call: "GET /vehicles/${vid}"
              payload: {}
              as: FleetAdmin
              captures: { vv: $.data.version }
            - call: "POST /vehicles/${vid}/disposals"
              payload: { reserve_price_cents: 100000, expected_vehicle_version: "${vv}" }
              as: FleetAdmin
              captures: { did: $.data.id }
            - call: "POST /disposals/${did}/open-bidding"
              payload: {}
              as: FleetAdmin
            - call: "POST /disposals/${did}/sell"
              payload: { sale_price_cents: 200000, buyer_name: "W" }
              as: FleetAdmin
            - call: "POST /shop-bays"
              payload: { name: "Bay-DIS", bay_type: "GENERAL" }
              as: FleetAdmin
              captures: { bay_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { vehicle_id: "${vid}", bay_id: "${bay_id}", wo_type: "REPAIR", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T11:00:00Z", labor_rate_cents: 100 }
              as: ShopTech
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VEHICLE_DISPOSED"
  # ===================================================================
  - section: rbac
    instances:
      - name: motorpoolclerk_cannot_create_vehicle_returns_unauthorized
        claim_type: role_denied
        grounds: ["roles.MotorPoolClerk", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "MotorPoolClerk POSTing /vehicles (a FleetAdmin-exclusive op) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vehicles"
              payload: { vin: "VIN-RB-1", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2024-01-01T00:00:00Z" }
              as: MotorPoolClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED"
      - name: missing_role_header_returns_unauthenticated
        claim_type: unauthenticated
        grounds: ["roles.FleetAdmin", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no known X-User-Role returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /vehicles/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED"
      - name: department_user_cannot_dispute_other_department_invoice
        claim_type: role_denied
        grounds: ["roles.DepartmentUser", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A DepartmentUser (X-User-ID == D1) disputing D2's ISSUED invoice returns ERR_UNAUTHORIZED (entity-backed ownership: acting user must own the invoiced department)."
        test_recipe:
          setup: ["Two departments D1, D2; an ISSUED invoice for D2."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "D1", cost_center_code: "CC-XA", monthly_budget_cents: 10000000 }
              as: FleetAdmin
              captures: { d1: $.data.id }
            - call: "POST /departments"
              payload: { name: "D2", cost_center_code: "CC-XB", monthly_budget_cents: 10000000 }
              as: FleetAdmin
              captures: { d2: $.data.id }
            - call: "GET /departments/${d2}"
              payload: {}
              as: FinanceOfficer
              captures: { d2v: $.data.version }
            - call: "POST /departments/${d2}/chargeback-invoices"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", basis: "FINAL", expected_department_version: "${d2v}" }
              as: FinanceOfficer
              captures: { inv_id: $.data.id }
            - call: "POST /chargeback-invoices/${inv_id}/issue"
              payload: {}
              as: FinanceOfficer
          trigger:
            - call: "POST /chargeback-invoices/${inv_id}/dispute"
              payload: { disputed_reason: "not ours" }
              as: DepartmentUser
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED"
  # ===================================================================
  - section: endpoints
    instances:
      - name: list_reservations_returns_envelope_pagination
        claim_type: Listing
        grounds: ["endpoints", "entities.Reservation"]
        distinguishing_aspect: "GET /reservations returns response_type array with pagination fields total_count and has_more; filtering by department_id returns only that department's reservations."
        test_recipe:
          setup: ["One department with one REQUESTED reservation."]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "DepL", cost_center_code: "CC-L1", monthly_budget_cents: 10000000 }
              as: FleetAdmin
              captures: { dep_id: $.data.id }
            - call: "POST /reservations"
              payload: { department_id: "${dep_id}", requested_start: "2026-06-05T09:00:00Z", requested_end: "2026-06-05T11:00:00Z", driver_name: "D", purpose: "x" }
              as: MotorPoolClerk
              captures: { res_id: $.data.id }
          trigger:
            - call: "GET /reservations?department_id=${dep_id}"
              payload: {}
              as: MotorPoolClerk
          assert:
            - "response_type == array"
            - "meta.total_count == 1 and meta.has_more == false"
            - "data length == 1 and data[0].id == ${res_id}"
  # ===================================================================
  - section: errors
    instances:
      - name: error_invalid_state_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_reconfirm
          rationale: "ERR_INVALID_STATE is asserted as the winning error of the state-vs-fiscal §1.8 instance."
      - name: error_no_vehicle_available_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_VEHICLE_AVAILABLE]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / empty_pool_no_vehicle_available
          rationale: "ERR_NO_VEHICLE_AVAILABLE is asserted by the empty-pool boundary §1.8 instance."
      - name: error_bay_closed_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_BAY_CLOSED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / workorder_start_depends_on_bay_available
          rationale: "ERR_BAY_CLOSED is asserted by the WorkOrder->ShopBay §1.8 instance."
      - name: error_bay_time_conflict_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_BAY_TIME_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / bay_workorder_closed_interval_buffer_conflict
          rationale: "ERR_BAY_TIME_CONFLICT is asserted by the ShopBay buffer-overlap §1.8 instance."
      - name: error_open_accident_blocks_wo_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPEN_ACCIDENT_BLOCKS_WO]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_beats_temporal_on_pm_workorder
          rationale: "ERR_OPEN_ACCIDENT_BLOCKS_WO is asserted by the safety-vs-temporal §1.8 instance."
