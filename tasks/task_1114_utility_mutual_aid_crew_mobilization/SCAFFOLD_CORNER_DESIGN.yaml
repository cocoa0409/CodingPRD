          - "roles[CrewSupervisor]"
          - "errors[ERR_FORBIDDEN_FOR_ROLE]"
        distinguishing_aspect: "CrewSupervisor calling the HostCoordinator-exclusive certify is denied at priority 2 — before any existence check on the timesheet id."
        test_recipe:
          setup: ["empty DB (role check precedes existence, so a fabricated timesheet id suffices)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mutual-aid/timesheets/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/certify", payload: { certifier_operator_ref: "X" }, as: CrewSupervisor, as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE (http 403, NOT 404)"

      - name: rbac_responding_role_cannot_approve_invoice
