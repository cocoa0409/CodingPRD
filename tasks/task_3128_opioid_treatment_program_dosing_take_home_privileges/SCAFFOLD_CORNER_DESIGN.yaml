        distinguishing_aspect: "The computed read recomputes from live dossier state: 100.0 less 12.0 for one OPEN CRITICAL finding less 6.0 for one OPEN MAJOR finding less 10.0 for one open diversion case lands at 72.0 and NEEDS_ATTENTION, and correcting the critical finding lifts it to 84.0."
