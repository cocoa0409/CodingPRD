              as: PolicyAdmin
              captures: { adv_b: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_b}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_a}", headline: "Advertiser A offer", body_text: "A creative that belongs to advertiser A and only to advertiser A.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/one", display_url: "https://www.beaconlending.example/one" }
              as: Advertiser
              as_user_id: "${adv_a}"
