          - state_machines.VoluntaryDisclosureAgreement.DRAFTED_to_LAPSED
          - calculations.taxpayer_escalation_tier_resolution
        distinguishing_aspect: |
          The same close call drives TWO disjoint chains from one root: the pre-clearance chain
          reaches four hops deep (request EXPIRED -> nonparticipant_flag -> escalation_tier T1 ->
          score 75) while the agreement chain reaches two (DRAFTED -> LAPSED -> DRAFT return
          VOIDED); the second taxpayer, who only held the lapsed agreement, must NOT be flagged,
          which distinguishes per-chain scoping from a blanket "flag everyone at close" shortcut.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with one SALES_USE term"
            - "Taxpayer Willow Ridge sits behind a pre-clearance that reached TERMS_OFFERED and had its identity disclosed but was never accepted"
            - "Taxpayer Pinnacle Grain holds a DRAFTED agreement carrying one DRAFT return; nothing was executed"
