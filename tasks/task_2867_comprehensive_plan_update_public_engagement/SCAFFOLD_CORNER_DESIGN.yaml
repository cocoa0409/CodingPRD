          assert:
            - "the setup reaches status == \"STATE_CERTIFIED\" with compliance_posture == \"CLEAR\", land_capacity_units == 11700, capacity_variant == \"GROSS_CAPACITY\", housing_shortfall_total == 0 and equity_share_pct == 40.0"
            - "the preferred alternative is the low-impact one: net_impact_score 49.00 versus 59.50, so the selector returns the Transit-Focused Growth alternative with status == \"PREFERRED\""
            - "complete on action A while it is still PENDING returns HTTP 409 error_id == \"ERR_ACTION_NOT_SCHEDULED\" - readings are legal in PENDING but completion is not"
            - "the reading of 76 against a DECREASE target of 80 sets on_track == true, reading_count == 1 and latest_reading_at == \"2026-09-15T00:00:00.000Z\"; the reading of 95 on action C sets on_track == false"
            - "scheduling a COUNCIL hearing while the plan is only STATE_CERTIFIED returns HTTP 409 error_id == \"ERR_COMMISSION_RECOMMENDATION_REQUIRED\" and creates no row"
            - "the COMMISSION hearing opens at the exact clock instant equal to scheduled_start with status == \"OPEN\" and opened_at == \"2026-09-25T18:00:00.000Z\""
            - "RECOMMEND closes the first commission hearing as status == \"RECOMMENDED\" with outcome == \"RECOMMEND\", and the plan advances to \"COMMISSION_RECOMMENDED\""
            - "the second COMMISSION hearing (10-05, notice published exactly 10 days earlier) is accepted and opens OPEN; ADOPT on it returns HTTP 409 error_id == \"ERR_OUTCOME_NOT_VALID_FOR_BODY\" and leaves it OPEN - the plan is already COMMISSION_RECOMMENDED, so the priority-50 state check passes and the priority-74 body check is the one that fires"
            - "ADOPT on the COUNCIL hearing returns status == \"ADOPTED_OUT\" with outcome == \"ADOPT\""
            - "the adoption cascade fires: PlanUpdate.status == \"ADOPTED\", adopted_at == \"2026-10-19T18:00:00.000Z\", required_elements_complete_count == 5, and every one of the five elements reads status == \"ADOPTED\""
            - "all three implementation actions moved PENDING -> SCHEDULED with due_at == \"2027-10-19T18:00:00.000Z\" (adopted_at + IMPLEMENTATION_DUE_DAYS == 365 days)"
            - "action A completes with status == \"COMPLETED\"; a second complete returns HTTP 409 error_id == \"ERR_ACTION_ALREADY_COMPLETED\""
            - "action B (SCHEDULED, reading_count 0) returns HTTP 409 error_id == \"ERR_NO_INDICATOR_READING\" while action C (SCHEDULED, on_track false) returns HTTP 409 error_id == \"ERR_INDICATOR_OFF_TRACK\" - three distinct guards on the same endpoint"
            - "creating another inventory dataset on the adopted plan returns HTTP 409 error_id == \"ERR_PLAN_ALREADY_ADOPTED\" - the terminal state locks the whole aggregate, not just the plan row"
            - "the plan's hearing list returns total_count == 3 - two COMMISSION rows and one COUNCIL row; the refused premature COUNCIL hearing was never persisted"

  # ===========================================================================
  # Section 3 - Calculations (section 1.3 of the scaffold)
  # ===========================================================================
  - section: calculations
    instances:
      - name: trend_scenario_capacity_and_demand_correct_result
        claim_type: correct_result
        grounds:
          - calculations.land_capacity_units
          - calculations.projected_demand_units
          - endpoints.POST_/planning/growth-scenarios
        distinguishing_aspect: |
          One TREND scenario over the reference LAND_USE inventory pins the whole arithmetic chain to
          literal integers: GROSS_CAPACITY == (400 + 250) * 18 == 11700 with the 60 constrained acres
          and MARKET_FACTOR deliberately unused, and projected demand == round_half_up((20000 *
          1.012^20 - 20000 + 500) * 1.05) == 6183, where the compound term is kept at full precision
          and rounded exactly once. The employment pressure (12000 / 1.45 == 8275.86 households) is
          larger than the household growth yet must be ignored under TREND, and capacity_gap_units is
          floored at 0 rather than going negative.
        test_recipe:
          setup:
            - "One plan (base_year 2025, horizon_year 2045) and one CERTIFIED LAND_USE inventory with 400 vacant / 250 underutilized / 60 infrastructure-constrained acres at 18 units per acre."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "LAND_USE", vintage_year: 2025, record_count: 1800, vacant_acres: 400, underutilized_acres: 250, infrastructure_constrained_acres: 60, allowed_density_units_per_acre: 18 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { inv_lu: $.data.id }
            - call: "POST /planning/inventory-datasets/${inv_lu}/certify"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { lu_v: $.data.version }
          trigger:
            - call: "POST /planning/growth-scenarios"
              payload: { plan_update_id: "${pu}", land_use_inventory_id: "${inv_lu}", expected_inventory_version: "${lu_v}", label: "Trend continuation", method: "TREND", horizon_year: 2045, base_households: 20000, annual_household_growth_rate: 0.012, job_growth_total: 12000, demolition_replacement_units: 500 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { sc: $.data.id, cap: $.data.land_capacity_units, var: $.data.capacity_variant, dem: $.data.projected_demand_units, gap: $.data.capacity_gap_units }
            - call: "GET /planning/growth-scenarios/${sc}"
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { cap2: $.data.land_capacity_units, dem2: $.data.projected_demand_units, st: $.data.status }
          assert:
            - "land_capacity_units == 11700 and capacity_variant == \"GROSS_CAPACITY\" (TREND ignores infrastructure_constrained_acres, UNDERUTILIZED_REALIZATION_FACTOR and MARKET_FACTOR)"
            - "projected_demand_units == 6183 - the compound growth term 20000 * 1.012^20 - 20000 == 5388.67 is NOT rounded before the vacancy allowance is applied"
            - "capacity_gap_units == 0 - max(6183 - 11700, 0) is floored at zero, never negative"
            - "the scenario is created in status \"DRAFT\" and the GET returns the identical stored integers (the calculation runs once at creation, not per read)"

      - name: standard_weighting_ignores_interpreter_and_the_group_list_is_closed
        claim_type: constants_applied
        grounds:
          - calculations.participation_record_weight
          - constants.UNDERREPRESENTED_GROUPS
          - constants.BASE_WEIGHT
          - constants.OUTREACH_INTERPRETER_WEIGHT
        distinguishing_aspect: |
          Two constants are provably scoped rather than global: OUTREACH_INTERPRETER_WEIGHT (2.0) is
          NOT applied on a WORKSHOP even when interpreter_used is true, so all five records weigh
          BASE_WEIGHT 1.0; and UNDERREPRESENTED_GROUPS is a closed five-member list, so RENTER,
          DISABILITY and LIMITED_ENGLISH are underrepresented while SENIOR and GENERAL are not - a
          SENIOR respondent using an interpreter contributes nothing to the underrepresented weight.
        test_recipe:
          setup:
            - "One plan, one venue and one SCHEDULED WORKSHOP (weighting_variant STANDARD)."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/venues"
              payload: { name: "Eastside Community Room", seated_capacity: 120, turnover_buffer_minutes: 0, ada_accessible: true, transit_served: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { venue: $.data.id }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", venue_id: "${venue}", activity_type: "WORKSHOP", title: "Eastside Workshop", start_at: "2026-07-10T18:00:00.000Z", end_at: "2026-07-10T20:00:00.000Z", interpretation_offered: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { act: $.data.id, wv: $.data.weighting_variant }
          trigger:
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act}", respondent_ref: "R-001", demographic_group: "RENTER", census_tract: "060014001", interpreter_used: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { w1: $.data.weight, u1: $.data.is_underrepresented }
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act}", respondent_ref: "R-002", demographic_group: "DISABILITY", census_tract: "060014001" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { w2: $.data.weight, u2: $.data.is_underrepresented }
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act}", respondent_ref: "R-003", demographic_group: "LIMITED_ENGLISH", census_tract: "060014002", interpreter_used: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { w3: $.data.weight, u3: $.data.is_underrepresented }
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act}", respondent_ref: "R-004", demographic_group: "SENIOR", census_tract: "060014002", interpreter_used: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { w4: $.data.weight, u4: $.data.is_underrepresented }
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act}", respondent_ref: "R-005", demographic_group: "GENERAL", census_tract: "060014003" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { w5: $.data.weight, u5: $.data.is_underrepresented }
            - call: "POST /planning/engagement-activities/${act}/complete"
              payload: {}
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { rc: $.data.record_count, urc: $.data.underrepresented_record_count, tw: $.data.total_weighted_count, uw: $.data.underrepresented_weighted_count, eq: $.data.equity_share_pct }
          assert:
            - "the activity reports weighting_variant == \"STANDARD\" because activity_type == WORKSHOP"
            - "all five records carry weight == 1.0 - interpreter_used true on R-001, R-003 and R-004 does NOT double the weight under STANDARD"
            - "is_underrepresented is true for RENTER, DISABILITY and LIMITED_ENGLISH and false for SENIOR and GENERAL"
            - "after completion: record_count == 5, underrepresented_record_count == 3, total_weighted_count == 5.0, underrepresented_weighted_count == 3.0"
            - "equity_share_pct == 60.0 (100 * 3.0 / 5.0 at one decimal place)"

      - name: plan_equity_counts_only_completed_activities
        claim_type: input_set_filtering
        grounds:
          - calculations.plan_equity_share_pct
        distinguishing_aspect: |
          The plan-level roll-up filters on activity status, not on existence of records: a SCHEDULED
          workshop that has already collected five GENERAL respondents contributes nothing, so the
          plan's share stays at the 40.0 produced by the single COMPLETED workshop instead of being
          diluted to 20.0. The window is not time-bounded either - the COMPLETED activity is in the
          past and the SCHEDULED one is in the future, yet only status decides.
        test_recipe:
          setup:
            - "One plan and one venue; the clock stays at the startup default 2026-08-01T00:00:00Z."
            - "Workshop A ran 2026-07-10 (already past) and carries five records of which two are underrepresented; Workshop B is scheduled for 2026-09-10 and carries five GENERAL records."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
