          - errors.ERR_NETWORK_MISMATCH
          - endpoints[POST /retrans/stations/{id}/affiliation-agreements]
        distinguishing_aspect: "The affiliation's network_name must equal the parent station's network_affiliation, and an INDEPENDENT station can hold no affiliation at all, so both an NBC paper on a CBS station and any paper on an INDEPENDENT station are refused with 422."
