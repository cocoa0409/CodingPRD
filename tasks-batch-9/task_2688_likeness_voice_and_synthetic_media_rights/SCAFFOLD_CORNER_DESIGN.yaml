        claim_type: immediate
        grounds: [complexity_profile.consistency_model, endpoints.POST_usage_licenses, calculations.license_total_cost]
        distinguishing_aspect: >-
          The scaffold declares immediate consistency, so the single most fan-out-heavy write —
          license issuance, which prices the final royalty, posts a ledger row, bumps the replica's
          open license count and both money counters — must be fully settled by the time it answers.
          Every read that follows happens with no clock advance and no second write, so any value that
          only becomes correct later is a lag bug rather than an arithmetic bug.
        test_recipe:
          setup:
            - "CA profile; non-union talent, ACTIVE grant with default shares 0.75/0.20/0.05, initial fee 300000, per-use base 150000"
            - "Approved replica and one APPROVED performance at projected_impressions 500000 in ADVERTISING/US, so its PER_USE_PROVISIONAL is 150000 * 1.00 * 1.50 * 1.00 = 225000"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 3650, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /consent-grants"
              payload: { talent_id: "${t_id}", grantor_kind: "TALENT", permitted_media_types: ["ADVERTISING"], permitted_use_notes: "Ads", territory_codes: ["US"], exclusivity: "NON_EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", initial_creation_fee_cents: 300000, per_use_base_fee_cents: 150000, expected_talent_version: "${t_v}" }
              as: RightsAdministrator
              captures: { g_id: $.data.id }
            - call: "POST /consent-grants/${g_id}/countersign"
              payload: {}
              as: TalentRepresentative
              as_user_id: "${t_id}"
            - call: "POST /biometric-assets"
              payload: { talent_id: "${t_id}", consent_grant_id: "${g_id}", asset_kind: "VOICE_SAMPLE", capture_ref: "cap-001", storage_class: "ENCRYPTED_VAULT", payload_digest: "sha256:aaa" }
              as: RightsAdministrator
              captures: { a1_id: $.data.id }
            - call: "POST /digital-replicas"
              payload: { talent_id: "${t_id}", consent_grant_id: "${g_id}", replica_kind: "VOICE_CLONE", source_asset_ids: ["${a1_id}"], build_ref: "build-001" }
              as: RightsAdministrator
              captures: { r_id: $.data.id }
            - call: "POST /digital-replicas/${r_id}/approve-for-use"
              payload: { approval_note: "cleared" }
              as: TalentRepresentative
              as_user_id: "${t_id}"
              captures: { r_v: $.data.version }
            - call: "POST /generated-performances"
              payload: { digital_replica_id: "${r_id}", licensee_name: "Northlight", media_type: "ADVERTISING", territory_codes: ["US"], intended_use_description: "Spot", projected_impressions: 500000, scheduled_first_use_at: "2026-09-01T00:00:00Z" }
              as: LicenseeProducer
              as_user_id: "lic-001"
              captures: { p_id: $.data.id }
            - call: "POST /generated-performances/${p_id}/review"
              payload: { decision: "APPROVE", review_note: "ok" }
              as: TalentRepresentative
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /usage-licenses"
              payload: { generated_performance_id: "${p_id}", channel: "ADVERTISING", territory_codes: ["US"], distribution_start: "2026-08-01T00:00:00Z", distribution_end: "2026-12-01T00:00:00Z", actual_impressions: 500000, expected_replica_version: "${r_v}" }
              as: LicenseeProducer
              as_user_id: "lic-001"
              captures: { l_id: $.data.id }
            - call: "GET /digital-replicas/${r_id}"
              payload: {}
              as: LicenseeProducer
              as_user_id: "lic-001"
            - call: "GET /consent-grants/${g_id}"
              payload: {}
              as: RightsAdministrator
            - call: "GET /talents/${t_id}"
              payload: {}
              as: RightsAdministrator
            - call: "GET /compensation-entries?consent_grant_id=${g_id}"
              payload: {}
              as: RightsAdministrator
          assert:
            - "trigger call 1's OWN response already carries per_use_final_cents 225000, disclosure_required true, compliance_surcharge_cents 3938 (ceil of 225000 * 0.0175 = 3937.5) and license_total_cents 228938 — no follow-up read is needed to see the priced license"
            - "trigger call 2 shows open_license_count 1 and version r_v + 1 immediately, with status still \"APPROVED_FOR_USE\""
            - "trigger call 3 shows total_compensation_cents 750000 = INITIAL_CREATION 300000 + PER_USE_PROVISIONAL 225000 + PER_USE_FINAL 225000; the 3938 surcharge is absent because it is a billing item and never a royalty"
            - "trigger call 4 shows lifetime_compensation_cents 750000, matching the grant total exactly since this talent has one grant"
            - "trigger call 5 returns 3 entries whose amount_cents sum to 750000, the PER_USE_FINAL row splitting 168750 / 45000 / 11250 with remainder 0"
            - "no clock advance and no sweep occur anywhere in this recipe: every value above is visible in the same request that caused it"

      - name: a_refused_multi_row_write_leaves_no_partial_trace
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, validations.priority_82, endpoints.POST_usage_licenses]
        distinguishing_aspect: >-
          The contrapositive of immediate consistency, and the corner an implementation that writes
          side effects before running its last validation fails: a license issuance refused by the
          overlap cap — the LAST rung the write passes through — must leave the replica's counter, both
          money counters, the ledger and every version exactly as the successful third issuance found
          them. Nothing may be half-applied and reconciled later.
        test_recipe:
          setup:
            - "CA profile; talent, ACTIVE grant, approved replica and THREE APPROVED performances"
            - "Two licenses already issued over overlapping windows, hitting MAX_OVERLAPPING_LICENSES (2)"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 3650, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id, t_v: $.data.version }
