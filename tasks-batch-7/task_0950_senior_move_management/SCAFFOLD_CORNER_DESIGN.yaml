        distinguishing_aspect: "TRAVEL_BAND1_MAX_MILES is the inclusive top of band 1, so 40 miles bills 25 band-1 miles at 317 for 7925 and nothing in band 2, and the projected total is 7925 plus the 476 coordination fee, that is 8401."
        test_recipe:
