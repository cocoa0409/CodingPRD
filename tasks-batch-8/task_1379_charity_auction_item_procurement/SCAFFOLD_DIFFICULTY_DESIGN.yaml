  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: solicitation_revision_cycle
        grounds:
          - state_machines.Solicitation.SENT_to_REVISED
          - entities.Solicitation.fields.last_sent_at
        distinguishing_aspect: |
          Solicitation has a genuine cycle SENT -> REVISED -> SENT: each loop
          re-arms last_sent_at (2026-08-01, then 2026-08-20 after the clock move)
          while the terminal path SENT -> PLEDGED remains reachable after the loop.
        test_recipe:
          setup:
            - "Event in SOLICITING; donor dn; solicitation so created in DRAFT"
          setup_api_calls:
            - { call: "POST /gala-events", payload: { name: "Gala G", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev: "$.data.id" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /donors", payload: { full_name: "Donor R", email: "dr@x.org", donor_type: "INDIVIDUAL" }, as: ProcurementOfficer, captures: { dn: "$.data.id" } }
            - { call: "POST /solicitations", payload: { donor_id: "${dn}", gala_event_id: "${ev}", ask_description: "Weekend cabin", ask_estimate_cents: 80000 }, as: ProcurementOfficer, captures: { so: "$.data.id" } }
          trigger:
            - { call: "POST /solicitations/${so}/send", payload: {}, as: ProcurementOfficer, captures: { st1: "$.data.status", sent1: "$.data.last_sent_at" } }
            - { call: "POST /solicitations/${so}/revise", payload: { ask_description: "Weekend cabin + dinner", ask_estimate_cents: 95000 }, as: ProcurementOfficer, captures: { st2: "$.data.status" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: GalaAdmin }
            - { call: "POST /solicitations/${so}/send", payload: {}, as: ProcurementOfficer, captures: { st3: "$.data.status", sent2: "$.data.last_sent_at" } }
            - { call: "POST /solicitations/${so}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer, captures: { st4: "$.data.status" } }
          assert:
            - "status after first send == SENT and last_sent_at == 2026-08-01T00:00:00Z (default clock)"
            - "status after revise == REVISED (cycle back)"
            - "status after second send == SENT and last_sent_at == 2026-08-20T00:00:00Z (re-armed)"
            - "status after record-response == PLEDGED (loop exits to forward path)"

      - name: invoice_parallel_payment_fulfillment_dimensions
        grounds:
          - state_machines.Invoice.payment_status
          - state_machines.Invoice.fulfillment_status
        distinguishing_aspect: |
          Invoice carries two independent state dimensions on one row: partial
          payment moves payment_status UNPAID->PARTIALLY_PAID while fulfillment stays
          PENDING; full payment moves payment_status->PAID and fulfillment->READY;
          certificate redemption moves only fulfillment READY->FULFILLED while
          payment_status stays PAID.
        test_recipe:
          setup:
            - "Event closed with an EXPERIENCE bundle (FMV 40000) sold for 50000 to bidder br; invoice inv exists (UNPAID/PENDING); certificate exists PENDING_ISSUE"
          setup_api_calls:
