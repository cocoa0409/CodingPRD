    side_effects: ["composite_score_bps computed", "membership review counters updated", "REBUKE cascades to response and ledger", "quality recompute may change standing"]
  - method: GET
    path: "/econsult/quality-reviews"
    description: "List quality reviews with filters (reverse reachability for both FKs)"
    roles: [ProgramCoordinator, ReferringProvider, Specialist, QualityReviewer, BillingClerk]
    code: 200
    input: ["response_id?", "reviewer_specialist_id?", "limit?", "offset?"]
    output: "QualityReview[]"
    side_effects: []
  - method: GET
    path: "/econsult/quality-reviews/{id}"
    description: "Get a quality review"
    roles: [ProgramCoordinator, ReferringProvider, Specialist, QualityReviewer, BillingClerk]
    code: 200
