            - "a plant configured with monthly_lead_emission_permit_g 254.99 instead refuses the FIRST call with ERR_EMISSION_BUDGET_EXCEEDED (ratio 1.0000 vs 1.0000 hinges on one hundredth of a gram)"

      - name: blood_lead_index_exactly_100_removes_but_99_67_does_not
        grounds:
          - calculations.worker_exposure_index
          - state_machines.Worker.removal_status
          - endpoints[POST /workers/{id}/exposure-samples]
          - calculations.plant_compliance_posture
        distinguishing_aspect: |
          A different metric (the blood-lead exposure index) on a different endpoint
          (POST /workers/{id}/exposure-samples): 30.0 ug/dL is exactly the limit, so the
          index is exactly REMOVAL_INDEX_THRESHOLD 100.00 and the worker IS removed,
          while 29.9 ug/dL - one tenth below - rounds to 99.67 and the worker keeps
          working. The rounding is also load-bearing: 29.9/30*100 = 99.6666... must
          round_half_up to 99.67, not truncate to 99.66.
        test_recipe:
          setup:
            - "Plant with two PRODUCTION workers and one SAFETY worker to record samples."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plants"
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: ["LEAD_ACID", "LITHIUM_LFP"], permit_status: "ACTIVE", monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Sam Safety", job_class: "SAFETY", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { saf_a_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Pat Paster", job_class: "PRODUCTION", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { wp_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Quinn Caster", job_class: "PRODUCTION", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { wq_id: $.data.id }
          trigger:
            - call: "POST /workers/${wp_id}/exposure-samples"
              payload: { sample_type: "BLOOD", sampled_at: "2026-08-31T09:00:00Z", blood_lead_ug_per_dl: 30.0 }
              as: SafetyOfficer
              as_user_id: "${saf_a_id}"
              captures: { p_index: $.data.resulting_worker_index, p_variant: $.data.resulting_variant, p_removed: $.data.triggered_removal }
            - call: "POST /workers/${wq_id}/exposure-samples"
              payload: { sample_type: "BLOOD", sampled_at: "2026-08-31T09:00:00Z", blood_lead_ug_per_dl: 29.9 }
              as: SafetyOfficer
              as_user_id: "${saf_a_id}"
              captures: { q_index: $.data.resulting_worker_index, q_removed: $.data.triggered_removal }
          assert:
            - "${p_index} == 100.00 and ${p_variant} == BLOOD_PEAK_180D and ${p_removed} == true   # 30.0 / 30 * 100, and >= 100.00 removes"
            - "Worker.${wp_id}.removal_status == MEDICAL_REMOVAL and Worker.${wp_id}.removal_count == 1"
            - "${q_index} == 99.67 and ${q_removed} == false   # 29.9 / 30 * 100 = 99.6666... rounds HALF UP to 99.67, still below the threshold"
            - "Worker.${wq_id}.removal_status == ACTIVE"
            - "Plant.${plant_id}.open_medical_removal_count == 1 and Plant.${plant_id}.compliance_posture == RESTRICTED (one removal, not two)"
            - "both ExposureSample rows exist and are retained - the append-only log keeps the sub-threshold sample"

      - name: capacity_pass_threshold_is_the_rounded_value_not_the_exact_one
        grounds:
          - calculations.capacity_test_result
          - calculations.lot_capacity_yield
          - endpoints[POST /capacity-tests/{id}/record-result]
        distinguishing_aspect: |
          A third metric (measured capacity against the acceptance threshold) on a third
          endpoint. The threshold is rounded BEFORE the comparison: 465.0 * 0.95 = 441.75
          becomes 441.8 at 1 dp, and readings are themselves constrained to 1 dp, so the
          only two values that can straddle the limit are 441.8 (PASS, equality) and
          441.7 (FAIL). An implementation that compares against the unrounded 441.75
          also fails 441.7 but would PASS nothing at 441.75, and one that rounds DOWN to
          441.7 would wrongly pass the FAIL reading - the pair pins both the rounding
          direction and the inclusive >=. The lot's acceptance number is 2, so the FAIL
          does not quarantine and the boundary stays observable.
        test_recipe:
          setup:
            - "Lot of quantity 100 (sampling plan 10 / 2, so a single FAIL is tolerated), two CERTIFIED assemblies, one chamber, one CAPACITY test each, clock past both windows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plants"
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: ["LEAD_ACID", "LITHIUM_LFP"], permit_status: "ACTIVE", monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Ada Engineer", job_class: "ENGINEER", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
