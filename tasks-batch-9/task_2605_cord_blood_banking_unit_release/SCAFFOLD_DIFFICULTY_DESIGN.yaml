              captures: { unit_f5_id: "$.data[0].id" }
            - call: "POST /cbb/collections/${col_f1_id}/receive"
              payload: { transport_temp_c: 20.0 }
              as: ProcessingTechnologist
            - call: "GET /cbb/collections/${col_f1_id}/units"
              payload: {}
              as: ProcessingTechnologist
              captures: { unit_f1_id: "$.data[0].id" }
            - call: "POST /cbb/processing-runs"
