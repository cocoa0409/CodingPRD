  # ===================================================================
  # Rule 6 — boundary_precision_check (2 instances, different metrics/endpoints)
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: escalate_at_exact_window_rejected_plus_one_hour_accepted
        grounds:
          - calculations.referral_aging
          - validations[priority=14]
          - state_machines.Referral.ROUTED_to_ESCALATED
        distinguishing_aspect: |
          Metric: elapsed hours vs auto_accept_window (strict >). Routed at
          T0, clock set to T0+72h with window 72: escalate rejected
          ERR_NOT_AGING; at T0+73h the same call succeeds — boundary sits on
          the escalate endpoint.
