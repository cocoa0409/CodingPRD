            - { call: "POST /vendor-office/reps/${rep_id}/approve-credential", payload: { credential_expires_at: "2026-08-10T00:00:00Z", or_access_level: "OBSERVER" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/or-rooms", payload: { room_name: "OR-1", turnover_buffer_minutes: 30 }, as: ORScheduler, captures: { room_id: $.data.id } }
            - { call: "POST /vendor-office/sterilizer-units", payload: { unit_name: "ST-1", slot_capacity: 2, cycle_minutes: 60, cooldown_minutes: 30 }, as: SterileProcessingTech, captures: { st_id: $.data.id } }
            - { call: "POST /vendor-office/cases", payload: { case_number: "C-1001", or_room_id: "${room_id}", procedure_type: "TOTAL_KNEE", surgeon_name: "Dr. A", scheduled_start_at: "2026-08-05T09:00:00Z", scheduled_end_at: "2026-08-05T12:00:00Z" }, as: ORScheduler, captures: { case_id: $.data.id } }
            - { call: "POST /vendor-office/requests", payload: { case_id: "${case_id}", vendor_id: "${v_id}", priority_class: "STANDARD" }, as: ORScheduler, captures: { rq_id: $.data.id } }
            - { call: "POST /vendor-office/requests/${rq_id}/trays", payload: { tray_code: "TK-1", declared_instrument_count: 10, replacement_value_cents: 50000 }, as: ORScheduler, captures: { t1_id: $.data.id } }
            - { call: "POST /vendor-office/requests/${rq_id}/trays", payload: { tray_code: "TK-2", declared_instrument_count: 10, replacement_value_cents: 50000 }, as: ORScheduler, captures: { t2_id: $.data.id } }
