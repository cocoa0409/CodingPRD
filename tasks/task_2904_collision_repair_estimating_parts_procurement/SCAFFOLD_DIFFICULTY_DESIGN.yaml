            - "PartsLine.${pl_id}.procurement_status is still PRICE_LOCKED and RepairOrder.${ro_id}.parts_ordered_gross_cents == 0 (no side effect leaked)"
            - "after POST /supplements/${sup_id}/decision with DENY as the owning InsurerAdjuster the posture returns to OPEN, and the identical order call then fails ERR_AUTHORIZED_AMOUNT_EXCEEDED with HTTP 402"
