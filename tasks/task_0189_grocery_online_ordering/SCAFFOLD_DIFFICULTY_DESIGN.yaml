              captures: { sub_rec: $.data.id, sub_cents: $.data.substitute_line_cents }
          trigger:
            - call: "POST /v1/substitutions/${sub_rec}/accept"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
              captures: { sub_status: $.data.status }
          assert:
            - "Substitution.${sub_rec}.status == ACCEPTED"
            - "OrderLine.${a_line}.status == SUBSTITUTED"
            - "OrderLine.${a_line}.final_line_cents == 250"

