  # ===========================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: settle_cascade_to_tier_donation_and_application
        grounds:
          - state_machines.BoatDeal.transitions.DELIVERED_to_SETTLED
          - state_machines.AttractionSession.transitions.REQUESTED_to_CONFIRMED
          - state_machines.AttractionSession.transitions.REQUESTED_to_WAITLIST_FALLBACK
          - calculations.deal_points_award
          - calculations.club_points_apply
          - calculations.tier_threshold_eval
          - calculations.conservation_match_accrue
          - calculations.attraction_posture
          - validations[priority=20]
        distinguishing_aspect: |
          Depth 6, and every link is caused by the previous link rather than by
          the settle call: settle bumps points_balance -> the replay raises
          points_lifetime_earned -> the tier boundary flips -> the freshly
          seeded ClubCardApplication is attached -> its point-redemption cascade
          raises the donation match -> the bumped venue demand moves the store
          posture, and the posture move is what rejects a later session.
        test_recipe:
          setup:
            - "A store at clock 2026-09-01T00:00Z with an AQUARIUM venue of capacity 20 and a GOLD application for the buyer, seeded while the buyer is still BASE."
            - "A delivered deal on that buyer whose contract price is 11220000, and a published free demo carrying the flat 15-minute dwell charge."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
