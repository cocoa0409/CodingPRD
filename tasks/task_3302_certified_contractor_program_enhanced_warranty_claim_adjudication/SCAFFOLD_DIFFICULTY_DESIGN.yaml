scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: material_prorate_standard_vs_enhanced_diverge_at_year6
        grounds:
          - calculations.prorated_material_coverage
          - entities.RemedyAllocation.fields.material_pct
        distinguishing_aspect: |
          Same inputs (identical 4x100000-cent qualifying systems, claims filed at
          completed_years=6) produce different covered amounts because the coverage_tier
          selects schedule STANDARD (50%) for BRONZE and ENHANCED (95%) for SILVER —
          a dual variant on the WarrantyClaim/Registration entity domain.
        test_recipe:
          setup:
            - "BRONZE contractor with ACTIVE certification and an ACTIVE QUALIFYING_SYSTEM registration activated 2026-09-10 with 4 GAF lines of 100000 cents each"
            - "SILVER contractor with ACTIVE certification and an identical ACTIVE QUALIFYING_SYSTEM registration activated 2026-09-10"
            - "clock advanced to 2032-09-10 so completed_years = 6 for both claims"
          setup_api_calls:
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/contractors", payload: { legal_name: "B Co", license_number: "LIC-B", license_expiry: "2035-01-01", insurance_expiry: "2035-01-01", territory_codes: ["T1"] }, as: ProgramAdmin, captures: { cb_id: $.data.id } }
            - { call: "POST /program/contractors", payload: { legal_name: "S Co", license_number: "LIC-S", license_expiry: "2035-01-01", insurance_expiry: "2035-01-01", territory_codes: ["T1"] }, as: ProgramAdmin, captures: { cs_id: $.data.id } }
            - { call: "POST /program/training-courses", payload: { title: "Full System 12", credits: 12, validity_months: 36 }, as: ProgramAdmin, captures: { course_id: $.data.id } }
            - { call: "POST /program/training-enrollments", payload: { contractor_id: "${cb_id}", course_id: "${course_id}" }, as: ProgramAdmin, captures: { eb_id: $.data.id } }
            - { call: "POST /program/training-enrollments", payload: { contractor_id: "${cs_id}", course_id: "${course_id}" }, as: ProgramAdmin, captures: { es_id: $.data.id } }
            - { call: "POST /program/training-enrollments/${eb_id}/complete", payload: { completed_at: "2026-09-01" }, as: ProgramAdmin }
            - { call: "POST /program/training-enrollments/${es_id}/complete", payload: { completed_at: "2026-09-01" }, as: ProgramAdmin }
            - { call: "POST /program/certifications", payload: { contractor_id: "${cb_id}", tier: "BRONZE" }, as: Contractor, as_user_id: "${cb_id}", captures: { cert_b: $.data.id } }
            - { call: "POST /program/certifications", payload: { contractor_id: "${cs_id}", tier: "SILVER" }, as: Contractor, as_user_id: "${cs_id}", captures: { cert_s: $.data.id } }
            - { call: "POST /program/certifications/${cert_b}/verify", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - { call: "POST /program/certifications/${cert_s}/verify", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - { call: "POST /program/warranty-registrations", payload: { certification_id: "${cert_b}", homeowner_name: "H B", property_postal_code: "30001", install_date: "2026-09-10" }, as: Contractor, as_user_id: "${cb_id}", captures: { reg_b: $.data.id } }
            - { call: "POST /program/warranty-registrations", payload: { certification_id: "${cert_s}", homeowner_name: "H S", property_postal_code: "30002", install_date: "2026-09-10" }, as: Contractor, as_user_id: "${cs_id}", captures: { reg_s: $.data.id } }
            - { call: "POST /program/component-catalog-items", payload: { sku: "SH-G", component_type: "SHINGLE", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "UN-G", component_type: "UNDERLAYMENT", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "ST-G", component_type: "STARTER", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "RC-G", component_type: "RIDGE_CAP", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_b}", catalog_sku: "SH-G", material_cost_cents: 100000 }, as: Contractor, as_user_id: "${cb_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_b}", catalog_sku: "UN-G", material_cost_cents: 100000 }, as: Contractor, as_user_id: "${cb_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_b}", catalog_sku: "ST-G", material_cost_cents: 100000 }, as: Contractor, as_user_id: "${cb_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_b}", catalog_sku: "RC-G", material_cost_cents: 100000 }, as: Contractor, as_user_id: "${cb_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_s}", catalog_sku: "SH-G", material_cost_cents: 100000 }, as: Contractor, as_user_id: "${cs_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_s}", catalog_sku: "UN-G", material_cost_cents: 100000 }, as: Contractor, as_user_id: "${cs_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_s}", catalog_sku: "ST-G", material_cost_cents: 100000 }, as: Contractor, as_user_id: "${cs_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_s}", catalog_sku: "RC-G", material_cost_cents: 100000 }, as: Contractor, as_user_id: "${cs_id}" }
            - { call: "POST /program/warranty-registrations/${reg_b}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /program/warranty-registrations/${reg_s}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2032-09-10T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/warranty-claims", payload: { registration_id: "${reg_b}", description: "leak", claim_labor_cost_cents: 50000 }, as: Claimant, captures: { claim_b: $.data.id } }
            - { call: "POST /program/warranty-claims", payload: { registration_id: "${reg_s}", description: "leak", claim_labor_cost_cents: 50000 }, as: Claimant, captures: { claim_s: $.data.id } }
            - { call: "POST /program/warranty-claims/${claim_b}/evidence", payload: { evidence_type: "PHOTO", note: "p1" }, as: Claimant }
            - { call: "POST /program/warranty-claims/${claim_b}/evidence", payload: { evidence_type: "PHOTO", note: "p2" }, as: Claimant, captures: { cv_b: $.data.version } }
            - { call: "POST /program/warranty-claims/${claim_s}/evidence", payload: { evidence_type: "PHOTO", note: "p1" }, as: Claimant }
            - { call: "POST /program/warranty-claims/${claim_s}/evidence", payload: { evidence_type: "PHOTO", note: "p2" }, as: Claimant, captures: { cv_s: $.data.version } }
            - { call: "POST /program/warranty-claims/${claim_b}/adjudicate", payload: { determination: "MANUFACTURER_DEFECT", expected_claim_version: "${cv_b}" }, as: ProgramAdmin }
            - { call: "POST /program/warranty-claims/${claim_s}/adjudicate", payload: { determination: "MANUFACTURER_DEFECT", expected_claim_version: "${cv_s}" }, as: ProgramAdmin }
          trigger:
            - { call: "GET /program/warranty-claims/${claim_b}/remedy-allocation", payload: {}, as: ProgramAdmin, captures: { mat_b: "$.data[0].material_covered_cents", pct_b: "$.data[0].material_pct" } }
            - { call: "GET /program/warranty-claims/${claim_s}/remedy-allocation", payload: {}, as: ProgramAdmin, captures: { mat_s: "$.data[0].material_covered_cents", pct_s: "$.data[0].material_pct" } }
          assert:
            - "RemedyAllocation(BRONZE claim).schedule_used == STANDARD and material_pct == 50"
            - "RemedyAllocation(BRONZE claim).material_covered_cents == 200000"
            - "RemedyAllocation(SILVER claim).schedule_used == ENHANCED and material_pct == 95"
            - "RemedyAllocation(SILVER claim).material_covered_cents == 380000"
            - "material_covered differs by 180000 cents for identical inputs (variant divergence)"

      - name: complaint_score_weighted_vs_lifetime_diverge_after_decay
        grounds:
          - calculations.complaint_pattern_score
          - state_machines.Contractor.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          Same substantiated-complaint set yields weighted_24mo == 3 (below suspension
          threshold 5) yet lifetime_count == 8 (revocation): the two variants answer
          different questions on the Contractor entity domain, so the contractor ends
          REVOKED without ever satisfying the suspension predicate at this clock.
        test_recipe:
          setup:
            - "contractor with 7 substantiated complaints filed 2026-09-01 (suspended at the 5th substantiation)"
            - "clock advanced to 2028-10-15: all 7 complaints age past 24 months so weighted score decays to 0 and the contractor auto-reinstates to ACTIVE"
            - "an 8th complaint filed at 2028-10-01, still FILED"
          setup_api_calls:
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/contractors", payload: { legal_name: "Risky Co", license_number: "LIC-R", license_expiry: "2035-01-01", insurance_expiry: "2035-01-01", territory_codes: ["T1"] }, as: ProgramAdmin, captures: { cr_id: $.data.id } }
            - { call: "POST /program/complaints", payload: { contractor_id: "${cr_id}", category: "WORKMANSHIP" }, as: Claimant, captures: { cmp1: $.data.id } }
            - { call: "POST /program/complaints", payload: { contractor_id: "${cr_id}", category: "WORKMANSHIP" }, as: Claimant, captures: { cmp2: $.data.id } }
            - { call: "POST /program/complaints", payload: { contractor_id: "${cr_id}", category: "WORKMANSHIP" }, as: Claimant, captures: { cmp3: $.data.id } }
            - { call: "POST /program/complaints", payload: { contractor_id: "${cr_id}", category: "WORKMANSHIP" }, as: Claimant, captures: { cmp4: $.data.id } }
            - { call: "POST /program/complaints", payload: { contractor_id: "${cr_id}", category: "WORKMANSHIP" }, as: Claimant, captures: { cmp5: $.data.id } }
            - { call: "POST /program/complaints", payload: { contractor_id: "${cr_id}", category: "WORKMANSHIP" }, as: Claimant, captures: { cmp6: $.data.id } }
            - { call: "POST /program/complaints", payload: { contractor_id: "${cr_id}", category: "WORKMANSHIP" }, as: Claimant, captures: { cmp7: $.data.id } }
            - { call: "POST /program/complaints/${cmp1}/substantiate", payload: {}, as: ProgramAdmin }
            - { call: "POST /program/complaints/${cmp2}/substantiate", payload: {}, as: ProgramAdmin }
            - { call: "POST /program/complaints/${cmp3}/substantiate", payload: {}, as: ProgramAdmin }
            - { call: "POST /program/complaints/${cmp4}/substantiate", payload: {}, as: ProgramAdmin }
            - { call: "POST /program/complaints/${cmp5}/substantiate", payload: {}, as: ProgramAdmin }
            - { call: "POST /program/complaints/${cmp6}/substantiate", payload: {}, as: ProgramAdmin }
            - { call: "POST /program/complaints/${cmp7}/substantiate", payload: {}, as: ProgramAdmin }
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2028-10-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/complaints", payload: { contractor_id: "${cr_id}", category: "PROPERTY_DAMAGE" }, as: Claimant, captures: { cmp8: $.data.id } }
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2028-10-15T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /program/complaints/${cmp8}/substantiate", payload: {}, as: ProgramAdmin }
            - { call: "GET /program/contractors/${cr_id}", payload: {}, as: ProgramAdmin, captures: { score_now: $.data.complaint_score_24mo, lifetime_now: $.data.lifetime_substantiated_count, status_now: $.data.status } }
          assert:
            - "Contractor.${cr_id}.complaint_score_24mo == 3  (only the 14-day-old complaint counts: weight 3; the seven 25-month-old complaints contribute 0)"
            - "Contractor.${cr_id}.lifetime_substantiated_count == 8"
            - "Contractor.${cr_id}.status == REVOKED  (lifetime variant fires while weighted variant stays below 5)"

  - rule_id: combinatorial_formula
    instances:
      - name: material_proration_rounds_per_line_before_sum
        grounds:
          - calculations.prorated_material_coverage
          - entities.RegistrationComponent.fields.material_cost_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: 4 lines of 1001 cents at 50% round per line to
          501 and sum to 2004; sum-then-round would give round_half_up(4004*0.5)=2002.
          The scaffold pins per-line-then-sum, so 2004 is the only correct answer.
        test_recipe:
          setup:
            - "BRONZE contractor with ACTIVE cert, QUALIFYING_SYSTEM registration (4 GAF lines of 1001 cents) activated 2026-09-10"
            - "clock at 2032-09-10 -> completed_years 6 -> STANDARD pct 50"
            - "claim filed with labor 0 and two PHOTO evidence items"
          setup_api_calls:
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/contractors", payload: { legal_name: "Round Co", license_number: "LIC-RR", license_expiry: "2035-01-01", insurance_expiry: "2035-01-01", territory_codes: ["T1"] }, as: ProgramAdmin, captures: { cr_id: $.data.id } }
            - { call: "POST /program/training-courses", payload: { title: "Basics", credits: 4, validity_months: 36 }, as: ProgramAdmin, captures: { course_id: $.data.id } }
            - { call: "POST /program/training-enrollments", payload: { contractor_id: "${cr_id}", course_id: "${course_id}" }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /program/training-enrollments/${enr_id}/complete", payload: { completed_at: "2026-09-01" }, as: ProgramAdmin }
            - { call: "POST /program/certifications", payload: { contractor_id: "${cr_id}", tier: "BRONZE" }, as: Contractor, as_user_id: "${cr_id}", captures: { cert_id: $.data.id } }
            - { call: "POST /program/certifications/${cert_id}/verify", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - { call: "POST /program/warranty-registrations", payload: { certification_id: "${cert_id}", homeowner_name: "H R", property_postal_code: "30003", install_date: "2026-09-10" }, as: Contractor, as_user_id: "${cr_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /program/component-catalog-items", payload: { sku: "SH-G", component_type: "SHINGLE", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "UN-G", component_type: "UNDERLAYMENT", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "ST-G", component_type: "STARTER", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "RC-G", component_type: "RIDGE_CAP", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "SH-G", material_cost_cents: 1001 }, as: Contractor, as_user_id: "${cr_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "UN-G", material_cost_cents: 1001 }, as: Contractor, as_user_id: "${cr_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "ST-G", material_cost_cents: 1001 }, as: Contractor, as_user_id: "${cr_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "RC-G", material_cost_cents: 1001 }, as: Contractor, as_user_id: "${cr_id}" }
            - { call: "POST /program/warranty-registrations/${reg_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2032-09-10T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/warranty-claims", payload: { registration_id: "${reg_id}", description: "granule loss", claim_labor_cost_cents: 0 }, as: Claimant, captures: { claim_id: $.data.id } }
            - { call: "POST /program/warranty-claims/${claim_id}/evidence", payload: { evidence_type: "PHOTO", note: "a" }, as: Claimant }
            - { call: "POST /program/warranty-claims/${claim_id}/evidence", payload: { evidence_type: "PHOTO", note: "b" }, as: Claimant, captures: { cv: $.data.version } }
          trigger:
            - { call: "POST /program/warranty-claims/${claim_id}/adjudicate", payload: { determination: "MANUFACTURER_DEFECT", expected_claim_version: "${cv}" }, as: ProgramAdmin }
            - { call: "GET /program/warranty-claims/${claim_id}/remedy-allocation", payload: {}, as: ProgramAdmin, captures: { pool: "$.data[0].prorated_material_pool_cents", covered: "$.data[0].material_covered_cents", ho: "$.data[0].homeowner_material_share_cents" } }
          assert:
            - "RemedyAllocation.prorated_material_pool_cents == 2004  (4 x round_half_up(1001*0.50)=501, per-line then sum)"
            - "RemedyAllocation.material_covered_cents == 2004"
            - "RemedyAllocation.homeowner_material_share_cents == 2000  (round_half_up(1.0 * (4004 - 2004)))"
            - "RemedyAllocation.labor_covered_cents == 0  (BRONZE labor_years=2, completed_years=6)"

      - name: labor_coverage_nested_min_and_strict_year_gate
        grounds:
          - calculations.labor_coverage_amount
          - entities.Certification.fields.tier
        distinguishing_aspect: |
          Mode (a) non-linear multi-input formula: GOLD tier, labor cost 1200000 with
          cap 1000000 binds at min() -> 1000000 while covered; a second claim filed
          after completed_years crosses labor_years=10 returns 0 even though cost and
          cap are unchanged (strict >= gate at the boundary).
        test_recipe:
          setup:
            - "GOLD contractor with ACTIVE cert, QUALIFYING_SYSTEM registration (4 GAF lines of 25000) activated 2026-09-10"
            - "claim A filed at 2032-09-10 (completed_years 6 < 10) with labor 1200000; claim B filed at 2036-09-10 (completed_years 10, gate closed)"
          setup_api_calls:
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/contractors", payload: { legal_name: "Gold Co", license_number: "LIC-G", license_expiry: "2040-01-01", insurance_expiry: "2040-01-01", territory_codes: ["T1"] }, as: ProgramAdmin, captures: { cg_id: $.data.id } }
            - { call: "POST /program/training-courses", payload: { title: "Master 12", credits: 12, validity_months: 36 }, as: ProgramAdmin, captures: { course_id: $.data.id } }
            - { call: "POST /program/training-enrollments", payload: { contractor_id: "${cg_id}", course_id: "${course_id}" }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /program/training-enrollments/${enr_id}/complete", payload: { completed_at: "2026-09-01" }, as: ProgramAdmin }
            - { call: "POST /program/certifications", payload: { contractor_id: "${cg_id}", tier: "GOLD" }, as: Contractor, as_user_id: "${cg_id}", captures: { cert_id: $.data.id } }
            - { call: "POST /program/certifications/${cert_id}/verify", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - { call: "POST /program/warranty-registrations", payload: { certification_id: "${cert_id}", homeowner_name: "H G", property_postal_code: "30004", install_date: "2026-09-10" }, as: Contractor, as_user_id: "${cg_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /program/component-catalog-items", payload: { sku: "SH-G", component_type: "SHINGLE", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "UN-G", component_type: "UNDERLAYMENT", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "ST-G", component_type: "STARTER", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "RC-G", component_type: "RIDGE_CAP", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "SH-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${cg_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "UN-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${cg_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "ST-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${cg_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "RC-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${cg_id}" }
            - { call: "POST /program/warranty-registrations/${reg_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2032-09-10T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/warranty-claims", payload: { registration_id: "${reg_id}", description: "claim A", claim_labor_cost_cents: 1200000 }, as: Claimant, captures: { claim_a: $.data.id } }
            - { call: "POST /program/warranty-claims/${claim_a}/evidence", payload: { evidence_type: "PHOTO", note: "a1" }, as: Claimant }
            - { call: "POST /program/warranty-claims/${claim_a}/evidence", payload: { evidence_type: "PHOTO", note: "a2" }, as: Claimant, captures: { cv_a: $.data.version } }
            - { call: "POST /program/warranty-claims/${claim_a}/adjudicate", payload: { determination: "MANUFACTURER_DEFECT", expected_claim_version: "${cv_a}" }, as: ProgramAdmin }
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2036-09-10T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/warranty-claims", payload: { registration_id: "${reg_id}", description: "claim B", claim_labor_cost_cents: 1200000 }, as: Claimant, captures: { claim_b: $.data.id } }
            - { call: "POST /program/warranty-claims/${claim_b}/evidence", payload: { evidence_type: "PHOTO", note: "b1" }, as: Claimant }
            - { call: "POST /program/warranty-claims/${claim_b}/evidence", payload: { evidence_type: "PHOTO", note: "b2" }, as: Claimant, captures: { cv_b: $.data.version } }
            - { call: "POST /program/warranty-claims/${claim_b}/adjudicate", payload: { determination: "MANUFACTURER_DEFECT", expected_claim_version: "${cv_b}" }, as: ProgramAdmin }
          trigger:
            - { call: "GET /program/warranty-claims/${claim_a}/remedy-allocation", payload: {}, as: ProgramAdmin, captures: { lab_a: "$.data[0].labor_covered_cents", mat_a: "$.data[0].material_covered_cents" } }
            - { call: "GET /program/warranty-claims/${claim_b}/remedy-allocation", payload: {}, as: ProgramAdmin, captures: { lab_b: "$.data[0].labor_covered_cents" } }
          assert:
            - "Claim A RemedyAllocation.labor_covered_cents == 1000000  (min(1200000, GOLD cap 1000000) binds the cap)"
            - "Claim A RemedyAllocation.material_covered_cents == 100000  (ENHANCED_PLUS 100% at year 6)"
            - "Claim B RemedyAllocation.labor_covered_cents == 0  (completed_years == 10 meets the strict >= labor_years gate)"
            - "Claim B RemedyAllocation.completed_years == 10"

  - rule_id: non_linear_state_machine
    instances:
      - name: certification_suspend_reinstate_cycle
        grounds:
          - state_machines.Certification.ACTIVE_to_SUSPENDED
          - state_machines.Certification.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Certification is cyclic: ACTIVE -> SUSPENDED (complaint cascade) -> ACTIVE
          (reinstate) on the Certification entity, with version increments on every arc.
        test_recipe:
          setup:
            - "BRONZE contractor with ACTIVE certification; two complaints filed 2027-06-01 and 2026-09-10 such that substantiating both at 2027-08-01 yields weighted score exactly 5 (3 + 2) and suspends contractor + certification"
