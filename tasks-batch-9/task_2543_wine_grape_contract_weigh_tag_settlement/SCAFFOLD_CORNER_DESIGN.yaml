            - "Each contract's single installment is SCHEDULED with planned_amount_cents equal to its own net_payable_cents (4775000 and 4749981), so the waterfall residual is 0 on both"
            - "Both contracts are \"SETTLED\" and the grower's outstanding_lien_balance_cents == 9525000, the sum of the two lien-protected installments"

      - name: reliability_penalties_decay_by_half_when_the_vintage_rolls_over
        claim_type: Precision
        grounds:
          - calculations.grower_reliability_score
          - calculations.grower_reliability_score.constants.PRIOR_VINTAGE_DECAY_DIVISOR
          - entities.Grower.fields.prior_vintage_penalty_units
        distinguishing_aspect: |
          The decay curve is driven by the CLOCK's calendar year, not by an explicit
          rollover call. One expired pick call created in 2026 costs 5 units, so both
          scores read 95.0 while the clock is in 2026. Moving the clock to 2027 re-buckets
          the same stored row into prior_vintage_penalty_units 5: the vintage score
          resets to 100.0 (prior vintages ignored entirely) while the lifetime score
          becomes 100 - round_half_up(5/2) = 100 - 3 = 97.0. The odd unit total is chosen
          deliberately — halving 5 must round HALF UP to 3 as a WHOLE unit before the
          subtraction, so 97.0 is right and 97.5 is the signature of rounding in the
          wrong place.
        test_recipe:
          setup:
            - "An ACTIVE 2026 contract with a PICK_READY visit and one pick call issued at 2026-08-01T00:00:00Z that is allowed to expire. No rejected loads and no no-shows, so the whole penalty is the 5-unit expiry."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/growers"
              payload: { name: "Ridgeline Vineyards", license_number: "PL-44821", region_code: "NAPA-NORTH" }
              as: GrowerRelationsManager
              captures: { grower_id: $.data.id }
            - call: "POST /grower-relations/vineyard-blocks"
              payload: { grower_id: "${grower_id}", block_code: "B-12", varietal: "CABERNET_SAUVIGNON", acres: 20.000, expected_yield_tons_per_acre: 2.000, ava_code: "NAPA-VALLEY" }
              as: GrowerRelationsManager
              captures: { block_id: $.data.id }
            - call: "POST /grower-relations/quality-specs"
              payload: { spec_code: "CAB-STD-2026", min_brix_accept: 20.0, brix_bonus_start: 24.0, brix_penalty_start: 22.0, rot_rejection_pct: 8.0, min_brix_pick_call: 21.0 }
              as: GrowerRelationsManager
              captures: { spec_id: $.data.id }
            - call: "POST /grower-relations/sampling-crews"
              payload: { crew_code: "SC-1", region_code: "NAPA-NORTH", max_concurrent_visits: 2 }
              as: HarvestCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /grower-relations/grape-contracts"
              payload: { grower_id: "${grower_id}", quality_spec_id: "${spec_id}", contract_code: "GC-DECAY", contract_basis: "TONNAGE", base_price_per_ton_cents: 450000, over_delivery_policy: "ACCEPT_AT_CONTRACT", term_start_vintage: 2026, term_end_vintage: 2028, committed_tons: 40.000, installment_plan: [{ installment_no: 1, pct_of_settlement: 100.0, due_offset_days: 30, lien_protected: true }] }
              as: GrowerRelationsManager
              captures: { contract_id: $.data.id }
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/offer"
              payload: {}
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/accept"
              payload: {}
              as: Grower
              as_user_id: "${grower_id}"
            - call: "POST /grower-relations/sampling-visits"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}", crew_id: "${crew_id}", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T11:00:00Z" }
              as: HarvestCoordinator
              captures: { visit_id: $.data.id }
            - call: "POST /grower-relations/sampling-visits/${visit_id}/record"
              payload: { measured_brix: 24.5, measured_ta_gl: 6.5, measured_ph: 3.45, measured_rot_pct: 1.0 }
              as: HarvestCoordinator
            - call: "POST /grower-relations/pick-calls"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}", target_pick_at: "2026-08-06T14:00:00Z", estimated_tons: 20.000 }
              as: HarvestCoordinator
              captures: { pick_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:01Z" }
              as: HarvestCoordinator
            - call: "GET /grower-relations/growers/${grower_id}"
              payload: {}
              as: GrowerRelationsManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-31T23:59:59Z" }
              as: GrowerRelationsManager
            - call: "GET /grower-relations/growers/${grower_id}"
              payload: {}
              as: GrowerRelationsManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: GrowerRelationsManager
            - call: "GET /grower-relations/growers/${grower_id}"
              payload: {}
              as: GrowerRelationsManager
          assert:
            - "After the expiry the pick call is \"EXPIRED\" and the grower reports expired_pick_call_count_vintage == 1 with prior_vintage_penalty_units == 0"
            - "In 2026 both scores read 95.0: current_units is 1 * EXPIRED_CALL_UNITS 5 and there is no prior vintage to decay"
            - "At 2026-12-31T23:59:59Z the figures are unchanged — the bucket boundary is the calendar year of the clock, not an elapsed-days count"
            - "At 2027-01-01T00:00:00Z the same stored PickCall re-buckets: expired_pick_call_count_vintage == 0 and prior_vintage_penalty_units == 5"
            - "reliability_score_vintage == 100.0 in 2027: the VINTAGE_SCOPED variant ignores prior vintages entirely"
            - "reliability_score_lifetime == 97.0 in 2027: round_half_up(5 / 2) == 3 whole units are subtracted, so it is NOT 97.5 and NOT 95.0"
            - "No API call other than the clock moves was made between the two readings, so the change is purely the decay curve"
            - "The contract (term 2026-2028) is still \"ACTIVE\", so the rollover is not an artefact of the contract ending"

      - name: same_data_under_both_variants_produces_different_results
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: settlement_basis_load_by_load_versus_weighted_blend_divergence
          rationale: |
            That §1.8 instance is the divergence probe: two contracts with identical loads
            and identical grades, one LOAD_BY_LOAD and one WEIGHTED_BLEND, settled to two
            different whole-cent totals, with the delta asserted exactly. The second
            dual-variant rule (VINTAGE_SCOPED vs LIFETIME_SCOPED reliability) is covered by
            its sibling instance in the same rule.

      - name: the_correct_variant_is_selected_for_the_calling_context
        claim_type: Variant Selection
        excluded_because:
          difficulty_instance: grower_reliability_vintage_scope_versus_lifetime_scope_divergence
          rationale: |
            Variant SELECTION is precisely what that instance pins down: the harvest-season
            gate (pick-call issuance) must consult the VINTAGE_SCOPED score while the
            contract-term gate (renewal) must consult the LIFETIME_SCOPED one, and it
            constructs a producer for whom the two variants disagree so that a gate reading
            the wrong one visibly flips outcome.

      - name: switching_from_provisional_to_final_applies_the_delta_to_the_ledger
        claim_type: Reconciliation
        excluded_because:
          difficulty_instance: settlement_basis_load_by_load_versus_weighted_blend_divergence
          rationale: |
            The provisional-to-final reconciliation rides on the same instance: it asserts
            each SettlementLine's provisional_amount_cents before the close and its
            final_amount_cents after, checks that the PROVISIONAL -> FINAL flip is what
            re-prices the line under the contract's settlement_basis, and reconciles the
            contract's provisional_settlement_cents against final_settlement_cents.

      - name: only_entities_in_the_specified_states_enter_the_calculation
        claim_type: Input Set Filtering
        excluded_because:
          difficulty_instance: tonnage_conservation_across_over_delivery_and_dispute
          rationale: |
            Input-set filtering is the heart of that instance: a tag whose rejection is
            undone by a dispute leaves disposition DISPUTED and must drop out of both the
            delivered-tonnage aggregate and the reliability penalty count, while
            net_payable_derivation may only read FINAL settlement lines. It asserts the
            aggregates before and after the disposition change on the same stored rows.

      - name: waterfall_fills_the_first_bucket_before_the_second_and_places_the_remainder
        claim_type: waterfall_allocation
        excluded_because:
          difficulty_instance: money_conservation_in_installment_waterfall_residual
          rationale: |
            The two waterfalls in §1.3 both have depth instances: the installment residual
            (percentages that each round independently, with the drift pushed onto the
            HIGHEST installment_no) in this instance, and the three-bucket tonnage waterfall
            (CONTRACT -> tolerance band -> excess) in
            tonnage_conservation_across_over_delivery_and_dispute.

      - name: tier_pricing_rounds_at_the_declared_step_not_at_the_end
            # (nested per-ton-then-tons rounding)
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: settlement_line_nested_rounding_per_ton_then_tons
          rationale: |
            The nested-rounding corner of settlement_line_amount — rounding the adjusted
            per-ton price to whole cents FIRST and only then multiplying by the ton slice —
            is asserted there with figures chosen so that collapsing the two steps changes
            the answer. The prompt-pay tier boundary itself is covered above by
            prompt_pay_tier_boundary_at_exactly_five_million_cents.

  # ===========================================================================
  # SECTION 4 — Validations (claim-extraction-guide "From Table 4")
  # ===========================================================================
  - section: validations
    instances:
      - name: basis_conditional_field_rules_reject_mismatched_payloads_422
        claim_type: Conditional validation
        grounds:
          - validations.priority_9
          - errors[ERR_BASIS_FIELD_MISMATCH]
        distinguishing_aspect: |
          Priority 9 is conditional on contract_basis, and it both REQUIRES and FORBIDS:
          TONNAGE needs committed_tons and refuses contracted_yield_tons_per_acre, ACREAGE
          the mirror image, BLOCK refuses both, and allocated_acres is required exactly when
          the parent contract is ACREAGE. The forbidding half is what implementations skip —
          they accept a stray committed_tons on an ACREAGE contract and then derive a cap
          from it. All six probes must be ERR_BASIS_FIELD_MISMATCH, not the generic
          ERR_VALIDATION.
        test_recipe:
          setup:
            - "One grower, one block, one spec, and one ACREAGE contract used as the parent for the allocation probes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/growers"
              payload: { name: "Ridgeline Vineyards", license_number: "PL-44821", region_code: "NAPA-NORTH" }
              as: GrowerRelationsManager
              captures: { grower_id: $.data.id }
            - call: "POST /grower-relations/vineyard-blocks"
              payload: { grower_id: "${grower_id}", block_code: "B-12", varietal: "CABERNET_SAUVIGNON", acres: 20.000, expected_yield_tons_per_acre: 2.000, ava_code: "NAPA-VALLEY" }
              as: GrowerRelationsManager
              captures: { block_id: $.data.id }
            - call: "POST /grower-relations/quality-specs"
              payload: { spec_code: "CAB-STD-2026", min_brix_accept: 20.0, brix_bonus_start: 24.0, brix_penalty_start: 22.0, rot_rejection_pct: 8.0, min_brix_pick_call: 21.0 }
              as: GrowerRelationsManager
              captures: { spec_id: $.data.id }
            - call: "POST /grower-relations/grape-contracts"
              payload: { grower_id: "${grower_id}", quality_spec_id: "${spec_id}", contract_code: "GC-ACREAGE-PARENT", contract_basis: "ACREAGE", base_price_per_ton_cents: 450000, over_delivery_policy: "ACCEPT_AT_CONTRACT", term_start_vintage: 2026, term_end_vintage: 2026, contracted_yield_tons_per_acre: 2.500, installment_plan: [{ installment_no: 1, pct_of_settlement: 100.0, due_offset_days: 30, lien_protected: true }] }
              as: GrowerRelationsManager
              captures: { acreage_contract: $.data.id }
            - call: "POST /grower-relations/grape-contracts"
