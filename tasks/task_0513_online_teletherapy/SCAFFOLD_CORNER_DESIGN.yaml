      - name: occ_subscription_pause_stale_excluded
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[subscription-pause-stale]
        excluded_because:
          difficulty_instance: dual_variant_calc / pause_refund_forward_looking_on_subscription
          rationale: "The pause endpoint's OCC field and version-advance side effect are exercised positively by the named §1.8 instance; the stale-version negative path mirrors the live-session OCC corner above with the subscription parent."
      - name: scheduled_action_auto_resume_at_pause_date
        claim_type: scheduled_actions
        grounds:
          - state_machines.Subscription.PAUSED_to_ACTIVE
          - endpoints
        distinguishing_aspect: "Advancing the clock to pause_resumes_on auto-resumes a PAUSED subscription: setting clock to 2026-07-01 flips status PAUSED -> ACTIVE without an explicit /resume call."
        test_recipe:
          setup:
            - "Client in CA, subscription charged at 2026-06-01, paused with resume_on 2026-07-01."
          setup_api_calls:
