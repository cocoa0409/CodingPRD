            - call: "POST /exchange-transactions/${t1}/settle"
              payload: {}
              as: BranchTeller
              as_user_id: teller-02
              captures: { gross: "$.data.settled_usd_gross_cents", comm: "$.data.settled_commission_cents", total: "$.data.settled_total_charge_cents", st: "$.data.settlement_status" }
            - call: "GET /inventory-positions/${pos_id}"
              payload: {}
              as: BranchManager
              captures: { pos_minor: "$.data.total_minor_units", pos_usd: "$.data.usd_equivalent_cents" }
            - call: "GET /branches/${br_id}"
              payload: {}
              as: BranchManager
              captures: { vault: "$.data.vault_usd_equivalent_cents", bps: "$.data.vault_utilization_bps", posture: "$.data.posture" }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: BranchTeller
              captures: { roll: "$.data.rolling_30d_settled_usd_cents", cal: "$.data.calendar_month_settled_usd_cents", score: "$.data.structuring_risk_score", tier: "$.data.structuring_risk_tier" }
            - call: "GET /compliance-reports"
              payload: { triggering_transaction_id: "${t1}" }
              as: ComplianceOfficer
          assert:
            - "the settle response itself already carries ${gross} == 30909, ${comm} == 1082, ${total} == 29827 and ${st} == SETTLED with settled_at 2026-08-01T00:00:00Z - no follow-up read is needed to learn the outcome"
            - "${pos_minor} == 80000 and ${pos_usd} == 86957 on the first read after the settlement: the 3 bought notes are already on the position (available_note_count 8 for denomination 10000)"
            - "${vault} == 86957, ${bps} == 8696 and ${posture} == OPEN in that same first read: 8696 is below VAULT_RESTRICTED_MIN_BPS 9000, so the branch has not tipped, and the priority-13 vault check passed because 86957 <= 100000"
            - "${roll} == 30909 and ${cal} == 30909 with near_threshold_txn_count 0 and distinct_branch_count 1, immediately visible on the customer"
            - "${score} == 1 (volume floor(40 * 30909 / 1000000) = 1, frequency 0, dispersion clamped to 0) and ${tier} == NORMAL"
            - "GET /compliance-reports?triggering_transaction_id=${t1} returns total_count 0: 30909 is far below REPORT_THRESHOLD_CENTS, so immediate consistency also means no phantom report appears later"
            - "re-reading every one of these rows a second time returns byte-identical values: there is no eventual convergence step in this domain"
