# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_3090
# High-Net-Worth Homeowners Underwriting & Risk Mitigation Services
#
# Machine-readable index of every difficulty feature the §1.1–§1.7 surface
# declares. Nine rule_ids from SKILL.md §0.5, two instances each (18 total).
# Every instance grounds only in elements already declared in SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: premium_calculation_variant_at_extended_coverage
        grounds:
          - calculations.extended_replacement_premium
          - calculations.extended_replacement_provision
          - entities.Enrollment.fields.extended_replacement_limit_cents
          - validations[priority=14]
        distinguishing_aspect: "For one identical approved enrollment on a dwelling whose replacement cost is 200000000, requesting Coverage A of 300000000 yields extended_replacement_premium_cents 945000 while requesting 250000000 yields 656250 — the tiered ratio factor of 1.5000 versus 1.2500 is the only difference between the two runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Zone ZA EXTREME/WITHIN_WUI, agency AG1; dwelling P1 appraised at 200000000 and posture-priced to UNDERWRITABLE; enrolment E1 sitting in SUBMITTED with Coverage A 300000000."
          setup_api_calls:
            - call: "POST /hnw/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hnw/risk-zones"
              payload: { zone_code: "ZA", state_code: "CA", wildland_urban_interface_band: "WITHIN_WUI", sustained_wind_mph: 45, mitigation_band_multiplier: 1.0, mitigated_loss_multiplier: 1.0, exposure_band: "EXTREME" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /hnw/agencies"
              payload: { agency_code: "AG1", legal_name: "Golden State Premier", state_code: "CA", delegated_authority_limit_cents: 500000000 }
              as: PlatformAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /hnw/properties"
              payload: { risk_zone_id: "${zone_id}", agency_id: "${agency_id}", address_line: "1 Canyon Ridge Rd", grid_risk_block: "RIDGE-A" }
              as: Underwriter
              captures: { p1_id: $.data.id }
            - call: "POST /hnw/properties/${p1_id}/appraisals"
              payload: { appraiser_name: "Coast Valuation", valuation_method: "SITE_MEASURED", appraised_on: "2026-08-15T00:00:00Z", dwelling_cost_cents: 200000000, contents_cost_cents: 0, valuation_confidence_pct: 95.0 }
              as: Underwriter
              captures: { appr_id: $.data.id }
            - call: "POST /hnw/appraisals/${appr_id}/review"
              payload: {}
              as: Underwriter
            - call: "POST /hnw/appraisals/${appr_id}/approve"
              payload: {}
              as: Underwriter
            - call: "GET /hnw/properties/${p1_id}"
              payload: {}
              as: Underwriter
              captures: { p1_v1: $.data.version }
            - call: "POST /hnw/properties/${p1_id}/posture-eval"
              payload: { expected_property_version: "${p1_v1}" }
              as: Underwriter
              captures: { p1_v0: $.data.version }
            - call: "POST /hnw/properties/${p1_id}/mitigation-requirements"
              payload: { requirement_code: "DEFENSIBLE_SPACE", band_awarded: "CLEARED", source: "UNDERWRITING", due_on: "2026-12-01T00:00:00Z" }
              as: RiskConsultant
              captures: { mit_id: $.data.id }
            - call: "POST /hnw/mitigation-requirements/${mit_id}/verify"
              payload: { verified_band: "CLEARED" }
              as: RiskConsultant
              captures: { p1_v1: $.data.version }
            - call: "POST /hnw/properties/${p1_id}/enrollments"
              payload: { agency_id: "${agency_id}", dwelling_coverage_cents: 300000000, contents_coverage_cents: 0, scheduled_coverage_cents: 0, loss_of_use_coverage_cents: 0 }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /hnw/enrollments/${e1_id}/submit"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
          trigger:
            - call: "POST /hnw/enrollments/${e1_id}/approve"
              payload: {}
              as: Underwriter
              captures: { e1_risk_score: $.data.risk_score, e1_premium: $.data.extended_replacement_premium_cents, e1_ext_limit: $.data.extended_replacement_limit_cents }
          assert:
            - "Enrollment.${e1_id}.status == APPROVED"
            - "Enrollment.${e1_id}.extended_replacement_premium_cents == 945000"
            - "Enrollment.${e1_id}.gross_premium_cents == 945000"
            - "Enrollment.${e1_id}.replacement_provision == EXTENDED"
            - "Enrollment.${e1_id}.extended_replacement_limit_cents == 300000000"
            - "Enrollment.${e1_id}.required_dwelling_coverage_cents == 300000000"
            - "after POST /hnw/enrollments/${e2_id}/approve on a sibling enrollment on the same property with dwelling_coverage_cents 250000000, that enrollment's extended_replacement_premium_cents == 656250"
            - "Enrollment.${e1_id}.extended_replacement_premium_cents - Enrollment.${e2_id}.extended_replacement_premium_cents == 288750"

      - name: concentration_ratio_variant_zone_scope_versus_agency_scope
        grounds:
          - calculations.concentration_ratio
          - calculations.concentration_ratio.variants.zone_scope
          - calculations.concentration_ratio.variants.agency_scope
          - entities.RiskZone.fields.concentration_band
          - entities.Agency.fields.concentration_band
        distinguishing_aspect: "A dual-variant calculation on a DIFFERENT entity domain from the premium instance: concentration_ratio operates on RiskZone and Agency rather than Enrollment, and its two variants diverge in opposite directions on the same two enrollments — zone scope reports 66.67 percent for the zone while agency scope reports 100.00 percent for the agency, and only the zone scope gates the freeze flag."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Two zones in one book: ZC1 EXTREME/WITHIN_WUI and ZC2 EXTREME/WITHIN_WUI. Two properties P1 (zone ZC1, CLEARED mitigation) and P2 (zone ZC2, no mitigation)."
          setup_api_calls:
            - call: "POST /hnw/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hnw/risk-zones"
              payload: { zone_code: "ZC1", state_code: "CA", wildland_urban_interface_band: "WITHIN_WUI", sustained_wind_mph: 45, mitigation_band_multiplier: 1.0, mitigated_loss_multiplier: 1.0, exposure_band: "EXTREME" }
              as: PlatformAdmin
              captures: { z1_id: $.data.id }
            - call: "POST /hnw/risk-zones"
              payload: { zone_code: "ZC2", state_code: "CA", wildland_urban_interface_band: "WITHIN_WUI", sustained_wind_mph: 45, mitigation_band_multiplier: 1.0, mitigated_loss_multiplier: 1.0, exposure_band: "EXTREME" }
              as: PlatformAdmin
              captures: { z2_id: $.data.id }
            - call: "POST /hnw/agencies"
              payload: { agency_code: "AG2", legal_name: "Sierra Premier Partners", state_code: "CA", delegated_authority_limit_cents: 500000000 }
              as: PlatformAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /hnw/properties"
              payload: { risk_zone_id: "${z1_id}", agency_id: "${agency_id}", address_line: "2 Canyon Ridge Rd", grid_risk_block: "RIDGE-A" }
              as: Underwriter
              captures: { p1_id: $.data.id }
            - call: "POST /hnw/properties"
              payload: { risk_zone_id: "${z2_id}", agency_id: "${agency_id}", address_line: "3 Canyon Ridge Rd", grid_risk_block: "RIDGE-B" }
              as: Underwriter
              captures: { p2_id: $.data.id }
            - call: "POST /hnw/properties/${p1_id}/appraisals"
              payload: { appraiser_name: "Coast Valuation", valuation_method: "SITE_MEASURED", appraised_on: "2026-08-15T00:00:00Z", dwelling_cost_cents: 200000000, contents_cost_cents: 0, valuation_confidence_pct: 95.0 }
              as: Underwriter
              captures: { appr1_id: $.data.id }
            - call: "POST /hnw/appraisals/${appr1_id}/review"
              payload: {}
              as: Underwriter
            - call: "POST /hnw/appraisals/${appr1_id}/approve"
              payload: {}
              as: Underwriter
            - call: "GET /hnw/properties/${p1_id}"
              payload: {}
              as: Underwriter
              captures: { p1_v2: $.data.version }
            - call: "POST /hnw/properties/${p1_id}/posture-eval"
              payload: { expected_property_version: "${p1_v2}" }
              as: Underwriter
            - call: "POST /hnw/properties/${p1_id}/mitigation-requirements"
              payload: { requirement_code: "DEFENSIBLE_SPACE", band_awarded: "CLEARED", source: "UNDERWRITING", due_on: "2026-12-01T00:00:00Z" }
              as: RiskConsultant
              captures: { mit1_id: $.data.id }
            - call: "POST /hnw/mitigation-requirements/${mit1_id}/verify"
              payload: { verified_band: "CLEARED" }
              as: RiskConsultant
            - call: "POST /hnw/properties/${p2_id}/appraisals"
              payload: { appraiser_name: "Coast Valuation", valuation_method: "SITE_MEASURED", appraised_on: "2026-08-15T00:00:00Z", dwelling_cost_cents: 200000000, contents_cost_cents: 0, valuation_confidence_pct: 95.0 }
              as: Underwriter
              captures: { appr2_id: $.data.id }
            - call: "POST /hnw/appraisals/${appr2_id}/review"
              payload: {}
              as: Underwriter
            - call: "POST /hnw/appraisals/${appr2_id}/approve"
              payload: {}
              as: Underwriter
            - call: "GET /hnw/properties/${p2_id}"
              payload: {}
              as: Underwriter
              captures: { p2_v3: $.data.version }
            - call: "POST /hnw/properties/${p2_id}/posture-eval"
              payload: { expected_property_version: "${p2_v3}" }
              as: Underwriter
            - call: "POST /hnw/properties/${p1_id}/enrollments"
              payload: { agency_id: "${agency_id}", dwelling_coverage_cents: 300000000, contents_coverage_cents: 0, scheduled_coverage_cents: 0, loss_of_use_coverage_cents: 0 }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /hnw/properties/${p2_id}/enrollments"
              payload: { agency_id: "${agency_id}", dwelling_coverage_cents: 300000000, contents_coverage_cents: 0, scheduled_coverage_cents: 0, loss_of_use_coverage_cents: 0 }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { e2_id: $.data.id }
            - call: "POST /hnw/enrollments/${e1_id}/submit"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
            - call: "POST /hnw/enrollments/${e2_id}/submit"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
          trigger:
            - call: "POST /hnw/enrollments/${e1_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /hnw/enrollments/${e2_id}/approve"
              payload: {}
              as: Underwriter
            - call: "GET /hnw/enrollments/${e2_id}/underwriting-summary"
              payload: { view: "GROSS" }
              as: Underwriter
              captures: { e2_gross: $.data.risk_score }
            - call: "POST /hnw/risk-zones/${z1_id}/check_concentration"
              payload: {}
              as: Underwriter
              captures: { z1_ratio: $.data.concentration_ratio_pct, z1_band: $.data.concentration_band }
          assert:
            - "after the trigger adds a second ACTIVE enrollment to the book, check_concentration returns RiskZone.${z1_id}.concentration_ratio_pct == 50.0 and the zone's concentration_band == CRITICAL, so the zone scope's denominator is the whole ACTIVE portfolio"
            - "Agency.${agency_id}.concentration_ratio_pct == 100.00 and concentration_band == CRITICAL for the same two enrollments, because the agency scope's denominator is the zone, not the portfolio"
            - "the two variants disagree on the same inputs by 50.00 percentage points and neither value can be produced by the other variant's formula"
            - "RiskZone.${z1_id}.freeze_active == true while Agency.${agency_id}.concentration_band being CRITICAL never sets any freeze flag"
            - "Enrollment.${e1_id}.risk_score == 400 and risk_tier == REVIEW, and Enrollment.${e2_id}.risk_score == 720 and risk_tier == REFER"

  # ===========================================================================
  # Rule 2 — combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: settlement_formula_circular_dependency_pinned_by_evaluation_order
        grounds:
          - calculations.cash_settlement_valuation
          - entities.Claim.fields.settlement_amount_cents
          - entities.Enrollment.fields.extended_replacement_limit_cents
          - validations[priority=13]
        distinguishing_aspect: "Mode (c) circular-looking dependency: the settlement depends on limit_applied_cents, which in turn depends on the settlement's own cause_of_loss and the enrollment's replacement provision; the scaffold pins the evaluation order limit-then-cap-then-scarcity, so a 350000000 indemnity against 300000000 Coverage A settles at 360000000 with the specialty-restoration override but only 300000000 without it, and neither figure is the raw 350000000."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "A bound enrollment on a mitigation-cleared EXTREME/WITHIN_WUI property: Coverage A 300000000, extended limit 300000000, provision EXTENDED."
          setup_api_calls:
            - call: "POST /hnw/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hnw/risk-zones"
              payload: { zone_code: "ZD1", state_code: "CA", wildland_urban_interface_band: "WITHIN_WUI", sustained_wind_mph: 45, mitigation_band_multiplier: 1.0, mitigated_loss_multiplier: 1.0, exposure_band: "EXTREME" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /hnw/agencies"
              payload: { agency_code: "AG3", legal_name: "Pacific Premier Risk", state_code: "CA", delegated_authority_limit_cents: 500000000 }
              as: PlatformAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /hnw/properties"
              payload: { risk_zone_id: "${zone_id}", agency_id: "${agency_id}", address_line: "4 Canyon Ridge Rd", grid_risk_block: "RIDGE-C" }
              as: Underwriter
              captures: { p1_id: $.data.id }
            - call: "POST /hnw/properties/${p1_id}/appraisals"
              payload: { appraiser_name: "Coast Valuation", valuation_method: "SITE_MEASURED", appraised_on: "2026-08-15T00:00:00Z", dwelling_cost_cents: 200000000, contents_cost_cents: 0, valuation_confidence_pct: 95.0 }
              as: Underwriter
              captures: { appr_id: $.data.id }
            - call: "POST /hnw/appraisals/${appr_id}/review"
              payload: {}
              as: Underwriter
            - call: "POST /hnw/appraisals/${appr_id}/approve"
              payload: {}
              as: Underwriter
            - call: "GET /hnw/properties/${p1_id}"
              payload: {}
              as: Underwriter
              captures: { p1_v4: $.data.version }
            - call: "POST /hnw/properties/${p1_id}/posture-eval"
              payload: { expected_property_version: "${p1_v4}" }
              as: Underwriter
            - call: "POST /hnw/properties/${p1_id}/mitigation-requirements"
              payload: { requirement_code: "DEFENSIBLE_SPACE", band_awarded: "CLEARED", source: "UNDERWRITING", due_on: "2026-12-01T00:00:00Z" }
              as: RiskConsultant
              captures: { mit_id: $.data.id }
            - call: "POST /hnw/mitigation-requirements/${mit_id}/verify"
              payload: { verified_band: "CLEARED" }
              as: RiskConsultant
            - call: "POST /hnw/properties/${p1_id}/enrollments"
              payload: { agency_id: "${agency_id}", dwelling_coverage_cents: 300000000, contents_coverage_cents: 0, scheduled_coverage_cents: 0, loss_of_use_coverage_cents: 0 }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /hnw/enrollments/${e1_id}/submit"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
            - call: "POST /hnw/enrollments/${e1_id}/approve"
              payload: {}
              as: Underwriter
            - call: "GET /hnw/properties/${p1_id}"
              payload: {}
              as: Underwriter
              captures: { p1_v5: $.data.version }
            - call: "POST /hnw/enrollments/${e1_id}/attach"
              payload: { expected_property_version: "${p1_v5}" }
              as: Underwriter
            - call: "POST /hnw/enrollments/${e1_id}/claims"
              payload: { cause_of_loss: "WILDFIRE", loss_date: "2026-10-01T00:00:00Z", reported_indemnity_cents: 350000000, adjuster_user_id: "adj-morgan", adjuster_override: true }
              as: ClaimsAdjuster
              captures: { c1_id: $.data.id }
            - call: "POST /hnw/claims/${c1_id}/review"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /hnw/claims/${c1_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              captures: { c1_settlement: $.data.settlement_amount_cents, c1_limit: $.data.limit_applied_cents, c1_deductible: $.data.deductible_applied_cents }
          assert:
            - "Claim.${c1_id}.status == APPROVED"
            - "Claim.${c1_id}.limit_applied_cents == 300000000, the enrollment's extended_replacement_limit_cents — not the 200000000 dwelling replacement cost and not 350000000"
            - "Claim.${c1_id}.settlement_amount_cents == 360000000"
            - "Claim.${c1_id}.deductible_applied_cents == 6000000"
            - "Claim.${c1_id}.cash_settlement_eligible == false because the provision is EXTENDED, not GUARANTEED"

      - name: notice_period_nested_rounding_and_strict_boundary_modes
        grounds:
          - calculations.notice_period_days
          - entities.NonRenewalNotice.fields.seal_at
          - state_machines.NonRenewalNotice.PENDING_to_ISSUED
          - validations[priority=10]
        distinguishing_aspect: "Mode (b) order-sensitive boundary arithmetic: the notice period is counted exclusively from issued_on and inclusively to effective_on, and the sufficiency test is strictly-greater-than, so a 16-day period on a NORMAL zone (45 required) is refused while a 61-day period on a CRITICAL zone (90 required) is ALSO refused even though 61 exceeds the 60-day ELEVATED requirement — the required figure is re-read from the zone band at issue time."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "A bound enrollment whose policy has been in force since well before 2026-09-01, on a property in a NORMAL-band zone."
          setup_api_calls:
            - call: "POST /hnw/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hnw/risk-zones"
              payload: { zone_code: "ZE1", state_code: "OR", wildland_urban_interface_band: "OUTSIDE_WUI", sustained_wind_mph: 20, mitigation_band_multiplier: 1.0, mitigated_loss_multiplier: 1.0, exposure_band: "STANDARD" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /hnw/agencies"
              payload: { agency_code: "AG4", legal_name: "Willamette Premier", state_code: "OR", delegated_authority_limit_cents: 400000000 }
              as: PlatformAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /hnw/properties"
              payload: { risk_zone_id: "${zone_id}", agency_id: "${agency_id}", address_line: "9 Valley Loop", grid_risk_block: "VALLEY-A" }
              as: Underwriter
              captures: { p1_id: $.data.id }
            - call: "POST /hnw/properties/${p1_id}/appraisals"
              payload: { appraiser_name: "Cascade Valuation", valuation_method: "SITE_MEASURED", appraised_on: "2026-08-15T00:00:00Z", dwelling_cost_cents: 100000000, contents_cost_cents: 0, valuation_confidence_pct: 95.0 }
              as: Underwriter
              captures: { appr_id: $.data.id }
            - call: "POST /hnw/appraisals/${appr_id}/review"
              payload: {}
              as: Underwriter
            - call: "POST /hnw/appraisals/${appr_id}/approve"
              payload: {}
              as: Underwriter
            - call: "GET /hnw/properties/${p1_id}"
              payload: {}
              as: Underwriter
              captures: { p1_v6: $.data.version }
            - call: "POST /hnw/properties/${p1_id}/posture-eval"
              payload: { expected_property_version: "${p1_v6}" }
              as: Underwriter
            - call: "POST /hnw/properties/${p1_id}/enrollments"
              payload: { agency_id: "${agency_id}", dwelling_coverage_cents: 150000000, contents_coverage_cents: 0, scheduled_coverage_cents: 0, loss_of_use_coverage_cents: 0 }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /hnw/enrollments/${e1_id}/submit"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
            - call: "POST /hnw/enrollments/${e1_id}/approve"
              payload: {}
              as: Underwriter
            - call: "GET /hnw/properties/${p1_id}"
              payload: {}
              as: Underwriter
              captures: { p1_v7: $.data.version }
            - call: "POST /hnw/enrollments/${e1_id}/attach"
              payload: { expected_property_version: "${p1_v7}" }
              as: Underwriter
            - call: "POST /hnw/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hnw/enrollments/${e1_id}/non-renewal-notices"
              payload: { ground: "MITIGATION_FAILURE", effective_on: "2026-10-17T00:00:00Z" }
              as: Underwriter
              captures: { n1_id: $.data.id, n1_period: $.data.notice_period_days, n1_required: $.data.required_notice_days }
          trigger:
            - call: "POST /hnw/non-renewal-notices/${n1_id}/issue"
              payload: {}
              as: Underwriter
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_NOTICE_PERIOD_INSUFFICIENT"
            - "the notice computed n1_period == 16 and n1_required == 45, so the strictly-greater-than test fails"
            - "NonRenewalNotice.${n1_id}.status == PENDING and issued_on is null"
            - "after re-raising the notice with effective_on 2026-11-01, notice_period_days == 61 and issuing it succeeds against required_notice_days 45"
            - "the same 61-day period is refused in a CRITICAL zone where required_notice_days is 90"

  # ===========================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: appraisal_cycle_reopens_an_approved_valuation
        grounds:
          - state_machines.Appraisal.APPROVED_to_REVIEWED
          - state_machines.Appraisal.REVIEWED_to_APPROVED
          - state_machines.Appraisal.REVIEWED_to_SUPERSEDED
          - entities.Appraisal.fields.percent_complete
        distinguishing_aspect: "Appraisal is cyclic, not a pipeline: an APPROVED appraisal is re-opened to REVIEWED by POST /hnw/properties/{id}/valuation/reappraise, which drops its percent_complete from 1.00 to 0.00 and therefore drops the property's replacement cost from 200000000 back to 0, and the row is then free to be approved or superseded a second time."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One property carrying a single approved SITE_MEASURED appraisal of 200000000, so the property sits at UNDERWRITABLE."
          setup_api_calls:
            - call: "POST /hnw/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hnw/risk-zones"
