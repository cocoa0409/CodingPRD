            - { call: "POST /hotline/cases", payload: { channel: PHONE, category: OTHER, description: "Allegation of minor policy lapse", region: SOUTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-lb", captures: { cb: $.data.id } }
          trigger:
            - { call: "POST /hotline/cases/${ca}/triage", payload: { confirmed_category: FRAUD, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { sa: $.data.severity, la: $.data.sla_days } }
            - { call: "POST /hotline/cases/${cb}/triage", payload: { confirmed_category: OTHER, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { sb: $.data.severity, lb: $.data.sla_days } }
          assert:
            - "sa == MEDIUM (score 35) and la == 90"
            - "sb == LOW (score 15) and lb == 120"

