            - call: "POST /site-utility/pipe-segments"
              payload: { project_id: "${p_id}", utility_owner_id: "${o2_id}", segment_label: "GS-J-02", pipe_material: HDPE, diameter_in: 6, length_ft: 100.0, bedding_class: CLASS_C, design_invert_depth_ft: 6.0, design_slope_pct: 0.5, requires_dewatering: false }
              as: Foreman
              captures: { s2_id: $.data.id }
          trigger:
            - call: "POST /site-utility/shutdown-windows"
              payload: { project_id: "${p_id}", utility_owner_id: "${o1_id}", pipe_segment_id: "${s1_id}", window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T12:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              captures: { w1_id: $.data.id }
            - call: "GET /site-utility/projects/${p_id}"
              payload: {}
              as: ProjectManager
              captures: { p_v2: $.data.version }
            - call: "POST /site-utility/shutdown-windows"
              payload: { project_id: "${p_id}", utility_owner_id: "${o2_id}", pipe_segment_id: "${s2_id}", window_start: "2026-08-03T13:00:00Z", window_end: "2026-08-03T15:00:00Z", expected_project_version: "${p_v2}" }
              as: ProjectManager
              captures: { err: $.data.error_id }
            - call: "POST /site-utility/shutdown-windows"
              payload: { project_id: "${p_id}", utility_owner_id: "${o2_id}", pipe_segment_id: "${s2_id}", window_start: "2026-08-03T14:00:00Z", window_end: "2026-08-03T16:00:00Z", expected_project_version: "${p_v2}" }
              as: ProjectManager
              captures: { w3_id: $.data.id }
          assert:
            - "W2 rejected: err == ERR_PROJECT_WINDOW_BUFFER (http 409) — 60-minute gap < 120-minute required clearance"
            - "W3 (${w3_id}) PROPOSED — clearance of exactly 120 minutes satisfies the buffer (inclusive pass)"
            - "Owner-overlap rule did not fire: W2/W3 use owner O2 while W1 uses O1 (different owners never overlap)"
            - "UtilityOwner.${o1_id}.committed_shutdown_minutes == 120 and UtilityOwner.${o2_id}.committed_shutdown_minutes == 120"

  - rule_id: compensating_invariant
    instances:
      - name: owner_committed_minutes_book_then_cancel
        grounds:
          - calculations.window_hours_ledger
          - state_machines.ShutdownWindow.PROPOSED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = UtilityOwner.committed_shutdown_minutes (a
          duration ledger): booking a 180-minute PROPOSED window adds 180 and
          the compensating cancel removes exactly 180, returning the ledger to
          its pre-book value of 0. Quantity type differs from the sibling
          instance's on-hold segment count.
