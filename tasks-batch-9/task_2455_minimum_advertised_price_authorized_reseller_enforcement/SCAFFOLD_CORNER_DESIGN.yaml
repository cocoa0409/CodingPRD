            - "Violation.${vio}.assessed_points == 3"
            - "Reseller.${res}.violation_points_total == 3"

      - name: violation_noticed_to_voided_by_retroactive_exception_approval
        claim_type: valid_transition
        grounds: ["state_machines.Violation.transitions.to_VOIDED_by_exception", "state_machines.PricingException.transitions.REQUESTED_to_APPROVED"]
        distinguishing_aspect: "Approving a PROMOTIONAL_EVENT exception with override_floor 13000 covering the 2026-08-18 MARKETPLACE listing lifts the 14000 effective price above the new floor, voiding the NOTICED violation with RETROACTIVE_EXCEPTION and rescinding its notice."
        test_recipe:
          setup: ["Violation V1 NOTICED (assessed 3 points, effective advertised price 14000); a REQUESTED exception over [2026-08-10, 2026-08-25) scoped ALL asking for floor 13000."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - &EXC13000
              call: "POST /pricing-exceptions"
              payload: { product_id: "${prod}", exception_type: "PROMOTIONAL_EVENT", starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-25T00:00:00Z", channel_scope: "ALL", requested_override_floor_cents: 13000, dealer_input_source: "BRAND_MARKETING_PLAN" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { exc: $.data.id }
          trigger:
            - &EXCAPPROVE
              call: "POST /pricing-exceptions/${exc}/decision"
              payload: { decision: "APPROVE", decision_reason: "Back-to-school campaign authorized retroactively" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
          assert:
            - "HTTP 200"
            - "PricingException.${exc}.status == APPROVED"
            - "PricingException.${exc}.override_floor_cents == 13000"
            - "PricingException.${exc}.voided_violation_count == 1"
            - "Violation.${vio}.status == VOIDED"
            - "Violation.${vio}.resolution_reason == 'RETROACTIVE_EXCEPTION'"
            - "Violation.${vio}.assessed_points == null"
            - "EnforcementNotice.${not1}.status == RESCINDED"
            - "Reseller.${res}.violation_points_total == 0"
            - "Product.${prod}.open_exception_count == 1"

      - name: violation_detected_to_closed_moot_when_reseller_is_terminated
        claim_type: valid_transition
        grounds: ["state_machines.Violation.transitions.to_CLOSED_MOOT"]
        distinguishing_aspect: "A violation still in DETECTED (never noticed, assessed_points null) is mooted by termination with resolution_reason RESELLER_TERMINATED and contributes nothing to the ledger."
        test_recipe:
          setup: ["Reseller Acme driven to TERMINATION; V1 was CLOSED_MOOT from DETECTED-through-NOTICED states, and a fourth observation left V4 in DETECTED at termination time — this instance inspects V1's DETECTED-era sibling by checking the mooted V2 that had been noticed and V1 that had not."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - *OBS9000
            - *OBSEVAL2
            - *GETRESV2
            - *NOTICE2SUSP
            - *OBS14000C
            - *OBSEVAL3
            - &OBS12000D
              call: "POST /price-observations"
              payload: { product_id: "${prod}", channel: "RETAILER_SITE", seller_display_name: "Acme Store", listing_url: "https://rs.example/l/4", listed_price_cents: 12000, observed_at: "2026-08-19T00:00:00Z", evidence_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef", matched_reseller_id: "${res}" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obs4: $.data.id }
            - &OBSEVAL4
              call: "POST /price-observations/${obs4}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { vio4: $.data.violation_id }
            - *GETRESV3
          trigger:
            - *NOTICE3TERM
          assert:
            - "HTTP 201"
            - "Violation.${vio4}.status == CLOSED_MOOT"
            - "Violation.${vio4}.resolution_reason == 'RESELLER_TERMINATED'"
            - "Violation.${vio4}.assessed_points == null"
            - "Violation.${vio}.status == CLOSED_MOOT"
            - "Violation.${vio}.assessed_points == 3"
            - "Reseller.${res}.violation_points_total == 19"

      # --- EnforcementNotice (3 transitions) --------------------------------
      - name: notice_issued_to_acknowledged_by_the_owning_reseller
        claim_type: valid_transition
        grounds: ["state_machines.EnforcementNotice.transitions.ISSUED_to_ACKNOWLEDGED"]
        distinguishing_aspect: "Acknowledgement stamps acknowledged_at from the clock and changes nothing else: the violation stays NOTICED and the ledger stays at 3."
        test_recipe:
          setup: ["WARNING notice ISSUED to reseller Acme at clock 2026-08-20T00:00:00Z."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
          trigger:
            - &ACK1
              call: "POST /enforcement-notices/${not1}/acknowledge"
              payload: {}
              as: Reseller
              as_user_id: "${res}"
          assert:
            - "HTTP 200"
            - "EnforcementNotice.${not1}.status == ACKNOWLEDGED"
            - "EnforcementNotice.${not1}.acknowledged_at == '2026-08-20T00:00:00.000Z'"
            - "Violation.${vio}.status == NOTICED"
            - "Reseller.${res}.violation_points_total == 3"

      - name: notice_acknowledged_to_satisfied_when_the_cited_violation_is_cured
        claim_type: valid_transition
        grounds: ["state_machines.EnforcementNotice.transitions.to_SATISFIED"]
        distinguishing_aspect: "The ACKNOWLEDGED -> SATISFIED edge is system-driven from the cure, not from a notice endpoint, and stores closed_reason VIOLATION_CURED."
        test_recipe:
          setup: ["WARNING notice ACKNOWLEDGED; violation V1 NOTICED with cure_deadline_at 2026-08-30."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - *ACK1
          trigger:
            - call: "POST /violations/${vio}/cure-submission"
              payload: { cure_evidence_url: "https://acme.example/proof/2", corrected_price_cents: 15000, evidence_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }
              as: Reseller
              as_user_id: "${res}"
          assert:
            - "HTTP 200"
            - "EnforcementNotice.${not1}.status == SATISFIED"
            - "EnforcementNotice.${not1}.closed_reason == 'VIOLATION_CURED'"
            - "EnforcementNotice.${not1}.acknowledged_at == '2026-08-20T00:00:00.000Z'"
            - "Violation.${vio}.status == CURED"

      - name: notice_issued_to_rescinded_returns_the_violation_to_detected
        claim_type: valid_transition
        grounds: ["state_machines.EnforcementNotice.transitions.to_RESCINDED"]
        distinguishing_aspect: "Direct rescission of a WARNING notice rolls the cited violation all the way back to DETECTED with assessed_points, assessed_floor_cents and cure_deadline_at nulled, and reverses the 3 points."
        test_recipe:
          setup: ["WARNING notice ISSUED for violation V1 (assessed 3 points); reseller ledger at 3."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
          trigger:
            - call: "POST /enforcement-notices/${not1}/rescind"
              payload: { rescinded_reason: "Wrong storefront attributed" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
          assert:
            - "HTTP 200"
            - "EnforcementNotice.${not1}.status == RESCINDED"
            - "EnforcementNotice.${not1}.closed_reason == 'Wrong storefront attributed'"
            - "Violation.${vio}.status == DETECTED"
            - "Violation.${vio}.assessed_points == null"
            - "Violation.${vio}.assessed_floor_cents == null"
            - "Violation.${vio}.cure_deadline_at == null"
            - "Reseller.${res}.violation_points_total == 0"

      # --- PricingException (4 transitions) ---------------------------------
      - name: exception_requested_to_approved_raises_open_exception_count
        claim_type: valid_transition
        grounds: ["state_machines.PricingException.transitions.REQUESTED_to_APPROVED"]
        distinguishing_aspect: "Approval computes override_floor_cents 13000 from the request, stamps approved_by_user_id, and bumps Product.open_exception_count 0 -> 1 together with Product.version."
        test_recipe:
          setup: ["Product SKU-AUDIO-1 (floor 15000, no violations); one REQUESTED PROMOTIONAL_EVENT exception asking for 13000."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *EXC13000
          trigger:
            - *EXCAPPROVE
          assert:
            - "HTTP 200"
            - "PricingException.${exc}.status == APPROVED"
            - "PricingException.${exc}.override_floor_cents == 13000"
            - "PricingException.${exc}.approved_by_user_id == 'counsel-1'"
            - "PricingException.${exc}.voided_violation_count == 0"
            - "Product.${prod}.open_exception_count == 1"
            - "Product.${prod}.version == 2"

      - name: exception_requested_to_rejected_leaves_floor_null
        claim_type: valid_transition
        grounds: ["state_machines.PricingException.transitions.REQUESTED_to_REJECTED"]
        distinguishing_aspect: "Rejection is terminal, records decision_reason and approved_by_user_id, and leaves override_floor_cents null with Product.open_exception_count at 0."
        test_recipe:
          setup: ["Product SKU-AUDIO-1; one REQUESTED PROMOTIONAL_EVENT exception asking for 13000."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *EXC13000
          trigger:
