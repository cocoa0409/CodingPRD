              as: AgencyOperations
            - call: "POST /toll/agencies/${home_id}/discount-plans"
              payload: { plan_code: "STD", discount_pct: 0.0, daily_discount_cap_cents: 0, applies_to_agency_codes: ["AWAY"] }
              as: AgencyOperations
              captures: { plan_id: "$.data.id" }
            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "Gale Gate", holder_email: "gale@example.com", discount_plan_id: "${plan_id}", opening_balance_cents: 10000 }
              as: AgencyOperations
              captures: { acct: "$.data.id" }
            - call: "POST /toll/accounts/${acct}/transponders"
              payload: { tag_number: "TAG-G", vehicle_class: "CLASS_2", plate_number: "GAT100", plate_state: "NY" }
              as: AgencyOperations
            - call: "POST /toll/agencies/${away_id}/suspend"
              payload: {}
              as: SettlementOfficer
          trigger:
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-G", away_agency_id: "${away_id}", plaza_code: "P1", trip_timestamp: "2026-09-10T09:00:00Z", is_peak: false, idempotency_key: "g1" }
              as: AgencyOperations
