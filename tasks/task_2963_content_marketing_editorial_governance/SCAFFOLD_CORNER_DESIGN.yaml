            - "${state_after_1} == LIVE and ${live_at_1} == 2026-08-05T09:00:00.000Z"
            - "${a2} == 0 and ${u2} == 0 and ${s2} == 0 and ${d2} == 0 and ${f2} == 0 and ${c2} == 0 and ${g2} == 0 and ${r2} == 0 and ${z2} == 0"
            - "${state_after_2} == LIVE and ${live_at_2} == 2026-08-05T09:00:00.000Z"
            - "Distribution.${dist_id}.suppression_reason == null"
            - "ContentItem.${item_id}.workflow_state == PUBLISHED"
            - "Campaign.${cmp_id}.governance_posture == OPEN"

      - name: sweep_step_ordering_across_the_asset_expiry_chain_is_covered_by_the_difficulty_design
        claim_type: Bulk action
        grounds:
          - endpoints[POST /editorial/_ops/governance-sweep]
        excluded_because:
          difficulty_instance: transitive_cascade / sweep_asset_expiry_cascades_usage_distribution_item_and_posture
          rationale: "The ordering-sensitive half of the sweep — step 2 suppression running before step 5 activation, and each counter reflecting only its own step — is asserted end to end by the named §1.8 instance."

      - name: expert_availability_on_leave_cascade_is_covered_by_the_difficulty_design
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /editorial/experts/{id}/availability]
        excluded_because:
          difficulty_instance: transitive_cascade / expert_leave_cascades_brief_item_gates_and_campaign_posture
          rationale: "Every conditional side effect of the ON_LEAVE branch — brief unassignment, committed_hours_total reset, item demotion to CHANGES_REQUESTED, PENDING gate voiding and the posture recompute — is asserted by the named §1.8 instance."

      - name: retract_endpoint_side_effects_are_covered_by_the_difficulty_design
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /editorial/content-items/{id}/retract]
        excluded_because:
          difficulty_instance: compensating_invariant / retract_releases_asset_uses_but_keeps_the_calendar_commitment
          rationale: "Retraction's asymmetry — distributions retracted and asset uses released while the slot and campaign commitments stand — is the named §1.8 instance's subject."

      - name: prune_endpoint_side_effects_are_covered_by_the_difficulty_design
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /editorial/content-items/{id}/prune]
        excluded_because:
          difficulty_instance: compensating_invariant / prune_returns_slot_points_and_releases_asset_uses_without_drift
          rationale: "The full pruning reversal — commit_points returned to the slot and the campaign, usages released, distributions retracted and the posture recomputed with no residual drift — is asserted by the named §1.8 instance."

      - name: asset_renewal_restoration_side_effects_are_covered_by_the_difficulty_design
        claim_type: Conditional action
        grounds:
          - endpoints[POST /editorial/assets/{id}/renew]
        excluded_because:
          difficulty_instance: non_linear_state_machine / asset_license_cycle_expired_then_renewed_back_to_licensed
          rationale: "This corner covers only the renewal admissibility rule on an asset with no dependents; the RIGHTS_LAPSED -> ACTIVE and SUPPRESSED -> LIVE restorations and the posture recompute belong to the named §1.8 instance."

      - name: submit_for_review_reopening_a_changed_item_is_covered_by_the_difficulty_design
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /editorial/content-items/{id}/submit-for-review]
        excluded_because:
          difficulty_instance: non_linear_state_machine / content_item_revision_cycle_reenters_in_review_from_changes_requested
          rationale: "The reopen path — revision_number increment, CHANGES_REQUESTED and VOIDED gates returning to PENDING with fresh deadlines, and already-APPROVED siblings left alone — is the named §1.8 instance's subject."

  # ---------------------------------------------------------------------------
  # section: errors — claim-extraction-guide Table 6 asks one question only:
  # "verify every error code is triggerable". The §1.6 catalog declares 56 codes.
  # 41 of them are already triggered by an instance above or by a §1.8 instance:
  #   ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_CLOCK_REWIND,
  #   ERR_CAMPAIGN_NOT_FOUND, ERR_SLOT_NOT_FOUND, ERR_BRIEF_NOT_FOUND, ERR_ITEM_NOT_FOUND,
  #   ERR_GATE_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_ASSET_NOT_FOUND, ERR_EXPERT_NOT_FOUND,
  #   ERR_SLOT_DUPLICATE_WEEK, ERR_BRIEF_ALREADY_HAS_ITEM, ERR_SME_NOT_ASSIGNED_TO_BRIEF,
  #   ERR_GATE_ROLE_MISMATCH, ERR_STALE_EXPERT_VERSION, ERR_CAMPAIGN_STATE_INVALID,
  #   ERR_SLOT_STATE_INVALID, ERR_BRIEF_STATE_INVALID, ERR_ITEM_STATE_INVALID,
  #   ERR_GATE_ALREADY_DECIDED, ERR_ASSET_STATE_INVALID, ERR_REFRESH_NOT_REQUIRED,
  #   ERR_PRUNE_NOT_ELIGIBLE, ERR_SLOT_CAMPAIGN_MISMATCH, ERR_REGULATED_REVIEW_REQUIRED,
  #   ERR_ACCESSIBILITY_METADATA_MISSING, ERR_PUBLISH_OUTSIDE_SLOT_WEEK,
  #   ERR_ASSET_RENEWAL_NOT_EXTENDING, plus the eleven §1.8-covered codes stubbed at the
  #   end of this section.
  # The 15 remaining codes are triggered by the 13 instances below.
  # `claim_type:` is the single Table 6 row, written "Error triggerable".
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: campaign_code_uniqueness_is_global_and_case_exact
        claim_type: Error triggerable
        grounds:
          - errors[ERR_CAMPAIGN_CODE_DUPLICATE]
          - validations[priority=7]
          - entities.Campaign.fields.code
        distinguishing_aspect: "Campaign.code is globally unique, not unique per quarter or per persona: a second campaign carrying the same code but a different persona, funnel stage and quarter is still refused, while a code differing by one character is accepted. The refusal must leave exactly one campaign behind."
        test_recipe:
          setup:
            - "Empty database at the startup clock 2026-08-01T00:00:00.000Z; one campaign created with code CMP-UNIQ."
          setup_api_calls:
            - call: "POST /editorial/campaigns"
              payload: { code: "CMP-UNIQ", persona: "IT_BUYER", primary_funnel_stage: "AWARENESS", quarter_code: "2026Q3" }
              as: ManagingEditor
              captures: { first_id: $.data.id, first_code: $.data.code }
          trigger:
            - call: "POST /editorial/campaigns"
              payload: { code: "CMP-UNIQ", persona: "EXECUTIVE", primary_funnel_stage: "DECISION", quarter_code: "2026Q4" }
              as: ManagingEditor
              captures: { e_dup: $.data.error_id }
            - call: "POST /editorial/campaigns"
              payload: { code: "CMP-UNIQ2", persona: "EXECUTIVE", primary_funnel_stage: "DECISION", quarter_code: "2026Q4" }
              as: ManagingEditor
              captures: { second_id: $.data.id, second_code: $.data.code }
          assert:
            - "${first_code} == CMP-UNIQ and ${second_code} == CMP-UNIQ2"
            - "the duplicate create returns HTTP 409 and ${e_dup} == ERR_CAMPAIGN_CODE_DUPLICATE"
            - "the CMP-UNIQ2 create returns HTTP 201 and ${second_id} != ${first_id}"
            - "GET /editorial/campaigns returns total_count 2 — the refused create persisted nothing"
            - "Campaign.${first_id}.persona == IT_BUYER and quarter_code == 2026Q3, unchanged by the refused create"

      - name: content_item_create_rejects_a_campaign_version_staled_by_activation
        claim_type: Error triggerable
        grounds:
          - errors[ERR_STALE_CAMPAIGN_VERSION]
          - validations[priority=14]
          - concurrency_rules[POST /editorial/content-items]
        distinguishing_aspect: "The version captured from the create response is staled by the activation that the item create itself requires, so the naive client that remembers the campaign it created is always wrong on its first item. The refused create must not consume slot capacity, and the re-read version must then succeed."
        test_recipe:
          setup:
            - "One campaign whose version was captured at creation (1) and then staled by activate (2); an AWARENESS slot of 40 capacity points and an APPROVED brief worth 6 effort points."
          setup_api_calls:
            - call: "POST /editorial/campaigns"
              payload: { code: "CMP-OCC", persona: "PRACTITIONER", primary_funnel_stage: "AWARENESS", quarter_code: "2026Q3" }
              as: ManagingEditor
              captures: { cmp_id: $.data.id, v_at_create: $.data.version }
            - call: "POST /editorial/campaigns/${cmp_id}/activate"
              payload: {}
              as: ManagingEditor
            - call: "POST /editorial/campaigns/${cmp_id}/calendar-slots"
              payload: { week_start_date: "2026-08-03", funnel_stage: "AWARENESS", capacity_points: 40 }
              as: ManagingEditor
              captures: { slot_id: $.data.id }
            - call: "POST /editorial/experts"
              payload: { full_name: "Ines Baro", expertise_tags: ["security"], weekly_capacity_hours: 40 }
              as: ManagingEditor
              captures: { exp_id: $.data.id, exp_v: $.data.version }
            - call: "POST /editorial/briefs"
              payload: { campaign_id: "${cmp_id}", funnel_stage: "AWARENESS", search_intent: "NAVIGATIONAL", primary_keyword: "zero trust login", target_word_count: 100, required_expertise_tag: "security", review_window_start: "2026-08-03T09:00:00.000Z", review_window_end: "2026-08-03T12:00:00.000Z" }
              as: ManagingEditor
              captures: { brief_id: $.data.id }
            - call: "POST /editorial/briefs/${brief_id}/assign-sme"
              payload: { sme_expert_id: "${exp_id}", expected_expert_version: "${exp_v}" }
              as: ManagingEditor
            - call: "POST /editorial/briefs/${brief_id}/approve"
              payload: {}
              as: SubjectMatterExpertUser
              as_user_id: "${exp_id}"
            - call: "GET /editorial/campaigns/${cmp_id}"
              payload: {}
              as: ManagingEditor
              captures: { v_now: $.data.version }
          trigger:
            - call: "POST /editorial/content-items"
              payload: { brief_id: "${brief_id}", slot_id: "${slot_id}", title: "Zero trust login guide", planned_publish_at: "2026-08-05T09:00:00.000Z", expected_campaign_version: "${v_at_create}" }
              as: ManagingEditor
              as_user_id: "me-1"
              captures: { e_stale: $.data.error_id }
            - call: "POST /editorial/content-items"
              payload: { brief_id: "${brief_id}", slot_id: "${slot_id}", title: "Zero trust login guide", planned_publish_at: "2026-08-05T09:00:00.000Z", expected_campaign_version: "${v_now}" }
              as: ManagingEditor
              as_user_id: "me-1"
              captures: { item_id: $.data.id, commit: $.data.commit_points }
          assert:
            - "${v_at_create} == 1 and ${v_now} == 2"
            - "the first create returns HTTP 412 and ${e_stale} == ERR_STALE_CAMPAIGN_VERSION"
            - "after the refusal CalendarSlot.${slot_id}.committed_points == 0, utilization_pct == 0.00, status == OPEN"
            - "after the refusal Campaign.${cmp_id}.committed_points_total == 0 and version == 2 — a rejected write bumps nothing"
            - "GET /editorial/content-items?campaign_id=${cmp_id} returns total_count 0 after the refusal"
            - "the second create returns HTTP 201, ${commit} == 6 and CalendarSlot.${slot_id}.committed_points == 6"
            - "Campaign.${cmp_id}.version == 3 after the accepted create"

      - name: content_item_create_on_a_locked_slot_is_refused_while_another_week_accepts_it
        claim_type: Error triggerable
        grounds:
          - errors[ERR_SLOT_LOCKED]
          - validations[priority=16]
          - endpoints[POST /editorial/calendar-slots/{id}/lock]
        distinguishing_aspect: "Locking one week does not lock the campaign: the same brief that is refused against the LOCKED slot is accepted against a second OPEN slot of the same funnel stage in the following week, and the locked slot's committed_points stay at 0 throughout. The brief is still DRAFT, proving the lock gate at priority 16 runs without any brief-state precondition on create."
        test_recipe:
          setup:
            - "An ACTIVE campaign with two AWARENESS slots — week 2026-08-03 which is then LOCKED, and week 2026-08-10 left OPEN — and one DRAFT brief worth 6 effort points."
          setup_api_calls:
            - call: "POST /editorial/campaigns"
              payload: { code: "CMP-LOCKED", persona: "PRACTITIONER", primary_funnel_stage: "AWARENESS", quarter_code: "2026Q3" }
              as: ManagingEditor
              captures: { cmp_id: $.data.id }
            - call: "POST /editorial/campaigns/${cmp_id}/activate"
              payload: {}
              as: ManagingEditor
            - call: "POST /editorial/campaigns/${cmp_id}/calendar-slots"
              payload: { week_start_date: "2026-08-03", funnel_stage: "AWARENESS", capacity_points: 40 }
              as: ManagingEditor
