        distinguishing_aspect: "An ACCREDITATION submit with an ACCEPTED self-study but no REPORT_FILED visit fails 422 ERR_VERIFICATION_VISIT_REQUIRED — self-study acceptance alone never suffices."
        test_recipe:
          setup:
            - "MEMBER school (member_since 2026-09-01), dues through 2028-09-01, in-window COMPLIANT audit, ACCEPTED self-study, zero visits; clock 2027-09-02."
          setup_api_calls:
            - *c_clk
            - *c_cat
            - *c_act
            - call: "POST /society/schools"
              payload: { name: "NoVisit School", display_name: "NoVisit Schoolhouse", uses_method_name: false, contact_email: "nv@x.org" }
              as: SocietyAdmin
              captures: { nv_id: $.data.id }
            - call: "POST /society/schools/${nv_id}/dues-payments"
              payload: { period_start: "2026-09-01", period_end: "2028-09-01", amount_cents: 240000 }
              as: SocietyAdmin
              captures: { nv_v: $.data.version }
            - call: "POST /society/classrooms"
              payload: { school_id: "${nv_id}", name: "CN", age_level: "EARLY_CHILDHOOD", declared_age_span_years: 3, enrolled_student_count: 24, assistant_count: 1 }
              as: SchoolAdmin
              as_user_id: "${nv_id}"
              captures: { nvc_id: $.data.id }
            - call: "POST /society/school-applications"
              payload: { school_id: "${nv_id}", type: "AFFILIATION", expected_school_version: "${nv_v}" }
              as: SchoolAdmin
              as_user_id: "${nv_id}"
              captures: { na1: $.data.id }
            - call: "POST /society/school-applications/${na1}/submit"
              payload: {}
              as: SchoolAdmin
              as_user_id: "${nv_id}"
            - call: "POST /society/school-applications/${na1}/review"
              payload: { outcome: "APPROVED" }
              as: AccreditationReviewer
            - call: "POST /society/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: SocietyAdmin
            - call: "POST /society/classroom-audits"
              payload: { classroom_id: "${nvc_id}", students_present: 24, adults_present: 2, observed_uninterrupted_minutes: 180, materials_groups: [ { domain: "PRACTICAL_LIFE", required_count: 10, present_count: 10 } ] }
              as: Consultant
              as_user_id: "con-ada"
            - call: "GET /society/schools/${nv_id}"
              payload: {}
              as: SocietyAdmin
              captures: { nv_v2: $.data.version }
            - call: "POST /society/school-applications"
              payload: { school_id: "${nv_id}", type: "MEMBERSHIP", expected_school_version: "${nv_v2}" }
              as: SchoolAdmin
              as_user_id: "${nv_id}"
              captures: { na2: $.data.id }
            - call: "POST /society/school-applications/${na2}/submit"
              payload: {}
              as: SchoolAdmin
              as_user_id: "${nv_id}"
            - call: "POST /society/school-applications/${na2}/review"
              payload: { outcome: "APPROVED" }
              as: AccreditationReviewer
            - call: "GET /society/schools/${nv_id}"
              payload: {}
              as: SocietyAdmin
              captures: { nv_v3: $.data.version }
            - call: "POST /society/self-studies"
              payload: { school_id: "${nv_id}", narrative: "NoVisit self-study", expected_school_version: "${nv_v3}" }
              as: SchoolAdmin
              as_user_id: "${nv_id}"
              captures: { nvs_id: $.data.id }
            - call: "POST /society/self-studies/${nvs_id}/submit"
              payload: {}
              as: SchoolAdmin
              as_user_id: "${nv_id}"
            - call: "POST /society/self-studies/${nvs_id}/review"
              payload: { outcome: "ACCEPTED" }
              as: AccreditationReviewer
            - call: "POST /society/_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-02T00:00:00Z" }
              as: SocietyAdmin
            - call: "GET /society/schools/${nv_id}"
              payload: {}
              as: SocietyAdmin
              captures: { nv_v4: $.data.version }
            - call: "POST /society/school-applications"
              payload: { school_id: "${nv_id}", type: "ACCREDITATION", expected_school_version: "${nv_v4}" }
              as: SchoolAdmin
              as_user_id: "${nv_id}"
              captures: { na3: $.data.id }
          trigger:
            - call: "POST /society/school-applications/${na3}/submit"
              payload: {}
              as: SchoolAdmin
              as_user_id: "${nv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VERIFICATION_VISIT_REQUIRED (422): self-study ACCEPTED but no visit ever REPORT_FILED"
            - "SchoolApplication.${na3}.status remains DRAFT"

      - name: affiliation_submit_requires_at_least_one_classroom
        claim_type: Violation → Error
        grounds:
          - errors.ERR_CLASSROOM_REQUIRED
          - validations[priority=9]
        distinguishing_aspect: "An AFFILIATION submit for a dues-current school with zero classrooms fails 422 ERR_CLASSROOM_REQUIRED; after creating a classroom the same application submits."
        test_recipe:
          setup:
            - "APPLICANT school with dues paid through 2027-09-01 and a DRAFT AFFILIATION application; no classrooms yet."
          setup_api_calls:
            - *c_clk
            - *c_cat
            - *c_act
            - call: "POST /society/schools"
              payload: { name: "Empty School", display_name: "Empty Schoolhouse", uses_method_name: false, contact_email: "em@x.org" }
              as: SocietyAdmin
              captures: { em_id: $.data.id }
            - call: "POST /society/schools/${em_id}/dues-payments"
              payload: { period_start: "2026-09-01", period_end: "2027-09-01", amount_cents: 60000 }
              as: SocietyAdmin
              captures: { em_v: $.data.version }
            - call: "POST /society/school-applications"
              payload: { school_id: "${em_id}", type: "AFFILIATION", expected_school_version: "${em_v}" }
              as: SchoolAdmin
              as_user_id: "${em_id}"
              captures: { ea_id: $.data.id }
          trigger:
            - call: "POST /society/school-applications/${ea_id}/submit"
              payload: {}
              as: SchoolAdmin
              as_user_id: "${em_id}"
              captures: { err: $.data.error_id }
            - call: "POST /society/classrooms"
              payload: { school_id: "${em_id}", name: "First Room", age_level: "EARLY_CHILDHOOD", declared_age_span_years: 3, enrolled_student_count: 12, assistant_count: 1 }
              as: SchoolAdmin
              as_user_id: "${em_id}"
            - call: "POST /society/school-applications/${ea_id}/submit"
              payload: {}
              as: SchoolAdmin
              as_user_id: "${em_id}"
              captures: { ok: $.data.status }
          assert:
            - "err == ERR_CLASSROOM_REQUIRED (422) while the school has zero classrooms"
            - "after creating one classroom the identical submit succeeds: ok == UNDER_REVIEW"

      - name: second_in_flight_application_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_IN_FLIGHT_APPLICATION_EXISTS
          - validations[priority=9]
        distinguishing_aspect: "With an AFFILIATION application still DRAFT, a second application create carrying the CURRENT school version passes OCC yet fails 409 ERR_IN_FLIGHT_APPLICATION_EXISTS."
        test_recipe:
          setup:
            - "School with a DRAFT application; school version re-read after the first create."
          setup_api_calls:
            - *c_clk
            - *c_cat
            - *c_act
            - call: "POST /society/schools"
              payload: { name: "IF App School", display_name: "IF App Schoolhouse", uses_method_name: false, contact_email: "ifa@x.org" }
              as: SocietyAdmin
              captures: { ia_id: $.data.id, ia_v: $.data.version }
            - call: "POST /society/school-applications"
              payload: { school_id: "${ia_id}", type: "AFFILIATION", expected_school_version: "${ia_v}" }
              as: SchoolAdmin
              as_user_id: "${ia_id}"
              captures: { ia1: $.data.id }
            - call: "GET /society/schools/${ia_id}"
              payload: {}
              as: SocietyAdmin
              captures: { ia_v2: $.data.version }
          trigger:
            - call: "POST /society/school-applications"
              payload: { school_id: "${ia_id}", type: "AFFILIATION", expected_school_version: "${ia_v2}" }
              as: SchoolAdmin
              as_user_id: "${ia_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_IN_FLIGHT_APPLICATION_EXISTS (409) despite the fresh OCC version ${ia_v2}"
            - "GET /society/school-applications?school_id=${ia_id} still returns exactly 1 row (the original DRAFT)"

  - section: errors
    instances:

      - name: not_found_sweep_remaining_entities
        claim_type: Violation → Error
        grounds:
          - errors.ERR_CLASSROOM_NOT_FOUND
          - errors.ERR_PROGRAM_NOT_FOUND
          - errors.ERR_LEARNER_NOT_FOUND
          - errors.ERR_PLACEMENT_NOT_FOUND
          - errors.ERR_APPLICATION_NOT_FOUND
          - errors.ERR_SELF_STUDY_NOT_FOUND
          - errors.ERR_VISIT_NOT_FOUND
          - errors.ERR_CATALOG_NOT_FOUND
          - errors.ERR_CE_ENTRY_NOT_FOUND
        distinguishing_aspect: "The remaining nine entity-specific 404s each fire on a single-GET (or sub-path) with a syntactically valid but unallocated id — every catalogued NOT_FOUND variant is reachable."
        test_recipe:
          setup:
            - "Empty database; clock at default."
          setup_api_calls:
            - *c_clk
          trigger:
            - call: "GET /society/classrooms/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SocietyAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /society/teacher-education-programs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SocietyAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /society/adult-learners/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SocietyAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /society/practicum-placements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SocietyAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /society/school-applications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SocietyAdmin
              captures: { e5: $.data.error_id }
            - call: "GET /society/self-studies/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SocietyAdmin
              captures: { e6: $.data.error_id }
            - call: "GET /society/verification-visits/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SocietyAdmin
              captures: { e7: $.data.error_id }
            - call: "GET /society/standards-catalogs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SocietyAdmin
              captures: { e8: $.data.error_id }
            - call: "GET /society/ce-entries/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SocietyAdmin
              captures: { e9: $.data.error_id }
          assert:
            - "e1 == ERR_CLASSROOM_NOT_FOUND, e2 == ERR_PROGRAM_NOT_FOUND, e3 == ERR_LEARNER_NOT_FOUND (all 404)"
            - "e4 == ERR_PLACEMENT_NOT_FOUND, e5 == ERR_APPLICATION_NOT_FOUND, e6 == ERR_SELF_STUDY_NOT_FOUND (all 404)"
            - "e7 == ERR_VISIT_NOT_FOUND, e8 == ERR_CATALOG_NOT_FOUND, e9 == ERR_CE_ENTRY_NOT_FOUND (all 404)"
