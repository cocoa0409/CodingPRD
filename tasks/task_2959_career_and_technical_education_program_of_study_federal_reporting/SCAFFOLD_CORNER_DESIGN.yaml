            - "One DRAFT ProgramOfStudy with an ACTIVE advisory committee whose quorum_min_members is 3 and employer_seat_min is 2."
            - "Three seated members on terms 2026-01-01 to 2027-12-31: two EMPLOYER (one of them the chair) and one POSTSECONDARY."
