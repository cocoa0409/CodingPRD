          setup:
            - "Zone Z-A66 created with occupied_units 2000, 20 structure fires, 2 injuries, pre_1980 60.0, senior 25.0, under5 10.0, disability 5.0, assumed_alarm_absence_pct 30.0 (component points 40.00 + 10.00 + 9.00 + 4.40 + 3.00 = 66.40 -> TIER_2) and one household with adults_65plus 1 whose deferred visit was completed with pre_existing_working_smoke_alarms 0 (surveyed_units 1, surveyed_units_without_alarm 1 -> VALIDATED gap 100.00 -> alarm_points capped at 10.00 -> 73.40)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
