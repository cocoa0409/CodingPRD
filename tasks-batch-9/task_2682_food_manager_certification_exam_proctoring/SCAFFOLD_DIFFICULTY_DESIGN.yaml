            - "ScoreReport.${sr_id}.pass_flag == true (73 >= 70) although the provisional 69 was below the cut"
            - "ScoreReport.${sr_id}.status == FINAL and ScoreReport.${sr_id}.finalized_by_user_id == \"admin-scoring-1\""
