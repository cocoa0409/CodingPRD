          assert:
            - "response error_id == ERR_WINDOW_EXPIRED"
            - "Order.${ord_id}.fulfillment_status == DELIVERED"
            - "Order.${ord_id}.payment_status == PAID"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: full_refund_conserves_paid_amount_to_zero   # conserved: Order.paid_amount_cents
        grounds:
          - state_machines.Order.DELIVERED_to_RETURNED
          - state_machines.Order.PAID_to_REFUNDED
          - entities.Order.fields.paid_amount_cents
        distinguishing_aspect: |
          Conserved quantity #1 = Order.paid_amount_cents. The forward action (pay) sets paid_amount_cents=20000;
          the compensating action (complete-return -> full refund) MUST drive it back to exactly 0 — the named
          invariant paid_amount_cents after (pay then full refund) == 0, no drift.
        test_recipe:
          setup:
            - "Seller S, Buyer B; BUY_NOW 20000 bought, paid (paid_amount_cents 20000), shipped, delivered at 2026-06-02; within return window."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s17@x.com", display_name: "S17", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "b17@x.com", display_name: "B17", roles: ["BUYER"] }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
