              as: RevenueManager
          assert:
            - "Arrival on the closed date: HTTP 422 with data.error_id == ERR_CLOSED_TO_ARRIVAL"
            - "Arrival 2026-09-10 for 3 nights: HTTP 201 with reservation_state CONFIRMED and departure_date 2026-09-13, even though night 2 is the closed date"
            - "The accepted stay prices at gross_amount_cents 75000 / commission_amount_cents 0 / net_amount_cents 75000 with three nightly_breakdown rows of sell_rate_cents 25000"
