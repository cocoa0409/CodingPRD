        distinguishing_aspect: "With removal_quota_per_cycle 1 and per_member_removal_subcap 5, the second draft breaches the shared pool while the member's own sub-cap still has room, so the reported error is ERR_REMOVAL_QUOTA_EXCEEDED (rung 45) and not ERR_MEMBER_SUBCAP_EXCEEDED (rung 46)."
        test_recipe:
          setup:
