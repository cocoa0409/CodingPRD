  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: member_assignment_half_open_intervals
        grounds:
          - validations[priority=25]
          - entities.TeamAssignment.fields.start_date
          - entities.TeamAssignment.fields.end_date
          - errors[ERR_ASSIGNMENT_OVERLAP]
        distinguishing_aspect: |
          Resource: CorpsMember (pairwise interval semantics). Assignment
          intervals are half-open [start_date, end_date): an open-ended active
          assignment overlaps any later start, but an existing assignment whose
          end_date equals the new start_date is adjacent, NOT overlapping.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Site ACTIVE, school ACTIVE. Team Alpha and Team Beta exist at the school. Member ACTIVE with an ACTIVE assignment on Team Alpha starting 2026-09-01 (open-ended)."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_site_on
            - *k_school
            - *k_ds_sign
            - *k_agr_sign
            - *k_agr_active
            - *k_team
            - *k_app
            - *k_screen
            - *k_interview
            - *k_offer
            - *k_accept
            - *k_enroll
            - *k_activate
            - *k_assign
            - call: "POST /corps/teams"
              payload: { school_id: "${school_id}", name: "Team Beta", backfill_deadline: "2027-01-15", backfill_limit: 2 }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { team2_id: $.data.id, team2_v: $.data.version }
          trigger:
            - call: "POST /corps/teams/${team2_id}/assignments"
              payload: { corps_member_id: "${member_id}", start_date: "2026-10-01", expected_team_version: "${team2_v}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { ovl_err: $.data.error_id }
            - call: "POST /corps/team-assignments/${asg_id}/end"
              payload: { end_date: "2026-12-15" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /corps/teams/${team2_id}/assignments"
              payload: { corps_member_id: "${member_id}", start_date: "2026-12-15", expected_team_version: "${team2_v}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { asg2_st: $.data.status, asg2_start: $.data.start_date }
          assert:
            - "${ovl_err} == ERR_ASSIGNMENT_OVERLAP (existing [2026-09-01, open) swallows the 2026-10-01 start)"
            - "The failed attempt did not bump Team Beta's version (rejection mutated nothing — the identical ${team2_v} succeeds afterwards)"
            - "${asg2_st} == ACTIVE and ${asg2_start} == 2026-12-15 (adjacency at end == start is allowed under half-open semantics)"

