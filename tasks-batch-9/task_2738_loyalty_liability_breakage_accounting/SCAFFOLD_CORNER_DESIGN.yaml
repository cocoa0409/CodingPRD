# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
#
# Domain: Loyalty Liability & Breakage Accounting (retail loyalty finance)
# Companion to SCAFFOLD.yaml §1.1-§1.7 and SCAFFOLD_DIFFICULTY_DESIGN.yaml §1.8.
#
# `section:` values and `claim_type:` values are taken verbatim from
# references/claim-extraction-guide.md; no category is invented here.
#
# Where a corner is already asserted by a §1.8 instance, this file carries an
# `excluded_because:` stub naming that instance and carries NO test_recipe.
#
# UNIT CONVENTIONS (identical to SCAFFOLD.yaml):
#   * all money is integer CENTS
#   * ssp_millicents_per_point / *_rate_millicents_per_point are THOUSANDTHS OF
#     A CENT per point
#   * every rate/multiplier is BASIS POINTS (10000 bp == 1.0000)
#   * round_half_up(x) == Decimal ROUND_HALF_UP to 0 decimal places
#
# The unknown-id literal used by every 404 corner is
# 'ffffffff-ffff-ffff-ffff-ffffffffffff', which no chain here ever mints.
#
# Every numeric literal in every `assert:` line was produced by executing the
# matching SCAFFOLD.yaml §1.3 formula in Python with Decimal ROUND_HALF_UP.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — entities
  # ===========================================================================
  - section: entities
    instances:

      - name: entity_program_creation_returns_declared_and_computed_fields
        claim_type: Creation
        grounds:
          - entities.LoyaltyProgram
          - endpoints[POST /programs]
          - response_envelope.success
        distinguishing_aspect: "POST /programs with every input field present returns 201, status DRAFT, version 1, current_breakage_rate_bp 0 (not yet seeded) and the success envelope's response_type 'object'."
        test_recipe:
          setup:
            - "Empty database. Logical clock set to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /programs"
              payload: { name: "Corner Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          assert:
            - "HTTP status is 201 and the body has meta.api_request_id, meta.api_request_timestamp, response_type == 'object' and a data object"
            - "LoyaltyProgram.${prog_id}.name == 'Corner Core', ssp_millicents_per_point == 1200, point_expiry_days == 730, per_issuance_point_cap == 5000, historical_redemption_rate_bp == 7500"
            - "LoyaltyProgram.${prog_id}.tier_multiplier_bp == {BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000}"
            - "LoyaltyProgram.${prog_id}.status == DRAFT (system field, not supplied by the client)"
            - "LoyaltyProgram.${prog_id}.current_breakage_rate_bp == 0, total_escheat_accrual_cents == 0, escheat_disclosure_required == false, recognized_breakage_ytd_cents == 0, total_deferred_revenue_cents == 0"
            - "LoyaltyProgram.${prog_id}.version == 1 and created_at == '2026-08-01T00:00:00Z'"

      - name: entity_program_retrieval_returns_stored_values
        claim_type: Retrieval
        grounds:
          - endpoints[GET /programs/{id}]
          - entities.LoyaltyProgram.fields.total_deferred_revenue_cents
        distinguishing_aspect: "GET /programs/{id} returns the same stored values POST returned, and re-derives total_deferred_revenue_cents on read as 4500 once one lot exists."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Program 'Corner Core' ACTIVE (ssp 1200, cap 5000, historical 7500 so current_breakage_rate_bp is 2500) with rule TX, cohort C1, member M1 BASE/TX and period per1 [2026-08-01, 2026-09-01)."
            - "One BASE lot of base_points 5000: gross 6000, reserve 1500, deferred 4500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Corner Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "TX", tier: "BASE" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 5000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot1_id: $.data.id }
          trigger:
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: LoyaltyAccountant
              captures: { prog_v: $.data.version }
          assert:
            - "HTTP status is 200, response_type == 'object'"
            - "LoyaltyProgram.${prog_id}.status == ACTIVE and current_breakage_rate_bp == 2500 (10000 - 7500, seeded at activation)"
            - "LoyaltyProgram.${prog_id}.total_deferred_revenue_cents == 4500 - derived on read from the single lot's deferred_revenue_cents"
            - "LoyaltyProgram.${prog_id}.recognized_breakage_ytd_cents == 0 - no period is SOFT_CLOSED or HARD_CLOSED"
            - "The captured ${prog_v} is an integer >= 2 (creation 1, activation +1) and is the value an OCC caller must echo back"

      - name: entity_point_lot_listing_paginates_and_filters_together
        claim_type: Listing
        grounds:
          - endpoints[GET /point-lots]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /point-lots returns total_count and has_more, honours limit/offset, and applies the lifecycle_state filter BEFORE paginating so total_count reflects the filtered set, not the whole table."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Program 'Corner Core' ACTIVE (ssp 1200, cap 5000) with rule TX, cohort C1, member M1 BASE/TX, period per1 [2026-08-01, 2026-09-01)."
            - "Three BASE lots of 1000 points each (gross 1200, deferred 900 apiece), all OUTSTANDING; M1.point_balance is 3000."
            - "One CATALOG RedemptionEvent for 1000 points, ALLOCATED, which drives the FIRST lot to FULLY_REDEEMED and leaves two OUTSTANDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Corner Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "TX", tier: "BASE" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 1000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot_a_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 1000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot_b_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 1000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot_c_id: $.data.id }
            - call: "POST /redemption-events"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", points_requested: 1000, redemption_type: "CATALOG" }
              as: LoyaltyAccountant
              captures: { rev1_id: $.data.id }
            - call: "POST /redemption-events/${rev1_id}/allocate"
              payload: {}
              as: LoyaltyAccountant
          trigger:
            - call: "GET /point-lots"
              payload: { period_id: "${per1_id}", limit: 2, offset: 0 }
              as: LoyaltyAccountant
            - call: "GET /point-lots"
              payload: { period_id: "${per1_id}", limit: 2, offset: 2 }
              as: LoyaltyAccountant
            - call: "GET /point-lots"
              payload: { period_id: "${per1_id}", lifecycle_state: "OUTSTANDING", limit: 10, offset: 0 }
              as: LoyaltyAccountant
          assert:
            - "PAGE 1 returns response_type == 'array' with 2 data items, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "PAGE 2 returns 1 data item, total_count == 3, has_more == false, offset == 2"
            - "FILTERED returns 2 data items and total_count == 2 - the filter is applied before counting, so ${lot_a_id} (FULLY_REDEEMED) is excluded"
            - "PointLot.${lot_a_id}.lifecycle_state == FULLY_REDEEMED while ${lot_b_id} and ${lot_c_id} are OUTSTANDING with points_remaining 1000 each"
            - "Omitting limit and offset entirely returns limit == 10 and offset == 0, the declared pagination defaults"

      - name: entity_get_member_with_unknown_id_returns_member_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /members/{id}]
          - validations[priority=40]
          - errors[ERR_MEMBER_NOT_FOUND]
        distinguishing_aspect: "GET /members/{unknown} returns HTTP 404 with error_id ERR_MEMBER_NOT_FOUND and the error envelope's response_type 'error', not a 200 with a null data object."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Program 'Corner Core' DRAFT with rule TX and cohort C1 exists; no Member has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Corner Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /members/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: LoyaltyAccountant
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404 and response_type == 'error'"
            - "data.error_id == ERR_MEMBER_NOT_FOUND and data.message is a non-empty string"
            - "GET /members returns total_count == 0 - the failed read created nothing"

      - name: entity_cohort_create_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - endpoints[POST /cohorts]
          - validations[priority=30]
          - errors[ERR_INVALID_REQUEST]
          - entities.Cohort.fields.observed_redemption_rate_bp
        distinguishing_aspect: "observed_redemption_rate_bp has source input and no default, so omitting it yields HTTP 400 ERR_INVALID_REQUEST rather than defaulting to 0."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Program 'Corner Core' exists in DRAFT; no Cohort exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Corner Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", sample_size: 40000 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /cohorts?program_id=${prog_id} returns total_count == 0 - no partially populated Cohort row was written"
            - "The same body plus observed_redemption_rate_bp: 8200 returns 201, confirming the field was the only thing missing"

      - name: entity_program_omitted_optional_inputs_apply_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.LoyaltyProgram.fields.currency_code
          - entities.LoyaltyProgram.fields.promo_multiplier_cap_bp
          - entities.LoyaltyProgram.fields.breakage_method
          - entities.LoyaltyProgram.fields.escheat_disclosure_threshold_cents
          - entities.PointLot.fields.promo_multiplier_bp
        distinguishing_aspect: "Omitting all four optional program inputs yields currency_code 'USD', promo_multiplier_cap_bp 30000, breakage_method COHORT_WEIGHTED and escheat_disclosure_threshold_cents 100000; omitting promo_multiplier_bp on a lot yields 10000 and promo_expense_cents 0."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /programs"
              payload: { name: "Default Core", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, historical_redemption_rate_bp: 7500 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "TX", tier: "BASE" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 1000 }
              as: LoyaltyAccountant
              captures: { lot1_id: $.data.id }
          assert:
            - "LoyaltyProgram.${prog_id}.currency_code == 'USD'"
            - "LoyaltyProgram.${prog_id}.promo_multiplier_cap_bp == 30000"
            - "LoyaltyProgram.${prog_id}.breakage_method == COHORT_WEIGHTED"
            - "LoyaltyProgram.${prog_id}.escheat_disclosure_threshold_cents == 100000"
            - "Cohort.${coh1_id}.program_change_adjustment_bp == 0 - the omitted optional adjustment defaults to zero"
            - "PointLot.${lot1_id}.promo_multiplier_bp == 10000 (identity multiplier), points_issued == 1000, promo_expense_cents == 0"
            - "PointLot.${lot1_id}.gross_ssp_cents == 1200, breakage_reserve_cents == 300, deferred_revenue_cents == 900"

      - name: entity_point_lot_computed_measurement_fields_derived_from_config
        claim_type: Computed Fields
        grounds:
          - entities.PointLot.fields.points_issued
          - entities.PointLot.fields.gross_ssp_cents
          - entities.PointLot.fields.breakage_reserve_cents
          - entities.PointLot.fields.deferred_revenue_cents
          - entities.PointLot.fields.tier_expense_cents
          - entities.PointLot.fields.expires_at
          - calculations.point_issuance_measurement
        distinguishing_aspect: "Every PointLot money field is derived from base_points plus program config: base 4000 at GOLD 12500 gives points_issued 5000, gross 6000, reserve 1500, deferred 4500, tier_expense 1200 and expires_at 2028-07-31T00:00:00Z, none of which appear in the request body."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Program 'Corner Core' ACTIVE (ssp 1200, point_expiry_days 730, cap 5000, GOLD 12500, historical 7500 so current_breakage_rate_bp is 2500), rule TX, cohort C1, member M1 GOLD/TX, period per1 [2026-08-01, 2026-09-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Corner Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "TX", tier: "GOLD" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
          trigger:
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 4000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot1_id: $.data.id }
          assert:
            - "PointLot.${lot1_id}.base_points == 4000 (the only quantity the client supplied) and tier_multiplier_bp_at_issue == 12500, copied from the program's GOLD entry"
            - "PointLot.${lot1_id}.points_issued == 5000, gross_ssp_cents == 6000"
            - "PointLot.${lot1_id}.breakage_rate_bp_at_issue == 2500 and breakage_reserve_cents == 1500 and deferred_revenue_cents == 4500"
            - "PointLot.${lot1_id}.tier_expense_cents == 1200 and promo_expense_cents == 0"
            - "PointLot.${lot1_id}.points_remaining == 5000, remaining_gross_ssp_cents == 6000, remaining_deferred_cents == 4500, expired_gross_ssp_cents == 0, escheated_cents == 0"
            - "PointLot.${lot1_id}.expires_at == '2028-07-31T00:00:00Z' (issued_at 2026-08-01 plus 730 days)"
            - "PointLot.${lot1_id}.lifecycle_state == OUTSTANDING and settlement_state == NOT_APPLICABLE - no partner_agreement_id was supplied"

      - name: entity_system_fields_minted_by_server_on_create
        claim_type: System Fields
        grounds:
          - entities.AccountingPeriod.fields.state
          - entities.AccountingPeriod.fields.reopen_count
          - endpoints[POST /accounting-periods]
          - response_envelope.success
        distinguishing_aspect: "POST /accounting-periods mints id, created_at, updated_at and version 1 and sets state OPEN with reopen_count 0 and all eight rollforward figures at 0, none of which are inputs."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Program 'Corner Core' ACTIVE with rule TX and cohort C1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
