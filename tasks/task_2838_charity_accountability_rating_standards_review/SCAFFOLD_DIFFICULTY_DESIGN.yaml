              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1: $.data.id, org1_v1: $.data.version }
            - call: "POST /filing-records"
              payload: { organization_id: "${org1}", fiscal_year: 2025, source_kind: "AUDITED_STATEMENT", total_expense_cents: 10000000, program_expense_cents: 8000000, fundraising_expense_cents: 1200000, admin_expense_cents: 800000, contributions_cents: 9000000, total_revenue_cents: 11000000, net_assets_cents: 6000000, total_liabilities_cents: 2000000, joint_cost_allocated_cents: 500000, expected_organization_version: "${org1_v1}" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { f2025: $.data.id }
            - call: "GET /organizations/${org1}"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { org1_v2: $.data.version }
            - call: "POST /filing-records"
              payload: { organization_id: "${org1}", fiscal_year: 2024, source_kind: "AUDITED_STATEMENT", total_expense_cents: 6000000, program_expense_cents: 4500000, fundraising_expense_cents: 1000000, admin_expense_cents: 500000, contributions_cents: 5000000, total_revenue_cents: 6500000, net_assets_cents: 3000000, total_liabilities_cents: 1000000, expected_organization_version: "${org1_v2}" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { f2024: $.data.id }
            - call: "GET /organizations/${org1}"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { org1_v3: $.data.version }
            - call: "POST /filing-records"
              payload: { organization_id: "${org1}", fiscal_year: 2023, source_kind: "AUDITED_STATEMENT", total_expense_cents: 4000000, program_expense_cents: 2800000, fundraising_expense_cents: 900000, admin_expense_cents: 300000, contributions_cents: 3000000, total_revenue_cents: 4200000, net_assets_cents: 2000000, total_liabilities_cents: 800000, expected_organization_version: "${org1_v3}" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { f2023: $.data.id }
            - call: "POST /filing-records/${f2025}/validate"
              payload: { decision: "ACCEPT" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /filing-records/${f2024}/validate"
              payload: { decision: "ACCEPT" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /filing-records/${f2023}/validate"
              payload: { decision: "ACCEPT" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /rating-cycles"
              payload: { organization_id: "${org1}", methodology_version_id: "${m1}", fiscal_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", assigned_analyst_user_id: "analyst-1" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { c1: $.data.id }
            - call: "POST /governance-profiles"
              payload: { rating_cycle_id: "${c1}", board_member_count: 7, independent_board_member_count: 4, conflict_of_interest_policy_on_file: true, coi_policy_reviewed_at: "2026-03-01T00:00:00Z", board_meetings_last_year: 4, audit_committee_exists: true, whistleblower_policy: true, ceo_compensation_reviewed: false, impact_report_on_file: true, outcome_measures_count: 3, third_party_evaluation_on_file: true }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { g1: $.data.id }
            - call: "POST /governance-profiles/${g1}/evaluate"
              payload: {}
              as: RatingAnalyst
              as_user_id: "analyst-1"
