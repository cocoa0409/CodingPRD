# =============================================================================
# §1.9 Scaffold Corner Design — task_3491
# Breadth probe over §1.1–§1.7 claims not covered by SCAFFOLD_DIFFICULTY_DESIGN.
# Server default clock: 2026-09-01T00:00:00Z (never wall-clock).
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: participant_create_returns_defaults
        claim_type: Creation
        grounds:
          - entities.Participant
          - endpoints.POST_/network/participants
          - state_machines.Participant
        distinguishing_aspect: "A participant created with the three required fields comes back 201 with status ONBOARDING, version 1, current_period null, current_period_fees_cents 0, and server-stamped id/created_at/updated_at — status and fee fields are never client-supplied."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T09:00:00Z. Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /network/participants"
              payload: { legal_name: "First Originating Bank", participant_type: "ODFI", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
          assert:
            - "response status is 201, response_type is object, meta.api_request_id and meta.api_request_timestamp are present"
            - "Participant.${p1}.status == ONBOARDING and version == 1"
            - "Participant.${p1}.current_period is null and current_period_fees_cents == 0"
            - "id, created_at, updated_at are present and non-null"

      - name: participant_get_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/network/participants/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but unknown participant id returns 404 ERR_NOT_FOUND inside the error envelope."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /network/participants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status is 404 with data.error_id == ERR_NOT_FOUND"

      - name: participants_list_pagination_total_count
        claim_type: Listing
        grounds:
          - endpoints.GET_/network/participants
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three participants on file, limit=2&offset=0 returns 2 rows, total_count 3, has_more true; offset=2 returns the final row with has_more false — total_count counts the whole filtered set, not the page."
        test_recipe:
          setup: ["Three participants registered."]
          setup_api_calls:
            - call: "POST /network/participants"
              payload: { legal_name: "Bank One", participant_type: "ODFI", routing_number: "111000025" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "Bank Two", participant_type: "RDFI", routing_number: "222000039" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "Bank Three", participant_type: "BOTH", routing_number: "333000041" }
              as: PlatformAdmin
          trigger:
            - call: "GET /network/participants?limit=2&offset=0"
              payload: {}
              as: Auditor
            - call: "GET /network/participants?limit=2&offset=2"
              payload: {}
              as: Auditor
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2: 1 item, total_count == 3, has_more == false"

      - name: participant_create_missing_routing_number_rejected
        claim_type: Required Fields
        grounds:
          - entities.Participant.fields.routing_number
          - validations[priority=3]
        distinguishing_aspect: "Omitting the required routing_number yields 400 ERR_INVALID_REQUEST with the full error envelope (error_id + message under data, response_type error, meta present)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /network/participants"
              payload: { legal_name: "No Routing Bank", participant_type: "ODFI" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status is 400, data.error_id == ERR_INVALID_REQUEST, data.message is a non-empty string"
            - "response_type == error and meta.api_request_id is present"

      - name: participant_create_invalid_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Participant.fields.participant_type
          - validations[priority=3]
        distinguishing_aspect: "participant_type \"BANK\" is outside {ODFI, RDFI, BOTH} and is rejected 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /network/participants"
              payload: { legal_name: "Bad Enum Bank", participant_type: "BANK", routing_number: "444000017" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status is 400 with data.error_id == ERR_INVALID_REQUEST"

      - name: participant_create_duplicate_routing_number_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Participant.fields.routing_number
          - validations[priority=5]
        distinguishing_aspect: "The second participant presenting routing_number 111000025 is rejected 409 ERR_DUPLICATE_RESOURCE even though every other field differs."
        test_recipe:
          setup: ["One participant with routing_number 111000025 exists."]
          setup_api_calls:
            - call: "POST /network/participants"
              payload: { legal_name: "Bank One", participant_type: "ODFI", routing_number: "111000025" }
              as: PlatformAdmin
          trigger:
            - call: "POST /network/participants"
              payload: { legal_name: "Bank Two", participant_type: "RDFI", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status is 409 with data.error_id == ERR_DUPLICATE_RESOURCE"

      - name: settlement_window_has_no_version_or_updated_at
        claim_type: Immutability
        grounds:
          - entities.SettlementWindow
        distinguishing_aspect: "SettlementWindow declares common_fields false: the create response carries id and created_at but exposes neither version nor updated_at, and no update endpoint exists for it."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /network/settlement-windows"
              payload: { window_code: "W1", cutoff_time_utc: "17:00", per_entry_limit_cents: 100000000, odfi_window_cap_cents: 2500000000 }
              as: PlatformAdmin
              captures: { w1: $.data.id }
          assert:
            - "response status is 201; data contains id and created_at"
            - "data has NO version key and NO updated_at key"

      - name: originator_create_defaults_pending_with_zero_exposure
        claim_type: Defaults
        grounds:
          - entities.Originator.fields.status
          - entities.Originator.fields.committed_exposure_cents
        distinguishing_aspect: "A new originator starts PENDING_DUE_DILIGENCE with committed_exposure_cents 0, contingent_exposure_cents 0, version 1, and participant_id taken from X-User-ID (not from the request body)."
        test_recipe:
          setup: ["P1 registered (ONBOARDING)."]
          setup_api_calls:
            - call: "POST /network/participants"
              payload: { legal_name: "Bank One", participant_type: "ODFI", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /network/originators"
              payload: { legal_name: "Alpha Payroll Corp", risk_tier: "STANDARD", exposure_limit_cents: 1000000000 }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { o1: $.data.id }
          assert:
            - "Originator.${o1}.status == PENDING_DUE_DILIGENCE, committed_exposure_cents == 0, contingent_exposure_cents == 0, version == 1"
            - "Originator.${o1}.participant_id == ${p1} (from X-User-ID)"

      - name: entry_create_with_server_supplied_status_rejected
        claim_type: System Fields
        grounds:
          - entities.PaymentEntry.fields.status
          - validations[priority=3]
        distinguishing_aspect: "A create payload smuggling the system-owned field status is rejected 400 ERR_INVALID_REQUEST — clients cannot mint a SETTLED entry."
        test_recipe:
          setup: ["P1 ACTIVE, O1 APPROVED, PPD code, W1 window."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "Bank One", participant_type: "ODFI", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /network/participants/${p1}/transition"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /network/transaction-codes"
              payload: { code: "PPD", entry_class: "DEBIT", authorization_requirement: "NONE", return_timeframe_banking_days: 30, account_validation_required: false, warranty_obligations: "ODFI warrants authorization" }
              as: PlatformAdmin
              captures: { tc_ppd: $.data.id }
            - call: "POST /network/settlement-windows"
              payload: { window_code: "W1", cutoff_time_utc: "17:00", per_entry_limit_cents: 100000000, odfi_window_cap_cents: 2500000000 }
              as: PlatformAdmin
              captures: { w1: $.data.id }
            - call: "POST /network/originators"
              payload: { legal_name: "Alpha Payroll Corp", risk_tier: "STANDARD", exposure_limit_cents: 1000000000 }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { o1: $.data.id }
            - call: "POST /network/originators/${o1}/transition"
              payload: { to_state: "APPROVED" }
              as: ParticipantOfficer
              as_user_id: "${p1}"
          trigger:
            - call: "POST /network/payment-entries"
              payload: { originator_id: "${o1}", transaction_code_id: "${tc_ppd}", amount_cents: 1000, receiver_account_number_hash: "acct-s", receiver_name: "R S", authorization_type: "NONE", same_day: false, status: "SETTLED" }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "response status is 400 with data.error_id == ERR_INVALID_REQUEST"

      - name: return_record_reason_class_is_computed
        claim_type: Computed Fields
        grounds:
          - entities.ReturnRecord.fields.reason_class
        distinguishing_aspect: "reason_class is derived server-side: reason_code STOP_PAYMENT yields reason_class OTHER on the created ReturnRecord."
        test_recipe:
          setup: ["P1 ODFI ACTIVE with O1 APPROVED and entry E settled 2026-09-01; P2 RDFI ACTIVE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "Bank One", participant_type: "ODFI", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /network/participants/${p1}/transition"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "Bank Two", participant_type: "RDFI", routing_number: "222000039" }
              as: PlatformAdmin
              captures: { p2: $.data.id }
            - call: "POST /network/participants/${p2}/transition"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /network/transaction-codes"
              payload: { code: "PPD", entry_class: "DEBIT", authorization_requirement: "NONE", return_timeframe_banking_days: 30, account_validation_required: false, warranty_obligations: "ODFI warrants authorization" }
              as: PlatformAdmin
              captures: { tc_ppd: $.data.id }
            - call: "POST /network/settlement-windows"
              payload: { window_code: "W1", cutoff_time_utc: "17:00", per_entry_limit_cents: 100000000, odfi_window_cap_cents: 2500000000 }
              as: PlatformAdmin
              captures: { w1: $.data.id }
            - call: "POST /network/originators"
              payload: { legal_name: "Alpha Payroll Corp", risk_tier: "STANDARD", exposure_limit_cents: 1000000000 }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { o1: $.data.id }
            - call: "POST /network/originators/${o1}/transition"
              payload: { to_state: "APPROVED" }
              as: ParticipantOfficer
              as_user_id: "${p1}"
            - call: "POST /network/payment-entries"
              payload: { originator_id: "${o1}", transaction_code_id: "${tc_ppd}", amount_cents: 5000, receiver_account_number_hash: "acct-sp", receiver_name: "R SP", authorization_type: "NONE", same_day: false }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { e1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T18:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/settlement-windows/${w1}/run-settlement"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /network/payment-entries/${e1}/returns"
              payload: { reason_code: "STOP_PAYMENT" }
              as: ParticipantOfficer
              as_user_id: "${p2}"
              captures: { rr: $.data.id, rr_class: $.data.reason_class }
          assert:
            - "response status is 201; ReturnRecord.${rr}.reason_class == OTHER (derived from STOP_PAYMENT)"
            - "ReturnRecord.${rr}.returning_participant_id == ${p2} and returned_at is stamped"

  - section: state_machines
    instances:
      - name: participant_terminated_rejects_further_transition
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Participant
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "TERMINATED is terminal: after ONBOARDING -> ACTIVE -> TERMINATED, any further transition returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["P1 driven ONBOARDING -> ACTIVE -> TERMINATED."]
          setup_api_calls:
            - call: "POST /network/participants"
              payload: { legal_name: "Bank One", participant_type: "ODFI", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /network/participants/${p1}/transition"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /network/participants/${p1}/transition"
              payload: { to_state: "TERMINATED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /network/participants/${p1}/transition"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status is 409 with data.error_id == ERR_INVALID_STATE"
            - "Participant.${p1}.status remains TERMINATED"

      - name: proposal_close_ballot_before_period_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.RuleProposal.BALLOTING_to_PASSED
          - validations[priority=20]
        distinguishing_aspect: "close-ballot 9 days into the 14-day ballot period fails with ERR_BALLOT_PERIOD_NOT_CLOSED and the proposal stays BALLOTING."
        test_recipe:
          setup: ["WEB code; proposal BALLOTING since 2026-10-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/transaction-codes"
              payload: { code: "WEB", entry_class: "DEBIT", authorization_requirement: "ORAL_RECORDED", return_timeframe_banking_days: 30, account_validation_required: true, warranty_obligations: "ODFI warrants WEB account validation" }
              as: PlatformAdmin
              captures: { tc_web: $.data.id }
            - call: "POST /network/rule-proposals"
              payload: { transaction_code_id: "${tc_web}", title: "WEB validation refresh", summary: "Shorten validation TTL", effective_date: "2027-01-01" }
              as: PlatformAdmin
              captures: { rp: $.data.id }
            - call: "POST /network/rule-proposals/${rp}/transition"
              payload: { to_state: "COMMENT_OPEN" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/rule-proposals/${rp}/transition"
              payload: { to_state: "BALLOTING" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /network/rule-proposals/${rp}/close-ballot"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status is 422 with data.error_id == ERR_BALLOT_PERIOD_NOT_CLOSED"
            - "RuleProposal.${rp}.status remains BALLOTING and outcome is still null"

      - name: proposal_effective_before_date_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.RuleProposal.PASSED_to_EFFECTIVE
          - validations[priority=21]
        distinguishing_aspect: "A PASSED proposal with effective_date 2026-10-20 cannot become EFFECTIVE on 2026-10-16: 422 ERR_EFFECTIVE_DATE_NOT_REACHED."
        test_recipe:
          setup: ["One ACTIVE voter P1; WEB code; proposal PASSED (comment 2026-09-01, ballot 2026-10-01, one YEA, closed 2026-10-15); effective_date 2026-10-20."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "Voting Bank One", participant_type: "BOTH", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /network/participants/${p1}/transition"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /network/transaction-codes"
              payload: { code: "WEB", entry_class: "DEBIT", authorization_requirement: "ORAL_RECORDED", return_timeframe_banking_days: 30, account_validation_required: true, warranty_obligations: "ODFI warrants WEB account validation" }
              as: PlatformAdmin
              captures: { tc_web: $.data.id }
            - call: "POST /network/rule-proposals"
              payload: { transaction_code_id: "${tc_web}", title: "WEB validation refresh", summary: "Shorten validation TTL", effective_date: "2026-10-20" }
              as: PlatformAdmin
              captures: { rp: $.data.id }
            - call: "POST /network/rule-proposals/${rp}/transition"
              payload: { to_state: "COMMENT_OPEN" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/rule-proposals/${rp}/transition"
              payload: { to_state: "BALLOTING" }
              as: PlatformAdmin
            - call: "POST /network/rule-proposals/${rp}/ballots"
              payload: { vote: "YEA" }
              as: VotingDelegate
              as_user_id: "${p1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/rule-proposals/${rp}/close-ballot"
              payload: {}
              as: PlatformAdmin
              captures: { rp_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /network/rule-proposals/${rp}/transition"
              payload: { to_state: "EFFECTIVE" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "setup reached PASSED with outcome PASSED_QUORUM (quorum 1 of 1 eligible, 3*1 >= 2*1)"
            - "the EFFECTIVE transition on 2026-10-16 fails with ERR_EFFECTIVE_DATE_NOT_REACHED; status remains PASSED"

      - name: ballot_after_close_cast_and_recast_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Ballot.CAST_to_LOCKED
          - state_machines.RuleProposal.BALLOTING_to_PASSED
        distinguishing_aspect: "Once close-ballot locks the vote, both a fresh cast by another ACTIVE participant and a recast of the LOCKED ballot fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["P1 and P2 ACTIVE; WEB code; proposal PASSED at 2026-10-15 after P1's YEA ballot."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "Voting Bank One", participant_type: "BOTH", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /network/participants/${p1}/transition"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "Voting Bank Two", participant_type: "ODFI", routing_number: "222000039" }
              as: PlatformAdmin
              captures: { p2: $.data.id }
            - call: "POST /network/participants/${p2}/transition"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /network/transaction-codes"
              payload: { code: "WEB", entry_class: "DEBIT", authorization_requirement: "ORAL_RECORDED", return_timeframe_banking_days: 30, account_validation_required: true, warranty_obligations: "ODFI warrants WEB account validation" }
              as: PlatformAdmin
              captures: { tc_web: $.data.id }
            - call: "POST /network/rule-proposals"
              payload: { transaction_code_id: "${tc_web}", title: "WEB validation refresh", summary: "Shorten validation TTL", effective_date: "2027-01-01" }
              as: PlatformAdmin
              captures: { rp: $.data.id }
            - call: "POST /network/rule-proposals/${rp}/transition"
              payload: { to_state: "COMMENT_OPEN" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/rule-proposals/${rp}/transition"
              payload: { to_state: "BALLOTING" }
              as: PlatformAdmin
            - call: "POST /network/rule-proposals/${rp}/ballots"
              payload: { vote: "YEA" }
              as: VotingDelegate
              as_user_id: "${p1}"
              captures: { b1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/rule-proposals/${rp}/close-ballot"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /network/rule-proposals/${rp}/ballots"
              payload: { vote: "NAY" }
              as: VotingDelegate
              as_user_id: "${p2}"
              captures: { err_cast: $.data.error_id }
            - call: "PATCH /network/ballots/${b1}"
              payload: { vote: "NAY" }
              as: VotingDelegate
              as_user_id: "${p1}"
              captures: { err_recast: $.data.error_id }
          assert:
            - "late cast fails with ERR_INVALID_STATE (proposal no longer BALLOTING)"
            - "recast of the LOCKED ballot fails with ERR_INVALID_STATE"
            - "Ballot.${b1} remains LOCKED with vote YEA"

      - name: ballot_duplicate_cast_rejected
        claim_type: Idempotency
        grounds:
          - validations[priority=5]
          - entities.Ballot
        distinguishing_aspect: "One ballot per (proposal, participant): P1's second cast while still BALLOTING fails 409 ERR_DUPLICATE_RESOURCE; the recast endpoint is the only lawful way to change a vote."
        test_recipe:
          setup: ["P1 ACTIVE; proposal BALLOTING; P1 has already cast YEA."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/participants"
