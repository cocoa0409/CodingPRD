  # ============================================================
  # Section: endpoints (claim-extraction-guide Table 5)
  # ============================================================
  - section: endpoints
    instances:
      - name: determinations_list_newest_first
        claim_type: listing
        grounds: ["endpoints[GET /vessels/{vessel_id}/voyages/{voyage_id}/determinations]"]
        distinguishing_aspect: "The determinations list is ordered newest first: after depart (VOYAGE_DEPARTURE) and one ballast event (BALLAST_EVENT_RECORDED), index 0 is the event-driven row (is_current true) and index 1 the departure row (is_current false)."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z; vessel with APPROVED plan; voyage V9601 IN_PROGRESS with one UPTAKE event"]
