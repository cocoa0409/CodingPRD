          - state_machines.ElectionVote
          - state_machines.ServiceHourEntry.PENDING_VERIFICATION_to_VOID
        distinguishing_aspect: |
          Depth-3 cascade triggered by Member dismissal: (1) Member.status ->
          DISMISSED, (2) all ACTIVE OfficerRole under member -> REMOVED, (3)
          all CAST ElectionVote by member as voter -> VOIDED, AND (4) all
          PENDING_VERIFICATION ServiceHourEntry -> VOID. Triggering transition
          is POST /members/{id}/dismiss. Distinct from the fundraiser
          execution cascade.
        test_recipe:
          setup:
            - "Chapter ACTIVE; Member M ACTIVE and OfficerRole ACTIVE (PRESIDENT)"
