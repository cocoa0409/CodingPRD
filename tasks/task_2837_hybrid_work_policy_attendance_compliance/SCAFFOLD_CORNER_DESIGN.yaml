          setup:
            - "One cycle, team T-A with expected_days_in_office_per_week 3, and three employees: E-REM with an APPROVED FULLY_REMOTE classification, E-HYB with an APPROVED HYBRID classification, and E-ONS with no classification at all (so it keeps the ONSITE_REQUIRED default). Each gets an empty 2026-W37 week."
