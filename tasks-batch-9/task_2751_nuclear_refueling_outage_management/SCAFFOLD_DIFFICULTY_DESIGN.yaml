            - call: "POST /work-orders/${wo_id}/plan"
              payload: {}
              as: OutagePlanner
            - call: "POST /work-orders/${wo_id}/approve-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /outages/${o_id}/schedule-activities"
              payload: { label: "MSIV overhaul", planned_start_offset_hours: 0, planned_duration_hours: 120, work_order_id: "${wo_id}" }
              as: OutagePlanner
              captures: { act_id: "$.data.id" }
            - call: "POST /outages/${o_id}/lock-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /outages/${o_id}/commence-execution"
              payload: {}
              as: OutageDirector
            - call: "POST /schedule-activities/${act_id}/start"
              payload: {}
              as: OutagePlanner
            - call: "POST /schedule-activities/${act_id}/complete"
              payload: {}
