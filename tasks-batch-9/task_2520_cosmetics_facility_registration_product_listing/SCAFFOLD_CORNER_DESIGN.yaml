            - "${err_pending} == \"ERR_FACILITY_NOT_REGISTERED\" — PENDING_REVIEW is equally insufficient"
            - "${ok_status} == \"DRAFT\" (201) once the facility is REGISTERED — the third attempt with a byte-identical payload succeeds"
            - "ResponsiblePerson ${rp_id}.active_designation_count == 1 — the two rejected attempts consumed no designation slot"

