              payload: { to: "IN_TRAINING" }
              as: ScoringAdministrator
            - call: "POST /assessors/${asb}/transition"
              payload: { to: "CALIBRATING" }
              as: ScoringAdministrator
            - call: "POST /assignments"
              payload: { benchmark_id: "${bm_id}", assessor_id: "${asb}" }
              as: ScoringAdministrator
              captures: { rbb1: $.data.id }
            - call: "POST /assignments/${rbb1}/submit-score"
              payload: { score: 3.00 }
              as: Assessor
              as_user_id: "${asb}"
            - call: "POST /assignments"
              payload: { benchmark_id: "${bm_id}", assessor_id: "${asb}" }
              as: ScoringAdministrator
              captures: { rbb2: $.data.id }
            - call: "POST /assignments/${rbb2}/submit-score"
              payload: { score: 3.25 }
              as: Assessor
              as_user_id: "${asb}"
            - call: "POST /assessors/${asb}/transition"
              payload: { to: "ACTIVE" }
              as: ScoringAdministrator
            - *c_p1_sub
