              payload: { currency: "USD", limit_cents: 5025000, collateral_required_pct: 0, facility_expiry_date: "2027-06-30" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fa_id: $.data.id }
            - call: "POST /applicants/${app_id}/facilities"
              payload: { currency: "USD", limit_cents: 5024999, collateral_required_pct: 0, facility_expiry_date: "2027-06-30" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fb_id: $.data.id }
            - call: "POST /banks"
              payload: { bank_name: "Banca Ligure di Commercio", swift_bic: "BLDCITMM", country_code: "IT", country_risk_score: 26, credit_rating: "A", confirmation_appetite_cents: 40000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { bank_id: $.data.id }
