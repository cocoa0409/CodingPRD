              payload: { reason_code: "ADDRESS_ISSUE" }
              as: Courier
              as_user_id: "${c_id}"
            - call: "POST /delivery-orders/${o1}/disposition"
              payload: { resolution: "DISPOSE" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { d_id: $.data.id }
            - call: "POST /dispositions/${d_id}/complete"
              payload: { outcome: "DISPOSED" }
              as: Courier
              as_user_id: "${c_id}"
            - call: "GET /delivery-orders/${o1}"
              payload: {}
              as: Merchant
              as_user_id: "${m_id}"
            - call: "GET /merchants/${m_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Disposition.${d_id}.return_fee_cents == 0"
            - "merchant balance after completion == 99500 (no return fee debited)"
            - "DeliveryOrder.${o1}.fulfillment_status == DISPOSED"

