      - name: purity_upgrade_is_clamped_by_the_ceiling_constant
        claim_type: constants_applied
        grounds:
          - calculations.treatment_yield_and_purity
          - entities.Panel.fields.grade_pct_nacl
          - entities.TreatmentBatch.fields.purity_pct_nacl
        distinguishing_aspect: |
          A 99.60 % panel screened FINE would compute 99.60 + 2.5 = 102.100, which is physically
          impossible: the PURITY_CEILING constant 99.9 clamps it to 99.900 (3 decimals), while the
          independent FINE yield constant 0.82 still applies in full to give 500 * 0.82 = 410.00.
        test_recipe:
          setup:
            - "Mine with a very high grade panel P-HG (grade 99.60, insolubles 0.50, recoverable 50000.00), a run hoisted with 500 t and Syracuse Depot."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-HG", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 99.60, insolubles_pct: 0.50 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 500, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
