                press_window_minutes: 120
                blend_lines:
                  - { harvest_lot_id: "${h15}", weight_lbs: 1200, position: 1 }
              as: CellarLead
              captures: { pb15: $.data.id }
            - call: "POST /cidery/press-batches/${pb15}/start"
              payload: {}
              as: CellarLead
            - call: "POST /cidery/press-batches/${pb15}/complete"
              payload: { actual_juice_liters: 600 }
              as: CellarLead
            - call: "POST /cidery/tanks"
              payload: { code: "T-115", capacity_liters: 1000, material: "STAINLESS", temperature_controlled: true }
              as: CellarLead
              captures: { t15: $.data.id }
            - call: "POST /cidery/yeast-programs"
              payload: { code: "Y15", kind: "CULTURED", attenuation_pct: 90, temp_min_f: 60, temp_max_f: 72, nutrient_required: false }
              as: CellarLead
              captures: { y15: $.data.id }
            - call: "POST /cidery/fermentation-batches"
              payload: { press_batch_id: "${pb15}", tank_id: "${t15}", yeast_program_id: "${y15}" }
              as: CellarLead
              captures: { fb15: $.data.id }
            - call: "POST /cidery/fermentation-batches/${fb15}/readings"
              payload: { gravity_brix: 4.0 }
              as: CellarLead
            - call: "POST /cidery/fermentation-batches/${fb15}/age"
              payload: {}
              as: CellarLead
            - call: "POST /cidery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cidery/fermentation-batches/${fb15}/ready"
              payload: {}
              as: CellarLead
            - call: "POST /cidery/products"
              payload: { sku: "P15-SKU", name: "P15", style: "DRY", target_abv_pct: 5.0, vintage_year: 2026 }
              as: ComplianceOfficer
              captures: { p15: $.data.id }
            - call: "POST /cidery/products/${p15}/label-approvals"
              payload: { market: "FEDERAL_TTB", application_number: "TTB-P15", expires_at: "2099-12-31T23:59:59Z" }
              as: ComplianceOfficer
              captures: { la15: $.data.id }
            - call: "POST /cidery/label-approvals/${la15}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /cidery/products/${p15}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /cidery/licenses"
              payload: { kind: "NY_FARM_CIDERY", license_number: "LIC15", issued_at: "2026-01-01T00:00:00Z", expires_at: "2028-12-31T23:59:59Z", scope_states: ["NY"], annual_volume_cap_liters: 100 }
              as: ComplianceOfficer
