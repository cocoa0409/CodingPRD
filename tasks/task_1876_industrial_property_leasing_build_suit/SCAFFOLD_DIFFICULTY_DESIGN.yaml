      - name: loi_create_requires_completed_tour
        grounds:
          - validations[priority=13]
          - state_machines.Tour.CONFIRMED_to_COMPLETED
        distinguishing_aspect: |
          Pair LOI-x-Tour (different entities than LOI-x-ComplianceReview): LOI creation is
          rejected while the only tour for (requirement, site) is CONFIRMED but not
