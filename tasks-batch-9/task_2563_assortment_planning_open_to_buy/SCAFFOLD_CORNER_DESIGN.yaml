            - "${l_res} == 1335000 != ${reserve_at_approval}: the PLANNED_BASIS variant reads month.markdown_reserve_cents as persisted, so it does NOT rewind the reserve to the 700,000 the month carried at approval - a ledger that returned 18,200,000 would be reconstructing history instead of applying the declared formula"
            - "${l_committed} == 0 under both bases; the committed and received buckets are basis-independent"
            - "${row_basis_after} == PROJECTED_BASIS, ${row_planned_after} == ${row_planned} == 16585000 and ${row_v_after} == ${row_v}: two ledger reads on two different bases persisted nothing and bumped no version"

