      distinguishing_aspect: >-
        ENTITY PAIR (CarePlanSubscription, TrialPeriod). Reinstating a SUSPENDED plan
        is blocked because the order's TrialPeriod has reached RETURN_SETTLED - the
        subscription's own dunning history is irrelevant. This instance also pins the
        asymmetry of the CASCADE-A hop-4 cascade: settlement cancels the plan only
        from ACTIVE, so a plan already in SUSPENDED stays SUSPENDED with
        dunning_attempts 3 and is then permanently un-reinstatable.
