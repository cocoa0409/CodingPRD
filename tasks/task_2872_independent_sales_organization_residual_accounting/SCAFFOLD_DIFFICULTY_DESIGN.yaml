            - call: "POST /agent-statements/${st}/adjustments"
              payload: { kind: "DISPUTE_CREDIT", amount_cents: 5000, reason: "Interchange misposting credited back to the agent", expected_statement_version: "${sv}" }
              as: ResidualController
              as_user_id: "ctrl-1"
              captures: { adj1: $.data.id }
            - call: "GET /agent-statements/${st}"
              payload: {}
