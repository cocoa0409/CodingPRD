            - call: "POST /payroll-remittances/${rem_b_id}/remittance-lines"
              payload: { enrollment_id: "${enr_id}", gross_wages_cents: 12000000, deducted_cents: 600000 }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /payroll-remittances/${rem_b_id}/submit"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /payroll-remittances/${rem_b_id}/post"
              payload: { posting_reference: "PR-2026-0600" }
              as: Recordkeeper
            - call: "POST /participant-accounts/${acct_id}/earnings-postings"
              payload: { earnings_cents: 600000, posting_date: "2026-04-30" }
              as: Recordkeeper
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
