      - name: withdrawal_suspends_and_reverify_restores
        claim_type: side_effect_execution
        grounds: ["state_machines.PetitionSignature.ACTIVE_to_WITHDRAWN", "state_machines.Petition.VERIFIED_to_DEFICIENT", "state_machines.PermitApplication.SUSPENDED_to_UNDER_REVIEW"]
        distinguishing_aspect: "Full loop: withdrawal drops a VERIFIED petition below threshold -> application SUSPENDED; after cure + new signature + re-verify the application returns to UNDER_REVIEW."
        test_recipe:
          setup: ["Application UNDER_REVIEW backed by a VERIFIED petition with exactly 3 of 3 required signatures"]
