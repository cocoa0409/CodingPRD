          Three hops, each caused by the previous one: closing the last blocking
          issue releases its retainage and drops the severity index, that drop
          re-promotes the equipment to PREFUNCTIONAL_VERIFIED, and that promotion
          plus the index drop moves the posture out of FROZEN which returns the
