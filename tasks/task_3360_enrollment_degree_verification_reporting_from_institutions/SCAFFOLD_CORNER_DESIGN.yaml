            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-04T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "GET /institutions/${inst_id}", payload: {}, as: ClearinghouseOps, captures: { standing: "$.data.compliance_standing" } }
          trigger:
            - { call: "POST /degree-records/${deg1}/seal", payload: {}, as: RegistrarCertifier, as_user_id: "${cert_uid}", captures: { err: "$.data.error_id" } }
            - { call: "GET /degree-records/${deg1}", payload: {}, as: ClearinghouseOps, captures: { d_status: "$.data.status" } }
          assert:
            - "captured standing == NON_COMPLIANT (P1 closed DELINQUENT: the file was never certified)"
            - "captured err == ERR_INSTITUTION_NON_COMPLIANT"
            - "captured d_status == REPORTED (unchanged)"

      - name: err_quote_expired_on_pay
        claim_type: violation_to_error
        grounds:
          - errors[ERR_QUOTE_EXPIRED]
        excluded_because:
          difficulty_instance: pay_expired_quote_preempts_insufficient_credit
          rationale: "Pay on an EXPIRED quote is the asserted failure path of the named §1.8 instance."

      - name: err_requester_not_vetted_on_create
        claim_type: violation_to_error
        grounds:
          - errors[ERR_REQUESTER_NOT_VETTED]
        excluded_because:
          difficulty_instance: requester_vetting_suspension_revetting_cycle
          rationale: "PENDING_VETTING and SUSPENDED creates are both asserted to fail with ERR_REQUESTER_NOT_VETTED in the named §1.8 instance."

      - name: err_privacy_blocked_full_block_create
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PRIVACY_BLOCKED]
        excluded_because:
          difficulty_instance: create_privacy_block_preempts_duplicate_request
          rationale: "FULL_BLOCK blocking request creation is asserted by the named §1.8 instance; the DIRECTORY_BLOCK create-time variant is covered here by directory_block_blocks_degree_create_but_not_consented_enrollment."

      - name: err_cohort_too_small
        claim_type: violation_to_error
        grounds:
          - errors[ERR_COHORT_TOO_SMALL]
        excluded_because:
          difficulty_instance: k_anonymity_boundary_10_vs_9
          rationale: "Cohort 9 failing with ERR_COHORT_TOO_SMALL is the asserted boundary of the named §1.8 instance."

      - name: err_agreement_overlap
        claim_type: violation_to_error
        grounds:
          - errors[ERR_AGREEMENT_OVERLAP]
        excluded_because:
          difficulty_instance: agreement_half_open_adjacency
          rationale: "The overlap trigger (one day before the incumbent's exclusive end) is asserted by the named §1.8 instance."

      - name: err_period_overlap
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: period_closed_occupancy_through_due_date
          rationale: "Same-day term_start == incumbent submission_due_at colliding under closed occupancy is asserted by the named §1.8 instance."

      - name: err_period_not_open
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PERIOD_NOT_OPEN]
        excluded_because:
          difficulty_instance: file_upload_requires_period_not_scheduled
          rationale: "Upload while SCHEDULED failing with ERR_PERIOD_NOT_OPEN is the asserted outcome of the named §1.8 instance."

      - name: err_institution_suspended_on_seal
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INSTITUTION_SUSPENDED]
        excluded_because:
          difficulty_instance: degree_seal_requires_institution_active
          rationale: "Seal against a SUSPENDED institution failing with ERR_INSTITUTION_SUSPENDED is asserted by the named §1.8 instance; the upload-path trigger of the same error is covered here by err_institution_suspended_on_upload."

      - name: blocked_privacy_refund_conservation
        claim_type: violation_to_error
        grounds:
          - state_machines.VerificationRequest.PAID_to_BLOCKED_PRIVACY
        excluded_because:
          difficulty_instance: failed_fulfillment_refund_conserves_balance
          rationale: "The PAID -> BLOCKED_PRIVACY path with full refund is the asserted outcome of the named §1.8 instance."

