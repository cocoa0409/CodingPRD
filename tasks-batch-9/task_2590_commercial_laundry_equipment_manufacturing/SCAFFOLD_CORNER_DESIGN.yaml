      - name: distributor_reading_another_distributors_quote_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=23]
          - errors[ERR_OWNERSHIP_VIOLATION]
          - roles.Distributor
        distinguishing_aspect: "Both actors carry the legitimate Distributor role, so this is not an RBAC denial but a row-scoped ownership check: D-02 reading D-01's quote is 403 ERR_OWNERSHIP_VIOLATION rather than 404, which would leak nothing but also would not name the real reason."
        test_recipe:
          setup: ["Distributors D-01 (TX-CENTRAL, exclusive) and D-02 (TX-NORTH, exclusive); a DRAFT quote owned by D-01"]
          setup_api_calls:
            - call: "POST /clm/distributors"
              payload: { distributor_code: "D-01", legal_name: "Bay Laundry Supply", territory_code: "TX-CENTRAL", territory_exclusive: true }
              as: ChannelManager
              as_user_id: "u-cm-01"
              captures: { d1: $.data.id }
            - call: "POST /clm/distributors"
              payload: { distributor_code: "D-02", legal_name: "Gulf Coin Laundry", territory_code: "TX-NORTH", territory_exclusive: true }
              as: ChannelManager
              as_user_id: "u-cm-01"
              captures: { d2: $.data.id }
            - call: "POST /clm/quotes"
              payload: { distributor_id: "${d1}", customer_name: "Sudz Express", laundromat_site_code: "SITE-77", stated_credit_score: 715, financing_program: "NONE", down_payment_cents: 0, package_discount_pct: 0.00, freight_cents: 0 }
              as: Distributor
              as_user_id: "${d1}"
              captures: { q1: $.data.id }
          trigger:
            - call: "GET /clm/quotes/${q1}"
              as: Distributor
              as_user_id: "${d2}"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 403"
            - "${err} == ERR_OWNERSHIP_VIOLATION"
            - "the same GET as the owning distributor ${d1} returns HTTP 200"
            - "GET /clm/quotes as ChannelManager u-cm-01 returns 1 item"

