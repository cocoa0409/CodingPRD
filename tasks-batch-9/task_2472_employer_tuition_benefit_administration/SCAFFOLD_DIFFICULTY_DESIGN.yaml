              as_user_id: "${employer_id}"
            - &b_pay2
              call: "POST /tuition-invoices/${invoice_2_id}/pay"
              payload: {}
              as: PlatformAdmin
            - &b_fail1
              call: "POST /enrollments/${enrollment_1_id}/academic-outcomes"
              payload:
                term_code: "2026-FA"
                completion_status: "FAILED"
                credits_earned: 0
                grade_points: 1.50
              as: SchoolPartner
              as_user_id: "${school_id}"
          trigger: "POST /_ops/term-close with term_code 2026-FA, run_annual_true_up true, tax_year 2026"
          assert: >-
            Before the trigger the per_event_chronological variant has posted three
            TaxLedgerEntry rows for tax_year 2026 (GET /tax-ledger-entries?employee_id=...&tax_year=2026):
            a BENEFIT for E1 with benefit_cents 525000 / excluded_cents 525000 /
            imputed_income_cents 0 (exactly at TAX_EXCLUSION_LIMIT_CENTS, not over), a BENEFIT for
            E2 with benefit_cents 52500 / excluded_cents 0 / imputed_income_cents 52500 (no room
            left), and a REVERSAL for E1 with benefit_cents -525000 / excluded_cents -525000 /
            imputed_income_cents 0; so GET /employees/${employee_id} shows
            taxable_excluded_cents_ytd 0 and imputed_income_cents_ytd 52500. The trigger runs the
            annual_true_up_aggregate variant, whose net 2026 benefit is 52500 (fully excludable),
            and it posts exactly one TRUE_UP entry with benefit_cents 0, excluded_cents 52500 and
            imputed_income_cents -52500; the response has true_up_entry_count 1,
            superseded_policy_count 0, closed_enrollment_count 0, obligation_assessed_count 0 and
            coaching_hold_employee_count 0. Afterwards GET /employees/${employee_id} shows
            taxable_excluded_cents_ytd 52500 and imputed_income_cents_ytd 0, i.e. the two variants
            disagree by 52500 cents of imputed income on identical underlying disbursements.

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: per_credit_discount_rounding_precedes_credit_multiplication
        grounds: >-
          §1.4 negotiated_rate_derivation pins the rounding order: the discounted per-credit rate
          is rounded to whole cents FIRST and stored on CatalogListing, and only then multiplied
          by Enrollment.credits. With list_tuition_per_credit_cents 41002 and discount 0.25 the
          exact product is 30751.5, so round_half_up gives 30752 and three credits give 92256,
          whereas rounding after multiplication (41002 * 3 * 0.75 = 92254.5 -> 92255) differs by
          one cent; the subsequent 0.60 reserve then differs too (55354 versus 55353).
        distinguishing_aspect: >-
          Mode (b): nested rounding where the ORDER of rounding operations is what the assertion
          pins, using a value engineered to land on a half-cent. The paired instance is mode (c),
          a circular-looking dependency between admin-fee tier and employer YTD disbursement whose
          evaluation order is pinned; it contains no half-cent rounding hook.
        test_recipe:
          setup: >-
            The Northwind fixture: employer, ACTIVE REIMBURSEMENT policy at 0.60, eligible
            employee, ACTIVE agreement at 0.25 discount over a program whose list rate 41002
            makes the discounted rate land exactly on a half cent.
          setup_api_calls:
            - *a_clock
            - *a_employer
            - *a_policy
            - *a_activate_policy
            - *a_employee
            - *a_school
            - *a_program
            - *a_agreement
            - *a_activate_agreement
            - *a_listing
            - *a_read_employee
          trigger: "POST /enrollments for 3 credits of the curated listing"
          assert: >-
            GET /catalog-listings/${listing_id} shows negotiated_tuition_per_credit_cents 30752
            (round_half_up(41002 * (1 - 0.25)) = round_half_up(30751.5) = 30752, rounded before any
            credit multiplication). The enrollment response then has gross_tuition_cents 92256
            (30752 * 3) and employer_reserved_cents 55354 (round_half_up(92256 * 0.60) = 55354),
            with employee_share_cents 36902 and drop_deadline_date 2026-09-15
            (term_start 2026-09-01 + drop_window_days 14). The rate-after-multiplication order
            would yield 92255 and 55353, and the reserve-before-rate order would yield 55353 as
            well, so all three literals falsify the wrong orders.

      - name: admin_fee_tier_keyed_on_pre_settlement_employer_disbursement
        grounds: >-
          §1.4 reimbursement_settlement pins a six-step evaluation order in which the
          platform_admin_fee_cents tier is selected from Employer.total_disbursed_cents as it
          stands BEFORE this settlement is added, even though the same settlement immediately
          increases that field - a circular-looking dependency. Three inputs interact
          (pre-state employer YTD disbursement, the approved amount, and the tier table), so two
          settlements on the same employer land in different tiers and the second settlement's fee
          proves the basis is the pre-state value, not the post-state one.
        distinguishing_aspect: >-
          Mode (c): a circular-looking dependency (fee depends on YTD disbursement which the fee's
          own transaction updates) resolved by a pinned evaluation order. The paired instance is
          mode (b), nested rounding order, and involves no self-referential input.
        test_recipe:
          setup: >-
            A HYBRID employer with cap 6000000 and one eligible employee; three programs at the
            same school under one ACTIVE agreement (0.20 discount, direct bill enabled). A large
            DIRECT_BILL enrollment on program A is paid first, pushing
            Employer.total_disbursed_cents to 4990000 - just inside admin-fee tier 1
            (<= 5000000). Then two REIMBURSEMENT enrollments on programs B and C are settled in
            sequence.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload:
                legal_name: "Summit Logistics Cooperative"
                benefit_admin_contact_email: "benefits@summit-logistics.example"
                fiscal_year_start_month: 1
              as: PlatformAdmin
              captures: { employer_id: "$.data.id" }
            - call: "POST /employers/${employer_id}/benefit-policies"
              payload:
                effective_from: "2026-01-01"
                effective_to: "2027-01-01"
                min_tenure_months: 0
                min_weekly_hours: 0
                eligible_job_families: ["OPERATIONS"]
                annual_cap_cents: 6000000
                funding_model: "HYBRID"
                reimbursement_pct: 0.60
                max_concurrent_credits: 24
                drop_window_days: 7
                service_commitment_months: 12
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { policy_id: "$.data.id" }
            - call: "POST /benefit-policies/${policy_id}/activate"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
            - call: "POST /employers/${employer_id}/employees"
              payload:
                full_name: "Marcus Vela"
                work_email: "marcus.vela@summit-logistics.example"
                hire_date: "2024-02-01"
                weekly_hours: 40
                job_family: "OPERATIONS"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { employee_id: "$.data.id" }
            - call: "POST /schools"
              payload:
                legal_name: "Gateway Polytechnic"
