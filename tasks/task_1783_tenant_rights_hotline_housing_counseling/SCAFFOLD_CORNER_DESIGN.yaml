        grounds: [state_machines.PurgeJob, entities.Caller.fields.pii_purged, "errors[ERR_CALLER_PII_PURGED]"]
        distinguishing_aspect: "PurgeJob honors the legal hold as a state (BLOCKED_BY_HOLD), not an error; lifting the hold via the legal_hold-only PATCH allowed on CLOSED cases unblocks re-execution, which scrubs PII, EXPIRES the still-GRANTED DATA_SHARING consent, and makes further consent grants fail with ERR_CALLER_PII_PURGED."
        test_recipe:
          setup:
            - "Base chain; DATA_SHARING consent granted (TTL 365d, still GRANTED at purge time); case opened with legal_hold=true, walked IN_PROGRESS -> RESOLVED -> CLOSED at 2026-08-01T00:00:00Z; agency-default retention policy (null jurisdiction, null category) retention_days=30"
