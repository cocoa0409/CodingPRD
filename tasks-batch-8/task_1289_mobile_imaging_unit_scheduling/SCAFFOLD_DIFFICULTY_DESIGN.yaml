          Error-category pair (business_safety, business_referential): the technologist carries
          3.0 mSv already on the service date plus 2.2 mSv of estimates (projected 5.2 > 5.0,
          safety, priority 6) AND lacks the MRI cert (referential, priority 9). The safety error
          ERR_DOSE_LIMIT_EXCEEDED must win. Distinct category pair from the
          (state, business_fiscal) sibling.
        test_recipe:
          setup:
            - "Technologist T (certs CT only) completed two scans on CT unit day A (2026-08-04) with dose records 1.5 + 1.5 = 3.0; day A then COMPLETED (staffing released)"
            - "MRI unit day B on the SAME service_date 2026-08-04 at an MRI-capable facility with two appointments estimated 1.1 each"
