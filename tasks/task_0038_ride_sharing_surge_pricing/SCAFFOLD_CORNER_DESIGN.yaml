  - section: cross_cutting_complexity_layers
    instances:
      - name: surge_snapshot_stale_zone_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[snapshot-publish-stale-zone]", "errors[ERR_STALE_ZONE_VERSION]"]
        distinguishing_aspect: "Publishing a snapshot with expected_zone_version one behind the Zone's current version (the version captured at creation, after a trip-request bumped it) returns ERR_STALE_ZONE_VERSION (412)."
        test_recipe:
          setup: ["Zone created (version 1 captured); a trip requested in it bumps open_demand_count and thus version to 2."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Z1", grid_code: "X1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id, z_v_stale: $.data.version }
            - call: "POST /riders"
              payload: { name: "R1", home_zone_id: "${z_id}", wallet_balance_cents: 0 }
              as: Dispatcher
              captures: { rider_id: $.data.id }
            - call: "POST /trips"
              payload: { rider_id: "${rider_id}", pickup_zone_id: "${z_id}", dropoff_zone_id: "${z_id}" }
              as: Rider
              as_user_id: "${rider_id}"
          trigger:
            - call: "POST /zones/${z_id}/surge-snapshots"
              payload: { observed_demand: 1, observed_supply: 4, is_rush_hour: false, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T01:00:00Z", expected_zone_version: "${z_v_stale}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error and data.error_id == ERR_STALE_ZONE_VERSION"

      - name: surge_snapshot_correct_version_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[snapshot-publish-stale-zone]", "entities.Zone.fields.version"]
        distinguishing_aspect: "Publishing with the freshly-read expected_zone_version succeeds (201) and increments Zone.version by 1."
        test_recipe:
          setup: ["Zone created; current version re-read just before publish."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Z1", grid_code: "Y1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id }
            - call: "GET /zones/${z_id}"
              payload: {}
              as: Dispatcher
              captures: { z_v: $.data.version }
          trigger:
            - call: "POST /zones/${z_id}/surge-snapshots"
              payload: { observed_demand: 4, observed_supply: 2, is_rush_hour: false, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T01:00:00Z", expected_zone_version: "${z_v}" }
              as: Dispatcher
          assert:
            - "code 201 and Zone.${z_id}.current_multiplier == 2.00"
            - "Zone.${z_id}.version == ${z_v} + 1"

      - name: complete_trip_cascade_supply_relocate
        claim_type: cascading_side_effects
        grounds: [state_machines.Trip.ENROUTE_to_COMPLETED]
        excluded_because:
          difficulty_instance: transitive_cascade / trip_complete_driver_relocate_supply_cascade_depth3
          rationale: "The complete-trip supply-relocate cascade is the named §1.8 transitive-cascade instance."
