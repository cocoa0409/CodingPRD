            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: District504Director
              as_user_id: "bootstrap-director"
            - call: "POST /evaluations/${eval2_id}/determine"
              payload: { determination_outcome: "NOT_ELIGIBLE", disability_impairment_found: false, major_life_activity_affected: false }
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { e2_err: $.data.error_id }
            - call: "POST /evaluations/${eval3_id}/determine"
              payload: { determination_outcome: "ELIGIBLE", disability_impairment_found: true, major_life_activity_affected: true }
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { e3_status: $.data.evaluation_status, e3_outcome: $.data.determination_outcome }
          assert:
            - "e1_status == DETERMINATION_MADE (60 days is timely — boundary INCLUSIVE)"
            - "e2_err == ERR_DETERMINATION_DEADLINE_MISSED (61 days, NOT_ELIGIBLE rejected)"
            - "e3_status == DETERMINATION_MADE AND e3_outcome == ELIGIBLE (61 days, ELIGIBLE allowed with audit)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (two different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: plan_submit_requires_eligible_determination
        grounds:
          - state_machines.Section504Plan.DRAFT_to_PENDING_PARENT_CONSENT
