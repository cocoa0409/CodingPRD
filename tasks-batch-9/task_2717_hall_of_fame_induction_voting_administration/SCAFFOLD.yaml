scenario: |
  Generate task harder than expert level!

  2717. Hall of Fame Induction & Voting Administration (sports hall of fame): eligibility criteria with waiting periods, career thresholds and category definitions for players, coaches and contributors, nomination intake with screening committee review to build the ballot, voter body composition, credentialing and voting eligibility maintenance, ballot construction with maximum votes per elector and multi-round runoff procedures, vote tabulation with independent auditor oversight and confidentiality of individual ballots, election thresholds with carryover eligibility and ballot expiration rules, induction ceremony planning with inductee travel, artifact collection and exhibit development, posthumous, veterans committee and special election pathways

domain_name: hall-of-fame-induction-voting
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; every collection is a
  # top-level path (`/ballots`, `/candidacies`, `/travel-grants`) and no
  # entity is addressed through a nested ownership chain.

  state_machine_shape: cyclic
  # Candidacy loops SCREENING -> INFO_REQUESTED -> SCREENING; Ballot loops
  # PENDING_AUDIT -> AUDIT_REJECTED -> PENDING_AUDIT; Elector loops
  # CREDENTIALED -> SUSPENDED -> CREDENTIALED. Ballot additionally carries two
  # independent state dimensions (voting_status x tally_status) and Induction
  # carries three (travel_status x artifact_status x exhibit_status).

  relationship_patterns:
    - one_to_many          # InductionCycle -> Candidacy / Ballot / TravelGrant
    - many_to_many         # BallotSlot is the Ballot x Candidacy junction
    - self_referential     # Candidacy.carryover_from_candidacy_id -> Candidacy.id
    - cross_aggregate      # ExhibitInstallation couples Induction to ExhibitCase

  role_model: segregation_of_duties
  # The elector who submitted a nomination may not screen it; the operator who
  # produced a draft tally may not be the auditor who certifies it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: InductionCycle
    parent: null
    common_fields: true
    fields:
      - name: cycle_year
        type: integer
        source: input
        description: "Election year the cycle elects for; used by every waiting-period comparison"
        constraints: "1900..2200; unique per sport_code"
      - name: sport_code
        type: string
        source: input
        description: "Sport the hall of fame covers, e.g. BASEBALL"
      - name: max_inductees
        type: integer
        source: input
        description: "Hard cap on candidacies that may be elected in this cycle"
        default: 5
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Cycle lifecycle state"
        default: SETUP
        constraints: "SETUP | NOMINATIONS_OPEN | SCREENING | BALLOTING | CERTIFIED | CEREMONY_PLANNED | CLOSED"
      - name: current_round
        type: integer
        source: system
        description: "Voting round the cycle is currently balloting; 0 before the first ballot is constructed"
        default: 0
      - name: nomination_count
        type: integer
        source: computed
        description: "Count of Candidacy rows with cycle_id == this cycle, any status"
        default: 0
      - name: advanced_candidacy_count
        type: integer
        source: computed
        description: "Count of Candidacy rows for this cycle with status IN {ADVANCED, ON_BALLOT}"
        default: 0
      - name: special_election_used
        type: integer
        source: computed
        description: "Count of Candidacy rows for this cycle with pathway == SPECIAL and status NOT IN {REJECTED}"
        default: 0
      - name: credentialed_roster_count
        type: integer
        source: computed
        description: "Count of Elector rows with status == CREDENTIALED and credential_expires_on >= logical clock now"
        default: 0
      - name: ceremony_date
        type: datetime
        source: input
        description: "Induction ceremony instant; set by PATCH /induction-cycles/{id}/ceremony"
        default: null
      - name: ceremony_venue
        type: string
        source: input
        description: "Ceremony venue name"
        default: null
      - name: travel_budget_cents
        type: integer
        source: input
        description: "Total inductee travel budget for the ceremony in cents"
        default: 0
      - name: travel_committed_cents
        type: integer
        source: computed
        description: "Sum of TravelGrant.award_cents for this cycle with status == APPROVED"
        default: 0
      - name: escort_pool_size
        type: integer
        source: input
        description: "Number of ceremony escorts available concurrently for posthumous delegations"
        default: 0
      - name: austerity_tier
        type: enum
        source: computed
        description: "Tier derived from travel_committed_cents / travel_budget_cents; recomputed after every grant approval or cancellation"
        default: FULL
        constraints: "FULL | REDUCED | MINIMAL"
      - name: induction_count
        type: integer
        source: computed
        description: "Count of Induction rows with cycle_id == this cycle"
        default: 0
      - name: ceremony_ready_count
        type: integer
        source: computed
        description: "Count of Induction rows for this cycle with ceremony_ready == true"
        default: 0

  - name: EligibilityRule
    parent: null
    common_fields: false
    fields:
      - name: category
        type: enum
        source: input
        description: "Candidate category the rule governs"
        constraints: "PLAYER | COACH | CONTRIBUTOR"
      - name: pathway
        type: enum
        source: input
        description: "Induction pathway the rule governs"
        constraints: "MODERN | VETERANS | POSTHUMOUS | SPECIAL"
      - name: waiting_period_years
        type: integer
        source: input
        description: "Years that must elapse after the baseline year before a candidacy may be filed"
        constraints: ">= 0"
      - name: min_career_seasons
        type: integer
        source: input
        description: "Minimum Candidate.career_seasons required"
        constraints: ">= 0"
      - name: min_career_metric
        type: number
        source: input
        description: "Minimum Candidate.career_metric_value required"
        constraints: ">= 0"
      - name: max_ballot_appearances
        type: integer
        source: input
        description: "Maximum number of ballots a candidate may appear on under this pathway"
        constraints: ">= 1"
      - name: election_threshold_pct
        type: number
        source: input
        description: "Fraction of the vote denominator a slot must reach to be elected"
        constraints: "0 < x <= 1"
      - name: carryover_min_pct
        type: number
        source: input
        description: "Minimum vote_pct a non-elected slot needs for CARRYOVER_ELIGIBLE"
        constraints: "0 <= x <= 1"
      - name: runoff_floor_pct
        type: number
        source: input
        description: "Minimum vote_pct a non-elected slot needs to be carried into the next runoff round"
        constraints: "0 <= x <= 1"

  - name: VoterBloc
    parent: null
    common_fields: false
    fields:
      - name: bloc_code
        type: string
        source: input
        description: "Short unique code for the bloc, e.g. WRITERS"
        constraints: "unique across VoterBloc"
      - name: name
        type: string
        source: input
        description: "Human-readable bloc name"
      - name: seat_cap
        type: integer
        source: input
        description: "Maximum number of seated electors the bloc may hold"
        constraints: ">= 1"
      - name: min_participation_pct
        type: number
        source: input
        description: "Minimum fraction of the bloc's seated electors that must have a COUNTED submission before a tally may be audit-certified"
        constraints: "0 <= x <= 1"
      - name: seats_filled
        type: integer
        source: computed
        description: "Count of Elector rows with bloc_id == this bloc and status IN {CREDENTIALED, SUSPENDED}"
        default: 0

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Candidate's full name"
      - name: category
        type: enum
        source: input
        description: "Career category that selects the EligibilityRule row"
        constraints: "PLAYER | COACH | CONTRIBUTOR"
      - name: retirement_year
        type: integer
        source: input
        description: "Final year of the candidate's qualifying career"
        constraints: "1900..2200"
      - name: career_seasons
        type: integer
        source: input
        description: "Completed qualifying seasons, compared against EligibilityRule.min_career_seasons"
        constraints: ">= 0"
      - name: career_metric_value
        type: number
        source: input
        description: "Career threshold metric (games for coaches, statistical total for players), compared against EligibilityRule.min_career_metric"
        constraints: ">= 0"
      - name: is_deceased
        type: boolean
        source: input
        description: "True when the candidate is deceased; gates the POSTHUMOUS pathway and the posthumous travel variant"
        default: false
      - name: death_year
        type: integer
        source: input
        description: "Year of death; required when is_deceased is true"
        default: null
      - name: hof_status
        type: enum
        source: system
        description: "Induction standing of the candidate"
        default: NOT_INDUCTED
        constraints: "NOT_INDUCTED | INDUCTED | PERMANENTLY_INELIGIBLE"
      - name: permanently_ineligible_reason
        type: string
        source: input
        description: "Reason recorded when hof_status is set to PERMANENTLY_INELIGIBLE"
        default: null
      - name: ballot_appearances_used
        type: integer
        source: computed
        description: "Number of ballots this candidate has appeared on and had tabulated; incremented once per certified cycle in which a slot for the candidate was scored"
        default: 0
      - name: veterans_eligible_from_year
        type: integer
        source: computed
        description: "First cycle_year at which a VETERANS pathway candidacy may be filed; recomputed when a candidacy EXPIRES"
        default: null

  - name: Candidacy
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> InductionCycle.id; cycle this nomination competes in"
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id; person being nominated"
      - name: nominated_by_elector_id
        type: string
        source: input
        description: "FK -> Elector.id; credentialed elector who filed the nomination"
      - name: screened_by_elector_id
        type: string
        source: system
        description: "FK -> Elector.id; screening committee member who recorded the most recent screening decision"
        default: null
      - name: carryover_from_candidacy_id
        type: string
        source: input
        description: "FK -> Candidacy.id; prior-cycle candidacy this nomination carries over from"
        default: null
      - name: pathway
        type: enum
        source: input
        description: "Induction pathway claimed by this nomination"
        constraints: "MODERN | VETERANS | POSTHUMOUS | SPECIAL"
      - name: justification
        type: string
        source: input
        description: "Written justification; required when pathway == SPECIAL"
        default: null
      - name: status
        type: enum
        source: system
        description: "Screening plus balloting lifecycle state"
        default: SUBMITTED
        constraints: "SUBMITTED | SCREENING | INFO_REQUESTED | ADVANCED | REJECTED | DEFERRED | ON_BALLOT | ELECTED | CARRYOVER_ELIGIBLE | EXPIRED | ELIMINATED | STRUCK"
      - name: eligible_from_year
        type: integer
        source: computed
        description: "Baseline year plus effective waiting period, computed by career_eligibility_assessment at creation"
      - name: appearance_number
        type: integer
        source: computed
        description: "Candidate.ballot_appearances_used + 1 at the moment the candidacy is placed on a ballot; 0 while off-ballot"
        default: 0
      - name: info_request_count
        type: integer
        source: computed
        description: "Number of REQUEST_INFO screening decisions recorded on this candidacy"
        default: 0
      - name: latest_round_votes
        type: integer
        source: computed
        description: "votes_received of this candidacy's slot on the most recently tabulated ballot"
        default: 0
      - name: latest_round_pct
        type: number
        source: computed
        description: "vote_pct of this candidacy's slot on the most recently tabulated ballot, 2 decimal places"
        default: 0
      - name: screening_notes
        type: string
        source: input
        description: "Free-text note attached by the most recent screening decision"
        default: null

  - name: Elector
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Elector's full name"
      - name: bloc_id
        type: string
        source: input
        description: "FK -> VoterBloc.id; bloc whose seat this elector occupies"
      - name: is_screening_member
        type: boolean
        source: input
        description: "True when this elector may act under the ScreeningCommitteeMember role"
        default: false
      - name: credential_expires_on
        type: datetime
        source: input
        description: "Instant at which the elector's credential lapses; voting requires credential_expires_on >= logical clock now"
      - name: status
        type: enum
        source: system
        description: "Credentialing state"
        default: PROVISIONAL
        constraints: "PROVISIONAL | CREDENTIALED | SUSPENDED | LAPSED"
      - name: consecutive_missed_cycles
        type: integer
        source: computed
        description: "Certified cycles in a row in which this elector cast no COUNTED submission"
        default: 0
      - name: last_participated_cycle_year
        type: integer
        source: computed
        description: "cycle_year of the most recent certified cycle in which this elector had a COUNTED submission"
        default: null
      - name: suspension_reason
        type: string
        source: input
        description: "Reason recorded when the elector is suspended"
        default: null

  - name: Ballot
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> InductionCycle.id; cycle this ballot belongs to"
      - name: round_number
        type: integer
        source: system
        description: "Voting round this ballot serves; equals cycle.current_round + 1 for a first attempt and cycle.current_round for a replacement of an EXPIRED ballot"
      - name: voting_status
        type: enum
        source: system
        description: "Voting dimension of the ballot state"
        default: DRAFT
        constraints: "DRAFT | OPEN | CLOSED | EXPIRED"
      - name: tally_status
        type: enum
        source: system
        description: "Tabulation dimension of the ballot state, independent of voting_status"
        default: NOT_TALLIED
        constraints: "NOT_TALLIED | PENDING_AUDIT | AUDIT_REJECTED | AUDIT_CERTIFIED"
      - name: opens_at
        type: datetime
        source: input
        description: "Instant voting opens"
      - name: closes_at
        type: datetime
        source: input
        description: "Instant voting closes; submissions at or after this instant are rejected"
      - name: max_votes_per_elector
        type: integer
        source: computed
        description: "Selection cap per elector, computed by max_votes_per_elector_for_round at construction"
      - name: slot_count
        type: integer
        source: computed
        description: "Count of BallotSlot rows with ballot_id == this ballot and status != STRUCK"
        default: 0
      - name: ballots_cast
        type: integer
        source: computed
        description: "Count of VoteSubmission rows for this ballot with status == COUNTED"
        default: 0
      - name: total_selections_counted
        type: integer
        source: computed
        description: "Sum of selection_count over VoteSubmission rows for this ballot with status == COUNTED"
        default: 0
      - name: credentialed_roster_at_close
        type: integer
        source: system
        description: "Snapshot of credentialed roster size taken when voting_status leaves OPEN"
        default: 0
      - name: threshold_votes_provisional
        type: integer
        source: computed
        description: "Turnout-based election threshold computed by the draft tally"
        default: 0
      - name: threshold_votes_final
        type: integer
        source: computed
        description: "Roster-based election threshold computed when the auditor certifies the tally"
        default: 0
      - name: elected_slot_count
        type: integer
        source: computed
        description: "Count of BallotSlot rows for this ballot with status == ELECTED"
        default: 0
      - name: outcome
        type: enum
        source: computed
        description: "Election outcome resolved at audit certification"
        default: null
        constraints: "ELECTION_COMPLETE | RUNOFF_REQUIRED | NO_ELECTION"
      - name: tallied_by_user_id
        type: string
        source: system
        description: "X-User-ID that produced the draft tally; the auditor's X-User-ID must differ"
        default: null
      - name: audit_note
        type: string
        source: input
        description: "Auditor's note recorded with the audit decision"
        default: null

  - name: BallotSlot
    parent: null
    common_fields: true
    fields:
      - name: ballot_id
        type: string
        source: input
        description: "FK -> Ballot.id; ballot this slot is printed on"
      - name: candidacy_id
        type: string
        source: input
        description: "FK -> Candidacy.id; candidacy occupying the slot"
      - name: candidate_name_snapshot
        type: string
        source: system
        description: "Candidate.full_name copied at construction so a later rename cannot alter a printed ballot"
      - name: pathway_snapshot
        type: enum
        source: system
        description: "Candidacy.pathway copied at construction"
        constraints: "MODERN | VETERANS | POSTHUMOUS | SPECIAL"
      - name: candidacy_version_pinned
        type: integer
        source: system
        description: "Candidacy.version at construction; a slot whose candidacy later diverges is STRUCK rather than silently re-read"
      - name: votes_received
        type: integer
        source: computed
        description: "Count of COUNTED VoteSubmission rows whose selected_slot_ids contains this slot id"
        default: 0
      - name: vote_pct
        type: number
        source: computed
        description: "votes_received / Ballot.ballots_cast rounded to 2 decimals, round_half_up; 0 when ballots_cast == 0"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Slot outcome state"
        default: LISTED
        constraints: "LISTED | ELECTED | NOT_ELECTED | CARRIED_TO_RUNOFF | STRUCK"

  - name: VoteSubmission
    parent: null
    common_fields: true
    fields:
      - name: ballot_id
        type: string
        source: input
        description: "FK -> Ballot.id; ballot being voted"
      - name: elector_id
        type: string
        source: system
        description: "FK -> Elector.id; elector who cast the submission, taken from X-User-ID"
      - name: selected_slot_ids
        type: array
        source: input
        description: "Array of BallotSlot id values selected by the elector; returned as null to every role except IndependentAuditor"
        default: []
      - name: selection_count
        type: integer
        source: computed
        description: "Length of selected_slot_ids at cast time; 0 for an abstention"
        default: 0
      - name: is_abstention
        type: boolean
        source: input
        description: "True when the elector returns an empty ballot on purpose"
        default: false
      - name: status
        type: enum
        source: system
        description: "Submission state"
        default: COUNTED
        constraints: "COUNTED | WITHDRAWN | INVALIDATED"
      - name: ballot_version_after
        type: integer
        source: system
        description: "Ballot.version immediately after this submission was recorded, so the next elector can supply a fresh expected_ballot_version"
      - name: cast_at
        type: datetime
        source: system
        description: "Logical clock instant at which the submission was recorded"
      - name: invalidated_reason
        type: string
        source: input
        description: "Reason recorded when the auditor invalidates the submission"
        default: null

  - name: Induction
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> InductionCycle.id; cycle that elected the inductee"
      - name: candidacy_id
        type: string
        source: input
        description: "FK -> Candidacy.id; elected candidacy"
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id; inducted person"
      - name: status
        type: enum
        source: system
        description: "Overall induction state"
        default: ANNOUNCED
        constraints: "ANNOUNCED | ENSHRINED"
      - name: travel_status
        type: enum
        source: system
        description: "Travel dimension, advanced by TravelGrant transitions"
        default: PENDING
        constraints: "PENDING | REQUESTED | APPROVED | WAIVED"
      - name: artifact_status
        type: enum
        source: system
        description: "Artifact-collection dimension, advanced by artifact intake"
        default: AWAITED
        constraints: "AWAITED | RECEIVED | EXEMPT"
      - name: exhibit_status
        type: enum
        source: system
        description: "Exhibit-development dimension, advanced by ExhibitInstallation transitions"
        default: NOT_PLANNED
        constraints: "NOT_PLANNED | INSTALLED"
      - name: delegation_type
        type: enum
        source: system
        description: "LIVING when Candidate.is_deceased was false at certification, else POSTHUMOUS_DELEGATION; selects the travel award variant"
        constraints: "LIVING | POSTHUMOUS_DELEGATION"
      - name: artifact_count
        type: integer
        source: computed
        description: "Artifacts recorded by artifact intake for this induction"
        default: 0
      - name: ceremony_ready
        type: boolean
        source: computed
        description: "True when travel_status IN {APPROVED, WAIVED} AND artifact_status IN {RECEIVED, EXEMPT} AND exhibit_status == INSTALLED"
        default: false

  - name: TravelGrant
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: system
        description: "FK -> InductionCycle.id; copied from the induction, funds the grant"
      - name: induction_id
        type: string
        source: input
        description: "FK -> Induction.id; inductee the grant funds"
      - name: nights
        type: integer
        source: input
        description: "Hotel nights funded per traveler"
        constraints: ">= 1"
      - name: requested_airfare_cents
        type: integer
        source: input
        description: "Airfare requested per traveler in cents, capped by AIRFARE_CAP_CENTS"
        constraints: ">= 0"
      - name: escort_from
        type: datetime
        source: input
        description: "Start of the escort occupation interval; required when variant == POSTHUMOUS_DELEGATION"
        default: null
      - name: escort_to
        type: datetime
        source: input
        description: "End of the escort occupation interval, inclusive"
        default: null
      - name: variant
        type: enum
        source: system
        description: "Award variant copied from Induction.delegation_type at creation"
        constraints: "LIVING_INDUCTEE | POSTHUMOUS_DELEGATION"
      - name: traveler_count
        type: integer
        source: computed
        description: "1 for LIVING_INDUCTEE, 2 for POSTHUMOUS_DELEGATION"
      - name: austerity_tier_applied
        type: enum
        source: system
        description: "Austerity tier frozen from the pre-commitment ratio at creation; approval never recomputes it"
        constraints: "FULL | REDUCED | MINIMAL"
      - name: award_cents
        type: integer
        source: computed
        description: "Award frozen at creation by travel_grant_award_cents"
      - name: status
        type: enum
        source: system
        description: "Grant state"
        default: REQUESTED
        constraints: "REQUESTED | APPROVED | DENIED | CANCELLED"
      - name: cycle_version_after
        type: integer
        source: system
        description: "InductionCycle.version immediately after this grant's most recent mutation, so the next grant can supply a fresh expected_cycle_version"
      - name: cancellation_reason
        type: string
        source: input
        description: "Reason recorded when the grant is denied or when an approved grant is cancelled"
        default: null

  - name: ExhibitCase
    parent: null
    common_fields: true
    fields:
      - name: case_code
        type: string
        source: input
        description: "Short unique code of the display case"
        constraints: "unique across ExhibitCase"
      - name: capacity_artifacts
        type: integer
        source: input
        description: "Maximum artifacts the case can hold across installations with status == INSTALLED"
        constraints: ">= 1"
      - name: changeover_buffer_days
        type: integer
        source: input
        description: "Whole days of dark time required between display windows of two different inductions in this case"
        constraints: ">= 0"
      - name: artifacts_installed
        type: integer
        source: computed
        description: "Sum of ExhibitInstallation.artifact_count for this case with status == INSTALLED"
        default: 0

  - name: ExhibitInstallation
    parent: null
    common_fields: true
    fields:
      - name: induction_id
        type: string
        source: input
        description: "FK -> Induction.id; induction whose artifacts are displayed"
      - name: exhibit_case_id
        type: string
        source: input
        description: "FK -> ExhibitCase.id; case occupied by the display window"
      - name: display_starts_on
        type: datetime
        source: input
        description: "Inclusive start of the display window"
      - name: display_ends_on
        type: datetime
        source: input
        description: "Exclusive end of the display window"
      - name: artifact_count
        type: integer
        source: input
        description: "Artifacts occupying case capacity for this window"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Installation state"
        default: INSTALLED
        constraints: "INSTALLED | WITHDRAWN"

state_machines:
  - entity: InductionCycle
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: NOMINATIONS_OPEN
        trigger: "POST /induction-cycles/{id}/open-nominations"
        actor: ElectionAdministrator
        preconditions:
          - "status == SETUP"
          - "at least one EligibilityRule row exists"
        side_effects:
          - "recomputes credentialed_roster_count"
          - "increments InductionCycle.version by 1"
      - from: NOMINATIONS_OPEN
        to: SCREENING
        trigger: "POST /induction-cycles/{id}/close-nominations"
        actor: ElectionAdministrator
        preconditions:
          - "status == NOMINATIONS_OPEN"
        side_effects:
          - "every Candidacy with cycle_id == this cycle AND status == SUBMITTED transitions to SCREENING (cascade down)"
          - "increments InductionCycle.version by 1"
        note: "Candidacies still SUBMITTED are swept into SCREENING in Candidacy.created_at ASC order."
      - from: SCREENING
        to: BALLOTING
        trigger: "POST /ballots (first ballot of the cycle)"
        actor: ElectionAdministrator
        preconditions:
          - "status == SCREENING"
          - "advanced_candidacy_count >= 1"
          - "expected_cycle_version equals InductionCycle.version"
        side_effects:
          - "sets current_round = 1"
          - "each Candidacy with status == ADVANCED transitions to ON_BALLOT; that ON_BALLOT transition sets Candidacy.appearance_number = Candidate.ballot_appearances_used + 1"
          - "increments InductionCycle.version by 1"
      - from: BALLOTING
        to: BALLOTING
        trigger: "POST /ballots (runoff round, or replacement for an EXPIRED ballot)"
        actor: ElectionAdministrator
        preconditions:
          - "status == BALLOTING"
          - "no Ballot of this cycle has voting_status == OPEN"
          - "the newest Ballot of this cycle has tally_status == AUDIT_CERTIFIED with outcome == RUNOFF_REQUIRED, or voting_status == EXPIRED"
          - "expected_cycle_version equals InductionCycle.version"
        side_effects:
          - "sets current_round = 2 for a runoff round already advanced by the audit certification, or leaves current_round unchanged for a replacement ballot"
          - "creates one BallotSlot per surviving candidacy - the slots CARRIED_TO_RUNOFF on the previous round for a runoff round, or every Candidacy of the cycle still ON_BALLOT for a replacement of an EXPIRED ballot - each pinning candidacy_version_pinned = Candidacy.version"
          - "increments InductionCycle.version by 1"
        note: "Self-transition: the cycle stays in BALLOTING across all rounds; MAX_ROUNDS = 3 caps the runoff loop."
      - from: BALLOTING
        to: CERTIFIED
        trigger: "POST /induction-cycles/{id}/certify-election"
        actor: ElectionAdministrator
        preconditions:
          - "status == BALLOTING"
          - "the newest Ballot of this cycle has tally_status == AUDIT_CERTIFIED"
          - "that ballot's outcome IN {ELECTION_COMPLETE, NO_ELECTION}"
        side_effects:
          - "each BallotSlot with status == ELECTED drives its Candidacy ON_BALLOT -> ELECTED"
          - "each Candidacy ON_BALLOT -> ELECTED transition sets Candidate.hof_status = INDUCTED, increments Candidate.ballot_appearances_used by 1, and creates one Induction (hop 2)"
          - "each Induction creation increments InductionCycle.induction_count by 1 and recomputes ceremony_ready_count (hop 3)"
          - "each Candidacy still ON_BALLOT or ELIMINATED increments Candidate.ballot_appearances_used by 1, then resolves to CARRYOVER_ELIGIBLE or EXPIRED per carryover_and_expiration"
          - "each Candidacy -> EXPIRED transition sets Candidate.veterans_eligible_from_year (hop 3)"
          - "runs elector_participation_maintenance: each CREDENTIALED Elector with no COUNTED submission on any ballot of this cycle has consecutive_missed_cycles incremented; reaching LAPSE_MISSED_CYCLES flips it to LAPSED, which recomputes VoterBloc.seats_filled (hop 3)"
          - "increments InductionCycle.version by 1"
      - from: CERTIFIED
        to: CEREMONY_PLANNED
        trigger: "PATCH /induction-cycles/{id}/ceremony"
        actor: ElectionAdministrator
        preconditions:
          - "status == CERTIFIED"
          - "induction_count >= 1"
          - "ceremony_date > logical clock now"
        side_effects:
          - "stores ceremony_date, ceremony_venue, travel_budget_cents, escort_pool_size"
          - "recomputes austerity_tier from travel_committed_cents / travel_budget_cents"
          - "increments InductionCycle.version by 1"
      - from: CEREMONY_PLANNED
        to: CLOSED
        trigger: "POST /induction-cycles/{id}/hold-ceremony"
        actor: ElectionAdministrator
        preconditions:
          - "status == CEREMONY_PLANNED"
          - "logical clock now >= ceremony_date"
          - "ceremony_ready_count == induction_count"
        side_effects:
          - "every Induction of this cycle transitions ANNOUNCED -> ENSHRINED (cascade down)"
          - "increments InductionCycle.version by 1"

  - entity: Candidacy
    initial_state: SUBMITTED
    terminal_states: [REJECTED, DEFERRED, ELECTED, CARRYOVER_ELIGIBLE, EXPIRED, STRUCK]
    transitions:
      - from: SUBMITTED
        to: SCREENING
        trigger: "system cascade from POST /induction-cycles/{id}/close-nominations"
        actor: system
        preconditions:
          - "owning InductionCycle.status transitions NOMINATIONS_OPEN -> SCREENING"
        side_effects:
          - "increments Candidacy.version by 1"
      - from: SCREENING
        to: INFO_REQUESTED
        trigger: "POST /candidacies/{id}/screening-decisions with decision == REQUEST_INFO"
        actor: ScreeningCommitteeMember
        preconditions:
          - "status == SCREENING"
          - "info_request_count < MAX_INFO_REQUESTS"
          - "acting X-User-ID != nominated_by_elector_id"
        side_effects:
          - "increments info_request_count by 1"
          - "sets screened_by_elector_id to the acting X-User-ID"
      - from: INFO_REQUESTED
        to: SCREENING
        trigger: "POST /candidacies/{id}/supplements"
        actor: Elector
        preconditions:
          - "status == INFO_REQUESTED"
          - "acting X-User-ID == nominated_by_elector_id"
        side_effects:
          - "appends the supplement note to screening_notes"
        note: "Closes the revision cycle SCREENING -> INFO_REQUESTED -> SCREENING; MAX_INFO_REQUESTS = 2 bounds the loop."
      - from: SCREENING
        to: ADVANCED
        trigger: "POST /candidacies/{id}/screening-decisions with decision == ADVANCE"
        actor: ScreeningCommitteeMember
        preconditions:
          - "status == SCREENING"
          - "owning InductionCycle.status == SCREENING"
          - "acting X-User-ID != nominated_by_elector_id"
          - "Candidate.hof_status == NOT_INDUCTED"
        side_effects:
          - "sets screened_by_elector_id to the acting X-User-ID"
          - "increments InductionCycle.advanced_candidacy_count by 1, which increments InductionCycle.version by 1"
      - from: SCREENING
        to: REJECTED
        trigger: "POST /candidacies/{id}/screening-decisions with decision == REJECT"
        actor: ScreeningCommitteeMember
        preconditions:
          - "status == SCREENING"
          - "acting X-User-ID != nominated_by_elector_id"
        side_effects:
          - "sets screened_by_elector_id to the acting X-User-ID"
          - "recomputes InductionCycle.special_election_used when pathway == SPECIAL"
      - from: SCREENING
        to: DEFERRED
        trigger: "POST /candidacies/{id}/screening-decisions with decision == DEFER"
        actor: ScreeningCommitteeMember
        preconditions:
          - "status == SCREENING"
          - "acting X-User-ID != nominated_by_elector_id"
        side_effects:
          - "sets screened_by_elector_id to the acting X-User-ID"
        note: "DEFERRED is terminal for this cycle; a later cycle may file a new candidacy with carryover_from_candidacy_id pointing here."
      - from: ADVANCED
        to: ON_BALLOT
        trigger: "system cascade from POST /ballots"
        actor: system
        preconditions:
          - "a Ballot is constructed for the owning cycle"
        side_effects:
          - "creates one BallotSlot with candidacy_version_pinned = Candidacy.version"
          - "sets appearance_number = Candidate.ballot_appearances_used + 1"
      - from: ON_BALLOT
        to: ELECTED
        trigger: "system cascade from POST /induction-cycles/{id}/certify-election"
        actor: system
        preconditions:
          - "the candidacy's slot on the newest AUDIT_CERTIFIED ballot has status == ELECTED"
        side_effects:
          - "sets Candidate.hof_status = INDUCTED and increments Candidate.ballot_appearances_used by 1"
          - "creates one Induction with delegation_type derived from Candidate.is_deceased"
      - from: ON_BALLOT
        to: ELIMINATED
        trigger: "system cascade from POST /ballots/{id}/audit-decision with decision == CERTIFY and outcome == RUNOFF_REQUIRED"
        actor: system
        preconditions:
          - "the candidacy's slot has vote_pct < EligibilityRule.runoff_floor_pct for the candidacy's category and pathway"
        side_effects:
          - "sets the slot status to NOT_ELECTED so the runoff ballot does not reprint it"
      - from: ON_BALLOT
        to: CARRYOVER_ELIGIBLE
        trigger: "system cascade from POST /induction-cycles/{id}/certify-election"
        actor: system
        preconditions:
          - "latest_round_pct >= EligibilityRule.carryover_min_pct"
          - "Candidate.ballot_appearances_used (after this cycle's increment) < EligibilityRule.max_ballot_appearances"
        side_effects:
          - "increments Candidate.ballot_appearances_used by 1"
      - from: ON_BALLOT
        to: EXPIRED
        trigger: "system cascade from POST /induction-cycles/{id}/certify-election"
        actor: system
        preconditions:
          - "latest_round_pct < EligibilityRule.carryover_min_pct OR Candidate.ballot_appearances_used (after this cycle's increment) >= EligibilityRule.max_ballot_appearances"
        side_effects:
          - "increments Candidate.ballot_appearances_used by 1"
          - "sets Candidate.veterans_eligible_from_year = max(Candidate.retirement_year + VETERANS_MIN_YEARS, InductionCycle.cycle_year + VETERANS_COOLDOWN_YEARS)"
      - from: ELIMINATED
        to: CARRYOVER_ELIGIBLE
        trigger: "system cascade from POST /induction-cycles/{id}/certify-election"
        actor: system
        preconditions:
          - "latest_round_pct >= EligibilityRule.carryover_min_pct"
          - "Candidate.ballot_appearances_used (after this cycle's increment) < EligibilityRule.max_ballot_appearances"
        side_effects:
          - "increments Candidate.ballot_appearances_used by 1"
      - from: ELIMINATED
        to: EXPIRED
        trigger: "system cascade from POST /induction-cycles/{id}/certify-election"
        actor: system
        preconditions:
          - "latest_round_pct < EligibilityRule.carryover_min_pct OR Candidate.ballot_appearances_used (after this cycle's increment) >= EligibilityRule.max_ballot_appearances"
        side_effects:
          - "increments Candidate.ballot_appearances_used by 1"
          - "sets Candidate.veterans_eligible_from_year"
      - from: ON_BALLOT
        to: STRUCK
        trigger: "system cascade from POST /candidates/{id}/permanent-ineligibility"
        actor: system
        preconditions:
          - "the candidate has a slot on a Ballot with voting_status IN {DRAFT, OPEN}"
        side_effects:
          - "sets the BallotSlot status to STRUCK, which decrements Ballot.slot_count and increments Ballot.version by 1 (hop 2)"
          - "every COUNTED VoteSubmission selection of that slot stops counting: BallotSlot.votes_received freezes at 0 and Ballot.total_selections_counted is reduced by the struck selections (hop 3)"

  - entity: Elector
    initial_state: PROVISIONAL
    terminal_states: [LAPSED]
    transitions:
      - from: PROVISIONAL
        to: CREDENTIALED
        trigger: "POST /electors/{id}/credential"
        actor: ElectionAdministrator
        preconditions:
          - "status == PROVISIONAL"
          - "VoterBloc.seats_filled < VoterBloc.seat_cap for the elector's bloc"
          - "credential_expires_on > logical clock now"
        side_effects:
          - "increments VoterBloc.seats_filled by 1"
          - "recomputes InductionCycle.credentialed_roster_count for every cycle with status IN {NOMINATIONS_OPEN, SCREENING, BALLOTING}"
      - from: CREDENTIALED
        to: SUSPENDED
        trigger: "POST /electors/{id}/suspend"
        actor: ElectionAdministrator
        preconditions:
          - "status == CREDENTIALED"
        side_effects:
          - "stores suspension_reason"
          - "leaves VoterBloc.seats_filled unchanged (a suspended elector still occupies a seat)"
          - "recomputes InductionCycle.credentialed_roster_count for every cycle with status IN {NOMINATIONS_OPEN, SCREENING, BALLOTING}"
      - from: SUSPENDED
        to: CREDENTIALED
        trigger: "POST /electors/{id}/reinstate"
        actor: ElectionAdministrator
        preconditions:
          - "status == SUSPENDED"
          - "credential_expires_on > logical clock now"
        side_effects:
          - "clears suspension_reason"
          - "recomputes InductionCycle.credentialed_roster_count for every cycle with status IN {NOMINATIONS_OPEN, SCREENING, BALLOTING}"
        note: "Closes the credentialing cycle CREDENTIALED -> SUSPENDED -> CREDENTIALED."
      - from: CREDENTIALED
        to: LAPSED
        trigger: "system cascade from POST /induction-cycles/{id}/certify-election"
        actor: system
        preconditions:
          - "consecutive_missed_cycles (after this cycle's increment) >= LAPSE_MISSED_CYCLES"
        side_effects:
          - "decrements VoterBloc.seats_filled by 1, freeing the seat for a new credential"

  - entity: Ballot
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /ballots/{id}/certify"
        actor: ElectionAdministrator
        preconditions:
          - "voting_status == DRAFT"
          - "slot_count >= 1"
          - "logical clock now >= opens_at"
          - "logical clock now < closes_at"
        side_effects:
          - "increments Ballot.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /ballots/{id}/close"
        actor: ElectionAdministrator
        preconditions:
          - "voting_status == OPEN"
          - "logical clock now < closes_at"
        side_effects:
          - "snapshots credentialed_roster_at_close = count of Elector rows with status == CREDENTIALED and credential_expires_on >= logical clock now"
      - from: OPEN
        to: EXPIRED
        trigger: "POST /ballots/{id}/close evaluated at or after closes_at"
        actor: ElectionAdministrator
        preconditions:
          - "voting_status == OPEN"
          - "logical clock now >= closes_at"
        side_effects:
          - "snapshots credentialed_roster_at_close"
          - "the ballot becomes permanently untalliable; the cycle must construct a replacement ballot for the same round_number"
        note: "Ballot expiration rule: an expired round is void, no votes on it are ever tabulated."
      - from: NOT_TALLIED
        to: PENDING_AUDIT
        trigger: "POST /ballots/{id}/tally"
        actor: ElectionAdministrator
        preconditions:
          - "voting_status == CLOSED"
          - "tally_status IN {NOT_TALLIED, AUDIT_REJECTED}"
          - "ballots_cast >= 1"
        side_effects:
          - "runs ballot_tally_counts: sets votes_received and vote_pct on every BallotSlot with status == LISTED"
          - "runs election_threshold_votes variant TURNOUT_BASED: sets threshold_votes_provisional"
          - "sets tallied_by_user_id to the acting X-User-ID"
        note: "tally_status is a second, independent dimension of the Ballot state; it advances while voting_status stays CLOSED."
      - from: PENDING_AUDIT
        to: AUDIT_REJECTED
        trigger: "POST /ballots/{id}/audit-decision with decision == REJECT"
        actor: IndependentAuditor
        preconditions:
          - "tally_status == PENDING_AUDIT"
          - "acting X-User-ID != tallied_by_user_id"
        side_effects:
          - "each VoteSubmission id listed in invalidate_submission_ids transitions COUNTED -> INVALIDATED"
          - "each INVALIDATED submission decrements Ballot.ballots_cast and Ballot.total_selections_counted (hop 2)"
          - "each of those decrements reduces votes_received on every BallotSlot the submission had selected and re-derives that slot's vote_pct (hop 3)"
          - "resets threshold_votes_provisional to 0 and clears tallied_by_user_id"
      - from: AUDIT_REJECTED
        to: PENDING_AUDIT
        trigger: "POST /ballots/{id}/tally (re-tally after auditor rejection)"
        actor: ElectionAdministrator
        preconditions:
          - "tally_status == AUDIT_REJECTED"
          - "voting_status == CLOSED"
          - "ballots_cast >= 1"
        side_effects:
          - "recomputes ballot_tally_counts and threshold_votes_provisional over the surviving COUNTED submissions"
          - "sets tallied_by_user_id to the acting X-User-ID"
        note: "Closes the audit cycle PENDING_AUDIT -> AUDIT_REJECTED -> PENDING_AUDIT."
      - from: PENDING_AUDIT
        to: AUDIT_CERTIFIED
        trigger: "POST /ballots/{id}/audit-decision with decision == CERTIFY"
        actor: IndependentAuditor
        preconditions:
          - "tally_status == PENDING_AUDIT"
          - "acting X-User-ID != tallied_by_user_id"
          - "every VoterBloc with seats_filled >= 1 meets min_participation_pct on this ballot"
        side_effects:
          - "runs election_threshold_votes variant ROSTER_BASED: sets threshold_votes_final from credentialed_roster_at_close"
          - "runs election_outcome_resolution: sets each LISTED slot to ELECTED, CARRIED_TO_RUNOFF or NOT_ELECTED, sets elected_slot_count and outcome"
          - "each slot set to CARRIED_TO_RUNOFF leaves its Candidacy ON_BALLOT; each slot set to NOT_ELECTED under outcome == RUNOFF_REQUIRED drives its Candidacy ON_BALLOT -> ELIMINATED"
          - "copies latest_round_votes and latest_round_pct onto every scored Candidacy"
          - "when outcome == RUNOFF_REQUIRED, increments InductionCycle.current_round by 1 and InductionCycle.version by 1"

  - entity: Induction
    initial_state: ANNOUNCED
    terminal_states: [ENSHRINED]
    transitions:
      - from: PENDING
        to: REQUESTED
        trigger: "system cascade from POST /travel-grants"
        actor: system
        preconditions:
          - "travel_status == PENDING"
        side_effects:
          - "recomputes ceremony_ready (stays false)"
        note: "travel_status dimension."
      - from: REQUESTED
        to: APPROVED
        trigger: "system cascade from POST /travel-grants/{id}/approve"
        actor: system
        preconditions:
          - "travel_status == REQUESTED"
        side_effects:
          - "recomputes ceremony_ready; a flip to true increments InductionCycle.ceremony_ready_count by 1"
      - from: APPROVED
        to: PENDING
        trigger: "system cascade from POST /travel-grants/{id}/cancel"
        actor: system
        preconditions:
          - "travel_status == APPROVED"
        side_effects:
          - "recomputes ceremony_ready; a flip to false decrements InductionCycle.ceremony_ready_count by 1"
      - from: REQUESTED
        to: WAIVED
        trigger: "system cascade from POST /travel-grants/{id}/deny"
        actor: system
        preconditions:
          - "travel_status == REQUESTED"
        side_effects:
          - "recomputes ceremony_ready; the inductee travels unfunded and no longer blocks readiness"
      - from: AWAITED
        to: RECEIVED
        trigger: "POST /inductions/{id}/artifact-intake with is_exempt omitted or false"
        actor: CuratorialStaff
        preconditions:
          - "artifact_status == AWAITED"
          - "artifact_count >= 1"
        side_effects:
          - "sets Induction.artifact_count"
          - "recomputes ceremony_ready"
        note: "artifact_status dimension, independent of travel_status."
      - from: AWAITED
        to: EXEMPT
        trigger: "POST /inductions/{id}/artifact-intake with is_exempt == true"
        actor: CuratorialStaff
        preconditions:
          - "artifact_status == AWAITED"
        side_effects:
          - "leaves Induction.artifact_count at 0"
          - "recomputes ceremony_ready"
      - from: NOT_PLANNED
        to: INSTALLED
        trigger: "system cascade from POST /exhibit-installations"
        actor: system
        preconditions:
          - "exhibit_status == NOT_PLANNED"
          - "artifact_status == RECEIVED"
        side_effects:
          - "recomputes ceremony_ready; a flip to true increments InductionCycle.ceremony_ready_count by 1"
        note: "exhibit_status dimension, independent of the other two."
      - from: INSTALLED
        to: NOT_PLANNED
        trigger: "system cascade from POST /exhibit-installations/{id}/withdraw"
        actor: system
        preconditions:
          - "exhibit_status == INSTALLED"
          - "no other ExhibitInstallation for this induction has status == INSTALLED"
        side_effects:
          - "recomputes ceremony_ready; a flip to false decrements InductionCycle.ceremony_ready_count by 1"
      - from: ANNOUNCED
        to: ENSHRINED
        trigger: "system cascade from POST /induction-cycles/{id}/hold-ceremony"
        actor: system
        preconditions:
          - "ceremony_ready == true"
        side_effects:
          - "freezes all three dimensions; no further travel, artifact or exhibit mutation is accepted"

  - entity: TravelGrant
    initial_state: REQUESTED
    terminal_states: [DENIED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /travel-grants/{id}/approve"
        actor: ElectionAdministrator
        preconditions:
          - "status == REQUESTED"
          - "InductionCycle.status == CEREMONY_PLANNED"
          - "award_cents <= InductionCycle.travel_budget_cents - InductionCycle.travel_committed_cents"
          - "escort occupation passes escort_pool_overlap"
        side_effects:
          - "increases InductionCycle.travel_committed_cents by award_cents, which recomputes InductionCycle.austerity_tier and increments InductionCycle.version by 1"
          - "drives Induction.travel_status REQUESTED -> APPROVED (hop 2), which recomputes Induction.ceremony_ready and InductionCycle.ceremony_ready_count (hop 3)"
          - "refreshes cycle_version_after"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /travel-grants/{id}/deny"
        actor: ElectionAdministrator
        preconditions:
          - "status == REQUESTED"
        side_effects:
          - "leaves InductionCycle.travel_committed_cents unchanged"
          - "drives Induction.travel_status REQUESTED -> WAIVED"
          - "refreshes cycle_version_after"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /travel-grants/{id}/cancel"
        actor: ElectionAdministrator
        preconditions:
          - "status == APPROVED"
          - "InductionCycle.status == CEREMONY_PLANNED"
        side_effects:
          - "decreases InductionCycle.travel_committed_cents by award_cents, restoring the pre-approval value exactly (compensation)"
          - "that decrease recomputes InductionCycle.austerity_tier and increments InductionCycle.version by 1 (hop 2)"
          - "drives Induction.travel_status APPROVED -> PENDING (hop 2), which recomputes Induction.ceremony_ready and decrements InductionCycle.ceremony_ready_count (hop 3)"
          - "frees the escort occupation interval for other grants"
          - "refreshes cycle_version_after"

  - entity: ExhibitInstallation
    initial_state: INSTALLED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: INSTALLED
        to: WITHDRAWN
        trigger: "POST /exhibit-installations/{id}/withdraw"
        actor: CuratorialStaff
        preconditions:
          - "status == INSTALLED"
          - "the owning Induction.status == ANNOUNCED"
        side_effects:
          - "decrements ExhibitCase.artifacts_installed by artifact_count, restoring the pre-installation value exactly (compensation)"
          - "frees the display window so a later installation may occupy it"
          - "drives Induction.exhibit_status INSTALLED -> NOT_PLANNED when no other INSTALLED installation remains, which decrements InductionCycle.ceremony_ready_count"

  - entity: VoteSubmission
    initial_state: COUNTED
    terminal_states: [WITHDRAWN, INVALIDATED]
    transitions:
      - from: COUNTED
        to: WITHDRAWN
        trigger: "POST /vote-submissions/{id}/withdraw"
        actor: Elector
        preconditions:
          - "the acting X-User-ID equals VoteSubmission.elector_id"
          - "the owning Ballot.voting_status == OPEN and logical clock now < Ballot.closes_at"
        side_effects:
          - "decrements Ballot.ballots_cast by 1 and reduces Ballot.total_selections_counted by selection_count"
          - "increments Ballot.version by 1 and reports the new value in ballot_version_after"
          - "frees the elector to cast a replacement submission on the same ballot"
        note: "A WITHDRAWN submission is excluded from the one-submission-per-elector uniqueness check, so the elector may re-cast."
      - from: COUNTED
        to: INVALIDATED
        trigger: "system cascade from POST /ballots/{id}/audit-decision with decision == REJECT"
        actor: system
        preconditions:
          - "the submission id appears in invalidate_submission_ids"
        side_effects:
          - "stores invalidated_reason from the auditor's audit_note"
          - "decrements Ballot.ballots_cast by 1 and reduces Ballot.total_selections_counted by selection_count (hop 2)"
          - "reduces votes_received on every BallotSlot the submission had selected and re-derives that slot's vote_pct (hop 3)"
        note: "An INVALIDATED submission still blocks the elector from re-casting - the seat is spent."

concurrency_rules:
  - rule_id: ballot-construct-stale-cycle
    parent_entity: InductionCycle
    write_endpoint: "POST /ballots"
    occ_field: "expected_cycle_version"
    description: |
      Constructing a Ballot against an InductionCycle whose version has advanced
      since the administrator last read it is rejected. The slate a ballot prints
      is derived from the cycle's advanced candidacies, so a stale cycle view means
      the administrator is printing a slate that no longer matches the record - for
      example a screening ADVANCE landed after the read, or another round's ballot
      already superseded this one.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

  - rule_id: vote-cast-stale-ballot
    parent_entity: Ballot
    write_endpoint: "POST /vote-submissions"
    occ_field: "expected_ballot_version"
    description: |
      Casting a VoteSubmission against a Ballot whose version has advanced since
      the elector's client rendered the slate is rejected. Each recorded submission
      and each struck slot advances Ballot.version, so a stale version means the
      elector is voting a slate that no longer matches the printed ballot and must
      re-read it before submitting.
    error_id: ERR_STALE_BALLOT_VERSION
    http_status: 412

  - rule_id: travel-grant-create-stale-cycle
    parent_entity: InductionCycle
    write_endpoint: "POST /travel-grants"
    occ_field: "expected_cycle_version"
    description: |
      Creating a TravelGrant against an InductionCycle whose version has advanced
      since the administrator last read the budget is rejected. The award is frozen
      at creation from the pre-commitment ratio, so a stale cycle view means the
      grant would be priced against a budget position that another approved grant
      has already superseded.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

calculations:
  - name: career_eligibility_assessment
    trigger: "POST /candidacies, before the candidacy row is written"
    algorithm: threshold
    formula: |
      rule = EligibilityRule row WHERE category == Candidate.category
                                 AND pathway == Candidacy.pathway
      if rule is missing: reject ERR_ELIGIBILITY_RULE_NOT_FOUND

      # 1. baseline year and effective waiting period, per pathway
      if pathway == POSTHUMOUS:
          require Candidate.is_deceased == true      else ERR_POSTHUMOUS_PATHWAY_REQUIRES_DECEASED
          baseline_year = max(Candidate.retirement_year, Candidate.death_year)
          effective_waiting_years = POSTHUMOUS_WAITING_YEARS
      elif pathway == SPECIAL:
          baseline_year = Candidate.retirement_year
          effective_waiting_years = 0                # special election waives the wait only
      else:
          baseline_year = Candidate.retirement_year
          effective_waiting_years = rule.waiting_period_years

      eligible_from_year = baseline_year + effective_waiting_years

      # 2. waiting period, inclusive at the boundary
      require InductionCycle.cycle_year >= eligible_from_year   else ERR_WAITING_PERIOD_NOT_MET

      # 3. veterans pathway additionally requires the long-gap floor
      if pathway == VETERANS:
          veterans_floor = Candidate.veterans_eligible_from_year
                           if Candidate.veterans_eligible_from_year is not null
                           else Candidate.retirement_year + VETERANS_MIN_YEARS
          require InductionCycle.cycle_year >= veterans_floor   else ERR_WAITING_PERIOD_NOT_MET

      # 4. career thresholds, inclusive at both boundaries, never waived
      require Candidate.career_seasons      >= rule.min_career_seasons  else ERR_CAREER_THRESHOLD_NOT_MET
      require Candidate.career_metric_value >= rule.min_career_metric   else ERR_CAREER_THRESHOLD_NOT_MET

      # 5. appearance budget
      require Candidate.ballot_appearances_used < rule.max_ballot_appearances
                                                                        else ERR_APPEARANCE_LIMIT_REACHED

      # 6. special election quota
      if pathway == SPECIAL:
          require Candidacy.justification is a non-empty string          else ERR_JUSTIFICATION_REQUIRED
          require InductionCycle.special_election_used < SPECIAL_MAX_PER_CYCLE
                                                                        else ERR_SPECIAL_ELECTION_QUOTA_EXHAUSTED

      write Candidacy.eligible_from_year = eligible_from_year
    input_set: "Exactly one EligibilityRule row keyed by (Candidate.category, Candidacy.pathway); Candidate fields as stored at request time; InductionCycle.cycle_year and special_election_used as stored at request time."
    constants:
      POSTHUMOUS_WAITING_YEARS: 1
      VETERANS_MIN_YEARS: 25
      SPECIAL_MAX_PER_CYCLE: 1
    precision: "Integer years; comparisons are inclusive (>=) on both the waiting period and the career thresholds."

  - name: max_votes_per_elector_for_round
    trigger: "POST /ballots, after the BallotSlot rows for the round have been created"
    algorithm: threshold
    formula: |
      slot_count          = count of BallotSlot rows for this ballot with status == LISTED
      veterans_slot_count = count of those slots with pathway_snapshot == VETERANS

      base = min(MAX_VOTES_CAP, max(MIN_VOTES_FLOOR, floor(slot_count / VOTES_DIVISOR)))
      if round_number > 1:
          base = max(MIN_VOTES_FLOOR, ceil(base / 2))          # runoff rounds narrow the ballot
      if veterans_slot_count >= 1:
          base = min(base + 1, MAX_VOTES_CAP)                  # veterans committee adds one selection

      max_votes_per_elector = base
    input_set: "Only slots of THIS ballot with status == LISTED; struck slots are excluded from both counts. round_number is the ballot's own round, not the cycle's current_round."
    constants:
      MAX_VOTES_CAP: 5
      MIN_VOTES_FLOOR: 1
      VOTES_DIVISOR: 2
    precision: "Integer; floor before the min/max clamp, ceil when halving for a runoff round. Evaluation order is fixed: clamp, then runoff halving, then the veterans bonus."

  - name: ballot_tally_counts
    trigger: "POST /ballots/{id}/tally, and again on every re-tally after an auditor rejection"
    algorithm: aggregation
    formula: |
      counted = VoteSubmission rows WHERE ballot_id == this ballot AND status == COUNTED
                ordered by cast_at ASC, then created_at ASC
      ballots_cast            = count(counted)
      total_selections_counted = sum(s.selection_count for s in counted)

      for each BallotSlot slot of this ballot with status == LISTED:
          slot.votes_received = count(s in counted WHERE slot.id IN s.selected_slot_ids)
          slot.vote_pct       = 0 if ballots_cast == 0
                                else round_half_up(slot.votes_received / ballots_cast, 2)

      slots with status == STRUCK keep votes_received = 0 and vote_pct = 0
    input_set: "Only submissions with status == COUNTED; WITHDRAWN and INVALIDATED submissions are excluded from every count. Abstentions (selection_count == 0) count toward ballots_cast but contribute no slot votes."
    constants: {}
    precision: "votes_received integer; vote_pct 2 decimal places, round_half_up. Processing order (cast_at ASC, created_at ASC) is fixed but the result is order-independent by construction."

  - name: election_threshold_votes
    trigger: "POST /ballots/{id}/tally computes the provisional variant; POST /ballots/{id}/audit-decision with decision == CERTIFY computes the final variant"
    algorithm: threshold
    formula: |
      pct = EligibilityRule.election_threshold_pct for (PLAYER, MODERN)   # the house threshold row
      TURNOUT_BASED: threshold_votes_provisional = ceil(Ballot.ballots_cast * pct)
      ROSTER_BASED : threshold_votes_final       = ceil(Ballot.credentialed_roster_at_close * pct)
    input_set: "ballots_cast counts COUNTED submissions only; credentialed_roster_at_close is the snapshot taken when voting_status left OPEN, i.e. Elector rows with status == CREDENTIALED and credential_expires_on >= that instant. Both denominators are frozen values on the Ballot row, never recomputed at read time."
    constants: {}
    precision: "Integer votes; ceil is applied to the product before comparison. The two variants are compared with >= against BallotSlot.votes_received."
    variants:
      - name: TURNOUT_BASED
        when: "The draft tally produced by the election administrator (tally_status NOT_TALLIED|AUDIT_REJECTED -> PENDING_AUDIT)"
        difference: "Denominator is ballots_cast, so electors who did not vote lower the bar."
      - name: ROSTER_BASED
        when: "The independent auditor's certification (tally_status PENDING_AUDIT -> AUDIT_CERTIFIED)"
        difference: "Denominator is credentialed_roster_at_close, so non-voters count against the candidate; the final threshold is always >= the provisional one and a slot can be provisionally at threshold yet finally short."

  - name: election_outcome_resolution
    trigger: "POST /ballots/{id}/audit-decision with decision == CERTIFY, immediately after threshold_votes_final is set"
    algorithm: waterfall_allocation
    formula: |
      candidates = BallotSlot rows of this ballot with status == LISTED
      qualifying = [s in candidates WHERE s.votes_received >= Ballot.threshold_votes_final]

      # seat waterfall: highest votes first, then the older candidacy
      qualifying_ranked = qualifying sorted by (votes_received DESC,
                                                Candidacy.created_at ASC)
      seats = InductionCycle.max_inductees - (already elected candidacies in this cycle)
      elected = first min(seats, len(qualifying_ranked)) rows of qualifying_ranked

      # outcome is resolved BEFORE slot statuses, so a carried status can never
      # exist without a runoff round to carry it into
      carry_candidates = [s in candidates WHERE s not in elected
                                          AND s.vote_pct >= rule.runoff_floor_pct]
      if len(elected) >= 1:                                        outcome = ELECTION_COMPLETE
      elif Ballot.round_number < MAX_ROUNDS
           and len(carry_candidates) >= MIN_RUNOFF_CONTENDERS:     outcome = RUNOFF_REQUIRED
      else:                                                        outcome = NO_ELECTION

      for s in candidates:
          if s in elected:                                         s.status = ELECTED
          elif outcome == RUNOFF_REQUIRED and s in carry_candidates:
                                                                   s.status = CARRIED_TO_RUNOFF
          else:                                                    s.status = NOT_ELECTED

      elected_slot_count = len(elected)
    input_set: "Only LISTED slots of this ballot. Struck slots never qualify. `already elected candidacies in this cycle` counts Candidacy rows with cycle_id == this cycle AND status == ELECTED from earlier rounds."
    constants:
      MAX_ROUNDS: 3
      MIN_RUNOFF_CONTENDERS: 2
    precision: "Integer comparisons; the seat waterfall is deterministic (votes_received DESC, then Candidacy.created_at ASC - never the row id). A runoff needs at least MIN_RUNOFF_CONTENDERS surviving slots at or above runoff_floor_pct, otherwise the round resolves NO_ELECTION even when one slot was above the floor."

  - name: carryover_and_expiration
    trigger: "POST /induction-cycles/{id}/certify-election, for every Candidacy of the cycle with status IN {ON_BALLOT, ELIMINATED}"
    algorithm: threshold
    formula: |
      rule = EligibilityRule for (Candidate.category, Candidacy.pathway)
      Candidate.ballot_appearances_used += 1                # scored on this cycle's ballot

      if Candidate.ballot_appearances_used >= rule.max_ballot_appearances:
          Candidacy.status = EXPIRED
      elif Candidacy.latest_round_pct >= rule.carryover_min_pct:
          Candidacy.status = CARRYOVER_ELIGIBLE
      else:
          Candidacy.status = EXPIRED

      if Candidacy.status == EXPIRED:
          Candidate.veterans_eligible_from_year =
              max(Candidate.retirement_year + VETERANS_MIN_YEARS,
                  InductionCycle.cycle_year + VETERANS_COOLDOWN_YEARS)
    input_set: "Candidacies of this cycle with status IN {ON_BALLOT, ELIMINATED}, processed in Candidacy.created_at ASC order. Elected candidacies are excluded. latest_round_pct is the value copied from the most recent AUDIT_CERTIFIED ballot."
    constants:
      VETERANS_MIN_YEARS: 25
      VETERANS_COOLDOWN_YEARS: 3
    precision: "The appearance increment happens BEFORE the exhaustion comparison, so a candidate whose third appearance was just scored under max_ballot_appearances == 3 expires even at a high vote_pct. carryover_min_pct is compared inclusively (>=)."

  - name: elector_participation_maintenance
    trigger: "POST /induction-cycles/{id}/certify-election, for every Elector with status == CREDENTIALED"
    algorithm: decay_function
    formula: |
      participated = exists VoteSubmission WHERE status == COUNTED
                     AND ballot_id IN (Ballot ids of this cycle with tally_status == AUDIT_CERTIFIED)
                     AND elector_id == Elector.id
      if participated:
          Elector.consecutive_missed_cycles = 0                  # reset event
          Elector.last_participated_cycle_year = InductionCycle.cycle_year
      else:
          Elector.consecutive_missed_cycles += 1
          if Elector.consecutive_missed_cycles >= LAPSE_MISSED_CYCLES:
              Elector.status = LAPSED                           # frees the bloc seat
    input_set: "Electors with status == CREDENTIALED at certification time, processed in Elector.created_at ASC order. SUSPENDED electors are skipped entirely and keep their counter. Only submissions on AUDIT_CERTIFIED ballots of this cycle count as participation; votes on an EXPIRED or AUDIT_REJECTED ballot do not."
    constants:
      LAPSE_MISSED_CYCLES: 2
    precision: "Integer counter; the lapse comparison is inclusive (>=) and is evaluated after the increment."

  - name: travel_grant_award_cents
    trigger: "POST /travel-grants, frozen onto the grant row at creation; approval never recomputes it"
    algorithm: tiered_pricing
    formula: |
      # STEP 1 - austerity tier from the PRE-COMMITMENT ratio (evaluation order is pinned:
      #          the tier is read from the budget position BEFORE this grant exists, then the
      #          award is computed, and only an approval later moves travel_committed_cents)
      ratio = InductionCycle.travel_committed_cents / InductionCycle.travel_budget_cents
      tier        = FULL    if ratio <  0.50
                    REDUCED if 0.50 <= ratio < 0.80
                    MINIMAL if ratio >= 0.80
      tier_factor = 1.00 if tier == FULL else 0.80 if tier == REDUCED else 0.60

      # STEP 2 - variant from the induction
      if Induction.delegation_type == POSTHUMOUS_DELEGATION:
          traveler_count = POSTHUMOUS_TRAVELER_COUNT      # 2
          per_diem_factor = POSTHUMOUS_PER_DIEM_FACTOR    # 0.75
      else:
          traveler_count = 1
          per_diem_factor = 1.00

      # STEP 3 - per-traveler cost, ROUNDED PER TRAVELER, THEN SUMMED (pinned order)
      per_traveler_per_diem = round_half_up(NIGHTLY_PER_DIEM_CENTS * nights
                                            * tier_factor * per_diem_factor)   # whole cents
      per_traveler_airfare  = min(requested_airfare_cents, AIRFARE_CAP_CENTS)
      per_traveler_total    = per_traveler_per_diem + per_traveler_airfare

      award_cents = traveler_count * per_traveler_total
    input_set: "InductionCycle.travel_committed_cents as stored before this grant row is written (grants with status IN {REQUESTED, DENIED, CANCELLED} contribute nothing); Induction.delegation_type frozen at certification; nights and requested_airfare_cents from the request body."
    constants:
      NIGHTLY_PER_DIEM_CENTS: 18333
      AIRFARE_CAP_CENTS: 95000
      POSTHUMOUS_TRAVELER_COUNT: 2
      POSTHUMOUS_PER_DIEM_FACTOR: 0.75
      AUSTERITY_REDUCED_AT: 0.50
      AUSTERITY_MINIMAL_AT: 0.80
    precision: |
      Whole cents. Rounding order is pinned: round each traveler's per-diem to whole cents
      with round_half_up FIRST, then multiply by traveler_count. Summing the raw per-diems and
      rounding once at the end is WRONG and differs by one cent on fractional cases (e.g.
      nights=3, tier REDUCED, posthumous: per-traveler raw 32999.4 -> 32999 each -> 65998,
      whereas sum-then-round gives 65999). The austerity thresholds are compared with >=.
    variants:
      - name: LIVING_INDUCTEE
        when: "Induction.delegation_type == LIVING"
        difference: "One traveler at the full per-diem factor; escort interval optional."
      - name: POSTHUMOUS_DELEGATION
        when: "Induction.delegation_type == POSTHUMOUS_DELEGATION"
        difference: "Two travelers at a 0.75 per-diem factor and a mandatory escort interval; identical nights and airfare therefore yield a materially different award than the living variant."

  - name: escort_pool_overlap
    trigger: "POST /travel-grants/{id}/approve, before travel_committed_cents moves"
    algorithm: interval_merge
    formula: |
      new = [grant.escort_from, grant.escort_to]                 # CLOSED interval, both ends inclusive
      occupied = TravelGrant rows WHERE cycle_id == grant.cycle_id
                   AND status == APPROVED
                   AND escort_from is not null
                   AND escort_from <= new.escort_to
                   AND new.escort_from <= escort_to              # closed-interval intersection:
                                                                 # touching endpoints DO collide
      probe_points = sorted set of (escort_from of each occupied interval,
                                    escort_to of each occupied interval,
                                    new.escort_from, new.escort_to)
                     clipped to [new.escort_from, new.escort_to]
      for t in probe_points:
          concurrent = count(o in occupied WHERE o.escort_from <= t <= o.escort_to)
          if concurrent + 1 > InductionCycle.escort_pool_size:
              reject ERR_ESCORT_POOL_EXHAUSTED
    input_set: "Only APPROVED grants of the same cycle with a non-null escort interval; REQUESTED, DENIED and CANCELLED grants free their interval immediately."
    constants: {}
    precision: "Closed intervals on both ends: an interval ending exactly when another begins counts as one instant of overlap. Aggregate capacity is escort_pool_size, so overlap is only an error once the concurrent count would EXCEED the pool."

  - name: exhibit_window_conflict
    trigger: "POST /exhibit-installations, before ExhibitCase.artifacts_installed moves"
    algorithm: interval_merge
    formula: |
      new = [display_starts_on, display_ends_on)                 # HALF-OPEN interval
      others = ExhibitInstallation rows WHERE exhibit_case_id == this case
                                         AND status == INSTALLED
      for o in others:
          if o.induction_id == new.induction_id:
              # same inductee: plain half-open intersection, adjacency allowed
              if new.display_starts_on <  o.display_ends_on
                 and o.display_starts_on <  new.display_ends_on:
                  reject ERR_CASE_WINDOW_CONFLICT
          else:
              # different inductee: a changeover gap is required on both sides
              buffer = ExhibitCase.changeover_buffer_days days
              if new.display_starts_on <  o.display_ends_on + buffer
                 and o.display_starts_on <  new.display_ends_on + buffer:
                  reject ERR_CASE_WINDOW_CONFLICT

      # capacity is checked only after the window survives
      if ExhibitCase.artifacts_installed + new.artifact_count > ExhibitCase.capacity_artifacts:
          reject ERR_CASE_CAPACITY_EXCEEDED
      ExhibitCase.artifacts_installed += new.artifact_count
    input_set: "Only installations in the same case with status == INSTALLED; WITHDRAWN installations release both their window and their capacity."
    constants: {}
    precision: "Half-open windows: new.display_starts_on == o.display_ends_on is legal for the same induction. Across inductions the gap must be at least changeover_buffer_days whole days, compared inclusively - a start exactly buffer days after the prior end is accepted."

  - name: induction_ceremony_readiness
    trigger: "Every mutation of Induction.travel_status, Induction.artifact_status or Induction.exhibit_status"
    algorithm: constraint_propagation
    formula: |
      Induction.ceremony_ready =
          (travel_status IN {APPROVED, WAIVED})
          AND (   (artifact_status == RECEIVED AND exhibit_status == INSTALLED)
               OR (artifact_status == EXEMPT)                 # nothing to display
              )

      InductionCycle.ceremony_ready_count = count of Induction rows for the cycle
                                            with ceremony_ready == true
      # gate consumed by POST /induction-cycles/{id}/hold-ceremony
      ceremony_may_be_held = (InductionCycle.ceremony_ready_count == InductionCycle.induction_count)
    input_set: "All three dimensions of the single Induction row being mutated, then all Induction rows of the owning cycle for the count."
    constants: {}
    precision: "Boolean conjunction re-derived on every dimension change; the cycle counter is re-derived from the inductions, never incrementally patched from a stale value. An artifact-EXEMPT induction is ready without any exhibit installation, which is the only way its exhibit dimension can stay NOT_PLANNED and still let the ceremony be held - installations are rejected for EXEMPT inductions by validation priority 66."

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list in the API endpoint table"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "Request body contains every required field of the endpoint, every enum value is a declared member, integers are integers and ISO 8601 timestamps parse"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST, PATCH endpoints"
  - priority: 4
    category: auth
    check: "For the entity_backed roles Elector and ScreeningCommitteeMember, X-User-ID resolves to an existing Elector row"
    error_id: ERR_ELECTOR_IDENTITY_UNKNOWN
    http_status: 403
    applies_to: "POST /candidacies, POST /candidacies/{id}/screening-decisions, POST /candidacies/{id}/supplements, POST /vote-submissions, POST /vote-submissions/{id}/withdraw"
  - priority: 5
    category: existence
    check: "InductionCycle in the path or in cycle_id exists"
    error_id: ERR_CYCLE_NOT_FOUND
    http_status: 404
    applies_to: "all /induction-cycles/{id} endpoints, POST /candidacies, POST /ballots"
  - priority: 6
    category: existence
    check: "Candidate in the path or in candidate_id exists"
    error_id: ERR_CANDIDATE_NOT_FOUND
    http_status: 404
    applies_to: "GET /candidates/{id}, PATCH /candidates/{id}, POST /candidacies"
  - priority: 7
    category: existence
    check: "Candidacy in the path or in carryover_from_candidacy_id exists"
    error_id: ERR_CANDIDACY_NOT_FOUND
    http_status: 404
    applies_to: "all /candidacies/{id} endpoints, POST /candidacies"
  - priority: 8
    category: existence
    check: "Elector in the path, in bloc-scoped filters, or in nominated_by_elector_id exists"
    error_id: ERR_ELECTOR_NOT_FOUND
    http_status: 404
    applies_to: "all /electors/{id} endpoints, POST /candidacies"
  - priority: 9
    category: existence
    check: "Ballot, BallotSlot or VoteSubmission named in the path or body exists"
    error_id: ERR_BALLOT_NOT_FOUND
    http_status: 404
    applies_to: "all /ballots/{id}, /ballot-slots/{id}, /vote-submissions/{id} endpoints, POST /vote-submissions"
  - priority: 10
    category: existence
    check: "Induction or TravelGrant named in the path or body exists"
    error_id: ERR_INDUCTION_NOT_FOUND
    http_status: 404
    applies_to: "all /inductions/{id}, /travel-grants/{id} endpoints, POST /travel-grants, POST /exhibit-installations"
  - priority: 11
    category: existence
    check: "ExhibitCase or ExhibitInstallation named in the path or body exists"
    error_id: ERR_EXHIBIT_NOT_FOUND
    http_status: 404
    applies_to: "all /exhibit-cases/{id}, /exhibit-installations/{id} endpoints, POST /exhibit-installations"
  - priority: 12
    category: existence
    check: "An EligibilityRule row exists for (Candidate.category, Candidacy.pathway), and at least one EligibilityRule row exists before nominations open"
    error_id: ERR_ELIGIBILITY_RULE_NOT_FOUND
    http_status: 404
    applies_to: "POST /candidacies, POST /induction-cycles/{id}/open-nominations"
  - priority: 13
    category: existence
    check: "VoterBloc named in the path or in bloc_id exists"
    error_id: ERR_BLOC_NOT_FOUND
    http_status: 404
    applies_to: "all /voter-blocs/{id} endpoints, POST /electors"
  - priority: 20
    category: state
    check: "InductionCycle.status matches the transition's from-state (SETUP for open-nominations, NOMINATIONS_OPEN for close-nominations and for nomination intake, SCREENING for screening decisions and the first ballot, BALLOTING for certify-election, CERTIFIED for the ceremony patch, CEREMONY_PLANNED for hold-ceremony)"
    error_id: ERR_INVALID_CYCLE_STATE
    http_status: 409
    applies_to: "all /induction-cycles/{id} write endpoints, POST /candidacies, POST /candidacies/{id}/screening-decisions, POST /ballots"
  - priority: 21
    category: state
    check: "Candidacy.status matches the from-state of the requested decision (SCREENING for ADVANCE, REJECT, DEFER, REQUEST_INFO; INFO_REQUESTED for a supplement)"
    error_id: ERR_INVALID_CANDIDACY_STATE
    http_status: 409
    applies_to: "POST /candidacies/{id}/screening-decisions, POST /candidacies/{id}/supplements"
  - priority: 22
    category: state
    check: "Elector.status matches the from-state (PROVISIONAL for credential, CREDENTIALED for suspend, SUSPENDED for reinstate)"
    error_id: ERR_INVALID_ELECTOR_STATE
    http_status: 409
    applies_to: "POST /electors/{id}/credential, POST /electors/{id}/suspend, POST /electors/{id}/reinstate"
  - priority: 23
    category: state
    check: "Ballot.voting_status matches the operation (DRAFT for certify, OPEN for close and for vote submission and withdrawal, CLOSED for tally); constructing a new ballot requires that no Ballot of the cycle has voting_status IN {DRAFT, OPEN}"
    error_id: ERR_INVALID_BALLOT_STATE
    http_status: 409
    applies_to: "POST /ballots, POST /ballots/{id}/certify, POST /ballots/{id}/close, POST /ballots/{id}/tally, POST /vote-submissions, POST /vote-submissions/{id}/withdraw"
  - priority: 24
    category: state
    check: "A Ballot whose voting_status == EXPIRED is never tabulated, audited or voted"
    error_id: ERR_BALLOT_EXPIRED
    http_status: 409
    applies_to: "POST /ballots/{id}/tally, POST /ballots/{id}/audit-decision"
  - priority: 25
    category: state
    check: "Ballot.tally_status matches the operation (NOT_TALLIED or AUDIT_REJECTED for tally, PENDING_AUDIT for an audit decision)"
    error_id: ERR_INVALID_TALLY_STATE
    http_status: 409
    applies_to: "POST /ballots/{id}/tally, POST /ballots/{id}/audit-decision"
  - priority: 26
    category: state
    check: "The newest Ballot of the cycle has tally_status == AUDIT_CERTIFIED and outcome IN {ELECTION_COMPLETE, NO_ELECTION}"
    error_id: ERR_ELECTION_NOT_FINAL
    http_status: 409
    applies_to: "POST /induction-cycles/{id}/certify-election"
  - priority: 27
    category: state
    check: "InductionCycle.status == CEREMONY_PLANNED before any travel grant is created, approved, denied or cancelled"
    error_id: ERR_CEREMONY_NOT_PLANNED
    http_status: 409
    applies_to: "POST /travel-grants, POST /travel-grants/{id}/approve, POST /travel-grants/{id}/deny, POST /travel-grants/{id}/cancel"
  - priority: 28
    category: state
    check: "TravelGrant.status matches the from-state (REQUESTED for approve and deny, APPROVED for cancel)"
    error_id: ERR_INVALID_GRANT_STATE
    http_status: 409
    applies_to: "POST /travel-grants/{id}/approve, POST /travel-grants/{id}/deny, POST /travel-grants/{id}/cancel"
  - priority: 29
    category: state
    check: "Induction dimension matches the operation: status == ANNOUNCED for every mutation, travel_status == PENDING for a new grant, artifact_status == AWAITED for artifact intake, ExhibitInstallation.status == INSTALLED for a withdrawal. An induction already holding an INSTALLED installation may take further installations - exhibit_status is a first-installation flag, not a one-shot lock."
    error_id: ERR_INVALID_INDUCTION_STATE
    http_status: 409
    applies_to: "POST /travel-grants, POST /inductions/{id}/artifact-intake, POST /exhibit-installations, POST /exhibit-installations/{id}/withdraw"
  - priority: 30
    category: state
    check: "expected_cycle_version equals InductionCycle.version at request time"
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
    applies_to: "POST /ballots, POST /travel-grants"
  - priority: 31
    category: state
    check: "expected_ballot_version equals Ballot.version at request time"
    error_id: ERR_STALE_BALLOT_VERSION
    http_status: 412
    applies_to: "POST /vote-submissions"
  - priority: 40
    category: business_safety
    check: "The acting X-User-ID is not the elector who filed the nomination (screening decisions) and is not the user who produced the draft tally (audit decisions)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /candidacies/{id}/screening-decisions, POST /ballots/{id}/audit-decision"
  - priority: 41
    category: business_safety
    check: "When the acting role is Elector, nominated_by_elector_id equals X-User-ID on nomination intake, X-User-ID equals nominated_by_elector_id on a supplement, and X-User-ID equals VoteSubmission.elector_id on a withdrawal"
    error_id: ERR_NOMINATOR_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /candidacies, POST /candidacies/{id}/supplements, POST /vote-submissions/{id}/withdraw"
  - priority: 42
    category: business_safety
    check: "The acting elector under the ScreeningCommitteeMember role has is_screening_member == true and status == CREDENTIALED"
    error_id: ERR_NOT_SCREENING_MEMBER
    http_status: 403
    applies_to: "POST /candidacies/{id}/screening-decisions"
  - priority: 43
    category: business_safety
    check: "The elector whose credential the operation depends on has status == CREDENTIALED (a PROVISIONAL, SUSPENDED or LAPSED elector may neither nominate nor vote)"
    error_id: ERR_ELECTOR_NOT_CREDENTIALED
    http_status: 403
    applies_to: "POST /candidacies, POST /vote-submissions"
  - priority: 44
    category: business_safety
    check: "Elector.credential_expires_on >= logical clock now"
    error_id: ERR_CREDENTIAL_EXPIRED
    http_status: 403
    applies_to: "POST /candidacies, POST /vote-submissions"
  - priority: 45
    category: business_safety
    check: "Candidate.hof_status == NOT_INDUCTED at nomination intake and at an ADVANCE screening decision"
    error_id: ERR_CANDIDATE_INELIGIBLE
    http_status: 422
    applies_to: "POST /candidacies, POST /candidacies/{id}/screening-decisions"
  - priority: 46
    category: business_safety
    check: "POSTHUMOUS pathway requires Candidate.is_deceased == true with a non-null death_year"
    error_id: ERR_POSTHUMOUS_PATHWAY_REQUIRES_DECEASED
    http_status: 422
    applies_to: "POST /candidacies"
  - priority: 47
    category: business_safety
    check: "InductionCycle.cycle_year >= Candidacy.eligible_from_year, and for the VETERANS pathway also >= the veterans long-gap floor"
    error_id: ERR_WAITING_PERIOD_NOT_MET
    http_status: 422
    applies_to: "POST /candidacies"
  - priority: 48
    category: business_safety
    check: "Candidate.career_seasons >= min_career_seasons AND Candidate.career_metric_value >= min_career_metric of the matching EligibilityRule"
    error_id: ERR_CAREER_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /candidacies"
  - priority: 49
    category: business_constraint
    check: "Candidate.ballot_appearances_used < EligibilityRule.max_ballot_appearances"
    error_id: ERR_APPEARANCE_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /candidacies"
  - priority: 50
    category: business_constraint
    check: "SPECIAL pathway requires a non-empty justification"
    error_id: ERR_JUSTIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /candidacies"
  - priority: 51
    category: business_constraint
    check: "InductionCycle.special_election_used < SPECIAL_MAX_PER_CYCLE"
    error_id: ERR_SPECIAL_ELECTION_QUOTA_EXHAUSTED
    http_status: 409
    applies_to: "POST /candidacies"
  - priority: 52
    category: business_constraint
    check: "No other Candidacy exists for the same (cycle_id, candidate_id) with status NOT IN {REJECTED}"
    error_id: ERR_DUPLICATE_CANDIDACY
    http_status: 409
    applies_to: "POST /candidacies"
  - priority: 53
    category: business_constraint
    check: "Candidacy.info_request_count < MAX_INFO_REQUESTS before another REQUEST_INFO decision"
    error_id: ERR_INFO_REQUEST_LIMIT
    http_status: 409
    applies_to: "POST /candidacies/{id}/screening-decisions"
  - priority: 54
    category: business_constraint
    check: "bloc_code, case_code, (category, pathway) and (sport_code, cycle_year) are unique across their tables"
    error_id: ERR_DUPLICATE_CONFIGURATION
    http_status: 409
    applies_to: "POST /voter-blocs, POST /exhibit-cases, POST /eligibility-rules, POST /induction-cycles"
  - priority: 55
    category: business_constraint
    check: "VoterBloc.seats_filled < VoterBloc.seat_cap before a credential is granted"
    error_id: ERR_BLOC_SEATS_EXHAUSTED
    http_status: 409
    applies_to: "POST /electors/{id}/credential"
  - priority: 56
    category: business_constraint
    check: "At least one Candidacy is available for the slate: status == ADVANCED for a first round, a slot with status == CARRIED_TO_RUNOFF on the previous round for a runoff round, or a Candidacy with status == ON_BALLOT when the ballot being replaced has voting_status == EXPIRED"
    error_id: ERR_NO_SLATE_AVAILABLE
    http_status: 409
    applies_to: "POST /ballots"
  - priority: 57
    category: business_temporal
    check: "opens_at < closes_at on ballot construction; ceremony_date > logical clock now on the ceremony patch; display_starts_on < display_ends_on on an installation"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /ballots, PATCH /induction-cycles/{id}/ceremony, POST /exhibit-installations"
  - priority: 58
    category: business_temporal
    check: "logical clock now < Ballot.closes_at when a submission is cast or withdrawn"
    error_id: ERR_VOTING_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /vote-submissions, POST /vote-submissions/{id}/withdraw"
  - priority: 59
    category: business_referential
    check: "Every id in selected_slot_ids is a BallotSlot of the ballot named in ballot_id"
    error_id: ERR_SLOT_NOT_ON_BALLOT
    http_status: 422
    applies_to: "POST /vote-submissions"
  - priority: 60
    category: business_referential
    check: "No id in selected_slot_ids refers to a slot with status == STRUCK"
    error_id: ERR_SLOT_STRUCK
    http_status: 409
    applies_to: "POST /vote-submissions"
  - priority: 61
    category: business_constraint
    check: "No other VoteSubmission exists for the same (ballot_id, elector_id) with status IN {COUNTED, INVALIDATED}"
    error_id: ERR_DUPLICATE_SUBMISSION
    http_status: 409
    applies_to: "POST /vote-submissions"
  - priority: 62
    category: business_constraint
    check: "len(selected_slot_ids) <= Ballot.max_votes_per_elector, and len(selected_slot_ids) == 0 exactly when is_abstention == true"
    error_id: ERR_MAX_VOTES_EXCEEDED
    http_status: 422
    applies_to: "POST /vote-submissions"
  - priority: 63
    category: business_constraint
    check: "Ballot.ballots_cast >= 1 before a tally may run"
    error_id: ERR_NO_BALLOTS_CAST
    http_status: 409
    applies_to: "POST /ballots/{id}/tally"
  - priority: 64
    category: business_constraint
    check: "Every VoterBloc with seats_filled >= 1 has (COUNTED submissions from its electors on this ballot / seats_filled) >= min_participation_pct"
    error_id: ERR_BLOC_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /ballots/{id}/audit-decision with decision == CERTIFY"
  - priority: 65
    category: business_referential
    check: "The Induction named by induction_id belongs to the cycle that funds the grant - when the optional cycle_id is supplied on POST /travel-grants it MUST equal Induction.cycle_id, and the funding cycle whose status and budget are read is always Induction.cycle_id - and the installation's induction and case are both readable"
    error_id: ERR_INDUCTION_CYCLE_MISMATCH
    http_status: 422
    applies_to: "POST /travel-grants, POST /exhibit-installations"
  - priority: 66
    category: business_referential
    check: "Induction.artifact_status == RECEIVED before an exhibit installation is created (an EXEMPT induction never gets a case window)"
    error_id: ERR_ARTIFACTS_NOT_RECEIVED
    http_status: 409
    applies_to: "POST /exhibit-installations"
  - priority: 67
    category: business_temporal
    check: "escort_from and escort_to are both present with escort_from <= escort_to whenever the grant variant is POSTHUMOUS_DELEGATION"
    error_id: ERR_INVALID_ESCORT_INTERVAL
    http_status: 422
    applies_to: "POST /travel-grants"
  - priority: 68
    category: business_temporal
    check: "The new display window clears every INSTALLED window in the same case: half-open intersection for the same induction, and a changeover_buffer_days gap for a different induction"
    error_id: ERR_CASE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /exhibit-installations"
  - priority: 69
    category: business_constraint
    check: "ExhibitCase.artifacts_installed + artifact_count <= ExhibitCase.capacity_artifacts"
    error_id: ERR_CASE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /exhibit-installations"
  - priority: 70
    category: business_constraint
    check: "Approving the grant would not push concurrent escort occupation above InductionCycle.escort_pool_size at any instant of the closed escort interval"
    error_id: ERR_ESCORT_POOL_EXHAUSTED
    http_status: 409
    applies_to: "POST /travel-grants/{id}/approve"
  - priority: 71
    category: business_fiscal
    check: "award_cents <= InductionCycle.travel_budget_cents - InductionCycle.travel_committed_cents, evaluated on creation and again on approval"
    error_id: ERR_TRAVEL_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /travel-grants, POST /travel-grants/{id}/approve"
  - priority: 72
    category: business_temporal
    check: "logical clock now >= InductionCycle.ceremony_date before the ceremony may be held"
    error_id: ERR_CEREMONY_DATE_NOT_REACHED
    http_status: 409
    applies_to: "POST /induction-cycles/{id}/hold-ceremony"
  - priority: 73
    category: business_constraint
    check: "InductionCycle.ceremony_ready_count == InductionCycle.induction_count before the ceremony may be held"
    error_id: ERR_INDUCTIONS_NOT_READY
    http_status: 409
    applies_to: "POST /induction-cycles/{id}/hold-ceremony"

endpoints:
  # ---------------------------------------------------------------- reads ----
  - method: GET
    path: "/induction-cycles/{id}"
    description: "Read one induction cycle with its derived counters, austerity tier and travel commitment"
    roles: [ElectionAdministrator, ScreeningCommitteeMember, Elector, IndependentAuditor, CuratorialStaff]
    code: 200
    input: []
    output: InductionCycle
    side_effects: []
  - method: GET
    path: "/induction-cycles"
    description: "List induction cycles ordered by created_at ASC, then id ASC"
    roles: [ElectionAdministrator, ScreeningCommitteeMember, Elector, IndependentAuditor, CuratorialStaff]
    code: 200
    input: ["sport_code?", "status?", "limit?", "offset?"]
    output: InductionCycle[]
    side_effects: []
  - method: GET
    path: "/eligibility-rules/{id}"
    description: "Read one eligibility rule"
    roles: [ElectionAdministrator, ScreeningCommitteeMember, IndependentAuditor]
    code: 200
    input: []
    output: EligibilityRule
    side_effects: []
  - method: GET
    path: "/eligibility-rules"
    description: "List eligibility rules ordered by created_at ASC, then id ASC"
    roles: [ElectionAdministrator, ScreeningCommitteeMember, Elector, IndependentAuditor]
    code: 200
    input: ["category?", "pathway?", "limit?", "offset?"]
    output: EligibilityRule[]
    side_effects: []
  - method: GET
    path: "/voter-blocs/{id}"
    description: "Read one voter bloc with its live seats_filled count"
    roles: [ElectionAdministrator, IndependentAuditor]
    code: 200
    input: []
    output: VoterBloc
    side_effects: []
  - method: GET
    path: "/voter-blocs"
    description: "List voter blocs ordered by created_at ASC, then id ASC"
    roles: [ElectionAdministrator, IndependentAuditor]
    code: 200
    input: ["bloc_code?", "limit?", "offset?"]
    output: VoterBloc[]
    side_effects: []
  - method: GET
    path: "/candidates/{id}"
    description: "Read one candidate with career figures, deceased flag and hall-of-fame standing"
    roles: [ElectionAdministrator, ScreeningCommitteeMember, Elector, IndependentAuditor, CuratorialStaff]
    code: 200
    input: []
    output: Candidate
    side_effects: []
  - method: GET
    path: "/candidates"
    description: "List candidates ordered by created_at ASC, then id ASC"
    roles: [ElectionAdministrator, ScreeningCommitteeMember, Elector, IndependentAuditor, CuratorialStaff]
    code: 200
    input: ["category?", "hof_status?", "is_deceased?", "limit?", "offset?"]
    output: Candidate[]
    side_effects: []
  - method: GET
    path: "/candidacies/{id}"
    description: "Read one candidacy with its pathway, appearance number and latest-round vote figures"
    roles: [ElectionAdministrator, ScreeningCommitteeMember, Elector, IndependentAuditor, CuratorialStaff]
    code: 200
    input: []
    output: Candidacy
    side_effects: []
  - method: GET
    path: "/candidacies"
    description: "List candidacies filtered by any foreign key, ordered by created_at ASC, then id ASC"
    roles: [ElectionAdministrator, ScreeningCommitteeMember, Elector, IndependentAuditor, CuratorialStaff]
    code: 200
    input: ["cycle_id?", "candidate_id?", "nominated_by_elector_id?", "screened_by_elector_id?", "carryover_from_candidacy_id?", "status?", "pathway?", "limit?", "offset?"]
    output: Candidacy[]
    side_effects: []
  - method: GET
    path: "/electors/{id}"
    description: "Read one elector with credential status and participation history"
    roles: [ElectionAdministrator, IndependentAuditor, Elector, ScreeningCommitteeMember]
    code: 200
    input: []
    output: Elector
    side_effects: []
  - method: GET
    path: "/electors"
    description: "List electors filtered by bloc, ordered by created_at ASC, then id ASC"
    roles: [ElectionAdministrator, IndependentAuditor]
    code: 200
    input: ["bloc_id?", "status?", "is_screening_member?", "limit?", "offset?"]
    output: Elector[]
    side_effects: []
  - method: GET
    path: "/ballots/{id}"
    description: "Read one ballot with both state dimensions, the two threshold figures and the round outcome"
    roles: [ElectionAdministrator, ScreeningCommitteeMember, Elector, IndependentAuditor, CuratorialStaff]
    code: 200
    input: []
    output: Ballot
    side_effects: []
  - method: GET
    path: "/ballots"
    description: "List ballots of a cycle ordered by created_at ASC, then id ASC"
    roles: [ElectionAdministrator, ScreeningCommitteeMember, Elector, IndependentAuditor, CuratorialStaff]
    code: 200
