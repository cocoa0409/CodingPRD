              payload: { donation_product_id: "${prod_id}", impact_season_id: "${s_id}" }
              as: ImpactAuditor
              captures: { liab_row_id: "$.data[0].id", liab_v: "$.data[0].version" }
            - call: "POST /impact-program/marketing-claims/${claim_id}/substantiate"
              payload: {}
              as: MarketingManager
            - call: "POST /impact-program/marketing-claims/${claim_id}/derive-build"
              payload: { expected_liability_version: "${liab_v}" }
              as: MarketingManager
            - call: "GET /impact-program/impact-seasons/${s_id}"
              payload: {}
              as: ImpactAuditor
              captures: { s_v: $.data.version }
            - call: "PUT /impact-program/impact-seasons/${s_id}/frozen-state"
              payload: { is_final: true, expected_season_version: "${s_v}" }
              as: ImpactAuditor
            - call: "POST /impact-program/impact-audits"
              payload: { impact_season_id: "${s_id}", claim_id: "${claim_id}", audit_kind: "ANNUAL_IMPACT" }
              as: ImpactAuditor
              captures: { audit_id: $.data.id }
            - call: "POST /impact-program/impact-audits/${audit_id}/start"
              payload: {}
              as: ImpactAuditor
              captures: { audit_v: $.data.version }
          trigger:
            - call: "POST /impact-program/impact-audits/${audit_id}/finalize"
              payload: { transaction_test_sample_size: 20, transaction_test_exceptions: 0, claimed_donation_units: 11000, expected_audit_version: "${audit_v}" }
              as: ImpactAuditor
              captures: { err_id: $.data.error_id }
          assert:
            - "MarketingClaim.${claim_id}.status == OVERSTATED with substantiated_ratio_value == 0.9167 and required_stated_units == 12000"
            - "the finalize returns 409 ERR_CLAIM_WINDOW_UNSUBSTANTIATED"
            - "ImpactAudit.${audit_id}.status is still IN_PROGRESS and ImpactSeason.${s_id}.status is still FROZEN"
            - "after POST /impact-program/marketing-claims/${claim_id}/revoke, the identical finalize returns 200 and ImpactAudit.${audit_id}.status == FINALIZED"
            - "after the successful finalize, ImpactSeason.${s_id}.status == FINALIZED with unit_clearance_rate 1.0 where shipped_units_verified == received_units_verified == 10000"

      - name: line_valid_transitions_depend_on_the_owning_order_fulfillment_dimension
        grounds:
          - state_machines.SalesOrderLine.OPEN_to_RETURN_REQUESTED
          - state_machines.SalesOrder.PAID_to_PAID
          - state_machines.SalesOrder.CREATED_to_CANCELLED
          - errors[ERR_SALES_ORDER_CANCELLED]
        distinguishing_aspect: "A line's return transition depends on its owning order's status and on the order's independent fulfillment_status dimension rather than on the line's own fields: the identical line becomes returnable or refund-refused purely by moving the order's other state axis."
        test_recipe:
          setup:
            - "The running season is OPEN at 2026-09-01T00:00:00Z; one DUAL_CHANNEL product and one PAID order carrying 2 units, with fulfillment_status still PLACED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
