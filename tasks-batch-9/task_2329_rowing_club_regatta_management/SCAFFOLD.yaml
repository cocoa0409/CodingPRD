scenario: "2329. Rowing Club & Regatta Management (community rowing club): membership tiers across competitive, recreational and learn-to-row with dues and boathouse access rules, equipment fleet management with shell assignment, damage reporting and repair scheduling, coach and coxswain assignment with safety certification and launch operation requirements, water safety protocols including weather, traffic pattern and cold water rules, regatta entry submission with lineup declaration, weigh-ins and scratch deadlines, race day operations across launch scheduling, heat progression and lane assignment, results and protest handling with jury procedures, trailer logistics and boat transport to away regattas"
domain_name: rowing-club-regatta-management
api_prefix: "/boathouse"

complexity_profile:
  primary_archetype: compliance / audit
  secondary_archetype: temporal windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: legal name of the club member
      - name: tier
        type: enum
        source: input
        description: membership tier driving dues, access and shell eligibility
        constraints: one of COMPETITIVE, RECREATIONAL, LEARN_TO_ROW
      - name: club_roles
        type: array
        source: input
        description: operational capacities this member may fill
        default: []
        constraints: subset of [ATHLETE, COXSWAIN, COACH, LAUNCH_DRIVER, JURY, EQUIPMENT_MANAGER]
      - name: membership_status
        type: enum
        source: system
        description: lifecycle state governed by the Member state machine
        default: ACTIVE
        constraints: one of ACTIVE, DUES_HOLD, SUSPENDED, WITHDRAWN
      - name: body_weight_kg
        type: number
        source: input
        description: self-declared body weight, 1 decimal place, used as the weigh-in expectation
      - name: swim_test_passed_on
        type: datetime
        source: input
        description: date the annual swim test was passed; null when never passed
        default: null
      - name: coxswain_cert_expires_at
        type: datetime
        source: input
        description: expiry instant of the coxswain certification; null when uncertified
        default: null
      - name: coach_cert_expires_at
        type: datetime
        source: input
        description: expiry instant of the coaching certification; null when uncertified
        default: null
      - name: safety_launch_cert_expires_at
        type: datetime
        source: input
        description: expiry instant of the launch-operation safety certification; null when uncertified
        default: null
      - name: launch_supervision_limit
        type: integer
        source: input
        description: maximum number of overlapping water sessions this member may cover as a launch driver
        default: 2
        constraints: integer 1..4
      - name: dues_balance_cents
        type: integer
        source: computed
        description: sum of (assessed_cents - paid_cents) over this member's DuesInvoice rows whose status IN {ISSUED, PARTIALLY_PAID, DELINQUENT}
      - name: logged_session_count
        type: integer
        source: computed
        description: count of WaterSession rows with status == RETURNED whose athlete_member_ids array contains this member id
      - name: boathouse_access_level
        type: enum
        source: computed
        description: FULL when membership_status == ACTIVE and dues_balance_cents == 0; SUPERVISED when membership_status == ACTIVE and dues_balance_cents > 0; NONE when membership_status IN {DUES_HOLD, SUSPENDED, WITHDRAWN}
        constraints: one of FULL, SUPERVISED, NONE

  - name: DuesInvoice
    parent: Member
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: FK -> Member.id; the billed member
      - name: season_year
        type: integer
        source: input
        description: rowing season the invoice covers
      - name: billable_months
        type: integer
        source: input
        description: months of the 12-month season this invoice prorates
        constraints: integer 1..12
      - name: locker_requested
        type: boolean
        source: input
        description: whether a boathouse locker is billed on this invoice
        default: false
      - name: due_at
        type: datetime
        source: input
        description: instant after which an unpaid invoice becomes DELINQUENT
      - name: variant_basis
        type: enum
        source: computed
        description: which dues_assessment variant produced assessed_cents
        default: PROVISIONAL
        constraints: one of PROVISIONAL, TRUEUP
      - name: assessed_cents
        type: integer
        source: computed
        description: output of calculations.dues_assessment for the active variant_basis
      - name: trueup_cents
        type: integer
        source: computed
        description: signed delta applied by the last true-up (trueup assessed minus provisional assessed); null before any true-up
        default: null
      - name: paid_cents
        type: integer
        source: computed
        description: cumulative sum of accepted payment amount_cents on this invoice
        default: 0
      - name: status
        type: enum
        source: system
        description: lifecycle state governed by the DuesInvoice state machine
        default: ISSUED
        constraints: one of ISSUED, PARTIALLY_PAID, PAID, DELINQUENT, VOIDED

  - name: Shell
    parent: null
    common_fields: true
    fields:
      - name: hull_name
        type: string
        source: input
        description: club name painted on the hull
      - name: boat_class
        type: enum
        source: input
        description: shell class determining seat count, rack slot units and entry fee
        constraints: one of 1X, 2X, 4+, 8+
      - name: hull_weight_kg
        type: number
        source: input
        description: dry hull weight, 1 decimal place
      - name: tier_restriction
        type: enum
        source: input
        description: which membership tiers may be seated in this hull
        default: ANY
        constraints: one of COMPETITIVE_ONLY, ANY
      - name: home_bay
        type: string
        source: input
        description: boathouse bay label where the shell is racked
      - name: last_serviced_at
        type: datetime
        source: input
        description: last full-service instant; null when never serviced
        default: null
      - name: slot_units
        type: integer
        source: computed
        description: trailer rack units this hull occupies, from calculations.trailer_rack_allocation constant CLASS_SLOT_UNITS keyed by boat_class
      - name: status
        type: enum
        source: system
        description: lifecycle state governed by the Shell state machine
        default: AVAILABLE
        constraints: one of AVAILABLE, ASSIGNED, DAMAGED, IN_REPAIR, RETIRED
      - name: condition_index_conservative
        type: integer
        source: computed
        description: output of calculations.shell_condition_index variant conservative
        default: 100
      - name: condition_index_optimistic
        type: integer
        source: computed
        description: output of calculations.shell_condition_index variant optimistic
        default: 100

  - name: DamageReport
    parent: Shell
    common_fields: true
    fields:
      - name: shell_id
        type: string
        source: input
        description: FK -> Shell.id; the damaged hull
      - name: reported_by_member_id
        type: string
        source: input
        description: FK -> Member.id; the member who filed the report
      - name: severity
        type: enum
        source: input
        description: damage severity driving severity_points and the repair path
        constraints: one of COSMETIC, MINOR, MAJOR, STRUCTURAL
      - name: narrative
        type: string
        source: input
        description: free-text description of the damage
      - name: reported_at
        type: datetime
        source: system
        description: logical-clock instant at creation; the decay baseline for shell_condition_index
      - name: triaged_by_user_id
        type: string
        source: system
        description: X-User-ID of the equipment manager who triaged the report; null before triage
        default: null
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the equipment manager who verified the repair; null before verification
        default: null
      - name: assigned_repair_bay
        type: string
        source: input
        description: repair bay label reserved by schedule-repair; null before scheduling
        default: null
      - name: repair_window_start_at
        type: datetime
        source: input
        description: inclusive start of the reserved repair window; null before scheduling
        default: null
      - name: repair_window_end_at
        type: datetime
        source: input
        description: inclusive end of the reserved repair window; null before scheduling
        default: null
      - name: severity_points
        type: number
        source: computed
        description: decayed deduction this report currently contributes, per calculations.shell_condition_index
      - name: status
        type: enum
        source: system
        description: lifecycle state governed by the DamageReport state machine
        default: REPORTED
        constraints: one of REPORTED, TRIAGED, REPAIR_SCHEDULED, VERIFIED, CONDEMNED, CLOSED_NO_ACTION

  - name: WaterConditionReading
    parent: null
    common_fields: false
    fields:
      - name: observed_at
        type: datetime
        source: input
        description: instant the conditions were observed
      - name: air_temp_c
        type: number
        source: input
        description: air temperature in Celsius, 1 decimal place
      - name: water_temp_c
        type: number
        source: input
        description: water temperature in Celsius, 1 decimal place
      - name: wind_speed_kt
        type: number
        source: input
        description: sustained wind speed in knots, 1 decimal place
      - name: visibility_m
        type: integer
        source: input
        description: horizontal visibility in metres
      - name: traffic_pattern
        type: enum
        source: input
        description: river traffic pattern in force for this reading
        constraints: one of STANDARD_COUNTERCLOCKWISE, REVERSED_CLOCKWISE, NARROW_CHANNEL
      - name: cold_water_flag
        type: boolean
        source: computed
        description: output of calculations.water_posture_evaluation cold-water predicate
      - name: posture
        type: enum
        source: computed
        description: output of calculations.water_posture_evaluation gating all session clearance
        constraints: one of OPEN, RESTRICTED, CLOSED

  - name: WaterSession
    parent: null
    common_fields: true
    fields:
      - name: shell_id
        type: string
        source: input
        description: FK -> Shell.id; hull reserved for this outing
      - name: coach_member_id
        type: string
        source: input
        description: FK -> Member.id; supervising coach; null for unsupervised recreational outings
        default: null
      - name: coxswain_member_id
        type: string
        source: input
        description: FK -> Member.id; steering coxswain; null for sculling classes
        default: null
      - name: primary_launch_driver_member_id
        type: string
        source: input
        description: FK -> Member.id; first safety-launch driver; null when no launch is assigned
        default: null
      - name: secondary_launch_driver_member_id
        type: string
        source: input
        description: FK -> Member.id; second safety-launch driver; null when only one launch is assigned
        default: null
      - name: athlete_member_ids
        type: array
        source: input
        description: FK -> Member.id; ordered roster of seated athletes, bow to stern
        default: []
      - name: reading_id
        type: string
        source: system
        description: FK -> WaterConditionReading.id; reading the clearance decision was made against; null before clearance
        default: null
      - name: session_kind
        type: enum
        source: input
        description: outing type driving launch coverage requirements
        constraints: one of PRACTICE, LEARN_TO_ROW, RACE_PREP
      - name: planned_start_at
        type: datetime
        source: input
        description: inclusive start of the water window
      - name: planned_end_at
        type: datetime
        source: input
        description: exclusive end of the water window
      - name: actual_return_at
        type: datetime
        source: system
        description: logical-clock instant the crew was logged back in; null before return
        default: null
      - name: required_launch_count
        type: integer
        source: computed
        description: output of calculations.session_launch_requirement, recomputed at clearance
        default: 0
      - name: assigned_launch_count
        type: integer
        source: computed
        description: count of non-null values among primary_launch_driver_member_id and secondary_launch_driver_member_id
        default: 0
      - name: status
        type: enum
        source: system
        description: lifecycle state governed by the WaterSession state machine
        default: PLANNED
        constraints: one of PLANNED, CLEARED, LAUNCHED, RETURNED, CANCELLED

  - name: Regatta
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: regatta title
      - name: host_club
        type: string
        source: input
        description: organising club
      - name: venue_kind
        type: enum
        source: input
        description: HOME when raced on the club's own water, AWAY when boats must be trailered
        constraints: one of HOME, AWAY
      - name: race_date_at
        type: datetime
        source: input
        description: first race instant of the regatta
      - name: entry_deadline_at
        type: datetime
        source: input
        description: instant after which submissions incur the late fee
      - name: scratch_deadline_at
        type: datetime
        source: input
        description: instant after which scratches earn no refund
      - name: weigh_in_opens_at
        type: datetime
        source: input
        description: inclusive start of the coxswain weigh-in window
      - name: weigh_in_closes_at
        type: datetime
        source: input
        description: exclusive end of the coxswain weigh-in window
      - name: late_entry_allowed
        type: boolean
        source: input
        description: whether the host permits reopening entries after they close
        default: false
      - name: net_fee_cents
        type: integer
        source: computed
        description: sum of (total_fee_cents - COALESCE(refund_cents, 0)) over this regatta's RegattaEntry rows whose status IN {SUBMITTED, CONFIRMED, RACED, SCRATCHED}
        default: 0
      - name: deposit_held_cents
        type: integer
        source: computed
        description: sum of deposit_cents over Protest rows attached to this regatta's heats whose deposit_refunded == false and status != WITHDRAWN
        default: 0
      - name: status
        type: enum
        source: system
        description: lifecycle state governed by the Regatta state machine
        default: OPEN_FOR_ENTRY
        constraints: one of OPEN_FOR_ENTRY, ENTRIES_CLOSED, RACING, COMPLETE, CANCELLED

  - name: RegattaEntry
    parent: Regatta
    common_fields: true
    fields:
      - name: regatta_id
        type: string
        source: input
        description: FK -> Regatta.id; regatta being entered
      - name: shell_id
        type: string
        source: input
        description: FK -> Shell.id; hull the crew will race
      - name: trailer_load_id
        type: string
        source: system
        description: FK -> TrailerLoad.id; trailer holding this hull; null until a rack unit is assigned
        default: null
      - name: event_code
        type: string
        source: input
        description: host event identifier, e.g. M8PLUS_OPEN
      - name: boat_class
        type: enum
        source: input
        description: raced class; must equal Shell.boat_class of shell_id
        constraints: one of 1X, 2X, 4+, 8+
      - name: seed_time_seconds
        type: number
        source: input
        description: declared seed time in seconds, 1 decimal place, used as the lane-assignment sort key
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of the submit call; null before submission
        default: null
      - name: base_fee_cents
        type: integer
        source: computed
        description: CLASS_ENTRY_FEE_CENTS component of calculations.regatta_entry_fee
        default: 0
      - name: transport_levy_cents
        type: integer
        source: computed
        description: away-transport component of calculations.regatta_entry_fee
        default: 0
      - name: late_fee_cents
        type: integer
        source: computed
        description: late component of calculations.regatta_entry_fee
        default: 0
      - name: total_fee_cents
        type: integer
        source: computed
        description: final output of calculations.regatta_entry_fee
        default: 0
      - name: refund_cents
        type: integer
        source: computed
        description: output of calculations.scratch_refund; null until the entry is scratched
        default: null
      - name: rack_tier
        type: integer
        source: computed
        description: 1-based trailer tier index awarded by calculations.trailer_rack_allocation; null when not racked
        default: null
      - name: rack_position
        type: integer
        source: computed
        description: 1-based first occupied unit position within rack_tier; null when not racked
        default: null
      - name: status
        type: enum
        source: system
        description: lifecycle state governed by the RegattaEntry state machine
        default: DRAFT
        constraints: one of DRAFT, LINEUP_DECLARED, SUBMITTED, CONFIRMED, RACED, SCRATCHED

  - name: LineupSeat
    parent: RegattaEntry
    common_fields: true
    fields:
      - name: regatta_entry_id
        type: string
        source: input
        description: FK -> RegattaEntry.id; entry this seat belongs to
      - name: member_id
        type: string
        source: input
        description: FK -> Member.id; person occupying the seat
      - name: seat_number
        type: integer
        source: input
        description: 1-based seat index, bow to stern; 0 denotes the coxswain seat
        constraints: integer 0..8
      - name: seat_role
        type: enum
        source: input
        description: capacity in which the member is seated
        constraints: one of ROWER, COXSWAIN
      - name: weighed_kg
        type: number
        source: system
        description: weight recorded at weigh-in, 1 decimal place; null before weigh-in
        default: null
      - name: weighed_by_user_id
        type: string
        source: system
        description: X-User-ID of the official who recorded the weigh-in; null before weigh-in
        default: null
      - name: deadweight_kg
        type: number
        source: computed
        description: max(0, MIN_COXSWAIN_WEIGHT_KG - weighed_kg) rounded half up to 1 decimal place; 0 for ROWER seats; null before weigh-in
        default: null
      - name: weigh_in_status
        type: enum
        source: computed
        description: NOT_REQUIRED for ROWER seats; otherwise PENDING until weighed, then PASSED or FAILED per validations
        default: NOT_REQUIRED
        constraints: one of NOT_REQUIRED, PENDING, PASSED, FAILED
      - name: eligibility_status
        type: enum
        source: computed
        description: ELIGIBLE when the seated member clears dues, certification and safety gates; otherwise the first blocking reason in validation priority order
        default: ELIGIBLE
        constraints: one of ELIGIBLE, BLOCKED_DUES, BLOCKED_CERT, BLOCKED_SAFETY

  - name: Heat
    parent: Regatta
    common_fields: true
    fields:
      - name: regatta_id
        type: string
        source: input
        description: FK -> Regatta.id; regatta the heat belongs to
      - name: advances_to_heat_id
        type: string
        source: input
        description: FK -> Heat.id; downstream round this heat feeds; null for finals
        default: null
      - name: event_code
        type: string
        source: input
        description: host event identifier this heat races
      - name: round_kind
        type: enum
        source: input
        description: round of the progression tree
        constraints: one of HEAT, SEMI, FINAL
      - name: scheduled_start_at
        type: datetime
        source: input
        description: scheduled first-stroke instant
      - name: lane_count
        type: integer
        source: input
        description: number of buoyed lanes available
        constraints: integer 1..8
      - name: advance_count
        type: integer
        source: input
        description: number of automatic qualifiers from this heat
        default: 0
        constraints: integer 0..8
      - name: occupied_lane_count
        type: integer
        source: computed
        description: count of RaceLane rows on this heat whose lane_status != VOIDED
        default: 0
      - name: free_lane_count
        type: integer
        source: computed
        description: lane_count - occupied_lane_count
        default: 0
      - name: protest_window_closes_at
        type: datetime
        source: computed
        description: results-posting instant plus PROTEST_WINDOW_MINUTES; null before results are posted
        default: null
      - name: status
        type: enum
        source: system
        description: lifecycle state governed by the Heat state machine
        default: SCHEDULED
        constraints: one of SCHEDULED, LANES_ASSIGNED, RESULTS_PROVISIONAL, RESULTS_OFFICIAL

  - name: RaceLane
    parent: Heat
    common_fields: true
    fields:
      - name: heat_id
        type: string
        source: input
        description: FK -> Heat.id; heat this lane belongs to
      - name: regatta_entry_id
        type: string
        source: input
        description: FK -> RegattaEntry.id; crew occupying the lane
      - name: lane_number
        type: integer
        source: computed
        description: buoyed lane awarded by calculations.lane_assignment_order
      - name: elapsed_seconds
        type: number
        source: input
        description: recorded finish time in seconds, 1 decimal place; null before results are posted
        default: null
      - name: place
        type: integer
        source: computed
        description: 1-based finish rank within the heat over lanes whose lane_status IN {PROVISIONAL, OFFICIAL}, elapsed_seconds ASC, tie-break created_at ASC; null before results
        default: null
      - name: advanced
        type: boolean
        source: computed
        description: whether calculations.heat_advancement_selection promoted this crew into advances_to_heat_id
        default: false
      - name: lane_status
        type: enum
        source: system
        description: lifecycle state governed by the RaceLane state machine
        default: PENDING
        constraints: one of PENDING, PROVISIONAL, OFFICIAL, DISQUALIFIED, VOIDED

  - name: Protest
    parent: Heat
    common_fields: true
    fields:
      - name: heat_id
        type: string
        source: input
        description: FK -> Heat.id; heat under protest
      - name: filed_by_member_id
        type: string
        source: input
        description: FK -> Member.id; member lodging the protest
      - name: against_race_lane_id
        type: string
        source: input
        description: FK -> RaceLane.id; lane whose conduct is challenged
      - name: ground_code
        type: enum
        source: input
        description: rulebook ground cited
        constraints: one of INTERFERENCE, LANE_VIOLATION, EQUIPMENT, FALSE_START
      - name: narrative
        type: string
        source: input
        description: free-text statement of the incident
      - name: filed_at
        type: datetime
        source: system
        description: logical-clock instant of filing; must fall inside the heat's protest window
      - name: deposit_cents
        type: integer
        source: computed
        description: PROTEST_DEPOSIT_CENTS held from the filer at creation
        default: 5000
      - name: deposit_refunded
        type: boolean
        source: computed
        description: true once the jury upholds the protest and the deposit is released
        default: false
      - name: review_round
        type: integer
        source: computed
        description: number of times the jury has opened review on this protest
        default: 0
      - name: jury_user_id
        type: string
        source: system
        description: X-User-ID of the jury chair who opened the current review round; null before review
        default: null
      - name: status
        type: enum
        source: system
        description: lifecycle state governed by the Protest state machine
        default: FILED
        constraints: one of FILED, UNDER_JURY_REVIEW, REMANDED, UPHELD, DENIED, WITHDRAWN

  - name: TrailerLoad
    parent: null
    common_fields: true
    fields:
      - name: regatta_id
        type: string
        source: input
        description: FK -> Regatta.id; away regatta this load travels to
      - name: driver_member_id
        type: string
        source: input
        description: FK -> Member.id; towing driver
      - name: tow_vehicle_code
        type: string
        source: input
        description: club vehicle identifier
      - name: rack_tier_count
        type: integer
        source: input
        description: number of horizontal rack tiers on the trailer
        default: 4
        constraints: integer 1..4
      - name: rack_units_per_tier
        type: integer
        source: input
        description: rack units available on each tier
        default: 4
        constraints: integer 1..4
      - name: rack_unit_capacity
        type: integer
        source: computed
        description: rack_tier_count * rack_units_per_tier
      - name: rack_units_used
        type: integer
        source: computed
        description: sum of Shell.slot_units over RegattaEntry rows whose trailer_load_id equals this load and whose status IN {SUBMITTED, CONFIRMED, RACED}
        default: 0
      - name: rack_units_free
        type: integer
        source: computed
        description: rack_unit_capacity - rack_units_used
      - name: depart_at
        type: datetime
        source: input
        description: scheduled departure instant
      - name: return_at
        type: datetime
        source: input
        description: scheduled return instant
      - name: status
        type: enum
        source: system
        description: lifecycle state governed by the TrailerLoad state machine
        default: OPEN
        constraints: one of OPEN, SEALED, DEPARTED, ARRIVED, RETURNED

state_machines:
  - entity: Member
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: DUES_HOLD
        trigger: "POST /boathouse/ops/dues-delinquency-run"
        actor: ClubAdmin
        preconditions:
          - "at least one DuesInvoice with member_id == this member transitioned ISSUED->DELINQUENT or PARTIALLY_PAID->DELINQUENT inside this same run"
        side_effects:
          - "recompute Member.boathouse_access_level to NONE"
          - "for every LineupSeat with member_id == this member whose parent RegattaEntry.status IN {LINEUP_DECLARED, SUBMITTED, CONFIRMED}: set LineupSeat.eligibility_status = BLOCKED_DUES"
          - "each LineupSeat that just became BLOCKED_DUES drives its parent RegattaEntry through SUBMITTED->LINEUP_DECLARED (see RegattaEntry machine); that demotion in turn voids the entry's RaceLane rows"
        note: "cascade hop 2 of the delinquency chain; hops 3 and 4 fire from the side effects listed here"
      - from: DUES_HOLD
        to: ACTIVE
        trigger: "POST /boathouse/dues-invoices/{id}/payments"
        actor: Member
        preconditions:
          - "after applying this payment, Member.dues_balance_cents == 0"
        side_effects:
          - "recompute Member.boathouse_access_level to FULL"
          - "for every LineupSeat with member_id == this member whose eligibility_status == BLOCKED_DUES: recompute eligibility_status to ELIGIBLE"
        note: "closes the ACTIVE->DUES_HOLD->ACTIVE cycle"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /boathouse/members/{id}/status-transitions with to_status=SUSPENDED"
        actor: ClubAdmin
        preconditions:
          - "no WaterSession with status == LAUNCHED references this member in coach_member_id, coxswain_member_id, primary_launch_driver_member_id, secondary_launch_driver_member_id or athlete_member_ids"
        side_effects:
          - "every WaterSession with status IN {PLANNED, CLEARED} referencing this member transitions to CANCELLED"
          - "recompute Member.boathouse_access_level to NONE"
      - from: DUES_HOLD
        to: SUSPENDED
        trigger: "POST /boathouse/members/{id}/status-transitions with to_status=SUSPENDED"
        actor: ClubAdmin
        preconditions:
          - "no WaterSession with status == LAUNCHED references this member in any member-valued field"
        side_effects:
          - "every WaterSession with status IN {PLANNED, CLEARED} referencing this member transitions to CANCELLED"
          - "recompute Member.boathouse_access_level to NONE"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /boathouse/members/{id}/status-transitions with to_status=ACTIVE"
        actor: ClubAdmin
        preconditions:
          - "Member.dues_balance_cents == 0"
        side_effects:
          - "recompute Member.boathouse_access_level to FULL"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /boathouse/members/{id}/status-transitions with to_status=WITHDRAWN"
        actor: ClubAdmin
        preconditions:
          - "no LineupSeat with member_id == this member has a parent RegattaEntry whose status IN {LINEUP_DECLARED, SUBMITTED, CONFIRMED}"
        side_effects:
          - "recompute Member.boathouse_access_level to NONE"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /boathouse/members/{id}/status-transitions with to_status=WITHDRAWN"
        actor: ClubAdmin
        preconditions:
          - "no LineupSeat with member_id == this member has a parent RegattaEntry whose status IN {LINEUP_DECLARED, SUBMITTED, CONFIRMED}"
        side_effects:
          - "recompute Member.boathouse_access_level to NONE"

  - entity: DuesInvoice
    initial_state: ISSUED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /boathouse/dues-invoices/{id}/payments"
        actor: Member
        preconditions:
          - "0 < paid_cents + amount_cents < assessed_cents"
        side_effects:
          - "paid_cents += amount_cents"
          - "recompute Member.dues_balance_cents"
          - "recompute Member.boathouse_access_level"
      - from: ISSUED
        to: PAID
        trigger: "POST /boathouse/dues-invoices/{id}/payments"
        actor: Member
        preconditions:
          - "paid_cents + amount_cents >= assessed_cents"
        side_effects:
          - "paid_cents += amount_cents"
          - "recompute Member.dues_balance_cents"
          - "recompute Member.boathouse_access_level"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /boathouse/dues-invoices/{id}/payments"
        actor: Member
        preconditions:
          - "paid_cents + amount_cents >= assessed_cents"
        side_effects:
          - "paid_cents += amount_cents"
          - "recompute Member.dues_balance_cents"
          - "recompute Member.boathouse_access_level"
      - from: ISSUED
        to: DELINQUENT
        trigger: "POST /boathouse/ops/dues-delinquency-run"
        actor: ClubAdmin
        preconditions:
          - "logical clock now > due_at"
          - "paid_cents < assessed_cents"
        side_effects:
          - "recompute Member.dues_balance_cents"
          - "drive the billed Member through ACTIVE->DUES_HOLD (hop 2 of the delinquency cascade)"
      - from: PARTIALLY_PAID
        to: DELINQUENT
        trigger: "POST /boathouse/ops/dues-delinquency-run"
        actor: ClubAdmin
        preconditions:
          - "logical clock now > due_at"
          - "paid_cents < assessed_cents"
        side_effects:
          - "recompute Member.dues_balance_cents"
          - "drive the billed Member through ACTIVE->DUES_HOLD (hop 2 of the delinquency cascade)"
      - from: DELINQUENT
        to: PARTIALLY_PAID
        trigger: "POST /boathouse/dues-invoices/{id}/payments"
        actor: Member
        preconditions:
          - "0 < paid_cents + amount_cents < assessed_cents"
        side_effects:
          - "paid_cents += amount_cents"
          - "recompute Member.dues_balance_cents"
        note: "DELINQUENT->PARTIALLY_PAID->DELINQUENT is a permitted cycle across successive delinquency runs"
      - from: DELINQUENT
        to: PAID
        trigger: "POST /boathouse/dues-invoices/{id}/payments"
        actor: Member
        preconditions:
          - "paid_cents + amount_cents >= assessed_cents"
        side_effects:
          - "paid_cents += amount_cents"
          - "recompute Member.dues_balance_cents"
          - "when Member.dues_balance_cents == 0, drive the Member through DUES_HOLD->ACTIVE"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /boathouse/dues-invoices/{id}/true-up"
        actor: ClubAdmin
        preconditions:
          - "calculations.dues_assessment variant trueup_actual yields assessed_cents <= paid_cents"
        side_effects:
          - "variant_basis = TRUEUP; assessed_cents = trueup result; trueup_cents = trueup result - previous assessed_cents"
          - "recompute Member.dues_balance_cents"
        note: "a credit-side true-up can settle an invoice without any payment"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /boathouse/dues-invoices/{id}/void"
        actor: ClubAdmin
        preconditions:
          - "paid_cents == 0"
        side_effects:
          - "recompute Member.dues_balance_cents (the voided invoice leaves the balance input set)"
          - "recompute Member.boathouse_access_level"

  - entity: Shell
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "POST /boathouse/water-sessions/{id}/clear"
        actor: SafetyOfficer
        preconditions:
          - "Shell.status == AVAILABLE"
        side_effects:
          - "the clearing WaterSession moves PLANNED->CLEARED"
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "POST /boathouse/water-sessions/{id}/return or POST /boathouse/water-sessions/{id}/cancel"
        actor: SafetyOfficer
        preconditions:
          - "no other WaterSession with status IN {CLEARED, LAUNCHED} references this shell_id"
        side_effects:
          - "hull released for the next clearance; closes the AVAILABLE->ASSIGNED->AVAILABLE cycle"
      - from: AVAILABLE
        to: DAMAGED
        trigger: "POST /boathouse/damage-reports"
        actor: Member
        preconditions:
          - "severity IN {MAJOR, STRUCTURAL}"
        side_effects:
          - "recompute Shell.condition_index_conservative and Shell.condition_index_optimistic"
      - from: ASSIGNED
        to: DAMAGED
        trigger: "POST /boathouse/damage-reports"
        actor: Member
        preconditions:
          - "severity IN {MAJOR, STRUCTURAL}"
        side_effects:
          - "every WaterSession with status IN {PLANNED, CLEARED} referencing this shell_id transitions to CANCELLED"
          - "recompute Shell.condition_index_conservative and Shell.condition_index_optimistic"
      - from: DAMAGED
        to: IN_REPAIR
        trigger: "POST /boathouse/damage-reports/{id}/schedule-repair"
        actor: EquipmentManager
        preconditions:
          - "DamageReport.status == TRIAGED"
        side_effects:
          - "the DamageReport moves TRIAGED->REPAIR_SCHEDULED and reserves assigned_repair_bay for the closed window"
      - from: IN_REPAIR
        to: DAMAGED
        trigger: "POST /boathouse/damage-reports/{id}/triage"
        actor: EquipmentManager
        preconditions:
          - "DamageReport.status == REPAIR_SCHEDULED"
        side_effects:
          - "the DamageReport moves REPAIR_SCHEDULED->TRIAGED, releasing assigned_repair_bay, repair_window_start_at and repair_window_end_at back to null"
        note: "reschedule loop: DAMAGED->IN_REPAIR->DAMAGED"
      - from: IN_REPAIR
        to: AVAILABLE
        trigger: "POST /boathouse/damage-reports/{id}/verify-repair"
        actor: EquipmentManager
        preconditions:
          - "DamageReport.status == REPAIR_SCHEDULED"
          - "logical clock now >= DamageReport.repair_window_end_at"
        side_effects:
          - "the DamageReport moves REPAIR_SCHEDULED->VERIFIED"
          - "recompute Shell.condition_index_conservative (VERIFIED residual weight) and Shell.condition_index_optimistic (VERIFIED fully cleared)"
      - from: DAMAGED
        to: AVAILABLE
        trigger: "POST /boathouse/damage-reports/{id}/triage with disposition=CLOSE_NO_ACTION"
        actor: EquipmentManager
        preconditions:
          - "DamageReport.status == REPORTED"
        side_effects:
          - "the DamageReport moves REPORTED->CLOSED_NO_ACTION"
          - "recompute both Shell condition indices (a CLOSED_NO_ACTION report leaves both input sets)"
      - from: DAMAGED
        to: RETIRED
        trigger: "POST /boathouse/damage-reports/{id}/condemn"
        actor: EquipmentManager
        preconditions:
          - "DamageReport.severity == STRUCTURAL"
        side_effects:
          - "every RegattaEntry with shell_id == this shell whose status IN {DRAFT, LINEUP_DECLARED, SUBMITTED, CONFIRMED} transitions to SCRATCHED (hop 3 of the condemnation cascade)"
          - "every WaterSession with status IN {PLANNED, CLEARED} referencing this shell_id transitions to CANCELLED"
      - from: IN_REPAIR
        to: RETIRED
        trigger: "POST /boathouse/damage-reports/{id}/condemn"
        actor: EquipmentManager
        preconditions:
          - "DamageReport.severity == STRUCTURAL"
        side_effects:
          - "every RegattaEntry with shell_id == this shell whose status IN {DRAFT, LINEUP_DECLARED, SUBMITTED, CONFIRMED} transitions to SCRATCHED (hop 3 of the condemnation cascade)"
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /boathouse/shells/{id}/retire"
        actor: EquipmentManager
        preconditions:
          - "no WaterSession with status IN {PLANNED, CLEARED, LAUNCHED} references this shell_id"
          - "no RegattaEntry with status IN {DRAFT, LINEUP_DECLARED, SUBMITTED, CONFIRMED} references this shell_id"
        side_effects:
          - "hull permanently removed from the fleet"

  - entity: DamageReport
    initial_state: REPORTED
    terminal_states: [VERIFIED, CONDEMNED, CLOSED_NO_ACTION]
    transitions:
      - from: REPORTED
        to: TRIAGED
        trigger: "POST /boathouse/damage-reports/{id}/triage with disposition=REPAIR"
        actor: EquipmentManager
        preconditions:
          - "X-User-ID != DamageReport.reported_by_member_id"
        side_effects:
          - "triaged_by_user_id = X-User-ID"
      - from: REPORTED
        to: CLOSED_NO_ACTION
        trigger: "POST /boathouse/damage-reports/{id}/triage with disposition=CLOSE_NO_ACTION"
        actor: EquipmentManager
        preconditions:
          - "X-User-ID != DamageReport.reported_by_member_id"
        side_effects:
          - "triaged_by_user_id = X-User-ID"
          - "when Shell.status == DAMAGED and no other DamageReport on that shell has status IN {REPORTED, TRIAGED, REPAIR_SCHEDULED}, drive the Shell through DAMAGED->AVAILABLE"
          - "recompute both Shell condition indices"
      - from: TRIAGED
        to: REPAIR_SCHEDULED
        trigger: "POST /boathouse/damage-reports/{id}/schedule-repair"
        actor: EquipmentManager
        preconditions:
          - "assigned_repair_bay has no other DamageReport in status REPAIR_SCHEDULED whose closed window [repair_window_start_at, repair_window_end_at] intersects the requested closed window"
        side_effects:
          - "assigned_repair_bay, repair_window_start_at and repair_window_end_at persisted"
          - "drive the Shell through DAMAGED->IN_REPAIR"
      - from: REPAIR_SCHEDULED
        to: TRIAGED
        trigger: "POST /boathouse/damage-reports/{id}/triage with disposition=REPAIR"
        actor: EquipmentManager
        preconditions:
          - "logical clock now < repair_window_end_at"
        side_effects:
          - "assigned_repair_bay, repair_window_start_at, repair_window_end_at reset to null, freeing the bay window"
          - "drive the Shell through IN_REPAIR->DAMAGED"
        note: "TRIAGED->REPAIR_SCHEDULED->TRIAGED reschedule cycle"
      - from: REPAIR_SCHEDULED
        to: VERIFIED
        trigger: "POST /boathouse/damage-reports/{id}/verify-repair"
        actor: EquipmentManager
        preconditions:
          - "logical clock now >= repair_window_end_at"
          - "X-User-ID != DamageReport.reported_by_member_id"
        side_effects:
          - "verified_by_user_id = X-User-ID"
          - "drive the Shell through IN_REPAIR->AVAILABLE"
          - "recompute Shell.condition_index_conservative (this report now contributes severity_points * VERIFIED_RESIDUAL_FACTOR) and Shell.condition_index_optimistic (this report leaves the input set)"
      - from: TRIAGED
        to: CONDEMNED
        trigger: "POST /boathouse/damage-reports/{id}/condemn"
        actor: EquipmentManager
        preconditions:
          - "severity == STRUCTURAL"
        side_effects:
          - "drive the Shell through DAMAGED->RETIRED (hop 2 of the condemnation cascade)"
      - from: REPAIR_SCHEDULED
        to: CONDEMNED
        trigger: "POST /boathouse/damage-reports/{id}/condemn"
        actor: EquipmentManager
        preconditions:
          - "severity == STRUCTURAL"
        side_effects:
          - "assigned_repair_bay window released"
          - "drive the Shell through IN_REPAIR->RETIRED (hop 2 of the condemnation cascade)"

  - entity: WaterSession
    initial_state: PLANNED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: PLANNED
        to: CLEARED
        trigger: "POST /boathouse/water-sessions/{id}/clear"
        actor: SafetyOfficer
        preconditions:
          - "the WaterConditionReading named by reading_id has posture IN {OPEN, RESTRICTED}"
          - "Shell.status == AVAILABLE for shell_id"
          - "assigned_launch_count >= required_launch_count computed from that reading"
          - "X-User-ID != WaterSession.coach_member_id"
        side_effects:
          - "reading_id persisted; required_launch_count recomputed from the reading"
          - "drive the Shell through AVAILABLE->ASSIGNED"
      - from: CLEARED
        to: PLANNED
        trigger: "POST /boathouse/water-condition-readings whose computed posture == CLOSED"
        actor: SafetyOfficer
        preconditions:
          - "WaterSession.planned_start_at > the new reading's observed_at"
        side_effects:
          - "reading_id reset to null; required_launch_count reset to 0"
          - "drive the Shell through ASSIGNED->AVAILABLE"
        note: "re-clearance cycle PLANNED->CLEARED->PLANNED when the river closes"
      - from: CLEARED
        to: LAUNCHED
        trigger: "POST /boathouse/water-sessions/{id}/launch"
        actor: SafetyOfficer
        preconditions:
          - "logical clock now >= planned_start_at"
          - "logical clock now < planned_end_at"
        side_effects:
          - "crew recorded as on the water"
      - from: LAUNCHED
        to: RETURNED
        trigger: "POST /boathouse/water-sessions/{id}/return"
        actor: SafetyOfficer
        preconditions:
          - "WaterSession.status == LAUNCHED"
        side_effects:
          - "actual_return_at = logical clock now"
          - "drive the Shell through ASSIGNED->AVAILABLE"
          - "recompute Member.logged_session_count for every member id in athlete_member_ids"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /boathouse/water-sessions/{id}/cancel"
        actor: Coach
        preconditions:
          - "WaterSession.status == PLANNED"
        side_effects:
          - "outing removed from the launch schedule"
      - from: CLEARED
        to: CANCELLED
        trigger: "POST /boathouse/water-sessions/{id}/cancel"
        actor: Coach
        preconditions:
          - "WaterSession.status == CLEARED"
        side_effects:
          - "drive the Shell through ASSIGNED->AVAILABLE"

  - entity: Regatta
    initial_state: OPEN_FOR_ENTRY
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: OPEN_FOR_ENTRY
        to: ENTRIES_CLOSED
        trigger: "POST /boathouse/regattas/{id}/status-transitions with to_status=ENTRIES_CLOSED"
        actor: ClubAdmin
        preconditions:
          - "logical clock now >= entry_deadline_at"
        side_effects:
          - "no new RegattaEntry may be created or submitted"
      - from: ENTRIES_CLOSED
        to: OPEN_FOR_ENTRY
        trigger: "POST /boathouse/regattas/{id}/status-transitions with to_status=OPEN_FOR_ENTRY"
        actor: ClubAdmin
        preconditions:
          - "late_entry_allowed == true"
          - "logical clock now < race_date_at"
        side_effects:
          - "late submissions become possible again and pay the late fee"
        note: "OPEN_FOR_ENTRY->ENTRIES_CLOSED->OPEN_FOR_ENTRY late-entry cycle"
      - from: ENTRIES_CLOSED
        to: RACING
        trigger: "POST /boathouse/regattas/{id}/status-transitions with to_status=RACING"
        actor: ClubAdmin
        preconditions:
          - "logical clock now >= race_date_at"
          - "every TrailerLoad with regatta_id == this regatta has status IN {DEPARTED, ARRIVED} when venue_kind == AWAY"
        side_effects:
          - "heats may be lane-assigned and raced"
      - from: RACING
        to: COMPLETE
        trigger: "POST /boathouse/regattas/{id}/status-transitions with to_status=COMPLETE"
        actor: ClubAdmin
        preconditions:
          - "every Heat with regatta_id == this regatta has status == RESULTS_OFFICIAL"
          - "no Protest attached to those heats has status IN {FILED, UNDER_JURY_REVIEW, REMANDED}"
        side_effects:
          - "regatta books closed; net_fee_cents and deposit_held_cents frozen"
      - from: OPEN_FOR_ENTRY
        to: CANCELLED
        trigger: "POST /boathouse/regattas/{id}/status-transitions with to_status=CANCELLED"
        actor: ClubAdmin
        preconditions:
          - "Regatta.status == OPEN_FOR_ENTRY"
        side_effects:
          - "every RegattaEntry with status IN {DRAFT, LINEUP_DECLARED, SUBMITTED, CONFIRMED} transitions to SCRATCHED with refund_cents == total_fee_cents"
          - "recompute Regatta.net_fee_cents"
      - from: ENTRIES_CLOSED
        to: CANCELLED
        trigger: "POST /boathouse/regattas/{id}/status-transitions with to_status=CANCELLED"
        actor: ClubAdmin
        preconditions:
          - "Regatta.status == ENTRIES_CLOSED"
        side_effects:
          - "every RegattaEntry with status IN {DRAFT, LINEUP_DECLARED, SUBMITTED, CONFIRMED} transitions to SCRATCHED with refund_cents == total_fee_cents"
          - "recompute Regatta.net_fee_cents"
      - from: RACING
        to: CANCELLED
        trigger: "POST /boathouse/regattas/{id}/status-transitions with to_status=CANCELLED"
        actor: ClubAdmin
        preconditions:
          - "no Heat with regatta_id == this regatta has status == RESULTS_OFFICIAL"
        side_effects:
          - "every RegattaEntry with status IN {DRAFT, LINEUP_DECLARED, SUBMITTED, CONFIRMED} transitions to SCRATCHED with refund_cents == total_fee_cents"
          - "every RaceLane on those heats whose lane_status IN {PENDING, PROVISIONAL} transitions to VOIDED"

  - entity: RegattaEntry
    initial_state: DRAFT
    terminal_states: [RACED, SCRATCHED]
    transitions:
      - from: DRAFT
        to: LINEUP_DECLARED
        trigger: "POST /boathouse/regatta-entries/{id}/lineup"
        actor: Coach
        preconditions:
          - "expected_regatta_entry_version equals the entry's current version"
          - "the declared seats fill exactly the seat count implied by boat_class"
          - "every seated member has membership_status == ACTIVE"
        side_effects:
          - "LineupSeat rows created for every declared seat with eligibility_status computed"
          - "increments RegattaEntry.version by 1"
      - from: LINEUP_DECLARED
        to: LINEUP_DECLARED
        trigger: "POST /boathouse/regatta-entries/{id}/lineup"
        actor: Coach
        preconditions:
          - "expected_regatta_entry_version equals the entry's current version"
          - "the declared seats fill exactly the seat count implied by boat_class"
        side_effects:
          - "the previously declared LineupSeat rows are superseded and replaced wholesale by the new declaration"
          - "increments RegattaEntry.version by 1"
        note: "self-loop redeclaration; this is the write the OCC rule lineup-declare-stale-entry guards"
      - from: LINEUP_DECLARED
        to: SUBMITTED
        trigger: "POST /boathouse/regatta-entries/{id}/submit"
        actor: Coach
        preconditions:
          - "Regatta.status == OPEN_FOR_ENTRY"
          - "every LineupSeat on this entry has eligibility_status == ELIGIBLE"
        side_effects:
          - "submitted_at = logical clock now"
          - "base_fee_cents, transport_levy_cents, late_fee_cents and total_fee_cents set from calculations.regatta_entry_fee"
          - "every LineupSeat with seat_role == COXSWAIN moves weigh_in_status NOT_REQUIRED->PENDING"
          - "recompute Regatta.net_fee_cents"
      - from: SUBMITTED
        to: LINEUP_DECLARED
        trigger: "POST /boathouse/lineup-seats/{id}/weigh-in yielding weigh_in_status FAILED, or a seat's eligibility_status leaving ELIGIBLE"
        actor: system
        preconditions:
          - "at least one LineupSeat on this entry has weigh_in_status == FAILED or eligibility_status != ELIGIBLE"
        side_effects:
          - "every RaceLane with regatta_entry_id == this entry whose lane_status == PENDING transitions to VOIDED (hop 3 of the weigh-in cascade)"
          - "each voided lane decrements its Heat.occupied_lane_count and drives that Heat through LANES_ASSIGNED->SCHEDULED"
        note: "demotion cycle LINEUP_DECLARED->SUBMITTED->LINEUP_DECLARED"
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /boathouse/regatta-entries/{id}/confirm"
        actor: RaceOfficial
        preconditions:
          - "every LineupSeat with seat_role == COXSWAIN has weigh_in_status == PASSED"
          - "every LineupSeat on this entry has eligibility_status == ELIGIBLE"
          - "when Regatta.venue_kind == AWAY, rack_tier is not null and the owning TrailerLoad.status IN {SEALED, DEPARTED, ARRIVED}"
        side_effects:
          - "entry becomes eligible for lane assignment"
      - from: CONFIRMED
        to: RACED
        trigger: "POST /boathouse/heats/{id}/officialize"
        actor: RaceOfficial
        preconditions:
          - "a RaceLane with regatta_entry_id == this entry on the officialized heat has lane_status IN {OFFICIAL, DISQUALIFIED}"
        side_effects:
          - "entry closed for the regatta"
      - from: DRAFT
        to: SCRATCHED
        trigger: "POST /boathouse/regatta-entries/{id}/scratch"
        actor: Coach
        preconditions:
          - "RegattaEntry.status == DRAFT"
        side_effects:
          - "refund_cents = 0 (no fee was ever assessed)"
      - from: LINEUP_DECLARED
        to: SCRATCHED
        trigger: "POST /boathouse/regatta-entries/{id}/scratch"
        actor: Coach
        preconditions:
          - "RegattaEntry.status == LINEUP_DECLARED"
        side_effects:
          - "refund_cents = 0 (no fee was ever assessed)"
      - from: SUBMITTED
        to: SCRATCHED
        trigger: "POST /boathouse/regatta-entries/{id}/scratch"
        actor: Coach
        preconditions:
          - "RegattaEntry.status == SUBMITTED"
        side_effects:
          - "refund_cents = calculations.scratch_refund output"
          - "recompute Regatta.net_fee_cents"
          - "when rack_tier is not null, release the rack units and recompute TrailerLoad.rack_units_used and rack_units_free"
      - from: CONFIRMED
        to: SCRATCHED
        trigger: "POST /boathouse/regatta-entries/{id}/scratch"
        actor: Coach
        preconditions:
          - "RegattaEntry.status == CONFIRMED"
        side_effects:
          - "refund_cents = calculations.scratch_refund output"
          - "recompute Regatta.net_fee_cents"
          - "every RaceLane with regatta_entry_id == this entry whose lane_status == PENDING transitions to VOIDED (hop 4 of the condemnation cascade)"
          - "each voided lane decrements its Heat.occupied_lane_count and drives that Heat through LANES_ASSIGNED->SCHEDULED (hop 5)"
          - "when rack_tier is not null, release the rack units and recompute TrailerLoad.rack_units_used and rack_units_free"

  - entity: Heat
    initial_state: SCHEDULED
    terminal_states: [RESULTS_OFFICIAL]
    transitions:
      - from: SCHEDULED
        to: LANES_ASSIGNED
        trigger: "POST /boathouse/heats/{id}/assign-lanes"
        actor: RaceOfficial
        preconditions:
          - "Regatta.status == RACING"
          - "the candidate set of RegattaEntry rows with status == CONFIRMED, matching regatta_id and event_code, is non-empty"
        side_effects:
          - "RaceLane rows created per calculations.lane_assignment_order"
          - "occupied_lane_count and free_lane_count recomputed"
      - from: LANES_ASSIGNED
        to: SCHEDULED
        trigger: "a RaceLane on this heat transitions PENDING->VOIDED because its entry left CONFIRMED"
        actor: system
        preconditions:
          - "at least one RaceLane on this heat transitioned to VOIDED while the heat was LANES_ASSIGNED"
        side_effects:
          - "every remaining RaceLane on this heat whose lane_status == PENDING transitions to VOIDED"
          - "occupied_lane_count recomputed to 0; the heat must be re-seeded"
        note: "re-seed cycle SCHEDULED->LANES_ASSIGNED->SCHEDULED"
      - from: LANES_ASSIGNED
        to: RESULTS_PROVISIONAL
        trigger: "POST /boathouse/heats/{id}/results"
        actor: RaceOfficial
        preconditions:
          - "every RaceLane on this heat whose lane_status == PENDING has an elapsed_seconds value in the request"
        side_effects:
          - "each PENDING RaceLane moves to PROVISIONAL with elapsed_seconds and place set"
          - "protest_window_closes_at = logical clock now + PROTEST_WINDOW_MINUTES"
      - from: RESULTS_PROVISIONAL
        to: LANES_ASSIGNED
        trigger: "POST /boathouse/protests/{id}/rule with decision=UPHELD and remedy=RE_ROW"
        actor: JuryChair
        preconditions:
          - "the protest's heat_id == this heat"
        side_effects:
          - "every RaceLane on this heat whose lane_status == PROVISIONAL transitions back to PENDING with elapsed_seconds and place reset to null"
          - "protest_window_closes_at reset to null"
        note: "protest cycle LANES_ASSIGNED->RESULTS_PROVISIONAL->LANES_ASSIGNED"
      - from: RESULTS_PROVISIONAL
        to: RESULTS_OFFICIAL
        trigger: "POST /boathouse/heats/{id}/officialize"
        actor: RaceOfficial
        preconditions:
          - "logical clock now >= protest_window_closes_at"
          - "no Protest with heat_id == this heat has status IN {FILED, UNDER_JURY_REVIEW, REMANDED}"
        side_effects:
          - "every RaceLane whose lane_status == PROVISIONAL transitions to OFFICIAL"
          - "calculations.heat_advancement_selection runs and sets advanced on qualifying lanes"
          - "every RegattaEntry holding an OFFICIAL or DISQUALIFIED lane on this heat moves CONFIRMED->RACED"

  - entity: RaceLane
    initial_state: PENDING
    terminal_states: [OFFICIAL, VOIDED]
    transitions:
      - from: PENDING
        to: PROVISIONAL
        trigger: "POST /boathouse/heats/{id}/results"
        actor: RaceOfficial
        preconditions:
          - "an elapsed_seconds value is supplied for this lane"
        side_effects:
          - "place recomputed across the heat"
      - from: PROVISIONAL
        to: PENDING
        trigger: "POST /boathouse/protests/{id}/rule with decision=UPHELD and remedy=RE_ROW"
        actor: JuryChair
        preconditions:
          - "the protest's heat_id equals this lane's heat_id"
        side_effects:
          - "elapsed_seconds and place reset to null"
        note: "re-row cycle PENDING->PROVISIONAL->PENDING"
      - from: PROVISIONAL
        to: OFFICIAL
        trigger: "POST /boathouse/heats/{id}/officialize"
        actor: RaceOfficial
        preconditions:
          - "Heat moves RESULTS_PROVISIONAL->RESULTS_OFFICIAL"
        side_effects:
          - "advanced set by calculations.heat_advancement_selection"
      - from: PROVISIONAL
        to: DISQUALIFIED
        trigger: "POST /boathouse/protests/{id}/rule with decision=UPHELD and remedy=DISQUALIFY"
        actor: JuryChair
        preconditions:
          - "this lane is the protest's against_race_lane_id"
        side_effects:
          - "place reset to null and place recomputed for the remaining PROVISIONAL lanes on the heat"
      - from: DISQUALIFIED
        to: PROVISIONAL
        trigger: "POST /boathouse/protests/{id}/rule with decision=DENIED on a later protest citing the same lane"
        actor: JuryChair
        preconditions:
          - "no other Protest with status IN {UPHELD} cites this lane"
        side_effects:
          - "place recomputed across the heat"
      - from: PENDING
        to: VOIDED
        trigger: "the occupying RegattaEntry leaves CONFIRMED or SUBMITTED"
        actor: system
        preconditions:
          - "RegattaEntry.status IN {LINEUP_DECLARED, SCRATCHED}"
        side_effects:
          - "Heat.occupied_lane_count decremented and free_lane_count recomputed"
          - "drive the Heat through LANES_ASSIGNED->SCHEDULED"
      - from: PROVISIONAL
        to: VOIDED
        trigger: "POST /boathouse/regattas/{id}/status-transitions with to_status=CANCELLED"
        actor: ClubAdmin
        preconditions:
          - "no Heat on the regatta has status == RESULTS_OFFICIAL"
        side_effects:
          - "Heat.occupied_lane_count decremented"

  - entity: Protest
    initial_state: FILED
    terminal_states: [UPHELD, DENIED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_JURY_REVIEW
        trigger: "POST /boathouse/protests/{id}/open-review"
        actor: JuryChair
        preconditions:
          - "X-User-ID != Protest.filed_by_member_id"
          - "no LineupSeat with member_id == X-User-ID belongs to a RegattaEntry holding a RaceLane on this protest's heat_id"
        side_effects:
          - "review_round incremented by 1"
          - "jury_user_id = X-User-ID"
      - from: REMANDED
        to: UNDER_JURY_REVIEW
        trigger: "POST /boathouse/protests/{id}/open-review"
        actor: JuryChair
        preconditions:
          - "review_round < MAX_JURY_ROUNDS"
          - "X-User-ID != Protest.filed_by_member_id"
        side_effects:
          - "review_round incremented by 1"
          - "jury_user_id = X-User-ID"
        note: "negotiation cycle UNDER_JURY_REVIEW->REMANDED->UNDER_JURY_REVIEW"
      - from: UNDER_JURY_REVIEW
        to: REMANDED
        trigger: "POST /boathouse/protests/{id}/rule with decision=REMAND"
        actor: JuryChair
        preconditions:
          - "review_round < MAX_JURY_ROUNDS"
        side_effects:
          - "deposit stays held; Regatta.deposit_held_cents unchanged"
      - from: UNDER_JURY_REVIEW
        to: UPHELD
        trigger: "POST /boathouse/protests/{id}/rule with decision=UPHELD"
        actor: JuryChair
        preconditions:
          - "Heat.status == RESULTS_PROVISIONAL"
        side_effects:
          - "deposit_refunded = true; recompute Regatta.deposit_held_cents"
          - "when remedy == DISQUALIFY, drive against_race_lane_id through PROVISIONAL->DISQUALIFIED"
          - "when remedy == RE_ROW, drive the Heat through RESULTS_PROVISIONAL->LANES_ASSIGNED"
      - from: UNDER_JURY_REVIEW
        to: DENIED
        trigger: "POST /boathouse/protests/{id}/rule with decision=DENIED"
        actor: JuryChair
        preconditions:
          - "Heat.status == RESULTS_PROVISIONAL"
        side_effects:
          - "deposit_refunded stays false; the deposit is forfeited and stays in Regatta.deposit_held_cents"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /boathouse/protests/{id}/withdraw"
        actor: Member
        preconditions:
          - "X-User-ID == Protest.filed_by_member_id"
        side_effects:
          - "deposit_refunded = true; recompute Regatta.deposit_held_cents"

  - entity: TrailerLoad
    initial_state: OPEN
    terminal_states: [RETURNED]
    transitions:
      - from: OPEN
        to: SEALED
        trigger: "POST /boathouse/trailer-loads/{id}/transitions with to_status=SEALED"
        actor: EquipmentManager
        preconditions:
          - "Regatta.status IN {OPEN_FOR_ENTRY, ENTRIES_CLOSED} — a load may be built and sealed before entries close, but never once the regatta is RACING"
          - "rack_units_used > 0"
        side_effects:
          - "rack assignments and releases are refused while SEALED"
      - from: SEALED
        to: OPEN
        trigger: "POST /boathouse/trailer-loads/{id}/transitions with to_status=OPEN"
        actor: EquipmentManager
        preconditions:
          - "logical clock now < depart_at"
        side_effects:
          - "rack assignments and releases are accepted again"
        note: "unseal cycle OPEN->SEALED->OPEN"
      - from: SEALED
        to: DEPARTED
        trigger: "POST /boathouse/trailer-loads/{id}/transitions with to_status=DEPARTED"
        actor: EquipmentManager
        preconditions:
          - "logical clock now >= depart_at"
          - "Member.membership_status == ACTIVE for driver_member_id"
        side_effects:
          - "hulls in transit; scratch refunds no longer return transport_levy_cents"
      - from: DEPARTED
        to: ARRIVED
        trigger: "POST /boathouse/trailer-loads/{id}/transitions with to_status=ARRIVED"
        actor: EquipmentManager
        preconditions:
          - "TrailerLoad.status == DEPARTED"
        side_effects:
          - "hulls available for rigging at the away venue"
      - from: ARRIVED
        to: RETURNED
        trigger: "POST /boathouse/trailer-loads/{id}/transitions with to_status=RETURNED"
        actor: EquipmentManager
        preconditions:
          - "logical clock now >= return_at"
          - "every RegattaEntry with trailer_load_id == this load has status IN {RACED, SCRATCHED}"
        side_effects:
          - "all rack units released; rack_units_used recomputed to 0 and rack_units_free to rack_unit_capacity"

concurrency_rules:
  - rule_id: lineup-declare-stale-entry
    parent_entity: RegattaEntry
    write_endpoint: "POST /boathouse/regatta-entries/{id}/lineup"
    occ_field: "expected_regatta_entry_version"
    description: |
      Declaring a lineup against a RegattaEntry whose version has advanced since the
      client last read it is rejected. A lineup declaration legitimately supersedes the
      previously declared seats wholesale (see the LINEUP_DECLARED->LINEUP_DECLARED
      self-loop), so a writer holding a stale view of the entry would otherwise silently
      replace a declaration it never saw. OCC on RegattaEntry.version turns that into a
      deterministic stale-version rejection.
    error_id: ERR_STALE_ENTRY_VERSION
    http_status: 412
  - rule_id: rack-assign-stale-load
    parent_entity: TrailerLoad
    write_endpoint: "POST /boathouse/trailer-loads/{id}/rack-assignments"
    occ_field: "expected_trailer_load_version"
    description: |
      Claiming rack units on an OPEN TrailerLoad while holding a stale view of that load
      is rejected. Rack assignment is legitimately repeatable for different entries, so a
      writer whose capacity view predates another assignment would otherwise commit an
      allocation computed against free units that no longer exist. OCC on
      TrailerLoad.version pins the client's observed capacity snapshot.
    error_id: ERR_STALE_TRAILER_VERSION
    http_status: 412

calculations:
  - name: dues_assessment
    trigger: "on POST /boathouse/dues-invoices (variant provisional_seasonal) and on POST /boathouse/dues-invoices/{id}/true-up (variant trueup_actual); writes DuesInvoice.assessed_cents, DuesInvoice.variant_basis, DuesInvoice.trueup_cents and recomputes Member.dues_balance_cents"
    algorithm: tiered_pricing
    formula: |
      # ---- variant provisional_seasonal (DuesInvoice.variant_basis == PROVISIONAL) ----
      month_ratio            = billable_months / 12                       # exact rational, no intermediate rounding
      season_component_cents = round_half_up(TIER_SEASON_FEE_CENTS[member.tier] * month_ratio)
      access_component_cents = round_half_up(TIER_ACCESS_SURCHARGE_CENTS[member.tier] * month_ratio)
      locker_component_cents = locker_requested ? round_half_up(LOCKER_FEE_CENTS * month_ratio) : 0
      # ROUNDING ORDER IS PINNED: round EACH component to whole cents, THEN sum.
      # The rejected alternative ("sum the three unrounded components, then round once")
      # differs by one cent whenever the fractional parts carry: e.g. RECREATIONAL,
      # billable_months=4, locker_requested=true yields 27584 pinned vs 27583 sum-then-round.
      assessed_cents         = season_component_cents + access_component_cents + locker_component_cents

      # ---- variant trueup_actual (DuesInvoice.variant_basis == TRUEUP) ----
      per_session_component_cents = PER_SESSION_RATE_CENTS * member.logged_session_count
      floor_component_cents       = round_half_up(TIER_SEASON_FEE_CENTS[member.tier] * TRUEUP_FLOOR_PCT)
      usage_basis_cents           = max(per_session_component_cents, floor_component_cents)
      trueup_assessed_cents       = usage_basis_cents + ADMIN_FEE_CENTS
      trueup_cents                = trueup_assessed_cents - assessed_cents_before_trueup   # signed; negative == credit
      assessed_cents              = trueup_assessed_cents
    input_set: "the single DuesInvoice named in the path, joined to its Member for tier and logged_session_count; logged_session_count counts only WaterSession rows with status == RETURNED whose athlete_member_ids contains the member id"
    constants:
      TIER_SEASON_FEE_CENTS: { COMPETITIVE: 95000, RECREATIONAL: 61500, LEARN_TO_ROW: 35500 }
      TIER_ACCESS_SURCHARGE_CENTS: { COMPETITIVE: 23500, RECREATIONAL: 12500, LEARN_TO_ROW: 0 }
      LOCKER_FEE_CENTS: 8750
      SEASON_MONTHS: 12
      PER_SESSION_RATE_CENTS: 4500
      TRUEUP_FLOOR_PCT: 0.40
      ADMIN_FEE_CENTS: 5000
    precision: "whole cents, round_half_up, applied per component before summation (never to the summed total)"
    variants:
      - name: provisional_seasonal
        when: "invoice creation, before the season's sessions are known; DuesInvoice.variant_basis == PROVISIONAL"
        difference: "prorates the tier season fee, the boathouse access surcharge and the optional locker fee by billable_months / 12; ignores logged_session_count entirely"
      - name: trueup_actual
        when: "end-of-season true-up on POST /boathouse/dues-invoices/{id}/true-up; DuesInvoice.variant_basis becomes TRUEUP"
        difference: "discards the prorated components and rebills on actual usage — max(PER_SESSION_RATE_CENTS * logged_session_count, 40% of the tier season fee) plus a flat ADMIN_FEE_CENTS — so identical member data yields a different assessed_cents than provisional_seasonal (e.g. RECREATIONAL, 4 billable months, locker, 7 returned sessions: 27584 provisional vs 36500 true-up, trueup_cents 8916)"

  - name: shell_condition_index
    trigger: "on POST /boathouse/damage-reports, POST /boathouse/damage-reports/{id}/triage, POST /boathouse/damage-reports/{id}/verify-repair and POST /boathouse/damage-reports/{id}/condemn; writes Shell.condition_index_conservative, Shell.condition_index_optimistic and DamageReport.severity_points"
    algorithm: decay_function
    formula: |
      for each DamageReport r on the shell:
        age_days        = floor((clock_now - r.reported_at) / 86400 seconds)
        elapsed_periods = floor(age_days / DECAY_PERIOD_DAYS)
        decayed_points  = max(SEVERITY_POINTS[r.severity] - DECAY_POINTS_PER_PERIOD * elapsed_periods, 0)
        r.severity_points = decayed_points

      # variant conservative: input set = reports with status IN {REPORTED, TRIAGED, REPAIR_SCHEDULED, VERIFIED}
      contribution_conservative(r) = (r.status == VERIFIED)
                                     ? decayed_points * VERIFIED_RESIDUAL_FACTOR
                                     : decayed_points
      # variant optimistic:  input set = reports with status IN {REPORTED, TRIAGED, REPAIR_SCHEDULED}
      contribution_optimistic(r)   = decayed_points

      # ROUNDING ORDER IS PINNED HERE THE OTHER WAY ROUND FROM dues_assessment:
      # sum the unrounded contributions first, round the SUM once, then subtract.
      condition_index_conservative = max(100 - round_half_up(sum of contribution_conservative over the conservative input set), 0)
      condition_index_optimistic   = max(100 - round_half_up(sum of contribution_optimistic  over the optimistic  input set), 0)
    input_set: "conservative includes DamageReport rows with status IN {REPORTED, TRIAGED, REPAIR_SCHEDULED, VERIFIED}; optimistic includes only status IN {REPORTED, TRIAGED, REPAIR_SCHEDULED}; both exclude CONDEMNED and CLOSED_NO_ACTION"
    constants:
      SEVERITY_POINTS: { COSMETIC: 2, MINOR: 6, MAJOR: 18, STRUCTURAL: 40 }
      DECAY_PERIOD_DAYS: 30
      DECAY_POINTS_PER_PERIOD: 0.5
      VERIFIED_RESIDUAL_FACTOR: 0.25
      INDEX_CEILING: 100
    precision: "contributions carried at full precision; the SUM is rounded once, half up, to a whole index point; index floored at 0 and capped at 100"
    variants:
      - name: conservative
        when: "any read of Shell.condition_index_conservative; the figure the club uses to gate COMPETITIVE_ONLY hull assignment"
        difference: "keeps VERIFIED repairs in the deduction set at VERIFIED_RESIDUAL_FACTOR (0.25) weight, so a repaired hull never fully recovers"
      - name: optimistic
        when: "any read of Shell.condition_index_optimistic; the figure the club publishes in the fleet roster"
        difference: "drops VERIFIED repairs from the deduction set entirely, so identical report history yields a higher index (e.g. an 89-day-old VERIFIED MAJOR plus a 30-day-old REPAIR_SCHEDULED MINOR gives 90 conservative vs 94 optimistic)"

  - name: water_posture_evaluation
    trigger: "on POST /boathouse/water-condition-readings; writes WaterConditionReading.cold_water_flag and WaterConditionReading.posture"
    algorithm: threshold
    formula: |
      cold_water_flag = (water_temp_c <  COLD_WATER_TEMP_C)
                        OR ((water_temp_c + air_temp_c) <= COMBINED_TEMP_SUM_C)
      # the two comparisons deliberately differ: strict `<` on the single-water reading,
      # inclusive `<=` on the combined air+water sum.
      if   (wind_speed_kt >= WIND_CLOSE_KT)    OR (visibility_m <= VIS_CLOSE_M):    posture = CLOSED
      elif (wind_speed_kt >= WIND_RESTRICT_KT) OR (visibility_m <= VIS_RESTRICT_M)
           OR cold_water_flag
           OR (traffic_pattern == NARROW_CHANNEL):                                  posture = RESTRICTED
      else:                                                                         posture = OPEN
    input_set: "only the fields of the reading being created; no other entity participates"
    constants:
      COLD_WATER_TEMP_C: 12.8
      COMBINED_TEMP_SUM_C: 30.0
      WIND_RESTRICT_KT: 12.0
      WIND_CLOSE_KT: 20.0
      VIS_RESTRICT_M: 800
      VIS_CLOSE_M: 400
    precision: "temperatures and wind carried at 1 decimal place; comparisons exact, no tolerance"

  - name: session_launch_requirement
    trigger: "on POST /boathouse/water-sessions/{id}/clear; writes WaterSession.required_launch_count and WaterSession.assigned_launch_count"
    algorithm: threshold
    formula: |
      base = 0
      if session_kind == LEARN_TO_ROW:      base = base + 1
      if reading.cold_water_flag == true:   base = base + 1
      if reading.posture == RESTRICTED:     base = base + 1
      required_launch_count = min(base, MAX_LAUNCHES_PER_SESSION)
      assigned_launch_count = (primary_launch_driver_member_id != null ? 1 : 0)
                            + (secondary_launch_driver_member_id != null ? 1 : 0)
      # clearance is refused when assigned_launch_count < required_launch_count
    input_set: "the WaterSession being cleared plus the WaterConditionReading named in the clear request"
    constants:
      MAX_LAUNCHES_PER_SESSION: 2
    precision: "integer counts"

  - name: regatta_entry_fee
    trigger: "on POST /boathouse/regatta-entries/{id}/submit; writes RegattaEntry.base_fee_cents, transport_levy_cents, late_fee_cents, total_fee_cents and recomputes Regatta.net_fee_cents"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED. The late-fee percentage is keyed on the PRE-LATE-FEE
      # subtotal (step 3), never on total_fee_cents, which would make the definition
      # circular (total depends on late_fee, late_fee depends on the tier of the total).
      step 1: base_fee_cents       = CLASS_ENTRY_FEE_CENTS[boat_class]
      step 2: transport_levy_cents = (regatta.venue_kind == AWAY)
                                     ? AWAY_TRANSPORT_LEVY_CENTS_PER_RACK_UNIT * CLASS_SLOT_UNITS[boat_class]
                                     : 0
      step 3: levy_subtotal_cents  = base_fee_cents + transport_levy_cents
      step 4: late_fee_pct         = (levy_subtotal_cents >= LATE_TIER_THRESHOLD_CENTS)
                                     ? LATE_FEE_PCT_HIGH : LATE_FEE_PCT_LOW
      step 5: late_fee_cents       = (submitted_at > regatta.entry_deadline_at)
                                     ? round_half_up(levy_subtotal_cents * late_fee_pct) : 0
      step 6: total_fee_cents      = levy_subtotal_cents + late_fee_cents
      # Worked divergence: 4+ AWAY submitted late -> subtotal 23500 < 25000 so pct 0.10,
      # late_fee 2350, total 25850. The circular reading (key the pct on the total) reaches
      # the self-consistent fixed point pct 0.15 -> late_fee 3525 -> total 27025.
    input_set: "the single RegattaEntry being submitted joined to its Regatta for venue_kind and entry_deadline_at, and to its Shell for boat_class"
    constants:
      CLASS_ENTRY_FEE_CENTS: { 1X: 4500, 2X: 7500, "4+": 13500, "8+": 25000 }
      CLASS_SLOT_UNITS: { 1X: 1, 2X: 1, "4+": 2, "8+": 3 }
      AWAY_TRANSPORT_LEVY_CENTS_PER_RACK_UNIT: 5000
      LATE_TIER_THRESHOLD_CENTS: 25000
      LATE_FEE_PCT_LOW: 0.10
      LATE_FEE_PCT_HIGH: 0.15
    precision: "whole cents, round_half_up, applied once to the late-fee product at step 5"

  - name: scratch_refund
    trigger: "on POST /boathouse/regatta-entries/{id}/scratch from status SUBMITTED or CONFIRMED; writes RegattaEntry.refund_cents and recomputes Regatta.net_fee_cents"
    algorithm: chronological
    formula: |
      now = logical clock at the scratch call
      if   now <= regatta.entry_deadline_at:   pct = REFUND_PCT_FULL
      elif now <= regatta.scratch_deadline_at: pct = REFUND_PCT_PARTIAL
      else:                                    pct = REFUND_PCT_NONE
      levy_refundable = (trailer_load_id == null) OR (TrailerLoad.status == OPEN)
      # per-component rounding, matching dues_assessment
      refund_cents = round_half_up(base_fee_cents * pct)
                   + round_half_up(late_fee_cents * pct)
                   + (levy_refundable ? round_half_up(transport_levy_cents * pct) : 0)
    input_set: "the single RegattaEntry being scratched, its Regatta for the two deadlines, and its TrailerLoad (when trailer_load_id is not null) for seal state"
    constants:
      REFUND_PCT_FULL: 1.00
      REFUND_PCT_PARTIAL: 0.55
      REFUND_PCT_NONE: 0.00
    precision: "whole cents, round_half_up, applied per component before summation"

  - name: coxswain_deadweight_check
    trigger: "on POST /boathouse/lineup-seats/{id}/weigh-in; writes LineupSeat.weighed_kg, LineupSeat.deadweight_kg and LineupSeat.weigh_in_status"
    algorithm: aggregation
    formula: |
      deadweight_kg = (seat_role == COXSWAIN)
                      ? round_half_up(max(MIN_COXSWAIN_WEIGHT_KG - weighed_kg, 0), 1 decimal)
                      : 0
      entry_deadweight_kg = sum of deadweight_kg over LineupSeat rows of the same
                            regatta_entry_id whose weigh_in_status IN {PASSED, FAILED}
                            plus the deadweight_kg being recorded now
      weigh_in_status = (entry_deadweight_kg > MAX_ENTRY_DEADWEIGHT_KG) ? FAILED : PASSED
      # boundary: weighed_kg 40.0 -> deadweight 15.0 -> 15.0 > 15.0 is false -> PASSED
      #           weighed_kg 39.9 -> deadweight 15.1 -> 15.1 > 15.0 is true  -> FAILED
    input_set: "LineupSeat rows sharing the regatta_entry_id whose weigh_in_status IN {PASSED, FAILED}, plus the seat being weighed"
    constants:
      MIN_COXSWAIN_WEIGHT_KG: 55.0
      MAX_ENTRY_DEADWEIGHT_KG: 15.0
    precision: "kilograms at 1 decimal place, round_half_up; the comparison against MAX_ENTRY_DEADWEIGHT_KG is strictly greater-than"

  - name: lane_assignment_order
    trigger: "on POST /boathouse/heats/{id}/assign-lanes; creates RaceLane rows and writes RaceLane.lane_number, Heat.occupied_lane_count and Heat.free_lane_count"
    algorithm: waterfall_allocation
    formula: |
      candidates = RegattaEntry rows where regatta_id == heat.regatta_id
                   AND event_code == heat.event_code
                   AND status == CONFIRMED
      # eligibility filter above; ranking below; tie-break below; empty-pool fallback below
      seeded     = candidates sorted by seed_time_seconds ASC, tie-break created_at ASC
      if seeded is empty: reject with ERR_NO_ELIGIBLE_ENTRIES
      lanes      = LANE_PREFERENCE_ORDER filtered to values <= heat.lane_count, in list order
      if count(seeded) > count(lanes): reject with ERR_LANE_CAPACITY_EXCEEDED
      for i, entry in enumerate(seeded):
        create RaceLane(heat_id=heat.id, regatta_entry_id=entry.id, lane_number=lanes[i], lane_status=PENDING)
      occupied_lane_count = count of RaceLane on the heat whose lane_status != VOIDED
      free_lane_count     = heat.lane_count - occupied_lane_count
    input_set: "RegattaEntry rows with status == CONFIRMED matching the heat's regatta_id and event_code; entries in any other status are excluded"
    constants:
      LANE_PREFERENCE_ORDER: [3, 4, 2, 5, 1, 6, 7, 8]
    precision: "integer lane numbers; seed_time_seconds compared at 1 decimal place"

  - name: heat_advancement_selection
    trigger: "on POST /boathouse/heats/{id}/officialize; writes RaceLane.advanced and creates RaceLane rows on the heat named by advances_to_heat_id"
    algorithm: topological
    formula: |
      target = heat.advances_to_heat_id            # null -> nothing advances
      sources = Heat rows with advances_to_heat_id == target AND status == RESULTS_OFFICIAL
      # step 1 - automatic qualifiers, per source heat
      for src in sources sorted by scheduled_start_at ASC, tie-break created_at ASC:
        official = RaceLane rows on src with lane_status == OFFICIAL
                   sorted by elapsed_seconds ASC, tie-break created_at ASC
        auto[src] = first src.advance_count entries of official
      # step 2 - fastest-loser fill of the remaining lanes
      remaining = target.lane_count - count(all auto entries)
      losers    = (all OFFICIAL lanes across sources not in any auto[src])
                  sorted by elapsed_seconds ASC, tie-break created_at ASC
      fill      = first `remaining` entries of losers        # empty when remaining <= 0
      advanced_lanes = auto entries + fill
      set advanced = true on every lane in advanced_lanes
      # step 3 - seed the target heat with the advanced crews
      target_seeded = advanced_lanes sorted by elapsed_seconds ASC, tie-break created_at ASC
      assign target lanes from LANE_PREFERENCE_ORDER in the same manner as lane_assignment_order
    input_set: "RaceLane rows with lane_status == OFFICIAL on every source heat that feeds the same advances_to_heat_id; DISQUALIFIED and VOIDED lanes are excluded from both the automatic and fastest-loser pools"
    constants:
      LANE_PREFERENCE_ORDER: [3, 4, 2, 5, 1, 6, 7, 8]
    precision: "elapsed_seconds compared at 1 decimal place; counts are integers"

  - name: trailer_rack_allocation
    trigger: "on POST /boathouse/trailer-loads/{id}/rack-assignments; writes RegattaEntry.rack_tier, RegattaEntry.rack_position, RegattaEntry.trailer_load_id, TrailerLoad.rack_units_used and TrailerLoad.rack_units_free"
    algorithm: waterfall_allocation
    formula: |
      units      = CLASS_SLOT_UNITS[entry.boat_class]
      max_tier   = CLASS_MAX_TIER[entry.boat_class]           # heavier hulls must ride low
      capacity   = rack_tier_count * rack_units_per_tier
      # waterfall: lowest permitted tier first, lowest starting position within that tier
      for tier in 1 .. min(max_tier, rack_tier_count):
        for start in 1 .. (rack_units_per_tier - units + 1):
          if positions start .. start+units-1 on `tier` are all free:
            rack_tier = tier; rack_position = start; commit and stop
      if nothing committed: reject with ERR_TRAILER_TIER_UNAVAILABLE
      rack_units_used = sum of CLASS_SLOT_UNITS[e.boat_class] over RegattaEntry rows e
                        with trailer_load_id == load.id AND e.status IN {SUBMITTED, CONFIRMED, RACED}
      rack_units_free = capacity - rack_units_used
      # INVARIANT: rack_units_used + rack_units_free == rack_unit_capacity, before and
      # after every assignment/release pair.
    input_set: "RegattaEntry rows already racked on this TrailerLoad with status IN {SUBMITTED, CONFIRMED, RACED}; SCRATCHED entries release their units and leave the set"
    constants:
      CLASS_SLOT_UNITS: { 1X: 1, 2X: 1, "4+": 2, "8+": 3 }
      CLASS_MAX_TIER: { 1X: 4, 2X: 4, "4+": 2, "8+": 1 }
    precision: "integer rack units; contiguity required within a single tier"

  - name: protest_deposit_ledger
    trigger: "on POST /boathouse/protests, POST /boathouse/protests/{id}/rule and POST /boathouse/protests/{id}/withdraw; writes Protest.deposit_cents, Protest.deposit_refunded and Regatta.deposit_held_cents"
    algorithm: aggregation
    formula: |
      on filing:          deposit_cents = PROTEST_DEPOSIT_CENTS; deposit_refunded = false
      on UPHELD:          deposit_refunded = true
      on WITHDRAWN:       deposit_refunded = true
      on DENIED:          deposit_refunded stays false (deposit forfeited to the host)
      protest_window_closes_at = results_posted_at + PROTEST_WINDOW_MINUTES minutes
      Regatta.deposit_held_cents = sum of deposit_cents over Protest rows p where
        p.heat_id IN (Heat rows with regatta_id == regatta.id)
        AND p.deposit_refunded == false
        AND p.status != WITHDRAWN
      # INVARIANT: filing a protest then having it upheld (or withdrawn) leaves
      # Regatta.deposit_held_cents exactly at its pre-filing value.
    input_set: "Protest rows attached to heats of the regatta with deposit_refunded == false and status != WITHDRAWN"
    constants:
      PROTEST_DEPOSIT_CENTS: 5000
      MAX_JURY_ROUNDS: 2
      PROTEST_WINDOW_MINUTES: 30
    precision: "whole cents; no rounding required"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the roles declared in the RBAC matrix"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role is listed in the called endpoint's roles, and for entity_backed roles X-User-ID resolves to an existing Member"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every id in the request path exists, validated left to right, returning the entity-specific NOT_FOUND error (ERR_MEMBER_NOT_FOUND, ERR_DUES_INVOICE_NOT_FOUND, ERR_SHELL_NOT_FOUND, ERR_DAMAGE_REPORT_NOT_FOUND, ERR_READING_NOT_FOUND, ERR_SESSION_NOT_FOUND, ERR_REGATTA_NOT_FOUND, ERR_ENTRY_NOT_FOUND, ERR_SEAT_NOT_FOUND, ERR_HEAT_NOT_FOUND, ERR_LANE_NOT_FOUND, ERR_PROTEST_NOT_FOUND, ERR_TRAILER_NOT_FOUND)"
    error_id: ERR_ENTRY_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 4
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row, returning that entity's NOT_FOUND error"
    error_id: ERR_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints carrying foreign keys"
  - priority: 5
    category: business_constraint
    check: "all required input fields are present, enum values are members of the declared constraint set, integers fall inside their declared ranges, and datetimes parse as ISO 8601 UTC"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST, PATCH and PUT endpoints"
  - priority: 6
    category: state
    check: "expected_regatta_entry_version equals RegattaEntry.version"
    error_id: ERR_STALE_ENTRY_VERSION
    http_status: 412
    applies_to: "POST /boathouse/regatta-entries/{id}/lineup"
  - priority: 7
    category: state
    check: "expected_trailer_load_version equals TrailerLoad.version"
    error_id: ERR_STALE_TRAILER_VERSION
    http_status: 412
    applies_to: "POST /boathouse/trailer-loads/{id}/rack-assignments, POST /boathouse/trailer-loads/{id}/rack-releases"
  - priority: 8
    category: state
    check: "the target resource is not already in one of its state machine's terminal_states"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all state-changing POST endpoints EXCEPT POST /boathouse/dues-invoices/{id}/payments and POST /boathouse/dues-invoices/{id}/true-up, where the money-domain rule at priority 55 reports the more specific ERR_INVOICE_NOT_PAYABLE instead (POST /boathouse/dues-invoices/{id}/void stays under this rule)"
  - priority: 9
    category: state
    check: "Shell.status == AVAILABLE for the session's shell_id"
    error_id: ERR_SHELL_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /boathouse/water-sessions/{id}/clear"
  - priority: 10
    category: state
    check: "WaterSession.status == CLEARED"
    error_id: ERR_SESSION_NOT_CLEARED
    http_status: 409
    applies_to: "POST /boathouse/water-sessions/{id}/launch"
  - priority: 11
    category: state
    check: "WaterSession.status == LAUNCHED"
    error_id: ERR_SESSION_NOT_LAUNCHED
    http_status: 409
    applies_to: "POST /boathouse/water-sessions/{id}/return"
  - priority: 12
    category: state
    check: "DamageReport.status == TRIAGED"
    error_id: ERR_REPORT_NOT_TRIAGED
    http_status: 409
    applies_to: "POST /boathouse/damage-reports/{id}/schedule-repair"
  - priority: 13
    category: state
    check: "DamageReport.status == REPAIR_SCHEDULED"
    error_id: ERR_REPORT_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /boathouse/damage-reports/{id}/verify-repair"
  - priority: 14
    category: state
    check: "Regatta.status == OPEN_FOR_ENTRY"
    error_id: ERR_REGATTA_ENTRIES_CLOSED
    http_status: 409
    applies_to: "POST /boathouse/regatta-entries, POST /boathouse/regatta-entries/{id}/submit"
  - priority: 15
    category: state
    check: "RegattaEntry.status == LINEUP_DECLARED"
    error_id: ERR_ENTRY_NOT_DECLARED
    http_status: 409
    applies_to: "POST /boathouse/regatta-entries/{id}/submit"
  - priority: 16
    category: state
    check: "RegattaEntry.status == SUBMITTED"
    error_id: ERR_ENTRY_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /boathouse/regatta-entries/{id}/confirm"
  - priority: 17
    category: state
    check: "Heat.status == LANES_ASSIGNED"
    error_id: ERR_HEAT_NOT_ASSIGNED
    http_status: 409
    applies_to: "POST /boathouse/heats/{id}/results"
  - priority: 18
    category: state
    check: "Heat.status == RESULTS_PROVISIONAL"
    error_id: ERR_HEAT_NOT_PROVISIONAL
    http_status: 409
    applies_to: "POST /boathouse/heats/{id}/officialize, POST /boathouse/protests, POST /boathouse/protests/{id}/rule"
  - priority: 19
    category: state
    check: "Protest.status == UNDER_JURY_REVIEW"
    error_id: ERR_PROTEST_NOT_UNDER_REVIEW
    http_status: 409
    applies_to: "POST /boathouse/protests/{id}/rule"
  - priority: 20
    category: state
    check: "TrailerLoad.status == OPEN"
    error_id: ERR_TRAILER_SEALED
    http_status: 409
    applies_to: "POST /boathouse/trailer-loads/{id}/rack-assignments, POST /boathouse/trailer-loads/{id}/rack-releases"
  - priority: 21
    category: state
    check: "every member referenced by the request (acting member, seated members, coach, coxswain, launch drivers, trailer driver) has membership_status == ACTIVE"
    error_id: ERR_MEMBER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /boathouse/water-sessions, POST /boathouse/regatta-entries/{id}/lineup, POST /boathouse/protests, POST /boathouse/trailer-loads/{id}/transitions"
  - priority: 22
    category: state
    check: "the requested to_status is a declared target of a transition whose from: equals the resource's current status AND every precondition declared on that transition holds (this is the catch-all error for the temporal and relational preconditions on the Member, Regatta and TrailerLoad machines that carry no dedicated error of their own - e.g. closing entries before entry_deadline_at, racing before race_date_at, departing before depart_at, returning before return_at, sealing an empty load, or withdrawing a member who still holds an active lineup seat)"
    error_id: ERR_INVALID_STATUS_TRANSITION
    http_status: 409
    applies_to: "POST /boathouse/members/{id}/status-transitions, POST /boathouse/regattas/{id}/status-transitions, POST /boathouse/trailer-loads/{id}/transitions"
  - priority: 23
    category: business_safety
    check: "X-User-ID != DamageReport.reported_by_member_id — the member who filed a damage report may neither triage nor verify it"
    error_id: ERR_SELF_TRIAGE_FORBIDDEN
    http_status: 403
    applies_to: "POST /boathouse/damage-reports/{id}/triage, POST /boathouse/damage-reports/{id}/verify-repair"
  - priority: 24
    category: business_safety
    check: "X-User-ID != WaterSession.coach_member_id — the coach running the outing may not sign its own safety clearance"
    error_id: ERR_SELF_CLEARANCE_FORBIDDEN
    http_status: 403
    applies_to: "POST /boathouse/water-sessions/{id}/clear"
  - priority: 25
    category: business_safety
    check: "X-User-ID != LineupSeat.member_id — a coxswain may not record their own weigh-in"
    error_id: ERR_SELF_WEIGH_IN_FORBIDDEN
    http_status: 403
    applies_to: "POST /boathouse/lineup-seats/{id}/weigh-in"
  - priority: 26
    category: business_safety
    check: "X-User-ID != Protest.filed_by_member_id AND no LineupSeat with member_id == X-User-ID belongs to a RegattaEntry holding a RaceLane on the protest's heat_id"
    error_id: ERR_JURY_CONFLICT_OF_INTEREST
    http_status: 403
    applies_to: "POST /boathouse/protests/{id}/open-review"
  - priority: 27
    category: business_safety
    check: "the WaterConditionReading named by reading_id has posture IN {OPEN, RESTRICTED}"
    error_id: ERR_WATER_CLOSED
    http_status: 409
    applies_to: "POST /boathouse/water-sessions/{id}/clear"
  - priority: 28
    category: business_safety
    check: "every member in athlete_member_ids plus coxswain_member_id has swim_test_passed_on non-null and no more than 365 days before the logical clock"
    error_id: ERR_SWIM_TEST_MISSING
    http_status: 409
    applies_to: "POST /boathouse/water-sessions/{id}/clear, POST /boathouse/regatta-entries/{id}/lineup"
  - priority: 29
    category: business_safety
    check: "the member in the COXSWAIN role has coxswain_cert_expires_at non-null and strictly after the logical clock"
    error_id: ERR_COXSWAIN_CERT_EXPIRED
    http_status: 409
    applies_to: "POST /boathouse/water-sessions/{id}/clear, POST /boathouse/regatta-entries/{id}/lineup"
  - priority: 30
    category: business_safety
    check: "when coach_member_id is not null, that member has coach_cert_expires_at non-null and strictly after the logical clock"
    error_id: ERR_COACH_CERT_EXPIRED
    http_status: 409
    applies_to: "POST /boathouse/water-sessions/{id}/clear"
  - priority: 31
    category: business_safety
    check: "every non-null launch driver has safety_launch_cert_expires_at non-null and strictly after the logical clock, and has LAUNCH_DRIVER in club_roles"
    error_id: ERR_LAUNCH_CERT_EXPIRED
    http_status: 409
    applies_to: "POST /boathouse/water-sessions/{id}/clear"
  - priority: 32
    category: business_safety
    check: "assigned_launch_count >= required_launch_count as computed by calculations.session_launch_requirement against the supplied reading"
    error_id: ERR_LAUNCH_COVERAGE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /boathouse/water-sessions/{id}/clear"
  - priority: 33
    category: business_safety
    check: "Shell.condition_index_conservative >= 60 for the entry's shell_id"
    error_id: ERR_SHELL_CONDITION_TOO_LOW
    http_status: 409
    applies_to: "POST /boathouse/regatta-entries/{id}/submit"
  - priority: 34
    category: business_safety
    check: "when Shell.tier_restriction == COMPETITIVE_ONLY, every seated member has tier == COMPETITIVE"
    error_id: ERR_TIER_NOT_PERMITTED_FOR_HULL
    http_status: 409
    applies_to: "POST /boathouse/regatta-entries/{id}/lineup, POST /boathouse/water-sessions"
  - priority: 35
    category: business_temporal
    check: "no other WaterSession with status IN {PLANNED, CLEARED, LAUNCHED} on the same shell_id has a half-open window [planned_start_at, planned_end_at) that intersects the requested window after SHELL_TURNAROUND_BUFFER_MINUTES = 30 is appended to the earlier session's end"
    error_id: ERR_SHELL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /boathouse/water-sessions"
  - priority: 36
    category: business_temporal
    check: "for each non-null launch driver, the count of WaterSession rows with status IN {CLEARED, LAUNCHED} naming that driver whose half-open window [planned_start_at, planned_end_at) strictly intersects this session's window (touching endpoints do not intersect and no buffer is applied) is strictly less than that member's launch_supervision_limit"
    error_id: ERR_LAUNCH_DRIVER_OVERBOOKED
    http_status: 409
    applies_to: "POST /boathouse/water-sessions/{id}/clear"
  - priority: 37
    category: business_temporal
    check: "no other DamageReport with status == REPAIR_SCHEDULED on the same assigned_repair_bay has a closed window [repair_window_start_at, repair_window_end_at] that intersects the requested closed window; windows sharing exactly one endpoint DO conflict"
    error_id: ERR_REPAIR_BAY_CONFLICT
    http_status: 409
    applies_to: "POST /boathouse/damage-reports/{id}/schedule-repair"
  - priority: 38
    category: business_temporal
    check: "the logical clock is inside the half-open window [Regatta.weigh_in_opens_at, Regatta.weigh_in_closes_at)"
    error_id: ERR_WEIGH_IN_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /boathouse/lineup-seats/{id}/weigh-in"
  - priority: 39
    category: business_temporal
    check: "the logical clock is strictly before Heat.protest_window_closes_at"
    error_id: ERR_PROTEST_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /boathouse/protests"
  - priority: 40
    category: business_temporal
    check: "the logical clock is at or after Heat.protest_window_closes_at"
    error_id: ERR_PROTEST_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /boathouse/heats/{id}/officialize"
  - priority: 41
    category: business_constraint
    check: "the declared seats number exactly the class seat count (1X:1, 2X:2, 4+:5 including the coxswain, 8+:9 including the coxswain) with seat_number 0 reserved for the single COXSWAIN seat in 4+ and 8+"
    error_id: ERR_SEAT_COUNT_MISMATCH
    http_status: 422
    applies_to: "POST /boathouse/regatta-entries/{id}/lineup"
  - priority: 42
    category: business_constraint
    check: "no member_id appears twice among the declared seats of one entry"
    error_id: ERR_DUPLICATE_SEAT_MEMBER
    http_status: 409
    applies_to: "POST /boathouse/regatta-entries/{id}/lineup"
  - priority: 43
    category: business_constraint
    check: "RegattaEntry.boat_class == Shell.boat_class for shell_id"
    error_id: ERR_BOAT_CLASS_MISMATCH
    http_status: 409
    applies_to: "POST /boathouse/regatta-entries"
  - priority: 44
    category: state
    check: "Regatta.status == RACING for the heat's regatta_id — lanes may only be seeded once the regatta is racing"
    error_id: ERR_REGATTA_NOT_RACING
    http_status: 409
    applies_to: "POST /boathouse/heats/{id}/assign-lanes"
  - priority: 45
    category: business_constraint
    check: "the CONFIRMED candidate set for the heat's regatta_id and event_code is non-empty"
    error_id: ERR_NO_ELIGIBLE_ENTRIES
    http_status: 409
    applies_to: "POST /boathouse/heats/{id}/assign-lanes"
  - priority: 46
    category: business_constraint
    check: "the number of CONFIRMED candidates does not exceed Heat.lane_count"
    error_id: ERR_LANE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /boathouse/heats/{id}/assign-lanes"
  - priority: 47
    category: business_constraint
    check: "calculations.trailer_rack_allocation finds a contiguous run of CLASS_SLOT_UNITS free positions on a tier at or below CLASS_MAX_TIER for the entry's boat_class"
    error_id: ERR_TRAILER_TIER_UNAVAILABLE
    http_status: 409
    applies_to: "POST /boathouse/trailer-loads/{id}/rack-assignments"
  - priority: 48
    category: business_constraint
    check: "Protest.review_round < MAX_JURY_ROUNDS (2)"
    error_id: ERR_MAX_JURY_ROUNDS_EXCEEDED
    http_status: 409
    applies_to: "POST /boathouse/protests/{id}/open-review, POST /boathouse/protests/{id}/rule"
  - priority: 49
    category: business_constraint
    check: "every LineupSeat on the entry with seat_role == COXSWAIN has weigh_in_status == PASSED"
    error_id: ERR_WEIGH_IN_NOT_PASSED
    http_status: 409
    applies_to: "POST /boathouse/regatta-entries/{id}/confirm"
  - priority: 50
    category: business_constraint
    check: "when Regatta.venue_kind == AWAY, RegattaEntry.rack_tier is not null and the owning TrailerLoad.status IN {SEALED, DEPARTED, ARRIVED}"
    error_id: ERR_ENTRY_NOT_RACKED
    http_status: 409
    applies_to: "POST /boathouse/regatta-entries/{id}/confirm"
  - priority: 51
    category: business_referential
    check: "RaceLane.heat_id of against_race_lane_id equals the protest's heat_id"
    error_id: ERR_LANE_NOT_IN_HEAT
    http_status: 409
    applies_to: "POST /boathouse/protests"
  - priority: 52
    category: business_referential
    check: "the Heat named by advances_to_heat_id has the same regatta_id as the heat being created and its round_kind is later in the progression (HEAT < SEMI < FINAL)"
    error_id: ERR_HEAT_NOT_IN_REGATTA
    http_status: 409
    applies_to: "POST /boathouse/heats"
  - priority: 53
    category: business_referential
    check: "RegattaEntry.regatta_id equals TrailerLoad.regatta_id"
    error_id: ERR_TRAILER_REGATTA_MISMATCH
    http_status: 409
    applies_to: "POST /boathouse/trailer-loads/{id}/rack-assignments"
  - priority: 54
    category: business_fiscal
    check: "no LineupSeat on the entry has eligibility_status == BLOCKED_DUES (equivalently, every seated member has dues_balance_cents == 0)"
    error_id: ERR_SEAT_MEMBER_DELINQUENT
    http_status: 402
    applies_to: "POST /boathouse/regatta-entries/{id}/submit"
  - priority: 55
    category: business_fiscal
    check: "DuesInvoice.status IN {ISSUED, PARTIALLY_PAID, DELINQUENT}; because priority 8 is carved out for these two endpoints, a payment or true-up against a PAID or VOIDED invoice reports this error rather than ERR_ALREADY_TERMINAL"
    error_id: ERR_INVOICE_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /boathouse/dues-invoices/{id}/payments, POST /boathouse/dues-invoices/{id}/true-up"
  - priority: 56
    category: business_fiscal
    check: "amount_cents <= assessed_cents - paid_cents"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /boathouse/dues-invoices/{id}/payments"
  - priority: 57
    category: business_fiscal
    check: "DuesInvoice.paid_cents == 0"
    error_id: ERR_INVOICE_HAS_PAYMENTS
    http_status: 409
    applies_to: "POST /boathouse/dues-invoices/{id}/void"
  - priority: 58
    category: business_fiscal
    check: "DuesInvoice.variant_basis == PROVISIONAL"
    error_id: ERR_TRUEUP_ALREADY_APPLIED
    http_status: 409
    applies_to: "POST /boathouse/dues-invoices/{id}/true-up"

endpoints:
  - method: POST
    path: "/boathouse/_clock/set_current_utc"
    description: "Test-driving endpoint: moves the server's logical clock to the supplied instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it MUST NOT fall back to real wall-clock time."
    roles: [ClubAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["all deadline, expiry, decay and window comparisons re-evaluate against the new instant"]

