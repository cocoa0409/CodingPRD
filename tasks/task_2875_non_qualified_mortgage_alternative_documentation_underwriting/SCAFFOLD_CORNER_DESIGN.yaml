      - name: corner_child_lifecycle_state_codes_rejected_per_entity
        claim_type: error_triggerability
        grounds:
          - errors.ERR_WORKSHEET_STATE_INVALID
          - errors.ERR_STATEMENT_MONTH_STATE_INVALID
          - errors.ERR_VALUATION_ORDER_STATE_INVALID
          - errors.ERR_NO_INCLUDED_STATEMENT_MONTHS
          - validations[priority=12]
          - validations[priority=30]
        distinguishing_aspect: "Each child entity has its own 409 code and its own notion of a wrong state: accepting a DRAFT worksheet, re-excluding an already EXCLUDED month and deciding an ORDERED valuation each return a different error_id, while excluding the last INCLUDED month is not a state error at all but the 422 business rule ERR_NO_INCLUDED_STATEMENT_MONTHS."
        test_recipe:
          setup:
            - "A BANK_STATEMENT_12MO loan file in UNDERWRITING with a DRAFT worksheet carrying two adjacent statement months and one ORDERED primary valuation."
          setup_api_calls:
            - call: "POST /documentation-programs"
