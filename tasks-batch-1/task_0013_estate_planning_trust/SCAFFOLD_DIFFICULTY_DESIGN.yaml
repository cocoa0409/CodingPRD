  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: estate_finalize_depends_on_designation_sum
        grounds:
          - state_machines.Estate.DRAFT_to_ALIVE
          - validations[priority=10]
          - entities.BeneficiaryDesignation.fields.share_basis_points
        distinguishing_aspect: |
          Cross-entity pair: Estate ↔ BeneficiaryDesignation. The Estate.DRAFT→ALIVE transition is gated by aggregate of children BeneficiaryDesignation.share_basis_points summing to exactly 10000. Estate itself is internally valid, but the transition is blocked by sibling designation state.
        test_recipe:
          setup:
            - "Estate DRAFT with Asset and ONE BeneficiaryDesignation share=5000bp (under-allocated)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /decedents"
              payload: { full_legal_name: "Rita Suh", date_of_birth: "1950-01-01T00:00:00Z", domicile_state_code: "CA", ssn_last4: "9999" }
              as: EstatePlanner
              captures: { dec_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_id: "${dec_id}" }
              as: EstatePlanner
              captures: { est_id: $.data.id }
            - call: "POST /assets"
              payload: { estate_id: "${est_id}", category: "BANK_ACCOUNT", description: "Acct", appraised_value_cents: 100000 }
              as: EstatePlanner
            - call: "POST /beneficiary-designations"
              payload: { estate_id: "${est_id}", beneficiary_full_name: "Heir R", relationship: "CHILD", share_basis_points: 5000 }
              as: EstatePlanner
          trigger:
            - call: "POST /estates/${est_id}/finalize-plan"
              payload: {}
              as: EstatePlanner
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == 'ERR_SHARE_NOT_FULLY_ALLOCATED'"

      - name: open_probate_depends_on_executor_status
        grounds:
          - state_machines.Estate.PROBATE_PENDING_to_PROBATE_OPEN
          - state_machines.ProbateOrder.DRAFT_to_ENTERED
          - validations[priority=6]
          - entities.Executor.fields.is_also_beneficiary
        distinguishing_aspect: |
          Different cross-entity pair: ProbateOrder/Estate ↔ Executor. OPEN_PROBATE order enter is gated by Executor.is_also_beneficiary — if true, additionally requires a CONFIRM_EXECUTOR order ENTERED. The estate pair (Estate↔BeneficiaryDesignation) above and this one (Estate/ProbateOrder ↔ Executor) are different entity pairs.
        test_recipe:
          setup:
            - "Estate in PROBATE_PENDING with executor whose is_also_beneficiary=true, accepted, but no CONFIRM_EXECUTOR order entered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /decedents"
              payload: { full_legal_name: "Sam Tran", date_of_birth: "1950-01-01T00:00:00Z", domicile_state_code: "CA", ssn_last4: "1010" }
              as: EstatePlanner
              captures: { dec_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_id: "${dec_id}" }
              as: EstatePlanner
              captures: { est_id: $.data.id }
            - call: "POST /assets"
              payload: { estate_id: "${est_id}", category: "BANK_ACCOUNT", description: "Acct", appraised_value_cents: 100000 }
              as: EstatePlanner
            - call: "POST /beneficiary-designations"
              payload: { estate_id: "${est_id}", beneficiary_full_name: "Sam Tran Jr", relationship: "CHILD", share_basis_points: 10000 }
              as: EstatePlanner
            - call: "POST /executors"
              payload: { estate_id: "${est_id}", full_legal_name: "Sam Tran Jr", role_type: "EXECUTOR", is_also_beneficiary: true }
              as: EstatePlanner
              captures: { exec_id: $.data.id }
            - call: "POST /executors/${exec_id}/accept"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
            - call: "POST /estates/${est_id}/finalize-plan"
              payload: {}
              as: EstatePlanner
            - call: "POST /decedents/${dec_id}/register-death"
              payload: { date_of_death: "2026-01-15T00:00:00Z" }
              as: Registrar
            - call: "POST /estates/${est_id}/file-for-probate"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
            - call: "POST /probate-orders"
              payload: { estate_id: "${est_id}", order_type: "OPEN_PROBATE", judge_user_id: "judge-1" }
              as: Judge
              captures: { open_order_id: $.data.id }
          trigger:
            - call: "POST /probate-orders/${open_order_id}/enter"
              payload: {}
              as: Judge
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == 'ERR_EXECUTOR_BENEFICIARY_CONFLICT'"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: poa_half_open_interval_overlap_same_scope
        grounds:
          - validations[priority=16]
          - errors[ERR_POA_INTERVAL_OVERLAP]
          - entities.PowerOfAttorney.fields.effective_at
          - entities.PowerOfAttorney.fields.effective_until
        distinguishing_aspect: |
          Half-open interval [effective_at, effective_until): two FINANCIAL POAs on the same decedent. POA-A spans [2026-01-01, 2026-03-01); POA-B requests [2026-03-01, +inf) — adjacent at T, which under half-open semantics does NOT overlap (allowed). POA-C requests [2026-02-15, +inf) — overlaps POA-A's open interval → ERR_POA_INTERVAL_OVERLAP. Half-open adjacency is the defining geometric trait, distinct from point-uniqueness in sibling instance.
        test_recipe:
          setup:
            - "Decedent (alive) with one ACTIVE FINANCIAL POA bounded [2026-01-01, 2026-03-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /decedents"
              payload: { full_legal_name: "Tina Vega", date_of_birth: "1950-01-01T00:00:00Z", domicile_state_code: "NY", ssn_last4: "2020" }
              as: EstatePlanner
              captures: { dec_id: $.data.id }
            - call: "POST /powers-of-attorney"
              payload: { decedent_id: "${dec_id}", agent_full_name: "Agent X", scope: "FINANCIAL" }
              as: EstatePlanner
              captures: { poa_a_id: $.data.id }
            - call: "POST /powers-of-attorney/${poa_a_id}/activate"
              payload: { effective_at: "2026-01-01T00:00:00Z", effective_until: "2026-03-01T00:00:00Z" }
              as: EstatePlanner
            - call: "POST /powers-of-attorney"
              payload: { decedent_id: "${dec_id}", agent_full_name: "Agent Y", scope: "FINANCIAL" }
              as: EstatePlanner
              captures: { poa_b_id: $.data.id }
            - call: "POST /powers-of-attorney"
              payload: { decedent_id: "${dec_id}", agent_full_name: "Agent Z", scope: "FINANCIAL" }
              as: EstatePlanner
              captures: { poa_c_id: $.data.id }
          trigger:
            - call: "POST /powers-of-attorney/${poa_b_id}/activate"
              payload: { effective_at: "2026-03-01T00:00:00Z" }
              as: EstatePlanner
              captures: { poa_b_status: $.data.status }
            - call: "POST /powers-of-attorney/${poa_c_id}/activate"
              payload: { effective_at: "2026-02-15T00:00:00Z" }
              as: EstatePlanner
              captures: { err_id: $.data.error_id }
          assert:
            - "poa_b_status == 'ACTIVE'"
            - "err_id == 'ERR_POA_INTERVAL_OVERLAP'"

      - name: guardianship_point_uniqueness_no_adjacency_relief
        grounds:
          - validations[priority=17]
          - errors[ERR_DUPLICATE_WARD]
          - entities.Guardianship.fields.ward_full_name
        distinguishing_aspect: |
          Different interval semantics: point-uniqueness, NOT interval-overlap. Two Guardianship rows for the same ward_full_name on the same estate are rejected regardless of any temporal relationship — even if one is DISSOLVED. The geometric treatment differs from POA's half-open intervals: here adjacency is irrelevant because intervals do not exist. Different resource entity (Guardianship vs PowerOfAttorney).
        test_recipe:
          setup:
            - "Estate with one Guardianship for ward 'Junior Vega' already in PROPOSED status."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /decedents"
              payload: { full_legal_name: "Uma Wei", date_of_birth: "1965-01-01T00:00:00Z", domicile_state_code: "CA", ssn_last4: "3030" }
              as: EstatePlanner
              captures: { dec_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_id: "${dec_id}" }
              as: EstatePlanner
              captures: { est_id: $.data.id }
            - call: "POST /guardianships"
              payload: { estate_id: "${est_id}", ward_full_name: "Junior Wei", ward_date_of_birth: "2020-06-06T00:00:00Z", guardian_full_name: "Auntie A" }
              as: EstatePlanner
              captures: { g1_id: $.data.id }
          trigger:
            - call: "POST /guardianships"
              payload: { estate_id: "${est_id}", ward_full_name: "Junior Wei", ward_date_of_birth: "2020-06-06T00:00:00Z", guardian_full_name: "Auntie B" }
              as: EstatePlanner
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == 'ERR_DUPLICATE_WARD'"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: revoke_primary_activates_contingent_share_total_preserved
        grounds:
          - state_machines.BeneficiaryDesignation.ACTIVE_to_REVOKED
          - state_machines.BeneficiaryDesignation.DRAFT_to_ACTIVE
          - entities.BeneficiaryDesignation.fields.contingent_of_designation_id
        distinguishing_aspect: |
          Conserved quantity: sum(BeneficiaryDesignation.share_basis_points for status=ACTIVE on the estate). Forward action: revoke primary (-share). Compensating action: contingent child cascade DRAFT->ACTIVE (+ same share). Invariant: total ACTIVE share unchanged at exactly 10000 bp before AND after the pair.
        test_recipe:
          setup:
            - "Estate ALIVE with primary CHILD designation Bp at 6000 ACTIVE and a contingent_of_designation_id child Bc at 6000 DRAFT (contingent of Bp); a SPOUSE designation at 4000 ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /decedents"
              payload: { full_legal_name: "Vera Xu", date_of_birth: "1950-01-01T00:00:00Z", domicile_state_code: "NY", ssn_last4: "4040" }
              as: EstatePlanner
              captures: { dec_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_id: "${dec_id}" }
              as: EstatePlanner
              captures: { est_id: $.data.id }
            - call: "POST /assets"
              payload: { estate_id: "${est_id}", category: "BANK_ACCOUNT", description: "Acct", appraised_value_cents: 1000000 }
              as: EstatePlanner
            - call: "POST /beneficiary-designations"
              payload: { estate_id: "${est_id}", beneficiary_full_name: "Spouse V", relationship: "SPOUSE", share_basis_points: 4000 }
              as: EstatePlanner
              captures: { sp_id: $.data.id }
            - call: "POST /beneficiary-designations"
              payload: { estate_id: "${est_id}", beneficiary_full_name: "Primary Child", relationship: "CHILD", share_basis_points: 6000 }
              as: EstatePlanner
              captures: { bp_id: $.data.id }
            - call: "POST /beneficiary-designations"
              payload: { estate_id: "${est_id}", beneficiary_full_name: "Contingent Child", relationship: "CHILD", share_basis_points: 6000, contingent_of_designation_id: "${bp_id}" }
              as: EstatePlanner
              captures: { bc_id: $.data.id }
            - call: "POST /executors"
              payload: { estate_id: "${est_id}", full_legal_name: "Exec V", role_type: "EXECUTOR", is_also_beneficiary: false }
              as: EstatePlanner
              captures: { exec_id: $.data.id }
            - call: "POST /executors/${exec_id}/accept"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
            - call: "POST /estates/${est_id}/finalize-plan"
              payload: {}
              as: EstatePlanner
              captures: { est_v_after_finalize: $.data.version }
          trigger:
            - call: "POST /beneficiary-designations/${bp_id}/revoke"
              payload: { expected_estate_version: "${est_v_after_finalize}" }
              as: EstatePlanner
            - call: "GET /beneficiary-designations/${bp_id}"
              payload: {}
              as: EstatePlanner
              captures: { bp_status_after: $.data.status }
            - call: "GET /beneficiary-designations/${bc_id}"
              payload: {}
              as: EstatePlanner
              captures: { bc_status_after: $.data.status, bc_share: $.data.share_basis_points }
            - call: "GET /beneficiary-designations/${sp_id}"
              payload: {}
              as: EstatePlanner
              captures: { sp_status_after: $.data.status, sp_share: $.data.share_basis_points }
          assert:
            - "bp_status_after == 'REVOKED'"
            - "bc_status_after == 'ACTIVE'"
            - "sp_status_after == 'ACTIVE'"
            - "sp_share + bc_share == 10000"
            - "Pre-action: ACTIVE total = sp(4000) + bp(6000) = 10000. Post-action: ACTIVE total = sp(4000) + bc(6000) = 10000. Invariant preserved."

      - name: liquidate_asset_decreases_gross_by_exact_appraised_value
        grounds:
          - state_machines.Asset.INCLUDED_to_LIQUIDATED
          - calculations.gross_estate_value
          - endpoints[POST /assets/{id}/liquidate]
        distinguishing_aspect: |
          Different conserved quantity: gross_estate_value_cents. Pre-liquidate snapshot G_pre. Forward action: asset.appraised_value_cents=A, status INCLUDED→LIQUIDATED. Invariant: G_post == G_pre - A. No drift due to rounding (cents are integer) or recomputation order. Distinct from share_basis_points invariant above.
        test_recipe:
          setup:
            - "Estate ALIVE with two INCLUDED assets: real-estate 500000 cents and bank 300000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /decedents"
              payload: { full_legal_name: "Wendy Yates", date_of_birth: "1950-01-01T00:00:00Z", domicile_state_code: "TX", ssn_last4: "5050" }
              as: EstatePlanner
              captures: { dec_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_id: "${dec_id}" }
              as: EstatePlanner
              captures: { est_id: $.data.id }
            - call: "POST /assets"
              payload: { estate_id: "${est_id}", category: "REAL_ESTATE", description: "Home", appraised_value_cents: 500000 }
              as: EstatePlanner
              captures: { re_asset_id: $.data.id }
            - call: "POST /assets"
              payload: { estate_id: "${est_id}", category: "BANK_ACCOUNT", description: "Chase", appraised_value_cents: 300000 }
              as: EstatePlanner
              captures: { bk_asset_id: $.data.id }
            - call: "POST /beneficiary-designations"
              payload: { estate_id: "${est_id}", beneficiary_full_name: "Heir W", relationship: "CHILD", share_basis_points: 10000 }
              as: EstatePlanner
            - call: "POST /executors"
              payload: { estate_id: "${est_id}", full_legal_name: "Exec W", role_type: "EXECUTOR", is_also_beneficiary: false }
              as: EstatePlanner
              captures: { exec_id: $.data.id }
            - call: "POST /executors/${exec_id}/accept"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
            - call: "POST /estates/${est_id}/finalize-plan"
              payload: {}
              as: EstatePlanner
              captures: { gross_pre: $.data.gross_estate_value_cents }
            - call: "POST /decedents/${dec_id}/register-death"
              payload: { date_of_death: "2026-01-15T00:00:00Z" }
              as: Registrar
            - call: "POST /estates/${est_id}/file-for-probate"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
            - call: "POST /probate-orders"
              payload: { estate_id: "${est_id}", order_type: "OPEN_PROBATE", judge_user_id: "judge-1" }
              as: Judge
              captures: { open_order_id: $.data.id }
            - call: "POST /probate-orders/${open_order_id}/enter"
              payload: {}
              as: Judge
          trigger:
            - call: "POST /assets/${bk_asset_id}/liquidate"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
            - call: "GET /estates/${est_id}"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
              captures: { gross_post: $.data.gross_estate_value_cents }
          assert:
            - "gross_pre == 800000"
            - "gross_post == 500000"
            - "gross_pre - gross_post == 300000"
