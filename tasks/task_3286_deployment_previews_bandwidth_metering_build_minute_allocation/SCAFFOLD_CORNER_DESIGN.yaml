    grounds:
    - validations[priority=10]
    - errors[ERR_BUILD_MINUTES_EXHAUSTED]
    - calculations.build_queue_admission
    distinguishing_aspect: 'Admission boundary is strict >: used(3) + estimate(2) == included(5) is admitted; after one more minute is consumed
      (used=4), 4+2 == 6 > 5 rejects with 402.'
    test_recipe:
      setup:
      - Plan included_build_minutes=5; d1 built exactly 120s -> used=2; d2 queued with default estimate 2 -> 2+2=4 <= 5 admitted and built 60s
