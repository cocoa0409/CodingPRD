            - call: "POST /claims"
              payload: { enrollment_id: "${enrollment_id}", line_type: "WATER_SERVICE_LINE", defect_location: "CURB_STOP_TO_METER", urgency: "ROUTINE", incident_description: "Occurrence 1: curb-stop replacement with permit and backfill." }
