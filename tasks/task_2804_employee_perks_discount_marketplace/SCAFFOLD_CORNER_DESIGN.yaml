          assert:
            - "${rejected_before} == REJECTED"
            - "${agreement_status} == TERMINATED, ${agreement_reason} == PARTNER_EXIT and ${agreement_excl} == false"
            - "${s_active} == EXPIRED and ${exp_active} == 2026-08-10T00:00:00Z"
            - "${s_paused} == EXPIRED and ${exp_paused} == 2026-08-10T00:00:00Z"
            - "${s_draft} == EXPIRED and ${exp_draft} == 2026-08-10T00:00:00Z"
            - "${s_review} == EXPIRED and ${exp_review} == 2026-08-10T00:00:00Z"
            - "${s_rejected} == REJECTED and ${exp_rejected} is null: the terminal child is skipped"
            - "${merchant_status} == ACTIVE and ${merchant_agreements} == 0: losing every agreement does not terminate the partner"

  - section: calculations
    instances:
      - name: eligible_headcount_counts_only_in_window_eligible_rows
        claim_type: correct_result
        grounds:
          - calculations.employer_eligible_headcount
          - entities.Employer.fields.eligible_headcount
          - entities.Employer.fields.employee_count_declared
          - entities.EmployeeMembership.fields.eligibility_valid_until
        distinguishing_aspect: |
          A five-record roster yields eligible_headcount 4, not 5 and not the declared 500:
          the three ACTIVE and the one LEAVE row inside their half-open window count, the row
          whose eligibility_valid_until equals clock_now is excluded, and
          employee_count_declared never enters the figure.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; employer Northwind Co created with employee_count_declared 500 and branded."
            - "One eligibility batch carries five well-formed records: E-001/E-002 ACTIVE CA, E-003 ACTIVE TX, E-004 LEAVE CA (all with window 2026-07-01 to 2027-07-01) and E-005 ACTIVE CA with window 2026-07-01 to 2026-08-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/employers"
              payload: { name: "Northwind Co", region_code: "CA", employee_count_declared: 500, revenue_share_enabled: true, privacy_min_cohort_size: 3 }
              as: PlatformAdmin
