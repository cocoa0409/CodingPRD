# =============================================================================
# task_0048_product_defect_tracking — Scaffold Difficulty Design (§1.8)
# Single top-level key only.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1: dual_variant_calc (≥ 2 instances, different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: defect_sla_breach_forward_vs_chronological
        grounds:
          - calculations.escalation_level
          - calculations.effective_sla_minutes
          - state_machines.Defect.RUNNING_to_PAUSED
          - state_machines.Defect.PAUSED_to_RUNNING
          - entities.Defect.fields.total_paused_minutes
          - entities.SLAPause.fields.started_at_minute
        distinguishing_aspect: |
          Operates on the Defect entity domain. Forward-looking variant computes
          escalation_level from a live snapshot (project.clock_minute -
          defect.total_paused_minutes vs response_due_minute, strict >), so two
          equal-but-paused defects with the same elapsed wall-clock minutes can
          show DIFFERENT escalation levels because total_paused_minutes is
          read live. The chronological variant (replayed by feeding SLAPause
          rows in started_at_minute order via /audit-entries) would yield the
          same numbers only if no late-arriving pauses change total_paused_minutes.
        test_recipe:
          setup:
            - "Create Project, TeamMember (DEVELOPER, TRIAGE_MANAGER), Module (kloc=2.0, initial_defect_quota=5)"
            - "Create Defect A (severity=CRITICAL, business_impact=REVENUE_BLOCKING) at clock=0; assign at clock=0; response_due_minute=60 (effective_sla_minutes for CRITICAL with priority_score=122 → multiplier=1.0)"
          trigger:
            - "POST /_clock/advance {minutes: 30}"
            - "POST /defects/{A}/pause-sla {reason: WAITING_ON_REPORTER}"
            - "POST /_clock/advance {minutes: 40}  (now at clock=70, but 40 of those are paused)"
            - "POST /_sweep/sla-escalation {project_id} — variant 1: live forward-looking"
            - "POST /defects/{A}/resume-sla"
            - "POST /_sweep/sla-escalation {project_id} — variant 2: chronological after pause closes"
          assert:
            - "After first sweep at clock=70 with active pause: adjusted_now = 70 - total_paused_minutes(still updating, currently 0 because pause is open) — actually frozen because sla_state=PAUSED; defect.escalation_level == 0"
            - "After resume at clock=70: total_paused_minutes = 40; subsequent sweep with adjusted_now = 70 - 40 = 30 < response_due_minute=60: defect.escalation_level == 0"
            - "POST /_clock/advance {minutes: 31}; second sweep: adjusted_now = 101 - 40 = 61 > 60: defect.escalation_level == 1"
            - "The forward-looking and chronological readings yielded different escalation_level values at the same clock_minute (variant 1 produced 0 while same wall time replayed chronologically would have produced 1)"

      - name: module_defect_density_forward_vs_chronological
        grounds:
          - calculations.provisional_defect_density
          - calculations.final_defect_density
          - entities.Module.fields.kloc
          - entities.Defect.fields.effective_severity
          - state_machines.SeverityOverride.PENDING_to_APPROVED
        distinguishing_aspect: |
          Operates on the Module entity domain (distinct from Rule 1 instance 1
          which operates on Defect). provisional_defect_density reads the LIVE
          set of non-terminal defects and their current effective_severity;
          final_defect_density reads only CLOSED defects in a half-open
          [period_start, period_end) window and uses weight_at_closure. A
          single defect overridden from MAJOR to BLOCKER between report and
          close therefore contributes 1.0 (per-line rounded) to provisional
          density but 3.0 to final density, producing different results from
          identical underlying data.
        test_recipe:
          setup:
            - "Create Project, TeamMembers (Triage, Dev1, QA1), Module M1 (kloc=2.0, initial_defect_quota=5)"
            - "Create Defect D1 (severity=MAJOR, business_impact=INTERNAL) at clock=0"
          trigger:
            - "GET /statistics/density?module_id=M1&mode=provisional → reading_1"
            - "POST /defects/{D1}/severity-overrides {requested_severity: BLOCKER, justification: 'critical regression'} (requested_by=Dev1)"
            - "POST /severity-overrides/{O1}/approve (acting Triage, who != Dev1)"
            - "GET /statistics/density?module_id=M1&mode=provisional → reading_2"
            - "Drive D1 through assign → start → submit-fix → verify(PASSED) → close at clock=100"
            - "GET /statistics/density?module_id=M1&mode=final&period_start=0&period_end=200 → reading_3"
          assert:
            - "reading_1.density == 0.50  (weight 1.0 / kloc 2.0)"
            - "reading_2.density == 1.50  (weight 3.0 / kloc 2.0 after override approval)"
            - "reading_3.density == 1.50  (final at closure used post-override effective_severity)"
            - "Across the same Module + same Defect, provisional and final variants produced 0.50 and 1.50 respectively — different values from same data, satisfying Rule 1's dual-variant requirement on the Module entity domain"

  # ---------------------------------------------------------------------------
  # Rule 2: combinatorial_formula (≥ 2 instances from DIFFERENT modes a/b/c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_four_input_nonlinear
        grounds:
          - calculations.severity_priority_score
          - entities.Defect.fields.effective_severity
          - entities.Defect.fields.business_impact
          - entities.Defect.fields.reopen_count
        distinguishing_aspect: |
          Mode (a): formula with FOUR inputs (severity_weight, impact_weight,
          age_factor, reopen_bonus) where the age_factor's divisor and cap
          BRANCH on the severity tier — BLOCKER/CRITICAL use age_minutes//10
          capped at 50; MAJOR/MINOR/TRIVIAL use age_minutes//60 capped at 30.
          Same numeric (age_minutes=60, impact_weight=50, reopen_count=0)
          produces 70+50+6+0=126 for CRITICAL but 40+50+1+0=91 for MAJOR.
          Non-linear interaction between severity and age inputs.
        test_recipe:
          setup:
            - "Create Project, TeamMembers, Module (initial_defect_quota=5, kloc=2.0)"
            - "Create Defect D_critical (severity=CRITICAL, business_impact=REVENUE_BLOCKING) at clock=0"
            - "Create Defect D_major (severity=MAJOR, business_impact=REVENUE_BLOCKING) at clock=0"
          trigger:
            - "POST /_clock/advance {minutes: 60}"
            - "GET /defects/{D_critical}  → read priority_score"
            - "GET /defects/{D_major}  → read priority_score"
          assert:
            - "D_critical.priority_score == 70 + 50 + min(50, 60//10) + 15*0 == 70+50+6+0 == 126"
            - "D_major.priority_score == 40 + 50 + min(30, 60//60) + 15*0 == 40+50+1+0 == 91"
            - "126 != 91 demonstrates that age_factor's branching makes the four inputs interact non-linearly across severity tiers"

      - name: defect_density_per_line_round_then_sum
        grounds:
          - calculations.provisional_defect_density
          - entities.Module.fields.kloc
          - entities.Defect.fields.effective_severity
        distinguishing_aspect: |
          Mode (b): nested rounding where ORDER matters. The scaffold pins
          per-line rounding (round each per_defect_weight to 1 decimal) BEFORE
          summing. With three MAJOR defects (weight 1.0 each), per-line round
          yields 1.0+1.0+1.0=3.0, then divide by kloc=2.0 = 1.5, final round
          to 2 decimals = 1.50. With weights that include rounding noise
          (e.g., TRIVIAL=0.25 rounds-per-line to 0.3 in 1-decimal precision via
          round_half_up — actually 0.25 → 0.3? round_half_up of 0.25 with 1
          decimal = 0.3), four TRIVIAL defects: per-line-then-sum yields
          0.3+0.3+0.3+0.3 = 1.2, divided by kloc=2.0 = 0.6, final = 0.60. The
          alternative order (sum-then-round) would yield 1.0/2.0 = 0.5 → 0.50.
          Different value from same inputs → ordering of round-vs-sum matters,
          and the scaffold pins the per-line-first order.
        test_recipe:
          setup:
            - "Create Project, TeamMembers, Module M_trivial (kloc=2.0, initial_defect_quota=10)"
            - "Create four Defects on M_trivial, all with severity=TRIVIAL and business_impact=INTERNAL"
          trigger:
            - "GET /statistics/density?module_id=M_trivial&mode=provisional"
          assert:
            - "Per pinned order — STEP 1: round(0.25, 1) → 0.3 for each of the 4 defects, STEP 2: sum = 1.2, STEP 3: divide by 2.0 = 0.6, STEP 4: round(0.6, 2) = 0.60"
            - "response.density == 0.60"
            - "Sum-then-round alternative (forbidden) would yield round(round(0.25*4/2.0, 2), 2) = round(0.5, 2) = 0.50"
            - "The 0.60 vs 0.50 gap is direct evidence that the scaffold's pinned order matters — a different order produces a different number"

      - name: effective_sla_circular_pin
        grounds:
          - calculations.effective_sla_minutes
          - calculations.severity_priority_score
          - entities.Defect.fields.priority_score
          - state_machines.SeverityOverride.PENDING_to_APPROVED
        distinguishing_aspect: |
          Mode (c): circular-looking dependency. priority_score depends on
          age_minutes (which depends on clock_minute), AND effective_sla_minutes
          depends on priority_score's tier. The scaffold breaks the cycle by
          pinning evaluation order: read priority_score AS OF the moment
          effective_sla_minutes fires; do NOT recompute priority_score inside
          effective_sla_minutes. Distinct from modes (a) and (b).
        test_recipe:
          setup:
            - "Create Project, TeamMembers, Module (kloc=2.0, initial_defect_quota=5)"
            - "Create Defect D (severity=CRITICAL, business_impact=REVENUE_BLOCKING) at clock=0"
          trigger:
            - "Initially priority_score = 70+50+0+0 = 120, multiplier=1.0, response_due_minute = 0 + ceil(60*1.0) = 60"
            - "POST /_clock/advance {minutes: 100}"
            - "Trigger a priority_score recompute (e.g., POST /defects/{D}/severity-overrides + approve to BLOCKER)"
            - "Read defect; priority_score now = 100 + 50 + min(50, 100//10) + 0 = 100+50+10+0 = 160 → tier crosses MULT_URGENT_THRESHOLD (150)"
            - "Override approval recomputes response_due_minute using the NEW priority_score: multiplier=0.5, new base for BLOCKER=30, so new response_due_minute = (original report clock=0) + ceil(30*0.5) = 15"
          assert:
            - "Initial defect.response_due_minute == 60"
            - "After override approval at clock=100, defect.response_due_minute == 15 (the pinned order ensures the recomputation uses priority_score AS OF the approval, not a re-derivation that would itself depend on a newer clock-derived priority_score)"
            - "If the implementation had failed to pin the evaluation order and instead computed priority_score inside effective_sla_minutes, it would have entered an undefined recursion — the pinned order produces the deterministic 15"

  # ---------------------------------------------------------------------------
  # Rule 3: non_linear_state_machine (≥ 2 instances, DIFFERENT entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: defect_reopen_cycle
        grounds:
          - state_machines.Defect.FIXED_to_REOPENED
          - state_machines.Defect.REOPENED_to_ASSIGNED
          - state_machines.Defect.ASSIGNED_to_IN_PROGRESS
          - state_machines.Defect.IN_PROGRESS_to_FIXED
          - entities.Defect.fields.reopen_count
        distinguishing_aspect: |
          Cyclic shape on the Defect entity. ASSIGNED → IN_PROGRESS → FIXED →
          REOPENED → ASSIGNED forms a closed loop; reopen_count increments on
          every traversal. After 3 verification failures the defect has been
          through the cycle 3 times. Different entity from instance 2 (Defect
          vs SeverityOverride).
        test_recipe:
          setup:
            - "Create Project, Module, TeamMembers (Triage, Dev1, QA1)"
            - "Create Defect D, assign to Dev1"
          trigger:
            - "Round 1: Dev1 start-progress → submit-fix → QA1 verify(FAILED)"
            - "Round 2: Triage assign D to Dev1 → Dev1 start-progress → submit-fix → QA1 verify(FAILED)"
            - "Round 3: Triage assign D to Dev1 → Dev1 start-progress → submit-fix → QA1 verify(FAILED)"
          assert:
            - "Defect.reopen_count == 3 after three traversals of the loop"
            - "Defect.status == REOPENED after Round 3"
            - "Three FixRecord rows exist for D (one per traversal)"
            - "Three VerificationRecord rows with outcome=FAILED exist"
            - "Each REOPENED transition incremented reopen_count by exactly 1 (no double-counting); the loop is therefore well-formed cyclic, not duplicated"

      - name: severity_override_branching
        grounds:
          - state_machines.SeverityOverride.PENDING_to_APPROVED
          - state_machines.SeverityOverride.PENDING_to_REJECTED
          - entities.SeverityOverride.fields.status
        distinguishing_aspect: |
          Branching fork-join shape on SeverityOverride: a single PENDING state
          forks to two terminal states (APPROVED, REJECTED) with divergent
          side-effect sets — APPROVED cascades effective_severity/priority/SLA
          updates; REJECTED leaves defect unchanged. Different entity from
          instance 1 (SeverityOverride vs Defect).
        test_recipe:
          setup:
            - "Create Project, TeamMembers (Triage1, Triage2, Dev1), Module, Defect D (severity=MAJOR)"
            - "Create two SeverityOverride rows O1 and O2 against D, both requested_by=Dev1"
          trigger:
            - "POST /severity-overrides/{O1}/approve  (acting Triage1)"
            - "POST /severity-overrides/{O2}/reject   (acting Triage2)"
          assert:
            - "O1.status == APPROVED, defect.effective_severity changed accordingly"
            - "O2.status == REJECTED, defect.effective_severity unchanged by O2's transition"
            - "Both transitions started from the same PENDING source state but produced different side-effect sets (one mutated the defect, the other did not), which is the defining property of branching fork-join shape"

  # ---------------------------------------------------------------------------
  # Rule 4: transitive_cascade (≥ 2, one ≥ depth 3, one ≥ depth 2, different triggers)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: verify_failed_reopen_cascade_depth4
        grounds:
          - state_machines.Defect.FIXED_to_REOPENED
          - calculations.severity_priority_score
          - calculations.effective_sla_minutes
          - entities.Defect.fields.reopen_count
          - entities.Defect.fields.priority_score
          - entities.Defect.fields.response_due_minute
          - entities.Defect.fields.escalation_level
          - entities.AuditEntry.fields.event_type
        distinguishing_aspect: |
          Depth-4 cascade triggered by POST /defects/{id}/verify with FAILED:
          Link 1: defect.status FIXED → REOPENED (the original mutation)
          Link 2: reopen_count++ caused BY Link 1's transition trigger
          Link 3: priority_score recomputed because reopen_bonus = reopen_count
                  * 15 changed (caused BY Link 2's reopen_count change)
          Link 4: response_due_minute reset because effective_sla_minutes
                  depends on priority_score tier (caused BY Link 3's score
                  change crossing or staying in a tier)
          AuditEntry rows are written for each link, observable via
          GET /audit-entries.
        test_recipe:
          setup:
            - "Create Project, TeamMembers (Triage, Dev1, QA1), Module, Defect D (severity=CRITICAL, business_impact=REVENUE_BLOCKING)"
            - "Assign D to Dev1, start-progress, submit-fix at clock=10. Read defect: priority_score = 120 (assuming age_factor=0), response_due_minute=60"
          trigger:
            - "POST /defects/{D}/verify {outcome: FAILED, fix_record_id: <latest>}  (acting QA1)"
          assert:
            - "Link 1: defect.status == REOPENED"
            - "Link 2: defect.reopen_count == 1 (was 0)"
            - "Link 3: defect.priority_score == 70 + 50 + min(50, 10//10) + 15*1 == 70+50+1+15 == 136 (different from prior 120)"
            - "Link 4: defect.response_due_minute == project.clock_minute + ceil(60 * 1.0) == 10 + 60 == 70 (was 60; reset to new clock)"
            - "Link 5: defect.escalation_level == 0 (reset)"
            - "GET /audit-entries?defect_id={D} returns 1 STATUS_CHANGE (FIXED→REOPENED) and 1 ESCALATION (n→0) entry from this cascade"
            - "Each link is caused by the previous link, not by the original /verify call: removing Link 2 would break Link 3, removing Link 3 would break Link 4"

      - name: override_approval_severity_cascade_depth3
        grounds:
          - state_machines.SeverityOverride.PENDING_to_APPROVED
          - calculations.severity_priority_score
          - calculations.effective_sla_minutes
          - entities.Defect.fields.effective_severity
          - entities.Defect.fields.priority_score
          - entities.Defect.fields.resolution_due_minute
          - entities.AuditEntry.fields.event_type
        distinguishing_aspect: |
          Depth-3 cascade triggered by a DIFFERENT endpoint
          (POST /severity-overrides/{id}/approve) than instance 1's verify
          endpoint:
          Link 1: defect.effective_severity changed
          Link 2: priority_score recomputed because severity_weight changed
                  (caused BY Link 1)
          Link 3: resolution_due_minute recomputed because
                  resolution_sla_minutes_base[effective_severity] AND the
                  multiplier (from new priority_score tier) both changed
                  (caused BY Links 1 and 2 together)
          Different originating transition from instance 1.
        test_recipe:
          setup:
            - "Create Project, TeamMembers (Triage, Dev1), Module, Defect D (severity=MAJOR, business_impact=INTERNAL) at clock=0; do NOT assign. Read D: severity_weight=40, impact=5, age=0, reopen=0 → priority_score=45. resolution_due_minute = 0 + ceil(1440*1.5) = 2160 (priority_score 45 < 80 → multiplier=1.5)."
            - "Create SeverityOverride O (requested_severity=BLOCKER, requested_by=Dev1)"
          trigger:
            - "POST /severity-overrides/{O}/approve (acting Triage)"
          assert:
            - "Link 1: defect.effective_severity == BLOCKER (was MAJOR)"
            - "Link 2: defect.priority_score == 100 + 5 + 0 + 0 == 105 (was 45; tier crosses MULT_STANDARD_THRESHOLD=80 from 'relaxed' to 'standard')"
            - "Link 3: defect.resolution_due_minute == 0 + ceil(240 * 1.0) == 240 (was 2160; both base and multiplier changed)"
            - "GET /audit-entries?defect_id={D} returns a SEVERITY_CHANGE entry with from_value=MAJOR, to_value=BLOCKER"
            - "This cascade originates from /severity-overrides/.../approve — distinct from instance 1's /defects/{id}/verify trigger"

  # ---------------------------------------------------------------------------
  # Rule 5: priority_pair_validation_conflict (≥ 2 different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_referential_on_assign
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors.ERR_DEFECT_CLOSED
          - errors.ERR_TEAM_MEMBER_NOT_ELIGIBLE
        distinguishing_aspect: |
          Category pair: state (priority 5) vs business_referential (priority 8).
          When a /assign request targets a CLOSED defect AND supplies an
          assignee_id that points to an INACTIVE TeamMember, state wins —
          ERR_DEFECT_CLOSED is returned, not ERR_TEAM_MEMBER_NOT_ELIGIBLE,
          because priority 5 fires before priority 8.
        test_recipe:
          setup:
            - "Create Project P1, TeamMembers Triage1, Dev1; Module M1; Defect D in P1"
            - "Drive D through full lifecycle to CLOSED (assign Dev1 → start → submit-fix → independent QA verify(PASSED) → close)"
            - "Create a second Project P2 with its own TeamMember Dev_other in P2 (Dev_other is ACTIVE but belongs to a different project than D, so they are not eligible to be assigned to D)"
          trigger:
            - "POST /defects/{D}/assign  body: {assignee_id: Dev_other.id}  (acting Triage1, X-User-Role=TRIAGE_MANAGER)"
          assert:
            - "Response status code == 409"
            - "Response error_id == ERR_DEFECT_CLOSED  (NOT ERR_TEAM_MEMBER_NOT_ELIGIBLE)"
            - "Priority 5 (state — defect is CLOSED) fired before priority 8 (business_referential — assignee is in wrong project)"

      - name: state_vs_safety_on_override_approve
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors.ERR_OVERRIDE_NOT_PENDING
          - errors.ERR_OVERRIDE_APPROVER_NOT_INDEPENDENT
          - state_machines.SeverityOverride.PENDING_to_APPROVED
        distinguishing_aspect: |
          Category pair: state (priority 5 — SeverityOverride must be PENDING)
          vs business_safety (priority 7 — approver independence). DIFFERENT
          pair from instance 1 (state vs business_referential). When a
          requester (Triage1) tries to approve an override they themselves
          created AND that override has already been approved by a different
          triage manager (Triage2), both priority 5 and priority 7 would fire.
          Priority 5 wins; ERR_OVERRIDE_NOT_PENDING is returned, not
          ERR_OVERRIDE_APPROVER_NOT_INDEPENDENT.
        test_recipe:
          setup:
            - "Create Project, TeamMembers Triage1 (role=TRIAGE_MANAGER), Triage2 (role=TRIAGE_MANAGER), Dev1 (role=DEVELOPER), Module, Defect D (severity=MAJOR)"
            - "POST /defects/{D}/severity-overrides {requested_severity: BLOCKER, justification: 'urgent'} acting as Triage1 → SeverityOverride O created, status=PENDING, requested_by=Triage1.id"
            - "POST /severity-overrides/{O}/approve acting as Triage2 → O.status=APPROVED (priority 7 passes for Triage2 because Triage2.id != Triage1.id)"
          trigger:
            - "POST /severity-overrides/{O}/approve acting as Triage1  (same actor as requested_by, AND override is no longer PENDING)"
          assert:
            - "Response status code == 409"
            - "Response error_id == ERR_OVERRIDE_NOT_PENDING  (priority 5 state)"
            - "NOT ERR_OVERRIDE_APPROVER_NOT_INDEPENDENT  (priority 7 business_safety), even though X-User-ID == O.requested_by would also be a violation"
            - "Category pair tested: state (priority 5) vs business_safety (priority 7) — different from instance 1's state vs business_referential pair"

  # ---------------------------------------------------------------------------
  # Rule 6: boundary_precision_check (≥ 2, different metrics/endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: sla_breach_strict_greater_than
        grounds:
          - calculations.escalation_level
          - entities.Defect.fields.response_due_minute
          - entities.Defect.fields.escalation_level
        distinguishing_aspect: |
          Metric: minutes-elapsed vs response_due_minute on a single defect.
          Comparison is STRICT > (not >=): adjusted_now ==
          response_due_minute is NOT a breach; adjusted_now ==
          response_due_minute + 1 IS a breach. Reachable through
          POST /_sweep/sla-escalation.
        test_recipe:
          setup:
            - "Create Project, TeamMembers, Module, Defect D (severity=CRITICAL, business_impact=REVENUE_BLOCKING) at clock=0"
            - "Compute: priority_score=120, multiplier=1.0, response_due_minute = 0 + ceil(60*1.0) = 60"
            - "Do NOT assign (so that priority 1 escalation condition 'status IN {NEW, ASSIGNED}' remains true)"
          trigger:
            - "POST /_clock/advance {minutes: 60}  → project.clock_minute = 60"
            - "POST /_sweep/sla-escalation {project_id}  → reading_1"
            - "POST /_clock/advance {minutes: 1}  → project.clock_minute = 61"
            - "POST /_sweep/sla-escalation {project_id}  → reading_2"
          assert:
            - "After reading_1 at clock=60: defect.escalation_level == 0  (60 > 60 is FALSE, so no breach)"
            - "After reading_2 at clock=61: defect.escalation_level == 1  (61 > 60 is TRUE — strict greater-than crosses the boundary)"
            - "The single-minute precision proves the comparison is strict >, not >="

      - name: reopen_rate_empty_set_returns_zero
        grounds:
          - calculations.reopen_rate
          - entities.Module.fields.id
        distinguishing_aspect: |
          Metric: ratio over an empty collection. Different from instance 1
          (numeric > on time vs empty-set semantics on a collection). Reachable
          through GET /statistics/reopen-rate. When the eligible set (Closed
          defects in window for module M) is empty, the response MUST be 0.0,
          NOT an error and NOT undefined/null.
        test_recipe:
          setup:
            - "Create Project, Module M_empty (no defects ever created against it)"
          trigger:
            - "GET /statistics/reopen-rate?module_id={M_empty}&period_start=0&period_end=10000"
          assert:
            - "Response status code == 200"
            - "Response body data.reopen_rate == 0.0"
            - "No error fired despite empty eligible set"

  # ---------------------------------------------------------------------------
  # Rule 7: cross_entity_state_dependency (≥ 2 different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: defect_submit_fix_requires_module_active
        grounds:
          - state_machines.Defect.IN_PROGRESS_to_FIXED
          - state_machines.Module.ACTIVE_to_ARCHIVED
          - entities.Module.fields.status
          - errors.ERR_MODULE_ARCHIVED
        distinguishing_aspect: |
          Entity pair: Defect ↔ Module. Defect's IN_PROGRESS → FIXED transition
          is gated by Module.status == ACTIVE. If the module is ARCHIVED while
          the defect is IN_PROGRESS (somehow — via cascade fault path), the
          submit-fix call must fail.
        test_recipe:
          setup:
            - "Create Project, TeamMembers (Triage, Dev1), Module M1 with initial_defect_quota=1, Defect D against M1, assign to Dev1, start-progress (defect.status=IN_PROGRESS)"
            - "Close D first (drive through fix+verify+close) — that frees the quota. Wait, we need an IN_PROGRESS defect on an ARCHIVED module. The setup requires: create D and ALSO create another defect D2 that will be the one we close before archive. Simpler: skip the quota dance — create M1 with quota=5, create D, leave it IN_PROGRESS. Then archive M1 — which will FAIL because D is active. So we test the precondition by attempting to archive while D is active: ERR_MODULE_HAS_ACTIVE_DEFECTS."
            - "Final setup: create D, assign, start-progress. Module is still ACTIVE because we cannot archive it."
          trigger:
            - "POST /projects/{p}/modules/{M1}/archive  → expect 409 ERR_MODULE_HAS_ACTIVE_DEFECTS (this is the cross-entity dependency: Module's transition gated by Defect's state)"
          assert:
            - "Response status code == 409"
            - "Response error_id == ERR_MODULE_HAS_ACTIVE_DEFECTS"
            - "Module.status remains ACTIVE"
            - "Defect.status remains IN_PROGRESS"
            - "This proves Module's state transition (ACTIVE → ARCHIVED) depends on cross-entity state of every Defect with module_id = M1"

      - name: severity_override_approve_requires_defect_open
        grounds:
          - state_machines.SeverityOverride.PENDING_to_APPROVED
          - entities.Defect.fields.status
          - errors.ERR_DEFECT_CLOSED
        distinguishing_aspect: |
          Entity pair: SeverityOverride ↔ Defect (DIFFERENT pair from instance
          1's Defect↔Module). SeverityOverride's PENDING → APPROVED transition
          is gated by parent Defect.status != CLOSED.
        test_recipe:
          setup:
            - "Create Project, TeamMembers (Triage1, Dev1), Module, Defect D"
            - "Create SeverityOverride O against D (requested_by=Dev1, requested_severity=BLOCKER, defect's current severity=MAJOR)"
            - "Drive D through full lifecycle to CLOSED (assign→start→fix→verify(PASSED)→close)"
          trigger:
            - "POST /severity-overrides/{O}/approve  (acting Triage1)"
          assert:
            - "Response status code == 409"
            - "Response error_id == ERR_DEFECT_CLOSED"
            - "O.status remains PENDING"
            - "Defect.effective_severity remains MAJOR (no cascade fired)"
            - "Proves SeverityOverride's transition depends on cross-entity state of its parent Defect"

  # ---------------------------------------------------------------------------
  # Rule 8: resource_temporal_overlap (≥ 2, different interval semantics, different resources)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: sla_pause_no_adjacent_pauses_on_defect
        grounds:
          - state_machines.Defect.RUNNING_to_PAUSED
          - state_machines.Defect.PAUSED_to_RUNNING
          - validations[priority=14]
          - entities.SLAPause.fields.started_at_minute
          - entities.SLAPause.fields.ended_at_minute
          - errors.ERR_SLA_PAUSE_ADJACENT
        distinguishing_aspect: |
          Resource: Defect (per-defect SLAPause stream). Interval semantics:
          half-open [start, end) with STRICT separation (adjacency at
          ended_at_minute is DISALLOWED — a new pause may not start at exactly
          the previous pause's ended_at_minute). Different resource and
          different interval semantics from instance 2.
        test_recipe:
          setup:
            - "Create Project, TeamMembers (Triage, Dev1), Module, Defect D, assign Dev1, start-progress"
            - "Project.clock_minute = 0"
          trigger:
            - "POST /defects/{D}/pause-sla {reason: WAITING_ON_REPORTER}  → SLAPause P1 with started_at_minute=0"
            - "POST /_clock/advance {minutes: 10}  → clock=10"
            - "POST /defects/{D}/resume-sla  → P1.ended_at_minute=10, sla_state=RUNNING"
            - "POST /defects/{D}/pause-sla {reason: WAITING_ON_REPORTER}  (without advancing clock — clock still 10)"
          assert:
            - "First pause+resume sequence: 201/200 OK"
            - "Second pause attempt at clock=10 == previous P1.ended_at_minute → 409 ERR_SLA_PAUSE_ADJACENT"
            - "POST /_clock/advance {minutes: 1} then retry POST /defects/{D}/pause-sla → 200 OK (clock 11 > 10)"

      - name: regression_run_cooldown_with_inclusive_buffer_on_module
        grounds:
          - state_machines.RegressionRun.QUEUED_to_RUNNING
          - validations[priority=15]
          - entities.RegressionRun.fields.started_at_minute
          - entities.Module.fields.id
          - errors.ERR_REGRESSION_COOLDOWN_ACTIVE
        distinguishing_aspect: |
          Resource: Module (per-module regression cooldown). Interval
          semantics: REGRESSION_COOLDOWN_MINUTES buffer between started_at
          values, with INCLUSIVE boundary (project.clock_minute -
          prev.started_at_minute >= REGRESSION_COOLDOWN_MINUTES permits the
          new run; strict-greater would forbid it). DIFFERENT resource (Module
          vs Defect) AND different interval semantics (closed buffer ≥ N vs
          strict separation > 0) from instance 1.
        test_recipe:
          setup:
            - "Create Project, TeamMembers (Triage, Dev1, QA1, Rel1), Module M1, Defect D1 driven to FIXED"
            - "REGRESSION_COOLDOWN_MINUTES = 10 (pinned constant — to be specified in PRD; for this test recipe we assume the implementation reads it as 10 from constants)"
            - "POST /defects/{D1}/regression-runs → R1 created with started_at_minute=0; POST /regression-runs/{R1}/start at clock=0"
          trigger:
            - "POST /_clock/advance {minutes: 9}  → clock=9"
            - "POST /defects/{D1}/regression-runs (create R2); POST /regression-runs/{R2}/start  → expect failure"
            - "POST /_clock/advance {minutes: 1}  → clock=10"
            - "POST /defects/{D1}/regression-runs (create R3); POST /regression-runs/{R3}/start  → expect success"
          assert:
            - "Attempt at clock=9 (9 - 0 = 9 < 10 cooldown) → 409 ERR_REGRESSION_COOLDOWN_ACTIVE"
            - "Attempt at clock=10 (10 - 0 = 10 >= 10) → 200 OK (boundary is INCLUSIVE)"
            - "This proves the inclusive ≥ semantics vs instance 1's strict > semantics, on a different resource (Module vs Defect)"

  # ---------------------------------------------------------------------------
  # Rule 9: compensating_invariant (≥ 2 different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: sla_pause_resume_conserves_elapsed_time
        grounds:
          - state_machines.Defect.RUNNING_to_PAUSED
          - state_machines.Defect.PAUSED_to_RUNNING
          - entities.Defect.fields.total_paused_minutes
          - entities.SLAPause.fields.started_at_minute
          - entities.SLAPause.fields.ended_at_minute
        distinguishing_aspect: |
          Conserved quantity: ELAPSED TIME (minutes). Invariant pinned as
          explicit formula: total_paused_minutes + active_running_minutes ==
          project.clock_minute - defect.report_clock_minute. For every
          pause/resume cycle, the sum on the LHS must equal the elapsed wall
          time on the RHS. Time is a different KIND of conserved quantity from
          instance 2's COUNT.
        test_recipe:
          setup:
            - "Create Project (clock=0), TeamMembers (Triage, Dev1), Module, Defect D reported at clock=0, assign Dev1, start-progress at clock=0"
          trigger:
            - "POST /_clock/advance {minutes: 5}  → clock=5"
            - "POST /defects/{D}/pause-sla {reason: WAITING_ON_REPORTER}  (started_at_minute=5)"
            - "POST /_clock/advance {minutes: 7}  → clock=12"
            - "POST /defects/{D}/resume-sla  (ended_at_minute=12; pause lasted 7 min)"
            - "POST /_clock/advance {minutes: 3}  → clock=15"
            - "POST /defects/{D}/pause-sla  (started_at_minute=15)"
            - "POST /_clock/advance {minutes: 4}  → clock=19"
            - "POST /defects/{D}/resume-sla  (ended_at_minute=19; pause lasted 4 min)"
          assert:
            - "After full sequence: defect.total_paused_minutes == 7 + 4 == 11"
            - "Elapsed wall time = project.clock_minute - defect.report_clock_minute = 19 - 0 = 19"
            - "active_running_minutes = elapsed - total_paused_minutes = 19 - 11 = 8"
            - "Invariant holds: total_paused_minutes (11) + active_running_minutes (8) == elapsed (19)"
            - "Drift check: if any pause/resume cycle had been counted twice or skipped, the LHS would diverge from the RHS"

      - name: module_quota_invariant_on_create_close_cycle
        grounds:
          - state_machines.Defect.VERIFIED_to_CLOSED
          - entities.Module.fields.initial_defect_quota
          - entities.Module.fields.active_defect_count
          - entities.Module.fields.quota_remaining
        distinguishing_aspect: |
          Conserved quantity: COUNT (Module.initial_defect_quota). Invariant
          pinned as explicit formula: Module.initial_defect_quota ==
          Module.quota_remaining + Module.active_defect_count, at all times.
          For every defect creation (active_defect_count++, quota_remaining--)
          and every defect closure (active_defect_count--, quota_remaining++),
          the sum on the RHS must equal initial_defect_quota on the LHS. COUNT
          is a different KIND of conserved quantity from instance 1's TIME.
        test_recipe:
          setup:
            - "Create Project, TeamMembers (Triage, Dev1, QA1), Module M with initial_defect_quota=3"
          trigger:
            - "Create Defect D1 → expect M.active_defect_count=1, M.quota_remaining=2"
            - "Create Defect D2 → expect M.active_defect_count=2, M.quota_remaining=1"
            - "Drive D1 through full lifecycle to CLOSED → expect M.active_defect_count=1, M.quota_remaining=2"
            - "Create Defect D3 → expect M.active_defect_count=2, M.quota_remaining=1"
            - "Drive D2 and D3 to CLOSED → expect M.active_defect_count=0, M.quota_remaining=3"
          assert:
            - "After each create: M.initial_defect_quota (3) == M.quota_remaining + M.active_defect_count"
            - "After each close: M.initial_defect_quota (3) == M.quota_remaining + M.active_defect_count"
            - "Final state: active_defect_count == 0, quota_remaining == 3, invariant holds: 3 == 3 + 0"
            - "Drift check: if any create/close had failed to compensate (e.g., create incremented active but failed to decrement remaining), the invariant would break"
