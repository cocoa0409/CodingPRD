          trigger: "POST /night-audit/allowances/${alw_cascade_id}/approve with approved_amount 60.00 as NightAuditor (X-User-ID u_na_2)."
          assert:
            - "Hop 1 - the trigger response returns status == POSTED and approved_amount == 60.00; the allowance passed through APPROVED inside the same request."
            - "Hop 2 - GET /night-audit/journal-postings?allowance_id=${alw_cascade_id} returns exactly one row with charge_type == ALLOWANCE, amount == -60.00 and source_channel == ALLOWANCE_WORKFLOW."
            - "Hop 3a - GET /night-audit/folios/${folio_c_id} returns charges_total_amount == 217.75, credits_total_amount == -60.00, balance_amount == 157.75 (200.00 + 17.75 - 60.00) and settlement_status == PARTIALLY_SETTLED."
            - "Hop 3b - GET /night-audit/business-dates/${bd1_id} returns allowance_credit_amount == -60.00, room_night_revenue_amount == 140.00, room_revenue_amount == 140.00, tax_revenue_amount == 17.75, total_revenue_amount == 157.75, adr_amount == 140.00 (140.00 / 1 occupied room) and revpar_amount == 1.46 (round(140.00 / 96, 2))."
            - "Hop 3c - rooms_occupied_count is still 1: the allowance nets down the revenue but the ROOM line is not reversed, so occupancy_pct stays 1.04."
            - "Hop 4 - GET /night-audit/revenue-reports/${rpt_two_id} returns status == SUPERSEDED, even though it was DISTRIBUTED before the trigger."
            - "The superseded report's snapshot is frozen: ${rpt_two_id} still reports room_revenue_amount == 200.00, adr_amount == 200.00 and pace_index_pct == 50.00, not the post-allowance figures."
            - "GET /night-audit/revenue-reports/${rpt_one_id} is still SUPERSEDED and was not touched twice."
            - "An implementation that stops the cascade at hop 3 leaves ${rpt_two_id} DISTRIBUTED and fails; one that recomputes the snapshot instead of freezing it also fails."

      - name: card_decline_cascades_three_hops_to_block_the_daily_balance
        grounds: "§1.5 POST /night-audit/card-authorizations/{id}/decline side effects; §1.2 CardAuthorization dimensions status and follow_up_status; §1.4 priorities 57, 58 and 59; §1.1 Folio.settlement_hold and BusinessDate.declined_authorization_count."
        distinguishing_aspect: >-
          A shorter three-hop chain whose terminal effect is a *gate* rather than a status flip -
          the count blocks SETTLEMENT_REVIEW -> BALANCED - and the chain is fully reversible
          through the independent follow-up dimension, so the same instance proves the cascade
          unwinds. Contrasts with the four-hop allowance chain, which is money-carrying and
          irreversible without an explicit reversal.
        test_recipe:
          setup: "Standard property; business date 2026-08-01; one CREDIT_CARD folio at rate 200.00 checked in, holding a 500.00 authorization obtained at 2026-08-01T08:00:00.000Z and a 50.00 cash payment applied while the day was still OPEN; the day is then driven to SETTLEMENT_REVIEW; finally the issuer declines the authorization with DO_NOT_HONOR."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00.000Z" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-8001", guest_name: "Lu Wexler", room_number: "801", nights_count: 1, contracted_rate_amount: 200.00, rate_plan_code: "BAR", market_segment: "TRANSIENT", settlement_method: "CREDIT_CARD", scheduled_checkout_at: "2026-08-02T11:00:00.000Z" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_d_id: "$.data.id" }
            - call: "POST /night-audit/folios/${folio_d_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/card-authorizations"
              payload: { folio_id: "${folio_d_id}", obtained_at: "2026-08-01T08:00:00.000Z", authorized_amount: 500.00 }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { auth_d_id: "$.data.id" }
            - call: "POST /night-audit/folios/${folio_d_id}/payments"
              payload: { business_date_id: "${bd1_id}", amount: 50.00, memo: "Cash on account" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/post-room-and-tax"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/seal-charges"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/verify-settlements"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/card-authorizations/${auth_d_id}/decline"
              payload: { decline_code: "DO_NOT_HONOR" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
          trigger: "POST /night-audit/business-dates/${bd1_id}/balance as NightAuditor (X-User-ID u_na_1)."
          assert:
            - "Hop 1 - GET /night-audit/card-authorizations/${auth_d_id} returns status == DECLINED, decline_code == DO_NOT_HONOR and follow_up_status forced from NOT_REQUIRED to PENDING."
            - "Hop 2 - GET /night-audit/folios/${folio_d_id} returns settlement_hold == true; balance_amount is 167.75 (200.00 + 17.75 - 50.00) and is unaffected by the decline."
            - "Hop 3 - GET /night-audit/business-dates/${bd1_id} returns declined_authorization_count == 1."
            - "The trigger fails with HTTP 409 and error code ERR_DECLINED_AUTH_UNRESOLVED (priority 58), and the date's status is still SETTLEMENT_REVIEW with unresolved_settlement_batch_count == 0 and ledger_control_amount == 0.00 - the block comes only from the declined authorization."
            - "A follow-up POST /night-audit/card-authorizations/${auth_d_id}/follow-up with follow_up_action CONTACT as FrontDeskAgent (u_fd_1) returns follow_up_status == CONTACTED while status stays DECLINED, settlement_hold stays true and declined_authorization_count stays 1."
            - "A further POST follow-up with follow_up_action RESOLVE as NightAuditor (u_na_1) succeeds because the folio holds a PAYMENT line (priority 59 satisfied), returns follow_up_status == RESOLVED with status still DECLINED, and unwinds the cascade: settlement_hold back to false and declined_authorization_count back to 0."
            - "Repeating the trigger after RESOLVE now returns 200 with status == BALANCED."
            - "An implementation that resolves the follow-up without the PAYMENT line, or that clears settlement_hold on CONTACT rather than RESOLVE, fails."

  - rule_id: priority_pair_validation_conflict
