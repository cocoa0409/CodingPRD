  - { id: ERR_SLOT_CAPACITY_EXCEEDED, http: 409, condition: "reserved_head + head_count > capacity_head (business_fiscal)" }
  - { id: ERR_NUTRIENT_BUDGET_EXCEEDED, http: 409, condition: "n_applied+n_lbs > n_budget_lbs or p_applied+p_lbs > p_budget_lbs (business_fiscal)" }
  - { id: ERR_LAGOON_INSUFFICIENT, http: 409, condition: "gallons > lagoon_available_gal (business_fiscal)" }
  - { id: ERR_LAGOON_OVER_CAPACITY, http: 409, condition: "lagoon_start_gal > lagoon_capacity_gal at plan creation (business_fiscal)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID on both sides of a segregated pair (quote/approve, approve/pay, record/verify)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: IntegratorAdmin
    description: "Integrator operator with full administrative surface"
    identity: opaque
    exclusive_operations: [create/suspend/reinstate/decommission sites, create/suspend/reinstate/terminate growers, create/activate/terminate/expire contracts, create barns, barn release/mark-oos/return, create/close packer slots, verify/reject truck and barn washes, approve manure plans, approve settlements, pay settlements]
    shared_operations: [read most resources, set clock, approve maintenance tickets]
  - name: FieldTech
    description: "Integrator field representative running placement, feed, marketing, settlement day-to-day"
    identity: opaque
    exclusive_operations: [create/cancel/confirm/close-out/advance-phase pig groups, create/cancel feed orders, book/cancel market loads, quote/reject/start/complete maintenance tickets, approve tickets under 50000 cents, refinalize settlements]
    shared_operations: [read sites/contracts/barns/groups/orders/slots/loads/tickets/settlements]
  - name: Grower
    description: "Contract finisher (barn owner-operator); X-User-ID must equal the Grower entity id"
    identity: "entity_backed:Grower"
    exclusive_operations: [create mortality reports for own groups, record barn washes for own barns, open/cancel maintenance tickets for own barns, dispute own settlements]
    shared_operations: [read own sites/contracts/barns/groups/orders/loads/washes/tickets/settlements]
  - name: FeedMill
    description: "Feed mill scheduler/dispatcher"
    identity: opaque
    exclusive_operations: [schedule feed orders, confirm feed deliveries]
    shared_operations: [read feed orders, read sites]
  - name: TransportCoordinator
    description: "Live-haul coordinator managing truck washes and load dispatch/delivery"
    identity: opaque
    exclusive_operations: [record truck washes, dispatch market loads, record deliveries]
    shared_operations: [read slots/loads/groups/sites/truck washes]
  - name: EnvironmentalManager
    description: "Manure/nutrient compliance manager"
    identity: opaque
    exclusive_operations: [create/submit/revise manure plans, record/confirm/void land applications]
    shared_operations: [read manure plans/applications, read sites]
