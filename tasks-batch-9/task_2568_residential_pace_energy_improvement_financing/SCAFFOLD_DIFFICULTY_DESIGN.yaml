  - rule_id: non_linear_state_machine
    instances:
      - name: application_cure_cycle_then_exhausted_rounds_decline
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_NEEDS_CURE
          - state_machines.Application.NEEDS_CURE_to_UNDER_REVIEW
          - state_machines.Application.UNDER_REVIEW_to_DECLINED
          - entities.Application.fields.cure_round_count
          - entities.Application.fields.decline_reason_code
        distinguishing_aspect: |
          Shape = cycle plus a branching fork on ONE entity (Application): UNDER_REVIEW <-> NEEDS_CURE
          is traversed twice, and on the third CURE the identical trigger and identical payload take
          a different edge to DECLINED because cure_round_count has reached MAX_CURE_ROUNDS 2 — the
          same input therefore produces two different target states depending on loop count.
        test_recipe:
          setup:
            - "Clock 2026-08-12T00:00:00Z; parcel assessed 40000000 with a 25000000 senior lien."
            - "One Application UNDER_REVIEW with two PROPOSED measures (solar 3000000 / 220000, hvac 1200000 / 100000), cure_round_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
