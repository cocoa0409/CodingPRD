          assert:
            - "Insurer.${zero_id}.complaint_ratio_per_1k == 0.00 and risk_tier == UNRATED (no division by zero, no error)"
            - "POST /market-conduct/insurers for ZERO returned 201 (policy_count_in_force 0 is a legal input; only sample_size, population_size, records_requested, milestone_count and target_slot_capacity must be >= 1)"
            - "ZERO AnalysisScore: complaint_ratio_at_scoring == 0.00, complaint_component == 6, financial_component == 6.00, trend_component == 2.00, volume_multiplier == 1.00, composite_score == 14.00"
            - "CEDAR AnalysisScore.composite_score == 34.00 with rank_position 1; ZERO gets rank_position 2"
            - "scored_insurer_count == 2"
            - "select-targets leaves selected_target_count == 0 and slots_available == 2; both score rows carry selection_reason BELOW_THRESHOLD (34.00 and 14.00 are both below MIN_COMPOSITE_SCORE_DEFAULT 40.00)"
            - "MarketAnalysisCycle.${cycle_id}.status == TARGETS_SELECTED (an empty candidate pool is not an error)"

      - name: selection_threshold_at_exact_composite_equality_after_empty_pool
        grounds:
          - calculations.target_selection
          - entities.AnalysisScore.fields.selection_reason
          - endpoints[POST /market-conduct/analysis-cycles/{id}/select-targets]
        distinguishing_aspect: |
          The selector's own threshold boundary, exercised twice on the SAME insurer: with the default
          40.00 the composite 34.00 is below and the candidate pool is empty (0 targets, no error), and
          with an explicit min_composite_score of exactly 34.00 the very same score is selected - so the
