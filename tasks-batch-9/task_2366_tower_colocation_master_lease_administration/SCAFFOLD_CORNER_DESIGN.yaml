            - "ColocationApplication.${id_app_id}.revision_count == 0"
            - "ColocationApplication.${id_app_id}.review_deadline_at == 2026-09-15T00:00:00Z"
            - "Tower.${id_t_id}.open_review_count == 1"

      - name: approve_from_draft_application_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.ColocationApplication.transitions.UNDER_STRUCTURAL_REVIEW_to_APPROVED
          - validations.priority_10
