      - name: corner_second_open_plan_year_rejected
        claim_type: Aggregate validation
        grounds:
          - validations[priority=29]
          - errors.ERR_MULTIPLE_OPEN_PLAN_YEARS
          - state_machines.PlanYear.DRAFT_to_OPEN
        distinguishing_aspect: "Each plan year is individually openable, but the collective invariant \"at most one OPEN PlanYear\" rejects the second DRAFT -> OPEN with 409 ERR_MULTIPLE_OPEN_PLAN_YEARS."
        test_recipe:
          setup:
            - "Two PlanYear rows, 2026 already OPEN and 2027 still DRAFT."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
