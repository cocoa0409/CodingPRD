      - name: settle_of_uncommitted_allocation_rejected
        claim_type: triggerability
        grounds:
          - validations[priority=80]
          - errors.ERR_ALLOCATION_NOT_COMMITTED
        distinguishing_aspect: |
          Settlement is legal only from COMMITTED. A PROPOSED allocation and a REVOKED allocation
          both answer ERR_ALLOCATION_NOT_COMMITTED (409), and the partner's money ledger stays at
          zero: no invoice_total_cents movement, no settlement_amount_cents on the row. An
          implementation that treats settle as an upsert on any live row bills a partner that never
          had a commitment.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; OPEN cycle W37-UNCOMMIT with FG-P and its 2026-09-07 grid."
