  - rule_id: compensating_invariant
    instances:

      - name: kit_void_restores_program_available_cents_exactly
        grounds:
          - state_machines.Kit.ISSUED_to_VOIDED
          - entities.SponsorLedgerEntry.fields.amount_cents
          - entities.SponsorshipProgram.fields.reserved_cents
          - entities.SponsorshipProgram.fields.available_cents
          - endpoints.POST_/sharps/kits/{id}/void
        distinguishing_aspect: |
          The compensated quantity is MONEY, and the invariant is exact reversal through an
          APPEND-ONLY ledger: voiding the kit may not edit or delete the RESERVATION row, it must
          append an equal-and-opposite RESERVATION_RELEASE so the signed amounts sum to zero, the
          running available_after_cents returns to the untouched ceiling, and reserved_cents is 0
          again. An implementation that mutates the original entry, or that recomputes
          available_cents from scratch instead of from the ledger, leaves either a missing row or
          a drifted total.
