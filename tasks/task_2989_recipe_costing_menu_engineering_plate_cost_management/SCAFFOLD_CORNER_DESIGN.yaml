          setup:
            - "Logical clock at 2026-08-10T00:00:00.000Z. GRILL WORLD complete: MI-GRILL-MW ACTIVE in MW at current_price_cents 400, plate_cost_cents 100, plate_cost_state FRESH, target_food_cost_bps 3000 and last_price_change_at null."
