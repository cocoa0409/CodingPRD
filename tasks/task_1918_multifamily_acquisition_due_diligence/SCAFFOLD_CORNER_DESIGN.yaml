  # ===================================================================
  # Section: consistency_model
  # ===================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: a mutation's effects are visible in the very next GET — verified finding cost and the acquisition rollup agree without any delay or recompute call."
        test_recipe:
          setup: ["Acquisition IN_DILIGENCE; unit; COMPLETED inspection with one OPEN finding (COSMETIC sev2, inspector 120000)"]
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Cons Deal", address: "53 Main St", agreed_purchase_price_cents: 1000000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/${acq}/kickoff", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst, captures: { unit: $.data.id } }
            - { call: "POST /acquisitions/inspections", payload: { unit_id: "${unit}", inspector_ref: "insp-1", walk_start: "2026-08-10T09:00:00Z", walk_end: "2026-08-10T10:00:00Z" }, as: PropertyOperationsLead, captures: { insp: $.data.id } }
            - { call: "POST /acquisitions/inspections/${insp}/complete", payload: { condition_rating: 3, no_findings_declared: false }, as: PropertyOperationsLead, as_user_id: "pol-1" }
            - { call: "POST /acquisitions/findings", payload: { inspection_id: "${insp}", category: "COSMETIC", severity: 2, seller_estimate_cents: 100000, inspector_estimate_cents: 120000 }, as: PropertyOperationsLead, captures: { f1: $.data.id } }
          trigger:
            - { call: "POST /acquisitions/findings/${f1}/verify", payload: {}, as: PropertyOperationsLead, captures: { cost: $.data.verified_cost_cents } }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: PropertyOperationsLead, captures: { total: $.data.deferred_maintenance_total_cents, posture: $.data.readiness_posture } }
          assert:
            - "verify response carries verified_cost_cents == 120000 (sev 2 => multiplier 1.00, COSMETIC loading 0)"
            - "The immediately-following GET shows deferred_maintenance_total_cents == 120000 and posture ON_TRACK — no lag, no recompute endpoint"

