          - validations.priority_41
          - errors.ERR_DELIVERY_ATTEMPT_LIMIT
        distinguishing_aspect: >
          A self-loop rather than a backward edge: FAILED -> FAILED is taken twice
          and the state never changes, only attempt_count does. The loop has a
