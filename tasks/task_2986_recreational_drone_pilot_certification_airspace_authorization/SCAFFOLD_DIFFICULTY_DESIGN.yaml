            - "a second flight creation attempt for the same window now fails with ERR_INSURANCE_COVERAGE_INSUFFICIENT (402) rather than being cancelled after the fact"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: launch_state_error_precedes_remote_id_safety_error_and_leaves_module_verified
        grounds:
          - validations.priority_14
          - validations.priority_21
          - state_machines.RemoteIdModule
          - entities.RemoteIdModule.fields.verified_until
          - endpoints.POST_/drone-ops/flights/{id}/launch
        distinguishing_aspect: |
          Category pair: state (priority 14, ERR_PREFLIGHT_NOT_CLEARED, 409) against
          business_safety (priority 21, ERR_REMOTE_ID_EXPIRED, 422). The same launch request
          violates both, and the ordering is observable twice over: the returned error_id and
          http_status are the state ones, and the priority-21 side effect that would move the
          module VERIFIED -> EXPIRED never runs.
        test_recipe:
          setup:
            - "One COMMERCIAL pilot, CERTIFIED at 2026-08-05T00:00:00Z."
            - "One 900 g airframe (so remote_id_required is true) with one RemoteIdModule VERIFIED at 2026-08-05T00:00:00Z with verified_until 2026-08-15T00:00:00Z; the airframe was REGISTERED while that verification was live."
            - "One uncontrolled class G zone, class_ceiling_ft 400."
            - "Logical clock advanced to 2026-08-16T00:00:00Z, so the module verification is now stale."
            - "One RECREATIONAL-category flight for 2026-08-16T10:00:00Z .. 2026-08-16T11:00:00Z at 380 ft, still PLANNED - no pre-flight check has ever been run on it."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Ravi Chandra", email: "ravi.chandra@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 86 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Heavy Lift 900", serial_number: "SN-RID-01", takeoff_weight_g: 900, max_altitude_ft: 1000 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/remote-id-modules"
              payload: { module_serial: "RID-0001", broadcast_protocol: "BLUETOOTH_5", firmware_version: "2.4.1" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { mid: $.data.id }
            - call: "POST /drone-ops/remote-id-modules/${mid}/submit-verification"
              payload: { broadcast_sample_ref: "sample-rid-0001-a" }
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/remote-id-modules/${mid}/verify"
              payload: { outcome: "VERIFIED", verified_until: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-G-RID", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { zid: $.data.id }
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "RECREATIONAL", planned_start: "2026-08-16T10:00:00Z", planned_end: "2026-08-16T11:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 47.64, launch_longitude: -122.38 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { fid: $.data.id }
          trigger:
            - call: "POST /drone-ops/flights/${fid}/launch"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == \"ERR_PREFLIGHT_NOT_CLEARED\" with HTTP 409, not \"ERR_REMOTE_ID_EXPIRED\" with HTTP 422"
            - "RemoteIdModule.${mid}.status is still \"VERIFIED\" with verified_until \"2026-08-15T00:00:00Z\" - the priority-21 lazy expiry side effect did not run because the request stopped at priority 14"
            - "Flight.${fid}.status is still \"PLANNED\" with actual_start null"
            - "GET /drone-ops/flights/${fid}/preflight-checks returns an empty list - a rejected launch creates no check record"
            - "Aircraft.${acid}.remote_id_required == true and registration_status is still \"REGISTERED\""
            - "reversing the two rules would return 422 ERR_REMOTE_ID_EXPIRED and would also leave the module in \"EXPIRED\", so the two orderings are distinguishable from state alone"

      - name: authorization_currency_safety_error_precedes_insurance_fiscal_error
        grounds:
          - validations.priority_17
          - validations.priority_35
          - state_machines.Pilot
          - state_machines.InsurancePolicy
          - endpoints.POST_/drone-ops/airspace-authorizations
        distinguishing_aspect: |
          A different category pair from the launch instance: business_safety (priority 17,
          ERR_PILOT_CURRENCY_LAPSED, 409) against business_fiscal (priority 35,
          ERR_INSURANCE_NOT_ACTIVE, 402). Both are violated by one authorization request, and
          the safety rule's own documented side effect - demoting the CERTIFIED pilot to LAPSED -
          is what proves which rule ran.
        test_recipe:
          setup:
            - "One COMMERCIAL pilot CERTIFIED at 2026-02-01T00:00:00Z with no completed flights, so currency_expires_at is 2026-05-02T00:00:00Z."
            - "One REGISTERED 249 g airframe with max_altitude_ft 900."
            - "One InsurancePolicy left in PENDING_VERIFICATION (never verified), so the pilot has no ACTIVE policy at all."
            - "One class D zone with class_ceiling_ft 700, requires_authorization true, max_concurrent_authorizations 2."
            - "Logical clock advanced to 2026-05-03T00:00:00Z, one day past the currency expiry."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Sofia Duarte", email: "sofia.duarte@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 77 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Mapper 2", serial_number: "SN-PRI-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/insurance-policies"
              payload: { pilot_id: "${pid}", insurer_name: "Aerial Indemnity", policy_number: "POL-PRI-01", coverage_limit_cents: 5000000, deductible_cents: 50000, effective_from: "2026-02-01T00:00:00Z", effective_until: "2027-02-01T00:00:00Z", indemnification_clause_accepted: true }
              as: Pilot
              as_user_id: "${pid}"
              captures: { polid: $.data.id }
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-D-PRI", class_code: "D", class_ceiling_ft: 700, requires_authorization: true, max_concurrent_authorizations: 2, structure_relief_eligible: false }
              as: AirspaceAuthority
              captures: { zid: $.data.id }
            - call: "GET /drone-ops/airspace-zones/${zid}"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { zv: $.data.version }
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /drone-ops/airspace-authorizations"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", requested_ceiling_ft: 400, window_start: "2026-05-10T09:00:00Z", window_end: "2026-05-10T11:00:00Z", expected_zone_version: "${zv}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == \"ERR_PILOT_CURRENCY_LAPSED\" with HTTP 409, not \"ERR_INSURANCE_NOT_ACTIVE\" with HTTP 402"
            - "Pilot.${pid}.status == \"LAPSED\" - priority 17 demotes a CERTIFIED pilot found lapsed, and that write survives the rejection of the request"
            - "InsurancePolicy.${polid}.coverage_status is still \"PENDING_VERIFICATION\" - the fiscal rule never evaluated, so nothing about the policy changed"
            - "no AirspaceAuthorization row exists for pilot ${pid}: GET /drone-ops/airspace-authorizations filtered by pilot_id returns an empty list"
            - "AirspaceZone.${zid}.reserved_slot_count == 0 and AirspaceZone.${zid}.version is unchanged from ${zv}"
            - "repeating the identical request now returns ERR_PILOT_NOT_CERTIFIED (409, priority 16) because the pilot is already LAPSED - the fiscal rule is still not reached"

  - rule_id: boundary_precision_check
    instances:
      - name: remote_id_weight_threshold_250_grams_exempt_251_grams_requires_module
        grounds:
          - calculations.aircraft_remote_id_requirement
          - entities.Aircraft.fields.remote_id_required
          - validations.priority_20
          - endpoints.POST_/drone-ops/aircraft/{id}/register
        distinguishing_aspect: |
          Metric: takeoff mass in grams against REMOTE_ID_WEIGHT_THRESHOLD_G 250, exercised on POST /drone-ops/aircraft/{id}/register. Three airframes at 249, 250 and
          251 g separate a strict > from a >=: the 250 g airframe registers with no RemoteIdModule
          row at all, the 251 g airframe cannot.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "One COMMERCIAL pilot, CERTIFIED."
            - "Three aircraft owned by that pilot with takeoff_weight_g 249, 250 and 251, none of them carrying any RemoteIdModule."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Ada Kroft", email: "ada.kroft@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 82 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Nano 249", serial_number: "SN-W-249", takeoff_weight_g: 249, max_altitude_ft: 400 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { ac249: $.data.id, req249: $.data.remote_id_required }
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Nano 250", serial_number: "SN-W-250", takeoff_weight_g: 250, max_altitude_ft: 400 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { ac250: $.data.id, req250: $.data.remote_id_required }
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Nano 251", serial_number: "SN-W-251", takeoff_weight_g: 251, max_altitude_ft: 400 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { ac251: $.data.id, req251: $.data.remote_id_required }
          trigger:
            - call: "POST /drone-ops/aircraft/${ac249}/register"
              payload: {}
              as: ComplianceOfficer
              captures: { s249: $.data.registration_status }
            - call: "POST /drone-ops/aircraft/${ac250}/register"
              payload: {}
              as: ComplianceOfficer
              captures: { s250: $.data.registration_status }
            - call: "POST /drone-ops/aircraft/${ac251}/register"
              payload: {}
              as: ComplianceOfficer
              captures: { err251: $.data.error_id }
          assert:
            - "${req249} == false and ${req250} == false - the comparison is strictly greater than 250, so exactly the threshold is exempt"
            - "${req251} == true"
            - "${s249} == \"REGISTERED\" and ${s250} == \"REGISTERED\", each with a registration_number assigned, with no RemoteIdModule row in existence"
            - "${err251} == \"ERR_REMOTE_ID_NOT_VERIFIED\" with HTTP 422, and Aircraft.${ac251}.registration_status is still \"PENDING_REGISTRATION\""
            - "an implementation using >= 250 would reject the 250 g airframe as well; one using > 251 would register the 251 g airframe"

      - name: flight_summary_window_bounds_inclusive_start_exclusive_end_and_empty_set_zeros
        grounds:
          - calculations.flight_log_compliance_summary
          - endpoints.GET_/drone-ops/pilots/{id}/flight-summary
          - entities.Flight.fields.logged_minutes
          - entities.Flight.fields.actual_end
        distinguishing_aspect: |
          A different metric on a different endpoint: window membership of a COMPLETED flight
          keyed on actual_end, read through GET /drone-ops/pilots/{id}/flight-summary. One flight
          with actual_end exactly 2026-08-10T10:00:00Z is inside a window that starts at that
          instant and outside a window that ends at it, and the excluding window must return the
          pinned empty-set shape - every count 0, max_altitude_reached_ft 0 and
          average_duration_minutes 0.0, never null and never a division by zero.
        test_recipe:
