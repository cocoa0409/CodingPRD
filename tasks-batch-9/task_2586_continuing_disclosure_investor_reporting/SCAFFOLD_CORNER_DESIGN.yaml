            - "${final_status} == REJECTED, ${final_attempts} == 3, ${final_reject} == \"Repository outage.\" — the refused attempt changed nothing"
            - "${final_cycle} == READY_TO_FILE — the last reject cascade returned the cycle to fileable and the refused resubmit did not re-arm it"

