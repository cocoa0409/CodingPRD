# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task: Certification Examination, Recertification & State Licensure Linkage
# Every instance is self-contained (empty-DB -> setup -> trigger -> assert).
# Standard certified-candidate chain (replayed per instance with prefixed vars):
#   level(EMT,cut 0.66) -> candidate -> program(dir-1) -> completion(2026-09-01)
#   -> VERIFIED -> exam application -> APPROVED (mints ATT) -> schedule
#   -> deliver 8/8 correct (b=0.5) at clock 2026-09-03T12:00Z -> SCORED_PASS
#   -> STATE psychomotor(exam 2026-09-03, 2 stations passed, docs) -> VERIFIED
#   -> issue at clock 2026-09-04T00:00Z -> Certification ACTIVE,
#      expires_on 2028-09-04T00:00:00Z, version 1
# =============================================================================

scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains: CognitiveExamAttempt
  # vs RecertApplication)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cat_provisional_pass_final_fail_divergence
        grounds:
          - calculations.cat_adaptive_scoring
          - entities.CognitiveExamAttempt.fields.provisional_outcome
          - entities.CognitiveExamAttempt.fields.final_outcome
        distinguishing_aspect: |
          On the CognitiveExamAttempt domain, the provisional variant (point
          estimate at MIN_ITEMS) and the final variant (Z-band stopping rule)
          produce DIFFERENT outcomes on identical response data: theta_6 =
          0.8333 >= 0.66 (provisional PASS) but the band never exits and
          UCB_12 = 0.6508 < 0.66 (final FAIL).
        test_recipe:
          setup:
            - "EMT level (cut 0.66), candidate with VERIFIED completion (2026-09-01), APPROVED application, ATT issued; attempt scheduled [2026-09-02, 2026-09-06]; clock at 2026-09-03T12:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/level-definitions"
              payload: { code: "EMT", display_name: "Emergency Medical Technician", scope_summary: "BLS ambulance practice", cognitive_cut_score: 0.66, ce_total_hours: 40, ce_national_min_hours: 20, ce_local_min_hours: 10, ce_individual_min_hours: 10, hourly_model_total_hours: 40, remedial_hours_required: 20, refresher_hours_required: 24, initial_application_fee_cents: 9800, recert_application_fee_cents: 4500 }
              as: RegistryAdmin
              captures: { lv: $.data.id }
            - call: "POST /registry/candidates"
              payload: { full_name: "Dora Diverge", email: "dora@example.com" }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /registry/education-programs"
              payload: { name: "County EMT Academy", level_id: "${lv}", director_user_id: "dir-1" }
              as: RegistryAdmin
              captures: { p: $.data.id }
            - call: "POST /registry/program-completion-records"
              payload: { candidate_id: "${c}", program_id: "${p}", completion_date: "2026-09-01" }
              as: ProgramDirector
              as_user_id: "dir-1"
              captures: { rec: $.data.id }
            - { call: "POST /registry/program-completion-records/${rec}/decision", payload: { outcome: "VERIFIED" }, as: RegistryAdmin }
            - call: "POST /registry/exam-applications"
              payload: { level_id: "${lv}", completion_record_id: "${rec}" }
              as: Candidate
              as_user_id: "${c}"
              captures: { app: $.data.id }
            - call: "POST /registry/exam-applications/${app}/decision"
              payload: { outcome: "APPROVED" }
              as: RegistryAdmin
              captures: { att: $.data.att_id }
            - call: "POST /registry/cognitive-exam-attempts"
              payload: { att_id: "${att}", scheduled_start: "2026-09-02T00:00:00Z", scheduled_end: "2026-09-06T00:00:00Z" }
              as: Candidate
              as_user_id: "${c}"
              captures: { at: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T12:00:00Z" }, as: RegistryAdmin }
          trigger:
            - call: "POST /registry/cognitive-exam-attempts/${at}/responses"
              payload:
                responses:
                  - { item_id: "q1", difficulty_b: 0.5, correct: true }
                  - { item_id: "q2", difficulty_b: 0.5, correct: true }
                  - { item_id: "q3", difficulty_b: 0.5, correct: true }
                  - { item_id: "q4", difficulty_b: 0.5, correct: true }
                  - { item_id: "q5", difficulty_b: 0.5, correct: true }
                  - { item_id: "q6", difficulty_b: 0.5, correct: false }
                  - { item_id: "q7", difficulty_b: 0.5, correct: false }
                  - { item_id: "q8", difficulty_b: 0.5, correct: false }
                  - { item_id: "q9", difficulty_b: 0.5, correct: false }
                  - { item_id: "q10", difficulty_b: 0.5, correct: false }
                  - { item_id: "q11", difficulty_b: 0.5, correct: false }
                  - { item_id: "q12", difficulty_b: 0.5, correct: false }
              as: ExamProctor
              captures: { o_prov: $.data.provisional_outcome, o_final: $.data.final_outcome, o_status: $.data.status, o_items: $.data.items_delivered_count, o_theta: $.data.theta_final }
          assert:
            - "Attempt.${at}.provisional_outcome == PASS  (theta_6 = 5/6 = 0.8333 >= 0.66)"
            - "Attempt.${at}.final_outcome == FAIL  (no band exit k=6..11; UCB_12 = 0.6508 < 0.66)"
            - "Attempt.${at}.status == SCORED_FAIL"
            - "Attempt.${at}.items_delivered_count == 12"
            - "Attempt.${at}.theta_final == 0.4167"
            - "provisional_outcome != final_outcome on identical response data"

      - name: ce_nccp_rejects_hourly_accepts_same_entries
        grounds:
          - calculations.ce_credit_waterfall
          - entities.RecertApplication.fields.model
        distinguishing_aspect: |
          On the RecertApplication/CE domain (different entity domain from the
          CAT instance above), identical CE entries (NATIONAL 35 in-person,
          LOCAL 5, INDIVIDUAL 0; total 40) PASS the HOURLY variant (flat total
          >= 40) but FAIL the NCCP variant (LOCAL credited 5 < 10 — spill flows
          into INDIVIDUAL only, never into LOCAL).
        test_recipe:
          setup:
            - "Two candidates A and B, each with an ACTIVE EMT certification issued 2026-09-04T00:00:00Z (expires 2028-09-04); clock at 2027-10-15T00:00:00Z (inside both recert windows); both draft recert applications carry the same three entries"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/level-definitions"
              payload: { code: "EMT", display_name: "Emergency Medical Technician", scope_summary: "BLS ambulance practice", cognitive_cut_score: 0.66, ce_total_hours: 40, ce_national_min_hours: 20, ce_local_min_hours: 10, ce_individual_min_hours: 10, hourly_model_total_hours: 40, remedial_hours_required: 20, refresher_hours_required: 24, initial_application_fee_cents: 9800, recert_application_fee_cents: 4500 }
              as: RegistryAdmin
              captures: { lv: $.data.id }
            - call: "POST /registry/education-programs"
              payload: { name: "County EMT Academy", level_id: "${lv}", director_user_id: "dir-1" }
              as: RegistryAdmin
              captures: { p: $.data.id }
            # --- candidate A: everything up to scheduling ---
            - call: "POST /registry/candidates"
              payload: { full_name: "Ann Hourly", email: "ann@example.com" }
              as: Anonymous
              captures: { ca: $.data.id }
            - call: "POST /registry/program-completion-records"
              payload: { candidate_id: "${ca}", program_id: "${p}", completion_date: "2026-09-01" }
              as: ProgramDirector
              as_user_id: "dir-1"
              captures: { reca: $.data.id }
            - { call: "POST /registry/program-completion-records/${reca}/decision", payload: { outcome: "VERIFIED" }, as: RegistryAdmin }
            - call: "POST /registry/exam-applications"
              payload: { level_id: "${lv}", completion_record_id: "${reca}" }
              as: Candidate
              as_user_id: "${ca}"
              captures: { appa: $.data.id }
            - call: "POST /registry/exam-applications/${appa}/decision"
              payload: { outcome: "APPROVED" }
              as: RegistryAdmin
              captures: { atta: $.data.att_id }
            - call: "POST /registry/cognitive-exam-attempts"
              payload: { att_id: "${atta}", scheduled_start: "2026-09-02T00:00:00Z", scheduled_end: "2026-09-06T00:00:00Z" }
              as: Candidate
              as_user_id: "${ca}"
              captures: { ata: $.data.id }
            # --- candidate B: everything up to scheduling ---
            - call: "POST /registry/candidates"
              payload: { full_name: "Bob Nccp", email: "bob@example.com" }
              as: Anonymous
              captures: { cb: $.data.id }
            - call: "POST /registry/program-completion-records"
              payload: { candidate_id: "${cb}", program_id: "${p}", completion_date: "2026-09-01" }
              as: ProgramDirector
              as_user_id: "dir-1"
              captures: { recb: $.data.id }
            - { call: "POST /registry/program-completion-records/${recb}/decision", payload: { outcome: "VERIFIED" }, as: RegistryAdmin }
            - call: "POST /registry/exam-applications"
              payload: { level_id: "${lv}", completion_record_id: "${recb}" }
              as: Candidate
              as_user_id: "${cb}"
              captures: { appb: $.data.id }
            - call: "POST /registry/exam-applications/${appb}/decision"
              payload: { outcome: "APPROVED" }
              as: RegistryAdmin
              captures: { attb: $.data.att_id }
            - call: "POST /registry/cognitive-exam-attempts"
              payload: { att_id: "${attb}", scheduled_start: "2026-09-02T00:00:00Z", scheduled_end: "2026-09-06T00:00:00Z" }
              as: Candidate
              as_user_id: "${cb}"
              captures: { atb: $.data.id }
            # --- both deliver inside their windows at one clock ---
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T12:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/cognitive-exam-attempts/${ata}/responses"
              payload: { responses: [ { item_id: "a1", difficulty_b: 0.5, correct: true }, { item_id: "a2", difficulty_b: 0.5, correct: true }, { item_id: "a3", difficulty_b: 0.5, correct: true }, { item_id: "a4", difficulty_b: 0.5, correct: true }, { item_id: "a5", difficulty_b: 0.5, correct: true }, { item_id: "a6", difficulty_b: 0.5, correct: true }, { item_id: "a7", difficulty_b: 0.5, correct: true }, { item_id: "a8", difficulty_b: 0.5, correct: true } ] }
              as: ExamProctor
            - call: "POST /registry/cognitive-exam-attempts/${atb}/responses"
              payload: { responses: [ { item_id: "b1", difficulty_b: 0.5, correct: true }, { item_id: "b2", difficulty_b: 0.5, correct: true }, { item_id: "b3", difficulty_b: 0.5, correct: true }, { item_id: "b4", difficulty_b: 0.5, correct: true }, { item_id: "b5", difficulty_b: 0.5, correct: true }, { item_id: "b6", difficulty_b: 0.5, correct: true }, { item_id: "b7", difficulty_b: 0.5, correct: true }, { item_id: "b8", difficulty_b: 0.5, correct: true } ] }
              as: ExamProctor
            - call: "POST /registry/psychomotor-verifications"
              payload: { candidate_id: "${ca}", level_id: "${lv}", administered_by: "STATE", completion_record_id: "${reca}", exam_date: "2026-09-03", stations: [ { station_code: "AIRWAY", passed: true }, { station_code: "TRAUMA", passed: true } ], documentation_attached: true }
              as: StateOfficial
              as_user_id: "so-1"
              captures: { psya: $.data.id }
            - { call: "POST /registry/psychomotor-verifications/${psya}/decision", payload: { outcome: "VERIFIED" }, as: RegistryAdmin }
            - call: "POST /registry/psychomotor-verifications"
              payload: { candidate_id: "${cb}", level_id: "${lv}", administered_by: "STATE", completion_record_id: "${recb}", exam_date: "2026-09-03", stations: [ { station_code: "AIRWAY", passed: true }, { station_code: "TRAUMA", passed: true } ], documentation_attached: true }
              as: StateOfficial
              as_user_id: "so-1"
              captures: { psyb: $.data.id }
            - { call: "POST /registry/psychomotor-verifications/${psyb}/decision", payload: { outcome: "VERIFIED" }, as: RegistryAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-04T00:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/certifications/issue"
              payload: { candidate_id: "${ca}", level_id: "${lv}", exam_application_id: "${appa}", attempt_id: "${ata}", psychomotor_id: "${psya}" }
              as: RegistryAdmin
              captures: { certa: $.data.id, cva: $.data.version }
            - call: "POST /registry/certifications/issue"
              payload: { candidate_id: "${cb}", level_id: "${lv}", exam_application_id: "${appb}", attempt_id: "${atb}", psychomotor_id: "${psyb}" }
              as: RegistryAdmin
              captures: { certb: $.data.id, cvb: $.data.version }
            # --- both drafts with identical entries ---
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-10-15T00:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/recert-applications"
              payload: { certification_id: "${certa}", model: "HOURLY", expected_certification_version: "${cva}" }
              as: Candidate
              as_user_id: "${ca}"
              captures: { rca: $.data.id }
            - call: "POST /registry/recert-applications/${rca}/ce-entries"
              payload: { component: "NATIONAL", hours: 17.5, delivery_method: "IN_PERSON", course_code: "N1", course_date: "2027-10-01", provider_name: "AlphaCE" }
              as: Candidate
              as_user_id: "${ca}"
            - call: "POST /registry/recert-applications/${rca}/ce-entries"
              payload: { component: "NATIONAL", hours: 17.5, delivery_method: "IN_PERSON", course_code: "N2", course_date: "2027-10-02", provider_name: "BetaCE" }
              as: Candidate
              as_user_id: "${ca}"
            - call: "POST /registry/recert-applications/${rca}/ce-entries"
              payload: { component: "LOCAL", hours: 5, delivery_method: "IN_PERSON", course_code: "L1", course_date: "2027-10-03", provider_name: "GammaCE" }
              as: Candidate
              as_user_id: "${ca}"
            - call: "POST /registry/recert-applications"
              payload: { certification_id: "${certb}", model: "NCCP", expected_certification_version: "${cvb}" }
              as: Candidate
              as_user_id: "${cb}"
              captures: { rcb: $.data.id }
            - call: "POST /registry/recert-applications/${rcb}/ce-entries"
              payload: { component: "NATIONAL", hours: 17.5, delivery_method: "IN_PERSON", course_code: "N1", course_date: "2027-10-01", provider_name: "AlphaCE" }
              as: Candidate
              as_user_id: "${cb}"
            - call: "POST /registry/recert-applications/${rcb}/ce-entries"
              payload: { component: "NATIONAL", hours: 17.5, delivery_method: "IN_PERSON", course_code: "N2", course_date: "2027-10-02", provider_name: "BetaCE" }
              as: Candidate
              as_user_id: "${cb}"
            - call: "POST /registry/recert-applications/${rcb}/ce-entries"
              payload: { component: "LOCAL", hours: 5, delivery_method: "IN_PERSON", course_code: "L1", course_date: "2027-10-03", provider_name: "GammaCE" }
              as: Candidate
              as_user_id: "${cb}"
          trigger:
            - call: "POST /registry/recert-applications/${rca}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${ca}"
              captures: { sta: $.data.status, tota: $.data.total_credited_hours }
            - call: "POST /registry/recert-applications/${rcb}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${cb}"
              captures: { errb: $.data.error_id }
          assert:
            - "RecertApplication.${rca} (HOURLY) submit succeeds: status == SUBMITTED"
            - "RecertApplication.${rca}.total_credited_hours == 40 (credited_total = min(0 distributed, 20) + 40 in-person)"
            - "RecertApplication.${rcb} (NCCP) submit fails: error_id == ERR_CE_COMPONENT_SHORTFALL (local_credited 5 < 10; national spill feeds INDIVIDUAL only)"
            - "RecertApplication.${rcb}.status remains DRAFT"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (three different modes: (b) rounding order,
  # (c) circular-looking evaluation order, (a) multi-input nested min/max)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: licensure_fee_per_line_rounding_beats_sum_rounding
        grounds:
          - calculations.licensure_fee_assessment
          - entities.LicenseApplication.fields.registry_share_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the contract rounds EACH fee line at 15%
          then sums (1498.5 -> 1499 twice = 2998); summing first then rounding
          (2997.0 -> 2997) is a different, wrong number — the order is pinned
          and observable on odd-half-cent lines.
        test_recipe:
          setup:
            - "State WA policy: NREMT_ACCEPTED, accepts EMT, base_license_fee_cents 9990, national_verification_surcharge_cents 9990, registry_share_bps default 1500; candidate holds ACTIVE EMT certification (issued 2026-09-04, version 1)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/level-definitions"
              payload: { code: "EMT", display_name: "Emergency Medical Technician", scope_summary: "BLS ambulance practice", cognitive_cut_score: 0.66, ce_total_hours: 40, ce_national_min_hours: 20, ce_local_min_hours: 10, ce_individual_min_hours: 10, hourly_model_total_hours: 40, remedial_hours_required: 20, refresher_hours_required: 24, initial_application_fee_cents: 9800, recert_application_fee_cents: 4500 }
              as: RegistryAdmin
              captures: { lv: $.data.id }
            - call: "POST /registry/state-adoption-policies"
              payload: { state_code: "WA", adoption_mode: "NREMT_ACCEPTED", accepted_level_codes: ["EMT"], base_license_fee_cents: 9990, national_verification_surcharge_cents: 9990 }
              as: RegistryAdmin
              captures: { pol: $.data.id }
            - call: "POST /registry/candidates"
              payload: { full_name: "Fiona Fee", email: "fiona@example.com" }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /registry/education-programs"
              payload: { name: "County EMT Academy", level_id: "${lv}", director_user_id: "dir-1" }
              as: RegistryAdmin
              captures: { p: $.data.id }
            - call: "POST /registry/program-completion-records"
              payload: { candidate_id: "${c}", program_id: "${p}", completion_date: "2026-09-01" }
              as: ProgramDirector
              as_user_id: "dir-1"
              captures: { rec: $.data.id }
            - { call: "POST /registry/program-completion-records/${rec}/decision", payload: { outcome: "VERIFIED" }, as: RegistryAdmin }
            - call: "POST /registry/exam-applications"
              payload: { level_id: "${lv}", completion_record_id: "${rec}" }
              as: Candidate
              as_user_id: "${c}"
              captures: { app: $.data.id }
            - call: "POST /registry/exam-applications/${app}/decision"
              payload: { outcome: "APPROVED" }
              as: RegistryAdmin
              captures: { att: $.data.att_id }
            - call: "POST /registry/cognitive-exam-attempts"
              payload: { att_id: "${att}", scheduled_start: "2026-09-02T00:00:00Z", scheduled_end: "2026-09-06T00:00:00Z" }
              as: Candidate
              as_user_id: "${c}"
              captures: { at: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T12:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/cognitive-exam-attempts/${at}/responses"
              payload: { responses: [ { item_id: "f1", difficulty_b: 0.5, correct: true }, { item_id: "f2", difficulty_b: 0.5, correct: true }, { item_id: "f3", difficulty_b: 0.5, correct: true }, { item_id: "f4", difficulty_b: 0.5, correct: true }, { item_id: "f5", difficulty_b: 0.5, correct: true }, { item_id: "f6", difficulty_b: 0.5, correct: true }, { item_id: "f7", difficulty_b: 0.5, correct: true }, { item_id: "f8", difficulty_b: 0.5, correct: true } ] }
              as: ExamProctor
            - call: "POST /registry/psychomotor-verifications"
              payload: { candidate_id: "${c}", level_id: "${lv}", administered_by: "STATE", completion_record_id: "${rec}", exam_date: "2026-09-03", stations: [ { station_code: "AIRWAY", passed: true } ], documentation_attached: true }
              as: StateOfficial
              as_user_id: "so-1"
              captures: { psy: $.data.id }
            - { call: "POST /registry/psychomotor-verifications/${psy}/decision", payload: { outcome: "VERIFIED" }, as: RegistryAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-04T00:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/certifications/issue"
              payload: { candidate_id: "${c}", level_id: "${lv}", exam_application_id: "${app}", attempt_id: "${at}", psychomotor_id: "${psy}" }
              as: RegistryAdmin
              captures: { cert: $.data.id, cv: $.data.version }
            - call: "POST /registry/license-applications"
              payload: { state_code: "WA", level_id: "${lv}", certification_id: "${cert}", expected_certification_version: "${cv}" }
              as: Candidate
              as_user_id: "${c}"
              captures: { la: $.data.id }
          trigger:
            - call: "POST /registry/license-applications/${la}/decision"
              payload: { outcome: "GRANTED" }
              as: StateOfficial
              as_user_id: "so-9"
              captures: { fee: $.data.assessed_fee_cents, share: $.data.registry_share_cents, lst: $.data.status }
          assert:
            - "LicenseApplication.${la}.status == GRANTED"
            - "LicenseApplication.${la}.assessed_fee_cents == 19980 (9990 base + 9990 surcharge)"
            - "LicenseApplication.${la}.registry_share_cents == 2998 — round_half_up(9990*0.15)=1499 per line, summed; the sum-first variant would yield 2997 and is WRONG"

      - name: recert_extension_anniversary_preserving
        grounds:
          - calculations.certification_expiry_extension
          - entities.RecertApplication.fields.cert_expires_on_at_creation
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the submittability window is
          derived from expires_on, and approval mutates expires_on — the pinned
          evaluation order (window against the creation-time snapshot, then
          expiry = snapshot + 24 months) makes an approval at 2027-10-15 extend
          2028-09-04 to 2030-09-04, NOT to approval_date + 24 = 2029-10-15.
        test_recipe:
          setup:
            - "ACTIVE EMT certification issued 2026-09-04T00:00:00Z, expires_on 2028-09-04T00:00:00Z; clock at 2027-10-15T00:00:00Z (inside window [2027-09-04, 2028-09-04]); NCCP draft with exactly-minimum entries (N 10+10, L 10, I 10, all IN_PERSON, distinct providers)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/level-definitions"
              payload: { code: "EMT", display_name: "Emergency Medical Technician", scope_summary: "BLS ambulance practice", cognitive_cut_score: 0.66, ce_total_hours: 40, ce_national_min_hours: 20, ce_local_min_hours: 10, ce_individual_min_hours: 10, hourly_model_total_hours: 40, remedial_hours_required: 20, refresher_hours_required: 24, initial_application_fee_cents: 9800, recert_application_fee_cents: 4500 }
              as: RegistryAdmin
              captures: { lv: $.data.id }
            - call: "POST /registry/candidates"
              payload: { full_name: "Amy Anniversary", email: "amy@example.com" }
              as: Anonymous
