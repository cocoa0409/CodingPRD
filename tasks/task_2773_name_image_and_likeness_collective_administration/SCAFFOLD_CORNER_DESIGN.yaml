      - name: reversal_after_the_tax_year_closes_is_rejected
        claim_type: temporal_validation
        grounds: [validations.priority_30_reversal_within_same_tax_year, errors.ERR_REVERSAL_ACROSS_TAX_YEARS, 'endpoints."POST /nil/payment-releases/{id}/reversals"']
        distinguishing_aspect: "The reversal window is bounded by the calendar year of released_at versus the clock's current year, so a release made on 2026-12-20 becomes irreversible once the clock moves to 2027 even though nothing about the release itself changed."
        test_recipe:
          setup:
            - "A collective with 487470 cents of settled UNRESTRICTED net funds (gross 500000, fee 12530)."
            - "One ENROLLED athlete with taxpayer_doc_on_file W9 and one ACTIVE contract worth 200000 spanning 2026-08-01 to 2027-06-30, with disclosure ACCEPTED."
            - "The clock is moved to 2026-12-20 and a CONTRACT_ADVANCE release of 100000 is made, so released_at is stamped in calendar year 2026."
            - "The clock is then moved to 2027-01-05, closing the 2026 tax year."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Tax Year Collective", institution_name: "Tax Year Institution", institution_ipeds_code: "023900", home_state_code: "CA", association_ruleset: "NCAA_2026" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T3", tier_name: "Tax Club", annual_dues_cents: 90000, benefit_rank: 3 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Tax Donor", email: "taxy@example.com" }
              as: CollectiveDirector
              captures: { donor_id: $.data.id }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 500000, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: TreasuryOfficer
              captures: { contrib_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Tax Athlete", portal_user_id: "ath-taxy", sport: "FOOTBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { ath_id: $.data.id }
            - call: "PATCH /nil/athletes/${ath_id}/tax-profile"
              payload: { taxpayer_doc_on_file: "W9" }
              as: TreasuryOfficer
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 200000, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2027-06-30T00:00:00Z", funding_designation: "UNRESTRICTED" }
              as: CollectiveDirector
              captures: { dc_id: $.data.id }
            - call: "POST /nil/deal-contracts/${dc_id}/compliance-submissions"
              payload: { state_law_citation: "CA-AB131", association_rule_citation: "NCAA-2026-12.5" }
              as: CollectiveDirector
            - call: "POST /nil/deal-contracts/${dc_id}/compliance-decisions"
              payload: { decision: "ACCEPT" }
              as: InstitutionReviewer
            - call: "POST /nil/deal-contracts/${dc_id}/activation"
              payload: {}
              as: CollectiveDirector
              captures: { dc_ver: $.data.version }
            - call: "POST /nil/_clock/set_current_utc"
              payload: { current_utc: "2026-12-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nil/payment-releases"
              payload: { deal_contract_id: "${dc_id}", release_kind: "CONTRACT_ADVANCE", requested_amount_cents: 100000, expected_deal_contract_version: "${dc_ver}" }
              as: TreasuryOfficer
              as_user_id: "treasury-taxy"
              captures: { rel_id: $.data.id, rel_status: $.data.status, rel_released_at: $.data.released_at, rel_net: $.data.net_payable_cents }
            - call: "POST /nil/_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: PlatformAdmin
              captures: { prev_utc: $.data.previous_utc }
          trigger:
            - call: "POST /nil/payment-releases/${rel_id}/reversals"
              payload: { reversal_reason: "ERRONEOUS_PAYMENT" }
              as: TreasuryOfficer
              as_user_id: "treasury-taxy"
              captures: { err_id: $.data.error_id }
          assert:
            - "${rel_status} == RELEASED"
            - "${rel_released_at} == 2026-12-20T00:00:00Z"
            - "${rel_net} == 100000"
            - "${prev_utc} == 2026-12-20T00:00:00Z"
            - "${err_id} == ERR_REVERSAL_ACROSS_TAX_YEARS"
            - "The response status is 422."
            - "PaymentRelease.${rel_id}.status == RELEASED"
            - "PaymentRelease.${rel_id}.reversal_reason == NONE"
            - "Collective.${col_id}.released_total_cents == 100000"
            - "Collective.${col_id}.reversed_total_cents == 0"
            - "Moving the clock back to 2026-12-31T00:00:00Z and repeating the identical reversal succeeds, proving the gate is the calendar year and not the release's age."

