# =============================================================================
# Annuity Contract Administration — benchmark seed tables (SCAFFOLD.yaml)
# Sections §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; §1.9 in
# SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Annuity Contract Administration: contract type (fixed/variable/indexed),
  premium/funding, accumulation & crediting, surrender schedule & charges,
  free-withdrawal corridor, annuitization/payout options, death benefit,
  1035 exchange

domain_name: annuity-contract-administration
# Flat/hybrid topology: multiple top-level collections (/contracts, /premiums,
# /withdrawals, /exchanges-1035, ...) rather than one nested resource tree, so
# the api_prefix is the empty root.
api_prefix: ""

# =============================================================================
# §0 Complexity Profile  (Expert band per §0.4)
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: hybrid
  # Contract is the aggregate root; Premium / Withdrawal / CreditingEvent /
  # Annuitization / DeathClaim hang off it (hierarchical), while Product is a
  # peer configuration referenced by FK, and Exchange1035 links two Contracts
  # (cross_aggregate). SubAccountAllocation / IndexSegment / Beneficiary are
  # children of Contract that also FK out to Product-defined divisions.

  state_machine_shape: compound
  # Contract status is compound (aggregate of premium-cleared, crediting,
  # surrender, annuitized states); Withdrawal is branching with revert;
  # DeathClaim is branching fork-join; Exchange1035 is cyclic (revision loop).

  relationship_patterns:
    - one_to_many        # Contract -> Premium / Withdrawal / CreditingEvent / Beneficiary
    - cross_aggregate    # Exchange1035 -> two Contracts; Contract -> Product
    - polymorphic        # CreditingEvent.source_segment_id references SubAccountAllocation OR IndexSegment

  role_model: segregation_of_duties
  # ContractAdmin sets up contracts and premiums; CreditingOfficer posts
  # crediting; ComplianceOfficer approves 1035 exchanges and surrenders;
  # the person who SUBMITS a 1035 exchange (ContractAdmin) cannot APPROVE it
  # (ComplianceOfficer) — segregation of duties.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  # Product — configuration template. Defines contract type, surrender schedule,
  # crediting parameters, free-withdrawal corridor, death-benefit type.
  # ---------------------------------------------------------------------------
  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Product display name" }
      - { name: contract_type, type: enum, source: input, description: "FIXED | VARIABLE | INDEXED", constraints: "one of {FIXED, VARIABLE, INDEXED}" }
      - { name: fixed_annual_rate_bps, type: integer, source: input, description: "FIXED only: guaranteed annual crediting rate in basis points (e.g. 350 = 3.50%); required when contract_type=FIXED, must be null otherwise" }
      - { name: free_withdrawal_corridor_bps, type: integer, source: input, default: 1000, description: "Annual penalty-free withdrawal allowance as bps of prior-anniversary accumulation value (1000 = 10.00%)" }
      - { name: mva_enabled, type: boolean, source: input, default: false, description: "Whether a Market Value Adjustment applies to surrender-charge-bearing withdrawals" }
      - { name: death_benefit_type, type: enum, source: input, description: "RETURN_OF_PREMIUM | ACCOUNT_VALUE | HIGHEST_ANNIVERSARY", constraints: "one of {RETURN_OF_PREMIUM, ACCOUNT_VALUE, HIGHEST_ANNIVERSARY}" }
      - { name: surrender_charge_schedule, type: array, source: input, description: "Ordered rows [{contract_year:int>=1, charge_bps:int>=0}] indexed by completed contract year; charge_bps applied to surrendered amount in that year; array length = surrender period in years" }
      - { name: min_initial_premium_cents, type: integer, source: input, default: 1000000, description: "Minimum initial premium in cents (default $10,000.00)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RETIRED — RETIRED products reject new contracts" }

  # ---------------------------------------------------------------------------
  # Contract — aggregate root. Compound status derived from lifecycle of
  # premiums, crediting, withdrawals, annuitization and death claim.
  # ---------------------------------------------------------------------------
  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the product template this contract instantiates; product must be ACTIVE at creation" }
      - { name: owner_name, type: string, source: input, description: "Contract owner legal name" }
      - { name: annuitant_age, type: integer, source: input, description: "Annuitant age in whole years at issue; must be 0..85" }
      - { name: issue_date, type: datetime, source: system, description: "Server clock value at the transition PENDING->ACTIVE (first premium cleared); contract anniversaries are computed from this date" }
      - { name: contract_year, type: integer, source: computed, description: "Completed contract years since issue_date given the current server clock; floor((now - issue_date)/365d); 0 during first year; drives surrender_charge_bps lookup" }
      - { name: accumulation_value_cents, type: integer, source: computed, description: "Chronological accumulation value: sum of cleared Premium.net_premium_cents plus sum of CreditingEvent.credit_cents minus sum of Withdrawal.gross_withdrawal_cents for SETTLED withdrawals; floors at 0" }
      - { name: cumulative_premium_cents, type: integer, source: computed, description: "Sum of net_premium_cents across all CLEARED Premium rows; basis for RETURN_OF_PREMIUM death benefit" }
      - { name: highest_anniversary_value_cents, type: integer, source: computed, description: "Max accumulation_value_cents observed at any anniversary roll (set by anniversary-roll system event); basis for HIGHEST_ANNIVERSARY death benefit; starts at 0" }
      - { name: free_withdrawal_used_cents, type: integer, source: computed, description: "Penalty-free withdrawal amount already consumed in the current contract year; reset to 0 on each anniversary roll" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | ACTIVE | ANNUITIZED | SURRENDERED | DEATH_CLAIM | TERMINATED — compound: ACTIVE requires >=1 CLEARED premium" }
      - { name: surrender_charge_bps, type: integer, source: computed, description: "Charge basis points for the current contract_year, read from Product.surrender_charge_schedule[contract_year]; 0 when contract_year >= schedule length (out of surrender period)" }

  # ---------------------------------------------------------------------------
  # Premium — funding events (initial + subsequent). State machine on clearing.
  # ---------------------------------------------------------------------------
  - name: Premium
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the contract being funded; contract must be PENDING (initial) or ACTIVE (subsequent)" }
      - { name: gross_premium_cents, type: integer, source: input, description: "Gross premium amount submitted in cents; must be > 0" }
      - { name: premium_load_bps, type: integer, source: input, default: 0, description: "Sales/premium load in bps deducted from gross to derive net (0..1000)" }
      - { name: net_premium_cents, type: integer, source: computed, description: "= round_half_up(gross_premium_cents * (1 - premium_load_bps/10000)); credited to accumulation on CLEARED" }
      - { name: is_initial, type: boolean, source: computed, description: "True iff this is the first premium on the contract (drives PENDING->ACTIVE)" }
      - { name: source_exchange_id, type: string, source: input, description: "FK -> Exchange1035.id; set only for premiums funded by an inbound 1035 exchange, null for cash premiums" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | CLEARED | REJECTED — CLEARED credits accumulation" }

  # ---------------------------------------------------------------------------
  # SubAccountAllocation — VARIABLE only: division allocations summing to 100%.
  # ---------------------------------------------------------------------------
  - name: SubAccountAllocation
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the variable annuity contract this allocation belongs to" }
      - { name: division_name, type: string, source: input, description: "Investment division identifier (e.g. EQUITY_GROWTH)" }
      - { name: allocation_bps, type: integer, source: input, description: "Allocation share in bps (1..10000); the sum across all ACTIVE allocations on a contract must equal exactly 10000" }
      - { name: unit_value_cents, type: integer, source: input, description: "Current accumulation unit value for this division in cents; used to compute index-style crediting deltas" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | LIQUIDATED — LIQUIDATED on annuitization or surrender" }

  # ---------------------------------------------------------------------------
  # IndexSegment — INDEXED only: index crediting buckets with cap/floor/par.
  # ---------------------------------------------------------------------------
  - name: IndexSegment
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the indexed annuity contract this segment belongs to" }
      - { name: index_name, type: string, source: input, description: "Reference index identifier (e.g. SP500)" }
      - { name: term_start_date, type: datetime, source: input, description: "Inclusive start of the index term window [term_start_date, term_end_date); must be < term_end_date" }
      - { name: term_end_date, type: datetime, source: input, description: "Exclusive end of the index term window; half-open interval. Two OPEN segments on the same contract+index_name may not overlap; adjacency (prev.term_end_date == next.term_start_date) is allowed (gap=0 OK)" }
      - { name: segment_premium_cents, type: integer, source: input, description: "Amount allocated to this segment at the start of the index term, in cents; must be > 0" }
      - { name: cap_bps, type: integer, source: input, description: "Upper bound on credited index return in bps (e.g. 800 = 8.00%)" }
      - { name: floor_bps, type: integer, source: input, default: 0, description: "Lower bound on credited index return in bps; typically 0 for principal protection" }
      - { name: participation_bps, type: integer, source: input, default: 10000, description: "Participation rate in bps applied to raw index return before cap/floor (10000 = 100%)" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CREDITED — CREDITED after a crediting event posts for the term" }

  # ---------------------------------------------------------------------------
  # CreditingEvent — append-only ledger of credits applied to accumulation.
  # Polymorphic source: a SubAccountAllocation (variable), an IndexSegment
  # (indexed) or null (fixed contract-level guaranteed crediting).
  # ---------------------------------------------------------------------------
  - name: CreditingEvent
    parent: Contract
    common_fields: false
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the contract whose accumulation this credit affects" }
      - { name: crediting_kind, type: enum, source: input, description: "FIXED_GUARANTEED | INDEX_SEGMENT | SUBACCOUNT_RETURN — must match Contract's product contract_type" }
      - { name: source_segment_id, type: string, source: input, description: "FK -> IndexSegment.id; set for INDEX_SEGMENT crediting; null otherwise (FIXED_GUARANTEED and SUBACCOUNT_RETURN are contract-level)" }
      - { name: source_allocation_id, type: string, source: input, description: "FK -> SubAccountAllocation.id; set for SUBACCOUNT_RETURN crediting; null otherwise" }
      - { name: raw_index_return_bps, type: integer, source: input, description: "INDEX_SEGMENT only: raw index period return in bps before participation/cap/floor; ignored for other kinds. For SUBACCOUNT_RETURN reused as the division period return in bps" }
      - { name: credit_period_start, type: datetime, source: input, description: "INDEX_SEGMENT only: inclusive start of the crediting period this event covers; must fall inside the source segment's term window" }
      - { name: credit_period_end, type: datetime, source: input, description: "INDEX_SEGMENT only: exclusive end of the crediting period. CLOSED/buffer semantics: a new crediting period for the same segment that overlaps OR merely touches (prev.credit_period_end == next.credit_period_start) a prior crediting period is rejected — adjacency is NOT allowed here, unlike IndexSegment term windows" }
      - { name: credit_cents, type: integer, source: computed, description: "Computed credit amount applied to accumulation (may be 0 at floor; never negative); see calc apply_crediting" }
      - { name: posted_period_index, type: integer, source: system, description: "Server crediting-period counter at the time of posting (monotonic, from /_clock crediting epoch)" }

  # ---------------------------------------------------------------------------
  # Withdrawal — partial withdrawal with free-corridor + surrender charge + MVA.
  # Branching state machine with revert (REQUESTED -> {SETTLED, REJECTED}).
  # ---------------------------------------------------------------------------
  - name: Withdrawal
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the contract being withdrawn from; must be ACTIVE" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Net amount the owner wants to receive in cents; must be > 0; surrender charge is grossed on top per calc surrender_charge_on_withdrawal" }
      - { name: is_full_surrender, type: boolean, source: input, default: false, description: "When true the withdrawal liquidates the entire accumulation_value and drives Contract -> SURRENDERED" }
      - { name: free_amount_cents, type: integer, source: computed, description: "Portion of this withdrawal inside the remaining free-withdrawal corridor (charge-exempt); see calc free_corridor_split" }
      - { name: chargeable_amount_cents, type: integer, source: computed, description: "Portion of this withdrawal subject to surrender charge = gross - free_amount_cents" }
      - { name: surrender_charge_cents, type: integer, source: computed, description: "Surrender charge deducted; see calc surrender_charge_on_withdrawal" }
      - { name: mva_cents, type: integer, source: computed, description: "Market value adjustment (may be positive or negative) applied when Product.mva_enabled; 0 otherwise; see calc mva_adjustment" }
      - { name: gross_withdrawal_cents, type: integer, source: computed, description: "Total reduction of accumulation_value = requested_amount_cents + surrender_charge_cents + mva_cents (mva may reduce)" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | SETTLED | REJECTED — SETTLED debits accumulation and consumes free corridor" }

  # ---------------------------------------------------------------------------
  # Beneficiary — death-benefit recipients with allocation pct summing to 100%.
  # ---------------------------------------------------------------------------
  - name: Beneficiary
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the contract this beneficiary is designated on" }
      - { name: full_name, type: string, source: input, description: "Beneficiary legal name" }
      - { name: relationship, type: enum, source: input, description: "SPOUSE | CHILD | TRUST | ESTATE | OTHER" }
      - { name: share_bps, type: integer, source: input, description: "Death benefit share in bps (1..10000); sum across ACTIVE beneficiaries must equal exactly 10000 before a DeathClaim may be FUNDED" }
      - { name: payout_cents, type: integer, source: computed, description: "Computed share of the death benefit for this beneficiary; 0 until DeathClaim is FUNDED" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | REVOKED — REVOKED beneficiaries are excluded from the share sum and payout" }

  # ---------------------------------------------------------------------------
  # Annuitization — payout election. Branching from ELECTED.
  # ---------------------------------------------------------------------------
  - name: Annuitization
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the contract being annuitized; must be ACTIVE" }
      - { name: payout_option, type: enum, source: input, description: "LIFE_ONLY | PERIOD_CERTAIN | LIFE_WITH_PERIOD_CERTAIN | JOINT_LIFE" }
      - { name: period_certain_years, type: integer, source: input, description: "Guaranteed payment years; required (>=1) for PERIOD_CERTAIN and LIFE_WITH_PERIOD_CERTAIN; must be null otherwise" }
      - { name: annuitization_value_cents, type: integer, source: computed, description: "Accumulation value captured at election (snapshot of Contract.accumulation_value_cents at ELECTED)" }
      - { name: monthly_benefit_cents, type: integer, source: computed, description: "Monthly payout computed from annuitization_value, payout_option and annuitant age; see calc annuitization_benefit" }
      - { name: status, type: enum, source: system, default: "ELECTED", description: "ELECTED | ACTIVE_PAYOUT | DECLINED — ACTIVE_PAYOUT begins payments and drives Contract -> ANNUITIZED" }

  # ---------------------------------------------------------------------------
  # DeathClaim — branching fork-join: claim -> {verify identity, value benefit}
  # -> FUNDED. Cross-entity dependency on Beneficiary share completeness.
  # ---------------------------------------------------------------------------
  - name: DeathClaim
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the contract a death claim is filed against; must be ACTIVE" }
      - { name: date_of_death, type: datetime, source: input, description: "Reported date of death (ISO 8601); must be <= current server clock" }
      - { name: identity_verified, type: boolean, source: computed, description: "Set true by the verify-identity transition (fork branch 1)" }
      - { name: benefit_valued, type: boolean, source: computed, description: "Set true by the value-benefit transition (fork branch 2)" }
      - { name: death_benefit_cents, type: integer, source: computed, description: "Computed death benefit per Product.death_benefit_type; see calc death_benefit_valuation" }
      - { name: status, type: enum, source: system, default: "FILED", description: "FILED | VERIFYING | VALUED | FUNDED | DENIED — FUNDED requires both fork branches done and full beneficiary shares" }

  # ---------------------------------------------------------------------------
  # Exchange1035 — tax-free transfer between contracts. Cyclic (revision loop)
  # and segregation-of-duties (submitter != approver). OCC parent.
  # ---------------------------------------------------------------------------
  - name: Exchange1035
    parent: null
    common_fields: true
    fields:
      - { name: direction, type: enum, source: input, description: "INBOUND | OUTBOUND — INBOUND funds a new premium on target_contract_id; OUTBOUND liquidates source_contract_id" }
      - { name: source_contract_id, type: string, source: input, description: "FK -> Contract.id; the relinquishing contract (OUTBOUND); null for INBOUND from an external carrier" }
      - { name: target_contract_id, type: string, source: input, description: "FK -> Contract.id; the receiving contract (INBOUND); null for OUTBOUND to an external carrier" }
      - { name: external_carrier, type: string, source: input, description: "Name of the external carrier on the non-internal leg; required when source or target is external" }
      - { name: transfer_amount_cents, type: integer, source: input, description: "Tax-free transfer amount in cents; must be > 0; for INBOUND becomes a Premium.net basis on the target" }
      - { name: cost_basis_cents, type: integer, source: input, description: "Carried-over tax cost basis in cents; preserved tax-free; must be 0..transfer_amount_cents" }
      - { name: revision_count, type: integer, source: computed, description: "Number of times the exchange was returned for correction (REVISION_REQUESTED); starts at 0" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | SETTLED | REJECTED — cyclic SUBMITTED<->REVISION_REQUESTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # Contract — compound aggregate status.
  # ---------------------------------------------------------------------------
  - entity: Contract
    initial_state: PENDING
    terminal_states: [SURRENDERED, ANNUITIZED, TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system (automatic when the contract's first Premium transitions SUBMITTED->CLEARED via POST /premiums/{id}/clear)"
        actor: system
        preconditions:
          - "Triggering Premium.is_initial == true"
          - "Premium.status becoming CLEARED"
        side_effects:
          - "Set Contract.issue_date = current server clock"
          - "Recompute Contract.accumulation_value_cents (now includes the cleared net premium)"
          - "Recompute Contract.cumulative_premium_cents"
          - "Set Contract.highest_anniversary_value_cents = accumulation_value_cents"
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "system (anniversary roll via POST /_clock/roll_anniversary for a contract)"
        actor: system
        preconditions:
          - "Contract.status == ACTIVE"
        side_effects:
          - "Set Contract.highest_anniversary_value_cents = max(highest_anniversary_value_cents, accumulation_value_cents)"
          - "Reset Contract.free_withdrawal_used_cents = 0"
          - "Recompute Contract.contract_year and Contract.surrender_charge_bps"
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: SURRENDERED
        trigger: "system (automatic when a full-surrender Withdrawal transitions REQUESTED->SETTLED)"
        actor: system
        preconditions:
          - "Triggering Withdrawal.is_full_surrender == true"
          - "Withdrawal.status becoming SETTLED"
        side_effects:
          - "Set Contract.accumulation_value_cents = 0"
          - "Liquidate all ACTIVE SubAccountAllocation rows on the contract (status -> LIQUIDATED)"
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: ANNUITIZED
        trigger: "POST /annuitizations/{id}/begin-payout"
        actor: ContractAdmin
        preconditions:
          - "Annuitization.status == ELECTED transitioning to ACTIVE_PAYOUT"
          - "Contract.accumulation_value_cents > 0"
        side_effects:
          - "Liquidate all ACTIVE SubAccountAllocation rows on the contract (status -> LIQUIDATED)"
          - "Set Contract.accumulation_value_cents = 0 (converted to the income stream)"
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: DEATH_CLAIM
        trigger: "POST /death-claims (a DeathClaim is FILED against the contract)"
        actor: ContractAdmin
        preconditions:
          - "Contract.status == ACTIVE"
          - "No DeathClaim already FILED/VERIFYING/VALUED/FUNDED on the contract"
        side_effects:
          - "Freeze further Withdrawal and Annuitization creation on the contract"
          - "increments Contract.version by 1"
      - from: DEATH_CLAIM
        to: TERMINATED
        trigger: "system (automatic when the contract's DeathClaim transitions VALUED->FUNDED)"
        actor: system
        preconditions:
          - "DeathClaim.status becoming FUNDED"
        side_effects:
          - "Set Contract.accumulation_value_cents = 0"
          - "Distribute DeathClaim.death_benefit_cents across ACTIVE Beneficiary rows (set Beneficiary.payout_cents)"
          - "increments Contract.version by 1"
      - from: DEATH_CLAIM
        to: ACTIVE
        trigger: "system (automatic when the contract's DeathClaim transitions to DENIED)"
        actor: system
        preconditions:
          - "DeathClaim.status becoming DENIED"
        side_effects:
          - "Un-freeze Withdrawal and Annuitization creation on the contract"
          - "increments Contract.version by 1"

  # ---------------------------------------------------------------------------
  # Premium — funding clearance (branching).
  # ---------------------------------------------------------------------------
  - entity: Premium
    initial_state: SUBMITTED
    terminal_states: [CLEARED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /premiums/{id}/clear"
        actor: ContractAdmin
        preconditions:
          - "Premium.status == SUBMITTED"
          - "Contract.status == PENDING (if is_initial) OR ACTIVE (if subsequent)"
          - "Contract is not frozen by an open DeathClaim"
        side_effects:
          - "Compute net_premium_cents = round_half_up(gross_premium_cents * (1 - premium_load_bps/10000))"
          - "Add net_premium_cents into Contract.accumulation_value_cents and Contract.cumulative_premium_cents (ledger sync)"
          - "If is_initial: triggers Contract PENDING->ACTIVE (cascade)"
          - "increments Contract.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /premiums/{id}/reject"
        actor: ContractAdmin
        preconditions:
          - "Premium.status == SUBMITTED"
        side_effects:
          - "If this premium was funded by an inbound Exchange1035 (source_exchange_id set), the exchange remains APPROVED and a new premium must be submitted to settle it"
          - "No change to Contract.accumulation_value_cents"

  # ---------------------------------------------------------------------------
  # IndexSegment — OPEN -> CREDITED on a posted index crediting event.
  # ---------------------------------------------------------------------------
  - entity: IndexSegment
    initial_state: OPEN
    terminal_states: [CREDITED]
    transitions:
      - from: OPEN
        to: CREDITED
        trigger: "system (automatic when an INDEX_SEGMENT CreditingEvent posts against this segment via POST /crediting-events)"
        actor: system
        preconditions:
          - "IndexSegment.status == OPEN"
          - "Posting CreditingEvent.crediting_kind == INDEX_SEGMENT and source_segment_id == this segment"
        side_effects:
          - "Set IndexSegment.status = CREDITED (a CREDITED segment rejects further INDEX_SEGMENT crediting events)"

  # ---------------------------------------------------------------------------
  # SubAccountAllocation — ACTIVE -> LIQUIDATED on surrender/annuitization.
  # ---------------------------------------------------------------------------
  - entity: SubAccountAllocation
    initial_state: ACTIVE
    terminal_states: [LIQUIDATED]
    transitions:
      - from: ACTIVE
        to: LIQUIDATED
        trigger: "system (automatic when the contract transitions ACTIVE->SURRENDERED or ACTIVE->ANNUITIZED)"
        actor: system
        preconditions:
          - "SubAccountAllocation.status == ACTIVE"
          - "Owning Contract transitioning to SURRENDERED or ANNUITIZED"
        side_effects:
          - "Set SubAccountAllocation.status = LIQUIDATED"

  # ---------------------------------------------------------------------------
  # Beneficiary — ACTIVE -> REVOKED on explicit revoke.
  # ---------------------------------------------------------------------------
  - entity: Beneficiary
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /beneficiaries/{id}/revoke"
        actor: ContractAdmin
        preconditions:
          - "Beneficiary.status == ACTIVE"
        side_effects:
          - "Set Beneficiary.status = REVOKED; excluded from the share_bps sum and from death-benefit distribution"

  # ---------------------------------------------------------------------------
  # Withdrawal — branching with revert (REQUESTED -> {SETTLED, REJECTED}).
  # ---------------------------------------------------------------------------
  - entity: Withdrawal
    initial_state: REQUESTED
    terminal_states: [SETTLED, REJECTED]
    transitions:
      - from: REQUESTED
        to: SETTLED
        trigger: "POST /withdrawals/{id}/settle"
        actor: ComplianceOfficer
        preconditions:
          - "Withdrawal.status == REQUESTED"
          - "Contract.status == ACTIVE"
          - "Contract is not frozen by an open DeathClaim"
          - "gross_withdrawal_cents <= Contract.accumulation_value_cents"
        side_effects:
          - "Compute free_amount_cents / chargeable_amount_cents / surrender_charge_cents / mva_cents / gross_withdrawal_cents (see §1.3)"
          - "Debit Contract.accumulation_value_cents by gross_withdrawal_cents"
          - "Increase Contract.free_withdrawal_used_cents by free_amount_cents"
          - "If is_full_surrender: triggers Contract ACTIVE->SURRENDERED (cascade)"
          - "increments Contract.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /withdrawals/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "Withdrawal.status == REQUESTED"
        side_effects:
          - "No change to Contract.accumulation_value_cents or free_withdrawal_used_cents"

  # ---------------------------------------------------------------------------
  # Annuitization — branching from ELECTED.
  # ---------------------------------------------------------------------------
  - entity: Annuitization
    initial_state: ELECTED
    terminal_states: [ACTIVE_PAYOUT, DECLINED]
    transitions:
      - from: ELECTED
        to: ACTIVE_PAYOUT
        trigger: "POST /annuitizations/{id}/begin-payout"
        actor: ContractAdmin
        preconditions:
          - "Annuitization.status == ELECTED"
          - "Contract.status == ACTIVE"
          - "Contract.accumulation_value_cents > 0"
        side_effects:
          - "Snapshot annuitization_value_cents = Contract.accumulation_value_cents"
          - "Compute monthly_benefit_cents (see §1.3 annuitization_benefit)"
          - "Triggers Contract ACTIVE->ANNUITIZED (cascade)"
          - "increments Contract.version by 1"
      - from: ELECTED
        to: DECLINED
        trigger: "POST /annuitizations/{id}/decline"
        actor: ContractAdmin
        preconditions:
          - "Annuitization.status == ELECTED"
        side_effects:
          - "No change to Contract.status; contract remains ACTIVE"

  # ---------------------------------------------------------------------------
  # DeathClaim — branching fork-join (two independent branches must both
  # complete before FUNDED).
  # ---------------------------------------------------------------------------
  - entity: DeathClaim
    initial_state: FILED
    terminal_states: [FUNDED, DENIED]
    transitions:
      - from: FILED
        to: VERIFYING
        trigger: "POST /death-claims/{id}/verify-identity"
        actor: ComplianceOfficer
        preconditions:
          - "DeathClaim.status == FILED"
        side_effects:
          - "Set DeathClaim.identity_verified = true (fork branch 1 complete)"
      - from: VERIFYING
        to: VALUED
        trigger: "POST /death-claims/{id}/value-benefit"
        actor: ComplianceOfficer
        preconditions:
          - "DeathClaim.status == VERIFYING"
          - "DeathClaim.identity_verified == true"
        side_effects:
          - "Set DeathClaim.benefit_valued = true (fork branch 2 complete)"
          - "Compute DeathClaim.death_benefit_cents (see §1.3 death_benefit_valuation)"
      - from: VALUED
        to: FUNDED
        trigger: "POST /death-claims/{id}/fund"
        actor: ComplianceOfficer
        preconditions:
          - "DeathClaim.status == VALUED"
          - "DeathClaim.identity_verified == true AND DeathClaim.benefit_valued == true (join: both branches done)"
          - "Sum of share_bps across ACTIVE Beneficiary rows on the contract == 10000"
        side_effects:
          - "Distribute death_benefit_cents across ACTIVE Beneficiary rows (set Beneficiary.payout_cents, see §1.3 beneficiary_distribution)"
          - "Triggers Contract DEATH_CLAIM->TERMINATED (cascade)"
      - from: FILED
        to: DENIED
        trigger: "POST /death-claims/{id}/deny"
        actor: ComplianceOfficer
        preconditions:
          - "DeathClaim.status IN {FILED, VERIFYING, VALUED}"
        side_effects:
          - "Triggers Contract DEATH_CLAIM->ACTIVE (cascade, un-freeze)"
      - from: VERIFYING
        to: DENIED
        trigger: "POST /death-claims/{id}/deny"
        actor: ComplianceOfficer
        preconditions:
          - "DeathClaim.status IN {FILED, VERIFYING, VALUED}"
        side_effects:
          - "Triggers Contract DEATH_CLAIM->ACTIVE (cascade, un-freeze)"
      - from: VALUED
        to: DENIED
        trigger: "POST /death-claims/{id}/deny"
        actor: ComplianceOfficer
        preconditions:
          - "DeathClaim.status IN {FILED, VERIFYING, VALUED}"
        side_effects:
          - "Triggers Contract DEATH_CLAIM->ACTIVE (cascade, un-freeze)"

  # ---------------------------------------------------------------------------
  # Exchange1035 — cyclic revision loop + segregation of duties.
  # ---------------------------------------------------------------------------
  - entity: Exchange1035
    initial_state: DRAFT
    terminal_states: [SETTLED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /exchanges-1035/{id}/submit"
        actor: ContractAdmin
        preconditions:
          - "Exchange1035.status == DRAFT"
          - "cost_basis_cents <= transfer_amount_cents"
        side_effects:
          - "Record submitting X-User-ID as Exchange1035 submitter (held for segregation-of-duties check at approval)"
          - "increments Exchange1035.version by 1"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /exchanges-1035/{id}/request-revision"
        actor: ComplianceOfficer
        preconditions:
          - "Exchange1035.status == SUBMITTED"
        side_effects:
          - "increments Exchange1035.version by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /exchanges-1035/{id}/submit"
        actor: ContractAdmin
        preconditions:
          - "Exchange1035.status == REVISION_REQUESTED"
          - "cost_basis_cents <= transfer_amount_cents"
        side_effects:
          - "Increment Exchange1035.revision_count by 1 (cyclic loop counter)"
          - "increments Exchange1035.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /exchanges-1035/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "Exchange1035.status == SUBMITTED"
          - "Approving X-User-ID != the recorded submitter X-User-ID (segregation of duties)"
        side_effects:
          - "increments Exchange1035.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /exchanges-1035/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "Exchange1035.status == SUBMITTED"
        side_effects:
          - "increments Exchange1035.version by 1"
      - from: APPROVED
        to: SETTLED
        trigger: "POST /exchanges-1035/{id}/settle"
        actor: ComplianceOfficer
        preconditions:
          - "Exchange1035.status == APPROVED"
          - "For INBOUND: a Premium on target_contract_id with source_exchange_id == this exchange exists and is CLEARED"
        side_effects:
          - "For OUTBOUND: trigger a full-surrender on source_contract_id with surrender charge waived (1035 tax-free), driving that Contract ACTIVE->SURRENDERED"
          - "increments Exchange1035.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on parent version.
# =============================================================================
concurrency_rules:
  - rule_id: withdrawal-create-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /withdrawals"
    occ_field: "expected_contract_version"
    description: |
      Creating a Withdrawal against a Contract whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer settled a prior withdrawal or cleared a premium (which
      legitimately changes the accumulation_value the new withdrawal is sized
      against) and the current writer's view of the contract is therefore stale.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
  - rule_id: premium-create-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /premiums"
    occ_field: "expected_contract_version"
    description: |
      Submitting a subsequent Premium against a Contract whose version has
      advanced since the client last observed it is rejected. Another writer
      may have cleared a premium, settled a withdrawal, or rolled an anniversary
      (each bumps Contract.version and changes the funding picture), so the
      current writer's observed version is stale.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
  - rule_id: exchange-approve-stale
    parent_entity: Exchange1035
    write_endpoint: "POST /exchanges-1035/{id}/approve"
    occ_field: "expected_exchange_version"
    description: |
      Approving an Exchange1035 whose version has advanced since the client last
      observed it is rejected. A revision-request/resubmit cycle bumps the
      exchange version, so an approval carrying a stale version refers to a
      superseded revision of the exchange and must not take effect.
    error_id: ERR_STALE_EXCHANGE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- 1) Chronological accumulation value (ledger replay) -------------------
  - name: accumulation_value_chronological
    trigger: "Recomputed on every Premium CLEAR, CreditingEvent post, and Withdrawal SETTLE; read on every Contract GET"
    algorithm: chronological
    formula: |
      # Replay the contract's value events in created_at ASC order (tie-break by
      # created_at then by the deterministic insertion order; id is NEVER used).
      acc = 0
      for event in events_ordered_by(created_at ASC):
        if event is Premium with status==CLEARED:   acc += event.net_premium_cents
        elif event is CreditingEvent:                acc += event.credit_cents
        elif event is Withdrawal with status==SETTLED: acc -= event.gross_withdrawal_cents
      accumulation_value_cents = max(acc, 0)
    input_set: "CLEARED Premiums + all CreditingEvents + SETTLED Withdrawals on the contract; SUBMITTED/REJECTED premiums and REQUESTED/REJECTED withdrawals excluded"
    constants: {}
    precision: "integer cents; no rounding (all inputs already integer cents)"

  # --- 2) Forward-looking projected maturity value (dual variant) -----------
  - name: projected_maturity_value_forward
    trigger: "GET /contracts/{id}/projection"
    algorithm: forward_looking
    formula: |
      # Forward-looking: project end-of-surrender-period value assuming the
      # CURRENT crediting posture continues. Includes SUBMITTED (not-yet-cleared)
      # premiums as if they will clear — the inclusion-set difference from the
      # chronological variant.
      base = accumulation_value_chronological(contract)          # current settled value
      pending = sum(p.net_premium_cents for p in SUBMITTED premiums)  # projected to clear
      years_remaining = max(0, len(product.surrender_charge_schedule) - contract.contract_year)
      rate = product.fixed_annual_rate_bps if product.contract_type==FIXED else ASSUMED_GROWTH_BPS
      projected = (base + pending)
      for y in range(years_remaining):
        projected = round_half_up(projected * (1 + rate/10000))
    input_set: "Settled chronological value PLUS SUBMITTED premiums; projected forward over remaining surrender years"
    constants: { ASSUMED_GROWTH_BPS: 400 }
    precision: "2 decimal places equivalent — integer cents, round_half_up per compounding year"
    variants:
      - name: settled_only
        when: "?include_pending=false query param"
        difference: "Excludes SUBMITTED premiums; projects from settled chronological base only"
      - name: include_pending
        when: "?include_pending=true query param (default)"
        difference: "Adds SUBMITTED premium net amounts into the base before projecting — same contract, different number than settled_only"

  # --- 3) Free-withdrawal corridor split (threshold) -------------------------
  - name: free_corridor_split
    trigger: "Withdrawal SETTLE (POST /withdrawals/{id}/settle)"
    algorithm: threshold
    formula: |
      # Annual penalty-free allowance is a bps of the PRIOR-anniversary
      # accumulation value (highest_anniversary_value used as the prior-anniversary
      # snapshot). Remaining corridor = allowance - already-used this year.
      allowance = floor(contract.highest_anniversary_value_cents * product.free_withdrawal_corridor_bps / 10000)
      remaining_corridor = max(0, allowance - contract.free_withdrawal_used_cents)
      free_amount_cents = min(requested_amount_cents, remaining_corridor)
      chargeable_amount_cents = requested_amount_cents - free_amount_cents
      # Boundary: a withdrawal exactly equal to remaining_corridor is fully free
      # (<=, not <). One cent over the corridor makes exactly that 1 cent chargeable.
    input_set: "Withdrawal.requested_amount_cents, Contract.highest_anniversary_value_cents, Contract.free_withdrawal_used_cents, Product.free_withdrawal_corridor_bps"
    constants: {}
    precision: "integer cents; floor on the allowance computation"

  # --- 4) Surrender charge on withdrawal (combinatorial: tiered by year) -----
  - name: surrender_charge_on_withdrawal
    trigger: "Withdrawal SETTLE (POST /withdrawals/{id}/settle); Annuitization begin-payout (waived); 1035 OUTBOUND settle (waived)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned: (1) corridor split, then (2) charge on the
      # chargeable remainder, then (3) MVA on the chargeable remainder. The charge
      # rate is the schedule row for the CURRENT completed contract year.
      # free_corridor_split has already produced chargeable_amount_cents.
      charge_bps = contract.surrender_charge_bps     # schedule[contract_year], 0 if past surrender period
      surrender_charge_cents = round_half_up(chargeable_amount_cents * charge_bps / 10000)
      # Full surrender within the surrender period charges the whole chargeable
      # amount; a free-corridor partial inside the corridor charges 0.
    input_set: "Withdrawal.chargeable_amount_cents (from free_corridor_split), Contract.surrender_charge_bps (schedule lookup by contract_year)"
    constants: {}
    precision: "2 decimal places equivalent — integer cents, round_half_up"
    variants:
      - name: in_surrender_period
        when: "contract_year < len(surrender_charge_schedule)"
        difference: "charge_bps = schedule[contract_year] (> 0); chargeable amount incurs a charge"
      - name: out_of_surrender_period
        when: "contract_year >= len(surrender_charge_schedule)"
        difference: "charge_bps = 0; surrender_charge_cents = 0 regardless of chargeable amount"

  # --- 5) Market value adjustment (circular-looking dependency mode c) -------
  - name: mva_adjustment
    trigger: "Withdrawal SETTLE when Product.mva_enabled (POST /withdrawals/{id}/settle)"
    algorithm: aggregation
    formula: |
      # MVA is evaluated on the chargeable_amount only and AFTER the surrender
      # charge is fixed (pinned order: corridor -> charge -> mva). The adjustment
      # is signed: it is computed from the rate differential between the product's
      # fixed_annual_rate and the assumed market rate, scaled by remaining years.
      if not product.mva_enabled: mva_cents = 0
      else:
        years_remaining = max(0, len(product.surrender_charge_schedule) - contract.contract_year)
        rate_diff_bps = MARKET_REFERENCE_BPS - (product.fixed_annual_rate_bps or ASSUMED_GROWTH_BPS)
        mva_cents = round_half_up(chargeable_amount_cents * rate_diff_bps * years_remaining / 1000000)
      # Positive mva_cents INCREASES gross_withdrawal (market rates rose -> penalty);
      # negative mva_cents DECREASES gross_withdrawal (market rates fell -> bonus).
    input_set: "Withdrawal.chargeable_amount_cents, Product.fixed_annual_rate_bps, Contract.contract_year, Product.surrender_charge_schedule length"
    constants: { MARKET_REFERENCE_BPS: 500, ASSUMED_GROWTH_BPS: 400 }
    precision: "integer cents, round_half_up; result may be negative"

  # --- 6) Apply crediting (combinatorial: cap/floor/participation, 3 modes) --
  - name: apply_crediting
    trigger: "POST /crediting-events (CreditingEvent creation)"
    algorithm: weighted_scoring
    formula: |
      # The credit amount depends on crediting_kind. Each mode has >=3 inputs
      # with non-linear (nested min/max) interaction.
      if crediting_kind == FIXED_GUARANTEED:
        # contract-level guaranteed rate on current accumulation
        credit_cents = round_half_up(contract.accumulation_value_cents * product.fixed_annual_rate_bps / 10000)
      elif crediting_kind == INDEX_SEGMENT:
        seg = source_segment (IndexSegment)
        participated = raw_index_return_bps * seg.participation_bps / 10000
        capped = min(participated, seg.cap_bps)
        bounded = max(capped, seg.floor_bps)          # nested min/max
        credit_cents = round_half_up(seg.segment_premium_cents * bounded / 10000)
      elif crediting_kind == SUBACCOUNT_RETURN:
        alloc = source_allocation (SubAccountAllocation)
        # subaccount credit = allocation share of the contract value times the
        # division's period unit-value return (raw_index_return_bps reused as the
        # division return in bps)
        share = contract.accumulation_value_cents * alloc.allocation_bps / 10000
        credit_cents = round_half_up(share * raw_index_return_bps / 10000)
    input_set: "crediting_kind; for INDEX_SEGMENT: IndexSegment cap/floor/participation + raw_index_return_bps + segment_premium; for SUBACCOUNT_RETURN: allocation_bps + accumulation + division return; for FIXED_GUARANTEED: accumulation + fixed_annual_rate"
    constants: {}
    precision: "2 decimal places equivalent — integer cents, round_half_up; credit_cents floored at 0 (never negative)"

  # --- 7) Death benefit valuation (dual-variant across death_benefit_type) ---
  - name: death_benefit_valuation
    trigger: "DeathClaim value-benefit (POST /death-claims/{id}/value-benefit)"
    algorithm: aggregation
    formula: |
      if product.death_benefit_type == RETURN_OF_PREMIUM:
        death_benefit_cents = max(contract.cumulative_premium_cents, contract.accumulation_value_cents)
      elif product.death_benefit_type == ACCOUNT_VALUE:
        death_benefit_cents = contract.accumulation_value_cents
      elif product.death_benefit_type == HIGHEST_ANNIVERSARY:
        death_benefit_cents = max(contract.highest_anniversary_value_cents, contract.accumulation_value_cents)
    input_set: "Contract.accumulation_value_cents, Contract.cumulative_premium_cents, Contract.highest_anniversary_value_cents, Product.death_benefit_type"
    constants: {}
    precision: "integer cents; no rounding"

  # --- 8) Beneficiary distribution (waterfall remainder to created_at-first) -
  - name: beneficiary_distribution
    trigger: "DeathClaim FUND (POST /death-claims/{id}/fund)"
    algorithm: waterfall_allocation
    formula: |
      total = death_claim.death_benefit_cents
      benefs = ACTIVE Beneficiary rows on the contract, ordered by created_at ASC
      assigned = 0
      for b in benefs:
        b.payout_cents = floor(total * b.share_bps / 10000)
        assigned += b.payout_cents
      remainder = total - assigned
      # Penny remainder from flooring goes to the EARLIEST-created ACTIVE
      # beneficiary (created_at ASC, never id). Conserves the named quantity:
      # sum(payout_cents) == death_benefit_cents exactly.
      benefs[0].payout_cents += remainder
    input_set: "ACTIVE Beneficiary.share_bps on the contract, DeathClaim.death_benefit_cents"
    constants: {}
    precision: "integer cents; floor per beneficiary, remainder to created_at-earliest"

  # --- 9) Annuitization monthly benefit (combinatorial mode a) ---------------
  - name: annuitization_benefit
    trigger: "Annuitization begin-payout (POST /annuitizations/{id}/begin-payout)"
    algorithm: tiered_pricing
    formula: |
      av = annuitization_value_cents   # snapshot of accumulation at election
      # Annuity factor (per $1000 of value per month) selected by payout option
      # and a coarse age band — >=3 inputs, branch on enum + tiered age.
      age_factor = AGE_FACTORS_PER_1000[age_band(contract.annuitant_age)]  # tiered by age
      option_mult = OPTION_MULT[payout_option]                            # branch on enum
      base = av / 100000.0 * age_factor                                    # per $1000
      monthly = base * option_mult
      if payout_option in {PERIOD_CERTAIN, LIFE_WITH_PERIOD_CERTAIN}:
        monthly = monthly * PERIOD_CERTAIN_HAIRCUT[period_certain_years]    # tiered by years
      monthly_benefit_cents = round_half_up(monthly)
    input_set: "Annuitization.annuitization_value_cents, payout_option, period_certain_years, Contract.annuitant_age"
    constants:
      AGE_FACTORS_PER_1000: { "band_lt60": 480, "band_60_69": 540, "band_70_79": 640, "band_gte80": 820 }
      OPTION_MULT: { LIFE_ONLY: 100, PERIOD_CERTAIN: 92, LIFE_WITH_PERIOD_CERTAIN: 88, JOINT_LIFE: 84 }
      PERIOD_CERTAIN_HAIRCUT: { "10": 100, "15": 96, "20": 92 }
      NOTE: "factors are integer cents-per-$1000 per month; OPTION_MULT and HAIRCUT are percent (divide by 100); age_band: <60 band_lt60, 60-69 band_60_69, 70-79 band_70_79, >=80 band_gte80"
    precision: "2 decimal places equivalent — integer cents, round_half_up at the final step only"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right (Product, Contract, Premium, Withdrawal, Annuitization, DeathClaim, Exchange1035, Beneficiary, IndexSegment, SubAccountAllocation, CreditingEvent)"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"
  - priority: 4
    category: existence
    check: "FK body fields reference existing resources (contract_id, product_id, source_segment_id, source_allocation_id, source_contract_id, target_contract_id, source_exchange_id)"
    error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints carrying FK body fields"
  - priority: 5
    category: business_referential
    check: "Required scalar fields present and typed correctly; enum values within declared domain; integers within stated numeric ranges (e.g. annuitant_age 0..85, allocation_bps 1..10000, premium > 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/update endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches the live parent version on guarded writes (POST /withdrawals, POST /premiums subsequent, POST /exchanges-1035/{id}/approve)"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /withdrawals, POST /premiums, POST /exchanges-1035/{id}/approve"
  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is defined (Premium SUBMITTED before clear/reject; Withdrawal REQUESTED before settle/reject; Contract ACTIVE before withdrawal/annuitization/death-claim; Exchange1035 in the right state for each action; DeathClaim fork-join state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: the X-User-ID approving an Exchange1035 must differ from the X-User-ID that submitted it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /exchanges-1035/{id}/approve"
  - priority: 9
    category: business_safety
    check: "Contract frozen by an open DeathClaim (status FILED/VERIFYING/VALUED) rejects new Withdrawal, Premium, and Annuitization creation and their settlement/clear transitions"
    error_id: ERR_CONTRACT_FROZEN
    http_status: 409
    applies_to: "POST /withdrawals, POST /withdrawals/{id}/settle, POST /premiums, POST /premiums/{id}/clear, POST /annuitizations"
  - priority: 10
    category: business_constraint
    check: "Crediting kind matches contract type: FIXED_GUARANTEED only on FIXED, INDEX_SEGMENT only on INDEXED, SUBACCOUNT_RETURN only on VARIABLE; INDEX_SEGMENT requires source_segment_id; SUBACCOUNT_RETURN requires source_allocation_id"
    error_id: ERR_CREDITING_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /crediting-events"
  - priority: 11
    category: business_constraint
    check: "Allocation completeness: on a VARIABLE contract the sum of allocation_bps across ACTIVE SubAccountAllocation rows must equal exactly 10000 before the initial Premium may be CLEARED; partial allocations reject the clear"
    error_id: ERR_ALLOCATION_INCOMPLETE
    http_status: 409
    applies_to: "POST /premiums/{id}/clear"
  - priority: 12
    category: business_constraint
    check: "Beneficiary share completeness: sum of share_bps across ACTIVE Beneficiary rows must equal exactly 10000 before a DeathClaim may be FUNDED"
    error_id: ERR_BENEFICIARY_SHARES_INCOMPLETE
    http_status: 409
    applies_to: "POST /death-claims/{id}/fund"
  - priority: 13
    category: business_temporal
    check: "DeathClaim.date_of_death must be <= current server clock; a future date of death is rejected"
    error_id: ERR_FUTURE_DATE_OF_DEATH
    http_status: 422
    applies_to: "POST /death-claims"
  - priority: 14
    category: business_constraint
    check: "Annuitization payout-option arity: period_certain_years required (>=1) for PERIOD_CERTAIN and LIFE_WITH_PERIOD_CERTAIN, and must be null/absent for LIFE_ONLY and JOINT_LIFE"
    error_id: ERR_PAYOUT_OPTION_ARITY
    http_status: 422
    applies_to: "POST /annuitizations"
  - priority: 15
    category: business_fiscal
    check: "Initial premium gross_premium_cents must be >= Product.min_initial_premium_cents"
    error_id: ERR_BELOW_MINIMUM_PREMIUM
    http_status: 422
    applies_to: "POST /premiums (when is_initial)"
  - priority: 16
    category: business_fiscal
    check: "Withdrawal sizing: gross_withdrawal_cents (requested + surrender_charge + mva) must be <= Contract.accumulation_value_cents at settle time; an over-draw is rejected"
    error_id: ERR_INSUFFICIENT_ACCUMULATION
    http_status: 409
    applies_to: "POST /withdrawals/{id}/settle"
  - priority: 17
    category: business_fiscal
    check: "1035 basis integrity: cost_basis_cents must be 0..transfer_amount_cents (basis cannot exceed the transfer)"
    error_id: ERR_INVALID_COST_BASIS
    http_status: 422
    applies_to: "POST /exchanges-1035, POST /exchanges-1035/{id}/submit"
  - priority: 18
    category: business_temporal
    check: "IndexSegment term-window overlap: a new segment's half-open window [term_start_date, term_end_date) must not overlap any OPEN IndexSegment on the same contract+index_name. Adjacency where the new term_start_date == an existing term_end_date (gap=0) is ALLOWED. Overlap arithmetic: reject iff new.start < existing.end AND existing.start < new.end."
    error_id: ERR_SEGMENT_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /index-segments"
  - priority: 19
    category: business_temporal
    check: "CreditingEvent credit-period overlap (CLOSED/buffer semantics): for an INDEX_SEGMENT crediting event, [credit_period_start, credit_period_end) must lie inside the source segment's term window AND must not overlap OR touch any prior crediting period for the same segment. Touching (new.credit_period_start == prior.credit_period_end, gap=0) is REJECTED here — opposite adjacency treatment from priority 18. Reject iff new.start < prior.end AND prior.start < new.end, OR new.start == prior.end, OR new.end == prior.start."
    error_id: ERR_CREDIT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /crediting-events"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Product (configuration) ----------------------------------------------
  - { method: POST, path: "/products", description: "Create a product template", roles: [ContractAdmin], code: 201, input: [name, contract_type, "fixed_annual_rate_bps?", "free_withdrawal_corridor_bps?", "mva_enabled?", death_benefit_type, surrender_charge_schedule, "min_initial_premium_cents?"], output: Product, side_effects: [] }
  - { method: GET, path: "/products", description: "List products (paginated)", roles: [ContractAdmin, CreditingOfficer, ComplianceOfficer], code: 200, input: ["limit?", "offset?", "status?"], output: "Product[]", side_effects: [] }
  - { method: GET, path: "/products/{id}", description: "Retrieve a product", roles: [ContractAdmin, CreditingOfficer, ComplianceOfficer], code: 200, input: [], output: Product, side_effects: [] }
  - { method: POST, path: "/products/{id}/retire", description: "Retire a product (rejects new contracts)", roles: [ContractAdmin], code: 200, input: [], output: Product, side_effects: ["Product.status -> RETIRED"] }

  # --- Contract -------------------------------------------------------------
  - { method: POST, path: "/contracts", description: "Create a contract in PENDING", roles: [ContractAdmin], code: 201, input: [product_id, owner_name, annuitant_age], output: Contract, side_effects: ["Contract.status=PENDING; accumulation=0"] }
  - { method: GET, path: "/contracts", description: "List contracts (paginated, filterable)", roles: [ContractAdmin, CreditingOfficer, ComplianceOfficer], code: 200, input: ["limit?", "offset?", "status?", "product_id?"], output: "Contract[]", side_effects: [] }
  - { method: GET, path: "/contracts/{id}", description: "Retrieve a contract (computed fields recomputed)", roles: [ContractAdmin, CreditingOfficer, ComplianceOfficer], code: 200, input: [], output: Contract, side_effects: ["Recompute accumulation_value_cents, contract_year, surrender_charge_bps"] }
  - { method: GET, path: "/contracts/{id}/projection", description: "Forward-looking projected maturity value", roles: [ContractAdmin, CreditingOfficer, ComplianceOfficer], code: 200, input: ["include_pending?"], output: "{ projected_maturity_value_cents: integer, settled_base_cents: integer, years_projected: integer }", side_effects: [] }
  - { method: GET, path: "/contracts/{id}/premiums", description: "List premiums on a contract (FK reverse-reachability)", roles: [ContractAdmin, CreditingOfficer, ComplianceOfficer], code: 200, input: ["limit?", "offset?"], output: "Premium[]", side_effects: [] }
  - { method: GET, path: "/contracts/{id}/withdrawals", description: "List withdrawals on a contract (FK reverse-reachability)", roles: [ContractAdmin, CreditingOfficer, ComplianceOfficer], code: 200, input: ["limit?", "offset?"], output: "Withdrawal[]", side_effects: [] }
  - { method: GET, path: "/contracts/{id}/crediting-events", description: "List crediting events on a contract (FK reverse-reachability)", roles: [ContractAdmin, CreditingOfficer, ComplianceOfficer], code: 200, input: ["limit?", "offset?"], output: "CreditingEvent[]", side_effects: [] }
  - { method: GET, path: "/contracts/{id}/beneficiaries", description: "List beneficiaries on a contract (FK reverse-reachability)", roles: [ContractAdmin, CreditingOfficer, ComplianceOfficer], code: 200, input: ["limit?", "offset?"], output: "Beneficiary[]", side_effects: [] }
  - { method: GET, path: "/contracts/{id}/sub-account-allocations", description: "List sub-account allocations on a contract (FK reverse-reachability)", roles: [ContractAdmin, CreditingOfficer, ComplianceOfficer], code: 200, input: ["limit?", "offset?"], output: "SubAccountAllocation[]", side_effects: [] }
  - { method: GET, path: "/contracts/{id}/index-segments", description: "List index segments on a contract (FK reverse-reachability)", roles: [ContractAdmin, CreditingOfficer, ComplianceOfficer], code: 200, input: ["limit?", "offset?"], output: "IndexSegment[]", side_effects: [] }
  - { method: GET, path: "/contracts/{id}/annuitizations", description: "List annuitizations on a contract (FK reverse-reachability)", roles: [ContractAdmin, CreditingOfficer, ComplianceOfficer], code: 200, input: ["limit?", "offset?"], output: "Annuitization[]", side_effects: [] }
  - { method: GET, path: "/contracts/{id}/death-claims", description: "List death claims on a contract (FK reverse-reachability)", roles: [ContractAdmin, CreditingOfficer, ComplianceOfficer], code: 200, input: ["limit?", "offset?"], output: "DeathClaim[]", side_effects: [] }

  # --- Premium --------------------------------------------------------------
  - { method: POST, path: "/premiums", description: "Submit a premium (initial or subsequent); expected_contract_version is the version the client last observed on the contract and is OCC-checked", roles: [ContractAdmin], code: 201, input: [contract_id, gross_premium_cents, expected_contract_version, "premium_load_bps?", "source_exchange_id?"], output: Premium, side_effects: ["Premium.status=SUBMITTED; compute is_initial; OCC checks expected_contract_version against live Contract.version; increments Contract.version by 1"] }
  - { method: GET, path: "/premiums", description: "List premiums (filterable by contract or funding exchange; FK reverse-reachability for source_exchange_id)", roles: [ContractAdmin, CreditingOfficer, ComplianceOfficer], code: 200, input: ["limit?", "offset?", "contract_id?", "source_exchange_id?", "status?"], output: "Premium[]", side_effects: [] }
  - { method: GET, path: "/premiums/{id}", description: "Retrieve a premium", roles: [ContractAdmin, CreditingOfficer, ComplianceOfficer], code: 200, input: [], output: Premium, side_effects: [] }
  - { method: POST, path: "/premiums/{id}/clear", description: "Clear a submitted premium", roles: [ContractAdmin], code: 200, input: [], output: Premium, side_effects: ["compute net_premium_cents; credit accumulation; if is_initial cascade Contract PENDING->ACTIVE; increments Contract.version by 1"] }
  - { method: POST, path: "/premiums/{id}/reject", description: "Reject a submitted premium", roles: [ContractAdmin], code: 200, input: [], output: Premium, side_effects: ["Premium.status=REJECTED"] }

  # --- SubAccountAllocation (VARIABLE) --------------------------------------
  - { method: POST, path: "/sub-account-allocations", description: "Add a variable-annuity division allocation", roles: [ContractAdmin], code: 201, input: [contract_id, division_name, allocation_bps, unit_value_cents], output: SubAccountAllocation, side_effects: [] }
  - { method: GET, path: "/sub-account-allocations/{id}", description: "Retrieve an allocation", roles: [ContractAdmin, CreditingOfficer, ComplianceOfficer], code: 200, input: [], output: SubAccountAllocation, side_effects: [] }

  # --- IndexSegment (INDEXED) -----------------------------------------------
  - { method: POST, path: "/index-segments", description: "Open an index crediting segment (term window must not overlap an OPEN segment on the same contract+index_name)", roles: [ContractAdmin], code: 201, input: [contract_id, index_name, term_start_date, term_end_date, segment_premium_cents, cap_bps, "floor_bps?", "participation_bps?"], output: IndexSegment, side_effects: [] }
  - { method: GET, path: "/index-segments/{id}", description: "Retrieve an index segment", roles: [ContractAdmin, CreditingOfficer, ComplianceOfficer], code: 200, input: [], output: IndexSegment, side_effects: [] }

  # --- CreditingEvent -------------------------------------------------------
  - { method: POST, path: "/crediting-events", description: "Post a crediting event (interest/index/subaccount); for INDEX_SEGMENT the credit period must lie inside the segment term and not overlap or touch a prior crediting period", roles: [CreditingOfficer], code: 201, input: [contract_id, crediting_kind, "source_segment_id?", "source_allocation_id?", "raw_index_return_bps?", "credit_period_start?", "credit_period_end?"], output: CreditingEvent, side_effects: ["compute credit_cents (apply_crediting); add to Contract.accumulation_value_cents; stamp posted_period_index; if INDEX_SEGMENT mark segment CREDITED; increments Contract.version by 1"] }
  - { method: GET, path: "/crediting-events", description: "List crediting events (filterable by contract, source index segment, or source allocation; FK reverse-reachability for source_segment_id and source_allocation_id)", roles: [ContractAdmin, CreditingOfficer, ComplianceOfficer], code: 200, input: ["limit?", "offset?", "contract_id?", "source_segment_id?", "source_allocation_id?"], output: "CreditingEvent[]", side_effects: [] }
  - { method: GET, path: "/crediting-events/{id}", description: "Retrieve a crediting event", roles: [ContractAdmin, CreditingOfficer, ComplianceOfficer], code: 200, input: [], output: CreditingEvent, side_effects: [] }

  # --- Withdrawal -----------------------------------------------------------
  - { method: POST, path: "/withdrawals", description: "Request a partial or full withdrawal (OCC-guarded)", roles: [ContractAdmin], code: 201, input: [contract_id, requested_amount_cents, "is_full_surrender?", expected_contract_version], output: Withdrawal, side_effects: ["Withdrawal.status=REQUESTED; OCC checks expected_contract_version; increments Contract.version by 1"] }
  - { method: GET, path: "/withdrawals/{id}", description: "Retrieve a withdrawal", roles: [ContractAdmin, CreditingOfficer, ComplianceOfficer], code: 200, input: [], output: Withdrawal, side_effects: [] }
  - { method: POST, path: "/withdrawals/{id}/settle", description: "Settle a requested withdrawal (computes charges, debits accumulation)", roles: [ComplianceOfficer], code: 200, input: [], output: Withdrawal, side_effects: ["compute free/charge/mva/gross; debit accumulation; consume free corridor; if full surrender cascade Contract ACTIVE->SURRENDERED; increments Contract.version by 1"] }
  - { method: POST, path: "/withdrawals/{id}/reject", description: "Reject a requested withdrawal", roles: [ComplianceOfficer], code: 200, input: [], output: Withdrawal, side_effects: ["Withdrawal.status=REJECTED"] }

  # --- Beneficiary ----------------------------------------------------------
  - { method: POST, path: "/beneficiaries", description: "Designate a beneficiary", roles: [ContractAdmin], code: 201, input: [contract_id, full_name, relationship, share_bps], output: Beneficiary, side_effects: [] }
  - { method: GET, path: "/beneficiaries/{id}", description: "Retrieve a beneficiary", roles: [ContractAdmin, CreditingOfficer, ComplianceOfficer], code: 200, input: [], output: Beneficiary, side_effects: [] }
  - { method: POST, path: "/beneficiaries/{id}/revoke", description: "Revoke a beneficiary designation", roles: [ContractAdmin], code: 200, input: [], output: Beneficiary, side_effects: ["Beneficiary.status -> REVOKED"] }

  # --- Annuitization --------------------------------------------------------
  - { method: POST, path: "/annuitizations", description: "Elect an annuitization payout option", roles: [ContractAdmin], code: 201, input: [contract_id, payout_option, "period_certain_years?"], output: Annuitization, side_effects: ["Annuitization.status=ELECTED"] }
  - { method: GET, path: "/annuitizations/{id}", description: "Retrieve an annuitization", roles: [ContractAdmin, CreditingOfficer, ComplianceOfficer], code: 200, input: [], output: Annuitization, side_effects: [] }
  - { method: POST, path: "/annuitizations/{id}/begin-payout", description: "Begin payout (snapshots value, computes monthly benefit)", roles: [ContractAdmin], code: 200, input: [], output: Annuitization, side_effects: ["snapshot annuitization_value; compute monthly_benefit_cents; cascade Contract ACTIVE->ANNUITIZED; increments Contract.version by 1"] }
  - { method: POST, path: "/annuitizations/{id}/decline", description: "Decline an elected annuitization", roles: [ContractAdmin], code: 200, input: [], output: Annuitization, side_effects: ["Annuitization.status=DECLINED"] }

  # --- DeathClaim -----------------------------------------------------------
  - { method: POST, path: "/death-claims", description: "File a death claim (freezes contract)", roles: [ContractAdmin], code: 201, input: [contract_id, date_of_death], output: DeathClaim, side_effects: ["DeathClaim.status=FILED; cascade Contract ACTIVE->DEATH_CLAIM (freeze); increments Contract.version by 1"] }
  - { method: GET, path: "/death-claims/{id}", description: "Retrieve a death claim", roles: [ContractAdmin, CreditingOfficer, ComplianceOfficer], code: 200, input: [], output: DeathClaim, side_effects: [] }
  - { method: POST, path: "/death-claims/{id}/verify-identity", description: "Verify claimant identity (fork branch 1)", roles: [ComplianceOfficer], code: 200, input: [], output: DeathClaim, side_effects: ["set identity_verified=true; status FILED->VERIFYING"] }
  - { method: POST, path: "/death-claims/{id}/value-benefit", description: "Value the death benefit (fork branch 2)", roles: [ComplianceOfficer], code: 200, input: [], output: DeathClaim, side_effects: ["set benefit_valued=true; compute death_benefit_cents; status VERIFYING->VALUED"] }
  - { method: POST, path: "/death-claims/{id}/fund", description: "Fund the death benefit (join)", roles: [ComplianceOfficer], code: 200, input: [], output: DeathClaim, side_effects: ["distribute death_benefit across beneficiaries; cascade Contract DEATH_CLAIM->TERMINATED; increments Contract.version by 1"] }
  - { method: POST, path: "/death-claims/{id}/deny", description: "Deny a death claim (un-freezes contract)", roles: [ComplianceOfficer], code: 200, input: [], output: DeathClaim, side_effects: ["status -> DENIED; cascade Contract DEATH_CLAIM->ACTIVE (un-freeze); increments Contract.version by 1"] }

  # --- Exchange1035 ---------------------------------------------------------
  - { method: POST, path: "/exchanges-1035", description: "Create a 1035 exchange in DRAFT", roles: [ContractAdmin], code: 201, input: [direction, "source_contract_id?", "target_contract_id?", "external_carrier?", transfer_amount_cents, cost_basis_cents], output: Exchange1035, side_effects: [] }
  - { method: GET, path: "/exchanges-1035", description: "List 1035 exchanges (paginated, filterable)", roles: [ContractAdmin, ComplianceOfficer], code: 200, input: ["limit?", "offset?", "status?", "source_contract_id?", "target_contract_id?"], output: "Exchange1035[]", side_effects: [] }
  - { method: GET, path: "/exchanges-1035/{id}", description: "Retrieve a 1035 exchange", roles: [ContractAdmin, ComplianceOfficer], code: 200, input: [], output: Exchange1035, side_effects: [] }
  - { method: POST, path: "/exchanges-1035/{id}/submit", description: "Submit a draft/revised exchange for review", roles: [ContractAdmin], code: 200, input: [], output: Exchange1035, side_effects: ["record submitter X-User-ID; if from REVISION_REQUESTED increment revision_count; increments Exchange1035.version by 1"] }
  - { method: POST, path: "/exchanges-1035/{id}/request-revision", description: "Return a submitted exchange for correction", roles: [ComplianceOfficer], code: 200, input: [], output: Exchange1035, side_effects: ["status SUBMITTED->REVISION_REQUESTED; increments Exchange1035.version by 1"] }
  - { method: POST, path: "/exchanges-1035/{id}/approve", description: "Approve a submitted exchange (segregation of duties; OCC-guarded)", roles: [ComplianceOfficer], code: 200, input: [expected_exchange_version], output: Exchange1035, side_effects: ["check approver != submitter; OCC on expected_exchange_version; status SUBMITTED->APPROVED; increments Exchange1035.version by 1"] }
  - { method: POST, path: "/exchanges-1035/{id}/reject", description: "Reject a submitted exchange", roles: [ComplianceOfficer], code: 200, input: [], output: Exchange1035, side_effects: ["status SUBMITTED->REJECTED; increments Exchange1035.version by 1"] }
  - { method: POST, path: "/exchanges-1035/{id}/settle", description: "Settle an approved exchange (OUTBOUND triggers tax-free full surrender)", roles: [ComplianceOfficer], code: 200, input: [], output: Exchange1035, side_effects: ["OUTBOUND: cascade source Contract ACTIVE->SURRENDERED with charge waived; increments Exchange1035.version by 1"] }

  # --- Test-driving clock endpoints (/_ namespace) --------------------------
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server wall clock (test-driving)", roles: [ContractAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["sets server clock used for issue_date, contract_year, date_of_death checks"] }
  - { method: POST, path: "/_clock/roll_anniversary", description: "Roll a contract to its next anniversary (test-driving anniversary system event)", roles: [ContractAdmin], code: 200, input: [contract_id], output: Contract, side_effects: ["set highest_anniversary_value=max(...); reset free_withdrawal_used=0; recompute contract_year/surrender_charge_bps; increments Contract.version by 1"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this operation per RBAC" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_REFERENCED_RESOURCE_NOT_FOUND, http: 404, condition: "FK body field references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, bad type, enum out of domain, or numeric out of range" }
  - { id: ERR_STALE_CONTRACT_VERSION, http: 412, condition: "OCC: expected_contract_version does not match live Contract.version" }
  - { id: ERR_STALE_EXCHANGE_VERSION, http: 412, condition: "OCC: expected_exchange_version does not match live Exchange1035.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "1035 exchange approver X-User-ID equals the submitter X-User-ID" }
  - { id: ERR_CONTRACT_FROZEN, http: 409, condition: "Operation blocked because an open DeathClaim freezes the contract" }
  - { id: ERR_CREDITING_KIND_MISMATCH, http: 422, condition: "crediting_kind incompatible with contract type or missing required source reference" }
  - { id: ERR_ALLOCATION_INCOMPLETE, http: 409, condition: "VARIABLE contract sub-account allocation_bps do not sum to 10000 at initial premium clear" }
  - { id: ERR_BENEFICIARY_SHARES_INCOMPLETE, http: 409, condition: "ACTIVE beneficiary share_bps do not sum to 10000 at death-claim fund" }
  - { id: ERR_FUTURE_DATE_OF_DEATH, http: 422, condition: "date_of_death is after the current server clock" }
  - { id: ERR_PAYOUT_OPTION_ARITY, http: 422, condition: "period_certain_years missing where required or present where forbidden by payout_option" }
  - { id: ERR_BELOW_MINIMUM_PREMIUM, http: 422, condition: "Initial premium below Product.min_initial_premium_cents" }
  - { id: ERR_INSUFFICIENT_ACCUMULATION, http: 409, condition: "gross_withdrawal_cents exceeds Contract.accumulation_value_cents at settle" }
  - { id: ERR_INVALID_COST_BASIS, http: 422, condition: "cost_basis_cents not within 0..transfer_amount_cents" }
  - { id: ERR_SEGMENT_TERM_OVERLAP, http: 409, condition: "New IndexSegment term window overlaps an OPEN segment on the same contract+index_name (half-open; adjacency allowed)" }
  - { id: ERR_CREDIT_PERIOD_OVERLAP, http: 409, condition: "INDEX_SEGMENT crediting period overlaps, touches, or falls outside its source segment's term window (closed/buffer semantics; adjacency rejected)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ContractAdmin
    description: "Sets up products, contracts, premiums, allocations, segments, beneficiaries, annuitizations; files death claims; drafts/submits 1035 exchanges. Operates the clock endpoints."
    identity: opaque
    exclusive_operations:
      - "POST /products, POST /products/{id}/retire"
      - "POST /contracts"
      - "POST /premiums, POST /premiums/{id}/clear, POST /premiums/{id}/reject"
      - "POST /sub-account-allocations, POST /index-segments"
      - "POST /withdrawals (request only)"
      - "POST /beneficiaries, POST /beneficiaries/{id}/revoke"
      - "POST /annuitizations, POST /annuitizations/{id}/begin-payout, POST /annuitizations/{id}/decline"
      - "POST /death-claims (file)"
      - "POST /exchanges-1035, POST /exchanges-1035/{id}/submit"
      - "POST /_clock/set_current_utc, POST /_clock/roll_anniversary"
    shared_operations:
      - "All GET endpoints"
  - name: CreditingOfficer
    description: "Posts crediting events (interest/index/subaccount returns). Read-only elsewhere."
    identity: opaque
    exclusive_operations:
      - "POST /crediting-events"
    shared_operations:
      - "All GET endpoints (except 1035 list/detail which is ContractAdmin/ComplianceOfficer)"
  - name: ComplianceOfficer
    description: "Settles/rejects withdrawals; processes death claims; reviews, requests-revision on, approves, rejects, and settles 1035 exchanges. Cannot submit a 1035 exchange (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /withdrawals/{id}/settle, POST /withdrawals/{id}/reject"
      - "POST /death-claims/{id}/verify-identity, /value-benefit, /fund, /deny"
      - "POST /exchanges-1035/{id}/request-revision, /approve, /reject, /settle"
    shared_operations:
      - "All GET endpoints"
