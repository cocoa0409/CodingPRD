# =============================================================================
# SCAFFOLD — Alternative-Data Underwriting Model & Bank Partner Loan Allocation
# =============================================================================

scenario: |
  Alternative-Data Underwriting Model & Bank Partner Loan Allocation (Upstart): applicant scoring with education, employment and cash-flow variables beyond traditional bureau attributes, model governance with fair lending testing, variable exclusion review and disparate impact analysis, instant verification of income and identity with fallback document review, bank and credit union partner configurations specifying credit box, geography and volume limits, loan allocation across retaining partners, whole-loan buyers and securitization channels, referral network flow where a partner's own applicants are underwritten under partner branding, servicing, collections and charge-off reporting back to holders, model retraining cadence and performance attestation to partners

domain_name: alternative-data-underwriting-bank-partner-allocation
api_prefix: /platform

complexity_profile:
  primary_archetype: quota / allocation
  secondary_archetype: compliance / audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ModelVersion
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "Human-readable model identifier (e.g. ADU-7)" }
      - { name: variables, type: array, source: input, description: "Scoring variable list: each entry { name, weight, min, max }" }
      - { name: calibration_note, type: string, source: input, description: "Free-text calibration provenance note" }
      - { name: score_floor, type: integer, source: input, description: "Absolute minimum raw score the model may emit; scores below are clamped up to this floor" }
      - { name: score_ceiling, type: integer, source: input, description: "Absolute maximum raw score the model may emit; scores above are clamped down to this ceiling" }
      - { name: status, type: enum, source: system, description: "DRAFT | VALIDATED | ACTIVE | RETIRED" }
      - { name: fairness_report, type: object, source: system, description: "Computed disparate-impact report produced at validation; null until VALIDATED" }

  - name: Partner
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Partner legal name" }
      - { name: partner_type, type: enum, source: input, description: "BANK | CREDIT_UNION | LOAN_BUYER | SECURITIZATION_TRUST" }
      - { name: home_state, type: string, source: input, description: "Two-letter state of charter" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | ACTIVE | SUSPENDED | OFFBOARDED" }
      - { name: active_credit_box_id, type: string, source: system, description: "FK -> CreditBox.id; the single ACTIVE credit box governing new originations; null until one is activated" }
      - { name: originated_this_month_count, type: integer, source: computed, description: "Count of Loans this partner holds (allocation channel PARTNER_RETAINED or REFERRAL_RETAINED) whose funding month equals the current calendar month of the logical clock" }
      - { name: funded_balance_cents, type: integer, source: computed, description: "Sum of principal_cents across Loans this partner currently holds (holder_partner_id == this partner) in status CURRENT, DELINQUENT, or CHARGED_OFF" }

  - name: CreditBox
    parent: Partner
    common_fields: true
    fields:
      - { name: partner_id, type: string, source: system, description: "FK -> Partner.id; owning partner" }
      - { name: min_score, type: integer, source: input, description: "Lowest risk_score an APPROVED application may carry and still qualify" }
      - { name: max_score, type: integer, source: input, description: "Highest risk_score an APPROVED application may carry and still qualify (inclusive)" }
      - { name: allowed_states, type: array, source: input, description: "Two-letter state codes the partner will lend into; empty array means none" }
      - { name: min_loan_cents, type: integer, source: input, description: "Minimum approved principal" }
      - { name: max_loan_cents, type: integer, source: input, description: "Maximum approved principal" }
      - { name: monthly_volume_cap_count, type: integer, source: input, description: "Maximum number of loans this partner may newly hold per calendar month" }
      - { name: annual_percentage_rate, type: number, source: input, description: "Fixed APR applied to every loan originated under this box" }
      - { name: effective_from, type: datetime, source: input, description: "Earliest logical-clock instant at which the box may be activated" }
      - { name: effective_to, type: datetime, source: input, description: "Latest logical-clock instant at which the box may be activated; must be strictly after effective_from" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUPERSEDED | RETIRED" }

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Applicant legal name" }
      - { name: state_code, type: string, source: input, description: "Two-letter residence state" }
      - { name: annual_income_cents, type: integer, source: input, description: "Self-reported annual income" }
      - { name: monthly_debt_payments_cents, type: integer, source: input, description: "Self-reported recurring monthly debt service" }
      - { name: education_level, type: enum, source: input, description: "HIGH_SCHOOL | ASSOCIATE | BACHELOR | MASTER | DOCTORATE" }
      - { name: employment_status, type: enum, source: input, description: "EMPLOYED | SELF_EMPLOYED | UNEMPLOYED | RETIRED" }
      - { name: months_employed, type: integer, source: input, description: "Tenure at current employment" }
      - { name: bank_account_avg_balance_cents, type: integer, source: input, description: "Average daily bank balance over trailing 90 days (cash-flow variable)" }
      - { name: bank_account_nsf_count_90d, type: integer, source: input, description: "Non-sufficient-funds events in trailing 90 days (cash-flow variable)" }
      - { name: monthly_net_cashflow_cents, type: integer, source: input, description: "Average monthly deposits minus withdrawals over trailing 90 days" }
      - { name: bureau_score, type: integer, source: input, description: "Traditional bureau score (300-850) used as one input among many" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; scored subject" }
      - { name: channel, type: enum, source: input, description: "DIRECT | PARTNER_REFERRAL" }
      - { name: referral_partner_id, type: string, source: input, description: "FK -> Partner.id; required and only valid when channel is PARTNER_REFERRAL; the partner whose branding the applicant applied under" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Requested principal" }
      - { name: model_version_id, type: string, source: system, description: "FK -> ModelVersion.id; snapshot of the ACTIVE model at submission time" }
      - { name: risk_score, type: integer, source: computed, description: "Clamped weighted score computed at submission" }
      - { name: approved_amount_cents, type: integer, source: computed, description: "Approved principal after the affordability cap; null until UNDERWRITTEN" }
      - { name: debt_to_income_pct, type: number, source: computed, description: "Debt-to-income percentage computed at submission" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFICATION_PENDING | DOCS_REQUIRED | UNDERWRITTEN | APPROVED | DECLINED | WITHDRAWN" }

  - name: Verification
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; owning application" }
      - { name: kind, type: enum, source: system, description: "INCOME | IDENTITY" }
      - { name: status, type: enum, source: system, description: "PENDING | INSTANT_PASSED | INSTANT_FAILED | MANUAL_REVIEW | MANUAL_PASSED | MANUAL_FAILED" }
      - { name: reviewer_id, type: string, source: system, description: "Opaque X-User-ID of the VerificationOfficer who decided a manual review; null otherwise" }

  - name: FairnessReview
    parent: ModelVersion
    common_fields: true
    fields:
      - { name: model_version_id, type: string, source: system, description: "FK -> ModelVersion.id; model under review" }
      - { name: review_type, type: enum, source: input, description: "VARIABLE_EXCLUSION | DISPARATE_IMPACT" }
      - { name: outcome, type: enum, source: system, description: "PENDING | PASSED | FAILED" }
      - { name: details, type: string, source: input, description: "Free-text findings narrative" }

  - name: Attestation
    parent: ModelVersion
    common_fields: true
    fields:
      - { name: model_version_id, type: string, source: system, description: "FK -> ModelVersion.id; attested model" }
      - { name: partner_id, type: string, source: input, description: "FK -> Partner.id; partner receiving the attestation" }
      - { name: period_label, type: string, source: input, description: "Attestation period label (e.g. 2026-08)" }
      - { name: expected_default_rate_bps, type: integer, source: computed, description: "Platform-projected default rate in basis points for this partner's held book" }
      - { name: actual_default_rate_bps, type: integer, source: computed, description: "Observed default rate in basis points: charged-off loans over loans ever held by this partner that reached FUNDED, computed at attestation issuance" }
      - { name: variance_bps, type: integer, source: computed, description: "actual_default_rate_bps - expected_default_rate_bps" }
      - { name: attested_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the RiskOfficer who issued the attestation" }

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; source application" }
      - { name: holder_partner_id, type: string, source: system, description: "FK -> Partner.id; current holder (retaining partner, whole-loan buyer, or trust)" }
      - { name: allocation_channel, type: enum, source: system, description: "PARTNER_RETAINED | REFERRAL_RETAINED | WHOLE_LOAN_SALE | SECURITIZATION" }
      - { name: principal_cents, type: integer, source: system, description: "Approved principal copied from the application" }
      - { name: apr, type: number, source: system, description: "APR copied from the allocating credit box" }
      - { name: term_months, type: integer, source: system, description: "Fixed 36-month term assigned at funding" }
      - { name: monthly_payment_cents, type: integer, source: computed, description: "Amortizing payment computed at funding" }
      - { name: scheduled_interest_cents, type: integer, source: computed, description: "Interest portion due for the current period per amortization" }
      - { name: late_fee_accrued_cents, type: integer, source: computed, description: "Late fees accrued on the current missed payment; 0 while current" }
      - { name: outstanding_principal_cents, type: integer, source: computed, description: "Remaining principal balance" }
      - { name: days_delinquent, type: integer, source: computed, description: "Consecutive days past due at last recompute" }
      - { name: status, type: enum, source: system, description: "FUNDED | CURRENT | DELINQUENT | DEFAULTED | CHARGED_OFF | PAID_OFF" }

  - name: ServicingEvent
    parent: Loan
    common_fields: false
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; serviced loan" }
      - { name: event_type, type: enum, source: system, description: "PAYMENT_APPLIED | LATE_FEE_ASSESSED | DELINQUENCY_ADVANCED | DEFAULT_DECLARED | CHARGE_OFF_REPORTED | PAYOFF_RECORDED" }
      - { name: amount_cents, type: integer, source: system, description: "Payment amount for PAYMENT_APPLIED, fee for LATE_FEE_ASSESSED, charged-off balance for CHARGE_OFF_REPORTED; 0 otherwise" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical-clock timestamp when the event was recorded" }
      - { name: resulting_loan_status, type: enum, source: system, description: "Loan status immediately after the event was applied" }
      - { name: note, type: string, source: input, description: "Operator note" }

  - name: SecuritizationPool
    parent: Partner
    common_fields: true
    fields:
      - { name: trust_partner_id, type: string, source: system, description: "FK -> Partner.id; the SECURITIZATION_TRUST partner that owns this pool" }
      - { name: pool_label, type: string, source: input, description: "Human-readable pool name" }
      - { name: target_principal_cents, type: integer, source: input, description: "Principal capacity of the pool" }
      - { name: allocated_principal_cents, type: integer, source: computed, description: "Sum of principal_cents of Loans currently placed in this pool" }
      - { name: max_single_loan_cents, type: integer, source: input, description: "Largest single loan principal the pool will accept" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED" }

  - name: AllocationDecision
    parent: null
    common_fields: false
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; the approved application being placed" }
      - { name: candidate_partner_ids, type: array, source: system, description: "Ordered list of Partner ids evaluated, in evaluation order" }
      - { name: chosen_partner_id, type: string, source: system, description: "FK -> Partner.id; the holder chosen, or null when unallocated" }
      - { name: channel, type: enum, source: system, description: "PARTNER_RETAINED | REFERRAL_RETAINED | WHOLE_LOAN_SALE | SECURITIZATION | UNALLOCATED" }
      - { name: reason_codes, type: array, source: system, description: "Ordered machine codes explaining each rejection or the final choice" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the decision" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ModelVersion
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /platform/model-versions/{id}/validate"
        actor: RiskOfficer
        preconditions:
          - "ModelVersion.status == DRAFT (ERR_MODEL_INVALID_STATE)"
          - "The acting RiskOfficer's X-User-ID differs from the X-User-ID that created this ModelVersion (ERR_SEGREGATION_OF_DUTIES)"
          - "variables is non-empty and every variable weight is >= 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "Run calculations.disparate_impact_analysis over all APPROVED applications scored by this model's DRAFT cohort (none on first validation -> passes vacuously with ratio 1.0)"
          - "Stamp fairness_report with the computed report"
      - from: VALIDATED
        to: ACTIVE
        trigger: "POST /platform/model-versions/{id}/activate"
        actor: RiskOfficer
        preconditions:
          - "ModelVersion.status == VALIDATED (ERR_MODEL_INVALID_STATE)"
          - "No other ModelVersion is currently ACTIVE (ERR_MODEL_ALREADY_ACTIVE)"
          - "Every FairnessReview on this model has outcome != FAILED — at least one DISPARATE_IMPACT review with outcome PASSED must exist (ERR_FAIRNESS_GATE_BLOCKING)"
          - "No VARIABLE_EXCLUSION review on this model is in outcome PENDING (ERR_EXCLUSION_REVIEW_OPEN)"
        side_effects:
          - "Model becomes the sole scoring model for new submissions"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /platform/model-versions/{id}/retire"
        actor: RiskOfficer
        preconditions:
          - "ModelVersion.status == ACTIVE (ERR_MODEL_INVALID_STATE)"
          - "Every Application whose model_version_id == this model is in a terminal status {APPROVED, DECLINED, WITHDRAWN} (ERR_MODEL_HAS_OPEN_APPLICATIONS)"
        side_effects:
          - "No new Application may snapshot this model"
      - from: VALIDATED
        to: RETIRED
        trigger: "POST /platform/model-versions/{id}/retire"
        actor: RiskOfficer
        preconditions:
          - "ModelVersion.status == VALIDATED (ERR_MODEL_INVALID_STATE)"
        side_effects: []
      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /platform/model-versions/{id}"
        actor: RiskOfficer
        preconditions:
          - "ModelVersion.status == DRAFT (ERR_MODEL_LOCKED)"
          - "expected_model_version matches current version (ERR_STALE_VERSION)"
        side_effects:
          - "variables/score_floor/score_ceiling replaced; version increments by 1"

  - entity: Partner
    initial_state: ONBOARDING
    terminal_states: [OFFBOARDED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /platform/partners/{id}/activate"
        actor: PartnerAdmin
        preconditions:
          - "Partner.status == ONBOARDING (ERR_PARTNER_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /platform/partners/{id}/suspend"
        actor: PartnerAdmin
        preconditions:
          - "Partner.status == ACTIVE (ERR_PARTNER_INVALID_STATE)"
        side_effects:
          - "ACTIVE CreditBox of this partner is excluded from allocation eligibility immediately (no box state change)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /platform/partners/{id}/activate"
        actor: PartnerAdmin
        preconditions:
          - "Partner.status == SUSPENDED (ERR_PARTNER_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: OFFBOARDED
        trigger: "POST /platform/partners/{id}/offboard"
        actor: PartnerAdmin
        preconditions:
          - "Partner.status == ACTIVE (ERR_PARTNER_INVALID_STATE)"
          - "funded_balance_cents == 0 — the partner holds no live loans (ERR_PARTNER_HOLDS_LOANS)"
        side_effects:
          - "Any CreditBox in status ACTIVE -> SUPERSEDED"
          - "Any CreditBox in status DRAFT -> RETIRED"
          - "Each SecuritizationPool owned by this partner in status OPEN -> CLOSED"

  - entity: CreditBox
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /platform/partners/{id}/credit-boxes/{boxId}/activate"
        actor: PartnerAdmin
        preconditions:
          - "CreditBox.status == DRAFT (ERR_CREDIT_BOX_INVALID_STATE)"
          - "Partner.status == ACTIVE (ERR_PARTNER_INVALID_STATE)"
          - "effective_from <= logical clock now <= effective_to (ERR_CREDIT_BOX_NOT_IN_WINDOW)"
          - "min_score <= max_score and min_loan_cents <= max_loan_cents (ERR_INVALID_REQUEST)"
        side_effects:
          - "The partner's previously ACTIVE CreditBox, if any, transitions ACTIVE -> SUPERSEDED"
          - "Partner.active_credit_box_id := this box"
      - from: DRAFT
        to: RETIRED
        trigger: "POST /platform/partners/{id}/credit-boxes/{boxId}/retire"
        actor: PartnerAdmin
        preconditions:
          - "CreditBox.status == DRAFT (ERR_CREDIT_BOX_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (cascade when a newer DRAFT box of the same partner is activated)"
        actor: system
        preconditions: []
        side_effects:
          - "Loans already FUNDED under this box keep their recorded APR and terms"

  - entity: Application
    initial_state: SUBMITTED
    terminal_states: [DECLINED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: VERIFICATION_PENDING
        trigger: "system (inline with POST /platform/applications when both instant verifications remain PENDING)"
        actor: system
        preconditions: []
        side_effects:
          - "Create two Verification rows (INCOME, IDENTITY), both PENDING"
          - "Run calculations.risk_score; clamp to [model.score_floor, model.score_ceiling]; store risk_score and debt_to_income_pct"
          - "If model.score_floor <= risk_score < FLOOR_REJECT_SCORE (constant 300): transition directly SUBMITTED -> DECLINED instead (see branching transition below)"
      - from: SUBMITTED
        to: DECLINED
        trigger: "system (auto-decline branch at submission when clamped risk_score < 300)"
        actor: system
        preconditions: []
        side_effects:
          - "No Verification rows are created on this branch"
      - from: VERIFICATION_PENDING
        to: VERIFICATION_PENDING
        trigger: "POST /platform/applications/{id}/verifications/{verificationId}/instant-check"
        actor: VerificationOfficer
        preconditions:
          - "Application.status == VERIFICATION_PENDING (ERR_APPLICATION_INVALID_STATE)"
          - "Verification.status == PENDING (ERR_VERIFICATION_INVALID_STATE)"
        side_effects:
          - "Verification.status := INSTANT_PASSED or INSTANT_FAILED per calculations.instant_verification"
          - "If both verifications reach INSTANT_PASSED: Application -> UNDERWRITTEN (bubble-up, see transition below)"
          - "If any verification reaches INSTANT_FAILED: Application -> DOCS_REQUIRED (see transition below)"
      - from: VERIFICATION_PENDING
        to: UNDERWRITTEN
        trigger: "system (bubble-up when the second Verification reaches INSTANT_PASSED)"
        actor: system
        preconditions: []
        side_effects:
          - "Run calculations.approved_amount; store approved_amount_cents"
      - from: VERIFICATION_PENDING
        to: DOCS_REQUIRED
        trigger: "system (bubble-up when any Verification reaches INSTANT_FAILED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DOCS_REQUIRED
        to: UNDERWRITTEN
        trigger: "POST /platform/applications/{id}/verifications/{verificationId}/manual-decision with outcome PASS on the last non-passed verification"
        actor: VerificationOfficer
        preconditions:
          - "Application.status == DOCS_REQUIRED (ERR_APPLICATION_INVALID_STATE)"
          - "Verification.status == INSTANT_FAILED or MANUAL_REVIEW (ERR_VERIFICATION_INVALID_STATE)"
          - "The acting VerificationOfficer's X-User-ID differs from the X-User-ID of the officer who ran the instant-check on this verification (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Verification.status := MANUAL_PASSED; reviewer_id := acting officer"
          - "When no verification remains in {PENDING, INSTANT_FAILED, MANUAL_REVIEW, MANUAL_FAILED}: Application -> UNDERWRITTEN; run calculations.approved_amount"
      - from: DOCS_REQUIRED
        to: DECLINED
        trigger: "POST /platform/applications/{id}/verifications/{verificationId}/manual-decision with outcome FAIL"
        actor: VerificationOfficer
        preconditions:
          - "Application.status == DOCS_REQUIRED (ERR_APPLICATION_INVALID_STATE)"
          - "Verification.status == INSTANT_FAILED or MANUAL_REVIEW (ERR_VERIFICATION_INVALID_STATE)"
        side_effects:
          - "Verification.status := MANUAL_FAILED; reviewer_id := acting officer"
      - from: UNDERWRITTEN
        to: APPROVED
        trigger: "system (bubble-up of POST /platform/applications/{id}/allocate when a holder is chosen)"
        actor: system
        preconditions: []
        side_effects:
          - "Create Loan with holder_partner_id and allocation_channel from the AllocationDecision"
          - "Create AllocationDecision row recording evaluation order and reason codes"
      - from: UNDERWRITTEN
        to: DECLINED
        trigger: "system (allocation exhausted: no eligible holder; channel UNALLOCATED)"
        actor: system
        preconditions: []
        side_effects:
          - "Create AllocationDecision row with channel UNALLOCATED and full rejection reason_codes"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /platform/applications/{id}/withdraw"
        actor: PlatformAdmin
        preconditions:
          - "Application.status == SUBMITTED (ERR_APPLICATION_INVALID_STATE)"
        side_effects: []
      - from: VERIFICATION_PENDING
        to: WITHDRAWN
        trigger: "POST /platform/applications/{id}/withdraw"
        actor: PlatformAdmin
        preconditions:
          - "Application.status == VERIFICATION_PENDING (ERR_APPLICATION_INVALID_STATE)"
        side_effects: []

  - entity: Loan
    initial_state: FUNDED
    terminal_states: [PAID_OFF, CHARGED_OFF]
    transitions:
      - from: FUNDED
        to: CURRENT
        trigger: "system (on the first POST /platform/_clock/set_current_utc advance after funding, or immediately at funding when the funding day is the 1st of the month)"
        actor: system
        preconditions: []
        side_effects:
          - "Create ServicingEvent DELINQUENCY_ADVANCED with amount 0 recording entry into the servicing cycle"
      - from: CURRENT
        to: DELINQUENT
        trigger: "system (POST /platform/loans/{id}/advance-servicing: a full 30-day servicing period elapses without a payment covering monthly_payment_cents)"
        actor: system
        preconditions:
          - "Loan.status == CURRENT (ERR_LOAN_INVALID_STATE)"
        side_effects:
          - "days_delinquent := 30"
          - "Run calculations.late_fee_accrual; late_fee_accrued_cents := computed fee"
          - "Create ServicingEvent LATE_FEE_ASSESSED then DELINQUENCY_ADVANCED"
      - from: DELINQUENT
        to: DELINQUENT
        trigger: "system (POST /platform/loans/{id}/advance-servicing: another unpaid period elapses)"
        actor: system
        preconditions:
          - "Loan.status == DELINQUENT (ERR_LOAN_INVALID_STATE)"
          - "days_delinquent < 120 (ERR_LOAN_INVALID_STATE — at exactly 120 the DEFAULTED transition governs)"
        side_effects:
          - "days_delinquent += 30"
          - "late_fee_accrued_cents += calculations.late_fee_accrual (capped per calculations.late_fee_accrual)"
          - "Create ServicingEvent LATE_FEE_ASSESSED then DELINQUENCY_ADVANCED"
      - from: DELINQUENT
        to: DEFAULTED
        trigger: "system (POST /platform/loans/{id}/advance-servicing when days_delinquent would reach exactly 120)"
        actor: system
        preconditions:
          - "Loan.status == DELINQUENT and days_delinquent == 90 (ERR_LOAN_INVALID_STATE)"
        side_effects:
          - "days_delinquent := 120"
          - "Create ServicingEvent DEFAULT_DECLARED"
      - from: CURRENT
        to: PAID_OFF
        trigger: "system (POST /platform/loans/{id}/payments when outstanding_principal_cents reaches exactly 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Create ServicingEvent PAYOFF_RECORDED with amount of final payment"
          - "Partner.funded_balance_cents of holder recomputed"
      - from: DELINQUENT
        to: CURRENT
        trigger: "system (POST /platform/loans/{id}/payments when payment covers all accrued late fees and brings the loan schedule-current per calculations.payment_waterfall)"
        actor: system
        preconditions: []
        side_effects:
          - "days_delinquent := 0; late_fee_accrued_cents := 0"
          - "Create ServicingEvent PAYMENT_APPLIED"
      - from: DEFAULTED
        to: CHARGED_OFF
        trigger: "POST /platform/loans/{id}/charge-off"
        actor: CollectionsAgent
        preconditions:
          - "Loan.status == DEFAULTED (ERR_LOAN_INVALID_STATE)"
          - "The acting CollectionsAgent's X-User-ID differs from the X-User-ID of the PartnerAdmin who activated the holder partner (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Create ServicingEvent CHARGE_OFF_REPORTED with amount_cents := outstanding_principal_cents + late_fee_accrued_cents"
          - "If allocation_channel == SECURITIZATION: SecuritizationPool.allocated_principal_cents -= Loan.principal_cents"
          - "Partner.funded_balance_cents of holder recomputed (loan remains counted while CHARGED_OFF per Partner.funded_balance_cents definition)"

  - entity: SecuritizationPool
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /platform/securitization-pools/{id}/close"
        actor: PartnerAdmin
        preconditions:
          - "SecuritizationPool.status == OPEN (ERR_POOL_INVALID_STATE)"
        side_effects:
          - "Pool no longer accepts allocations; loans already placed remain placed"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: credit-box-activation-stale-partner
    parent_entity: Partner
    write_endpoint: "POST /platform/partners/{id}/credit-boxes/{boxId}/activate"
    occ_field: "expected_partner_version"
    description: |
      Activating a CreditBox against a Partner whose version has advanced since
      the client last observed it is rejected. Activating a box supersedes the
      partner's previously ACTIVE box (a legitimate supersede under the credit
      box lifecycle), so a client holding a stale partner view must not be
      allowed to chain another supersede onto a configuration it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: model-draft-edit-stale-version
    parent_entity: ModelVersion
    write_endpoint: "PATCH /platform/model-versions/{id}"
    occ_field: "expected_model_version"
    description: |
      Editing a DRAFT ModelVersion whose version has advanced since the client
      last observed it is rejected. A prior edit already replaced the variable
      set the current writer believes it is amending; the stale writer must
      re-read before overwriting.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: loan-payment-stale-version
    parent_entity: Loan
    write_endpoint: "POST /platform/loans/{id}/payments"
    occ_field: "expected_loan_version"
    description: |
      Posting a payment against a Loan whose version has advanced since the
      client last observed it is rejected. Servicing recomputes (payment
      waterfall, late-fee accrual, payoff) all move outstanding balances, so a
      payment computed from a stale balance snapshot must not be applied.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: risk_score
    trigger: "Application submission (POST /platform/applications), inline before the verification branch"
    algorithm: weighted_scoring
    formula: |
      Inputs from Applicant and the ACTIVE ModelVersion's variables.
      score = 0
      for each variable v in model.variables (evaluated in the order listed in model.variables):
        x = applicant field named by v.name
        if x < v.min: contribution = 0
        elif x > v.max: contribution = v.weight * 100
        else: contribution = v.weight * 100 * (x - v.min) / (v.max - v.min)
        score += contribution   # running float, no intermediate rounding
      Final: round_half_up(score) to integer, then clamp into [model.score_floor, model.score_ceiling].
    input_set: "The Applicant row referenced by the new Application and the single ModelVersion in status ACTIVE at submission instant"
    constants:
      FLOOR_REJECT_SCORE: 300
    precision: "final integer via round_half_up on the float total; clamp after rounding"
    variants:
      - name: cashflow_stressed_variant
        when: "ModelVersion.variables contains at least one variable whose name starts with 'bank_account'"
        difference: "When cash-flow variables are present, a 0.9 stress multiplier is applied to the cash-flow variable contributions only (not bureau/education/employment) before summing"
      - name: bureau_only_variant
        when: "ModelVersion.variables contains no variable whose name starts with 'bank_account'"
        difference: "No stress multiplier; raw weighted sum as in the base formula"

  - name: debt_to_income_pct
    trigger: "Application submission, computed alongside risk_score"
    algorithm: aggregation
    formula: |
      monthly_income_cents = floor(applicant.annual_income_cents / 12)
      if monthly_income_cents <= 0: debt_to_income_pct = 100.0
      else: debt_to_income_pct = round_half_up(100.0 * applicant.monthly_debt_payments_cents / monthly_income_cents, 2)
    input_set: "Applicant row only"
    precision: "2 decimal places, round_half_up"

  - name: approved_amount
    trigger: "Application reaching UNDERWRITTEN"
    algorithm: threshold
    formula: |
      monthly_income_cents = floor(applicant.annual_income_cents / 12)
      capacity_cents = max(0, floor(monthly_income_cents * 0.40) - applicant.monthly_debt_payments_cents)
      max_supportable_principal_cents = floor(capacity_cents * 30)
      approved_amount_cents = min(application.requested_amount_cents, max_supportable_principal_cents)
      If approved_amount_cents <= 0 the application is DECLINED at allocation with reason code AFFORDABILITY_ZERO.
    input_set: "Application + its Applicant"
    constants:
      DTI_CAPACITY_RATIO: 0.40
      DTI_CAPACITY_RATIO_MANUAL_REVIEW: 0.32
      TERM_CAPACITY_MULTIPLIER: 30
    precision: "integer cents, floor at each step"
    variants:
      - name: standard_capacity_variant
        when: "The applicant's verification path never required manual document review (both verifications reached INSTANT_PASSED)"
        difference: "capacity_cents uses DTI_CAPACITY_RATIO 0.40 as stated in the base formula"
      - name: manual_review_haircut_variant
        when: "At least one verification on the application reached MANUAL_PASSED (the manual document-review fallback was exercised)"
        difference: "capacity_cents uses a reduced DTI capacity ratio of 0.32 instead of 0.40, so identical applicants receive strictly smaller approved amounts whenever manual review was involved"

  - name: allocation_selector
    trigger: "POST /platform/applications/{id}/allocate on an UNDERWRITTEN application"
    algorithm: waterfall_allocation
    formula: |
      Evaluation order is fixed by channel priority:
        Step 1 (referral): if application.channel == PARTNER_REFERRAL:
          candidate = application.referral_partner_id partner (channel REFERRAL_RETAINED)
          if eligible(candidate): allocate and stop; else record reason codes and CONTINUE to step 2 (referral failure never blocks other channels)
        Step 2 (retained): for each Partner with partner_type in {BANK, CREDIT_UNION}, status == ACTIVE, in order of Partner.created_at ASC (tie-break: none needed, created_at is unique):
          channel PARTNER_RETAINED; if eligible(candidate): allocate and stop; else record reason codes
        Step 3 (whole-loan): for each Partner with partner_type == LOAN_BUYER, status == ACTIVE, in order of Partner.created_at ASC:
          channel WHOLE_LOAN_SALE; whole-loan buyers are eligible if and only if the buyer has an ACTIVE credit box whose allowed_states contains the applicant state and [min_score, max_score] contains risk_score and [min_loan_cents, max_loan_cents] contains approved_amount_cents (buyers have no monthly_volume_cap enforcement)
          if eligible: allocate and stop
        Step 4 (securitization): for each SecuritizationPool with status == OPEN whose owning trust partner is ACTIVE, in order of SecuritizationPool.created_at ASC:
          eligible iff loan principal_cents <= pool.max_single_loan_cents AND pool.allocated_principal_cents + loan.principal_cents <= pool.target_principal_cents
          if eligible: allocate with channel SECURITIZATION, holder = pool.trust_partner_id, pool.allocated_principal_cents += principal_cents; stop
        Step 5: no eligible holder -> channel UNALLOCATED, Application -> DECLINED
      Partner eligibility for steps 1-2 (retained channels), all of:
        partner.status == ACTIVE
        partner.active_credit_box_id is not null; box.status == ACTIVE
        box.allowed_states contains applicant.state_code
        box.min_score <= application.risk_score <= box.max_score
        box.min_loan_cents <= application.approved_amount_cents <= box.max_loan_cents
        partner.originated_this_month_count < box.monthly_volume_cap_count
      Reason codes recorded per rejected candidate, in order of first failure:
        PARTNER_INACTIVE, NO_ACTIVE_CREDIT_BOX, STATE_NOT_ALLOWED, SCORE_BELOW_BOX, SCORE_ABOVE_BOX,
        AMOUNT_BELOW_BOX, AMOUNT_ABOVE_BOX, VOLUME_CAP_REACHED, POOL_SINGLE_LOAN_EXCEEDED, POOL_CAPACITY_EXCEEDED
    input_set: "Application (UNDERWRITTEN), all Partners, their ACTIVE CreditBoxes, all OPEN SecuritizationPools"
    precision: "integer cents comparisons; boundaries inclusive on both score and amount"
    variants: []

  - name: payment_waterfall
    trigger: "POST /platform/loans/{id}/payments"
    algorithm: waterfall_allocation
    formula: |
      Buckets in strict order: (1) late_fee_accrued_cents, (2) scheduled_interest_cents for the current period, (3) outstanding_principal_cents.
      payment_cents is applied to bucket 1 until exhausted, remainder to bucket 2, remainder to bucket 3.
      Overpayment beyond all three buckets: reduce outstanding_principal_cents below-schedule; if outstanding_principal_cents reaches exactly 0 -> Loan PAID_OFF.
      A loan returns DELINQUENT -> CURRENT only when the posted payment covers bucket 1 in full AND bucket 2 in full for every elapsed unpaid period (i.e., the full catch-up amount).
      Rounding: per-payment rounding order is PINNED — compute each bucket debit as an exact integer-cent subtraction in the order above; never re-round the total after splitting (sum-then-round is FORBIDDEN here).
    input_set: "The Loan row and the posted payment amount"
    precision: "integer cents; bucket order is late fees -> interest -> principal, strictly sequential"

  - name: amortization_schedule
    trigger: "Loan funding (creation)"
    algorithm: constraint_propagation
    formula: |
      monthly_rate = apr / 12 / 100   (apr stored as percentage number, e.g. 9.5 means 9.5%)
      n = term_months (36)
      monthly_payment_cents = round_half_up(principal_cents * monthly_rate / (1 - (1 + monthly_rate) ** -n))
      scheduled_interest_cents for period k = round_half_up(outstanding_principal_at_start_of_period_k * monthly_rate)
    input_set: "Loan principal_cents, apr, term_months"
    precision: "round_half_up to integer cents at each period; monthly_payment computed once at funding and frozen"
    variants: []

  - name: late_fee_accrual
    trigger: "Loan entering or advancing DELINQUENT"
    algorithm: threshold
    formula: |
      fee = min(round_half_up(0.05 * monthly_payment_cents), 1500)
      Per missed period one fee is assessed; late_fee_accrued_cents accumulates across periods with NO aggregate cap beyond the per-period min() cap.
      At days_delinquent == 30 the first fee is assessed; each further 30-day advance assesses one more.
    input_set: "Loan.monthly_payment_cents"
    constants:
      LATE_FEE_RATE: 0.05
      LATE_FEE_CAP_CENTS: 1500
    precision: "integer cents, round_half_up per fee assessment before accumulation"

  - name: instant_verification
    trigger: "POST /platform/applications/{id}/verifications/{verificationId}/instant-check"
    algorithm: threshold
    formula: |
      INCOME verification: INSTANT_PASSED iff applicant.bank_account_nsf_count_90d < 3 AND applicant.monthly_net_cashflow_cents > 0; else INSTANT_FAILED.
      IDENTITY verification: INSTANT_PASSED iff applicant.months_employed >= 3 AND applicant.bureau_score >= 500; else INSTANT_FAILED.
      Both thresholds are inclusive-exclusive exactly as written (nsf_count == 3 fails; months_employed == 3 passes).
    input_set: "The Application's Applicant row"
    constants:
      NSF_INSTANT_FAIL_THRESHOLD: 3
      MIN_MONTHS_EMPLOYED: 3
      MIN_BUREAU_SCORE: 500
    precision: "integer comparisons; boundary behavior pinned per threshold"
    variants: []

  - name: disparate_impact_analysis
    trigger: "ModelVersion validation AND FairnessReview recompute"
    algorithm: aggregation
    formula: |
      Cohort: all Applications scored by this ModelVersion whose status is APPROVED or DECLINED (terminal outcomes only).
      Group A: applications whose applicant education_level in {BACHELOR, MASTER, DOCTORATE}
      Group B: applications whose applicant education_level in {HIGH_SCHOOL, ASSOCIATE}
      approval_rate(G) = count(APPROVED in G) / count(G); a group with count 0 has rate 1.0 by convention
      disparate_impact_ratio = min(rateA, rateB) / max(rateA, rateB); when both rates are 0 the ratio is 1.0
      outcome PASSED iff disparate_impact_ratio >= 0.80 else FAILED
      Selection-rate rounding: compute rates as exact rationals; compare ratio >= 0.80 without intermediate rounding.
    input_set: "Applications with model_version_id == this model and status in {APPROVED, DECLINED}"
    constants:
      FOUR_FIFTHS_THRESHOLD: 0.80
    precision: "exact rational comparison at the 0.80 boundary (4/5 rule); >= passes"

  - name: performance_attestation
    trigger: "POST /platform/model-versions/{id}/attestations"
    algorithm: aggregation
    formula: |
      expected_default_rate_bps = partner-specific projection stored at attestation issuance:
        base 500 bps, adjusted +10 bps per point that the partner's held-book average risk_score is below 550, floor 0.
        held-book average risk_score = round_half_up(mean of risk_score of Applications that produced Loans with holder_partner_id == partner); if the partner holds no loans, expected_default_rate_bps = 500.
      actual_default_rate_bps = round_half_up(10000 * charged_off_count / funded_count) where
        charged_off_count = Loans with holder_partner_id == partner and status == CHARGED_OFF
        funded_count = Loans with holder_partner_id == partner that ever reached FUNDED (i.e., all Loans with that holder)
        if funded_count == 0: actual_default_rate_bps = 0
      variance_bps = actual_default_rate_bps - expected_default_rate_bps
    input_set: "Loans of the partner + their source Applications; computed at issuance instant"
    precision: "integer basis points, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right (partner before credit-box; application before verification; model before attestation)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints with path ids

  - priority: 4
    category: existence
    check: "Body foreign keys resolve in declared input order (applicant_id before referral_partner_id; model_version_id before partner_id)"
    error_id: ERR_REFERENCED_NOT_FOUND
    http_status: 404
    applies_to: "POST /platform/applications, POST /platform/model-versions/{id}/attestations, POST /platform/fairness-reviews"

  - priority: 5
    category: state
    check: "Target resource in a state from which the requested transition exists"
    error_id: ERR_APPLICATION_INVALID_STATE | ERR_MODEL_INVALID_STATE | ERR_PARTNER_INVALID_STATE | ERR_CREDIT_BOX_INVALID_STATE | ERR_VERIFICATION_INVALID_STATE | ERR_LOAN_INVALID_STATE | ERR_POOL_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: model validate creator != validator; manual verification decider != instant-check runner; charge-off agent != partner activator"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST .../validate, POST .../manual-decision, POST .../charge-off"

  - priority: 7
    category: business_safety
    check: "Model governance gate: activate requires no FAILED fairness review, >= 1 PASSED disparate-impact review, no PENDING variable-exclusion review"
    error_id: ERR_FAIRNESS_GATE_BLOCKING | ERR_EXCLUSION_REVIEW_OPEN
    http_status: 409
    applies_to: "POST /platform/model-versions/{id}/activate"

  - priority: 8
    category: business_constraint
    check: "Structural field constraints: enums in range, min<=max pairs, effective_from < effective_to, positive amounts, PARTNER_REFERRAL requires referral_partner_id and DIRECT forbids it"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "create/patch endpoints"

  - priority: 9
    category: business_constraint
    check: "Model availability: application submission requires exactly one ACTIVE model"
    error_id: ERR_NO_ACTIVE_MODEL
    http_status: 409
    applies_to: "POST /platform/applications"

  - priority: 10
    category: business_temporal
    check: "Credit box activation window: effective_from <= now <= effective_to on the logical clock"
    error_id: ERR_CREDIT_BOX_NOT_IN_WINDOW
    http_status: 409
    applies_to: "POST .../credit-boxes/{boxId}/activate"

  - priority: 11
    category: business_fiscal
    check: "Partner offboard requires zero funded balance"
    error_id: ERR_PARTNER_HOLDS_LOANS
    http_status: 409
    applies_to: "POST /platform/partners/{id}/offboard"

  - priority: 12
    category: business_fiscal
    check: "Payment amount positive and loan in a payable state (CURRENT or DELINQUENT)"
    error_id: ERR_PAYMENT_INVALID
    http_status: 422
    applies_to: "POST /platform/loans/{id}/payments"

  - priority: 13
    category: business_referential
    check: "OCC: expected_*_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /platform/model-versions/{id}, POST .../credit-boxes/{boxId}/activate, POST /platform/loans/{id}/payments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/platform/_clock/set_current_utc"
    description: "Set the platform logical clock. Before any call to this endpoint the logical clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time. All time-window checks (credit-box windows, servicing month boundaries) read this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Advances the logical clock; FUNDED loans become CURRENT on first advance"]

  # --- ModelVersion ---
  - method: POST
    path: "/platform/model-versions"
    description: "Create a ModelVersion in DRAFT"
    roles: [RiskOfficer]
    code: 201
    input: [model_code, variables, calibration_note, score_floor, score_ceiling]
    output: ModelVersion
    side_effects: ["status=DRAFT; created_by_user_id recorded from X-User-ID"]

  - method: GET
    path: "/platform/model-versions/{id}"
    description: "Get a ModelVersion"
    roles: [PlatformAdmin, RiskOfficer, PartnerAdmin, ServicingAgent, CollectionsAgent, VerificationOfficer, Auditor]
    code: 200
    input: []
    output: ModelVersion
    side_effects: []

  - method: GET
    path: "/platform/model-versions"
    description: "List ModelVersions"
    roles: [PlatformAdmin, RiskOfficer, PartnerAdmin, ServicingAgent, CollectionsAgent, VerificationOfficer, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ModelVersion[]"
    side_effects: []

  - method: PATCH
    path: "/platform/model-versions/{id}"
    description: "Edit a DRAFT ModelVersion (OCC on model version)"
    roles: [RiskOfficer]
    code: 200
    input: [variables, score_floor, score_ceiling, expected_model_version]
    output: ModelVersion
    side_effects: ["increments ModelVersion.version by 1"]

  - method: POST
    path: "/platform/model-versions/{id}/validate"
    description: "Validate a DRAFT model (runs disparate-impact analysis, stamps fairness_report)"
    roles: [RiskOfficer]
    code: 200
    input: []
    output: ModelVersion
    side_effects: ["status -> VALIDATED; fairness_report computed"]

  - method: POST
    path: "/platform/model-versions/{id}/activate"
    description: "Activate a VALIDATED model after governance gates"
    roles: [RiskOfficer]
    code: 200
    input: []
    output: ModelVersion
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/platform/model-versions/{id}/retire"
    description: "Retire a model"
    roles: [RiskOfficer]
    code: 200
    input: []
    output: ModelVersion
    side_effects: ["status -> RETIRED"]

  # --- FairnessReview ---
  - method: POST
    path: "/platform/fairness-reviews"
    description: "Open a fairness review (VARIABLE_EXCLUSION or DISPARATE_IMPACT) on a model"
    roles: [RiskOfficer]
    code: 201
    input: [model_version_id, review_type, details]
    output: FairnessReview
    side_effects: ["outcome=PENDING; DISPARATE_IMPACT reviews recompute disparate_impact_analysis on decision"]

  - method: GET
    path: "/platform/fairness-reviews"
    description: "List fairness reviews"
    roles: [PlatformAdmin, RiskOfficer, PartnerAdmin, ServicingAgent, CollectionsAgent, VerificationOfficer, Auditor]
    code: 200
    input: ["model_version_id?", "review_type?", "outcome?", "limit?", "offset?"]
    output: "FairnessReview[]"
    side_effects: []

  - method: GET
    path: "/platform/fairness-reviews/{id}"
    description: "Get a fairness review"
    roles: [PlatformAdmin, RiskOfficer, PartnerAdmin, ServicingAgent, CollectionsAgent, VerificationOfficer, Auditor]
    code: 200
    input: []
    output: FairnessReview
    side_effects: []

  - method: POST
    path: "/platform/fairness-reviews/{id}/decide"
    description: "Decide a fairness review"
    roles: [RiskOfficer]
    code: 200
    input: [outcome]
    output: FairnessReview
    side_effects: ["outcome := PASSED or FAILED"]

  # --- Attestation ---
  - method: POST
    path: "/platform/model-versions/{id}/attestations"
    description: "Issue a performance attestation to a partner for the model"
    roles: [RiskOfficer]
    code: 201
    input: [partner_id, period_label]
    output: Attestation
    side_effects: ["runs calculations.performance_attestation; attested_by_user_id recorded"]

  - method: GET
    path: "/platform/attestations"
    description: "List attestations"
    roles: [PlatformAdmin, RiskOfficer, PartnerAdmin, ServicingAgent, CollectionsAgent, VerificationOfficer, Auditor]
    code: 200
    input: ["model_version_id?", "partner_id?", "limit?", "offset?"]
    output: "Attestation[]"
    side_effects: []

  - method: GET
    path: "/platform/attestations/{id}"
    description: "Get an attestation"
    roles: [PlatformAdmin, RiskOfficer, PartnerAdmin, ServicingAgent, CollectionsAgent, VerificationOfficer, Auditor]
    code: 200
    input: []
    output: Attestation
    side_effects: []

  # --- Partner ---
  - method: POST
    path: "/platform/partners"
    description: "Onboard a partner"
    roles: [PartnerAdmin]
    code: 201
    input: [legal_name, partner_type, home_state]
    output: Partner
    side_effects: ["status=ONBOARDING; activated_by_user_id recorded at activation"]

  - method: GET
    path: "/platform/partners/{id}"
    description: "Get a partner"
    roles: [PlatformAdmin, RiskOfficer, PartnerAdmin, ServicingAgent, CollectionsAgent, VerificationOfficer, Auditor]
    code: 200
    input: []
    output: Partner
    side_effects: []

  - method: GET
    path: "/platform/partners"
    description: "List partners"
    roles: [PlatformAdmin, RiskOfficer, PartnerAdmin, ServicingAgent, CollectionsAgent, VerificationOfficer, Auditor]
    code: 200
    input: ["partner_type?", "status?", "active_credit_box_id?", "limit?", "offset?"]
    output: "Partner[]"
    side_effects: []

  - method: POST
    path: "/platform/partners/{id}/activate"
    description: "Activate an ONBOARDING or SUSPENDED partner"
    roles: [PartnerAdmin]
    code: 200
    input: []
    output: Partner
    side_effects: ["status -> ACTIVE; activated_by_user_id := X-User-ID"]

  - method: POST
    path: "/platform/partners/{id}/suspend"
    description: "Suspend a partner (excludes its credit box from allocation)"
    roles: [PartnerAdmin]
    code: 200
    input: []
    output: Partner
    side_effects: ["status -> SUSPENDED"]

  - method: POST
    path: "/platform/partners/{id}/offboard"
    description: "Offboard a partner with zero funded balance"
    roles: [PartnerAdmin]
    code: 200
    input: []
    output: Partner
    side_effects: ["status -> OFFBOARDED; cascades credit boxes and pools"]

  # --- CreditBox ---
  - method: POST
    path: "/platform/partners/{id}/credit-boxes"
    description: "Create a credit box in DRAFT"
    roles: [PartnerAdmin]
    code: 201
    input: [min_score, max_score, allowed_states, min_loan_cents, max_loan_cents, monthly_volume_cap_count, annual_percentage_rate, effective_from, effective_to]
    output: CreditBox
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/platform/partners/{id}/credit-boxes"
    description: "List a partner's credit boxes"
    roles: [PlatformAdmin, RiskOfficer, PartnerAdmin, ServicingAgent, CollectionsAgent, VerificationOfficer, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CreditBox[]"
    side_effects: []

  - method: GET
    path: "/platform/credit-boxes/{id}"
    description: "Get a credit box"
    roles: [PlatformAdmin, RiskOfficer, PartnerAdmin, ServicingAgent, CollectionsAgent, VerificationOfficer, Auditor]
    code: 200
    input: []
    output: CreditBox
    side_effects: []

  - method: POST
    path: "/platform/partners/{id}/credit-boxes/{boxId}/activate"
    description: "Activate a DRAFT credit box (OCC on partner version); supersedes the partner's previously ACTIVE box"
    roles: [PartnerAdmin]
    code: 200
    input: [expected_partner_version]
    output: CreditBox
    side_effects: ["status -> ACTIVE; previous ACTIVE box -> SUPERSEDED; Partner.active_credit_box_id updated; increments Partner.version by 1"]

  - method: POST
    path: "/platform/partners/{id}/credit-boxes/{boxId}/retire"
    description: "Retire a DRAFT credit box"
    roles: [PartnerAdmin]
    code: 200
    input: []
    output: CreditBox
    side_effects: ["status -> RETIRED"]

  # --- Applicant ---
  - method: POST
    path: "/platform/applicants"
    description: "Register an applicant"
    roles: [PlatformAdmin, VerificationOfficer]
    code: 201
    input: [full_name, state_code, annual_income_cents, monthly_debt_payments_cents, education_level, employment_status, months_employed, bank_account_avg_balance_cents, bank_account_nsf_count_90d, monthly_net_cashflow_cents, bureau_score]
    output: Applicant
    side_effects: []

  - method: GET
    path: "/platform/applicants/{id}"
    description: "Get an applicant"
    roles: [PlatformAdmin, RiskOfficer, PartnerAdmin, ServicingAgent, CollectionsAgent, VerificationOfficer, Auditor]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  - method: GET
    path: "/platform/applicants"
    description: "List applicants"
    roles: [PlatformAdmin, RiskOfficer, PartnerAdmin, ServicingAgent, CollectionsAgent, VerificationOfficer, Auditor]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: "Applicant[]"
    side_effects: []

  # --- Application ---
  - method: POST
    path: "/platform/applications"
    description: "Submit an application; snapshots the ACTIVE model, computes risk_score and debt_to_income_pct, creates verification rows unless auto-declined"
    roles: [PlatformAdmin]
    code: 201
    input: [applicant_id, channel, "referral_partner_id?", requested_amount_cents]
    output: Application
    side_effects: ["model_version_id snapshot; risk_score computed; Verification rows created (unless auto-declined)"]

  - method: GET
    path: "/platform/applications/{id}"
    description: "Get an application"
    roles: [PlatformAdmin, RiskOfficer, PartnerAdmin, ServicingAgent, CollectionsAgent, VerificationOfficer, Auditor]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/platform/applications"
    description: "List applications"
    roles: [PlatformAdmin, RiskOfficer, PartnerAdmin, ServicingAgent, CollectionsAgent, VerificationOfficer, Auditor]
    code: 200
    input: ["applicant_id?", "referral_partner_id?", "model_version_id?", "status?", "channel?", "limit?", "offset?"]
    output: "Application[]"
    side_effects: []

  - method: POST
    path: "/platform/applications/{id}/withdraw"
    description: "Withdraw an application"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> WITHDRAWN"]

  - method: POST
    path: "/platform/applications/{id}/allocate"
    description: "Run the allocation waterfall over an UNDERWRITTEN application; creates Loan + AllocationDecision on success, AllocationDecision(UNALLOCATED) + DECLINED on exhaustion"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: AllocationDecision
    side_effects: ["Application -> APPROVED or DECLINED; Loan created on success; SecuritizationPool.allocated_principal_cents incremented when channel == SECURITIZATION"]

  # --- Verification ---
  - method: GET
    path: "/platform/applications/{id}/verifications"
    description: "List an application's verifications"
    roles: [PlatformAdmin, RiskOfficer, PartnerAdmin, ServicingAgent, CollectionsAgent, VerificationOfficer, Auditor]
    code: 200
    input: ["kind?", "status?", "limit?", "offset?"]
    output: "Verification[]"
    side_effects: []

  - method: POST
    path: "/platform/applications/{id}/verifications/{verificationId}/instant-check"
    description: "Run instant verification (income/identity) for a PENDING verification"
    roles: [VerificationOfficer]
    code: 200
    input: []
    output: Verification
    side_effects: ["Verification -> INSTANT_PASSED or INSTANT_FAILED; instant_checker_user_id recorded; Application bubble-up to UNDERWRITTEN or DOCS_REQUIRED"]

  - method: POST
    path: "/platform/applications/{id}/verifications/{verificationId}/manual-decision"
    description: "Manual document-review decision for a failed instant verification (segregation of duties vs instant checker)"
    roles: [VerificationOfficer]
    code: 200
    input: [outcome]
    output: Verification
    side_effects: ["Verification -> MANUAL_PASSED or MANUAL_FAILED; reviewer_id := X-User-ID; Application bubble-up"]

  # --- Loan ---
  - method: GET
    path: "/platform/loans/{id}"
    description: "Get a loan"
    roles: [PlatformAdmin, RiskOfficer, PartnerAdmin, ServicingAgent, CollectionsAgent, VerificationOfficer, Auditor]
    code: 200
    input: []
    output: Loan
    side_effects: []

  - method: GET
    path: "/platform/loans"
    description: "List loans"
    roles: [PlatformAdmin, RiskOfficer, PartnerAdmin, ServicingAgent, CollectionsAgent, VerificationOfficer, Auditor]
    code: 200
    input: ["holder_partner_id?", "application_id?", "status?", "allocation_channel?", "limit?", "offset?"]
    output: "Loan[]"
    side_effects: []

  - method: POST
    path: "/platform/loans/{id}/payments"
    description: "Post a payment through the waterfall (OCC on loan version)"
    roles: [ServicingAgent]
    code: 200
    input: [amount_cents, expected_loan_version]
    output: Loan
    side_effects: ["runs calculations.payment_waterfall; ServicingEvent PAYMENT_APPLIED (+ PAYOFF_RECORDED at zero balance); increments Loan.version by 1"]

  - method: POST
    path: "/platform/loans/{id}/advance-servicing"
    description: "Advance the loan one 30-day servicing period (late fee, delinquency escalation, default at 120 days)"
    roles: [ServicingAgent]
    code: 200
    input: []
    output: Loan
    side_effects: ["runs calculations.late_fee_accrual; days_delinquent += 30; ServicingEvents recorded; increments Loan.version by 1"]

  - method: POST
    path: "/platform/loans/{id}/charge-off"
    description: "Charge off a DEFAULTED loan and report to the holder"
    roles: [CollectionsAgent]
    code: 200
    input: []
    output: Loan
    side_effects: ["status -> CHARGED_OFF; ServicingEvent CHARGE_OFF_REPORTED; securitization pool balance released"]

  # --- ServicingEvent ---
  - method: GET
    path: "/platform/loans/{id}/servicing-events"
    description: "List a loan's servicing events in chronological order (occurred_at ASC)"
    roles: [PlatformAdmin, RiskOfficer, PartnerAdmin, ServicingAgent, CollectionsAgent, VerificationOfficer, Auditor]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: "ServicingEvent[]"
    side_effects: []

  # --- SecuritizationPool ---
  - method: POST
    path: "/platform/securitization-pools"
    description: "Create a securitization pool under a SECURITIZATION_TRUST partner"
    roles: [PartnerAdmin]
    code: 201
    input: [trust_partner_id, pool_label, target_principal_cents, max_single_loan_cents]
    output: SecuritizationPool
    side_effects: ["status=OPEN; allocated_principal_cents=0"]

  - method: GET
    path: "/platform/securitization-pools/{id}"
    description: "Get a securitization pool"
    roles: [PlatformAdmin, RiskOfficer, PartnerAdmin, ServicingAgent, CollectionsAgent, VerificationOfficer, Auditor]
    code: 200
    input: []
    output: SecuritizationPool
    side_effects: []

  - method: GET
    path: "/platform/securitization-pools"
    description: "List securitization pools"
    roles: [PlatformAdmin, RiskOfficer, PartnerAdmin, ServicingAgent, CollectionsAgent, VerificationOfficer, Auditor]
    code: 200
    input: ["trust_partner_id?", "status?", "limit?", "offset?"]
    output: "SecuritizationPool[]"
    side_effects: []

  - method: POST
    path: "/platform/securitization-pools/{id}/close"
    description: "Close a pool to new allocations"
    roles: [PartnerAdmin]
    code: 200
    input: []
    output: SecuritizationPool
    side_effects: ["status -> CLOSED"]

  # --- AllocationDecision ---
  - method: GET
    path: "/platform/allocation-decisions"
    description: "List allocation decisions"
    roles: [PlatformAdmin, RiskOfficer, PartnerAdmin, ServicingAgent, CollectionsAgent, VerificationOfficer, Auditor]
    code: 200
    input: ["application_id?", "channel?", "chosen_partner_id?", "limit?", "offset?"]
    output: "AllocationDecision[]"
    side_effects: []

  - method: GET
    path: "/platform/allocation-decisions/{id}"
    description: "Get an allocation decision"
    roles: [PlatformAdmin, RiskOfficer, PartnerAdmin, ServicingAgent, CollectionsAgent, VerificationOfficer, Auditor]
    code: 200
    input: []
    output: AllocationDecision
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing, malformed, or role not recognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Authenticated role is not permitted to call this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist (checked left-to-right along the path)" }
  - { id: ERR_REFERENCED_NOT_FOUND, http: 404, condition: "A body foreign key (applicant_id, referral_partner_id, model_version_id, partner_id) does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, min>max pair, non-positive amount, effective_from >= effective_to, PARTNER_REFERRAL without referral_partner_id, or DIRECT with referral_partner_id" }
  - { id: ERR_APPLICATION_INVALID_STATE, http: 409, condition: "Application not in a state that permits the requested transition" }
  - { id: ERR_MODEL_INVALID_STATE, http: 409, condition: "ModelVersion not in a state that permits the requested transition" }
  - { id: ERR_MODEL_LOCKED, http: 409, condition: "PATCH attempted on a ModelVersion no longer in DRAFT" }
  - { id: ERR_MODEL_ALREADY_ACTIVE, http: 409, condition: "Another ModelVersion is already ACTIVE; only one may be ACTIVE at a time" }
  - { id: ERR_MODEL_HAS_OPEN_APPLICATIONS, http: 409, condition: "Retire blocked: non-terminal applications still reference this model" }
  - { id: ERR_NO_ACTIVE_MODEL, http: 409, condition: "Application submission requires exactly one ACTIVE model; none exists" }
  - { id: ERR_PARTNER_INVALID_STATE, http: 409, condition: "Partner not in a state that permits the requested transition" }
  - { id: ERR_PARTNER_HOLDS_LOANS, http: 409, condition: "Offboard blocked: partner's funded_balance_cents is non-zero" }
  - { id: ERR_CREDIT_BOX_INVALID_STATE, http: 409, condition: "CreditBox not in a state that permits the requested transition" }
  - { id: ERR_CREDIT_BOX_NOT_IN_WINDOW, http: 409, condition: "Logical clock is outside [effective_from, effective_to] at activation" }
  - { id: ERR_VERIFICATION_INVALID_STATE, http: 409, condition: "Verification not in a state that permits the requested action" }
  - { id: ERR_LOAN_INVALID_STATE, http: 409, condition: "Loan not in a state that permits the requested servicing action" }
  - { id: ERR_POOL_INVALID_STATE, http: 409, condition: "SecuritizationPool not OPEN for the requested action" }
  - { id: ERR_FAIRNESS_GATE_BLOCKING, http: 409, condition: "Model activation blocked: a FAILED fairness review exists or no PASSED DISPARATE_IMPACT review exists" }
  - { id: ERR_EXCLUSION_REVIEW_OPEN, http: 409, condition: "Model activation blocked: a VARIABLE_EXCLUSION review is still PENDING" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "The acting user is the same user who performed the prior custody step (model creation vs validation, instant check vs manual decision, partner activation vs charge-off)" }
  - { id: ERR_PAYMENT_INVALID, http: 422, condition: "Payment amount non-positive, or loan not in CURRENT or DELINQUENT" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Catch-all schema violation not covered by a more specific error" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator: runs the logical clock, registers applicants, submits applications, runs allocation, withdraws applications"
    identity: opaque
    exclusive_operations:
      - "POST /platform/_clock/set_current_utc"
      - "POST /platform/applications"
      - "POST /platform/applications/{id}/withdraw"
      - "POST /platform/applications/{id}/allocate"
    shared_operations:
      - "POST /platform/applicants"
      - "All GET endpoints"

  - name: RiskOfficer
    description: "Model risk & governance: drafts, validates, activates and retires models; opens and decides fairness reviews; issues attestations"
    identity: opaque
    exclusive_operations:
      - "POST /platform/model-versions"
      - "PATCH /platform/model-versions/{id}"
      - "POST /platform/model-versions/{id}/validate"
      - "POST /platform/model-versions/{id}/activate"
      - "POST /platform/model-versions/{id}/retire"
      - "POST /platform/fairness-reviews"
      - "POST /platform/fairness-reviews/{id}/decide"
      - "POST /platform/model-versions/{id}/attestations"
    shared_operations:
      - "All GET endpoints"

  - name: PartnerAdmin
    description: "Bank/CU/buyer/trust configuration: onboards and lifecycle-manages partners, credit boxes, and securitization pools"
    identity: opaque
    exclusive_operations:
      - "POST /platform/partners"
      - "POST /platform/partners/{id}/activate"
      - "POST /platform/partners/{id}/suspend"
      - "POST /platform/partners/{id}/offboard"
      - "POST /platform/partners/{id}/credit-boxes"
      - "POST /platform/partners/{id}/credit-boxes/{boxId}/activate"
      - "POST /platform/partners/{id}/credit-boxes/{boxId}/retire"
      - "POST /platform/securitization-pools"
      - "POST /platform/securitization-pools/{id}/close"
    shared_operations:
      - "All GET endpoints"

  - name: VerificationOfficer
    description: "Verification desk: runs instant checks and manual document-review decisions"
    identity: opaque
    exclusive_operations:
      - "POST /platform/applications/{id}/verifications/{verificationId}/instant-check"
      - "POST /platform/applications/{id}/verifications/{verificationId}/manual-decision"
    shared_operations:
      - "POST /platform/applicants"
      - "All GET endpoints"

  - name: ServicingAgent
    description: "Loan servicing: posts payments and advances servicing periods"
    identity: opaque
    exclusive_operations:
      - "POST /platform/loans/{id}/payments"
      - "POST /platform/loans/{id}/advance-servicing"
    shared_operations:
      - "All GET endpoints"

  - name: CollectionsAgent
    description: "Collections: charges off defaulted loans and reports to holders"
    identity: opaque
    exclusive_operations:
      - "POST /platform/loans/{id}/charge-off"
    shared_operations:
      - "All GET endpoints"

  - name: Auditor
    description: "Read-only oversight"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
