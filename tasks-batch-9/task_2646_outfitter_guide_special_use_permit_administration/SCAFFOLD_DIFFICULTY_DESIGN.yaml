          assert:
            - "Guide.${g1_id}.base_client_capacity == 10 (min(8, 8) + min(2, floor(7/3)) = 8 + 2)"
            - "Guide.${g2_id}.base_client_capacity == 4 (min(4, 4) + min(2, floor(2/3)) = 4 + 0)"
            - "Guide.${g3_id}.base_client_capacity == 6 (min(8, 4) + min(2, floor(9/3)) = 4 + 2) — higher level and more seasons than ${g2_id} yet the certification tier binds"
            - "Guide.${g4_id}.base_client_capacity == 0 — the TRAINEE short-circuit beats WEMT and the maximum experience bonus"
            - "Guide.${g5_id}.base_client_capacity == 0 — the NONE certification short-circuit beats ASSISTANT and 12 seasons"
            - "${cap1} == 8, not 10: the area ceiling min(max_clients_per_guide 8, base 10) is applied last and is frozen onto the authorization row"
            - "${cap2} == 4 and ${cap3} == 6 — both below the area ceiling, so the ceiling does not bind there"
            - "Permit.${p_id}.authorized_client_capacity_total == 18 (8 + 4 + 6), not 20, so the total is the sum of the frozen ceilinged values rather than the sum of base capacities"

      - name: fee_component_round_half_up_at_exact_half
        grounds:
          - calculations.permit_fee_assessment
          - calculations.permit_fee_assessment.precision
          - entities.Permit.fields.fee_schedule_code
          - entities.TripUseReport.fields.fee_component_cents
          - entities.FeeAssessment.fields.assessed_fee_cents
        distinguishing_aspect: |
          MODE (b) PRECISION AND ROUNDING ORDER. Two accepted reports each with adjusted gross
          revenue 1533350 on the FLAT_THREE_PERCENT schedule produce the exact half-cent product
          46000.5. Two independent precision decisions are observable at once: round_half_up gives
          46001 per report where banker's rounding would give 46000, and rounding-then-summing gives
          92002 where summing-then-rounding gives 92001. Only the pinned combination — half-up, N
          times in variant A and once in variant B — reproduces both 92002 and 92001.
        test_recipe:
          setup:
            - "logical clock at 2027-09-01T00:00:00Z"
            - "UseArea BRW-01 with a PUBLISHED 2027 needs assessment"
            - "Outfitter Alpine holding one ISSUED permit with fee_schedule_code FLAT_THREE_PERCENT and authorized_service_days 200"
            - "one QUALIFIED LEAD/WFR guide authorized, giving authorized_client_capacity_total 8"
            - "two ACCEPTED TripUseReports each with gross_revenue_cents 1633350 and allowable_deductions_cents 100000, so each adjusted gross revenue is 1533350 and 1533350 * 300 / 10000 is exactly 46000.5"
