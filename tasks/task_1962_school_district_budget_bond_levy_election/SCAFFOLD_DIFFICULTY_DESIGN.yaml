  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (two different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: bond_capacity_exactly_at_legal_limit_allowed_one_cent_over_rejected
        grounds:
          - calculations.bond_debt_capacity
          - errors[ERR_BOND_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Currency metric with inclusive boundary: consumed capacity 4,500,000 outstanding +
          18,000,000 approved + 12,000,000 new == 34,500,000 == 6.9% of EAV exactly is ALLOWED
          (check is strictly-greater); a further 0.01 proposal crosses it and is rejected.
        test_recipe:
          setup:
            - "FY2028 OPEN (outstanding debt 4,500,000; EAV 500,000,000; legal limit 34,500,000)"
