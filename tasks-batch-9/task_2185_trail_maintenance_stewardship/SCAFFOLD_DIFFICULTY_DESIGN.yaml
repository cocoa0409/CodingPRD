      - name: hours_dispute_then_reset_restores_hour_identity_with_zero_drift
        grounds:
          - calculations.shift_credited_hours
          - state_machines.VolunteerShift.CHECKED_OUT_to_HOURS_DISPUTED
          - state_machines.VolunteerShift.HOURS_DISPUTED_to_CHECKED_OUT
          - state_machines.VolunteerShift.HOURS_VERIFIED_to_HOURS_CERTIFIED
          - entities.VolunteerProfile.fields.lifetime_credited_hours
          - entities.VolunteerProfile.fields.pending_hours
          - entities.VolunteerProfile.fields.verified_hours
          - entities.VolunteerProfile.fields.certified_hours
        distinguishing_aspect: |
          Conserved quantity 2 is LABOUR HOURS, not money. The invariant
          INV_HOURS: lifetime_credited_hours == pending_hours + verified_hours + certified_hours
          must hold after the forward action (DISPUTE down to 5.00 h) and its compensating action
          (RESET, which recomputes 6.50 h from the raw punches), and must still hold as the hours
          migrate pending -> verified -> certified.
        test_recipe:
          setup:
            - "An ACTIVE adoption on Alder Creek with an APPROVED plan, an ISSUED permit and work party P1 on 2026-09-05 09:00Z-15:00Z with travel_allowance_minutes 45."
            - "Milo checked in at 09:00Z and out at 15:20Z, giving credited_hours 6.50; the party is COMPLETED."
            - "Milo's buckets read lifetime 6.50, pending 6.50, verified 0, certified 0."
          setup_api_calls:
            - call: "POST /stewardship/land-managers"
              payload: { agency_name: "Cascade National Forest", jurisdiction_code: "USFS-R6-ALDER", permit_required: true, permit_lead_days: 14, max_party_size: 20, wet_threshold_index: 0.65, requires_engineering_review: true, requires_certified_sawyer: true }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { lm_id: $.data.id }
            - call: "POST /stewardship/volunteers"
              payload: { full_name: "Rae Lindqvist", email: "rae@example.org", waiver_signed_on: "2026-07-01", certifications: ["CERT_CREW_LEADER", "CERT_TRAIL_SKILLS", "CERT_FIRST_AID"], first_aid_expires_on: "2027-06-30" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { lead_id: $.data.id }
            - call: "POST /stewardship/volunteers"
              payload: { full_name: "Milo Okonkwo", email: "milo@example.org", waiver_signed_on: "2026-07-01", certifications: ["CERT_SAWYER_B", "CERT_FIRST_AID"], first_aid_expires_on: "2027-06-30" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { saw_id: $.data.id }
            - call: "POST /stewardship/volunteers"
              payload: { full_name: "Petra Novak", email: "petra@example.org", waiver_signed_on: "2026-07-01", certifications: [] }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { gen_id: $.data.id }
            - call: "POST /stewardship/trail-segments"
              payload: { land_manager_id: "${lm_id}", name: "Alder Creek", length_miles: 4.2, surface_class: "NATIVE_SOIL", traffic_class: "MODERATE" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { seg_id: $.data.id }
            - call: "POST /stewardship/adoption-agreements"
              payload: { trail_segment_id: "${seg_id}", crew_leader_volunteer_id: "${lead_id}", term_start_date: "2026-08-01", term_end_date: "2027-07-31" }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { aa_id: $.data.id }
            - call: "POST /stewardship/adoption-agreements/${aa_id}/submit"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /stewardship/adoption-agreements/${aa_id}/review"
              payload: { decision: "APPROVE" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
            - call: "POST /stewardship/adoption-agreements/${aa_id}/activate"
              payload: {}
              as: LandManagerOfficer
              as_user_id: "${lm_id}"
            - call: "POST /stewardship/work-plans"
              payload: { adoption_agreement_id: "${aa_id}", season_year: 2026, requested_budget_cents: 250000 }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { wp_id: $.data.id }
            - call: "POST /stewardship/work-plans/${wp_id}/submit"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /stewardship/work-plans/${wp_id}/review"
              payload: { decision: "APPROVE", approved_budget_cents: 250000 }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { wp_id_v0: $.data.version }
            - call: "POST /stewardship/work-permits"
              payload: { work_plan_id: "${wp_id}", trail_segment_id: "${seg_id}", window_start_date: "2026-09-01", window_end_date: "2026-09-30", requested_work_types: ["TREAD_WORK", "CHAINSAW", "SIGNAGE", "BRUSHING", "DRY_WORK", "BRIDGE_CONSTRUCTION"] }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { pm_id: $.data.id }
            - call: "POST /stewardship/work-permits/${pm_id}/decision"
              payload: { decision: "ISSUE", allowed_work_types: ["TREAD_WORK", "CHAINSAW", "SIGNAGE", "BRUSHING", "DRY_WORK", "BRIDGE_CONSTRUCTION"], max_party_size: 12 }
              as: LandManagerOfficer
              as_user_id: "${lm_id}"
            - call: "POST /stewardship/work-parties"
              payload: { work_plan_id: "${wp_id}", trail_segment_id: "${seg_id}", work_permit_id: "${pm_id}", start_at: "2026-09-05T09:00:00.000Z", end_at: "2026-09-05T15:00:00.000Z", work_type: "TREAD_WORK", max_participants: 8, travel_allowance_minutes: 45 }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /stewardship/work-parties/${p1_id}/briefing"
              payload: { tool_checklist_complete: true, first_aid_kit_count: 2 }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { p1_v1: $.data.version }
            - call: "POST /stewardship/work-parties/${p1_id}/shifts"
              payload: { volunteer_id: "${saw_id}", expected_work_party_version: "${p1_v1}", role_on_crew: "SAWYER" }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { sh_saw_id: $.data.id }
            - call: "POST /stewardship/work-parties/${p1_id}/confirm"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T09:00:00.000Z" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
            - call: "POST /stewardship/work-parties/${p1_id}/start"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /stewardship/shifts/${sh_saw_id}/check-in"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T15:20:00.000Z" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
            - call: "POST /stewardship/shifts/${sh_saw_id}/check-out"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { h0: $.data.credited_hours }
            - call: "POST /stewardship/work-parties/${p1_id}/complete"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "GET /stewardship/volunteers/${saw_id}"
              payload: {}
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { life0: $.data.lifetime_credited_hours, pend0: $.data.pending_hours }
          trigger:
            - call: "POST /stewardship/shifts/${sh_saw_id}/hours-review"
              payload: { decision: "DISPUTE", adjusted_hours: 5.00, dispute_reason: "Two hours logged as travel were already covered." }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { h_disp: $.data.credited_hours, st_disp: $.data.status }
            - call: "GET /stewardship/volunteers/${saw_id}"
              payload: {}
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { life1: $.data.lifetime_credited_hours, pend1: $.data.pending_hours }
            - call: "POST /stewardship/shifts/${sh_saw_id}/hours-review"
              payload: { decision: "RESET" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { h_reset: $.data.credited_hours, st_reset: $.data.status, adj_reset: $.data.adjusted_hours }
            - call: "GET /stewardship/volunteers/${saw_id}"
              payload: {}
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { life2: $.data.lifetime_credited_hours, pend2: $.data.pending_hours }
            - call: "POST /stewardship/shifts/${sh_saw_id}/hours-review"
              payload: { decision: "VERIFY" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { st_ver: $.data.status }
            - call: "GET /stewardship/volunteers/${saw_id}"
              payload: {}
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { life3: $.data.lifetime_credited_hours, pend3: $.data.pending_hours, ver3: $.data.verified_hours }
            - call: "POST /stewardship/shifts/${sh_saw_id}/certify"
              payload: {}
              as: GrantsAdministrator
              as_user_id: "grants-1"
              captures: { st_cert: $.data.status }
            - call: "GET /stewardship/volunteers/${saw_id}"
              payload: {}
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { life4: $.data.lifetime_credited_hours, pend4: $.data.pending_hours, ver4: $.data.verified_hours, cert4: $.data.certified_hours }
          assert:
            - "${h0} == 6.50 and ${life0} == 6.50 and ${pend0} == 6.50"
            - "${h_disp} == 5.00 and ${st_disp} == HOURS_DISPUTED"
            - "${life1} == 5.00 and ${pend1} == 5.00"
            - "${life1} == ${pend1} + 0 + 0"
            - "${h_reset} == 6.50 and ${st_reset} == CHECKED_OUT and ${adj_reset} == null"
            - "${life2} == 6.50 and ${pend2} == 6.50"
            - "${life2} == ${life0}"
            - "${st_ver} == HOURS_VERIFIED"
            - "${life3} == 6.50 and ${pend3} == 0 and ${ver3} == 6.50"
            - "${st_cert} == HOURS_CERTIFIED"
            - "${life4} == 6.50 and ${pend4} == 0 and ${ver4} == 0 and ${cert4} == 6.50"
            - "${life4} == ${pend4} + ${ver4} + ${cert4}"
