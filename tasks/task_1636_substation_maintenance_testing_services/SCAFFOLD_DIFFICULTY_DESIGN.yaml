              as_user_id: "sup-1"
              captures: { err: $.data.error_id }
            - call: "POST /switching-steps/${step2_id}/verify"
              payload: {}
              as: SwitchingSupervisor
              as_user_id: "sup-2"
            - call: "POST /outage-windows/${ow_id}/clear"
              payload: {}
              as: SwitchingSupervisor
              as_user_id: "sup-1"
              captures: { ow_status: $.data.status }
          assert:
            - "first clear rejected with error_id == ERR_STEPS_NOT_VERIFIED (step2 only EXECUTED)"
            - "after step2 verification the identical clear succeeds and window status == CLEARED"
      - name: workorder_create_requires_open_defect_rejected
        grounds:
          - state_machines.Defect.OPEN_to_WORK_ORDERED
          - entities.WorkOrder.fields.defect_id
          - errors[ERR_STATE_TRANSITION]
        distinguishing_aspect: |
          A different entity pair — (WorkOrder, Defect): work-order creation is gated on the defect being OPEN;
          once the first work order moves it to WORK_ORDERED, a second creation against the same defect fails.
        test_recipe:
          setup:
            - "Asset with one defect already WORK_ORDERED by an existing work order"
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub X2", code: "SUB-X2", region: "South" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
            - call: "POST /asset-class-policies"
              payload: { asset_class: "POWER_TRANSFORMER", interval_months: 12, condition_escalation_threshold: 60, condition_critical_threshold: 40, oil_warn_ppm: 20, oil_critical_ppm: 35, ir_min_mohm: 1000, relay_timing_warn_pct: 5, relay_timing_fail_pct: 10, w_insulation: 0.4, w_oil: 0.35, w_relay: 0.25 }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", criticality: "MEDIUM", nameplate_mva: 20, voltage_kv: 115, install_date: "2020-01-01T00:00:00Z" }
              as: OperationsManager
              captures: { asset_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech X", employee_code: "EMP-X" }
              as: OperationsManager
              captures: { tech_id: $.data.id }
            - call: "POST /defects"
              payload: { asset_id: "${asset_id}", title: "Gauge stuck", description: "Oil level gauge frozen", severity: "C2" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { defect_id: $.data.id }
            - call: "POST /work-orders"
              payload: { defect_id: "${defect_id}", assigned_technician_id: "${tech_id}", title: "Fix gauge", estimated_hours: 2 }
              as: OperationsManager
              captures: { wo1_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { defect_id: "${defect_id}", assigned_technician_id: "${tech_id}", title: "Duplicate order", estimated_hours: 1 }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "second creation fails with error_id == ERR_STATE_TRANSITION (defect is WORK_ORDERED, not OPEN)"
            - "Defect.${defect_id}.status remains WORK_ORDERED"
      - name: relay_activate_requires_asset_in_service_rejected
        grounds:
          - state_machines.RelaySetting.VERIFIED_to_ACTIVE
          - entities.Asset.fields.status
          - errors[ERR_ASSET_NOT_IN_SERVICE]
        distinguishing_aspect: |
          A third entity pair — (RelaySetting, Asset): activation requires the relay's asset IN_SERVICE; while the
          asset is OUT_OF_SERVICE under an active switching outage, activation is rejected even though the setting
          itself is VERIFIED and the OCC version is fresh.
        test_recipe:
          setup:
            - "RELAY asset taken OUT_OF_SERVICE by begin-switching; a VERIFIED relay setting on that asset"
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub X3", code: "SUB-X3", region: "West" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
            - call: "POST /asset-class-policies"
              payload: { asset_class: "RELAY", interval_months: 6, condition_escalation_threshold: 60, condition_critical_threshold: 40, oil_warn_ppm: 20, oil_critical_ppm: 35, ir_min_mohm: 100, relay_timing_warn_pct: 5, relay_timing_fail_pct: 10, w_insulation: 0.3, w_oil: 0.1, w_relay: 0.6 }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "RELAY", criticality: "HIGH", voltage_kv: 115, install_date: "2021-01-01T00:00:00Z" }
              as: OperationsManager
              captures: { asset_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Author X3", employee_code: "EMP-XA" }
              as: OperationsManager
              captures: { tech_a: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Verifier X3", employee_code: "EMP-XB" }
              as: OperationsManager
              captures: { tech_b: $.data.id }
            - call: "POST /technicians/${tech_b}/certifications"
              payload: { cert_type: "NETA_LEVEL_4", issued_at: "2025-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /relay-settings"
              payload: { asset_id: "${asset_id}", setting_group: "G1", pickup_a: 80, time_dial: 2.0, curve: "IEC_SI" }
              as: Technician
              as_user_id: "${tech_a}"
              captures: { rs_id: $.data.id }
            - call: "POST /relay-settings/${rs_id}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tech_a}"
            - call: "POST /relay-settings/${rs_id}/verify"
              payload: {}
              as: Technician
              as_user_id: "${tech_b}"
            - call: "POST /outage-windows"
              payload: { substation_id: "${sub_id}", asset_id: "${asset_id}", start_ts: "2026-08-20T08:00:00Z", end_ts: "2026-08-20T16:00:00Z", purpose: "Relay work" }
              as: OutageCoordinator
              as_user_id: "coord-1"
              captures: { ow_id: $.data.id }
            - call: "POST /outage-windows/${ow_id}/switching-steps"
              payload: { sequence_no: 1, description: "Isolate relay panel" }
              as: OutageCoordinator
            - call: "POST /outage-windows/${ow_id}/approve"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-mgr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T09:00:00Z" }
              as: OperationsManager
            - call: "POST /outage-windows/${ow_id}/begin-switching"
              payload: {}
              as: SwitchingSupervisor
              as_user_id: "sup-1"
          trigger:
            - call: "GET /assets/${asset_id}"
              payload: {}
              as: OperationsManager
              captures: { asset_v: $.data.version, asset_status: $.data.status }
            - call: "POST /relay-settings/${rs_id}/activate"
              payload: { expected_asset_version: "${asset_v}" }
              as: Technician
              as_user_id: "${tech_b}"
              captures: { err: $.data.error_id }
          assert:
            - "Asset.${asset_id}.status == OUT_OF_SERVICE (set by begin-switching)"
            - "activate rejected with error_id == ERR_ASSET_NOT_IN_SERVICE despite the setting being VERIFIED and the OCC version matching"

  - rule_id: resource_temporal_overlap
    instances:
      - name: outage_window_buffer_semantics
        grounds:
          - validations[priority=15]
          - entities.OutageWindow.fields.start_ts
        distinguishing_aspect: |
          Resource Asset (via OutageWindow) with buffer semantics: beyond half-open overlap, any gap of strictly
          less than 24 hours to the nearest non-terminal window is rejected — an adjacent window (gap 0) fails,
          while a gap of exactly 24 hours (inclusive >=) succeeds.
        test_recipe:
          setup:
            - "Asset with existing REQUESTED window W1 = [2026-09-01T08:00Z, 2026-09-01T16:00Z)"
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub T1", code: "SUB-T1", region: "North" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
            - call: "POST /asset-class-policies"
              payload: { asset_class: "POWER_TRANSFORMER", interval_months: 12, condition_escalation_threshold: 60, condition_critical_threshold: 40, oil_warn_ppm: 20, oil_critical_ppm: 35, ir_min_mohm: 1000, relay_timing_warn_pct: 5, relay_timing_fail_pct: 10, w_insulation: 0.4, w_oil: 0.35, w_relay: 0.25 }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", criticality: "MEDIUM", nameplate_mva: 20, voltage_kv: 115, install_date: "2020-01-01T00:00:00Z" }
              as: OperationsManager
              captures: { asset_id: $.data.id }
            - call: "POST /outage-windows"
              payload: { substation_id: "${sub_id}", asset_id: "${asset_id}", start_ts: "2026-09-01T08:00:00Z", end_ts: "2026-09-01T16:00:00Z", purpose: "W1" }
              as: OutageCoordinator
              captures: { ow1_id: $.data.id }
          trigger:
            - call: "POST /outage-windows"
              payload: { substation_id: "${sub_id}", asset_id: "${asset_id}", start_ts: "2026-09-01T16:00:00Z", end_ts: "2026-09-02T08:00:00Z", purpose: "W2 adjacent" }
              as: OutageCoordinator
              captures: { err2: $.data.error_id }
            - call: "POST /outage-windows"
              payload: { substation_id: "${sub_id}", asset_id: "${asset_id}", start_ts: "2026-09-02T16:00:00Z", end_ts: "2026-09-03T00:00:00Z", purpose: "W3 24h gap" }
              as: OutageCoordinator
              captures: { ow3_id: $.data.id, ow3_status: $.data.status }
          assert:
            - "W2 (gap 0h to W1) rejected with error_id == ERR_OUTAGE_WINDOW_CONFLICT even though [start,end) intervals do not geometrically overlap"
            - "W3 (gap exactly 24h) created successfully with status == REQUESTED (buffer is inclusive: gap >= 24h passes)"
      - name: spare_reservation_halfopen_overlap
        grounds:
          - validations[priority=16]
          - entities.SpareUnit.fields.status
        distinguishing_aspect: |
          Different resource entity (SpareUnit via SpareReservation) and different interval semantics than the
          outage rule: pure half-open overlap with NO buffer — a fully contained interval conflicts, a
          zero-gap successor is accepted, and the unit stays RESERVED across both ACTIVE reservations.
        test_recipe:
          setup:
            - "One AVAILABLE spare unit with ACTIVE reservation R1 = [2026-09-10T10:00Z, 2026-09-10T14:00Z)"
          setup_api_calls:
            - call: "POST /spare-units"
              payload: { unit_type: "MOBILE_SUBSTATION", rating_mva: 30, voltage_class_kv: 115, impedance_pct: 8.0, home_location: "Depot-9" }
              as: OperationsManager
              captures: { unit_id: $.data.id }
            - call: "POST /spare-reservations"
              payload: { spare_unit_id: "${unit_id}", unit_type: "MOBILE_SUBSTATION", required_mva: 25, required_voltage_kv: 115, start_ts: "2026-09-10T10:00:00Z", end_ts: "2026-09-10T14:00:00Z" }
              as: OutageCoordinator
              captures: { res1_id: $.data.id }
          trigger:
            - call: "POST /spare-reservations"
              payload: { spare_unit_id: "${unit_id}", unit_type: "MOBILE_SUBSTATION", required_mva: 25, required_voltage_kv: 115, start_ts: "2026-09-10T12:00:00Z", end_ts: "2026-09-10T13:00:00Z" }
              as: OutageCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /spare-reservations"
              payload: { spare_unit_id: "${unit_id}", unit_type: "MOBILE_SUBSTATION", required_mva: 25, required_voltage_kv: 115, start_ts: "2026-09-10T14:00:00Z", end_ts: "2026-09-10T18:00:00Z" }
              as: OutageCoordinator
              captures: { res2_id: $.data.id }
            - call: "GET /spare-units/${unit_id}"
              payload: {}
              as: OperationsManager
              captures: { unit_status: $.data.status }
          assert:
            - "contained interval [12:00,13:00) inside R1 rejected with error_id == ERR_SPARE_RESERVATION_CONFLICT"
            - "back-to-back interval starting at 14:00 accepted (half-open adjacency, no buffer required — contrast with the 24h outage rule)"
            - "SpareUnit.${unit_id}.status == RESERVED (two ACTIVE reservations coexist on the unit)"

  - rule_id: compensating_invariant
    instances:
      - name: outage_approve_cancel_hours_invariant
        grounds:
          - state_machines.OutageWindow.REQUESTED_to_APPROVED
          - state_machines.OutageWindow.APPROVED_to_CANCELLED
          - entities.Asset.fields.approved_outage_hours
        distinguishing_aspect: |
          Conserved quantity: Asset.approved_outage_hours (accumulated outage-hours). The forward action (approve)
          adds duration_hours and its compensating action (cancel) subtracts exactly the same amount — after the
          pair, the invariant approved_outage_hours == pre-approve value holds with zero drift.
        test_recipe:
          setup:
            - "Asset with approved_outage_hours == 0.00; an 8-hour REQUESTED window (2026-09-20 08:00-16:00)"
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub I1", code: "SUB-I1", region: "North" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
            - call: "POST /asset-class-policies"
              payload: { asset_class: "POWER_TRANSFORMER", interval_months: 12, condition_escalation_threshold: 60, condition_critical_threshold: 40, oil_warn_ppm: 20, oil_critical_ppm: 35, ir_min_mohm: 1000, relay_timing_warn_pct: 5, relay_timing_fail_pct: 10, w_insulation: 0.4, w_oil: 0.35, w_relay: 0.25 }
              as: OperationsManager
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", criticality: "MEDIUM", nameplate_mva: 20, voltage_kv: 115, install_date: "2020-01-01T00:00:00Z" }
              as: OperationsManager
              captures: { asset_id: $.data.id }
            - call: "POST /outage-windows"
              payload: { substation_id: "${sub_id}", asset_id: "${asset_id}", start_ts: "2026-09-20T08:00:00Z", end_ts: "2026-09-20T16:00:00Z", purpose: "Invariant probe" }
              as: OutageCoordinator
              as_user_id: "coord-1"
              captures: { ow_id: $.data.id }
          trigger:
            - call: "POST /outage-windows/${ow_id}/approve"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-mgr-1"
            - call: "GET /assets/${asset_id}"
              payload: {}
              as: OperationsManager
              captures: { hours_mid: $.data.approved_outage_hours }
            - call: "POST /outage-windows/${ow_id}/cancel"
              payload: {}
              as: OutageCoordinator
              captures: { ow_status: $.data.status }
            - call: "GET /assets/${asset_id}"
              payload: {}
              as: OperationsManager
              captures: { hours_end: $.data.approved_outage_hours }
          assert:
            - "after approve: Asset.approved_outage_hours == 8.00 (duration of the 08:00-16:00 window)"
            - "after cancel: Asset.approved_outage_hours == 0.00 (exactly the pre-approve value; compensation leaves no drift)"
            - "OutageWindow.${ow_id}.status == CANCELLED"
      - name: spare_reserve_cancel_count_invariant
        grounds:
          - state_machines.SpareReservation.ACTIVE_to_CANCELLED
          - state_machines.SpareUnit.AVAILABLE_to_RESERVED
          - state_machines.SpareUnit.RESERVED_to_AVAILABLE
        distinguishing_aspect: |
          A different conserved quantity type than outage-hours: the integer count of ACTIVE reservations on the
          unit together with the derived unit status. Reserve (count 0 -> 1, AVAILABLE -> RESERVED) followed by
          cancel (count 1 -> 0, RESERVED -> AVAILABLE) restores the exact pre-reserve state.
        test_recipe:
          setup:
            - "One AVAILABLE spare unit with no reservations"
          setup_api_calls:
            - call: "POST /spare-units"
              payload: { unit_type: "SPARE_TRANSFORMER", rating_mva: 25, voltage_class_kv: 115, impedance_pct: 6.5, home_location: "Yard-C" }
              as: OperationsManager
              captures: { unit_id: $.data.id, unit_status0: $.data.status }
          trigger:
            - call: "POST /spare-reservations"
              payload: { spare_unit_id: "${unit_id}", unit_type: "SPARE_TRANSFORMER", required_mva: 20, required_voltage_kv: 115, start_ts: "2026-10-01T08:00:00Z", end_ts: "2026-10-01T16:00:00Z" }
              as: OutageCoordinator
              captures: { res_id: $.data.id }
            - call: "GET /spare-units/${unit_id}"
              payload: {}
              as: OperationsManager
              captures: { unit_status_mid: $.data.status }
            - call: "POST /spare-reservations/${res_id}/cancel"
              payload: {}
              as: OutageCoordinator
              captures: { res_status: $.data.status }
            - call: "GET /spare-units/${unit_id}"
              payload: {}
              as: OperationsManager
              captures: { unit_status_end: $.data.status }
            - call: "GET /spare-units/${unit_id}/reservations"
              payload: {}
              as: OperationsManager
          assert:
            - "after reserve: unit.status == RESERVED; after cancel: unit.status == AVAILABLE (initial status restored)"
            - "reservation status == CANCELLED; count of reservations with status == ACTIVE for the unit == 0 (pre-reserve value)"
            - "GET /spare-units/${unit_id}/reservations returns exactly 1 row with status CANCELLED (history preserved, active count conserved)"
