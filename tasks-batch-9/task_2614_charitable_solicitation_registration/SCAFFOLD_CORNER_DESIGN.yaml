# =============================================================================
# 1.9 Scaffold Corner Design — breadth probe over §1.1–§1.7
# Taxonomy: references/claim-extraction-guide.md (nine sections).
# Instances whose corner is already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# carry an excluded_because stub and no test_recipe.
# Default logical clock for every instance is 2026-08-01T00:00:00Z unless a
# POST /_clock/set_current_utc call moves it.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  # From Table 1 (Entities)
  # ---------------------------------------------------------------------------
  - section: entities
    instances:

      - name: state_profile_create_echoes_every_declared_field
        claim_type: creation
        grounds:
          - entities.StateProfile
          - endpoints[POST /state-profiles]
        distinguishing_aspect: "A create with all six required inputs plus every optional rule field returns 201 and echoes each field verbatim, with version 1 and id/created_at/updated_at minted by the server."
        test_recipe:
          setup:
            - "Empty database at the default clock 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, donor_count_trigger: 25, contribution_trigger_cents: 2500000, online_presence_counts: true, extension_allowed: true, extension_max_days: 90, disclosure_required_clauses: ["REGISTRATION_DISCLOSURE", "FINANCIAL_STATEMENT_AVAILABILITY"], fundraiser_contract_filing_days: 10, fundraiser_bond_minimum_cents: 2500000, coventure_filing_required: true, coventure_buffer_days: 7, base_filing_fee_cents: 2500, online_surcharge_cents: 1000, per_contract_fee_cents: 1500, filing_fee_cap_cents: 30000, late_fee_base_cents: 2004, late_fee_escalation_pct: 0.125, late_fee_cap_cents: 50000, cure_period_days: 30, reinstatement_fee_cents: 12500 }
              as: SystemAdmin
              captures: { sp_id: $.data.id }
          assert:
            - "response.http_status == 201"
            - "response.data.state_code == CA"
            - "response.data.renewal_due_rule == FYE_PLUS_4M_15D"
            - "response.data.audit_threshold_cents == 200000000"
            - "response.data.disclosure_required_clauses == [REGISTRATION_DISCLOSURE, FINANCIAL_STATEMENT_AVAILABILITY]"
            - "response.data.version == 1"
            - "response.data.id == ${sp_id}"
            - "response.meta.api_request_id is a non-empty string"

      - name: organization_read_returns_stored_and_derived_fields
        claim_type: retrieval
        grounds:
          - endpoints[GET /organizations/{id}]
          - entities.Organization.fields.solicitation_posture
          - entities.Organization.fields.filing_posture
        distinguishing_aspect: "A read of a freshly created Organization returns the stored inputs unchanged and all six derived fields at their declared defaults: CLEAR, CURRENT, 0, 0, [] and 0."
        test_recipe:
          setup:
            - "StateProfile CA and one Organization created at the default clock."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6, has_online_donation_page: true }
              as: ComplianceOfficer
              captures: { org_id: $.data.id }
          trigger:
            - call: "GET /organizations/${org_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "response.http_status == 200"
            - "response.data.id == ${org_id}"
            - "response.data.legal_name == Harbor Light Foundation"
            - "response.data.fiscal_year_end_month == 6"
            - "response.data.solicitation_posture == CLEAR"
            - "response.data.filing_posture == CURRENT"
            - "response.data.registered_state_count == 0"
            - "response.data.delinquent_registration_count == 0"
            - "response.data.ceased_state_codes == []"
            - "response.data.penalty_outstanding_cents == 0"

      - name: state_registration_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /state-registrations]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With two DRAFT filings on file, limit 1 returns exactly one element with total_count 2 and has_more true, and offset 1 returns the second element with has_more false."
        test_recipe:
          setup:
            - "StateProfile CA, one Organization, one CURRENT FinancialStatement and two DRAFT CA filings for fiscal years 2025 and 2026."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "INITIAL", fiscal_year: 2025, coverage_start: "2024-07-01T00:00:00Z", coverage_end: "2025-07-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { reg_2025_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { reg_2026_id: $.data.id }
          trigger:
            - call: "GET /state-registrations"
              payload: { organization_id: "${org_id}", limit: 1, offset: 0 }
              as: ComplianceOfficer
              captures: { first_page_id: "$.data[0].id" }
            - call: "GET /state-registrations"
              payload: { organization_id: "${org_id}", limit: 1, offset: 1 }
              as: ComplianceOfficer
              captures: { second_page_id: "$.data[0].id" }
          assert:
            - "responses[0].total_count == 2"
            - "responses[0].has_more == true"
            - "responses[0].limit == 1"
            - "${first_page_id} == ${reg_2025_id}"
            - "responses[1].total_count == 2"
            - "responses[1].has_more == false"
            - "${second_page_id} == ${reg_2026_id}"

      - name: organization_read_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_ORGANIZATION_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "A well-formed but unused UUID on a path parameter returns 404 ERR_ORGANIZATION_NOT_FOUND, not 422 and not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database except for StateProfile CA."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000 }
              as: SystemAdmin
          trigger:
            - call: "GET /organizations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response.http_status == 404"
            - "${err_id} == ERR_ORGANIZATION_NOT_FOUND"
            - "response.response_type == error"

      - name: financial_statement_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /financial-statements]
        distinguishing_aspect: "Omitting contributions_cents — a required input with no declared default — returns 422 ERR_INVALID_REQUEST and creates no FinancialStatement, even though every other required field is present."
        test_recipe:
          setup:
            - "StateProfile CA and one Organization."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
          trigger:
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 26000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response.http_status == 422"
            - "${err_id} == ERR_INVALID_REQUEST"
            - "Organization.${org_id}.version == 1"

      - name: optional_field_defaults_applied_when_omitted
        claim_type: defaults
        grounds:
          - entities.StateProfile.fields.donor_count_trigger
          - entities.StateProfile.fields.disclosure_required_clauses
          - entities.Organization.fields.has_online_donation_page
          - entities.FinancialStatement.fields.assurance_level
        distinguishing_aspect: "A minimal StateProfile create yields donor_count_trigger 25, contribution_trigger_cents 2500000, extension_allowed false, extension_max_days 0, disclosure_required_clauses [] and late_fee_base_cents 2000; a minimal Organization yields has_online_donation_page false and lifecycle_status ACTIVE; a statement without assurance_level yields NONE."
        test_recipe:
          setup:
            - "Empty database at the default clock."
          setup_api_calls: []
          trigger:
            - call: "POST /state-profiles"
              payload: { state_code: "WY", registration_required: true, renewal_due_rule: "CALENDAR_MAY_15", assurance_basis: "CONTRIBUTIONS_ONLY", review_threshold_cents: 25000000, audit_threshold_cents: 100000000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Prairie Trust", ein: "223456789", domicile_state_code: "WY", fiscal_year_end_month: 12 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2025, total_revenue_cents: 1000000, contributions_cents: 900000, program_expense_cents: 700000, fundraising_expense_cents: 200000, management_expense_cents: 100000, expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs_id: $.data.id }
          assert:
            - "responses[0].data.donor_count_trigger == 25"
            - "responses[0].data.contribution_trigger_cents == 2500000"
            - "responses[0].data.online_presence_counts == false"
            - "responses[0].data.extension_allowed == false"
            - "responses[0].data.extension_max_days == 0"
            - "responses[0].data.disclosure_required_clauses == []"
            - "responses[0].data.late_fee_base_cents == 2000"
            - "responses[0].data.late_fee_escalation_pct == 0.1"
            - "Organization.${org_id}.has_online_donation_page == false"
            - "Organization.${org_id}.lifecycle_status == ACTIVE"
            - "FinancialStatement.${fs_id}.assurance_level == NONE"
            - "FinancialStatement.${fs_id}.government_grant_cents == 0"
            - "FinancialStatement.${fs_id}.statement_status == CURRENT"

      - name: financial_statement_computed_expense_fields_derived_from_inputs
        claim_type: computed_fields
        grounds:
          - entities.FinancialStatement.fields.functional_expense_total_cents
          - entities.FinancialStatement.fields.program_ratio
        distinguishing_aspect: "With program 18000000, fundraising 4000000 and management 2000000 the create response carries functional_expense_total_cents 24000000 and program_ratio 0.75, computed from the three expense inputs rather than from total_revenue_cents."
        test_recipe:
          setup:
            - "StateProfile CA and one Organization."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
          trigger:
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs_id: $.data.id }
          assert:
            - "response.http_status == 201"
            - "FinancialStatement.${fs_id}.functional_expense_total_cents == 24000000"
            - "FinancialStatement.${fs_id}.program_ratio == 0.75"
            - "FinancialStatement.${fs_id}.statement_status == CURRENT"
            - "Organization.${org_id}.version == 2"

      - name: state_profile_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - validations[priority=3]
          - entities.StateProfile.fields.renewal_due_rule
        distinguishing_aspect: "renewal_due_rule FYE_PLUS_3M is outside the declared enum {FYE_PLUS_4M_15D, FYE_PLUS_6M, CALENDAR_MAY_15} and returns 422 ERR_INVALID_REQUEST rather than being silently coerced to a default rule."
        test_recipe:
          setup:
            - "Empty database at the default clock."
          setup_api_calls: []
          trigger:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_3M", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000 }
              as: SystemAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "response.http_status == 422"
            - "${err_id} == ERR_INVALID_REQUEST"

      - name: solicitation_activity_is_an_immutable_event_row
        claim_type: immutability
        grounds:
          - entities.SolicitationActivity
          - endpoints[POST /solicitation-activities]
          - calculations.registration_trigger_evaluation
        distinguishing_aspect: "SolicitationActivity is declared common_fields false, so its create response carries no version field and §1.5 exposes no update or delete endpoint for it; the row's computed triggers_registration and trigger_reasons are fixed at write time."
        test_recipe:
          setup:
            - "StateProfile CA with donor_count_trigger 25 and online_presence_counts true, plus one Organization."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, donor_count_trigger: 25, contribution_trigger_cents: 2500000, online_presence_counts: true }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /solicitation-activities"
              payload: { organization_id: "${org_id}", state_code: "CA", fiscal_year: 2026, donor_count: 40, contributions_cents: 900000, channels: ["MAIL"] }
              as: ComplianceOfficer
          assert:
            - "response.http_status == 201"
            - "response.data.triggers_registration == true"
            - "response.data.trigger_reasons == [DONOR_COUNT]"
            - "response.data has no version field"
            - "response.data has no updated_at field"

      - name: registration_document_with_unknown_parent_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_REGISTRATION_NOT_FOUND]
          - entities.RegistrationDocument.fields.registration_id
        distinguishing_aspect: "A body foreign key to a non-existent StateRegistration returns 404 ERR_REGISTRATION_NOT_FOUND at priority 5, before the officer foreign key is examined, so the unused prepared_by_officer_id never produces ERR_OFFICER_NOT_FOUND."
        test_recipe:
          setup:
            - "StateProfile CA, one Organization and one OfficerDisclosure, but no StateRegistration."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id }
            - call: "POST /officer-disclosures"
              payload: { organization_id: "${org_id}", officer_name: "Sam Okoye", title: "SECRETARY" }
              as: ComplianceOfficer
              captures: { prep_id: $.data.id }
          trigger:
            - call: "POST /registration-documents"
              payload: { registration_id: "00000000-0000-0000-0000-000000000000", doc_type: "GOVERNING_DOCUMENT", prepared_by_officer_id: "${prep_id}", page_count: 12 }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response.http_status == 404"
            - "${err_id} == ERR_REGISTRATION_NOT_FOUND"

      - name: many_to_many_contract_is_reachable_from_both_endpoints_of_the_graph
        claim_type: topology_graph
        grounds:
          - complexity_profile.entity_topology
          - entities.FundraisingContract.fields.organization_id
          - entities.FundraisingContract.fields.fundraiser_id
          - endpoints[GET /fundraising-contracts]
        distinguishing_aspect: "One FundraisingContract joins an Organization and a ProfessionalFundraiser with no ownership tree: filtering the contract list by organization_id and by fundraiser_id each returns the same single contract id."
        test_recipe:
          setup:
            - "StateProfile CA, one Organization, one PROFESSIONAL_SOLICITOR and one DRAFT FundraisingContract joining them."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, fundraiser_contract_filing_days: 10 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id }
            - call: "POST /professional-fundraisers"
              payload: { legal_name: "Northline Donor Services", fundraiser_type: "PROFESSIONAL_SOLICITOR", bond_amount_cents: 2500000, bond_expires_at: "2028-12-31T00:00:00Z" }
              as: SystemAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /fundraising-contracts"
              payload: { organization_id: "${org_id}", fundraiser_id: "${pf_id}", state_codes: ["CA"], contract_start: "2026-08-01T00:00:00Z", contract_end: "2027-08-01T00:00:00Z", compensation_type: "PERCENT_OF_GROSS", percent_of_gross: 0.15 }
              as: ComplianceOfficer
              captures: { ct_id: $.data.id }
          trigger:
            - call: "GET /fundraising-contracts"
              payload: { organization_id: "${org_id}" }
              as: ComplianceOfficer
              captures: { by_org_id: "$.data[0].id" }
            - call: "GET /fundraising-contracts"
              payload: { fundraiser_id: "${pf_id}" }
              as: StateRegulator
              captures: { by_pf_id: "$.data[0].id" }
          assert:
            - "responses[0].total_count == 1"
            - "responses[1].total_count == 1"
            - "${by_org_id} == ${ct_id}"
            - "${by_pf_id} == ${ct_id}"
            - "FundraisingContract.${ct_id}.status == DRAFT"
            - "FundraisingContract.${ct_id}.filing_due_date == 2026-08-11T00:00:00Z"

  # ---------------------------------------------------------------------------
  # From Table 2 (State Machines)
      - name: organization_child_collections_are_scoped_and_filtered
        claim_type: listing
        grounds:
          - endpoints[GET /organizations]
          - endpoints[GET /organizations/{id}/solicitation-activities]
          - endpoints[GET /organizations/{id}/financial-statements]
          - endpoints[GET /organizations/{id}/officer-disclosures]
          - endpoints[GET /organizations/{id}/disclosure-statements]
        distinguishing_aspect: "Every child collection is keyed to the organization on the path and each one honours its own declared filter, so a second charity's rows never leak in and the NV activity, the FY2025 statement and the non-certifying officer are all filtered out of their respective single-row answers."
        test_recipe:
          setup:
            - "StateProfiles CA and NV; a CA-domiciled Organization carrying two activity rows (CA and NV), two statements (FY2025 and FY2026), two officers (one certifying) and one CA disclosure statement; a second NV-domiciled Organization with no children."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, disclosure_required_clauses: ["REGISTRATION_DISCLOSURE", "FINANCIAL_STATEMENT_AVAILABILITY"] }
              as: SystemAdmin
            - call: "POST /state-profiles"
              payload: { state_code: "NV", registration_required: true, renewal_due_rule: "FYE_PLUS_6M", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /organizations"
              payload: { legal_name: "Cedar Ridge Alliance", ein: "223456789", domicile_state_code: "NV", fiscal_year_end_month: 12 }
              as: ComplianceOfficer
              captures: { org_b_id: $.data.id }
            - call: "POST /solicitation-activities"
              payload: { organization_id: "${org_id}", state_code: "CA", fiscal_year: 2026, donor_count: 40, contributions_cents: 3000000, channels: ["MAIL"] }
              as: ComplianceOfficer
              captures: { act_ca_id: $.data.id }
            - call: "POST /solicitation-activities"
              payload: { organization_id: "${org_id}", state_code: "NV", fiscal_year: 2026, donor_count: 10, contributions_cents: 400000, channels: ["EMAIL"] }
              as: ComplianceOfficer
              captures: { act_nv_id: $.data.id }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2025, total_revenue_cents: 18000000, contributions_cents: 15000000, program_expense_cents: 12000000, fundraising_expense_cents: 3000000, management_expense_cents: 1500000, expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs_2025_id: $.data.id }
            - call: "GET /organizations/${org_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { org_v2: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${org_v2}" }
              as: ComplianceOfficer
              captures: { fs_2026_id: $.data.id }
            - call: "POST /officer-disclosures"
              payload: { organization_id: "${org_id}", officer_name: "Dana Reyes", title: "PRESIDENT", is_certifying_officer: true }
