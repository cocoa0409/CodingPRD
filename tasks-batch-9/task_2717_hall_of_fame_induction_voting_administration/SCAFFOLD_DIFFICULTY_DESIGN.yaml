  - rule_id: non_linear_state_machine
    instances:
      - name: candidacy_info_request_revision_cycle_bounded
        grounds:
          - state_machines.Candidacy.SCREENING_to_INFO_REQUESTED
          - state_machines.Candidacy.INFO_REQUESTED_to_SCREENING
          - state_machines.Candidacy.SCREENING_to_ADVANCED
          - validations[priority=53]
          - entities.Candidacy.fields.info_request_count
        distinguishing_aspect: |
          A true cycle on the Candidacy entity: SCREENING -> INFO_REQUESTED -> SCREENING is traversed
          twice and the loop is bounded by MAX_INFO_REQUESTS == 2, so the third REQUEST_INFO is
          rejected with ERR_INFO_REQUEST_LIMIT (409) while the candidacy stays in SCREENING and can
          still be ADVANCED. The counter is monotonic across loop iterations - returning to
          SCREENING does not reset it - which is what separates a bounded cycle from a plain
          back-and-forth toggle.
        test_recipe:
          setup:
            - "EligibilityRule (PLAYER, MODERN) with max_ballot_appearances 3."
            - "One VoterBloc, a credentialed nominating elector e1 and a credentialed screening-committee member e2."
