          The Assured identity is entity_backed on OpenPolicy, so two assureds are
          peers with disjoint resources: assured B may not confirm delivery on
          assured A's certificate and may not declare a shipment under A's policy,
          even though both calls are on B's own allowed endpoints. The ownership
