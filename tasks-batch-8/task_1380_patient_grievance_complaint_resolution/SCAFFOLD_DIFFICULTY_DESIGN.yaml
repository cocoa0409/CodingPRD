            - "credit == 432000 (5 x 86400; single interval, no double counting)"
            - "due_after == '2026-09-05T09:00:00Z' (2026-08-31T09:00:00Z + 432000s)"
            - "st_after == 'ON_TRACK' — only reachable when credit recompute precedes status derivation"
            - "st_late == 'RESPONSE_BREACH' once now passes the re-extended due"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: patient_case_reopen_cycle_with_parallel_clock
        grounds:
          - state_machines.PatientCase.CLOSED_to_REOPENED
          - state_machines.PatientCase.REOPENED_to_UNDER_INVESTIGATION
          - calculations.regulatory_due_dates
        distinguishing_aspect: |
          PatientCase is cyclic (CLOSED -> REOPENED -> UNDER_INVESTIGATION) AND carries the
          parallel regulatory_clock_status dimension that re-derives independently: reopen at
          2026-08-20T12:00:00Z re-anchors calendar due to 2026-09-04T12:00:00Z and business due
          to 2026-09-10T12:00:00Z while the clock dimension reads ON_TRACK.
        test_recipe:
          setup:
            - "STANDARD grievance received 2026-08-03T09:00:00Z (due 2026-09-02T09:00:00Z), fully investigated, letter issued 2026-08-10T09:00:00Z -> CLOSED ON_TIME"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "ED Main", category: "EMERGENCY" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ivy Investigator", capabilities: ["INVESTIGATOR"] }, as: SystemAdmin, captures: { inv: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Dana Director", capabilities: ["DIRECTOR"] }, as: SystemAdmin, captures: { dir: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-5001", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "PHONE", description: "ED wait time concern", grievance_category: "ACCESS_DELAY" }, as: IntakeCoordinator, captures: { c1: $.data.id, c1v: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${c1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { c1v2: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${c1v2}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${c1}/investigations", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { iv1: $.data.id } }
            - { call: "POST /api/investigations/${iv1}/notes", payload: { note_type: "INTERVIEW", body: "Charge nurse interview" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${iv1}/notes", payload: { note_type: "DOCUMENT_REVIEW", body: "ED throughput logs" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${iv1}/submit-findings", payload: { care_concern_flag: false, findings_summary: "Wait exceeded target" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${iv1}/accept-findings", payload: {}, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${c1}/response-letters", payload: { sections: ["PATIENT_SUMMARY", "INVESTIGATION_STEPS", "FINDINGS", "RESOLUTION", "CONTACT_INFO"], body_summary: "Letter with findings and remediation" }, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { l1: $.data.id } }
            - { call: "POST /api/response-letters/${l1}/submit-review", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/response-letters/${l1}/approve", payload: {}, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/response-letters/${l1}/issue", payload: {}, as: IntakeCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T12:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /api/patient-cases/${c1}/reopen", payload: { reopen_reason: "Patient rejected resolution" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "GET /api/patient-cases/${c1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { lc: $.data.lifecycle_status, rc: $.data.reopen_count, tim: $.data.resolution_timeliness } }
            - { call: "GET /api/patient-cases/${c1}/timeline", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { cal: $.data.response_due_calendar_at, bus: $.data.response_due_business_at, clk: $.data.regulatory_clock_status } }
            - { call: "GET /api/investigations/${iv1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { invst: $.data.status } }
            - { call: "GET /api/response-letters/${l1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { lst: $.data.status } }
            - { call: "GET /api/hospital-units/${u1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { opc: $.data.open_case_count } }
            - { call: "POST /api/investigations/${iv1}/resume", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "GET /api/patient-cases/${c1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { lc2: $.data.lifecycle_status } }
          assert:
            - "lc == 'REOPENED' and rc == 1 and tim == 'NA' (timeliness reset by reopen)"
            - "invst == 'REOPENED' (link 2) and lst == 'SUPERSEDED' (link 2)"
            - "cal == '2026-09-04T12:00:00Z' and bus == '2026-09-10T12:00:00Z' (link 3 re-anchor +15d)"
            - "clk == 'ON_TRACK' — parallel dimension re-derived independently of lifecycle"
            - "opc == 1 (unit counter restored by reopen cascade)"
            - "lc2 == 'UNDER_INVESTIGATION' after resume — cycle continues, terminal lockdown never engaged on CLOSED"

      - name: response_letter_revision_loop_cycle
        grounds:
          - state_machines.ResponseLetter.RETURNED_to_IN_REVIEW
          - state_machines.ResponseLetter.IN_REVIEW_to_RETURNED
        distinguishing_aspect: |
          ResponseLetter (different entity than PatientCase) runs a revision cycle
          DRAFT -> IN_REVIEW -> RETURNED -> IN_REVIEW -> APPROVED; the loop may repeat and
          version increments on every hop (final version 5 after one full loop).
        test_recipe:
          setup:
            - "COMPLAINT case fast-tracked to RESPONSE_DRAFTING; letter drafted by inv"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "Clinic West", category: "OUTPATIENT" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ivy Investigator", capabilities: ["INVESTIGATOR"] }, as: SystemAdmin, captures: { inv: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Dana Director", capabilities: ["DIRECTOR"] }, as: SystemAdmin, captures: { dir: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-5002", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "PORTAL", description: "Appointment rescheduling annoyance", grievance_category: "ACCESS_DELAY" }, as: IntakeCoordinator, captures: { c1: $.data.id, c1v: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "COMPLAINT", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${c1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { c1v2: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${c1v2}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${c1}/fast-track", payload: {}, as: IntakeCoordinator }
            - { call: "POST /api/patient-cases/${c1}/response-letters", payload: { sections: ["PATIENT_SUMMARY", "INVESTIGATION_STEPS", "FINDINGS", "RESOLUTION", "CONTACT_INFO"], body_summary: "Courtesy response letter" }, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { l1: $.data.id, lv1: $.data.version } }
            - { call: "POST /api/response-letters/${l1}/submit-review", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}" }
          trigger:
            - { call: "POST /api/response-letters/${l1}/return", payload: { return_reason: "Tone needs work" }, as: PatientRelationsDirector, as_user_id: "${dir}", captures: { st_ret: $.data.status } }
            - { call: "POST /api/response-letters/${l1}/submit-review", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { st_re: $.data.status } }
            - { call: "POST /api/response-letters/${l1}/approve", payload: {}, as: PatientRelationsDirector, as_user_id: "${dir}", captures: { st_fin: $.data.status, lv_fin: $.data.version } }
            - { call: "GET /api/patient-cases/${c1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { cst: $.data.lifecycle_status } }
          assert:
            - "st_ret == 'RETURNED' (revision loop edge IN_REVIEW -> RETURNED)"
            - "st_re == 'IN_REVIEW' (loop edge RETURNED -> IN_REVIEW taken a second time)"
            - "st_fin == 'APPROVED' and cst == 'PENDING_CLOSURE'"
            - "lv_fin == 5 (create=1, submit=2, return=3, resubmit=4, approve=5)"

      - name: escalation_fork_join_requires_both_reviews
        grounds:
          - state_machines.QualityRiskEscalation.IN_REVIEW_to_REVIEWS_COMPLETE
          - state_machines.QualityRiskEscalation.REVIEWS_COMPLETE_to_ADJUDICATED_SUBSTANTIATED
        distinguishing_aspect: |
          QualityRiskEscalation (third distinct entity) is a fork-join: review_track BOTH forks
          into compliance + safety branches; adjudication is unreachable until the join fires —
          a premature adjudicate is rejected with ERR_ESCALATION_INVALID_STATE.
        test_recipe:
          setup:
            - "Case in INTAKE; manual CARE_CONCERN escalation filed by qro1; adjudicator qro2 (SoD-clean)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "Surgery 2", category: "SURGICAL" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Quinn One", capabilities: ["QRO"] }, as: SystemAdmin, captures: { q1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Quinn Two", capabilities: ["QRO"] }, as: SystemAdmin, captures: { q2: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-5003", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "LETTER", description: "Surgical consent concern", grievance_category: "CARE_QUALITY" }, as: IntakeCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /api/patient-cases/${c1}/escalations", payload: { escalation_type: "CARE_CONCERN", review_track: "BOTH" }, as: QualityRiskOfficer, as_user_id: "${q1}", captures: { e1: $.data.id } }
            - { call: "POST /api/escalations/${e1}/triage", payload: { review_track: "BOTH" }, as: QualityRiskOfficer, as_user_id: "${q1}" }
            - { call: "POST /api/escalations/${e1}/complete-review", payload: { review_branch: "COMPLIANCE" }, as: QualityRiskOfficer, as_user_id: "${q1}", captures: { st_mid: $.data.status, cr_done: $.data.compliance_review_done } }
          trigger:
            - { call: "POST /api/escalations/${e1}/adjudicate", payload: { outcome: "SUBSTANTIATED" }, as: QualityRiskOfficer, as_user_id: "${q2}", captures: { err: $.data.error_id } }
            - { call: "POST /api/escalations/${e1}/complete-review", payload: { review_branch: "SAFETY" }, as: QualityRiskOfficer, as_user_id: "${q1}", captures: { st_join: $.data.status } }
            - { call: "POST /api/escalations/${e1}/adjudicate", payload: { outcome: "SUBSTANTIATED", outcome_note: "Both reviews concur" }, as: QualityRiskOfficer, as_user_id: "${q2}", captures: { st_fin: $.data.status } }
          assert:
            - "st_mid == 'IN_REVIEW' and cr_done == true (fork branch recorded, join not yet satisfied)"
            - "err == 'ERR_ESCALATION_INVALID_STATE' (adjudication unreachable before join)"
            - "st_join == 'REVIEWS_COMPLETE' (join fired only when BOTH branches done)"
            - "st_fin == 'ADJUDICATED_SUBSTANTIATED'"

