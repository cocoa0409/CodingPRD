              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == \"ERR_UNKNOWN_CATEGORY_CODE\" with HTTP 422 — the registry lookup, not the request shape, is what fails"
            - "GET /cosmetics/facilities/${fac_id} still reports listed_product_count == 0"
            - "GET /cosmetics/listings?facility_id=${fac_id} returns an empty list with total_count == 0"

      - name: duplicate_inci_name_is_rejected_case_insensitively_within_one_listing
        claim_type: violation_to_error
        grounds:
          - validations[priority=45]
          - errors[ERR_DUPLICATE_INGREDIENT]
          - entities.ProductIngredient.fields.inci_name
        distinguishing_aspect: |
          Uniqueness is per-listing and case-folded, so "glycerin" collides with an existing "GLYCERIN"
          (ERR_DUPLICATE_INGREDIENT, 422) while the very same lowercase name is accepted on a DIFFERENT
          listing owned by the same ResponsiblePerson — the constraint is scoped to the parent, not global.
        test_recipe:
          setup:
            - "one REGISTERED facility, one ResponsiblePerson, two DRAFT listings, and one GLYCERIN ingredient on the first listing"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example", designation_cap: 5 }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Blush Powder", category_code: "07A", product_form: "LEAVE_ON", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_a: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Cleansing Gel", category_code: "07A", product_form: "RINSE_OFF", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_b: $.data.id }
            - call: "POST /cosmetics/listings/${lst_a}/ingredients"
              payload: { inci_name: "GLYCERIN", function_code: "HUMECTANT", concentration_pct: 3.0000, is_fragrance_allergen: false }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
          trigger:
            - call: "POST /cosmetics/listings/${lst_a}/ingredients"
              payload: { inci_name: "glycerin", function_code: "SOLVENT", concentration_pct: 1.0000, is_fragrance_allergen: false }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { err: $.data.error_id }
            - call: "POST /cosmetics/listings/${lst_b}/ingredients"
              payload: { inci_name: "glycerin", function_code: "SOLVENT", concentration_pct: 1.0000, is_fragrance_allergen: false }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { ok_name: $.data.inci_name }
          assert:
            - "${err} == \"ERR_DUPLICATE_INGREDIENT\" with HTTP 422 — case-insensitive collision with the stored GLYCERIN"
            - "${ok_name} == \"glycerin\" — accepted on the sibling listing, so uniqueness is scoped per listing"
            - "GET /cosmetics/listings/${lst_a}/ingredients returns exactly one row (the rejected call persisted nothing)"
            - "GET /cosmetics/listings/${lst_b}/ingredients returns exactly one row"

      - name: professional_use_labeling_is_rejected_for_the_wrong_category_and_the_missing_statement
