  # ---------------------------------------------------------------------------
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: registration_requires_window_open
        grounds:
          - state_machines.ExamRegistration.creation
          - state_machines.ExamWindow.SCHEDULED_to_REGISTRATION_OPEN
          - errors[ERR_WINDOW_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair (ExamRegistration, ExamWindow): the registration's creation
          is gated on the WINDOW's state — SCHEDULED rejects with
          ERR_WINDOW_NOT_OPEN; after the clock sweep crosses registration_opens_at
          (>= boundary) the same call succeeds.
        test_recipe:
          setup:
            - "Exam P ACTIVE; window P-2026-11 with registration_opens_at 2026-09-10T00:00:00Z; logical clock still at the 2026-09-01T00:00:00Z default, so the window is SCHEDULED"
