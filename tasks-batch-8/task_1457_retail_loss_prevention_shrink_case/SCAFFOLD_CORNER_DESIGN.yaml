          assert:
            - "mid-setup GET /alerts returned 0 items (38.0 < 40.00)"
            - "after fourth event: sc == 53.0 and ec == 4 and alert status OPEN"
            - "all four member events now AGGREGATED (GET /exception-events?status=AGGREGATED total_count == 4)"

      - name: alert_window_excludes_events_older_than_30_days
        claim_type: input_set_filtering
        grounds: [calculations.alert_score]
        distinguishing_aspect: "The candidate set is [occurred_at - 30d, occurred_at]: an event at 2026-06-10T11:30:00Z is exactly 29 days before the last event and INCLUDED, while an event at 2026-06-09T11:30:00Z (31 days) is EXCLUDED from the alert and stays UNAGGREGATED."
        test_recipe:
          setup: ["Store S1; employee E1; OLD event HIGH_VALUE_VOID 50000 (28.0) at 2026-06-09T11:30:00Z; IN-WINDOW event HIGH_VALUE_VOID 50000 (28.0) at 2026-06-10T11:30:00Z"]
