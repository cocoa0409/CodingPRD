scenario: |
  1862. Comic Convention Exhibitor & Artist Alley Management (Comic-Con style convention): booth/table inventory & tiered pricing, application, jury selection & category rules, floor plan layout & neighbor placement requests, badge allocation per exhibitor & staff, load-in/load-out schedule & freight handling, sales tax collection guidance & permit, on-site issue resolution & policy enforcement, renewal priority for returning exhibitors

domain_name: comic-convention-exhibitor-management
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation          # finite booth inventory, category quotas, badge pools, pallet capacity competed for, reserved, committed, released
  secondary_archetype: temporal_windowing      # load-in/out dock scheduling with half-open windows, buffers, aggregate capacity
  complexity_layers:
    - optimistic_concurrency                   # OCC on Application.version (revisions) and Convention.version (config)
    - cascading_side_effects                   # eviction cascade: issue -> strikes -> standing -> cancellation -> space release -> waitlist promotion
    - dual_variant_calculation                 # provisional quote vs final invoice; tax estimate vs tax settlement
    - rate_threshold_triggers                  # sold-count price tiers, strike standing thresholds, refund windows
  entity_topology: flat                        # peer entities with foreign-key references; filtered-list GETs, no nested URL paths
  state_machine_shape: cyclic                  # Application revision loop (UNDER_REVIEW->NEEDS_REVISION->SUBMITTED), LoadSlot OPEN<->FULL, plus a parallel permit_status dimension on Application
  relationship_patterns:
    - one_to_many                              # Convention -> SpaceUnit/CategoryQuota/LoadSlot/DockDoor; Exhibitor -> Application/StaffMember
    - many_to_many                             # Exhibitor <-> Exhibitor neighbor requests; Application <-> SpaceUnit via Placement
    - cross_aggregate                          # FreightBooking spans Application + LoadSlot + DockDoor; IssueTicket crosses Exhibitor/Convention
  role_model: segregation_of_duties            # issue resolver must differ from reporter; jurors score, director decides; conflicted jurors barred
  consistency_model: immediate                 # all mutations atomic in the request; derived fields recomputed synchronously

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Convention
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Convention display name" }
      - { name: starts_at, type: datetime, source: input, description: "Show open instant (UTC); first selling day = date(starts_at)" }
      - { name: ends_at, type: datetime, source: input, description: "Show close instant (UTC); selling_days = inclusive calendar days from date(starts_at) to date(ends_at)" }
      - { name: renewal_open_at, type: datetime, source: input, description: "Instant from which RENEWAL-channel applications may be submitted" }
      - { name: application_open_at, type: datetime, source: input, description: "Instant from which OPEN-channel applications may be submitted" }
      - { name: application_close_at, type: datetime, source: input, description: "Instant at/after which all application submission is rejected" }
      - { name: early_bird_deadline, type: datetime, source: input, description: "Applications with submitted_at <= this instant get the early-bird discount" }
      - { name: deposit_window_days, type: integer, source: input, default: 14, description: "Days after decided_at during which an accepted offer may be accepted" }
      - { name: tax_permit_required, type: boolean, source: input, description: "When true, contract acceptance requires permit_status VERIFIED or EXEMPT" }
      - { name: sales_tax_rate_bp, type: integer, source: input, description: "Sales tax rate in basis points (875 = 8.75%)" }
      - { name: phase, type: enum, source: system, default: SETUP, description: "SETUP -> APPLICATIONS_OPEN -> JURY_REVIEW -> PLACEMENT -> LOGISTICS -> LIVE -> LOAD_OUT -> CLOSED", constraints: "enum: SETUP, APPLICATIONS_OPEN, JURY_REVIEW, PLACEMENT, LOGISTICS, LIVE, LOAD_OUT, CLOSED" }
      - { name: ops_run_count, type: integer, source: system, default: 0, description: "Number of run-ops checkpoints executed" }

  - name: CategoryQuota
    parent: null
    common_fields: true
    fields:
      - { name: convention_id, type: string, source: input, description: "FK -> Convention.id" }
      - { name: category, type: enum, source: input, description: "Exhibitor category this quota governs", constraints: "enum: ARTIST_ALLEY, DEALER, PUBLISHER, STUDIO, NONPROFIT; unique per convention" }
      - { name: max_accepted, type: integer, source: input, description: "Maximum applications that may hold status JURIED_ACCEPTED/CONTRACTED/PLACED in this category" }
      - { name: max_waitlisted, type: integer, source: input, description: "Maximum applications that may hold status JURIED_WAITLISTED in this category" }
      - { name: accepted_count, type: integer, source: computed, default: 0, description: "Count of applications in this convention+category with status IN {JURIED_ACCEPTED, CONTRACTED, PLACED}" }
      - { name: waitlisted_count, type: integer, source: computed, default: 0, description: "Count of applications in this convention+category with status JURIED_WAITLISTED" }

  - name: SpaceUnit
    parent: null
    common_fields: true
    fields:
      - { name: convention_id, type: string, source: input, description: "FK -> Convention.id" }
      - { name: space_code, type: string, source: input, description: "Human-readable code; unique per convention", constraints: "unique within convention_id" }
      - { name: block, type: string, source: input, description: "Floor block letter(s); adjacency requires same block" }
      - { name: unit_number, type: integer, source: input, description: "Numeric position within block; two spaces are adjacent iff same block and |unit_number delta| == 1" }
      - { name: hall, type: enum, source: input, description: "Floor zone", constraints: "enum: MAIN, ARTIST_ALLEY_HALL, SMALL_PRESS" }
      - { name: kind, type: enum, source: input, description: "Physical unit type", constraints: "enum: BOOTH_10X10, BOOTH_10X20, CORNER_BOOTH, ENDCAP, FEATURED_ISLAND, ARTIST_TABLE, NONPROFIT_TABLE" }
      - { name: base_price_cents, type: integer, source: input, description: "Tier-1 base price in cents; higher tiers multiply this" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE -> RESERVED -> ASSIGNED; RESERVED/ASSIGNED can return to AVAILABLE", constraints: "enum: AVAILABLE, RESERVED, ASSIGNED" }
      - { name: current_application_id, type: string, source: system, description: "System-set reference to the Application currently holding this unit (null when AVAILABLE); not an FK declaration" }

  - name: Exhibitor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered business or artist name" }
      - { name: category, type: enum, source: input, description: "Primary selling category", constraints: "enum: ARTIST_ALLEY, DEALER, PUBLISHER, STUDIO, NONPROFIT" }
      - { name: prior_years_completed, type: integer, source: input, default: 0, description: "Number of prior editions completed without eviction; renewal eligibility input" }
      - { name: prior_on_time_payments, type: integer, source: input, default: 0, description: "Count of prior invoices paid on time; renewal score input" }
      - { name: strike_points, type: integer, source: system, default: 0, description: "Accumulated policy-enforcement points from guilty issue resolutions" }
      - { name: standing, type: enum, source: system, default: GOOD, description: "Derived from strike_points: <3 GOOD, >=3 PROBATION, >=5 SUSPENDED, >=7 EVICTED", constraints: "enum: GOOD, PROBATION, SUSPENDED, EVICTED" }
      - { name: renewal_priority_score, type: integer, source: computed, description: "max(0, 10*prior_years_completed + 3*prior_on_time_payments - 8*strike_points); recomputed on every strike_points change" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: exhibitor_id, type: string, source: system, description: "FK -> Exhibitor.id; set from X-User-ID of the creating Exhibitor" }
      - { name: convention_id, type: string, source: input, description: "FK -> Convention.id" }
      - { name: category, type: enum, source: input, description: "Requested category; must equal exhibitor.category", constraints: "enum: ARTIST_ALLEY, DEALER, PUBLISHER, STUDIO, NONPROFIT" }
      - { name: channel, type: enum, source: input, description: "RENEWAL (returning exhibitors, earlier window) or OPEN (public)", constraints: "enum: RENEWAL, OPEN" }
      - { name: requested_space_kinds, type: array, source: input, description: "Non-empty array of SpaceUnit kinds the exhibitor will accept" }
      - { name: requested_space_count, type: integer, source: input, description: "Number of contiguous spaces requested (>= 1); drives provisional multi-space discount" }
      - { name: estimated_daily_sales_cents, type: integer, source: input, description: "Projected gross sales per selling day; tax guidance estimate input" }
      - { name: conflicted_juror_user_ids, type: array, source: input, default: [], description: "JuryMember X-User-ID values barred from scoring this application" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Jury/contract lifecycle dimension", constraints: "enum: DRAFT, SUBMITTED, UNDER_REVIEW, NEEDS_REVISION, JURIED_ACCEPTED, JURIED_WAITLISTED, JURIED_REJECTED, DECLINED, WITHDRAWN, CONTRACTED, PLACED, CANCELLED" }
      - { name: permit_status, type: enum, source: system, description: "Parallel sales-tax-permit dimension; initial PENDING when convention.tax_permit_required else NOT_REQUIRED", constraints: "enum: NOT_REQUIRED, PENDING, SUBMITTED, VERIFIED, REJECTED, EXPIRED, EXEMPT" }
      - { name: permit_number, type: string, source: input, description: "State sales-tax permit number (set via submit-permit)" }
      - { name: permit_expires_at, type: datetime, source: input, description: "Permit expiry instant (set via submit-permit)" }
      - { name: submitted_at, type: datetime, source: system, description: "Clock instant of most recent DRAFT/NEEDS_REVISION -> SUBMITTED transition" }
      - { name: decided_at, type: datetime, source: system, description: "Clock instant of the decide transition into JURIED_ACCEPTED/JURIED_WAITLISTED/JURIED_REJECTED" }
      - { name: jury_composite_score, type: number, source: computed, description: "Round-half-up to 2dp of the mean of distinct-juror weighted_total values; null until first score" }
      - { name: provisional_quote_cents, type: integer, source: computed, description: "Quote computed at submit time (provisional variant of space_pricing); null while DRAFT" }
      - { name: final_invoice_cents, type: integer, source: computed, description: "Invoice computed at accept-offer time (final variant of space_pricing); null until computed" }
      - { name: deposit_cents, type: integer, source: computed, description: "round_half_up(final_invoice_cents * 0.25); null until final invoice exists" }
      - { name: amount_paid_cents, type: integer, source: system, default: 0, description: "Cumulative payments recorded; set to deposit_cents on successful accept-offer" }
      - { name: badge_fees_cents, type: integer, source: system, default: 0, description: "Cumulative extra-badge fees (7500 cents each)" }
      - { name: balance_due_cents, type: integer, source: computed, default: 0, description: "final_invoice_cents - amount_paid_cents + badge_fees_cents once invoiced; 0 before" }
      - { name: refund_cents, type: integer, source: computed, description: "Refund issued at cancellation; null until CANCELLED" }
      - { name: included_badges, type: integer, source: computed, default: 0, description: "Sum of per-kind badge allotments over this application's ASSIGNED spaces" }
      - { name: purchased_extra_badges, type: integer, source: system, default: 0, description: "Cumulative extra badges purchased (capped at included_badges)" }
      - { name: tax_estimate_cents, type: integer, source: computed, description: "Forward-looking sales-tax guidance estimate computed at submit; null while DRAFT" }
      - { name: cancellation_reason, type: enum, source: system, description: "Set when status becomes CANCELLED", constraints: "enum: EXHIBITOR, DIRECTOR, EVICTION, OFFER_EXPIRED" }

  - name: JuryScore
    parent: null
    common_fields: false
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id" }
      - { name: juror_user_id, type: string, source: system, description: "X-User-ID of the scoring JuryMember (opaque operator id)" }
      - { name: originality, type: integer, source: input, description: "0..100", constraints: "0 <= value <= 100" }
      - { name: craft, type: integer, source: input, description: "0..100", constraints: "0 <= value <= 100" }
      - { name: category_fit, type: integer, source: input, description: "0..100", constraints: "0 <= value <= 100" }
      - { name: professionalism, type: integer, source: input, description: "0..100", constraints: "0 <= value <= 100" }
      - { name: weighted_total, type: number, source: computed, description: "round_half_up(0.35*originality + 0.25*craft + 0.25*category_fit + 0.15*professionalism, 2dp)" }

  - name: Placement
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id" }
      - { name: space_unit_id, type: string, source: input, description: "FK -> SpaceUnit.id" }
      - { name: status, type: enum, source: system, default: TENTATIVE, description: "TENTATIVE -> CONFIRMED -> RELEASED; TENTATIVE -> RELEASED allowed", constraints: "enum: TENTATIVE, CONFIRMED, RELEASED" }

  - name: NeighborRequest
    parent: null
    common_fields: true
    fields:
      - { name: convention_id, type: string, source: input, description: "FK -> Convention.id" }
      - { name: requester_exhibitor_id, type: string, source: system, description: "FK -> Exhibitor.id; set from X-User-ID of the creating Exhibitor" }
      - { name: target_exhibitor_id, type: string, source: input, description: "FK -> Exhibitor.id; the exhibitor to sit next to or away from" }
      - { name: kind, type: enum, source: input, description: "ADJACENT_TO or AWAY_FROM", constraints: "enum: ADJACENT_TO, AWAY_FROM" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING -> HONORED | DECLINED | WITHDRAWN | MOOT", constraints: "enum: PENDING, HONORED, DECLINED, WITHDRAWN, MOOT" }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: exhibitor_id, type: string, source: system, description: "FK -> Exhibitor.id; set from X-User-ID of the creating Exhibitor" }
      - { name: convention_id, type: string, source: input, description: "FK -> Convention.id" }
      - { name: full_name, type: string, source: input, description: "Staff legal name for the badge" }
      - { name: role_label, type: string, source: input, description: "Optional duty label (e.g. cashier, artist)" }
      - { name: badge_status, type: enum, source: system, default: NONE, description: "NONE -> ISSUED -> REVOKED", constraints: "enum: NONE, ISSUED, REVOKED" }

  - name: LoadSlot
    parent: null
    common_fields: true
    fields:
      - { name: convention_id, type: string, source: input, description: "FK -> Convention.id" }
      - { name: direction, type: enum, source: input, description: "INBOUND (load-in) or OUTBOUND (load-out)", constraints: "enum: INBOUND, OUTBOUND" }
      - { name: starts_at, type: datetime, source: input, description: "Window open instant (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Window close instant (exclusive); must be strictly after starts_at" }
      - { name: pallet_capacity, type: integer, source: input, description: "Maximum total pallet_count across active bookings" }
      - { name: reserved_pallets, type: integer, source: computed, default: 0, description: "Sum of pallet_count over bookings with status IN {REQUESTED, CONFIRMED, CHECKED_IN}" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> FULL when reserved_pallets == pallet_capacity; FULL -> OPEN when capacity frees; any -> CLOSED via run-ops once ends_at has passed", constraints: "enum: OPEN, FULL, CLOSED" }

  - name: DockDoor
    parent: null
    common_fields: false
    fields:
      - { name: convention_id, type: string, source: input, description: "FK -> Convention.id" }
      - { name: door_code, type: string, source: input, description: "Unique door identifier within the convention", constraints: "unique within convention_id" }

  - name: FreightBooking
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; must be PLACED" }
      - { name: exhibitor_id, type: string, source: system, description: "FK -> Exhibitor.id; denormalized from the application for ownership checks" }
      - { name: load_slot_id, type: string, source: input, description: "FK -> LoadSlot.id" }
      - { name: dock_door_id, type: string, source: input, description: "FK -> DockDoor.id" }
      - { name: door_starts_at, type: datetime, source: input, description: "Exclusive dock-door occupation start (inclusive bound)" }
      - { name: door_ends_at, type: datetime, source: input, description: "Exclusive dock-door occupation end (exclusive bound); half-open interval" }
      - { name: pallet_count, type: integer, source: input, description: "Pallets consumed from the load slot's aggregate capacity (>= 1)" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED -> CONFIRMED -> CHECKED_IN -> COMPLETED; REQUESTED/CONFIRMED -> CANCELLED; CONFIRMED -> NO_SHOW via run-ops", constraints: "enum: REQUESTED, CONFIRMED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW" }

  - name: IssueTicket
    parent: null
    common_fields: true
    fields:
      - { name: convention_id, type: string, source: input, description: "FK -> Convention.id" }
      - { name: exhibitor_id, type: string, source: input, description: "FK -> Exhibitor.id; subject of the complaint" }
      - { name: reporter_user_id, type: string, source: system, description: "X-User-ID of the reporting OperationsStaff/ShowDirector (opaque operator id)" }
      - { name: category, type: enum, source: input, description: "Policy category", constraints: "enum: ENCROACHMENT, NOISE, PROHIBITED_ITEM, COPYRIGHT, CONDUCT" }
      - { name: severity, type: enum, source: input, description: "MINOR = 1 point, MAJOR = 2 points, CRITICAL = 3 points", constraints: "enum: MINOR, MAJOR, CRITICAL" }
      - { name: description, type: string, source: input, description: "Free-text incident description" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> TRIAGED -> RESOLVED; OPEN/TRIAGED -> ESCALATED -> RESOLVED", constraints: "enum: OPEN, TRIAGED, ESCALATED, RESOLVED" }
      - { name: outcome, type: enum, source: system, description: "Set on resolve", constraints: "enum: GUILTY, UNFOUNDED" }
      - { name: strike_points_applied, type: integer, source: system, default: 0, description: "Severity points applied to the exhibitor when outcome == GUILTY" }

  - name: SalesReport
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; must be PLACED" }
      - { name: exhibitor_id, type: string, source: system, description: "FK -> Exhibitor.id; denormalized from the application for ownership checks" }
      - { name: lines, type: array, source: input, description: "Non-empty array of { sale_date, gross_cents } entries, one per sales batch" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> SUBMITTED", constraints: "enum: DRAFT, SUBMITTED" }
      - { name: tax_settlement_cents, type: integer, source: computed, description: "Sum over lines of round_half_up(line.gross_cents * sales_tax_rate_bp / 10000); computed at submit, null while DRAFT" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Convention
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: APPLICATIONS_OPEN
        trigger: "POST /conventions/{conventionId}/advance-phase"
        actor: ShowDirector
        preconditions:
          - "At least one CategoryQuota exists for the convention (ERR_PHASE_PRECONDITION)"
          - "At least one SpaceUnit exists for the convention (ERR_PHASE_PRECONDITION)"
        side_effects: ["Convention.version += 1"]
      - from: APPLICATIONS_OPEN
        to: JURY_REVIEW
        trigger: "POST /conventions/{conventionId}/advance-phase"
        actor: ShowDirector
        preconditions:
          - "current clock >= application_close_at (ERR_PHASE_PRECONDITION)"
        side_effects: ["Convention.version += 1"]
      - from: JURY_REVIEW
        to: PLACEMENT
        trigger: "POST /conventions/{conventionId}/advance-phase"
        actor: ShowDirector
        preconditions:
          - "No Application of this convention has status IN {SUBMITTED, UNDER_REVIEW, NEEDS_REVISION} (ERR_PHASE_PRECONDITION)"
        side_effects: ["Convention.version += 1"]
      - from: PLACEMENT
        to: LOGISTICS
        trigger: "POST /conventions/{conventionId}/advance-phase"
        actor: ShowDirector
        preconditions:
          - "No Placement of this convention has status TENTATIVE (ERR_PHASE_PRECONDITION)"
        side_effects: ["Convention.version += 1"]
      - from: LOGISTICS
        to: LIVE
        trigger: "POST /conventions/{conventionId}/advance-phase"
        actor: ShowDirector
        preconditions:
          - "current clock >= starts_at (ERR_PHASE_PRECONDITION)"
        side_effects: ["Convention.version += 1"]
      - from: LIVE
        to: LOAD_OUT
        trigger: "POST /conventions/{conventionId}/advance-phase"
        actor: ShowDirector
        preconditions:
          - "current clock >= ends_at (ERR_PHASE_PRECONDITION)"
        side_effects: ["Convention.version += 1"]
      - from: LOAD_OUT
        to: CLOSED
        trigger: "POST /conventions/{conventionId}/advance-phase"
        actor: ShowDirector
        preconditions:
          - "No FreightBooking of this convention has status IN {REQUESTED, CONFIRMED, CHECKED_IN} (ERR_PHASE_PRECONDITION)"
          - "No IssueTicket of this convention has status IN {OPEN, TRIAGED, ESCALATED} (ERR_PHASE_PRECONDITION)"
        side_effects: ["Convention.version += 1"]

  - entity: Application
    initial_state: DRAFT
    terminal_states: [JURIED_REJECTED, DECLINED, WITHDRAWN, CANCELLED]
    transitions:
      # ---- lifecycle dimension (status) ----
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{applicationId}/submit"
        actor: Exhibitor
        preconditions:
          - "Convention.phase == APPLICATIONS_OPEN (ERR_INVALID_TRANSITION)"
          - "channel == RENEWAL: renewal_open_at <= clock < application_close_at, exhibitor.prior_years_completed >= 1 and exhibitor.standing == GOOD (ERR_RENEWAL_NOT_ELIGIBLE, ERR_APPLICATION_WINDOW_CLOSED)"
          - "channel == OPEN: application_open_at <= clock < application_close_at (ERR_APPLICATION_WINDOW_CLOSED)"
          - "A CategoryQuota row exists for (convention_id, category) (ERR_CATEGORY_NOT_OFFERED)"
          - "No other Application of the same exhibitor in the same convention with status NOT IN {WITHDRAWN, JURIED_REJECTED, DECLINED, CANCELLED} (ERR_DUPLICATE_APPLICATION)"
        side_effects:
          - "submitted_at = current clock"
          - "provisional_quote_cents = space_pricing(provisional variant)"
          - "tax_estimate_cents = sales_tax_estimate"
          - "Application.version += 1"
      - from: NEEDS_REVISION
        to: SUBMITTED
        trigger: "POST /applications/{applicationId}/submit"
        actor: Exhibitor
        preconditions:
          - "Phase allowance: phase == APPLICATIONS_OPEN (all DRAFT -> SUBMITTED checks apply) OR phase == JURY_REVIEW (revision resubmission; window checks waived, quota/duplicate checks still apply)"
          - "ERR_APPLICATION_WINDOW_CLOSED only when phase == APPLICATIONS_OPEN and outside the channel window"
        
        side_effects:
          - "submitted_at = current clock"
          - "provisional_quote_cents recomputed (provisional variant)"
          - "tax_estimate_cents recomputed"
          - "Application.version += 1"
        note: "Revision loop: UNDER_REVIEW -> NEEDS_REVISION -> SUBMITTED may repeat without bound"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "system (automatic when the first JuryScore is posted for this application)"
        actor: system
        preconditions: []
        side_effects: ["Application.version += 1"]
      - from: UNDER_REVIEW
        to: NEEDS_REVISION
        trigger: "POST /applications/{applicationId}/request-revision"
        actor: ShowDirector
        preconditions: []
        side_effects: ["Application.version += 1"]
      - from: UNDER_REVIEW
        to: JURIED_ACCEPTED
        trigger: "POST /applications/{applicationId}/decide with decision=ACCEPTED"
        actor: ShowDirector
        preconditions:
          - "At least 3 JuryScore rows from distinct juror_user_id values exist (ERR_JURY_QUORUM_NOT_MET)"
          - "jury_composite_score >= 70.00 (ERR_SCORE_BELOW_THRESHOLD)"
          - "CategoryQuota.accepted_count < max_accepted (ERR_CATEGORY_QUOTA_FULL)"
        side_effects:
          - "decided_at = current clock"
          - "CategoryQuota.accepted_count += 1"
          - "Application.version += 1"
      - from: UNDER_REVIEW
        to: JURIED_WAITLISTED
        trigger: "POST /applications/{applicationId}/decide with decision=WAITLISTED"
        actor: ShowDirector
        preconditions:
          - "At least 3 distinct-juror JuryScore rows exist (ERR_JURY_QUORUM_NOT_MET)"
          - "jury_composite_score >= 50.00 (ERR_SCORE_BELOW_THRESHOLD)"
          - "CategoryQuota.waitlisted_count < max_waitlisted (ERR_WAITLIST_FULL)"
        side_effects:
          - "decided_at = current clock"
          - "CategoryQuota.waitlisted_count += 1"
          - "Application.version += 1"
      - from: UNDER_REVIEW
        to: JURIED_REJECTED
        trigger: "POST /applications/{applicationId}/decide with decision=REJECTED"
        actor: ShowDirector
        preconditions:
          - "At least 3 distinct-juror JuryScore rows exist (ERR_JURY_QUORUM_NOT_MET)"
        side_effects:
          - "decided_at = current clock"
          - "Every PENDING NeighborRequest where this application's exhibitor is requester or target -> MOOT"
          - "Application.version += 1"
      - from: JURIED_WAITLISTED
        to: JURIED_ACCEPTED
        trigger: "system (waitlist promotion sweep, fired whenever a category's accepted_count decreases: decline, cancel, or eviction of an accepted/contracted/placed application in the same convention+category)"
        actor: system
        preconditions:
          - "CategoryQuota.accepted_count < max_accepted after the decrease"
        side_effects:
          - "Selector: among JURIED_WAITLISTED applications of the same convention+category, order by jury_composite_score DESC, tie-break renewal_priority_score of the exhibitor DESC, tie-break Application.created_at ASC; promote exactly one"
          - "decided_at = current clock"
          - "CategoryQuota.waitlisted_count -= 1; accepted_count += 1"
          - "Promoted Application.version += 1"
      - from: JURIED_ACCEPTED
        to: CONTRACTED
        trigger: "POST /applications/{applicationId}/accept-offer"
        actor: Exhibitor
        preconditions:
          - "current clock <= decided_at + deposit_window_days * 86400s (ERR_OFFER_EXPIRED)"
          - "exhibitor.standing IN {GOOD, PROBATION} (ERR_EXHIBITOR_SUSPENDED)"
          - "If convention.tax_permit_required: permit_status IN {VERIFIED, EXEMPT} (ERR_PERMIT_NOT_VERIFIED)"
          - "At least one TENTATIVE Placement exists for this application (ERR_INVALID_TRANSITION)"
          - "final_invoice_cents = space_pricing(final variant) over the RESERVED SpaceUnits of this application; deposit_cents = round_half_up(final_invoice_cents * 0.25)"
          - "Request deposit_cents field must equal computed deposit_cents exactly (ERR_DEPOSIT_MISMATCH)"
        side_effects:
          - "final_invoice_cents and deposit_cents persisted"
          - "amount_paid_cents = deposit_cents"
          - "balance_due_cents = final_invoice_cents - amount_paid_cents + badge_fees_cents"
          - "Application.version += 1"
      - from: JURIED_ACCEPTED
        to: DECLINED
        trigger: "POST /applications/{applicationId}/decline"
        actor: Exhibitor
        preconditions: []
        side_effects:
          - "CategoryQuota.accepted_count -= 1, then the waitlist promotion sweep runs for this category"
          - "Every TENTATIVE Placement of this application -> RELEASED and its SpaceUnit RESERVED -> AVAILABLE"
          - "Every PENDING NeighborRequest involving this exhibitor -> MOOT"
          - "Application.version += 1"
      - from: JURIED_ACCEPTED
        to: DECLINED
        trigger: "system (run-ops offer-expiry sweep: JURIED_ACCEPTED with decided_at + deposit_window_days * 86400s < clock)"
        actor: system
        preconditions: []
        side_effects:
          - "cancellation_reason = OFFER_EXPIRED is recorded in a system note; CategoryQuota.accepted_count -= 1; promotion sweep runs"
          - "TENTATIVE placements released; their SpaceUnits RESERVED -> AVAILABLE; PENDING neighbor requests -> MOOT"
          - "Application.version += 1"
      - from: CONTRACTED
        to: PLACED
        trigger: "system (automatic when one of this application's TENTATIVE placements is confirmed via POST /placements/{placementId}/confirm)"
        actor: system
        preconditions: []
        side_effects:
          - "included_badges recomputed from ASSIGNED SpaceUnits"
          - "balance_due_cents recomputed"
          - "Application.version += 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /applications/{applicationId}/withdraw"
        actor: Exhibitor
        preconditions: []
        side_effects:
          - "Every PENDING NeighborRequest involving this exhibitor -> MOOT"
          - "Application.version += 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /applications/{applicationId}/withdraw"
        actor: Exhibitor
        preconditions: []
        side_effects: ["Same MOOT cascade as DRAFT -> WITHDRAWN", "Application.version += 1"]
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /applications/{applicationId}/withdraw"
        actor: Exhibitor
        preconditions: []
        side_effects: ["Same MOOT cascade", "Application.version += 1"]
      - from: NEEDS_REVISION
        to: WITHDRAWN
        trigger: "POST /applications/{applicationId}/withdraw"
        actor: Exhibitor
        preconditions: []
        side_effects: ["Same MOOT cascade", "Application.version += 1"]
      - from: JURIED_WAITLISTED
        to: WITHDRAWN
        trigger: "POST /applications/{applicationId}/withdraw"
        actor: Exhibitor
        preconditions: []
        side_effects:
          - "CategoryQuota.waitlisted_count -= 1"
          - "Same MOOT cascade"
          - "Application.version += 1"
      - from: CONTRACTED
        to: CANCELLED
        trigger: "POST /applications/{applicationId}/cancel"
        actor: Exhibitor
        preconditions: []
        side_effects:
          - "cancellation_reason = EXHIBITOR (or DIRECTOR when actor is ShowDirector); refund_cents = cancellation_refund(amount_paid_cents, clock)"
          - "TENTATIVE/CONFIRMED placements -> RELEASED; their SpaceUnits RESERVED/ASSIGNED -> AVAILABLE"
          - "StaffMember badges ISSUED -> REVOKED for this convention"
          - "FreightBookings in REQUESTED/CONFIRMED -> CANCELLED; their LoadSlots' reserved_pallets -= pallet_count (FULL -> OPEN if freed)"
          - "CategoryQuota.accepted_count -= 1; promotion sweep runs for this category"
          - "PENDING NeighborRequests involving this exhibitor -> MOOT"
          - "Application.version += 1"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /applications/{applicationId}/cancel"
        actor: Exhibitor
        preconditions: []
        side_effects: ["Same cascade as CONTRACTED -> CANCELLED", "Application.version += 1"]
      - from: CONTRACTED
        to: CANCELLED
        trigger: "system (eviction cascade: exhibitor.standing becomes EVICTED)"
        actor: system
        preconditions: []
        side_effects: ["Same cascade as exhibitor cancel but cancellation_reason = EVICTION and refund_cents = 0"]
      - from: PLACED
        to: CANCELLED
        trigger: "system (eviction cascade: exhibitor.standing becomes EVICTED)"
        actor: system
        preconditions: []
        side_effects: ["Same cascade as exhibitor cancel but cancellation_reason = EVICTION and refund_cents = 0"]
      - from: JURIED_ACCEPTED
        to: CANCELLED
        trigger: "system (eviction cascade: exhibitor.standing becomes EVICTED)"
        actor: system
        preconditions: []
        side_effects: ["cancellation_reason = EVICTION; refund_cents = 0; accepted_count -= 1; promotion sweep; TENTATIVE placements released"]
      # ---- permit dimension (permit_status), evolves independently of status ----
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /applications/{applicationId}/submit-permit"
        actor: Exhibitor
        preconditions: ["permit_number and permit_expires_at supplied"]
        side_effects: ["permit_number/permit_expires_at stored", "Application.version += 1"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /applications/{applicationId}/submit-permit"
        actor: Exhibitor
        preconditions: []
        side_effects: ["Application.version += 1"]
        note: "Permit resubmission loop: SUBMITTED -> REJECTED -> SUBMITTED may repeat"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /applications/{applicationId}/verify-permit"
        actor: ShowDirector
        preconditions: []
        side_effects: ["Application.version += 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /applications/{applicationId}/reject-permit"
        actor: ShowDirector
        preconditions: []
        side_effects: ["Application.version += 1"]
      - from: PENDING
        to: EXEMPT
        trigger: "POST /applications/{applicationId}/claim-exemption"
        actor: Exhibitor
        preconditions: ["exhibitor.category == NONPROFIT (ERR_EXEMPTION_NOT_ALLOWED)"]
        side_effects: ["Application.version += 1"]
      - from: VERIFIED
        to: EXPIRED
        trigger: "system (run-ops permit-expiry sweep: VERIFIED with permit_expires_at < clock)"
        actor: system
        preconditions: []
        side_effects: ["Application.version += 1"]

  - entity: SpaceUnit
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /placements (creates TENTATIVE placement)"
        actor: ShowDirector
        preconditions:
          - "status == AVAILABLE (ERR_SPACE_NOT_AVAILABLE)"
          - "kind IN application.requested_space_kinds (ERR_SPACE_KIND_MISMATCH)"
          - "(application.category, kind, hall) satisfies the category-zone map (ERR_CATEGORY_ZONE_VIOLATION)"
        side_effects: ["current_application_id = application.id", "SpaceUnit.version += 1"]
      - from: RESERVED
        to: ASSIGNED
        trigger: "POST /placements/{placementId}/confirm"
        actor: ShowDirector
        preconditions: []
        side_effects: ["SpaceUnit.version += 1"]
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /placements/{placementId}/release, or system (offer decline / expiry / cancellation / eviction of the holding application)"
        actor: ShowDirector
        preconditions: []
        side_effects: ["current_application_id = null", "SpaceUnit.version += 1"]
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "system (cancellation or eviction of the holding application)"
        actor: system
        preconditions: []
        side_effects: ["current_application_id = null", "SpaceUnit.version += 1"]

  - entity: Placement
    initial_state: TENTATIVE
    terminal_states: [RELEASED]
    transitions:
      - from: TENTATIVE
        to: CONFIRMED
        trigger: "POST /placements/{placementId}/confirm"
        actor: ShowDirector
        preconditions:
          - "application.status IN {CONTRACTED, PLACED} (ERR_INVALID_TRANSITION) — PLACED is allowed so multi-space exhibitors can confirm further placements"
          - "Convention.phase == PLACEMENT (ERR_PHASE_PRECONDITION)"
        side_effects:
          - "SpaceUnit RESERVED -> ASSIGNED"
          - "Application CONTRACTED -> PLACED (already PLACED stays PLACED); included_badges recomputed over all ASSIGNED spaces"
          - "Neighbor-request evaluation sweep for this convention (see NeighborRequest)"
          - "Placement.version += 1"
      - from: TENTATIVE
        to: RELEASED
        trigger: "POST /placements/{placementId}/release"
        actor: ShowDirector
        preconditions: []
        side_effects: ["SpaceUnit RESERVED -> AVAILABLE", "Placement.version += 1"]
      - from: TENTATIVE
        to: RELEASED
        trigger: "system (holding application declined/expired/cancelled/evicted)"
        actor: system
        preconditions: []
        side_effects: ["SpaceUnit RESERVED -> AVAILABLE", "Placement.version += 1"]
      - from: CONFIRMED
        to: RELEASED
        trigger: "system (holding application cancelled or evicted)"
        actor: system
        preconditions: []
        side_effects: ["SpaceUnit ASSIGNED -> AVAILABLE", "Placement.version += 1"]

  - entity: NeighborRequest
    initial_state: PENDING
    terminal_states: [HONORED, DECLINED, WITHDRAWN, MOOT]
    transitions:
      - from: PENDING
        to: HONORED
        trigger: "system (evaluated during placement-confirm sweep)"
        actor: system
        preconditions:
          - "Both requester and target exhibitors hold at least one CONFIRMED placement in this convention after this confirm"
          - "kind == ADJACENT_TO and at least one requester space is adjacent to at least one target space (same block, |unit_number delta| == 1); OR kind == AWAY_FROM and no requester space is adjacent to any target space"
        side_effects: ["NeighborRequest.version += 1"]
      - from: PENDING
        to: DECLINED
        trigger: "system (evaluated during placement-confirm sweep)"
        actor: system
        preconditions:
          - "Both parties hold CONFIRMED placements after this confirm AND the adjacency predicate for kind is false"
        side_effects: ["NeighborRequest.version += 1"]
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /neighbor-requests/{neighborRequestId}/withdraw"
        actor: Exhibitor
        preconditions: ["X-User-ID == requester_exhibitor_id (ERR_FORBIDDEN_OWNERSHIP)"]
        side_effects: ["NeighborRequest.version += 1"]
      - from: PENDING
        to: MOOT
        trigger: "system (either party's application reaches WITHDRAWN, JURIED_REJECTED, DECLINED, or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: ["NeighborRequest.version += 1"]

  - entity: StaffMember
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: ISSUED
        trigger: "POST /staff-members/{staffMemberId}/issue-badge"
        actor: Exhibitor
        preconditions:
          - "The exhibitor's application for this convention has status == PLACED (ERR_INVALID_TRANSITION)"
          - "Convention.phase IN {LOGISTICS, LIVE} (ERR_PHASE_PRECONDITION)"
          - "Compliance gate: exhibitor.standing NOT IN {SUSPENDED, EVICTED} and no IssueTicket with status IN {OPEN, TRIAGED, ESCALATED} and severity == CRITICAL exists for this exhibitor+convention (ERR_COMPLIANCE_HOLD)"
          - "Capacity gate: issued badge count for this exhibitor+convention < included_badges + purchased_extra_badges (ERR_BADGE_ALLOCATION_EXHAUSTED)"
        side_effects: ["StaffMember.version += 1"]
      - from: ISSUED
        to: REVOKED
        trigger: "POST /staff-members/{staffMemberId}/revoke-badge"
        actor: OperationsStaff
        preconditions: []
        side_effects: ["StaffMember.version += 1", "Frees one unit of badge allocation (derived count drops)"]
      - from: ISSUED
        to: REVOKED
        trigger: "system (application cancellation or eviction cascade)"
        actor: system
        preconditions: []
        side_effects: ["StaffMember.version += 1"]

  - entity: LoadSlot
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system (automatic when reserved_pallets reaches pallet_capacity after a booking creation)"
        actor: system
        preconditions: []
        side_effects: ["LoadSlot.version += 1"]
      - from: FULL
        to: OPEN
        trigger: "system (automatic when a cancellation or completion lowers reserved_pallets below pallet_capacity)"
        actor: system
        preconditions: []
        side_effects: ["LoadSlot.version += 1"]
      - from: OPEN
        to: CLOSED
        trigger: "system (run-ops sweep: ends_at < clock)"
        actor: system
        preconditions: []
        side_effects: ["LoadSlot.version += 1"]
      - from: FULL
        to: CLOSED
        trigger: "system (run-ops sweep: ends_at < clock)"
        actor: system
        preconditions: []
        side_effects: ["LoadSlot.version += 1"]

  - entity: FreightBooking
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /freight-bookings/{freightBookingId}/confirm"
        actor: OperationsStaff
        preconditions: []
        side_effects: ["FreightBooking.version += 1"]
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /freight-bookings/{freightBookingId}/check-in"
        actor: OperationsStaff
        preconditions:
          - "load_slot.starts_at <= clock < load_slot.ends_at (ERR_INVALID_TIME_WINDOW)"
        side_effects: ["FreightBooking.version += 1"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /freight-bookings/{freightBookingId}/cancel"
        actor: Exhibitor
        preconditions: []
        side_effects: ["LoadSlot.reserved_pallets -= pallet_count; LoadSlot FULL -> OPEN if below capacity", "FreightBooking.version += 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /freight-bookings/{freightBookingId}/cancel"
        actor: Exhibitor
        preconditions: []
        side_effects: ["LoadSlot.reserved_pallets -= pallet_count; LoadSlot FULL -> OPEN if below capacity", "FreightBooking.version += 1"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "system (application cancellation or eviction cascade)"
        actor: system
        preconditions: []
        side_effects: ["LoadSlot.reserved_pallets -= pallet_count (FULL -> OPEN if freed)"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system (application cancellation or eviction cascade)"
        actor: system
        preconditions: []
        side_effects: ["LoadSlot.reserved_pallets -= pallet_count (FULL -> OPEN if freed)"]
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system (run-ops sweep: load_slot.ends_at < clock and booking never checked in)"
        actor: system
        preconditions: []
        side_effects: ["reserved_pallets unchanged — the no-show held the capacity"]
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system (run-ops sweep: load_slot.ends_at < clock)"
        actor: system
        preconditions: []
        side_effects: ["LoadSlot.reserved_pallets -= pallet_count (FULL -> OPEN if freed)"]

  - entity: IssueTicket
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: TRIAGED
        trigger: "POST /issue-tickets/{issueTicketId}/triage"
        actor: ShowDirector
        preconditions: []
        side_effects: ["IssueTicket.version += 1"]
      - from: OPEN
        to: ESCALATED
        trigger: "POST /issue-tickets/{issueTicketId}/escalate"
        actor: ShowDirector
        preconditions: []
        side_effects: ["IssueTicket.version += 1"]
      - from: TRIAGED
        to: ESCALATED
        trigger: "POST /issue-tickets/{issueTicketId}/escalate"
        actor: ShowDirector
        preconditions: []
        side_effects: ["IssueTicket.version += 1"]
      - from: OPEN
        to: RESOLVED
        trigger: "POST /issue-tickets/{issueTicketId}/resolve"
        actor: ShowDirector
        preconditions:
          - "Segregation of duties: resolving X-User-ID != reporter_user_id (ERR_DUTY_SEGREGATION)"
        side_effects:
          - "outcome persisted; if outcome == GUILTY: strike_points_applied = severity points (MINOR 1 / MAJOR 2 / CRITICAL 3) and Exhibitor.strike_points += strike_points_applied"
          - "Exhibitor.standing recomputed by strike_standing_threshold; on entering EVICTED the eviction cascade fires"
          - "IssueTicket.version += 1"
      - from: TRIAGED
        to: RESOLVED
        trigger: "POST /issue-tickets/{issueTicketId}/resolve"
        actor: ShowDirector
        preconditions: ["Segregation of duties: resolver != reporter (ERR_DUTY_SEGREGATION)"]
        side_effects: ["Same strike/standing/cascade side effects as OPEN -> RESOLVED"]
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /issue-tickets/{issueTicketId}/resolve"
        actor: ShowDirector
        preconditions: ["Segregation of duties: resolver != reporter (ERR_DUTY_SEGREGATION)"]
        side_effects: ["Same strike/standing/cascade side effects as OPEN -> RESOLVED"]

  - entity: SalesReport
    initial_state: DRAFT
    terminal_states: [SUBMITTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /sales-reports/{salesReportId}/submit"
        actor: Exhibitor
        preconditions:
          - "Convention.phase IN {LIVE, LOAD_OUT, CLOSED} (ERR_PHASE_PRECONDITION)"
          - "lines array is non-empty (ERR_SALES_REPORT_EMPTY)"
        side_effects:
          - "tax_settlement_cents = sales_tax_settlement(lines)"
          - "SalesReport.version += 1"

  - entity: Exhibitor
    initial_state: GOOD
    terminal_states: []
    transitions:
      - from: GOOD
        to: PROBATION
        trigger: "system (strike_points crosses >= 3 after a guilty resolution)"
        actor: system
        preconditions: []
        side_effects: ["renewal_priority_score recomputed", "Exhibitor.version += 1"]
      - from: PROBATION
        to: SUSPENDED
        trigger: "system (strike_points crosses >= 5)"
        actor: system
        preconditions: []
        side_effects: ["renewal_priority_score recomputed", "Exhibitor.version += 1"]
      - from: SUSPENDED
        to: EVICTED
        trigger: "system (strike_points crosses >= 7)"
        actor: system
        preconditions: []
        side_effects:
          - "Eviction cascade: every Application of this exhibitor with status IN {JURIED_ACCEPTED, CONTRACTED, PLACED} -> CANCELLED with cancellation_reason = EVICTION and refund_cents = 0"
          - "Per cancelled application: placements RELEASED, SpaceUnits -> AVAILABLE, ISSUED badges -> REVOKED, REQUESTED/CONFIRMED FreightBookings -> CANCELLED (LoadSlot reserved_pallets decremented, FULL -> OPEN if freed), CategoryQuota.accepted_count decremented, waitlist promotion sweep runs per affected category"
          - "renewal_priority_score recomputed"
          - "Exhibitor.version += 1"
        note: "Standing is derived from strike_points; transitions may skip states (e.g. GOOD -> SUSPENDED when points jump from 2 to 6). The listed transitions describe threshold crossings, not mandatory single steps."

# =============================================================================
# Table 2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: application-revision-stale-version
    parent_entity: Application
    write_endpoint: "PATCH /applications/{applicationId}"
    occ_field: expected_application_version
    description: |
      Revising an Application whose version has advanced since the client last
      observed it is rejected: the client's edits were authored against a stale
      snapshot (for example, a prior PATCH already applied and bumped the
      version), so the newer revision supersedes the stale write.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
  - rule_id: convention-config-stale-version
    parent_entity: Convention
    write_endpoint: "PUT /conventions/{conventionId}"
    occ_field: expected_convention_version
    description: |
      Updating Convention configuration whose version has advanced since the
      client last observed it is rejected: another accepted update already
      bumped the version, so the current write would silently overwrite config
      the client never saw.
    error_id: ERR_STALE_CONVENTION_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: space_pricing
    trigger: "Application submit (provisional variant -> provisional_quote_cents) and accept-offer (final variant -> final_invoice_cents)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED (steps must execute in this sequence):
      # 1. Per-space price: price_i = round_half_up(base_price_cents_i * tier_mult)
      #    where tier_mult is chosen by sold_count = number of SpaceUnits of the
      #    convention with status IN {RESERVED, ASSIGNED} at pricing time:
      #      sold_count < 20            -> TIER_1, mult 1.00
      #      20 <= sold_count < 45      -> TIER_2, mult 1.20
      #      sold_count >= 45           -> TIER_3, mult 1.45
      # 2. subtotal = sum(price_i)
      # 3. discount_pct keyed on the PRE-DISCOUNT subtotal (never on the
      #    discounted value — this breaks the apparent subtotal<->discount loop):
      #      subtotal >= 300000 -> 0.10 ; subtotal >= 150000 -> 0.05 ; else 0
      # 4. early_bird_pct = 0.10 if application.submitted_at <= early_bird_deadline else 0
      # 5. total = round_half_up(subtotal * (1 - discount_pct - early_bird_pct))
      #    (a single rounding after combining both percentage deductions)
      # 6. deposit = round_half_up(total * 0.25) ; balance = total - amount_paid + badge_fees
    input_set: |
      provisional variant: scope = requested_space_count hypothetical spaces priced at
      min(base_price_cents) over AVAILABLE SpaceUnits whose kind IN requested_space_kinds
      (if a requested kind has no AVAILABLE unit, use KIND_FLOOR_PRICE for that kind);
      discount tier uses requested_space_count as the space count and tier_mult from the
      sold_count at submit time.
      final variant: scope = the SpaceUnits with status RESERVED whose
      current_application_id == application.id; discount tier uses the count of those
      spaces; tier_mult from sold_count at accept time.
    constants:
      TIER_1_SOLD_LT: 20
      TIER_2_SOLD_LT: 45
      TIER_1_MULT: 1.00
      TIER_2_MULT: 1.20
      TIER_3_MULT: 1.45
      DISCOUNT_TIER_1_SUBTOTAL_CENTS: 150000
      DISCOUNT_TIER_1_PCT: 0.05
      DISCOUNT_TIER_2_SUBTOTAL_CENTS: 300000
      DISCOUNT_TIER_2_PCT: 0.10
      EARLY_BIRD_PCT: 0.10
      DEPOSIT_PCT: 0.25
      KIND_FLOOR_PRICE: {BOOTH_10X10: 95000, BOOTH_10X20: 175000, CORNER_BOOTH: 140000, ENDCAP: 160000, FEATURED_ISLAND: 400000, ARTIST_TABLE: 27500, NONPROFIT_TABLE: 15000}
    precision: "integer cents; round_half_up at steps 1, 5, 6 only"
    variants:
      - name: provisional
        when: "computed at every submit transition (DRAFT/NEEDS_REVISION -> SUBMITTED)"
        difference: "Scope and space count come from the request (requested_space_count, cheapest AVAILABLE unit per requested kind); tier_mult uses sold_count at submit time"
      - name: final
        when: "computed at accept-offer"
        difference: "Scope and space count come from actually RESERVED SpaceUnits; tier_mult uses sold_count at accept time; identical application inputs can therefore produce a different total than provisional"

  - name: jury_composite_score
    trigger: "Recomputed after every JuryScore creation; read by decide"
    algorithm: weighted_scoring
    formula: |
      per_juror = round_half_up(0.35*originality + 0.25*craft + 0.25*category_fit + 0.15*professionalism, 2dp)
      eligible set = JuryScore rows of the application, deduplicated by juror_user_id
      (creation enforces uniqueness, so the set is already distinct)
      jury_composite_score = round_half_up(mean(per_juror over eligible set), 2dp)
      Decision gating (non-linear branch on the score):
        composite >= 70.00 -> decision ACCEPTED permitted
        50.00 <= composite < 70.00 -> only WAITLISTED or REJECTED permitted
        composite < 50.00 -> only REJECTED permitted
      Quorum gate: fewer than 3 distinct jurors scored -> no decision permitted
    input_set: "All JuryScore rows with application_id == this application (immutable once created)"
    constants:
      W_ORIGINALITY: 0.35
      W_CRAFT: 0.25
      W_CATEGORY_FIT: 0.25
      W_PROFESSIONALISM: 0.15
      QUORUM: 3
      ACCEPT_THRESHOLD: 70.00
      WAITLIST_THRESHOLD: 50.00
    precision: "2 decimal places, round_half_up; per-juror rounding happens BEFORE the mean"

  - name: badge_allocation
    trigger: "Recomputed when a placement is confirmed (included_badges) and read at every issue-badge / badge-extras call"
    algorithm: aggregation
    formula: |
      included_badges = sum(BADGES_PER_KIND[kind] over SpaceUnits with status ASSIGNED
                            and current_application_id == application.id)
      total_allocation = included_badges + purchased_extra_badges
      issued = count of StaffMember rows of this exhibitor+convention with badge_status == ISSUED
      remaining = total_allocation - issued
      purchase rule: each badge-extras call with quantity q requires
        purchased_extra_badges + q <= included_badges  (ERR_BADGE_EXTRA_LIMIT)
        and adds q * EXTRA_BADGE_FEE_CENTS to badge_fees_cents and balance_due_cents
      issue rule: issue-badge requires remaining >= 1 (ERR_BADGE_ALLOCATION_EXHAUSTED)
    input_set: "ASSIGNED SpaceUnits of the application only (RESERVED units contribute nothing); StaffMember badge_status == ISSUED only"
    constants:
      BADGES_PER_KIND: {BOOTH_10X10: 4, BOOTH_10X20: 6, CORNER_BOOTH: 6, ENDCAP: 8, FEATURED_ISLAND: 12, ARTIST_TABLE: 2, NONPROFIT_TABLE: 2}
      EXTRA_BADGE_FEE_CENTS: 7500

  - name: renewal_priority_score
    trigger: "Recomputed on every Exhibitor.strike_points change; read by waitlist promotion tie-break and renewal eligibility"
    algorithm: weighted_scoring
    formula: |
      renewal_priority_score = max(0, 10*prior_years_completed + 3*prior_on_time_payments - 8*strike_points)
      renewal channel eligibility: prior_years_completed >= 1 AND standing == GOOD
    input_set: "The single Exhibitor row"
    constants:
      W_PRIOR_YEAR: 10
      W_ON_TIME_PAYMENT: 3
      W_STRIKE_POINT: -8

  - name: strike_standing_threshold
    trigger: "After every guilty issue resolution updates Exhibitor.strike_points"
    algorithm: threshold
    formula: |
      standing = GOOD      if strike_points < 3
                 PROBATION if 3 <= strike_points < 5
                 SUSPENDED if 5 <= strike_points < 7
                 EVICTED   if strike_points >= 7
      Entering EVICTED fires the eviction cascade (see Exhibitor state machine).
      Boundaries are inclusive at the lower edge of each band (>= 3, >= 5, >= 7).
    input_set: "The single Exhibitor row"
    constants:
      POINTS_MINOR: 1
      POINTS_MAJOR: 2
      POINTS_CRITICAL: 3
      PROBATION_AT: 3
      SUSPENDED_AT: 5
      EVICTED_AT: 7

  - name: cancellation_refund
    trigger: "Application cancel transition (CONTRACTED/PLACED -> CANCELLED by exhibitor or director)"
    algorithm: threshold
    formula: |
      boundary_60 = starts_at - 60 days ; boundary_30 = starts_at - 30 days
      refund_pct = 1.00 if cancelled_at <= boundary_60
                   0.50 if boundary_60 < cancelled_at <= boundary_30
                   0.00 if cancelled_at > boundary_30
      refund_cents = round_half_up(amount_paid_cents * refund_pct)
      Eviction-driven cancellations bypass this rule: refund_cents = 0.
    input_set: "The cancelled Application (amount_paid_cents) and its Convention (starts_at)"
    constants:
      FULL_REFUND_DAYS: 60
      HALF_REFUND_DAYS: 30
    precision: "integer cents, round_half_up; boundary instants compare inclusive (<=)"

  - name: sales_tax_estimate
    trigger: "Application submit (provisional guidance figure -> tax_estimate_cents)"
    algorithm: forward_looking
    formula: |
      selling_days = inclusive calendar-day count from date(convention.starts_at) to date(convention.ends_at)
      per_day_tax = round_half_up(estimated_daily_sales_cents * sales_tax_rate_bp / 10000)
      tax_estimate_cents = per_day_tax * selling_days
      # rounding order pinned: per-day rounding BEFORE multiplying by selling_days
    input_set: "The submitting Application (estimated_daily_sales_cents) and its Convention"
    precision: "integer cents, round_half_up per day, then integer multiply"
    variants:
      - name: estimate
        when: "at submit"
        difference: "Forward-looking: uniform projected daily sales, rounded per day then multiplied by selling_days"
      - name: settlement_basis_preview
        when: "never persisted; documents the contrast with sales_tax_settlement"
        difference: "The settlement uses actual per-line grosses and per-line rounding; for identical totals the two variants can disagree"

  - name: sales_tax_settlement
    trigger: "SalesReport submit (-> tax_settlement_cents)"
    algorithm: aggregation
    formula: |
      tax_settlement_cents = sum over lines of round_half_up(line.gross_cents * sales_tax_rate_bp / 10000)
      # rounding order pinned: per-LINE rounding first, then sum.
      # (sum-then-round of the same lines can differ; this scaffold pins per-line-then-sum)
    input_set: "The SalesReport's lines array (all lines, any sale_date)"
    precision: "integer cents, round_half_up per line"
    variants:
      - name: settlement
        when: "at SalesReport submit"
        difference: "Chronological actuals: per-line rounding then sum; operates on SalesReport (a different entity domain than space_pricing on Application)"

  - name: load_slot_capacity
    trigger: "FreightBooking creation, cancellation, completion"
    algorithm: aggregation
    formula: |
      reserved_pallets = sum(pallet_count over FreightBookings of the slot with
                             status IN {REQUESTED, CONFIRMED, CHECKED_IN})
      creation rule: reserved_pallets + new pallet_count <= pallet_capacity (ERR_SLOT_CAPACITY_EXCEEDED)
      status rule: reserved_pallets == pallet_capacity -> FULL ; reserved_pallets < pallet_capacity -> OPEN (unless CLOSED)
    input_set: "Bookings of the LoadSlot in the three active statuses only"

  - name: dock_door_conflict
    trigger: "FreightBooking creation"
    algorithm: interval_merge
    formula: |
      A new occupation [door_starts_at, door_ends_at) on a DockDoor conflicts with an
      existing booking [s, e) of the same door with status IN {REQUESTED, CONFIRMED, CHECKED_IN} iff
        door_starts_at < e + BUFFER_MINUTES AND s < door_ends_at + BUFFER_MINUTES
      The buffer applies on both sides of every existing interval; a new window starting
      exactly at e + BUFFER_MINUTES is accepted (strict inequality, half-open semantics).
      Door windows must also satisfy: load_slot.starts_at <= door_starts_at and
      door_ends_at <= load_slot.ends_at (ERR_DOOR_WINDOW_OUTSIDE_SLOT).
    input_set: "Active-status bookings of the same DockDoor"
    constants:
      BUFFER_MINUTES: 15

  - name: waitlist_promotion_order
    trigger: "Promotion sweep after accepted_count decreases (decline, cancel, eviction, offer expiry)"
    algorithm: weighted_scoring
    formula: |
      candidates = Applications of the same convention+category with status JURIED_WAITLISTED
      order by jury_composite_score DESC,
             then exhibitor.renewal_priority_score DESC,
             then Application.created_at ASC
      promote the first candidate; if candidates empty -> no-op (no error)
    input_set: "JURIED_WAITLISTED applications of the affected convention+category"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Every id in the path and every *Id FK field in the body exists (path validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"
  - priority: 4
    category: auth
    check: "Ownership scope: when X-User-Role is Exhibitor, the target resource's exhibitor_id (or application.exhibitor_id, requester_exhibitor_id, or the path exhibitor id) must equal X-User-ID"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "exhibitor-scoped endpoints (GET/PATCH/action on own applications, staff, freight, sales, neighbor requests, exhibitor record)"
  - priority: 5
    category: state
    check: "State preconditions: transition from-state valid (ERR_INVALID_TRANSITION); OCC expected_*_version matches current version (ERR_STALE_APPLICATION_VERSION / ERR_STALE_CONVENTION_VERSION)"
    error_id: ERR_INVALID_TRANSITION
    http_status: 409
    applies_to: "all state-transition endpoints and the two OCC write endpoints"
  - priority: 6
    category: business_temporal
    check: "Clock/phase/window gates: application window, renewal window, offer-expiry window, freight phase gate, slot-window containment precheck, sales-report phase gate, advance-phase clock gates"
    error_id: "ERR_APPLICATION_WINDOW_CLOSED | ERR_OFFER_EXPIRED | ERR_FREIGHT_WRONG_PHASE | ERR_INVALID_TIME_WINDOW | ERR_PHASE_PRECONDITION"
    http_status: 422
    applies_to: "submit, accept-offer, freight-booking create/check-in, sales-report submit, advance-phase, load-slot create"
  - priority: 7
    category: business_safety
    check: "Compliance and duty gates: juror conflict-of-interest, resolver!=reporter, exhibitor standing, permit verification, badge compliance hold"
    error_id: "ERR_JURY_CONFLICT_OF_INTEREST | ERR_DUTY_SEGREGATION | ERR_EXHIBITOR_SUSPENDED | ERR_PERMIT_NOT_VERIFIED | ERR_COMPLIANCE_HOLD | ERR_EXEMPTION_NOT_ALLOWED"
    http_status: 422
    applies_to: "jury-score create, issue resolve, accept-offer, issue-badge, claim-exemption"
  - priority: 8
    category: business_referential
    check: "Cross-entity reference integrity: application category equals exhibitor category, category offered in convention, neighbor target has a live application, freight/sales application's status is PLACED"
    error_id: "ERR_CATEGORY_MISMATCH | ERR_CATEGORY_NOT_OFFERED | ERR_NEIGHBOR_TARGET_NOT_APPLIED | ERR_NEIGHBOR_SELF_TARGET | ERR_APPLICATION_NOT_PLACED | ERR_STAFF_NOT_ALLOWED_YET"
    http_status: 422
    applies_to: "application create/submit, neighbor-request create, freight-booking create, sales-report create, staff-member create"
  - priority: 9
    category: business_constraint
    check: "Constraint satisfaction: uniqueness (duplicate application / jury score / neighbor pair / space code), category-zone map, kind match, jury quorum and score thresholds, quota caps, waitlist cap, quota-floor patch, badge-extra cap, dock-door overlap, empty sales lines"
    error_id: "ERR_DUPLICATE_APPLICATION | ERR_DUPLICATE_JURY_SCORE | ERR_DUPLICATE_NEIGHBOR_REQUEST | ERR_DUPLICATE_SPACE_CODE | ERR_CATEGORY_ZONE_VIOLATION | ERR_SPACE_KIND_MISMATCH | ERR_JURY_QUORUM_NOT_MET | ERR_SCORE_BELOW_THRESHOLD | ERR_CATEGORY_QUOTA_FULL | ERR_WAITLIST_FULL | ERR_QUOTA_BELOW_ACCEPTED | ERR_BADGE_EXTRA_LIMIT | ERR_DOOR_WINDOW_CONFLICT | ERR_DOOR_WINDOW_OUTSIDE_SLOT | ERR_SALES_REPORT_EMPTY"
    http_status: 422
    applies_to: "create/decide/placement/perk endpoints as named"
  - priority: 10
    category: business_fiscal
    check: "Money and capacity last: deposit exact match, badge allocation remaining, load-slot pallet capacity, space availability"
    error_id: "ERR_DEPOSIT_MISMATCH | ERR_BADGE_ALLOCATION_EXHAUSTED | ERR_SLOT_CAPACITY_EXCEEDED | ERR_SPACE_NOT_AVAILABLE"
    http_status: 422
    applies_to: "accept-offer, issue-badge, freight-booking create, placement create"
    # Note: ERR_SPACE_NOT_AVAILABLE carries http 409 and ERR_DOOR_WINDOW_CONFLICT carries 409 in the error catalog;
    # priority position (not the numeric status) decides which error surfaces when several checks fail.

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- logical clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock; before any call the clock reads exactly 2026-08-01T00:00:00Z (fixed startup default, never wall-clock). The clock may be set to any ISO-8601 UTC instant (no monotonicity constraint)."
    roles: [ShowDirector]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

  # ---- Convention ----
  - method: POST
    path: "/conventions"
    description: "Create a convention with its category quotas and dock doors (cascade-created children)"
    roles: [ShowDirector]
    code: 201
    input: [name, starts_at, ends_at, renewal_open_at, application_open_at, application_close_at, early_bird_deadline, tax_permit_required, sales_tax_rate_bp, category_quotas, dock_doors, "deposit_window_days?"]
    output: Convention
    side_effects:
      - "Creates one CategoryQuota per entry of category_quotas and one DockDoor per entry of dock_doors"
      - "phase = SETUP; ops_run_count = 0; deposit_window_days defaults to 14 when omitted"
  - method: GET
    path: "/conventions/{conventionId}"
    description: "Read a convention"
    roles: [ShowDirector, OperationsStaff, JuryMember, Exhibitor]
    code: 200
    input: []
    output: Convention
    side_effects: []
  - method: PUT
    path: "/conventions/{conventionId}"
    description: "Update convention configuration (OCC-guarded)"
    roles: [ShowDirector]
    code: 200
    input: [expected_convention_version, "name?", "starts_at?", "ends_at?", "renewal_open_at?", "application_open_at?", "application_close_at?", "early_bird_deadline?", "deposit_window_days?", "tax_permit_required?", "sales_tax_rate_bp?"]
    output: Convention
    side_effects: ["Convention.version += 1 on success"]
  - method: POST
    path: "/conventions/{conventionId}/advance-phase"
    description: "Advance the convention exactly one phase forward; per-step preconditions per the Convention state machine"
    roles: [ShowDirector]
    code: 200
    input: []
    output: Convention
    side_effects: ["phase transition; Convention.version += 1"]
  - method: POST
    path: "/conventions/{conventionId}/run-ops"
    description: "Operations checkpoint: offer-expiry sweep (JURIED_ACCEPTED past deposit window -> DECLINED + promotion), permit-expiry sweep (VERIFIED past permit_expires_at -> EXPIRED), freight sweeps (CONFIRMED past slot end -> NO_SHOW; CHECKED_IN past slot end -> COMPLETED with pallet release), load-slot close sweep (ends_at < clock -> CLOSED)"
    roles: [ShowDirector]
    code: 200
    input: []
    output: Convention
    side_effects: ["ops_run_count += 1", "all four sweeps run in this order: offers, permits, freight, slots"]

  # ---- CategoryQuota ----
  - method: GET
    path: "/category-quotas"
    description: "List category quotas"
    roles: [ShowDirector, OperationsStaff, JuryMember, Exhibitor]
    code: 200
    input: ["convention_id?", "category?"]
    output: CategoryQuota[]
    side_effects: []
  - method: GET
    path: "/category-quotas/{categoryQuotaId}"
    description: "Read one category quota"
    roles: [ShowDirector, OperationsStaff, JuryMember, Exhibitor]
    code: 200
    input: []
    output: CategoryQuota
    side_effects: []
  - method: PATCH
    path: "/category-quotas/{categoryQuotaId}"
    description: "Adjust quota caps; new max_accepted must be >= current accepted_count (ERR_QUOTA_BELOW_ACCEPTED)"
    roles: [ShowDirector]
    code: 200
    input: ["max_accepted?", "max_waitlisted?"]
    output: CategoryQuota
    side_effects: ["CategoryQuota.version += 1"]

  # ---- SpaceUnit ----
  - method: POST
    path: "/space-units"
    description: "Create one booth/table inventory unit"
    roles: [ShowDirector]
    code: 201
    input: [convention_id, space_code, block, unit_number, hall, kind, base_price_cents]
    output: SpaceUnit
    side_effects: ["status = AVAILABLE", "Duplicate space_code within the convention -> ERR_DUPLICATE_SPACE_CODE"]
  - method: GET
    path: "/space-units"
    description: "List space units with filters"
    roles: [ShowDirector, OperationsStaff, JuryMember, Exhibitor]
    code: 200
    input: ["convention_id?", "status?", "kind?", "hall?"]
    output: SpaceUnit[]
    side_effects: []
  - method: GET
    path: "/space-units/{spaceUnitId}"
    description: "Read one space unit"
    roles: [ShowDirector, OperationsStaff, JuryMember, Exhibitor]
    code: 200
    input: []
    output: SpaceUnit
    side_effects: []

  # ---- Exhibitor ----
  - method: POST
    path: "/exhibitors"
    description: "Self-registration of an exhibitor/artist; the returned id is the X-User-ID for the Exhibitor role"
    roles: [Anonymous]
    code: 201
    input: [legal_name, category, "prior_years_completed?", "prior_on_time_payments?"]
    output: Exhibitor
    side_effects: ["standing = GOOD; strike_points = 0; renewal_priority_score computed"]
  - method: GET
    path: "/exhibitors/{exhibitorId}"
    description: "Read an exhibitor (Exhibitor role may read only its own id)"
    roles: [ShowDirector, OperationsStaff, Exhibitor]
    code: 200
    input: []
    output: Exhibitor
    side_effects: []

  # ---- Application ----
  - method: POST
    path: "/applications"
    description: "Create an application draft for the authenticated exhibitor (exhibitor_id = X-User-ID); category must equal the exhibitor's category"
    roles: [Exhibitor]
    code: 201
    input: [convention_id, category, channel, requested_space_kinds, requested_space_count, estimated_daily_sales_cents, "conflicted_juror_user_ids?"]
    output: Application
    side_effects: ["status = DRAFT", "permit_status = PENDING if convention.tax_permit_required else NOT_REQUIRED"]
  - method: GET
    path: "/applications"
    description: "List applications; Exhibitor role is coerced to its own exhibitor_id filter"
    roles: [ShowDirector, OperationsStaff, JuryMember, Exhibitor]
    code: 200
    input: ["exhibitor_id?", "convention_id?", "status?", "category?"]
    output: Application[]
    side_effects: []
  - method: GET
    path: "/applications/{applicationId}"
    description: "Read one application (Exhibitor role: own only)"
    roles: [ShowDirector, OperationsStaff, JuryMember, Exhibitor]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: PATCH
    path: "/applications/{applicationId}"
    description: "Revise an application while DRAFT or NEEDS_REVISION (OCC-guarded)"
    roles: [Exhibitor]
    code: 200
    input: [expected_application_version, "requested_space_kinds?", "requested_space_count?", "estimated_daily_sales_cents?", "conflicted_juror_user_ids?", "channel?"]
    output: Application
    side_effects: ["Application.version += 1 on success"]
  - method: POST
    path: "/applications/{applicationId}/submit"
    description: "Submit (or resubmit after revision request); runs window/channel/quota/duplicate checks and computes provisional quote + tax estimate"
    roles: [Exhibitor]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> SUBMITTED", "provisional_quote_cents + tax_estimate_cents computed", "version += 1"]
  - method: POST
    path: "/applications/{applicationId}/withdraw"
    description: "Withdraw from DRAFT/SUBMITTED/UNDER_REVIEW/NEEDS_REVISION/JURIED_WAITLISTED"
    roles: [Exhibitor]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> WITHDRAWN", "waitlisted_count decrement when leaving JURIED_WAITLISTED", "PENDING neighbor requests involving this exhibitor -> MOOT", "version += 1"]
  - method: POST
    path: "/applications/{applicationId}/request-revision"
    description: "Jury sends the application back for changes (UNDER_REVIEW -> NEEDS_REVISION)"
    roles: [ShowDirector]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> NEEDS_REVISION", "version += 1"]
  - method: POST
    path: "/applications/{applicationId}/decide"
    description: "Jury decision from UNDER_REVIEW: ACCEPTED/WAITLISTED/REJECTED with quorum, score-threshold, and quota gates"
    roles: [ShowDirector]
    code: 200
    input: [decision]
    output: Application
    side_effects: ["status transition per decision", "quota counters", "decided_at = clock", "REJECTED also MOOTs neighbor requests", "version += 1"]
  - method: POST
    path: "/applications/{applicationId}/accept-offer"
    description: "Exhibitor accepts an accepted offer: computes the final invoice over TENTATIVE placements' spaces and collects the exact deposit"
    roles: [Exhibitor]
    code: 200
    input: [deposit_cents]
    output: Application
    side_effects: ["status JURIED_ACCEPTED -> CONTRACTED", "final_invoice_cents/deposit_cents/amount_paid_cents/balance_due_cents set", "version += 1"]
  - method: POST
    path: "/applications/{applicationId}/decline"
    description: "Exhibitor declines an accepted offer; frees the quota slot and triggers the promotion sweep"
    roles: [Exhibitor]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> DECLINED", "accepted_count -= 1 then promotion sweep", "TENTATIVE placements released", "neighbor requests -> MOOT", "version += 1"]
  - method: POST
    path: "/applications/{applicationId}/cancel"
    description: "Cancel a CONTRACTED or PLACED application; computes the timed refund and runs the release cascade + promotion sweep"
    roles: [Exhibitor, ShowDirector]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> CANCELLED with cancellation_reason", "refund_cents computed (0 when eviction-driven)", "placements released, spaces freed, badges revoked, freight cancelled", "accepted_count -= 1 then promotion sweep", "version += 1"]
  - method: POST
    path: "/applications/{applicationId}/badge-extras"
    description: "Purchase extra badges beyond the included allotment (each 7500 cents; cumulative total may not exceed included_badges); requires PLACED"
    roles: [Exhibitor]
    code: 200
    input: [quantity]
    output: Application
    side_effects: ["purchased_extra_badges += quantity", "badge_fees_cents += quantity * 7500", "balance_due_cents recomputed", "version += 1"]
  - method: POST
    path: "/applications/{applicationId}/submit-permit"
    description: "Submit sales-tax permit details (permit dimension PENDING/REJECTED -> SUBMITTED)"
    roles: [Exhibitor]
    code: 200
    input: [permit_number, permit_expires_at]
    output: Application
    side_effects: ["permit_status -> SUBMITTED", "version += 1"]
  - method: POST
    path: "/applications/{applicationId}/verify-permit"
    description: "Verify a submitted permit (SUBMITTED -> VERIFIED)"
    roles: [ShowDirector]
    code: 200
    input: []
    output: Application
    side_effects: ["permit_status -> VERIFIED", "version += 1"]
  - method: POST
    path: "/applications/{applicationId}/reject-permit"
    description: "Reject a submitted permit (SUBMITTED -> REJECTED); exhibitor may resubmit"
    roles: [ShowDirector]
    code: 200
    input: []
    output: Application
    side_effects: ["permit_status -> REJECTED", "version += 1"]
  - method: POST
    path: "/applications/{applicationId}/claim-exemption"
    description: "Claim tax exemption (PENDING -> EXEMPT); only NONPROFIT exhibitors"
    roles: [Exhibitor]
    code: 200
    input: []
    output: Application
    side_effects: ["permit_status -> EXEMPT", "version += 1"]

  # ---- JuryScore ----
  - method: POST
    path: "/jury-scores"
    description: "Post an immutable jury score; juror_user_id = X-User-ID; first score moves the application SUBMITTED -> UNDER_REVIEW"
    roles: [JuryMember]
    code: 201
    input: [application_id, originality, craft, category_fit, professionalism]
    output: JuryScore
    side_effects: ["weighted_total computed", "application SUBMITTED -> UNDER_REVIEW on first score", "application jury_composite_score recomputed"]
    # Gates: convention phase must be JURY_REVIEW (ERR_PHASE_PRECONDITION); application status must be SUBMITTED or UNDER_REVIEW (ERR_INVALID_TRANSITION);
    # juror not in conflicted_juror_user_ids (ERR_JURY_CONFLICT_OF_INTEREST); no prior score by the same juror (ERR_DUPLICATE_JURY_SCORE); each criterion 0..100 (ERR_INVALID_REQUEST).
  - method: GET
    path: "/jury-scores"
    description: "List jury scores"
    roles: [ShowDirector, JuryMember]
    code: 200
    input: ["application_id?", "juror_user_id?"]
    output: JuryScore[]
    side_effects: []
  - method: GET
    path: "/jury-scores/{juryScoreId}"
    description: "Read one jury score"
    roles: [ShowDirector, JuryMember]
    code: 200
    input: []
    output: JuryScore
    side_effects: []

  # ---- Placement ----
  - method: POST
    path: "/placements"
    description: "Offer a specific space to an application (JURIED_ACCEPTED or CONTRACTED); space AVAILABLE -> RESERVED"
    roles: [ShowDirector]
    code: 201
    input: [application_id, space_unit_id]
    output: Placement
    side_effects: ["Placement TENTATIVE", "SpaceUnit -> RESERVED with current_application_id set"]
  - method: GET
    path: "/placements"
    description: "List placements"
    roles: [ShowDirector, OperationsStaff, Exhibitor]
    code: 200
    input: ["application_id?", "space_unit_id?", "status?"]
    output: Placement[]
    side_effects: []
  - method: GET
    path: "/placements/{placementId}"
    description: "Read one placement"
    roles: [ShowDirector, OperationsStaff, Exhibitor]
    code: 200
    input: []
    output: Placement
    side_effects: []
  - method: POST
    path: "/placements/{placementId}/confirm"
    description: "Confirm a TENTATIVE placement: space ASSIGNED, application CONTRACTED -> PLACED, badge allotment credited, neighbor requests evaluated"
    roles: [ShowDirector]
    code: 200
    input: []
    output: Placement
    side_effects: ["Placement TENTATIVE -> CONFIRMED", "SpaceUnit RESERVED -> ASSIGNED", "Application -> PLACED with included_badges recomputed", "neighbor-request evaluation sweep", "versions += 1"]
  - method: POST
    path: "/placements/{placementId}/release"
    description: "Release a TENTATIVE placement back to inventory"
    roles: [ShowDirector]
    code: 200
    input: []
    output: Placement
    side_effects: ["Placement TENTATIVE -> RELEASED", "SpaceUnit RESERVED -> AVAILABLE", "versions += 1"]

  # ---- NeighborRequest ----
  - method: POST
    path: "/neighbor-requests"
    description: "Request adjacency to or separation from another exhibitor (requester = X-User-ID)"
    roles: [Exhibitor]
    code: 201
    input: [convention_id, target_exhibitor_id, kind]
    output: NeighborRequest
    side_effects: ["status = PENDING"]
  - method: GET
    path: "/neighbor-requests"
    description: "List neighbor requests (Exhibitor role sees only requests where it is requester or target)"
    roles: [ShowDirector, OperationsStaff, Exhibitor]
    code: 200
    input: ["convention_id?", "requester_exhibitor_id?", "target_exhibitor_id?", "status?"]
    output: NeighborRequest[]
    side_effects: []
  - method: GET
    path: "/neighbor-requests/{neighborRequestId}"
    description: "Read one neighbor request"
    roles: [ShowDirector, OperationsStaff, Exhibitor]
    code: 200
    input: []
    output: NeighborRequest
    side_effects: []
  - method: POST
    path: "/neighbor-requests/{neighborRequestId}/withdraw"
    description: "Requester withdraws a PENDING request"
    roles: [Exhibitor]
    code: 200
    input: []
    output: NeighborRequest
    side_effects: ["status -> WITHDRAWN", "version += 1"]

  # ---- StaffMember / badges ----
  - method: POST
    path: "/staff-members"
    description: "Register a staff member for the authenticated exhibitor; requires the exhibitor's application in this convention to be CONTRACTED or PLACED (ERR_STAFF_NOT_ALLOWED_YET)"
    roles: [Exhibitor]
    code: 201
    input: [convention_id, full_name, "role_label?"]
    output: StaffMember
    side_effects: ["badge_status = NONE"]
  - method: GET
    path: "/staff-members"
    description: "List staff members (Exhibitor role: own only)"
    roles: [ShowDirector, OperationsStaff, Exhibitor]
    code: 200
    input: ["exhibitor_id?", "convention_id?", "badge_status?"]
    output: StaffMember[]
    side_effects: []
  - method: GET
    path: "/staff-members/{staffMemberId}"
    description: "Read one staff member"
    roles: [ShowDirector, OperationsStaff, Exhibitor]
    code: 200
    input: []
    output: StaffMember
    side_effects: []
  - method: POST
    path: "/staff-members/{staffMemberId}/issue-badge"
    description: "Issue a badge: compliance gate (standing, open CRITICAL issues) before allocation gate (included + purchased vs issued)"
    roles: [Exhibitor, OperationsStaff]
    code: 200
    input: []
    output: StaffMember
    side_effects: ["badge_status NONE -> ISSUED", "version += 1"]
  - method: POST
    path: "/staff-members/{staffMemberId}/revoke-badge"
    description: "Revoke an issued badge; frees one unit of allocation"
    roles: [OperationsStaff, ShowDirector]
    code: 200
    input: []
    output: StaffMember
    side_effects: ["badge_status ISSUED -> REVOKED", "version += 1"]

  # ---- LoadSlot / DockDoor ----
  - method: POST
    path: "/load-slots"
    description: "Create a load-in/load-out marshalling window with aggregate pallet capacity"
    roles: [ShowDirector]
    code: 201
    input: [convention_id, direction, starts_at, ends_at, pallet_capacity]
    output: LoadSlot
    side_effects: ["status = OPEN", "reserved_pallets = 0", "ends_at must be strictly after starts_at (ERR_INVALID_TIME_WINDOW)"]
  - method: GET
    path: "/load-slots"
    description: "List load slots"
    roles: [ShowDirector, OperationsStaff, Exhibitor]
    code: 200
    input: ["convention_id?", "direction?", "status?"]
    output: LoadSlot[]
    side_effects: []
  - method: GET
    path: "/load-slots/{loadSlotId}"
    description: "Read one load slot"
    roles: [ShowDirector, OperationsStaff, Exhibitor]
    code: 200
    input: []
    output: LoadSlot
    side_effects: []
  - method: GET
    path: "/dock-doors"
    description: "List dock doors"
    roles: [ShowDirector, OperationsStaff, Exhibitor]
    code: 200
    input: ["convention_id?", "door_code?"]
    output: DockDoor[]
    side_effects: []
  - method: GET
    path: "/dock-doors/{dockDoorId}"
    description: "Read one dock door"
    roles: [ShowDirector, OperationsStaff, Exhibitor]
    code: 200
    input: []
    output: DockDoor
    side_effects: []

  # ---- FreightBooking ----
  - method: POST
    path: "/freight-bookings"
    description: "Book freight: aggregate pallet capacity on the slot plus exclusive buffered occupation of the dock door"
    roles: [Exhibitor]
    code: 201
    input: [application_id, load_slot_id, dock_door_id, door_starts_at, door_ends_at, pallet_count]
    output: FreightBooking
    side_effects:
      - "Phase gate: INBOUND requires phase == LOGISTICS, OUTBOUND requires phase == LOAD_OUT (ERR_FREIGHT_WRONG_PHASE)"
      - "Application must be PLACED (ERR_APPLICATION_NOT_PLACED); slot status must be OPEN (ERR_INVALID_TRANSITION)"
      - "Door window must lie inside the slot window (ERR_DOOR_WINDOW_OUTSIDE_SLOT) and respect the 15-minute buffer against active bookings on the same door (ERR_DOOR_WINDOW_CONFLICT)"
      - "Capacity: reserved_pallets + pallet_count <= pallet_capacity (ERR_SLOT_CAPACITY_EXCEEDED)"
      - "On success: status = REQUESTED; LoadSlot.reserved_pallets += pallet_count; LoadSlot -> FULL when equality reached"
  - method: GET
    path: "/freight-bookings"
    description: "List freight bookings (Exhibitor role: own only)"
    roles: [ShowDirector, OperationsStaff, Exhibitor]
    code: 200
    input: ["application_id?", "exhibitor_id?", "load_slot_id?", "dock_door_id?", "status?"]
    output: FreightBooking[]
    side_effects: []
  - method: GET
    path: "/freight-bookings/{freightBookingId}"
    description: "Read one freight booking"
    roles: [ShowDirector, OperationsStaff, Exhibitor]
    code: 200
    input: []
    output: FreightBooking
    side_effects: []
  - method: POST
    path: "/freight-bookings/{freightBookingId}/confirm"
    description: "Operations confirms a requested booking (REQUESTED -> CONFIRMED)"
    roles: [OperationsStaff, ShowDirector]
    code: 200
    input: []
    output: FreightBooking
    side_effects: ["status -> CONFIRMED", "version += 1"]
  - method: POST
    path: "/freight-bookings/{freightBookingId}/cancel"
    description: "Cancel a REQUESTED or CONFIRMED booking; releases the pallet reservation"
    roles: [Exhibitor, OperationsStaff, ShowDirector]
    code: 200
    input: []
    output: FreightBooking
    side_effects: ["status -> CANCELLED", "LoadSlot.reserved_pallets -= pallet_count; FULL -> OPEN when below capacity", "version += 1"]
  - method: POST
    path: "/freight-bookings/{freightBookingId}/check-in"
    description: "Check in a CONFIRMED booking while the clock is inside the slot window"
    roles: [OperationsStaff]
    code: 200
    input: []
    output: FreightBooking
    side_effects: ["status CONFIRMED -> CHECKED_IN", "version += 1"]

  # ---- IssueTicket ----
  - method: POST
    path: "/issue-tickets"
    description: "Report an on-site policy issue against an exhibitor; reporter_user_id = X-User-ID"
    roles: [OperationsStaff, ShowDirector]
    code: 201
    input: [convention_id, exhibitor_id, category, severity, description]
    output: IssueTicket
    side_effects: ["status = OPEN", "reporter_user_id recorded"]
  - method: GET
    path: "/issue-tickets"
    description: "List issue tickets"
    roles: [ShowDirector, OperationsStaff]
    code: 200
    input: ["convention_id?", "exhibitor_id?", "status?", "severity?"]
    output: IssueTicket[]
    side_effects: []
  - method: GET
    path: "/issue-tickets/{issueTicketId}"
    description: "Read one issue ticket"
    roles: [ShowDirector, OperationsStaff]
    code: 200
    input: []
    output: IssueTicket
    side_effects: []
  - method: POST
    path: "/issue-tickets/{issueTicketId}/triage"
    description: "Mark an OPEN issue as under active investigation (OPEN -> TRIAGED)"
    roles: [ShowDirector]
    code: 200
    input: []
    output: IssueTicket
    side_effects: ["status -> TRIAGED", "version += 1"]
  - method: POST
    path: "/issue-tickets/{issueTicketId}/escalate"
    description: "Escalate an OPEN or TRIAGED issue ( -> ESCALATED)"
    roles: [ShowDirector]
    code: 200
    input: []
    output: IssueTicket
    side_effects: ["status -> ESCALATED", "version += 1"]
  - method: POST
    path: "/issue-tickets/{issueTicketId}/resolve"
    description: "Resolve with outcome GUILTY (applies strike points, may flip standing and fire the eviction cascade) or UNFOUNDED (no strikes); resolver must differ from reporter"
    roles: [ShowDirector]
    code: 200
    input: [outcome]
    output: IssueTicket
    side_effects: ["status -> RESOLVED", "GUILTY: strike_points_applied = severity points; Exhibitor.strike_points += points; standing recomputed; eviction cascade on EVICTED", "version += 1"]

  # ---- SalesReport ----
  - method: POST
    path: "/sales-reports"
    description: "Create a draft sales report for a PLACED application"
    roles: [Exhibitor]
    code: 201
    input: [application_id, lines]
    output: SalesReport
    side_effects: ["status = DRAFT", "lines must be non-empty (ERR_SALES_REPORT_EMPTY)"]
  - method: GET
    path: "/sales-reports"
    description: "List sales reports (Exhibitor role: own only)"
    roles: [ShowDirector, Exhibitor]
    code: 200
    input: ["application_id?", "exhibitor_id?", "status?"]
    output: SalesReport[]
    side_effects: []
  - method: GET
    path: "/sales-reports/{salesReportId}"
    description: "Read one sales report"
    roles: [ShowDirector, Exhibitor]
    code: 200
    input: []
    output: SalesReport
    side_effects: []
  - method: POST
    path: "/sales-reports/{salesReportId}/submit"
    description: "Submit the report; computes the per-line-rounded tax settlement; requires phase LIVE/LOAD_OUT/CLOSED"
    roles: [Exhibitor]
    code: 200
    input: []
    output: SalesReport
    side_effects: ["status -> SUBMITTED", "tax_settlement_cents computed", "version += 1"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role is not in the endpoint's role list" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Exhibitor role targets a resource owned by another exhibitor" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, wrong type, unknown enum value, out-of-range integer" }
  - { id: ERR_INVALID_TRANSITION, http: 409, condition: "Target resource is not in a from-state that allows the requested transition (also used for slot-not-OPEN and placement-state gates)" }
  - { id: ERR_STALE_APPLICATION_VERSION, http: 412, condition: "expected_application_version does not match the application's current version" }
  - { id: ERR_STALE_CONVENTION_VERSION, http: 412, condition: "expected_convention_version does not match the convention's current version" }
  - { id: ERR_APPLICATION_WINDOW_CLOSED, http: 422, condition: "Submit attempted outside the channel's submission window or at/after application_close_at" }
  - { id: ERR_RENEWAL_NOT_ELIGIBLE, http: 422, condition: "RENEWAL channel used by an exhibitor with prior_years_completed < 1 or standing != GOOD" }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "Exhibitor already has a live (non-terminal) application in this convention" }
  - { id: ERR_CATEGORY_MISMATCH, http: 422, condition: "Application category differs from the exhibitor's registered category" }
  - { id: ERR_CATEGORY_NOT_OFFERED, http: 422, condition: "No CategoryQuota row exists for the application's category in this convention" }
  - { id: ERR_CATEGORY_QUOTA_FULL, http: 422, condition: "decide=ACCEPTED while accepted_count == max_accepted" }
  - { id: ERR_WAITLIST_FULL, http: 422, condition: "decide=WAITLISTED while waitlisted_count == max_waitlisted" }
  - { id: ERR_JURY_QUORUM_NOT_MET, http: 422, condition: "decide attempted with fewer than 3 distinct-juror scores" }
  - { id: ERR_SCORE_BELOW_THRESHOLD, http: 422, condition: "decision incompatible with jury_composite_score band (ACCEPTED needs >= 70.00, WAITLISTED needs >= 50.00)" }
  - { id: ERR_JURY_CONFLICT_OF_INTEREST, http: 403, condition: "Juror's X-User-ID appears in the application's conflicted_juror_user_ids" }
  - { id: ERR_DUPLICATE_JURY_SCORE, http: 409, condition: "Same juror_user_id already scored this application" }
  - { id: ERR_PERMIT_NOT_VERIFIED, http: 422, condition: "accept-offer with tax_permit_required while permit_status not IN {VERIFIED, EXEMPT}" }
  - { id: ERR_EXEMPTION_NOT_ALLOWED, http: 422, condition: "claim-exemption by a non-NONPROFIT exhibitor" }
  - { id: ERR_EXHIBITOR_SUSPENDED, http: 422, condition: "accept-offer while exhibitor.standing IN {SUSPENDED, EVICTED}" }
  - { id: ERR_OFFER_EXPIRED, http: 422, condition: "accept-offer after decided_at + deposit_window_days" }
  - { id: ERR_DEPOSIT_MISMATCH, http: 422, condition: "deposit_cents differs from the computed round_half_up(final_invoice_cents * 0.25)" }
  - { id: ERR_SPACE_NOT_AVAILABLE, http: 409, condition: "Placement creation on a SpaceUnit whose status != AVAILABLE" }
  - { id: ERR_SPACE_KIND_MISMATCH, http: 422, condition: "Space kind not in the application's requested_space_kinds" }
  - { id: ERR_CATEGORY_ZONE_VIOLATION, http: 422, condition: "(category, kind, hall) violates the category-zone map" }
  - { id: ERR_NEIGHBOR_SELF_TARGET, http: 422, condition: "Neighbor request targeting the requester itself" }
  - { id: ERR_NEIGHBOR_TARGET_NOT_APPLIED, http: 422, condition: "Target exhibitor has no live application in this convention (also when the requester has none)" }
  - { id: ERR_DUPLICATE_NEIGHBOR_REQUEST, http: 409, condition: "A PENDING request for the same (requester, target, kind) already exists" }
  - { id: ERR_DUPLICATE_SPACE_CODE, http: 409, condition: "space_code already exists within the convention" }
  - { id: ERR_COMPLIANCE_HOLD, http: 422, condition: "Badge issue blocked by exhibitor standing SUSPENDED/EVICTED or an unresolved CRITICAL issue" }
  - { id: ERR_BADGE_ALLOCATION_EXHAUSTED, http: 422, condition: "issue-badge when issued count == included_badges + purchased_extra_badges" }
  - { id: ERR_BADGE_EXTRA_LIMIT, http: 422, condition: "badge-extras quantity would push purchased_extra_badges above included_badges" }
  - { id: ERR_APPLICATION_NOT_PLACED, http: 422, condition: "Freight booking or sales report against an application not in PLACED status" }
  - { id: ERR_SLOT_CAPACITY_EXCEEDED, http: 422, condition: "reserved_pallets + pallet_count would exceed pallet_capacity" }
  - { id: ERR_DOOR_WINDOW_OUTSIDE_SLOT, http: 422, condition: "Door occupation window not contained in the load-slot window" }
  - { id: ERR_DOOR_WINDOW_CONFLICT, http: 409, condition: "Door occupation collides with an active booking under the 15-minute buffer rule" }
  - { id: ERR_INVALID_TIME_WINDOW, http: 422, condition: "ends_at <= starts_at on creation, or check-in attempted with the clock outside the slot window" }
  - { id: ERR_FREIGHT_WRONG_PHASE, http: 422, condition: "Freight booking creation in a phase that does not match the slot direction (INBOUND: LOGISTICS, OUTBOUND: LOAD_OUT)" }
  - { id: ERR_PHASE_PRECONDITION, http: 422, condition: "advance-phase or phase-gated operation whose phase/aggregate preconditions fail" }
  - { id: ERR_DUTY_SEGREGATION, http: 403, condition: "Issue resolver's X-User-ID equals reporter_user_id" }
  - { id: ERR_QUOTA_BELOW_ACCEPTED, http: 422, condition: "PATCH max_accepted below the current accepted_count" }
  - { id: ERR_SALES_REPORT_EMPTY, http: 422, condition: "Sales report created or submitted with an empty lines array" }
  - { id: ERR_STAFF_NOT_ALLOWED_YET, http: 422, condition: "Staff registration before the exhibitor's application is CONTRACTED or PLACED" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ShowDirector
    description: "Convention operator with full administrative authority: phase control, jury decisions, placements, permit verification, issue adjudication"
    identity: opaque
    exclusive_operations:
      - "POST/PUT /conventions*, advance-phase, run-ops"
      - "PATCH /category-quotas/{id}"
      - "POST /space-units"
      - "request-revision / decide / verify-permit / reject-permit on applications"
      - "POST /placements* (create, confirm, release)"
      - "issue-ticket triage / escalate / resolve"
    shared_operations:
      - "GET reads on all resources"
      - "POST /applications/{id}/cancel (director-driven cancellation)"
      - "POST /issue-tickets (director may also report)"
      - "POST /freight-bookings/{id}/confirm, cancel; staff revoke-badge"
  - name: OperationsStaff
    description: "On-site operations: freight desk, badge desk, issue reporting"
    identity: opaque
    exclusive_operations:
      - "POST /freight-bookings/{id}/check-in"
    shared_operations:
      - "POST /issue-tickets (reporter)"
      - "POST /freight-bookings/{id}/confirm and /cancel"
      - "POST /staff-members/{id}/issue-badge and /revoke-badge"
      - "GET reads on conventions, spaces, applications, placements, staff, load slots, dock doors, freight, issues, exhibitors"
  - name: JuryMember
    description: "Jury panelist; scores applications; barred from scoring applications listing them in conflicted_juror_user_ids"
    identity: opaque
    exclusive_operations:
      - "POST /jury-scores"
    shared_operations:
      - "GET /jury-scores*; GET reads on conventions, space units, applications, category quotas"
  - name: Exhibitor
    description: "Registered exhibitor/artist acting on its own resources only (X-User-ID == Exhibitor.id)"
    identity: "entity_backed:Exhibitor"
    exclusive_operations:
      - "POST /applications and all exhibitor-side application actions (submit, withdraw, accept-offer, decline, badge-extras, submit-permit, claim-exemption)"
      - "PATCH /applications/{id} (revision)"
      - "POST /neighbor-requests and withdraw"
      - "POST /staff-members; POST /sales-reports*; POST /freight-bookings"
    shared_operations:
      - "POST /applications/{id}/cancel; POST /staff-members/{id}/issue-badge; POST /freight-bookings/{id}/cancel"
      - "GET reads on own resources and public convention/space data"
  - name: Anonymous
    description: "Unregistered caller; may only self-register as an exhibitor"
    identity: opaque
    exclusive_operations:
      - "POST /exhibitors"
    shared_operations: []
