scaffold_difficulty_design:
  # =========================================================================
  # RULE 1 — dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: notice_cost_estimated_vs_final_divergence
        grounds:
          - calculations.notice_cost
          - entities.Notice.fields.estimated_cost_cents
          - entities.Notice.fields.final_cost_cents
          - state_machines.Insertion.SCHEDULED_to_PUBLISHED
        distinguishing_aspect: |
          On the NOTICE domain: estimated_cost uses submitted line_count (2) for both insertions
          while final_cost uses the paper's actual line_count_actual (3), so estimated (1600) and
          final (2400) diverge for identical inputs.
        test_recipe:
          setup:
            - "Qualified newspaper (PER_LINE, chars_per_line=40, first=500c, subsequent=300c) in SPRINGFIELD"
            - "PROBATE statutory requirement: min_insertions=2, min_days_before_deadline=5"
            - "A PROBATE notice, body 80 chars (line_count=2), fully published with line_count_actual=3 on both runs"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /newspapers"
              payload: { name: "Springfield Times", county: "SPRINGFIELD", circulation_qualified: true, pricing_basis: "PER_LINE", chars_per_line: 40, line_rate_first_cents: 500, line_rate_subsequent_cents: 300, word_rate_cents: 50, affidavit_fee_cents: 2500, edition_line_capacity: 100, publication_weekday: 6 }
              as: PlatformAdmin
              captures: { np_id: "$.data.id"}
            - call: "POST /accounts"
              payload: { name: "Acme Law", account_type: "LAW_FIRM", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id"}
            - call: "POST /statutory-requirements"
              payload: { notice_type: "PROBATE", county: "SPRINGFIELD", min_insertions: 2, min_days_before_deadline: 5 }
              as: PlatformAdmin
            - call: "POST /notices"
              payload: { account_id: "${acct_id}", newspaper_id: "${np_id}", notice_type: "PROBATE", county: "SPRINGFIELD", title: "Estate of John Doe", body_text: "PUBLIC NOTICE: The estate of John Doe is in probate; creditors must file by date", deadline_date: "2026-04-01" }
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_id: "$.data.id"}
            - call: "POST /notices/${notice_id}/submit"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}/proofs"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { proof_id: "$.data[0].id"}
            - call: "POST /proofs/${proof_id}/approve"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_v: "$.data.version"}
            - call: "POST /notices/${notice_id}/schedule"
              payload: { first_publication_date: "2026-03-01", expected_notice_version: "${notice_v}" }
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}/insertions"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { ins1_id: "$.data[0].id", ins2_id: "$.data[1].id"}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insertions/${ins1_id}/publish"
              payload: { line_count_actual: 3 }
              as: Publisher
              as_user_id: "${np_id}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insertions/${ins2_id}/publish"
              payload: { line_count_actual: 3 }
              as: Publisher
              as_user_id: "${np_id}"
          assert:
            - "Notice.${notice_id}.estimated_cost_cents == 1600"
            - "Notice.${notice_id}.final_cost_cents == 2400"
            - "Notice.${notice_id}.estimated_cost_cents != Notice.${notice_id}.final_cost_cents"
            - "Notice.${notice_id}.status == PUBLISHED"

      - name: account_balance_outstanding_vs_committed_divergence
        grounds:
          - calculations.account_balance
          - entities.Account.fields.outstanding_balance_cents
          - entities.Account.fields.committed_balance_cents
          - state_machines.Notice.RUNNING_to_PUBLISHED
        distinguishing_aspect: |
          On the ACCOUNT domain: after the notice is PUBLISHED but the affidavit is not yet issued,
          the invoice is DRAFT, so outstanding_balance_cents (ISSUED-only) == 0 while
          committed_balance_cents (adds DRAFT) == 4100 — the two variants diverge on the same account.
        test_recipe:
          setup:
            - "Qualified newspaper, PROBATE requirement min_insertions=2"
            - "A PROBATE notice fully published with line_count_actual=2 on both runs -> DRAFT invoice total 4100, affidavit NOT yet issued"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /newspapers"
              payload: { name: "Springfield Times", county: "SPRINGFIELD", circulation_qualified: true, pricing_basis: "PER_LINE", chars_per_line: 40, line_rate_first_cents: 500, line_rate_subsequent_cents: 300, word_rate_cents: 50, affidavit_fee_cents: 2500, edition_line_capacity: 100, publication_weekday: 6 }
              as: PlatformAdmin
              captures: { np_id: "$.data.id"}
            - call: "POST /accounts"
              payload: { name: "Acme Law", account_type: "LAW_FIRM", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id"}
            - call: "POST /statutory-requirements"
              payload: { notice_type: "PROBATE", county: "SPRINGFIELD", min_insertions: 2, min_days_before_deadline: 5 }
              as: PlatformAdmin
            - call: "POST /notices"
              payload: { account_id: "${acct_id}", newspaper_id: "${np_id}", notice_type: "PROBATE", county: "SPRINGFIELD", title: "Estate of John Doe", body_text: "PUBLIC NOTICE: The estate of John Doe is in probate; creditors must file by date", deadline_date: "2026-04-01" }
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_id: "$.data.id"}
            - call: "POST /notices/${notice_id}/submit"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}/proofs"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { proof_id: "$.data[0].id"}
            - call: "POST /proofs/${proof_id}/approve"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_v: "$.data.version"}
            - call: "POST /notices/${notice_id}/schedule"
              payload: { first_publication_date: "2026-03-01", expected_notice_version: "${notice_v}" }
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}/insertions"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { ins1_id: "$.data[0].id", ins2_id: "$.data[1].id"}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insertions/${ins1_id}/publish"
              payload: { line_count_actual: 2 }
              as: Publisher
              as_user_id: "${np_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insertions/${ins2_id}/publish"
              payload: { line_count_actual: 2 }
              as: Publisher
              as_user_id: "${np_id}"
          trigger:
            - call: "GET /accounts/${acct_id}"
              as: Advertiser
              as_user_id: "${acct_id}"
          assert:
            - "Account.${acct_id}.outstanding_balance_cents == 0"
            - "Account.${acct_id}.committed_balance_cents == 4100"
            - "Account.${acct_id}.outstanding_balance_cents != Account.${acct_id}.committed_balance_cents"

  # =========================================================================
  # RULE 2 — combinatorial formulas across different modes {(b),(c)}
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: notice_line_count_ceil_per_insertion_then_sum
        grounds:
          - calculations.notice_cost
          - entities.Notice.fields.line_count
          - entities.Notice.fields.estimated_cost_cents
        distinguishing_aspect: |
          MODE (b) nested rounding: line_count is ceil(len(body)/chars_per_line) computed PER insertion
          then priced then summed. Body of 100 chars at 40 chars/line -> 3 lines per insertion;
          estimated = 3*500 + 3*300 = 2400. Summing chars across insertions first (200/40=5 lines)
          would give a different total, so the per-insertion ceil order is pinned.
        test_recipe:
          setup:
            - "Qualified newspaper (PER_LINE, chars_per_line=40, first=500, subsequent=300)"
            - "PROBATE requirement min_insertions=2"
            - "A PROBATE notice with a 100-char body (line_count = ceil(100/40) = 3), only submitted (not published)"
          setup_api_calls:
            - call: "POST /newspapers"
              payload: { name: "Springfield Times", county: "SPRINGFIELD", circulation_qualified: true, pricing_basis: "PER_LINE", chars_per_line: 40, line_rate_first_cents: 500, line_rate_subsequent_cents: 300, word_rate_cents: 50, affidavit_fee_cents: 2500, edition_line_capacity: 100, publication_weekday: 6 }
              as: PlatformAdmin
              captures: { np_id: "$.data.id"}
            - call: "POST /accounts"
              payload: { name: "Acme Law", account_type: "LAW_FIRM", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id"}
            - call: "POST /statutory-requirements"
              payload: { notice_type: "PROBATE", county: "SPRINGFIELD", min_insertions: 2, min_days_before_deadline: 5 }
              as: PlatformAdmin
            - call: "POST /notices"
              payload: { account_id: "${acct_id}", newspaper_id: "${np_id}", notice_type: "PROBATE", county: "SPRINGFIELD", title: "Big Estate", body_text: "NOTICE OF FORECLOSURE SALE. The property secured by the deed of trust will be sold at auction today.", deadline_date: "2026-04-01" }
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_id: "$.data.id"}
          trigger:
            - call: "POST /notices/${notice_id}/submit"
              as: Advertiser
              as_user_id: "${acct_id}"
          assert:
            - "Notice.${notice_id}.line_count == 3"
            - "Notice.${notice_id}.estimated_cost_cents == 2400"

      - name: invoice_affidavit_fee_waiver_subtotal_tier
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.subtotal_cents
          - entities.Invoice.fields.affidavit_fee_cents
          - entities.Invoice.fields.total_cents
          - state_machines.Notice.RUNNING_to_PUBLISHED
        distinguishing_aspect: |
          MODE (c) circular-looking dependency with pinned evaluation order: affidavit_fee depends on
          the subtotal tier, and total depends on the fee. A FORECLOSURE run with subtotal 3300
          (>= AFFIDAVIT_WAIVER_THRESHOLD_CENTS 3000) waives the fee -> affidavit_fee_cents==0,
          total_cents==3300, proving fee is derived from subtotal (evaluated subtotal->fee->total).
        test_recipe:
          setup:
            - "Qualified newspaper, FORECLOSURE requirement min_insertions=3, min_days_before_deadline=7"
            - "A FORECLOSURE notice, 100-char body (line_count=3), fully published (3 insertions, line_count_actual=3 each) -> final subtotal 3300"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /newspapers"
              payload: { name: "Springfield Times", county: "SPRINGFIELD", circulation_qualified: true, pricing_basis: "PER_LINE", chars_per_line: 40, line_rate_first_cents: 500, line_rate_subsequent_cents: 300, word_rate_cents: 50, affidavit_fee_cents: 2500, edition_line_capacity: 100, publication_weekday: 6 }
              as: PlatformAdmin
              captures: { np_id: "$.data.id"}
            - call: "POST /accounts"
              payload: { name: "Acme Law", account_type: "LAW_FIRM", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id"}
            - call: "POST /statutory-requirements"
              payload: { notice_type: "FORECLOSURE", county: "SPRINGFIELD", min_insertions: 3, min_days_before_deadline: 7 }
              as: PlatformAdmin
            - call: "POST /notices"
              payload: { account_id: "${acct_id}", newspaper_id: "${np_id}", notice_type: "FORECLOSURE", county: "SPRINGFIELD", title: "Foreclosure Sale", body_text: "NOTICE OF FORECLOSURE SALE. The property secured by the deed of trust will be sold at auction today.", deadline_date: "2026-04-01" }
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_id: "$.data.id"}
            - call: "POST /notices/${notice_id}/submit"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}/proofs"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { proof_id: "$.data[0].id"}
            - call: "POST /proofs/${proof_id}/approve"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_v: "$.data.version"}
            - call: "POST /notices/${notice_id}/schedule"
              payload: { first_publication_date: "2026-03-01", expected_notice_version: "${notice_v}" }
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}/insertions"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { ins1_id: "$.data[0].id", ins2_id: "$.data[1].id", ins3_id: "$.data[2].id"}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insertions/${ins1_id}/publish"
              payload: { line_count_actual: 3 }
              as: Publisher
              as_user_id: "${np_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insertions/${ins2_id}/publish"
              payload: { line_count_actual: 3 }
              as: Publisher
              as_user_id: "${np_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insertions/${ins3_id}/publish"
              payload: { line_count_actual: 3 }
              as: Publisher
              as_user_id: "${np_id}"
          trigger:
            - call: "GET /invoices?notice_id=${notice_id}"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { inv_id: "$.data[0].id"}
          assert:
            - "Notice.${notice_id}.final_cost_cents == 3300"
            - "Invoice.${inv_id}.subtotal_cents == 3300"
            - "Invoice.${inv_id}.affidavit_fee_cents == 0"
            - "Invoice.${inv_id}.total_cents == 3300"

  # =========================================================================
  # RULE 3 — non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: notice_proof_reject_revision_cycle
        grounds:
          - state_machines.Notice.SUBMITTED_to_DRAFT
          - state_machines.Proof.PENDING_to_REJECTED
        distinguishing_aspect: |
          CYCLE on the NOTICE entity: rejecting the proof drives Notice SUBMITTED->DRAFT (A->B->A),
          returning it to the editable state; proof becomes REJECTED. This is a genuine loop, not a
          forward-only pipeline.
        test_recipe:
          setup:
            - "Qualified newspaper, PROBATE requirement min_insertions=2"
            - "A PROBATE notice submitted once (status SUBMITTED, one PENDING proof)"
          setup_api_calls:
            - call: "POST /newspapers"
              payload: { name: "Springfield Times", county: "SPRINGFIELD", circulation_qualified: true, pricing_basis: "PER_LINE", chars_per_line: 40, line_rate_first_cents: 500, line_rate_subsequent_cents: 300, word_rate_cents: 50, affidavit_fee_cents: 2500, edition_line_capacity: 100, publication_weekday: 6 }
              as: PlatformAdmin
              captures: { np_id: "$.data.id"}
            - call: "POST /accounts"
              payload: { name: "Acme Law", account_type: "LAW_FIRM", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id"}
            - call: "POST /statutory-requirements"
              payload: { notice_type: "PROBATE", county: "SPRINGFIELD", min_insertions: 2, min_days_before_deadline: 5 }
              as: PlatformAdmin
            - call: "POST /notices"
              payload: { account_id: "${acct_id}", newspaper_id: "${np_id}", notice_type: "PROBATE", county: "SPRINGFIELD", title: "Estate of John Doe", body_text: "PUBLIC NOTICE: The estate of John Doe is in probate; creditors must file by date", deadline_date: "2026-04-01" }
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_id: "$.data.id"}
            - call: "POST /notices/${notice_id}/submit"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}/proofs"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { proof_id: "$.data[0].id"}
          trigger:
            - call: "POST /proofs/${proof_id}/reject"
              payload: { reviewer_note: "fix the parcel number" }
              as: Advertiser
              as_user_id: "${acct_id}"
          assert:
            - "Notice.${notice_id}.status == DRAFT"
            - "Proof.${proof_id}.status == REJECTED"

      - name: invoice_branching_paid_terminal
        grounds:
          - state_machines.Invoice.ISSUED_to_PAID
          - state_machines.Invoice.ISSUED_to_VOID
          - state_machines.Affidavit.PENDING_to_ISSUED
        distinguishing_aspect: |
          BRANCHING fork on the INVOICE entity (different entity than the Notice cycle above):
          from ISSUED the invoice can go to PAID or VOID with divergent side effects; this instance
          drives the PAID branch (full payment) and lands on the PAID terminal state.
        test_recipe:
          setup:
            - "A PROBATE notice fully published (line_count_actual=2), affidavit ISSUED -> invoice ISSUED total 4100"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /newspapers"
              payload: { name: "Springfield Times", county: "SPRINGFIELD", circulation_qualified: true, pricing_basis: "PER_LINE", chars_per_line: 40, line_rate_first_cents: 500, line_rate_subsequent_cents: 300, word_rate_cents: 50, affidavit_fee_cents: 2500, edition_line_capacity: 100, publication_weekday: 6 }
              as: PlatformAdmin
              captures: { np_id: "$.data.id"}
            - call: "POST /accounts"
              payload: { name: "Acme Law", account_type: "LAW_FIRM", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id"}
            - call: "POST /statutory-requirements"
              payload: { notice_type: "PROBATE", county: "SPRINGFIELD", min_insertions: 2, min_days_before_deadline: 5 }
              as: PlatformAdmin
            - call: "POST /notices"
              payload: { account_id: "${acct_id}", newspaper_id: "${np_id}", notice_type: "PROBATE", county: "SPRINGFIELD", title: "Estate of John Doe", body_text: "PUBLIC NOTICE: The estate of John Doe is in probate; creditors must file by date", deadline_date: "2026-04-01" }
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_id: "$.data.id"}
            - call: "POST /notices/${notice_id}/submit"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}/proofs"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { proof_id: "$.data[0].id"}
            - call: "POST /proofs/${proof_id}/approve"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_v: "$.data.version"}
            - call: "POST /notices/${notice_id}/schedule"
              payload: { first_publication_date: "2026-03-01", expected_notice_version: "${notice_v}" }
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}/insertions"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { ins1_id: "$.data[0].id", ins2_id: "$.data[1].id"}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insertions/${ins1_id}/publish"
              payload: { line_count_actual: 2 }
              as: Publisher
              as_user_id: "${np_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insertions/${ins2_id}/publish"
              payload: { line_count_actual: 2 }
              as: Publisher
              as_user_id: "${np_id}"
            - call: "GET /notices/${notice_id}/affidavits"
              as: Publisher
              as_user_id: "${np_id}"
              captures: { aff_id: "$.data[0].id"}
            - call: "POST /affidavits/${aff_id}/issue"
              payload: { sworn_by: "Pat Publisher" }
              as: Publisher
              as_user_id: "${np_id}"
            - call: "GET /invoices?notice_id=${notice_id}"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { inv_id: "$.data[0].id"}
          trigger:
            - call: "POST /payments"
              payload: { invoice_id: "${inv_id}", amount_cents: 4100 }
              as: Advertiser
              as_user_id: "${acct_id}"
          assert:
            - "Invoice.${inv_id}.status == PAID"
            - "Invoice.${inv_id}.amount_paid_cents == 4100"
            - "Account.${acct_id}.outstanding_balance_cents == 0"

  # =========================================================================
  # RULE 4 — transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: publish_final_insertion_cascade_depth3
        grounds:
          - state_machines.Insertion.SCHEDULED_to_PUBLISHED
          - state_machines.Notice.RUNNING_to_PUBLISHED
          - entities.Invoice.fields.status
          - entities.Account.fields.committed_balance_cents
        distinguishing_aspect: |
          Depth-3 cascade from the /publish trigger: publishing the final Insertion (link1) causes
          Notice RUNNING->PUBLISHED (link2, caused by insertion), which causes creation of a DRAFT
          Invoice (link3, caused by the notice transition), which causes Account.committed_balance
          recompute to 4100. Each hop is caused by the previous, not by the original action.
        test_recipe:
          setup:
            - "A PROBATE notice scheduled with 2 insertions, first insertion already PUBLISHED (notice RUNNING)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /newspapers"
