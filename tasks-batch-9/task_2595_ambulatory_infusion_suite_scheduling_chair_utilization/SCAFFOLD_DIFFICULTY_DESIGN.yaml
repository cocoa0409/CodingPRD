  - rule_id: transitive_cascade
    instances:

      - name: cancel_wastes_dose_then_steers_patient_then_suspends_plan_then_cancels_sibling
        grounds:
          - calculations.cancellation_charge
          - state_machines.DrugPreparation.transitions.PREPARED_to_WASTED
          - state_machines.TreatmentPlan.transitions.ACTIVE_to_SUSPENDED
          - state_machines.Appointment.schedule_status.transitions.TENTATIVE_to_CANCELLED
          - entities.Patient.fields.steering_status
          - entities.DrugLot.fields.units_available
        distinguishing_aspect: |
          A five-link chain fired by ONE cancel call, where each link is the trigger for the
          next: (1) the appointment cancels, (2) its PREPARED dose is wasted and the lot
          ledger is rewritten, (3) the waste prices a 128500-cent charge into
          Patient.waste_liability_cents, (4) crossing the 50000-cent liability threshold
          flips steering_status to HOME_INFUSION_REVIEW, (5) the flip suspends the
          TreatmentPlan, which (6) zero-charge cancels the patient's OTHER, untouched
          appointment three weeks later and releases its chair and nurse. Stopping at link 3
          leaves the sibling visit alive.
