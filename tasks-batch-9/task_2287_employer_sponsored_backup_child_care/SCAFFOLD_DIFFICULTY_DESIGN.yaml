  - rule_id: compensating_invariant
    instances:

      - name: entitlement_days_reconcile_to_ledger_after_release_and_cancel
        grounds:
          - calculations.employee_entitlement_projection
          - state_machines.Reservation.IN_SERVICE_to_COMPLETED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - entities.UsageLedgerEntry.fields.days_delta
          - endpoints[GET /backup-care/employees/{id}/entitlement]
        distinguishing_aspect: |
          Conserved quantity is ENTITLEMENT DAYS: the invariant
          entitlement_days_used + entitlement_days_reserved == sum(UsageLedgerEntry.days_delta) over
          entry_types {COMMIT, RESERVE, RELEASE} must hold at every observation point, and each
          compensating step writes an explicit reversing row rather than mutating a prior one — the
          COMPLETE_RELEASE that cancels a RESERVE, and the CANCEL RELEASE that cancels a RESERVE for
          a reservation that never happened. Different conserved quantity from the money ledger in
          employer_money_ledger_survives_invoice_issue_and_void.
