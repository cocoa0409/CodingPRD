            - call: "POST /_ops/compliance-sweep"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { esc_count: $.data.escalated_finding_count }
            - call: "GET /health-centers/${hc_id}"
              payload: {}
              as: ComplianceOfficer
