# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — task_1206_trade_secret_confidentiality_program
# §1.9 Corner Design: breadth coverage of every §1.1–§1.7 claim not already
# probed by §1.8. Default clock 2026-05-01T00:00:00Z; policy starts at "v1".
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities (creation / defaults / system fields / FK integrity /
  # not-found / enum constraints / immutability)
  # ===========================================================================
  - section: entities
    instances:
      - name: create_asset_success_with_defaults
        claim_type: creation
        grounds: [entities.SecretAsset]
        distinguishing_aspect: "POST /api/assets with all required fields returns 201; status defaults to DRAFT, scores 0, posture DEFICIENT, active_grant_count 0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/assets"
              payload: { title: "Etch recipe", description: "plasma etch", classification: "RESTRICTED", owner_department: "FAB", exposure_estimate_cents: 200000 }
              as: IPCounsel
              captures: { a_id: $.data.id }
          trigger:
            - call: "GET /api/assets/${a_id}"
              as: IPCounsel
          assert:
            - "SecretAsset.${a_id}.status == DRAFT"
            - "SecretAsset.${a_id}.score_operational == 0 and score_documentary == 0"
            - "SecretAsset.${a_id}.protection_posture == DEFICIENT and active_grant_count == 0"
            - "SecretAsset.${a_id}.version == 1"

      - name: create_asset_missing_required_title_returns_400
        claim_type: required_field
        grounds: [entities.SecretAsset.fields.title, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required title on asset create returns 400 ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/assets"
              payload: { description: "no title", classification: "INTERNAL", owner_department: "ENG", exposure_estimate_cents: 100 }
              as: IPCounsel
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "GET /api/assets afterwards returns total_count == 0"

      - name: create_asset_invalid_enum_rejected
        claim_type: type_constraint
        grounds: [entities.SecretAsset.fields.classification, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "classification: TOP_SECRET is not a declared enum member -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/assets"
              payload: { title: "Bad enum", description: "x", classification: "TOP_SECRET", owner_department: "ENG", exposure_estimate_cents: 100 }
              as: IPCounsel
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: get_asset_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown asset id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/assets/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: IPCounsel
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: create_asset_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.SecretAsset]
        distinguishing_aspect: "Client-supplied id/version/status on create are ignored: server mints its own id, status stays DRAFT, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/assets"
              payload: { title: "Spoof attempt", description: "x", classification: "INTERNAL", owner_department: "ENG", exposure_estimate_cents: 100, id: "11111111-2222-3333-4444-555555555555", status: "REGISTERED", version: 99 }
              as: IPCounsel
              captures: { a_id: $.data.id }
          assert:
            - "SecretAsset.${a_id}.id != 11111111-2222-3333-4444-555555555555"
            - "SecretAsset.${a_id}.status == DRAFT and version == 1"

      - name: measure_create_with_unknown_asset_returns_404
        claim_type: fk_integrity
        grounds: [entities.ReasonableMeasure.fields.asset_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "FK integrity: creating a measure against a non-existent asset_id returns 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/measures"
              payload: { asset_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", measure_type: "PHYSICAL", title: "orphan" }
              as: SecurityOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: employee_create_auto_seeds_ack_and_training
        claim_type: defaults
        grounds: [entities.Acknowledgment.fields.due_at, entities.TrainingAssignment.fields.due_at]
        distinguishing_aspect: "Employee create auto-creates a PENDING acknowledgment (policy v1, due created_at + 10 days = 2026-05-11T00:00:00Z) and a BASIC_TS training assignment (due hired_at + 30 days = 2026-05-31T00:00:00Z)."
        test_recipe:
          setup: ["empty DB, default clock 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /api/employees"
              payload: { full_name: "Uma Fresh", email: "uma@x.com", department: "ENG", role_title: "SDE", access_clearance: "STANDARD", hired_at: "2026-05-01T00:00:00Z" }
              as: HRPartner
              captures: { emp_id: $.data.id }
          trigger:
            - call: "GET /api/acknowledgments"
              payload: { employee_id: "${emp_id}" }
              as: HRPartner
              captures: { ack_id: "$.data[0].id", ack_due: "$.data[0].due_at", ack_status: "$.data[0].status", ack_pv: "$.data[0].policy_version" }
            - call: "GET /api/training-assignments"
              payload: { employee_id: "${emp_id}" }
              as: HRPartner
              captures: { tr_due: "$.data[0].due_at", tr_status: "$.data[0].status", tr_module: "$.data[0].module" }
          assert:
            - "ack_status == PENDING and ack_pv == v1 and ack_due == 2026-05-11T00:00:00Z"
            - "tr_module == BASIC_TS and tr_status == ASSIGNED and tr_due == 2026-05-31T00:00:00Z"
            - "Employee.${emp_id}.status == PREBOARDING"

      - name: list_pagination_defaults_applied
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List without limit/offset uses defaults (limit 10, offset 0) and reports total_count + has_more in the envelope."
        test_recipe:
          setup: ["three assets exist"]
          setup_api_calls:
            - call: "POST /api/assets"
              payload: { title: "A1", description: "x", classification: "INTERNAL", owner_department: "ENG", exposure_estimate_cents: 1 }
              as: IPCounsel
            - call: "POST /api/assets"
              payload: { title: "A2", description: "x", classification: "INTERNAL", owner_department: "ENG", exposure_estimate_cents: 1 }
              as: IPCounsel
            - call: "POST /api/assets"
              payload: { title: "A3", description: "x", classification: "INTERNAL", owner_department: "ENG", exposure_estimate_cents: 1 }
              as: IPCounsel
          trigger:
            - call: "GET /api/assets"
              as: IPCounsel
          assert:
            - "response meta contains api_request_id and api_request_timestamp; response_type == array"
            - "total_count == 3 and has_more == false (default limit 10 covers all)"

      - name: evidence_item_has_no_update_endpoint
        claim_type: immutability
        grounds: [entities.EvidenceItem]
        distinguishing_aspect: "EvidenceItem content fields (sha256, byte_size, source) are immutable: no PATCH endpoint exists; lifecycle changes only via POST .../state. Sealed items reject content change attempts with 404 (no such route)."
        test_recipe:
          setup: ["one evidence item exists"]
          setup_api_calls:
            - call: "POST /api/employees"
              payload: { full_name: "Vic Probe", email: "vic@x.com", department: "ENG", role_title: "SDE", access_clearance: "STANDARD", hired_at: "2026-05-01T00:00:00Z" }
              as: HRPartner
              captures: { emp_id: $.data.id }
            - call: "GET /api/acknowledgments"
              payload: { employee_id: "${emp_id}", status: "PENDING" }
              as: HRPartner
              captures: { ack_id: "$.data[0].id" }
            - call: "POST /api/acknowledgments/${ack_id}/sign"
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/employees/${emp_id}/state"
              payload: { to_status: "ACTIVE" }
              as: HRPartner
            - call: "POST /api/forensic-reviews"
              payload: { employee_id: "${emp_id}", trigger_reason: "POLICY" }
              as: IPCounsel
              captures: { rev_id: $.data.id }
            - call: "POST /api/evidence-items"
              payload: { review_id: "${rev_id}", source: "EMAIL_EXPORT", sha256: "dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd", byte_size: 512 }
              as: SecurityOfficer
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /api/evidence-items/${ev_id}/state"
              payload: { to_status: "SEALED" }
              as: SecurityOfficer
            - call: "GET /api/evidence-items/${ev_id}"
              as: SecurityOfficer
          assert:
            - "EvidenceItem.${ev_id}.status == SEALED and sealed_at == 2026-05-01T00:00:00Z (default clock)"
            - "EvidenceItem.${ev_id}.sha256 == dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd (content hash stored verbatim)"

  # ===========================================================================
  # Section: state_machines (valid / invalid / terminal / initial / side effects)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: nda_full_happy_path
        claim_type: valid_transition
        grounds: [state_machines.NdaAgreement]
        distinguishing_aspect: "DRAFT -> SENT -> EXECUTED -> ACTIVE walks the whole forward path; confidentiality_end computed as expiry + survival_months."
        test_recipe:
          setup: ["counterparty exists"]
          setup_api_calls:
            - call: "POST /api/counterparties"
              payload: { legal_name: "Nu Freight", counterparty_type: "VENDOR" }
              as: IPCounsel
              captures: { cp_id: $.data.id }
            - call: "POST /api/ndas"
              payload: { counterparty_id: "${cp_id}", template_version: "t13", governing_law: "AZ", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z", survival_months: 6, classification_ceiling: "INTERNAL" }
              as: IPCounsel
              captures: { nda_id: $.data.id, nda_status0: $.data.status }
          trigger:
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "SENT" }
              as: IPCounsel
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "EXECUTED" }
              as: CounterpartyRep
              as_user_id: "${cp_id}"
            - call: "POST /api/ndas/${nda_id}/state"
              payload: { to_status: "ACTIVE" }
              as: IPCounsel
            - call: "GET /api/ndas/${nda_id}"
              as: IPCounsel
          assert:
            - "nda_status0 == DRAFT (initial state)"
            - "NdaAgreement.${nda_id}.status == ACTIVE"
            - "NdaAgreement.${nda_id}.confidentiality_end == 2027-06-30T00:00:00Z (2026-12-31 + 6 months)"

      - name: obligation_fulfill_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.NdaObligation, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "FULFILLED is terminal: a second FULFILLED attempt on the same obligation returns ERR_INVALID_STATE and counts stay put."
        test_recipe:
          setup: ["NDA (DRAFT ok) with one obligation already FULFILLED"]
          setup_api_calls:
            - call: "POST /api/counterparties"
              payload: { legal_name: "Xi Print", counterparty_type: "VENDOR" }
              as: IPCounsel
              captures: { cp_id: $.data.id }
            - call: "POST /api/ndas"
              payload: { counterparty_id: "${cp_id}", template_version: "t14", governing_law: "AZ", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", survival_months: 3, classification_ceiling: "INTERNAL" }
              as: IPCounsel
              captures: { nda_id: $.data.id }
            - call: "POST /api/obligations"
              payload: { nda_id: "${nda_id}", obligation_type: "NON_USE" }
              as: IPCounsel
              captures: { ob_id: $.data.id }
            - call: "POST /api/obligations/${ob_id}/state"
              payload: { to_status: "FULFILLED" }
              as: CounterpartyRep
              as_user_id: "${cp_id}"
          trigger:
            - call: "POST /api/obligations/${ob_id}/state"
              payload: { to_status: "FULFILLED" }
              as: CounterpartyRep
              as_user_id: "${cp_id}"
              captures: { err: $.data.error_id }
            - call: "GET /api/ndas/${nda_id}"
              as: IPCounsel
          assert:
            - "err == ERR_INVALID_STATE (terminal lockdown)"
            - "NdaAgreement.${nda_id}.obligations_fulfilled_count == 1 (no double count)"

      - name: asset_retired_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.SecretAsset, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RETIRED is terminal: any further state call (e.g. SUSPENDED) on a retired asset returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["asset retired (no grants, no disclosures, no notices)"]
          setup_api_calls:
            - call: "POST /api/assets"
              payload: { title: "Old formula", description: "x", classification: "INTERNAL", owner_department: "RND", exposure_estimate_cents: 10 }
              as: IPCounsel
              captures: { a_id: $.data.id }
            - call: "POST /api/assets/${a_id}/state"
              payload: { to_status: "REGISTERED" }
              as: IPCounsel
            - call: "POST /api/assets/${a_id}/state"
              payload: { to_status: "RETIRED" }
              as: IPCounsel
          trigger:
            - call: "POST /api/assets/${a_id}/state"
              payload: { to_status: "SUSPENDED" }
              as: IPCounsel
              captures: { err: $.data.error_id }
        assert:
          - "err == ERR_INVALID_STATE"
          - "SecretAsset.${a_id}.status == RETIRED"

      - name: asset_retire_cascades_measures_abandoned
        claim_type: side_effect_execution
        grounds: [state_machines.SecretAsset.REGISTERED_to_RETIRED, state_machines.ReasonableMeasure]
        distinguishing_aspect: "Retiring an asset moves its PLANNED/IMPLEMENTED/VERIFIED measures to ABANDONED (cascade down) and zeroes both score variants."
        test_recipe:
          setup: ["REGISTERED asset with one VERIFIED TECHNICAL measure and one PLANNED POLICY measure"]
          setup_api_calls:
            - call: "POST /api/assets"
              payload: { title: "Legacy coater", description: "x", classification: "CONFIDENTIAL", owner_department: "FAB", exposure_estimate_cents: 60000 }
              as: IPCounsel
              captures: { a_id: $.data.id }
            - call: "POST /api/assets/${a_id}/state"
              payload: { to_status: "REGISTERED" }
              as: IPCounsel
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "TECHNICAL", title: "Interlock", evidence_uri: "s3://ev/i.pdf" }
              as: SecurityOfficer
              captures: { m1: $.data.id }
            - call: "POST /api/measures/${m1}/state"
              payload: { to_status: "IMPLEMENTED" }
              as: SecurityOfficer
              as_user_id: "sec_officer_1"
            - call: "POST /api/measures/${m1}/state"
              payload: { to_status: "VERIFIED" }
              as: IPCounsel
              as_user_id: "counsel_1"
            - call: "POST /api/measures"
              payload: { asset_id: "${a_id}", measure_type: "POLICY", title: "Draft policy" }
              as: SecurityOfficer
              captures: { m2: $.data.id }
          trigger:
            - call: "POST /api/assets/${a_id}/state"
              payload: { to_status: "RETIRED" }
              as: IPCounsel
            - call: "GET /api/measures/${m1}"
              as: IPCounsel
            - call: "GET /api/measures/${m2}"
              as: IPCounsel
            - call: "GET /api/assets/${a_id}"
              as: IPCounsel
          assert:
            - "ReasonableMeasure.${m1}.status == ABANDONED and ${m2}.status == ABANDONED"
            - "SecretAsset.${a_id}.score_operational == 0 and protection_posture == DEFICIENT"

      - name: exit_interview_no_show_loop_then_escalate
        claim_type: valid_transition
        grounds: [state_machines.ExitInterview, entities.ExitInterview.fields.no_show_count]
        distinguishing_aspect: "Cyclic reschedule: SCHEDULED -> NO_SHOW -> SCHEDULED -> NO_SHOW increments no_show_count to 2, at which point ESCALATED becomes legal (>= 2)."
        test_recipe:
          setup: ["employee NOTICE with an interview that has been blown off twice"]
          setup_api_calls:
            - call: "POST /api/employees"
              payload: { full_name: "Wes NoShow", email: "wes@x.com", department: "SALES", role_title: "AE", access_clearance: "STANDARD", hired_at: "2026-05-01T00:00:00Z" }
              as: HRPartner
              captures: { emp_id: $.data.id }
            - call: "GET /api/acknowledgments"
              payload: { employee_id: "${emp_id}", status: "PENDING" }
              as: HRPartner
              captures: { ack_id: "$.data[0].id" }
            - call: "POST /api/acknowledgments/${ack_id}/sign"
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/employees/${emp_id}/state"
              payload: { to_status: "ACTIVE" }
              as: HRPartner
            - call: "POST /api/employees/${emp_id}/state"
              payload: { to_status: "NOTICE", departure_type: "VOLUNTARY" }
              as: HRPartner
            - call: "POST /api/exit-interviews"
              payload: { employee_id: "${emp_id}", scheduled_start: "2026-05-10T10:00:00Z", scheduled_end: "2026-05-10T11:00:00Z" }
              as: HRPartner
              captures: { ei_id: $.data.id }
            - call: "POST /api/exit-interviews/${ei_id}/state"
              payload: { to_status: "NO_SHOW" }
              as: HRPartner
            - call: "POST /api/exit-interviews/${ei_id}/state"
              payload: { to_status: "SCHEDULED", scheduled_start: "2026-05-12T10:00:00Z", scheduled_end: "2026-05-12T11:00:00Z" }
              as: HRPartner
            - call: "POST /api/exit-interviews/${ei_id}/state"
              payload: { to_status: "NO_SHOW" }
              as: HRPartner
          trigger:
            - call: "POST /api/exit-interviews/${ei_id}/state"
              payload: { to_status: "ESCALATED" }
              as: HRPartner
            - call: "GET /api/exit-interviews/${ei_id}"
              as: HRPartner
          assert:
            - "ExitInterview.${ei_id}.no_show_count == 2"
            - "ExitInterview.${ei_id}.status == ESCALATED (allowed once count >= 2)"

      - name: interview_escalate_before_two_no_shows_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ExitInterview.NO_SHOW_to_ESCALATED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "With no_show_count == 1 the ESCALATED transition is rejected (precondition >= 2 not met)."
        test_recipe:
          setup: ["ACTIVE employee; interview NO_SHOW exactly once"]
          setup_api_calls:
            - call: "POST /api/employees"
              payload: { full_name: "Xena Late", email: "xena@x.com", department: "SALES", role_title: "AE", access_clearance: "STANDARD", hired_at: "2026-05-01T00:00:00Z" }
              as: HRPartner
              captures: { emp_id: $.data.id }
            - call: "GET /api/acknowledgments"
              payload: { employee_id: "${emp_id}", status: "PENDING" }
              as: HRPartner
              captures: { ack_id: "$.data[0].id" }
            - call: "POST /api/acknowledgments/${ack_id}/sign"
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/employees/${emp_id}/state"
              payload: { to_status: "ACTIVE" }
              as: HRPartner
            - call: "POST /api/exit-interviews"
              payload: { employee_id: "${emp_id}", scheduled_start: "2026-05-10T10:00:00Z", scheduled_end: "2026-05-10T11:00:00Z" }
              as: HRPartner
              captures: { ei_id: $.data.id }
            - call: "POST /api/exit-interviews/${ei_id}/state"
              payload: { to_status: "NO_SHOW" }
              as: HRPartner
          trigger:
            - call: "POST /api/exit-interviews/${ei_id}/state"
              payload: { to_status: "ESCALATED" }
              as: HRPartner
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "ExitInterview.${ei_id}.status == NO_SHOW"

      - name: interview_certify_requires_both_flags
        claim_type: precondition_enforcement
        grounds: [state_machines.ExitInterview.CONDUCTED_to_CERTIFIED, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "CERTIFIED requires return_certification AND obligations_reiterated; with only one flag set the transition is rejected."
        test_recipe:
          setup: ["CONDUCTED interview with return_certification true, obligations_reiterated false"]
          setup_api_calls:
            - call: "POST /api/employees"
              payload: { full_name: "Yara Exit", email: "yara@x.com", department: "FIN", role_title: "Analyst", access_clearance: "STANDARD", hired_at: "2026-05-01T00:00:00Z" }
              as: HRPartner
              captures: { emp_id: $.data.id }
            - call: "GET /api/acknowledgments"
              payload: { employee_id: "${emp_id}", status: "PENDING" }
              as: HRPartner
              captures: { ack_id: "$.data[0].id" }
            - call: "POST /api/acknowledgments/${ack_id}/sign"
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/employees/${emp_id}/state"
              payload: { to_status: "ACTIVE" }
              as: HRPartner
            - call: "POST /api/exit-interviews"
              payload: { employee_id: "${emp_id}", scheduled_start: "2026-05-10T10:00:00Z", scheduled_end: "2026-05-10T11:00:00Z" }
              as: HRPartner
              captures: { ei_id: $.data.id }
            - call: "POST /api/exit-interviews/${ei_id}/state"
              payload: { to_status: "CONDUCTED" }
              as: HRPartner
            - call: "PATCH /api/exit-interviews/${ei_id}"
              payload: { return_certification: true }
              as: HRPartner
          trigger:
            - call: "POST /api/exit-interviews/${ei_id}/state"
              payload: { to_status: "CERTIFIED" }
              as: HRPartner
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (obligations_reiterated still false)"
            - "ExitInterview.${ei_id}.status == CONDUCTED"

      - name: interview_adjacent_windows_allowed_half_open
        claim_type: satisfaction_pass
        grounds: ["validations[priority=8]", "errors[ERR_INTERVIEW_OVERLAP]"]
        distinguishing_aspect: "Half-open interval semantics: [10:00,11:00) and [11:00,12:00) for the same employee do NOT conflict (adjacent allowed); a truly overlapping [10:30,11:30) is rejected with ERR_INTERVIEW_OVERLAP."
        test_recipe:
          setup: ["employee with one SCHEDULED interview [2026-05-10T10:00, 11:00)"]
          setup_api_calls:
            - call: "POST /api/employees"
