        grounds: ["state_machines.PermitApplication.UNDER_REVIEW_to_APPROVED", "calculations.permit_fee_assessment", "entities.PermitApplication.fields.assessed_fee_cents", "entities.Permit.fields.permit_number"]
        distinguishing_aspect: "A single decision request produces the whole three-level chain: the Permit row appears in PENDING_FEE/CLEAR, its INITIAL FeeInvoice appears in PENDING with amount_due_cents 5400, and that invoice writes assessed_fee_cents 5400 back onto the application — none of which is visible in the decision response body itself."
        test_recipe:
          setup:
            - "Ada's ACOUSTIC_MUSIC 2026 application is in UNDER_REVIEW at the 2026-08-01T00:00:00Z default clock, and no Permit or FeeInvoice row exists yet."
          setup_api_calls:
