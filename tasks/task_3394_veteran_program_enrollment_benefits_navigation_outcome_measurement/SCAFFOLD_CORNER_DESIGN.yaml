  - section: validations
    instances:
      - name: request_shape_runs_before_existence
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=4]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "A claim body with an out-of-enum claim_type AND an unknown member_id fails at priority 2 with 400 ERR_INVALID_REQUEST — the 404 member check never runs."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /veteran-services/claims"
              payload: { member_id: "00000000-0000-4000-8000-000000000000", claim_type: "BOGUS_ENUM" }
              as: AccreditedRepresentative
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"
            - "err != ERR_MEMBER_NOT_FOUND (existence would have fired at priority 4)"

