  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: campaign_approve_gated_on_template_published
        grounds:
          - state_machines.Campaign.IN_REVIEW_to_APPROVED
          - state_machines.Template.DRAFT_to_PUBLISHED
          - validations[priority=16]
          - errors[ERR_TEMPLATE_NOT_PUBLISHED]
        distinguishing_aspect: |
          Entity pair CAMPAIGN -> TEMPLATE. The Campaign's IN_REVIEW -> APPROVED edge
          is legal only while its referenced Template.status == PUBLISHED; with the
          template still in DRAFT the identical request is rejected with
          ERR_TEMPLATE_NOT_PUBLISHED, and publishing the template (and nothing else)
          makes the very same request succeed.
        test_recipe:
          setup:
            - "One account with a separate author and approver."
            - "Template T1 exists in DRAFT and DOES contain {{unsubscribe_url}} (so only the publish gate can fail)."
            - "Campaign C1 references T1 and sits in IN_REVIEW."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", plan_tier: "ESSENTIALS", initial_send_credits: 100, hourly_send_capacity: 100 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "author@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { author: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "appr@acme.com", user_role: "COMPLIANCE_APPROVER" }
              as: PlatformAdmin
              captures: { approver: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { aud: $.data.id }
            - call: "POST /templates"
              payload: { account_id: "${acct}", name: "T1", subject: "Spring Sale", html_body: "<p>Hi</p><a href=\"{{unsubscribe_url}}\">unsubscribe</a>" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { tpl: $.data.id, tpl_status: $.data.status }
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", audience_id: "${aud}", template_id: "${tpl}", name: "C1" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { c1: $.data.id }
            - call: "POST /campaigns/${c1}/submit-review"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
          trigger:
            - call: "POST /campaigns/${c1}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceApprover
              as_user_id: "${approver}"
              captures: { err: $.data.error_id }
            - call: "POST /templates/${tpl}/publish"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /campaigns/${c1}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceApprover
              as_user_id: "${approver}"
              captures: { st_final: $.data.status }
          assert:
            - "${tpl_status} == \"DRAFT\""
            - "${err} == \"ERR_TEMPLATE_NOT_PUBLISHED\"   # HTTP 422; campaign stayed IN_REVIEW"
            - "${st_final} == \"APPROVED\""
            - "Campaign.${c1}.pinned_template_version == 2"
            - "Campaign.${c1}.approved_by_user_id == \"${approver}\""

      - name: enrollment_advance_gated_on_subscriber_consent
        grounds:
          - state_machines.JourneyEnrollment.ACTIVE_to_SUPPRESSED
          - state_machines.Subscriber.CONFIRMED_to_UNSUBSCRIBED
          - entities.Journey.fields.active_enrollment_count
        distinguishing_aspect: |
          A DIFFERENT entity pair: JOURNEYENROLLMENT -> SUBSCRIBER. The enrollment's
          due advance is legal only while its Subscriber.consent_state == CONFIRMED;
          once the subscriber unsubscribes, the very next ops run retires the
          enrollment to SUPPRESSED instead of executing its step, and no journey Send
          is minted.
        test_recipe:
          setup:
            - "One account, one single-opt-in audience, one PUBLISHED template."
            - "Journey J (trigger SUBSCRIBE_CONFIRMED, steps: 0 = WAIT 24h, 1 = EMAIL) is ACTIVE."
            - "Subscriber s1 was created after activation, so an ACTIVE enrollment exists at step 0 with next_action_at == 2026-05-01T00:00:00Z."
            - "s1 has since unsubscribed, and the clock has moved to 2026-05-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", plan_tier: "ESSENTIALS", initial_send_credits: 100, hourly_send_capacity: 100 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "author@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { author: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { aud: $.data.id }
            - call: "POST /templates"
              payload: { account_id: "${acct}", name: "T", subject: "Welcome", html_body: "<p>Welcome</p><a href=\"{{unsubscribe_url}}\">unsubscribe</a>" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { tpl: $.data.id }
            - call: "POST /templates/${tpl}/publish"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /journeys"
              payload:
                account_id: "${acct}"
                audience_id: "${aud}"
                name: "Welcome flow"
                trigger_event: "SUBSCRIBE_CONFIRMED"
                steps: [{ step_index: 0, kind: "WAIT", wait_hours: 24 }, { step_index: 1, kind: "EMAIL", template_id: "${tpl}" }]
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { jr: $.data.id }
            - call: "POST /journeys/${jr}/activate"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { s1: $.data.id, unsub_tok: $.data.unsubscribe_token }
            - call: "POST /subscribers/${s1}/unsubscribe"
              payload: { unsubscribe_token: "${unsub_tok}" }
              as: Anonymous
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_ops/run"
              payload: {}
              as: PlatformAdmin
              captures: { advanced: $.data.enrollments_advanced, made: $.data.sends_created }
          assert:
            - "Subscriber.${s1}.consent_state == \"UNSUBSCRIBED\""
            - "GET /subscribers/${s1}/enrollments -> $.data[0].status == \"SUPPRESSED\""
            - "GET /subscribers/${s1}/enrollments -> $.data[0].current_step_index == 0   # the WAIT step never ran"
            - "${made} == 0   # no journey EMAIL send was minted"
            - "Journey.${jr}.active_enrollment_count == 0"
            - "Journey.${jr}.entered_count == 1"
            - "GET /sends {journey_id: ${jr}} returns 0 rows"

