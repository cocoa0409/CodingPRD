      - name: activate_assignment_for_an_onboarding_director_returns_not_seatable
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CommitteeAssignment.PROPOSED_to_ACTIVE
          - validations.priority_45.ERR_DIRECTOR_NOT_SEATABLE
          - calculations.committee_seat_ledger
        distinguishing_aspect: |
          The activation precondition requires the assigned Director.service_status to be exactly SEATED, so
          activating for a director still in ONBOARDING returns 409 ERR_DIRECTOR_NOT_SEATABLE, the seat
          ledger stays at 0 filled seats, and the same activation succeeds after the director is seated.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026."
            - "One Director still in ONBOARDING with a single required OnboardingItem that is still PENDING."
            - "An AUDIT committee (authorized_seats 3, min_seats 1) carrying a PROPOSED assignment for that director."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Pia Pending", email: "pia@issuer.example", birth_date: "1972-01-01", appointed_on: "2026-07-01", is_independent: true }
              as: CorporateSecretary
              captures: { dir_id: $.data.id }
            - call: "POST /governance/directors/${dir_id}/onboarding-items"
              payload: { module_code: "BUSINESS_ORIENTATION_101", category: "BUSINESS_ORIENTATION", is_required: true, credit_hours: 2.0, due_on: "2026-09-30" }
              as: GovernanceStaff
              captures: { item_id: $.data.id }
            - call: "POST /governance/committees"
              payload: { code: "AUDIT", name: "Audit Committee", authorized_seats: 3, min_seats: 1 }
              as: CorporateSecretary
              captures: { comm_id: $.data.id, comm_v1: $.data.version }
            - call: "POST /governance/committees/${comm_id}/assignments"
              payload: { director_id: "${dir_id}", term_start_on: "2026-08-01", term_end_on: "2026-12-31", expected_committee_version: "${comm_v1}", seat_role: "MEMBER" }
              as: CorporateSecretary
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /governance/assignments/${asg_id}/activate"
              payload: {}
              as: CorporateSecretary
              captures: { not_seatable_error_id: $.data.error_id }
            - call: "POST /governance/onboarding-items/${item_id}/complete"
              payload: {}
              as: GovernanceStaff
            - call: "POST /governance/directors/${dir_id}/seat"
              payload: {}
              as: CorporateSecretary
            - call: "POST /governance/assignments/${asg_id}/activate"
              payload: {}
              as: CorporateSecretary
          assert:
            - "The first activate returns HTTP 409 with data.error_id == \"ERR_DIRECTOR_NOT_SEATABLE\""
            - "After the rejected call CommitteeAssignment.${asg_id}.status == \"PROPOSED\", activated_at null, Committee.${comm_id}.filled_seats == 0, status \"UNDER_STRENGTH\""
            - "After the seat call Director.${dir_id}.service_status == \"SEATED\" and onboarding_completion_pct == 100.00"
            - "The second activate returns HTTP 200 with CommitteeAssignment.${asg_id}.status == \"ACTIVE\" and activated_at == \"2026-08-01T00:00:00Z\""
            - "Committee.${comm_id}.filled_seats == 1 and status == \"UNDER_STRENGTH\" (min_seats met but no ACTIVE CHAIR)"

