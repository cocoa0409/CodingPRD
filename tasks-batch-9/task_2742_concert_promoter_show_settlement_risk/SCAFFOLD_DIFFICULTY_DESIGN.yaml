  # =====================================================================
  # RULE 8 — resource_temporal_overlap
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: venue_load_window_half_open_overlap_rejects_at_one_millisecond
        grounds:
          - "validations[priority=23]"
          - "entities.Show.fields.load_in_at"
          - "entities.Show.fields.load_out_at"
          - "endpoints[POST /shows]"
        distinguishing_aspect: |
          RESOURCE: Venue. INTERVAL SEMANTICS: a genuine half-open DURATION interval
          [load_in_at, load_out_at) — two shows conflict when their occupancy spans intersect, and
          exact adjacency (one show's load_out_at == another's load_in_at) is explicitly permitted.
          Both endpoints of the half-open interval are probed at one-millisecond resolution and in
          both polarities: a candidate whose load_in_at is 1 ms BEFORE an existing load_out_at is
          refused while a candidate whose load_in_at EQUALS it is accepted, and symmetrically a
          candidate whose load_out_at is 1 ms AFTER an existing load_in_at is refused while a
          candidate whose load_out_at EQUALS it is accepted. A closed-interval implementation
          rejects both adjacency cases; an open-interval one accepts both 1 ms overlaps.
          The occupancy set is also filtered by state — a CANCELLED show releases its window.
        test_recipe:
          setup:
            - "One Market (limit 20000000) and one Artist; no offer is ever accepted here, so every show stays PLANNED and the artist rest buffer is irrelevant."
            - "Two Venues in that market: V1 (used for the load_in-side probes) and V2 (used for the load_out-side probes), each capacity 1200 with zero facility fee and zero ticket tax."
            - "An anchor show A1 at V1 occupying [2026-10-09T14:00:00.000Z, 2026-10-10T08:00:00.000Z)."
            - "An anchor show A2 at V2 occupying the SAME span [2026-10-09T14:00:00.000Z, 2026-10-10T08:00:00.000Z)."
            - "The clock sits at 2026-08-01T00:00:00Z, well before every event_at, so priority 22 never fires."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Great Lakes", region_code: "GLK", guarantee_exposure_limit_cents: 20000000 }
              as: RiskOfficer
              captures: { v_mk_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Harbor Lights Trio", agency: "Lakeside Talent", tier: "THEATER", historical_sellthrough_pct: 66.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { v_ar_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${v_mk_id}", name: "Lakeshore Center", gross_capacity: 1200, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { v_vn1_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${v_mk_id}", name: "Dockside Theater", gross_capacity: 1200, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { v_vn2_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${v_ar_id}", venue_id: "${v_vn1_id}", event_at: "2026-10-10T02:00:00.000Z", load_in_at: "2026-10-09T14:00:00.000Z", load_out_at: "2026-10-10T08:00:00.000Z", announce_at: "2026-08-20T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 100000 }
              as: TalentBuyer
              captures: { v_a1_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${v_ar_id}", venue_id: "${v_vn2_id}", event_at: "2026-10-10T02:00:00.000Z", load_in_at: "2026-10-09T14:00:00.000Z", load_out_at: "2026-10-10T08:00:00.000Z", announce_at: "2026-08-20T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 100000 }
              as: TalentBuyer
              captures: { v_a2_id: $.data.id }
          trigger:
            - call: "POST /shows"
              payload: { artist_id: "${v_ar_id}", venue_id: "${v_vn1_id}", event_at: "2026-10-10T20:00:00.000Z", load_in_at: "2026-10-10T07:59:59.999Z", load_out_at: "2026-10-11T02:00:00.000Z", announce_at: "2026-08-20T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 100000 }
              as: TalentBuyer
              captures: { v_overlap_1ms_error: $.data.error_id }
            - call: "POST /shows"
              payload: { artist_id: "${v_ar_id}", venue_id: "${v_vn1_id}", event_at: "2026-10-10T20:00:00.000Z", load_in_at: "2026-10-10T08:00:00.000Z", load_out_at: "2026-10-11T02:00:00.000Z", announce_at: "2026-08-20T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 100000 }
              as: TalentBuyer
              captures: { v_adjacent_after_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${v_ar_id}", venue_id: "${v_vn2_id}", event_at: "2026-10-09T08:00:00.000Z", load_in_at: "2026-10-09T02:00:00.000Z", load_out_at: "2026-10-09T14:00:00.001Z", announce_at: "2026-08-20T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 100000 }
              as: TalentBuyer
              captures: { v_overlap_tail_error: $.data.error_id }
            - call: "POST /shows"
              payload: { artist_id: "${v_ar_id}", venue_id: "${v_vn2_id}", event_at: "2026-10-09T08:00:00.000Z", load_in_at: "2026-10-09T02:00:00.000Z", load_out_at: "2026-10-09T14:00:00.000Z", announce_at: "2026-08-20T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 100000 }
              as: TalentBuyer
              captures: { v_adjacent_before_id: $.data.id }
            - call: "POST /cancellation-events"
              payload: { show_id: "${v_a1_id}", kind: "CANCELLED", reason: "Anchor pulled to free the room" }
              as: RiskOfficer
              captures: { v_ce_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${v_ar_id}", venue_id: "${v_vn1_id}", event_at: "2026-10-09T20:00:00.000Z", load_in_at: "2026-10-09T15:00:00.000Z", load_out_at: "2026-10-10T03:00:00.000Z", announce_at: "2026-08-20T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 100000 }
              as: TalentBuyer
              captures: { v_after_release_id: $.data.id }
          assert:
            - "OVERLAP BY 1 MS AT THE TAIL — ${v_overlap_1ms_error} == ERR_VENUE_WINDOW_CONFLICT with HTTP 409: [2026-10-10T07:59:59.999Z, ...) intersects A1's [..., 2026-10-10T08:00:00.000Z) on exactly one millisecond"
            - "ADJACENT AT THE TAIL — ${v_adjacent_after_id} is a new Show id and the response is 201; load_in_at == A1.load_out_at exactly, which the half-open interval permits, so a closed-interval implementation wrongly rejects this"
            - "OVERLAP BY 1 MS AT THE HEAD — ${v_overlap_tail_error} == ERR_VENUE_WINDOW_CONFLICT with HTTP 409: load_out_at 2026-10-09T14:00:00.001Z is one millisecond past A2's load_in_at"
            - "ADJACENT AT THE HEAD — ${v_adjacent_before_id} is a new Show id and the response is 201; load_out_at == A2.load_in_at exactly, permitted for the same reason and in the opposite polarity"
            - "STATE FILTER — after CancellationEvent.${v_ce_id}, Show.${v_a1_id}.show_status == CANCELLED, so A1 leaves the occupancy set"
            - "STATE FILTER — ${v_after_release_id} is a new Show id and the response is 201 for the window [2026-10-09T15:00:00.000Z, 2026-10-10T03:00:00.000Z), which sits squarely INSIDE the span A1 used to hold; it is accepted only because CANCELLED shows are excluded from the check"
            - "ISOLATION — the released window is disjoint from ${v_adjacent_after_id}'s [2026-10-10T08:00:00.000Z, 2026-10-11T02:00:00.000Z), so A1's cancellation is the only possible explanation for the 201"
            - "NO LEAKAGE — the two refused POST /shows calls persisted nothing: exactly four Shows exist at V1 and V2 combined after the adjacency probes (A1, A2, ${v_adjacent_after_id}, ${v_adjacent_before_id}), and Artist.${v_ar_id}.confirmed_show_count == 0 throughout because no offer was ever accepted"

      - name: artist_rest_buffer_is_a_symmetric_point_distance_not_an_interval
        grounds:
          - "validations[priority=24]"
          - "state_machines.Show.PLANNED_to_CONFIRMED"
          - "state_machines.Show.CONFIRMED_to_POSTPONED"
          - "endpoints[POST /offers/{offer_id}/accept]"
        distinguishing_aspect: |
          RESOURCE: Artist — a DIFFERENT resource entity from the sibling's Venue. INTERVAL
          SEMANTICS: not a duration interval at all but a symmetric POINT-DISTANCE buffer,
          abs(event_at - other.event_at) >= ARTIST_REST_BUFFER_HOURS, evaluated on a single instant
          per show and closed at the boundary (exactly 36h is permitted). It is probed at
          POST /offers/{offer_id}/accept rather than at show creation, because the artist is only
          booked when the deal closes. Symmetry is the trap: exactly 36h is accepted on BOTH sides
          of the anchor, and an implementation using a signed difference or a forward-only window
          passes one side and fails the other. The occupancy set differs from the venue rule too —
          it is {CONFIRMED, ON_SALE, PERFORMED, POSTPONED}, so a POSTPONED show still holds the
          artist's night while a CANCELLED one releases it.
        test_recipe:
          setup:
            - "One Market with guarantee_exposure_limit_cents 20000000 and one Artist."
            - "Five Venues in that market, one per show, so ERR_VENUE_WINDOW_CONFLICT can never confound the artist check."
            - "Five PLANNED RENTAL shows for that one artist, each with rental_fee_cents 100000 and its load window entirely inside its own venue: S1 event 2026-10-10T02:00:00Z (the anchor); S2 event 2026-10-11T14:00:00Z (exactly +36h); S4 event 2026-10-08T14:00:00Z (exactly -36h); S3 event 2026-10-09T01:00:00Z (25h from the anchor); S5 event 2026-10-12T02:00:00Z (12h from S2)."
            - "One SUBMITTED FLAT_GUARANTEE offer per show: guarantee 1000000, deposit 0, expense_cap_cents 1000000. All five are submitted at clock 2026-08-01T00:00:00Z so none can expire during the run (OFFER_TTL_HOURS is 72)."
