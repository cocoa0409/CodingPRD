              as: Coordinator
            - call: "POST /properties"
              payload: { homeowner_id: "${hc28}", address_line: "28 Corner St", state_code: "CA", utility_territory_code: "PGE", main_breaker_amps: 200, floor_area_sqft: 1800 }
              as: Coordinator
              captures: {pc28: $.data.id}
            - call: "POST /install-jobs"
              payload: { property_id: "${pc28}", charger_product_sku: "CCHG28" }
              as: Coordinator
              captures: {jc28: $.data.id}
          trigger:
            - call: "GET /install-jobs/${jc28}"
              as: Anonymous
              captures: {err: $.data.error_id}
          assert:
            - "response.status == 401"
            - "$.data.error_id == ERR_UNAUTHENTICATED"

  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_scope_change_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.scope-change-stale-job, "errors[ERR_STALE_JOB_VERSION]", entities.InstallJob.fields.version]
        distinguishing_aspect: "PATCH /install-jobs/{id}/scope carrying an expected_install_job_version one behind the current version (a prior scope change already advanced it) is rejected ERR_STALE_JOB_VERSION (412)."
        test_recipe:
          setup: ["A CREATED job J on a 200A property; the client captured its version, then a first scope change advanced version by 1"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "c29@x.com", full_name: "C TwentyNine", state_code: "CA" }
              as: Anonymous
              captures: {hc29: $.data.id}
            - call: "POST /charger-products"
              payload: { sku: "CCHG29A", name: "C Charger 29A", rated_amps: 32, required_circuit_amps: 40, msrp_cents: 60000 }
              as: Coordinator
            - call: "POST /charger-products"
              payload: { sku: "CCHG29B", name: "C Charger 29B", rated_amps: 40, required_circuit_amps: 50, msrp_cents: 70000 }
              as: Coordinator
            - call: "POST /charger-products"
              payload: { sku: "CCHG29C", name: "C Charger 29C", rated_amps: 48, required_circuit_amps: 60, msrp_cents: 80000 }
              as: Coordinator
            - call: "POST /properties"
              payload: { homeowner_id: "${hc29}", address_line: "29 Corner St", state_code: "CA", utility_territory_code: "PGE", main_breaker_amps: 200, floor_area_sqft: 1800 }
              as: Coordinator
              captures: {pc29: $.data.id}
            - call: "POST /install-jobs"
              payload: { property_id: "${pc29}", charger_product_sku: "CCHG29A" }
              as: Coordinator
              captures: {jc29: $.data.id, v0: $.data.version}
            - call: "PATCH /install-jobs/${jc29}/scope"
              payload: { charger_product_sku: "CCHG29B", expected_install_job_version: "${v0}" }
              as: Coordinator
          trigger:
            - call: "PATCH /install-jobs/${jc29}/scope"
              payload: { charger_product_sku: "CCHG29C", expected_install_job_version: "${v0}" }
              as: Coordinator
              captures: {err: $.data.error_id}
          assert:
            - "response.status == 412"
            - "$.data.error_id == ERR_STALE_JOB_VERSION"

      - name: occ_quote_accept_stale_after_supersede
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.quote-accept-stale-job, "errors[ERR_STALE_JOB_VERSION]"]
        excluded_because:
          difficulty_instance: dual_variant_calc / incentive_federal_vs_utility_diverge
          rationale: "The quote-accept OCC version capture-then-accept happy path is exercised inside the setup chains of many §1.8 instances; the stale-version negative is covered here at the corner layer via occ_scope_change_stale_version_rejected which shares the same ERR_STALE_JOB_VERSION and version-bump mechanics."

      - name: assessment_accept_cascade_supersedes_prior_referral_branch
        claim_type: cascading_side_effects
        grounds: [state_machines.SiteAssessment.DRAFT_to_ACCEPTED]
        excluded_because:
          difficulty_instance: transitive_cascade / assessment_accept_cascades_referral_then_blocks_compliance
          rationale: "The accept->referral->BLOCKED cascade chain is asserted by the named §1.8 instance."

      - name: clear_gate_requires_both_permit_and_interconnection
        claim_type: rate_threshold_triggers
        grounds: [state_machines.InstallJob.PERMIT_PENDING_to_CLEARED]
        distinguishing_aspect: "With an APPROVED permit but the interconnection only UNDER_REVIEW, the job's compliance_status stays PERMIT_PENDING (not CLEARED) — the CLEARED gate requires BOTH approvals; one alone does not cross the threshold."
        test_recipe:
          setup: ["A QUOTED job with an APPROVED permit and an interconnection still UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "c30@x.com", full_name: "C Thirty", state_code: "CA" }
              as: Anonymous
              captures: {hc30: $.data.id}
            - call: "POST /charger-products"
              payload: { sku: "CCHG30", name: "C Charger 30", rated_amps: 32, required_circuit_amps: 40, msrp_cents: 60000 }
              as: Coordinator
            - call: "POST /properties"
              payload: { homeowner_id: "${hc30}", address_line: "30 Corner St", state_code: "CA", utility_territory_code: "PGE", main_breaker_amps: 200, floor_area_sqft: 1800 }
              as: Coordinator
              captures: {pc30: $.data.id}
            - call: "POST /install-jobs"
              payload: { property_id: "${pc30}", charger_product_sku: "CCHG30" }
              as: Coordinator
              captures: {jc30: $.data.id}
            - call: "POST /site-assessments"
              payload: { property_id: "${pc30}", install_job_id: "${jc30}", assessment_method: "LOAD_STUDY_220_87", declared_fixed_appliance_va: 0, max_measured_demand_va: 7200 }
              as: Coordinator
              captures: {sac30: $.data.id}
            - call: "POST /site-assessments/${sac30}/accept"
              as: Coordinator
            - call: "POST /quotes"
              payload: { install_job_id: "${jc30}", labor_cents: 120000, parts_line_cents: [60000, 5000] }
              as: Coordinator
              captures: {qc30: $.data.id}
            - call: "POST /quotes/${qc30}/send"
              as: Coordinator
            - call: "GET /install-jobs/${jc30}"
              as: Coordinator
              captures: {jvc30: $.data.version}
            - call: "POST /quotes/${qc30}/accept"
              payload: { expected_install_job_version: "${jvc30}" }
              as: Homeowner
              as_user_id: "${hc30}"
            - call: "POST /permit-applications"
              payload: { install_job_id: "${jc30}", jurisdiction_code: "AHJ1" }
              as: Coordinator
              captures: {pmc30: $.data.id}
            - call: "POST /permit-applications/${pmc30}/approve"
              as: Coordinator
            - call: "POST /interconnection-requests"
              payload: { install_job_id: "${jc30}", utility_territory_code: "PGE", requested_load_amps: 32 }
              as: Coordinator
              captures: {icc30: $.data.id}
          trigger:
            - call: "POST /interconnection-requests/${icc30}/start-review"
              as: UtilityReviewer
            - call: "GET /install-jobs/${jc30}"
              as: Coordinator
              captures: {cs: $.data.compliance_status}
          assert:
            - "InstallJob.${jc30}.compliance_status == PERMIT_PENDING"

  # =========================================================================
  # Consistency Model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_compliance_clear_in_same_response
        claim_type: immediate
        grounds: [state_machines.InstallJob.PERMIT_PENDING_to_CLEARED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / install_job_parallel_workflow_compliance_dimensions
          rationale: "Immediate visibility of compliance_status=CLEARED after the second approval is asserted by the named §1.8 instance's trigger+assert."
