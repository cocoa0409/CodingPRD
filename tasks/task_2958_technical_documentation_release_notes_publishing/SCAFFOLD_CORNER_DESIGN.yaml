      - name: change_record_editorial_rework_cycle_increments_rework_count
        claim_type: cyclic
        grounds: ["state_machines.ChangeRecord.transitions.SUBMITTED_to_REWORK_REQUESTED", "state_machines.ChangeRecord.transitions.REWORK_REQUESTED_to_REWORK_REQUESTED", "state_machines.ChangeRecord.transitions.REWORK_REQUESTED_to_EDITORIALLY_APPROVED", "calculations.terminology_violation_scan"]
        distinguishing_aspect: "Two blocked editorial passes then a clean one drive SUBMITTED -> REWORK_REQUESTED -> REWORK_REQUESTED -> EDITORIALLY_APPROVED with rework_count 1 -> 2 -> 2; customer_facing_text is stored only by the clean pass, and the second pass proves one violated term counts once even when two forbidden tokens hit it."
        test_recipe:
          setup:
            - "One train, one BLOCKER term 'login' forbidding 'log in' and 'logon', and one SUBMITTED change record filed by operator lead-01."
            - "Every editorial pass is performed by a different operator (lead-02) so the segregation-of-duties check at priority 31 never fires."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "12.0", doc_freeze_date: "2026-08-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 5000000 }
              as: DocsLead
              captures: { rt_id: "$.data.id" }
            - call: "POST /terminology-terms"
              payload: { term: "login", preferred_form: "sign-in", forbidden_forms: ["log in", "logon"], enforcement_severity: "BLOCKER" }
              as: DocsLead
              captures: { term_id: "$.data.id" }
            - call: "POST /change-records"
              payload: { release_train_id: "${rt_id}", internal_summary: "Auth screen copy refreshed for the new flow", severity: "MINOR", category: "FIX", affected_component: "feature-a" }
              as: DocsLead
              as_user_id: "lead-01"
              captures: { cr_id: "$.data.id" }
          trigger:
            - call: "POST /change-records/${cr_id}/editorial-pass"
              payload: { customer_facing_text: "You can now logon from the new landing page.", used_terms: ["logon"] }
              as: DocsLead
              as_user_id: "lead-02"
            - call: "POST /change-records/${cr_id}/editorial-pass"
              payload: { customer_facing_text: "You can now log in or logon from the new landing page.", used_terms: ["log in", "logon"] }
              as: DocsLead
              as_user_id: "lead-02"
            - call: "POST /change-records/${cr_id}/editorial-pass"
              payload: { customer_facing_text: "You can now sign-in from the new landing page.", used_terms: ["sign-in"] }
              as: DocsLead
              as_user_id: "lead-02"
          assert:
            - "after pass 1: ChangeRecord.${cr_id}.state == REWORK_REQUESTED, rework_count == 1, terminology_blocker_count == 1, customer_facing_text == null and editorial_by_user_id == null"
            - "after pass 2: ChangeRecord.${cr_id}.state == REWORK_REQUESTED, rework_count == 2, terminology_blocker_count == 1 (one term violated by two forbidden tokens still counts once)"
            - "after pass 3: ChangeRecord.${cr_id}.state == EDITORIALLY_APPROVED, terminology_blocker_count == 0 and rework_count is STILL 2 (the clean pass does not reset the counter)"
            - "after pass 3: ChangeRecord.${cr_id}.customer_facing_text == 'You can now sign-in from the new landing page.' and editorial_by_user_id == lead-02"
            - "ChangeRecord.${cr_id}.submitted_by_user_id == lead-01 throughout"

      - name: topic_parallel_review_and_publication_dimensions_diverge
        claim_type: parallel
        grounds: ["state_machines.Topic.review_state", "state_machines.Topic.publication_state", "complexity_profile.state_machine_shape"]
        excluded_because:
          difficulty_instance: topic_parallel_dimensions_diverge_on_post_publication_revision
          rationale: "That instance asserts review_state NOT_SUBMITTED while publication_state stays PUBLISHED, and the independent re-entry to PENDING_SIGNOFF, which is exactly the parallel-dimension claim."

      - name: localization_job_fork_join_branches_each_work
        claim_type: branching
        grounds: ["state_machines.LocalizationJob.transitions.TRANSLATED_to_SCHEDULED_DELAYED", "state_machines.LocalizationJob.transitions.SCHEDULED_DELAYED_to_PUBLISHED_LOCALIZED"]
        excluded_because:
          difficulty_instance: localization_job_fork_join_via_delayed_branch_and_rework_cycle
          rationale: "That instance drives the DELAYED fork, the rework cycle and the join at scheduled_publish_date, asserting the divergent side-effect sets of both branches."

      - name: doc_set_archive_cascade_reaches_locale_and_train_ledgers
        claim_type: cascade_down
        grounds: ["state_machines.DocSetVersion.transitions.PUBLISHED_to_ARCHIVED"]
        excluded_because:
          difficulty_instance: doc_set_archive_cascade_depth_five_to_train_ledger
          rationale: "That instance verifies all five hops of the archive cascade end to end, including the locale word balance and the train's localization_committed_cents."

      - name: locale_word_ledger_stays_synced_with_job_lifecycle
        claim_type: ledger_sync
        grounds: ["calculations.locale_committed_source_words", "state_machines.LocalizationJob.transitions.QUEUED_to_CANCELLED"]
        excluded_because:
          difficulty_instance: locale_committed_source_words_conserved_across_job_create_cancel
          rationale: "That instance reconciles committed_source_words and open_job_count before and after the create/cancel pair against a full recompute."

      - name: writer_load_points_compensated_when_assignment_is_undone
        claim_type: compensation
        grounds: ["state_machines.DocPlanItem.transitions.DRAFTED_to_CANCELLED", "calculations.writer_committed_load_points"]
        excluded_because:
          difficulty_instance: writer_load_points_conserved_across_assign_reassign_cancel
          rationale: "That instance walks assign -> reassign -> cancel and asserts both writers' ledgers return to their exact pre-assignment values."

      - name: submit_review_guarded_by_release_train_posture
        claim_type: guarded_transitions
        grounds: ["state_machines.Topic.transitions.NOT_SUBMITTED_to_PENDING_SIGNOFF", "calculations.release_train_doc_readiness"]
        excluded_because:
          difficulty_instance: topic_submit_review_gated_by_release_train_posture
          rationale: "That instance shows the same submit-review call admitted for a CRITICAL item under RESTRICTED and rejected once a third entity drives the posture to FROZEN."

      - name: changes_requested_decision_cascades_to_plan_item_and_writer
        claim_type: cross_entity
        grounds: ["state_machines.SignOff.transitions.PENDING_to_CHANGES_REQUESTED", "state_machines.DocPlanItem.transitions.IN_REVIEW_to_IN_REVISION"]
        excluded_because:
          difficulty_instance: changes_requested_cascade_depth_four_to_writer_and_train
          rationale: "That instance asserts every hop of the CHANGES_REQUESTED cascade: sibling sign-off superseded, plan item IN_REVISION with rework_count 1 and load_points 27.00, writer ledger 27.00, train ratio 0.00."

