# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of testable claims not in §1.8)
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_parcel_returns_201_envelope_and_slot_ledger
        claim_type: Creation
        grounds: ["entities.Parcel", "endpoints.POST_/parcels"]
        distinguishing_aspect: "POST /parcels with all required fields returns 201; response_type=object, meta present; available_sign_slots initialized to max_signs (=5), active_permit_count=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 200, max_height_ft: 50, min_setback_ft: 10, allowed_illumination: "EXTERNAL", max_signs: 5 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
          assert:
            - "Parcel.${parcel_id}.available_sign_slots == 5"
            - "Parcel.${parcel_id}.active_permit_count == 0"
            - "response response_type == object"

      - name: parcel_default_historic_overlay_false
        claim_type: Defaults
        grounds: ["entities.Parcel.fields.historic_overlay"]
        distinguishing_aspect: "Omitting historic_overlay applies default false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 200, max_height_ft: 50, min_setback_ft: 10, allowed_illumination: "EXTERNAL", max_signs: 5 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
          assert:
            - "Parcel.${parcel_id}.historic_overlay == false"
            - "Parcel.${parcel_id}.corridor_overlay == false"

      - name: application_system_fields_generated
        claim_type: System Fields
        grounds: ["entities.SignApplication.fields.status", "entities.SignApplication.fields.version"]
        distinguishing_aspect: "POST /applications mints id/created_at, sets version=1, status=DRAFT, dimensional_review=PENDING, overlay_review=PENDING regardless of input."
        test_recipe:
          setup: ["A parcel and applicant exist."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 200, max_height_ft: 50, min_setback_ft: 10, allowed_illumination: "EXTERNAL", max_signs: 5 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { name: "Sys Signs", contact_email: "sy@x.com" }
              as: Planner
              as_user_id: "planner-1"
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", sign_type: "WALL", requested_area_sqft: 40, requested_height_ft: 20, requested_setback_ft: 15, requested_illumination: "NONE" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { application_id: $.data.id }
          assert:
            - "SignApplication.${application_id}.version == 1"
            - "SignApplication.${application_id}.status == DRAFT"
            - "SignApplication.${application_id}.dimensional_review == PENDING"

      - name: application_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: ["errors[ERR_VALIDATION]", "endpoints.POST_/applications"]
        distinguishing_aspect: "POST /applications missing requested_area_sqft returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A parcel and applicant exist."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 200, max_height_ft: 50, min_setback_ft: 10, allowed_illumination: "EXTERNAL", max_signs: 5 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { name: "Missing Signs", contact_email: "mi@x.com" }
              as: Planner
              as_user_id: "planner-1"
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", sign_type: "WALL", requested_height_ft: 20, requested_setback_ft: 15, requested_illumination: "NONE" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: application_invalid_enum_sign_type_rejected
        claim_type: Type Constraints
        grounds: ["errors[ERR_INVALID_ENUM]", "entities.SignApplication.fields.sign_type"]
        distinguishing_aspect: "sign_type='NEON' (not in WALL/MONUMENT/DIGITAL) returns ERR_INVALID_ENUM (422)."
        test_recipe:
          setup: ["A parcel and applicant exist."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 200, max_height_ft: 50, min_setback_ft: 10, allowed_illumination: "EXTERNAL", max_signs: 5 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { name: "Enum Signs", contact_email: "en@x.com" }
              as: Planner
              as_user_id: "planner-1"
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", sign_type: "NEON", requested_area_sqft: 40, requested_height_ft: 20, requested_setback_ft: 15, requested_illumination: "NONE" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_ENUM"

      - name: application_bad_parcel_fk_returns_parcel_not_found
        claim_type: Parent Relationships
        grounds: ["errors[ERR_PARCEL_NOT_FOUND]", "entities.SignApplication.fields.parcel_id"]
        distinguishing_aspect: "POST /applications referencing a non-existent parcel_id returns ERR_PARCEL_NOT_FOUND (404)."
        test_recipe:
          setup: ["An applicant exists."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { name: "BadFK Signs", contact_email: "bf@x.com" }
              as: Planner
              as_user_id: "planner-1"
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { parcel_id: "00000000-0000-4000-8000-000000000000", applicant_id: "${applicant_id}", sign_type: "WALL", requested_area_sqft: 40, requested_height_ft: 20, requested_setback_ft: 15, requested_illumination: "NONE" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PARCEL_NOT_FOUND"

      - name: get_application_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_APPLICATION_NOT_FOUND]", "endpoints.GET_/applications/{application_id}"]
        distinguishing_aspect: "GET /applications/{bogus} returns ERR_APPLICATION_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /applications/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: Planner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_APPLICATION_NOT_FOUND"

      - name: get_permit_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_PERMIT_NOT_FOUND]", "endpoints.GET_/permits/{permit_id}"]
        distinguishing_aspect: "GET /permits/{bogus} returns ERR_PERMIT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /permits/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: Planner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PERMIT_NOT_FOUND"

      - name: register_billboard_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_BILLBOARD_NOT_FOUND]", "endpoints.POST_/billboards/{billboard_id}/register"]
        distinguishing_aspect: "POST /billboards/{bogus}/register returns ERR_BILLBOARD_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /billboards/00000000-0000-4000-8000-000000000003/register"
              payload: { amount_cents: 3333 }
              as: Applicant
              as_user_id: "op-x"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BILLBOARD_NOT_FOUND"

      - name: recommend_variance_generic_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints.POST_/variances/{variance_id}/recommend"]
        distinguishing_aspect: "POST /variances/{bogus}/recommend returns generic ERR_NOT_FOUND (404) for the untyped variance root."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /variances/00000000-0000-4000-8000-000000000004/recommend"
              payload: { recommendation: "RECOMMEND_APPROVE" }
              as: Planner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: submit_already_submitted_application_invalid_state
        claim_type: Idempotency
        grounds: ["state_machines.SignApplication.DRAFT_to_SUBMITTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Submitting a SUBMITTED application again returns ERR_INVALID_STATE (409); no double fee computation."
        test_recipe:
          setup: ["A submitted application."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 200, max_height_ft: 50, min_setback_ft: 10, allowed_illumination: "EXTERNAL", max_signs: 5 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { name: "Dup Signs", contact_email: "du@x.com" }
              as: Planner
              as_user_id: "planner-1"
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", sign_type: "WALL", requested_area_sqft: 40, requested_height_ft: 20, requested_setback_ft: 15, requested_illumination: "NONE" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: decide_denied_application_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.SignApplication.SUBMITTED_to_DENIED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A DENIED application is terminal; a second decide returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A denied application."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 200, max_height_ft: 50, min_setback_ft: 10, allowed_illumination: "EXTERNAL", max_signs: 5 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { name: "Term Signs", contact_email: "te@x.com" }
              as: Planner
              as_user_id: "planner-1"
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", sign_type: "WALL", requested_area_sqft: 40, requested_height_ft: 20, requested_setback_ft: 15, requested_illumination: "NONE" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${application_id}/decide"
              payload: { decision: "DENY" }
              as: Planner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /applications/${application_id}/decide"
              payload: { decision: "APPROVE" }
              as: Planner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: cure_violation_before_deadline_succeeds
        claim_type: Valid Transition
        grounds: ["state_machines.Violation.OPEN_to_CURED"]
        distinguishing_aspect: "An OPEN violation cured on/before cure_deadline transitions to CURED."
        test_recipe:
          setup: ["An OPEN violation on a parcel (clock at default 2026-05-01, deadline 2026-05-31)."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 200, max_height_ft: 50, min_setback_ft: 10, allowed_illumination: "EXTERNAL", max_signs: 5 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
            - call: "POST /violations"
              payload: { parcel_id: "${parcel_id}", kind: "NO_PERMIT" }
              as: Planner
              as_user_id: "planner-1"
              captures: { violation_id: $.data.id }
          trigger:
            - call: "POST /violations/${violation_id}/cure"
              payload: {}
              as: Planner
              as_user_id: "planner-1"
          assert:
            - "Violation.${violation_id}.status == CURED"

      - name: escalate_before_cure_deadline_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Violation.OPEN_to_ESCALATED", "errors[ERR_CURE_PERIOD_ACTIVE]"]
        distinguishing_aspect: "Escalating an OPEN violation while now <= cure_deadline returns ERR_CURE_PERIOD_ACTIVE (409)."
        test_recipe:
          setup: ["An OPEN violation just cited (now well before cure_deadline)."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 200, max_height_ft: 50, min_setback_ft: 10, allowed_illumination: "EXTERNAL", max_signs: 5 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
            - call: "POST /violations"
              payload: { parcel_id: "${parcel_id}", kind: "ABANDONED" }
              as: Planner
              as_user_id: "planner-1"
              captures: { violation_id: $.data.id }
          trigger:
            - call: "POST /violations/${violation_id}/escalate"
              payload: {}
              as: Planner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CURE_PERIOD_ACTIVE"

      - name: record_inspection_wrong_inspector_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Inspection.SCHEDULED_to_PASSED", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "An Inspector who is not the assigned inspector_id recording an outcome is rejected with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A SCHEDULED inspection assigned to inspector A; inspector B exists."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 200, max_height_ft: 50, min_setback_ft: 10, allowed_illumination: "EXTERNAL", max_signs: 5 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { name: "Insp Signs", contact_email: "is@x.com" }
              as: Planner
              as_user_id: "planner-1"
              captures: { applicant_id: $.data.id }
            - call: "POST /inspectors"
              payload: { name: "Inspector A" }
              as: Planner
              as_user_id: "planner-1"
              captures: { inspector_a: $.data.id }
            - call: "POST /inspectors"
              payload: { name: "Inspector B" }
              as: Planner
              as_user_id: "planner-1"
              captures: { inspector_b: $.data.id }
            - call: "POST /applications"
              payload: { parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", sign_type: "WALL", requested_area_sqft: 40, requested_height_ft: 20, requested_setback_ft: 15, requested_illumination: "NONE" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${application_id}/review"
              payload: { review_type: "DIMENSIONAL", outcome: "PASS" }
              as: Planner
              as_user_id: "planner-1"
            - call: "POST /applications/${application_id}/review"
              payload: { review_type: "OVERLAY", outcome: "CLEARED" }
              as: Planner
              as_user_id: "planner-1"
            - call: "POST /applications/${application_id}/decide"
              payload: { decision: "APPROVE" }
              as: Planner
              as_user_id: "planner-1"
              captures: { app_ver: $.data.version }
            - call: "POST /permits"
              payload: { application_id: "${application_id}", expected_application_version: "${app_ver}" }
              as: Planner
              as_user_id: "planner-1"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/pay"
              payload: { amount_cents: 16600 }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /inspections"
              payload: { permit_id: "${permit_id}", inspector_id: "${inspector_a}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Planner
              as_user_id: "planner-1"
              captures: { inspection_id: $.data.id }
          trigger:
            - call: "POST /inspections/${inspection_id}/record"
              payload: { outcome: "PASS" }
              as: Inspector
              as_user_id: "${inspector_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: non_conforming_valuation_at_zero_elapsed_equals_original
        claim_type: Correct Result
        grounds: ["calculations.non_conforming_valuation"]
        distinguishing_aspect: "At elapsed_years=0 both straight_line and declining_balance equal original_value_cents (1,000,000)."
        test_recipe:
          setup: ["A non-conforming registration just created at default clock (elapsed 0)."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 200, max_height_ft: 50, min_setback_ft: 10, allowed_illumination: "EXTERNAL", max_signs: 3 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
            - call: "POST /non-conforming"
              payload: { parcel_id: "${parcel_id}", description: "fresh registry", original_value_cents: 1000000, amortization_period_years: 5 }
              as: Planner
              as_user_id: "planner-1"
              captures: { ncr_id: $.data.id }
          trigger:
            - call: "GET /non-conforming?parcel_id=${parcel_id}"
              payload: {}
              as: Planner
              as_user_id: "planner-1"
          assert:
            - "NonConformingRegistration.${ncr_id}.straight_line_value_cents == 1000000"
            - "NonConformingRegistration.${ncr_id}.declining_balance_value_cents == 1000000"

      - name: illumination_rank_exceeds_allowed_rejected
        claim_type: Constants Applied
        grounds: ["calculations.illumination_rank", "errors[ERR_ILLUMINATION_NOT_ALLOWED]"]
        distinguishing_aspect: "requested_illumination=DIGITAL_DISPLAY (rank 2) on a parcel allowing NONE (rank 0) fails DIMENSIONAL PASS with ERR_ILLUMINATION_NOT_ALLOWED."
        test_recipe:
          setup: ["Parcel allowed_illumination=NONE; submitted WALL application requesting DIGITAL_DISPLAY."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "RESIDENTIAL", max_sign_area_sqft: 200, max_height_ft: 50, min_setback_ft: 10, allowed_illumination: "NONE", max_signs: 3 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { name: "Illum Signs", contact_email: "il@x.com" }
              as: Planner
              as_user_id: "planner-1"
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", sign_type: "WALL", requested_area_sqft: 40, requested_height_ft: 20, requested_setback_ft: 15, requested_illumination: "DIGITAL_DISPLAY" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /applications/${application_id}/review"
              payload: { review_type: "DIMENSIONAL", outcome: "PASS" }
              as: Planner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ILLUMINATION_NOT_ALLOWED"

      - name: dual_variant_permit_fee_covered_by_difficulty
        claim_type: Variant Divergence
        grounds: ["calculations.provisional_permit_fee", "calculations.final_permit_fee"]
        excluded_because:
          difficulty_instance: dual_variant_calc / permit_fee_provisional_vs_final
          rationale: "Provisional vs final fee divergence asserted in the named §1.8 instance."

      - name: dual_variant_valuation_covered_by_difficulty
        claim_type: Variant Divergence
        grounds: ["calculations.non_conforming_valuation"]
        excluded_because:
          difficulty_instance: dual_variant_calc / non_conforming_straight_line_vs_declining
          rationale: "Straight-line vs declining-balance divergence asserted in the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: dimensional_area_exceeds_max_rejected
        claim_type: Violation to Error
        grounds: ["errors[ERR_SIGN_AREA_EXCEEDED]", "state_machines.SignApplication.dimensional_review"]
        distinguishing_aspect: "requested_area_sqft=100.5 > max 100 fails DIMENSIONAL PASS with ERR_SIGN_AREA_EXCEEDED (409) — the strictly-above side of the inclusive boundary."
        test_recipe:
          setup: ["Parcel max_sign_area_sqft=100; submitted WALL application requesting 100.5 sqft."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 100, max_height_ft: 50, min_setback_ft: 10, allowed_illumination: "EXTERNAL", max_signs: 3 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
