        grounds:
          - state_machines.Deployment.CONFIRMED_to_DEMOBILIZED
          - state_machines.Adjuster.DEPLOYED_to_RESTING
          - state_machines.InspectionAssignment.SCHEDULED_to_CANCELLED
          - state_machines.Claim.INSPECTION_PENDING_to_TRIAGED
          - calculations.event_posture_recompute
          - calculations.deployment_cost
          - entities.CatastropheEvent.fields.posture
        distinguishing_aspect: |
          Depth-5 chain in which each link is caused strictly by the previous one: demobilize settles the
          Deployment (L1) -> that settlement moves the Adjuster DEPLOYED -> RESTING (L2) -> the adjuster
          leaving DEPLOYED cancels its three SCHEDULED assignments (L3) -> each claim losing its last live
          assignment regresses INSPECTION_PENDING -> TRIAGED (L4) -> the three regressed CAT_SEVERE claims
          raise unassigned_severe to 3 so posture flips OPEN -> RESTRICTED (L5).
