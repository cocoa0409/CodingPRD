  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: contract_activation_half_open_window_overlap
        grounds:
          - state_machines.CustomerContract.DRAFT_to_ACTIVE
          - errors[ERR_CONTRACT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open interval geometry on CustomerContract: window
          [effective_from, effective_to) treats adjacency as non-overlapping —
          a contract starting exactly at another's effective_to activates
          cleanly, while one day of true overlap is rejected. Scoped per
          (customer_id, family): a different customer may hold the identical
          window.
        test_recipe:
          setup:
            - "Customer C1; contract A for (C1, BEARING) ACTIVE with window [2026-01-01, 2026-06-01)"
            - "Draft B (C1, BEARING) [2026-06-01, 2026-12-01) — exactly adjacent; draft C (C1, BEARING) [2026-05-15, 2026-07-01) — overlaps A"
            - "Customer C2 with draft D (C2, BEARING) [2026-01-01, 2026-06-01) — identical window, different customer"
          setup_api_calls:
            - call: "POST /motion/customers"
              payload: { name: "Triangle Plant", credit_limit_cents: 100000000 }
              as: ContractAdministrator
              captures: { c1_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Quadrant Plant", credit_limit_cents: 100000000 }
              as: ContractAdministrator
              captures: { c2_id: $.data.id }
            - call: "POST /motion/contracts"
              payload: { customer_id: "${c1_id}", family: "BEARING", price_basis: "LIST_LESS", discount_pct: 0.10, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }
              as: ContractAdministrator
              captures: { ca_id: $.data.id }
            - call: "POST /motion/contracts/${ca_id}/activate"
              payload: {}
              as: ContractAdministrator
            - call: "POST /motion/contracts"
              payload: { customer_id: "${c1_id}", family: "BEARING", price_basis: "LIST_LESS", discount_pct: 0.12, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: ContractAdministrator
              captures: { cb_id: $.data.id }
            - call: "POST /motion/contracts"
              payload: { customer_id: "${c1_id}", family: "BEARING", price_basis: "LIST_LESS", discount_pct: 0.15, effective_from: "2026-05-15T00:00:00Z", effective_to: "2026-07-01T00:00:00Z" }
              as: ContractAdministrator
              captures: { cc_id: $.data.id }
            - call: "POST /motion/contracts"
              payload: { customer_id: "${c2_id}", family: "BEARING", price_basis: "LIST_LESS", discount_pct: 0.10, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }
              as: ContractAdministrator
              captures: { cd_id: $.data.id }
          trigger:
            - call: "POST /motion/contracts/${cb_id}/activate"
              payload: {}
              as: ContractAdministrator
              captures: { b_status: $.data.status }
            - call: "POST /motion/contracts/${cc_id}/activate"
              payload: {}
              as: ContractAdministrator
              captures: { c_err: $.data.error_id }
            - call: "POST /motion/contracts/${cd_id}/activate"
              payload: {}
              as: ContractAdministrator
              captures: { d_status: $.data.status }
          assert:
            - "b_status == ACTIVE (adjacency allowed: B.effective_from == A.effective_to)"
            - "c_err == ERR_CONTRACT_WINDOW_OVERLAP (true overlap with A: 2026-05-15 < 2026-06-01)"
            - "d_status == ACTIVE (overlap scope is per customer; C2 unaffected)"
            - "CustomerContract.${cc_id}.status remains DRAFT"

      - name: branch_single_dispatched_callout_capacity
        grounds:
          - state_machines.CallOut.REQUESTED_to_DISPATCHED
          - errors[ERR_BRANCH_CALLOUT_CAPACITY]
        distinguishing_aspect: |
          Aggregate-capacity semantics on Branch (a different resource than
          CustomerContract): at most one DISPATCHED call-out per branch at any
          instant — no interval arithmetic, just an instantaneous count ceiling
          of 1 — and the capacity is released by CANCELLED, letting the queued
          call-out dispatch afterward.
        test_recipe:
          setup:
            - "Branch (open 8, close 17, tz 0); two customers; product + stock on_hand 20"
            - "Call-out CO1 (customer A, qty 1) and CO2 (customer B, qty 1) both REQUESTED; clock 2026-08-03T18:00:00Z (after-hours)"
          setup_api_calls:
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T18:00:00Z" }
              as: SystemAdmin
            - call: "POST /motion/products"
              payload: { sku: "BRG-6305", description: "Ball bearing 6305", family: "BEARING", list_price_cents: 3000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id }
            - call: "POST /motion/branches"
              payload: { code: "ABQ-15", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Mesa Plant A", credit_limit_cents: 100000000 }
              as: ContractAdministrator
              captures: { ca_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Mesa Plant B", credit_limit_cents: 100000000 }
              as: ContractAdministrator
              captures: { cb_id: $.data.id }
            - call: "POST /motion/branch-stocks"
              payload: { branch_id: "${b_id}", product_id: "${p_id}", on_hand_qty: 20, factory_lead_time_days: 5 }
              as: BranchManager
            - call: "POST /motion/call-outs"
              payload: { branch_id: "${b_id}", customer_id: "${ca_id}", product_id: "${p_id}", qty: 1 }
              as: CustomerPlant
              as_user_id: "${ca_id}"
              captures: { co1_id: $.data.id }
            - call: "POST /motion/call-outs"
              payload: { branch_id: "${b_id}", customer_id: "${cb_id}", product_id: "${p_id}", qty: 1 }
              as: CustomerPlant
              as_user_id: "${cb_id}"
              captures: { co2_id: $.data.id }
          trigger:
            - call: "POST /motion/call-outs/${co1_id}/dispatch"
              payload: {}
              as: OnCallTechnician
              as_user_id: "tech-1"
              captures: { co1_status: $.data.status }
            - call: "POST /motion/call-outs/${co2_id}/dispatch"
              payload: {}
              as: OnCallTechnician
              as_user_id: "tech-2"
              captures: { err: $.data.error_id }
            - call: "POST /motion/call-outs/${co1_id}/cancel"
              payload: {}
              as: OnCallTechnician
              as_user_id: "tech-1"
            - call: "POST /motion/call-outs/${co2_id}/dispatch"
              payload: {}
              as: OnCallTechnician
              as_user_id: "tech-2"
              captures: { co2_status: $.data.status }
          assert:
            - "co1_status == DISPATCHED (capacity 1 free)"
            - "err == ERR_BRANCH_CALLOUT_CAPACITY (second dispatch while one DISPATCHED exists)"
            - "After CO1 CANCELLED, co2_status == DISPATCHED (capacity released)"
            - "CallOut.${co2_id}.call_out_fee_cents == 20250 (20000 weekday + 1 * 250)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: consignment_stock_sum_invariant
        grounds:
          - state_machines.ConsignmentAgreement
          - state_machines.ConsignmentConsumption.DISPUTED_to_CREDITED
          - entities.BranchStock.fields.on_hand_qty
          - entities.ConsignmentAgreement.fields.remaining_qty
        distinguishing_aspect: |
          Conserved quantity = physical units accounted (BranchStock.on_hand_qty
          + ConsignmentAgreement.remaining_qty). Placement (create) and the
          consume-then-credit pair and final close must each leave the sum
          equal to the original 100; any drift violates the invariant.
        test_recipe:
          setup:
            - "Product list 4000; branch; customer; stock on_hand 100"
            - "Agreement consigned_qty 30 (on_hand 70, remaining 30); consumption qty 10 reported and invoiced"
          setup_api_calls:
            - call: "POST /motion/products"
              payload: { sku: "BRG-6210", description: "Ball bearing 6210", family: "BEARING", list_price_cents: 4000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id }
            - call: "POST /motion/branches"
              payload: { code: "TUL-16", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Plains Plant", credit_limit_cents: 100000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /motion/branch-stocks"
              payload: { branch_id: "${b_id}", product_id: "${p_id}", on_hand_qty: 100, factory_lead_time_days: 5 }
              as: BranchManager
              captures: { bs_id: $.data.id }
            - call: "POST /motion/consignment-agreements"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}", product_id: "${p_id}", consigned_qty: 30 }
              as: ContractAdministrator
              captures: { a_id: $.data.id }
            - call: "POST /motion/consignment-agreements/${a_id}/consumptions"
              payload: { qty: 10 }
              as: CustomerPlant
              as_user_id: "${c_id}"
              captures: { cons_id: $.data.id }
            - call: "POST /motion/consignment-consumptions/${cons_id}/invoice"
              payload: {}
              as: BranchManager
          trigger:
            - call: "POST /motion/consignment-consumptions/${cons_id}/credit"
              payload: {}
              as: BranchManager
            - call: "POST /motion/consignment-agreements/${a_id}/close"
              payload: {}
              as: ContractAdministrator
          assert:
            - "After placement: BranchStock.${bs_id}.on_hand_qty == 70 and ConsignmentAgreement.${a_id}.remaining_qty == 30 (sum == 100)"
            - "After consumption invoice: remaining_qty == 20 (10 consumed-billed; sum 90 while units are sold)"
            - "After credit: ConsignmentConsumption.${cons_id}.status == CREDITED, remaining_qty restored to 30, on_hand_qty still 70 (sum back to 100)"
            - "After close: BranchStock.${bs_id}.on_hand_qty == 100 and agreement remaining_qty == 0, status CLOSED (forward create + compensating close conserve 100 units)"
            - "CustomerAccount.${c_id}.open_receivables_cents == 0 (invoice 40000 then credit -40000)"

      - name: return_credit_value_conservation
        grounds:
          - calculations.return_credit_netting_waterfall
          - state_machines.ReturnAuthorization.RECEIVED_to_CREDIT_ISSUED
          - entities.ReturnAuthorization.fields.eligible_credit_cents
        distinguishing_aspect: |
          Conserved quantity = credit value in cents (different conserved
          quantity than physical stock): after issue-credit,
          eligible_credit_cents == write_down_cents + offset_applied_cents +
          credit_memo_cents must hold exactly — here 17000 == 8500 + 8500 + 0
          with the waterfall filling two consignment invoices oldest-first
          (5000 fully, then 3500 of the second).
        test_recipe:
          setup:
            - "Product P1 list 2500 (customer shipped 10); product P2 list 1000 with consignment agreement (pinned 1000), consumptions 5 (billed 5000, INVOICED) and 6 (billed 6000, INVOICED)"
            - "Return qty 10 OBSOLETE, original_unit_price 2000, approved (requester csr-1, approver bm-1)"
