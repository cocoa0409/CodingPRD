              as_user_id: "${cust2}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_LINE_NOT_LOCKABLE (priority 9 beats priority 14 ERR_CAPACITY_EXCEEDED)"

