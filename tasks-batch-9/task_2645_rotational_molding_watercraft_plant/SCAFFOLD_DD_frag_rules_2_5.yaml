            - "the final inspect returns 409 with data.error_id == \"ERR_UNIT_NOT_REINSPECTABLE\": build_status SELLABLE still permits inspect (priority 38 passes), so the failure is provably the priority 39 logistics-axis guard and not a build-state error"
            - "after that rejection FinishedUnit.${fu}.build_status is still \"SELLABLE\" with rework_count 1 and ProductionOrder.${po}.status is still \"COMPLETE\" — the loop is permanently closed for this hull, so the cycle is bounded rather than infinite"

      - name: shipment_unseal_revert_forces_requote_on_a_new_discount_tier
        grounds:
          - state_machines.Shipment.SEALED_to_LOADING
          - state_machines.Shipment.LOADING_to_SEALED
          - calculations.shipment_freight
          - calculations.shipment_cube_rollup
