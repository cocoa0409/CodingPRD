              as: ShippingCoordinator
          trigger:
            - call: "GET /kcma/orders/${o2_id}"
              as: ShippingCoordinator
              captures: { o2_seq: $.data.route_stop_seq }
            - call: "GET /kcma/orders/${o1_id}"
              as: ShippingCoordinator
              captures: { o1_seq: $.data.route_stop_seq }
          assert:
            - "Order.${o2_id}.route_stop_seq == 1 (assigned first, despite being created second)"
            - "Order.${o1_id}.route_stop_seq == 2"

      - name: assign_order_supersede_endpoint_semantics
        claim_type: action_endpoint
        grounds: ["endpoints[POST /kcma/delivery-routes/{routeId}/assign-order]"]
        excluded_because:
