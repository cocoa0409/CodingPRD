  # ===========================================================================
  # Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[capital-call-issue-stale-fund]", "entities.Fund.fields.version"]
        distinguishing_aspect: "Issuing a capital call with the current expected_fund_version succeeds (201) and increments Fund.version by 1."
        test_recipe:
          setup: ["Fund with one ACTIVE commitment; client reads the current fund version."]
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP OK", lp_type: "INSTITUTION", tax_id_last4: "4141" }
              as: FundAdministrator
              captures: { oklp_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "OCC OK Fund", vintage_year: 2024, target_size_cents: 5000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { okf_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${okf_id}", lp_id: "${oklp_id}", committed_cents: 5000000 }
              as: FundManager
              captures: { okc_id: "$.data.id" }
            - call: "POST /commitments/${okc_id}/accept"
              payload: {}
              as: FundManager
            - call: "GET /funds/${okf_id}"
              payload: {}
              as: FundManager
              captures: { okf_v1: "$.data.version" }
          trigger:
            - call: "POST /capital-calls"
              payload: { fund_id: "${okf_id}", purpose: "INVESTMENT", called_amount_cents: 1000000, due_date: "2024-02-01T00:00:00Z", expected_fund_version: "${okf_v1}" }
              as: FundManager
              captures: { ok_call_id: "$.data.id" }
            - call: "GET /funds/${okf_id}"
              payload: {}
              as: FundManager
              captures: { okf_v2: "$.data.version" }
          assert:
            - "response.status == 201"
            - "Fund.${okf_id}.version == ${okf_v1} + 1"

      - name: occ_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[capital-call-issue-stale-fund]", "errors[ERR_STALE_FUND_VERSION]"]
        distinguishing_aspect: "Issuing a second capital call carrying the pre-first-call fund version (now stale) -> ERR_STALE_FUND_VERSION (412)."
        test_recipe:
          setup: ["Fund with one ACTIVE commitment; one capital call already issued, bumping Fund.version."]
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP SV", lp_type: "INSTITUTION", tax_id_last4: "4242" }
              as: FundAdministrator
              captures: { svlp_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "OCC Stale Fund", vintage_year: 2024, target_size_cents: 5000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { svf_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${svf_id}", lp_id: "${svlp_id}", committed_cents: 5000000 }
              as: FundManager
              captures: { svc_id: "$.data.id" }
            - call: "POST /commitments/${svc_id}/accept"
              payload: {}
              as: FundManager
            - call: "GET /funds/${svf_id}"
              payload: {}
              as: FundManager
              captures: { svf_v1: "$.data.version" }
            - call: "POST /capital-calls"
              payload: { fund_id: "${svf_id}", purpose: "INVESTMENT", called_amount_cents: 1000000, due_date: "2024-02-01T00:00:00Z", expected_fund_version: "${svf_v1}" }
              as: FundManager
              captures: { sv_call1_id: "$.data.id" }
          trigger:
            - call: "POST /capital-calls"
              payload: { fund_id: "${svf_id}", purpose: "INVESTMENT", called_amount_cents: 500000, due_date: "2024-03-01T00:00:00Z", expected_fund_version: "${svf_v1}" }
              as: FundManager
              captures: { sv_err: "$.data.error_id" }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_FUND_VERSION"

      - name: derived_drawn_cents_reconciled_after_funding
        claim_type: derived_field_reconciliation
        grounds: ["entities.Commitment.fields.drawn_cents", "entities.Commitment.fields.unfunded_cents"]
        distinguishing_aspect: "After funding a 5000000 allocation, Commitment.drawn_cents == 5000000 and unfunded_cents == 0 (committed 5000000)."
        test_recipe:
          setup: ["Single-commitment fund; an ISSUED call with one PENDING allocation of 5000000."]
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP DR", lp_type: "INSTITUTION", tax_id_last4: "4343" }
              as: FundAdministrator
              captures: { drlp_id: "$.data.id" }
