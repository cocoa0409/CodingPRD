            - "Quote.${q_firm_id}.variant == FIRM and Quote.${q_firm_id}.subtotal_cents == 333894"
            - "Quote.${q_prov_id}.subtotal_cents - Quote.${q_firm_id}.subtotal_cents == 1"
            - "Quote.${q_prov_id}.freight_cents == 54250 and Quote.${q_firm_id}.freight_cents == 54250"
            - "Quote.${q_prov_id}.priced_unit_count == 5 and Quote.${q_firm_id}.priced_unit_count == 5"
            - "Quote.${q_prov_id}.discount_cents == 0 and Quote.${q_firm_id}.discount_cents == 0"
            - "Quote.${q_prov_id}.total_cents == 388145"
            - "Quote.${q_firm_id}.total_cents == 388144"
            - "Quote.${q_prov_id}.status == EXPIRED (the FIRM quote superseded it)"
            - "Quote.${q_firm_id}.status == ISSUED"

      - name: warranty_prorated_vs_step_diverge_on_identical_claim_inputs
