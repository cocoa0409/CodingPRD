          rationale: "That §1.8 cross_entity_state_dependency instance already asserts the lead-day arithmetic on publication (reauthorization_due_at == 2026-09-01T00:00:00.000Z), and two corner instances in this file re-assert it at 2027-07-02 and 2026-08-02."

