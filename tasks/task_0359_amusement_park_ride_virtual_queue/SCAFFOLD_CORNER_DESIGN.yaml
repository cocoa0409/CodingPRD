            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "A1", height_cm: 170 }
              as: ParkAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "G2", height_cm: 170 }
              as: ParkAdmin
              captures: { g2_id: $.data.id }
            - call: "POST /parks/${park_id}/day-tickets"
              payload: { guest_id: "${a1_id}", ticket_date: "2026-06-15" }
              as: ParkAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /parks/${park_id}/admissions"
              payload: { ticket_id: "${t1_id}" }
              as: ParkAdmin
          trigger:
            - call: "POST /reservations"
              payload: { ride_id: "${ride_id}", guest_id: "${g2_id}", return_window_id: "${win_id}", queue_type: "VIRTUAL_QUEUE", expected_return_window_id_version: "${win_v0}" }
              as: GuestApp
              as_user_id: "${g2_id}"
              captures: { res_id: $.data.id }
          assert:
            - "Reservation.${res_id}.reservation_status == HELD"
            - "Park.${park_id}.day_phase == OPEN"

      - name: derived_booked_slot_count_after_confirm
        claim_type: derived_field_reconciliation
        grounds: [entities.Ride.fields.booked_slot_count, entities.Ride.fields.posted_wait_minutes]
        distinguishing_aspect: "After a VIRTUAL_QUEUE booking, Ride.booked_slot_count becomes 1 and posted_wait_minutes recomputes to ceil((1+20)/100*60)=13."
        test_recipe:
          setup: ["Ride R100; one VIRTUAL_QUEUE reservation HELD then read back"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { park_id: "${park_id}", to_iso8601: "2026-06-15T09:00:00.000Z" }
              as: ParkAdmin
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R100", hourly_throughput: 100 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
            - call: "POST /rides/${ride_id}/return-windows"
              payload: { window_start_utc: "2026-06-15T10:00:00.000Z", window_end_utc: "2026-06-15T11:00:00.000Z" }
              as: ParkAdmin
              captures: { win_id: $.data.id, win_v0: $.data.version }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "G1", height_cm: 170 }
              as: ParkAdmin
              captures: { g1_id: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { ride_id: "${ride_id}", guest_id: "${g1_id}", return_window_id: "${win_id}", queue_type: "VIRTUAL_QUEUE", expected_return_window_id_version: "${win_v0}" }
              as: GuestApp
              as_user_id: "${g1_id}"
              captures: { res_id: $.data.id }
          assert:
            - "Ride.${ride_id}.booked_slot_count == 1"
