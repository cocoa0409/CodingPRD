            - call: "POST /toolworks/warranty-claims/${claim2_id}/approve"
              payload: { expected_program_version: "${prog_v}" }
              as: WarrantyAdministrator
              as_user_id: "wa-1"
              captures: { e_stock: $.data.error_id }
            - call: "POST /toolworks/tool-skus/${sku_id}/stock-receipts"
              payload: { units_received: 5 }
              as: ChannelManager
              captures: { on_hand_1: $.data.units_on_hand }
            - call: "POST /toolworks/warranty-claims/${claim2_id}/approve"
              payload: { expected_program_version: "${prog_v}" }
              as: WarrantyAdministrator
              as_user_id: "wa-1"
              captures: { claim2_status: $.data.status, charge: $.data.reserve_charge_cents, units: $.data.replacement_unit_count }
          assert:
            - "The line-less claim returns HTTP 422 with error_id == 'ERR_CLAIM_HAS_NO_LINES', not a stock or reserve error"
            - "The lined claim with only 1 unit on hand returns HTTP 409 with error_id == 'ERR_REPLACEMENT_STOCK_INSUFFICIENT' (1 < 2)"
            - "line_reserve_cents == 1363 (round_half_up(1099 * 2 * 0.62 * 1.0)) and WarrantyClaim.${claim2_id}.reserve_charge_cents == 1363 with replacement_unit_count == 2"
            - "After the second receipt units_on_hand == 6, and the same approve request now returns HTTP 200 with status == 'APPROVED'"
            - "ToolSku.${sku_id}: units_received_total == 6, units_on_hand == 4, units_reserved == 2, units_shipped == 0"
            - "WarrantyProgram.${prog_id}.reserve_balance_cents == 4998637 and WarrantyClaim.${claim1_id}.status is still 'SUBMITTED'"

      - name: approval_fraud_gate_yields_to_an_explicit_clearance
        claim_type: conditional_validation
        grounds:
          - validations[priority=810]
          - state_machines.WarrantyClaim.FRAUD_HOLD_to_SUBMITTED
          - errors[ERR_FRAUD_SCORE_TOO_HIGH]
        distinguishing_aspect: "Rule 810 is a disjunction: the same claim with an unchanged adjudication score of 36 against a threshold of 30 is first refused and then approved, the only difference being that fraud_cleared has been set true by a hold/clear-hold round trip — the score itself is never lowered."
        test_recipe:
          setup:
            - "Two BRANDED LIFETIME SKUs; the first carries 10 units on hand from a stock receipt."
            - "One programme with fraud_score_threshold 30 and reserve_funded_cents 5000000."
            - "One CONSUMER claimant who files 'SN-A' on the first SKU (intake 9, SUBMITTED, one line HANDLE 1099 x1) and then 'SN-A' again on the second SKU, whose intake score of 36 auto-holds it."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku1: $.data.id }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "SO-20-BR", tool_family: "SOCKET", channel: "BRANDED", nominal_size_mm: 20, alloy_grade: "CR_V", list_price_cents: 1500, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku2: $.data.id }
            - call: "POST /toolworks/tool-skus/${sku1}/stock-receipts"
              payload: { units_received: 10 }
              as: ChannelManager
            - call: "POST /toolworks/warranty-programs"
              payload: { program_code: "LIFETIME-1", reserve_funded_cents: 5000000, fraud_score_threshold: 30 }
              as: WarrantyAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /toolworks/claimants"
              payload: { email: "c1@example.com", claimant_type: "CONSUMER" }
              as: WarrantyAdministrator
              captures: { claimant_id: $.data.id }
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${claimant_id}", sku_id: "${sku1}", program_id: "${prog_id}", serial_code: "SN-A", claim_reason: "BREAKAGE" }
              as: WarrantyAdministrator
              captures: { claim1_id: $.data.id, intake1: $.data.fraud_score_at_intake }
            - call: "POST /toolworks/warranty-claims/${claim1_id}/lines"
              payload: { component_code: "HANDLE", component_list_price_cents: 1099, quantity: 1 }
              as: WarrantyAdministrator
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${claimant_id}", sku_id: "${sku2}", program_id: "${prog_id}", serial_code: "SN-A", claim_reason: "BREAKAGE" }
              as: WarrantyAdministrator
              captures: { claim2_id: $.data.id, intake2: $.data.fraud_score_at_intake, claim2_status: $.data.status }
            - call: "GET /toolworks/warranty-programs/${prog_id}"
              payload: {}
              as: WarrantyAdministrator
              captures: { prog_v1: $.data.version }
          trigger:
            - call: "POST /toolworks/warranty-claims/${claim1_id}/approve"
              payload: { expected_program_version: "${prog_v1}" }
              as: WarrantyAdministrator
              as_user_id: "wa-9"
              captures: { e_fraud: $.data.error_id }
            - call: "POST /toolworks/warranty-claims/${claim1_id}/hold"
              payload: { hold_reason: "SERIAL_REPEAT_REVIEW" }
              as: WarrantyAdministrator
              as_user_id: "wa-1"
            - call: "POST /toolworks/warranty-claims/${claim1_id}/clear-hold"
              payload: { clearance_note: "Serial verified against production records" }
              as: WarrantyAdministrator
              as_user_id: "wa-2"
              captures: { cleared: $.data.fraud_cleared }
            - call: "GET /toolworks/warranty-programs/${prog_id}"
              payload: {}
              as: WarrantyAdministrator
              captures: { prog_v2: $.data.version }
            - call: "POST /toolworks/warranty-claims/${claim1_id}/approve"
              payload: { expected_program_version: "${prog_v2}" }
              as: WarrantyAdministrator
              as_user_id: "wa-2"
              captures: { final_status: $.data.status }
          assert:
            - "intake1 == 9 and claim 1 is created SUBMITTED"
            - "intake2 == 36 ((2 - 0) * 9 + 1 * 18) so claim 2 is persisted directly in 'FRAUD_HOLD' with hold_reason 'INTAKE_FRAUD_SCORE' and held_by_user_id null"
            - "Claimant.${claimant_id}.fraud_risk_score_adjudication == 36 (lifetime set, no counterfeit links)"
            - "The first approval of claim 1 returns HTTP 409 with error_id == 'ERR_FRAUD_SCORE_TOO_HIGH' (36 >= 30 and fraud_cleared is false)"
            - "After clear-hold, WarrantyClaim.${claim1_id}.fraud_cleared == true and fraud_risk_score_adjudication is STILL 36"
            - "The second approval returns HTTP 200 with status == 'APPROVED', and it is performed by wa-2 so the segregation rule against wa-1 is not engaged"
            - "WarrantyProgram.${prog_id}.reserve_balance_cents == 4999319 (5000000 - 681) and open_hold_count == 1 (claim 2 is still held)"

      - name: test_scheduling_with_every_gate_satisfied_succeeds
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=340]
          - validations[priority=510]
          - validations[priority=601]
          - validations[priority=701]
          - validations[priority=702]
        distinguishing_aspect: "One SALT_SPRAY request satisfies five independent gates at once — chamber supplied, lot at PLATED, window after the completed campaign, specimens within the pool, coupons within capacity — and the response shows every derived counter on all three entities moving together."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU on CR_MO, one CR_MO furnace, one chamber with coupon_capacity 24, one lot with specimen_pool_total 20 advanced to PLATED via a COMPLETED campaign ending 2026-08-02T10:00:00Z."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-1", max_charge_kg: 900, alloy_grades_supported: ["CR_MO"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id }
            - call: "POST /toolworks/salt-spray-chambers"
              payload: { chamber_code: "SSC-1", coupon_capacity: 24 }
              as: QualityEngineer
              captures: { chamber_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-A", unit_count: 500, specimen_pool_total: 20 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot_id}", furnace_id: "${furnace_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { camp_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns/${camp_id}/complete"
              payload: { soak_minutes: 120 }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "HEAT_TREATED" }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "MACHINED" }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "PLATED" }
              as: ProductionPlanner
          trigger:
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "SALT_SPRAY", specimen_count: 4, chamber_id: "${chamber_id}", window_start: "2026-08-04T00:00:00Z", window_end: "2026-08-08T00:00:00Z" }
              as: QualityEngineer
              captures: { run_id: $.data.id, run_status: $.data.status, req: $.data.requirement_value }
            - call: "GET /toolworks/production-lots/${lot_id}"
              payload: {}
              as: QualityEngineer
              captures: { committed: $.data.specimens_committed, cert: $.data.cert_status }
            - call: "GET /toolworks/salt-spray-chambers/${chamber_id}"
              payload: {}
              as: QualityEngineer
              captures: { cap: $.data.coupon_capacity, chamber_v: $.data.version }
          assert:
            - "The request returns HTTP 201 with status == 'SCHEDULED', mandatory == true (SALT_SPRAY is mandatory for WRENCH) and requirement_value == 96 (SALT_SPRAY_MIN_HOURS.BRANDED)"
            - "ProductionLot.${lot_id}.specimens_committed == 4, specimens_consumed == 0, specimens_available == 16"
            - "ProductionLot.${lot_id}.cert_status == 'IN_TEST' — the first accepted test-run opened the certification dimension"
            - "SaltSprayChamber.${chamber_id} is untouched by the booking: cap == 24 and chamber_v == 1 — the coupon load is derived on demand from the overlapping SCHEDULED runs (validation 702), never denormalised onto the chamber row"

      - name: claim_state_gate_versus_reserve_gate_ordering
        claim_type: priority_ordering
        grounds:
          - validations[priority=407]
          - validations[priority=800]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / claim_state_beats_reserve_fiscal
          rationale: "The 407-over-800 report order with both rules violated on one approve call is exactly that instance's subject."

      - name: campaign_alloy_gate_versus_window_gate_ordering
        claim_type: priority_ordering
        grounds:
          - validations[priority=500]
          - validations[priority=600]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / campaign_alloy_safety_beats_window_temporal
          rationale: "The 500-over-600 report order, and the reachability of ERR_FURNACE_WINDOW_CONFLICT once the alloy is supported, are asserted there."

      - name: specimen_pool_exhaustion_at_and_beyond_the_pool
        claim_type: aggregate_validation
        grounds:
          - validations[priority=701]
          - errors[ERR_SPECIMENS_EXHAUSTED]
        excluded_because:
          difficulty_instance: boundary_precision_check / test_run_specimen_count_equals_available_pool_boundary
          rationale: "The inclusive equality at specimens_available and the one-over rejection are asserted there."

      - name: chamber_coupon_capacity_is_an_aggregate_over_overlaps
        claim_type: aggregate_validation
        grounds:
          - validations[priority=702]
          - errors[ERR_CHAMBER_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / salt_spray_chamber_aggregate_coupon_capacity_overlap
          rationale: "Individually-valid runs whose overlapping coupon load exceeds capacity are asserted there."

      - name: furnace_window_exclusivity_includes_the_ramp_buffer
        claim_type: temporal_validation
        grounds:
          - validations[priority=600]
          - errors[ERR_FURNACE_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / furnace_campaign_ramp_buffer_exclusive_window
          rationale: "The buffered-interval arithmetic, including the exactly-adjacent accept case, is asserted there."

      - name: advance_requires_a_completed_campaign_on_the_lot
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=470]
          - errors[ERR_HEAT_TREAT_NOT_COMPLETED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / lot_advance_requires_completed_furnace_campaign
          rationale: "The SCHEDULED-is-not-enough behaviour and the independence of the two lot dimensions are asserted there."

      - name: approval_requires_open_warranty_posture_on_the_sku
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=471]
          - errors[ERR_SKU_WARRANTY_RESTRICTED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / claim_approve_requires_sku_posture_open
          rationale: "Both RESTRICTED and SUSPENDED blocking the approval of an otherwise clean claim are asserted there."

  - section: endpoints
    instances:

      - name: standard_crud_and_partial_patch_on_tool_sku
        claim_type: standard_crud
        grounds:
          - endpoints[POST /toolworks/tool-skus]
          - endpoints[GET /toolworks/tool-skus/{id}]
          - endpoints[PATCH /toolworks/tool-skus/{id}]
          - endpoints[GET /toolworks/tool-skus]
        distinguishing_aspect: "PATCH is a true partial update: a body carrying only list_price_cents leaves warranty_tier, nominal_size_mm and the computed proof torque untouched, each accepted PATCH increments version by exactly one, and the list endpoint reflects the newest values without a second write."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU, 17 mm, CR_MO, list_price_cents 3300, warranty_tier LIFETIME."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id, v0: $.data.version, t0: $.data.proof_torque_required_nm }
          trigger:
            - call: "PATCH /toolworks/tool-skus/${sku_id}"
              payload: { list_price_cents: 3900 }
              as: ChannelManager
              captures: { price1: $.data.list_price_cents, tier1: $.data.warranty_tier, t1: $.data.proof_torque_required_nm, v1: $.data.version }
            - call: "PATCH /toolworks/tool-skus/${sku_id}"
              payload: { warranty_tier: "LIMITED_5Y" }
              as: ChannelManager
              captures: { price2: $.data.list_price_cents, tier2: $.data.warranty_tier, v2: $.data.version }
            - call: "GET /toolworks/tool-skus/${sku_id}"
              payload: {}
              as: WarrantyAdministrator
              captures: { read_price: $.data.list_price_cents, read_tier: $.data.warranty_tier, read_v: $.data.version }
            - call: "GET /toolworks/tool-skus"
              payload: { channel: "BRANDED", tool_family: "WRENCH" }
              as: ChannelManager
          assert:
            - "v0 == 1, v1 == 2, v2 == 3 — one increment per accepted PATCH, never two"
            - "After the price-only PATCH: list_price_cents == 3900 while warranty_tier is still 'LIFETIME' and proof_torque_required_nm is still 115.8 (price is not a formula input)"
            - "After the tier-only PATCH: warranty_tier == 'LIMITED_5Y' and list_price_cents is still 3900"
            - "GET /{id} returns exactly the patched state with version 3 and does not itself increment version"
            - "GET /toolworks/tool-skus?channel=BRANDED&tool_family=WRENCH returns total_count 1 with the SKU's current patched values; the same read with channel=PROFESSIONAL returns total_count 0 and an empty data array"

      - name: body_level_foreign_keys_must_resolve_on_every_link_endpoint
        claim_type: cross_reference_link
        grounds:
          - validations[priority=210]
          - validations[priority=211]
          - validations[priority=212]
          - validations[priority=213]
          - validations[priority=214]
          - validations[priority=215]
          - validations[priority=216]
          - errors[ERR_FURNACE_NOT_FOUND]
          - errors[ERR_CHAMBER_NOT_FOUND]
          - errors[ERR_PRODUCTION_LOT_NOT_FOUND]
          - errors[ERR_WARRANTY_PROGRAM_NOT_FOUND]
          - errors[ERR_CLAIMANT_NOT_FOUND]
        distinguishing_aspect: "Body-borne foreign keys are resolved with the same specificity as path parameters and each gets its own code: an unknown furnace_id, chamber_id, sku_id, claimant_id, program_id or supersedes_sku_id each returns the code named for THAT entity, never a generic 404, and none of the parent rows are mutated."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU, one CR_MO furnace, one lot, one programme and one claimant all exist; every trigger substitutes a single unknown UUID into one link field."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-1", max_charge_kg: 900, alloy_grades_supported: ["CR_MO"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-A", unit_count: 500, specimen_pool_total: 20 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /toolworks/warranty-programs"
              payload: { program_code: "LIFETIME-1", reserve_funded_cents: 5000000, fraud_score_threshold: 60 }
              as: WarrantyAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /toolworks/claimants"
              payload: { email: "c1@example.com", claimant_type: "CONSUMER" }
              as: WarrantyAdministrator
              captures: { claimant_id: $.data.id }
          trigger:
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "00000000-0000-0000-0000-0000000000aa", lot_code: "LOT-X", unit_count: 10, specimen_pool_total: 4 }
              as: ProductionPlanner
              captures: { e_sku: $.data.error_id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot_id}", furnace_id: "00000000-0000-0000-0000-0000000000aa", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { e_furnace: $.data.error_id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "00000000-0000-0000-0000-0000000000aa", furnace_id: "${furnace_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { e_lot: $.data.error_id }
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "SALT_SPRAY", specimen_count: 2, chamber_id: "00000000-0000-0000-0000-0000000000aa", window_start: "2026-08-04T00:00:00Z", window_end: "2026-08-08T00:00:00Z" }
              as: QualityEngineer
              captures: { e_chamber: $.data.error_id }
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "00000000-0000-0000-0000-0000000000aa", sku_id: "${sku_id}", program_id: "${prog_id}", serial_code: "SN-1", claim_reason: "BREAKAGE" }
              as: WarrantyAdministrator
              captures: { e_claimant: $.data.error_id }
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${claimant_id}", sku_id: "${sku_id}", program_id: "00000000-0000-0000-0000-0000000000aa", serial_code: "SN-1", claim_reason: "BREAKAGE" }
              as: WarrantyAdministrator
              captures: { e_program: $.data.error_id }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-19-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 19, alloy_grade: "CR_MO", list_price_cents: 3600, warranty_tier: "LIFETIME", supersedes_sku_id: "00000000-0000-0000-0000-0000000000aa" }
              as: ChannelManager
              captures: { e_supersedes: $.data.error_id }
          assert:
            - "Unknown sku_id on lot creation returns HTTP 404 with error_id == 'ERR_TOOL_SKU_NOT_FOUND'"
            - "Unknown furnace_id returns 'ERR_FURNACE_NOT_FOUND'; unknown lot_id returns 'ERR_PRODUCTION_LOT_NOT_FOUND' — both HTTP 404 and both from the same endpoint"
            - "Unknown chamber_id returns 'ERR_CHAMBER_NOT_FOUND' ahead of any stage or capacity evaluation"
            - "Unknown claimant_id returns 'ERR_CLAIMANT_NOT_FOUND' and unknown program_id returns 'ERR_WARRANTY_PROGRAM_NOT_FOUND'"
            - "Unknown supersedes_sku_id returns 'ERR_TOOL_SKU_NOT_FOUND' rather than a lineage error"
            - "No rows are created by any trigger: GET /toolworks/production-lots total_count 1, GET /toolworks/furnace-campaigns total_count 0, GET /toolworks/test-runs total_count 0, GET /toolworks/warranty-claims total_count 0, GET /toolworks/tool-skus total_count 1"

      - name: scoped_collection_reads_return_only_their_own_children
        claim_type: computed_read
        grounds:
          - endpoints[GET /toolworks/tool-skus/{id}/production-lots]
          - endpoints[GET /toolworks/tool-skus/{id}/pack-memberships]
          - endpoints[GET /toolworks/production-lots/{id}/test-runs]
          - endpoints[GET /toolworks/pack-configurations/{id}/members]
          - entities.PackConfiguration.fields.distinct_member_count
        distinguishing_aspect: "Every nested collection is scoped to its own parent and the filter arguments compose with that scoping: with two SKUs, two lots and two packs in play, each nested read returns only the rows belonging to the addressed parent, and the parent's own denormalised counter agrees with the collection's total_count."
        test_recipe:
          setup:
            - "Two BRANDED SKUs; SKU 1 owns two lots and belongs to two packs, SKU 2 owns one lot and belongs to one pack."
            - "Lot 1 carries one SCHEDULED HARDNESS run."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku1: $.data.id }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "SO-20-BR", tool_family: "SOCKET", channel: "BRANDED", nominal_size_mm: 20, alloy_grade: "CR_V", list_price_cents: 1500, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku2: $.data.id }
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-1", max_charge_kg: 900, alloy_grades_supported: ["CR_MO", "CR_V"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku1}", lot_code: "LOT-1A", unit_count: 100, specimen_pool_total: 20 }
              as: ProductionPlanner
              captures: { lot1: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku1}", lot_code: "LOT-1B", unit_count: 100, specimen_pool_total: 20 }
              as: ProductionPlanner
              captures: { lot2: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku2}", lot_code: "LOT-2A", unit_count: 100, specimen_pool_total: 20 }
              as: ProductionPlanner
              captures: { lot3: $.data.id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot1}", furnace_id: "${furnace_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { camp1: $.data.id }
            - call: "POST /toolworks/furnace-campaigns/${camp1}/complete"
              payload: { soak_minutes: 120 }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot1}/advance"
              payload: { target_process_status: "HEAT_TREATED" }
              as: ProductionPlanner
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot1}", test_type: "HARDNESS", specimen_count: 2, window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T09:00:00Z" }
              as: QualityEngineer
              captures: { run1: $.data.id }
            - call: "POST /toolworks/pack-configurations"
              payload: { pack_code: "PK-1", pack_type: "RETAIL_DISPLAY", primary_sku_id: "${sku1}" }
              as: ChannelManager
              captures: { pack1: $.data.id }
            - call: "POST /toolworks/pack-configurations"
              payload: { pack_code: "PK-2", pack_type: "MULTIPACK", primary_sku_id: "${sku1}" }
              as: ChannelManager
              captures: { pack2: $.data.id }
            - call: "POST /toolworks/pack-configurations/${pack1}/members"
              payload: { sku_id: "${sku1}", quantity: 1 }
              as: ChannelManager
            - call: "POST /toolworks/pack-configurations/${pack1}/members"
              payload: { sku_id: "${sku2}", quantity: 2 }
              as: ChannelManager
            - call: "POST /toolworks/pack-configurations/${pack2}/members"
              payload: { sku_id: "${sku1}", quantity: 3 }
              as: ChannelManager
          trigger:
            - call: "GET /toolworks/tool-skus/${sku1}/production-lots"
              payload: { limit: 50, offset: 0 }
              as: ProductionPlanner
            - call: "GET /toolworks/tool-skus/${sku2}/production-lots"
              payload: { limit: 50, offset: 0 }
              as: ProductionPlanner
            - call: "GET /toolworks/tool-skus/${sku1}/pack-memberships"
              payload: { limit: 50, offset: 0 }
              as: ChannelManager
            - call: "GET /toolworks/production-lots/${lot1}/test-runs"
              payload: { test_type: "HARDNESS", status: "SCHEDULED" }
              as: QualityEngineer
            - call: "GET /toolworks/production-lots/${lot2}/test-runs"
              payload: { limit: 50, offset: 0 }
              as: QualityEngineer
            - call: "GET /toolworks/pack-configurations/${pack1}/members"
              payload: { limit: 50, offset: 0 }
              as: ChannelManager
          assert:
            - "GET /toolworks/tool-skus/${sku1}/production-lots returns total_count 2 and GET /toolworks/tool-skus/${sku2}/production-lots returns total_count 1 — the nested lot read is scoped by the addressed SKU and never leaks siblings"
            - "GET /toolworks/tool-skus/${sku1}/pack-memberships returns total_count 2 (memberships in PK-1 and PK-2) while the equivalent read on SKU 2 returns total_count 1"
            - "GET /toolworks/production-lots/${lot1}/test-runs?test_type=HARDNESS&status=SCHEDULED returns total_count 1; the same read on ${lot2} returns total_count 0 and an empty data array even though a HARDNESS run exists on the sibling lot"
            - "GET /toolworks/pack-configurations/${pack1}/members returns total_count 2, equal to PackConfiguration.${pack1}.distinct_member_count"
            - "PackConfiguration.${pack2}.distinct_member_count == 1"
            - "Every scoped read carries the §1.0 envelope with meta.total_count, meta.limit, meta.offset and meta.has_more present"

      - name: release_is_a_conditional_action_gated_on_certification
        claim_type: conditional_action
        grounds:
          - endpoints[POST /toolworks/production-lots/{id}/release]
          - validations[priority=514]
          - errors[ERR_LOT_NOT_CERTIFIED]
        distinguishing_aspect: "Release is refused on a brand-new IN_PROCESS lot even when the optimistic-concurrency token is correct, proving 514 is reached only after 450 passes; the failed call leaves the SKU's inventory ledger completely untouched."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU with no receipts and one lot of 500 units still at FORGED / DRAFT / IN_PROCESS."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-A", unit_count: 500, specimen_pool_total: 20 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "GET /toolworks/tool-skus/${sku_id}"
              payload: {}
              as: ProductionPlanner
              captures: { sku_v: $.data.version }
          trigger:
            - call: "POST /toolworks/production-lots/${lot_id}/release"
              payload: { expected_sku_version: "${sku_v}" }
              as: ProductionPlanner
              captures: { e_notcert: $.data.error_id }
            - call: "GET /toolworks/tool-skus/${sku_id}"
              payload: {}
              as: ProductionPlanner
              captures: { after_v: $.data.version, after_recv: $.data.units_received_total, after_hand: $.data.units_on_hand }
          assert:
            - "Release returns HTTP 409 with error_id == 'ERR_LOT_NOT_CERTIFIED' — the version token was correct, so 450 passed and 514 fired"
            - "ProductionLot.${lot_id}.disposition is still 'IN_PROCESS' and released_at is null"
            - "ToolSku.${sku_id}: version unchanged from sku_v, units_received_total == 0, units_on_hand == 0, units_reserved == 0, units_shipped == 0"

      - name: logical_clock_endpoint_governs_every_timestamp
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /toolworks/_clock/set_current_utc]
          - calculations.claimant_fraud_score.constants.CLAIM_WINDOW_DAYS
        distinguishing_aspect: "The logical clock is the sole time source: created_at on a row written before any clock call is exactly 2026-08-01T00:00:00Z, and after advancing the clock the next row is stamped with the new instant — no wall-clock drift and no per-row skew."
        test_recipe:
          setup:
            - "Empty database. The first SKU is created before the clock is ever set; the second after the clock is moved forward."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku1: $.data.id, created_default: $.data.created_at }
          trigger:
            - call: "POST /toolworks/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T12:30:00Z" }
              as: PlatformAdmin
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "SO-20-BR", tool_family: "SOCKET", channel: "BRANDED", nominal_size_mm: 20, alloy_grade: "CR_V", list_price_cents: 1500, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku2: $.data.id, created_moved: $.data.created_at }
            - call: "PATCH /toolworks/tool-skus/${sku1}"
              payload: { list_price_cents: 3900 }
              as: ChannelManager
              captures: { updated_moved: $.data.updated_at, still_created: $.data.created_at }
          assert:
            - "created_default == '2026-08-01T00:00:00Z' — the documented default with no clock call at all"
            - "created_moved == '2026-09-15T12:30:00Z'"
            - "The PATCH sets ToolSku.${sku1}.updated_at to '2026-09-15T12:30:00Z' while created_at stays '2026-08-01T00:00:00Z'"
            - "The clock endpoint itself creates no entity and is the only endpoint that does not require a business role beyond PlatformAdmin"

      - name: every_top_level_collection_read_is_paginated_and_filterable
        claim_type: listing
        grounds:
          - endpoints[GET /toolworks/production-lots]
          - endpoints[GET /toolworks/test-runs]
          - endpoints[GET /toolworks/heat-treat-furnaces]
          - endpoints[GET /toolworks/salt-spray-chambers]
          - endpoints[GET /toolworks/furnace-campaigns]
          - endpoints[GET /toolworks/pack-configurations]
          - endpoints[GET /toolworks/warranty-programs]
          - endpoints[GET /toolworks/claimants]
          - endpoints[GET /toolworks/counterfeit-reports]
          - endpoints[GET /toolworks/tool-skus/{id}/counterfeit-reports]
        distinguishing_aspect: "Each top-level collection accepts its own declared filter set and rejects nothing else silently: a filter that matches no row returns an empty data array with total_count 0 rather than the unfiltered set, and offset paging past the end returns an empty page with has_more false while total_count still reports the full population."
        test_recipe:
          setup:
            - "Two SKUs (BRANDED WRENCH, PROFESSIONAL SOCKET), one furnace, one chamber, two lots on the first SKU (one still FORGED, one advanced to HEAT_TREATED via a COMPLETED campaign), one SCHEDULED HARDNESS run, one DRAFT RETAIL_DISPLAY pack, one programme, one CONSUMER claimant and one OPEN counterfeit report on the first SKU."
