# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_3143
#
# Chain anchors. Every `&k_*` below is a single structured call MAPPING, bound
# on its first appearance and reused with `*k_*` in later chains. YAML anchors
# are document-scoped, so a `captures:` binding made in an anchor is in scope
# for every instance that lists that anchor — every `${var}` below is bound by
# an anchor listed earlier in the same instance.
#
#   k_clock      logical clock -> 2026-06-01T00:00:00Z
#   k_meth_main  seven-measure reference methodology (M_MAIN)
#   k_meth_b0    three-measure baseline methodology (M_B0)
#   k_meth_mg    four-measure methodology (M_MG)
#   k_hp0        hospital P0
#   k_pin_b0     pin P0 to M_B0
#   k_pin_bonus  pin P0 to M_MG
#   k_hp1        hospital P1
#   k_pin_p1_main pin P1 to M_MAIN
#   k_rc_b0      release cycle bound to M_B0
#   k_rc_main    release cycle bound to M_MAIN
#   k_rc_mg      release cycle bound to M_MG
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: domain_rollup_measure_first_rounding_pair
        grounds:
          - calculations.domain_measure_rollup
          - calculations.composite_score
          - entities.HospitalMeasureSet.fields.readiness_state
        distinguishing_aspect: |
          A second valid reading rounds only the domain mean and never the
          per-measure converted value, so INFECTION_PREVENTION reads 83.15
          against the pinned 83.13 and the composite reads 60.41 against the
          pinned 60.38 — a NESTED-ROUNDING ambiguity on the HospitalMeasureSet
          domain, which is a different entity domain from the CPOE
          order-of-operations ambiguity the second instance carries.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital P1 is pinned to M_MAIN and has submitted all seven reference measures with 600 completed responses a year before submission, so verification lands on cycle 0 and reliability_weight is 1.0000."
          setup_api_calls:
            - &k_clock
              call: "POST /hospital-safety-rating/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RatingAdmin
            - &k_meth_main
              call: "POST /hospital-safety-rating/methodology-versions"
              payload:
                label: "Main Methodology"
                publication_date: "2026-05-01T00:00:00Z"
                measure_definitions:
                  - { measure_code: "psi90_value", domain: "PATIENT_SAFETY", scale_factor: 100.0, weight: 0.30, multiplier: 1.00, peer_mean: 55.00, peer_sd: 12.00, higher_is_better: true, derivation_rule: "RATE_TO_COUNT_FLOOR" }
                  - { measure_code: "hai_cdiff_value", domain: "INFECTION_PREVENTION", scale_factor: 100.0, weight: 0.20, multiplier: 0.80, peer_mean: 50.00, peer_sd: 14.00, higher_is_better: false, derivation_rule: "NONE" }
                  - { measure_code: "hai_mrsa_value", domain: "INFECTION_PREVENTION", scale_factor: 100.0, weight: 0.20, multiplier: 0.80, peer_mean: 50.00, peer_sd: 14.00, higher_is_better: false, derivation_rule: "NONE" }
                  - { measure_code: "hai_clabsi_value", domain: "INFECTION_PREVENTION", scale_factor: 100.0, weight: 0.20, multiplier: 0.80, peer_mean: 50.00, peer_sd: 14.00, higher_is_better: false, derivation_rule: "NONE" }
                  - { measure_code: "cpoe_order_entry_value", domain: "CPOE", scale_factor: 100.0, weight: 0.15, multiplier: 1.50, peer_mean: 60.00, peer_sd: 15.00, higher_is_better: true, derivation_rule: "NONE" }
                  - { measure_code: "staffing_rn_hppd_value", domain: "STAFFING", scale_factor: 10.0, weight: 0.25, multiplier: 1.00, peer_mean: 48.00, peer_sd: 13.00, higher_is_better: true, derivation_rule: "NONE" }
                  - { measure_code: "surgical_volume_value", domain: "SURGICAL_VOLUME", scale_factor: 5.00, weight: 0.10, multiplier: 0.75, peer_mean: 52.00, peer_sd: 16.00, higher_is_better: true, derivation_rule: "NONE" }
              as: RatingAdmin
              captures: { meth_main_id: $.data.id }
            - &k_meth_b0
              call: "POST /hospital-safety-rating/methodology-versions"
              payload:
                label: "Baseline Methodology"
                publication_date: "2026-05-01T00:00:00Z"
                measure_definitions:
                  - { measure_code: "o1", domain: "PATIENT_SAFETY", scale_factor: 1.0, weight: 1.00, multiplier: 1.00, peer_mean: 50.00, peer_sd: 10.00, higher_is_better: true, derivation_rule: "NONE" }
                  - { measure_code: "o2", domain: "CPOE", scale_factor: 1.0, weight: 1.00, multiplier: 1.00, peer_mean: 50.00, peer_sd: 10.00, higher_is_better: true, derivation_rule: "NONE" }
                  - { measure_code: "o3", domain: "STAFFING", scale_factor: 1.0, weight: 1.00, multiplier: 1.00, peer_mean: 50.00, peer_sd: 10.00, higher_is_better: true, derivation_rule: "NONE" }
              as: RatingAdmin
              captures: { meth_b0_id: $.data.id }
            - &k_meth_mg
              call: "POST /hospital-safety-rating/methodology-versions"
              payload:
                label: "Measure-Grade Methodology"
                publication_date: "2026-05-01T00:00:00Z"
                measure_definitions:
                  - { measure_code: "o1", domain: "PATIENT_SAFETY", scale_factor: 1.0, weight: 0.50, multiplier: 1.00, peer_mean: 50.00, peer_sd: 10.00, higher_is_better: true, derivation_rule: "NONE" }
                  - { measure_code: "o2", domain: "CPOE", scale_factor: 1.0, weight: 0.30, multiplier: 1.00, peer_mean: 50.00, peer_sd: 10.00, higher_is_better: true, derivation_rule: "NONE" }
                  - { measure_code: "o3", domain: "STAFFING", scale_factor: 1.0, weight: 0.20, multiplier: 1.00, peer_mean: 50.00, peer_sd: 10.00, higher_is_better: true, derivation_rule: "NONE" }
                  - { measure_code: "o4", domain: "SURGICAL_VOLUME", scale_factor: 1.0, weight: 0.10, multiplier: 1.00, peer_mean: 50.00, peer_sd: 10.00, higher_is_better: true, derivation_rule: "NONE" }
              as: RatingAdmin
              captures: { meth_mg_id: $.data.id }
            - &k_hp0
              call: "POST /hospital-safety-rating/hospitals"
              payload: { name: "P0 Regional Medical Center", ccn: "260001", state_code: "MO", bed_count: 100, teaching_status: "NON_TEACHING", annual_discharges: 2000, survey_contact_email: "p0@example.org" }
              as: RatingAdmin
              captures: { p0_id: $.data.id, p0_v0: $.data.version }
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_b0_id}" }
              as: RatingAdmin
            - &k_hp1
              call: "POST /hospital-safety-rating/hospitals"
              payload: { name: "P1 Regional Medical Center", ccn: "260002", state_code: "MO", bed_count: 100, teaching_status: "NON_TEACHING", annual_discharges: 2000, survey_contact_email: "p1@example.org" }
              as: RatingAdmin
              captures: { p1_id: $.data.id, p1_v0: $.data.version }
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_main_id}" }
              as: RatingAdmin
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "SOURCE_DOCUMENT" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/survey-measures"
              payload: { survey_id: "${s1_id}", measure_code: "psi90_value", raw_value: 1.0200, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/survey-measures"
              payload: { survey_id: "${s1_id}", measure_code: "hai_cdiff_value", raw_value: 0.8000, source_program_id: "NHSN" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/survey-measures"
              payload: { survey_id: "${s1_id}", measure_code: "hai_mrsa_value", raw_value: 0.7494, source_program_id: "NHSN" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/survey-measures"
              payload: { survey_id: "${s1_id}", measure_code: "hai_clabsi_value", raw_value: 0.9452, source_program_id: "NHSN" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/survey-measures"
              payload: { survey_id: "${s1_id}", measure_code: "cpoe_order_entry_value", raw_value: 0.9500, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/survey-measures"
              payload: { survey_id: "${s1_id}", measure_code: "staffing_rn_hppd_value", raw_value: 3.7400, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/survey-measures"
              payload: { survey_id: "${s1_id}", measure_code: "surgical_volume_value", raw_value: 0.0000, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/surveys/${s1_id}/submit"
              payload: {}
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/surveys/${s1_id}/verify"
              payload: { verification_response: "ACCEPT" }
              as: VerificationAnalyst
              as_user_id: "va-owen"
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/refresh-measures"
              payload: { expected_hospital_version: "${p1_v0}" }
              as: RatingEngine
              captures: { ms1_id: $.data.id, p1_v1: $.data.version }
          trigger:
            - call: "GET /hospital-safety-rating/hospitals/${p1_id}/composite-preview"
              payload: { methodology_version_id: "${meth_main_id}" }
              as: AnyAuthenticated
              as_user_id: "va-owen"
              captures: { preview: $.data.composite_score }
          assert:
            - "the pinned INFECTION_PREVENTION domain score is 83.13"
            - "the alternate reading, which rounds only at the domain level, reports 83.15"
            - "the pinned domain scores are PATIENT_SAFETY 102.00, INFECTION_PREVENTION 83.13, CPOE 95.00, STAFFING 37.40, SURGICAL_VOLUME 0.00"
            - "the pinned composite_score is 60.38 and the alternate reading yields 60.41"
            - "the two readings disagree on the domain array itself, so the divergence is observable before it reaches the composite"

      - name: cpoe_standardized_order_of_operations_pair
        grounds:
          - calculations.composite_score
          - state_machines.ScoreRun.RUNNING_to_SCORED
          - entities.ScoreRun.fields.composite_score
        distinguishing_aspect: |
          A second valid reading standardizes the CPOE term AFTER dividing by
          the retained effective-weight sum rather than before multiplying by
          the weight and multiplier, so the CPOE contribution and the
          composite diverge from the pinned order — a CONDITIONAL BRANCH
          ORDER ambiguity on the ScoreRun domain, which is a different entity
          domain from the HospitalMeasureSet rounding ambiguity the first
          instance carries.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital P1 scores 60.38 under M_MAIN with one weighted CPOE term and reliability_weight 1.0000."
          setup_api_calls:
            - *k_clock
            - *k_meth_main
            - *k_meth_b0
            - *k_meth_mg
            - *k_hp0
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_b0_id}" }
              as: RatingAdmin
            - *k_hp1
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_main_id}" }
              as: RatingAdmin
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "SOURCE_DOCUMENT" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/survey-measures"
              payload: { survey_id: "${s1_id}", measure_code: "psi90_value", raw_value: 1.0200, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/survey-measures"
              payload: { survey_id: "${s1_id}", measure_code: "hai_cdiff_value", raw_value: 0.8000, source_program_id: "NHSN" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/survey-measures"
              payload: { survey_id: "${s1_id}", measure_code: "hai_mrsa_value", raw_value: 0.7494, source_program_id: "NHSN" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/survey-measures"
              payload: { survey_id: "${s1_id}", measure_code: "hai_clabsi_value", raw_value: 0.9452, source_program_id: "NHSN" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/survey-measures"
              payload: { survey_id: "${s1_id}", measure_code: "cpoe_order_entry_value", raw_value: 0.9500, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/survey-measures"
              payload: { survey_id: "${s1_id}", measure_code: "staffing_rn_hppd_value", raw_value: 3.7400, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/survey-measures"
              payload: { survey_id: "${s1_id}", measure_code: "surgical_volume_value", raw_value: 0.0000, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/surveys/${s1_id}/submit"
              payload: {}
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/surveys/${s1_id}/verify"
              payload: { verification_response: "ACCEPT" }
              as: VerificationAnalyst
              as_user_id: "va-owen"
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/refresh-measures"
              payload: { expected_hospital_version: "${p1_v0}" }
              as: RatingEngine
              captures: { p1_v1: $.data.version }
            - &k_rc_main
              call: "POST /hospital-safety-rating/release-cycles"
              payload: { label: "Main Methodology Grades", methodology_version_id: "${meth_main_id}", preliminary_release_date: "2026-06-01T00:00:00Z", correction_window_ends_at: "2026-06-30T00:00:00Z", publication_date: "2026-07-15T00:00:00Z" }
              as: RatingAdmin
              captures: { rc_main_id: $.data.id }
          trigger:
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/score-runs"
              payload: { methodology_version_id: "${meth_main_id}", release_cycle_id: "${rc_main_id}", expected_hospital_version: "${p1_v1}" }
              as: RatingEngine
              captures: { run1_id: $.data.id, run1_comp: $.data.composite_score, run1_letter: $.data.letter_grade }
          assert:
            - "the pinned composite_score is 60.38, with the CPOE term standardized before the weight and multiplier are applied"
            - "the alternate reading, which standardizes the CPOE term after the division by the retained effective-weight sum of 1.01, yields 60.41"
            - "the two readings differ by 0.03, so the CPOE order of operations is observable"
            - "ScoreRun.${run1_id}.letter_grade == D, because 60.38 sits in the 45.00-62.49 band"
            - "ScoreRun.${run1_id}.reliability_weight == 1.0000"

  # ===========================================================================
  # Rule 2 — combinatorial_formula
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: domain_rollup_nested_mean_of_rounded_measures
        grounds:
          - calculations.domain_measure_rollup
          - entities.MethodologyVersion.fields.measure_definitions
          - validations[priority=14]
        distinguishing_aspect: |
          Mode (b): the per-measure round nests inside the domain mean and the
          domain mean nests inside the composite, so pinning "round each
          measure to 1 dp, then each domain mean to 2 dp" changes
          INFECTION_PREVENTION from 83.13 to 83.15 and the composite from
          60.38 to 60.41 — a DIFFERENT MODE from the frozen-candidate-set
          evaluation order the second instance carries, which is mode (c).
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital P1 has submitted seven measures spanning all five domains and its set is READY."
          setup_api_calls:
            - *k_clock
            - *k_meth_main
            - *k_meth_b0
            - *k_meth_mg
            - *k_hp0
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_b0_id}" }
              as: RatingAdmin
            - *k_hp1
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_main_id}" }
              as: RatingAdmin
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "SOURCE_DOCUMENT" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/survey-measures"
              payload: { survey_id: "${s1_id}", measure_code: "psi90_value", raw_value: 1.0200, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/survey-measures"
              payload: { survey_id: "${s1_id}", measure_code: "hai_cdiff_value", raw_value: 0.8000, source_program_id: "NHSN" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/survey-measures"
              payload: { survey_id: "${s1_id}", measure_code: "hai_mrsa_value", raw_value: 0.7494, source_program_id: "NHSN" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/survey-measures"
              payload: { survey_id: "${s1_id}", measure_code: "hai_clabsi_value", raw_value: 0.9452, source_program_id: "NHSN" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/survey-measures"
              payload: { survey_id: "${s1_id}", measure_code: "cpoe_order_entry_value", raw_value: 0.9500, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/survey-measures"
              payload: { survey_id: "${s1_id}", measure_code: "staffing_rn_hppd_value", raw_value: 3.7400, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/survey-measures"
              payload: { survey_id: "${s1_id}", measure_code: "surgical_volume_value", raw_value: 0.0000, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/surveys/${s1_id}/submit"
              payload: {}
              as: HospitalRespondent
              as_user_id: "${p1_id}"
            - call: "POST /hospital-safety-rating/surveys/${s1_id}/verify"
              payload: { verification_response: "ACCEPT" }
              as: VerificationAnalyst
              as_user_id: "va-owen"
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/refresh-measures"
              payload: { expected_hospital_version: "${p1_v0}" }
              as: RatingEngine
              captures: { ms1_id: $.data.id, p1_v1: $.data.version }
          trigger:
            - call: "GET /hospital-safety-rating/hospitals/${p1_id}/composite-preview"
              payload: { methodology_version_id: "${meth_main_id}" }
              as: AnyAuthenticated
              as_user_id: "va-owen"
              captures: { preview: $.data.domain_scores }
          assert:
            - "the pinned INFECTION_PREVENTION domain score is 83.13"
            - "the INFECTION_PREVENTION domain score is NOT 83.15, because each converted measure is rounded to 1 dp before entering the bucket"
            - "PATIENT_SAFETY reads 102.00 because RATE_TO_COUNT_FLOOR maps 1.0200 to 1 first, then the scale factor applies"
            - "the composite_score is 60.38, not 60.41"

      - name: employer_propensity_frozen_candidate_set_order
        grounds:
          - calculations.employer_utilization_index
          - calculations.composite_score
          - entities.Employer.fields.eligible_hospital_count
        distinguishing_aspect: |
          Mode (c): the eligible-hospital set is selected by the letter band
          and each counted hospital's composite feeds the propensity
          indicator, so the total appears to depend on the set that depends on
          the total — the scaffold breaks the circularity by pinning the
          evaluation order as "select from the stored grades, freeze the set,
          then compute the indicator", never re-selecting after the indicator
          is known. This is a DIFFERENT MODE from the nested-rounding instance
          above, which is mode (b).
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Two of the four listed hospitals carry a published grade: P0 at a composite above the B cut-off and P1 below the D cut-off."
          setup_api_calls:
            - *k_clock
            - *k_meth_main
            - *k_meth_b0
            - *k_meth_mg
            - *k_hp0
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_b0_id}" }
              as: RatingAdmin
            - *k_hp1
            - call: "POST /hospital-safety-rating/hospitals/${p1_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_b0_id}" }
              as: RatingAdmin
            - &k_hp2c
              call: "POST /hospital-safety-rating/hospitals"
              payload: { name: "P2 Regional Medical Center", ccn: "260003", state_code: "MO", bed_count: 100, teaching_status: "NON_TEACHING", annual_discharges: 2000, survey_contact_email: "p2@example.org" }
              as: RatingAdmin
              captures: { p2_id: $.data.id, p2_v0: $.data.version }
            - &k_hp3c
              call: "POST /hospital-safety-rating/hospitals"
