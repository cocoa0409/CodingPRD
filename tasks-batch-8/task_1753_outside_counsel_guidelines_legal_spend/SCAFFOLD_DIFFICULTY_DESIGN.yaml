            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/rates"
              payload: { timekeeper_id: "${tk_id}", hourly_rate_cents: 100000 }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/submit"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/approve"
              payload: {}
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/matters"
              payload: { panel_firm_id: "${firm_id}", title: "M Fcst", budget_cents: 100000000 }
              as: LegalOpsReviewer
              captures: { matter_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/engage"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "GET /legal-departments/${dept_id}/matters/${matter_id}"
              payload: {}
              as: LegalOpsReviewer
              captures: { matter_v: $.data.version }
            - call: "PUT /legal-departments/${dept_id}/matters/${matter_id}/forecast"
              payload: { lifecycle_estimate_cents: 10000000 }
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/accruals"
              payload: { period_year: 2026, period_month: 8, amount_cents: 2000000 }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/accruals"
              payload: { period_year: 2026, period_month: 9, amount_cents: 3000000 }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/invoices"
              payload:
                invoice_number: "INV-F-1"
                billing_period_start: "2026-08-01T00:00:00Z"
                billing_period_end: "2026-09-01T00:00:00Z"
                expected_matter_version: "${matter_v}"
                line_items:
