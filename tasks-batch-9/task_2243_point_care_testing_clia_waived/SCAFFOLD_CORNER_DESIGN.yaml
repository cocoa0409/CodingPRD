              as: QualityCoordinator
              captures: { dev_status_1: $.data.status, dev_reason_1: $.data.qc_lock_reason }
          trigger:
            - call: "POST /poct/devices/${dev_id}/qc-unlock"
              payload: { confirming_qc_run_id: "${qc2_id}", note: "control repeated and in range" }
              as: QualityCoordinator
              captures: { err: $.data.error_id, msg: $.data.message }
            - call: "GET /poct/devices/${dev_id}"
              as: QualityCoordinator
              captures: { dev_status_2: $.data.status, dev_reason_2: $.data.qc_lock_reason }
            - call: "GET /poct/sites/${site_id}"
              as: QualityCoordinator
              captures: { creep_flag: $.data.scope_creep_flag }
          assert:
            - "${snap_mod} == \"MODERATE\" and ${snap_wv} == \"WAIVED\"; ${dev_status_0} == \"ACTIVE\" and ${qc2_result} == \"PASS\" and ${lot_state} == \"VERIFIED\""
            - "${certs_expired} == 1, ${creep_sites} == 1 and ${locked_devices} == 1 (the device is not QC-overdue on 2026-07-05: last pass 2026-06-15 + 30 days = 2026-07-15)"
            - "${dev_status_1} == \"QC_LOCKED\" and ${dev_reason_1} == \"CERTIFICATE_SCOPE\""
            - "the qc-unlock returns HTTP 409 with ${err} == \"ERR_INVALID_STATE\" and ${msg} mentions the scope lock"
            - "${dev_status_2} == \"QC_LOCKED\" and ${dev_reason_2} == \"CERTIFICATE_SCOPE\" - the refused action changed nothing"
            - "${creep_flag} == true"

      - name: coverage_create_requires_both_site_and_certificate_to_resolve
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /poct/certificate-coverages]
          - errors[ERR_SITE_NOT_FOUND]
          - errors[ERR_RESOURCE_NOT_FOUND]
          - calculations.certificate_coverage_overlap
        distinguishing_aspect: |
          The junction row needs BOTH ends to resolve, and the two dangling ends
          produce DIFFERENT 404 ids: the site FK has its own scoped id while the
          certificate FK falls back to the generic ERR_RESOURCE_NOT_FOUND. Only
          the fully resolved call creates the link and bumps covered_site_count.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "One ACTIVE WAIVED certificate and one site, not yet linked."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243037", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id, covered_0: $.data.covered_site_count }
            - call: "POST /poct/sites"
              payload: { name: "Occupational Health POCT", department_code: "DEPT-3000", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "6f1d0c2b-0000-4000-8000-00000000dead", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
              captures: { err_site: $.data.error_id, msg_site: $.data.message }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "6f1d0c2b-0000-4000-8000-00000000beef", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
              captures: { err_cert: $.data.error_id, msg_cert: $.data.message }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
              captures: { cov_id: $.data.id, cov_site: $.data.site_id, cov_cert: $.data.certificate_id, cov_snap: $.data.permitted_complexity_snapshot }
            - call: "GET /poct/certificates/${cert_id}"
              as: ProgramAdmin
              captures: { covered_1: $.data.covered_site_count }
            - call: "GET /poct/certificate-coverages?certificate_id=${cert_id}"
              as: Surveyor
              captures: { list_total: $.meta.total_count, list_first: "$.data[0].id" }
          assert:
            - "${covered_0} == 0"
            - "the dangling-site call returns HTTP 404 with ${err_site} == \"ERR_SITE_NOT_FOUND\""
            - "the dangling-certificate call returns HTTP 404 with ${err_cert} == \"ERR_RESOURCE_NOT_FOUND\" - a different id from the site case"
            - "the resolved call returns HTTP 201 with ${cov_site} == ${site_id}, ${cov_cert} == ${cert_id} and ${cov_snap} == \"WAIVED\""
            - "${covered_1} == 1 - only the successful link incremented the counter, so the two 404s had no side effect"
            - "${list_total} == 1 and ${list_first} == ${cov_id}"
            - "TestSite.${site_id}.oversight_posture == OPEN once the coverage exists"

      - name: action_endpoint_transition_and_side_effect_verification
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /poct/devices/{id}/qc-unlock]
          - state_machines.Device.QC_LOCKED_to_ACTIVE
        excluded_because:
          difficulty_instance: compensating_invariant / held_result_count_and_posture_restored_exactly_by_qc_unlock
          rationale: "The qc-unlock action endpoint is driven end to end there: the transition fires, every held result is released and the site counters return to their pre-lock values."

  # ===========================================================================
  # Section 6 - Errors (claim-extraction-guide "From Table 6")
  # Every one of the 41 catalogued error ids must be triggerable. The ten ids
  # already driven by §1.8 instances are recorded here as excluded_because stubs
  # so the catalogue is provably covered without duplicating those scenarios.
  # ===========================================================================
  - section: errors
    instances:

      - name: not_found_family_returns_scoped_404_error_ids
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SITE_NOT_FOUND]
          - errors[ERR_OPERATOR_NOT_FOUND]
          - errors[ERR_DEVICE_NOT_FOUND]
          - errors[ERR_REAGENT_LOT_NOT_FOUND]
          - errors[ERR_RESOURCE_NOT_FOUND]
          - validations[priority:10]
          - validations[priority:14]
        distinguishing_aspect: |
          Four entities own a scoped 404 id (site, operator, device, reagent lot)
          while every other entity - including Inspection and CliaCertificate -
          falls through priority 14 to the generic ERR_RESOURCE_NOT_FOUND. The
          claim is that the ids are NOT interchangeable.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z; the store is empty, so every UUID below is unknown."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /poct/sites/6f1d0c2b-0000-4000-8000-000000000001"
              as: QualityCoordinator
              captures: { e_site: $.data.error_id, m_site: $.data.message }
            - call: "GET /poct/operators/6f1d0c2b-0000-4000-8000-000000000002"
              as: QualityCoordinator
              captures: { e_op: $.data.error_id, m_op: $.data.message }
            - call: "GET /poct/devices/6f1d0c2b-0000-4000-8000-000000000003"
              as: QualityCoordinator
              captures: { e_dev: $.data.error_id, m_dev: $.data.message }
            - call: "GET /poct/reagent-lots/6f1d0c2b-0000-4000-8000-000000000004"
              as: QualityCoordinator
              captures: { e_lot: $.data.error_id, m_lot: $.data.message }
            - call: "GET /poct/inspections/6f1d0c2b-0000-4000-8000-000000000005"
              as: Surveyor
              captures: { e_insp: $.data.error_id, m_insp: $.data.message }
            - call: "GET /poct/certificates/6f1d0c2b-0000-4000-8000-000000000006"
              as: ProgramAdmin
              captures: { e_cert: $.data.error_id, m_cert: $.data.message }
          assert:
            - "all six calls return HTTP 404"
            - "${e_site} == \"ERR_SITE_NOT_FOUND\", ${e_op} == \"ERR_OPERATOR_NOT_FOUND\", ${e_dev} == \"ERR_DEVICE_NOT_FOUND\", ${e_lot} == \"ERR_REAGENT_LOT_NOT_FOUND\""
            - "${e_insp} == \"ERR_RESOURCE_NOT_FOUND\" and ${e_cert} == \"ERR_RESOURCE_NOT_FOUND\" - no scoped id exists for Inspection or CliaCertificate"
            - "each message is a non-empty string and every response carries an error_id/message envelope"

      - name: auth_family_separates_unknown_role_401_from_forbidden_role_403
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHORIZED]
          - validations[priority:1]
          - validations[priority:2]
        distinguishing_aspect: |
          A role string outside the five declared roles is an AUTHENTICATION
          failure (401 at priority 1), not an authorisation one; a declared role
          that is simply absent from the endpoint's roles list is 403 at priority
          2. Both precede every existence check, so a 401 is returned even when
          the target id does not exist.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z; one site and one operator so the Operator role resolves to a real row."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/sites"
              payload: { name: "Endoscopy POCT", department_code: "DEPT-3100", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Bea Ferraro", role_title: "NURSE", hire_date: "2026-01-05" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
          trigger:
            - call: "GET /poct/sites/${site_id}"
              as: Auditor
              captures: { e_401: $.data.error_id, m_401: $.data.message }
            - call: "GET /poct/sites/6f1d0c2b-0000-4000-8000-0000000000ff"
              as: Auditor
              captures: { e_401b: $.data.error_id, m_401b: $.data.message }
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243038", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { e_403: $.data.error_id, m_403: $.data.message }
          assert:
            - "the first call returns HTTP 401 with ${e_401} == \"ERR_UNAUTHENTICATED\" (\"Auditor\" is not one of ProgramAdmin, LabDirector, QualityCoordinator, Surveyor, Operator)"
            - "the second call ALSO returns HTTP 401 with ${e_401b} == \"ERR_UNAUTHENTICATED\", not 404 - priority 1 precedes priority 10"
            - "the third call returns HTTP 403 with ${e_403} == \"ERR_UNAUTHORIZED\" (POST /poct/certificates is ProgramAdmin-only)"
            - "no CliaCertificate row exists afterwards: GET /poct/certificates/{any} still 404s and certificate_number 45D2243038 remains available"

      - name: suspending_an_already_suspended_certificate_returns_certificate_not_active
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CERTIFICATE_NOT_ACTIVE]
          - validations[priority:40]
          - state_machines.CliaCertificate
        distinguishing_aspect: |
          The second suspend is a no-edge transition, so ERR_INVALID_STATE looks
          plausible - but priority 40 runs ten steps earlier and owns the
          certificate-status check, so ERR_CERTIFICATE_NOT_ACTIVE is returned and
          the CASCADE-B side effects do not run twice.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "One ACTIVE certificate covering one site with one trained operator, then the certificate is suspended once (CASCADE-B runs)."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243039", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id, cert_v0: $.data.version }
            - call: "POST /poct/sites"
              payload: { name: "Dialysis POCT", department_code: "DEPT-3200", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/certificates/${cert_id}/suspend"
              payload: { reason: "CMS notice of proposed suspension" }
              as: ProgramAdmin
              captures: { cert_status_1: $.data.status, cert_v1: $.data.version, cert_reason: $.data.suspension_reason }
          trigger:
            - call: "POST /poct/certificates/${cert_id}/suspend"
              payload: { reason: "duplicate entry of the same CMS notice" }
              as: ProgramAdmin
              captures: { err: $.data.error_id, msg: $.data.message }
            - call: "GET /poct/certificates/${cert_id}"
              as: ProgramAdmin
              captures: { cert_status_2: $.data.status, cert_v2: $.data.version, cert_reason_2: $.data.suspension_reason }
          assert:
            - "${cert_status_1} == \"SUSPENDED\", ${cert_v1} == ${cert_v0} + 1 and ${cert_reason} == \"CMS notice of proposed suspension\""
            - "HTTP status is 409"
            - "${err} == \"ERR_CERTIFICATE_NOT_ACTIVE\" (NOT ERR_INVALID_STATE - priority 40 precedes priority 50)"
            - "${cert_status_2} == \"SUSPENDED\", ${cert_v2} == ${cert_v1} (no version bump on the refused call) and ${cert_reason_2} is still the FIRST reason"
            - "TestSite.${site_id}.oversight_posture == SUSPENDED from the single CASCADE-B pass"

      - name: coverage_window_outside_certificate_window_returns_422
        claim_type: error_triggerable
        grounds:
          - errors[ERR_COVERAGE_OUTSIDE_CERTIFICATE_WINDOW]
          - validations[priority:58]
        distinguishing_aspect: |
          Containment is checked on BOTH endpoints independently: a coverage
          starting one day before the certificate's effective_date fails, and so
          does one ending one day after its expiration_date, while the exactly
          coincident window is accepted (inclusive containment, not strict).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "Certificate in force 2026-01-01..2026-12-31 and one site with no coverage yet."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243040", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Sleep Lab POCT", department_code: "DEPT-3300", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2025-12-31", coverage_end: "2026-06-30" }
              as: ProgramAdmin
              captures: { e_low: $.data.error_id, m_low: $.data.message }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-07-01", coverage_end: "2027-01-01" }
              as: ProgramAdmin
              captures: { e_high: $.data.error_id, m_high: $.data.message }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
              captures: { cov_id: $.data.id, cov_start: $.data.coverage_start, cov_end: $.data.coverage_end }
          assert:
            - "both refused calls return HTTP 422 with ${e_low} == \"ERR_COVERAGE_OUTSIDE_CERTIFICATE_WINDOW\" and ${e_high} == \"ERR_COVERAGE_OUTSIDE_CERTIFICATE_WINDOW\""
            - "the coincident window is accepted with HTTP 201, ${cov_start} == \"2026-01-01\" and ${cov_end} == \"2026-12-31\""
            - "GET /poct/certificate-coverages?site_id=${site_id} returns meta.total_count == 1 - neither 422 persisted a row, so the third call could not collide at priority 67"
            - "CliaCertificate.${cert_id}.covered_site_count == 1"

      - name: qc_run_against_quarantined_lot_returns_lot_quarantined
        claim_type: error_triggerable
        grounds:
          - errors[ERR_LOT_QUARANTINED]
          - validations[priority:43]
          - state_machines.ReagentLot
        distinguishing_aspect: |
          A quarantined lot is refused at priority 43 with a 409 BEFORE the
          expiry check at 54 and before the 422 family; the lot is unexpired and
          was VERIFIED a moment earlier, so only the excursion-driven quarantine
          can explain the error.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "Covered site, trained operator, device GLUCO-9, storage unit 2.0..8.0 C, lot VERIFIED by LEVEL_1 + LEVEL_2 PASS runs."
            - "A 9.5 C reading opens an excursion, so CASCADE-C quarantines the lot and locks the device with LOT_QUARANTINE."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243041", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Urgent Care POCT", department_code: "DEPT-3400", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Cal Duarte", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-01-05" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /poct/operators/${op_id}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-08-20" }
              as: QualityCoordinator
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GLUCO-9", serial_number: "SN-GL-3400", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "INTERFACED", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_id}", name: "Reagent Fridge 1", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
