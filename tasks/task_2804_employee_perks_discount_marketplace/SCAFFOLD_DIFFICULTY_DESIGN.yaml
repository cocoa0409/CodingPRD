  # ==========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: dispute_reversal_and_goodwill_credit_return_the_redemption_ledger_to_zero
        grounds:
          - entities.LedgerEntry.fields.entry_type
          - entities.LedgerEntry.fields.amount_cents
          - state_machines.Redemption.fulfillment_status.DISPUTED_to_REFUNDED
          - state_machines.Dispute.status.MERCHANT_RESPONDED_to_RESOLVED_MERCHANT_FAULT
          - calculations.redemption_line_economics
          - entities.Merchant.fields.accrued_commission_payable_cents
          - entities.Employer.fields.accrued_share_cents
        distinguishing_aspect: |
          The conserved quantity is MONEY: after a merchant-fault resolution that also grants a
          500-cent goodwill credit, the redemption's six LedgerEntry rows sum to exactly 0
          (+806 -202 -806 +202 -500 +500), so the compensation is complete with no residual
          drift, while the two derived balances land on their own compensated values -
          Employer.accrued_share_cents back to 0 and
          Merchant.accrued_commission_payable_cents at 500 because DISPUTE_CREDIT is outside
          the merchant's payable set but DISPUTE_CREDIT_RECOVERY is inside it.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; the full merchant/agreement/employer/offer chain is built with commission 1200 bps, share 2500 bps and revenue_share_enabled true, and the program is LIVE."
            - "One redemption is created and verified at a gross of 8396 cents, which produces discount 1679, net 6717, commission 806, employer share 202 and provider net 604, plus the first two ledger rows."
            - "The employee disputes it and the platform resolves MERCHANT_FAULT with outcome_credit_cents 500, which is well inside the 6717 net so the credit ceiling never bites."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { merchant_id: $.data.id }
            - call: "POST /perks/agreements"
              payload: { merchant_id: "${merchant_id}", category: "DINING", region_code: "CA" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { agreement_id: $.data.id, agreement_v0: $.data.version }
            - call: "POST /perks/agreements/${agreement_id}/propose"
              payload: { expected_agreement_version: "${agreement_v0}", commission_rate_bps: 1200, placement_fee_base_cents: 36000, employer_revenue_share_bps: 2500 }
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /perks/agreements/${agreement_id}/decide"
              payload: { decision: "ACCEPT" }
              as: Merchant
              as_user_id: "${merchant_id}"
            - call: "POST /perks/agreements/${agreement_id}/activate"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /perks/employers"
