  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: auction_pause_resume_cycle
        grounds:
          - state_machines.Auction.CLOCK_ACTIVE_to_CLOCK_PAUSED
          - state_machines.Auction.CLOCK_PAUSED_to_CLOCK_ACTIVE
        distinguishing_aspect: |
          Non-linear cycle on the AUCTION entity: CLOCK_ACTIVE -> CLOCK_PAUSED -> CLOCK_ACTIVE.
          While paused, bid placement is rejected by the auction-state gate even though the
          round is OPEN; after resume the identical bid succeeds — proving the cycle is real
          and state-gated, not a one-way pipeline.
        test_recipe:
          setup:
            - "Single-product plan (PEA002 / CATEGORY_A supply 2); one QUALIFIED rural applicant with 10,000,000 eligibility units; auction CLOCK_ACTIVE with round 1 OPEN"
          setup_api_calls:
            - *c_clock0
            - *c_plan
            - *c_area_y
            - *c_block_a
            - *c_publish
            - *c_auction
            - *c_open
            - *c_applicant_rural
            - *c_upfront_rural
            - *c_review_rural
            - *c_qualify_rural
            - *c_clock_quiet
            - *c_begin_quiet
            - *c_start_clock
            - *c_get_rounds
            - call: "POST /spectrum-auctions/auctions/${auction_id}/phase"
              payload: { action: "PAUSE_CLOCK" }
              as: AuctionAdmin
          trigger:
            - call: "GET /spectrum-auctions/auctions/${auction_id}"
              payload: {}
              as: AuctionAdmin
              captures: { paused_status: "$.data.status" }
            - call: "POST /spectrum-auctions/rounds/${r1_id}/bids"
              payload: { area_code: "PEA002", category: "CATEGORY_A", quantity: 1 }
              as: Bidder
              as_user_id: "${r_id}"
              captures: { paused_bid_err: "$.data.error_id" }
            - call: "POST /spectrum-auctions/auctions/${auction_id}/phase"
              payload: { action: "RESUME_CLOCK" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/rounds/${r1_id}/bids"
              payload: { area_code: "PEA002", category: "CATEGORY_A", quantity: 1 }
              as: Bidder
              as_user_id: "${r_id}"
              captures: { bid_ok: "$.data.id" }
          assert:
            - "paused_status == CLOCK_PAUSED"
            - "paused_bid_err == ERR_AUCTION_INVALID_STATE (the round is OPEN; the AUCTION state gate fires)"
            - "after RESUME_CLOCK: Auction.${auction_id}.status == CLOCK_ACTIVE"
            - "Bid.${bid_ok}.status == SUBMITTED and units_snapshot == 5000000 (10 MHz * 500,000 pop)"

      - name: applicant_correction_loop
        grounds:
          - state_machines.Applicant.UNDER_REVIEW_to_NEEDS_CORRECTION
          - state_machines.Applicant.NEEDS_CORRECTION_to_UNDER_REVIEW
        distinguishing_aspect: |
          Non-linear cycle on the APPLICANT entity: UNDER_REVIEW -> NEEDS_CORRECTION ->
          UNDER_REVIEW -> QUALIFIED, with an OCC-guarded disclosure edit inside the loop.
          Distinct entity and distinct cycle semantics from auction_pause_resume_cycle.
        test_recipe:
          setup:
            - "Auction APPLICATION_OPEN; applicant K submitted with ownership [{A,60},{B,40}] claiming small business"
          setup_api_calls:
            - *c_clock0
            - *c_plan
            - *c_area_y
            - *c_block_a
            - *c_publish
            - *c_auction
            - *c_open
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "Kappa Radio", claims_small_business: true, claims_rural_credit: false, own_annual_revenue_cents: 0, service_population: 0, ownership_interests: [{ holder_name: "A", stake_pct: 60, holder_annual_revenue_cents: 0 }, { holder_name: "B", stake_pct: 40, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { k_id: "$.data.id", k_v0: "$.data.version" }
            - call: "POST /spectrum-auctions/applicants/${k_id}/upfront-payments"
              payload: { amount_cents: 25000000000 }
              as: Bidder
              as_user_id: "${k_id}"
            - call: "POST /spectrum-auctions/applicants/${k_id}/review"
              payload: { action: "START_REVIEW" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/applicants/${k_id}/review"
              payload: { action: "REQUEST_CORRECTION" }
              as: AuctionAdmin
              captures: { k_v_corr: "$.data.version" }
          trigger:
            - call: "PATCH /spectrum-auctions/applicants/${k_id}/disclosure"
              payload: { expected_applicant_version: "${k_v_corr}", ownership_interests: [{ holder_name: "A", stake_pct: 70, holder_annual_revenue_cents: 0 }, { holder_name: "B", stake_pct: 30, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              as_user_id: "${k_id}"
              captures: { k_v_patched: "$.data.version" }
            - call: "POST /spectrum-auctions/applicants/${k_id}/resubmit"
              payload: { expected_applicant_version: "${k_v_patched}" }
              as: Bidder
              as_user_id: "${k_id}"
              captures: { k_v_resub: "$.data.version" }
            - call: "POST /spectrum-auctions/applicants/${k_id}/review"
              payload: { action: "QUALIFY" }
              as: AuctionAdmin
          assert:
            - "k_v0 == 1 (creation)"
            - "after REQUEST_CORRECTION: status NEEDS_CORRECTION and k_v_corr == k_v0 + 2 (two mutations: START_REVIEW, REQUEST_CORRECTION)"
            - "after PATCH: k_v_patched == k_v_corr + 1 (OCC happy path consumed the fresh version)"
            - "after resubmit: status UNDER_REVIEW and k_v_resub == k_v_patched + 1"
            - "after QUALIFY: Applicant.${k_id}.status == QUALIFIED, credit_pct == 35, attributable_revenue_cents == 0, eligibility_units == 10000000"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: final_milestone_miss_terminates_license_cascade
        grounds:
          - state_machines.BuildoutMilestone.PENDING_to_MISSED
          - state_machines.License.ACTIVE_to_TERMINATED
          - state_machines.TransferApplication.UNDER_REVIEW_to_DENIED
          - entities.Auction.fields.available_supply
        distinguishing_aspect: |
          Depth-3 cascade triggered by a CLOCK SWEEP (not a user action): FINAL milestone MISSED
          mutates License -> TERMINATED; that termination itself (hop 2) denies the pending
          TransferApplication AND restores Auction.available_supply. Distinct trigger and chain
          from the disqualification cascade.
        test_recipe:
          setup:
            - "Rural applicant wins CATEGORY_A@PEA002 qty 1 (net 212,500,000); assignment bid 0; no incumbents in PEA002"
            - "License settled in full at 2026-10-01 (ACTIVE; grant_date 2026-10-01); INTERIM and FINAL milestones PENDING"
            - "A FULL_ASSIGNMENT transfer to a second (never-qualified) applicant is UNDER_REVIEW"
            - "available_supply for the product is 1 (one of two licenses granted)"
          setup_api_calls:
            - *c_clock0
            - *c_plan
            - *c_area_y
            - *c_block_a
            - *c_publish
            - *c_auction
            - *c_open
            - *c_applicant_rural
            - *c_upfront_rural
            - *c_review_rural
            - *c_qualify_rural
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "Transferee Co", claims_small_business: false, claims_rural_credit: false, own_annual_revenue_cents: 0, service_population: 0, ownership_interests: [{ holder_name: "T Owner", stake_pct: 100, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { t_id: "$.data.id" }
            - *c_clock_quiet
            - *c_begin_quiet
            - *c_start_clock
            - *c_get_rounds
            - *c_bid_rural_a_y
            - *c_close_r1
            - call: "POST /spectrum-auctions/auctions/${auction_id}/assignment-bids"
              payload: { area_code: "PEA002", category: "CATEGORY_A", amount_cents: 0 }
              as: Bidder
              as_user_id: "${r_id}"
            - *c_complete
            - call: "GET /spectrum-auctions/licenses"
              payload: { holder_applicant_id: "${r_id}" }
              as: AuctionAdmin
              captures: { lic_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/licenses/${lic_id}/settlement-payments"
              payload: { amount_cents: 212500000 }
              as: Bidder
              as_user_id: "${r_id}"
            - call: "GET /spectrum-auctions/licenses/${lic_id}/buildout-milestones"
              payload: {}
              as: AuctionAdmin
              captures: { ms_interim: "$.data[0].id", ms_final: "$.data[1].id" }
            - call: "POST /spectrum-auctions/licenses/${lic_id}/transfer-applications"
              payload: { transfer_type: "FULL_ASSIGNMENT", transferee_applicant_id: "${t_id}" }
              as: Bidder
              as_user_id: "${r_id}"
              captures: { ta_id: "$.data.id" }
            - call: "POST /spectrum-auctions/transfer-applications/${ta_id}/review"
              payload: { action: "BEGIN_REVIEW" }
              as: TransferReviewer
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2032-09-30T00:00:00Z" }
              as: AuctionAdmin
            - call: "GET /spectrum-auctions/licenses/${lic_id}"
              payload: {}
              as: AuctionAdmin
            - call: "GET /spectrum-auctions/transfer-applications/${ta_id}"
              payload: {}
              as: TransferReviewer
            - call: "GET /spectrum-auctions/auctions/${auction_id}"
              payload: {}
              as: AuctionAdmin
          assert:
            - "BuildoutMilestone.${ms_interim}.status == MISSED (due grant+1095d, passed earlier in the sweep)"
            - "BuildoutMilestone.${ms_final}.status == MISSED (its due_date was accelerated 365 days earlier by the INTERIM miss, then passed)"
            - "License.${lic_id}.status == TERMINATED (hop 1: FINAL MISSED -> license terminated)"
            - "TransferApplication.${ta_id}.status == DENIED (hop 2: the license termination, not the clock, denies the pending transfer)"
            - "Auction.${auction_id}.available_supply entry (PEA002, CATEGORY_A).available == 2 (hop 2: supply restored from 1 to supply_per_area)"
            - "License.${lic_id}.paid_cents == 212500000 remains recorded (termination does not rewrite settlement history)"

      - name: disqualify_voids_bids_recomputes_demand
        grounds:
          - state_machines.Applicant.QUALIFIED_to_DISQUALIFIED
          - state_machines.Bid.SUBMITTED_to_VOIDED
          - entities.ClockRound.fields.aggregate_demand
          - entities.Auction.fields.forfeited_deposits_cents
