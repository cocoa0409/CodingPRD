            - { call: "POST /tlo/_clock/set_current_utc", payload: { to_iso8601: "2027-01-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /tlo/licenses/${lic_id}/declare-default", payload: { reason: "Milestone now overdue" }, as: LicensingManager, captures: { st: "$.data.status" } }
          assert:
