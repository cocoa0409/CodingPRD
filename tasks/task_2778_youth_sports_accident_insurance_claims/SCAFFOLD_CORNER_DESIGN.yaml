        excluded_because:
          difficulty_instance: transitive_cascade / cascade_b_catastrophic_payment_exhausts_lifetime_and_rejects_pending_report
          rationale: "That instance fills the base layer to its per-injury limit before any catastrophic amount is allocated and asserts the remainder capped by the remaining lifetime maximum."

