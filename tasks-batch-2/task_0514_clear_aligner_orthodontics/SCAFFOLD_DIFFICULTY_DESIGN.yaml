scaffold_difficulty_design:
  # ───────────────────────────────────────────────────────────────────────────
  # Rule 1 — Dual-variant calculations across different entity domains
  # ───────────────────────────────────────────────────────────────────────────
  - rule_id: dual_variant_calc
    instances:
      - name: refund_amount_eligibility_vs_patient_cancel_diverge
        grounds:
          - calculations.refund_amount
          - state_machines.RefundRequest.OPEN_to_APPROVED
          - entities.RefundRequest.fields.computed_refund_cents
          - entities.RefundRequest.fields.restocking_fee_cents
        distinguishing_aspect: |
          On the RefundRequest/TreatmentCase domain: a PATIENT_CANCEL refund withholds
          pro-rata consumed value of shipped first-run steps plus a flat RESTOCK_FEE,
          so for the SAME amount_collected (340000) it yields 247500 with a 7500 fee,
          strictly less than the ELIGIBILITY_DECLINE variant's full-collected, zero-fee path.
        test_recipe:
          setup:
            - "Case fully paid (amount_collected_cents=340000, total_contracted_cents=340000), 20 first-run steps, 5 SHIPPED, status ACTIVE; a PATIENT_CANCEL refund is OPEN."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "Dr CA", license_state_codes: ["CA"], role_type: "ORTHODONTIST" }
              as: BillingAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /patients"
              payload: { email: "p1@x.com", full_name: "Pat One", state_code: "CA", date_of_birth: "1990-01-01" }
              as: Patient
              captures: { pat_id: $.data.id }
            - call: "POST /cases"
              payload: { patient_id: "${pat_id}", intake_channel: "IMPRESSION_KIT", list_price_cents: 400000 }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/intake-records"
              payload: { channel: "IMPRESSION_KIT", quality_score: 0.9, kit_tracking_number: "TRK1" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /cases/${case_id}/submit-for-review"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /plans"
              payload: { case_id: "${case_id}", author_clinician_id: "${clin_id}", proposed_step_count: 20, weeks_per_step: 2, discount_code: "WELCOME15" }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/submit"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /plans/${plan_id}/approve"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /financing-plans"
              payload: { case_id: "${case_id}", term_months: 12, down_payment_cents: 340000, apr_bps: 0 }
              as: BillingAdmin
              captures: { fin_id: $.data.id, fin_v: $.data.version }
            - call: "POST /financing-plans/${fin_id}/activate"
              payload: { expected_financing_plan_version: "${fin_v}" }
              as: BillingAdmin
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: ManufacturingOps
            - call: "GET /cases/${case_id}/aligner-steps"
              payload: {}
              as: ManufacturingOps
              captures: { s1: "$.data[0].id", s2: "$.data[1].id", s3: "$.data[2].id", s4: "$.data[3].id", s5: "$.data[4].id" }
            - call: "POST /aligner-steps/${s1}/complete-production"
              payload: {}
              as: ManufacturingOps
            - call: "POST /shipments"
              payload: { step_id: "${s1}", carrier_code: "GROUND", window_start: "2026-05-02T00:00:00Z", window_end: "2026-05-03T00:00:00Z" }
              as: ManufacturingOps
              captures: { sh1: $.data.id }
            - call: "POST /shipments/${sh1}/dispatch"
              payload: {}
              as: ManufacturingOps
            - call: "POST /aligner-steps/${s2}/start-production"
              payload: {}
              as: ManufacturingOps
            - call: "POST /aligner-steps/${s2}/complete-production"
              payload: {}
              as: ManufacturingOps
            - call: "POST /shipments"
              payload: { step_id: "${s2}", carrier_code: "GROUND", window_start: "2026-05-04T00:00:00Z", window_end: "2026-05-05T00:00:00Z" }
              as: ManufacturingOps
              captures: { sh2: $.data.id }
            - call: "POST /shipments/${sh2}/dispatch"
              payload: {}
              as: ManufacturingOps
            - call: "POST /aligner-steps/${s3}/start-production"
              payload: {}
              as: ManufacturingOps
            - call: "POST /aligner-steps/${s3}/complete-production"
              payload: {}
              as: ManufacturingOps
            - call: "POST /shipments"
              payload: { step_id: "${s3}", carrier_code: "GROUND", window_start: "2026-05-06T00:00:00Z", window_end: "2026-05-07T00:00:00Z" }
              as: ManufacturingOps
              captures: { sh3: $.data.id }
            - call: "POST /shipments/${sh3}/dispatch"
              payload: {}
              as: ManufacturingOps
            - call: "POST /aligner-steps/${s4}/start-production"
              payload: {}
              as: ManufacturingOps
            - call: "POST /aligner-steps/${s4}/complete-production"
              payload: {}
              as: ManufacturingOps
            - call: "POST /shipments"
              payload: { step_id: "${s4}", carrier_code: "GROUND", window_start: "2026-05-08T00:00:00Z", window_end: "2026-05-09T00:00:00Z" }
              as: ManufacturingOps
              captures: { sh4: $.data.id }
            - call: "POST /shipments/${sh4}/dispatch"
              payload: {}
              as: ManufacturingOps
            - call: "POST /aligner-steps/${s5}/start-production"
              payload: {}
              as: ManufacturingOps
            - call: "POST /aligner-steps/${s5}/complete-production"
              payload: {}
              as: ManufacturingOps
            - call: "POST /shipments"
              payload: { step_id: "${s5}", carrier_code: "GROUND", window_start: "2026-05-10T00:00:00Z", window_end: "2026-05-11T00:00:00Z" }
              as: ManufacturingOps
              captures: { sh5: $.data.id }
            - call: "POST /shipments/${sh5}/dispatch"
              payload: {}
              as: ManufacturingOps
            - call: "GET /cases/${case_id}"
              payload: {}
              as: BillingAdmin
              captures: { case_v: $.data.version }
            - call: "POST /refunds"
              payload: { case_id: "${case_id}", reason: "PATIENT_CANCEL", expected_case_version: "${case_v}" }
              as: BillingAdmin
              captures: { refund_id: $.data.id }
          trigger:
            - call: "POST /refunds/${refund_id}/approve"
              payload: {}
              as: BillingAdmin
              captures: { rc: $.data.computed_refund_cents, fee: $.data.restocking_fee_cents }
          assert:
            - "RefundRequest.${refund_id}.computed_refund_cents == 247500"
            - "RefundRequest.${refund_id}.restocking_fee_cents == 7500"
            - "RefundRequest.${refund_id}.status == APPROVED"

      - name: amortization_per_installment_rounding_distinct_from_refund
        grounds:
          - calculations.amortization
          - state_machines.FinancingPlan.PENDING_ACTIVATION_to_ACTIVE
          - entities.Installment.fields.amount_cents
          - entities.Installment.fields.principal_portion_cents
        distinguishing_aspect: |
          On the FinancingPlan/Installment domain (distinct from the RefundRequest
          domain of the other instance): rounding each of the first 11 installments to
          27076 cents and absorbing the residual 27079 on installment 12 makes the
          schedule total 324915 and principal portions sum EXACTLY to 300000 —
          unlike a naive sum-then-round.
        test_recipe:
          setup:
            - "Case priced 300000 (IMPRESSION_KIT list 375000, 10 steps LIGHT 0.80 -> 300000). Financing principal 300000, term 12, apr 1499 bps activated."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "Dr CA2", license_state_codes: ["CA"], role_type: "DENTIST" }
              as: BillingAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /patients"
              payload: { email: "p2@x.com", full_name: "Pat Two", state_code: "CA", date_of_birth: "1985-06-15" }
              as: Patient
              captures: { pat_id: $.data.id }
            - call: "POST /cases"
              payload: { patient_id: "${pat_id}", intake_channel: "IMPRESSION_KIT", list_price_cents: 375000 }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/intake-records"
              payload: { channel: "IMPRESSION_KIT", quality_score: 0.95, kit_tracking_number: "TRK2" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /cases/${case_id}/submit-for-review"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /plans"
              payload: { case_id: "${case_id}", author_clinician_id: "${clin_id}", proposed_step_count: 10, weeks_per_step: 2 }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/submit"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /plans/${plan_id}/approve"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /financing-plans"
              payload: { case_id: "${case_id}", term_months: 12, down_payment_cents: 0, apr_bps: 1499 }
              as: BillingAdmin
              captures: { fin_id: $.data.id, fin_v: $.data.version }
          trigger:
            - call: "POST /financing-plans/${fin_id}/activate"
              payload: { expected_financing_plan_version: "${fin_v}" }
              as: BillingAdmin
            - call: "GET /financing-plans/${fin_id}/installments"
              payload: {}
              as: BillingAdmin
              captures: { i1_amt: "$.data[0].amount_cents", i12_amt: "$.data[11].amount_cents" }
          assert:
            - "Installment[financing_plan_id=${fin_id}, sequence_no=1].amount_cents == 27076"
            - "Installment[financing_plan_id=${fin_id}, sequence_no=1].principal_portion_cents == 23328"
            - "Installment[financing_plan_id=${fin_id}, sequence_no=12].amount_cents == 27079"
            - "sum(Installment.principal_portion_cents for financing_plan_id=${fin_id}) == 300000"

  # ───────────────────────────────────────────────────────────────────────────
  # Rule 2 — Combinatorial formulas across different modes
  # ───────────────────────────────────────────────────────────────────────────
  - rule_id: combinatorial_formula
    instances:
      - name: case_price_mode_a_channel_tier_discount
        grounds:
          - calculations.case_price
          - state_machines.TreatmentCase.UNDER_REVIEW_to_PLAN_APPROVED
          - entities.TreatmentCase.fields.total_contracted_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs (intake_channel, proposed_step_count, discount_code) with
          non-linear interaction — channel surcharge, tiered multiplier selection by step
          band, then a discount band keyed on the post-tier total. In-office scan + 30
          steps (COMPLEX 1.35) + FLAT200: (500000+25000)*1.35=708750 round, -20000 = 688750.
        test_recipe:
          setup:
            - "Case intake_channel=IN_OFFICE_SCAN, list 500000, plan 30 steps (COMPLEX), discount FLAT200; plan SUBMITTED awaiting approval."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "Dr CA3", license_state_codes: ["CA"], role_type: "ORTHODONTIST" }
              as: BillingAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /patients"
              payload: { email: "p3@x.com", full_name: "Pat Three", state_code: "CA", date_of_birth: "1980-03-03" }
              as: Patient
              captures: { pat_id: $.data.id }
            - call: "POST /cases"
              payload: { patient_id: "${pat_id}", intake_channel: "IN_OFFICE_SCAN", list_price_cents: 500000 }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/intake-records"
              payload: { channel: "IN_OFFICE_SCAN", quality_score: 0.9, scan_clinic_state_code: "CA" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /cases/${case_id}/submit-for-review"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /plans"
              payload: { case_id: "${case_id}", author_clinician_id: "${clin_id}", proposed_step_count: 30, weeks_per_step: 2, discount_code: "FLAT200" }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/submit"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
          trigger:
            - call: "POST /plans/${plan_id}/approve"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Clinician
              captures: { tc: $.data.total_contracted_cents }
          assert:
            - "TreatmentCase.${case_id}.total_contracted_cents == 688750"
            - "TreatmentCase.${case_id}.status == PLAN_APPROVED"

      - name: amortization_mode_b_per_installment_rounding_order
        grounds:
          - calculations.amortization
          - state_machines.FinancingPlan.PENDING_ACTIVATION_to_ACTIVE
          - entities.Installment.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where ORDER matters — interest rounded per installment
          on the declining balance, then the FINAL installment absorbs the residual so
          principal portions sum to exactly 300000; sum-then-round would mis-total. This is
          a DIFFERENT mode than the case_price tier/discount mode (a) instance.
        test_recipe:
          setup:
            - "FinancingPlan principal 300000, term 12, apr 1499 bps, freshly created (PENDING_ACTIVATION)."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "Dr CA4", license_state_codes: ["CA"], role_type: "DENTIST" }
              as: BillingAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /patients"
              payload: { email: "p4@x.com", full_name: "Pat Four", state_code: "CA", date_of_birth: "1982-02-02" }
              as: Patient
              captures: { pat_id: $.data.id }
            - call: "POST /cases"
              payload: { patient_id: "${pat_id}", intake_channel: "IMPRESSION_KIT", list_price_cents: 375000 }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/intake-records"
              payload: { channel: "IMPRESSION_KIT", quality_score: 0.9, kit_tracking_number: "TRK4" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /cases/${case_id}/submit-for-review"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /plans"
              payload: { case_id: "${case_id}", author_clinician_id: "${clin_id}", proposed_step_count: 10, weeks_per_step: 2 }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/submit"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /plans/${plan_id}/approve"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /financing-plans"
              payload: { case_id: "${case_id}", term_months: 12, down_payment_cents: 0, apr_bps: 1499 }
              as: BillingAdmin
              captures: { fin_id: $.data.id, fin_v: $.data.version }
          trigger:
            - call: "POST /financing-plans/${fin_id}/activate"
              payload: { expected_financing_plan_version: "${fin_v}" }
              as: BillingAdmin
            - call: "GET /financing-plans/${fin_id}/installments"
              payload: {}
              as: BillingAdmin
              captures: { i12: "$.data[11].amount_cents" }
          assert:
            - "Installment[financing_plan_id=${fin_id}, sequence_no=12].amount_cents == 27079"
            - "sum(Installment.amount_cents for financing_plan_id=${fin_id}) == 324915"

  # ───────────────────────────────────────────────────────────────────────────
  # Rule 3 — Non-linear state-machine shape on different entities
  # ───────────────────────────────────────────────────────────────────────────
  - rule_id: non_linear_state_machine
    instances:
      - name: plan_review_cycle_revision_increments
        grounds:
          - state_machines.TreatmentPlan.SUBMITTED_to_CHANGES_REQUESTED
          - state_machines.TreatmentPlan.CHANGES_REQUESTED_to_SUBMITTED
          - entities.TreatmentPlan.fields.revision
        distinguishing_aspect: |
          TreatmentPlan exhibits a cycle SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED;
          each loop increments revision (1 -> 2), proving non-linear (cyclic) shape on
          the TreatmentPlan entity — distinct from the FinancingPlan parallel-dimension instance.
        test_recipe:
          setup:
            - "Plan SUBMITTED on an UNDER_REVIEW case; clinician sends it back then resubmits."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "Dr CA5", license_state_codes: ["CA"], role_type: "ORTHODONTIST" }
              as: BillingAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /patients"
              payload: { email: "p5@x.com", full_name: "Pat Five", state_code: "CA", date_of_birth: "1991-09-09" }
              as: Patient
              captures: { pat_id: $.data.id }
            - call: "POST /cases"
              payload: { patient_id: "${pat_id}", intake_channel: "IMPRESSION_KIT", list_price_cents: 400000 }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/intake-records"
              payload: { channel: "IMPRESSION_KIT", quality_score: 0.9, kit_tracking_number: "TRK5" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /cases/${case_id}/submit-for-review"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /plans"
              payload: { case_id: "${case_id}", author_clinician_id: "${clin_id}", proposed_step_count: 12, weeks_per_step: 2 }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/submit"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /plans/${plan_id}/request-changes"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
          trigger:
            - call: "POST /plans/${plan_id}/resubmit"
              payload: { proposed_step_count: 14 }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { rev: $.data.revision, st: $.data.status }
          assert:
            - "TreatmentPlan.${plan_id}.status == SUBMITTED"
            - "TreatmentPlan.${plan_id}.revision == 2"

      - name: financing_parallel_billing_and_delinquency_dimensions
        grounds:
          - state_machines.FinancingPlan.PENDING_ACTIVATION_to_ACTIVE
          - state_machines.Installment.SCHEDULED_to_LATE
          - entities.FinancingPlan.fields.billing_state
          - entities.FinancingPlan.fields.delinquency_state
        distinguishing_aspect: |
          FinancingPlan carries two independent state dimensions on one row: billing_state
          stays ACTIVE while delinquency_state moves CURRENT -> DELINQUENT after a sweep
          marks one installment LATE — parallel dimensions on the FinancingPlan entity,
          distinct from the TreatmentPlan cyclic instance.
        test_recipe:
          setup:
            - "FinancingPlan ACTIVE (principal 240000, term 12, apr 0), installment 1 due ~2026-06-01; clock advanced past due+grace so a sweep marks it LATE."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "Dr CA6", license_state_codes: ["CA"], role_type: "DENTIST" }
              as: BillingAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /patients"
              payload: { email: "p6@x.com", full_name: "Pat Six", state_code: "CA", date_of_birth: "1979-07-07" }
              as: Patient
              captures: { pat_id: $.data.id }
            - call: "POST /cases"
              payload: { patient_id: "${pat_id}", intake_channel: "IMPRESSION_KIT", list_price_cents: 300000 }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/intake-records"
              payload: { channel: "IMPRESSION_KIT", quality_score: 0.9, kit_tracking_number: "TRK6" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /cases/${case_id}/submit-for-review"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /plans"
              payload: { case_id: "${case_id}", author_clinician_id: "${clin_id}", proposed_step_count: 10, weeks_per_step: 2 }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/submit"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /plans/${plan_id}/approve"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /financing-plans"
              payload: { case_id: "${case_id}", term_months: 12, down_payment_cents: 0, apr_bps: 0 }
              as: BillingAdmin
              captures: { fin_id: $.data.id, fin_v: $.data.version }
            - call: "POST /financing-plans/${fin_id}/activate"
              payload: { expected_financing_plan_version: "${fin_v}" }
              as: BillingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /financing-plans/${fin_id}/run-delinquency-sweep"
              payload: {}
              as: BillingAdmin
              captures: { bs: $.data.billing_state, ds: $.data.delinquency_state }
          assert:
            - "FinancingPlan.${fin_id}.billing_state == ACTIVE"
            - "FinancingPlan.${fin_id}.delinquency_state == DELINQUENT"

  # ───────────────────────────────────────────────────────────────────────────
  # Rule 4 — Transitive cascade chains from different triggers
  # ───────────────────────────────────────────────────────────────────────────
  - rule_id: transitive_cascade
    instances:
      - name: refund_settle_depth3_case_financing_installments
        grounds:
          - state_machines.RefundRequest.APPROVED_to_SETTLED
          - state_machines.TreatmentCase.ACTIVE_to_REFUNDED
          - state_machines.FinancingPlan.ACTIVE_to_CANCELLED
          - state_machines.Installment.SCHEDULED_to_WAIVED
        distinguishing_aspect: |
          Depth-3 chain originating from refund settle: settle -> case ACTIVE->REFUNDED;
          that case transition -> FinancingPlan ACTIVE->CANCELLED; that financing
          transition -> all SCHEDULED Installments WAIVED. Each link is caused by the prior
          link, not by the settle call directly.
        test_recipe:
          setup:
            - "Case ACTIVE, financing ACTIVE (principal 240000, term 12, apr 0, 12 SCHEDULED installments), a PATIENT_CANCEL refund APPROVED."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "Dr CA7", license_state_codes: ["CA"], role_type: "DENTIST" }
              as: BillingAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /patients"
              payload: { email: "p7@x.com", full_name: "Pat Seven", state_code: "CA", date_of_birth: "1988-08-08" }
              as: Patient
              captures: { pat_id: $.data.id }
