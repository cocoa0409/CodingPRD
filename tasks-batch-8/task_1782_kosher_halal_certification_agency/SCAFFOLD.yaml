# =============================================================================
# Task 1782 — Kosher & Halal Certification Agency (OU/IFANCA style)
# Scaffold seed tables (§1.0–§1.7). Difficulty design lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Kosher & Halal Certification Agency (OU/IFANCA style agency): facility &
  ingredient review, supervisor visit scheduling & unannounced inspection,
  equipment status (kosherization/dedicated line) determination, ingredient
  change notification & re-approval, certificate issuance with product list &
  expiration, co-packer & multi-site scope, holiday/seasonal special production
  supervision, fee structure & annual renewal

domain_name: kosher-halal-certification
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency        # create-with-supersede on agreements (OCC on client.version)
    - cascading_side_effects        # ingredient change-notice cascade (depth 4); critical-finding cascade (depth 3)
    - dual_variant_calculation      # fee proration by billing cycle; certificate term conventions
    - rate_threshold_triggers       # NC score -> risk tier gates renewal and fees
  entity_topology: flat             # peer collections under /api, FK references in bodies
  state_machine_shape: cyclic       # ingredient re-approval loop, certificate suspend/reinstate loop, finding reopen loop; EquipmentLine carries two parallel state dimensions
  relationship_patterns:
    - one_to_many
    - many_to_many                  # Product <-> Ingredient via ProductIngredient; Certificate <-> Product via CertificateProduct
    - cross_aggregate               # Certificate.facility_ids spans Facility aggregate; Finding escalations mutate Facility/Certificate/AgencyClient
  role_model: segregation_of_duties # fee recording vs certificate issuance; visit inspector vs finding verifier
  consistency_model: immediate      # all cascade side effects atomic within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: AgencyClient
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Certified company's legal name" }
      - { name: certification_scheme, type: enum, source: input, description: "KOSHER | HALAL | DUAL — scopes which agreement/certificate schemes are legal" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: status, type: enum, source: system, default: PROSPECT, description: "PROSPECT | APPLICANT | CERTIFIED | SUSPENDED | WITHDRAWN | TERMINATED" }
      - { name: open_nc_score, type: integer, source: computed, default: 0, description: "Sum of severity weights over findings at this client's facilities with status IN {OPEN, REOPENED, ESCALATED}; MINOR=1, MAJOR=3, CRITICAL=8" }
      - { name: risk_tier, type: enum, source: computed, default: LOW, description: "LOW if open_nc_score <= 2; MEDIUM if 3..7; HIGH if >= 8" }
      - { name: total_billed_cents, type: integer, source: computed, default: 0, description: "Sum of total_cents over this client's invoices with status IN {ISSUED, OVERDUE, PAID}" }

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> AgencyClient.id; owning client" }
      - { name: name, type: string, source: input, description: "Site name" }
      - { name: address, type: string, source: input, description: "Site address" }
      - { name: facility_role, type: enum, source: input, default: OWNED, description: "OWNED | CO_PACKER; CO_PACKER adds a per-site fee surcharge and requires its own COMPLETED INITIAL visit" }
      - { name: status, type: enum, source: system, default: PENDING_REVIEW, description: "PENDING_REVIEW | APPROVED | SUSPENDED | DECOMMISSIONED" }

  - name: EquipmentLine
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; hosting facility" }
      - { name: designation, type: string, source: input, description: "Line designation, unique per facility" }
      - { name: dedication_status, type: enum, source: system, default: UNASSESSED, description: "UNASSESSED | DEDICATED | SHARED — parallel dimension 1, set by assess" }
      - { name: kosherization_state, type: enum, source: system, default: NONE, description: "NONE | VALID | EXPIRED | COMPROMISED — parallel dimension 2, independent of dedication_status" }
      - { name: kosherized_valid_until, type: datetime, source: computed, description: "Null unless kosherization_state==VALID; = last kosherization event time + 72h" }

  - name: Ingredient
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> AgencyClient.id; owning client" }
      - { name: name, type: string, source: input, description: "Ingredient trade name" }
      - { name: manufacturer, type: string, source: input, description: "Ingredient manufacturer" }
      - { name: source_category, type: enum, source: input, description: "ANIMAL | PLANT | MICROBIAL | MINERAL | SYNTHETIC" }
      - { name: has_species_documentation, type: boolean, source: input, default: false, description: "Species/ slaughter documentation flag; mandatory true for ANIMAL approvals" }
      - { name: change_summary, type: string, source: system, description: "Text of the latest change notice; null until first change notice" , default: null}
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED | CHANGE_PENDING" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> AgencyClient.id; owning client" }
      - { name: brand, type: string, source: input, description: "Brand name" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | IN_REVIEW | CERTIFIABLE | REVIEW_HOLD | WITHDRAWN; REVIEW_HOLD is system-only" }

  - name: ProductIngredient
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; owning product" }
      - { name: ingredient_id, type: string, source: input, description: "FK -> Ingredient.id; linked ingredient" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | PENDING_REAPPROVAL | BLOCKED | REMOVED" }

  - name: SupervisionVisit
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; visited facility" }
      - { name: visit_type, type: enum, source: input, description: "INITIAL | ROUTINE | UNANNOUNCED | SPECIAL_HOLIDAY" }
      - { name: inspector_user_id, type: string, source: input, description: "Opaque FieldSupervisor user id assigned to this visit; assignment-checked at start/complete/findings" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned window start (UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned window end (UTC), must be > scheduled_start" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED | NO_ACCESS" }

  - name: InspectionFinding
    parent: null
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> SupervisionVisit.id; visit during which the finding was raised" }
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id; denormalized from the visit at creation" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL" }
      - { name: description, type: string, source: input, description: "Finding description" }
      - { name: remediation_deadline, type: datetime, source: input, description: "UTC deadline; OPEN/REOPENED findings past deadline escalate on clock sweep" }
      - { name: origin, type: enum, source: system, default: MANUAL, description: "MANUAL | AUTO_NO_ACCESS (auto-created when a visit ends NO_ACCESS)" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | REMEDIATION_SUBMITTED | REOPENED | ESCALATED | VERIFIED_CLOSED" }

  - name: CertificationAgreement
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> AgencyClient.id" }
      - { name: scheme, type: enum, source: input, description: "KOSHER | HALAL | DUAL; must be covered by client.certification_scheme" }
      - { name: billing_cycle, type: enum, source: input, description: "ANNIVERSARY | CALENDAR_YEAR — selects proration variant and term_end_date rule" }
      - { name: term_start_date, type: string, source: input, description: "ISO date YYYY-MM-DD; term start (inclusive)" }
      - { name: term_end_date, type: string, source: computed, description: "ISO date; ANNIVERSARY: term_start + 12 months - 1 day; CALENDAR_YEAR: Dec 31 of term_start year" }
      - { name: per_product_fee_cents, type: integer, source: input, description: "Full-cycle per-product fee used by proration" }
      - { name: annual_fee_snapshot_cents, type: integer, source: computed, description: "annual_certification_fee result frozen at activation; null until ACTIVE" , default: null}
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | SUPERSEDED | EXPIRED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> AgencyClient.id" }
      - { name: agreement_id, type: string, source: input, description: "FK -> CertificationAgreement.id; required for ANNUAL_CERTIFICATION, system-set for PRODUCT_ADDITION/RENEWAL, null for REINSTATEMENT" }
      - { name: related_certificate_id, type: string, source: system, description: "FK -> Certificate.id; set on RENEWAL (renewal target) and PRODUCT_ADDITION (receiving certificate) invoices; else null" , default: null}
      - { name: invoice_type, type: enum, source: input, description: "ANNUAL_CERTIFICATION | PRODUCT_ADDITION | RENEWAL | REINSTATEMENT" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of per-line rounded amounts BEFORE volume discount" }
      - { name: discount_cents, type: integer, source: computed, default: 0, description: "Volume discount applied once, tier keyed on subtotal_cents" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents" }
      - { name: due_date, type: datetime, source: computed, description: "issued_at + 30 days" }
      - { name: paid_recorded_by, type: string, source: system, description: "X-User-ID of the AccountManager who recorded payment; 'system' for zero-total auto-payment; null while unpaid" , default: null}
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | PAID | OVERDUE | VOID; zero-total invoices are created directly in PAID" }

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> AgencyClient.id" }
      - { name: scheme, type: enum, source: input, description: "KOSHER | HALAL | DUAL; must be covered by client.certification_scheme and by the ACTIVE agreement's scheme" }
      - { name: term_type, type: enum, source: input, description: "ANNUAL | SEASONAL — selects the certificate_valid_until variant" }
      - { name: holiday_window_id, type: string, source: input, description: "FK -> HolidayProductionWindow.id; required iff term_type==SEASONAL, else null" , default: null}
      - { name: facility_ids, type: array, source: input, description: "FK -> Facility.id (array of site ids forming the multi-site scope, mixing OWNED and CO_PACKER)" }
      - { name: renews_certificate_id, type: string, source: system, description: "FK -> Certificate.id; set on renewal-child certificates, else null" , default: null}
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | SUSPENDED | EXPIRED | REVOKED | SUPERSEDED" }
      - { name: scope_status, type: enum, source: computed, default: FULL, description: "FULL | PARTIAL_FROZEN — PARTIAL_FROZEN iff any CertificateProduct entry is FROZEN" }
      - { name: active_product_count, type: integer, source: computed, default: 0, description: "Count of CertificateProduct entries with status == INCLUDED" }
      - { name: issued_at, type: datetime, source: system, description: "UTC issuance instant; null until ACTIVE" , default: null}
      - { name: valid_until, type: datetime, source: computed, description: "ANNUAL: issued_at + 365 days. SEASONAL: holiday window_end. Expired when now > valid_until" }

  - name: CertificateProduct
    parent: null
    common_fields: true
    fields:
      - { name: certificate_id, type: string, source: system, description: "FK -> Certificate.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: status, type: enum, source: system, default: INCLUDED, description: "INCLUDED | FROZEN | REMOVED" }

  - name: HolidayProductionWindow
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: holiday_code, type: enum, source: input, description: "PASSOVER | ROSH_HASHANAH (need KOSHER or DUAL certificate) | RAMADAN | EID_AL_FITR (need HALAL or DUAL certificate)" }
      - { name: window_start, type: datetime, source: input, description: "Production window start (UTC), half-open lower bound" }
      - { name: window_end, type: datetime, source: input, description: "Production window end (UTC), half-open upper bound; must be > window_start" }
      - { name: assigned_supervisor_id, type: string, source: system, description: "Opaque FieldSupervisor user id fixed at confirmation; null while REQUESTED" , default: null}
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | CONFIRMED | COMPLETED | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AgencyClient
    initial_state: PROSPECT
    terminal_states: [WITHDRAWN, TERMINATED]
    transitions:
      - from: PROSPECT
        to: APPLICANT
        trigger: "POST /api/clients/{id}/submit-application"
        actor: ClientContact
        preconditions:
          - "client.status == PROSPECT (ERR_CLIENT_INVALID_STATE)"
          - "X-User-ID == client.id (ERR_CLIENT_SCOPE_VIOLATION)"
        side_effects: []
      - from: APPLICANT
        to: CERTIFIED
        trigger: "system (bubble-up: first Certificate reaches ACTIVE via issue)"
        actor: system
        preconditions: ["an issuance transition on one of this client's certificates just succeeded"]
        side_effects: []
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "system (bubble-up recompute after any certificate status change: zero certificates remain ACTIVE)"
        actor: system
        preconditions: ["count of client's Certificates with status == ACTIVE dropped to 0 while client was CERTIFIED"]
        side_effects: []
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "system (bubble-up: a certificate reinstate transition restores an ACTIVE certificate)"
        actor: system
        preconditions: ["a certificate of this client just transitioned SUSPENDED -> ACTIVE"]
        side_effects: []
      - from: PROSPECT
        to: WITHDRAWN
        trigger: "POST /api/clients/{id}/withdraw"
        actor: ClientContact
        preconditions: ["client.status IN {PROSPECT, APPLICANT, CERTIFIED, SUSPENDED} (ERR_CLIENT_INVALID_STATE)", "X-User-ID == client.id (ERR_CLIENT_SCOPE_VIOLATION)"]
        side_effects:
          - "All client's Certificates with status IN {DRAFT, ACTIVE, SUSPENDED} -> REVOKED"
      - from: APPLICANT
        to: WITHDRAWN
        trigger: "POST /api/clients/{id}/withdraw"
        actor: ClientContact
        preconditions: ["same as above"]
        side_effects: ["same certificate revocation cascade as above"]
      - from: CERTIFIED
        to: WITHDRAWN
        trigger: "POST /api/clients/{id}/withdraw"
        actor: ClientContact
        preconditions: ["same as above"]
        side_effects: ["same certificate revocation cascade as above"]
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /api/clients/{id}/withdraw"
        actor: ClientContact
        preconditions: ["same as above"]
        side_effects: ["same certificate revocation cascade as above"]
      - from: PROSPECT
        to: TERMINATED
        trigger: "POST /api/clients/{id}/terminate"
        actor: CertificateOfficer
        preconditions: ["client.status IN {PROSPECT, APPLICANT, CERTIFIED, SUSPENDED} (ERR_CLIENT_INVALID_STATE)"]
        side_effects:
          - "All client's Certificates with status IN {DRAFT, ACTIVE, SUSPENDED} -> REVOKED"
      - from: APPLICANT
        to: TERMINATED
        trigger: "POST /api/clients/{id}/terminate"
        actor: CertificateOfficer
        preconditions: ["same as above"]
        side_effects: ["same certificate revocation cascade as above"]
      - from: CERTIFIED
        to: TERMINATED
        trigger: "POST /api/clients/{id}/terminate"
        actor: CertificateOfficer
        preconditions: ["same as above"]
        side_effects: ["same certificate revocation cascade as above"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /api/clients/{id}/terminate"
        actor: CertificateOfficer
        preconditions: ["same as above"]
        side_effects: ["same certificate revocation cascade as above"]

  - entity: Facility
    initial_state: PENDING_REVIEW
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /api/facilities/{id}/approve"
        actor: CertificationReviewer
        preconditions:
          - "facility.status == PENDING_REVIEW (ERR_FACILITY_INVALID_STATE)"
          - "at least one SupervisionVisit with facility_id == this, visit_type == INITIAL, status == COMPLETED (ERR_INITIAL_VISIT_REQUIRED)"
          - "no InspectionFinding with facility_id == this, severity IN {MAJOR, CRITICAL}, status IN {OPEN, REMEDIATION_SUBMITTED, REOPENED, ESCALATED} (ERR_OPEN_MAJOR_FINDINGS)"
          - "every EquipmentLine of this facility has dedication_status != UNASSESSED and kosherization_state IN {NONE, VALID} (ERR_EQUIPMENT_UNASSESSED)"
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /api/facilities/{id}/suspend (manual) OR system cascade from CRITICAL finding / finding escalation"
        actor: CertificationReviewer | system
        preconditions: ["facility.status == APPROVED (ERR_FACILITY_INVALID_STATE; system path: unconditional on cascade trigger)"]
        side_effects:
          - "HOP-1: every Certificate whose facility_ids contains this facility AND status == ACTIVE -> SUSPENDED"
          - "HOP-2: for each client whose certificates were suspended in HOP-1: if client.status == CERTIFIED and zero ACTIVE certificates remain -> client -> SUSPENDED"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /api/facilities/{id}/reinstate"
        actor: CertificationReviewer
        preconditions:
          - "facility.status == SUSPENDED (ERR_FACILITY_INVALID_STATE)"
          - "no InspectionFinding with facility_id == this, severity IN {MAJOR, CRITICAL}, status IN {OPEN, REMEDIATION_SUBMITTED, REOPENED, ESCALATED} (ERR_OPEN_MAJOR_FINDINGS)"
          - "no EquipmentLine of this facility with kosherization_state == COMPROMISED (ERR_EQUIPMENT_UNASSESSED)"
        side_effects: []
        note: "Certificate/client reinstatement is NOT automatic; each certificate needs its own reinstate call"
      - from: APPROVED
        to: DECOMMISSIONED
        trigger: "POST /api/facilities/{id}/decommission"
        actor: ClientContact
        preconditions: ["facility.status IN {APPROVED, SUSPENDED} (ERR_FACILITY_INVALID_STATE)", "X-User-ID == facility.client_id (ERR_CLIENT_SCOPE_VIOLATION)"]
        side_effects:
          - "facility removed from every DRAFT/ACTIVE/SUSPENDED Certificate's facility_ids; a certificate whose scope becomes empty -> SUSPENDED (ACTIVE->SUSPENDED only; DRAFT stays DRAFT with empty scope)"
      - from: SUSPENDED
        to: DECOMMISSIONED
        trigger: "POST /api/facilities/{id}/decommission"
        actor: ClientContact
        preconditions: ["same as above"]
        side_effects: ["same as above"]
      - from: PENDING_REVIEW
        to: DECOMMISSIONED
        trigger: "POST /api/facilities/{id}/decommission"
        actor: ClientContact
        preconditions: ["facility.status IN {PENDING_REVIEW, APPROVED, SUSPENDED} (ERR_FACILITY_INVALID_STATE)"]
        side_effects: []

  - entity: EquipmentLine
    initial_state: "dedication_status=UNASSESSED, kosherization_state=NONE"
    terminal_states: []
    note: "Two parallel state dimensions evolve independently on one row: dedication_status (UNASSESSED -> DEDICATED | SHARED) and kosherization_state (NONE <-> VALID <-> EXPIRED/COMPROMISED cycle)."
    transitions:
      - from: "dedication_status=UNASSESSED"
        to: "dedication_status=DEDICATED"
        trigger: "POST /api/equipment-lines/{id}/assess {dedication_status: DEDICATED}"
        actor: CertificationReviewer
        preconditions: ["line.dedication_status == UNASSESSED (ERR_EQUIPMENT_LINE_INVALID_STATE)", "facility.status IN {PENDING_REVIEW, APPROVED} (ERR_FACILITY_INVALID_STATE)"]
        side_effects: ["kosherization_state unchanged (stays NONE or whatever it was)"]
      - from: "dedication_status=UNASSESSED"
        to: "dedication_status=SHARED"
        trigger: "POST /api/equipment-lines/{id}/assess {dedication_status: SHARED}"
        actor: CertificationReviewer
        preconditions: ["same as DEDICATED assessment"]
        side_effects: ["if kosherization_state == NONE: kosherization_state -> EXPIRED (a SHARED line is never clean-by-default)"]
      - from: "kosherization_state IN {EXPIRED, COMPROMISED}"
        to: "kosherization_state=VALID"
        trigger: "POST /api/equipment-lines/{id}/kosherization-events"
        actor: FieldSupervisor
        preconditions: ["facility.status == APPROVED (ERR_FACILITY_INVALID_STATE)", "line.kosherization_state IN {EXPIRED, COMPROMISED} (ERR_EQUIPMENT_LINE_INVALID_STATE)"]
        side_effects: ["kosherized_valid_until = current_utc + 72h (KOSHERIZATION_VALIDITY_HOURS)"]
      - from: "kosherization_state=NONE"
        to: "kosherization_state=VALID"
        trigger: "POST /api/equipment-lines/{id}/kosherization-events"
        actor: FieldSupervisor
        preconditions: ["facility.status == APPROVED (ERR_FACILITY_INVALID_STATE)", "line.kosherization_state IN {NONE, EXPIRED, COMPROMISED} (ERR_EQUIPMENT_LINE_INVALID_STATE)"]
        side_effects: ["kosherized_valid_until = current_utc + 72h"]
      - from: "kosherization_state IN {NONE, VALID, EXPIRED}"
        to: "kosherization_state=COMPROMISED"
        trigger: "POST /api/equipment-lines/{id}/report-compromise OR system (CRITICAL finding created on the hosting facility compromises ALL its lines)"
        actor: FieldSupervisor | system
        preconditions: ["line.kosherization_state != COMPROMISED (ERR_EQUIPMENT_LINE_INVALID_STATE for manual call)"]
        side_effects: ["kosherized_valid_until = null"]
      - from: "kosherization_state=VALID"
        to: "kosherization_state=EXPIRED"
        trigger: "system (clock sweep: current_utc > kosherized_valid_until)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Ingredient
    initial_state: SUBMITTED
    terminal_states: []
    note: "Cyclic machine: APPROVED -> CHANGE_PENDING -> UNDER_REVIEW -> APPROVED is the change-notification re-approval loop."
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /api/ingredients/{id}/start-review"
        actor: CertificationReviewer
        preconditions: ["ingredient.status == SUBMITTED (ERR_INGREDIENT_INVALID_STATE)"]
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/ingredients/{id}/approve"
        actor: CertificationReviewer
        preconditions:
          - "ingredient.status == UNDER_REVIEW (ERR_INGREDIENT_INVALID_STATE)"
          - "if source_category == ANIMAL then has_species_documentation == true (ERR_ANIMAL_SOURCE_DOCUMENTATION_REQUIRED)"
        side_effects:
          - "HOP-1 (compensation): every ProductIngredient with ingredient_id == this AND status == PENDING_REAPPROVAL -> ACTIVE"
          - "HOP-2: each Product whose junctions flipped in HOP-1 AND status == REVIEW_HOLD AND no remaining junctions IN {PENDING_REAPPROVAL, BLOCKED} -> CERTIFIABLE"
          - "HOP-3: each CertificateProduct with product_id IN (products restored in HOP-2) AND status == FROZEN -> INCLUDED"
          - "HOP-4: each Certificate owning an entry restored in HOP-3: recompute scope_status (FULL iff no FROZEN entries) and active_product_count = count(INCLUDED)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /api/ingredients/{id}/reject"
        actor: CertificationReviewer
        preconditions: ["ingredient.status == UNDER_REVIEW (ERR_INGREDIENT_INVALID_STATE)"]
        side_effects:
          - "every ProductIngredient with ingredient_id == this AND status == PENDING_REAPPROVAL -> BLOCKED (products stay REVIEW_HOLD until junction removed)"
      - from: APPROVED
        to: CHANGE_PENDING
        trigger: "POST /api/ingredients/{id}/change-notices"
        actor: ClientContact
        preconditions: ["ingredient.status == APPROVED (ERR_INGREDIENT_INVALID_STATE)", "X-User-ID == ingredient.client_id (ERR_CLIENT_SCOPE_VIOLATION)"]
        side_effects:
          - "change_summary = payload.change_summary"
          - "HOP-1: every ProductIngredient with ingredient_id == this AND status == ACTIVE -> PENDING_REAPPROVAL"
          - "HOP-2: each Product owning a junction flipped in HOP-1 AND status == CERTIFIABLE -> REVIEW_HOLD (caused by the junction flip, not by the notice directly)"
          - "HOP-3: each CertificateProduct whose product_id was flipped in HOP-2 AND status == INCLUDED -> FROZEN (caused by the product flip)"
          - "HOP-4: each Certificate owning an entry flipped in HOP-3: scope_status -> PARTIAL_FROZEN; active_product_count recomputed as count(INCLUDED) (caused by the entry flip)"
      - from: CHANGE_PENDING
        to: UNDER_REVIEW
        trigger: "POST /api/ingredients/{id}/resubmit"
        actor: ClientContact
        preconditions: ["ingredient.status == CHANGE_PENDING (ERR_INGREDIENT_INVALID_STATE)", "X-User-ID == ingredient.client_id (ERR_CLIENT_SCOPE_VIOLATION)"]
        side_effects: []

  - entity: ProductIngredient
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: PENDING_REAPPROVAL
        trigger: "system (ingredient change-notice cascade HOP-1)"
        actor: system
        preconditions: []
        side_effects: ["product REVIEW_HOLD evaluation (ingredient cascade HOP-2)"]
      - from: PENDING_REAPPROVAL
        to: ACTIVE
        trigger: "system (ingredient re-approval compensation HOP-1)"
        actor: system
        preconditions: []
        side_effects: ["product CERTIFIABLE restoration evaluation"]
      - from: PENDING_REAPPROVAL
        to: BLOCKED
        trigger: "system (ingredient rejected after change notice)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REMOVED
        trigger: "DELETE /api/product-ingredients/{id}"
        actor: ClientContact
        preconditions: ["junction.status != REMOVED (ERR_PRODUCT_INGREDIENT_INVALID_STATE)", "X-User-ID == product.client_id (ERR_CLIENT_SCOPE_VIOLATION)", "product.status IN {DRAFT, IN_REVIEW, REVIEW_HOLD, CERTIFIABLE} (ERR_PRODUCT_INVALID_STATE on WITHDRAWN)"]
        side_effects: ["if product.status == REVIEW_HOLD and no remaining junctions IN {PENDING_REAPPROVAL, BLOCKED}: product -> CERTIFIABLE, and its FROZEN CertificateProduct entries -> INCLUDED with certificate scope_status/count recompute"]
      - from: PENDING_REAPPROVAL
        to: REMOVED
        trigger: "DELETE /api/product-ingredients/{id}"
        actor: ClientContact
        preconditions: ["same as ACTIVE -> REMOVED"]
        side_effects: ["same REVIEW_HOLD release evaluation"]
      - from: BLOCKED
        to: REMOVED
        trigger: "DELETE /api/product-ingredients/{id}"
        actor: ClientContact
        preconditions: ["same as ACTIVE -> REMOVED"]
        side_effects: ["same REVIEW_HOLD release evaluation"]

  - entity: Product
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /api/products/{id}/submit-review"
        actor: ClientContact
        preconditions: ["product.status == DRAFT (ERR_PRODUCT_INVALID_STATE)", "X-User-ID == product.client_id (ERR_CLIENT_SCOPE_VIOLATION)", "count of junctions with status == ACTIVE >= 1 (ERR_PRODUCT_HAS_NO_INGREDIENTS)"]
        side_effects: []
      - from: IN_REVIEW
        to: CERTIFIABLE
        trigger: "POST /api/products/{id}/certify-eligible"
        actor: CertificationReviewer
        preconditions: ["product.status == IN_REVIEW (ERR_PRODUCT_INVALID_STATE)", "every junction with status == ACTIVE links an Ingredient with status == APPROVED (ERR_INGREDIENT_NOT_APPROVED)"]
        side_effects: []
      - from: CERTIFIABLE
        to: REVIEW_HOLD
        trigger: "system (ingredient change-notice cascade HOP-2)"
        actor: system
        preconditions: []
        side_effects: ["certificate entry freeze (cascade HOP-3)"]
      - from: REVIEW_HOLD
        to: CERTIFIABLE
        trigger: "system (all junctions back to ACTIVE via re-approval or removal of pending/blocked junctions)"
        actor: system
        preconditions: ["zero junctions IN {PENDING_REAPPROVAL, BLOCKED}"]
        side_effects: ["certificate entry unfreeze (compensation HOP-3)"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/products/{id}/withdraw"
        actor: ClientContact
        preconditions: ["product.status IN {DRAFT, IN_REVIEW, CERTIFIABLE, REVIEW_HOLD} (ERR_PRODUCT_INVALID_STATE)", "X-User-ID == product.client_id (ERR_CLIENT_SCOPE_VIOLATION)"]
        side_effects: ["all CertificateProduct entries with product_id == this AND status IN {INCLUDED, FROZEN} -> REMOVED; owning certificates recompute scope_status and active_product_count"]
      - from: IN_REVIEW
        to: WITHDRAWN
        trigger: "POST /api/products/{id}/withdraw"
        actor: ClientContact
        preconditions: ["same as above"]
        side_effects: ["same as above"]
      - from: CERTIFIABLE
        to: WITHDRAWN
        trigger: "POST /api/products/{id}/withdraw"
        actor: ClientContact
        preconditions: ["same as above"]
        side_effects: ["same as above"]
      - from: REVIEW_HOLD
        to: WITHDRAWN
        trigger: "POST /api/products/{id}/withdraw"
        actor: ClientContact
        preconditions: ["same as above"]
        side_effects: ["same as above"]

  - entity: SupervisionVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_ACCESS]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /api/visits/{id}/start"
        actor: FieldSupervisor
        preconditions:
          - "visit.status == SCHEDULED (ERR_VISIT_INVALID_STATE)"
          - "X-User-ID == visit.inspector_user_id (ERR_NOT_ASSIGNED_INSPECTOR)"
          - "scheduled_start <= current_utc <= scheduled_end (ERR_VISIT_WINDOW_NOT_ACTIVE)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/visits/{id}/complete"
        actor: FieldSupervisor
        preconditions: ["visit.status == IN_PROGRESS (ERR_VISIT_INVALID_STATE)", "X-User-ID == visit.inspector_user_id (ERR_NOT_ASSIGNED_INSPECTOR)"]
        side_effects: []
      - from: SCHEDULED
        to: NO_ACCESS
        trigger: "POST /api/visits/{id}/no-access"
        actor: FieldSupervisor
        preconditions: ["visit.status IN {SCHEDULED, IN_PROGRESS} (ERR_VISIT_INVALID_STATE)", "X-User-ID == visit.inspector_user_id (ERR_NOT_ASSIGNED_INSPECTOR)"]
        side_effects:
          - "auto-create InspectionFinding: severity CRITICAL, origin AUTO_NO_ACCESS, remediation_deadline = current_utc + 7 days, status OPEN; client.open_nc_score recomputed (+8)"
          - "cascade: if facility.status == APPROVED -> facility SUSPENDED -> ACTIVE in-scope certificates SUSPENDED -> client recompute (zero ACTIVE -> client SUSPENDED); all facility EquipmentLines kosherization_state -> COMPROMISED"
      - from: IN_PROGRESS
        to: NO_ACCESS
        trigger: "POST /api/visits/{id}/no-access"
        actor: FieldSupervisor
        preconditions: ["same as above"]
        side_effects: ["same as above"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/visits/{id}/cancel"
        actor: AccountManager
        preconditions: ["visit.status == SCHEDULED (ERR_VISIT_INVALID_STATE)"]
        side_effects: []

  - entity: InspectionFinding
    initial_state: OPEN
    terminal_states: [VERIFIED_CLOSED]
    transitions:
      - from: OPEN
        to: REMEDIATION_SUBMITTED
        trigger: "POST /api/findings/{id}/submit-remediation"
        actor: ClientContact
        preconditions: ["finding.status IN {OPEN, REOPENED, ESCALATED} (ERR_FINDING_INVALID_STATE)", "X-User-ID == finding's facility's client_id (ERR_CLIENT_SCOPE_VIOLATION)"]
        side_effects: ["client.open_nc_score recomputed (finding leaves the {OPEN, REOPENED, ESCALATED} set)"]
      - from: REOPENED
        to: REMEDIATION_SUBMITTED
        trigger: "POST /api/findings/{id}/submit-remediation"
        actor: ClientContact
        preconditions: ["same as above"]
        side_effects: ["same as above"]
      - from: ESCALATED
        to: REMEDIATION_SUBMITTED
        trigger: "POST /api/findings/{id}/submit-remediation"
        actor: ClientContact
        preconditions: ["same as above"]
        side_effects: ["same as above"]
      - from: REMEDIATION_SUBMITTED
        to: VERIFIED_CLOSED
        trigger: "POST /api/findings/{id}/verify {outcome: CLOSED}"
        actor: FieldSupervisor
        preconditions: ["finding.status == REMEDIATION_SUBMITTED (ERR_FINDING_INVALID_STATE)", "X-User-ID != finding's visit's inspector_user_id (ERR_SEGREGATION_OF_DUTIES_VERIFICATION)"]
        side_effects: ["client.open_nc_score recomputed (no change: REMEDIATION_SUBMITTED and VERIFIED_CLOSED are both excluded)"]
      - from: REMEDIATION_SUBMITTED
        to: REOPENED
        trigger: "POST /api/findings/{id}/verify {outcome: FAILED, new_remediation_deadline}"
        actor: FieldSupervisor
        preconditions: ["finding.status == REMEDIATION_SUBMITTED (ERR_FINDING_INVALID_STATE)", "X-User-ID != finding's visit's inspector_user_id (ERR_SEGREGATION_OF_DUTIES_VERIFICATION)", "new_remediation_deadline > current_utc (ERR_INVALID_REQUEST)"]
        side_effects: ["remediation_deadline = new_remediation_deadline", "client.open_nc_score recomputed (finding re-enters the counted set: +weight)"]
      - from: OPEN
        to: ESCALATED
        trigger: "system (clock sweep: current_utc > remediation_deadline)"
        actor: system
        preconditions: []
        side_effects:
          - "HOP-1: if facility.status == APPROVED -> facility SUSPENDED"
          - "HOP-2: every Certificate with facility in scope AND status == ACTIVE -> SUSPENDED (caused by the facility suspension)"
          - "HOP-3: client recompute: if CERTIFIED and zero ACTIVE certificates -> SUSPENDED (caused by certificate suspensions)"
      - from: REOPENED
        to: ESCALATED
        trigger: "system (clock sweep: current_utc > remediation_deadline)"
        actor: system
        preconditions: []
        side_effects: ["same cascade as OPEN -> ESCALATED"]

  - entity: CertificationAgreement
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/agreements/{id}/activate"
        actor: AccountManager
        preconditions:
          - "agreement.status == DRAFT (ERR_AGREEMENT_INVALID_STATE)"
          - "client.status IN {APPLICANT, CERTIFIED} (ERR_CLIENT_INVALID_STATE)"
          - "no other CertificationAgreement with client_id == this client AND status == ACTIVE (ERR_ACTIVE_AGREEMENT_EXISTS)"
        side_effects:
          - "annual_fee_snapshot_cents = annual_certification_fee(facilities at this instant, agreement.scheme, client.risk_tier at this instant)"
          - "term_end_date already fixed at creation (billing_cycle rule)"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a new agreement for the same client is created via POST /api/agreements)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep: date(current_utc) > term_end_date)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /api/invoices/{id}/record-payment"
        actor: AccountManager
        preconditions: ["invoice.status IN {ISSUED, OVERDUE} (ERR_INVOICE_INVALID_STATE)"]
        side_effects: ["paid_recorded_by = X-User-ID"]
      - from: OVERDUE
        to: PAID
        trigger: "POST /api/invoices/{id}/record-payment"
        actor: AccountManager
        preconditions: ["same as above"]
        side_effects: ["paid_recorded_by = X-User-ID"]
      - from: ISSUED
        to: OVERDUE
        trigger: "system (clock sweep: current_utc > due_date)"
        actor: system
        preconditions: []
        side_effects:
          - "if invoice_type IN {ANNUAL_CERTIFICATION, RENEWAL} AND current_utc > due_date + 14 days (GRACE_DAYS): every ACTIVE certificate of this client -> SUSPENDED, then client recompute (zero ACTIVE -> SUSPENDED)"
      - from: ISSUED
        to: VOID
        trigger: "POST /api/invoices/{id}/void"
        actor: AccountManager
        preconditions: ["invoice.status IN {ISSUED, OVERDUE} (ERR_INVOICE_INVALID_STATE)"]
        side_effects: ["client.total_billed_cents recomputed (invoice leaves the billed set)"]
      - from: OVERDUE
        to: VOID
        trigger: "POST /api/invoices/{id}/void"
        actor: AccountManager
        preconditions: ["same as above"]
        side_effects: ["same as above"]

  - entity: Certificate
    initial_state: DRAFT
    terminal_states: [EXPIRED, REVOKED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/certificates/{id}/issue"
        actor: CertificateOfficer
        preconditions:
          - "certificate.status == DRAFT (ERR_CERTIFICATE_INVALID_STATE)"
          - "client.status IN {APPLICANT, CERTIFIED} (ERR_CLIENT_INVALID_STATE)"
          - "SEASONAL only: holiday window status == CONFIRMED (ERR_WINDOW_INVALID_STATE)"
          - "every facility in facility_ids has status == APPROVED (ERR_FACILITY_NOT_APPROVED)"
          - "every CertificateProduct entry has status == INCLUDED and its product status == CERTIFIABLE (ERR_PRODUCT_NOT_CERTIFIABLE)"
          - "an ACTIVE agreement exists for this client whose scheme covers certificate.scheme (ERR_NO_ACTIVE_AGREEMENT / ERR_SCHEME_MISMATCH)"
          - "fee gate: renewal-child certificate -> exists Invoice type RENEWAL with related_certificate_id == this AND status == PAID; initial certificate -> exists Invoice type ANNUAL_CERTIFICATION on the ACTIVE agreement with status == PAID (ERR_CERTIFICATION_FEE_UNPAID)"
          - "segregation: that PAID invoice's paid_recorded_by != X-User-ID (ERR_SEGREGATION_OF_DUTIES_ISSUANCE)"
        side_effects:
          - "issued_at = current_utc; valid_until per certificate_valid_until variant"
          - "active_product_count = count(INCLUDED entries); scope_status = FULL"
          - "if certificate.renews_certificate_id != null: the renewed certificate -> SUPERSEDED"
          - "bubble-up: if client.status == APPLICANT -> CERTIFIED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/certificates/{id}/suspend (manual) OR system cascade (facility suspension / finding escalation / overdue fee sweep)"
        actor: CertificateOfficer | system
        preconditions: ["certificate.status == ACTIVE (ERR_CERTIFICATE_INVALID_STATE; system path unconditional on trigger)"]
        side_effects:
          - "bubble-up: if client.status == CERTIFIED and zero ACTIVE certificates remain -> client -> SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/certificates/{id}/reinstate"
        actor: CertificateOfficer
        preconditions:
          - "certificate.status == SUSPENDED (ERR_CERTIFICATE_INVALID_STATE)"
          - "every facility in facility_ids has status == APPROVED (ERR_FACILITY_NOT_APPROVED)"
          - "no findings with severity IN {MAJOR, CRITICAL} AND status IN {OPEN, REOPENED, ESCALATED} on in-scope facilities (ERR_OPEN_MAJOR_FINDINGS)"
          - "no Invoice of this client with status == OVERDUE (ERR_CERTIFICATION_FEE_UNPAID)"
        side_effects:
          - "valid_until unchanged (downtime is NOT compensated)"
          - "bubble-up: if client.status == SUSPENDED -> client -> CERTIFIED"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /api/certificates/{id}/revoke OR system (client withdraw/terminate cascade)"
        actor: CertificateOfficer | system
        preconditions: ["certificate.status IN {ACTIVE, SUSPENDED} (ERR_CERTIFICATE_INVALID_STATE; system path also covers DRAFT)"]
        side_effects: ["bubble-up: if client.status == CERTIFIED and zero ACTIVE certificates remain -> client -> SUSPENDED"]
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /api/certificates/{id}/revoke OR system"
        actor: CertificateOfficer | system
        preconditions: ["same as above"]
        side_effects: ["same as above"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep: current_utc > valid_until)"
        actor: system
        preconditions: []
        side_effects: ["bubble-up: if client.status == CERTIFIED and zero ACTIVE certificates remain -> client -> SUSPENDED"]
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (renewal-child certificate issued)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CertificateProduct
    initial_state: INCLUDED
    terminal_states: [REMOVED]
    transitions:
      - from: INCLUDED
        to: FROZEN
        trigger: "system (ingredient change-notice cascade HOP-3: owning product entered REVIEW_HOLD)"
        actor: system
        preconditions: []
        side_effects: ["certificate scope_status/count recompute (HOP-4)"]
      - from: FROZEN
        to: INCLUDED
        trigger: "system (product restored to CERTIFIABLE)"
        actor: system
        preconditions: []
        side_effects: ["certificate scope_status/count recompute"]
      - from: INCLUDED
        to: REMOVED
        trigger: "DELETE /api/certificate-products/{id} OR system (product withdrawn)"
        actor: CertificateOfficer | system
        preconditions: ["entry.status != REMOVED (ERR_CERTIFICATE_PRODUCT_INVALID_STATE)"]
        side_effects: ["certificate active_product_count -= 1; no refund of the product-addition fee"]
      - from: FROZEN
        to: REMOVED
        trigger: "DELETE /api/certificate-products/{id} OR system (product withdrawn)"
        actor: CertificateOfficer | system
        preconditions: ["same as above"]
        side_effects: ["certificate scope_status recomputed"]

  - entity: HolidayProductionWindow
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /api/holiday-windows/{id}/confirm"
        actor: CertificationReviewer
        preconditions:
          - "window.status == REQUESTED (ERR_WINDOW_INVALID_STATE)"
          - "facility.status == APPROVED (ERR_FACILITY_NOT_APPROVED)"
          - "scheme coverage: exists Certificate with facility IN facility_ids, status == ACTIVE, and (holiday_code IN {PASSOVER, ROSH_HASHANAH} -> scheme IN {KOSHER, DUAL}; holiday_code IN {RAMADAN, EID_AL_FITR} -> scheme IN {HALAL, DUAL}) (ERR_NO_COVERING_CERTIFICATE)"
          - "supervisor conflict: assigned supervisor has no other CONFIRMED window whose [window_start - 24h, window_end + 24h] intersects this window's [window_start - 24h, window_end + 24h] (ERR_SUPERVISOR_WINDOW_CONFLICT)"
        side_effects: ["assigned_supervisor_id = payload.assigned_supervisor_id"]
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /api/holiday-windows/{id}/complete"
        actor: FieldSupervisor
        preconditions: ["window.status == CONFIRMED (ERR_WINDOW_INVALID_STATE)", "X-User-ID == window.assigned_supervisor_id (ERR_NOT_ASSIGNED_INSPECTOR)", "current_utc >= window_end (ERR_VISIT_WINDOW_NOT_ACTIVE)"]
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /api/holiday-windows/{id}/cancel"
        actor: ClientContact | CertificationReviewer
        preconditions: ["window.status IN {REQUESTED, CONFIRMED} (ERR_WINDOW_INVALID_STATE)", "no Certificate with holiday_window_id == this AND status IN {DRAFT, ACTIVE, SUSPENDED} (ERR_WINDOW_REFERENCED_BY_CERTIFICATE)", "ClientContact actor: X-User-ID == facility.client_id (ERR_CLIENT_SCOPE_VIOLATION)"]
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/holiday-windows/{id}/cancel"
        actor: ClientContact | CertificationReviewer
        preconditions: ["same as above"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: agreement-create-stale-client
    parent_entity: AgencyClient
    write_endpoint: "POST /api/agreements"
    occ_field: expected_client_version
    description: |
      Creating a CertificationAgreement supersedes the client's current ACTIVE
      agreement (a legitimate, spec-allowed replacement), so the create is
      guarded by OCC on the client's version: a writer whose last-observed
      client version no longer matches the stored version is rejected, because
      its view of which agreement is ACTIVE (and of fee-relevant counters) is
      stale. The rejection is a pure stale-version check: a second, strictly
      sequential create carrying the superseded version deterministically fails.
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: annual_certification_fee
    trigger: "agreement activation (snapshot frozen onto annual_fee_snapshot_cents); RENEWAL invoice creation (recomputed at renewal instant)"
    algorithm: tiered_pricing
    formula: |
      facilities = Facility where client_id == client AND status != DECOMMISSIONED
      order facilities by created_at ASC (oldest first); facility #1 is the earliest-created
      tier_sum = 1 * TIER1_CENTS if count >= 1
               + max(0, min(count, 5) - 1) * TIER2_CENTS
               + max(0, count - 5) * TIER3_CENTS            (marginal tiers)
      copacker_surcharge = COPACKER_SURCHARGE_CENTS * count(facilities with facility_role == CO_PACKER)
      base = tier_sum + copacker_surcharge
      scheme_mult = 1.0 if scheme IN {KOSHER, HALAL} else 1.8 (DUAL)
      subtotal = round_half_up(base * scheme_mult)
      surcharge_pct = 0 if client.risk_tier == LOW; 5 if MEDIUM; 15 if HIGH
      total = subtotal + round_half_up(subtotal * surcharge_pct / 100)
    input_set: "client's facilities with status != DECOMMISSIONED (PENDING_REVIEW, APPROVED, SUSPENDED all counted — fees bill every registered site); risk tier at calc instant"
    constants:
      TIER1_CENTS: 120000
      TIER2_CENTS: 90000
      TIER3_CENTS: 70000
      COPACKER_SURCHARGE_CENTS: 25000
      DUAL_SCHEME_MULTIPLIER: 1.8
      MEDIUM_RISK_SURCHARGE_PCT: 5
      HIGH_RISK_SURCHARGE_PCT: 15
    precision: "integer cents, round_half_up at each marked step"
    variants:
      - name: activation_snapshot
        when: "POST /api/agreements/{id}/activate"
        difference: "result frozen on agreement.annual_fee_snapshot_cents; later facility/risk changes do NOT mutate the snapshot"
      - name: renewal_recompute
        when: "POST /api/certificates/{id}/renew"
        difference: "recomputed against current facility set and current risk tier; may diverge from the snapshot"

  - name: prorata_product_fee
    trigger: "POST /api/certificates/{id}/products (auto-created PRODUCT_ADDITION invoice), one line per added product"
    algorithm: forward_looking
    formula: |
      cycle_end_date = (billing_cycle == ANNIVERSARY) ? agreement.term_end_date : Dec 31 of year(addition_date)
      days_remaining = max(0, (cycle_end_date - addition_date).days)   # half-open [addition_date, cycle_end)
      raw_cents = per_product_fee_cents * days_remaining / DAYS_IN_CYCLE
      line_cents = round_half_up(raw_cents)                             # per LINE, before summing
    input_set: "the client's ACTIVE agreement (billing_cycle, term_end_date, per_product_fee_cents); addition_date = date(current_utc)"
    constants:
      DAYS_IN_CYCLE: 365
    precision: "integer cents per line, round_half_up"
    variants:
      - name: anniversary_cycle
        when: "ACTIVE agreement.billing_cycle == ANNIVERSARY"
        difference: "cycle_end_date = agreement.term_end_date (e.g. 2027-03-31 for a 2026-04-01 term start)"
      - name: calendar_year_cycle
        when: "ACTIVE agreement.billing_cycle == CALENDAR_YEAR"
        difference: "cycle_end_date = Dec 31 of the addition year; identical inputs yield a different fee whenever term_end_date != Dec 31"

  - name: product_addition_invoice_total
    trigger: "POST /api/certificates/{id}/products"
    algorithm: aggregation
    formula: |
      line_cents_i = round_half_up(per_product_fee_cents * days_remaining_i / DAYS_IN_CYCLE)   # per line FIRST
      subtotal_cents = SUM(line_cents_i)                                  # sum AFTER per-line rounding (pinned order; sum-then-round is FORBIDDEN)
      discount_cents = volume_discount(subtotal_cents)
      total_cents = subtotal_cents - discount_cents
    input_set: "all products named in the add call (single add = one line)"
    constants:
      DAYS_IN_CYCLE: 365
    precision: "integer cents; rounding order pinned: per-line round_half_up, then sum, then discount"
    variants: []

  - name: volume_discount
    trigger: "inside product_addition_invoice_total (and any multi-line PRODUCT_ADDITION invoice)"
    algorithm: threshold
    formula: |
      S = subtotal_cents (PRE-DISCOUNT)
      pct = 10 if S >= 200000; else 5 if S >= 100000; else 0
      discount_cents = round_half_up(S * pct / 100)
      EVALUATION ORDER PINNED: tier is keyed on the PRE-DISCOUNT subtotal exactly once;
      the post-discount total NEVER re-enters tier selection (no iteration), even when
      subtracting the discount drops the total below the tier threshold.
    input_set: "single invoice's subtotal_cents"
    constants:
      DISCOUNT_TIER2_CENTS: 200000
      DISCOUNT_TIER1_CENTS: 100000
      DISCOUNT_TIER2_PCT: 10
      DISCOUNT_TIER1_PCT: 5
    precision: "integer cents, round_half_up"
    variants: []

  - name: open_nc_score_and_risk_tier
    trigger: "finding created; finding status change; clock sweep escalation"
    algorithm: threshold
    formula: |
      open_nc_score = SUM(weight) over InspectionFinding where finding.facility.client_id == client
                      AND status IN {OPEN, REOPENED, ESCALATED}
      weight: MINOR=1, MAJOR=3, CRITICAL=8
      risk_tier = HIGH if open_nc_score >= 8; MEDIUM if >= 3; LOW if <= 2
    input_set: "findings at ALL of the client's facilities (any facility status); statuses REMEDIATION_SUBMITTED and VERIFIED_CLOSED excluded"
    constants:
      W_MINOR: 1
      W_MAJOR: 3
      W_CRITICAL: 8
      TIER_MEDIUM_MIN: 3
      TIER_HIGH_MIN: 8
    precision: "integer"
    variants: []

  - name: certificate_valid_until
    trigger: "POST /api/certificates/{id}/issue"
    algorithm: projection
    formula: |
      ANNUAL:   valid_until = issued_at + 365 days (exact datetime arithmetic)
      SEASONAL: valid_until = holiday_window.window_end (exact datetime)
      expiry rule (shared): certificate is EXPIRED only when current_utc > valid_until;
      at current_utc == valid_until it is still ACTIVE.
    input_set: "issued_at; for SEASONAL the linked HolidayProductionWindow.window_end"
    constants:
      ANNUAL_TERM_DAYS: 365
    precision: "second"
    variants:
      - name: annual_term
        when: "term_type == ANNUAL"
        difference: "issued_at + 365 days"
      - name: seasonal_term
        when: "term_type == SEASONAL"
        difference: "fixed to the holiday window end; identical issued_at yields a different (usually far shorter) valid_until"

  - name: kosherization_validity
    trigger: "POST /api/equipment-lines/{id}/kosherization-events; clock sweep"
    algorithm: decay_function
    formula: |
      kosherized_valid_until = event_utc + 72h
      kosherization_state = EXPIRED when current_utc > kosherized_valid_until (strict >; equal is still VALID)
    input_set: "single EquipmentLine"
    constants:
      KOSHERIZATION_VALIDITY_HOURS: 72
    precision: "second"
    variants: []

  - name: total_billed_cents
    trigger: "invoice created (any type); invoice voided"
    algorithm: aggregation
    formula: |
      client.total_billed_cents = SUM(invoice.total_cents) over Invoice where client_id == client
                                  AND status IN {ISSUED, OVERDUE, PAID}
    input_set: "all of the client's invoices; VOID excluded"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: renewal_window_check
    trigger: "POST /api/certificates/{id}/renew"
    algorithm: threshold
    formula: |
      renewal allowed iff (valid_until - 60 days) <= current_utc <= valid_until   # BOTH bounds INCLUSIVE
      renewal-child valid_until (set at its issuance) = parent.valid_until + 365 days
    input_set: "parent certificate valid_until; current_utc"
    constants:
      RENEWAL_WINDOW_DAYS: 60
    precision: "second"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is one of the six declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 1.5
    category: auth
    check: "Request body shape: required fields present, enum members legal, datetime parseable, end > start for time ranges"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles (incl. UNANNOUNCED visits creatable only by CertificationReviewer)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 2.5
    category: auth
    check: "Ownership/scope: ClientContact may only touch resources whose owning client_id == X-User-ID; FieldSupervisor may only start/complete/no-access/find on visits where inspector_user_id == X-User-ID and complete holiday windows where assigned_supervisor_id == X-User-ID"
    error_id: "ERR_CLIENT_SCOPE_VIOLATION | ERR_NOT_ASSIGNED_INSPECTOR"
    http_status: 403
    applies_to: "all mutating endpoints on client-owned or supervisor-assigned resources"
  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right; body-referenced ids exist; UNANNOUNCED visits are treated as non-existent for ClientContact (hidden, 404)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 3.5
    category: concurrency
    check: "expected_client_version == client.version on POST /api/agreements (OCC before any business logic)"
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412
    applies_to: "POST /api/agreements"
  - priority: 4
    category: state
    check: "Target entity in the required state for the requested transition (per §1.2), incl. client status gates on issue/activate and SEASONAL window CONFIRMED gate"
    error_id: "ERR_CLIENT_INVALID_STATE | ERR_FACILITY_INVALID_STATE | ERR_INGREDIENT_INVALID_STATE | ERR_PRODUCT_INVALID_STATE | ERR_PRODUCT_INGREDIENT_INVALID_STATE | ERR_VISIT_INVALID_STATE | ERR_FINDING_INVALID_STATE | ERR_AGREEMENT_INVALID_STATE | ERR_INVOICE_INVALID_STATE | ERR_CERTIFICATE_INVALID_STATE | ERR_CERTIFICATE_PRODUCT_INVALID_STATE | ERR_WINDOW_INVALID_STATE | ERR_EQUIPMENT_LINE_INVALID_STATE"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "Compliance gates: ANIMAL ingredient approval requires species documentation; facility approval requires COMPLETED INITIAL visit, no open MAJOR/CRITICAL findings, all lines assessed and non-COMPROMISED; certificate issue/reinstate requires in-scope facilities APPROVED and no open MAJOR+ findings; renewal blocked at risk_tier HIGH; finding verify requires a different supervisor than the visit inspector; holiday-window confirm requires a scheme-covering ACTIVE certificate"
    error_id: "ERR_ANIMAL_SOURCE_DOCUMENTATION_REQUIRED | ERR_INITIAL_VISIT_REQUIRED | ERR_OPEN_MAJOR_FINDINGS | ERR_EQUIPMENT_UNASSESSED | ERR_FACILITY_NOT_APPROVED | ERR_PRODUCT_NOT_CERTIFIABLE | ERR_CLIENT_HIGH_RISK | ERR_SEGREGATION_OF_DUTIES_VERIFICATION | ERR_NO_COVERING_CERTIFICATE"
    http_status: 422
    applies_to: "approve/issue/reinstate/renew/verify endpoints"
    note: "http_status per error: ERR_ANIMAL_SOURCE_DOCUMENTATION_REQUIRED 422; ERR_SEGREGATION_OF_DUTIES_VERIFICATION 403; ERR_CLIENT_HIGH_RISK 403; others 409"
  - priority: 6
    category: business_referential
    check: "Cross-entity reference integrity: body-referenced facilities/products/ingredients/window belong to the same client; linked ingredient APPROVED at link time; product not already listed on the certificate; no duplicate ACTIVE junction; agreement/certificate scheme covered by client scheme; ACTIVE agreement exists for fee-bearing operations"
    error_id: "ERR_CROSS_CLIENT_REFERENCE | ERR_INGREDIENT_NOT_APPROVED | ERR_PRODUCT_ALREADY_CERTIFIED | ERR_DUPLICATE_PRODUCT_INGREDIENT | ERR_SCHEME_MISMATCH | ERR_NO_ACTIVE_AGREEMENT"
    http_status: 422
    applies_to: "create/link endpoints"
    note: "ERR_INGREDIENT_NOT_APPROVED, ERR_PRODUCT_ALREADY_CERTIFIED, ERR_DUPLICATE_PRODUCT_INGREDIENT, ERR_NO_ACTIVE_AGREEMENT return 409; ERR_CROSS_CLIENT_REFERENCE and ERR_SCHEME_MISMATCH return 422"
  - priority: 7
    category: business_temporal
    check: "Time-window rules: visit start inside scheduled window; holiday window completion at/after window_end; renewal window [valid_until-60d, valid_until]; facility holiday-window half-open overlap; inspector visit overlap with +/-2h buffer; supervisor holiday-window overlap with +/-24h buffer"
    error_id: "ERR_VISIT_WINDOW_NOT_ACTIVE | ERR_RENEWAL_WINDOW_CLOSED | ERR_WINDOW_OVERLAP | ERR_INSPECTOR_SCHEDULE_CONFLICT | ERR_SUPERVISOR_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "visits, holiday-windows, renew"
  - priority: 8
    category: business_constraint
    check: "Uniqueness/cardinality: at most one ACTIVE agreement per client; at most one live renewal child per certificate; certificate scope non-empty at issue; product submit-review needs >= 1 ACTIVE junction; window not referenced by a live certificate at cancel; SEASONAL certificates not renewable; at most one non-VOID ANNUAL_CERTIFICATION invoice per agreement"
    error_id: "ERR_ACTIVE_AGREEMENT_EXISTS | ERR_RENEWAL_ALREADY_EXISTS | ERR_CERTIFICATE_SCOPE_EMPTY | ERR_PRODUCT_HAS_NO_INGREDIENTS | ERR_WINDOW_REFERENCED_BY_CERTIFICATE | ERR_CERTIFICATE_NOT_RENEWABLE | ERR_DUPLICATE_ANNUAL_INVOICE"
    http_status: 409
    applies_to: "activate/renew/issue/submit-review/cancel/invoices"
    note: "ERR_CERTIFICATE_SCOPE_EMPTY and ERR_PRODUCT_HAS_NO_INGREDIENTS return 422; others 409"
  - priority: 9
    category: business_fiscal
    check: "Fee gates: certificate issue requires the PAID fee invoice (ANNUAL_CERTIFICATION on the ACTIVE agreement, or RENEWAL on the renewal child); reinstate requires zero OVERDUE invoices for the client"
    error_id: ERR_CERTIFICATION_FEE_UNPAID
    http_status: 402
    applies_to: "issue, reinstate"
  - priority: 9.5
    category: business_fiscal
    check: "Issuance segregation of duties (evaluated AFTER the paid invoice is located at priority 9): invoice.paid_recorded_by != issuer's X-User-ID"
    error_id: ERR_SEGREGATION_OF_DUTIES_ISSUANCE
    http_status: 403
    applies_to: "POST /api/certificates/{id}/issue"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; compliance deadline engine) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default (before any set) is exactly 2026-08-01T00:00:00Z; the clock NEVER falls back to wall-clock. Side effects run a deterministic sweep in this order: (1) kosherization VALID->EXPIRED where current_utc > kosherized_valid_until; (2) findings OPEN/REOPENED past remediation_deadline -> ESCALATED with facility->certificate->client cascade; (3) certificates ACTIVE past valid_until -> EXPIRED with client recompute; (4) invoices ISSUED past due_date -> OVERDUE, and OVERDUE ANNUAL_CERTIFICATION/RENEWAL invoices past due_date+14d suspend the client's ACTIVE certificates; (5) agreements ACTIVE past term_end_date -> EXPIRED."
    roles: [AgencyAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["the five-step sweep described above"]

  # --- AgencyClient ---
  - method: POST
    path: "/api/clients"
    description: "Register a prospective client (status PROSPECT)"
    roles: [AccountManager]
    code: 201
    input: [legal_name, certification_scheme, contact_email]
    output: AgencyClient
    side_effects: ["status=PROSPECT, open_nc_score=0, risk_tier=LOW, total_billed_cents=0"]
  - method: GET
    path: "/api/clients"
    description: "List clients with pagination"
    roles: [AgencyAdmin, AccountManager, CertificationReviewer, FieldSupervisor, CertificateOfficer, ClientContact]
    code: 200
    input: ["status?", "certification_scheme?", "limit?", "offset?"]
    output: "AgencyClient[]"
    side_effects: []
  - method: GET
    path: "/api/clients/{id}"
    description: "Get one client"
    roles: [AgencyAdmin, AccountManager, CertificationReviewer, FieldSupervisor, CertificateOfficer, ClientContact]
    code: 200
    input: []
    output: AgencyClient
    side_effects: []
  - method: POST
    path: "/api/clients/{id}/submit-application"
    description: "Client submits its certification application: PROSPECT -> APPLICANT"
    roles: [ClientContact]
    code: 200
    input: []
    output: AgencyClient
    side_effects: []
  - method: POST
    path: "/api/clients/{id}/withdraw"
    description: "Client withdraws: -> WITHDRAWN; live certificates -> REVOKED"
    roles: [ClientContact]
    code: 200
    input: []
    output: AgencyClient
    side_effects: ["certificates in {DRAFT, ACTIVE, SUSPENDED} -> REVOKED"]
  - method: POST
    path: "/api/clients/{id}/terminate"
    description: "Agency terminates the client: -> TERMINATED; live certificates -> REVOKED"
    roles: [CertificateOfficer]
    code: 200
    input: []
    output: AgencyClient
    side_effects: ["certificates in {DRAFT, ACTIVE, SUSPENDED} -> REVOKED"]

  # --- Facility ---
  - method: POST
    path: "/api/facilities"
    description: "Register a facility (OWNED or CO_PACKER) in PENDING_REVIEW"
    roles: [ClientContact, AccountManager]
    code: 201
    input: [client_id, name, address, "facility_role?"]
    output: Facility
    side_effects: []
  - method: GET
    path: "/api/facilities"
    description: "List facilities"
    roles: [AgencyAdmin, AccountManager, CertificationReviewer, FieldSupervisor, CertificateOfficer, ClientContact]
    code: 200
    input: ["client_id?", "status?", "facility_role?", "limit?", "offset?"]
    output: "Facility[]"
    side_effects: []
  - method: GET
    path: "/api/facilities/{id}"
    description: "Get one facility"
    roles: [AgencyAdmin, AccountManager, CertificationReviewer, FieldSupervisor, CertificateOfficer, ClientContact]
    code: 200
    input: []
    output: Facility
    side_effects: []
  - method: POST
    path: "/api/facilities/{id}/approve"
    description: "Approve facility after review: gated on COMPLETED INITIAL visit, no open MAJOR/CRITICAL findings, all equipment assessed and non-COMPROMISED"
    roles: [CertificationReviewer]
    code: 200
    input: []
    output: Facility
    side_effects: []
  - method: POST
    path: "/api/facilities/{id}/suspend"
    description: "Manually suspend an APPROVED facility; cascades to certificates and client"
    roles: [CertificationReviewer]
    code: 200
    input: []
    output: Facility
    side_effects: ["in-scope ACTIVE certificates -> SUSPENDED", "client recompute (zero ACTIVE -> SUSPENDED)"]
