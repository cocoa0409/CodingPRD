              payload: {}
              as: FundManager
              captures: { cb_err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_RECYCLING_CAP_EXCEEDED"

      - name: fee_period_adjacency_boundary_allowed
        grounds:
          - validations[priority=9]
          - entities.ManagementFeeAccrual.fields.period_start
          - entities.ManagementFeeAccrual.fields.period_end
        distinguishing_aspect: |
          Empty-overlap / boundary-touch edge on a different endpoint (fee-accruals): half-open
          intervals make a period starting exactly at the prior period's end (2024-04-01) adjacent,
          not overlapping, so the accrual succeeds with 201 — distinct metric from the numeric recycling cap.
        test_recipe:
          setup:
            - "Fund with one ACCRUED accrual for 2024-01-01..2024-04-01; a new accrual starts exactly at 2024-04-01."
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP R", lp_type: "INSTITUTION", tax_id_last4: "9012" }
              as: FundAdministrator
              captures: { lpr_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "Adjacency Fund", vintage_year: 2024, target_size_cents: 6000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { adf_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${adf_id}", lp_id: "${lpr_id}", committed_cents: 6000000 }
              as: FundManager
              captures: { adc_id: "$.data.id" }
            - call: "POST /commitments/${adc_id}/accept"
              payload: {}
              as: FundManager
            - call: "POST /funds/${adf_id}/fee-accruals"
              payload: { period_start: "2024-01-01T00:00:00Z", period_end: "2024-04-01T00:00:00Z" }
              as: FundAdministrator
              captures: { adaccr1_id: "$.data.id" }
          trigger:
            - call: "POST /funds/${adf_id}/fee-accruals"
              payload: { period_start: "2024-04-01T00:00:00Z", period_end: "2024-07-01T00:00:00Z" }
              as: FundAdministrator
              captures: { adaccr2_id: "$.data.id" }
          assert:
            - "response.status == 201"
            - "ManagementFeeAccrual.${adaccr2_id}.status == ACCRUED"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: fund_activate_requires_active_commitment
        grounds:
          - state_machines.Fund.FORMING_to_INVESTING
          - entities.Commitment.fields.status
        distinguishing_aspect: |
          Fund->Commitment dependency: Fund FORMING->INVESTING is rejected (ERR_COMMITMENT_NOT_ACCEPTED)
          while the only commitment is still PENDING, and succeeds once that commitment is ACTIVE.
        test_recipe:
          setup:
            - "Fund FORMING with a single PENDING commitment (not yet accepted)."
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP S", lp_type: "INSTITUTION", tax_id_last4: "9013" }
              as: FundAdministrator
              captures: { lps_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "Activate Fund", vintage_year: 2024, target_size_cents: 6000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { acf_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${acf_id}", lp_id: "${lps_id}", committed_cents: 6000000 }
              as: FundManager
              captures: { acc_id: "$.data.id" }
          trigger:
            - call: "POST /funds/${acf_id}/activate"
              payload: {}
              as: FundManager
              captures: { ac_err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_COMMITMENT_NOT_ACCEPTED"

      - name: distribution_declare_requires_realized_investment
        grounds:
          - validations[priority=14]
          - entities.Investment.fields.status
          - entities.DistributionEvent.fields.source_investment_id
        distinguishing_aspect: |
          DistributionEvent->Investment dependency (a different entity pair than Fund->Commitment):
          declaring a distribution against an ACTIVE (un-realized) Investment is rejected with
          ERR_SOURCE_NOT_REALIZED, since realized proceeds are 0.
        test_recipe:
          setup:
            - "Fund INVESTING with an ACTIVE (not realized) investment and funded commitments."
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP T", lp_type: "INSTITUTION", tax_id_last4: "9014" }
              as: FundAdministrator
