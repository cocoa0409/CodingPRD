              payload: { issuer_id: "${i_id}", holder_name: "Big Fund LP" }
              as: ComplianceOfficer
              captures: { h_id: $.data.id }
            - call: "POST /beneficial-holders/${h_id}/positions"
              payload: { shares_delta: 50000, derivative_shares_delta: 0, effective_date: "2026-08-01" }
              as: ComplianceOfficer
            - call: "POST /beneficial-holders/${h_id}/file-schedule"
              payload: { schedule_type: "SCHEDULE_13G" }
              as: ComplianceOfficer
              captures: { st_filed: $.data.status }
            - call: "POST /beneficial-holders/${h_id}/positions"
              payload: { shares_delta: 9900, derivative_shares_delta: 0, effective_date: "2026-08-01" }
              as: ComplianceOfficer
            - call: "GET /beneficial-holders/${h_id}"
              as: ComplianceOfficer
              captures: { pct_mid: $.data.current_pct, st_mid: $.data.status }
          trigger:
            - call: "POST /beneficial-holders/${h_id}/positions"
              payload: { shares_delta: 100, derivative_shares_delta: 0, effective_date: "2026-08-01" }
              as: ComplianceOfficer
            - call: "GET /beneficial-holders/${h_id}"
              as: ComplianceOfficer
              captures: { pct_end: $.data.current_pct, st_end: $.data.status }
          assert:
            - "st_filed == FILED"
            - "pct_mid == 5.99 AND st_mid == FILED (delta 0.99 < 1.00: no amendment due)"
            - "pct_end == 6.00 AND st_end == AMENDMENT_REQUIRED (delta exactly 1.00 triggers, >= semantics)"

  # ============================================================ validations
