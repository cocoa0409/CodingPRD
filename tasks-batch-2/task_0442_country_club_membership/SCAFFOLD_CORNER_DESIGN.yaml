            - "response code 403"
            - "response error_id == ERR_UNAUTHORIZED"

      - name: member_cannot_resign_other_member
        claim_type: ownership_enforcement
        grounds: ["roles", "validations[priority=4]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "Member M1 calling POST /memberships/{M2}/resign on M2's membership (X-User-ID != M2) -> ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["Club; GOLF allows_golf; M1 and M2 activated (both ACTIVE)."]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "R2 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "GOLF", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 30000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000, allows_golf: true }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M1" }
              as: ClubManager
              captures: { m1_id: $.data.id }
            - call: "POST /memberships/${m1_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M2" }
              as: ClubManager
              captures: { m2_id: $.data.id }
            - call: "POST /memberships/${m2_id}/activate"
              payload: {}
              as: ClubManager
          trigger:
            - call: "POST /memberships/${m2_id}/resign"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code 403"
            - "response error_id == ERR_NOT_RESOURCE_OWNER"
            - "Membership.${m2_id}.account_status == ACTIVE (unchanged)"

      - name: missing_role_header_unauthenticated
        claim_type: authentication
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request to GET /clubs/{id} with no/invalid X-User-Role header -> ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["A club exists."]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "R3 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
