        distinguishing_aspect: "Request without X-User-Role returns 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /facilities"
              payload: { name: "F", address: "1 A", max_bather_capacity: 50, lap_lane_count: 2 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED"

