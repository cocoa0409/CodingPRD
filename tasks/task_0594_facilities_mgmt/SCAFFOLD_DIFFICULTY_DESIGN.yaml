              as: FacilityManager
            - call: "POST /fm/soft-service-shifts"
              payload: { building_id: "${b1}", vendor_id: "${v1}", zone_space_id: "${z1}", service_type: "JANITORIAL", start_at: "2026-04-01T10:00:00Z", end_at: "2026-04-01T12:00:00Z", planned_headcount: 2 }
              as: FacilityManager
            - call: "POST /fm/soft-service-shifts"
