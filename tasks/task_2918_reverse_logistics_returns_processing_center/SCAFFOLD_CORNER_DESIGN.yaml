            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-VA8", customer_reference: "CUST-VA8", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
