# =============================================================================
# PRD Benchmark Seed Tables — task_3231
# Trading Card Licensing, Print Runs & Redemption Fulfillment (Topps-style)
#
# §1.0–§1.7 live in this file. §1.8 is in SCAFFOLD_DIFFICULTY_DESIGN.yaml and
# §1.9 is in SCAFFOLD_CORNER_DESIGN.yaml — neither key appears here.
# =============================================================================

scenario: |
  Trading Card Licensing, Print Runs & Redemption Fulfillment (Topps): league
  and player association licensing with exclusivity terms and approval rights
  over designs, product line planning across base, insert and premium sets with
  configuration of packs, boxes and cases, print run decisions with announced
  or undisclosed quantities and serial numbering, autograph acquisition through
  player signing sessions with card stock logistics and authentication,
  redemption cards issued when an autograph is not available at packout with
  fulfillment timelines and substitution policy, distribution allocation across
  hobby shops, mass retail and direct channels, secondary market effects on
  future print decisions, quality issues, replacement policies and collector
  complaints

domain_name: trading-card-licensing-redemption
api_prefix: /api

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: quota_allocation
  complexity_layers:
    - version_pinning_on_approval
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: compound
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:

  - name: License
    parent: null
    common_fields: true
    fields:
      - name: grantor_name
        type: string
        source: input
        description: "Name of the granting body (league or player association)"
      - name: exclusivity_scope
        type: enum
        source: input
        description: "EXCLUSIVE | NON_EXCLUSIVE — whether the grantor may license a competing manufacturer"
        constraints: "EXCLUSIVE | NON_EXCLUSIVE"
      - name: term_starts_on
        type: datetime
        source: input
        description: "Inclusive start of the license term"
      - name: term_ends_on
        type: datetime
        source: input
        description: "Inclusive end of the license term"
      - name: approval_window_days
        type: integer
        source: input
        description: "SLA in days for the licensor to decide a submitted artwork approval"
        default: 10
      - name: rights_version
        type: integer
        source: system
        description: "Bumped when any other License mutation occurs; the version that is pinned into CardSet.rights_pinned_version at set approval"
      - name: status
        type: enum
        source: system
        description: "DRAFT -> ACTIVE -> SUSPENDED -> EXPIRED"
        constraints: "DRAFT | ACTIVE | SUSPENDED | EXPIRED"
      - name: set_count
        type: integer
        source: computed
        description: "Aggregate count: number of CardSets whose license_id points at this License, across all statuses"
      - name: approved_set_count
        type: integer
        source: computed
        description: "Aggregate count: number of CardSets under this License whose status is APPROVED"

  - name: ProductLine
    parent: License
    common_fields: true
    fields:
      - name: license_id
        type: string
        source: input
        description: "FK -> License.id; the license this product line is produced under"
      - name: line_name
        type: string
        source: input
        description: "Commercial name of the product line, e.g. '2026 Flagship Baseball'"
      - name: line_kind
        type: enum
        source: input
        description: "BASE | INSERT | PREMIUM — the assortment tier the line sits in"
        constraints: "BASE | INSERT | PREMIUM"
      - name: packs_per_box
        type: integer
        source: input
        description: "Configured pack count inside one box"
      - name: cards_per_pack
        type: integer
        source: input
        description: "Configured card count inside one pack"
      - name: boxes_per_case
        type: integer
        source: input
        description: "Configured box count inside one case"
      - name: cases_printed
        type: integer
        source: input
        description: "Number of cases scheduled for the production run of this line"
      - name: run_planned_on
        type: datetime
        source: input
        description: "The date the print run is scheduled (used for term-window and signer-availability checks)"
      - name: sets_per_case
        type: computed
        description: "Derived: boxes_per_case * packs_per_box * cards_per_pack. Always divisible by CARDS_PER_SET (100)."
        source: computed
      - name: allocated_cards
        type: computed
        description: "Derived: the per-set-then-sum tier-snapped card total produced by tier_snap_aggregate, recomputed whenever a CardSet's print run or tier changes"
        source: computed
      - name: status
        type: enum
        source: system
        description: "PLANNING -> READY_FOR_APPROVAL -> APPROVED -> IN_PRODUCTION -> PACKED_OUT"
        constraints: "PLANNING | READY_FOR_APPROVAL | APPROVED | IN_PRODUCTION | PACKED_OUT"

  - name: CardSet
    parent: ProductLine
    common_fields: true
    fields:
      - name: product_line_id
        type: string
        source: input
        description: "FK -> ProductLine.id; the product line this set belongs to"
      - name: set_name
        type: string
        source: input
        description: "Set name within the product line, e.g. 'Flagship Base'"
      - name: set_tier
        type: enum
        source: input
        description: "BASE | INSERT | PREMIUM — tier of this set inside the line"
        constraints: "BASE | INSERT | PREMIUM"
      - name: rights_pinned_version
        type: integer
        source: computed
        description: "Snapshot of License.rights_version captured when this CardSet is APPROVED; re-validated against the live License for every downstream mutation"
      - name: print_run_quantity
        type: integer
        source: input
        description: "Planned print run size; required for BASE sets, forbidden for INSERT/PREMIUM sets"
      - name: announced
        type: boolean
        source: input
        description: "Whether the print run quantity is published; false for a print_run_quantity of 0 (undisclosed)"
      - name: serial_numbered
        type: boolean
        source: input
        description: "Whether every produced card in this set carries a serial number"
      - name: print_run_status
        type: enum
        source: system
        description: "Compound-derived: UNDECIDED while no decision is frozen, LOCKED once one is, and then DISCLOSED or UNDISCLOSED according to whether the frozen decision announced its quantity"
        constraints: "UNDECIDED | LOCKED | DISCLOSED | UNDISCLOSED"
      - name: autograph_planned_count
        type: integer
        source: input
        description: "Number of autographed cards this set intends to pack out; multiply by SIGNER_ROYALTY_CENTS at signing"
      - name: autograph_secured_count
        type: integer
        source: computed
        description: "Aggregate: sum of QuantityDelivered across all SigningSession.allocation_lines whose player_id is a player associated with this set"
      - name: autograph_redemptions_outstanding
        type: integer
        source: computed
        description: "Aggregate: count of Redemption records for this set whose status is ISSUED or FULFILLED"
      - name: quality_claim_count
        type: integer
        source: computed
        description: "Aggregate: count of QualityClaim records for this set, across all statuses"
      - name: settled_complaint_count
        type: computed
        description: "Aggregate: count of CollectorComplaint records for this set whose status is APPROVED"

  - name: PackConfiguration
    parent: CardSet
    common_fields: true
    fields:
      - name: card_set_id
        type: string
        source: input
        description: "FK -> CardSet.id; the set this configuration describes"
      - name: config_serial
        type: integer
        source: input
        description: "Ordinal of this configuration within the set; the ordered ladder 1..30"
      - name: odd_value
        type: integer
        source: computed
        description: "Derived: the pack odd denominator quoted for every physical pack in the set, equal to the set's print_run_quantity"
      - name: base_packs
        type: integer
        source: input
        description: "Number of base cards guaranteed in a pack following this configuration"
      - name: insert_packs
        type: integer
        source: input
        description: "Number of INSERT-tier cards in a pack following this configuration"
      - name: premium_packs
        type: integer
        source: input
        description: "Number of PREMIUM-tier cards in a pack following this configuration"
      - name: total_cards
        type: integer
        source: computed
        description: "Derived: base_packs + insert_packs + premium_packs; must equal cards_per_pack"
      - name: status
        type: enum
        source: system
        description: "PROPOSED -> PUBLISHED -> SUPERSEDED"
        constraints: "PROPOSED | PUBLISHED | SUPERSEDED"

  - name: SigningSession
    parent: null
    common_fields: true
    fields:
      - name: signer_name
        type: string
        source: input
        description: "Player or celebrity name; the identity that governs autograph exclusivity across licenses"
      - name: signer_kind
        type: enum
        source: input
        description: "PLAYER_ASSOCIATION | INDEPENDENT — a PLAYER_ASSOCIATION signer is bound by the player-association License term window and its session is refused when the license is not in-force, whereas an INDEPENDENT signer carries no license tie and only the overlap rule applies"
        constraints: "PLAYER_ASSOCIATION | INDEPENDENT"
      - name: license_id
        type: string
        source: input
        description: "FK -> License.id; the license under which this signing is authorised"
      - name: scheduled_on
        type: datetime
        source: input
        description: "Local calendar date of the signing session; the signer-availability overlap window is [scheduled_on, scheduled_on + 1 day)"
      - name: ship_date
        type: datetime
        source: computed
        description: "Derived: scheduled_on - SIGNER_SHIP_LEAD_DAYS; the date card stock must leave the printer for the signing"
      - name: total_allocated_count
        type: integer
        source: computed
        description: "Derived: sum of QuantityDelivered across all allocation_lines, recomputed on every stock movement"
      - name: allocation_lines
        type: array
        source: input
        description: "Signer allocations; every line is { card_set_id, player_id, quantity_delivered }, quantity_delivered is a client-declared literal"
      - name: status
        type: enum
        source: system
        description: "SCHEDULED -> STOCK_PREPARED -> STOCK_SHIPPED -> COMPLETED / CANCELLED"
        constraints: "SCHEDULED | STOCK_PREPARED | STOCK_SHIPPED | COMPLETED | CANCELLED"

  - name: ArtworkApproval
    parent: CardSet
    common_fields: true
    fields:
      - name: card_set_id
        type: string
        source: input
        description: "FK -> CardSet.id; the set the artwork belongs to"
      - name: artwork_code
        type: string
        source: input
        description: "Internal artwork identifier"
      - name: approver_id
        type: string
        source: input
        description: "FK -> License.id; the licensor instance that holds the approval right for this artwork"
      - name: submitted_on
        type: datetime
        source: input
        description: "Date the artwork was submitted to the licensor; deadline is submitted_on + License.approval_window_days"
      - name: decided_on
        type: datetime
        source: input
        description: "Date the licensor decided the artwork; supplied only when invoking decide/reject"
      - name: status
        type: enum
        source: system
        description: "SUBMITTED -> APPROVED | REJECTED | EXPIRED"
        constraints: "SUBMITTED | APPROVED | REJECTED | EXPIRED"

  - name: PrintRunDecision
    parent: CardSet
    common_fields: true
    fields:
      - name: card_set_id
        type: string
        source: input
        description: "FK -> CardSet.id; the set whose print run is being frozen"
      - name: authority
        type: enum
        source: input
        description: "SALES_HISTORY | MARKET_DEMAND | BRAND_DIRECTIVE — the evidence authority the projection is built from"
        constraints: "SALES_HISTORY | MARKET_DEMAND | BRAND_DIRECTIVE"
      - name: proposed_against_line_version
        type: integer
        source: input
        description: "ProductLine.version the decision was proposed against; compared to the live ProductLine.version at approval via expected_product_line_version"
      - name: demand_multiplier
        type: number
        source: input
        description: "Multiplier applied to the authority projection to reach the final quantity, e.g. 1.05"
      - name: declared_quantity
        type: integer
        source: input
        description: "The quantity the decision declares; must equal the computed final_quantity for the response to be a valid decision"
      - name: announced
        type: boolean
        source: input
        description: "Whether the declared quantity is published to the market"
      - name: final_quantity
        type: integer
        source: computed
        description: "Derived: the projection result — base quantity from the authority, multiplied, clamped by tier floor/ceiling, then snapped to the tier MultipleOf quantum. Validated against declared_quantity at approval, not at proposal, so a proposal whose evidence later changes is rejected rather than silently rewritten."
      - name: proposed_on
        type: datetime
        source: input
        description: "Date the decision was proposed; the decision must be approved no more than PRINT_DECISION_VALIDITY_DAYS after this"
      - name: status
        type: enum
        source: system
        description: "PROPOSED -> APPROVED -> SUPERSEDED"
        constraints: "PROPOSED | APPROVED | SUPERSEDED"

  - name: Redemption
    parent: CardSet
    common_fields: true
    fields:
      - name: card_set_id
        type: string
        source: input
        description: "FK -> CardSet.id; the set the redemption card was found in"
      - name: redemption_code
        type: string
        source: input
        description: "Collector-facing redemption code, globally unique"
      - name: signer_name
        type: string
        source: input
        description: "The signer whose autograph the redemption card promises"
      - name: estimated_value_cents
        type: integer
        source: input
        description: "Scratch value of the promised autograph; the substitution ratio is driven off this field"
      - name: opened_on
        type: datetime
        source: input
        description: "Date the collector opened the redemption card; the fulfillment deadline is opened_on + deadline_days"
      - name: deadline_days
        type: integer
        source: computed
        description: "Derived from estimated_value_cents: 730 when >= SUBSTITUTION_DIVERGENCE_CENTS, else 365"
      - name: status
        type: enum
        source: system
        description: "ISSUED -> FULFILLED -> CLOSED / CANCELLED"
        constraints: "ISSUED | FULFILLED | CLOSED | CANCELLED"
      - name: collector_notification_count
        type: integer
        source: computed
        description: "Aggregate: count of CollectorNotification records filed against this Redemption, across all statuses"

  - name: CollectorNotification
    parent: Redemption
    common_fields: true
    fields:
      - name: redemption_id
        type: string
        source: input
        description: "FK -> Redemption.id; the redemption this notice is filed against"
      - name: notice_code
        type: string
        source: input
        description: "Notice code the collector selected, e.g. 'SUBST-90' or 'MISS-120'"
      - name: notice_text
        type: string
        source: computed
        description: "Server-rendered notice text for the code, including the computed deadline date"
      - name: opened_on
        type: datetime
        source: input
        description: "Date the notification was served on the collector"
      - name: status
        type: enum
        source: system
        description: "ISSUED | ACKNOWLEDGED -> SETTLED / RESOLVED"
        constraints: "ISSUED | ACKNOWLEDGED | SETTLED | RESOLVED"

  - name: DistributionAllocation
    parent: ProductLine
    common_fields: true
    fields:
      - name: product_line_id
        type: string
        source: input
        description: "FK -> ProductLine.id; the product line being allocated"
      - name: channel
        type: enum
        source: input
        description: "HOBBY | MASS | DIRECT — distribution channel"
        constraints: "HOBBY | MASS | DIRECT"
      - name: quantity_allocated
        type: integer
        source: input
        description: "Cases allocated to this channel; the sum across channels is pre-checked against the line's producible case count"
      - name: shipped_quantity
        type: integer
        source: system
        description: "Cases actually shipped to this channel; starts at 0"
      - name: effective_price_cents
        type: integer
        source: input
        description: "Per-case realized price for this channel, in cents"
      - name: status
        type: enum
        source: system
        description: "RESERVED -> UTF -> SHIPPED -> RECALLED"
        constraints: "RESERVED | UTF | SHIPPED | RECALLED"

  - name: QualityClaim
    parent: CardSet
    common_fields: true
    fields:
      - name: card_set_id
        type: string
        source: input
        description: "FK -> CardSet.id; the set the quality claim is against"
      - name: claim_type
        type: enum
        source: input
        description: "MISPRINT | DAMAGE | MISSING_HIT — the defect class"
        constraints: "MISPRINT | DAMAGE | MISSING_HIT"
      - name: severity
        type: enum
        source: input
        description: "MINOR | MAJOR | CRITICAL — drives the claim weight used by the credit formula"
        constraints: "MINOR | MAJOR | CRITICAL"
      - name: affected_quantity
        type: integer
        source: input
        description: "Number of cards affected by this claim"
      - name: filed_on
        type: datetime
        source: input
        description: "Date the claim was filed; the 30-day back-dated evidence window is measured from CLAIM_BACKDATE_NOW"
      - name: status
        type: enum
        source: system
        description: "FILED -> UNDER_REVIEW -> APPROVED -> CREDITED / DENIED"
        constraints: "FILED | UNDER_REVIEW | APPROVED | CREDITED | DENIED"
      - name: claim_weight
        type: integer
        source: computed
        description: "Derived: SEVERITY_WEIGHT[severity], used as a multiplier in the print-run floor calculation"

  - name: CollectorComplaint
    parent: CardSet
    common_fields: true
    fields:
      - name: card_set_id
        type: string
        source: input
        description: "FK -> CardSet.id; the set the complaint is about"
      - name: complaint_label
        type: string
        source: input
        description: "Collector-facing summary label for the complaint"
      - name: breach_reason
        type: enum
        source: input
        description: "UNDISCLOSED_PRINT_RUN | NO_REPLACEMENT_POLICY — the availability-authority defect class"
        constraints: "UNDISCLOSED_PRINT_RUN | NO_REPLACEMENT_POLICY"
      - name: claim_quantity
        type: integer
        source: input
        description: "Number of cards the collector asserts were affected"
      - name: status
        type: enum
        source: system
        description: "OPEN -> UNDER_REVIEW -> APPROVED / REJECTED / SETTLED"
        constraints: "OPEN | UNDER_REVIEW | APPROVED | REJECTED | SETTLED"

# =============================================================================
# Table 2: State Machine Table
# =============================================================================

# Semantics used throughout this table:
#   * "in-force license" for a License L means L.status == ACTIVE as of the
#     logical clock, AND term_starts_on <= now, AND now <= term_ends_on.
#     A License reaches ACTIVE only through POST /api/licenses/{id}/activate.
#   * CardSet.print_run_status is a compound field derived from the frozen
#     PrintRunDecision and CardSet.announced — it is recomputed on every
#     CardSet mutation, every PrintRunDecision transition, and on read.
#   * VERSION-BUMP DISCIPLINE. Only the transitions written out in this section
#     bump an entity's `version`. Merely recomputing a computed aggregate field
#     on another entity (e.g. refreshing CardSet.quality_claim_count when a
#     QualityClaim moves) does NOT bump that other entity's `version`. A
#     transition's `side_effects` that *does* bump another entity says so
#     explicitly, and those explicit bumps are the only ones that occur.
#   * PATCH targets. Only POST /api/product-lines/{id} accepts PATCH in this
#     scaffold, and only while the line is still PLANNING. Everything else is a
#     state, version or child-mutating action.
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # License — cyclic (SUSPENDED -> ACTIVE) with a terminal EXPIRED
  # ---------------------------------------------------------------------------
  - entity: License
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/licenses/{licenseId}/activate"
        actor: LicensingManager
        preconditions:
          - "term_starts_on <= current logical clock (ERR_LICENSE_TERM_NOT_STARTED)"
          - "current logical clock <= term_ends_on (ERR_LICENSE_TERM_EXPIRED)"
        side_effects:
          - "increments License.version by 1"
          - "increments License.rights_version by 1"
          - "sets License.status = ACTIVE"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/licenses/{licenseId}/suspend"
        actor: LicensingManager
        preconditions:
          - "License.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "increments License.version by 1"
          - "increments License.rights_version by 1"
          - "sets License.status = SUSPENDED"
          - "sets status = PLANNING on every ProductLine whose license_id == this License.id, cascading ProductLine.sets_per_case recompute"
          - "sets print_run_status = UNDECIDED on every CardSet whose product_line_id belongs to one of those ProductLines"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/licenses/{licenseId}/activate"
        actor: LicensingManager
        preconditions:
          - "term_starts_on <= current logical clock (ERR_LICENSE_TERM_NOT_STARTED)"
          - "current logical clock <= term_ends_on (ERR_LICENSE_TERM_EXPIRED)"
          - "at least one CardSet under this License has status APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "increments License.version by 1"
          - "increments License.rights_version by 1"
          - "sets License.status = ACTIVE"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /api/licenses/{licenseId}/expire"
        actor: LicensingManager
        preconditions:
          - "current logical clock > term_ends_on (ERR_LICENSE_TERM_NOT_ENDED)"
        side_effects:
          - "increments License.version by 1"
          - "increments License.rights_version by 1"
          - "sets status = PLANNING on every ProductLine whose license_id == this License.id"
          - "sets print_run_status = UNDECIDED on every CardSet under those ProductLines"

  # ---------------------------------------------------------------------------
  # ProductLine — branching fork-join: APPROVED -> IN_PRODUCTION -> PACKED_OUT
  #                                                    \-> READY_FOR_APPROVAL
  # PACKED_OUT -> READY_FOR_APPROVAL re-enters the approval fork.
  # ---------------------------------------------------------------------------
  - entity: ProductLine
    initial_state: PLANNING
    terminal_states: []
    transitions:
      - from: PLANNING
        to: READY_FOR_APPROVAL
        trigger: "POST /api/product-lines/{productLineId}/ready-for-approval"
        actor: ProductManager
        preconditions:
          - "the License referenced by license_id is in-force (ERR_LICENSE_NOT_IN_FORCE)"
          - "boxes_per_case * packs_per_box * cards_per_pack is divisible by CARDS_PER_SET (ERR_BOX_CONFIGURATION_INVALID)"
        side_effects:
          - "increments ProductLine.version by 1"
          - "sets ProductLine.status = READY_FOR_APPROVAL"
          - "sets sets_per_case = boxes_per_case * packs_per_box * cards_per_pack"

      - from: APPROVED
        to: IN_PRODUCTION
        trigger: "POST /api/product-lines/{productLineId}/start-production"
        actor: ProductionPlanner
        preconditions:
          - "the License referenced by license_id is in-force (ERR_LICENSE_NOT_IN_FORCE)"
          - "at least one CardSet under this line has print_run_status == LOCKED (ERR_NO_LOCKED_PRINT_RUN)"
        side_effects:
          - "increments ProductLine.version by 1"
          - "sets ProductLine.status = IN_PRODUCTION"
          - "increments License.version by 1"
          - "recomputes License.set_count and License.approved_set_count"

      - from: IN_PRODUCTION
        to: PACKED_OUT
        trigger: "POST /api/product-lines/{productLineId}/pack-out"
        actor: ProductionPlanner
        preconditions:
          - "every CardSet under this line whose autograph_planned_count > 0 has autograph_secured_count >= autograph_planned_count (ERR_AUTOGRAPH_QUANTITY_SHORT)"
        side_effects:
          - "increments ProductLine.version by 1"
          - "sets ProductLine.status = PACKED_OUT"
          - "sets Redemption.status = CLOSED on every Redemption whose card_set_id belongs to a CardSet under this line and whose status is FULFILLED"
          - "recomputes CardSet.autograph_redemptions_outstanding on every CardSet under this line"

      - from: PACKED_OUT
        to: READY_FOR_APPROVAL
        trigger: "POST /api/product-lines/{productLineId}/ready-for-approval"
        actor: ProductManager
        preconditions:
          - "the License referenced by license_id is in-force (ERR_LICENSE_NOT_IN_FORCE)"
          - "every CardSet under this line has at least one PackConfiguration with status PUBLISHED (ERR_PACK_CONFIG_MISSING)"
        side_effects:
          - "increments ProductLine.version by 1"
          - "sets ProductLine.status = READY_FOR_APPROVAL"
          - "sets on every CardSet under this line: print_run_status = UNDECIDED, announced = false"
          - "sets status = SUPERSEDED on every PackConfiguration belonging to those CardSets"
          - "sets status = SUPERSEDED on every PrintRunDecision belonging to those CardSets"

  # ---------------------------------------------------------------------------
  # CardSet — compound (print_run_status derives from the frozen decision)
  # ---------------------------------------------------------------------------
  - entity: CardSet
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /api/card-sets/{cardSetId}/submit"
        actor: ProductManager
        preconditions:
          - "the ProductLine referenced by product_line_id has status READY_FOR_APPROVAL (ERR_PRODUCT_LINE_NOT_READY)"
          - "at least one ArtworkApproval for this CardSet has status APPROVED (ERR_ARTWORK_NOT_APPROVED)"
          - "every ArtworkApproval for this CardSet has status != SUBMITTED (ERR_ARTWORK_APPROVAL_PENDING)"
        side_effects:
          - "increments CardSet.version by 1"
          - "sets CardSet.status = UNDER_REVIEW"

      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /api/card-sets/{cardSetId}/return-to-draft"
        actor: ProductManager
        preconditions:
          - "CardSet.status == UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "increments CardSet.version by 1"
          - "sets CardSet.status = DRAFT"
          - "sets status = REJECTED on every ArtworkApproval for this CardSet whose status is SUBMITTED"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/card-sets/{cardSetId}/approve"
        actor: ProductManager
        preconditions:
          - "expected_card_set_version == CardSet.version (ERR_STALE_VERSION)"
          - "the License referenced by the parent ProductLine is in-force (ERR_LICENSE_NOT_IN_FORCE)"
          - "the License was ACTIVE for the whole window [ArtworkApproval.submitted_on, current logical clock] (ERR_LICENSE_TERM_WINDOW_BREACH)"
          - "CardSet.rights_pinned_version == License.rights_version (ERR_RIGHTS_VERSION_MISMATCH)"
          - "set_tier == BASE implies print_run_quantity >= 1 (ERR_PRINT_RUN_REQUIRED)"
          - "set_tier == INSERT or set_tier == PREMIUM implies print_run_quantity == 0 (ERR_PRINT_RUN_NOT_ALLOWED)"
        side_effects:
          - "increments CardSet.version by 1"
          - "sets CardSet.status = APPROVED"
          - "sets CardSet.rights_pinned_version = License.rights_version"
          - "increments License.version by 1"
          - "recomputes License.set_count and License.approved_set_count"
          - "recomputes ProductLine.sets_per_case"

      - from: APPROVED
        to: IN_PRODUCTION
        trigger: "POST /api/card-sets/{cardSetId}/start-production"
        actor: ProductionPlanner
        preconditions:
          - "CardSet.print_run_status == LOCKED (ERR_PRINT_RUN_NOT_LOCKED)"
          - "CardSet.rights_pinned_version == License.rights_version (ERR_RIGHTS_VERSION_MISMATCH)"
          - "the parent ProductLine status ∈ {READY_FOR_APPROVAL, APPROVED, IN_PRODUCTION} (ERR_PRODUCT_LINE_STATE_BLOCKED)"
        side_effects:
          - "increments CardSet.version by 1"
          - "sets CardSet.status = IN_PRODUCTION"
          - "recomputes CardSet.quality_claim_count and CardSet.settled_complaint_count"

      - from: IN_PRODUCTION
        to: PACKED_OUT
        trigger: "POST /api/card-sets/{cardSetId}/pack-out"
        actor: ProductionPlanner
        preconditions:
          - "the parent ProductLine status == PACKED_OUT (ERR_PRODUCT_LINE_NOT_PACKED_OUT)"
          - "at least one PackConfiguration for this CardSet has status PUBLISHED (ERR_PACK_CONFIG_MISSING)"
        side_effects:
          - "increments CardSet.version by 1"
          - "sets CardSet.status = PACKED_OUT"
          - "for every SigningSession allocation line that names this CardSet: sets the CardSet autograph allocation tally as delivered and recomputes SigningSession.total_allocated_count"
          - "recomputes CardSet.autograph_secured_count"
          - "sets Redemption.status = CLOSED on every Redemption whose card_set_id == this CardSet.id and whose status is FULFILLED"
          - "recomputes CardSet.autograph_redemptions_outstanding"

  # ---------------------------------------------------------------------------
  # PackConfiguration — linear with a supersede edge
  # ---------------------------------------------------------------------------
  - entity: PackConfiguration
    initial_state: PROPOSED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: PUBLISHED
        trigger: "POST /api/pack-configurations/{packConfigurationId}/publish"
        actor: ProductManager
        preconditions:
          - "CardSet.status ∈ {APPROVED, IN_PRODUCTION} (ERR_SET_NOT_APPROVED)"
          - "config_serial ∈ 1..30 (ERR_CONFIG_SERIAL_OUT_OF_RANGE)"
          - "the ordered ladder holds: this configuration's config_serial must be current_published_count + 1 (ERR_CONFIG_LADDER_VIOLATION)"
          - "base_packs + insert_packs + premium_packs == the parent ProductLine.cards_per_pack (ERR_PACK_CONFIG_TOTAL_MISMATCH)"
          - "CardSet.announced == false implies insert_packs == 0 (ERR_PACK_ODDS_NOT_PUBLISHABLE)"
        side_effects:
          - "increments PackConfiguration.version by 1"
          - "sets PackConfiguration.status = PUBLISHED"
          - "sets PackConfiguration.odd_value = the CardSet print_run_quantity"
          - "increments CardSet.version by 1"

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /api/pack-configurations/{packConfigurationId}/supersede"
        actor: ProductManager
        preconditions:
          - "PackConfiguration.status == PUBLISHED (ERR_INVALID_STATE)"
        side_effects:
          - "increments PackConfiguration.version by 1"
          - "sets PackConfiguration.status = SUPERSEDED"
          - "increments CardSet.version by 1"
          - "sets status = PROPOSED on every PackConfiguration for this CardSet whose status is PUBLISHED"

  # ---------------------------------------------------------------------------
  # SigningSession — linear with a compensating CANCELLED edge
  # ---------------------------------------------------------------------------
  - entity: SigningSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: STOCK_PREPARED
        trigger: "POST /api/signing-sessions/{signingSessionId}/prepare-stock"
        actor: SigningCoordinator
        preconditions:
          - "the License referenced by license_id is in-force (ERR_LICENSE_NOT_IN_FORCE)"
          - "no overlapping SigningSession for the same signer_name with status ∈ {SCHEDULED, STOCK_PREPARED, STOCK_SHIPPED} (ERR_SIGNER_DOUBLE_BOOKED) — this holds for signer_kind INDEPENDENT as well as PLAYER_ASSOCIATION"
          - "every allocation line card_set_id resolves to a CardSet with status == APPROVED (ERR_CARD_SET_NOT_APPROVED)"
        side_effects:
          - "increments SigningSession.version by 1"
          - "sets SigningSession.status = STOCK_PREPARED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/signing-sessions/{signingSessionId}/cancel"
        actor: SigningCoordinator
        preconditions:
          - "SigningSession.status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "increments SigningSession.version by 1"
          - "sets SigningSession.status = CANCELLED"

      - from: STOCK_PREPARED
        to: STOCK_SHIPPED
        trigger: "POST /api/signing-sessions/{signingSessionId}/ship-stock"
        actor: SigningCoordinator
        preconditions:
          - "current logical clock >= SigningSession.ship_date (ERR_SIGNER_SHIP_WINDOW_CLOSED)"
          - "for every allocation line, the CardSet is APPROVED and its autograph_secured_count + quantity_delivered <= autograph_planned_count (ERR_AUTOGRAPH_ALLOCATION_EXCEEDS_PLAN)"
          - "for every allocation line, QuantityProduced(card_set_id, player_id) <= QuantityDelivered(card_set_id, player_id) as of current logical clock (ERR_CARD_STOCK_NOT_PRODUCED_AT_SIGNING)"
        side_effects:
          - "increments SigningSession.version by 1"
          - "sets SigningSession.status = STOCK_SHIPPED"
          - "for every allocation line: sets the CardSet autograph allocation tally as shipped and recomputes SigningSession.total_allocated_count"
          - "recomputes CardSet.autograph_secured_count and CardSet.autograph_planned_count on every referenced CardSet"
          - "increments License.version by 1"
          - "recomputes License.set_count and License.approved_set_count"

      - from: STOCK_SHIPPED
        to: COMPLETED
        trigger: "POST /api/signing-sessions/{signingSessionId}/complete"
        actor: AuthenticationOfficer
        preconditions:
          - "signer_attendance != NO_SHOW (ERR_AUTOGRAPH_AUTHENTICATION_FAILED)"
        side_effects:
          - "increments SigningSession.version by 1"
          - "sets SigningSession.status = COMPLETED"
          - "sets Redemption.status = FULFILLED on every Redemption whose status is ISSUED and whose signer_name matches this session's signer_name and whose card_set_id is named by one of this session's allocation lines"
          - "recomputes CardSet.autograph_redemptions_outstanding on every referenced CardSet"

  # ---------------------------------------------------------------------------
  # ArtworkApproval — branching with a system-driven EXPIRED edge
  # ---------------------------------------------------------------------------
  - entity: ArtworkApproval
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/artwork-approvals/{artworkApprovalId}/decide"
        actor: LicensorApprover
        preconditions:
          - "decision ∈ {APPROVE, REJECT} (ERR_INVALID_REQUEST)"
          - "decision == APPROVE (ERR_INVALID_STATE)"
          - "current logical clock <= submitted_on + License.approval_window_days (ERR_APPROVAL_WINDOW_CLOSED)"
          - "the License referenced by approver_id is in-force (ERR_LICENSE_NOT_IN_FORCE)"
        side_effects:
          - "increments ArtworkApproval.version by 1"
          - "sets ArtworkApproval.status = APPROVED"
          - "sets ArtworkApproval.decided_on = the supplied decided_on"
          - "increments License.version by 1"
          - "recomputes License.set_count and License.approved_set_count"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/artwork-approvals/{artworkApprovalId}/decide"
        actor: LicensorApprover
        preconditions:
          - "decision == REJECT (ERR_INVALID_STATE)"
          - "current logical clock <= submitted_on + License.approval_window_days (ERR_APPROVAL_WINDOW_CLOSED)"
        side_effects:
          - "increments ArtworkApproval.version by 1"
          - "sets ArtworkApproval.status = REJECTED"
          - "sets ArtworkApproval.decided_on = the supplied decided_on"
          - "sets CardSet.status = DRAFT on the CardSet referenced by card_set_id when that CardSet has no remaining APPROVED artwork"

      - from: SUBMITTED
        to: EXPIRED
        trigger: "system: evaluated when POST /_clock/set_current_utc advances the logical clock past the deadline"
        actor: system
        preconditions:
          - "current logical clock > submitted_on + License.approval_window_days"
        side_effects:
          - "increments ArtworkApproval.version by 1"
          - "sets ArtworkApproval.status = EXPIRED"
          - "leaves CardSet.status unchanged"

  # ---------------------------------------------------------------------------
  # PrintRunDecision — linear with a supersede edge
  # ---------------------------------------------------------------------------
  - entity: PrintRunDecision
    initial_state: PROPOSED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /api/print-run-decisions/{printRunDecisionId}/approve"
        actor: ProductionPlanner
        preconditions:
          - "CardSet.status == APPROVED (ERR_INVALID_STATE)"
          - "expected_card_set_version == CardSet.version (ERR_STALE_VERSION)"
          - "if authority == SALES_HISTORY: at least SALES_HISTORY_MIN_RECORDS CollectorComplaint records exist with card_set_id == this CardSet and filed_on within (CLAIM_BACKDATE_NOW - CLAIM_BACKDATE_WINDOW_DAYS, CLAIM_BACKDATE_NOW] (ERR_INSUFFICIENT_SALES_HISTORY)"
          - "if authority == MARKET_DEMAND: at least one DistributionAllocation exists for the parent ProductLine with channel ∈ {HOBBY, MASS} (ERR_MARKET_SIGNAL_UNAVAILABLE)"
          - "expected_product_line_version == the parent ProductLine.version (ERR_AUTHORITY_OUTDATED)"
          - "declared_quantity == the recomputed final_quantity (ERR_INVALID_REQUEST)"
          - "current logical clock <= proposed_on + PRINT_DECISION_VALIDITY_DAYS (ERR_PRINT_DECISION_WINDOW_CLOSED)"
        side_effects:
          - "increments PrintRunDecision.version by 1"
          - "sets PrintRunDecision.status = APPROVED"
          - "sets status = SUPERSEDED on every other PrintRunDecision for this CardSet whose status is APPROVED"
          - "sets CardSet.print_run_status = LOCKED"
          - "sets CardSet.print_run_quantity = PrintRunDecision.final_quantity"
          - "sets CardSet.announced = PrintRunDecision.announced"
          - "increments CardSet.version by 1"

      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /api/print-run-decisions/{printRunDecisionId}/supersede"
        actor: ProductionPlanner
        preconditions:
          - "PrintRunDecision.status == APPROVED (ERR_INVALID_STATE)"
          - "the parent ProductLine status ∈ {READY_FOR_APPROVAL, APPROVED} (ERR_PRODUCT_LINE_STATE_BLOCKED)"
        side_effects:
          - "increments PrintRunDecision.version by 1"
          - "sets PrintRunDecision.status = SUPERSEDED"
          - "sets CardSet.print_run_status = UNDECIDED"
          - "sets CardSet.print_run_quantity = 0 and CardSet.announced = false"
          - "increments CardSet.version by 1"

  # ---------------------------------------------------------------------------
  # Redemption — ISSUED -> FULFILLED -> CLOSED, with compensation to CANCELLED
  # ---------------------------------------------------------------------------
  - entity: Redemption
    initial_state: ISSUED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: ISSUED
        to: FULFILLED
        trigger: "system: fired when the Redemption's signer_name session reaches COMPLETED, or by POST /api/redemptions/{redemptionId}/fulfill"
        actor: RedemptionFulfilmentAnalyst
        preconditions:
          - "the CardSet referenced by card_set_id is in-force with respect to its pinned rights (rights_pinned_version == License.rights_version) (ERR_RIGHTS_VERSION_MISMATCH)"
        side_effects:
          - "increments Redemption.version by 1"
          - "sets Redemption.status = FULFILLED"
          - "increments License.version by 1 and recomputes License.set_count and License.approved_set_count"
          - "recomputes CardSet.autograph_redemptions_outstanding"

      - from: FULFILLED
        to: CLOSED
        trigger: "POST /api/redemptions/{redemptionId}/close"
        actor: RedemptionFulfilmentAnalyst
        preconditions:
          - "current logical clock <= opened_on + deadline_days (ERR_REDEMPTION_DEADLINE_EXCEEDED)"
        side_effects:
          - "increments Redemption.version by 1"
          - "sets Redemption.status = CLOSED"
          - "recomputes CardSet.autograph_redemptions_outstanding"

      - from: ISSUED
        to: CANCELLED
        trigger: "POST /api/redemptions/{redemptionId}/cancel"
        actor: RedemptionFulfilmentAnalyst
        preconditions:
          - "Redemption.status == ISSUED (ERR_INVALID_STATE)"
          - "current logical clock > opened_on + deadline_days (ERR_REDEMPTION_DEADLINE_NOT_EXCEEDED)"
        side_effects:
          - "increments Redemption.version by 1"
          - "sets Redemption.status = CANCELLED"
          - "sets Redemption.estimated_value_cents = 0"
          - "recomputes CardSet.autograph_redemptions_outstanding"

      - from: FULFILLED
        to: ISSUED
        trigger: "POST /api/quality-claims/{qualityClaimId}/credit"
        actor: QualityAnalyst
        note: "Compensating action driven by the quality-claim cascade: a claim credited against a redemption-backed autograph reverses the fulfilment."
        preconditions:
          - "at least one QualityClaim exists with card_set_id == this Redemption.card_set_id and status == APPROVED (ERR_QUALITY_CLAIM_NOT_APPROVED)"
        side_effects:
          - "increments Redemption.version by 1"
          - "sets Redemption.status = ISSUED"
          - "restores Redemption.estimated_value_cents to the value it held when the credit reversal began"
          - "recomputes CardSet.autograph_redemptions_outstanding"
          - "increments CardSet.version by 1"

  # ---------------------------------------------------------------------------
  # CollectorNotification — linear with a resolution fork
  # ---------------------------------------------------------------------------
  - entity: CollectorNotification
    initial_state: ISSUED
    terminal_states: [SETTLED, RESOLVED]
    transitions:
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /api/collector-notifications/{collectorNotificationId}/acknowledge"
        actor: RedemptionFulfilmentAnalyst
        preconditions:
          - "CollectorNotification.status == ISSUED (ERR_INVALID_STATE)"
        side_effects:
          - "increments CollectorNotification.version by 1"
          - "sets CollectorNotification.status = ACKNOWLEDGED"
          - "increments Redemption.version by 1"
          - "recomputes Redemption.collector_notification_count"

      - from: ISSUED
        to: SETTLED
        trigger: "POST /api/collector-notifications/{collectorNotificationId}/settle"
        actor: RedemptionFulfilmentAnalyst
        preconditions:
          - "redemption_status == CANCELLED (ERR_INVALID_STATE)"
          - "compensation_value_equals_scratch == true (ERR_INVALID_STATE)"
        side_effects:
          - "increments CollectorNotification.version by 1"
          - "sets CollectorNotification.status = SETTLED"
          - "recomputes Redemption.collector_notification_count"
          - "recomputes CardSet.settled_complaint_count"

      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /api/collector-notifications/{collectorNotificationId}/resolve"
        actor: RedemptionFulfilmentAnalyst
        preconditions:
          - "CollectorNotification.status == ACKNOWLEDGED (ERR_INVALID_STATE)"
        side_effects:
          - "increments CollectorNotification.version by 1"
          - "sets CollectorNotification.status = RESOLVED"
          - "recomputes Redemption.collector_notification_count"

  # ---------------------------------------------------------------------------
  # DistributionAllocation — linear
  # ---------------------------------------------------------------------------
  - entity: DistributionAllocation
    initial_state: RESERVED
    terminal_states: [SHIPPED, RECALLED]
    transitions:
      - from: RESERVED
        to: UTF
        trigger: "POST /api/distribution-allocations/{distributionAllocationId}/mark-utf"
        actor: DistributionManager
        preconditions:
          - "the parent ProductLine status == PACKED_OUT (ERR_PRODUCT_LINE_NOT_PACKED_OUT)"
          - "no other DistributionAllocation for the same ProductLine and channel with status == UTF (ERR_CHANNEL_ALREADY_UTF)"
        side_effects:
          - "increments DistributionAllocation.version by 1"
          - "sets DistributionAllocation.status = UTF"

      - from: UTF
        to: SHIPPED
        trigger: "POST /api/distribution-allocations/{distributionAllocationId}/ship"
        actor: DistributionManager
        preconditions:
          - "current logical clock >= the parent ProductLine.run_planned_on (ERR_DISTRIBUTION_WINDOW_CLOSED)"
          - "quantity_allocated <= the parent ProductLine cases_printed (ERR_ALLOCATION_EXCEEDS_PRINT_RUN)"
        side_effects:
          - "increments DistributionAllocation.version by 1"
          - "sets DistributionAllocation.status = SHIPPED"
          - "sets DistributionAllocation.shipped_quantity = quantity_allocated"
          - "increments ProductLine.version by 1"
          - "recomputes ProductLine.sets_per_case"

      - from: SHIPPED
        to: RECALLED
        trigger: "POST /api/distribution-allocations/{distributionAllocationId}/recall"
        actor: DistributionManager
        note: "Compensating action; drives ProductLine recall when the line's quality exposures exceed the threshold."
        preconditions:
          - "DistributionAllocation.status == SHIPPED (ERR_INVALID_STATE)"
        side_effects:
          - "increments DistributionAllocation.version by 1"
          - "sets DistributionAllocation.status = RECALLED"
          - "sets DistributionAllocation.shipped_quantity = 0"
          - "sets ProductLine.status = PLANNING repeatedly, once per recursion, until sum(affected_quantity) over QualityClaim records whose card_set_id belongs to this line and whose status == APPROVED exceeds QUALITY_RECALL_THRESHOLD"
          - "for every such recursion, sets status = SUPERSEDED on every PrintRunDecision belonging to the line's CardSets and sets print_run_status = UNDECIDED on those CardSets"
          - "increments ProductLine.version by 1"

  # ---------------------------------------------------------------------------
  # QualityClaim — linear with a deny fork
  # ---------------------------------------------------------------------------
  - entity: QualityClaim
    initial_state: FILED
    terminal_states: [CREDITED, DENIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /api/quality-claims/{qualityClaimId}/open-review"
        actor: QualityAnalyst
        preconditions:
          - "filed_on > CLAIM_BACKDATE_NOW - CLAIM_BACKDATE_WINDOW_DAYS (ERR_CLAIM_BACKDATE_EXCEEDED)"
        side_effects:
          - "increments QualityClaim.version by 1"
          - "sets QualityClaim.status = UNDER_REVIEW"
          - "recomputes CardSet.quality_claim_count"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/quality-claims/{qualityClaimId}/approve"
        actor: QualityAnalyst
        preconditions:
          - "QualityClaim.status == UNDER_REVIEW (ERR_INVALID_STATE)"
          - "affected_quantity >= 1 (ERR_CLAIM_QUANTITY_INVALID)"
        side_effects:
          - "increments QualityClaim.version by 1"
          - "sets QualityClaim.status = APPROVED"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /api/quality-claims/{qualityClaimId}/deny"
        actor: QualityAnalyst
        preconditions:
          - "QualityClaim.status == UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "increments QualityClaim.version by 1"
          - "sets QualityClaim.status = DENIED"

      - from: APPROVED
        to: CREDITED
        trigger: "POST /api/quality-claims/{qualityClaimId}/credit"
        actor: QualityAnalyst
        preconditions:
          - "QualityClaim.status == APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "increments QualityClaim.version by 1"
          - "sets QualityClaim.status = CREDITED"
          - "sets status = ISSUED on every Redemption whose card_set_id == this claim's card_set_id and whose status == FULFILLED"
          - "recomputes CardSet.autograph_redemptions_outstanding"
          - "increments CardSet.version by 1"

  # ---------------------------------------------------------------------------
  # CollectorComplaint — linear with a fork
  # ---------------------------------------------------------------------------
  - entity: CollectorComplaint
    initial_state: OPEN
    terminal_states: [APPROVED, REJECTED, SETTLED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /api/collector-complaints/{collectorComplaintId}/start-review"
        actor: CollectorSupportSpecialist
        preconditions:
          - "CollectorComplaint.status == OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "increments CollectorComplaint.version by 1"
          - "sets CollectorComplaint.status = UNDER_REVIEW"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/collector-complaints/{collectorComplaintId}/approve"
        actor: CollectorSupportSpecialist
        preconditions:
          - "if breach_reason == UNDISCLOSED_PRINT_RUN: the CardSet's print_run_status == UNDISCLOSED (ERR_UNDISCLOSED_RUN_DECLARED)"
          - "if breach_reason == NO_REPLACEMENT_POLICY: the CardSet's quality_claim_count == 0 (ERR_REPLACEMENT_POLICY_EXISTS)"
          - "claim_quantity >= 1 (ERR_CLAIM_QUANTITY_INVALID)"
        side_effects:
          - "increments CollectorComplaint.version by 1"
          - "sets CollectorComplaint.status = APPROVED"
          - "recomputes CardSet.settled_complaint_count on the parent CardSet"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /api/collector-complaints/{collectorComplaintId}/reject"
        actor: CollectorSupportSpecialist
        preconditions:
          - "CollectorComplaint.status == UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "increments CollectorComplaint.version by 1"
          - "sets CollectorComplaint.status = REJECTED"

      - from: APPROVED
        to: SETTLED
        trigger: "POST /api/collector-complaints/{collectorComplaintId}/settle"
        actor: CollectorSupportSpecialist
        preconditions:
          - "CollectorComplaint.status == APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "increments CollectorComplaint.version by 1"
          - "sets CollectorComplaint.status = SETTLED"

# =============================================================================
# Concurrency Rules (§1.2.1 — OCC on the parent's `version` only)
#
# Only true races appear here. Every write-write conflict that a second
# *sequential* request would observe and reject on a state field lives in the
# state machines above or in §1.4 instead — including the stale
# expected_product_line_version check on the print-run approval, which is a
# state precondition (the ProductLine.version is an observable field the second
# request reads), not a race, and is therefore not listed below.
# =============================================================================
concurrency_rules:

  - rule_id: print-run-decision-stale-set-version
    parent_entity: CardSet
    write_endpoint: "POST /api/print-run-decisions/{printRunDecisionId}/approve"
    occ_field: "expected_card_set_version"
    description: |
      Approving a PrintRunDecision against a CardSet whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just frozen a competing decision
      (which legitimately supersedes the prior one) and the current writer's
      view of the CardSet is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: card-set-approval-stale-version
    parent_entity: CardSet
    write_endpoint: "POST /api/card-sets/{cardSetId}/approve"
    occ_field: "expected_card_set_version"
    description: |
      Approving a CardSet whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer
      has just returned the set to DRAFT or attached artwork (both of which
      legitimately supersede the approval the current writer is holding in
      mind) and the current writer's view of the set is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
#
# Determinism pins that apply to every rule below:
#   * CLAIM_BACKDATE_NOW is the current logical clock at the instant the rule
#     is evaluated (for print_run_projection: the clock when the projection is
#     computed; for the back-date validation: the clock when review is opened).
#   * Every tier lookup is keyed on an explicit enum field, never on "best"
#     or "next".
#   * Every ordering that can change an observable value pins its sort key and
#     tie-break explicitly; `created_at ASC` is the only sanctioned fallback
#     and `id` is never a decision input.
# =============================================================================
calculations:

  - name: print_run_projection
    trigger: "POST /api/print-run-decisions (computed) and POST /api/print-run-decisions/{id}/approve (recomputed and compared)"
    algorithm: tiered_pricing
    formula: |
      delegation = the PrintRunDecision whose status == PROPOSED is being computed
      set        = CardSet referenced by delegation.card_set_id
      auth       = delegation.authority
      tier       = set.set_tier

      # ---- Step 1: base quantity from the authority ----
      if auth == SALES_HISTORY:
        history_count = count of CollectorComplaint c where
                          c.card_set_id == set.id
                          AND c.status ∈ {APPROVED, SETTLED}
                          AND c.filed_on >  CLAIM_BACKDATE_NOW - CLAIM_BACKDATE_WINDOW_DAYS
                          AND c.filed_on <= CLAIM_BACKDATE_NOW
        if history_count < SALES_HISTORY_MIN_RECORDS: raise ERR_INSUFFICIENT_SALES_HISTORY
        base = history_count * SALES_HISTORY_UNITS_PER_CLAIM
      elif auth == MARKET_DEMAND:
        signals = DistributionAllocation d where d.product_line_id == set.product_line_id
                  AND d.channel ∈ {HOBBY, MASS}
        if signals is empty: raise ERR_MARKET_SIGNAL_UNAVAILABLE
        base = sum(d.quantity_allocated for d in signals) * MARKET_DEMAND_UNITS_PER_CASE
      else:  # BRAND_DIRECTIVE
        base = BRAND_DIRECTIVE_BASE[tier]

      # ---- Step 2: demand multiplier ----
      scaled = base * delegation.demand_multiplier

      # ---- Step 3: tier floor and ceiling (floor applied first) ----
      floored = max(scaled, PROJECTION_FLOOR[tier])
      capped  = min(floored, PROJECTION_CEILING[tier])

      # ---- Step 4: snap to the tier quantum ----
      final_quantity = ceil(capped / PROJECTION_MULTIPLE_OF[tier]) * PROJECTION_MULTIPLE_OF[tier]
      return final_quantity
    input_set: |
      SALES_HISTORY counts CollectorComplaint rows in status APPROVED or
      SETTLED whose filed_on lies in the half-open window
      (CLAIM_BACKDATE_NOW - CLAIM_BACKDATE_WINDOW_DAYS, CLAIM_BACKDATE_NOW];
      UNDER_REVIEW, OPEN, and REJECTED rows are excluded. MARKET_DEMAND sums
      DistributionAllocation.quantity_allocated over HOBBY and MASS only —
      direct-channel reservations are excluded. BRAND_DIRECTIVE reads no
      market data at all. The returned quantity is CardSet.print_run_quantity
      after approval: 0 is not a valid projection output for any tier.
    constants:
      SALES_HISTORY_UNITS_PER_CLAIM: 1000
      SALES_HISTORY_MIN_RECORDS: 3
      MARKET_DEMAND_UNITS_PER_CASE: 10
      CLAIM_BACKDATE_WINDOW_DAYS: 30
      PROJECTION_FLOOR: { BASE: 1000, INSERT: 100, PREMIUM: 25 }
      PROJECTION_CEILING: { BASE: 50000, INSERT: 10000, PREMIUM: 2000 }
      PROJECTION_MULTIPLE_OF: { BASE: 500, INSERT: 100, PREMIUM: 25 }
      BRAND_DIRECTIVE_BASE: { BASE: 12000, INSERT: 3000, PREMIUM: 400 }
    precision: "Integers only; the quantum snap is a ceiling division, never round-half-up."
    variants:
      - name: authority_projection
        when: "authority ∈ {SALES_HISTORY, MARKET_DEMAND}"
        difference: "base is read from observed activity — claims filed or channel reservations — so two identical demand_multiplier and tier inputs produce different final_quantity whenever the observed window contents differ."
      - name: brand_floor_only_projection
        when: "authority == BRAND_DIRECTIVE"
        difference: "base ignores all observed activity and reads BRAND_DIRECTIVE_BASE[tier]; the result therefore equals the tier floor whenever the directive base sits below PROJECTION_FLOOR[tier], producing a different number for the same multiplier and tier."

  - name: print_run_quality_floor
    trigger: "POST /api/print-run-decisions/{id}/approve, evaluated between step 3 and step 4 of print_run_projection"
    algorithm: threshold
    formula: |
      relevant = QualityClaim q where q.card_set_id == set.id AND q.status == APPROVED
      verifiable_quantity = sum(q.affected_quantity for q in relevant)
      threshold           = REORDER_HIT_RATE * verifiable_quantity
      safety_floor        = ceil(threshold / PROJECTION_MULTIPLE_OF[tier]) * PROJECTION_MULTIPLE_OF[tier]
      final               = max(value_from_step_3, threshold, safety_floor)
      # then snap `final` to PROJECTION_MULTIPLE_OF[tier] and return
    input_set: |
      Only QualityClaim rows in status APPROVED enter verifiable_quantity.
      FILED, UNDER_REVIEW, DENIED, and CREDITED rows are excluded, so the
      safety floor rises the moment a claim is approved and falls back the
      moment that same claim is credited.
    constants:
      REORDER_HIT_RATE: 0.005
    precision: "Integers only; both the threshold and the safety floor are ceilings, never round-half-up."
    variants:
      - name: verifiable_floor_applied
        when: "at least one QualityClaim with status APPROVED exists for the set"
        difference: "the returned quantity is raised above the authority-only projection, and the raise is quantised to the tier multiple so a threshold of 2.0 units still lifts the result by a whole quantum."
      - name: verifiable_floor_absent
        when: "no QualityClaim with status APPROVED exists for the set"
        difference: "threshold is 0 and the returned quantity falls through to value_from_step_3 — the same inputs that produced the raised result now produce the lower one, so identical multiplier and tier yield two different numbers depending only on claim-review state."

  - name: quality_claim_weight
    trigger: "POST /api/quality-claims/{id}/approve and any read of QualityClaim.claim_weight"
    algorithm: weighted_scoring
    formula: |
      claim_weight = SEVERITY_WEIGHT[severity]
      SEVERITY_WEIGHT = { MINOR: 1, MAJOR: 2, CRITICAL: 3 }
      # claim_weight feeds the print-run safety floor and the recall threshold;
      # it is recomputed whenever severity is PATCHed before approval.
    input_set: "severity must be one of MINOR, MAJOR, CRITICAL; the enum is closed and every value has a weight."
    constants:
      SEVERITY_WEIGHT_MINOR: 1
      SEVERITY_WEIGHT_MAJOR: 2
      SEVERITY_WEIGHT_CRITICAL: 3
    precision: "Integer weight; no rounding."

  - name: autograph_royalty_charge
    trigger: "POST /api/signing-sessions/{id}/ship-stock, charged per allocation line"
    algorithm: aggregation
    formula: |
      for each allocation line L in SigningSession.allocation_lines:
        charge(L) = SIGNER_ROYALTY_CENTS * L.quantity_delivered
      session_royalty_cents = sum(charge(L) for L in allocation_lines)
      session.autograph_royalty_cents = session_royalty_cents
    input_set: |
      Every allocation line is charged, including lines whose CardSet later
      ships and lines whose CardSet is still merely APPROVED. Lines are
      processed in ascending (card_set_id, player_id) tuple order so the
      running accumulator is order-stable; the sum is commutative and the
      ordering pin exists only to make the per-line ledger entries reproducible.
    constants:
      SIGNER_ROYALTY_CENTS: 750
    precision: "Integer cents; no rounding."

  - name: redemption_substitution_ratio
    trigger: "POST /api/redemptions/{id}/cancel and POST /api/collector-notifications/{id}/settle"
    algorithm: threshold
    formula: |
      scratch      = Redemption.estimated_value_cents
      if scratch < SUBSTITUTION_DIVERGENCE_CENTS:
        ratio      = SUBSTITUTION_RATIO_LOW        # 1.00
        deadline   = SUBSTITUTION_DEADLINE_DAYS_LOW   # 365
      else:
        ratio      = SUBSTITUTION_RATIO_HIGH       # 1.25
        deadline   = SUBSTITUTION_DEADLINE_DAYS_HIGH  # 730
      compensation_value_cents = floor(ratio * scratch)
      # `deadline` is written to Redemption.deadline_days at creation
      # `compensation_value_cents` is the ledger credit booked by the settle
      # notification, and MUST be compared for exact equality when the
      # redemption is settled.
    input_set: "estimated_value_cents is a non-negative integer; the boundary is inclusive on the high side — 250000 already takes the high ratio."
    constants:
      SUBSTITUTION_DIVERGENCE_CENTS: 250000
      SUBSTITUTION_RATIO_LOW: 1.00
      SUBSTITUTION_RATIO_HIGH: 1.25
      SUBSTITUTION_DEADLINE_DAYS_LOW: 365
      SUBSTITUTION_DEADLINE_DAYS_HIGH: 730
    precision: "Integer cents; the ratio multiply is floored, never round-half-up."
    variants:
      - name: low_divergence_substitution
        when: "estimated_value_cents < 250000"
        difference: "ratio 1.00 leaves compensation_value_cents equal to scratch and fixes the consumer-facing deadline at 365 days."
      - name: high_divergence_substitution
        when: "estimated_value_cents >= 250000"
        difference: "ratio 1.25 raises compensation_value_cents 25% above scratch and doubles the deadline to 730 days, so two redemptions differing only in scratch value produce two different credited amounts and two different deadline dates."

  - name: distribution_share_projection
    trigger: "POST /api/distribution-allocations, pre-checked before the allocation is reserved"
    algorithm: waterfall_allocation
    formula: |
      total_cases  = the request's quantity_allocated for this channel
      other_cases  = sum(a.quantity_allocated for a in DistributionAllocation
                         where a.product_line_id == line.id
                         AND   a.id != <the allocation under check>)
      projected    = other_cases + total_cases
      capacity     = line.cases_printed * line.sets_per_case
      total_sets   = projected * line.sets_per_case
      if total_sets > capacity: raise ERR_ALLOCATION_EXCEEDS_PRINT_RUN
    input_set: |
      Every DistributionAllocation for the line is counted regardless of
      status; the pre-check runs before the allocation is written, so a
      rejected allocation never enters other_cases.
    constants:
      CASES_PER_SET: 1
    precision: "Integers only; the comparison is strict greater-than, so an allocation that lands exactly on capacity is accepted."
    variants:
      - name: within_capacity
        when: "projected cases * sets_per_case <= cases_printed * sets_per_case"
        difference: "the allocation is reserved and channel totals sum to projected."
      - name: exceeds_capacity
        when: "projected cases * sets_per_case > cases_printed * sets_per_case"
        difference: "the allocation is rejected with ERR_ALLOCATION_EXCEEDS_PRINT_RUN and the conserved channel sum is left at other_cases — the pre-check restores the exact pre-call quantity."

  - name: redemption_deadline
    trigger: "POST /api/redemptions (computed) and every read of Redemption.deadline_days"
    algorithm: threshold
    formula: |
      return SUBSTITUTION_DEADLINE_DAYS_HIGH if estimated_value_cents >= SUBSTITUTION_DIVERGENCE_CENTS
             else SUBSTITUTION_DEADLINE_DAYS_LOW
      # absolute deadline = opened_on + deadline_days, evaluated against the logical clock
    input_set: "estimated_value_cents is a non-negative integer; the boundary is inclusive on the high side."
    constants:
      SUBSTITUTION_DIVERGENCE_CENTS: 250000
      SUBSTITUTION_DEADLINE_DAYS_LOW: 365
      SUBSTITUTION_DEADLINE_DAYS_HIGH: 730
    precision: "Integer days."

  - name: tier_snap_aggregate
    trigger: "POST /api/distribution-allocations, whenever a line's producible card total is compared against its channel allocations"
    algorithm: aggregation
    formula: |
      # Evaluation order is PINNED and is the point of this rule:
      #   1. snap EACH CardSet's quantity to THAT set's own tier multiple
      #   2. THEN sum the snapped quantities into the line total
      # Snapping the line total once, against a single multiple, produces a
      # different (lower) number for the same inputs and is WRONG.
      per_set_i   = ceil(set_i.print_run_quantity / PROJECTION_MULTIPLE_OF[set_i.set_tier])
                    * PROJECTION_MULTIPLE_OF[set_i.set_tier]
      line_cards  = sum(per_set_i for each CardSet under the product line)
      # worked counter-example, three BASE sets at 1234 each:
      #   per-set-then-sum  = 1500 + 1500 + 1500 = 4500
      #   sum-then-snap     = ceil(3702 / 500) * 500 = 4000   <-- WRONG
    input_set: |
      Every CardSet under the product line is included regardless of status,
      because the line's producible total is the sum of what each set will run.
      Sets with print_run_quantity 0 contribute 0.
    constants:
      PROJECTION_MULTIPLE_OF: { BASE: 500, INSERT: 100, PREMIUM: 25 }
    precision: "Integers only; one ceiling division per set, never one across the line."

  - name: license_set_counts
    trigger: "any mutation of a CardSet, ArtworkApproval, Redemption, or SigningSession under a License"
    algorithm: aggregation
    formula: |
      license.set_count          = count(CardSet s where s.product_line_id.product.license_id == license.id)
      license.approved_set_count = count(CardSet s where s.product_line_id.product.license_id == license.id
                                          AND s.status == APPROVED)
      # Recomputed by full traversal, never incrementally, so a rollback of a
      # set out of APPROVED immediately lowers approved_set_count.
    input_set: "CardSets of every status count toward set_count; only APPROVED counts toward approved_set_count."
    constants: {}
    precision: "Integer counts."

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
#
# Priority order is domain-specific: licensing authority is the hard gate that
# precedes a resource's own existence (a set operating outside its license is
# void even when its id is wrong), collector-facing safety and truth-in-advertising
# checks precede financial window checks, and the print-run capacity check runs last.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: state
    check: "The License in the target resource's license chain is in-force: status == ACTIVE as of the logical clock, term_starts_on <= now, and now <= term_ends_on"
    error_id: ERR_LICENSE_NOT_IN_FORCE
    http_status: 403
    applies_to: ["POST /api/product-lines/{id}/ready-for-approval", "POST /api/product-lines/{id}/start-production", "POST /api/card-sets/{id}/submit", "POST /api/card-sets/{id}/approve", "POST /api/signing-sessions/{id}/prepare-stock", "POST /api/artwork-approvals/{id}/decide"]

  - priority: 3
    category: state
    check: "The License was ACTIVE for the whole window [ArtworkApproval.submitted_on, current logical clock]"
    error_id: ERR_LICENSE_TERM_WINDOW_BREACH
    http_status: 403
    applies_to: ["POST /api/card-sets/{id}/approve"]

  - priority: 4
    category: existence
    check: "The target resource id resolves; the specific ERR_<ENTITY>_NOT_FOUND for that resource is returned"
    error_id: "ERR_LICENSE_NOT_FOUND / ERR_PRODUCT_LINE_NOT_FOUND / ERR_CARD_SET_NOT_FOUND / ERR_PACK_CONFIGURATION_NOT_FOUND / ERR_SIGNING_SESSION_NOT_FOUND / ERR_ARTWORK_APPROVAL_NOT_FOUND / ERR_PRINT_RUN_DECISION_NOT_FOUND / ERR_REDEMPTION_NOT_FOUND / ERR_COLLECTOR_NOTIFICATION_NOT_FOUND / ERR_DISTRIBUTION_ALLOCATION_NOT_FOUND / ERR_QUALITY_CLAIM_NOT_FOUND / ERR_COLLECTOR_COMPLAINT_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints that take a resource id in the path"
  - priority: 4.5
    category: existence
    check: "A path-segment id on a collection endpoint resolves; the entity-specific ERR_<ENTITY>_NOT_FOUND for that collection is returned"
    error_id: "ERR_PRODUCT_LINE_NOT_FOUND / ERR_CARD_SET_NOT_FOUND / ERR_PACK_CONFIGURATION_NOT_FOUND / ERR_SIGNING_SESSION_NOT_FOUND / ERR_ARTWORK_APPROVAL_NOT_FOUND / ERR_PRINT_RUN_DECISION_NOT_FOUND / ERR_REDEMPTION_NOT_FOUND / ERR_COLLECTOR_NOTIFICATION_NOT_FOUND / ERR_DISTRIBUTION_ALLOCATION_NOT_FOUND / ERR_QUALITY_CLAIM_NOT_FOUND / ERR_COLLECTOR_COMPLAINT_NOT_FOUND"
    http_status: 404
    applies_to: "all GET endpoints whose path ends in a resource id"

  - priority: 5
    category: existence
    check: "Every referenced foreign key resolves to an existing instance (product_line_id, card_set_id, license_id, approver_id, redemption_id, player_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints whose input carries an id field"

  - priority: 6
    category: state
    check: "Version-pinned rights are still current: CardSet.rights_pinned_version == License.rights_version"
    error_id: ERR_RIGHTS_VERSION_MISMATCH
    http_status: 409
    applies_to: ["POST /api/card-sets/{id}/approve", "POST /api/card-sets/{id}/start-production", "POST /api/redemptions/{id}/fulfill"]

  - priority: 7
    category: state
    check: "The target resource is in the `from:` state its transition requires"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_safety
    check: "A quality claim is not back-dated beyond the evidence window: filed_on > CLAIM_BACKDATE_NOW - 30 days"
    error_id: ERR_CLAIM_BACKDATE_EXCEEDED
    http_status: 422
    applies_to: ["POST /api/quality-claims/{id}/open-review"]

  - priority: 9
    category: business_safety
    check: "The licensor decided the artwork inside its approval SLA: current logical clock <= submitted_on + License.approval_window_days"
    error_id: ERR_APPROVAL_WINDOW_CLOSED
    http_status: 422
    applies_to: ["POST /api/artwork-approvals/{id}/decide"]

  - priority: 10
    category: business_fiscal
    check: "The print-run decision is approved inside its validity window: current logical clock <= proposed_on + PRINT_DECISION_VALIDITY_DAYS"
    error_id: ERR_PRINT_DECISION_WINDOW_CLOSED
    http_status: 422
    applies_to: ["POST /api/print-run-decisions/{id}/approve"]

  - priority: 10.5
    category: business_constraint
    check: "The print-run decision's declared_quantity equals the recomputed final_quantity at approval time"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: ["POST /api/print-run-decisions/{id}/approve"]

  - priority: 11
    category: business_referential
    check: "At a signing session, the signer has physically produced at least as many cards of the allocated player as the line delivers: QuantityProduced(card_set_id, player_id) <= QuantityDelivered(card_set_id, player_id) as of the logical clock"
    error_id: ERR_CARD_STOCK_NOT_PRODUCED_AT_SIGNING
    http_status: 422
    applies_to: ["POST /api/signing-sessions/{id}/ship-stock"]

  - priority: 12
    category: business_constraint
    check: "An autograph allocation does not exceed the set's plan: CardSet.autograph_secured_count + quantity_delivered <= CardSet.autograph_planned_count"
    error_id: ERR_AUTOGRAPH_ALLOCATION_EXCEEDS_PLAN
    http_status: 422
    applies_to: ["POST /api/signing-sessions/{id}/ship-stock"]

  - priority: 13
    category: business_fiscal
    check: "Channel allocations do not exceed the producible case count: sum(quantity_allocated) * sets_per_case <= cases_printed * sets_per_case"
    error_id: ERR_ALLOCATION_EXCEEDS_PRINT_RUN
    http_status: 422
    applies_to: ["POST /api/distribution-allocations", "POST /api/distribution-allocations/{id}/ship", "POST /api/product-lines/{id}/start-production"]

  - priority: 14
    category: business_temporal
    check: "No overlapping SigningSession for the same signer_name: the half-open windows [scheduled_on, scheduled_on + 1 day) must be disjoint across sessions whose status ∈ {SCHEDULED, STOCK_PREPARED, STOCK_SHIPPED}"
    error_id: ERR_SIGNER_DOUBLE_BOOKED
    http_status: 409
    applies_to: ["POST /api/signing-sessions/{id}/prepare-stock"]

  - priority: 15
    category: business_constraint
    check: "A published pack configuration continues the ordered ladder: config_serial == current_published_count + 1 and config_serial ∈ 1..30"
    error_id: ERR_CONFIG_LADDER_VIOLATION
    http_status: 409
    applies_to: ["POST /api/pack-configurations/{id}/publish"]

  - priority: 16
    category: business_constraint
    check: "A pack configuration's card counts match the product line: base_packs + insert_packs + premium_packs == ProductLine.cards_per_pack"
    error_id: ERR_PACK_CONFIG_TOTAL_MISMATCH
    http_status: 422
    applies_to: ["POST /api/pack-configurations/{id}/publish"]

  - priority: 17
    category: business_fiscal
    check: "A redemption notification is settled inside the consumer-facing deadline: current logical clock <= opened_on + deadline_days, with the boundary treated as inclusive"
    error_id: ERR_REDEMPTION_DEADLINE_EXCEEDED
    http_status: 422
    applies_to: ["POST /api/redemptions/{id}/close", "POST /api/collector-notifications/{id}/settle"]

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:

  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: >
      Advance or rewind the server's logical clock. The server's startup
      default time is exactly 2026-09-01T00:00:00Z: before any call to this
      endpoint the logical clock reads 2026-09-01T00:00:00Z and never falls
      back to real wall-clock time. Every term-window, approval-window,
      validity-window, ship-window and redemption-deadline rule in this
      scaffold is evaluated against this clock.
    roles: [LicensingManager, PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: datetime }
    side_effects:
      - "sets the logical clock used by every temporal rule in this scaffold"
      - "expires every ArtworkApproval in SUBMITTED whose submitted_on + License.approval_window_days has passed"
      - "advances the logical clock is the only thing this endpoint writes; it mutates no other field"

  # --- License ---
  - method: POST
    path: "/api/licenses"
    description: "Register a license granted by a league or player association"
    roles: [LicensingManager]
    code: 201
    input: ["grantor_name", "exclusivity_scope", "term_starts_on", "term_ends_on", "approval_window_days?"]
    output: License
    side_effects: ["status=DRAFT, rights_version=0, set_count=0, approved_set_count=0"]

  - method: GET
    path: "/api/licenses"
    description: "List licenses, optionally filtered by status"
    roles: [LicensingManager, PlatformAdmin]
    code: 200
    input: ["status?", "grantor_name?", "limit?", "offset?"]
    output: License[]
    side_effects: []

  - method: GET
    path: "/api/licenses/{licenseId}"
    description: "Get a specific license"
    roles: [LicensingManager, ProductManager, PlatformAdmin]
    code: 200
    input: []
    output: License
    side_effects: []

  - method: POST
    path: "/api/licenses/{licenseId}/activate"
    description: "Activate a DRAFT license or reactivate a SUSPENDED one"
    roles: [LicensingManager]
    code: 200
    input: []
    output: License
    side_effects:
      - "status per License state machine"
      - "increments license.rights_version by 1"
      - "increments license.version by 1"

  - method: POST
    path: "/api/licenses/{licenseId}/suspend"
    description: "Suspend an ACTIVE license, cascading every product line under it to PLANNING"
    roles: [LicensingManager]
    code: 200
    input: []
    output: License
    side_effects:
      - "status=SUSPENDED"
      - "every ProductLine under this license -> PLANNING"
      - "every CardSet under those lines -> print_run_status=UNDECIDED"
      - "increments license.rights_version by 1 and license.version by 1"

  - method: POST
    path: "/api/licenses/{licenseId}/expire"
    description: "Expire an ACTIVE license past its term end"
    roles: [LicensingManager]
    code: 200
    input: []
    output: License
    side_effects:
      - "status=EXPIRED"
      - "every ProductLine under this license -> PLANNING"
      - "every CardSet under those lines -> print_run_status=UNDECIDED"
      - "increments license.version by 1"

  - method: GET
    path: "/api/licenses/{licenseId}/product-lines"
    description: "List the product lines produced under this license"
    roles: [LicensingManager, ProductManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ProductLine[]
    side_effects: []

  # --- ProductLine ---
  - method: POST
    path: "/api/product-lines"
    description: "Create a product line under a license"
    roles: [ProductManager]
    code: 201
    input: ["license_id", "line_name", "line_kind", "packs_per_box", "cards_per_pack", "boxes_per_case", "cases_printed", "run_planned_on"]
    output: ProductLine
    side_effects: ["status=PLANNING", "sets_per_case computed"]

  - method: GET
    path: "/api/product-lines"
    description: "List product lines, optionally filtered by license or status"
    roles: [ProductManager, ProductionPlanner, PlatformAdmin]
    code: 200
    input: ["license_id?", "line_kind?", "status?", "limit?", "offset?"]
    output: ProductLine[]
    side_effects: []

  - method: GET
    path: "/api/product-lines/{productLineId}"
    description: "Get a specific product line"
    roles: [ProductManager, ProductionPlanner, PlatformAdmin]
    code: 200
    input: []
    output: ProductLine
    side_effects: []

  - method: PATCH
    path: "/api/product-lines/{productLineId}"
    description: "Update a product line while it is still PLANNING"
    roles: [ProductManager]
    code: 200
    input: ["line_name?", "packs_per_box?", "cards_per_pack?", "boxes_per_case?", "cases_printed?", "run_planned_on?"]
    output: ProductLine
    side_effects: ["recomputes sets_per_case", "increments product_line.version by 1"]

  - method: POST
    path: "/api/product-lines/{productLineId}/ready-for-approval"
    description: "Move a product line into READY_FOR_APPROVAL, or back into it from PACKED_OUT"
    roles: [ProductManager]
    code: 200
    input: []
    output: ProductLine
    side_effects:
      - "status=READY_FOR_APPROVAL"
      - "on re-entry from PACKED_OUT: every CardSet under the line -> print_run_status=UNDECIDED, announced=false, every PackConfiguration and PrintRunDecision -> SUPERSEDED"
      - "increments product_line.version by 1"

  - method: POST
    path: "/api/product-lines/{productLineId}/start-production"
    description: "Start production on an approved product line"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductLine
    side_effects:
      - "status=IN_PRODUCTION"
      - "increments license.version by 1 and recomputes license.set_count and approved_set_count"

  - method: POST
    path: "/api/product-lines/{productLineId}/pack-out"
    description: "Pack out a product line in production"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductLine
    side_effects:
      - "status=PACKED_OUT"
      - "every FULFILLED Redemption under the line's sets -> CLOSED"
      - "recomputes CardSet.autograph_redemptions_outstanding"

  - method: GET
    path: "/api/product-lines/{productLineId}/card-sets"
    description: "List the card sets inside this product line"
    roles: [ProductManager, ProductionPlanner, PlatformAdmin]
    code: 200
    input: ["set_tier?", "status?", "limit?", "offset?"]
    output: CardSet[]
    side_effects: []

  - method: GET
    path: "/api/product-lines/{productLineId}/distribution-allocations"
    description: "List the channel allocations reserved against this product line"
    roles: [DistributionManager, ProductManager, PlatformAdmin]
    code: 200
    input: ["channel?", "status?", "limit?", "offset?"]
    output: DistributionAllocation[]
    side_effects: []

  # --- CardSet ---
  - method: POST
    path: "/api/card-sets"
    description: "Create a card set inside a product line"
    roles: [ProductManager]
    code: 201
    input: ["product_line_id", "set_name", "set_tier", "announced", "serial_numbered", "autograph_planned_count", "print_run_quantity?"]
    output: CardSet
    side_effects: ["status=DRAFT, print_run_status=UNDECIDED, rights_pinned_version=0"]

  - method: GET
    path: "/api/card-sets"
    description: "List card sets, optionally filtered by product line or tier"
    roles: [ProductManager, ProductionPlanner, QualityAnalyst, PlatformAdmin]
    code: 200
    input: ["product_line_id?", "set_tier?", "status?", "print_run_status?", "limit?", "offset?"]
    output: CardSet[]
    side_effects: []

  - method: GET
    path: "/api/card-sets/{cardSetId}"
    description: "Get a specific card set, including its compound print_run_status"
    roles: [ProductManager, ProductionPlanner, QualityAnalyst, RedemptionFulfilmentAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: CardSet
    side_effects: []

  - method: POST
    path: "/api/card-sets/{cardSetId}/submit"
    description: "Submit a card set with its approved artwork for licensing review"
    roles: [ProductManager]
    code: 200
    input: []
    output: CardSet
    side_effects: ["status=UNDER_REVIEW", "increments card_set.version by 1"]

  - method: POST
    path: "/api/card-sets/{cardSetId}/return-to-draft"
    description: "Return a card set under review to DRAFT"
    roles: [ProductManager]
    code: 200
    input: []
    output: CardSet
    side_effects:
      - "status=DRAFT"
      - "every SUBMITTED ArtworkApproval for this set -> REJECTED"
      - "increments card_set.version by 1"

  - method: POST
    path: "/api/card-sets/{cardSetId}/approve"
    description: "Approve a card set under review, pinning the license rights version"
    roles: [ProductManager]
    code: 200
    input: ["expected_card_set_version"]
    output: CardSet
    side_effects:
      - "status=APPROVED"
      - "rights_pinned_version = license.rights_version"
      - "increments card_set.version by 1, license.version by 1"
      - "recomputes license.set_count and license.approved_set_count"

  - method: POST
    path: "/api/card-sets/{cardSetId}/start-production"
    description: "Start card production for an approved set with a locked print run"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: CardSet
    side_effects: ["status=IN_PRODUCTION", "increments card_set.version by 1"]

  - method: POST
    path: "/api/card-sets/{cardSetId}/pack-out"
    description: "Pack out a card set in production"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: CardSet
    side_effects:
      - "status=PACKED_OUT"
      - "recomputes autograph_secured_count, autograph_redemptions_outstanding, quality_claim_count"
      - "every FULFILLED Redemption for this set -> CLOSED"

  - method: POST
    path: "/api/card-sets/{cardSetId}/redemptions"
    description: "Issue a redemption card when the signer's autograph was not available at packout"
    roles: [RedemptionFulfilmentAnalyst]
    code: 201
    input: ["redemption_code", "signer_name", "estimated_value_cents", "opened_on"]
    output: Redemption
    side_effects:
      - "status=ISSUED"
      - "deadline_days computed from estimated_value_cents"
      - "recomputes card_set.autograph_redemptions_outstanding"

  - method: GET
    path: "/api/card-sets/{cardSetId}/redemptions"
    description: "List the redemption cards issued from this set"
    roles: [RedemptionFulfilmentAnalyst, QualityAnalyst, PlatformAdmin]
    code: 200
    input: ["status?", "signer_name?", "limit?", "offset?"]
    output: Redemption[]
    side_effects: []

  - method: POST
    path: "/api/card-sets/{cardSetId}/quality-claims"
    description: "File a quality claim against a set"
    roles: [QualityAnalyst]
    code: 201
    input: ["claim_type", "severity", "affected_quantity", "filed_on"]
    output: QualityClaim
    side_effects: ["status=FILED", "claim_weight computed from severity", "recomputes card_set.quality_claim_count"]

  - method: GET
    path: "/api/card-sets/{cardSetId}/quality-claims"
    description: "List the quality claims filed against this set"
    roles: [QualityAnalyst, CollectorSupportSpecialist, PlatformAdmin]
    code: 200
    input: ["status?", "claim_type?", "limit?", "offset?"]
    output: QualityClaim[]
    side_effects: []

  - method: POST
    path: "/api/card-sets/{cardSetId}/complaints"
    description: "File a collector complaint against a set"
    roles: [CollectorSupportSpecialist]
    code: 201
    input: ["complaint_label", "breach_reason", "claim_quantity"]
    output: CollectorComplaint
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/api/card-sets/{cardSetId}/complaints"
    description: "List the collector complaints filed against this set"
    roles: [CollectorSupportSpecialist, QualityAnalyst, PlatformAdmin]
    code: 200
    input: ["status?", "breach_reason?", "limit?", "offset?"]
    output: CollectorComplaint[]
    side_effects: []

  - method: GET
    path: "/api/card-sets/{cardSetId}/approval-chain"
    description: "Return the approval chain links that precede this card set: its parent product line and that line's license"
    roles: [ProductManager, LicensingManager, PlatformAdmin]
    code: 200
    input: []
    output: { card_set: CardSet, product_line: ProductLine, license: License }
    side_effects: []

  - method: GET
    path: "/api/card-sets/{cardSetId}/pack-configurations"
    description: "List the pack configurations belonging to this set"
    roles: [ProductManager, ProductionPlanner, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PackConfiguration[]
    side_effects: []

  - method: GET
    path: "/api/card-sets/{cardSetId}/print-run-decisions"
    description: "List the print-run decisions proposed for this set"
    roles: [ProductionPlanner, ProductManager, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PrintRunDecision[]
    side_effects: []

  # --- PackConfiguration ---
  - method: POST
    path: "/api/pack-configurations"
    description: "Propose a pack configuration for a set"
    roles: [ProductManager]
    code: 201
    input: ["card_set_id", "config_serial", "base_packs", "insert_packs", "premium_packs"]
    output: PackConfiguration
    side_effects: ["status=PROPOSED", "total_cards computed"]

  - method: GET
    path: "/api/pack-configurations"
    description: "List pack configurations across sets, optionally filtered by the set they belong to"
    roles: [ProductManager, ProductionPlanner, PlatformAdmin]
    code: 200
    input: ["card_set_id?", "status?", "limit?", "offset?"]
    output: PackConfiguration[]
    side_effects: []

  - method: GET
    path: "/api/pack-configurations/{packConfigurationId}"
    description: "Get a specific pack configuration"
    roles: [ProductManager, ProductionPlanner, PlatformAdmin]
    code: 200
    input: []
    output: PackConfiguration
    side_effects: []

  - method: POST
    path: "/api/pack-configurations/{packConfigurationId}/publish"
    description: "Publish a proposed pack configuration, continuing the ordered ladder"
    roles: [ProductManager]
    code: 200
    input: []
    output: PackConfiguration
    side_effects:
      - "status=PUBLISHED"
      - "odd_value = the CardSet print_run_quantity"
      - "increments card_set.version by 1"

  - method: POST
    path: "/api/pack-configurations/{packConfigurationId}/supersede"
    description: "Supersede a published pack configuration, returning the set's stated odds to PROPOSED for revision"
    roles: [ProductManager]
    code: 200
    input: []
    output: PackConfiguration
    side_effects:
      - "status=SUPERSEDED"
      - "every other PUBLISHED PackConfiguration for the same CardSet -> PROPOSED"
      - "increments card_set.version by 1"

  # --- SigningSession ---
  - method: POST
    path: "/api/signing-sessions"
    description: "Book an autograph signing session with allocated card stock"
    roles: [SigningCoordinator]
    code: 201
    input: ["signer_name", "signer_kind", "license_id", "scheduled_on", "allocation_lines"]
    output: SigningSession
    side_effects: ["status=SCHEDULED", "ship_date = scheduled_on - SIGNER_SHIP_LEAD_DAYS"]

  - method: GET
    path: "/api/signing-sessions"
    description: "List signing sessions, optionally filtered by signer or by the license that authorises them"
    roles: [SigningCoordinator, ProductionPlanner, PlatformAdmin]
    code: 200
    input: ["signer_name?", "license_id?", "status?", "limit?", "offset?"]
    output: SigningSession[]
    side_effects: []

  - method: GET
    path: "/api/signing-sessions/{signingSessionId}"
    description: "Get a specific signing session"
    roles: [SigningCoordinator, AuthenticationOfficer, PlatformAdmin]
    code: 200
    input: []
    output: SigningSession
    side_effects: []

  - method: POST
    path: "/api/signing-sessions/{signingSessionId}/prepare-stock"
    description: "Prepare the card stock for a signing session"
    roles: [SigningCoordinator]
    code: 200
    input: []
    output: SigningSession
    side_effects: ["status=STOCK_PREPARED", "increments signing_session.version by 1"]

  - method: POST
    path: "/api/signing-sessions/{signingSessionId}/ship-stock"
    description: "Ship the prepared card stock to the signer and charge the royalty"
    roles: [SigningCoordinator]
    code: 200
    input: []
    output: SigningSession
    side_effects:
      - "status=STOCK_SHIPPED"
      - "autograph_royalty_cents = SIGNER_ROYALTY_CENTS * sum(quantity_delivered)"
      - "recomputes CardSet.autograph_secured_count and autograph_planned_count"
      - "increments license.version by 1 and recomputes license.set_count and approved_set_count"

  - method: POST
    path: "/api/signing-sessions/{signingSessionId}/complete"
    description: "Complete a signing session and authenticate the returned autographs"
    roles: [AuthenticationOfficer]
    code: 200
    input: ["signer_attendance"]
    output: SigningSession
    side_effects:
      - "status=COMPLETED"
      - "every ISSUED Redemption for this signer in this session's sets -> FULFILLED"
      - "recomputes CardSet.autograph_redemptions_outstanding"

  - method: POST
    path: "/api/signing-sessions/{signingSessionId}/cancel"
    description: "Cancel a scheduled signing session"
    roles: [SigningCoordinator]
    code: 200
    input: []
    output: SigningSession
    side_effects: ["status=CANCELLED", "increments signing_session.version by 1"]

  # --- ArtworkApproval ---
  - method: POST
    path: "/api/card-sets/{cardSetId}/artwork-approvals"
    description: "Submit artwork to the licensor for approval"
    roles: [ProductManager]
    code: 201
    input: ["artwork_code", "approver_id", "submitted_on"]
    output: ArtworkApproval
    side_effects: ["status=SUBMITTED", "increments card_set.version by 1"]

  - method: GET
    path: "/api/card-sets/{cardSetId}/artwork-approvals"
    description: "List the artwork approvals for this set"
    roles: [ProductManager, LicensorApprover, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ArtworkApproval[]
    side_effects: []

  - method: GET
    path: "/api/artwork-approvals"
    description: "List artwork approvals across sets, optionally filtered by set or by the licensor holding the approval right"
    roles: [ProductManager, LicensorApprover, PlatformAdmin]
    code: 200
    input: ["card_set_id?", "approver_id?", "status?", "limit?", "offset?"]
    output: ArtworkApproval[]
    side_effects: []

  - method: GET
    path: "/api/artwork-approvals/{artworkApprovalId}"
    description: "Get a specific artwork approval"
    roles: [ProductManager, LicensorApprover, PlatformAdmin]
    code: 200
    input: []
    output: ArtworkApproval
    side_effects: []

  - method: POST
    path: "/api/artwork-approvals/{artworkApprovalId}/decide"
    description: "Record the licensor's approve-or-reject decision on submitted artwork"
    roles: [LicensorApprover]
    code: 200
    input: ["decision", "decided_on"]
    output: ArtworkApproval
    side_effects:
      - "status=APPROVED or REJECTED"
      - "REJECT with no remaining APPROVED artwork for the set -> card_set.status=DRAFT"
      - "increments license.version by 1 and recomputes license.set_count and approved_set_count"

  # --- PrintRunDecision ---
  - method: POST
    path: "/api/print-run-decisions"
    description: "Propose a print-run decision for an approved set; final_quantity is computed from the authority"
    roles: [ProductionPlanner]
    code: 201
    input: ["card_set_id", "authority", "proposed_against_line_version", "demand_multiplier", "declared_quantity", "announced", "proposed_on"]
    output: PrintRunDecision
    side_effects: ["status=PROPOSED", "final_quantity computed via print_run_projection"]

  - method: GET
    path: "/api/print-run-decisions"
    description: "List print-run decisions across sets, optionally filtered by the set they were proposed for"
    roles: [ProductionPlanner, ProductManager, PlatformAdmin]
    code: 200
    input: ["card_set_id?", "status?", "authority?", "limit?", "offset?"]
    output: PrintRunDecision[]
    side_effects: []

  - method: GET
    path: "/api/print-run-decisions/{printRunDecisionId}"
    description: "Get a specific print-run decision"
    roles: [ProductionPlanner, ProductManager, PlatformAdmin]
    code: 200
    input: []
    output: PrintRunDecision
    side_effects: []

  - method: POST
    path: "/api/print-run-decisions/{printRunDecisionId}/approve"
    description: "Approve a proposed print-run decision, freezing the set's print run"
    roles: [ProductionPlanner]
    code: 200
    input: ["expected_card_set_version", "expected_product_line_version"]
    output: PrintRunDecision
    side_effects:
      - "status=APPROVED"
      - "every other APPROVED PrintRunDecision for this CardSet -> SUPERSEDED"
      - "card_set.print_run_status=LOCKED, print_run_quantity=final_quantity, announced=decision.announced"
      - "increments card_set.version by 1"

  - method: POST
    path: "/api/print-run-decisions/{printRunDecisionId}/supersede"
    description: "Supersede an approved print-run decision while the line has not shipped"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: PrintRunDecision
    side_effects:
      - "status=SUPERSEDED"
      - "card_set.print_run_status=UNDECIDED, print_run_quantity=0, announced=false"
      - "increments card_set.version by 1"

  - method: GET
    path: "/api/card-sets/{cardSetId}/print-run-summary"
    description: "Return the set's compound print-run state: its status, quantity, announced flag, and the decision it was frozen from"
    roles: [ProductionPlanner, ProductManager, QualityAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: { print_run_status: enum, print_run_quantity: integer, announced: boolean, frozen_decision: PrintRunDecision }
    side_effects: []

  # --- Redemption ---
  - method: GET
    path: "/api/redemptions"
    description: "List redemption cards, optionally filtered by signer or status"
    roles: [RedemptionFulfilmentAnalyst, QualityAnalyst, PlatformAdmin]
    code: 200
    input: ["card_set_id?", "signer_name?", "status?", "limit?", "offset?"]
    output: Redemption[]
    side_effects: []

  - method: GET
    path: "/api/redemptions/{redemptionId}"
    description: "Get a specific redemption card"
    roles: [RedemptionFulfilmentAnalyst, QualityAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: Redemption
    side_effects: []

  - method: POST
    path: "/api/redemptions/{redemptionId}/fulfill"
    description: "Fulfil a redemption card once its signer has delivered the autograph"
    roles: [RedemptionFulfilmentAnalyst]
    code: 200
    input: []
    output: Redemption
    side_effects:
      - "status=FULFILLED"
      - "increments license.version by 1 and recomputes license.set_count and approved_set_count"
      - "recomputes card_set.autograph_redemptions_outstanding"

  - method: POST
    path: "/api/redemptions/{redemptionId}/close"
    description: "Close a fulfilled redemption inside its consumer deadline"
    roles: [RedemptionFulfilmentAnalyst]
    code: 200
    input: []
    output: Redemption
    side_effects: ["status=CLOSED", "recomputes card_set.autograph_redemptions_outstanding"]

  - method: POST
    path: "/api/redemptions/{redemptionId}/cancel"
    description: "Cancel an unfulfilled redemption once its deadline has passed, booking the substitution credit"
    roles: [RedemptionFulfilmentAnalyst]
    code: 200
    input: []
    output: Redemption
    side_effects:
      - "status=CANCELLED"
      - "estimated_value_cents set to 0"
      - "recomputes card_set.autograph_redemptions_outstanding"

  - method: POST
    path: "/api/redemptions/{redemptionId}/notifications"
    description: "Serve a substitution or missed-card notice on the collector"
    roles: [RedemptionFulfilmentAnalyst]
    code: 201
    input: ["notice_code", "opened_on"]
    output: CollectorNotification
    side_effects: ["status=ISSUED", "notice_text rendered from the code", "recomputes redemption.collector_notification_count"]

  - method: GET
    path: "/api/redemptions/{redemptionId}/notifications"
    description: "List the collector notifications served for this redemption"
    roles: [RedemptionFulfilmentAnalyst, QualityAnalyst, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CollectorNotification[]
    side_effects: []

  # --- CollectorNotification ---
  - method: GET
    path: "/api/collector-notifications"
    description: "List collector notifications across redemptions, optionally filtered by the redemption they were served against"
    roles: [RedemptionFulfilmentAnalyst, QualityAnalyst, PlatformAdmin]
    code: 200
    input: ["redemption_id?", "status?", "limit?", "offset?"]
    output: CollectorNotification[]
    side_effects: []

  - method: GET
    path: "/api/collector-notifications/{collectorNotificationId}"
    description: "Get a specific collector notification"
    roles: [RedemptionFulfilmentAnalyst, QualityAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: CollectorNotification
    side_effects: []

  - method: POST
    path: "/api/collector-notifications/{collectorNotificationId}/acknowledge"
    description: "Acknowledge a served notice, stopping the missed-card escalation path"
    roles: [RedemptionFulfilmentAnalyst]
    code: 200
    input: []
    output: CollectorNotification
    side_effects:
      - "status=ACKNOWLEDGED"
      - "increments redemption.version by 1"
      - "recomputes redemption.collector_notification_count"

  - method: POST
    path: "/api/collector-notifications/{collectorNotificationId}/settle"
    description: "Settle a substitution notice against a cancelled redemption with the exact compensation credit"
    roles: [RedemptionFulfilmentAnalyst]
    code: 200
    input: ["redemption_status", "compensation_value_equals_scratch"]
    output: CollectorNotification
    side_effects:
      - "status=SETTLED"
      - "recomputes redemption.collector_notification_count and card_set.settled_complaint_count"

  - method: POST
    path: "/api/collector-notifications/{collectorNotificationId}/resolve"
    description: "Resolve an acknowledged notice with no substitution credit"
    roles: [RedemptionFulfilmentAnalyst]
    code: 200
    input: []
    output: CollectorNotification
    side_effects: ["status=RESOLVED", "recomputes redemption.collector_notification_count"]

  # --- DistributionAllocation ---
  - method: POST
    path: "/api/distribution-allocations"
    description: "Reserve cases of a product line for a distribution channel"
    roles: [DistributionManager]
    code: 201
    input: ["product_line_id", "channel", "quantity_allocated", "effective_price_cents"]
    output: DistributionAllocation
    side_effects: ["status=RESERVED", "shipped_quantity=0"]

  - method: GET
    path: "/api/distribution-allocations"
    description: "List distribution allocations across product lines, optionally filtered by line, channel or status"
    roles: [DistributionManager, ProductManager, PlatformAdmin]
    code: 200
    input: ["product_line_id?", "channel?", "status?", "limit?", "offset?"]
    output: DistributionAllocation[]
    side_effects: []

  - method: GET
    path: "/api/distribution-allocations/{distributionAllocationId}"
    description: "Get a specific distribution allocation"
    roles: [DistributionManager, ProductManager, PlatformAdmin]
    code: 200
    input: []
    output: DistributionAllocation
    side_effects: []

  - method: POST
    path: "/api/distribution-allocations/{distributionAllocationId}/mark-utf"
    description: "Mark a reserved allocation as unable-to-fill"
    roles: [DistributionManager]
    code: 200
    input: []
    output: DistributionAllocation
    side_effects: ["status=UTF", "increments distribution_allocation.version by 1"]

  - method: POST
    path: "/api/distribution-allocations/{distributionAllocationId}/ship"
    description: "Ship an allocation once the line is packed out"
    roles: [DistributionManager]
    code: 200
    input: []
    output: DistributionAllocation
    side_effects:
      - "status=SHIPPED, shipped_quantity=quantity_allocated"
      - "increments product_line.version by 1"

  - method: POST
    path: "/api/distribution-allocations/{distributionAllocationId}/recall"
    description: "Recall a shipped allocation, unwinding the line while quality exposures remain above the recall threshold"
    roles: [DistributionManager]
    code: 200
    input: []
    output: ProductLine
    side_effects:
      - "status=RECALLED, shipped_quantity=0"
      - "product_line.status=PLANNING for each recursion while sum(affected_quantity) of APPROVED claims exceeds QUALITY_RECALL_THRESHOLD"
      - "each recursion supersedes the line's PrintRunDecisions and returns its CardSets to print_run_status=UNDECIDED"

  # --- QualityClaim ---
  - method: GET
    path: "/api/quality-claims"
    description: "List quality claims, optionally filtered by set or status"
    roles: [QualityAnalyst, ProductionPlanner, PlatformAdmin]
    code: 200
    input: ["card_set_id?", "status?", "severity?", "limit?", "offset?"]
    output: QualityClaim[]
    side_effects: []

  - method: GET
    path: "/api/quality-claims/{qualityClaimId}"
    description: "Get a specific quality claim"
    roles: [QualityAnalyst, ProductionPlanner, PlatformAdmin]
    code: 200
    input: []
    output: QualityClaim
    side_effects: []

  - method: POST
    path: "/api/quality-claims/{qualityClaimId}/open-review"
    description: "Open review on a filed quality claim after the back-date window check"
    roles: [QualityAnalyst]
    code: 200
    input: []
    output: QualityClaim
    side_effects: ["status=UNDER_REVIEW", "recomputes card_set.quality_claim_count"]

  - method: POST
    path: "/api/quality-claims/{qualityClaimId}/approve"
    description: "Approve a quality claim, raising the set's verifiable defect floor"
    roles: [QualityAnalyst]
    code: 200
    input: []
    output: QualityClaim
    side_effects: ["status=APPROVED", "raises the safety floor used by print_run_quality_floor"]

  - method: POST
    path: "/api/quality-claims/{qualityClaimId}/deny"
    description: "Deny a quality claim under review"
    roles: [QualityAnalyst]
    code: 200
    input: []
    output: QualityClaim
    side_effects: ["status=DENIED"]

  - method: POST
    path: "/api/quality-claims/{qualityClaimId}/credit"
    description: "Issue the replacement credit for an approved claim, reversing any redemption fulfilment the claim covered"
    roles: [QualityAnalyst]
    code: 200
    input: []
    output: ProductLine
    side_effects:
      - "status=CREDITED"
      - "every FULFILLED Redemption for this set -> ISSUED with its scratch value restored"
      - "recomputes card_set.autograph_redemptions_outstanding"

  # --- CollectorComplaint ---
  - method: GET
    path: "/api/collector-complaints"
    description: "List collector complaints, optionally filtered by set or status"
    roles: [CollectorSupportSpecialist, QualityAnalyst, PlatformAdmin]
    code: 200
    input: ["card_set_id?", "status?", "breach_reason?", "limit?", "offset?"]
    output: CollectorComplaint[]
    side_effects: []

  - method: GET
    path: "/api/collector-complaints/{collectorComplaintId}"
    description: "Get a specific collector complaint"
    roles: [CollectorSupportSpecialist, QualityAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: CollectorComplaint
    side_effects: []

  - method: POST
    path: "/api/collector-complaints/{collectorComplaintId}/start-review"
    description: "Move a collector complaint into review"
    roles: [CollectorSupportSpecialist]
    code: 200
    input: []
    output: CollectorComplaint
    side_effects: ["status=UNDER_REVIEW", "increments collector_complaint.version by 1"]

  - method: POST
    path: "/api/collector-complaints/{collectorComplaintId}/approve"
    description: "Approve a collector complaint after the availability-authority check"
    roles: [CollectorSupportSpecialist]
    code: 200
    input: []
    output: CollectorComplaint
    side_effects:
      - "status=APPROVED"
      - "recomputes card_set.settled_complaint_count"

  - method: POST
    path: "/api/collector-complaints/{collectorComplaintId}/reject"
    description: "Reject a collector complaint under review"
    roles: [CollectorSupportSpecialist]
    code: 200
    input: []
    output: CollectorComplaint
    side_effects: ["status=REJECTED"]

  - method: POST
    path: "/api/collector-complaints/{collectorComplaintId}/settle"
    description: "Settle an approved collector complaint"
    roles: [CollectorSupportSpecialist]
    code: 200
    input: []
    output: CollectorComplaint
    side_effects: ["status=SETTLED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:

  # --- Generic request / auth / authorization ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed request: unparseable body, wrong JSON type, or a required input field absent from the payload"

  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent, or X-User-Role is not a declared role"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "The acting role is not permitted to perform this operation"

  # --- Licensing authority (priority 2-3) ---
  - id: ERR_LICENSE_NOT_IN_FORCE
    http: 403
    condition: "The license in the target resource's license chain is not ACTIVE as of the logical clock, or the clock falls outside [term_starts_on, term_ends_on]"

  - id: ERR_LICENSE_TERM_WINDOW_BREACH
    http: 403
    condition: "The license was not continuously ACTIVE across [ArtworkApproval.submitted_on, current logical clock]"

  - id: ERR_LICENSE_TERM_NOT_STARTED
    http: 422
    condition: "License activation attempted before term_starts_on"

  - id: ERR_LICENSE_TERM_EXPIRED
    http: 422
    condition: "License activation attempted after term_ends_on"

  - id: ERR_LICENSE_TERM_NOT_ENDED
    http: 422
    condition: "License expiry attempted at or before term_ends_on"

  # --- Existence / reference integrity (priority 4-5) ---
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "A foreign key in the request body does not resolve to an existing instance"

  - id: ERR_LICENSE_NOT_FOUND
    http: 404
    condition: "No License exists with the supplied id"

  - id: ERR_PRODUCT_LINE_NOT_FOUND
    http: 404
    condition: "No ProductLine exists with the supplied id"

  - id: ERR_CARD_SET_NOT_FOUND
    http: 404
    condition: "No CardSet exists with the supplied id"

  - id: ERR_PACK_CONFIGURATION_NOT_FOUND
    http: 404
    condition: "No PackConfiguration exists with the supplied id"

  - id: ERR_SIGNING_SESSION_NOT_FOUND
    http: 404
    condition: "No SigningSession exists with the supplied id"

  - id: ERR_ARTWORK_APPROVAL_NOT_FOUND
    http: 404
    condition: "No ArtworkApproval exists with the supplied id"

  - id: ERR_PRINT_RUN_DECISION_NOT_FOUND
    http: 404
    condition: "No PrintRunDecision exists with the supplied id"

  - id: ERR_REDEMPTION_NOT_FOUND
    http: 404
    condition: "No Redemption exists with the supplied id"

  - id: ERR_COLLECTOR_NOTIFICATION_NOT_FOUND
    http: 404
    condition: "No CollectorNotification exists with the supplied id"

  - id: ERR_DISTRIBUTION_ALLOCATION_NOT_FOUND
    http: 404
    condition: "No DistributionAllocation exists with the supplied id"

  - id: ERR_QUALITY_CLAIM_NOT_FOUND
    http: 404
    condition: "No QualityClaim exists with the supplied id"

  - id: ERR_COLLECTOR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "No CollectorComplaint exists with the supplied id"

  # --- Version pinning on approval (priority 6) ---
  - id: ERR_RIGHTS_VERSION_MISMATCH
    http: 409
    condition: "CardSet.rights_pinned_version no longer equals License.rights_version, so the license rights the set was approved under have moved"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "The supplied expected_card_set_version is lower than the current CardSet.version"

  - id: ERR_AUTHORITY_OUTDATED
    http: 412
    condition: "The supplied expected_product_line_version does not match the current ProductLine.version the decision's authority projection was built against"

  # --- State preconditions (priority 7) ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in the `from:` state its requested transition requires"

  - id: ERR_CARD_SET_NOT_APPROVED
    http: 409
    condition: "A card set named by a signing-session allocation line is not APPROVED"

  - id: ERR_SET_NOT_APPROVED
    http: 409
    condition: "A pack configuration or print-run decision was acted on while its card set was not APPROVED"

  - id: ERR_PRODUCT_LINE_NOT_READY
    http: 409
    condition: "Card-set submission attempted while the parent product line is not READY_FOR_APPROVAL"

  - id: ERR_PRODUCT_LINE_STATE_BLOCKED
    http: 409
    condition: "The parent product line is in a status that forbids this card-set or decision transition"

  - id: ERR_PRODUCT_LINE_NOT_PACKED_OUT
    http: 409
    condition: "Pack-out or UTF-marking attempted before the parent product line reached PACKED_OUT"

  - id: ERR_PRINT_RUN_NOT_LOCKED
    http: 409
    condition: "Card production started while CardSet.print_run_status is not LOCKED"

  - id: ERR_NO_LOCKED_PRINT_RUN
    http: 409
    condition: "Product-line production started while no card set under it has a locked print run"

  - id: ERR_ARTWORK_NOT_APPROVED
    http: 409
    condition: "Card-set submission attempted with no APPROVED artwork"

  - id: ERR_ARTWORK_APPROVAL_PENDING
    http: 409
    condition: "Card-set submission attempted while artwork is still SUBMITTED"

  - id: ERR_PACK_CONFIG_MISSING
    http: 409
    condition: "Pack-out or re-approval attempted while a card set has no PUBLISHED pack configuration"

  - id: ERR_QUALITY_CLAIM_NOT_APPROVED
    http: 409
    condition: "A redemption fulfilment reversal was requested while no APPROVED quality claim exists for the set"

  # --- Business safety (priority 8-9) ---
  - id: ERR_APPROVAL_WINDOW_CLOSED
    http: 422
    condition: "The licensor decided artwork after submitted_on + License.approval_window_days"

  - id: ERR_CLAIM_BACKDATE_EXCEEDED
    http: 422
    condition: "QualityClaim.filed_on is at or before CLAIM_BACKDATE_NOW - CLAIM_BACKDATE_WINDOW_DAYS"

  - id: ERR_CLAIM_QUANTITY_INVALID
    http: 422
    condition: "affected_quantity or claim_quantity is less than 1"

  - id: ERR_UNDISCLOSED_RUN_DECLARED
    http: 422
    condition: "An UNDISCLOSED_PRINT_RUN complaint was approved against a set whose print_run_status is not UNDISCLOSED"

  - id: ERR_REPLACEMENT_POLICY_EXISTS
    http: 422
    condition: "A NO_REPLACEMENT_POLICY complaint was approved against a set that already carries quality claims"

  # --- Business fiscal / temporal (priority 10-17) ---
  - id: ERR_PRINT_DECISION_WINDOW_CLOSED
    http: 422
    condition: "The print-run decision was approved after proposed_on + PRINT_DECISION_VALIDITY_DAYS"

  - id: ERR_INSUFFICIENT_SALES_HISTORY
    http: 422
    condition: "Fewer than SALES_HISTORY_MIN_RECORDS qualifying complaints exist in the back-date window for a SALES_HISTORY projection"

  - id: ERR_MARKET_SIGNAL_UNAVAILABLE
    http: 422
    condition: "No HOBBY or MASS distribution allocation exists for the line, so a MARKET_DEMAND projection cannot be built"

  - id: ERR_PRINT_RUN_REQUIRED
    http: 422
    condition: "A BASE set was approved with print_run_quantity below 1"

  - id: ERR_PRINT_RUN_NOT_ALLOWED
    http: 422
    condition: "An INSERT or PREMIUM set was approved with a non-zero print_run_quantity"

  - id: ERR_BOX_CONFIGURATION_INVALID
    http: 422
    condition: "boxes_per_case * packs_per_box * cards_per_pack is not divisible by CARDS_PER_SET"

  - id: ERR_PACK_CONFIG_TOTAL_MISMATCH
    http: 422
    condition: "base_packs + insert_packs + premium_packs does not equal the product line's cards_per_pack"

  - id: ERR_CONFIG_SERIAL_OUT_OF_RANGE
    http: 422
    condition: "config_serial falls outside 1..30"

  - id: ERR_CONFIG_LADDER_VIOLATION
    http: 409
    condition: "config_serial is not current_published_count + 1 for the set"

  - id: ERR_PACK_ODDS_NOT_PUBLISHABLE
    http: 422
    condition: "A pack configuration with a non-zero insert_packs was published for a set whose announced flag is false"

  - id: ERR_SIGNER_DOUBLE_BOOKED
    http: 409
    condition: "The signer has another session whose half-open day window [scheduled_on, scheduled_on + 1 day) overlaps this one"

  - id: ERR_SIGNER_SHIP_WINDOW_CLOSED
    http: 422
    condition: "Stock shipped before SigningSession.ship_date"

  - id: ERR_CARD_STOCK_NOT_PRODUCED_AT_SIGNING
    http: 422
    condition: "The quantity of an allocated player's card produced at the signing is below the quantity that allocation line delivers"

  - id: ERR_AUTOGRAPH_ALLOCATION_EXCEEDS_PLAN
    http: 422
    condition: "An allocation line would push the card set's secured autograph count above its planned count"

  - id: ERR_AUTOGRAPH_QUANTITY_SHORT
    http: 409
    condition: "Product-line pack-out attempted while a set's autograph_secured_count is below its autograph_planned_count"

  - id: ERR_AUTOGRAPH_AUTHENTICATION_FAILED
    http: 422
    condition: "A signing session was completed with signer_attendance == NO_SHOW"

  - id: ERR_ALLOCATION_EXCEEDS_PRINT_RUN
    http: 422
    condition: "Projected channel cases exceed the product line's producible case count"

  - id: ERR_CHANNEL_ALREADY_UTF
    http: 409
    condition: "Another allocation for the same product line and channel is already UTF"

  - id: ERR_DISTRIBUTION_WINDOW_CLOSED
    http: 422
    condition: "An allocation was shipped before the product line's run_planned_on"

  - id: ERR_REDEMPTION_CODE_DUPLICATE
    http: 409
    condition: "redemption_code is already in use by another Redemption"

  - id: ERR_REDEMPTION_DEADLINE_EXCEEDED
    http: 422
    condition: "The redemption was closed after opened_on + deadline_days"

  - id: ERR_REDEMPTION_DEADLINE_NOT_EXCEEDED
    http: 422
    condition: "The redemption was cancelled at or before opened_on + deadline_days"

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:

  - name: LicensingManager
    description: "Owns the league and player association licensing relationship: registers, activates, suspends and expires licenses."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/licenses — register a license"
      - "POST /api/licenses/{id}/activate — activate or reactivate a license"
      - "POST /api/licenses/{id}/suspend — suspend a license"
      - "POST /api/licenses/{id}/expire — expire a license"
    shared_operations:
      - "GET /api/licenses — list licenses"
      - "GET /api/licenses/{id} — get a license"
      - "GET /api/licenses/{id}/product-lines — list a license's product lines"
      - "GET /api/card-sets/{id}/approval-chain — read the approval chain"

  - name: ProductManager
    description: "Plans product lines and card sets across base, insert and premium tiers, configures packs, and handles artwork submission."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/product-lines — create a product line"
      - "PATCH /api/product-lines/{id} — update a product line"
      - "POST /api/product-lines/{id}/ready-for-approval — move a line into readiness"
      - "POST /api/card-sets — create a card set"
      - "POST /api/card-sets/{id}/submit — submit a card set for review"
      - "POST /api/card-sets/{id}/return-to-draft — return a card set to draft"
      - "POST /api/card-sets/{id}/approve — approve a card set"
      - "POST /api/card-sets/{id}/artwork-approvals — submit artwork"
      - "POST /api/pack-configurations — propose a pack configuration"
      - "POST /api/pack-configurations/{id}/publish — publish a pack configuration"
      - "POST /api/pack-configurations/{id}/supersede — supersede a pack configuration"
    shared_operations:
      - "GET /api/product-lines — list product lines"
      - "GET /api/product-lines/{id} — get a product line"
      - "GET /api/product-lines/{id}/card-sets — list a line's card sets"
      - "GET /api/product-lines/{id}/distribution-allocations — list a line's allocations"
      - "GET /api/card-sets — list card sets"
      - "GET /api/card-sets/{id} — get a card set"
      - "GET /api/card-sets/{id}/approval-chain — read the approval chain"
      - "GET /api/card-sets/{id}/pack-configurations — list pack configurations"
      - "GET /api/pack-configurations/{id} — get a pack configuration"
      - "GET /api/card-sets/{id}/print-run-decisions — list print-run decisions"
      - "GET /api/card-sets/{id}/print-run-summary — read the compound print-run state"
      - "GET /api/artwork-approvals/{id} — get an artwork approval"

  - name: ProductionPlanner
    description: "Owns print-run decisions, serial numbering, and the production and pack-out schedule."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/product-lines/{id}/start-production — start line production"
      - "POST /api/product-lines/{id}/pack-out — pack out a line"
      - "POST /api/card-sets/{id}/start-production — start card production"
      - "POST /api/card-sets/{id}/pack-out — pack out a card set"
      - "POST /api/print-run-decisions — propose a print-run decision"
      - "POST /api/print-run-decisions/{id}/approve — approve a print-run decision"
      - "POST /api/print-run-decisions/{id}/supersede — supersede a print-run decision"
    shared_operations:
      - "GET /api/product-lines — list product lines"
      - "GET /api/product-lines/{id} — get a product line"
      - "GET /api/card-sets — list card sets"
      - "GET /api/card-sets/{id} — get a card set"
      - "GET /api/card-sets/{id}/pack-configurations — list pack configurations"
      - "GET /api/pack-configurations/{id} — get a pack configuration"
      - "GET /api/print-run-decisions/{id} — get a print-run decision"
      - "GET /api/card-sets/{id}/print-run-summary — read the compound print-run state"
      - "GET /api/signing-sessions — list signing sessions"
      - "GET /api/quality-claims — list quality claims"
      - "GET /api/quality-claims/{id} — get a quality claim"

  - name: SigningCoordinator
    description: "Books player and celebrity signing sessions, allocates card stock to the signer, and ships it."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/signing-sessions — book a signing session"
      - "POST /api/signing-sessions/{id}/prepare-stock — prepare card stock"
      - "POST /api/signing-sessions/{id}/ship-stock — ship card stock"
      - "POST /api/signing-sessions/{id}/cancel — cancel a signing session"
    shared_operations:
      - "GET /api/signing-sessions — list signing sessions"

  - name: AuthenticationOfficer
    description: "Authenticates returned autographs and completes signing sessions."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/signing-sessions/{id}/complete — complete a signing session"
    shared_operations:
      - "GET /api/signing-sessions — list signing sessions"
      - "GET /api/signing-sessions/{id} — get a signing session"

  - name: LicensorApprover
    description: "The league or player association holding approval rights over artwork. X-User-ID equals the id of the License instance granting those rights."
    identity: "entity_backed:License"
    exclusive_operations:
      - "POST /api/artwork-approvals/{id}/decide — approve or reject submitted artwork"
    shared_operations:
      - "GET /api/artwork-approvals/{id} — get an artwork approval"

  - name: RedemptionFulfilmentAnalyst
    description: "Issues redemption cards, keeps the fulfillment timeline, applies the substitution policy, and serves collector notices."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/card-sets/{id}/redemptions — issue a redemption card"
      - "POST /api/redemptions/{id}/fulfill — fulfil a redemption"
      - "POST /api/redemptions/{id}/close — close a fulfilled redemption"
      - "POST /api/redemptions/{id}/cancel — cancel a redemption past its deadline"
      - "POST /api/redemptions/{id}/notifications — serve a collector notice"
      - "POST /api/collector-notifications/{id}/acknowledge — acknowledge a notice"
      - "POST /api/collector-notifications/{id}/settle — settle a substitution notice"
      - "POST /api/collector-notifications/{id}/resolve — resolve an acknowledged notice"
    shared_operations:
      - "GET /api/card-sets — list card sets"
      - "GET /api/card-sets/{id} — get a card set"
      - "GET /api/card-sets/{id}/redemptions — list a set's redemptions"
      - "GET /api/redemptions — list redemptions"
      - "GET /api/redemptions/{id} — get a redemption"
      - "GET /api/redemptions/{id}/notifications — list a redemption's notices"
      - "GET /api/collector-notifications/{id} — get a collector notification"

  - name: DistributionManager
    description: "Allocates cases across hobby, mass and direct channels and ships the product."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/distribution-allocations — reserve a channel allocation"
      - "POST /api/distribution-allocations/{id}/mark-utf — mark an allocation unable-to-fill"
      - "POST /api/distribution-allocations/{id}/ship — ship an allocation"
      - "POST /api/distribution-allocations/{id}/recall — recall a shipped allocation"
    shared_operations:
      - "GET /api/product-lines/{id}/distribution-allocations — list a line's allocations"
      - "GET /api/distribution-allocations/{id} — get an allocation"

  - name: QualityAnalyst
    description: "Handles print defects, replacement policy and the reclaim credit that feeds back into future print decisions."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/card-sets/{id}/quality-claims — file a quality claim"
      - "POST /api/quality-claims/{id}/open-review — open review on a claim"
      - "POST /api/quality-claims/{id}/approve — approve a claim"
      - "POST /api/quality-claims/{id}/deny — deny a claim"
      - "POST /api/quality-claims/{id}/credit — issue the reclaim credit"
    shared_operations:
      - "GET /api/card-sets — list card sets"
      - "GET /api/card-sets/{id} — get a card set"
      - "GET /api/card-sets/{id}/quality-claims — list a set's quality claims"
      - "GET /api/quality-claims — list quality claims"
      - "GET /api/quality-claims/{id} — get a quality claim"
      - "GET /api/quality-claims/{id} — read a claim's weight"
      - "GET /api/collector-complaints — list collector complaints"

  - name: CollectorSupportSpecialist
    description: "Receives collector complaints and resolves them against the set's availability authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/card-sets/{id}/complaints — file a collector complaint"
      - "POST /api/collector-complaints/{id}/start-review — move a complaint into review"
      - "POST /api/collector-complaints/{id}/approve — approve a complaint"
      - "POST /api/collector-complaints/{id}/reject — reject a complaint"
      - "POST /api/collector-complaints/{id}/settle — settle a complaint"
    shared_operations:
      - "GET /api/collector-complaints — list collector complaints"
      - "GET /api/collector-complaints/{id} — get a collector complaint"
      - "GET /api/card-sets/{id}/complaints — list a set's complaints"

  - name: PlatformAdmin
    description: "Operational role that drives the logical clock and reads across every resource; holds no business exclusives."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc — set the logical clock"
    shared_operations:
      - "Every GET endpoint declared in §1.5"