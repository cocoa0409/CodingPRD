              captures: { drug_short: $.data.id }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugPXU", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_sub: $.data.id }
            - call: "POST /pharmacy/substitution-protocols"
              payload: { shortage_drug_product_id: "${drug_short}", substitute_drug_product_id: "${drug_sub}", conversion_factor: 0.5, max_dose_mg: 200.0, expires_at: "2026-08-03T00:00:00Z" }
              as: PharmacyAdmin
              captures: { proto_id: $.data.id }
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PharmacyAdmin
          trigger:
            - call: "POST /pharmacy/substitution-protocols/${proto_id}/activate"
              payload: {}
              as: PharmacyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROTOCOL_EXPIRED (422); protocol remains DRAFT"
      - name: error_hood_session_outside_window
        claim_type: violation_to_error
        grounds: ["errors[ERR_HOOD_SESSION_OUTSIDE_WINDOW]", "validations[priority=24]"]
        distinguishing_aspect: "Session start with the clock outside [start_at, end_at): session window starts 2026-08-05 but clock is 2026-08-01 -> ERR_HOOD_SESSION_OUTSIDE_WINDOW (422)."
        test_recipe:
          setup: ["Hood; session windowed 2026-08-05 - 2026-08-06; clock at default 2026-08-01"]
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Tech OW", staff_role: "TECHNICIAN" }
