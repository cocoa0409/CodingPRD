    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_AGREEMENT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_STALE_AGREEMENT_VERSION, ERR_PROGRAM_NOT_OPEN, ERR_AGREEMENT_NOT_EXECUTED, ERR_PROGRAM_WINDOW_CLOSED, ERR_LOOKBACK_EXCEEDS_PROGRAM_LIMIT]
