          - entities.Employee.fields.active_suspension_count
          - endpoints[POST /awareness/employees/{id}/access-consequences]
        distinguishing_aspect: "Step 2's first branch applies when consequence_type is supplied: the rank comes straight from RANK_SYSTEM_ACCESS_SUSPENSION == 3 rather than from pre_rank + 1, so a first-ever consequence can land on rank 3 and set active_suspension_count to 1 immediately."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE employee with no prior AccessConsequence rows (pre_rank 0)."
