            - "${post1} == OPEN - blocking_punch_count is NOT one of the four counters that produce RESTRICTED; an implementation that adds it here reports RESTRICTED and fails this assert"
            - "${g1} == ERR_BLOCKING_PUNCH_ITEMS_OPEN with HTTP 409, at priority 82 - NOT ERR_PROJECT_POSTURE_RESTRICTED at priority 42, which is what a posture-folding implementation would return"
