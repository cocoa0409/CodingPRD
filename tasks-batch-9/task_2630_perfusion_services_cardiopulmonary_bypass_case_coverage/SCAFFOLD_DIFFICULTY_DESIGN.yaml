      - name: pack_config_rejects_when_backup_device_pool_is_empty
        grounds:
          - validations[priority=50]
          - errors.ERR_NO_BACKUP_DEVICE_AVAILABLE
          - entities.PerfusionDevice.fields.backup_device_id
          - entities.BypassCase.fields.backup_device_id
          - state_machines.BypassCase.STAFFED_to_PACK_CONFIGURED
        distinguishing_aspect: |
          A cardinality boundary rather than a numeric one, and on a different endpoint
          (POST /bypass-cases/{id}/disposable-packs): the resolvable-backup set is empty (the chosen
          primary carries no backup_device_id and the request omits backup_device_id), which is the
          zero-element edge of the resolution rule and must yield
          ERR_NO_BACKUP_DEVICE_AVAILABLE (422) even though a perfectly good spare pump exists in the
          fleet. Repeating the call with backup_device_id supplied takes the set to exactly one
          element and succeeds, so the boundary is crossed in a single step.
