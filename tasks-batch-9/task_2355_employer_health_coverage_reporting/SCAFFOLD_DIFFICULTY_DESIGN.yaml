          Mode (a) non-linear composition of four inputs: surviving asserted (a) months,
          the group's REPORTING_YEAR full-time count, the 30-employee exclusion inside a
          max(x, 0) floor, and the per-month mutual exclusion that deletes any (b) pair
          whose month survived as an (a) month, giving
          a == max(41 - 30, 0) * floor(296400 / 12) == 271700, b == 2 * 37000 == 74000 and
