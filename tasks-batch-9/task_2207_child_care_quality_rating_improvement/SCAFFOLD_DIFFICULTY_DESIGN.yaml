          - entities.CoachingAllocation.fields.spend_cap_cents
          - entities.Provider.fields.current_tier
        distinguishing_aspect: |
          This dual-variant instance operates on the coaching-funding entity domain
          (CoachingAllocation on an unrated provider), a third entity domain distinct from
          rating scoring and subsidy payment: the scaffold pins ADMIN_FEE_RATE to
          base_hours_cost_cents 190046 (band 0.09, admin_fee_cents 17104,
          total_cost_cents 207150) whereas keying the same rate table on the resulting
          total_cost_cents 207150 would select band 0.06 and produce total_cost_cents
