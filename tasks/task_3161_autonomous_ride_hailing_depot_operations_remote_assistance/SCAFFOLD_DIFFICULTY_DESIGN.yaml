          - errors[ERR_INVALID_STATE]
          - state_machines.RideRequest.transitions.REQUESTED_to_MATCHED
        distinguishing_aspect: "The conflicting pair is business_safety (priority 6) against state (priority 11): a ride that is both already terminal and zone-blocked returns ERR_EXCLUSION_ZONE_ACTIVE, never ERR_INVALID_STATE, so the lower-numbered safety row wins."
