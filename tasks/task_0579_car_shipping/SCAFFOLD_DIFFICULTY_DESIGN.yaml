              payload: { origin_zip: "90001", dest_zip: "10001", route_miles: 1200, transport_type: "OPEN", delivery_mode: "TERMINAL", terminal_id: "${terminal_id}", terminal_slot_start: "2026-06-01T10:00:00Z", terminal_slot_end: "2026-06-01T12:00:00Z", pickup_window_start: "2026-06-01T08:00:00Z", pickup_window_end: "2026-06-05T18:00:00Z" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order1_id: $.data.id }
          trigger:
            - call: "POST /shipment-orders"
              payload: { origin_zip: "90001", dest_zip: "10001", route_miles: 1200, transport_type: "OPEN", delivery_mode: "TERMINAL", terminal_id: "${terminal_id}", terminal_slot_start: "2026-06-01T12:30:00Z", terminal_slot_end: "2026-06-01T14:00:00Z", pickup_window_start: "2026-06-01T08:00:00Z", pickup_window_end: "2026-06-05T18:00:00Z" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_TERMINAL_SLOT_CONFLICT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_refund_conserves_order_cash_to_zero
        grounds:
          - state_machines.ShipmentOrder.DRAFT_to_CANCELLED
          - calculations.order_balance_reconciliation
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity = order net POSTED ledger cash. Forward DEPOSIT (+20000)
          paired with the cancel-triggered compensating REFUND (-20000) leaves
          sum(POSTED LedgerEntry.amount_cents for order) == 0 — the net cash the
          shipper has moved returns exactly to zero.
        test_recipe:
          setup:
            - "Order LISTED with deposit 20000 paid (one POSTED DEPOSIT ledger entry)."
          setup_api_calls:
            - call: "POST /shippers"
              payload: { email: "s17@x.com", full_name: "S Seventeen" }
              as: Admin
              captures: { shipper_id: $.data.id }
            - call: "POST /shipment-orders"
              payload: { origin_zip: "90001", dest_zip: "10001", route_miles: 1200, transport_type: "OPEN", pickup_window_start: "2026-06-01T08:00:00Z", pickup_window_end: "2026-06-05T18:00:00Z" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order_id: $.data.id }
            - call: "POST /shipment-orders/${order_id}/vehicles"
              payload: { make: "Honda", model: "Civic", year: 2020, declared_value_cents: 1000000 }
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "GET /shipment-orders/${order_id}"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order_vq: $.data.version }
            - call: "POST /shipment-orders/${order_id}/quotes"
              payload: { expected_order_version: "${order_vq}" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { quote_id: $.data.id }
            - call: "POST /shipment-orders/${order_id}/quotes/${quote_id}/accept"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "POST /shipment-orders/${order_id}/ledger-entries"
              payload: { kind: "DEPOSIT", amount_cents: 20000 }
              as: Broker
            - call: "POST /shipment-orders/${order_id}/listings"
              payload: { offered_carrier_pay_cents: 50000 }
              as: Broker
              captures: { listing_id: $.data.id }
          trigger:
            - call: "POST /shipment-orders/${order_id}/cancel"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
          assert:
            - "ShipmentOrder.${order_id}.status == CANCELLED"
            - "sum(LedgerEntry.amount_cents where order_id==${order_id} and status==POSTED) == 0"
            - "count(LedgerEntry where order_id==${order_id} and kind==REFUND and status==POSTED) == 1"

      - name: dispatch_revoke_conserves_active_assignment_count
        grounds:
          - state_machines.ShipmentOrder.DISPATCHED_to_LISTED
          - state_machines.Assignment.DISPATCHED_to_REVOKED
          - entities.Carrier.fields.aggregate_exposure_cents
        distinguishing_aspect: |
          Conserved quantity = the order's active-assignment count (and carrier
          exposure). Forward dispatch paired with revoke leaves zero DISPATCHED
          assignments for the order, the listing back OPEN, assigned_carrier_id null,
          and Carrier.aggregate_exposure_cents back to 0 — a different conserved
          quantity than order cash.
        test_recipe:
          setup:
            - "Order DISPATCHED to a carrier (declared 1,000,000c), no PICKUP inspection yet."
          setup_api_calls:
            - call: "POST /shippers"
              payload: { email: "s18@x.com", full_name: "S Eighteen" }
