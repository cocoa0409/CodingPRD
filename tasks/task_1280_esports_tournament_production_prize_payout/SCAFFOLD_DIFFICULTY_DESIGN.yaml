# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Esports Tournament Production & Prize Payout
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: prize_provisional_vs_final_after_dq
        grounds:
          - calculations.prize_pool_distribution
          - calculations.prize_rounding_reconciliation
          - state_machines.IntegrityCase.INVESTIGATING_to_RESOLVED_VIOLATION
        distinguishing_aspect: |
          Dual-variant calculation on the PRIZE MONEY domain (PayoutRecord/Tournament):
          identical bracket and pool inputs produce gross 750000 under the PROVISIONAL
          variant and 1000000 under the FINAL variant once the runner-up is DQ'd,
          because FINAL excludes FORFEITED registrations and redistributes base_pct.
        test_recipe:
          setup:
            - "2-team tournament (roster_size 1), pool target and funded 1000000 cents, COMPLETED with r1 champion (placement 1), r2 runner-up (placement 2)"
            - "PROVISIONAL compute run exists; then r2's player p2 accumulates 3 strikes and is BANNED, r2 -> FORFEITED"
          setup_api_calls:
            - { call: "POST /api/tournaments", payload: { name: "DualVar Cup", game_title: "TacShooter", region: NA, prize_pool_target_cents: 1000000, roster_size: 1, max_roster_size: 2, registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z", minor_curfew_local: "22:00" }, as: OrganizerAdmin, captures: { t: $.data.id } }
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: REGISTRATION_OPEN }, as: TournamentDirector }
            - { call: "POST /api/players", payload: { handle: "p1", date_of_birth: "2000-01-01", region: NA }, as: OrganizerAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/players", payload: { handle: "p2", date_of_birth: "2000-02-02", region: NA }, as: OrganizerAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Alpha", manager_contact_email: "a@x.gg", region_rank_points: 100, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p1}" }, as: OrganizerAdmin, captures: { r1: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Beta", manager_contact_email: "b@x.gg", region_rank_points: 80, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p2}" }, as: OrganizerAdmin, captures: { r2: $.data.id } }
            - { call: "POST /api/roster-slots", payload: { registration_id: "${r1}", player_id: "${p1}", slot_role: STARTER }, as: TeamManager, as_user_id: "${r1}" }
            - { call: "POST /api/roster-slots", payload: { registration_id: "${r2}", player_id: "${p2}", slot_role: STARTER }, as: TeamManager, as_user_id: "${r2}" }
            - { call: "POST /api/registrations/${r1}/submit", payload: {}, as: TeamManager, as_user_id: "${r1}" }
            - { call: "POST /api/registrations/${r2}/submit", payload: {}, as: TeamManager, as_user_id: "${r2}" }
            - { call: "POST /api/registrations/${r1}/review", payload: { action: APPROVE }, as: TournamentDirector }
            - { call: "POST /api/registrations/${r2}/review", payload: { action: APPROVE }, as: TournamentDirector }
            - { call: "POST /api/tournaments/${t}/fund", payload: { amount_cents: 1000000 }, as: OrganizerAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: OrganizerAdmin }
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: REGISTRATION_LOCKED }, as: TournamentDirector }
            - { call: "GET /api/tournaments/${t}", as: TournamentDirector, captures: { tv: $.data.version } }
            - { call: "POST /api/tournaments/${t}/generate-bracket", payload: { expected_tournament_version: "${tv}" }, as: TournamentDirector }
            - { call: "POST /api/servers", payload: { tournament_id: "${t}", label: "S1", region: NA }, as: OrganizerAdmin, captures: { s1: $.data.id } }
            - { call: "GET /api/matches?tournament_id=${t}", as: TournamentDirector, captures: { mf: "$.data[0].id" } }
            - { call: "POST /api/matches/${mf}/schedule", payload: { server_id: "${s1}", scheduled_start_at: "2026-08-11T10:00:00Z", duration_minutes: 60, assigned_referee_id: "ref-1" }, as: TournamentDirector }
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: IN_PROGRESS }, as: TournamentDirector }
            - { call: "POST /api/matches/${mf}/officiate", payload: { action: OPEN_LOBBY }, as: Referee, as_user_id: "ref-1" }
            - { call: "POST /api/matches/${mf}/officiate", payload: { action: START }, as: Referee, as_user_id: "ref-1" }
            - { call: "POST /api/matches/${mf}/report-result", payload: { home_score: 13, away_score: 7 }, as: Referee, as_user_id: "ref-1" }
            - { call: "POST /api/matches/${mf}/confirm-result", payload: {}, as: Referee, as_user_id: "ref-2" }
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: COMPLETED }, as: TournamentDirector }
            - { call: "GET /api/tournaments/${t}", as: PayoutOfficer, captures: { tv2: $.data.version } }
            - { call: "POST /api/tournaments/${t}/payout-records/compute", payload: { mode: PROVISIONAL, expected_tournament_version: "${tv2}" }, as: PayoutOfficer, captures: { pr_prov_1: "$.data[0].id", pr_prov_2: "$.data[1].id" } }
            - { call: "POST /api/integrity-cases", payload: { player_id: "${p2}", evidence_summary: "aimbot signature A" }, as: AntiCheatInvestigator, as_user_id: "ac-1", captures: { c1: $.data.id } }
            - { call: "POST /api/integrity-cases/${c1}/resolve", payload: { action: BEGIN_INVESTIGATION }, as: AntiCheatInvestigator, as_user_id: "ac-1" }
            - { call: "POST /api/integrity-cases/${c1}/resolve", payload: { action: RESOLVE, outcome: VIOLATION }, as: AntiCheatInvestigator, as_user_id: "ac-1" }
            - { call: "POST /api/integrity-cases", payload: { player_id: "${p2}", evidence_summary: "aimbot signature B" }, as: AntiCheatInvestigator, as_user_id: "ac-1", captures: { c2: $.data.id } }
            - { call: "POST /api/integrity-cases/${c2}/resolve", payload: { action: BEGIN_INVESTIGATION }, as: AntiCheatInvestigator, as_user_id: "ac-1" }
            - { call: "POST /api/integrity-cases/${c2}/resolve", payload: { action: RESOLVE, outcome: VIOLATION }, as: AntiCheatInvestigator, as_user_id: "ac-1" }
            - { call: "POST /api/integrity-cases", payload: { player_id: "${p2}", evidence_summary: "aimbot signature C" }, as: AntiCheatInvestigator, as_user_id: "ac-1", captures: { c3: $.data.id } }
            - { call: "POST /api/integrity-cases/${c3}/resolve", payload: { action: BEGIN_INVESTIGATION }, as: AntiCheatInvestigator, as_user_id: "ac-1" }
            - { call: "POST /api/integrity-cases/${c3}/resolve", payload: { action: RESOLVE, outcome: VIOLATION }, as: AntiCheatInvestigator, as_user_id: "ac-1" }
          trigger:
            - { call: "GET /api/tournaments/${t}", as: PayoutOfficer, captures: { tv3: $.data.version } }
            - { call: "POST /api/tournaments/${t}/payout-records/compute", payload: { mode: FINAL, expected_tournament_version: "${tv3}" }, as: PayoutOfficer, captures: { pr_fin_1: "$.data[0].id" } }
          assert:
            - "PROVISIONAL record ${pr_prov_1} (placement 1, registration ${r1}) gross_amount_cents == 750000 (50% share plus 250000 residual sweep)"
            - "PROVISIONAL record ${pr_prov_2} (placement 2, registration ${r2}) gross_amount_cents == 250000"
            - "FINAL run creates exactly 1 record ${pr_fin_1} for registration ${r1} with gross_amount_cents == 1000000 (runner-up base_pct 25 redistributed: effective pct 100)"
            - "Registration.${r2}.status == FORFEITED and Player.${p2}.eligibility_status == BANNED"
            - "PayoutRecord.${pr_prov_1}.disbursement_status == VOID and PayoutRecord.${pr_prov_2}.disbursement_status == VOID after the FINAL supersede"
            - "PayoutRecord.${pr_fin_1}.compute_run_mode == FINAL"

      - name: talent_fee_quote_vs_settled
        grounds:
          - calculations.talent_fee
          - state_machines.TalentBooking.CONFIRMED_to_SETTLED
        distinguishing_aspect: |
          Dual-variant calculation on the PRODUCTION LABOR domain (TalentBooking) —
          a different entity domain from prize money: identical shift inputs produce
          fee_quote_cents 160000 (PROVISIONAL: raw day units) versus fee_final_cents
          214000 (FINAL: cross-region uplifted base 184000 + overtime 30000 + royalty 0).
        test_recipe:
          setup:
            - "Tournament in IN_PROGRESS (region EU); Talent tal home_region NA, cross_region true, day_rate_cents 80000"
            - "Booking on a 10-hour shift (2026-08-12T10:00:00Z to 2026-08-12T20:00:00Z), CONFIRMED"
          setup_api_calls:
            - { call: "POST /api/tournaments", payload: { name: "Fee Cup", game_title: "TacShooter", region: EU, prize_pool_target_cents: 100000, roster_size: 1, max_roster_size: 2, registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z", minor_curfew_local: "22:00" }, as: OrganizerAdmin, captures: { t: $.data.id } }
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: REGISTRATION_OPEN }, as: TournamentDirector }
            - { call: "POST /api/players", payload: { handle: "p1", date_of_birth: "2000-01-01", region: EU }, as: OrganizerAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/players", payload: { handle: "p2", date_of_birth: "2000-02-02", region: EU }, as: OrganizerAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Alpha", manager_contact_email: "a@x.gg", region_rank_points: 100, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p1}" }, as: OrganizerAdmin, captures: { r1: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Beta", manager_contact_email: "b@x.gg", region_rank_points: 80, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p2}" }, as: OrganizerAdmin, captures: { r2: $.data.id } }
            - { call: "POST /api/roster-slots", payload: { registration_id: "${r1}", player_id: "${p1}", slot_role: STARTER }, as: TeamManager, as_user_id: "${r1}" }
            - { call: "POST /api/roster-slots", payload: { registration_id: "${r2}", player_id: "${p2}", slot_role: STARTER }, as: TeamManager, as_user_id: "${r2}" }
            - { call: "POST /api/registrations/${r1}/submit", payload: {}, as: TeamManager, as_user_id: "${r1}" }
            - { call: "POST /api/registrations/${r2}/submit", payload: {}, as: TeamManager, as_user_id: "${r2}" }
            - { call: "POST /api/registrations/${r1}/review", payload: { action: APPROVE }, as: TournamentDirector }
            - { call: "POST /api/registrations/${r2}/review", payload: { action: APPROVE }, as: TournamentDirector }
            - { call: "POST /api/tournaments/${t}/fund", payload: { amount_cents: 100000 }, as: OrganizerAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: OrganizerAdmin }
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: REGISTRATION_LOCKED }, as: TournamentDirector }
            - { call: "GET /api/tournaments/${t}", as: TournamentDirector, captures: { tv: $.data.version } }
            - { call: "POST /api/tournaments/${t}/generate-bracket", payload: { expected_tournament_version: "${tv}" }, as: TournamentDirector }
            - { call: "POST /api/talents", payload: { stage_name: "CasterPrime", home_region: NA, day_rate_cents: 80000, cross_region: true }, as: BroadcastProducer, captures: { tal: $.data.id } }
            - { call: "POST /api/talent-bookings", payload: { tournament_id: "${t}", talent_id: "${tal}", stage_label: "MAIN", shift_start_at: "2026-08-12T10:00:00Z", shift_end_at: "2026-08-12T20:00:00Z" }, as: BroadcastProducer, captures: { b1: $.data.id } }
            - { call: "POST /api/talent-bookings/${b1}/transition", payload: { action: CONFIRM }, as: BroadcastProducer }
            - { call: "POST /api/servers", payload: { tournament_id: "${t}", label: "S1", region: EU }, as: OrganizerAdmin, captures: { s1: $.data.id } }
            - { call: "GET /api/matches?tournament_id=${t}", as: TournamentDirector, captures: { mf: "$.data[0].id" } }
            - { call: "POST /api/matches/${mf}/schedule", payload: { server_id: "${s1}", scheduled_start_at: "2026-08-12T10:00:00Z", duration_minutes: 60, assigned_referee_id: "ref-1" }, as: TournamentDirector }
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: IN_PROGRESS }, as: TournamentDirector }
          trigger:
            - { call: "POST /api/talent-bookings/${b1}/transition", payload: { action: SETTLE }, as: BroadcastProducer }
          assert:
            - "TalentBooking.${b1}.fee_quote_cents == 160000 (PROVISIONAL: day_units ceil(10/8)=2 * 80000, no uplift/overtime/royalty)"
            - "TalentBooking.${b1}.fee_final_cents == 214000 (FINAL: base 160000 uplifted 15% to 184000; overtime 2h * 10000 * 1.5 = 30000; royalty band 0% since 184000 < 200000)"
            - "TalentBooking.${b1}.fee_final_cents != TalentBooking.${b1}.fee_quote_cents for identical shift inputs"
            - "TalentBooking.${b1}.status == SETTLED"

  - rule_id: combinatorial_formula
    instances:
      - name: prize_waterfall_floor_binding
        grounds:
          - calculations.prize_pool_distribution
        distinguishing_aspect: |
          Mode (a) combinatorial formula: >=3 inputs (pool, placement tier, MIN_PLACEMENT_CENTS
          floor) with non-linear nested min/max interaction — the floor binds for the
          runner-up (raw 62500 -> 100000), the remaining pool binds for the first
          3rd-place team (25000), and the second 3rd-place team is starved to 0.
        test_recipe:
          setup:
            - "4-team tournament COMPLETED, pool target and funded exactly 250000 cents; placements r1=1, r2=2, r3=3 (created before r4), r4=3"
            - "no sponsor deals; FINAL compute (no integrity cases exist)"
          setup_api_calls:
            - { call: "POST /api/tournaments", payload: { name: "Floor Cup", game_title: "TacShooter", region: NA, prize_pool_target_cents: 250000, roster_size: 1, max_roster_size: 2, registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z", minor_curfew_local: "22:00" }, as: OrganizerAdmin, captures: { t: $.data.id } }
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: REGISTRATION_OPEN }, as: TournamentDirector }
            - { call: "POST /api/players", payload: { handle: "p1", date_of_birth: "2000-01-01", region: NA }, as: OrganizerAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/players", payload: { handle: "p2", date_of_birth: "2000-02-02", region: NA }, as: OrganizerAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/players", payload: { handle: "p3", date_of_birth: "2000-03-03", region: NA }, as: OrganizerAdmin, captures: { p3: $.data.id } }
            - { call: "POST /api/players", payload: { handle: "p4", date_of_birth: "2000-04-04", region: NA }, as: OrganizerAdmin, captures: { p4: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Alpha", manager_contact_email: "a@x.gg", region_rank_points: 100, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p1}" }, as: OrganizerAdmin, captures: { r1: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Beta", manager_contact_email: "b@x.gg", region_rank_points: 80, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p2}" }, as: OrganizerAdmin, captures: { r2: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Gamma", manager_contact_email: "g@x.gg", region_rank_points: 60, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p3}" }, as: OrganizerAdmin, captures: { r3: $.data.id } }
            - { call: "POST /api/registrations", payload: { tournament_id: "${t}", team_name: "Delta", manager_contact_email: "d@x.gg", region_rank_points: 40, prior_event_points: 0, qualifier_wins: 0, captain_player_id: "${p4}" }, as: OrganizerAdmin, captures: { r4: $.data.id } }
            - { call: "POST /api/roster-slots", payload: { registration_id: "${r1}", player_id: "${p1}", slot_role: STARTER }, as: TeamManager, as_user_id: "${r1}" }
            - { call: "POST /api/roster-slots", payload: { registration_id: "${r2}", player_id: "${p2}", slot_role: STARTER }, as: TeamManager, as_user_id: "${r2}" }
            - { call: "POST /api/roster-slots", payload: { registration_id: "${r3}", player_id: "${p3}", slot_role: STARTER }, as: TeamManager, as_user_id: "${r3}" }
            - { call: "POST /api/roster-slots", payload: { registration_id: "${r4}", player_id: "${p4}", slot_role: STARTER }, as: TeamManager, as_user_id: "${r4}" }
            - { call: "POST /api/registrations/${r1}/submit", payload: {}, as: TeamManager, as_user_id: "${r1}" }
            - { call: "POST /api/registrations/${r2}/submit", payload: {}, as: TeamManager, as_user_id: "${r2}" }
            - { call: "POST /api/registrations/${r3}/submit", payload: {}, as: TeamManager, as_user_id: "${r3}" }
            - { call: "POST /api/registrations/${r4}/submit", payload: {}, as: TeamManager, as_user_id: "${r4}" }
            - { call: "POST /api/registrations/${r1}/review", payload: { action: APPROVE }, as: TournamentDirector }
            - { call: "POST /api/registrations/${r2}/review", payload: { action: APPROVE }, as: TournamentDirector }
            - { call: "POST /api/registrations/${r3}/review", payload: { action: APPROVE }, as: TournamentDirector }
            - { call: "POST /api/registrations/${r4}/review", payload: { action: APPROVE }, as: TournamentDirector }
            - { call: "POST /api/tournaments/${t}/fund", payload: { amount_cents: 250000 }, as: OrganizerAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: OrganizerAdmin }
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: REGISTRATION_LOCKED }, as: TournamentDirector }
            - { call: "GET /api/tournaments/${t}", as: TournamentDirector, captures: { tv: $.data.version } }
            - { call: "POST /api/tournaments/${t}/generate-bracket", payload: { expected_tournament_version: "${tv}" }, as: TournamentDirector }
            - { call: "POST /api/servers", payload: { tournament_id: "${t}", label: "S1", region: NA }, as: OrganizerAdmin, captures: { s1: $.data.id } }
            - { call: "GET /api/matches?tournament_id=${t}", as: TournamentDirector, captures: { m1: "$.data[0].id", m2: "$.data[1].id", mf: "$.data[2].id" } }
            - { call: "POST /api/matches/${m1}/schedule", payload: { server_id: "${s1}", scheduled_start_at: "2026-08-11T10:00:00Z", duration_minutes: 60, assigned_referee_id: "ref-1" }, as: TournamentDirector }
            - { call: "POST /api/matches/${m2}/schedule", payload: { server_id: "${s1}", scheduled_start_at: "2026-08-11T12:00:00Z", duration_minutes: 60, assigned_referee_id: "ref-1" }, as: TournamentDirector }
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: IN_PROGRESS }, as: TournamentDirector }
            - { call: "POST /api/matches/${m1}/officiate", payload: { action: OPEN_LOBBY }, as: Referee, as_user_id: "ref-1" }
            - { call: "POST /api/matches/${m1}/officiate", payload: { action: START }, as: Referee, as_user_id: "ref-1" }
            - { call: "POST /api/matches/${m1}/report-result", payload: { home_score: 13, away_score: 5 }, as: Referee, as_user_id: "ref-1" }
            - { call: "POST /api/matches/${m1}/confirm-result", payload: {}, as: Referee, as_user_id: "ref-2" }
            - { call: "POST /api/matches/${m2}/officiate", payload: { action: OPEN_LOBBY }, as: Referee, as_user_id: "ref-1" }
            - { call: "POST /api/matches/${m2}/officiate", payload: { action: START }, as: Referee, as_user_id: "ref-1" }
            - { call: "POST /api/matches/${m2}/report-result", payload: { home_score: 13, away_score: 9 }, as: Referee, as_user_id: "ref-1" }
            - { call: "POST /api/matches/${m2}/confirm-result", payload: {}, as: Referee, as_user_id: "ref-2" }
            - { call: "POST /api/matches/${mf}/schedule", payload: { server_id: "${s1}", scheduled_start_at: "2026-08-11T14:00:00Z", duration_minutes: 60, assigned_referee_id: "ref-1" }, as: TournamentDirector }
            - { call: "POST /api/matches/${mf}/officiate", payload: { action: OPEN_LOBBY }, as: Referee, as_user_id: "ref-1" }
            - { call: "POST /api/matches/${mf}/officiate", payload: { action: START }, as: Referee, as_user_id: "ref-1" }
            - { call: "POST /api/matches/${mf}/report-result", payload: { home_score: 13, away_score: 11 }, as: Referee, as_user_id: "ref-1" }
            - { call: "POST /api/matches/${mf}/confirm-result", payload: {}, as: Referee, as_user_id: "ref-2" }
            - { call: "POST /api/tournaments/${t}/advance", payload: { target_status: COMPLETED }, as: TournamentDirector }
            - { call: "GET /api/tournaments/${t}", as: PayoutOfficer, captures: { tv2: $.data.version } }
          trigger:
            - { call: "POST /api/tournaments/${t}/payout-records/compute", payload: { mode: FINAL, expected_tournament_version: "${tv2}" }, as: PayoutOfficer, captures: { pr1: "$.data[0].id", pr2: "$.data[1].id", pr3: "$.data[2].id", pr4: "$.data[3].id" } }
          assert:
            - "PayoutRecord.${pr1} (placement 1) gross_amount_cents == 125000 (50% of 250000, above floor)"
            - "PayoutRecord.${pr2} (placement 2) gross_amount_cents == 100000 (floor binds: raw 62500 < MIN_PLACEMENT_CENTS 100000)"
            - "PayoutRecord.${pr3} (placement 3, earlier-created registration ${r3}) gross_amount_cents == 25000 (remaining pool binds: min(100000, 25000))"
            - "PayoutRecord.${pr4} (placement 3, registration ${r4}) gross_amount_cents == 0 (pool exhausted by waterfall order)"
            - "sum of the four gross amounts == 250000 == funded pool (waterfall conserves the pool)"

      - name: prize_rounding_delta_tiebreak
        grounds:
          - calculations.prize_rounding_reconciliation
          - calculations.prize_pool_distribution
        distinguishing_aspect: |
          Mode (b) combinatorial formula: nested rounding where order matters — each
          record's exact gross (499999.5 cents) is rounded round_half_up BEFORE
          summation, producing sum 1000000 against pool 999999; the negative delta
          -1 is then assigned to the tied lowest-placement record whose registration
          was created first, so r3 pays 499999 and r4 pays 500000.
        test_recipe:
          setup:
            - "4-team tournament COMPLETED, pool target and funded exactly 999999 cents; placements r1=1, r2=2, r3=3, r4=3"
            - "champion r1's player and runner-up r2's player are both BANNED (3 strikes each); r1 and r2 are FORFEITED"
