  - rule_id: transitive_cascade
    instances:
      - name: settlement_cascade_five_hops_to_sibling_parking
        grounds:
          - state_machines.CreditTransfer.ACCEPTED_to_SETTLED
          - calculations.position_balance_and_availability
          - calculations.liquidity_alert_tier
          - calculations.operational_posture_derivation
          - entities.LiquidityAlert
          - entities.CreditTransfer.fields.clearing_status
        distinguishing_aspect: |
          One settlement propagates through five distinct entities without any further API call:
          ledger entry -> account balance/tier -> LiquidityAlert row opened -> participant posture
          SEND_FROZEN -> an unrelated sibling transfer parked as QUEUED_THROTTLED, which in turn
          removes that sibling from the reserved_cents input set. Hop 5 touches a row the trigger
          never named, and hop 5's side effect feeds back into hop 2's aggregate.
        test_recipe:
          setup:
            - "Alpha National Bank is LIVE with a position account of 1,200,000,000 cents (warning 1,100,000,000 / critical 1,000,000,000 / floor 200,000,000), a CORPORATE policy (per-transaction 250,000,000, daily 500,000,000, window count 5, window amount 400,000,000) and customer account CUST-ALPHA-0001 (CORPORATE, baseline 20)."
            - "Settlement cycle 2026-08-03 is OPEN."
            - "At 13:00 transfer T1 for 250,000,000 cents is created (fraud score 57, INITIATED) and accepted."
            - "At 13:05 sibling transfer T2 for 1,000,000 cents is created (fraud score 57, INITIATED) and is deliberately left un-accepted."
            - "Before the trigger the account shows current_balance_cents 1,200,000,000, reserved_cents 251,000,000, alert_tier GREEN and the participant is NORMAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
