  # ===========================================================================
  # Section: cross_cutting_layers (optimistic_concurrency, derived_field_reconciliation)
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_round_open_stale_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[submission-round-open-stale-version]", "errors[ERR_STALE_VERSION]", "validations[priority=5]"]
        distinguishing_aspect: "Round opened once (version 1 -> 2); a second open carrying the pre-open version 1 is rejected ERR_STALE_VERSION (412) — and because OCC (p5) precedes state (p6), the error is 412, not the 409 the already-OPEN state would otherwise produce."
        test_recipe:
          setup: ["signed pipeline; round r1 with one QUEUED submission; captured version rv1 == 1"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency OC1", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id } }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "Author One", email: "au1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { author1: $.data.id } }
            - { call: "POST /editors", payload: { agency_id: "${ag}", display_name: "Ed A", imprint: "IA", email: "eda@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { edA: $.data.id } }
