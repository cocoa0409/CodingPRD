              as: ProgramManager
              captures: { read_pkg_id: "$.data.id" }
          assert:
            - "the POST response already reports DataInvalidation.${inv_id}.hours_affected == 1080 with status == APPLIED"
            - "the immediately following batch read shows ${read_batch_id} == ${b25q1_id} with invalidated_hour_count == 1080, valid_hour_count == 1080, completeness_pct == 50.0 and regulatory_use_eligible == false"
            - "the immediately following package read shows ${read_pkg_id} == ${pkg_id} with included_batch_count == 4, eligible_batch_count == 3, rollup_completeness_pct == 87.7 - 100 * 7680 / 8760 rounded once - and certification_ready == false"
            - "no second write or delay was needed for either derived value to appear"
