  # ===========================================================================
  - section: errors
    instances:
      - name: transfer_reject_returns_reserved_to_source_floor
        claim_type: Side Effect Execution
        grounds: [state_machines.Transfer.DISPATCHED_to_REJECTED, calculations.inventory_available_and_reorder]
        distinguishing_aspect: "Rejecting a DISPATCHED transfer releases the source reservation: reserved_qty back to 0, available_qty restored to on_hand 10."
        test_recipe:
          setup: ["Transfer A->B quantity 3 DISPATCHED; source on_hand 10, reserved 3, available 7."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "A", code: "RJA", tax_rate_bps: 0 }
              as: StoreManager
              captures: { sa: $.data.id }
            - call: "POST /stores"
              payload: { name: "B", code: "RJB", tax_rate_bps: 0 }
              as: StoreManager
              captures: { sb: $.data.id }
            - call: "POST /products"
              payload: { sku: "PRJ", barcode: "BRJ", name: "P", list_price_cents: 100 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${sa}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { inva: $.data.id }
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inva}", counted_qty: 10 }
              as: InventoryClerk
              captures: { cs: $.data.id }
            - call: "POST /count-sheets/${cs}/post"
              payload: {}
              as: InventoryClerk
            - call: "POST /inventory-items"
              payload: { store_id: "${sb}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { invb: $.data.id }
            - call: "POST /transfers"
              payload: { from_store_id: "${sa}", to_store_id: "${sb}", product_id: "${p}", quantity: 3 }
              as: InventoryClerk
              captures: { tr: $.data.id, trv: $.data.version }
            - call: "POST /transfers/${tr}/dispatch"
              payload: { expected_transfer_version: "${trv}" }
              as: InventoryClerk
          trigger:
            - call: "POST /transfers/${tr}/reject"
              payload: {}
              as: InventoryClerk
          assert:
            - "Transfer.${tr}.status == REJECTED."
            - "InventoryItem.${inva}.reserved_qty == 0 and available_qty == 10 (units returned to source floor)."

      - name: transfer_receive_with_shrinkage
        claim_type: Side Effect Execution
        grounds: [state_machines.Transfer.DISPATCHED_to_RECEIVED, entities.Transfer.fields.received_qty]
        distinguishing_aspect: "Receive quantity 3 with received_qty 2: source on_hand drops by 3 (10->7), destination gains 2 (0->2); 1 unit shrinkage lands nowhere."
        test_recipe:
          setup: ["Transfer A->B quantity 3 DISPATCHED; source on_hand 10 reserved 3; dest on_hand 0."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "A", code: "SHA", tax_rate_bps: 0 }
              as: StoreManager
              captures: { sa: $.data.id }
            - call: "POST /stores"
              payload: { name: "B", code: "SHB", tax_rate_bps: 0 }
              as: StoreManager
              captures: { sb: $.data.id }
            - call: "POST /products"
              payload: { sku: "PSH", barcode: "BSH", name: "P", list_price_cents: 100 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${sa}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { inva: $.data.id }
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inva}", counted_qty: 10 }
              as: InventoryClerk
              captures: { cs: $.data.id }
            - call: "POST /count-sheets/${cs}/post"
              payload: {}
              as: InventoryClerk
            - call: "POST /inventory-items"
              payload: { store_id: "${sb}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { invb: $.data.id }
            - call: "POST /transfers"
              payload: { from_store_id: "${sa}", to_store_id: "${sb}", product_id: "${p}", quantity: 3 }
              as: InventoryClerk
              captures: { tr: $.data.id, trv: $.data.version }
            - call: "POST /transfers/${tr}/dispatch"
              payload: { expected_transfer_version: "${trv}" }
              as: InventoryClerk
          trigger:
            - call: "POST /transfers/${tr}/receive"
              payload: { received_qty: 2 }
              as: InventoryClerk
          assert:
            - "Transfer.${tr}.status == RECEIVED and received_qty == 2."
            - "InventoryItem.${inva}.on_hand_qty == 7 and reserved_qty == 0."
            - "InventoryItem.${invb}.on_hand_qty == 2 (1 unit shrinkage written off)."

      - name: layaway_cancel_refunds_deposit_and_releases_reservation
        claim_type: Side Effect Execution
