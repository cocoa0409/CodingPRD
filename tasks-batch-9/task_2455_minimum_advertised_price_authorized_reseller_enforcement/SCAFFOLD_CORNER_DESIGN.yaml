            - "${err} == 'ERR_TEST_PURCHASE_NOT_CONFIRMED'"
            - "TestPurchase.${tp}.status == SERIAL_CAPTURED"
            - "SerialUnit.${su1}.status == SHIPPED_TO_DISTRIBUTOR"
            - "Distributor.${dist}.chargeback_balance_cents == 0"

      - name: chargeback_against_a_distributor_that_never_shipped_the_unit_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]"]
        distinguishing_aspect: "The traced unit's shipped_distributor_id must equal the chargeback's distributor_id: billing Southpaw for a Northwind-shipped unit is ERR_DIVERSION_NOT_ATTRIBUTED."
        test_recipe:
