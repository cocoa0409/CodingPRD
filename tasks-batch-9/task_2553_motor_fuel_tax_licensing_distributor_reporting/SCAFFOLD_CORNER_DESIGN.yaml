              as: ReturnsExaminer
            - call: "POST /mft/returns/${ret_id}/file"
              payload: { attest_name: "W. Waterfall" }
              as: ReturnsExaminer
            - call: "POST /mft/refund-claims"
              payload: { licensee_id: "${dist_id}", claim_type: "OFF_ROAD", period_month: "2026-08", claimed_gallons: 60.00 }
