            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-10T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-01-15", term_end: "2026-05-01" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
            - { call: "POST /enrollment-files/${file_id}/certify", payload: {}, as: RegistrarCertifier, as_user_id: "${cert_uid}" }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { st1: "$.data[0].student_id" } }
            - { call: "POST /degree-records", payload: { institution_id: "${inst_id}", student_id: "${st1}", degree_level: "BACHELOR", degree_title: "BS CS", conferred_on: "2026-05-15" }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { deg1: "$.data.id" } }
            - { call: "POST /degree-records/${deg1}/seal", payload: {}, as: RegistrarCertifier, as_user_id: "${cert_uid}" }
            - { call: "POST /requesters", payload: { org_name: "Acme Hiring", requester_kind: "EMPLOYER", initial_credit_cents: 2599 }, as: ClearinghouseOps, captures: { rq_id: "$.data.id" } }
            - { call: "POST /requesters/${rq_id}/vet", payload: { outcome: "VET" }, as: ClearinghouseOps }
            - { call: "POST /verification-requests", payload: { requester_id: "${rq_id}", student_id: "${st1}", institution_id: "${inst_id}", product_type: "DEGREE", purpose: "EMPLOYMENT" }, as: Requester, as_user_id: "${rq_id}", captures: { vr1: "$.data.id" } }
