scaffold_corner_design:
  # =========================================================================
  # §1.9 — breadth coverage of every claim §1.1–§1.7 declares that §1.8 does
  # not already exercise. Organized per claim-extraction-guide section.
  # =========================================================================

  # ---------------------------------------------------------
  # Entities — creation / required fields / defaults / not-found
  # ---------------------------------------------------------
  - section: entities
    instances:
      - name: create_package_returns_201_and_persists_fields
        claim_type: creation
        grounds: [entities.ContentPackage, endpoints.POST_/wire/packages]
        distinguishing_aspect: "POST with all required fields returns 201 + id, status defaults to ACTIVE."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /wire/packages"
              payload: { code: "NP", display_name: "NatPlus", media_rights: "TEXT_PHOTO_VIDEO", base_monthly_fee_cents: 250000 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
          trigger:
            - call: "GET /wire/packages/${pkg_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Package.${pkg_id}.code == 'NP'"
            - "Package.${pkg_id}.status == 'ACTIVE'"
            - "Package.${pkg_id}.base_monthly_fee_cents == 250000"

      - name: create_package_missing_required_field_returns_validation
        claim_type: required_field_validation
        grounds: [entities.ContentPackage.fields.base_monthly_fee_cents]
        distinguishing_aspect: "Omitting required base_monthly_fee_cents returns ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /wire/packages"
              payload: { code: "XX", display_name: "X", media_rights: "TEXT_ONLY" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_VALIDATION'"

      - name: get_nonexistent_subscriber_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a UUID that does not match any subscriber returns 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /wire/subscribers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SalesOps
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_NOT_FOUND'"

      - name: subscriber_default_member_flag_and_credit_balance
        claim_type: defaults
        grounds: [entities.Subscriber.fields.is_member, entities.Subscriber.fields.member_credit_balance_cents]
        distinguishing_aspect: "Omitting is_member defaults to false; member_credit_balance_cents initializes to 0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /wire/subscribers"
              payload: { legal_name: "D", billing_email: "d@d.com", declared_audience: 1000 }
              as: SalesOps
              captures: { sub_id: $.data.id }
          trigger:
            - call: "GET /wire/subscribers/${sub_id}"
              payload: {}
              as: SalesOps
          assert:
            - "Subscriber.${sub_id}.is_member == false"
            - "Subscriber.${sub_id}.member_credit_balance_cents == 0"
            - "Subscriber.${sub_id}.status == 'ACTIVE'"

      - name: subscriber_list_pagination_returns_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "GET /wire/subscribers returns envelope with pagination fields and response_type=array."
        test_recipe:
          setup: ["Two subscribers"]
          setup_api_calls:
            - call: "POST /wire/subscribers"
              payload: { legal_name: "S1", billing_email: "s1@s.com", declared_audience: 1000 }
              as: SalesOps
            - call: "POST /wire/subscribers"
              payload: { legal_name: "S2", billing_email: "s2@s.com", declared_audience: 2000 }
              as: SalesOps
          trigger:
            - call: "GET /wire/subscribers?limit=1&offset=0"
              payload: {}
              as: SalesOps
          assert:
            - "response has meta.api_request_id"
            - "response.response_type == 'array'"
            - "response has total_count >= 2"
            - "response has has_more == true"

  # ---------------------------------------------------------
  # State Machines — invalid transitions, terminal lockdown
  # ---------------------------------------------------------
  - section: state_machines
    instances:
      - name: article_terminal_taken_down_rejects_withdraw
        claim_type: terminal_lockdown
        grounds: [state_machines.Article, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Article in TAKEN_DOWN is terminal; withdraw attempt returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Published article that has been taken down"]
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/feeds"
              payload: { code: "F", topic: "NATIONAL", embargo_window_minutes: 0 }
              as: PlatformAdmin
              captures: { feed_id: $.data.id }
            - call: "POST /wire/articles"
              payload: { feed_id: "${feed_id}", headline: "T", body_word_count: 100, slug: "t1" }
              as: Editor
              captures: { art_id: $.data.id }
            - call: "POST /wire/articles/${art_id}/publish"
              payload: {}
              as: Editor
            - call: "POST /wire/articles/${art_id}/takedown"
              payload: {}
              as: Legal
          trigger:
            - call: "POST /wire/articles/${art_id}/withdraw"
              payload: {}
              as: Editor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_INVALID_STATE'"

      - name: draft_article_cannot_be_withdrawn
        claim_type: invalid_transition
        grounds: [state_machines.Article.PUBLISHED_to_WITHDRAWN]
        distinguishing_aspect: "Withdraw from DRAFT (skipping publish) is rejected."
        test_recipe:
          setup: ["Draft article"]
          setup_api_calls:
            - call: "POST /wire/feeds"
              payload: { code: "F", topic: "SPORTS", embargo_window_minutes: 0 }
              as: PlatformAdmin
              captures: { feed_id: $.data.id }
            - call: "POST /wire/articles"
              payload: { feed_id: "${feed_id}", headline: "D", body_word_count: 100, slug: "d1" }
              as: Editor
              captures: { art_id: $.data.id }
          trigger:
            - call: "POST /wire/articles/${art_id}/withdraw"
              payload: {}
              as: Editor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_INVALID_STATE'"

      - name: invoice_terminal_paid_cannot_be_voided
        claim_type: terminal_lockdown
        grounds: [state_machines.Invoice]
        distinguishing_aspect: "Invoice in PAID is terminal; void attempt rejected."
        test_recipe:
          setup: ["Issued then paid invoice"]
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/packages"
              payload: { code: "P", display_name: "P", media_rights: "TEXT_ONLY", base_monthly_fee_cents: 10000 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /wire/tiers"
              payload: { code: "T", min_audience: 1, max_audience: 10000, circulation_multiplier_basis_points: 10000, monthly_republish_quota: 5, overage_per_article_cents: 100 }
              as: PlatformAdmin
            - call: "POST /wire/subscribers"
              payload: { legal_name: "I", billing_email: "i@i.com", declared_audience: 5000 }
              as: SalesOps
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /wire/subscribers/${sub_id}/subscriptions"
              payload: { package_id: "${pkg_id}", start_at: "2026-05-10T00:00:00Z" }
              as: SalesOps
              captures: { subp_id: $.data.id }
            - call: "POST /wire/subscriptions/${subp_id}/activate"
              payload: { expected_subscriber_version: "${sub_v}" }
              as: SalesOps
            - call: "POST /wire/subscriptions/${subp_id}/invoices"
              payload: { billing_month: "2026-05" }
              as: Billing
              captures: { inv_id: $.data.id }
            - call: "POST /wire/invoices/${inv_id}/issue"
              payload: {}
              as: Billing
            - call: "POST /wire/invoices/${inv_id}/pay"
              payload: {}
              as: Billing
          trigger:
            - call: "POST /wire/invoices/${inv_id}/void"
              payload: {}
              as: Billing
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_INVALID_STATE'"

      - name: cancel_subscription_before_min_commitment_rejected
        claim_type: invalid_transition
        grounds: ["validations[priority=11]", "errors[ERR_MIN_COMMITMENT_NOT_MET]"]
        distinguishing_aspect: "Cancel with months_used_current_period < 3 returns ERR_MIN_COMMITMENT_NOT_MET."
        test_recipe:
          setup: ["Subscription activated today (months_used_current_period == 0)"]
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/packages"
              payload: { code: "P", display_name: "P", media_rights: "TEXT_ONLY", base_monthly_fee_cents: 10000 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /wire/tiers"
              payload: { code: "T", min_audience: 1, max_audience: 10000, circulation_multiplier_basis_points: 10000, monthly_republish_quota: 5, overage_per_article_cents: 100 }
              as: PlatformAdmin
            - call: "POST /wire/subscribers"
              payload: { legal_name: "MC", billing_email: "mc@mc.com", declared_audience: 5000 }
              as: SalesOps
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /wire/subscribers/${sub_id}/subscriptions"
              payload: { package_id: "${pkg_id}", start_at: "2026-05-10T00:00:00Z" }
              as: SalesOps
              captures: { subp_id: $.data.id }
            - call: "POST /wire/subscriptions/${subp_id}/activate"
              payload: { expected_subscriber_version: "${sub_v}" }
              as: SalesOps
          trigger:
            - call: "POST /wire/subscriptions/${subp_id}/cancel"
              payload: {}
              as: SalesOps
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_MIN_COMMITMENT_NOT_MET'"

  # ---------------------------------------------------------
  # Calculations — precision, boundary, computed-field correctness
  # ---------------------------------------------------------
  - section: calculations
    instances:
      - name: tier_multiplier_rounding_half_up
        claim_type: precision
        grounds: [calculations.price_monthly_subscription]
        distinguishing_aspect: "base=33333 cents, multiplier=15000 bp → gross = round_half_up(33333*1.5) = round_half_up(49999.5) = 50000 (not 49999)."
        test_recipe:
          setup: ["Package base=33333, tier multiplier=15000bp, member_discount_pct=0, audience 5000"]
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/packages"
              payload: { code: "P", display_name: "P", media_rights: "TEXT_ONLY", base_monthly_fee_cents: 33333 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /wire/tiers"
              payload: { code: "T", min_audience: 1, max_audience: 10000, circulation_multiplier_basis_points: 15000, monthly_republish_quota: 5, overage_per_article_cents: 100, member_discount_pct: 0 }
              as: PlatformAdmin
            - call: "POST /wire/subscribers"
              payload: { legal_name: "R", billing_email: "r@r.com", declared_audience: 5000 }
              as: SalesOps
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /wire/subscribers/${sub_id}/subscriptions"
              payload: { package_id: "${pkg_id}", start_at: "2026-05-10T00:00:00Z" }
              as: SalesOps
              captures: { subp_id: $.data.id }
          trigger:
            - call: "POST /wire/subscriptions/${subp_id}/activate"
              payload: { expected_subscriber_version: "${sub_v}" }
              as: SalesOps
          assert:
            - "Subscription.${subp_id}.monthly_price_cents == 50000"

      - name: no_matching_tier_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_NO_MATCHING_TIER]"]
        distinguishing_aspect: "declared_audience falls outside every ACTIVE tier window → ERR_NO_MATCHING_TIER."
        test_recipe:
          setup: ["Only tier covers 1..10000; subscriber audience=999999"]
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/packages"
              payload: { code: "P", display_name: "P", media_rights: "TEXT_ONLY", base_monthly_fee_cents: 10000 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /wire/tiers"
              payload: { code: "T", min_audience: 1, max_audience: 10000, circulation_multiplier_basis_points: 10000, monthly_republish_quota: 5, overage_per_article_cents: 100 }
              as: PlatformAdmin
            - call: "POST /wire/subscribers"
              payload: { legal_name: "NM", billing_email: "nm@nm.com", declared_audience: 999999 }
              as: SalesOps
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /wire/subscribers/${sub_id}/subscriptions"
              payload: { package_id: "${pkg_id}", start_at: "2026-05-10T00:00:00Z" }
              as: SalesOps
              captures: { subp_id: $.data.id }
          trigger:
            - call: "POST /wire/subscriptions/${subp_id}/activate"
              payload: { expected_subscriber_version: "${sub_v}" }
              as: SalesOps
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_NO_MATCHING_TIER'"

      - name: ambiguous_tier_overlap_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_AMBIGUOUS_TIER]"]
        distinguishing_aspect: "Two ACTIVE tiers both cover audience=5000 → ERR_AMBIGUOUS_TIER."
        test_recipe:
          setup: ["Tier A: min=1, max=10000; Tier B: min=5000, max=20000; both ACTIVE; subscriber audience=5000"]
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/packages"
              payload: { code: "P", display_name: "P", media_rights: "TEXT_ONLY", base_monthly_fee_cents: 10000 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /wire/tiers"
              payload: { code: "TA", min_audience: 1, max_audience: 10000, circulation_multiplier_basis_points: 10000, monthly_republish_quota: 5, overage_per_article_cents: 100 }
              as: PlatformAdmin
            - call: "POST /wire/tiers"
              payload: { code: "TB", min_audience: 5000, max_audience: 20000, circulation_multiplier_basis_points: 11000, monthly_republish_quota: 5, overage_per_article_cents: 100 }
              as: PlatformAdmin
            - call: "POST /wire/subscribers"
              payload: { legal_name: "AMB", billing_email: "amb@amb.com", declared_audience: 5000 }
              as: SalesOps
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /wire/subscribers/${sub_id}/subscriptions"
              payload: { package_id: "${pkg_id}", start_at: "2026-05-10T00:00:00Z" }
              as: SalesOps
              captures: { subp_id: $.data.id }
          trigger:
            - call: "POST /wire/subscriptions/${subp_id}/activate"
              payload: { expected_subscriber_version: "${sub_v}" }
              as: SalesOps
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_AMBIGUOUS_TIER'"

  # ---------------------------------------------------------
  # Validations — auth, role gating
  # ---------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Any endpoint called without role header returns 401."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /wire/subscribers"
              payload: {}
              as: __NO_ROLE__
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_UNAUTHENTICATED'"

      - name: editor_cannot_terminate_subscriber
        claim_type: rbac_denial
        grounds: ["validations[priority=2]", roles]
        distinguishing_aspect: "Editor attempting SalesOps-exclusive terminate returns ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["One ACTIVE subscriber"]
          setup_api_calls:
            - call: "POST /wire/subscribers"
              payload: { legal_name: "V", billing_email: "v@v.com", declared_audience: 1000 }
              as: SalesOps
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /wire/subscribers/${sub_id}/terminate"
              payload: {}
              as: Editor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_UNAUTHORIZED'"

      - name: auditor_cannot_publish_article
        claim_type: rbac_denial
        grounds: ["validations[priority=2]", roles]
        distinguishing_aspect: "Auditor attempting Editor-exclusive publish returns ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Draft article"]
          setup_api_calls:
            - call: "POST /wire/feeds"
              payload: { code: "F", topic: "WORLD", embargo_window_minutes: 0 }
              as: PlatformAdmin
              captures: { feed_id: $.data.id }
            - call: "POST /wire/articles"
              payload: { feed_id: "${feed_id}", headline: "H", body_word_count: 100, slug: "h" }
              as: Editor
              captures: { art_id: $.data.id }
          trigger:
            - call: "POST /wire/articles/${art_id}/publish"
              payload: {}
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_UNAUTHORIZED'"

  # ---------------------------------------------------------
  # Endpoints — OCC behavior, side-effect verification
  # ---------------------------------------------------------
  - section: endpoints
    instances:
      - name: activate_with_stale_subscriber_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[subscription-activation-stale-subscriber]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "expected_subscriber_version < current subscriber.version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Subscriber created (v1); then subscriber is suspended (v2); then reinstated (v3)"]
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/packages"
              payload: { code: "P", display_name: "P", media_rights: "TEXT_ONLY", base_monthly_fee_cents: 10000 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /wire/tiers"
              payload: { code: "T", min_audience: 1, max_audience: 10000, circulation_multiplier_basis_points: 10000, monthly_republish_quota: 5, overage_per_article_cents: 100 }
              as: PlatformAdmin
            - call: "POST /wire/subscribers"
              payload: { legal_name: "S", billing_email: "s@s.com", declared_audience: 5000 }
              as: SalesOps
              captures: { sub_id: $.data.id, sub_v1: $.data.version }
            - call: "POST /wire/subscribers/${sub_id}/suspend"
              payload: {}
              as: SalesOps
            - call: "POST /wire/subscribers/${sub_id}/reinstate"
              payload: {}
              as: SalesOps
            - call: "POST /wire/subscribers/${sub_id}/subscriptions"
              payload: { package_id: "${pkg_id}", start_at: "2026-05-10T00:00:00Z" }
              as: SalesOps
              captures: { subp_id: $.data.id }
          trigger:
            - call: "POST /wire/subscriptions/${subp_id}/activate"
              payload: { expected_subscriber_version: "${sub_v1}" }
              as: SalesOps
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_STALE_VERSION'"

      - name: republish_with_stale_article_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[article-republish-stale-article]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Republish with expected_article_version older than current returns 412."
        test_recipe:
          setup: ["Published article (v2), withdrawn (v3). Client holds stale v2."]
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/feeds"
              payload: { code: "F", topic: "NATIONAL", embargo_window_minutes: 0 }
              as: PlatformAdmin
              captures: { feed_id: $.data.id }
            - call: "POST /wire/articles"
              payload: { feed_id: "${feed_id}", headline: "X", body_word_count: 100, slug: "x" }
              as: Editor
              captures: { art_id: $.data.id, art_v1: $.data.version }
            - call: "POST /wire/articles/${art_id}/publish"
              payload: {}
              as: Editor
              captures: { art_v2: $.data.version }
            - call: "POST /wire/articles/${art_id}/withdraw"
              payload: {}
              as: Editor
          trigger:
            - call: "POST /wire/articles/${art_id}/republish"
              payload: { expected_article_version: "${art_v1}" }
              as: Editor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_STALE_VERSION'"

      - name: subscriberrep_reads_own_subscription
        claim_type: rbac_allow
        grounds: [roles.SubscriberRep]
        distinguishing_aspect: "SubscriberRep may GET own subscription but not other subscriber's."
        test_recipe:
          setup: ["Two subscribers, each with subscription"]
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/packages"
              payload: { code: "P", display_name: "P", media_rights: "TEXT_ONLY", base_monthly_fee_cents: 10000 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /wire/tiers"
              payload: { code: "T", min_audience: 1, max_audience: 10000, circulation_multiplier_basis_points: 10000, monthly_republish_quota: 5, overage_per_article_cents: 100 }
              as: PlatformAdmin
            - call: "POST /wire/subscribers"
              payload: { legal_name: "A", billing_email: "a@a.com", declared_audience: 5000 }
              as: SalesOps
              captures: { sub_a: $.data.id, sub_a_v: $.data.version }
            - call: "POST /wire/subscribers"
              payload: { legal_name: "B", billing_email: "b@b.com", declared_audience: 5000 }
              as: SalesOps
              captures: { sub_b: $.data.id, sub_b_v: $.data.version }
            - call: "POST /wire/subscribers/${sub_a}/subscriptions"
              payload: { package_id: "${pkg_id}", start_at: "2026-05-10T00:00:00Z" }
              as: SalesOps
              captures: { subp_a: $.data.id }
            - call: "POST /wire/subscribers/${sub_b}/subscriptions"
              payload: { package_id: "${pkg_id}", start_at: "2026-05-10T00:00:00Z" }
              as: SalesOps
              captures: { subp_b: $.data.id }
          trigger:
            - call: "GET /wire/subscriptions/${subp_b}"
              payload: {}
              as: SubscriberRep
              as_user_id: "${sub_a}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_FORBIDDEN_CROSS_ACCOUNT'"

  # ---------------------------------------------------------
  # Errors — every error code triggerable
  # ---------------------------------------------------------
  - section: errors
    instances:
      - name: rights_violation_on_taken_down_article
        claim_type: violation_to_error
        grounds: ["errors[ERR_RIGHTS_VIOLATION]"]
        distinguishing_aspect: "Republication attempt on TAKEN_DOWN article returns ERR_RIGHTS_VIOLATION."
        test_recipe:
          setup: ["Published then taken-down article; subscriber with live entitlement"]
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/packages"
              payload: { code: "P", display_name: "P", media_rights: "TEXT_ONLY", base_monthly_fee_cents: 10000 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /wire/tiers"
              payload: { code: "T", min_audience: 1, max_audience: 10000, circulation_multiplier_basis_points: 10000, monthly_republish_quota: 5, overage_per_article_cents: 100 }
              as: PlatformAdmin
            - call: "POST /wire/feeds"
              payload: { code: "F", topic: "NATIONAL", embargo_window_minutes: 0 }
              as: PlatformAdmin
              captures: { feed_id: $.data.id }
            - call: "POST /wire/subscribers"
              payload: { legal_name: "S", billing_email: "s@s.com", declared_audience: 5000 }
              as: SalesOps
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /wire/subscribers/${sub_id}/subscriptions"
              payload: { package_id: "${pkg_id}", start_at: "2026-05-10T00:00:00Z" }
              as: SalesOps
              captures: { subp_id: $.data.id }
            - call: "POST /wire/subscriptions/${subp_id}/activate"
              payload: { expected_subscriber_version: "${sub_v}" }
              as: SalesOps
            - call: "POST /wire/subscriptions/${subp_id}/entitlements"
              payload: { feed_id: "${feed_id}" }
              as: SalesOps
            - call: "POST /wire/articles"
              payload: { feed_id: "${feed_id}", headline: "TD", body_word_count: 100, slug: "td" }
              as: Editor
              captures: { art_id: $.data.id }
            - call: "POST /wire/articles/${art_id}/publish"
              payload: {}
              as: Editor
            - call: "POST /wire/articles/${art_id}/takedown"
              payload: {}
              as: Legal
          trigger:
            - call: "POST /wire/publications"
              payload: { subscription_id: "${subp_id}", article_id: "${art_id}" }
              as: SubscriberRep
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_RIGHTS_VIOLATION'"

  # ---------------------------------------------------------
  # RBAC — segregation of duties
  # ---------------------------------------------------------
  - section: rbac
    instances:
      - name: legal_role_only_performs_takedown
        claim_type: role_exclusive_operation
        grounds: [roles.Legal]
        distinguishing_aspect: "Legal can takedown; Legal CANNOT publish (Editor's exclusive op)."
        test_recipe:
          setup: ["Draft article"]
          setup_api_calls:
            - call: "POST /wire/feeds"
              payload: { code: "F", topic: "WORLD", embargo_window_minutes: 0 }
              as: PlatformAdmin
              captures: { feed_id: $.data.id }
            - call: "POST /wire/articles"
              payload: { feed_id: "${feed_id}", headline: "L", body_word_count: 100, slug: "l" }
              as: Editor
              captures: { art_id: $.data.id }
          trigger:
            - call: "POST /wire/articles/${art_id}/publish"
              payload: {}
              as: Legal
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_UNAUTHORIZED'"

      - name: billing_cannot_grant_entitlement
        claim_type: role_exclusive_operation
        grounds: [roles.Billing]
        distinguishing_aspect: "Billing attempting SalesOps-exclusive grant returns ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Active subscription"]
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/packages"
              payload: { code: "P", display_name: "P", media_rights: "TEXT_ONLY", base_monthly_fee_cents: 10000 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /wire/tiers"
              payload: { code: "T", min_audience: 1, max_audience: 10000, circulation_multiplier_basis_points: 10000, monthly_republish_quota: 5, overage_per_article_cents: 100 }
              as: PlatformAdmin
            - call: "POST /wire/feeds"
              payload: { code: "F", topic: "BUSINESS", embargo_window_minutes: 0 }
              as: PlatformAdmin
              captures: { feed_id: $.data.id }
            - call: "POST /wire/subscribers"
              payload: { legal_name: "B", billing_email: "b@b.com", declared_audience: 5000 }
              as: SalesOps
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /wire/subscribers/${sub_id}/subscriptions"
              payload: { package_id: "${pkg_id}", start_at: "2026-05-10T00:00:00Z" }
              as: SalesOps
              captures: { subp_id: $.data.id }
            - call: "POST /wire/subscriptions/${subp_id}/activate"
              payload: { expected_subscriber_version: "${sub_v}" }
              as: SalesOps
          trigger:
            - call: "POST /wire/subscriptions/${subp_id}/entitlements"
              payload: { feed_id: "${feed_id}" }
              as: Billing
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_UNAUTHORIZED'"
