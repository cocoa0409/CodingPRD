        test_recipe:
          setup: ["clock 2026-08-01T00:00:00Z; officer; insider policy/training current; request UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
