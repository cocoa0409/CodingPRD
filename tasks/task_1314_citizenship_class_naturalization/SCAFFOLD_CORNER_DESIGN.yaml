  # ===================================================================
  # Section: consistency_model
  # ===================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_computed_fields_in_create_response
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, entities.Screening.fields.outcome]
        distinguishing_aspect: "Immediate consistency: the screening creation response already contains the computed outcome, required_document_count appears on the waiver creation response, and the enrollment creation response shows the recomputed attendance_bp — no re-read needed."
        test_recipe:
          setup: ["program; applicant"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "A One", email: "a@x.com", date_of_birth: "1990-01-01" }
              as: IntakeCoordinator
              captures: { app_id: $.data.id, app_v: $.data.version }
          trigger:
            - call: "POST /naturalization/applicants/${app_id}/screenings"
              payload: { expected_applicant_version: "${app_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 36, english_level: 2, civics_practice_pct: 50, has_legal_flag: false }
              as: IntakeCoordinator
              captures: { oc: $.data.outcome }
            - call: "POST /naturalization/applicants/${app_id}/fee-waiver-requests"
              payload: { household_size: 3, self_reported_income_cents: 2000000, self_reported_benefit: false }
              as: IntakeCoordinator
              captures: { req_docs: $.data.required_document_count }
          assert:
            - "screening create response data.outcome == ELIGIBLE (computed inline)"
            - "screening response data.expires_at == created_at + 180 days (2026-08-01T00:00:00Z + 180d = 2027-01-28T00:00:00Z)"
            - "waiver create response data.required_document_count == 4 (household 3 + 1, computed inline)"
