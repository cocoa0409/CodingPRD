              captures: { ti1: "$.data.id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti1}", category: "IT_EQUIPMENT", description: "Federally donated switch stack", acquisition_cost_cents: 1449920, acquisition_date: "2023-11-02", federal_source: true, federal_use_period_start_on: "2025-08-15" }
              as: AgencyOfficer
              as_user_id: "${ag_st}"
              captures: { a_f: "$.data.id", a_f_v: "$.data.version" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti1}", category: "VEHICLE", description: "Federally donated crew cab pickup", acquisition_cost_cents: 3217467, acquisition_date: "2019-03-15", federal_source: true, federal_use_period_start_on: "2024-12-31", vin: "1FT7W2BT9KEB77777", odometer_reading: 156780, title_number: "TX-77777" }
              as: AgencyOfficer
              as_user_id: "${ag_st}"
