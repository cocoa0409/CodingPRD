    output: Title[]
    side_effects: []
  - method: GET
    path: "/lending/titles/{id}"
    description: "Read a title"
    roles: [ConsortiumAdmin, LibraryAdmin, Patron, SystemAnalyst]
    code: 200
    input: []
    output: Title
    side_effects: []
  - method: GET
    path: "/lending/titles/{id}/availability"
    description: "Computed availability for a title from the perspective of a library (defaults to the requesting patron's home library)"
    roles: [ConsortiumAdmin, LibraryAdmin, Patron, SystemAnalyst]
    code: 200
    input: ["library_id?"]
    output: { copies_available: integer, active_holds: integer, optimistic_wait_days: integer, pessimistic_wait_days: integer }
    side_effects: []
  - method: GET
    path: "/lending/licenses"
    description: "Filtered license list (reverse reachability for License FKs)"
    roles: [ConsortiumAdmin, LibraryAdmin, SystemAnalyst]
    code: 200
    input: ["title_id?", "library_id?", "acquisition_order_id?", "model?", "status?", "limit?", "offset?"]
    output: License[]
    side_effects: []
  - method: GET
    path: "/lending/licenses/{id}"
    description: "Read a license"
    roles: [ConsortiumAdmin, LibraryAdmin, SystemAnalyst]
    code: 200
    input: []
    output: License
    side_effects: []
  - method: POST
    path: "/lending/licenses/{id}/retire"
    description: "Retire a license with no active loans"
    roles: [LibraryAdmin]
    code: 200
    input: []
    output: License
    side_effects: ["ACTIVE -> RETIRED"]
  # ---- loans ----
  - method: POST
    path: "/lending/loans"
    description: "Checkout: create a loan selecting a license by the pinned selector (model order OCOU > METERED_TIME > METERED_CIRC > COST_PER_CIRC > SIMULTANEOUS_USE, then expires_at ASC nulls-last, then created_at ASC). Direct checkout is rejected while any hold queue exists on the title unless skip_the_line=true."
    roles: [Patron]
    code: 201
    input: [patron_id, title_id, "skip_the_line?"]
    output: Loan
    side_effects: ["creates Loan ACTIVE; OCOU copies_on_loan += 1; METERED_CIRC circs_consumed += 1; COST_PER_CIRC deducts discounted charge and accrues to patron home fund; writes CHECKOUT event; patron.active_loan_count += 1; fails ERR_NO_LICENSE_AVAILABLE when the selector finds no eligible license"]
  - method: GET
    path: "/lending/loans"
    description: "Filtered loan list (reverse reachability for Loan FKs)"
    roles: [ConsortiumAdmin, LibraryAdmin, SystemAnalyst]
    code: 200
    input: ["license_id?", "patron_id?", "hold_id?", "status?", "limit?", "offset?"]
    output: Loan[]
    side_effects: []
  - method: GET
    path: "/lending/loans/{id}"
    description: "Read a loan"
    roles: [LibraryAdmin, Patron, SystemAnalyst]
    code: 200
    input: []
    output: Loan
    side_effects: []
  - method: POST
    path: "/lending/loans/{id}/return"
    description: "Early return; frees the copy and runs hold promotion"
    roles: [Patron]
    code: 200
    input: []
    output: Loan
    side_effects: ["ACTIVE -> RETURNED; METERED_CIRC grace restore within 2 hours of checkout; promotion cascade"]
  - method: POST
    path: "/lending/loans/{id}/renew"
    description: "Renew a loan (self-loop on ACTIVE; additive due_at)"
    roles: [Patron]
    code: 200
    input: []
    output: Loan
    side_effects: ["due_at += library.renewal_period_days; renewals_used += 1; RENEW event"]
  # ---- holds ----
  - method: POST
    path: "/lending/holds"
    description: "Place a hold on a title"
    roles: [Patron]
    code: 201
    input: [patron_id, title_id]
    output: Hold
    side_effects: ["status=PLACED; computes optimistic_wait_days/pessimistic_wait_days; HOLD_PLACED event; patron.active_hold_count += 1"]
  - method: GET
    path: "/lending/holds"
    description: "Filtered hold list (reverse reachability for Hold FKs)"
    roles: [ConsortiumAdmin, LibraryAdmin, Patron, SystemAnalyst]
    code: 200
    input: ["title_id?", "patron_id?", "library_id?", "status?", "limit?", "offset?"]
    output: Hold[]
    side_effects: []
  - method: GET
    path: "/lending/holds/{id}"
    description: "Read a hold"
    roles: [LibraryAdmin, Patron, SystemAnalyst]
    code: 200
    input: []
    output: Hold
    side_effects: []
  - method: POST
    path: "/lending/holds/{id}/suspend"
    description: "Suspend a PLACED hold (keeps queue rank)"
    roles: [Patron]
    code: 200
    input: []
    output: Hold
    side_effects: ["PLACED -> SUSPENDED; suspension_count += 1"]
  - method: POST
    path: "/lending/holds/{id}/resume"
    description: "Resume a SUSPENDED hold (original placed_at preserved)"
    roles: [Patron]
    code: 200
    input: []
    output: Hold
    side_effects: ["SUSPENDED -> PLACED"]
  - method: POST
    path: "/lending/holds/{id}/cancel"
    description: "Cancel a hold from PLACED, SUSPENDED, or READY (READY releases the reserved copy and promotes the next hold)"
    roles: [Patron]
    code: 200
    input: []
    output: Hold
    side_effects: ["-> CANCELLED; HOLD_CANCELLED event; READY-cancel releases copy and re-promotes"]
  - method: POST
    path: "/lending/holds/{id}/claim"
    description: "Claim a READY hold, converting it into a loan on the reserved copy"
    roles: [Patron]
    code: 201
    input: []
    output: Loan
    side_effects: ["READY -> FULFILLED; creates Loan; CPC deduction when the reserved license is COST_PER_CIRC; HOLD_FULFILLED + CHECKOUT events"]
  # ---- acquisitions ----
  - method: POST
    path: "/lending/acquisition-orders"
    description: "Create a purchase order in DRAFT (OCC on BudgetFund.version)"
    roles: [LibraryAdmin]
    code: 201
    input: [library_id, budget_fund_id, title_id, model, expected_budget_fund_version, "copies?", "prepaid_balance_cents?"]
    output: AcquisitionOrder
    side_effects: ["computes estimated_cost_cents; increments BudgetFund.version by 1"]
  - method: GET
    path: "/lending/acquisition-orders"
    description: "Filtered order list (reverse reachability for AcquisitionOrder FKs)"
    roles: [ConsortiumAdmin, LibraryAdmin, SystemAnalyst]
    code: 200
    input: ["library_id?", "budget_fund_id?", "title_id?", "status?", "limit?", "offset?"]
    output: AcquisitionOrder[]
    side_effects: []
  - method: GET
    path: "/lending/acquisition-orders/{id}"
    description: "Read an order"
    roles: [ConsortiumAdmin, LibraryAdmin, SystemAnalyst]
    code: 200
    input: []
    output: AcquisitionOrder
    side_effects: []
  - method: POST
    path: "/lending/acquisition-orders/{id}/propose"
    description: "Submit a DRAFT order for approval"
    roles: [LibraryAdmin]
    code: 200
    input: []
    output: AcquisitionOrder
    side_effects: ["DRAFT -> PROPOSED"]
  - method: POST
    path: "/lending/acquisition-orders/{id}/approve"
    description: "Approve a PROPOSED order (fund OPEN, in-period, budget gate)"
    roles: [LibraryAdmin]
    code: 200
    input: []
    output: AcquisitionOrder
    side_effects: ["PROPOSED -> APPROVED; fund.committed_cents += estimated_cost_cents; increments BudgetFund.version by 1"]
  - method: POST
    path: "/lending/acquisition-orders/{id}/reject"
    description: "Reject a PROPOSED order"
    roles: [LibraryAdmin]
    code: 200
    input: []
    output: AcquisitionOrder
    side_effects: ["PROPOSED -> REJECTED"]
  - method: POST
    path: "/lending/acquisition-orders/{id}/revise"
    description: "Send a REJECTED order back to DRAFT, optionally changing model/copies/prepaid balance"
    roles: [LibraryAdmin]
    code: 200
    input: ["model?", "copies?", "prepaid_balance_cents?"]
    output: AcquisitionOrder
    side_effects: ["REJECTED -> DRAFT; estimated_cost_cents recomputed"]
  - method: POST
    path: "/lending/acquisition-orders/{id}/cancel"
    description: "Cancel an order from DRAFT, PROPOSED, or APPROVED (APPROVED releases its commitment)"
    roles: [LibraryAdmin]
    code: 200
    input: []
    output: AcquisitionOrder
    side_effects: ["-> CANCELLED; APPROVED cancel: fund.committed_cents -= estimated_cost_cents; increments BudgetFund.version by 1"]
  - method: POST
    path: "/lending/acquisition-orders/{id}/fulfill"
    description: "Fulfill an APPROVED order: creates the License and runs hold promotion"
    roles: [LibraryAdmin]
    code: 200
    input: [invoiced_cost_cents]
    output: AcquisitionOrder
    side_effects: ["APPROVED -> FULFILLED; creates License ACTIVE; fund committed->spent ledger move; PURCHASE event; promotion cascade"]
  # ---- consortium invoicing ----
  - method: POST
    path: "/lending/consortiums/{id}/invoices/generate"
    description: "Generate a DRAFT consortium invoice for a window (shared-title allocation + CPC pass-through)"
    roles: [ConsortiumAdmin]
    code: 201
    input: [period_start, period_end]
    output: ConsortiumInvoice
    side_effects: ["computes lines via calculations.consortium_allocation"]
  - method: GET
    path: "/lending/consortiums/{id}/invoices"
    description: "List invoices of a consortium"
    roles: [ConsortiumAdmin, LibraryAdmin, SystemAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ConsortiumInvoice[]
    side_effects: []
  - method: GET
    path: "/lending/consortium-invoices/{id}"
    description: "Read an invoice"
    roles: [ConsortiumAdmin, LibraryAdmin, SystemAnalyst]
    code: 200
    input: []
    output: ConsortiumInvoice
    side_effects: []
  - method: POST
    path: "/lending/consortium-invoices/{id}/issue"
    description: "Issue a DRAFT invoice; re-issue a DISPUTED one after recomputing lines"
    roles: [ConsortiumAdmin]
    code: 200
    input: []
    output: ConsortiumInvoice
    side_effects: ["DRAFT|DISPUTED -> ISSUED"]
  - method: POST
    path: "/lending/consortium-invoices/{id}/dispute"
    description: "A billed member library disputes an ISSUED invoice"
    roles: [LibraryAdmin]
    code: 200
    input: ["reason?"]
    output: ConsortiumInvoice
    side_effects: ["ISSUED -> DISPUTED"]
  - method: POST
    path: "/lending/consortium-invoices/{id}/settle"
    description: "Settle an ISSUED invoice"
    roles: [ConsortiumAdmin]
    code: 200
    input: []
    output: ConsortiumInvoice
    side_effects: ["ISSUED -> SETTLED"]
  # ---- events & reporting ----
  - method: GET
    path: "/lending/circulation-events"
    description: "Filtered event list (reverse reachability for all CirculationEvent FKs)"
    roles: [ConsortiumAdmin, LibraryAdmin, SystemAnalyst]
    code: 200
    input: ["library_id?", "title_id?", "patron_id?", "loan_id?", "hold_id?", "license_id?", "event_type?", "limit?", "offset?"]
    output: CirculationEvent[]
    side_effects: []
  - method: GET
    path: "/lending/libraries/{id}/circulation-events"
    description: "Events attributed to a library (sub-resource reverse reachability)"
    roles: [ConsortiumAdmin, LibraryAdmin, SystemAnalyst]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: CirculationEvent[]
    side_effects: []
  - method: GET
    path: "/lending/titles/{id}/circulation-events"
    description: "Events involving a title (sub-resource reverse reachability)"
    roles: [ConsortiumAdmin, LibraryAdmin, SystemAnalyst]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: CirculationEvent[]
    side_effects: []
  - method: GET
    path: "/lending/patrons/{id}/circulation-events"
    description: "Events involving a patron (sub-resource reverse reachability)"
    roles: [ConsortiumAdmin, LibraryAdmin, SystemAnalyst]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: CirculationEvent[]
    side_effects: []
  - method: GET
    path: "/lending/loans/{id}/circulation-events"
    description: "Events involving a loan (sub-resource reverse reachability)"
    roles: [ConsortiumAdmin, LibraryAdmin, SystemAnalyst]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: CirculationEvent[]
    side_effects: []
  - method: GET
    path: "/lending/licenses/{id}/circulation-events"
    description: "Events involving a license (sub-resource reverse reachability)"
    roles: [ConsortiumAdmin, LibraryAdmin, SystemAnalyst]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: CirculationEvent[]
    side_effects: []
  - method: GET
    path: "/lending/holds/{id}/circulation-events"
    description: "Events involving a hold (sub-resource reverse reachability)"
    roles: [ConsortiumAdmin, LibraryAdmin, SystemAnalyst]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: CirculationEvent[]
    side_effects: []
  - method: POST
    path: "/lending/libraries/{id}/usage-snapshots"
    description: "Generate a usage snapshot for a library over a window"
    roles: [LibraryAdmin, SystemAnalyst]
    code: 201
    input: [period_start, period_end]
    output: UsageSnapshot
    side_effects: ["computes rollup via calculations.usage_snapshot_rollup"]
  - method: GET
    path: "/lending/libraries/{id}/usage-snapshots"
    description: "List a library's usage snapshots"
    roles: [LibraryAdmin, SystemAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: UsageSnapshot[]
    side_effects: []
  - method: GET
    path: "/lending/usage-snapshots/{id}"
    description: "Read a usage snapshot"
    roles: [LibraryAdmin, SystemAnalyst]
    code: 200
    input: []
    output: UsageSnapshot
    side_effects: []
  # ---- test-driving endpoints ----
  - method: POST
    path: "/lending/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any set) is exactly 2026-09-01T00:00:00Z; the server never falls back to wall-clock time."
    roles: [ConsortiumAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock advanced (or rewound) to the given instant"]
  - method: POST
    path: "/lending/_ops/run_epoch"
    description: "Ops-run checkpoint: expire due loans, expire READY holds past pickup, expire metered licenses, expire cards, EXHAUST depleted licenses, run the auto-purchase sweep, and cascade hold promotions"
    roles: [ConsortiumAdmin]
    code: 200
    input: []
    output: { expired_loans: integer, expired_holds: integer, expired_licenses: integer, exhausted_licenses: integer, expired_patrons: integer, auto_orders_created: integer, holds_promoted: integer }
    side_effects: ["all epoch transitions per §1.2 system triggers, in this order: loans, ready holds, licenses, patrons, auto-purchase sweep, promotion sweep"]
  - method: POST
    path: "/lending/_events/drive_circulation"
    description: "Test-driving endpoint (last-resort per §1.5 priority ladder): synthesizes N complete borrow-return circulation cycles for a title per (library, patron) entry at the current logical clock, writing the same loans and CirculationEvent rows the natural checkout/return chain would. Exists because allocation and rollup tests need dozens of circulations whose natural chain would require hundreds of calls."
    roles: [ConsortiumAdmin]
    code: 200
    input: [title_id, by_library]
    output: { cycles_completed: integer, events_written: integer }
    side_effects: ["for each entry {library_id, patron_id, checkouts}: repeats checkout+immediate return `checkouts` times against the title's license selected per the pinned selector; each cycle writes CHECKOUT and RETURN events attributed to entry.library_id; loans end RETURNED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not allowed on the endpoint, or entity_backed ownership check failed" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, malformed value, or unknown enum member" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "generic path id does not resolve (consortium, snapshot)" }
  - { id: ERR_LIBRARY_NOT_FOUND, http: 404, condition: "library path/body id does not resolve" }
  - { id: ERR_PATRON_NOT_FOUND, http: 404, condition: "patron path/body id does not resolve" }
  - { id: ERR_TITLE_NOT_FOUND, http: 404, condition: "title path/body id does not resolve" }
  - { id: ERR_LICENSE_NOT_FOUND, http: 404, condition: "license path id does not resolve" }
  - { id: ERR_HOLD_NOT_FOUND, http: 404, condition: "hold path id does not resolve" }
  - { id: ERR_LOAN_NOT_FOUND, http: 404, condition: "loan path id does not resolve" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "acquisition order path id does not resolve" }
  - { id: ERR_FUND_NOT_FOUND, http: 404, condition: "budget fund path/body id does not resolve" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "consortium invoice path id does not resolve" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "body-supplied FK resolves to no existing entity" }
  - { id: ERR_RESIDENCY_VIOLATION, http: 422, condition: "patron postal_code not in library.residency_region_codes at registration" }
  - { id: ERR_PATRON_NOT_ACTIVE, http: 409, condition: "patron.status != ACTIVE at checkout, hold placement, claim, or renew" }
  - { id: ERR_CARD_EXPIRED, http: 422, condition: "card_expires_at <= now at checkout, claim, or reinstate" }
  - { id: ERR_LOAN_LIMIT_EXCEEDED, http: 409, condition: "patron.active_loan_count >= library.max_concurrent_loans at checkout or claim" }
  - { id: ERR_HOLD_LIMIT_EXCEEDED, http: 409, condition: "patron.active_hold_count >= library.max_concurrent_holds at hold placement" }
  - { id: ERR_DUPLICATE_HOLD, http: 409, condition: "patron already has a hold in PLACED/READY/SUSPENDED on the title" }
  - { id: ERR_DUPLICATE_LOAN, http: 409, condition: "patron already has an ACTIVE loan on the title" }
  - { id: ERR_CHECKOUT_BLOCKED_BY_HOLDS, http: 409, condition: "direct (non-claim, non-skip-the-line) checkout while any hold in PLACED/READY/SUSPENDED exists on the title" }
  - { id: ERR_NO_LICENSE_AVAILABLE, http: 409, condition: "license selector found no ACTIVE license with capacity visible to the patron's library" }
  - { id: ERR_LICENSE_BALANCE_DEPLETED, http: 422, condition: "COST_PER_CIRC license selected but balance_cents < discounted per-circ charge" }
  - { id: ERR_LICENSE_IN_USE, http: 409, condition: "retire attempted while ACTIVE loans exist on the license" }
  - { id: ERR_SKIP_THE_LINE_DISABLED, http: 409, condition: "skip_the_line checkout on a title with skip_the_line_enabled == false" }
  - { id: ERR_SIMULTANEOUS_USE_NOT_ALLOWED, http: 409, condition: "SIMULTANEOUS_USE order on a title with simultaneous_use_allowed == false" }
  - { id: ERR_LOAN_NOT_ACTIVE, http: 409, condition: "return/renew attempted on a loan not in ACTIVE status" }
  - { id: ERR_RENEWAL_LIMIT_REACHED, http: 409, condition: "renewals_used >= max_renewals, or renew attempted on a skip-the-line loan" }
  - { id: ERR_RENEWAL_BLOCKED_BY_HOLDS, http: 409, condition: "renew attempted while any hold in PLACED/READY/SUSPENDED exists on the title" }
  - { id: ERR_RENEWAL_BEYOND_LICENSE_TERM, http: 422, condition: "renewed due_at would exceed a METERED_TIME or SIMULTANEOUS_USE license's expires_at" }
  - { id: ERR_HOLD_NOT_ACTIONABLE, http: 409, condition: "hold transition attempted from a state where it is not defined (incl. claim after ready_until)" }
  - { id: ERR_ORDER_INVALID_STATE, http: 409, condition: "order transition attempted from a state where it is not defined" }
  - { id: ERR_ORDER_OUTSIDE_FISCAL_PERIOD, http: 422, condition: "approval clock time outside the fund's [period_start, period_end)" }
  - { id: ERR_FUND_CLOSED, http: 409, condition: "operation requires an OPEN fund" }
  - { id: ERR_FUND_HAS_OPEN_COMMITMENTS, http: 409, condition: "fund close attempted while APPROVED orders remain" }
  - { id: ERR_FUND_PERIOD_OVERLAP, http: 409, condition: "new fund period intersects a sibling fund's half-open period (adjacency allowed)" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "order estimated_cost_cents > fund.available_committed_cents at approval" }
  - { id: ERR_INVOICE_INVALID_STATE, http: 409, condition: "invoice transition attempted from a state where it is not defined" }
  - { id: ERR_STALE_FUND_VERSION, http: 412, condition: "expected_budget_fund_version != current BudgetFund.version at order creation" }
  - { id: ERR_STALE_LIBRARY_VERSION, http: 412, condition: "expected_library_version != current Library.version at policy update" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ConsortiumAdmin
    description: "Consortium operator: owns catalog, consortium settings, invoicing, clock and epoch"
    identity: opaque
    exclusive_operations:
      - "POST /lending/consortiums"
      - "POST /lending/consortiums/{id}/libraries"
      - "POST /lending/consortiums/{id}/titles"
      - "POST /lending/consortiums/{id}/invoices/generate"
      - "POST /lending/consortium-invoices/{id}/issue"
      - "POST /lending/consortium-invoices/{id}/settle"
      - "POST /lending/_clock/set_current_utc"
      - "POST /lending/_ops/run_epoch"
    shared_operations:
      - "read consortiums, libraries, titles, licenses, orders, invoices, events"
  - name: LibraryAdmin
    description: "Staff of one member library: patrons, funds, orders, license retirement, library policy"
    identity: "entity_backed:Library"
    exclusive_operations:
      - "POST /lending/libraries/{id}/patrons"
      - "POST /lending/patrons/{id}/suspend and reinstate (own library's patrons)"
      - "POST /lending/libraries/{id}/budget-funds; POST /lending/budget-funds/{id}/close"
      - "PATCH /lending/libraries/{id} (own library)"
      - "acquisition-order lifecycle (propose/approve/reject/revise/cancel/fulfill, own library)"
      - "POST /lending/licenses/{id}/retire (own library's licenses)"
      - "POST /lending/consortium-invoices/{id}/dispute (billed member)"
    shared_operations:
      - "read libraries, patrons, titles, availability, licenses, loans, holds, funds, orders, invoices, events, snapshots"
  - name: Patron
    description: "Cardholder: borrows, returns, renews, places and manages own holds"
    identity: "entity_backed:Patron"
    exclusive_operations:
      - "POST /lending/loans (self checkout)"
      - "POST /lending/loans/{id}/return and renew (own loans)"
      - "POST /lending/holds (self placement)"
      - "POST /lending/holds/{id}/suspend, resume, cancel, claim (own holds)"
    shared_operations:
      - "read own patron record, own loans, own holds, titles, title availability"
  - name: SystemAnalyst
    description: "Read-only reporting role across the consortium"
    identity: opaque
    exclusive_operations:
      - "POST /lending/libraries/{id}/usage-snapshots (shared with LibraryAdmin)"
    shared_operations:
      - "all GET endpoints except patron self-service views"



