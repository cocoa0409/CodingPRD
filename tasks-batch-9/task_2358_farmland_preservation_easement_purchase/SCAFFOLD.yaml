# =============================================================================
# SCAFFOLD — task_2358_farmland_preservation_easement_purchase
# §1.0 Response envelope · §1.1 Entities · §1.2 State machines · §1.2.1
# Concurrency · §1.3 Calculations · §1.4 Validations · §1.5 Endpoints ·
# §1.6 Errors · §1.7 RBAC
# =============================================================================
scenario: "2358. Farmland Preservation Easement Purchase (agricultural land preservation program): application ranking by soil quality, parcel size, contiguity to preserved land and development pressure, appraisal of the easement value as the difference between unrestricted and restricted value, landowner negotiation, bargain sale and installment purchase structures, title work, mortgage subordination and survey requirements before closing, easement terms on impervious coverage, subdivision, residential rights and permitted agricultural uses, funding assembly across state, federal and local sources with matching requirements, annual monitoring visits, violation resolution and easement amendment policy"

domain_name: farmland-preservation-easement-purchase
api_prefix: ""            # flat top-level resource paths (no shared prefix segment)

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # Application is a 3-way junction (FundingRound × Parcel × Landowner);
  # FundingCommitment is a junction (Application × FundingSource);
  # Violation is a junction (Easement × MonitoringVisit). Easement reaches
  # Parcel by two independent paths (directly and via Application), so the
  # reference graph is a DAG with diamonds rather than a tree.

  state_machine_shape: cyclic
  # Application cycles OFFER_ISSUED -> COUNTERED -> OFFER_ISSUED (bounded
  # negotiation rounds) AND carries a second independent dimension
  # (closing_status) derived from its ClosingRequirement children. Easement
  # carries three independent dimensions (status × stewardship_status ×
  # compliance_status). Appraisal cycles SUBMITTED -> REJECTED -> SUBMITTED.
  # Amendment cycles UNDER_REVIEW -> SUSPENDED -> UNDER_REVIEW.

  relationship_patterns:
    - one_to_many          # PreservationProgram -> FundingRound / FundingSource
    - many_to_many         # FundingCommitment junctions Application × FundingSource
    - cross_aggregate      # Amendment (stewardship aggregate) reads Easement + Violation
    - polymorphic          # ClosingRequirement.requirement_type drives per-type field + rule sets

  role_model: segregation_of_duties
  # Two hard SoD gates keyed on X-User-ID: the AppraisalReviewer who certifies
  # an Appraisal may not be the AcquisitionOfficer who engaged it nor the
  # Appraiser who submitted it; the ProgramAdmin who reviews a
  # ClosingRequirement may not be the user who submitted it. Layered on top of
  # peer ownership (Landowner acts only on its own Parcels/Applications).

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities · 60 endpoints · 37 error codes · 10 calculations (4 with
  # divergent variants) · 9 state machines · 3 OCC rules · 6 roles.

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  # === configuration root ====================================================
  - name: PreservationProgram
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: program title
        constraints: "1..200 chars"
      - name: soil_weight
        type: number
        source: input
        description: composite-score weight applied to Parcel.soil_quality_score
        constraints: "0 <= w <= 1, exactly 2 decimals"
      - name: size_weight
        type: number
        source: input
        description: composite-score weight applied to the parcel size sub-score
        constraints: "0 <= w <= 1, exactly 2 decimals"
      - name: contiguity_weight
        type: number
        source: input
        description: composite-score weight applied to the contiguity sub-score
        constraints: "0 <= w <= 1, exactly 2 decimals"
      - name: pressure_weight
        type: number
        source: input
        description: composite-score weight applied to Parcel.development_pressure_score
        constraints: "0 <= w <= 1, exactly 2 decimals; soil+size+contiguity+pressure MUST equal exactly 1.00"
      - name: min_composite_score
        type: number
        source: input
        default: 60.00
        description: inclusive ranking cut-off; composite_score >= this value is RANKED
        constraints: "0.00 <= v <= 100.00"
      - name: max_negotiation_rounds
        type: integer
        source: input
        default: 3
        description: maximum number of program OFFER rounds allowed per Application
        constraints: "1 <= v <= 10"
      - name: local_match_min_pct
        type: number
        source: input
        default: 0.25
        description: minimum LOCAL-level share of total_program_cost_cents required on a funding plan
        constraints: "0 <= v <= 1"
      - name: federal_max_share_pct
        type: number
        source: input
        default: 0.50
        description: maximum FEDERAL-level share of total_program_cost_cents allowed on a funding plan
        constraints: "0 <= v <= 1"
      - name: impervious_allowance_pct
        type: number
        source: input
        default: 0.02
        description: fraction of protected acreage that may be covered by impervious surface
        constraints: "0 <= v <= 0.25"
      - name: amendment_policy
        type: enum
        source: input
        default: STRICT
        description: gate for Amendment submission against Easement.compliance_status
        constraints: "STRICT | CONDITIONAL — STRICT requires compliance_status == COMPLIANT; CONDITIONAL also accepts VIOLATION_CURED"
      - name: monitoring_interval_days
        type: integer
        source: input
        default: 365
        description: days from the last monitoring anchor to the next monitoring due date
        constraints: "30 <= v <= 1095"
      - name: monitoring_grace_days
        type: integer
        source: input
        default: 30
        description: days after next_monitoring_due_on before an Easement becomes MONITORING_DELINQUENT
        constraints: "0 <= v <= 365"
      - name: appraisal_engagement_buffer_days
        type: integer
        source: input
        default: 3
        description: symmetric buffer padded onto both ends of an Appraisal engagement interval for conflict detection
        constraints: "0 <= v <= 30"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: program lifecycle
        constraints: "ACTIVE | CLOSED"
      - name: total_preserved_acres
        type: number
        source: computed
        default: 0
        description: "cross-entity rollup: SUM(Easement.protected_acres) over Easements whose status IN {RECORDED, AMENDED} reached through this program's FundingRounds"
        constraints: "2 decimals, round_half_up"

  # === funding round =========================================================
  - name: FundingRound
    parent: PreservationProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> PreservationProgram.id; the program whose weights and thresholds this round applies"
      - name: round_label
        type: string
        source: input
        description: human label for the round
        constraints: "1..80 chars"
      - name: opens_on
        type: datetime
        source: input
        description: inclusive lower bound of the application intake window (ISO 8601 UTC)
      - name: closes_on
        type: datetime
        source: input
        description: inclusive upper bound of the application intake window (ISO 8601 UTC)
        constraints: "closes_on > opens_on"
      - name: pool_cents
        type: integer
        source: input
        description: advertised acquisition pool for the round, in cents
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: round lifecycle
        constraints: "DRAFT | OPEN | SELECTED | CLOSED"
      - name: score_basis
        type: enum
        source: system
        description: "which application_composite_score variant this round was ranked under; null until ranked"
        constraints: "null | RECEIPT_BASIS | ROUND_CLOSE_BASIS"
      - name: ranked_at
        type: datetime
        source: system
        description: logical-clock instant at which POST /funding-rounds/{id}/rank succeeded; null before
      - name: application_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(Application WHERE funding_round_id == this.id) over all statuses"
      - name: selected_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(Application WHERE funding_round_id == this.id AND status NOT IN {RECEIVED, NOT_SELECTED, WITHDRAWN})"

  # === landowner ============================================================
  - name: Landowner
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: landowner legal name of record
        constraints: "1..160 chars"
      - name: mailing_state
        type: string
        source: input
        description: two-letter USPS state code for notices
        constraints: "exactly 2 uppercase letters"
      - name: tax_id_last4
        type: string
        source: input
        description: last four digits of the taxpayer identifier, used on bargain-sale substantiation
        constraints: "exactly 4 digits"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: landowner standing
        constraints: "ACTIVE | SUSPENDED"

  # === parcel ===============================================================
  - name: Parcel
    parent: Landowner
    common_fields: true
    fields:
      - name: landowner_id
        type: string
        source: input
        description: "FK -> Landowner.id; owner of record; the acting Landowner role MUST match this on landowner-scoped writes"
      - name: county
        type: string
        source: input
        description: county of record
        constraints: "1..80 chars"
      - name: acres
        type: number
        source: input
        description: deeded acreage
        constraints: "> 0, 2 decimals"
      - name: prime_soil_acres
        type: number
        source: input
        description: acres mapped as prime farmland soil
        constraints: ">= 0, 2 decimals, prime_soil_acres + statewide_important_soil_acres <= acres"
      - name: statewide_important_soil_acres
        type: number
        source: input
        description: acres mapped as soil of statewide importance
        constraints: ">= 0, 2 decimals"
      - name: contiguous_preserved_acres
        type: number
        source: input
        description: acres of already-preserved land sharing a boundary with this parcel
        constraints: ">= 0, 2 decimals"
      - name: road_frontage_feet
        type: integer
        source: input
        description: linear feet of public road frontage (development-pressure input)
        constraints: ">= 0"
      - name: sewer_available
        type: boolean
        source: input
        description: whether public sewer is available at the parcel boundary (development-pressure input)
      - name: zoning_min_lot_acres
        type: number
        source: input
        description: minimum lot size under current zoning (development-pressure input)
        constraints: "> 0, 2 decimals"
      - name: baseline_dwelling_rights
        type: integer
        source: input
        description: count of residential building rights existing on the parcel before any easement
        constraints: ">= 0"
      - name: unrestricted_value_cents
        type: integer
        source: input
        description: assessor proxy for fee-simple unrestricted value, in cents
        constraints: "> 0"
      - name: restricted_value_cents
        type: integer
        source: input
        description: assessor proxy for agriculture-restricted value, in cents
        constraints: ">= 0, < unrestricted_value_cents"
      - name: mortgage_lienholder_name
        type: string
        source: input
        description: "name of the lienholder whose mortgage must be subordinated; null when the parcel is unencumbered"
        default: null
      - name: status
        type: enum
        source: system
        default: ELIGIBLE
        description: parcel availability for a new application
        constraints: "ELIGIBLE | UNDER_APPLICATION | ENCUMBERED | WITHDRAWN"
      - name: soil_quality_score
        type: number
        source: computed
        description: output of calculations.parcel_soil_quality_score
        constraints: "0.00..100.00, 2 decimals"
      - name: development_pressure_score
        type: number
        source: computed
        description: output of calculations.parcel_development_pressure_score
        constraints: "0.00..100.00, 2 decimals"

  # === application (3-way junction; two parallel state dimensions) ===========
  - name: Application
    parent: FundingRound
    common_fields: true
    fields:
      - name: funding_round_id
        type: string
        source: input
        description: "FK -> FundingRound.id; the round this application competes in"
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id; the parcel offered for easement purchase"
      - name: landowner_id
        type: string
        source: input
        description: "FK -> Landowner.id; MUST equal Parcel.landowner_id of parcel_id"
      - name: requested_price_cents
        type: integer
        source: input
        description: price the landowner asks for the easement, in cents
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        default: RECEIVED
        description: "acquisition dimension of the application (independent of closing_status)"
        constraints: "RECEIVED | RANKED | NOT_SELECTED | OFFER_ISSUED | COUNTERED | ACCEPTED | CLOSED_RECORDED | WITHDRAWN | LAPSED"
      - name: closing_status
        type: enum
        source: system
        default: NOT_APPLICABLE
        description: "pre-closing dimension of the application, derived from its ClosingRequirement children; evolves independently of status once status == ACCEPTED"
        constraints: "NOT_APPLICABLE | PENDING_REQUIREMENTS | BLOCKED | CLEARED | CLOSED | CANCELLED"
      - name: funding_plan_status
        type: enum
        source: system
        default: UNFUNDED
        description: "funding-assembly dimension, derived from this application's FundingCommitment children"
        constraints: "UNFUNDED | FUNDED | UNDERFUNDED | OBLIGATED | DISBURSED | RELEASED"
      - name: contiguity_acres_at_receipt
        type: number
        source: system
        description: snapshot of Parcel.contiguous_preserved_acres taken at application creation; the RECEIPT_BASIS score variant reads this instead of the parcel's live value
        constraints: ">= 0, 2 decimals"
      - name: composite_score
        type: number
        source: computed
        description: output of calculations.application_composite_score; null until the round is ranked
        constraints: "0.00..100.00, 2 decimals"
      - name: rank_position
        type: integer
        source: computed
        description: "1-based rank inside the round among applications whose composite_score >= program.min_composite_score, ordered composite_score DESC then created_at ASC; null when NOT_SELECTED or unranked"
      - name: preliminary_easement_value_cents
        type: integer
        source: computed
        description: output of calculations.easement_value variant preliminary_assessor_basis, stamped at application creation
        constraints: ">= 0"
      - name: certified_easement_value_cents
        type: integer
        source: computed
        description: output of calculations.easement_value variant certified_appraisal_basis, stamped when this application's Appraisal reaches CERTIFIED; null before
      - name: structure
        type: enum
        source: input
        description: "purchase structure chosen on the offer; null before the first offer"
        constraints: "null | FULL_PURCHASE | BARGAIN_SALE | INSTALLMENT"
      - name: donation_pct
        type: number
        source: input
        default: 0
        description: bargain-sale donation fraction of certified easement value
        constraints: "0 <= v < 1, at most 4 decimals; MUST be 0 when structure != BARGAIN_SALE"
      - name: installment_years
        type: integer
        source: input
        description: "number of annual installments; null unless structure == INSTALLMENT"
        constraints: "null | 2 <= v <= 10"
      - name: negotiation_round_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(NegotiationRound WHERE application_id == this.id AND kind == OFFER)"
      - name: proposed_price_cents
        type: integer
        source: system
        description: amount of the most recent NegotiationRound of kind OFFER or COUNTER, ordered created_at ASC then round_index ASC (last wins); null before the first offer
      - name: current_offer_cents
        type: integer
        source: system
        description: amount of the most recent NegotiationRound of kind OFFER; null before the first offer
      - name: current_offer_expires_on
        type: datetime
        source: system
        description: expiry instant of the most recent OFFER; null before the first offer
      - name: last_counter_cents
        type: integer
        source: system
        description: amount of the most recent NegotiationRound of kind COUNTER; null before the first counter
      - name: agreed_price_cents
        type: integer
        source: system
        description: price locked at acceptance; null before ACCEPTED
      - name: donation_cents
        type: integer
        source: computed
        default: 0
        description: output of calculations.bargain_sale_and_admin_fee
      - name: bargain_sale_price_cents
        type: integer
        source: computed
        description: output of calculations.bargain_sale_and_admin_fee
      - name: admin_fee_cents
        type: integer
        source: computed
        description: output of calculations.bargain_sale_and_admin_fee
      - name: total_program_cost_cents
        type: integer
        source: computed
        description: output of calculations.bargain_sale_and_admin_fee; the amount the funding waterfall must fully cover
      - name: funded_cost_cents
        type: integer
        source: system
        description: snapshot of total_program_cost_cents taken when the funding plan was assembled; acceptance requires funded_cost_cents == total_program_cost_cents
      - name: first_installment_cents
        type: integer
        source: computed
        description: output of calculations.installment_schedule_split; null unless structure == INSTALLMENT
      - name: final_installment_cents
        type: integer
        source: computed
        description: output of calculations.installment_schedule_split; null unless structure == INSTALLMENT
      - name: installment_interest_total_cents
        type: integer
        source: computed
        description: output of calculations.installment_schedule_split; null unless structure == INSTALLMENT
      - name: offer_issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the AcquisitionOfficer who issued the most recent OFFER; null before the first offer
      - name: withdrawal_reason
        type: string
        source: system
        description: reason recorded on withdrawal; null otherwise
      - name: requirement_total
        type: integer
        source: computed
        default: 0
        description: "COUNT(ClosingRequirement WHERE application_id == this.id)"
      - name: requirement_satisfied_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(ClosingRequirement WHERE application_id == this.id AND status IN {SATISFIED, WAIVED})"

  # === negotiation log (append-only, immutable) ==============================
  - name: NegotiationRound
    parent: Application
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application this negotiation event belongs to"
      - name: round_index
        type: integer
        source: system
        description: "1-based OFFER round this event belongs to; a COUNTER carries the round_index of the OFFER it answers"
        constraints: ">= 1"
      - name: kind
        type: enum
        source: system
        description: negotiation event kind
        constraints: "OFFER | COUNTER | ACCEPTANCE | EXPIRATION | WITHDRAWAL"
      - name: amount_cents
        type: integer
        source: system
        description: "amount attached to the event: offer amount, counter amount, or agreed price; null on EXPIRATION and WITHDRAWAL"
      - name: offer_expires_on
        type: datetime
        source: system
        description: expiry instant; populated only on kind == OFFER
      - name: actor_role
        type: string
        source: system
        description: X-User-Role that produced this event
      - name: actor_user_id
        type: string
        source: system
        description: X-User-ID that produced this event
      - name: rationale
        type: string
        source: system
        description: free-text note carried from the counter payload; null otherwise

  # === appraisal ============================================================
  - name: Appraisal
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application whose easement value this appraisal determines"
      - name: appraiser_user_id
        type: string
        source: input
        description: opaque X-User-ID of the Appraiser permitted to submit values on this engagement
        constraints: "1..64 chars"
      - name: appraiser_firm
        type: string
        source: input
        description: appraisal firm of record
        constraints: "1..160 chars"
      - name: engagement_start
        type: datetime
        source: input
        description: inclusive start of the engagement interval (closed interval; buffered on both ends for conflict detection)
      - name: engagement_end
        type: datetime
        source: input
        description: inclusive end of the engagement interval
        constraints: "engagement_end >= engagement_start"
      - name: method
        type: enum
        source: input
        description: valuation method of record
        constraints: "PAIRED_SALES | INCOME_CAPITALIZATION"
      - name: unrestricted_value_cents
        type: integer
        source: input
        description: appraiser-reported fee-simple unrestricted value; null until submission
        constraints: "> 0 when present"
      - name: restricted_value_cents
        type: integer
        source: input
        description: appraiser-reported agriculture-restricted value; null until submission
        constraints: ">= 0 and < unrestricted_value_cents when present"
      - name: easement_value_cents
        type: integer
        source: computed
        description: output of calculations.easement_value variant certified_appraisal_basis; null until submission
      - name: basis
        type: enum
        source: system
        default: CERTIFIED_APPRAISAL_BASIS
        description: which easement_value variant this row carries
        constraints: "CERTIFIED_APPRAISAL_BASIS"
      - name: status
        type: enum
        source: system
        default: ASSIGNED
        description: appraisal lifecycle
        constraints: "ASSIGNED | SUBMITTED | CERTIFIED | REJECTED"
      - name: engaged_by_user_id
        type: string
        source: system
        description: X-User-ID of the AcquisitionOfficer who created the engagement
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the AppraisalReviewer who certified; null before CERTIFIED
      - name: review_note
        type: string
        source: system
        description: reviewer note recorded on rejection; null otherwise
      - name: submission_count
        type: integer
        source: computed
        default: 0
        description: number of times this appraisal has entered SUBMITTED (increments on every submission, including re-submission after rejection)

  # === funding sources and commitments ======================================
  - name: FundingSource
    parent: PreservationProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> PreservationProgram.id; the program this appropriation belongs to"
      - name: source_name
        type: string
        source: input
        description: appropriation name of record
        constraints: "1..160 chars"
      - name: level
        type: enum
        source: input
        description: government level, used by the match and share rules
        constraints: "FEDERAL | STATE | LOCAL"
      - name: authorized_cents
        type: integer
        source: input
        description: total appropriation authority, in cents
        constraints: "> 0"
      - name: obligation_window_start
        type: datetime
        source: input
        description: inclusive start of the window inside which a commitment may be obligated
      - name: obligation_window_end
        type: datetime
        source: input
        description: inclusive end of the obligation window
        constraints: "obligation_window_end > obligation_window_start"
      - name: max_share_pct
        type: number
        source: input
        description: allocation guide — largest fraction of a single application's total_program_cost_cents this source contributes during the waterfall sweep
        constraints: "0 < v <= 1"
      - name: requires_match
        type: boolean
        source: input
        default: false
        description: whether commitments from this source impose a non-federal match test
      - name: match_ratio
        type: number
        source: input
        default: 0
        description: non-federal dollars required per dollar committed from this source
        constraints: ">= 0; MUST be 0 when requires_match == false"
      - name: fully_obligated_threshold_pct
        type: number
        source: input
        default: 0.95
        description: committed_cents / authorized_cents at or above which the source auto-flips to FULLY_OBLIGATED
        constraints: "0 < v <= 1"
      - name: priority_order
        type: integer
        source: input
        description: waterfall sweep order; lower values are swept first
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: source availability
        constraints: "ACTIVE | FULLY_OBLIGATED | EXPIRED | SUSPENDED"
      - name: committed_cents
        type: integer
        source: computed
        default: 0
        description: "SUM(FundingCommitment.amount_cents WHERE funding_source_id == this.id AND status IN {OBLIGATED, DISBURSED})"
      - name: reserved_cents
        type: integer
        source: computed
        default: 0
        description: "SUM(FundingCommitment.amount_cents WHERE funding_source_id == this.id AND status == RESERVED)"
      - name: disbursed_cents
        type: integer
        source: computed
        default: 0
        description: "SUM(FundingCommitment.amount_cents WHERE funding_source_id == this.id AND status == DISBURSED)"
      - name: available_cents
        type: integer
        source: computed
        description: "authorized_cents - committed_cents (RESERVED commitments are deliberately NOT netted out)"
      - name: suspension_reason
        type: string
        source: system
        description: reason recorded on suspension; null otherwise

  - name: FundingCommitment
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the acquisition this commitment funds"
      - name: funding_source_id
        type: string
        source: input
        description: "FK -> FundingSource.id; the appropriation the money comes from"
      - name: amount_cents
        type: integer
        source: computed
        description: this source's slice from calculations.funding_waterfall_allocation
        constraints: "> 0"
      - name: sweep_order
        type: integer
        source: system
        description: 1-based position this source occupied in the waterfall sweep that produced the commitment
      - name: absorbed_remainder_cents
        type: integer
        source: computed
        default: 0
        description: portion of amount_cents contributed by the per-source floor truncation remainder rule; 0 on every commitment except the last non-zero take
      - name: window_start
        type: datetime
        source: system
        description: copy of FundingSource.obligation_window_start at reservation, frozen for aggregate-capacity conflict detection
      - name: window_end
        type: datetime
        source: system
        description: copy of FundingSource.obligation_window_end at reservation
      - name: status
        type: enum
        source: system
        default: RESERVED
        description: commitment lifecycle
        constraints: "RESERVED | OBLIGATED | DISBURSED | LAPSED | RELEASED"
      - name: lapse_reason
        type: string
        source: system
        description: reason recorded when the commitment lapses or is released; null otherwise

  # === pre-closing requirements =============================================
  - name: ClosingRequirement
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the acquisition this requirement gates"
      - name: requirement_type
        type: enum
        source: input
        description: which pre-closing work product this row tracks
        constraints: "TITLE_COMMITMENT | MORTGAGE_SUBORDINATION | BOUNDARY_SURVEY"
      - name: status
        type: enum
        source: system
        default: OUTSTANDING
        description: requirement lifecycle
        constraints: "OUTSTANDING | SUBMITTED | SATISFIED | DEFICIENT | WAIVED"
      - name: lienholder_name
        type: string
        source: input
        description: "lienholder whose mortgage is being subordinated; required on submission when requirement_type == MORTGAGE_SUBORDINATION, MUST be null otherwise"
        default: null
      - name: exception_count
        type: integer
        source: input
        default: 0
        description: "title exceptions reported on the commitment; only read when requirement_type == TITLE_COMMITMENT"
        constraints: ">= 0"
      - name: surveyed_acres
        type: number
        source: input
        description: "acreage returned by the boundary survey; required on submission when requirement_type == BOUNDARY_SURVEY, MUST be null otherwise"
        constraints: "> 0 when present, 2 decimals"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID that last submitted this requirement; null while OUTSTANDING
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID that last reviewed this requirement; null before the first review
      - name: deficiency_note
        type: string
        source: system
        description: note recorded when a review rejects the submission; null otherwise
      - name: waiver_reason
        type: string
        source: system
        description: reason recorded on waiver; null otherwise

  # === recorded easement (three independent state dimensions) ================
  - name: Easement
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the acquisition that produced this easement"
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id; the encumbered parcel; MUST equal Application.parcel_id"
      - name: recorded_on
        type: datetime
        source: input
        description: recording instant of the deed of easement (ISO 8601 UTC)
      - name: protected_acres
        type: number
        source: input
        description: acreage encumbered, taken from the accepted BOUNDARY_SURVEY
        constraints: "> 0, 2 decimals"
      - name: impervious_allowance_sqft
        type: integer
        source: computed
        description: output of calculations.impervious_allowance_and_exceedance
      - name: impervious_used_sqft
        type: integer
        source: computed
        default: 0
        description: "SUM of approved impervious requests against this easement"
      - name: residential_rights_retained
        type: integer
        source: input
        description: residential building rights the landowner keeps under the easement
        constraints: "0 <= v <= Parcel.baseline_dwelling_rights"
      - name: residential_rights_extinguished
        type: integer
        source: computed
        description: "Parcel.baseline_dwelling_rights - residential_rights_retained; the pair is a conserved quantity"
      - name: subdivision_permitted
        type: boolean
        source: input
        default: false
        description: whether the easement permits further subdivision of the protected land
      - name: permitted_uses
        type: array
        source: input
        description: permitted agricultural uses recorded in the deed
        constraints: "non-empty array of distinct members of {CROP_PRODUCTION, LIVESTOCK, DAIRY, ORCHARD, FARM_STAND, AGRITOURISM, FORESTRY}"
      - name: status
        type: enum
        source: system
        default: RECORDED
        description: "deed dimension (independent of stewardship_status and compliance_status)"
        constraints: "RECORDED | AMENDED | TERMINATED"
      - name: stewardship_status
        type: enum
        source: system
        default: MONITORING_CURRENT
        description: "monitoring dimension, recomputed by calculations.stewardship_due_projection; evolves independently of compliance_status"
        constraints: "MONITORING_CURRENT | MONITORING_DUE | MONITORING_DELINQUENT"
      - name: compliance_status
        type: enum
        source: system
        default: COMPLIANT
        description: "violation dimension; evolves independently of stewardship_status"
        constraints: "COMPLIANT | VIOLATION_OPEN | VIOLATION_CURED | VIOLATION_ESCALATED"
      - name: stewardship_hold
        type: boolean
        source: system
        default: false
        description: true while any Violation on this easement is in status OPEN, CURE_PLAN_ACCEPTED or ESCALATED; blocks new monitoring visits and suspends amendments under review
      - name: last_monitored_on
        type: datetime
        source: system
        description: completion instant of the most recent COMPLETED MonitoringVisit; null before the first
      - name: next_monitoring_due_on
        type: datetime
        source: computed
        description: output of calculations.stewardship_due_projection
      - name: open_violation_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(Violation WHERE easement_id == this.id AND status IN {OPEN, CURE_PLAN_ACCEPTED, ESCALATED})"
      - name: pending_amendment_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(Amendment WHERE easement_id == this.id AND status == UNDER_REVIEW)"
      - name: amendment_count
        type: integer
        source: computed
        default: 0
        description: "COUNT(Amendment WHERE easement_id == this.id AND status == APPROVED)"

  # === stewardship ==========================================================
  - name: MonitoringVisit
    parent: Easement
    common_fields: true
    fields:
      - name: easement_id
        type: string
        source: input
        description: "FK -> Easement.id; the easement being monitored"
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the site-visit window (half-open interval [window_start, window_end))
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the site-visit window
        constraints: "window_end > window_start"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: visit lifecycle
        constraints: "SCHEDULED | COMPLETED | CANCELLED"
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant of completion; null unless COMPLETED
      - name: observed_impervious_sqft
        type: integer
        source: input
        description: impervious coverage measured in the field; null until completion
        constraints: ">= 0 when present"
      - name: finding
        type: enum
        source: computed
        description: output of calculations.impervious_allowance_and_exceedance; null until completion
        constraints: "null | NO_ISSUE | CONFIRMED_VIOLATION"
      - name: notes
        type: string
        source: input
        description: field notes; null when omitted
        default: null
      - name: cancellation_reason
        type: string
        source: system
        description: reason recorded on cancellation; null otherwise

  - name: Violation
    parent: Easement
    common_fields: true
    fields:
      - name: easement_id
        type: string
        source: input
        description: "FK -> Easement.id; the easement in violation"
      - name: monitoring_visit_id
        type: string
        source: input
        description: "FK -> MonitoringVisit.id; the visit that produced the finding; null when the violation was opened administratively"
        default: null
      - name: violation_type
        type: enum
        source: input
        description: nature of the breach of easement terms
        constraints: "IMPERVIOUS_EXCEEDANCE | UNAUTHORIZED_SUBDIVISION | PROHIBITED_USE | EXCESS_DWELLING"
      - name: excess_sqft
        type: integer
        source: input
        default: 0
        description: square feet of impervious coverage over the allowance; only meaningful for IMPERVIOUS_EXCEEDANCE
        constraints: ">= 0"
      - name: severity
        type: enum
        source: computed
        description: output of calculations.violation_severity_and_cure_deadline
        constraints: "MINOR | MAJOR"
      - name: opened_on
        type: datetime
        source: system
        description: logical-clock instant at which the violation was opened
      - name: cure_deadline_on
        type: datetime
        source: computed
        description: output of calculations.violation_severity_and_cure_deadline
      - name: status
        type: enum
        source: system
        default: OPEN
        description: violation resolution lifecycle
        constraints: "OPEN | CURE_PLAN_ACCEPTED | CURED | ESCALATED"
      - name: cure_plan_note
        type: string
        source: system
        description: note recorded when a cure plan is accepted; null otherwise
      - name: cured_on
        type: datetime
        source: system
        description: verification instant; null unless CURED
      - name: escalated_on
        type: datetime
        source: system
        description: instant the cure deadline was missed and the violation escalated; null unless ESCALATED

  # === amendment ============================================================
  - name: Amendment
    parent: Easement
    common_fields: true
    fields:
      - name: easement_id
        type: string
        source: input
        description: "FK -> Easement.id; the easement being amended"
      - name: amendment_type
        type: enum
        source: input
        description: category of amendment sought
        constraints: "IMPERVIOUS_INCREASE | BOUNDARY_ADJUSTMENT | RESIDENTIAL_RIGHT_RELOCATION"
      - name: requested_impervious_sqft
        type: integer
        source: input
        description: "new impervious allowance sought; required when amendment_type == IMPERVIOUS_INCREASE, MUST be null otherwise"
        constraints: "> 0 when present"
      - name: residential_rights_delta
        type: integer
        source: input
        default: 0
        description: "change to Easement.residential_rights_retained; MUST be < 0 when amendment_type == RESIDENTIAL_RIGHT_RELOCATION and exactly 0 otherwise"
      - name: net_conservation_benefit_cents
        type: integer
        source: input
        description: appraised net conservation benefit of the amendment; the amendment policy requires this to be non-negative
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: amendment lifecycle
        constraints: "DRAFT | UNDER_REVIEW | SUSPENDED | APPROVED | REJECTED | RESCINDED"
      - name: suspended_reason
        type: string
        source: system
        description: reason recorded when a violation suspends the amendment; null otherwise
      - name: decision_reason
        type: string
        source: system
        description: reason recorded on rejection; null otherwise
      - name: rescission_reason
        type: string
        source: system
        description: reason recorded on rescission; null otherwise
      - name: applied_rights_delta
        type: integer
        source: computed
        default: 0
        description: residential_rights_delta actually applied to the easement; set on approval, zeroed on rescission — the compensating pair that keeps the rights invariant
      - name: applied_impervious_sqft
        type: integer
        source: computed
        description: impervious allowance value written onto the easement at approval; null unless the amendment was approved

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  # === FundingRound: linear with an ops-run ranking checkpoint ===============
  - entity: FundingRound
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /funding-rounds/{id}/opening"
        actor: ProgramAdmin
        preconditions:
          - "round.status == DRAFT"
          - "PreservationProgram.status == ACTIVE for round.program_id"
          - "at least one FundingSource exists with program_id == round.program_id and status == ACTIVE"
        side_effects:
          - "sets FundingRound.status = OPEN"
          - "increments FundingRound.version by 1"

      - from: OPEN
        to: SELECTED
        trigger: "POST /funding-rounds/{id}/rank"
        actor: ProgramAdmin
        preconditions:
          - "round.status == OPEN"
          - "logical clock > round.closes_on"
          - "at least one Application exists with funding_round_id == round.id and status == RECEIVED"
        side_effects:
          - "for every Application with funding_round_id == round.id and status == RECEIVED: runs calculations.application_composite_score under the requested score_basis and writes Application.composite_score"
          - "partitions those applications: composite_score >= program.min_composite_score -> Application.status = RANKED; otherwise -> Application.status = NOT_SELECTED"
          - "assigns Application.rank_position over the RANKED subset ordered composite_score DESC then created_at ASC, starting at 1; leaves rank_position null on NOT_SELECTED rows"
          - "because an application became NOT_SELECTED, its Parcel.status returns UNDER_APPLICATION -> ELIGIBLE"
          - "sets FundingRound.score_basis = the requested basis, FundingRound.ranked_at = logical clock, FundingRound.status = SELECTED"
          - "recomputes FundingRound.selected_count"
          - "increments FundingRound.version by 1"
        note: "single-shot checkpoint — a second rank call is rejected because status != OPEN"

      - from: SELECTED
        to: CLOSED
        trigger: "system — POST /stewardship-sweeps when every Application in the round is in a terminal status {NOT_SELECTED, CLOSED_RECORDED, WITHDRAWN, LAPSED}"
        actor: system
        preconditions:
          - "round.status == SELECTED"
          - "COUNT(Application WHERE funding_round_id == round.id AND status NOT IN {NOT_SELECTED, CLOSED_RECORDED, WITHDRAWN, LAPSED}) == 0"
        side_effects:
          - "sets FundingRound.status = CLOSED"
          - "increments FundingRound.version by 1"

  # === Application, dimension `status`: CYCLIC negotiation ===================
  - entity: Application
    initial_state: RECEIVED
    terminal_states: [NOT_SELECTED, CLOSED_RECORDED, WITHDRAWN, LAPSED]
    parallel_dimensions:
      - "status — acquisition/negotiation dimension (this machine)"
      - "closing_status — pre-closing dimension, derived from ClosingRequirement children (machine below)"
      - "funding_plan_status — funding-assembly dimension, derived from FundingCommitment children (machine below)"
    transitions:
      - from: null
        to: RECEIVED
        trigger: "POST /applications"
        actor: Landowner
        preconditions:
          - "FundingRound.status == OPEN for funding_round_id"
          - "round.opens_on <= logical clock <= round.closes_on"
          - "Parcel.status == ELIGIBLE for parcel_id"
          - "Parcel.landowner_id == body landowner_id AND X-User-ID == body landowner_id"
          - "Landowner.status == ACTIVE"
          - "requested_price_cents <= round_half_up(preliminary_easement_value_cents * 1.10)"
        side_effects:
          - "stamps Application.contiguity_acres_at_receipt = Parcel.contiguous_preserved_acres"
          - "runs calculations.easement_value variant preliminary_assessor_basis and stamps Application.preliminary_easement_value_cents"
          - "sets Parcel.status = ELIGIBLE -> UNDER_APPLICATION and increments Parcel.version by 1"
          - "recomputes FundingRound.application_count and increments FundingRound.version by 1"
          - "sets Application.closing_status = NOT_APPLICABLE and funding_plan_status = UNFUNDED"

      - from: RECEIVED
        to: RANKED
        trigger: "POST /funding-rounds/{id}/rank (system, composite_score >= program.min_composite_score)"
        actor: system
        preconditions:
          - "application.status == RECEIVED"
          - "application.composite_score >= program.min_composite_score (inclusive)"
        side_effects:
          - "writes Application.composite_score and Application.rank_position"
          - "increments Application.version by 1"

      - from: RECEIVED
        to: NOT_SELECTED
        trigger: "POST /funding-rounds/{id}/rank (system, composite_score < program.min_composite_score)"
        actor: system
        preconditions:
          - "application.status == RECEIVED"
          - "application.composite_score < program.min_composite_score"
        side_effects:
          - "writes Application.composite_score, leaves rank_position null"
          - "because the application became NOT_SELECTED, Parcel.status returns UNDER_APPLICATION -> ELIGIBLE and Parcel.version increments by 1"
          - "increments Application.version by 1"

      - from: RANKED
        to: OFFER_ISSUED
        trigger: "POST /applications/{id}/offers"
        actor: AcquisitionOfficer
        preconditions:
          - "application.status IN {RANKED, COUNTERED}"
          - "expected_application_version == application.version"
          - "an Appraisal exists for this application with status == CERTIFIED"
          - "application.negotiation_round_count < program.max_negotiation_rounds"
          - "offer_cents <= application.certified_easement_value_cents"
          - "donation_pct == 0 unless structure == BARGAIN_SALE"
          - "installment_years is null unless structure == INSTALLMENT"
          - "offer_expires_on > logical clock"
        side_effects:
          - "appends NegotiationRound(kind=OFFER, round_index = negotiation_round_count + 1, amount_cents = offer_cents, offer_expires_on)"
          - "recomputes Application.negotiation_round_count from the NegotiationRound log"
          - "sets Application.structure, donation_pct, installment_years, current_offer_cents, current_offer_expires_on, proposed_price_cents = offer_cents, offer_issued_by_user_id = X-User-ID"
          - "runs calculations.bargain_sale_and_admin_fee and rewrites donation_cents, bargain_sale_price_cents, admin_fee_cents, total_program_cost_cents"
          - "runs calculations.installment_schedule_split when structure == INSTALLMENT and rewrites first_installment_cents, final_installment_cents, installment_interest_total_cents; otherwise nulls all three"
          - "increments Application.version by 1"

      - from: COUNTERED
        to: OFFER_ISSUED
        trigger: "POST /applications/{id}/offers"
        actor: AcquisitionOfficer
        preconditions:
          - "application.status == COUNTERED"
          - "expected_application_version == application.version"
          - "application.negotiation_round_count < program.max_negotiation_rounds"
          - "offer_cents <= application.certified_easement_value_cents"
        side_effects:
          - "identical side-effect set to RANKED -> OFFER_ISSUED (a new OFFER round is appended and every derived cost field is rewritten from the new offer amount)"
        note: "the negotiation cycle: COUNTERED -> OFFER_ISSUED -> COUNTERED may repeat until negotiation_round_count reaches program.max_negotiation_rounds"

      - from: OFFER_ISSUED
        to: COUNTERED
        trigger: "POST /applications/{id}/counters"
        actor: Landowner
        preconditions:
          - "application.status == OFFER_ISSUED"
          - "X-User-ID == application.landowner_id"
          - "logical clock <= application.current_offer_expires_on"
          - "counter_cents > application.current_offer_cents"
          - "counter_cents <= application.certified_easement_value_cents"
        side_effects:
          - "appends NegotiationRound(kind=COUNTER, round_index = current OFFER round_index, amount_cents = counter_cents, rationale)"
          - "sets Application.last_counter_cents = counter_cents and proposed_price_cents = counter_cents"
          - "runs calculations.bargain_sale_and_admin_fee against the counter amount and rewrites donation_cents, bargain_sale_price_cents, admin_fee_cents, total_program_cost_cents"
          - "because total_program_cost_cents changed while funded_cost_cents did not, the funding plan becomes stale and Application.funding_plan_status FUNDED -> UNDERFUNDED (no change when funding_plan_status == UNFUNDED)"
          - "increments Application.version by 1"

      - from: OFFER_ISSUED
        to: ACCEPTED
        trigger: "POST /applications/{id}/acceptance"
        actor: Landowner
        preconditions:
          - "application.status == OFFER_ISSUED"
          - "X-User-ID == application.landowner_id"
          - "logical clock <= application.current_offer_expires_on"
          - "application.funding_plan_status == FUNDED"
          - "application.funded_cost_cents == application.total_program_cost_cents"
          - "application.current_offer_cents <= application.certified_easement_value_cents"
        side_effects:
          - "appends NegotiationRound(kind=ACCEPTANCE, amount_cents = current_offer_cents)"
          - "sets Application.agreed_price_cents = current_offer_cents and Application.status = ACCEPTED"
          - "because the application became ACCEPTED, every FundingCommitment for it with status == RESERVED flips RESERVED -> OBLIGATED (see FundingCommitment machine) and Application.funding_plan_status becomes OBLIGATED"
          - "because commitments were obligated, each parent FundingSource.committed_cents / reserved_cents / available_cents are recomputed and FundingSource.version increments by 1"
          - "because a FundingSource's committed_cents reached fully_obligated_threshold_pct * authorized_cents, that source flips ACTIVE -> FULLY_OBLIGATED (see FundingSource machine)"
          - "because a source became FULLY_OBLIGATED, its remaining RESERVED commitments on OTHER applications flip RESERVED -> LAPSED with lapse_reason = 'SOURCE_FULLY_OBLIGATED'"
          - "because those commitments lapsed, each affected other Application.funding_plan_status flips FUNDED -> UNDERFUNDED and that Application.version increments by 1"
          - "creates ClosingRequirement rows: TITLE_COMMITMENT and BOUNDARY_SURVEY always, plus MORTGAGE_SUBORDINATION when Parcel.mortgage_lienholder_name is non-null (lienholder_name copied)"
          - "sets Application.closing_status = NOT_APPLICABLE -> PENDING_REQUIREMENTS and recomputes requirement_total / requirement_satisfied_count"
          - "increments Application.version by 1"

      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /applications/{id}/acceptance"
        actor: AcquisitionOfficer
        preconditions:
          - "application.status == COUNTERED"
          - "application.funding_plan_status == FUNDED"
          - "application.funded_cost_cents == application.total_program_cost_cents"
          - "application.last_counter_cents <= application.certified_easement_value_cents"
        side_effects:
          - "appends NegotiationRound(kind=ACCEPTANCE, amount_cents = last_counter_cents)"
          - "sets Application.agreed_price_cents = last_counter_cents and Application.status = ACCEPTED"
          - "identical cascade to the OFFER_ISSUED -> ACCEPTED transition (commitment obligation chain, source threshold chain, lapse chain, closing-requirement creation)"
        note: "the branch join — ACCEPTED is reachable from two different from-states with two different actors and two different price sources"

      - from: OFFER_ISSUED
        to: LAPSED
        trigger: "system — POST /stewardship-sweeps when logical clock > application.current_offer_expires_on"
        actor: system
        preconditions:
          - "application.status == OFFER_ISSUED"
          - "logical clock > application.current_offer_expires_on"
        side_effects:
          - "appends NegotiationRound(kind=EXPIRATION, amount_cents = null)"
          - "sets Application.status = LAPSED"
          - "because the application lapsed, every FundingCommitment for it with status == RESERVED flips RESERVED -> RELEASED with lapse_reason = 'APPLICATION_LAPSED' and Application.funding_plan_status becomes RELEASED"
          - "because the application lapsed, Parcel.status returns UNDER_APPLICATION -> ELIGIBLE"
          - "increments Application.version by 1"

      - from: RECEIVED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdrawal"
        actor: Landowner
        preconditions:
          - "application.status IN {RECEIVED, RANKED, OFFER_ISSUED, COUNTERED}"
          - "X-User-ID == application.landowner_id"
        side_effects:
          - "appends NegotiationRound(kind=WITHDRAWAL, amount_cents = null)"
          - "sets Application.status = WITHDRAWN and withdrawal_reason"
          - "because the application was withdrawn, every FundingCommitment for it with status IN {RESERVED, OBLIGATED} flips to RELEASED with lapse_reason = 'APPLICATION_WITHDRAWN' and Application.funding_plan_status becomes RELEASED"
          - "because those commitments were released, each parent FundingSource.committed_cents / available_cents are recomputed and, where committed_cents falls back below fully_obligated_threshold_pct * authorized_cents, FundingSource.status FULLY_OBLIGATED -> ACTIVE"
          - "because the application was withdrawn, Parcel.status returns UNDER_APPLICATION -> ELIGIBLE"
          - "increments Application.version by 1"

      - from: RANKED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdrawal"
        actor: Landowner
        preconditions: ["application.status == RANKED", "X-User-ID == application.landowner_id"]
        side_effects: ["identical side-effect set to RECEIVED -> WITHDRAWN"]

      - from: OFFER_ISSUED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdrawal"
        actor: Landowner
        preconditions: ["application.status == OFFER_ISSUED", "X-User-ID == application.landowner_id"]
        side_effects: ["identical side-effect set to RECEIVED -> WITHDRAWN"]

      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdrawal"
        actor: Landowner
        preconditions: ["application.status == COUNTERED", "X-User-ID == application.landowner_id"]
        side_effects: ["identical side-effect set to RECEIVED -> WITHDRAWN"]

      - from: ACCEPTED
        to: CLOSED_RECORDED
        trigger: "POST /applications/{id}/closing"
        actor: ProgramAdmin
        preconditions:
          - "application.status == ACCEPTED"
          - "application.closing_status == CLEARED"
          - "recorded_on >= logical clock is NOT required; recorded_on MUST be <= logical clock"
          - "protected_acres equals the surveyed_acres of the application's accepted BOUNDARY_SURVEY requirement, or the Parcel.acres when that requirement is WAIVED"
          - "0 <= residential_rights_retained <= Parcel.baseline_dwelling_rights"
          - "permitted_uses is a non-empty array of distinct allowed members"
        side_effects:
          - "creates Easement(status=RECORDED, stewardship_status=MONITORING_CURRENT, compliance_status=COMPLIANT, impervious_used_sqft=0)"
          - "runs calculations.impervious_allowance_and_exceedance and stamps Easement.impervious_allowance_sqft"
          - "sets Easement.residential_rights_extinguished = Parcel.baseline_dwelling_rights - residential_rights_retained"
          - "runs calculations.stewardship_due_projection with anchor = recorded_on and stamps Easement.next_monitoring_due_on"
          - "sets Application.status = CLOSED_RECORDED and Application.closing_status = CLEARED -> CLOSED"
          - "because the application closed, every FundingCommitment for it with status == OBLIGATED flips OBLIGATED -> DISBURSED and Application.funding_plan_status becomes DISBURSED"
          - "because commitments were disbursed, each parent FundingSource.disbursed_cents is recomputed (committed_cents and available_cents are unchanged — DISBURSED still counts as committed) and FundingSource.version increments by 1"
          - "sets Parcel.status = UNDER_APPLICATION -> ENCUMBERED and increments Parcel.version by 1"
          - "recomputes PreservationProgram.total_preserved_acres and increments PreservationProgram.version by 1"
          - "increments Application.version by 1"

  # === Application, dimension `closing_status`: COMPOUND (f(children)) ========
  - entity: Application
    initial_state: NOT_APPLICABLE
    terminal_states: [CLOSED, CANCELLED]
    dimension: closing_status
    transitions:
      - from: NOT_APPLICABLE
        to: PENDING_REQUIREMENTS
        trigger: "system — cascade of POST /applications/{id}/acceptance"
        actor: system
        preconditions: ["application.status became ACCEPTED", "application.closing_status == NOT_APPLICABLE"]
        side_effects:
          - "creates the ClosingRequirement set and recomputes requirement_total"

      - from: PENDING_REQUIREMENTS
        to: BLOCKED
        trigger: "system — cascade of POST /closing-requirements/{id}/review with decision == REJECT"
        actor: system
        preconditions: ["application.closing_status == PENDING_REQUIREMENTS", "at least one ClosingRequirement for the application has status == DEFICIENT"]
        side_effects:
          - "sets Application.closing_status = BLOCKED"
          - "increments Application.version by 1"

      - from: BLOCKED
        to: PENDING_REQUIREMENTS
        trigger: "system — cascade of POST /closing-requirements/{id}/submission on the deficient requirement"
        actor: system
        preconditions: ["application.closing_status == BLOCKED", "COUNT(ClosingRequirement WHERE application_id == this AND status == DEFICIENT) == 0"]
        side_effects:
          - "sets Application.closing_status = PENDING_REQUIREMENTS"
          - "increments Application.version by 1"

      - from: PENDING_REQUIREMENTS
        to: CLEARED
        trigger: "system — cascade of POST /closing-requirements/{id}/review (ACCEPT) or POST /closing-requirements/{id}/waiver"
        actor: system
        preconditions:
          - "application.closing_status == PENDING_REQUIREMENTS"
          - "requirement_total > 0 AND requirement_satisfied_count == requirement_total"
          - "application.funding_plan_status == OBLIGATED"
        side_effects:
          - "sets Application.closing_status = CLEARED"
          - "increments Application.version by 1"
        note: "compound/bubble-up: the parent dimension is a pure function of the children's statuses plus the funding dimension"

      - from: CLEARED
        to: PENDING_REQUIREMENTS
        trigger: "system — cascade of POST /closing-requirements/{id}/submission on an already-SATISFIED requirement being resubmitted"
        actor: system
        preconditions: ["application.closing_status == CLEARED", "requirement_satisfied_count < requirement_total"]
        side_effects:
          - "sets Application.closing_status = PENDING_REQUIREMENTS"
          - "increments Application.version by 1"

      - from: CLEARED
        to: CLOSED
        trigger: "POST /applications/{id}/closing"
        actor: ProgramAdmin
        preconditions: ["application.closing_status == CLEARED", "application.status == ACCEPTED"]
        side_effects: ["sets Application.closing_status = CLOSED (see the status-dimension transition for the full cascade)"]

      - from: PENDING_REQUIREMENTS
        to: CANCELLED
        trigger: "POST /applications/{id}/closing-cancellation"
        actor: ProgramAdmin
        preconditions:
          - "application.closing_status IN {PENDING_REQUIREMENTS, BLOCKED, CLEARED}"
          - "application.status == ACCEPTED"
        side_effects:
          - "sets Application.closing_status = CANCELLED"
          - "because closing was cancelled, every FundingCommitment for the application with status IN {RESERVED, OBLIGATED} flips to RELEASED with lapse_reason = 'CLOSING_CANCELLED' and Application.funding_plan_status becomes RELEASED"
          - "because those commitments were released, each parent FundingSource.committed_cents / reserved_cents / available_cents are recomputed and FundingSource.version increments by 1"
          - "because a source's committed_cents fell back below fully_obligated_threshold_pct * authorized_cents, that source flips FULLY_OBLIGATED -> ACTIVE"
          - "sets every ClosingRequirement for the application whose status IN {OUTSTANDING, SUBMITTED, DEFICIENT} to WAIVED with waiver_reason = 'CLOSING_CANCELLED'"
          - "sets Application.status = ACCEPTED -> WITHDRAWN with withdrawal_reason = 'CLOSING_CANCELLED'"
          - "because the application became WITHDRAWN, Parcel.status returns UNDER_APPLICATION -> ELIGIBLE"
          - "increments Application.version by 1"

      - from: BLOCKED
        to: CANCELLED
        trigger: "POST /applications/{id}/closing-cancellation"
        actor: ProgramAdmin
        preconditions: ["application.closing_status == BLOCKED", "application.status == ACCEPTED"]
        side_effects: ["identical side-effect set to PENDING_REQUIREMENTS -> CANCELLED"]

      - from: CLEARED
        to: CANCELLED
        trigger: "POST /applications/{id}/closing-cancellation"
        actor: ProgramAdmin
        preconditions: ["application.closing_status == CLEARED", "application.status == ACCEPTED"]
        side_effects: ["identical side-effect set to PENDING_REQUIREMENTS -> CANCELLED"]

  # === Application, dimension `funding_plan_status` ==========================
  - entity: Application
    initial_state: UNFUNDED
    terminal_states: [DISBURSED, RELEASED]
    dimension: funding_plan_status
    transitions:
      - from: UNFUNDED
        to: FUNDED
        trigger: "POST /applications/{id}/funding-plan"
        actor: ProgramAdmin
        preconditions:
          - "application.status IN {RANKED, OFFER_ISSUED, COUNTERED}"
          - "expected_application_version == application.version"
          - "application.total_program_cost_cents is non-null (an offer has been issued)"
          - "calculations.funding_waterfall_allocation fully covers total_program_cost_cents"
          - "the federal-share, local-match and match-ratio tests all pass"
        side_effects:
          - "creates one FundingCommitment(status=RESERVED) per non-zero take, with sweep_order and absorbed_remainder_cents"
          - "sets Application.funded_cost_cents = total_program_cost_cents and funding_plan_status = FUNDED"
          - "recomputes each touched FundingSource.reserved_cents and increments FundingSource.version by 1"
          - "increments Application.version by 1"

      - from: FUNDED
        to: FUNDED
        trigger: "POST /applications/{id}/funding-plan (supersede)"
        actor: ProgramAdmin
        preconditions:
          - "application.funding_plan_status IN {FUNDED, UNDERFUNDED}"
          - "expected_application_version == application.version"
        side_effects:
          - "flips every existing FundingCommitment for the application with status == RESERVED to RELEASED with lapse_reason = 'PLAN_SUPERSEDED' before the new sweep runs"
          - "creates the replacement RESERVED commitment set"
          - "rewrites Application.funded_cost_cents and sets funding_plan_status = FUNDED"
          - "increments Application.version by 1"
        note: "the legitimate supersede that makes OCC on Application.version necessary (§1.2.1 rule funding-plan-supersede-stale-application)"

      - from: FUNDED
        to: UNDERFUNDED
        trigger: "system — cascade of a FundingSource reaching FULLY_OBLIGATED, or of POST /applications/{id}/counters changing total_program_cost_cents"
        actor: system
        preconditions: ["application.funding_plan_status == FUNDED", "SUM(FundingCommitment.amount_cents WHERE status == RESERVED) != application.total_program_cost_cents"]
        side_effects:
          - "sets Application.funding_plan_status = UNDERFUNDED"
          - "increments Application.version by 1"

      - from: UNDERFUNDED
        to: FUNDED
        trigger: "POST /applications/{id}/funding-plan"
        actor: ProgramAdmin
        preconditions: ["application.funding_plan_status == UNDERFUNDED", "expected_application_version == application.version"]
        side_effects: ["identical side-effect set to FUNDED -> FUNDED (supersede)"]

      - from: FUNDED
        to: OBLIGATED
        trigger: "system — cascade of POST /applications/{id}/acceptance"
        actor: system
        preconditions: ["application.status became ACCEPTED", "application.funding_plan_status == FUNDED"]
        side_effects: ["flips every RESERVED commitment to OBLIGATED", "sets funding_plan_status = OBLIGATED"]

      - from: OBLIGATED
        to: DISBURSED
        trigger: "system — cascade of POST /applications/{id}/closing"
        actor: system
        preconditions: ["application.funding_plan_status == OBLIGATED"]
        side_effects: ["flips every OBLIGATED commitment to DISBURSED", "sets funding_plan_status = DISBURSED"]

      - from: OBLIGATED
        to: RELEASED
        trigger: "system — cascade of POST /applications/{id}/closing-cancellation or POST /applications/{id}/withdrawal"
        actor: system
        preconditions: ["application.funding_plan_status IN {FUNDED, UNDERFUNDED, OBLIGATED}"]
        side_effects: ["flips every RESERVED or OBLIGATED commitment to RELEASED", "sets funding_plan_status = RELEASED"]

  # === Appraisal: branching with a revision cycle ============================
  - entity: Appraisal
    initial_state: ASSIGNED
    terminal_states: [CERTIFIED]
    transitions:
      - from: null
        to: ASSIGNED
        trigger: "POST /applications/{id}/appraisals"
        actor: AcquisitionOfficer
        preconditions:
          - "application.status IN {RECEIVED, RANKED, OFFER_ISSUED, COUNTERED}"
          - "engagement_end >= engagement_start"
          - "no other Appraisal on the SAME application with status IN {ASSIGNED, SUBMITTED, CERTIFIED} has an engagement interval that conflicts under the buffered closed-interval rule (§1.4 priority 19)"
        side_effects:
          - "stamps Appraisal.engaged_by_user_id = X-User-ID, basis = CERTIFIED_APPRAISAL_BASIS, submission_count = 0"

      - from: ASSIGNED
        to: SUBMITTED
        trigger: "POST /appraisals/{id}/submission"
        actor: Appraiser
        preconditions:
          - "appraisal.status IN {ASSIGNED, REJECTED}"
          - "X-User-ID == appraisal.appraiser_user_id"
          - "restricted_value_cents < unrestricted_value_cents"
        side_effects:
          - "runs calculations.easement_value variant certified_appraisal_basis and writes Appraisal.easement_value_cents"
          - "increments Appraisal.submission_count by 1"
          - "increments Appraisal.version by 1"

      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /appraisals/{id}/submission"
        actor: Appraiser
        preconditions:
          - "appraisal.status == REJECTED"
          - "X-User-ID == appraisal.appraiser_user_id"
        side_effects:
          - "identical side-effect set to ASSIGNED -> SUBMITTED, and clears review_note"
        note: "the revision cycle SUBMITTED -> REJECTED -> SUBMITTED may repeat without bound"

      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /appraisals/{id}/review with decision == CERTIFY"
        actor: AppraisalReviewer
        preconditions:
          - "appraisal.status == SUBMITTED"
          - "X-User-ID != appraisal.engaged_by_user_id AND X-User-ID != appraisal.appraiser_user_id (segregation of duties)"
        side_effects:
          - "sets Appraisal.status = CERTIFIED and certified_by_user_id = X-User-ID"
          - "because the appraisal was certified, Application.certified_easement_value_cents = Appraisal.easement_value_cents and Application.version increments by 1"
          - "increments Appraisal.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /appraisals/{id}/review with decision == REJECT"
        actor: AppraisalReviewer
        preconditions:
          - "appraisal.status == SUBMITTED"
          - "X-User-ID != appraisal.engaged_by_user_id AND X-User-ID != appraisal.appraiser_user_id"
          - "review_note is present"
        side_effects:
          - "sets Appraisal.status = REJECTED and review_note"
          - "clears Appraisal.easement_value_cents to null"
          - "increments Appraisal.version by 1"

  # === ClosingRequirement: linear with revert =================================
  - entity: ClosingRequirement
    initial_state: OUTSTANDING
    terminal_states: [WAIVED]
    transitions:
      - from: OUTSTANDING
        to: SUBMITTED
        trigger: "POST /closing-requirements/{id}/submission"
        actor: AcquisitionOfficer
        preconditions:
          - "requirement.status IN {OUTSTANDING, DEFICIENT, SATISFIED}"
          - "application.closing_status IN {PENDING_REQUIREMENTS, BLOCKED, CLEARED}"
          - "requirement_type == MORTGAGE_SUBORDINATION => lienholder_name is present; otherwise lienholder_name MUST be absent"
          - "requirement_type == BOUNDARY_SURVEY => surveyed_acres is present and |surveyed_acres - Parcel.acres| <= 0.50; otherwise surveyed_acres MUST be absent"
        side_effects:
          - "sets ClosingRequirement.status = SUBMITTED and submitted_by_user_id = X-User-ID"
          - "clears deficiency_note"
          - "because the requirement left DEFICIENT, Application.closing_status may bubble BLOCKED -> PENDING_REQUIREMENTS"
          - "because the requirement left SATISFIED, Application.requirement_satisfied_count decreases and closing_status may bubble CLEARED -> PENDING_REQUIREMENTS"
          - "increments ClosingRequirement.version by 1"

      - from: DEFICIENT
        to: SUBMITTED
        trigger: "POST /closing-requirements/{id}/submission"
        actor: AcquisitionOfficer
        preconditions: ["requirement.status == DEFICIENT"]
        side_effects: ["identical side-effect set to OUTSTANDING -> SUBMITTED"]

      - from: SATISFIED
        to: SUBMITTED
        trigger: "POST /closing-requirements/{id}/submission"
        actor: AcquisitionOfficer
        preconditions: ["requirement.status == SATISFIED", "application.closing_status != CLOSED"]
        side_effects: ["identical side-effect set to OUTSTANDING -> SUBMITTED"]

      - from: SUBMITTED
        to: SATISFIED
        trigger: "POST /closing-requirements/{id}/review with decision == ACCEPT"
        actor: ProgramAdmin
        preconditions:
          - "requirement.status == SUBMITTED"
          - "X-User-ID != requirement.submitted_by_user_id (segregation of duties)"
          - "requirement_type == TITLE_COMMITMENT => exception_count == 0"
        side_effects:
          - "sets ClosingRequirement.status = SATISFIED and reviewed_by_user_id = X-User-ID"
          - "recomputes Application.requirement_satisfied_count"
          - "because requirement_satisfied_count reached requirement_total and funding_plan_status == OBLIGATED, Application.closing_status bubbles PENDING_REQUIREMENTS -> CLEARED"
          - "increments ClosingRequirement.version by 1"

      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /closing-requirements/{id}/review with decision == REJECT"
        actor: ProgramAdmin
        preconditions:
          - "requirement.status == SUBMITTED"
          - "X-User-ID != requirement.submitted_by_user_id"
          - "deficiency_note is present"
        side_effects:
          - "sets ClosingRequirement.status = DEFICIENT, deficiency_note, reviewed_by_user_id = X-User-ID"
          - "because a requirement became DEFICIENT, Application.closing_status bubbles PENDING_REQUIREMENTS -> BLOCKED"
          - "increments ClosingRequirement.version by 1"

      - from: OUTSTANDING
        to: WAIVED
        trigger: "POST /closing-requirements/{id}/waiver"
        actor: ProgramAdmin
        preconditions:
          - "requirement.status IN {OUTSTANDING, DEFICIENT}"
          - "requirement.requirement_type == BOUNDARY_SURVEY"
          - "waiver_reason is present"
        side_effects:
          - "sets ClosingRequirement.status = WAIVED and waiver_reason"
          - "recomputes Application.requirement_satisfied_count"
          - "because requirement_satisfied_count reached requirement_total and funding_plan_status == OBLIGATED, Application.closing_status bubbles PENDING_REQUIREMENTS -> CLEARED"
          - "increments ClosingRequirement.version by 1"
        note: "only BOUNDARY_SURVEY is waivable — title work and mortgage subordination are never waived"

      - from: DEFICIENT
        to: WAIVED
        trigger: "POST /closing-requirements/{id}/waiver"
        actor: ProgramAdmin
        preconditions: ["requirement.status == DEFICIENT", "requirement.requirement_type == BOUNDARY_SURVEY"]
        side_effects: ["identical side-effect set to OUTSTANDING -> WAIVED, and Application.closing_status may bubble BLOCKED -> PENDING_REQUIREMENTS -> CLEARED"]

  # === FundingSource ========================================================
  - entity: FundingSource
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: FULLY_OBLIGATED
        trigger: "system — cascade of any commitment reaching OBLIGATED"
        actor: system
        preconditions:
          - "source.status == ACTIVE"
          - "committed_cents >= floor(authorized_cents * fully_obligated_threshold_pct)"
        side_effects:
          - "sets FundingSource.status = FULLY_OBLIGATED"
          - "because the source became FULLY_OBLIGATED, every FundingCommitment against it with status == RESERVED flips RESERVED -> LAPSED with lapse_reason = 'SOURCE_FULLY_OBLIGATED'"
          - "increments FundingSource.version by 1"

      - from: FULLY_OBLIGATED
        to: ACTIVE
        trigger: "system — cascade of any commitment reaching RELEASED"
        actor: system
        preconditions:
          - "source.status == FULLY_OBLIGATED"
          - "committed_cents < floor(authorized_cents * fully_obligated_threshold_pct)"
        side_effects:
          - "sets FundingSource.status = ACTIVE"
          - "increments FundingSource.version by 1"
        note: "already-LAPSED commitments are NOT revived — lapse is deliberately irreversible"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /funding-sources/{id}/suspension"
        actor: ProgramAdmin
        preconditions: ["source.status IN {ACTIVE, FULLY_OBLIGATED}", "reason is present"]
        side_effects:
          - "sets FundingSource.status = SUSPENDED and suspension_reason"
          - "because the source was suspended, every FundingCommitment against it with status == RESERVED flips RESERVED -> LAPSED with lapse_reason = 'SOURCE_SUSPENDED'"
          - "because those commitments lapsed, each affected Application.funding_plan_status flips FUNDED -> UNDERFUNDED"
          - "increments FundingSource.version by 1"

      - from: FULLY_OBLIGATED
        to: SUSPENDED
        trigger: "POST /funding-sources/{id}/suspension"
        actor: ProgramAdmin
        preconditions: ["source.status == FULLY_OBLIGATED"]
        side_effects: ["identical side-effect set to ACTIVE -> SUSPENDED"]

      - from: ACTIVE
        to: EXPIRED
        trigger: "system — POST /stewardship-sweeps when logical clock > obligation_window_end"
        actor: system
        preconditions: ["source.status IN {ACTIVE, FULLY_OBLIGATED}", "logical clock > source.obligation_window_end"]
        side_effects:
          - "sets FundingSource.status = EXPIRED"
          - "because the source expired, every FundingCommitment against it with status == RESERVED flips RESERVED -> LAPSED with lapse_reason = 'SOURCE_EXPIRED'"
          - "because those commitments lapsed, each affected Application.funding_plan_status flips FUNDED -> UNDERFUNDED"
          - "increments FundingSource.version by 1"

  # === FundingCommitment ====================================================
  - entity: FundingCommitment
    initial_state: RESERVED
    terminal_states: [DISBURSED, LAPSED, RELEASED]
    transitions:
      - from: null
        to: RESERVED
        trigger: "POST /applications/{id}/funding-plan"
        actor: ProgramAdmin
        preconditions:
          - "the source was selected by calculations.funding_waterfall_allocation with a non-zero take"
        side_effects:
          - "freezes window_start / window_end from the source's obligation window"
          - "recomputes FundingSource.reserved_cents"

      - from: RESERVED
        to: OBLIGATED
        trigger: "system — cascade of POST /applications/{id}/acceptance"
        actor: system
        preconditions: ["commitment.status == RESERVED", "application.status became ACCEPTED", "source.status IN {ACTIVE, FULLY_OBLIGATED}"]
        side_effects:
          - "recomputes FundingSource.committed_cents / reserved_cents / available_cents"
          - "increments FundingCommitment.version by 1"

      - from: OBLIGATED
        to: DISBURSED
        trigger: "system — cascade of POST /applications/{id}/closing"
        actor: system
        preconditions: ["commitment.status == OBLIGATED"]
        side_effects:
          - "recomputes FundingSource.disbursed_cents; committed_cents and available_cents are unchanged"
          - "increments FundingCommitment.version by 1"

      - from: RESERVED
        to: LAPSED
        trigger: "system — cascade of the parent FundingSource reaching FULLY_OBLIGATED, SUSPENDED or EXPIRED"
        actor: system
        preconditions: ["commitment.status == RESERVED"]
        side_effects:
          - "sets lapse_reason"
          - "recomputes FundingSource.reserved_cents"
          - "because the commitment lapsed, Application.funding_plan_status flips FUNDED -> UNDERFUNDED"
          - "increments FundingCommitment.version by 1"

      - from: RESERVED
        to: RELEASED
        trigger: "system — cascade of POST /applications/{id}/withdrawal, POST /applications/{id}/closing-cancellation, POST /applications/{id}/funding-plan (supersede), or offer lapse via POST /stewardship-sweeps"
        actor: system
        preconditions: ["commitment.status == RESERVED"]
        side_effects:
          - "sets lapse_reason"
          - "recomputes FundingSource.reserved_cents"
          - "increments FundingCommitment.version by 1"

      - from: OBLIGATED
        to: RELEASED
        trigger: "system — cascade of POST /applications/{id}/withdrawal or POST /applications/{id}/closing-cancellation"
        actor: system
        preconditions: ["commitment.status == OBLIGATED"]
        side_effects:
          - "sets lapse_reason"
          - "recomputes FundingSource.committed_cents / available_cents so that authorized_cents == available_cents + committed_cents still holds exactly"
          - "because committed_cents fell below the obligation threshold, the source may flip FULLY_OBLIGATED -> ACTIVE"
          - "increments FundingCommitment.version by 1"
        note: "the compensating half of the funding-conservation invariant"

  # === Easement: THREE independent state dimensions ==========================
  - entity: Easement
    initial_state: RECORDED
    terminal_states: [TERMINATED]
    parallel_dimensions:
      - "status — deed dimension: RECORDED | AMENDED | TERMINATED"
      - "stewardship_status — monitoring dimension: MONITORING_CURRENT | MONITORING_DUE | MONITORING_DELINQUENT"
      - "compliance_status — violation dimension: COMPLIANT | VIOLATION_OPEN | VIOLATION_CURED | VIOLATION_ESCALATED"
    transitions:
      - from: null
        to: RECORDED
        trigger: "POST /applications/{id}/closing"
        actor: ProgramAdmin
        preconditions: ["application.closing_status == CLEARED"]
        side_effects: ["see the Application status-dimension CLOSED_RECORDED transition for the full side-effect set"]

      - from: RECORDED
        to: AMENDED
        trigger: "system — cascade of POST /amendments/{id}/decision with decision == APPROVE"
        actor: system
        preconditions: ["easement.status IN {RECORDED, AMENDED}", "amendment.status == UNDER_REVIEW"]
        side_effects:
          - "sets Easement.status = AMENDED and recomputes amendment_count"
          - "when amendment_type == IMPERVIOUS_INCREASE: sets impervious_allowance_sqft = amendment.requested_impervious_sqft and Amendment.applied_impervious_sqft to the same value"
          - "when amendment_type == RESIDENTIAL_RIGHT_RELOCATION: residential_rights_retained += residential_rights_delta and residential_rights_extinguished -= residential_rights_delta, keeping retained + extinguished == Parcel.baseline_dwelling_rights; sets Amendment.applied_rights_delta = residential_rights_delta"
          - "increments Easement.version by 1"

      - from: AMENDED
        to: RECORDED
        trigger: "system — cascade of POST /amendments/{id}/rescission when no other APPROVED Amendment remains on the easement"
        actor: system
        preconditions: ["easement.status == AMENDED", "amendment.status == APPROVED"]
        side_effects:
          - "when amendment.applied_impervious_sqft is non-null: restores impervious_allowance_sqft by re-running calculations.impervious_allowance_and_exceedance from protected_acres"
          - "when amendment.applied_rights_delta != 0: residential_rights_retained -= applied_rights_delta and residential_rights_extinguished += applied_rights_delta, restoring the exact pre-approval pair"
          - "sets Amendment.applied_rights_delta = 0 and applied_impervious_sqft = null"
          - "recomputes amendment_count; sets Easement.status = RECORDED when amendment_count == 0"
          - "increments Easement.version by 1"
        note: "the compensating half of the residential-rights conservation invariant"

      # --- stewardship dimension ---
      - from: MONITORING_CURRENT
        to: MONITORING_DUE
        trigger: "system — POST /stewardship-sweeps"
        actor: system
        preconditions: ["easement.status IN {RECORDED, AMENDED}", "next_monitoring_due_on <= logical clock < next_monitoring_due_on + program.monitoring_grace_days days"]
        side_effects: ["sets Easement.stewardship_status = MONITORING_DUE", "increments Easement.version by 1"]
        note: "independent of compliance_status — a COMPLIANT easement and a VIOLATION_OPEN easement both traverse this edge on the same sweep"

      - from: MONITORING_DUE
        to: MONITORING_DELINQUENT
        trigger: "system — POST /stewardship-sweeps"
        actor: system
        preconditions: ["logical clock >= next_monitoring_due_on + program.monitoring_grace_days days"]
        side_effects: ["sets Easement.stewardship_status = MONITORING_DELINQUENT", "increments Easement.version by 1"]

      - from: MONITORING_DELINQUENT
        to: MONITORING_CURRENT
        trigger: "system — cascade of POST /monitoring-visits/{id}/completion"
        actor: system
        preconditions: ["visit.status == SCHEDULED", "visit.easement_id == easement.id"]
        side_effects:
          - "sets Easement.last_monitored_on = logical clock"
          - "re-runs calculations.stewardship_due_projection with anchor = last_monitored_on, rewriting next_monitoring_due_on and setting stewardship_status = MONITORING_CURRENT"
          - "increments Easement.version by 1"
        note: "completion resets ONLY the stewardship dimension; compliance_status is decided independently by the visit's finding"

      - from: MONITORING_DUE
        to: MONITORING_CURRENT
        trigger: "system — cascade of POST /monitoring-visits/{id}/completion"
        actor: system
        preconditions: ["visit.status == SCHEDULED"]
        side_effects: ["identical side-effect set to MONITORING_DELINQUENT -> MONITORING_CURRENT"]

      # --- compliance dimension ---
      - from: COMPLIANT
        to: VIOLATION_OPEN
        trigger: "system — cascade of a Violation being created (POST /violations or the CONFIRMED_VIOLATION branch of POST /monitoring-visits/{id}/completion)"
        actor: system
        preconditions: ["easement.status IN {RECORDED, AMENDED}", "a Violation on this easement reached status OPEN"]
        side_effects:
          - "sets Easement.compliance_status = VIOLATION_OPEN, stewardship_hold = true, and recomputes open_violation_count"
          - "because stewardship_hold became true, every Amendment on the easement with status == UNDER_REVIEW flips UNDER_REVIEW -> SUSPENDED with suspended_reason = 'VIOLATION_OPEN'"
          - "because those amendments were suspended, Easement.pending_amendment_count is recomputed downward"
          - "increments Easement.version by 1"

      - from: VIOLATION_OPEN
        to: VIOLATION_CURED
        trigger: "system — cascade of POST /violations/{id}/cure-verification"
        actor: system
        preconditions: ["easement.compliance_status IN {VIOLATION_OPEN, VIOLATION_ESCALATED}", "open_violation_count reaches 0 after the cure"]
        side_effects:
          - "sets Easement.compliance_status = VIOLATION_CURED and stewardship_hold = false"
          - "recomputes open_violation_count"
          - "increments Easement.version by 1"

      - from: VIOLATION_CURED
        to: COMPLIANT
        trigger: "system — POST /stewardship-sweeps once logical clock >= the latest Violation.cured_on + 90 days with no new violation opened"
        actor: system
        preconditions: ["easement.compliance_status == VIOLATION_CURED", "open_violation_count == 0", "logical clock >= MAX(Violation.cured_on for this easement) + 90 days"]
        side_effects: ["sets Easement.compliance_status = COMPLIANT", "increments Easement.version by 1"]
        note: "closes the compliance cycle COMPLIANT -> VIOLATION_OPEN -> VIOLATION_CURED -> COMPLIANT"

      - from: VIOLATION_OPEN
        to: VIOLATION_ESCALATED
        trigger: "system — cascade of a Violation reaching ESCALATED on POST /stewardship-sweeps"
        actor: system
        preconditions: ["easement.compliance_status == VIOLATION_OPEN", "a Violation on this easement reached ESCALATED"]
        side_effects:
          - "sets Easement.compliance_status = VIOLATION_ESCALATED (stewardship_hold stays true)"
          - "increments Easement.version by 1"

      - from: RECORDED
        to: TERMINATED
        trigger: "system — cascade of POST /stewardship-sweeps when a Violation has been ESCALATED for more than 730 days"
        actor: system
        preconditions: ["easement.compliance_status == VIOLATION_ESCALATED", "logical clock >= MIN(Violation.escalated_on for ESCALATED violations) + 730 days"]
        side_effects:
          - "sets Easement.status = TERMINATED"
          - "because the easement terminated, Parcel.status returns ENCUMBERED -> ELIGIBLE and Parcel.version increments by 1"
          - "recomputes PreservationProgram.total_preserved_acres"
          - "increments Easement.version by 1"

  # === MonitoringVisit ======================================================
  - entity: MonitoringVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /monitoring-visits"
        actor: StewardshipMonitor
        preconditions:
          - "Easement.status IN {RECORDED, AMENDED}"
          - "Easement.stewardship_hold == false"
          - "window_end > window_start"
          - "no other MonitoringVisit on the SAME easement with status == SCHEDULED half-open-overlaps [window_start, window_end) (§1.4 priority 20)"
        side_effects:
          - "sets MonitoringVisit.status = SCHEDULED"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /monitoring-visits/{id}/completion"
        actor: StewardshipMonitor
        preconditions:
          - "visit.status == SCHEDULED"
          - "logical clock >= visit.window_start"
          - "observed_impervious_sqft >= 0"
        side_effects:
          - "sets MonitoringVisit.status = COMPLETED, completed_at = logical clock"
          - "runs calculations.impervious_allowance_and_exceedance and writes MonitoringVisit.finding"
          - "because the visit completed, Easement.last_monitored_on = completed_at, next_monitoring_due_on is re-projected, and stewardship_status becomes MONITORING_CURRENT"
          - "when finding == CONFIRMED_VIOLATION: creates Violation(easement_id, monitoring_visit_id = this visit, violation_type = IMPERVIOUS_EXCEEDANCE, excess_sqft = observed_impervious_sqft - Easement.impervious_allowance_sqft, status = OPEN) and runs calculations.violation_severity_and_cure_deadline"
          - "because a Violation reached OPEN, Easement.compliance_status flips COMPLIANT -> VIOLATION_OPEN and stewardship_hold becomes true"
          - "because stewardship_hold became true, UNDER_REVIEW Amendments on the easement flip to SUSPENDED and Easement.pending_amendment_count is recomputed downward"
          - "increments MonitoringVisit.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /monitoring-visits/{id}/cancellation"
        actor: StewardshipMonitor
        preconditions: ["visit.status == SCHEDULED", "reason is present"]
        side_effects:
          - "sets MonitoringVisit.status = CANCELLED and cancellation_reason"
          - "vacates the visit's window — a CANCELLED visit no longer participates in the half-open overlap test"
          - "increments MonitoringVisit.version by 1"

  # === Violation ============================================================
  - entity: Violation
    initial_state: OPEN
    terminal_states: [CURED]
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /violations, or the CONFIRMED_VIOLATION branch of POST /monitoring-visits/{id}/completion"
        actor: StewardshipMonitor
        preconditions:
          - "Easement.status IN {RECORDED, AMENDED}"
          - "when monitoring_visit_id is supplied, that visit's easement_id MUST equal the body easement_id"
          - "violation_type == IMPERVIOUS_EXCEEDANCE => excess_sqft > 0"
        side_effects:
          - "runs calculations.violation_severity_and_cure_deadline and writes severity, opened_on, cure_deadline_on"
          - "because a Violation reached OPEN, Easement.compliance_status flips COMPLIANT -> VIOLATION_OPEN, stewardship_hold = true, open_violation_count recomputed"
          - "because stewardship_hold became true, UNDER_REVIEW Amendments flip to SUSPENDED and Easement.pending_amendment_count is recomputed downward"

      - from: OPEN
        to: CURE_PLAN_ACCEPTED
        trigger: "POST /violations/{id}/cure-plan"
        actor: StewardshipMonitor
        preconditions:
          - "violation.status == OPEN"
          - "cure_plan_note is present"
          - "logical clock <= violation.cure_deadline_on"
        side_effects:
          - "sets Violation.status = CURE_PLAN_ACCEPTED and cure_plan_note"
          - "increments Violation.version by 1"

      - from: CURE_PLAN_ACCEPTED
        to: CURED
        trigger: "POST /violations/{id}/cure-verification"
        actor: StewardshipMonitor
        preconditions:
          - "violation.status IN {CURE_PLAN_ACCEPTED, ESCALATED}"
          - "logical clock <= violation.cure_deadline_on when status == CURE_PLAN_ACCEPTED"
        side_effects:
          - "sets Violation.status = CURED and cured_on = logical clock"
          - "when violation_type == IMPERVIOUS_EXCEEDANCE: resets Easement.impervious_used_sqft to min(impervious_used_sqft, impervious_allowance_sqft)"
          - "because open_violation_count fell to 0, Easement.compliance_status flips to VIOLATION_CURED and stewardship_hold becomes false"
          - "increments Violation.version by 1"

      - from: ESCALATED
        to: CURED
        trigger: "POST /violations/{id}/cure-verification"
        actor: StewardshipMonitor
        preconditions: ["violation.status == ESCALATED"]
        side_effects: ["identical side-effect set to CURE_PLAN_ACCEPTED -> CURED"]
        note: "the resolution cycle — an escalated violation can still be remediated"

      - from: OPEN
        to: ESCALATED
        trigger: "system — POST /stewardship-sweeps when logical clock > violation.cure_deadline_on"
        actor: system
        preconditions: ["violation.status IN {OPEN, CURE_PLAN_ACCEPTED}", "logical clock > violation.cure_deadline_on"]
        side_effects:
          - "sets Violation.status = ESCALATED and escalated_on = logical clock"
          - "because the violation escalated, Easement.compliance_status flips VIOLATION_OPEN -> VIOLATION_ESCALATED"
          - "increments Violation.version by 1"

      - from: CURE_PLAN_ACCEPTED
        to: ESCALATED
        trigger: "system — POST /stewardship-sweeps when logical clock > violation.cure_deadline_on"
        actor: system
        preconditions: ["violation.status == CURE_PLAN_ACCEPTED", "logical clock > violation.cure_deadline_on"]
        side_effects: ["identical side-effect set to OPEN -> ESCALATED"]

  # === Amendment: branching with a suspension cycle ==========================
  - entity: Amendment
    initial_state: DRAFT
    terminal_states: [REJECTED, RESCINDED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /easements/{id}/amendments"
        actor: ProgramAdmin
        preconditions:
          - "Easement.status IN {RECORDED, AMENDED}"
          - "expected_easement_version == easement.version"
          - "net_conservation_benefit_cents >= 0"
          - "amendment_type == IMPERVIOUS_INCREASE => requested_impervious_sqft is present and > easement.impervious_allowance_sqft; otherwise requested_impervious_sqft MUST be absent"
          - "amendment_type == RESIDENTIAL_RIGHT_RELOCATION => residential_rights_delta < 0 and easement.residential_rights_retained + residential_rights_delta >= 0; otherwise residential_rights_delta MUST be 0 or absent"
        side_effects:
          - "flips every existing Amendment on the easement with status == DRAFT to RESCINDED with rescission_reason = 'SUPERSEDED_BY_NEWER_DRAFT'"
          - "creates the new Amendment in DRAFT"
          - "increments Easement.version by 1"

      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /amendments/{id}/submission"
        actor: ProgramAdmin
        preconditions:
          - "amendment.status == DRAFT"
          - "program.amendment_policy == STRICT => easement.compliance_status == COMPLIANT"
          - "program.amendment_policy == CONDITIONAL => easement.compliance_status IN {COMPLIANT, VIOLATION_CURED}"
          - "easement.stewardship_hold == false"
        side_effects:
          - "sets Amendment.status = UNDER_REVIEW"
          - "recomputes Easement.pending_amendment_count and increments Easement.version by 1"
          - "increments Amendment.version by 1"

      - from: UNDER_REVIEW
        to: SUSPENDED
        trigger: "system — cascade of a Violation reaching OPEN on the amendment's easement"
        actor: system
        preconditions: ["amendment.status == UNDER_REVIEW", "easement.stewardship_hold became true"]
        side_effects:
          - "sets Amendment.status = SUSPENDED and suspended_reason = 'VIOLATION_OPEN'"
          - "because the amendment was suspended, Easement.pending_amendment_count is recomputed downward"
          - "increments Amendment.version by 1"

      - from: SUSPENDED
        to: UNDER_REVIEW
        trigger: "POST /amendments/{id}/reinstatement"
        actor: ProgramAdmin
        preconditions:
          - "amendment.status == SUSPENDED"
          - "easement.stewardship_hold == false"
          - "program.amendment_policy == CONDITIONAL (a STRICT program requires compliance_status == COMPLIANT, which VIOLATION_CURED is not)"
          - "program.amendment_policy == STRICT => easement.compliance_status == COMPLIANT"
        side_effects:
          - "sets Amendment.status = UNDER_REVIEW and clears suspended_reason"
          - "recomputes Easement.pending_amendment_count upward"
          - "increments Amendment.version by 1"
        note: "the suspension cycle UNDER_REVIEW -> SUSPENDED -> UNDER_REVIEW"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /amendments/{id}/decision with decision == APPROVE"
        actor: ProgramAdmin
        preconditions:
          - "amendment.status == UNDER_REVIEW"
          - "easement.stewardship_hold == false"
          - "net_conservation_benefit_cents > 0"
        side_effects:
          - "sets Amendment.status = APPROVED"
          - "because the amendment was approved, Easement.status flips to AMENDED and the type-specific field rewrite runs (impervious allowance, or the residential-rights transfer that preserves retained + extinguished)"
          - "recomputes Easement.pending_amendment_count and amendment_count"
          - "increments Amendment.version by 1"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /amendments/{id}/decision with decision == REJECT"
        actor: ProgramAdmin
        preconditions: ["amendment.status == UNDER_REVIEW", "reason is present"]
        side_effects:
          - "sets Amendment.status = REJECTED and decision_reason"
          - "recomputes Easement.pending_amendment_count and increments Easement.version by 1"
          - "increments Amendment.version by 1"

      - from: APPROVED
        to: RESCINDED
        trigger: "POST /amendments/{id}/rescission"
        actor: ProgramAdmin
        preconditions: ["amendment.status == APPROVED", "reason is present"]
        side_effects:
          - "sets Amendment.status = RESCINDED and rescission_reason"
          - "because the amendment was rescinded, the easement's type-specific field rewrite is reversed exactly (impervious allowance re-derived from protected_acres; residential_rights_retained/extinguished restored), keeping retained + extinguished == Parcel.baseline_dwelling_rights"
          - "sets Amendment.applied_rights_delta = 0 and applied_impervious_sqft = null"
          - "recomputes Easement.amendment_count; Easement.status returns AMENDED -> RECORDED when amendment_count == 0"
          - "increments Amendment.version by 1"

      - from: DRAFT
        to: RESCINDED
        trigger: "system — cascade of POST /easements/{id}/amendments creating a newer DRAFT on the same easement"
        actor: system
        preconditions: ["amendment.status == DRAFT"]
        side_effects:
          - "sets Amendment.status = RESCINDED and rescission_reason = 'SUPERSEDED_BY_NEWER_DRAFT'"
          - "increments Amendment.version by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` — only mechanism)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: offer-issue-stale-application
    parent_entity: Application
    write_endpoint: "POST /applications/{id}/offers"
    occ_field: "expected_application_version"
    description: |
      Issuing an offer against an Application whose version has advanced since
      the client last read it is rejected with a stale-version error. A new
      OFFER legitimately supersedes the outstanding one (it rewrites structure,
      donation_pct and every derived cost field), so the operation is valid from
      the same observed state — nothing in §1.2 forbids a second offer from
      RANKED or COUNTERED. OCC on Application.version is therefore the only way
      to reject a writer whose view predates an intervening offer, counter,
      certification or funding-plan assembly.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

  - rule_id: funding-plan-supersede-stale-application
    parent_entity: Application
    write_endpoint: "POST /applications/{id}/funding-plan"
    occ_field: "expected_application_version"
    description: |
      Assembling a funding plan against an Application whose version has
      advanced since the client last read it is rejected with a stale-version
      error. A funding plan legitimately supersedes the prior one (releasing its
      RESERVED commitments and re-running the waterfall), so a repeat call from
      the same observed state is a valid product operation; only the stale view
      of Application.version distinguishes the writer whose total_program_cost
      basis has since been rewritten by an offer or a counter.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

  - rule_id: amendment-draft-stale-easement
    parent_entity: Easement
    write_endpoint: "POST /easements/{id}/amendments"
    occ_field: "expected_easement_version"
    description: |
      Creating an Amendment draft against an Easement whose version has advanced
      since the client last read it is rejected with a stale-version error. A new
      DRAFT legitimately supersedes any prior DRAFT on the same easement
      (rescinding it), so the call is valid from the same observed state; OCC on
      Easement.version is what rejects a drafter whose view predates an
      intervening approval, rescission, monitoring completion or violation.
    error_id: ERR_STALE_EASEMENT_VERSION
    http_status: 412

  - rule_id: parcel-attribute-stale-parcel
    parent_entity: Parcel
    write_endpoint: "PATCH /parcels/{id}"
    occ_field: "expected_parcel_version"
    description: |
      Updating a Parcel's contiguity, valuation or development-pressure attributes when the
      Parcel's version has advanced since the client last read it is rejected with a
      stale-version error. Re-patching the same attributes is a legitimate repeat operation
      (contiguity grows every time a neighbouring easement is recorded, and appraisers revise
      unrestricted/restricted values), so the write is valid from the same observed state;
      only OCC on Parcel.version rejects an editor whose view predates an intervening patch
      or an application/closing cascade that moved Parcel.status.
    error_id: ERR_STALE_PARCEL_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules
# -----------------------------------------------------------------------------
calculations:

  - name: parcel_soil_quality_score
    algorithm_type: weighted_scoring
    formula: |
      prime_share      = parcel.prime_soil_acres / parcel.acres
      important_share  = parcel.statewide_important_soil_acres / parcel.acres
      raw              = 100 * min(1, prime_share + IMPORTANT_SOIL_WEIGHT * important_share)
      soil_quality_score = round_half_up(raw, 2)
    input_set: "the single Parcel row; acres must be > 0"
    constants:
      IMPORTANT_SOIL_WEIGHT: 0.60
    precision: "2 decimal places, ROUND_HALF_UP; the min(1, ...) clamp is applied BEFORE rounding"
    worked_example: |
      Parcel A: acres 160, prime_soil_acres 120, statewide_important_soil_acres 24
      prime_share = 0.75, important_share = 0.15
      raw = 100 * min(1, 0.75 + 0.60*0.15) = 100 * 0.84 = 84.00
      soil_quality_score = 84.00
    note: "statewide-important soils earn 60% of the credit that prime soils earn; the clamp means a parcel that is entirely prime plus important soils still scores exactly 100.00, never above"

  - name: parcel_development_pressure_score
    algorithm_type: tiered_pricing
    formula: |
      frontage_points = min(FRONTAGE_POINT_CAP, floor(parcel.road_frontage_feet / FRONTAGE_UNIT_FEET) * FRONTAGE_POINTS_PER_UNIT)
      sewer_points    = SEWER_POINTS if parcel.sewer_available else 0
      zoning_points   = 45 if parcel.zoning_min_lot_acres < 1.0
                        else 35 if parcel.zoning_min_lot_acres < 3.0
                        else 20 if parcel.zoning_min_lot_acres < 10.0
                        else 5
      development_pressure_score = round_half_up(min(100, frontage_points + sewer_points + zoning_points), 2)
    input_set: "the single Parcel row"
    constants:
      FRONTAGE_UNIT_FEET: 100
      FRONTAGE_POINTS_PER_UNIT: 3
      FRONTAGE_POINT_CAP: 30
      SEWER_POINTS: 25
      ZONING_TIER_1_MAX_ACRES: 1.0
      ZONING_TIER_1_POINTS: 45
      ZONING_TIER_2_MAX_ACRES: 3.0
      ZONING_TIER_2_POINTS: 35
      ZONING_TIER_3_MAX_ACRES: 10.0
      ZONING_TIER_3_POINTS: 20
      ZONING_TIER_4_POINTS: 5
      PRESSURE_SCORE_CAP: 100
    precision: "frontage credit FLOORS to whole 100-foot units before multiplying (this is deliberately NOT proportional); the total is capped at 100 then rounded to 2 dp ROUND_HALF_UP"
    worked_example: |
      Parcel A: road_frontage_feet 640, sewer_available true, zoning_min_lot_acres 2.0
      frontage_points = min(30, floor(640/100)*3) = min(30, 6*3) = 18
      sewer_points    = 25
      zoning_points   = 35            (1.0 <= 2.0 < 3.0)
      development_pressure_score = min(100, 18 + 25 + 35) = 78.00

      Parcel B: road_frontage_feet 150, sewer_available false, zoning_min_lot_acres 5.0
      frontage_points = min(30, floor(150/100)*3) = 3
      sewer_points    = 0
      zoning_points   = 20            (3.0 <= 5.0 < 10.0)
      development_pressure_score = 23.00
    note: "zoning tiers are LEFT-CLOSED / RIGHT-OPEN: a zoning_min_lot_acres of exactly 1.0 scores 35, not 45; exactly 3.0 scores 20; exactly 10.0 scores 5"

  - name: application_composite_score
    algorithm_type: weighted_scoring
    formula: |
      soil_component       = parcel.soil_quality_score
      size_component       = 100 * min(1, parcel.acres / SIZE_FULL_CREDIT_ACRES)
      contiguity_component = 100 * min(1, contiguity_acres / parcel.acres)
      pressure_component   = parcel.development_pressure_score
      composite_score = round_half_up(
          program.soil_weight      * soil_component
        + program.size_weight      * size_component
        + program.contiguity_weight * contiguity_component
        + program.pressure_weight  * pressure_component, 2)
    input_set: |
      Applications with status == RECEIVED whose funding_round_id == the round being
      ranked. Applications already in RANKED, NOT_SELECTED, OFFER_ISSUED, COUNTERED,
      ACCEPTED, CLOSED_RECORDED, WITHDRAWN or LAPSED are excluded from the ranking pass
      and keep their existing composite_score and rank_position.
    constants:
      SIZE_FULL_CREDIT_ACRES: 200
    precision: |
      Each component is computed at full precision; ONLY the weighted sum is rounded, once,
      to 2 decimal places ROUND_HALF_UP. Rounding each component first is the wrong variant
      and drifts. Program weights must satisfy
      soil_weight + size_weight + contiguity_weight + pressure_weight == 1.00 exactly
      (enforced at program creation by ERR_WEIGHTS_NOT_NORMALIZED).
    variants:
      - variant: receipt_basis
        applies_when: "the ranking call passes score_basis == RECEIPT_BASIS"
        contiguity_acres: "Application.contiguity_acres_at_receipt — the contiguity frozen when the application was filed"
      - variant: round_close_basis
        applies_when: "the ranking call passes score_basis == ROUND_CLOSE_BASIS"
        contiguity_acres: "the LIVE Parcel.contiguous_preserved_acres as of the ranking call — this moves whenever a neighbouring easement is recorded during the round"
    worked_example: |
      Program P1 weights: soil 0.35, size 0.15, contiguity 0.25, pressure 0.25

      Parcel A (acres 160, soil 84.00, pressure 78.00), contiguity_acres_at_receipt 80,
      live contiguous_preserved_acres later patched to 160:
        size_component = 100 * min(1, 160/200) = 80.00
        RECEIPT_BASIS: contiguity_component = 100 * min(1, 80/160)  = 50.00
          0.35*84 + 0.15*80 + 0.25*50 + 0.25*78 = 29.40 + 12.00 + 12.50 + 19.50 = 73.40
        ROUND_CLOSE_BASIS: contiguity_component = 100 * min(1, 160/160) = 100.00
          29.40 + 12.00 + 25.00 + 19.50 = 85.90
      Same stored data, two bases, delta = 12.50 points.

      Parcel B (acres 200, soil 80.00, pressure 23.00, contiguous 90):
        size 100.00, contiguity 45.00
        0.35*80 + 0.15*100 + 0.25*45 + 0.25*23 = 28.00 + 15.00 + 11.25 + 5.75 = 60.00  -> RANKED (>= 60.00)
      Parcel C (identical but contiguous 89.90):
        contiguity = 100 * (89.90/200) = 44.95
        28.00 + 15.00 + 11.2375 + 5.75 = 59.9875 -> 59.99                              -> NOT_SELECTED

  - name: easement_value
    algorithm_type: threshold
    formula: |
      preliminary_assessor_basis:
        gross = parcel.unrestricted_value_cents - parcel.restricted_value_cents
        preliminary_easement_value_cents = floor(PRELIMINARY_HAIRCUT * gross / PRELIMINARY_ROUNDING_UNIT_CENTS) * PRELIMINARY_ROUNDING_UNIT_CENTS

      certified_appraisal_basis:
        gross   = appraisal.unrestricted_value_cents - appraisal.restricted_value_cents
        ceiling = PER_ACRE_EASEMENT_VALUE_CEILING_CENTS * parcel.acres
        easement_value_cents = round_half_up(min(gross, ceiling) / CERTIFIED_ROUNDING_UNIT_CENTS) * CERTIFIED_ROUNDING_UNIT_CENTS
    input_set: "the Parcel row for the preliminary basis; the Appraisal row plus its application's Parcel.acres for the certified basis"
    constants:
      PRELIMINARY_HAIRCUT: 0.90
      PRELIMINARY_ROUNDING_UNIT_CENTS: 100000
      CERTIFIED_ROUNDING_UNIT_CENTS: 10000
      PER_ACRE_EASEMENT_VALUE_CEILING_CENTS: 1200000
    precision: |
      The two bases round in DIFFERENT directions at DIFFERENT granularities:
      preliminary FLOORS to the nearest $1,000.00 (100,000 cents) after a 10% haircut;
      certified rounds HALF-UP to the nearest $100.00 (10,000 cents) with no haircut but
      with a per-acre ceiling. Reusing either rounding rule for the other basis is wrong.
    variants:
      - variant: preliminary_assessor_basis
        applies_when: "POST /applications — stamped onto Application.preliminary_easement_value_cents and used only to bound requested_price_cents"
        note: "the assessor-proxy figure; deliberately conservative so the program is never bound by an unappraised number"
      - variant: certified_appraisal_basis
        applies_when: "POST /appraisals/{id}/submission — written to Appraisal.easement_value_cents and copied to Application.certified_easement_value_cents on certification"
        note: "the figure that caps every offer and counter"
    worked_example: |
      Parcel A: unrestricted 288,000,000, restricted 112,450,000, acres 160
        gross = 175,550,000
        preliminary = floor(0.90 * 175,550,000 / 100,000) * 100,000
                    = floor(157,995,000 / 100,000) * 100,000 = 1579 * 100,000 = 157,900,000
        ceiling     = 1,200,000 * 160 = 192,000,000  (not binding)
        certified   = round_half_up(175,550,000 / 10,000) * 10,000 = 17555 * 10,000 = 175,550,000
      Same underlying spread, two variants, delta = 17,650,000 cents.

      Parcel D: unrestricted 120,000,000, restricted 45,500,000, acres 80
        gross = 74,500,000; preliminary = floor(67,050,000/100,000)*100,000 = 67,000,000
        ceiling = 96,000,000 (not binding); certified = 74,500,000

  - name: bargain_sale_and_admin_fee
    algorithm_type: tiered_pricing
    formula: |
      # STEP ORDER IS NORMATIVE — the fee tier is chosen on the PRE-FEE bargain sale price
      donation_cents            = round_half_up(easement_value_cents * application.donation_pct)
      bargain_sale_price_cents  = easement_value_cents - donation_cents
      admin_fee_pct             = ADMIN_FEE_PCT_TIER_1 if bargain_sale_price_cents <  ADMIN_FEE_TIER_1_MAX_CENTS
                                  else ADMIN_FEE_PCT_TIER_2 if bargain_sale_price_cents <  ADMIN_FEE_TIER_2_MAX_CENTS
                                  else ADMIN_FEE_PCT_TIER_3
      admin_fee_cents           = round_half_up(bargain_sale_price_cents * admin_fee_pct)
      total_program_cost_cents  = bargain_sale_price_cents + admin_fee_cents
    input_set: |
      easement_value_cents = the offer amount for an OFFER round, or the counter amount for a
      COUNTER round; donation_pct is 0 for FULL_PURCHASE and INSTALLMENT structures and in
      (0, 1) for BARGAIN_SALE.
    constants:
      ADMIN_FEE_TIER_1_MAX_CENTS: 25000000
      ADMIN_FEE_PCT_TIER_1: 0.030
      ADMIN_FEE_TIER_2_MAX_CENTS: 75000000
      ADMIN_FEE_PCT_TIER_2: 0.020
      ADMIN_FEE_PCT_TIER_3: 0.015
    precision: |
      Two independent ROUND_HALF_UP steps to whole cents, in this order: donation first, then
      admin fee. The tier is selected on bargain_sale_price_cents (pre-fee) and NEVER on
      total_program_cost_cents — selecting on the total is the natural-looking wrong variant
      and produces a different fee whenever the total crosses a tier boundary that the
      pre-fee price does not.
    worked_example: |
      Parcel A, BARGAIN_SALE, offer 175,550,000, donation_pct 0.10
        donation = round_half_up(17,555,000.0) = 17,555,000
        bsp      = 175,550,000 - 17,555,000 = 157,995,000
        tier: 157,995,000 >= 75,000,000  -> 0.015
        fee      = round_half_up(2,369,925.0) = 2,369,925
        total    = 157,995,000 + 2,369,925 = 160,364,925

      Parcel D, FULL_PURCHASE, offer 74,500,000, donation_pct 0
        donation = 0; bsp = 74,500,000
        tier: 25,000,000 <= 74,500,000 < 75,000,000 -> 0.020
        fee      = 1,490,000; total = 75,990,000
        WRONG variant (tier chosen on the total 75,990,000 >= 75,000,000 -> 0.015)
        would give fee 1,117,500 and total 75,617,500.

  - name: funding_waterfall_allocation
    algorithm_type: waterfall_allocation
    formula: |
      target = application.total_program_cost_cents
      eligible sources = FundingSource WHERE program_id == round.program_id
                           AND status == ACTIVE
                           AND obligation_window_start <= target_closing_date <= obligation_window_end
      sweep order      = priority_order ASC, then created_at ASC
      remaining = target
      for each source in sweep order:
          cap_by_share = floor(target * source.max_share_pct)      # ROUND PER SOURCE, THEN SUM
          take         = min(remaining, cap_by_share, source.available_cents)
          if take > 0: emit FundingCommitment(amount_cents = take, sweep_order = position)
          remaining -= take
      # remainder placement
      if remaining > 0 and at least one take was non-zero:
          last = the LAST source with a non-zero take
          extra = min(remaining, last.available_cents - last.take)
          last.take += extra ; last.absorbed_remainder_cents = extra ; remaining -= extra
      if remaining > 0: raise ERR_FUNDING_SHORTFALL
      # post-conditions, each its own error
      federal_total    = sum of takes where level == FEDERAL
      local_total      = sum of takes where level == LOCAL
      nonfederal_total = target - federal_total
      federal_total <= floor(target * program.federal_max_share_pct)   else ERR_FEDERAL_SHARE_EXCEEDED
      local_total   >= ceil(target * program.local_match_min_pct)      else ERR_LOCAL_MATCH_SHORTFALL
      for each swept source with requires_match:
          nonfederal_total >= round_half_up(federal_total * source.match_ratio)  else ERR_MATCH_RATIO_UNSATISFIED
    input_set: |
      Only FundingSource rows with status == ACTIVE are swept — SUSPENDED, EXPIRED and
      FULLY_OBLIGATED sources are skipped entirely, even when available_cents > 0. A source
      whose obligation window does not contain the requested target_closing_date is also
      skipped. available_cents nets OBLIGATED and DISBURSED commitments only; RESERVED
      commitments are deliberately NOT netted, so two plans may reserve against the same
      headroom and the loser lapses when the winner is accepted.
    constants:
      REMAINDER_POLICY: LAST_NON_ZERO_TAKE
    precision: |
      cap_by_share FLOORS each source's share independently and the caps are summed
      afterwards. The wrong variant — summing the un-floored shares and flooring once —
      differs whenever more than one share has a fractional part. Because per-source
      flooring loses at most (n-1) cents, the shortfall is handed to the LAST non-zero-take
      source, bounded only by that source's available_cents; its max_share_pct is
      deliberately NOT re-checked for the absorbed remainder (only the program-level
      federal_max_share_pct still binds).
    worked_example: |
      target = 160,364,925 (Parcel A). Program P1: federal_max_share_pct 0.50,
      local_match_min_pct 0.25. Sources, sweep order by priority_order:
        1. S3 County Open Space   LOCAL   authorized  60,000,000  max_share 0.35
        2. S2 State Farmland Trust STATE  authorized 120,000,000  max_share 0.40
        3. S1 Federal ACEP-ALE    FEDERAL authorized 200,000,000  max_share 0.25  requires_match, ratio 1.0

      caps: floor(160,364,925*0.35) = 56,127,723
            floor(160,364,925*0.40) = 64,145,970
            floor(160,364,925*0.25) = 40,091,231
      sum of floored caps = 160,364,924  -> exactly 1 cent short of target

      takes: S3 min(160,364,925, 56,127,723, 60,000,000) = 56,127,723 ; remaining 104,237,202
             S2 min(104,237,202, 64,145,970, 120,000,000) = 64,145,970 ; remaining 40,091,232
             S1 min(40,091,232, 40,091,231, 200,000,000) = 40,091,231 ; remaining 1
      remainder: last non-zero take is S1 -> extra = min(1, 200,000,000 - 40,091,231) = 1
             S1 final take = 40,091,232, absorbed_remainder_cents = 1 ; remaining 0
      sum = 56,127,723 + 64,145,970 + 40,091,232 = 160,364,925 exactly

      post-conditions: federal 40,091,232 <= floor(160,364,925*0.50) = 80,182,462  PASS
                       local   56,127,723 >= ceil(160,364,925*0.25) = 40,091,232   PASS
                       nonfederal 120,273,693 >= round_half_up(40,091,232*1.0)     PASS

  - name: installment_schedule_split
    algorithm_type: aggregation
    formula: |
      n              = application.installment_years
      annual         = floor(total_program_cost_cents / n)
      first_installment_cents = annual
      final_installment_cents = total_program_cost_cents - annual * (n - 1)
      installment_interest_total_cents = round_half_up(total_program_cost_cents * INSTALLMENT_ANNUAL_RATE * (n - 1) / 2)
    input_set: "applications with structure == INSTALLMENT and 2 <= installment_years <= 10; the field triple is null for every other structure"
    constants:
      INSTALLMENT_ANNUAL_RATE: 0.0275
      INSTALLMENT_MIN_YEARS: 2
      INSTALLMENT_MAX_YEARS: 10
    precision: |
      The annual payment FLOORS to whole cents and every rounding residue lands on the FINAL
      installment, so annual*(n-1) + final == total exactly. Interest uses the average
      outstanding balance shortcut total * rate * (n-1)/2, rounded HALF_UP once at the end.
    worked_example: |
      total_program_cost_cents 160,364,925 with installment_years 6
        annual = floor(160,364,925 / 6) = floor(26,727,487.5) = 26,727,487
        first  = 26,727,487
        final  = 160,364,925 - 26,727,487*5 = 160,364,925 - 133,637,435 = 26,727,490
        check  : 26,727,487*5 + 26,727,490 = 160,364,925                     PASS
        interest = round_half_up(160,364,925 * 0.0275 * 5 / 2)
                 = round_half_up(11,025,088.59375) = 11,025,089

  - name: impervious_allowance_and_exceedance
    algorithm_type: threshold
    formula: |
      impervious_allowance_sqft = floor(easement.protected_acres * SQFT_PER_ACRE * program.impervious_allowance_pct)
      # at monitoring completion
      finding = CONFIRMED_VIOLATION if observed_impervious_sqft >  impervious_allowance_sqft
                else NO_ISSUE
      excess_sqft = max(0, observed_impervious_sqft - impervious_allowance_sqft)
    input_set: "the Easement row and its program; the allowance is re-derived from protected_acres on every rescission of an IMPERVIOUS_INCREASE amendment"
    constants:
      SQFT_PER_ACRE: 43560
    precision: |
      The allowance FLOORS to whole square feet. The exceedance test is STRICTLY GREATER
      THAN: an observation exactly equal to the allowance is compliant. Using >= is the
      off-by-one wrong variant.
    worked_example: |
      Easement E_A: protected_acres 160.00, program.impervious_allowance_pct 0.02
        allowance = floor(160.00 * 43560 * 0.02) = floor(139,392.0) = 139,392
        observed 139,392 -> NO_ISSUE, excess 0
        observed 139,393 -> CONFIRMED_VIOLATION, excess 1
        observed 142,000 -> CONFIRMED_VIOLATION, excess 2,608

  - name: violation_severity_and_cure_deadline
    algorithm_type: threshold
    formula: |
      severity        = MAJOR if excess_sqft > MAJOR_EXCESS_SQFT else MINOR
      opened_on       = the logical clock at violation creation
      cure_days       = CURE_DAYS_MAJOR if severity == MAJOR else CURE_DAYS_MINOR
      cure_deadline_on = opened_on + cure_days days
    input_set: "the Violation row at creation; excess_sqft is 0 for non-impervious violation types, which therefore always open as MINOR"
    constants:
      MAJOR_EXCESS_SQFT: 2000
      CURE_DAYS_MINOR: 180
      CURE_DAYS_MAJOR: 90
    precision: |
      The severity test is STRICTLY GREATER THAN, so an excess of exactly 2,000 sqft is MINOR
      and gets 180 days; 2,001 sqft is MAJOR and gets only 90. Deadlines are whole-day
      offsets on the logical clock, evaluated inclusively (a cure recorded exactly at
      cure_deadline_on is on time).
    worked_example: |
      excess 1 opened 2027-06-03T00:00:00Z -> MINOR, deadline 2027-11-30T00:00:00Z
      excess 2,608 opened 2027-06-03T00:00:00Z -> MAJOR, deadline 2027-09-01T00:00:00Z
      excess 2,000 -> MINOR ; excess 2,001 -> MAJOR

  - name: stewardship_due_projection
    algorithm_type: forward_looking
    formula: |
      anchor = easement.last_monitored_on if non-null else easement.recorded_on
      next_monitoring_due_on = anchor + program.monitoring_interval_days days
      stewardship_status =
          MONITORING_CURRENT     if clock <  next_monitoring_due_on
          MONITORING_DUE         if next_monitoring_due_on <= clock < next_monitoring_due_on + program.monitoring_grace_days days
          MONITORING_DELINQUENT  if clock >= next_monitoring_due_on + program.monitoring_grace_days days
    input_set: |
      Easements with status IN {RECORDED, AMENDED} only — a TERMINATED easement is never
      re-projected and keeps its last stewardship_status. Only COMPLETED MonitoringVisits
      move the anchor; SCHEDULED and CANCELLED visits never do.
    constants:
      DEFAULT_MONITORING_INTERVAL_DAYS: 365
      DEFAULT_MONITORING_GRACE_DAYS: 30
    precision: |
      Both comparisons are half-open: the due date itself is already DUE (not current), and
      the grace boundary itself is already DELINQUENT (not due). Whole-day arithmetic on the
      logical clock, no timezone conversion.
    worked_example: |
      Easement E_A recorded_on 2026-12-15T00:00:00Z, interval 365, grace 30
        next_monitoring_due_on = 2027-12-15T00:00:00Z
        clock 2027-12-14 -> MONITORING_CURRENT
        clock 2027-12-15 -> MONITORING_DUE
        clock 2028-01-13 -> MONITORING_DUE           (day 29 of grace)
        clock 2028-01-14 -> MONITORING_DELINQUENT    (day 30 of grace)
      After a visit completes at 2027-06-03T00:00:00Z the anchor moves and
        next_monitoring_due_on = 2028-06-02T00:00:00Z, stewardship_status = MONITORING_CURRENT

# -----------------------------------------------------------------------------
# §1.4 Validation Rules (evaluated in ascending priority; first violation wins)
# -----------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-ID header MUST be present on every endpoint except POST /_clock/set_current_utc"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "X-User-Role header MUST be present and MUST be one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc"

  - priority: 3
    category: authorization
    check: "the caller's X-User-Role MUST be permitted for the endpoint per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints except POST /_clock/set_current_utc"

  - priority: 4
    category: existence
    check: "every path {id} MUST resolve to an existing row of the endpoint's entity"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_ROUND_NOT_FOUND | ERR_LANDOWNER_NOT_FOUND | ERR_PARCEL_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_APPRAISAL_NOT_FOUND | ERR_SOURCE_NOT_FOUND | ERR_COMMITMENT_NOT_FOUND | ERR_REQUIREMENT_NOT_FOUND | ERR_EASEMENT_NOT_FOUND | ERR_VISIT_NOT_FOUND | ERR_VIOLATION_NOT_FOUND | ERR_AMENDMENT_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint carrying a path parameter"

  - priority: 5
    category: existence
    check: "every foreign key supplied in a request body MUST resolve to an existing row (program_id, funding_round_id, parcel_id, landowner_id, easement_id, monitoring_visit_id)"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_ROUND_NOT_FOUND | ERR_PARCEL_NOT_FOUND | ERR_LANDOWNER_NOT_FOUND | ERR_EASEMENT_NOT_FOUND | ERR_VISIT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /funding-rounds, POST /parcels, POST /applications, POST /funding-sources, POST /monitoring-visits, POST /violations"

  - priority: 6
    category: request_shape
    check: |
      Body MUST be a JSON object; every required input field present; no unknown fields;
      types, enum members, string lengths and numeric domains valid (acres > 0,
      prime_soil_acres >= 0, prime_soil_acres + statewide_important_soil_acres <= acres,
      cents fields >= 0, 0 <= donation_pct < 1, 2 <= installment_years <= 10,
      0 < *_pct <= 1, limit in [1, 100], offset >= 0, timestamps ISO-8601 UTC).
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "every endpoint accepting a body or query parameters"

  - priority: 7
    category: ownership
    check: |
      Landowner-scoped writes require X-User-ID == the owning Landowner.id:
      POST /applications (body landowner_id and Parcel.landowner_id), POST /parcels,
      POST /applications/{id}/counters, POST /applications/{id}/acceptance when the
      caller's role is Landowner, POST /applications/{id}/withdrawal.
      Appraiser-scoped writes require X-User-ID == Appraisal.appraiser_user_id:
      POST /appraisals/{id}/submission.
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /parcels, POST /applications, POST /applications/{id}/counters, POST /applications/{id}/acceptance, POST /applications/{id}/withdrawal, POST /appraisals/{id}/submission"

  - priority: 8
    category: concurrency
    check: "expected_<parent>_version MUST equal the parent row's current version (§1.2.1)"
    error_id: "ERR_STALE_APPLICATION_VERSION | ERR_STALE_EASEMENT_VERSION | ERR_STALE_PARCEL_VERSION"
    http_status: 412
    applies_to: "POST /applications/{id}/offers, POST /applications/{id}/funding-plan, POST /easements/{id}/amendments, PATCH /parcels/{id}"

  - priority: 12
    category: state
    check: |
      The subject row MUST be in a state from which the requested transition exists in §1.2.
      Covers: Application.status, Application.closing_status, Application.funding_plan_status,
      FundingRound.status, Appraisal.status, ClosingRequirement.status, FundingSource.status,
      Easement.status, MonitoringVisit.status, Violation.status, Amendment.status.
    error_id: "ERR_INVALID_APPLICATION_STATE | ERR_INVALID_CLOSING_STATE | ERR_INVALID_ROUND_STATE | ERR_INVALID_APPRAISAL_STATE | ERR_INVALID_REQUIREMENT_STATE | ERR_INVALID_SOURCE_STATE | ERR_INVALID_EASEMENT_STATE | ERR_INVALID_VISIT_STATE | ERR_INVALID_VIOLATION_STATE | ERR_INVALID_AMENDMENT_STATE"
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 16
    category: business_safety
    check: "an appraisal review MUST be performed by a user who is neither the engaging officer (Appraisal.engaged_by_user_id) nor the appraiser (Appraisal.appraiser_user_id)"
    error_id: ERR_APPRAISAL_REVIEW_SOD
    http_status: 403
    applies_to: "POST /appraisals/{id}/review"

  - priority: 16
    category: business_safety
    check: "a closing-requirement review MUST be performed by a user other than the one who submitted it (ClosingRequirement.submitted_by_user_id)"
    error_id: ERR_CLOSING_REVIEW_SOD
    http_status: 403
    applies_to: "POST /closing-requirements/{id}/review"

  - priority: 17
    category: business_safety
    check: |
      An easement under a stewardship hold cannot accept new stewardship or amendment work:
      POST /amendments/{id}/submission and POST /amendments/{id}/decision require
      Easement.stewardship_hold == false; POST /amendments/{id}/submission additionally
      requires compliance_status == COMPLIANT under amendment_policy STRICT, or
      compliance_status IN {COMPLIANT, VIOLATION_CURED} under CONDITIONAL;
      POST /monitoring-visits requires Easement.stewardship_hold == false.
    error_id: ERR_EASEMENT_NOT_COMPLIANT
    http_status: 409
    applies_to: "POST /monitoring-visits, POST /amendments/{id}/submission, POST /amendments/{id}/decision, POST /amendments/{id}/reinstatement"

  - priority: 18
    category: business_temporal
    check: "an application MUST be filed while its round is OPEN and the logical clock is within [opens_on, closes_on]; ranking MUST NOT run before the clock passes closes_on"
    error_id: ERR_ROUND_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /applications, POST /funding-rounds/{id}/rank"

  - priority: 19
    category: business_temporal
    check: |
      Appraisal engagements on the SAME application MUST NOT conflict. The test is a CLOSED
      interval comparison widened symmetrically by program.appraisal_engagement_buffer_days:
        conflict iff new.engagement_start <= existing.engagement_end + buffer
                AND existing.engagement_start <= new.engagement_end + buffer
      Only appraisals with status IN {ASSIGNED, SUBMITTED, CERTIFIED} occupy an interval;
      REJECTED appraisals do not block.
    error_id: ERR_APPRAISAL_ENGAGEMENT_CONFLICT
    http_status: 409
    applies_to: "POST /applications/{id}/appraisals"

  - priority: 20
    category: business_temporal
    check: |
      Monitoring visits on the SAME easement MUST NOT overlap. The window is HALF-OPEN
      [window_start, window_end), so the test is
        conflict iff new.window_start < existing.window_end AND existing.window_start < new.window_end
      Back-to-back visits touching at a single instant are allowed. Only visits with
      status == SCHEDULED occupy a window; COMPLETED and CANCELLED visits never block.
    error_id: ERR_MONITORING_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /monitoring-visits"

  - priority: 21
    category: business_constraint
    check: "an offer MUST NOT be issued once Application.negotiation_round_count has reached PreservationProgram.max_negotiation_rounds"
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /applications/{id}/offers"

  - priority: 21
    category: business_constraint
    check: "a counter MUST be strictly greater than Application.current_offer_cents and MUST be filed on or before Application.current_offer_expires_on"
    error_id: ERR_COUNTER_NOT_HIGHER
    http_status: 409
    applies_to: "POST /applications/{id}/counters"

  - priority: 22
    category: business_constraint
    check: "PreservationProgram weights MUST satisfy soil_weight + size_weight + contiguity_weight + pressure_weight == 1.00 exactly"
    error_id: ERR_WEIGHTS_NOT_NORMALIZED
    http_status: 422
    applies_to: "POST /preservation-programs"

  - priority: 22
    category: business_constraint
    check: "a Parcel MUST be in status ELIGIBLE to be attached to a new Application, and its restricted_value_cents MUST be strictly less than its unrestricted_value_cents"
    error_id: ERR_PARCEL_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /applications"

  - priority: 23
    category: business_constraint
    check: "a BOUNDARY_SURVEY submission MUST carry surveyed_acres within SURVEY_ACREAGE_TOLERANCE_ACRES (0.50) of Parcel.acres"
    error_id: ERR_SURVEY_ACREAGE_MISMATCH
    http_status: 409
    applies_to: "POST /closing-requirements/{id}/submission"

  - priority: 23
    category: business_constraint
    check: "a MORTGAGE_SUBORDINATION submission MUST carry a lienholder_name equal to Parcel.mortgage_lienholder_name; a submission of any other requirement_type MUST NOT carry lienholder_name"
    error_id: ERR_LIENHOLDER_REQUIRED
    http_status: 409
    applies_to: "POST /closing-requirements/{id}/submission"

  - priority: 23
    category: business_constraint
    check: "a TITLE_COMMITMENT requirement MUST NOT be accepted while exception_count > 0"
    error_id: ERR_TITLE_EXCEPTIONS_OUTSTANDING
    http_status: 409
    applies_to: "POST /closing-requirements/{id}/review"

  - priority: 23
    category: business_constraint
    check: "only requirement_type == BOUNDARY_SURVEY may be waived"
    error_id: ERR_REQUIREMENT_NOT_WAIVABLE
    http_status: 409
    applies_to: "POST /closing-requirements/{id}/waiver"

  - priority: 23
    category: business_constraint
    check: |
      Residential rights MUST NOT be overdrawn: at closing, 0 <= residential_rights_retained
      <= Parcel.baseline_dwelling_rights; on a RESIDENTIAL_RIGHT_RELOCATION amendment,
      residential_rights_delta < 0 and Easement.residential_rights_retained +
      residential_rights_delta >= 0.
    error_id: ERR_RESIDENTIAL_RIGHTS_OVERDRAWN
    http_status: 409
    applies_to: "POST /applications/{id}/closing, POST /easements/{id}/amendments"

  - priority: 23
    category: business_constraint
    check: "an IMPERVIOUS_INCREASE amendment MUST request more than the easement's current impervious_allowance_sqft, and an impervious-use request MUST NOT push impervious_used_sqft above impervious_allowance_sqft"
    error_id: ERR_IMPERVIOUS_ALLOWANCE_EXCEEDED
    http_status: 409
    applies_to: "POST /easements/{id}/impervious-requests, POST /easements/{id}/amendments"

  - priority: 23
    category: business_constraint
    check: "an amendment MUST NOT be approved unless net_conservation_benefit_cents > 0 — a zero-benefit amendment may be drafted and submitted but never approved; subdivision is never granted by amendment"
    error_id: ERR_NO_NET_CONSERVATION_BENEFIT
    http_status: 409
    applies_to: "POST /amendments/{id}/decision"

  - priority: 23
    category: business_constraint
    check: "ranking requires at least one Application in status RECEIVED on the round"
    error_id: ERR_NO_SCORED_APPLICATIONS
    http_status: 409
    applies_to: "POST /funding-rounds/{id}/rank"

  - priority: 24
    category: business_referential
    check: "when POST /violations supplies monitoring_visit_id, that visit's easement_id MUST equal the body easement_id"
    error_id: ERR_VISIT_EASEMENT_MISMATCH
    http_status: 409
    applies_to: "POST /violations"

  - priority: 24
    category: business_referential
    check: "a ClosingRequirement action MUST target a requirement whose parent Application is the one being closed; protected_acres at closing MUST match the accepted BOUNDARY_SURVEY's surveyed_acres (or Parcel.acres when waived)"
    error_id: ERR_REQUIREMENT_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /applications/{id}/closing, POST /closing-requirements/{id}/review"

  - priority: 24
    category: business_referential
    check: "an Easement MUST belong to the same PreservationProgram as any amendment policy or monitoring configuration applied to it, and its parcel_id MUST equal its application's parcel_id"
    error_id: ERR_EASEMENT_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /applications/{id}/closing, POST /easements/{id}/amendments, POST /monitoring-visits"

  - priority: 25
    category: business_fiscal
    check: "requested_price_cents MUST NOT exceed round_half_up(Application.preliminary_easement_value_cents * REQUEST_CEILING_MULTIPLIER) where REQUEST_CEILING_MULTIPLIER = 1.10"
    error_id: ERR_REQUESTED_PRICE_ABOVE_PRELIMINARY_CEILING
    http_status: 409
    applies_to: "POST /applications"

  - priority: 26
    category: business_fiscal
    check: "an offer or counter amount MUST NOT exceed Application.certified_easement_value_cents, and an offer requires a CERTIFIED appraisal to exist"
    error_id: ERR_OFFER_EXCEEDS_CERTIFIED_VALUE
    http_status: 409
    applies_to: "POST /applications/{id}/offers, POST /applications/{id}/counters"

  - priority: 27
    category: business_fiscal
    check: "acceptance requires funding_plan_status == FUNDED and funded_cost_cents == total_program_cost_cents; a plan whose commitments no longer sum to the program cost is incomplete"
    error_id: ERR_FUNDING_PLAN_INCOMPLETE
    http_status: 409
    applies_to: "POST /applications/{id}/acceptance"

  - priority: 27
    category: business_fiscal
    check: "a funding plan whose commitments have LAPSED or been RELEASED MUST be re-assembled before closing clearance; closing MUST NOT proceed while funding_plan_status != OBLIGATED"
    error_id: ERR_FUNDING_PLAN_STALE
    http_status: 409
    applies_to: "POST /applications/{id}/closing"

  - priority: 28
    category: business_fiscal
    check: "the waterfall MUST fully cover total_program_cost_cents from eligible ACTIVE sources whose obligation window contains target_closing_date"
    error_id: ERR_FUNDING_SHORTFALL
    http_status: 409
    applies_to: "POST /applications/{id}/funding-plan"

  - priority: 28
    category: business_fiscal
    check: "the FEDERAL share of a plan MUST NOT exceed floor(total_program_cost_cents * program.federal_max_share_pct)"
    error_id: ERR_FEDERAL_SHARE_EXCEEDED
    http_status: 409
    applies_to: "POST /applications/{id}/funding-plan"

  - priority: 28
    category: business_fiscal
    check: "the LOCAL share of a plan MUST be at least ceil(total_program_cost_cents * program.local_match_min_pct)"
    error_id: ERR_LOCAL_MATCH_SHORTFALL
    http_status: 409
    applies_to: "POST /applications/{id}/funding-plan"

  - priority: 28
    category: business_fiscal
    check: "for every swept source with requires_match == true, the non-federal total MUST be at least round_half_up(federal_total * match_ratio)"
    error_id: ERR_MATCH_RATIO_UNSATISFIED
    http_status: 409
    applies_to: "POST /applications/{id}/funding-plan"

  - priority: 29
    category: business_fiscal
    check: "no single source may be committed beyond its available_cents, and the sum of a source's OBLIGATED plus DISBURSED commitments MUST never exceed authorized_cents"
    error_id: ERR_SOURCE_WINDOW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /applications/{id}/funding-plan, POST /applications/{id}/acceptance"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# -----------------------------------------------------------------------------
endpoints:

  # --- PreservationProgram --------------------------------------------------
  - method: POST
    path: "/preservation-programs"
    description: "Create a preservation program. The four ranking weights must sum to exactly 1.00 or ERR_WEIGHTS_NOT_NORMALIZED is returned."
    roles: [ProgramAdmin]
    code: 201
    input: [name, soil_weight, size_weight, contiguity_weight, pressure_weight, min_composite_score, max_negotiation_rounds, local_match_min_pct, federal_max_share_pct, impervious_allowance_pct, amendment_policy, "monitoring_interval_days?", "monitoring_grace_days?", "appraisal_engagement_buffer_days?"]
    output: PreservationProgram
    side_effects:
      - "sets PreservationProgram.status = ACTIVE and total_preserved_acres = 0.00"

  - method: GET
    path: "/preservation-programs/{id}"
    description: "Read a preservation program including its recomputed total_preserved_acres."
    roles: [ProgramAdmin, AcquisitionOfficer, AppraisalReviewer, StewardshipMonitor, Landowner]
    code: 200
    input: []
    output: PreservationProgram
    side_effects: []

  # --- FundingRound ---------------------------------------------------------
  - method: POST
    path: "/funding-rounds"
    description: "Create a DRAFT funding round on a program."
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, round_label, opens_on, closes_on, pool_cents]
    output: FundingRound
    side_effects:
      - "sets FundingRound.status = DRAFT, score_basis = null, application_count = 0, selected_count = 0"

  - method: GET
    path: "/funding-rounds/{id}"
    description: "Read a funding round."
    roles: [ProgramAdmin, AcquisitionOfficer, Landowner]
    code: 200
    input: []
    output: FundingRound
    side_effects: []

  - method: GET
    path: "/funding-rounds"
    description: "List funding rounds, newest first by created_at DESC then id ASC."
    roles: [ProgramAdmin, AcquisitionOfficer, Landowner]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: FundingRound[]
    side_effects: []

  - method: POST
    path: "/funding-rounds/{id}/opening"
    description: "Open a DRAFT round for applications."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: FundingRound
    side_effects:
      - "FundingRound.status DRAFT -> OPEN"
      - "increments FundingRound.version by 1"

  - method: POST
    path: "/funding-rounds/{id}/rank"
    description: |
      Score and rank every RECEIVED application on a closed round under the requested
      score_basis, partition them at program.min_composite_score into RANKED and
      NOT_SELECTED, and assign rank_position over the RANKED subset ordered
      composite_score DESC then created_at ASC.
    roles: [ProgramAdmin]
    code: 200
    input: [score_basis]
    output: "{ ranked_count: integer, selected_count: integer, not_selected_count: integer, ranked_application_ids: string[] }"
    side_effects:
      - "runs calculations.application_composite_score under the requested variant for every RECEIVED application and writes Application.composite_score"
      - "Application.status RECEIVED -> RANKED when composite_score >= program.min_composite_score, else RECEIVED -> NOT_SELECTED"
      - "assigns Application.rank_position over the RANKED subset; leaves it null on NOT_SELECTED rows"
      - "because applications became NOT_SELECTED, their Parcel.status returns UNDER_APPLICATION -> ELIGIBLE"
      - "FundingRound.status OPEN -> SELECTED; writes score_basis, ranked_at, selected_count"
      - "increments FundingRound.version and every touched Application.version by 1"

  # --- Landowner ------------------------------------------------------------
  - method: POST
    path: "/landowners"
    description: "Register a landowner. The created id doubles as the landowner's X-User-ID."
    roles: [ProgramAdmin]
    code: 201
    input: [legal_name, mailing_state, tax_id_last4]
    output: Landowner
    side_effects:
      - "sets Landowner.status = ACTIVE"

  - method: GET
    path: "/landowners/{id}"
    description: "Read a landowner."
    roles: [ProgramAdmin, AcquisitionOfficer, Landowner]
    code: 200
    input: []
    output: Landowner
    side_effects: []

  # --- Parcel ---------------------------------------------------------------
  - method: POST
    path: "/parcels"
    description: "Register a parcel owned by the calling landowner; soil and pressure scores are computed at creation."
    roles: [Landowner, ProgramAdmin]
    code: 201
    input: [landowner_id, county, acres, prime_soil_acres, statewide_important_soil_acres, contiguous_preserved_acres, road_frontage_feet, sewer_available, zoning_min_lot_acres, baseline_dwelling_rights, unrestricted_value_cents, restricted_value_cents, "mortgage_lienholder_name?"]
    output: Parcel
    side_effects:
      - "runs calculations.parcel_soil_quality_score and writes Parcel.soil_quality_score"
      - "runs calculations.parcel_development_pressure_score and writes Parcel.development_pressure_score"
      - "sets Parcel.status = ELIGIBLE"

  - method: GET
    path: "/parcels/{id}"
    description: "Read a parcel including both computed scores."
    roles: [ProgramAdmin, AcquisitionOfficer, AppraisalReviewer, StewardshipMonitor, Landowner]
    code: 200
    input: []
    output: Parcel
    side_effects: []

  - method: GET
    path: "/parcels"
    description: "List parcels ordered created_at ASC then id ASC."
    roles: [ProgramAdmin, AcquisitionOfficer, StewardshipMonitor, Landowner]
    code: 200
    input: ["landowner_id?", "status?", "county?", "limit?", "offset?"]
    output: Parcel[]
    side_effects: []

  - method: PATCH
    path: "/parcels/{id}"
    description: "Update a parcel's contiguity, valuation or development-pressure attributes under optimistic concurrency control on Parcel.version."
    roles: [ProgramAdmin]
    code: 200
    input: [expected_parcel_version, "contiguous_preserved_acres?", "road_frontage_feet?", "sewer_available?", "zoning_min_lot_acres?", "unrestricted_value_cents?", "restricted_value_cents?", "mortgage_lienholder_name?"]
    output: Parcel
    side_effects:
      - "re-runs calculations.parcel_soil_quality_score and calculations.parcel_development_pressure_score"
      - "increments Parcel.version by 1"
      - "does NOT retroactively change any Application.contiguity_acres_at_receipt or any already-written Application.composite_score"

  # --- Application ----------------------------------------------------------
  - method: POST
    path: "/applications"
    description: "File an application on an OPEN round, freezing the parcel's contiguity at receipt and stamping the preliminary easement value."
    roles: [Landowner]
    code: 201
    input: [funding_round_id, parcel_id, landowner_id, requested_price_cents]
    output: Application
    side_effects:
      - "stamps Application.contiguity_acres_at_receipt = Parcel.contiguous_preserved_acres"
      - "runs calculations.easement_value variant preliminary_assessor_basis and writes Application.preliminary_easement_value_cents"
      - "sets Application.status = RECEIVED, closing_status = NOT_APPLICABLE, funding_plan_status = UNFUNDED, negotiation_round_count = 0"
      - "Parcel.status ELIGIBLE -> UNDER_APPLICATION and increments Parcel.version by 1"
      - "recomputes FundingRound.application_count and increments FundingRound.version by 1"

  - method: GET
    path: "/applications/{id}"
    description: "Read an application with all three status dimensions and every derived cost field."
    roles: [ProgramAdmin, AcquisitionOfficer, AppraisalReviewer, Landowner]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/applications"
    description: "List applications ordered rank_position ASC NULLS LAST then created_at ASC."
    roles: [ProgramAdmin, AcquisitionOfficer, AppraisalReviewer, Landowner]
    code: 200
    input: ["funding_round_id?", "parcel_id?", "landowner_id?", "status?", "closing_status?", "funding_plan_status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: POST
    path: "/applications/{id}/offers"
    description: "Issue (or re-issue) a purchase offer on a RANKED or COUNTERED application under optimistic concurrency control on Application.version. Bounded by program.max_negotiation_rounds."
    roles: [AcquisitionOfficer]
    code: 200
    input: [expected_application_version, offer_cents, structure, offer_expires_on, "donation_pct?", "installment_years?"]
    output: Application
    side_effects:
      - "appends an immutable NegotiationRound(kind=OFFER) and recomputes Application.negotiation_round_count"
      - "Application.status RANKED|COUNTERED -> OFFER_ISSUED"
      - "runs calculations.bargain_sale_and_admin_fee and rewrites donation_cents, bargain_sale_price_cents, admin_fee_cents, total_program_cost_cents"
      - "runs calculations.installment_schedule_split when structure == INSTALLMENT and rewrites first_installment_cents, final_installment_cents, installment_interest_total_cents; nulls them otherwise"
      - "increments Application.version by 1"

  - method: POST
    path: "/applications/{id}/counters"
    description: "Landowner counter-offer on an OFFER_ISSUED application; must be strictly above the current offer and no higher than the certified easement value."
    roles: [Landowner]
    code: 200
    input: [counter_cents, "rationale?"]
    output: Application
    side_effects:
      - "appends an immutable NegotiationRound(kind=COUNTER)"
      - "Application.status OFFER_ISSUED -> COUNTERED; writes last_counter_cents and proposed_price_cents"
      - "re-runs calculations.bargain_sale_and_admin_fee against the counter amount, rewriting total_program_cost_cents"
      - "because total_program_cost_cents moved away from funded_cost_cents, Application.funding_plan_status FUNDED -> UNDERFUNDED"
      - "increments Application.version by 1"

  - method: POST
    path: "/applications/{id}/acceptance"
    description: "Accept the standing offer (Landowner, from OFFER_ISSUED) or the standing counter (AcquisitionOfficer, from COUNTERED). Requires a complete funding plan; obligates every reserved commitment and creates the closing requirement set."
    roles: [Landowner, AcquisitionOfficer]
    code: 200
    input: []
    output: Application
    side_effects:
      - "appends an immutable NegotiationRound(kind=ACCEPTANCE) and writes Application.agreed_price_cents"
      - "Application.status OFFER_ISSUED|COUNTERED -> ACCEPTED"
      - "every FundingCommitment for the application flips RESERVED -> OBLIGATED and Application.funding_plan_status FUNDED -> OBLIGATED"
      - "recomputes each touched FundingSource.committed_cents / reserved_cents / available_cents and increments FundingSource.version by 1"
      - "a FundingSource whose committed_cents reached fully_obligated_threshold_pct * authorized_cents flips ACTIVE -> FULLY_OBLIGATED"
      - "every RESERVED FundingCommitment on OTHER applications against that source flips RESERVED -> LAPSED with lapse_reason = SOURCE_FULLY_OBLIGATED"
      - "each victim Application.funding_plan_status flips FUNDED -> UNDERFUNDED and its version increments by 1"
      - "creates ClosingRequirement rows (TITLE_COMMITMENT, BOUNDARY_SURVEY, plus MORTGAGE_SUBORDINATION when the parcel carries a lienholder) and sets Application.closing_status NOT_APPLICABLE -> PENDING_REQUIREMENTS"
      - "increments Application.version by 1"

  - method: POST
    path: "/applications/{id}/withdrawal"
    description: "Landowner withdrawal from any pre-acceptance state; releases every commitment and frees the parcel."
    roles: [Landowner]
    code: 200
    input: [withdrawal_reason]
    output: Application
    side_effects:
      - "appends an immutable NegotiationRound(kind=WITHDRAWAL)"
      - "Application.status -> WITHDRAWN"
      - "every FundingCommitment with status IN {RESERVED, OBLIGATED} flips to RELEASED and funding_plan_status becomes RELEASED"
      - "recomputes each touched FundingSource.committed_cents / reserved_cents / available_cents; a source may flip FULLY_OBLIGATED -> ACTIVE"
      - "Parcel.status UNDER_APPLICATION -> ELIGIBLE and increments Parcel.version by 1"
      - "increments Application.version by 1"

  - method: POST
    path: "/applications/{id}/funding-plan"
    description: "Assemble (or re-assemble) the funding plan by sweeping eligible sources under optimistic concurrency control on Application.version, then verify the federal-share, local-match and match-ratio requirements."
    roles: [ProgramAdmin]
    code: 200
    input: [expected_application_version, target_closing_date]
    output: "{ application_id: string, funded_cost_cents: integer, commitment_count: integer, federal_total_cents: integer, local_total_cents: integer, state_total_cents: integer, remainder_absorbed_cents: integer, commitment_ids: string[] }"
    side_effects:
      - "flips every pre-existing RESERVED FundingCommitment on the application to RELEASED with lapse_reason = PLAN_SUPERSEDED"
      - "runs calculations.funding_waterfall_allocation and creates one RESERVED FundingCommitment per non-zero take with sweep_order and absorbed_remainder_cents"
      - "sets Application.funded_cost_cents = total_program_cost_cents and funding_plan_status = FUNDED"
      - "recomputes each touched FundingSource.reserved_cents and increments FundingSource.version by 1"
      - "increments Application.version by 1"

  - method: GET
    path: "/applications/{id}/negotiation-rounds"
    description: "Read the immutable negotiation log for an application, ordered created_at ASC."
    roles: [ProgramAdmin, AcquisitionOfficer, Landowner]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: NegotiationRound[]
    side_effects: []

  - method: GET
    path: "/applications/{id}/closing-requirements"
    description: "List the closing requirements attached to an application, ordered created_at ASC."
    roles: [ProgramAdmin, AcquisitionOfficer, Landowner]
    code: 200
    input: ["status?", "requirement_type?", "limit?", "offset?"]
    output: ClosingRequirement[]
    side_effects: []

  - method: POST
    path: "/applications/{id}/closing"
    description: "Record the easement and close the acquisition. Requires closing_status == CLEARED."
    roles: [ProgramAdmin]
    code: 201
    input: [recorded_on, protected_acres, residential_rights_retained, subdivision_permitted, permitted_uses]
    output: Easement
    side_effects:
      - "creates Easement(status=RECORDED, stewardship_status=MONITORING_CURRENT, compliance_status=COMPLIANT, stewardship_hold=false, impervious_used_sqft=0)"
      - "runs calculations.impervious_allowance_and_exceedance and writes Easement.impervious_allowance_sqft"
      - "sets Easement.residential_rights_extinguished = Parcel.baseline_dwelling_rights - residential_rights_retained"
      - "runs calculations.stewardship_due_projection with anchor = recorded_on and writes Easement.next_monitoring_due_on"
      - "Application.status ACCEPTED -> CLOSED_RECORDED and closing_status CLEARED -> CLOSED"
      - "every OBLIGATED FundingCommitment flips to DISBURSED and funding_plan_status OBLIGATED -> DISBURSED"
      - "recomputes each touched FundingSource.disbursed_cents and increments FundingSource.version by 1"
      - "Parcel.status UNDER_APPLICATION -> ENCUMBERED and increments Parcel.version by 1"
      - "recomputes PreservationProgram.total_preserved_acres and increments PreservationProgram.version by 1"
      - "increments Application.version by 1"

  - method: POST
    path: "/applications/{id}/closing-cancellation"
    description: "Abandon a cleared-or-pending closing; releases every commitment, waives every open requirement and withdraws the application."
    roles: [ProgramAdmin]
    code: 200
    input: [reason]
    output: Application
    side_effects:
      - "Application.closing_status -> CANCELLED and Application.status ACCEPTED -> WITHDRAWN"
      - "every FundingCommitment with status IN {RESERVED, OBLIGATED} flips to RELEASED with lapse_reason = CLOSING_CANCELLED and funding_plan_status becomes RELEASED"
      - "recomputes each touched FundingSource.committed_cents / reserved_cents / available_cents so authorized_cents == available_cents + committed_cents still holds exactly"
      - "a source whose committed_cents fell back below the obligation threshold flips FULLY_OBLIGATED -> ACTIVE"
      - "every ClosingRequirement with status IN {OUTSTANDING, SUBMITTED, DEFICIENT} becomes WAIVED with waiver_reason = CLOSING_CANCELLED"
      - "Parcel.status UNDER_APPLICATION -> ELIGIBLE and increments Parcel.version by 1"
      - "increments Application.version by 1"

  # --- Appraisal ------------------------------------------------------------
  - method: POST
    path: "/applications/{id}/appraisals"
    description: "Engage an appraiser for an application. Engagement intervals on the same application must not conflict under the buffered closed-interval rule."
    roles: [AcquisitionOfficer]
    code: 201
    input: [appraiser_user_id, appraiser_firm, engagement_start, engagement_end, method]
    output: Appraisal
    side_effects:
      - "sets Appraisal.status = ASSIGNED, basis = CERTIFIED_APPRAISAL_BASIS, submission_count = 0, engaged_by_user_id = X-User-ID"

  - method: GET
    path: "/applications/{id}/appraisals"
    description: "List the appraisals engaged on an application, ordered created_at ASC."
    roles: [ProgramAdmin, AcquisitionOfficer, AppraisalReviewer, Appraiser]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Appraisal[]
    side_effects: []

  - method: GET
    path: "/appraisals/{id}"
    description: "Read an appraisal including its computed easement_value_cents."
    roles: [ProgramAdmin, AcquisitionOfficer, AppraisalReviewer, Appraiser]
    code: 200
    input: []
    output: Appraisal
    side_effects: []

  - method: POST
    path: "/appraisals/{id}/submission"
    description: "Appraiser submits (or resubmits after rejection) the unrestricted and restricted values."
    roles: [Appraiser]
    code: 200
    input: [unrestricted_value_cents, restricted_value_cents]
    output: Appraisal
    side_effects:
      - "Appraisal.status ASSIGNED|REJECTED -> SUBMITTED and clears review_note"
      - "runs calculations.easement_value variant certified_appraisal_basis and writes Appraisal.easement_value_cents"
      - "increments Appraisal.submission_count by 1"
      - "increments Appraisal.version by 1"

  - method: POST
    path: "/appraisals/{id}/review"
    description: "Certify or reject a submitted appraisal. The reviewer must be neither the engaging officer nor the appraiser (segregation of duties)."
    roles: [AppraisalReviewer]
    code: 200
    input: [decision, "review_note?"]
    output: Appraisal
    side_effects:
      - "on CERTIFY: Appraisal.status SUBMITTED -> CERTIFIED, certified_by_user_id = X-User-ID, and Application.certified_easement_value_cents = Appraisal.easement_value_cents with Application.version incremented by 1"
      - "on REJECT: Appraisal.status SUBMITTED -> REJECTED, writes review_note and clears easement_value_cents"
      - "increments Appraisal.version by 1"

  # --- FundingSource --------------------------------------------------------
  - method: POST
    path: "/funding-sources"
    description: "Authorize a federal, state or local funding source on a program with an obligation window, share cap and optional match requirement."
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, source_name, level, authorized_cents, obligation_window_start, obligation_window_end, max_share_pct, priority_order, "requires_match?", "match_ratio?", "fully_obligated_threshold_pct?"]
    output: FundingSource
    side_effects:
      - "sets FundingSource.status = ACTIVE, committed_cents = 0, reserved_cents = 0, disbursed_cents = 0, available_cents = authorized_cents"

  - method: GET
    path: "/funding-sources/{id}"
    description: "Read a funding source with its committed / reserved / disbursed / available ledger."
    roles: [ProgramAdmin, AcquisitionOfficer]
    code: 200
    input: []
    output: FundingSource
    side_effects: []

  - method: GET
    path: "/funding-sources"
    description: "List funding sources ordered priority_order ASC then created_at ASC."
    roles: [ProgramAdmin, AcquisitionOfficer]
    code: 200
    input: ["program_id?", "level?", "status?", "limit?", "offset?"]
    output: FundingSource[]
    side_effects: []

  - method: POST
    path: "/funding-sources/{id}/suspension"
    description: "Suspend a source, removing it from every future sweep and lapsing its reserved commitments."
    roles: [ProgramAdmin]
    code: 200
    input: [reason]
    output: FundingSource
    side_effects:
      - "FundingSource.status ACTIVE|FULLY_OBLIGATED -> SUSPENDED and writes suspension_reason"
      - "every RESERVED FundingCommitment against the source flips to LAPSED with lapse_reason = SOURCE_SUSPENDED"
      - "each affected Application.funding_plan_status flips FUNDED -> UNDERFUNDED"
      - "increments FundingSource.version by 1"

  # --- FundingCommitment ----------------------------------------------------
  - method: GET
    path: "/funding-commitments/{id}"
    description: "Read a funding commitment including its sweep_order and absorbed_remainder_cents."
    roles: [ProgramAdmin, AcquisitionOfficer]
    code: 200
    input: []
    output: FundingCommitment
    side_effects: []

  - method: GET
    path: "/funding-commitments"
    description: "List funding commitments ordered sweep_order ASC then created_at ASC."
    roles: [ProgramAdmin, AcquisitionOfficer]
    code: 200
    input: ["application_id?", "funding_source_id?", "status?", "limit?", "offset?"]
    output: FundingCommitment[]
    side_effects: []

  # --- ClosingRequirement ---------------------------------------------------
  - method: GET
    path: "/closing-requirements/{id}"
    description: "Read a closing requirement."
    roles: [ProgramAdmin, AcquisitionOfficer, Landowner]
    code: 200
    input: []
    output: ClosingRequirement
    side_effects: []

  - method: POST
    path: "/closing-requirements/{id}/submission"
    description: "Submit title work, a mortgage subordination or a boundary survey for review. Type-specific payload fields are mandatory for their own type and forbidden for the others."
    roles: [AcquisitionOfficer]
    code: 200
    input: ["lienholder_name?", "exception_count?", "surveyed_acres?"]
    output: ClosingRequirement
    side_effects:
      - "ClosingRequirement.status OUTSTANDING|DEFICIENT|SATISFIED -> SUBMITTED, writes submitted_by_user_id = X-User-ID, clears deficiency_note"
      - "recomputes Application.requirement_satisfied_count"
      - "Application.closing_status may bubble BLOCKED -> PENDING_REQUIREMENTS or CLEARED -> PENDING_REQUIREMENTS"
      - "increments ClosingRequirement.version by 1"

  - method: POST
    path: "/closing-requirements/{id}/review"
    description: "Accept or reject a submitted requirement. The reviewer must not be the submitter (segregation of duties), and a title commitment with outstanding exceptions can never be accepted."
    roles: [ProgramAdmin]
    code: 200
    input: [decision, "deficiency_note?"]
    output: ClosingRequirement
    side_effects:
      - "on ACCEPT: status SUBMITTED -> SATISFIED, reviewed_by_user_id = X-User-ID, Application.requirement_satisfied_count recomputed, and closing_status may bubble PENDING_REQUIREMENTS -> CLEARED once every requirement is satisfied and funding_plan_status == OBLIGATED"
      - "on REJECT: status SUBMITTED -> DEFICIENT with deficiency_note, and Application.closing_status bubbles PENDING_REQUIREMENTS -> BLOCKED"
      - "increments ClosingRequirement.version by 1"

  - method: POST
    path: "/closing-requirements/{id}/waiver"
    description: "Waive a boundary survey requirement. Title work and mortgage subordination are never waivable."
    roles: [ProgramAdmin]
    code: 200
    input: [waiver_reason]
    output: ClosingRequirement
    side_effects:
      - "ClosingRequirement.status OUTSTANDING|DEFICIENT -> WAIVED with waiver_reason"
      - "recomputes Application.requirement_satisfied_count and may bubble closing_status to CLEARED"
      - "increments ClosingRequirement.version by 1"

  # --- Easement -------------------------------------------------------------
  - method: GET
    path: "/easements/{id}"
    description: "Read an easement with all three status dimensions, its impervious ledger and its stewardship projection."
    roles: [ProgramAdmin, AcquisitionOfficer, StewardshipMonitor, Landowner]
    code: 200
    input: []
    output: Easement
    side_effects: []

  - method: GET
    path: "/easements"
    description: "List easements ordered recorded_on ASC then created_at ASC."
    roles: [ProgramAdmin, AcquisitionOfficer, StewardshipMonitor, Landowner]
    code: 200
    input: ["parcel_id?", "application_id?", "status?", "compliance_status?", "stewardship_status?", "limit?", "offset?"]
    output: Easement[]
    side_effects: []

  - method: POST
    path: "/easements/{id}/impervious-requests"
    description: "Record newly built impervious coverage against the easement's allowance; rejected outright when it would exceed the allowance."
    roles: [ProgramAdmin, StewardshipMonitor]
    code: 200
    input: [added_impervious_sqft, description]
    output: Easement
    side_effects:
      - "increases Easement.impervious_used_sqft by added_impervious_sqft when the result stays within impervious_allowance_sqft"
      - "increments Easement.version by 1"

  - method: GET
    path: "/easements/{id}/monitoring-visits"
    description: "List the monitoring visits scheduled on an easement, ordered window_start ASC then created_at ASC."
    roles: [ProgramAdmin, StewardshipMonitor, Landowner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MonitoringVisit[]
    side_effects: []

  - method: GET
    path: "/easements/{id}/violations"
    description: "List the violations opened on an easement, ordered opened_on ASC then created_at ASC."
    roles: [ProgramAdmin, StewardshipMonitor, Landowner]
    code: 200
    input: ["status?", "violation_type?", "limit?", "offset?"]
    output: Violation[]
    side_effects: []

  - method: GET
    path: "/easements/{id}/amendments"
    description: "List the amendments filed against an easement, ordered created_at ASC."
    roles: [ProgramAdmin, StewardshipMonitor, Landowner]
    code: 200
    input: ["status?", "amendment_type?", "limit?", "offset?"]
    output: Amendment[]
    side_effects: []

  - method: POST
    path: "/easements/{id}/amendments"
    description: "Draft an amendment against an easement under optimistic concurrency control on Easement.version; any prior DRAFT on the same easement is rescinded."
    roles: [ProgramAdmin]
    code: 201
    input: [expected_easement_version, amendment_type, net_conservation_benefit_cents, "requested_impervious_sqft?", "residential_rights_delta?"]
    output: Amendment
    side_effects:
      - "every pre-existing DRAFT Amendment on the easement flips to RESCINDED with rescission_reason = SUPERSEDED_BY_NEWER_DRAFT"
      - "creates the new Amendment with status = DRAFT, applied_rights_delta = 0, applied_impervious_sqft = null"
      - "increments Easement.version by 1"

  # --- MonitoringVisit ------------------------------------------------------
  - method: POST
    path: "/monitoring-visits"
    description: "Schedule an annual monitoring visit on an easement over the half-open window [window_start, window_end); windows of SCHEDULED visits on the same easement may not overlap."
    roles: [StewardshipMonitor]
    code: 201
    input: [easement_id, window_start, window_end]
    output: MonitoringVisit
    side_effects:
      - "sets MonitoringVisit.status = SCHEDULED and finding = null"

  - method: GET
    path: "/monitoring-visits/{id}"
    description: "Read a monitoring visit including its observed impervious coverage and finding."
    roles: [ProgramAdmin, StewardshipMonitor, Landowner]
    code: 200
    input: []
    output: MonitoringVisit
    side_effects: []

  - method: POST
    path: "/monitoring-visits/{id}/completion"
    description: "Complete a scheduled visit with the observed impervious coverage; a strict exceedance of the allowance opens a violation and suspends any amendment under review."
    roles: [StewardshipMonitor]
    code: 200
    input: [observed_impervious_sqft, "notes?"]
    output: MonitoringVisit
    side_effects:
      - "MonitoringVisit.status SCHEDULED -> COMPLETED with completed_at = the logical clock"
      - "runs calculations.impervious_allowance_and_exceedance and writes MonitoringVisit.finding"
      - "Easement.last_monitored_on = completed_at, next_monitoring_due_on re-projected by calculations.stewardship_due_projection, stewardship_status -> MONITORING_CURRENT"
      - "on CONFIRMED_VIOLATION: creates Violation(violation_type=IMPERVIOUS_EXCEEDANCE, status=OPEN) with excess_sqft and runs calculations.violation_severity_and_cure_deadline"
      - "on CONFIRMED_VIOLATION: Easement.compliance_status COMPLIANT -> VIOLATION_OPEN, stewardship_hold = true, open_violation_count recomputed"
      - "on CONFIRMED_VIOLATION: every UNDER_REVIEW Amendment on the easement flips to SUSPENDED with suspended_reason = VIOLATION_OPEN and Easement.pending_amendment_count is recomputed downward"
      - "increments MonitoringVisit.version and Easement.version by 1"

  - method: POST
    path: "/monitoring-visits/{id}/cancellation"
    description: "Cancel a scheduled visit, vacating its window for overlap purposes."
    roles: [StewardshipMonitor]
    code: 200
    input: [reason]
    output: MonitoringVisit
    side_effects:
      - "MonitoringVisit.status SCHEDULED -> CANCELLED with cancellation_reason"
      - "the visit no longer participates in the half-open overlap test"
      - "increments MonitoringVisit.version by 1"

  - method: GET
    path: "/monitoring-visits/{id}/violations"
    description: "List the violations discovered by a specific monitoring visit, ordered created_at ASC."
    roles: [ProgramAdmin, StewardshipMonitor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Violation[]
    side_effects: []

  # --- Violation ------------------------------------------------------------
  - method: POST
    path: "/violations"
    description: "Open a violation directly (subdivision, prohibited use or excess dwelling), optionally attributing it to a monitoring visit on the same easement."
    roles: [StewardshipMonitor, ProgramAdmin]
    code: 201
    input: [easement_id, violation_type, "excess_sqft?", "monitoring_visit_id?", "notes?"]
    output: Violation
    side_effects:
      - "runs calculations.violation_severity_and_cure_deadline and writes severity, opened_on, cure_deadline_on"
      - "Easement.compliance_status COMPLIANT -> VIOLATION_OPEN, stewardship_hold = true, open_violation_count recomputed"
      - "every UNDER_REVIEW Amendment on the easement flips to SUSPENDED with suspended_reason = VIOLATION_OPEN and pending_amendment_count is recomputed downward"
      - "increments Easement.version by 1"

  - method: GET
    path: "/violations/{id}"
    description: "Read a violation including its severity and cure deadline."
    roles: [ProgramAdmin, StewardshipMonitor, Landowner]
    code: 200
    input: []
    output: Violation
    side_effects: []

  - method: POST
    path: "/violations/{id}/cure-plan"
    description: "Accept a landowner cure plan on an open violation, before the cure deadline."
    roles: [StewardshipMonitor]
    code: 200
    input: [cure_plan_note]
    output: Violation
    side_effects:
      - "Violation.status OPEN -> CURE_PLAN_ACCEPTED with cure_plan_note"
      - "increments Violation.version by 1"

  - method: POST
    path: "/violations/{id}/cure-verification"
    description: "Verify that a violation has been cured, from either CURE_PLAN_ACCEPTED or ESCALATED; lifts the stewardship hold once no violation remains open."
    roles: [StewardshipMonitor]
    code: 200
    input: ["verification_note?"]
    output: Violation
    side_effects:
      - "Violation.status CURE_PLAN_ACCEPTED|ESCALATED -> CURED with cured_on = the logical clock"
      - "on IMPERVIOUS_EXCEEDANCE: Easement.impervious_used_sqft is clamped back to at most impervious_allowance_sqft"
      - "Easement.open_violation_count recomputed; when it reaches 0, compliance_status -> VIOLATION_CURED and stewardship_hold = false"
      - "increments Violation.version and Easement.version by 1"

  # --- Amendment ------------------------------------------------------------
  - method: GET
    path: "/amendments/{id}"
    description: "Read an amendment including the deltas actually applied to the easement."
    roles: [ProgramAdmin, StewardshipMonitor, Landowner]
    code: 200
    input: []
    output: Amendment
    side_effects: []

  - method: POST
    path: "/amendments/{id}/submission"
    description: "Submit a draft amendment for review. Gated on the easement's compliance posture, which is interpreted strictly or conditionally per program.amendment_policy."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Amendment
    side_effects:
      - "Amendment.status DRAFT -> UNDER_REVIEW"
      - "recomputes Easement.pending_amendment_count and increments Easement.version by 1"
      - "increments Amendment.version by 1"

  - method: POST
    path: "/amendments/{id}/decision"
    description: "Approve or reject an amendment under review. Approval rewrites the easement's impervious allowance or transfers residential rights while conserving the baseline total."
    roles: [ProgramAdmin]
    code: 200
    input: [decision, "reason?"]
    output: Amendment
    side_effects:
      - "on APPROVE: Amendment.status UNDER_REVIEW -> APPROVED, Easement.status -> AMENDED, amendment_count recomputed"
      - "on APPROVE of IMPERVIOUS_INCREASE: Easement.impervious_allowance_sqft = requested_impervious_sqft and Amendment.applied_impervious_sqft records it"
      - "on APPROVE of RESIDENTIAL_RIGHT_RELOCATION: residential_rights_retained += residential_rights_delta, residential_rights_extinguished -= residential_rights_delta, and Amendment.applied_rights_delta records the delta"
      - "on REJECT: Amendment.status UNDER_REVIEW -> REJECTED with decision_reason"
      - "recomputes Easement.pending_amendment_count and increments Easement.version by 1"
      - "increments Amendment.version by 1"

  - method: POST
    path: "/amendments/{id}/reinstatement"
    description: "Return a violation-suspended amendment to review. Only a CONDITIONAL amendment policy admits a merely cured easement; a STRICT program requires full compliance."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Amendment
    side_effects:
      - "Amendment.status SUSPENDED -> UNDER_REVIEW and clears suspended_reason"
      - "recomputes Easement.pending_amendment_count upward and increments Easement.version by 1"
      - "increments Amendment.version by 1"

  - method: POST
    path: "/amendments/{id}/rescission"
    description: "Rescind an approved amendment, exactly reversing every field it wrote onto the easement."
    roles: [ProgramAdmin]
    code: 200
    input: [reason]
    output: Amendment
    side_effects:
      - "Amendment.status APPROVED -> RESCINDED with rescission_reason"
      - "on an IMPERVIOUS_INCREASE: Easement.impervious_allowance_sqft is re-derived from protected_acres by calculations.impervious_allowance_and_exceedance"
      - "on a RESIDENTIAL_RIGHT_RELOCATION: residential_rights_retained -= applied_rights_delta and residential_rights_extinguished += applied_rights_delta, restoring the exact pre-approval pair"
      - "clears Amendment.applied_rights_delta to 0 and applied_impervious_sqft to null"
      - "recomputes Easement.amendment_count; Easement.status AMENDED -> RECORDED when it reaches 0"
      - "increments Amendment.version and Easement.version by 1"

  # --- Operations / test-driving surface ------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Set the server's logical UTC clock, which every window, deadline, expiry and
      projection rule reads. Before any call to this endpoint the logical clock reads
      exactly the fixed default 2026-08-01T00:00:00Z and MUST NOT fall back to real
      wall-clock time. The default sits at or before every fixture date in this scaffold,
      so an unset clock is a deterministic "earliest" instant.
    roles: [ProgramAdmin, AcquisitionOfficer, AppraisalReviewer, Appraiser, StewardshipMonitor, Landowner]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string, previous_utc: string }"
    side_effects:
      - "moves the logical clock; performs no state transitions on its own"

  - method: POST
    path: "/stewardship-sweeps"
    description: "Run the time-driven sweep: lapse expired offers, expire funding sources past their obligation window, re-project stewardship posture, escalate violations past their cure deadline, clear cured easements back to COMPLIANT, terminate long-escalated easements, and close fully-resolved rounds."
    roles: [ProgramAdmin, StewardshipMonitor]
    code: 200
    input: []
    output: "{ swept_easement_count: integer, due_count: integer, delinquent_count: integer, cleared_to_compliant_count: integer, terminated_easement_count: integer, lapsed_offer_count: integer, escalated_violation_count: integer, expired_source_count: integer, closed_round_count: integer }"
    side_effects:
      - "Application.status OFFER_ISSUED -> LAPSED for every application past current_offer_expires_on, appending a NegotiationRound(kind=EXPIRATION), releasing its RESERVED commitments and freeing its parcel"
      - "FundingSource.status ACTIVE|FULLY_OBLIGATED -> EXPIRED past obligation_window_end, lapsing its RESERVED commitments and flipping their applications to UNDERFUNDED"
      - "Easement.stewardship_status MONITORING_CURRENT -> MONITORING_DUE -> MONITORING_DELINQUENT per calculations.stewardship_due_projection"
      - "Violation.status OPEN|CURE_PLAN_ACCEPTED -> ESCALATED past cure_deadline_on, flipping Easement.compliance_status VIOLATION_OPEN -> VIOLATION_ESCALATED"
      - "Easement.compliance_status VIOLATION_CURED -> COMPLIANT once 90 days have passed since the last cure with no new violation"
      - "Easement.status -> TERMINATED after a violation has been ESCALATED for 730 days, returning Parcel.status ENCUMBERED -> ELIGIBLE and recomputing PreservationProgram.total_preserved_acres"
      - "FundingRound.status SELECTED -> CLOSED once every application on the round is terminal"
      - "increments the version of every row it touches by 1"

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:

  # --- auth / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the caller's role is not permitted for the endpoint per the §1.7 matrix"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a landowner-scoped or appraiser-scoped write is attempted by a user who is not the owning Landowner or the assigned appraiser"

  # --- existence ---
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "the referenced PreservationProgram does not exist"
  - id: ERR_ROUND_NOT_FOUND
    http: 404
    condition: "the referenced FundingRound does not exist"
  - id: ERR_LANDOWNER_NOT_FOUND
    http: 404
    condition: "the referenced Landowner does not exist"
  - id: ERR_PARCEL_NOT_FOUND
    http: 404
    condition: "the referenced Parcel does not exist"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "the referenced Application does not exist"
  - id: ERR_APPRAISAL_NOT_FOUND
    http: 404
    condition: "the referenced Appraisal does not exist"
  - id: ERR_SOURCE_NOT_FOUND
    http: 404
    condition: "the referenced FundingSource does not exist"
  - id: ERR_COMMITMENT_NOT_FOUND
    http: 404
    condition: "the referenced FundingCommitment does not exist"
  - id: ERR_REQUIREMENT_NOT_FOUND
    http: 404
    condition: "the referenced ClosingRequirement does not exist"
  - id: ERR_EASEMENT_NOT_FOUND
    http: 404
    condition: "the referenced Easement does not exist"
  - id: ERR_VISIT_NOT_FOUND
    http: 404
    condition: "the referenced MonitoringVisit does not exist"
  - id: ERR_VIOLATION_NOT_FOUND
    http: 404
    condition: "the referenced Violation does not exist"
  - id: ERR_AMENDMENT_NOT_FOUND
    http: 404
    condition: "the referenced Amendment does not exist"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "malformed body, missing required field, unknown field, wrong type, invalid enum member, or a numeric value outside its declared domain"
  - id: ERR_WEIGHTS_NOT_NORMALIZED
    http: 422
    condition: "soil_weight + size_weight + contiguity_weight + pressure_weight != 1.00 exactly on POST /preservation-programs"

  # --- concurrency ---
  - id: ERR_STALE_APPLICATION_VERSION
    http: 412
    condition: "expected_application_version does not equal Application.version on POST /applications/{id}/offers or POST /applications/{id}/funding-plan"
  - id: ERR_STALE_EASEMENT_VERSION
    http: 412
    condition: "expected_easement_version does not equal Easement.version on POST /easements/{id}/amendments"
  - id: ERR_STALE_PARCEL_VERSION
    http: 412
    condition: "expected_parcel_version does not equal Parcel.version on PATCH /parcels/{id}"

  # --- state ---
  - id: ERR_INVALID_APPLICATION_STATE
    http: 409
    condition: "the Application's status dimension admits no such transition (e.g. an offer on a WITHDRAWN, LAPSED, ACCEPTED or NOT_SELECTED application)"
  - id: ERR_INVALID_CLOSING_STATE
    http: 409
    condition: "the Application's closing_status dimension admits no such transition (e.g. closing while closing_status != CLEARED, or cancelling a CLOSED closing)"
  - id: ERR_INVALID_ROUND_STATE
    http: 409
    condition: "the FundingRound is not in a state admitting the requested transition (e.g. opening an already-OPEN round, ranking a SELECTED round)"
  - id: ERR_INVALID_APPRAISAL_STATE
    http: 409
    condition: "the Appraisal is not in a state admitting the requested transition (e.g. reviewing an ASSIGNED appraisal, resubmitting a CERTIFIED one)"
  - id: ERR_INVALID_REQUIREMENT_STATE
    http: 409
    condition: "the ClosingRequirement is not in a state admitting the requested transition (e.g. reviewing an OUTSTANDING requirement, waiving a SATISFIED one)"
  - id: ERR_INVALID_SOURCE_STATE
    http: 409
    condition: "the FundingSource is not in a state admitting the requested transition (e.g. suspending an already-EXPIRED source)"
  - id: ERR_INVALID_EASEMENT_STATE
    http: 409
    condition: "the Easement is TERMINATED, or otherwise not in a state admitting the requested transition"
  - id: ERR_INVALID_VISIT_STATE
    http: 409
    condition: "the MonitoringVisit is not SCHEDULED, or completion is attempted before window_start"
  - id: ERR_INVALID_VIOLATION_STATE
    http: 409
    condition: "the Violation is not in a state admitting the requested transition (e.g. a cure plan on an ESCALATED or CURED violation)"
  - id: ERR_INVALID_AMENDMENT_STATE
    http: 409
    condition: "the Amendment is not in a state admitting the requested transition (e.g. deciding a SUSPENDED amendment, reinstating an UNDER_REVIEW one, rescinding a REJECTED one)"

  # --- business_safety / segregation of duties ---
  - id: ERR_APPRAISAL_REVIEW_SOD
    http: 403
    condition: "the appraisal reviewer's X-User-ID equals Appraisal.engaged_by_user_id or Appraisal.appraiser_user_id"
  - id: ERR_CLOSING_REVIEW_SOD
    http: 403
    condition: "the closing-requirement reviewer's X-User-ID equals ClosingRequirement.submitted_by_user_id"
  - id: ERR_EASEMENT_NOT_COMPLIANT
    http: 409
    condition: "the easement is under a stewardship hold, or its compliance_status is not admissible under the program's amendment_policy (STRICT requires COMPLIANT; CONDITIONAL also admits VIOLATION_CURED)"

  # --- business_temporal ---
  - id: ERR_ROUND_WINDOW_CLOSED
    http: 409
    condition: "an application is filed outside [opens_on, closes_on] or on a round that is not OPEN, or ranking is run before the clock passes closes_on"
  - id: ERR_APPRAISAL_ENGAGEMENT_CONFLICT
    http: 409
    condition: "a new appraisal engagement conflicts with an existing ASSIGNED, SUBMITTED or CERTIFIED engagement on the same application under the buffered closed-interval test"
  - id: ERR_MONITORING_WINDOW_OVERLAP
    http: 409
    condition: "a new monitoring visit's half-open window [window_start, window_end) overlaps that of an existing SCHEDULED visit on the same easement"

  # --- business_constraint ---
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http: 409
    condition: "an offer is issued when Application.negotiation_round_count has already reached PreservationProgram.max_negotiation_rounds"
  - id: ERR_COUNTER_NOT_HIGHER
    http: 409
    condition: "a counter is not strictly greater than Application.current_offer_cents, or arrives after current_offer_expires_on"
  - id: ERR_PARCEL_NOT_ELIGIBLE
    http: 409
    condition: "the parcel is not in status ELIGIBLE, or its restricted_value_cents is not strictly less than its unrestricted_value_cents"
  - id: ERR_SURVEY_ACREAGE_MISMATCH
    http: 409
    condition: "a BOUNDARY_SURVEY submission's surveyed_acres differs from Parcel.acres by more than 0.50 acres"
  - id: ERR_LIENHOLDER_REQUIRED
    http: 409
    condition: "a MORTGAGE_SUBORDINATION submission omits lienholder_name or names a party other than Parcel.mortgage_lienholder_name, or a non-subordination submission supplies lienholder_name"
  - id: ERR_TITLE_EXCEPTIONS_OUTSTANDING
    http: 409
    condition: "a TITLE_COMMITMENT requirement is accepted while exception_count > 0"
  - id: ERR_REQUIREMENT_NOT_WAIVABLE
    http: 409
    condition: "a waiver is attempted on a requirement whose requirement_type is not BOUNDARY_SURVEY"
  - id: ERR_RESIDENTIAL_RIGHTS_OVERDRAWN
    http: 409
    condition: "residential_rights_retained at closing exceeds Parcel.baseline_dwelling_rights, or a RESIDENTIAL_RIGHT_RELOCATION would drive residential_rights_retained below zero"
  - id: ERR_IMPERVIOUS_ALLOWANCE_EXCEEDED
    http: 409
    condition: "an impervious-use request would push impervious_used_sqft above impervious_allowance_sqft, or an IMPERVIOUS_INCREASE amendment does not request more than the current allowance"
  - id: ERR_NO_NET_CONSERVATION_BENEFIT
    http: 409
    condition: "an amendment decision of APPROVE is attempted while net_conservation_benefit_cents <= 0, or an amendment would grant subdivision rights"
  - id: ERR_NO_SCORED_APPLICATIONS
    http: 409
    condition: "ranking is run on a round with no Application in status RECEIVED"

  # --- business_referential ---
  - id: ERR_VISIT_EASEMENT_MISMATCH
    http: 409
    condition: "POST /violations supplies a monitoring_visit_id whose visit belongs to a different easement than the body easement_id"
  - id: ERR_REQUIREMENT_SCOPE_MISMATCH
    http: 409
    condition: "a closing action references a requirement belonging to a different application, or protected_acres at closing does not match the accepted BOUNDARY_SURVEY's surveyed_acres (or Parcel.acres when waived)"
  - id: ERR_EASEMENT_SCOPE_MISMATCH
    http: 409
    condition: "an easement's parcel_id does not match its application's parcel_id, or an easement is acted upon under a program other than the one that recorded it"

  # --- business_fiscal ---
  - id: ERR_REQUESTED_PRICE_ABOVE_PRELIMINARY_CEILING
    http: 409
    condition: "requested_price_cents exceeds round_half_up(preliminary_easement_value_cents * 1.10)"
  - id: ERR_OFFER_EXCEEDS_CERTIFIED_VALUE
    http: 409
    condition: "an offer or counter exceeds Application.certified_easement_value_cents, or an offer is issued with no CERTIFIED appraisal on the application"
  - id: ERR_FUNDING_PLAN_INCOMPLETE
    http: 409
    condition: "acceptance is attempted while funding_plan_status != FUNDED or funded_cost_cents != total_program_cost_cents"
  - id: ERR_FUNDING_PLAN_STALE
    http: 409
    condition: "closing is attempted while funding_plan_status != OBLIGATED because commitments have lapsed or been released"
  - id: ERR_FUNDING_SHORTFALL
    http: 409
    condition: "the waterfall cannot cover total_program_cost_cents from eligible ACTIVE sources whose obligation window contains target_closing_date"
  - id: ERR_FEDERAL_SHARE_EXCEEDED
    http: 409
    condition: "the assembled federal total exceeds floor(total_program_cost_cents * program.federal_max_share_pct)"
  - id: ERR_LOCAL_MATCH_SHORTFALL
    http: 409
    condition: "the assembled local total is below ceil(total_program_cost_cents * program.local_match_min_pct)"
  - id: ERR_MATCH_RATIO_UNSATISFIED
    http: 409
    condition: "for a swept source with requires_match, the non-federal total is below round_half_up(federal_total * match_ratio)"
  - id: ERR_SOURCE_WINDOW_CAPACITY_EXCEEDED
    http: 409
    condition: "a commitment would take more than a source's available_cents, or a source's OBLIGATED plus DISBURSED total would exceed authorized_cents"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix (role_model: segregation_of_duties)
# -----------------------------------------------------------------------------
roles:

  - name: ProgramAdmin
    description: "Program authority: configures the program, rounds and funding sources; assembles funding plans; reviews closing requirements; records easements; decides amendments."
    identity: "opaque"
    exclusive_operations:
      - "POST /preservation-programs"
      - "POST /funding-rounds"
      - "POST /funding-rounds/{id}/opening"
      - "POST /funding-rounds/{id}/rank"
      - "POST /landowners"
      - "PATCH /parcels/{id}"
      - "POST /applications/{id}/funding-plan"
      - "POST /applications/{id}/closing"
      - "POST /applications/{id}/closing-cancellation"
      - "POST /funding-sources"
      - "POST /funding-sources/{id}/suspension"
      - "POST /closing-requirements/{id}/review"
      - "POST /closing-requirements/{id}/waiver"
      - "POST /easements/{id}/amendments"
      - "POST /amendments/{id}/submission"
      - "POST /amendments/{id}/decision"
      - "POST /amendments/{id}/reinstatement"
      - "POST /amendments/{id}/rescission"
    shared_operations:
      - "POST /parcels (shared with Landowner)"
      - "POST /easements/{id}/impervious-requests (shared with StewardshipMonitor)"
      - "POST /violations (shared with StewardshipMonitor)"
      - "POST /stewardship-sweeps (shared with StewardshipMonitor)"
      - "POST /_clock/set_current_utc (shared with every role)"
      - "every GET in §1.5"
    note: "cannot review an appraisal (that is the AppraisalReviewer's exclusive act) and cannot accept a closing requirement it submitted itself — ERR_CLOSING_REVIEW_SOD"

  - name: Landowner
    description: "The applicant landowner: registers parcels, files applications, counters offers, accepts offers and withdraws."
    identity: "entity_backed:Landowner"
    exclusive_operations:
      - "POST /applications"
      - "POST /applications/{id}/counters"
      - "POST /applications/{id}/withdrawal"
    shared_operations:
      - "POST /parcels (shared with ProgramAdmin; must be for own landowner_id)"
      - "POST /applications/{id}/acceptance (shared with AcquisitionOfficer; the Landowner may accept only from OFFER_ISSUED)"
      - "POST /_clock/set_current_utc (shared with every role)"
      - "read access to its own programs, rounds, parcels, applications, negotiation rounds, closing requirements, easements, visits, violations and amendments"
    note: "X-User-ID must equal the Landowner.id owning the parcel or application, else ERR_NOT_RESOURCE_OWNER"

  - name: AcquisitionOfficer
    description: "Negotiator: engages appraisers, issues offers, accepts landowner counters, and submits closing requirement packages."
    identity: "opaque"
    exclusive_operations:
      - "POST /applications/{id}/offers"
      - "POST /applications/{id}/appraisals"
      - "POST /closing-requirements/{id}/submission"
    shared_operations:
      - "POST /applications/{id}/acceptance (shared with Landowner; the officer may accept only from COUNTERED)"
      - "POST /_clock/set_current_utc (shared with every role)"
      - "read access to programs, rounds, parcels, applications, appraisals, funding sources, commitments, closing requirements and easements"
    note: "cannot review the appraisals it engaged (ERR_APPRAISAL_REVIEW_SOD) and cannot accept the closing requirements it submitted (ERR_CLOSING_REVIEW_SOD)"

  - name: AppraisalReviewer
    description: "Independent reviewer who certifies or rejects submitted appraisals."
    identity: "opaque"
    exclusive_operations:
      - "POST /appraisals/{id}/review"
    shared_operations:
      - "POST /_clock/set_current_utc (shared with every role)"
      - "read access to programs, parcels, applications and appraisals"
    note: "the reviewer's X-User-ID must differ from both Appraisal.engaged_by_user_id and Appraisal.appraiser_user_id"

  - name: Appraiser
    description: "Engaged valuation professional who submits the unrestricted and restricted values."
    identity: "opaque"
    exclusive_operations:
      - "POST /appraisals/{id}/submission"
    shared_operations:
      - "POST /_clock/set_current_utc (shared with every role)"
      - "read access to the appraisals it is assigned to"
    note: "ownership is established through Appraisal.appraiser_user_id, not through any persisted Appraiser entity; X-User-ID mismatch yields ERR_NOT_RESOURCE_OWNER"

  - name: StewardshipMonitor
    description: "Stewardship staff: schedules and completes annual monitoring visits, opens violations, accepts cure plans and verifies cures."
    identity: "opaque"
    exclusive_operations:
      - "POST /monitoring-visits"
      - "POST /monitoring-visits/{id}/completion"
      - "POST /monitoring-visits/{id}/cancellation"
      - "POST /violations/{id}/cure-plan"
      - "POST /violations/{id}/cure-verification"
    shared_operations:
      - "POST /violations (shared with ProgramAdmin)"
      - "POST /easements/{id}/impervious-requests (shared with ProgramAdmin)"
      - "POST /stewardship-sweeps (shared with ProgramAdmin)"
      - "POST /_clock/set_current_utc (shared with every role)"
      - "read access to programs, parcels, easements, visits, violations and amendments"
    note: "cannot decide amendments or record easements — those remain ProgramAdmin-exclusive"
