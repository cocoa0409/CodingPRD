          difficulty_instance: non_linear_state_machine / case_status_and_mount_status_are_two_independent_dimensions_of_one_row
          rationale: "Triggered inside the named §1.8 instance, where a mount-advance that skips a rung of the mount dimension is refused."

      - name: triggering_invalid_material_state
        claim_type: error_triggerable
        grounds: ["errors.ERR_INVALID_MATERIAL_STATE"]
        excluded_because:
          difficulty_instance: boundary_precision_check / offgassing_verdict_at_the_limit_and_at_exactly_twice_the_limit
          rationale: "Triggered inside the named §1.8 instance, where a conservator decision on a spec that is not in CONSERVATOR_REVIEW is refused."

      - name: triggering_invalid_drawing_state
        claim_type: error_triggerable
        grounds: ["errors.ERR_INVALID_DRAWING_STATE"]
        excluded_because:
          difficulty_instance: compensating_invariant / voiding_an_approved_drawing_returns_every_cent_and_the_five_bucket_identity_never_drifts
          rationale: "Triggered inside the named §1.8 instance, where a second void on an already VOID sheet is refused."

      - name: triggering_invalid_window_state
        claim_type: error_triggerable
        grounds: ["errors.ERR_INVALID_WINDOW_STATE"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / mount_installation_reads_an_install_window_on_the_cases_own_zone
          rationale: "Triggered inside the named §1.8 instance, where a window that is not IN_PROGRESS cannot carry the mount installation."

      - name: triggering_project_frozen_conservation
        claim_type: error_triggerable
        grounds: ["errors.ERR_PROJECT_FROZEN_CONSERVATION"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / conservation_freeze_outranks_the_fabrication_budget_check
          rationale: "Triggered inside the named §1.8 instance, where every fabrication write is refused while a case sits in CONSERVATION_REJECTED."

      - name: triggering_accessibility_requirements_unmet
        claim_type: error_triggerable
        grounds: ["errors.ERR_ACCESSIBILITY_REQUIREMENTS_UNMET"]
        excluded_because:
          difficulty_instance: boundary_precision_check / flow_score_sixty_point_zero_passes_and_fifty_nine_point_four_nine_does_not
          rationale: "Triggered inside the named §1.8 instance, where a design package one hundredth below the minimum flow score is refused."

      - name: triggering_artifact_already_placed
        claim_type: error_triggerable
        grounds: ["errors.ERR_ARTIFACT_ALREADY_PLACED"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / case_state_outranks_artifact_already_placed_on_the_same_request
          rationale: "Triggered inside the named §1.8 instance, where the second placement of an object that already sits in another case is refused."

      - name: triggering_artifact_condition_unstable
        claim_type: error_triggerable
        grounds: ["errors.ERR_ARTIFACT_CONDITION_UNSTABLE"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / condition_beats_security_which_beats_the_environmental_envelope_on_one_placement
          rationale: "Triggered inside the named §1.8 instance, where an UNSTABLE object is refused at the top of the placement ladder."

      - name: triggering_security_tier_insufficient
        claim_type: error_triggerable
        grounds: ["errors.ERR_SECURITY_TIER_INSUFFICIENT"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / condition_beats_security_which_beats_the_environmental_envelope_on_one_placement
          rationale: "Triggered inside the named §1.8 instance, where a HIGH_VALUE object is refused by an ENHANCED case at the middle rung."

      - name: triggering_env_envelope_infeasible
        claim_type: error_triggerable
        grounds: ["errors.ERR_ENV_ENVELOPE_INFEASIBLE"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / condition_beats_security_which_beats_the_environmental_envelope_on_one_placement
          rationale: "Triggered inside the named §1.8 instance, where the placement that would empty the relative-humidity band is refused at the bottom rung."

      - name: triggering_case_has_no_artifacts
        claim_type: error_triggerable
        grounds: ["errors.ERR_CASE_HAS_NO_ARTIFACTS"]
        excluded_because:
          difficulty_instance: compensating_invariant / withdrawing_a_placement_relaxes_the_envelope_back_to_the_exact_prior_bounds
          rationale: "Triggered inside the named §1.8 instance, where a case emptied by a withdrawal can no longer be submitted for conservation review."

      - name: triggering_offgassing_limit_exceeded
        claim_type: error_triggerable
        grounds: ["errors.ERR_OFFGASSING_LIMIT_EXCEEDED"]
        excluded_because:
          difficulty_instance: boundary_precision_check / offgassing_verdict_at_the_limit_and_at_exactly_twice_the_limit
          rationale: "Triggered inside the named §1.8 instance, where an approval of a spec whose derived verdict is UNSAFE is refused."

      - name: triggering_material_not_conservation_approved
        claim_type: error_triggerable
        grounds: ["errors.ERR_MATERIAL_NOT_CONSERVATION_APPROVED"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / the_drawing_decision_branch_is_selected_by_the_material_specs_status
          rationale: "Triggered inside the named §1.8 instance, where a sheet naming a spec that is still under review cannot be approved."

      - name: triggering_prototype_not_approved
        claim_type: error_triggerable
        grounds: ["errors.ERR_PROTOTYPE_NOT_APPROVED"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / an_interactives_shop_drawing_is_gated_by_the_prototype_status_of_a_third_entity
          rationale: "Triggered inside the named §1.8 instance, where a sheet whose subject interactive has no approved prototype cannot be approved."

      - name: triggering_warranty_term_too_short
        claim_type: error_triggerable
        grounds: ["errors.ERR_WARRANTY_TERM_TOO_SHORT"]
        excluded_because:
          difficulty_instance: dual_variant_calc / verified_index_can_degrade_the_tier_and_raise_the_required_warranty
          rationale: "Triggered inside the named §1.8 instance, where commissioning is refused once the degraded tier raises the warranty minimum above the quoted term."

      - name: triggering_mount_not_installed
        claim_type: error_triggerable
        grounds: ["errors.ERR_MOUNT_NOT_INSTALLED"]
        excluded_because:
          difficulty_instance: transitive_cascade / window_completion_cascades_to_zone_occupancy_and_only_that_zones_artifacts
          rationale: "Triggered inside the named §1.8 instance, where completing the window is refused while the mount dimension is short of MOUNT_INSTALLED."

      - name: triggering_zone_case_slots_exhausted
        claim_type: error_triggerable
        grounds: ["errors.ERR_ZONE_CASE_SLOTS_EXHAUSTED"]
        excluded_because:
          difficulty_instance: compensating_invariant / the_zone_slot_identity_survives_an_approve_void_reapprove_cycle_with_no_drift
          rationale: "Triggered inside the named §1.8 instance, where the case create that would exceed the zone slot capacity is refused."

      - name: triggering_fabrication_budget_exceeded
        claim_type: error_triggerable
        grounds: ["errors.ERR_FABRICATION_BUDGET_EXCEEDED"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / conservation_freeze_outranks_the_fabrication_budget_check
          rationale: "Triggered inside the named §1.8 instance, where a sheet whose actual cost exceeds the uncommitted balance is refused."

  - section: rbac
    instances:
      - name: every_role_can_drive_its_own_exclusive_operations_end_to_end
        claim_type: exclusive_operations
        grounds:
          - roles.ProjectManager
          - roles.Curator
          - roles.Conservator
          - roles.FabricationLead
          - roles.MuseumOperations
          - roles.AccessibilitySpecialist
        distinguishing_aspect: |
          A single commission is walked from INTERPRETIVE to FABRICATION using nothing
          but each role's own exclusive operations, so an implementation that hard-wires
          one privileged role - or that forgets one role's grant - cannot finish the
          walk. It also pins the two structural oddities of this role matrix:
          AccessibilitySpecialist has an EMPTY exclusive_operations list, so its whole
          authority is the shared design-package authorship and its panel vote, and
          ProjectManager may cast a panel vote on a package it did not author, because
          the segregation-of-duties rule compares the opaque X-User-ID against
          package.submitted_by_user_id rather than comparing roles. The
          MuseumOperations exclusive start and complete actions need phase
          INSTALLATION and are asserted by the §1.8 transitive-cascade instances; the
          window decision is asserted here.
        test_recipe:
          setup:
            - "a fresh project created by ProjectManager pm-01, phase INTERPRETIVE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "SCHEMATIC" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { ph1: $.data.phase }
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: AccessibilitySpecialist
              as_user_id: acc-01
              captures: { av: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${av}", stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: AccessibilitySpecialist
              as_user_id: acc-01
              captures: { pkgA: $.data.id, pkgAst: $.data.status, pkgAsub: $.data.submitted_by_user_id }
            - call: "POST /design-packages/${pkgA}/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "ProjectManager", "AccessibilitySpecialist", "FabricationLead"], decision_deadline_at: "2026-08-20T00:00:00Z" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { rndA: $.data.id, reqA: $.data.required_vote_count }
            - call: "POST /review-rounds/${rndA}/votes"
              payload: { decision: "APPROVE" }
              as: Curator
              as_user_id: cur-01
            - call: "POST /review-rounds/${rndA}/votes"
              payload: { decision: "APPROVE" }
              as: Conservator
              as_user_id: con-01
            - call: "POST /review-rounds/${rndA}/votes"
              payload: { decision: "APPROVE" }
              as: FabricationLead
              as_user_id: fab-01
            - call: "POST /review-rounds/${rndA}/votes"
              payload: { decision: "APPROVE" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { rndAst: $.data.status, castA: $.data.cast_vote_count }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "DESIGN_DEV" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { ph2: $.data.phase }
            - call: "POST /exhibit-projects/${proj}/artifacts"
              payload: { accession_number: "2019.14.3", material_class: "PAPER", required_rh_min_pct: 45.0, required_rh_max_pct: 55.0, max_lux: 50.0, security_class: "ENHANCED", condition_status: "STABLE" }
              as: Curator
              as_user_id: cur-01
              captures: { artR: $.data.id }
            - call: "POST /exhibit-projects/${proj}/gallery-zones"
              payload: { zone_code: "Z-A", visitor_route_order: 1, max_noise_dba: 85.0, case_slot_capacity: 2, closure_allowed: true }
              as: MuseumOperations
              as_user_id: ops-01
              captures: { zoneR: $.data.id }
            - call: "POST /exhibit-projects/${proj}/artifact-cases"
              payload: { zone_id: "${zoneR}", case_code: "C-01", objective_code: "OBJ-EXTINCTION", security_tier: "ENHANCED", target_rh_pct: 50.0, rh_tolerance_pct: 2.0, target_lux: 50.0, uv_microwatt_per_lumen: 20.0, interior_l_cm: 120.0, interior_w_cm: 60.0, interior_h_cm: 90.0, air_exchanges_per_day: 0.4 }
              as: Curator
              as_user_id: cur-01
              captures: { caseR: $.data.id, caseRv: $.data.version }
            - call: "POST /artifact-cases/${caseR}/placements"
              payload: { expected_case_version: "${caseRv}", artifact_id: "${artR}" }
              as: Curator
              as_user_id: cur-01
            - call: "POST /artifact-cases/${caseR}/submit-for-conservation"
              payload: {}
              as: Curator
              as_user_id: cur-01
            - call: "POST /artifact-cases/${caseR}/conservator-decision"
              payload: { decision: "APPROVE" }
              as: Conservator
              as_user_id: con-01
              captures: { caseRst: $.data.status }
            - call: "POST /exhibit-projects/${proj}/interactives"
              payload: { code: "INT-STRATA", kind: "TOUCHSCREEN", objective_code: "OBJ-STRATA", expected_daily_uses: 150, duty_hours_per_day: 6.0, mtbf_cycles: 1200000, parts_availability_years: 10, warranty_months: 24 }
              as: Curator
              as_user_id: cur-01
              captures: { intR: $.data.id, intRsub: $.data.submitted_by_user_id }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "FABRICATION" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { ph3: $.data.phase }
            - call: "POST /interactives/${intR}/submit-prototype"
              payload: { measured_daily_uses: 60, measured_mtbf_cycles: 1500000 }
              as: FabricationLead
              as_user_id: fab-01
              captures: { intRsub2: $.data.submitted_by_user_id, intRst: $.data.status }
            - call: "POST /interactives/${intR}/prototype-decision"
              payload: { decision: "APPROVE" }
              as: Conservator
              as_user_id: con-01
              captures: { intRst2: $.data.status }
            - call: "POST /interactives/${intR}/mark-fabricated"
              payload: {}
              as: FabricationLead
              as_user_id: fab-01
              captures: { intRst3: $.data.status }
            - call: "POST /exhibit-projects/${proj}/material-specs"
              payload: { material_name: "Powder-coated aluminium housing", used_in: "INTERACTIVE_HOUSING", oddy_test_result: "PASS", voc_mg_per_m2_day: 0.12, formaldehyde_ppm: 0.02, cure_days: 14 }
              as: FabricationLead
              as_user_id: fab-01
              captures: { matR: $.data.id }
            - call: "POST /material-specs/${matR}/submit-for-conservation"
              payload: {}
              as: FabricationLead
              as_user_id: fab-01
            - call: "POST /material-specs/${matR}/conservator-decision"
              payload: { decision: "APPROVE" }
              as: Conservator
              as_user_id: con-01
              captures: { matRst: $.data.status }
            - call: "POST /shop-drawings"
              payload: { project_id: "${proj}", material_spec_id: "${matR}", drawing_number: "SD-901", complexity_tier: "STANDARD", shop_hours: 8.0, material_area_m2: 0.5, finish_grade: "MILL", subject_interactive_id: "${intR}" }
              as: FabricationLead
              as_user_id: fab-01
              captures: { dwgR: $.data.id, dwgRst: $.data.status, dwgRsub: $.data.submitted_by_user_id }
            - call: "POST /install-windows"
              payload: { project_id: "${proj}", zone_id: "${zoneR}", work_class: "QUIET", noise_dba: 50.0, starts_at: "2026-09-10T08:00:00Z", ends_at: "2026-09-10T10:00:00Z" }
              as: FabricationLead
              as_user_id: fab-01
              captures: { winR: $.data.id, winRreq: $.data.requested_by_user_id }
            - call: "POST /install-windows/${winR}/decision"
              payload: { decision: "APPROVE" }
              as: MuseumOperations
              as_user_id: ops-01
              captures: { winRst: $.data.status }
          assert:
            - "${ph1} == SCHEMATIC, ${ph2} == DESIGN_DEV and ${ph3} == FABRICATION - all three advances were driven by ProjectManager, the only role holding advance-phase"
            - "${pkgAst} == DRAFT and ${pkgAsub} == acc-01 - AccessibilitySpecialist has an empty exclusive_operations list yet legitimately authors the design package, and the submitter stamp follows the caller"
            - "${reqA} == 4 == ceil(5 * 2 / 3) and ${castA} == 4 with ${rndAst} == APPROVED - the ProjectManager's own vote is accepted because pm-01 != acc-01, so segregation of duties compares user ids and not roles"
            - "${caseRst} == CONSERVATION_APPROVED - only Conservator can rule on a case, and it did"
            - "${intRsub} == null before any prototype and ${intRsub2} == fab-01 after the submission, with ${intRst} == PROTOTYPE_SUBMITTED - submit-prototype is FabricationLead's alone"
            - "${intRst2} == PROTOTYPE_APPROVED and ${intRst3} == FABRICATED - Conservator shares the prototype decision with ProjectManager, and mark-fabricated is FabricationLead's alone"
            - "${matRst} == APPROVED and ${dwgRst} == SUBMITTED with ${dwgRsub} == fab-01 - only Conservator clears a material and only FabricationLead issues a sheet"
            - "${winRreq} == fab-01 and ${winRst} == APPROVED - only MuseumOperations rules on the gallery calendar"

      - name: each_shared_operation_accepts_either_of_its_declared_roles
        claim_type: shared_operations
        grounds:
          - roles.ProjectManager
          - roles.Curator
          - roles.Conservator
          - roles.MuseumOperations
        distinguishing_aspect: |
          Six operations are declared shared, and the second role of each pair is the
          one an implementation is most likely to drop: ProjectManager on gallery-zone
          registration and artifact-case design, Conservator on placements and on
          material-spec submission, ProjectManager on the material hand-off to
          conservation. Every call in this instance uses the role that is NOT the
          obvious owner of the object, and every call must still succeed and stamp the
          actual caller. It also shows the two authors of a case - the manager who
          designs it and the conservator who fills it - are independent of the two who
          decide it.
        test_recipe:
          setup:
            - "project in DESIGN_DEV with artifact 2019.14.3 registered"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "SCHEMATIC" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj_v2: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${proj_v2}", stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { pkg1: $.data.id }
            - call: "POST /design-packages/${pkg1}/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "ProjectManager"], decision_deadline_at: "2026-08-20T00:00:00Z" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { rnd1: $.data.id }
            - call: "POST /review-rounds/${rnd1}/votes"
              payload: { decision: "APPROVE" }
              as: Curator
              as_user_id: cur-01
            - call: "POST /review-rounds/${rnd1}/votes"
              payload: { decision: "APPROVE" }
              as: Conservator
              as_user_id: con-01
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "DESIGN_DEV" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj_v3: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${proj_v3}", stage: "DESIGN_DEV", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { pkg2: $.data.id }
            - call: "POST /design-packages/${pkg2}/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "ProjectManager"], decision_deadline_at: "2026-08-20T00:00:00Z" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { rnd2: $.data.id }
            - call: "POST /review-rounds/${rnd2}/votes"
              payload: { decision: "APPROVE" }
              as: Curator
              as_user_id: cur-01
            - call: "POST /review-rounds/${rnd2}/votes"
              payload: { decision: "APPROVE" }
              as: Conservator
              as_user_id: con-01
            - call: "POST /exhibit-projects/${proj}/artifacts"
              payload: { accession_number: "2019.14.3", material_class: "PAPER", required_rh_min_pct: 45.0, required_rh_max_pct: 55.0, max_lux: 50.0, security_class: "ENHANCED", condition_status: "STABLE" }
              as: Curator
              as_user_id: cur-01
              captures: { art1: $.data.id }
          trigger:
            - call: "POST /exhibit-projects/${proj}/gallery-zones"
              payload: { zone_code: "Z-A", visitor_route_order: 1, max_noise_dba: 85.0, case_slot_capacity: 4, closure_allowed: true }
              as: ProjectManager
              as_user_id: pm-01
              captures: { zs: $.data.id, zscap: $.data.case_slot_capacity, zsres: $.data.reserved_case_slots }
            - call: "POST /exhibit-projects/${proj}/artifact-cases"
              payload: { zone_id: "${zs}", case_code: "C-01", objective_code: "OBJ-EXTINCTION", security_tier: "ENHANCED", target_rh_pct: 50.0, rh_tolerance_pct: 2.0, target_lux: 50.0, uv_microwatt_per_lumen: 20.0, interior_l_cm: 120.0, interior_w_cm: 60.0, interior_h_cm: 90.0, air_exchanges_per_day: 0.4 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { cs: $.data.id, csv: $.data.version, csst: $.data.status }
            - call: "POST /artifact-cases/${cs}/placements"
              payload: { expected_case_version: "${csv}", artifact_id: "${art1}" }
              as: Conservator
              as_user_id: con-01
              captures: { csp: $.data.placement_status }
            - call: "POST /artifact-cases/${cs}/submit-for-conservation"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { csst2: $.data.status }
            - call: "POST /exhibit-projects/${proj}/material-specs"
              payload: { material_name: "Buffered museum board", used_in: "CASE_INTERIOR", oddy_test_result: "PASS", voc_mg_per_m2_day: 0.04, formaldehyde_ppm: 0.015, cure_days: 25 }
              as: Conservator
              as_user_id: con-01
              captures: { ms: $.data.id, msst: $.data.status, msverd: $.data.verdict }
            - call: "POST /material-specs/${ms}/submit-for-conservation"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { msst2: $.data.status }
            - call: "POST /exhibit-projects/${proj}/interactives"
              payload: { code: "INT-EXT", kind: "AUDIO", objective_code: "OBJ-EXTINCTION", expected_daily_uses: 40, duty_hours_per_day: 4.0, mtbf_cycles: 2000000, parts_availability_years: 10, warranty_months: 24 }
              as: Curator
              as_user_id: cur-01
              captures: { isx: $.data.id, isxst: $.data.status }
            - call: "GET /gallery-zones/${zs}"
              payload: {}
              as: AccessibilitySpecialist
              as_user_id: acc-01
              captures: { zsres2: $.data.reserved_case_slots, zsav2: $.data.available_case_slots }
          assert:
            - "${zscap} == 4 and ${zsres} == 0 - ProjectManager may register a gallery zone even though MuseumOperations owns the calendar"
            - "${csst} == DRAFT - ProjectManager may design a case even though Curator owns the collection"
            - "${csp} == RESERVED - Conservator may reserve an object into the case, sharing the placement authority with Curator"
            - "${csst2} == CONSERVATION_REVIEW - ProjectManager may hand the case to conservation, and the deciding role is still Conservator alone"
            - "${msst} == SUBMITTED and ${msverd} == CONSERVATION_SAFE - Conservator may author a material spec, sharing that authority with FabricationLead"
            - "${msst2} == CONSERVATOR_REVIEW - ProjectManager may push the spec into review even though only Conservator can clear it"
            - "${isxst} == SPECIFIED - Curator may specify an interactive, sharing that authority with FabricationLead"
            - "${zsres2} == 1 and ${zsav2} == 3 - the shared-role writes updated the same derived slot ledger as the owning role's writes would have, and every GET is open to all six roles including AccessibilitySpecialist"

      - name: the_prototype_and_window_decisions_compare_user_ids_not_roles
        claim_type: segregation_of_duties
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES
          - endpoints.POST_/interactives/{id}/prototype-decision
          - endpoints.POST_/install-windows/{id}/decision
        distinguishing_aspect: |
          Two of the four declared segregation pairs are asserted here - prototype
          decision against interactive.submitted_by_user_id and window decision
          against window.requested_by_user_id - and the probe is deliberately
          role-legal every time: the caller always holds a role the endpoint accepts,
          so the only thing that can reject it is the opaque user id. The same fab-01
          identity is presented under two different deciding roles and is refused
          under both, which is only possible if the check reads the id. The contrast
          case is the window cancel action, which carries NO segregation rule at all -
          the requester is explicitly allowed to withdraw its own request - so an
          implementation that blanket-applies the rule to every window action breaks
          the withdrawal path.
