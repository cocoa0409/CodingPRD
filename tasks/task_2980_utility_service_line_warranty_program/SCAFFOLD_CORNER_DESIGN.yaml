          rationale: "§1.8 already builds a claim whose enrollment is SUSPENDED_NONPAY *and* whose cap_status is ANNUAL_CAP_EXHAUSTED and asserts the priority-30 ERR_ENROLLMENT_NOT_ACTIVE rather than the priority-70 ERR_ANNUAL_CAP_EXHAUSTED, then clears the arrears to expose the fiscal error underneath."

      - name: expired_licence_beats_the_missing_certification
        claim_type: priority_conflict
        grounds:
          - validations.contractor-license-current
          - validations.contractor-line-certified
        excluded_because:
          difficulty_instance: contractor_licence_safety_check_outranks_certification_referential_check
          rationale: "§1.8 already dispatches manually to a contractor that is simultaneously past its licence expiry (priority 40) and uncertified for the claim's line type (priority 50) and asserts ERR_CONTRACTOR_LICENSE_EXPIRED, then renews only the licence to reveal ERR_CONTRACTOR_NOT_CERTIFIED."

  # ===========================================================================
  # Section 5 - endpoints
  # ===========================================================================
  - section: endpoints
    instances:

      - name: complaint_escalation_reopens_an_unsubstantiated_closure
        claim_type: action_endpoint
        grounds:
          - endpoints.POST /regulator-complaints/{complaintId}/escalation
          - state_machines.RegulatorComplaint.transitions.CLOSED_UNSUBSTANTIATED_to_ESCALATED
          - validations.complaint-state-precondition
          - calculations.regulator_response_due_at
        distinguishing_aspect: "The escalation endpoint is the only one in the API whose entire job is to UNDO a previous response: it must clear five fields that the response wrote and push Premises.regulator_hold back to true, all while being legal from exactly one of the five complaint statuses. Firing it before the response and again after the escalation brackets that single legal state from both sides, so an implementation that merely sets status ESCALATED leaves the stale disposition and remedy behind and fails."
        test_recipe:
          setup:
            - "One OPEN PUC complaint cites an ACTIVE enrollment (no claim), so its response window is the full 10 days and the premises carries a regulator hold."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000, permit_covered: true, restoration_covered_scope: "BASIC_BACKFILL", cap_reset_basis: "ENROLLMENT_ANNIVERSARY" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Onboarding complete", expected_partner_version: "${partner_v1}" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "12 Alder St", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"] }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_id: $.data.id, premises_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /enrollments"
              payload: { premises_id: "${premises_id}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${premises_v1}" }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /operations/nightly-run"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
            - call: "POST /regulator-complaints"
              payload: { partner_id: "${partner_id}", regulator: "PUC", allegation: "Homeowner says the waiting period was never disclosed.", enrollment_id: "${enrollment_id}" }
              as: RegulatoryAffairs
              as_user_id: "reg-001"
              captures: { complaint_id: $.data.id, c_status_1: $.data.status, c_due: $.data.response_due_at, c_received: $.data.received_at, c_escalations_0: $.data.escalation_count, c_v1: $.data.version }
            - call: "GET /premises/${premises_id}"
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { hold_at_intake: $.data.regulator_hold }
          trigger:
            - call: "POST /regulator-complaints/${complaint_id}/escalation"
              payload: { escalation_note: "The regulator is not satisfied." }
              as: RegulatoryAffairs
              as_user_id: "reg-001"
              captures: { err_too_early: $.data.error_id }
            - call: "POST /regulator-complaints/${complaint_id}/response"
              payload: { response_summary: "Disclosure was mailed with the welcome pack.", disposition: "UNSUBSTANTIATED", remedy_type: "APOLOGY_ONLY", expected_complaint_version: "${c_v1}" }
              as: RegulatoryAffairs
              as_user_id: "reg-001"
              captures: { c_status_2: $.data.status, c_responded: $.data.responded_at, c_disposition: $.data.disposition, c_remedy: $.data.remedy_type, c_overdue_2: $.data.days_overdue, c_v2: $.data.version }
            - call: "GET /premises/${premises_id}"
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { hold_after_close: $.data.regulator_hold }
            - call: "POST /regulator-complaints/${complaint_id}/escalation"
              payload: { escalation_note: "The regulator rejects the finding and demands a fresh response." }
              as: RegulatoryAffairs
              as_user_id: "reg-001"
              captures: { c_status_3: $.data.status, c_escalations_1: $.data.escalation_count, c_responded_3: $.data.responded_at, c_summary_3: $.data.response_summary, c_disposition_3: $.data.disposition, c_remedy_3: $.data.remedy_type, c_amount_3: $.data.remedy_amount_cents, c_v3: $.data.version }
            - call: "GET /premises/${premises_id}"
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { hold_after_escalation: $.data.regulator_hold }
            - call: "POST /regulator-complaints/${complaint_id}/escalation"
              payload: { escalation_note: "Escalating again." }
              as: RegulatoryAffairs
              as_user_id: "reg-001"
              captures: { err_twice: $.data.error_id }
          assert:
            - "${c_status_1} == OPEN, ${c_received} == 2026-09-10T08:00:00.000Z, ${c_due} == 2026-09-20T08:00:00.000Z (RESPONSE_DAYS[PUC] 10, no claim cited so no expedited floor), ${c_escalations_0} == 0, ${c_v1} == 1 and ${hold_at_intake} == true"
            - "${err_too_early} == ERR_INVALID_COMPLAINT_STATE with HTTP 409  # escalation is defined only from CLOSED_UNSUBSTANTIATED; OPEN is refused and version stays 1"
            - "${c_status_2} == CLOSED_UNSUBSTANTIATED, ${c_responded} == 2026-09-10T08:00:00.000Z, ${c_disposition} == UNSUBSTANTIATED, ${c_remedy} == APOLOGY_ONLY, ${c_overdue_2} == 0 and ${c_v2} == 2"
            - "${hold_after_close} == false  # the response recomputes Premises.regulator_hold: no non-closed complaint remains"
            - "${c_status_3} == ESCALATED, ${c_escalations_1} == 1 and ${c_v3} == 3 with HTTP 200"
            - "${c_responded_3} == null, ${c_summary_3} == null, ${c_disposition_3} == null, ${c_remedy_3} == null and ${c_amount_3} == null  # all five response fields are cleared by the escalation"
            - "${hold_after_escalation} == true  # the hold is restored because the complaint cites an enrollment and is non-closed again"
            - "${err_twice} == ERR_INVALID_COMPLAINT_STATE with HTTP 409  # ESCALATED is not CLOSED_UNSUBSTANTIATED, so the action is not idempotent"
            - "GET /regulator-complaints/${complaint_id} reports response_due_at still 2026-09-20T08:00:00.000Z  # the deadline is anchored to received_at and the escalation does not restart it"

