# =============================================================================
# Task 1815 — Sauce & Condiment Co-Packing (sauce co-packer)
# =============================================================================

scenario: |
  1815. Sauce & Condiment Co-Packing (sauce co-packer): customer formula intake
  & scale-up trial, ingredient sourcing (customer vs co-packer supplied), batch
  cook & fill scheduling, pH/water-activity control & process authority letter,
  minimum run & changeover charge, packaging component supply & shortage risk,
  quality hold & disposition responsibility, private-label labeling compliance

domain_name: sauce-condiment-co-packing
api_prefix: /copack

complexity_profile:
  primary_archetype: workflow_orchestration   # formula intake → trial → letter → approval → run → QA disposition
  secondary_archetype: temporal_windowing     # kettle-line & pilot-cell interval booking with changeover buffers
  complexity_layers:
    - optimistic_concurrency        # OCC on Formula.version and PackagingComponent.version
    - cascading_side_effects        # reformulate → letter → runs → components/customer; hold disposition → run → customer
    - dual_variant_calculation      # estimate vs final run charge; letter-deviation vs statutory-margin on holds
    - version_pinning_on_approval   # ProcessAuthorityLetter pins formula_revision; runs pin formula_revision
    - derived_field_reconciliation  # reserved_units / available_units / outstanding_billed_cents kept in sync
  entity_topology: flat             # all collections top-level under /copack; FK references in bodies
  state_machine_shape: cyclic       # Formula revision loop; ProductionRun rework loop; plus branching holds/labels
  relationship_patterns:
    - one_to_many                   # Customer→Formula→(Supplies, Trials, Letters, Labels); Run→Holds
    - cross_aggregate               # Run references Formula, KettleLine, PackagingComponents
  role_model: segregation_of_duties # hold creator may not disposition the same hold; owner-routed disposition
  consistency_model: immediate      # all mutations visible in the same request's response

# =============================================================================
# Table 1: Entity-Relationship Table (11 entities)
# =============================================================================
entities:
  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - { name: brand_name, type: string, source: input, description: "Brand owner name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: default_disposition_owner, type: enum, source: input, default: COPACKER, description: "CUSTOMER | COPACKER — who may disposition this customer's quality holds", constraints: "enum {CUSTOMER, COPACKER}" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum permitted outstanding billed cents", constraints: ">= 0" }
      - { name: outstanding_billed_cents, type: integer, source: computed, description: "Open billing exposure: += estimate on confirm, += (final - prior applied) on complete, -= estimate on cancel of CONFIRMED, -= final on DESTROYED. Starts 0." }

  - name: Formula
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id; owning brand" }
      - { name: product_name, type: string, source: input, description: "Product name, e.g. Ghost Pepper Hot Sauce" }
      - { name: sku_code, type: string, source: input, description: "Customer SKU code" }
      - { name: process_category, type: enum, source: input, description: "ACIDIFIED | LOW_ACID | ACID; ACIDIFIED and LOW_ACID require an ACTIVE process authority letter before approval", constraints: "enum {ACIDIFIED, LOW_ACID, ACID}" }
      - { name: allergen_class, type: enum, source: input, description: "NONE | GLUTEN | SOY | NUT | DAIRY; drives kettle changeover fee and buffer", constraints: "enum {NONE, GLUTEN, SOY, NUT, DAIRY}" }
      - { name: min_run_units, type: integer, source: input, description: "Contractual minimum run size; billed units = max(produced, min_run_units)", constraints: ">= 1" }
      - { name: unit_rate_cents, type: integer, source: input, description: "Co-pack fee per billed unit", constraints: ">= 0" }
      - { name: revision, type: integer, source: system, description: "Formula revision, starts 1; incremented by reformulate; letters and runs pin it" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_TRIAL | TRIAL_PASSED | APPROVED" }

  - name: IngredientSupply
    parent: null
    common_fields: true
    fields:
      - { name: formula_id, type: string, source: input, description: "FK -> Formula.id" }
      - { name: ingredient_name, type: string, source: input, description: "Ingredient name" }
      - { name: sourcing_mode, type: enum, source: input, description: "CUSTOMER_SUPPLIED (consigned, availability-checked) | COPACKER_SUPPLIED (procured by co-packer, costed)", constraints: "enum {CUSTOMER_SUPPLIED, COPACKER_SUPPLIED}" }
      - { name: quantity_per_unit, type: number, source: input, description: "Ingredient units consumed per finished unit", constraints: "> 0" }
      - { name: unit_cost_cents, type: number, source: input, description: "Cost per ingredient unit in cents; required when COPACKER_SUPPLIED; ignored for CUSTOMER_SUPPLIED", constraints: ">= 0" }
      - { name: consigned_units_on_hand, type: number, source: computed, description: "CUSTOMER_SUPPLIED only: += receive quantity; -= quantity_per_unit * planned_units on run confirm; restored on cancel of CONFIRMED. Starts 0." }

  - name: PilotCell
    parent: null
    common_fields: true
    fields:
      - { name: cell_name, type: string, source: input, description: "Pilot plant cell name" }
      - { name: max_batch_units, type: integer, source: input, description: "Maximum trial batch size", constraints: ">= 1" }

  - name: ScaleUpTrial
    parent: null
    common_fields: true
    fields:
      - { name: formula_id, type: string, source: input, description: "FK -> Formula.id" }
      - { name: pilot_cell_id, type: string, source: input, description: "FK -> PilotCell.id" }
      - { name: batch_size_units, type: integer, source: input, description: "Planned trial batch size", constraints: ">= 1 and <= pilot cell max_batch_units" }
      - { name: scheduled_start, type: datetime, source: input, description: "Trial window start (ISO8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Trial window end; must be strictly after scheduled_start" }
      - { name: yield_units, type: integer, source: input, description: "Good units produced; recorded at record-results", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PASSED | FAILED | CANCELLED" }

  - name: ProcessAuthorityLetter
    parent: null
    common_fields: true
    fields:
      - { name: formula_id, type: string, source: input, description: "FK -> Formula.id" }
      - { name: formula_revision, type: integer, source: input, description: "Revision this letter covers; activation requires equality with Formula.revision", constraints: ">= 1" }
      - { name: authority_name, type: string, source: input, description: "Process authority name" }
      - { name: letter_number, type: string, source: input, description: "Letter reference number" }
      - { name: max_ph, type: number, source: input, description: "Scheduled-process maximum pH; deviation iff measured_ph > max_ph", constraints: "0 < max_ph < 4.6 (statutory ceiling)" }
      - { name: max_water_activity, type: number, source: input, description: "Scheduled-process maximum water activity; deviation iff measured_aw >= max_water_activity", constraints: "0 < max_water_activity < 1.0" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACTIVE | SUPERSEDED" }

  - name: KettleLine
    parent: null
    common_fields: true
    fields:
      - { name: line_name, type: string, source: input, description: "Production kettle/fill line name" }
      - { name: capacity_units, type: integer, source: input, description: "Maximum finished units per production run", constraints: ">= 1" }

  - name: PackagingComponent
    parent: null
    common_fields: true
    fields:
      - { name: component_name, type: string, source: input, description: "e.g. 12oz woozy bottle" }
      - { name: component_type, type: enum, source: input, description: "BOTTLE | CAP | LABEL | CASE", constraints: "enum {BOTTLE, CAP, LABEL, CASE}" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Cost per component unit in cents", constraints: ">= 0" }
      - { name: on_hand_units, type: integer, source: system, description: "Physical stock; initialized from initial_on_hand_units at create; adjusted via PUT; decremented by consumption at run complete", constraints: ">= reserved_units at all times" }
      - { name: reserved_units, type: integer, source: computed, description: "Units reserved by CONFIRMED runs; += requirement on confirm; -= requirement on cancel or complete. Starts 0." }
      - { name: available_units, type: integer, source: computed, description: "= on_hand_units - reserved_units" }

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - { name: formula_id, type: string, source: input, description: "FK -> Formula.id" }
      - { name: kettle_line_id, type: string, source: input, description: "FK -> KettleLine.id" }
      - { name: planned_units, type: integer, source: input, description: "Planned finished units", constraints: ">= 1 and <= kettle line capacity_units" }
      - { name: scheduled_start, type: datetime, source: input, description: "Cook & fill window start (ISO8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Window end; strictly after scheduled_start" }
      - { name: packaging_requirements, type: array, source: input, description: "Array of {component_id, quantity_per_unit}; may be empty; drives reservation at confirm and consumption at complete" }
      - { name: formula_revision, type: integer, source: system, description: "Pinned from Formula.revision at creation" }
      - { name: actual_units_produced, type: integer, source: input, description: "Recorded at complete; null until then", constraints: ">= 0" }
      - { name: measured_ph, type: number, source: input, description: "Measured batch pH at complete; null until then" }
      - { name: measured_water_activity, type: number, source: input, description: "Measured batch water activity at complete; null until then" }
      - { name: changeover_fee_cents, type: integer, source: computed, description: "Locked at confirm per changeover_fee calculation; 75000 allergen-switch / 15000 otherwise" }
      - { name: estimated_charge_cents, type: integer, source: computed, description: "Estimate variant of run charge, computed at confirm from planned_units" }
      - { name: final_charge_cents, type: integer, source: computed, description: "Final variant of run charge, computed at each complete from actuals; null until first complete" }
      - { name: status, type: enum, source: system, description: "PLANNED | CONFIRMED | COMPLETED | ON_HOLD | REWORK | RELEASED | CANCELLED | DESTROYED" }

  - name: QualityHold
    parent: null
    common_fields: true
    fields:
      - { name: production_run_id, type: string, source: system, description: "FK -> ProductionRun.id" }
      - { name: reason_category, type: enum, source: input, description: "PH_DEVIATION | AW_DEVIATION | FOREIGN_MATERIAL | LABEL_MISMATCH; auto-holds use PH_DEVIATION or AW_DEVIATION", constraints: "enum {PH_DEVIATION, AW_DEVIATION, FOREIGN_MATERIAL, LABEL_MISMATCH}" }
      - { name: measured_ph, type: number, source: input, description: "pH evidenced for the hold; required when reason_category = PH_DEVIATION; copied from run measurements on auto-hold" }
      - { name: measured_water_activity, type: number, source: input, description: "Water activity evidenced; required when reason_category = AW_DEVIATION; copied on auto-hold" }
      - { name: letter_deviation, type: number, source: computed, description: "PH_DEVIATION: measured_ph - ACTIVE letter.max_ph; AW_DEVIATION: measured_aw - letter.max_water_activity; else null. Positive means over the letter limit. Null when formula has no ACTIVE letter." }
      - { name: statutory_margin, type: number, source: computed, description: "PH_DEVIATION: 4.6 - measured_ph; AW_DEVIATION: 0.85 - measured_aw; else null. Positive means under the statutory ceiling. Null when formula has no ACTIVE letter." }
      - { name: disposition_owner, type: enum, source: computed, description: "CUSTOMER | COPACKER — copied from the run's CustomerAccount.default_disposition_owner at hold creation" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creator; the literal string 'system' for auto-created holds" }
      - { name: disposition, type: enum, source: input, description: "RELEASE | REWORK | DESTROY — set by disposition endpoint", constraints: "enum {RELEASE, REWORK, DESTROY}" }
      - { name: disposition_note, type: string, source: input, description: "Optional disposition rationale" }
      - { name: status, type: enum, source: system, description: "OPEN | DISPOSITIONED" }

  - name: LabelApproval
    parent: null
    common_fields: true
    fields:
      - { name: formula_id, type: string, source: input, description: "FK -> Formula.id" }
      - { name: label_version, type: string, source: input, description: "Customer label version tag, e.g. v1" }
      - { name: brand_display_name, type: string, source: input, description: "Private-label brand display name" }
      - { name: net_quantity_statement, type: string, source: input, description: "Net quantity of contents statement, e.g. 12 fl oz (355 mL)" }
      - { name: allergen_declaration, type: enum, source: input, description: "NONE | GLUTEN | SOY | NUT | DAIRY; submit requires equality with Formula.allergen_class", constraints: "enum {NONE, GLUTEN, SOY, NUT, DAIRY}" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Formula
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: IN_TRIAL
        trigger: POST /copack/scale-up-trials
        actor: OpsAdmin
        preconditions:
          - "Formula must be DRAFT (ERR_FORMULA_NOT_DRAFT)"
        side_effects: []
      - from: IN_TRIAL
        to: TRIAL_PASSED
        trigger: POST /copack/scale-up-trials/{id}/record-results with passed=true
        actor: OpsAdmin
        preconditions:
          - "Trial SCHEDULED; formula must be the trial's formula"
        side_effects: []
        note: "Only for process_category in {ACIDIFIED, LOW_ACID}"
      - from: IN_TRIAL
        to: APPROVED
        trigger: POST /copack/scale-up-trials/{id}/record-results with passed=true
        actor: system
        preconditions:
          - "Formula.process_category == ACID (letter-exempt)"
        side_effects: []
        note: "Auto-approval for letter-exempt categories"
      - from: IN_TRIAL
        to: DRAFT
        trigger: POST /copack/scale-up-trials/{id}/record-results with passed=false, or POST /copack/scale-up-trials/{id}/cancel
        actor: OpsAdmin
        preconditions: []
        side_effects: []
        note: "Revision loop: reformulate in DRAFT, then re-trial"
      - from: TRIAL_PASSED
        to: APPROVED
        trigger: POST /copack/process-authority-letters/{id}/activate
        actor: ProcessAuthority
        preconditions:
          - "Letter SUBMITTED; letter.formula_revision == formula.revision; formula in {TRIAL_PASSED, APPROVED}"
        side_effects: []
      - from: APPROVED
        to: DRAFT
        trigger: POST /copack/formulas/{id}/reformulate
        actor: OpsAdmin | Customer (own)
        preconditions:
          - "Formula must be APPROVED (ERR_FORMULA_NOT_APPROVED)"
        side_effects:
          - "revision += 1"
          - "ACTIVE ProcessAuthorityLetter for this formula -> SUPERSEDED"
          - "All ProductionRuns of this formula in {PLANNED, CONFIRMED} -> CANCELLED"
          - "Each CONFIRMED run so cancelled releases packaging reservations (component.reserved_units -= requirement), restores CUSTOMER_SUPPLIED consigned_units_on_hand (+= quantity_per_unit * planned_units), and refunds the estimate (customer.outstanding_billed_cents -= estimated_charge_cents)"

  - entity: ScaleUpTrial
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: POST /copack/scale-up-trials/{id}/record-results (passed=true)
        actor: OpsAdmin
        preconditions:
          - "Trial must be SCHEDULED (ERR_TRIAL_NOT_SCHEDULED)"
        side_effects:
          - "yield_units recorded"
          - "Formula IN_TRIAL -> TRIAL_PASSED (ACIDIFIED/LOW_ACID) or -> APPROVED (ACID)"
      - from: SCHEDULED
        to: FAILED
        trigger: POST /copack/scale-up-trials/{id}/record-results (passed=false)
        actor: OpsAdmin
        preconditions:
          - "Trial must be SCHEDULED (ERR_TRIAL_NOT_SCHEDULED)"
        side_effects:
          - "Formula IN_TRIAL -> DRAFT"
      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /copack/scale-up-trials/{id}/cancel
        actor: OpsAdmin
        preconditions:
          - "Trial must be SCHEDULED (ERR_TRIAL_NOT_SCHEDULED)"
        side_effects:
          - "Formula IN_TRIAL -> DRAFT"

  - entity: ProcessAuthorityLetter
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: ACTIVE
        trigger: POST /copack/process-authority-letters/{id}/activate
        actor: ProcessAuthority
        preconditions:
          - "Letter must be SUBMITTED (ERR_LETTER_NOT_SUBMITTED)"
          - "Formula.status in {TRIAL_PASSED, APPROVED} (ERR_FORMULA_NOT_TRIAL_PASSED)"
          - "letter.formula_revision == formula.revision (ERR_LETTER_REVISION_STALE)"
        side_effects:
          - "Every other ACTIVE letter for the same formula -> SUPERSEDED"
          - "Formula TRIAL_PASSED -> APPROVED (no-op when already APPROVED)"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: system (another letter for the same formula activates, or the formula is reformulated)
        actor: system
        preconditions: []
        side_effects: []

  - entity: LabelApproval
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /copack/label-approvals/{id}/submit
        actor: OpsAdmin | Customer (own)
        preconditions:
          - "Label must be DRAFT (ERR_LABEL_NOT_DRAFT)"
          - "allergen_declaration == formula.allergen_class (ERR_LABEL_ALLERGEN_MISMATCH)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /copack/label-approvals/{id}/review (approved=true)
        actor: QAReviewer
        preconditions:
          - "Label must be SUBMITTED (ERR_LABEL_NOT_SUBMITTED)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: POST /copack/label-approvals/{id}/review (approved=false)
        actor: QAReviewer
        preconditions:
          - "Label must be SUBMITTED (ERR_LABEL_NOT_SUBMITTED)"
        side_effects: []

  - entity: ProductionRun
    initial_state: PLANNED
    terminal_states: [RELEASED, CANCELLED, DESTROYED]
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: POST /copack/production-runs/{id}/confirm
        actor: OpsAdmin
        preconditions:
          - "Run must be PLANNED (ERR_RUN_NOT_PLANNED)"
          - "Formula must be APPROVED (ERR_FORMULA_NOT_APPROVED)"
          - "Kettle-line interval rule passes (ERR_KETTLE_LINE_CONFLICT)"
          - "Packaging availability: for every requirement line, component.available_units >= quantity_per_unit * planned_units (ERR_PACKAGING_SHORTAGE)"
          - "CUSTOMER_SUPPLIED availability: for every such supply line, consigned_units_on_hand >= quantity_per_unit * planned_units (ERR_INGREDIENT_SHORTAGE)"
          - "Credit: customer.outstanding_billed_cents + estimated_charge_cents <= credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "changeover_fee_cents computed and locked (predecessor selector per changeover_fee calculation)"
          - "estimated_charge_cents computed (estimate variant)"
          - "customer.outstanding_billed_cents += estimated_charge_cents"
          - "For each packaging requirement: component.reserved_units += quantity_per_unit * planned_units"
          - "For each CUSTOMER_SUPPLIED supply: consigned_units_on_hand -= quantity_per_unit * planned_units"
      - from: CONFIRMED
        to: COMPLETED
        trigger: POST /copack/production-runs/{id}/complete
        actor: OpsAdmin
        preconditions:
          - "Run status in {CONFIRMED, REWORK} (ERR_RUN_NOT_COMPLETABLE)"
          - "For each packaging requirement: component.on_hand_units >= quantity_per_unit * actual_units_produced (ERR_PACKAGING_SHORTAGE)"
        side_effects:
          - "actual_units_produced, measured_ph, measured_water_activity recorded"
          - "final_charge_cents computed (final variant; changeover_fee locked from confirm)"
          - "customer.outstanding_billed_cents += (final_charge_cents - previously applied charge), where previously applied = estimated_charge_cents on first complete, prior final_charge_cents on re-complete"
          - "For each packaging requirement: component.reserved_units -= quantity_per_unit * planned_units (first complete only; already 0 on re-complete); component.on_hand_units -= quantity_per_unit * actual_units_produced (every complete)"
          - "Auto-hold: if formula has an ACTIVE letter and (measured_ph > letter.max_ph or measured_water_activity >= letter.max_water_activity), create QualityHold (created_by_user_id='system', reason PH_DEVIATION if pH deviates else AW_DEVIATION) and run -> ON_HOLD instead of COMPLETED"
      - from: REWORK
        to: COMPLETED
        trigger: POST /copack/production-runs/{id}/complete
        actor: OpsAdmin
        preconditions:
          - "Same as CONFIRMED -> COMPLETED"
        side_effects:
          - "Same as CONFIRMED -> COMPLETED (final recompute; billing delta vs prior final; packaging consumed again on new actuals)"
      - from: COMPLETED
        to: ON_HOLD
        trigger: POST /copack/quality-holds (manual) or system auto-hold at complete
        actor: QAReviewer | system
        preconditions:
          - "Run status in {COMPLETED, ON_HOLD} for hold creation (ERR_RUN_NOT_COMPLETED)"
        side_effects: []
      - from: ON_HOLD
        to: COMPLETED
        trigger: POST /copack/quality-holds/{id}/disposition (disposition=RELEASE)
        actor: QAReviewer | Customer (per disposition_owner)
        preconditions:
          - "After this disposition, no other OPEN holds remain on the run"
        side_effects: []
      - from: ON_HOLD
        to: REWORK
        trigger: POST /copack/quality-holds/{id}/disposition (disposition=REWORK)
        actor: QAReviewer | Customer (per disposition_owner)
        preconditions: []
        side_effects: []
      - from: ON_HOLD
        to: DESTROYED
        trigger: POST /copack/quality-holds/{id}/disposition (disposition=DESTROY)
        actor: QAReviewer | Customer (per disposition_owner)
        preconditions: []
        side_effects:
          - "All other OPEN holds on the run -> DISPOSITIONED with disposition=DESTROY (system)"
          - "customer.outstanding_billed_cents -= final_charge_cents (destroyed goods are not billable)"
      - from: PLANNED
        to: CANCELLED
        trigger: POST /copack/production-runs/{id}/cancel or system (formula reformulated)
        actor: OpsAdmin | system
        preconditions:
          - "Run status in {PLANNED, CONFIRMED} (ERR_RUN_NOT_CANCELLABLE)"
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: POST /copack/production-runs/{id}/cancel or system (formula reformulated)
        actor: OpsAdmin | system
        preconditions:
          - "Run status in {PLANNED, CONFIRMED} (ERR_RUN_NOT_CANCELLABLE)"
        side_effects:
          - "For each packaging requirement: component.reserved_units -= quantity_per_unit * planned_units"
          - "For each CUSTOMER_SUPPLIED supply: consigned_units_on_hand += quantity_per_unit * planned_units"
          - "customer.outstanding_billed_cents -= estimated_charge_cents"
      - from: COMPLETED
        to: RELEASED
        trigger: POST /copack/production-runs/{id}/release
        actor: QAReviewer
        preconditions:
          - "Run must be COMPLETED (ERR_RUN_NOT_COMPLETED)"
          - "No OPEN QualityHold references this run (ERR_HOLD_BLOCKS_RELEASE)"
          - "At least one LabelApproval for run.formula_id has status APPROVED (ERR_LABEL_NOT_APPROVED)"
        side_effects: []

  - entity: QualityHold
    initial_state: OPEN
    terminal_states: [DISPOSITIONED]
    transitions:
      - from: OPEN
        to: DISPOSITIONED
        trigger: POST /copack/quality-holds/{id}/disposition
        actor: QAReviewer | Customer (per disposition_owner)
        preconditions:
          - "Hold must be OPEN (ERR_HOLD_NOT_OPEN)"
          - "Owner routing: hold.disposition_owner == CUSTOMER requires actor role Customer and X-User-ID == run's customer_id; COPACKER requires role QAReviewer (ERR_DISPOSITION_OWNER_MISMATCH)"
          - "Segregation of duties: X-User-ID != hold.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Statutory gate for RELEASE and REWORK: if reason_category = PH_DEVIATION, statutory_margin must be > 0; if AW_DEVIATION, statutory_margin must be > 0 (ERR_STATUTORY_DESTROY_REQUIRED)"
        side_effects:
          - "disposition recorded; hold -> DISPOSITIONED"
          - "RELEASE: run ON_HOLD -> COMPLETED when no other OPEN holds remain"
          - "REWORK: run ON_HOLD -> REWORK"
          - "DESTROY: run ON_HOLD -> DESTROYED; all other OPEN holds on the run -> DISPOSITIONED(DESTROY); customer.outstanding_billed_cents -= run.final_charge_cents"

# =============================================================================
# Table 2b: Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: formula-update-stale-version
    parent_entity: Formula
    write_endpoint: PUT /copack/formulas/{id}
    occ_field: expected_formula_version
    description: |
      Updating a DRAFT Formula whose version has advanced since the client last
      observed it is rejected. The client's expected_formula_version no longer
      matches Formula.version, so the update is refused rather than overwriting
      changes the client never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: component-adjust-stale-version
    parent_entity: PackagingComponent
    write_endpoint: PUT /copack/packaging-components/{id}
    occ_field: expected_component_version
    description: |
      Adjusting on_hand_units of a PackagingComponent whose version has advanced
      since the client last observed it is rejected. The client's
      expected_component_version no longer matches PackagingComponent.version,
      so the adjustment is refused rather than overwriting stock changes the
      client never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: estimated_run_charge
    trigger: "POST /copack/production-runs/{id}/confirm"
    algorithm: tiered_pricing
    formula: |
      units_billed = max(run.planned_units, formula.min_run_units)
      base_cents = units_billed * formula.unit_rate_cents
      fee = run.changeover_fee_cents (computed by changeover_fee rule, locked at confirm)
      ingredient_cents = SUM over IngredientSupply lines of the formula with sourcing_mode == COPACKER_SUPPLIED:
                           round_half_up(line.quantity_per_unit * units_billed * line.unit_cost_cents)   # round per line, THEN sum
      packaging_cents  = SUM over run.packaging_requirements:
                           round_half_up(req.quantity_per_unit * units_billed * component.unit_cost_cents)  # round per line, THEN sum
      estimated_charge_cents = base_cents + fee + ingredient_cents + packaging_cents
    input_set: "The run, its formula, all IngredientSupply rows of the formula with sourcing_mode == COPACKER_SUPPLIED, all packaging_requirements lines and their PackagingComponents"
    constants:
      ROUNDING: "round_half_up to whole cents, applied per extended line before summation (never sum-then-round)"
    precision: "0 decimal places (whole cents), round_half_up per line"
    variants:
      - name: estimate
        when: "at confirm"
        difference: "uses planned_units for units_billed and for every extended line"
      - name: final
        when: "at each complete (final_run_charge rule)"
        difference: "units_billed = max(actual_units_produced, min_run_units); packaging lines use actual_units_produced; ingredient lines use units_billed"

  - name: final_run_charge
    trigger: "POST /copack/production-runs/{id}/complete"
    algorithm: tiered_pricing
    formula: |
      units_billed = max(run.actual_units_produced, formula.min_run_units)
      base_cents = units_billed * formula.unit_rate_cents
      fee = run.changeover_fee_cents (locked at confirm; never recomputed)
      ingredient_cents = SUM over COPACKER_SUPPLIED lines: round_half_up(quantity_per_unit * units_billed * unit_cost_cents)
      packaging_cents  = SUM over requirements: round_half_up(quantity_per_unit * actual_units_produced * unit_cost_cents)
      final_charge_cents = base_cents + fee + ingredient_cents + packaging_cents
      customer.outstanding_billed_cents += (final_charge_cents - previously_applied_charge)
    input_set: "Same as estimated_run_charge, plus actual_units_produced from the complete call"
    precision: "0 decimal places (whole cents), round_half_up per line"
    variants:
      - name: final
        when: "at complete / re-complete after REWORK"
        difference: "produces a different value than the estimate whenever actual_units_produced != planned_units"

  - name: changeover_fee
    trigger: "POST /copack/production-runs/{id}/confirm"
    algorithm: weighted_scoring
    formula: |
      predecessor candidates = ProductionRuns R with R.kettle_line_id == run.kettle_line_id,
        R.status IN {CONFIRMED, COMPLETED, ON_HOLD, REWORK, RELEASED}  (PLANNED, CANCELLED, DESTROYED excluded),
        and R.scheduled_end <= run.scheduled_start
      predecessor = candidates ranked by scheduled_end DESC, tie-break created_at DESC, first element
      if predecessor exists and predecessor.formula.allergen_class != run.formula.allergen_class:
        changeover_fee_cents = ALLERGEN_CHANGEOVER_FEE_CENTS
      else:
        changeover_fee_cents = STANDARD_CHANGEOVER_FEE_CENTS
    input_set: "All runs sharing the kettle line in occupancy states, the two formulas' allergen_class"
    constants:
      STANDARD_CHANGEOVER_FEE_CENTS: 15000
      ALLERGEN_CHANGEOVER_FEE_CENTS: 75000
    precision: "whole cents"

  - name: hold_deviation_metrics
    trigger: "QualityHold creation (manual POST /copack/quality-holds or auto-hold at complete)"
    algorithm: threshold
    formula: |
      letter = ACTIVE ProcessAuthorityLetter for run.formula_id (any revision currently ACTIVE); null if none
      if reason_category == PH_DEVIATION and letter != null:
        letter_deviation = measured_ph - letter.max_ph          # > 0 means over the letter limit
        statutory_margin = PH_STATUTORY_CEILING - measured_ph   # > 0 means under the statutory ceiling
      elif reason_category == AW_DEVIATION and letter != null:
        letter_deviation = measured_water_activity - letter.max_water_activity
        statutory_margin = AW_STATUTORY_CEILING - measured_water_activity
      else:
        letter_deviation = null; statutory_margin = null
    input_set: "The hold's measured values, the formula's ACTIVE letter"
    constants:
      PH_STATUTORY_CEILING: 4.6
      AW_STATUTORY_CEILING: 0.85
    precision: "2 decimal places, round_half_up"
    variants:
      - name: letter_deviation
        when: "always computed at hold creation"
        difference: "measures against the formula's contracted scheduled process (letter limits)"
      - name: statutory_margin
        when: "always computed at hold creation"
        difference: "measures against the absolute statutory ceilings 4.6 / 0.85; a batch can be over its letter limit yet still under the statutory ceiling, and the two metrics disagree on both value and sign"

  - name: kettle_line_overlap_check
    trigger: "POST /copack/production-runs/{id}/confirm"
    algorithm: interval_merge
    formula: |
      occupiers = ProductionRuns R with R.kettle_line_id == run.kettle_line_id
        and R.status IN {CONFIRMED, COMPLETED, ON_HOLD, REWORK, RELEASED}
      for each occupier O:
        required_gap_hours = ALLERGEN_CHANGEOVER_BUFFER_HOURS if O.formula.allergen_class != run.formula.allergen_class else STANDARD_GAP_HOURS
        if O.scheduled_end <= run.scheduled_start:
          conflict iff (run.scheduled_start - O.scheduled_end) < required_gap_hours
        elif run.scheduled_end <= O.scheduled_start:
          conflict iff (O.scheduled_start - run.scheduled_end) < required_gap_hours
        else:
          conflict (intervals intersect)
      any conflict -> ERR_KETTLE_LINE_CONFLICT
    constants:
      ALLERGEN_CHANGEOVER_BUFFER_HOURS: 4
      STANDARD_GAP_HOURS: 1
    precision: "hour resolution on ISO8601 timestamps"

  - name: pilot_cell_overlap_check
    trigger: "POST /copack/scale-up-trials"
    algorithm: interval_merge
    formula: |
      occupiers = ScaleUpTrials T with T.pilot_cell_id == trial.pilot_cell_id and T.status == SCHEDULED
      conflict iff NOT (T.scheduled_end <= new.scheduled_start OR new.scheduled_end <= T.scheduled_start)
      i.e. half-open [start, end) semantics with ZERO buffer: touching windows (end == start) are allowed
      any conflict -> ERR_PILOT_CELL_CONFLICT
    precision: "ISO8601 timestamp comparison"

  - name: packaging_availability_check
    trigger: "POST /copack/production-runs/{id}/confirm"
    algorithm: threshold
    formula: |
      for each requirement line: required = quantity_per_unit * planned_units
      available = component.on_hand_units - component.reserved_units
      shortage iff required > available   # required == available is allowed (boundary: >)
      any shortage -> ERR_PACKAGING_SHORTAGE

  - name: credit_limit_check
    trigger: "POST /copack/production-runs/{id}/confirm"
    algorithm: threshold
    formula: |
      breach iff customer.outstanding_billed_cents + estimated_charge_cents > customer.credit_limit_cents
      # equality is allowed (boundary: >)
      breach -> ERR_CREDIT_LIMIT_EXCEEDED

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present; role is a declared role name", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http_status: 400, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "Role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: auth, check: "Ownership: role Customer requires X-User-ID == the customer_id of the resource chain (formula.customer_id; run->formula.customer_id; hold->run->formula.customer_id; label/supply/trial/letter via formula)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "endpoints allowing role Customer" }
  - { priority: 4, category: existence, check: "Path ids exist, validated left-to-right; then body FK references (formula_id, kettle_line_id, pilot_cell_id, production_run_id, component_id inside packaging_requirements)", error_id: "ERR_{RESOURCE}_NOT_FOUND", http_status: 404, applies_to: "all endpoints with resource ids" }
  - { priority: 5, category: business_constraint, check: "Request shape: required fields present, types valid, enum membership, quantities > 0 where required, scheduled_end strictly after scheduled_start, unit_cost_cents present when sourcing_mode == COPACKER_SUPPLIED, measured_ph present when reason_category == PH_DEVIATION, measured_water_activity present when AW_DEVIATION, receipts only for CUSTOMER_SUPPLIED lines", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 6, category: state, check: "Target entity status precondition for the operation (formula DRAFT/TRIAL_PASSED/APPROVED gates, trial SCHEDULED, letter SUBMITTED, run PLANNED/CONFIRMED-or-REWORK/COMPLETED/PLANNED-or-CONFIRMED, hold OPEN, label DRAFT/SUBMITTED)", error_id: "ERR_FORMULA_NOT_DRAFT | ERR_FORMULA_NOT_TRIAL_PASSED | ERR_FORMULA_NOT_APPROVED | ERR_TRIAL_NOT_SCHEDULED | ERR_LETTER_NOT_SUBMITTED | ERR_RUN_NOT_PLANNED | ERR_RUN_NOT_COMPLETABLE | ERR_RUN_NOT_COMPLETED | ERR_RUN_NOT_CANCELLABLE | ERR_HOLD_NOT_OPEN | ERR_LABEL_NOT_DRAFT | ERR_LABEL_NOT_SUBMITTED", http_status: 409, applies_to: "state transition endpoints" }
  - { priority: 7, category: business_safety, check: "Statutory destroy gate: RELEASE/REWORK disposition on a PH_DEVIATION or AW_DEVIATION hold requires statutory_margin > 0; letter process limits within statutory bounds", error_id: "ERR_STATUTORY_DESTROY_REQUIRED | ERR_INVALID_PROCESS_LIMITS", http_status: 409, applies_to: "POST /copack/quality-holds/{id}/disposition; POST /copack/process-authority-letters" }
  - { priority: 8, category: business_constraint, check: "Domain constraints: kettle overlap with allergen buffer, pilot-cell overlap (touch-allowed), packaging availability, consigned-ingredient availability, capacity limits, label allergen declaration match, disposition owner routing, segregation of duties, on_hand_units >= reserved_units on stock adjustment", error_id: "ERR_KETTLE_LINE_CONFLICT | ERR_PILOT_CELL_CONFLICT | ERR_PACKAGING_SHORTAGE | ERR_INGREDIENT_SHORTAGE | ERR_BATCH_EXCEEDS_CAPACITY | ERR_LABEL_ALLERGEN_MISMATCH | ERR_DISPOSITION_OWNER_MISMATCH | ERR_SEGREGATION_OF_DUTIES | ERR_STOCK_BELOW_RESERVED", http_status: 409, applies_to: "confirm, trial create, complete, label submit, hold disposition, component PUT" }
  - { priority: 9, category: business_referential, check: "Letter activation: letter.formula_revision == formula.revision", error_id: ERR_LETTER_REVISION_STALE, http_status: 409, applies_to: "POST /copack/process-authority-letters/{id}/activate" }
  - { priority: 10, category: business_fiscal, check: "Credit: outstanding_billed_cents + estimated_charge_cents <= credit_limit_cents", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 402, applies_to: "POST /copack/production-runs/{id}/confirm" }

# =============================================================================
# Table 5: API Endpoint Table (43 endpoints)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- CustomerAccount ---
  - { method: POST, path: "/copack/customers", description: "Create a customer (brand owner) account", roles: [OpsAdmin], code: 201, input: [brand_name, contact_email, credit_limit_cents, "default_disposition_owner?"], output: CustomerAccount, side_effects: ["outstanding_billed_cents initialized to 0"] }
  - { method: GET, path: "/copack/customers/{id}", description: "Get a customer account", roles: [OpsAdmin, QAReviewer, Customer], code: 200, input: [], output: CustomerAccount, side_effects: [] }

  # --- Formula ---
  - { method: POST, path: "/copack/formulas", description: "Customer formula intake; created in DRAFT with revision 1. Role Customer must pass customer_id == X-User-ID.", roles: [OpsAdmin, Customer], code: 201, input: [customer_id, product_name, sku_code, process_category, allergen_class, min_run_units, unit_rate_cents], output: Formula, side_effects: ["status DRAFT, revision 1"] }
  - { method: GET, path: "/copack/formulas", description: "List formulas; role Customer sees only own. Ordered created_at ASC.", roles: [OpsAdmin, QAReviewer, Customer], code: 200, input: ["customer_id?", "status?", "limit?", "offset?"], output: "Formula[]", side_effects: [] }
  - { method: GET, path: "/copack/formulas/{id}", description: "Get a formula", roles: [OpsAdmin, QAReviewer, Customer], code: 200, input: [], output: Formula, side_effects: [] }
  - { method: PUT, path: "/copack/formulas/{id}", description: "Update a DRAFT formula's spec with OCC. Increments Formula.version.", roles: [OpsAdmin, Customer], code: 200, input: ["product_name?", "process_category?", "allergen_class?", "min_run_units?", "unit_rate_cents?", expected_formula_version], output: Formula, side_effects: ["increments Formula.version by 1"] }
  - { method: POST, path: "/copack/formulas/{id}/reformulate", description: "APPROVED -> DRAFT, revision += 1; supersedes ACTIVE letter; auto-cancels PLANNED/CONFIRMED runs with reservation release, consignment restore, and estimate refund", roles: [OpsAdmin, Customer], code: 200, input: [], output: Formula, side_effects: ["letter SUPERSEDED", "runs CANCELLED with compensation", "increments Formula.version by 1"] }

  # --- IngredientSupply ---
  - { method: POST, path: "/copack/ingredient-supplies", description: "Add an ingredient line to a DRAFT formula", roles: [OpsAdmin, Customer], code: 201, input: [formula_id, ingredient_name, sourcing_mode, quantity_per_unit, "unit_cost_cents?"], output: IngredientSupply, side_effects: ["consigned_units_on_hand initialized to 0"] }
  - { method: GET, path: "/copack/ingredient-supplies", description: "List ingredient supplies, filterable by formula_id. Ordered created_at ASC.", roles: [OpsAdmin, QAReviewer, Customer], code: 200, input: ["formula_id?", "limit?", "offset?"], output: "IngredientSupply[]", side_effects: [] }
  - { method: GET, path: "/copack/ingredient-supplies/{id}", description: "Get an ingredient supply", roles: [OpsAdmin, QAReviewer, Customer], code: 200, input: [], output: IngredientSupply, side_effects: [] }
  - { method: POST, path: "/copack/ingredient-supplies/{id}/receive", description: "Record a consignment receipt for a CUSTOMER_SUPPLIED line; consigned_units_on_hand += quantity", roles: [OpsAdmin, Customer], code: 200, input: [quantity], output: IngredientSupply, side_effects: ["consigned_units_on_hand += quantity", "increments IngredientSupply.version by 1"] }

  # --- PilotCell ---
  - { method: POST, path: "/copack/pilot-cells", description: "Create a pilot plant cell", roles: [OpsAdmin], code: 201, input: [cell_name, max_batch_units], output: PilotCell, side_effects: [] }
  - { method: GET, path: "/copack/pilot-cells/{id}", description: "Get a pilot cell", roles: [OpsAdmin, QAReviewer], code: 200, input: [], output: PilotCell, side_effects: [] }

  # --- ScaleUpTrial ---
  - { method: POST, path: "/copack/scale-up-trials", description: "Schedule a scale-up trial; formula DRAFT -> IN_TRIAL; pilot-cell touch-allowed overlap check; batch_size_units <= cell max", roles: [OpsAdmin], code: 201, input: [formula_id, pilot_cell_id, batch_size_units, scheduled_start, scheduled_end], output: ScaleUpTrial, side_effects: ["Formula DRAFT -> IN_TRIAL"] }
  - { method: GET, path: "/copack/scale-up-trials", description: "List trials, filterable by formula_id and pilot_cell_id. Ordered created_at ASC.", roles: [OpsAdmin, QAReviewer], code: 200, input: ["formula_id?", "pilot_cell_id?", "limit?", "offset?"], output: "ScaleUpTrial[]", side_effects: [] }
  - { method: GET, path: "/copack/scale-up-trials/{id}", description: "Get a trial", roles: [OpsAdmin, QAReviewer], code: 200, input: [], output: ScaleUpTrial, side_effects: [] }
  - { method: POST, path: "/copack/scale-up-trials/{id}/record-results", description: "Record trial outcome; passed=true -> PASSED and formula TRIAL_PASSED (ACIDIFIED/LOW_ACID) or APPROVED (ACID); passed=false -> FAILED and formula back to DRAFT", roles: [OpsAdmin], code: 200, input: [passed, yield_units], output: ScaleUpTrial, side_effects: ["trial PASSED or FAILED", "formula transition per outcome and process_category"] }
  - { method: POST, path: "/copack/scale-up-trials/{id}/cancel", description: "Cancel a SCHEDULED trial; formula returns to DRAFT", roles: [OpsAdmin], code: 200, input: [], output: ScaleUpTrial, side_effects: ["trial CANCELLED", "Formula IN_TRIAL -> DRAFT"] }

  # --- ProcessAuthorityLetter ---
  - { method: POST, path: "/copack/process-authority-letters", description: "Submit a process authority letter for a formula in {TRIAL_PASSED, APPROVED}; max_ph < 4.6 and 0 < max_water_activity < 1.0 enforced", roles: [ProcessAuthority], code: 201, input: [formula_id, formula_revision, authority_name, letter_number, max_ph, max_water_activity], output: ProcessAuthorityLetter, side_effects: ["status SUBMITTED"] }
  - { method: GET, path: "/copack/process-authority-letters", description: "List letters, filterable by formula_id. Ordered created_at ASC.", roles: [OpsAdmin, QAReviewer, ProcessAuthority, Customer], code: 200, input: ["formula_id?", "limit?", "offset?"], output: "ProcessAuthorityLetter[]", side_effects: [] }
  - { method: GET, path: "/copack/process-authority-letters/{id}", description: "Get a letter", roles: [OpsAdmin, QAReviewer, ProcessAuthority, Customer], code: 200, input: [], output: ProcessAuthorityLetter, side_effects: [] }
  - { method: POST, path: "/copack/process-authority-letters/{id}/activate", description: "Activate a SUBMITTED letter; requires revision match; supersedes other ACTIVE letters for the formula; advances TRIAL_PASSED formula to APPROVED", roles: [ProcessAuthority], code: 200, input: [], output: ProcessAuthorityLetter, side_effects: ["letter ACTIVE", "other ACTIVE letters SUPERSEDED", "formula TRIAL_PASSED -> APPROVED"] }

  # --- KettleLine ---
  - { method: POST, path: "/copack/kettle-lines", description: "Create a kettle/fill line", roles: [OpsAdmin], code: 201, input: [line_name, capacity_units], output: KettleLine, side_effects: [] }
  - { method: GET, path: "/copack/kettle-lines/{id}", description: "Get a kettle line", roles: [OpsAdmin, QAReviewer], code: 200, input: [], output: KettleLine, side_effects: [] }

  # --- PackagingComponent ---
  - { method: POST, path: "/copack/packaging-components", description: "Create a packaging component with initial stock", roles: [OpsAdmin], code: 201, input: [component_name, component_type, unit_cost_cents, initial_on_hand_units], output: PackagingComponent, side_effects: ["on_hand_units = initial_on_hand_units; reserved_units = 0"] }
  - { method: GET, path: "/copack/packaging-components/{id}", description: "Get a packaging component", roles: [OpsAdmin, QAReviewer], code: 200, input: [], output: PackagingComponent, side_effects: [] }
  - { method: PUT, path: "/copack/packaging-components/{id}", description: "Adjust on_hand_units with OCC; new on_hand must be >= reserved_units. Increments PackagingComponent.version.", roles: [OpsAdmin], code: 200, input: [on_hand_units, expected_component_version], output: PackagingComponent, side_effects: ["increments PackagingComponent.version by 1"] }

  # --- ProductionRun ---
  - { method: POST, path: "/copack/production-runs", description: "Create a run for a formula in {TRIAL_PASSED, APPROVED}; pins formula_revision; planned_units <= line capacity; end > start", roles: [OpsAdmin], code: 201, input: [formula_id, kettle_line_id, planned_units, scheduled_start, scheduled_end, packaging_requirements], output: ProductionRun, side_effects: ["status PLANNED", "formula_revision pinned"] }
  - { method: GET, path: "/copack/production-runs", description: "List runs, filterable by formula_id, kettle_line_id, status. Ordered created_at ASC.", roles: [OpsAdmin, QAReviewer, Customer], code: 200, input: ["formula_id?", "kettle_line_id?", "status?", "limit?", "offset?"], output: "ProductionRun[]", side_effects: [] }
  - { method: GET, path: "/copack/production-runs/{id}", description: "Get a run", roles: [OpsAdmin, QAReviewer, Customer], code: 200, input: [], output: ProductionRun, side_effects: [] }
  - { method: POST, path: "/copack/production-runs/{id}/confirm", description: "Confirm a PLANNED run: computes and locks changeover fee and estimate, bills estimate, reserves packaging, draws consigned ingredients", roles: [OpsAdmin], code: 200, input: [], output: ProductionRun, side_effects: ["status CONFIRMED", "estimated_charge_cents and changeover_fee_cents computed", "outstanding_billed_cents += estimate", "packaging reserved", "consignments drawn", "increments ProductionRun.version by 1"] }
  - { method: POST, path: "/copack/production-runs/{id}/complete", description: "Complete a CONFIRMED or REWORK run with actuals; computes final charge, adjusts billing, consumes packaging, auto-creates a QualityHold and moves run to ON_HOLD when pH/aw deviate from the ACTIVE letter", roles: [OpsAdmin], code: 200, input: [actual_units_produced, measured_ph, measured_water_activity], output: ProductionRun, side_effects: ["status COMPLETED or ON_HOLD", "final_charge_cents computed", "billing adjusted by delta", "packaging consumed", "auto QualityHold on deviation", "increments ProductionRun.version by 1"] }
  - { method: POST, path: "/copack/production-runs/{id}/release", description: "Release a COMPLETED run with no OPEN holds and at least one APPROVED label for its formula", roles: [QAReviewer], code: 200, input: [], output: ProductionRun, side_effects: ["status RELEASED"] }
  - { method: POST, path: "/copack/production-runs/{id}/cancel", description: "Cancel a PLANNED or CONFIRMED run; CONFIRMED cancellation releases reservations, restores consignments, refunds the estimate", roles: [OpsAdmin], code: 200, input: [], output: ProductionRun, side_effects: ["status CANCELLED", "reservations released", "consignments restored", "estimate refunded", "increments ProductionRun.version by 1"] }

  # --- QualityHold ---
  - { method: POST, path: "/copack/quality-holds", description: "Place a manual quality hold on a COMPLETED or ON_HOLD run; run -> ON_HOLD; deviation metrics and disposition_owner computed", roles: [QAReviewer], code: 201, input: [production_run_id, reason_category, "measured_ph?", "measured_water_activity?"], output: QualityHold, side_effects: ["run -> ON_HOLD", "letter_deviation/statutory_margin computed", "disposition_owner copied from customer default", "created_by_user_id = caller"] }
  - { method: GET, path: "/copack/quality-holds", description: "List holds, filterable by production_run_id and status. Ordered created_at ASC.", roles: [OpsAdmin, QAReviewer, Customer], code: 200, input: ["production_run_id?", "status?", "limit?", "offset?"], output: "QualityHold[]", side_effects: [] }
  - { method: GET, path: "/copack/quality-holds/{id}", description: "Get a hold", roles: [OpsAdmin, QAReviewer, Customer], code: 200, input: [], output: QualityHold, side_effects: [] }
  - { method: POST, path: "/copack/quality-holds/{id}/disposition", description: "Disposition an OPEN hold (RELEASE | REWORK | DESTROY) with owner routing, segregation of duties, and statutory gate; cascades to the run", roles: [QAReviewer, Customer], code: 200, input: [disposition, "disposition_note?"], output: QualityHold, side_effects: ["hold DISPOSITIONED", "run transition per disposition", "DESTROY reverses final billing and dispositions sibling OPEN holds"] }

  # --- LabelApproval ---
  - { method: POST, path: "/copack/label-approvals", description: "Create a private-label approval draft for a formula", roles: [OpsAdmin, Customer], code: 201, input: [formula_id, label_version, brand_display_name, net_quantity_statement, allergen_declaration], output: LabelApproval, side_effects: ["status DRAFT"] }
  - { method: GET, path: "/copack/label-approvals", description: "List label approvals, filterable by formula_id and status. Ordered created_at ASC.", roles: [OpsAdmin, QAReviewer, Customer], code: 200, input: ["formula_id?", "status?", "limit?", "offset?"], output: "LabelApproval[]", side_effects: [] }
  - { method: GET, path: "/copack/label-approvals/{id}", description: "Get a label approval", roles: [OpsAdmin, QAReviewer, Customer], code: 200, input: [], output: LabelApproval, side_effects: [] }
  - { method: POST, path: "/copack/label-approvals/{id}/submit", description: "Submit a DRAFT label; allergen_declaration must equal formula.allergen_class", roles: [OpsAdmin, Customer], code: 200, input: [], output: LabelApproval, side_effects: ["status SUBMITTED"] }
  - { method: POST, path: "/copack/label-approvals/{id}/review", description: "QA review of a SUBMITTED label; approved=true -> APPROVED else REJECTED", roles: [QAReviewer], code: 200, input: [approved, "review_note?"], output: LabelApproval, side_effects: ["status APPROVED or REJECTED"] }

