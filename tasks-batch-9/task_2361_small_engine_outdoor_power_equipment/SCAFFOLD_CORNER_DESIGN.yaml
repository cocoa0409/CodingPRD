            - &a_u1_rework
              call: "POST /engine-units/${u1_id}/rework"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-mika"
            - *a_u1_torque_bad
            - *a_u1_rework
            - *a_u1_torque_bad
            - *a_u1_rework
          assert:
            - "the first rework succeeds: build_state == STAGED, conformance_state == PENDING, rework_count == 1"
            - "the second rework succeeds: rework_count == 2"
            - "the third rework -> 409 ERR_REWORK_LIMIT_EXCEEDED; EngineUnit.${u1_id}.build_state stays ASSEMBLED with conformance_state == NONCONFORMING and rework_count == 2"
            - "ComponentLot.${lot_carb_id}.consumed_qty == 1 and remaining_qty == 799 after three torque records and two loop iterations — the cycle does not re-charge components"
            - "BuildOrder.${bo_id}.staged_quantity == 1 and built_quantity == 0 throughout the loop"

      - name: supplier_inspection_ladder_ledger_sync_after_accepted_streak
        claim_type: ledger_sync
        grounds:
          - calculations.supplier_scorecard
          - calculations.lot_sample_plan
          - entities.Supplier.fields.consecutive_accepted_lots
          - entities.Supplier.fields.incoming_inspection_level
        distinguishing_aspect: |
          Each lot acceptance syncs the supplier ledger, and the ladder it drives changes
          the NEXT lot's sample plan: three consecutive acceptances flip NORMAL -> REDUCED,
          so the fourth 800-piece lot is sampled 16 instead of 40, and five acceptances
          flip REDUCED -> SKIP_LOT, so the sixth lot is sampled 0 and accepted without
          measurement. The streak is a stored counter, not a re-derivation of history.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; supplier SUP-CARB (non-critical CARBURETOR) with no inspection history."
          setup_api_calls:
            - *a_clock
            - *a_sup_carb
            - *a_lot_carb
            - *a_inspect_carb_clean
          trigger:
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_carb_id}", lot_code: "CB-002", lot_quantity: 600 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { lot2_id: $.data.id }
            - call: "POST /component-lots/${lot2_id}/inspect"
              payload: { defects_found: 0 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_carb_id}", lot_code: "CB-003", lot_quantity: 400 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { lot3_id: $.data.id }
            - call: "POST /component-lots/${lot3_id}/inspect"
              payload: { defects_found: 0 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_carb_id}", lot_code: "CB-004", lot_quantity: 800 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { lot4_id: $.data.id }
            - call: "POST /component-lots/${lot4_id}/inspect"
              payload: { defects_found: 0 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_carb_id}", lot_code: "CB-005", lot_quantity: 800 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { lot5_id: $.data.id }
            - call: "POST /component-lots/${lot5_id}/inspect"
              payload: { defects_found: 0 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_carb_id}", lot_code: "CB-006", lot_quantity: 800 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { lot6_id: $.data.id }
            - call: "POST /component-lots/${lot6_id}/inspect"
              payload: { defects_found: 0 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "GET /suppliers/${sup_carb_id}/scorecard"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-mika"
          assert:
            - "sample sizes under NORMAL are 5% of the lot, floor-capped at 8: CB-001 40, CB-002 30, CB-003 20 — with acceptance_number 4, 3 and 2 (floor of 10% of the sample)"
            - "after the third acceptance Supplier.${sup_carb_id}.consecutive_accepted_lots == 3 and incoming_inspection_level == REDUCED"
            - "ComponentLot.${lot4_id}.sample_size == 16 and acceptance_number == 1 — the REDUCED plan (2% of 800, floor 5) applied to the very next lot"
            - "after the fifth acceptance consecutive_accepted_lots == 5 and incoming_inspection_level == SKIP_LOT"
            - "ComponentLot.${lot6_id}.sample_size == 0, acceptance_number == 0, status == ACCEPTED and accepted_qty == 800 — a skipped lot is accepted without measurement"
            - "the scorecard read returns inspected_lot_count == 6, consecutive_accepted_lots == 6, rolling_defect_ppm == 0, scorecard_average_ppm == 0, approval_status == APPROVED, incoming_inspection_level == SKIP_LOT and criticality == STANDARD"

      - name: audit_failure_cascade_down_covered_by_difficulty_design
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: audit_failure_five_level_family_cascade
          rationale: |
            The only parent-to-children cascade in this scaffold is the FAILED line audit:
            family CERTIFIED -> AUDIT_HOLD, platform posture -> RESTRICTED, non-terminal
            build orders -> HELD, their non-terminal units -> QUARANTINED and allocation
            counters reset. The §1.8 instance already walks all five levels end-to-end and
            asserts that terminal children (COMPLETED orders, RELEASED units) are left
            alone, which is exactly the cascade_down claim.

      - name: lot_rejection_cross_entity_effects_covered_by_difficulty_design
        claim_type: cross_entity
        excluded_because:
          difficulty_instance: lot_rejection_supplier_probation_quarantine_cascade
          rationale: |
            The lot -> supplier -> unit chain (a REJECTED lot moving the supplier to
            PROBATION/TIGHTENED and quarantining the units that consumed it) is the
            scaffold's cross-entity side-effect pattern, and the §1.8 instance asserts the
            downstream entity's state and fields at every hop.

      - name: unit_cancel_compensation_covered_by_difficulty_design
        claim_type: compensation
        excluded_because:
          difficulty_instance: component_lot_piece_conservation_across_stage_and_cancel
          rationale: |
            POST /engine-units/{id}/cancel is the declared compensating transition, and the
            §1.8 conservation instance proves every original side effect is reversed with no
            drift (accepted_qty == consumed_qty + remaining_qty holds after stage, cancel and
            re-stage), which subsumes the compensation claim.

      - name: supersession_conditional_cascade_covered_by_difficulty_design
        claim_type: conditional_cascade
        excluded_because:
          difficulty_instance: supersede_backorder_substitution_fill_rate_cascade
          rationale: |
            Supersession only substitutes those requests that are in state BACKORDERED and
            only while the successor's stock covers them — a state-conditioned cascade. The
            §1.8 instance walks the created_at ASC order, the request that stops being
            covered, and the fill-rate recomputation on both parts.

      - name: posture_guarded_release_covered_by_difficulty_design
        claim_type: guarded_transitions
        excluded_because:
          difficulty_instance: build_order_release_gated_by_engine_platform_posture
          rationale: |
            PLANNED -> RELEASED is guarded by a different entity's state (the owning
            family's certification status, projected onto the platform's posture). The §1.8
            cross-entity instance drives the family through every posture value and shows
            release flipping between success and ERR_FAMILY_NOT_CERTIFIED.

      - name: unit_parallel_state_dimensions_covered_by_difficulty_design
        claim_type: state_machine_shape_parallel
        excluded_because:
          difficulty_instance: engine_unit_parallel_build_and_conformance_dimensions
          rationale: |
            EngineUnit is the one entity with two independent state dimensions
            (build_state and conformance_state). The §1.8 instance enumerates the reachable
            combinations and shows each dimension advancing without dragging the other,
            including QUARANTINED arriving from outside while build_state holds still.

  # ===========================================================================
  # 3. From Table 3 (Calculations)
  # ===========================================================================
  - section: calculations
    instances:

      - name: hot_test_rpm_window_and_emission_threshold_correct_result
        claim_type: correct_result
        grounds:
          - calculations.hot_test_conformance
          - entities.EngineUnit.fields.hot_test_emission_threshold
          - entities.EnginePlatform.fields.hot_test_min_rpm
          - entities.EnginePlatform.fields.hot_test_max_rpm
        distinguishing_aspect: |
          The hot-test verdict is a conjunction of two independent gates, and the emission
          gate is derived from the family's certified value rather than its declared limit:
          threshold = round_half_up(5.12 * 1.10, 2) == 5.63. A unit inside both gates is
          CONFORMING, a unit at rpm 3700 fails on speed alone even with a clean emission
          reading, and a unit at the low rpm edge 3200 with emission exactly 5.63 still
          passes — both bounds are inclusive.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; the certified 208SS prelude (certified_emission 5.12 g/kWh, window [3200, 3600] rpm) with order ${bo_id} (planned 6) RELEASED."
          setup_api_calls: &prelude_order
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_dur
            - *a_dur_complete
            - *a_submit
            - *a_certify
            - *a_model
            - *a_safety
            - *a_model_release
            - *a_line
            - *a_sup_carb
            - *a_lot_carb
            - *a_inspect_carb_clean
            - *a_sup_ign
            - *a_lot_ign
            - *a_inspect_ign_clean
            - *a_sup_cast
            - *a_lot_cast
            - *a_inspect_cast_clean
            - *a_mrun
            - *a_mrun_close
            - *a_bo
            - *a_bo_release
          trigger:
            - *a_u1_stage
            - *a_u1_torque
            - *a_u1_hot
            - *a_u2_stage
            - *a_u2_torque
            - call: "POST /engine-units/${u2_id}/hot-test"
              payload: { measured_rpm: 3700, measured_emission_g_per_kwh: 5.60 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - &a_u3_stage
              call: "POST /engine-units"
              payload: { build_order_id: "${bo_id}", machining_run_id: "${mrun_id}", carburetor_lot_id: "${lot_carb_id}", ignition_lot_id: "${lot_ign_id}", serial_number: "SN-0003" }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { u3_id: $.data.id }
            - &a_u3_torque
              call: "POST /engine-units/${u3_id}/torque-record"
              payload: { torque_readings: [{ station: 1, torque_nm: 22.0 }, { station: 2, torque_nm: 22.1 }, { station: 3, torque_nm: 21.9 }, { station: 4, torque_nm: 22.2 }] }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /engine-units/${u3_id}/hot-test"
              payload: { measured_rpm: 3200, measured_emission_g_per_kwh: 5.63 }
              as: QualityEngineer
              as_user_id: "qe-mika"
          assert:
            - "all three units store hot_test_emission_threshold == 5.63 (5.12 * 1.10 rounded half up to 2 decimals), never 8.00 * 1.10"
            - "EngineUnit.${u1_id}: build_state == HOT_TESTED, conformance_state == CONFORMING (3400 rpm inside the window, 5.60 <= 5.63)"
            - "EngineUnit.${u2_id}: build_state == HOT_TESTED, conformance_state == NONCONFORMING — 3700 > 3600 even though the emission reading passes"
            - "EngineUnit.${u3_id}: build_state == HOT_TESTED, conformance_state == CONFORMING — 3200 is the inclusive low edge and 5.63 == threshold passes"
            - "releasing ${u2_id} would answer 409 ERR_UNIT_NONCONFORMING, while ${u1_id} and ${u3_id} are releasable"
            - "BuildOrder.${bo_id}.built_quantity == 0 — a hot test alone never advances the order"

      - name: deviation_sourced_hot_test_uses_the_tightened_multiplier
        claim_type: constants_applied
        grounds:
          - calculations.hot_test_conformance.constants
          - entities.EngineUnit.fields.deviation_sourced
          - state_machines[ComponentLot].transitions[REJECTED->DEVIATION_ACCEPTED]
        distinguishing_aspect: |
          Which of the two declared multipliers applies is decided by the provenance of the
          unit's components, not by anything in the hot-test payload: a unit built from a
          DEVIATION_ACCEPTED lot carries deviation_sourced true and is judged at
          DEVIATION_EMISSION_MULTIPLIER 1.00 (threshold 5.12), so the identical reading of
          5.60 g/kWh that passes on a clean sibling fails here.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; the certified 208SS prelude with order ${bo_id} (planned 6) RELEASED and one clean 800-piece carburetor lot already ACCEPTED."
          setup_api_calls: *prelude_order
          trigger:
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_carb_id}", lot_code: "CB-DEV", lot_quantity: 800 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { lot_dev_id: $.data.id }
            - call: "POST /component-lots/${lot_dev_id}/inspect"
              payload: { defects_found: 5 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /component-lots/${lot_dev_id}/deviation-accept"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-ravi"
            - call: "POST /engine-units"
              payload: { build_order_id: "${bo_id}", machining_run_id: "${mrun_id}", carburetor_lot_id: "${lot_dev_id}", ignition_lot_id: "${lot_ign_id}", serial_number: "SN-0005" }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { u_dev_id: $.data.id }
            - call: "POST /engine-units/${u_dev_id}/torque-record"
              payload: { torque_readings: [{ station: 1, torque_nm: 22.0 }, { station: 2, torque_nm: 22.1 }, { station: 3, torque_nm: 21.9 }, { station: 4, torque_nm: 22.2 }] }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /engine-units/${u_dev_id}/hot-test"
              payload: { measured_rpm: 3400, measured_emission_g_per_kwh: 5.60 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - *a_u1_stage
            - *a_u1_torque
            - *a_u1_hot
          assert:
            - "ComponentLot.${lot_dev_id}: 5 defects in a sample of 40 exceeds acceptance_number 4, so inspect leaves it REJECTED, and deviation-accept moves it to DEVIATION_ACCEPTED with deviation_flag == true"
            - "EngineUnit.${u_dev_id}.deviation_sourced == true and hot_test_emission_threshold == 5.12 (certified 5.12 * 1.00)"
            - "EngineUnit.${u_dev_id}.conformance_state == NONCONFORMING on a 5.60 reading — the same reading that the clean sibling passes"
            - "EngineUnit.${u1_id}.deviation_sourced == false, hot_test_emission_threshold == 5.63, conformance_state == CONFORMING"
            - "Supplier.${sup_carb_id}.approval_status == PROBATION with incoming_inspection_level == TIGHTENED after the rejection (pooled 5 defects in 80 sampled pieces == 62500 ppm > 25000), yet staging remains permitted because only SUSPENDED blocks the line"

      - name: compliance_margin_gate_at_exactly_five_percent
        claim_type: threshold
        grounds:
          - calculations.deterioration_factor_and_certified_emission
          - validations[priority=37]
          - errors[ERR_COMPLIANCE_MARGIN_TOO_LOW]
        distinguishing_aspect: |
          MIN_COMPLIANCE_MARGIN_PCT is an inclusive floor evaluated on ROUNDED
          intermediates: a run ending at 9.50 g/kWh yields df 1.9000, certified 7.60 and a
          margin of exactly 5.00, which certifies; a run ending two hundredths higher
          (9.52) yields df 1.9040, certified 7.62 (7.616 rounded half up) and a margin of
          4.75, which is refused. The failing family stays SUBMITTED — a refused certify is
          not a state change.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z and an empty database; the family limit is 8.00 g/kWh with declared baseline 4.00 and initial emission 5.00 in both arms."
          setup_api_calls:
            - *a_clock
          trigger:
            - call: "POST /certification-families"
              payload: { family_code: "2027-EPA-PASS", model_year: 2027, emission_standard: "EPA_PHASE3", displacement_min_cc: 190, displacement_max_cc: 224, durability_hours: 500, family_emission_limit_g_per_kwh: 8.00, declared_baseline_emission_g_per_kwh: 4.00 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { fam_pass_id: $.data.id, fam_pass_v1: $.data.version }
            - call: "POST /engine-platforms"
              payload: { certification_family_id: "${fam_pass_id}", platform_code: "208PASS", displacement_cc: 208, torque_spec_nm: 22.0, torque_tolerance_pct: 0.05, required_fastener_count: 4, hot_test_min_rpm: 3200, hot_test_max_rpm: 3600 }
              as: PlantAdmin
              captures: { plat_pass_id: $.data.id }
            - call: "POST /durability-tests"
              payload: { certification_family_id: "${fam_pass_id}", engine_platform_id: "${plat_pass_id}", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-24T09:00:00Z", target_hours: 500, initial_emission_g_per_kwh: 5.00, expected_certification_family_version: "${fam_pass_v1}" }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { dur_pass_id: $.data.id }
            - call: "POST /durability-tests/${dur_pass_id}/complete"
              payload: { accumulated_hours: 500, final_emission_g_per_kwh: 9.50 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
            - call: "POST /certification-families/${fam_pass_id}/submit"
              payload: {}
              as: CertificationEngineer
              as_user_id: "ce-hana"
            - call: "POST /certification-families/${fam_pass_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-ravi"
            - call: "POST /certification-families"
              payload: { family_code: "2027-EPA-FAIL", model_year: 2027, emission_standard: "EPA_PHASE3", displacement_min_cc: 190, displacement_max_cc: 224, durability_hours: 500, family_emission_limit_g_per_kwh: 8.00, declared_baseline_emission_g_per_kwh: 4.00 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { fam_fail_id: $.data.id, fam_fail_v1: $.data.version }
            - call: "POST /engine-platforms"
              payload: { certification_family_id: "${fam_fail_id}", platform_code: "208FAIL", displacement_cc: 208, torque_spec_nm: 22.0, torque_tolerance_pct: 0.05, required_fastener_count: 4, hot_test_min_rpm: 3200, hot_test_max_rpm: 3600 }
              as: PlantAdmin
              captures: { plat_fail_id: $.data.id }
            - call: "POST /durability-tests"
              payload: { certification_family_id: "${fam_fail_id}", engine_platform_id: "${plat_fail_id}", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-24T09:00:00Z", target_hours: 500, initial_emission_g_per_kwh: 5.00, expected_certification_family_version: "${fam_fail_v1}" }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { dur_fail_id: $.data.id }
            - call: "POST /durability-tests/${dur_fail_id}/complete"
              payload: { accumulated_hours: 500, final_emission_g_per_kwh: 9.52 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
            - call: "POST /certification-families/${fam_fail_id}/submit"
              payload: {}
              as: CertificationEngineer
              as_user_id: "ce-hana"
            - call: "POST /certification-families/${fam_fail_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-ravi"
          assert:
            - "CertificationFamily.${fam_pass_id}: deterioration_factor == 1.9000, certified_emission_g_per_kwh == 7.60, compliance_margin_pct == 5.00, status == CERTIFIED"
            - "EnginePlatform.${plat_pass_id}.certification_posture == OPEN"
            - "the second certify -> 422 ERR_COMPLIANCE_MARGIN_TOO_LOW"
            - "CertificationFamily.${fam_fail_id}: deterioration_factor == 1.9040 and certified_emission_g_per_kwh == 7.62 (7.616 rounded half up), so compliance_margin_pct == 4.75 < 5.00"
            - "CertificationFamily.${fam_fail_id}.status == SUBMITTED and EnginePlatform.${plat_fail_id}.certification_posture == RESTRICTED — the refused certify changed nothing"

      - name: carry_tier_ceiling_is_inclusive_at_twenty_million_cents
        claim_type: tiered_pricing
        grounds:
          - calculations.build_carry_cost
          - calculations.build_carry_cost.constants
          - entities.BuildOrder.fields.carry_rate
          - entities.BuildOrder.fields.total_committed_cents
        distinguishing_aspect: |
          The tier is chosen by a strict-less-than ladder on build_value_cents, so the
          CARRY_TIER_2_CEILING of 20,000,000 belongs to the LARGE band: a 1000-unit order at
          20,000 cents each lands exactly on the ceiling and is charged 0.0020, while a
          999-unit order one step below stays in the MEDIUM band at 0.0030 and ends up
          committing MORE money in total (21,418,560 against 20,960,000) despite building
          one unit fewer.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; family 2027-EPA-208SS with platform 208SS (certification is not required to CREATE an order)."
            - "A WALK_MOWER model priced at 20,000 cents is released, and two lines of 500 units/week capacity keep the two orders out of each other's way."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
          trigger:
            - call: "POST /product-models"
              payload: { engine_platform_id: "${plat_id}", model_code: "WM-20000", product_line: "WALK_MOWER", channel: "DUAL", blade_brake_type: "BLADE_BRAKE_CLUTCH", operator_presence_type: "BAIL", warranty_months: 36, standard_cost_cents: 20000, msrp_cents: 59900, dealer_share_pct: 0.55, dealer_cap_units: 1000, mass_retail_cap_units: 1000 }
              as: PlantAdmin
              captures: { model_20k_id: $.data.id }
            - call: "POST /safety-certifications"
              payload: { product_model_id: "${model_20k_id}", standard_code: "ANSI_B71_1", blade_stop_time_ms: 2600, opc_stop_time_ms: 900, tested_on: "2026-07-15", expires_on: "2027-07-15" }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
            - call: "POST /product-models/${model_20k_id}/release"
              payload: {}
              as: PlantAdmin
            - call: "POST /assembly-lines"
              payload: { line_code: "L-A", supported_product_lines: ["WALK_MOWER"], weekly_capacity_units: 500 }
              as: PlantAdmin
              captures: { line_a_id: $.data.id }
            - call: "POST /assembly-lines"
              payload: { line_code: "L-B", supported_product_lines: ["WALK_MOWER"], weekly_capacity_units: 500 }
              as: PlantAdmin
              captures: { line_b_id: $.data.id }
            - call: "POST /build-orders"
              payload: { product_model_id: "${model_20k_id}", assembly_line_id: "${line_a_id}", season: "PRE_SEASON", production_week: "2026-09-14", week_span: 2, planned_quantity: 1000 }
              as: ProductionPlanner
              captures: { bo_large_id: $.data.id }
            - call: "POST /build-orders"
              payload: { product_model_id: "${model_20k_id}", assembly_line_id: "${line_b_id}", season: "PRE_SEASON", production_week: "2026-09-14", week_span: 2, planned_quantity: 999 }
              as: ProductionPlanner
              captures: { bo_medium_id: $.data.id }
          assert:
            - "BuildOrder.${bo_large_id}: build_value_cents == 20000000, carry_rate == 0.0020, carry_weeks == 24, carry_cost_cents == 960000, total_committed_cents == 20960000"
            - "BuildOrder.${bo_medium_id}: build_value_cents == 19980000, carry_rate == 0.0030, carry_weeks == 24, carry_cost_cents == 1438560, total_committed_cents == 21418560"
