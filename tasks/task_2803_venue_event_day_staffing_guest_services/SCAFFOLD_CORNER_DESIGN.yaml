      - name: accessibility_in_service_direct_from_requested_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.AccessibilityRequest.REQUESTED_to_CONFIRMED
          - state_machines.AccessibilityRequest.CONFIRMED_to_IN_SERVICE
          - errors[ERR_ACCESS_REQUEST_STATE_INVALID]
          - endpoints[POST /accessibility-requests/{id}/transition]
          - calculations.accessibility_peak_occupancy
        distinguishing_aspect: >-
          The branching AccessibilityRequest machine has no REQUESTED -> IN_SERVICE and no
          REQUESTED -> COMPLETED edge, so both shortcuts are refused with
          ERR_ACCESS_REQUEST_STATE_INVALID and leave peak_committed_units at 0 - the units are only
          committed once the declared REQUESTED -> CONFIRMED step actually runs.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T19:00:00Z."
            - "One IN_PROGRESS Event with an AVAILABLE WHEELCHAIR_ESCORT resource of unit_count 3."
            - "One REQUESTED AccessibilityRequest for 1 unit over [19:30Z, 20:30Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T19:00:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /events"
              payload: { name: "Access Machine Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /accessibility-resources"
              payload: { event_id: "${ev_id}", resource_type: "WHEELCHAIR_ESCORT", zone_code: "Z100", unit_count: 3 }
              as: GuestServicesSupervisor
              captures: { res_1: $.data.id }
            - call: "POST /accessibility-requests"
              payload: { resource_id: "${res_1}", guest_reference: "G-77", window_start: "2026-09-12T19:30:00Z", window_end: "2026-09-12T20:30:00Z", units_requested: 1 }
              as: GuestServicesSupervisor
              captures: { ar_1: $.data.id }
          trigger:
            - call: "POST /accessibility-requests/${ar_1}/transition"
              payload: { target_status: "IN_SERVICE" }
              as: GuestServicesSupervisor
              captures: { err_in_service: $.data.error_id }
            - call: "POST /accessibility-requests/${ar_1}/transition"
              payload: { target_status: "COMPLETED" }
              as: GuestServicesSupervisor
              captures: { err_completed: $.data.error_id }
            - call: "POST /accessibility-requests/${ar_1}/transition"
              payload: { target_status: "CONFIRMED" }
              as: GuestServicesSupervisor
            - call: "POST /accessibility-requests/${ar_1}/transition"
              payload: { target_status: "IN_SERVICE" }
              as: GuestServicesSupervisor
          assert:
            - "${err_in_service} == 'ERR_ACCESS_REQUEST_STATE_INVALID' with HTTP 409"
            - "${err_completed} == 'ERR_ACCESS_REQUEST_STATE_INVALID' with HTTP 409"
            - "after the two refusals AccessibilityRequest.${ar_1}.status == REQUESTED with confirmed_at and service_started_at both null"
            - "after the two refusals AccessibilityResource.${res_1}.peak_committed_units == 0"
            - "the CONFIRMED call returns 200 with confirmed_at == '2026-09-12T19:00:00Z' and AccessibilityResource.${res_1}.peak_committed_units == 1"
            - "the following IN_SERVICE call returns 200 with service_started_at == '2026-09-12T19:00:00Z', status IN_SERVICE and peak_committed_units still 1"

      - name: position_slot_fill_and_release_loop_returns_to_open
        claim_type: idempotency
        grounds:
          - state_machines.PositionSlot
          - complexity_profile.state_machine_shape[cyclic]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / position_slot_fill_release_cycle"
          rationale: >-
            The §1.8 instance already drives the slot OPEN -> PARTIALLY_FILLED -> FILLED ->
            PARTIALLY_FILLED -> OPEN loop and asserts that the derived status and filled_headcount
            return to their starting values, which is the whole cyclic-shape claim for PositionSlot.

      - name: guest_issue_resolve_reopen_loop_terminates
        claim_type: idempotency
        grounds:
          - state_machines.GuestIssue.RESOLVED_to_REOPENED
          - complexity_profile.state_machine_shape[cyclic]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / guest_issue_resolve_reopen_cycle"
          rationale: >-
            The §1.8 instance walks the RESOLVED -> REOPENED -> IN_PROGRESS -> RESOLVED loop twice
            and asserts the third reopen is refused with ERR_REOPEN_LIMIT_REACHED, covering both the
            cyclic loop and its termination condition.

      - name: event_cancellation_cascades_to_plans_slots_assignments_and_bids
        claim_type: side_effect_execution
        grounds:
          - state_machines.Event.PLANNED_to_CANCELLED
        excluded_because:
          difficulty_instance: "transitive_cascade / event_cancel_four_link_cascade"
          rationale: >-
            The §1.8 instance asserts all four cascade links of the cancel transition end-to-end
            (plans VOIDED, slots CLOSED, assignments CANCELLED with payouts VOIDED, bids
            DECLINED_BY_SYSTEM with reason EVENT_CANCELLED), which is the cascade-down claim.

      - name: assignment_release_compensates_the_backfill_request
        claim_type: side_effect_execution
        grounds:
          - state_machines.StaffAssignment.SCHEDULED_to_RELEASED
        excluded_because:
          difficulty_instance: "compensating_invariant / backfill_release_restores_filled_headcount_identity"
          rationale: >-
            The §1.8 instance releases a BACKFILL-sourced assignment and asserts the compensation is
            exact - the BackfillRequest returns FILLED -> OPEN with selected_staff_member_id and
            filled_assignment_id nulled and filled_headcount restored - which is the Compensation
            side-effect pattern for this transition.

      - name: assignment_attendance_and_payout_dimensions_move_independently
        claim_type: valid_transition
        grounds:
          - state_machines.StaffAssignment
          - complexity_profile.state_machine_shape[parallel]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / assignment_attendance_and_payout_dimensions_independent"
          rationale: >-
            The §1.8 instance drives the attendance and payout dimensions across the same rows and
            asserts each combined state, which is exactly the `parallel` shape claim.

      - name: activating_a_second_plan_supersedes_the_incumbent
        claim_type: side_effect_execution
        grounds:
          - state_machines.StaffingPlan.ACTIVE_to_SUPERSEDED
        excluded_because:
          difficulty_instance: "transitive_cascade / plan_supersede_three_link_cascade"
          rationale: >-
            The §1.8 instance asserts the three-link supersede cascade (incumbent plan SUPERSEDED,
            its slots CLOSED, its assignments and bids stood down), covering the cross-entity
            side-effect pattern of this transition.

  # ===================================================================================
  # 3. From Table 3 (Calculations) - §1.3 surface: 13 rules, algorithm types
  #    threshold / aggregation / tiered_pricing / interval_merge / weighted_scoring /
  #    waterfall_allocation, two of them dual-variant
  # ===================================================================================
  - section: calculations
    instances:

      - name: attendance_tier_boundary_at_39999_and_40000
        claim_type: constants_applied
        grounds:
          - calculations.event_attendance_tier
          - calculations.position_slot_required_headcount
          - calculations.staffing_plan_projected_labor_cost
          - entities.Event.attendance_tier
        distinguishing_aspect: >-
          The top tier floor is inclusive, so 39999 is TIER_3 (x1.25) and 40000 is TIER_4 (x1.45),
          and the one-guest difference propagates the whole way down: ratio_derived_headcount 75 vs
          87, base_labor_cost_cents 990000 vs 1148400, surcharge 34650 vs 40194 (both at the 350 bp
          tier because both headcounts exceed 60) and projected_labor_cost_cents 1024650 vs
          1188594.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z."
            - "Two Events differing only in expected_attendance: 39999 and 40000."
            - "One USHER PositionType at 2200 cents/h with attendance_ratio_per_1000 1.5 and min_headcount 4."
            - "One DRAFT FORECAST_BASED plan per event, each carrying one USHER slot over a 360-minute window and no override."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /position-types"
              payload: { code: "USHER", display_name: "Usher", base_hourly_rate_cents: 2200, attendance_ratio_per_1000: 1.5, min_headcount: 4, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /events"
              payload: { name: "Tier Boundary Low", event_date: "2026-09-20T00:00:00Z", doors_open_at: "2026-09-20T13:00:00Z", doors_close_at: "2026-09-20T21:00:00Z", expected_attendance: 39999 }
              as: GuestExperienceDirector
              captures: { ev_low: $.data.id, ev_low_v1: $.data.version, tier_low: $.data.attendance_tier }
            - call: "POST /events"
              payload: { name: "Tier Boundary High", event_date: "2026-09-21T00:00:00Z", doors_open_at: "2026-09-21T13:00:00Z", doors_close_at: "2026-09-21T21:00:00Z", expected_attendance: 40000 }
              as: GuestExperienceDirector
              captures: { ev_high: $.data.id, ev_high_v1: $.data.version, tier_high: $.data.attendance_tier }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_low}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_low: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_high}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_high: $.data.id }
          trigger:
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_low}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-20T14:00:00Z", shift_end: "2026-09-20T20:00:00Z" }
              as: StaffingCoordinator
              captures: { slot_low: $.data.id, hc_low: $.data.required_headcount, cost_low: $.data.slot_labor_cost_cents }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_high}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-21T14:00:00Z", shift_end: "2026-09-21T20:00:00Z" }
              as: StaffingCoordinator
              captures: { slot_high: $.data.id, hc_high: $.data.required_headcount, cost_high: $.data.slot_labor_cost_cents }
            - call: "POST /staffing-plans/${plan_low}/activate"
              payload: { expected_event_version: "${ev_low_v1}" }
              as: StaffingCoordinator
            - call: "POST /staffing-plans/${plan_high}/activate"
              payload: { expected_event_version: "${ev_high_v1}" }
              as: StaffingCoordinator
          assert:
            - "${tier_low} == 'TIER_3' and ${tier_high} == 'TIER_4'"
            - "${hc_low} == 75 - raw 39.999 x 1.5 x 1.25 = 74.998125 quantized to 74.9981 then ceilinged"
            - "${hc_high} == 87 - raw 40.0 x 1.5 x 1.45 = 87.0000 exactly, and the ceiling of an exact integer does not add one"
            - "PositionSlot.${slot_low}.ratio_derived_headcount == 75 and shift_minutes == 360; ${cost_low} == 990000"
            - "PositionSlot.${slot_high}.ratio_derived_headcount == 87 and shift_minutes == 360; ${cost_high} == 1148400"
            - "StaffingPlan.${plan_low}: basis_attendance 39999, basis_attendance_tier TIER_3, total_required_headcount 75, base_labor_cost_cents 990000, accessibility_surcharge_cents 34650, projected_labor_cost_cents 1024650"
            - "StaffingPlan.${plan_high}: basis_attendance 40000, basis_attendance_tier TIER_4, total_required_headcount 87, base_labor_cost_cents 1148400, accessibility_surcharge_cents 40194, projected_labor_cost_cents 1188594"

      - name: slot_min_headcount_floor_beats_the_ratio_result
        claim_type: correct_result
        grounds:
          - calculations.position_slot_required_headcount
          - entities.PositionType.min_headcount
          - entities.PositionSlot.ratio_derived_headcount
        distinguishing_aspect: >-
          Step 3 of the headcount formula is a floor, not a tie-break: at expected_attendance 1000
          the ratio yields raw 1.5000 whose ceiling is 2, but min_headcount 4 overwrites
          ratio_derived_headcount itself (not just required_headcount), so both fields read 4 and the
          slot costs 52800 rather than 26400.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z."
            - "One Event with expected_attendance 1000 (TIER_1, multiplier 1.00)."
            - "One USHER PositionType at 2200 cents/h, attendance_ratio_per_1000 1.5, min_headcount 4."
            - "One DRAFT FORECAST_BASED plan; the slot is created with no required_headcount_override."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /position-types"
              payload: { code: "USHER", display_name: "Usher", base_hourly_rate_cents: 2200, attendance_ratio_per_1000: 1.5, min_headcount: 4, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /events"
              payload: { name: "Small Crowd", event_date: "2026-09-20T00:00:00Z", doors_open_at: "2026-09-20T13:00:00Z", doors_close_at: "2026-09-20T21:00:00Z", expected_attendance: 1000 }
