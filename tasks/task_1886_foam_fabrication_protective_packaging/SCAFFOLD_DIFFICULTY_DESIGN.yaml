            - "error_id != ERR_MACHINE_WINDOW_CONFLICT (temporal, priority 10), though the window also overlaps"

      - name: lock_safety_margin_beats_utilization
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_ILD_SAFETY_MARGIN]
          - errors[ERR_UTILIZATION_INFEASIBLE]
        distinguishing_aspect: |
          Category pair = business_safety vs business_constraint (distinct from
          the state-vs-temporal pair). At lock, the material's ILD (lowered to 100
          by PATCH after submit) fails the safety margin AND the part (200x60 on a
          108x48 sheet) nests to 0 parts; the lock must return
          ERR_ILD_SAFETY_MARGIN (priority 8), not ERR_UTILIZATION_INFEASIBLE (9).
        test_recipe:
          setup:
            - "Material M with ild_lb_25 initially 240; spec (weight 20, drop 48 -> required_ild 240) SUBMITTED"
            - "Material PATCHed down to ild_lb_25 100"
            - "DIE cut program for part 200x60 NESTED with parts_per_sheet == 0; tooling IN_SERVICE"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Widgets", account_tier: "STANDARD" }, as: SalesEngineer, captures: { cust_id: $.data.id } }
            - { call: "POST /api/materials", payload: { foam_family: "PU", density_pcf: 2.0, ild_lb_25: 240, sheet_length_in: 108, sheet_width_in: 48, sheet_thickness_in: 2, cost_per_board_ft_cents: 250, recyclable: true, scrap_credit_per_lb_cents: 12 }, as: PlantManager, captures: { mat_id: $.data.id } }
