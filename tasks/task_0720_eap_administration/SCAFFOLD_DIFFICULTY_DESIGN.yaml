# =============================================================================
# task_0720_eap_administration — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 Difficulty Rules x >= 2 instances each (>= 18 total).
# Standard fixture literals used throughout unless overridden:
#   contract: sessions_per_issue=2, annual_session_cap=10, session_rate_cents=12000,
#             crisis_sla_minutes=15, reporting_min_cohort=2
#   plan:     copay_cents=2000, worklife_referrals_per_year=3
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: claim_provisional_vs_final_diverge_on_budget_proration
        grounds:
          - calculations.claim_provisional_reimbursement
          - calculations.claim_final_reimbursement
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - entities.Claim.fields.final_cents
        distinguishing_aspect: "Claim domain: provisional_cents (12000-2000=10000) is computed at submit while final_cents prorates down to remaining annual_reimbursement_budget_cents (5000), so provisional_cents != final_cents on the same claim."
        test_recipe:
          setup:
            - "Contract C (rate 12000, annual_reimbursement_budget_cents 15000), plan copay 2000."
            - "A prior APPROVED claim (billed 200000, capped to base 12000, copay 2000) has final_cents=10000, leaving remaining budget 5000."
            - "A second completed session has a SUBMITTED claim with billed 15000 => provisional 10000."
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "Acme", sessions_per_issue: 2, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 15000, crisis_sla_minutes: 15, reporting_min_cohort: 2 }
              as: ProgramAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /eap/plans"
              payload: { contract_id: "${c_id}", name: "Std", copay_cents: 2000, worklife_referrals_per_year: 3 }
              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /eap/plans/${plan_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/employees"
              payload: { contract_id: "${c_id}", plan_id: "${plan_id}", full_name: "Empl One", external_ref: "E1" }
              as: ProgramAdmin
              captures: { e_id: $.data.id }
            - call: "POST /eap/providers"
              payload: { full_name: "Dr A", network_status: "IN_NETWORK", specialties: ["STRESS"], accepting: true }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /eap/cases"
              payload: { contract_id: "${c_id}", employee_id: "${e_id}", presenting_issue: "STRESS" }
              as: CareCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /eap/cases/${case_id}/authorize"
              payload: { expected_contract_version: "${c_v}" }
              as: CareCoordinator
            - call: "POST /eap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eap/cases/${case_id}/sessions"
              payload: { provider_id: "${prov_id}", scheduled_for: "2026-03-02T10:00:00Z", duration_minutes: 50 }
              as: CareCoordinator
              captures: { s1_id: $.data.id }
            - call: "POST /eap/cases/${case_id}/sessions"
              payload: { provider_id: "${prov_id}", scheduled_for: "2026-03-03T10:00:00Z", duration_minutes: 50 }
              as: CareCoordinator
              captures: { s2_id: $.data.id }
            - call: "POST /eap/sessions/${s1_id}/status"
              payload: { to_status: "COMPLETED" }
              as: Provider
            - call: "POST /eap/sessions/${s2_id}/status"
              payload: { to_status: "COMPLETED" }
              as: Provider
            - call: "POST /eap/claims"
              payload: { contract_id: "${c_id}", session_id: "${s1_id}", billed_cents: 200000 }
              as: Provider
              captures: { claim1_id: $.data.id }
            - call: "POST /eap/claims/${claim1_id}/review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/claims/${claim1_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/claims"
              payload: { contract_id: "${c_id}", session_id: "${s2_id}", billed_cents: 15000 }
              as: Provider
              captures: { claim2_id: $.data.id, claim2_prov: $.data.provisional_cents }
            - call: "POST /eap/claims/${claim2_id}/review"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /eap/claims/${claim2_id}/approve"
              payload: {}
              as: ProgramAdmin
              captures: { final2: $.data.final_cents }
          assert:
            - "Claim.${claim1_id}.final_cents == 10000"
            - "Claim.${claim2_id}.provisional_cents == 10000"
            - "Claim.${claim2_id}.final_cents == 5000"
            - "Claim.${claim2_id}.final_cents != Claim.${claim2_id}.provisional_cents"

      - name: contract_utilization_committed_vs_verified_diverge
        grounds:
          - calculations.contract_utilization
          - entities.EmployerContract.fields.utilization_rate
          - entities.CounselingSession.fields.status
        distinguishing_aspect: "EmployerContract domain: committed basis counts SCHEDULED+COMPLETED (2/10=0.2) while verified basis counts only COMPLETED (1/10=0.1), so the two bases yield different utilization_rate."
        test_recipe:
          setup:
            - "Contract C with annual_session_cap 10."
            - "Authorized case has two sessions: one COMPLETED, one still SCHEDULED."
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "Beta", sessions_per_issue: 2, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 1000000, crisis_sla_minutes: 15, reporting_min_cohort: 2 }
              as: ProgramAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /eap/plans"
              payload: { contract_id: "${c_id}", name: "Std" }
              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /eap/plans/${plan_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/employees"
              payload: { contract_id: "${c_id}", plan_id: "${plan_id}", full_name: "Empl B", external_ref: "EB1" }
              as: ProgramAdmin
              captures: { e_id: $.data.id }
            - call: "POST /eap/providers"
              payload: { full_name: "Dr B", specialties: ["STRESS"] }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /eap/cases"
              payload: { contract_id: "${c_id}", employee_id: "${e_id}", presenting_issue: "STRESS" }
              as: CareCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /eap/cases/${case_id}/authorize"
              payload: { expected_contract_version: "${c_v}" }
              as: CareCoordinator
            - call: "POST /eap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eap/cases/${case_id}/sessions"
              payload: { provider_id: "${prov_id}", scheduled_for: "2026-03-02T10:00:00Z" }
              as: CareCoordinator
              captures: { s1_id: $.data.id }
            - call: "POST /eap/cases/${case_id}/sessions"
              payload: { provider_id: "${prov_id}", scheduled_for: "2026-03-03T10:00:00Z" }
              as: CareCoordinator
              captures: { s2_id: $.data.id }
            - call: "POST /eap/sessions/${s1_id}/status"
              payload: { to_status: "COMPLETED" }
              as: Provider
          trigger:
            - call: "GET /eap/contracts/${c_id}/utilization?basis=verified"
              payload: {}
              as: ProgramAdmin
              captures: { verified_rate: $.data.utilization_rate }
          assert:
            - "Contract.${c_id}.utilization_rate (committed basis, default GET) == 0.2"
            - "GET /eap/contracts/${c_id}/utilization?basis=verified data.utilization_rate == 0.1"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: provider_selection_least_loaded_with_created_at_tiebreak
        grounds:
          - calculations.provider_selection
          - entities.Provider.fields.active_referral_count
          - state_machines.Referral.REQUESTED_to_ACCEPTED
        distinguishing_aspect: "Mode (a): selection is a >=3-input non-linear filter+rank (accepting AND in-network AND specialty-match, then min active_referral_count, then created_at tie-break) — among two equally-loaded eligible providers the earliest-created wins."
        test_recipe:
          setup:
            - "Two IN_NETWORK accepting providers P1 (created first) and P2 with specialty STRESS, both active_referral_count 0."
            - "One INACTIVE/non-matching provider P3 that must be excluded."
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "Gamma", sessions_per_issue: 2, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /eap/plans"
              payload: { contract_id: "${c_id}", name: "Std", worklife_referrals_per_year: 3 }
              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /eap/plans/${plan_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/employees"
              payload: { contract_id: "${c_id}", plan_id: "${plan_id}", full_name: "Empl G", external_ref: "EG1" }
              as: ProgramAdmin
              captures: { e_id: $.data.id }
            - call: "POST /eap/providers"
              payload: { full_name: "P1", network_status: "IN_NETWORK", specialties: ["STRESS"], accepting: true }
              as: ProgramAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /eap/providers"
              payload: { full_name: "P2", network_status: "IN_NETWORK", specialties: ["STRESS"], accepting: true }
              as: ProgramAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /eap/providers"
              payload: { full_name: "P3", network_status: "OUT_OF_NETWORK", specialties: ["STRESS"], accepting: true }
              as: ProgramAdmin
              captures: { p3_id: $.data.id }
          trigger:
            - call: "POST /eap/referrals"
              payload: { employee_id: "${e_id}", referral_type: "WORKLIFE", required_specialty: "STRESS" }
              as: CareCoordinator
              captures: { ref_id: $.data.id, assigned: $.data.provider_id }
          assert:
            - "Referral.${ref_id}.provider_id == ${p1_id}"
            - "Provider.${p1_id}.active_referral_count == 1"

      - name: claim_final_order_dependent_budget_consumption
        grounds:
          - calculations.claim_final_reimbursement
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - entities.Claim.fields.final_cents
        distinguishing_aspect: "Mode (c): final_cents has a circular-looking dependency (final of a claim depends on the sum of OTHER claims' final_cents, ordered created_at ASC excluding self) — evaluation order is pinned so the second-approved claim sees the first's committed budget."
        test_recipe:
          setup:
            - "Contract budget 120000 (cap 10 * rate 12000). Two completed sessions, two SUBMITTED claims each provisional 70000."
            - "First claim approved consumes 70000; second approve sees remaining 50000."
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "Delta", sessions_per_issue: 2, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 24000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /eap/plans"
              payload: { contract_id: "${c_id}", name: "Std", copay_cents: 0 }
              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /eap/plans/${plan_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/employees"
              payload: { contract_id: "${c_id}", plan_id: "${plan_id}", full_name: "Empl D", external_ref: "ED1" }
              as: ProgramAdmin
              captures: { e_id: $.data.id }
            - call: "POST /eap/providers"
              payload: { full_name: "Dr D", network_status: "IN_NETWORK", specialties: ["STRESS"] }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /eap/cases"
              payload: { contract_id: "${c_id}", employee_id: "${e_id}", presenting_issue: "STRESS" }
              as: CareCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /eap/cases/${case_id}/authorize"
              payload: { expected_contract_version: "${c_v}" }
              as: CareCoordinator
            - call: "POST /eap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eap/cases/${case_id}/sessions"
              payload: { provider_id: "${prov_id}", scheduled_for: "2026-03-02T10:00:00Z" }
              as: CareCoordinator
              captures: { s1_id: $.data.id }
            - call: "POST /eap/cases/${case_id}/sessions"
              payload: { provider_id: "${prov_id}", scheduled_for: "2026-03-03T10:00:00Z" }
              as: CareCoordinator
              captures: { s2_id: $.data.id }
            - call: "POST /eap/sessions/${s1_id}/status"
              payload: { to_status: "COMPLETED" }
              as: Provider
            - call: "POST /eap/sessions/${s2_id}/status"
              payload: { to_status: "COMPLETED" }
              as: Provider
            - call: "POST /eap/claims"
              payload: { contract_id: "${c_id}", session_id: "${s1_id}", billed_cents: 70000 }
              as: Provider
              captures: { claim1_id: $.data.id }
            - call: "POST /eap/claims"
              payload: { contract_id: "${c_id}", session_id: "${s2_id}", billed_cents: 70000 }
              as: Provider
              captures: { claim2_id: $.data.id }
            - call: "POST /eap/claims/${claim1_id}/review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/claims/${claim1_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/claims/${claim2_id}/review"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /eap/claims/${claim2_id}/approve"
              payload: {}
              as: ProgramAdmin
              captures: { final2: $.data.final_cents }
          assert:
            - "Claim.${claim1_id}.final_cents == 12000"
            - "Claim.${claim2_id}.final_cents == 12000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: case_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.Case.funding_status=AUTHORIZED_to_funding_status=EXHAUSTED
          - state_machines.Case.clinical_status=OPEN_to_clinical_status=CLOSED
          - entities.Case.fields.clinical_status
          - entities.Case.fields.funding_status
        distinguishing_aspect: "Case has two independent state axes: funding_status can reach EXHAUSTED while clinical_status is still OPEN, and closing the case sets clinical_status=CLOSED without resetting funding_status (parallel, not linear)."
        test_recipe:
          setup:
            - "Authorized case, sessions_per_issue=1 so a single COMPLETED session exhausts funding."
            - "After exhaustion clinical_status is still OPEN; then case is closed."
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "Eps", sessions_per_issue: 1, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /eap/plans"
              payload: { contract_id: "${c_id}", name: "Std" }
              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /eap/plans/${plan_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/employees"
              payload: { contract_id: "${c_id}", plan_id: "${plan_id}", full_name: "Empl E", external_ref: "EE1" }
              as: ProgramAdmin
              captures: { e_id: $.data.id }
            - call: "POST /eap/providers"
              payload: { full_name: "Dr E", specialties: ["STRESS"] }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /eap/cases"
              payload: { contract_id: "${c_id}", employee_id: "${e_id}", presenting_issue: "STRESS" }
              as: CareCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /eap/cases/${case_id}/authorize"
              payload: { expected_contract_version: "${c_v}" }
              as: CareCoordinator
            - call: "POST /eap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eap/cases/${case_id}/sessions"
              payload: { provider_id: "${prov_id}", scheduled_for: "2026-03-02T10:00:00Z" }
              as: CareCoordinator
              captures: { s1_id: $.data.id }
            - call: "POST /eap/sessions/${s1_id}/status"
              payload: { to_status: "COMPLETED" }
              as: Provider
          trigger:
            - call: "POST /eap/cases/${case_id}/close"
              payload: {}
              as: CareCoordinator
              captures: { clin: $.data.clinical_status, fund: $.data.funding_status }
          assert:
            - "Case.${case_id}.funding_status == EXHAUSTED"
            - "Case.${case_id}.clinical_status == CLOSED"

      - name: claim_cyclic_reject_resubmit_review_again
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_REJECTED
          - state_machines.Claim.REJECTED_to_RESUBMITTED
          - state_machines.Claim.RESUBMITTED_to_UNDER_REVIEW
          - entities.Claim.fields.status
        distinguishing_aspect: "Claim has a cycle: UNDER_REVIEW -> REJECTED -> RESUBMITTED -> UNDER_REVIEW; the same claim re-enters UNDER_REVIEW with recomputed provisional_cents from corrected billed_cents."
        test_recipe:
          setup:
            - "A SUBMITTED claim with billed 5000 (provisional 3000 after copay 2000) is reviewed then rejected, then resubmitted with billed 20000."
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "Zeta", sessions_per_issue: 1, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /eap/plans"
              payload: { contract_id: "${c_id}", name: "Std", copay_cents: 2000 }
              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /eap/plans/${plan_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/employees"
              payload: { contract_id: "${c_id}", plan_id: "${plan_id}", full_name: "Empl Z", external_ref: "EZ1" }
              as: ProgramAdmin
              captures: { e_id: $.data.id }
            - call: "POST /eap/providers"
              payload: { full_name: "Dr Z", specialties: ["STRESS"] }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /eap/cases"
              payload: { contract_id: "${c_id}", employee_id: "${e_id}", presenting_issue: "STRESS" }
              as: CareCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /eap/cases/${case_id}/authorize"
              payload: { expected_contract_version: "${c_v}" }
              as: CareCoordinator
            - call: "POST /eap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eap/cases/${case_id}/sessions"
              payload: { provider_id: "${prov_id}", scheduled_for: "2026-03-02T10:00:00Z" }
              as: CareCoordinator
              captures: { s1_id: $.data.id }
            - call: "POST /eap/sessions/${s1_id}/status"
              payload: { to_status: "COMPLETED" }
              as: Provider
            - call: "POST /eap/claims"
              payload: { contract_id: "${c_id}", session_id: "${s1_id}", billed_cents: 5000 }
              as: Provider
              captures: { claim_id: $.data.id }
            - call: "POST /eap/claims/${claim_id}/review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/claims/${claim_id}/reject"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/claims/${claim_id}/resubmit"
              payload: { billed_cents: 20000 }
              as: Provider
              captures: { prov_after: $.data.provisional_cents }
          trigger:
            - call: "POST /eap/claims/${claim_id}/review"
              payload: {}
              as: ProgramAdmin
              captures: { st: $.data.status }
          assert:
            - "Claim.${claim_id}.status == UNDER_REVIEW"
            - "Claim.${claim_id}.provisional_cents == 10000"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: contract_terminate_cascades_revoke_cancel_decrement_reject
        grounds:
          - state_machines.EmployerContract.ACTIVE_to_TERMINATED
          - state_machines.Case.funding_status=AUTHORIZED_to_funding_status=REVOKED
          - entities.CounselingSession.fields.status
          - entities.Claim.fields.status
          - entities.EmployerContract.fields.sessions_committed
        distinguishing_aspect: "Depth-3+ chain from contract terminate: terminate -> Case.funding_status=REVOKED (hop1) -> SCHEDULED session CANCELLED (hop2) -> sessions_committed decremented AND its SUBMITTED claim REJECTED (hop3), each link caused by the previous."
        test_recipe:
          setup:
            - "Active contract with an authorized case, one SCHEDULED session, and a SUBMITTED claim on a separately COMPLETED session."
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "Eta", sessions_per_issue: 3, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /eap/plans"
              payload: { contract_id: "${c_id}", name: "Std", copay_cents: 0 }
              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /eap/plans/${plan_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/employees"
              payload: { contract_id: "${c_id}", plan_id: "${plan_id}", full_name: "Empl H", external_ref: "EH1" }
              as: ProgramAdmin
              captures: { e_id: $.data.id }
            - call: "POST /eap/providers"
              payload: { full_name: "Dr H", specialties: ["STRESS"] }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /eap/cases"
              payload: { contract_id: "${c_id}", employee_id: "${e_id}", presenting_issue: "STRESS" }
              as: CareCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /eap/cases/${case_id}/authorize"
              payload: { expected_contract_version: "${c_v}" }
              as: CareCoordinator
              captures: { c_v2: $.data.version }
            - call: "POST /eap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eap/cases/${case_id}/sessions"
              payload: { provider_id: "${prov_id}", scheduled_for: "2026-03-02T10:00:00Z" }
              as: CareCoordinator
              captures: { s_completed: $.data.id }
            - call: "POST /eap/cases/${case_id}/sessions"
              payload: { provider_id: "${prov_id}", scheduled_for: "2026-03-04T10:00:00Z" }
              as: CareCoordinator
              captures: { s_scheduled: $.data.id }
            - call: "POST /eap/sessions/${s_completed}/status"
              payload: { to_status: "COMPLETED" }
              as: Provider
            - call: "POST /eap/claims"
              payload: { contract_id: "${c_id}", session_id: "${s_completed}", billed_cents: 12000 }
              as: Provider
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /eap/contracts/${c_id}/terminate"
