            - call: "POST /alerts/products"
              payload: { product_level: "WATCH", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${mi_off_a}", zone_ids: ["${mi_za}", "${mi_zb}"], effective_from: "2026-09-01T06:00:00Z", expires_at: "2026-09-01T18:00:00Z" }
