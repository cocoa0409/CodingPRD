          rationale: "The guarded transition on the grandparent Insured's control_status, including the re-enable after flipping it back, is asserted by the named §1.8 instance."
  - section: calculations
    instances:
      - name: score_input_set_excludes_stale_and_nonselected_packages
        claim_type: input_set_filtering
        grounds:
          - calculations.governance_risk_assessment.input_set
          - entities.DisclosurePackage.fields.financial_subscore
          - entities.LitigationEvent.fields.weight_units
        distinguishing_aspect: |
          The INDICATIVE variant consumes exactly ONE disclosure package — greatest fiscal_year,
          ties broken by the later created_at — and only SECURITIES_CLASS_ACTION and
          REGULATORY_ENFORCEMENT litigation events. Three packages are seeded so that the two
          obvious wrong selections (the worst package, and the first-created of the two
          fiscal-2025 packages) land in different risk bands than the correct one, and an open
          DERIVATIVE event is seeded so that a handler that borrows the UNDERWRITTEN input set
          (all case types plus the open-litigation surcharge) also diverges. The non-consumed
          rows must keep their 0 subscores / 0 weight_units.
        test_recipe:
          setup:
            - "One BIOTECH insured with three disclosure packages and two litigation events; logical clock at 2026-08-01T00:00:00Z; one DRAFT submission."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 25000000 }
              as: Underwriter
              captures: { insured_id: "$.data.id" }
            - call: "POST /dno/insureds/${insured_id}/disclosure-packages"
              payload: { fiscal_year: 2023, filed_date: "2026-01-15T00:00:00Z", restatement_flag: true, material_weakness_count: 3, going_concern_flag: true, negative_operating_cash_flow_flag: true, debt_to_equity: 2.4, independent_director_ratio: 0.30, dual_class_shares_flag: true, staggered_board_flag: true, combined_ceo_chair_flag: true, auditor_change_flag: true }
              as: Underwriter
              captures: { pkg_2023_id: "$.data.id" }
            - call: "POST /dno/insureds/${insured_id}/disclosure-packages"
              payload: { fiscal_year: 2025, filed_date: "2026-02-15T00:00:00Z", restatement_flag: true, material_weakness_count: 2, going_concern_flag: false, negative_operating_cash_flow_flag: false, debt_to_equity: 1.5, independent_director_ratio: 0.45, dual_class_shares_flag: false, staggered_board_flag: false, combined_ceo_chair_flag: true, auditor_change_flag: false }
              as: Underwriter
              captures: { pkg_2025_early_id: "$.data.id" }
            - call: "POST /dno/insureds/${insured_id}/disclosure-packages"
              payload: { fiscal_year: 2025, filed_date: "2026-03-01T00:00:00Z", restatement_flag: false, material_weakness_count: 1, going_concern_flag: false, negative_operating_cash_flow_flag: false, debt_to_equity: 0.9, independent_director_ratio: 0.65, dual_class_shares_flag: false, staggered_board_flag: true, combined_ceo_chair_flag: false, auditor_change_flag: false }
              as: Underwriter
              captures: { pkg_2025_late_id: "$.data.id" }
            - call: "POST /dno/insureds/${insured_id}/litigation-events"
              payload: { case_type: "SECURITIES_CLASS_ACTION", filed_date: "2024-06-15T00:00:00Z", resolved_date: "2025-01-15T00:00:00Z", indemnity_paid_usd: 4000000, outcome: "SETTLED" }
              as: Underwriter
              captures: { sca_event_id: "$.data.id" }
            - call: "POST /dno/insureds/${insured_id}/litigation-events"
              payload: { case_type: "DERIVATIVE", filed_date: "2025-06-01T00:00:00Z", indemnity_paid_usd: 0, outcome: "OPEN" }
              as: Underwriter
              captures: { derivative_event_id: "$.data.id" }
            - call: "POST /dno/submissions"
              payload: { insured_id: "${insured_id}", requested_limit_usd: 10000000, requested_retention_usd: 250000, requested_side_c_sublimit_usd: 5000000, requested_program_target_limit_usd: 20000000, requested_period_start: "2026-09-01T00:00:00Z", requested_period_end: "2027-09-01T00:00:00Z", retroactive_date: "2024-01-01T00:00:00Z", erp_days: 90 }
              as: Underwriter
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /dno/submissions/${sub_id}/score"
              payload: { variant: "INDICATIVE" }
              as: Underwriter
            - call: "GET /dno/insureds/${insured_id}/disclosure-packages"
              payload: {}
              as: Underwriter
            - call: "GET /dno/insureds/${insured_id}/litigation-events"
              payload: {}
              as: Underwriter
          assert:
            - "the score call is 200 with data.disclosure_packages_considered == 1 — exactly the fiscal-2025 package filed 2026-03-01, selected by greatest fiscal_year then later created_at"
            - "data.risk_score == 41.60 and data.risk_band == \"MODERATE\": financial 6.00 (one material weakness) + governance 6.00 (staggered board only) + litigation 20.00, composite 32.00, times the BIOTECH multiplier 1.30, rounded once"
            - "data.litigation_units == 20.00 — the open DERIVATIVE event contributes nothing under INDICATIVE and the OPEN_LITIGATION_SURCHARGE of 10 is not added"
            - "the score is NOT 169.00 / SEVERE (worst package chosen), NOT 93.60 / ELEVATED (the earlier fiscal-2025 package chosen), and NOT 54.60 / MODERATE-by-accident (UNDERWRITTEN input set with the derivative weight 12 plus the open surcharge)"
            - "the disclosure-package listing shows the selected package with financial_subscore == 6.00 and governance_subscore == 6.00, while ${pkg_2023_id} and ${pkg_2025_early_id} both still read financial_subscore == 0 and governance_subscore == 0 — subscores are written only for the consumed set"
            - "the litigation-event listing shows ${sca_event_id}.weight_units == 20.00 and ${derivative_event_id}.weight_units == 0"
            - "no ERR_DISCLOSURE_STALE: the newest filed_date 2026-03-01 is 153 days old, inside DISCLOSURE_STALE_DAYS 540"
      - name: premium_floor_applies_to_a_tiny_program
        claim_type: constants_applied
        grounds:
          - calculations.net_premium_quotation.constants
          - calculations.premium_grossup_and_tax
          - entities.Quote.fields.net_premium_usd
        distinguishing_aspect: |
          A clean CONSUMER insured with no litigation history scores 0.00 (LOW) and a 1,000,000
          limit buys only 1.00 rated unit, so the raw net premium is 9,000.00 — below the
          NET_PREMIUM_FLOOR_USD of 25,000. The floor must be applied to the net figure
          BEFORE the commission gross-up, and with a Side C sublimit of 0 the listed-company
          load of 0.20 must not be charged at all. A handler that grosses up 9,000 or that
          applies the floor after the gross-up produces a visibly different premium stack.
        test_recipe:
          setup:
            - "One CONSUMER, PRIVATE insured with a single clean disclosure package, no litigation events, and a scored submission for a 1,000,000 limit with no Side C sublimit; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dno/insureds"
              payload: { legal_name: "Marrow Pantry Co", sector_code: "CONSUMER", exchange_listing: "PRIVATE", market_cap_usd: 40000000, fiscal_year_end: "06-30", entity_capacity_cap_usd: 5000000 }
              as: Underwriter
              captures: { insured_id: "$.data.id" }
            - call: "POST /dno/insureds/${insured_id}/disclosure-packages"
              payload: { fiscal_year: 2026, filed_date: "2026-07-15T00:00:00Z", restatement_flag: false, material_weakness_count: 0, going_concern_flag: false, negative_operating_cash_flow_flag: false, debt_to_equity: 0.4, independent_director_ratio: 0.75, dual_class_shares_flag: false, staggered_board_flag: false, combined_ceo_chair_flag: false, auditor_change_flag: false }
              as: Underwriter
            - call: "POST /dno/submissions"
              payload: { insured_id: "${insured_id}", requested_limit_usd: 1000000, requested_retention_usd: 100000, requested_side_c_sublimit_usd: 0, requested_program_target_limit_usd: 1000000, requested_period_start: "2026-09-01T00:00:00Z", requested_period_end: "2027-09-01T00:00:00Z", retroactive_date: "2026-01-01T00:00:00Z", erp_days: 90 }
              as: Underwriter
              captures: { sub_id: "$.data.id" }
            - call: "POST /dno/submissions/${sub_id}/score"
              payload: { variant: "UNDERWRITTEN" }
              as: Underwriter
              captures: { sub_v: "$.data.version" }
          trigger:
            - call: "POST /dno/submissions/${sub_id}/quotes"
              payload: { expected_submission_version: "${sub_v}", offered_limit_usd: 1000000, offered_retention_usd: 100000, offered_side_c_sublimit_usd: 0, quote_valid_until: "2026-08-31T00:00:00Z" }
              as: Underwriter
          assert:
            - "the scoring call returned risk_score == 0.00 and risk_band == \"LOW\" — every disclosure flag is clean and the CONSUMER multiplier 0.95 leaves 0.00 at 0.00"
            - "the quote call is 201 with data.risk_band_at_quote == \"LOW\""
            - "data.net_premium_usd == 25000.00 — the raw computation is BAND_RATE[LOW] 9000 times 1.00 rated unit (the first 5,000,000 tier is charged at 1.00 per million and only 1,000,000 is bought), then lifted to NET_PREMIUM_FLOOR_USD 25000"
            - "the retention credit is 0.00 even though the retention is 100,000: floor(100000 / 250000) == 0 blocks of RETENTION_CREDIT_STEP"
            - "the Side C load is 0.00 because offered_side_c_sublimit_usd == 0, despite SIDE_C_LOAD_PRIVATE being 0.08"
            - "data.gross_premium_usd == 28571.43 == round(25000.00 / (1 - 0.125), 2), data.broker_commission_usd == 3571.43, data.premium_tax_usd == 1000.00 == round(28571.43 * 0.035, 2), data.total_payable_usd == 29571.43"
            - "the stack is NOT 9000.00 / 10285.71 / 1285.71 / 360.00 / 10645.71 (floor never applied) and NOT a gross of 25000.00 with commission 3125.00 (floor applied to the gross instead of the net)"
      - name: runoff_premium_multiplicative_load_and_unexpired_credit
        claim_type: correct_result
        grounds:
          - calculations.runoff_premium
          - state_machines.Policy.transitions.ACTIVE_to_RUNOFF
