# =============================================================================
# Task 1933: Equine Rescue & Sanctuary Operations — scaffold seed tables
# =============================================================================

scenario: |
  1933. Equine Rescue & Sanctuary Operations (equine rescue nonprofit): intake
  evaluation & quarantine protocol, rehabilitation plan & veterinary/farrier
  scheduling, adoption application, home check & follow-up visits, sanctuary
  (non-adoptable) lifetime care cost planning, hay/feed inventory & seasonal
  purchasing, volunteer & barn shift scheduling, sponsorship program per horse,
  euthanasia & end-of-life decision policy

domain_name: equine-rescue-sanctuary
api_prefix: /rescue-ops

complexity_profile:
  primary_archetype: posture-driven gating
  secondary_archetype: quota / allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Horse
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Horse name" }
      - { name: sex, type: enum, source: input, description: "MARE | GELDING | STALLION" }
      - { name: breed_class, type: enum, source: input, description: "LIGHT | DRAFT | PONY; drives lifespan constant in lifetime_care_cost_projection" }
      - { name: estimated_weight_lbs, type: integer, source: input, description: "Estimated body weight in lbs; > 0; input to daily_feed_ration_lbs" }
      - { name: age_years, type: integer, source: input, description: "Age in whole years at intake; >= 0; drives care-cost projection and adoption fee band" }
      - { name: body_condition_score, type: integer, source: input, description: "Henneke body condition score, integer 1..9; drives ration factor and feed split" }
      - { name: temperament_score, type: integer, source: input, default: 5, description: "Temperament 1..10" }
      - { name: training_level, type: enum, source: input, description: "UNHANDLED | GREEN | TRAINED_RIDDEN; adoption fee adjustment input" }
      - { name: intake_reason, type: string, source: input, required: false, description: "Free-text intake reason" }
      - { name: bonded_companion_id, type: string, source: input, required: false, description: "FK -> Horse.id; nullable; bonded-pair companion; adoption of one with adopt_with_bonded_companion requires companion ADOPTABLE at finalize" }
      - { name: status, type: enum, source: system, description: "QUARANTINE | REHABILITATION | ADOPTABLE | ADOPTION_PENDING | ADOPTED | SANCTUARY | END_OF_LIFE_REVIEW | DECEASED; initial QUARANTINE" }
      - { name: prior_status, type: enum, source: system, description: "Resident status captured when entering END_OF_LIFE_REVIEW; restored on case OVERRIDDEN; null otherwise" }
      - { name: current_location, type: enum, source: system, description: "QUARANTINE_STALL | REHAB_PADDOCK | MAIN_PASTURE | SANCTUARY_PASTURE | OFFSITE_ADOPTED | NOT_APPLICABLE" }
      - { name: active_application_id, type: string, source: system, required: false, description: "FK -> AdoptionApplication.id; set when an application is APPROVED; cleared on reject/withdraw/finalize/return" }
      - { name: daily_feed_ration_lbs, type: number, source: computed, description: "Per-horse daily total feed ration from daily_feed_ration calculation; recomputed on create and on PATCH of weight/BCS" }

  - name: IntakeEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: horse_id, type: string, source: input, description: "FK -> Horse.id" }
      - { name: evaluation_type, type: enum, source: input, description: "MEDICAL | BEHAVIORAL | FARRIERY" }
      - { name: scheduled_date, type: datetime, source: input, description: "Planned evaluation instant" }
      - { name: evaluation_date, type: datetime, source: system, description: "Set to logical now on completion; drives quarantine clearance 48h window and graduate 30-day window" }
      - { name: outcome, type: enum, source: system, description: "PASS | FAIL | CONDITIONAL; set by complete endpoint" }
      - { name: findings, type: string, source: input, required: false, description: "Free-text findings" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED; initial SCHEDULED" }
      - { name: completed_by_user_id, type: string, source: system, description: "X-User-ID of completer" }

  - name: QuarantineProtocol
    parent: null
    common_fields: true
    fields:
      - { name: horse_id, type: string, source: system, description: "FK -> Horse.id; one ACTIVE protocol per horse at a time" }
      - { name: start_date, type: datetime, source: system, description: "Logical now at creation" }
      - { name: min_days, type: integer, source: input, description: "Minimum quarantine days, 1..60; intake default protocol uses 14" }
      - { name: extension_days, type: integer, source: system, default: 0, description: "Accumulated extension days; +7 per fever health log, +N per manual extend" }
      - { name: reason, type: string, source: input, required: false, description: "Reason (INTAKE, EXPOSURE, AUTO_RETURN)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLEARED; initial ACTIVE" }
      - { name: cleared_at, type: datetime, source: system, description: "Logical now at clearance; null while ACTIVE" }

  - name: DailyHealthLog
    parent: null
    common_fields: false
    fields:
      - { name: horse_id, type: string, source: input, description: "FK -> Horse.id" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical now; append-only, never updated" }
      - { name: temp_f, type: number, source: input, description: "Rectal temperature Fahrenheit, 95.0..110.0; >= 103.0 triggers fever extension cascade" }
      - { name: appetite, type: enum, source: input, description: "NORMAL | REDUCED | NONE" }
      - { name: notes, type: string, source: input, required: false, description: "Free-text notes" }

  - name: RehabilitationPlan
    parent: null
    common_fields: true
    fields:
      - { name: horse_id, type: string, source: input, description: "FK -> Horse.id" }
      - { name: goals, type: string, source: input, description: "Plan goals narrative" }
      - { name: target_body_condition_score, type: integer, source: input, description: "Target Henneke BCS 1..9" }
      - { name: planned_weeks, type: integer, source: input, description: "Planned duration weeks, 1..52" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | COMPLETED | SUPERSEDED; initial DRAFT; creating a new plan supersedes the horse's current ACTIVE plan" }
      - { name: completed_visit_count, type: integer, source: system, default: 0, description: "Increments when a linked CareServiceAppointment completes" }
      - { name: activated_at, type: datetime, source: system, description: "Logical now at activation; null while DRAFT" }

  - name: Practitioner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Practitioner name" }
      - { name: specialty, type: enum, source: input, description: "VETERINARIAN | FARRIER; role Veterinarian/Farrier X-User-ID must reference a Practitioner of matching specialty" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive practitioners cannot be booked; deactivation cancels their REQUESTED/CONFIRMED appointments" }

  - name: CareServiceAppointment
    parent: null
    common_fields: true
    fields:
      - { name: horse_id, type: string, source: input, description: "FK -> Horse.id" }
      - { name: practitioner_id, type: string, source: input, description: "FK -> Practitioner.id" }
      - { name: rehab_plan_id, type: string, source: input, required: false, description: "FK -> RehabilitationPlan.id; nullable; required for plan-linked rehab visits" }
      - { name: service_type, type: enum, source: input, description: "VET_EXAM | VET_PROCEDURE | DENTAL | FARRIER_TRIM | FARRIER_SHOEING; must match practitioner specialty" }
      - { name: scheduled_start, type: datetime, source: input, description: "Half-open interval start" }
      - { name: scheduled_end, type: datetime, source: input, description: "Half-open interval end; must be after start" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | COMPLETED | CANCELLED; initial REQUESTED" }
      - { name: billing_status, type: enum, source: system, description: "UNBILLED | BILLED; independent parallel dimension; UNBILLED -> BILLED on complete" }
      - { name: actual_cost_cents, type: integer, source: system, description: "Set at completion" }
      - { name: cancellation_reason, type: string, source: input, required: false, description: "Reason recorded on cancel" }

  - name: Stall
    parent: null
    common_fields: true
    fields:
      - { name: stall_code, type: string, source: input, description: "Unique stall code" }
      - { name: barn_zone, type: enum, source: input, description: "QUARANTINE_BARN | MAIN_BARN | ISOLATION" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive stalls reject new assignments" }

  - name: StallAssignment
    parent: null
    common_fields: true
    fields:
      - { name: horse_id, type: string, source: input, description: "FK -> Horse.id" }
      - { name: stall_id, type: string, source: input, description: "FK -> Stall.id" }
      - { name: start_date, type: datetime, source: input, description: "Occupancy start (date-precision, closed interval)" }
      - { name: end_date, type: datetime, source: input, required: false, description: "Occupancy end inclusive; null = open-ended while ACTIVE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ENDED; initial ACTIVE" }

  - name: Adopter
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Adopter legal name" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }
      - { name: experience_level, type: enum, source: input, description: "NOVICE | INTERMEDIATE | EXPERT" }
      - { name: has_stall_facility, type: boolean, source: input, description: "Whether adopter has own stalls" }
      - { name: status, type: enum, source: system, description: "ACTIVE | BLOCKED; initial ACTIVE; BLOCKED adopters cannot submit or be approved" }

  - name: AdoptionApplication
    parent: null
    common_fields: true
    fields:
      - { name: adopter_id, type: string, source: input, description: "FK -> Adopter.id; must equal caller X-User-ID for Adopter role" }
      - { name: horse_id, type: string, source: input, description: "FK -> Horse.id" }
      - { name: adopt_with_bonded_companion, type: boolean, source: input, default: false, description: "True = pair adoption; finalize transitions both horses and applies pair fee rule" }
      - { name: proposed_pickup_date, type: datetime, source: input, description: "Planned pickup; must be <= 14 days after finalize instant" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | HOME_CHECK_SCHEDULED | HOME_CHECK_PASSED | APPROVED | FINALIZED | RETURN_COMPLETED | REJECTED | WITHDRAWN; initial SUBMITTED" }
      - { name: home_check_attempts, type: integer, source: system, default: 0, description: "Increments per HomeCheck creation; hard cap 2" }
      - { name: quoted_fee_cents, type: integer, source: system, description: "QUOTED variant of adoption_fee_calculation, frozen at approve" }
      - { name: final_fee_cents, type: integer, source: system, description: "FINAL variant of adoption_fee_calculation, recomputed at finalize" }
      - { name: fee_paid_cents, type: integer, source: system, default: 0, description: "Accumulated payments" }
      - { name: refund_cents, type: integer, source: system, default: 0, description: "Computed on return cascade: 50% of final fee if returned within 90 days of finalize, else 25%" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical now at creation; precedence ordering key" }
      - { name: approved_at, type: datetime, source: system, description: "Logical now at approve; cooling-off anchor" }
      - { name: finalized_at, type: datetime, source: system, description: "Logical now at finalize; follow-up schedule anchor" }
      - { name: decision_reason, type: string, source: system, description: "Reason recorded on reject / auto-reject / return" }

  - name: HomeCheck
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> AdoptionApplication.id" }
      - { name: scheduled_date, type: datetime, source: input, description: "Scheduled visit instant" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED; initial SCHEDULED" }
      - { name: outcome, type: enum, source: system, description: "PASSED | FAILED | CONDITIONAL; null until completed" }
      - { name: completed_by_user_id, type: string, source: system, description: "X-User-ID of completing AdoptionOfficer; approve caller must differ (segregation of duties)" }
      - { name: completed_at, type: datetime, source: system, description: "Logical now at completion; approve requires within 180 days" }
      - { name: findings, type: string, source: input, required: false, description: "Free-text findings" }

  - name: FollowUpVisit
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> AdoptionApplication.id; auto-created at finalize (DAY_30/DAY_90/DAY_180)" }
      - { name: visit_type, type: enum, source: system, description: "DAY_30 | DAY_90 | DAY_180" }
      - { name: scheduled_date, type: datetime, source: system, description: "finalized_at + 30/90/180 days" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED; initial SCHEDULED; CANCELLED when application leaves FINALIZED via return" }
      - { name: outcome, type: enum, source: system, description: "PASSED | FAILED; null until completed" }
      - { name: completed_at, type: datetime, source: system, description: "Logical now at completion" }
      - { name: findings, type: string, source: input, required: false, description: "Free-text findings" }

  - name: SanctuaryCarePlan
    parent: null
    common_fields: true
    fields:
      - { name: horse_id, type: string, source: input, description: "FK -> Horse.id" }
      - { name: variant, type: enum, source: input, description: "ACTUARIAL | STRAIGHT_LINE; selects lifetime_care_cost_projection variant" }
      - { name: projected_months, type: integer, source: computed, description: "(breed lifespan years - age_years) * 12" }
      - { name: monthly_cost_cents, type: integer, source: computed, description: "STRAIGHT_LINE: 38500 flat; ACTUARIAL: round_half_up(total_lifetime_cost_cents / projected_months)" }
      - { name: total_lifetime_cost_cents, type: integer, source: computed, description: "Per lifetime_care_cost_projection; final rounding only, round_half_up to integer cents" }
      - { name: funding_coverage_cents, type: integer, source: computed, default: 0, description: "Sum of monthly_pledge_cents over this horse's ACTIVE sponsorships; recomputed on every sponsorship mutation" }
      - { name: funding_status, type: enum, source: computed, description: "UNFUNDED (coverage == 0) | PARTIALLY_FUNDED (0 < coverage < monthly_cost_cents) | FUNDED (coverage >= monthly_cost_cents)" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | SUPERSEDED | CLOSED; initial DRAFT; creating a new plan supersedes existing DRAFT/APPROVED plan" }

  - name: Sponsor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Sponsor display name" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }
      - { name: status, type: enum, source: computed, description: "ACTIVE iff sponsor has >= 1 sponsorship in {PLEDGED, ACTIVE, LAPSED}; else INACTIVE; recomputed on every sponsorship mutation" }

  - name: Sponsorship
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_id, type: string, source: input, description: "FK -> Sponsor.id; must equal caller X-User-ID for Sponsor role" }
      - { name: horse_id, type: string, source: input, description: "FK -> Horse.id" }
      - { name: monthly_pledge_cents, type: integer, source: input, description: "Monthly pledge; >= 2500 (ERR_PLEDGE_BELOW_MINIMUM)" }
      - { name: status, type: enum, source: system, description: "PLEDGED | ACTIVE | LAPSED | COMPLETED | CANCELLED; initial PLEDGED" }
      - { name: completion_reason, type: enum, source: system, description: "ADOPTED; set when horse adoption auto-completes the sponsorship; null otherwise" }
      - { name: cancellation_reason, type: string, source: system, description: "HORSE_DECEASED or free-text; null otherwise" }
      - { name: activated_at, type: datetime, source: system, description: "Logical now at first activation" }

  - name: FeedLot
    parent: null
    common_fields: true
    fields:
      - { name: feed_type, type: enum, source: system, description: "GRASS_HAY | ALFALFA | GRAIN | SUPPLEMENT; copied from parent PurchaseOrder" }
      - { name: purchase_order_id, type: string, source: system, description: "FK -> PurchaseOrder.id" }
      - { name: quantity_lbs, type: number, source: system, description: "Current on-hand lbs (2dp); decremented by close-day drawdown and expiry waste" }
      - { name: initial_lbs, type: number, source: system, description: "Received lbs at receipt; immutable anchor for the feed conservation invariant" }
      - { name: unit_cents_per_lb, type: number, source: system, description: "Copied from PurchaseOrder" }
      - { name: lot_cost_cents, type: integer, source: computed, description: "round_half_up(initial_lbs * unit_cents_per_lb) — per-lot rounding pinned by purchase_order_cost" }
      - { name: expiry_date, type: datetime, source: input, description: "Lot expiry (usable through this date inclusive at close-day)" }
      - { name: received_at, type: datetime, source: system, description: "Logical now at receipt" }

  - name: FeedDayClose
    parent: null
    common_fields: false
    fields:
      - { name: close_date, type: datetime, source: input, description: "Calendar day being closed; each date may be closed at most once globally" }
      - { name: feed_type, type: enum, source: system, description: "GRASS_HAY | ALFALFA | GRAIN | SUPPLEMENT" }
      - { name: consumed_lbs, type: number, source: computed, description: "round_half_up(daily_demand_lbs(feed_type) * seasonal_multiplier(close_date), 2)" }
      - { name: wasted_lbs, type: number, source: computed, description: "Sum of remaining qty of lots with expiry_date < close_date" }
      - { name: shortfall_lbs, type: number, source: computed, description: "Unmet demand when usable lots run out" }

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: feed_type, type: enum, source: input, description: "GRASS_HAY | ALFALFA | GRAIN | SUPPLEMENT" }
      - { name: quantity_lbs, type: number, source: input, description: "Ordered lbs; > 0" }
      - { name: unit_cents_per_lb, type: number, source: input, description: "Unit price in cents per lb; > 0; may carry fractional cents" }
      - { name: estimated_total_cents, type: integer, source: computed, description: "round_half_up(quantity_lbs * unit_cents_per_lb) at creation — single-rounding estimate" }
      - { name: actual_total_cents, type: integer, source: computed, default: 0, description: "Sum of per-lot round_half_up(lot.initial_lbs * unit_cents_per_lb) across receipts" }
      - { name: delivery_surcharge_cents, type: integer, source: computed, description: "round_half_up(actual_total_cents * 0.08); computed when order fully received" }
      - { name: grand_total_cents, type: integer, source: computed, description: "actual_total_cents + delivery_surcharge_cents on full receipt" }
      - { name: received_lbs, type: number, source: system, default: 0, description: "Cumulative received lbs" }
      - { name: status, type: enum, source: system, description: "DRAFT | ORDERED | PARTIALLY_RECEIVED | RECEIVED; initial DRAFT" }

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Volunteer name" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }
      - { name: skills, type: array, source: input, description: "Non-empty subset of FEEDING | CLEANING | HANDLING | MAINTENANCE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; initial ACTIVE; auto-SUSPENDED when reliability_score < 20 after a no-show" }
      - { name: completed_shift_count, type: integer, source: system, default: 0, description: "Increments on shift complete" }
      - { name: no_show_count, type: integer, source: system, default: 0, description: "Increments on shift no-show" }
      - { name: reliability_score, type: integer, source: computed, default: 50, description: "clamp(50 + 5*completed_shift_count - 20*no_show_count, 0, 100); claim gate >= 40" }

  - name: BarnShift
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: system, description: "FK -> Volunteer.id; null while OPEN; set to claiming volunteer" }
      - { name: shift_date, type: datetime, source: input, description: "Calendar day of the shift" }
      - { name: start_time, type: string, source: input, description: "HH:MM 24h; half-open interval start" }
      - { name: end_time, type: string, source: input, description: "HH:MM 24h; must be after start_time" }
      - { name: barn_zone, type: enum, source: input, description: "QUARANTINE_BARN | MAIN_BARN | ISOLATION | PASTURES" }
      - { name: required_skill, type: enum, source: input, description: "FEEDING | CLEANING | HANDLING | MAINTENANCE | ANY" }
      - { name: status, type: enum, source: system, description: "OPEN | ASSIGNED | COMPLETED | NO_SHOW; initial OPEN" }

  - name: EuthanasiaCase
    parent: null
    common_fields: true
    fields:
      - { name: horse_id, type: string, source: input, description: "FK -> Horse.id" }
      - { name: clinical_summary, type: string, source: input, description: "Clinical justification" }
      - { name: suffering_score, type: integer, source: input, description: "1..10; >= 8 with dual-vet emergency attestation bypasses cooling-off" }
      - { name: status, type: enum, source: system, description: "PROPOSED | CERTIFIED | AUTHORIZED | EXECUTED | OVERRIDDEN; initial PROPOSED" }
      - { name: proposing_practitioner_id, type: string, source: system, description: "FK -> Practitioner.id; set from proposer X-User-ID" }
      - { name: certifying_practitioner_id, type: string, source: system, description: "FK -> Practitioner.id; must differ from proposing_practitioner_id (segregation of duties)" }
      - { name: emergency_certified, type: boolean, source: system, default: false, description: "True only when suffering_score >= 8 AND certifier passes emergency_attestation=true" }
      - { name: authorized_at, type: datetime, source: system, description: "Logical now at authorize; cooling-off anchor" }
      - { name: executed_at, type: datetime, source: system, description: "Logical now at execute" }
      - { name: prior_horse_status, type: enum, source: system, description: "Horse status before END_OF_LIFE_REVIEW; restored on overturn" }
      - { name: overturn_reason, type: string, source: input, required: false, description: "Recorded on overturn" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Horse
    initial_state: QUARANTINE
    terminal_states: [DECEASED]
    transitions:
      - from: QUARANTINE
        to: REHABILITATION
        trigger: "POST /rescue-ops/horses/{id}/release-quarantine with target_status=REHABILITATION"
        actor: IntakeCoordinator
        preconditions:
          - "Horse.status == QUARANTINE (ERR_INVALID_STATE)"
          - "Horse's ACTIVE QuarantineProtocol.status == CLEARED (ERR_QUARANTINE_ACTIVE)"
        side_effects:
          - "Horse.current_location := REHAB_PADDOCK"
          - "Horse.version += 1"
      - from: QUARANTINE
        to: ADOPTABLE
        trigger: "POST /rescue-ops/horses/{id}/release-quarantine with target_status=ADOPTABLE"
        actor: IntakeCoordinator
        preconditions:
          - "Horse.status == QUARANTINE (ERR_INVALID_STATE)"
          - "Horse's ACTIVE QuarantineProtocol.status == CLEARED (ERR_QUARANTINE_ACTIVE)"
          - "Exists COMPLETED IntakeEvaluation for horse with evaluation_type=MEDICAL and outcome=PASS (ERR_INVALID_STATE)"
          - "If bonded_companion_id set: companion Horse.status IN {ADOPTABLE, ADOPTION_PENDING} (ERR_BONDED_PAIR_VIOLATION)"
        side_effects:
          - "Horse.current_location := MAIN_PASTURE"
          - "Horse.version += 1"
      - from: REHABILITATION
        to: ADOPTABLE
        trigger: "POST /rescue-ops/horses/{id}/graduate-rehabilitation"
        actor: Veterinarian
        preconditions:
          - "Horse.status == REHABILITATION (ERR_INVALID_STATE)"
          - "Exists RehabilitationPlan for horse with status == COMPLETED and no plan in {DRAFT, ACTIVE} (ERR_INVALID_STATE)"
          - "Exists COMPLETED MEDICAL IntakeEvaluation with outcome=PASS and evaluation_date within 30 days of now (ERR_INVALID_STATE)"
          - "If bonded_companion_id set: companion Horse.status IN {ADOPTABLE, ADOPTION_PENDING} (ERR_BONDED_PAIR_VIOLATION)"
        side_effects:
          - "Horse.current_location := MAIN_PASTURE"
          - "Horse.version += 1"
      - from: REHABILITATION
        to: SANCTUARY
        trigger: "POST /rescue-ops/horses/{id}/designate-sanctuary"
        actor: SanctuaryDirector
        preconditions:
          - "Horse.status == REHABILITATION (ERR_INVALID_STATE)"
        side_effects:
          - "Horse.current_location := SANCTUARY_PASTURE"
          - "Horse.version += 1"
      - from: ADOPTABLE
        to: ADOPTION_PENDING
        trigger: "POST /rescue-ops/adoption-applications/{id}/approve (system cascade on the application's horse)"
        actor: system
        preconditions:
          - "Horse.status == ADOPTABLE (ERR_HORSE_NOT_ADOPTABLE)"
        side_effects:
          - "Horse.active_application_id := approved application id"
          - "Horse.version += 1"
      - from: ADOPTION_PENDING
        to: ADOPTED
        trigger: "POST /rescue-ops/adoption-applications/{id}/finalize (system cascade on the application's horse)"
        actor: system
        preconditions:
          - "Horse.status == ADOPTION_PENDING AND Horse.active_application_id == this application (ERR_INVALID_STATE)"
        side_effects:
          - "Horse.current_location := OFFSITE_ADOPTED"
          - "Horse.active_application_id := null"
          - "Horse's ACTIVE StallAssignment -> ENDED with end_date := application.proposed_pickup_date"
          - "All Sponsorships of this horse in {PLEDGED, ACTIVE, LAPSED} -> COMPLETED with completion_reason=ADOPTED; each such completion triggers Sponsor.status recompute (ACTIVE iff any remaining sponsorship in {PLEDGED, ACTIVE, LAPSED}, else INACTIVE)"
          - "If application.adopt_with_bonded_companion: bonded companion Horse ADOPTABLE -> ADOPTED with the same sponsorship/stall cascades"
          - "All OTHER AdoptionApplications for this horse in {SUBMITTED, UNDER_REVIEW, HOME_CHECK_SCHEDULED, HOME_CHECK_PASSED} -> REJECTED with decision_reason=SUPERSEDED_BY_FINALIZED_ADOPTION"
          - "Auto-create FollowUpVisits DAY_30/DAY_90/DAY_180 with scheduled_date = finalized_at + 30/90/180 days"
          - "Horse.version += 1"
      - from: ADOPTION_PENDING
        to: ADOPTABLE
        trigger: "POST /rescue-ops/adoption-applications/{id}/reject or /withdraw of the active application (system cascade)"
        actor: system
        preconditions:
          - "Horse.active_application_id == that application"
        side_effects:
          - "Horse.active_application_id := null"
          - "Horse.version += 1"
      - from: ADOPTED
        to: REHABILITATION
        trigger: "POST /rescue-ops/follow-up-visits/{id}/complete with outcome=FAILED (return cascade, link 2)"
        actor: system
        preconditions:
          - "Horse.status == ADOPTED; owning application just left FINALIZED via failed follow-up"
        side_effects:
          - "Horse.current_location := QUARANTINE_STALL"
          - "Auto-create QuarantineProtocol(ACTIVE, min_days=14, reason=AUTO_RETURN, start_date=now) for the horse (return cascade, link 3)"
          - "Horse.version += 1"
      - from: REHABILITATION
        to: QUARANTINE
        trigger: "POST /rescue-ops/horses/{id}/quarantine"
        actor: IntakeCoordinator
        preconditions:
          - "Horse.status IN {REHABILITATION, ADOPTABLE, SANCTUARY} (ERR_INVALID_STATE)"
        side_effects:
          - "Create QuarantineProtocol(ACTIVE, min_days from input, reason from input, start_date=now)"
          - "Horse.current_location := QUARANTINE_STALL"
          - "Horse's CareServiceAppointments in {REQUESTED, CONFIRMED} -> CANCELLED with cancellation_reason=QUARANTINE_REENTRY"
          - "Horse.version += 1"
      - from: ADOPTABLE
        to: QUARANTINE
        trigger: "POST /rescue-ops/horses/{id}/quarantine"
        actor: IntakeCoordinator
        preconditions:
          - "Horse.status IN {REHABILITATION, ADOPTABLE, SANCTUARY} (ERR_INVALID_STATE)"
        side_effects:
          - "Create QuarantineProtocol(ACTIVE, min_days from input, reason from input, start_date=now)"
          - "Horse.current_location := QUARANTINE_STALL"
          - "Horse's CareServiceAppointments in {REQUESTED, CONFIRMED} -> CANCELLED with cancellation_reason=QUARANTINE_REENTRY"
          - "Horse.version += 1"
      - from: SANCTUARY
        to: QUARANTINE
        trigger: "POST /rescue-ops/horses/{id}/quarantine"
        actor: IntakeCoordinator
        preconditions:
          - "Horse.status IN {REHABILITATION, ADOPTABLE, SANCTUARY} (ERR_INVALID_STATE)"
        side_effects:
          - "Create QuarantineProtocol(ACTIVE, min_days from input, reason from input, start_date=now)"
          - "Horse.current_location := QUARANTINE_STALL"
          - "Horse's CareServiceAppointments in {REQUESTED, CONFIRMED} -> CANCELLED with cancellation_reason=QUARANTINE_REENTRY"
          - "Horse.version += 1"
      - from: REHABILITATION
        to: END_OF_LIFE_REVIEW
        trigger: "POST /rescue-ops/euthanasia-cases (system cascade on case creation)"
        actor: system
        preconditions:
          - "Horse.status IN {REHABILITATION, ADOPTABLE, ADOPTION_PENDING, SANCTUARY} (ERR_INVALID_STATE; QUARANTINE and ADOPTED excluded)"
        side_effects:
          - "Horse.prior_status := current status; Horse.status := END_OF_LIFE_REVIEW"
          - "Horse.version += 1"
      - from: ADOPTABLE
        to: END_OF_LIFE_REVIEW
        trigger: "POST /rescue-ops/euthanasia-cases (system cascade on case creation)"
        actor: system
        preconditions:
          - "Horse.status IN {REHABILITATION, ADOPTABLE, ADOPTION_PENDING, SANCTUARY} (ERR_INVALID_STATE)"
        side_effects:
          - "Horse.prior_status := current status; Horse.status := END_OF_LIFE_REVIEW"
          - "Horse.version += 1"
      - from: ADOPTION_PENDING
        to: END_OF_LIFE_REVIEW
        trigger: "POST /rescue-ops/euthanasia-cases (system cascade on case creation)"
        actor: system
        preconditions:
          - "Horse.status IN {REHABILITATION, ADOPTABLE, ADOPTION_PENDING, SANCTUARY} (ERR_INVALID_STATE)"
        side_effects:
          - "Horse.prior_status := current status; Horse.status := END_OF_LIFE_REVIEW"
          - "Horse.version += 1"
      - from: SANCTUARY
        to: END_OF_LIFE_REVIEW
        trigger: "POST /rescue-ops/euthanasia-cases (system cascade on case creation)"
        actor: system
        preconditions:
          - "Horse.status IN {REHABILITATION, ADOPTABLE, ADOPTION_PENDING, SANCTUARY} (ERR_INVALID_STATE)"
        side_effects:
          - "Horse.prior_status := current status; Horse.status := END_OF_LIFE_REVIEW"
          - "Horse.version += 1"
      - from: END_OF_LIFE_REVIEW
        to: REHABILITATION
        trigger: "POST /rescue-ops/euthanasia-cases/{id}/overturn (system cascade; restores prior_status)"
        actor: system
        preconditions:
          - "Case OVERRIDDEN and Horse.prior_status == REHABILITATION"
        side_effects:
          - "Horse.status := prior_status; prior_status := null; location restored (REHAB_PADDOCK / MAIN_PASTURE / MAIN_PASTURE / SANCTUARY_PASTURE by prior status)"
          - "Horse.version += 1"
      - from: END_OF_LIFE_REVIEW
        to: ADOPTABLE
        trigger: "POST /rescue-ops/euthanasia-cases/{id}/overturn (system cascade; restores prior_status)"
        actor: system
        preconditions:
          - "Case OVERRIDDEN and Horse.prior_status == ADOPTABLE"
        side_effects:
          - "Horse.status := prior_status; prior_status := null; current_location := MAIN_PASTURE"
          - "Horse.version += 1"
      - from: END_OF_LIFE_REVIEW
        to: ADOPTION_PENDING
        trigger: "POST /rescue-ops/euthanasia-cases/{id}/overturn (system cascade; restores prior_status)"
        actor: system
        preconditions:
          - "Case OVERRIDDEN and Horse.prior_status == ADOPTION_PENDING"
        side_effects:
          - "Horse.status := prior_status; prior_status := null; current_location := MAIN_PASTURE"
          - "Horse.version += 1"
      - from: END_OF_LIFE_REVIEW
        to: SANCTUARY
        trigger: "POST /rescue-ops/euthanasia-cases/{id}/overturn (system cascade; restores prior_status)"
        actor: system
        preconditions:
          - "Case OVERRIDDEN and Horse.prior_status == SANCTUARY"
        side_effects:
          - "Horse.status := prior_status; prior_status := null; current_location := SANCTUARY_PASTURE"
          - "Horse.version += 1"
      - from: END_OF_LIFE_REVIEW
        to: DECEASED
        trigger: "POST /rescue-ops/euthanasia-cases/{id}/execute (system cascade)"
        actor: system
        preconditions:
          - "Case just transitioned to EXECUTED"
        side_effects:
          - "Horse.prior_status := null; current_location := NOT_APPLICABLE"
          - "All Sponsorships of horse in {PLEDGED, ACTIVE, LAPSED} -> CANCELLED with cancellation_reason=HORSE_DECEASED; each cancellation triggers Sponsor.status recompute"
          - "SanctuaryCarePlans of horse in {DRAFT, APPROVED} -> CLOSED"
          - "Horse's CareServiceAppointments in {REQUESTED, CONFIRMED} -> CANCELLED with cancellation_reason=HORSE_DECEASED"
          - "Horse's ACTIVE StallAssignment -> ENDED with end_date=now"
          - "Horse.version += 1"
        note: "DECEASED is terminal: no further transitions; all mutation endpoints on the horse fail with ERR_INVALID_STATE"

  - entity: IntakeEvaluation
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /rescue-ops/intake-evaluations/{id}/complete"
        actor: Veterinarian | Farrier | IntakeCoordinator
        preconditions:
          - "Evaluation.status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "evaluation_date := now; completed_by_user_id := caller; outcome := input"
          - "If evaluation_type == MEDICAL and outcome == FAIL and the horse has an ACTIVE QuarantineProtocol: extension_days += 7"

  - entity: QuarantineProtocol
    initial_state: ACTIVE
    terminal_states: [CLEARED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /rescue-ops/daily-health-logs with temp_f >= 103.0 (auto fever extension, cascade link 1) OR POST /rescue-ops/quarantine-protocols/{id}/extend"
        actor: system | IntakeCoordinator | Veterinarian
        preconditions:
          - "Protocol.status == ACTIVE (ERR_INVALID_STATE for extend)"
        side_effects:
          - "extension_days += 7 (fever log) or += input days (manual extend)"
      - from: ACTIVE
        to: CLEARED
        trigger: "POST /rescue-ops/quarantine-protocols/{id}/clear"
        actor: Veterinarian
        preconditions:
          - "Protocol.status == ACTIVE (ERR_INVALID_STATE)"
          - "now >= start_date + (min_days + extension_days) days (ERR_RELEASE_DATE_NOT_REACHED)"
          - "Exists COMPLETED MEDICAL IntakeEvaluation for horse with evaluation_date within 48h of now (ERR_CLEARANCE_EXAM_STALE)"
          - "No DailyHealthLog for horse with temp_f >= 103.0 recorded within trailing 72h of now (ERR_FEVER_WITHIN_72H)"
        side_effects:
          - "cleared_at := now"

  - entity: RehabilitationPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /rescue-ops/rehabilitation-plans/{id}/activate"
        actor: Veterinarian
        preconditions:
          - "Plan.status == DRAFT (ERR_INVALID_STATE)"
          - "Horse.status == REHABILITATION (ERR_INVALID_STATE)"
          - "No other ACTIVE RehabilitationPlan for the horse (ERR_INVALID_STATE)"
        side_effects:
          - "activated_at := now"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /rescue-ops/rehabilitation-plans/{id}/complete"
        actor: Veterinarian
        preconditions:
          - "Plan.status == ACTIVE (ERR_INVALID_STATE)"
          - "No CareServiceAppointment with rehab_plan_id == plan.id in {REQUESTED, CONFIRMED} (ERR_PLAN_HAS_OPEN_APPOINTMENTS)"
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /rescue-ops/rehabilitation-plans (system cascade: creating a new plan supersedes the horse's current ACTIVE plan)"
        actor: system
        preconditions:
          - "New plan creation succeeded against expected_horse_version"
        side_effects: []
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /rescue-ops/rehabilitation-plans (system cascade)"
        actor: system
        preconditions:
          - "New plan creation succeeded against expected_horse_version"
        side_effects: []

  - entity: CareServiceAppointment
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /rescue-ops/care-service-appointments/{id}/confirm"
        actor: Veterinarian | Farrier
        preconditions:
          - "Appointment.status == REQUESTED (ERR_INVALID_STATE)"
          - "Caller X-User-ID == appointment.practitioner_id and caller role matches that practitioner's specialty (ERR_FORBIDDEN)"
          - "Practitioner.active == true (ERR_INVALID_STATE)"
          - "Horse.status NOT IN {ADOPTED, DECEASED, END_OF_LIFE_REVIEW} (ERR_HORSE_NOT_RESIDENT)"
        side_effects: []
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /rescue-ops/care-service-appointments/{id}/complete"
        actor: Veterinarian | Farrier
        preconditions:
          - "Appointment.status == CONFIRMED (ERR_INVALID_STATE)"
          - "Caller X-User-ID == appointment.practitioner_id (ERR_FORBIDDEN)"
        side_effects:
          - "billing_status := BILLED; actual_cost_cents := input"
          - "If rehab_plan_id set and that plan is ACTIVE: plan.completed_visit_count += 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /rescue-ops/care-service-appointments/{id}/cancel, or cascades (quarantine re-entry, practitioner deactivation, euthanasia execution)"
        actor: IntakeCoordinator | Veterinarian | system
        preconditions:
          - "Appointment.status IN {REQUESTED, CONFIRMED} (ERR_INVALID_STATE)"
        side_effects:
          - "billing_status remains UNBILLED (no charge on cancellation)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /rescue-ops/care-service-appointments/{id}/cancel, or cascades (practitioner deactivation, euthanasia execution)"
        actor: IntakeCoordinator | Veterinarian | system
        preconditions:
          - "Appointment.status IN {REQUESTED, CONFIRMED} (ERR_INVALID_STATE)"
        side_effects:
          - "billing_status remains UNBILLED"
        note: "Parallel dimension: billing_status UNBILLED->BILLED evolves independently of REQUESTED/CONFIRMED movement; COMPLETED requires CONFIRMED and sets BILLED atomically"

  - entity: StallAssignment
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: ENDED
        trigger: "POST /rescue-ops/stall-assignments/{id}/end, or cascades (adoption finalize -> end_date=pickup; euthanasia execute -> end_date=now)"
        actor: IntakeCoordinator | system
        preconditions:
          - "Assignment.status == ACTIVE (ERR_INVALID_STATE)"
          - "end_date >= start_date (ERR_INVALID_REQUEST)"
        side_effects: []

  - entity: AdoptionApplication
    initial_state: SUBMITTED
    terminal_states: [FINALIZED, RETURN_COMPLETED, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /rescue-ops/adoption-applications/{id}/start-review"
        actor: AdoptionOfficer
        preconditions:
          - "Application.status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: HOME_CHECK_SCHEDULED
        trigger: "POST /rescue-ops/home-checks (system cascade on home check creation)"
        actor: system
        preconditions:
          - "Application.status == UNDER_REVIEW (ERR_INVALID_STATE)"
          - "home_check_attempts < 2 (ERR_HOME_CHECK_LIMIT_EXCEEDED)"
        side_effects:
          - "home_check_attempts += 1"
      - from: HOME_CHECK_SCHEDULED
        to: HOME_CHECK_PASSED
        trigger: "POST /rescue-ops/home-checks/{id}/complete with outcome=PASSED"
        actor: AdoptionOfficer
        preconditions:
          - "Application.status == HOME_CHECK_SCHEDULED and this is its latest HomeCheck (ERR_INVALID_STATE)"
        side_effects: []
      - from: HOME_CHECK_SCHEDULED
        to: UNDER_REVIEW
        trigger: "POST /rescue-ops/home-checks/{id}/complete with outcome=FAILED or CONDITIONAL (retry loop)"
        actor: AdoptionOfficer
        preconditions:
          - "Application.status == HOME_CHECK_SCHEDULED (ERR_INVALID_STATE)"
          - "If outcome == FAILED and home_check_attempts == 2: application instead -> REJECTED (see auto-reject)"
        side_effects:
          - "On FAILED with home_check_attempts == 2: application -> REJECTED with decision_reason=HOME_CHECK_LIMIT (auto-reject bypasses the loop)"
      - from: HOME_CHECK_PASSED
        to: APPROVED
        trigger: "POST /rescue-ops/adoption-applications/{id}/approve"
        actor: AdoptionOfficer
        preconditions:
          - "Application.status == HOME_CHECK_PASSED (ERR_INVALID_STATE)"
          - "Horse.status == ADOPTABLE (ERR_HORSE_NOT_ADOPTABLE)"
          - "Adopter.status == ACTIVE (ERR_ADOPTER_BLOCKED)"
          - "Caller X-User-ID != completed_by_user_id of the passed HomeCheck (ERR_DUTY_SEGREGATION)"
          - "Latest COMPLETED HomeCheck.completed_at within 180 days of now (ERR_HOME_CHECK_EXPIRED)"
          - "No OTHER application for same horse in {UNDER_REVIEW, HOME_CHECK_SCHEDULED, HOME_CHECK_PASSED} with submitted_at strictly earlier than this application's submitted_at (ERR_APPLICATION_PRECEDENCE_BLOCKED; equal timestamps do not block)"
          - "If adopt_with_bonded_companion: companion Horse.status == ADOPTABLE (ERR_BONDED_PAIR_VIOLATION)"
        side_effects:
          - "quoted_fee_cents := adoption_fee_calculation QUOTED variant (snapshot)"
          - "approved_at := now"
          - "Horse ADOPTABLE -> ADOPTION_PENDING with active_application_id := this application"
      - from: APPROVED
        to: FINALIZED
        trigger: "POST /rescue-ops/adoption-applications/{id}/finalize"
        actor: AdoptionOfficer
        preconditions:
          - "Application.status == APPROVED (ERR_INVALID_STATE)"
          - "now >= approved_at + 72h (ERR_COOLING_OFF_ACTIVE)"
          - "final_fee_cents (FINAL variant recompute) == fee_paid_cents (ERR_ADOPTION_FEE_UNPAID)"
          - "proposed_pickup_date <= now + 14 days (ERR_PICKUP_WINDOW_EXCEEDED)"
          - "If adopt_with_bonded_companion: companion Horse.status == ADOPTABLE (ERR_BONDED_PAIR_VIOLATION)"
        side_effects:
          - "final_fee_cents := adoption_fee_calculation FINAL variant (recomputed with current sponsorship data; may differ from quoted_fee_cents)"
          - "finalized_at := now"
          - "Horse ADOPTION_PENDING -> ADOPTED cascade (see Horse machine: stall end, sponsorship completion, sponsor recompute, competing application auto-reject, follow-up auto-creation)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /rescue-ops/adoption-applications/{id}/reject"
        actor: AdoptionOfficer
        preconditions:
          - "Application.status IN {SUBMITTED, UNDER_REVIEW, HOME_CHECK_SCHEDULED, HOME_CHECK_PASSED, APPROVED} (ERR_INVALID_STATE)"
        side_effects:
          - "If was APPROVED: Horse ADOPTION_PENDING -> ADOPTABLE, active_application_id cleared"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /rescue-ops/adoption-applications/{id}/reject"
        actor: AdoptionOfficer
        preconditions:
          - "Application.status IN {SUBMITTED, UNDER_REVIEW, HOME_CHECK_SCHEDULED, HOME_CHECK_PASSED, APPROVED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: HOME_CHECK_SCHEDULED
        to: REJECTED
        trigger: "POST /rescue-ops/adoption-applications/{id}/reject"
        actor: AdoptionOfficer
        preconditions:
          - "Application.status IN {SUBMITTED, UNDER_REVIEW, HOME_CHECK_SCHEDULED, HOME_CHECK_PASSED, APPROVED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: HOME_CHECK_PASSED
        to: REJECTED
        trigger: "POST /rescue-ops/adoption-applications/{id}/reject"
        actor: AdoptionOfficer
        preconditions:
          - "Application.status IN {SUBMITTED, UNDER_REVIEW, HOME_CHECK_SCHEDULED, HOME_CHECK_PASSED, APPROVED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: APPROVED
        to: REJECTED
        trigger: "POST /rescue-ops/adoption-applications/{id}/reject"
        actor: AdoptionOfficer
        preconditions:
          - "Application.status IN {SUBMITTED, UNDER_REVIEW, HOME_CHECK_SCHEDULED, HOME_CHECK_PASSED, APPROVED} (ERR_INVALID_STATE)"
        side_effects:
          - "Horse ADOPTION_PENDING -> ADOPTABLE, active_application_id cleared"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /rescue-ops/adoption-applications/{id}/withdraw"
        actor: Adopter
        preconditions:
          - "Caller X-User-ID == application.adopter_id (ERR_FORBIDDEN)"
          - "Application.status IN {SUBMITTED, UNDER_REVIEW, HOME_CHECK_SCHEDULED, HOME_CHECK_PASSED, APPROVED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /rescue-ops/adoption-applications/{id}/withdraw"
        actor: Adopter
        preconditions:
          - "Caller X-User-ID == application.adopter_id (ERR_FORBIDDEN)"
          - "Application.status IN {SUBMITTED, UNDER_REVIEW, HOME_CHECK_SCHEDULED, HOME_CHECK_PASSED, APPROVED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: HOME_CHECK_SCHEDULED
        to: WITHDRAWN
        trigger: "POST /rescue-ops/adoption-applications/{id}/withdraw"
        actor: Adopter
        preconditions:
          - "Caller X-User-ID == application.adopter_id (ERR_FORBIDDEN)"
          - "Application.status IN {SUBMITTED, UNDER_REVIEW, HOME_CHECK_SCHEDULED, HOME_CHECK_PASSED, APPROVED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: HOME_CHECK_PASSED
        to: WITHDRAWN
        trigger: "POST /rescue-ops/adoption-applications/{id}/withdraw"
        actor: Adopter
        preconditions:
          - "Caller X-User-ID == application.adopter_id (ERR_FORBIDDEN)"
          - "Application.status IN {SUBMITTED, UNDER_REVIEW, HOME_CHECK_SCHEDULED, HOME_CHECK_PASSED, APPROVED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /rescue-ops/adoption-applications/{id}/withdraw"
        actor: Adopter
        preconditions:
          - "Caller X-User-ID == application.adopter_id (ERR_FORBIDDEN)"
          - "Application.status IN {SUBMITTED, UNDER_REVIEW, HOME_CHECK_SCHEDULED, HOME_CHECK_PASSED, APPROVED} (ERR_INVALID_STATE)"
        side_effects:
          - "Horse ADOPTION_PENDING -> ADOPTABLE, active_application_id cleared"
      - from: FINALIZED
        to: RETURN_COMPLETED
        trigger: "POST /rescue-ops/follow-up-visits/{id}/complete with outcome=FAILED (return cascade, link 1)"
        actor: system
        preconditions:
          - "Application.status == FINALIZED and this visit belongs to it"
        side_effects:
          - "refund_cents := round_half_up(final_fee_cents * 0.5) if now <= finalized_at + 90 days else round_half_up(final_fee_cents * 0.25)"
          - "decision_reason := RETURNED_AFTER_FAILED_FOLLOW_UP"
          - "Horse ADOPTED -> REHABILITATION cascade (link 2 -> auto quarantine link 3)"
          - "Remaining FollowUpVisits of this application in SCHEDULED -> CANCELLED"

  - entity: HomeCheck
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /rescue-ops/home-checks/{id}/complete"
        actor: AdoptionOfficer
        preconditions:
          - "HomeCheck.status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "completed_at := now; completed_by_user_id := caller X-User-ID"
          - "Application transition per outcome (PASSED -> HOME_CHECK_PASSED; FAILED/CONDITIONAL -> UNDER_REVIEW or auto-REJECTED at attempt cap)"

  - entity: FollowUpVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /rescue-ops/follow-up-visits/{id}/complete"
        actor: AdoptionOfficer
        preconditions:
          - "FollowUpVisit.status == SCHEDULED (ERR_INVALID_STATE)"
          - "Application.status == FINALIZED (ERR_INVALID_STATE)"
        side_effects:
          - "completed_at := now"
          - "On outcome=FAILED: application return cascade (FINALIZED -> RETURN_COMPLETED -> horse return -> auto quarantine)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (return cascade on the owning application)"
        actor: system
        preconditions:
          - "Owning application left FINALIZED via return"
        side_effects: []

  - entity: SanctuaryCarePlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, CLOSED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /rescue-ops/sanctuary-care-plans/{id}/approve"
        actor: SanctuaryDirector
        preconditions:
          - "Plan.status == DRAFT (ERR_INVALID_STATE)"
          - "Horse.status == SANCTUARY (ERR_INVALID_STATE)"
        side_effects:
          - "funding_coverage_cents and funding_status recomputed"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /rescue-ops/sanctuary-care-plans (system cascade: new plan supersedes existing DRAFT/APPROVED plan)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /rescue-ops/sanctuary-care-plans (system cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: CLOSED
        trigger: "POST /rescue-ops/sanctuary-care-plans/{id}/close, or euthanasia-execution cascade"
        actor: SanctuaryDirector | system
        preconditions:
          - "Plan.status IN {DRAFT, APPROVED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: APPROVED
        to: CLOSED
        trigger: "POST /rescue-ops/sanctuary-care-plans/{id}/close, or euthanasia-execution cascade"
        actor: SanctuaryDirector | system
        preconditions:
          - "Plan.status IN {DRAFT, APPROVED} (ERR_INVALID_STATE)"
        side_effects: []

  - entity: Sponsorship
    initial_state: PLEDGED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLEDGED
        to: ACTIVE
        trigger: "POST /rescue-ops/sponsorships/{id}/activate"
        actor: Sponsor | SanctuaryDirector
        preconditions:
          - "Sponsorship.status == PLEDGED (ERR_INVALID_STATE)"
          - "Sponsor role caller: X-User-ID == sponsorship.sponsor_id (ERR_FORBIDDEN)"
          - "Horse.status NOT IN {ADOPTED, DECEASED} (ERR_HORSE_NOT_RESIDENT)"
        side_effects:
          - "activated_at := now"
          - "SanctuaryCarePlan funding_coverage_cents recomputed for horse (coverage += pledge if plan in {DRAFT, APPROVED})"
          - "Sponsor.status recomputed (ACTIVE)"
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /rescue-ops/sponsorships/{id}/lapse"
        actor: SanctuaryDirector
        preconditions:
          - "Sponsorship.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "SanctuaryCarePlan funding_coverage_cents recomputed (coverage -= pledge; LAPSED excluded from coverage)"
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /rescue-ops/sponsorships/{id}/reinstate"
        actor: Sponsor | SanctuaryDirector
        preconditions:
          - "Sponsorship.status == LAPSED (ERR_INVALID_STATE)"
          - "Sponsor role caller: X-User-ID == sponsorship.sponsor_id (ERR_FORBIDDEN)"
          - "Horse.status NOT IN {ADOPTED, DECEASED} (ERR_HORSE_NOT_RESIDENT)"
        side_effects:
          - "SanctuaryCarePlan funding_coverage_cents recomputed (coverage += pledge)"
      - from: PLEDGED
        to: CANCELLED
        trigger: "POST /rescue-ops/sponsorships/{id}/cancel, or euthanasia-execution cascade"
        actor: Sponsor | SanctuaryDirector | system
        preconditions:
          - "Sponsorship.status IN {PLEDGED, ACTIVE, LAPSED} (ERR_INVALID_STATE)"
          - "Sponsor role caller: X-User-ID == sponsorship.sponsor_id (ERR_FORBIDDEN)"
        side_effects:
          - "If was ACTIVE: funding_coverage_cents recomputed (coverage -= pledge)"
          - "Sponsor.status recomputed"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /rescue-ops/sponsorships/{id}/cancel, or euthanasia-execution cascade"
        actor: Sponsor | SanctuaryDirector | system
        preconditions:
          - "Sponsorship.status IN {PLEDGED, ACTIVE, LAPSED} (ERR_INVALID_STATE)"
        side_effects:
          - "funding_coverage_cents recomputed (coverage -= pledge)"
          - "Sponsor.status recomputed"
      - from: LAPSED
        to: CANCELLED
        trigger: "POST /rescue-ops/sponsorships/{id}/cancel, or euthanasia-execution cascade"
        actor: Sponsor | SanctuaryDirector | system
        preconditions:
          - "Sponsorship.status IN {PLEDGED, ACTIVE, LAPSED} (ERR_INVALID_STATE)"
        side_effects:
          - "Sponsor.status recomputed"
      - from: PLEDGED
        to: COMPLETED
        trigger: "system (adoption finalize cascade on the horse)"
        actor: system
        preconditions:
          - "Horse transitioned to ADOPTED"
        side_effects:
          - "completion_reason := ADOPTED; Sponsor.status recomputed"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (adoption finalize cascade on the horse)"
        actor: system
        preconditions:
          - "Horse transitioned to ADOPTED"
        side_effects:
          - "completion_reason := ADOPTED; if horse has care plan: funding_coverage_cents recomputed (coverage -= pledge); Sponsor.status recomputed"
      - from: LAPSED
        to: COMPLETED
        trigger: "system (adoption finalize cascade on the horse)"
        actor: system
        preconditions:
          - "Horse transitioned to ADOPTED"
        side_effects:
          - "completion_reason := ADOPTED; Sponsor.status recomputed"

  - entity: PurchaseOrder
    initial_state: DRAFT
    terminal_states: [RECEIVED]
    transitions:
      - from: DRAFT
        to: ORDERED
        trigger: "POST /rescue-ops/purchase-orders/{id}/mark-ordered"
        actor: BarnManager
        preconditions:
          - "PurchaseOrder.status == DRAFT (ERR_INVALID_STATE)"
        side_effects: []
      - from: ORDERED
        to: PARTIALLY_RECEIVED
        trigger: "POST /rescue-ops/purchase-orders/{id}/receive with cumulative received_lbs < quantity_lbs"
        actor: BarnManager
        preconditions:
          - "PurchaseOrder.status IN {ORDERED, PARTIALLY_RECEIVED} (ERR_INVALID_STATE)"
          - "received_lbs + input quantity_received_lbs <= quantity_lbs (ERR_OVER_RECEIPT)"
        side_effects:
          - "Create FeedLot(initial_lbs = quantity_lbs input, quantity_lbs = same, expiry_date from input, feed_type and unit_cents_per_lb copied)"
          - "received_lbs += input; actual_total_cents += FeedLot.lot_cost_cents (per-lot rounding, pinned order)"
      - from: PARTIALLY_RECEIVED
        to: PARTIALLY_RECEIVED
        trigger: "POST /rescue-ops/purchase-orders/{id}/receive with cumulative received_lbs < quantity_lbs"
        actor: BarnManager
        preconditions:
          - "PurchaseOrder.status IN {ORDERED, PARTIALLY_RECEIVED} (ERR_INVALID_STATE)"
          - "received_lbs + input quantity_received_lbs <= quantity_lbs (ERR_OVER_RECEIPT)"
        side_effects:
          - "Create FeedLot as above; received_lbs += input; actual_total_cents += lot_cost_cents"
      - from: ORDERED
        to: RECEIVED
        trigger: "POST /rescue-ops/purchase-orders/{id}/receive with cumulative received_lbs == quantity_lbs"
        actor: BarnManager
        preconditions:
          - "PurchaseOrder.status IN {ORDERED, PARTIALLY_RECEIVED} (ERR_INVALID_STATE)"
          - "received_lbs + input quantity_received_lbs <= quantity_lbs (ERR_OVER_RECEIPT)"
        side_effects:
          - "Create FeedLot as above; received_lbs += input; actual_total_cents += lot_cost_cents"
          - "delivery_surcharge_cents := round_half_up(actual_total_cents * 0.08); grand_total_cents := actual_total_cents + delivery_surcharge_cents"
      - from: PARTIALLY_RECEIVED
        to: RECEIVED
        trigger: "POST /rescue-ops/purchase-orders/{id}/receive with cumulative received_lbs == quantity_lbs"
        actor: BarnManager
        preconditions:
          - "PurchaseOrder.status IN {ORDERED, PARTIALLY_RECEIVED} (ERR_INVALID_STATE)"
          - "received_lbs + input quantity_received_lbs <= quantity_lbs (ERR_OVER_RECEIPT)"
        side_effects:
          - "Create FeedLot as above; received_lbs += input; actual_total_cents += lot_cost_cents"
          - "delivery_surcharge_cents := round_half_up(actual_total_cents * 0.08); grand_total_cents := actual_total_cents + delivery_surcharge_cents"

  - entity: BarnShift
    initial_state: OPEN
    terminal_states: [COMPLETED, NO_SHOW]
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "POST /rescue-ops/barn-shifts/{id}/claim"
        actor: Volunteer
        preconditions:
          - "Shift.status == OPEN (ERR_INVALID_STATE)"
          - "Caller X-User-ID references a Volunteer with status == ACTIVE (ERR_VOLUNTEER_NOT_ACTIVE)"
          - "Volunteer.reliability_score >= 40 (ERR_RELIABILITY_TOO_LOW)"
          - "required_skill == ANY or required_skill IN caller volunteer.skills (ERR_SKILL_MISMATCH)"
          - "No other ASSIGNED shift for this volunteer on same shift_date with half-open time overlap [start_time, end_time) (ERR_SHIFT_OVERLAP; adjacent back-to-back allowed, no buffer)"
        side_effects:
          - "volunteer_id := caller X-User-ID"
      - from: ASSIGNED
        to: OPEN
        trigger: "POST /rescue-ops/barn-shifts/{id}/release"
        actor: Volunteer
        preconditions:
          - "Shift.status == ASSIGNED (ERR_INVALID_STATE)"
          - "Caller X-User-ID == shift.volunteer_id (ERR_FORBIDDEN)"
        side_effects:
          - "volunteer_id := null"
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /rescue-ops/barn-shifts/{id}/complete"
        actor: VolunteerCoordinator
        preconditions:
          - "Shift.status == ASSIGNED (ERR_INVALID_STATE)"
        side_effects:
          - "Volunteer.completed_shift_count += 1; reliability_score recomputed"
      - from: ASSIGNED
        to: NO_SHOW
        trigger: "POST /rescue-ops/barn-shifts/{id}/mark-no-show"
        actor: VolunteerCoordinator
        preconditions:
          - "Shift.status == ASSIGNED (ERR_INVALID_STATE)"
        side_effects:
          - "Volunteer.no_show_count += 1; reliability_score recomputed"
          - "If recomputed reliability_score < 20: Volunteer.status := SUSPENDED"

  - entity: EuthanasiaCase
    initial_state: PROPOSED
    terminal_states: [EXECUTED, OVERRIDDEN]
    transitions:
      - from: PROPOSED
        to: CERTIFIED
        trigger: "POST /rescue-ops/euthanasia-cases/{id}/certify with decision=CONCUR"
        actor: Veterinarian
        preconditions:
          - "Case.status == PROPOSED (ERR_INVALID_STATE)"
          - "Caller X-User-ID != case.proposing_practitioner_id (ERR_DUTY_SEGREGATION)"
          - "Caller X-User-ID references an ACTIVE Practitioner with specialty VETERINARIAN (ERR_FORBIDDEN)"
        side_effects:
          - "certifying_practitioner_id := caller X-User-ID"
          - "If suffering_score >= 8 AND input emergency_attestation == true: emergency_certified := true"
      - from: PROPOSED
        to: OVERRIDDEN
        trigger: "POST /rescue-ops/euthanasia-cases/{id}/certify with decision=DISSENT, or POST .../overturn"
        actor: Veterinarian | SanctuaryDirector
        preconditions:
          - "Case.status IN {PROPOSED, CERTIFIED} (ERR_INVALID_STATE)"
          - "DISSENT path: caller X-User-ID != case.proposing_practitioner_id (ERR_DUTY_SEGREGATION)"
        side_effects:
          - "Horse END_OF_LIFE_REVIEW -> prior_status restoration cascade"
      - from: CERTIFIED
        to: OVERRIDDEN
        trigger: "POST /rescue-ops/euthanasia-cases/{id}/overturn"
        actor: SanctuaryDirector
        preconditions:
          - "Case.status IN {PROPOSED, CERTIFIED} (ERR_INVALID_STATE)"
        side_effects:
          - "Horse END_OF_LIFE_REVIEW -> prior_status restoration cascade"
      - from: CERTIFIED
        to: AUTHORIZED
        trigger: "POST /rescue-ops/euthanasia-cases/{id}/authorize"
        actor: SanctuaryDirector
        preconditions:
          - "Case.status == CERTIFIED (ERR_INVALID_STATE)"
          - "Horse.status == END_OF_LIFE_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "authorized_at := now"
      - from: AUTHORIZED
        to: EXECUTED
        trigger: "POST /rescue-ops/euthanasia-cases/{id}/execute"
        actor: Veterinarian
        preconditions:
          - "Case.status == AUTHORIZED (ERR_INVALID_STATE)"
          - "now >= authorized_at + 72h OR case.emergency_certified == true (ERR_COOLING_OFF_ACTIVE)"
          - "Caller X-User-ID references an ACTIVE Practitioner with specialty VETERINARIAN (ERR_FORBIDDEN)"
        side_effects:
          - "executed_at := now"
          - "Horse END_OF_LIFE_REVIEW -> DECEASED cascade (sponsorships cancel, care plans close, appointments cancel, stall ends)"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: rehab-plan-create-stale-horse
    parent_entity: Horse
    write_endpoint: "POST /rescue-ops/rehabilitation-plans"
    occ_field: expected_horse_version
    description: |
      Creating a RehabilitationPlan supersedes the horse's current ACTIVE or
      DRAFT plan and bumps Horse.version. A create carrying an
      expected_horse_version older than the horse's current version is
      rejected as stale: the caller's view predates the latest plan
      supersession (or any other horse mutation) and must be refreshed.
    error_id: ERR_STALE_HORSE_VERSION
    http_status: 412
  - rule_id: care-plan-create-stale-horse
    parent_entity: Horse
    write_endpoint: "POST /rescue-ops/sanctuary-care-plans"
    occ_field: expected_horse_version
    description: |
      Creating a SanctuaryCarePlan supersedes the horse's existing
      DRAFT/APPROVED plan and bumps Horse.version. A create carrying an
      expected_horse_version older than the horse's current version is
      rejected as stale: the cost basis the caller saw may have shifted.
    error_id: ERR_STALE_HORSE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: daily_feed_ration
    trigger: "Horse creation and every PATCH touching estimated_weight_lbs or body_condition_score"
    algorithm: threshold
    formula: |
      base = estimated_weight_lbs * 0.02
      if body_condition_score <= 3: base = base * 1.30
      elif body_condition_score >= 7: base = base * 0.80
      base = min(base, estimated_weight_lbs * 0.025)
      base = max(base, 4.0)
      daily_feed_ration_lbs = round_half_up(base, 1)
    input_set: "The single Horse being created or patched"
    constants:
      MAINTENANCE_FRACTION: 0.02
      GAIN_FACTOR: 1.30
      REDUCTION_FACTOR: 0.80
      MAX_FRACTION: 0.025
      MIN_RATION_LBS: 4.0
      BCS_GAIN_CEILING: 3
      BCS_REDUCE_FLOOR: 7
    precision: "1 decimal place, round_half_up"

  - name: lifetime_care_cost_projection
    trigger: "SanctuaryCarePlan creation (both variants computed per plan; variant field selects which is stored on the plan)"
    algorithm: forward_looking
    formula: |
      LIFESPAN_YEARS = {LIGHT: 25, DRAFT: 22, PONY: 28}
      projected_months M = (LIFESPAN_YEARS[breed_class] - age_years) * 12   (reject create if M <= 0: ERR_INVALID_REQUEST)
      STRAIGHT_LINE variant:
        monthly_cost_cents = 38500
        total_lifetime_cost_cents = M * 38500
      ACTUARIAL variant:
        band_cost(age): <15 -> 38500; [15,20) -> 45200; [20,25) -> 52800; >=25 -> 61500
        annual_survival(age): <20 -> 0.97; [20,25) -> 0.89; >=25 -> 0.78
        survival(m) = PRODUCT over k=1..m of annual_survival(age + (k-1)/12) ^ (1/12)
        total_raw = SUM over m=1..M of band_cost(age + (m-1)/12) * survival(m)
        total_lifetime_cost_cents = round_half_up(total_raw, 0)   (round ONLY the final sum)
        monthly_cost_cents = round_half_up(total_lifetime_cost_cents / M, 0)
    input_set: "The Horse (age_years, breed_class) the plan is created for; no other entities"
    constants:
      MONTHLY_BASE_CENTS: 38500
      BAND_15_19_CENTS: 45200
      BAND_20_24_CENTS: 52800
      BAND_25_PLUS_CENTS: 61500
      SURVIVAL_UNDER_20: 0.97
      SURVIVAL_20_24: 0.89
      SURVIVAL_25_PLUS: 0.78
    precision: "0 decimal places on stored outputs, round_half_up; intermediate survival/cost values unrounded"
    variants:
      - name: STRAIGHT_LINE
        when: "plan.variant == STRAIGHT_LINE"
        difference: "Flat 38500 cents/month with no mortality weighting; totals exceed ACTUARIAL for young horses"
      - name: ACTUARIAL
        when: "plan.variant == ACTUARIAL"
        difference: "Age-band cost escalation multiplied by compounded monthly survival; totals diverge from STRAIGHT_LINE for identical horse data"

  - name: adoption_fee_calculation
    trigger: "QUOTED variant at POST /adoption-applications/{id}/approve (snapshot to quoted_fee_cents); FINAL variant at POST /adoption-applications/{id}/finalize (recompute to final_fee_cents)"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is pinned (1) -> (4):
      (1) per-horse base by age_years band: <2 -> 95000; 2..14 -> 85000; 15..19 -> 60000; >=20 -> 35000
          + training adjustment: TRAINED_RIDDEN +15000; GREEN -10000; UNHANDLED -20000
          + rehab_bonus: +5000 iff horse has a RehabilitationPlan with status COMPLETED
      (2) pair rule: if adopt_with_bonded_companion: fee = round_half_up((fee_primary + fee_companion) * 0.75, 0)
          where fee_companion is step (1) computed on the bonded companion horse
      (3) sponsor subsidy: if SUM(monthly_pledge_cents over horse's ACTIVE Sponsorships) >= 19250
          then fee = round_half_up(fee * 0.90, 0)  (applied to primary horse's sponsorships only)
      (4) result is integer cents; all inputs are exact multiples of 1 cent, rounding is a no-op for valid data but pinned
      QUOTED uses sponsorship/horses state at approve time; FINAL recomputes with state at finalize time.
    input_set: "Primary Horse, its bonded companion Horse when pair flag set, horse's ACTIVE Sponsorships at evaluation instant, horse's RehabilitationPlans (COMPLETED check)"
    constants:
      BASE_FOAL_CENTS: 95000
      BASE_PRIME_CENTS: 85000
      BASE_SENIOR_CENTS: 60000
      BASE_GERIATRIC_CENTS: 35000
      TRAINED_RIDDEN_ADJ_CENTS: 15000
      GREEN_ADJ_CENTS: -10000
      UNHANDLED_ADJ_CENTS: -20000
      REHAB_BONUS_CENTS: 5000
      PAIR_FACTOR: 0.75
      SUBSIDY_FACTOR: 0.90
      SUBSIDY_COVERAGE_THRESHOLD_CENTS: 19250
    precision: "0 decimal places, round_half_up"
    variants:
      - name: QUOTED
        when: "at approve; frozen to quoted_fee_cents"
        difference: "Evaluated against sponsorship and companion state as of approved_at"
      - name: FINAL
        when: "at finalize; written to final_fee_cents and enforced against fee_paid_cents"
        difference: "Recomputed at finalized_at; sponsor lapse/cancellation or companion status change between approve and finalize changes the number"

  - name: feed_supply_projection
    trigger: "GET /rescue-ops/feed-inventory/summary (computed on read, both variants returned per feed_type)"
    algorithm: forward_looking
    formula: |
      resident statuses = {QUARANTINE, REHABILITATION, ADOPTABLE, ADOPTION_PENDING, SANCTUARY, END_OF_LIFE_REVIEW}
      daily_demand_lbs(feed_type) = SUM over resident Horses of ration share:
        hay_share = ration * 0.70
        if body_condition_score <= 3: grass_hay += hay_share * 0.50; alfalfa += hay_share * 0.50
        else: grass_hay += hay_share
        grain += ration * 0.20; supplement += ration * 0.10
      seasonal_multiplier(close-of-computation month): DEC-FEB 1.25; MAR-MAY 1.00; JUN-AUG 0.90; SEP-NOV 1.10
      usable_lbs = SUM(quantity_lbs of FeedLots with expiry_date >= now)
      inbound_ordered_lbs = SUM(quantity_lbs - received_lbs of PurchaseOrders in {ORDERED, PARTIALLY_RECEIVED})
      days_of_supply_tight      = round_half_up(usable_lbs / (daily_demand_lbs * seasonal_multiplier), 2)
      days_of_supply_committed  = round_half_up((usable_lbs + inbound_ordered_lbs) / (daily_demand_lbs * seasonal_multiplier), 2)
      zero-demand guard: if daily_demand_lbs(feed_type) == 0 then days_of_supply_tight = null,
        days_of_supply_committed = null, reorder_required = false
      reorder_required = (days_of_supply_tight < 30)    (strictly less than; exactly 30.00 does NOT trigger)
      daily_demand_lbs stored per feed_type rounded round_half_up(..., 2) in the summary
    input_set: "All Horses in resident statuses (ADOPTED and DECEASED excluded), all FeedLots, PurchaseOrders in {ORDERED, PARTIALLY_RECEIVED}"
    constants:
      HAY_SHARE: 0.70
      GRAIN_SHARE: 0.20
      SUPPLEMENT_SHARE: 0.10
      LOW_BCS_HAY_SPLIT: 0.50
      MULT_DEC_FEB: 1.25
      MULT_MAR_MAY: 1.00
      MULT_JUN_AUG: 0.90
      MULT_SEP_NOV: 1.10
      REORDER_DAYS: 30
    precision: "2 decimal places, round_half_up"
    variants:
      - name: TIGHT
        when: "days_of_supply_tight"
        difference: "Excludes inbound open purchase orders — on-hand usable stock only"
      - name: COMMITTED
        when: "days_of_supply_committed"
        difference: "Includes undelivered remainder of ORDERED/PARTIALLY_RECEIVED purchase orders; identical inputs yield a larger figure whenever any order is open"

  - name: purchase_order_cost
    trigger: "PurchaseOrder creation (estimate) and each receive (actual accrual); surcharge at full receipt"
    algorithm: aggregation
    formula: |
      estimated_total_cents (at create) = round_half_up(quantity_lbs * unit_cents_per_lb, 0)     -- single rounding
      per receipt lot: lot_cost_cents = round_half_up(lot.initial_lbs * unit_cents_per_lb, 0)  -- PER-LOT rounding FIRST
      actual_total_cents = SUM(lot_cost_cents over all receipt lots)                            -- sum of rounded lots
      at full receipt: delivery_surcharge_cents = round_half_up(actual_total_cents * 0.08, 0)  -- surcharge on the SUM of rounded lots
      grand_total_cents = actual_total_cents + delivery_surcharge_cents
      Pinned order: per-lot rounding precedes summation; summation precedes surcharge.
      Counter-example this pins against: 3 lots x 333 lbs @ 7.5 cents/lb -> per-lot 2498, actual 7494;
      naive sum-then-round gives 7493 (= estimated_total_cents). The two orders differ by 1 cent.
    input_set: "Receipt lots of the single PurchaseOrder, in receipt order"
    constants:
      SURCHARGE_RATE: 0.08
    precision: "0 decimal places, round_half_up"

  - name: quarantine_release_timing
    trigger: "Evaluated by POST /rescue-ops/quarantine-protocols/{id}/clear"
    algorithm: chronological
    formula: |
      earliest_release = start_date + (min_days + extension_days) days      (now >= earliest_release; equality allowed)
      clearance_exam_ok = exists COMPLETED MEDICAL IntakeEvaluation with evaluation_date >= now - 48h   (exactly 48h allowed)
      fever_clear = no DailyHealthLog with temp_f >= 103.0 and recorded_at >= now - 72h   (a fever log exactly 72h old does NOT block)
      clear allowed iff all three hold
    input_set: "The protocol, the horse's IntakeEvaluations (COMPLETED, MEDICAL), DailyHealthLogs in trailing 72h"
    constants:
      FEVER_THRESHOLD_F: 103.0
      FEVER_EXTENSION_DAYS: 7
      CLEARANCE_EXAM_WINDOW_HOURS: 48
      FEVER_LOOKBACK_HOURS: 72
    precision: "datetime comparisons at minute precision; boundary inclusive for release/exam, exclusive for fever lookback"

  - name: volunteer_reliability
    trigger: "BarnShift complete (completed_shift_count += 1) and mark-no-show (no_show_count += 1); recomputed after each"
    algorithm: decay_function
    formula: |
      reliability_score = clamp(50 + 5 * completed_shift_count - 20 * no_show_count, 0, 100)
      claim gate: reliability_score >= 40 (exactly 40 allowed)
      auto-suspend: after a no-show recompute, if reliability_score < 20 then Volunteer.status := SUSPENDED
    input_set: "The single Volunteer's shift counters"
    constants:
      BASE_SCORE: 50
      COMPLETE_CREDIT: 5
      NO_SHOW_PENALTY: 20
      CLAIM_GATE: 40
      SUSPEND_FLOOR: 20
    precision: "integer arithmetic, exact"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Entity-backed identity resolves: Adopter/Sponsor/Volunteer X-User-ID must be the id of an existing Adopter/Sponsor/Volunteer; Veterinarian/Farrier X-User-ID must be the id of a Practitioner whose specialty matches the role. EXEMPTION: the three registration endpoints (POST /rescue-ops/adopters, POST /rescue-ops/sponsors, POST /rescue-ops/volunteers) are identity-establishing — X-User-ID is not resolved on them; the server mints the id and the caller adopts it thereafter", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Caller role is in the endpoint's roles list", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path template ids exist, resolved left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 5, category: existence, check: "Body FK ids exist: horse_id, adopter_id, practitioner_id, stall_id, sponsor_id, application_id, rehab_plan_id as applicable per endpoint", error_id: ERR_HORSE_NOT_FOUND | ERR_ADOPTER_NOT_FOUND | ERR_PRACTITIONER_NOT_FOUND | ERR_STALL_NOT_FOUND | ERR_SPONSOR_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_REHAB_PLAN_NOT_FOUND, http_status: 404, applies_to: "POST endpoints with FK inputs" }
  - { priority: 6, category: existence, check: "Required request fields present; enums in declared sets; numeric ranges honored (weight>0, BCS 1..9, min_days 1..60, suffering_score 1..10, pledge>=1, times ordered)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all POST/PATCH endpoints" }
  - { priority: 7, category: state, check: "OCC: expected_horse_version equals Horse.version (plan-creation endpoints)", error_id: ERR_STALE_HORSE_VERSION, http_status: 412, applies_to: ["POST /rescue-ops/rehabilitation-plans", "POST /rescue-ops/sanctuary-care-plans"] }
  - { priority: 8, category: state, check: "Target entity in a valid from-state for the requested transition (all state machines; terminal-state lockdown)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 9, category: state, check: "Horse posture gates: application create requires ADOPTABLE (ERR_HORSE_NOT_ADOPTABLE); appointment create/confirm and sponsorship create/activate/reinstate require resident status (ERR_HORSE_NOT_RESIDENT); euthanasia create requires {REHABILITATION, ADOPTABLE, ADOPTION_PENDING, SANCTUARY}", error_id: ERR_HORSE_NOT_ADOPTABLE | ERR_HORSE_NOT_RESIDENT | ERR_INVALID_STATE, http_status: 409, applies_to: ["POST /rescue-ops/adoption-applications", "POST /rescue-ops/care-service-appointments", "POST /rescue-ops/sponsorships", "POST /rescue-ops/euthanasia-cases", "POST /rescue-ops/sponsorships/{id}/activate", "POST /rescue-ops/sponsorships/{id}/reinstate"] }
  - { priority: 10, category: state, check: "Quarantine gates: release requires CLEARED protocol (ERR_QUARANTINE_ACTIVE); re-quarantine while an ACTIVE protocol exists rejected (ERR_QUARANTINE_ACTIVE); close-day on an already-closed date rejected (ERR_DAY_ALREADY_CLOSED)", error_id: ERR_QUARANTINE_ACTIVE | ERR_DAY_ALREADY_CLOSED, http_status: 409, applies_to: ["POST /rescue-ops/horses/{id}/release-quarantine", "POST /rescue-ops/horses/{id}/quarantine", "POST /rescue-ops/feed-inventory/close-day"] }
  - { priority: 11, category: business_safety, check: "Quarantine service restriction: while horse is QUARANTINE, only VET_EXAM appointments may be created", error_id: ERR_QUARANTINE_SERVICE_RESTRICTED, http_status: 422, applies_to: ["POST /rescue-ops/care-service-appointments"] }
  - { priority: 12, category: business_safety, check: "Adopter not BLOCKED (application create and approve)", error_id: ERR_ADOPTER_BLOCKED, http_status: 422, applies_to: ["POST /rescue-ops/adoption-applications", "POST /rescue-ops/adoption-applications/{id}/approve"] }
  - { priority: 13, category: business_safety, check: "Segregation of duties: euthanasia certifier != proposer; adoption approve caller != passed home check's completed_by_user_id", error_id: ERR_DUTY_SEGREGATION, http_status: 422, applies_to: ["POST /rescue-ops/euthanasia-cases/{id}/certify", "POST /rescue-ops/adoption-applications/{id}/approve"] }
  - { priority: 14, category: business_temporal, check: "Practitioner double-booking: same practitioner appointments (REQUESTED/CONFIRMED) must keep >= 15 min gap between half-open intervals", error_id: ERR_APPOINTMENT_OVERLAP, http_status: 422, applies_to: ["POST /rescue-ops/care-service-appointments"] }
  - { priority: 15, category: business_temporal, check: "Stall occupancy: closed-interval date overlap on same stall rejected; QUARANTINE_BARN additionally requires >= 1 full gap day between assignments", error_id: ERR_STALL_OVERLAP | ERR_DISINFECTION_GAP_REQUIRED, http_status: 422, applies_to: ["POST /rescue-ops/stall-assignments"] }
  - { priority: 16, category: business_temporal, check: "Volunteer double-booking: same volunteer's ASSIGNED shifts on a date must not overlap as half-open time intervals (no buffer; adjacent allowed)", error_id: ERR_SHIFT_OVERLAP, http_status: 422, applies_to: ["POST /rescue-ops/barn-shifts/{id}/claim"] }
  - { priority: 17, category: business_temporal, check: "Cooling-off windows: adoption finalize requires approved_at + 72h <= now; euthanasia execute requires authorized_at + 72h <= now unless emergency_certified", error_id: ERR_COOLING_OFF_ACTIVE, http_status: 422, applies_to: ["POST /rescue-ops/adoption-applications/{id}/finalize", "POST /rescue-ops/euthanasia-cases/{id}/execute"] }
  - { priority: 18, category: business_temporal, check: "Document validity windows: passed home check <= 180 days at approve; clearance exam within 48h and no fever in trailing 72h and release date reached at quarantine clear", error_id: ERR_HOME_CHECK_EXPIRED | ERR_CLEARANCE_EXAM_STALE | ERR_FEVER_WITHIN_72H | ERR_RELEASE_DATE_NOT_REACHED, http_status: 422, description: "Within this tier the quarantine-clear sub-checks evaluate in fixed order: ERR_RELEASE_DATE_NOT_REACHED first, then ERR_CLEARANCE_EXAM_STALE, then ERR_FEVER_WITHIN_72H", applies_to: ["POST /rescue-ops/adoption-applications/{id}/approve", "POST /rescue-ops/quarantine-protocols/{id}/clear"] }
  - { priority: 19, category: business_temporal, check: "Pickup window: proposed_pickup_date <= now + 14 days at finalize", error_id: ERR_PICKUP_WINDOW_EXCEEDED, http_status: 422, applies_to: ["POST /rescue-ops/adoption-applications/{id}/finalize"] }
  - { priority: 20, category: business_constraint, check: "Approval precedence: no competing application for same horse in {UNDER_REVIEW, HOME_CHECK_SCHEDULED, HOME_CHECK_PASSED} with strictly earlier submitted_at (ties do not block)", error_id: ERR_APPLICATION_PRECEDENCE_BLOCKED, http_status: 422, applies_to: ["POST /rescue-ops/adoption-applications/{id}/approve"] }
  - { priority: 21, category: business_constraint, check: "Uniqueness: one non-terminal application per (adopter_id, horse_id); stall_code unique; one ACTIVE quarantine protocol per horse", error_id: ERR_DUPLICATE_APPLICATION | ERR_INVALID_REQUEST, http_status: 409, applies_to: ["POST /rescue-ops/adoption-applications", "POST /rescue-ops/stalls", "POST /rescue-ops/horses/{id}/quarantine"] }
  - { priority: 22, category: business_constraint, check: "Bonded pair rules: adopt_with_bonded_companion requires horse.bonded_companion_id set and companion ADOPTABLE at approve and at finalize; releasing a bonded horse to ADOPTABLE requires companion in {ADOPTABLE, ADOPTION_PENDING}", error_id: ERR_BONDED_PAIR_VIOLATION, http_status: 422, applies_to: ["POST /rescue-ops/adoption-applications", "POST /rescue-ops/adoption-applications/{id}/approve", "POST /rescue-ops/adoption-applications/{id}/finalize", "POST /rescue-ops/horses/{id}/release-quarantine", "POST /rescue-ops/horses/{id}/graduate-rehabilitation"] }
  - { priority: 23, category: business_constraint, check: "Specialty/skill/reliability gates: appointment service_type matches practitioner specialty (ERR_SERVICE_SPECIALTY_MISMATCH); shift required_skill in volunteer.skills or ANY (ERR_SKILL_MISMATCH); volunteer ACTIVE (ERR_VOLUNTEER_NOT_ACTIVE) with reliability >= 40 (ERR_RELIABILITY_TOO_LOW)", error_id: ERR_SERVICE_SPECIALTY_MISMATCH | ERR_SKILL_MISMATCH | ERR_VOLUNTEER_NOT_ACTIVE | ERR_RELIABILITY_TOO_LOW, http_status: 422, applies_to: ["POST /rescue-ops/care-service-appointments", "POST /rescue-ops/barn-shifts/{id}/claim"] }
  - { priority: 24, category: business_constraint, check: "Referential completion gates: plan complete requires no open linked appointments (ERR_PLAN_HAS_OPEN_APPOINTMENTS); PO over-receipt rejected (ERR_OVER_RECEIPT); home check attempt cap < 2 (ERR_HOME_CHECK_LIMIT_EXCEEDED); stall zone matches horse posture: QUARANTINE horses only into QUARANTINE_BARN stalls (ERR_STALL_ZONE_MISMATCH); inactive stall rejects assignment (ERR_STALL_ZONE_MISMATCH)", error_id: ERR_PLAN_HAS_OPEN_APPOINTMENTS | ERR_OVER_RECEIPT | ERR_HOME_CHECK_LIMIT_EXCEEDED | ERR_STALL_ZONE_MISMATCH, http_status: 422, applies_to: ["POST /rescue-ops/rehabilitation-plans/{id}/complete", "POST /rescue-ops/purchase-orders/{id}/receive", "POST /rescue-ops/home-checks", "POST /rescue-ops/stall-assignments"] }
  - { priority: 25, category: business_fiscal, check: "Fee settlement: finalize requires fee_paid_cents == FINAL fee recompute (ERR_ADOPTION_FEE_UNPAID); pay-fee amount must be a positive integer (ERR_FEE_AMOUNT_INVALID); pledge minimum 2500 cents (ERR_PLEDGE_BELOW_MINIMUM)", error_id: ERR_ADOPTION_FEE_UNPAID | ERR_FEE_AMOUNT_INVALID | ERR_PLEDGE_BELOW_MINIMUM, http_status: 422, applies_to: ["POST /rescue-ops/adoption-applications/{id}/finalize", "POST /rescue-ops/adoption-applications/{id}/pay-fee", "POST /rescue-ops/sponsorships"] }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- clock (test-driving; default 2026-08-01T00:00:00Z before first set) ----
  - { method: POST, path: "/rescue-ops/_clock/set_current_utc", description: "Advance the logical clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time.", roles: [SanctuaryDirector], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["Logical clock set; all date arithmetic in calculations/validations uses this clock"] }

  # ---- horses ----
  - { method: POST, path: "/rescue-ops/horses", description: "Intake a horse", roles: [IntakeCoordinator], code: 201, input: [name, sex, breed_class, estimated_weight_lbs, age_years, body_condition_score, training_level, "temperament_score?", "bonded_companion_id?", "intake_reason?"], output: Horse, side_effects: ["status=QUARANTINE, current_location=QUARANTINE_STALL", "auto-create QuarantineProtocol(ACTIVE, min_days=14, reason=INTAKE, start_date=now)", "daily_feed_ration_lbs computed (daily_feed_ration)"] }
  - { method: GET, path: "/rescue-ops/horses", description: "List horses with filters and pagination", roles: [SanctuaryDirector, IntakeCoordinator, Veterinarian, Farrier, AdoptionOfficer, BarnManager, VolunteerCoordinator, Adopter, Sponsor], code: 200, input: ["status?", "current_location?", "bonded_companion_id?", "active_application_id?", "limit?", "offset?"], output: "Horse[]", side_effects: [] }
  - { method: GET, path: "/rescue-ops/horses/{id}", description: "Get one horse", roles: [SanctuaryDirector, IntakeCoordinator, Veterinarian, Farrier, AdoptionOfficer, BarnManager, VolunteerCoordinator, Adopter, Sponsor], code: 200, input: [], output: Horse, side_effects: [] }
  - { method: PATCH, path: "/rescue-ops/horses/{id}", description: "Update horse assessment fields; recomputes ration", roles: [IntakeCoordinator, Veterinarian], code: 200, input: ["estimated_weight_lbs?", "body_condition_score?", "temperament_score?", "training_level?", "bonded_companion_id?"], output: Horse, side_effects: ["daily_feed_ration_lbs recomputed when weight or BCS changed", "increments Horse.version by 1"] }
  - { method: POST, path: "/rescue-ops/horses/{id}/release-quarantine", description: "Release horse from quarantine to REHABILITATION or ADOPTABLE", roles: [IntakeCoordinator], code: 200, input: [target_status, "notes?"], output: Horse, side_effects: ["Horse QUARANTINE -> target per state machine", "increments Horse.version by 1"] }
  - { method: POST, path: "/rescue-ops/horses/{id}/graduate-rehabilitation", description: "Graduate horse REHABILITATION -> ADOPTABLE", roles: [Veterinarian], code: 200, input: [], output: Horse, side_effects: ["Horse REHABILITATION -> ADOPTABLE per preconditions", "increments Horse.version by 1"] }
  - { method: POST, path: "/rescue-ops/horses/{id}/designate-sanctuary", description: "Designate horse as non-adoptable sanctuary resident", roles: [SanctuaryDirector], code: 200, input: [reason], output: Horse, side_effects: ["Horse REHABILITATION -> SANCTUARY", "increments Horse.version by 1"] }
  - { method: POST, path: "/rescue-ops/horses/{id}/quarantine", description: "Re-quarantine a resident horse (exposure)", roles: [IntakeCoordinator], code: 201, input: [min_days, reason], output: QuarantineProtocol, side_effects: ["Horse {REHABILITATION, ADOPTABLE, SANCTUARY} -> QUARANTINE", "creates ACTIVE QuarantineProtocol", "cancels horse's REQUESTED/CONFIRMED appointments", "increments Horse.version by 1"] }

  # ---- intake evaluations ----
  - { method: POST, path: "/rescue-ops/intake-evaluations", description: "Schedule an evaluation", roles: [IntakeCoordinator, Veterinarian, Farrier], code: 201, input: [horse_id, evaluation_type, scheduled_date], output: IntakeEvaluation, side_effects: [] }
  - { method: GET, path: "/rescue-ops/intake-evaluations", description: "List evaluations", roles: [SanctuaryDirector, IntakeCoordinator, Veterinarian, Farrier], code: 200, input: ["horse_id?", "evaluation_type?", "status?", "outcome?", "limit?", "offset?"], output: "IntakeEvaluation[]", side_effects: [] }
  - { method: GET, path: "/rescue-ops/intake-evaluations/{id}", description: "Get one evaluation", roles: [SanctuaryDirector, IntakeCoordinator, Veterinarian, Farrier], code: 200, input: [], output: IntakeEvaluation, side_effects: [] }
  - { method: POST, path: "/rescue-ops/intake-evaluations/{id}/complete", description: "Complete an evaluation with outcome", roles: [Veterinarian, Farrier, IntakeCoordinator], code: 200, input: [outcome, "findings?"], output: IntakeEvaluation, side_effects: ["status SCHEDULED -> COMPLETED; evaluation_date=now; completed_by_user_id=caller", "MEDICAL outcome=FAIL on a horse with ACTIVE quarantine: extension_days += 7"] }

  # ---- quarantine protocols ----
  - { method: GET, path: "/rescue-ops/quarantine-protocols", description: "List quarantine protocols", roles: [SanctuaryDirector, IntakeCoordinator, Veterinarian], code: 200, input: ["horse_id?", "status?", "limit?", "offset?"], output: "QuarantineProtocol[]", side_effects: [] }
  - { method: GET, path: "/rescue-ops/quarantine-protocols/{id}", description: "Get one protocol", roles: [SanctuaryDirector, IntakeCoordinator, Veterinarian], code: 200, input: [], output: QuarantineProtocol, side_effects: [] }
  - { method: POST, path: "/rescue-ops/quarantine-protocols/{id}/extend", description: "Manually extend quarantine", roles: [IntakeCoordinator, Veterinarian], code: 200, input: [days, reason], output: QuarantineProtocol, side_effects: ["extension_days += days"] }
  - { method: POST, path: "/rescue-ops/quarantine-protocols/{id}/clear", description: "Clear quarantine per quarantine_release_timing", roles: [Veterinarian], code: 200, input: [], output: QuarantineProtocol, side_effects: ["status ACTIVE -> CLEARED; cleared_at=now"] }

  # ---- daily health logs ----
  - { method: POST, path: "/rescue-ops/daily-health-logs", description: "Append a health log; temp_f >= 103.0 auto-extends the horse's ACTIVE quarantine by 7 days", roles: [IntakeCoordinator, Veterinarian], code: 201, input: [horse_id, temp_f, appetite, "notes?"], output: DailyHealthLog, side_effects: ["If temp_f >= 103.0 and horse has ACTIVE QuarantineProtocol: extension_days += 7 (fever cascade link 1)"] }
  - { method: GET, path: "/rescue-ops/daily-health-logs", description: "List health logs", roles: [SanctuaryDirector, IntakeCoordinator, Veterinarian], code: 200, input: ["horse_id?", "limit?", "offset?"], output: "DailyHealthLog[]", side_effects: [] }
  - { method: GET, path: "/rescue-ops/daily-health-logs/{id}", description: "Get one health log", roles: [SanctuaryDirector, IntakeCoordinator, Veterinarian], code: 200, input: [], output: DailyHealthLog, side_effects: [] }

  # ---- rehabilitation plans ----
  - { method: POST, path: "/rescue-ops/rehabilitation-plans", description: "Create a rehab plan (OCC on horse version); supersedes the horse's current DRAFT/ACTIVE plan", roles: [Veterinarian], code: 201, input: [horse_id, expected_horse_version, goals, target_body_condition_score, planned_weeks], output: RehabilitationPlan, side_effects: ["Existing DRAFT/ACTIVE plan for horse -> SUPERSEDED", "Horse must be REHABILITATION (ERR_INVALID_STATE)", "increments Horse.version by 1"] }
  - { method: GET, path: "/rescue-ops/rehabilitation-plans", description: "List rehab plans", roles: [SanctuaryDirector, IntakeCoordinator, Veterinarian], code: 200, input: ["horse_id?", "status?", "limit?", "offset?"], output: "RehabilitationPlan[]", side_effects: [] }
  - { method: GET, path: "/rescue-ops/rehabilitation-plans/{id}", description: "Get one plan", roles: [SanctuaryDirector, IntakeCoordinator, Veterinarian], code: 200, input: [], output: RehabilitationPlan, side_effects: [] }
  - { method: POST, path: "/rescue-ops/rehabilitation-plans/{id}/activate", description: "Activate a draft plan", roles: [Veterinarian], code: 200, input: [], output: RehabilitationPlan, side_effects: ["DRAFT -> ACTIVE; activated_at=now"] }
  - { method: POST, path: "/rescue-ops/rehabilitation-plans/{id}/complete", description: "Complete an active plan", roles: [Veterinarian], code: 200, input: [], output: RehabilitationPlan, side_effects: ["ACTIVE -> COMPLETED when no open linked appointments"] }

  # ---- practitioners ----
  - { method: POST, path: "/rescue-ops/practitioners", description: "Register a practitioner", roles: [SanctuaryDirector], code: 201, input: [name, specialty, "active?"], output: Practitioner, side_effects: [] }
  - { method: GET, path: "/rescue-ops/practitioners", description: "List practitioners", roles: [SanctuaryDirector, IntakeCoordinator, Veterinarian, Farrier, AdoptionOfficer], code: 200, input: ["specialty?", "active?", "limit?", "offset?"], output: "Practitioner[]", side_effects: [] }
  - { method: GET, path: "/rescue-ops/practitioners/{id}", description: "Get one practitioner", roles: [SanctuaryDirector, IntakeCoordinator, Veterinarian, Farrier, AdoptionOfficer], code: 200, input: [], output: Practitioner, side_effects: [] }
  - { method: PATCH, path: "/rescue-ops/practitioners/{id}", description: "Update practitioner; active=false deactivates and cancels their REQUESTED/CONFIRMED appointments", roles: [SanctuaryDirector], code: 200, input: ["active?", "name?"], output: Practitioner, side_effects: ["On active true->false: that practitioner's appointments in {REQUESTED, CONFIRMED} -> CANCELLED with cancellation_reason=PRACTITIONER_INACTIVE"] }

  # ---- care service appointments ----
  - { method: POST, path: "/rescue-ops/care-service-appointments", description: "Book a vet/farrier appointment (half-open interval + 15-min practitioner buffer; quarantine service restriction)", roles: [IntakeCoordinator, Veterinarian, Farrier], code: 201, input: [horse_id, practitioner_id, service_type, scheduled_start, scheduled_end, "rehab_plan_id?"], output: CareServiceAppointment, side_effects: ["status=REQUESTED, billing_status=UNBILLED"] }
  - { method: GET, path: "/rescue-ops/care-service-appointments", description: "List appointments", roles: [SanctuaryDirector, IntakeCoordinator, Veterinarian, Farrier], code: 200, input: ["horse_id?", "practitioner_id?", "rehab_plan_id?", "status?", "limit?", "offset?"], output: "CareServiceAppointment[]", side_effects: [] }
  - { method: GET, path: "/rescue-ops/care-service-appointments/{id}", description: "Get one appointment", roles: [SanctuaryDirector, IntakeCoordinator, Veterinarian, Farrier], code: 200, input: [], output: CareServiceAppointment, side_effects: [] }
  - { method: POST, path: "/rescue-ops/care-service-appointments/{id}/confirm", description: "Assigned practitioner confirms", roles: [Veterinarian, Farrier], code: 200, input: [], output: CareServiceAppointment, side_effects: ["REQUESTED -> CONFIRMED"] }
  - { method: POST, path: "/rescue-ops/care-service-appointments/{id}/complete", description: "Assigned practitioner completes; bills and credits plan visit", roles: [Veterinarian, Farrier], code: 200, input: [actual_cost_cents, "outcome_notes?"], output: CareServiceAppointment, side_effects: ["CONFIRMED -> COMPLETED; billing_status UNBILLED -> BILLED; actual_cost_cents set", "If rehab_plan_id set and plan ACTIVE: completed_visit_count += 1"] }
  - { method: POST, path: "/rescue-ops/care-service-appointments/{id}/cancel", description: "Cancel a requested/confirmed appointment", roles: [IntakeCoordinator, Veterinarian], code: 200, input: ["cancellation_reason?"], output: CareServiceAppointment, side_effects: ["{REQUESTED, CONFIRMED} -> CANCELLED; billing_status stays UNBILLED"] }

  # ---- stalls & assignments ----
  - { method: POST, path: "/rescue-ops/stalls", description: "Register a stall", roles: [SanctuaryDirector], code: 201, input: [stall_code, barn_zone, "active?"], output: Stall, side_effects: [] }
  - { method: GET, path: "/rescue-ops/stalls", description: "List stalls", roles: [SanctuaryDirector, IntakeCoordinator, BarnManager], code: 200, input: ["barn_zone?", "active?", "limit?", "offset?"], output: "Stall[]", side_effects: [] }
  - { method: GET, path: "/rescue-ops/stalls/{id}", description: "Get one stall", roles: [SanctuaryDirector, IntakeCoordinator, BarnManager], code: 200, input: [], output: Stall, side_effects: [] }
  - { method: POST, path: "/rescue-ops/stall-assignments", description: "Assign horse to stall (closed-interval overlap; quarantine-barn 1-day disinfection gap; zone match)", roles: [IntakeCoordinator], code: 201, input: [horse_id, stall_id, start_date, "end_date?"], output: StallAssignment, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/rescue-ops/stall-assignments", description: "List stall assignments", roles: [SanctuaryDirector, IntakeCoordinator, BarnManager], code: 200, input: ["horse_id?", "stall_id?", "status?", "limit?", "offset?"], output: "StallAssignment[]", side_effects: [] }
  - { method: GET, path: "/rescue-ops/stall-assignments/{id}", description: "Get one assignment", roles: [SanctuaryDirector, IntakeCoordinator, BarnManager], code: 200, input: [], output: StallAssignment, side_effects: [] }
  - { method: POST, path: "/rescue-ops/stall-assignments/{id}/end", description: "End an assignment", roles: [IntakeCoordinator], code: 200, input: [end_date], output: StallAssignment, side_effects: ["ACTIVE -> ENDED"] }

  # ---- adopters ----
  - { method: POST, path: "/rescue-ops/adopters", description: "Register an adopter (caller becomes that adopter)", roles: [Adopter], code: 201, input: [full_name, contact_email, experience_level, has_stall_facility], output: Adopter, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/rescue-ops/adopters", description: "List adopters", roles: [AdoptionOfficer, SanctuaryDirector], code: 200, input: ["status?", "limit?", "offset?"], output: "Adopter[]", side_effects: [] }
  - { method: GET, path: "/rescue-ops/adopters/{id}", description: "Get one adopter (Adopter role only for own id)", roles: [AdoptionOfficer, SanctuaryDirector, Adopter], code: 200, input: [], output: Adopter, side_effects: [] }
  - { method: POST, path: "/rescue-ops/adopters/{id}/block", description: "Block an adopter", roles: [AdoptionOfficer, SanctuaryDirector], code: 200, input: [reason], output: Adopter, side_effects: ["status ACTIVE -> BLOCKED"] }
  - { method: POST, path: "/rescue-ops/adopters/{id}/unblock", description: "Unblock an adopter", roles: [AdoptionOfficer, SanctuaryDirector], code: 200, input: [], output: Adopter, side_effects: ["status BLOCKED -> ACTIVE"] }

  # ---- adoption applications ----
  - { method: POST, path: "/rescue-ops/adoption-applications", description: "Submit an adoption application", roles: [Adopter], code: 201, input: [adopter_id, horse_id, proposed_pickup_date, "adopt_with_bonded_companion?"], output: AdoptionApplication, side_effects: ["status=SUBMITTED; submitted_at=now"] }
  - { method: GET, path: "/rescue-ops/adoption-applications", description: "List applications", roles: [AdoptionOfficer, SanctuaryDirector, Adopter], code: 200, input: ["adopter_id?", "horse_id?", "status?", "limit?", "offset?"], output: "AdoptionApplication[]", side_effects: [] }
  - { method: GET, path: "/rescue-ops/adoption-applications/{id}", description: "Get one application", roles: [AdoptionOfficer, SanctuaryDirector, Adopter], code: 200, input: [], output: AdoptionApplication, side_effects: [] }
  - { method: POST, path: "/rescue-ops/adoption-applications/{id}/start-review", description: "Move application to review", roles: [AdoptionOfficer], code: 200, input: [], output: AdoptionApplication, side_effects: ["SUBMITTED -> UNDER_REVIEW"] }
  - { method: POST, path: "/rescue-ops/adoption-applications/{id}/approve", description: "Approve after passed home check (precedence, segregation, validity windows, fee quote)", roles: [AdoptionOfficer], code: 200, input: [], output: AdoptionApplication, side_effects: ["HOME_CHECK_PASSED -> APPROVED; quoted_fee_cents snapshot (QUOTED variant); approved_at=now", "Horse ADOPTABLE -> ADOPTION_PENDING; active_application_id set"] }
  - { method: POST, path: "/rescue-ops/adoption-applications/{id}/reject", description: "Reject an application", roles: [AdoptionOfficer], code: 200, input: [reason], output: AdoptionApplication, side_effects: ["-> REJECTED; if was APPROVED, horse reverts to ADOPTABLE"] }
  - { method: POST, path: "/rescue-ops/adoption-applications/{id}/withdraw", description: "Adopter withdraws own application", roles: [Adopter], code: 200, input: ["reason?"], output: AdoptionApplication, side_effects: ["-> WITHDRAWN; if was APPROVED, horse reverts to ADOPTABLE"] }
  - { method: POST, path: "/rescue-ops/adoption-applications/{id}/pay-fee", description: "Record a fee payment (accumulates)", roles: [Adopter], code: 200, input: [amount_cents], output: AdoptionApplication, side_effects: ["fee_paid_cents += amount_cents; requires status APPROVED (ERR_INVALID_STATE); caller must own application (ERR_FORBIDDEN)"] }
  - { method: POST, path: "/rescue-ops/adoption-applications/{id}/finalize", description: "Finalize adoption after cooling-off and exact fee settlement; fires the adoption cascade", roles: [AdoptionOfficer], code: 200, input: [], output: AdoptionApplication, side_effects: ["APPROVED -> FINALIZED; final_fee_cents recomputed (FINAL variant); finalized_at=now", "Horse ADOPTION_PENDING -> ADOPTED full cascade (see Horse machine)"] }

  # ---- home checks ----
  - { method: POST, path: "/rescue-ops/home-checks", description: "Schedule a home check for an application (attempt cap 2)", roles: [AdoptionOfficer], code: 201, input: [application_id, scheduled_date], output: HomeCheck, side_effects: ["Application UNDER_REVIEW -> HOME_CHECK_SCHEDULED; home_check_attempts += 1"] }
  - { method: GET, path: "/rescue-ops/home-checks", description: "List home checks", roles: [AdoptionOfficer, SanctuaryDirector], code: 200, input: ["application_id?", "status?", "limit?", "offset?"], output: "HomeCheck[]", side_effects: [] }
  - { method: GET, path: "/rescue-ops/home-checks/{id}", description: "Get one home check", roles: [AdoptionOfficer, SanctuaryDirector], code: 200, input: [], output: HomeCheck, side_effects: [] }
  - { method: POST, path: "/rescue-ops/home-checks/{id}/complete", description: "Record home check outcome (PASSED advances; FAILED/CONDITIONAL loop back; 2nd FAILED auto-rejects)", roles: [AdoptionOfficer], code: 200, input: [outcome, "findings?"], output: HomeCheck, side_effects: ["SCHEDULED -> COMPLETED; completed_at=now; completed_by_user_id=caller", "Application transition per outcome"] }

  # ---- follow-up visits ----
  - { method: GET, path: "/rescue-ops/follow-up-visits", description: "List follow-up visits", roles: [AdoptionOfficer, SanctuaryDirector], code: 200, input: ["application_id?", "status?", "limit?", "offset?"], output: "FollowUpVisit[]", side_effects: [] }
  - { method: GET, path: "/rescue-ops/follow-up-visits/{id}", description: "Get one follow-up visit", roles: [AdoptionOfficer, SanctuaryDirector], code: 200, input: [], output: FollowUpVisit, side_effects: [] }
  - { method: POST, path: "/rescue-ops/follow-up-visits/{id}/complete", description: "Record follow-up outcome; FAILED fires the return cascade", roles: [AdoptionOfficer], code: 200, input: [outcome, "findings?"], output: FollowUpVisit, side_effects: ["SCHEDULED -> COMPLETED; completed_at=now", "FAILED: application FINALIZED -> RETURN_COMPLETED -> horse ADOPTED -> REHABILITATION -> auto quarantine"] }

  # ---- sponsors & sponsorships ----
  - { method: POST, path: "/rescue-ops/sponsors", description: "Register a sponsor (caller becomes that sponsor)", roles: [Sponsor], code: 201, input: [name, contact_email], output: Sponsor, side_effects: ["status computed: INACTIVE until first non-terminal sponsorship"] }
  - { method: GET, path: "/rescue-ops/sponsors", description: "List sponsors", roles: [SanctuaryDirector, AdoptionOfficer], code: 200, input: ["status?", "limit?", "offset?"], output: "Sponsor[]", side_effects: [] }
  - { method: GET, path: "/rescue-ops/sponsors/{id}", description: "Get one sponsor (Sponsor role only for own id)", roles: [SanctuaryDirector, AdoptionOfficer, Sponsor], code: 200, input: [], output: Sponsor, side_effects: [] }
  - { method: POST, path: "/rescue-ops/sponsorships", description: "Create a sponsorship pledge", roles: [Sponsor], code: 201, input: [sponsor_id, horse_id, monthly_pledge_cents], output: Sponsorship, side_effects: ["status=PLEDGED; Sponsor.status recomputed (ACTIVE)"] }
  - { method: GET, path: "/rescue-ops/sponsorships", description: "List sponsorships", roles: [SanctuaryDirector, AdoptionOfficer, Sponsor], code: 200, input: ["sponsor_id?", "horse_id?", "status?", "limit?", "offset?"], output: "Sponsorship[]", side_effects: [] }
  - { method: GET, path: "/rescue-ops/sponsorships/{id}", description: "Get one sponsorship", roles: [SanctuaryDirector, AdoptionOfficer, Sponsor], code: 200, input: [], output: Sponsorship, side_effects: [] }
  - { method: POST, path: "/rescue-ops/sponsorships/{id}/activate", description: "Activate a pledge", roles: [Sponsor, SanctuaryDirector], code: 200, input: [], output: Sponsorship, side_effects: ["PLEDGED -> ACTIVE; activated_at=now; care plan coverage recomputed; Sponsor.status recomputed"] }
  - { method: POST, path: "/rescue-ops/sponsorships/{id}/lapse", description: "Mark an active sponsorship lapsed", roles: [SanctuaryDirector], code: 200, input: [], output: Sponsorship, side_effects: ["ACTIVE -> LAPSED; care plan coverage recomputed"] }
  - { method: POST, path: "/rescue-ops/sponsorships/{id}/reinstate", description: "Reinstate a lapsed sponsorship", roles: [Sponsor, SanctuaryDirector], code: 200, input: [], output: Sponsorship, side_effects: ["LAPSED -> ACTIVE; care plan coverage recomputed"] }
  - { method: POST, path: "/rescue-ops/sponsorships/{id}/cancel", description: "Cancel a sponsorship", roles: [Sponsor, SanctuaryDirector], code: 200, input: ["reason?"], output: Sponsorship, side_effects: ["{PLEDGED, ACTIVE, LAPSED} -> CANCELLED; coverage recomputed if was ACTIVE; Sponsor.status recomputed"] }

  # ---- sanctuary care plans ----
  - { method: POST, path: "/rescue-ops/sanctuary-care-plans", description: "Create a lifetime care plan (OCC on horse version); supersedes existing DRAFT/APPROVED plan", roles: [SanctuaryDirector], code: 201, input: [horse_id, expected_horse_version, variant], output: SanctuaryCarePlan, side_effects: ["Horse must be SANCTUARY (ERR_INVALID_STATE)", "Existing DRAFT/APPROVED plan -> SUPERSEDED", "projected_months/monthly_cost_cents/total_lifetime_cost_cents computed per variant", "increments Horse.version by 1"] }
  - { method: GET, path: "/rescue-ops/sanctuary-care-plans", description: "List care plans", roles: [SanctuaryDirector, AdoptionOfficer], code: 200, input: ["horse_id?", "status?", "limit?", "offset?"], output: "SanctuaryCarePlan[]", side_effects: [] }
  - { method: GET, path: "/rescue-ops/sanctuary-care-plans/{id}", description: "Get one care plan", roles: [SanctuaryDirector, AdoptionOfficer], code: 200, input: [], output: SanctuaryCarePlan, side_effects: [] }
  - { method: POST, path: "/rescue-ops/sanctuary-care-plans/{id}/approve", description: "Approve a draft care plan", roles: [SanctuaryDirector], code: 200, input: [], output: SanctuaryCarePlan, side_effects: ["DRAFT -> APPROVED; funding recomputed"] }
  - { method: POST, path: "/rescue-ops/sanctuary-care-plans/{id}/close", description: "Close a care plan", roles: [SanctuaryDirector], code: 200, input: ["reason?"], output: SanctuaryCarePlan, side_effects: ["{DRAFT, APPROVED} -> CLOSED"] }

  # ---- feed: purchase orders, lots, summary, close-day ----
  - { method: POST, path: "/rescue-ops/purchase-orders", description: "Create a seasonal purchase order (estimated_total computed)", roles: [BarnManager], code: 201, input: [feed_type, quantity_lbs, unit_cents_per_lb], output: PurchaseOrder, side_effects: ["status=DRAFT; estimated_total_cents computed (single-rounding estimate)"] }
  - { method: GET, path: "/rescue-ops/purchase-orders", description: "List purchase orders", roles: [SanctuaryDirector, BarnManager], code: 200, input: ["feed_type?", "status?", "limit?", "offset?"], output: "PurchaseOrder[]", side_effects: [] }
  - { method: GET, path: "/rescue-ops/purchase-orders/{id}", description: "Get one purchase order", roles: [SanctuaryDirector, BarnManager], code: 200, input: [], output: PurchaseOrder, side_effects: [] }
  - { method: POST, path: "/rescue-ops/purchase-orders/{id}/mark-ordered", description: "Place the order", roles: [BarnManager], code: 200, input: [], output: PurchaseOrder, side_effects: ["DRAFT -> ORDERED; open remainder now counts in days_of_supply_committed"] }
  - { method: POST, path: "/rescue-ops/purchase-orders/{id}/receive", description: "Receive (partially or fully) against an order; creates a FeedLot with per-lot cost rounding", roles: [BarnManager], code: 200, input: [quantity_received_lbs, expiry_date], output: PurchaseOrder, side_effects: ["Create FeedLot; received_lbs accrual; actual_total_cents += lot_cost_cents; at full receipt compute surcharge and grand total"] }
  - { method: GET, path: "/rescue-ops/feed-lots", description: "List feed lots", roles: [SanctuaryDirector, BarnManager], code: 200, input: ["feed_type?", "purchase_order_id?", "limit?", "offset?"], output: "FeedLot[]", side_effects: [] }
  - { method: GET, path: "/rescue-ops/feed-lots/{id}", description: "Get one feed lot", roles: [SanctuaryDirector, BarnManager], code: 200, input: [], output: FeedLot, side_effects: [] }
  - { method: GET, path: "/rescue-ops/feed-inventory/summary", description: "Computed per-feed-type supply summary (TIGHT and COMMITTED days-of-supply variants, reorder flags)", roles: [SanctuaryDirector, BarnManager], code: 200, input: [], output: { summaries: array }, side_effects: [] }
  - { method: POST, path: "/rescue-ops/feed-inventory/close-day", description: "Ops-run checkpoint: close a calendar day — expiry waste then FEFO drawdown per feed type; one close per date globally", roles: [BarnManager], code: 200, input: [close_date], output: { closed_date: string, consumed_lbs: object, wasted_lbs: object }, side_effects: ["Per feed_type: create FeedDayClose; expired lots (expiry_date < close_date) wasted to 0 FIRST; then FEFO drawdown (expiry_date ASC, tie created_at ASC) where consumed_lbs = min(rounded demand, usable stock) and shortfall_lbs = rounded demand - consumed_lbs"] }
  - { method: GET, path: "/rescue-ops/feed-day-closes", description: "List day-close records", roles: [SanctuaryDirector, BarnManager], code: 200, input: ["feed_type?", "limit?", "offset?"], output: "FeedDayClose[]", side_effects: [] }

  # ---- volunteers & shifts ----
  - { method: POST, path: "/rescue-ops/volunteers", description: "Register a volunteer (caller becomes that volunteer)", roles: [Volunteer], code: 201, input: [name, contact_email, skills], output: Volunteer, side_effects: ["status=ACTIVE; reliability_score=50"] }
  - { method: GET, path: "/rescue-ops/volunteers", description: "List volunteers", roles: [VolunteerCoordinator, SanctuaryDirector], code: 200, input: ["status?", "limit?", "offset?"], output: "Volunteer[]", side_effects: [] }
  - { method: GET, path: "/rescue-ops/volunteers/{id}", description: "Get one volunteer (Volunteer role only for own id)", roles: [VolunteerCoordinator, SanctuaryDirector, Volunteer], code: 200, input: [], output: Volunteer, side_effects: [] }
  - { method: POST, path: "/rescue-ops/barn-shifts", description: "Create an open barn shift", roles: [VolunteerCoordinator], code: 201, input: [shift_date, start_time, end_time, barn_zone, required_skill], output: BarnShift, side_effects: ["status=OPEN; volunteer_id=null"] }
  - { method: GET, path: "/rescue-ops/barn-shifts", description: "List barn shifts", roles: [VolunteerCoordinator, SanctuaryDirector, Volunteer], code: 200, input: ["volunteer_id?", "barn_zone?", "shift_date?", "status?", "limit?", "offset?"], output: "BarnShift[]", side_effects: [] }
  - { method: GET, path: "/rescue-ops/barn-shifts/{id}", description: "Get one shift", roles: [VolunteerCoordinator, SanctuaryDirector, Volunteer], code: 200, input: [], output: BarnShift, side_effects: [] }
  - { method: POST, path: "/rescue-ops/barn-shifts/{id}/claim", description: "Volunteer claims an open shift (gates: ACTIVE, reliability >= 40, skill match, no overlap)", roles: [Volunteer], code: 200, input: [], output: BarnShift, side_effects: ["OPEN -> ASSIGNED; volunteer_id := caller"] }
  - { method: POST, path: "/rescue-ops/barn-shifts/{id}/release", description: "Assigned volunteer releases the shift", roles: [Volunteer], code: 200, input: [], output: BarnShift, side_effects: ["ASSIGNED -> OPEN; volunteer_id := null"] }
  - { method: POST, path: "/rescue-ops/barn-shifts/{id}/complete", description: "Mark shift completed; credits volunteer reliability", roles: [VolunteerCoordinator], code: 200, input: [], output: BarnShift, side_effects: ["ASSIGNED -> COMPLETED; completed_shift_count += 1; reliability recomputed"] }
  - { method: POST, path: "/rescue-ops/barn-shifts/{id}/mark-no-show", description: "Mark shift no-show; reliability penalty and possible auto-suspension", roles: [VolunteerCoordinator], code: 200, input: [], output: BarnShift, side_effects: ["ASSIGNED -> NO_SHOW; no_show_count += 1; reliability recomputed; if < 20 volunteer SUSPENDED"] }

  # ---- euthanasia cases ----
  - { method: POST, path: "/rescue-ops/euthanasia-cases", description: "Propose an end-of-life case; horse enters END_OF_LIFE_REVIEW", roles: [Veterinarian], code: 201, input: [horse_id, clinical_summary, suffering_score], output: EuthanasiaCase, side_effects: ["status=PROPOSED; proposing_practitioner_id=caller", "Horse {REHABILITATION, ADOPTABLE, ADOPTION_PENDING, SANCTUARY} -> END_OF_LIFE_REVIEW with prior_status captured"] }
  - { method: GET, path: "/rescue-ops/euthanasia-cases", description: "List euthanasia cases", roles: [SanctuaryDirector, Veterinarian], code: 200, input: ["horse_id?", "status?", "proposing_practitioner_id?", "certifying_practitioner_id?", "limit?", "offset?"], output: "EuthanasiaCase[]", side_effects: [] }
  - { method: GET, path: "/rescue-ops/euthanasia-cases/{id}", description: "Get one case", roles: [SanctuaryDirector, Veterinarian], code: 200, input: [], output: EuthanasiaCase, side_effects: [] }
  - { method: POST, path: "/rescue-ops/euthanasia-cases/{id}/certify", description: "Second veterinarian concurs (or dissents -> OVERRIDDEN); emergency attestation when suffering_score >= 8", roles: [Veterinarian], code: 200, input: [decision, emergency_attestation], output: EuthanasiaCase, side_effects: ["CONCUR: PROPOSED -> CERTIFIED, certifying id set, emergency_certified computed", "DISSENT: -> OVERRIDDEN, horse prior_status restored"] }
  - { method: POST, path: "/rescue-ops/euthanasia-cases/{id}/authorize", description: "Director authorizes; starts 72h cooling-off", roles: [SanctuaryDirector], code: 200, input: [], output: EuthanasiaCase, side_effects: ["CERTIFIED -> AUTHORIZED; authorized_at=now"] }
  - { method: POST, path: "/rescue-ops/euthanasia-cases/{id}/execute", description: "Execute after cooling-off (or immediately when emergency_certified); horse DECEASED cascade", roles: [Veterinarian], code: 200, input: [], output: EuthanasiaCase, side_effects: ["AUTHORIZED -> EXECUTED; executed_at=now", "Horse -> DECEASED cascade: sponsorships CANCELLED (HORSE_DECEASED), care plans CLOSED, appointments CANCELLED, stall ENDED"] }
  - { method: POST, path: "/rescue-ops/euthanasia-cases/{id}/overturn", description: "Director overturns a proposed/certified case; horse restored to prior status", roles: [SanctuaryDirector], code: 200, input: [reason], output: EuthanasiaCase, side_effects: ["{PROPOSED, CERTIFIED} -> OVERRIDDEN; horse prior_status restored"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint; entity-backed identity unresolved or specialty mismatch; ownership check failed (adopter/sponsor/volunteer self-scope, practitioner self-confirm)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist" }
  - { id: ERR_HORSE_NOT_FOUND, http: 404, condition: "Body horse_id does not exist" }
  - { id: ERR_ADOPTER_NOT_FOUND, http: 404, condition: "Body adopter_id does not exist" }
  - { id: ERR_PRACTITIONER_NOT_FOUND, http: 404, condition: "Body practitioner_id does not exist" }
  - { id: ERR_STALL_NOT_FOUND, http: 404, condition: "Body stall_id does not exist" }
  - { id: ERR_SPONSOR_NOT_FOUND, http: 404, condition: "Body sponsor_id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "Body application_id does not exist" }
  - { id: ERR_REHAB_PLAN_NOT_FOUND, http: 404, condition: "Body rehab_plan_id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, range violation (weight<=0, BCS outside 1..9, min_days outside 1..60, suffering_score outside 1..10, end<=start, duplicate stall_code, lifespan months <= 0)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid from-state for the requested transition, including terminal-state lockdown (DECEASED horse, FINALIZED/RETURN_COMPLETED/REJECTED/WITHDRAWN application, COMPLETED/CANCELLED rows)" }
  - { id: ERR_HORSE_NOT_ADOPTABLE, http: 409, condition: "Adoption application create/approve requires Horse.status == ADOPTABLE" }
  - { id: ERR_HORSE_NOT_RESIDENT, http: 409, condition: "Appointment/sponsorship operation requires horse in a resident status (not ADOPTED/DECEASED)" }
  - { id: ERR_QUARANTINE_ACTIVE, http: 409, condition: "Release attempted while protocol still ACTIVE, or re-quarantine/second protocol while one is ACTIVE" }
  - { id: ERR_DAY_ALREADY_CLOSED, http: 409, condition: "close-day for a date that has already been closed" }
  - { id: ERR_STALE_HORSE_VERSION, http: 412, condition: "expected_horse_version does not equal Horse.version at plan creation (OCC)" }
  - { id: ERR_QUARANTINE_SERVICE_RESTRICTED, http: 422, condition: "Non-VET_EXAM appointment created while horse is QUARANTINE" }
  - { id: ERR_ADOPTER_BLOCKED, http: 422, condition: "Adopter BLOCKED at application create or approve" }
  - { id: ERR_DUTY_SEGREGATION, http: 422, condition: "Euthanasia certifier equals proposer, or adoption approve caller equals the passed home check's completer" }
  - { id: ERR_APPOINTMENT_OVERLAP, http: 422, condition: "Same-practitioner appointment violates half-open overlap or the 15-min buffer" }
  - { id: ERR_STALL_OVERLAP, http: 422, condition: "Same-stall closed-interval date overlap" }
  - { id: ERR_DISINFECTION_GAP_REQUIRED, http: 422, condition: "QUARANTINE_BARN assignment lacks the required 1 full gap day after the previous occupant" }
  - { id: ERR_SHIFT_OVERLAP, http: 422, condition: "Same-volunteer ASSIGNED shifts overlap on the same date (half-open; adjacent allowed)" }
  - { id: ERR_COOLING_OFF_ACTIVE, http: 422, condition: "72h cooling-off not elapsed at adoption finalize or euthanasia execute (and not emergency_certified)" }
  - { id: ERR_HOME_CHECK_EXPIRED, http: 422, condition: "Latest passed home check completed more than 180 days before approve" }
  - { id: ERR_CLEARANCE_EXAM_STALE, http: 422, condition: "No COMPLETED MEDICAL evaluation within 48h of quarantine clear" }
  - { id: ERR_FEVER_WITHIN_72H, http: 422, condition: "Fever health log (temp_f >= 103.0) recorded within trailing 72h of quarantine clear" }
  - { id: ERR_RELEASE_DATE_NOT_REACHED, http: 422, condition: "now earlier than start_date + min_days + extension_days at quarantine clear" }
  - { id: ERR_PICKUP_WINDOW_EXCEEDED, http: 422, condition: "proposed_pickup_date more than 14 days after finalize instant" }
  - { id: ERR_APPLICATION_PRECEDENCE_BLOCKED, http: 422, condition: "A competing application for the same horse is further along the review pipeline with strictly earlier submitted_at" }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "Adopter already has a non-terminal application for this horse" }
  - { id: ERR_BONDED_PAIR_VIOLATION, http: 422, condition: "Bonded-pair rule violated (companion not ADOPTABLE at approve/finalize, or releasing a bonded horse whose companion is not ADOPTABLE/ADOPTION_PENDING)" }
  - { id: ERR_SERVICE_SPECIALTY_MISMATCH, http: 422, condition: "service_type requires a practitioner specialty the booked practitioner does not have" }
  - { id: ERR_SKILL_MISMATCH, http: 422, condition: "Volunteer lacks the shift's required_skill (and skill is not ANY)" }
  - { id: ERR_VOLUNTEER_NOT_ACTIVE, http: 422, condition: "Volunteer SUSPENDED attempting to claim" }
  - { id: ERR_RELIABILITY_TOO_LOW, http: 422, condition: "Volunteer reliability_score < 40 attempting to claim" }
  - { id: ERR_HOME_CHECK_LIMIT_EXCEEDED, http: 422, condition: "Third home check attempt on one application" }
  - { id: ERR_PLAN_HAS_OPEN_APPOINTMENTS, http: 422, condition: "Plan completion while linked appointments remain REQUESTED/CONFIRMED" }
  - { id: ERR_OVER_RECEIPT, http: 422, condition: "Receive would push cumulative received_lbs beyond ordered quantity_lbs" }
  - { id: ERR_STALL_ZONE_MISMATCH, http: 422, condition: "QUARANTINE horse assigned outside QUARANTINE_BARN, or stall inactive" }
  - { id: ERR_ADOPTION_FEE_UNPAID, http: 422, condition: "fee_paid_cents != FINAL fee recompute at finalize" }
  - { id: ERR_FEE_AMOUNT_INVALID, http: 422, condition: "pay-fee amount_cents not a positive integer" }
  - { id: ERR_PLEDGE_BELOW_MINIMUM, http: 422, condition: "monthly_pledge_cents < 2500" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SanctuaryDirector
    description: "Executive operator: sanctuary designation, care plans, euthanasia authorization/overturn, stalls, practitioners, clock"
    identity: opaque
    exclusive_operations: [designate-sanctuary, create/approve/close sanctuary-care-plans, authorize/overturn euthanasia cases, create stalls, create/patch practitioners, set clock, lapse sponsorships]
    shared_operations: [read entities, sponsorship activate/cancel, adopter block/unblock]
  - name: IntakeCoordinator
    description: "Intake and barn operations: horse intake, quarantine management, stall assignments, health logs, appointment booking/cancel"
    identity: opaque
    exclusive_operations: [horse intake, release-quarantine, re-quarantine, quarantine extend, stall assignments, daily health logs, appointment cancel]
    shared_operations: [read entities, schedule evaluations, book appointments]
  - name: Veterinarian
    description: "Licensed vet practitioner; X-User-ID must equal the id of a Practitioner with specialty VETERINARIAN"
    identity: entity_backed:Practitioner
    exclusive_operations: [quarantine clear, graduate-rehabilitation, rehabilitation plan create/activate/complete, euthanasia propose/certify/execute]
    shared_operations: [read entities, schedule/complete evaluations, book appointments, confirm/complete own appointments, daily health logs, extend quarantine]
  - name: Farrier
    description: "Hoof-care practitioner; X-User-ID must equal the id of a Practitioner with specialty FARRIER"
    identity: entity_backed:Practitioner
    exclusive_operations: []
    shared_operations: [read entities, schedule/complete FARRIERY evaluations, book farrier appointments, confirm/complete own appointments]
  - name: AdoptionOfficer
    description: "Adoption pipeline officer: reviews, home checks, follow-ups, approval/finalize; segregation-of-duties constraints apply"
    identity: opaque
    exclusive_operations: [start-review, create/complete home checks, complete follow-up visits, approve/reject/finalize applications, adopter block/unblock]
    shared_operations: [read entities]
  - name: Adopter
    description: "Prospective adopter; X-User-ID equals own Adopter id"
    identity: entity_backed:Adopter
    exclusive_operations: [register adopter, submit application, withdraw own application, pay fee on own application]
    shared_operations: [read horses, read own applications/adopter record]
  - name: Sponsor
    description: "Horse sponsor; X-User-ID equals own Sponsor id"
    identity: entity_backed:Sponsor
    exclusive_operations: [register sponsor, create sponsorship, activate/reinstate/cancel own sponsorships]
    shared_operations: [read horses, read own sponsorships/sponsor record]
  - name: BarnManager
    description: "Feed program operator: purchase orders, receipts, day close"
    identity: opaque
    exclusive_operations: [create/order/receive purchase orders, close-day]
    shared_operations: [read entities, feed summary]
  - name: VolunteerCoordinator
    description: "Shift program operator"
    identity: opaque
    exclusive_operations: [create barn shifts, complete shifts, mark no-shows]
    shared_operations: [read entities]
  - name: Volunteer
    description: "Barn volunteer; X-User-ID equals own Volunteer id"
    identity: entity_backed:Volunteer
    exclusive_operations: [register volunteer, claim shifts, release own shifts]
    shared_operations: [read shifts, read own volunteer record]
