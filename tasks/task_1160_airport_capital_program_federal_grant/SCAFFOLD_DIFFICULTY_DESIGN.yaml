            - "Contract.${con}.invoiced_total == 0.00 and remaining_value == 500000.00 (link 3 ledger recompute)"
            - "After second adjudication: DBEReport.${rep2}.status == COMPLIANT, Invoice.${inv}.status == VERIFIED, Contract.${con}.invoiced_total == 100000.00"

      - name: closeout_approval_cascade
        grounds:
          - state_machines.Grant.UNDER_AUDIT_to_CLOSED
          - state_machines.Contract.AWARDED_to_CLOSED
          - state_machines.Invoice.VERIFIED_to_PAID
          - calculations.closeout_final_settlement
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (closeout approval): Grant UNDER_AUDIT -> CLOSED
          (link 1) causes every AWARDED contract -> CLOSED (link 2), and each contract closing causes
