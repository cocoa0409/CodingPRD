              as: LeasingAgent
            - call: "POST /leases"
              payload: { building_id: "${x3_b_id}", suite_id: "${x3_s_id}", tenant_id: "${x3_t_id}", lease_type: "DIRECT", term_start: "2030-12-31", term_end: "2027-01-01", base_rent_psf_annual: 30.00 }
