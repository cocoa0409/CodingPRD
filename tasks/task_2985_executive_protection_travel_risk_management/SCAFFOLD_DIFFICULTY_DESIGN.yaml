  - rule_id: boundary_precision_check
    instances:

      - name: perquisite_tier_boundary_inclusive_at_exactly_five_million_prior
        grounds:
          - calculations.perquisite_allocation
          - calculations.perquisite_allocation.constants.PERQUISITE_TIER_MID_AT
          - calculations.perquisite_allocation.constants.PERQUISITE_TIER_RATES
          - calculations.detail_assignment_cost
          - calculations.trip_security_cost
          - entities.Executive.annual_disclosed_perquisite_cents
          - endpoints.POST_/exec-protection/trips/{id}/close
        distinguishing_aspect: |
          Metric: MONEY, at the PERQUISITE_TIER_MID_AT = 5000000 tier edge, exercised on
          POST /exec-protection/trips/{id}/close. Three trips are closed in a pinned order
          so that the executive's annual_disclosed_perquisite_cents walks 0 -> 4999999 ->
          exactly 5000000 -> 5028125. The second close happens with prior == 4999999 (one
          cent BELOW the edge, so rate 0.10) and the third with prior == exactly 5000000
          (the edge itself, which the scaffold declares inclusive at the lower bound, so
          rate 0.25). An implementation using `prior > 5000000` instead of `>=` yields
          11250 instead of 28125 on the third close; an implementation that reads the
          post-trip total instead of the pre-trip total (STEP 1 vs STEP 5 pinning) yields
          0.25 on the second close as well. The same instance also pins round_half_up at
          its own edge: trip B's taxable share is round_half_up(5 * 0.10) = 1, not 0.
