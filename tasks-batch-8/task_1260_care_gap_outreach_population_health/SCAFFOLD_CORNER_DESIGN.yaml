        claim_type: rate_threshold_triggers
        grounds:
          - calculations.attempt_cadence
          - validations[priority=9]
        distinguishing_aspect: "Cumulative threshold: attempt cap (max_attempts_per_member) triggers ERR_ATTEMPT_CAP_REACHED at the boundary."
        excluded_because:
          difficulty_instance: attempt_cap_reached_blocks
          rationale: "Boundary exercise covered in the validations section above."

      - name: selector_policy_channel_selection_by_band
        claim_type: selector_policy
