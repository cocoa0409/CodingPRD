# =============================================================================
# task_1170 — Business Continuity & Disaster Recovery Program (BC/DR)
# Scaffold seed tables §1.0–§1.7 (difficulty design lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corner design in SCAFFOLD_CORNER_DESIGN.yaml)
# Difficulty: harder-than-expert (18 entities, 16 state machines, 9 calculations,
# 32 validation rules, 108 endpoints, 44 error codes, 8 roles).
# =============================================================================

scenario: |
  Business Continuity & Disaster Recovery Program (enterprise resilience office):
  business impact analysis & recovery time/point objectives, plan authoring by
  process & dependency mapping, exercise calendar (tabletop/failover) & findings,
  alternate site & workforce arrangements, crisis communication tree & activation
  criteria, third-party dependency continuity assessment, recovery capability
  validation & gap remediation, regulatory/customer attestation.

domain_name: bc-dr-program
api_prefix: /resilience

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: graph
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Contact
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Person's full name" }
      - { name: email, type: string, source: input, description: "Email address; unique" }
      - { name: role_title, type: string, source: input, description: "Organizational role title" }
      - { name: active_flag, type: boolean, source: input, default: true, description: "Whether the contact is currently addressable" }

  - name: Process
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Business process name" }
      - { name: business_unit, type: string, source: input, description: "Owning business unit" }
      - { name: owner_contact_id, type: string, source: input, description: "FK -> Contact.id; accountable process owner (used for segregation-of-duties checks)" }
      - { name: criticality_tier, type: enum, source: input, description: "TIER_1 | TIER_2 | TIER_3" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | RETIRED" }

  - name: Bia
    parent: null
    common_fields: true
    fields:
      - { name: process_id, type: string, source: input, description: "FK -> Process.id; process under analysis" }
      - { name: cycle_label, type: string, source: input, description: "Analysis cycle label, e.g. FY2026-H1; unique per process" }
      - { name: rto_target_hours, type: integer, source: input, description: "Recovery Time Objective target in whole hours" }
      - { name: rpo_target_hours, type: integer, source: input, description: "Recovery Point Objective target in whole hours" }
      - { name: mtpd_hours, type: integer, source: input, description: "Maximum tolerable period of disruption in hours; must be >= rto_target_hours" }
      - { name: peak_period_flag, type: boolean, source: input, description: "Whether a peak-period window materially changes impact" }
      - { name: peak_start_month, type: integer, source: input, description: "Peak window start month 1-12; required when peak_period_flag is true" }
      - { name: peak_end_month, type: integer, source: input, description: "Peak window end month 1-12; required when peak_period_flag is true" }
      - { name: impact_financial_per_hour, type: number, source: input, description: "Estimated financial impact per hour of outage (USD, 2dp)" }
      - { name: impact_regulatory, type: enum, source: input, description: "NONE | LOW | HIGH" }
      - { name: impact_reputational, type: enum, source: input, description: "NONE | LOW | HIGH" }
      - { name: impact_operational, type: enum, source: input, description: "NONE | LOW | HIGH" }
      - { name: criticality_score, type: number, source: computed, description: "Weighted criticality score per calculations.bia_criticality_score (2dp)" }
      - { name: score_variant, type: enum, source: computed, description: "PROVISIONAL while DRAFT/SUBMITTED/REJECTED; FINAL once APPROVED; scores never recomputed after approval" }
      - { name: decided_by_contact_id, type: string, source: computed, description: "Contact id of the RiskCommittee member whose approve/reject decision is current; null until first decision" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED" }

  - name: Plan
    parent: null
    common_fields: true
    fields:
      - { name: process_id, type: string, source: input, description: "FK -> Process.id; process this plan recovers" }
      - { name: title, type: string, source: input, description: "Plan title" }
      - { name: version_no, type: integer, source: input, description: "Author-declared plan version number; unique per process" }
      - { name: strategy_type, type: enum, source: input, description: "ACTIVE_ACTIVE | WARM_SITE | COLD_SITE | MANUAL_WORKAROUND" }
      - { name: rto_committed_hours, type: integer, source: input, description: "Recovery time this plan commits to achieve (hours)" }
      - { name: rpo_committed_hours, type: integer, source: input, description: "Data loss this plan commits to tolerate (hours)" }
      - { name: target_bia_id, type: string, source: computed, description: "FK -> Bia.id; governing BIA for validation — the latest APPROVED BIA of the process at adoption time, else latest SUBMITTED; null if neither exists" }
      - { name: approved_version_no, type: integer, source: computed, description: "Plan version pinned when the plan entered APPROVED; null until first approval" }
      - { name: supersedes_plan_id, type: string, source: computed, description: "FK -> Plan.id; prior APPROVED plan of the same process retired by this plan's approval; null when none" }
      - { name: last_adoption_check_cycle, type: string, source: computed, description: "Cycle label of the most recent automatic adoption refresh; informational" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_REVIEW | APPROVED | RETIRED" }

  - name: PlanSection
    parent: Plan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> Plan.id; owning plan (path-scoped)" }
      - { name: section_type, type: enum, source: input, description: "SCOPE | RECOVERY_STRATEGY | DEPENDENCY_MAP | COMMS_PLAN | SITE_STRATEGY | WORKFORCE_STRATEGY | VALIDATION_STRATEGY | ATTESTATION_MAP" }
      - { name: content, type: string, source: input, description: "Free-text section body" }
      - { name: order_index, type: integer, source: input, description: "Ordering of the section within the plan; unique per plan" }
      - { name: required_flag, type: boolean, source: computed, description: "True for RECOVERY_STRATEGY, DEPENDENCY_MAP and COMMS_PLAN (plan-approval gates); false otherwise" }

  - name: Dependency
    parent: null
    common_fields: false
    fields:
      - { name: from_process_id, type: string, source: input, description: "FK -> Process.id; upstream side of the process-to-process edge" }
      - { name: to_process_id, type: string, source: input, description: "FK -> Process.id; downstream side (differs from from_process_id)" }
      - { name: dependency_type, type: enum, source: input, description: "DATA | STAFF | FACILITY | VENDOR | SYSTEM" }
      - { name: criticality, type: enum, source: input, description: "HIGH | MEDIUM | LOW" }
      - { name: notes, type: string, source: input, description: "Free-text note; optional" }

  - name: ThirdParty
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor or third-party organization name; unique" }
      - { name: service_category, type: string, source: input, description: "Category of service provided" }
      - { name: criticality_rating, type: enum, source: input, description: "CRITICAL | HIGH | MEDIUM | LOW" }
      - { name: owner_contact_id, type: string, source: input, description: "FK -> Contact.id; vendor owner (segregation-of-duties reference)" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | ACTIVE | SUSPENDED | EXITED" }

  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - { name: third_party_id, type: string, source: input, description: "FK -> ThirdParty.id; vendor under assessment" }
      - { name: process_id, type: string, source: input, description: "FK -> Process.id; process that depends on the vendor" }
      - { name: assessment_type, type: enum, source: input, description: "INITIAL | ANNUAL | EVENT_DRIVEN" }
      - { name: assessed_rto_hours, type: integer, source: input, description: "Vendor-attested recovery time capability (hours)" }
      - { name: assessed_rpo_hours, type: integer, source: input, description: "Vendor-attested recovery point capability (hours)" }
      - { name: evidence_doc_ref, type: string, source: input, description: "Reference to evidence artifact; optional" }
      - { name: continuity_score, type: integer, source: computed, description: "Integer 0-100 from calculations.vendor_continuity_score" }
      - { name: score_variant, type: enum, source: computed, description: "PROVISIONAL while DRAFT; FINAL once FINALIZED; finalized scores never recomputed" }
      - { name: meets_required_rto, type: boolean, source: computed, description: "True iff assessed_rto_hours <= required target resolved from the process's latest APPROVED BIA (fall back to assessment rto_required_hours input when no approved BIA exists)" }
      - { name: rto_required_hours, type: integer, source: input, description: "Fallback required RTO (hours) used only when the process has no APPROVED BIA" }
      - { name: rpo_required_hours, type: integer, source: input, description: "Fallback required RPO (hours) used only when the process has no APPROVED BIA" }
      - { name: finalized_by_contact_id, type: string, source: computed, description: "Contact id of finalizer; null until finalized" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED" }

  - name: AlternateSite
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Site name; unique" }
      - { name: site_type, type: enum, source: input, description: "HOT | WARM | COLD | WORK_AREA_RECOVERY" }
      - { name: region, type: string, source: input, description: "Geographic region code" }
      - { name: capacity_seats, type: integer, source: input, description: "Total bookable seats" }
      - { name: contracted_through, type: datetime, source: input, description: "Contract expiry timestamp (ISO8601 UTC)" }
      - { name: monthly_cost, type: number, source: input, description: "Monthly contract cost (USD, 2dp)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: SiteReservation
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> AlternateSite.id; reserved site" }
      - { name: process_id, type: string, source: input, description: "FK -> Process.id; reserving process" }
      - { name: purpose, type: enum, source: input, description: "EXERCISE | INCIDENT" }
      - { name: seats_reserved, type: integer, source: input, description: "Seats consumed against site capacity" }
      - { name: starts_at, type: datetime, source: input, description: "Occupation window start (ISO8601 UTC, inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Occupation window end (ISO8601 UTC, exclusive); must be after starts_at" }
      - { name: created_by_contact_id, type: string, source: input, description: "FK -> Contact.id; requester of the reservation (segregation-of-duties reference for release)" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | RELEASED" }

  - name: Exercise
    parent: null
    common_fields: true
    fields:
      - { name: process_id, type: string, source: input, description: "FK -> Process.id; process under test" }
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; plan exercised; must belong to the same process and be APPROVED at scheduling time" }
      - { name: exercise_type, type: enum, source: input, description: "TABLETOP | FAILOVER" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned start (ISO8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned end (ISO8601 UTC); must be after scheduled_start" }
      - { name: completion_outcome, type: enum, source: input, description: "Declared outcome recorded by the completing officer: MET | MISSED | PARTIAL" }
      - { name: achieved_rto_hours, type: integer, source: input, description: "Observed recovery time (hours) at completion" }
      - { name: achieved_rpo_hours, type: integer, source: input, description: "Observed data loss (hours) at completion" }
      - { name: result, type: enum, source: computed, description: "Derived per calculations.exercise_result at completion: MET | PARTIAL | MISSED; null until COMPLETED" }
      - { name: requires_capability_check, type: boolean, source: computed, description: "True iff exercise_type == FAILOVER; drives completion-gate on RecoveryCapability" }
      - { name: validation_run_id, type: string, source: computed, description: "FK -> ValidationRun.id; run produced by completion cascade; null until COMPLETED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: Finding
    parent: null
    common_fields: true
    fields:
      - { name: exercise_id, type: string, source: input, description: "FK -> Exercise.id; exercise that surfaced the finding" }
      - { name: process_id, type: string, source: input, description: "FK -> Process.id; affected process; must equal the exercise's process" }
      - { name: severity, type: enum, source: input, description: "CRITICAL | HIGH | MEDIUM | LOW" }
      - { name: description, type: string, source: input, description: "Finding narrative" }
      - { name: due_date, type: datetime, source: input, description: "Remediation due date (ISO8601 UTC)" }
      - { name: root_cause, type: string, source: input, description: "Root-cause narrative recorded at verification; optional at creation" }
      - { name: verified_by_contact_id, type: string, source: computed, description: "FK -> Contact.id; verifier; null until VERIFIED" }
      - { name: rejected_reason, type: string, source: input, description: "Reason recorded on REJECTED (optional)" }
      - { name: status, type: enum, source: system, description: "OPEN | REMEDIATING | VERIFIED | REJECTED" }

  - name: RecoveryCapability
    parent: null
    common_fields: true
    fields:
      - { name: process_id, type: string, source: input, description: "FK -> Process.id; capability-owning process" }
      - { name: capability_type, type: enum, source: input, description: "SITE | WORKFORCE | DATA_RESTORE | VENDOR_FAILOVER" }
      - { name: capability_ref_id, type: string, source: input, description: "FK -> AlternateSite.id when capability_type is SITE; FK -> ThirdParty.id when VENDOR_FAILOVER; opaque label otherwise" }
      - { name: proven_rto_hours, type: integer, source: computed, description: "Best (minimum) demonstrated RTO across VALIDATED runs; null when never validated" }
      - { name: proven_rpo_hours, type: integer, source: computed, description: "Best (minimum) demonstrated RPO across VALIDATED runs; null when never validated" }
      - { name: meets_bia, type: boolean, source: computed, description: "True iff proven values exist and are <= the process's latest APPROVED BIA targets; false when no approved BIA" }
      - { name: last_validation_run_id, type: string, source: computed, description: "FK -> ValidationRun.id; latest run for this capability; null when none" }
      - { name: validation_freshness, type: enum, source: computed, description: "CURRENT | STALE | NEVER; NEVER when the capability has no validation runs; STALE when the latest RECORDED run is older than 12 months (FRESHNESS_MONTHS = 12) or any Gap with capability_id == this capability is overdue; otherwise CURRENT" }
      - { name: status, type: enum, source: system, description: "UNPROVEN | VALIDATED | GAP_IDENTIFIED | REMEDIATED" }

  - name: ValidationRun
    parent: null
    common_fields: true
    fields:
      - { name: capability_id, type: string, source: input, description: "FK -> RecoveryCapability.id; capability under test" }
      - { name: exercise_id, type: string, source: computed, description: "FK -> Exercise.id; source exercise when the run was produced by a FAILOVER completion cascade; null for standalone runs" }
      - { name: measured_rto_hours, type: integer, source: input, description: "Measured recovery time (hours)" }
      - { name: measured_rpo_hours, type: integer, source: input, description: "Measured data loss (hours)" }
      - { name: method, type: enum, source: input, description: "FAILOVER | SIMULATION | COMPONENT_TEST" }
      - { name: evidence_ref, type: string, source: input, description: "Evidence artifact reference" }
      - { name: result, type: enum, source: computed, description: "Derived per calculations.validation_run_result: VALIDATED | GAP_IDENTIFIED" }
      - { name: gap_created_id, type: string, source: computed, description: "FK -> Gap.id created by this run when result is GAP_IDENTIFIED; null otherwise" }
      - { name: status, type: enum, source: system, description: "RECORDED | SUPERSEDED" }

