# =============================================================================
# SCAFFOLD.yaml — task_3401 Seasonal Confection Production Planning &
# Retail Sell-Through Windows (The Hershey Company)
# Sections §1.0–§1.7. Difficulty calibration: BEYOND EXPERT (task instruction:
# "Generate task much harder than expert level!") — 12 entities, 51 endpoints,
# 47 error codes, 8 state machines (3 cyclic/branching), dual-variant calcs on
# two entity domains, combinatorial formulas in modes (a) and (b).
# =============================================================================

scenario: |
  Seasonal Confection Production Planning & Retail Sell-Through Windows (The Hershey Company): four distinct seasonal programs with molded shapes and packaging that cannot be sold outside their window, production scheduling months ahead with line changeovers between seasonal and everyday items, retailer commitment collection with ship windows, on-shelf dates and mandatory pull dates, unsold seasonal inventory disposition through markdown, secondary channel or destruction with brand protection rules, cocoa and sugar procurement with hedging against a fixed retail price, temperature-controlled warehousing and shipping in summer months with heat-related claims, everyday business protection so seasonal displays do not cannibalize core shelf, forecast error consequences with limited ability to reorder mid-season

domain_name: seasonal-confection-planning
api_prefix: /confection

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  # Overlapping/adjacent windows everywhere: commitment window, production
  # window, ship windows, on-shelf..pull window, disposition window,
  # changeover-buffered line reservations.
  secondary_archetype: quota_allocation
  # Produced seasonal supply is a finite per-product pool allocated across
  # confirmed retailer commitments by a tier-ranked waterfall with partial
  # fills and shortfall credits; mid-season reorder drains the residual pool.
  complexity_layers:
    - optimistic_concurrency   # OCC on SeasonalProgram.version (advance) and RetailerCommitment.version (revise)
    - cascading_side_effects   # run-complete -> lot -> warehouse load -> posture; pull -> quarantine -> cancel -> restore
    - dual_variant_calculation # landed cost (provisional vs final) and cannibalization (raw vs adjusted)
    - rate_threshold_triggers  # warehouse posture at 85%/100%, cannibalization floor 0.85, markdown pct band
  entity_topology: flat
  # Peer entities joined by foreign keys in request bodies; no nested URLs.
  state_machine_shape: cyclic
  # Program reopen loop (LOCKED -> OPEN_FOR_COMMITMENTS), HeatClaim
  # UNDER_REVIEW -> MORE_INFO -> UNDER_REVIEW, InventoryLot
  # AVAILABLE -> QUARANTINED -> AVAILABLE, Commitment FULFILLED -> FULFILLING
  # via reorder.
  relationship_patterns:
    - one_to_many        # Program -> Product/Run/Commitment/Report; Retailer -> Commitment/Report
    - cross_aggregate    # Shipment references Commitment + Warehouse + (via lots) ProductionRun
  role_model: segregation_of_duties
  # Retailer files heat claims, ClaimsAdjuster decides them; CategoryManager
  # proposes dispositions but a DIFFERENT CategoryManager user must approve.
  consistency_model: immediate
  difficulty_calibration: beyond_expert

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all joins via body FKs)
# =============================================================================
entities:
  - name: SeasonalProgram
    parent: null
    common_fields: true
    fields:
      - { name: season_code, type: enum, source: input, description: "One of the four seasonal programs", constraints: "VALENTINES | EASTER | HALLOWEEN | CHRISTMAS" }
      - { name: season_year, type: integer, source: input, description: "Retail season year (e.g. 2027)", constraints: ">= 2026" }
      - { name: commitment_open_on, type: datetime, source: input, description: "Retailer commitment collection opens at this instant" }
      - { name: commitment_close_on, type: datetime, source: input, description: "Commitment collection closes; submits allowed on [commitment_open_on, commitment_close_on)" }
      - { name: production_deadline_on, type: datetime, source: input, description: "Last allowed scheduled_end_on for SEASONAL production runs of this program" }
      - { name: ship_window_open_on, type: datetime, source: input, description: "Earliest ship_on for any shipment of this program" }
      - { name: ship_window_close_on, type: datetime, source: input, description: "Latest ship_on for any shipment of this program (inclusive)" }
      - { name: on_shelf_on, type: datetime, source: input, description: "Retail on-shelf date; sell-through reports open here" }
      - { name: pull_on, type: datetime, source: input, description: "Mandatory pull date; advancing at/after this quarantines all remaining seasonal stock" }
      - { name: destroy_by_on, type: datetime, source: input, description: "After this instant only DESTRUCTION dispositions may execute" }
      - { name: retail_price_cents, type: integer, source: input, description: "FIXED retail price per unit for every product of this program", constraints: "> 0" }
      - { name: forecast_units, type: integer, source: input, description: "Forecasted seasonal demand in units", constraints: "> 0" }
      - { name: produced_units_total, type: integer, source: computed, default: 0, description: "Sum of produced_units over COMPLETE ProductionRuns whose program_id = this program" }
      - { name: committed_units_total, type: integer, source: computed, default: 0, description: "Sum of committed_units over commitments in {CONFIRMED, ALLOCATED, SHORTED, FULFILLING, FULFILLED}" }
      - { name: shipped_units_total, type: integer, source: computed, default: 0, description: "Sum of units over shipments in {PLANNED, DELIVERED} for commitments of this program" }
      - { name: disposed_units_total, type: integer, source: computed, default: 0, description: "Sum of units over EXECUTED DispositionOrders of this program" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Times LOCKED -> OPEN_FOR_COMMITMENTS reopen has been used; hard max MAX_REOPEN = 1" }
      - { name: status, type: enum, source: system, description: "PLANNING | OPEN_FOR_COMMITMENTS | LOCKED | IN_PRODUCTION | SHIPPING | ON_SHELF | DISPOSITION | CLOSED | CANCELLED" }
    constraints: "unique(season_code, season_year); commitment_open_on < commitment_close_on <= production_deadline_on <= ship_window_open_on < ship_window_close_on <= on_shelf_on < pull_on < destroy_by_on"

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SeasonalProgram.id; REQUIRED iff kind == SEASONAL, MUST be null iff kind == EVERYDAY", constraints: "null iff kind == EVERYDAY" }
      - { name: sku_code, type: string, source: input, description: "Globally unique SKU code", constraints: "unique" }
      - { name: kind, type: enum, source: input, description: "SEASONAL | EVERYDAY" }
      - { name: molded_shape, type: string, source: input, description: "Molded shape name, e.g. pumpkin, heart, egg, standard-bar" }
      - { name: brand_protected, type: boolean, source: input, description: "true = branded molded shape that may never be diverted to SECONDARY channel" }
      - { name: requires_temp_control, type: boolean, source: input, description: "true = heat-sensitive; summer shipments without temp control auto-approve heat claims" }
      - { name: units_per_case, type: integer, source: input, description: "Units per case", constraints: "> 0" }

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SeasonalProgram.id; REQUIRED iff product is SEASONAL, MUST be null iff product is EVERYDAY", constraints: "null iff product.kind == EVERYDAY" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: line_code, type: string, source: input, description: "Production line identifier (free-form; changeover/overlap rules key on it)" }
      - { name: planned_units, type: integer, source: input, description: "Planned units", constraints: "> 0" }
      - { name: produced_units, type: integer, source: system, default: 0, description: "Set from complete input; immutable afterwards" }
      - { name: scheduled_start_on, type: datetime, source: input, description: "Planned start instant" }
      - { name: scheduled_end_on, type: datetime, source: input, description: "Planned end instant", constraints: "> scheduled_start_on" }
      - { name: completed_warehouse_id, type: string, source: system, description: "FK -> Warehouse.id; warehouse that received the produced lot (set at complete)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETE | CANCELLED" }

  - name: RetailerAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Retailer banner name" }
      - { name: region, type: string, source: input, description: "Sales region code" }
      - { name: tier, type: enum, source: input, description: "GOLD | SILVER | BRONZE — allocation priority rank" }
      - { name: max_seasonal_units, type: integer, source: input, description: "Everyday-business protection: cap on total seasonal committed units across all programs", constraints: "> 0" }
      - { name: everyday_baseline_weekly_units, type: integer, source: input, description: "Baseline weekly everyday-shelf velocity used by cannibalization_index", constraints: "> 0" }
      - { name: credit_balance_cents, type: integer, source: system, default: 0, description: "Ledger of shortfall credits + approved heat-claim credits" }

  - name: RetailerCommitment
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SeasonalProgram.id" }
      - { name: retailer_id, type: string, source: input, description: "FK -> RetailerAccount.id; must equal X-User-ID when X-User-Role == Retailer" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product must be SEASONAL and belong to program_id" }
      - { name: committed_units, type: integer, source: input, description: "Units the retailer commits to take", constraints: "> 0" }
      - { name: allocated_units, type: integer, source: system, default: 0, description: "Units granted by commitment_supply_allocation; grows via reorder" }
      - { name: reorder_units, type: integer, source: system, default: 0, description: "Units granted by the single allowed mid-season reorder" }
      - { name: reorder_used, type: boolean, source: system, default: false, description: "true once the one reorder per commitment has been consumed" }
      - { name: revision, type: integer, source: system, default: 1, description: "1 on create; each revise creates the successor with revision+1" }
      - { name: supersedes_commitment_id, type: string, source: system, description: "FK -> RetailerCommitment.id; the prior revision this row supersedes (null on revision 1)" }
      - { name: ship_window_open_on, type: datetime, source: input, description: "Retailer-specific earliest ship_on; must be >= program.ship_window_open_on" }
      - { name: ship_window_close_on, type: datetime, source: input, description: "Retailer-specific latest ship_on; must be <= program.ship_window_close_on" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | CONFIRMED | ALLOCATED | SHORTED | FULFILLING | FULFILLED | CANCELLED | SUPERSEDED" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: commitment_id, type: string, source: input, description: "FK -> RetailerCommitment.id" }
      - { name: warehouse_id, type: string, source: input, description: "FK -> Warehouse.id; stock is drawn from this warehouse's AVAILABLE lots" }
      - { name: units, type: integer, source: input, description: "Units shipped", constraints: "> 0" }
      - { name: ship_on, type: datetime, source: input, description: "Ship instant; must lie inside BOTH the commitment window and the program ship window" }
      - { name: temp_controlled, type: boolean, source: input, description: "Whether refrigerated transport is used" }
      - { name: temp_control_declined_by_retailer, type: boolean, source: input, default: false, description: "Retailer explicitly declined temp control; halves heat-claim credit pct" }
      - { name: delivered_on, type: datetime, source: system, description: "Set from logical clock at deliver; null until DELIVERED" }
      - { name: status, type: enum, source: system, description: "PLANNED | DELIVERED | CANCELLED" }

  - name: HeatClaim
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id; shipment must be DELIVERED" }
      - { name: claimed_units, type: integer, source: input, description: "Units claimed damaged by heat", constraints: ">= 1; sum over non-REJECTED claims of the shipment <= shipment.units" }
      - { name: reason, type: enum, source: input, description: "MELT | BLOOM | PACKAGING_COMPROMISE" }
      - { name: evidence_note, type: string, source: input, description: "Free-text evidence; refreshed by provide-info" }
      - { name: auto_approve, type: boolean, source: computed, description: "true iff product.requires_temp_control AND NOT temp_controlled AND NOT declined AND ship_on month in SUMMER_MONTHS" }
      - { name: credit_cents, type: integer, source: computed, description: "Set on APPROVED by heat_claim_settlement; null before" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | MORE_INFO | APPROVED | REJECTED" }

  - name: Warehouse
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Warehouse name" }
      - { name: temp_controlled, type: boolean, source: input, description: "Whether the building is temperature controlled" }
      - { name: capacity_units, type: integer, source: input, description: "Total unit capacity", constraints: "> 0" }
      - { name: in_use_units, type: integer, source: computed, default: 0, description: "Sum of units_on_hand over lots at this warehouse in {AVAILABLE, QUARANTINED}" }
      - { name: quarantined_units, type: integer, source: computed, default: 0, description: "Sum of units_on_hand over QUARANTINED lots at this warehouse" }
      - { name: posture, type: enum, source: computed, description: "OPEN | CONGESTED | FULL — derived by warehouse_load_and_posture" }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id (from the completing run)" }
      - { name: warehouse_id, type: string, source: system, description: "FK -> Warehouse.id (from the complete call)" }
      - { name: production_run_id, type: string, source: system, description: "FK -> ProductionRun.id; exactly one lot per completing run" }
      - { name: lot_code, type: string, source: system, description: "LOT-<zero-padded monotone sequence>; deterministic tie-break after created_at" }
      - { name: units_on_hand, type: integer, source: computed, description: "Starts at run.produced_units; decremented by shipment FEFO allocation and disposition consumption; restored by shipment cancellation" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | QUARANTINED | DISPOSITIONED | DEPLETED" }

  - name: DispositionOrder
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SeasonalProgram.id; program must be in DISPOSITION" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; must be a SEASONAL product of program_id" }
      - { name: warehouse_id, type: string, source: input, description: "FK -> Warehouse.id; consumes QUARANTINED lots at this warehouse" }
      - { name: units, type: integer, source: input, description: "Units to dispose", constraints: ">= 1; <= quarantined units of the product at the warehouse" }
      - { name: channel, type: enum, source: input, description: "MARKDOWN | SECONDARY | DESTRUCTION" }
      - { name: markdown_pct, type: number, source: input, description: "Required iff channel == MARKDOWN; fraction in [MIN_MARKDOWN_PCT, MAX_MARKDOWN_PCT]" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the proposing CategoryManager" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approving CategoryManager; must differ from proposed_by_user_id" }
      - { name: recovered_value_cents, type: integer, source: computed, description: "Set at execute: MARKDOWN via markdown_recovery_value; SECONDARY = units x price x SECONDARY_RECOVERY_PCT; DESTRUCTION = 0" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | EXECUTED | REJECTED" }

  - name: CommodityContract
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SeasonalProgram.id; procurement is per program-year" }
      - { name: commodity, type: enum, source: input, description: "COCOA | SUGAR" }
      - { name: quantity_units, type: integer, source: input, description: "Contracted commodity units", constraints: "> 0" }
      - { name: contract_price_cents_per_unit, type: integer, source: input, description: "Contracted price", constraints: "> 0" }
      - { name: hedged_quantity_units, type: integer, source: input, default: 0, description: "Hedged portion of quantity_units", constraints: "0 <= hedged <= quantity_units" }
      - { name: hedge_price_cents_per_unit, type: integer, source: input, description: "Hedge strike price; REQUIRED iff hedged_quantity_units > 0" }
      - { name: spot_price_cents_per_unit, type: integer, source: system, description: "Market price at settlement (settle input)" }
      - { name: provisional_spend_cents, type: integer, source: computed, description: "PROVISIONAL variant: quantity x contract_price - hedged x max(0, contract_price - hedge_price); computed at create" }
      - { name: effective_spend_cents, type: integer, source: computed, description: "FINAL variant at settle: quantity x spot_price - hedged x max(0, spot_price - hedge_price)" }
      - { name: status, type: enum, source: system, description: "OPEN | SETTLED" }

  - name: SellThroughReport
    parent: null
    common_fields: true
    fields:
      - { name: retailer_id, type: string, source: input, description: "FK -> RetailerAccount.id; must equal X-User-ID when X-User-Role == Retailer" }
      - { name: program_id, type: string, source: input, description: "FK -> SeasonalProgram.id" }
      - { name: week_of_on, type: datetime, source: input, description: "Monday of the reported week; must lie in [program.on_shelf_on, program.pull_on]" }
      - { name: seasonal_units_sold, type: integer, source: input, description: "Seasonal units sold that week", constraints: ">= 0" }
      - { name: seasonal_units_on_hand, type: integer, source: input, description: "Seasonal units still on shelf", constraints: ">= 0" }
      - { name: everyday_units_sold, type: integer, source: input, description: "Everyday core-shelf units sold that week (cannibalization numerator)", constraints: ">= 0" }
      - { name: cannibalization_raw, type: number, source: computed, description: "RAW variant: everyday_units_sold / retailer.everyday_baseline_weekly_units; 4dp round_half_up" }
      - { name: cannibalization_adjusted, type: number, source: computed, description: "SEASONALLY_ADJUSTED variant: everyday_units_sold / (baseline x SEASONAL_LIFT[program.season_code]); 4dp round_half_up" }
    constraints: "unique(retailer_id, program_id, week_of_on)"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SeasonalProgram
    initial_state: PLANNING
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNING
        to: OPEN_FOR_COMMITMENTS
        trigger: "POST /confection/seasonal-programs/{id}/advance (to_state=OPEN_FOR_COMMITMENTS)"
        actor: PlatformAdmin
        preconditions: ["expected_program_version matches program.version"]
        side_effects: ["increments SeasonalProgram.version by 1"]
      - from: OPEN_FOR_COMMITMENTS
        to: LOCKED
        trigger: "POST /confection/seasonal-programs/{id}/advance (to_state=LOCKED)"
        actor: PlatformAdmin
        preconditions:
          - "expected_program_version matches program.version"
          - "logical clock >= commitment_close_on (else ERR_PROGRAM_ADVANCE_TOO_EARLY)"
        side_effects: ["increments SeasonalProgram.version by 1"]
      - from: LOCKED
        to: OPEN_FOR_COMMITMENTS
        trigger: "POST /confection/seasonal-programs/{id}/advance (to_state=OPEN_FOR_COMMITMENTS) — REOPEN loop"
        actor: PlatformAdmin
        preconditions:
          - "expected_program_version matches program.version"
          - "reopen_count < MAX_REOPEN (1) (else ERR_PROGRAM_REOPEN_EXHAUSTED)"
        side_effects:
          - "reopen_count += 1"
          - "increments SeasonalProgram.version by 1"
        note: "the sanctioned cycle: LOCKED -> OPEN_FOR_COMMITMENTS at most once"
      - from: LOCKED
        to: IN_PRODUCTION
        trigger: "POST /confection/seasonal-programs/{id}/advance (to_state=IN_PRODUCTION)"
        actor: PlatformAdmin
        preconditions:
          - "expected_program_version matches program.version"
          - "at least one non-CANCELLED ProductionRun with program_id = this program (else ERR_NO_PRODUCTION_SCHEDULED)"
        side_effects: ["increments SeasonalProgram.version by 1"]
      - from: IN_PRODUCTION
        to: SHIPPING
        trigger: "POST /confection/seasonal-programs/{id}/advance (to_state=SHIPPING)"
        actor: PlatformAdmin
        preconditions:
          - "expected_program_version matches program.version"
          - "logical clock >= ship_window_open_on (else ERR_PROGRAM_ADVANCE_TOO_EARLY)"
        side_effects:
          - "runs commitment_supply_allocation per SEASONAL product: CONFIRMED commitments -> ALLOCATED or SHORTED; shortfall credits land on RetailerAccount.credit_balance_cents"
          - "recomputes committed_units_total"
          - "increments SeasonalProgram.version by 1"
      - from: SHIPPING
        to: ON_SHELF
        trigger: "POST /confection/seasonal-programs/{id}/advance (to_state=ON_SHELF)"
        actor: PlatformAdmin
        preconditions:
          - "expected_program_version matches program.version"
          - "logical clock >= on_shelf_on (else ERR_PROGRAM_ADVANCE_TOO_EARLY)"
        side_effects: ["increments SeasonalProgram.version by 1"]
      - from: ON_SHELF
        to: DISPOSITION
        trigger: "POST /confection/seasonal-programs/{id}/advance (to_state=DISPOSITION)"
        actor: PlatformAdmin
        preconditions:
          - "expected_program_version matches program.version"
          - "logical clock >= pull_on (else ERR_PROGRAM_ADVANCE_TOO_EARLY)"
        side_effects:
          - "LINK 1: every AVAILABLE InventoryLot whose product is SEASONAL and belongs to this program -> QUARANTINED (everyday lots and other programs' lots untouched)"
          - "LINK 2: every PLANNED Shipment whose commitment belongs to this program -> CANCELLED (shipment of quarantined stock cannot ship)"
          - "LINK 3: each cancelled shipment's units are restored to the exact lots they were drawn from (units_on_hand += shipped units per source lot, in the reverse of FEFO draw order)"
          - "recomputes Warehouse.in_use_units / quarantined_units / posture for affected warehouses and program.shipped_units_total"
          - "increments SeasonalProgram.version by 1"
      - from: DISPOSITION
        to: CLOSED
        trigger: "POST /confection/seasonal-programs/{id}/advance (to_state=CLOSED)"
        actor: PlatformAdmin
        preconditions:
          - "expected_program_version matches program.version"
          - "no QUARANTINED lot with units_on_hand > 0 for any product of this program (else ERR_UNDISPOSED_STOCK_REMAINS)"
        side_effects: ["increments SeasonalProgram.version by 1"]
      - from: PLANNING
        to: CANCELLED
        trigger: "POST /confection/seasonal-programs/{id}/advance (to_state=CANCELLED)"
        actor: PlatformAdmin
        preconditions: ["expected_program_version matches program.version"]
        side_effects:
          - "every commitment of this program in {DRAFT, SUBMITTED, CONFIRMED} -> CANCELLED"
          - "increments SeasonalProgram.version by 1"
      - from: OPEN_FOR_COMMITMENTS
        to: CANCELLED
        trigger: "POST /confection/seasonal-programs/{id}/advance (to_state=CANCELLED)"
        actor: PlatformAdmin
        preconditions: ["expected_program_version matches program.version"]
        side_effects:
          - "every commitment of this program in {DRAFT, SUBMITTED, CONFIRMED} -> CANCELLED"
          - "increments SeasonalProgram.version by 1"

  - entity: ProductionRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /confection/production-runs/{id}/start"
        actor: ProductionPlanner
        preconditions:
          - "if product is SEASONAL: program.status in {LOCKED, IN_PRODUCTION} (else ERR_INVALID_STATE)"
        side_effects: ["increments ProductionRun.version by 1"]
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /confection/production-runs/{id}/complete"
        actor: ProductionPlanner
        preconditions:
          - "warehouse exists"
          - "warehouse_load_and_posture gate: in_use_units + produced_units > capacity_units -> ERR_WAREHOUSE_FULL"
          - "if warehouse.posture == CONGESTED and product is SEASONAL -> ERR_WAREHOUSE_CONGESTED_SEASONAL"
        side_effects:
          - "produced_units set from input; increments ProductionRun.version by 1"
          - "LINK 1: creates the InventoryLot (one per run) with units_on_hand = produced_units, status AVAILABLE"
          - "LINK 2: recomputes Warehouse.in_use_units, which via warehouse_load_and_posture flips Warehouse.posture (OPEN -> CONGESTED at >= floor(0.85 x capacity); CONGESTED -> FULL at >= capacity)"
          - "recomputes SeasonalProgram.produced_units_total (SEASONAL runs only)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /confection/production-runs/{id}/cancel"
        actor: ProductionPlanner
        preconditions: []
        side_effects: ["increments ProductionRun.version by 1; the run no longer participates in overlap/changeover checks"]

  - entity: RetailerCommitment
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /confection/retailer-commitments/{id}/submit"
        actor: Retailer
        preconditions:
          - "acting Retailer owns the commitment (retailer_id == X-User-ID, else ERR_OWNERSHIP_MISMATCH)"
          - "program.status == OPEN_FOR_COMMITMENTS (else ERR_PROGRAM_NOT_OPEN)"
          - "commitment_open_on <= logical clock < commitment_close_on (else ERR_COMMITMENT_WINDOW_CLOSED)"
        side_effects: ["increments RetailerCommitment.version by 1"]
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /confection/retailer-commitments/{id}/confirm"
        actor: CategoryManager
        preconditions:
          - "everyday-shelf cap: sum of committed_units over the retailer's commitments in {SUBMITTED, CONFIRMED, ALLOCATED, SHORTED, FULFILLING, FULFILLED} (this commitment included) <= retailer.max_seasonal_units (else ERR_SHELF_CAP_EXCEEDED)"
        side_effects:
          - "recomputes SeasonalProgram.committed_units_total"
          - "increments RetailerCommitment.version by 1"
      - from: CONFIRMED
        to: ALLOCATED
        trigger: "system (commitment_supply_allocation at program advance to SHIPPING)"
        actor: system
        preconditions: ["waterfall grants allocated_units == committed_units"]
        side_effects: ["allocated_units := committed_units", "increments RetailerCommitment.version by 1"]
      - from: CONFIRMED
        to: SHORTED
        trigger: "system (commitment_supply_allocation at program advance to SHIPPING)"
        actor: system
        preconditions: ["waterfall grants allocated_units < committed_units (possibly 0)"]
        side_effects:
          - "allocated_units := granted units"
          - "RetailerAccount.credit_balance_cents += round_half_up((committed_units - allocated_units) x program.retail_price_cents x SHORTFALL_CREDIT_PCT)"
          - "increments RetailerCommitment.version by 1"
      - from: ALLOCATED
        to: FULFILLING
        trigger: "system (first Shipment created for this commitment)"
        actor: system
        preconditions: []
        side_effects: ["increments RetailerCommitment.version by 1"]
      - from: SHORTED
        to: FULFILLING
        trigger: "system (first Shipment created for this commitment)"
        actor: system
        preconditions: []
        side_effects: ["increments RetailerCommitment.version by 1"]
      - from: FULFILLING
        to: FULFILLED
        trigger: "system (sum of DELIVERED shipment units >= allocated_units after a deliver)"
        actor: system
        preconditions: []
        side_effects: ["increments RetailerCommitment.version by 1"]
      - from: FULFILLED
        to: FULFILLING
        trigger: "system (reorder raises allocated_units above delivered units)"
        actor: system
        preconditions: []
        side_effects: ["increments RetailerCommitment.version by 1"]
        note: "reorder cycle: FULFILLED can reopen to FULFILLING exactly once via the single allowed reorder"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "POST /confection/retailer-commitments/{id}/revise (CREATE-with-supersede)"
        actor: Retailer
        preconditions:
          - "acting Retailer owns the commitment (else ERR_OWNERSHIP_MISMATCH)"
          - "expected_commitment_version matches this commitment's version (else ERR_STALE_VERSION)"
          - "program.status == OPEN_FOR_COMMITMENTS (else ERR_PROGRAM_NOT_OPEN)"
          - "logical clock < commitment_close_on (else ERR_COMMITMENT_WINDOW_CLOSED)"
        side_effects:
          - "this commitment -> SUPERSEDED; increments RetailerCommitment.version by 1"
          - "creates successor commitment: same program/retailer/product, new committed_units (and windows if supplied), revision+1, supersedes_commitment_id = this id, status SUBMITTED, version 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /confection/retailer-commitments/{id}/cancel"
        actor: Retailer
        preconditions: ["acting Retailer owns the commitment (else ERR_OWNERSHIP_MISMATCH)"]
        side_effects: ["increments RetailerCommitment.version by 1"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /confection/retailer-commitments/{id}/cancel"
        actor: Retailer
        preconditions: ["acting Retailer owns the commitment (else ERR_OWNERSHIP_MISMATCH)"]
        side_effects: ["increments RetailerCommitment.version by 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /confection/retailer-commitments/{id}/cancel"
        actor: Retailer
        preconditions: ["acting Retailer owns the commitment (else ERR_OWNERSHIP_MISMATCH)"]
        side_effects:
          - "recomputes SeasonalProgram.committed_units_total"
          - "increments RetailerCommitment.version by 1"

  - entity: Shipment
    initial_state: PLANNED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DELIVERED
        trigger: "POST /confection/shipments/{id}/deliver"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects:
          - "delivered_on := logical clock; increments Shipment.version by 1"
          - "if sum of DELIVERED units over the commitment's shipments >= commitment.allocated_units: commitment -> FULFILLED"
      - from: PLANNED
        to: CANCELLED
        trigger: "system (program advance to DISPOSITION — pull cascade LINK 2)"
        actor: system
        preconditions: []
        side_effects:
          - "restores units to source lots (cascade LINK 3); recomputes program.shipped_units_total"
          - "increments Shipment.version by 1"

  - entity: HeatClaim
    initial_state: FILED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "system (automatic on claim creation)"
        actor: system
        preconditions: []
        side_effects: ["increments HeatClaim.version by 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /confection/heat-claims/{id}/decide (decision=APPROVE)"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "credit_cents := heat_claim_settlement(claimed_units, retail_price_cents, pct branch)"
          - "RetailerAccount.credit_balance_cents += credit_cents (retailer = shipment's commitment's retailer)"
          - "increments HeatClaim.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /confection/heat-claims/{id}/decide (decision=REJECT)"
        actor: ClaimsAdjuster
        preconditions:
          - "auto_approve == false (else ERR_CLAIM_AUTO_APPROVED — summer non-temp-controlled shipments of temp-required product may not be rejected)"
        side_effects: ["increments HeatClaim.version by 1"]
      - from: UNDER_REVIEW
        to: MORE_INFO
        trigger: "POST /confection/heat-claims/{id}/decide (decision=REQUEST_MORE_INFO)"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: ["increments HeatClaim.version by 1"]
      - from: MORE_INFO
        to: UNDER_REVIEW
        trigger: "POST /confection/heat-claims/{id}/provide-info"
        actor: Retailer
        preconditions: ["acting Retailer owns the underlying commitment (else ERR_OWNERSHIP_MISMATCH)"]
        side_effects: ["evidence_note replaced; increments HeatClaim.version by 1"]
        note: "the review cycle: UNDER_REVIEW -> MORE_INFO -> UNDER_REVIEW, repeatable"

  - entity: InventoryLot
    initial_state: AVAILABLE
    terminal_states: [DISPOSITIONED, DEPLETED]
    transitions:
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /confection/inventory-lots/{id}/quarantine (manual QA hold) OR system (program pull cascade LINK 1)"
        actor: CategoryManager | system
        preconditions:
          - "manual: program of the lot's product is NOT in {DISPOSITION, CLOSED, CANCELLED} (else ERR_INVALID_STATE)"
        side_effects:
          - "recomputes Warehouse.in_use_units / quarantined_units / posture"
          - "increments InventoryLot.version by 1"
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /confection/inventory-lots/{id}/release-quarantine"
        actor: CategoryManager
        preconditions:
          - "program of the lot's product is NOT in {DISPOSITION, CLOSED, CANCELLED} (post-pull quarantine is permanent; else ERR_INVALID_STATE)"
        side_effects:
          - "recomputes Warehouse.quarantined_units / posture"
          - "increments InventoryLot.version by 1"
        note: "the quarantine cycle: AVAILABLE -> QUARANTINED -> AVAILABLE for pre-pull QA holds"
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system (units_on_hand reaches 0 after shipment FEFO draw)"
        actor: system
        preconditions: []
        side_effects: ["recomputes Warehouse.in_use_units / posture"]
      - from: QUARANTINED
        to: DISPOSITIONED
        trigger: "system (units_on_hand reaches 0 after DispositionOrder execute consumption)"
        actor: system
        preconditions: []
        side_effects: ["recomputes Warehouse.in_use_units / quarantined_units / posture"]

  - entity: DispositionOrder
    initial_state: PROPOSED
    terminal_states: [EXECUTED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /confection/disposition-orders/{id}/approve"
        actor: CategoryManager
        preconditions:
          - "segregation of duties: approver X-User-ID != proposed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "if channel == MARKDOWN and at least one SellThroughReport exists for the program: average of cannibalization_raw over those reports >= CANNIBALIZATION_FLOOR (0.85) (else ERR_CANNIBALIZATION_GUARD)"
        side_effects:
          - "approved_by_user_id := X-User-ID; increments DispositionOrder.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /confection/disposition-orders/{id}/approve (decision=REJECT)"
        actor: CategoryManager
        preconditions:
          - "segregation of duties: approver X-User-ID != proposed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["approved_by_user_id := X-User-ID; increments DispositionOrder.version by 1"]
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /confection/disposition-orders/{id}/execute"
        actor: LogisticsCoordinator
        preconditions:
          - "if channel in {MARKDOWN, SECONDARY}: logical clock <= program.destroy_by_on (else ERR_DISPOSITION_WINDOW_CLOSED — after destroy-by only DESTRUCTION may execute)"
        side_effects:
          - "consumes QUARANTINED lots of the product at the warehouse in created_at ASC, lot_code ASC order; lot hitting 0 -> DISPOSITIONED"
          - "recovered_value_cents := markdown_recovery_value (MARKDOWN) | units x retail_price_cents x SECONDARY_RECOVERY_PCT rounded whole cents (SECONDARY) | 0 (DESTRUCTION)"
          - "recomputes Warehouse.in_use_units / quarantined_units / posture and SeasonalProgram.disposed_units_total"
          - "increments DispositionOrder.version by 1"

  - entity: CommodityContract
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: SETTLED
        trigger: "POST /confection/commodity-contracts/{id}/settle"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "spot_price_cents_per_unit := input; effective_spend_cents := landed_material_cost FINAL variant"
          - "increments CommodityContract.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (true CREATE-with-supersede races only; OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: program-advance-stale-version
    parent_entity: SeasonalProgram
    write_endpoint: "POST /confection/seasonal-programs/{id}/advance"
    occ_field: "expected_program_version"
    description: |
      Advancing a SeasonalProgram whose version has advanced beyond the
      caller's last observed version is rejected. The transition guard set
      (window clocks, allocation side effects, reopen budget) is evaluated
      against a single observed snapshot; a caller holding a stale snapshot
      would otherwise re-drive a transition that a prior advance already
      mutated (e.g., consuming the single reopen or re-running allocation).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: commitment-revise-stale-version
    parent_entity: RetailerCommitment
    write_endpoint: "POST /confection/retailer-commitments/{id}/revise"
    occ_field: "expected_commitment_version"
    description: |
      Revising a RetailerCommitment whose version has advanced beyond the
      caller's last observed version is rejected. Revise legitimately
      supersedes the current SUBMITTED revision with a new one; a caller
      acting on a stale snapshot of the commitment (e.g., unaware that a
      prior revise already superseded it) must not fork a second successor.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: commitment_supply_allocation
    trigger: "SeasonalProgram advance IN_PRODUCTION -> SHIPPING"
    algorithm: waterfall_allocation
    formula: |
      for each SEASONAL Product p of the program:
        pool = sum(produced_units over COMPLETE runs with product_id == p.id)
        eligible = commitments with product_id == p.id and status == CONFIRMED
        sort eligible by TIER_RANK[retailer.tier] ASC, then created_at ASC
        remaining = pool
        for c in eligible (sorted order):
          grant = min(c.committed_units, remaining)
          remaining -= grant
          c.allocated_units = grant
          if grant == c.committed_units: c.status = ALLOCATED
          else:
            c.status = SHORTED
            shortfall = c.committed_units - grant
            credit = round_half_up(shortfall * program.retail_price_cents * SHORTFALL_CREDIT_PCT, 0)
            RetailerAccount(c.retailer_id).credit_balance_cents += credit
      Evaluation order is pinned: per-product pools are independent; within a
      product the tier-major / created_at-minor order is the ONLY order.
    input_set: "COMPLETE runs of the program's SEASONAL products; CONFIRMED commitments only (DRAFT/SUBMITTED/SUPERSEDED/CANCELLED excluded)"
    constants:
      SHORTFALL_CREDIT_PCT: 0.10
      TIER_RANK_GOLD: 0
      TIER_RANK_SILVER: 1
      TIER_RANK_BRONZE: 2
    precision: "integer units; shortfall credit in whole cents, round_half_up"
    variants:
      - name: full_vs_partial_fill
        when: "pool >= committed -> ALLOCATED; pool < committed -> SHORTED with credit"
        difference: "the same commitment yields allocated_units == committed_units or a strictly smaller grant plus a credit; zero-grant SHORTED (allocated_units == 0) is a legal outcome"

  - name: landed_material_cost
    trigger: "CommodityContract create (PROVISIONAL) and settle (FINAL)"
    algorithm: conditional_costing
    formula: |
      PROVISIONAL (at create, and on any read while OPEN):
        provisional_spend_cents = quantity_units * contract_price_cents_per_unit
          - hedged_quantity_units * max(0, contract_price_cents_per_unit - hedge_price_cents_per_unit)
      FINAL (at settle):
        effective_spend_cents = quantity_units * spot_price_cents_per_unit
          - hedged_quantity_units * max(0, spot_price_cents_per_unit - hedge_price_cents_per_unit)
      The hedge pays off only when the reference price exceeds the strike;
      the two variants price the IDENTICAL contract against different
      reference prices, so they diverge exactly when spot != contract.
    input_set: "the single CommodityContract row"
    constants: {}
    precision: "integer cents, exact (all operands integer)"
    variants:
      - name: provisional_vs_final
        when: "provisional while OPEN; final after SETTLED"
        difference: "provisional uses contract_price as reference; final uses actual spot_price — different cents for identical quantity/hedge data whenever spot != contract"

  - name: cannibalization_index
    trigger: "SellThroughReport create"
    algorithm: ratio_scoring
    formula: |
      RAW:                cannibalization_raw      = everyday_units_sold / retailer.everyday_baseline_weekly_units
      SEASONALLY_ADJUSTED: cannibalization_adjusted = everyday_units_sold / (retailer.everyday_baseline_weekly_units * SEASONAL_LIFT[program.season_code])
    input_set: "the new SellThroughReport row, its RetailerAccount baseline, its SeasonalProgram season_code"
    constants:
      SEASONAL_LIFT_VALENTINES: 1.10
      SEASONAL_LIFT_EASTER: 1.15
      SEASONAL_LIFT_HALLOWEEN: 1.25
      SEASONAL_LIFT_CHRISTMAS: 1.20
      CANNIBALIZATION_FLOOR: 0.85
    precision: "4 decimal places, round_half_up"
    variants:
      - name: raw_vs_seasonally_adjusted
        when: "both computed on every report; RAW drives the markdown approve guard; ADJUSTED is the planning view"
        difference: "adjusted divides by the season's expected everyday lift, so identical report data yields adjusted < raw for every season (all lifts > 1)"

  - name: markdown_recovery_value
    trigger: "DispositionOrder execute with channel == MARKDOWN"
    algorithm: nested_rounding
    formula: |
      unit_price_after_cents = round_half_up(program.retail_price_cents * (1 - markdown_pct), 0)   # per-unit FIRST
      recovered_value_cents    = unit_price_after_cents * units                                   # then multiply
      PINNED ORDER: round per unit, then multiply by units. The alternative
      (multiply units * price * (1 - pct), round once) yields different cents
      and is FORBIDDEN. Example: price 499, pct 0.15, units 10 ->
      424 * 10 = 4240 (pinned), NOT round(4241.5) = 4242.
    input_set: "the DispositionOrder + its program's retail_price_cents"
    constants:
      MIN_MARKDOWN_PCT: 0.10
      MAX_MARKDOWN_PCT: 0.70
    precision: "whole cents, round_half_up, per-unit-first"

  - name: heat_claim_settlement
    trigger: "HeatClaim decide with decision=APPROVE"
    algorithm: conditional_payout
    formula: |
      if shipment.temp_controlled:                                   pct = 1.00
      elif shipment.temp_control_declined_by_retailer:               pct = 0.50
      elif product.requires_temp_control and ship_on.month in SUMMER_MONTHS:  pct = 1.00  # auto-approve branch (REJECT forbidden)
      else:                                                          pct = 0.25           # goodwill
      credit_cents = round_half_up(claimed_units * program.retail_price_cents * pct, 0)
      Branch order is pinned top-to-bottom; the first matching branch wins.
    input_set: "the HeatClaim, its Shipment, the Shipment's Product and SeasonalProgram"
    constants:
      SUMMER_MONTHS: [6, 7, 8]
    precision: "whole cents, round_half_up per claim"

  - name: program_supply_pool
    trigger: "RetailerCommitment reorder (precondition) and GET supply-summary (read)"
    algorithm: aggregation
    formula: |
      remaining_pool(product) =
          sum(produced_units over COMPLETE runs of product)
        - sum(allocated_units over commitments of product in {ALLOCATED, SHORTED, FULFILLING, FULFILLED})
      reorder granted iff 1 <= requested_units <= remaining_pool(product)
      and commitment.reorder_used == false
      and program.status in {SHIPPING, ON_SHELF}
    input_set: "COMPLETE runs of the product; allocated commitments only"
    constants: {}
    precision: "integer units, exact"

  - name: warehouse_load_and_posture
    trigger: "lot create/consume/restore/quarantine/release; shipment draw"
    algorithm: threshold
    formula: |
      in_use_units       = sum(units_on_hand over lots of the warehouse in {AVAILABLE, QUARANTINED})
      quarantined_units  = sum(units_on_hand over lots of the warehouse in {QUARANTINED})
      if   in_use_units >= capacity_units:                        posture = FULL
      elif in_use_units >= floor(capacity_units * CONGESTED_PCT): posture = CONGESTED
      else:                                                       posture = OPEN
      Boundaries are INCLUSIVE (>=): in_use == floor(0.85 * capacity) is
      CONGESTED, not OPEN; in_use == capacity is FULL, not CONGESTED.
    input_set: "lots of the warehouse in {AVAILABLE, QUARANTINED}; DISPOSITIONED/DEPLETED excluded"
    constants:
      CONGESTED_PCT: 0.85
    precision: "integer units; floor applied before comparison"

  - name: production_line_conflict_check
    trigger: "ProductionRun create"
    algorithm: interval_conflict
    formula: |
      let others = non-CANCELLED runs with the same line_code
      OVERLAP: reject ERR_LINE_SCHEDULE_OVERLAP iff any other has
        other.scheduled_start_on < new.scheduled_end_on AND new.scheduled_start_on < other.scheduled_end_on
        (half-open [start, end): back-to-back touching is NOT overlap)
      CHANGEOVER: let prior = the other with the greatest scheduled_end_on <= new.scheduled_start_on
        if prior exists and kind(prior.product) != kind(new.product):
          require new.scheduled_start_on >= prior.scheduled_end_on + CHANGEOVER_HOURS hours
          else reject ERR_CHANGEOVER_VIOLATION
        same-kind switch requires NO gap (gap == 0 allowed); the 8h buffer is
        INCLUSIVE-SATISFIED: gap == exactly 8h passes.
      OVERLAP is evaluated before CHANGEOVER.
    input_set: "non-CANCELLED runs sharing the line_code"
    constants:
      CHANGEOVER_HOURS: 8
    precision: "second precision on instants"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins when a
# request violates several rules at once)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path ids exist, validated left-to-right (program before run before lot etc.)"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_RETAILER_NOT_FOUND | ERR_COMMITMENT_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_WAREHOUSE_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_DISPOSITION_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "entity-backed ownership: Retailer's X-User-ID must equal the target resource's retailer_id (commitment submit/revise/reorder/cancel, claim provide-info, report create)"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "Retailer-scoped mutation endpoints"
  - priority: 5
    category: existence
    check: "request-body foreign keys exist, checked in the endpoint's declared input order"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_RETAILER_NOT_FOUND | ERR_COMMITMENT_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_WAREHOUSE_NOT_FOUND"
    http_status: 404
    applies_to: "create endpoints with body FKs"
  - priority: 6
    category: state
    check: "OCC: expected_program_version == program.version (advance); expected_commitment_version == commitment.version (revise)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /confection/seasonal-programs/{id}/advance; POST /confection/retailer-commitments/{id}/revise"
  - priority: 7
    category: state
    check: "state machine preconditions: valid from-state for the trigger, program open for commitment submit/revise/create, program {LOCKED, IN_PRODUCTION} for seasonal run start, shipment DELIVERED for claim create, program DISPOSITION for disposition propose, program {SHIPPING, ON_SHELF} for reorder, single-reopen budget, production scheduled before IN_PRODUCTION, no undisposed stock before CLOSED"
    error_id: "ERR_INVALID_STATE | ERR_PROGRAM_NOT_OPEN | ERR_PROGRAM_REOPEN_EXHAUSTED | ERR_NO_PRODUCTION_SCHEDULED | ERR_UNDISPOSED_STOCK_REMAINS"
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 8
    category: business_safety
    check: "brand protection: SECONDARY channel forbidden for brand_protected products (ERR_BRAND_PROTECTION); heat claims with auto_approve condition may not be REJECTED (ERR_CLAIM_AUTO_APPROVED); disposition approver must differ from proposer (ERR_SEGREGATION_OF_DUTIES)"
    error_id: "ERR_BRAND_PROTECTION | ERR_CLAIM_AUTO_APPROVED | ERR_SEGREGATION_OF_DUTIES"
    http_status: 422
    applies_to: "disposition propose/approve, heat-claim decide"
  - priority: 9
    category: business_temporal
    check: "window and schedule rules: advance clock gates (ERR_PROGRAM_ADVANCE_TOO_EARLY); submit inside [commitment_open_on, commitment_close_on) (ERR_COMMITMENT_WINDOW_CLOSED); ship_on inside both ship windows (ERR_SHIP_WINDOW_VIOLATION); report week inside [on_shelf_on, pull_on] (ERR_REPORT_WEEK_OUT_OF_WINDOW); seasonal run end <= production_deadline_on (ERR_PRODUCTION_DEADLINE_VIOLATION); MARKDOWN/SECONDARY execute before destroy_by_on (ERR_DISPOSITION_WINDOW_CLOSED); line overlap (ERR_LINE_SCHEDULE_OVERLAP); changeover gap (ERR_CHANGEOVER_VIOLATION)"
    error_id: "ERR_PROGRAM_ADVANCE_TOO_EARLY | ERR_COMMITMENT_WINDOW_CLOSED | ERR_SHIP_WINDOW_VIOLATION | ERR_REPORT_WEEK_OUT_OF_WINDOW | ERR_PRODUCTION_DEADLINE_VIOLATION | ERR_DISPOSITION_WINDOW_CLOSED | ERR_LINE_SCHEDULE_OVERLAP | ERR_CHANGEOVER_VIOLATION"
    http_status: 422
    applies_to: "advance, submit, revise, shipment create, report create, run create, disposition execute"
  - priority: 10
    category: business_constraint
    check: "structural constraints: unique(season_code, season_year), unique(sku_code), unique(retailer, program, week_of) (ERR_DUPLICATE_RESOURCE); seasonal product/program coherence (ERR_PRODUCT_PROGRAM_MISMATCH); one reorder per commitment (ERR_REORDER_NOT_ALLOWED); markdown_pct in [0.10, 0.70] (ERR_MARKDOWN_OUT_OF_RANGE); aggregate claimed_units <= shipment.units (ERR_CLAIM_EXCEEDS_SHIPMENT); cumulative shipment units <= allocated_units (ERR_SHIPMENT_EXCEEDS_ALLOCATION); cannibalization floor for MARKDOWN approve (ERR_CANNIBALIZATION_GUARD); hedged <= quantity (ERR_HEDGE_EXCEEDS_QUANTITY); retailer shelf cap (ERR_SHELF_CAP_EXCEEDED); units <= quarantined stock (ERR_DISPOSITION_EXCEEDS_QUARANTINE)"
    error_id: "ERR_DUPLICATE_RESOURCE | ERR_PRODUCT_PROGRAM_MISMATCH | ERR_REORDER_NOT_ALLOWED | ERR_MARKDOWN_OUT_OF_RANGE | ERR_CLAIM_EXCEEDS_SHIPMENT | ERR_SHIPMENT_EXCEEDS_ALLOCATION | ERR_CANNIBALIZATION_GUARD | ERR_HEDGE_EXCEEDS_QUANTITY | ERR_SHELF_CAP_EXCEEDED | ERR_DISPOSITION_EXCEEDS_QUARANTINE"
    http_status: 422
    applies_to: "create and action endpoints as listed"
  - priority: 11
    category: business_fiscal
    check: "capacity and pool gates (evaluated last): warehouse FULL/overflow (ERR_WAREHOUSE_FULL); CONGESTED seasonal inbound block (ERR_WAREHOUSE_CONGESTED_SEASONAL); FEFO stock sufficiency for shipment (ERR_INSUFFICIENT_STOCK); reorder pool exhausted (ERR_SUPPLY_POOL_EXHAUSTED)"
    error_id: "ERR_WAREHOUSE_FULL | ERR_WAREHOUSE_CONGESTED_SEASONAL | ERR_INSUFFICIENT_STOCK | ERR_SUPPLY_POOL_EXHAUSTED"
    http_status: 409
    applies_to: "run complete, shipment create, commitment reorder"

# =============================================================================
# §1.5 API Endpoint Table
# (logical clock: POST /confection/_clock/set_current_utc is declared last;
#  server default before any set call is exactly 2026-09-01T00:00:00Z)
# =============================================================================
endpoints:
  # --- SeasonalProgram ---
  - method: POST
    path: "/confection/seasonal-programs"
    description: "Create a seasonal program (fixed retail price, all window dates)"
    roles: [PlatformAdmin]
    code: 201
    input: [season_code, season_year, commitment_open_on, commitment_close_on, production_deadline_on, ship_window_open_on, ship_window_close_on, on_shelf_on, pull_on, destroy_by_on, retail_price_cents, forecast_units]
    output: SeasonalProgram
    side_effects: ["status=PLANNING, reopen_count=0, totals=0, version=1"]
  - method: GET
    path: "/confection/seasonal-programs/{id}"
    description: "Read a program including computed totals"
    roles: [PlatformAdmin, ProductionPlanner, CategoryManager, LogisticsCoordinator, ClaimsAdjuster, Retailer]
    code: 200
    input: []
    output: SeasonalProgram
    side_effects: []
  - method: GET
    path: "/confection/seasonal-programs/{id}/supply-summary"
    description: "Computed read: production/commitment/shipment/disposition totals and remaining reorder pool"
    roles: [PlatformAdmin, ProductionPlanner, CategoryManager, LogisticsCoordinator, ClaimsAdjuster, Retailer]
    code: 200
    input: []
    output: { program_id: string, produced_units_total: integer, committed_units_total: integer, allocated_units_total: integer, shipped_units_total: integer, disposed_units_total: integer, remaining_supply_pool_units: integer }
    side_effects: []
  - method: POST
    path: "/confection/seasonal-programs/{id}/advance"
    description: "Drive the program state machine to to_state with OCC"
    roles: [PlatformAdmin]
    code: 200
    input: [to_state, expected_program_version]
    output: SeasonalProgram
    side_effects:
      - "performs the §1.2 transition matching (current status, to_state); allocation cascade at ->SHIPPING; quarantine/cancel/restore cascade at ->DISPOSITION"
      - "increments SeasonalProgram.version by 1"

  # --- Product ---
  - method: POST
    path: "/confection/products"
    description: "Create a product (SEASONAL requires program_id; EVERYDAY requires program_id null)"
    roles: [PlatformAdmin]
    code: 201
    input: ["program_id?", sku_code, kind, molded_shape, brand_protected, requires_temp_control, units_per_case]
    output: Product
    side_effects: ["version=1"]
  - method: GET
    path: "/confection/products/{id}"
    description: "Read a product"
    roles: [PlatformAdmin, ProductionPlanner, CategoryManager, LogisticsCoordinator, ClaimsAdjuster, Retailer]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: GET
    path: "/confection/products"
    description: "List products with filters"
    roles: [PlatformAdmin, ProductionPlanner, CategoryManager, LogisticsCoordinator, ClaimsAdjuster, Retailer]
    code: 200
    input: ["program_id?", "kind?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  # --- ProductionRun ---
  - method: POST
    path: "/confection/production-runs"
    description: "Schedule a production run (overlap + changeover checks on line_code)"
    roles: [ProductionPlanner]
    code: 201
    input: ["program_id?", product_id, line_code, planned_units, scheduled_start_on, scheduled_end_on]
    output: ProductionRun
    side_effects: ["status=SCHEDULED, produced_units=0, version=1"]
  - method: GET
    path: "/confection/production-runs/{id}"
    description: "Read a production run"
    roles: [PlatformAdmin, ProductionPlanner, CategoryManager, LogisticsCoordinator, ClaimsAdjuster, Retailer]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []
  - method: GET
    path: "/confection/production-runs"
    description: "List production runs with filters"
    roles: [PlatformAdmin, ProductionPlanner, CategoryManager, LogisticsCoordinator, ClaimsAdjuster, Retailer]
    code: 200
    input: ["line_code?", "product_id?", "program_id?", "status?", "completed_warehouse_id?", "limit?", "offset?"]
    output: ProductionRun[]
    side_effects: []
  - method: POST
    path: "/confection/production-runs/{id}/start"
    description: "Start a scheduled run (seasonal runs require program LOCKED or IN_PRODUCTION)"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["status -> IN_PROGRESS; increments ProductionRun.version by 1"]
  - method: POST
    path: "/confection/production-runs/{id}/complete"
    description: "Complete an in-progress run; creates its InventoryLot at the given warehouse and recomputes posture"
    roles: [ProductionPlanner]
    code: 200
    input: [produced_units, warehouse_id]
    output: ProductionRun
    side_effects:
      - "status -> COMPLETE; produced_units set; increments ProductionRun.version by 1"
      - "creates InventoryLot (units_on_hand=produced_units, AVAILABLE) and recomputes Warehouse.in_use_units/posture and program.produced_units_total"
  - method: POST
    path: "/confection/production-runs/{id}/cancel"
    description: "Cancel a SCHEDULED run (removes it from overlap/changeover checks)"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["status -> CANCELLED; increments ProductionRun.version by 1"]

  # --- RetailerAccount ---
  - method: POST
    path: "/confection/retailer-accounts"
    description: "Onboard a retailer account (tier, shelf cap, everyday baseline)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, region, tier, max_seasonal_units, everyday_baseline_weekly_units]
    output: RetailerAccount
    side_effects: ["credit_balance_cents=0, version=1"]
  - method: GET
    path: "/confection/retailer-accounts/{id}"
    description: "Read a retailer account including credit ledger balance"
    roles: [PlatformAdmin, ProductionPlanner, CategoryManager, LogisticsCoordinator, ClaimsAdjuster, Retailer]
    code: 200
    input: []
    output: RetailerAccount
    side_effects: []

  # --- RetailerCommitment ---
  - method: POST
    path: "/confection/retailer-commitments"
    description: "Create a DRAFT commitment (retailer-scoped; seasonal product of the program)"
    roles: [Retailer]
    code: 201
    input: [program_id, retailer_id, product_id, committed_units, ship_window_open_on, ship_window_close_on]
    output: RetailerCommitment
    side_effects: ["status=DRAFT, allocated_units=0, revision=1, version=1"]
  - method: GET
    path: "/confection/retailer-commitments/{id}"
    description: "Read a commitment"
    roles: [PlatformAdmin, ProductionPlanner, CategoryManager, LogisticsCoordinator, ClaimsAdjuster, Retailer]
    code: 200
    input: []
    output: RetailerCommitment
    side_effects: []
  - method: GET
    path: "/confection/retailer-commitments"
    description: "List commitments with filters"
    roles: [PlatformAdmin, ProductionPlanner, CategoryManager, LogisticsCoordinator, ClaimsAdjuster, Retailer]
    code: 200
    input: ["program_id?", "retailer_id?", "product_id?", "status?", "supersedes_commitment_id?", "limit?", "offset?"]
    output: RetailerCommitment[]
    side_effects: []
  - method: POST
    path: "/confection/retailer-commitments/{id}/submit"
    description: "Submit a DRAFT commitment during the collection window"
    roles: [Retailer]
    code: 200
    input: []
    output: RetailerCommitment
    side_effects: ["status -> SUBMITTED; increments RetailerCommitment.version by 1"]
  - method: POST
    path: "/confection/retailer-commitments/{id}/confirm"
    description: "CategoryManager confirms a SUBMITTED commitment (shelf-cap check)"
    roles: [CategoryManager]
    code: 200
    input: []
    output: RetailerCommitment
    side_effects: ["status -> CONFIRMED; recomputes program.committed_units_total; increments RetailerCommitment.version by 1"]
  - method: POST
    path: "/confection/retailer-commitments/{id}/revise"
    description: "CREATE-with-supersede: replace this SUBMITTED commitment with revision+1 under OCC"
    roles: [Retailer]
    code: 201
    input: [committed_units, expected_commitment_version, "ship_window_open_on?", "ship_window_close_on?"]
    output: RetailerCommitment
    side_effects:
      - "old commitment -> SUPERSEDED; increments old RetailerCommitment.version by 1"
      - "returns the new SUBMITTED commitment (revision+1, supersedes_commitment_id = old id, version=1)"
  - method: POST
    path: "/confection/retailer-commitments/{id}/reorder"
    description: "The single mid-season reorder: draw extra units from the remaining program supply pool"
    roles: [Retailer]
    code: 200
    input: [units]
    output: RetailerCommitment
    side_effects: ["allocated_units += units; reorder_units = units; reorder_used = true; FULFILLED -> FULFILLING if delivered < new allocated; increments RetailerCommitment.version by 1"]
  - method: POST
    path: "/confection/retailer-commitments/{id}/cancel"
    description: "Cancel a DRAFT/SUBMITTED/CONFIRMED commitment"
    roles: [Retailer]
    code: 200
    input: []
    output: RetailerCommitment
    side_effects: ["status -> CANCELLED; recomputes program.committed_units_total; increments RetailerCommitment.version by 1"]

  # --- Shipment ---
  - method: POST
    path: "/confection/shipments"
    description: "Create a PLANNED shipment; draws stock FEFO from the warehouse's AVAILABLE lots"
    roles: [LogisticsCoordinator]
    code: 201
    input: [commitment_id, warehouse_id, units, ship_on, temp_controlled, "temp_control_declined_by_retailer?"]
    output: Shipment
    side_effects:
      - "ship_on must lie inside both the commitment ship window and the program ship window"
      - "cumulative units over the commitment's {PLANNED, DELIVERED} shipments + units <= allocated_units (else ERR_SHIPMENT_EXCEEDS_ALLOCATION)"
      - "FEFO draw: AVAILABLE lots of the product at the warehouse in created_at ASC, lot_code ASC; insufficient -> ERR_INSUFFICIENT_STOCK; lot at 0 -> DEPLETED"
      - "first shipment moves commitment -> FULFILLING; recomputes program.shipped_units_total and warehouse posture"
  - method: GET
    path: "/confection/shipments/{id}"
    description: "Read a shipment"
    roles: [PlatformAdmin, ProductionPlanner, CategoryManager, LogisticsCoordinator, ClaimsAdjuster, Retailer]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: GET
    path: "/confection/shipments"
    description: "List shipments with filters"
    roles: [PlatformAdmin, ProductionPlanner, CategoryManager, LogisticsCoordinator, ClaimsAdjuster, Retailer]
    code: 200
    input: ["commitment_id?", "warehouse_id?", "status?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []
  - method: POST
    path: "/confection/shipments/{id}/deliver"
    description: "Mark a PLANNED shipment DELIVERED (delivered_on := logical clock)"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status -> DELIVERED; if sum of DELIVERED units >= allocated_units the commitment -> FULFILLED; increments Shipment.version by 1"]

  # --- HeatClaim ---
  - method: POST
    path: "/confection/heat-claims"
    description: "File a heat-damage claim against a DELIVERED shipment"
    roles: [Retailer]
    code: 201
    input: [shipment_id, claimed_units, reason, evidence_note]
    output: HeatClaim
    side_effects: ["status FILED -> UNDER_REVIEW (system, same request); auto_approve computed; version=1 after auto-advance"]
  - method: GET
    path: "/confection/heat-claims/{id}"
    description: "Read a heat claim"
    roles: [PlatformAdmin, ProductionPlanner, CategoryManager, LogisticsCoordinator, ClaimsAdjuster, Retailer]
    code: 200
    input: []
    output: HeatClaim
    side_effects: []
  - method: GET
    path: "/confection/heat-claims"
    description: "List heat claims with filters"
    roles: [PlatformAdmin, ProductionPlanner, CategoryManager, LogisticsCoordinator, ClaimsAdjuster, Retailer]
    code: 200
    input: ["shipment_id?", "status?", "limit?", "offset?"]
    output: HeatClaim[]
    side_effects: []
  - method: POST
    path: "/confection/heat-claims/{id}/decide"
    description: "ClaimsAdjuster decides: APPROVE | REJECT | REQUEST_MORE_INFO"
    roles: [ClaimsAdjuster]
    code: 200
    input: [decision]
    output: HeatClaim
    side_effects: ["APPROVE: credit_cents computed and posted to RetailerAccount.credit_balance_cents; increments HeatClaim.version by 1"]
  - method: POST
    path: "/confection/heat-claims/{id}/provide-info"
    description: "Retailer supplies more evidence; MORE_INFO -> UNDER_REVIEW"
    roles: [Retailer]
    code: 200
    input: [evidence_note]
    output: HeatClaim
    side_effects: ["status -> UNDER_REVIEW; evidence_note replaced; increments HeatClaim.version by 1"]

  # --- Warehouse ---
  - method: POST
    path: "/confection/warehouses"
    description: "Create a warehouse"
    roles: [PlatformAdmin]
    code: 201
    input: [name, temp_controlled, capacity_units]
    output: Warehouse
    side_effects: ["in_use_units=0, quarantined_units=0, posture=OPEN, version=1"]
  - method: GET
    path: "/confection/warehouses/{id}"
    description: "Read a warehouse including computed load and posture"
    roles: [PlatformAdmin, ProductionPlanner, CategoryManager, LogisticsCoordinator, ClaimsAdjuster, Retailer]
    code: 200
    input: []
    output: Warehouse
    side_effects: []

  # --- InventoryLot ---
  - method: GET
    path: "/confection/inventory-lots/{id}"
    description: "Read a lot"
    roles: [PlatformAdmin, ProductionPlanner, CategoryManager, LogisticsCoordinator, ClaimsAdjuster, Retailer]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []
  - method: GET
    path: "/confection/inventory-lots"
    description: "List lots with filters"
    roles: [PlatformAdmin, ProductionPlanner, CategoryManager, LogisticsCoordinator, ClaimsAdjuster, Retailer]
    code: 200
    input: ["product_id?", "warehouse_id?", "production_run_id?", "status?", "limit?", "offset?"]
    output: InventoryLot[]
    side_effects: []
  - method: POST
    path: "/confection/inventory-lots/{id}/quarantine"
    description: "Manual QA quarantine of an AVAILABLE lot (pre-pull only)"
    roles: [CategoryManager]
    code: 200
    input: []
    output: InventoryLot
    side_effects: ["status -> QUARANTINED; recomputes warehouse quarantined_units/posture; increments InventoryLot.version by 1"]
  - method: POST
    path: "/confection/inventory-lots/{id}/release-quarantine"
    description: "Release a QUARANTINED lot back to AVAILABLE (forbidden once the program is in DISPOSITION or later)"
    roles: [CategoryManager]
    code: 200
    input: []
    output: InventoryLot
    side_effects: ["status -> AVAILABLE; recomputes warehouse quarantined_units/posture; increments InventoryLot.version by 1"]

  # --- DispositionOrder ---
  - method: POST
    path: "/confection/disposition-orders"
    description: "Propose disposition of quarantined seasonal stock (MARKDOWN | SECONDARY | DESTRUCTION)"
    roles: [CategoryManager]
    code: 201
    input: [program_id, product_id, warehouse_id, units, channel, "markdown_pct?"]
    output: DispositionOrder
    side_effects: ["status=PROPOSED; proposed_by_user_id := X-User-ID; version=1"]
  - method: GET
    path: "/confection/disposition-orders/{id}"
    description: "Read a disposition order"
    roles: [PlatformAdmin, ProductionPlanner, CategoryManager, LogisticsCoordinator, ClaimsAdjuster, Retailer]
    code: 200
    input: []
    output: DispositionOrder
    side_effects: []
  - method: GET
    path: "/confection/disposition-orders"
    description: "List disposition orders with filters"
    roles: [PlatformAdmin, ProductionPlanner, CategoryManager, LogisticsCoordinator, ClaimsAdjuster, Retailer]
    code: 200
    input: ["program_id?", "product_id?", "warehouse_id?", "status?", "limit?", "offset?"]
    output: DispositionOrder[]
    side_effects: []
  - method: POST
    path: "/confection/disposition-orders/{id}/approve"
    description: "Approve or reject a PROPOSED disposition (segregation: approver != proposer; cannibalization guard for MARKDOWN)"
    roles: [CategoryManager]
    code: 200
    input: [decision]
    output: DispositionOrder
    side_effects: ["decision=APPROVE -> APPROVED; decision=REJECT -> REJECTED; approved_by_user_id := X-User-ID; increments DispositionOrder.version by 1"]
  - method: POST
    path: "/confection/disposition-orders/{id}/execute"
    description: "Execute an APPROVED disposition; consumes quarantined lots and settles recovered value"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: DispositionOrder
    side_effects: ["consumes QUARANTINED lots created_at ASC/lot_code ASC; computes recovered_value_cents; recomputes warehouse + program totals; increments DispositionOrder.version by 1"]

  # --- CommodityContract ---
  - method: POST
    path: "/confection/commodity-contracts"
    description: "Book a cocoa/sugar contract for a program-year, optionally with a hedge"
    roles: [PlatformAdmin]
    code: 201
    input: [program_id, commodity, quantity_units, contract_price_cents_per_unit, "hedged_quantity_units?", "hedge_price_cents_per_unit?"]
    output: CommodityContract
    side_effects: ["status=OPEN; provisional_spend_cents computed (PROVISIONAL variant); version=1"]
  - method: GET
    path: "/confection/commodity-contracts/{id}"
    description: "Read a contract"
    roles: [PlatformAdmin, ProductionPlanner, CategoryManager, LogisticsCoordinator, ClaimsAdjuster, Retailer]
    code: 200
    input: []
    output: CommodityContract
    side_effects: []
  - method: GET
    path: "/confection/commodity-contracts"
    description: "List contracts with filters"
    roles: [PlatformAdmin, ProductionPlanner, CategoryManager, LogisticsCoordinator, ClaimsAdjuster, Retailer]
    code: 200
    input: ["program_id?", "commodity?", "status?", "limit?", "offset?"]
    output: CommodityContract[]
    side_effects: []
  - method: POST
    path: "/confection/commodity-contracts/{id}/settle"
    description: "Settle an OPEN contract at the given spot price (FINAL landed cost)"
    roles: [PlatformAdmin]
    code: 200
    input: [spot_price_cents_per_unit]
    output: CommodityContract
    side_effects: ["status -> SETTLED; spot_price_cents_per_unit and effective_spend_cents set; increments CommodityContract.version by 1"]

  # --- SellThroughReport ---
  - method: POST
    path: "/confection/sell-through-reports"
    description: "File the weekly sell-through report (seasonal + everyday counters); computes both cannibalization variants"
    roles: [Retailer]
    code: 201
    input: [retailer_id, program_id, week_of_on, seasonal_units_sold, seasonal_units_on_hand, everyday_units_sold]
    output: SellThroughReport
    side_effects: ["cannibalization_raw and cannibalization_adjusted computed; version=1"]
  - method: GET
    path: "/confection/sell-through-reports/{id}"
    description: "Read a sell-through report"
    roles: [PlatformAdmin, ProductionPlanner, CategoryManager, LogisticsCoordinator, ClaimsAdjuster, Retailer]
    code: 200
    input: []
    output: SellThroughReport
    side_effects: []
  - method: GET
    path: "/confection/sell-through-reports"
    description: "List sell-through reports with filters"
    roles: [PlatformAdmin, ProductionPlanner, CategoryManager, LogisticsCoordinator, ClaimsAdjuster, Retailer]
    code: 200
    input: ["retailer_id?", "program_id?", "limit?", "offset?"]
    output: SellThroughReport[]
    side_effects: []

  # --- Test-driving: logical clock ---
  - method: POST
    path: "/confection/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default before any set call is exactly 2026-09-01T00:00:00Z; the clock MUST NOT fall back to wall-clock time. All window/deadline rules read this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock := to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth (400/401/403)
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or role not declared" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed Retailer's X-User-ID does not own the target resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, out-of-enum value, or violated field constraint (e.g. end <= start, units <= 0)" }
  # existence (404) — one per entity
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "SeasonalProgram id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id does not exist" }
  - { id: ERR_RUN_NOT_FOUND, http: 404, condition: "ProductionRun id does not exist" }
  - { id: ERR_RETAILER_NOT_FOUND, http: 404, condition: "RetailerAccount id does not exist" }
  - { id: ERR_COMMITMENT_NOT_FOUND, http: 404, condition: "RetailerCommitment id does not exist" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "Shipment id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "HeatClaim id does not exist" }
  - { id: ERR_WAREHOUSE_NOT_FOUND, http: 404, condition: "Warehouse id does not exist" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "InventoryLot id does not exist" }
  - { id: ERR_DISPOSITION_NOT_FOUND, http: 404, condition: "DispositionOrder id does not exist" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "CommodityContract id does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "SellThroughReport id does not exist" }
  # state (409/412/422)
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state from which this transition is defined (includes terminal lockdown and cross-entity state gates)" }
  - { id: ERR_PROGRAM_NOT_OPEN, http: 409, condition: "Commitment create/submit/revise while program is not OPEN_FOR_COMMITMENTS" }
  - { id: ERR_PROGRAM_REOPEN_EXHAUSTED, http: 422, condition: "LOCKED -> OPEN_FOR_COMMITMENTS reopen already used (reopen_count == MAX_REOPEN)" }
  - { id: ERR_NO_PRODUCTION_SCHEDULED, http: 422, condition: "Advance to IN_PRODUCTION with no non-CANCELLED production run for the program" }
  - { id: ERR_UNDISPOSED_STOCK_REMAINS, http: 422, condition: "Advance to CLOSED while QUARANTINED lots with units_on_hand > 0 remain for the program" }
  # business_safety (403/422)
  - { id: ERR_BRAND_PROTECTION, http: 422, condition: "SECONDARY channel proposed for a brand_protected product" }
  - { id: ERR_CLAIM_AUTO_APPROVED, http: 422, condition: "REJECT attempted on a claim whose auto_approve condition holds (summer, non-temp-controlled, temp-required product, not declined)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Disposition approver X-User-ID equals proposed_by_user_id" }
  # business_temporal (409/422)
  - { id: ERR_PROGRAM_ADVANCE_TOO_EARLY, http: 422, condition: "Advance gated on a window date the logical clock has not reached" }
  - { id: ERR_COMMITMENT_WINDOW_CLOSED, http: 422, condition: "Submit/revise outside [commitment_open_on, commitment_close_on)" }
  - { id: ERR_SHIP_WINDOW_VIOLATION, http: 422, condition: "ship_on outside the commitment window or the program ship window" }
  - { id: ERR_REPORT_WEEK_OUT_OF_WINDOW, http: 422, condition: "week_of_on outside [on_shelf_on, pull_on]" }
  - { id: ERR_PRODUCTION_DEADLINE_VIOLATION, http: 422, condition: "SEASONAL run scheduled_end_on after program.production_deadline_on" }
  - { id: ERR_DISPOSITION_WINDOW_CLOSED, http: 422, condition: "MARKDOWN/SECONDARY execute after destroy_by_on" }
  - { id: ERR_LINE_SCHEDULE_OVERLAP, http: 409, condition: "New run's half-open interval intersects a non-CANCELLED run on the same line_code" }
  - { id: ERR_CHANGEOVER_VIOLATION, http: 422, condition: "Kind switch on a line without the 8h changeover buffer after the latest prior run" }
  # business_constraint (409/422)
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "unique(season_code, season_year) / unique(sku_code) / unique(retailer, program, week_of) violated" }
  - { id: ERR_PRODUCT_PROGRAM_MISMATCH, http: 422, condition: "Product is EVERYDAY, or belongs to a different program than the request's program_id" }
  - { id: ERR_REORDER_NOT_ALLOWED, http: 422, condition: "Commitment already consumed its one reorder, or commitment/program state forbids reorder" }
  - { id: ERR_MARKDOWN_OUT_OF_RANGE, http: 422, condition: "markdown_pct missing for MARKDOWN or outside [0.10, 0.70]" }
  - { id: ERR_CLAIM_EXCEEDS_SHIPMENT, http: 422, condition: "claimed_units < 1 or aggregate claimed over non-REJECTED claims exceeds shipment.units" }
  - { id: ERR_SHIPMENT_EXCEEDS_ALLOCATION, http: 422, condition: "Cumulative shipment units would exceed commitment.allocated_units" }
  - { id: ERR_CANNIBALIZATION_GUARD, http: 422, condition: "MARKDOWN approve while program average cannibalization_raw < 0.85 (everyday shelf being eaten)" }
  - { id: ERR_HEDGE_EXCEEDS_QUANTITY, http: 422, condition: "hedged_quantity_units > quantity_units, or hedge_price missing while hedged > 0" }
  - { id: ERR_SHELF_CAP_EXCEEDED, http: 422, condition: "Confirm would push the retailer's total active seasonal committed units over max_seasonal_units" }
  - { id: ERR_DISPOSITION_EXCEEDS_QUARANTINE, http: 422, condition: "units exceed quarantined units_on_hand of the product at the warehouse" }
  # business_fiscal / capacity (409/422)
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "AVAILABLE lots at the warehouse hold fewer units than the shipment requests" }
  - { id: ERR_WAREHOUSE_FULL, http: 409, condition: "in_use_units + produced_units would exceed capacity_units (or posture already FULL)" }
  - { id: ERR_WAREHOUSE_CONGESTED_SEASONAL, http: 409, condition: "Warehouse in CONGESTED posture refuses additional SEASONAL lots (EVERYDAY still accepted)" }
  - { id: ERR_SUPPLY_POOL_EXHAUSTED, http: 422, condition: "Reorder units exceed the program supply pool for the product (pool == 0 is a rejection, not a zero-grant)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Owns reference data and the program lifecycle: programs, products, warehouses, retailer accounts, commodity contracts, program advance, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /confection/seasonal-programs"
      - "POST /confection/seasonal-programs/{id}/advance"
      - "POST /confection/products"
      - "POST /confection/retailer-accounts"
      - "POST /confection/warehouses"
      - "POST /confection/commodity-contracts"
      - "POST /confection/commodity-contracts/{id}/settle"
      - "POST /confection/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: ProductionPlanner
    description: "Schedules and executes production runs on lines"
    identity: opaque
    exclusive_operations:
      - "POST /confection/production-runs"
      - "POST /confection/production-runs/{id}/start"
      - "POST /confection/production-runs/{id}/complete"
      - "POST /confection/production-runs/{id}/cancel"
    shared_operations:
      - "All GET endpoints"
  - name: Retailer
    description: "Entity-backed retail customer: commits to seasonal programs, reorders once, files sell-through reports and heat claims"
    identity: "entity_backed:RetailerAccount"
    exclusive_operations:
      - "POST /confection/retailer-commitments"
      - "POST /confection/retailer-commitments/{id}/submit"
      - "POST /confection/retailer-commitments/{id}/revise"
      - "POST /confection/retailer-commitments/{id}/reorder"
      - "POST /confection/retailer-commitments/{id}/cancel"
      - "POST /confection/sell-through-reports"
      - "POST /confection/heat-claims"
      - "POST /confection/heat-claims/{id}/provide-info"
    shared_operations:
      - "All GET endpoints"
  - name: CategoryManager
    description: "Confirms commitments, runs QA quarantine, proposes dispositions; a DIFFERENT CategoryManager user must approve them (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /confection/retailer-commitments/{id}/confirm"
      - "POST /confection/inventory-lots/{id}/quarantine"
      - "POST /confection/inventory-lots/{id}/release-quarantine"
      - "POST /confection/disposition-orders"
      - "POST /confection/disposition-orders/{id}/approve"
    shared_operations:
      - "All GET endpoints"
  - name: LogisticsCoordinator
    description: "Creates and delivers shipments; executes approved dispositions"
    identity: opaque
    exclusive_operations:
      - "POST /confection/shipments"
      - "POST /confection/shipments/{id}/deliver"
      - "POST /confection/disposition-orders/{id}/execute"
    shared_operations:
      - "All GET endpoints"
  - name: ClaimsAdjuster
    description: "Decides heat claims; never files them (segregation from Retailer)"
    identity: opaque
    exclusive_operations:
      - "POST /confection/heat-claims/{id}/decide"
    shared_operations:
      - "All GET endpoints"
