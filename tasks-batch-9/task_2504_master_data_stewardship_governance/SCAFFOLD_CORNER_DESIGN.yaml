# ===========================================================================
# 1.9 Scaffold Corner Design - breadth coverage index for task 2504
# Master Data Stewardship & Governance
#
# Walks references/claim-extraction-guide.md section by section against this
# scaffold's SCAFFOLD.yaml (S1.1-S1.7). Corners already exercised in depth by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an `excluded_because:` stub instead of a
# test_recipe.
#
# Shorthand used in `setup:` prose only (never in a call):
#   DRAFT-STEWARDED = clock 2026-08-01T00:00:00Z is the default; the chain
#     creates domain CUSTOMER (DRAFT), stewards Olivia (PRINCIPAL) and Sam
#     (SENIOR), an ACTIVE DATA_OWNER assignment for Olivia and an ACTIVE
#     DATA_STEWARD assignment for Sam. Every call is still written out in full.
# ===========================================================================
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: domain_creation_applies_every_declared_default
        claim_type: Defaults
        grounds:
          - entities.Domain.fields.notification_lead_days_floor
          - entities.Domain.fields.expected_attribute_count
          - entities.Domain.fields.governance_posture
          - endpoints.POST_/mdm/domains
        distinguishing_aspect: "Omitting both optional inputs must yield notification_lead_days_floor 5 and expected_attribute_count 5, with every computed counter seeded (0 / null) and status DRAFT - not an echo of the request body."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
          trigger:
            - call: "POST /mdm/domains"
              payload: { code: "VENDOR", name: "Vendor Master", classification_level: "INTERNAL" }
              as: GovernanceAdmin
              captures: { dom_status: $.data.status, dom_posture: $.data.governance_posture, dom_floor: $.data.notification_lead_days_floor, dom_attrs: $.data.expected_attribute_count, dom_sens: $.data.sensitive_handling_required, dom_auth: $.data.authoritative_source_code, dom_weight: $.data.open_finding_weight, dom_prov: $.data.quality_score_provisional, dom_cert: $.data.quality_score_certified, dom_seq: $.data.scorecard_run_seq, dom_rev: $.data.reference_data_revision, dom_pub: $.data.published_master_record_count, dom_sched: $.data.scheduled_change_count, dom_act: $.data.activated_at, dom_version: $.data.version }
          assert:
            - "HTTP 201"
            - "${dom_status} == DRAFT and ${dom_posture} == OPEN and ${dom_act} == null"
            - "${dom_floor} == 5 and ${dom_attrs} == 5 (declared defaults, not request echoes)"
            - "${dom_sens} == false (INTERNAL is below CONFIDENTIAL)"
            - "${dom_auth} == null, ${dom_prov} == null, ${dom_cert} == null"
            - "${dom_weight} == 0.00, ${dom_seq} == 0, ${dom_rev} == 0, ${dom_pub} == 0, ${dom_sched} == 0"
            - "${dom_version} == 1"

      - name: steward_creation_returns_all_input_fields
        claim_type: Creation
        grounds:
          - entities.Steward
          - endpoints.POST_/mdm/stewards
        distinguishing_aspect: "A steward create must return full_name, email and certification_level exactly as supplied plus open_finding_load seeded to 0."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
          trigger:
            - call: "POST /mdm/stewards"
              payload: { full_name: "Olivia Owner", email: "olivia@mdm.test", certification_level: "PRINCIPAL" }
              as: GovernanceAdmin
              captures: { s_name: $.data.full_name, s_email: $.data.email, s_level: $.data.certification_level, s_load: $.data.open_finding_load }
          assert:
            - "HTTP 201"
            - "${s_name} == Olivia Owner, ${s_email} == olivia@mdm.test, ${s_level} == PRINCIPAL"
            - "${s_load} == 0"

      - name: steward_system_fields_are_server_generated
        claim_type: System Fields
        grounds:
          - entities.Steward
          - response_envelope
        distinguishing_aspect: "id / created_at / updated_at / version are minted by the server on a common_fields entity: version starts at 1 and created_at equals the logical clock, regardless of what the client sends."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
          trigger:
            - call: "POST /mdm/stewards"
              payload: { full_name: "Sam Steward", email: "sam@mdm.test", certification_level: "SENIOR" }
              as: GovernanceAdmin
              captures: { s_id: $.data.id, s_created: $.data.created_at, s_updated: $.data.updated_at, s_version: $.data.version }
          assert:
            - "${s_id} is a bare UUID with no type prefix"
            - "${s_created} == 2026-08-01T00:00:00.000Z and ${s_updated} == ${s_created}"
            - "${s_version} == 1"
            - "the success envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: source_system_retrieval_returns_stored_state_after_certify
        claim_type: Retrieval
        grounds:
          - entities.SourceSystem.fields.certified_at
          - endpoints.GET_/mdm/source-systems/{source_system_id}
        distinguishing_aspect: "The single-resource GET must reflect the certify side effects (status CERTIFIED, certified_at stamped, decertified_at still null), not the create-time snapshot."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; source system ERP created and certified."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/source-systems"
              payload: { code: "ERP", name: "ERP Core", trust_tier: 4 }
              as: GovernanceAdmin
              captures: { erp_id: $.data.id, erp_status_create: $.data.status }
            - call: "POST /mdm/source-systems/${erp_id}/certify"
              payload: {}
              as: GovernanceAdmin
          trigger:
            - call: "GET /mdm/source-systems/${erp_id}"
              as: Auditor
              captures: { g_code: $.data.code, g_tier: $.data.trust_tier, g_status: $.data.status, g_cert_at: $.data.certified_at, g_decert_at: $.data.decertified_at, g_reason: $.data.decertification_reason }
          assert:
            - "${erp_status_create} == REGISTERED"
            - "HTTP 200 and ${g_code} == ERP and ${g_tier} == 4"
            - "${g_status} == CERTIFIED and ${g_cert_at} == 2026-08-01T00:00:00Z"
            - "${g_decert_at} == null and ${g_reason} == null"

      - name: quality_rules_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/mdm/quality-rules
          - list_conventions
          - response_envelope.pagination_fields
        distinguishing_aspect: "limit/offset must page the created_at ASC order with total_count reporting the whole filtered set and has_more flipping to false on the last page - not the page size."
        test_recipe:
          setup:
            - "DRAFT-STEWARDED domain CUSTOMER with three ACTIVE quality rules QR1, QR2, QR3 (weight_points 30 each, total 90 <= the 100 budget)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Olivia Owner", email: "olivia@mdm.test", certification_level: "PRINCIPAL" }
              as: GovernanceAdmin
              captures: { own_id: $.data.id }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Sam Steward", email: "sam@mdm.test", certification_level: "SENIOR" }
              as: GovernanceAdmin
              captures: { std_id: $.data.id }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${own_id}", steward_role: "DATA_OWNER", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v1}" }
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v2: $.data.version }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${std_id}", steward_role: "DATA_STEWARD", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v2}" }
              as: GovernanceAdmin
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR1", dimension: "COMPLETENESS", weight_points: 30, threshold_pct: 90.00, severity: "HIGH" }
              as: DataSteward
              as_user_id: "${std_id}"
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR2", dimension: "VALIDITY", weight_points: 30, threshold_pct: 90.00, severity: "MEDIUM" }
              as: DataSteward
              as_user_id: "${std_id}"
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR3", dimension: "TIMELINESS", weight_points: 30, threshold_pct: 90.00, severity: "LOW" }
              as: DataSteward
              as_user_id: "${std_id}"
          trigger:
            - call: "GET /mdm/quality-rules?domain_id=${dom_id}&limit=2&offset=0"
              as: Auditor
              captures: { p1_first: "$.data[0].rule_code", p1_second: "$.data[1].rule_code" }
            - call: "GET /mdm/quality-rules?domain_id=${dom_id}&limit=2&offset=2"
              as: Auditor
              captures: { p2_first: "$.data[0].rule_code" }
          assert:
            - "page 1 -> HTTP 200, response_type == array, total_count == 3, has_more == true, 2 rows returned"
            - "${p1_first} == QR1 and ${p1_second} == QR2 (created_at ASC)"
            - "page 2 -> total_count == 3, has_more == false, 1 row returned"
            - "${p2_first} == QR3"

      - name: master_record_not_found_returns_error
        claim_type: Not Found
        grounds:
          - errors.ERR_MASTER_RECORD_NOT_FOUND
          - endpoints.GET_/mdm/master-records/{record_id}
        distinguishing_aspect: "A syntactically valid but unknown record id must return the resource-specific 404 error id, not a generic 404 or an empty 200 body."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
          trigger:
            - call: "GET /mdm/master-records/00000000-0000-0000-0000-000000000000"
              as: Auditor
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "HTTP 404 and ${err} == ERR_MASTER_RECORD_NOT_FOUND"
            - "the error envelope carries response_type == error and a non-empty ${msg}"

      - name: domain_creation_missing_classification_level_rejected
        claim_type: Required Fields
        grounds:
          - entities.Domain.fields.classification_level
          - validations.priority_4_ERR_INVALID_REQUEST
        distinguishing_aspect: "classification_level has source input and no default, so omitting it is a body-schema failure at priority 4 - it must not silently default to PUBLIC or INTERNAL."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
          trigger:
            - call: "POST /mdm/domains"
              payload: { code: "PRODUCT", name: "Product Master" }
              as: GovernanceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and ${err} == ERR_INVALID_REQUEST"
            - "GET /mdm/domains returns total_count == 0 - nothing was persisted"

      - name: consumer_subscription_type_constraints_enforced
        claim_type: Type Constraints
        grounds:
          - entities.ConsumerSubscription.fields.criticality
          - entities.ConsumerSubscription.fields.required_lead_days
          - validations.priority_4_ERR_INVALID_REQUEST
        distinguishing_aspect: "An undeclared enum member and an out-of-range integer are both priority 4 rejections; required_lead_days is constrained to 1..30, so 0 and 31 are invalid even though they are integers."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; domain CUSTOMER exists in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id }
          trigger:
            - call: "POST /mdm/consumer-subscriptions"
              payload: { domain_id: "${dom_id}", consumer_code: "BI_BAD_TIER", reporting_asset_key: "RPT_X", clearance_level: "INTERNAL", criticality: "TIER0", required_lead_days: 5 }
              as: GovernanceAdmin
              captures: { err_enum: $.data.error_id }
            - call: "POST /mdm/consumer-subscriptions"
              payload: { domain_id: "${dom_id}", consumer_code: "BI_BAD_LEAD", reporting_asset_key: "RPT_X", clearance_level: "INTERNAL", criticality: "TIER1", required_lead_days: 31 }
              as: GovernanceAdmin
              captures: { err_range: $.data.error_id }
          assert:
            - "first trigger -> HTTP 400 and ${err_enum} == ERR_INVALID_REQUEST (TIER0 is not a declared criticality)"
            - "second trigger -> HTTP 400 and ${err_range} == ERR_INVALID_REQUEST (required_lead_days is constrained to 1..30)"
            - "GET /mdm/consumer-subscriptions?domain_id=${dom_id} returns total_count == 0"

      - name: master_record_completeness_pct_is_computed_not_supplied
        claim_type: Computed Fields
        grounds:
          - calculations.record_completeness_pct
          - entities.MasterRecord.fields.completeness_pct
          - entities.MasterRecord.fields.survivorship_score
        distinguishing_aspect: "completeness_pct is derived from the count of non-null, non-empty attribute values over Domain.expected_attribute_count, so an empty-string value and a null value both count as missing: 3 usable keys of 5 gives 60.00, never 100.00 for 'all supplied keys present'."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; DRAFT-STEWARDED domain CUSTOMER with expected_attribute_count 5; source system ERP CERTIFIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Olivia Owner", email: "olivia@mdm.test", certification_level: "PRINCIPAL" }
              as: GovernanceAdmin
              captures: { own_id: $.data.id }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Sam Steward", email: "sam@mdm.test", certification_level: "SENIOR" }
              as: GovernanceAdmin
              captures: { std_id: $.data.id }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${own_id}", steward_role: "DATA_OWNER", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v1}" }
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v2: $.data.version }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${std_id}", steward_role: "DATA_STEWARD", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v2}" }
              as: GovernanceAdmin
            - call: "POST /mdm/source-systems"
              payload: { code: "ERP", name: "ERP Core", trust_tier: 4 }
              as: GovernanceAdmin
              captures: { erp_id: $.data.id }
            - call: "POST /mdm/source-systems/${erp_id}/certify"
              payload: {}
              as: GovernanceAdmin
          trigger:
            - call: "POST /mdm/master-records"
              payload: { domain_id: "${dom_id}", source_system_id: "${erp_id}", natural_key: "ERP-CUST-2001", attributes: { legal_name: "Beta Foods", tax_id: "TX-11", billing_city: "Reno", contact_email: "" }, last_verified_at: "2026-08-01T00:00:00Z" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { rec_completeness: $.data.completeness_pct, rec_score: $.data.survivorship_score, rec_cur: $.data.curation_status, rec_pub: $.data.publication_status }
          assert:
            - "HTTP 201"
            - "${rec_completeness} == 60.00 (3 usable keys of the 5 expected; the empty-string contact_email counts as missing)"
            - "${rec_score} == 84.00 (tier 4 x 10 = 40, round(60.00 * 0.40, 2) = 24.00, recency 20 at 0 staleness months)"
            - "${rec_cur} == CANDIDATE and ${rec_pub} == UNPUBLISHED"

      - name: scorecard_run_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds:
          - entities.ScorecardRun
          - endpoints.GET_/mdm/scorecard-runs/{run_id}
        distinguishing_aspect: "ScorecardRun declares common_fields false, so the row exposes only id and created_at - no version and no updated_at - and the API surface offers no PATCH or DELETE for it: the audit epoch is append-only."
        test_recipe:
          setup:
            - "DRAFT-STEWARDED domain CUSTOMER with one ACTIVE rule QR1; one PROVISIONAL scorecard run has been executed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Olivia Owner", email: "olivia@mdm.test", certification_level: "PRINCIPAL" }
              as: GovernanceAdmin
              captures: { own_id: $.data.id }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Sam Steward", email: "sam@mdm.test", certification_level: "SENIOR" }
              as: GovernanceAdmin
              captures: { std_id: $.data.id }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${own_id}", steward_role: "DATA_OWNER", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v1}" }
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v2: $.data.version }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${std_id}", steward_role: "DATA_STEWARD", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v2}" }
              as: GovernanceAdmin
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR1", dimension: "COMPLETENESS", weight_points: 40, threshold_pct: 90.00, severity: "HIGH" }
              as: DataSteward
              as_user_id: "${std_id}"
            - call: "POST /mdm/domains/${dom_id}/scorecard-runs"
              payload: { basis: "PROVISIONAL", measurements: [{ rule_code: "QR1", measured_pct: 95.00 }] }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { run_id: $.data.id, run_seq: $.data.run_seq, run_measured_at: $.data.measured_at }
          trigger:
            - call: "GET /mdm/scorecard-runs/${run_id}"
              as: Auditor
              captures: { g_id: $.data.id, g_seq: $.data.run_seq, g_basis: $.data.basis, g_score: $.data.weighted_score, g_created: $.data.created_at }
          assert:
            - "${run_seq} == 1 and ${run_measured_at} == 2026-08-01T00:00:00Z"
            - "HTTP 200, ${g_id} == ${run_id}, ${g_seq} == 1, ${g_basis} == PROVISIONAL, ${g_score} == 100.00"
            - "${g_created} == 2026-08-01T00:00:00.000Z"
            - "the response body carries no version and no updated_at key (common_fields false)"
            - "no PATCH or DELETE endpoint for /mdm/scorecard-runs/{run_id} exists in the API surface"

      - name: quality_rule_body_fk_domain_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.QualityRule.fields.domain_id
          - validations.priority_5_ERR_DOMAIN_NOT_FOUND
        distinguishing_aspect: "A body FK that names no existing Domain is a priority 5 rejection (404) that must fire before any domain-entitlement or business check - the acting steward's lack of an assignment on a non-existent domain must not be reported as 403."
        test_recipe:
          setup:
            - "DRAFT-STEWARDED domain CUSTOMER exists, but the trigger names an unknown domain_id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Sam Steward", email: "sam@mdm.test", certification_level: "SENIOR" }
              as: GovernanceAdmin
              captures: { std_id: $.data.id }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${std_id}", steward_role: "DATA_STEWARD", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v1}" }
              as: GovernanceAdmin
          trigger:
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "00000000-0000-0000-0000-000000000000", owner_steward_id: "${std_id}", rule_code: "QR1", dimension: "COMPLETENESS", weight_points: 40, threshold_pct: 90.00, severity: "HIGH" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { err_dom: $.data.error_id }
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "00000000-0000-0000-0000-000000000000", rule_code: "QR1", dimension: "COMPLETENESS", weight_points: 40, threshold_pct: 90.00, severity: "HIGH" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { err_std: $.data.error_id }
          assert:
            - "first trigger -> HTTP 404 and ${err_dom} == ERR_DOMAIN_NOT_FOUND"
            - "second trigger -> HTTP 404 and ${err_std} == ERR_STEWARD_NOT_FOUND"
            - "GET /mdm/quality-rules?domain_id=${dom_id} returns total_count == 0"

      - name: one_source_system_registers_into_two_domains_independently
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.SourceRegistration
          - endpoints.GET_/mdm/source-registrations
        distinguishing_aspect: "SourceRegistration is the many-to-many junction between Domain and SourceSystem: the same ERP system may be AUTHORITATIVE for CUSTOMER and CONTRIBUTING for PRODUCT at once, and each domain's authoritative_source_code is resolved from its own registration row."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; source system ERP CERTIFIED; domains CUSTOMER and PRODUCT in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/source-systems"
              payload: { code: "ERP", name: "ERP Core", trust_tier: 4 }
              as: GovernanceAdmin
              captures: { erp_id: $.data.id }
            - call: "POST /mdm/source-systems/${erp_id}/certify"
              payload: {}
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_c_id: $.data.id, dom_c_v1: $.data.version }
            - call: "POST /mdm/domains"
              payload: { code: "PRODUCT", name: "Product Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_p_id: $.data.id, dom_p_v1: $.data.version }
          trigger:
            - call: "POST /mdm/source-registrations"
              payload: { domain_id: "${dom_c_id}", source_system_id: "${erp_id}", role: "AUTHORITATIVE", trust_rank: 1, effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_c_v1}" }
              as: GovernanceAdmin
              captures: { reg_c_id: $.data.id, reg_c_role: $.data.role, reg_c_status: $.data.status }
            - call: "POST /mdm/source-registrations"
              payload: { domain_id: "${dom_p_id}", source_system_id: "${erp_id}", role: "CONTRIBUTING", trust_rank: 2, effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_p_v1}" }
              as: GovernanceAdmin
              captures: { reg_p_id: $.data.id, reg_p_role: $.data.role, reg_p_status: $.data.status }
            - call: "GET /mdm/source-registrations?source_system_id=${erp_id}"
              as: Auditor
              captures: { by_source_rows: $.data }
            - call: "GET /mdm/domains/${dom_c_id}"
              as: GovernanceAdmin
              captures: { dom_c_auth: $.data.authoritative_source_code, dom_c_posture: $.data.governance_posture }
            - call: "GET /mdm/domains/${dom_p_id}"
              as: GovernanceAdmin
              captures: { dom_p_auth: $.data.authoritative_source_code }
          assert:
            - "${reg_c_role} == AUTHORITATIVE, ${reg_c_status} == ACTIVE"
            - "${reg_p_role} == CONTRIBUTING, ${reg_p_status} == ACTIVE, ${reg_p_id} != ${reg_c_id}"
            - "${by_source_rows} has total_count 2 - the junction is reachable from the source side"
            - "${dom_c_auth} == ERP and ${dom_c_posture} == OPEN"
            - "${dom_p_auth} == null (a CONTRIBUTING registration never fills authoritative_source_code)"

  # =========================================================================
  - section: state_machines
    instances:
      - name: change_request_starts_in_draft
        claim_type: Initial State
        grounds:
          - state_machines.ChangeRequest.initial_state
          - endpoints.POST_/mdm/change-requests
        distinguishing_aspect: "A freshly created ChangeRequest must be DRAFT with every workflow field unset - submitted_at, reviewer, impact and freeze-window fields all null/0 - so that submit is the only legal next move."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; domain CUSTOMER in DRAFT with an ACTIVE DATA_STEWARD assignment for Sam."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Sam Steward", email: "sam@mdm.test", certification_level: "SENIOR" }
              as: GovernanceAdmin
              captures: { std_id: $.data.id }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${std_id}", steward_role: "DATA_STEWARD", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v1}" }
              as: GovernanceAdmin
          trigger:
            - call: "POST /mdm/change-requests"
              payload: { domain_id: "${dom_id}", change_type: "HIERARCHY_RESTRUCTURE", title: "Split EMEA node", proposed_values: { parent_node_key: "GLOBAL", child_node_key: "EMEA_SALES" } }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { cr_status: $.data.status, cr_structural: $.data.structural, cr_requester: $.data.requester_steward_id, cr_reviewer: $.data.reviewer_steward_id, cr_submitted: $.data.submitted_at, cr_impact: $.data.impact_consumer_count, cr_lead: $.data.required_lead_days, cr_earliest: $.data.earliest_apply_at, cr_cycles: $.data.revision_cycle_count, cr_fw_start: $.data.freeze_window_start }
          assert:
            - "HTTP 201 and ${cr_status} == DRAFT (the declared initial_state)"
            - "${cr_structural} == true (HIERARCHY_RESTRUCTURE is a structural change_type)"
            - "${cr_requester} == ${std_id} - taken from X-User-ID, not from the body"
            - "${cr_reviewer} == null, ${cr_submitted} == null, ${cr_earliest} == null, ${cr_fw_start} == null"
            - "${cr_impact} == 0, ${cr_lead} == 0, ${cr_cycles} == 0"

      - name: source_system_certify_moves_registered_to_certified
        claim_type: Valid Transition
        grounds:
          - state_machines.SourceSystem.REGISTERED_to_CERTIFIED
          - endpoints.POST_/mdm/source-systems/{source_system_id}/certify
        distinguishing_aspect: "The certify trigger must both move the status and stamp certified_at from the logical clock while bumping version - a status flip alone leaves the certification undated."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; source system CRM in REGISTERED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/source-systems"
              payload: { code: "CRM", name: "CRM Cloud", trust_tier: 3 }
              as: GovernanceAdmin
              captures: { crm_id: $.data.id, crm_v1: $.data.version }
          trigger:
            - call: "POST /mdm/source-systems/${crm_id}/certify"
              payload: {}
              as: GovernanceAdmin
              captures: { c_status: $.data.status, c_at: $.data.certified_at, c_version: $.data.version }
          assert:
            - "HTTP 200 and ${c_status} == CERTIFIED"
            - "${c_at} == 2026-08-05T00:00:00Z"
            - "${c_version} == 2 (one mutation past ${crm_v1})"

      - name: activate_without_active_quality_rule_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Domain.DRAFT_to_ACTIVE.preconditions
          - errors.ERR_NO_QUALITY_RULES
        distinguishing_aspect: "Stewardship and the certified authoritative source are all in place, so the only failing precondition is the missing ACTIVE quality rule: the response must name ERR_NO_QUALITY_RULES specifically, not the generic transition error, and the domain must stay DRAFT."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; domain CUSTOMER in DRAFT with DATA_OWNER and DATA_STEWARD assignments and an ACTIVE AUTHORITATIVE registration on the CERTIFIED ERP source; no quality rule."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Olivia Owner", email: "olivia@mdm.test", certification_level: "PRINCIPAL" }
              as: GovernanceAdmin
              captures: { own_id: $.data.id }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Sam Steward", email: "sam@mdm.test", certification_level: "SENIOR" }
              as: GovernanceAdmin
              captures: { std_id: $.data.id }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${own_id}", steward_role: "DATA_OWNER", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v1}" }
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v2: $.data.version }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${std_id}", steward_role: "DATA_STEWARD", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v2}" }
              as: GovernanceAdmin
            - call: "POST /mdm/source-systems"
              payload: { code: "ERP", name: "ERP Core", trust_tier: 4 }
              as: GovernanceAdmin
              captures: { erp_id: $.data.id }
            - call: "POST /mdm/source-systems/${erp_id}/certify"
              payload: {}
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v3: $.data.version }
            - call: "POST /mdm/source-registrations"
              payload: { domain_id: "${dom_id}", source_system_id: "${erp_id}", role: "AUTHORITATIVE", trust_rank: 1, effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v3}" }
              as: GovernanceAdmin
          trigger:
            - call: "POST /mdm/domains/${dom_id}/activate"
              as: GovernanceAdmin
              captures: { err: $.data.error_id }
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { after_status: $.data.status, after_activated: $.data.activated_at }
          assert:
            - "HTTP 422 and ${err} == ERR_NO_QUALITY_RULES"
            - "${after_status} == DRAFT and ${after_activated} == null"

      - name: decertify_from_registered_is_an_invalid_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.SourceSystem
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "REGISTERED admits only the certify trigger, so decertify from REGISTERED must be refused - a system that never earned certification cannot be stripped of it, and no decertification cascade may run."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; source system CRM in REGISTERED (never certified)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/source-systems"
              payload: { code: "CRM", name: "CRM Cloud", trust_tier: 3 }
              as: GovernanceAdmin
              captures: { crm_id: $.data.id }
          trigger:
            - call: "POST /mdm/source-systems/${crm_id}/decertify"
              payload: { reason: "Vendor contract terminated" }
              as: GovernanceAdmin
              captures: { err: $.data.error_id }
            - call: "GET /mdm/source-systems/${crm_id}"
              as: GovernanceAdmin
              captures: { after_status: $.data.status, after_reason: $.data.decertification_reason, after_decert: $.data.decertified_at }
          assert:
            - "HTTP 409 and ${err} == ERR_INVALID_STATE_TRANSITION"
            - "${after_status} == REGISTERED, ${after_reason} == null, ${after_decert} == null"

      - name: certify_twice_is_rejected_on_the_second_attempt
        claim_type: Idempotency
        grounds:
          - state_machines.SourceSystem.REGISTERED_to_CERTIFIED.preconditions
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "Action endpoints in this API are not idempotent: replaying certify must fail with the transition error and must NOT re-stamp certified_at to the later clock value."
        test_recipe:
          setup:
            - "Source system CRM certified at 2026-08-01T00:00:00Z; clock then advanced to 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/source-systems"
              payload: { code: "CRM", name: "CRM Cloud", trust_tier: 3 }
              as: GovernanceAdmin
              captures: { crm_id: $.data.id }
            - call: "POST /mdm/source-systems/${crm_id}/certify"
              payload: {}
              as: GovernanceAdmin
              captures: { first_version: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
