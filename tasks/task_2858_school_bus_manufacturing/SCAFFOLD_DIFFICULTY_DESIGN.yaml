# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_2858 School Bus Manufacturing
# Nine rule_ids x >= 2 instances. Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7;
# every setup_api_calls / trigger call resolves to a §1.5 endpoint; every formula-derived
# assert literal was computed with the §1.3 formulas and their constants.
# Opaque-role X-User-IDs are pinned literals ("sales-01", "contracts-01", ...) so the
# segregation-of-duties rules are observable; DealerAgent ids are Dealer row ids.

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: bid_price_provisional_firm_versus_final_award_variant
        grounds:
          - calculations.bid_unit_price
          - calculations.contract_total
          - state_machines.Bid.SUBMITTED_to_AWARDED
          - state_machines.StateSpecProfile.PUBLISHED_to_SUPERSEDED
          - entities.Bid.fields.provisional_unit_price_cents
          - entities.ContractOrder.fields.awarded_unit_price_cents
          - entities.ContractOrder.fields.awarded_emergency_exit_count
        distinguishing_aspect: |
          Commercial-pricing domain: the same offered configuration priced by the provisional_firm
          variant at bid time and by the final_award variant at award time differs by exactly 487,893
          cents, because the final variant first raises the offered emergency-exit count from 6 to the
          award-time PUBLISHED profile's mandated 7 and then applies 3 months of escalation.
        test_recipe:
          setup:
            - "BusModel TYPE_C_CONV (base_price_cents 12,750,000; base_seat_capacity 71; base_emergency_exit_count 5; body_joint_strength_kn 58.0; max_battery_bays 6; curb_weight_lb 21,500)"
            - "PropulsionPackage ELEC-155 on that model (option_price_cents 14,900,000; usable_kwh 155.0; consumption 1.05; hvac 7.5 kW; cold derate 0.12; reserve floor 0.10; 4 packs)"
            - "StateSpecProfile CA 2026-2027 revision 1 PUBLISHED, demanding 78 seats, 6 exits, CROSSVIEW_HEATED mirrors, belts, eight-lamp, crossing arm, rollover protection, 62.5 kN joints, 75.0 mi route range on ROLLING terrain"
            - "Solicitation SOL-CA-001 for 12 units citing that profile, price cap 32,000,000 cents per unit, required delivery 2026-12-15"
            - "A DRAFT bid offering exactly 78 seats / 6 exits / CROSSVIEW_HEATED / belts / eight-lamp / crossing arm / rollover, submitted on 2026-08-15 by sales-01"
            - "After submission, CA 2026-2027 revision 2 (identical but demanding 7 emergency exits) is PUBLISHED, superseding revision 1"
            - "Logical clock at 2026-11-20 when contracts-02 awards the bid"
          setup_api_calls:
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_C_CONV", body_class: "TYPE_C", base_seat_capacity: 71, base_emergency_exit_count: 5, base_price_cents: 12750000, body_joint_strength_kn: 58.0, max_battery_bays: 6, curb_weight_lb: 21500 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { model_c_id: $.data.id }
            - call: "POST /propulsion-packages"
              payload: { package_code: "ELEC-155", compatible_bus_model_id: "${model_c_id}", propulsion_type: "ELECTRIC", option_price_cents: 14900000, cold_weather_derate_pct: 0.12, reserve_floor_pct: 0.10, battery_pack_count: 4, usable_kwh: 155.0, nominal_consumption_kwh_per_mi: 1.05, hvac_load_kw: 7.5 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { pkg_elec_id: $.data.id }
            - call: "POST /state-spec-profiles"
              payload: { state_code: "CA", school_year: "2026-2027", min_seat_capacity: 78, min_emergency_exit_count: 6, min_joint_strength_kn: 62.5, required_route_range_mi: 75.0, requires_eight_lamp_system: true, requires_crossing_arm: true, required_mirror_config: "CROSSVIEW_HEATED", requires_lap_shoulder_belts: true, requires_rollover_protection: true, requires_joint_strength_test: true, terrain_class: "ROLLING" }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { ca_r1_id: $.data.id }
            - call: "POST /state-spec-profiles/${ca_r1_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
            - call: "POST /solicitations"
              payload: { solicitation_code: "SOL-CA-001", buyer_type: "DISTRICT", buyer_name: "Alameda Unified", spec_profile_id: "${ca_r1_id}", unit_count: 12, required_delivery_date: "2026-12-15", price_cap_cents_per_unit: 32000000 }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { sol_ca_id: $.data.id }
            - call: "POST /bids"
              payload: { solicitation_id: "${sol_ca_id}", bus_model_id: "${model_c_id}", propulsion_package_id: "${pkg_elec_id}", unit_count: 12, offered_seat_capacity: 78, offered_emergency_exit_count: 6, offered_mirror_config: "CROSSVIEW_HEATED", offered_lap_shoulder_belts: true, offered_eight_lamp_system: true, offered_crossing_arm: true, offered_rollover_reinforcement: true }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { bid_ca_id: $.data.id, bid_ca_provisional: $.data.provisional_unit_price_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: SalesEngineer
              as_user_id: "sales-01"
            - call: "POST /bids/${bid_ca_id}/submit"
              payload: {}
              as: SalesEngineer
              as_user_id: "sales-01"
            - call: "POST /state-spec-profiles"
              payload: { state_code: "CA", school_year: "2026-2027", min_seat_capacity: 78, min_emergency_exit_count: 7, min_joint_strength_kn: 62.5, required_route_range_mi: 75.0, requires_eight_lamp_system: true, requires_crossing_arm: true, required_mirror_config: "CROSSVIEW_HEATED", requires_lap_shoulder_belts: true, requires_rollover_protection: true, requires_joint_strength_test: true, terrain_class: "ROLLING" }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { ca_r2_id: $.data.id }
            - call: "POST /state-spec-profiles/${ca_r2_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
            - call: "POST /solicitations/${sol_ca_id}/close"
              payload: {}
              as: ContractsAdmin
              as_user_id: "contracts-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-20T00:00:00Z" }
              as: ContractsAdmin
              as_user_id: "contracts-01"
          trigger:
            - call: "POST /bids/${bid_ca_id}/award"
              payload: { promised_delivery_date: "2026-12-15" }
              as: ContractsAdmin
              as_user_id: "contracts-02"
              captures: { order_ca_id: $.data.id, order_ca_price: $.data.awarded_unit_price_cents }
          assert:
            - "Bid.${bid_ca_id}.provisional_unit_price_cents == 30913950"
            - "ContractOrder.${order_ca_id}.awarded_unit_price_cents == 31401843"
            - "ContractOrder.${order_ca_id}.awarded_unit_price_cents - Bid.${bid_ca_id}.provisional_unit_price_cents == 487893"
            - "ContractOrder.${order_ca_id}.total_contract_cents == 376888620"
            - "ContractOrder.${order_ca_id}.awarded_emergency_exit_count == 7 while Bid.${bid_ca_id}.offered_emergency_exit_count is still 6"
            - "ContractOrder.${order_ca_id}.spec_profile_id == ${ca_r2_id} and Bid.${bid_ca_id}.evaluated_spec_profile_id == ${ca_r1_id}"
            - "ContractOrder.${order_ca_id}.awarded_joint_strength_kn == 67.5"
            - "Bid.${bid_ca_id}.provisional_unit_price_cents is unchanged by the award (no write-back of the 487893 delta)"

      - name: range_validation_electric_versus_liquid_fuel_variant
        grounds:
          - calculations.range_validation
          - calculations.spec_compliance_evaluation
          - entities.BusUnit.fields.derated_route_range_mi
          - entities.Bid.fields.nominal_range_mi
          - entities.Bid.fields.derated_route_range_mi
          - entities.PropulsionPackage.fields.hvac_load_kw
        distinguishing_aspect: |
          Engineering-range domain, not pricing: the electric variant subtracts an HVAC parasitic load
          (7.5 kW / 20.0 mph = 0.375 kWh per mile on top of 1.05) while the liquid_fuel variant has no
          HVAC term at all, so on identical FLAT terrain the same bus model yields 147 / 86.1 miles with
          ELEC-155 and 720 / 663.4 miles with DSL-100.
        test_recipe:
          setup:
            - "BusModel TYPE_C_CONV as above"
            - "PropulsionPackage ELEC-155 (155.0 kWh usable, 1.05 kWh/mi, 7.5 kW HVAC, 0.12 cold derate, 0.10 reserve)"
            - "PropulsionPackage DSL-100 on the same model (100.0 gal, 7.2 mpg, 0.03 cold derate, 0.05 reserve, no HVAC load)"
            - "StateSpecProfile TX 2026-2027 PUBLISHED with FLAT terrain and required_route_range_mi 400.0"
            - "Solicitation SOL-TX-020 citing that profile"
          setup_api_calls:
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_C_CONV", body_class: "TYPE_C", base_seat_capacity: 71, base_emergency_exit_count: 5, base_price_cents: 12750000, body_joint_strength_kn: 58.0, max_battery_bays: 6, curb_weight_lb: 21500 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { model_c_id: $.data.id }
            - call: "POST /propulsion-packages"
              payload: { package_code: "ELEC-155", compatible_bus_model_id: "${model_c_id}", propulsion_type: "ELECTRIC", option_price_cents: 14900000, cold_weather_derate_pct: 0.12, reserve_floor_pct: 0.10, battery_pack_count: 4, usable_kwh: 155.0, nominal_consumption_kwh_per_mi: 1.05, hvac_load_kw: 7.5 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { pkg_elec_id: $.data.id }
            - call: "POST /propulsion-packages"
              payload: { package_code: "DSL-100", compatible_bus_model_id: "${model_c_id}", propulsion_type: "DIESEL", option_price_cents: 1250000, cold_weather_derate_pct: 0.03, reserve_floor_pct: 0.05, fuel_capacity_gal: 100.0, rated_mpg: 7.2 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { pkg_dsl_id: $.data.id }
            - call: "POST /state-spec-profiles"
              payload: { state_code: "TX", school_year: "2026-2027", min_seat_capacity: 71, min_emergency_exit_count: 5, min_joint_strength_kn: 55.0, required_route_range_mi: 400.0, requires_eight_lamp_system: true, requires_crossing_arm: true, required_mirror_config: "CROSSVIEW", terrain_class: "FLAT" }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { tx_id: $.data.id }
            - call: "POST /state-spec-profiles/${tx_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
            - call: "POST /solicitations"
              payload: { solicitation_code: "SOL-TX-020", buyer_type: "COOPERATIVE", buyer_name: "North Texas Coop", spec_profile_id: "${tx_id}", unit_count: 2, required_delivery_date: "2026-12-01", price_cap_cents_per_unit: 32000000 }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { sol_tx_id: $.data.id }
          trigger:
            - call: "POST /bids"
              payload: { solicitation_id: "${sol_tx_id}", bus_model_id: "${model_c_id}", propulsion_package_id: "${pkg_elec_id}", unit_count: 2, offered_seat_capacity: 71, offered_emergency_exit_count: 5, offered_mirror_config: "CROSSVIEW", offered_lap_shoulder_belts: false, offered_eight_lamp_system: true, offered_crossing_arm: true, offered_rollover_reinforcement: false }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { bid_elec_id: $.data.id }
            - call: "POST /bids"
              payload: { solicitation_id: "${sol_tx_id}", bus_model_id: "${model_c_id}", propulsion_package_id: "${pkg_dsl_id}", unit_count: 2, offered_seat_capacity: 71, offered_emergency_exit_count: 5, offered_mirror_config: "CROSSVIEW", offered_lap_shoulder_belts: false, offered_eight_lamp_system: true, offered_crossing_arm: true, offered_rollover_reinforcement: false }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { bid_dsl_id: $.data.id }
          assert:
            - "Bid.${bid_elec_id}.nominal_range_mi == 147"
            - "Bid.${bid_elec_id}.derated_route_range_mi == 86.1"
            - "Bid.${bid_dsl_id}.nominal_range_mi == 720"
            - "Bid.${bid_dsl_id}.derated_route_range_mi == 663.4"
            - "Bid.${bid_elec_id}.spec_compliance_status == NONCONFORMING and Bid.${bid_elec_id}.unmet_mandatory_items == [\"route_range\"]"
            - "Bid.${bid_dsl_id}.spec_compliance_status == CONFORMING and Bid.${bid_dsl_id}.exception_count == 0"
            - "Bid.${bid_elec_id}.offered_joint_strength_kn == 58.0 and Bid.${bid_dsl_id}.offered_joint_strength_kn == 58.0 (identical bodies, divergent ranges)"

  - rule_id: combinatorial_formula
    instances:

      - name: dealer_prep_fee_rounded_per_line_item_not_on_line_total
        grounds:
          - calculations.bid_unit_price
          - entities.Bid.fields.provisional_unit_price_cents
          - entities.BidRevision.fields.unit_price_cents
        distinguishing_aspect: |
          Rounding-granularity composition: the six line items' preparation fees are rounded half-up
          individually and then summed (717,175 cents), which is 2 cents more than rounding the fee once
          on the 30,196,775-cent line total (717,173) — so the correct unit price is 30,913,950 and the
          collapsed-order price is 30,913,948.
        test_recipe:
          setup:
            - "BusModel TYPE_C_CONV and PropulsionPackage ELEC-155 as in the CA fixture"
            - "StateSpecProfile CA 2026-2027 PUBLISHED, Solicitation SOL-CA-002 for 12 units"
            - "A DRAFT bid offering 78 seats / 6 exits / CROSSVIEW_HEATED / belts / eight-lamp / crossing arm / rollover, whose six line items are 12,750,000 / 14,900,000 / 241,500 / 244,500 / 83,275 / 1,977,500"
          setup_api_calls:
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_C_CONV", body_class: "TYPE_C", base_seat_capacity: 71, base_emergency_exit_count: 5, base_price_cents: 12750000, body_joint_strength_kn: 58.0, max_battery_bays: 6, curb_weight_lb: 21500 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { model_c_id: $.data.id }
            - call: "POST /propulsion-packages"
              payload: { package_code: "ELEC-155", compatible_bus_model_id: "${model_c_id}", propulsion_type: "ELECTRIC", option_price_cents: 14900000, cold_weather_derate_pct: 0.12, reserve_floor_pct: 0.10, battery_pack_count: 4, usable_kwh: 155.0, nominal_consumption_kwh_per_mi: 1.05, hvac_load_kw: 7.5 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { pkg_elec_id: $.data.id }
            - call: "POST /state-spec-profiles"
              payload: { state_code: "CA", school_year: "2026-2027", min_seat_capacity: 78, min_emergency_exit_count: 6, min_joint_strength_kn: 62.5, required_route_range_mi: 75.0, requires_eight_lamp_system: true, requires_crossing_arm: true, required_mirror_config: "CROSSVIEW_HEATED", requires_lap_shoulder_belts: true, requires_rollover_protection: true, requires_joint_strength_test: true, terrain_class: "ROLLING" }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { ca_r1_id: $.data.id }
            - call: "POST /state-spec-profiles/${ca_r1_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
            - call: "POST /solicitations"
              payload: { solicitation_code: "SOL-CA-002", buyer_type: "DISTRICT", buyer_name: "Fresno Unified", spec_profile_id: "${ca_r1_id}", unit_count: 12, required_delivery_date: "2026-12-15", price_cap_cents_per_unit: 32000000 }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { sol_ca_id: $.data.id }
          trigger:
            - call: "POST /bids"
              payload: { solicitation_id: "${sol_ca_id}", bus_model_id: "${model_c_id}", propulsion_package_id: "${pkg_elec_id}", unit_count: 12, offered_seat_capacity: 78, offered_emergency_exit_count: 6, offered_mirror_config: "CROSSVIEW_HEATED", offered_lap_shoulder_belts: true, offered_eight_lamp_system: true, offered_crossing_arm: true, offered_rollover_reinforcement: true }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { bid_ca_id: $.data.id, bid_ca_v: $.data.version }
            - call: "POST /bids/${bid_ca_id}/revisions"
              payload: { expected_bid_version: "${bid_ca_v}", offered_seat_capacity: 71, offered_emergency_exit_count: 5, offered_mirror_config: "CROSSVIEW", offered_lap_shoulder_belts: false, offered_eight_lamp_system: true, offered_crossing_arm: true, offered_rollover_reinforcement: false, note: "value-engineered alternative" }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { rev_1_id: $.data.id, rev_1_price: $.data.unit_price_cents }
          assert:
            - "Bid.${bid_ca_id}.provisional_unit_price_cents == 30913950 (NOT 30913948, which is the sum-then-round collapse)"
            - "BidRevision.${rev_1_id}.unit_price_cents == 28615758 (Li 12,750,000 / 14,900,000 / 0 / 244,500 / 57,400 / 0 with per-line fees 302,813 / 353,875 / 0 / 5,807 / 1,363 / 0)"
            - "Bid.${bid_ca_id}.provisional_unit_price_cents == 28615758 after the revision overwrote the configuration"
            - "BidRevision.${rev_1_id}.round_index == 1 and Bid.${bid_ca_id}.revision_round == 1"
            - "the round-0 revision minted with the bid still carries unit_price_cents 30913950"

      - name: contract_total_freight_tier_keyed_on_discounted_subtotal
        grounds:
          - calculations.contract_total
          - calculations.bid_unit_price
          - state_machines.Bid.SUBMITTED_to_AWARDED
          - entities.ContractOrder.fields.total_contract_cents
        distinguishing_aspect: |
          Stage-ordering composition rather than rounding granularity: a 25-unit order whose 151,003,125
          subtotal sits above the 150,000,000 freight edge falls to 145,718,016 after the 3.5% volume
          discount, so the freight tier is 2,100,000 and the total is 149,665,741 — evaluating the
          freight tier before the discount would charge 2,950,000 and total 150,526,366.
        test_recipe:
          setup:
            - "BusModel TYPE_A_MINI (base_price_cents 5,800,000; 24 seats; 3 exits; 40.0 kN joints; curb 12,000 lb)"
            - "PropulsionPackage MINI-DSL-40 on it (option_price_cents 100,000; 40.0 gal; 9.0 mpg; 0.03 cold derate; 0.05 reserve)"
            - "StateSpecProfile OK 2026-2027 PUBLISHED (24 seats, 3 exits, 35.0 kN, 300.0 mi route range, FLAT, no optional equipment mandated)"
            - "Solicitation SOL-OK-001 for 25 units, price cap 6,500,000, required delivery 2027-06-30"
            - "Bid offering exactly the model's base configuration, provisional unit price 6,040,125, submitted by sales-01 on the default clock 2026-08-01 and closed for award on 2026-08-20"
          setup_api_calls:
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_A_MINI", body_class: "TYPE_A", base_seat_capacity: 24, base_emergency_exit_count: 3, base_price_cents: 5800000, body_joint_strength_kn: 40.0, max_battery_bays: 3, curb_weight_lb: 12000 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { model_a_id: $.data.id }
            - call: "POST /propulsion-packages"
              payload: { package_code: "MINI-DSL-40", compatible_bus_model_id: "${model_a_id}", propulsion_type: "DIESEL", option_price_cents: 100000, cold_weather_derate_pct: 0.03, reserve_floor_pct: 0.05, fuel_capacity_gal: 40.0, rated_mpg: 9.0 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { pkg_mini_id: $.data.id }
            - call: "POST /state-spec-profiles"
              payload: { state_code: "OK", school_year: "2026-2027", min_seat_capacity: 24, min_emergency_exit_count: 3, min_joint_strength_kn: 35.0, required_route_range_mi: 300.0, terrain_class: "FLAT" }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { ok_id: $.data.id }
            - call: "POST /state-spec-profiles/${ok_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
            - call: "POST /solicitations"
              payload: { solicitation_code: "SOL-OK-001", buyer_type: "COOPERATIVE", buyer_name: "Oklahoma Rural Coop", spec_profile_id: "${ok_id}", unit_count: 25, required_delivery_date: "2027-06-30", price_cap_cents_per_unit: 6500000 }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { sol_ok_id: $.data.id }
            - call: "POST /bids"
              payload: { solicitation_id: "${sol_ok_id}", bus_model_id: "${model_a_id}", propulsion_package_id: "${pkg_mini_id}", unit_count: 25, offered_seat_capacity: 24, offered_emergency_exit_count: 3, offered_mirror_config: "STANDARD", offered_lap_shoulder_belts: false, offered_eight_lamp_system: false, offered_crossing_arm: false, offered_rollover_reinforcement: false }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { bid_ok_id: $.data.id }
            - call: "POST /bids/${bid_ok_id}/submit"
              payload: {}
              as: SalesEngineer
              as_user_id: "sales-01"
            - call: "POST /solicitations/${sol_ok_id}/close"
              payload: {}
              as: ContractsAdmin
              as_user_id: "contracts-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: ContractsAdmin
              as_user_id: "contracts-01"
          trigger:
            - call: "POST /bids/${bid_ok_id}/award"
              payload: { promised_delivery_date: "2027-06-30" }
              as: ContractsAdmin
              as_user_id: "contracts-02"
              captures: { order_ok_id: $.data.id }
          assert:
            - "ContractOrder.${order_ok_id}.awarded_unit_price_cents == 6040125 (0 escalation months: 19 whole days between submit and award)"
            - "ContractOrder.${order_ok_id}.total_contract_cents == 149665741"
            - "ContractOrder.${order_ok_id}.total_contract_cents != 150526366 (the pre-discount freight-tier ordering)"
            - "Bid.${bid_ok_id}.derated_route_range_mi == 331.7 and Bid.${bid_ok_id}.spec_compliance_status == CONFORMING"
            - "ContractOrder.${order_ok_id}.unit_count == 25 and ContractOrder.${order_ok_id}.created_unit_count == 0"

  - rule_id: non_linear_state_machine
    instances:

      - name: bus_unit_three_dimensions_advance_independently
        grounds:
          - state_machines.BusUnit.production_status
          - state_machines.BusUnit.certification_status
          - state_machines.BusUnit.service_status
          - state_machines.BusUnit.BUILT_to_DELIVERED
          - state_machines.BusUnit.PENDING_to_CERTIFIED
          - entities.BusUnit.fields.driver_training_status
        distinguishing_aspect: |
          The bus carries three orthogonal dimensions plus a training flag: certify moves only
          certification_status (production stays BUILT), assign-dealer and complete-driver-training move
          neither status dimension, and deliver moves only production_status while service_status is
          still NONE — a single-status model cannot represent BUILT + CERTIFIED + NONE.
        test_recipe:
          setup:
