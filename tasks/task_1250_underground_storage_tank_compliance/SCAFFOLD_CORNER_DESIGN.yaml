# =============================================================================
# §1.9 Scaffold Corner Design — task_1250_underground_storage_tank_compliance
# Breadth coverage of §1.1–§1.7 testable claims NOT already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8). Taxonomy per claim-extraction-guide.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_facility_applies_computed_defaults
        claim_type: defaults
        grounds:
          - entities.Facility.fields.posture_score
          - entities.Facility.fields.fund_cap_remaining_cents
          - entities.Facility.fields.fund_program_election
        distinguishing_aspect: "Omitting fund_program_election defaults it to PER_OCCURRENCE; computed ledger/posture fields initialize to pinned constants."
        test_recipe:
          setup: ["Empty DB; logical clock at default 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
          trigger:
            - call: "POST /facilities"
              payload: { facility_name: "Defaults Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }
              as: FacilityOwner
              as_user_id: "owner-1"
              captures: { f_status: $.data.status, f_score: $.data.posture_score, f_posture: $.data.compliance_posture, f_cap: $.data.fund_cap_remaining_cents, f_ded: $.data.fund_year_deductible_remaining_cents, f_election: $.data.fund_program_election, f_owner: $.data.owner_account_id, f_version: $.data.version }
          assert:
            - "${f_status} == REGISTERED"
            - "${f_score} == 100 and ${f_posture} == COMPLIANT"
            - "${f_cap} == 100000000 (FUND_YEAR_CAP_CENTS)"
            - "${f_ded} == 2000000 (AGGREGATE_YEAR_DEDUCTIBLE_CENTS)"
            - "${f_election} == PER_OCCURRENCE (default applied)"
            - "${f_owner} == owner-1 (ownership anchored to creator X-User-ID)"
            - "${f_version} == 1"

      - name: create_tank_response_carries_common_fields
        claim_type: system_fields
        grounds:
          - entities.TankSystem
        distinguishing_aspect: "Server-minted id, created_at, updated_at, and version == 1 appear on creation; client cannot inject them."
        test_recipe:
          setup: ["Facility exists"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { facility_name: "CF Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
          trigger:
            - call: "POST /tank-systems"
              payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }
              as: FacilityOwner
              as_user_id: "owner-1"
              captures: { t_id: $.data.id, t_version: $.data.version, t_created: $.data.created_at, t_updated: $.data.updated_at, t_status: $.data.status }
          assert:
            - "${t_id} is a non-null UUID minted by the server"
            - "${t_version} == 1"
            - "${t_created} and ${t_updated} are ISO8601 UTC timestamps with three fractional digits"
            - "${t_status} == REGISTERED (initial state, system-set)"

      - name: tank_manual_gauging_capacity_boundary
        claim_type: type_constraints
        grounds:
          - entities.TankSystem.fields.capacity_gallons
          - errors[ERR_MODE_NOT_ALLOWED_FOR_CAPACITY]
        distinguishing_aspect: "MANUAL_GAUGING is allowed at exactly 2000 gallons (inclusive <=) and rejected at 2001."
        test_recipe:
          setup: ["Facility exists"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { facility_name: "Gauge Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
          trigger:
            - call: "POST /tank-systems"
              payload: { facility_id: "${fac}", tank_tag: "SMALL", substance: "DIESEL", capacity_gallons: 2000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "SUCTION", release_detection_mode: "MANUAL_GAUGING" }
              as: FacilityOwner
              as_user_id: "owner-1"
              captures: { t_ok: $.data.id }
            - call: "POST /tank-systems"
              payload: { facility_id: "${fac}", tank_tag: "BIG", substance: "DIESEL", capacity_gallons: 2001, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "SUCTION", release_detection_mode: "MANUAL_GAUGING" }
              as: FacilityOwner
              as_user_id: "owner-1"
              captures: { err: $.data.error_id }
          assert:
            - "2000-gallon MANUAL_GAUGING tank created (201); ${t_ok} non-null"
            - "${err} == ERR_MODE_NOT_ALLOWED_FOR_CAPACITY (2001 exceeds the inclusive 2000-gallon bound)"

      - name: get_nonexistent_facility_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_FACILITY_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "Reading a random UUID under /facilities yields 404 ERR_FACILITY_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /facilities/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FACILITY_NOT_FOUND with http 404"

      - name: service_order_retrieval_returns_stored_fields
        claim_type: retrieval
        grounds:
          - entities.ServiceOrder
          - calculations.service_quote_total
        distinguishing_aspect: "GET returns exactly the stored/create-computed field set: facility_id, tank_system_id, service_type, status REQUESTED, result_outcome NONE, quote_total_cents computed."
        test_recipe:
          setup: ["Facility with one tank; one REQUESTED service order"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { facility_name: "Get Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "LINE_TIGHTNESS", line_items: [{ description: "line test", qty: 1, unit_price_cents: 50000 }] }, as: ContractorAdmin, captures: { so: $.data.id } }
          trigger:
            - { call: "GET /service-orders/${so}", as: Any, captures: { g_fac: $.data.facility_id, g_tank: $.data.tank_system_id, g_type: $.data.service_type, g_status: $.data.status, g_outcome: $.data.result_outcome, g_quote: $.data.quote_total_cents } }
            - { call: "GET /service-orders?facility_id=${fac}", as: Any }
          assert:
            - "${g_fac} == ${fac} and ${g_tank} == ${tank} and ${g_type} == LINE_TIGHTNESS"
            - "${g_status} == REQUESTED and ${g_outcome} == NONE"
            - "${g_quote} == 65000 (50000 + 15000 mobilization)"
            - "Filtered list GET /service-orders?facility_id=${fac} returns total_count 1 containing ${so}"

      - name: list_pagination_defaults_and_envelope
        claim_type: listing
        grounds:
          - response_envelope.pagination_defaults
          - response_envelope.pagination_fields
        distinguishing_aspect: "Default limit is 10; limit=1 returns one item with total_count 2 and has_more true."
        test_recipe:
          setup: ["Two facilities exist"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { facility_name: "P1", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /facilities", payload: { facility_name: "P2", state_code: "OR", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1" }
          trigger:
            - { call: "GET /facilities", as: Any }
            - { call: "GET /facilities?limit=1", as: Any }
          assert:
            - "Unfiltered GET returns response_type array with 2 items, total_count == 2, has_more == false (default limit 10)"
            - "GET with limit=1 returns 1 item, total_count == 2, has_more == true"
            - "Both responses carry meta.api_request_id and meta.api_request_timestamp"

      - name: extra_field_in_create_payload_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Client-supplied computed/system fields (posture_score) or any undeclared key are rejected with ERR_INVALID_REQUEST, not silently ignored."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /facilities"
              payload: { facility_name: "Sneaky", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z", posture_score: 999 }
              as: FacilityOwner
              as_user_id: "owner-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST (payload keys are closed under the endpoint input schema)"

      - name: result_record_immutable_no_version_field
        claim_type: immutability
        grounds:
          - entities.ResultRecord
        distinguishing_aspect: "ResultRecord has common_fields false: its GET representation carries id and created_at but no version and no updated_at, and the entity exposes no update endpoint."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE, one CP-less TANK_TIGHTNESS order driven to UNDER_REVIEW with a PASS result"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Immutable Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /technicians", payload: { full_name: "TT", endorsements: ["TIGHTNESS_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_tt: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "t", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { so: $.data.id } }
            - { call: "POST /service-orders/${so}/schedule", payload: { technician_id: "${t_tt}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so}/start", payload: {}, as: Technician, as_user_id: "${t_tt}" }
            - { call: "POST /service-orders/${so}/results", payload: { readings: { leak_rate_gph: 0.05 } }, as: Technician, as_user_id: "${t_tt}" }
          trigger:
            - { call: "GET /result-records?service_order_id=${so}", as: Any, captures: { rr: "$.data[0].id" } }
            - { call: "GET /result-records/${rr}", as: Any }
          assert:
            - "GET /result-records/${rr} returns data with keys id, created_at, service_order_id, readings, outcome, recorded_at only"
            - "Response has NO version key and NO updated_at key (common_fields: false)"
            - "outcome == PASS and recorded_at == the logical clock at recording (2026-05-02T10:30:00Z)"

      - name: list_technicians_filter_by_endorsement
        claim_type: listing
        grounds:
          - entities.Technician
          - endpoints
        distinguishing_aspect: "Filtered list narrows by endorsement; detail GET returns the stored technician."
        test_recipe:
          setup: ["Three technicians with distinct endorsement sets"]
          setup_api_calls:
            - { call: "POST /technicians", payload: { full_name: "CP", endorsements: ["CP_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_cp: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "TT", endorsements: ["TIGHTNESS_TESTER"], trainer: false }, as: ContractorAdmin }
            - { call: "POST /technicians", payload: { full_name: "Trainer", endorsements: [], trainer: true }, as: ContractorAdmin }
          trigger:
            - { call: "GET /technicians?endorsement=CP_TESTER", as: Any }
            - { call: "GET /technicians/${t_cp}", as: Any, captures: { t_name: $.data.full_name, t_active: $.data.active, t_trainer: $.data.trainer } }
          assert:
            - "GET /technicians?endorsement=CP_TESTER returns total_count 1 containing ${t_cp}"
            - "${t_name} == CP, ${t_active} == true, ${t_trainer} == false (default applied)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: service_order_initial_state_on_create
        claim_type: initial_state
        grounds:
          - state_machines.ServiceOrder
        distinguishing_aspect: "A new ServiceOrder starts in REQUESTED with result_outcome NONE and version 1."
        test_recipe:
          setup: ["Facility with one tank"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { facility_name: "Init Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
          trigger:
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "t", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { so_status: $.data.status, so_outcome: $.data.result_outcome, so_v: $.data.version } }
          assert:
            - "${so_status} == REQUESTED and ${so_outcome} == NONE and ${so_v} == 1"

      - name: certify_from_requested_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.ServiceOrder.UNDER_REVIEW_to_CERTIFIED
          - errors[ERR_ORDER_NOT_UNDER_REVIEW]
        distinguishing_aspect: "Certify is defined only from UNDER_REVIEW; calling it on a REQUESTED order fails with ERR_ORDER_NOT_UNDER_REVIEW and no side effects."
        test_recipe:
          setup: ["Facility, tank, and a REQUESTED order; a reviewer technician"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { facility_name: "BadTrans Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "t", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { so: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "Reviewer", endorsements: [], trainer: false }, as: ContractorAdmin, captures: { t_rev: $.data.id } }
          trigger:
            - { call: "POST /service-orders/${so}/certify", payload: {}, as: ComplianceReviewer, as_user_id: "${t_rev}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_ORDER_NOT_UNDER_REVIEW"
            - "Order remains REQUESTED (no status change, no certified_by_technician_id set)"

      - name: start_by_non_assigned_technician_forbidden
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ServiceOrder.SCHEDULED_to_IN_PROGRESS
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "Only the assigned technician (X-User-ID == technician_id) may start the order; any other technician gets ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE; order SCHEDULED to technician t1; second technician t2 exists; clock inside the window"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Owner Gate", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /technicians", payload: { full_name: "T1", endorsements: ["TIGHTNESS_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t1: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "T2", endorsements: ["TIGHTNESS_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t2: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "t", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { so: $.data.id } }
            - { call: "POST /service-orders/${so}/schedule", payload: { technician_id: "${t1}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: ContractorAdmin }
          trigger:
            - { call: "POST /service-orders/${so}/start", payload: {}, as: Technician, as_user_id: "${t2}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_RESOURCE_OWNER (technician identity is checked against technician_id)"

      - name: cancel_in_progress_order_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.ServiceOrder
          - errors[ERR_ORDER_NOT_CANCELLABLE]
        distinguishing_aspect: "Cancel is allowed only from REQUESTED or SCHEDULED; an IN_PROGRESS order rejects with ERR_ORDER_NOT_CANCELLABLE."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE; order started (IN_PROGRESS) inside its window"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Cancel Gate", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /technicians", payload: { full_name: "TT", endorsements: ["TIGHTNESS_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_tt: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "t", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { so: $.data.id } }
            - { call: "POST /service-orders/${so}/schedule", payload: { technician_id: "${t_tt}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so}/start", payload: {}, as: Technician, as_user_id: "${t_tt}" }
          trigger:
            - { call: "POST /service-orders/${so}/cancel", payload: {}, as: ContractorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_ORDER_NOT_CANCELLABLE"

      - name: cancel_is_terminal_second_cancel_rejected
        claim_type: idempotency
        grounds:
          - state_machines.ServiceOrder.SCHEDULED_to_CANCELLED
          - errors[ERR_ORDER_NOT_CANCELLABLE]
        distinguishing_aspect: "Cancelling a SCHEDULED order succeeds once; a second cancel on the terminal CANCELLED order fails with ERR_ORDER_NOT_CANCELLABLE."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE; order SCHEDULED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Twice Cancel", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
