            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "01", modality: "IN_PERSON", meeting_day: "MON", start_minute: 540, end_minute: 600, enrollment_cap: 60 }, as: DepartmentChair, captures: { s1_id: "$.data.id", s1_v: "$.data.version" } }
            - { call: "POST /course-sections/${s1_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
            - { call: "POST /course-sections/${s1_id}/enrollment-sync", payload: { enrolled_count: 10, expected_section_version: "${s1_v}" }, as: Registrar, captures: { s1_v2: "$.data.version" } }
            - { call: "POST /assignments", payload: { section_id: "${s1_id}", faculty_id: "${f1_id}" }, as: DepartmentChair, captures: { a1_id: "$.data.id" } }
          trigger:
            - { call: "POST /course-sections/${s1_id}/enrollment-sync", payload: { enrolled_count: 50, expected_section_version: "${s1_v2}" }, as: Registrar }
            - { call: "GET /assignments/${a1_id}", as: DepartmentChair, captures: { a1_cr: "$.data.credit_units", a1_final: "$.data.final_credit_units" } }
