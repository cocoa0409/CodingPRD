              as: BureauConnector
            - call: "POST /credit/consumers/${rt_id}/pre-qualifications"
              payload: { lender_program_id: "${prog_id}" }
              as: Consumer
              as_user_id: "${rt_id}"
              captures: { rt_dec: $.data.id }
            - call: "POST /credit/pre-qualification-decisions/${rt_dec}/qualify"
