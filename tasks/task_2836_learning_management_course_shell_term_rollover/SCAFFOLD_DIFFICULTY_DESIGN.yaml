          trigger:
            - call: "POST /grade-disputes"
              payload: { passback_id: "${pb_id}", enrollment_id: "${e2}", content_item_id: "${item_id}", claimed_earned_points: 140.00 }
              as: Student
              as_user_id: "${s2}"
              captures: { d_id: $.data.id, d_state: $.data.dispute_state, held: $.data.held_points }
            - call: "GET /grade-passbacks/${pb_id}"
              payload: {}
              as: Registrar
              captures: { pb_state_disputed: $.data.passback_state, accepted_mid: $.data.accepted_points_total, disputed_mid: $.data.disputed_points_held, submitted_mid: $.data.submitted_points_total, open_disputes_mid: $.data.open_dispute_count }
            - call: "GET /academic-terms/${term_id}"
              payload: {}
              as: Registrar
              captures: { amendments_mid: $.data.open_amendment_count }
            - call: "GET /enrollments/${e2}"
              payload: {}
              as: Registrar
              captures: { e2_held_mid: $.data.disputed_points_held, e2_earned_mid: $.data.earned_points_total }
            - call: "POST /grade-disputes/${d_id}/resolve"
              payload: { outcome: "UPHELD", note: "regrade confirms the original mark" }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { d_state_final: $.data.dispute_state, adjusted: $.data.adjusted_earned_points, resolved_at: $.data.resolved_at }
            - call: "GET /grade-passbacks/${pb_id}"
              payload: {}
              as: Registrar
              captures: { pb_state_after: $.data.passback_state, accepted_after: $.data.accepted_points_total, disputed_after: $.data.disputed_points_held, submitted_after: $.data.submitted_points_total, open_disputes_after: $.data.open_dispute_count, amendment_round_after: $.data.amendment_round }
            - call: "GET /enrollments/${e2}"
              payload: {}
              as: Registrar
              captures: { e2_held_after: $.data.disputed_points_held, e2_earned_after: $.data.earned_points_total, e2_final_pct: $.data.final_grade_pct }
            - call: "GET /academic-terms/${term_id}"
              payload: {}
              as: Registrar
              captures: { amendments_after: $.data.open_amendment_count }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "GRADING" }
              as: Registrar
              captures: { term_state_grading: $.data.lifecycle_state }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "CLOSED" }
              as: Registrar
              captures: { term_state_closed: $.data.lifecycle_state }
          assert:
            - "${shell_state} == PUBLISHED, ${term_state} == FINALS, ${e1_earned} == 160.00, ${e1_graded_possible} == 200.00 and ${e2_earned} == 90.00"
            - "${staged} == 2 with ${variant_staged} == PROVISIONAL and all three buckets 0.00 (${accepted_staged}, ${submitted_staged}, ${disputed_staged})"
            - "${pb_state_submitted} == SUBMITTED, ${variant_final} == FINAL, ${submitted_total} == 250.00 (160.00 + 90.00) and ${accepted_at_submit} == 0.00 — E1 seeds submitted only"
            - "${pb_state_accepted} == ACCEPTED, ${accepted_total} == 250.00 and ${disputed_at_accept} == 0.00 — E2 satisfies 250.00 + 0.00 == 250.00; ${amendments_before} == 0"
            - "${d_state} == OPEN and ${held} == 90.00 — the escrow is the enrollment's stored earned_points_total, NOT the claimed 140.00"
            - "${pb_state_disputed} == DISPUTED with ${accepted_mid} == 160.00, ${disputed_mid} == 90.00, ${submitted_mid} == 250.00 and ${open_disputes_mid} == 1 — E4 moves the escrow between buckets and leaves submitted untouched; 160.00 + 90.00 == 250.00 still holds"
            - "${amendments_mid} == 1 and ${e2_held_mid} == 90.00 with ${e2_earned_mid} == 90.00 — the enrollment escrows without losing its grade"
            - "${d_state_final} == RESOLVED_UPHELD with ${adjusted} null and ${resolved_at} == \"2026-08-01T00:00:00Z\" (the logical clock)"
            - "${accepted_after} == 250.00, ${disputed_after} == 0.00 and ${submitted_after} == 250.00 — every bucket is identical to its pre-filing value; an implementation that adds held_points to submitted_points_total on release reads 340.00 here"
            - "${pb_state_after} == ACCEPTED, ${open_disputes_after} == 0 and ${amendment_round_after} == 0 — UPHELD is ledger-neutral and must NOT drive the passback to AMENDED the way CHANGED does"
            - "${e2_held_after} == 0.00, ${e2_earned_after} == 90.00 and ${e2_final_pct} == 45.00 (90.00 / 200.00) — the escrow is released without re-running the grade"
            - "${amendments_after} == 0, and the term then reaches ${term_state_grading} == GRADING and ${term_state_closed} == CLOSED — proof the parent counter really came back, since a residual open_amendment_count would have raised ERR_OPEN_DISPUTES_BLOCK_CLOSE"
