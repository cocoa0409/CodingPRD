  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: audit_settlement_five_hop_cascade_to_review_hold
        grounds:
          - state_machines.AuditEngagement.FINDINGS_ISSUED_to_SETTLED
          - state_machines.RoyaltyReport.UNDER_AUDIT_to_ADJUSTED
          - state_machines.LicenseAgreement.compliance_posture.CLEAR_to_PROBATION
          - calculations.underreporting_recovery_assessment
          - calculations.advance_recoupment_and_payable
          - calculations.compliance_risk_index
          - entities.ProductSubmission.fields.review_hold
        distinguishing_aspect: |
          A FIVE-hop chain from ONE call (settle): hop1 report UNDER_AUDIT -> ADJUSTED
          with adjusted_royalty_due_cents 525000; hop2 the agreement ledger is reversed
          and re-applied (unrecouped 500000 -> 1000000 -> 475000, recouped 500000 -> 0
          -> 525000); hop3 licensee.compliance_risk_index is recomputed and picks up the
          brand-new AUDIT_UNDERREPORT factor (20) on top of the existing seizure (15)
          for exactly 35; hop4 the agreement takes SM3 CLEAR -> PROBATION for that band;
          hop5 the IN_REVIEW submission gets review_hold == true. Hops 3-5 are only
          reachable because hop 1 happened, and the final observable (a submission that
          can no longer be reviewed) sits three entities away from the settle call.
          Stopping at hop 2 leaves posture CLEAR and review_hold false.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z, so QUARTER_OF(clock) == 2026Q3 and ELAPSED_QUARTERS(2026Q2, 2026Q3) == 1"
            - "licensee LIC_J ACTIVE; agreement AGR_J ACTIVE on category JERSEY, MG 4000000, required_advance 1000000 fully paid, term 2026-01-01..2027-12-31, central_licensing_flag false"
            - "one AUTHORIZED DEPARTMENT authorization covering 2026-01-01..2028-12-31"
            - "a 2026Q2 report with a single line of gross 6250000 is FILED and ACCEPTED by u_fin_1, so royalty_due_cents == 500000 and the ledger reads unrecouped 500000 / recouped 500000 / cumulative 500000"
            - "one EnforcementAction naming LIC_J is driven to SEIZURE_ORDERED at 2026Q3 (weight 15, decay 1.0)"
            - "one submission on AGR_J sits in IN_REVIEW with review_hold false"
            - "RoyaltyAuditor u_aud_1 opens an engagement scoped to [2026Q2] (allowed: u_aud_1 != u_fin_1, the accepting user) and issues findings restating gross to 6562500"
            - "FinanceController u_fin_2 settles on the FINDINGS basis (u_fin_2 != u_aud_1, satisfying priority 13)"
