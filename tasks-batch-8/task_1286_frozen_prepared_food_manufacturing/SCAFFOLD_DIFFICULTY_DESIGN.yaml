              as: ProductionPlanner
              captures: { cy_id: $.data.id }
            - { call: "POST /plant/freezing-cycles/${cy_id}/start", payload: {}, as: LineOperator }
            - { call: "POST /plant/freezing-cycles/${cy_id}/complete", payload: { actual_end: "2026-08-02T05:00:00Z", final_core_temp_c: -20 }, as: LineOperator }
            - call: "POST /plant/packaging-lines/${l_id}/runs"
