    input: []
    output: PracticumPlacement
    side_effects: ["placement HOURS_COMPLETE -> VERIFIED", "learner IN_PRACTICUM -> PRACTICUM_COMPLETE"]

  - method: POST
    path: "/society/practicum-placements/{id}/cancel"
    description: "Cancel an ACTIVE placement (releases supervisor capacity and the learner's window)."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: PracticumPlacement
    side_effects: []

  - method: POST
    path: "/society/credentials"
    description: "Issue a credential by age level. Requires learner PRACTICUM_COMPLETE (practicum completion verified), program ACCREDITED, no conflicting ACTIVE/LAPSED credential for the same learner+level."
    roles: [Registrar]
    code: 201
    input: [learner_id, age_level]
    output: Credential
    side_effects: ["learner PRACTICUM_COMPLETE -> CREDENTIALED", "cycle_start/expires_at set from the ACTIVE catalog"]

  - method: GET
    path: "/society/credentials/{id}"
    description: "Read one credential including ce_hours_cycle_credited and ce_hours_rolling_credited (both CE variants exposed)."
    roles: [SocietyAdmin, Registrar, AccreditationReviewer, AdultLearner, ProgramDirector, SchoolAdmin]
    code: 200
    input: []
    output: Credential
    side_effects: []

  - method: GET
    path: "/society/credentials"
    description: "List credentials with optional filters."
    roles: [SocietyAdmin, Registrar, AccreditationReviewer]
    code: 200
    input: ["learner_id?", "status?", "age_level?", "limit?", "offset?"]
    output: "Credential[]"
    side_effects: []

  - method: POST
    path: "/society/credentials/{id}/renew"
    description: "Renew an ACTIVE or LAPSED credential. Checks (in priority order): state, renewal window, CYCLE CE hours, fee match. On success restarts the cycle from today."
    roles: [AdultLearner, Registrar]
    code: 200
    input: [fee_cents]
    output: Credential
    side_effects: ["cycle_start := today", "expires_at := today + ACTIVE catalog credential_validity_months", "renewed_count += 1", "status := ACTIVE"]

  - method: POST
    path: "/society/credentials/{id}/revoke"
    description: "Revoke an ACTIVE or LAPSED credential; fires the classroom/school cascade (see state_machines.Credential)."
    roles: [AccreditationReviewer]
    code: 200
    input: ["reason?"]
    output: Credential
    side_effects: ["classrooms led by this credential -> compliance_override NONCOMPLIANT_LEAD", "affected schools recompute compliant_classroom_count", "ACCREDITED schools with a flipped classroom get an auto ImprovementPlan"]

  - method: POST
    path: "/society/school-applications"
    description: "Create a level-advancement application in DRAFT. Type must equal the school's next level. At most one in-flight (DRAFT, UNDER_REVIEW, RETURNED, SUSPENDED) application per school. OCC: expected_school_version must match."
    roles: [SchoolAdmin]
    code: 201
    input: [school_id, type, expected_school_version]
    output: SchoolApplication
    side_effects: ["increments School.version by 1"]

  - method: GET
    path: "/society/school-applications/{id}"
    description: "Read one application."
    roles: [SocietyAdmin, AccreditationReviewer, SchoolAdmin]
    code: 200
    input: []
    output: SchoolApplication
    side_effects: []

  - method: GET
    path: "/society/school-applications"
    description: "List applications with optional filters."
    roles: [SocietyAdmin, AccreditationReviewer, SchoolAdmin]
    code: 200
    input: ["school_id?", "status?", "type?", "supporting_self_study_id?", "limit?", "offset?"]
    output: "SchoolApplication[]"
    side_effects: []

  - method: POST
    path: "/society/school-applications/{id}/submit"
    description: "Submit a DRAFT or RETURNED application. Runs the escalating type-specific requirement chain (validations priority 5-9). For ACCREDITATION pins supporting_self_study_id."
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: SchoolApplication
    side_effects: ["application -> UNDER_REVIEW", "submitted_at := now"]

  - method: POST
    path: "/society/school-applications/{id}/review"
    description: "Reviewer decision: APPROVED advances the school's level (with approval preconditions incl. dues recheck and ACCREDITATION segregation of duties), DENIED terminates, RETURNED reopens the revision cycle."
    roles: [AccreditationReviewer]
    code: 200
    input: [outcome, "notes?"]
    output: SchoolApplication
    side_effects: ["on APPROVED: school membership_level advances with since-date set", "decided_at and reviewer_user_id recorded"]

  - method: POST
    path: "/society/self-studies"
    description: "Create a self-study in DRAFT, pinning the currently ACTIVE catalog (ERR_NO_ACTIVE_CATALOG if none). At most one in-flight (DRAFT, SUBMITTED, RETURNED_FOR_REVISION) self-study per school. OCC: expected_school_version must match."
    roles: [SchoolAdmin]
    code: 201
    input: [school_id, narrative, expected_school_version]
    output: SelfStudy
    side_effects: ["pinned_catalog_id/pinned_catalog_label set", "increments School.version by 1"]

  - method: GET
    path: "/society/self-studies/{id}"
    description: "Read one self-study."
    roles: [SocietyAdmin, AccreditationReviewer, SchoolAdmin]
    code: 200
    input: []
    output: SelfStudy
    side_effects: []

  - method: GET
    path: "/society/self-studies"
    description: "List self-studies with optional filters."
    roles: [SocietyAdmin, AccreditationReviewer, SchoolAdmin]
    code: 200
    input: ["school_id?", "pinned_catalog_id?", "status?", "limit?", "offset?"]
    output: "SelfStudy[]"
    side_effects: []

  - method: POST
    path: "/society/self-studies/{id}/submit"
    description: "Submit a DRAFT or RETURNED_FOR_REVISION self-study for review."
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: SelfStudy
    side_effects: ["self_study -> SUBMITTED", "submitted_at := now"]

  - method: POST
    path: "/society/self-studies/{id}/review"
    description: "Reviewer decision: ACCEPTED (pins the catalog onto the school) or RETURNED_FOR_REVISION (revision cycle)."
    roles: [AccreditationReviewer]
    code: 200
    input: [outcome, "notes?"]
    output: SelfStudy
    side_effects: ["on ACCEPTED: school.pinned_catalog_id := pinned catalog", "on ACCEPTED: increments School.version by 1"]

  - method: POST
    path: "/society/verification-visits"
    description: "Schedule a verification visit for an ACCEPTED self-study. Rejects consultant double-booking including the catalog's travel buffer (closed-interval-with-buffer semantics)."
    roles: [AccreditationReviewer]
    code: 201
    input: [school_id, self_study_id, consultant_id, window_start, window_end]
    output: VerificationVisit
    side_effects: []

  - method: GET
    path: "/society/verification-visits/{id}"
    description: "Read one visit including verdict/findings once filed."
    roles: [SocietyAdmin, AccreditationReviewer, SchoolAdmin, Consultant]
    code: 200
    input: []
    output: VerificationVisit
    side_effects: []

  - method: GET
    path: "/society/verification-visits"
    description: "List visits with optional filters."
    roles: [SocietyAdmin, AccreditationReviewer, SchoolAdmin, Consultant]
    code: 200
    input: ["school_id?", "self_study_id?", "consultant_id?", "status?", "limit?", "offset?"]
    output: "VerificationVisit[]"
    side_effects: []

  - method: POST
    path: "/society/verification-visits/{id}/cancel"
    description: "Cancel a SCHEDULED visit."
    roles: [AccreditationReviewer]
    code: 200
    input: ["reason?"]
    output: VerificationVisit
    side_effects: []

  - method: POST
    path: "/society/verification-visits/{id}/reports"
    description: "Assigned consultant files the visit report (findings + verdict). Auto-creates an ImprovementPlan for IMPROVEMENT_REQUIRED or NONCOMPLIANT; NONCOMPLIANT also drops a GOOD_STANDING school to PROBATION."
    roles: [Consultant]
    code: 201
    input: [findings, verdict]
    output: VerificationVisit
    side_effects: ["visit SCHEDULED -> REPORT_FILED", "conditional ImprovementPlan auto-creation", "conditional school standing cascade"]

  - method: GET
    path: "/society/improvement-plans/{id}"
    description: "Read one improvement plan."
    roles: [SocietyAdmin, AccreditationReviewer, SchoolAdmin]
    code: 200
    input: []
    output: ImprovementPlan
    side_effects: []

  - method: GET
    path: "/society/improvement-plans"
    description: "List improvement plans with optional filters."
    roles: [SocietyAdmin, AccreditationReviewer, SchoolAdmin]
    code: 200
    input: ["school_id?", "visit_id?", "status?", "limit?", "offset?"]
    output: "ImprovementPlan[]"
    side_effects: []

  - method: POST
    path: "/society/improvement-plans/{id}/respond"
    description: "School responds to an OPEN or OVERDUE plan. OCC: expected_improvement_plan_version must match."
    roles: [SchoolAdmin]
    code: 200
    input: [response_notes, expected_improvement_plan_version]
    output: ImprovementPlan
    side_effects: ["plan -> SUBMITTED", "increments ImprovementPlan.version by 1"]

  - method: POST
    path: "/society/improvement-plans/{id}/review"
    description: "Reviewer verdict on a SUBMITTED plan: VERIFIED (terminal; may auto-restore school standing to GOOD_STANDING) or CHANGES_REQUESTED (back to OPEN with a fresh due_date)."
    roles: [AccreditationReviewer]
    code: 200
    input: [outcome, "notes?"]
    output: ImprovementPlan
    side_effects: ["on VERIFIED: conditional school standing auto-restore", "on CHANGES_REQUESTED: due_date recomputed"]

  - method: POST
    path: "/society/pd-events"
    description: "Create a professional-development event (conference session etc.) in SCHEDULED."
    roles: [SocietyAdmin]
    code: 201
    input: [title, provider_name, start_at, end_at, ce_hours]
    output: PDEvent
    side_effects: []

  - method: GET
    path: "/society/pd-events/{id}"
    description: "Read one PD event."
    roles: [SocietyAdmin, AccreditationReviewer, Registrar, ProgramDirector, AdultLearner, SchoolAdmin, Consultant]
    code: 200
    input: []
    output: PDEvent
    side_effects: []

  - method: POST
    path: "/society/pd-events/{id}/attendance"
    description: "Record attendance of a credential holder at a COMPLETED event, creating a CECreditEntry (earned_at := event end_at) and recomputing the credential's CE caches. One non-VOID entry per credential+event."
    roles: [SocietyAdmin]
    code: 201
    input: [credential_id, "hours_earned?"]
    output: CECreditEntry
    side_effects: ["CECreditEntry created", "credential ce_hours_cycle_credited and ce_hours_rolling_credited recomputed"]

  - method: GET
    path: "/society/ce-entries/{id}"
    description: "Read one CE credit entry."
    roles: [SocietyAdmin, Registrar, AccreditationReviewer, AdultLearner]
    code: 200
    input: []
    output: CECreditEntry
    side_effects: []

  - method: GET
    path: "/society/ce-entries"
    description: "List CE credit entries with optional filters."
    roles: [SocietyAdmin, Registrar, AccreditationReviewer, AdultLearner]
    code: 200
    input: ["credential_id?", "pd_event_id?", "status?", "limit?", "offset?"]
    output: "CECreditEntry[]"
    side_effects: []

  - method: POST
    path: "/society/ce-entries/{id}/void"
    description: "Void a CE entry (compensating action of the CE ledger); recomputes the credential's CE caches."
    roles: [SocietyAdmin]
    code: 200
    input: []
    output: CECreditEntry
    side_effects: ["entry ACTIVE -> VOID", "credential CE caches recomputed"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID on an endpoint that requires authentication." }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed for the endpoint, or entity-backed ownership mismatch (school/program/learner/consultant scope)." }
  - { id: ERR_VALIDATION, http: 400, condition: "Required field missing, unknown enum member, numeric range violation, materials present_count > required_count, hours <= 0." }
  - { id: ERR_SCHOOL_NOT_FOUND, http: 404, condition: "No school with the given id (path or body FK), or unknown school_id on the public directory verification endpoint." }
  - { id: ERR_CLASSROOM_NOT_FOUND, http: 404, condition: "No classroom with the given id (path or body FK)." }
  - { id: ERR_AUDIT_NOT_FOUND, http: 404, condition: "No classroom audit with the given id." }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "No teacher education program with the given id." }
  - { id: ERR_LEARNER_NOT_FOUND, http: 404, condition: "No adult learner with the given id." }
  - { id: ERR_PLACEMENT_NOT_FOUND, http: 404, condition: "No practicum placement with the given id." }
  - { id: ERR_CREDENTIAL_NOT_FOUND, http: 404, condition: "No credential with the given id (path or body FK)." }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "No school application with the given id." }
  - { id: ERR_SELF_STUDY_NOT_FOUND, http: 404, condition: "No self-study with the given id." }
  - { id: ERR_VISIT_NOT_FOUND, http: 404, condition: "No verification visit with the given id (path or body FK)." }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "No improvement plan with the given id." }
  - { id: ERR_CATALOG_NOT_FOUND, http: 404, condition: "No standards catalog with the given id." }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "No PD event with the given id." }
  - { id: ERR_CE_ENTRY_NOT_FOUND, http: 404, condition: "No CE credit entry with the given id." }
  - { id: ERR_INVALID_STATE, http: 409, condition: "The target entity's current state has no transition for the requested action (includes wrong-typed application for the school's level, verify from non-HOURS_COMPLETE, report on non-SCHEDULED visit, attendance on non-COMPLETED event, review of non-actionable application/self-study/plan, enrollment into PROBATION/SUSPENDED program)." }
  - { id: ERR_CREDENTIAL_NOT_RENEWABLE, http: 409, condition: "Renew attempted on a REVOKED or EXPIRED credential (state error; outranks renewal-window errors)." }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent entity's current version (see §1.2.1)." }
  - { id: ERR_NO_ACTIVE_CATALOG, http: 422, condition: "Operation requires an ACTIVE standards catalog (self-study create, placement create, audit create) but none is ACTIVE." }
  - { id: ERR_CATALOG_EFFECTIVE_ORDER, http: 422, condition: "Activating a catalog whose effective_from is not strictly later than the currently ACTIVE catalog's." }
  - { id: ERR_PLACEMENT_WINDOW_OVERLAP, http: 409, condition: "Learner already has an ACTIVE or HOURS_COMPLETE placement whose half-open [start_date, end_date) window intersects the requested one; end == start adjacency is allowed." }
  - { id: ERR_PLACEMENT_WINDOW_INVALID, http: 422, condition: "end_date <= start_date, end_date <= today, or a log-hours work_date outside [start_date, end_date]." }
  - { id: ERR_CONSULTANT_SCHEDULE_CONFLICT, http: 409, condition: "The consultant already has a non-CANCELLED visit whose window, expanded by consultant_travel_buffer_days on both ends, intersects the requested window (adjacency counts as conflict)." }
  - { id: ERR_VISIT_WINDOW_INVALID, http: 422, condition: "window_end < window_start, or window_start < current logical date." }
  - { id: ERR_SUPERVISOR_CAPACITY_EXCEEDED, http: 422, condition: "Supervisor credential already supervises 3 ACTIVE placements; a 4th is rejected (exactly 3 is allowed)." }
  - { id: ERR_SUPERVISOR_CREDENTIAL_INACTIVE, http: 409, condition: "Supervisor credential is not ACTIVE (LAPSED/EXPIRED/REVOKED) at placement creation." }
  - { id: ERR_AGE_LEVEL_MISMATCH, http: 422, condition: "Age-level inconsistency: learner vs program offering, supervisor credential vs learner, lead credential vs classroom, credential issuance vs learner, or transfer across different classroom age levels." }
  - { id: ERR_HOST_SCHOOL_INELIGIBLE, http: 422, condition: "Practicum host school membership_level is APPLICANT (must be AFFILIATE or higher)." }
  - { id: ERR_PRACTICUM_NOT_VERIFIED, http: 422, condition: "Credential issuance attempted for a learner not in PRACTICUM_COMPLETE (no VERIFIED placement)." }
  - { id: ERR_PROGRAM_NOT_ACCREDITED, http: 409, condition: "Credential issuance attempted while the learner's program is not ACCREDITED." }
  - { id: ERR_DUPLICATE_CREDENTIAL, http: 409, condition: "An ACTIVE or LAPSED credential already exists for this learner + age_level." }
  - { id: ERR_DUPLICATE_ATTENDANCE, http: 409, condition: "A non-VOID CE entry already exists for this credential + PD event." }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "ACCREDITATION approval attempted by the same user id recorded as consultant_id on the supporting REPORT_FILED visit." }
  - { id: ERR_BRAND_DIFFERENTIATION_REQUIRED, http: 422, condition: "Non-ACCREDITED school uses the method name without a descriptor contained in display_name (at school create, brand update, or AFFILIATION submit)." }
  - { id: ERR_DISPLAY_NAME_TAKEN, http: 409, condition: "display_name already used by another school (case-insensitive)." }
  - { id: ERR_DUES_DELINQUENT, http: 402, condition: "school.dues_current is false at application submit or at approval decision." }
  - { id: ERR_SELF_STUDY_REQUIRED, http: 422, condition: "ACCREDITATION submit without an ACCEPTED self-study for the school." }
  - { id: ERR_VERIFICATION_VISIT_REQUIRED, http: 422, condition: "ACCREDITATION submit without a REPORT_FILED verification visit on the accepted self-study." }
  - { id: ERR_OPEN_IMPROVEMENT_PLAN, http: 409, condition: "ACCREDITATION submit while any improvement plan of the school is OPEN, OVERDUE or SUBMITTED." }
  - { id: ERR_ACCREDITATION_TENURE_TOO_SHORT, http: 422, condition: "ACCREDITATION submit before member_since + min_membership_months_before_accreditation." }
  - { id: ERR_CLASSROOM_REQUIRED, http: 422, condition: "AFFILIATION submit for a school with zero classrooms." }
  - { id: ERR_CLASSROOM_NONCOMPLIANT, http: 422, condition: "Application submit blocked: at least one classroom fails the applicable clearance variant (LATEST_PASS for MEMBERSHIP, NO_FAIL_IN_CYCLE for ACCREDITATION)." }
  - { id: ERR_IN_FLIGHT_APPLICATION_EXISTS, http: 409, condition: "School already has an application in DRAFT, UNDER_REVIEW, RETURNED or SUSPENDED." }
  - { id: ERR_IN_FLIGHT_SELF_STUDY_EXISTS, http: 409, condition: "School already has a self-study in DRAFT, SUBMITTED or RETURNED_FOR_REVISION." }
  - { id: ERR_TRANSFER_EXCEEDS_ENROLLMENT, http: 422, condition: "transfer-students student_count > source classroom enrolled_student_count." }
  - { id: ERR_TRANSFER_CROSS_SCHOOL, http: 422, condition: "transfer-students between classrooms of different schools." }
  - { id: ERR_PRACTICUM_STANDARD_UNMET, http: 422, condition: "Program accreditation: practicum_hours_by_level below the ACTIVE catalog's practicum_min_hours_by_level for some offered level." }
  - { id: ERR_INSUFFICIENT_CE_HOURS, http: 422, condition: "Renewal CYCLE hours below the ACTIVE catalog's ce_hours_required." }
  - { id: ERR_RENEWAL_WINDOW_CLOSED, http: 422, condition: "Renewal attempted outside [date(expires_at) - renewal_window_months, date(expires_at) + renewal_grace_months]." }
  - { id: ERR_FEE_MISMATCH, http: 422, condition: "Renewal fee_cents differs from calculations.renewal_fee for the credential's current status." }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated public caller (e.g., a parent verifying a school)."
    identity: opaque
    exclusive_operations: ["GET /society/directory", "GET /society/directory/{school_id}"]
    shared_operations: []

  - name: SocietyAdmin
    description: "Society operations staff: catalogs, school onboarding, dues recording, PD events and CE ledger administration, logical clock."
    identity: opaque
    exclusive_operations: ["POST /society/_clock/set_current_utc", "POST /society/standards-catalogs", "POST /society/standards-catalogs/{id}/activate", "POST /society/schools", "POST /society/schools/{id}/dues-payments", "POST /society/teacher-education-programs", "POST /society/pd-events", "POST /society/pd-events/{id}/attendance", "POST /society/ce-entries/{id}/void"]
    shared_operations: ["read endpoints across all entities"]

  - name: SchoolAdmin
    description: "Administrative user acting for one school; X-User-ID equals the School id."
    identity: "entity_backed:School"
    exclusive_operations: ["POST /society/schools/{id}/brand", "POST /society/classrooms", "POST /society/classrooms/{id}/transfer-students", "POST /society/school-applications", "POST /society/school-applications/{id}/submit", "POST /society/self-studies", "POST /society/self-studies/{id}/submit", "POST /society/improvement-plans/{id}/respond"]
    shared_operations: ["read endpoints for own school, classrooms, audits, applications, self-studies, visits, plans, credentials"]

  - name: ProgramDirector
    description: "Director of one teacher education program; X-User-ID equals the TeacherEducationProgram id."
    identity: "entity_backed:TeacherEducationProgram"
    exclusive_operations: ["POST /society/adult-learners", "POST /society/practicum-placements", "POST /society/practicum-placements/{id}/verify", "POST /society/practicum-placements/{id}/cancel"]
    shared_operations: ["read endpoints for own program, learners, placements, credentials, catalogs"]

  - name: AdultLearner
    description: "Teacher candidate / credential holder; X-User-ID equals the AdultLearner id."
    identity: "entity_backed:AdultLearner"
    exclusive_operations: ["POST /society/practicum-placements/{id}/log-hours"]
    shared_operations: ["POST /society/credentials/{id}/renew (own credential)", "read endpoints for own learner record, placements, credentials, CE entries, PD events"]

  - name: Consultant
    description: "Verification-visit consultant and classroom auditor (opaque operator id stored on visits/audits)."
    identity: opaque
    exclusive_operations: ["POST /society/classroom-audits", "POST /society/verification-visits/{id}/reports"]
    shared_operations: ["read endpoints for schools, classrooms, audits, visits, catalogs, PD events"]

  - name: AccreditationReviewer
    description: "Society accreditation decision-maker; segregated from the consultant who filed the supporting visit report."
    identity: opaque
    exclusive_operations: ["POST /society/schools/{id}/standing", "POST /society/teacher-education-programs/{id}/status", "POST /society/school-applications/{id}/review", "POST /society/self-studies/{id}/review", "POST /society/verification-visits", "POST /society/verification-visits/{id}/cancel", "POST /society/improvement-plans/{id}/review", "POST /society/credentials/{id}/revoke"]
    shared_operations: ["read endpoints across all entities"]

  - name: Registrar
    description: "Credential issuing authority."
    identity: opaque
    exclusive_operations: ["POST /society/credentials"]
    shared_operations: ["POST /society/credentials/{id}/renew", "read endpoints for credentials, learners, programs, schools, CE entries, audits"]
