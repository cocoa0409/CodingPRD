          assert:
            - "card_after_revise == DRAFT"
            - "card_after_resubmit == SUBMITTED"

      - name: invoice_branching_fork_from_under_review
        grounds:
          - state_machines.Invoice.UNDER_REVIEW_to_APPROVED
          - state_machines.Invoice.UNDER_REVIEW_to_PARTIALLY_APPROVED
          - state_machines.Invoice.UNDER_REVIEW_to_REJECTED
