      - name: shift_window_admits_the_touching_sixteen_hundred_start_and_the_exact_720_minute_span_but_refuses_15_59_and_721
        grounds:
          - validations[priority 13.2]
          - errors[ERR_SHIFT_WINDOW_OVERLAP]
          - errors[ERR_SHIFT_WINDOW_TOO_LONG]
          - entities.ShiftAssignment.fields.shift_start_utc
          - entities.ShiftAssignment.fields.shift_end_utc
          - entities.ShiftAssignment.fields.staff_id
          - entities.ShiftAssignment.fields.status
          - entities.ShiftAssignment.fields.assigned_acuity_load_units
          - entities.ShiftAssignment.fields.capacity_units_effective
          - state_machines.ShiftAssignment.initial_SCHEDULED
          - endpoints[POST /shift-assignments]
        distinguishing_aspect: |
          The SAME endpoint enforces two independent interval facts, and this
          instance pins both on their exact boundary while making each one
          unable to explain the other's outcome. Staff member "night RN" already
          holds a SCHEDULED shift [06:00, 16:00) on 2026-08-20.
            * [15:59, 22:00) -> 409 ERR_SHIFT_WINDOW_OVERLAP. The windows share
              exactly ONE minute. Its span is 361 minutes, far under the
              720-minute cap, so ERR_SHIFT_WINDOW_TOO_LONG cannot be the answer.
            * [16:00, 22:00) -> 201. HALF-OPEN semantics: previous end == new
              start is NOT an overlap. An implementation using the CLOSED bed
              semantics of validation 13.3 — the sibling interval rule one entity
              away — rejects this identical-except-one-minute call.
            * [2026-08-21T00:00, 12:00) -> 201 at a span of EXACTLY 720 minutes
              (the inclusive MAX_SHIFT_MINUTES cap); an off-by-one `< 720`
              reading rejects it.
            * [2026-08-22T00:00, 12:01) -> 409 ERR_SHIFT_WINDOW_TOO_LONG at 721
              minutes, on a day where the staff member has no other shift at all,
              so ERR_SHIFT_WINDOW_OVERLAP cannot be the answer.
            * [15:59, 22:00) for a DIFFERENT staff member -> 201, proving the
              overlap test is keyed on staff_id and not on (unit_id, role_slot):
              an implementation that scopes the search to the unit, or to the
              role_slot BEDSIDE both windows share, rejects this call.
          All five probes use role_slot BEDSIDE and staff whose
          credential_expires_at is 2027-12-31, so neither the cross-unit rule (7)
          nor the credential rule (11.1) can pre-empt priority 13.2, and the base
          shift is left in SCHEDULED — which is inside 13.2's {SCHEDULED, ACTIVE}
          search set — so no activation is needed and the 8.08 shift-window
          guards stay out of the way.
        test_recipe:
          setup: |
            One unit with a single LDR bed (enough to keep available_ldr_beds > 0
            and the posture OPEN, though POST /shift-assignments carries no
            posture gate) and three RN_LABOR_DELIVERY staff members: the charge
            nurse who creates the shifts, the "night RN" whose calendar is under
            test, and a second RN used to prove the staff scoping. The night RN is
            given one SCHEDULED BEDSIDE shift [2026-08-20T06:00:00Z,
            2026-08-20T16:00:00Z) — a 600-minute span, legally under the cap —
            and nothing else; no CareAssignment is ever created, so
            assigned_acuity_load_units stays 0 and capacity_units_effective stays
            null on every row.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-20T05:00:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /obstetric-units
