    side_effects: ["qc_status=QUARANTINED", "remaining_units=0", "CASCADE HOP 1->2: every MachiningTrial fed by this batch that is RUNNING or COMPLETED becomes INVALIDATED", "CASCADE HOP 2->3: each affected QualificationDossier recomputes completed_trial_count, passed_trial_count and composite_score", "CASCADE HOP 3->4: any affected dossier in SUBMITTED whose completed_trial_count falls below required_trial_count reverts to OPEN", "version bumped"]

