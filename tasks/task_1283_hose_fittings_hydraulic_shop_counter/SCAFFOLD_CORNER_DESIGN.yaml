              as: ShopManager
              captures: { reel_id: $.data.id }
            - call: "POST /api/couplings"
              payload: { coupling_sku: "1CA43-8-8R", size_in: 0.5, unit_price_cents: 1200, initial_on_hand_qty: 8 }
              as: ShopManager
              captures: { coup_id: $.data.id }
