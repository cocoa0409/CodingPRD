      - name: one_open_review_round_has_three_exits_with_three_different_side_effect_sets
        grounds:
          - state_machines.ReviewRound.OPEN_to_APPROVED
          - state_machines.ReviewRound.OPEN_to_REVISION_REQUESTED
          - state_machines.ReviewRound.OPEN_to_VETOED
          - entities.ReviewRound.fields.required_vote_count
          - entities.ExhibitProject.fields.conservation_veto_count
          - calculations.project_readiness_posture
        distinguishing_aspect: |
          OPEN is a fork with three outward edges and the edges do not agree on
          anything. APPROVE and REVISE both wait for quorum
          (cast_vote_count == required_vote_count == ceil(3 * 2 / 3) == 2);
          VETO does not wait at all and closes the round on a single vote. All
          three drive the package to a different place, and only the veto cast
          by a Conservator increments conservation_veto_count and freezes the
          project - the identical VETO from a Curator leaves the project merely
          RESTRICTED. A linear "count the votes, then decide" implementation
          gets the Curator veto wrong (it stalls waiting for a second vote) and
          gets the Conservator veto's posture wrong (it reports RESTRICTED).
        test_recipe:
          setup:
            - "project in phase DESIGN_DEV with an APPROVED SCHEMATIC package"
            - "a DRAFT DESIGN_DEV package pushed into IN_REVIEW by opening round 1 with panel [Curator, Conservator, ProjectManager], so required_vote_count == 2 and no vote has been cast"
