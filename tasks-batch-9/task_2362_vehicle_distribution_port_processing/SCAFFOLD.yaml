    side_effects: ["status := PLANNED; no kit quantity moves yet"]

  - method: GET
    path: /vpc/accessory-work-orders/{workOrderId}
    description: "Read one accessory work order."
    roles: *ops_roles
    code: 200
    input: []
    output: AccessoryWorkOrder
    side_effects: []

  - method: GET
    path: /vpc/accessory-work-orders
    description: "List accessory work orders, optionally filtered by unit, kit or status."
    roles: *ops_roles
    code: 200
    input: ["vehicle_id?", "accessory_kit_id?", "status?", "limit?", "offset?"]
    output: AccessoryWorkOrder[]
