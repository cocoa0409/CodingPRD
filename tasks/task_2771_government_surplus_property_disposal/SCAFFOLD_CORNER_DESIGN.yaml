              payload: { auction_lot_id: "${lot1}", basis: "ACCRUAL", expected_auction_lot_version: "${lot1_v}" }
              as: FinanceController
              as_user_id: "finance-01"
              captures: { dist1: "$.data.id" }
            - call: "POST /proceeds-distributions/${dist1}/post"
              payload: {}
              as: FinanceController
              as_user_id: "finance-01"
            - call: "GET /auction-lots/${lot1}"
              payload: {}
              as: FinanceController
              as_user_id: "finance-01"
              captures: { lot1_v2: "$.data.version" }
            - call: "POST /proceeds-distributions"
              payload: { auction_lot_id: "${lot1}", basis: "ACCRUAL", expected_auction_lot_version: "${lot1_v2}" }
              as: FinanceController
              as_user_id: "finance-01"
              captures: { err_posted: "$.data.error_id" }
          assert:
            - "the CASH request returns 409 with data.error_id == \"ERR_DISTRIBUTION_BASIS_UNAVAILABLE\" — the lot's invoice is ISSUED, neither PAID nor DEFAULTED"
            - "the ACCRUAL request on the same lot at the same instant returns 201 — the lot is CLOSED_MET, which ACCRUAL admits"
            - "ProceedsDistribution.${dist1}.distributable_base_cents == 10000, service_fee_cents == 1250, cost_recovery_cents == 0 and net_to_agency_cents == 8750"
            - "the post returns 200 with ProceedsDistribution.${dist1}.status == POSTED, posted_by_user_id == finance-01 (distinct from the lot's closed_by_user_id officer-01, so the segregation check passes)"
            - "Agency.${ag}.proceeds_account_balance_cents == 8750 and posted_distribution_count == 1"
            - "the second ACCRUAL create returns 409 with data.error_id == \"ERR_DISTRIBUTION_ALREADY_POSTED\""
            - "GET /proceeds-distributions?auction_lot_id=${lot1} returns total_count 1"

      - name: val_certificate_method_family_outranks_applicability
        claim_type: priority_ordering
        grounds:
          - validations[priority=58]
          - validations[priority=59]
        distinguishing_aspect: "Method-family membership is checked before the asset's clearance axis, so a NOT_REQUIRED asset addressed with a mismatched method answers 422 ERR_CLEARANCE_METHOD_MISMATCH rather than 409 ERR_CLEARANCE_NOT_APPLICABLE. The family rule also carries an asset-dependent clause: DESTROY is admitted only when demil_code == Q, so a demil_code B asset is refused the same method that a demil_code Q asset would accept."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one SUBMITTED turn-in for DOT-01 holding three assets: a data-bearing IT_EQUIPMENT item (clearance REQUIRED_PENDING), a restricted RESTRICTED_MILITARY item with demil_code B (clearance REQUIRED_PENDING) and a plain FURNITURE item (clearance NOT_REQUIRED)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag: "$.data.id" }
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag}", custody_location: "Camp Swift Storage" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { ti: "$.data.id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti}", category: "IT_EQUIPMENT", description: "Laptop cart", acquisition_cost_cents: 300000, acquisition_date: "2024-05-20", is_data_bearing: true }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { a_data: "$.data.id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti}", category: "RESTRICTED_MILITARY", description: "Armored door kit", acquisition_cost_cents: 900000, acquisition_date: "2019-06-01", is_restricted: true, demil_code: "B" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { a_restr: "$.data.id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti}", category: "FURNITURE", description: "Reception counter", acquisition_cost_cents: 104500, acquisition_date: "2024-05-20" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { a_plain: "$.data.id" }
            - call: "POST /turn-ins/${ti}/submit"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag}"
          trigger:
            - call: "POST /assets/${a_plain}/clearance-certificates"
              payload: { cert_type: "DATA_SANITIZATION", method: "MUTILATE", serials_verified: true, certified_on: "2026-08-01" }
              as: ClearanceTechnician
              as_user_id: "tech-01"
              captures: { err_method_first: "$.data.error_id" }
            - call: "POST /assets/${a_plain}/clearance-certificates"
              payload: { cert_type: "DATA_SANITIZATION", method: "NIST_PURGE", serials_verified: true, certified_on: "2026-08-01" }
              as: ClearanceTechnician
              as_user_id: "tech-01"
              captures: { err_not_applicable: "$.data.error_id" }
            - call: "POST /assets/${a_data}/clearance-certificates"
              payload: { cert_type: "DEMILITARIZATION", method: "NIST_PURGE", serials_verified: true, certified_on: "2026-08-01" }
              as: ClearanceTechnician
              as_user_id: "tech-01"
              captures: { err_wrong_family: "$.data.error_id" }
            - call: "POST /assets/${a_restr}/clearance-certificates"
              payload: { cert_type: "DEMILITARIZATION", method: "DESTROY", serials_verified: true, certified_on: "2026-08-01" }
              as: ClearanceTechnician
              as_user_id: "tech-01"
              captures: { err_destroy: "$.data.error_id" }
            - call: "POST /assets/${a_restr}/clearance-certificates"
              payload: { cert_type: "DEMILITARIZATION", method: "MUTILATE", serials_verified: true, certified_on: "2026-08-01" }
              as: ClearanceTechnician
              as_user_id: "tech-01"
              captures: { c_ok: "$.data.id" }
          assert:
            - "the NOT_REQUIRED asset with a mismatched method returns 422 with data.error_id == \"ERR_CLEARANCE_METHOD_MISMATCH\" — priority 58 precedes priority 59"
            - "the NOT_REQUIRED asset with a valid method returns 409 with data.error_id == \"ERR_CLEARANCE_NOT_APPLICABLE\""
            - "DEMILITARIZATION with NIST_PURGE returns 422 with data.error_id == \"ERR_CLEARANCE_METHOD_MISMATCH\" — the families do not overlap in either direction"
            - "DEMILITARIZATION with DESTROY on a demil_code B asset returns 422 with the same code — DESTROY requires demil_code == Q"
            - "DEMILITARIZATION with MUTILATE on the same asset returns 201 with ClearanceCertificate.${c_ok}.technician_user_id == tech-01"
            - "SurplusAsset.${a_restr}.clearance_status == CLEARED, SurplusAsset.${a_data}.clearance_status is still REQUIRED_PENDING and SurplusAsset.${a_plain}.clearance_status is still NOT_REQUIRED"
            - "GET /assets/${a_plain}/clearance-certificates returns total_count 0"

      - name: val_lot_not_open_before_reserve_check_excluded
        claim_type: priority_ordering
        grounds:
          - validations[priority=32]
          - validations[priority=80]
        excluded_because:
          difficulty_instance: ppvc_lot_not_open_outranks_bid_below_reserve
          rationale: "That §1.8 instance drives a below-reserve bid at a lot that is not OPEN and at a lot that is OPEN but outside its window, asserting ERR_LOT_NOT_OPEN both times and ERR_BID_BELOW_RESERVE only once the state fault is removed."

      - name: val_sanitization_gate_before_odometer_disclosure_excluded
        claim_type: priority_ordering
        grounds:
          - validations[priority=52]
          - validations[priority=64]
        excluded_because:
          difficulty_instance: ppvc_sanitization_gate_outranks_odometer_disclosure
          rationale: "The release of a data-bearing VEHICLE with neither a verified sanitization certificate nor an odometer disclosure is driven there, asserting ERR_SANITIZATION_NOT_CERTIFIED first and ERR_ODOMETER_DISCLOSURE_REQUIRED only after the clearance gate is satisfied."

      - name: val_end_use_certificate_before_deposit_check_excluded
        claim_type: priority_ordering
        grounds:
          - validations[priority=56]
          - validations[priority=84]
        excluded_because:
          difficulty_instance: ppvc_end_use_certificate_outranks_deposit_insufficiency
          rationale: "A bid on a restricted asset's lot by a bidder holding neither an end-use certificate nor a sufficient deposit is driven there, asserting ERR_END_USE_CERTIFICATE_REQUIRED ahead of the 402."

      - name: val_venue_closed_blocks_listing_excluded
        claim_type: violation_returns_error
        grounds:
          - validations[priority=40]
        excluded_because:
          difficulty_instance: cesd_lot_creation_requires_active_venue
          rationale: "ERR_VENUE_CLOSED is asserted there on a venue closed after the asset became listable, together with the successful listing at a second ACTIVE venue in the same state."

      - name: val_turn_in_not_draft_blocks_asset_add_excluded
        claim_type: violation_returns_error
        grounds:
          - validations[priority=31]
        excluded_because:
          difficulty_instance: cesd_asset_creation_requires_draft_turn_in
          rationale: "ERR_TURN_IN_NOT_DRAFT is asserted there against SUBMITTED, ACCEPTED and REJECTED parents, with the DRAFT case succeeding."

      - name: val_donee_certification_gate_excluded
        claim_type: violation_returns_error
        grounds:
          - validations[priority=60]
        excluded_because:
          difficulty_instance: cesd_transfer_order_requires_unlapsed_donee_certification
          rationale: "ERR_DONEE_CERTIFICATION_INVALID is asserted there for a NONE status, for a CERTIFIED status whose donee_certification_expires_on has lapsed by one day, and for the inclusive same-day boundary that passes."

      - name: val_federal_use_period_gate_excluded
        claim_type: violation_returns_error
        grounds:
          - validations[priority=50]
        excluded_because:
          difficulty_instance: bpc_federal_use_period_end_date_inclusive
          rationale: "ERR_FEDERAL_USE_PERIOD_ACTIVE is asserted there on both disposal channels one day before the use-period end date, with the inclusive boundary day admitted."

      - name: val_venue_capacity_and_relist_cooldown_excluded
        claim_type: violation_returns_error
        grounds:
          - validations[priority=74]
          - validations[priority=76]
        excluded_because:
          difficulty_instance: rto_venue_aggregate_capacity_half_open_adjacency_allowed
          rationale: "ERR_VENUE_CAPACITY_CONFLICT is asserted there at and above the venue's concurrent_lot_capacity with touching windows admitted; the companion instance rto_asset_relist_cooldown_closed_interval_adjacency_forbidden asserts ERR_ASSET_WINDOW_CONFLICT at the 24-hour cooldown boundary."

  - section: endpoints
    instances:

      - name: ep_clock_action_is_open_to_every_role_and_drives_stamps
        claim_type: action
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - entities.TurnIn.fields.submitted_at
        distinguishing_aspect: "The clock endpoint is the one action listed for all seven roles, and it has no entity output of its own; its effect is only observable through the next write's system stamps. Advancing it from three different roles and submitting a different turn-in after each move shows every submitted_at equal to the then-current logical instant rather than to wall-clock time."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T06:00:00Z"
            - "one ACTIVE agency DOT-01, one REGISTERED bidder, and three DRAFT turn-ins each holding one FURNITURE asset"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag: "$.data.id" }
            - call: "POST /bidders"
              payload: { legal_name: "Cedar Ridge Salvage LLC", email: "bids@cedarridge.example", bidder_type: "BUSINESS" }
