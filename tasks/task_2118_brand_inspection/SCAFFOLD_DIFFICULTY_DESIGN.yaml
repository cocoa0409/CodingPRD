              as_user_id: "${insp_1}"
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/lots"
              payload: { species_class: "CATTLE", head_count: 8 }
              as: FieldInspector
              as_user_id: "${insp_1}"
              captures: { lot_2: "$.data.id" }
            - call: "POST /brand-inspection/animal-lots/${lot_2}/finding"
              payload: { finding: "NO_LEGIBLE_BRAND" }
              as: FieldInspector
              as_user_id: "${insp_1}"
            - call: "GET /brand-inspection/territories/${terr_y}"
              payload: {}
              as: BoardAdmin
              captures: { head_after_intake: "$.data.impound_current_head" }
            - call: "GET /brand-inspection/estray-cases?animal_lot_id=${lot_1}"
              payload: {}
              as: BoardAdmin
              captures: { est_1: "$.data[0].id", est_1_release: "$.data[0].statutory_release_on" }
            - call: "POST /brand-inspection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /brand-inspection/estray-cases/${est_1}/schedule-auction"
              payload: { estimated_gross_cents: 180000 }
              as: BoardAdmin
            - call: "POST /brand-inspection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /brand-inspection/estray-cases/${est_1}/record-sale"
              payload: { gross_proceeds_cents: 160000 }
              as: BoardAdmin
          trigger:
            - call: "POST /brand-inspection/estray-cases/${est_1}/disburse"
              payload: {}
              as: FeeAdministrator
              as_user_id: "fee-01"
              captures: { est_status: "$.data.status", est_forfeit: "$.data.board_forfeiture_cents", est_resid: "$.data.claimant_residual_cents", est_care: "$.data.care_cost_cents", est_handling: "$.data.handling_fee_cents" }
            - call: "GET /brand-inspection/territories/${terr_y}"
              payload: {}
              as: BoardAdmin
              captures: { head_after_disburse: "$.data.impound_current_head", intake_after_disburse: "$.data.intake_status" }
          assert:
            - "${head_before} == 0"
            - "${head_after_intake} == 20"
            - "${est_1_release} == 2026-08-25T00:00:00.000Z"
            - "${est_status} == FORFEITED_TO_BOARD"
            - "${est_care} == 102300"
            - "${est_handling} == 11540"
            - "${est_forfeit} == 46160"
            - "${est_resid} == 0"
            - "160000 == ${est_care} + ${est_handling} + ${est_forfeit}"
            - "${head_after_disburse} == 8"
            - "${intake_after_disburse} == OPEN"
            - "AnimalLot.${lot_1}.lot_status == VERIFIED and AnimalLot.${lot_1}.disposition == CLEARED"
