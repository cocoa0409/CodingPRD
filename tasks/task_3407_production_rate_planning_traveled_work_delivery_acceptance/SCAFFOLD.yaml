scenario: |
  Production Rate Planning, Traveled Work & Delivery Acceptance (Boeing): production rate decisions balancing supply chain readiness, workforce hiring and customer demand with announced rate targets, supplier capacity commitments with long lead components ordered against a rate assumption, traveled work where incomplete jobs move down the line creating out-of-station work and rework cost, quality escape investigation with conformance documentation and regulator notification, customer delivery acceptance with flight tests, configuration verification and acceptance walkthroughs, inventory of undelivered aircraft requiring rework before delivery with storage and preservation, delivery schedule negotiation with customers including compensation for delays, production system stabilization and rate increase gating criteria

domain_name: aero-production-rate-delivery
api_prefix: /api

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: ProductionProgram
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "Aircraft model code, unique per program" }
      - { name: current_rate_per_month, type: integer, source: input, description: "Currently committed build rate (aircraft per month); >= 1" }
      - { name: required_component_codes, type: integer, source: input, description: "Count of distinct long-lead component families that must be covered by supplier commitments for gating; >= 1" }
      - { name: rework_budget_total_cents, type: integer, source: input, description: "Total rework budget for the program in cents; >= 0" }
      - { name: announced_target_rate, type: integer, source: computed, description: "proposed_rate of the latest RateCase in ANNOUNCED or GATED_REVIEW by created_at ASC (latest wins); equals current_rate_per_month when no such case exists" }
      - { name: rework_budget_consumed_cents, type: integer, source: computed, description: "Sum of actual_cost_cents over ReworkOrders in CLOSED status belonging to this program's aircraft; CREDITED and OPEN excluded" }
      - { name: cancellation_reserve_cents, type: integer, source: computed, description: "Sum over program commitments: status AT_RISK contributes round_half_up(0.30 * active_ordered_quantity * unit_price_cents) projected, status CANCELLED contributes its recorded cancellation_penalty_cents" }
      - { name: supply_chain_readiness_pct, type: number, source: computed, description: "Per gating_readiness_index calc vs current_rate_per_month, 2 decimals" }
      - { name: workforce_readiness_pct, type: number, source: computed, description: "Per gating_readiness_index calc, 2 decimals" }
      - { name: traveled_work_open_hours, type: integer, source: computed, description: "Sum of traveled_hours over WorkPackages in TRAVELED status whose linked ReworkOrder is not CLOSED or CREDITED" }
      - { name: open_escape_count, type: integer, source: computed, description: "Count of QualityEscapes on program aircraft with status in {OPEN, ROOT_CAUSE, DISPOSITIONED}" }
      - { name: readiness_index, type: number, source: computed, description: "Per gating_readiness_index calc: round_half_up(min(supply, workforce) - burden_penalty, 2)" }
      - { name: posture, type: enum, source: computed, description: "DISTRESSED if readiness_index < 60.0 or any CRITICAL escape in {OPEN, ROOT_CAUSE, DISPOSITIONED} or open_escape_count >= 3 or any program commitment in AT_RISK; else STABLE if readiness_index >= 85.0 and open_escape_count == 0; else STABILIZING" }
      - { name: storage_fees_accrued_cents, type: integer, source: computed, description: "Per storage_preservation_fee calc: sum of per-aircraft rounded fees over ACTIVE StoragePreservations" }
      - { name: undelivered_inventory_count, type: integer, source: computed, description: "Count of program AircraftUnits with production_status in {ASSEMBLY_COMPLETE, IN_STORAGE}" }

  - name: RateCase
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> ProductionProgram.id; program this rate decision targets" }
      - { name: proposed_rate, type: integer, source: input, description: "Proposed aircraft per month; >= 1; must differ from program.current_rate_per_month" }
      - { name: effective_month, type: string, source: input, description: "First calendar month the new rate applies, format YYYY-MM" }
      - { name: demand_backlog_units, type: integer, source: input, description: "Firm customer backlog in units justifying the rate; >= 0" }
      - { name: supply_readiness_snapshot_pct, type: number, source: computed, description: "supply_chain_readiness_pct against proposed_rate, frozen at request-gating-review" }
      - { name: workforce_readiness_snapshot_pct, type: number, source: computed, description: "workforce_readiness_pct, frozen at request-gating-review" }
      - { name: burden_penalty_snapshot, type: number, source: computed, description: "Burden penalty points, frozen at request-gating-review" }
      - { name: readiness_index_snapshot, type: number, source: computed, description: "readiness_index against proposed_rate, frozen at request-gating-review" }
      - { name: gating_verdict, type: enum, source: computed, description: "PASS or FAIL; null until request-gating-review; PASS iff readiness_index_snapshot >= 85.0 AND open_escape_count == 0 at review time" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ANNOUNCED -> GATED_REVIEW -> COMMITTED / SHELVED" }

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: supplier_code, type: string, source: input, description: "Unique supplier code" }
      - { name: name, type: string, source: input, description: "Supplier legal name" }
      - { name: region, type: string, source: input, description: "Home region" }

  - name: SupplierCapacityCommitment
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; committing supplier" }
      - { name: program_id, type: string, source: input, description: "FK -> ProductionProgram.id; program covered" }
      - { name: component_code, type: string, source: input, description: "Long-lead component family code" }
      - { name: committed_rate_per_month, type: integer, source: input, description: "Committed delivery rate; >= 1" }
      - { name: lead_time_months, type: integer, source: input, description: "Lead time in whole calendar months; >= 1" }
      - { name: unit_price_cents, type: integer, source: input, description: "Unit price in cents; >= 1" }
      - { name: ordered_quantity, type: integer, source: system, default: 0, description: "Total units ever ordered via place-order" }
      - { name: cancelled_quantity, type: integer, source: system, default: 0, description: "Total units cancelled via cancel" }
      - { name: active_ordered_quantity, type: integer, source: computed, description: "ordered_quantity - cancelled_quantity" }
      - { name: assumed_rate_at_order, type: integer, source: system, description: "Rate assumption passed at place-order; null until first order" }
      - { name: cancellation_penalty_cents, type: integer, source: computed, description: "At cancel: round_half_up(0.30 * cancelled_quantity_this_cancel * unit_price_cents); else 0" }
      - { name: status, type: enum, source: system, description: "DRAFT -> CONFIRMED -> ORDERED -> AT_RISK -> CANCELLED; CONFIRMED -> CANCELLED; AT_RISK -> ORDERED on rate recovery" }

  - name: WorkforcePlan
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> ProductionProgram.id; program staffed" }
      - { name: skill_code, type: string, source: input, description: "Skill family code; unique per program" }
      - { name: required_headcount, type: integer, source: input, description: "Headcount required to support gating; >= 1" }
      - { name: hired_headcount, type: integer, source: system, default: 0, description: "Cumulative hires via hire action" }
      - { name: readiness_ratio, type: number, source: computed, description: "hired_headcount / required_headcount, 2 decimals" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: airline_code, type: string, source: input, description: "Unique airline code" }
      - { name: name, type: string, source: input, description: "Customer legal name" }
      - { name: credit_standing, type: enum, source: input, description: "GOOD | WATCH | POOR; gates GOODWILL compensation variant" }

  - name: AircraftUnit
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> ProductionProgram.id; program building this unit" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; buying customer" }
      - { name: line_number, type: integer, source: input, description: "Production line number; unique per program" }
      - { name: configuration_code, type: string, source: input, description: "As-built configuration code" }
      - { name: ordered_configuration_code, type: string, source: input, description: "Contracted configuration code; verify-configuration requires equality with configuration_code" }
      - { name: contract_price_cents, type: integer, source: input, description: "Contract price in cents; >= 1; basis of liquidated-damages cap" }
      - { name: contracted_delivery_date, type: string, source: input, description: "Contracted delivery date, ISO YYYY-MM-DD; basis of days_late" }
      - { name: production_status, type: enum, source: system, description: "IN_PRODUCTION -> ASSEMBLY_COMPLETE -> IN_STORAGE -> ASSEMBLY_COMPLETE (release) -> DELIVERED; auto-completes when all WorkPackages in {COMPLETE, TRAVELED}" }
      - { name: quality_status, type: enum, source: system, description: "CLEAR | HOLD; HOLD while any QualityEscape on this aircraft in {OPEN, ROOT_CAUSE, DISPOSITIONED}" }
      - { name: delivery_status, type: enum, source: system, description: "NOT_STARTED -> FLIGHT_TESTING -> CONFIG_VERIFIED -> WALKTHROUGH_PASSED -> ACCEPTED; REJECTED -> FLIGHT_TESTING retry cycle" }
      - { name: rework_cost_total_cents, type: integer, source: computed, description: "Sum of actual_cost_cents over this aircraft's ReworkOrders in CLOSED status" }
      - { name: scheduled_delivery_date, type: string, source: system, description: "Set when a DeliveryNegotiation reaches AGREED; null until then" }

  - name: WorkPackage
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> AircraftUnit.id; aircraft this job belongs to" }
      - { name: station_sequence, type: integer, source: input, description: "Station position on the line; >= 1; unique per aircraft" }
      - { name: description, type: string, source: input, description: "Job description" }
      - { name: planned_hours, type: integer, source: input, description: "Planned labor hours; >= 1" }
      - { name: traveled_hours, type: integer, source: system, description: "Out-of-station hours declared at travel; set by travel action" }
      - { name: status, type: enum, source: system, description: "OPEN -> COMPLETE / TRAVELED" }

  - name: ReworkOrder
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: system, description: "FK -> AircraftUnit.id; aircraft needing rework" }
      - { name: work_package_id, type: string, source: system, description: "FK -> WorkPackage.id; set when source=TRAVELED_WORK, else null" }
      - { name: escape_id, type: string, source: system, description: "FK -> QualityEscape.id; set when source=QUALITY_ESCAPE, else null" }
      - { name: source, type: enum, source: system, description: "TRAVELED_WORK | QUALITY_ESCAPE | FLIGHT_TEST_FAILURE | WALKTHROUGH_SNAG" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "Provisional variant at creation: traveled_hours or estimated_hours input * 15000 * source multiplier (traveled_work_cost calc)" }
      - { name: actual_cost_cents, type: integer, source: computed, description: "Final variant at close: actual_hours * 17500 + parts_cents (traveled_work_cost calc); null until CLOSED" }
      - { name: status, type: enum, source: system, description: "OPEN -> CLOSED -> CREDITED" }

  - name: QualityEscape
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> AircraftUnit.id; affected aircraft" }
      - { name: severity, type: enum, source: input, description: "MAJOR | CRITICAL" }
      - { name: description, type: string, source: input, description: "Nonconformance description" }
      - { name: reported_by_id, type: string, source: system, description: "X-User-ID of the creating QualityInspector; recorded at creation" }
      - { name: conformance_documented, type: boolean, source: system, default: false, description: "Set true by begin-root-cause when conformance_refs carries >= 1 entry" }
      - { name: conformance_refs, type: array, source: system, description: "Conformance document reference codes appended at begin-root-cause; append-only" }
      - { name: regulator_notified_at, type: datetime, source: system, description: "Logical-clock timestamp of notify-regulator; null until notified" }
      - { name: is_late_notification, type: boolean, source: computed, description: "true iff regulator_notified_at is later than created_at + 24 hours" }
      - { name: dispositioned_by_id, type: string, source: system, description: "X-User-ID of the dispositioning QualityInspector; must differ from reported_by_id" }
      - { name: disposition_code, type: enum, source: system, description: "USE_AS_IS | REWORK | SCRAP; set at disposition" }
      - { name: status, type: enum, source: system, description: "OPEN -> ROOT_CAUSE -> DISPOSITIONED -> CLOSED; DISPOSITIONED -> ROOT_CAUSE reopen cycle" }

  - name: FlightTest
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: system, description: "FK -> AircraftUnit.id; aircraft under test" }
      - { name: range_code, type: enum, source: input, description: "RANGE_ALPHA | RANGE_BRAVO; test range resource occupied" }
      - { name: window_start, type: datetime, source: input, description: "Window start, ISO8601 UTC; half-open interval start" }
      - { name: window_end, type: datetime, source: input, description: "Window end, ISO8601 UTC; must be strictly after window_start; half-open interval end" }
      - { name: outcome, type: enum, source: system, description: "PASS | FAIL; null until record-outcome" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> COMPLETED" }

  - name: StoragePreservation
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: system, description: "FK -> AircraftUnit.id; stored aircraft" }
      - { name: bay_code, type: string, source: input, description: "Storage bay resource occupied" }
      - { name: window_start, type: datetime, source: input, description: "Storage occupancy start, ISO8601 UTC; closed interval start" }
      - { name: window_end, type: datetime, source: input, description: "Storage occupancy end, ISO8601 UTC; must be strictly after window_start; closed interval end" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Storage daily rate in cents; >= 1" }
      - { name: preservation_cycle_days, type: integer, source: input, description: "Days between mandatory preservation maintenance; >= 1" }
      - { name: last_preserved_at, type: datetime, source: system, description: "Initialized to window_start; reset by maintain to the logical clock" }
      - { name: next_preservation_due, type: datetime, source: computed, description: "last_preserved_at + preservation_cycle_days days" }
      - { name: is_overdue, type: boolean, source: computed, description: "true iff status ACTIVE and logical clock is strictly later than next_preservation_due" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> RELEASED" }

  - name: DeliveryNegotiation
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> AircraftUnit.id; aircraft whose delivery date is negotiated" }
      - { name: customer_id, type: string, source: system, description: "Copied from AircraftUnit.customer_id at creation; the negotiating customer" }
      - { name: proposed_delivery_date, type: string, source: input, description: "Proposed delivery date, ISO YYYY-MM-DD" }
      - { name: compensation_variant, type: enum, source: input, description: "CONTRACTUAL_LIQUIDATED | GOODWILL; GOODWILL requires the aircraft customer's credit_standing == GOOD" }
      - { name: days_late, type: integer, source: computed, description: "proposed_delivery_date minus aircraft contracted_delivery_date in whole days; floor 0" }
      - { name: compensation_cents, type: integer, source: computed, description: "Per delay_compensation calc on the current round's variant and days_late; recomputed every round" }
      - { name: round_number, type: integer, source: system, default: 1, description: "Negotiation round; increments on every counter; EXPIRED when a counter would push it past 6" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> COUNTERED -> PROPOSED (cycle) -> AGREED / EXPIRED" }

state_machines:
  - entity: RateCase
    initial_state: DRAFT
    terminal_states: [COMMITTED, SHELVED]
    transitions:
      - from: DRAFT
        to: ANNOUNCED
        trigger: "POST /api/rate-cases/{id}/announce"
        actor: ProductionPlanner
        preconditions:
          - "RateCase.status == DRAFT"
        side_effects:
          - "program.announced_target_rate := RateCase.proposed_rate"
          - "increments ProductionProgram.version by 1"
      - from: ANNOUNCED
        to: GATED_REVIEW
        trigger: "POST /api/rate-cases/{id}/request-gating-review"
        actor: ProductionPlanner
        preconditions:
          - "RateCase.status == ANNOUNCED"
        side_effects:
          - "freezes supply_readiness_snapshot_pct, workforce_readiness_snapshot_pct, burden_penalty_snapshot, readiness_index_snapshot evaluated against proposed_rate"
          - "sets gating_verdict := PASS iff readiness_index_snapshot >= 85.0 AND program.open_escape_count == 0, else FAIL"
      - from: GATED_REVIEW
        to: COMMITTED
        trigger: "POST /api/rate-cases/{id}/commit"
        actor: ProductionPlanner
        preconditions:
          - "RateCase.status == GATED_REVIEW"
          - "RateCase.gating_verdict == PASS"
        side_effects:
          - "program.current_rate_per_month := proposed_rate"
          - "increments ProductionProgram.version by 1"
          - "CASCADE link 1: every SupplierCapacityCommitment of this program in ORDERED status with assumed_rate_at_order > proposed_rate flips to AT_RISK"
          - "CASCADE link 1 (recovery): every commitment of this program in AT_RISK with assumed_rate_at_order <= proposed_rate flips back to ORDERED"
          - "CASCADE link 2: program.cancellation_reserve_cents is recomputed from the mutated commitment set (each AT_RISK flip changes the reserve)"
          - "CASCADE link 3: program.posture is recomputed from the new readiness/cancellation state; if posture becomes DISTRESSED, every other RateCase of this program in GATED_REVIEW auto-transitions to SHELVED"
      - from: GATED_REVIEW
        to: SHELVED
        trigger: "POST /api/rate-cases/{id}/shelve or system auto-shelve on posture DISTRESSED"
        actor: ProductionPlanner
        preconditions:
          - "RateCase.status in {DRAFT, ANNOUNCED, GATED_REVIEW}"
        side_effects:
          - "program.announced_target_rate is recomputed from remaining ANNOUNCED/GATED_REVIEW cases (compensation: falls back to current_rate_per_month when none remain)"
      - from: DRAFT
        to: SHELVED
        trigger: "POST /api/rate-cases/{id}/shelve"
        actor: ProductionPlanner
        preconditions:
          - "RateCase.status in {DRAFT, ANNOUNCED, GATED_REVIEW}"
        side_effects: []
      - from: ANNOUNCED
        to: SHELVED
        trigger: "POST /api/rate-cases/{id}/shelve"
        actor: ProductionPlanner
        preconditions:
          - "RateCase.status in {DRAFT, ANNOUNCED, GATED_REVIEW}"
        side_effects:
          - "program.announced_target_rate is recomputed from remaining ANNOUNCED/GATED_REVIEW cases"

  - entity: SupplierCapacityCommitment
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /api/capacity-commitments/{id}/confirm"
        actor: SupplierManager
        preconditions:
          - "SupplierCapacityCommitment.status == DRAFT"
          - "acting X-User-ID == commitment.supplier_id"
        side_effects: []
      - from: CONFIRMED
        to: ORDERED
        trigger: "POST /api/capacity-commitments/{id}/place-order"
        actor: SupplierManager
        preconditions:
          - "SupplierCapacityCommitment.status in {CONFIRMED, ORDERED, AT_RISK}"
          - "acting X-User-ID == commitment.supplier_id"
        side_effects:
          - "ordered_quantity += payload quantity; assumed_rate_at_order := payload assumed_rate_per_month; status := ORDERED"
      - from: ORDERED
        to: ORDERED
        trigger: "POST /api/capacity-commitments/{id}/place-order (repeat top-up order)"
        actor: SupplierManager
        preconditions:
          - "SupplierCapacityCommitment.status in {CONFIRMED, ORDERED, AT_RISK}"
        side_effects:
          - "ordered_quantity += payload quantity; assumed_rate_at_order := payload assumed_rate_per_month"
      - from: AT_RISK
        to: ORDERED
        trigger: "POST /api/capacity-commitments/{id}/place-order or RateCase commit recovery cascade"
        actor: SupplierManager
        preconditions:
          - "SupplierCapacityCommitment.status in {CONFIRMED, ORDERED, AT_RISK}"
        side_effects:
          - "ordered_quantity += payload quantity; assumed_rate_at_order := payload assumed_rate_per_month; status := ORDERED"
      - from: ORDERED
        to: AT_RISK
        trigger: "system: RateCase COMMITTED cascade when proposed_rate < assumed_rate_at_order"
        actor: system
        preconditions: []
        side_effects:
          - "program.cancellation_reserve_cents recomputed (link 2 of rate-commit cascade)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/capacity-commitments/{id}/cancel"
        actor: SupplierManager
        preconditions:
          - "SupplierCapacityCommitment.status in {CONFIRMED, ORDERED, AT_RISK}"
          - "acting X-User-ID == commitment.supplier_id"
          - "all-or-nothing: payload cancel_quantity may be omitted (defaults to active_ordered_quantity) but when provided must equal active_ordered_quantity"
        side_effects:
          - "cancelled_quantity += cancel_quantity (CONFIRMED has 0); cancellation_penalty_cents := round_half_up(0.30 * cancel_quantity * unit_price_cents); status := CANCELLED"
          - "program.cancellation_reserve_cents recomputed"
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /api/capacity-commitments/{id}/cancel"
        actor: SupplierManager
        preconditions:
          - "SupplierCapacityCommitment.status in {CONFIRMED, ORDERED, AT_RISK}"
          - "all-or-nothing: payload cancel_quantity may be omitted (defaults to active_ordered_quantity) but when provided must equal active_ordered_quantity"
        side_effects:
          - "cancelled_quantity += cancel_quantity; cancellation_penalty_cents := round_half_up(0.30 * cancel_quantity * unit_price_cents); status := CANCELLED"
          - "program.cancellation_reserve_cents recomputed"
      - from: AT_RISK
        to: CANCELLED
        trigger: "POST /api/capacity-commitments/{id}/cancel"
        actor: SupplierManager
        preconditions:
          - "SupplierCapacityCommitment.status in {CONFIRMED, ORDERED, AT_RISK}"
          - "all-or-nothing: payload cancel_quantity may be omitted (defaults to active_ordered_quantity) but when provided must equal active_ordered_quantity"
        side_effects:
          - "cancelled_quantity += cancel_quantity; cancellation_penalty_cents := round_half_up(0.30 * cancel_quantity * unit_price_cents); status := CANCELLED"
          - "program.cancellation_reserve_cents recomputed"

  - entity: WorkPackage
    initial_state: OPEN
    terminal_states: [COMPLETE, TRAVELED]
    transitions:
      - from: OPEN
        to: COMPLETE
        trigger: "POST /api/work-packages/{id}/complete"
        actor: LineManager
        preconditions:
          - "WorkPackage.status == OPEN"
        side_effects:
          - "if every WorkPackage of the aircraft is in {COMPLETE, TRAVELED}: aircraft.production_status := ASSEMBLY_COMPLETE (bubble-up)"
      - from: OPEN
        to: TRAVELED
        trigger: "POST /api/work-packages/{id}/travel"
        actor: LineManager
        preconditions:
          - "WorkPackage.status == OPEN"
          - "payload traveled_hours >= 1"
        side_effects:
          - "traveled_hours := payload traveled_hours"
          - "CASCADE link 1: creates ReworkOrder(source=TRAVELED_WORK, work_package_id=this, aircraft_id=this.aircraft_id, estimated_cost_cents per traveled_work_cost provisional variant)"
          - "CASCADE link 2: program.traveled_work_open_hours recomputed from the new TRAVELED set"
          - "if every WorkPackage of the aircraft is in {COMPLETE, TRAVELED}: aircraft.production_status := ASSEMBLY_COMPLETE (bubble-up)"

  - entity: ReworkOrder
    initial_state: OPEN
    terminal_states: [CREDITED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/rework-orders/{id}/close"
        actor: LineManager
        preconditions:
          - "ReworkOrder.status == OPEN"
          - "program.rework_budget_consumed_cents + final actual_cost_cents <= program.rework_budget_total_cents"
        side_effects:
          - "actual_cost_cents := round_half_up(actual_hours * 17500 + parts_cents) (traveled_work_cost final variant)"
          - "program.rework_budget_consumed_cents recomputed (ledger sync)"
          - "aircraft.rework_cost_total_cents recomputed"
          - "if source == TRAVELED_WORK: program.traveled_work_open_hours recomputed"
      - from: CLOSED
        to: CREDITED
        trigger: "POST /api/rework-orders/{id}/credit"
        actor: LineManager
        preconditions:
          - "ReworkOrder.status == CLOSED"
        side_effects:
          - "program.rework_budget_consumed_cents recomputed (compensation: credited order excluded)"
          - "aircraft.rework_cost_total_cents recomputed (credited order excluded)"
          - "if source == TRAVELED_WORK: program.traveled_work_open_hours recomputed (work package of a credited order no longer counts as open traveled work)"

  - entity: QualityEscape
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ROOT_CAUSE
        trigger: "POST /api/quality-escapes/{id}/begin-root-cause"
        actor: QualityInspector
        preconditions:
          - "QualityEscape.status == OPEN"
          - "regulator_notified_at is not null"
          - "payload conformance_refs has >= 1 entry"
        side_effects:
          - "conformance_refs := payload conformance_refs; conformance_documented := true"
      - from: ROOT_CAUSE
        to: DISPOSITIONED
        trigger: "POST /api/quality-escapes/{id}/disposition"
        actor: QualityInspector
        preconditions:
          - "QualityEscape.status == ROOT_CAUSE"
          - "acting X-User-ID != reported_by_id (segregation of duties)"
        side_effects:
          - "dispositioned_by_id := acting X-User-ID; disposition_code := payload disposition_code"
      - from: DISPOSITIONED
        to: ROOT_CAUSE
        trigger: "POST /api/quality-escapes/{id}/reopen"
        actor: QualityInspector
        preconditions:
          - "QualityEscape.status == DISPOSITIONED"
        side_effects:
          - "dispositioned_by_id := null; disposition_code := null"
      - from: DISPOSITIONED
        to: CLOSED
        trigger: "POST /api/quality-escapes/{id}/close"
        actor: QualityInspector
        preconditions:
          - "QualityEscape.status == DISPOSITIONED"
          - "every ReworkOrder with escape_id == this escape is in {CLOSED, CREDITED}"
        side_effects:
          - "program.open_escape_count recomputed"
          - "if no remaining escape on the aircraft in {OPEN, ROOT_CAUSE, DISPOSITIONED}: aircraft.quality_status := CLEAR"
          - "program.posture recomputed"

  - entity: FlightTest
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/flight-tests/{id}/record-outcome"
        actor: DeliveryManager
        preconditions:
          - "FlightTest.status == SCHEDULED"
          - "payload outcome in {PASS, FAIL}"
        side_effects:
          - "outcome := payload outcome"
          - "on PASS: if all FlightTests of the aircraft are COMPLETED with outcome PASS and aircraft.delivery_status == FLIGHT_TESTING: delivery_status advances only via verify-configuration (no auto-advance)"
          - "on FAIL CASCADE link 1: aircraft.delivery_status := REJECTED and creates ReworkOrder(source=FLIGHT_TEST_FAILURE, aircraft_id=this.aircraft_id, estimated_cost_cents per provisional variant with estimated_hours from payload rework_estimated_hours)"
          - "on FAIL CASCADE link 2: every DeliveryNegotiation of this aircraft in {PROPOSED, COUNTERED} auto-transitions to EXPIRED because the aircraft delivery state changed under it"

  - entity: StoragePreservation
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /api/storage-preservations/{id}/maintain"
        actor: DeliveryManager
        preconditions:
          - "StoragePreservation.status == ACTIVE"
        side_effects:
          - "last_preserved_at := logical clock; next_preservation_due recomputed; is_overdue recomputed"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /api/storage-preservations/{id}/release"
        actor: DeliveryManager
        preconditions:
          - "StoragePreservation.status == ACTIVE"
          - "no ReworkOrder of this aircraft in OPEN status"
        side_effects:
          - "aircraft.production_status := ASSEMBLY_COMPLETE"
          - "program.undelivered_inventory_count recomputed"

  - entity: DeliveryNegotiation
    initial_state: PROPOSED
    terminal_states: [AGREED, EXPIRED]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /api/delivery-negotiations/{id}/counter"
        actor: Customer
        preconditions:
          - "DeliveryNegotiation.status == COUNTERED implies actor DeliveryManager; status == PROPOSED implies actor Customer (alternating turns)"
          - "round_number + 1 <= 6"
        side_effects:
          - "proposed_delivery_date := payload proposed_delivery_date; compensation_variant := payload compensation_variant; days_late and compensation_cents recomputed; round_number += 1"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /api/delivery-negotiations/{id}/counter"
        actor: DeliveryManager
        preconditions:
          - "DeliveryNegotiation.status == COUNTERED implies actor DeliveryManager; status == PROPOSED implies actor Customer (alternating turns)"
          - "round_number + 1 <= 6"
        side_effects:
          - "proposed_delivery_date := payload proposed_delivery_date; compensation_variant := payload compensation_variant; days_late and compensation_cents recomputed; round_number += 1"
      - from: PROPOSED
        to: AGREED
        trigger: "POST /api/delivery-negotiations/{id}/agree"
        actor: Customer
        preconditions:
          - "DeliveryNegotiation.status == PROPOSED (Customer agrees to airframer proposal) or COUNTERED (DeliveryManager agrees to customer counter)"
        side_effects:
          - "aircraft.scheduled_delivery_date := proposed_delivery_date"
          - "compensation_cents locked at current value"
      - from: COUNTERED
        to: AGREED
        trigger: "POST /api/delivery-negotiations/{id}/agree"
        actor: DeliveryManager
        preconditions:
          - "DeliveryNegotiation.status == PROPOSED (Customer agrees) or COUNTERED (DeliveryManager agrees)"
        side_effects:
          - "aircraft.scheduled_delivery_date := proposed_delivery_date"
          - "compensation_cents locked at current value"
      - from: PROPOSED
        to: EXPIRED
        trigger: "system: counter attempt beyond round 6, or aircraft delivery_status flips to REJECTED"
        actor: system
        preconditions: []
        side_effects: []
      - from: COUNTERED
        to: EXPIRED
        trigger: "system: counter attempt beyond round 6, or aircraft delivery_status flips to REJECTED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AircraftUnit
    initial_state: IN_PRODUCTION
    terminal_states: [DELIVERED]
    transitions:
      - from: IN_PRODUCTION
        to: ASSEMBLY_COMPLETE
        trigger: "system: bubble-up when every WorkPackage of the aircraft reaches {COMPLETE, TRAVELED}"
        actor: system
        preconditions:
          - "count of aircraft WorkPackages >= 1 AND all in {COMPLETE, TRAVELED}"
        side_effects:
          - "program.undelivered_inventory_count recomputed"
      - from: ASSEMBLY_COMPLETE
        to: IN_STORAGE
        trigger: "POST /api/aircraft-units/{id}/storage-preservations"
        actor: DeliveryManager
        preconditions:
          - "production_status == ASSEMBLY_COMPLETE (this also structurally prevents a second ACTIVE storage record: creation always moves the aircraft to IN_STORAGE)"
        side_effects:
          - "program.undelivered_inventory_count recomputed"
      - from: ASSEMBLY_COMPLETE
        to: DELIVERED
        trigger: "POST /api/aircraft-units/{id}/accept-delivery"
        actor: Customer
        preconditions:
          - "production_status == ASSEMBLY_COMPLETE"
          - "delivery_status == WALKTHROUGH_PASSED"
          - "quality_status == CLEAR"
          - "no ReworkOrder of this aircraft in OPEN status"
          - "acting X-User-ID == aircraft.customer_id"
        side_effects:
          - "delivery_status := ACCEPTED"
          - "program.undelivered_inventory_count recomputed"
      - from: "delivery_status.NOT_STARTED"
        to: "delivery_status.FLIGHT_TESTING"
        trigger: "POST /api/aircraft-units/{id}/begin-delivery"
        actor: DeliveryManager
        preconditions:
          - "production_status == ASSEMBLY_COMPLETE"
          - "delivery_status in {NOT_STARTED, REJECTED}"
        side_effects: []
      - from: "delivery_status.REJECTED"
        to: "delivery_status.FLIGHT_TESTING"
        trigger: "POST /api/aircraft-units/{id}/begin-delivery (retry after rejection)"
        actor: DeliveryManager
        preconditions:
          - "production_status == ASSEMBLY_COMPLETE"
          - "delivery_status in {NOT_STARTED, REJECTED}"
          - "no ReworkOrder of this aircraft in OPEN status"
        side_effects: []
      - from: "delivery_status.FLIGHT_TESTING"
        to: "delivery_status.CONFIG_VERIFIED"
        trigger: "POST /api/aircraft-units/{id}/verify-configuration"
        actor: DeliveryManager
        preconditions:
          - "delivery_status == FLIGHT_TESTING"
          - "at least 1 FlightTest of the aircraft is COMPLETED and every COMPLETED FlightTest has outcome PASS (no SCHEDULED test may remain)"
          - "configuration_code == ordered_configuration_code"
        side_effects: []
      - from: "delivery_status.CONFIG_VERIFIED"
        to: "delivery_status.WALKTHROUGH_PASSED"
        trigger: "POST /api/aircraft-units/{id}/conduct-walkthrough with snag_count == 0"
        actor: Customer
        preconditions:
          - "delivery_status == CONFIG_VERIFIED"
          - "acting X-User-ID == aircraft.customer_id"
        side_effects: []
      - from: "delivery_status.CONFIG_VERIFIED"
        to: "delivery_status.REJECTED"
        trigger: "POST /api/aircraft-units/{id}/conduct-walkthrough with snag_count >= 1"
        actor: Customer
        preconditions:
          - "delivery_status == CONFIG_VERIFIED"
          - "acting X-User-ID == aircraft.customer_id"
        side_effects:
          - "creates ReworkOrder(source=WALKTHROUGH_SNAG, hours basis snag_count * 4)"
      - from: "delivery_status.FLIGHT_TESTING"
        to: "delivery_status.REJECTED"
        trigger: "POST /api/flight-tests/{id}/record-outcome with outcome FAIL"
        actor: DeliveryManager
        preconditions: []
        side_effects:
          - "creates ReworkOrder(source=FLIGHT_TEST_FAILURE)"
          - "live DeliveryNegotiations of the aircraft auto-EXPIRE"
      - from: "delivery_status.WALKTHROUGH_PASSED"
        to: "delivery_status.ACCEPTED"
        trigger: "POST /api/aircraft-units/{id}/accept-delivery"
        actor: Customer
        preconditions:
          - "production_status == ASSEMBLY_COMPLETE"
          - "quality_status == CLEAR"
          - "no ReworkOrder of this aircraft in OPEN status"
          - "acting X-User-ID == aircraft.customer_id"
        side_effects:
          - "production_status := DELIVERED"
      - from: "quality_status.CLEAR"
        to: "quality_status.HOLD"
        trigger: "POST /api/aircraft-units/{id}/quality-escapes (first open escape on the aircraft)"
        actor: QualityInspector
        preconditions: []
        side_effects: []
      - from: "quality_status.HOLD"
        to: "quality_status.CLEAR"
        trigger: "POST /api/quality-escapes/{id}/close (closing the aircraft's last non-CLOSED escape)"
        actor: QualityInspector
        preconditions: []
        side_effects: []
    note: "AircraftUnit carries three independent state dimensions: production_status, quality_status, and delivery_status; transitions above are prefixed with their dimension. The dimensions evolve independently except where preconditions cross dimensions (accept-delivery reads all three)."

concurrency_rules:
  - rule_id: rate-case-create-stale-program
    parent_entity: ProductionProgram
    write_endpoint: "POST /api/programs/{id}/rate-cases"
    occ_field: "expected_program_version"
    description: |
      Creating a RateCase against a ProductionProgram whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just announced or committed a rate decision (which
      legitimately supersedes the client's view of the program baseline) and the
      current writer's view of the program is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: negotiation-counter-stale-negotiation
    parent_entity: DeliveryNegotiation
    write_endpoint: "POST /api/delivery-negotiations/{id}/counter"
    occ_field: "expected_negotiation_version"
    description: |
      Countering a DeliveryNegotiation whose version has advanced since the
      client last observed it is rejected. This captures the case where the
      other party has just moved the negotiation to a new round and the current
      writer's view of the round and compensation basis is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: gating_readiness_index
    trigger: "On GET /api/programs/{id} (live, against current_rate_per_month) and on POST /api/rate-cases/{id}/request-gating-review (frozen snapshot, against proposed_rate)"
    algorithm: weighted_scoring
    formula: |
      supply_pct = 100 * count(distinct component_code of SupplierCapacityCommitment
                     where program_id == program AND status IN {CONFIRMED, ORDERED, AT_RISK}
                     AND committed_rate_per_month >= target_rate) / program.required_component_codes
      if program.required_component_codes == 0: supply_pct = 100
      supply_pct = min(100, supply_pct)
      workforce_pct = 100 * sum(hired_headcount over program WorkforcePlans)
                        / sum(required_headcount over program WorkforcePlans)
      if no WorkforcePlans or sum(required_headcount) == 0: workforce_pct = 100
      workforce_pct = min(100, workforce_pct)
      burden_penalty = min(20.0, 0.5 * program.traveled_work_open_hours)
      readiness_index = round_half_up(min(supply_pct, workforce_pct) - burden_penalty, 2)
      gating_verdict = PASS iff readiness_index >= 85.0 AND program.open_escape_count == 0 else FAIL
    input_set: "Commitments of the program in {CONFIRMED, ORDERED, AT_RISK}; all WorkforcePlans of the program; TRAVELED WorkPackages with unclosed rework; non-CLOSED QualityEscapes"
    constants:
      GATING_THRESHOLD_INDEX: 85.0
      BURDEN_PENALTY_PER_OPEN_HOUR: 0.5
      MAX_BURDEN_PENALTY: 20.0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: live_program_readiness
        when: "GET /api/programs/{id}"
        difference: "Evaluated against current_rate_per_month; reflects live entity state"
      - name: snapshot_case_readiness
        when: "request-gating-review"
        difference: "Evaluated against proposed_rate and frozen onto the RateCase; later entity changes do not move the snapshot"

  - name: traveled_work_cost
    trigger: "ReworkOrder creation (provisional) and POST /api/rework-orders/{id}/close (final)"
    algorithm: tiered_pricing
    formula: |
      provisional: estimated_cost_cents = round_half_up(hours_basis * PROVISIONAL_RATE_CENTS * source_multiplier)
        hours_basis = traveled_hours (TRAVELED_WORK) | estimated_hours payload (QUALITY_ESCAPE)
                      | rework_estimated_hours payload (FLIGHT_TEST_FAILURE) | snag_count * 4 (WALKTHROUGH_SNAG)
        source_multiplier = TRAVELED_WORK 1.0 | QUALITY_ESCAPE 1.5 | FLIGHT_TEST_FAILURE 1.25 | WALKTHROUGH_SNAG 1.0
      final: actual_cost_cents = round_half_up(actual_hours * ACTUAL_RATE_CENTS + parts_cents)
    input_set: "Single ReworkOrder"
    constants:
      PROVISIONAL_RATE_CENTS: 15000
      ACTUAL_RATE_CENTS: 17500
      SNAG_HOURS_EACH: 4
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: provisional_estimate
        when: "at ReworkOrder creation"
        difference: "Uses hourly basis * 15000 * source multiplier; ignores parts; stored on estimated_cost_cents"
      - name: final_actual
        when: "at ReworkOrder close"
        difference: "Uses actual_hours * 17500 + parts_cents; ignores the provisional estimate entirely; stored on actual_cost_cents; identical hours inputs therefore produce different totals than the provisional figure"

  - name: delay_compensation
    trigger: "DeliveryNegotiation creation and every counter"
    algorithm: tiered_pricing
    formula: |
      days_late = max(0, proposed_delivery_date - aircraft.contracted_delivery_date) in whole days
      CONTRACTUAL_LIQUIDATED: compensation_cents = min(days_late * LD_DAILY_CENTS, round_half_up(LD_CAP_PCT * aircraft.contract_price_cents))
      GOODWILL: compensation_cents = GOODWILL_BASE_CENTS + days_late * GOODWILL_DAILY_CENTS  (no cap)
    input_set: "Single DeliveryNegotiation round"
    constants:
      LD_DAILY_CENTS: 250000
      LD_CAP_PCT: 0.10
      GOODWILL_BASE_CENTS: 1000000
      GOODWILL_DAILY_CENTS: 100000
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: contractual_liquidated
        when: "compensation_variant == CONTRACTUAL_LIQUIDATED"
        difference: "Pure per-diem 250000 cents/day, capped at 10 percent of contract_price_cents"
      - name: goodwill
        when: "compensation_variant == GOODWILL (requires customer credit_standing == GOOD)"
        difference: "Flat 1000000 base + 100000 cents/day, uncapped; identical days_late therefore yields a different amount than the contractual variant"

  - name: storage_preservation_fee
    trigger: "On GET /api/programs/{id}: storage_fees_accrued_cents"
    algorithm: aggregation
    formula: |
      For each StoragePreservation with status ACTIVE:
        days_elapsed = floor((logical_clock - window_start) / 86400 seconds); floor at 0
        fee_i = round_half_up(days_elapsed * daily_rate_cents * 0.95)   # round PER AIRCRAFT first
      storage_fees_accrued_cents = sum(fee_i)                            # then SUM the rounded values
      Rounding order is pinned: per-aircraft rounding BEFORE the program-level sum.
      (Sum-then-round of the raw values yields a different cent total and is incorrect.)
    input_set: "StoragePreservations with status ACTIVE only; RELEASED excluded"
    constants:
      VOLUME_DISCOUNT_FACTOR: 0.95
    precision: "0 decimal places per aircraft (integer cents), round_half_up, applied per aircraft before summation"

  - name: cancellation_reserve
    trigger: "Recomputed whenever a commitment flips status (place-order, AT_RISK cascade, cancel, recovery)"
    algorithm: aggregation
    formula: |
      reserve = sum over program commitments in AT_RISK of round_half_up(0.30 * active_ordered_quantity * unit_price_cents)
              + sum over program commitments in CANCELLED of cancellation_penalty_cents
    input_set: "Commitments of the program in {AT_RISK, CANCELLED}; CONFIRMED and ORDERED contribute 0"
    constants:
      CANCELLATION_PENALTY_PCT: 0.30
    precision: "0 decimal places (integer cents), round_half_up per commitment before summation"

  - name: posture_derivation
    trigger: "Recomputed on GET /api/programs/{id} and after any transition mutating escapes, traveled work, workforce, or commitments"
    algorithm: threshold
    formula: |
      if readiness_index < 60.0 OR any CRITICAL QualityEscape of program aircraft in {OPEN, ROOT_CAUSE, DISPOSITIONED}
         OR open_escape_count >= 3 OR any SupplierCapacityCommitment of the program in AT_RISK:
        posture = DISTRESSED
      elif readiness_index >= 85.0 AND open_escape_count == 0:
        posture = STABLE
      else:
        posture = STABILIZING
    input_set: "program readiness_index, open_escape_count, escape severities"
    constants:
      DISTRESS_INDEX_FLOOR: 60.0
      STABLE_INDEX_FLOOR: 85.0
      DISTRESS_OPEN_ESCAPE_COUNT: 3
    precision: "thresholds compared at 2-decimal precision"

validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is in the endpoint's roles list; entity-backed ownership: SupplierManager X-User-ID must equal the Supplier id on supplier-scoped writes; Customer X-User-ID must equal the aircraft's customer_id on customer-scoped writes", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path resources exist, validated left-to-right (program, then supplier/customer/aircraft, then child)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "OCC: expected_program_version / expected_negotiation_version must equal the parent's current version (evaluated after the parent resource is loaded, before all state and business checks on the guarded endpoint)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /api/programs/{id}/rate-cases", "POST /api/delivery-negotiations/{id}/counter"] }
  - { priority: 5, category: state, check: "Target resource is in a state from which the requested transition exists (includes terminal-state lockdown and delivery-pipeline gates)", error_id: ERR_INVALID_TRANSITION, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5, category: state, check: "Flight-test creation requires aircraft.quality_status == CLEAR", error_id: ERR_QUALITY_HOLD, http_status: 409, applies_to: ["POST /api/aircraft-units/{id}/flight-tests"] }
  - { priority: 5, category: state, check: "Storage release and accept-delivery require no OPEN ReworkOrder on the aircraft", error_id: ERR_REWORK_ORDERS_OPEN, http_status: 409, applies_to: ["POST /api/storage-preservations/{id}/release", "POST /api/aircraft-units/{id}/accept-delivery"] }
  - { priority: 6, category: business_safety, check: "begin-root-cause requires regulator_notified_at set", error_id: ERR_REGULATOR_NOTIFICATION_REQUIRED, http_status: 422, applies_to: ["POST /api/quality-escapes/{id}/begin-root-cause"] }
  - { priority: 6, category: business_safety, check: "disposition actor X-User-ID must differ from escape.reported_by_id (segregation of duties)", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: ["POST /api/quality-escapes/{id}/disposition"] }
  - { priority: 7, category: business_temporal, check: "window_end strictly after window_start; rate-case effective_month not earlier than the current logical month", error_id: ERR_WINDOW_INVALID, http_status: 422, applies_to: ["POST /api/aircraft-units/{id}/flight-tests", "POST /api/aircraft-units/{id}/storage-preservations", "POST /api/programs/{id}/rate-cases"] }
  - { priority: 7, category: business_temporal, check: "place-order required_by_month must be at least commitment.lead_time_months calendar months after the current logical month", error_id: ERR_LEAD_TIME_VIOLATION, http_status: 422, applies_to: ["POST /api/capacity-commitments/{id}/place-order"] }
  - { priority: 8, category: business_constraint, check: "Flight-test half-open window [window_start, window_end) on the same range_code must not intersect any other SCHEDULED test; adjacency (new.start == existing.window_end or new.end == existing.window_start) is allowed", error_id: ERR_RANGE_WINDOW_OVERLAP, http_status: 409, applies_to: ["POST /api/aircraft-units/{id}/flight-tests"] }
  - { priority: 8, category: business_constraint, check: "Storage closed window plus a 2-day turnaround buffer on the same bay_code must not intersect any other ACTIVE preservation: conflict iff new.window_start <= existing.window_end + 2 days AND existing.window_start <= new.window_end + 2 days", error_id: ERR_BAY_WINDOW_OVERLAP, http_status: 409, applies_to: ["POST /api/aircraft-units/{id}/storage-preservations"] }
  - { priority: 8, category: business_constraint, check: "verify-configuration requires configuration_code == ordered_configuration_code", error_id: ERR_CONFIGURATION_MISMATCH, http_status: 422, applies_to: ["POST /api/aircraft-units/{id}/verify-configuration"] }
  - { priority: 8, category: business_constraint, check: "RateCase proposed_rate must differ from program.current_rate_per_month", error_id: ERR_RATE_UNCHANGED, http_status: 422, applies_to: ["POST /api/programs/{id}/rate-cases"] }
  - { priority: 8, category: business_constraint, check: "RateCase commit requires gating_verdict == PASS", error_id: ERR_GATING_CRITERIA_UNMET, http_status: 422, applies_to: ["POST /api/rate-cases/{id}/commit"] }
  - { priority: 8, category: business_constraint, check: "Negotiation counter/agree actor must match the alternating turn (PROPOSED awaits Customer, COUNTERED awaits DeliveryManager)", error_id: ERR_NEGOTIATION_ACTOR_TURN, http_status: 403, applies_to: ["POST /api/delivery-negotiations/{id}/counter", "POST /api/delivery-negotiations/{id}/agree"] }
  - { priority: 8, category: business_constraint, check: "counter when round_number == 6 does not advance the round; the negotiation auto-transitions to EXPIRED", error_id: ERR_NEGOTIATION_ROUND_LIMIT, http_status: 422, applies_to: ["POST /api/delivery-negotiations/{id}/counter"] }
  - { priority: 8, category: business_constraint, check: "GOODWILL compensation variant requires the aircraft customer's credit_standing == GOOD", error_id: ERR_GOODWILL_REQUIRES_GOOD_CREDIT, http_status: 422, applies_to: ["POST /api/aircraft-units/{id}/delivery-negotiations", "POST /api/delivery-negotiations/{id}/counter"] }
  - { priority: 8, category: business_constraint, check: "Uniqueness: model_code per program, supplier_code per supplier, airline_code per customer, skill_code per program, line_number per program", error_id: ERR_DUPLICATE_CODE, http_status: 409, applies_to: ["POST /api/programs", "POST /api/suppliers", "POST /api/customers", "POST /api/programs/{id}/workforce-plans", "POST /api/programs/{id}/aircraft-units"] }
  - { priority: 9, category: business_fiscal, check: "place-order quantity must be >= 1 and <= committed_rate_per_month * lead_time_months", error_id: ERR_ORDER_EXCEEDS_COMMITMENT, http_status: 422, applies_to: ["POST /api/capacity-commitments/{id}/place-order"] }
  - { priority: 9, category: business_fiscal, check: "hire count must be >= 1 and hired_headcount + count <= required_headcount", error_id: ERR_HIRE_EXCEEDS_REQUIRED, http_status: 422, applies_to: ["POST /api/workforce-plans/{id}/hire"] }
  - { priority: 9, category: business_fiscal, check: "rework close: program.rework_budget_consumed_cents + final actual_cost_cents <= program.rework_budget_total_cents", error_id: ERR_BUDGET_EXCEEDED, http_status: 422, applies_to: ["POST /api/rework-orders/{id}/close"] }
  - { priority: 9, category: business_fiscal, check: "cancel_quantity, when provided, must equal active_ordered_quantity exactly (all-or-nothing cancel); CONFIRMED commitments have active_ordered_quantity == 0", error_id: ERR_CANCEL_QUANTITY_INVALID, http_status: 422, applies_to: ["POST /api/capacity-commitments/{id}/cancel"] }
  - { priority: 10, category: business_constraint, check: "Request-body field presence, types, enum membership, and integer lower bounds", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }

endpoints:
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Test-driving endpoint: sets the server's logical clock. Startup default is exactly 2026-09-01T00:00:00Z; before any call the logical clock reads this default and never falls back to wall-clock time.", roles: [ProgramAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["recomputes is_overdue on ACTIVE StoragePreservations and all clock-dependent computed fields"] }

  - { method: POST, path: "/api/programs", description: "Create a production program", roles: [ProgramAdmin], code: 201, input: [model_code, current_rate_per_month, required_component_codes, rework_budget_total_cents], output: ProductionProgram, side_effects: [] }
  - { method: GET, path: "/api/programs/{id}", description: "Read program with live computed posture, readiness_index, reserve, fees, and counters", roles: [ProgramAdmin, ProductionPlanner, LineManager, QualityInspector, DeliveryManager, SupplierManager, Customer], code: 200, input: [], output: ProductionProgram, side_effects: ["recomputes gating_readiness_index (live variant), cancellation_reserve, storage_preservation_fee, posture"] }
  - { method: POST, path: "/api/programs/{id}/rate-cases", description: "Create a rate decision case (DRAFT) against the program; OCC-guarded on program version", roles: [ProductionPlanner], code: 201, input: [proposed_rate, effective_month, demand_backlog_units, expected_program_version], output: RateCase, side_effects: ["increments ProductionProgram.version by 1"] }
  - { method: GET, path: "/api/programs/{id}/rate-cases", description: "List rate cases of a program", roles: [ProgramAdmin, ProductionPlanner], code: 200, input: ["status?", "limit?", "offset?"], output: "RateCase[]", side_effects: [] }
  - { method: POST, path: "/api/rate-cases/{id}/announce", description: "Announce the target rate (DRAFT -> ANNOUNCED)", roles: [ProductionPlanner], code: 200, input: [], output: RateCase, side_effects: ["program.announced_target_rate := proposed_rate", "increments ProductionProgram.version by 1"] }
  - { method: POST, path: "/api/rate-cases/{id}/request-gating-review", description: "Freeze gating snapshots and verdict (ANNOUNCED -> GATED_REVIEW)", roles: [ProductionPlanner], code: 200, input: [], output: RateCase, side_effects: ["freezes readiness snapshots against proposed_rate", "sets gating_verdict per gating_readiness_index"] }
  - { method: POST, path: "/api/rate-cases/{id}/commit", description: "Commit the rate (GATED_REVIEW -> COMMITTED); runs the AT_RISK -> reserve -> posture -> auto-shelve cascade", roles: [ProductionPlanner], code: 200, input: [], output: RateCase, side_effects: ["program.current_rate_per_month := proposed_rate", "increments ProductionProgram.version by 1", "commitment AT_RISK / recovery cascade", "cancellation_reserve recompute", "posture recompute; on DISTRESSED auto-shelves other GATED_REVIEW cases"] }
  - { method: POST, path: "/api/rate-cases/{id}/shelve", description: "Shelve the case (DRAFT/ANNOUNCED/GATED_REVIEW -> SHELVED); announced target falls back", roles: [ProductionPlanner], code: 200, input: [], output: RateCase, side_effects: ["program.announced_target_rate recomputed"] }

  - { method: POST, path: "/api/suppliers", description: "Register a supplier", roles: [ProgramAdmin], code: 201, input: [supplier_code, name, region], output: Supplier, side_effects: [] }
  - { method: GET, path: "/api/suppliers/{id}", description: "Read supplier", roles: [ProgramAdmin, ProductionPlanner, LineManager, QualityInspector, DeliveryManager, SupplierManager, Customer], code: 200, input: [], output: Supplier, side_effects: [] }
  - { method: POST, path: "/api/suppliers/{id}/capacity-commitments", description: "Supplier commits capacity for a component family (DRAFT); acting SupplierManager must be this supplier", roles: [SupplierManager], code: 201, input: [program_id, component_code, committed_rate_per_month, lead_time_months, unit_price_cents], output: SupplierCapacityCommitment, side_effects: [] }
  - { method: GET, path: "/api/suppliers/{id}/capacity-commitments", description: "List commitments of a supplier", roles: [ProgramAdmin, ProductionPlanner, SupplierManager], code: 200, input: ["status?", "limit?", "offset?"], output: "SupplierCapacityCommitment[]", side_effects: [] }
  - { method: GET, path: "/api/programs/{id}/capacity-commitments", description: "List commitments covering a program", roles: [ProgramAdmin, ProductionPlanner, SupplierManager], code: 200, input: ["status?", "component_code?", "limit?", "offset?"], output: "SupplierCapacityCommitment[]", side_effects: [] }
  - { method: POST, path: "/api/capacity-commitments/{id}/confirm", description: "Confirm commitment (DRAFT -> CONFIRMED)", roles: [SupplierManager], code: 200, input: [], output: SupplierCapacityCommitment, side_effects: [] }
  - { method: POST, path: "/api/capacity-commitments/{id}/place-order", description: "Place a long-lead order against an assumed rate (CONFIRMED/ORDERED/AT_RISK -> ORDERED)", roles: [SupplierManager], code: 200, input: [quantity, assumed_rate_per_month, required_by_month], output: SupplierCapacityCommitment, side_effects: ["ordered_quantity += quantity", "assumed_rate_at_order := assumed_rate_per_month"] }
  - { method: POST, path: "/api/capacity-commitments/{id}/cancel", description: "Cancel the commitment all-or-nothing with penalty (CONFIRMED/ORDERED/AT_RISK -> CANCELLED)", roles: [SupplierManager], code: 200, input: ["cancel_quantity?"], output: SupplierCapacityCommitment, side_effects: ["cancelled_quantity += cancel_quantity", "cancellation_penalty_cents computed", "program.cancellation_reserve_cents recomputed"] }

  - { method: POST, path: "/api/programs/{id}/workforce-plans", description: "Create a workforce hiring plan for a skill", roles: [ProductionPlanner], code: 201, input: [skill_code, required_headcount], output: WorkforcePlan, side_effects: [] }
  - { method: GET, path: "/api/programs/{id}/workforce-plans", description: "List workforce plans of a program", roles: [ProgramAdmin, ProductionPlanner], code: 200, input: ["limit?", "offset?"], output: "WorkforcePlan[]", side_effects: [] }
  - { method: POST, path: "/api/workforce-plans/{id}/hire", description: "Record hires into the plan; hired_headcount + count must not exceed required_headcount", roles: [ProductionPlanner], code: 200, input: [count], output: WorkforcePlan, side_effects: ["hired_headcount += count"] }

  - { method: POST, path: "/api/customers", description: "Register a customer airline", roles: [ProgramAdmin], code: 201, input: [airline_code, name, credit_standing], output: Customer, side_effects: [] }
  - { method: GET, path: "/api/customers/{id}", description: "Read customer", roles: [ProgramAdmin, ProductionPlanner, LineManager, QualityInspector, DeliveryManager, SupplierManager, Customer], code: 200, input: [], output: Customer, side_effects: [] }

  - { method: POST, path: "/api/programs/{id}/aircraft-units", description: "Add an aircraft unit to the line", roles: [ProductionPlanner], code: 201, input: [customer_id, line_number, configuration_code, ordered_configuration_code, contract_price_cents, contracted_delivery_date], output: AircraftUnit, side_effects: [] }
  - { method: GET, path: "/api/aircraft-units/{id}", description: "Read aircraft with all three state dimensions", roles: [ProgramAdmin, ProductionPlanner, LineManager, QualityInspector, DeliveryManager, SupplierManager, Customer], code: 200, input: [], output: AircraftUnit, side_effects: [] }
  - { method: GET, path: "/api/programs/{id}/aircraft-units", description: "List aircraft of a program", roles: [ProgramAdmin, ProductionPlanner, LineManager, QualityInspector, DeliveryManager], code: 200, input: ["production_status?", "limit?", "offset?"], output: "AircraftUnit[]", side_effects: [] }
  - { method: GET, path: "/api/customers/{id}/aircraft-units", description: "List aircraft of a customer", roles: [ProgramAdmin, DeliveryManager, Customer], code: 200, input: ["production_status?", "limit?", "offset?"], output: "AircraftUnit[]", side_effects: [] }

  - { method: POST, path: "/api/aircraft-units/{id}/work-packages", description: "Add a station job to an aircraft", roles: [LineManager], code: 201, input: [station_sequence, description, planned_hours], output: WorkPackage, side_effects: [] }
  - { method: GET, path: "/api/aircraft-units/{id}/work-packages", description: "List work packages of an aircraft", roles: [ProgramAdmin, ProductionPlanner, LineManager], code: 200, input: ["status?", "limit?", "offset?"], output: "WorkPackage[]", side_effects: [] }
  - { method: GET, path: "/api/work-packages/{id}", description: "Read a work package", roles: [ProgramAdmin, ProductionPlanner, LineManager], code: 200, input: [], output: WorkPackage, side_effects: [] }
  - { method: POST, path: "/api/work-packages/{id}/complete", description: "Complete the job (OPEN -> COMPLETE); may bubble aircraft to ASSEMBLY_COMPLETE", roles: [LineManager], code: 200, input: [], output: WorkPackage, side_effects: ["aircraft production_status bubble-up when all packages in {COMPLETE, TRAVELED}"] }
  - { method: POST, path: "/api/work-packages/{id}/travel", description: "Mark incomplete job as traveled down the line (OPEN -> TRAVELED); creates a TRAVELED_WORK ReworkOrder", roles: [LineManager], code: 200, input: [traveled_hours], output: WorkPackage, side_effects: ["creates ReworkOrder(source=TRAVELED_WORK) with provisional estimated_cost_cents", "program.traveled_work_open_hours recomputed", "aircraft production_status bubble-up when all packages in {COMPLETE, TRAVELED}"] }

  - { method: POST, path: "/api/quality-escapes/{id}/rework-orders", description: "Open an escape-driven rework order (source=QUALITY_ESCAPE)", roles: [QualityInspector], code: 201, input: [estimated_hours], output: ReworkOrder, side_effects: ["estimated_cost_cents per provisional variant with multiplier 1.5"] }
  - { method: GET, path: "/api/aircraft-units/{id}/rework-orders", description: "List rework orders of an aircraft", roles: [ProgramAdmin, ProductionPlanner, LineManager, QualityInspector, DeliveryManager], code: 200, input: ["source?", "status?", "limit?", "offset?"], output: "ReworkOrder[]", side_effects: [] }
  - { method: GET, path: "/api/work-packages/{id}/rework-orders", description: "List rework orders spawned by a work package", roles: [ProgramAdmin, LineManager], code: 200, input: ["limit?", "offset?"], output: "ReworkOrder[]", side_effects: [] }
  - { method: GET, path: "/api/quality-escapes/{id}/rework-orders", description: "List rework orders spawned by an escape", roles: [ProgramAdmin, QualityInspector], code: 200, input: ["limit?", "offset?"], output: "ReworkOrder[]", side_effects: [] }
  - { method: POST, path: "/api/rework-orders/{id}/close", description: "Close rework with actuals (OPEN -> CLOSED); computes final cost and debits the program budget", roles: [LineManager], code: 200, input: [actual_hours, parts_cents], output: ReworkOrder, side_effects: ["actual_cost_cents per final variant", "program.rework_budget_consumed_cents recomputed", "aircraft.rework_cost_total_cents recomputed"] }
  - { method: POST, path: "/api/rework-orders/{id}/credit", description: "Reverse a closed rework charge (CLOSED -> CREDITED); compensating action restores budget", roles: [LineManager], code: 200, input: [], output: ReworkOrder, side_effects: ["program.rework_budget_consumed_cents recomputed excluding this order", "aircraft.rework_cost_total_cents recomputed"] }

  - { method: POST, path: "/api/aircraft-units/{id}/quality-escapes", description: "Report a quality escape; puts the aircraft on quality HOLD", roles: [QualityInspector], code: 201, input: [severity, description], output: QualityEscape, side_effects: ["aircraft.quality_status := HOLD", "program.open_escape_count recomputed", "program.posture recomputed"] }
  - { method: GET, path: "/api/quality-escapes/{id}", description: "Read escape", roles: [ProgramAdmin, QualityInspector, DeliveryManager, ProductionPlanner], code: 200, input: [], output: QualityEscape, side_effects: [] }
  - { method: GET, path: "/api/aircraft-units/{id}/quality-escapes", description: "List escapes of an aircraft", roles: [ProgramAdmin, QualityInspector, DeliveryManager, ProductionPlanner], code: 200, input: ["status?", "limit?", "offset?"], output: "QualityEscape[]", side_effects: [] }
  - { method: POST, path: "/api/quality-escapes/{id}/notify-regulator", description: "Stamp regulator notification at the logical clock; sets is_late_notification when past created_at + 24h", roles: [QualityInspector], code: 200, input: [], output: QualityEscape, side_effects: ["regulator_notified_at := logical clock", "is_late_notification computed"] }
  - { method: POST, path: "/api/quality-escapes/{id}/begin-root-cause", description: "Attach conformance documentation and open root-cause work (OPEN -> ROOT_CAUSE)", roles: [QualityInspector], code: 200, input: [conformance_refs], output: QualityEscape, side_effects: ["conformance_documented := true", "conformance_refs appended"] }
  - { method: POST, path: "/api/quality-escapes/{id}/disposition", description: "Disposition the escape (ROOT_CAUSE -> DISPOSITIONED); actor must differ from reporter", roles: [QualityInspector], code: 200, input: [disposition_code], output: QualityEscape, side_effects: ["dispositioned_by_id := actor", "disposition_code := payload"] }
  - { method: POST, path: "/api/quality-escapes/{id}/reopen", description: "Reopen a dispositioned escape (DISPOSITIONED -> ROOT_CAUSE)", roles: [QualityInspector], code: 200, input: [], output: QualityEscape, side_effects: ["dispositioned_by_id := null", "disposition_code := null"] }
  - { method: POST, path: "/api/quality-escapes/{id}/close", description: "Close the escape (DISPOSITIONED -> CLOSED); requires escape-linked rework resolved", roles: [QualityInspector], code: 200, input: [], output: QualityEscape, side_effects: ["program.open_escape_count recomputed", "aircraft.quality_status may return to CLEAR", "program.posture recomputed"] }

  - { method: POST, path: "/api/aircraft-units/{id}/flight-tests", description: "Schedule a flight test window on a range (aircraft must be in FLIGHT_TESTING, quality CLEAR); half-open overlap rules per range", roles: [DeliveryManager], code: 201, input: [range_code, window_start, window_end], output: FlightTest, side_effects: [] }
  - { method: GET, path: "/api/aircraft-units/{id}/flight-tests", description: "List flight tests of an aircraft", roles: [ProgramAdmin, DeliveryManager, Customer], code: 200, input: ["status?", "limit?", "offset?"], output: "FlightTest[]", side_effects: [] }
  - { method: POST, path: "/api/flight-tests/{id}/record-outcome", description: "Record PASS/FAIL (SCHEDULED -> COMPLETED); FAIL rejects delivery and spawns rework and expires live negotiations", roles: [DeliveryManager], code: 200, input: [outcome, "rework_estimated_hours?"], output: FlightTest, side_effects: ["on FAIL: aircraft.delivery_status := REJECTED", "on FAIL: creates ReworkOrder(source=FLIGHT_TEST_FAILURE)", "on FAIL: live negotiations of the aircraft auto-EXPIRE"] }

  - { method: POST, path: "/api/aircraft-units/{id}/begin-delivery", description: "Open the delivery acceptance pipeline (delivery_status NOT_STARTED or REJECTED -> FLIGHT_TESTING)", roles: [DeliveryManager], code: 200, input: [], output: AircraftUnit, side_effects: [] }
  - { method: POST, path: "/api/aircraft-units/{id}/verify-configuration", description: "Verify as-built vs contracted configuration and flight-test record (FLIGHT_TESTING -> CONFIG_VERIFIED)", roles: [DeliveryManager], code: 200, input: [], output: AircraftUnit, side_effects: [] }
  - { method: POST, path: "/api/aircraft-units/{id}/conduct-walkthrough", description: "Customer walkthrough; snag_count 0 passes (CONFIG_VERIFIED -> WALKTHROUGH_PASSED), else REJECTED with a WALKTHROUGH_SNAG rework order", roles: [Customer], code: 200, input: [snag_count], output: AircraftUnit, side_effects: ["on snag_count > 0: delivery_status := REJECTED and creates ReworkOrder(source=WALKTHROUGH_SNAG, hours basis snag_count * 4)"] }
  - { method: POST, path: "/api/aircraft-units/{id}/accept-delivery", description: "Customer accepts delivery (WALKTHROUGH_PASSED -> ACCEPTED; production -> DELIVERED)", roles: [Customer], code: 200, input: [], output: AircraftUnit, side_effects: ["production_status := DELIVERED", "program.undelivered_inventory_count recomputed"] }

  - { method: POST, path: "/api/aircraft-units/{id}/storage-preservations", description: "Move an ASSEMBLY_COMPLETE aircraft into a storage bay with preservation cycle; bay overlap uses closed intervals plus 2-day turnaround buffer", roles: [DeliveryManager], code: 201, input: [bay_code, window_start, window_end, daily_rate_cents, preservation_cycle_days], output: StoragePreservation, side_effects: ["aircraft.production_status := IN_STORAGE", "program.undelivered_inventory_count recomputed"] }
  - { method: GET, path: "/api/aircraft-units/{id}/storage-preservations", description: "List storage records of an aircraft", roles: [ProgramAdmin, DeliveryManager], code: 200, input: ["status?", "limit?", "offset?"], output: "StoragePreservation[]", side_effects: [] }
  - { method: POST, path: "/api/storage-preservations/{id}/maintain", description: "Perform preservation maintenance; resets last_preserved_at to the logical clock", roles: [DeliveryManager], code: 200, input: [], output: StoragePreservation, side_effects: ["last_preserved_at := logical clock", "next_preservation_due and is_overdue recomputed"] }
  - { method: POST, path: "/api/storage-preservations/{id}/release", description: "Release aircraft from storage (ACTIVE -> RELEASED); blocked while rework is open", roles: [DeliveryManager], code: 200, input: [], output: StoragePreservation, side_effects: ["aircraft.production_status := ASSEMBLY_COMPLETE", "program.undelivered_inventory_count recomputed"] }

  - { method: POST, path: "/api/aircraft-units/{id}/delivery-negotiations", description: "Open a delivery-schedule negotiation with the customer (round 1, PROPOSED by the airframer)", roles: [DeliveryManager], code: 201, input: [proposed_delivery_date, compensation_variant], output: DeliveryNegotiation, side_effects: ["days_late and compensation_cents computed for round 1"] }
  - { method: GET, path: "/api/aircraft-units/{id}/delivery-negotiations", description: "List negotiations of an aircraft", roles: [ProgramAdmin, DeliveryManager, Customer], code: 200, input: ["status?", "limit?", "offset?"], output: "DeliveryNegotiation[]", side_effects: [] }
  - { method: POST, path: "/api/delivery-negotiations/{id}/counter", description: "Counter-propose (PROPOSED <-> COUNTERED cycle); OCC-guarded on negotiation version; round 6 overflow auto-expires", roles: [DeliveryManager, Customer], code: 200, input: [proposed_delivery_date, compensation_variant, expected_negotiation_version], output: DeliveryNegotiation, side_effects: ["round_number += 1", "days_late and compensation_cents recomputed", "increments DeliveryNegotiation.version by 1"] }
  - { method: POST, path: "/api/delivery-negotiations/{id}/agree", description: "Agree to the standing proposal (-> AGREED); locks compensation and writes aircraft.scheduled_delivery_date", roles: [DeliveryManager, Customer], code: 200, input: [], output: DeliveryNegotiation, side_effects: ["aircraft.scheduled_delivery_date := proposed_delivery_date"] }

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role or X-User-ID header, or undeclared role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in endpoint roles, or entity-backed ownership mismatch (SupplierManager != supplier id; Customer != aircraft customer_id)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Any path resource id does not exist (validated left-to-right)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_program_version / expected_negotiation_version does not equal the parent entity's current version" }
  - { id: ERR_INVALID_TRANSITION, http: 409, condition: "Requested action has no transition from the resource's current state, including terminal-state lockdown and delivery-pipeline stage gates" }
  - { id: ERR_QUALITY_HOLD, http: 409, condition: "Flight-test creation while aircraft.quality_status == HOLD" }
  - { id: ERR_REWORK_ORDERS_OPEN, http: 409, condition: "Storage release or accept-delivery while an OPEN ReworkOrder exists on the aircraft" }
  - { id: ERR_REGULATOR_NOTIFICATION_REQUIRED, http: 422, condition: "begin-root-cause before notify-regulator has been recorded" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "disposition attempted by the same X-User-ID that reported the escape" }
  - { id: ERR_WINDOW_INVALID, http: 422, condition: "window_end <= window_start, or rate-case effective_month earlier than the current logical month" }
  - { id: ERR_LEAD_TIME_VIOLATION, http: 422, condition: "place-order required_by_month earlier than current logical month + lead_time_months" }
  - { id: ERR_RANGE_WINDOW_OVERLAP, http: 409, condition: "Flight-test half-open window intersects another SCHEDULED test on the same range_code" }
  - { id: ERR_BAY_WINDOW_OVERLAP, http: 409, condition: "Storage closed window plus 2-day turnaround buffer intersects another ACTIVE preservation on the same bay_code" }
  - { id: ERR_CONFIGURATION_MISMATCH, http: 422, condition: "verify-configuration with configuration_code != ordered_configuration_code" }
  - { id: ERR_RATE_UNCHANGED, http: 422, condition: "RateCase proposed_rate equals program.current_rate_per_month" }
  - { id: ERR_GATING_CRITERIA_UNMET, http: 422, condition: "RateCase commit while gating_verdict != PASS" }
  - { id: ERR_NEGOTIATION_ACTOR_TURN, http: 403, condition: "counter/agree by the role whose turn it is not (PROPOSED awaits Customer; COUNTERED awaits DeliveryManager)" }
  - { id: ERR_NEGOTIATION_ROUND_LIMIT, http: 422, condition: "counter attempted at round_number == 6; negotiation auto-expires" }
  - { id: ERR_GOODWILL_REQUIRES_GOOD_CREDIT, http: 422, condition: "GOODWILL variant for a customer whose credit_standing != GOOD" }
  - { id: ERR_ORDER_EXCEEDS_COMMITMENT, http: 422, condition: "place-order quantity outside 1..committed_rate_per_month*lead_time_months" }
  - { id: ERR_HIRE_EXCEEDS_REQUIRED, http: 422, condition: "hire count < 1 or hired_headcount + count > required_headcount" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "rework close would push rework_budget_consumed_cents above rework_budget_total_cents" }
  - { id: ERR_CANCEL_QUANTITY_INVALID, http: 422, condition: "cancel_quantity provided but not equal to active_ordered_quantity" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "Uniqueness violation on model_code / supplier_code / airline_code / (program, skill_code) / (program, line_number)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, unknown enum member, or integer bound violation in the request body" }

roles:
  - name: ProgramAdmin
    description: "Platform operator; registers programs, suppliers, customers; drives the test clock"
    identity: opaque
    exclusive_operations: ["POST /api/programs", "POST /api/suppliers", "POST /api/customers", "POST /api/_clock/set_current_utc"]
    shared_operations: ["GET endpoints"]
  - name: ProductionPlanner
    description: "Owns rate decisions, workforce plans, and aircraft line assignment"
    identity: opaque
    exclusive_operations: ["rate-case create/announce/request-gating-review/commit/shelve", "workforce plan create/hire", "POST /api/programs/{id}/aircraft-units"]
    shared_operations: ["GET endpoints"]
  - name: SupplierManager
    description: "Acts as a specific supplier; commits capacity and manages long-lead orders"
    identity: "entity_backed:Supplier"
    exclusive_operations: ["capacity-commitment create/confirm/place-order/cancel"]
    shared_operations: ["GET endpoints"]
  - name: LineManager
    description: "Runs the production line; completes or travels work packages and closes or credits rework"
    identity: opaque
    exclusive_operations: ["work-package create/complete/travel", "rework-order close/credit"]
    shared_operations: ["GET endpoints"]
  - name: QualityInspector
    description: "Reports and investigates quality escapes; disposition is segregated from reporting by X-User-ID"
    identity: opaque
    exclusive_operations: ["quality-escape create/notify-regulator/begin-root-cause/disposition/reopen/close", "POST /api/quality-escapes/{id}/rework-orders"]
    shared_operations: ["GET endpoints"]
  - name: DeliveryManager
    description: "Runs flight tests, storage, delivery pipeline start/config, and airframer side of negotiations"
    identity: opaque
    exclusive_operations: ["flight-test create/record-outcome", "storage-preservation create/maintain/release", "begin-delivery", "verify-configuration", "delivery-negotiation create"]
    shared_operations: ["GET endpoints", "delivery-negotiation counter/agree (with Customer)"]
  - name: Customer
    description: "Acts as a specific customer airline; walkthrough, delivery acceptance, and customer side of negotiations"
    identity: "entity_backed:Customer"
    exclusive_operations: ["conduct-walkthrough", "accept-delivery"]
    shared_operations: ["GET endpoints", "delivery-negotiation counter/agree (with DeliveryManager)"]
