            - call: "GET /grower-payments"
              payload: { credit_batch_id: "${cb1_id}" }
              as: ProgramAdmin
              captures: { pay1_id: "$.data[0].id" }
          trigger:
            - call: "POST /credit-batches/${cb1_id}/cancel"
              payload: { cancellation_reason: "double-counted parcel discovered in the registry reconciliation", expected_credit_batch_version: "${cb1_version}" }
              as: RegistryOfficer
          assert:
            - "response.status == 200"
            - "CreditBatch.${cb1_id}.issuance_status == CANCELLED and registry_status is STILL UNLISTED (cancellation does not touch the registry axis)"
            - "compensated: BufferAccount released_total == 51, balance_credits == 0, outstanding_issued_credits == 0, required_reserve_credits == 0, pool_status == HEALTHY"
            - "compensated: Enrollment.${e1_id}.credits_issued_total == 0 and accrued_payment_cents == 0"
            - "compensated: GrowerPayment.${pay1_id}.status == VOID (VOID, not CLAWED_BACK - no cash moved)"
            - "NOT compensated: BufferAccount next_serial_number == 233 (serials are never reused)"
            - "NOT compensated: BufferAccount contributed_total == 51 (a lifetime figure) so balance == contributed - drawn - released == 51 - 0 - 51 == 0"
            - "NOT compensated: Grower.${g1_id}.lifetime_credits_issued == 232 (counts batches later cancelled)"
            - "CreditBatch.${cb1_id}.issued_credits is STILL 232 and serial_start/serial_end are STILL 1/232 (the batch record is preserved for audit)"
            - "QuantificationRun.${r1_id}.status is STILL ISSUED"
            - "re-issuing the same run is refused with ERR_INVALID_STATE_TRANSITION, so the serial counter stays at 233"

      - name: termination_conserves_acres_and_cents_across_void_and_exit_fee
        grounds:
          - state_machines.Enrollment.EXIT_REQUESTED_to_TERMINATED
          - calculations.contract_exit_fee
          - state_machines.GrowerPayment.ACCRUED_to_VOID
          - entities.Grower.fields.total_enrolled_acres
          - entities.Enrollment.fields.terminated_effective_year
        distinguishing_aspect: |
          Termination is the compensating counterpart of enrollment: the field's 1000.00 acres
          must come back out of Grower.total_enrolled_acres, the still-ACCRUED 2027 payment must
          become VOID (no cash movement, so net_paid_cents is untouched at 770000), and the exit
          fee must be computed from SETTLED cents only - 616000 from the single PAID payment,
          not 1232000 from both rows and not 0. Every acre and every cent therefore has to be
          accounted for on exactly one side of the ledger, with the PAID row deliberately
          surviving while the ACCRUED row disappears.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; COVER_CROP standard v1; grower G15 ACTIVE; field F15 (0,0)-(2000,2000) with mapped_acres 1000.00 and the standard 2021-2025 history."
