  - section: endpoints
    instances:
      - name: manifests_pagination_limit_offset
        claim_type: listing_pagination
        grounds: [response_envelope]
        distinguishing_aspect: "List pagination honors limit/offset with total_count and has_more: 3 manifests, limit 2 -> 2 rows has_more true; offset 2 -> 1 row has_more false."
        test_recipe:
          setup: ["account with three DRAFT manifests"]
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Page Co", contact_email: "pg@x.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T10:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m1: $.data.id } }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T10:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m2: $.data.id } }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-03T09:00:00Z", scheduled_end: "2026-06-03T10:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m3: $.data.id } }
          trigger:
            - { call: "GET /itad/accounts/${acct}/manifests", payload: { limit: 2, offset: 0 }, as: PlatformAdmin, captures: { p1_first: "$.data[0].id" } }
            - { call: "GET /itad/accounts/${acct}/manifests", payload: { limit: 2, offset: 2 }, as: PlatformAdmin, captures: { p2_first: "$.data[0].id" } }
          assert:
            - "page 1 returns 2 items with total_count == 3 and has_more == true, ordered created_at ASC (first is ${m1})"
            - "page 2 (offset 2) returns 1 item (${m3}) with has_more == false"

      - name: response_envelope_meta_present
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Success responses carry meta.api_request_id, meta.api_request_timestamp and response_type; error responses carry response_type error and data.error_id."
        test_recipe:
          setup: ["one account exists"]
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Env Co", contact_email: "env@x.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
          trigger:
            - { call: "GET /itad/accounts/${acct}", payload: {}, as: PlatformAdmin }
            - { call: "GET /itad/accounts/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "success envelope: meta.api_request_id present, meta.api_request_timestamp present, response_type == 'object', data holds the account"
            - "error envelope: response_type == 'error' and data.error_id == ERR_ACCOUNT_NOT_FOUND with data.message present"

      - name: settlement_supersede_chain_queryable
        claim_type: retrieval
        grounds: [entities.Settlement.fields.supersedes_settlement_id, state_machines.Settlement.QUOTE_OPEN_to_SUPERSEDED]
        distinguishing_aspect: "Re-quoting supersedes the prior QUOTE_OPEN settlement (status SUPERSEDED, supersedes link on the new one), and GET /itad/settlements?supersedes_settlement_id=<old> returns the replacement."
        test_recipe:
          setup: ["account; clock 2026-05-01; manifest RECEIVED (declared 1); one triaged item; QUOTE s1 created, then QUOTE s2 created (supersedes s1)"]
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Sup Co", contact_email: "sup@x.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests/${m}/receive", payload: {}, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-SP1", category: "LAPTOP", weight_kg: 2.0, data_bearing: false, hazmat_flag: false, declared_grade: "A" }, as: IntakeOperator, captures: { i1: $.data.id } }
            - { call: "POST /itad/items/${i1}/triage", payload: { disposition: "RESALE" }, as: IntakeOperator }
            - { call: "GET /itad/manifests/${m}", payload: {}, as: IntakeOperator, captures: { m_v1: $.data.version } }
            - { call: "POST /itad/manifests/${m}/settlements", payload: { expected_manifest_version: "${m_v1}" }, as: IntakeOperator, captures: { s1: $.data.id } }
            - { call: "GET /itad/manifests/${m}", payload: {}, as: IntakeOperator, captures: { m_v2: $.data.version } }
            - { call: "POST /itad/manifests/${m}/settlements", payload: { expected_manifest_version: "${m_v2}" }, as: IntakeOperator, captures: { s2: $.data.id, s2_super: $.data.supersedes_settlement_id } }
          trigger:
            - { call: "GET /itad/settlements/${s1}", payload: {}, as: PlatformAdmin, captures: { s1_status: $.data.status } }
            - { call: "GET /itad/settlements", payload: { supersedes_settlement_id: "${s1}" }, as: PlatformAdmin, captures: { repl: "$.data[0].id" } }
          assert:
            - "Settlement.${s1}.status == SUPERSEDED after the second quote"
            - "s2.supersedes_settlement_id == ${s1} and GET /itad/settlements?supersedes_settlement_id=${s1} returns [${s2}]"

      - name: batch_certificates_listed
        claim_type: retrieval
        grounds: [entities.Certificate.fields.batch_id]
        excluded_because:
          difficulty_instance: batch_process_depth3_cascade_tier_upgrade
          rationale: "The auto-issued COR on batch PROCESSED is asserted there via GET /itad/recycle-batches/{id}/certificates."

