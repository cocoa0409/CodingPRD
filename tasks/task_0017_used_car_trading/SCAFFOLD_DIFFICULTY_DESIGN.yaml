scaffold_difficulty_design:

  # =========================================================================
  # Rule 1: dual_variant_calc (>= 2 instances, different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_valuation_on_assessment
        grounds:
          - calculations.provisional_price_valuation
          - calculations.final_price_valuation
          - state_machines.AssessmentReport.DRAFT_to_ONSITE_PENDING
          - state_machines.AssessmentReport.ONSITE_PENDING_to_FINALIZED
          - entities.AssessmentReport.fields.provisional_valuation_cents
          - entities.AssessmentReport.fields.final_valuation_cents
        distinguishing_aspect: |
          Two valuation algorithms operate on the AssessmentReport entity domain — the provisional uses
          declared_mileage and event-count history only, while the final uses verified_mileage, on-site
          grades, major-accident weighting, and a discrepancy multiplier — producing different cents on
          identical history records when on-site mileage differs from declared.
        test_recipe:
          setup:
            - "Inspector creates Vehicle V with declared_mileage_km=100000, make=Toyota, model=Corolla, model_year=2018"
            - "POST /vehicles/{V}/assessments with vin_history_records containing 1 ACCIDENT(MINOR) + 2 MAINTENANCE; inspector_user_id set"
          trigger:
            - "POST /assessments/{A}/request-onsite (triggers provisional)"
            - "POST /assessments/{A}/finalize with onsite_findings={exterior_grade=A, interior_grade=A, mechanical_grade=B, mileage_km_observed=110000}"
          assert:
            - "AssessmentReport.provisional_valuation_cents == 682500"
            - "AssessmentReport.final_valuation_cents == 542095"
            - "AssessmentReport.mileage_discrepancy_flag == true"
            - "Vehicle.assessment_score == 78"
            - "AssessmentReport.provisional_valuation_cents != AssessmentReport.final_valuation_cents"

      - name: dispute_partial_refund_with_or_without_third_party
        grounds:
          - calculations.dispute_compensation
          - state_machines.DisputeCase.RESOLUTION_PROPOSED_to_CLOSED
          - entities.DisputeCase.fields.third_party_report_url
          - entities.DisputeCase.fields.refund_amount_cents
          - entities.PurchaseOrder.fields.agreed_price_cents
        distinguishing_aspect: |
          On the DisputeCase entity domain (different from AssessmentReport), REFUND_PARTIAL produces two
          different refund amounts on the same agreed_price_cents based on whether the case went through
          THIRD_PARTY_INSPECTION (30% base) versus skipped it (10% base) — same input agreed_price yields
          divergent refund cents.
        test_recipe:
          setup:
            - "Two completed PurchaseOrders, each with agreed_price_cents=5_000_000, no mileage discrepancy"
            - "Buyer files DisputeCase D1 and D2 against each PO respectively (complainant_role=BUYER)"
          trigger:
            - "D1 path: POST /disputes/D1/start-review, POST /disputes/D1/propose-resolution {resolution: REFUND_PARTIAL}, POST /disputes/D1/execute"
            - "D2 path: POST /disputes/D2/start-review, POST /disputes/D2/request-third-party, POST /disputes/D2/submit-third-party-report {third_party_report_url:'http://x'}, then propose-resolution {REFUND_PARTIAL} via state RESOLUTION_PROPOSED reached, POST /disputes/D2/execute"
          assert:
            - "DisputeCase D1.refund_amount_cents == 500000"
            - "DisputeCase D2.refund_amount_cents == 1500000"
            - "D1.refund_amount_cents != D2.refund_amount_cents"

  # =========================================================================
  # Rule 2: combinatorial_formula (>= 2 instances, different modes from {(a),(b),(c)})
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: final_valuation_three_input_nonlinear
        grounds:
          - calculations.final_price_valuation
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs (mileage_factor, grade_avg, history_penalty, discrepancy_penalty)
          combined non-linearly through nested multiplications and conditional branch on
          mileage_discrepancy_flag; the discrepancy multiplier is conditionally applied based on entity state.
        test_recipe:
          setup:
            - "Vehicle V with declared_mileage_km=100000"
            - "AssessmentReport A with vin_history: 1 ACCIDENT(MINOR), 2 MAINTENANCE; on-site grades A/A/B"
          trigger:
            - "POST /assessments/A/finalize with mileage_km_observed=110000 (causes discrepancy_flag=true)"
          assert:
            - "AssessmentReport.final_valuation_cents == 542095"
            - "If mileage_km_observed=99000 instead (discrepancy_flag=false), final_valuation_cents == 661949"
            - "541949 != 661949 (discrepancy multiplier shifts result by >100k cents)"

      - name: loan_amortization_pinned_evaluation_order
        grounds:
          - calculations.loan_amortization
          - state_machines.Loan.CREDIT_CHECKING_to_APPROVED
          - entities.Loan.fields.approved_principal_cents
          - entities.Loan.fields.monthly_payment_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency where evaluation order is explicitly pinned: max_principal
          requires ceil() on down-payment FIRST, then approved_principal=min(requested, max_principal), then
          monthly_payment uses a SINGLE ceil at the end (not per-iteration). Performing the rounding in a
          different order or applying ceil at multiple points yields different cents.
        test_recipe:
          setup:
            - "PurchaseOrder PO with agreed_price_cents=5_000_000"
            - "Buyer applies for Loan: lender_code=LENDER_A, requested_principal_cents=4_000_000, down_payment_ratio_bp=2000, term_months=36"
          trigger:
            - "POST /loans/L/run-credit-check"
            - "POST /_events/emit credit_check_returned with credit_score=700"
          assert:
            - "Loan.approved_principal_cents == 4000000"
            - "Loan.monthly_payment_cents == 121326"
            - "Loan.total_interest_cents == 367736"
            - "monthly_payment * 36 - approved_principal == total_interest_cents (invariant pinned by formula)"

  # =========================================================================
  # Rule 3: non_linear_state_machine (>= 2 instances, different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: bid_cyclic_live_outbid
        grounds:
          - state_machines.Bid.LIVE_to_OUTBID
          - state_machines.Bid.OUTBID_to_LIVE
          - entities.Bid.fields.status
        distinguishing_aspect: |
          Bid has a cyclic state machine: LIVE→OUTBID→LIVE round-trips during auction rounds — Buyer A is
          LIVE, B outbids (A→OUTBID, B→LIVE), A bids again (A→LIVE, B→OUTBID). This is a cycle on the Bid
          entity, structurally distinct from any linear pipeline.
        test_recipe:
          setup:
            - "AUCTION listing L with ask_price_cents=1_000_000"
            - "Buyer A and Buyer B registered"
          trigger:
            - "POST /listings/L/bids by A with amount_cents=1_050_000 (A is LIVE)"
            - "POST /listings/L/bids by B with amount_cents=1_100_000 (A→OUTBID, B→LIVE)"
            - "POST /listings/L/bids by A with amount_cents=1_150_000 (B→OUTBID, A→LIVE)"
          assert:
            - "Bid_A1.status == 'OUTBID' after step 2"
            - "Bid_A1.status remains 'OUTBID' after step 3 (immutable old bid)"
            - "Latest A bid (Bid_A2).status == 'LIVE' after step 3"
            - "Bid_B1.status == 'OUTBID' after step 3"
            - "Listing.active_bid_id points to Bid_A2"

      - name: dispute_cyclic_evidence_review
        grounds:
          - state_machines.DisputeCase.SUBMITTED_to_EVIDENCE_REVIEW
          - state_machines.DisputeCase.EVIDENCE_REVIEW_to_SUBMITTED
          - entities.DisputeCase.fields.round_count
          - validations[priority=21]
        distinguishing_aspect: |
          DisputeCase has a cyclic state machine on a different entity from Bid: SUBMITTED↔EVIDENCE_REVIEW
          round-trips, capped at MAX_MEDIATION_ROUNDS=3 — request-more-evidence cycles back to SUBMITTED
          incrementing round_count.
        test_recipe:
          setup:
            - "Completed PurchaseOrder; Buyer files DisputeCase D"
          trigger:
            - "POST /disputes/D/start-review (round_count=1, EVIDENCE_REVIEW)"
            - "POST /disputes/D/request-more-evidence (back to SUBMITTED)"
            - "POST /disputes/D/start-review (round_count=2, EVIDENCE_REVIEW)"
            - "POST /disputes/D/request-more-evidence (back to SUBMITTED)"
            - "POST /disputes/D/start-review (round_count=3, EVIDENCE_REVIEW)"
            - "POST /disputes/D/request-more-evidence — should fail boundary"
          assert:
            - "After step 5, DisputeCase.round_count == 3"
            - "Step 6 returns 409 with error_id == 'ERR_DISPUTE_ROUNDS_EXHAUSTED'"
            - "DisputeCase.stage == 'EVIDENCE_REVIEW' (cycle stops, does not return to SUBMITTED)"

  # =========================================================================
  # Rule 4: transitive_cascade (>= 2 instances, depths >=3 and >=2, different triggers)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: transfer_rollback_full_cascade_depth_4
        grounds:
          - state_machines.TransferCase.FAILED_to_ROLLED_BACK
          - state_machines.PurchaseOrder.AWAITING_TRANSFER_to_REFUNDED
          - state_machines.Listing.SOLD_to_RESERVED  # actually SOLD→ACTIVE under PurchaseOrder REFUNDED
          - state_machines.Vehicle.SOLD_to_LISTED
          - state_machines.Warranty.ACTIVE_to_VOIDED
          - state_machines.Loan.DISBURSED_to_CANCELLED
        distinguishing_aspect: |
          Depth-4 cascade originating from POST /transfers/{id}/rollback: TransferCase FAILED→ROLLED_BACK
          (depth 1) CAUSES PurchaseOrder AWAITING_TRANSFER→REFUNDED (depth 2). That mutation on PO CAUSES
          Vehicle SOLD→LISTED and Warranty ACTIVE→VOIDED (depth 3). The Vehicle mutation in turn CAUSES the
          original Listing SOLD→ACTIVE (depth 4). Each link is caused by the previous, not fanned out from
          the original action.
        test_recipe:
          setup:
            - "PurchaseOrder PO in AWAITING_TRANSFER, TransferCase TC in FAILED with failure_reason set"
            - "Warranty W in ACTIVE, Loan in DISBURSED, Listing L in SOLD, Vehicle V in SOLD"
          trigger:
            - "POST /transfers/TC/rollback by PlatformAdmin"
          assert:
            - "TransferCase.status == 'ROLLED_BACK' (link 1)"
            - "PurchaseOrder.status == 'REFUNDED' (link 2 — caused by TC rollback, not by the original API call)"
            - "Vehicle.vehicle_status == 'LISTED' AND Warranty.status == 'VOIDED' (link 3)"
            - "Listing.status == 'ACTIVE' (link 4 — caused by Vehicle revert)"
            - "Loan.status == 'CANCELLED' (parallel link from PO refund)"
            - "Vehicle.ownership_seller_id reverted to original Seller.id"

      - name: listing_approval_cascade_depth_2
        grounds:
          - state_machines.Listing.UNDER_REVIEW_to_ACTIVE
          - state_machines.Vehicle.ASSESSED_to_LISTED
          - entities.Listing.fields.doc_check_status
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (POST /listings/{id}/approve): Listing UNDER_REVIEW→ACTIVE
          (depth 1) CAUSES Vehicle ASSESSED→LISTED (depth 2). Distinct origin from the rollback chain.
        test_recipe:
          setup:
            - "Vehicle V in ASSESSED with FINALIZED AssessmentReport"
            - "Listing L in UNDER_REVIEW pinned to that AssessmentReport"
          trigger:
            - "POST /listings/L/approve by PlatformAdmin"
          assert:
            - "Listing.status == 'ACTIVE' (link 1)"
            - "Listing.doc_check_status == 'PASS'"
            - "Vehicle.vehicle_status == 'LISTED' (link 2 — caused by Listing transition, not the API call)"

  # =========================================================================
  # Rule 5: priority_pair_validation_conflict (>= 2 instances, different category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_listing_submit
        grounds:
          - validations[priority=7]   # state ERR_INVALID_STATE
          - validations[priority=11]  # business_safety ERR_LISTING_DOCS_INSUFFICIENT
        distinguishing_aspect: |
          Conflict pair: state (priority 7, ERR_INVALID_STATE) vs business_safety (priority 11,
          ERR_LISTING_DOCS_INSUFFICIENT). When a Seller calls POST /listings/{id}/submit on a Listing
          already ACTIVE (wrong state) AND with only 3 photos (docs insufficient), state error must win.
        test_recipe:
          setup:
            - "Listing L already in ACTIVE state, with photo_urls of length 3 only"
          trigger:
            - "POST /listings/L/submit by owner Seller"
          assert:
            - "Response status == 409"
            - "Response error_id == 'ERR_INVALID_STATE' (state check wins; ERR_LISTING_DOCS_INSUFFICIENT is NOT returned)"

      - name: business_referential_vs_business_fiscal_on_loan
        grounds:
          - validations[priority=14]  # business_fiscal ERR_DOWN_PAYMENT_INSUFFICIENT
          - validations[priority=15]  # business_fiscal ERR_LOAN_PARAMS_INVALID
          - validations[priority=5]   # existence ERR_NOT_FOUND for missing PurchaseOrder
        distinguishing_aspect: |
          Different category pair from above: existence (priority 5, ERR_NOT_FOUND) vs business_fiscal
          (priority 14/15). When applying for a Loan against a non-existent PurchaseOrder AND with
          down_payment_ratio_bp=1000 (below LENDER_A min 1500), existence wins (404 over 422).
        test_recipe:
          setup:
            - "Buyer registered; no PurchaseOrder with id 'fake-po-id'"
          trigger:
            - "POST /purchase-orders/fake-po-id/loans by Buyer with lender_code=LENDER_A, down_payment_ratio_bp=1000, term_months=36, requested_principal_cents=2_000_000"
          assert:
            - "Response status == 404"
            - "Response error_id == 'ERR_NOT_FOUND' (existence wins; ERR_DOWN_PAYMENT_INSUFFICIENT is NOT returned)"

  # =========================================================================
  # Rule 6: boundary_precision_check (>= 2 instances, different metrics, different endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: bid_increment_strict_at_required_min
        grounds:
          - calculations.bid_increment_rule
          - validations[priority=12]
          - endpoints.POST_listings_id_bids
        distinguishing_aspect: |
          Numeric threshold boundary on Bid amount via POST /listings/{id}/bids: required_min =
          current_max + increment is INCLUSIVE — a bid of EXACTLY required_min is accepted (>=), but
          required_min - 1 cent is rejected with ERR_BID_TOO_LOW.
        test_recipe:
          setup:
            - "AUCTION Listing L with ask_price_cents=1_000_000 (current_max becomes 1_000_000 with no LIVE bid)"
            - "Two registered buyers"
          trigger:
            - "POST /listings/L/bids amount_cents=1_049_999 (just below boundary 1_050_000)"
            - "POST /listings/L/bids amount_cents=1_050_000 (exactly at boundary)"
          assert:
            - "First call returns 422 with error_id == 'ERR_BID_TOO_LOW'"
            - "Second call returns 201 with Bid.status == 'LIVE' and Bid.amount_cents == 1050000"

      - name: dispute_rounds_exhausted_at_three
        grounds:
          - validations[priority=21]
          - state_machines.DisputeCase.EVIDENCE_REVIEW_to_SUBMITTED
          - endpoints.POST_disputes_id_request_more_evidence
        distinguishing_aspect: |
          Different metric (round_count integer counter) on a DIFFERENT endpoint
          (POST /disputes/{id}/request-more-evidence). The boundary is round_count < 3 strict — at
          round_count==3, request-more-evidence is rejected. This is a count-based boundary, structurally
          different from the bid amount numeric threshold.
        test_recipe:
          setup:
            - "DisputeCase D in EVIDENCE_REVIEW with round_count=3 (after three start-review cycles)"
          trigger:
            - "POST /disputes/D/request-more-evidence by PlatformAdmin"
          assert:
            - "Response status == 409"
            - "Response error_id == 'ERR_DISPUTE_ROUNDS_EXHAUSTED'"
            - "DisputeCase.round_count remains 3 (not incremented)"

  # =========================================================================
  # Rule 7: cross_entity_state_dependency (>= 2 instances, different entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: listing_approve_requires_assessment_finalized_with_pinned_version
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - state_machines.Listing.UNDER_REVIEW_to_ACTIVE
          - entities.Listing.fields.assessment_report_version
        distinguishing_aspect: |
          Listing→AssessmentReport pair: Listing's UNDER_REVIEW→ACTIVE transition is gated by
          AssessmentReport.status == FINALIZED AND AssessmentReport.version == Listing.assessment_report_version
          (version-pinning re-validation). A new finalize on the same vehicle bumps the report version,
          which invalidates the listing approval.
        test_recipe:
          setup:
            - "Vehicle V, AssessmentReport A finalized at version=2, Listing L pinned to A version=2 in UNDER_REVIEW"
            - "Inspector creates a NEW AssessmentReport A2 and finalizes it (this transitions A→SUPERSEDED and increments through new entity)"
          trigger:
            - "POST /listings/L/approve by PlatformAdmin (note: A was superseded; pinned report now SUPERSEDED, not FINALIZED)"
          assert:
            - "Response status == 422 with error_id == 'ERR_ASSESSMENT_NOT_FINALIZED' (referenced report is no longer FINALIZED)"
            - "Listing.status remains 'UNDER_REVIEW'"

      - name: warranty_claim_requires_warranty_active
        grounds:
          - validations[priority=18]
          - state_machines.Warranty.ACTIVE_to_EXPIRED
          - state_machines.WarrantyClaim.PENDING_to_APPROVED
        distinguishing_aspect: |
          Different entity pair (WarrantyClaim→Warranty): WarrantyClaim creation/approval is gated by
          Warranty.status == ACTIVE AND now < expires_at. Crossing the expiration via clock-advance moves
          Warranty to EXPIRED, after which claim filing is rejected.
        test_recipe:
          setup:
            - "PurchaseOrder PAID with Warranty W (package STANDARD) ACTIVE; effective_at=2026-01-15T10:00, expires_at=2027-01-15T10:00"
          trigger:
            - "POST /_clock/advance to_iso_8601=2027-01-16T00:00:00Z (Warranty auto-transitions ACTIVE→EXPIRED)"
            - "POST /warranties/W/claims by Buyer with component=POWERTRAIN, claimed_amount_cents=200_000"
          assert:
            - "After clock advance, Warranty.status == 'EXPIRED'"
            - "Claim creation returns 409 with error_id == 'ERR_WARRANTY_NOT_ACTIVE'"

  # =========================================================================
  # Rule 8: resource_temporal_overlap (>= 2 instances, different interval semantics, different resources)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: reservation_holding_window_serial_no_overlap
        grounds:
          - state_machines.Reservation.QUEUED_to_HOLDING
          - state_machines.Reservation.HOLDING_to_EXPIRED
          - entities.Reservation.fields.hold_expires_at
          - entities.Listing.fields.reservation_buyer_id
          - concurrency_rules[Two_buyers_create_first_reservation]
        distinguishing_aspect: |
          Resource = Listing's reservation slot. Interval semantics: HALF-OPEN [now, hold_expires_at),
          STRICTLY one HOLDING reservation per listing at any time. New reservations join queue (QUEUED)
          rather than overlap; promotion is FIFO on Reservation.created_at after the current holder's
          interval ends. No two HOLDING intervals can overlap on the same listing — this is exclusive
          single-occupancy with FIFO succession.
        test_recipe:
          setup:
            - "FIXED_PRICE Listing L in ACTIVE with ask_price_cents=2_000_000"
            - "Buyer A and Buyer B registered"
          trigger:
            - "POST /listings/L/reservations by A (A becomes HOLDING at queue_position=1)"
            - "POST /listings/L/reservations by B (B is QUEUED at queue_position=2; cannot be HOLDING because A's interval [t1, t1+24h) is occupying)"
            - "POST /_clock/advance past A's hold_expires_at"
          assert:
            - "After step 1: A.status == 'HOLDING', A.queue_position == 1, B.status not yet created"
            - "After step 2: B.status == 'QUEUED', B.queue_position == 2; only A is HOLDING"
            - "After step 3: A.status == 'EXPIRED', B auto-promoted to HOLDING with queue_position == 1"
            - "At no time do two reservations have status=='HOLDING' simultaneously on Listing L"

      - name: transfer_appointment_must_be_future_with_60d_window
        grounds:
          - validations[priority=17]
          - entities.TransferCase.fields.appointment_at
          - state_machines.TransferCase.DOCS_PENDING_to_APPOINTMENT_BOOKED
          - state_machines.TransferCase.APPOINTMENT_BOOKED_to_IN_PROGRESS
        distinguishing_aspect: |
          DIFFERENT resource (TransferCase) and DIFFERENT interval semantics: appointment_at must lie in
          OPEN-OPEN interval (now, now+60d] — strict future (now < appointment_at) and bounded delay
          (appointment_at - now <= 60 days). Unlike Reservation's exclusive-occupancy semantics, this is a
          per-case validity window check; multiple TransferCases can have non-overlapping appointments,
          but each individual appointment_at must satisfy the geometric constraint at booking time.
        test_recipe:
          setup:
            - "Clock at 2026-05-09T00:00:00Z"
            - "TransferCase TC in DOCS_PENDING with all required documents submitted"
          trigger:
            - "POST /transfers/TC/book-appointment with appointment_at=2026-05-08T23:59:59Z (in past)"
            - "POST /transfers/TC/book-appointment with appointment_at=2026-08-08T00:00:00Z (>60 days away: 91 days)"
            - "POST /transfers/TC/book-appointment with appointment_at=2026-05-15T10:00:00Z (within window)"
          assert:
            - "Step 1 returns 422 with error_id == 'ERR_APPOINTMENT_OUT_OF_WINDOW'"
            - "Step 2 returns 422 with error_id == 'ERR_APPOINTMENT_OUT_OF_WINDOW'"
            - "Step 3 returns 200 with TransferCase.status == 'APPOINTMENT_BOOKED'"

  # =========================================================================
  # Rule 9: compensating_invariant (>= 2 instances, different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_held_invariant_under_bid_outbid_cycle
        grounds:
          - calculations.deposit_balance_reconciliation
          - state_machines.Bid.LIVE_to_OUTBID
          - state_machines.Bid.OUTBID_to_LIVE
          - entities.Buyer.fields.deposit_held_cents
          - entities.Bid.fields.deposit_cents
        distinguishing_aspect: |
          Conserved quantity: Buyer.deposit_held_cents. Forward action (place bid → LIVE, hold deposit) is
          paired with compensation (be outbid → OUTBID, release deposit). Invariant pinned by formula:
          Buyer.deposit_held_cents == SUM(Bid.deposit_cents WHERE buyer_id=Buyer.id AND status=LIVE) +
          SUM(Reservation.deposit_cents WHERE buyer_id=Buyer.id AND status=HOLDING). After A bids, B
          outbids, A bids again, B is outbid — Buyer A and Buyer B together must each return to a
          held-amount equal exactly to the formula.
        test_recipe:
          setup:
            - "AUCTION Listing L ask_price=1_000_000; Buyers A and B with deposit_held_cents=0 each"
          trigger:
            - "POST /listings/L/bids by A amount_cents=1_050_000 (deposit_cents=ceil(1_050_000*0.10)=105_000)"
            - "POST /listings/L/bids by B amount_cents=1_250_000 (deposit_cents=125_000; A→OUTBID releases 105_000)"
            - "POST /listings/L/bids by A amount_cents=1_500_000 (deposit_cents=150_000; B→OUTBID releases 125_000)"
            - "POST /bids/{B_bid}/cancel — actually B's bid is already OUTBID; instead test: POST /listings/L/close-auction"
          assert:
            - "After step 1: Buyer_A.deposit_held_cents == 105000; Buyer_B.deposit_held_cents == 0"
            - "After step 2: Buyer_A.deposit_held_cents == 0; Buyer_B.deposit_held_cents == 125000"
            - "After step 3: Buyer_A.deposit_held_cents == 150000; Buyer_B.deposit_held_cents == 0"
            - "Invariant at every step: Buyer.deposit_held_cents == SUM of LIVE Bid deposits + HOLDING Reservation deposits for that buyer"
            - "Sum of all buyers' deposit_held_cents == sum across LIVE Bids + HOLDING Reservations system-wide"

      - name: vehicle_ownership_invariant_under_transfer_rollback
        grounds:
          - state_machines.Vehicle.SOLD_to_LISTED
          - state_machines.Vehicle.LISTED_to_SOLD
          - state_machines.TransferCase.FAILED_to_ROLLED_BACK
          - state_machines.PurchaseOrder.AWAITING_TRANSFER_to_REFUNDED
          - entities.Vehicle.fields.ownership_seller_id
        distinguishing_aspect: |
          Different conserved quantity (categorical, not numeric): Vehicle.ownership_seller_id. The forward
          action (PurchaseOrder PAID + TransferCase SUCCEEDED → Vehicle.ownership_seller_id = buyer's
          principal) is paired with compensation (TransferCase FAILED → ROLLED_BACK → Vehicle revert).
          Invariant: across the forward+compensating pair, count(Vehicles owned by original Seller)
          remains unchanged.
        test_recipe:
          setup:
            - "Original Seller S with one Vehicle V (ownership_seller_id=S.id), V LISTED, Listing L ACTIVE"
            - "Buyer B reserves L, pays, TransferCase TC created in DOCS_PENDING with all docs uploaded"
            - "Snapshot: count_vehicles_owned_by(S.id) == 1"
          trigger:
            - "POST /transfers/TC/book-appointment, advance clock past appointment_at (TC → IN_PROGRESS)"
            - "POST /_events/emit transfer_failed (TC → FAILED)"
            - "POST /transfers/TC/rollback (TC → ROLLED_BACK; cascade reverts Vehicle.ownership_seller_id)"
          assert:
            - "After cascade: Vehicle.ownership_seller_id == S.id (original owner restored)"
            - "count(Vehicles WHERE ownership_seller_id=S.id) == 1 (unchanged from initial snapshot)"
            - "count(Vehicles WHERE ownership_seller_id=B's principal id) == 0"
            - "Listing.status == 'ACTIVE' AND PurchaseOrder.status == 'REFUNDED'"
