          setup:
            - "AffiliateProgram with sweat_equity_base_hours_required 12."
            - "ApplicantHousehold SELECTED with one APPLICANT member; HOMEBUYER_CORE enrollment COMPLETED so readiness is EDUCATION_COMPLETE."
            - "Clock at 2026-08-05T00:00:00.000Z; a 12.00-hour CONSTRUCTION entry CREDITED, so the household is PARTNERSHIP_ACTIVE / CLOSING_READY with sweat_equity_satisfied true."
