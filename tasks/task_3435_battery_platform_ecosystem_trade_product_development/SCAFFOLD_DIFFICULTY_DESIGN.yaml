      - name: listing_activate_safety_hold_beats_segmentation
        grounds:
          - validations.priority_9
          - validations.priority_14
          - errors.ERR_SAFETY_HOLD
          - errors.ERR_SEGMENT_NOT_ALLOWED
        distinguishing_aspect: |
          Category pair business_safety vs business_constraint (distinct from the
