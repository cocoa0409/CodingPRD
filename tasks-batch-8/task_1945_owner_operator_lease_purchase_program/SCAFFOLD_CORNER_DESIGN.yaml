            - { call: "GET /lease-program/owner-operators/${op}", payload: {}, as: LeaseAdmin, captures: { cls_flagged: "$.data.classification_status" } }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "INSURANCE_CERTIFICATE", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d4: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents/${d4}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "GET /lease-program/owner-operators/${op}", payload: {}, as: LeaseAdmin, captures: { cls_verified: "$.data.classification_status" } }
          assert:
