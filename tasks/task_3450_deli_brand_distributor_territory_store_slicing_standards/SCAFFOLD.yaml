  - { method: POST, path: "/api/service-visits/{id}/submit", description: "submit visit report with score and optional slicer cleaning verifications", roles: [DistributorRep], code: 200, input: [score, rotation_compliant, slicer_presentation_ok, "cleaned_slicer_ids?"], output: ServiceVisit, side_effects: ["slicer.cleaning_verified_at = now for cleaned_slicer_ids", "increments ServiceVisit.version by 1"] }
  - { method: POST, path: "/api/service-visits/{id}/review", description: "SafetyOfficer verifies or sends back for rework (segregation of duties: submitter cannot review)", roles: [SafetyOfficer], code: 200, input: [verdict], output: ServiceVisit, side_effects: ["increments ServiceVisit.version by 1"] }
  - { method: POST, path: "/api/slicers", description: "register a slicer at the caller's account", roles: [RetailManager], code: 201, input: [account_id, label, "dedicated_allergen?"], output: Slicer, side_effects: [] }
  - { method: GET, path: "/api/slicers", description: "list slicers; filters account_id?, status?", roles: [BrandAdmin, DistributorRep, RetailManager, SafetyOfficer], code: 200, input: ["account_id?", "status?"], output: "Slicer[]", side_effects: [] }
  - { method: POST, path: "/api/slicers/{id}/decommission", description: "ACTIVE -> DECOMMISSIONED", roles: [RetailManager], code: 200, input: [], output: Slicer, side_effects: ["increments Slicer.version by 1"] }
  - { method: POST, path: "/api/opened-product-logs", description: "log a product opened on a slicer; allergen separation enforced; pull_deadline computed", roles: [RetailManager], code: 201, input: [product_id, slicer_id, "opened_at?"], output: OpenedProductLog, side_effects: ["account_id set from X-User-ID", "pull_deadline = opened_at + shelf_life_opened_hours"] }
  - { method: GET, path: "/api/opened-product-logs", description: "list opened-product logs; filters account_id?, product_id?, slicer_id?, status?", roles: [BrandAdmin, DistributorRep, RetailManager, SafetyOfficer], code: 200, input: ["account_id?", "product_id?", "slicer_id?", "status?"], output: "OpenedProductLog[]", side_effects: [] }
