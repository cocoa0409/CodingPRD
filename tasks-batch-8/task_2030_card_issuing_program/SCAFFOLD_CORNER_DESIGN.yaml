          assert:
            - "s1 == ANNOUNCED"
            - "s2 == EFFECTIVE"

      - name: conditional_feature_flag_rules_locked
        claim_type: conditional_feature_flags
        grounds: [entities.CardProgram.fields.authorization_rules_locked, errors.ERR_PROGRAM_RULES_LOCKED]
        distinguishing_aspect: "When program.authorization_rules_locked=true, rule activation is blocked."
        test_recipe:
          setup: ["CardProgram p; Mandate m; MandateAck ack SUBMITTED (locks program)"]
          setup_api_calls:
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuing/programs"
              payload: { program_code: "P-LK", product_class: "DEBIT_CONSUMER", network: "VISA", currency_code: "USD", daily_spend_cap_cents: 1000000 }
              as: ProgramManager
              captures: { pid: $.data.id }
            - call: "POST /issuing/programs/${pid}/bin-ranges"
              payload: { bin_prefix: "411111", range_size: 1000, effective_from: "2026-08-01T00:00:00Z", effective_until: "2030-01-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /issuing/programs/${pid}/publish"
              payload: {}
              as: ProgramManager
            - call: "POST /issuing/mandates"
              payload: { network: "VISA", mandate_code: "M-LK", title: "M", effective_at: "2026-09-01T00:00:00Z", compliance_deadline: "2026-12-01T00:00:00Z", severity: "REQUIRED" }
              as: ComplianceOfficer
              captures: { mid: $.data.id }
            - call: "POST /issuing/mandates/${mid}/acks"
              payload: { program_id: "${pid}", implementation_notes: "n" }
              as: ComplianceOfficer
              captures: { aid: $.data.id }
            - call: "POST /issuing/mandates/${mid}/acks/${aid}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-1"
            # Now create a rule under this program
            - call: "POST /issuing/authorization-rules"
              payload: { subject_kind: "PROGRAM", subject_ref: "${pid}", rule_kind: "MCC_BLOCK", mcc_list: ["7995"], priority_rank: 1 }
              as: ComplianceOfficer
              captures: { rid: $.data.id, rv: $.data.version }
          trigger:
            - call: "POST /issuing/authorization-rules/${rid}/activate"
              payload: { expected_rule_version: "${rv}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PROGRAM_RULES_LOCKED"

  # ============================================================
  # Section 9: Consistency Model
  # ============================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_after_state_change
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "A state transition's effect is visible in the SAME response envelope (no lag)."
        test_recipe:
          setup: ["CardProgram p DRAFT with bin"]
          setup_api_calls:
            - call: "POST /issuing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /issuing/programs"
              payload: { program_code: "P-IC", product_class: "DEBIT_CONSUMER", network: "VISA", currency_code: "USD", daily_spend_cap_cents: 1000000 }
              as: ProgramManager
              captures: { pid: $.data.id }
            - call: "POST /issuing/programs/${pid}/bin-ranges"
              payload: { bin_prefix: "411111", range_size: 1000, effective_from: "2026-08-01T00:00:00Z", effective_until: "2030-01-01T00:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "POST /issuing/programs/${pid}/publish"
              payload: {}
              as: ProgramManager
              captures: { post: $.data.posture }
          assert:
            - "post == LIVE   # visible in same response"
