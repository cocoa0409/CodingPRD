      - name: side_effect_pattern_cascade_down_backhaul_degradation
        claim_type: side_effect_execution
        grounds:
          - state_machines.BackhaulCircuit.ACCEPTED_to_DEGRADED
          - state_machines.CapacityHold.HELD_to_RELEASED
          - state_machines.ServiceabilityRequest.QUALIFIED_to_EXPIRED
        excluded_because:
          difficulty_instance: backhaul_degradation_cascade_freezes_sector_releases_hold_expires_request
          rationale: |
            The transport-side cascade-down pattern (circuit DEGRADED -> sector FROZEN -> hold
            RELEASED with release_reason BACKHAUL_DEGRADED -> request EXPIRED) is already asserted
            end to end there, including the tower's backhaul_accepted_mbps dropping to 0 and the
            release_reason discrimination against SECTOR_DISABLED. The corner walk keeps only the
            structurally different tower-decommission cascade.

      - name: side_effect_pattern_cross_entity_compound_install_completion
        claim_type: side_effect_execution
        grounds:
          - state_machines.InstallWorkOrder.MOUNT_APPROVED_to_INSTALLED
          - state_machines.Subscriber.PENDING_INSTALL_to_ACTIVE
          - state_machines.EquipmentAssignment.ASSIGNED_to_DEPLOYED
        excluded_because:
          difficulty_instance: install_completion_cascade_activates_account_deploys_radio_and_sets_monthly_charge
          rationale: |
            The compound cross-entity fan-out of one completion call (work order INSTALLED,
            subscriber ACTIVE with cycle_start_date, assignment DEPLOYED with radio_serial copied,
            equipment_monthly_charge_cents recomputed, invoice total computed) is asserted field by
            field there; repeating it here would only duplicate the same call graph.

      - name: side_effect_pattern_ledger_sync_hold_to_sold_transfer
        claim_type: side_effect_execution
        grounds:
          - state_machines.CapacityHold.HELD_to_CONSUMED
          - calculations.sector_capacity_posture
        excluded_because:
          difficulty_instance: hold_then_release_conserves_sector_sold_plus_held_bandwidth
          rationale: |
            The ledger-sync invariant that sold_mbps + held_mbps is conserved when a hold is consumed,
            and shrinks by exactly held_mbps when it is released, is the whole subject of that
            conservation instance.

      - name: side_effect_pattern_compensation_credit_reversal
        claim_type: side_effect_execution
        grounds:
          - state_machines.OutageCredit.APPLIED_to_REVERSED
          - entities.Subscriber.fields.credit_balance_cents
          - entities.OutageEvent.fields.total_credited_cents
        excluded_because:
          difficulty_instance: credit_reversal_conserves_subscriber_balance_and_outage_credited_total
          rationale: |
            Reversal is this scaffold's only compensating transaction, and the paired roll-back of
            Subscriber.credit_balance_cents and OutageEvent.total_credited_cents to their pre-credit
            values is already asserted there with exact cent literals.

      - name: transition_shape_cyclic_coordination_revision_loop
        claim_type: valid_transition
        grounds:
          - state_machines.InterferenceCoordination.REVISION_REQUESTED_to_REQUESTED
          - errors[ERR_COORDINATION_ROUND_LIMIT]
        excluded_because:
          difficulty_instance: coordination_negotiation_loop_bounded_at_three_rounds
          rationale: |
            The cyclic REQUESTED <-> REVISION_REQUESTED shape and its MAX_COORDINATION_ROUNDS = 3
            bound (round_number progression plus the ERR_COORDINATION_ROUND_LIMIT refusal) are walked
            round by round there. The corner walk exercises the other bounded loop instead - the
            resurvey loop.

      - name: transition_shape_parallel_service_status_and_usage_priority
        claim_type: valid_transition
        grounds:
          - state_machines.Subscriber
          - entities.Subscriber.fields.usage_priority
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: subscriber_service_status_and_usage_priority_advance_independently
          rationale: |
            The parallel-machine claim - that a Subscriber's service_status and usage_priority are two
            independent state variables on one row, so a SUSPENDED account can still cross the soft
            cap and become DEPRIORITIZED - is exactly that instance's subject.

      - name: guarded_transition_sector_activation_requires_active_tower
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Sector.PLANNED_to_ACTIVE
          - errors[ERR_INVALID_TOWER_STATE]
        excluded_because:
          difficulty_instance: sector_activation_gated_on_parent_tower_status_active
          rationale: |
            The guard that a Sector may only be activated while its parent Tower is ACTIVE, and that
            the refusal is ERR_INVALID_TOWER_STATE rather than ERR_INVALID_SECTOR_STATE, is asserted
            there together with the ERR_LICENSE_NOT_EFFECTIVE sibling guard.

      - name: guarded_transition_completion_requires_pending_install_account
        claim_type: precondition_enforcement
        grounds:
          - state_machines.InstallWorkOrder.MOUNT_APPROVED_to_INSTALLED
          - errors[ERR_SUBSCRIBER_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: install_completion_gated_on_subscriber_pending_install_status
          rationale: |
            The referential guard on the completion path - the linked Subscriber must still be
            PENDING_INSTALL, otherwise ERR_SUBSCRIBER_NOT_ACTIVE - is asserted there, including the
            fact that a cancelled account cannot be revived through its work order.

  - section: calculations
    instances:
      - name: partial_obstruction_at_nine_km_qualifies_on_the_ground_pole_band
        claim_type: correct_result
        grounds:
          - calculations.los_qualification_mast_height
          - entities.ServiceabilityRequest.fields.desktop_los_margin_m
          - entities.ServiceabilityRequest.fields.desktop_required_mast_height_m
          - entities.ServiceabilityRequest.fields.desktop_mounting_type
          - state_machines.ServiceabilityRequest.EVALUATING_to_QUALIFIED
        distinguishing_aspect: |
          A 9.0 km PARTIAL path stacks the 4.5 m clearance band (8.0 < d <= 15.0), the 1.0 m partial
          penalty and the 0.5 m safety margin on an 8.0 m tree line: required_antenna_amsl_m is
          1180.0 + 8.0 + 4.5 + 1.0 + 0.5 = 1194.0, so desktop_los_margin_m is 1245.0 - 1194.0 = 51.0
          and the mast must reach 1194.0 - 1185.0 = 9.0 m exactly, which is the GROUND_POLE_MAST band
          (6.0 < 9.0 <= 12.0) and still inside MAX_MAST_HEIGHT_M, so the request QUALIFIES rather than
          being denied MAST_LIMIT_EXCEEDED.
