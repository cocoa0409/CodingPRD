  - rule_id: cross_entity_state_dependency
    instances:
      - name: store_kill_blocked_by_open_site_control
        grounds:
          - state_machines.Store.transitions
          - errors[ERR_SITE_CONTROL_ACTIVE]
        distinguishing_aspect: |
          Entity pair Store -> SiteControlAgreement: kill is legal only when
          the store has NO agreement with status NOT IN {TERMINATED,
          COMPLETED}; an EXECUTED agreement blocks the kill with
          ERR_SITE_CONTROL_ACTIVE, and the identical kill succeeds immediately
          after the agreement is terminated.
        test_recipe:
          setup:
            - "ACTIVE program; store S SITE_CONTROL with agreement AG EXECUTED (delivery 2026-11-01)"
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
