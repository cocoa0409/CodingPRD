            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

      - name: weighmaster_cannot_publish_price
        claim_type: cross_role_denial
        grounds: [roles, endpoints, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "A WeighMaster calling POST /yard/commodity-prices (a YardManager-exclusive op) is denied with ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "X", category: "FERROUS", spot_price_cents_per_lb: 10, mill_price_cents_per_lb: 12 }
              as: WeighMaster
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

      - name: missing_auth_headers_unauthenticated
        claim_type: missing_auth
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "POST /yard/sellers with an unknown role header returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /yard/sellers"
              payload: { legal_name: "NoAuth", id_type: "STATE_ID", id_number: "SID-NA" }
              as: Ghost
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: settlementaccountant_settle_excluded
        claim_type: exclusive_op
        grounds: [roles, endpoints]
        excluded_because:
          difficulty_instance: transitive_cascade / settle_cascade_shipment_hedge_close_depth3
          rationale: "SettlementAccountant's exclusive settle op is exercised in the named §1.8 cascade instance."

  # =========================================================================
  # Cross-Cutting Complexity Layers — OCC stale-version
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: dispatch_stale_container_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[dispatch-stale-container]", "errors[ERR_STALE_CONTAINER_VERSION]"]
        distinguishing_aspect: "A dispatch carrying the pre-load container version (captured before a release bumped it) is rejected with ERR_STALE_CONTAINER_VERSION (412)."
        test_recipe:
          setup: ["A STAGED container observed at version 1 BEFORE a ticket release bumps it to version 2."]
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "SHRED_STEEL", category: "FERROUS", spot_price_cents_per_lb: 11, mill_price_cents_per_lb: 14 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "OCC Co", id_type: "STATE_ID", id_number: "SID-OCC" }
              as: WeighMaster
              captures: { sid: $.data.id }
            - call: "POST /yard/containers"
              payload: { category: "FERROUS", capacity_lb: 5000 }
              as: YardManager
              captures: { cont_id: $.data.id, cont_v_pre: $.data.version }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${sid}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "SHRED_STEEL", weight_lb: 100 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/release"
              payload: { container_id: "${cont_id}" }
              as: WeighMaster
          trigger:
            - call: "POST /yard/containers/${cont_id}/dispatch"
              payload: { expected_container_version: "${cont_v_pre}" }
              as: YardManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_CONTAINER_VERSION"
            - "Container.${cont_id}.status == STAGED"

      - name: settle_stale_hedge_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[settle-stale-hedge]", "errors[ERR_STALE_HEDGE_VERSION]"]
        distinguishing_aspect: "Settling a second shipment against a hedge using the hedge version observed BEFORE a prior settlement realized against it (expected_hedge_version = ${hedge_v0}, now stale) is rejected with ERR_STALE_HEDGE_VERSION (412)."
        test_recipe:
          setup: ["A hedge realized once by shipment A (version advanced); shipment B SHIPPED and ready to settle, carrying the pre-realization hedge version."]
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "SHRED_STEEL", category: "FERROUS", spot_price_cents_per_lb: 11, mill_price_cents_per_lb: 14 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "OCC2 Co", id_type: "STATE_ID", id_number: "SID-OCC2" }
              as: WeighMaster
              captures: { sid: $.data.id }
            - call: "POST /yard/hedges"
              payload: { category: "FERROUS", hedged_weight_lb: 5000, locked_price_cents_per_lb: 90 }
              as: SettlementAccountant
              captures: { hedge_id: $.data.id, hedge_v0: $.data.version }
            - call: "POST /yard/containers"
              payload: { category: "FERROUS", capacity_lb: 5000 }
              as: YardManager
              captures: { cont_a: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${sid}", gross_weight_lb: 1000 }
              as: WeighMaster
              captures: { tkt_a: $.data.id }
            - call: "POST /yard/tickets/${tkt_a}/line-items"
              payload: { grade_code: "SHRED_STEEL", weight_lb: 100 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_a}/weigh-out"
              payload: { tare_weight_lb: 400 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_a}/release"
              payload: { container_id: "${cont_a}" }
              as: WeighMaster
            - call: "GET /yard/containers/${cont_a}"
              payload: {}
              as: YardManager
              captures: { cont_a_v: $.data.version }
            - call: "POST /yard/containers/${cont_a}/dispatch"
              payload: { expected_container_version: "${cont_a_v}" }
              as: YardManager
            - call: "POST /yard/mill-shipments"
              payload: { container_id: "${cont_a}", hedge_position_id: "${hedge_id}" }
              as: SettlementAccountant
              captures: { ship_a: $.data.id }
            - call: "POST /yard/mill-shipments/${ship_a}/settle"
              payload: { final_settlement_cents: 50000, expected_hedge_version: "${hedge_v0}" }
              as: SettlementAccountant
            - call: "POST /yard/containers"
              payload: { category: "FERROUS", capacity_lb: 5000 }
              as: YardManager
              captures: { cont_b: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${sid}", gross_weight_lb: 1000 }
              as: WeighMaster
              captures: { tkt_b: $.data.id }
            - call: "POST /yard/tickets/${tkt_b}/line-items"
              payload: { grade_code: "SHRED_STEEL", weight_lb: 100 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_b}/weigh-out"
              payload: { tare_weight_lb: 400 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_b}/release"
              payload: { container_id: "${cont_b}" }
              as: WeighMaster
            - call: "GET /yard/containers/${cont_b}"
              payload: {}
              as: YardManager
              captures: { cont_b_v: $.data.version }
            - call: "POST /yard/containers/${cont_b}/dispatch"
              payload: { expected_container_version: "${cont_b_v}" }
              as: YardManager
            - call: "POST /yard/mill-shipments"
              payload: { container_id: "${cont_b}", hedge_position_id: "${hedge_id}" }
              as: SettlementAccountant
              captures: { ship_b: $.data.id }
          trigger:
            - call: "POST /yard/mill-shipments/${ship_b}/settle"
              payload: { final_settlement_cents: 50000, expected_hedge_version: "${hedge_v0}" }
              as: SettlementAccountant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_HEDGE_VERSION"
            - "MillShipment.${ship_b}.status == SHIPPED"

      - name: container_version_increments_on_dispatch
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[dispatch-stale-container]", entities.Container.fields.version]
        distinguishing_aspect: "A successful dispatch with the correct expected_container_version increments Container.version by 1."
        test_recipe:
          setup: ["A STAGED container loaded by one released ticket; current version captured via GET."]
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "SHRED_STEEL", category: "FERROUS", spot_price_cents_per_lb: 11, mill_price_cents_per_lb: 14 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "VInc Co", id_type: "STATE_ID", id_number: "SID-VI" }
              as: WeighMaster
              captures: { sid: $.data.id }
            - call: "POST /yard/containers"
              payload: { category: "FERROUS", capacity_lb: 5000 }
              as: YardManager
              captures: { cont_id: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${sid}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "SHRED_STEEL", weight_lb: 100 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/release"
              payload: { container_id: "${cont_id}" }
              as: WeighMaster
            - call: "GET /yard/containers/${cont_id}"
              payload: {}
              as: YardManager
              captures: { cont_v: $.data.version }
          trigger:
            - call: "POST /yard/containers/${cont_id}/dispatch"
              payload: { expected_container_version: "${cont_v}" }
              as: YardManager
              captures: { v_after: $.data.version }
          assert:
            - "response.status == 200"
            - "Container.${cont_id}.status == DISPATCHED"

  # =========================================================================
  # Cascading side-effects (derived-field reconciliation)
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: report_freezes_seller_derived_count
        claim_type: derived_field_reconciliation
        grounds: [state_machines.ScaleTicket.WEIGHED_to_REPORTED, entities.Seller.fields.open_theft_reports]
        excluded_because:
          difficulty_instance: transitive_cascade / report_cascade_ticket_seller_freeze_depth2
          rationale: "The report->seller freeze derived-field cascade is asserted in the named §1.8 instance."

  # =========================================================================
  # Consistency model — immediate visibility
  # =========================================================================
  - section: consistency_model
    instances:
      - name: gross_valuation_visible_in_same_weighout_response
        claim_type: immediate
        grounds: [calculations.ticket_spot_valuation, entities.ScaleTicket.fields.gross_valuation_cents]
        distinguishing_aspect: "The frozen gross_valuation_cents is present in the weigh-out response body itself (immediate consistency), not only on a subsequent GET."
        test_recipe:
          setup: ["A DRAFT ticket with one 100 lb SHRED_STEEL line (spot 11)."]
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "SHRED_STEEL", category: "FERROUS", spot_price_cents_per_lb: 11, mill_price_cents_per_lb: 14 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "Imm2 Co", id_type: "STATE_ID", id_number: "SID-IM2" }
              as: WeighMaster
              captures: { sid: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${sid}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "SHRED_STEEL", weight_lb: 100 }
              as: WeighMaster
          trigger:
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
              captures: { gv: $.data.gross_valuation_cents }
          assert:
            - "response.status == 200"
            - "response.data.gross_valuation_cents == 1100"
