            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /api/visits/${vK2}/start", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/visits/${vK2}/complete", as: FieldSupervisor, as_user_id: "sup-1" }
