        grounds:
          - calculations.redistribution_transport_cost
          - entities.RedistributionOrder.fields.estimated_transport_cost_cents
          - entities.Market.fields.transfer_cost_per_km_cents
          - endpoints[POST /fleet/redistribution-orders]
        distinguishing_aspect: |
          This instance is about WHICH SUBTOTAL feeds a tier lookup rather than about
          rounding order: the fuel-surcharge tier is chosen from base_haul_cents alone,
          before the surcharge and the 7500 handling flat are added. Because the tier
          percentage falls as the haul grows, a 199 km haul costs 63220 while a longer
