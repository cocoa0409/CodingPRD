scaffold_corner_design:
  # =======================================================================
  - section: entities
    instances:
      - name: household_creation_returns_declared_defaults_and_zero_counters
        claim_type: Creation
        grounds:
          - entities.Household.fields.account_status
          - entities.Household.fields.entitled_device_count
          - endpoints[POST /smart-home-support/households]
        distinguishing_aspect: "A freshly created Household comes back with account_status ACTIVE, suspended_at null, entitled_device_count 0, active_device_count 0 and version 1."
        test_recipe:
          setup: ["Empty database with the logical clock at its default 2026-05-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /smart-home-support/households"
              payload: { name: "Fresh House", region_code: "NWA", billing_email: "fresh@example.com" }
              as: PlatformAdmin
              captures: { h_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "Household.${h_id}.account_status == ACTIVE"
            - "Household.${h_id}.suspended_at == null"
            - "Household.${h_id}.entitled_device_count == 0"
            - "Household.${h_id}.active_device_count == 0"
            - "Household.${h_id}.version == 1"
            - "response meta contains api_request_id and api_request_timestamp and response_type == object"

      - name: subscription_allow_overage_defaults_to_false_when_omitted
        claim_type: Defaults
        grounds:
          - entities.Subscription.fields.allow_overage
          - endpoints[POST /smart-home-support/subscriptions]
        distinguishing_aspect: "Omitting allow_overage yields false, and the subscription starts at cycle_index 1 with install_credits_remaining equal to the plan's included_install_credits (3)."
        test_recipe:
          setup: ["A PRO plan with included_install_credits 3 and a household, clock at 2026-05-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/subscription-plans"
              payload: { tier: "PRO", monthly_fee_cents: 9999, included_device_count: 2, overage_fee_cents_per_device: 299, coverage_mode: "TWENTY_FOUR_SEVEN", first_response_minutes_p1: 30, first_response_minutes_p2: 120, first_response_minutes_p3: 480, onsite_resolution_hours_p1: 24, onsite_resolution_hours_p2: 48, onsite_resolution_hours_p3: 96, warranty_extension_months: 12, included_install_credits: 3, advance_replacement_eligible: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /smart-home-support/households"
              payload: { name: "Default House", region_code: "NWA", billing_email: "def@example.com" }
              as: PlatformAdmin
              captures: { h_id: "$.data.id" }
          trigger:
            - call: "POST /smart-home-support/subscriptions"
              payload: { household_id: "${h_id}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id" }
          assert:
            - "Subscription.${sub_id}.allow_overage == false"
            - "Subscription.${sub_id}.status == ACTIVE"
            - "Subscription.${sub_id}.cycle_index == 1"
            - "Subscription.${sub_id}.monthly_fee_cents == 9999"
            - "Subscription.${sub_id}.cycle_start_at == 2026-05-01T00:00:00.000Z"
            - "Subscription.${sub_id}.cycle_end_at == 2026-05-31T00:00:00.000Z"
            - "Subscription.${sub_id}.install_credits_granted == 3 and install_credits_consumed == 0 and install_credits_remaining == 3"

      - name: device_system_and_computed_fields_ignore_client_supplied_values
        claim_type: System Fields
        grounds:
          - entities.Device.fields.lifecycle_status
          - entities.Device.fields.warranty_expires_at
          - endpoints[POST /smart-home-support/devices/claim]
        distinguishing_aspect: "POST /devices/claim accepts only household_id, catalog_entry_id, serial_number and purchase_date; lifecycle_status is server-set to CLAIMED, warranty_expires_at is computed to 2029-04-01T00:00:00.000Z from the 24-month base plus the PRO plan's 12-month extension, and version starts at 1."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z, a PRO plan with warranty_extension_months 12, a household with an OWNER and an ACTIVE subscription, and a HUB model with base_warranty_months 24."]
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/subscription-plans"
              payload: { tier: "PRO", monthly_fee_cents: 9999, included_device_count: 2, overage_fee_cents_per_device: 299, coverage_mode: "TWENTY_FOUR_SEVEN", first_response_minutes_p1: 30, first_response_minutes_p2: 120, first_response_minutes_p3: 480, onsite_resolution_hours_p1: 24, onsite_resolution_hours_p2: 48, onsite_resolution_hours_p3: 96, warranty_extension_months: 12, included_install_credits: 3, advance_replacement_eligible: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /smart-home-support/households"
              payload: { name: "Sys House", region_code: "NWA", billing_email: "sys@example.com" }
              as: PlatformAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /smart-home-support/households/${h_id}/members"
              payload: { full_name: "Sys O", email: "syso@example.com", member_role: "OWNER" }
              as: PlatformAdmin
              captures: { own_id: "$.data.id" }
            - call: "POST /smart-home-support/subscriptions"
              payload: { household_id: "${h_id}", plan_id: "${plan_id}", allow_overage: false }
              as: PlatformAdmin
            - call: "POST /smart-home-support/device-catalog"
              payload: { model_code: "HUB-X1", display_name: "Hub X1", device_class: "HUB", serial_prefix: "HBX", base_warranty_months: 24, requires_install: true, manufacturer_service_only: false, msrp_cents: 24900, current_firmware_version: "1.0.0" }
              as: PlatformAdmin
              captures: { cat_id: "$.data.id" }
          trigger:
            - call: "POST /smart-home-support/devices/claim"
              payload: { household_id: "${h_id}", catalog_entry_id: "${cat_id}", serial_number: "HBX000001", purchase_date: "2026-04-01" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { d_id: "$.data.id" }
          assert:
            - "Device.${d_id}.lifecycle_status == CLAIMED"
            - "Device.${d_id}.firmware_status == CURRENT"
            - "Device.${d_id}.activation_attempts == 0"
            - "Device.${d_id}.activation_expires_at == 2026-05-02T00:00:00.000Z"
            - "Device.${d_id}.warranty_basis == TIER_EXTENDED"
            - "Device.${d_id}.warranty_expires_at == 2029-04-01T00:00:00.000Z"
            - "Device.${d_id}.activated_at == null"
            - "Device.${d_id}.version == 1"

      - name: subscription_plan_is_immutable_configuration_without_version
        claim_type: Immutability
        grounds:
          - entities.SubscriptionPlan
          - endpoints[GET /smart-home-support/subscription-plans/{id}]
        distinguishing_aspect: "SubscriptionPlan declares common_fields false, so it exposes id and created_at but no updated_at and no version, and §1.5 offers no update or delete endpoint for it."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z and one PRO plan."]
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/subscription-plans"
              payload: { tier: "PRO", monthly_fee_cents: 9999, included_device_count: 2, overage_fee_cents_per_device: 299, coverage_mode: "TWENTY_FOUR_SEVEN", first_response_minutes_p1: 30, first_response_minutes_p2: 120, first_response_minutes_p3: 480, onsite_resolution_hours_p1: 24, onsite_resolution_hours_p2: 48, onsite_resolution_hours_p3: 96, warranty_extension_months: 12, included_install_credits: 3, advance_replacement_eligible: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "GET /smart-home-support/subscription-plans/${plan_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "HTTP status == 200"
            - "the response data has an id and a created_at"
            - "the response data has no version key and no updated_at key"
            - "SubscriptionPlan.${plan_id}.monthly_fee_cents == 9999 and included_device_count == 2"

      - name: device_list_returns_pagination_envelope_and_honours_limit
        claim_type: Listing
        grounds:
          - endpoints[GET /smart-home-support/devices]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /devices with limit=2 over three claimed devices returns exactly 2 rows with total_count 3 and has_more true, and response_type == array."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z, a PRO plan with included_device_count 5, a household with an OWNER and an ACTIVE subscription, and three claimed SENSOR devices."]
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/subscription-plans"
              payload: { tier: "PRO", monthly_fee_cents: 9999, included_device_count: 5, overage_fee_cents_per_device: 299, coverage_mode: "TWENTY_FOUR_SEVEN", first_response_minutes_p1: 30, first_response_minutes_p2: 120, first_response_minutes_p3: 480, onsite_resolution_hours_p1: 24, onsite_resolution_hours_p2: 48, onsite_resolution_hours_p3: 96, warranty_extension_months: 12, included_install_credits: 3, advance_replacement_eligible: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /smart-home-support/households"
              payload: { name: "Page House", region_code: "NWA", billing_email: "page@example.com" }
              as: PlatformAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /smart-home-support/households/${h_id}/members"
              payload: { full_name: "Pag E", email: "pag@example.com", member_role: "OWNER" }
              as: PlatformAdmin
              captures: { own_id: "$.data.id" }
            - call: "POST /smart-home-support/subscriptions"
              payload: { household_id: "${h_id}", plan_id: "${plan_id}", allow_overage: false }
              as: PlatformAdmin
            - call: "POST /smart-home-support/device-catalog"
              payload: { model_code: "SNS-B1", display_name: "Sensor B1", device_class: "SENSOR", serial_prefix: "SNB", base_warranty_months: 12, requires_install: false, manufacturer_service_only: false, msrp_cents: 4900, current_firmware_version: "1.2.0" }
              as: PlatformAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /smart-home-support/devices/claim"
              payload: { household_id: "${h_id}", catalog_entry_id: "${cat_id}", serial_number: "SNB000001", purchase_date: "2026-04-01" }
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /smart-home-support/devices/claim"
              payload: { household_id: "${h_id}", catalog_entry_id: "${cat_id}", serial_number: "SNB000002", purchase_date: "2026-04-01" }
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /smart-home-support/devices/claim"
              payload: { household_id: "${h_id}", catalog_entry_id: "${cat_id}", serial_number: "SNB000003", purchase_date: "2026-04-01" }
              as: Owner
              as_user_id: "${own_id}"
          trigger:
            - call: "GET /smart-home-support/devices?household_id=${h_id}&limit=2&offset=0"
              payload: {}
              as: PlatformAdmin
          assert:
            - "HTTP status == 200 and response_type == array"
            - "the response returns exactly 2 Device rows"
            - "total_count == 3 and has_more == true and limit == 2 and offset == 0"

      - name: ticket_creation_pins_computed_sla_targets_from_the_in_force_plan
        claim_type: Computed Fields
        grounds:
          - calculations.sla_target_selection
          - entities.Ticket.fields.first_response_target_minutes
          - entities.Ticket.fields.onsite_resolution_target_minutes
        distinguishing_aspect: "A P3 ticket on the PLUS plan is created with first_response_target_minutes 720 and onsite_resolution_target_minutes 10080 (168 hours x 60), and all three status axes at their initial values."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z, a PLUS plan (P3 first response 720 minutes, P3 onsite 168 hours), a household with an OWNER and an ACTIVE subscription."]
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/subscription-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 4999, included_device_count: 2, overage_fee_cents_per_device: 399, coverage_mode: "BUSINESS_HOURS", first_response_minutes_p1: 120, first_response_minutes_p2: 240, first_response_minutes_p3: 720, onsite_resolution_hours_p1: 48, onsite_resolution_hours_p2: 72, onsite_resolution_hours_p3: 168, warranty_extension_months: 6, included_install_credits: 1, advance_replacement_eligible: false }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /smart-home-support/households"
              payload: { name: "Target House", region_code: "NWA", billing_email: "tgt@example.com" }
              as: PlatformAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /smart-home-support/households/${h_id}/members"
              payload: { full_name: "Tar G", email: "tar@example.com", member_role: "OWNER" }
              as: PlatformAdmin
              captures: { own_id: "$.data.id" }
            - call: "POST /smart-home-support/subscriptions"
              payload: { household_id: "${h_id}", plan_id: "${plan_id}", allow_overage: false }
              as: PlatformAdmin
          trigger:
            - call: "POST /smart-home-support/tickets"
              payload: { household_id: "${h_id}", severity: "P3", summary: "App notifications delayed", opened_by_member_id: "${own_id}" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { t_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "Ticket.${t_id}.first_response_target_minutes == 720"
            - "Ticket.${t_id}.onsite_resolution_target_minutes == 10080"
            - "Ticket.${t_id}.workflow_status == NEW and sla_status == WITHIN and dispatch_status == NOT_REQUIRED"
            - "Ticket.${t_id}.remote_session_failure_count == 0 and sla_counted_minutes == 0"

      - name: device_claim_missing_required_serial_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=20]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /smart-home-support/devices/claim]
        distinguishing_aspect: "Omitting serial_number from a device claim is a body-shape failure at priority 20 and returns ERR_INVALID_REQUEST (400), before any prefix or entitlement rule is reached."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z, a PRO plan, a household with an OWNER, an ACTIVE subscription and a HUB catalog model."]
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/subscription-plans"
              payload: { tier: "PRO", monthly_fee_cents: 9999, included_device_count: 2, overage_fee_cents_per_device: 299, coverage_mode: "TWENTY_FOUR_SEVEN", first_response_minutes_p1: 30, first_response_minutes_p2: 120, first_response_minutes_p3: 480, onsite_resolution_hours_p1: 24, onsite_resolution_hours_p2: 48, onsite_resolution_hours_p3: 96, warranty_extension_months: 12, included_install_credits: 3, advance_replacement_eligible: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /smart-home-support/households"
              payload: { name: "Req House", region_code: "NWA", billing_email: "req@example.com" }
              as: PlatformAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /smart-home-support/households/${h_id}/members"
              payload: { full_name: "Req O", email: "reqo@example.com", member_role: "OWNER" }
              as: PlatformAdmin
              captures: { own_id: "$.data.id" }
            - call: "POST /smart-home-support/subscriptions"
              payload: { household_id: "${h_id}", plan_id: "${plan_id}", allow_overage: false }
              as: PlatformAdmin
            - call: "POST /smart-home-support/device-catalog"
              payload: { model_code: "HUB-X1", display_name: "Hub X1", device_class: "HUB", serial_prefix: "HBX", base_warranty_months: 24, requires_install: true, manufacturer_service_only: false, msrp_cents: 24900, current_firmware_version: "1.0.0" }
              as: PlatformAdmin
              captures: { cat_id: "$.data.id" }
          trigger:
            - call: "POST /smart-home-support/devices/claim"
              payload: { household_id: "${h_id}", catalog_entry_id: "${cat_id}", purchase_date: "2026-04-01" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "Household.${h_id}.entitled_device_count == 0"

      - name: household_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_HOUSEHOLD_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "A well-formed but unknown Household id returns ERR_HOUSEHOLD_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Clock at 2026-05-01T00:00:00Z, no households created."]
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /smart-home-support/households/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: "$.data.error_id" }
          assert: ["HTTP status == 404", "response data.error_id == ERR_HOUSEHOLD_NOT_FOUND"]

      - name: household_member_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_MEMBER_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "A well-formed but unknown HouseholdMember id returns ERR_MEMBER_NOT_FOUND with HTTP 404."
        test_recipe:
