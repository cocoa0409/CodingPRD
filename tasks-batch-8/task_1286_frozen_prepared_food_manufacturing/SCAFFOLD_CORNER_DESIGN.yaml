  # ============================================================ calculations
  - section: calculations
    instances:
      - name: scale_preview_clamps_factor_low
        claim_type: constants_applied
        grounds: [calculations.recipe_scale_up]
        distinguishing_aspect: "Raw factor 0.1 (100/1000) is clamped up to SCALE_MIN 0.25, so an 80 KG exponent-1.0 component scales to 20.000 rather than 8.000."
        test_recipe:
          setup: ["recipe R (base 1000) with one RAW component 80 KG exp 1.0"]
          setup_api_calls:
            - call: "POST /plant/recipes"
              payload: { name: "R-Clamp", product_style: "BOWL", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: PlantManager
              captures: { r_id: $.data.id }
            - { call: "POST /plant/recipes/${r_id}/components", payload: { component_name: "Base", component_type: "RAW_INGREDIENT", quantity_per_base_batch: 80, unit_of_measure: "KG", scale_exponent: 1.0 }, as: PlantManager }
          trigger:
            - call: "GET /plant/recipes/${r_id}/scale-preview"
              payload: { target_units: 100 }
              as: ProductionPlanner
          assert:
            - "scale_factor == 0.25 (clamped from raw 0.1)"
            - "component scaled_qty == 20.000 (80 * 0.25^1.0)"

      - name: freezer_duration_min_dwell_and_temp_factor
        claim_type: correct_result
        grounds: [calculations.freezer_cycle_duration]
        distinguishing_aspect: "Two boundary branches of one formula: a light cold load hits the MIN_DWELL_HOURS floor (max(4, 2) = 4), a heavy warm load applies ceil then the 1.25x factor then the floor (5)."
        test_recipe:
          setup: ["APPROVED recipe; order; batches B1 and B2 both COOKED; cells C1/C2 (rate 400)"]
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /plant/recipes"
              payload: { name: "R-Dur", product_style: "ENTREE", base_batch_yield_units: 1000, portion_weight_g: 340, shelf_life_days: 365 }
              as: PlantManager
              captures: { r_id: $.data.id }
            - { call: "POST /plant/recipes/${r_id}/components", payload: { component_name: "Sauce", component_type: "RAW_INGREDIENT", quantity_per_base_batch: 50, unit_of_measure: "KG" }, as: PlantManager }
            - { call: "POST /plant/recipes/${r_id}/approve", payload: {}, as: PlantManager }
            - { call: "POST /plant/freezer-cells", payload: { cell_code: "FC-1", capacity_kg: 2000, min_load_kg: 200, pull_down_kg_per_hour: 400, sanitation_minutes: 30 }, as: PlantManager, captures: { c1_id: $.data.id } }
            - { call: "POST /plant/freezer-cells", payload: { cell_code: "FC-2", capacity_kg: 2000, min_load_kg: 200, pull_down_kg_per_hour: 400, sanitation_minutes: 30 }, as: PlantManager, captures: { c2_id: $.data.id } }
            - call: "POST /plant/production-orders"
              payload: { recipe_id: "${r_id}", pack_format: "RETAIL", units_planned: 12000 }
              as: ProductionPlanner
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /plant/production-orders/${o_id}/batches"
              payload: { units_planned: 6000, expected_order_version: "${o_v}" }
              as: ProductionPlanner
              captures: { b1_id: $.data.id }
            - call: "GET /plant/production-orders/${o_id}"
              payload: {}
              as: ProductionPlanner
              captures: { o_v2: $.data.version }
            - call: "POST /plant/production-orders/${o_id}/batches"
              payload: { units_planned: 6000, expected_order_version: "${o_v2}" }
              as: ProductionPlanner
              captures: { b2_id: $.data.id }
            - { call: "POST /plant/production-batches/${b1_id}/kit", payload: {}, as: LineOperator }
            - { call: "POST /plant/production-batches/${b1_id}/cook", payload: { cooked_mass_kg: 800 }, as: LineOperator }
            - { call: "POST /plant/production-batches/${b2_id}/kit", payload: {}, as: LineOperator }
            - { call: "POST /plant/production-batches/${b2_id}/cook", payload: { cooked_mass_kg: 1600 }, as: LineOperator }
            - call: "GET /plant/production-batches/${b1_id}"
              payload: {}
              as: ProductionPlanner
              captures: { b1_v: $.data.version }
            - call: "GET /plant/production-batches/${b2_id}"
              payload: {}
              as: ProductionPlanner
              captures: { b2_v: $.data.version }
          trigger:
            - call: "POST /plant/production-batches/${b1_id}/freezing-cycles"
              payload: { cell_id: "${c1_id}", load_kg: 800, entry_temp_c: -5, planned_start: "2026-08-02T00:00:00Z", expected_batch_version: "${b1_v}" }
              as: ProductionPlanner
              captures: { cy1_hours: $.data.required_hours, cy1_end: $.data.planned_end }
            - call: "POST /plant/production-batches/${b2_id}/freezing-cycles"
              payload: { cell_id: "${c2_id}", load_kg: 1600, entry_temp_c: 5, planned_start: "2026-08-02T00:00:00Z", expected_batch_version: "${b2_v}" }
              as: ProductionPlanner
              captures: { cy2_hours: $.data.required_hours, cy2_end: $.data.planned_end }
          assert:
            - "B1 cycle: required_hours == 4 (max(4, ceil(800/400)=2), no temp factor at -5C), planned_end == 2026-08-02T04:00:00Z"
            - "B2 cycle: required_hours == 5 (ceil(1600/400)=4 -> ceil(4*1.25)=5 at +5C), planned_end == 2026-08-02T05:00:00Z"

      - name: cell_auto_select_best_fit_and_tiebreak
        claim_type: correct_result
        grounds: [calculations.cell_auto_select]
        distinguishing_aspect: "Auto-select ranks by capacity_kg ASC (best fit) and breaks the 2000-kg tie by created_at ASC then cell_code ASC, deterministically picking FC-F1 over FC-F2 and over the larger FC-BIG."
