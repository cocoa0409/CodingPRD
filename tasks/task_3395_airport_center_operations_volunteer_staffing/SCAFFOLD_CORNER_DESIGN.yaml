              payload: { new_end_date: "2028-08-31" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "renew rejected ERR_RENEWAL_WINDOW_NOT_OPEN (status ACTIVE, not RENEWAL_DUE)"
            - "agreement end_date unchanged (2027-08-31)"
      - name: posture_blocked_sleeping_area
        claim_type: conditional_validation
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_POSTURE_SERVICE_BLOCKED]"
        distinguishing_aspect: "Conditional gate on derived posture: RESTRICTED blocks SLEEPING_AREA/FAMILY_ROOM but allows SHOWER/CONNECTIVITY at the same instant on the same center."
        test_recipe:
