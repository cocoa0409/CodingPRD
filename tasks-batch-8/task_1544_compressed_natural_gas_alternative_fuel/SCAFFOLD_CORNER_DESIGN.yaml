            - { call: "POST /cng/fueling-sessions/${s1}/complete", payload: { metered_mass_kg: 25.0 }, as: FleetDriver, as_user_id: "${card_id}" }
            - { call: "POST /cng/fueling-sessions/${s1}/void", payload: { reason: "MANAGER_VOID" }, as: StationManager }
          trigger:
