    - name: duplicate_event_code_rejected_then_a_fresh_code_accepted
      claim_type: Violation → Error
      grounds:
      - validations[priority=24]
      - errors[ERR_EVENT_CODE_DUPLICATE]
      - endpoints[POST /sourcing/events]
      distinguishing_aspect: 'event_code is globally unique across MeetingEvents regardless of the other fields: re-using EVT-2822-A with a completely different name, programme type and date range still returns HTTP 409 ERR_EVENT_CODE_DUPLICATE and creates nothing, while the same body under EVT-2822-C is accepted - proving the uniqueness key is the code alone, not the (code, dates) pair.'
      test_recipe:
        setup:
        - Logical clock at 2026-08-05T09:00:00.000Z throughout.
        - One MeetingEvent already on file with event_code EVT-2822-A (2027-03-15..2027-03-18).
