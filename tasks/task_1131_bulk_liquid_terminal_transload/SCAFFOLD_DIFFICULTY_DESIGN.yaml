        distinguishing_aspect: |
          Depth-2 cascade from the cancel trigger (different trigger than the
          certify cascade): cancelling SCHEDULED movement A frees its dock window
          (link 1), and the freed window itself triggers the waitlist selector to
          promote NOMINATED movement B to SCHEDULED with resource_id set (link 2).
