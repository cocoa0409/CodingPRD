        as: SugarMaker
        as_user_id: ${grader_id}
      - call: POST /sugarhouse/syrup-lots/${lot_id}/grade
        payload:
          light_transmittance_pct: 80.0
        as: SugarMaker
        as_user_id: ${grader_id}
      trigger:
      - call: POST /sugarhouse/packaging-runs
        payload:
          syrup_lot_id: ${lot_id}
          container_type: DRUM_55
          units_planned: 1
        as: SugarhouseManager
        captures:
          prun1_id: $.data.id
      - call: POST /sugarhouse/packaging-runs/${prun1_id}/fill
        as: SugarhouseManager
      - call: GET /sugarhouse/syrup-lots/${lot_id}
        as: SugarhouseManager
        captures:
          unpackaged_mid: $.data.unpackaged_gallons
      - call: POST /sugarhouse/packaging-runs
        payload:
          syrup_lot_id: ${lot_id}
          container_type: RETAIL_QUART
          units_planned: 20
        as: SugarhouseManager
        captures:
          prun2_id: $.data.id
      - call: POST /sugarhouse/packaging-runs/${prun2_id}/fill
        as: SugarhouseManager
      - call: GET /sugarhouse/syrup-lots/${lot_id}
        as: SugarhouseManager
        captures:
          unpackaged_end: $.data.unpackaged_gallons
          lot_status: $.data.status
      assert:
      - 'after drum fill: unpackaged_gallons == 5.00 and 5.00 + 55.00 == 60.00 (invariant holds)'
      - 'after 20 quarts (20 x 0.25 = 5.00): unpackaged_gallons == 0.00 and 0.00 + 60.00 == 60.00'
      - SyrupLot.${lot_id}.status == EXHAUSTED
