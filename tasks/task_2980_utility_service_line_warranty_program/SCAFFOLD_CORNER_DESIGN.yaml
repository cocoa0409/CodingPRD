            - "${used_after} == 150000, ${reserved_after} == 0 and ${cap_after} == WITHIN_CAP  # COMPLETED leaves the {ASSIGNED, ACCEPTED, ON_SITE} reservation set and the BENEFIT_CHARGE row lands in the same cap year"
