  - name: poam_remediation_and_risk_dimensions_move_independently_on_one_row
    claim_type: parallel
    grounds:
    - state_machines.PoamItem
    - entities.PoamItem.fields.remediation_status
    - entities.PoamItem.fields.risk_disposition
    excluded_because:
      difficulty_instance: poam_remediation_and_risk_disposition_dimensions_advance_independently
      rationale: That instance drives both dimensions through four writes and asserts the full cross-product, which is exactly
        the `parallel` shape claim.
  - name: authorization_creation_cascades_down_to_the_offering_and_the_first_period
    claim_type: cascade_down
    grounds:
    - state_machines.AuthorizationPackage.UNDER_REVIEW_to_AUTHORIZED
    - state_machines.CloudServiceOffering.PACKAGE_SUBMITTED_to_AUTHORIZED
    excluded_because:
      difficulty_instance: authorize_package_chain_mints_authorization_period_and_reanchors_assessment_findings
      rationale: All four links of the authorize cascade are asserted there with literal timestamps, including the auto-created
        2026-03 period.
  - name: a_deficient_close_bubbles_through_the_authorization_into_the_grantee_agency
    claim_type: cross_entity
    grounds:
    - state_machines.MonitoringPeriod.OPEN_to_CLOSED_DEFICIENT
    - state_machines.ReuseGrant.PACKAGE_ACCESS_GRANTED_to_NOTICE_ISSUED
    excluded_because:
      difficulty_instance: deficient_period_close_chain_reaches_the_grantee_agency_notice_counter
      rationale: The five-link chain period -> Authorization -> ReuseGrant -> Agency.open_notice_count -> next period is asserted
        there.
  - name: only_grants_in_the_three_notifiable_states_receive_a_notice
    claim_type: conditional_cascade
    grounds:
    - state_machines.ReuseGrant.access_state_to_NOTICE_ISSUED
    excluded_because:
      difficulty_instance: deficient_period_close_chain_reaches_the_grantee_agency_notice_counter
      rationale: That instance holds a REQUESTED grant alongside an access-bearing one and asserts only the latter is moved
        to NOTICE_ISSUED.
  - name: cancelling_a_test_slot_reverses_every_hour_allocation_side_effect
    claim_type: compensation
    grounds:
    - state_machines.TestSlot.SCHEDULED_to_CANCELLED
    - calculations.engagement_hour_ledger
    excluded_because:
      difficulty_instance: engagement_hour_pool_is_conserved_across_allocation_cancel_and_reallocation
      rationale: The cancel/reallocate round trip is asserted there with the ledger identity holding at every step, including
        after a refused write.
  - name: the_authorization_ledger_re_derives_after_a_finding_closes
    claim_type: ledger_sync
    grounds:
    - entities.Authorization.fields.open_findings_count
    - entities.Authorization.fields.closed_findings_count
    excluded_because:
      difficulty_instance: supersede_item_chain_closes_the_replaced_finding_and_reconciles_the_authorization_ledger
      rationale: Before/after values of all four Authorization finding counters plus residual_risk_score are asserted across
        the supersession there.
