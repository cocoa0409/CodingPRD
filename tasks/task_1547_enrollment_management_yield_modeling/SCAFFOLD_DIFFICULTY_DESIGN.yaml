  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: deposit_state_error_beats_capacity_fiscal_error
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CAPACITY_FULL]
        distinguishing_aspect: |
          Error-category pair state (priority 5) vs business_fiscal (priority
          9): the deposit targets a WITHDRAWN application (fails the ADMITTED
          state gate) AND the program is at exactly capacity_seats (fails the
          fiscal gate); the response MUST be ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Program capacity 1, target 1, deposit 50000; cycle DECISIONS_RELEASED at clock 2027-04-01"
            - "A admitted and deposited (program now at capacity 1/1); B admitted then WITHDRAWN"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "ART", capacity_seats: 1, target_enrollment: 1, tuition_cents: 5000000, scholarship_budget_cents: 0, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_id: $.data.id }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "A One", email: "a1@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap_a: $.data.id }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "B Two", email: "b2@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap_b: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_a}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 80, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app_a: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_b}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 81, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app_b: $.data.id }
            # --- admit A (posture OPEN at 0 < 1) ---
            - { call: "POST /enrollment/applications/${app_a}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_a}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { ra1: $.data.id }
            - { call: "POST /enrollment/reviews/${ra1}/submit", payload: { score_academic: 80, score_fit: 80, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-1" }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_a}", reader_id: "reader-2", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { ra2: $.data.id }
            - { call: "POST /enrollment/reviews/${ra2}/submit", payload: { score_academic: 80, score_fit: 80, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-2" }
            - { call: "POST /enrollment/applications/${app_a}/transition", payload: { to_status: "DECISION_PENDING" }, as: AdmissionsOfficer }
            - { call: "POST /enrollment/applications/${app_a}/transition", payload: { to_status: "ADMITTED" }, as: AdmissionsOfficer }
            # --- admit B (still 0 deposited -> posture OPEN) ---
            - { call: "POST /enrollment/applications/${app_b}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_b}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { rb1: $.data.id }
            - { call: "POST /enrollment/reviews/${rb1}/submit", payload: { score_academic: 81, score_fit: 81, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-1" }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_b}", reader_id: "reader-2", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { rb2: $.data.id }
            - { call: "POST /enrollment/reviews/${rb2}/submit", payload: { score_academic: 81, score_fit: 81, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-2" }
            - { call: "POST /enrollment/applications/${app_b}/transition", payload: { to_status: "DECISION_PENDING" }, as: AdmissionsOfficer }
            - { call: "POST /enrollment/applications/${app_b}/transition", payload: { to_status: "ADMITTED" }, as: AdmissionsOfficer }
            # --- advance cycle, deposit for A (fills capacity), withdraw B ---
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "REVIEW_CLOSED" }, as: EnrollmentManager }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "DECISIONS_RELEASED" }, as: EnrollmentManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /enrollment/deposits", payload: { application_id: "${app_a}", amount_cents: 50000 }, as: Applicant, as_user_id: "${ap_a}" }
            - { call: "POST /enrollment/applications/${app_b}/transition", payload: { to_status: "WITHDRAWN" }, as: AdmissionsOfficer }
          trigger:
            - call: "POST /enrollment/deposits"
              payload: { application_id: "${app_b}", amount_cents: 50000 }
              as: Applicant
              as_user_id: "${ap_b}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE (http 409) — the state failure (application WITHDRAWN, not ADMITTED) outranks the fiscal failure (capacity 1/1 full)"
            - "error_id != ERR_CAPACITY_FULL"
            - "No Deposit row created for application ${app_b}"

      - name: review_submit_temporal_error_beats_score_constraint_error
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_REVIEW_WINDOW_CLOSED]
          - errors[ERR_SCORE_OUT_OF_RANGE]
        distinguishing_aspect: |
          Error-category pair business_temporal (priority 6) vs
          business_constraint (priority 7) — a different pair than
          state-vs-fiscal: the submit is both outside the review window AND
          carries score_academic 150; the response MUST be
          ERR_REVIEW_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "Cycle OPEN; application in COMMITTEE_REVIEW with one ASSIGNED review, window [2026-08-01, 2026-09-01); clock 2026-09-02 (past window end)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "PSY", capacity_seats: 5, target_enrollment: 3, tuition_cents: 5000000, scholarship_budget_cents: 0, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_id: $.data.id }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "T One", email: "t1@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap_id: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_id}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 77, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app_id: $.data.id }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_id}", reader_id: "reader-9", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r_id: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - call: "POST /enrollment/reviews/${r_id}/submit"
              payload: { score_academic: 150, score_fit: 80, recommendation: "ADMIT" }
              as: ApplicationReader
              as_user_id: "reader-9"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_REVIEW_WINDOW_CLOSED (http 409) — temporal (priority 6) beats constraint (priority 7)"
            - "error_id != ERR_SCORE_OUT_OF_RANGE"
            - "Review ${r_id}.status remains ASSIGNED"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: deposit_capacity_exactly_full_boundary
        grounds:
          - validations[priority=9]
          - errors[ERR_CAPACITY_FULL]
          - entities.Program.fields.seats_open
        distinguishing_aspect: |
          Seat-count metric on POST /enrollment/deposits: with capacity_seats 2,
