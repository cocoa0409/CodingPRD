# §1.8 Scaffold Difficulty Design - task_2411_household_staff_placement_agency
#
# Every call carries `as:` (the X-User-Role header) and, where segregation of duties
# matters, `as_user:` (the X-User-ID header). Every ${var} is bound by a `captures:` on
# an earlier call in the same recipe, and every literal is pre-computed from §1.3.
# The logical clock starts at DEFAULT_CLOCK_UTC 2026-08-01T00:00:00Z and only moves
# forward within a recipe.
scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: placement_fee_provisional_and_final_variants_diverge_by_one_cent
    grounds: calculations.placement_fee_computation (variants PROVISIONAL / FINAL); entities.Placement.fee_variant;
      state_machines.Placement.PENDING_ACCEPTANCE -> ACTIVE
    mechanism: The offer is priced from the requisition's aggregate first_year_compensation_cents with a single rounding
      step, and confirming the start re-prices the same placement from its four stored compensation components, rounding
      each component before summing. With fee_percent_bps 2233 and components 12002500 / 1502500 / 902500 / 592500
      - an aggregate of exactly 15000000, identical to the requisition figure - PROVISIONAL is 3349500 and FINAL is
      3349499.
    naive_implementation: Compute the fee once and reuse it, or recompute FINAL from the summed aggregate, so both
      variants read 3349500 and fee_variant never changes meaning.
    distinguishing_aspect: fee_cents changes from 3349500 to 3349499 across confirm-start even though total compensation
      is unchanged, and fee_variant flips PROVISIONAL -> FINAL.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Ashford House
          primary_contact_email: ops@ashford.example
          region_code: NY
        captures:
          client_id: $.data.id
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: Client
        payload:
          action: SIGN
          signatory_name: M. Ashford
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: AgencyPrincipal
        payload:
          action: COUNTERSIGN
      - call: POST /fee-schedules
        as: AgencyPrincipal
        payload:
          role_type: ESTATE_MANAGER
          comp_band_floor_cents: 0
          comp_band_ceiling_cents: 15000000
          fee_percent_bps: 2000
          guarantee_window_days: 90
          effective_from: '2026-01-01'
      - call: POST /fee-schedules
        as: AgencyPrincipal
        payload:
          role_type: ESTATE_MANAGER
          comp_band_floor_cents: 15000000
          comp_band_ceiling_cents: 30000000
          fee_percent_bps: 2233
          guarantee_window_days: 90
          effective_from: '2026-01-01'
      - call: POST /role-requisitions
        as: PlacementConsultant
        payload:
          client_id: ${client_id}
          role_type: ESTATE_MANAGER
          first_year_compensation_cents: 15000000
          schedule_pattern: FIVE_TWO
          live_in_required: true
        captures:
          req_id: $.data.id
      - call: POST /role-requisitions/${req_id}/scope
        as: PlacementConsultant
        payload:
          scope_note: Principal residence, two staff reports.
      - call: POST /role-requisitions/${req_id}/finalize-scope
        as: PlacementConsultant
        payload:
          note: Scope agreed with the household.
      - call: POST /candidates
        as: VettingSpecialist
        as_user: u_vet_1
        payload:
          full_name: R. Whitlock
          contact_email: rw@mail.example
          primary_role_type: ESTATE_MANAGER
          years_experience: 10
          live_in_willing: true
        captures:
          cand_id: $.data.id
      - call: POST /candidates/${cand_id}/reference-checks
        as: VettingSpecialist
        as_user: u_vet_1
        payload:
          principal_employer_name: Grantham Estate
          relationship_type: PRINCIPAL_EMPLOYER
          employment_start_month: 2022-01
          employment_end_month: 2022-12
          contact_email: grantham@mail.example
        captures:
          ref1_id: $.data.id
      - call: POST /candidates/${cand_id}/reference-checks
        as: VettingSpecialist
        as_user: u_vet_1
        payload:
          principal_employer_name: Ravensworth Hall
          relationship_type: PRINCIPAL_EMPLOYER
          employment_start_month: 2023-01
          employment_end_month: 2023-12
          contact_email: ravensworth@mail.example
          prior_reference_id: ${ref1_id}
        captures:
          ref2_id: $.data.id
      - call: POST /reference-checks/${ref1_id}/verify
        as: VettingSpecialist
        as_user: u_vet_2
        payload:
          outcome: VERIFIED
          verification_note: Spoke with the principal.
      - call: POST /reference-checks/${ref2_id}/verify
        as: VettingSpecialist
        as_user: u_vet_2
        payload:
          outcome: VERIFIED
          verification_note: Spoke with the principal.
      - call: POST /candidates/${cand_id}/background-verifications
        as: VettingSpecialist
        as_user: u_vet_2
        payload:
          provider_reference: BV-1001
          scope_items:
          - IDENTITY
          - CRIMINAL
        captures:
          bgv_id: $.data.id
      - call: POST /background-verifications/${bgv_id}/record-result
        as: VettingSpecialist
        as_user: u_vet_2
        payload:
          result: CLEARED
          findings_note: No adverse findings.
      - call: POST /role-requisitions/${req_id}/trial-engagements
        as: PlacementConsultant
        payload:
          candidate_id: ${cand_id}
          engagement_type: TRIAL_DAY
          start_at: '2026-08-10T09:00:00Z'
          end_at: '2026-08-10T17:00:00Z'
          day_rate_cents: 40000
        captures:
          trial_id: $.data.id
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-10T17:00:00Z'
      - call: POST /trial-engagements/${trial_id}/start
        as: PlacementConsultant
        payload:
          note: Household received the candidate.
      - call: POST /trial-engagements/${trial_id}/record-outcome
        as: PlacementConsultant
        payload:
          outcome: PASSED
          outcome_note: Household satisfied.
      - call: GET /role-requisitions/${req_id}
        as: PlacementConsultant
        captures:
          req_v1: $.data.version
      - call: POST /role-requisitions/${req_id}/accommodation-terms
        as: PlacementConsultant
        payload:
          candidate_id: ${cand_id}
          live_in: true
          weekly_hours: 45
          days_off_per_week: 2
          private_quarters: true
          imputed_accommodation_cents: 902500
          expected_requisition_version: ${req_v1}
          note: Quarters and schedule as discussed.
        captures:
          term_id: $.data.id
      - call: POST /accommodation-terms/${term_id}/respond
        as: Client
        payload:
          response: ACCEPT
          note: Terms agreed.
      - call: GET /role-requisitions/${req_id}
        as: PlacementConsultant
        captures:
          req_v2: $.data.version
      - call: POST /placements
        as: PlacementConsultant
        payload:
          requisition_id: ${req_id}
          candidate_id: ${cand_id}
          start_date: '2026-09-01'
          base_salary_cents: 12002500
          guaranteed_bonus_cents: 1502500
          accommodation_imputed_cents: 902500
          overtime_allowance_cents: 592500
          expected_requisition_version: ${req_v2}
        captures:
          plc_id: $.data.id
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-09-01T00:00:00Z'
      trigger:
      - call: POST /placements/${plc_id}/confirm-start
        as: AgencyPrincipal
        payload:
          note: Package confirmed on the start date.
      asserts:
      - the requisition after finalize-scope has fee_percent_bps == 2233 and provisional_fee_cents == 3349500
      - the placement created in setup has fee_cents == 3349500 and fee_variant == PROVISIONAL
      - the trigger returns 200 with fee_cents == 3349499 and fee_variant == FINAL
      - actual_first_year_compensation_cents == 15000000 - the aggregate is identical to the requisition figure, so
        the entire one-cent difference comes from the rounding position
      - fee_percent_bps == 2233 and guarantee_window_days == 90 on the placement after the trigger
      - guarantee_expires_on == 2026-11-30 (start_date 2026-09-01 plus 90 days, half-open)
      - GET /placements/${plc_id}/fee-milestones returns three rows in sequence_no order with amount_cents 1004850,
        1004850 and 1339799, summing to exactly 3349499
      - placement_status == ACTIVE, Candidate.availability_status == PLACED and RoleRequisition.status == PLACED after
        the trigger
  - name: vetting_score_variants_admit_to_trial_but_refuse_offer
    grounds: calculations.candidate_vetting_score (variants SCREENING / PLACEMENT_READY); entities.Candidate.screening_score;
      entities.Candidate.placement_ready_score; validations.candidate_score_threshold
    mechanism: Both variants read the same stored candidate, but SCREENING ignores background results and DISPUTED
      references and gates at 70, while PLACEMENT_READY adds 20 for a CLEARED background, subtracts 15 per DISPUTED
      reference and gates at 80. A housekeeper with years_experience 10 (30 points), two VERIFIED PRINCIPAL_EMPLOYER
      references (24, already at cap), reference_coverage_months 16 (16) and one DISPUTED reference scores exactly
      70 under SCREENING and 75 under PLACEMENT_READY.
    naive_implementation: Compute one score, store it and compare it to one threshold - the candidate is then either
      admitted at both steps or refused at both.
    distinguishing_aspect: The identical candidate row passes the trial-booking gate and is refused at the offer gate,
      with screening_score 70 and placement_ready_score 75 both readable on GET /candidates/{id}.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
