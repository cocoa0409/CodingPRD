            - call: "POST /districts/${d_id}/schools/${s_id}/students/${b_id}/tier-movements"
              payload: { to_tier: "TIER_3", rationale: "WINTER screen", expected_student_version: "${b_v3}" }
              as: TeamLead
              captures: { mv2_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings"
              payload: { scheduled_on: "2026-12-20" }
              as: TeamLead
              captures: { m2_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m2_id}/convene"
              payload: {}
              as: TeamLead
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${b_id}"
              payload: {}
              as: TeamLead
              captures: { b_v4: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m2_id}/ratify"
              payload: { movement_id: "${mv2_id}", expected_student_version: "${b_v4}" }
