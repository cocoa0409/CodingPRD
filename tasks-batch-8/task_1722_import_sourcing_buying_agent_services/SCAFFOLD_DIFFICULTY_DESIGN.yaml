# =============================================================================
# Task 1722 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# ≥ 2 instances per §0.5 rule; every instance grounded in SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: Factory vs PurchaseOrder)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: audit_screening_vs_onsite_same_inputs_diverge
        grounds:
          - calculations.audit_score
          - entities.FactoryAudit.fields.score
          - entities.FactoryAudit.fields.grade
        distinguishing_aspect: |
          Same category scores (95/92/90/88) and critical_findings=1 produce a
          SCREENING score of 92 (weights 0.35/0.25/0.25/0.15, no critical
          deduction) but an ONSITE score of 87 (weights 0.40/0.30/0.20/0.10,
          then minus 5 for the critical finding) — a Factory-domain dual-variant
          divergence on identical inputs.
        test_recipe:
          setup:
            - "Agent a1 exists; factory f1 exists (created by a1) with status ACTIVE"
            - "Logical clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /sourcing/agents"
              payload: { name: "Agent One", agency_name: "AgencyCo" }
              as: PlatformAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /sourcing/factories"
              payload: { name: "Factory One", country_code: "CN", monthly_capacity_units: 100000 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { f1_id: "$.data.id" }
          trigger:
            - call: "POST /sourcing/factories/${f1_id}/audits"
              payload: { audit_type: "SCREENING", quality_system_score: 95, social_compliance_score: 92, production_capability_score: 90, financial_stability_score: 88, critical_findings: 1 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { audit_screening_score: "$.data.score", audit_screening_grade: "$.data.grade" }
            - call: "POST /sourcing/factories/${f1_id}/audits"
              payload: { audit_type: "ONSITE", quality_system_score: 95, social_compliance_score: 92, production_capability_score: 90, financial_stability_score: 88, critical_findings: 1 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { audit_onsite_score: "$.data.score", audit_onsite_grade: "$.data.grade" }
          assert:
            - "audit_screening_score == 92"
            - "audit_onsite_score == 87"
            - "audit_screening_grade == 'A' and audit_onsite_grade == 'A' (92 >= 85; 87 >= 85) — grades may match but scores MUST differ"
            - "audit_screening_score != audit_onsite_score"

      - name: commission_provisional_vs_final_tier_shift
        grounds:
          - calculations.commission
          - entities.PurchaseOrder.fields.provisional_commission_cents
          - entities.PurchaseOrder.fields.final_commission_cents
          - state_machines.PurchaseOrder.SHIPPED_to_CLOSED
        distinguishing_aspect: |
          A PurchaseOrder whose provisional commission was computed at 5%
          (buyer YTD GMV including the PO = 9,500,000 < 10,000,000 at accept)
          closes after a second unrelated PO lifts the buyer's YTD GMV past
          10,000,000, so the final commission recomputes at 4%: 25,000 vs
          20,000 cents on the identical PO total of 500,000 — an order-domain
          provisional-vs-final divergence.
        test_recipe:
          setup:
            - "Buyer b1, agents a1 (assigned to SR1) and a2 (assigned to booster SR), inspector in0, factories f1 and f2 both grade-A (approved ONSITE audits); f2 has FURNITURE docs verified, f1 has APPAREL docs verified"
            - "Buyer b1 has ytd_gmv_cents = 9,000,000 from a CLOSED PO at f2 (PO0: ordered 450 units @ 20,000 = 9,000,000, fully shipped and receipt-confirmed)"
            - "SR1 (FOB mode, APPAREL) at b1 assigned to a1; quotation q1 from f1 at 25,000 cents/unit, moq 1, valid_until 2027-01-01, status OPEN"
            - "Booster SRB (FURNITURE, assigned a2) with quotation qB from f2 at 600,000 cents/unit ready to accept AFTER PO1 is created"
          setup_api_calls:
            - call: "POST /sourcing/buyers"
              payload: { name: "Buyer One", country_code: "US" }
              as: PlatformAdmin
              captures: { b1_id: "$.data.id" }
            - call: "POST /sourcing/agents"
              payload: { name: "Agent One", agency_name: "AgencyCo" }
              as: PlatformAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /sourcing/agents"
              payload: { name: "Agent Two", agency_name: "AgencyCo" }
              as: PlatformAdmin
              captures: { a2_id: "$.data.id" }
            - call: "POST /sourcing/inspectors"
              payload: { name: "Inspector Zero", region: "VN-North" }
              as: PlatformAdmin
              captures: { in0_id: "$.data.id" }
            - call: "POST /sourcing/factories"
              payload: { name: "Factory One", country_code: "CN", monthly_capacity_units: 100000 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { f1_id: "$.data.id" }
            - call: "POST /sourcing/factories"
              payload: { name: "Factory Two", country_code: "VN", monthly_capacity_units: 100000 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { f2_id: "$.data.id" }
            - call: "POST /sourcing/factories/${f1_id}/audits"
              payload: { audit_type: "ONSITE", quality_system_score: 95, social_compliance_score: 92, production_capability_score: 90, financial_stability_score: 88, critical_findings: 0 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { au1_id: "$.data.id" }
            - call: "POST /sourcing/audits/${au1_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /sourcing/factories/${f2_id}/audits"
              payload: { audit_type: "ONSITE", quality_system_score: 95, social_compliance_score: 92, production_capability_score: 90, financial_stability_score: 88, critical_findings: 0 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { au2_id: "$.data.id" }
            - call: "POST /sourcing/audits/${au2_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /sourcing/factories/${f2_id}/compliance-documents"
              payload: { doc_type: "FIRE_SAFETY", issued_date: "2026-01-01", expires_at: "2027-06-01T00:00:00Z" }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { d0_fs: "$.data.id" }
            - call: "POST /sourcing/compliance-documents/${d0_fs}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /sourcing/factories/${f2_id}/compliance-documents"
              payload: { doc_type: "PRODUCT_TEST", issued_date: "2026-01-01", expires_at: "2027-06-01T00:00:00Z" }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { d0_pt: "$.data.id" }
            - call: "POST /sourcing/compliance-documents/${d0_pt}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /sourcing/sourcing-requests"
              payload: { assigned_agent_id: "${a1_id}", title: "PO0 goods", product_category: "FURNITURE", target_price_cents: 20000, quantity: 450, commission_mode: "FOB" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { sr0_id: "$.data.id" }
            - call: "POST /sourcing/sourcing-requests/${sr0_id}/quotations"
              payload: { unit_price_cents: 20000, moq: 1, lead_time_days: 30, valid_until: "2027-01-01T00:00:00Z" }
              as: FactoryRep
              as_user_id: "${f2_id}"
              captures: { q0_id: "$.data.id", q0_v: "$.data.version" }
            - call: "POST /sourcing/quotations/${q0_id}/accept"
              payload: { ordered_qty: 450, delivery_month: "2026-09", expected_quotation_version: "${q0_v}" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { po0_id: "$.data.id" }
            - call: "POST /sourcing/purchase-orders/${po0_id}/milestones"
              payload: { name: "FULL", weight_pct: 100 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { m0_id: "$.data.id" }
            - call: "POST /sourcing/milestones/${m0_id}/submit"
              payload: { evidence_note: "done" }
              as: FactoryRep
              as_user_id: "${f2_id}"
            - call: "POST /sourcing/milestones/${m0_id}/verify"
              payload: {}
              as: SourcingAgent
              as_user_id: "${a1_id}"
            - call: "POST /sourcing/purchase-orders/${po0_id}/inspections"
              payload: { inspector_id: "${in0_id}", inspection_type: "PSI", scheduled_date: "2026-09-20", duration_days: 1, lot_size: 450 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { insp0_id: "$.data.id" }
            - call: "POST /sourcing/inspections/${insp0_id}/record-result"
              payload: { defects_critical: 0, defects_major: 1, defects_minor: 2 }
              as: Inspector
