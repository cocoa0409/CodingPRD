# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task_0712
# Difficulty: Expert
# Single top-level key: scaffold_corner_design
# Breadth probe: enumerative coverage of testable claims NOT already covered by §1.8.
# All instance names are unique across the union of §1.8 and §1.9.
# All grounds[*] resolve to real SCAFFOLD.yaml §1.1–§1.7 elements.
# excluded_because stubs cite §1.8 instances by their exact name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section 1 — Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: client_creation_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - endpoints.POST /grant-desk/clients
          - entities.Client.fields.status
          - entities.Client.fields.win_rate_pct
        distinguishing_aspect: "POST /grant-desk/clients with all required fields returns 201; status defaults to ACTIVE, proposals_submitted_count=0, proposals_won_count=0, win_rate_pct=0.0."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "New Org", ein: "20-0000001", mission_areas: ["EDUCATION"], annual_budget_cents: 4000000, contact_email: "n@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Client.${client_id}.status == ACTIVE"
            - "Client.${client_id}.proposals_submitted_count == 0"
            - "Client.${client_id}.proposals_won_count == 0"
            - "Client.${client_id}.win_rate_pct == 0.0"

      - name: client_retrieval_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - endpoints.GET /grant-desk/clients/{id}
          - entities.Client.fields.org_name
        distinguishing_aspect: "GET /grant-desk/clients/{id} returns the stored Client with org_name matching the created value."
        test_recipe:
          setup:
            - "One Client created."
          setup_api_calls:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "Stored Org", ein: "20-0000002", mission_areas: ["HEALTH"], annual_budget_cents: 3000000, contact_email: "s2@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id }
          trigger:
            - call: "GET /grant-desk/clients/${client_id}"
              payload: {}
              as: AccountManager
          assert:
            - "response.status == 200"
            - "response.data.org_name == \"Stored Org\""

      - name: opportunities_list_returns_paginated_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET /grant-desk/opportunities
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /grant-desk/opportunities returns a paginated list whose envelope carries total_count and has_more."
        test_recipe:
          setup:
            - "Two opportunities created."
          setup_api_calls:
            - call: "POST /grant-desk/opportunities"
              payload: { funder_name: "F1", title: "T1", focus_areas: ["EDUCATION"], ceiling_amount_cents: 100000, portal_name: "GRANTS_GOV", deadline_utc: "2026-12-31T00:00:00Z" }
              as: AccountManager
            - call: "POST /grant-desk/opportunities"
              payload: { funder_name: "F2", title: "T2", focus_areas: ["HEALTH"], ceiling_amount_cents: 200000, portal_name: "FOUNDANT", deadline_utc: "2026-12-31T00:00:00Z" }
              as: AccountManager
          trigger:
            - call: "GET /grant-desk/opportunities"
              payload: {}
              as: AccountManager
          assert:
            - "response.status == 200"
            - "response.data total_count == 2"
            - "response.data has_more == false"

      - name: client_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints.GET /grant-desk/clients/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /grant-desk/clients/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /grant-desk/clients/00000000-0000-4000-8000-000000000999"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: client_missing_required_org_name_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST /grant-desk/clients
          - entities.Client.fields.org_name
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=5]
        distinguishing_aspect: "POST /grant-desk/clients omitting required org_name returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /grant-desk/clients"
              payload: { ein: "20-0000003", mission_areas: ["EDUCATION"], annual_budget_cents: 1000000, contact_email: "m@x.org" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: client_duplicate_ein_among_non_archived_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Client.fields.ein
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=5]
        distinguishing_aspect: "Creating a second Client with an EIN already used by a non-ARCHIVED Client returns ERR_INVALID_REQUEST (422) — EIN uniqueness."
        test_recipe:
          setup:
            - "One ACTIVE client with ein=20-0000004."
          setup_api_calls:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "First", ein: "20-0000004", mission_areas: ["EDUCATION"], annual_budget_cents: 1000000, contact_email: "a@x.org" }
              as: AccountManager
          trigger:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "Second", ein: "20-0000004", mission_areas: ["HEALTH"], annual_budget_cents: 2000000, contact_email: "b@x.org" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: opportunity_floor_amount_default_zero_applied
        claim_type: Defaults
        grounds:
          - endpoints.POST /grant-desk/opportunities
          - entities.FundingOpportunity.fields.floor_amount_cents
        distinguishing_aspect: "Omitting floor_amount_cents on opportunity create applies default 0."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /grant-desk/opportunities"
              payload: { funder_name: "F", title: "Default Floor", focus_areas: ["EDUCATION"], ceiling_amount_cents: 500000, portal_name: "GRANTS_GOV", deadline_utc: "2026-12-31T00:00:00Z" }
              as: AccountManager
              captures: { opp: $.data.id }
          assert:
            - "response.status == 201"
            - "FundingOpportunity.${opp}.floor_amount_cents == 0"

      - name: budget_total_computed_field_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Proposal.fields.budget_total_cents
          - calculations.budget_total
        distinguishing_aspect: "Proposal.budget_total_cents is server-computed from BudgetLines; a fresh proposal with no lines reads 0 regardless of any client-supplied value (only engagement_id/match_id/requested_amount_cents are accepted inputs)."
        test_recipe:
          setup:
            - "A DRAFTING proposal with zero budget lines under an ACTIVE engagement and PURSUING match."
          setup_api_calls:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "Comp Org", ein: "20-0000005", mission_areas: ["EDUCATION"], annual_budget_cents: 5000000, contact_email: "c@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /grant-desk/opportunities"
              payload: { funder_name: "F", title: "Comp", focus_areas: ["EDUCATION"], ceiling_amount_cents: 9000000, portal_name: "GRANTS_GOV", deadline_utc: "2026-12-31T00:00:00Z" }
              as: AccountManager
              captures: { opp: $.data.id }
            - call: "POST /grant-desk/matches"
              payload: { client_id: "${client_id}", opportunity_id: "${opp}" }
              as: GrantWriter
              captures: { match_id: $.data.id }
            - call: "POST /grant-desk/matches/${match_id}/pursue"
              payload: {}
              as: GrantWriter
            - call: "POST /grant-desk/engagements"
              payload: { client_id: "${client_id}", fee_model: "HOURLY", hourly_rate_cents: 12000 }
              as: AccountManager
              captures: { eng: $.data.id }
            - call: "POST /grant-desk/engagements/${eng}/activate"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /grant-desk/proposals"
              payload: { engagement_id: "${eng}", match_id: "${match_id}", requested_amount_cents: 100000 }
              as: GrantWriter
              captures: { prop: $.data.id }
          assert:
            - "response.status == 201"
            - "Proposal.${prop}.budget_total_cents == 0"
            - "Proposal.${prop}.status == DRAFTING"
            - "Proposal.${prop}.revision_round == 0"

      - name: client_system_fields_generated_on_create
        claim_type: System Fields
        grounds:
          - entities.Client.fields.status
          - entities.Client.fields.org_name
        distinguishing_aspect: "On Client create the server mints id, created_at, updated_at, version=1, and sets status=ACTIVE itself; client-supplied status is ignored (status is source: system)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "Sys Org", ein: "20-0000006", mission_areas: ["EDUCATION"], annual_budget_cents: 1000000, contact_email: "sy@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id, v: $.data.version }
          assert:
            - "response.status == 201"
            - "Client.${client_id}.version == 1"
            - "Client.${client_id}.status == ACTIVE"

      - name: engagement_invalid_fee_model_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - endpoints.POST /grant-desk/engagements
          - entities.Engagement.fields.fee_model
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=5]
        distinguishing_aspect: "POST /grant-desk/engagements with fee_model=\"BARTER\" (not in SUCCESS_FEE|HOURLY|RETAINER) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "One ACTIVE client."
          setup_api_calls:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "Enum Org", ein: "20-0000007", mission_areas: ["EDUCATION"], annual_budget_cents: 1000000, contact_email: "e@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /grant-desk/engagements"
              payload: { client_id: "${client_id}", fee_model: "BARTER" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: proposal_create_wrong_engagement_fk_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Proposal.fields.engagement_id
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "POST /grant-desk/proposals referencing a non-existent engagement_id FK returns ERR_NOT_FOUND (404) — flat-topology FK reference validated."
        test_recipe:
          setup:
            - "A PURSUING match exists but the engagement_id FK is bogus."
          setup_api_calls:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "FK Org", ein: "20-0000008", mission_areas: ["EDUCATION"], annual_budget_cents: 5000000, contact_email: "fk@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /grant-desk/opportunities"
              payload: { funder_name: "F", title: "FK", focus_areas: ["EDUCATION"], ceiling_amount_cents: 9000000, portal_name: "GRANTS_GOV", deadline_utc: "2026-12-31T00:00:00Z" }
              as: AccountManager
              captures: { opp: $.data.id }
            - call: "POST /grant-desk/matches"
              payload: { client_id: "${client_id}", opportunity_id: "${opp}" }
              as: GrantWriter
              captures: { match_id: $.data.id }
            - call: "POST /grant-desk/matches/${match_id}/pursue"
              payload: {}
              as: GrantWriter
          trigger:
            - call: "POST /grant-desk/proposals"
              payload: { engagement_id: "00000000-0000-4000-8000-000000000111", match_id: "${match_id}", requested_amount_cents: 100000 }
              as: GrantWriter
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

  # ===========================================================================
  # Section 2 — State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: engagement_activate_from_draft_to_active_valid_transition
        claim_type: Valid Transition
        grounds:
          - state_machines.Engagement.DRAFT_to_ACTIVE
          - entities.Engagement.fields.status
        distinguishing_aspect: "POST /grant-desk/engagements/{id}/activate moves an HOURLY engagement (hourly_rate_cents>0) under an ACTIVE client from DRAFT to ACTIVE."
        test_recipe:
          setup:
            - "A DRAFT HOURLY engagement under an ACTIVE client, with hourly_rate_cents set."
          setup_api_calls:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "Act Org", ein: "20-0000009", mission_areas: ["EDUCATION"], annual_budget_cents: 5000000, contact_email: "ac@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /grant-desk/engagements"
              payload: { client_id: "${client_id}", fee_model: "HOURLY", hourly_rate_cents: 12000 }
              as: AccountManager
              captures: { eng: $.data.id }
          trigger:
            - call: "POST /grant-desk/engagements/${eng}/activate"
              payload: {}
              as: AccountManager
          assert:
            - "response.status == 200"
            - "Engagement.${eng}.status == ACTIVE"

      - name: engagement_activate_fee_model_incomplete_precondition
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Engagement.DRAFT_to_ACTIVE
          - errors[ERR_FEE_MODEL_INCOMPLETE]
          - entities.Engagement.fields.fee_model
        distinguishing_aspect: "Activating a SUCCESS_FEE engagement with success_fee_pct=0 (default) violates the fee-model-field precondition and returns ERR_FEE_MODEL_INCOMPLETE (409)."
        test_recipe:
          setup:
            - "A DRAFT SUCCESS_FEE engagement under an ACTIVE client with success_fee_pct unset (default 0)."
          setup_api_calls:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "Inc Org", ein: "20-0000010", mission_areas: ["EDUCATION"], annual_budget_cents: 5000000, contact_email: "in@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /grant-desk/engagements"
              payload: { client_id: "${client_id}", fee_model: "SUCCESS_FEE" }
              as: AccountManager
              captures: { eng: $.data.id }
          trigger:
            - call: "POST /grant-desk/engagements/${eng}/activate"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_FEE_MODEL_INCOMPLETE"

      - name: engagement_activate_client_not_active_precondition
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Engagement.DRAFT_to_ACTIVE
          - errors[ERR_CLIENT_NOT_ACTIVE]
          - entities.Client.fields.status
        distinguishing_aspect: "Activating an engagement whose client has been SUSPENDED returns ERR_CLIENT_NOT_ACTIVE (409)."
        test_recipe:
          setup:
            - "A DRAFT HOURLY engagement whose client was then SUSPENDED."
          setup_api_calls:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "Susp Org", ein: "20-0000011", mission_areas: ["EDUCATION"], annual_budget_cents: 5000000, contact_email: "su@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /grant-desk/engagements"
              payload: { client_id: "${client_id}", fee_model: "HOURLY", hourly_rate_cents: 12000 }
              as: AccountManager
              captures: { eng: $.data.id }
            - call: "POST /grant-desk/clients/${client_id}/suspend"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /grant-desk/engagements/${eng}/activate"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CLIENT_NOT_ACTIVE"

      - name: engagement_close_with_open_work_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Engagement.ACTIVE_to_CLOSED
          - errors[ERR_ENGAGEMENT_HAS_OPEN_WORK]
          - entities.Proposal.fields.status
        distinguishing_aspect: "Closing an ACTIVE engagement that still has a DRAFTING proposal returns ERR_ENGAGEMENT_HAS_OPEN_WORK (409)."
        test_recipe:
          setup:
            - "An ACTIVE engagement with one DRAFTING proposal attached."
          setup_api_calls:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "OW Org", ein: "20-0000012", mission_areas: ["EDUCATION"], annual_budget_cents: 5000000, contact_email: "ow@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /grant-desk/opportunities"
              payload: { funder_name: "F", title: "OW", focus_areas: ["EDUCATION"], ceiling_amount_cents: 9000000, portal_name: "GRANTS_GOV", deadline_utc: "2026-12-31T00:00:00Z" }
              as: AccountManager
              captures: { opp: $.data.id }
            - call: "POST /grant-desk/matches"
              payload: { client_id: "${client_id}", opportunity_id: "${opp}" }
              as: GrantWriter
              captures: { match_id: $.data.id }
            - call: "POST /grant-desk/matches/${match_id}/pursue"
              payload: {}
              as: GrantWriter
            - call: "POST /grant-desk/engagements"
              payload: { client_id: "${client_id}", fee_model: "HOURLY", hourly_rate_cents: 12000 }
              as: AccountManager
              captures: { eng: $.data.id }
            - call: "POST /grant-desk/engagements/${eng}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /grant-desk/proposals"
              payload: { engagement_id: "${eng}", match_id: "${match_id}", requested_amount_cents: 100000 }
              as: GrantWriter
          trigger:
            - call: "POST /grant-desk/engagements/${eng}/close"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ENGAGEMENT_HAS_OPEN_WORK"

      - name: proposal_approve_with_unapproved_deliverable_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Proposal.IN_REVIEW_to_APPROVED
          - errors[ERR_DELIVERABLES_NOT_APPROVED]
          - entities.Deliverable.fields.approval_status
        distinguishing_aspect: "Approving an IN_REVIEW proposal that has a deliverable still UNREVIEWED returns ERR_DELIVERABLES_NOT_APPROVED (409)."
        test_recipe:
          setup:
            - "An IN_REVIEW proposal with a NARRATIVE deliverable whose approval_status is still UNREVIEWED."
          setup_api_calls:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "NA Org", ein: "20-0000013", mission_areas: ["EDUCATION"], annual_budget_cents: 5000000, contact_email: "na@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /grant-desk/opportunities"
              payload: { funder_name: "F", title: "NA", focus_areas: ["EDUCATION"], ceiling_amount_cents: 9000000, portal_name: "GRANTS_GOV", deadline_utc: "2026-12-31T00:00:00Z" }
              as: AccountManager
              captures: { opp: $.data.id }
            - call: "POST /grant-desk/matches"
              payload: { client_id: "${client_id}", opportunity_id: "${opp}" }
              as: GrantWriter
              captures: { match_id: $.data.id }
            - call: "POST /grant-desk/matches/${match_id}/pursue"
              payload: {}
              as: GrantWriter
            - call: "POST /grant-desk/engagements"
              payload: { client_id: "${client_id}", fee_model: "HOURLY", hourly_rate_cents: 12000 }
              as: AccountManager
              captures: { eng: $.data.id }
            - call: "POST /grant-desk/engagements/${eng}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /grant-desk/proposals"
              payload: { engagement_id: "${eng}", match_id: "${match_id}", requested_amount_cents: 100000 }
              as: GrantWriter
              captures: { prop: $.data.id }
            - call: "POST /grant-desk/budget-lines"
              payload: { proposal_id: "${prop}", category: "PERSONNEL", label: "Staff", amount_cents: 100000 }
              as: GrantWriter
            - call: "POST /grant-desk/deliverables"
              payload: { proposal_id: "${prop}", kind: "NARRATIVE", title: "Narrative", body: "b" }
              as: GrantWriter
            - call: "POST /grant-desk/proposals/${prop}/submit-for-review"
              payload: {}
              as: GrantWriter
          trigger:
            - call: "POST /grant-desk/proposals/${prop}/approve"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DELIVERABLES_NOT_APPROVED"

      - name: proposal_submit_for_review_no_narrative_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Proposal.DRAFTING_to_IN_REVIEW
          - errors[ERR_NO_NARRATIVE]
          - entities.Deliverable.fields.kind
        distinguishing_aspect: "Submitting a proposal for review with a non-empty budget but no NARRATIVE deliverable returns ERR_NO_NARRATIVE (409)."
        test_recipe:
          setup:
            - "A DRAFTING proposal with a non-zero budget but zero deliverables of kind NARRATIVE."
          setup_api_calls:
            - call: "POST /grant-desk/clients"
              payload: { org_name: "NN Org", ein: "20-0000014", mission_areas: ["EDUCATION"], annual_budget_cents: 5000000, contact_email: "nn@x.org" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /grant-desk/opportunities"
              payload: { funder_name: "F", title: "NN", focus_areas: ["EDUCATION"], ceiling_amount_cents: 9000000, portal_name: "GRANTS_GOV", deadline_utc: "2026-12-31T00:00:00Z" }
              as: AccountManager
              captures: { opp: $.data.id }
            - call: "POST /grant-desk/matches"
              payload: { client_id: "${client_id}", opportunity_id: "${opp}" }
              as: GrantWriter
              captures: { match_id: $.data.id }
            - call: "POST /grant-desk/matches/${match_id}/pursue"
              payload: {}
              as: GrantWriter
            - call: "POST /grant-desk/engagements"
              payload: { client_id: "${client_id}", fee_model: "HOURLY", hourly_rate_cents: 12000 }
              as: AccountManager
              captures: { eng: $.data.id }
            - call: "POST /grant-desk/engagements/${eng}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /grant-desk/proposals"
              payload: { engagement_id: "${eng}", match_id: "${match_id}", requested_amount_cents: 100000 }
              as: GrantWriter
              captures: { prop: $.data.id }
