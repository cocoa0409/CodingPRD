          - state_machines.Appointment.transitions
        distinguishing_aspect: "Half-open interval semantics on the Provider resource: a slot starting exactly when another ends (10:30 after 10:00-10:30) is ACCEPTED, while any strict interior overlap is rejected — adjacency is not a conflict."
