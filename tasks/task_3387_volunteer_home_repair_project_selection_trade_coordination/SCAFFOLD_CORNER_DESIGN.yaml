# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3387_volunteer_home_repair_project_selection_trade_coordination
# Breadth probe over §1.1–§1.7 claims that SCAFFOLD_DIFFICULTY_DESIGN.yaml does
# not already exercise. Covered corners appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: funding_cycle_create_applies_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.FundingCycle
          - endpoints.POST_/rebuild/funding-cycles
        distinguishing_aspect: "A cycle created without priority_mode returns 201 with status OPEN, priority_mode STANDARD, pool == total_budget, reserved 0, spent 0, available == total_budget, version 1, and system-stamped id/created_at/updated_at."
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-09-01T00:00:00Z default (no clock call needed)."
          setup_api_calls: []
          trigger:
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27 Bare", fiscal_year: 2027, total_budget_cents: 750000 }
              as: PlatformAdmin
              captures: { cyc: $.data.id, st: $.data.status, pm: $.data.priority_mode, pool: $.data.pool_cents, resv: $.data.reserved_cents, spent: $.data.spent_cents, avail: $.data.available_cents, ver: $.data.version }
          assert:
            - "the response status is 201 with response_type object"
            - "st == OPEN and pm == STANDARD (default applied)"
            - "pool == 750000 and avail == 750000 and resv == 0 and spent == 0"
            - "ver == 1 and the data carries non-null id, created_at, updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: volunteer_registration_applies_defaults
        claim_type: Defaults
        grounds:
          - entities.Volunteer
          - endpoints.POST_/rebuild/volunteers
        distinguishing_aspect: "Open registration with only full_name and email yields skills [], team_leader_eligible false, status REGISTERED, null waiver/training dates, and is_eligible false."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /rebuild/volunteers"
              payload: { full_name: "Bare Vol", email: "bare@x.example" }
              as: Anonymous
              captures: { v: $.data.id, skills: $.data.skills, tle: $.data.team_leader_eligible, st: $.data.status, elig: $.data.is_eligible }
          assert:
            - "the response status is 201"
            - "skills == [] and tle == false and st == REGISTERED"
            - "elig == false (no waiver, no training)"
            - "Volunteer.${v}.waiver_signed_on is null and safety_training_completed_on is null"

      - name: application_create_missing_required_income_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.HomeownerApplication.fields.household_income_cents
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting household_income_cents (a required input with no default) is rejected as ERR_INVALID_REQUEST while every defaulted or optional field may be omitted."
        test_recipe:
          setup:
            - "One funding cycle exists."
          setup_api_calls:
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27", fiscal_year: 2027, total_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { cyc: $.data.id }
          trigger:
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "No Income", date_of_birth: "1990-01-01", household_size: 1, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "1 Missing St" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST and the HTTP status is 400"
            - "no HomeownerApplication record is created"

      - name: contractor_create_with_invalid_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.TradeContractor.fields.trade
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "trade 'GLAZIER' is outside the declared enum {CARPENTRY, ELECTRICAL, PLUMBING, ROOFING, HVAC} and is rejected before any record is written."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /rebuild/trade-contractors"
              payload: { legal_name: "Glass Co", trade: "GLAZIER", license_number: "G-1", license_expires_on: "2028-01-01", insurance_expires_on: "2028-01-01" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST and the HTTP status is 400"

      - name: volunteer_get_unknown_id_returns_volunteer_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_VOLUNTEER_NOT_FOUND]
          - endpoints.GET_/rebuild/volunteers/{volunteerId}
        distinguishing_aspect: "A well-formed UUID that matches no volunteer returns 404 ERR_VOLUNTEER_NOT_FOUND, not a generic 500 or null body."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /rebuild/volunteers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VOLUNTEER_NOT_FOUND and the HTTP status is 404"
            - "response_type == error and data.message is non-empty"

      - name: applications_list_paginates_and_reports_total_count
        claim_type: Listing
        grounds:
          - endpoints.GET_/rebuild/applications
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three applications on the cycle, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; the funding_cycle_id filter scopes the set."
        test_recipe:
          setup:
            - "One cycle with three SUBMITTED applications."
          setup_api_calls:
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27", fiscal_year: 2027, total_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { cyc: $.data.id }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "P One", date_of_birth: "1990-01-01", household_size: 1, household_income_cents: 1000000, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "1 Page St" }
              as: Anonymous
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "P Two", date_of_birth: "1991-01-01", household_size: 2, household_income_cents: 2000000, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "2 Page St" }
              as: Anonymous
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "P Three", date_of_birth: "1992-01-01", household_size: 3, household_income_cents: 3000000, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "3 Page St" }
              as: Anonymous
          trigger:
            - call: "GET /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", limit: 2, offset: 0 }
              as: AffiliateStaff
            - call: "GET /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", limit: 2, offset: 2 }
              as: AffiliateStaff
          assert:
            - "page 1 returns exactly 2 data rows with total_count == 3 and has_more == true"
            - "page 2 returns exactly 1 data row with total_count == 3 and has_more == false"
            - "every row's funding_cycle_id == ${cyc}"

      - name: sponsor_create_extra_field_ignored_input
        claim_type: System Fields
        grounds:
          - endpoints.POST_/rebuild/sponsors
          - entities.Sponsor
        distinguishing_aspect: "Client-supplied system fields (id, version, created_at) in the create body are ignored: the server mints its own id, version is 1, and the junk never persists."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /rebuild/sponsors"
              payload: { name: "Junk Fields Inc", contact_email: "j@x.example", id: "client-minted", version: 99, created_at: "1970-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sp: $.data.id, ver: $.data.version }
          assert:
            - "the response status is 201"
            - "ver == 1 and sp != \"client-minted\" (server-minted UUID)"
            - "GET /rebuild/sponsors/${sp} shows created_at stamped by the server in 2026, not 1970"

      - name: work_orders_list_filters_by_contractor_and_status
        claim_type: Parent Relationships
        grounds:
          - endpoints.GET_/rebuild/trade-work-orders
          - entities.TradeWorkOrder.fields.contractor_id
          - entities.TradeWorkOrder.fields.project_id
        distinguishing_aspect: "The dual-FK filtered list returns exactly the rows matching contractor_id or project_id, proving both reverse-reachability filters work independently."
        test_recipe:
          setup:
            - "One selected project with two ELECTRICAL items and one PLUMBING item; an ELECTRICAL contractor and a PLUMBING contractor; WO_E covers both electrical items, WO_P covers the plumbing item."
          setup_api_calls:
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27", fiscal_year: 2027, total_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { cyc: $.data.id }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "Filter Site", date_of_birth: "1990-01-01", household_size: 1, household_income_cents: 1000000, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "4 Filter St" }
              as: Anonymous
              captures: { app: $.data.id }
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "UNDER_VERIFICATION" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "VERIFIED" }
              as: AffiliateStaff
            - call: "POST /rebuild/assessments"
              payload: { application_id: "${app}", scheduled_on: "2026-09-02" }
              as: AffiliateStaff
              captures: { asm: $.data.id }
            - call: "POST /rebuild/assessments/${asm}/complete"
              payload: { safety_hazard_max_severity: 1, accessibility_needs_count: 0, scope_items: [{ category: "CRITICAL_SYSTEMS", required_trade: "ELECTRICAL", volunteer_performable: false, requires_permit: false, est_low_cents: 50000, est_high_cents: 50000, description: "e1" }, { category: "CRITICAL_SYSTEMS", required_trade: "ELECTRICAL", volunteer_performable: false, requires_permit: false, est_low_cents: 50000, est_high_cents: 50000, description: "e2" }, { category: "CRITICAL_SYSTEMS", required_trade: "PLUMBING", volunteer_performable: false, requires_permit: false, est_low_cents: 50000, est_high_cents: 50000, description: "p1" }] }
              as: Assessor
            - call: "PATCH /rebuild/assessments/${asm}"
              payload: { status: "SCOPED" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "CANDIDATE" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/funding-cycles/${cyc}"
              payload: { status: "SELECTION_OPEN" }
              as: PlatformAdmin
              captures: { cyc_v: $.data.version }
            - call: "POST /rebuild/funding-cycles/${cyc}/selection-runs"
              payload: { expected_funding_cycle_version: "${cyc_v}" }
              as: AffiliateStaff
              captures: { run: $.data.id }
            - call: "POST /rebuild/selection-runs/${run}/apply"
              payload: {}
              as: AffiliateStaff
            - call: "GET /rebuild/projects"
              payload: { application_id: "${app}" }
              as: Any
              captures: { proj: "$.data[0].id" }
            - call: "GET /rebuild/scope-items"
              payload: { assessment_id: "${asm}" }
              as: Any
              captures: { si1: "$.data[0].id", si2: "$.data[1].id", si3: "$.data[2].id" }
            - call: "POST /rebuild/trade-contractors"
              payload: { legal_name: "E Co", trade: "ELECTRICAL", license_number: "E-1", license_expires_on: "2028-01-01", insurance_expires_on: "2028-01-01" }
              as: PlatformAdmin
              captures: { contr_e: $.data.id }
            - call: "POST /rebuild/trade-contractors"
              payload: { legal_name: "P Co", trade: "PLUMBING", license_number: "P-1", license_expires_on: "2028-01-01", insurance_expires_on: "2028-01-01" }
              as: PlatformAdmin
              captures: { contr_p: $.data.id }
            - call: "POST /rebuild/trade-work-orders"
              payload: { project_id: "${proj}", contractor_id: "${contr_e}", scope_item_ids: ["${si1}", "${si2}"] }
              as: AffiliateStaff
              captures: { wo_e: $.data.id }
            - call: "POST /rebuild/trade-work-orders"
              payload: { project_id: "${proj}", contractor_id: "${contr_p}", scope_item_ids: ["${si3}"] }
              as: AffiliateStaff
              captures: { wo_p: $.data.id }
          trigger:
            - call: "GET /rebuild/trade-work-orders"
              payload: { contractor_id: "${contr_p}" }
              as: Any
            - call: "GET /rebuild/trade-work-orders"
              payload: { project_id: "${proj}" }
              as: Any
          assert:
            - "the contractor_id filter returns exactly 1 row and its id == ${wo_p}"
            - "the project_id filter returns exactly 2 rows (total_count == 2)"
            - "both rows carry status QUOTE_REQUESTED and the work order's trade field matches its contractor"

      - name: assessment_complete_stamps_completed_on_from_clock
        claim_type: Computed Fields
        grounds:
          - entities.HomeAssessment.fields.completed_on
          - state_machines.HomeAssessment.SCHEDULED_to_COMPLETED
        distinguishing_aspect: "completed_on is stamped from the logical clock at completion (2026-09-01), never from client input, and ScopeItem midpoints are computed server-side."
        test_recipe:
          setup:
            - "Clock explicitly at 2026-09-01T00:00:00Z. Application VERIFIED with a SCHEDULED assessment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27", fiscal_year: 2027, total_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { cyc: $.data.id }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "Stamp Site", date_of_birth: "1990-01-01", household_size: 1, household_income_cents: 1000000, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "5 Stamp St" }
              as: Anonymous
              captures: { app: $.data.id }
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "UNDER_VERIFICATION" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "VERIFIED" }
              as: AffiliateStaff
            - call: "POST /rebuild/assessments"
              payload: { application_id: "${app}", scheduled_on: "2026-09-02" }
              as: AffiliateStaff
              captures: { asm: $.data.id }
          trigger:
            - call: "POST /rebuild/assessments/${asm}/complete"
              payload: { safety_hazard_max_severity: 2, accessibility_needs_count: 1, scope_items: [{ category: "SAFETY", required_trade: "NONE", volunteer_performable: true, requires_permit: false, est_low_cents: 100000, est_high_cents: 200001, description: "rail" }] }
              as: Assessor
              captures: { completed: $.data.completed_on, st: $.data.status }
            - call: "GET /rebuild/scope-items"
              payload: { assessment_id: "${asm}" }
              as: Any
              captures: { mid: "$.data[0].midpoint_cents" }
          assert:
            - "st == COMPLETED and completed == 2026-09-01 (logical clock date, not the 2026-09-02 scheduled date)"
            - "mid == 150001 (round_half_up((100000 + 200001) / 2) = round_half_up(150000.5) rounds up)"

      - name: application_is_older_adult_birthday_boundary
        claim_type: Computed Fields
        grounds:
          - entities.HomeownerApplication.fields.is_older_adult
        distinguishing_aspect: "The 62-year threshold is calendar-exact and inclusive: born 1964-09-01 is older_adult on 2026-09-01; born one day later is not."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. One cycle."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27", fiscal_year: 2027, total_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { cyc: $.data.id }
          trigger:
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "Born On", date_of_birth: "1964-09-01", household_size: 1, household_income_cents: 1000000, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "6 Boundary St" }
              as: Anonymous
              captures: { older_on: $.data.is_older_adult }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "Born After", date_of_birth: "1964-09-02", household_size: 1, household_income_cents: 1000000, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "7 Boundary St" }
              as: Anonymous
              captures: { older_after: $.data.is_older_adult }
          assert:
            - "older_on == true (62nd birthday exactly is inclusive)"
            - "older_after == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: event_terminal_cancelled_rejects_execute
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.RebuildEvent
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A CANCELLED event is terminal: PATCH to EXECUTED is rejected and no attendance or scope-item side effects fire."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. One selected volunteer-only project; its event was PUBLISHED then CANCELLED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27", fiscal_year: 2027, total_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { cyc: $.data.id }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "Term Site", date_of_birth: "1990-01-01", household_size: 1, household_income_cents: 1000000, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "8 Terminal St" }
              as: Anonymous
              captures: { app: $.data.id }
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "UNDER_VERIFICATION" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "VERIFIED" }
              as: AffiliateStaff
            - call: "POST /rebuild/assessments"
              payload: { application_id: "${app}", scheduled_on: "2026-09-02" }
              as: AffiliateStaff
              captures: { asm: $.data.id }
            - call: "POST /rebuild/assessments/${asm}/complete"
              payload: { safety_hazard_max_severity: 0, accessibility_needs_count: 0, scope_items: [{ category: "GENERAL", required_trade: "NONE", volunteer_performable: true, requires_permit: false, est_low_cents: 100000, est_high_cents: 100000, description: "paint" }] }
              as: Assessor
            - call: "PATCH /rebuild/assessments/${asm}"
              payload: { status: "SCOPED" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "CANDIDATE" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/funding-cycles/${cyc}"
              payload: { status: "SELECTION_OPEN" }
              as: PlatformAdmin
              captures: { cyc_v: $.data.version }
            - call: "POST /rebuild/funding-cycles/${cyc}/selection-runs"
              payload: { expected_funding_cycle_version: "${cyc_v}" }
              as: AffiliateStaff
              captures: { run: $.data.id }
            - call: "POST /rebuild/selection-runs/${run}/apply"
              payload: {}
              as: AffiliateStaff
            - call: "GET /rebuild/projects"
              payload: { application_id: "${app}" }
              as: Any
              captures: { proj: "$.data[0].id" }
            - call: "POST /rebuild/events"
              payload: { project_id: "${proj}", name: "Doomed Day", event_date: "2026-10-10", max_volunteers: 2 }
              as: AffiliateStaff
              captures: { ev: $.data.id }
            - call: "PATCH /rebuild/events/${ev}"
              payload: { status: "PUBLISHED" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/events/${ev}"
              payload: { status: "CANCELLED" }
              as: AffiliateStaff
          trigger:
            - call: "PATCH /rebuild/events/${ev}"
              payload: { status: "EXECUTED" }
              as: AffiliateStaff
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "RebuildEvent.${ev}.status == CANCELLED"

      - name: application_jump_submitted_to_candidate_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.HomeownerApplication
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "SUBMITTED -> CANDIDATE skips UNDER_VERIFICATION/VERIFIED/ASSESSING/ASSESSED and is rejected; only the declared from-states accept the transition."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. One cycle; one fresh SUBMITTED application."
          setup_api_calls:
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27", fiscal_year: 2027, total_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { cyc: $.data.id }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "Skipper", date_of_birth: "1990-01-01", household_size: 1, household_income_cents: 1000000, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "9 Skip St" }
              as: Anonymous
              captures: { app: $.data.id }
          trigger:
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "CANDIDATE" }
              as: AffiliateStaff
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "HomeownerApplication.${app}.status == SUBMITTED"

      - name: commitment_withdrawn_is_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.SponsorshipCommitment
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A WITHDRAWN commitment cannot be revived: PATCH to RECEIVED after withdrawal fails, and the pool is unchanged by the attempt."
        test_recipe:
          setup:
            - "One cycle (budget 1000000); one sponsor; one commitment withdrawn from PLEDGED."
          setup_api_calls:
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27", fiscal_year: 2027, total_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { cyc: $.data.id }
            - call: "POST /rebuild/sponsors"
              payload: { name: "Term Sponsor", contact_email: "t@x.example" }
              as: PlatformAdmin
              captures: { sp: $.data.id }
            - call: "POST /rebuild/commitments"
              payload: { sponsor_id: "${sp}", funding_cycle_id: "${cyc}", amount_cents: 500000 }
              as: AffiliateStaff
              captures: { com: $.data.id }
            - call: "PATCH /rebuild/commitments/${com}"
              payload: { status: "WITHDRAWN" }
              as: AffiliateStaff
          trigger:
            - call: "PATCH /rebuild/commitments/${com}"
              payload: { status: "RECEIVED" }
              as: AffiliateStaff
              captures: { err: $.data.error_id }
