      - name: second_pre_application_document_filing_rejected
        claim_type: idempotency
        grounds:
          - validations[priority=43]
          - state_machines.RelicensingProject.PRE_FILING_to_PAD_FILED
        distinguishing_aspect: "The PAD filing is not idempotent by design: the second call finds stage PAD_FILED (or STUDY_PHASE) instead of PRE_FILING and is rejected, so pad_filed_at cannot be overwritten by a re-submission."
        test_recipe:
          setup:
            - "Project whose PAD has already been filed at clock 2026-08-01, so stage is PAD_FILED and pad_year is 2026."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9019", project_name: "Double PAD Dam", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
              as: Regulator
