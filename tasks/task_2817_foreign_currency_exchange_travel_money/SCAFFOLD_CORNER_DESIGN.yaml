              as: Customer
              captures: { e_customer: "$.data.error_id" }
            - call: "POST /exchange-transactions/00000000-0000-4000-8000-000000000000/reverse"
              payload: { reversal_reason: "probe" }
              as: ComplianceOfficer
              captures: { e_order: "$.data.error_id" }
          assert:
            - "${e_admin} == ERR_UNAUTHORIZED (403): POST /branches is PlatformAdmin-exclusive and no branch BR-ZZZ exists afterwards"
            - "${e_treasury} == ERR_UNAUTHORIZED (403): rate-card drafting is TreasuryOfficer-exclusive, and the incumbent PUBLISHED card ${card_id} is NOT superseded - a 403 performs none of the endpoint's side effects, so Branch.${br_id}.version is unchanged by this call"
