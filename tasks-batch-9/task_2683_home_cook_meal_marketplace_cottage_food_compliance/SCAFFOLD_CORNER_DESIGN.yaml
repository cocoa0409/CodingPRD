  - section: consistency_model
    instances:
      - name: every_derived_field_is_visible_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.cottage_revenue_recognition
          - calculations.refund_chargeback_split
        distinguishing_aspect: >
          With an immediate consistency model there is no settling window anywhere: an adjudication
          response already carries the incident's terminal status while the cook row it re-scored is
          already re-scored, and a refund response already carries its bucket split while the order and
          the cook ledger it moved are already moved. Each write is therefore followed by a read of a
          DIFFERENT entity, and the read must agree with the write on the first attempt rather than the
          second.
        test_recipe:
          setup:
            - "The world of window_and_order_advance_walk_the_happy_path_with_clock_gated_rejections run to completion: order ${o_id} DELIVERED and CAPTURED with subtotal 800, commission 180, cook_earnings 620, total_charge 872; cook ${cook_id} at ytd_cottage_revenue 800 and pending_payout 620; clock 2026-08-08T18:00:00Z."
            - "One incident on that order sits at TRIAGED, triaged by so-1."
