          - calculations.program_cap_reservation
          - concurrency_rules[cycle-adjustment-stale-version]
        distinguishing_aspect: |
          Appropriation adjustments floor at committed + disbursed: with 60000
          committed, a -10000000 delta (new appropriation 0) fails with
          ERR_APPROPRIATION_BELOW_OBLIGATIONS (422), while -9940000 lands the
          appropriation exactly at 60000 == committed + disbursed and succeeds
          (>= boundary, available becomes 0).
        test_recipe:
          setup:
            - "cycle appropriation 10000000; application qty 100 APPROVED then OBLIGATED (committed 60000; cycle version advanced to 2 by the obligate cascade)"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 10000000 }, as: ProgramCoordinator, captures: { cycle_id: "$.data.id" } }
