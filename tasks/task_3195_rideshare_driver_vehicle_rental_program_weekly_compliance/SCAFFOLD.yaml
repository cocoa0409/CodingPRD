      - "increments ProgramVehicle.version by 1"
  - method: GET
    path: "/program/maintenance-events/{id}"
    description: "Fetch one maintenance event"
    roles: [PlatformAdmin, FleetOpsAgent, ComplianceOfficer, SupportAgent, Driver]
    code: 200
    input: [""]
    output: MaintenanceEvent
    side_effects: []
  - method: GET
    path: "/program/maintenance-events"
    description: "List maintenance events for an agreement or vehicle"
    roles: [PlatformAdmin, FleetOpsAgent, ComplianceOfficer, SupportAgent]
    code: 200
    input: ["agreement_id?", "vehicle_id?", "loaner_vehicle_id?", "event_status?", "event_type?", "limit?", "offset?"]
    output: MaintenanceEvent[]
    side_effects: []
  - method: POST
    path: "/program/maintenance-events/{id}/start"
    description: "Begin work on a reported service event"
    roles: [FleetOpsAgent]
    code: 200
    input: [""]
    output: MaintenanceEvent
    side_effects: ["event_status REPORTED -> IN_PROGRESS"]
  - method: POST
    path: "/program/maintenance-events/{id}/issue-loaner"
    description: "Issue a loaner unit so the driver's platform earnings are not interrupted by a long service window"
    roles: [FleetOpsAgent]
    code: 200
    input: [""]
    output: MaintenanceEvent
    side_effects:
      - "loaner selected from AVAILABLE units of the same class in the agreement's region: the pool member with the smallest odometer_miles, ties broken by the earliest created_at, never by id; an empty pool yields ERR_LOANER_UNAVAILABLE"
      - "loaner vehicle_status AVAILABLE -> ASSIGNED with assigned_driver_id set"
      - "event_status IN_PROGRESS -> LOANER_ISSUED"
      - "loaner_deadline stamped"
  - method: POST
    path: "/program/maintenance-events/{id}/complete"
    description: "Complete the service event, release the loaner and restamp the maintenance allowance"
    roles: [FleetOpsAgent]
    code: 200
    input: [""]
    output: MaintenanceEvent
    side_effects:
      - "event_status -> COMPLETED"
      - "original vehicle_status MAINTENANCE -> ASSIGNED with assigned_driver_id restamped from RentalAgreement.driver_id"
      - "any outstanding loaner released to AVAILABLE"
      - "maintenance_allowance_applied_miles restamped"
      - "damage_settlement_split recomputed into the open week"

  - method: GET
    path: "/program/payments/{id}"
    description: "Fetch one recorded rental payment"
    roles: [PlatformAdmin, SupportAgent, ComplianceOfficer]
    code: 200
    input: [""]
    output: RentalPayment
    side_effects: []
  - method: GET
    path: "/program/payments"
    description: "List recorded rental payments filtered by agreement or week"
    roles: [PlatformAdmin, SupportAgent, ComplianceOfficer]
    code: 200
    input: ["agreement_id?", "week_id?", "payment_outcome?", "limit?", "offset?"]
    output: RentalPayment[]
    side_effects: []

  - method: POST
