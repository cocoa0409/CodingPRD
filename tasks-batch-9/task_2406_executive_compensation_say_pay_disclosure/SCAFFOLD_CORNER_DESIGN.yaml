          The window test is at-or-after the logical now, not strictly after: with the clock advanced to
          2027-03-10T00:00:00Z a window_start of 2027-03-01 is ERR_ENGAGEMENT_WINDOW_IN_PAST (422) while a
          window_start of exactly 2027-03-10T00:00:00Z is accepted, so the engagement reaches SCHEDULED on the
          boundary instant.
        test_recipe:
          setup:
            - "MINI fixture with DRAFT PayProgram P1 (meeting_date 2027-05-12T00:00:00Z, quiet period 2027-05-02 .. 2027-05-12)."
            - "One REQUESTED engagement for BlackRock (ownership_pct 20.00)."
            - "Logical clock then advanced to 2027-03-10T00:00:00Z."
