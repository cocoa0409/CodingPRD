            - "CuttingTest.${t1_id}.revision_count == 0, total_yield_weight_lb == 0, unaccounted_lb == 0"
            - "CuttingTest.${t1_id}.salable_yield_pct == 0, trim_yield_pct == 0, loss_pct == 0"
            - "CuttingTest.${t1_id}.submitted_by_user_id and approved_by_user_id are unset"
