            - { call: "POST /api/onboarding-cases/${case_id}/submit-for-clearance", as: HRAdmin, as_user_id: "hr-1" }
            - { call: "GET /api/onboarding-cases/${case_id}/clearance-cases", as: HRAdmin, captures: { cl_id: "$.data[0].id" } }
            - { call: "POST /api/clearance-cases/${cl_id}/record-result", as: HRAdmin, payload: { component: "BACKGROUND", result: "PASSED" } }
            - { call: "POST /api/clearance-cases/${cl_id}/record-result", as: HRAdmin, payload: { component: "REFERENCE", result: "PASSED" } }
            - { call: "GET /api/onboarding-cases/${case_id}/provisioning-orders", as: HRAdmin, captures: { ord_id: "$.data[0].id" } }
            - { call: "GET /api/provisioning-orders/${ord_id}/items", as: HRAdmin, captures: { i1: "$.data[0].id", i2: "$.data[1].id" } }
            - { call: "POST /api/provisioning-orders/${ord_id}/submit", as: HRAdmin }
            - { call: "POST /api/provisioning-items/${i1}/transition", as: ITProvisioner, payload: { to: "IN_FULFILLMENT" } }
            - { call: "POST /api/provisioning-items/${i1}/transition", as: ITProvisioner, payload: { to: "DONE" } }
            - { call: "POST /api/provisioning-items/${i2}/transition", as: ITProvisioner, payload: { to: "IN_FULFILLMENT" } }
            - { call: "POST /api/provisioning-items/${i2}/transition", as: ITProvisioner, payload: { to: "DONE" } }
            - { call: "POST /api/orientation-sessions", as: HRAdmin, captures: { s_id: "$.data.id" }, payload: { room: "R1", starts_at: "2026-05-04T09:00:00Z", ends_at: "2026-05-04T12:00:00Z", capacity: 10 } }
            - { call: "POST /api/onboarding-cases/${case_id}/orientation-booking", as: HRAdmin, payload: { session_id: "${s_id}" } }
            - { call: "POST /api/_clock/set_current_utc", as: HRAdmin, payload: { to_iso8601: "2026-05-04T00:00:00Z" } }
          trigger:
            - { call: "GET /api/onboarding-cases/${case_id}", as: HRAdmin, captures: { cv1: "$.data.version" } }
            - { call: "POST /api/onboarding-cases/${case_id}/payroll-handoffs", as: HRAdmin, captures: { h1: "$.data.id" }, payload: { expected_case_version: "${cv1}", first_period_start_date: "2026-05-01", first_period_end_date: "2026-05-14" } }
            - { call: "POST /api/payroll-handoffs/${h1}/withdraw", as: HRAdmin }
            - { call: "GET /api/onboarding-cases/${case_id}", as: HRAdmin, captures: { cv2: "$.data.version" } }
            - { call: "POST /api/onboarding-cases/${case_id}/payroll-handoffs", as: HRAdmin, captures: { h2: "$.data.id" }, payload: { expected_case_version: "${cv2}", first_period_start_date: "2026-05-01", first_period_end_date: "2026-05-14" } }
            - { call: "GET /api/onboarding-cases/${case_id}", as: HRAdmin, captures: { cv3: "$.data.version" } }
            - { call: "POST /api/onboarding-cases/${case_id}/payroll-handoffs", as: HRAdmin, captures: { h3: "$.data.id" }, payload: { expected_case_version: "${cv3}", first_period_start_date: "2026-05-01", first_period_end_date: "2026-05-14" } }
            - { call: "GET /api/onboarding-cases/${case_id}/payroll-handoffs", as: HRAdmin, captures: { h1_st: "$.data[0].status", h2_st: "$.data[1].status", h3_st: "$.data[2].status" } }
            - { call: "GET /api/onboarding-cases/${case_id}/summary", as: HRAdmin, captures: { open_cnt: "$.data.open_handoff_count" } }
            - { call: "POST /api/payroll-handoffs/${h3}/withdraw", as: HRAdmin }
            - { call: "GET /api/onboarding-cases/${case_id}/summary", as: HRAdmin, captures: { open_cnt2: "$.data.open_handoff_count" } }
          assert:
            - "handoffs[0].status == WITHDRAWN (create h1 + withdraw h1 returned open count to baseline 0)"
            - "handoffs[1].status == SUPERSEDED (h2 auto-superseded by h3 creation)"
            - "handoffs[2].status == DRAFT"
            - "summary.open_handoff_count == 1 after the supersede pair (invariant: COUNT(status IN {DRAFT, TRANSMITTED}) <= 1 always)"
            - "summary.open_handoff_count == 0 after withdrawing h3 (full compensating chain returns to baseline)"
