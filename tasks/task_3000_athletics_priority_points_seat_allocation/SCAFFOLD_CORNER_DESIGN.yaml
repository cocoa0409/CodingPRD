        distinguishing_aspect: |
          Two donors with byte-identical scoring inputs collide on every sort key
          except created_at, so the tie-break is the only thing that can produce a
          total order. The donors are created one logical second apart (the clock
          is parked, so simultaneous creates would share created_at and make the
          claim untestable — a §1.5 gap noted separately), and the EARLIER
          created_at must win rank 1 and slot_index 0. A descending or
