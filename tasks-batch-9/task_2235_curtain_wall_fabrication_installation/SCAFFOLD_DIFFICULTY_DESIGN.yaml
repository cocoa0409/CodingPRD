  - name: zone_sequence_error_precedes_panel_lot_shipment_error
    grounds:
    - validations[priority=64]
    - validations[priority=92]
    - endpoints[POST /installation-zones/{id}/hang-panels]
    - state_machines.InstallationZone.install_status_ANCHORS_SET_to_PANELS_HUNG
    distinguishing_aspect: 'Priority 64 (state) outranks priority 92 (business_safety) on the same hang-panels call: with
      the zone still PLANNED and its lot still BATCHED the response is ERR_ZONE_SEQUENCE_VIOLATION, and only after the sequence
      defect is repaired does the masked ERR_PANEL_LOTS_NOT_SHIPPED surface.'
