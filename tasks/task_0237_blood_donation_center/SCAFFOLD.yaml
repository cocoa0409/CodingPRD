# =============================================================================
# Blood Donation Center — benchmark seed tables (Expert tier, §0.4)
# =============================================================================

scenario: |
  Blood Donation Center: donor registration/eligibility screening, deferral
  rules (travel/meds/hemoglobin), appointment scheduling, donation type
  (whole/plasma/platelet), inter-donation interval, unit labeling & inventory
  by blood type, adverse reaction, recall/lookback

domain_name: blood-donation-center
api_prefix: /blood-bank

# Complexity profile -----------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency        # OCC on AppointmentSlot.version for booking
    - cascading_side_effects        # recall/lookback cascade donor -> donations -> units -> inventory
    - dual_variant_calculation      # provisional vs final eligibility date; collection- vs release-anchored unit expiry
    - scheduled_actions             # deterministic clock gates interval/deferral expiry/unit expiry
    - derived_field_reconciliation  # inventory bucket counts; donor eligibility_status

  entity_topology: flat
  # Single generic mount /blood-bank; every entity is a peer top-level collection
  # (/blood-bank/donors, /blood-bank/donations, ...) linked by FK fields carried
  # in the body. Reverse-reachability is via filtered-list GETs (?<fk>=...).

  state_machine_shape: branching
  # Donation forks COLLECTED -> {RELEASABLE, DISCARDED}; BloodUnit forks
  # QUARANTINED -> {AVAILABLE, DISCARDED, RECALLED}, AVAILABLE -> {RESERVED,
  # EXPIRED, RECALLED}; Appointment branches check-in/cancel/no-show with
  # divergent side-effect sets.

  relationship_patterns:
    - one_to_many        # Center->Donor, Donor->Donation, Donation->BloodUnit
    - cross_aggregate    # RecallEvent reaches across Donor->Donation->BloodUnit->InventoryBucket
    - flat_references    # all links are FK fields in bodies, no nested URLs

  role_model: peer_roles
  # Donor (self-service booking), IntakeNurse (screening/deferral/collection),
  # LabTechnician (test results, unit labeling/release), InventoryManager
  # (unit lifecycle, inventory, recall/lookback), CenterAdmin (centers, slots, clock).

  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: DonationCenter
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Center name" }
      - { name: region_code, type: string, source: input, description: "Operating region (e.g. US-CA)" }
      - { name: current_utc, type: datetime, source: system, default: "1970-01-01T00:00:00.000Z", description: "Deterministic center clock; advanced only via the clock endpoint. All interval/deferral/expiry math reads this, never wall-clock." }

  - name: Donor
    parent: DonationCenter
    common_fields: true
    fields:
      - { name: center_id, type: string, source: input, description: "FK -> DonationCenter.id" }
      - { name: full_name, type: string, source: input, description: "Donor legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD; used for age eligibility" }
      - { name: weight_kg, type: number, source: input, description: "Self-reported weight in kg at registration" }
      - { name: blood_type, type: enum, source: input, description: "O_NEG | O_POS | A_NEG | A_POS | B_NEG | B_POS | AB_NEG | AB_POS | UNKNOWN" }
      - { name: eligibility_status, type: enum, source: computed, default: ELIGIBLE, description: "ELIGIBLE | TEMP_DEFERRED | PERM_DEFERRED | UNDERAGE. Derived from active deferrals + age vs center.current_utc; recomputed on every deferral create/expire/lift and on clock advance." }
      - { name: last_qualifying_donation_id, type: string, source: computed, description: "Convenience pointer to the donor's most recent Donation that reached COLLECTED-or-beyond, ranked by collected_at DESC then created_at DESC. Drives the FINAL inter-donation interval. Null if none. (Not a parenting FK.)" }
      - { name: pending_donation_type, type: enum, source: computed, default: NONE, description: "Donation type of the donor's single open (SCHEDULED|CHECKED_IN) appointment, else NONE. Drives the PROVISIONAL interval. WHOLE | PLASMA | PLATELET | NONE" }
      - { name: lifetime_collected_count, type: integer, source: computed, default: 0, description: "Count of this donor's Donation rows that ever reached COLLECTED or beyond" }

  - name: Deferral
    parent: Donor
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: input, description: "FK -> Donor.id" }
      - { name: center_id, type: string, source: computed, description: "FK -> DonationCenter.id; copied from the donor" }
      - { name: category, type: enum, source: input, description: "TRAVEL | MEDICATION | HEMOGLOBIN | ADVERSE_REACTION | INFECTIOUS_RISK" }
      - { name: kind, type: enum, source: input, description: "TEMPORARY | PERMANENT" }
      - { name: reason, type: string, source: input, description: "Free-text clinical justification (>= 5 chars)" }
      - { name: starts_at, type: datetime, source: system, description: "Set to center.current_utc at creation" }
      - { name: expires_at, type: datetime, source: computed, description: "For TEMPORARY: starts_at + duration_days*86400s. Null for PERMANENT." }
      - { name: duration_days, type: integer, source: input, required: false, description: "Required when kind=TEMPORARY (integer >= 1); forbidden when kind=PERMANENT" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | EXPIRED | LIFTED. TEMPORARY auto-EXPIRES when center.current_utc >= expires_at; PERMANENT stays ACTIVE until LIFTED." }
      - { name: source_reaction_id, type: string, source: input, required: false, description: "FK -> AdverseReaction.id; set when this deferral was auto-raised by a SEVERE adverse reaction" }

  - name: AppointmentSlot
    parent: DonationCenter
    common_fields: true
    fields:
      - { name: center_id, type: string, source: input, description: "FK -> DonationCenter.id" }
      - { name: donation_type, type: enum, source: input, description: "WHOLE | PLASMA | PLATELET — the only donation type bookable in this slot" }
      - { name: starts_at, type: datetime, source: input, description: "Slot window start, ISO 8601 UTC" }
      - { name: ends_at, type: datetime, source: input, description: "Slot window end, ISO 8601 UTC; must be > starts_at" }
      - { name: capacity, type: integer, source: input, description: "Max confirmed appointments; integer >= 1" }
      - { name: booked_count, type: integer, source: computed, default: 0, description: "Count of appointments in SCHEDULED or CHECKED_IN against this slot" }
      - { name: status, type: enum, source: computed, default: OPEN, description: "OPEN | FULL | CLOSED. FULL when booked_count >= capacity; CLOSED set by admin close action." }

  - name: Appointment
    parent: Donor
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: input, description: "FK -> Donor.id" }
      - { name: slot_id, type: string, source: input, description: "FK -> AppointmentSlot.id" }
      - { name: center_id, type: string, source: computed, description: "FK -> DonationCenter.id; copied from the slot" }
      - { name: donation_type, type: enum, source: computed, description: "Copied from the slot at booking; WHOLE | PLASMA | PLATELET" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> CHECKED_IN -> {COMPLETED, NO_SHOW}; SCHEDULED -> CANCELLED" }
      - { name: booked_at, type: datetime, source: system, description: "center.current_utc at booking" }

  - name: HealthScreening
    parent: Appointment
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id" }
      - { name: donor_id, type: string, source: computed, description: "FK -> Donor.id; copied from the appointment" }
      - { name: hemoglobin_g_dl, type: number, source: input, description: "Measured hemoglobin g/dL" }
      - { name: systolic_bp, type: integer, source: input, description: "Systolic blood pressure" }
      - { name: pulse_bpm, type: integer, source: input, description: "Pulse beats/min" }
      - { name: weight_kg, type: number, source: input, description: "Measured weight kg at screening" }
      - { name: recent_travel_risk, type: boolean, source: input, description: "True if travel questionnaire flags an endemic-risk region" }
      - { name: disqualifying_medication, type: boolean, source: input, description: "True if a listed disqualifying medication is reported" }
      - { name: outcome, type: enum, source: computed, description: "PASS | FAIL. PASS only if all thresholds met and no risk flags; FAIL otherwise." }
      - { name: failure_reason, type: enum, source: computed, default: NONE, description: "NONE | HEMOGLOBIN_LOW | UNDERWEIGHT | VITALS_OUT_OF_RANGE | TRAVEL_RISK | MEDICATION. First failing check by screening_outcome order." }

  - name: Donation
    parent: Appointment
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id" }
      - { name: donor_id, type: string, source: computed, description: "FK -> Donor.id; copied from the appointment" }
      - { name: center_id, type: string, source: computed, description: "FK -> DonationCenter.id; copied from the appointment" }
      - { name: donation_type, type: enum, source: computed, description: "Copied from appointment; WHOLE | PLASMA | PLATELET" }
      - { name: volume_ml, type: integer, source: input, description: "Collected volume in mL; integer >= 1" }
      - { name: collected_at, type: datetime, source: system, description: "center.current_utc when collection recorded" }
      - { name: status, type: enum, source: system, default: COLLECTED, description: "COLLECTED -> {RELEASABLE, DISCARDED}. RELEASABLE when test NEGATIVE and no SEVERE reaction; DISCARDED on test POSITIVE/INDETERMINATE or recall." }
      - { name: test_result_id, type: string, source: computed, description: "Convenience pointer to the TestResult recorded for this donation; null until recorded. (Not a parenting FK.)" }

  - name: TestResult
    parent: Donation
    common_fields: true
    fields:
      - { name: donation_id, type: string, source: input, description: "FK -> Donation.id" }
      - { name: donor_id, type: string, source: computed, description: "FK -> Donor.id; copied from the donation" }
      - { name: panel_outcome, type: enum, source: input, description: "NEGATIVE | POSITIVE | INDETERMINATE — infectious-disease screening panel" }
      - { name: resulted_at, type: datetime, source: system, description: "center.current_utc when result recorded" }

  - name: BloodUnit
    parent: Donation
    common_fields: true
    fields:
      - { name: donation_id, type: string, source: input, description: "FK -> Donation.id" }
      - { name: donor_id, type: string, source: computed, description: "FK -> Donor.id; copied from the donation" }
      - { name: center_id, type: string, source: computed, description: "FK -> DonationCenter.id; copied from the donation" }
      - { name: component, type: enum, source: input, description: "RBC | PLASMA | PLATELET | WHOLE_BLOOD — derived product component" }
      - { name: blood_type, type: enum, source: computed, description: "Copied from donor.blood_type at labeling; O_NEG..AB_POS" }
      - { name: din, type: string, source: input, description: "Donation Identification Number label; unique among units within the center" }
      - { name: collected_at, type: datetime, source: computed, description: "Copied from parent donation.collected_at; basis for COLLECTION-anchored shelf life" }
      - { name: released_at, type: datetime, source: computed, description: "center.current_utc when unit moved to AVAILABLE; basis for RELEASE-anchored shelf life (platelets)" }
      - { name: expires_at, type: datetime, source: computed, description: "Shelf-life expiry; see calculation unit_expiry. Set at labeling for collection-anchored, recomputed at release for platelets." }
      - { name: status, type: enum, source: system, default: QUARANTINED, description: "QUARANTINED -> {AVAILABLE, DISCARDED, RECALLED}; AVAILABLE -> {RESERVED, EXPIRED, RECALLED}; RESERVED -> {ISSUED, AVAILABLE, RECALLED}. DISCARDED/RECALLED/ISSUED/EXPIRED terminal." }

  - name: AdverseReaction
    parent: Donation
    common_fields: true
    fields:
      - { name: donation_id, type: string, source: input, description: "FK -> Donation.id" }
      - { name: donor_id, type: string, source: computed, description: "FK -> Donor.id; copied from the donation" }
      - { name: severity, type: enum, source: input, description: "MILD | MODERATE | SEVERE" }
      - { name: symptom, type: string, source: input, description: "Reported symptom description (>= 3 chars)" }
      - { name: occurred_at, type: datetime, source: system, description: "center.current_utc when logged" }
      - { name: triggered_deferral_id, type: string, source: computed, description: "Convenience pointer to the Deferral auto-raised when severity=SEVERE; null otherwise. (Not a parenting FK.)" }

  - name: RecallEvent
    parent: DonationCenter
    common_fields: true
    fields:
      - { name: center_id, type: string, source: input, description: "FK -> DonationCenter.id" }
      - { name: donor_id, type: string, source: input, description: "FK -> Donor.id; the donor whose post-donation information triggered the recall" }
      - { name: reason, type: enum, source: input, description: "POSITIVE_RETEST | POST_DONATION_ILLNESS | TRAVEL_DISCLOSURE | OTHER" }
      - { name: lookback_days, type: integer, source: input, description: "Lookback window in days; donations with collected_at >= (current_utc - lookback_days*86400s) are in scope. Integer >= 1." }
      - { name: units_recalled_count, type: integer, source: computed, default: 0, description: "Count of BloodUnits transitioned to RECALLED by this event" }
      - { name: donations_in_scope_count, type: integer, source: computed, default: 0, description: "Count of this donor's donations whose collected_at falls in the lookback window" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> CLOSED. CLOSED once the cascade completes (synchronously at creation)." }

  - name: InventoryBucket
    parent: DonationCenter
    common_fields: true
    fields:
      - { name: center_id, type: string, source: input, description: "FK -> DonationCenter.id" }
      - { name: blood_type, type: enum, source: input, description: "O_NEG..AB_POS — bucket key part 1" }
      - { name: component, type: enum, source: input, description: "RBC | PLASMA | PLATELET | WHOLE_BLOOD — bucket key part 2" }
      - { name: available_count, type: integer, source: computed, default: 0, description: "Count of this center's BloodUnits matching (blood_type, component) in AVAILABLE status" }
      - { name: reserved_count, type: integer, source: computed, default: 0, description: "Count of matching units in RESERVED status" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /blood-bank/appointments/{appointmentId}/check-in"
        actor: IntakeNurse
        preconditions:
          - "Appointment is SCHEDULED (ERR_APPOINTMENT_NOT_SCHEDULED)"
          - "Donor.eligibility_status == ELIGIBLE at center.current_utc (ERR_DONOR_NOT_ELIGIBLE) — cross-entity check on Donor"
          - "Inter-donation interval satisfied: center.current_utc >= donor FINAL next_eligible_at for the slot's donation_type (ERR_INTERVAL_NOT_ELAPSED)"
        side_effects:
          - "Appointment.status = CHECKED_IN"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /blood-bank/appointments/{appointmentId}/donations (collection recorded)"
        actor: IntakeNurse
        preconditions:
          - "Appointment is CHECKED_IN (ERR_APPOINTMENT_NOT_CHECKED_IN)"
          - "A HealthScreening exists for this appointment with outcome=PASS (ERR_SCREENING_NOT_PASSED)"
          - "If donation_type == PLASMA: volume_ml <= weight-band per-collection cap (ERR_PLASMA_VOLUME_EXCEEDED)"
          - "If donation_type == PLASMA: rolling 365-day plasma volume incl. this collection <= ANNUAL_PLASMA_LITERS_CAP (ERR_ANNUAL_PLASMA_CAP_EXCEEDED)"
        side_effects:
          - "Appointment.status = COMPLETED"
          - "A Donation row is created in COLLECTED status (collected_at = center.current_utc)"
          - "Slot.booked_count -= 1 (appointment leaves SCHEDULED/CHECKED_IN set); Slot.status recomputed"
          - "Donor.lifetime_collected_count += 1; Donor.last_qualifying_donation_id recomputed; Donor eligibility/interval fields recomputed"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /blood-bank/appointments/{appointmentId}/cancel"
        actor: Donor
        preconditions:
          - "Appointment is SCHEDULED (ERR_APPOINTMENT_NOT_CANCELLABLE)"
        side_effects:
          - "Appointment.status = CANCELLED"
          - "Slot.booked_count -= 1; Slot.status recomputed (FULL -> OPEN when below capacity)"
          - "Donor.pending_donation_type recomputed -> NONE if this was the open appointment"
      - from: CHECKED_IN
        to: NO_SHOW
        trigger: "POST /blood-bank/appointments/{appointmentId}/no-show"
        actor: IntakeNurse
        preconditions:
          - "Appointment is CHECKED_IN (ERR_APPOINTMENT_NOT_CHECKED_IN)"
          - "Slot window has ended: center.current_utc >= slot.ends_at (ERR_SLOT_WINDOW_OPEN)"
        side_effects:
          - "Appointment.status = NO_SHOW"
          - "Slot.booked_count -= 1; Slot.status recomputed"
          - "Donor.pending_donation_type recomputed -> NONE"

  - entity: Donation
    initial_state: COLLECTED
    terminal_states: [RELEASABLE, DISCARDED]
    transitions:
      - from: COLLECTED
        to: RELEASABLE
        trigger: "POST /blood-bank/donations/{donationId}/test-results (panel NEGATIVE)"
        actor: LabTechnician
        preconditions:
          - "Donation is COLLECTED (ERR_DONATION_NOT_COLLECTED)"
          - "No SEVERE AdverseReaction exists for this donation (ERR_SEVERE_REACTION_BLOCKS_RELEASE)"
          - "panel_outcome == NEGATIVE"
        side_effects:
          - "TestResult row created (panel NEGATIVE); Donation.test_result_id set"
          - "Donation.status = RELEASABLE"
          - "Each QUARANTINED BloodUnit of this donation -> AVAILABLE (released_at=current_utc, platelet expires_at recomputed RELEASE-anchored); matching InventoryBucket.available_count += 1 per unit (cascade hop 2)"
      - from: COLLECTED
        to: DISCARDED
        trigger: "POST /blood-bank/donations/{donationId}/test-results (panel POSITIVE or INDETERMINATE)"
        actor: LabTechnician
        preconditions:
          - "Donation is COLLECTED (ERR_DONATION_NOT_COLLECTED)"
          - "panel_outcome IN {POSITIVE, INDETERMINATE}"
        side_effects:
          - "TestResult row created; Donation.test_result_id set"
          - "Donation.status = DISCARDED"
          - "Each QUARANTINED BloodUnit of this donation -> DISCARDED (no inventory change; never AVAILABLE)"
          - "If panel_outcome == POSITIVE: a PERMANENT Deferral (category INFECTIOUS_RISK) is auto-raised for the donor; donor.eligibility_status -> PERM_DEFERRED (cross-entity cascade)"

  - entity: BloodUnit
    initial_state: QUARANTINED
    terminal_states: [DISCARDED, RECALLED, ISSUED, EXPIRED]
    transitions:
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "system (parent Donation -> RELEASABLE)"
        actor: system
        preconditions:
          - "Parent Donation transitioned to RELEASABLE"
        side_effects:
          - "released_at = center.current_utc; platelet expires_at recomputed RELEASE-anchored"
          - "InventoryBucket(blood_type, component).available_count += 1"
      - from: QUARANTINED
        to: DISCARDED
        trigger: "system (parent Donation -> DISCARDED)"
        actor: system
        preconditions:
          - "Parent Donation transitioned to DISCARDED"
        side_effects: []
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /blood-bank/blood-units/{unitId}/reserve"
        actor: InventoryManager
        preconditions:
          - "Unit is AVAILABLE (ERR_UNIT_NOT_AVAILABLE)"
          - "center.current_utc < expires_at (ERR_UNIT_EXPIRED)"
        side_effects:
          - "Unit.status = RESERVED"
          - "InventoryBucket.available_count -= 1; reserved_count += 1"
      - from: RESERVED
        to: ISSUED
        trigger: "POST /blood-bank/blood-units/{unitId}/issue"
        actor: InventoryManager
        preconditions:
          - "Unit is RESERVED (ERR_UNIT_NOT_RESERVED)"
        side_effects:
          - "Unit.status = ISSUED"
          - "InventoryBucket.reserved_count -= 1"
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /blood-bank/blood-units/{unitId}/unreserve"
        actor: InventoryManager
        preconditions:
          - "Unit is RESERVED (ERR_UNIT_NOT_RESERVED)"
        side_effects:
          - "Unit.status = AVAILABLE"
          - "InventoryBucket.reserved_count -= 1; available_count += 1"
      - from: AVAILABLE
        to: EXPIRED
        trigger: "POST /blood-bank/centers/{centerId}/clock/advance (system sweep)"
        actor: system
        preconditions:
          - "Unit is AVAILABLE and center.current_utc >= expires_at"
        side_effects:
          - "Unit.status = EXPIRED"
          - "InventoryBucket.available_count -= 1"
      - from: AVAILABLE
        to: RECALLED
        trigger: "system (RecallEvent cascade)"
        actor: system
        preconditions:
          - "Unit's donor matches recall donor and parent donation.collected_at in lookback window"
        side_effects:
          - "Unit.status = RECALLED"
          - "InventoryBucket.available_count -= 1"
      - from: RESERVED
        to: RECALLED
        trigger: "system (RecallEvent cascade)"
        actor: system
        preconditions:
          - "Unit's donor matches recall donor and parent donation.collected_at in lookback window"
        side_effects:
          - "Unit.status = RECALLED"
          - "InventoryBucket.reserved_count -= 1"
      - from: QUARANTINED
        to: RECALLED
        trigger: "system (RecallEvent cascade)"
        actor: system
        preconditions:
          - "Unit's donor matches recall donor and parent donation.collected_at in lookback window"
        side_effects:
          - "Unit.status = RECALLED (no inventory change; was never AVAILABLE)"

  - entity: Deferral
    initial_state: ACTIVE
    terminal_states: [EXPIRED, LIFTED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /blood-bank/centers/{centerId}/clock/advance (system sweep, TEMPORARY only)"
        actor: system
        preconditions:
          - "kind == TEMPORARY and center.current_utc >= expires_at"
        side_effects:
          - "Deferral.status = EXPIRED"
          - "Donor.eligibility_status recomputed (ELIGIBLE if no other ACTIVE deferral and donor not underage)"
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /blood-bank/deferrals/{deferralId}/lift"
        actor: IntakeNurse
        preconditions:
          - "Deferral is ACTIVE (ERR_DEFERRAL_NOT_ACTIVE)"
          - "category != INFECTIOUS_RISK (ERR_INFECTIOUS_DEFERRAL_NOT_LIFTABLE)"
        side_effects:
          - "Deferral.status = LIFTED"
          - "Donor.eligibility_status recomputed"

  - entity: RecallEvent
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /blood-bank/recall-events (creation runs the cascade synchronously)"
        actor: InventoryManager
        preconditions:
          - "Donor exists (ERR_DONOR_NOT_FOUND)"
        side_effects:
          - "Select donor's Donations with collected_at >= (current_utc - lookback_days*86400s), ordered collected_at ASC then created_at ASC; donations_in_scope_count set (cascade hop 1: scope selection)"
          - "Each in-scope Donation not already DISCARDED: Donation.status = DISCARDED (cascade hop 2)"
          - "Each non-terminal BloodUnit (QUARANTINED/AVAILABLE/RESERVED) of those donations -> RECALLED, decrementing the matching InventoryBucket counter for AVAILABLE/RESERVED units (cascade hop 3); units_recalled_count incremented"
          - "If reason == POSITIVE_RETEST: a PERMANENT Deferral (category INFECTIOUS_RISK) auto-raised for the donor; donor.eligibility_status -> PERM_DEFERRED (cascade hop 4)"
          - "RecallEvent.status = CLOSED"

# 2.1 Concurrency Rules --------------------------------------------------------
concurrency_rules:
  - rule_id: slot-book-stale-version
    parent_entity: AppointmentSlot
    write_endpoint: "POST /blood-bank/appointments"
    occ_field: "expected_slot_version"
    description: |
      Booking an Appointment against an AppointmentSlot whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has already booked the slot (legitimately
      bumping booked_count and the slot's version) so the current writer's view
      of remaining capacity is stale. Resolved by an OCC check on
      AppointmentSlot.version, never by any time-overlap framing.
    error_id: ERR_STALE_SLOT_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: inter_donation_next_eligible_at
    trigger: "donor read; appointment check-in precondition; booking advisory"
    algorithm: threshold
    formula: |
      Minimum days between collections, by donation_type:
        WHOLE    -> WHOLE_INTERVAL_DAYS    (56)
        PLASMA   -> PLASMA_INTERVAL_DAYS   (28)
        PLATELET -> PLATELET_INTERVAL_DAYS (7)
      FINAL variant (authoritative at check-in):
        base = donor.last_qualifying_donation_id ? that Donation.collected_at : EPOCH(0)
        next_eligible_at_final = base + interval_days(slot.donation_type)*86400s
        interval-eligible iff center.current_utc >= next_eligible_at_final.
        No qualifying donation -> next_eligible_at_final = EPOCH(0) (always elapsed).
      PROVISIONAL variant (booking advisory only — never blocks booking):
        candidate_base = max( last COLLECTED-or-beyond donation.collected_at of
                              the requested type, implied date of donor's open
                              appointment if pending_donation_type == requested
                              type ). The later (more conservative) of the two.
        Advises the donor the slot may be too soon; check-in enforces FINAL.
      Boundary `>=`: a donation exactly interval_days later is eligible.
    input_set: "FINAL: donor.last_qualifying_donation_id only. PROVISIONAL: last COLLECTED donation of type + donor's open appointment."
    constants:
      WHOLE_INTERVAL_DAYS: 56
      PLASMA_INTERVAL_DAYS: 28
      PLATELET_INTERVAL_DAYS: 7
      SECONDS_PER_DAY: 86400
    precision: "datetime arithmetic in whole seconds; no rounding"
    variants:
      - name: final
        when: "appointment check-in (authoritative gate)"
        difference: "Uses only the donor's actual last qualifying collection; ignores any open appointment"
      - name: provisional
        when: "booking advisory"
        difference: "Takes max() over the last collection AND the open appointment's implied date, yielding a later eligible date"

  - name: unit_expiry
    trigger: "BloodUnit labeling (collection) and unit release to AVAILABLE"
    algorithm: threshold
    formula: |
      Shelf life by component; the anchor differs by component (two variants):
        COLLECTION-anchored (set at labeling, valid while QUARANTINED and after):
          RBC         -> collected_at + RBC_SHELF_DAYS (42)
          PLASMA      -> collected_at + PLASMA_SHELF_DAYS (365)
          WHOLE_BLOOD -> collected_at + WHOLE_SHELF_DAYS (35)
        RELEASE-anchored (set when unit -> AVAILABLE, overwrites expires_at):
          PLATELET    -> released_at + PLATELET_SHELF_DAYS (5)
      RBC/PLASMA/WHOLE_BLOOD expiry is anchored to collected_at and fixed at
      labeling; PLATELET expiry is anchored to released_at and starts only when
      the unit becomes available. A unit is EXPIRED iff
      center.current_utc >= expires_at (boundary `>=`).
    input_set: "the BloodUnit's component, parent donation.collected_at, and its released_at"
    constants:
      RBC_SHELF_DAYS: 42
      PLASMA_SHELF_DAYS: 365
      WHOLE_SHELF_DAYS: 35
      PLATELET_SHELF_DAYS: 5
      SECONDS_PER_DAY: 86400
    precision: "datetime arithmetic in whole seconds"
    variants:
      - name: collection_anchored
        when: "component IN {RBC, PLASMA, WHOLE_BLOOD}"
        difference: "expires_at = collected_at + shelf, fixed at labeling regardless of when released"
      - name: release_anchored
        when: "component == PLATELET"
        difference: "expires_at = released_at + 5d, computed only at release; a platelet in QUARANTINE has no started clock"

  - name: screening_outcome
    trigger: "POST /blood-bank/health-screenings"
    algorithm: weighted_scoring
    formula: |
      Evaluate the five checks in this fixed order; the FIRST failure sets
      failure_reason and outcome=FAIL (>=3 inputs, conditional branches per check):
      1. hemoglobin: PASS needs hemoglobin_g_dl >= UNISEX_HGB_FLOOR (12.5).
         Below -> HEMOGLOBIN_LOW. Boundary `>=`: exactly 12.5 PASSES.
      2. weight: weight_kg >= MIN_WEIGHT_KG (50). Below -> UNDERWEIGHT.
      3. vitals: systolic_bp in [90,180] inclusive AND pulse_bpm in [50,100]
         inclusive. Outside either -> VITALS_OUT_OF_RANGE.
      4. travel: recent_travel_risk == false. True -> TRAVEL_RISK.
      5. medication: disqualifying_medication == false. True -> MEDICATION.
      outcome = PASS iff all five pass; else FAIL with the first failing reason.
      Side effect on FAIL whose reason is in {HEMOGLOBIN_LOW, TRAVEL_RISK,
      MEDICATION}: a TEMPORARY Deferral auto-raised, category and duration by
      reason (HEMOGLOBIN->90d, TRAVEL->21d, MEDICATION->14d). UNDERWEIGHT and
      VITALS_OUT_OF_RANGE fail the screening but do NOT auto-defer.
    input_set: "the screening's own measured fields"
    constants:
      UNISEX_HGB_FLOOR: 12.5
      MIN_WEIGHT_KG: 50
      BP_SYS_MIN: 90
      BP_SYS_MAX: 180
      PULSE_MIN: 50
      PULSE_MAX: 100
      HEMOGLOBIN_DEFERRAL_DAYS: 90
      TRAVEL_DEFERRAL_DAYS: 21
      MED_DEFERRAL_DAYS: 14
    precision: "hemoglobin compared at 1 decimal place"

  - name: lookback_scope
    trigger: "POST /blood-bank/recall-events"
    algorithm: chronological
    formula: |
      window_start = center.current_utc - lookback_days*SECONDS_PER_DAY
      in_scope = donor's Donations with collected_at >= window_start
                 (boundary `>=`: a donation exactly at window_start is IN scope),
                 ordered collected_at ASC then created_at ASC for deterministic
                 cascade order.
      donations_in_scope_count = |in_scope|
      units_recalled_count = count of BloodUnits of in_scope donations that were
                 transitioned to RECALLED (only non-terminal units: status IN
                 {QUARANTINED, AVAILABLE, RESERVED}). ISSUED/EXPIRED/already-
                 DISCARDED units are NOT recalled and NOT counted.
    input_set: "donor's Donations filtered by collected_at >= window_start; their non-terminal BloodUnits"
    constants:
      SECONDS_PER_DAY: 86400
    precision: "whole-second datetime comparison"

  - name: inventory_recount
    trigger: "unit status change into/out of AVAILABLE or RESERVED; recall cascade; expiry sweep; bucket creation"
    algorithm: aggregation
    formula: |
      For each (blood_type, component) bucket at a center:
        available_count = count of this center's BloodUnits with that
                          (blood_type, component) AND status == AVAILABLE
        reserved_count  = count of this center's BloodUnits with that
                          (blood_type, component) AND status == RESERVED
      Maintained incrementally by the unit state-machine side-effects; the bucket
      values MUST always equal a fresh recount over BloodUnit rows
      (reconciliation invariant).
    input_set: "BloodUnit rows at the center grouped by (blood_type, component) and status"
    precision: "integer counts"

  - name: plasma_volume_cap
    trigger: "collection recording for a PLASMA donation (POST .../donations)"
    algorithm: tiered_pricing
    formula: |
      PLASMA collections are volume-capped by donor weight band AND a rolling
      365-day plasma-volume ceiling applies. The rounding ORDER is pinned
      because it changes the result.
      (1) Per-collection cap by weight band (the appointment's PASS screening's
          measured weight_kg governs; fall back to donor.weight_kg if absent):
            weight_kg in [50, 68)  -> PER_CAP_LOW  (690 mL)
            weight_kg in [68, 79)  -> PER_CAP_MID  (825 mL)
            weight_kg >= 79        -> PER_CAP_HIGH (880 mL)
          volume_ml MUST be <= the band cap, else ERR_PLASMA_VOLUME_EXCEEDED.
      (2) Rolling annual plasma volume (liters to 2 dp), rounding order PINNED as
          ROUND-PER-COLLECTION-THEN-SUM (NOT sum-then-round) — this changes cents
          of a liter and therefore the cap decision:
            For each prior PLASMA Donation with collected_at >=
            current_utc - ROLLING_WINDOW_DAYS*86400 and status in
            {COLLECTED, RELEASABLE}, plus the in-flight collection:
               liters_i = round_half_up(volume_ml_i / 1000.0, 2)   # round each line to 2 dp FIRST
            annual = sum(liters_i)                                  # then sum the rounded lines
          Reject with ERR_ANNUAL_PLASMA_CAP_EXCEEDED if annual >
          ANNUAL_PLASMA_LITERS_CAP (2.00). Boundary `>`: exactly 2.00 is allowed;
          2.01 is rejected.
          DIVERGENCE (why the order is pinned): three 666 mL collections give
          per-line round(0.666,2)=0.67 each, round-then-sum = 0.67*3 = 2.01 L
          (REJECT), whereas sum-then-round = round(1.998,2) = 2.00 L (would NOT
          reject). The scaffold mandates round-then-sum, so 2.01 is authoritative.
    input_set: "this PLASMA donation's volume_ml + the donor's prior PLASMA donations in the trailing 365-day window"
    constants:
      PER_CAP_LOW: 690
      PER_CAP_MID: 825
      PER_CAP_HIGH: 880
      WEIGHT_BAND_LOW_MAX: 68
      WEIGHT_BAND_MID_MAX: 79
      ANNUAL_PLASMA_LITERS_CAP: 2.00
      ROLLING_WINDOW_DAYS: 365
      SECONDS_PER_DAY: 86400
    precision: "per-collection liters rounded to 2 decimals (round_half_up) BEFORE summation; annual cap compared with `>`"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All referenced resources (path ids and body FK ids) exist, validated left-to-right then body-FKs in declared order"
    error_id: "ERR_NOT_FOUND / ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numbers in range, datetimes ISO 8601"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all mutation endpoints

  - priority: 5
    category: concurrency
    check: "expected_slot_version (when the endpoint requires it) equals AppointmentSlot.version"
    error_id: ERR_STALE_SLOT_VERSION
    http_status: 412
    applies_to: "POST /blood-bank/appointments"
    note: "OCC check runs before slot capacity/state business checks"

  - priority: 6
    category: state
    check: "Target resource is in a state that permits the requested transition"
    error_id: "ERR_{RESOURCE}_NOT_{STATE} (e.g. ERR_APPOINTMENT_NOT_SCHEDULED, ERR_UNIT_NOT_AVAILABLE, ERR_DONATION_NOT_COLLECTED)"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: business_safety
    check: "Donor.eligibility_status == ELIGIBLE when checking in for a donation"
    error_id: ERR_DONOR_NOT_ELIGIBLE
    http_status: 403
    applies_to: "POST /blood-bank/appointments/{appointmentId}/check-in"

  - priority: 8
    category: business_safety
    check: "A PASS HealthScreening exists for the appointment before a donation can be collected"
    error_id: ERR_SCREENING_NOT_PASSED
    http_status: 409
    applies_to: "POST /blood-bank/appointments/{appointmentId}/donations"

  - priority: 8.3
    category: business_constraint
    check: "For PLASMA donations, volume_ml must not exceed the donor's weight-band per-collection cap (plasma_volume_cap step 1)"
    error_id: ERR_PLASMA_VOLUME_EXCEEDED
    http_status: 422
    applies_to: "POST /blood-bank/appointments/{appointmentId}/donations"

  - priority: 8.6
    category: business_fiscal
    check: "For PLASMA donations, rolling 365-day plasma volume incl. this collection must not exceed ANNUAL_PLASMA_LITERS_CAP (plasma_volume_cap step 2, round-per-collection-then-sum)"
    error_id: ERR_ANNUAL_PLASMA_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /blood-bank/appointments/{appointmentId}/donations"
    note: "Aggregate validation: each prior collection valid alone, but the rolling sum tips over the ceiling"

  - priority: 9
    category: business_safety
    check: "No SEVERE AdverseReaction on the donation when releasing units (test NEGATIVE path)"
    error_id: ERR_SEVERE_REACTION_BLOCKS_RELEASE
    http_status: 409
    applies_to: "POST /blood-bank/donations/{donationId}/test-results"

  - priority: 10
    category: business_temporal
    check: "Inter-donation interval elapsed: center.current_utc >= FINAL next_eligible_at for the slot's donation_type"
    error_id: ERR_INTERVAL_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /blood-bank/appointments/{appointmentId}/check-in"

  - priority: 11
    category: business_temporal
    check: "Slot window must have ended for a no-show: center.current_utc >= slot.ends_at"
    error_id: ERR_SLOT_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /blood-bank/appointments/{appointmentId}/no-show"

  - priority: 12
    category: business_constraint
    check: "Slot must not be CLOSED or FULL when booking (slot.donation_type defines the appointment type)"
    error_id: ERR_SLOT_NOT_BOOKABLE
    http_status: 409
    applies_to: "POST /blood-bank/appointments"

  - priority: 13
    category: business_constraint
    check: "Donor may hold at most one open appointment (SCHEDULED or CHECKED_IN) at a time"
    error_id: ERR_DONOR_HAS_OPEN_APPOINTMENT
    http_status: 409
    applies_to: "POST /blood-bank/appointments"

  - priority: 14
    category: business_constraint
    check: "TEMPORARY deferral requires duration_days >= 1; PERMANENT deferral forbids duration_days"
    error_id: ERR_INVALID_DEFERRAL_DURATION
    http_status: 422
    applies_to: "POST /blood-bank/deferrals"

  - priority: 15
    category: business_referential
    check: "BloodUnit component must be compatible with the parent donation's donation_type (WHOLE->{RBC,PLASMA,WHOLE_BLOOD}; PLASMA->{PLASMA}; PLATELET->{PLATELET})"
    error_id: ERR_COMPONENT_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /blood-bank/blood-units"

  - priority: 16
    category: business_constraint
    check: "DIN label must be unique among BloodUnits at the center"
    error_id: ERR_DUPLICATE_DIN
    http_status: 409
    applies_to: "POST /blood-bank/blood-units"

  - priority: 17
    category: business_temporal
    check: "AppointmentSlot ends_at must be strictly greater than starts_at"
    error_id: ERR_INVALID_SLOT_WINDOW
    http_status: 422
    applies_to: "POST /blood-bank/slots"

  - priority: 18
    category: business_safety
    check: "INFECTIOUS_RISK deferrals cannot be lifted"
    error_id: ERR_INFECTIOUS_DEFERRAL_NOT_LIFTABLE
    http_status: 409
    applies_to: "POST /blood-bank/deferrals/{deferralId}/lift"

  - priority: 19
    category: business_temporal
    check: "Clock can only advance forward: target current_utc must be strictly after existing center.current_utc"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 409
    applies_to: "POST /blood-bank/centers/{centerId}/clock/advance"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Centers & clock ---
  - method: POST
    path: "/blood-bank/centers"
    description: "Create a donation center"
    roles: [CenterAdmin]
    code: 201
    input: [name, region_code]
    output: DonationCenter
    side_effects: ["current_utc initialized to 1970-01-01T00:00:00.000Z"]

  - method: GET
    path: "/blood-bank/centers"
    description: "List centers"
    roles: [CenterAdmin, IntakeNurse, LabTechnician, InventoryManager, Donor]
    code: 200
    input: ["region_code?"]
    output: "DonationCenter[]"
    side_effects: []

  - method: GET
    path: "/blood-bank/centers/{centerId}"
    description: "Get a center (includes current_utc and version)"
    roles: [CenterAdmin, IntakeNurse, LabTechnician, InventoryManager, Donor]
    code: 200
    input: []
    output: DonationCenter
    side_effects: []

  - method: POST
    path: "/blood-bank/centers/{centerId}/clock/advance"
    description: "Advance the center clock; runs deferral-expiry and unit-expiry sweeps"
    roles: [CenterAdmin]
    code: 200
    input: [to_iso8601]
    output: DonationCenter
    side_effects:
      - "current_utc = to_iso8601 (must be strictly after current value, else ERR_CLOCK_NOT_MONOTONIC)"
      - "Each ACTIVE TEMPORARY Deferral with current_utc >= expires_at -> EXPIRED; affected donors' eligibility recomputed"
      - "Each AVAILABLE BloodUnit with current_utc >= expires_at -> EXPIRED; InventoryBucket.available_count decremented"

  # --- Donors ---
  - method: POST
    path: "/blood-bank/donors"
    description: "Register a donor"
    roles: [IntakeNurse, Donor]
    code: 201
    input: [center_id, full_name, date_of_birth, weight_kg, blood_type]
    output: Donor
    side_effects:
      - "eligibility_status computed: UNDERAGE if age at current_utc < 18 else ELIGIBLE"
      - "lifetime_collected_count = 0; pending_donation_type = NONE"

  - method: GET
    path: "/blood-bank/donors"
    description: "List donors, filterable by center (reverse-reachability for Donor.center_id)"
    roles: [CenterAdmin, IntakeNurse, LabTechnician, InventoryManager]
    code: 200
    input: ["center_id?", "eligibility_status?", "blood_type?"]
    output: "Donor[]"
    side_effects: []

  - method: GET
    path: "/blood-bank/donors/{donorId}"
    description: "Get a donor (eligibility_status and interval fields recomputed against current_utc)"
    roles: [CenterAdmin, IntakeNurse, LabTechnician, InventoryManager, Donor]
    code: 200
    input: []
    output: Donor
    side_effects: []

  # --- Deferrals ---
  - method: POST
    path: "/blood-bank/deferrals"
    description: "Manually raise a deferral against a donor"
    roles: [IntakeNurse]
    code: 201
    input: [donor_id, category, kind, reason, "duration_days?", "source_reaction_id?"]
    output: Deferral
    side_effects:
      - "center_id copied from donor; starts_at = current_utc; expires_at = starts_at + duration_days*86400s (TEMPORARY) or null (PERMANENT)"
      - "Donor.eligibility_status recomputed -> TEMP_DEFERRED or PERM_DEFERRED"

  - method: GET
    path: "/blood-bank/deferrals"
    description: "List deferrals, filterable (reverse-reachability for Deferral.donor_id, center_id, source_reaction_id)"
    roles: [CenterAdmin, IntakeNurse, LabTechnician, InventoryManager, Donor]
    code: 200
    input: ["donor_id?", "center_id?", "source_reaction_id?", "status?", "category?"]
    output: "Deferral[]"
    side_effects: []

  - method: GET
    path: "/blood-bank/deferrals/{deferralId}"
    description: "Get a deferral"
    roles: [CenterAdmin, IntakeNurse, LabTechnician, InventoryManager, Donor]
    code: 200
    input: []
    output: Deferral
    side_effects: []

  - method: POST
    path: "/blood-bank/deferrals/{deferralId}/lift"
    description: "Lift an active deferral (not allowed for INFECTIOUS_RISK)"
    roles: [IntakeNurse]
    code: 200
    input: []
    output: Deferral
    side_effects:
      - "Deferral.status = LIFTED"
      - "Donor.eligibility_status recomputed"

  # --- Slots ---
  - method: POST
    path: "/blood-bank/slots"
    description: "Create an appointment slot"
    roles: [CenterAdmin]
    code: 201
    input: [center_id, donation_type, starts_at, ends_at, capacity]
    output: AppointmentSlot
    side_effects: ["status = OPEN; booked_count = 0"]

  - method: GET
    path: "/blood-bank/slots"
    description: "List slots, filterable (reverse-reachability for AppointmentSlot.center_id)"
    roles: [CenterAdmin, IntakeNurse, InventoryManager, Donor]
    code: 200
    input: ["center_id?", "donation_type?", "status?"]
    output: "AppointmentSlot[]"
    side_effects: []

  - method: GET
    path: "/blood-bank/slots/{slotId}"
    description: "Get a slot (booked_count, status, version)"
    roles: [CenterAdmin, IntakeNurse, InventoryManager, Donor]
    code: 200
    input: []
    output: AppointmentSlot
    side_effects: []

  - method: POST
    path: "/blood-bank/slots/{slotId}/close"
    description: "Close a slot to new bookings"
    roles: [CenterAdmin]
    code: 200
    input: []
    output: AppointmentSlot
    side_effects: ["status = CLOSED"]

  # --- Appointments ---
  - method: POST
    path: "/blood-bank/appointments"
    description: "Book an appointment for a donor into a slot (OCC on slot.version)"
    roles: [Donor, IntakeNurse]
    code: 201
    input: [donor_id, slot_id, expected_slot_version]
    output: Appointment
    side_effects:
      - "OCC: reject if expected_slot_version != slot.version (ERR_STALE_SLOT_VERSION)"
      - "center_id and donation_type copied from slot; status = SCHEDULED; booked_at = current_utc"
      - "Slot.booked_count += 1; Slot.version += 1; Slot.status -> FULL if booked_count >= capacity"
      - "Donor.pending_donation_type recomputed"

  - method: GET
    path: "/blood-bank/appointments"
    description: "List appointments, filterable (reverse-reachability for Appointment.donor_id, slot_id, center_id)"
    roles: [CenterAdmin, IntakeNurse, LabTechnician, InventoryManager, Donor]
    code: 200
    input: ["donor_id?", "slot_id?", "center_id?", "status?"]
    output: "Appointment[]"
    side_effects: []

  - method: GET
    path: "/blood-bank/appointments/{appointmentId}"
    description: "Get an appointment"
    roles: [CenterAdmin, IntakeNurse, LabTechnician, InventoryManager, Donor]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: POST
    path: "/blood-bank/appointments/{appointmentId}/check-in"
    description: "Check a donor in (enforces eligibility + inter-donation interval)"
    roles: [IntakeNurse]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status = CHECKED_IN"]

  - method: POST
    path: "/blood-bank/appointments/{appointmentId}/cancel"
    description: "Cancel a scheduled appointment"
    roles: [Donor, IntakeNurse]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "status = CANCELLED"
      - "Slot.booked_count -= 1; Slot.status recomputed; Donor.pending_donation_type recomputed"

  - method: POST
    path: "/blood-bank/appointments/{appointmentId}/no-show"
    description: "Mark a checked-in donor as no-show after the slot window ends"
    roles: [IntakeNurse]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "status = NO_SHOW"
      - "Slot.booked_count -= 1; Slot.status recomputed; Donor.pending_donation_type recomputed"

  - method: POST
    path: "/blood-bank/appointments/{appointmentId}/donations"
    description: "Record the collection event for a checked-in donor (completes appointment, creates Donation in COLLECTED)"
    roles: [IntakeNurse]
    code: 201
    input: [volume_ml]
    output: Donation
    side_effects:
      - "PLASMA: enforce per-collection and rolling annual caps (plasma_volume_cap)"
      - "Appointment -> COMPLETED; Donation created COLLECTED; collected_at = current_utc"
      - "Slot.booked_count -= 1; Slot.status recomputed"
      - "Donor.lifetime_collected_count += 1; last_qualifying_donation_id + interval fields recomputed"

  # --- Health screenings ---
  - method: POST
    path: "/blood-bank/health-screenings"
    description: "Record a pre-donation health screening; computes PASS/FAIL and auto-defers on certain failures"
    roles: [IntakeNurse]
    code: 201
    input: [appointment_id, hemoglobin_g_dl, systolic_bp, pulse_bpm, weight_kg, recent_travel_risk, disqualifying_medication]
    output: HealthScreening
    side_effects:
      - "donor_id copied from appointment; outcome and failure_reason computed per screening_outcome"
      - "On FAIL with HEMOGLOBIN_LOW/TRAVEL_RISK/MEDICATION: a TEMPORARY Deferral auto-raised; Donor.eligibility_status -> TEMP_DEFERRED"

  - method: GET
    path: "/blood-bank/health-screenings"
    description: "List screenings, filterable (reverse-reachability for HealthScreening.appointment_id, donor_id)"
    roles: [CenterAdmin, IntakeNurse, LabTechnician]
    code: 200
    input: ["appointment_id?", "donor_id?", "outcome?"]
    output: "HealthScreening[]"
    side_effects: []

  - method: GET
    path: "/blood-bank/health-screenings/{screeningId}"
    description: "Get a screening"
    roles: [CenterAdmin, IntakeNurse, LabTechnician]
    code: 200
    input: []
    output: HealthScreening
    side_effects: []

  # --- Donations ---
  - method: GET
    path: "/blood-bank/donations"
    description: "List donations, filterable (reverse-reachability for Donation.donor_id, appointment_id, center_id)"
    roles: [CenterAdmin, IntakeNurse, LabTechnician, InventoryManager]
    code: 200
    input: ["donor_id?", "appointment_id?", "center_id?", "status?", "donation_type?"]
    output: "Donation[]"
    side_effects: []

  - method: GET
    path: "/blood-bank/donations/{donationId}"
    description: "Get a donation"
    roles: [CenterAdmin, IntakeNurse, LabTechnician, InventoryManager]
    code: 200
    input: []
    output: Donation
    side_effects: []

  - method: POST
    path: "/blood-bank/donations/{donationId}/test-results"
    description: "Record the infectious-disease panel result; NEGATIVE releases units, POSITIVE/INDETERMINATE discards"
    roles: [LabTechnician]
    code: 201
    input: [panel_outcome]
    output: TestResult
    side_effects:
      - "TestResult created; Donation.test_result_id set"
      - "NEGATIVE -> Donation RELEASABLE, QUARANTINED units -> AVAILABLE, inventory incremented"
      - "POSITIVE/INDETERMINATE -> Donation DISCARDED, QUARANTINED units -> DISCARDED"
      - "POSITIVE -> PERMANENT INFECTIOUS_RISK Deferral auto-raised; Donor -> PERM_DEFERRED"

  # --- Test results ---
  - method: GET
    path: "/blood-bank/test-results"
    description: "List test results, filterable (reverse-reachability for TestResult.donation_id, donor_id)"
    roles: [CenterAdmin, LabTechnician, InventoryManager]
    code: 200
    input: ["donation_id?", "donor_id?", "panel_outcome?"]
    output: "TestResult[]"
    side_effects: []

  - method: GET
    path: "/blood-bank/test-results/{testResultId}"
    description: "Get a test result"
    roles: [CenterAdmin, LabTechnician, InventoryManager]
    code: 200
    input: []
    output: TestResult
    side_effects: []

  # --- Blood units ---
  - method: POST
    path: "/blood-bank/blood-units"
    description: "Label a blood unit from a COLLECTED donation (assigns DIN, blood_type, expiry; starts QUARANTINED)"
    roles: [LabTechnician]
    code: 201
    input: [donation_id, component, din]
    output: BloodUnit
    side_effects:
      - "donor_id/center_id/blood_type/collected_at copied; expires_at = collection-anchored shelf life (RBC/PLASMA/WHOLE_BLOOD); platelet expiry deferred to release"
      - "status = QUARANTINED"

  - method: GET
    path: "/blood-bank/blood-units"
    description: "List units, filterable (reverse-reachability for BloodUnit.donation_id, donor_id, center_id)"
    roles: [CenterAdmin, LabTechnician, InventoryManager]
    code: 200
    input: ["donation_id?", "donor_id?", "center_id?", "blood_type?", "component?", "status?"]
    output: "BloodUnit[]"
    side_effects: []

  - method: GET
    path: "/blood-bank/blood-units/{unitId}"
    description: "Get a unit (status, expires_at)"
    roles: [CenterAdmin, LabTechnician, InventoryManager]
    code: 200
    input: []
    output: BloodUnit
    side_effects: []

  - method: POST
    path: "/blood-bank/blood-units/{unitId}/reserve"
    description: "Reserve an available, non-expired unit"
    roles: [InventoryManager]
    code: 200
    input: []
    output: BloodUnit
    side_effects: ["status = RESERVED; bucket available_count -= 1, reserved_count += 1"]

  - method: POST
    path: "/blood-bank/blood-units/{unitId}/unreserve"
    description: "Release a reserved unit back to available"
    roles: [InventoryManager]
    code: 200
    input: []
    output: BloodUnit
    side_effects: ["status = AVAILABLE; bucket reserved_count -= 1, available_count += 1"]

  - method: POST
    path: "/blood-bank/blood-units/{unitId}/issue"
    description: "Issue a reserved unit to a hospital order"
    roles: [InventoryManager]
    code: 200
    input: []
    output: BloodUnit
    side_effects: ["status = ISSUED; bucket reserved_count -= 1"]

  # --- Adverse reactions ---
  - method: POST
    path: "/blood-bank/adverse-reactions"
    description: "Log an adverse reaction against a donation; SEVERE auto-defers donor and blocks release"
    roles: [IntakeNurse, LabTechnician]
    code: 201
    input: [donation_id, severity, symptom]
    output: AdverseReaction
    side_effects:
      - "donor_id copied from donation; occurred_at = current_utc"
      - "SEVERE -> a PERMANENT Deferral (category ADVERSE_REACTION) auto-raised with source_reaction_id set; Donor -> PERM_DEFERRED; triggered_deferral_id set"

  - method: GET
    path: "/blood-bank/adverse-reactions"
    description: "List reactions, filterable (reverse-reachability for AdverseReaction.donation_id, donor_id)"
    roles: [CenterAdmin, IntakeNurse, LabTechnician, InventoryManager]
    code: 200
    input: ["donation_id?", "donor_id?", "severity?"]
    output: "AdverseReaction[]"
    side_effects: []

  - method: GET
    path: "/blood-bank/adverse-reactions/{reactionId}"
    description: "Get an adverse reaction"
    roles: [CenterAdmin, IntakeNurse, LabTechnician, InventoryManager]
    code: 200
    input: []
    output: AdverseReaction
    side_effects: []

  # --- Recall / lookback ---
  - method: POST
    path: "/blood-bank/recall-events"
    description: "Open a recall/lookback against a donor; runs the cascade synchronously and closes"
    roles: [InventoryManager]
    code: 201
    input: [center_id, donor_id, reason, lookback_days]
    output: RecallEvent
    side_effects:
      - "Select donor's in-scope donations; donations_in_scope_count set; each -> DISCARDED"
      - "Their non-terminal units -> RECALLED; inventory decremented; units_recalled_count set"
      - "reason POSITIVE_RETEST -> PERMANENT INFECTIOUS_RISK Deferral auto-raised; Donor -> PERM_DEFERRED"
      - "RecallEvent.status = CLOSED"

  - method: GET
    path: "/blood-bank/recall-events"
    description: "List recall events, filterable (reverse-reachability for RecallEvent.center_id, donor_id)"
    roles: [CenterAdmin, InventoryManager]
    code: 200
    input: ["center_id?", "donor_id?", "status?"]
    output: "RecallEvent[]"
    side_effects: []

  - method: GET
    path: "/blood-bank/recall-events/{recallEventId}"
    description: "Get a recall event (scope/recalled counts)"
    roles: [CenterAdmin, InventoryManager]
    code: 200
    input: []
    output: RecallEvent
    side_effects: []

  # --- Inventory ---
  - method: POST
    path: "/blood-bank/inventory-buckets"
    description: "Create/initialize an inventory bucket for a (center, blood_type, component) triple"
    roles: [InventoryManager]
    code: 201
    input: [center_id, blood_type, component]
    output: InventoryBucket
    side_effects: ["available_count and reserved_count initialized from a recount of existing units"]

  - method: GET
    path: "/blood-bank/inventory-buckets"
    description: "List inventory buckets, filterable (reverse-reachability for InventoryBucket.center_id); each reflects a live recount"
    roles: [CenterAdmin, InventoryManager, LabTechnician]
    code: 200
    input: ["center_id?", "blood_type?", "component?"]
    output: "InventoryBucket[]"
    side_effects: []

  - method: GET
    path: "/blood-bank/inventory-buckets/{bucketId}"
    description: "Get a bucket (available_count, reserved_count reflect live recount)"
    roles: [CenterAdmin, InventoryManager, LabTechnician]
    code: 200
    input: []
    output: InventoryBucket
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # auth
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  # not found
  - { id: ERR_NOT_FOUND, http: 404, condition: "Generic resource not found" }
  - { id: ERR_CENTER_NOT_FOUND, http: 404, condition: "Donation center not found" }
  - { id: ERR_DONOR_NOT_FOUND, http: 404, condition: "Donor not found" }
  - { id: ERR_DEFERRAL_NOT_FOUND, http: 404, condition: "Deferral not found" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "Appointment slot not found" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "Appointment not found" }
  - { id: ERR_SCREENING_NOT_FOUND, http: 404, condition: "Health screening not found" }
  - { id: ERR_DONATION_NOT_FOUND, http: 404, condition: "Donation not found" }
  - { id: ERR_TEST_RESULT_NOT_FOUND, http: 404, condition: "Test result not found" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "Blood unit not found" }
  - { id: ERR_REACTION_NOT_FOUND, http: 404, condition: "Adverse reaction not found" }
  - { id: ERR_RECALL_EVENT_NOT_FOUND, http: 404, condition: "Recall event not found" }
  - { id: ERR_BUCKET_NOT_FOUND, http: 404, condition: "Inventory bucket not found" }
  # input validation
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, bad enum, out-of-range number, bad datetime" }
  - { id: ERR_INVALID_DEFERRAL_DURATION, http: 422, condition: "TEMPORARY deferral missing/invalid duration_days, or PERMANENT deferral carries duration_days" }
  - { id: ERR_COMPONENT_TYPE_MISMATCH, http: 422, condition: "BloodUnit component incompatible with the donation's donation_type" }
  - { id: ERR_INVALID_SLOT_WINDOW, http: 422, condition: "Slot ends_at not strictly after starts_at" }
  - { id: ERR_PLASMA_VOLUME_EXCEEDED, http: 422, condition: "PLASMA collection volume_ml exceeds the donor's weight-band per-collection cap" }
  - { id: ERR_ANNUAL_PLASMA_CAP_EXCEEDED, http: 422, condition: "Rolling 365-day plasma volume including this collection exceeds the annual liters cap" }
  # concurrency
  - { id: ERR_STALE_SLOT_VERSION, http: 412, condition: "expected_slot_version does not match AppointmentSlot.version" }
  # state
  - { id: ERR_APPOINTMENT_NOT_SCHEDULED, http: 409, condition: "Appointment must be SCHEDULED for check-in" }
  - { id: ERR_APPOINTMENT_NOT_CHECKED_IN, http: 409, condition: "Appointment must be CHECKED_IN for donation/no-show" }
  - { id: ERR_APPOINTMENT_NOT_CANCELLABLE, http: 409, condition: "Appointment must be SCHEDULED to cancel" }
  - { id: ERR_DONATION_NOT_COLLECTED, http: 409, condition: "Donation must be COLLECTED for this operation" }
  - { id: ERR_UNIT_NOT_AVAILABLE, http: 409, condition: "Blood unit must be AVAILABLE for this operation" }
  - { id: ERR_UNIT_NOT_RESERVED, http: 409, condition: "Blood unit must be RESERVED for this operation" }
  - { id: ERR_UNIT_EXPIRED, http: 409, condition: "Blood unit is past expires_at and cannot be reserved" }
  - { id: ERR_DEFERRAL_NOT_ACTIVE, http: 409, condition: "Deferral must be ACTIVE to lift" }
  # business safety / temporal / constraint
  - { id: ERR_DONOR_NOT_ELIGIBLE, http: 403, condition: "Donor.eligibility_status is not ELIGIBLE at check-in" }
  - { id: ERR_SCREENING_NOT_PASSED, http: 409, condition: "No PASS HealthScreening exists for the appointment before collection" }
  - { id: ERR_SEVERE_REACTION_BLOCKS_RELEASE, http: 409, condition: "A SEVERE adverse reaction prevents releasing the donation's units" }
  - { id: ERR_INTERVAL_NOT_ELAPSED, http: 409, condition: "Inter-donation interval not yet elapsed for the donation type" }
  - { id: ERR_SLOT_WINDOW_OPEN, http: 409, condition: "Slot window has not ended yet (no-show not allowed)" }
  - { id: ERR_SLOT_NOT_BOOKABLE, http: 409, condition: "Slot is CLOSED or FULL when booking" }
  - { id: ERR_DONOR_HAS_OPEN_APPOINTMENT, http: 409, condition: "Donor already holds an open (SCHEDULED/CHECKED_IN) appointment" }
  - { id: ERR_DUPLICATE_DIN, http: 409, condition: "DIN label already used by another unit at the center" }
  - { id: ERR_INFECTIOUS_DEFERRAL_NOT_LIFTABLE, http: 409, condition: "INFECTIOUS_RISK deferrals cannot be lifted" }
  - { id: ERR_CLOCK_NOT_MONOTONIC, http: 409, condition: "Clock advance target is not strictly after current_utc" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: CenterAdmin
    description: "Manages centers, the deterministic clock, and slots; read access across the center"
    identity: opaque
    exclusive_operations:
      - "POST /blood-bank/centers — create center"
      - "POST /blood-bank/centers/{id}/clock/advance — advance clock"
      - "POST /blood-bank/slots — create slot"
      - "POST /blood-bank/slots/{id}/close — close slot"
    shared_operations:
      - "GET endpoints across centers, donors, deferrals, slots, appointments, screenings, donations, test-results, units, reactions, recall-events, inventory-buckets"

  - name: IntakeNurse
    description: "Registers donors, runs screenings, raises/lifts deferrals, checks in donors, records collections and reactions"
    identity: opaque
    exclusive_operations:
      - "POST /blood-bank/deferrals — raise deferral"
      - "POST /blood-bank/deferrals/{id}/lift — lift deferral"
      - "POST /blood-bank/appointments/{id}/check-in — check in"
      - "POST /blood-bank/appointments/{id}/no-show — no-show"
      - "POST /blood-bank/appointments/{id}/donations — record collection"
      - "POST /blood-bank/health-screenings — record screening"
    shared_operations:
      - "POST /blood-bank/donors — register donor (shared with Donor)"
      - "POST /blood-bank/appointments — book appointment (shared with Donor)"
      - "POST /blood-bank/appointments/{id}/cancel — cancel (shared with Donor)"
      - "POST /blood-bank/adverse-reactions — log reaction (shared with LabTechnician)"
      - "GET reads across the center"

  - name: LabTechnician
    description: "Records infectious-disease test results, labels blood units, manages quarantine release, logs reactions"
    identity: opaque
    exclusive_operations:
      - "POST /blood-bank/donations/{id}/test-results — record test result"
      - "POST /blood-bank/blood-units — label unit"
    shared_operations:
      - "POST /blood-bank/adverse-reactions — log reaction (shared with IntakeNurse)"
      - "GET reads across the center"

  - name: InventoryManager
    description: "Manages blood-unit lifecycle (reserve/unreserve/issue), inventory buckets, and recall/lookback"
    identity: opaque
    exclusive_operations:
      - "POST /blood-bank/blood-units/{id}/reserve — reserve unit"
      - "POST /blood-bank/blood-units/{id}/unreserve — unreserve unit"
      - "POST /blood-bank/blood-units/{id}/issue — issue unit"
      - "POST /blood-bank/recall-events — open recall"
      - "POST /blood-bank/inventory-buckets — create bucket"
    shared_operations:
      - "GET reads across the center"

  - name: Donor
    description: "Self-service donor: registers self, books/cancels own appointments, reads own records"
    identity: entity_backed:Donor
    exclusive_operations: []
    shared_operations:
      - "POST /blood-bank/donors — register (shared with IntakeNurse)"
      - "POST /blood-bank/appointments — book (shared with IntakeNurse)"
      - "POST /blood-bank/appointments/{id}/cancel — cancel own appointment (shared with IntakeNurse)"
      - "GET reads (centers, own donor, own deferrals/appointments, slots)"
