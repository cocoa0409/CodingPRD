        distinguishing_aspect: "Filtered lists honor query parameters: GET /enrollments?academic_status=WITHDRAWN returns only withdrawn rows; GET /offerings?state_code=NM returns only NM offerings."
        test_recipe:
          setup: ["LICENSED school; PUBLISHED TX offering with 2 enrollments (one later WITHDRAWN); a second PUBLISHED NM offering of a course authorized via grant"]
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
