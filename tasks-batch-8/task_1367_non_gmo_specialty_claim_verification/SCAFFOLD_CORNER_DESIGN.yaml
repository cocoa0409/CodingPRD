            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { pv: $.data.version } }
            - { call: "POST /sampling-plans", payload: { product_id: "${p1}", risk_point: "INGREDIENT_INTAKE", expected_product_version: "${pv}" }, as: VerifierAdmin, captures: { plan: $.data.id } }
            - { call: "POST /samples", payload: { sampling_plan_id: "${plan}", ingredient_id: "${ing}" }, as: LabAnalyst, as_user_id: "lab-1", captures: { s1: $.data.id } }
            - { call: "POST /samples/${s1}/record-result", payload: { result_gmo_pct: 0.10 }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /samples/${s1}/confirm", as: LabAnalyst, as_user_id: "lab-2" }
            - { call: "POST /facility-audits", payload: { brand_id: "${b1}", facility_name: "F1", auditor_id: "aud-1", scheduled_date: "2026-08-05T00:00:00Z" }, as: VerifierAdmin, captures: { au: $.data.id } }
            - { call: "POST /facility-audits/${au}/submit-report", payload: { lots: [ { lot_code: "L1", input_qty: 200, recovered_qty: 190 } ] }, as: Auditor, as_user_id: "aud-1" }
            - { call: "POST /facility-audits/${au}/decide", payload: { decision: "PASSED" }, as: VerifierAdmin }
            - { call: "POST /products/${p1}/decide", payload: { decision: "VERIFIED" }, as: VerifierAdmin }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-15T00:00:00Z" }, as: VerifierAdmin }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { st1: $.data.enrollment_status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-02T00:00:00Z" }, as: VerifierAdmin }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { st2: $.data.enrollment_status } }
            - { call: "GET /licenses?product_id=${p1}", as: VerifierAdmin, captures: { lst: "$.data[0].status" } }
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b1}", captures: { err: $.data.error_id } }
          assert:
            - "at 2027-06-15 (inside window): enrollment_status == RENEWAL_DUE"
            - "at 2027-08-02 (past valid_until): license status == EXPIRED and enrollment_status == LAPSED"
            - "terminal lockdown: submit on LAPSED returns ERR_PRODUCT_INVALID_STATE"

      - name: submit_without_ingredients_returns_no_ingredients
