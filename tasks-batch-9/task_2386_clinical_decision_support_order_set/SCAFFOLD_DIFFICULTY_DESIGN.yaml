            - "${w1_state} == CLOSED"
            - "${w2_state} == OPEN and ${w2_start} == 2026-09-08T00:00:00Z — window_start equal to W1's exclusive window_end is ADJACENT under half-open semantics and is accepted"
            - "${w2_closed_state} == CLOSED"
            - "${overlap_error} == ERR_BURDEN_WINDOW_OVERLAP with HTTP 409 — [2026-09-05, 2026-09-12) genuinely intersects both closed windows, and it is the overlap rule that fires, not the one-window-open rule, since no window is OPEN at this instant"
            - "${w4_state} == OPEN — the second adjacency case (window_start == W2's window_end) is likewise accepted, so the rule is symmetric rather than a lucky first pass"
            - "${total_windows} == OPEN — exactly three windows exist on this alert (W1 CLOSED, W2 CLOSED, W4 OPEN); the rejected attempt persisted nothing"

      - name: overlap_downtime_closed_interval_rejects_touching_endpoint_and_scope_widening
        interval_semantics: "closed [window_start, window_end]: equal endpoints DO conflict"
        grounds:
          - validations[priority=20]
          - errors.ERR_DOWNTIME_WINDOW_OVERLAP
          - entities.DowntimeEvent.fields.scope
          - state_machines.DowntimeEvent.SCHEDULED_to_ACTIVE
        distinguishing_aspect: |
          A different resource entity (DowntimeEvent, contending for the CDS platform's
          availability rather than an alert's monitoring timeline) with deliberately
          INVERTED interval semantics: downtime intervals are closed, so a window that
          starts exactly when another ends DOES conflict — the opposite verdict from the
          burden-window case on identical arithmetic. Overlap is additionally scoped, so
          the same touching window is accepted under a disjoint scope and refused again
          under SYSTEM_WIDE, which intersects everything.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; no clinicians are needed because every downtime endpoint is SystemAdmin-only."
            - "D1: scope ORDER_SETS_ONLY, mode READ_ONLY, 2026-08-10T00:00:00Z to 2026-08-10T06:00:00Z, state SCHEDULED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cds/downtime-events"
              payload: { scope: "ORDER_SETS_ONLY", mode: "READ_ONLY", window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-10T06:00:00Z", planned: true, reason: "Order set catalogue reindex" }
              as: SystemAdmin
              captures: { d1_id: $.data.id, d1_state: $.data.state }
          trigger:
            - call: "POST /cds/downtime-events"
              payload: { scope: "ORDER_SETS_ONLY", mode: "READ_ONLY", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T12:00:00Z", planned: true, reason: "Second maintenance leg" }
              as: SystemAdmin
              captures: { touch_error: $.data.error_id }
            - call: "POST /cds/downtime-events"
              payload: { scope: "ALERTS_ONLY", mode: "READ_ONLY", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T12:00:00Z", planned: true, reason: "Alert engine patch" }
              as: SystemAdmin
              captures: { d3_id: $.data.id, d3_state: $.data.state, d3_scope: $.data.scope }
            - call: "POST /cds/downtime-events"
              payload: { scope: "SYSTEM_WIDE", mode: "FULL_UNAVAILABLE", window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T18:00:00Z", planned: true, reason: "Datacentre failover" }
              as: SystemAdmin
              captures: { widen_error: $.data.error_id }
            - call: "POST /cds/downtime-events"
              payload: { scope: "SYSTEM_WIDE", mode: "FULL_UNAVAILABLE", window_start: "2026-08-10T12:00:01Z", window_end: "2026-08-10T18:00:00Z", planned: true, reason: "Datacentre failover" }
              as: SystemAdmin
              captures: { d5_id: $.data.id, d5_state: $.data.state }
          assert:
            - "${d1_state} == SCHEDULED — SCHEDULED events already participate in the overlap check; activation is not required"
            - "${touch_error} == ERR_DOWNTIME_WINDOW_OVERLAP with HTTP 409 — window_start 06:00:00Z equals D1's window_end exactly, and under CLOSED-interval semantics that is a conflict; the identical arithmetic was ACCEPTED for burden windows because those are half-open"
            - "${d3_state} == SCHEDULED and ${d3_scope} == ALERTS_ONLY — the very same touching interval is allowed once the scope no longer intersects"
            - "${widen_error} == ERR_DOWNTIME_WINDOW_OVERLAP — 12:00:00Z touches D3's window_end and SYSTEM_WIDE intersects ALERTS_ONLY, so scope widening cannot slip past the check"
            - "${d5_state} == SCHEDULED — one second of clearance is sufficient, which pins the comparison to inclusive endpoints rather than to any day- or hour-level granularity"
            - "Exactly three DowntimeEvent rows exist afterwards (D1, D3, D5): GET /cds/downtime-events returns total_count 3 and neither rejected attempt persisted a row or incremented blocked_mutation_count"

  - rule_id: compensating_invariant
    instances:
      - name: compensating_reviewer_workload_minutes_conserved_across_withdraw_and_reassign
        conserved_quantity: "Clinician.review_workload_capacity_minutes == review_workload_assigned_minutes + review_workload_remaining_minutes, and review_workload_assigned_minutes == sum(estimated_minutes) over that clinician's ReviewAssignment rows in state ASSIGNED or CAST"
        grounds:
          - calculations.reviewer_workload_minutes
          - entities.Clinician.fields.review_workload_assigned_minutes
          - entities.Clinician.fields.review_workload_remaining_minutes
          - entities.Clinician.fields.open_assignment_count
          - state_machines.ReviewAssignment.ASSIGNED_to_WITHDRAWN
          - validations[priority=24]
        distinguishing_aspect: |
          The conserved quantity is a reviewer's committee time budget. Two traps sit in
          it. First, the minutes ledger and open_assignment_count are conserved on
          DIFFERENT events: casting a vote conserves the minutes (the review was
          performed, so the time is spent) while dropping open_assignment_count, so a
          naive implementation that treats them as one counter drifts on the very first
          cast. Second, a withdraw followed by an identical re-assignment must restore
          the ledger to the byte, and the re-assignment is only legal because WITHDRAWN
          rows are excluded from the duplicate-assignment rule.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sponsor, builder, chair and one reviewer (rev1, capacity 480, authorised as both PeerReviewer and SpecialtyApprover) exist."
            - "An accepted BOTH request carries an order set with one HIGH-ALERT item, so risk_class is HIGH and a PEER_REVIEW assignment costs 35 minutes; the order set is in review_state PEER_REVIEW."
            - "The same request carries a TIER_1_HARD_STOP alert with a hard_stop_justification, so a SPECIALTY_APPROVAL assignment on it costs 30 minutes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Reyes", npi: "1000000001", specialty: "CARDIOLOGY", authorized_roles: ["ClinicalSponsor"] }
              as: SystemAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Bhatt", npi: "1000000003", specialty: "INFORMATICS", authorized_roles: ["InformaticsBuilder"] }
              as: SystemAdmin
              captures: { builder_id: $.data.id }
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Okafor", npi: "1000000002", specialty: "INTERNAL_MEDICINE", authorized_roles: ["CommitteeChair"] }
              as: SystemAdmin
              captures: { chair_id: $.data.id }
