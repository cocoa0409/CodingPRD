              as: StationManager
              captures: { st_status: $.data.status }
          assert:
            - "${st_status} == SUSPENDED"
            - "FlightBank.${fb_id}.bank_status == LOCKED"
            - "FlightBank.${fb_id}.staffing_status == REVISION_REQUIRED"
            - "Turn.${t_id}.status == DISRUPTED"
            - "TurnResource.${tr_a}.status == CANCELLED"
            - "TurnResource.${tr_a}.cancel_reason == STATION_SUSPENDED"
            - "TurnResource.${tr_g}.status == CANCELLED"
            - "TurnResource.${tr_g}.cancel_reason == STATION_SUSPENDED"
            - "Agent.${a_id}.assigned_duty_minutes == 0"
            - "GseUnit.${g_id}.committed_occupation_minutes == 0"
            - "GseUnit.${g_id}.status == AVAILABLE"

      - name: season_rollover_archives_outgoing_banks_and_cancels_their_turns
        claim_type: cross_entity
        grounds:
