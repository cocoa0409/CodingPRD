      - name: bench_capacity_field_is_conditionally_required_in_both_directions
        claim_type: conditional_validation
        grounds:
          - validations[priority=5]
          - errors[ERR_BENCH_CAPACITY_REQUIRED]
          - calculations.diagnostic_validity_gate
        distinguishing_aspect: |
          Priority 5 is a two-way conditional: the field is required for BENCH_CAPACITY_TEST and
          FORBIDDEN for TELEMATICS_FLEET, so both directions must fail with the same error. Once the
          field is supplied, the plausibility ceiling is computed against the DERATED bench basis
          (80.000 * 14/16 == 70.000, ceiling 73.500), so 90.000 is BENCH_OUT_OF_RANGE while 63.000
          is VALID at 90.00 % retention.
        test_recipe:
          setup:
            - "The canonical chain: program, center, technician, vehicle, installed pack, three valid snapshots."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
