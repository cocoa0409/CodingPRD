      - name: visit_state_conflict_beats_delivered_units_overflow
        grounds:
          - validations[priority=15]
          - validations[priority=42]
          - errors[ERR_VISIT_STATE_INVALID]
          - errors[ERR_DELIVERED_EXCEEDS_REQUESTED]
        distinguishing_aspect: |
          Pair `state` (priority 15) vs `business_constraint` (priority 42): a second completion of an
          already COMPLETED visit that ALSO reports delivered_units 999 against a requested 20 returns
          ERR_VISIT_STATE_INVALID (409), never ERR_DELIVERED_EXCEEDS_REQUESTED (422).
        test_recipe:
          setup:
            - "clock at 2026-08-03T09:30:00Z; one MON route; one account with one planned site; catalog holds one green-linked COFFEE product"
