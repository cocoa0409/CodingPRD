      - name: acceptance_score_tier_derived_from_raw_completeness_only
        grounds:
          - calculations.remediation_acceptance_score
          - calculations.root_cause_depth_score
          - entities.RemediationPlan.fields.raw_completeness
          - entities.RemediationPlan.fields.completeness_tier
          - entities.RemediationPlan.fields.acceptance_score
          - state_machines.RemediationPlan.DRAFTED_to_SUBMITTED
          - state_machines.RemediationPlan.SUBMITTED_to_ACCEPTED
          - errors[ERR_ACCEPTANCE_SCORE_BELOW_THRESHOLD]
        distinguishing_aspect: |
          Mode (c): the four steps look circular (penalty lowers the score, a lower score would imply a
          harsher tier, a harsher tier would imply a bigger penalty) but the order is pinned - the tier
          comes from raw_completeness alone and exactly one penalty pass runs. depth_score 10.00,
          action_specificity_score 8.00 and 5 of 5 actions give raw_completeness 9.30 -> STRONG ->
          penalty_rate 0.05; 30 days late gives acceptance_score 7.80, which clears the 7.00 threshold.
          The rejected circular reading re-tiers 7.80 as STANDARD, charges 0.10 * 30 and produces 6.30,
          which would fail acceptance with ERR_ACCEPTANCE_SCORE_BELOW_THRESHOLD.
