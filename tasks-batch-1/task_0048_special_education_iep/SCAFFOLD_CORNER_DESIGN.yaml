              as_user_id: "ev_1"
            - call: "POST /ieps"
              payload: { student_id: "${stu_id}", school_day_minutes: 360, annual_review_due_date: "2027-03-01" }
              as: CaseManager
              as_user_id: "cm_1"
              captures: { iep_id: $.data.id }
