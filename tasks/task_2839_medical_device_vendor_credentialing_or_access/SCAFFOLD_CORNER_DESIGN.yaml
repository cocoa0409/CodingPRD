          trigger:
            - call: "POST /vendor-access/loaner-sets"
              payload: { surgical_case_id: "${case_15200_id}", approved_product_id: "${ap_ob_id}", tray_count: 2, reprocessing_complexity: "SIMPLE", expected_case_version: "${case_15200_ver0}" }
