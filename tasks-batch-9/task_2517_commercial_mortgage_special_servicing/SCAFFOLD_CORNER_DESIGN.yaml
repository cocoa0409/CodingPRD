            - call: "POST /special-servicing/workout-alternatives"
              payload: { workout_plan_id: "${plan_id}", alternative_type: "MODIFICATION", projected_cash_flows: [{ period_index: 1, amount_usd: 1000000 }, { period_index: 2, amount_usd: 1000000 }, { period_index: 3, amount_usd: 8000000 }], upfront_cost_usd: 100000 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { mod_alt_id: "$.data.id" }
            - call: "POST /special-servicing/workout-alternatives"
              payload: { workout_plan_id: "${plan_id}", alternative_type: "NOTE_SALE", projected_cash_flows: [{ period_index: 1, amount_usd: 8500000 }], upfront_cost_usd: 90000 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { sale_alt_id: "$.data.id" }
            - call: "POST /special-servicing/workout-plans/${plan_id}/status"
