  - rule_id: transitive_cascade
    instances:
      - name: emissions_breach_freeze_and_remediation_thaw
        grounds:
          - state_machines.EnvironmentalPermit.WARNING_to_BREACH
          - state_machines.MeltBatch.CERTIFIED_to_HELD
          - calculations.emissions_period_rollup
          - entities.ProductionOrder.fields.posture
        distinguishing_aspect: |
          Depth-3 cascade from an environmental trigger: an EmissionsReading mutates
          the permit (ACTIVE -> WARNING -> BREACH, link 1); the permit's BREACH
          mutates each in-flight MeltBatch to HELD (link 2, caused by the permit
          change); each HELD melt forces its ProductionOrder posture to FROZEN
          (link 3, caused by the melt change). The sibling instance's cascade is
          triggered by a defect disposition and travels unit -> order counters ->
          posture instead. This instance also asserts the symmetric thaw:
          certify-remediation resumes HELD melts to state_before_hold and lifts
          FROZEN.
        test_recipe:
          setup:
            - "Product P, order O (planned 10) released"
            - "AIR_EMISSIONS permit, limit_value 100.0"
            - "Melt B1 on FURNACE_A charged/read/certified (CERTIFIED); melt B2 on FURNACE_B charged/read/certified/tapped 2010 lbs (TAPPED)"
            - "Mold M prepared for O"
          setup_api_calls:
            - call: "POST /foundry/products"
              payload: { sku_code: "L8SK3", name: "Skillet 10.25in", category: SKILLET, target_weight_oz: 128.0, weight_tolerance_oz: 6.0, target_diameter_in: 10.25, diameter_tolerance_in: 0.125, min_wall_thickness_in: 0.1875, wholesale_price_cents: 2400, msrp_cents: 4000, import_landed_cost_cents: 2000, peak_season_start_week: 44, peak_season_end_week: 52 }
