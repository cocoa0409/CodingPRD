      # ---------------------------------------------------------------- Idempotency
      - name: sm_idempotency_repeating_a_successful_trigger_is_refused_on_five_machines
        claim_type: Idempotency
        grounds:
          - state_machines.MoldingCycle.SCHEDULED_to_OVEN_RUNNING
          - state_machines.ResinCharge.RESERVED_to_RELEASED
          - state_machines.OvenStation.DOWN_to_OPERATIONAL
          - state_machines.CoolingBay.DOWN_to_OPERATIONAL
          - state_machines.Technician.SUSPENDED_to_ACTIVE
          - state_machines.Customer.SUSPENDED_to_ACTIVE
          - errors.ERR_CHARGE_NOT_RELEASABLE
          - errors.ERR_OVEN_STATION_ALREADY_OPERATIONAL
          - errors.ERR_COOLING_BAY_ALREADY_OPERATIONAL
          - errors.ERR_TECHNICIAN_ALREADY_ACTIVE
          - errors.ERR_CUSTOMER_ALREADY_ACTIVE
        distinguishing_aspect: "No trigger in this API is idempotent: replaying start-oven, charge release, station restore, bay restore, technician reinstate and customer reinstate after each has already succeeded returns a 409 naming that machine's own already-in-state error, and not one version number moves on the replay."
        test_recipe:
          setup:
            - "The PM-SM-IDM fixture with one mould, TWO oven stations (OVN-SM-IDM-1 carries the cycles, OVN-SM-IDM-2 is a spare used only for the restore replay) and TWO cooling bays for the same reason."
            - "ProductionOrder POR-SM-IDM (ordered_qty 2) is released and carries CYC-A (oven 09:00-10:00) and CYC-B (oven 11:00-12:00) on disjoint mould spans; each has one 24.000 kg RESERVED charge."
            - "CYC-A is started, so it sits in OVEN_RUNNING; CYC-B's charge is released once, so it sits in RELEASED while the cycle stays SCHEDULED."
            - "The spare station and spare bay are marked down and restored, so both are OPERATIONAL again with two writes already on the clock."
            - "A spare Technician TEC-SM-IDM-SPR and a Customer CUS-SM-IDM are suspended and reinstated, so both are ACTIVE again; neither takes part in the cycles, so the replay cannot disturb production."
