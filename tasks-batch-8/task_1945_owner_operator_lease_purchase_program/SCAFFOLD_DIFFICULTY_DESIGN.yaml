            - "EscrowAccount.${esc}.balance_cents == 40001 == escrow_cap_cents -> status FULL (>= boundary)"
            - "captured st4_esc == 0   (cap room 0 after FULL)"
            - "after st4 finalize: EscrowAccount.${esc}.balance_cents == 40001 and total_credited_cents == 40001"

      - name: guarantee_exact_gross_boundary
        grounds:
          - calculations.guarantee_top_up
          - entities.SettlementStatement.fields.guarantee_top_up_cents
        distinguishing_aspect: |
          Metric = weekly gross revenue at the guarantee floor (max(0, G - gross)
          semantics): gross exactly 150000 yields top_up 0 while gross 149999 yields
          top_up 1. Endpoint under test: settlement create (distinct from finalize).
        test_recipe:
          setup:
