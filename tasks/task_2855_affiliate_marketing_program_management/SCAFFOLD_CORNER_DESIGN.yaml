      - name: pagination_limit_and_offset_bounds_return_invalid_request
        claim_type: violation_to_error
        grounds:
          - validations[priority 15]
          - errors[ERR_PAGINATION_INVALID]
        distinguishing_aspect: "limit 0, limit 101 and offset -1 are each rejected with ERR_PAGINATION_INVALID (400) on the same collection route, while limit 1 / offset 0 succeeds — the bounds are 1..100 inclusive and offset >= 0, so limit 100 must NOT be rejected."
        test_recipe:
          setup:
            - "Clock 2026-07-05T00:00:00Z and two registered partners so the collection is non-empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
