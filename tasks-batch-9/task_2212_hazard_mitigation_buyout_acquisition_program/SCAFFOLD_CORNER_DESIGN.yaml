        claim_type: invalid_transition
        grounds:
          - validations.priority_26
          - validations.priority_27
          - state_machines.BenefitCostAnalysis
          - state_machines.Appraisal
        distinguishing_aspect: |
          Each machine refuses the exact operation that produced its current state: validating an
          already VALIDATED analysis returns ERR_INVALID_BCA_STATE, submitting an already SUBMITTED
          appraisal returns ERR_INVALID_APPRAISAL_STATE, and re-accepting an ACCEPTED appraisal
          returns ERR_INVALID_APPRAISAL_STATE - three 409s with two different error ids.
        test_recipe:
          setup:
