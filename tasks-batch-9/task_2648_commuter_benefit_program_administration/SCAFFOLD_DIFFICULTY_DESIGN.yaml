# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2648 - Commuter Benefit Program Administration
# Nine §0.5 rule_ids, each with >= 2 differentiated instances.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: election_exclusion_split_elected_vs_funded_basis_divergence
        grounds:
          - calculations.election_pretax_exclusion_split
          - state_machines.ElectionWindow.OPEN_to_LOCKED
          - state_machines.Election.PENDING_to_FUNDED
          - state_machines.Election.PENDING_to_CANCELLED
          - entities.Election.fields.exclusion_basis
          - entities.Election.fields.excluded_amount_cents
          - entities.Election.fields.posttax_spill_cents
        distinguishing_aspect: |
          Variant divergence on the Election entity domain: the elected_basis inclusion set
          {PENDING, HELD, FUNDED} charges a live sibling election's headroom against this election,
          while the funded_basis inclusion set {FUNDED} releases it, so the SAME stored
          pretax_amount_cents of 18000 yields excluded_amount_cents 12500 at creation and 18000 at
          window lock without any client re-submission.
        test_recipe:
          setup:
            - "Employer 'Bay Transit Co' is ACTIVE in US-CA-SFO with transit_group_limit_cents 32500, pretax_ratio_cap_pct 100 and spill_policy SPILL_TO_POSTTAX."
            - "Two TRANSIT-limit-group categories exist: VANPOOL (monthly_exclusion_limit_cents 20000) and TRANSIT_PASS (32500)."
            - "One employee holds one BenefitAccount per category, both with zero opening balance."
            - "ElectionWindow 2026-08 occupies [2026-07-01T00:00:00Z, 2026-08-20T00:00:00Z) and is OPEN; the logical clock is at its 2026-08-01T00:00:00Z default, inside the window and before the cutoff."
            - "The VANPOOL election (pretax 20000) was created first and consumed 20000 of the 32500 TRANSIT group limit, then the TRANSIT_PASS election (pretax 18000) was created and settled on excluded_amount_cents 12500 with posttax_spill_cents 5500 under ELECTED_BASIS."
            - "The VANPOOL election has since been CANCELLED, so it no longer holds any funded headroom - but the TRANSIT_PASS election still stores 12500."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Bay Transit Co", region_code: "US-CA-SFO", transit_group_limit_cents: 32500, parking_group_limit_cents: 30000, program_cap_cents: 5000000, pretax_ratio_cap_pct: 100, spill_policy: "SPILL_TO_POSTTAX" }
              as: ProgramAdmin
              captures: { er_id: $.data.id }
            - call: "POST /benefits/employers/${er_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/benefit-categories"
              payload: { employer_id: "${er_id}", category_type: "VANPOOL", monthly_exclusion_limit_cents: 20000, pretax_allowed: true, posttax_allowed: true }
              as: ProgramAdmin
              captures: { cat_vp_id: $.data.id }
            - call: "POST /benefits/benefit-categories"
              payload: { employer_id: "${er_id}", category_type: "TRANSIT_PASS", monthly_exclusion_limit_cents: 32500, pretax_allowed: true, posttax_allowed: true }
              as: ProgramAdmin
              captures: { cat_tp_id: $.data.id }
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "EMP-001", work_region_code: "US-CA-SFO", payroll_cycle: "MONTHLY", hire_date: "2026-01-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "${emp_id}", benefit_category_id: "${cat_vp_id}", opening_rollover_cents: 0 }
              as: ProgramAdmin
              captures: { acct_vp_id: $.data.id, acct_vp_v: $.data.version }
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "${emp_id}", benefit_category_id: "${cat_tp_id}", opening_rollover_cents: 0 }
              as: ProgramAdmin
              captures: { acct_tp_id: $.data.id, acct_tp_v: $.data.version }
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_id}", benefit_month: "2026-08", opens_at: "2026-07-01T00:00:00Z", cutoff_at: "2026-08-20T00:00:00Z", mid_month_change_allowed: false }
              as: ProgramAdmin
              captures: { win_id: $.data.id }
            - call: "POST /benefits/election-windows/${win_id}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/elections"
              payload: { employee_id: "${emp_id}", election_window_id: "${win_id}", benefit_category_id: "${cat_vp_id}", pretax_amount_cents: 20000, posttax_amount_cents: 0, media_quantity: 0, expected_account_version: "${acct_vp_v}" }
              as: ProgramAdmin
              captures: { el_vp_id: $.data.id }
            - call: "POST /benefits/elections"
              payload: { employee_id: "${emp_id}", election_window_id: "${win_id}", benefit_category_id: "${cat_tp_id}", pretax_amount_cents: 18000, posttax_amount_cents: 0, media_quantity: 0, expected_account_version: "${acct_tp_v}" }
              as: ProgramAdmin
              captures: { el_tp_id: $.data.id }
            - call: "GET /benefits/elections/${el_tp_id}"
              payload: {}
              as: ProgramAdmin
              captures: { tp_excluded_elected: $.data.excluded_amount_cents, tp_spill_elected: $.data.posttax_spill_cents, tp_basis_elected: $.data.exclusion_basis }
            - call: "POST /benefits/elections/${el_vp_id}/cancel"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /benefits/election-windows/${win_id}/lock"
              payload: {}
              as: ProgramAdmin
          assert:
            - "${tp_excluded_elected} == 12500"
            - "${tp_spill_elected} == 5500"
            - "${tp_basis_elected} == ELECTED_BASIS"
            - "Election.${el_tp_id}.excluded_amount_cents == 18000"
            - "Election.${el_tp_id}.posttax_spill_cents == 0"
            - "Election.${el_tp_id}.posttax_effective_cents == 0"
            - "Election.${el_tp_id}.exclusion_basis == FUNDED_BASIS"
            - "Election.${el_tp_id}.funding_status == FUNDED"
            - "Election.${el_tp_id}.total_amount_cents == 18000"
            - "Election.${el_vp_id}.funding_status == CANCELLED"
            - "Election.${el_vp_id}.excluded_amount_cents == 0"
            - "BenefitAccount.${acct_tp_id}.contributed_cents == 18000"
            - "BenefitAccount.${acct_tp_id}.available_balance_cents == 18000"
            - "BenefitAccount.${acct_tp_id}.ledger_entry_count == 1"
            - "ElectionWindow.${win_id}.status == LOCKED"
            - "the variant delta is exactly 18000 - 12500 == 5500 cents on the same stored pretax_amount_cents of 18000"

      - name: month_close_standard_vs_termination_variant_bucket_split
        grounds:
          - calculations.benefit_account_month_close
          - calculations.benefit_account_conservation
          - state_machines.Employee.ACTIVE_to_TERMINATED
          - state_machines.ElectionWindow.LOCKED_to_CLOSED
          - entities.BenefitAccount.fields.forfeited_cents
          - entities.BenefitAccount.fields.refunded_cents
          - entities.Employer.fields.rollover_cap_cents
          - entities.Employer.fields.forfeiture_grace_days
        distinguishing_aspect: |
          Variant divergence on a DIFFERENT entity domain than instance 1 - money close on
          BenefitAccount keyed off Employee.status, not exclusion arithmetic on Election. Two accounts
          holding the byte-identical unused balance of 12000 cents split into completely different
          destination buckets: standard_close forfeits 7000 and carries 5000, while
          termination_close inside the grace period refunds all 12000 to the employer and carries 0.
        test_recipe:
          setup:
            - "Employer 'Lakeside Parking Benefits' is ACTIVE in US-IL-CHI with rollover_policy CAP_ROLLOVER, rollover_cap_cents 5000 and forfeiture_grace_days 30."
            - "One PARKING category exists with monthly_exclusion_limit_cents 30000."
            - "Two employees each hold one PARKING BenefitAccount seeded with opening_rollover_cents 12000, so each account carries exactly one ROLLOVER_IN ledger entry and available_balance_cents 12000."
            - "Employee EMP-ACT is still ACTIVE; employee EMP-TRM was terminated on 2026-08-05T00:00:00Z."
            - "ElectionWindow 2026-08 is LOCKED with zero elections, so the lock credited nothing."
            - "The logical clock stands at 2026-08-20T00:00:00Z - 15 whole days after the termination, inside the 30-day grace window."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Lakeside Parking Benefits", region_code: "US-IL-CHI", transit_group_limit_cents: 30000, parking_group_limit_cents: 30000, program_cap_cents: 5000000, rollover_policy: "CAP_ROLLOVER", rollover_cap_cents: 5000, forfeiture_grace_days: 30 }
              as: ProgramAdmin
              captures: { er_id: $.data.id }
            - call: "POST /benefits/employers/${er_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/benefit-categories"
              payload: { employer_id: "${er_id}", category_type: "PARKING", monthly_exclusion_limit_cents: 30000 }
              as: ProgramAdmin
              captures: { cat_pk_id: $.data.id }
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "EMP-ACT", work_region_code: "US-IL-CHI", payroll_cycle: "MONTHLY", hire_date: "2026-01-05T00:00:00Z" }
              as: ProgramAdmin
              captures: { emp_act_id: $.data.id }
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "EMP-TRM", work_region_code: "US-IL-CHI", payroll_cycle: "MONTHLY", hire_date: "2026-01-06T00:00:00Z" }
              as: ProgramAdmin
              captures: { emp_trm_id: $.data.id }
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "${emp_act_id}", benefit_category_id: "${cat_pk_id}", opening_rollover_cents: 12000 }
              as: ProgramAdmin
              captures: { acct_act_id: $.data.id }
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "${emp_trm_id}", benefit_category_id: "${cat_pk_id}", opening_rollover_cents: 12000 }
              as: ProgramAdmin
              captures: { acct_trm_id: $.data.id }
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_id}", benefit_month: "2026-08", opens_at: "2026-07-01T00:00:00Z", cutoff_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { win_id: $.data.id }
            - call: "POST /benefits/election-windows/${win_id}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/election-windows/${win_id}/lock"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /benefits/employees/${emp_trm_id}/terminate"
              payload: { termination_date: "2026-08-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /benefits/employers/${er_id}/month-close"
              payload: { benefit_month: "2026-08" }
              as: ProgramAdmin
          assert:
            - "BenefitAccount.${acct_act_id}.forfeited_cents == 7000"
            - "BenefitAccount.${acct_act_id}.refunded_cents == 0"
            - "BenefitAccount.${acct_act_id}.available_balance_cents == 5000"
            - "BenefitAccount.${acct_act_id}.rollover_in_cents == 12000"
            - "BenefitAccount.${acct_act_id}.ledger_entry_count == 2"
            - "GET /benefits/benefit-accounts/${acct_act_id}/ledger-entries returns exactly one entry with entry_type == FORFEITURE and amount_cents == -7000"
            - "BenefitAccount.${acct_trm_id}.refunded_cents == 12000"
            - "BenefitAccount.${acct_trm_id}.forfeited_cents == 0"
            - "BenefitAccount.${acct_trm_id}.available_balance_cents == 0"
            - "BenefitAccount.${acct_trm_id}.ledger_entry_count == 2"
            - "GET /benefits/benefit-accounts/${acct_trm_id}/ledger-entries returns exactly one entry with entry_type == REFUND and amount_cents == -12000"
            - "Employee.${emp_trm_id}.status == TERMINATED"
            - "ElectionWindow.${win_id}.status == CLOSED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: order_batch_invoice_per_line_rounding_then_sum_mode_b
        grounds:
          - calculations.order_batch_invoice_total
          - state_machines.OrderBatch.OPEN_to_SEALED
          - entities.MediaOrder.fields.line_surcharge_cents
          - entities.MediaOrder.fields.line_total_cents
          - entities.OrderBatch.fields.subtotal_cents
          - entities.OrderBatch.fields.discount_cents
          - entities.OrderBatch.fields.total_cents
          - validations[priority=74]
        distinguishing_aspect: |
          §0.5 Rule 2 MODE (b) - nested rounding where the order matters. Three identical 1007-cent
          lines in the 7.5% US-CA-SFO region round to 76 cents of surcharge PER LINE (round_half_up of
          75.525) giving subtotal 3249, whereas the forbidden sum-then-round order gives
          round_half_up(3021 * 0.075) = 227 and a total of 3248 - a one-cent divergence that only the
          pinned per-line-first order reproduces.
        test_recipe:
          setup:
            - "Employer 'Golden Gate Commute' is ACTIVE in US-CA-SFO with transit_group_limit_cents 32500 and program_cap_cents 5000000."
            - "One TRANSIT_PASS category with monthly_exclusion_limit_cents 32500 exists."
            - "One TransitMedia PAPER_PASS product 'SFO-MUNI-A' is ACTIVE for US-CA-SFO / TRANSIT_PASS at unit_price_cents 1007."
            - "Three employees each hold their own TRANSIT_PASS BenefitAccount and each has one PENDING election for pretax 2000 with media_quantity 1 against that product."
            - "ElectionWindow 2026-08 occupies [2026-07-01T00:00:00Z, 2026-08-20T00:00:00Z) and is OPEN; the clock sits at its 2026-08-01T00:00:00Z default, strictly before the cutoff."
            - "OrderBatch for that window in region US-CA-SFO is OPEN and holds exactly three PENDING MediaOrder lines of quantity 1 each."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Golden Gate Commute", region_code: "US-CA-SFO", transit_group_limit_cents: 32500, parking_group_limit_cents: 30000, program_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { er_id: $.data.id }
            - call: "POST /benefits/employers/${er_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/benefit-categories"
              payload: { employer_id: "${er_id}", category_type: "TRANSIT_PASS", monthly_exclusion_limit_cents: 32500 }
              as: ProgramAdmin
              captures: { cat_tp_id: $.data.id }
            - call: "POST /benefits/transit-media"
              payload: { sku: "SFO-MUNI-A", media_type: "PAPER_PASS", region_code: "US-CA-SFO", eligible_category_type: "TRANSIT_PASS", unit_price_cents: 1007, lead_days: 3, replacement_fee_cents: 500, requires_physical_fulfillment: true }
              as: OrderDesk
              as_user_id: "desk-catalog"
              captures: { med_id: $.data.id }
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_id}", benefit_month: "2026-08", opens_at: "2026-07-01T00:00:00Z", cutoff_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { win_id: $.data.id }
            - call: "POST /benefits/election-windows/${win_id}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "EMP-A", work_region_code: "US-CA-SFO", payroll_cycle: "MONTHLY", hire_date: "2026-01-05T00:00:00Z" }
              as: ProgramAdmin
              captures: { emp_a_id: $.data.id }
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "EMP-B", work_region_code: "US-CA-SFO", payroll_cycle: "MONTHLY", hire_date: "2026-01-06T00:00:00Z" }
              as: ProgramAdmin
              captures: { emp_b_id: $.data.id }
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "EMP-C", work_region_code: "US-CA-SFO", payroll_cycle: "MONTHLY", hire_date: "2026-01-07T00:00:00Z" }
              as: ProgramAdmin
              captures: { emp_c_id: $.data.id }
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "${emp_a_id}", benefit_category_id: "${cat_tp_id}" }
              as: ProgramAdmin
              captures: { acct_a_id: $.data.id, acct_a_v: $.data.version }
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "${emp_b_id}", benefit_category_id: "${cat_tp_id}" }
              as: ProgramAdmin
              captures: { acct_b_id: $.data.id, acct_b_v: $.data.version }
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "${emp_c_id}", benefit_category_id: "${cat_tp_id}" }
              as: ProgramAdmin
              captures: { acct_c_id: $.data.id, acct_c_v: $.data.version }
            - call: "POST /benefits/elections"
              payload: { employee_id: "${emp_a_id}", election_window_id: "${win_id}", benefit_category_id: "${cat_tp_id}", pretax_amount_cents: 2000, posttax_amount_cents: 0, transit_media_id: "${med_id}", media_quantity: 1, expected_account_version: "${acct_a_v}" }
              as: ProgramAdmin
              captures: { el_a_id: $.data.id, el_a_v: $.data.version }
            - call: "POST /benefits/elections"
              payload: { employee_id: "${emp_b_id}", election_window_id: "${win_id}", benefit_category_id: "${cat_tp_id}", pretax_amount_cents: 2000, posttax_amount_cents: 0, transit_media_id: "${med_id}", media_quantity: 1, expected_account_version: "${acct_b_v}" }
              as: ProgramAdmin
              captures: { el_b_id: $.data.id, el_b_v: $.data.version }
            - call: "POST /benefits/elections"
              payload: { employee_id: "${emp_c_id}", election_window_id: "${win_id}", benefit_category_id: "${cat_tp_id}", pretax_amount_cents: 2000, posttax_amount_cents: 0, transit_media_id: "${med_id}", media_quantity: 1, expected_account_version: "${acct_c_v}" }
              as: ProgramAdmin
              captures: { el_c_id: $.data.id, el_c_v: $.data.version }
            - call: "POST /benefits/order-batches"
              payload: { election_window_id: "${win_id}", region_code: "US-CA-SFO" }
              as: OrderDesk
              as_user_id: "desk-sealer"
              captures: { bat_id: $.data.id }
            - call: "POST /benefits/media-orders"
              payload: { election_id: "${el_a_id}", transit_media_id: "${med_id}", order_batch_id: "${bat_id}", quantity: 1, coverage_start_at: "2026-08-01T00:00:00Z", coverage_end_at: "2026-08-31T00:00:00Z", expected_election_version: "${el_a_v}" }
              as: OrderDesk
              as_user_id: "desk-sealer"
              captures: { mo_a_id: $.data.id }
            - call: "POST /benefits/media-orders"
              payload: { election_id: "${el_b_id}", transit_media_id: "${med_id}", order_batch_id: "${bat_id}", quantity: 1, coverage_start_at: "2026-08-01T00:00:00Z", coverage_end_at: "2026-08-31T00:00:00Z", expected_election_version: "${el_b_v}" }
              as: OrderDesk
              as_user_id: "desk-sealer"
              captures: { mo_b_id: $.data.id }
            - call: "POST /benefits/media-orders"
              payload: { election_id: "${el_c_id}", transit_media_id: "${med_id}", order_batch_id: "${bat_id}", quantity: 1, coverage_start_at: "2026-08-01T00:00:00Z", coverage_end_at: "2026-08-31T00:00:00Z", expected_election_version: "${el_c_v}" }
              as: OrderDesk
              as_user_id: "desk-sealer"
              captures: { mo_c_id: $.data.id }
          trigger:
            - call: "POST /benefits/order-batches/${bat_id}/seal"
              payload: {}
              as: OrderDesk
              as_user_id: "desk-sealer"
          assert:
            - "MediaOrder.${mo_a_id}.line_gross_cents == 1007"
            - "MediaOrder.${mo_a_id}.line_surcharge_cents == 76"
            - "MediaOrder.${mo_a_id}.line_total_cents == 1083"
            - "MediaOrder.${mo_b_id}.line_surcharge_cents == 76"
            - "MediaOrder.${mo_c_id}.line_surcharge_cents == 76"
            - "OrderBatch.${bat_id}.line_count == 3"
            - "OrderBatch.${bat_id}.subtotal_cents == 3249"
            - "OrderBatch.${bat_id}.discount_cents == 0"
            - "OrderBatch.${bat_id}.total_cents == 3249"
            - "OrderBatch.${bat_id}.status == SEALED"
            - "OrderBatch.${bat_id}.sealed_by_user_id == desk-sealer"
            - "total_cents is NOT 3248, which is what the forbidden sum-gross-then-round-once order would produce"

      - name: payroll_fee_waiver_tier_pinned_to_pre_waiver_charge_mode_c
        grounds:
          - calculations.payroll_file_charge_rollup
          - state_machines.PayrollFile.DRAFT_to_GENERATED
          - state_machines.ElectionWindow.OPEN_to_LOCKED
          - entities.PayrollFile.fields.pre_waiver_charge_cents
          - entities.PayrollFile.fields.fee_waiver_cents
          - entities.PayrollFile.fields.employer_charge_cents
        distinguishing_aspect: |
          §0.5 Rule 2 MODE (c) - a circular-looking dependency with a pinned evaluation order, a
          different axis from instance 1's rounding order. pre_waiver_charge_cents lands on 50500,
          exactly 500 cents above the 50000 tier-2 floor, so the 25% waiver of the 5000-cent admin fee
          is 1250 and the charge is 49250. An implementation that re-derives the tier from the final
          49250 falls back below 50000, grants no waiver, and reports 50500.
        test_recipe:
          setup:
            - "Employer 'Austin Commuter Trust' is ACTIVE in the non-ordinance region US-TX-AUS with transit_group_limit_cents 32500 and program_cap_cents 5000000."
            - "One TRANSIT_PASS category with monthly_exclusion_limit_cents 32500 exists."
            - "Two employees each hold their own TRANSIT_PASS BenefitAccount."
            - "ElectionWindow 2026-08 occupies [2026-07-01T00:00:00Z, 2026-08-20T00:00:00Z), was OPEN, collected pretax elections of 30000 and 15500 with zero post-tax, and has since been LOCKED so both elections are FUNDED with excluded_amount_cents 30000 and 15500."
            - "A DRAFT PayrollFile for period_month 2026-08 exists for that employer."
            - "The clock is at its 2026-08-01T00:00:00Z default throughout."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Austin Commuter Trust", region_code: "US-TX-AUS", transit_group_limit_cents: 32500, parking_group_limit_cents: 30000, program_cap_cents: 5000000, pretax_ratio_cap_pct: 100 }
              as: ProgramAdmin
              captures: { er_id: $.data.id }
            - call: "POST /benefits/employers/${er_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/benefit-categories"
              payload: { employer_id: "${er_id}", category_type: "TRANSIT_PASS", monthly_exclusion_limit_cents: 32500 }
              as: ProgramAdmin
              captures: { cat_tp_id: $.data.id }
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "PR-1", work_region_code: "US-TX-AUS", payroll_cycle: "MONTHLY", hire_date: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { emp_1_id: $.data.id }
            - call: "POST /benefits/employees"
