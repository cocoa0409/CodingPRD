              as: CatalogAdmin
            - *a_entry_add
            - call: "POST /catalog/catalog-entries/${entry_id}/publish"
              payload: {}
              as: CatalogAdmin
            - call: "POST /catalog/subscribers"
              payload: { email: "imp@example.com", display_name: "Impact", home_region_code: "NA", wallet_credit_cents: 0 }
              as: Anonymous
              captures: { subr_imp_id: $.data.id }
            - call: "POST /catalog/subscriptions"
