  - rule_id: boundary_precision_check
    instances:
      - name: group_revenue_exactly_at_small_producer_threshold
        grounds:
          - calculations.exemption_determination
          - calculations.exemption_determination.variants.GROUP_LEVEL
          - validations.priority_17_ERR_EXEMPT_REGISTRATION_CANNOT_REPORT
        distinguishing_aspect: |
          The metric is assessed_group_revenue_usd against small_producer_revenue_threshold_usd on
          POST /epr/registrations/{id}/submit: a group summing to exactly 5000000 is OBLIGATED
          because the comparison is strict `<`, while 4999999 on the same group is
          EXEMPT_SMALL_PRODUCER.
        test_recipe:
          setup:
            - "Two GROUP_LEVEL programs, CA and OR, both with small_producer_revenue_threshold_usd 5000000 and small_producer_tonnage_threshold_kg 1000."
            - "Parent producer PP (revenue 3000000, brand owner) with one ACTIVE GLASS SKU of 50 g and 110 units estimate, so annual_packaging_weight_kg is 5.500."
            - "Child producer PQ (parent_producer_id = PP, revenue 2000000, brand owner) with one ACTIVE GLASS SKU of 50 g and 100 units estimate, so annual_packaging_weight_kg is 5.000."
            - "The group revenue sum is therefore exactly 5000000 and the group weight sum is 10.500 kg, well under the tonnage threshold, so revenue alone decides the outcome."
            - "PP has one DRAFT registration in CA and one DRAFT registration in OR; both producers have been determined."
          setup_api_calls:
            - call: "POST /epr/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramRegulator
              as_user_id: "reg-1"
            - call: "POST /epr/state-programs"
              payload: { state_code: "CA", obligation_basis: "GROUP_LEVEL", eco_mod_policy: "BONUS_MALUS", fee_rounding_order: "PER_LINE_THEN_SUM", small_producer_revenue_threshold_usd: 5000000, small_producer_tonnage_threshold_kg: 1000, exempt_product_categories: ["MEDICAL_DEVICE"], verification_required_threshold_kg: 3000, registration_deadline: "2026-12-31T23:59:59Z" }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { sp_ca_id: $.data.id }
            - call: "POST /epr/state-programs"
              payload: { state_code: "OR", obligation_basis: "GROUP_LEVEL", eco_mod_policy: "DISCOUNT_ONLY", fee_rounding_order: "SUM_THEN_ROUND", small_producer_revenue_threshold_usd: 5000000, small_producer_tonnage_threshold_kg: 1000, exempt_product_categories: [], verification_required_threshold_kg: 3000, registration_deadline: "2026-12-31T23:59:59Z" }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { sp_or_id: $.data.id }
            - call: "POST /epr/producers"
              payload: { legal_name: "Boundary Parent Co", parent_producer_id: null, brand_owner_flag: true, importer_of_record_flag: false, domestic_licensor_flag: false, annual_gross_revenue_usd: 3000000, contact_email: "pp@x.com" }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { pp_id: $.data.id }
            - call: "POST /epr/producers"
              payload: { legal_name: "Boundary Child Co", parent_producer_id: "${pp_id}", brand_owner_flag: true, importer_of_record_flag: false, domestic_licensor_flag: false, annual_gross_revenue_usd: 2000000, contact_email: "pq@x.com" }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { pq_id: $.data.id }
            - call: "POST /epr/skus"
              payload: { producer_id: "${pp_id}", gtin: "P001", name: "Parent Jar", product_category: "HOUSEHOLD_CHEM", units_sold_annual_estimate: 110 }
              as: ProducerComplianceOfficer
              as_user_id: "${pp_id}"
              captures: { sku_pp_id: $.data.id }
            - call: "POST /epr/skus/${sku_pp_id}/components"
              payload: { material_type: "GLASS", unit_weight_grams: 50, recyclability_class: "READILY_RECYCLABLE", pcr_content_pct: 0, is_reusable: false }
              as: ProducerComplianceOfficer
              as_user_id: "${pp_id}"
            - call: "POST /epr/skus/${sku_pp_id}/activate"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${pp_id}"
            - call: "POST /epr/producers/${pp_id}/determine-obligation"
              payload: {}
              as: ProgramRegulator
              as_user_id: "reg-1"
            - call: "POST /epr/skus"
              payload: { producer_id: "${pq_id}", gtin: "Q001", name: "Child Jar", product_category: "HOUSEHOLD_CHEM", units_sold_annual_estimate: 100 }
              as: ProducerComplianceOfficer
              as_user_id: "${pq_id}"
              captures: { sku_pq_id: $.data.id }
            - call: "POST /epr/skus/${sku_pq_id}/components"
              payload: { material_type: "GLASS", unit_weight_grams: 50, recyclability_class: "READILY_RECYCLABLE", pcr_content_pct: 0, is_reusable: false }
              as: ProducerComplianceOfficer
              as_user_id: "${pq_id}"
            - call: "POST /epr/skus/${sku_pq_id}/activate"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${pq_id}"
            - call: "POST /epr/producers/${pq_id}/determine-obligation"
              payload: {}
              as: ProgramRegulator
              as_user_id: "reg-1"
            - call: "POST /epr/registrations"
              payload: { producer_id: "${pp_id}", state_program_id: "${sp_ca_id}" }
              as: ProducerComplianceOfficer
              as_user_id: "${pp_id}"
              captures: { reg_ca_id: $.data.id }
            - call: "POST /epr/registrations"
              payload: { producer_id: "${pp_id}", state_program_id: "${sp_or_id}" }
              as: ProducerComplianceOfficer
              as_user_id: "${pp_id}"
              captures: { reg_or_id: $.data.id }
          trigger:
            - call: "POST /epr/registrations/${reg_ca_id}/submit"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${pp_id}"
