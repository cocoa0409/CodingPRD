scaffold_corner_design:
  - section: entities
    instances:
      - name: journal_creation_returns_declared_config_defaults
        claim_type: creation
        grounds:
          - entities.Journal
          - entities.Journal.fields.min_completed_reviews_for_decision
          - entities.Journal.fields.apc_base_cents
          - entities.Journal.fields.manuscript_intake_count
          - endpoints.POST /journals
        distinguishing_aspect: |
          A journal created with only name and subject_areas comes back with every one of the
          seventeen declared config defaults materialised (min_completed_reviews_for_decision 2,
          max_revision_rounds 2, review_target_days 21, apc_base_cents 180000, embargo_months 12,
          typeset_changeover_buffer_days 2, max_proof_rounds 2, consensus_mode UNWEIGHTED) and all
          five derived counters at 0, at version 1.
        test_recipe:
          setup:
            - "Empty database; the logical clock is parked at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /journals"
              payload: { name: "Journal of Default Config", subject_areas: ["ONCOLOGY"] }
              as: SystemAdmin
              captures: { j_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Journal.${j_id}.doi_prefix == 10.5555"
            - "Journal.${j_id}.min_completed_reviews_for_decision == 2"
            - "Journal.${j_id}.max_revision_rounds == 2"
            - "Journal.${j_id}.review_target_days == 21"
            - "Journal.${j_id}.reminder_cadence_days == 7"
            - "Journal.${j_id}.max_reminders_per_invitation == 2"
            - "Journal.${j_id}.reviewer_concurrent_window_limit == 3"
            - "Journal.${j_id}.consensus_mode == UNWEIGHTED"
            - "Journal.${j_id}.max_page_count == 30"
            - "Journal.${j_id}.max_figure_count == 10"
            - "Journal.${j_id}.requires_data_availability_statement == true"
            - "Journal.${j_id}.apc_base_cents == 180000"
            - "Journal.${j_id}.page_charge_cents_per_page == 4000"
            - "Journal.${j_id}.color_figure_charge_cents == 25000"
            - "Journal.${j_id}.embargo_months == 12"
            - "Journal.${j_id}.typeset_changeover_buffer_days == 2"
            - "Journal.${j_id}.max_proof_rounds == 2"
            - "Journal.${j_id}.manuscript_intake_count == 0"
            - "Journal.${j_id}.published_article_count == 0"
            - "Journal.${j_id}.retracted_article_count == 0"
            - "Journal.${j_id}.apc_receivable_cents == 0"
            - "Journal.${j_id}.apc_waived_cents == 0"
            - "Journal.${j_id}.version == 1"
            - "meta.api_request_id and meta.api_request_timestamp are present and response_type == object"

      - name: manuscript_retrieval_returns_stored_submission_fields
        claim_type: retrieval
        grounds:
          - entities.Manuscript
          - entities.Manuscript.fields.journal_sequence_number
          - entities.Manuscript.fields.formatting_status
          - endpoints.GET /manuscripts/{id}
        distinguishing_aspect: |
          GET /manuscripts/{id} returns exactly what the submission stored: title, subject_area,
          oa_license CC_BY, page_count 20, figure_count 5, status SUBMITTED, revision_round 0,
          integrity_status PENDING, formatting_status COMPLIANT and journal_sequence_number 1.
        test_recipe:
          setup:
            - "One journal at default config, one author, one manuscript submitted by that author with page_count 20 and figure_count 5."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /journals"
              payload: { name: "Journal of Retrieval Studies", subject_areas: ["ONCOLOGY"] }
              as: SystemAdmin
              captures: { j_id: $.data.id }
            - call: "POST /authors"
              payload: { email: "author1@x.org", full_name: "Author One", affiliation: "Univ Gamma" }
              as: SystemAdmin
              captures: { au_id: $.data.id }
            - call: "POST /manuscripts"
              payload: { journal_id: "${j_id}", corresponding_author_id: "${au_id}", title: "Retrieval Marker Study", subject_area: "ONCOLOGY", oa_license: "CC_BY", page_count: 20, figure_count: 5, data_availability_statement: "Data at repository DOI 10.9999/r1" }
              as: Author
              as_user_id: "${au_id}"
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /manuscripts/${m_id}"
              as: Author
              as_user_id: "${au_id}"
          assert:
            - "HTTP 200"
            - "Manuscript.${m_id}.journal_id == ${j_id}"
            - "Manuscript.${m_id}.corresponding_author_id == ${au_id}"
            - "Manuscript.${m_id}.title == Retrieval Marker Study"
            - "Manuscript.${m_id}.subject_area == ONCOLOGY"
            - "Manuscript.${m_id}.oa_license == CC_BY"
            - "Manuscript.${m_id}.page_count == 20"
            - "Manuscript.${m_id}.figure_count == 5"
            - "Manuscript.${m_id}.status == SUBMITTED"
            - "Manuscript.${m_id}.revision_round == 0"
            - "Manuscript.${m_id}.integrity_status == PENDING"
            - "Manuscript.${m_id}.formatting_status == COMPLIANT"
            - "Manuscript.${m_id}.journal_sequence_number == 1"
            - "Manuscript.${m_id}.submitted_review_count == 0"
            - "Manuscript.${m_id}.doi == null"
            - "Manuscript.${m_id}.version == 1"
            - "Journal.${j_id}.manuscript_intake_count == 1"

      - name: manuscripts_list_filtered_by_journal_and_status_paginates
        claim_type: listing
        grounds:
          - endpoints.GET /manuscripts
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three SUBMITTED manuscripts in one journal, GET /manuscripts?journal_id&status=SUBMITTED&limit=2&offset=0
          returns 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining
          1 row with has_more false; the filter is applied before the page window.
        test_recipe:
          setup:
            - "One journal at default config, one author, three manuscripts all in status SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /journals"
              payload: { name: "Journal of Listing Studies", subject_areas: ["ONCOLOGY"] }
              as: SystemAdmin
              captures: { j_id: $.data.id }
            - call: "POST /authors"
              payload: { email: "author1@x.org", full_name: "Author One", affiliation: "Univ Gamma" }
              as: SystemAdmin
              captures: { au_id: $.data.id }
            - call: "POST /manuscripts"
              payload: { journal_id: "${j_id}", corresponding_author_id: "${au_id}", title: "Listing Paper One", subject_area: "ONCOLOGY", oa_license: "CC_BY", page_count: 10, figure_count: 1, data_availability_statement: "Data at repository DOI 10.9999/l1" }
              as: Author
              as_user_id: "${au_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /manuscripts"
              payload: { journal_id: "${j_id}", corresponding_author_id: "${au_id}", title: "Listing Paper Two", subject_area: "ONCOLOGY", oa_license: "CC_BY", page_count: 11, figure_count: 1, data_availability_statement: "Data at repository DOI 10.9999/l2" }
              as: Author
              as_user_id: "${au_id}"
              captures: { m2_id: $.data.id }
            - call: "POST /manuscripts"
              payload: { journal_id: "${j_id}", corresponding_author_id: "${au_id}", title: "Listing Paper Three", subject_area: "ONCOLOGY", oa_license: "CC_BY", page_count: 12, figure_count: 1, data_availability_statement: "Data at repository DOI 10.9999/l3" }
              as: Author
              as_user_id: "${au_id}"
              captures: { m3_id: $.data.id }
          trigger:
            - call: "GET /manuscripts?journal_id=${j_id}&status=SUBMITTED&limit=2&offset=0"
              as: SystemAdmin
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /manuscripts?journal_id=${j_id}&status=SUBMITTED&limit=2&offset=2"
              as: SystemAdmin
              captures: { page2_first: "$.data[0].id" }
          assert:
            - "HTTP 200 on both reads and response_type == array"
            - "first read: total_count == 3, limit == 2, offset == 0, has_more == true, data length == 2"
            - "second read: total_count == 3, limit == 2, offset == 2, has_more == false, data length == 1"
            - "the three returned ids across both pages are exactly {${m1_id}, ${m2_id}, ${m3_id}} with no repeats"

      - name: manuscript_not_found_for_unknown_id
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_MANUSCRIPT_NOT_FOUND]
          - endpoints.GET /manuscripts/{id}
        distinguishing_aspect: |
          A GET against a syntactically valid but non-existent manuscript id returns 404 with
          error_id ERR_MANUSCRIPT_NOT_FOUND, never an empty 200 body.
        test_recipe:
          setup:
            - "Empty database except the clock; no Manuscript row exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "GET /manuscripts/11111111-1111-4111-8111-111111111111"
              as: SystemAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404"
            - "response_type == error"
            - "data.error_id == ERR_MANUSCRIPT_NOT_FOUND"
            - "data.message is a non-empty string"

      - name: manuscript_create_missing_required_page_count_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=7]
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST /manuscripts
        distinguishing_aspect: |
          POST /manuscripts without the required page_count field returns 400
          ERR_INVALID_REQUEST and creates no Manuscript row, leaving
          journal.manuscript_intake_count at 0.
        test_recipe:
          setup:
            - "One journal at default config and one author; no manuscript submitted yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /journals"
              payload: { name: "Journal of Required Fields", subject_areas: ["ONCOLOGY"] }
              as: SystemAdmin
              captures: { j_id: $.data.id }
            - call: "POST /authors"
              payload: { email: "author1@x.org", full_name: "Author One", affiliation: "Univ Gamma" }
              as: SystemAdmin
              captures: { au_id: $.data.id }
          trigger:
            - call: "POST /manuscripts"
              payload: { journal_id: "${j_id}", corresponding_author_id: "${au_id}", title: "No Page Count Paper", subject_area: "ONCOLOGY", oa_license: "CC_BY", figure_count: 2 }
              as: Author
              as_user_id: "${au_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "Journal.${j_id}.manuscript_intake_count == 0"
            - "GET /manuscripts?journal_id=${j_id} returns total_count == 0"

      - name: author_defaults_income_band_high_and_no_institutional_agreement
        claim_type: defaults
        grounds:
          - entities.Author.fields.country_income_band
          - entities.Author.fields.institutional_agreement
          - endpoints.POST /authors
        distinguishing_aspect: |
          An author created without country_income_band or institutional_agreement defaults to
          HIGH / false, which is the zero-waiver, zero-institutional-discount branch of
          apc_net_amount.
        test_recipe:
          setup:
            - "Empty database except the clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /authors"
              payload: { email: "default_author@x.org", full_name: "Default Author", affiliation: "Univ Gamma" }
              as: SystemAdmin
              captures: { au_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Author.${au_id}.country_income_band == HIGH"
            - "Author.${au_id}.institutional_agreement == false"
            - "Author.${au_id}.version == 1"

      - name: manuscript_computed_status_doi_and_sequence_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Manuscript.fields.status
          - entities.Manuscript.fields.doi
          - entities.Manuscript.fields.journal_sequence_number
          - endpoints.POST /manuscripts
        distinguishing_aspect: |
          Client-supplied status, doi and journal_sequence_number values are not part of
          POST /manuscripts' declared input and are ignored: the row is created SUBMITTED with
          doi null and journal_sequence_number derived as journal.manuscript_intake_count + 1 == 1.
        test_recipe:
          setup:
            - "One journal at default config and one author."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /journals"
              payload: { name: "Journal of Computed Fields", subject_areas: ["ONCOLOGY"] }
              as: SystemAdmin
              captures: { j_id: $.data.id }
            - call: "POST /authors"
              payload: { email: "author1@x.org", full_name: "Author One", affiliation: "Univ Gamma" }
              as: SystemAdmin
              captures: { au_id: $.data.id }
          trigger:
            - call: "POST /manuscripts"
              payload: { journal_id: "${j_id}", corresponding_author_id: "${au_id}", title: "Computed Fields Paper", subject_area: "ONCOLOGY", oa_license: "CC_BY", page_count: 12, figure_count: 2, data_availability_statement: "Data at repository DOI 10.9999/cf", status: "PUBLISHED", doi: "10.9999/forged", journal_sequence_number: 77 }
              as: Author
              as_user_id: "${au_id}"
              captures: { m_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Manuscript.${m_id}.status == SUBMITTED"
            - "Manuscript.${m_id}.doi == null"
            - "Manuscript.${m_id}.journal_sequence_number == 1"
            - "Manuscript.${m_id}.publication_date == null"
            - "Journal.${j_id}.published_article_count == 0"

      - name: editor_system_id_timestamps_and_version_generated_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Editor
          - endpoints.POST /editors
        distinguishing_aspect: |
          id, created_at, updated_at and version are system-generated on POST /editors: a
          client-supplied id and version are ignored and the stored row carries version 1 with
          active_assignment_count 0.
        test_recipe:
          setup:
            - "One journal at default config."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /journals"
              payload: { name: "Journal of System Fields", subject_areas: ["ONCOLOGY"] }
              as: SystemAdmin
              captures: { j_id: $.data.id }
          trigger:
            - call: "POST /editors"
              payload: { journal_id: "${j_id}", email: "he1@soc.org", full_name: "Handling One", affiliation: "Univ Beta", subject_areas: ["ONCOLOGY"], role_level: "HANDLING", id: "22222222-2222-4222-8222-222222222222", version: 9 }
              as: SystemAdmin
              captures: { ed_id: $.data.id }
          assert:
            - "HTTP 201"
            - "${ed_id} != 22222222-2222-4222-8222-222222222222"
            - "Editor.${ed_id}.version == 1"
            - "Editor.${ed_id}.created_at == 2026-08-01T00:00:00Z"
            - "Editor.${ed_id}.updated_at == 2026-08-01T00:00:00Z"
            - "Editor.${ed_id}.status == ACTIVE"
            - "Editor.${ed_id}.max_concurrent_assignments == 3"
            - "Editor.${ed_id}.active_assignment_count == 0"

      - name: integrity_screening_immutable_row_has_no_version_or_update_route
        claim_type: immutability
        grounds:
          - entities.IntegrityScreening
          - endpoints.POST /manuscripts/{id}/integrity-screenings
          - endpoints.GET /manuscripts/{id}/integrity-screenings
        distinguishing_aspect: |
          IntegrityScreening is declared common_fields false: the created row exposes no version
          field and no update or delete route exists in §1.5, so a second PLAGIARISM screening of
          the same round is rejected as a duplicate key instead of overwriting the first.
        test_recipe:
          setup:
            - "One journal at default config, one author, one manuscript, one PLAGIARISM screening with similarity_pct 5.0 in round 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /journals"
              payload: { name: "Journal of Immutable Screenings", subject_areas: ["ONCOLOGY"] }
              as: SystemAdmin
              captures: { j_id: $.data.id }
            - call: "POST /authors"
              payload: { email: "author1@x.org", full_name: "Author One", affiliation: "Univ Gamma" }
              as: SystemAdmin
              captures: { au_id: $.data.id }
            - call: "POST /manuscripts"
              payload: { journal_id: "${j_id}", corresponding_author_id: "${au_id}", title: "Immutable Screening Paper", subject_area: "ONCOLOGY", oa_license: "CC_BY", page_count: 14, figure_count: 3, data_availability_statement: "Data at repository DOI 10.9999/is" }
              as: Author
              as_user_id: "${au_id}"
              captures: { m_id: $.data.id }
            - call: "POST /manuscripts/${m_id}/integrity-screenings"
              payload: { scan_type: "PLAGIARISM", similarity_pct: 5.0 }
              as: SystemAdmin
          trigger:
            - call: "POST /manuscripts/${m_id}/integrity-screenings"
              payload: { scan_type: "PLAGIARISM", similarity_pct: 35.0 }
              as: SystemAdmin
              captures: { err_id: $.data.error_id }
            - call: "GET /manuscripts/${m_id}/integrity-screenings?round=0"
              as: SystemAdmin
              captures: { keep_verdict: "$.data[0].verdict" }
          assert:
            - "second screening returns HTTP 409 with data.error_id == ERR_DUPLICATE_KEY"
            - "GET /manuscripts/${m_id}/integrity-screenings?round=0 returns total_count == 1"
            - "the surviving screening still has similarity_pct == 5.0 and verdict == PASS"
            - "the screening row exposes no version field (IntegrityScreening is common_fields false)"
            - "Manuscript.${m_id}.integrity_status == PASS"

      - name: manuscript_create_unknown_journal_id_returns_journal_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_JOURNAL_NOT_FOUND]
          - entities.Manuscript.fields.journal_id
          - endpoints.POST /manuscripts
        distinguishing_aspect: |
          A body foreign key that names no existing row is rejected at priority 5 with 404
          ERR_JOURNAL_NOT_FOUND, so the flat topology's cross-reference integrity is enforced on
          write rather than deferred.
        test_recipe:
          setup:
            - "One author exists; no journal with the id used in the trigger exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /authors"
              payload: { email: "author1@x.org", full_name: "Author One", affiliation: "Univ Gamma" }
              as: SystemAdmin
              captures: { au_id: $.data.id }
          trigger:
            - call: "POST /manuscripts"
              payload: { journal_id: "33333333-3333-4333-8333-333333333333", corresponding_author_id: "${au_id}", title: "Dangling Journal Paper", subject_area: "ONCOLOGY", oa_license: "CC_BY", page_count: 10, figure_count: 1, data_availability_statement: "Data at repository DOI 10.9999/dj" }
              as: Author
              as_user_id: "${au_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404"
            - "data.error_id == ERR_JOURNAL_NOT_FOUND"
            - "GET /manuscripts returns total_count == 0"

      - name: manuscript_create_invalid_oa_license_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Manuscript.fields.oa_license
          - validations[priority=7]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          oa_license accepts only CC_BY, CC_BY_NC, CC_BY_NC_ND or GREEN_SELF_ARCHIVE; the
          undeclared member CC_BY_SA returns 400 ERR_INVALID_REQUEST and no Manuscript row.
        test_recipe:
          setup:
            - "One journal at default config and one author."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /journals"
              payload: { name: "Journal of Enum Constraints", subject_areas: ["ONCOLOGY"] }
              as: SystemAdmin
              captures: { j_id: $.data.id }
            - call: "POST /authors"
              payload: { email: "author1@x.org", full_name: "Author One", affiliation: "Univ Gamma" }
              as: SystemAdmin
              captures: { au_id: $.data.id }
          trigger:
            - call: "POST /manuscripts"
              payload: { journal_id: "${j_id}", corresponding_author_id: "${au_id}", title: "Bad Licence Paper", subject_area: "ONCOLOGY", oa_license: "CC_BY_SA", page_count: 10, figure_count: 1, data_availability_statement: "Data at repository DOI 10.9999/bl" }
              as: Author
              as_user_id: "${au_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "Journal.${j_id}.manuscript_intake_count == 0"

      - name: editor_create_unknown_journal_id_cross_reference_integrity
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - entities.Editor.fields.journal_id
          - errors[ERR_JOURNAL_NOT_FOUND]
          - endpoints.POST /editors
        distinguishing_aspect: |
          In the flat topology every entity carries its parent as a validated foreign key rather
          than a nested route: POST /editors with an unknown journal_id returns 404
          ERR_JOURNAL_NOT_FOUND and creates no Editor row.
        test_recipe:
          setup:
            - "Empty database except the clock; no journal exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /editors"
              payload: { journal_id: "44444444-4444-4444-8444-444444444444", email: "ghost@soc.org", full_name: "Ghost Editor", affiliation: "Univ Beta", subject_areas: ["ONCOLOGY"], role_level: "HANDLING" }
              as: SystemAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404"
            - "data.error_id == ERR_JOURNAL_NOT_FOUND"
            - "GET /editors returns total_count == 0"
  - section: state_machines
    instances:
      - name: desk_reject_releases_active_assignment_and_locks_manuscript
        claim_type: valid_transition
        grounds:
          - state_machines.Manuscript.SUBMITTED_to_DESK_REJECTED
          - state_machines.EditorAssignment.ACTIVE_to_RELEASED
          - entities.Editor.fields.active_assignment_count
          - endpoints.POST /manuscripts/{id}/screening-decision
        distinguishing_aspect: |
          action=DESK_REJECT on a SUBMITTED manuscript held by the acting handling editor moves the
          manuscript to DESK_REJECTED and fires both declared side effects: the ACTIVE assignment
          becomes RELEASED with released_reason DECISION_FINAL and that editor's
          active_assignment_count falls from 1 to 0.
        test_recipe:
          setup:
            - "One journal at default config, one CHIEF editor, one HANDLING editor, one author."
            - "One manuscript screened clean (PLAGIARISM 5.0 -> PASS) with the handling editor's assignment ACTIVE after a no-conflict declaration."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /journals"
