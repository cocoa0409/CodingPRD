            - "Touching windows do not intersect: the [12:00, 14:00) request returns HTTP 200 because the HALF-OPEN convention excludes the shared instant 12:00; ${in_manifested_b} == 81 (round_half_up(88 * 9150 / 10000) == round_half_up(80.52)) and ${in_variance_b} == -7"
            - "EntryFacility.${in_facility_id}.committed_tray_count == 2 once both batches are manifested, proving the aggregate is a running sum over MANIFESTED batches"
            - "Bubble-up: CompositionJob.${in_job_id}.status == MANIFESTED because every batch of the job reached MANIFESTED"
            - "Escrow settles per batch: Client.${in_client_id}.postage_committed_cents == 138 (150 - 62 + 57 - 88 + 81) and postage_escrow_available_cents == 99862"

  - rule_id: compensating_invariant
    instances:

      - name: postage_escrow_conserved_across_seal_and_unseal
        grounds:
          - state_machines.PresortBatch.OPEN_to_SEALED
          - state_machines.PresortBatch.SEALED_to_OPEN
          - entities.Client.fields.postage_deposited_cents
          - entities.Client.fields.postage_committed_cents
          - entities.Client.fields.postage_escrow_available_cents
        distinguishing_aspect: |
          The conserved quantity is MONEY: postage_deposited_cents must always equal
          postage_committed_cents + postage_escrow_available_cents, and unseal is the exact inverse of
          seal — it must also erase the derived estimated_postage_cents and sealed_by_user_id, so a
          re-seal recomputes the estimate from scratch and lands on the identical ledger reading with
          no drift after a full seal / unseal / seal cycle.
        test_recipe:
          setup:
            - "Client CL-EC with dr_readiness_required false and a single 100000-cent postage deposit; postage_deposited_cents 100000, committed 0, available 100000."
            - "ACTIVE template T-EC: FIRST_CLASS, sheets_per_document 1, no inserts; two hygienic records in postal_code 30301 -> one FIRST_CLASS THREE_DIGIT batch of 2 pieces, estimated postage 112 cents."
            - "The job is driven to VERIFIED (schedule, start, six accepted scans, complete, reconcile-integrity) so the batch is sealable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-EC", name: "Escrow Conservation Trust", dr_readiness_required: false }
              as: BureauAdmin
              captures: { ec_client_id: "$.data.id" }
            - call: "POST /bureau/clients/${ec_client_id}/postage-deposits"
              payload: { amount_cents: 100000, reference: "WIRE-EC-01" }
              as: PostageController
              captures: { ec_client_v1: "$.data.version", ec_deposited: "$.data.postage_deposited_cents" }
            - call: "POST /bureau/composition-templates"
              payload: { client_id: "${ec_client_id}", template_code: "T-EC", version_no: 1, duplex_required: false, sheets_per_document: 1, color_pages_per_document: 0, mail_class_preference: "FIRST_CLASS", required_insert_codes: [], variable_content_rules: [] }
              as: BureauAdmin
              captures: { ec_template_id: "$.data.id" }
            - call: "POST /bureau/composition-templates/${ec_template_id}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/data-files"
              payload: { client_id: "${ec_client_id}", file_name: "ec-cycle-01.csv", format_spec_code: "DELIMITED", declared_record_count: 2, declared_control_total_cents: 34000 }
              as: ClientLiaison
              captures: { ec_file_id: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${ec_file_id}", account_ref: "ACC2201", sequence_no: 1, statement_amount_cents: 17000, address_line1: "200 Escrow Avenue", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "3301" }
              as: ClientLiaison
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${ec_file_id}", account_ref: "ACC2202", sequence_no: 2, statement_amount_cents: 17000, address_line1: "202 Escrow Avenue", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "3302" }
              as: ClientLiaison
            - call: "POST /bureau/data-files/${ec_file_id}/validate-format"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/data-files/${ec_file_id}/control-check"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/press-lines"
              payload: { line_code: "PL-EC", capabilities: ["DUPLEX", "COLOR", "INSERT"], sheets_per_hour: 600, daily_sheet_capacity: 9000, changeover_buffer_minutes: 30 }
              as: BureauAdmin
              captures: { ec_line_id: "$.data.id" }
            - call: "POST /bureau/composition-jobs"
              payload: { data_file_id: "${ec_file_id}", template_id: "${ec_template_id}", rush_requested: false }
              as: CompositionOperator
