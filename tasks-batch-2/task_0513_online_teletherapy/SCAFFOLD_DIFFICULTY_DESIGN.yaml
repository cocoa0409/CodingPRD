  - rule_id: resource_temporal_overlap
    instances:
      - name: same_match_overlap_closed_adjacency_allowed
        grounds:
          - validations[priority=12]
          - entities.LiveSession.fields.starts_at
          - state_machines.LiveSession.SCHEDULED_to_COMPLETED
        distinguishing_aspect: "Match-scoped interval semantics with CLOSED adjacency: a second session on the same match starting exactly when the first ends (10:00 end, 10:00 start) is allowed (no overlap), but a session overlapping [09:30,10:30) is rejected with ERR_SESSION_OVERLAP."
        test_recipe:
          setup:
            - "Client in CA with an ACTIVE match and two granted credits; one SCHEDULED session 09:00-10:00 on 2026-06-02 exists."
          setup_api_calls:
