  # ===========================================================================
  - section: calculations
    instances:

      - name: cdr_three_consecutive_years_boundary
        claim_type: Constants Applied
        grounds:
          - calculations.cohort_default_rate_assessment
          - entities.ReviewCycle.fields.federal_compliance_status
        distinguishing_aspect: "The three-year rule uses >= on 30.0: [30.0, 30.0, 30.0] is DEFICIENT (boundary counts), while re-recording [30.0, 30.0, 29.9] flips the same cycle back to COMPLIANT — one tenth of a percent at the boundary decides."
        test_recipe:
          setup:
            - "CANDIDATE institution; initial cycle in MATERIALS_OPEN; federal components all PASS."
          setup_api_calls:
            - *k_clock
            - *k_inst
            - *k_elig_new
            - *k_elig_file
            - *k_elig_ok
            - *k_cyc_new
            - *k_cyc_adv1
          trigger:
            - call: "POST /accreditation/review-cycles/${cyc_id}/record-federal-compliance"
              payload:
                federal_components:
                  - { component_code: "CREDIT_HOUR_POLICY", result: "PASS" }
                  - { component_code: "STATE_AUTHORIZATION", result: "PASS" }
                cohort_default_rates: [30.0, 30.0, 30.0]
              as: CommissionStaff
              captures: { fed_a: $.data.federal_compliance_status }
            - call: "POST /accreditation/review-cycles/${cyc_id}/record-federal-compliance"
              payload:
                federal_components:
                  - { component_code: "CREDIT_HOUR_POLICY", result: "PASS" }
                  - { component_code: "STATE_AUTHORIZATION", result: "PASS" }
                cohort_default_rates: [30.0, 30.0, 29.9]
              as: CommissionStaff
              captures: { fed_b: $.data.federal_compliance_status }
          assert:
            - "fed_a == DEFICIENT (all three years >= CDR_CONSECUTIVE_YEAR_PCT 30.0)"
            - "fed_b == COMPLIANT after re-record with the third year at 29.9"

      - name: cdr_single_year_immediate_rule
        claim_type: Boundary / Edge
        grounds:
          - calculations.cohort_default_rate_assessment
          - errors[ERR_FEDERAL_COMPLIANCE_DEFICIENT]
        distinguishing_aspect: "The single-year rule uses >= on 40.0 independent of history: a lone 40.0 rate is DEFICIENT even with other years at 12.0, while 39.9 is COMPLIANT."
        test_recipe:
          setup:
            - "CANDIDATE institution; initial cycle in MATERIALS_OPEN."
          setup_api_calls:
            - *k_clock
            - *k_inst
            - *k_elig_new
            - *k_elig_file
            - *k_elig_ok
            - *k_cyc_new
            - *k_cyc_adv1
          trigger:
            - call: "POST /accreditation/review-cycles/${cyc_id}/record-federal-compliance"
              payload:
                federal_components:
                  - { component_code: "CREDIT_HOUR_POLICY", result: "PASS" }
                cohort_default_rates: [12.0, 39.9]
              as: CommissionStaff
              captures: { fed_low: $.data.federal_compliance_status }
            - call: "POST /accreditation/review-cycles/${cyc_id}/record-federal-compliance"
              payload:
                federal_components:
                  - { component_code: "CREDIT_HOUR_POLICY", result: "PASS" }
                cohort_default_rates: [12.0, 40.0]
              as: CommissionStaff
              captures: { fed_high: $.data.federal_compliance_status }
          assert:
            - "fed_low == COMPLIANT (39.9 < 40.0 and fewer than 3 rates at the 30.0 rule)"
            - "fed_high == DEFICIENT (single year >= CDR_SINGLE_YEAR_PCT 40.0 triggers immediately)"

      - name: emi_exactly_at_flag_boundary_not_flagged
        claim_type: Boundary / Edge
