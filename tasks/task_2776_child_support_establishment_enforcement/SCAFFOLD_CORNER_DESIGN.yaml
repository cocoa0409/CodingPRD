          setup:
            - "Empty database. Clock pinned to 2026-08-01T00:00:00Z."
            - "Two independent DIRECT_APPLICATION cases, each CP 200000 and NCP 300000 VERIFIED_WAGE_RECORD with supports_second_family false, each with an ENTERED order at monthly_obligation_cents 75000. The aggregate rule is per obligor, so the two collections never interact."
            - "Case A: three CURRENT_SUPPORT charges of 75000 (periods 08/09/10, due the 15th of each), so arrears_principal_cents is exactly 225000 == ARREARS_BUMP_MONTHS * 75000."
            - "Case B: two CURRENT_SUPPORT charges of 75000 plus one ARREARS_JUDGMENT of 74999, so arrears_principal_cents is 224999, one cent short."
            - "One MN employer, remittance_fee_cents 0, holds both IWOs; EMPLOYER_STATE_CAPS[MN] is null so ccpa_cap_pct equals federal_cap_pct in both cases."
            - "requested_amount_cents is 75000 + 0 + round_half_up(75000 * 0.20) == 90000 for both, because arrears_recovery_cents keys off the monthly obligation and not off the arrears."
            - "floor(140000 * 0.65) == 91000 > 90000 (cap does not bind) while floor(140000 * 0.60) == 84000 < 90000 (cap binds)."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
