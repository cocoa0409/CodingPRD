              payload: { program_id: "${py}", name: "White", rank: 1, required_badge_count: 0 }
              as: CenterAdmin
              captures: { by: $.data.id }
            - call: "POST /guardians"
              payload: { full_name: "G1", email: "g1@x.com" }
              as: CenterAdmin
              captures: { g1: $.data.id }
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${px}", full_name: "M1", birth_date: "2014-01-01" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { m1: $.data.id }
            - call: "POST /sessions"
              payload: { center_id: "${c1}", program_id: "${py}", format: "AFTER_SCHOOL", week_count: 1, starts_at: "2026-05-01T16:00:00Z", ends_at: "2026-05-01T18:00:00Z", device_seats_requested: 1, assigned_instructor_count: 5 }
              as: CenterAdmin
