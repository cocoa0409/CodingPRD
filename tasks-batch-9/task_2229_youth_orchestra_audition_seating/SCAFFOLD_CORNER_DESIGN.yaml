      - name: programming_behaves_differently_per_soloist_selection_mode
        claim_type: conditional_action
        grounds:
          - endpoints[POST /ensemble-events/{eventId}/programming]
          - calculations.soloist_selection
          - entities.EnsembleEvent.fields.soloist_selection_mode
        distinguishing_aspect: |
          One endpoint, three declared behaviours driven by the event's stored mode: under
          AUTO_SELECT the server runs soloist_selection and picks Prin Pia because
          is_principal DESC is the first sort key (both players tie at ranking_score 81.80,
          and Pia holds chair 1); under MANUAL the body's soloist_member_id is honoured
          verbatim, so Sec Sam is programmed even though he loses every automatic tie-break;
          under NONE the pool is never consulted and soloist_member_id stays null while the
          event still reaches PROGRAMMED. The MANUAL call also records a guest artist at
          400000, inside the 500000 cap.
        test_recipe:
          setup:
            - "Season in IN_SEASON; the Philharmonic VIOLIN quota (min 1 / target 2 / max 2) is"
            - "FULL with Prin Pia (years_in_org 2, chair 1, is_principal true) and Sec Sam"
