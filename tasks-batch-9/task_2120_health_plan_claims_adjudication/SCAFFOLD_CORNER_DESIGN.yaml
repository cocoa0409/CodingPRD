            - "The single row has claim_id == ${ca_id}, line_status == PRICED and authorization_id == ${auth_id}"
            - "GET /adjudication/claim-lines?claim_id=${cb_id} returns one row with authorization_id == null"

      - name: terminating_a_draft_contract_returns_contract_not_active
        claim_type: conditional_action
        grounds: ["state_machines.ProviderContract.status.ACTIVE_to_TERMINATED", "errors[ERR_CONTRACT_NOT_ACTIVE]", "validations[priority=30]"]
        distinguishing_aspect: "The terminate action accepts only status ACTIVE, so terminating a DRAFT contract returns ERR_CONTRACT_NOT_ACTIVE (409) and the contract keeps its original term_date 2026-06-30."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan EP-4 and IN_NETWORK provider EP4 Group exist with one DRAFT PCT_OF_FEE_SCHEDULE contract at 0.900 covering 2026-01-01..2026-06-30."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "EP-4", name: "Endpoint Plan Four", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "4000000004", name: "EP4 Group", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/contracts"
              payload: { provider_id: "${prov_id}", plan_id: "${plan_id}", effective_date: "2026-01-01", term_date: "2026-06-30", pricing_method: "PCT_OF_FEE_SCHEDULE", contract_pct: 0.900 }
              as: NetworkManager
              captures: { ctr_id: $.data.id, ctr_st: $.data.status }
          trigger:
            - call: "POST /adjudication/contracts/${ctr_id}/terminate"
              payload: { term_date: "2026-04-01" }
              as: NetworkManager
              captures: { err_id: $.data.error_id }
            - call: "GET /adjudication/contracts/${ctr_id}"
              payload: {}
              as: NetworkManager
              captures: { ctr_st_after: $.data.status, ctr_term_after: $.data.term_date }
            - call: "GET /adjudication/contracts"
              payload: { plan_id: "${plan_id}", status: "DRAFT" }
              as: NetworkManager
              captures: { listed_ctr_id: "$.data[0].id" }
          assert:
            - "${listed_ctr_id} == ${ctr_id}"
            - "${ctr_st} == DRAFT"
            - "${err_id} == ERR_CONTRACT_NOT_ACTIVE and HTTP status is 409"
            - "${ctr_st_after} == DRAFT and ${ctr_term_after} == 2026-06-30"
            - "GET /adjudication/contracts?plan_id=${plan_id}&status=DRAFT returns total_count == 1"

      - name: configuration_resources_are_readable_by_id_and_through_filtered_lists
        claim_type: standard_crud
        grounds: ["endpoints[GET /adjudication/benefit-plans/{id}]", "endpoints[GET /adjudication/members]", "endpoints[GET /adjudication/authorizations]", "entities.Member.fields.plan_id", "entities.Authorization.fields.member_id"]
        distinguishing_aspect: "Each configuration entity round-trips: the plan, provider and member read back by id with the values they were created with, and the filtered lists keyed on plan_id, member_id and provider_id each return exactly the one matching row."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan EP-5, IN_NETWORK provider EP5 Imaging, fee schedule rate 73721 = 40000, member M-EP-5 with one open-ended PRIMARY coverage from 2026-01-01, and one Authorization for 73721 with authorized_units 4."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "EP-5", name: "Endpoint Plan Five", deductible_individual_cents: 50000, oop_max_individual_cents: 300000, coinsurance_member_pct: 0.20 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "4000000005", name: "EP5 Imaging", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
              captures: { rate_id: $.data.id }
            - call: "POST /adjudication/members"
              payload: { member_number: "M-EP-5", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /adjudication/authorizations"
              payload: { member_id: "${mem_id}", provider_id: "${prov_id}", procedure_code: "73721", authorized_units: 4, valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: UtilizationReviewer
              captures: { auth_id: $.data.id }
          trigger:
            - call: "GET /adjudication/benefit-plans/${plan_id}"
              payload: {}
              as: ClaimsExaminer
              captures: { plan_code_read: $.data.plan_code, ded_read: $.data.deductible_individual_cents }
            - call: "GET /adjudication/providers/${prov_id}"
              payload: {}
              as: ClaimsExaminer
              captures: { npi_read: $.data.npi, net_read: $.data.network_status }
            - call: "GET /adjudication/members/${mem_id}"
              payload: {}
              as: ClaimsExaminer
              captures: { mnum_read: $.data.member_number, mplan_read: $.data.plan_id }
            - call: "GET /adjudication/members"
              payload: { plan_id: "${plan_id}" }
              as: ClaimsExaminer
            - call: "GET /adjudication/members/${mem_id}/coverages"
              payload: {}
              as: ClaimsExaminer
            - call: "GET /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721" }
              as: ClaimsExaminer
            - call: "GET /adjudication/authorizations"
              payload: { member_id: "${mem_id}", provider_id: "${prov_id}" }
              as: ClaimsExaminer
          assert:
            - "${plan_code_read} == EP-5 and ${ded_read} == 50000"
            - "${npi_read} == 4000000005 and ${net_read} == IN_NETWORK"
            - "${mnum_read} == M-EP-5 and ${mplan_read} == ${plan_id}"
            - "GET /adjudication/members?plan_id=${plan_id} returns total_count == 1 with id == ${mem_id}"
            - "GET /adjudication/members/${mem_id}/coverages returns total_count == 1 with id == ${cov_id}"
            - "GET /adjudication/benefit-plans/${plan_id}/fee-schedule-rates?procedure_code=73721 returns total_count == 1 with id == ${rate_id}"
            - "GET /adjudication/authorizations?member_id=${mem_id}&provider_id=${prov_id} returns total_count == 1 with id == ${auth_id}"

  # ===========================================================================
  - section: errors
    instances:
      - name: revoke_with_an_unknown_authorization_id_returns_authorization_not_found
        claim_type: violation_to_error
        grounds: ["errors[ERR_AUTHORIZATION_NOT_FOUND]", "validations[priority=10]"]
        distinguishing_aspect: "A path id that resolves to no Authorization returns ERR_AUTHORIZATION_NOT_FOUND (404) before any state precondition is evaluated."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; no authorizations exist."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
          trigger:
            - call: "POST /adjudication/authorizations/00000000-0000-4000-8000-000000000002/revoke"
              payload: {}
              as: UtilizationReviewer
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_AUTHORIZATION_NOT_FOUND"
            - "HTTP status is 404"

      - name: accumulator_adjustment_with_an_unknown_id_returns_accumulator_not_found
        claim_type: violation_to_error
        grounds: ["errors[ERR_ACCUMULATOR_NOT_FOUND]", "validations[priority=10]"]
        distinguishing_aspect: "Existence at priority 10 outranks the OCC check at priority 35, so an unknown accumulator id returns ERR_ACCUMULATOR_NOT_FOUND (404) and never ERR_STALE_ACCUMULATOR_VERSION."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan ERR-2 and member M-ERR-2 exist, so a real accumulator exists but is not the one addressed."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "ERR-2", name: "Error Plan Two", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/members"
              payload: { member_number: "M-ERR-2", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "GET /adjudication/members/${mem_id}/accumulators"
              payload: {}
              as: PlanAdmin
              captures: { acc_v: "$.data[0].version" }
          trigger:
            - call: "POST /adjudication/accumulators/00000000-0000-4000-8000-000000000003/adjustments"
              payload: { expected_accumulator_version: "${acc_v}", deductible_delta_cents: 100, oop_delta_cents: 100 }
              as: PlanAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_ACCUMULATOR_NOT_FOUND"
            - "HTTP status is 404, not 412"

      - name: get_claim_line_with_an_unknown_id_returns_claim_line_not_found
        claim_type: violation_to_error
        grounds: ["errors[ERR_CLAIM_LINE_NOT_FOUND]"]
        distinguishing_aspect: "Reading an unknown claim-line id returns ERR_CLAIM_LINE_NOT_FOUND (404) rather than an empty object."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; no claim lines exist."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
          trigger:
            - call: "GET /adjudication/claim-lines/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: ClaimsExaminer
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_CLAIM_LINE_NOT_FOUND"
            - "HTTP status is 404"

      - name: publish_fee_rate_under_an_unknown_plan_returns_plan_not_found
        claim_type: violation_to_error
        grounds: ["errors[ERR_PLAN_NOT_FOUND]", "validations[priority=10]"]
        distinguishing_aspect: "The plan id in the path is validated before the body, so an unknown plan returns ERR_PLAN_NOT_FOUND (404) even though the body is otherwise valid."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; no benefit plans exist."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
          trigger:
            - call: "POST /adjudication/benefit-plans/00000000-0000-4000-8000-000000000005/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_PLAN_NOT_FOUND"
            - "HTTP status is 404"

      - name: create_contract_with_an_unknown_provider_id_returns_provider_not_found
        claim_type: violation_to_error
        grounds: ["errors[ERR_PROVIDER_NOT_FOUND]", "validations[priority=11]"]
        distinguishing_aspect: "Body foreign keys are validated at priority 11, so an unknown provider_id returns ERR_PROVIDER_NOT_FOUND (404) before the priority-52 contract window check runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan ERR-5 exists and no providers exist."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "ERR-5", name: "Error Plan Five", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /adjudication/contracts"
              payload: { provider_id: "00000000-0000-4000-8000-000000000006", plan_id: "${plan_id}", effective_date: "2026-01-01", term_date: "2026-06-30", pricing_method: "PCT_OF_FEE_SCHEDULE", contract_pct: 0.900 }
              as: NetworkManager
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_PROVIDER_NOT_FOUND"
            - "HTTP status is 404"

      - name: terminate_with_an_unknown_coverage_id_returns_coverage_not_found
        claim_type: violation_to_error
        grounds: ["errors[ERR_COVERAGE_NOT_FOUND]"]
        distinguishing_aspect: "An unknown coverage id on the terminate action returns ERR_COVERAGE_NOT_FOUND (404) and fires no eligibility re-pend cascade."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; no coverage segments exist."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
          trigger:
            - call: "POST /adjudication/coverages/00000000-0000-4000-8000-000000000007/terminate"
              payload: { term_date: "2026-04-01" }
              as: PlanAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_COVERAGE_NOT_FOUND"
            - "HTTP status is 404"

      - name: error_contract_not_found_on_activate
        claim_type: violation_to_error
        grounds: ["errors[ERR_CONTRACT_NOT_FOUND]"]
        distinguishing_aspect: "An unknown contract id on activate returns ERR_CONTRACT_NOT_FOUND (404) before the DRAFT precondition is evaluated."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; no contracts exist."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
          trigger:
            - call: "POST /adjudication/contracts/00000000-0000-4000-8000-000000000008/activate"
              payload: {}
              as: NetworkManager
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_CONTRACT_NOT_FOUND"
            - "HTTP status is 404"

  # ===========================================================================
  - section: rbac
    instances:
      - name: network_manager_cannot_read_claims_and_gets_forbidden_role
        claim_type: other_role_denied
        grounds: ["roles.NetworkManager", "errors[ERR_FORBIDDEN_ROLE]", "validations[priority=2]"]
        distinguishing_aspect: "NetworkManager is deliberately absent from the roles list of every claim read endpoint, so GET /adjudication/claims returns ERR_FORBIDDEN_ROLE (403) for that role while ClaimsExaminer succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan RB-1, IN_NETWORK provider, fee schedule rate 73721 = 40000, member with an open-ended PRIMARY coverage from 2026-01-01 and one RECEIVED claim."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "RB-1", name: "RBAC Plan One", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "5000000001", name: "RB1 Clinic", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-RB-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-RB-1", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /adjudication/claims"
              payload: { member_id: "${mem_id}" }
              as: NetworkManager
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_FORBIDDEN_ROLE"
            - "HTTP status is 403"
            - "The same GET as ClaimsExaminer returns HTTP 200 with total_count == 1"

