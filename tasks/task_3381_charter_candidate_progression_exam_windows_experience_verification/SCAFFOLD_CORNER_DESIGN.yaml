              payload: { segments: [ { employer_name: "Epsilon Advisors", role_title: "Analyst", start_date: "2022-01-10", end_date: "2023-01-10", qualifying_activity_pct: 50, hours: 1800 }, { employer_name: "Zeta Funds", role_title: "Operations", start_date: "2023-02-10", end_date: "2024-02-10", qualifying_activity_pct: 49, hours: 1900 } ] }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { sub_q: $.data.id }
            - call: "POST /charter/experience-submissions/${sub_q}/references"
              payload: { referee_name: "Ref One", referee_email: "ref1@example.com" }
              as: Candidate
              as_user_id: "${cand_a}"
            - call: "POST /charter/experience-submissions/${sub_q}/references"
              payload: { referee_name: "Ref Two", referee_email: "ref2@example.com" }
              as: Candidate
              as_user_id: "${cand_a}"
          trigger:
            - call: "POST /charter/experience-submissions/${sub_q}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { prov_q: $.data.provisional_months }
          assert:
            - "prov_q == 12 (only the exactly-50% segment counts; the 49% segment is excluded from the input set)"
            - "the >= boundary at MIN_QUALIFYING_PCT 50 is inclusive"

      - name: c_reschedule_fee_day14_is_not_late
        claim_type: Constants Applied
        grounds:
          - calculations.reschedule_fee_quote
          - entities.ExamAppointment.fields.reschedule_fees_total_cents
        distinguishing_aspect: "The late branch is strictly less-than 14 days: rescheduling exactly 14 days before the exam charges the bare 25000 base with zero surcharge — a <= reading would wrongly charge 50000."
        test_recipe:
