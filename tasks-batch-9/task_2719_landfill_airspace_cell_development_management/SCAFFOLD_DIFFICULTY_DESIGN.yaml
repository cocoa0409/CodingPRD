      - name: survey_overlap_and_ninety_day_spacing_boundaries
        grounds:
          - calculations.survey_coverage_overlap
          - calculations.survey_density_measurement
          - validations[priority=17]
          - validations[priority=18]
          - state_machines.AerialSurvey.RECORDED_to_SUPERSEDED
        distinguishing_aspect: |
          Coverage intervals are CLOSED and flight spacing is inclusive, so both boundaries sit
          one unit apart and the two rules must be evaluated in the declared order. A flight
          89 days after the last one is refused for spacing; a flight exactly 90 days later is
          accepted for spacing but refused for overlap because its coverage start equals the
          previous coverage end; moving the start one day later finally succeeds. The third
          call also proves the density calculation switches from the certified-airspace basis
          to the prior-survey basis.
        test_recipe:
          setup:
            - "Landfill LF with Cell C-1 QA_CERTIFIED, so certified_airspace_cy is 1000000."
            - "AerialSurvey S1 RECORDED: flown_on 2026-08-01, coverage [2026-05-01, 2026-07-31], measured_remaining_airspace_cy 700000, tons_placed_in_period 250000."
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000, daily_load_limit: 200 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-1", design_airspace_cy: 1000000, design_area_sf: 120001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-15T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /cells/${c1_id}/begin-construction"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
            - call: "POST /liner-qa-packages"
              payload: { cell_id: "${c1_id}", seam_length_ft: 4000, destructive_test_count: 20, passing_test_count: 20, panel_count: 40, defect_count: 2 }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { qa1_id: $.data.id }
            - call: "POST /liner-qa-packages/${qa1_id}/begin-review"
              payload: {}
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
            - call: "POST /liner-qa-packages/${qa1_id}/approve"
              payload: { certification_reference: "CQA-2026-001" }
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
            - call: "POST /aerial-surveys"
              payload: { landfill_id: "${lf_id}", flown_on: "2026-08-01T00:00:00Z", coverage_period_start: "2026-05-01T00:00:00Z", coverage_period_end: "2026-07-31T00:00:00Z", measured_remaining_airspace_cy: 700000, tons_placed_in_period: 250000 }
              as: SurveyorOfRecord
              as_user_id: "surveyor-1"
              captures: { s1_id: $.data.id, s1_consumed: $.data.airspace_consumed_in_period_cy, s1_density: $.data.measured_density_tons_per_cy }
          trigger:
            - call: "POST /aerial-surveys"
              payload: { landfill_id: "${lf_id}", flown_on: "2026-10-29T00:00:00Z", coverage_period_start: "2026-08-01T00:00:00Z", coverage_period_end: "2026-10-29T00:00:00Z", measured_remaining_airspace_cy: 640000, tons_placed_in_period: 50000 }
              as: SurveyorOfRecord
              as_user_id: "surveyor-1"
            - call: "POST /aerial-surveys"
              payload: { landfill_id: "${lf_id}", flown_on: "2026-10-30T00:00:00Z", coverage_period_start: "2026-07-31T00:00:00Z", coverage_period_end: "2026-10-29T00:00:00Z", measured_remaining_airspace_cy: 640000, tons_placed_in_period: 50000 }
              as: SurveyorOfRecord
              as_user_id: "surveyor-1"
            - call: "POST /aerial-surveys"
              payload: { landfill_id: "${lf_id}", flown_on: "2026-10-30T00:00:00Z", coverage_period_start: "2026-08-01T00:00:00Z", coverage_period_end: "2026-10-29T00:00:00Z", measured_remaining_airspace_cy: 640000, tons_placed_in_period: 50000 }
              as: SurveyorOfRecord
              as_user_id: "surveyor-1"
              captures: { s2_id: $.data.id, s2_consumed: $.data.airspace_consumed_in_period_cy, s2_density: $.data.measured_density_tons_per_cy }
          assert:
            - "${s1_consumed} == 300000.00 (certified 1000000 minus surveyed 700000, the no-prior-survey basis) and ${s1_density} == 0.8333"
            - "the first trigger is 89 whole days after 2026-08-01 and its coverage does not overlap, so it returns ERR_SURVEY_SPACING_VIOLATION with HTTP 409"
            - "the second trigger is exactly 90 days after 2026-08-01, which satisfies spacing, but its coverage starts on 2026-07-31 — the closed end of S1's interval — so it returns ERR_SURVEY_PERIOD_OVERLAP with HTTP 409"
            - "the second trigger proves the declared order: overlap at priority 17 is checked before spacing at priority 18"
            - "the third trigger succeeds: ${s2_consumed} == 60000.00 (prior survey 700000 minus 640000, the prior-survey basis) and ${s2_density} == 0.8333"
            - "AerialSurvey.${s1_id}.status == 'SUPERSEDED' and AerialSurvey.${s2_id}.status == 'RECORDED'"
            - "Landfill.${lf_id}.remaining_life_years == 1.78 (640000 * 0.8333 / 300000)"
            - "exactly two AerialSurvey rows exist for LF: the two refused calls created nothing"

      - name: leachate_daily_gallon_cap_exact_equality_and_touching_window
        grounds:
          - validations[priority=26]
          - validations[priority=19]
          - calculations.leachate_slot_occupancy
          - entities.TreatmentAgreement.fields.scheduled_gallons_today
        distinguishing_aspect: |
          Three boundaries in one fixture, all inclusive-or-exclusive by exactly one unit.
          Windows are HALF-OPEN, so a shipment starting exactly when another ends does NOT
          occupy the same slot — the opposite convention from the closed survey intervals in
          the same scaffold. The daily gallon cap is satisfied by exact equality: a request
          taking the day to precisely 20000 is accepted, and one more gallon is refused. The
          cap is keyed on the calendar date of window_start, so a full 20000-gallon day is
          available again on the next date.
        test_recipe:
          setup:
            - "Landfill LF with TreatmentAgreement TA: daily_gallon_cap 20000, concurrent_slot_capacity 2, base_haul_fee 350.00, treatment_rate_per_kgal 62.50."
            - "Shipment W1 SCHEDULED [2026-08-05T08:00:00Z, 2026-08-05T12:00:00Z) with 8000 gallons."
            - "Shipment W2 SCHEDULED [2026-08-05T10:00:00Z, 2026-08-05T14:00:00Z) with 4000 gallons."
            - "The logical clock is pinned to 2026-08-05T06:00:00Z so scheduled_gallons_today reports that date; it reads 12000."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000, daily_load_limit: 200 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
            - call: "POST /treatment-agreements"
              payload: { landfill_id: "${lf_id}", facility_name: "Valley POTW", daily_gallon_cap: 20000, concurrent_slot_capacity: 2, base_haul_fee: 350.00, treatment_rate_per_kgal: 62.50, effective_from: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { ta_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta_id}", gallons: 8000, window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T12:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { w1_id: $.data.id }
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta_id}", gallons: 4000, window_start: "2026-08-05T10:00:00Z", window_end: "2026-08-05T14:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { w2_id: $.data.id }
          trigger:
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta_id}", gallons: 8000, window_start: "2026-08-05T12:00:00Z", window_end: "2026-08-05T16:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { w3_id: $.data.id, w3_state: $.data.status }
            - call: "GET /treatment-agreements/${ta_id}"
              payload: {}
              as: SiteOperator
              captures: { gallons_at_cap: $.data.scheduled_gallons_today }
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta_id}", gallons: 1, window_start: "2026-08-05T16:00:00Z", window_end: "2026-08-05T18:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta_id}", gallons: 20000, window_start: "2026-08-06T08:00:00Z", window_end: "2026-08-06T10:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { w5_id: $.data.id, w5_state: $.data.status }
          assert:
            - "${w3_state} == 'SCHEDULED': its window starts exactly when W1 ends, so under the half-open rule it overlaps only W2 and the slot count is 2, exactly the capacity"
            - "${gallons_at_cap} == 20000, precisely equal to daily_gallon_cap, which is allowed"
            - "the 1-gallon request returns ERR_DAILY_GALLON_CAP_EXCEEDED with HTTP 422 — one unit past an inclusive ceiling"
            - "${w5_state} == 'SCHEDULED' with 20000 gallons on 2026-08-06, because the cap is keyed on the calendar date of window_start"
            - "immediately after W5 the field still reads 20000, because scheduled_gallons_today counts only windows on the CURRENT logical-clock date 2026-08-05; advancing the clock to 2026-08-06 makes it read 20000 for that date instead"
            - "exactly four LeachateShipment rows exist for TA: the refused request created nothing"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: load_clearance_depends_on_landfill_and_cell_states_in_fixed_order
        grounds:
          - validations[priority=10]
          - state_machines.WasteLoad.PENDING_to_CLEARED
          - state_machines.Cell.ACTIVE_to_FULL
          - entities.Landfill.fields.operating_status
          - entities.Cell.fields.status
        distinguishing_aspect: |
          The identical clear-screening request on the identical WasteLoad row is refused
          twice with two different error ids and then accepted, without one field of the load
          ever changing. The first refusal is decided two levels up the graph by
          Landfill.operating_status, the second one level up by Cell.status, and the declared
