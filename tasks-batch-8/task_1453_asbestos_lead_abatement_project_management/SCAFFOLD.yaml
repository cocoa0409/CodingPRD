# =============================================================================
# Task 1453: Asbestos & Lead Abatement Project Management — seed tables
# =============================================================================

scenario: |
  Asbestos & Lead Abatement Project Management (abatement contractor): survey &
  sampling before renovation/demolition, notification to regulator & waiting
  period, containment design & negative air setup, worker certification &
  medical/respirator program, air monitoring & clearance testing, waste manifest
  & disposal at approved facility, occupant relocation & re-occupancy criteria,
  project documentation for liability

domain_name: asbestos-lead-abatement
api_prefix: /abatement

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Project name" }
      - { name: site_address, type: string, source: input, description: "Street address of the abatement site" }
      - { name: work_type, type: enum, source: input, description: "RENOVATION | DEMOLITION" }
      - { name: hazard_class, type: enum, source: input, description: "ASBESTOS | LEAD | MIXED" }
      - { name: planned_start, type: datetime, source: input, description: "Planned abatement start (informational)" }
      - { name: base_abatement_cost_cents, type: integer, source: input, description: "Contracted abatement labor/base cost in cents (>= 0)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ASSESSED | IN_PROGRESS | SUSPENDED | AWAITING_CLEARANCE | RECLEANING | CLOSED" }
      - { name: total_acm_sq_ft, type: number, source: computed, default: 0, description: "Final ACM quantity from the FINALIZED survey (final variant of survey_acm_quantities)" }
      - { name: estimated_disposal_cost_cents, type: integer, source: computed, default: 0, description: "Survey-derived estimate (estimated variant of disposal_cost)" }
      - { name: manifested_weight_lbs, type: number, source: computed, default: 0, description: "Sum of net_weight_lbs over manifests with status IN {SEALED, IN_TRANSIT, DELIVERED, CONFIRMED}" }
      - { name: final_disposal_cost_cents, type: integer, source: computed, default: 0, description: "Sum of fee_cents over CONFIRMED manifests (final variant of disposal_cost)" }
      - { name: insurance_surcharge_cents, type: integer, source: computed, default: 0, description: "project_cost_rollup surcharge component" }
      - { name: total_project_cost_cents, type: integer, source: computed, default: 0, description: "project_cost_rollup total" }
      - { name: reoccupancy_status, type: enum, source: computed, default: "BLOCKED", description: "BLOCKED | OPEN — clearance_readiness gate for re-occupancy" }

  - name: Survey
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; exactly one survey per project" }
      - { name: surveyor_name, type: string, source: input, description: "Certified inspector name" }
      - { name: survey_date, type: datetime, source: input, description: "Date the survey was performed" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_LAB | FINALIZED" }
      - { name: acm_sq_ft_provisional, type: number, source: computed, default: 0, description: "Provisional variant: sum of quantity_sq_ft for samples with lab_result IN {PENDING, POSITIVE}" }
      - { name: acm_sq_ft_final, type: number, source: computed, default: 0, description: "Final variant: sum of quantity_sq_ft for samples with lab_result == POSITIVE" }
      - { name: friable_acm_sq_ft_final, type: number, source: computed, default: 0, description: "Sum of quantity_sq_ft for samples with lab_result == POSITIVE AND friable == true" }

  - name: Sample
    parent: null
    common_fields: true
    fields:
      - { name: survey_id, type: string, source: input, description: "FK -> Survey.id" }
      - { name: material, type: string, source: input, description: "Material description (e.g., pipe insulation)" }
      - { name: location_desc, type: string, source: input, description: "Where in the building the sample was taken" }
      - { name: quantity_sq_ft, type: number, source: input, description: "Represented material quantity (> 0)" }
      - { name: friable, type: boolean, source: input, description: "Whether the material is friable" }
      - { name: lab_result, type: enum, source: system, default: "PENDING", description: "PENDING | POSITIVE | NEGATIVE" }
      - { name: asbestos_pct, type: number, source: input, description: "Asbestos percentage 1..100; required iff lab_result == POSITIVE" }
      - { name: lead_ppm, type: number, source: input, description: "Lead content ppm (optional)", default: null }
      - { name: status, type: enum, source: system, description: "PENDING | REPORTED" }

  - name: Worker
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Worker name" }
      - { name: certification_level, type: enum, source: input, description: "SUPERVISOR | HANDLER" }
      - { name: cert_expires_at, type: datetime, source: input, description: "Certification expiry" }
      - { name: medical_clearance_expires_at, type: datetime, source: input, description: "Medical surveillance clearance expiry" }
      - { name: respirator_fit_expires_at, type: datetime, source: input, description: "Respirator fit-test expiry" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LAPSED" }
      - { name: assigned_scheduled_hours, type: number, source: computed, default: 0, description: "worker_assigned_hours: sum of scheduled_hours over assignments with status == SCHEDULED" }

  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id" }
      - { name: role_on_site, type: enum, source: input, description: "SUPERVISOR | HANDLER" }
      - { name: start_at, type: datetime, source: input, description: "Window start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Window end (exclusive); must be > start_at" }
      - { name: scheduled_hours, type: number, source: computed, description: "(end_at - start_at) in hours, 2dp" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | SUSPENDED | COMPLETED | CANCELLED" }

  - name: RegulatoryNotification
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: notification_type, type: enum, source: input, description: "INITIAL | REVISION | EMERGENCY" }
      - { name: declared_acm_sq_ft, type: number, source: input, description: "Declared ACM quantity (> 0)" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock timestamp at filing" }
      - { name: waiting_days, type: integer, source: computed, description: "waiting_period_window: 10 for INITIAL/REVISION, 3 for EMERGENCY" }
      - { name: earliest_start_at, type: datetime, source: computed, description: "filed_at + waiting_days calendar days" }
      - { name: status, type: enum, source: system, description: "FILED | ACKNOWLEDGED | SUPERSEDED" }
      - { name: acknowledged_at, type: datetime, source: system, default: null, description: "Set on acknowledge" }

  - name: Containment
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; exactly one containment per project" }
      - { name: work_area_volume_cuft, type: number, source: input, description: "Enclosed work-area volume (> 0)" }
      - { name: containment_class, type: enum, source: input, description: "FULL | MINI_ENCLOSURE | GLOVE_BAG" }
      - { name: air_changes_per_hour, type: number, source: computed, description: "4 for FULL, 6 for MINI_ENCLOSURE, 0 for GLOVE_BAG" }
      - { name: machines_required, type: integer, source: computed, description: "negative_air_machine_count" }
      - { name: last_pressure_reading_inwg, type: number, source: system, default: null, description: "Pressure reading recorded at latest successful verify" }
      - { name: verified_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the Supervisor who last verified (segregation-of-duties anchor)" }
      - { name: last_verified_at, type: datetime, source: system, default: null, description: "Logical clock timestamp of latest successful verify" }
      - { name: status, type: enum, source: system, description: "DESIGNED | INSTALLED | VERIFIED | RECLEAN_REQUIRED" }

  - name: AirTest
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: phase, type: enum, source: input, description: "BASELINE | DAILY | CLEARANCE" }
      - { name: collected_at, type: datetime, source: input, description: "When the air sample was collected" }
      - { name: result_f_cc, type: number, source: input, default: null, description: "Fibers/cc result recorded on result call" }
      - { name: outcome, type: enum, source: computed, default: "NA", description: "clearance_threshold_outcome: NA unless phase == CLEARANCE; PASS iff result_f_cc < 0.010 else FAIL" }
      - { name: result_recorded_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the IndustrialHygienist recording the result" }
      - { name: status, type: enum, source: system, description: "COLLECTED | REPORTED" }

  - name: WasteManifest
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: facility_id, type: string, source: input, description: "FK -> DisposalFacility.id" }
      - { name: bags_count, type: integer, source: input, description: "Number of sealed waste bags (>= 1)" }
      - { name: gross_weight_lbs, type: number, source: input, description: "Gross weight including packaging (> 0)" }
      - { name: net_weight_lbs, type: number, source: computed, description: "manifest_net_weight: gross_weight_lbs - bags_count * BAG_TARE_LBS" }
      - { name: net_tons, type: number, source: computed, description: "net_weight_lbs / 2000, 4dp round_half_up" }
      - { name: fee_cents, type: integer, source: computed, description: "manifest_disposal_fee; computed and frozen at seal" }
      - { name: sealed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the Supervisor who sealed" }
      - { name: delivered_at, type: datetime, source: system, default: null, description: "Set on deliver" }
      - { name: reject_reason, type: string, source: input, default: null, description: "Set on reject" }
      - { name: status, type: enum, source: system, description: "DRAFT | SEALED | IN_TRANSIT | DELIVERED | CONFIRMED | REJECTED | VOIDED" }

  - name: DisposalFacility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: epa_id, type: string, source: input, description: "EPA identification number" }
      - { name: accepted_hazards, type: array, source: input, description: "Non-empty subset of [ASBESTOS, LEAD]" }
      - { name: monthly_capacity_tons, type: number, source: input, description: "Maximum accepted tons per calendar month (> 0)" }
      - { name: delivered_tons_current_month, type: number, source: computed, default: 0, description: "facility_monthly_tons aggregate" }
      - { name: status, type: enum, source: system, description: "APPROVED | SUSPENDED" }

  - name: RelocationUnit
    parent: null
    common_fields: true
    fields:
      - { name: unit_label, type: string, source: input, description: "Temporary housing unit label" }
      - { name: capacity_persons, type: integer, source: input, description: "Maximum occupants (>= 1)" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | OCCUPIED | CLEANING" }
      - { name: cleaning_until, type: datetime, source: system, default: null, description: "Unit unavailable until this timestamp (returned_at + UNIT_CLEANING_BUFFER_DAYS)" }

  - name: RelocationRecord
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: unit_id, type: string, source: input, description: "FK -> RelocationUnit.id" }
      - { name: household_name, type: string, source: input, description: "Occupant household name" }
      - { name: persons, type: integer, source: input, description: "Number of occupants (>= 1)" }
      - { name: move_out_at, type: datetime, source: input, description: "When occupants vacated / unit occupation begins" }
      - { name: returned_at, type: datetime, source: system, default: null, description: "Set on return" }
      - { name: extension_count, type: integer, source: system, default: 0, description: "Incremented each time a clearance-failure cascade extends the stay" }
      - { name: status, type: enum, source: system, description: "HOUSED | EXTENDED | RETURNED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ASSESSED
        trigger: "system (automatic when the project's Survey transitions IN_LAB -> FINALIZED)"
        actor: system
        preconditions: []
        side_effects:
          - "total_acm_sq_ft := survey.acm_sq_ft_final"
          - "estimated_disposal_cost_cents recomputed via disposal_cost (estimated variant)"
          - "increments Project.version by 1"
      - from: ASSESSED
        to: IN_PROGRESS
        trigger: "POST /abatement/projects/{id}/start-abatement"
        actor: ContractorAdmin
        preconditions:
          - "latest RegulatoryNotification of the project (order filed_at DESC, tie-break created_at DESC) has status == ACKNOWLEDGED (ERR_NOTIFICATION_NOT_ACKNOWLEDGED)"
          - "logical clock now >= that notification's earliest_start_at (ERR_WAITING_PERIOD_NOT_ELAPSED)"
          - "project's Containment exists and status == VERIFIED (ERR_INVALID_STATE)"
          - "at least one CrewAssignment with project_id == Project.id, role_on_site == SUPERVISOR, status == SCHEDULED, start_at <= now < end_at (ERR_SUPERVISOR_COVERAGE_REQUIRED)"
        side_effects: ["increments Project.version by 1"]
      - from: IN_PROGRESS
        to: SUSPENDED
        trigger: "POST /abatement/projects/{id}/suspend (manual stop-work) OR system (supervisor-lapse cascade from Worker LAPSED)"
        actor: ContractorAdmin | Supervisor | system
        preconditions: []
        side_effects: ["increments Project.version by 1"]
      - from: SUSPENDED
        to: IN_PROGRESS
        trigger: "POST /abatement/projects/{id}/resume"
        actor: ContractorAdmin | Supervisor
        preconditions:
          - "at least one CrewAssignment with project_id == Project.id, role_on_site == SUPERVISOR, status == SCHEDULED, start_at <= now < end_at (ERR_SUPERVISOR_COVERAGE_REQUIRED)"
        side_effects: ["increments Project.version by 1"]
      - from: IN_PROGRESS
        to: AWAITING_CLEARANCE
        trigger: "POST /abatement/projects/{id}/complete-work"
        actor: Supervisor
        preconditions:
          - "no WasteManifest of the project has status == DRAFT (ERR_MANIFESTS_OUTSTANDING)"
        side_effects: ["increments Project.version by 1"]
      - from: AWAITING_CLEARANCE
        to: RECLEANING
        trigger: "system (cascade link 2: containment of this project entered RECLEAN_REQUIRED after a CLEARANCE AirTest outcome == FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "reoccupancy_status recomputed -> BLOCKED"
          - "cascade link 3: every RelocationRecord with project_id == Project.id and status == HOUSED transitions to EXTENDED with extension_count += 1"
          - "increments Project.version by 1"
      - from: RECLEANING
        to: AWAITING_CLEARANCE
        trigger: "system (automatic when the project's Containment transitions RECLEAN_REQUIRED -> VERIFIED)"
        actor: system
        preconditions: []
        side_effects: ["increments Project.version by 1"]
      - from: AWAITING_CLEARANCE
        to: CLOSED
        trigger: "POST /abatement/projects/{id}/close"
        actor: ContractorAdmin
        preconditions:
          - "reoccupancy_status == OPEN, i.e. clearance_readiness holds (ERR_REOCCUPANCY_BLOCKED)"
          - "every WasteManifest of the project has status IN {CONFIRMED, VOIDED} (ERR_MANIFESTS_OUTSTANDING)"
          - "every RelocationRecord of the project has status == RETURNED (ERR_REOCCUPANCY_BLOCKED)"
        side_effects: ["increments Project.version by 1"]

  - entity: Survey
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: IN_LAB
        trigger: "POST /abatement/surveys/{id}/submit"
        actor: ContractorAdmin
        preconditions:
          - "survey has at least one Sample (ERR_VALIDATION)"
        side_effects: []
      - from: IN_LAB
        to: FINALIZED
        trigger: "POST /abatement/surveys/{id}/finalize"
        actor: ContractorAdmin
        preconditions:
          - "every Sample of the survey has status == REPORTED (ERR_SAMPLES_STILL_PENDING)"
        side_effects:
          - "Project (survey.project_id) transitions DRAFT -> ASSESSED with its documented side effects"

  - entity: Sample
    initial_state: PENDING
    terminal_states: [REPORTED]
    transitions:
      - from: PENDING
        to: REPORTED
        trigger: "POST /abatement/samples/{id}/result"
        actor: IndustrialHygienist
        preconditions:
          - "survey (sample.survey_id) status == IN_LAB (ERR_INVALID_STATE)"
          - "if lab_result == POSITIVE then asbestos_pct is present and 1 <= asbestos_pct <= 100 (ERR_VALIDATION)"
        side_effects:
          - "lab_result, asbestos_pct set; survey quantity aggregates recomputed via survey_acm_quantities"

  - entity: Worker
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "system (clock sweep inside POST /_clock/set_current_utc when now >= min(cert_expires_at, medical_clearance_expires_at, respirator_fit_expires_at))"
        actor: system
        preconditions: []
        side_effects:
          - "cascade link 1: every CrewAssignment with worker_id == Worker.id and status == SCHEDULED transitions to SUSPENDED"
          - "cascade link 2: for each Project that had at least one assignment suspended by link 1, if project.status == IN_PROGRESS and no remaining CrewAssignment with project_id == Project.id, role_on_site == SUPERVISOR, status == SCHEDULED and start_at <= now < end_at exists, project transitions IN_PROGRESS -> SUSPENDED"
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /abatement/workers/{id}/recertify"
        actor: ContractorAdmin
        preconditions:
          - "after applying provided fields, all three expiry fields are strictly > now (ERR_WORKER_NOT_FIT)"
        side_effects:
          - "every CrewAssignment with worker_id == Worker.id, status == SUSPENDED and end_at > now transitions back to SCHEDULED"

  - entity: CrewAssignment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SUSPENDED
        trigger: "system (worker lapse cascade)"
        actor: system
        preconditions: []
        side_effects: ["worker_assigned_hours recomputed for the worker (SUSPENDED excluded)"]
      - from: SUSPENDED
        to: SCHEDULED
        trigger: "system (worker recertify cascade)"
        actor: system
        preconditions: ["end_at > now"]
        side_effects: ["worker_assigned_hours recomputed for the worker"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /abatement/assignments/{id}/cancel"
        actor: ContractorAdmin | Supervisor
        preconditions: []
        side_effects: ["worker_assigned_hours recomputed for the worker"]
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system (clock sweep when end_at <= now)"
        actor: system
        preconditions: []
        side_effects: ["worker_assigned_hours recomputed for the worker"]
      - from: SUSPENDED
        to: COMPLETED
        trigger: "system (clock sweep when end_at <= now)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RegulatoryNotification
    initial_state: FILED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: FILED
        to: ACKNOWLEDGED
        trigger: "POST /abatement/notifications/{id}/acknowledge"
        actor: RegulatorClerk
        preconditions: []
        side_effects: ["acknowledged_at := now"]
      - from: FILED
        to: SUPERSEDED
        trigger: "system (a new RegulatoryNotification is created for the same project)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACKNOWLEDGED
        to: SUPERSEDED
        trigger: "system (a new RegulatoryNotification is created for the same project)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Containment
    initial_state: DESIGNED
    terminal_states: []
    transitions:
      - from: DESIGNED
        to: DESIGNED
        trigger: "POST /abatement/containments/{id}/revise"
        actor: Supervisor
        preconditions: ["expected_containment_version matches current version (ERR_STALE_VERSION)"]
        side_effects:
          - "work_area_volume_cuft / containment_class updated as provided"
          - "air_changes_per_hour and machines_required recomputed via negative_air_machine_count"
          - "increments Containment.version by 1"
      - from: DESIGNED
        to: INSTALLED
        trigger: "POST /abatement/containments/{id}/install"
        actor: Supervisor
        preconditions: ["project (containment.project_id) status == ASSESSED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: INSTALLED
        to: VERIFIED
        trigger: "POST /abatement/containments/{id}/verify"
        actor: Supervisor
        preconditions: ["pressure_reading_inwg <= PRESSURE_MAX_INWG (-0.020) (ERR_PRESSURE_INSUFFICIENT)"]
        side_effects:
          - "last_pressure_reading_inwg := pressure_reading_inwg; verified_by_user_id := X-User-ID; last_verified_at := now"
      - from: RECLEAN_REQUIRED
        to: VERIFIED
        trigger: "POST /abatement/containments/{id}/verify"
        actor: Supervisor
        preconditions: ["pressure_reading_inwg <= PRESSURE_MAX_INWG (-0.020) (ERR_PRESSURE_INSUFFICIENT)"]
        side_effects:
          - "last_pressure_reading_inwg := pressure_reading_inwg; verified_by_user_id := X-User-ID; last_verified_at := now"
          - "project (containment.project_id) transitions RECLEANING -> AWAITING_CLEARANCE"
      - from: VERIFIED
        to: RECLEAN_REQUIRED
        trigger: "system (cascade link 1: a CLEARANCE-phase AirTest of the project recorded outcome == FAIL)"
        actor: system
        preconditions: []
        side_effects: ["cascade link 2: project (containment.project_id) transitions AWAITING_CLEARANCE -> RECLEANING"]

  - entity: AirTest
    initial_state: COLLECTED
    terminal_states: [REPORTED]
    transitions:
      - from: COLLECTED
        to: REPORTED
        trigger: "POST /abatement/air-tests/{id}/result"
        actor: IndustrialHygienist
        preconditions:
          - "if phase == CLEARANCE: X-User-ID != project's containment.verified_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "result_f_cc set; outcome computed via clearance_threshold_outcome; result_recorded_by_user_id := X-User-ID"
          - "if phase == CLEARANCE and outcome == FAIL: cascade link 1 fires (containment VERIFIED -> RECLEAN_REQUIRED; then project -> RECLEANING; then RelocationRecords HOUSED -> EXTENDED)"
          - "if phase == CLEARANCE and outcome == PASS: project reoccupancy_status recomputed via clearance_readiness"

  - entity: WasteManifest
    initial_state: DRAFT
    terminal_states: [CONFIRMED, VOIDED]
    transitions:
      - from: DRAFT
        to: SEALED
        trigger: "POST /abatement/manifests/{id}/seal"
        actor: Supervisor
        preconditions:
          - "project (manifest.project_id) status IN {IN_PROGRESS, RECLEANING} (ERR_INVALID_STATE)"
          - "project's containment status IN {VERIFIED, RECLEAN_REQUIRED} (ERR_INVALID_STATE)"
        side_effects:
          - "fee_cents computed and frozen via manifest_disposal_fee; sealed_by_user_id := X-User-ID"
          - "project manifested_weight_lbs recomputed via manifest aggregation"
      - from: SEALED
        to: IN_TRANSIT
        trigger: "POST /abatement/manifests/{id}/ship"
        actor: Supervisor
        preconditions: []
        side_effects: []
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /abatement/manifests/{id}/deliver"
        actor: FacilityOperator
        preconditions:
          - "X-User-ID == manifest.facility_id (ERR_FACILITY_MISMATCH)"
          - "facility status == APPROVED (ERR_FACILITY_NOT_APPROVED)"
          - "hazard match: project.hazard_class == MIXED requires facility.accepted_hazards to contain both ASBESTOS and LEAD; otherwise facility.accepted_hazards must contain project.hazard_class (ERR_FACILITY_HAZARD_MISMATCH)"
          - "facility_monthly_tons + manifest.net_tons <= facility.monthly_capacity_tons (ERR_FACILITY_CAPACITY_EXCEEDED)"
        side_effects:
          - "delivered_at := now; facility delivered_tons_current_month recomputed"
      - from: DELIVERED
        to: CONFIRMED
        trigger: "POST /abatement/manifests/{id}/confirm"
        actor: FacilityOperator
        preconditions: ["X-User-ID == manifest.facility_id (ERR_FACILITY_MISMATCH)"]
        side_effects:
          - "project manifested_weight_lbs, final_disposal_cost_cents recomputed; project_cost_rollup recomputed"
      - from: DELIVERED
        to: REJECTED
        trigger: "POST /abatement/manifests/{id}/reject"
        actor: FacilityOperator
        preconditions: ["X-User-ID == manifest.facility_id (ERR_FACILITY_MISMATCH)"]
        side_effects:
          - "reject_reason set; facility delivered_tons_current_month recomputed (REJECTED excluded)"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /abatement/manifests/{id}/void"
        actor: Supervisor | ContractorAdmin
        preconditions: []
        side_effects: ["project manifested_weight_lbs recomputed (VOIDED excluded from aggregation set)"]
      - from: REJECTED
        to: VOIDED
        trigger: "POST /abatement/manifests/{id}/void"
        actor: Supervisor | ContractorAdmin
        preconditions: []
        side_effects: ["project manifested_weight_lbs recomputed"]

  - entity: DisposalFacility
    initial_state: APPROVED
    terminal_states: [SUSPENDED]
    transitions:
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /abatement/facilities/{id}/suspend"
        actor: ContractorAdmin
        preconditions: []
        side_effects:
          - "cascade link 1: every WasteManifest with facility_id == Facility.id and status == IN_TRANSIT transitions to REJECTED with reject_reason := 'FACILITY_SUSPENDED'"
          - "cascade link 2: for each affected manifest, project manifested_weight_lbs recomputed; facility delivered_tons_current_month recomputed"

  - entity: RelocationUnit
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: OCCUPIED
        trigger: "system (a RelocationRecord is created against this unit)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OCCUPIED
        to: CLEANING
        trigger: "system (the unit's HOUSED/EXTENDED RelocationRecord transitions to RETURNED)"
        actor: system
        preconditions: []
        side_effects: ["cleaning_until := returned_at + UNIT_CLEANING_BUFFER_DAYS (1 day)"]
      - from: CLEANING
        to: AVAILABLE
        trigger: "system (clock sweep when now >= cleaning_until)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RelocationRecord
    initial_state: HOUSED
    terminal_states: [RETURNED]
    transitions:
      - from: HOUSED
        to: EXTENDED
        trigger: "system (cascade link 3: project entered RECLEANING)"
        actor: system
        preconditions: []
        side_effects: ["extension_count += 1"]
      - from: HOUSED
        to: RETURNED
        trigger: "POST /abatement/relocations/{id}/return"
        actor: ContractorAdmin
        preconditions: ["project (relocation.project_id) reoccupancy_status == OPEN (ERR_REOCCUPANCY_BLOCKED)"]
        side_effects:
          - "returned_at := now"
          - "relocation unit (relocation.unit_id) transitions OCCUPIED -> CLEANING"
      - from: EXTENDED
        to: RETURNED
        trigger: "POST /abatement/relocations/{id}/return"
        actor: ContractorAdmin
        preconditions: ["project (relocation.project_id) reoccupancy_status == OPEN (ERR_REOCCUPANCY_BLOCKED)"]
        side_effects:
          - "returned_at := now"
          - "relocation unit (relocation.unit_id) transitions OCCUPIED -> CLEANING"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: notification-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /abatement/notifications"
    occ_field: "expected_project_version"
    description: |
      Creating a RegulatoryNotification against a Project whose version has
      advanced since the client last observed it is rejected. Filing a new
      notification legitimately supersedes the previously filed one, so a
      client acting on a stale project view would silently supersede a
      notification it never saw; the OCC check on Project.version rejects
      that stale write.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: containment-revise-stale-containment
    parent_entity: Containment
    write_endpoint: "POST /abatement/containments/{id}/revise"
    occ_field: "expected_containment_version"
    description: |
      Revising a Containment whose version has advanced since the client last
      observed it is rejected. A revise in DESIGNED state legitimately
      recomputes machines_required, so a stale client would silently overwrite
      another revision's design inputs; the OCC check on Containment.version
      rejects that stale write.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: survey_acm_quantities
    trigger: "on Sample create, on Sample result recording (PENDING -> REPORTED)"
    algorithm: aggregation
    formula: |
      provisional = sum(quantity_sq_ft for samples of the survey where lab_result IN {PENDING, POSITIVE})
      final       = sum(quantity_sq_ft for samples of the survey where lab_result == POSITIVE)
      friable_final = sum(quantity_sq_ft for samples where lab_result == POSITIVE AND friable == true)
    input_set: "all Sample rows of the survey, any status; filter applied on lab_result as above"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "planning/notification context; PENDING samples treated as assumed-positive"
        difference: "counts lab_result IN {PENDING, POSITIVE}; diverges from final whenever any sample is still PENDING"
      - name: final
        when: "regulatory/closeout context"
        difference: "counts lab_result == POSITIVE only"

  - name: negative_air_machine_count
    trigger: "on Containment create and on Containment revise"
    algorithm: aggregation
    formula: |
      ACH = 4 if containment_class == FULL; 6 if containment_class == MINI_ENCLOSURE; 0 if GLOVE_BAG
      air_changes_per_hour := ACH
      if containment_class == GLOVE_BAG:
          machines_required = 0
      else:
          machines_required = max(1, ceil(work_area_volume_cuft * ACH / (MACHINE_CFM * 60)))
    input_set: "the Containment's own work_area_volume_cuft and containment_class"
    constants:
      MACHINE_CFM: 2000
      ACH_FULL: 4
      ACH_MINI_ENCLOSURE: 6
    precision: "integer result; ceil applied before max"
    variants: []

  - name: manifest_net_weight
    trigger: "on WasteManifest create"
    algorithm: aggregation
    formula: |
      net_weight_lbs = gross_weight_lbs - bags_count * BAG_TARE_LBS
      if net_weight_lbs <= 0: reject with ERR_MANIFEST_WEIGHT_INVALID
      net_tons = net_weight_lbs / 2000
    input_set: "the manifest's own gross_weight_lbs and bags_count"
    constants:
      BAG_TARE_LBS: 2
    precision: "net_weight_lbs 2 decimal places; net_tons 4 decimal places, round_half_up"
    variants: []

  - name: manifest_disposal_fee
    trigger: "on WasteManifest seal (DRAFT -> SEALED); value frozen on the manifest thereafter"
    algorithm: tiered_pricing
    formula: |
      tier rate selected by THIS manifest's net_tons:
        rate = TIER1_CENTS_PER_TON if net_tons <= TIER1_MAX_TONS else TIER2_CENTS_PER_TON
      fee_cents = round_half_up(net_tons * rate)   # integer cents
      PINNED ROUNDING ORDER: round each manifest's fee individually at seal time;
      Project.final_disposal_cost_cents = sum of already-rounded fee_cents over
      manifests with status == CONFIRMED. Summing unrounded fees and rounding once
      at the project level is FORBIDDEN (produces different cents).
    input_set: "the manifest being sealed; project total sums manifests with status == CONFIRMED only"
    constants:
      TIER1_MAX_TONS: 10
      TIER1_CENTS_PER_TON: 15000
      TIER2_CENTS_PER_TON: 12500
    precision: "0 decimal places (whole cents), round_half_up per manifest"
    variants: []

  - name: disposal_cost
    trigger: "estimated variant: on Survey finalize; final variant: on manifest CONFIRMED/REJECTED/VOIDED recompute"
    algorithm: tiered_pricing
    formula: |
      estimated variant:
        tons_est = total_acm_sq_ft * EST_LBS_PER_SQFT / 2000
        rate = TIER1_CENTS_PER_TON if tons_est <= TIER1_MAX_TONS else TIER2_CENTS_PER_TON
        estimated_disposal_cost_cents = round_half_up(tons_est * rate)
      final variant:
        final_disposal_cost_cents = sum(fee_cents for manifests with status == CONFIRMED)
    input_set: "estimated: the FINALIZED survey's acm_sq_ft_final via Project.total_acm_sq_ft; final: manifests with status == CONFIRMED only (DRAFT, SEALED, IN_TRANSIT, DELIVERED, REJECTED, VOIDED excluded)"
    constants:
      EST_LBS_PER_SQFT: 1.5
      TIER1_MAX_TONS: 10
      TIER1_CENTS_PER_TON: 15000
      TIER2_CENTS_PER_TON: 12500
    precision: "0 decimal places (whole cents), round_half_up"
    variants:
      - name: estimated
        when: "before any waste is manifested; survey-derived"
        difference: "based on EST_LBS_PER_SQFT density assumption; diverges from final whenever actual manifested weight differs from the density assumption"
      - name: final
        when: "as manifests are confirmed"
        difference: "sum of per-manifest frozen fee_cents"

  - name: project_cost_rollup
    trigger: "on manifest CONFIRMED/VOIDED recompute and whenever base or disposal figures change"
    algorithm: aggregation
    formula: |
      PINNED EVALUATION ORDER (circular-looking dependency resolved):
        1. subtotal = base_abatement_cost_cents + final_disposal_cost_cents
        2. insurance_surcharge_cents = round_half_up(subtotal * SURCHARGE_RATE)
        3. total_project_cost_cents = subtotal + insurance_surcharge_cents
      The surcharge is computed on the pre-surcharge subtotal ONLY; no iteration.
    input_set: "the Project's own base_abatement_cost_cents and final_disposal_cost_cents"
    constants:
      SURCHARGE_RATE: 0.08
    precision: "0 decimal places (whole cents), round_half_up"
    variants: []

  - name: waiting_period_window
    trigger: "on RegulatoryNotification create"
    algorithm: threshold
    formula: |
      waiting_days = 3 if notification_type == EMERGENCY else 10
      earliest_start_at = filed_at + waiting_days calendar days (exact timestamp arithmetic, 86400s per day)
      start-abatement permitted iff now >= earliest_start_at (boundary: equality is ALLOWED)
    input_set: "the notification being created"
    constants:
      WAIT_STANDARD_DAYS: 10
      WAIT_EMERGENCY_DAYS: 3
    precision: "timestamp to the second"
    variants: []

  - name: clearance_threshold_outcome
    trigger: "on AirTest result recording when phase == CLEARANCE"
    algorithm: threshold
    formula: |
      outcome = PASS iff result_f_cc < CLEARANCE_PASS_F_CC else FAIL   (boundary: exactly 0.010 is FAIL)
      outcome = NA for phase IN {BASELINE, DAILY}
    input_set: "the AirTest being reported"
    constants:
      CLEARANCE_PASS_F_CC: 0.010
    precision: "result compared at 3 decimal places"
    variants: []

  - name: clearance_readiness
    trigger: "on CLEARANCE AirTest result, on containment verify, on reclean cascade"
    algorithm: aggregation
    formula: |
      Let V = containment.last_verified_at of the project's containment (null if never verified).
      passes = count of AirTests of the project with phase == CLEARANCE, status == REPORTED,
               outcome == PASS, and (V is null ? true : collected_at > V)
      fails  = count of same with outcome == FAIL and (V is null ? true : collected_at > V)
      reoccupancy_status = OPEN iff fails == 0 AND passes >= MIN_CLEARANCE_PASS_COUNT else BLOCKED
    input_set: "AirTests of the project with phase == CLEARANCE and status == REPORTED; window boundary: collected_at strictly greater than containment.last_verified_at (collected AT the same instant as verification does NOT count)"
    constants:
      MIN_CLEARANCE_PASS_COUNT: 2
    precision: "integer counts"
    variants: []

  - name: worker_assigned_hours
    trigger: "on CrewAssignment create, cancel, suspend, restore, complete"
    algorithm: aggregation
    formula: |
      assigned_scheduled_hours = sum((end_at - start_at) in hours for assignments of the worker
                                 where status == SCHEDULED)
      SUSPENDED, COMPLETED, CANCELLED are excluded.
    input_set: "CrewAssignments of the worker with status == SCHEDULED only"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: facility_monthly_tons
    trigger: "on manifest deliver, reject, and on facility read"
    algorithm: aggregation
    formula: |
      delivered_tons_current_month = sum(net_tons for manifests with facility_id == facility.id,
          status IN {DELIVERED, CONFIRMED},
          and delivered_at within [first instant of the current UTC calendar month (inclusive),
          first instant of the next UTC calendar month (exclusive)])
      REJECTED, IN_TRANSIT, SEALED, DRAFT, VOIDED are excluded.
    input_set: "WasteManifests of the facility filtered by status IN {DELIVERED, CONFIRMED} and the current-UTC-month window [month_start, next_month_start)"
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role permitted for this endpoint per §1.5 roles; for entity_backed ownership, FacilityOperator X-User-ID must equal the target facility id (or manifest.facility_id)", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 2, category: auth, check: "FacilityOperator acting on a manifest whose facility_id != X-User-ID", error_id: ERR_FACILITY_MISMATCH, http_status: 403, applies_to: ["POST /abatement/manifests/{id}/deliver", "POST /abatement/manifests/{id}/confirm", "POST /abatement/manifests/{id}/reject"] }
  - { priority: 3, category: existence, check: "required fields present, JSON types correct, enum members valid, numeric ranges sane", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "path and body referenced resources exist, validated left-to-right (project_id, survey_id, worker_id, unit_id, facility_id, path ids)", error_id: ERR_PROJECT_NOT_FOUND, http_status: 404, applies_to: "all endpoints with resource references; use the entity-specific error id (ERR_SURVEY_NOT_FOUND, ERR_SAMPLE_NOT_FOUND, ERR_WORKER_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_NOTIFICATION_NOT_FOUND, ERR_CONTAINMENT_NOT_FOUND, ERR_AIR_TEST_NOT_FOUND, ERR_MANIFEST_NOT_FOUND, ERR_FACILITY_NOT_FOUND, ERR_UNIT_NOT_FOUND, ERR_RELOCATION_NOT_FOUND)" }
  - { priority: 5, category: state, check: "OCC: expected_<parent>_version equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /abatement/notifications", "POST /abatement/containments/{id}/revise"] }
  - { priority: 6, category: state, check: "state-machine from-state matches (invalid transition, terminal lockdown); cross-entity status gates: survey IN_LAB for sample results, project status windows for assignment/manifest/air-test creation, containment VERIFIED for start-abatement", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: business_safety, check: "worker fitness: worker.status == ACTIVE and all three expiry fields strictly > assignment start_at (expiry exactly == start_at is unfit)", error_id: ERR_WORKER_NOT_FIT, http_status: 422, applies_to: ["POST /abatement/assignments"] }
  - { priority: 7, category: business_safety, check: "role_on_site == SUPERVISOR requires worker.certification_level == SUPERVISOR", error_id: ERR_CERTIFICATION_MISMATCH, http_status: 422, applies_to: ["POST /abatement/assignments"] }
  - { priority: 7, category: business_safety, check: "containment verification pressure_reading_inwg <= -0.020 (equality passes)", error_id: ERR_PRESSURE_INSUFFICIENT, http_status: 422, applies_to: ["POST /abatement/containments/{id}/verify"] }
  - { priority: 7, category: business_safety, check: "segregation of duties: CLEARANCE result recorder != containment.verified_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 409, applies_to: ["POST /abatement/air-tests/{id}/result"] }
  - { priority: 7, category: business_safety, check: "re-occupancy gate: project.reoccupancy_status == OPEN for relocation return and project close", error_id: ERR_REOCCUPANCY_BLOCKED, http_status: 409, applies_to: ["POST /abatement/relocations/{id}/return", "POST /abatement/projects/{id}/close"] }
  - { priority: 8, category: business_temporal, check: "latest notification (filed_at DESC, tie created_at DESC) status == ACKNOWLEDGED", error_id: ERR_NOTIFICATION_NOT_ACKNOWLEDGED, http_status: 409, applies_to: ["POST /abatement/projects/{id}/start-abatement"] }
  - { priority: 8, category: business_temporal, check: "now >= latest notification's earliest_start_at (equality allowed)", error_id: ERR_WAITING_PERIOD_NOT_ELAPSED, http_status: 409, applies_to: ["POST /abatement/projects/{id}/start-abatement"] }
  - { priority: 8, category: business_temporal, check: "assignment end_at strictly > start_at", error_id: ERR_INVALID_WINDOW, http_status: 422, applies_to: ["POST /abatement/assignments"] }
  - { priority: 8, category: business_temporal, check: "supervisor coverage: exists CrewAssignment role_on_site == SUPERVISOR, status == SCHEDULED, start_at <= now < end_at", error_id: ERR_SUPERVISOR_COVERAGE_REQUIRED, http_status: 409, applies_to: ["POST /abatement/projects/{id}/start-abatement", "POST /abatement/projects/{id}/resume"] }
  - { priority: 9, category: business_referential, check: "facility status == APPROVED at delivery", error_id: ERR_FACILITY_NOT_APPROVED, http_status: 409, applies_to: ["POST /abatement/manifests/{id}/deliver"] }
  - { priority: 9, category: business_referential, check: "facility accepts project hazard class (MIXED requires both ASBESTOS and LEAD in accepted_hazards)", error_id: ERR_FACILITY_HAZARD_MISMATCH, http_status: 422, applies_to: ["POST /abatement/manifests/{id}/deliver"] }
  - { priority: 10, category: business_constraint, check: "at most one Survey per project", error_id: ERR_SURVEY_ALREADY_EXISTS, http_status: 409, applies_to: ["POST /abatement/surveys"] }
  - { priority: 10, category: business_constraint, check: "at most one Containment per project", error_id: ERR_CONTAINMENT_ALREADY_EXISTS, http_status: 409, applies_to: ["POST /abatement/containments"] }
  - { priority: 10, category: business_constraint, check: "survey finalize requires all samples REPORTED", error_id: ERR_SAMPLES_STILL_PENDING, http_status: 409, applies_to: ["POST /abatement/surveys/{id}/finalize"] }
  - { priority: 10, category: business_constraint, check: "worker assignment overlap: reject if any existing SCHEDULED assignment for the worker has start_at < new.end_at AND new.start_at < existing.end_at (half-open; back-to-back allowed)", error_id: ERR_ASSIGNMENT_OVERLAP, http_status: 409, applies_to: ["POST /abatement/assignments"] }
  - { priority: 10, category: business_constraint, check: "relocation unit availability: unit.status == AVAILABLE, OR (unit.status == CLEANING AND move_out_at >= cleaning_until); also no other RelocationRecord for the unit with status IN {HOUSED, EXTENDED}", error_id: ERR_UNIT_NOT_AVAILABLE, http_status: 409, applies_to: ["POST /abatement/relocations"] }
  - { priority: 10, category: business_constraint, check: "relocation persons <= unit.capacity_persons", error_id: ERR_UNIT_CAPACITY_EXCEEDED, http_status: 422, applies_to: ["POST /abatement/relocations"] }
  - { priority: 10, category: business_constraint, check: "complete-work requires no DRAFT manifests; close requires all manifests IN {CONFIRMED, VOIDED}", error_id: ERR_MANIFESTS_OUTSTANDING, http_status: 409, applies_to: ["POST /abatement/projects/{id}/complete-work", "POST /abatement/projects/{id}/close"] }
  - { priority: 11, category: business_fiscal, check: "manifest net weight positive: gross_weight_lbs - bags_count * 2 > 0", error_id: ERR_MANIFEST_WEIGHT_INVALID, http_status: 422, applies_to: ["POST /abatement/manifests"] }
  - { priority: 11, category: business_fiscal, check: "facility_monthly_tons + manifest.net_tons <= facility.monthly_capacity_tons (equality allowed)", error_id: ERR_FACILITY_CAPACITY_EXCEEDED, http_status: 422, applies_to: ["POST /abatement/manifests/{id}/deliver"] }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's logical clock (test-driving endpoint). Server startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock. Side effects: sweep — Worker lapse evaluation (ACTIVE -> LAPSED when now >= min of three expiry fields) with its cascade; CrewAssignment completion (SCHEDULED/SUSPENDED with end_at <= now -> COMPLETED); RelocationUnit CLEANING -> AVAILABLE when now >= cleaning_until.", roles: [ContractorAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["worker lapse cascade", "assignment completion sweep", "unit cleaning sweep"] }

  - { method: POST, path: "/abatement/projects", description: "Create an abatement project (initial status DRAFT, reoccupancy_status BLOCKED)", roles: [ContractorAdmin], code: 201, input: [name, site_address, work_type, hazard_class, planned_start, base_abatement_cost_cents], output: Project, side_effects: [] }
  - { method: GET, path: "/abatement/projects/{id}", description: "Fetch a project with computed fields", roles: [ContractorAdmin, Supervisor, IndustrialHygienist, RegulatorClerk, FacilityOperator], code: 200, input: [], output: Project, side_effects: [] }
  - { method: POST, path: "/abatement/projects/{id}/start-abatement", description: "ASSESSED -> IN_PROGRESS; enforces notification ack + waiting period + containment VERIFIED + supervisor coverage", roles: [ContractorAdmin], code: 200, input: [], output: Project, side_effects: ["increments Project.version by 1"] }
  - { method: POST, path: "/abatement/projects/{id}/suspend", description: "IN_PROGRESS -> SUSPENDED (manual stop-work order)", roles: [ContractorAdmin, Supervisor], code: 200, input: [], output: Project, side_effects: ["increments Project.version by 1"] }
  - { method: POST, path: "/abatement/projects/{id}/resume", description: "SUSPENDED -> IN_PROGRESS; requires supervisor coverage", roles: [ContractorAdmin, Supervisor], code: 200, input: [], output: Project, side_effects: ["increments Project.version by 1"] }
  - { method: POST, path: "/abatement/projects/{id}/complete-work", description: "IN_PROGRESS -> AWAITING_CLEARANCE; requires no DRAFT manifests", roles: [Supervisor], code: 200, input: [], output: Project, side_effects: ["increments Project.version by 1"] }
  - { method: POST, path: "/abatement/projects/{id}/close", description: "AWAITING_CLEARANCE -> CLOSED; requires reoccupancy OPEN, all manifests IN {CONFIRMED, VOIDED}, all relocations RETURNED", roles: [ContractorAdmin], code: 200, input: [], output: Project, side_effects: ["increments Project.version by 1"] }

  - { method: POST, path: "/abatement/surveys", description: "Create the survey for a project (project must be DRAFT; one per project)", roles: [ContractorAdmin], code: 201, input: [project_id, surveyor_name, survey_date], output: Survey, side_effects: [] }
  - { method: GET, path: "/abatement/surveys/{id}", description: "Fetch a survey with quantity aggregates", roles: [ContractorAdmin, Supervisor, IndustrialHygienist, RegulatorClerk, FacilityOperator], code: 200, input: [], output: Survey, side_effects: [] }
  - { method: GET, path: "/abatement/projects/{id}/surveys", description: "List surveys of a project (0 or 1)", roles: [ContractorAdmin, Supervisor, IndustrialHygienist, RegulatorClerk, FacilityOperator], code: 200, input: ["limit?", "offset?"], output: "Survey[]", side_effects: [] }
  - { method: POST, path: "/abatement/surveys/{id}/submit", description: "DRAFT -> IN_LAB; requires >= 1 sample", roles: [ContractorAdmin], code: 200, input: [], output: Survey, side_effects: [] }
  - { method: POST, path: "/abatement/surveys/{id}/finalize", description: "IN_LAB -> FINALIZED; requires all samples REPORTED; drives Project DRAFT -> ASSESSED", roles: [ContractorAdmin], code: 200, input: [], output: Survey, side_effects: ["Project DRAFT -> ASSESSED with recomputed total_acm_sq_ft and estimated_disposal_cost_cents"] }

  - { method: POST, path: "/abatement/samples", description: "Add a bulk sample to a DRAFT survey (survey must be DRAFT, else ERR_INVALID_STATE)", roles: [ContractorAdmin], code: 201, input: [survey_id, material, location_desc, quantity_sq_ft, friable, "lead_ppm?"], output: Sample, side_effects: ["survey quantity aggregates recomputed"] }
  - { method: GET, path: "/abatement/surveys/{id}/samples", description: "List samples of a survey", roles: [ContractorAdmin, Supervisor, IndustrialHygienist, RegulatorClerk, FacilityOperator], code: 200, input: ["limit?", "offset?"], output: "Sample[]", side_effects: [] }
  - { method: POST, path: "/abatement/samples/{id}/result", description: "PENDING -> REPORTED; records lab_result (POSITIVE requires asbestos_pct)", roles: [IndustrialHygienist], code: 200, input: [lab_result, "asbestos_pct?", "lead_ppm?"], output: Sample, side_effects: ["survey quantity aggregates recomputed"] }

  - { method: POST, path: "/abatement/workers", description: "Register a worker with certification/medical/respirator expiries", roles: [ContractorAdmin], code: 201, input: [full_name, certification_level, cert_expires_at, medical_clearance_expires_at, respirator_fit_expires_at], output: Worker, side_effects: [] }
  - { method: GET, path: "/abatement/workers/{id}", description: "Fetch a worker with computed assigned_scheduled_hours", roles: [ContractorAdmin, Supervisor, IndustrialHygienist, RegulatorClerk, FacilityOperator], code: 200, input: [], output: Worker, side_effects: [] }
  - { method: POST, path: "/abatement/workers/{id}/recertify", description: "Update one or more expiry fields; LAPSED -> ACTIVE if all three strictly > now; restores SUSPENDED assignments with end_at > now to SCHEDULED", roles: [ContractorAdmin], code: 200, input: ["cert_expires_at?", "medical_clearance_expires_at?", "respirator_fit_expires_at?"], output: Worker, side_effects: ["assignment restore cascade", "worker_assigned_hours recompute"] }

  - { method: POST, path: "/abatement/assignments", description: "Create a crew assignment (half-open window; overlap/fitness/cert-level/project-state validated)", roles: [ContractorAdmin, Supervisor], code: 201, input: [project_id, worker_id, role_on_site, start_at, end_at], output: CrewAssignment, side_effects: ["worker_assigned_hours recompute"] }
  - { method: GET, path: "/abatement/projects/{id}/assignments", description: "List assignments of a project", roles: [ContractorAdmin, Supervisor, IndustrialHygienist, RegulatorClerk, FacilityOperator], code: 200, input: ["limit?", "offset?"], output: "CrewAssignment[]", side_effects: [] }
  - { method: GET, path: "/abatement/workers/{id}/assignments", description: "List assignments of a worker", roles: [ContractorAdmin, Supervisor, IndustrialHygienist, RegulatorClerk, FacilityOperator], code: 200, input: ["limit?", "offset?"], output: "CrewAssignment[]", side_effects: [] }
  - { method: POST, path: "/abatement/assignments/{id}/cancel", description: "SCHEDULED -> CANCELLED", roles: [ContractorAdmin, Supervisor], code: 200, input: [], output: CrewAssignment, side_effects: ["worker_assigned_hours recompute"] }

  - { method: POST, path: "/abatement/notifications", description: "File a regulatory notification (project must be ASSESSED); supersedes any existing FILED/ACKNOWLEDGED notification of the project; OCC on expected_project_version", roles: [ContractorAdmin], code: 201, input: [project_id, notification_type, declared_acm_sq_ft, expected_project_version], output: RegulatoryNotification, side_effects: ["prior FILED/ACKNOWLEDGED notification -> SUPERSEDED", "increments Project.version by 1"] }
  - { method: GET, path: "/abatement/projects/{id}/notifications", description: "List notifications of a project, ordered by filed_at DESC with tie-break created_at DESC", roles: [ContractorAdmin, Supervisor, IndustrialHygienist, RegulatorClerk, FacilityOperator], code: 200, input: ["limit?", "offset?"], output: "RegulatoryNotification[]", side_effects: [] }
  - { method: POST, path: "/abatement/notifications/{id}/acknowledge", description: "FILED -> ACKNOWLEDGED", roles: [RegulatorClerk], code: 200, input: [], output: RegulatoryNotification, side_effects: ["acknowledged_at := now"] }

  - { method: POST, path: "/abatement/containments", description: "Create the containment design for a project (project must be ASSESSED; one per project)", roles: [Supervisor], code: 201, input: [project_id, work_area_volume_cuft, containment_class], output: Containment, side_effects: ["negative_air_machine_count computed"] }
  - { method: GET, path: "/abatement/projects/{id}/containments", description: "List containments of a project (0 or 1)", roles: [ContractorAdmin, Supervisor, IndustrialHygienist, RegulatorClerk, FacilityOperator], code: 200, input: ["limit?", "offset?"], output: "Containment[]", side_effects: [] }
  - { method: POST, path: "/abatement/containments/{id}/install", description: "DESIGNED -> INSTALLED", roles: [Supervisor], code: 200, input: [], output: Containment, side_effects: [] }
  - { method: POST, path: "/abatement/containments/{id}/verify", description: "INSTALLED|RECLEAN_REQUIRED -> VERIFIED with negative-pressure reading <= -0.020 inwg; re-verify returns project RECLEANING -> AWAITING_CLEARANCE", roles: [Supervisor], code: 200, input: [pressure_reading_inwg], output: Containment, side_effects: ["verified_by_user_id := X-User-ID", "last_verified_at := now", "if from RECLEAN_REQUIRED: project RECLEANING -> AWAITING_CLEARANCE"] }
  - { method: POST, path: "/abatement/containments/{id}/revise", description: "DESIGNED -> DESIGNED design revision; recomputes machines_required; OCC on expected_containment_version", roles: [Supervisor], code: 200, input: ["work_area_volume_cuft?", "containment_class?", expected_containment_version], output: Containment, side_effects: ["negative_air_machine_count recomputed", "increments Containment.version by 1"] }

  - { method: POST, path: "/abatement/air-tests", description: "Collect an air test. Phase gates: BASELINE requires project ASSESSED; DAILY requires IN_PROGRESS/SUSPENDED/RECLEANING; CLEARANCE requires AWAITING_CLEARANCE and role IndustrialHygienist (Supervisor creating CLEARANCE -> ERR_UNAUTHORIZED_ROLE)", roles: [Supervisor, IndustrialHygienist], code: 201, input: [project_id, phase, collected_at], output: AirTest, side_effects: [] }
  - { method: GET, path: "/abatement/projects/{id}/air-tests", description: "List air tests of a project (optional phase filter)", roles: [ContractorAdmin, Supervisor, IndustrialHygienist, RegulatorClerk, FacilityOperator], code: 200, input: ["phase?", "limit?", "offset?"], output: "AirTest[]", side_effects: [] }
  - { method: POST, path: "/abatement/air-tests/{id}/result", description: "COLLECTED -> REPORTED; CLEARANCE computes PASS/FAIL and fires the reclean cascade on FAIL; segregation of duties enforced", roles: [IndustrialHygienist], code: 200, input: [result_f_cc], output: AirTest, side_effects: ["outcome computed", "on CLEARANCE FAIL: containment -> RECLEAN_REQUIRED -> project RECLEANING -> relocations HOUSED -> EXTENDED", "on CLEARANCE PASS: reoccupancy_status recompute"] }

  - { method: POST, path: "/abatement/manifests", description: "Create a hazardous-waste manifest (project must be IN_PROGRESS or RECLEANING); net weight validated", roles: [Supervisor], code: 201, input: [project_id, facility_id, bags_count, gross_weight_lbs], output: WasteManifest, side_effects: ["manifest_net_weight computed"] }
  - { method: GET, path: "/abatement/projects/{id}/manifests", description: "List manifests of a project (optional status filter)", roles: [ContractorAdmin, Supervisor, IndustrialHygienist, RegulatorClerk, FacilityOperator], code: 200, input: ["status?", "limit?", "offset?"], output: "WasteManifest[]", side_effects: [] }
  - { method: GET, path: "/abatement/facilities/{id}/manifests", description: "List manifests addressed to a facility", roles: [ContractorAdmin, Supervisor, IndustrialHygienist, RegulatorClerk, FacilityOperator], code: 200, input: ["status?", "limit?", "offset?"], output: "WasteManifest[]", side_effects: [] }
  - { method: POST, path: "/abatement/manifests/{id}/seal", description: "DRAFT -> SEALED; fee_cents computed and frozen", roles: [Supervisor], code: 200, input: [], output: WasteManifest, side_effects: ["manifest_disposal_fee computed", "project manifested_weight_lbs recompute"] }
  - { method: POST, path: "/abatement/manifests/{id}/ship", description: "SEALED -> IN_TRANSIT", roles: [Supervisor], code: 200, input: [], output: WasteManifest, side_effects: [] }
  - { method: POST, path: "/abatement/manifests/{id}/deliver", description: "IN_TRANSIT -> DELIVERED; facility ownership/approval/hazard/monthly-capacity enforced", roles: [FacilityOperator], code: 200, input: [], output: WasteManifest, side_effects: ["delivered_at := now", "facility delivered_tons_current_month recompute"] }
  - { method: POST, path: "/abatement/manifests/{id}/confirm", description: "DELIVERED -> CONFIRMED (facility confirms disposal)", roles: [FacilityOperator], code: 200, input: [], output: WasteManifest, side_effects: ["project manifested_weight_lbs / final_disposal_cost_cents / project_cost_rollup recompute"] }
  - { method: POST, path: "/abatement/manifests/{id}/reject", description: "DELIVERED -> REJECTED with reason", roles: [FacilityOperator], code: 200, input: [reason], output: WasteManifest, side_effects: ["facility delivered_tons_current_month recompute (REJECTED excluded)"] }
  - { method: POST, path: "/abatement/manifests/{id}/void", description: "DRAFT|REJECTED -> VOIDED", roles: [Supervisor, ContractorAdmin], code: 200, input: [], output: WasteManifest, side_effects: ["project manifested_weight_lbs recompute"] }

  - { method: POST, path: "/abatement/facilities", description: "Register an approved disposal facility", roles: [ContractorAdmin], code: 201, input: [name, epa_id, accepted_hazards, monthly_capacity_tons], output: DisposalFacility, side_effects: [] }
  - { method: GET, path: "/abatement/facilities/{id}", description: "Fetch facility with delivered_tons_current_month", roles: [ContractorAdmin, Supervisor, IndustrialHygienist, RegulatorClerk, FacilityOperator], code: 200, input: [], output: DisposalFacility, side_effects: [] }
  - { method: POST, path: "/abatement/facilities/{id}/suspend", description: "APPROVED -> SUSPENDED; rejects all IN_TRANSIT manifests addressed to it", roles: [ContractorAdmin], code: 200, input: [], output: DisposalFacility, side_effects: ["IN_TRANSIT manifests -> REJECTED", "project manifested_weight_lbs recompute per affected manifest"] }

  - { method: POST, path: "/abatement/relocation-units", description: "Register a temporary housing unit", roles: [ContractorAdmin], code: 201, input: [unit_label, capacity_persons], output: RelocationUnit, side_effects: [] }
  - { method: GET, path: "/abatement/relocation-units/{id}", description: "Fetch a relocation unit", roles: [ContractorAdmin, Supervisor, IndustrialHygienist, RegulatorClerk, FacilityOperator], code: 200, input: [], output: RelocationUnit, side_effects: [] }
  - { method: POST, path: "/abatement/relocations", description: "Relocate a household (project ASSESSED or IN_PROGRESS); unit availability with 1-day cleaning buffer and capacity enforced", roles: [ContractorAdmin], code: 201, input: [project_id, unit_id, household_name, persons, move_out_at], output: RelocationRecord, side_effects: ["unit AVAILABLE -> OCCUPIED"] }
  - { method: GET, path: "/abatement/projects/{id}/relocations", description: "List relocation records of a project", roles: [ContractorAdmin, Supervisor, IndustrialHygienist, RegulatorClerk, FacilityOperator], code: 200, input: ["limit?", "offset?"], output: "RelocationRecord[]", side_effects: [] }
  - { method: GET, path: "/abatement/relocation-units/{id}/relocations", description: "List relocation records of a unit", roles: [ContractorAdmin, Supervisor, IndustrialHygienist, RegulatorClerk, FacilityOperator], code: 200, input: ["limit?", "offset?"], output: "RelocationRecord[]", side_effects: [] }
  - { method: POST, path: "/abatement/relocations/{id}/return", description: "HOUSED|EXTENDED -> RETURNED; requires project reoccupancy_status == OPEN; unit -> CLEANING", roles: [ContractorAdmin], code: 200, input: [], output: RelocationRecord, side_effects: ["returned_at := now", "unit OCCUPIED -> CLEANING with cleaning_until := returned_at + 1 day"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for the endpoint (including Supervisor attempting to create a CLEARANCE-phase air test)" }
  - { id: ERR_FACILITY_MISMATCH, http: 403, condition: "FacilityOperator X-User-ID does not equal the manifest's facility_id" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, wrong type, invalid enum member, out-of-range value, POSITIVE result without asbestos_pct, survey submit with zero samples" }
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "Referenced project does not exist" }
  - { id: ERR_SURVEY_NOT_FOUND, http: 404, condition: "Referenced survey does not exist" }
  - { id: ERR_SAMPLE_NOT_FOUND, http: 404, condition: "Referenced sample does not exist" }
  - { id: ERR_WORKER_NOT_FOUND, http: 404, condition: "Referenced worker does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "Referenced assignment does not exist" }
  - { id: ERR_NOTIFICATION_NOT_FOUND, http: 404, condition: "Referenced notification does not exist" }
  - { id: ERR_CONTAINMENT_NOT_FOUND, http: 404, condition: "Referenced containment does not exist" }
  - { id: ERR_AIR_TEST_NOT_FOUND, http: 404, condition: "Referenced air test does not exist" }
  - { id: ERR_MANIFEST_NOT_FOUND, http: 404, condition: "Referenced manifest does not exist" }
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "Referenced facility does not exist" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "Referenced relocation unit does not exist" }
  - { id: ERR_RELOCATION_NOT_FOUND, http: 404, condition: "Referenced relocation record does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State-machine from-state mismatch, terminal lockdown, or cross-entity status gate failure (e.g., containment not VERIFIED at start-abatement, survey not IN_LAB for results, project not IN_PROGRESS/RECLEANING for manifest creation)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_SURVEY_ALREADY_EXISTS, http: 409, condition: "Project already has a survey" }
  - { id: ERR_CONTAINMENT_ALREADY_EXISTS, http: 409, condition: "Project already has a containment" }
  - { id: ERR_SAMPLES_STILL_PENDING, http: 409, condition: "Survey finalize attempted while >= 1 sample is still PENDING" }
  - { id: ERR_NOTIFICATION_NOT_ACKNOWLEDGED, http: 409, condition: "start-abatement with latest notification not ACKNOWLEDGED (or none filed)" }
  - { id: ERR_WAITING_PERIOD_NOT_ELAPSED, http: 409, condition: "now < latest notification's earliest_start_at at start-abatement" }
  - { id: ERR_SUPERVISOR_COVERAGE_REQUIRED, http: 409, condition: "No SCHEDULED SUPERVISOR assignment covers now at start-abatement/resume" }
  - { id: ERR_WORKER_NOT_FIT, http: 422, condition: "Worker LAPSED or any of the three expiry fields <= assignment start_at" }
  - { id: ERR_CERTIFICATION_MISMATCH, http: 422, condition: "role_on_site SUPERVISOR requires certification_level SUPERVISOR" }
  - { id: ERR_ASSIGNMENT_OVERLAP, http: 409, condition: "Half-open overlap with an existing SCHEDULED assignment of the same worker (back-to-back allowed)" }
  - { id: ERR_PRESSURE_INSUFFICIENT, http: 422, condition: "pressure_reading_inwg > -0.020 at containment verify" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "CLEARANCE result recorded by the same X-User-ID that verified the containment" }
  - { id: ERR_REOCCUPANCY_BLOCKED, http: 409, condition: "Relocation return or project close while project.reoccupancy_status == BLOCKED, or close with unreturned relocation records" }
  - { id: ERR_UNIT_NOT_AVAILABLE, http: 409, condition: "Unit OCCUPIED, or CLEANING with move_out_at < cleaning_until, or another HOUSED/EXTENDED record exists for the unit" }
  - { id: ERR_UNIT_CAPACITY_EXCEEDED, http: 422, condition: "persons > unit.capacity_persons" }
  - { id: ERR_FACILITY_NOT_APPROVED, http: 409, condition: "Deliver to a SUSPENDED facility" }
  - { id: ERR_FACILITY_HAZARD_MISMATCH, http: 422, condition: "Facility accepted_hazards does not cover the project's hazard_class" }
  - { id: ERR_FACILITY_CAPACITY_EXCEEDED, http: 422, condition: "delivered_tons_current_month + net_tons > monthly_capacity_tons" }
  - { id: ERR_MANIFEST_WEIGHT_INVALID, http: 422, condition: "net_weight_lbs <= 0 (gross does not exceed bag tare)" }
  - { id: ERR_MANIFESTS_OUTSTANDING, http: 409, condition: "complete-work with a DRAFT manifest present; close with any manifest not IN {CONFIRMED, VOIDED}" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "Assignment end_at <= start_at" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ContractorAdmin
    description: "Abatement contractor's office administrator: projects, workers, filings, facilities, units, relocations, closeout"
    identity: opaque
    exclusive_operations: [create project, create/submit/finalize survey, create samples, create/recertify workers, file notifications, create facilities, suspend facilities, create relocation units, create/return relocations, start-abatement, close project, set logical clock]
    shared_operations: [suspend/resume project, create/cancel crew assignments, void manifests, all GET reads]
  - name: Supervisor
    description: "Certified on-site supervisor (a registered Worker): containment install/verify/revise, crew assignments, manifest seal/ship, daily air monitoring"
    identity: "entity_backed:Worker"
    exclusive_operations: [create/install/verify/revise containment, complete-work, create/seal/ship manifests]
    shared_operations: [suspend/resume project, create/cancel crew assignments, void manifests, create BASELINE/DAILY air tests, all GET reads]
  - name: IndustrialHygienist
    description: "Independent third-party hygienist/lab: reports sample results and air-test results; the only role that may create or report CLEARANCE tests"
    identity: opaque
    exclusive_operations: [record sample results, create CLEARANCE air tests, record air-test results]
    shared_operations: [all GET reads]
  - name: RegulatorClerk
    description: "Regulator staff: acknowledges filed notifications"
    identity: opaque
    exclusive_operations: [acknowledge notifications]
    shared_operations: [all GET reads]
  - name: FacilityOperator
    description: "Disposal facility operator: records delivery, confirms or rejects manifests addressed to their facility (X-User-ID == DisposalFacility.id)"
    identity: "entity_backed:DisposalFacility"
    exclusive_operations: [deliver/confirm/reject manifests]
    shared_operations: [all GET reads]
