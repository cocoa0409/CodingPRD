            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/contractors", payload: { legal_name: "Exp Co", license_number: "LIC-EX", license_expiry: "2035-01-01", insurance_expiry: "2035-01-01", territory_codes: ["T1"] }, as: ProgramAdmin, captures: { cex_id: $.data.id } }
