        claim_type: derived_field_reconciliation
        grounds: ["endpoints.POST_/collateral-assets/{id}/prices", calculations.allocation_collateral_valuation, entities.PledgeAgreement.fields.total_collateral_value_cents, entities.Depository.fields.total_pledged_collateral_value_cents]
        distinguishing_aspect: "One price post must re-derive a five-level chain in a single response — asset market_value and collateral_value, the ACTIVE allocation's value, the agreement total, the depository total and finally the account's coverage_ratio_bps — with the account moving from 4977 bps to exactly 4480 bps while allocated PAR never changes."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; APPROVED tri-party custodian (concentration 10000); APPROVED depository; funded DEDICATED account (required 78,750,000); EXECUTED agreement with one ACTIVE allocation of 40,000,000 par US_TREASURY priced at 10000 bps."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /custodians"
              payload: { name: "First Custody Bank", custodian_type: "TRUST_BANK", tri_party_capable: true, concentration_limit_bps: 10000 }
              as: StateRegulator
              captures: { cust_id: $.data.id }
            - call: "POST /custodians/${cust_id}/approve"
              payload: {}
              as: StateRegulator
            - call: "POST /public-units"
              payload: { name: "Ridge County", unit_type: "COUNTY", jurisdiction_state: "OH", statutory_max_deposit_cents: 100000000000 }
              as: StateRegulator
              captures: { unit_id: $.data.id }
            - call: "POST /depositories"
              payload: { name: "Ridge National Bank", charter_type: "STATE_CHARTERED", home_state: "OH", capital_ratio_bps: 1200 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { dep_id: $.data.id }
            - call: "POST /depositories/${dep_id}/qualification-reviews"
              payload: { requested_pledge_capacity_cents: 400000000000 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { qr_id: $.data.id }
            - call: "POST /qualification-reviews/${qr_id}/attest"
              payload: { attestation_note: "Package complete" }
              as: BankComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /qualification-reviews/${qr_id}/begin-review"
              payload: {}
              as: StateRegulator
            - call: "POST /qualification-reviews/${qr_id}/decide"
              payload: { decision: "APPROVE" }
              as: StateRegulator
            - call: "POST /deposit-accounts"
              payload: { depository_id: "${dep_id}", public_unit_id: "${unit_id}", deposit_class: "DEMAND", pledging_mode: "DEDICATED" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { acct_id: $.data.id }
            - call: "POST /deposit-accounts/${acct_id}/deposits"
              payload: { amount_cents: 100000000 }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
            - call: "POST /pledge-agreements"
              payload: { depository_id: "${dep_id}", custodian_id: "${cust_id}", beneficiary_type: "DEPOSIT_ACCOUNT", deposit_account_id: "${acct_id}", agreement_number: "AG-0001", governing_law_state: "OH" }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { ag_id: $.data.id }
            - call: "POST /pledge-agreements/${ag_id}/circulate"
              payload: {}
              as: BankCollateralOfficer
              as_user_id: "officer-1"
            - call: "POST /pledge-agreements/${ag_id}/signatures"
              payload: { party: "DEPOSITORY" }
              as: BankComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /pledge-agreements/${ag_id}/signatures"
              payload: { party: "PUBLIC_UNIT" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
            - call: "POST /pledge-agreements/${ag_id}/signatures"
              payload: { party: "CUSTODIAN" }
              as: Custodian
              as_user_id: "${cust_id}"
              captures: { ag_v: $.data.version }
            - call: "POST /collateral-assets"
              payload: { depository_id: "${dep_id}", custodian_id: "${cust_id}", cusip: "CU-1", asset_type: "US_TREASURY", par_value_cents: 40000000, market_price_bps: 10000 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { asset_id: $.data.id }
            - call: "POST /pledge-allocations"
              payload: { pledge_agreement_id: "${ag_id}", collateral_asset_id: "${asset_id}", allocated_par_cents: 40000000, effective_from: "2026-08-01T00:00:00Z", expected_pledge_agreement_version: "${ag_v}" }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "POST /collateral-assets/${asset_id}/prices"
              payload: { market_price_bps: 9000 }
              as: SystemOperator
              captures: { new_value: $.data.collateral_value_cents }
          assert:
            - "BEFORE: CollateralAsset.${asset_id}.market_value_cents == 40000000 and collateral_value_cents == 39200000; PledgeAllocation.${alloc_id}.allocated_collateral_value_cents == 39200000; DepositAccount.${acct_id}.coverage_ratio_bps == floor(39200000*10000/78750000) == 4977 with collateral_status 'DEFICIENT'"
            - "AFTER (price 9000): CollateralAsset.${asset_id}.market_value_cents == 36000000 == round_half_up(40000000*9000/10000) and collateral_value_cents == 35280000 == round_half_up(36000000*(10000-200)/10000); priced_at == 2026-08-01T00:00:00Z"
            - "PledgeAllocation.${alloc_id}.allocated_par_cents is STILL 40000000 while allocated_collateral_value_cents becomes 35280000 — repricing moves value, never par"
            - "PledgeAgreement.${ag_id}.total_collateral_value_cents == 35280000 and total_pledged_par_cents == 40000000 (unchanged)"
            - "Depository.${dep_id}.total_pledged_collateral_value_cents == 35280000 and total_pledged_par_cents == 40000000"
            - "DepositAccount.${acct_id}.assigned_collateral_value_cents == 35280000 and coverage_ratio_bps == 4480 exactly (78750000 * 0.448 == 35280000), still 'DEFICIENT'"
            - "PublicUnit.${unit_id}.exposure_status == 'WATCH' both before and after — the unit-level rollup is recomputed but the deficiency band did not change"
            - "No margin call was created: repricing does not run mark-to-market; only POST /depositories/{id}/mtm-runs issues MarginCall rows"

      - name: cascading_side_effects_depth_four_chain
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers, state_machines.Depository]
        excluded_because:
          difficulty_instance: depository_suspension_depth4_cascade_to_runoff_forecast
          rationale: "The four-level chain (depository -> accounts -> unit -> forecasts) with its ordering sensitivity and its refusal to touch terminal children is that §1.8 multi_level_cascade instance; its sibling substitution_settlement_depth4_cascade_to_public_unit_watch covers the second chain."
      - name: dual_variant_calculation_both_variants_and_delta
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers, calculations.runoff_collateral_projection.variants]
        excluded_because:
          difficulty_instance: runoff_projection_peak_window_vs_period_end
          rationale: "Both projection variants on one window chain and the exact delta between them are pinned by that §1.8 dual_variant_calc instance."

  - section: consistency_model
    instances:
      - name: immediate_visibility_of_derived_rollups_in_the_deposit_response
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, "endpoints.POST_/deposit-accounts/{id}/deposits", calculations.insured_amount_determination]
        distinguishing_aspect: "The declared consistency model is immediate, so a single deposit's own 200 response already carries the recomputed insurance split, requirement and coverage for the written account, AND every cross-aggregate rollup (sibling account re-derivation, unit totals, depository totals) is readable in the very next call with no settling period or refresh endpoint."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; APPROVED depository (AGGREGATED_BY_UNIT); one COUNTY unit; two DEMAND DEDICATED accounts (group_sequence 1 and 2), the second already funded with 10,000,000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /public-units"
              payload: { name: "Ridge County", unit_type: "COUNTY", jurisdiction_state: "OH", statutory_max_deposit_cents: 100000000000 }
              as: StateRegulator
              captures: { unit_id: $.data.id }
            - call: "POST /depositories"
              payload: { name: "Ridge National Bank", charter_type: "STATE_CHARTERED", home_state: "OH", capital_ratio_bps: 1200 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { dep_id: $.data.id }
            - call: "POST /depositories/${dep_id}/qualification-reviews"
              payload: { requested_pledge_capacity_cents: 400000000000 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { qr_id: $.data.id }
            - call: "POST /qualification-reviews/${qr_id}/attest"
              payload: { attestation_note: "Package complete" }
              as: BankComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /qualification-reviews/${qr_id}/begin-review"
              payload: {}
              as: StateRegulator
            - call: "POST /qualification-reviews/${qr_id}/decide"
              payload: { decision: "APPROVE" }
              as: StateRegulator
            - call: "POST /deposit-accounts"
              payload: { depository_id: "${dep_id}", public_unit_id: "${unit_id}", deposit_class: "DEMAND", pledging_mode: "DEDICATED" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { acct_1: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { depository_id: "${dep_id}", public_unit_id: "${unit_id}", deposit_class: "DEMAND", pledging_mode: "DEDICATED" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { acct_2: $.data.id }
            - call: "POST /deposit-accounts/${acct_2}/deposits"
              payload: { amount_cents: 10000000 }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
          trigger:
            - call: "POST /deposit-accounts/${acct_1}/deposits"
              payload: { amount_cents: 100000000 }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { req_in_response: $.data.required_collateral_cents }
            - call: "GET /deposit-accounts/${acct_2}"
              payload: {}
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { sibling_required: $.data.required_collateral_cents }
            - call: "GET /public-units/${unit_id}"
              payload: {}
              as: StateRegulator
              captures: { unit_uninsured: $.data.total_uninsured_cents }
            - call: "GET /depositories/${dep_id}"
              payload: {}
              as: StateRegulator
              captures: { dep_required: $.data.total_required_collateral_cents }
          assert:
            - "The deposit's OWN 200 response already contains insured_amount_cents 25000000, uninsured_amount_cents 75000000, required_collateral_pct_bps 10500, required_collateral_cents 78750000 and coverage_ratio_bps 0 — no second read is needed to see the derivation"
            - "The immediately following read of the SIBLING account shows required_collateral_cents == 10500000 and insured_amount_cents == 0: the retroactive waterfall re-derivation was committed in the same transaction as the deposit"
            - "PublicUnit.${unit_id}.total_deposit_balance_cents == 110000000 and total_uninsured_cents == 85000000 on the very next read"
            - "Depository.${dep_id}.total_required_collateral_cents == 89250000 on the very next read"
            - "No endpoint had to be polled and no /_ops sweep was needed for any of these values — the only /_ops endpoint in §1.5 sweeps margin-call deadlines, not derived rollups"
            - "Both accounts' versions advanced during the single deposit call (the written one and the re-derived sibling), which is what makes a stale expected_deposit_account_version on the sibling detectable immediately afterwards"
