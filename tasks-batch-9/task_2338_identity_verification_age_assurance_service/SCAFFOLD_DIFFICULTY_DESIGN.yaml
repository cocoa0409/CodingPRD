            - "Policy v1 allows DOCUMENT_SCAN with doc floor 8000, min_assurance_score 60, step_up_max_rounds 2, no age gate; PUBLISHED."
            - "Session subj-r9c has attempt A1 scored 7400 SUSPECT (7 of 8 features, 2 tamper signals) and finalized as REJECTED without a tamper flag, so the session is AWAITING_EVIDENCE and pending_stepup_count is 1."
            - "A first step-up returns the session to IN_PROGRESS with step_up_round 1 and pending_stepup_count 0."
            - "Attempt A2 repeats the same SUSPECT capture and is finalized as REJECTED, so the session is AWAITING_EVIDENCE again and pending_stepup_count is 1."
