# =============================================================================
# SCAFFOLD.yaml — Welding Gas & Supply Branch Operations (task 1659)
# §1.0–§1.7 seed tables. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Welding Gas & Supply Branch Operations (Airgas retail branch): cylinder
  exchange & customer balance, hardgoods retail vs contract pricing,
  rental/demurrage accrual & waiver, route delivery vs will-call, gas mix &
  specialty order, weld-machine rental & repair, safety training &
  certification sales, branch inventory & cylinder float.

domain_name: welding-gas-branch
api_prefix: ""   # flat topology: all resources are top-level collections (e.g. /orders/{id})

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # cylinder float + truck route capacity are finite pools reserved/committed/released
  secondary_archetype: pricing_engine        # retail vs contract tiered pricing, rental rate plans, demurrage
  complexity_layers:
    - derived_field_reconciliation           # Customer balances, route reserved_units, class seats_booked
    - rate_threshold_triggers                # credit limit, free-delivery threshold, demurrage grace days, class capacity
    - optimistic_concurrency                 # OCC on Customer.version (payments) and RentalAgreement.version (waivers)
    - cascading_side_effects                 # fulfill → invoice → exposure → credit hold; payment → invoice → exposure → release
  entity_topology: flat                      # peer entities joined by FK references; no nested URL paths
  state_machine_shape: parallel              # Order carries fulfillment_status × payment_status; other entities add cyclic/branching machines
  relationship_patterns:
    - one_to_many                            # Customer→Order/Invoice/RentalAgreement; TrainingClass→TrainingEnrollment
    - cross_aggregate                        # Order→DeliveryRoute, Order lines→Product, RentalAgreement→CylinderAsset/Machine
    - polymorphic                            # RentalAgreement.item_type selects cylinder_asset_id or machine_id
  role_model: hierarchical_override          # BranchManager superset + waiver/hold/void override power over peer staff roles
  consistency_model: immediate               # every mutation + cascade is atomic within the request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (12 entities, flat topology)
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: account_no, type: string, source: input, description: "Unique branch account number", constraints: "unique across all customers (ERR_DUPLICATE_ACCOUNT)" }
      - { name: name, type: string, source: input, description: "Business or walk-in name" }
      - { name: terms, type: enum, source: input, description: "CASH | NET30", default: CASH }
      - { name: status, type: enum, source: system, description: "ACTIVE | CREDIT_HOLD | SUSPENDED; initial ACTIVE; auto-flips on exposure crossing" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum tolerated exposure for NET30 accounts", default: 0 }
      - { name: price_book_id, type: string, source: input, description: "FK -> PriceBook.id; nullable — set when a CONTRACT book is assigned; null means retail pricing", default: null }
      - { name: posted_exposure_cents, type: integer, source: computed, description: "Σ(amount_cents − paid_cents) over invoices status OPEN, minus credit_balance_cents, floored at 0" }
      - { name: accrued_rental_cents, type: integer, source: computed, description: "Σ accrued_unbilled_cents over RentalAgreements of this customer with status IN {ACTIVE, SUSPENDED, CLOSED-unbilled-none}; recomputed per read against the logical clock" }
      - { name: projected_exposure_cents, type: integer, source: computed, description: "posted_exposure_cents + accrued_rental_cents + Σ total_cents of orders with fulfillment_status IN {CONFIRMED, STAGED}" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Σ(amount_cents − paid_cents) over invoices status OPEN (no credit offset)" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Unapplied overpayment credit cents", default: 0 }

  - name: PriceBook
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Book label" }
      - { name: scope, type: enum, source: input, description: "RETAIL | CONTRACT" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; required iff scope=CONTRACT, must be null iff scope=RETAIL", default: null }
      - { name: effective_from, type: datetime, source: input, description: "Window start (inclusive), ISO8601 date" }
      - { name: effective_to, type: datetime, source: input, description: "Window end (exclusive); must be > effective_from (ERR_VALIDATION)" }
      - { name: default_discount_pct, type: number, source: input, description: "Fraction in [0, 0.90] applied to retail price" }
      - { name: volume_tiers, type: array, source: input, description: "Array of {min_qty: integer, extra_discount_pct: number}, sorted by min_qty ASC, min_qty >= 1", default: [] }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | EXPIRED; initial DRAFT; ACTIVE→EXPIRED automatic when logical clock reaches effective_to" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock keeping unit", constraints: "unique (ERR_DUPLICATE_SKU)" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: category, type: enum, source: input, description: "HARDGOOD | GAS | SPECIALTY_GAS" }
      - { name: gas_grade, type: enum, source: input, description: "OXYGEN | ACETYLENE | ARGON | AR_CO2_7525 | NITROGEN; required iff category GAS or SPECIALTY_GAS, null otherwise", default: null }
      - { name: retail_price_cents, type: integer, source: input, description: "List price per unit, >= 0" }
      - { name: hazmat, type: boolean, source: input, description: "Hazmat flag; triggers flat per-order hazmat fee", default: false }
      - { name: stock_on_hand, type: integer, source: system, description: "Physical units on hand; starts 0; +qty on receive, −qty on order confirm, +qty on order cancel" }
      - { name: reorder_point, type: integer, source: input, description: "Reorder threshold", default: 0 }
      - { name: lead_time_days, type: integer, source: input, description: "Special-order lead time in days (SPECIALTY_GAS typically > 0)", default: 0 }
      - { name: needs_reorder, type: boolean, source: computed, description: "stock_on_hand <= reorder_point" }

  - name: CylinderAsset
    parent: null
    common_fields: true
    fields:
      - { name: serial_no, type: string, source: input, description: "Stamped serial", constraints: "unique (ERR_DUPLICATE_SERIAL)" }
      - { name: gas_grade, type: enum, source: input, description: "OXYGEN | ACETYLENE | ARGON | AR_CO2_7525 | NITROGEN" }
      - { name: size, type: enum, source: input, description: "SMALL | MEDIUM | LARGE" }
      - { name: status, type: enum, source: system, description: "FULL | EMPTY | OUT | RETIRED; registered FULL; FULL→OUT on order fulfillment issue, OUT→EMPTY on exchange return / rental close, FULL|EMPTY→RETIRED on retire" }
      - { name: holder_customer_id, type: string, source: system, description: "FK -> Customer.id; nullable — set while status=OUT, null at branch", default: null }
      - { name: rental_agreement_id, type: string, source: system, description: "FK -> RentalAgreement.id; nullable — set while the cylinder is out under a rental agreement", default: null }

  - name: Machine
    parent: null
    common_fields: true
    fields:
      - { name: model, type: string, source: input, description: "Welder model name" }
      - { name: serial_no, type: string, source: input, description: "Machine serial", constraints: "unique (ERR_DUPLICATE_SERIAL)" }
      - { name: daily_rate_cents, type: integer, source: input, description: "DAILY plan rate, > 0" }
      - { name: weekly_rate_cents, type: integer, source: input, description: "WEEKLY plan rate, > 0" }
      - { name: monthly_rate_cents, type: integer, source: input, description: "MONTHLY plan rate, > 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | RENTED; AVAILABLE→RENTED on rental open, RENTED→AVAILABLE on rental close" }

  - name: RentalAgreement
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; renting account" }
      - { name: item_type, type: enum, source: input, description: "CYLINDER | MACHINE" }
      - { name: cylinder_asset_id, type: string, source: input, description: "FK -> CylinderAsset.id; required iff item_type=CYLINDER, must be null otherwise (ERR_RENTAL_ITEM_MISMATCH)", default: null }
      - { name: machine_id, type: string, source: input, description: "FK -> Machine.id; required iff item_type=MACHINE, must be null otherwise (ERR_RENTAL_ITEM_MISMATCH)", default: null }
      - { name: rate_plan, type: enum, source: input, description: "DEMURRAGE (cylinders only) | DAILY | WEEKLY | MONTHLY (machines only); cross combinations → ERR_RENTAL_ITEM_MISMATCH" }
      - { name: start_date, type: string, source: input, description: "Accrual start date (YYYY-MM-DD); any past/present/future date allowed" }
      - { name: scheduled_end_date, type: string, source: input, description: "Optional planned end date (YYYY-MM-DD)", default: null }
      - { name: grace_days, type: integer, source: input, description: "Free days counted from start_date before charges accrue", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED; initial ACTIVE; ACTIVE↔SUSPENDED cycle allowed" }
      - { name: billed_through_date, type: string, source: system, description: "Watermark date through which cycle billing has posted; null until first billing run or close", default: null }
      - { name: lifetime_billed_cents, type: integer, source: system, description: "Σ cents posted by billing runs and the final close invoice", default: 0 }
      - { name: waived_cents, type: integer, source: system, description: "Σ cents waived via /waive", default: 0 }
      - { name: accrued_unbilled_cents, type: integer, source: computed, description: "PROVISIONAL accrual: max(0, value_ceil(clock_date) − lifetime_billed_cents − waived_cents); see rental_accrual" }
      - { name: closed_at, type: datetime, source: system, description: "Close timestamp; null until CLOSED", default: null }

  - name: DeliveryRoute
    parent: null
    common_fields: true
    fields:
      - { name: route_date, type: string, source: input, description: "Planned delivery date (YYYY-MM-DD)" }
      - { name: truck_capacity_units, type: integer, source: input, description: "Total line-unit capacity of the truck for the day, > 0" }
      - { name: reserved_units, type: integer, source: computed, description: "Σ units over Orders with route_id=this and fulfillment_status IN {CONFIRMED, STAGED}" }
      - { name: status, type: enum, source: system, description: "PLANNED | DISPATCHED | CLOSED; initial PLANNED" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; purchasing account" }
      - { name: order_type, type: enum, source: input, description: "RETAIL | EXCHANGE | SPECIAL_MIX" }
      - { name: fulfillment, type: enum, source: input, description: "WILL_CALL | ROUTE" }
      - { name: route_id, type: string, source: input, description: "FK -> DeliveryRoute.id; required iff fulfillment=ROUTE, must be null iff WILL_CALL (ERR_VALIDATION)", default: null }
      - { name: lines, type: array, source: input, description: "Array of {product_id, qty: integer > 0}; each line gains unit_price_cents + line_total_cents snapshots at confirm; EXCHANGE/SPECIAL_MIX lines must reference GAS/SPECIALTY_GAS products respectively (ERR_VALIDATION)" }
      - { name: available_date, type: string, source: computed, description: "created date + max lead_time_days over SPECIALTY_GAS lines; null when no specialty lines", default: null }
      - { name: units, type: integer, source: computed, description: "Σ qty over lines" }
      - { name: fulfillment_status, type: enum, source: system, description: "DRAFT | CONFIRMED | STAGED | FULFILLED | CANCELLED (parallel dimension 1)" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PAID | INVOICED | SETTLED (parallel dimension 2); initial UNPAID" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Σ line_total_cents after per-line unit pricing at confirm; 0 while DRAFT" }
      - { name: delivery_fee_cents, type: integer, source: computed, description: "DELIVERY_FEE_CENTS when fulfillment=ROUTE and subtotal_cents < FREE_DELIVERY_THRESHOLD_CENTS; else 0" }
      - { name: hazmat_fee_cents, type: integer, source: computed, description: "HAZMAT_FEE_CENTS flat when any line's product has hazmat=true; else 0" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + delivery_fee_cents + hazmat_fee_cents" }
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; nullable — set when fulfillment of a NET30 order posts its invoice", default: null }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; billed account" }
      - { name: source, type: enum, source: system, description: "ORDER | RENTAL_CYCLE | RENTAL_CLOSE" }
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; nullable — set iff source=ORDER", default: null }
      - { name: amount_cents, type: integer, source: system, description: "Invoiced cents (order total, per-customer cycle aggregate, or close-out accrual)" }
      - { name: paid_cents, type: integer, source: system, description: "Σ payment cents applied via the waterfall", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | PAID | VOID; initial OPEN; PAID when paid_cents >= amount_cents" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp at creation" }
      - { name: due_at, type: datetime, source: system, description: "issued_at + 30 days for NET30 customers; equal to issued_at for CASH customers" }

  - name: TrainingClass
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Class name (e.g. Oxy-Fuel Safety)" }
      - { name: room, type: enum, source: input, description: "ROOM_A | ROOM_B" }
      - { name: start_at, type: datetime, source: input, description: "Class start (ISO8601); must be < end_at (ERR_VALIDATION)" }
      - { name: end_at, type: datetime, source: input, description: "Class end (exclusive bound for room overlap)" }
      - { name: capacity, type: integer, source: input, description: "Seat count, > 0" }
      - { name: price_cents, type: integer, source: input, description: "Seat price, >= 0" }
      - { name: seats_booked, type: integer, source: computed, description: "Count of enrollments with status IN {ENROLLED, ATTENDED, NO_SHOW}" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED; initial SCHEDULED" }

  - name: TrainingEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: class_id, type: string, source: input, description: "FK -> TrainingClass.id; class being enrolled" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; paying account" }
      - { name: attendee_name, type: string, source: input, description: "Attendee full name" }
      - { name: status, type: enum, source: system, description: "ENROLLED | ATTENDED | NO_SHOW | CANCELLED; initial ENROLLED" }
      - { name: cert_code, type: string, source: system, description: "Issued on ATTENDED: 'CERT-' + enrollment id; null otherwise", default: null }
      - { name: cert_expires_at, type: datetime, source: system, description: "ATTENDED timestamp + CERT_VALIDITY_DAYS; null otherwise", default: null }

  - name: RepairTicket
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owner of the customer machine" }
      - { name: machine_desc, type: string, source: input, description: "Free-text description of the customer-owned machine" }
      - { name: issue_desc, type: string, source: input, description: "Reported fault" }
      - { name: status, type: enum, source: system, description: "INTAKE | DIAGNOSING | QUOTED | APPROVED | IN_REPAIR | READY_FOR_PICKUP | REJECTED | CLOSED; initial INTAKE" }
      - { name: quote_cents, type: integer, source: input, description: "Quoted repair price, > 0; required on advance→QUOTED, cleared to null on requote" }
      - { name: revision_no, type: integer, source: system, description: "Re-quote counter; 0 at creation, +1 on each REJECTED→DIAGNOSING advance", default: 0 }
      - { name: charged_cents, type: integer, source: system, description: "Set at close: quote_cents when closed from READY_FOR_PICKUP, 0 when closed from REJECTED; null until CLOSED", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "POST /customers/{id}/credit-hold {action: PLACE_HOLD} OR system: posted_exposure_cents rises strictly above credit_limit_cents on invoice creation (order fulfill, billing run, rental close)"
        actor: BranchManager | system
        preconditions: ["Manual: customer status == ACTIVE"]
        side_effects: ["increments Customer.version by 1", "refreshes Customer.updated_at"]
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "POST /customers/{id}/credit-hold {action: RELEASE_HOLD} OR system: posted_exposure_cents falls to <= credit_limit_cents after a payment waterfall"
        actor: BranchManager | system
        preconditions: ["Manual: customer status == CREDIT_HOLD"]
        side_effects: ["increments Customer.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /customers/{id}/credit-hold {action: SUSPEND}"
        actor: BranchManager
        preconditions: []
        side_effects: ["increments Customer.version by 1"]
      - from: CREDIT_HOLD
        to: SUSPENDED
        trigger: "POST /customers/{id}/credit-hold {action: SUSPEND}"
        actor: BranchManager
        preconditions: []
        side_effects: ["increments Customer.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /customers/{id}/credit-hold {action: REINSTATE}"
        actor: BranchManager
        preconditions: []
        side_effects: ["increments Customer.version by 1"]

  - entity: PriceBook
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /price-books/{id}/activate"
        actor: BranchManager
        preconditions:
          - "No other ACTIVE PriceBook with the same scope and same customer_id has a window overlapping [effective_from, effective_to) — half-open, so effective_to == other.effective_from is allowed (ERR_PRICE_BOOK_OVERLAP)"
        side_effects: ["increments PriceBook.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: logical clock reaches effective_to"
        actor: system
        preconditions: []
        side_effects: ["Book no longer participates in contract_price_resolution"]

  - entity: DeliveryRoute
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /delivery-routes/{id}/dispatch"
        actor: RouteDriver | BranchManager
        preconditions: []
        side_effects: ["increments DeliveryRoute.version by 1"]
      - from: DISPATCHED
        to: CLOSED
        trigger: "POST /delivery-routes/{id}/close"
        actor: RouteDriver | BranchManager
        preconditions:
          - "Every Order with route_id=this has fulfillment_status IN {FULFILLED, CANCELLED} (ERR_ROUTE_HAS_OPEN_ORDERS)"
        side_effects: ["increments DeliveryRoute.version by 1"]

  - entity: Order
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    note: "Two parallel state dimensions evolve independently: fulfillment_status (DRAFT→CONFIRMED→STAGED→FULFILLED, CANCELLED from DRAFT/CONFIRMED/STAGED) and payment_status (UNPAID→PAID for CASH, UNPAID→INVOICED→SETTLED for NET30)."
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /orders/{id}/confirm"
        actor: CounterRep | BranchManager
        preconditions:
          - "Customer.status == ACTIVE (ERR_ACCOUNT_ON_HOLD)"
          - "For each HARDGOOD line: Product.stock_on_hand >= qty (ERR_STOCK_INSUFFICIENT); GAS/SPECIALTY_GAS lines are stocked as cylinders, not units"
          - "For each GAS/SPECIALTY_GAS line: count of CylinderAsset with status FULL and matching gas_grade >= line qty (ERR_CYLINDER_UNAVAILABLE)"
          - "If fulfillment=ROUTE: DeliveryRoute.status == PLANNED (ERR_ROUTE_NOT_ACCEPTING) and route.reserved_units + order.units <= truck_capacity_units (ERR_ROUTE_CAPACITY_EXCEEDED)"
          - "If customer.terms == NET30: customer.projected_exposure_cents + order.total_cents <= customer.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED); strict > fails, == passes"
        side_effects:
          - "contract_price_resolution snapshots unit_price_cents per line; order_total_aggregation computes subtotal/delivery/hazmat/total"
          - "Product.stock_on_hand decremented by line qty per line"
          - "DeliveryRoute.reserved_units incremented by order.units when fulfillment=ROUTE"
          - "increments Order.version by 1"
      - from: CONFIRMED
        to: STAGED
        trigger: "POST /orders/{id}/stage"
        actor: CounterRep | BranchManager
        preconditions:
          - "If order has SPECIALTY_GAS lines: logical clock date >= order.available_date (ERR_MIX_NOT_READY)"
        side_effects: ["increments Order.version by 1"]
      - from: STAGED
        to: FULFILLED
        trigger: "POST /orders/{id}/fulfill"
        actor: "CounterRep (WILL_CALL only) | RouteDriver (ROUTE only) | BranchManager (either)"
        preconditions:
          - "If fulfillment=ROUTE: DeliveryRoute.status == DISPATCHED (ERR_ROUTE_NOT_DISPATCHED)"
          - "If customer.terms == CASH: payment_status == PAID (ERR_PAYMENT_REQUIRED)"
          - "For any GAS/SPECIALTY_GAS line: issued_asset_ids supplied, count == Σ qty of those lines, each asset status FULL and gas_grade matching a line's product grade (ERR_CYLINDER_GRADE_MISMATCH), no asset RETIRED (ERR_CYLINDER_CONDEMNED)"
          - "If order_type=EXCHANGE: returned_asset_ids supplied, count == Σ line qty, each asset status OUT with holder_customer_id == order.customer_id and gas_grade matching the issued grades (ERR_CYLINDER_GRADE_MISMATCH)"
        side_effects:
          - "Each issued asset: status FULL→OUT, holder_customer_id := order.customer_id"
          - "Each returned asset: status OUT→EMPTY, holder_customer_id := null (cylinder float conserved per grade)"
          - "CASH: nothing further (payment_status already PAID)"
          - "NET30: creates Invoice(source=ORDER, amount=total_cents, due_at=clock+30d); Order.payment_status UNPAID→INVOICED; Order.invoice_id set — hop 1"
          - "Invoice creation recomputes Customer.posted_exposure_cents / outstanding_balance_cents — hop 2"
          - "If posted_exposure_cents > credit_limit_cents: Customer.status ACTIVE→CREDIT_HOLD (auto) — hop 3"
          - "increments Order.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: CounterRep | BranchManager
        preconditions: []
        side_effects: ["increments Order.version by 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: CounterRep | BranchManager
        preconditions: []
        side_effects:
          - "Product.stock_on_hand restored per HARDGOOD line"
          - "DeliveryRoute.reserved_units decremented by order.units when fulfillment=ROUTE"
          - "increments Order.version by 1"
      - from: STAGED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: CounterRep | BranchManager
        preconditions: []
        side_effects:
          - "Product.stock_on_hand restored per HARDGOOD line"
          - "DeliveryRoute.reserved_units decremented by order.units when fulfillment=ROUTE"
          - "increments Order.version by 1"
      - from: "payment: UNPAID"
        to: "payment: PAID"
        trigger: "POST /orders/{id}/pay (CASH customers only)"
        actor: CounterRep | BranchManager
        preconditions:
          - "customer.terms == CASH (ERR_VALIDATION otherwise)"
          - "fulfillment_status IN {CONFIRMED, STAGED} (ERR_INVALID_STATE)"
          - "amount_cents == total_cents exactly (ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects: ["payment_status → PAID", "increments Order.version by 1"]
      - from: "payment: INVOICED"
        to: "payment: SETTLED"
        trigger: "system: the linked Invoice (Order.invoice_id) reaches status PAID via the payment waterfall"
        actor: system
        preconditions: []
        side_effects: ["payment_status → SETTLED", "increments Order.version by 1"]

  - entity: CylinderAsset
    initial_state: FULL
    terminal_states: [RETIRED]
    transitions:
      - from: FULL
        to: OUT
        trigger: "POST /orders/{id}/fulfill (issued) OR POST /rental-agreements (cylinder item)"
        actor: CounterRep | RouteDriver | BranchManager
        preconditions: ["status == FULL"]
        side_effects: ["holder_customer_id := customer", "rental_agreement_id set when issued under a rental"]
      - from: OUT
        to: EMPTY
        trigger: "POST /orders/{id}/fulfill (returned on EXCHANGE) OR POST /rental-agreements/{id}/close"
        actor: CounterRep | RouteDriver | BranchManager
        preconditions: []
        side_effects: ["holder_customer_id := null", "rental_agreement_id := null"]
      - from: FULL
        to: RETIRED
        trigger: "POST /cylinder-assets/{id}/retire"
        actor: BranchManager
        preconditions: []
        side_effects: ["Asset excluded from float counts except retired_assets"]
      - from: EMPTY
        to: RETIRED
        trigger: "POST /cylinder-assets/{id}/retire"
        actor: BranchManager
        preconditions: []
        side_effects: []

  - entity: Machine
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: RENTED
        trigger: "POST /rental-agreements (machine item)"
        actor: CounterRep | BranchManager
        preconditions: ["status == AVAILABLE (ERR_ASSET_NOT_AVAILABLE)"]
        side_effects: []
      - from: RENTED
        to: AVAILABLE
        trigger: "POST /rental-agreements/{id}/close"
        actor: CounterRep | BranchManager
        preconditions: []
        side_effects: ["Turnaround buffer rule arms: next rental on this machine must have start_date > closed date + MACHINE_TURNAROUND_BUFFER_DAYS"]

  - entity: RentalAgreement
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /rental-agreements/{id}/suspend"
        actor: CounterRep | BranchManager
        preconditions: []
        side_effects: ["Agreement skipped by billing runs while SUSPENDED; accrual value_ceil keeps accruing", "increments RentalAgreement.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /rental-agreements/{id}/resume"
        actor: CounterRep | BranchManager
        preconditions: []
        side_effects: ["increments RentalAgreement.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /rental-agreements/{id}/close"
        actor: CounterRep | BranchManager
        preconditions: []
        side_effects:
          - "closed_at := logical clock"
          - "final charge := max(0, value_ceil(clock_date) − lifetime_billed_cents − waived_cents); if > 0 creates Invoice(source=RENTAL_CLOSE, amount=final); lifetime_billed_cents += final; billed_through_date := clock date"
          - "Cylinder item: asset OUT→EMPTY, holder/rental links cleared; Machine item: machine RENTED→AVAILABLE"
          - "Invoice creation recomputes Customer exposures and may auto-place CREDIT_HOLD"
          - "increments RentalAgreement.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /rental-agreements/{id}/close"
        actor: CounterRep | BranchManager
        preconditions: []
        side_effects: ["Same side effects as ACTIVE→CLOSED"]

  - entity: Invoice
    initial_state: OPEN
    terminal_states: [PAID, VOID]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "system: payment waterfall raises paid_cents to >= amount_cents"
        actor: system
        preconditions: []
        side_effects:
          - "If source=ORDER: linked Order.payment_status INVOICED→SETTLED — hop 2 of the payment cascade"
          - "Customer.posted_exposure_cents recomputed; if customer was CREDIT_HOLD and posted_exposure_cents <= credit_limit_cents: status → ACTIVE (auto) — hop 3"
      - from: OPEN
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: BranchManager
        preconditions: ["paid_cents == 0 (ERR_INVOICE_NOT_VOIDABLE)"]
        side_effects:
          - "Customer exposures recomputed (balance drops); may auto-release CREDIT_HOLD"
          - "If source=ORDER: linked Order.payment_status INVOICED→UNPAID"
          - "increments Invoice.version by 1"

  - entity: TrainingClass
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /training-classes/{id}/advance {to: COMPLETED}"
        actor: Trainer | BranchManager
        preconditions: ["logical clock >= end_at (ERR_CLASS_NOT_STARTED)"]
        side_effects: ["increments TrainingClass.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /training-classes/{id}/advance {to: CANCELLED}"
        actor: Trainer | BranchManager
        preconditions: []
        side_effects:
          - "Cascade down: every enrollment with status ENROLLED → CANCELLED (ATTENDED/NO_SHOW enrollments untouched)"
          - "seats_booked recomputed"
          - "increments TrainingClass.version by 1"

  - entity: TrainingEnrollment
    initial_state: ENROLLED
    terminal_states: [ATTENDED, NO_SHOW, CANCELLED]
    transitions:
      - from: ENROLLED
        to: ATTENDED
        trigger: "POST /enrollments/{id}/advance {to: ATTENDED}"
        actor: Trainer | BranchManager
        preconditions:
          - "TrainingClass.status == SCHEDULED (ERR_CLASS_NOT_SCHEDULED)"
          - "logical clock >= class.start_at (ERR_CLASS_NOT_STARTED)"
        side_effects: ["cert_code := 'CERT-' + enrollment id", "cert_expires_at := clock + CERT_VALIDITY_DAYS", "increments TrainingEnrollment.version by 1"]
      - from: ENROLLED
        to: NO_SHOW
        trigger: "POST /enrollments/{id}/advance {to: NO_SHOW}"
        actor: Trainer | BranchManager
        preconditions: ["TrainingClass.status == SCHEDULED (ERR_CLASS_NOT_SCHEDULED)"]
        side_effects: ["Seat remains consumed", "increments TrainingEnrollment.version by 1"]
      - from: ENROLLED
        to: CANCELLED
        trigger: "POST /enrollments/{id}/advance {to: CANCELLED} OR system cascade from class cancellation"
        actor: CounterRep | Trainer | BranchManager | system
        preconditions: []
        side_effects: ["Seat freed: seats_booked recomputed excluding CANCELLED", "increments TrainingEnrollment.version by 1"]

  - entity: RepairTicket
    initial_state: INTAKE
    terminal_states: [CLOSED]
    transitions:
      - from: INTAKE
        to: DIAGNOSING
        trigger: "POST /repair-tickets/{id}/advance {to: DIAGNOSING}"
        actor: ServiceTech | BranchManager
        preconditions: []
        side_effects: ["increments RepairTicket.version by 1"]
      - from: DIAGNOSING
        to: QUOTED
        trigger: "POST /repair-tickets/{id}/advance {to: QUOTED, quote_cents}"
        actor: ServiceTech | BranchManager
        preconditions: ["quote_cents supplied and > 0 (ERR_VALIDATION)"]
        side_effects: ["quote_cents recorded", "increments RepairTicket.version by 1"]
      - from: QUOTED
        to: APPROVED
        trigger: "POST /repair-tickets/{id}/advance {to: APPROVED}"
        actor: BranchManager
        preconditions: []
        side_effects: ["increments RepairTicket.version by 1"]
      - from: QUOTED
        to: REJECTED
        trigger: "POST /repair-tickets/{id}/advance {to: REJECTED}"
        actor: BranchManager
        preconditions: []
        side_effects: ["increments RepairTicket.version by 1"]
      - from: REJECTED
        to: DIAGNOSING
        trigger: "POST /repair-tickets/{id}/advance {to: DIAGNOSING} (re-quote loop)"
        actor: ServiceTech | BranchManager
        preconditions: []
        side_effects: ["revision_no += 1", "quote_cents := null", "increments RepairTicket.version by 1"]
      - from: APPROVED
        to: IN_REPAIR
        trigger: "POST /repair-tickets/{id}/advance {to: IN_REPAIR}"
        actor: ServiceTech | BranchManager
        preconditions: []
        side_effects: ["increments RepairTicket.version by 1"]
      - from: IN_REPAIR
        to: READY_FOR_PICKUP
        trigger: "POST /repair-tickets/{id}/advance {to: READY_FOR_PICKUP}"
        actor: ServiceTech | BranchManager
        preconditions: []
        side_effects: ["increments RepairTicket.version by 1"]
      - from: READY_FOR_PICKUP
        to: CLOSED
        trigger: "POST /repair-tickets/{id}/advance {to: CLOSED}"
        actor: ServiceTech | BranchManager
        preconditions: []
        side_effects: ["charged_cents := quote_cents", "increments RepairTicket.version by 1"]
      - from: REJECTED
        to: CLOSED
        trigger: "POST /repair-tickets/{id}/advance {to: CLOSED}"
        actor: ServiceTech | BranchManager
        preconditions: []
        side_effects: ["charged_cents := 0", "increments RepairTicket.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: payment-stale-customer-version
    parent_entity: Customer
    write_endpoint: "POST /customers/{id}/payments"
    occ_field: "expected_customer_version"
    description: |
      Applying a payment against a Customer whose version has advanced since the
      client last read it is rejected: the waterfall's allocation set (open
      invoices, credit balance, exposure) may have changed under the client, so a
      stale writer must re-read before applying cash. Detected purely via
      expected_customer_version mismatch — two strictly sequential requests
      suffice to demonstrate it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: waiver-stale-rental-version
    parent_entity: RentalAgreement
    write_endpoint: "POST /rental-agreements/{id}/waive"
    occ_field: "expected_rental_agreement_version"
    description: |
      Granting a demurrage waiver against a RentalAgreement whose version has
      advanced since the client last read it is rejected: accrual-affecting
      mutations (suspend/resume/close, prior waivers, billing runs) rebase the
      accrued_unbilled_cents the waiver amount was judged against. Detected
      purely via expected_rental_agreement_version mismatch.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: contract_price_resolution
    trigger: "POST /orders/{id}/confirm — evaluated per order line, at confirm time only (snapshot)"
    algorithm: tiered_pricing
    formula: |
      For each line with product P and qty q, evaluated against the logical clock date D:
      1. If Customer.price_book_id is null, or the referenced PriceBook has
         status != ACTIVE, or D not in [effective_from, effective_to):
         unit_price_cents := P.retail_price_cents. STOP.
      2. base := P.retail_price_cents × (1 − book.default_discount_pct)
      3. tier := the volume_tiers entry with the greatest min_qty such that
         min_qty <= q; if none qualifies, extra := 0 else extra := tier.extra_discount_pct
      4. unit_price_cents := round_half_up(base × (1 − extra))  — SINGLE rounding
         at the very end; no intermediate rounding of `base`.
      line_total_cents := unit_price_cents × q  (integer multiply, no further rounding)
    input_set: "Order lines of the order being confirmed; customer's linked PriceBook"
    constants:
      ROUNDING: "round_half_up to whole cents, applied exactly once at step 4"
    precision: "0 decimal places (whole cents), round_half_up, single-round-at-end"
    variants:
      - name: retail_pricing
        when: "Customer has no ACTIVE in-window CONTRACT book"
        difference: "unit = retail_price_cents, no discount, no tier lookup"
      - name: contract_pricing
        when: "ACTIVE in-window CONTRACT book linked to the customer"
        difference: "unit = round_half_up(retail × (1−default_discount_pct) × (1−tier_extra))"

  - name: order_total_aggregation
    trigger: "POST /orders/{id}/confirm — after contract_price_resolution"
    algorithm: aggregation
    formula: |
      Evaluation order is pinned (fees depend on subtotal, never vice versa):
      1. line_total_cents := unit_price_cents × qty            (per line)
      2. subtotal_cents  := Σ line_total_cents                 (sum of rounded lines —
         'sum-then-round' of raw products is FORBIDDEN and yields different cents)
      3. delivery_fee_cents := DELIVERY_FEE_CENTS if fulfillment=ROUTE
         AND subtotal_cents < FREE_DELIVERY_THRESHOLD_CENTS else 0
         (threshold uses strict <: subtotal == threshold → fee waived)
      4. hazmat_fee_cents := HAZMAT_FEE_CENTS if any line's product hazmat=true else 0
         (flat per order, not per line)
      5. total_cents := subtotal_cents + delivery_fee_cents + hazmat_fee_cents
    input_set: "All lines of the confirming order"
    constants:
      DELIVERY_FEE_CENTS: 2500
      FREE_DELIVERY_THRESHOLD_CENTS: 20000
      HAZMAT_FEE_CENTS: 1500
    precision: "whole cents; rounding happens only inside contract_price_resolution step 4"

  - name: rental_accrual
    trigger: "GET /rental-agreements/{id} and GET /customers/{id} (provisional read against the logical clock); POST /billing/run-rental-cycle and POST /rental-agreements/{id}/close (billed/final posting)"
    algorithm: threshold
    formula: |
      Let start := start_date, G := grace_days (0 for machine plans unless overridden),
      t := the as-of date (logical clock date). All date math in whole days.
        chargeable_days(t) := max(0, (t − start).days − G)
      Rate source: DEMURRAGE → DEMURRAGE_MONTHLY_CENTS constant;
      DAILY/WEEKLY/MONTHLY → the rented Machine's daily/weekly/monthly_rate_cents.
      Period length: DAILY → 1 day, WEEKLY → 7 days, MONTHLY and DEMURRAGE → 30 days.
        value_ceil(t)  := ceil(chargeable_days(t)  / period) × rate
        value_floor(t) := floor(chargeable_days(t) / period) × rate
      accrued_unbilled_cents (stored view) := max(0, value_ceil(clock) − lifetime_billed_cents − waived_cents)
      Billing run per agreement (status ACTIVE only): bill := max(0, value_floor(run_date) − lifetime_billed_cents − waived_cents)
      Close-out: final := max(0, value_ceil(close_date) − lifetime_billed_cents − waived_cents)
    input_set: "The single RentalAgreement; billing run iterates all agreements with status ACTIVE"
    constants:
      DEMURRAGE_MONTHLY_CENTS: 1200
      DEFAULT_CYLINDER_GRACE_DAYS: 5
      PERIOD_DAYS: { DAILY: 1, WEEKLY: 7, MONTHLY: 30, DEMURRAGE: 30 }
    precision: "whole cents; ceil/floor applied to the period quotient only"
    variants:
      - name: provisional_accrual
        when: "Live read of accrued_unbilled_cents against the logical clock"
        difference: "Rounds the partial current period UP (ceil) — the customer currently owes a started period"
      - name: billed_cycle
        when: "POST /billing/run-rental-cycle posting"
        difference: "Counts COMPLETE periods only (floor) — a started-but-unfinished period is not billed; produces a smaller number than provisional for identical data whenever a partial period is in flight"

  - name: customer_exposure
    trigger: "POST /orders/{id}/confirm (credit check), and recomputed on invoice creation, payment waterfall, invoice void"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents := Σ over Invoices(status=OPEN) of (amount_cents − paid_cents)
      posted_exposure_cents     := max(0, outstanding_balance_cents − credit_balance_cents)
      projected_exposure_cents  := posted_exposure_cents
                                   + Σ over RentalAgreements(status=ACTIVE or SUSPENDED) of accrued_unbilled_cents
                                   + Σ over Orders(fulfillment_status IN {CONFIRMED, STAGED}) of total_cents
      Credit check at confirm (NET30 customers only):
        reject iff projected_exposure_cents + order.total_cents > credit_limit_cents
        (strict >: equality passes)
      Auto CREDIT_HOLD (NET30 customers only — CASH accounts are not credit-managed):
      when posted_exposure_cents > credit_limit_cents becomes true
      via an invoice-creation event (strict >; equality does not hold).
      Auto release: CREDIT_HOLD → ACTIVE when posted_exposure_cents <= credit_limit_cents
      after a payment waterfall or invoice void (also NET30-only).
    input_set: "Customer's OPEN invoices, non-... rental agreements, CONFIRMED/STAGED orders"
    constants: {}
    precision: "whole cents"
    variants:
      - name: posted_exposure
        when: "Auto credit-hold evaluation and account reads"
        difference: "Ledger-only view: OPEN invoice balances minus credit balance; ignores unbilled accrual and unshipped orders"
      - name: projected_exposure
        when: "Credit check at order confirm"
        difference: "Forward-looking view: posted + accrued rental + open-order commitments; strictly >= posted, so a confirm can fail while posted alone would pass"

  - name: payment_waterfall
    trigger: "POST /customers/{id}/payments"
    algorithm: waterfall_allocation
    formula: |
      Candidates: customer's Invoices with status OPEN.
      Order: due_at ASC, tie → issued_at ASC, tie → created_at ASC (never id).
      remaining := amount_cents
      for each invoice in order while remaining > 0:
        applied := min(remaining, amount_cents − paid_cents)
        paid_cents += applied; remaining −= applied
        if paid_cents >= amount_cents: invoice status → PAID (fires §1.2 Invoice→PAID cascade)
      credit_added_cents := remaining  (overpayment becomes credit_balance_cents)
      CONSERVATION INVARIANT: Σ applied_i + credit_added_cents == amount_cents exactly.
      After the sweep: recompute customer exposure fields; auto-release CREDIT_HOLD if applicable.
    input_set: "OPEN invoices of the customer only (PAID/VOID excluded)"
    constants: {}
    precision: "whole cents; no rounding — allocation is exact min() arithmetic"

  - name: route_load
    trigger: "POST /orders/{id}/confirm with fulfillment=ROUTE; order cancel; order fulfill"
    algorithm: aggregation
    formula: |
      DeliveryRoute.reserved_units := Σ Order.units over Orders with route_id = route.id
        AND fulfillment_status IN {CONFIRMED, STAGED}
        (DRAFT orders do not reserve; FULFILLED/CANCELLED release their units)
      Capacity check at confirm: reserved_units + new_order.units <= truck_capacity_units
      (== capacity is allowed; +1 over fails with ERR_ROUTE_CAPACITY_EXCEEDED)
    input_set: "Orders bound to the route in CONFIRMED/STAGED status"
    constants: {}
    precision: "integer units"

  - name: float_reconciliation
    trigger: "GET /cylinder-assets/float-summary; conceptually after every asset status mutation"
    algorithm: aggregation
    formula: |
      Per gas_grade g over CylinderAssets:
        full_g    := count(status=FULL);  empty_g := count(status=EMPTY)
        out_g     := count(status=OUT);   retired_g := count(status=RETIRED)
        total_g   := full_g + empty_g + out_g          (retired excluded)
      CONSERVATION INVARIANT: total_g is changed only by register (+1) and retire (−1).
      A balanced EXCHANGE fulfillment (k returned, k issued for the same grade)
      leaves out_g and total_g unchanged; full_g −k, empty_g +k.
      Response: { grades: [{gas_grade, full, empty, out, retired, total}...], total_assets, retired_assets }
    input_set: "All CylinderAssets, grouped by gas_grade"
    constants: {}
    precision: "integer counts"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins when a
# request violates several rules at once)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is listed on the endpoint AND any per-action role condition holds (fulfill: CounterRep only for WILL_CALL, RouteDriver only for ROUTE, BranchManager either; repair-ticket advance: to=APPROVED/REJECTED requires BranchManager, other targets require ServiceTech or BranchManager; enrollment advance: to=ATTENDED/NO_SHOW requires Trainer or BranchManager, to=CANCELLED also allows CounterRep)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every id in the path exists; body-referenced ids (customer_id, product_id, route_id, price_book_id, asset ids, class_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Request shape: required fields present, types correct, enum members valid, quantities/amounts > 0 where required, effective_from < effective_to, start_at < end_at, route_id present iff fulfillment=ROUTE, cylinder_asset_id/machine_id pairing matches item_type and rate_plan (ERR_RENTAL_ITEM_MISMATCH), terms-specific constraints (pay endpoint on NET30 order)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all mutating endpoints
    note: "ERR_RENTAL_ITEM_MISMATCH is the dedicated shape error for polymorphic rental item mismatch; all other shape failures use ERR_VALIDATION"

  - priority: 5
    category: state
    check: "OCC: expected_customer_version == Customer.version (payments), expected_rental_agreement_version == RentalAgreement.version (waive)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /customers/{id}/payments, POST /rental-agreements/{id}/waive"

  - priority: 6
    category: state
    check: "Target entity's own state permits the transition (order DRAFT→CONFIRMED etc.; enrollment ENROLLED-only advance; invoice OPEN-only void; route PLANNED-only dispatch; asset OUT-only via correct holder)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: business_safety
    check: "No RETIRED cylinder may be issued or put on rent (condemned-pressure-vessel safety rule)"
    error_id: ERR_CYLINDER_CONDEMNED
    http_status: 409
    applies_to: "POST /orders/{id}/fulfill, POST /rental-agreements"

  - priority: 8
    category: business_referential
    check: "Linked entity in compatible state: Customer.status == ACTIVE for order confirm, rental open, enrollment create (ERR_ACCOUNT_ON_HOLD); route PLANNED when an order confirms onto it (ERR_ROUTE_NOT_ACCEPTING); route DISPATCHED when its order fulfills (ERR_ROUTE_NOT_DISPATCHED); class SCHEDULED for enrollment create and attendance marking (ERR_CLASS_NOT_SCHEDULED)"
    error_id: "ERR_ACCOUNT_ON_HOLD | ERR_ROUTE_NOT_ACCEPTING | ERR_ROUTE_NOT_DISPATCHED | ERR_CLASS_NOT_SCHEDULED"
    http_status: 409
    applies_to: "order confirm/fulfill, rental create, enrollments create/advance"

  - priority: 9
    category: business_temporal
    check: "Interval and clock rules: SPECIAL_MIX stage only when clock date >= available_date (ERR_MIX_NOT_READY); attendance only at/after class start (ERR_CLASS_NOT_STARTED); PriceBook activation window overlap same scope+customer (ERR_PRICE_BOOK_OVERLAP); TrainingClass room double-booking half-open [start_at,end_at), adjacent allowed (ERR_ROOM_DOUBLE_BOOKED); machine turnaround: new rental start_date must be > greatest closed_at date of that machine's CLOSED rentals + MACHINE_TURNAROUND_BUFFER_DAYS (ERR_RENTAL_OVERLAP)"
    error_id: "ERR_MIX_NOT_READY | ERR_CLASS_NOT_STARTED | ERR_PRICE_BOOK_OVERLAP | ERR_ROOM_DOUBLE_BOOKED | ERR_RENTAL_OVERLAP"
    http_status: 409
    applies_to: "order stage, enrollment advance, price-book activate, training-class create, rental create"

  - priority: 10
    category: business_constraint
    check: "Uniqueness and capacity: account_no/sku/serial_no unique (ERR_DUPLICATE_ACCOUNT / ERR_DUPLICATE_SKU / ERR_DUPLICATE_SERIAL); no second ENROLLED/ATTENDED/NO_SHOW enrollment for same class_id+customer_id+attendee_name (ERR_DUPLICATE_ENROLLMENT); stock per line (ERR_STOCK_INSUFFICIENT); FULL cylinder count per grade for gas lines (ERR_CYLINDER_UNAVAILABLE); route capacity (ERR_ROUTE_CAPACITY_EXCEEDED); machine AVAILABLE / cylinder FULL for rental open (ERR_ASSET_NOT_AVAILABLE); class seats_booked < capacity (ERR_CLASS_FULL); route close requires all orders terminal (ERR_ROUTE_HAS_OPEN_ORDERS); exchange returned/issued grade+count match (ERR_CYLINDER_GRADE_MISMATCH)"
    error_id: "ERR_DUPLICATE_ACCOUNT | ERR_DUPLICATE_SKU | ERR_DUPLICATE_SERIAL | ERR_DUPLICATE_ENROLLMENT | ERR_STOCK_INSUFFICIENT | ERR_CYLINDER_UNAVAILABLE | ERR_ROUTE_CAPACITY_EXCEEDED | ERR_ASSET_NOT_AVAILABLE | ERR_CLASS_FULL | ERR_ROUTE_HAS_OPEN_ORDERS | ERR_CYLINDER_GRADE_MISMATCH"
    http_status: 409
    applies_to: "creates, order confirm/fulfill/cancel, rental create, enrollment create, route close"

  - priority: 11
    category: business_fiscal
    check: "Money rules: NET30 credit check at confirm (ERR_CREDIT_LIMIT_EXCEEDED); CASH pay amount must equal total_cents (ERR_PAYMENT_AMOUNT_MISMATCH); CASH order must be PAID before fulfill (ERR_PAYMENT_REQUIRED); waive_amount_cents <= accrued_unbilled_cents at waive time (ERR_WAIVER_EXCEEDS_ACCRUED); invoice void requires paid_cents == 0 (ERR_INVOICE_NOT_VOIDABLE)"
    error_id: "ERR_CREDIT_LIMIT_EXCEEDED | ERR_PAYMENT_AMOUNT_MISMATCH | ERR_PAYMENT_REQUIRED | ERR_WAIVER_EXCEEDS_ACCRUED | ERR_INVOICE_NOT_VOIDABLE"
    http_status: 409
    applies_to: "order confirm/pay/fulfill, rental waive, invoice void"

# =============================================================================
# §1.5 API Endpoint Table
# Pinned domain constants referenced across endpoints:
#   MACHINE_TURNAROUND_BUFFER_DAYS = 1   (post-close service buffer on Machine)
#   CERT_VALIDITY_DAYS = 1095            (training certification validity)
#   Logical clock default: 2026-08-01T00:00:00Z (see /_clock/set_current_utc)
# =============================================================================
endpoints:
  # --- Customer ---
  - method: POST
    path: "/customers"
    description: "Open a customer account"
    roles: [CounterRep, BranchManager]
    code: 201
    input: [account_no, name, "terms?", "credit_limit_cents?", "price_book_id?"]
    output: Customer
    side_effects: ["status=ACTIVE, computed balances 0"]

  - method: GET
    path: "/customers"
    description: "List customers with pagination and filters"
    roles: [CounterRep, BranchManager, RouteDriver, Trainer, ServiceTech]
    code: 200
    input: ["status?", "terms?", "price_book_id?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  - method: GET
    path: "/customers/{id}"
    description: "Get one customer including computed balance/exposure fields"
    roles: [CounterRep, BranchManager, RouteDriver, Trainer, ServiceTech]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: PATCH
    path: "/customers/{id}"
    description: "Update mutable account fields; the only way to attach/replace a PriceBook after creation (breaks the Customer↔PriceBook creation cycle)"
    roles: [CounterRep, BranchManager]
    code: 200
    input: ["name?", "terms?", "credit_limit_cents?", "price_book_id?"]
    output: Customer
    side_effects: ["increments Customer.version by 1"]

  - method: POST
    path: "/customers/{id}/credit-hold"
    description: "Manual account-status actions: PLACE_HOLD | RELEASE_HOLD | SUSPEND | REINSTATE"
    roles: [BranchManager]
    code: 200
    input: [action]
    output: Customer
    side_effects: ["Customer status transition per state machine; increments Customer.version by 1"]

  - method: POST
    path: "/customers/{id}/payments"
    description: "Apply a payment across the customer's OPEN invoices via payment_waterfall (due_at ASC, then issued_at ASC, then created_at ASC); leftover becomes credit_balance_cents"
    roles: [CounterRep, BranchManager]
    code: 200
    input: [amount_cents, expected_customer_version]
    output: "{ allocations: array, credit_added_cents: integer, outstanding_balance_cents: integer, posted_exposure_cents: integer }"
    side_effects: ["payment_waterfall allocation", "Invoice OPEN→PAID cascades (→ Order.payment_status SETTLED → possible CREDIT_HOLD auto-release)", "increments Customer.version by 1"]

  # --- PriceBook ---
  - method: POST
    path: "/price-books"
    description: "Create a price book (DRAFT). scope=CONTRACT requires customer_id; scope=RETAIL forbids it"
    roles: [BranchManager]
    code: 201
    input: [name, scope, "customer_id?", effective_from, effective_to, default_discount_pct, "volume_tiers?"]
    output: PriceBook
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/price-books"
    description: "List price books with filters"
    roles: [CounterRep, BranchManager]
    code: 200
    input: ["customer_id?", "scope?", "status?", "limit?", "offset?"]
    output: PriceBook[]
    side_effects: []

  - method: POST
    path: "/price-books/{id}/activate"
    description: "Activate a DRAFT book; rejects overlapping ACTIVE window for same scope+customer_id (half-open [from,to), adjacency allowed)"
    roles: [BranchManager]
    code: 200
    input: []
    output: PriceBook
    side_effects: ["status DRAFT→ACTIVE; increments PriceBook.version by 1"]

  - method: GET
    path: "/price-books/{id}"
    description: "Get one price book"
    roles: [CounterRep, BranchManager]
    code: 200
    input: []
    output: PriceBook
    side_effects: []

  # --- Product ---
  - method: POST
    path: "/products"
    description: "Register a product/SKU"
    roles: [BranchManager]
    code: 201
    input: [sku, name, category, "gas_grade?", retail_price_cents, "hazmat?", "reorder_point?", "lead_time_days?"]
    output: Product
    side_effects: ["stock_on_hand=0"]

  - method: GET
    path: "/products/{id}"
    description: "Get one product including stock_on_hand and needs_reorder"
    roles: [CounterRep, BranchManager, RouteDriver, Trainer, ServiceTech]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: POST
    path: "/products/{id}/receive"
    description: "Receive stock into branch inventory"
    roles: [BranchManager]
    code: 200
    input: [qty]
    output: Product
    side_effects: ["stock_on_hand += qty; increments Product.version by 1"]

  # --- CylinderAsset ---
  - method: POST
    path: "/cylinder-assets"
    description: "Register a branch-owned cylinder into the float (arrives FULL)"
    roles: [BranchManager]
    code: 201
    input: [serial_no, gas_grade, size]
    output: CylinderAsset
    side_effects: ["status=FULL"]

  - method: GET
    path: "/cylinder-assets"
    description: "List cylinders with filters"
    roles: [CounterRep, BranchManager, RouteDriver]
    code: 200
    input: ["status?", "gas_grade?", "holder_customer_id?", "rental_agreement_id?", "limit?", "offset?"]
    output: CylinderAsset[]
    side_effects: []

  - method: GET
    path: "/cylinder-assets/float-summary"
    description: "Per-grade float reconciliation per float_reconciliation (declared before /cylinder-assets/{id}; literal segment wins over the {id} template)"
    roles: [CounterRep, BranchManager, RouteDriver]
    code: 200
    input: []
    output: "{ grades: array, total_assets: integer, retired_assets: integer }"
    side_effects: []

  - method: GET
    path: "/cylinder-assets/{id}"
    description: "Get one cylinder asset"
    roles: [CounterRep, BranchManager, RouteDriver]
    code: 200
    input: []
    output: CylinderAsset
    side_effects: []

  - method: POST
    path: "/cylinder-assets/{id}/retire"
    description: "Condemn a cylinder (FULL or EMPTY only, never OUT); RETIRED assets are rejected by the safety rule on issue/rental"
    roles: [BranchManager]
    code: 200
    input: []
    output: CylinderAsset
    side_effects: ["status → RETIRED; increments CylinderAsset.version by 1"]

  # --- Machine ---
  - method: POST
    path: "/machines"
    description: "Register a rental weld machine"
    roles: [BranchManager]
    code: 201
    input: [model, serial_no, daily_rate_cents, weekly_rate_cents, monthly_rate_cents]
    output: Machine
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/machines/{id}"
    description: "Get one machine"
    roles: [CounterRep, BranchManager, RouteDriver, ServiceTech]
    code: 200
    input: []
    output: Machine
    side_effects: []

  # --- RentalAgreement ---
  - method: POST
    path: "/rental-agreements"
    description: "Open a cylinder-demurrage or machine rental. Cylinder must be FULL (→OUT, links set); machine must be AVAILABLE (→RENTED) and its start_date must clear the turnaround buffer after any prior CLOSED rental (start_date > greatest prior closed_at date + MACHINE_TURNAROUND_BUFFER_DAYS=1, i.e. closed-at date D blocks start dates <= D+1). grace_days default: 5 for DEMURRAGE, 0 otherwise"
    roles: [CounterRep, BranchManager]
    code: 201
    input: [customer_id, item_type, "cylinder_asset_id?", "machine_id?", rate_plan, start_date, "scheduled_end_date?", "grace_days?"]
    output: RentalAgreement
    side_effects: ["status=ACTIVE", "asset status flip per §1.2", "Customer.accrued_rental_cents picks up the new agreement"]

  - method: GET
    path: "/rental-agreements"
    description: "List rental agreements with filters"
    roles: [CounterRep, BranchManager]
    code: 200
    input: ["customer_id?", "machine_id?", "cylinder_asset_id?", "status?", "limit?", "offset?"]
    output: RentalAgreement[]
    side_effects: []

  - method: GET
    path: "/rental-agreements/{id}"
    description: "Get one agreement including computed accrued_unbilled_cents at the current logical clock"
    roles: [CounterRep, BranchManager]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: []

  - method: POST
    path: "/rental-agreements/{id}/suspend"
    description: "Suspend billing (ACTIVE→SUSPENDED); accrual keeps accruing but billing runs skip SUSPENDED agreements"
    roles: [CounterRep, BranchManager]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: ["status → SUSPENDED; increments RentalAgreement.version by 1"]

  - method: POST
    path: "/rental-agreements/{id}/resume"
    description: "Resume a suspended agreement (SUSPENDED→ACTIVE)"
    roles: [CounterRep, BranchManager]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: ["status → ACTIVE; increments RentalAgreement.version by 1"]

  - method: POST
    path: "/rental-agreements/{id}/close"
    description: "Close from ACTIVE or SUSPENDED: posts final value_ceil charge as Invoice(source=RENTAL_CLOSE) when > 0, releases the asset (cylinder→EMPTY, machine→AVAILABLE), may auto-place CREDIT_HOLD"
    roles: [CounterRep, BranchManager]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: ["status → CLOSED", "final invoice per §1.2 close transition", "asset release", "increments RentalAgreement.version by 1"]

  - method: POST
    path: "/rental-agreements/{id}/waive"
    description: "BranchManager waives accrued demurrage/rental cents (goodwill waiver); requires OCC on the agreement version"
    roles: [BranchManager]
    code: 200
    input: [waive_amount_cents, reason, expected_rental_agreement_version]
    output: RentalAgreement
    side_effects: ["waived_cents += waive_amount_cents", "accrued_unbilled_cents recomputed", "increments RentalAgreement.version by 1"]

  # --- DeliveryRoute ---
  - method: POST
    path: "/delivery-routes"
    description: "Plan a delivery route for a date"
    roles: [CounterRep, BranchManager]
    code: 201
    input: [route_date, truck_capacity_units]
    output: DeliveryRoute
    side_effects: ["status=PLANNED, reserved_units=0"]

  - method: GET
    path: "/delivery-routes/{id}"
    description: "Get one route including computed reserved_units"
    roles: [CounterRep, BranchManager, RouteDriver]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: []

  - method: POST
    path: "/delivery-routes/{id}/dispatch"
    description: "Dispatch a PLANNED route; only after dispatch may its orders be fulfilled by the driver"
    roles: [RouteDriver, BranchManager]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: ["status PLANNED→DISPATCHED; increments DeliveryRoute.version by 1"]

  - method: POST
    path: "/delivery-routes/{id}/close"
    description: "Close a DISPATCHED route; requires every bound order FULFILLED or CANCELLED"
    roles: [RouteDriver, BranchManager]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: ["status DISPATCHED→CLOSED; increments DeliveryRoute.version by 1"]

  # --- Order ---
  - method: POST
    path: "/orders"
    description: "Create an order (DRAFT, payment UNPAID). EXCHANGE/SPECIAL_MIX line product categories enforced by shape validation"
    roles: [CounterRep, BranchManager]
    code: 201
    input: [customer_id, order_type, fulfillment, "route_id?", lines]
    output: Order
    side_effects: ["fulfillment_status=DRAFT", "payment_status=UNPAID", "available_date computed for SPECIAL_MIX"]

  - method: GET
    path: "/orders"
    description: "List orders with filters"
    roles: [CounterRep, BranchManager, RouteDriver]
    code: 200
    input: ["customer_id?", "route_id?", "invoice_id?", "fulfillment_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: GET
    path: "/orders/{id}"
    description: "Get one order with pricing snapshot and both state dimensions"
    roles: [CounterRep, BranchManager, RouteDriver]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: POST
    path: "/orders/{id}/confirm"
    description: "DRAFT→CONFIRMED: snapshots contract pricing, reserves stock and route units, runs the NET30 projected-exposure credit check (== limit passes)"
    roles: [CounterRep, BranchManager]
    code: 200
    input: []
    output: Order
    side_effects: ["contract_price_resolution + order_total_aggregation", "stock reservation", "route reserved_units += units", "increments Order.version by 1"]

  - method: POST
    path: "/orders/{id}/stage"
    description: "CONFIRMED→STAGED; SPECIAL_MIX orders stage only once the logical clock reaches available_date"
    roles: [CounterRep, BranchManager]
    code: 200
    input: []
    output: Order
    side_effects: ["increments Order.version by 1"]

  - method: POST
    path: "/orders/{id}/pay"
    description: "Take counter payment for a CASH customer's order; amount must equal total_cents exactly; payment_status UNPAID→PAID while fulfillment stays put"
    roles: [CounterRep, BranchManager]
    code: 200
    input: [amount_cents]
    output: Order
    side_effects: ["payment_status → PAID; increments Order.version by 1"]

  - method: POST
    path: "/orders/{id}/fulfill"
    description: "STAGED→FULFILLED. WILL_CALL: CounterRep/BranchManager. ROUTE: RouteDriver/BranchManager and route must be DISPATCHED. Gas lines require issued_asset_ids; EXCHANGE additionally requires returned_asset_ids (customer's held cylinders). NET30 orders post their invoice here (credit-hold cascade hop 1)"
    roles: [CounterRep, RouteDriver, BranchManager]
    code: 200
    input: ["issued_asset_ids?", "returned_asset_ids?"]
    output: Order
    side_effects: ["asset issue/return flips", "Invoice creation for NET30", "Customer exposure recompute → possible auto CREDIT_HOLD", "increments Order.version by 1"]

  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel from DRAFT/CONFIRMED/STAGED; restores reserved stock and releases route units"
    roles: [CounterRep, BranchManager]
    code: 200
    input: []
    output: Order
    side_effects: ["stock restore (if confirmed+)", "route reserved_units -= units (if ROUTE and confirmed+)", "increments Order.version by 1"]

  # --- Invoice / billing ---
  - method: GET
    path: "/invoices"
    description: "List invoices with filters"
    roles: [CounterRep, BranchManager]
    code: 200
    input: ["customer_id?", "order_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: GET
    path: "/invoices/{id}"
    description: "Get one invoice"
    roles: [CounterRep, BranchManager]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/invoices/{id}/void"
    description: "Void an OPEN invoice with paid_cents == 0; ORDER-sourced voids revert the order's payment_status to UNPAID; may auto-release CREDIT_HOLD"
    roles: [BranchManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status → VOID", "Customer exposure recompute", "Order.payment_status INVOICED→UNPAID when source=ORDER", "increments Invoice.version by 1"]

  - method: POST
    path: "/billing/run-rental-cycle"
    description: "Monthly demurrage/rental billing run (ops-run checkpoint). For every RentalAgreement with status ACTIVE, computes the billed_cycle (floor) amount at the current logical clock; agreements with a positive amount are grouped per customer into one Invoice(source=RENTAL_CYCLE) per customer; advances billed_through_date and lifetime_billed_cents; new invoices may auto-place CREDIT_HOLD"
    roles: [BranchManager]
    code: 200
    input: []
    output: "{ invoices_created: integer, invoice_ids: array, total_billed_cents: integer }"
    side_effects: ["Invoice creation per affected customer", "agreement billing watermarks advance", "Customer exposure recompute → possible auto CREDIT_HOLD"]

  # --- Training ---
  - method: POST
    path: "/training-classes"
    description: "Schedule a safety class; same room may not hold overlapping SCHEDULED classes — half-open [start_at,end_at), so a class starting exactly when another ends is allowed"
    roles: [Trainer, BranchManager]
    code: 201
    input: [title, room, start_at, end_at, capacity, price_cents]
    output: TrainingClass
    side_effects: ["status=SCHEDULED, seats_booked=0"]

  - method: GET
    path: "/training-classes/{id}"
    description: "Get one class including computed seats_booked"
    roles: [CounterRep, BranchManager, Trainer]
    code: 200
    input: []
    output: TrainingClass
    side_effects: []

  - method: POST
    path: "/training-classes/{id}/advance"
    description: "to=COMPLETED (requires clock >= end_at) or to=CANCELLED (cascades: ENROLLED enrollments → CANCELLED)"
    roles: [Trainer, BranchManager]
    code: 200
    input: [to]
    output: TrainingClass
    side_effects: ["status transition", "enrollment cascade on cancel", "increments TrainingClass.version by 1"]

  - method: POST
    path: "/enrollments"
    description: "Enroll an attendee; class must be SCHEDULED and seats_booked < capacity (seats == capacity is full); duplicate class+customer+attendee rejected"
    roles: [CounterRep, Trainer, BranchManager]
    code: 201
    input: [class_id, customer_id, attendee_name]
    output: TrainingEnrollment
    side_effects: ["status=ENROLLED", "seats_booked += 1"]

  - method: GET
    path: "/enrollments"
    description: "List enrollments with filters"
    roles: [CounterRep, BranchManager, Trainer]
    code: 200
    input: ["class_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: TrainingEnrollment[]
    side_effects: []

  - method: GET
    path: "/enrollments/{id}"
    description: "Get one enrollment"
    roles: [CounterRep, BranchManager, Trainer]
    code: 200
    input: []
    output: TrainingEnrollment
    side_effects: []

  - method: POST
    path: "/enrollments/{id}/advance"
    description: "ENROLLED → ATTENDED (issues cert_code + cert_expires_at=clock+CERT_VALIDITY_DAYS=1095 days; requires class SCHEDULED and clock >= class start) | NO_SHOW | CANCELLED (frees the seat). CounterRep may advance only to=CANCELLED; ATTENDED/NO_SHOW require Trainer or BranchManager"
    roles: [CounterRep, Trainer, BranchManager]
    code: 200
    input: [to]
    output: TrainingEnrollment
    side_effects: ["status transition", "certification issuance on ATTENDED", "seats_booked recompute on CANCELLED", "increments TrainingEnrollment.version by 1"]

  # --- RepairTicket ---
  - method: POST
    path: "/repair-tickets"
    description: "Intake a customer-owned machine for repair"
    roles: [ServiceTech, BranchManager]
    code: 201
    input: [customer_id, machine_desc, issue_desc]
    output: RepairTicket
    side_effects: ["status=INTAKE, revision_no=0"]

  - method: GET
    path: "/repair-tickets"
    description: "List repair tickets with filters"
    roles: [ServiceTech, BranchManager, CounterRep]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: RepairTicket[]
    side_effects: []

  - method: GET
    path: "/repair-tickets/{id}"
    description: "Get one repair ticket"
    roles: [ServiceTech, BranchManager, CounterRep]
    code: 200
    input: []
    output: RepairTicket
    side_effects: []

  - method: POST
    path: "/repair-tickets/{id}/advance"
    description: "Drive the repair state machine: to ∈ {DIAGNOSING, QUOTED, APPROVED, REJECTED, IN_REPAIR, READY_FOR_PICKUP, CLOSED}; quote_cents required for QUOTED; APPROVED/REJECTED require BranchManager, other transitions require ServiceTech or BranchManager; invalid from→to pairs → ERR_INVALID_STATE"
    roles: [ServiceTech, BranchManager]
    code: 200
    input: [to, "quote_cents?"]
    output: RepairTicket
    side_effects: ["status transition per §1.2", "revision_no/quote_cents bookkeeping on re-quote", "charged_cents set on CLOSED", "increments RepairTicket.version by 1"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Server startup default is exactly 2026-08-01T00:00:00Z — before any set call the logical clock reads this default and never falls back to wall-clock time. All accrual, due-date, expiry, window, and lead-time rules evaluate against this clock."
    roles: [BranchManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["PriceBook ACTIVE→EXPIRED sweep for books whose effective_to <= new clock"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or names no declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint/action (incl. fulfill fulfillment-type split and repair-advance per-target role rules)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, bad type/enum, non-positive quantity, effective_from >= effective_to, start_at >= end_at, route_id/fulfillment pairing wrong, /pay on a NET30 order" }
  - { id: ERR_RENTAL_ITEM_MISMATCH, http: 400, condition: "item_type / asset-field / rate_plan combination inconsistent (cylinder_asset_id required iff CYLINDER; machine_id iff MACHINE; DEMURRAGE cylinders only; DAILY/WEEKLY/MONTHLY machines only)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity's own state does not permit the requested transition" }
  - { id: ERR_CYLINDER_CONDEMNED, http: 409, condition: "A RETIRED cylinder was supplied for issue or rental (pressure-vessel safety)" }
  - { id: ERR_ACCOUNT_ON_HOLD, http: 409, condition: "Customer.status is CREDIT_HOLD or SUSPENDED; blocks order confirm, rental open, enrollment create" }
  - { id: ERR_ROUTE_NOT_ACCEPTING, http: 409, condition: "Confirm onto a route whose status is not PLANNED" }
  - { id: ERR_ROUTE_NOT_DISPATCHED, http: 409, condition: "Fulfill a ROUTE order while its route is not DISPATCHED" }
  - { id: ERR_ROUTE_HAS_OPEN_ORDERS, http: 409, condition: "Close a route that still has orders not in {FULFILLED, CANCELLED}" }
  - { id: ERR_CLASS_NOT_SCHEDULED, http: 409, condition: "Enroll or mark attendance against a class not in SCHEDULED" }
  - { id: ERR_CLASS_NOT_STARTED, http: 409, condition: "Attendance marked before class start_at, or completion attempted before end_at" }
  - { id: ERR_MIX_NOT_READY, http: 409, condition: "Stage a SPECIAL_MIX order before its available_date (lead time not elapsed)" }
  - { id: ERR_PRICE_BOOK_OVERLAP, http: 409, condition: "Activate a book whose [effective_from, effective_to) overlaps another ACTIVE book with same scope and customer_id" }
  - { id: ERR_ROOM_DOUBLE_BOOKED, http: 409, condition: "Create a class whose [start_at, end_at) overlaps another SCHEDULED class in the same room" }
  - { id: ERR_RENTAL_OVERLAP, http: 409, condition: "Machine rental start_date within the turnaround buffer: must be > greatest prior CLOSED rental's closed date + 1 day" }
  - { id: ERR_DUPLICATE_ACCOUNT, http: 409, condition: "account_no already exists" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "sku already exists" }
  - { id: ERR_DUPLICATE_SERIAL, http: 409, condition: "serial_no already exists (cylinder or machine)" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "Same class_id + customer_id + attendee_name already has a non-CANCELLED enrollment" }
  - { id: ERR_STOCK_INSUFFICIENT, http: 409, condition: "Product.stock_on_hand < line qty at confirm" }
  - { id: ERR_CYLINDER_UNAVAILABLE, http: 409, condition: "Not enough FULL cylinders of the required gas_grade to confirm the order" }
  - { id: ERR_ROUTE_CAPACITY_EXCEEDED, http: 409, condition: "reserved_units + order.units > truck_capacity_units at confirm (== capacity is allowed)" }
  - { id: ERR_ASSET_NOT_AVAILABLE, http: 409, condition: "Machine not AVAILABLE or cylinder not FULL at rental open" }
  - { id: ERR_CYLINDER_GRADE_MISMATCH, http: 409, condition: "Issued/returned asset grades or counts do not match the order's gas lines, or returned assets are not OUT under this customer" }
  - { id: ERR_CLASS_FULL, http: 409, condition: "seats_booked >= capacity at enrollment (seats == capacity is full)" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 409, condition: "NET30 confirm would push projected_exposure_cents + order total strictly above credit_limit_cents" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 409, condition: "CASH order payment amount_cents != total_cents" }
  - { id: ERR_PAYMENT_REQUIRED, http: 409, condition: "Fulfill attempted on a CASH order whose payment_status is still UNPAID" }
  - { id: ERR_WAIVER_EXCEEDS_ACCRUED, http: 409, condition: "waive_amount_cents > current accrued_unbilled_cents (== accrued is allowed)" }
  - { id: ERR_INVOICE_NOT_VOIDABLE, http: 409, condition: "Void attempted on an invoice with paid_cents > 0, or on a non-OPEN invoice" }

# =============================================================================
# §1.7 RBAC Matrix (all roles opaque — staff operators, not persisted entities)
# =============================================================================
roles:
  - name: CounterRep
    description: "Front-counter sales rep: accounts, orders, will-call fulfillment, payments, rentals, enrollments, route planning"
    identity: opaque
    exclusive_operations:
      - "POST /orders/{id}/pay"
    shared_operations:
      - "POST/GET /customers and GET lists"
      - "POST /customers/{id}/payments (with BranchManager)"
      - "POST /orders and all order actions (with BranchManager; fulfill limited to WILL_CALL)"
      - "POST /rental-agreements and suspend/resume/close (with BranchManager)"
      - "POST /delivery-routes (with BranchManager)"
      - "POST /enrollments (with Trainer, BranchManager)"
      - "POST /enrollments/{id}/advance to=CANCELLED only"
      - "GET endpoints scoped by role lists in §1.5"

  - name: BranchManager
    description: "Branch manager: full override — catalog, float, price books, waivers, credit holds, invoice voids, billing runs, clock"
    identity: opaque
    exclusive_operations:
      - "POST /price-books, POST /price-books/{id}/activate"
      - "POST /products, POST /products/{id}/receive"
      - "POST /cylinder-assets, POST /cylinder-assets/{id}/retire"
      - "POST /machines"
      - "POST /customers/{id}/credit-hold"
      - "POST /rental-agreements/{id}/waive"
      - "POST /invoices/{id}/void"
      - "POST /billing/run-rental-cycle"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "Every CounterRep operation (hierarchical override), both fulfill types"
      - "TrainingClass/Enrollment/RepairTicket actions shared with Trainer/ServiceTech"

  - name: RouteDriver
    description: "Delivery driver: dispatches and closes routes, fulfills ROUTE orders at the stop"
    identity: opaque
    exclusive_operations:
      - "POST /delivery-routes/{id}/dispatch"
      - "POST /delivery-routes/{id}/close"
    shared_operations:
      - "POST /orders/{id}/fulfill for ROUTE orders (with BranchManager)"
      - "GET /orders, /orders/{id}, /delivery-routes/{id}, /cylinder-assets*, /customers*"

  - name: Trainer
    description: "Safety training instructor: schedules classes, enrolls attendees, marks attendance, issues certifications"
    identity: opaque
    exclusive_operations:
      - "POST /training-classes (with BranchManager)"
      - "POST /training-classes/{id}/advance"
      - "POST /enrollments/{id}/advance"
    shared_operations:
      - "POST /enrollments (with CounterRep, BranchManager)"
      - "GET /training-classes/{id}, /enrollments, /customers*"

  - name: ServiceTech
    description: "Repair technician: intake, diagnosis, quoting, repair execution on customer-owned machines"
    identity: opaque
    exclusive_operations:
      - "POST /repair-tickets"
      - "POST /repair-tickets/{id}/advance to DIAGNOSING/QUOTED/IN_REPAIR/READY_FOR_PICKUP/CLOSED"
    shared_operations:
      - "GET /repair-tickets*, /machines/{id}, /customers*"
      - "BranchManager shares all advance targets and exclusively owns APPROVED/REJECTED"
