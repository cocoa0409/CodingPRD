      - name: occ_stale_version_on_route_retire_after_resale_filing
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[route-retire-stale-route]", "errors[ERR_STALE_VERSION]", entities.Route.fields.resale_status]
        distinguishing_aspect: "Retiring with the version read before a resale filing is refused with ERR_STALE_VERSION 412 because the filing legitimately advanced the route's version; re-reading and retiring is then blocked by the pending resale instead, showing the two guard layers."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 SUSPENDED with a QUALIFIED territory and resale_status NONE; clock 2026-09-07"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/territory", payload: { action: DEVELOP, territory_points: 90 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: SUSPEND }, as: FranchiseManager, captures: { r1_ver_read: "$.data.version", r1_suspended: "$.data.route_status" } }
          trigger:
            - { call: "POST /retail/routes/${r1_id}/resale", payload: { action: FILE, buyer_training_status: ENROLLED, buyer_training_points: 10 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_resale: "$.data.resale_status", r1_ver_advanced: "$.data.version" } }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: RETIRE, expected_route_version: "${r1_ver_read}" }, as: FranchiseManager, captures: { stale_error: "$.data.error_id" } }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: RETIRE, expected_route_version: "${r1_ver_advanced}" }, as: FranchiseManager, captures: { pending_error: "$.data.error_id" } }
          assert:
            - "the route version read before the filing was ${r1_ver_read} and the filing advanced it to ${r1_ver_advanced}"
            - "RETIRE with the stale ${r1_ver_read} captures ${stale_error} == ERR_STALE_VERSION with http 412"
            - "RETIRE with the fresh ${r1_ver_advanced} passes the OCC gate but then captures ${pending_error} == ERR_RESALE_ALREADY_PENDING with http 409"
            - "Route.${r1_id}.route_status remains SUSPENDED after both refusals"

      - name: occ_version_increments_on_every_parent_write
        claim_type: derived_field_reconciliation
        grounds: [entities.Route.fields.version, entities.ProductOrder.fields.version, "concurrency_rules[pledge-create-stale-order]"]
        distinguishing_aspect: "The parent's version is a monotonically increasing counter: each accepted write on the route and on the replenishment order advances it by exactly one, so the value read at any point is a faithful staleness token."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 IN_SERVICE; product P1 at cost 30000; clock 2026-09-07"]
