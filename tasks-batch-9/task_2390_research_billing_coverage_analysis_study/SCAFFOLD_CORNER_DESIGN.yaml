  - section: rbac
    instances:
      - name: compliance_reviewer_performs_its_exclusive_determination
        claim_type: role_permitted_operations
        grounds:
          - rbac.ComplianceReviewer.exclusive_operations
          - rbac.ComplianceReviewer.shared_operations
        distinguishing_aspect: "The role that owns the QCT determination executes it for 200 and can also read the compliance dashboard listed in its shared_operations, while the write it performs is one no other role may issue."
        test_recipe:
          setup:
            - "One INDUSTRY_SPONSORED IND_HELD study with registry number NCT10000160."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C60", title: "Corner permitted-ops probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true, registry_number: "NCT10000160" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id" }
          trigger:
            - call: "POST /research-billing/studies/${study_id}/qct-determination"
              payload: { basis: "DEEMED_IND_IDE" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
          assert:
            - "trigger response 200 with qct_determination == \"DEEMED_QUALIFYING\" and qct_determined_by_user_id == \"reviewer_1\""
            - "GET /research-billing/studies/${study_id}/charge-review-summary as ComplianceReviewer returns 200 with billing_hold_posture == \"OPEN\""
            - "GET /research-billing/studies/${study_id} as ComplianceReviewer returns 200 - all GET endpoints are shared"
            - "the identical determination issued as ResearchBillingManager returns 403 ERR_UNAUTHORIZED even though that role registered the study"

      - name: study_coordinator_cannot_approve_a_coverage_analysis
        claim_type: role_denied_operations
        grounds:
          - rbac.ComplianceReviewer.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
          - validations[priority 2]
        distinguishing_aspect: "Priority 2 rejects the approval with 403 ERR_UNAUTHORIZED before any state check runs - the analysis is genuinely UNDER_REVIEW and would have been approvable, and the same call from ComplianceReviewer succeeds unchanged."
        test_recipe:
          setup:
            - "One study whose analysis carries one item and is UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C61", title: "Corner denied-ops probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "80053", description: "Comprehensive metabolic panel", classification: "ROUTINE_CARE", medicare_coverage_basis: "STANDARD_OF_CARE", budget_category: "PER_PATIENT", charge_master_unit_cents: 9000, negotiated_unit_cents: 9000, units_per_occurrence: 1, expected_occurrences: 3 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { status_before: "$.data.status" }
          trigger:
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/approve"
              as: StudyCoordinator
              as_user_id: "coord_1"
              captures: { observed_error: "$.data.error_id" }
          assert:
            - "setup: status_before == \"UNDER_REVIEW\""
            - "trigger response 403 with error_id == \"ERR_UNAUTHORIZED\""
            - "GET /research-billing/coverage-analyses/${analysis_id} still shows status == \"UNDER_REVIEW\", approved_at == null and version == 3"
            - "the same approval as CoverageAnalyst also returns 403 - preparing the analysis grants no approval right"
            - "the same approval as ComplianceReviewer with X-User-ID reviewer_1 returns 200 with status \"APPROVED\""
            - "POST /research-billing/charges as ResearchBillingManager returns 403 ERR_UNAUTHORIZED - posting charges is the StudyCoordinator's exclusive operation"

      - name: budget_executor_cannot_be_the_budget_builder
        claim_type: segregation_of_duties
        grounds:
          - validations[priority 16]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.Study.transitions[BG-2].preconditions
        distinguishing_aspect: "The acting role is correct (ResearchBillingManager owns both steps) and only the X-User-ID collides, so the refusal is 403 ERR_SEGREGATION_OF_DUTIES rather than ERR_UNAUTHORIZED, and the budget stays BUILT until a different manager executes it."
        test_recipe:
          setup:
            - "One study with an APPROVED analysis whose budget was BUILT by mgr_1."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C62", title: "Corner SoD probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "J9999", description: "Investigational infusion", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "PER_PATIENT", charge_master_unit_cents: 55000, negotiated_unit_cents: 40000, units_per_occurrence: 1, expected_occurrences: 1 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
            - call: "GET /research-billing/studies/${study_id}"
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_v3: "$.data.version" }
            - call: "POST /research-billing/studies/${study_id}/budget-build"
              payload: { source_analysis_id: "${analysis_id}", basis: "COVERAGE_DRIVEN", indirect_rate_pct: 32.0, expected_study_version: "${study_v3}" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { builder: "$.data.budget_built_by_user_id", budget_after_build: "$.data.budget_status", version_after_build: "$.data.version" }
          trigger:
            - call: "POST /research-billing/studies/${study_id}/budget-execute"
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { observed_error: "$.data.error_id" }
          assert:
            - "setup: builder == \"mgr_1\", budget_after_build == \"BUILT\" and version_after_build == 4"
            - "trigger response 403 with error_id == \"ERR_SEGREGATION_OF_DUTIES\" - not ERR_UNAUTHORIZED"
            - "GET /research-billing/studies/${study_id} still shows budget_status == \"BUILT\", budget_executed_by_user_id == null and version == 4"
            - "the identical call with X-User-ID mgr_2 returns 200 with budget_status \"EXECUTED\", budget_executed_by_user_id \"mgr_2\" and version 5"
            - "the analysis-approval gate behaves the same way: approving as ComplianceReviewer with X-User-ID equal to prepared_by_user_id returns 403 ERR_SEGREGATION_OF_DUTIES"

  # =========================================================================
  # SECTION 8 - cross_cutting_complexity_layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_study_version_blocks_analysis_creation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[analysis-create-stale-study]
          - errors[ERR_STALE_STUDY_VERSION]
          - validations[priority 8]
        distinguishing_aspect: "The client's study version 1 went stale because the QCT determination bumped the study to 2, so POST /coverage-analyses is refused 412 and no analysis row is created; re-reading the study and resending the same body succeeds."
        test_recipe:
          setup:
            - "One study whose version has advanced from 1 to 2 through a QCT determination recorded after the client read version 1."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C70", title: "Corner OCC probe A", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true, registry_number: "NCT10000170" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/studies/${study_id}/qct-determination"
              payload: { basis: "DEEMED_IND_IDE" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { study_v2: "$.data.version" }
          trigger:
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { observed_error: "$.data.error_id" }
          assert:
            - "setup: study_v1 == 1 and study_v2 == 2 - the determination is a write, so it bumps version"
            - "trigger response 412 with error_id == \"ERR_STALE_STUDY_VERSION\""
            - "GET /research-billing/coverage-analyses?study_id=${study_id} returns total_count == 0"
            - "GET /research-billing/studies/${study_id} still shows lifecycle_status == \"DRAFT\" and version == 2 - the rejected write neither bumped the version nor fired LC-1"
            - "resending the identical body with expected_study_version ${study_v2} returns 201 and moves the study to COVERAGE_PENDING at version 3"

      - name: occ_stale_study_version_blocks_budget_build
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[budget-build-stale-study]
          - errors[ERR_STALE_STUDY_VERSION]
        distinguishing_aspect: "Same error code, different write endpoint and different staleness cause: the analysis approval bumped the study from 2 to 3 between the client's read and the build, so the budget figures the client reasoned about are refused 412 and budget_status stays NOT_BUILT."
        test_recipe:
          setup:
            - "One study at version 3 after analysis creation and approval, where the client still holds the version 2 it read before approval."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C71", title: "Corner OCC probe B", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "GET /research-billing/studies/${study_id}"
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_v2: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "J9999", description: "Investigational infusion", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "PER_PATIENT", charge_master_unit_cents: 55000, negotiated_unit_cents: 40000, units_per_occurrence: 1, expected_occurrences: 1 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
          trigger:
            - call: "POST /research-billing/studies/${study_id}/budget-build"
              payload: { source_analysis_id: "${analysis_id}", basis: "COVERAGE_DRIVEN", indirect_rate_pct: 32.0, expected_study_version: "${study_v2}" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { observed_error: "$.data.error_id" }
          assert:
            - "setup: study_v2 == 2, and the approval advanced the study to version 3 via LC-2"
            - "trigger response 412 with error_id == \"ERR_STALE_STUDY_VERSION\""
            - "GET /research-billing/studies/${study_id} still shows budget_status == \"NOT_BUILT\", effective_indirect_rate_pct == null, per_patient_budget_cents == 0 and version == 3"
            - "resending with expected_study_version 3 (as read from that GET) returns 200 with budget_status \"BUILT\", effective_indirect_rate_pct 32.0 and per_patient_budget_cents 52800"

      - name: occ_stale_analysis_version_blocks_item_add
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[item-add-stale-analysis]
          - errors[ERR_STALE_COVERAGE_ANALYSIS_VERSION]
        distinguishing_aspect: "A different parent entity guards this write: the first item bumped CoverageAnalysis.version from 1 to 2, so a second item quoting version 1 is refused 412 ERR_STALE_COVERAGE_ANALYSIS_VERSION (not the study code) and the classification counters the client reasoned about are left intact."
        test_recipe:
          setup:
            - "One study whose DRAFT analysis already carries one ROUTINE_CARE item, so the analysis is at version 2 while the client still holds version 1."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C72", title: "Corner OCC probe C", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "80053", description: "Comprehensive metabolic panel", classification: "ROUTINE_CARE", medicare_coverage_basis: "STANDARD_OF_CARE", budget_category: "PER_PATIENT", charge_master_unit_cents: 9000, negotiated_unit_cents: 9000, units_per_occurrence: 1, expected_occurrences: 3 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { first_item_id: "$.data.id" }
          trigger:
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "J9999", description: "Investigational infusion", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "PER_PATIENT", charge_master_unit_cents: 55000, negotiated_unit_cents: 40000, units_per_occurrence: 1, expected_occurrences: 1 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { observed_error: "$.data.error_id" }
          assert:
            - "setup: analysis_v1 == 1 and the accepted first item advanced the analysis to version 2"
            - "trigger response 412 with error_id == \"ERR_STALE_COVERAGE_ANALYSIS_VERSION\" - the study-level code is not used here"
            - "GET /research-billing/coverage-analyses/${analysis_id} still shows item_count == 1, routine_care_item_count == 1, research_paid_item_count == 0 and version == 2"
            - "GET /research-billing/coverage-analyses/${analysis_id}/items returns total_count == 1 and that row is ${first_item_id}"
            - "resending the identical body with expected_coverage_analysis_version 2 returns 201 and takes the analysis to version 3"

      - name: layer_cascading_side_effects_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: "transitive_cascade / amendment_implementation_five_level_rebuild_cascade"
          rationale: "That instance verifies the full five-level chain in order, which is exactly this layer's end-to-end claim."

      - name: layer_dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: "dual_variant_calc / budget_basis_variant_divergence_on_same_analysis"
          rationale: "That instance asserts both variants' results and the delta between them on one analysis."

      - name: layer_rate_threshold_triggers
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: "boundary_precision_check / industry_indirect_tier_boundary_at_500000_subtotal"
          rationale: "That instance sits the cumulative subtotal exactly on the rate tier threshold and one cent below it."

  # =========================================================================
  # SECTION 9 - consistency_model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: superseding_approval_reclassifies_existing_charges_within_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /research-billing/coverage-analyses/{id}/approve]
          - calculations.study_ledger_rollup
        distinguishing_aspect: "One approval request re-derives every dependent field before it returns: the prior analysis is SUPERSEDED, the untouched payer-billed charge flips expected_routing_target to SPONSOR and improper_flag to true, and improper_payer_exposure_cents reads 9000 immediately - while aging_days and aging_bucket, the single documented exception, stay stale at 0 / CURRENT."
        test_recipe:
          setup:
            - "One study with a qualifying QCT, an APPROVED analysis A1 classifying 80053 as ROUTINE_CARE, one 9000 charge on 80053 cleared to the payer, and a second analysis A2 superseding A1 that reclassifies 80053 as RESEARCH_PAID and is UNDER_REVIEW at clock 2026-08-20."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-C80", title: "Corner immediate-consistency probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true, registry_number: "NCT10000180" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/studies/${study_id}/qct-determination"
              payload: { basis: "DEEMED_IND_IDE" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { study_v2: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v2}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_1_id: "$.data.id", analysis_1_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_1_id}", expected_coverage_analysis_version: "${analysis_1_v1}", item_code: "80053", description: "Comprehensive metabolic panel", classification: "ROUTINE_CARE", medicare_coverage_basis: "STANDARD_OF_CARE", budget_category: "PER_PATIENT", charge_master_unit_cents: 9000, negotiated_unit_cents: 9000, units_per_occurrence: 1, expected_occurrences: 3 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_1_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_1_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
            - call: "POST /research-billing/charges"
              payload: { study_id: "${study_id}", charge_code: "80053", service_date: "2026-08-01", amount_cents: 9000 }
              as: StudyCoordinator
              as_user_id: "coord_1"
              captures: { charge_id: "$.data.id" }
            - call: "POST /research-billing/charges/${charge_id}/review"
              payload: { decision: "CLEAR_TO_PAYER" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { routing_after_review: "$.data.routing_state", billing_after_review: "$.data.billing_state", improper_after_review: "$.data.improper_flag" }
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ResearchBillingManager
            - call: "GET /research-billing/studies/${study_id}"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { study_v_before_a2: "$.data.version", exposure_before: "$.data.improper_payer_exposure_cents" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v_before_a2}", supersedes_analysis_id: "${analysis_1_id}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_2_id: "$.data.id", analysis_2_v1: "$.data.version", revision_2: "$.data.revision_number" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_2_id}", expected_coverage_analysis_version: "${analysis_2_v1}", item_code: "80053", description: "Comprehensive metabolic panel - now sponsor paid", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "PER_PATIENT", charge_master_unit_cents: 9000, negotiated_unit_cents: 9000, units_per_occurrence: 1, expected_occurrences: 3 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_2_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
          trigger:
            - call: "POST /research-billing/coverage-analyses/${analysis_2_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
          assert:
            - "setup: routing_after_review == \"ROUTED_PAYER\", billing_after_review == \"BILLED_PAYER\", improper_after_review == false, exposure_before == 0, revision_2 == 2"
            - "trigger response 200 with status == \"APPROVED\" and approved_at == \"2026-08-20T00:00:00.000Z\""
            - "GET /research-billing/coverage-analyses/${analysis_1_id} shows status == \"SUPERSEDED\" - the sibling moved inside the approving request, not later"
            - "GET /research-billing/charges/${charge_id} shows expected_routing_target == \"SPONSOR\" and improper_flag == true while routing_state is still \"ROUTED_PAYER\" and billing_state still \"BILLED_PAYER\" - no request touched the charge itself"
            - "GET /research-billing/studies/${study_id} shows improper_payer_exposure_cents == 9000 and payer_billed_cents == 9000 in the very next read"
            - "GET /research-billing/studies/${study_id}/charge-review-summary reports the same 9000 exposure with no refresh call in between"
            - "GET /research-billing/charges/${charge_id} still shows aging_days == 0 and aging_bucket == \"CURRENT\" - the aging epoch is the documented exception and only POST /research-billing/_ops/aging-run refreshes it"
