            - *k_wire_a1
            - *k_verify_w1
            - *k_fund_a1
          trigger:
            - call: "POST /advances/${a1_id}/receipts"
              payload:
                custodian_id: "${cust_id}"
                document_types: ["NOTE", "MORTGAGE"]
                exception_codes: ["MISSING_NOTE", "UNSIGNED_ASSIGNMENT"]
              as: Custodian
              as_user_id: "${cust_id}"
              captures: { rcpt_id: "$.data.id" }
            - call: "POST /receipts/${rcpt_id}/cure"
              payload: { cured_exception_codes: ["MISSING_NOTE", "UNSIGNED_ASSIGNMENT"] }
              as: Custodian
              as_user_id: "${cust_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /advances/${a1_id}/ship"
              payload: { investor_id: "${inv_a_id}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { bl_id: "$.data.id", bl_expires: "$.data.expires_at" }
          assert:
            - "immediately after the exception receipt the pair is (funding_status FUNDED, custody_status RECEIVED_EXCEPTION) with effective_advance_rate 0.93, eligible_collateral_value_cents 1860000000 and required_paydown_cents 60000000"
            - "that receipt raised exactly one MarginCall with trigger_reason == CUSTODY_EXCEPTION, call_amount_cents == 60000000 and status ISSUED, and moved the facility to RESTRICTED"
            - "CustodianReceipt.${rcpt_id}.status == CURED"
            - "immediately after the cure the pair is (funding_status FUNDED, custody_status EXCEPTION_CURED) with effective_advance_rate 0.98, eligible_collateral_value_cents 1960000000 and required_paydown_cents 0"
            - "the CUSTODY_EXCEPTION MarginCall is now status CURED and WarehouseFacility.${fac_id}.status == ACTIVE"
            - "Advance.${a1_id}.funding_status == SHIPPED"
            - "Advance.${a1_id}.custody_status == RELEASED_TO_INVESTOR"
            - "BaileeLetter.${bl_id}.status == ISSUED"
            - "bl_expires == 2026-09-04T00:00:00Z"
            - "Advance.${a1_id}.outstanding_balance_cents == 1920000000"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: cascade_investor_suspension_to_facility_restriction
        grounds:
          - state_machines.TakeoutInvestor.status.APPROVED_to_SUSPENDED
          - state_machines.InvestorCommitment.status.PARTIALLY_ALLOCATED_to_WITHDRAWN
          - state_machines.BaileeLetter.status.ISSUED_to_REVOKED
          - state_machines.MarginCall.status
          - calculations.eligible_collateral_valuation
          - endpoints["POST /investors/{id}/suspend"]
        distinguishing_aspect: |
          One suspend call propagates four causal hops across four entity types —
          TakeoutInvestor SUSPENDED causes InvestorCommitment WITHDRAWN, which orphans the
          Advance onto ORPHAN_RATE 0.85 producing required_paydown_cents 260,000,000, which
          issues a COMMITMENT_WITHDRAWN MarginCall, which restricts the WarehouseFacility —
          plus a parallel fan-out that revokes the in-flight bailee letter.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; canonical ACTIVE facility; investor Alpha APPROVED with an OPEN commitment of 5,000,000,000."
            - "One DRY CONFORMING advance, loan 2,000,000,000, CLEAR receipt, funded to 1,960,000,000 and then shipped to Alpha at 2026-08-05T00:00:00Z so an ISSUED bailee letter is outstanding."
          setup_api_calls:
            - *k_clock_aug1
            - *k_facility
            - *k_par_conforming
            - *k_approve_facility
            - *k_custodian
            - *k_investor_a
            - *k_investor_a_approve
            - *k_commitment_a
            - *k_get_fac_v1
            - *k_post_advance_dry_2b
            - *k_receipt_clear_a1
            - *k_wire_a1
            - *k_verify_w1
            - *k_fund_a1
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /advances/${a1_id}/ship"
              payload: { investor_id: "${inv_a_id}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { bl_id: "$.data.id" }
          trigger:
            - call: "POST /investors/${inv_a_id}/suspend"
              payload: { reason: "Counterparty downgraded below investment grade" }
              as: CreditOfficer
              as_user_id: "co_1"
          assert:
            - "hop 1: TakeoutInvestor.${inv_a_id}.status == SUSPENDED"
            - "hop 2: InvestorCommitment.${comm_a_id}.status == WITHDRAWN and remaining_amount_cents == 0"
            - "hop 3: Advance.${a1_id}.effective_advance_rate == 0.85"
            - "hop 3: Advance.${a1_id}.eligible_collateral_value_cents == 1700000000"
            - "hop 3: Advance.${a1_id}.required_paydown_cents == 260000000"
            - "hop 4: exactly one MarginCall exists for ${a1_id}, with trigger_reason == COMMITMENT_WITHDRAWN, status == ISSUED and call_amount_cents == 260000000"
            - "hop 5: WarehouseFacility.${fac_id}.status == RESTRICTED"
            - "parallel fan-out: BaileeLetter.${bl_id}.status == REVOKED"
            - "Advance.${a1_id}.funding_status == SHIPPED (the cascade re-prices collateral, it does not unwind the shipment)"
            - "Advance.${a1_id}.outstanding_balance_cents == 1960000000"
            - "WarehouseFacility.${fac_id}.outstanding_principal_cents == 1960000000"

      - name: cascade_second_covenant_breach_to_wire_block
        grounds:
          - calculations.covenant_evaluation
          - state_machines.WarehouseFacility.status.RESTRICTED_to_SUSPENDED
          - state_machines.Advance.funding_status.REQUESTED_to_REJECTED
          - state_machines.WireInstruction.status.PENDING_VERIFICATION_to_BLOCKED
          - entities.WarehouseFacility.fields.consecutive_breach_count
          - endpoints["POST /facilities/{id}/covenant-tests"]
        distinguishing_aspect: |
          A different trigger family and a different chain from the suspension cascade: the
          second consecutive unwaived BREACH suspends the facility, the suspension rejects
          every REQUESTED advance with rejected_reason FACILITY_SUSPENDED, and each rejection
          blocks the paired wire with block_reason FACILITY_SUSPENDED — three hops driven by
          a counter crossing 2, not by a status write on the root entity.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; canonical ACTIVE facility with zero funded advances, so the facility-level COVENANT_BREACH margin call computes to floor(0.10 * 0) = 0 and is skipped."
            - "One REQUESTED advance A2 whose wire is still PENDING_VERIFICATION, booked while the facility was ACTIVE."
            - "One stored CovenantTest for period_end 2026-03-31 with net_income_cents 15,000,000, BREACHed under ANNUALIZED_QUARTER and left unwaived, so consecutive_breach_count is 1 and the facility is RESTRICTED."
          setup_api_calls:
            - *k_clock_aug1
            - *k_facility
            - *k_par_conforming
            - *k_approve_facility
            - *k_custodian
            - *k_investor_a
            - *k_investor_a_approve
            - *k_commitment_a
            - *k_get_fac_v1
            - call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust_id}"
                investor_commitment_id: "${comm_a_id}"
                product_code: "CONFORMING"
                loan_amount_cents: 800000000
                note_rate: 0.0675
                funding_type: "DRY"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v1}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { a2_id: "$.data.id" }
            - call: "GET /advances/${a2_id}/wire-instructions"
              payload: {}
              as: WireOperator
              as_user_id: "wo_1"
              captures: { w2_id: "$.data[0].id" }
            - call: "POST /facilities/${fac_id}/covenant-tests"
              payload: { period_end: "2026-03-31", tangible_net_worth_cents: 2000000000, liquidity_cents: 800000000, net_income_cents: 15000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { ct1_id: "$.data.id" }
          trigger:
            - call: "POST /facilities/${fac_id}/covenant-tests"
              payload: { period_end: "2026-06-30", tangible_net_worth_cents: 2000000000, liquidity_cents: 800000000, net_income_cents: 15000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { ct2_id: "$.data.id" }
          assert:
            - "CovenantTest.${ct1_id}.status == BREACH and breach_codes == [PROFITABILITY]"
            - "hop 1: CovenantTest.${ct2_id}.profitability_variant == ANNUALIZED_QUARTER, profitability_metric_cents == 60000000, breach_codes == [PROFITABILITY], status == BREACH"
            - "hop 2: WarehouseFacility.${fac_id}.consecutive_breach_count == 2 and status == SUSPENDED"
            - "hop 3: Advance.${a2_id}.funding_status == REJECTED and rejected_reason == FACILITY_SUSPENDED"
            - "hop 4: WireInstruction.${w2_id}.status == BLOCKED and block_reason == FACILITY_SUSPENDED"
            - "GET /facilities/${fac_id}/margin-calls returns total_count == 0 — a zero-amount covenant call is never materialised"
            - "WarehouseFacility.${fac_id}.outstanding_principal_cents == 0"
            - "WarehouseFacility.${fac_id}.last_covenant_status == BREACH"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: priority_pair_facility_state_outranks_availability_fiscal
        grounds:
          - validations[priority=10]
          - validations[priority=38]
          - errors.ERR_FACILITY_NOT_ACTIVE
          - errors.ERR_FACILITY_AVAILABILITY_EXCEEDED
          - endpoints["POST /advances/{id}/fund"]
        distinguishing_aspect: |
          Both a state rule (priority 10) and a business_fiscal rule (priority 38) are
          violated by the same fund call. The pair is falsifiable in one recipe: while the
          facility is RESTRICTED the call returns 409 ERR_FACILITY_NOT_ACTIVE, and after the
          margin call is waived — which restores ACTIVE without restoring one cent of
          headroom — the identical call returns 422 ERR_FACILITY_AVAILABILITY_EXCEEDED.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "A deliberately small facility: committed_amount_cents 1,000,000,000, CONFORMING advance_rate 1.0 with wet_haircut 0.0 and product_sublimit_cents 5,000,000,000, commitment of 5,000,000,000 — so availability is the only fiscal bucket that can bind."
            - "Advance A1 (DRY, loan 1,000,000,000) and advance A2 (DRY, loan 100,000,000) are both booked while the facility is ACTIVE, both with CLEAR receipts and VERIFIED wires."
            - "A1 is funded at exactly 1,000,000,000, taking availability_cents to 0."
            - "A1 is then marked down to market_value_cents 900,000,000, which issues a VALUATION_DECLINE margin call of 100,000,000 and moves the facility ACTIVE -> RESTRICTED."
          setup_api_calls:
            - *k_clock_aug1
            - call: "POST /facilities"
              payload:
                borrower_legal_name: "Narrow Line Mortgage Co"
                committed_amount_cents: 1000000000
                wet_sublimit_cents: 1000000000
                aged_sublimit_cents: 1000000000
                scratch_and_dent_sublimit_cents: 1000000000
                min_tangible_net_worth_cents: 1
                min_liquidity_cents: 1
                min_ttm_net_income_cents: 1
                max_investor_concentration_pct: 0.35
                bailee_period_days: 30
                unused_line_fee_rate: 0.0025
                settlement_account_last4: "4417"
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_id: "$.data.id" }
            - call: "POST /facilities/${fac_id}/product-advance-rates"
              payload:
                product_code: "CONFORMING"
                advance_rate: 1.0
                wet_funding_allowed: true
                wet_haircut: 0.0
                dwell_limit_days: 30
                aging_step_days: 15
                curtailment_step_rate: 0.005
                product_sublimit_cents: 5000000000
              as: CreditOfficer
              as_user_id: "co_1"
            - *k_approve_facility
            - *k_custodian
            - *k_investor_a
            - *k_investor_a_approve
            - *k_commitment_a
            - *k_get_fac_v1
            - call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust_id}"
                investor_commitment_id: "${comm_a_id}"
                product_code: "CONFORMING"
                loan_amount_cents: 1000000000
                note_rate: 0.0650
                funding_type: "DRY"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v1}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { a1_id: "$.data.id" }
            - *k_receipt_clear_a1
            - *k_wire_a1
            - *k_verify_w1
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_v2: "$.data.version" }
            - call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust_id}"
                investor_commitment_id: "${comm_a_id}"
                product_code: "CONFORMING"
                loan_amount_cents: 100000000
                note_rate: 0.0650
                funding_type: "DRY"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v2}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { a2_id: "$.data.id" }
            - call: "POST /advances/${a2_id}/receipts"
              payload: { custodian_id: "${cust_id}", document_types: ["NOTE", "MORTGAGE", "ASSIGNMENT", "TITLE_POLICY"] }
              as: Custodian
              as_user_id: "${cust_id}"
            - call: "GET /advances/${a2_id}/wire-instructions"
              payload: {}
              as: WireOperator
              as_user_id: "wo_1"
              captures: { w2_id: "$.data[0].id" }
            - call: "POST /wire-instructions/${w2_id}/decision"
              payload: { decision: "VERIFY", callback_reference: "CB-502" }
              as: WireOperator
              as_user_id: "wo_1"
            - *k_fund_a1
            - call: "GET /advances/${a1_id}"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { adv_v1: "$.data.version" }
            - call: "POST /advances/${a1_id}/valuation"
              payload: { market_value_cents: 900000000, expected_advance_version: "${adv_v1}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "GET /facilities/${fac_id}/margin-calls"
              payload: { status: "ISSUED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { mc1_id: "$.data[0].id" }
          trigger:
            - call: "POST /advances/${a2_id}/fund"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "POST /margin-calls/${mc1_id}/waive"
              payload: { reason: "Third-party appraisal supports par valuation" }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /advances/${a2_id}/fund"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
          assert:
            - "WarehouseFacility.${fac_id}.availability_cents == 0 before the first fund attempt"
            - "the first fund attempt returns HTTP 409 with error_id == ERR_FACILITY_NOT_ACTIVE (priority 10 wins over priority 38)"
            - "MarginCall.${mc1_id}.call_amount_cents == 100000000 and status == WAIVED after the waive"
            - "WarehouseFacility.${fac_id}.status == ACTIVE after the waive"
            - "WarehouseFacility.${fac_id}.availability_cents == 0 after the waive — waiving does not restore headroom"
            - "the second fund attempt returns HTTP 422 with error_id == ERR_FACILITY_AVAILABILITY_EXCEEDED"
            - "Advance.${a2_id}.funding_status == REQUESTED after both attempts"
            - "WarehouseFacility.${fac_id}.outstanding_principal_cents == 1000000000"

      - name: priority_pair_investor_referential_outranks_commitment_constraint
        grounds:
          - validations[priority=25]
          - validations[priority=27]
          - errors.ERR_INVESTOR_NOT_APPROVED
          - errors.ERR_COMMITMENT_INVESTOR_MISMATCH
          - endpoints["POST /advances/{id}/ship"]
        distinguishing_aspect: |
          A different pair on a different endpoint and a different category boundary —
          business_referential (25) against business_constraint (27) rather than state
          against fiscal. Shipping to a SUSPENDED investor who is also not the commitment's
          investor returns ERR_INVESTOR_NOT_APPROVED; shipping to an APPROVED investor who is
          merely the wrong one returns ERR_COMMITMENT_INVESTOR_MISMATCH, proving 25 outranks 27.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; canonical ACTIVE facility."
            - "Three investors: Alpha (APPROVED, owns the commitment the advance is allocated to), Bravo (APPROVED then SUSPENDED, holds no commitment) and Charlie (APPROVED, holds no commitment)."
            - "One DRY CONFORMING advance, loan 2,000,000,000, CLEAR receipt, funded to 1,960,000,000, custody RECEIVED_CLEAR, allocated to Alpha's commitment — so the only rules capable of firing on ship are 25 and 27."
          setup_api_calls:
            - *k_clock_aug1
            - *k_facility
            - *k_par_conforming
            - *k_approve_facility
            - *k_custodian
            - *k_investor_a
            - *k_investor_a_approve
            - *k_commitment_a
            - call: "POST /facilities/${fac_id}/investors"
              payload: { investor_name: "Bravo Capital Markets", counterparty_rating: "B", concentration_limit_pct: 0.60 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { inv_b_id: "$.data.id" }
            - call: "POST /investors/${inv_b_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /investors/${inv_b_id}/suspend"
              payload: { reason: "Failed to fund two prior take-outs" }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /facilities/${fac_id}/investors"
              payload: { investor_name: "Charlie Loan Trust", counterparty_rating: "A", concentration_limit_pct: 0.60 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { inv_c_id: "$.data.id" }
            - call: "POST /investors/${inv_c_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - *k_get_fac_v1
            - *k_post_advance_dry_2b
            - *k_receipt_clear_a1
            - *k_wire_a1
            - *k_verify_w1
            - *k_fund_a1
          trigger:
            - call: "POST /advances/${a1_id}/ship"
              payload: { investor_id: "${inv_b_id}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "POST /advances/${a1_id}/ship"
              payload: { investor_id: "${inv_c_id}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "POST /advances/${a1_id}/ship"
              payload: { investor_id: "${inv_a_id}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { bl_ok_id: "$.data.id" }
          assert:
            - "TakeoutInvestor.${inv_b_id}.status == SUSPENDED and TakeoutInvestor.${inv_c_id}.status == APPROVED"
            - "shipping to ${inv_b_id} returns HTTP 422 with error_id == ERR_INVESTOR_NOT_APPROVED (priority 25 wins over priority 27, both of which are violated)"
            - "shipping to ${inv_c_id} returns HTTP 422 with error_id == ERR_COMMITMENT_INVESTOR_MISMATCH (only priority 27 is violated)"
            - "shipping to ${inv_a_id} returns HTTP 201"
            - "BaileeLetter.${bl_ok_id}.investor_id == ${inv_a_id} and status == ISSUED"
            - "GET /advances/${a1_id}/bailee-letters returns total_count == 1 — neither rejected attempt created a letter"
            - "Advance.${a1_id}.funding_status == SHIPPED and custody_status == RELEASED_TO_INVESTOR"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: boundary_dwell_limit_thirty_versus_thirty_one_days
        grounds:
          - calculations.dwell_and_aging_classification
          - entities.ProductAdvanceRate.fields.dwell_limit_days
          - entities.ProductAdvanceRate.fields.aging_step_days
          - entities.ProductAdvanceRate.fields.curtailment_step_rate
          - entities.Advance.fields.dwell_days
          - entities.Advance.fields.is_aged
          - endpoints["POST /facilities/{id}/aging-run"]
        distinguishing_aspect: |
          The dwell limit is strictly-greater-than: at dwell_days exactly 30 the advance is
          not aged, aging_steps is 0 and no curtailment occurs; one logical second later at
          dwell_days 31 aging_steps becomes ceil(1/15) = 1, the rate steps to 0.975 and a
          10,000,000-cent DWELL_EXCEEDED call fires. Off-by-one on either the comparison or
          the ceil turns 0 into 1 or 1 into 2.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; canonical ACTIVE facility (dwell_limit_days 30, aging_step_days 15, curtailment_step_rate 0.005)."
            - "One DRY CONFORMING advance, loan 2,000,000,000, CLEAR receipt, funded at 2026-08-01T00:00:00Z to floor(2,000,000,000 * 0.98) = 1,960,000,000; market_value_cents stays at 2,000,000,000."
          setup_api_calls:
            - *k_clock_aug1
            - *k_facility
            - *k_par_conforming
            - *k_approve_facility
            - *k_custodian
            - *k_investor_a
            - *k_investor_a_approve
            - *k_commitment_a
            - *k_get_fac_v1
            - *k_post_advance_dry_2b
            - *k_receipt_clear_a1
            - *k_wire_a1
            - *k_verify_w1
            - *k_fund_a1
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /facilities/${fac_id}/aging-run"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { run1_calls: "$.data.margin_calls_issued", run1_curtailed: "$.data.curtailed_advance_ids" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /facilities/${fac_id}/aging-run"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { run2_calls: "$.data.margin_calls_issued" }
          assert:
            - "at 2026-08-31T00:00:00Z: Advance.${a1_id}.dwell_days == 30 and is_aged == false"
            - "at 2026-08-31T00:00:00Z: Advance.${a1_id}.effective_advance_rate == 0.98 and eligible_collateral_value_cents == 1960000000 and required_paydown_cents == 0"
            - "run1_calls == 0 and run1_curtailed == []"
            - "WarehouseFacility.${fac_id}.status == ACTIVE after the first aging-run"
            - "at 2026-09-01T00:00:00Z: Advance.${a1_id}.dwell_days == 31 and is_aged == true"
            - "at 2026-09-01T00:00:00Z: Advance.${a1_id}.effective_advance_rate == 0.975 and eligible_collateral_value_cents == 1950000000 and required_paydown_cents == 10000000"
            - "run2_calls == 1"
            - "exactly one MarginCall exists for ${a1_id}, with trigger_reason == DWELL_EXCEEDED, status == ISSUED and call_amount_cents == 10000000"
            - "WarehouseFacility.${fac_id}.status == RESTRICTED after the second aging-run"
            - "WarehouseFacility.${fac_id}.aged_outstanding_cents == 1960000000"

      - name: boundary_empty_collection_blocks_approval_and_zeroes_rollup
        grounds:
          - validations[priority=31]
          - errors.ERR_NO_ADVANCE_RATES_CONFIGURED
          - calculations.facility_exposure_rollup
          - endpoints["POST /facilities/{id}/approve"]
          - endpoints["GET /facilities/{id}/exposure-summary"]
        distinguishing_aspect: |
          A different boundary family from the dwell off-by-one: cardinality zero at two
          sites. Zero ProductAdvanceRate rows is fatal to approval while exactly one is
          sufficient, and a facility with zero advances must roll up every aggregate to a
          literal 0 with investor_exposures == [], never to null and never to an error.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "One PENDING_APPROVAL facility with zero ProductAdvanceRate rows, zero custodians, zero investors, zero commitments and zero advances."
          setup_api_calls:
            - *k_clock_aug1
            - *k_facility
          trigger:
            - call: "POST /facilities/${fac_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_2"
            - call: "GET /facilities/${fac_id}/product-advance-rates"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { rates_before: "$.data" }
            - *k_par_conforming
            - *k_approve_facility
            - call: "GET /facilities/${fac_id}/exposure-summary"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { summary_avail: "$.data.availability_cents" }
          assert:
            - "the first approve attempt returns HTTP 422 with error_id == ERR_NO_ADVANCE_RATES_CONFIGURED"
            - "GET /facilities/${fac_id}/product-advance-rates before the rate row returns total_count == 0 and data == []"
            - "WarehouseFacility.${fac_id}.status == PENDING_APPROVAL after the failed approve"
            - "the second approve attempt returns HTTP 200 with status == ACTIVE — exactly one rate row is sufficient"
            - "exposure-summary committed_amount_cents == 20000000000"
            - "exposure-summary outstanding_principal_cents == 0"
            - "summary_avail == 20000000000"
            - "exposure-summary accrued_fee_balance_cents == 0"
            - "exposure-summary wet_outstanding_cents == 0 and aged_outstanding_cents == 0 and scratch_and_dent_outstanding_cents == 0"
            - "exposure-summary ledger_debit_total_cents == 0 and ledger_credit_total_cents == 0 and advance_outstanding_sum_cents == 0"
            - "exposure-summary investor_exposures == [] and open_margin_call_count == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: cross_entity_facility_reinstate_blocked_by_open_margin_call
        grounds:
          - validations[priority=18]
          - errors.ERR_OPEN_MARGIN_CALL
          - state_machines.WarehouseFacility.status.SUSPENDED_to_ACTIVE
          - state_machines.MarginCall.status.ISSUED_to_WAIVED
          - endpoints["POST /facilities/{id}/reinstate"]
        distinguishing_aspect: |
          The WarehouseFacility row is a perfectly valid SUSPENDED row and reinstate is a
          legal transition out of SUSPENDED, yet the call fails on the state of a CHILD
          MarginCall it does not reference: an ISSUED call blocks reinstatement with
          ERR_OPEN_MARGIN_CALL, and the identical call succeeds the instant that child is WAIVED.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; canonical ACTIVE facility."
            - "One DRY CONFORMING advance, loan 2,000,000,000, CLEAR receipt, funded to 1,960,000,000."
            - "The advance is marked down to market_value_cents 1,900,000,000, which issues a VALUATION_DECLINE MarginCall of 98,000,000 and moves the facility to RESTRICTED."
            - "The facility is then manually suspended (RESTRICTED -> SUSPENDED), leaving the margin call ISSUED."
          setup_api_calls:
            - *k_clock_aug1
            - *k_facility
            - *k_par_conforming
            - *k_approve_facility
            - *k_custodian
            - *k_investor_a
            - *k_investor_a_approve
            - *k_commitment_a
            - *k_get_fac_v1
            - *k_post_advance_dry_2b
            - *k_receipt_clear_a1
            - *k_wire_a1
            - *k_verify_w1
            - *k_fund_a1
            - call: "GET /advances/${a1_id}"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { adv_v1: "$.data.version" }
            - call: "POST /advances/${a1_id}/valuation"
              payload: { market_value_cents: 1900000000, expected_advance_version: "${adv_v1}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "GET /facilities/${fac_id}/margin-calls"
              payload: { status: "ISSUED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { mc1_id: "$.data[0].id" }
            - call: "POST /facilities/${fac_id}/suspend"
              payload: { reason: "Regulatory examination in progress" }
              as: CreditOfficer
              as_user_id: "co_1"
          trigger:
            - call: "POST /facilities/${fac_id}/reinstate"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /margin-calls/${mc1_id}/waive"
              payload: { reason: "Borrower pledged substitute collateral" }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /facilities/${fac_id}/reinstate"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
          assert:
            - "MarginCall.${mc1_id}.call_amount_cents == 98000000 and status == ISSUED before the first reinstate attempt"
            - "the first reinstate attempt returns HTTP 409 with error_id == ERR_OPEN_MARGIN_CALL"
            - "WarehouseFacility.${fac_id}.status == SUSPENDED after the failed reinstate"
            - "MarginCall.${mc1_id}.status == WAIVED after the waive"
            - "the second reinstate attempt returns HTTP 200 with status == ACTIVE"
            - "WarehouseFacility.${fac_id}.open_margin_call_count == 0"
            - "WarehouseFacility.${fac_id}.outstanding_principal_cents == 1960000000"

      - name: cross_entity_dry_funding_blocked_by_custodian_receipt_state
        grounds:
          - validations[priority=22]
          - errors.ERR_CUSTODY_RECEIPT_REQUIRED
          - state_machines.CustodianReceipt.status
          - state_machines.Advance.custody_status.PENDING_RECEIPT_to_RECEIVED_EXCEPTION
          - entities.Advance.fields.custody_status
          - endpoints["POST /advances/{id}/fund"]
        distinguishing_aspect: |
          A different parent/child direction and a different gate from the reinstate case:
          here the Advance is REQUESTED with a VERIFIED wire and full facility headroom, and
          the block comes from the DocumentCustodian's receipt chain. Crucially the gate is
          not mere receipt EXISTENCE — an EXCEPTION receipt (custody RECEIVED_EXCEPTION)
          fails identically to no receipt at all, and only the cure to EXCEPTION_CURED opens it.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; canonical ACTIVE facility."
            - "One DRY CONFORMING advance, loan 2,000,000,000, wire already VERIFIED by wo_1, custody_status PENDING_RECEIPT and no CustodianReceipt rows at all."
          setup_api_calls:
            - *k_clock_aug1
            - *k_facility
            - *k_par_conforming
            - *k_approve_facility
            - *k_custodian
            - *k_investor_a
            - *k_investor_a_approve
            - *k_commitment_a
            - *k_get_fac_v1
            - *k_post_advance_dry_2b
            - *k_wire_a1
            - *k_verify_w1
          trigger:
            - call: "POST /advances/${a1_id}/fund"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "POST /advances/${a1_id}/receipts"
              payload:
                custodian_id: "${cust_id}"
                document_types: ["NOTE", "MORTGAGE", "TITLE_POLICY"]
                exception_codes: ["UNSIGNED_ASSIGNMENT"]
              as: Custodian
              as_user_id: "${cust_id}"
              captures: { rcpt_id: "$.data.id" }
            - call: "POST /advances/${a1_id}/fund"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "POST /receipts/${rcpt_id}/cure"
              payload: { cured_exception_codes: ["UNSIGNED_ASSIGNMENT"] }
              as: Custodian
              as_user_id: "${cust_id}"
            - call: "POST /advances/${a1_id}/fund"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
          assert:
            - "the first fund attempt (no receipt at all) returns HTTP 409 with error_id == ERR_CUSTODY_RECEIPT_REQUIRED"
            - "CustodianReceipt.${rcpt_id}.status == EXCEPTION and Advance.${a1_id}.custody_status == RECEIVED_EXCEPTION"
            - "the second fund attempt (EXCEPTION receipt on file) returns HTTP 409 with error_id == ERR_CUSTODY_RECEIPT_REQUIRED — existence is not the gate, state is"
            - "Advance.${a1_id}.funding_status == REQUESTED after both failed attempts"
            - "WarehouseFacility.${fac_id}.outstanding_principal_cents == 0 after both failed attempts"
            - "CustodianReceipt.${rcpt_id}.status == CURED and Advance.${a1_id}.custody_status == EXCEPTION_CURED after the cure"
            - "the third fund attempt returns HTTP 200"
            - "Advance.${a1_id}.funding_status == FUNDED and advance_amount_cents == 1960000000"
            - "Advance.${a1_id}.effective_advance_rate == 0.98 — the EXCEPTION_HAIRCUT is gone once the receipt is CURED"
            - "WireInstruction.${w1_id}.status == RELEASED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: temporal_bailee_letter_half_open_window_no_overlap
        grounds:
          - validations[priority=24]
          - errors.ERR_BAILEE_WINDOW_OVERLAP
          - entities.BaileeLetter.fields.effective_from
          - entities.BaileeLetter.fields.expires_at
          - entities.WarehouseFacility.fields.bailee_period_days
          - state_machines.Advance.funding_status.SHIPPED_to_SHIPPED
        distinguishing_aspect: |
          Bailee windows are HALF-OPEN [effective_from, expires_at): a re-ship one logical
          second before the incumbent letter's expires_at of 2026-09-04T00:00:00Z is rejected,
          while a re-ship at exactly that instant is accepted with zero gap. An inclusive
          upper bound would wrongly reject the zero-gap case.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; canonical ACTIVE facility with bailee_period_days 30."
            - "One DRY CONFORMING advance, loan 2,000,000,000, CLEAR receipt, funded to 1,960,000,000."
            - "Shipped to Alpha at 2026-08-05T00:00:00Z, producing ISSUED letter L1 with window [2026-08-05T00:00:00Z, 2026-09-04T00:00:00Z)."
            - "No aging-run is executed anywhere in this recipe, so L1 stays ISSUED and the overlap filter still sees it."
          setup_api_calls:
            - *k_clock_aug1
            - *k_facility
            - *k_par_conforming
            - *k_approve_facility
            - *k_custodian
            - *k_investor_a
            - *k_investor_a_approve
            - *k_commitment_a
            - *k_get_fac_v1
            - *k_post_advance_dry_2b
            - *k_receipt_clear_a1
            - *k_wire_a1
            - *k_verify_w1
            - *k_fund_a1
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /advances/${a1_id}/ship"
              payload: { investor_id: "${inv_a_id}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { bl1_id: "$.data.id", bl1_expires: "$.data.expires_at" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T23:59:59Z" }
              as: CreditOfficer
            - call: "POST /advances/${a1_id}/ship"
              payload: { investor_id: "${inv_a_id}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /advances/${a1_id}/ship"
              payload: { investor_id: "${inv_a_id}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { bl2_id: "$.data.id", bl2_expires: "$.data.expires_at" }
          assert:
            - "bl1_expires == 2026-09-04T00:00:00Z and BaileeLetter.${bl1_id}.bailee_period_days == 30"
            - "the re-ship at 2026-09-03T23:59:59Z returns HTTP 422 with error_id == ERR_BAILEE_WINDOW_OVERLAP"
            - "GET /advances/${a1_id}/bailee-letters returns total_count == 1 immediately after the rejected re-ship"
            - "the re-ship at exactly 2026-09-04T00:00:00Z returns HTTP 201 — zero gap is legal under half-open semantics"
            - "BaileeLetter.${bl2_id}.effective_from == 2026-09-04T00:00:00Z"
            - "bl2_expires == 2026-10-04T00:00:00Z"
            - "GET /advances/${a1_id}/bailee-letters returns total_count == 2 and both letters are status ISSUED"
            - "Advance.${a1_id}.funding_status == SHIPPED and custody_status == RELEASED_TO_INVESTOR"

      - name: temporal_commitment_window_closed_interval_with_buffer
        grounds:
          - validations[priority=37]
          - errors.ERR_COMMITMENT_WINDOW_CONFLICT
          - entities.InvestorCommitment.fields.effective_on
          - entities.InvestorCommitment.fields.expires_on
          - endpoints["POST /facilities/{id}/commitments"]
        distinguishing_aspect: |
          The second overlap rule uses the opposite interval convention on a different
          resource: commitment windows are CLOSED on both ends and are widened by
          COMMITMENT_BUFFER_DAYS = 2 on each side before comparison, so a new window starting
          2026-09-02 conflicts with an incumbent ending 2026-08-31 (buffered start 2026-08-31
          touches it) while 2026-09-03 does not. The exclusion is also scoped per investor,
          so the identical rejected window is accepted for a different investor.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; canonical ACTIVE facility."
            - "Investor Alpha APPROVED with one OPEN commitment C1 covering the closed window [2026-08-01, 2026-08-31]."
            - "Investor Bravo APPROVED with no commitments at all."
          setup_api_calls:
            - *k_clock_aug1
            - *k_facility
            - *k_par_conforming
            - *k_approve_facility
            - *k_investor_a
            - *k_investor_a_approve
            - call: "POST /facilities/${fac_id}/commitments"
              payload:
                investor_id: "${inv_a_id}"
                product_code: "CONFORMING"
                committed_amount_cents: 5000000000
                price_pct: 1.0125
                effective_on: "2026-08-01"
                expires_on: "2026-08-31"
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { comm_c1_id: "$.data.id" }
            - call: "POST /facilities/${fac_id}/investors"
              payload: { investor_name: "Bravo Capital Markets", counterparty_rating: "A", concentration_limit_pct: 0.60 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { inv_b_id: "$.data.id" }
            - call: "POST /investors/${inv_b_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
          trigger:
            - call: "POST /facilities/${fac_id}/commitments"
              payload:
                investor_id: "${inv_a_id}"
                product_code: "CONFORMING"
                committed_amount_cents: 3000000000
                price_pct: 1.0100
                effective_on: "2026-09-02"
                expires_on: "2026-09-30"
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /facilities/${fac_id}/commitments"
              payload:
                investor_id: "${inv_b_id}"
                product_code: "CONFORMING"
                committed_amount_cents: 3000000000
                price_pct: 1.0100
                effective_on: "2026-09-02"
                expires_on: "2026-09-30"
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { comm_b1_id: "$.data.id" }
            - call: "POST /facilities/${fac_id}/commitments"
              payload:
                investor_id: "${inv_a_id}"
                product_code: "CONFORMING"
                committed_amount_cents: 3000000000
                price_pct: 1.0100
                effective_on: "2026-09-03"
                expires_on: "2026-09-30"
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { comm_c2_id: "$.data.id" }
          assert:
            - "InvestorCommitment.${comm_c1_id}.status == OPEN with effective_on 2026-08-01 and expires_on 2026-08-31"
            - "the Alpha commitment starting 2026-09-02 returns HTTP 422 with error_id == ERR_COMMITMENT_WINDOW_CONFLICT (buffered start 2026-08-31 touches the incumbent's closed upper end)"
            - "the Bravo commitment with the identical 2026-09-02 window returns HTTP 201 — the exclusion is scoped to one investor"
            - "InvestorCommitment.${comm_b1_id}.investor_id == ${inv_b_id} and status == OPEN"
            - "the Alpha commitment starting 2026-09-03 returns HTTP 201 — a two-day gap clears the buffer exactly"
            - "InvestorCommitment.${comm_c2_id}.effective_on == 2026-09-03 and status == OPEN"
            - "GET /investors/${inv_a_id}/commitments returns total_count == 2"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: invariant_ledger_debits_equal_credits_after_repurchase
        grounds:
          - calculations.facility_exposure_rollup
          - validations[priority=34]
          - errors.ERR_REPURCHASE_AMOUNT_MISMATCH
          - entities.LedgerEntry.fields.direction
          - entities.LedgerEntry.fields.entry_type
          - state_machines.Advance.funding_status.FUNDED_to_REPURCHASED
        distinguishing_aspect: |
          The compensating action is the repurchase: it must append a CREDIT that exactly
          offsets the ADVANCE_FUNDED DEBIT, so after the round trip the principal ledger
          nets to zero, outstanding_principal_cents returns to 0 and availability_cents
          returns to the full 20,000,000,000. Priority 34 forces the compensation to be
          exact — a payment one cent off is rejected rather than silently leaving a residue.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; canonical ACTIVE facility."
            - "One DRY CONFORMING advance, loan 2,000,000,000, CLEAR receipt, funded to 1,960,000,000, producing exactly one ADVANCE_FUNDED DEBIT of 1,960,000,000."
            - "No aging-run is executed, so no FEE_ACCRUAL entry exists and the ledger contains principal entries only."
          setup_api_calls:
            - *k_clock_aug1
            - *k_facility
            - *k_par_conforming
            - *k_approve_facility
            - *k_custodian
            - *k_investor_a
            - *k_investor_a_approve
            - *k_commitment_a
            - *k_get_fac_v1
            - *k_post_advance_dry_2b
            - *k_receipt_clear_a1
            - *k_wire_a1
            - *k_verify_w1
            - *k_fund_a1
          trigger:
            - call: "POST /advances/${a1_id}/repurchase"
              payload: { payment_amount_cents: 1959999999 }
              as: Borrower
              as_user_id: "${fac_id}"
            - call: "POST /advances/${a1_id}/repurchase"
              payload: { payment_amount_cents: 1960000000 }
              as: Borrower
              as_user_id: "${fac_id}"
          assert:
            - "the one-cent-short repurchase returns HTTP 422 with error_id == ERR_REPURCHASE_AMOUNT_MISMATCH"
            - "Advance.${a1_id}.funding_status == FUNDED and outstanding_balance_cents == 1960000000 after the rejected attempt"
            - "GET /advances/${a1_id}/ledger-entries returns total_count == 1 after the rejected attempt"
            - "the exact repurchase returns HTTP 200 with funding_status == REPURCHASED"
            - "GET /advances/${a1_id}/ledger-entries returns total_count == 2: ADVANCE_FUNDED DEBIT 1960000000 then REPURCHASE CREDIT 1960000000"
            - "Advance.${a1_id}.outstanding_balance_cents == 0"
            - "exposure-summary ledger_debit_total_cents == 1960000000 and ledger_credit_total_cents == 1960000000"
            - "exposure-summary advance_outstanding_sum_cents == 0"
            - "WarehouseFacility.${fac_id}.outstanding_principal_cents == 0"
            - "WarehouseFacility.${fac_id}.availability_cents == 20000000000"
            - "InvestorCommitment.${comm_a_id}.allocated_amount_cents == 0 and settled_amount_cents == 0 and remaining_amount_cents == 5000000000"
            - "InvestorCommitment.${comm_a_id}.status == PARTIALLY_ALLOCATED — a commitment that has ever been drawn never returns to OPEN"
            - "TakeoutInvestor.${inv_a_id}.exposure_cents == 0"

      - name: invariant_commitment_capacity_conserved_across_purchase
        grounds:
          - calculations.facility_exposure_rollup
          - entities.InvestorCommitment.fields.allocated_amount_cents
          - entities.InvestorCommitment.fields.settled_amount_cents
          - entities.InvestorCommitment.fields.remaining_amount_cents
          - entities.TakeoutInvestor.fields.exposure_cents
          - state_machines.BaileeLetter.status.ISSUED_to_HONORED
          - endpoints["POST /advances/{id}/purchase"]
        distinguishing_aspect: |
          A different conserved quantity than the ledger identity: the commitment's three
          buckets must satisfy allocated + settled + remaining == committed at every instant,
          and the take-out purchase merely MOVES 1,960,000,000 from allocated to settled
          (0 + 1,960,000,000 + 3,040,000,000 == 5,000,000,000) while simultaneously
          releasing the investor's exposure to 0, because a purchased loan is off the line
          but permanently consumes commitment capacity.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; canonical ACTIVE facility; Alpha's OPEN commitment of 5,000,000,000 at price_pct 1.0125."
            - "One DRY CONFORMING advance, loan 2,000,000,000, CLEAR receipt, funded to 1,960,000,000 (allocated 1,960,000,000 / settled 0 / remaining 3,040,000,000)."
            - "Shipped to Alpha at 2026-08-05T00:00:00Z under an ISSUED bailee letter expiring 2026-09-04T00:00:00Z; no aging-run executed."
            - "Clock advanced to 2026-08-06T00:00:00Z, inside the live bailee window."
          setup_api_calls:
            - *k_clock_aug1
            - *k_facility
            - *k_par_conforming
            - *k_approve_facility
            - *k_custodian
            - *k_investor_a
            - *k_investor_a_approve
            - *k_commitment_a
            - *k_get_fac_v1
            - *k_post_advance_dry_2b
            - *k_receipt_clear_a1
            - *k_wire_a1
            - *k_verify_w1
            - *k_fund_a1
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /advances/${a1_id}/ship"
              payload: { investor_id: "${inv_a_id}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { bl1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: CreditOfficer
          trigger:
