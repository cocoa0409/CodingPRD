      - name: emergency_order_response_days_clamp_to_the_five_day_floor
        claim_type: threshold_boundary
        grounds:
          - calculations.remediation_deadline
          - state_machines.Deficiency.OPEN_to_ORDERED
          - endpoints[POST /deficiencies/{id}/remediation-orders]
        distinguishing_aspect: |
          Two orders issued from the same submission on the same HIGH-hazard dam: CRITICAL gives
          floor(10*0.5)=5 days, which is simultaneously the MIN_RESPONSE_DAYS floor and the
          EMERGENCY_ORDER_MAX_DAYS ceiling, while MINOR gives floor(180*0.5)=90 days and clamps the
          administrator's 400-day request down, never up. The daily rates are 40000 and 3200 cents.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z advanced to 2026-08-05T13:00:00Z."
            - "HIGH-hazard dam (A4 certified) whose submitted inspection reported one CRITICAL and one MINOR deficiency."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
