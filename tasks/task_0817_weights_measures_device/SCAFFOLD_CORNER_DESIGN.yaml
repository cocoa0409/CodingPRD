            - { call: "POST /devices", payload: { establishment_id: "${est_id}", device_type: "SCALE", serial_number: "SN-RBAC2", device_class: "CLASS_III" }, as: ProgramAdmin, captures: { dev_id: "$.data.id", dev_v0: "$.data.version" } }
            - { call: "POST /inspections", payload: { device_id: "${dev_id}", inspector_id: "${insp_id}", inspection_type: "ACCURACY_TEST", scheduled_start: "2026-04-04T09:00:00Z", scheduled_end: "2026-04-04T10:00:00Z", expected_device_version: "${dev_v0}" }, as: Inspector, as_user_id: "${insp_id}", captures: { ins_id: "$.data.id" } }
            - { call: "POST /inspections/${ins_id}/start", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - { call: "POST /inspections/${ins_id}/test-readings", payload: { applied_load: 3000, indicated_value: 3000 }, as: Inspector, as_user_id: "${insp_id}" }
