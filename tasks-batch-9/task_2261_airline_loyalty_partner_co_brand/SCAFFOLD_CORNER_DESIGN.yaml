        distinguishing_aspect: "The same three rows drive two different running totals: mile_balance and outstanding_miles net to 5000 while lifetime_miles counts only the earn bucket and stays at 10000, and a PARTNER_EARN credits zero qualifying miles - so a single naive accumulator cannot satisfy all three."
