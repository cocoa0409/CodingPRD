  - name: confirm_succeeds_when_every_precondition_holds
    claim_type: satisfaction_to_pass
    grounds:
    - validations[priority=10]
    - validations[priority=11]
    - validations[priority=13]
    - validations[priority=16]
    - validations[priority=17]
    - validations[priority=18]
    - validations[priority=23]
    - validations[priority=25]
    - validations[priority=38]
    - state_machines.PostAssignment.TENTATIVE_to_CONFIRMED
    distinguishing_aspect: |
      CONFIRM is the single most heavily guarded action in the scaffold — nine separate §1.4 rules fire on it — so the positive claim is the one that proves the pile of guards does not accidentally reject a well-formed request: the plan is current and unlocked, the gate is OPEN, the guard is VERIFIED with an expiry beyond the window and a credential level clearing the SUPERVISOR floor, the guard has no other booking, the post has a free slot and the line cost fits the remaining budget. All nine pass and the ledger moves exactly once.
