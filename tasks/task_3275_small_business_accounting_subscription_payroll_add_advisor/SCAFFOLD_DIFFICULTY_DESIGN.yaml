              as_user_id: "${company_p_admin_id}"
              captures: { err_recon_p: $.data.error_id }
          assert:
            - "BankConnection.${bc_p_id}.connection_status == STALE (auto-transitioned on sync tick)"
            - "Reconciliation start is rejected (cross-entity gate on BankConnection state)"

      - name: payroll_terminate_blocked_by_subscription_suspended
        grounds:
          - state_machines.PayrollEmployee
          - state_machines.Subscription
        distinguishing_aspect: |
          Pair: PayrollEmployee depends on Subscription. Terminating an
          employee while the parent Subscription is SUSPENDED is rejected —
          different pair than Reconciliation/BankConnection.
