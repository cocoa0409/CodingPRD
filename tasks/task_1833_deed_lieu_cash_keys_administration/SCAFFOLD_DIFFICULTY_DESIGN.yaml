          the lien-clearance gate applies only to DEED_IN_LIEU agreements. A DIL
          accept with an outstanding junior lien (commitment reopened CLEARED ->
          RECEIVED after certification) fails ERR_JUNIOR_LIENS_OUTSTANDING; a
          CASH_FOR_KEYS accept under an identical outstanding lien succeeds.
