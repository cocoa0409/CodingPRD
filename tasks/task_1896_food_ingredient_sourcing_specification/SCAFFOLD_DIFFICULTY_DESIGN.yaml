  - rule_id: resource_temporal_overlap
    instances:
      - name: contract_window_half_open_touching_ok_overlap_rejected
        grounds:
          - validations[priority=13]
          - state_machines.SupplyContract.PENDING_to_ACTIVE
        distinguishing_aspect: |
          Half-open [start, end) semantics on SupplyContract windows of one
          ApprovedSource: a new contract starting exactly at the ACTIVE
          contract's window_end does NOT overlap (activates cleanly), while
          one starting one second earlier DOES (ERR_CONTRACT_WINDOW_OVERLAP).
        test_recipe:
          setup:
            - "ACTIVE source with declarations; ACTIVE contract C1 [2026-01-01, 2026-09-01)"
            - "PENDING contract C2 [2026-09-01, 2027-01-01) — touches C1 end"
