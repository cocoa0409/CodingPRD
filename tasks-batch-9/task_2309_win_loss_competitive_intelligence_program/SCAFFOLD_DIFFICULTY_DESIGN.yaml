      - name: substantiation_rounds_each_evidence_item_before_summing
        grounds:
          - calculations.claim_substantiation_score
          - calculations.claim_substantiation_score.constants.STALE_EVIDENCE_FACTOR
          - entities.BattlecardClaim.fields.substantiation_score
          - entities.BattlecardClaim.fields.substantiation_level
          - entities.BattlecardClaim.fields.risk_class
        distinguishing_aspect: |
          Mode (b) — rounding position inside the formula. Three identical stale
          EVALUATION_CRITERIA items each contribute
          round_half_up(0.70 * 0.90 * 0.75, 2) = round_half_up(0.4725, 2) = 0.47,
          so the pinned round-then-sum order gives 0.47 * 3 = 1.41. Summing first
          and rounding once gives round_half_up(1.4175, 2) = 1.42. The two orders
          differ by exactly 0.01 on this input, so the assert falsifies any
          implementation that sums unrounded contributions.
