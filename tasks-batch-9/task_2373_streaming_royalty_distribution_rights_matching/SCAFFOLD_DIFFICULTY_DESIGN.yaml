  - rule_id: non_linear_state_machine
    instances:
      - name: registration_evidence_loop_bounded_by_round_counter
        grounds:
          - state_machines.RightsRegistration.UNDER_REVIEW_to_NEEDS_EVIDENCE
          - state_machines.RightsRegistration.NEEDS_EVIDENCE_to_UNDER_REVIEW
          - entities.RightsRegistration.fields.evidence_round
          - errors.ERR_EVIDENCE_ROUNDS_EXHAUSTED
        distinguishing_aspect: |
          UNDER_REVIEW and NEEDS_EVIDENCE form a genuine cycle that the entity traverses twice
          with the SAME two triggers, and only a counter that is incremented on the RETURN leg
          (evidence, not request-evidence) terminates it — so the third request-evidence is
          refused from a state that accepted the identical call twice before.
        test_recipe:
          setup:
            - "One PUBLISHER rights holder and one COMPOSITION work; no usage anywhere, so the claim window never interferes."
            - "One RightsRegistration submitted by that holder and moved to UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /royalties/rights-holders"
              payload: { legal_name: "Harbourline Publishing", holder_type: "PUBLISHER", home_territory_code: "GB" }
              as: RoyaltyAdmin
              captures: { pub: "$.data.id" }
            - call: "POST /royalties/works"
              payload: { work_type: "COMPOSITION", identifier: "T3100000001", title: "Midnight Ledger" }
              as: RightsOpsAnalyst
              captures: { c1: "$.data.id" }
            - call: "GET /royalties/works/${c1}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { c1v: "$.data.version" }
            - call: "POST /royalties/rights-registrations"
              payload: { work_id: "${c1}", claimant_id: "${pub}", right_type: "MECHANICAL", routing: "DIRECT", share_bps: 6000, territory_set: ["GB"], effective_from: "2026-01-01", effective_to: "2027-01-01", expected_work_version: "${c1v}" }
              as: RightsHolderUser
              as_user_id: "${pub}"
              captures: { rg: "$.data.id", initial_status: "$.data.status", initial_round: "$.data.evidence_round" }
            - call: "POST /royalties/rights-registrations/${rg}/review"
              payload: {}
              as: RightsOpsAnalyst
              as_user_id: "analyst-review-2"
          trigger:
            - call: "POST /royalties/rights-registrations/${rg}/request-evidence"
              payload: {}
              as: RightsOpsAnalyst
              as_user_id: "analyst-review-2"
              captures: { s1: "$.data.status", r1: "$.data.evidence_round" }
            - call: "POST /royalties/rights-registrations/${rg}/evidence"
              payload: {}
              as: RightsHolderUser
              as_user_id: "${pub}"
              captures: { s2: "$.data.status", r2: "$.data.evidence_round" }
            - call: "POST /royalties/rights-registrations/${rg}/request-evidence"
              payload: {}
              as: RightsOpsAnalyst
              as_user_id: "analyst-review-2"
              captures: { s3: "$.data.status", r3: "$.data.evidence_round" }
            - call: "POST /royalties/rights-registrations/${rg}/evidence"
              payload: {}
              as: RightsHolderUser
              as_user_id: "${pub}"
              captures: { s4: "$.data.status", r4: "$.data.evidence_round" }
            - name: third_request_evidence_rejected
              call: "POST /royalties/rights-registrations/${rg}/request-evidence"
              payload: {}
              as: RightsOpsAnalyst
              as_user_id: "analyst-review-2"
              captures: { err: "$.data.error_id" }
            - call: "POST /royalties/rights-registrations/${rg}/approve"
              payload: {}
              as: RightsOpsAnalyst
              as_user_id: "analyst-review-2"
              captures: { s5: "$.data.status", r5: "$.data.evidence_round" }
          assert:
            - "On creation status == SUBMITTED and evidence_round == 0 (default)."
            - "Loop pass 1: request-evidence yields status NEEDS_EVIDENCE with evidence_round still 0; evidence yields status UNDER_REVIEW with evidence_round 1 — the counter advances on the return leg only."
            - "Loop pass 2: request-evidence yields NEEDS_EVIDENCE with evidence_round 1; evidence yields UNDER_REVIEW with evidence_round 2."
            - "Third request-evidence from the SAME UNDER_REVIEW state that accepted it twice: HTTP 422 with error_id ERR_EVIDENCE_ROUNDS_EXHAUSTED, status still UNDER_REVIEW, evidence_round still 2."
            - "The registration is still approvable after loop exhaustion: approve yields status APPROVED and evidence_round 2 (the counter is not reset)."

      - name: pool_reopen_recalculate_cycle_with_self_loop
        grounds:
          - state_machines.RoyaltyPool.CALCULATED_to_CALCULATED
          - state_machines.RoyaltyPool.FINALIZED_to_REOPENED_FOR_ADJUSTMENT
          - state_machines.RoyaltyPool.REOPENED_FOR_ADJUSTMENT_to_CALCULATED
          - state_machines.AccountingPeriod.CLOSED_to_REOPENED
        distinguishing_aspect: |
          RoyaltyPool has both a self-loop (CALCULATED -> CALCULATED under the same trigger) and a
          full cycle back from a state normally considered final (FINALIZED ->
          REOPENED_FOR_ADJUSTMENT -> CALCULATED -> FINALIZED), and the parent period rides the
