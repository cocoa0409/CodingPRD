      - name: bulk_action_expiry_sweep_reports_per_pass_counters_and_dry_run_writes_nothing
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/_ops/run-expiry-sweep
          - state_machines.DocumentaryCredit.ISSUED_to_EXPIRED
          - calculations.facility_exposure_ledger
        distinguishing_aspect: |
          The sweep returns six independent counters, not one total: the run at
          2026-11-22 reports credits_expired 1 and allocations_released 1 with the
          other four at zero. Run first with dry_run true it reports exactly the
          same counters while leaving the credit ISSUED and the facility at
          10025000 - the dry run must not write. The real run then expires the
          credit, RELEASES the allocation and drops allocated_cents to 0. The
          DRAFT sibling credit is never scanned because PASS 4 only looks at
          ISSUED rows.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "The standard 10000000 SIGHT_PAYMENT credit S1 (presentation_deadline_date 2026-11-21) is ISSUED on a 50000000 facility; no presentation is ever made against it, so reserved_cents is 0."
            - "A second credit S2 with the same terms is created and left in DRAFT."
