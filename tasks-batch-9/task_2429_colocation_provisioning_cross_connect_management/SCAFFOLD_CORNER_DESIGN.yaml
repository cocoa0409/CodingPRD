          difficulty_instance: energize_cascade_depth_five_density_capped_blocks_neighbour_circuit
          rationale: "§1.8 walks all five hops of the energize cascade (circuit allocation → cabinet rollup and ACTIVE flip → row rollup and posture → RESERVED cabinets CAPACITY_HELD → their DESIGNED circuits BLOCKED) and asserts each level plus the contract rollup, covering this layer's depth and ordering claims."

      - name: cascading_side_effects_of_port_release
        excluded_because:
          difficulty_instance: release_ports_cascade_depth_four_quarantine_and_credit
          rationale: "§1.8 walks the release-ports cascade (released_port_count → cross-connect DECOMMISSIONED → ports QUARANTINED → credit InvoiceLine and contract rollup) end to end, covering the second cascade chain in this scaffold."

      - name: dual_variant_power_billing
        excluded_because:
          difficulty_instance: power_billing_metered_final_versus_deemed_capacity
          rationale: "§1.8 runs both contract_power_billing variants over identical meter data and pins the divergence (276.00 metered overage versus a 9110.400 kWh deemed consumption that clears the allowance), covering variant divergence and selection."

      - name: dual_variant_stranded_capacity
        excluded_because:
          difficulty_instance: row_stranded_capacity_nameplate_versus_measured
          rationale: "§1.8 pins stranded_nameplate_kw against stranded_measured_kw on one row with identical inputs, covering the second dual-variant calculation and its delta."

