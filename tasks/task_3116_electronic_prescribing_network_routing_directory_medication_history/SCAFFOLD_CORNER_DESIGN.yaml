# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3116_electronic_prescribing_network_routing_directory_medication_history
#
# Breadth probe. Every testable claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# Section and claim_type values come from references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    anchor_definitions:
      clock: &clock
        call: "POST /_clock/set_current_utc"
        payload: { current_utc: "2026-09-01T00:00:00Z" }
        as: NetworkOperator
      clinic: &clinic
        call: "POST /network/participants"
        payload: { name: "Northside Family Clinic", participant_type: "PRESCRIBER_CLINIC", npi: "1111111111", volume_billing_mode: "MONTHLY", fallback_channel: "FAX", fax_number: "+1-555-0100" }
        as: NetworkOperator
        captures: { cl_id: $.data.id, cl_v: $.data.version }
      pharmacy: &pharmacy
        call: "POST /network/participants"
        payload: { name: "Riverbend Pharmacy", participant_type: "PHARMACY", npi: "2222222222", volume_billing_mode: "MONTHLY", fallback_channel: "FAX", fax_number: "+1-555-0200" }
        as: NetworkOperator
        captures: { ph_id: $.data.id, ph_v: $.data.version }
      payer: &payer
        call: "POST /network/participants"
        payload: { name: "Meridian Health Plan", participant_type: "PAYER", npi: "3333333333", plan_copay_cents: 1500, plan_coinsurance_pct: 0.2, plan_deductible_cents: 10000, plan_deductible_met_cents: 4000, plan_brand_fee_cents: 300, formulary_preferred_pct: 0.3, plan_benefit_cap_cents: 50000 }
        as: NetworkOperator
        captures: { payer_id: $.data.id, payer_v: $.data.version }
      clinic_ep: &clinic_ep
        call: "POST /network/participants/${cl_id}/endpoints"
        payload: { service_set: "NEW_RX", endpoint_role: "SENDER", service_level: "ELIGIBLE_A", sla_response_minutes: 15, message_standard: "NCPDP_SCRIPT_2022011", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
        as: ParticipantAdmin
        as_user_id: "${cl_id}"
      ph_newrx: &ph_newrx
        call: "POST /network/participants/${ph_id}/endpoints"
        payload: { service_set: "NEW_RX", endpoint_role: "BOTH", service_level: "ELIGIBLE_A", sla_response_minutes: 15, message_standard: "NCPDP_SCRIPT_2022011", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
        as: ParticipantAdmin
        as_user_id: "${ph_id}"
        captures: { ep_nx_id: $.data.id }
      ph_cert_start: &ph_cert_start
        call: "POST /network/participants/${ph_id}/certification/start"
        payload: {}
        as: ParticipantAdmin
        as_user_id: "${ph_id}"
      ph_test_conn: &ph_test_conn
        call: "POST /network/participants/${ph_id}/certification/tests"
        payload: { test_code: "CONNECTIVITY", outcome: "PASS" }
        as: ParticipantAdmin
        as_user_id: "${ph_id}"
      ph_test_newrx: &ph_test_newrx
        call: "POST /network/participants/${ph_id}/certification/tests"
        payload: { test_code: "SCRIPT_NEW_RX", outcome: "PASS" }
        as: ParticipantAdmin
        as_user_id: "${ph_id}"
      ph_certify: &ph_certify
        call: "POST /network/participants/${ph_id}/certify"
        payload: { expected_participant_version: "${ph_v}" }
        as: ParticipantAdmin
        as_user_id: "${ph_id}"
      cl_cert_start: &cl_cert_start
        call: "POST /network/participants/${cl_id}/certification/start"
        payload: {}
        as: ParticipantAdmin
        as_user_id: "${cl_id}"
      cl_test_conn: &cl_test_conn
        call: "POST /network/participants/${cl_id}/certification/tests"
        payload: { test_code: "CONNECTIVITY", outcome: "PASS" }
        as: ParticipantAdmin
        as_user_id: "${cl_id}"
      cl_test_newrx: &cl_test_newrx
        call: "POST /network/participants/${cl_id}/certification/tests"
        payload: { test_code: "SCRIPT_NEW_RX", outcome: "PASS" }
        as: ParticipantAdmin
        as_user_id: "${cl_id}"
      cl_certify: &cl_certify
        call: "POST /network/participants/${cl_id}/certify"
        payload: { expected_participant_version: "${cl_v}" }
        as: ParticipantAdmin
        as_user_id: "${cl_id}"
      patient_a: &patient_a
        call: "POST /network/patients"
        payload: { full_name: "Iris Nakamura", date_of_birth: "1979-04-02T00:00:00Z", home_state: "MA" }
        as: PatientService
        captures: { pa_id: $.data.id }
      patient_b: &patient_b
        call: "POST /network/patients"
        payload: { full_name: "Otto Brenner", date_of_birth: "1973-10-02T00:00:00Z", home_state: "MA" }
        as: PatientService
        captures: { pb_id: $.data.id }
      draft_rx: &draft_rx
        call: "POST /network/prescriptions"
        payload: { prescriber_id: "${cl_id}", receiving_pharmacy_id: "${ph_id}", patient_id: "${pa_id}", drug_ndc: "00093314905", transaction_type: "NEW_RX", controlled_schedule: "NON_CONTROLLED", message_standard: "NCPDP_SCRIPT_2022011", days_supply: 30, quantity: 60, refills_authorized: 3 }
        as: Prescriber
        as_user_id: "${cl_id}"
        captures: { rx_id: $.data.id }
    instances:

      - name: participant_create_applies_every_declared_default_and_starts_uncertified
        claim_type: Creation
        grounds:
          - entities.NetworkParticipant
          - endpoints.POST_/network/participants
          - entities.NetworkParticipant.fields.certification_status
        distinguishing_aspect: "A participant created with only name, participant_type and npi comes back 201 with certification_status UNCERTIFIED, an empty certification_tests_passed list, directory_listed false, open_route_attempt_count 0, volume_billing_mode MONTHLY, fallback_channel FAX and plan_deductible_met_cents 0 — none of those is client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *clock
          trigger:
            - call: "POST /network/participants"
              payload: { name: "Lakeshore Infusion Center", participant_type: "PRESCRIBER_CLINIC", npi: "4444444444" }
              as: NetworkOperator
              captures: { np_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "NetworkParticipant.${np_id}.certification_status == UNCERTIFIED"
            - "NetworkParticipant.${np_id}.certification_tests_passed == []"
            - "NetworkParticipant.${np_id}.directory_listed == false and open_route_attempt_count == 0"
            - "NetworkParticipant.${np_id}.volume_billing_mode == MONTHLY and fallback_channel == FAX and fax_number is null"
            - "NetworkParticipant.${np_id}.plan_deductible_met_cents == 0 and plan_copay_cents == 1500"
            - "NetworkParticipant.${np_id}.version == 1 and the response carries non-null id, created_at and updated_at"

      - name: participant_get_with_an_unknown_id_returns_participant_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/network/participants/{id}
          - errors[ERR_PARTICIPANT_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unregistered id on the participant path yields the entity-specific 404 ERR_PARTICIPANT_NOT_FOUND rather than a generic code or a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No participant has been registered."
          setup_api_calls:
            - *clock
          trigger:
            - call: "GET /network/participants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_PARTICIPANT_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: participants_list_paginates_and_counts_the_whole_filtered_set
        claim_type: Listing
        grounds:
          - endpoints.GET_/network/participants
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three participants on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and the same filter at offset=2 returns the remaining row with has_more false — total_count counts the filtered set rather than the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Three participants: two pharmacies and one prescriber clinic."
          setup_api_calls:
            - *clock
            - *pharmacy
            - call: "POST /network/participants"
              payload: { name: "Harborside Pharmacy", participant_type: "PHARMACY", npi: "5555555555" }
              as: NetworkOperator
            - *clinic
          trigger:
            - call: "GET /network/participants"
              payload: { participant_type: "PHARMACY", limit: 2, offset: 0 }
              as: NetworkOperator
          assert:
            - "the response status is 200 and response_type is array"
            - "the page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /network/participants?participant_type=PHARMACY&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /network/participants?participant_type=PRESCRIBER_CLINIC returns exactly 1 row"
            - "GET /network/participants with no query parameters returns 3 rows, limit defaulting to 10 and offset to 0"

      - name: participant_create_missing_npi_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.NetworkParticipant.fields.npi
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3]
        distinguishing_aspect: "npi is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the required-field check and no participant row is created."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *clock
          trigger:
            - call: "POST /network/participants"
              payload: { name: "Incomplete Clinic", participant_type: "PRESCRIBER_CLINIC" }
              as: NetworkOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /network/participants returns 0 rows"

      - name: participant_create_reusing_an_npi_for_the_same_type_returns_duplicate_npi
        claim_type: Type Constraints
        grounds:
          - entities.NetworkParticipant.fields.npi
          - errors[ERR_DUPLICATE_PARTICIPANT_NPI]
          - validations[priority=3]
        distinguishing_aspect: "The (participant_type, npi) pair is unique, so a second pharmacy with the same NPI is rejected with 409 ERR_DUPLICATE_PARTICIPANT_NPI while the same NPI under a different participant_type is accepted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One pharmacy already registered under NPI 2222222222."
          setup_api_calls:
            - *clock
            - *pharmacy
          trigger:
            - call: "POST /network/participants"
              payload: { name: "Riverbend Pharmacy North", participant_type: "PHARMACY", npi: "2222222222" }
              as: NetworkOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DUPLICATE_PARTICIPANT_NPI"
            - "POST /network/participants with the same npi 2222222222 and participant_type PRESCRIBER_CLINIC returns 201, proving the constraint is on the pair and not on the NPI alone"

      - name: prescription_significance_and_is_controlled_are_computed_never_supplied
        claim_type: Computed Fields
        grounds:
          - entities.Prescription.fields.is_controlled
          - entities.Prescription.fields.significance
          - entities.Prescription.fields.monitored_under_consent
          - endpoints.POST_/network/prescriptions
        distinguishing_aspect: "is_controlled and significance are derived from controlled_schedule alone, and monitored_under_consent from the patient's ACTIVE consent scopes, so a SCHEDULE_II order on a patient with an ACTIVE MEDICATION_HISTORY consent reports significance CRITICAL with no significance field in the request."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One certified clinic, one certified pharmacy with an in-window NEW_RX endpoint, one patient holding an ACTIVE MEDICATION_HISTORY-scope consent."
          setup_api_calls:
            - *clock
            - *clinic
            - *pharmacy
            - *clinic_ep
            - *ph_newrx
            - *ph_cert_start
            - *ph_test_conn
            - *ph_test_newrx
            - *ph_certify
            - *cl_cert_start
            - *cl_test_conn
            - *cl_test_newrx
            - *cl_certify
            - *patient_a
            - call: "POST /network/patients/${pa_id}/consents"
              payload: { scope: "MEDICATION_HISTORY", duration_days: 365 }
              as: PatientService
              captures: { cns_id: $.data.id }
          trigger:
            - call: "POST /network/prescriptions"
              payload: { prescriber_id: "${cl_id}", receiving_pharmacy_id: "${ph_id}", patient_id: "${pa_id}", drug_ndc: "00093314905", transaction_type: "NEW_RX", controlled_schedule: "SCHEDULE_II", message_standard: "NCPDP_SCRIPT_2022011", days_supply: 30, quantity: 60, refills_authorized: 0 }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { rx_ctrl_id: $.data.id }
            - call: "POST /network/prescriptions"
              payload: { prescriber_id: "${cl_id}", receiving_pharmacy_id: "${ph_id}", patient_id: "${pa_id}", drug_ndc: "00093314906", transaction_type: "NEW_RX", controlled_schedule: "NON_CONTROLLED", message_standard: "NCPDP_SCRIPT_2022011", days_supply: 30, quantity: 30, refills_authorized: 6 }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { rx_plain_id: $.data.id }
          assert:
            - "Prescription.${rx_ctrl_id}.is_controlled == true and significance == CRITICAL and monitored_under_consent == true"
            - "Prescription.${rx_plain_id}.is_controlled == false and significance == STANDARD and monitored_under_consent == true"
            - "Prescription.${rx_ctrl_id}.clinical_status == DRAFT and routing_status == NOT_ROUTED and refills_used == 0 and routing_attempt_count == 0"
            - "Prescription.${rx_ctrl_id}.active_routing_attempt_id is null and signature_audit_id is null"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: sign_from_already_delivered_prescription_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Prescription.clinical_status
          - state_machines.Prescription.clinical_status.transitions.SIGNED_to_ROUTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "clinical_status DELIVERED has no DRAFT→SIGNED edge, so re-signing a delivered order is rejected with ERR_INVALID_STATE and the stored signature_audit_id is not overwritten."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One certified clinic, one certified pharmacy, one patient, and an order already signed, routed and reported acknowledged, so clinical_status is DELIVERED."
          setup_api_calls:
            - *clock
            - *clinic
            - *pharmacy
            - *clinic_ep
            - *ph_newrx
            - *ph_cert_start
            - *ph_test_conn
            - *ph_test_newrx
            - *ph_certify
            - *cl_cert_start
            - *cl_test_conn
            - *cl_test_newrx
            - *cl_certify
            - *patient_a
            - *draft_rx
            - call: "POST /network/signing-sessions"
              payload: { prescription_id: "${rx_id}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /network/signing-sessions/${ss_id}/identity-proof"
              payload: { outcome: "PASSED" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "POST /network/signing-sessions/${ss_id}/request-otp"
              payload: {}
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { otp_code: $.data.otp_challenge_code }
            - call: "POST /network/signing-sessions/${ss_id}/verify-otp"
              payload: { otp_code: "${otp_code}" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "POST /network/prescriptions/${rx_id}/sign"
              payload: { signing_session_id: "${ss_id}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { v_signed: $.data.version }
            - call: "POST /network/prescriptions/${rx_id}/route"
              payload: { expected_prescription_version: "${v_signed}" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "GET /network/prescriptions/${rx_id}/attempts"
              payload: {}
              as: NetworkOperator
              captures: { ack_id: "$.data[0].id" }
            - call: "POST /network/routing-attempts/${ack_id}/report-acknowledged"
              payload: {}
              as: NetworkOperator
            - call: "GET /network/prescriptions/${rx_id}"
              payload: {}
              as: NetworkOperator
              captures: { sig_before: $.data.signature_audit_id }
          trigger:
            - call: "POST /network/signing-sessions"
              payload: { prescription_id: "${rx_id}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { ss2_id: $.data.id }
            - call: "POST /network/signing-sessions/${ss2_id}/identity-proof"
              payload: { outcome: "PASSED" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "POST /network/signing-sessions/${ss2_id}/request-otp"
              payload: {}
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { otp2: $.data.otp_challenge_code }
            - call: "POST /network/signing-sessions/${ss2_id}/verify-otp"
              payload: { otp_code: "${otp2}" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "POST /network/prescriptions/${rx_id}/sign"
              payload: { signing_session_id: "${ss2_id}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the second sign returns 409 with error_id == ERR_INVALID_STATE"
            - "Prescription.${rx_id}.clinical_status is still DELIVERED"
            - "Prescription.${rx_id}.signature_audit_id still equals ${sig_before}, so the rejected attempt did not rewrite the signing authority"
            - "SigningSession.${ss2_id}.session_status is still OPEN — the session was never consumed"

      - name: signing_session_two_factor_locks_after_three_failed_challenges
        claim_type: precondition_enforcement
        grounds:
          - state_machines.SigningSession.transitions.OPEN_to_OPEN
          - errors[ERR_OTP_INVALID]
          - errors[ERR_ACCOUNT_LOCKED]
          - validations[priority=5]
        distinguishing_aspect: "The session's two-factor guard is a counting threshold on otp_attempt_count: two wrong codes return 422 ERR_OTP_INVALID, the third flips two_factor_status to LOCKED, and a fourth request-otp is then refused with 423 ERR_ACCOUNT_LOCKED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One certified clinic, one certified pharmacy, one patient, one draft order and an OPEN signing session whose identity proofing has PASSED and whose challenge code has been issued."
          setup_api_calls:
            - *clock
            - *clinic
            - *pharmacy
            - *clinic_ep
            - *ph_newrx
            - *ph_cert_start
            - *ph_test_conn
            - *ph_test_newrx
            - *ph_certify
            - *cl_cert_start
            - *cl_test_conn
            - *cl_test_newrx
            - *cl_certify
            - *patient_a
            - *draft_rx
            - call: "POST /network/signing-sessions"
              payload: { prescription_id: "${rx_id}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /network/signing-sessions/${ss_id}/identity-proof"
              payload: { outcome: "PASSED" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "POST /network/signing-sessions/${ss_id}/request-otp"
              payload: {}
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { real_otp: $.data.otp_challenge_code }
          trigger:
            - call: "POST /network/signing-sessions/${ss_id}/verify-otp"
              payload: { otp_code: "000000" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /network/signing-sessions/${ss_id}/verify-otp"
              payload: { otp_code: "111111" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { err2: $.data.error_id }
            - call: "POST /network/signing-sessions/${ss_id}/verify-otp"
              payload: { otp_code: "222222" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { err3: $.data.error_id }
            - call: "POST /network/signing-sessions/${ss_id}/request-otp"
              payload: {}
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { err4: $.data.error_id }
          assert:
            - "the first two wrong codes return 422 with error_id == ERR_OTP_INVALID and leave two_factor_status PENDING"
            - "the third wrong code returns 423 with error_id == ERR_ACCOUNT_LOCKED and sets two_factor_status == LOCKED"
            - "the fourth request-otp returns 423 with error_id == ERR_ACCOUNT_LOCKED"
            - "SigningSession.${ss_id}.otp_attempt_count == 3 and session_status is still OPEN"
            - "the correct code ${real_otp} is now unusable: verify-otp with it still returns 423 ERR_ACCOUNT_LOCKED"

      - name: cancel_from_draft_prescription_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Prescription.clinical_status.transitions.SIGNED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
          - endpoints.POST_/network/prescriptions/{id}/cancel
        distinguishing_aspect: "clinical_status DRAFT has no →CANCELLED edge in the clinical machine, so cancelling an unsigned order is rejected with ERR_INVALID_STATE while the same call on a SIGNED order succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One certified clinic, one certified pharmacy, one patient, and two draft orders."
          setup_api_calls:
            - *clock
            - *clinic
            - *pharmacy
            - *clinic_ep
            - *ph_newrx
            - *ph_cert_start
            - *ph_test_conn
            - *ph_test_newrx
            - *ph_certify
            - *cl_cert_start
            - *cl_test_conn
            - *cl_test_newrx
            - *cl_certify
            - *patient_a
            - *draft_rx
          trigger:
            - call: "POST /network/prescriptions/${rx_id}/cancel"
              payload: {}
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the cancel returns 409 with error_id == ERR_INVALID_STATE"
            - "Prescription.${rx_id}.clinical_status is still DRAFT and routing_status is still NOT_ROUTED"
            - "no RoutingAttempt row exists for this prescription"
  # ===========================================================================
  - section: calculations
    instances:

      - name: medication_history_dedupe_fill_authority_beats_larger_payer_claim
        claim_type: correct_result
        grounds:
          - calculations.medication_history_dedupe
          - calculations.medication_history_dedupe.variants.fill_authority
          - entities.MedicationHistoryRecord.fields.dedupe_key
          - entities.MedicationHistoryRecord.fields.is_superseded
        distinguishing_aspect: "Within one dedupe group the ranking key source_priority precedes quantity, so a PHARMACY_FILL of 30 units beats a PAYER_CLAIM of 90 units that shares the same patient, NDC, fill date and days_supply."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One CERTIFIED pharmacy participant and one patient with an ACTIVE MEDICATION_HISTORY-scope consent of 365 days, holding two history records that reduce to one dedupe_key."
          setup_api_calls:
            - *clock
            - *pharmacy
            - call: "POST /network/participants/${ph_id}/endpoints"
              payload: { service_set: "MED_HISTORY", endpoint_role: "RECEIVER", service_level: "ELIGIBLE_A", sla_response_minutes: 60, message_standard: "NCPDP_SCRIPT_2022011", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - *ph_cert_start
            - *ph_test_conn
            - *ph_test_newrx
            - *ph_certify
            - *patient_a
            - call: "POST /network/patients/${pa_id}/consents"
              payload: { scope: "MEDICATION_HISTORY", duration_days: 365 }
              as: PatientService
              captures: { cns_id: $.data.id }
            - call: "POST /network/patients/${pa_id}/history-records"
              payload: { source_type: "PHARMACY_FILL", source_participant_id: "${ph_id}", drug_ndc: "00093314905", fill_date: "2026-06-01T00:00:00Z", days_supply: 30, quantity: 30 }
              as: Pharmacy
              as_user_id: "${ph_id}"
              captures: { rec_fill_id: $.data.id, fill_key: $.data.dedupe_key }
            - call: "POST /network/patients/${pa_id}/history-records"
              payload: { source_type: "PAYER_CLAIM", source_participant_id: "${ph_id}", drug_ndc: "00093314905", fill_date: "2026-06-01T00:00:00Z", days_supply: 30, quantity: 90 }
              as: HubOperator
              captures: { rec_claim_id: $.data.id, claim_key: $.data.dedupe_key }
            - call: "POST /network/medication-history/batches"
              payload: { patient_id: "${pa_id}", trigger_reason: "PRESCRIBER_QUERY" }
              as: Prescriber
              as_user_id: "${ph_id}"
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /network/medication-history/batches/${batch_id}/aggregate"
              payload: {}
              as: HubOperator
              captures: { rec_count: $.data.record_count, sup_count: $.data.superseded_count }
          assert:
            - "MedicationHistoryRecord.${rec_fill_id}.dedupe_key == MedicationHistoryRecord.${rec_claim_id}.dedupe_key == ${fill_key}"
            - "the settled batch reports record_count == 1 and superseded_count == 1"
            - "MedicationHistoryRecord.${rec_fill_id}.is_superseded == false — the 30-unit fill wins on source_priority despite the claim's larger quantity"
            - "MedicationHistoryRecord.${rec_claim_id}.is_superseded == true"
            - "MedicationHistoryRecord.${rec_fill_id}.aggregation_batch_id == ${batch_id} and the same holds for ${rec_claim_id}"

      - name: batch_cost_and_dedupe_input_set_excludes_retracted_and_uncertified_sources
        claim_type: input_set_filtering
        grounds:
          - calculations.medication_history_dedupe
          - entities.MedicationHistoryRecord.fields.retracted_at
          - errors[ERR_HISTORY_SOURCE_UNCERTIFIED]
          - calculations.medication_history_batch_cost
        distinguishing_aspect: "The dedupe input set is the live records of CERTIFIED sources only, so a retracted record and a record from an UNCERTIFIED reporter both fall outside source_record_count and the batch cost never rises to account for them."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Riverbend Pharmacy is CERTIFIED; Harborside Pharmacy is still UNCERTIFIED. One patient holds an ACTIVE MEDICATION_HISTORY-scope consent and three records are on file: one live from the certified pharmacy, one that will be retracted, and one from the uncertified pharmacy."
          setup_api_calls:
            - *clock
            - *pharmacy
            - call: "POST /network/participants/${ph_id}/endpoints"
              payload: { service_set: "MED_HISTORY", endpoint_role: "RECEIVER", service_level: "ELIGIBLE_A", sla_response_minutes: 60, message_standard: "NCPDP_SCRIPT_2022011", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - *ph_cert_start
            - *ph_test_conn
            - *ph_test_newrx
            - *ph_certify
            - call: "POST /network/participants"
              payload: { name: "Harborside Pharmacy", participant_type: "PHARMACY", npi: "5555555555" }
              as: NetworkOperator
              captures: { ph2_id: $.data.id }
            - *patient_a
            - call: "POST /network/patients/${pa_id}/consents"
              payload: { scope: "MEDICATION_HISTORY", duration_days: 365 }
              as: PatientService
              captures: { cns_id: $.data.id }
            - call: "POST /network/patients/${pa_id}/history-records"
              payload: { source_type: "PHARMACY_FILL", source_participant_id: "${ph_id}", drug_ndc: "00093314905", fill_date: "2026-06-01T00:00:00Z", days_supply: 30, quantity: 60 }
              as: Pharmacy
              as_user_id: "${ph_id}"
              captures: { rec_live_id: $.data.id }
            - call: "POST /network/patients/${pa_id}/history-records"
              payload: { source_type: "PHARMACY_FILL", source_participant_id: "${ph2_id}", drug_ndc: "00093314906", fill_date: "2026-06-02T00:00:00Z", days_supply: 30, quantity: 30 }
              as: HubOperator
              captures: { rec_uncert_id: $.data.id }
            - call: "POST /network/medication-history/batches"
              payload: { patient_id: "${pa_id}", trigger_reason: "SCHEDULED_REFRESH" }
              as: Prescriber
              as_user_id: "${ph_id}"
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /network/medication-history/batches/${batch_id}/aggregate"
              payload: {}
              as: HubOperator
              captures: { src_count: $.data.source_record_count, rec_count: $.data.record_count, cost: $.data.batch_cost_cents }
          assert:
            - "source_record_count == 1 — only the live record from the CERTIFIED reporter is in the input set"
            - "record_count == 1 and superseded_count == 0"
            - "batch_cost_cents == 35 (25 + 10 * 1), so neither the uncertified record nor any retracted row enlarged the charge"
            - "MedicationHistoryRecord.${rec_uncert_id}.is_superseded == false and its aggregation_batch_id is null — the uncertified record was skipped rather than stamped"
            - "patient history_record_count == 2, counting the live certified and uncertified rows together"

      - name: network_delivery_reachability_counts_pending_endpoints_in_its_denominator
        claim_type: constants_applied
        grounds:
          - calculations.network_delivery_reachability
          - entities.NetworkParticipant.fields.delivery_reachability
          - endpoints.GET_/network/participants/{id}/delivery-reachability
        distinguishing_aspect: "delivery_reachability enumerates over total DirectoryEndpoint rows — including PENDING_CERT and DISABLED ones — while only ACTIVE and in-window DEGRADED rows count as reachable, so a participant with one live endpoint and two pending ones reads AT_RISK rather than FULL."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Riverbend Pharmacy is CERTIFIED with three endpoints — one ACTIVE NEW_RX, one MED_HISTORY still PENDING_CERT because it was added after certification, and one ELIGIBILITY_FORMULARY created and left PENDING_CERT too."
          setup_api_calls:
            - *clock
            - *pharmacy
            - *ph_newrx
            - *ph_cert_start
            - *ph_test_conn
            - *ph_test_newrx
            - *ph_certify
            - call: "POST /network/participants/${ph_id}/endpoints"
              payload: { service_set: "MED_HISTORY", endpoint_role: "RECEIVER", service_level: "ELIGIBLE_A", sla_response_minutes: 60, message_standard: "NCPDP_SCRIPT_2022011", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
              captures: { ep_hist_id: $.data.id }
            - call: "POST /network/participants/${ph_id}/endpoints"
              payload: { service_set: "ELIGIBILITY_FORMULARY", endpoint_role: "RECEIVER", service_level: "ELIGIBLE_A", sla_response_minutes: 60, message_standard: "NCPDP_SCRIPT_2022011", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
              captures: { ep_elig_id: $.data.id }
          trigger:
            - call: "GET /network/participants/${ph_id}/delivery-reachability"
              payload: {}
              as: NetworkOperator
              captures: { reachable: $.data.reachable_endpoint_count, total: $.data.total_endpoint_count }
          assert:
            - "the report returns reachable_endpoint_count == 1 and total_endpoint_count == 3"
            - "delivery_reachability == AT_RISK — reachable/total is 1/3, below the 0.50 threshold that separates AT_RISK from FULL"
            - "DirectoryEndpoint.${ep_hist_id}.status == PENDING_CERT and DirectoryEndpoint.${ep_elig_id}.status == PENDING_CERT, so neither counts as reachable"
            - "NetworkParticipant.${ph_id}.delivery_reachability on the participant detail read agrees with the report"
            - "the derived field gates no write: POST /network/prescriptions with this pharmacy as the receiving pharmacy still succeeds"

  # ===========================================================================
  - section: validations
    instances:

      - name: route_without_any_eligible_endpoint_returns_no_route_available
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_NO_ROUTE_AVAILABLE]
          - calculations.routing_endpoint_selection
        distinguishing_aspect: "When the eligibility filter empties — the pharmacy owns only a REFILL_RX endpoint while the order is a NEW_RX — the selector nominates nothing and the route call fails with ERR_NO_ROUTE_AVAILABLE instead of creating an attempt."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Both participants are certified. Riverbend Pharmacy owns only a REFILL_RX endpoint, and the draft order is a NEW_RX."
          setup_api_calls:
            - *clock
            - *clinic
            - *pharmacy
            - *clinic_ep
            - call: "POST /network/participants/${ph_id}/endpoints"
              payload: { service_set: "REFILL_RX", endpoint_role: "BOTH", service_level: "ELIGIBLE_A", sla_response_minutes: 15, message_standard: "NCPDP_SCRIPT_2022011", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
              captures: { ep_refill_id: $.data.id }
            - *ph_cert_start
            - *ph_test_conn
            - *ph_test_newrx
            - *ph_certify
            - *cl_cert_start
            - *cl_test_conn
            - *cl_test_newrx
            - *cl_certify
            - *patient_a
            - *draft_rx
            - call: "POST /network/signing-sessions"
              payload: { prescription_id: "${rx_id}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /network/signing-sessions/${ss_id}/identity-proof"
              payload: { outcome: "PASSED" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "POST /network/signing-sessions/${ss_id}/request-otp"
              payload: {}
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { otp_code: $.data.otp_challenge_code }
            - call: "POST /network/signing-sessions/${ss_id}/verify-otp"
              payload: { otp_code: "${otp_code}" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "POST /network/prescriptions/${rx_id}/sign"
              payload: { signing_session_id: "${ss_id}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /network/prescriptions/${rx_id}/route"
              payload: { expected_prescription_version: "${v0}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the route returns 422 with error_id == ERR_NO_ROUTE_AVAILABLE"
            - "Prescription.${rx_id}.routing_status is still NOT_ROUTED and clinical_status is still SIGNED"
            - "Prescription.${rx_id}.routing_attempt_count == 0 and active_routing_attempt_id is null"
            - "DirectoryEndpoint.${ep_refill_id}.status is still ACTIVE — a failed selection never degrades an endpoint"

      - name: sign_without_passed_identity_proofing_returns_identity_proofing_required
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=5]
          - errors[ERR_IDENTITY_PROOFING_REQUIRED]
          - state_machines.Prescription.transitions.DRAFT_to_SIGNED
        distinguishing_aspect: "The controlled-order signing guard requires BOTH proofing and two-factor on the same OPEN session, so passing proofing but never verifying the challenge is still refused with ERR_IDENTITY_PROOFING_REQUIRED rather than success."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Both participants certified, one patient, and a SCHEDULE_IV order whose signing session has PASSED identity proofing with a challenge issued but not verified."
          setup_api_calls:
            - *clock
            - *clinic
            - *pharmacy
            - *clinic_ep
            - *ph_newrx
            - *ph_cert_start
            - *ph_test_conn
            - *ph_test_newrx
            - *ph_certify
            - *cl_cert_start
            - *cl_test_conn
            - *cl_test_newrx
            - *cl_certify
            - *patient_a
            - call: "POST /network/prescriptions"
              payload: { prescriber_id: "${cl_id}", receiving_pharmacy_id: "${ph_id}", patient_id: "${pa_id}", drug_ndc: "00093314905", transaction_type: "NEW_RX", controlled_schedule: "SCHEDULE_IV", message_standard: "NCPDP_SCRIPT_2022011", days_supply: 30, quantity: 60, refills_authorized: 0 }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /network/signing-sessions"
              payload: { prescription_id: "${rx_id}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /network/signing-sessions/${ss_id}/identity-proof"
              payload: { outcome: "PASSED" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "POST /network/signing-sessions/${ss_id}/request-otp"
              payload: {}
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { otp_code: $.data.otp_challenge_code }
          trigger:
            - call: "POST /network/prescriptions/${rx_id}/sign"
              payload: { signing_session_id: "${ss_id}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the sign returns 422 with error_id == ERR_IDENTITY_PROOFING_REQUIRED"
            - "SigningSession.${ss_id}.two_factor_status == PENDING and otp_attempt_count == 0"
            - "Prescription.${rx_id}.clinical_status is still DRAFT and signature_audit_id is null"
            - "verifying the pending challenge ${otp_code} and re-signing then succeeds, proving the guard was the only blocker"

      - name: controlled_order_on_the_2017071_standard_returns_standard_mismatch
        claim_type: conditional_validation
        grounds:
          - validations[priority=5]
          - errors[ERR_CONTROLLED_NOT_SUPPORTED_BY_STANDARD]
          - entities.Prescription.fields.message_standard
        distinguishing_aspect: "The standard guard applies only to controlled orders: a SCHEDULE_III order on NCPDP_SCRIPT_2017071 is refused with ERR_CONTROLLED_NOT_SUPPORTED_BY_STANDARD while the identical order marked NON_CONTROLLED on the same standard signs through."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Both participants certified, one patient, two ready-to-sign sessions — one for a SCHEDULE_III order on the 2017071 standard and one for the same drug marked NON_CONTROLLED on the same standard."
