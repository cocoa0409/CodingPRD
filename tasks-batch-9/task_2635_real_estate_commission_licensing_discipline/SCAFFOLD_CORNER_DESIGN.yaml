          The uniqueness scope is the normalized form over status IN {SUBMITTED, APPROVED} only, so
          "Harbor Homes" and "harbor-homes!" collide, while a REJECTED row releases the name for
          re-use. A second brokerage cannot take a name the first one merely SUBMITTED - the check is
          global, not per brokerage.
