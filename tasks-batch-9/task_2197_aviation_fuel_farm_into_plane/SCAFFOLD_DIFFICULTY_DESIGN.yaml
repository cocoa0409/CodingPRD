      - name: permit_throughput_and_ledger_conservation_on_receipt_reject
        grounds:
          - state_machines.FuelReceipt.QUARANTINED_to_REJECTED
          - calculations.permit_daily_throughput_used
          - calculations.tank_book_inventory
          - calculations.farm_posture
        invariant: "FuelFarm.active_permit_throughput_used_liters and StorageTank.book_volume_liters are both unchanged across the record -> sample -> quarantine -> reject round trip, and the tank returns to quality_status RELEASED"
        distinguishing_aspect: |
          A parcel of 29698.32 net liters is measured, sampled, quarantined and then returned to the supplier.
          The conserved quantities are a permit allowance and a ledger balance rather than a volume/onboard pair:
          active_permit_throughput_used_liters must still read 0.00 and book_volume_liters must still read
          1000000.00, while the compensating side of the reject also restores StorageTank.quality_status to
          RELEASED and FuelFarm.posture to OPEN. An implementation that counts throughput at receipt creation,
          or that leaves the tank QUARANTINED after the parcel is gone, fails.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T06:00:00Z"
            - "farm SFO, ACTIVE permit (cap 400000.0), truck TRK1 IN_SERVICE, tank T1 RELEASED with opening_volume_liters 1000000.0 and a PASSing latest PERIODIC_TANK_QA sample"
            - "one TRUCK receipt R1 (MT-8001) sampled by qi-alice, tested FAIL, then quarantined by qi-bob"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T06:00:00Z" }
              as: ConsortiumAdmin
            - call: "POST /fuel-farms"
              payload: { iata_code: "SFO", name: "SFO Fuel Consortium", hydrant_system_available: true, unpumpable_bottom_liters: 500.0 }
              as: ConsortiumAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /fuel-farms/${farm_id}/environmental-permits"
              payload: { permit_number: "P-2026-001", valid_from_utc: "2026-01-01T00:00:00Z", valid_until_utc: "2027-01-01T00:00:00Z", max_daily_throughput_liters: 400000.0, max_reportable_spill_liters: 20.0 }
              as: ConsortiumAdmin
              captures: { permit_id: $.data.id }
            - call: "POST /fuel-farms/${farm_id}/fueling-assets"
              payload: { asset_code: "TRK1", asset_type: "TRUCK", tank_capacity_liters: 40000.0, turnaround_buffer_minutes: 15, differential_pressure_kpa: 10.0 }
              as: ConsortiumAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /fuel-farms/${farm_id}/storage-tanks"
              payload: { tank_code: "T1", capacity_liters: 5000000.0, safe_fill_liters: 4000000.0, density_kg_per_m3: 795.0, opening_volume_liters: 1000000.0 }
              as: ConsortiumAdmin
              captures: { tank_id: $.data.id }
            - call: "POST /storage-tanks/${tank_id}/samples"
              payload: { sample_purpose: "PERIODIC_TANK_QA" }
              as: QualityInspector
              as_user_id: "qi-alice"
              captures: { qa_sample_id: $.data.id }
            - call: "POST /quality-samples/${qa_sample_id}/test-results"
              payload: { water_reaction_rating: 1, particulate_mg_per_l: 0.5, conductivity_ps_per_m: 120.0, observed_density_kg_per_m3: 795.0, flash_point_c: 42.0 }
              as: QualityInspector
              as_user_id: "qi-alice"
            - call: "POST /storage-tanks/${tank_id}/quality-release"
              payload: {}
              as: QualityInspector
              as_user_id: "qi-bob"
            - call: "POST /fuel-receipts"
              payload: { storage_tank_id: "${tank_id}", delivery_mode: "TRUCK", supplier_name: "Refinery One", meter_ticket_number: "MT-8001", meter_ticket_gross_liters: 30120.0, tank_opening_gauge_liters: 100.0, tank_closing_gauge_liters: 30100.0, temperature_c: 25.0, certificate_density_kg_per_m3: 795.0, measured_water_liters: 200.0 }
              as: FarmOperator
              captures: { receipt_id: $.data.id }
            - call: "POST /fuel-receipts/${receipt_id}/samples"
              payload: {}
              as: QualityInspector
              as_user_id: "qi-alice"
              captures: { rs_id: $.data.id }
            - call: "POST /quality-samples/${rs_id}/test-results"
              payload: { water_reaction_rating: 3, particulate_mg_per_l: 2.5, conductivity_ps_per_m: 40.0, observed_density_kg_per_m3: 795.0, flash_point_c: 41.0 }
              as: QualityInspector
              as_user_id: "qi-alice"
            - call: "POST /fuel-receipts/${receipt_id}/verdict"
              payload: { decision: "QUARANTINE" }
              as: QualityInspector
              as_user_id: "qi-bob"
          trigger:
            - call: "POST /fuel-receipts/${receipt_id}/reject"
              payload: { reason: "off-spec parcel returned to supplier" }
              as: FarmOperator
          assert:
            - "before the trigger FuelReceipt.${receipt_id}.status == QUARANTINED, StorageTank.${tank_id}.quality_status == QUARANTINED and FuelFarm.${farm_id}.posture == RESTRICTED"
            - "before the trigger FuelFarm.${farm_id}.active_permit_throughput_used_liters == 0.00 and StorageTank.${tank_id}.book_volume_liters == 1000000.00"
            - "FuelReceipt.${receipt_id}.status == REJECTED and released_at_utc == null"
            - "FuelReceipt.${receipt_id}.net_volume_liters == 29698.32 (the measurement is retained, the ledger effect is not)"
            - "FuelFarm.${farm_id}.active_permit_throughput_used_liters == 0.00"
            - "StorageTank.${tank_id}.book_volume_liters == 1000000.00 and available_volume_liters == 999500.00"
            - "StorageTank.${tank_id}.quality_status == RELEASED and service_status == IN_SERVICE"
            - "FuelFarm.${farm_id}.posture == OPEN"
            - "QualitySample.${rs_id}.verdict == FAIL and failed_metrics == [\"water_reaction_rating\", \"particulate_mg_per_l\", \"conductivity_ps_per_m\"]"

      - name: airline_exposure_conservation_across_invoice_issue_and_void
        grounds:
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Invoice.ISSUED_to_VOIDED
          - calculations.airline_credit_exposure
          - calculations.invoice_total_with_fees
        invariant: "AirlineAccount.accrual_exposure_cents returns to exactly 1433393 after the issue -> void round trip, and the swept ticket returns to POSTED with invoice_id null"
        distinguishing_aspect: |
          Issuing does NOT leave accrual exposure unchanged: the POSTED ticket worth 1433393 cents leaves the
          uncollected term and re-enters as an invoice balance of 1439127 cents, because the admin fee of 5734
          cents rides on top. The conserved quantity is the round trip: voiding the unpaid invoice must return
          accrual exposure to exactly 1433393, invoiced exposure to 0, and the ticket to POSTED with invoice_id
          null so a reissue sweeps precisely the same ticket. The money invariant is therefore about the pair of
          transitions, not about either one alone.
