            - "HTTP status == 422"
            - "BuyerContract.${c1}.reserved_qty_lbs == 0 (no reservation leaked)"

  - rule_id: boundary_precision_check
    instances:
      - name: aflatoxin_threshold_twenty_ppb
        grounds:
          - calculations.aflatoxin_verdict
          - state_machines.FieldLot.SAMPLED_to_REJECTED
        distinguishing_aspect: |
          Boundary on the aflatoxin metric via POST /lab-tests: 19.9 ppb passes
          (lot -> GRADED) while exactly 20.0 ppb fails (lot -> REJECTED); the
          comparison is >=, so the boundary value itself rejects.
        test_recipe:
          setup:
            - "Grower G1; two lots A and B, each with MOISTURE_KERNEL recorded (status SAMPLED)"
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Riverbend Orchards", ranch_code: "RB-01", base_price_cents_per_lb: 250 }
              as: PlantAdmin
              captures: { g1: $.data.id }
