            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/licensing-agreements/${lic_oo}/activations"
              payload: {}
              as: LicensingOfficer
              captures: { lic_oo_v1: $.data.version }
          trigger:
            - call: "POST /cpt/content-delivery-orders"
              payload: { license_id: "${lic_oo}", distribution_channel: "SITE", format_params: { electronic_format: "NONE", media: "NONE", version_qualifier: "2026.1", payer_identifier_qualifier: "NONE" }, payer_identifier: "PLACEHOLDER", expected_license_version: "${lic_oo_v1}" }
              as: Licensee
              as_user_id: "${lic_oo}"
              captures: { del_oo: $.data.id, lic_oo_v2: $.data.version }
          assert:
            - "ContentDeliveryOrder.${del_oo}.delivery_status == RESERVED"
            - "ContentDeliveryOrder.${del_oo}.activation_mode == SITE"
            - "LicensingAgreement.${lic_oo}.version == ${lic_oo_v1} + 1"

      - name: stale_change_version_blocks_cycle_submission
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cycle-submit-stale-change]
          - errors[ERR_STALE_VERSION]
          - state_machines.ReleaseCycle.OPEN_to_PLANNING
        distinguishing_aspect: |
          The second OCC rule on a different parent: a cycle submission carrying
          the change version observed before an intervening posting advanced it
          fails with ERR_STALE_VERSION at status 412.
        test_recipe:
          setup:
            - "One ACTIVE ChangeApplicant, one meeting and one open ReleaseCycle"
            - "Logical clock at 2026-09-01T00:00:00Z"
            - "One DRAFT CodeChange 00103 whose version advanced after an administrative return"
