  - section: consistency_model
    instances:
      - name: confirm_response_reflects_all_side_effects_immediately
        claim_type: immediate
        grounds:
          - state_machines.Order.PLACED_to_CONFIRMED
          - state_machines.FinancingPlan.ACCEPTED_to_ACTIVE
        distinguishing_aspect: "Immediate consistency: the confirm response itself carries order_status CONFIRMED and payment_status FINANCED, and a GET on the financing plan in the same test turn shows ACTIVE with activated_at set — no delayed reconciliation."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. PLACED order with an ACCEPTED ZERO_APR plan."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sleep/stores"
              payload: { name: "S", zone_codes: ["941"] }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /sleep/product-models"
              payload: { sku: "MAT-1", name: "M", category: "MATTRESS", price_cents: 240000, replacement_part_price_cents: 0, warranty_months: 120 }
              as: PlatformAdmin
            - call: "POST /sleep/customers"
              payload: { home_store_id: "${store_id}", email: "i@x.com", full_name: "Ivy I" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /sleep/fit-assessments"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", sleep_position: "BACK", weight_band: "BAND_130_230", partner_sleeper: false, preferred_feel: "MEDIUM" }
              as: SalesAssociate
              captures: { fa_id: $.data.id }
            - call: "POST /sleep/fit-assessments/${fa_id}/complete"
              payload: {}
              as: SalesAssociate
            - call: "POST /sleep/orders"
              payload: { customer_id: "${cust_id}", fit_assessment_id: "${fa_id}", line_items: [{ sku: "MAT-1", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /sleep/financing-plans"
              payload: { order_id: "${order_id}", offer_type: "ZERO_APR", term_months: 12, apr_bps: 0 }
              as: FinanceAgent
              captures: { plan_id: $.data.id }
            - call: "POST /sleep/financing-plans/${plan_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /sleep/orders/${order_id}/confirm"
