          difficulty_instance: non_linear_state_machine / negotiation_round_trip_cycle_and_impasse_reentry
          rationale: "The round-trip cycle, the impasse re-entry edge and the BlackoutNotice SERVED -> SUPERSEDED side effect are all pinned by that §1.8 instance."
      - name: corner_agreement_two_dimensions_advance_independently
        claim_type: parallel
        grounds: [state_machines.CarriageAgreement.NET:PENDING_NETWORK_to_NET:NETWORK_APPROVED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / agreement_execution_and_network_dimensions_advance_independently
          rationale: "The execution x network_approval product state and the premature-execute refusal are asserted there."
      - name: corner_withdraw_compensates_every_filing_side_effect
