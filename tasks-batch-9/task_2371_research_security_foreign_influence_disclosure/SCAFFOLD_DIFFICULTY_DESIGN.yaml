  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: travel_windows_are_closed_so_adjacent_trips_conflict
        grounds:
          - calculations.travel_overlap_check
          - state_machines.TravelRegistration.DRAFT_to_SUBMITTED
          - calculations.travel_device_requirement
          - errors.ERR_TRAVEL_WINDOW_CONFLICT
        distinguishing_aspect: |
          Travel windows are CLOSED intervals [depart_on, return_on], so a trip departing exactly
          on the return instant of a SUBMITTED trip is a conflict — the traveller cannot be in two
          places on the same instant. Cancelling the first trip releases the window and the very
          same submission succeeds, proving the check reads live status rather than history.
        test_recipe:
          setup:
            - "Logical clock at the default 2026-08-01T00:00:00Z."
            - "Investigator INV with trip T1 to JP over [2026-09-01, 2026-09-10] already SUBMITTED."
            - "Trip T2 to JP over [2026-09-10, 2026-09-20] created and still in DRAFT; carries_institutional_device false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /investigators"
              payload: { full_name: "Rui Sato", email: "rui.sato@uni.edu", appointment_type: "FACULTY", home_department: "Economics", institutional_base_effort_pct: 0 }
              as: SystemAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /travel-registrations"
              payload: { investigator_id: "${inv_id}", destination_country_code: "JP", depart_on: "2026-09-01T00:00:00Z", return_on: "2026-09-10T00:00:00Z", purpose: "CONFERENCE", carries_institutional_device: false }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /travel-registrations"
              payload: { investigator_id: "${inv_id}", destination_country_code: "JP", depart_on: "2026-09-10T00:00:00Z", return_on: "2026-09-20T00:00:00Z", purpose: "COLLABORATION", carries_institutional_device: false }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { t2_id: $.data.id }
            - call: "POST /travel-registrations/${t1_id}/status"
              payload: { to_status: "SUBMITTED" }
              as: Investigator
              as_user_id: "${inv_id}"
          trigger:
            - call: "POST /travel-registrations/${t2_id}/status"
              payload: { to_status: "SUBMITTED" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /travel-registrations/${t1_id}/status"
              payload: { to_status: "CANCELLED" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /travel-registrations/${t2_id}/status"
              payload: { to_status: "SUBMITTED" }
              as: Investigator
              as_user_id: "${inv_id}"
          assert:
            - "trigger call 1 returns 409 ERR_TRAVEL_WINDOW_CONFLICT (2026-09-10 is inside the closed window of T1)"
            - "TravelRegistration.${t2_id}.status is still DRAFT after trigger call 1"
            - "trigger call 2 returns 200 and TravelRegistration.${t1_id}.status == CANCELLED"
            - "trigger call 3 returns 200 and TravelRegistration.${t2_id}.status == SUBMITTED"
            - "TravelRegistration.${t2_id}.risk_flag_count == 0, device_requirement_tier == NONE, briefing_required == false"

      - name: area_windows_are_half_open_so_adjacent_grants_coexist
        grounds:
          - calculations.controlled_area_capacity_projection
          - state_machines.ControlledAccessGrant.REQUESTED_to_ACTIVE
          - entities.ControlledAccessGrant.fields.peak_concurrency_at_request
          - errors.ERR_AREA_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Controlled-area windows are HALF-OPEN [valid_from, valid_until), deliberately the opposite
          of travel: a grant starting exactly on another grant's valid_until activates against a
          capacity of 1, while a third window that straddles both instants projects a peak of 2 and
          is refused. Sharing one interval helper between travel and area capacity necessarily
          breaks one of the two rules.
        test_recipe:
          setup:
            - "Logical clock at the default 2026-08-01T00:00:00Z."
            - "Project P with controlled_area_capacity 1 and security CLEARED."
            - "Investigators INV_A, INV_B, INV_C, each an ACTIVE personnel row on P with a COMPLETED CONTROLLED_AREA_SAFETY assignment."
            - "Grants: G_A over [2026-09-01, 2026-09-10) ACTIVE; G_B over [2026-09-10, 2026-09-20) REQUESTED; G_C over [2026-09-05, 2026-09-15) REQUESTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /projects"
              payload: { title: "Secure Materials Bay", agency_code: "DOD", sensitivity_level: "CONTROLLED", award_amount_cents: 80000000, period_start: "2026-09-01T00:00:00Z", period_end: "2028-08-31T00:00:00Z", controlled_area_capacity: 1 }
              as: SystemAdmin
              captures: { p_id: $.data.id }
            - call: "POST /investigators"
              payload: { full_name: "Sam Tolu", email: "sam.tolu@uni.edu", appointment_type: "FACULTY", home_department: "Mechanical Engineering", institutional_base_effort_pct: 0 }
              as: SystemAdmin
