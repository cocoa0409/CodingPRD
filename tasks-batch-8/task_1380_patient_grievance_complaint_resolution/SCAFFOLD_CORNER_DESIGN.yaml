  - section: consistency_model
    instances:
      - name: immediate_closure_visibility_on_read
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, state_machines.PatientCase.RESPONSE_DRAFTING_to_CLOSED]
        distinguishing_aspect: "Immediate consistency: the complaint close response and an immediately-following GET agree (CLOSED, closed_at set), and the follow-up is already listable — no asynchronous lag."
        test_recipe:
          setup: ["COMPLAINT fast-tracked to RESPONSE_DRAFTING"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "Clinic", category: "OUTPATIENT" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ivy Investigator", capabilities: ["INVESTIGATOR"] }, as: SystemAdmin, captures: { inv: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Dana Director", capabilities: ["DIRECTOR"] }, as: SystemAdmin, captures: { dir: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-0701", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "PORTAL", description: "Billing question", grievance_category: "BILLING" }, as: IntakeCoordinator, captures: { c1: $.data.id, c1v: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "COMPLAINT", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${c1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { c1v2: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${c1v2}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${c1}/fast-track", payload: {}, as: IntakeCoordinator }
          trigger:
            - { call: "POST /api/patient-cases/${c1}/close", payload: { closure_note: "Resolved at the desk immediately" }, as: IntakeCoordinator, captures: { cst: $.data.lifecycle_status, cat: $.data.closed_at, tim: $.data.resolution_timeliness } }
            - { call: "GET /api/patient-cases/${c1}", as: IntakeCoordinator, captures: { cst2: $.data.lifecycle_status } }
            - { call: "GET /api/follow-ups?case_id=${c1}", as: IntakeCoordinator, captures: { fu: "$.data[0].status" } }
