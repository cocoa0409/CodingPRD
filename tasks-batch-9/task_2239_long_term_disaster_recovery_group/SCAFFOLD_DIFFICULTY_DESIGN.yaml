          setup:
            - "LodgingSite L21 with bed_capacity 20."
            - "Group GA has 12 members, GB has 8, GC has 1."
            - "HA1 books GA from 2026-09-07 to 2026-09-12 (occupying the nights of 09-07 through 09-11 with 12 beds)."
            - "HA2 books GB from 2026-09-09 to 2026-09-14 (nights 09-09 through 09-13 with 8 beds)."
            - "On the nights 09-09, 09-10 and 09-11 the site is at exactly 20 of 20 beds — accepted at the boundary — and peak_committed_beds is 20 with status FULL."
