              as: Underwriter
              captures: { cp: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "TRANSIT", valuation_basis: "ACV", deductible_cents: 100000, aggregate_limit_cents: 200000000, transit_owned_limit_cents: 10000000, transit_hired_limit_cents: 4000000, catastrophe_limit_cents: 5000000 }
              as: Underwriter
              captures: { cpt: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Excavator E1", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { it1: $.data.id }
          trigger:
            - call: "POST /inland-marine/equipment-items/${it1}/assign-jobsite"
