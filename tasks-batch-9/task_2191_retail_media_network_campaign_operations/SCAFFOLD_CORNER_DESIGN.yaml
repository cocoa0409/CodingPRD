  # ===========================================================================
  # 2) STATE MACHINES
  # NOTE ON YAML ANCHORS: the baseline onboarding -> funding -> campaign ->
  # delivery chain is declared once with anchors (&c_*) in the first instance
  # below and re-used by alias (*c_*) afterwards. Aliases expand on load, so
  # every instance still owns a complete, self-contained setup_api_calls list.
  # ===========================================================================
  - section: state_machines
    instances:
      - name: line_item_activate_moves_eligible_to_serving_and_holds_slot_occupancy
        claim_type: valid_transition
        grounds:
          - state_machines.LineItem.ELIGIBLE_to_SERVING
          - endpoints[POST /rmn/line-items/{id}/activate]
          - calculations.line_item_reservation
          - calculations.line_item_priority_tier
        distinguishing_aspect: "Activation reserves daily_budget_cents x 10 whole flight days = 1000000 and assigns TIER_2 (SELF_SERVE with remaining_ratio 1000000/2000000 = 0.5), while PlacementSlot.occupancy_count stays at the 1 granted by the eligibility approval rather than incrementing a second time."
        test_recipe:
          setup:
            - "Advertiser ACTIVE, BudgetPlan ACTIVE with committed_total_cents 2000000, ONSITE slot SRP-A1 with max_concurrent_line_items 2, Campaign DELIVERING with allocated_budget_cents 1000000, one ELIGIBLE LineItem with one ACTIVE hero ProductAssignment."
          setup_api_calls:
            - &c_adv
              call: "POST /rmn/advertisers"
              payload: { legal_name: "Nordvale Foods LLC", brand_code: "NRDV", service_model: "SELF_SERVE", credit_limit_cents: 50000000, self_serve_daily_spend_cap_cents: 5000000 }
              as: NetworkAdmin
              as_user_id: "u_admin"
              captures: { adv_id: $.data.id }
            - &c_adv_sub
              call: "POST /rmn/advertisers/${adv_id}/submit-onboarding"
              payload: { kyc_document_count: 2 }
              as: AccountManager
              as_user_id: "u_am_1"
            - &c_adv_kyc
              call: "POST /rmn/advertisers/${adv_id}/kyc-decision"
              payload: { decision: "APPROVE" }
              as: CreditAnalyst
              as_user_id: "u_ca_1"
              captures: { adv_v: $.data.version }
            - &c_plan
              call: "POST /rmn/budget-plans"
              payload: { advertiser_id: "${adv_id}", fiscal_period_code: "2026-Q3", committed_total_cents: 2000000, trade_fund_share_cents: 0, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-10-01T00:00:00Z", expected_advertiser_version: "${adv_v}" }
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { plan_id: $.data.id }
            - &c_plan_sub
              call: "POST /rmn/budget-plans/${plan_id}/submit"
              payload: {}
              as: AccountManager
              as_user_id: "u_am_1"
            - &c_plan_app
              call: "POST /rmn/budget-plans/${plan_id}/approve"
              payload: {}
              as: CreditAnalyst
              as_user_id: "u_ca_1"
            - &c_slot
              call: "POST /rmn/placement-slots"
              payload: { slot_code: "SRP-A1", channel: "ONSITE", page_type: "SEARCH_RESULTS", position_index: 1, max_concurrent_line_items: 2, floor_cpc_cents: 50, relevance_weight: 1.0 }
              as: NetworkAdmin
              as_user_id: "u_admin"
              captures: { slot_id: $.data.id }
            - &c_camp
              call: "POST /rmn/campaigns"
              payload: { advertiser_id: "${adv_id}", budget_plan_id: "${plan_id}", name: "Back to School", channel_mix: "ONSITE_ONLY", flight_start_at: "2026-08-01T00:00:00Z", flight_end_at: "2026-08-11T00:00:00Z", allocated_budget_cents: 1000000, pacing_mode: "EVEN", daily_cap_cents: 200000, attribution_model: "LAST_TOUCH", attribution_window_days: 14 }
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { camp_id: $.data.id, camp_v: $.data.version }
            - &c_prod
              call: "POST /rmn/catalog-products"
              payload: { sku: "SKU-RED-1", category_code: "FOOTWEAR", title: "red shoes", price_cents: 5000, in_stock_units: 50, margin_pct: 0.4 }
              as: CatalogOps
              as_user_id: "u_cat_1"
              captures: { prod_id: $.data.id }
            - &c_li
              call: "POST /rmn/line-items"
              payload: { campaign_id: "${camp_id}", placement_slot_id: "${slot_id}", bid_cents: 200, bid_type: "CPC", flight_start_at: "2026-08-01T00:00:00Z", flight_end_at: "2026-08-11T00:00:00Z", daily_budget_cents: 100000, category_code: "FOOTWEAR", keyword_match_terms: ["red", "shoes"], expected_campaign_version: "${camp_v}" }
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { li_id: $.data.id, li_v: $.data.version }
            - &c_pa
              call: "POST /rmn/product-assignments"
              payload: { line_item_id: "${li_id}", catalog_product_id: "${prod_id}", is_hero: true, expected_line_item_version: "${li_v}" }
              as: AccountManager
              as_user_id: "u_am_1"
            - &c_li_sub
              call: "POST /rmn/line-items/${li_id}/submit-eligibility"
              payload: {}
              as: AccountManager
              as_user_id: "u_am_1"
            - &c_li_app
              call: "POST /rmn/line-items/${li_id}/eligibility-decision"
              payload: { decision: "APPROVE" }
              as: CatalogOps
              as_user_id: "u_cat_1"
            - &c_camp_rev
              call: "POST /rmn/campaigns/${camp_id}/submit-for-review"
              payload: {}
              as: AccountManager
              as_user_id: "u_am_1"
            - &c_camp_app
              call: "POST /rmn/campaigns/${camp_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: NetworkAdmin
              as_user_id: "u_admin"
            - &c_camp_act
              call: "POST /rmn/campaigns/${camp_id}/activate"
              payload: {}
              as: AccountManager
              as_user_id: "u_am_1"
          trigger:
            - &c_li_act
              call: "POST /rmn/line-items/${li_id}/activate"
              payload: {}
              as: AccountManager
              as_user_id: "u_am_1"
          assert:
            - "HTTP 200"
            - "LineItem.${li_id}.line_item_status == SERVING"
            - "LineItem.${li_id}.pause_reason == NONE"
            - "LineItem.${li_id}.reserved_cents == 1000000"
            - "LineItem.${li_id}.eligible_product_count == 1"
            - "LineItem.${li_id}.priority_tier == TIER_2"
            - "PlacementSlot.${slot_id}.occupancy_count == 1"
            - "Campaign.${camp_id}.delivery_status == DELIVERING"
            - "Campaign.${camp_id}.billing_status == ACCRUING"
            - "BudgetPlan.${plan_id}.plan_status == ACTIVE"

      - name: campaign_complete_advances_delivery_and_billing_dimensions_independently
        claim_type: valid_transition
        grounds:
          - state_machines.Campaign.delivery_status.DELIVERING_to_COMPLETED
          - state_machines.Campaign.billing_status.ACCRUING_to_PENDING_INVOICE
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "One call advances delivery_status DELIVERING -> COMPLETED and, on the independent billing dimension, ACCRUING -> PENDING_INVOICE; the completion also ends the child line item and releases the plan reservation, while billing_status never rewrites delivery_status or vice versa."
        test_recipe:
          setup:
            - "Baseline chain through line item activation (LineItem SERVING, Campaign DELIVERING/ACCRUING, plan reserved 1000000). No auction has been opened, so delivered_spend_cents is 0."
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
            - *c_plan
            - *c_plan_sub
            - *c_plan_app
            - *c_slot
            - *c_camp
            - *c_prod
            - *c_li
            - *c_pa
            - *c_li_sub
            - *c_li_app
            - *c_camp_rev
            - *c_camp_app
            - *c_camp_act
            - *c_li_act
          trigger:
            - call: "POST /rmn/campaigns/${camp_id}/complete"
              payload: {}
              as: BillingOps
              as_user_id: "u_bo_1"
          assert:
            - "HTTP 200"
            - "Campaign.${camp_id}.delivery_status == COMPLETED"
            - "Campaign.${camp_id}.billing_status == PENDING_INVOICE"
            - "Campaign.${camp_id}.delivered_spend_cents == 0"
            - "LineItem.${li_id}.line_item_status == ENDED"
            - "PlacementSlot.${slot_id}.occupancy_count == 0"
            - "BudgetPlan.${plan_id}.reserved_cents == 0"
            - "BudgetPlan.${plan_id}.available_cents == 2000000"
            - "BudgetPlan.${plan_id}.plan_status == ACTIVE"

      - name: scheduled_campaign_archive_reverses_reservation_and_conserves_plan_identity
        claim_type: side_effect_execution
        grounds:
          - state_machines.Campaign.delivery_status.SCHEDULED_to_ARCHIVED
          - calculations.budget_plan_available
          - calculations.advertiser_credit_exposure
        distinguishing_aspect: "Archiving the SCHEDULED campaign is the exact compensation of the review approval: reserved_cents returns to 0 and available_cents back to 2000000 with no drift, the child ELIGIBLE line item is ENDED and releases slot occupancy, yet credit exposure stays at the plan's committed 2000000 because plan-level exposure is independent of campaign reservations."
        test_recipe:
          setup:
            - "Baseline chain up to and including the campaign review approval (Campaign SCHEDULED, plan APPROVED with reserved_cents 1000000 and available_cents 1000000, one ELIGIBLE line item, slot occupancy 1). trade_fund_share_cents is 0 so cash_share_cents == committed_total_cents."
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
            - *c_plan
            - *c_plan_sub
            - *c_plan_app
            - *c_slot
            - *c_camp
            - *c_prod
            - *c_li
            - *c_pa
            - *c_li_sub
            - *c_li_app
            - *c_camp_rev
            - *c_camp_app
          trigger:
            - call: "POST /rmn/campaigns/${camp_id}/archive"
              payload: { archive_reason: "Brief withdrawn before launch" }
              as: NetworkAdmin
              as_user_id: "u_admin"
          assert:
            - "HTTP 200"
            - "Campaign.${camp_id}.delivery_status == ARCHIVED"
            - "LineItem.${li_id}.line_item_status == ENDED"
            - "PlacementSlot.${slot_id}.occupancy_count == 0"
            - "BudgetPlan.${plan_id}.reserved_cents == 0"
            - "BudgetPlan.${plan_id}.consumed_cents == 0"
            - "BudgetPlan.${plan_id}.available_cents == 2000000"
            - "BudgetPlan.${plan_id}.plan_status == APPROVED"
            - "Advertiser.${adv_id}.credit_exposure_cents == 2000000"

      - name: settled_auction_cannot_be_settled_again_returns_409
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.AuctionEvent.terminal_states
          - validations[priority=35]
          - errors[ERR_AUCTION_INVALID_STATE]
        distinguishing_aspect: "SETTLED is the declared terminal state of AuctionEvent, so a repeat settle is refused with 409 ERR_AUCTION_INVALID_STATE and settled_spend_cents stays at the single-settlement value 284 rather than doubling to 568."
