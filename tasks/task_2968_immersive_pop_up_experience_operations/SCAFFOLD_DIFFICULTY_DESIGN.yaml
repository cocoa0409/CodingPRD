      - name: refund_ladder_tier_edges_at_exactly_seventytwo_and_twentyfour_hours
        grounds:
          - calculations.refund_and_credit_settlement
          - constants.REFUND_FULL_HOURS
          - constants.REFUND_HALF_HOURS
          - endpoints[POST /ticket-orders/{orderId}/cancel]
        distinguishing_aspect: |
          A different metric on a different endpoint: hours_before (an exact, unfloored duration) against
          the two-step ladder REFUND_FULL_HOURS 72 and REFUND_HALF_HOURS 24 on
          POST /ticket-orders/{orderId}/cancel. Three cancellations of identical 64500-cent orders on the
          same slot land at exactly 72.000 h, exactly 24.000 h and 23 h 59 m — the >= comparisons mean
