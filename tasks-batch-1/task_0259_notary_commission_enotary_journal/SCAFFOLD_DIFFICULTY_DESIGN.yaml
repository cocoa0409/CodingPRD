  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: session_begin_requires_notary_enotary_authorized
        grounds:
          - state_machines.Session.SCHEDULED_to_IDENTITY_PENDING
          - entities.Notary.fields.enotary_authorized
          - validations[priority=7]
          - errors[ERR_ENOTARY_NOT_AUTHORIZED]
        distinguishing_aspect: |
          Entity pair Session→Notary: Session's SCHEDULED→IDENTITY_PENDING transition is
          gated by the SUBJECT NOTARY's enotary_authorized field. A notary that never
          requested e-notary (enotary_requested=false) has enotary_authorized==false, so
          begin-identity returns ERR_ENOTARY_NOT_AUTHORIZED.
        test_recipe:
          setup:
            - "ACTIVE notary with enotary_requested=false (enotary_authorized=false); a SCHEDULED session with one signer"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
