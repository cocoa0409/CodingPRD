          - entities.BusinessUnitPool.fields.min_utilization_cents
          - entities.BusinessUnitPool.fields.utilization_pct
          - endpoints."POST /bu-pools/{poolId}/submit-calibration"
        distinguishing_aspect: |
          Boundary metric: allocated_cents against min_utilization_cents =
          floor(3,000,000 * 9950 / 10000) = 2,985,000, tested on a third
          endpoint (submit-calibration) and discriminated by a single cent.
