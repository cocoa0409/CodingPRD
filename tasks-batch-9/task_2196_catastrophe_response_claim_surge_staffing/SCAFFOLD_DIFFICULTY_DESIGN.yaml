      - name: desk_loss_ceiling_inclusive_at_10000_00_flips_at_10000_01
        grounds:
          - calculations.inspection_mode_resolution
          - calculations.claim_triage_severity_score
          - entities.Claim.inspection_mode
          - endpoints[POST /claims/{claimId}/triage]
        distinguishing_aspect: |
          Metric: the DESK_LOSS_CEILING currency threshold (10000.00), probed at POST /claims/{claimId}/triage.
          The comparison is <=, so 10000.00 resolves DESK and 10000.01 resolves FIELD. The two probe claims
          are otherwise identical and both round to severity_score 6.50 / FAST_TRACK, so the mode divergence
          is attributable to a single cent and to nothing else. Distinct metric and endpoint from the advance
          headroom and room-count probes.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
