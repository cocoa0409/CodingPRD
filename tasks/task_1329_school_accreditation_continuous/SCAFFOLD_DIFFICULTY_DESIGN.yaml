            - "Reviewer R1 leads CONFIRMED visit V1 on ANOTHER campus of the same system, 2027-05-01..2027-05-03 (R1 now ON_ASSIGNMENT)"
            - "New visit V2 on the first campus, lead R1, dates 2027-03-02..2027-03-05 (overlaps V0)"
            - "Confirming V2 trips temporal (overlap with V0) at priority 6 and referential (R1 not AVAILABLE) at priority 7; priority 6 wins"
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
