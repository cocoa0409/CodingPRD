            - { call: "POST /homeownership/shift-assignments/${asg_id}/confirm", payload: {}, as: Volunteer, as_user_id: "${vol_id}" }
            - { call: "POST /homeownership/construction-shifts/${shift_id}/lock", payload: { safety_briefing_reference: "SB-2026-08-05-A" }, as: ConstructionManager, as_user_id: "cm-1" }
          trigger:
            - { call: "POST /homeownership/construction-shifts/${shift_id}/lock", payload: { safety_briefing_reference: "SB-2026-08-05-A-REPLAY" }, as: ConstructionManager, as_user_id: "cm-1", captures: { e_relock: $.data.error_id } }
