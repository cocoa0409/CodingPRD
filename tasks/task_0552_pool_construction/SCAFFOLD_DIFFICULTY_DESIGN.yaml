            - "trigger response data.error_id == ERR_INVALID_STATE"

      - name: crew_posture_beats_double_book
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_POSTURE_STOP_WORK]
          - errors[ERR_SUBCONTRACTOR_DOUBLE_BOOKED]
        distinguishing_aspect: |
          One crew-create violates BOTH a business_safety rule (posture STOP_WORK from a failed gate,
          priority 7) AND a business_temporal rule (same sub double-booked, priority 9); the server
          returns ERR_POSTURE_STOP_WORK, proving business_safety outranks business_temporal — a
          different category pair than fund_state_beats_fiscal.
        test_recipe:
          setup:
            - "Permitted project; EXCAVATION gate started; sub S; crew A1 (S) booked [06-01 08:00,16:00)."
