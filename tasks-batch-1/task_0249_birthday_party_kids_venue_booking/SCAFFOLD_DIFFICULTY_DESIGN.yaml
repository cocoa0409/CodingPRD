              payload: {}
              as: Coordinator
              captures: { eid: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Booking.${b_id}.status == QUOTE_DRAFT"

      # --- business_safety (9) vs business_fiscal (13): confirm HELD missing host AND deposit ---
      - name: ppvc_staffing_safety_beats_deposit_fiscal
        grounds:
          - validations[priority=9]
          - validations[priority=13]
          - state_machines.Booking.HELD_to_CONFIRMED
        distinguishing_aspect: |
          A confirm on a HELD booking with waivers complete but NO host assigned (priority 9
          business_safety) AND deposit unpaid (priority 13 business_fiscal) returns ERR_HOST_NOT_ASSIGNED,
          not ERR_DEPOSIT_NOT_MET — pairing business_safety vs business_fiscal (a different category pair
          than instance 1).
        test_recipe:
          setup:
