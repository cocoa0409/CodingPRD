      - instance_id: TC-3
        name: credit_hold_fans_out_to_agreements_windows_and_titles
        grounds:
          - state_machines.CarriageAgreement.EXECUTED_to_SUSPENDED
          - state_machines.RightsWindow.CLEARED_to_BLOCKED
          - entities.Distributor.fields.credit_hold_reason
          - entities.ContentTitle.fields.cleared_window_count
          - endpoints[POST /carriage/distributors/{distributorId}/credit-review]
        title: "Credit hold on one operator -> fan-out across every carried agreement -> every cleared window -> every affected title"
        cascade_depth: 4
        rationale: >-
          A credit decision taken on the Distributor aggregate fans out sideways
          across all of that operator's carriage, not down a single parent-child
          chain. Every EXECUTED agreement of the operator suspends in created_at
          ASC order; every CLEARED or ACTIVE window under each of those
          agreements blocks; every ContentTitle touched by a blocked window
          re-derives its own aggregates. The fan-out width is data-dependent, so
          it cannot be hard-coded, and releasing the hold deliberately does NOT
          undo it — the compensation is manual, which is what makes the cascade
          observable in one direction only.
        distinguishing_aspect: >-
          One POST with action=PLACE_HOLD suspends TWO agreements
          (suspension_reason == DISTRIBUTOR_CREDIT_HOLD on both), blocks TWO
          windows on TWO different platforms, and drives TWO titles to
          cleared_window_count == 0 / UNDISTRIBUTED. RELEASE_HOLD afterwards
          restores Distributor.status to ACTIVE while leaving both agreements
          SUSPENDED and both windows BLOCKED — an implementation that
          symmetrically reverses the cascade fails this assertion.
        test_recipe:
          setup: >-
            Northgate Cable Systems carries the network under two executed
            agreements: the 2024 flagship deal on EXPANDED_BASIC and a 2026
            digital-tier deal. One title premieres on linear 2026-08-15 and has an
            EXCLUSIVE STREAMING window on the flagship agreement running
            2026-09-01..2026-09-30 (holdback 17 days, above the 7-day streaming
            holdback); a second title premieres 2026-08-10 and has an EXCLUSIVE
            LINEAR window on the digital deal running 2026-08-20..2026-09-20.
            Both windows are cleared, so each title reads cleared_window_count 1
            — the streaming-only title at EXCLUSIVE_UNCLEARED because no linear
            window backs it, the linear-only title at LINEAR_ONLY.
