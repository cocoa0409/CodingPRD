  # ===========================================================================
  # SECTION 4 - Validations (§1.4)
  #
  # Every instance below drives at least one rule to its error AND then drives
  # the same rule to satisfaction, so a stub implementation that hard-fails or
  # hard-passes the check cannot survive. Where two rules are violated by one
  # request the assertion names the winning priority explicitly.
  # ===========================================================================
  - section: validations
    instances:

      - name: incentive_budget_ceiling_counts_committed_and_reserved_together
        claim_type: aggregate_validation
        grounds:
          - validations[priority 13]
          - calculations.market_budget_rollups
        distinguishing_aspect: "The ceiling is checked against committed + reserved + the amount about to be committed, so an accrual can be rejected by money that is only RESERVED by an armed boost on a completely different cell, and a new quota cell can be rejected by money already COMMITTED to accruals. The instance also lands exactly on the ceiling, where the rule must pass."
        test_recipe:
          setup:
            - "Market DMA-670 (rank 170) with a deliberately small incentive_budget_cents of 6000."
            - "Cell A (P18_34/MID/URBAN, target 4, base 2000) and Cell B (P18_34/MID/SUBURBAN, target 4, base 1000), so reserved == round_half_up(2000*0.25*4,0) + round_half_up(1000*0.25*4,0) == 2000 + 1000 == 3000 while both boosts stay armed."
            - "One household h1 in Cell A (persons_count 2) taken to ACTIVE with tuner MT-002080, so Cell A sits at fill 0.2500 (still UNDER_TARGET, boost still armed) and every accrual costs cell_base == round_half_up(2000 * 1.25, 0) == 2500."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Ceiling", market_code: "DMA-670", dma_rank: 170, incentive_budget_cents: 6000 }
              as: PanelOperationsManager
              captures: { m70_id: "$.data.id" }
            - call: "POST /markets/${m70_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 4, base_incentive_cents: 2000 }
              as: PanelOperationsManager
              captures: { c70a_id: "$.data.id" }
            - call: "POST /markets/${m70_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "SUBURBAN", target_households: 4, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c70b_id: "$.data.id" }
            - call: "POST /households"
              payload: { market_id: "${m70_id}", quota_cell_id: "${c70a_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { h70_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h70_id}", meter_type: "TV_TUNER", serial_no: "MT-002080" }
              as: FieldTechnician
              captures: { mt70_id: "$.data.id" }
            - call: "POST /meters/${mt70_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /households/${h70_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
          trigger:
            - call: "POST /households/${h70_id}/accrue-incentive"
              payload: { period_label: "2026-08" }
              as: PanelOperationsManager
            - call: "POST /households/${h70_id}/accrue-incentive"
              payload: { period_label: "2026-09" }
              as: PanelOperationsManager
              captures: { e70a: "$.data.error_id" }
            - call: "POST /markets/${m70_id}/budget-adjustments"
              payload: { delta_cents: 3000, memo: "Q4 top-up" }
              as: PanelOperationsManager
            - call: "POST /households/${h70_id}/accrue-incentive"
