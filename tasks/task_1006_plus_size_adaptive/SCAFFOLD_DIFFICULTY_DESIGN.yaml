  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_specialty_beats_specialist_overlap
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - state_machines.StylingAppointment.REQUESTED_to_CONFIRMED
          - errors[ERR_SPECIALTY_MISMATCH]
        distinguishing_aspect: |
          Dual failure on CONFIRM: topic ADAPTIVE not in specialist.specialties
          (business_constraint, priority 6) AND the interval overlaps an existing
          confirmed appointment (business_temporal, priority 8); the lower-priority-number
          constraint wins -> ERR_SPECIALTY_MISMATCH, not ERR_SPECIALIST_UNAVAILABLE.
        test_recipe:
          setup:
            - "Specialist skilled only in PLUS_FORMAL with a confirmed appointment 10:00-11:00; a second customer's REQUESTED appointment 10:30-11:30 with topic ADAPTIVE."
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "pp1a@x.com", full_name: "PP1 A", size_code: 22 }
              as: Anonymous
              captures: { custA: $.data.id }
            - call: "POST /customers/register"
              payload: { email: "pp1b@x.com", full_name: "PP1 B", size_code: 22 }
              as: Anonymous
              captures: { custB: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Stylist C", specialties: ["PLUS_FORMAL"], buffer_minutes: 0 }
              as: StoreManager
              captures: { spec_id: $.data.id }
            - call: "POST /appointments"
              payload: { specialist_id: "${spec_id}", start_at: "2026-07-05T10:00:00Z", end_at: "2026-07-05T11:00:00Z", topic: "PLUS_FORMAL" }
              as: Customer
              as_user_id: "${custA}"
              captures: { a_block: $.data.id }
            - call: "POST /appointments/${a_block}/transition"
              payload: { action: "CONFIRM" }
              as: StoreManager
            - call: "POST /appointments"
              payload: { specialist_id: "${spec_id}", start_at: "2026-07-05T10:30:00Z", end_at: "2026-07-05T11:30:00Z", topic: "ADAPTIVE" }
              as: Customer
              as_user_id: "${custB}"
              captures: { a_bad: $.data.id }
          trigger:
            - call: "POST /appointments/${a_bad}/transition"
              payload: { action: "CONFIRM" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SPECIALTY_MISMATCH"
            - "StylingAppointment.${a_bad}.status == REQUESTED"

      - name: checkout_state_beats_insufficient_points
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - state_machines.Order.PENDING_to_AUTHORIZED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Dual failure on a second checkout: order is already AUTHORIZED not PENDING
          (state, priority 5) AND loyalty_redeem_points 100 exceeds the 0 balance
          (business_fiscal, priority 9); the lower-priority-number state check wins ->
          ERR_INVALID_STATE, not ERR_INSUFFICIENT_POINTS.
        test_recipe:
          setup:
            - "An order with one line already checked out (payment AUTHORIZED); customer loyalty_points_balance is 0."
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "pp2@x.com", full_name: "PP Two", size_code: 22 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Adaptive Wrap Dress", category: "DRESSES", base_price_cents: 6000, size_min: 10, size_max: 34 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 22, color: "Navy", inventory_on_hand: 10 }
              as: StoreManager
              captures: { v1: $.data.id }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${v1}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/checkout"
              payload: { loyalty_redeem_points: 100 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Order.${order_id}.payment_status == AUTHORIZED"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: settle_before_tryon_window_boundary_rejected
        grounds:
          - state_machines.BoxShipment.KEPT_PENDING_to_SETTLED
          - entities.BoxShipment.fields.shipped_at
          - errors[ERR_TRYON_WINDOW_OPEN]
        distinguishing_aspect: |
          Time-threshold boundary on the SETTLE endpoint: with shipped_at 2026-07-10 and
          TRYON_WINDOW_DAYS 7, the gate opens at exactly 2026-07-17T00:00:00Z (>=);
          settling at 2026-07-16T23:59:59Z (one second before) is rejected with
          ERR_TRYON_WINDOW_OPEN.
        test_recipe:
          setup:
            - "A LUXE box shipped 2026-07-10 and kept; clock set to 2026-07-16T23:59:59Z, one second before the try-on window opens."
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "bp1@x.com", full_name: "BP One", size_code: 24 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Everyday Tee", category: "TOPS", base_price_cents: 6805, size_min: 10, size_max: 34 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 24, color: "Navy", inventory_on_hand: 20 }
              as: StoreManager
              captures: { vb1: $.data.id }
            - call: "POST /box-subscriptions"
              payload: { plan_tier: "LUXE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id, sub_ver: $.data.version }
            - call: "POST /box-subscriptions/${sub_id}/shipments"
              payload: { expected_subscription_version: "${sub_ver}", item_variant_ids: ["${vb1}"] }
              as: StoreManager
              captures: { ship_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: StoreManager
            - call: "POST /box-shipments/${ship_id}/ship"
              payload: {}
              as: StoreManager
            - call: "POST /box-shipments/${ship_id}/keep-decisions"
              payload: { kept_variant_ids: ["${vb1}"] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T23:59:59Z" }
              as: StoreManager
          trigger:
            - call: "POST /box-shipments/${ship_id}/settle"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_TRYON_WINDOW_OPEN"
            - "BoxShipment.${ship_id}.status == KEPT_PENDING"

      - name: add_line_inventory_zero_boundary_rejected
        grounds:
          - calculations.inventory_availability
          - validations[priority=6]
          - errors[ERR_INSUFFICIENT_INVENTORY]
        distinguishing_aspect: |
          Count-threshold boundary on the add-line endpoint: a variant with
          inventory_on_hand 2 and inventory_reserved 2 has inventory_available 0; adding
          a further line of quantity 1 is rejected because availability >= quantity
          fails at exactly 0 (>=). Different metric (unit count) and endpoint than the
          try-on time boundary.
        test_recipe:
          setup:
            - "A variant with inventory_on_hand 2, fully reserved by an existing order line of quantity 2 (inventory_available 0)."
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "bp2@x.com", full_name: "BP Two", size_code: 22 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Adaptive Wrap Dress", category: "DRESSES", base_price_cents: 6000, size_min: 10, size_max: 34 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 22, color: "Navy", inventory_on_hand: 2 }
              as: StoreManager
              captures: { v1: $.data.id }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${v1}", quantity: 2 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${v1}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_INVENTORY"
            - "ProductVariant.${v1}.inventory_reserved == 2"
            - "ProductVariant.${v1}.inventory_available == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: checkout_blocked_by_suspended_customer
