              as: QualityEngineer
              as_user_id: "qe-001"
            - call: "POST /production-lots/${lot_a}/tests"
              payload: { test_type: "HIPOT", duration_sec: 300, test_voltage_kv: 2.5, breakdown_detected: false }
              as: QualityEngineer
              as_user_id: "qe-001"
            - call: "POST /production-lots/${lot_a}/release"
              payload: { packaged_length_ft: 5000 }
              as: QualityEngineer
              as_user_id: "qe-002"
            - call: "POST /production-lots/${lot_b}/process-steps"
              payload: { step: "DRAWING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_b}/process-steps"
              payload: { step: "STRANDING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_b}/process-steps"
              payload: { step: "EXTRUSION", measured_min_wall_mils: 25.5, measured_max_wall_mils: 30.0, measured_avg_od_mm: 4.10, surface_marking_text: "UL E12345 12AWG THHN 90C 600V" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_b}/tests"
              payload: { test_type: "SPARK", duration_sec: 60, faults_detected: 0 }
              as: QualityEngineer
              as_user_id: "qe-003"
            - call: "POST /production-lots/${lot_b}/tests"
              payload: { test_type: "HIPOT", duration_sec: 300, test_voltage_kv: 2.5, breakdown_detected: false }
              as: QualityEngineer
              as_user_id: "qe-003"
            - call: "POST /production-lots/${lot_b}/release"
              payload: { packaged_length_ft: 2000 }
              as: QualityEngineer
              as_user_id: "qe-004"
            - call: "POST /reels"
              payload: { reel_serial: "R-001", reel_type: "WOOD_RETURNABLE", deposit_usd: 450.00, capacity_ft: 6000 }
              as: ShippingClerk
