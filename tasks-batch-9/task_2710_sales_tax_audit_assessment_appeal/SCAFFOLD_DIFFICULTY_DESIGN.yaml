  - rule_id: transitive_cascade
    instances:
      - name: appeal_reduction_five_hop_cascade_to_taxpayer_compliance
        grounds:
          - state_machines.AppealProceeding
          - entities.AssessmentAdjustment.fields.appeal_proceeding_id
          - entities.Assessment.fields.collection_status
          - state_machines.PaymentArrangement
          - entities.Taxpayer.fields.compliance_status
        distinguishing_aspect: |
          One REDUCED decision must propagate five hops: proceeding DECIDED -> a SYSTEM
          APPEAL_REDUCTION ledger row -> balance_due_cents 0 and collection_status
          SATISFIED -> the APPROVED installment plan COMPLETED -> the Taxpayer's
          compliance_status recomputed DELINQUENT -> COMPLIANT. An implementation that
          stops at hop 3 leaves the plan APPROVED and the taxpayer DELINQUENT.
        test_recipe:
          setup:
            - "The MINI fixture with the clock on 2026-06-30, one CONSUMABLE purchase of 76192 cents (tax 4762, provisional total 5000 which is exactly the small-balance threshold, so the penalty is waived and total_due_cents is 4762)."
