            - { call: "POST /advisory/performance-reports/${r}/finalize", as: ComplianceOfficer, captures: { pr: $.data.portfolio_return_bps, ex: $.data.excess_return_bps } }
          trigger:
            - { call: "POST /advisory/performance-reports/${r}/finalize", as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "first finalize: portfolio_return_bps == 0 and excess_return_bps == -50 (0 - 50)"
            - "second finalize: 409 ERR_REPORT_INVALID_STATE; stored values unchanged"
      - name: portfolio_parallel_dimensions_difficulty
        claim_type: valid_transition
        grounds:
          - "state_machines.Portfolio"
        excluded_because:
          difficulty_instance: portfolio_parallel_drift_dimension_independence
          rationale: "Parallel-dimension independence asserted there."
      - name: proposal_revision_cycle_difficulty
        claim_type: valid_transition
        grounds:
          - "state_machines.RebalanceProposal.NEEDS_REVISION_to_PROPOSED"
        excluded_because:
          difficulty_instance: proposal_revision_cycle_regenerates_trades
          rationale: "Revision loop with regeneration semantics asserted there."
      - name: withdrawal_remodel_loop_difficulty
        claim_type: valid_transition
        grounds:
          - "state_machines.WithdrawalRequest.MODELED_to_SUBMITTED"
        excluded_because:
          difficulty_instance: withdrawal_remodel_loop_after_staleness_revert
          rationale: "Staleness revert loop asserted there."

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: drift_recomputed_against_superseding_ips_targets
        claim_type: input_set_filtering
        grounds:
          - "calculations.drift_assessment"
          - "state_machines.InvestmentPolicyStatement.PENDING_CLIENT_to_ACTIVE"
        distinguishing_aspect: "drift_assessment reads ONLY the client's ACTIVE IPS targets: a portfolio WITHIN_BANDS under the 65/35 policy flips to BREACHED the moment a 55/45 successor is signed — no position or price changed."
        test_recipe:
          setup: ["client; IPS-A ACTIVE with targets US 65.00/5.00 CASH 35.00/5.00; portfolio cash 360000 + EQA 640 @ 1000 (total 1000000, US 6400bps vs 6500 -> WITHIN_BANDS); IPS-B (US 55.00/5.00 CASH 45.00/5.00) driven to PENDING_CLIENT"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Flip", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "A", risk_tolerance_score: 50 }, as: Advisor, captures: { ia: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${ia}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 65.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 35.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${ia}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${ia}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${ia}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "P", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 360000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/securities", payload: { ticker: "EQA", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s: $.data.id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s}", quantity: 640, opening_cost_basis_cents: 640000 }, as: Advisor }
            - { call: "GET /advisory/portfolios/${p}", as: Advisor, captures: { d1: $.data.drift_status } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "B", risk_tolerance_score: 50 }, as: Advisor, captures: { ib: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${ib}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 55.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 45.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${ib}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${ib}/compliance-approve", as: ComplianceOfficer }
          trigger:
            - { call: "POST /advisory/ips-policies/${ib}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "GET /advisory/portfolios/${p}", as: Advisor, captures: { d2: $.data.drift_status } }
          assert:
            - "before successor sign: drift_status == WITHIN_BANDS (drift 100bps within band 500)"
            - "after successor sign: drift_status == BREACHED (|6400 - 5500| = 900 > 500) — input set switched to the new ACTIVE IPS; IPS-A is SUPERSEDED"
      - name: complete_review_advances_due_by_cadence_until_future
        claim_type: correct_result
        grounds:
          - "calculations.ips_review_schedule"
        distinguishing_aspect: "complete-review loops month_add from the OLD due date until strictly past now: due 2027-08-01 with clock 2027-09-15 lands on 2028-08-01 (not 2027-09-15 + 12 and not 2027-08-01 + 1)."
        test_recipe:
          setup: ["ACTIVE IPS cadence 12 activated at default clock (due 2027-08-01T00:00:00Z); clock advanced to 2027-09-15"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Rev", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: CASH_EQUIVALENT, target_pct: 100.00, band_pct: 50.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/_clock/set_current_utc", payload: { to_iso8601: "2027-09-15T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /advisory/ips-policies/${i}", as: Advisor, captures: { od: $.data.review_overdue } }
          trigger:
            - { call: "POST /advisory/ips-policies/${i}/complete-review", as: Advisor, captures: { due: $.data.next_review_due } }
          assert:
            - "before review: review_overdue == true (2027-09-15 > 2027-08-01)"
            - "after complete-review: next_review_due == 2028-08-01T00:00:00Z (accumulated from the old due, strictly past now); review_overdue == false on re-read"
      - name: month_add_clamps_to_short_month_end
        claim_type: correct_result
        grounds:
          - "calculations.ips_review_schedule"
        distinguishing_aspect: "month_add(2026-08-31, 1) clamps to 2026-09-30 (September has 30 days); time-of-day is preserved."
        test_recipe:
          setup: ["IPS at PENDING_CLIENT with cadence 1; clock set to 2026-08-31T10:00:00Z before signing"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Clamp", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
