      - call: POST /vehicle-hub/vehicles
        payload:
          vin: 1G1ZD5ST0LF000804
          make: Chevrolet
          model: Malibu
          year: 2020
          mileage: 43000
          base_price_cents: 2000000
          market_code: ATL-A
        as: PlatformAdmin
        captures:
          rb_veh: $.data.id
      - call: POST /vehicle-hub/vehicles/${rb_veh}/start-recon
        as: ReconOperator
      - call: POST /vehicle-hub/vehicles/${rb_veh}/list
        as: ReconOperator
      trigger:
      - call: POST /vehicle-hub/orders
        payload:
          vehicle_id: ${rb_veh}
          fulfillment_choice: HOME_DELIVERY
        as: WarrantyAdmin
        captures:
          rb_err1: $.data.error_id
      - call: POST /vehicle-hub/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-02T00:00:00Z'
        as: Customer
        as_user_id: ${rb_cust}
        captures:
          rb_err2: $.data.error_id
      - call: POST /vehicle-hub/vehicles/${rb_veh}/list
        as: Customer
        as_user_id: ${rb_cust}
        captures:
          rb_err3: $.data.error_id
      assert:
      - 'WarrantyAdmin creating an order: error_id == ERR_UNAUTHORIZED (403)'
      - 'Customer setting the clock: error_id == ERR_UNAUTHORIZED (403)'
      - 'Customer listing a vehicle (recon transition): error_id == ERR_UNAUTHORIZED (403)'
      - no PurchaseOrder was created for WarrantyAdmin's attempt (GET /vehicle-hub/orders empty)
- section: cross_cutting_layers
  instances:
  - name: cascading_side_effects_listing_blocked_by_intake
    claim_type: cascading_side_effects
    grounds:
    - state_machines.ReconIntake
    - state_machines.Vehicle.IN_RECON_to_LISTED
    distinguishing_aspect: Completing the intake (IN_WORK -> COMPLETE) unblocks the vehicle's list transition — a cross-entity side effect where the child's terminal state releases the parent's gate.
    test_recipe:
      setup:
      - 'same fixture as vehicle_list_blocked_by_open_intake: vehicle IN_RECON with intake IN_WORK'
      setup_api_calls:
      - call: POST /vehicle-hub/reconditioning-centers
        payload:
          name: RC Casc
          market_code: ATL-A
          daily_capacity: 5
          slot_count: 10
        as: PlatformAdmin
        captures:
          cc_center: $.data.id
      - call: POST /vehicle-hub/vehicles
        payload:
          vin: 1G1ZD5ST0LF000805
          make: Chevrolet
          model: Malibu
          year: 2020
          mileage: 43000
          base_price_cents: 2000000
          market_code: ATL-A
          center_id: ${cc_center}
        as: PlatformAdmin
        captures:
          cc_veh: $.data.id
      - call: GET /vehicle-hub/vehicles/${cc_veh}/recon-intakes
        as: ReconOperator
        captures:
          cc_intake: $.data[0].id
      - call: POST /vehicle-hub/recon-intakes/${cc_intake}/arrive
        as: ReconOperator
      - call: POST /vehicle-hub/recon-intakes/${cc_intake}/start-work
        as: ReconOperator
      trigger:
      - call: POST /vehicle-hub/recon-intakes/${cc_intake}/complete
        as: ReconOperator
      - call: POST /vehicle-hub/vehicles/${cc_veh}/list
        as: ReconOperator
      assert:
      - ReconIntake.${cc_intake}.status == COMPLETE
      - 'list now succeeds: Vehicle.${cc_veh}.status == LISTED, listed_price_cents == 2000000 (no annotations), center_id == null'
  - name: trade_in_decline_clears_order_reference_and_recomputes
    claim_type: compensation
    grounds:
    - state_machines.TradeInOffer.INSPECTED_to_DECLINED
    - entities.PurchaseOrder.fields.total_due_cents
    distinguishing_aspect: 'Declining an inspected offer compensates referencing orders: trade_in_offer_id cleared and total_due_cents recomputed without the trade credit (back to price + tax).'
    test_recipe:
      setup:
      - a RESERVED order whose trade-in offer was inspected with 1 mismatch (adjusted 1,960,000 from initial 2,000,000) but never confirmed; order total_due reflects no credit yet
      setup_api_calls:
      - call: POST /vehicle-hub/customers
        payload:
          full_name: TD U
          email: td@x.com
          state_code: GA
        as: PlatformAdmin
        captures:
          td_cust: $.data.id
      - call: POST /vehicle-hub/trade-ins
        payload:
          vin: 1HGCV1F30LA000010
          questionnaire:
            vehicle_band: MID
            accident_history: false
            mechanical_issues: false
            tire_condition: GOOD
            odometer: 45000
            smoker_vehicle: false
        as: Customer
        as_user_id: ${td_cust}
        captures:
          td_offer: $.data.id
      - call: POST /vehicle-hub/vehicles
        payload:
          vin: 1G1ZD5ST0LF000806
          make: Chevrolet
          model: Malibu
          year: 2020
          mileage: 43000
          base_price_cents: 2000000
          market_code: ATL-A
        as: PlatformAdmin
        captures:
          td_veh: $.data.id
      - call: POST /vehicle-hub/vehicles/${td_veh}/start-recon
        as: ReconOperator
      - call: POST /vehicle-hub/vehicles/${td_veh}/list
        as: ReconOperator
      - call: POST /vehicle-hub/orders
        payload:
          vehicle_id: ${td_veh}
          fulfillment_choice: HOME_DELIVERY
          trade_in_offer_id: ${td_offer}
        as: Customer
        as_user_id: ${td_cust}
        captures:
          td_ord: $.data.id
      - call: POST /vehicle-hub/orders/${td_ord}/reserve
        payload:
          expected_vehicle_version: ${vehicles_v1}
        as: Customer
        as_user_id: ${td_cust}
        captures:
          vehicles_v1: $.data.version
      - call: POST /vehicle-hub/trade-ins/${td_offer}/inspect
        payload:
          accident_history_found: true
          mechanical_issues_found: false
          smoker_detected: false
          tire_condition_observed: GOOD
        as: CustomerAdvocate
      trigger:
      - call: POST /vehicle-hub/trade-ins/${td_offer}/decline
        as: Customer
        as_user_id: ${td_cust}
      assert:
      - TradeInOffer.${td_offer}.status == DECLINED, adjusted_offer_cents == 1960000 (1 mismatch linear band)
      - PurchaseOrder.${td_ord}.trade_in_offer_id == null
      - PurchaseOrder.${td_ord}.total_due_cents == 2140000 (price 2,000,000 + GA tax 140,000, no trade credit)
      - PurchaseOrder.${td_ord}.status remains RESERVED
- section: consistency_model
  instances:
  - name: immediate_consistency_after_mutations
    claim_type: immediate_consistency
    grounds:
    - complexity_profile.consistency_model
    distinguishing_aspect: 'All mutations are atomic per request: the response and an immediate re-read show identical state (order version after reserve, vehicle status after reserve cascade).'
    test_recipe:
      setup:
      - a LISTED vehicle and DRAFT order
      setup_api_calls:
      - call: POST /vehicle-hub/customers
        payload:
          full_name: IC U
          email: ic@x.com
          state_code: GA
        as: PlatformAdmin
        captures:
          ic_cust: $.data.id
      - call: POST /vehicle-hub/vehicles
        payload:
          vin: 1G1ZD5ST0LF000807
          make: Chevrolet
          model: Malibu
          year: 2020
          mileage: 43000
          base_price_cents: 2000000
          market_code: ATL-A
        as: PlatformAdmin
        captures:
          ic_veh: $.data.id
      - call: POST /vehicle-hub/vehicles/${ic_veh}/start-recon
        as: ReconOperator
      - call: POST /vehicle-hub/vehicles/${ic_veh}/list
        as: ReconOperator
      - call: POST /vehicle-hub/orders
        payload:
          vehicle_id: ${ic_veh}
          fulfillment_choice: HOME_DELIVERY
        as: Customer
        as_user_id: ${ic_cust}
        captures:
          ic_ord: $.data.id
      trigger:
      - call: POST /vehicle-hub/orders/${ic_ord}/reserve
        payload:
          expected_vehicle_version: ${vehicles_v1}
        as: Customer
        as_user_id: ${ic_cust}
        captures:
          vehicles_v1: $.data.version
      - call: GET /vehicle-hub/orders/${ic_ord}
        as: Customer
        as_user_id: ${ic_cust}
      - call: GET /vehicle-hub/vehicles/${ic_veh}
        as: PlatformAdmin
      assert:
      - reserve response shows PurchaseOrder status RESERVED with version 2; immediate GET confirms identical values
      - immediate GET on vehicle shows status RESERVED and version 4 — cascaded mutation visible in the same logical instant
