              as_user_id: "${a_id}"
          assert:
            - "Proposal.${p3_id}.status == SUBMITTED   # boundary: 100M + 50M + 100M = 250M == luxury; <= passes"
            - "CapSeason.${cs_id}.reserved_cents == 150000000"

      - name: client_release_with_no_active_obligations_empty_set
        grounds:
          - validations[priority=13]
          - state_machines.Client.ACTIVE_to_RELEASED
        distinguishing_aspect: |
          Metric = COUNT of active obligations (empty-set / zero-count edge),
          endpoint = client release. Different metric and endpoint from the
          luxury threshold instance. Release MUST succeed when the active
          obligation set is empty (no NEGOTIATING/SIGNED contracts AND no
          ACTIVE endorsements); MUST fail with ERR_CLIENT_HAS_ACTIVE_OBLIGATIONS
          the moment any single obligation exists.
        test_recipe:
          setup:
            - "Two clients under same agency: C_FREE with zero contracts/endorsements; C_BUSY with one NEGOTIATING contract"
          setup_api_calls:
