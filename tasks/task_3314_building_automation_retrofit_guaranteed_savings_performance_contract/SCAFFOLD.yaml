# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Opaque operator role — manages the logical clock and identity actors"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /owner-reps"
      - "POST /esco-engineers"
    shared_operations:
      - "All GET endpoints"

  - name: ESCOEngineer
    description: "Vendor-side engineer; identity-backed by ESCOEngineer entity"
    identity: "entity_backed:ESCOEngineer"
    exclusive_operations:
      - "POST /performance-contracts"
      - "POST .../complete-audit, .../mobilize"
      - "POST .../baselines + submit"
      - "POST .../bundles + propose/withdraw"
      - "POST .../measures + exclude/install"
      - "POST .../financing-facilities + submit"
      - "POST .../draws"
      - "POST .../phases + mobilize/start"
      - "POST .../disruptions"
      - "POST .../reports + submit"
      - "POST .../baseline-adjustments"
      - "POST .../reports/{id}/disputes (as ESCO filer, on ATTESTED reports)"
    shared_operations:
      - "All GET endpoints"

  - name: OwnerRep
    description: "Facility owner representative; identity-backed by OwnerRep entity"
    identity: "entity_backed:OwnerRep"
    exclusive_operations:
      - "POST .../execute, .../commence-performance, .../close, .../terminate"
      - "POST .../baselines/{id}/approve, .../reject"
      - "POST .../bundles/{id}/approve"
      - "POST .../measures/{id}/verify"
      - "POST .../phases/{id}/complete, .../suspend"
      - "POST .../reports/{id}/attest, .../reconcile"
      - "POST .../baseline-adjustments/{id}/approve, .../reject"
      - "POST .../financing-facilities/{id}/payoff"
      - "POST .../disputes/{id}/escalate"
      - "POST .../reports/{id}/disputes (as OWNER filer, on SUBMITTED reports)"
    shared_operations:
      - "All GET endpoints"
      - "POST .../disputes/{id}/withdraw (owner-filed disputes only)"

  - name: LenderOfficer
    description: "Third-party financier; approves facilities and draws, adjudicates disputes"
    identity: opaque
    exclusive_operations:
      - "POST .../financing-facilities/{id}/approve, .../cancel"
      - "POST .../draws/{id}/approve, .../release, .../reject"
      - "POST .../disputes/{id}/resolve"
    shared_operations:
      - "All GET endpoints"


