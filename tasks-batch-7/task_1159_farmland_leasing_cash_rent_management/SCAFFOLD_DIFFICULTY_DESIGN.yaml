            - call: "POST /bids"
              payload: { offering_id: "${off}", lease_type: "CASH", cash_bid_per_acre_cents: 25000, cash_equivalent_bid_cents_per_acre: 25000 }
              as: Tenant
              as_user_id: "${tn}"
              captures:
                bid: "$.data.id"
            - call: "POST /bids/${bid}/shortlist"
              as: FarmManager
            - call: "POST /offerings/${off}/close"
              as: FarmManager
            - call: "POST /offerings/${off}/award"
              payload: { bid_id: "${bid}" }
              as: Landlord
              as_user_id: "${ld}"
            - call: "POST /leases"
              payload: { bid_id: "${bid}", term_start_date: "2027-03-01T00:00:00Z", term_end_date: "2028-03-01T00:00:00Z", payment_pattern: "MAR_NOV_50_50", escalation_type: "NONE" }
              as: FarmManager
              captures:
                lse: "$.data.id"
