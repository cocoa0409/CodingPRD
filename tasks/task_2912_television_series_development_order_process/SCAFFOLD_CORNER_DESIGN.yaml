      - name: cascading_side_effects_layer_end_to_end_chain
        claim_type: cascading_side_effects
        grounds: ["complexity_profile.complexity_layers", "state_machines[DevelopmentProject]", "calculations.slate_dev_budget_ledger"]
        excluded_because:
          difficulty_instance: "transitive_cascade / abandonment_cascade_four_levels_into_slate_writeoff_ledger"
          rationale: >-
            The guide's cascading_side_effects claim - an N-level chain verified
            end to end - is the whole subject of that §1.8 instance, which walks
            abandonment through project dev_status, its script deals and steps,
            the slate writeoff ledger and the slate posture in one assertion
            block. A separate breadth instance would repeat the same four links.

      - name: cascading_side_effects_layer_partial_failure_and_ordering
        claim_type: cascading_side_effects
        grounds: ["complexity_profile.complexity_layers", "state_machines[GreenlightRequest]", "errors[ERR_FEASIBILITY_FAILED]"]
        excluded_because:
          difficulty_instance: "transitive_cascade / greenlight_approval_cascade_four_levels_releases_pending_step_money"
          rationale: >-
            The guide's ordering-sensitivity and partial-failure claims for this
            layer are covered there (the release of PENDING step money must be
            computed after the deals complete, not before) and by the
            a_finance_approval_on_an_infeasible_deficit_returns_feasibility_failed
            instance in the errors section, which asserts that a refused third
            vote leaves every level of the same cascade untouched.

      - name: dual_variant_calculation_layer_both_variants
        claim_type: dual_variant_calculation
        grounds: ["complexity_profile.complexity_layers", "calculations.pilot_series_feasibility", "endpoints[GET /development-projects/{id}/feasibility]"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / feasibility_pattern_basis_feasible_while_license_basis_infeasible"
          rationale: >-
            "Both variants produce expected results" is exactly that instance's
            assertion set - the same project and episode count read twice, once
            per basis, with both verdicts pinned.

      - name: dual_variant_calculation_layer_delta_on_switch
        claim_type: dual_variant_calculation
        grounds: ["complexity_profile.complexity_layers", "calculations.script_deal_commitment", "entities.ScriptDeal.fields.full_option_exposure_cents"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / script_deal_guaranteed_only_and_full_option_variants_diverge"
          rationale: >-
            "Delta on switch is correct" is that instance's subject: the
            guaranteed-only and full-option exposures are computed from one
            stored step list and their difference is asserted to the cent.

