            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GlucoMeter-X", serial_number: "SN-0501", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "MANUAL_ENTRY", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev1_id: $.data.id }
          trigger:
            - call: "POST /poct/certificates/${cert_id}/suspend"
              payload: { reason: "Sanction pending after complaint survey" }
              as: ProgramAdmin
              captures: { cert_status: $.data.status, covered_sites: $.data.covered_site_count, cert_v2: $.data.version }
          assert:
            - "${ca_status} == SUBMITTED before the trigger"
            - "${cert_status} == SUSPENDED and ${covered_sites} == 1"
            - "${cert_v2} == ${cert_v1} + 1"
            - "CliaCertificate.${cert_id}.suspension_reason == Sanction pending after complaint survey"
            - "CertificateCoverage.${cov_id}.permitted_complexity_snapshot == WAIVED (the coverage snapshot is an immutable audit value and is not rewritten)"
            - "TestSite.${site_id}.oversight_posture == SUSPENDED and TestSite.${site_id}.manual_entry_blocked == true"
            - "Operator.${op_dir_id}.access_status == LOCKED_OUT, Operator.${op_b_id}.access_status == LOCKED_OUT, Operator.${op_a_id}.access_status == LOCKED_OUT"
            - "Operator.${op_a_id}.lockout_reason == SITE_SUSPENDED and Operator.${op_a_id}.competency_status == PROVISIONAL (untouched second dimension)"
            - "CompetencyAssessment.${ca_id}.status == VOIDED and CompetencyAssessment.${ca_id}.decided_by_user_id == null"
            - "Device.${dev1_id}.status == QC_LOCKED and Device.${dev1_id}.qc_lock_reason == CERTIFICATE_SCOPE"
            - "Device.${dev1_id}.manual_entry_suspended == true"
            - "TestSite.${site_id}.locked_out_operator_count == 3 and TestSite.${site_id}.total_operator_count == 3"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: expired_certificate_preempts_complexity_scope_on_device_create
        grounds:
          - validations[priority=57].ERR_CERTIFICATE_EXPIRED
          - validations[priority=62].ERR_COMPLEXITY_SCOPE_EXCEEDED
          - endpoints[POST /poct/devices]
        distinguishing_aspect: |
          The same POST /poct/devices request violates the temporal rule at
          priority 57 (the only covering certificate expired on 2026-08-31,
          clock is 2026-09-05) and the constraint rule at priority 62 (a
          MODERATE device on a WAIVED site); the response must be
          ERR_CERTIFICATE_EXPIRED / 422 - an implementation that runs the
          constraint category first returns ERR_COMPLEXITY_SCOPE_EXCEEDED.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z so setup succeeds, then advances to 2026-09-05T00:00:00Z."
            - "One certificate of waiver effective 2026-01-01 and expiring 2026-08-31 covers the site for exactly that window."
            - "The site has complexity_scope WAIVED, so any MODERATE device also breaches priority 62."
            - "An oversight run after the clock jump moves the certificate to EXPIRED so the site has no active covering certificate."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243012", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2026-08-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Short Coverage POCT", department_code: "DEPT-210", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-08-31" }
              as: ProgramAdmin
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/oversight-runs"
              payload: { note: "Post-expiry sweep" }
              as: ProgramAdmin
              captures: { expired_certs: $.data.certificates_expired }
          trigger:
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "ChemAnalyzer-M", serial_number: "SN-0601", analyte: "CHEMISTRY_PANEL", complexity_class: "MODERATE", connectivity_mode: "INTERFACED", qc_frequency_days: 7 }
              as: ProgramAdmin
              captures: { error_id: $.data.error_id, message: $.data.message }
          assert:
            - "HTTP status == 422"
            - "${error_id} == ERR_CERTIFICATE_EXPIRED (priority 57 wins)"
            - "${error_id} != ERR_COMPLEXITY_SCOPE_EXCEEDED (priority 62 is also violated by the same request)"
            - "${expired_certs} == 1"
            - "CliaCertificate.${cert_id}.status == EXPIRED"
            - "GET /poct/devices?site_id=${site_id} returns total_count == 0 (the rejected create left no row)"
            - "TestSite.${site_id}.oversight_posture == SUSPENDED and TestSite.${site_id}.manual_entry_blocked == true (the oversight run left the site with no in-window ACTIVE coverage)"

      - name: stale_version_preempts_insufficient_competency_methods_on_assessment_create
        grounds:
          - validations[priority=30].ERR_STALE_VERSION
          - validations[priority=63].ERR_INSUFFICIENT_COMPETENCY_METHODS
          - concurrency_rules.assessment-create-stale-operator
        distinguishing_aspect: |
          The create carries both a stale expected_operator_version and
          methods_demonstrated 4 (in the declared 1..6 range so the request
          shape is valid, but below the 6 required elements); the OCC rule at
          priority 30 must win over the business constraint at priority 63,
          returning ERR_STALE_VERSION / 412.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One WAIVED site with ACTIVE waiver coverage; op_dir (PHYSICIAN) is the assigned lab director; op_b is a trained assessor."
            - "op_a is trained, so its version has advanced past creation; the trained version is captured as op_a_v."
            - "The trigger sends expected_operator_version one behind the captured value, i.e. the pre-training version."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243013", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Rehab POCT", department_code: "DEPT-220", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2027-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Dr Iris Vale", role_title: "PHYSICIAN", hire_date: "2026-01-15" }
              as: ProgramAdmin
              captures: { op_dir_id: $.data.id }
            - call: "POST /poct/operators/${op_dir_id}/training"
              payload: { training_module_code: "POCT-101", completed_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "PATCH /poct/sites/${site_id}/director"
              payload: { lab_director_operator_id: "${op_dir_id}" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Ben Osei", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-02-01" }
              as: ProgramAdmin
              captures: { op_b_id: $.data.id }
            - call: "POST /poct/operators/${op_b_id}/training"
              payload: { training_module_code: "POCT-101", completed_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Alma Ruiz", role_title: "MEDICAL_ASSISTANT", hire_date: "2026-03-01" }
              as: ProgramAdmin
              captures: { op_a_id: $.data.id }
            - call: "POST /poct/operators/${op_a_id}/training"
              payload: { training_module_code: "POCT-101", completed_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "GET /poct/operators/${op_a_id}"
              as: QualityCoordinator
              captures: { op_a_v: $.data.version }
          trigger:
            - call: "POST /poct/competency-assessments"
              payload: { operator_id: "${op_a_id}", assessor_operator_id: "${op_b_id}", device_model: "GlucoMeter-X", assessment_type: "INITIAL", methods_demonstrated: 4, effective_date: "2026-08-01", expires_at: "2027-08-01", expected_operator_version: "${op_a_v} - 1" }
              as: QualityCoordinator
              captures: { error_id: $.data.error_id, message: $.data.message }
          assert:
            - "HTTP status == 412"
            - "${error_id} == ERR_STALE_VERSION (priority 30 wins)"
            - "${error_id} != ERR_INSUFFICIENT_COMPETENCY_METHODS (priority 63 is also violated: 4 < 6)"
            - "Operator.${op_a_id}.version == ${op_a_v} (unchanged by the rejected write)"
            - "Operator.${op_a_id}.competency_status == PROVISIONAL and Operator.${op_a_id}.access_status == ACTIVE"
            - "TestSite.${site_id}.total_operator_count == 3"

      - name: unverified_lot_preempts_operator_access_lock_on_result_capture
        grounds:
          - validations[priority=44].ERR_LOT_NOT_VERIFIED
          - validations[priority=52].ERR_OPERATOR_ACCESS_LOCKED
          - endpoints[POST /poct/test-results]
        distinguishing_aspect: |
          A result capture uses an UNVERIFIED lot (state rule, priority 44)
          and an untrained operator whose access_status is LOCKED_OUT (safety
