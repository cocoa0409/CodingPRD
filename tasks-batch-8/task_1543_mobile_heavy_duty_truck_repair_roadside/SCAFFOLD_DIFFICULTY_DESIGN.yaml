# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN (Section 1.8) — task 1543
# Mobile Heavy-Duty Truck Repair & Roadside. 9 difficulty rules x 3 instances.
# All money literals precomputed from SCAFFOLD.yaml calculations/constants.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: estimate_provisional_vs_final_invoice_divergence
        grounds:
          - calculations.estimate_pricing
          - calculations.final_invoice_pricing
          - calculations.travel_charge
        distinguishing_aspect: |
          Same call, two pricing bases on the ServiceCall/Invoice money domain: the estimate
          (provisional variant) prices travel one-way with the free-mile deduction, estimated
          hours/parts, and no travel-time component (161444 cents); the invoice (final variant)
          prices actual hours, after-hours portal-to-portal travel (2x30=60 billable miles, no
          free miles), actual travel minutes, and actual parts (200995 cents). Delta == 39551.
        test_recipe:
          setup:
            - "After-hours P1 call for a GOLD-tier fleet (mtd adjusted to 200000), MASTER technician, estimate 2.0h/30mi/80000c parts approved; final job: 2.0h actual, 30 actual one-way miles, 80 travel minutes, 1x STARTER-9 @ 82000."
          setup_api_calls:
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T18:30:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/rate-cards", payload: { name: "STD-2026", labor_rate_standard_cents: 14500, labor_rate_master_cents: 17500, after_hours_multiplier_bp: 15000, travel_free_miles: 25, travel_per_mile_cents: 425, travel_time_per_minute_cents: 200, emergency_callout_fee_cents: 25000, parts_tax_rate_bp: 725, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: OpsAdmin, captures: { rc: $.data.id } }
            - { call: "POST /roadside/fleet-accounts", payload: { company_name: "HaulCo", account_number: "ACCT-1001", billing_email: "ap@haulco.example", per_call_authorization_limit_cents: 100000, monthly_spend_cap_cents: 500000, rate_card_id: "${rc}" }, as: OpsAdmin, captures: { fa: $.data.id } }
            - { call: "POST /roadside/fleet-accounts/${fa}/spend-adjustments", payload: { amount_cents: 200000, reason: "prior-month true-up" }, as: BillingClerk }
            - { call: "POST /roadside/vehicles", payload: { vin: "1FUJHHDR1LLLW0001", unit_number: "U-101", make: "Freightliner", model: "Cascadia", year: 2021, odometer_miles: 120000, fleet_account_id: "${fa}" }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /roadside/technicians", payload: { full_name: "Rita Master", employee_code: "T-100", certifications: ["ENGINE"], labor_rate_class: "MASTER", home_depot_city: "Denver" }, as: OpsAdmin, captures: { t1: $.data.id } }
            - { call: "POST /roadside/technicians/${t1}/set-status", payload: { to_status: "AVAILABLE" }, as: Technician, as_user_id: "${t1}" }
            - { call: "POST /roadside/technicians/${t1}/van-stock", payload: { part_number: "STARTER-9", description: "Starter motor", part_class: "ENGINE", qty_on_hand: 10, unit_cost_cents: 41000, unit_retail_cents: 82000, reorder_point: 2 }, as: OpsAdmin, captures: { vs1: $.data.id } }
            - { call: "POST /roadside/service-calls", payload: { vehicle_id: "${veh}", caller_name: "Sam", caller_phone: "555-0100", breakdown_location_text: "I-70 mm 241", distance_miles_from_depot: 30, symptom_category: "ENGINE_NO_START", symptom_description: "cranks, no start" }, as: Dispatcher, captures: { sc: $.data.id } }
            - { call: "POST /roadside/service-calls/${sc}/triage", payload: { severity: "BLOCKING" }, as: Dispatcher, captures: { sc_v: $.data.version } }
            - { call: "POST /roadside/service-calls/${sc}/dispatches", payload: { technician_id: "${t1}", window_start_at: "2026-08-03T18:30:00Z", window_end_at: "2026-08-03T23:30:00Z", planned_travel_miles: 30, expected_service_call_version: "${sc_v}" }, as: Dispatcher, captures: { d1: $.data.id } }
            - { call: "POST /roadside/dispatches/${d1}/accept", payload: {}, as: Technician, as_user_id: "${t1}" }
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T19:10:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/dispatches/${d1}/depart", payload: {}, as: Technician, as_user_id: "${t1}" }
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T20:30:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/dispatches/${d1}/arrive", payload: { actual_travel_miles: 30 }, as: Technician, as_user_id: "${t1}" }
            - { call: "POST /roadside/service-calls/${sc}/diagnose", payload: { diagnosis_summary: "Failed starter motor", resolution_path: "ON_SITE_REPAIR" }, as: Technician, as_user_id: "${t1}", captures: { sc_v2: $.data.version } }
            - { call: "POST /roadside/service-calls/${sc}/estimates", payload: { labor_hours_est: 2.0, travel_miles_est: 30, parts_estimate_cents: 80000, expected_service_call_version: "${sc_v2}" }, as: Technician, as_user_id: "${t1}", captures: { est: $.data.id, est_total: $.data.total_cents } }
            - { call: "POST /roadside/estimates/${est}/submit", payload: {}, as: Technician, as_user_id: "${t1}" }
            - { call: "POST /roadside/estimates/${est}/approve", payload: {}, as: FleetManager, as_user_id: "${fa}" }
            - { call: "POST /roadside/service-calls/${sc}/start-repair", payload: {}, as: Technician, as_user_id: "${t1}" }
            - { call: "POST /roadside/service-calls/${sc}/part-usages", payload: { van_stock_item_id: "${vs1}", qty: 1 }, as: Technician, as_user_id: "${t1}" }
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T22:00:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/service-calls/${sc}/complete-repair", payload: { labor_hours_actual: 2.0, completion_odometer_miles: 120500 }, as: Technician, as_user_id: "${t1}" }
          trigger:
            - { call: "POST /roadside/service-calls/${sc}/invoices", payload: {}, as: BillingClerk, captures: { inv: $.data.id, inv_total: $.data.total_cents, inv_travel: $.data.travel_amount_cents, inv_labor: $.data.labor_amount_cents, inv_discount: $.data.discount_cents, inv_tax: $.data.tax_cents } }
          assert:
            - "captured estimate total_cents == 161444 (provisional variant: travel one-way 5 billable miles = 2125, no travel time, parts_est 80000)"
            - "Invoice.${inv}.labor_amount_cents == 52500 (2.0h x 17500 x 1.5 after-hours)"
            - "Invoice.${inv}.travel_amount_cents == 25500 (portal-to-portal 2x30 miles x 425, no free-mile deduction)"
            - "Invoice.${inv}.discount_cents == 5950 (GOLD 5% on gross 119000)"
            - "Invoice.${inv}.tax_cents == 5945 (82000 x 7.25% rounded once)"
            - "Invoice.${inv}.total_cents == 200995"
            - "final total 200995 - provisional total 161444 == 39551 (identical call data, divergent variants)"

      - name: warranty_oem_basis_vs_retail_basis_split
        grounds:
          - calculations.warranty_valuation
          - entities.WarrantyClaim.fields.recovered_cents
        distinguishing_aspect: |
          WarrantyClaim domain (distinct from invoice pricing): the same repair is valued twice -
          OEM basis (1.8 flat-rate hours x 12000 + parts at cost 42000 = 63600) vs retail basis
          (2.5 actual hours x 14500 standard rate + parts at retail 69998 = 106248). The
          customer-pay/warranty split is recovered = min = 63600, and the issued invoice total
          drops from 136698 to 73098 via warranty_offset_cents.
        test_recipe:
          setup:
            - "Business-hours DRIVABLE call on a warranty-active vehicle (expires 2027-06-01, miles limit 200000): 2.5h STANDARD labor, 95 travel minutes, 40 actual miles, 2x ALT-104 @ 34999; repair completed."
          setup_api_calls:
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T13:30:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/rate-cards", payload: { name: "STD-2026", labor_rate_standard_cents: 14500, labor_rate_master_cents: 17500, after_hours_multiplier_bp: 15000, travel_free_miles: 25, travel_per_mile_cents: 425, travel_time_per_minute_cents: 200, emergency_callout_fee_cents: 25000, parts_tax_rate_bp: 725, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: OpsAdmin, captures: { rc: $.data.id } }
            - { call: "POST /roadside/fleet-accounts", payload: { company_name: "HaulCo", account_number: "ACCT-1001", billing_email: "ap@haulco.example", per_call_authorization_limit_cents: 100000, monthly_spend_cap_cents: 500000, rate_card_id: "${rc}" }, as: OpsAdmin, captures: { fa: $.data.id } }
            - { call: "POST /roadside/vehicles", payload: { vin: "1FUJHHDR1LLLW0001", unit_number: "U-101", make: "Freightliner", model: "Cascadia", year: 2021, odometer_miles: 120000, fleet_account_id: "${fa}", oem_warranty_expires_at: "2027-06-01T00:00:00Z", oem_warranty_miles_limit: 200000 }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /roadside/technicians", payload: { full_name: "Tom Standard", employee_code: "T-101", certifications: ["ENGINE"], labor_rate_class: "STANDARD", home_depot_city: "Denver" }, as: OpsAdmin, captures: { t2: $.data.id } }
            - { call: "POST /roadside/technicians/${t2}/set-status", payload: { to_status: "AVAILABLE" }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/technicians/${t2}/van-stock", payload: { part_number: "ALT-104", description: "Alternator", part_class: "ENGINE", qty_on_hand: 10, unit_cost_cents: 21000, unit_retail_cents: 34999, reorder_point: 2 }, as: OpsAdmin, captures: { vs2: $.data.id } }
            - { call: "POST /roadside/service-calls", payload: { vehicle_id: "${veh}", caller_name: "Sam", caller_phone: "555-0100", breakdown_location_text: "I-70 mm 241", distance_miles_from_depot: 40, symptom_category: "ENGINE_NO_START", symptom_description: "dead electrical, alternator suspected" }, as: Dispatcher, captures: { sc: $.data.id } }
            - { call: "POST /roadside/service-calls/${sc}/triage", payload: { severity: "DRIVABLE" }, as: Dispatcher, captures: { sc_v: $.data.version } }
            - { call: "POST /roadside/service-calls/${sc}/dispatches", payload: { technician_id: "${t2}", window_start_at: "2026-08-03T13:30:00Z", window_end_at: "2026-08-03T18:30:00Z", planned_travel_miles: 40, expected_service_call_version: "${sc_v}" }, as: Dispatcher, captures: { d1: $.data.id } }
            - { call: "POST /roadside/dispatches/${d1}/accept", payload: {}, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T14:00:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/dispatches/${d1}/depart", payload: {}, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T15:35:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/dispatches/${d1}/arrive", payload: { actual_travel_miles: 40 }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/service-calls/${sc}/diagnose", payload: { diagnosis_summary: "Alternator failure", resolution_path: "ON_SITE_REPAIR" }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/service-calls/${sc}/start-repair", payload: {}, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/service-calls/${sc}/part-usages", payload: { van_stock_item_id: "${vs2}", qty: 2 }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T16:30:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/service-calls/${sc}/complete-repair", payload: { labor_hours_actual: 2.5, completion_odometer_miles: 120450 }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/service-calls/${sc}/warranty-claims", payload: { claim_type: "OEM_BASE", oem_labor_hours: 1.8, oem_labor_rate_cents: 12000, parts_at_cost_cents: 42000 }, as: Technician, as_user_id: "${t2}", captures: { clm: $.data.id, clm_oem: $.data.oem_value_cents } }
            - { call: "POST /roadside/warranty-claims/${clm}/submit", payload: {}, as: WarrantyAdministrator, captures: { clm_retail: $.data.retail_value_cents, clm_rec: $.data.recovered_cents } }
            - { call: "POST /roadside/warranty-claims/${clm}/decide", payload: { decision: "APPROVED" }, as: WarrantyAdministrator }
          trigger:
            - { call: "POST /roadside/service-calls/${sc}/invoices", payload: {}, as: BillingClerk, captures: { inv: $.data.id, inv_total: $.data.total_cents, inv_offset: $.data.warranty_offset_cents } }
          assert:
            - "captured oem_value_cents == 63600 (21600 flat-rate labor + 42000 parts at cost)"
            - "captured retail_value_cents == 106248 (36250 standard-rate actual labor + 69998 retail parts)"
            - "captured recovered_cents == 63600 == min(oem, retail)"
            - "Invoice.${inv}.warranty_offset_cents == 63600"
            - "Invoice.${inv}.total_cents == 73098 (136698 - 63600)"

      - name: travel_standard_vs_after_hours_portal_basis
        grounds:
          - calculations.travel_charge
          - entities.Invoice.fields.travel_miles_billable
        distinguishing_aspect: |
          Travel-charge domain (distinct from invoice totals and warranty valuation): identical
          40 actual one-way miles price at 15 billable miles = 6375 cents business-hours
          (free-mile deduction) vs 80 billable miles = 34000 cents after-hours
          (portal-to-portal 2x, no deduction). Invoice totals 32875 vs 67750 confirm the variant
          selection is driven by the call's after_hours flag.
        test_recipe:
          setup:
            - "Two retail calls, each 1.0h STANDARD labor, 60 travel minutes, 40 actual miles, no parts, DEFERRED severity (P3, no callout): call A received 2026-08-04T14:00:00Z (business), call B received 2026-08-04T20:00:00Z (after-hours)."
          setup_api_calls:
            - { call: "POST /roadside/rate-cards", payload: { name: "STD-2026", labor_rate_standard_cents: 14500, labor_rate_master_cents: 17500, after_hours_multiplier_bp: 15000, travel_free_miles: 25, travel_per_mile_cents: 425, travel_time_per_minute_cents: 200, emergency_callout_fee_cents: 25000, parts_tax_rate_bp: 725, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: OpsAdmin, captures: { rc: $.data.id } }
            - { call: "POST /roadside/vehicles", payload: { vin: "1FUJHHDR1LLLW0002", unit_number: "R-01", make: "Kenworth", model: "T680", year: 2020, odometer_miles: 90000 }, as: Dispatcher, captures: { vehA: $.data.id } }
            - { call: "POST /roadside/vehicles", payload: { vin: "1FUJHHDR1LLLW0003", unit_number: "R-02", make: "Kenworth", model: "T680", year: 2020, odometer_miles: 80000 }, as: Dispatcher, captures: { vehB: $.data.id } }
            - { call: "POST /roadside/technicians", payload: { full_name: "Tom Standard", employee_code: "T-101", certifications: ["ENGINE"], labor_rate_class: "STANDARD", home_depot_city: "Denver" }, as: OpsAdmin, captures: { t2: $.data.id } }
            - { call: "POST /roadside/technicians/${t2}/set-status", payload: { to_status: "AVAILABLE" }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T14:00:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/service-calls", payload: { vehicle_id: "${vehA}", caller_name: "Jo", caller_phone: "555-0111", breakdown_location_text: "US-6 mm 12", distance_miles_from_depot: 40, symptom_category: "ENGINE_NO_START", symptom_description: "won't crank" }, as: Dispatcher, captures: { scA: $.data.id } }
            - { call: "POST /roadside/service-calls/${scA}/triage", payload: { severity: "DEFERRED" }, as: Dispatcher, captures: { scA_v: $.data.version } }
            - { call: "POST /roadside/service-calls/${scA}/dispatches", payload: { technician_id: "${t2}", window_start_at: "2026-08-04T14:00:00Z", window_end_at: "2026-08-04T16:00:00Z", planned_travel_miles: 40, expected_service_call_version: "${scA_v}" }, as: Dispatcher, captures: { dA: $.data.id } }
            - { call: "POST /roadside/dispatches/${dA}/accept", payload: {}, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/dispatches/${dA}/depart", payload: {}, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T15:00:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/dispatches/${dA}/arrive", payload: { actual_travel_miles: 40 }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/service-calls/${scA}/diagnose", payload: { diagnosis_summary: "loose cable", resolution_path: "ON_SITE_REPAIR" }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/service-calls/${scA}/start-repair", payload: {}, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/service-calls/${scA}/complete-repair", payload: { labor_hours_actual: 1.0, completion_odometer_miles: 90100 }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/dispatches/${dA}/complete", payload: {}, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T20:00:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/service-calls", payload: { vehicle_id: "${vehB}", caller_name: "Jo", caller_phone: "555-0111", breakdown_location_text: "US-6 mm 40", distance_miles_from_depot: 40, symptom_category: "ENGINE_NO_START", symptom_description: "won't crank" }, as: Dispatcher, captures: { scB: $.data.id } }
            - { call: "POST /roadside/service-calls/${scB}/triage", payload: { severity: "DEFERRED" }, as: Dispatcher, captures: { scB_v: $.data.version } }
