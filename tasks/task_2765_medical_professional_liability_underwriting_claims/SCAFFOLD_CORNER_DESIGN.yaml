      - name: filing_preparer_cannot_approve_or_reject_its_own_filing_but_may_withdraw_it
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=2]
          - validations[priority=4]
          - roles.ChiefActuary.exclusive_operations
          - state_machines.RateFiling.SUBMITTED_to_WITHDRAWN
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "Priority 2 answers for the analyst (wrong role) before priority 4 can even look at the preparer, and priority 4 answers for the preparing chief actuary on APPROVE and REJECT while exempting WITHDRAW - one endpoint, three different outcomes."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one OBSTETRICS_GYNECOLOGY class and no claims, so adequacy_flag is NOT_EVALUABLE and priority 57 cannot interfere."
            - "A filing prepared BY chief-1 under the shared create operation and submitted, so it sits SUBMITTED with prepared_by_user_id chief-1."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "OBSTETRICS_GYNECOLOGY", base_class_code: "CLASS_6", base_rate_per_million: 38000.00, hazard_index: 7.0, benchmark_severity: 640000.00 }
              as: ActuarialAnalyst
              as_user_id: "act-1"
              captures: { sc_obgyn: $.data.id }
            - call: "POST /mpl/rate-filings"
              payload: { specialty_class_id: "${sc_obgyn}", indication_method: "LOSS_RATIO_METHOD", proposed_rate_change_pct: 4.00, experience_period_start: "2025-08-01", experience_period_end: "2026-08-01", effective_date: "2026-09-01" }
              as: ChiefActuary
              as_user_id: "chief-1"
              captures: { rf_a: $.data.id }
            - call: "POST /mpl/rate-filings/${rf_a}/submission"
              payload: {}
              as: ChiefActuary
              as_user_id: "chief-1"
          trigger:
            - call: "POST /mpl/rate-filings/${rf_a}/decision"
              payload: { decision: "APPROVE", decision_note: "analyst attempting the chief actuary's decision" }
              as: ActuarialAnalyst
              as_user_id: "act-1"
              captures: { err_role: $.data.error_id }
            - call: "POST /mpl/rate-filings/${rf_a}/decision"
              payload: { decision: "APPROVE", decision_note: "preparer approving its own filing" }
              as: ChiefActuary
              as_user_id: "chief-1"
            - call: "POST /mpl/rate-filings/${rf_a}/decision"
              payload: { decision: "REJECT", decision_note: "preparer rejecting its own filing" }
              as: ChiefActuary
              as_user_id: "chief-1"
            - call: "POST /mpl/rate-filings/${rf_a}/decision"
