      - name: attendance_rate_exactly_ninety_allows_re_entry
        metric: "Placement.attendance_rate (4 decimal places, round_half_up) against MIN_ATTENDANCE_RATE 0.9000"
        endpoint: "POST /placements/{placement_id}/request-re-entry"
        grounds:
          - calculations.re_entry_readiness
          - calculations.re_entry_readiness.constants.MIN_ATTENDANCE_RATE
          - entities.Placement.fields.attendance_rate
          - entities.Placement.fields.re_entry_eligible
          - errors[ERR_ATTENDANCE_BELOW_MINIMUM]
        distinguishing_aspect: |
          44/50 days yields attendance_rate 0.8800 and 45/50 yields exactly 0.9000, the inclusive
          boundary. The readiness_score clears 0.7500 in both configurations (0.7700 and 0.7800), so
          the request-re-entry outcome flips on the attendance metric alone: 409
          ERR_ATTENDANCE_BELOW_MINIMUM one day, 200 the next. An implementation using a strict `>`
          comparison, or one that rounds attendance to 2 decimals, fails the second call.
        test_recipe:
          setup:
            - "one home school and one center with seat_capacity 10, certified_teacher_fte 4.00, max_students_per_teacher 12"
            - "one PACKET course ALG1 with total_modules 8, pacing_days 40, required_seat_hours 60.00, proctoring_required false"
            - "one grade-9 student with a PASSED PriorCourseRecord worth 1.00 credit and an ACTIVE plan of required_credits_total 4.00, so expected_credits_by_grade is 1.00 and posture is ON_TRACK (the priority-15 gate passes)"
            - "one SEAT_TIME placement whose referral carries deficiency_credits 4.00; one NEW_CREDIT enrollment with all 8 modules passed"
            - "the logical clock moved to 2026-08-11T00:00:00Z (10 elapsed days of a 40-day pacing window), so pace_index is 4.000 and the readiness pacing_component caps at 1.0000"
            - "one COMPLETED SupportSession on the placement (support_sessions_completed 1)"
            - "attendance logged as 44 present of 50 enrolled days -> attendance_rate 0.8800, readiness_base_score 0.7400, engagement_bonus 0.0300, readiness_score 0.7700"
          setup_api_calls:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_id: $.data.id }
            - call: "POST /centers"
              payload: { name: "Cedar AEC", seat_capacity: 10, certified_teacher_fte: 4.00, support_staff_fte: 2.00, max_students_per_teacher: 12 }
              as: DistrictAdmin
              captures: { ctr_id: $.data.id, ctr_v1: $.data.version }
            - call: "POST /courses"
              payload: { code: "ALG1", title: "Algebra I", subject_area: "MATH", credit_value: 1.00, modality: "PACKET", total_modules: 8, required_seat_hours: 60.00, pacing_days: 40, proctoring_required: false, ncaa_approved: false, min_passing_percent: 60.00 }
              as: DistrictAdmin
              captures: { crs_id: $.data.id }
            - call: "POST /students"
              payload: { home_school_id: "${hs_id}", state_student_id: "S-9201", full_name: "Omar Sadiq", cohort_year: 2029, grade_level: 9 }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /courses"
              payload: { code: "ENG1", title: "English I", subject_area: "ELA", credit_value: 1.00, modality: "PACKET", total_modules: 8, required_seat_hours: 60.00, pacing_days: 40, proctoring_required: false, ncaa_approved: false, min_passing_percent: 60.00 }
              as: DistrictAdmin
              captures: { crs2_id: $.data.id }
            - call: "POST /prior-course-records"
              payload: { student_id: "${stu_id}", course_id: "${crs2_id}", term_code: "2025-S1", original_percent: 81.00, credits_attempted: 1.00, outcome: "PASSED" }
              as: Registrar
              captures: { pcr_id: $.data.id }
            - call: "POST /graduation-plans"
              payload: { student_id: "${stu_id}", required_credits_total: 4.00, grade_replacement_policy: "REPLACE_ON_RECOVERY", projected_completion_term: "2029-S2" }
              as: Registrar
              captures: { plan_id: $.data.id }
            - call: "POST /graduation-plans/${plan_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /referrals"
              payload: { student_id: "${stu_id}", center_id: "${ctr_id}", pathway: "CREDIT_DEFICIENCY", deficiency_credits: 4.00, behavior_incident_count: 1, days_disengaged: 6 }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/screen"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals/${ref_id}/offer"
              payload: { offer_valid_days: 10, expected_center_version: "${ctr_v1}" }
