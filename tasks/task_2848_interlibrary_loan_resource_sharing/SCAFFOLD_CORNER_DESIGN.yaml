              captures: { due_a1: $.data.due_at, orig_a: $.data.original_due_at, count_a: $.data.renewal_count }
            - call: "POST /ill/loans/${loan_b}/renewals"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { err_renew: $.data.error_id }
            - call: "GET /ill/loans/${loan_b}"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { due_b1: $.data.due_at, count_b: $.data.renewal_count }
          assert:
            - "${allowed_a} == true and ${max_a} == 2; ${allowed_b} == false and ${max_b} == 1 — both flags are snapshots of the lending Partner at receipt"
            - "${due_a0} == 2026-08-29T00:00:00Z and ${due_b0} == 2026-08-29T00:00:00Z — identical starting positions"
            - "${due_a1} == 2026-09-12T00:00:00Z and ${count_a} == 1 — extended by RENEWAL_DAYS 14, still far below the MAX_TOTAL_LOAN_DAYS 84 ceiling of 2026-10-24"
            - "${orig_a} == 2026-08-29T00:00:00Z — original_due_at is never rewritten by a renewal"
            - "${err_renew} == ERR_RENEWALS_NOT_ALLOWED_BY_LENDER with HTTP 422, not ERR_RENEWAL_CAP_REACHED — priority 71 is evaluated before priority 72"
            - "${due_b1} == 2026-08-29T00:00:00Z and ${count_b} == 0 — the refused renewal wrote nothing"

      - name: attempt_budget_is_checked_before_the_candidate_pool_is_scored
        claim_type: cascading_validation
        grounds:
          - validations[priority=74]
          - validations[priority=78]
          - errors[ERR_ROTA_ATTEMPTS_EXHAUSTED]
          - errors[ERR_NO_ELIGIBLE_LENDER]
          - entities.Rota.fields.max_attempts
        distinguishing_aspect: "The rota is exhausted (attempt_count 1 of max_attempts 1) and its only entry has been disabled, so both priority 74 and priority 78 would fire; the response is ERR_ROTA_ATTEMPTS_EXHAUSTED (409), which proves the cheap budget check runs before the selector ever scores a candidate set — and the empty-pool answer only appears once the budget is widened."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Patron P-9035 with max_open_requests 5."
            - "Rota TIGHT with max_attempts 1, auto_escalate_pod false and one enabled entry for NORTHU quoting 2000 / 4."
            - "One request is taken in and sourced once, so attempt_count is 1; the lender then declines, returning the request to SOURCING without resetting attempt_count."
            - "The single rota entry is then disabled with PATCH, emptying the candidate pool."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons"
              payload: { external_id: "P-9035", full_name: "Dee Reader", email: "dee@u.edu", patron_type: "GRAD", department: "ANTH", max_open_requests: 5 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { patron_id: $.data.id }
            - call: "POST /ill/partners"
              payload: { code: "NORTHU", name: "North University Library", consortium_code: "MIDWEST", base_lending_fee_cents: 2000, avg_turnaround_days: 4, ships_physical: true, supplies_electronic: true, allows_renewals: true, loan_period_days: 28, max_renewals: 2 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { northu_id: $.data.id }
            - call: "POST /ill/rotas"
              payload: { name: "TIGHT rota", material_type: "LOAN", selection_policy: "LANDED_COST", max_attempts: 1, auto_escalate_pod: false, offer_response_hours: 48 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { rota_id: $.data.id, rota_v0: $.data.version }
            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${rota_id}", expected_rota_version: "${rota_v0}", partner_id: "${northu_id}", manual_rank: 1, quoted_fee_cents: 2000, quoted_turnaround_days: 4, is_enabled: true }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { entry_id: $.data.id }
            - call: "POST /ill/bib-items"
              payload: { title: "Kinship Structures", item_type: "BOOK", publication_year: 2011, isbn: "978-0-000-00059-2", local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 9000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { bib_id: $.data.id }
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_id}", rota_id: "${rota_id}", service_type: "LOAN", delivery_mode: "PICKUP", needed_by: "2026-08-20T00:00:00Z", max_supply_fee_cents: 5000 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { req_id: $.data.id }
            - call: "POST /ill/requests/${req_id}/source"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { offer_id: $.data.id }
            - call: "POST /ill/supply-offers/${offer_id}/decline"
              payload: { decline_reason: "NOT_AVAILABLE" }
              as: PartnerAgent
              as_user_id: "${northu_id}"
              captures: { offer_status: $.data.status }
            - call: "PATCH /ill/rota-entries/${entry_id}"
              payload: { is_enabled: false }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { entry_enabled: $.data.is_enabled }
          trigger:
            - call: "POST /ill/requests/${req_id}/source"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { err_attempts: $.data.error_id }
            - call: "GET /ill/requests/${req_id}"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { status_mid: $.data.status, attempts_mid: $.data.attempt_count }
          assert:
            - "${offer_status} == DECLINED and ${status_mid} == SOURCING with ${attempts_mid} == 1 — a decline returns the request to SOURCING and does NOT reset attempt_count"
            - "${entry_enabled} == false"
            - "${err_attempts} == ERR_ROTA_ATTEMPTS_EXHAUSTED with HTTP 409 — priority 74 wins over priority 78 even though the candidate pool is also empty"
            - "GET /ill/supply-offers?request_id=${req_id} still returns total_count == 1 — the refused sourcing round opened no second offer and did not bump attempt_count to 2"
            - "A second identical source call still returns ERR_ROTA_ATTEMPTS_EXHAUSTED and never ERR_NO_ELIGIBLE_LENDER — the empty pool is unreachable while the budget check fails, so priority 78 has no way to surface here"
            - "The request stays in SOURCING and is only moved to UNFILLED by the ops-run, never by the refused source call"

      - name: two_conflicting_business_gates_resolve_to_the_higher_priority_rule
        claim_type: priority_conflict
        grounds:
          - validations[priority=55]
          - validations[priority=80]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / held_locally_constraint_outranks_patron_balance_fiscal_gate_on_intake
          rationale: "That §1.8 instance violates the priority-55 holdings rule and the priority-80 balance rule in one intake and asserts ERR_HELD_LOCALLY."

      - name: a_gate_reads_the_current_state_of_a_different_entity
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=58]
          - validations[priority=76]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / offer_acceptance_gate_reads_partner_status_suspended_after_the_offer_opened
          rationale: "That §1.8 instance suspends the Partner after the SupplyOffer is opened and asserts that acceptance is then refused on the other entity's state."

      - name: an_operation_valid_now_is_refused_because_it_would_overlap_a_future_window
        claim_type: temporal_validation
        grounds:
          - validations[priority=63]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / agreement_windows_are_half_open_so_adjacency_clears_and_intersection_conflicts
          rationale: "That §1.8 instance admits an adjacent agreement window and refuses an intersecting one with ERR_AGREEMENT_WINDOW_OVERLAP."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: bib_item_patch_updates_only_the_supplied_fields_and_bumps_the_version
        claim_type: standard_crud
        grounds:
          - endpoints[POST /ill/bib-items]
          - endpoints[GET /ill/bib-items/{id}]
          - endpoints[PATCH /ill/bib-items/{id}]
          - entities.BibItem.fields.local_holding_status
        distinguishing_aspect: "A PATCH carrying two of the four optional fields rewrites exactly those two, leaves licensed_access_status and embargo_months as created, and bumps version by exactly 1 — and a second PATCH that re-sends an identical value still increments the version, because the endpoint declares an unconditional bump."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "One BibItem created with local_holding_status NONE, licensed_access_status LICENSED_EMBARGOED, embargo_months 24 and list_price_cents 5000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/bib-items"
              payload: { title: "Glacial Landforms", item_type: "BOOK", publication_year: 2014, isbn: "978-0-000-00060-8", local_holding_status: "NONE", licensed_access_status: "LICENSED_EMBARGOED", embargo_months: 24, list_price_cents: 5000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { bib_id: $.data.id, v0: $.data.version, created: $.data.created_at }
          trigger:
            - call: "PATCH /ill/bib-items/${bib_id}"
              payload: { local_holding_status: "ON_ORDER", list_price_cents: 6400 }
              as: AcquisitionsLibrarian
              as_user_id: "acq-01"
              captures: { holding_1: $.data.local_holding_status, price_1: $.data.list_price_cents, licensed_1: $.data.licensed_access_status, embargo_1: $.data.embargo_months, v1: $.data.version }
            - call: "GET /ill/bib-items/${bib_id}"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { holding_read: $.data.local_holding_status, price_read: $.data.list_price_cents, v_read: $.data.version, created_read: $.data.created_at }
            - call: "PATCH /ill/bib-items/${bib_id}"
              payload: { list_price_cents: 6400 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { v2: $.data.version, price_2: $.data.list_price_cents }
          assert:
            - "${holding_1} == ON_ORDER and ${price_1} == 6400 — both supplied fields are rewritten"
            - "${licensed_1} == LICENSED_EMBARGOED and ${embargo_1} == 24 — omitted optional fields are untouched, not reset to defaults"
            - "${v1} == ${v0} + 1"
            - "${holding_read} == ON_ORDER, ${price_read} == 6400 and ${v_read} == ${v1} — the read-back matches the write response exactly"
            - "${created_read} == ${created} — created_at is never rewritten by a PATCH, while updated_at moves"
            - "${price_2} == 6400 and ${v2} == ${v1} + 1 — a no-op-valued PATCH still bumps the version"
            - "AcquisitionsLibrarian and LibraryAdmin are both accepted; the same PATCH as IllBorrowingStaff returns ERR_UNAUTHORIZED with HTTP 403"

      - name: issuing_an_invoice_flips_its_open_lending_charge_lines_to_invoiced
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /ill/invoices/{id}/issue]
          - state_machines.PartnerInvoice.DRAFT_to_ISSUED
          - entities.LendingCharge.fields.status
          - entities.Partner.fields.lend_receivable_cents
        distinguishing_aspect: "Drafting the invoice leaves every LendingCharge OPEN; only the issue action marks the in-period lines INVOICED, and a line outside the period stays OPEN — so Partner.lend_receivable_cents drops by exactly the face value of the invoiced lines, from 5000 to 3000."
        test_recipe:
          setup:
            - "Clock advanced to 2026-09-01T00:00:00Z so period_month 2026-08 is closed."
            - "Partner EASTV ACTIVE with no ReciprocityAgreement, so the gross_settlement variant applies."
            - "Two OPEN LendingCharge rows: 2000 cents incurred 2026-08-05 (in period) and 3000 cents incurred 2026-09-01 (out of period)."
            - "A DRAFT invoice for 2026-08 has already been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/partners"
              payload: { code: "EASTV", name: "East Valley College Library", consortium_code: "EASTERN", base_lending_fee_cents: 1750, avg_turnaround_days: 6, ships_physical: true, supplies_electronic: false, allows_renewals: false, loan_period_days: 21, max_renewals: 1 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { partner_id: $.data.id }
            - call: "POST /ill/lending-charges"
              payload: { partner_id: "${partner_id}", item_title: "In period line", service_type: "LOAN", charge_cents: 2000, incurred_at: "2026-08-05T00:00:00Z" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { line_in: $.data.id, line_in_status_0: $.data.status }
            - call: "POST /ill/lending-charges"
              payload: { partner_id: "${partner_id}", item_title: "Out of period line", service_type: "COPY", charge_cents: 3000, incurred_at: "2026-09-01T00:00:00Z" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { line_out: $.data.id }
            - call: "GET /ill/partners/${partner_id}"
              payload: {}
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { pv: $.data.version, receivable_0: $.data.lend_receivable_cents }
            - call: "POST /ill/partners/${partner_id}/invoices"
              payload: { expected_partner_version: "${pv}", period_month: "2026-08" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { inv_id: $.data.id, inv_status_0: $.data.status, inv_issued_0: $.data.issued_at, inv_recv: $.data.receivable_total_cents }
            - call: "GET /ill/lending-charges/${line_in}"
              payload: {}
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { line_in_status_1: $.data.status }
          trigger:
            - call: "POST /ill/invoices/${inv_id}/issue"
              payload: {}
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { inv_status_1: $.data.status, inv_issued_1: $.data.issued_at }
            - call: "GET /ill/lending-charges/${line_in}"
              payload: {}
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { line_in_status_2: $.data.status }
            - call: "GET /ill/lending-charges/${line_out}"
              payload: {}
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { line_out_status: $.data.status }
            - call: "GET /ill/partners/${partner_id}"
              payload: {}
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { receivable_1: $.data.lend_receivable_cents }
            - call: "GET /ill/partners/${partner_id}/lending-charges"
              payload: { status: "OPEN" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { open_total: "$.data[0].id" }
          assert:
            - "${line_in_status_0} == OPEN and ${line_in_status_1} == OPEN — creating the DRAFT invoice does not touch the lines"
            - "${inv_status_0} == DRAFT with ${inv_issued_0} == null, and ${inv_recv} == 2150"
            - "${inv_status_1} == ISSUED with ${inv_issued_1} == 2026-09-01T00:00:00Z"
            - "${line_in_status_2} == INVOICED and ${line_out_status} == OPEN — only the in-period line is claimed"
            - "${receivable_0} == 5000 and ${receivable_1} == 3000 — the derived field drops by the invoiced face value 2000, not by the surcharged 2150"
            - "The OPEN-filtered list returns total_count == 1 containing only ${line_out}, and ${open_total} is that row's id"
            - "A second POST /ill/invoices/${inv_id}/issue returns ERR_INVOICE_INVALID_STATE with HTTP 409 and leaves both line statuses unchanged"

      - name: one_ops_run_sweeps_two_independent_step_families_and_the_rerun_is_a_no_op
        claim_type: bulk_action
        grounds:
          - endpoints[POST /ill/ops-runs]
          - state_machines.SupplyOffer.OFFERED_to_EXPIRED
          - state_machines.ElectronicDelivery.AVAILABLE_to_EXPIRED
        distinguishing_aspect: "A single sweep at 2026-09-05 crosses both an offer respond_by of 2026-08-03 and a delivery expires_at of 2026-08-31, so offers_expired and deliveries_expired are each 1 while the other eight counters stay 0; the immediate rerun at the same clock reports all ten counters as 0, proving the sweep is idempotent rather than recomputing from scratch."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z for both intakes, then advanced once to 2026-09-05T00:00:00Z."
            - "Patron P-9040 with max_open_requests 5."
            - "Partner NORTHU with supplies_electronic true on a COPY rota with max_attempts 3 and offer_response_hours 48."
            - "Request A on issn 6666-0001 is sourced only, so its SupplyOffer is OFFERED with respond_by 2026-08-03T00:00:00Z and the request sits in OFFER_PENDING with attempt_count 1."
            - "Request B on issn 6666-0002 is sourced, accepted and electronically delivered on 2026-08-01, so its ElectronicDelivery is AVAILABLE with expires_at 2026-08-31T00:00:00Z."
            - "No physical shipments, no loans, no agreements and no infractions exist, so steps 1, 3, 4, 6 and 8 have nothing to act on; A's attempt_count 1 is below max_attempts 3, so step 7 skips it too."
