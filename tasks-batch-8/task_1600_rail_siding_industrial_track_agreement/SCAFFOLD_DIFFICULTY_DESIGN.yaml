              as: RailroadContractsManager
              captures: { agr_id: $.data.id }
            - call: "POST /agreements/${agr_id}/submit"
              as: RailroadContractsManager
            - call: "POST /agreements/${agr_id}/countersign"
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
            - call: "POST /segments"
              payload: { agreement_id: "${agr_id}", segment_name: "Siding A", length_feet: 1200, storage_capacity_cars: 1 }
              as: RailroadEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /storage-placements"
