            - "countersign with the creation-time version -> err == ERR_STALE_CHECKLIST_VERSION with http 412"
            - "countersign with the post-submit version succeeds: status == COUNTERSIGNED"
            - "DailyChecklist.${chk_id}.version == 3 after the successful countersign"

      - name: staff_release_cascades_cancel_future_shifts_and_locks_identity
        claim_type: cascading_side_effects
        grounds:
          - 'state_machines.StaffMember.ACTIVE_to_RELEASED'
          - 'state_machines.CrewShift.SCHEDULED_to_CANCELLED'
          - 'errors[ERR_SHIFT_INVALID_STATE]'
          - 'errors[ERR_STAFF_INVALID_STATE]'
          - 'errors[ERR_FORBIDDEN]'
        distinguishing_aspect: "Releasing staff compensates their future shifts (today's SCHEDULED and tomorrow's SCHEDULED both become CANCELLED; an already-CANCELLED shift is skipped idempotently); afterwards the released identity is unusable (verify-assembly -> 403), a cancelled shift cannot be confirmed (409 ERR_SHIFT_INVALID_STATE), and a second release fails (409 ERR_STAFF_INVALID_STATE)."
        test_recipe:
          setup: ["Fair in SETUP; crew staff with shifts on 2026-08-01 (today) and 2026-08-02; one ride registered"]
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway CC4", operator_company_name: "ShowCo", location: "Lot 68", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Sup CC4", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Crew CC4", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_id}", captures: { crew_id: "$.data.id", crew_v1: "$.data.version" } }
            - { call: "POST /midway/rides", payload: { fair_id: "${fair_id}", name: "Coaster", manufacturer: "MFG", model: "X1", serial_number: "SN-CC4-1", ride_class: "THRILL", capacity_per_cycle: 4, min_rider_height_in: 48, max_rider_height_in: 80, wind_limit_mph: 30, cycle_inspection_interval: 5, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_id}", captures: { ride_id: "$.data.id" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-01", start_hour: 6, end_hour: 10, shift_role: "SETUP", expected_staff_version: "${crew_v1}" }, as: FairManager, as_user_id: "${sup_id}", captures: { sh1: "$.data.id" } }
            - { call: "GET /midway/staff/${crew_id}", as: FairManager, as_user_id: "${sup_id}", captures: { crew_v2: "$.data.version" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-02", start_hour: 6, end_hour: 10, shift_role: "SETUP", expected_staff_version: "${crew_v2}" }, as: FairManager, as_user_id: "${sup_id}", captures: { sh2: "$.data.id" } }
            - { call: "POST /midway/crew-shifts/${sh2}/cancel", payload: {}, as: FairManager, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /midway/crew-shifts/${sh2}/confirm", payload: {}, as: CrewMember, as_user_id: "${crew_id}", captures: { err_confirm: "$.data.error_id" } }
            - { call: "POST /midway/staff/${crew_id}/release", payload: {}, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/staff/${crew_id}/release", payload: {}, as: FairManager, as_user_id: "${sup_id}", captures: { err_rel: "$.data.error_id" } }
            - { call: "POST /midway/rides/${ride_id}/verify-assembly", payload: {}, as: CrewMember, as_user_id: "${crew_id}", captures: { err_verify: "$.data.error_id" } }
          assert:
            - "confirming the already-CANCELLED shift sh2 -> err_confirm == ERR_SHIFT_INVALID_STATE with http 409"
            - "release succeeds: StaffMember.status == RELEASED and shift sh1 (SCHEDULED, work_date == today) cascades to CANCELLED"
            - "second release -> err_rel == ERR_STAFF_INVALID_STATE with http 409"
            - "verify-assembly by the released crew identity -> err_verify == ERR_FORBIDDEN with http 403 (scope check requires ACTIVE staff)"

      - name: revoked_certification_blocks_checklist_and_double_revoke_fails
        claim_type: cascading_side_effects
        grounds:
          - 'state_machines.OperatorCertification.ACTIVE_to_REVOKED'
          - 'errors[ERR_CERTIFICATION_MISSING]'
          - 'errors[ERR_CERT_INVALID_STATE]'
        distinguishing_aspect: "Revoking an operator's only THRILL certification immediately blocks checklist creation (ERR_CERTIFICATION_MISSING — validity is evaluated live, not cached), and a second revoke fails with ERR_CERT_INVALID_STATE. The revoke here is performed by a StateInspector, exercising the shared revoke operation."
        test_recipe:
          setup: ["Permitted fair; day 2026-08-03 in CHECKLIST_PHASE; operator's THRILL cert revoked after the day began"]
