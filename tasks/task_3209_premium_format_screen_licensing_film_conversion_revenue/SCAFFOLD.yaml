scenario: |
  Premium Format Screen Licensing, Film Conversion & Revenue Share (IMAX): exhibitor agreements covering system installation, branding rights and per-screen revenue share or lease structures, auditorium design requirements including screen geometry, sound calibration and seating sightlines, film conversion of studio content into the premium format with post-production scheduling and filmmaker involvement, release window allocation where a limited number of screens must be scheduled across competing titles, screen scheduling negotiations with studios and exhibitors including hold-over and pull decisions, quality assurance with remote monitoring and technician dispatch, network expansion into new markets and formats, box office reporting and per-screen performance analysis.

domain_name: premium-format-screen-licensing
api_prefix: /v1

complexity_profile:
  primary_archetype: quota-allocation
  secondary_archetype: workflow-orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Market
    parent: null
    common_fields: true
    fields:
      - { name: market_name, type: string, source: input, description: "Market name (e.g. 'Greater Tokyo')" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 country code" }
      - { name: screen_capacity_cap, type: integer, source: input, description: "Maximum number of premium screens permitted in this market" }
      - { name: target_format_mix, type: array, source: input, description: "Ordered list of premium formats this market will support (e.g. ['PREMIUM_2D','PREMIUM_3D'])" }
      - { name: opened_screen_count, type: integer, source: computed, description: "Current count of OPERATING auditoriums whose agreement's market_id is this market" }
      - { name: status, type: enum, source: system, description: "PROSPECT → EVALUATING → APPROVED → BUILDING → LIVE; terminal: ABANDONED" }

  - name: ExhibitorAgreement
    parent: null
    common_fields: true
    fields:
      - { name: exhibitor_legal_name, type: string, source: input, description: "Exhibitor corporate legal name" }
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; the market this agreement operates in" }
      - { name: agreement_type, type: enum, source: input, description: "REVENUE_SHARE | LEASE" }
      - { name: committed_screen_count, type: integer, source: input, description: "Number of premium screens this agreement commits the exhibitor to install" }
      - { name: revenue_share_tier1_pct, type: number, source: input, description: "Tier-1 revenue share fraction (e.g. 0.12 for 12%); required when agreement_type=REVENUE_SHARE" }
      - { name: revenue_share_tier2_pct, type: number, source: input, description: "Tier-2 marginal fraction above TIER1_CAP_CENTS; required when agreement_type=REVENUE_SHARE" }
      - { name: revenue_share_tier3_pct, type: number, source: input, description: "Tier-3 marginal fraction above TIER2_CAP_CENTS; required when agreement_type=REVENUE_SHARE" }
      - { name: annual_lease_fee_cents, type: integer, source: input, description: "Annual flat lease fee; required when agreement_type=LEASE; ignored when REVENUE_SHARE" }
      - { name: term_start_date, type: datetime, source: input, description: "Contract term start (UTC midnight, inclusive)" }
      - { name: term_end_date, type: datetime, source: input, description: "Contract term end (UTC midnight, exclusive)" }
      - { name: total_slots_committed_count, type: integer, source: computed, description: "Count of ScreenSlots in CONFIRMED or HELD_OVER state across all auditoriums owned by this agreement" }
      - { name: status, type: enum, source: system, description: "NEGOTIATING → SIGNED → ACTIVE → EXPIRED | TERMINATED" }

  - name: Auditorium
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> ExhibitorAgreement.id" }
      - { name: auditorium_label, type: string, source: input, description: "On-site label (e.g. 'Screen 7')" }
      - { name: screen_geometry, type: object, source: input, description: "{ width_m: number, height_m: number, curvature_deg: number }" }
      - { name: seating_capacity, type: integer, source: input, description: "Total seat count" }
      - { name: supported_formats, type: array, source: input, description: "Subset of {PREMIUM_2D, PREMIUM_3D, PREMIUM_70MM}" }
      - { name: sound_calibration_profile, type: object, source: input, description: "{ spl_target_db: number, eq_curve_id: string, channel_count: integer }" }
      - { name: last_calibration_at, type: datetime, source: system, description: "Timestamp of last successful sound calibration; set at CALIBRATION → CERTIFIED transition and on re-calibration" }
      - { name: calibration_overdue, type: boolean, source: computed, description: "true iff logical_clock_now > last_calibration_at + 90 days (strictly greater; == 90 days is NOT overdue)" }
      - { name: current_week_admissions, type: integer, source: computed, description: "Admissions across VALIDATED BoxOfficeReports on slots of this auditorium whose reported_date falls in the current calendar week of the logical clock" }
      - { name: quality_score_arithmetic, type: number, source: computed, description: "Variant A of auditorium_quality_score: flat severity-weighted mean over QA alerts in the trailing 30 days of the logical clock" }
      - { name: quality_score_recency, type: number, source: computed, description: "Variant B of auditorium_quality_score: linear-decay recency-weighted severity mean over the same 30-day window" }
      - { name: status, type: enum, source: system, description: "DESIGN → CONSTRUCTION → CALIBRATION → CERTIFIED → OPERATING → DEGRADED → OPERATING (recover); terminal: DECOMMISSIONED" }

  - name: Studio
    parent: null
    common_fields: true
    fields:
      - { name: studio_legal_name, type: string, source: input, description: "Studio corporate legal name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: status, type: enum, source: system, description: "ONBOARDING → ACTIVE → SUSPENDED; terminal: TERMINATED" }

  - name: StudioFilm
    parent: null
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: input, description: "FK -> Studio.id" }
      - { name: title, type: string, source: input, description: "Film title" }
      - { name: runtime_minutes, type: integer, source: input, description: "Theatrical runtime in minutes (must be > 0)" }
      - { name: worldwide_release_date, type: datetime, source: input, description: "Global theatrical release date (UTC midnight)" }
      - { name: format_targets, type: array, source: input, description: "Formats the studio intends to ship (e.g. ['PREMIUM_2D','PREMIUM_3D'])" }
      - { name: status, type: enum, source: system, description: "ANNOUNCED → IN_DISTRIBUTION → OUT_OF_WINDOW → ARCHIVED" }

  - name: ConversionOrder
    parent: null
    common_fields: true
    fields:
      - { name: studio_film_id, type: string, source: input, description: "FK -> StudioFilm.id" }
      - { name: target_format, type: enum, source: input, description: "PREMIUM_2D | PREMIUM_3D | PREMIUM_70MM" }
      - { name: scheduled_post_start_date, type: datetime, source: input, description: "Post-production start (UTC midnight, inclusive). Closed-closed semantics." }
      - { name: scheduled_post_end_date, type: datetime, source: input, description: "Post-production end (UTC midnight, inclusive). Closed-closed interval; overlap check requires a one-day handoff between conversions on the same studio." }
      - { name: filmmaker_approval_required, type: boolean, source: input, description: "When true, QC_REVIEW → APPROVED_FOR_RELEASE requires a filmmaker_signoff field set true", default: false }
      - { name: filmmaker_signoff, type: boolean, source: input, description: "Filmmaker approval flag; required to be true at filmmaker-approval endpoint when filmmaker_approval_required is true", default: false }
      - { name: delivered_master_url, type: string, source: input, description: "URL of the delivered premium-format master", required: false }
      - { name: post_cost_estimate_cents, type: integer, source: computed, description: "Computed at SUBMITTED: base_rate_cents[target_format] + runtime_minutes × per_minute_rate_cents[target_format]; see calculation conversion_post_cost_estimate" }
      - { name: status, type: enum, source: system, description: "SUBMITTED → IN_POST → QC_REVIEW → APPROVED_FOR_RELEASE → DELIVERED; cycle: QC_REVIEW → REWORK_REQUESTED → IN_POST (cyclic); terminal: DELIVERED | CANCELLED" }

  - name: ReleaseWindow
    parent: null
    common_fields: true
    fields:
      - { name: window_label, type: string, source: input, description: "Label (e.g. 'W42-2026'); unique" }
      - { name: window_start_date, type: datetime, source: input, description: "First day of window (UTC midnight, inclusive)" }
      - { name: window_end_date, type: datetime, source: input, description: "Last day of window (UTC midnight, exclusive); half-open" }
      - { name: total_premium_screen_seconds_pool, type: integer, source: input, description: "Global premium screen-seconds pool for this window" }
      - { name: committed_premium_screen_seconds, type: integer, source: computed, description: "Sum of committed_screen_seconds over all ScreenSlots of this window with status CONFIRMED or HELD_OVER" }
      - { name: status, type: enum, source: system, description: "DRAFT → OPEN_FOR_BOOKING → LOCKED → REOPENED → OPEN_FOR_BOOKING (cyclic amendment); terminal: CLOSED" }

  - name: ScreenSlot
    parent: null
    common_fields: true
    fields:
      - { name: window_id, type: string, source: input, description: "FK -> ReleaseWindow.id" }
      - { name: auditorium_id, type: string, source: input, description: "FK -> Auditorium.id" }
      - { name: studio_film_id, type: string, source: input, description: "FK -> StudioFilm.id" }
      - { name: conversion_order_id, type: string, source: input, description: "FK -> ConversionOrder.id" }
      - { name: slot_start_date, type: datetime, source: input, description: "First day of slot (UTC midnight, inclusive)" }
      - { name: slot_end_date, type: datetime, source: input, description: "Last day of slot (UTC midnight, exclusive); half-open" }
      - { name: showings_per_day, type: integer, source: input, description: "Planned showings per day; must be ≥ 1" }
      - { name: priority_tier, type: enum, source: input, description: "BLOCKBUSTER | STANDARD | FILLER", default: "STANDARD" }
      - { name: committed_screen_seconds, type: integer, source: computed, description: "= days_in_slot × showings_per_day × runtime_minutes × 60; recomputed on slot updates" }
      - { name: weekly_gross_cents, type: integer, source: computed, description: "Sum of gross_receipts_cents over VALIDATED BoxOfficeReports of this slot within the slot window" }
      - { name: weekly_admissions, type: integer, source: computed, description: "Sum of admissions over VALIDATED BoxOfficeReports of this slot" }
      - { name: per_screen_attendance_ratio, type: number, source: computed, description: "= weekly_admissions / (seating_capacity × showings_per_day × days_elapsed_in_slot). Computed against the parent Auditorium's seating_capacity. 0 when denominator = 0." }
      - { name: status, type: enum, source: system, description: "PROPOSED → CONFIRMED → HELD_OVER → CONFIRMED (cyclic for next-window extension) | PULLED | REJECTED | SUSPENDED" }

  - name: BoxOfficeReport
    parent: null
    common_fields: false
    fields:
      - { name: screen_slot_id, type: string, source: input, description: "FK -> ScreenSlot.id" }
      - { name: reported_date, type: datetime, source: input, description: "UTC midnight of the day the report covers" }
      - { name: gross_receipts_cents, type: integer, source: input, description: "Gross box office receipts in cents for the day (must be ≥ 0)" }
      - { name: admissions, type: integer, source: input, description: "Paid admissions for the day (must be ≥ 0)" }
      - { name: submission_channel, type: enum, source: input, description: "EXHIBITOR_PORTAL | API_INGEST | MANUAL_UPLOAD" }
      - { name: status, type: enum, source: system, description: "RECEIVED → VALIDATED | FLAGGED_DISCREPANCY" }

  - name: RevenueShareStatement
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> ExhibitorAgreement.id" }
      - { name: window_id, type: string, source: input, description: "FK -> ReleaseWindow.id" }
      - { name: statement_lines, type: array, source: computed, description: "One line per ScreenSlot in window with status ∈ {CONFIRMED, HELD_OVER, PULLED}. Each line: { screen_slot_id, gross_reported_cents, exhibitor_retained_cents, agreed_share_cents, day_count, adjustments: [] }. agreed_share_cents computed by tiered_marginal_share." }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Forward-looking total: includes forecast for unreported days at FORECAST_DAILY_FRACTION × mean of reported days for that slot; see calculation provisional_revenue_share" }
      - { name: final_total_cents, type: integer, source: computed, description: "Chronological total: sums only VALIDATED BoxOfficeReports; see calculation final_revenue_share" }
      - { name: status, type: enum, source: system, description: "DRAFT → ISSUED → RECONCILED; cycle: ISSUED → DISPUTED → ADJUSTED → ISSUED; terminal: RECONCILED" }

  - name: QAAlert
    parent: null
    common_fields: true
    fields:
      - { name: auditorium_id, type: string, source: input, description: "FK -> Auditorium.id" }
      - { name: alert_code, type: enum, source: input, description: "LAMP_DEGRADED | SOUND_DRIFT | PROJECTOR_TEMP | NETWORK_LOSS | CALIBRATION_OVERDUE" }
      - { name: severity, type: enum, source: input, description: "INFO | WARNING | CRITICAL" }
      - { name: raised_at, type: datetime, source: system, description: "Logical clock timestamp at alert creation" }
      - { name: notes, type: string, source: input, description: "Freeform notes", required: false }
      - { name: status, type: enum, source: system, description: "RAISED → ACKNOWLEDGED → DISPATCHED → RESOLVED | DEFERRED" }

  - name: TechDispatch
    parent: null
    common_fields: true
    fields:
      - { name: qa_alert_id, type: string, source: input, description: "FK -> QAAlert.id" }
      - { name: auditorium_id, type: string, source: input, description: "FK -> Auditorium.id (denormalized for routing; must equal QAAlert.auditorium_id)" }
      - { name: scheduled_visit_date, type: datetime, source: input, description: "Date the technician is scheduled to arrive" }
      - { name: tech_specialty, type: enum, source: input, description: "PROJECTION | SOUND | NETWORK | GENERAL" }
      - { name: resolution_notes, type: string, source: input, description: "Notes entered on completion", required: false }
      - { name: status, type: enum, source: system, description: "SCHEDULED → EN_ROUTE → ON_SITE → COMPLETE | ABORTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Market
    initial_state: PROSPECT
    terminal_states: [ABANDONED]
    transitions:
      - { from: PROSPECT, to: EVALUATING, trigger: "POST /v1/markets/{marketId}/begin-evaluation", actor: NetworkPlanner, preconditions: [], side_effects: [] }
      - { from: EVALUATING, to: APPROVED, trigger: "POST /v1/markets/{marketId}/approve", actor: NetworkPlanner, preconditions: ["screen_capacity_cap > 0"], side_effects: [] }
      - { from: EVALUATING, to: ABANDONED, trigger: "POST /v1/markets/{marketId}/abandon", actor: NetworkPlanner, preconditions: [], side_effects: [] }
      - { from: APPROVED, to: BUILDING, trigger: "POST /v1/markets/{marketId}/begin-build", actor: NetworkPlanner, preconditions: ["at least one ExhibitorAgreement with market_id == this.id and status == SIGNED exists (ERR_NO_SIGNED_AGREEMENT)"], side_effects: [] }
      - { from: BUILDING, to: LIVE, trigger: "POST /v1/markets/{marketId}/go-live", actor: NetworkPlanner, preconditions: ["opened_screen_count >= 1"], side_effects: [] }
      - { from: BUILDING, to: ABANDONED, trigger: "POST /v1/markets/{marketId}/abandon", actor: NetworkPlanner, preconditions: [], side_effects: ["All ExhibitorAgreements in this market in NEGOTIATING → TERMINATED"] }

  - entity: ExhibitorAgreement
    initial_state: NEGOTIATING
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - { from: NEGOTIATING, to: SIGNED, trigger: "POST /v1/agreements/{agreementId}/sign", actor: PlatformContractManager, preconditions: ["market_id references a Market in {APPROVED, BUILDING, LIVE} (ERR_MARKET_NOT_APPROVED)"], side_effects: [] }
      - { from: NEGOTIATING, to: TERMINATED, trigger: "POST /v1/agreements/{agreementId}/terminate", actor: PlatformContractManager, preconditions: [], side_effects: [] }
      - { from: SIGNED, to: ACTIVE, trigger: "POST /v1/agreements/{agreementId}/activate", actor: PlatformContractManager, preconditions: ["at least one Auditorium under this agreement in OPERATING state (ERR_NO_OPERATING_AUDITORIUM)"], side_effects: [] }
      - { from: SIGNED, to: TERMINATED, trigger: "POST /v1/agreements/{agreementId}/terminate", actor: PlatformContractManager, preconditions: [], side_effects: ["All Auditoriums under this agreement not already DECOMMISSIONED → DECOMMISSIONED"] }
      - { from: ACTIVE, to: EXPIRED, trigger: "system (logical clock reaches term_end_date)", actor: system, preconditions: [], side_effects: ["All ScreenSlots on this agreement's auditoriums in PROPOSED → REJECTED"] }
      - { from: ACTIVE, to: TERMINATED, trigger: "POST /v1/agreements/{agreementId}/terminate", actor: PlatformContractManager, preconditions: [], side_effects: ["All Auditoriums under this agreement not already DECOMMISSIONED → DECOMMISSIONED", "All ScreenSlots on this agreement's auditoriums in PROPOSED → REJECTED; in CONFIRMED → PULLED (which itself triggers capacity release cascade)"] }

  - entity: Auditorium
    initial_state: DESIGN
    terminal_states: [DECOMMISSIONED]
    transitions:
      - { from: DESIGN, to: CONSTRUCTION, trigger: "POST /v1/auditoriums/{auditoriumId}/begin-construction", actor: PlatformContractManager, preconditions: ["parent ExhibitorAgreement.status ∈ {SIGNED, ACTIVE}"], side_effects: [] }
      - { from: CONSTRUCTION, to: CALIBRATION, trigger: "POST /v1/auditoriums/{auditoriumId}/begin-calibration", actor: FieldEngineer, preconditions: [], side_effects: [] }
      - { from: CALIBRATION, to: CERTIFIED, trigger: "POST /v1/auditoriums/{auditoriumId}/certify", actor: FieldEngineer, preconditions: [], side_effects: ["last_calibration_at := logical_clock_now", "calibration_overdue := false"] }
      - { from: CERTIFIED, to: OPERATING, trigger: "POST /v1/auditoriums/{auditoriumId}/open", actor: PlatformContractManager, preconditions: ["parent Market.screen_capacity_cap > count of OPERATING auditoriums in this market (ERR_MARKET_CAPACITY_EXCEEDED)"], side_effects: ["Market.opened_screen_count += 1"] }
      - { from: OPERATING, to: DEGRADED, trigger: "system (auto on QAAlert severity=CRITICAL creation)", actor: system, preconditions: [], side_effects: ["Every ScreenSlot on this auditorium with status == CONFIRMED and slot_start_date ≤ logical_clock_now < slot_end_date → SUSPENDED", "For each SUSPENDED slot: parent ReleaseWindow.committed_premium_screen_seconds -= slot.committed_screen_seconds", "For each SUSPENDED slot: trigger recompute of RevenueShareStatement.statement_lines and provisional_total_cents / final_total_cents (cascade depth 3)"] }
      - { from: DEGRADED, to: OPERATING, trigger: "POST /v1/auditoriums/{auditoriumId}/return-to-service", actor: FieldEngineer, preconditions: ["all QAAlerts on this auditorium with severity == CRITICAL are in RESOLVED (ERR_UNRESOLVED_CRITICAL_ALERTS)"], side_effects: ["Every ScreenSlot on this auditorium with status == SUSPENDED → CONFIRMED", "For each restored slot: parent ReleaseWindow.committed_premium_screen_seconds += slot.committed_screen_seconds", "Recompute RevenueShareStatement lines"] }
      - { from: OPERATING, to: DECOMMISSIONED, trigger: "POST /v1/auditoriums/{auditoriumId}/decommission", actor: PlatformContractManager, preconditions: [], side_effects: ["Market.opened_screen_count -= 1", "All ScreenSlots on this auditorium in PROPOSED → REJECTED; in CONFIRMED → PULLED"] }
      - { from: DEGRADED, to: DECOMMISSIONED, trigger: "POST /v1/auditoriums/{auditoriumId}/decommission", actor: PlatformContractManager, preconditions: [], side_effects: ["All ScreenSlots on this auditorium in PROPOSED → REJECTED; in SUSPENDED → PULLED"] }

  - entity: Studio
    initial_state: ONBOARDING
    terminal_states: [TERMINATED]
    transitions:
      - { from: ONBOARDING, to: ACTIVE, trigger: "POST /v1/studios/{studioId}/activate", actor: StudioRelationshipManager, preconditions: [], side_effects: [] }
      - { from: ACTIVE, to: SUSPENDED, trigger: "POST /v1/studios/{studioId}/suspend", actor: StudioRelationshipManager, preconditions: [], side_effects: ["All ConversionOrders on films of this studio in SUBMITTED → CANCELLED"] }
      - { from: SUSPENDED, to: ACTIVE, trigger: "POST /v1/studios/{studioId}/activate", actor: StudioRelationshipManager, preconditions: [], side_effects: [] }
      - { from: ACTIVE, to: TERMINATED, trigger: "POST /v1/studios/{studioId}/terminate", actor: StudioRelationshipManager, preconditions: [], side_effects: ["All ConversionOrders on films of this studio in non-terminal state → CANCELLED"] }

  - entity: StudioFilm
    initial_state: ANNOUNCED
    terminal_states: [ARCHIVED]
    transitions:
      - { from: ANNOUNCED, to: IN_DISTRIBUTION, trigger: "system (logical clock reaches worldwide_release_date)", actor: system, preconditions: [], side_effects: [] }
      - { from: IN_DISTRIBUTION, to: OUT_OF_WINDOW, trigger: "system (logical clock reaches worldwide_release_date + 84 days)", actor: system, preconditions: [], side_effects: ["All ConversionOrders for this film in non-terminal state → CANCELLED"] }
      - { from: OUT_OF_WINDOW, to: ARCHIVED, trigger: "POST /v1/films/{filmId}/archive", actor: StudioRelationshipManager, preconditions: [], side_effects: [] }

  - entity: ConversionOrder
    initial_state: SUBMITTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - { from: SUBMITTED, to: IN_POST, trigger: "POST /v1/conversion-orders/{orderId}/begin-post", actor: PostProductionScheduler, preconditions: ["parent StudioFilm.status == ANNOUNCED (ERR_FILM_NOT_ANNOUNCED)", "no other ConversionOrder on a film of the same studio with status in {IN_POST, QC_REVIEW} whose [scheduled_post_start_date, scheduled_post_end_date] (closed-closed) lies within one day of this order's window — i.e. other's end + 1 day > this.start AND this.end + 1 day > other's start (ERR_POST_SCHEDULE_OVERLAP)"], side_effects: [] }
      - { from: SUBMITTED, to: CANCELLED, trigger: "POST /v1/conversion-orders/{orderId}/cancel", actor: StudioRelationshipManager, preconditions: [], side_effects: [] }
      - { from: IN_POST, to: QC_REVIEW, trigger: "POST /v1/conversion-orders/{orderId}/submit-for-qc", actor: PostProductionScheduler, preconditions: ["logical_clock_now >= scheduled_post_end_date (ERR_POST_NOT_ELAPSED)"], side_effects: [] }
      - { from: IN_POST, to: CANCELLED, trigger: "POST /v1/conversion-orders/{orderId}/cancel", actor: StudioRelationshipManager, preconditions: [], side_effects: [] }
      - { from: QC_REVIEW, to: APPROVED_FOR_RELEASE, trigger: "POST /v1/conversion-orders/{orderId}/approve-release", actor: QualityAssuranceReviewer, preconditions: ["if filmmaker_approval_required == true then filmmaker_signoff == true (ERR_FILMMAKER_SIGNOFF_MISSING)"], side_effects: [] }
      - { from: QC_REVIEW, to: REWORK_REQUESTED, trigger: "POST /v1/conversion-orders/{orderId}/request-rework", actor: QualityAssuranceReviewer, preconditions: [], side_effects: [] }
      - { from: QC_REVIEW, to: CANCELLED, trigger: "POST /v1/conversion-orders/{orderId}/cancel", actor: StudioRelationshipManager, preconditions: [], side_effects: [] }
      - { from: REWORK_REQUESTED, to: IN_POST, trigger: "POST /v1/conversion-orders/{orderId}/begin-post", actor: PostProductionScheduler, preconditions: [], side_effects: ["scheduled_post_end_date := logical_clock_now + 7 days (rework window)", "filmmaker_signoff := false"], note: "Cycle: QC_REVIEW → REWORK_REQUESTED → IN_POST; each rework resets the post window" }
      - { from: APPROVED_FOR_RELEASE, to: DELIVERED, trigger: "POST /v1/conversion-orders/{orderId}/deliver", actor: PostProductionScheduler, preconditions: ["delivered_master_url is non-empty (ERR_MASTER_URL_REQUIRED)"], side_effects: ["If any ScreenSlot references this conversion in PROPOSED, mark them eligible for CONFIRMED (next /v1/screen-slots/{id}/confirm call will succeed)"] }
      - { from: APPROVED_FOR_RELEASE, to: CANCELLED, trigger: "POST /v1/conversion-orders/{orderId}/cancel", actor: StudioRelationshipManager, preconditions: [], side_effects: ["All ScreenSlots referencing this conversion in PROPOSED → REJECTED"] }

  - entity: ReleaseWindow
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - { from: DRAFT, to: OPEN_FOR_BOOKING, trigger: "POST /v1/release-windows/{windowId}/open", actor: ReleaseScheduler, preconditions: ["window_start_date > logical_clock_now (ERR_WINDOW_IN_PAST)"], side_effects: [] }
      - { from: OPEN_FOR_BOOKING, to: LOCKED, trigger: "POST /v1/release-windows/{windowId}/lock", actor: ReleaseScheduler, preconditions: [], side_effects: ["All PROPOSED slots in this window that have not been CONFIRMED → REJECTED"] }
      - { from: LOCKED, to: REOPENED, trigger: "POST /v1/release-windows/{windowId}/reopen", actor: ReleaseScheduler, preconditions: [], side_effects: [], note: "Cycle: LOCKED → REOPENED → OPEN_FOR_BOOKING (for amendments)" }
      - { from: REOPENED, to: OPEN_FOR_BOOKING, trigger: "POST /v1/release-windows/{windowId}/resume-booking", actor: ReleaseScheduler, preconditions: [], side_effects: [] }
      - { from: LOCKED, to: CLOSED, trigger: "system (logical clock reaches window_end_date)", actor: system, preconditions: [], side_effects: ["All RevenueShareStatements for this window in DRAFT → ISSUED", "All ScreenSlots in this window in CONFIRMED → HELD_OVER if hold_over_eligible (per_screen_attendance_ratio ≥ HOLD_OVER_ADMISSION_THRESHOLD) else remain CONFIRMED until window close"] }

  - entity: ScreenSlot
    initial_state: PROPOSED
    terminal_states: [PULLED, REJECTED]
    transitions:
      - { from: PROPOSED, to: CONFIRMED, trigger: "POST /v1/screen-slots/{slotId}/confirm", actor: ReleaseScheduler, preconditions: ["parent ReleaseWindow.status == OPEN_FOR_BOOKING (ERR_WINDOW_NOT_OPEN)", "parent Auditorium.status ∈ {CERTIFIED, OPERATING} (ERR_AUDITORIUM_NOT_READY)", "parent ConversionOrder.status == APPROVED_FOR_RELEASE (ERR_CONVERSION_NOT_APPROVED)", "slot interval does not overlap another CONFIRMED/HELD_OVER slot on the same auditorium (ERR_SLOT_OVERLAP)", "ReleaseWindow.committed_premium_screen_seconds + slot.committed_screen_seconds ≤ total_premium_screen_seconds_pool (ERR_WINDOW_CAPACITY_EXCEEDED)"], side_effects: ["ReleaseWindow.committed_premium_screen_seconds += slot.committed_screen_seconds", "Recompute slot.per_screen_attendance_ratio (initial 0)"] }
      - { from: PROPOSED, to: REJECTED, trigger: "POST /v1/screen-slots/{slotId}/reject", actor: ReleaseScheduler, preconditions: [], side_effects: [] }
      - { from: CONFIRMED, to: HELD_OVER, trigger: "system (auto at window close, when per_screen_attendance_ratio >= HOLD_OVER_ADMISSION_THRESHOLD)", actor: system, preconditions: ["per_screen_attendance_ratio >= HOLD_OVER_ADMISSION_THRESHOLD"], side_effects: ["Auto-create a new ScreenSlot for the SAME auditorium and SAME film in the NEXT ReleaseWindow (chronologically, by window_start_date) with status PROPOSED, slot_start_date = next_window.window_start_date, slot_end_date = next_window.window_start_date + 7 days"], note: "Held-over slots cause auto-creation of a follow-on PROPOSED slot" }
      - { from: CONFIRMED, to: PULLED, trigger: "POST /v1/screen-slots/{slotId}/pull", actor: ReleaseScheduler, preconditions: ["logical_clock_now < slot_start_date (ERR_SLOT_ALREADY_STARTED)"], side_effects: ["ReleaseWindow.committed_premium_screen_seconds -= slot.committed_screen_seconds", "If a PROPOSED slot in the same window previously failed with ERR_WINDOW_CAPACITY_EXCEEDED and now fits, auto-confirm the highest-priority (BLOCKBUSTER > STANDARD > FILLER; tie-break by created_at ASC) eligible PROPOSED slot", "If that auto-confirmed slot's ConversionOrder is APPROVED_FOR_RELEASE and delivered_master_url is non-empty, transition that ConversionOrder → DELIVERED (depth 3 cascade)"] }
      - { from: CONFIRMED, to: SUSPENDED, trigger: "system (cascade from Auditorium OPERATING → DEGRADED)", actor: system, preconditions: [], side_effects: ["See Auditorium OPERATING → DEGRADED cascade"] }
      - { from: SUSPENDED, to: CONFIRMED, trigger: "system (cascade from Auditorium DEGRADED → OPERATING)", actor: system, preconditions: [], side_effects: ["ReleaseWindow.committed_premium_screen_seconds += slot.committed_screen_seconds"] }
      - { from: SUSPENDED, to: PULLED, trigger: "POST /v1/screen-slots/{slotId}/pull", actor: ReleaseScheduler, preconditions: [], side_effects: [] }
      - { from: HELD_OVER, to: CONFIRMED, trigger: "POST /v1/screen-slots/{slotId}/confirm", actor: ReleaseScheduler, preconditions: ["same preconditions as PROPOSED → CONFIRMED"], side_effects: ["same side_effects as PROPOSED → CONFIRMED"], note: "Cyclic: HELD_OVER → CONFIRMED for the next window extension" }
      - { from: HELD_OVER, to: PULLED, trigger: "POST /v1/screen-slots/{slotId}/pull", actor: ReleaseScheduler, preconditions: [], side_effects: ["ReleaseWindow.committed_premium_screen_seconds -= slot.committed_screen_seconds"] }

  - entity: BoxOfficeReport
    initial_state: RECEIVED
    terminal_states: [VALIDATED, FLAGGED_DISCREPANCY]
    transitions:
      - { from: RECEIVED, to: VALIDATED, trigger: "POST /v1/box-office-reports/{reportId}/validate", actor: BoxOfficeAnalyst, preconditions: ["parent ScreenSlot.status ∈ {CONFIRMED, HELD_OVER, PULLED, SUSPENDED}"], side_effects: ["parent ScreenSlot.weekly_gross_cents += gross_receipts_cents", "parent ScreenSlot.weekly_admissions += admissions", "parent ScreenSlot.per_screen_attendance_ratio recomputed", "Any RevenueShareStatement covering this slot and window recomputes statement_lines, provisional_total_cents, final_total_cents"] }
      - { from: RECEIVED, to: FLAGGED_DISCREPANCY, trigger: "POST /v1/box-office-reports/{reportId}/flag-discrepancy", actor: BoxOfficeAnalyst, preconditions: [], side_effects: [] }

  - entity: RevenueShareStatement
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - { from: DRAFT, to: ISSUED, trigger: "POST /v1/revenue-share-statements/{statementId}/issue", actor: BoxOfficeAnalyst, preconditions: ["for every ScreenSlot in this statement's window with status ∈ {CONFIRMED, HELD_OVER, PULLED}, every BoxOfficeReport on that slot is in {VALIDATED, FLAGGED_DISCREPANCY} — no report still in RECEIVED (ERR_UNRESOLVED_REPORTS)"], side_effects: ["final_total_cents := sum of statement_lines.agreed_share_cents", "provisional_total_cents recomputed (now equals final_total_cents since no unreported days remain)"] }
      - { from: ISSUED, to: RECONCILED, trigger: "POST /v1/revenue-share-statements/{statementId}/reconcile", actor: PlatformContractManager, preconditions: [], side_effects: [] }
      - { from: ISSUED, to: DISPUTED, trigger: "POST /v1/revenue-share-statements/{statementId}/dispute", actor: ExhibitorFinanceUser, preconditions: [], side_effects: [] }
      - { from: DISPUTED, to: ADJUSTED, trigger: "POST /v1/revenue-share-statements/{statementId}/apply-adjustment", actor: BoxOfficeAnalyst, preconditions: [], side_effects: ["A new adjustment entry appended to one statement_line's adjustments[] such that sum(line.agreed_share_cents) + sum(all adjustments) == recomputed_total (compensating invariant: exhibitor_retained + agreed_share always == gross_reported)", "Recompute final_total_cents"] }
      - { from: ADJUSTED, to: ISSUED, trigger: "POST /v1/revenue-share-statements/{statementId}/reissue", actor: BoxOfficeAnalyst, preconditions: [], side_effects: [], note: "Cycle: ISSUED → DISPUTED → ADJUSTED → ISSUED" }

  - entity: QAAlert
    initial_state: RAISED
    terminal_states: [RESOLVED, DEFERRED]
    transitions:
      - { from: RAISED, to: ACKNOWLEDGED, trigger: "POST /v1/qa-alerts/{alertId}/acknowledge", actor: FieldEngineer, preconditions: [], side_effects: [] }
      - { from: RAISED, to: DEFERRED, trigger: "POST /v1/qa-alerts/{alertId}/defer", actor: FieldEngineer, preconditions: ["severity != CRITICAL (ERR_CANNOT_DEFER_CRITICAL)"], side_effects: [] }
      - { from: ACKNOWLEDGED, to: DISPATCHED, trigger: "system (auto when a TechDispatch is created against this alert)", actor: system, preconditions: [], side_effects: [] }
      - { from: DISPATCHED, to: RESOLVED, trigger: "system (auto when all TechDispatches for this alert are in COMPLETE)", actor: system, preconditions: [], side_effects: [] }
      - { from: ACKNOWLEDGED, to: DEFERRED, trigger: "POST /v1/qa-alerts/{alertId}/defer", actor: FieldEngineer, preconditions: ["severity != CRITICAL"], side_effects: [] }

  - entity: TechDispatch
    initial_state: SCHEDULED
    terminal_states: [COMPLETE, ABORTED]
    transitions:
      - { from: SCHEDULED, to: EN_ROUTE, trigger: "POST /v1/tech-dispatches/{dispatchId}/mark-en-route", actor: FieldEngineer, preconditions: [], side_effects: [] }
      - { from: SCHEDULED, to: ABORTED, trigger: "POST /v1/tech-dispatches/{dispatchId}/abort", actor: FieldEngineer, preconditions: [], side_effects: [] }
      - { from: EN_ROUTE, to: ON_SITE, trigger: "POST /v1/tech-dispatches/{dispatchId}/mark-on-site", actor: FieldEngineer, preconditions: [], side_effects: [] }
      - { from: EN_ROUTE, to: ABORTED, trigger: "POST /v1/tech-dispatches/{dispatchId}/abort", actor: FieldEngineer, preconditions: [], side_effects: [] }
      - { from: ON_SITE, to: COMPLETE, trigger: "POST /v1/tech-dispatches/{dispatchId}/complete", actor: FieldEngineer, preconditions: ["resolution_notes is non-empty (ERR_RESOLUTION_NOTES_REQUIRED)"], side_effects: ["parent QAAlert → RESOLVED if no other non-terminal dispatches", "If alert_code == CALIBRATION_OVERDUE: parent Auditorium.last_calibration_at := logical_clock_now and calibration_overdue := false"] }
      - { from: ON_SITE, to: ABORTED, trigger: "POST /v1/tech-dispatches/{dispatchId}/abort", actor: FieldEngineer, preconditions: [], side_effects: [] }

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: screen-slot-create-stale-window
    parent_entity: ReleaseWindow
    write_endpoint: "POST /v1/screen-slots"
    occ_field: expected_window_version
    description: |
      Creating a ScreenSlot against a ReleaseWindow whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just confirmed a slot against the same window
      (legitimately consuming part of the capacity pool under §3.x) and the
      current writer's view of committed_premium_screen_seconds is therefore
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: conversion_post_cost_estimate
    trigger: "ConversionOrder creation (status SUBMITTED)"
    algorithm: tiered_pricing
    formula: |
      Inputs: target_format, runtime_minutes.
      Constants per format:
        PREMIUM_2D:   base = 2_000_000_00 cents, per_minute = 12_000_00 cents/min
        PREMIUM_3D:   base = 3_500_000_00 cents, per_minute = 18_000_00 cents/min
        PREMIUM_70MM: base = 5_000_000_00 cents, per_minute = 25_000_00 cents/min
      post_cost_estimate_cents = base_rate_cents[target_format] + runtime_minutes × per_minute_rate_cents[target_format]
    input_set: "ConversionOrder at creation; uses StudioFilm.runtime_minutes of parent film"
    constants:
      BASE_PREMIUM_2D_CENTS: 200000000
      PER_MIN_PREMIUM_2D_CENTS: 1200000
      BASE_PREMIUM_3D_CENTS: 350000000
      PER_MIN_PREMIUM_3D_CENTS: 1800000
      BASE_PREMIUM_70MM_CENTS: 500000000
      PER_MIN_PREMIUM_70MM_CENTS: 2500000
    precision: "integer cents, no rounding needed"

  - name: committed_screen_seconds
    trigger: "ScreenSlot creation and any update to slot_start_date / slot_end_date / showings_per_day"
    algorithm: aggregation
    formula: |
      days = (slot_end_date - slot_start_date) in whole days (must be ≥ 1)
      committed_screen_seconds = days × showings_per_day × parent_film.runtime_minutes × 60
    input_set: "the ScreenSlot and its parent StudioFilm"
    precision: "integer seconds"

  - name: provisional_revenue_share
    trigger: "recompute whenever a BoxOfficeReport transitions to VALIDATED, whenever a slot is confirmed/pulled/suspended/restored, or on RevenueShareStatement read"
    algorithm: forward_looking
    formula: |
      For each ScreenSlot in the window with status ∈ {CONFIRMED, HELD_OVER, PULLED, SUSPENDED}:
        reported_days = count of VALIDATED BoxOfficeReports on this slot
        total_slot_days = (slot_end_date - slot_start_date) days
        unreported_days = total_slot_days - reported_days
        if reported_days > 0:
          mean_reported = sum(gross_receipts_cents of VALIDATED reports) / reported_days
          forecast_unreported = unreported_days × mean_reported × FORECAST_DAILY_FRACTION
        else:
          forecast_unreported = 0
        line_provisional_gross = sum(VALIDATED gross) + forecast_unreported
        line_provisional_share = apply_tiered_marginal_share(line_provisional_gross, agreement's tier rates)
      provisional_total_cents = sum of line_provisional_share over all lines
    input_set: "All ScreenSlots in window with status ∈ {CONFIRMED, HELD_OVER, PULLED, SUSPENDED}; only VALIDATED BoxOfficeReports included"
    constants:
      FORECAST_DAILY_FRACTION: 0.5
    precision: "2 decimal places per line, round_half_up, THEN sum the rounded lines (rounding order is per-line, not post-sum)"
    variants:
      - name: forecast
        when: "default — used while window still has unreported days"
        difference: "adds forecast_unreported term"
      - name: zero_forecast_when_fully_reported
        when: "when reported_days == total_slot_days for all slots"
        difference: "forecast_unreported = 0; provisional_total_cents == final_total_cents"

  - name: final_revenue_share
    trigger: "RevenueShareStatement transition DRAFT → ISSUED, and on DISPUTED → ADJUSTED"
    algorithm: chronological
    formula: |
      For each ScreenSlot in the window with status ∈ {CONFIRMED, HELD_OVER, PULLED}:
        Collect all VALIDATED BoxOfficeReports on this slot.
        Sort by reported_date ASC; tie-break by created_at ASC.
        running_slot_gross = 0
        line_share = 0
        for each report in sorted order:
          running_slot_gross += report.gross_receipts_cents
          day_share = apply_tiered_marginal_share_per_day(running_slot_gross_before, report.gross_receipts_cents, agreement's tier rates)
          # tier boundary crossed within a day: split the day's receipts into
          # tier-1 portion, tier-2 portion, tier-3 portion and apply each rate
          # to its portion.
          line_share += round_half_up(day_share, 2)
        line.agreed_share_cents = line_share   # sum of per-day rounded shares
        line.gross_reported_cents = running_slot_gross
        line.exhibitor_retained_cents = line.gross_reported_cents - line.agreed_share_cents
      final_total_cents = sum of line.agreed_share_cents
    input_set: "Only VALIDATED BoxOfficeReports; only slots in {CONFIRMED, HELD_OVER, PULLED}"
    constants:
      TIER1_CAP_CENTS: 10000000   # $100k weekly gross per slot
      TIER2_CAP_CENTS: 25000000   # $250k weekly gross per slot
    precision: "round each per-day share to 2 decimals (round_half_up), then sum the rounded per-day shares; do NOT round again at line level"
    key_insight: |
      provisional_revenue_share uses forward-looking forecast including
      unreported days; final_revenue_share is chronological over validated
      reports only. For identical underlying reports, provisional > final while
      unreported days remain. Tiered marginal application across cumulative
      weekly gross per slot is the other key difficulty — boundaries split a
      day's receipts.

  - name: apply_tiered_marginal_share
    trigger: "subroutine of provisional_revenue_share and final_revenue_share"
    algorithm: tiered_pricing
    formula: |
      Inputs: gross_cents, tier1_pct, tier2_pct, tier3_pct
      if gross_cents ≤ TIER1_CAP_CENTS:
        share = gross_cents × tier1_pct
      elif gross_cents ≤ TIER2_CAP_CENTS:
        share = TIER1_CAP_CENTS × tier1_pct + (gross_cents − TIER1_CAP_CENTS) × tier2_pct
      else:
        share = TIER1_CAP_CENTS × tier1_pct + (TIER2_CAP_CENTS − TIER1_CAP_CENTS) × tier2_pct + (gross_cents − TIER2_CAP_CENTS) × tier3_pct
      # Boundary precision: AT exactly TIER1_CAP_CENTS, tier 1 still applies
      # (≤, not <); at TIER1_CAP_CENTS + 1 cent, the cent spills into marginal
      # tier-2 territory.
    constants:
      TIER1_CAP_CENTS: 10000000
      TIER2_CAP_CENTS: 25000000

  - name: per_screen_attendance_ratio
    trigger: "recompute on every BoxOfficeReport VALIDATED and on slot confirmation"
    algorithm: aggregation
    formula: |
      days_elapsed_in_slot = min(logical_clock_today, slot_end_date) − slot_start_date, in whole days, clamped to ≥ 0
      denominator = seating_capacity × showings_per_day × days_elapsed_in_slot
      if denominator == 0:
        per_screen_attendance_ratio = 0
      else:
        per_screen_attendance_ratio = weekly_admissions / denominator
      # Hold-over eligibility fires when ratio >= HOLD_OVER_ADMISSION_THRESHOLD
      # (>=, not >). At exactly the threshold, hold-over triggers.
    constants:
      HOLD_OVER_ADMISSION_THRESHOLD: 0.65
    precision: "4 decimal places, round_half_up"

  - name: auditorium_quality_score
    trigger: "recomputed on QAAlert creation/resolution and surfaced on Auditorium.quality_score_arithmetic / quality_score_recency"
    algorithm: weighted_scoring
    formula: |
      Consider all QAAlerts on this auditorium with raised_at within the last 30 days of the logical clock.
      severity_weight: INFO=1, WARNING=3, CRITICAL=10
      Variant A (arithmetic_mean):
        score_A = sum(severity_weight) / max(1, count)
      Variant B (recency_weighted):
        For each QAAlert: age_days = floor((logical_clock_now - raised_at) / 86400), clamped to [0, 29]
        recency_weight = 1 - age_days / 30     # linear decay; 1.0 today, ~0.033 at age 29
        score_B = sum(severity_weight × recency_weight) / max(1, count)
      score_A and score_B differ for identical input sets — the dual-variant
      surface on the Auditorium domain (cf. the provisional-vs-final dichotomy
      on the RevenueShareStatement domain).
    variants:
      - name: arithmetic_mean
        when: "surfaced as Auditorium.quality_score_arithmetic"
        difference: "flat severity weighting"
      - name: recency_weighted
        when: "surfaced as Auditorium.quality_score_recency"
        difference: "linear recency decay; recent alerts weigh more"
    precision: "4 decimal places, round_half_up"

  - name: screen_slot_score_for_holdover
    trigger: "evaluated at ReleaseWindow LOCKED → CLOSED auto-transition, per CONFIRMED slot"
    algorithm: weighted_scoring
    formula: |
      Inputs: per_screen_attendance_ratio, format_premium_uplift, week_over_week_growth
      format_premium_uplift = 0.10 if slot is the only slot for that film in the window
                              0.05 if exactly one other slot for that film exists in the window
                              0.00 otherwise
      week_over_week_growth = (this_week_gross - prev_week_gross_same_film) / max(prev_week_gross_same_film, 1)
      Evaluation order (pinned to avoid circular dependency):
        1. Compute format_premium_uplift using only slots already CONFIRMED at the start of this evaluation
           (do NOT count the candidate slot's own hypothetical HELD_OVER state).
        2. Compute week_over_week_growth using only VALIDATED reports from prior windows.
        3. score = 0.5 × per_screen_attendance_ratio + 0.3 × format_premium_uplift + 0.2 × min(week_over_week_growth, 1.0)
      hold_over fires iff score >= HOLD_OVER_ADMISSION_THRESHOLD.
    input_set: "CONFIRMED ScreenSlots in the window being closed"
    constants:
      HOLD_OVER_ADMISSION_THRESHOLD: 0.65
    precision: "4 decimal places"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and valid", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this operation", error_id: ERR_INSUFFICIENT_PERMISSIONS, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Resource IDs in path exist (left-to-right)", error_id: "ERR_{RESOURCE}_NOT_FOUND", http_status: 404, applies_to: "all nested endpoints" }
  - { priority: 4, category: existence, check: "Body foreign keys exist (in declared input order)", error_id: "ERR_{RESOURCE}_NOT_FOUND", http_status: 404, applies_to: "creation endpoints with body FKs" }
  - { priority: 5, category: state, check: "Target resource state permits the requested operation", error_id: "ERR_INVALID_STATE or domain-specific", http_status: 409, applies_to: "state transition endpoints" }
  - { priority: 6, category: business_referential, check: "Cross-entity state references hold (e.g. ConversionOrder APPROVED_FOR_RELEASE, Auditorium CERTIFIED/OPERATING)", error_id: "ERR_CONVERSION_NOT_APPROVED | ERR_AUDITORIUM_NOT_READY | ERR_MARKET_NOT_APPROVED | ERR_NO_SIGNED_AGREEMENT", http_status: 409, applies_to: "slot confirm, market build, agreement sign" }
  - { priority: 7, category: business_temporal, check: "Temporal validity: slot interval within window bounds, conversion post window not overlapping another conversion on same studio's film, calibration not overdue for certification", error_id: "ERR_SLOT_OVERLAP | ERR_POST_SCHEDULE_OVERLAP | ERR_SLOT_OUTSIDE_WINDOW | ERR_WINDOW_IN_PAST", http_status: 409, applies_to: "slot create/confirm, conversion submit" }
  - { priority: 8, category: business_safety, check: "Safety / quality gates: unresolved CRITICAL alerts block return-to-service, filmmaker signoff required for release", error_id: "ERR_UNRESOLVED_CRITICAL_ALERTS | ERR_FILMMAKER_SIGNOFF_MISSING | ERR_CANNOT_DEFER_CRITICAL", http_status: 409, applies_to: "return-to-service, approve-release, defer" }
  - { priority: 9, category: business_fiscal, check: "Capacity / fiscal: window capacity not exceeded, market capacity not exceeded, report counts consistent", error_id: "ERR_WINDOW_CAPACITY_EXCEEDED | ERR_MARKET_CAPACITY_EXCEEDED", http_status: 409, applies_to: "slot confirm, auditorium open" }
  - { priority: 10, category: business_constraint, check: "Aggregate invariants: every BoxOfficeReport must be validated before statement issuance, screen capacity", error_id: "ERR_UNRESOLVED_REPORTS | ERR_NO_OPERATING_AUDITORIUM", http_status: 409, applies_to: "statement issue, agreement activate" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Market ---
  - { method: POST, path: "/v1/markets", description: "Create a market", roles: [NetworkPlanner], code: 201, input: [market_name, country_code, screen_capacity_cap, target_format_mix], output: Market, side_effects: ["status := PROSPECT"] }
  - { method: GET, path: "/v1/markets", description: "List markets", roles: [NetworkPlanner, PlatformContractManager, ReleaseScheduler, BoxOfficeAnalyst], code: 200, input: ["limit?", "offset?", "status?"], output: "Market[]", side_effects: [] }
  - { method: GET, path: "/v1/markets/{marketId}", description: "Get a market", roles: [NetworkPlanner, PlatformContractManager, ReleaseScheduler, BoxOfficeAnalyst], code: 200, input: [], output: Market, side_effects: [] }
  - { method: GET, path: "/v1/markets/{marketId}/agreements", description: "List agreements in a market (FK reverse-reachability for ExhibitorAgreement.market_id)", roles: [NetworkPlanner, PlatformContractManager], code: 200, input: ["limit?", "offset?"], output: "ExhibitorAgreement[]", side_effects: [] }
  - { method: POST, path: "/v1/markets/{marketId}/begin-evaluation", description: "PROSPECT → EVALUATING", roles: [NetworkPlanner], code: 200, input: [], output: Market, side_effects: [] }
  - { method: POST, path: "/v1/markets/{marketId}/approve", description: "EVALUATING → APPROVED", roles: [NetworkPlanner], code: 200, input: [], output: Market, side_effects: [] }
  - { method: POST, path: "/v1/markets/{marketId}/begin-build", description: "APPROVED → BUILDING", roles: [NetworkPlanner], code: 200, input: [], output: Market, side_effects: [] }
  - { method: POST, path: "/v1/markets/{marketId}/go-live", description: "BUILDING → LIVE", roles: [NetworkPlanner], code: 200, input: [], output: Market, side_effects: [] }
  - { method: POST, path: "/v1/markets/{marketId}/abandon", description: "EVALUATING|BUILDING → ABANDONED", roles: [NetworkPlanner], code: 200, input: [], output: Market, side_effects: ["cascade agreements in NEGOTIATING → TERMINATED"] }

  # --- ExhibitorAgreement ---
  - { method: POST, path: "/v1/agreements", description: "Create an exhibitor agreement", roles: [PlatformContractManager], code: 201, input: [exhibitor_legal_name, market_id, agreement_type, committed_screen_count, "revenue_share_tier1_pct?", "revenue_share_tier2_pct?", "revenue_share_tier3_pct?", "annual_lease_fee_cents?", term_start_date, term_end_date], output: ExhibitorAgreement, side_effects: ["status := NEGOTIATING", "total_slots_committed_count := 0"] }
  - { method: GET, path: "/v1/agreements", description: "List agreements", roles: [NetworkPlanner, PlatformContractManager, BoxOfficeAnalyst, ExhibitorFinanceUser], code: 200, input: ["limit?", "offset?", "market_id?", "status?"], output: "ExhibitorAgreement[]", side_effects: [] }
  - { method: GET, path: "/v1/agreements/{agreementId}", description: "Get an agreement", roles: [NetworkPlanner, PlatformContractManager, BoxOfficeAnalyst, ExhibitorFinanceUser], code: 200, input: [], output: ExhibitorAgreement, side_effects: [] }
  - { method: POST, path: "/v1/agreements/{agreementId}/sign", description: "NEGOTIATING → SIGNED", roles: [PlatformContractManager], code: 200, input: [], output: ExhibitorAgreement, side_effects: [] }
  - { method: POST, path: "/v1/agreements/{agreementId}/activate", description: "SIGNED → ACTIVE", roles: [PlatformContractManager], code: 200, input: [], output: ExhibitorAgreement, side_effects: [] }
  - { method: POST, path: "/v1/agreements/{agreementId}/terminate", description: "any → TERMINATED", roles: [PlatformContractManager], code: 200, input: [], output: ExhibitorAgreement, side_effects: ["cascade auditoriums to DECOMMISSIONED", "cascade PROPOSED slots to REJECTED; CONFIRMED slots to PULLED"] }
  - { method: GET, path: "/v1/agreements/{agreementId}/auditoriums", description: "List auditoriums for an agreement (FK reverse for Auditorium.agreement_id)", roles: [NetworkPlanner, PlatformContractManager, FieldEngineer, ReleaseScheduler], code: 200, input: ["limit?", "offset?"], output: "Auditorium[]", side_effects: [] }
  - { method: GET, path: "/v1/agreements/{agreementId}/revenue-share-statements", description: "List statements for an agreement (FK reverse for RevenueShareStatement.agreement_id)", roles: [PlatformContractManager, BoxOfficeAnalyst, ExhibitorFinanceUser], code: 200, input: ["limit?", "offset?"], output: "RevenueShareStatement[]", side_effects: [] }

  # --- Auditorium ---
  - { method: POST, path: "/v1/auditoriums", description: "Create an auditorium", roles: [PlatformContractManager], code: 201, input: [agreement_id, auditorium_label, screen_geometry, seating_capacity, supported_formats, sound_calibration_profile], output: Auditorium, side_effects: ["status := DESIGN"] }
  - { method: GET, path: "/v1/auditoriums", description: "List auditoriums", roles: [NetworkPlanner, PlatformContractManager, FieldEngineer, ReleaseScheduler], code: 200, input: ["limit?", "offset?", "agreement_id?", "status?"], output: "Auditorium[]", side_effects: [] }
  - { method: GET, path: "/v1/auditoriums/{auditoriumId}", description: "Get an auditorium", roles: [NetworkPlanner, PlatformContractManager, FieldEngineer, ReleaseScheduler], code: 200, input: [], output: Auditorium, side_effects: ["calibration_overdue recomputed on read"] }
  - { method: POST, path: "/v1/auditoriums/{auditoriumId}/begin-construction", description: "DESIGN → CONSTRUCTION", roles: [PlatformContractManager], code: 200, input: [], output: Auditorium, side_effects: [] }
  - { method: POST, path: "/v1/auditoriums/{auditoriumId}/begin-calibration", description: "CONSTRUCTION → CALIBRATION", roles: [FieldEngineer], code: 200, input: [], output: Auditorium, side_effects: [] }
  - { method: POST, path: "/v1/auditoriums/{auditoriumId}/certify", description: "CALIBRATION → CERTIFIED", roles: [FieldEngineer], code: 200, input: [], output: Auditorium, side_effects: ["last_calibration_at := clock", "calibration_overdue := false"] }
  - { method: POST, path: "/v1/auditoriums/{auditoriumId}/open", description: "CERTIFIED → OPERATING", roles: [PlatformContractManager], code: 200, input: [], output: Auditorium, side_effects: ["Market.opened_screen_count += 1"] }
  - { method: POST, path: "/v1/auditoriums/{auditoriumId}/return-to-service", description: "DEGRADED → OPERATING", roles: [FieldEngineer], code: 200, input: [], output: Auditorium, side_effects: ["SUSPENDED slots → CONFIRMED; window capacity restored"] }
  - { method: POST, path: "/v1/auditoriums/{auditoriumId}/decommission", description: "OPERATING|DEGRADED → DECOMMISSIONED", roles: [PlatformContractManager], code: 200, input: [], output: Auditorium, side_effects: ["Market.opened_screen_count -= 1; cascade slots"] }
  - { method: GET, path: "/v1/auditoriums/{auditoriumId}/qa-alerts", description: "List QA alerts on an auditorium (FK reverse for QAAlert.auditorium_id)", roles: [FieldEngineer, NetworkPlanner, PlatformContractManager], code: 200, input: ["limit?", "offset?", "status?"], output: "QAAlert[]", side_effects: [] }
  - { method: GET, path: "/v1/auditoriums/{auditoriumId}/screen-slots", description: "List screen slots on an auditorium (FK reverse for ScreenSlot.auditorium_id)", roles: [ReleaseScheduler, BoxOfficeAnalyst, PlatformContractManager], code: 200, input: ["limit?", "offset?"], output: "ScreenSlot[]", side_effects: [] }

  # --- Studio ---
  - { method: POST, path: "/v1/studios", description: "Register a studio", roles: [StudioRelationshipManager], code: 201, input: [studio_legal_name, contact_email], output: Studio, side_effects: ["status := ONBOARDING"] }
  - { method: GET, path: "/v1/studios", description: "List studios", roles: [StudioRelationshipManager, PostProductionScheduler, ReleaseScheduler], code: 200, input: ["limit?", "offset?", "status?"], output: "Studio[]", side_effects: [] }
  - { method: GET, path: "/v1/studios/{studioId}", description: "Get a studio", roles: [StudioRelationshipManager, PostProductionScheduler, ReleaseScheduler], code: 200, input: [], output: Studio, side_effects: [] }
  - { method: POST, path: "/v1/studios/{studioId}/activate", description: "ONBOARDING|SUSPENDED → ACTIVE", roles: [StudioRelationshipManager], code: 200, input: [], output: Studio, side_effects: [] }
  - { method: POST, path: "/v1/studios/{studioId}/suspend", description: "ACTIVE → SUSPENDED", roles: [StudioRelationshipManager], code: 200, input: [], output: Studio, side_effects: ["cascade SUBMITTED conversion orders → CANCELLED"] }
  - { method: POST, path: "/v1/studios/{studioId}/terminate", description: "ACTIVE → TERMINATED", roles: [StudioRelationshipManager], code: 200, input: [], output: Studio, side_effects: ["cascade all non-terminal conversion orders → CANCELLED"] }
  - { method: GET, path: "/v1/studios/{studioId}/films", description: "List films for a studio (FK reverse for StudioFilm.studio_id)", roles: [StudioRelationshipManager, PostProductionScheduler, ReleaseScheduler], code: 200, input: ["limit?", "offset?"], output: "StudioFilm[]", side_effects: [] }

  # --- StudioFilm ---
  - { method: POST, path: "/v1/films", description: "Register a film", roles: [StudioRelationshipManager], code: 201, input: [studio_id, title, runtime_minutes, worldwide_release_date, format_targets], output: StudioFilm, side_effects: ["status := ANNOUNCED"] }
  - { method: GET, path: "/v1/films", description: "List films", roles: [StudioRelationshipManager, PostProductionScheduler, ReleaseScheduler, BoxOfficeAnalyst], code: 200, input: ["limit?", "offset?", "studio_id?", "status?"], output: "StudioFilm[]", side_effects: [] }
  - { method: GET, path: "/v1/films/{filmId}", description: "Get a film", roles: [StudioRelationshipManager, PostProductionScheduler, ReleaseScheduler, BoxOfficeAnalyst], code: 200, input: [], output: StudioFilm, side_effects: [] }
  - { method: POST, path: "/v1/films/{filmId}/archive", description: "OUT_OF_WINDOW → ARCHIVED", roles: [StudioRelationshipManager], code: 200, input: [], output: StudioFilm, side_effects: [] }
  - { method: GET, path: "/v1/films/{filmId}/conversion-orders", description: "List conversion orders for a film (FK reverse for ConversionOrder.studio_film_id)", roles: [StudioRelationshipManager, PostProductionScheduler, QualityAssuranceReviewer, ReleaseScheduler], code: 200, input: ["limit?", "offset?"], output: "ConversionOrder[]", side_effects: [] }
  - { method: GET, path: "/v1/films/{filmId}/screen-slots", description: "List screen slots for a film (FK reverse for ScreenSlot.studio_film_id)", roles: [ReleaseScheduler, BoxOfficeAnalyst, StudioRelationshipManager], code: 200, input: ["limit?", "offset?"], output: "ScreenSlot[]", side_effects: [] }

  # --- ConversionOrder ---
  - { method: POST, path: "/v1/conversion-orders", description: "Submit a conversion order", roles: [StudioRelationshipManager], code: 201, input: [studio_film_id, target_format, scheduled_post_start_date, scheduled_post_end_date, "filmmaker_approval_required?"], output: ConversionOrder, side_effects: ["status := SUBMITTED", "post_cost_estimate_cents computed", "filmmaker_signoff := false"] }
  - { method: GET, path: "/v1/conversion-orders", description: "List conversion orders", roles: [StudioRelationshipManager, PostProductionScheduler, QualityAssuranceReviewer], code: 200, input: ["limit?", "offset?", "studio_film_id?", "status?"], output: "ConversionOrder[]", side_effects: [] }
  - { method: GET, path: "/v1/conversion-orders/{orderId}", description: "Get a conversion order", roles: [StudioRelationshipManager, PostProductionScheduler, QualityAssuranceReviewer, ReleaseScheduler], code: 200, input: [], output: ConversionOrder, side_effects: [] }
  - { method: POST, path: "/v1/conversion-orders/{orderId}/begin-post", description: "SUBMITTED|REWORK_REQUESTED → IN_POST", roles: [PostProductionScheduler], code: 200, input: [], output: ConversionOrder, side_effects: ["on REWORK_REQUESTED → IN_POST: scheduled_post_end_date := clock + 7 days; filmmaker_signoff := false"] }
  - { method: POST, path: "/v1/conversion-orders/{orderId}/submit-for-qc", description: "IN_POST → QC_REVIEW", roles: [PostProductionScheduler], code: 200, input: [], output: ConversionOrder, side_effects: [] }
  - { method: POST, path: "/v1/conversion-orders/{orderId}/approve-release", description: "QC_REVIEW → APPROVED_FOR_RELEASE", roles: [QualityAssuranceReviewer], code: 200, input: ["filmmaker_signoff?"], output: ConversionOrder, side_effects: ["if filmmaker_approval_required and !filmmaker_signoff → ERR_FILMMAKER_SIGNOFF_MISSING"] }
  - { method: POST, path: "/v1/conversion-orders/{orderId}/request-rework", description: "QC_REVIEW → REWORK_REQUESTED", roles: [QualityAssuranceReviewer], code: 200, input: [], output: ConversionOrder, side_effects: [] }
  - { method: POST, path: "/v1/conversion-orders/{orderId}/deliver", description: "APPROVED_FOR_RELEASE → DELIVERED", roles: [PostProductionScheduler], code: 200, input: [delivered_master_url], output: ConversionOrder, side_effects: [] }
  - { method: POST, path: "/v1/conversion-orders/{orderId}/cancel", description: "any non-terminal → CANCELLED", roles: [StudioRelationshipManager], code: 200, input: [], output: ConversionOrder, side_effects: ["cascade PROPOSED slots referencing → REJECTED"] }

  # --- ReleaseWindow ---
  - { method: POST, path: "/v1/release-windows", description: "Create a release window", roles: [ReleaseScheduler], code: 201, input: [window_label, window_start_date, window_end_date, total_premium_screen_seconds_pool], output: ReleaseWindow, side_effects: ["status := DRAFT", "committed_premium_screen_seconds := 0"] }
  - { method: GET, path: "/v1/release-windows", description: "List release windows", roles: [ReleaseScheduler, BoxOfficeAnalyst, PlatformContractManager, NetworkPlanner], code: 200, input: ["limit?", "offset?", "status?"], output: "ReleaseWindow[]", side_effects: [] }
  - { method: GET, path: "/v1/release-windows/{windowId}", description: "Get a release window", roles: [ReleaseScheduler, BoxOfficeAnalyst, PlatformContractManager, NetworkPlanner], code: 200, input: [], output: ReleaseWindow, side_effects: [] }
  - { method: POST, path: "/v1/release-windows/{windowId}/open", description: "DRAFT → OPEN_FOR_BOOKING", roles: [ReleaseScheduler], code: 200, input: [], output: ReleaseWindow, side_effects: [] }
  - { method: POST, path: "/v1/release-windows/{windowId}/lock", description: "OPEN_FOR_BOOKING → LOCKED", roles: [ReleaseScheduler], code: 200, input: [], output: ReleaseWindow, side_effects: ["PROPOSED slots → REJECTED"] }
  - { method: POST, path: "/v1/release-windows/{windowId}/reopen", description: "LOCKED → REOPENED", roles: [ReleaseScheduler], code: 200, input: [], output: ReleaseWindow, side_effects: [] }
  - { method: POST, path: "/v1/release-windows/{windowId}/resume-booking", description: "REOPENED → OPEN_FOR_BOOKING", roles: [ReleaseScheduler], code: 200, input: [], output: ReleaseWindow, side_effects: [] }
  - { method: GET, path: "/v1/release-windows/{windowId}/screen-slots", description: "List slots in window (FK reverse for ScreenSlot.window_id)", roles: [ReleaseScheduler, BoxOfficeAnalyst], code: 200, input: ["limit?", "offset?", "status?"], output: "ScreenSlot[]", side_effects: [] }
  - { method: GET, path: "/v1/release-windows/{windowId}/revenue-share-statements", description: "List statements in window (FK reverse for RevenueShareStatement.window_id)", roles: [ReleaseScheduler, BoxOfficeAnalyst, PlatformContractManager], code: 200, input: ["limit?", "offset?"], output: "RevenueShareStatement[]", side_effects: [] }

  # --- ScreenSlot ---
  - { method: POST, path: "/v1/screen-slots", description: "Propose a screen slot", roles: [ReleaseScheduler], code: 201, input: [window_id, auditorium_id, studio_film_id, conversion_order_id, slot_start_date, slot_end_date, showings_per_day, "priority_tier?", expected_window_version], output: ScreenSlot, side_effects: ["status := PROPOSED", "committed_screen_seconds computed", "increments ReleaseWindow.version by 1"] }
  - { method: GET, path: "/v1/screen-slots", description: "List screen slots", roles: [ReleaseScheduler, BoxOfficeAnalyst, PlatformContractManager], code: 200, input: ["limit?", "offset?", "window_id?", "auditorium_id?", "studio_film_id?", "conversion_order_id?", "status?"], output: "ScreenSlot[]", side_effects: [] }
  - { method: GET, path: "/v1/screen-slots/{slotId}", description: "Get a screen slot", roles: [ReleaseScheduler, BoxOfficeAnalyst, PlatformContractManager, StudioRelationshipManager], code: 200, input: [], output: ScreenSlot, side_effects: [] }
  - { method: POST, path: "/v1/screen-slots/{slotId}/confirm", description: "PROPOSED|HELD_OVER → CONFIRMED", roles: [ReleaseScheduler], code: 200, input: [], output: ScreenSlot, side_effects: ["window.committed_premium_screen_seconds += slot.committed_screen_seconds"] }
  - { method: POST, path: "/v1/screen-slots/{slotId}/reject", description: "PROPOSED → REJECTED", roles: [ReleaseScheduler], code: 200, input: [], output: ScreenSlot, side_effects: [] }
  - { method: POST, path: "/v1/screen-slots/{slotId}/pull", description: "CONFIRMED|SUSPENDED|HELD_OVER → PULLED", roles: [ReleaseScheduler], code: 200, input: [], output: ScreenSlot, side_effects: ["window.committed_premium_screen_seconds -= slot.committed_screen_seconds; auto-promote waitlist; cascade conversion delivery"] }
  - { method: GET, path: "/v1/screen-slots/{slotId}/box-office-reports", description: "List reports for a slot (FK reverse for BoxOfficeReport.screen_slot_id)", roles: [BoxOfficeAnalyst, ReleaseScheduler, ExhibitorFinanceUser], code: 200, input: ["limit?", "offset?", "status?"], output: "BoxOfficeReport[]", side_effects: [] }

  # --- BoxOfficeReport ---
  - { method: POST, path: "/v1/box-office-reports", description: "Submit a daily box office report", roles: [ExhibitorFinanceUser, BoxOfficeAnalyst], code: 201, input: [screen_slot_id, reported_date, gross_receipts_cents, admissions, submission_channel], output: BoxOfficeReport, side_effects: ["status := RECEIVED"] }
  - { method: GET, path: "/v1/box-office-reports", description: "List box office reports", roles: [BoxOfficeAnalyst, ExhibitorFinanceUser], code: 200, input: ["limit?", "offset?", "screen_slot_id?", "status?"], output: "BoxOfficeReport[]", side_effects: [] }
  - { method: GET, path: "/v1/box-office-reports/{reportId}", description: "Get a box office report", roles: [BoxOfficeAnalyst, ExhibitorFinanceUser], code: 200, input: [], output: BoxOfficeReport, side_effects: [] }
  - { method: POST, path: "/v1/box-office-reports/{reportId}/validate", description: "RECEIVED → VALIDATED", roles: [BoxOfficeAnalyst], code: 200, input: [], output: BoxOfficeReport, side_effects: ["parent slot aggregates recomputed; statement recomputed"] }
  - { method: POST, path: "/v1/box-office-reports/{reportId}/flag-discrepancy", description: "RECEIVED → FLAGGED_DISCREPANCY", roles: [BoxOfficeAnalyst], code: 200, input: [], output: BoxOfficeReport, side_effects: [] }

  # --- RevenueShareStatement ---
  - { method: POST, path: "/v1/revenue-share-statements", description: "Create a draft statement", roles: [BoxOfficeAnalyst], code: 201, input: [agreement_id, window_id], output: RevenueShareStatement, side_effects: ["status := DRAFT", "statement_lines initialized empty", "provisional_total_cents := 0", "final_total_cents := 0"] }
  - { method: GET, path: "/v1/revenue-share-statements", description: "List statements", roles: [BoxOfficeAnalyst, PlatformContractManager, ExhibitorFinanceUser], code: 200, input: ["limit?", "offset?", "agreement_id?", "window_id?", "status?"], output: "RevenueShareStatement[]", side_effects: [] }
  - { method: GET, path: "/v1/revenue-share-statements/{statementId}", description: "Get a statement", roles: [BoxOfficeAnalyst, PlatformContractManager, ExhibitorFinanceUser], code: 200, input: [], output: RevenueShareStatement, side_effects: ["statement_lines, provisional_total_cents, final_total_cents recomputed on read"] }
  - { method: POST, path: "/v1/revenue-share-statements/{statementId}/issue", description: "DRAFT → ISSUED", roles: [BoxOfficeAnalyst], code: 200, input: [], output: RevenueShareStatement, side_effects: ["final_total_cents computed (chronological)"] }
  - { method: POST, path: "/v1/revenue-share-statements/{statementId}/reconcile", description: "ISSUED → RECONCILED", roles: [PlatformContractManager], code: 200, input: [], output: RevenueShareStatement, side_effects: [] }
  - { method: POST, path: "/v1/revenue-share-statements/{statementId}/dispute", description: "ISSUED → DISPUTED", roles: [ExhibitorFinanceUser], code: 200, input: [], output: RevenueShareStatement, side_effects: [] }
  - { method: POST, path: "/v1/revenue-share-statements/{statementId}/apply-adjustment", description: "DISPUTED → ADJUSTED", roles: [BoxOfficeAnalyst], code: 200, input: [screen_slot_id, adjustment_cents, adjustment_reason], output: RevenueShareStatement, side_effects: ["appends adjustment to statement_line; recomputes final_total_cents; invariant: exhibitor_retained + agreed_share == gross_reported (after adjustment)"] }
  - { method: POST, path: "/v1/revenue-share-statements/{statementId}/reissue", description: "ADJUSTED → ISSUED", roles: [BoxOfficeAnalyst], code: 200, input: [], output: RevenueShareStatement, side_effects: [] }

  # --- QAAlert ---
  - { method: POST, path: "/v1/qa-alerts", description: "Raise a QA alert", roles: [FieldEngineer, NetworkPlanner], code: 201, input: [auditorium_id, alert_code, severity, "notes?"], output: QAAlert, side_effects: ["status := RAISED", "raised_at := clock", "if severity == CRITICAL and auditorium.status == OPERATING: auditorium → DEGRADED with cascade"] }
  - { method: GET, path: "/v1/qa-alerts", description: "List QA alerts", roles: [FieldEngineer, NetworkPlanner, PlatformContractManager], code: 200, input: ["limit?", "offset?", "auditorium_id?", "status?", "severity?"], output: "QAAlert[]", side_effects: [] }
  - { method: GET, path: "/v1/qa-alerts/{alertId}", description: "Get a QA alert", roles: [FieldEngineer, NetworkPlanner, PlatformContractManager], code: 200, input: [], output: QAAlert, side_effects: [] }
  - { method: POST, path: "/v1/qa-alerts/{alertId}/acknowledge", description: "RAISED → ACKNOWLEDGED", roles: [FieldEngineer], code: 200, input: [], output: QAAlert, side_effects: [] }
  - { method: POST, path: "/v1/qa-alerts/{alertId}/defer", description: "RAISED|ACKNOWLEDGED → DEFERRED", roles: [FieldEngineer], code: 200, input: [], output: QAAlert, side_effects: ["if severity == CRITICAL → ERR_CANNOT_DEFER_CRITICAL"] }
  - { method: GET, path: "/v1/qa-alerts/{alertId}/dispatches", description: "List dispatches for an alert (FK reverse for TechDispatch.qa_alert_id)", roles: [FieldEngineer, NetworkPlanner], code: 200, input: ["limit?", "offset?"], output: "TechDispatch[]", side_effects: [] }

  # --- TechDispatch ---
  - { method: POST, path: "/v1/tech-dispatches", description: "Schedule a tech dispatch", roles: [FieldEngineer], code: 201, input: [qa_alert_id, auditorium_id, scheduled_visit_date, tech_specialty], output: TechDispatch, side_effects: ["status := SCHEDULED", "parent QAAlert → DISPATCHED"] }
  - { method: GET, path: "/v1/tech-dispatches", description: "List tech dispatches", roles: [FieldEngineer, NetworkPlanner], code: 200, input: ["limit?", "offset?", "qa_alert_id?", "auditorium_id?", "status?"], output: "TechDispatch[]", side_effects: [] }
  - { method: GET, path: "/v1/tech-dispatches/{dispatchId}", description: "Get a tech dispatch", roles: [FieldEngineer, NetworkPlanner], code: 200, input: [], output: TechDispatch, side_effects: [] }
  - { method: POST, path: "/v1/tech-dispatches/{dispatchId}/mark-en-route", description: "SCHEDULED → EN_ROUTE", roles: [FieldEngineer], code: 200, input: [], output: TechDispatch, side_effects: [] }
  - { method: POST, path: "/v1/tech-dispatches/{dispatchId}/mark-on-site", description: "EN_ROUTE → ON_SITE", roles: [FieldEngineer], code: 200, input: [], output: TechDispatch, side_effects: [] }
  - { method: POST, path: "/v1/tech-dispatches/{dispatchId}/complete", description: "ON_SITE → COMPLETE", roles: [FieldEngineer], code: 200, input: [resolution_notes], output: TechDispatch, side_effects: ["parent QAAlert → RESOLVED if no other non-terminal dispatches; if alert_code == CALIBRATION_OVERDUE: parent Auditorium.last_calibration_at := clock; calibration_overdue := false"] }
  - { method: POST, path: "/v1/tech-dispatches/{dispatchId}/abort", description: "SCHEDULED|EN_ROUTE|ON_SITE → ABORTED", roles: [FieldEngineer], code: 200, input: [], output: TechDispatch, side_effects: [] }

  # --- Test-driving endpoints (logical clock) ---
  - { method: POST, path: "/v1/_clock/set_current_utc", description: "Set the logical clock. Default before any call: 2026-09-01T00:00:00Z. Must be set explicitly; never falls back to wall clock.", roles: [PlatformContractManager, ReleaseScheduler, NetworkPlanner, StudioRelationshipManager, FieldEngineer, BoxOfficeAnalyst, QualityAssuranceReviewer, PostProductionScheduler, ExhibitorFinanceUser], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["advances server logical clock; may trigger auto-transitions (StudioFilm ANNOUNCED → IN_DISTRIBUTION, IN_DISTRIBUTION → OUT_OF_WINDOW, ExhibitorAgreement ACTIVE → EXPIRED, ReleaseWindow LOCKED → CLOSED, Auditorium.calibration_overdue recomputed)"] }
  - { method: GET, path: "/v1/_clock/current_utc", description: "Read the current logical clock", roles: [PlatformContractManager, ReleaseScheduler, NetworkPlanner, StudioRelationshipManager, FieldEngineer, BoxOfficeAnalyst, QualityAssuranceReviewer, PostProductionScheduler, ExhibitorFinanceUser], code: 200, input: [], output: "{ current_utc: string }", side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role lacks permission for this operation" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, or invalid enum" }
  - { id: ERR_MARKET_NOT_FOUND, http: 404, condition: "market_id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "agreement_id does not exist" }
  - { id: ERR_AUDITORIUM_NOT_FOUND, http: 404, condition: "auditorium_id does not exist" }
  - { id: ERR_STUDIO_NOT_FOUND, http: 404, condition: "studio_id does not exist" }
  - { id: ERR_FILM_NOT_FOUND, http: 404, condition: "studio_film_id does not exist" }
  - { id: ERR_CONVERSION_ORDER_NOT_FOUND, http: 404, condition: "conversion_order_id does not exist" }
  - { id: ERR_WINDOW_NOT_FOUND, http: 404, condition: "window_id does not exist" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "screen_slot_id does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "box_office_report_id does not exist" }
  - { id: ERR_STATEMENT_NOT_FOUND, http: 404, condition: "revenue_share_statement_id does not exist" }
  - { id: ERR_ALERT_NOT_FOUND, http: 404, condition: "qa_alert_id does not exist" }
  - { id: ERR_DISPATCH_NOT_FOUND, http: 404, condition: "tech_dispatch_id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure" }
  - { id: ERR_MARKET_NOT_APPROVED, http: 409, condition: "Sign requires Market in {APPROVED, BUILDING, LIVE}" }
  - { id: ERR_NO_SIGNED_AGREEMENT, http: 409, condition: "Market begin-build requires a SIGNED agreement in the market" }
  - { id: ERR_NO_OPERATING_AUDITORIUM, http: 409, condition: "Agreement activate requires ≥1 OPERATING auditorium" }
  - { id: ERR_MARKET_CAPACITY_EXCEEDED, http: 409, condition: "Opening an auditorium would exceed market screen_capacity_cap" }
  - { id: ERR_FILM_NOT_ANNOUNCED, http: 409, condition: "Conversion begin-post requires StudioFilm.status == ANNOUNCED" }
  - { id: ERR_POST_NOT_ELAPSED, http: 409, condition: "Conversion submit-for-qc requires clock >= scheduled_post_end_date" }
  - { id: ERR_FILMMAKER_SIGNOFF_MISSING, http: 409, condition: "Approve-release requires filmmaker_signoff=true when filmmaker_approval_required" }
  - { id: ERR_MASTER_URL_REQUIRED, http: 400, condition: "Deliver requires non-empty delivered_master_url" }
  - { id: ERR_RESOLUTION_NOTES_REQUIRED, http: 400, condition: "Complete requires non-empty resolution_notes" }
  - { id: ERR_WINDOW_IN_PAST, http: 409, condition: "Open requires window_start_date > clock" }
  - { id: ERR_WINDOW_NOT_OPEN, http: 409, condition: "Slot confirm requires window in OPEN_FOR_BOOKING" }
  - { id: ERR_AUDITORIUM_NOT_READY, http: 409, condition: "Slot confirm requires auditorium in {CERTIFIED, OPERATING}" }
  - { id: ERR_CONVERSION_NOT_APPROVED, http: 409, condition: "Slot confirm requires ConversionOrder.status == APPROVED_FOR_RELEASE" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "Slot interval overlaps another CONFIRMED/HELD_OVER slot on the same auditorium (half-open [start,end) arithmetic)" }
  - { id: ERR_POST_SCHEDULE_OVERLAP, http: 409, condition: "Conversion post window overlaps another conversion on the same studio's films (closed-closed [start,end] with handoff day required)" }
  - { id: ERR_SLOT_OUTSIDE_WINDOW, http: 409, condition: "slot_start_date < window_start_date or slot_end_date > window_end_date" }
  - { id: ERR_WINDOW_CAPACITY_EXCEEDED, http: 409, condition: "committed_premium_screen_seconds + new_slot.committed_screen_seconds > total_premium_screen_seconds_pool" }
  - { id: ERR_UNRESOLVED_CRITICAL_ALERTS, http: 409, condition: "Return-to-service blocked: unresolved CRITICAL alerts on this auditorium" }
  - { id: ERR_CANNOT_DEFER_CRITICAL, http: 409, condition: "QA alert severity=CRITICAL cannot be deferred" }
  - { id: ERR_UNRESOLVED_REPORTS, http: 409, condition: "Statement issue blocked: some BoxOfficeReports still RECEIVED" }
  - { id: ERR_SLOT_ALREADY_STARTED, http: 409, condition: "Slot pull requires clock < slot_start_date" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_window_version does not match ReleaseWindow.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NetworkPlanner
    description: "Plans network expansion into new markets"
    identity: opaque
    exclusive_operations:
      - "POST /v1/markets and market lifecycle transitions (begin-evaluation, approve, begin-build, go-live, abandon)"
    shared_operations: ["GET endpoints"]
  - name: PlatformContractManager
    description: "Manages exhibitor agreements and auditoriums"
    identity: opaque
    exclusive_operations:
      - "POST /v1/agreements and lifecycle (sign, activate, terminate)"
      - "POST /v1/auditoriums and lifecycle (begin-construction, open, decommission)"
      - "POST /v1/revenue-share-statements/{id}/reconcile"
    shared_operations: ["GET endpoints"]
  - name: StudioRelationshipManager
    description: "Manages studios, films, and conversion-order submission/cancellation"
    identity: opaque
    exclusive_operations:
      - "POST /v1/studios and lifecycle (activate, suspend, terminate)"
      - "POST /v1/films"
      - "POST /v1/conversion-orders"
      - "POST /v1/conversion-orders/{id}/cancel"
      - "POST /v1/films/{id}/archive"
    shared_operations: ["GET endpoints"]
  - name: PostProductionScheduler
    description: "Schedules and executes film conversion post-production"
    identity: opaque
    exclusive_operations:
      - "POST /v1/conversion-orders/{id}/begin-post"
      - "POST /v1/conversion-orders/{id}/submit-for-qc"
      - "POST /v1/conversion-orders/{id}/deliver"
    shared_operations: ["GET endpoints"]
  - name: QualityAssuranceReviewer
    description: "Reviews conversion masters and approves/rejects release"
    identity: opaque
    exclusive_operations:
      - "POST /v1/conversion-orders/{id}/approve-release"
      - "POST /v1/conversion-orders/{id}/request-rework"
    shared_operations: ["GET endpoints"]
  - name: ReleaseScheduler
    description: "Manages release windows and screen-slot allocation"
    identity: opaque
    exclusive_operations:
      - "POST /v1/release-windows and lifecycle (open, lock, reopen, resume-booking)"
      - "POST /v1/screen-slots and lifecycle (confirm, reject, pull)"
    shared_operations: ["GET endpoints"]
  - name: BoxOfficeAnalyst
    description: "Validates box office reports and issues statements"
    identity: opaque
    exclusive_operations:
      - "POST /v1/box-office-reports/{id}/validate"
      - "POST /v1/box-office-reports/{id}/flag-discrepancy"
      - "POST /v1/revenue-share-statements"
      - "POST /v1/revenue-share-statements/{id}/issue"
      - "POST /v1/revenue-share-statements/{id}/apply-adjustment"
      - "POST /v1/revenue-share-statements/{id}/reissue"
    shared_operations: ["GET endpoints", "POST /v1/box-office-reports"]
  - name: ExhibitorFinanceUser
    description: "Exhibitor-side finance user; submits reports and disputes statements"
    identity: entity_backed:ExhibitorAgreement
    exclusive_operations:
      - "POST /v1/revenue-share-statements/{id}/dispute"
    shared_operations: ["POST /v1/box-office-reports", "GET endpoints on own agreement and its children"]
  - name: FieldEngineer
    description: "Field technician; calibrates, repairs, dispatches"
    identity: opaque
    exclusive_operations:
      - "POST /v1/auditoriums/{id}/begin-calibration"
      - "POST /v1/auditoriums/{id}/certify"
      - "POST /v1/auditoriums/{id}/return-to-service"
      - "POST /v1/qa-alerts"
      - "POST /v1/qa-alerts/{id}/acknowledge"
      - "POST /v1/qa-alerts/{id}/defer"
      - "POST /v1/tech-dispatches and lifecycle"
    shared_operations: ["GET endpoints"]
