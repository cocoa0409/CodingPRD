            - call: "POST /basin-condition-snapshots"
              as: WaterMaster
              captures: { snap_b_condition: $.data.condition, snap_b_pct: $.data.breach_pct }
          assert:
            - "BasinConditionSnapshot.breach_pct == 25.00 (captured ${snap_b_pct}): exactly 1 of 4 eligible wells breached"
            - "BasinConditionSnapshot.condition == WATCH (captured ${snap_b_condition}): >= 25 inclusive boundary; a strict-> implementation would wrongly return NORMAL"

      - name: transfer_quantity_exactly_equals_available_succeeds
        grounds:
