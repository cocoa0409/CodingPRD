        grounds:
          - state_machines.Region.OPEN_to_RESTRICTED
          - state_machines.CapacityPlan.ACTIVE_to_UNDER_REVIEW
          - state_machines.Referral.PENDING_TRIAGE_to_HELD
          - state_machines.Appointment.REQUESTED_to_SCHEDULED
        distinguishing_aspect: "Depth-4 reverse-triggered cascade where hop C4 is caused by hop C3 (a slot consumption driving the last free slot to zero), hop C5 by C4, and hop H3 by C5: booking the one remaining slot on a CapacityPlan whose budgeted_slots equals its committed_slots trips the plan, the region's capacity posture gate, and the referral hold."
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-09-01T00:00:00Z default."
            - "One OPEN region with a PRIMARY_CARE department whose weekly appointment_slots_budgeted is 100 and which already holds 99 committed slots, an ACTIVE capacity plan with budgeted_slots 1 and committed_slots 1, and two members. The 100th booking is what pushes the department to its budget and the region over its capacity budget."
