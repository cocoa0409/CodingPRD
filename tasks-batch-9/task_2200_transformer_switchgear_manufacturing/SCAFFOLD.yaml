    roles: [ContractAdmin, SalesEngineer, PlantAdmin]
    code: 200
    input: []
    output: EngineeredOrder
    side_effects: []

  # --- SubmittalDrawing -----------------------------------------------------
  - id: create_submittal_drawing
    method: POST
    path: "/engineered-orders/{id}/submittal-drawings"
    description: "Create the next drawing revision (revision_round auto-assigned); OCC-guarded by expected_engineered_order_version"
    roles: [DesignEngineer]
    code: 201
    input: [drawing_set_code, authored_by_user_id, expected_engineered_order_version]
    output: SubmittalDrawing
    side_effects: ["status := DRAFT", "revision_round := max(existing)+1", "supersedes_drawing_id := preceding revision", "predecessor in REVISE_AND_RESUBMIT is superseded", "increments EngineeredOrder.version by 1"]
  - id: list_order_submittal_drawings
    method: GET
    path: "/engineered-orders/{id}/submittal-drawings"
    description: "Reverse-reachability list of all drawing revisions on the order"
    roles: [PlantAdmin, DesignEngineer, CustomerReviewer, ComplianceOfficer, QualityEngineer, ContractAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SubmittalDrawing[]
    side_effects: []
  - id: list_submittal_drawings
    method: GET
    path: "/submittal-drawings"
    description: "Filtered list; supersedes_drawing_id resolves the self-referential revision chain"
    roles: [PlantAdmin, DesignEngineer, CustomerReviewer, ComplianceOfficer, QualityEngineer]
    code: 200
    input: ["engineered_order_id?", "supersedes_drawing_id?", "status?", "revision_round?", "limit?", "offset?"]
    output: SubmittalDrawing[]
    side_effects: []
  - id: get_submittal_drawing
    method: GET
    path: "/submittal-drawings/{id}"
    description: "Read one drawing revision"
    roles: [PlantAdmin, DesignEngineer, CustomerReviewer, ComplianceOfficer, QualityEngineer, ContractAdmin]
    code: 200
    input: []
    output: SubmittalDrawing
    side_effects: []
  - id: submit_submittal_drawing
    method: POST
    path: "/submittal-drawings/{id}/submit"
    description: "DRAFT -> SUBMITTED; a revision_round above order.released_drawing_revision pushes engineering back into SUBMITTAL_IN_REVIEW and stales issued labels"
    roles: [DesignEngineer]
    code: 200
    input: []
    output: SubmittalDrawing
    side_effects: ["status := SUBMITTED, submitted_at := logical clock", "order.engineering_status := SUBMITTAL_IN_REVIEW", "ISSUED/VERIFIED/GENERATED ComplianceLabel on the order -> STALE", "increments EngineeredOrder.version by 1"]
  - id: begin_review_submittal_drawing
    method: POST
    path: "/submittal-drawings/{id}/begin-review"
    description: "SUBMITTED -> UNDER_REVIEW"
    roles: [CustomerReviewer]
    code: 200
    input: []
    output: SubmittalDrawing
    side_effects: ["status := UNDER_REVIEW"]
  - id: disposition_submittal_drawing
    method: POST
    path: "/submittal-drawings/{id}/disposition"
    description: "UNDER_REVIEW -> APPROVED | APPROVED_AS_NOTED | REVISE_AND_RESUBMIT; approval releases the design and pins released_drawing_revision"
    roles: [CustomerReviewer]
    code: 200
    input: [disposition, reviewed_by_user_id, "notes_count?", "as_noted_changes_bill_of_material?"]
    output: SubmittalDrawing
    side_effects: ["disposition_at := logical clock", "on APPROVED/APPROVED_AS_NOTED: order.engineering_status := DESIGN_RELEASED and released_drawing_revision := revision_round", "as_noted_changes_bill_of_material true reverts MATERIAL_ALLOCATED -> PLANNING and adds posture reason MATERIAL_INCOMPLETE", "on REVISE_AND_RESUBMIT: order.engineering_status := ENG_OPEN", "sibling non-terminal drawings -> VOID", "increments EngineeredOrder.version by 1"]

