              as_user_id: "qe-1"
          trigger:
            - call: "POST /thermal-tests/${test_a}/record-result"
              payload: { specimen_r_values: [13.10, 13.20] }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { err_two_specimens: "$.data.error_id" }
            - call: "POST /thermal-tests/${test_a}/record-result"
              payload: { specimen_r_values: [13.10, 13.20, 0.00] }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { err_zero_specimen: "$.data.error_id" }
            - call: "POST /thermal-tests/${test_a}/record-result"
              payload: { specimen_r_values: [13.10, 13.20, 12.90] }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /thermal-tests/${test_a}/request-retest"
              payload: { window_start: "2026-08-03T16:00:00Z", window_end: "2026-08-03T20:00:00Z" }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { err_retest: "$.data.error_id" }
          assert:
            - "${err_two_specimens} == \"ERR_SPECIMEN_COUNT_INSUFFICIENT\" with HTTP 422: 2 values is below RCERT-PS min_specimen_count == 3"
            - "${err_zero_specimen} == \"ERR_SPECIMEN_COUNT_INSUFFICIENT\" with HTTP 422 as well — the count is right but the same rule also requires every specimen value to be > 0, and 0.00 is not"
            - "ThermalTest.${test_a}.status is STILL IN_LAB after both refusals, with specimen_r_values == [] and specimen_count == 0 and recorded_by_user_id == null"
            - "ProductionRun.${run_a}.qc_status is STILL SAMPLED after both refusals — a refused result advances nothing"
            - "the third call returns HTTP 200: status == COMPLETED, specimen_count == 3, min_r_value == 12.90, mean_r_value == 13.07 (39.20 / 3 = 13.0666... -> 13.07), conformance_verdict == CONFORMING because every specimen is >= 13.0 - 0.30 == 12.70"
            - "ProductionRun.${run_a}.qc_status == CONFORMING and ThermalTest.${test_a}.attempt_number == 1"
            - "${err_retest} == \"ERR_RETEST_LIMIT_REACHED\" with HTTP 409: attempt_number 1 is below retest_limit 2, but a CONFORMING verdict leaves no retest due, so the limit rule — not ERR_INVALID_STATE — owns this refusal"
            - "ThermalTest.${test_a}.attempt_number is STILL 1 and status is STILL COMPLETED, and ProductionRun.${run_a}.qc_status is STILL CONFORMING (it did not slide to RETEST_PENDING)"

      - name: charging_a_rejected_batch_and_reversing_after_the_cure_starts_are_both_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CULLET_BATCH_NOT_STAGED]
          - errors[ERR_CULLET_REVERSAL_WINDOW_CLOSED]
          - errors[ERR_CULLET_BATCH_NOT_FOUND]
          - validations[priority=86]
          - validations[priority=88]
          - state_machines[CulletBatch.status].transitions[STAGED->REJECTED]
        distinguishing_aspect: "cullet_batch_ids is a body array of ids, so it has three distinct failure modes that must not be conflated: an element that names no row at all (404, priority 25), an element that names a real row in the wrong status (409, priority 86), and — after the charge has succeeded — a reversal attempted once the run has left MELTING (409, priority 88). The reversal window is defined by the RUN's status, not by the batch's."
        test_recipe:
          setup:
            - "Plant NWK with two staged external cullet batches, B1 1500.00 kg and B2 1300.00 kg, then B2 rejected with a reason so it is terminal."
