# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Vacation Bible School & Seasonal Program Registration
# Breadth coverage of every §1.1-§1.7 claim not already probed by §1.8.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: family_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Family.fields.preferred_contact, entities.Family.fields.status]
        distinguishing_aspect: "Omitting preferred_contact applies the EMAIL default; system fields id/created_at/version are server-set (version starts at 1) and status starts ACTIVE."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id, pc: $.data.preferred_contact, st: $.data.status, ver: $.data.version } }
          trigger: []
          assert:
            - "${pc} == EMAIL  (default applied)"
            - "${st} == ACTIVE and ${ver} == 1"
            - "Family.${fam_id}.created_at matches ISO8601 with three fractional digits"
      - name: child_create_with_invalid_grade_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Child.fields.grade_completed"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "grade_completed is a closed enum; GRADE_7 is outside it and must be rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["family F ACTIVE"]
          setup_api_calls:
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
          trigger:
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "A", birth_date: "2020-03-15", grade_completed: "GRADE_7" }, as: Parent, as_user_id: "${fam_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "no Child exists for family ${fam_id}"
      - name: program_create_missing_required_start_date
        claim_type: required_fields
        grounds:
          - "entities.Program.fields.start_date"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "start_date has no default; omitting it is a P0 request-shape failure (400), evaluated before any business rule."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000 }, as: ProgramDirector, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
      - name: classroom_create_inverted_age_band_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Classroom.fields.age_min"
          - "entities.Classroom.fields.age_max"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "age_min > age_max violates the field-level constraint and returns ERR_INVALID_REQUEST regardless of business state."
        test_recipe:
          setup: ["Program Alpha DRAFT"]
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
          trigger:
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Broken", age_min: 7, age_max: 4, capacity: 10 }, as: RegistrationCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
      - name: classroom_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed UUID that does not exist returns 404 ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /vbs/classrooms/11111111-2222-3333-4444-555555555555", payload: {}, as: RegistrationCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND and http status == 404"
      - name: classroom_create_rejects_undeclared_computed_field
        claim_type: computed_fields
        grounds:
          - "entities.Classroom.fields.enrolled_count"
          - "validations[priority=0]"
        distinguishing_aspect: "enrolled_count is source:computed; sending it in the create body is an undeclared field and is rejected with ERR_INVALID_REQUEST rather than silently honored."
        test_recipe:
          setup: ["Program Alpha DRAFT"]
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
          trigger:
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 10, enrolled_count: 99 }, as: RegistrationCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
      - name: volunteer_minor_computed_and_lead_role_rejected
        claim_type: computed_fields
        grounds:
          - "entities.Volunteer.fields.is_minor"
          - "errors[ERR_MINOR_ROLE_FORBIDDEN]"
        distinguishing_aspect: "is_minor is computed from birth_date against the program start_date (age 14 -> true); a minor may be proposed as ASSISTANT_TEACHER but LEAD_TEACHER is rejected with ERR_MINOR_ROLE_FORBIDDEN (422)."
        test_recipe:
          setup:
            - "Program Alpha DRAFT; classroom Koalas SETUP; volunteer v1 born 2012-06-01 (age 14 on 2026-08-17)"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 10 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/volunteers", payload: { program_id: "${prog_id}", full_name: "Teen Helper", email: "teen@example.com", phone: "555-0209", birth_date: "2012-06-01" }, as: Anonymous, captures: { v1: $.data.id, minor: $.data.is_minor } }
          trigger:
            - { call: "POST /vbs/role-assignments", payload: { volunteer_id: "${v1}", classroom_id: "${cls_k}", role: "LEAD_TEACHER" }, as: VolunteerCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /vbs/role-assignments", payload: { volunteer_id: "${v1}", classroom_id: "${cls_k}", role: "ASSISTANT_TEACHER" }, as: VolunteerCoordinator, captures: { asg_status: $.data.status } }
          assert:
            - "${minor} == true  (computed from birth_date vs program start_date, not client input)"
            - "${err} == ERR_MINOR_ROLE_FORBIDDEN"
            - "${asg_status} == PROPOSED  (minors may assist, not lead)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: program_archive_terminal_lockdown
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.Program.COMPLETED_to_ARCHIVED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "ARCHIVED is terminal: both lifecycle actions (open-registration) and child creation (append a day) against an archived program fail with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Program Alpha walked DRAFT -> REGISTRATION_OPEN -> REGISTRATION_CLOSED -> IN_SESSION -> COMPLETED -> ARCHIVED with a single day 2026-08-17 opened and closed (zero enrollees: staffing gate is vacuous)"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4, waitlist_offer_ttl_hours: 48, pickup_cutoff_time: "12:00" }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/days", payload: { program_id: "${prog_id}", date: "2026-08-17" }, as: ProgramDirector, captures: { day1: $.data.id } }
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/programs/${prog_id}/close-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/programs/${prog_id}/start-session", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T08:30:00Z" }, as: ProgramDirector }
            - { call: "POST /vbs/days/${day1}/open", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/days/${day1}/close", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/programs/${prog_id}/complete", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/programs/${prog_id}/archive", payload: {}, as: ProgramDirector, captures: { p_status: $.data.status } }
          trigger:
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector, captures: { err1: $.data.error_id } }
            - { call: "POST /vbs/days", payload: { program_id: "${prog_id}", date: "2026-08-18" }, as: ProgramDirector, captures: { err2: $.data.error_id } }
          assert:
            - "${p_status} == ARCHIVED"
            - "${err1} == ERR_INVALID_STATE and ${err2} == ERR_INVALID_STATE"
      - name: registration_second_cancel_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Registration.ENROLLED_to_CANCELLED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "CANCELLED is terminal; a second cancel on the same registration fails with ERR_INVALID_STATE and runs no side effects (enrolled_count stays 0, no promotion fires on an empty waitlist)."
        test_recipe:
          setup:
            - "Program Alpha REGISTRATION_OPEN; Koalas (4-6, cap 2); child A ENROLLED, then cancelled"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4, waitlist_offer_ttl_hours: 48, pickup_cutoff_time: "12:00" }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 2 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "A", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { ka: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${ka}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { reg_a: $.data.id } }
            - { call: "POST /vbs/registrations/${reg_a}/cancel", payload: {}, as: Parent, as_user_id: "${fam_id}" }
          trigger:
            - { call: "POST /vbs/registrations/${reg_a}/cancel", payload: {}, as: Parent, as_user_id: "${fam_id}", captures: { err: $.data.error_id } }
            - { call: "GET /vbs/classrooms/${cls_k}", payload: {}, as: RegistrationCoordinator, captures: { k_enr: $.data.enrolled_count, k_off: $.data.offered_count } }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "${k_enr} == 0 and ${k_off} == 0  (no phantom side effects from the rejected call)"
      - name: screening_decide_after_terminal_returns_invalid_state
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.ScreeningCheck.SUBMITTED_to_CLEARED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "CLEARED is terminal for a ScreeningCheck; any further decide on it fails with ERR_INVALID_STATE (no silent re-decision)."
        test_recipe:
          setup: ["Program Alpha DRAFT; volunteer v1 with BACKGROUND check already decided CLEARED"]
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/volunteers", payload: { program_id: "${prog_id}", full_name: "Vera One", email: "vera1@example.com", phone: "555-0201", birth_date: "1990-05-20" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /vbs/screening-checks", payload: { volunteer_id: "${v1}", check_type: "BACKGROUND" }, as: Volunteer, as_user_id: "${v1}", captures: { chk: $.data.id } }
            - { call: "POST /vbs/screening-checks/${chk}/decide", payload: { decision: "CLEARED" }, as: SafetyOfficer, as_user_id: "so-1" }
          trigger:
            - { call: "POST /vbs/screening-checks/${chk}/decide", payload: { decision: "REJECTED" }, as: SafetyOfficer, as_user_id: "so-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "ScreeningCheck.${chk}.status remains CLEARED and decided_at is unchanged"
      - name: attendance_happy_path_two_children_sequential_tags
        claim_type: valid_transition
        grounds: [state_machines.AttendanceRecord.NOT_ARRIVED_to_CHECKED_IN, state_machines.AttendanceRecord.CHECKED_IN_to_CHECKED_OUT, state_machines.SecurityTag.ISSUED_to_REDEEMED, entities.SecurityTag.fields.tag_code]
        distinguishing_aspect: "Full NOT_ARRIVED -> CHECKED_IN -> CHECKED_OUT walk for two children on one day: tag codes are assigned deterministically 000001 then 000002, both tags REDEEM at checkout, day counters read checked_in_count 2 / checked_out_count 2, and neither checkout at 11:59 is late."
        test_recipe:
          setup:
            - "Program Alpha IN_SESSION (5 days); Koalas staffed ADEQUATE by cleared v1 (LEAD) + v2 (ASSISTANT); kids k1, k2 ENROLLED; day 2026-08-17 OPEN; clock 2026-08-17T08:30:00Z"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4, waitlist_offer_ttl_hours: 48, pickup_cutoff_time: "12:00" }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 10 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/days", payload: { program_id: "${prog_id}", date: "2026-08-17" }, as: ProgramDirector, captures: { day1: $.data.id } }
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "One", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { k1: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "Two", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { k2: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${k1}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
            - { call: "POST /vbs/registrations", payload: { child_id: "${k2}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
            - { call: "POST /vbs/volunteers", payload: { program_id: "${prog_id}", full_name: "Vera One", email: "vera1@example.com", phone: "555-0201", birth_date: "1990-05-20" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /vbs/role-assignments", payload: { volunteer_id: "${v1}", classroom_id: "${cls_k}", role: "LEAD_TEACHER" }, as: VolunteerCoordinator }
            - { call: "POST /vbs/screening-checks", payload: { volunteer_id: "${v1}", check_type: "BACKGROUND" }, as: Volunteer, as_user_id: "${v1}", captures: { c1a: $.data.id } }
            - { call: "POST /vbs/screening-checks", payload: { volunteer_id: "${v1}", check_type: "REFERENCE" }, as: Volunteer, as_user_id: "${v1}", captures: { c1b: $.data.id } }
            - { call: "POST /vbs/screening-checks", payload: { volunteer_id: "${v1}", check_type: "SAFE_MINISTRY_TRAINING" }, as: Volunteer, as_user_id: "${v1}", captures: { c1c: $.data.id } }
            - { call: "POST /vbs/screening-checks/${c1a}/decide", payload: { decision: "CLEARED" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /vbs/screening-checks/${c1b}/decide", payload: { decision: "CLEARED" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /vbs/screening-checks/${c1c}/decide", payload: { decision: "CLEARED" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /vbs/volunteers", payload: { program_id: "${prog_id}", full_name: "Vera Two", email: "vera2@example.com", phone: "555-0202", birth_date: "1988-02-11" }, as: Anonymous, captures: { v2: $.data.id } }
            - { call: "POST /vbs/role-assignments", payload: { volunteer_id: "${v2}", classroom_id: "${cls_k}", role: "ASSISTANT_TEACHER" }, as: VolunteerCoordinator }
            - { call: "POST /vbs/screening-checks", payload: { volunteer_id: "${v2}", check_type: "BACKGROUND" }, as: Volunteer, as_user_id: "${v2}", captures: { c2a: $.data.id } }
            - { call: "POST /vbs/screening-checks", payload: { volunteer_id: "${v2}", check_type: "REFERENCE" }, as: Volunteer, as_user_id: "${v2}", captures: { c2b: $.data.id } }
            - { call: "POST /vbs/screening-checks", payload: { volunteer_id: "${v2}", check_type: "SAFE_MINISTRY_TRAINING" }, as: Volunteer, as_user_id: "${v2}", captures: { c2c: $.data.id } }
            - { call: "POST /vbs/screening-checks/${c2a}/decide", payload: { decision: "CLEARED" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /vbs/screening-checks/${c2b}/decide", payload: { decision: "CLEARED" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /vbs/screening-checks/${c2c}/decide", payload: { decision: "CLEARED" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /vbs/programs/${prog_id}/close-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/programs/${prog_id}/start-session", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T08:30:00Z" }, as: ProgramDirector }
            - { call: "POST /vbs/days/${day1}/open", payload: {}, as: ProgramDirector }
          trigger:
            - { call: "POST /vbs/attendance/check-in", payload: { child_id: "${k1}", program_day_id: "${day1}" }, as: CheckInStaff, as_user_id: "desk-1", captures: { tag1: $.data.tag_code, st1: $.data.status } }
            - { call: "POST /vbs/attendance/check-in", payload: { child_id: "${k2}", program_day_id: "${day1}" }, as: CheckInStaff, as_user_id: "desk-1", captures: { tag2: $.data.tag_code } }
            - { call: "POST /vbs/_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T11:59:00Z" }, as: ProgramDirector }
            - { call: "POST /vbs/attendance/check-out", payload: { child_id: "${k1}", program_day_id: "${day1}", tag_code: "${tag1}", pickup_person: "Maria Alvarez" }, as: CheckInStaff, as_user_id: "desk-1", captures: { out1: $.data.status, late1: $.data.late_pickup } }
            - { call: "POST /vbs/attendance/check-out", payload: { child_id: "${k2}", program_day_id: "${day1}", tag_code: "${tag2}", pickup_person: "Maria Alvarez" }, as: CheckInStaff, as_user_id: "desk-1", captures: { out2: $.data.status } }
            - { call: "GET /vbs/security-tags", payload: { program_day_id: "${day1}", status: "REDEEMED" }, as: CheckInStaff, as_user_id: "desk-1" }
            - { call: "GET /vbs/days/${day1}", payload: {}, as: ProgramDirector, captures: { d_in: $.data.checked_in_count, d_out: $.data.checked_out_count } }
          assert:
            - "${tag1} == 000001 and ${tag2} == 000002  (deterministic per-day sequence)"
            - "${out1} == CHECKED_OUT and ${out2} == CHECKED_OUT and ${late1} == false  (11:59 is before the 12:00 cutoff)"
            - "GET /vbs/security-tags?program_day_id&status=REDEEMED returns exactly 2 rows"
            - "${d_in} == 2 and ${d_out} == 2"
      - name: day_close_marks_absent_children
        claim_type: side_effect_execution
        grounds: [state_machines.ProgramDay.OPEN_to_CLOSED, state_machines.AttendanceRecord.NOT_ARRIVED_to_ABSENT]
        distinguishing_aspect: "Closing a day flips only NOT_ARRIVED records to ABSENT; CHECKED_OUT records are untouched, and day counters reflect both (absent_count 1, checked_out_count 1)."
        test_recipe:
          setup:
            - "Program Alpha IN_SESSION; Koalas staffed ADEQUATE; kids k1, k2 ENROLLED; day 2026-08-17 OPEN; k1 checked in and out; k2 never arrived; clock 2026-08-17T12:30:00Z"
          setup_api_calls:
