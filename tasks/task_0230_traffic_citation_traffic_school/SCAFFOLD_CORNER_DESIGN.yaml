  # ===========================================================================
  - section: cross_cutting
    instances:
      - name: occ_plan_create_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-create-stale-citation]", "errors[ERR_STALE_VERSION]", endpoints]
        distinguishing_aspect: "After a successful plan create bumps Citation.version, a second create still carrying the pre-supersede version is rejected with ERR_STALE_VERSION (412). Two strictly sequential requests; the first supersedes."
        test_recipe:
          setup: ["Assessed citation; client reads its version (cver) and creates plan A successfully (version advances). A second create reuses the stale cver."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "CC1LIC", full_name: "Cc One" }
              as: CourtClerk
              captures: { d: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d}", citation_number: "CC-1", issued_at: "2026-01-10T00:00:00Z", appear_by: "2026-02-10T00:00:00Z" }
              as: CourtClerk
              captures: { cid: $.data.id }
            - call: "POST /charges"
              payload: { citation_id: "${cid}", violation_code: "VC22350", description: "Speed", base_fine_cents: 20000, points: 1 }
              as: CourtClerk
            - call: "POST /citations/${cid}/assess"
              payload: {}
              as: CourtClerk
              captures: { cver: $.data.version }
            - call: "POST /citations/${cid}/installment-plans"
              payload: { term_count: 4, first_due_at: "2026-03-01T00:00:00Z", expected_citation_version: "${cver}" }
              as: Driver
              as_user_id: "${d}"
          trigger:
            - call: "POST /citations/${cid}/installment-plans"
              payload: { term_count: 6, first_due_at: "2026-03-01T00:00:00Z", expected_citation_version: "${cver}" }
              as: Driver
              as_user_id: "${d}"
              captures: { eid: $.data.error_id }
          assert:
            - "Response status == 412; data.error_id == ERR_STALE_VERSION"
            - "Exactly one ACTIVE InstallmentPlan exists for citation ${cid}; no plan was superseded by the rejected call"

      - name: occ_plan_create_correct_version_supersedes_prior
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-create-stale-citation]", state_machines.InstallmentPlan.ACTIVE_to_SUPERSEDED]
        distinguishing_aspect: "A second plan create carrying the CURRENT (re-read) version succeeds, supersedes the prior ACTIVE plan, and bumps Citation.version again."
        test_recipe:
          setup: ["Assessed citation with one ACTIVE plan A; client re-reads the current citation version after plan A."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "CC2LIC", full_name: "Cc Two" }
              as: CourtClerk
              captures: { d: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d}", citation_number: "CC-2", issued_at: "2026-01-10T00:00:00Z", appear_by: "2026-02-10T00:00:00Z" }
              as: CourtClerk
              captures: { cid: $.data.id }
            - call: "POST /charges"
              payload: { citation_id: "${cid}", violation_code: "VC22350", description: "Speed", base_fine_cents: 20000, points: 1 }
              as: CourtClerk
            - call: "POST /citations/${cid}/assess"
              payload: {}
              as: CourtClerk
              captures: { cver: $.data.version }
            - call: "POST /citations/${cid}/installment-plans"
              payload: { term_count: 4, first_due_at: "2026-03-01T00:00:00Z", expected_citation_version: "${cver}" }
              as: Driver
              as_user_id: "${d}"
              captures: { planA: $.data.id }
            - call: "GET /citations/${cid}"
              payload: {}
              as: Driver
              as_user_id: "${d}"
              captures: { cver2: $.data.version }
          trigger:
            - call: "POST /citations/${cid}/installment-plans"
              payload: { term_count: 6, first_due_at: "2026-03-01T00:00:00Z", expected_citation_version: "${cver2}" }
              as: Driver
              as_user_id: "${d}"
              captures: { planB: $.data.id }
            - call: "GET /installment-plans/${planA}"
              payload: {}
              as: Driver
              as_user_id: "${d}"
          assert:
            - "Response status == 201 for plan B"
            - "InstallmentPlan.${planA}.status == SUPERSEDED"
            - "InstallmentPlan.${planB}.status == ACTIVE"

      - name: version_increments_on_each_citation_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Citation.fields.financial_status, endpoints]
        distinguishing_aspect: "Citation.version starts at 1 on create, and increments by 1 on assess and on each payment (1 -> 2 after assess -> 3 after a partial payment)."
        test_recipe:
          setup: ["Citation created (version 1), assessed (version 2), one partial payment (version 3)."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "CC3LIC", full_name: "Cc Three" }
              as: CourtClerk
              captures: { d: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d}", citation_number: "CC-3", issued_at: "2026-01-10T00:00:00Z", appear_by: "2026-02-10T00:00:00Z" }
              as: CourtClerk
              captures: { cid: $.data.id, v0: $.data.version }
            - call: "POST /charges"
              payload: { citation_id: "${cid}", violation_code: "VC22350", description: "Speed", base_fine_cents: 20000, points: 1 }
              as: CourtClerk
            - call: "POST /citations/${cid}/assess"
              payload: {}
              as: CourtClerk
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /citations/${cid}/payments"
              payload: { amount_cents: 10000, method: "CASH" }
              as: Driver
              as_user_id: "${d}"
            - call: "GET /citations/${cid}"
              payload: {}
              as: Driver
              as_user_id: "${d}"
          assert:
            - "Citation.${cid}.version == 1 at create, == 2 after assess, == 3 after the partial payment"

      - name: cascade_default_opens_nonpayment_hold
        claim_type: cascading_side_effects
        grounds: [state_machines.InstallmentPlan.ACTIVE_to_DEFAULTED, entities.LicenseHold.fields.hold_type, calculations.license_status]
        distinguishing_aspect: "Marking a plan DEFAULTED (a missed installment past due_at) opens a NONPAYMENT_HOLD and re-derives Driver.license_status to HELD."
        test_recipe:
          setup: ["Assessed citation, ACTIVE plan first_due_at 2026-03-01; clock advanced to 2026-03-02 (installment 1 past due, unpaid)."]
          setup_api_calls:
            - call: "POST /jurisdictions"
