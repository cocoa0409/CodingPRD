        test_recipe:
          setup:
            - "Ports 4601 / 3901; carrier ACTIVE; CONTINUOUS bond 50000.00."
            - "M1 and M2 filed 2026-08-01 and departed; the clock moves to 2026-09-11T12:00:00Z and a sweep marks both OVERDUE (7 days)."
            - "M2 then reports ARRIVAL (7 days late) and OFF-1 issues a LATE_ARRIVAL claim on it, so only M1 is still overdue."
