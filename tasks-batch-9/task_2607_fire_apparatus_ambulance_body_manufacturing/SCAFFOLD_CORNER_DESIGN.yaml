        excluded_because:
          difficulty_instance: combinatorial_formula / performance_bond_tier_keyed_on_subtotal_not_total
          rationale: "An award_year six years past base_year is rejected with this error inside that instance."

      - name: invalid_certification_state_triggerable
        claim_type: Violation → Error
        grounds:
