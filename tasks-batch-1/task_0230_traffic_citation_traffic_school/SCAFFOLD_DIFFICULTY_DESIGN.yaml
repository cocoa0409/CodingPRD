  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: uphold_then_school_conserves_driver_point_balance
        grounds:
          - state_machines.ContestRequest.HEARING_SET_to_UPHELD
          - state_machines.TrafficSchoolEnrollment.ENROLLED_to_COMPLETED
          - calculations.driver_point_balance
          - calculations.point_reduction
        distinguishing_aspect: |
          Conserved quantity = Driver.point_balance (sum of ACTIVE points). Forward
          action UPHOLD posts +N points; the compensating action (school completion
          masking exactly those points) returns point_balance to its pre-uphold value.
          Invariant pinned: point_balance_after_school == point_balance_before_uphold.
        test_recipe:
          setup:
            - "Jurisdiction A but school_eligible_max_points=2; driver D18 at point_balance 0; one citation, paid, contest UPHELD with 2 points -> point_balance 2."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court D", state_code: "OR", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 2, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: CourtClerk
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "D18LIC", full_name: "You Eighteen" }
              as: CourtClerk
              captures: { d18: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d18}", citation_number: "C-CI1", issued_at: "2026-01-04T00:00:00Z", appear_by: "2026-02-04T00:00:00Z" }
              as: CourtClerk
              captures: { c18: $.data.id }
            - call: "POST /charges"
              payload: { citation_id: "${c18}", violation_code: "VC23103", description: "Reckless", base_fine_cents: 10000, points: 2 }
              as: CourtClerk
            - call: "POST /citations/${c18}/assess"
              payload: {}
              as: CourtClerk
            - call: "POST /citations/${c18}/contest-requests"
              payload: { grounds: "CI1" }
              as: Driver
