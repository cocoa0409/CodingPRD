        grounds: ["state_machines.ConstructionShift.status.LOCKED_to_COMPLETED", "state_machines.ShiftAssignment.status.CHECKED_IN_to_COMPLETED", "state_machines.ShiftAssignment.status.CONFIRMED_to_NO_SHOW", calculations.sweat_equity_credit_allocation]
        excluded_because:
          difficulty_instance: shift_completion_fork_partner_credit_versus_no_show_strike
          rationale: "The named §1.8 instance already drives one LOCKED -> COMPLETED request through both branches at once: it asserts the CHECKED_IN HOMEOWNER_PARTNER seat becoming COMPLETED with its synthesized VERIFIED SweatEquityEntry (SHIFT_SYNTHESIZED variant) and the CONFIRMED-but-never-checked-in seat becoming NO_SHOW with a volunteer strike. A §1.9 duplicate would add no distinct observable."

