            - "overall_score != 55.56 — the naive mean of the rounded 2dp dimension scores ((58.33+41.67+66.67)/3) is the forbidden evaluation order; scaffold pins overall from products, NOT from rounded dimension means"
      - name: response_rate_evaluation_order_on_partial_to_submit
        grounds:
          - calculations.response_rate
          - entities.SurveyCycle.fields.response_rate
