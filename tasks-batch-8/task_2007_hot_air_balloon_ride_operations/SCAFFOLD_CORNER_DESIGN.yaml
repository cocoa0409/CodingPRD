  # Section: errors (trigger coverage for errors not exercised above)
  # ===========================================================================
  - section: errors
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers fails with ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/flights/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: "__no_headers__"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED"

      - name: balloon_grounded_on_publish_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_BALLOON_GROUNDED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / publish_requires_balloon_active
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: payload_exceeded_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_PAYLOAD_EXCEEDED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / payload_exactly_at_max_allowed
          rationale: "Boundary pair (allowed-at-max) plus this section's payload_exceeded_at_booking_declared_weight cover both sides."

      - name: dawn_window_expired_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_DAWN_WINDOW_EXPIRED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / dawn_window_end_inclusive_boundary
          rationale: "Inclusive-boundary instance pins the allowed side; the rejected side is asserted in the §1.8 priority instance launch_safety_vs_temporal_priority's setup context."

      - name: balloon_schedule_conflict_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_BALLOON_SCHEDULE_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / balloon_half_open_window_overlap
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: pilot_schedule_conflict_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_PILOT_SCHEDULE_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / pilot_same_date_conflict
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: chase_not_ready_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_CHASE_NOT_READY]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / launch_safety_vs_temporal_priority
          rationale: "Asserted as the winning error of the named §1.8 instance."

