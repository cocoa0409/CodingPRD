            - "HTTP 409 with data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "SurgicalCase.${case_id}.cancellation_reason is still PATIENT_REQUEST (the second reason is not written)"

      - name: signing_an_evaluation_twice_is_rejected
        claim_type: idempotency
        grounds:
