              payload: { membership_id: "${m3}", position: "NEGATIVE", comment_text: "Clause 12 torque ceiling is unsafe", clause_reference: "12" }
              as: CommitteeMember
              as_user_id: "${p3}"
              captures: { v3: $.data.id }
            - call: "GET /sdo/ballots/${b1}"
              payload: {}
              as: StandardsStaff
            - call: "PATCH /sdo/votes/${v3}"
              payload: { status: "WITHDRAWN" }
              as: CommitteeMember
              as_user_id: "${p3}"
            - call: "GET /sdo/ballots/${b1}"
              payload: {}
              as: StandardsStaff
            - call: "GET /sdo/comments"
              payload: { ballot_id: "${b1}" }
              as: StandardsStaff
          assert:
            - "before any vote: Ballot.${b1}.affirmative_count == 0, negative_count == 0, abstain_count == 0, returned_count == 0, not_returned_count == 3, eligible_voter_count == 3"
            - "after both casts: Ballot.${b1}.affirmative_count == 1, negative_count == 1, abstain_count == 0, returned_count == 2, not_returned_count == 1"
            - "after the withdrawal: Ballot.${b1}.negative_count == 0"
            - "after the withdrawal: Ballot.${b1}.affirmative_count == 1 — the other voter's seat is untouched"
            - "after the withdrawal: Ballot.${b1}.abstain_count == 0"
            - "after the withdrawal: Ballot.${b1}.returned_count == 1"
            - "after the withdrawal: Ballot.${b1}.not_returned_count == 2 — the exact pre-cast value for that seat"
            - "after the withdrawal: Ballot.${b1}.eligible_voter_count == 3, unchanged throughout"
            - "after the withdrawal: affirmative_count + negative_count + abstain_count + not_returned_count == 3 == eligible_voter_count"
            - "Vote.${v3}.status == WITHDRAWN and Vote.${v3}.adjudication_status == NOT_APPLICABLE"
            - "Vote.${v1}.status == CAST"
            - "GET /sdo/comments?ballot_id=${b1} returns total_count == 1 — the BALLOT_NEGATIVE comment stays on file"
            - "that comment has status OPEN, source_vote_id == ${v3} and public_review_id == null, so it enters no PublicReview ledger"
            - "Ballot.${b1}.status == OPEN and Draft.${d1}.status == SUBCOMMITTEE_BALLOT"

      - name: reopening_a_disposed_public_review_comment_restores_the_ledger_exactly
        grounds:
          - calculations.comment_disposition_conservation
          - calculations.public_review_disposition_completeness
          - state_machines[Comment].ACCEPTED_to_OPEN
          - state_machines[PublicReview].CLOSED_to_DISPOSITION_DRAFTED
          - endpoints[POST /sdo/comments/{commentId}/disposition]
        distinguishing_aspect: |
          Conserved quantity: the COMMENT DISPOSITION LEDGER on a PublicReview —
          disposed_count + unresolved_comment_count == comment_count, with comment_count itself
          frozen at close and never touched by either direction. The forward action disposes the only
          comment (disposed 0 -> 1, unresolved 1 -> 0, completeness 0.0 -> 100.0) and bubbles the
          review CLOSED -> DISPOSITION_DRAFTED; the compensating REOPENED must reverse all four
          observables at once, including the bubble-up and the disposition_rationale, with comment_count
          still 1. A different quantity and a different compensation pair from the seat ledger.
        test_recipe:
          setup:
            - "Balanced ACTIVE committee TC-14 with 3 voting seats in 3 interest categories, chaired by the PRODUCER."
            - "Work item STD-1400 whose revision-1 draft passed a unanimous SUBCOMMITTEE ballot closed early at 2026-08-01, leaving it PUBLIC_REVIEW_READY."
            - "A public review OPEN over the closed inclusive window 2026-08-01 .. 2026-09-14."
            - "A fourth participant, unaffiliated with the committee, files exactly one TECHNICAL public-review comment while the review is OPEN."
            - "The clock then advances to 2026-09-15T00:00:00Z and the review is closed, freezing comment_count at 1 with disposed_count 0, unresolved_comment_count 1 and disposition_completeness_pct 0.0 — a review with an outstanding comment stays in CLOSED."
          setup_api_calls:
            - call: "POST /sdo/participants"
              payload: { full_name: "Ada Producer", organization: "Acme Steel", interest_category: "PRODUCER", employer_affiliation_code: "ACME" }
              as: StandardsStaff
              captures: { p1: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Ben User", organization: "City Water", interest_category: "USER", employer_affiliation_code: "CITYW" }
              as: StandardsStaff
              captures: { p2: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Cleo General", organization: "Safety League", interest_category: "GENERAL_INTEREST", employer_affiliation_code: "SAFEL" }
              as: StandardsStaff
              captures: { p3: $.data.id }
            - call: "POST /sdo/participants"
              payload: { full_name: "Zoe Outsider", organization: "Unaffiliated Consultancy", interest_category: "ACADEMIC", employer_affiliation_code: "ZOEC" }
              as: StandardsStaff
              captures: { p6: $.data.id }
            - call: "POST /sdo/committees"
              payload: { designation: "TC-14", scope_text: "Structural fasteners", chair_participant_id: "${p1}", max_concurrent_ballots: 2 }
              as: StandardsStaff
              captures: { c1: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p1}", voting_rights: true }
              as: StandardsStaff
              captures: { m1: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p2}", voting_rights: true }
              as: StandardsStaff
              captures: { m2: $.data.id }
            - call: "POST /sdo/committees/${c1}/memberships"
              payload: { participant_id: "${p3}", voting_rights: true }
              as: StandardsStaff
              captures: { m3: $.data.id }
            - call: "POST /sdo/committees/${c1}/activate"
              payload: {}
              as: StandardsStaff
            - call: "POST /sdo/work-items"
              payload: { title: "Fastener torque spec", scope_text: "Torque limits for structural fasteners", work_item_type: "NEW_STANDARD", proposer_participant_id: "${p1}", target_completion_date: "2027-06-30" }
              as: Proposer
              as_user_id: "${p1}"
              captures: { w1: $.data.id }
            - call: "POST /sdo/work-items/${w1}/approve-scope"
              payload: { decision: "APPROVE", sponsoring_committee_id: "${c1}", designation: "STD-1400" }
              as: StandardsStaff
            - call: "POST /sdo/work-items/${w1}/drafts"
              payload: { total_clause_count: 40, changed_clause_count: 0, summary: "Revision 1" }
              as: CommitteeChair
              as_user_id: "${p1}"
              captures: { d1: $.data.id }
            - call: "POST /sdo/ballots"
              payload: { draft_id: "${d1}", committee_id: "${c1}", ballot_kind: "SUBCOMMITTEE", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-15T00:00:00Z" }
              as: CommitteeChair
              as_user_id: "${p1}"
              captures: { b1: $.data.id }
            - call: "POST /sdo/ballots/${b1}/votes"
              payload: { membership_id: "${m1}", position: "AFFIRMATIVE" }
              as: CommitteeChair
              as_user_id: "${p1}"
              captures: { v1: $.data.id }
            - call: "POST /sdo/ballots/${b1}/votes"
              payload: { membership_id: "${m2}", position: "AFFIRMATIVE" }
              as: CommitteeMember
              as_user_id: "${p2}"
              captures: { v2: $.data.id }
            - call: "POST /sdo/ballots/${b1}/votes"
              payload: { membership_id: "${m3}", position: "AFFIRMATIVE" }
              as: CommitteeMember
              as_user_id: "${p3}"
              captures: { v3: $.data.id }
            - call: "POST /sdo/ballots/${b1}/close"
              payload: {}
              as: CommitteeChair
              as_user_id: "${p1}"
            - call: "GET /sdo/drafts/${d1}"
              payload: {}
              as: StandardsStaff
              captures: { d1_v: $.data.version }
            - call: "POST /sdo/public-reviews"
              payload: { draft_id: "${d1}", start_date: "2026-08-01", end_date: "2026-09-14", expected_draft_version: "${d1_v}" }
              as: StandardsStaff
              captures: { pr1: $.data.id }
            - call: "POST /sdo/comments"
              payload: { source_type: "PUBLIC_REVIEW", comment_type: "TECHNICAL", comment_text: "Clause 12 torque ceiling should cite the fatigue annex", submitter_participant_id: "${p6}", draft_id: "${d1}", public_review_id: "${pr1}", clause_reference: "12" }
              as: PublicCommenter
              as_user_id: "${p6}"
              captures: { cm1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: StandardsStaff
            - call: "POST /sdo/public-reviews/${pr1}/close"
              payload: {}
              as: StandardsStaff
            - call: "GET /sdo/public-reviews/${pr1}"
              payload: {}
              as: StandardsStaff
          trigger:
            - call: "POST /sdo/comments/${cm1}/disposition"
              payload: { disposition: "ACCEPTED", disposition_rationale: "Clause 12 will cite Annex C in revision 2" }
              as: CommitteeChair
              as_user_id: "${p1}"
            - call: "GET /sdo/public-reviews/${pr1}"
              payload: {}
              as: StandardsStaff
            - call: "POST /sdo/comments/${cm1}/disposition"
              payload: { disposition: "REOPENED" }
              as: CommitteeChair
              as_user_id: "${p1}"
            - call: "GET /sdo/public-reviews/${pr1}"
              payload: {}
              as: StandardsStaff
            - call: "GET /sdo/comments/${cm1}"
              payload: {}
              as: StandardsStaff
          assert:
            - "at close: PublicReview.${pr1}.status == CLOSED, comment_count == 1, disposed_count == 0, unresolved_comment_count == 1, disposition_completeness_pct == 0.0"
            - "after the ACCEPTED disposition: Comment.${cm1}.status == ACCEPTED and disposition_rationale == 'Clause 12 will cite Annex C in revision 2'"
            - "after the ACCEPTED disposition: PublicReview.${pr1}.disposed_count == 1, unresolved_comment_count == 0, disposition_completeness_pct == 100.0"
            - "after the ACCEPTED disposition: PublicReview.${pr1}.status == DISPOSITION_DRAFTED"
            - "after the ACCEPTED disposition: PublicReview.${pr1}.comment_count == 1 — the forward action never touches the total"
            - "after the REOPENED compensation: PublicReview.${pr1}.disposed_count == 0"
            - "after the REOPENED compensation: PublicReview.${pr1}.unresolved_comment_count == 1"
            - "after the REOPENED compensation: PublicReview.${pr1}.comment_count == 1"
            - "after the REOPENED compensation: PublicReview.${pr1}.disposition_completeness_pct == 0.0"
            - "after the REOPENED compensation: PublicReview.${pr1}.status == CLOSED — the bubble-up is reversed, not merely re-labelled"
            - "after the REOPENED compensation: PublicReview.${pr1}.disposition_approved_by_participant_id == null and disposition_approved_at == null"
            - "after the REOPENED compensation: Comment.${cm1}.status == OPEN and Comment.${cm1}.disposition_rationale == null"
            - "disposed_count + unresolved_comment_count == comment_count == 1 at every one of the three observation points"
            - "Draft.${d1}.status == PUBLIC_REVIEW_CLOSED throughout the trigger — the ledger churn never moves the draft"
