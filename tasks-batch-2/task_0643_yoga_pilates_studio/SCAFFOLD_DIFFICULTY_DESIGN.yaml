# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Yoga & Pilates Studio — Expert difficulty
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: fee_assessment_late_vs_no_show_on_member
        grounds:
          - calculations.fee_assessment
          - state_machines.Reservation.BOOKED_to_CANCELLED_LATE
          - state_machines.Reservation.BOOKED_to_NO_SHOW
        distinguishing_aspect: |
          The two fee variants run on the same Member/Reservation fee domain but diverge
          numerically: a LATE_CANCEL on an established member with 2 prior strikes yields 1875
          cents, while a NO_SHOW with 2 prior strikes yields 3125 cents — different base + tier math.
        test_recipe:
          setup:
            - "Clock at 2026-02-01T00:00:00Z. One REFORMER Room cap 4, one Teacher certified REFORMER."
            - "Two published OPEN sessions S1 (start 2026-02-02T10:00Z) and S2 (start 2026-02-03T10:00Z) in that room."
            - "Member M (established, is_new_student=false, no_show_strike_count=2 from prior settled no-shows) holds an ACTIVE unlimited MEMBERSHIP."
            - "M has a BOOKED reservation R1 on S1 and a BOOKED reservation R2 on S2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /rooms"
              payload: { name: "Reformer A", room_type: "REFORMER", station_capacity: 4 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "Tara", certifications: ["REFORMER"] }
              as: StudioManager
              captures: { teacher_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m@x.com", full_name: "Mae", home_studio_state: "CA" }
              as: StudioManager
              captures: { m_id: $.data.id }
            - call: "POST /entitlements"
              payload: { member_id: "${m_id}", kind: "MEMBERSHIP", price_cents: 12000, credits_total: -1, cycle_start_utc: "2026-02-01T00:00:00Z", auto_renew: false }
              as: StudioManager
              captures: { ent_id: $.data.id }
            - call: "POST /entitlements/${ent_id}/activate"
              payload: {}
              as: StudioManager
            # Drive M's no_show_strike_count to 2 via two completed sessions where M is a no-show.
            - call: "POST /class-sessions"
              payload: { room_id: "${room_id}", teacher_id: "${teacher_id}", discipline: "REFORMER", start_utc: "2026-02-01T06:00:00Z", end_utc: "2026-02-01T07:00:00Z", published_capacity: 4 }
              as: StudioManager
              captures: { sp1_id: $.data.id, sp1_v: $.data.version }
            - call: "POST /class-sessions/${sp1_id}/publish"
              payload: {}
              as: StudioManager
              captures: { sp1_v2: $.data.version }
            - call: "POST /reservations"
              payload: { member_id: "${m_id}", class_session_id: "${sp1_id}", entitlement_id: "${ent_id}", expected_class_session_version: "${sp1_v2}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /class-sessions/${sp1_id}/start"
              payload: {}
              as: StudioManager
            - call: "POST /class-sessions/${sp1_id}/complete"
              payload: {}
              as: StudioManager
            - call: "POST /class-sessions"
              payload: { room_id: "${room_id}", teacher_id: "${teacher_id}", discipline: "REFORMER", start_utc: "2026-02-01T08:00:00Z", end_utc: "2026-02-01T09:00:00Z", published_capacity: 4 }
              as: StudioManager
              captures: { sp2_id: $.data.id }
            - call: "POST /class-sessions/${sp2_id}/publish"
              payload: {}
              as: StudioManager
              captures: { sp2_v2: $.data.version }
            - call: "POST /reservations"
              payload: { member_id: "${m_id}", class_session_id: "${sp2_id}", entitlement_id: "${ent_id}", expected_class_session_version: "${sp2_v2}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /class-sessions/${sp2_id}/start"
              payload: {}
              as: StudioManager
            - call: "POST /class-sessions/${sp2_id}/complete"
              payload: {}
              as: StudioManager
            # Now build S1 and S2 for the actual test.
            - call: "POST /class-sessions"
              payload: { room_id: "${room_id}", teacher_id: "${teacher_id}", discipline: "REFORMER", start_utc: "2026-02-02T10:00:00Z", end_utc: "2026-02-02T11:00:00Z", published_capacity: 4 }
              as: StudioManager
              captures: { s1_id: $.data.id }
            - call: "POST /class-sessions/${s1_id}/publish"
              payload: {}
              as: StudioManager
              captures: { s1_v: $.data.version }
            - call: "POST /reservations"
              payload: { member_id: "${m_id}", class_session_id: "${s1_id}", entitlement_id: "${ent_id}", expected_class_session_version: "${s1_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { room_id: "${room_id}", teacher_id: "${teacher_id}", discipline: "REFORMER", start_utc: "2026-02-03T10:00:00Z", end_utc: "2026-02-03T11:00:00Z", published_capacity: 4 }
              as: StudioManager
              captures: { s2_id: $.data.id }
            - call: "POST /class-sessions/${s2_id}/publish"
              payload: {}
              as: StudioManager
              captures: { s2_v: $.data.version }
            - call: "POST /reservations"
              payload: { member_id: "${m_id}", class_session_id: "${s2_id}", entitlement_id: "${ent_id}", expected_class_session_version: "${s2_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r2_id: $.data.id }
          trigger:
            # LATE cancel R1: clock moved to inside the 12h window of S1 start.
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: StudioManager
            - call: "POST /reservations/${r1_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { r1_status: $.data.status }
            # NO_SHOW R2: start then complete S2 with R2 still BOOKED.
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-03T10:00:00Z" }
              as: StudioManager
            - call: "POST /class-sessions/${s2_id}/start"
              payload: {}
              as: StudioManager
            - call: "POST /class-sessions/${s2_id}/complete"
              payload: {}
              as: StudioManager
          assert:
            - "Reservation.${r1_id}.status == CANCELLED_LATE"
            - "Reservation.${r2_id}.status == NO_SHOW"
            - "the LATE_CANCEL FeeCharge for ${r1_id} has amount_cents == 1875"
            - "the NO_SHOW FeeCharge for ${r2_id} has amount_cents == 3125"

      - name: entitlement_refund_provisional_vs_final_cash
        grounds:
          - calculations.entitlement_refund_value
          - state_machines.Reservation.BOOKED_to_CANCELLED_EARLY
          - state_machines.ClassSession.OPEN_to_CANCELLED
        distinguishing_aspect: |
          On the Entitlement domain (a different domain from fee_assessment), member early-cancel
          refunds exactly 1 credit (credits_used decrements by 1), whereas a studio session cancel
          refunds the pro-rated cash value 1200 cents per affected reservation — same reservation,
          two divergent valuations.
        test_recipe:
          setup:
            - "Clock 2026-02-01T00:00:00Z. REFORMER Room cap 4, Teacher REFORMER."
            - "Member M with an ACTIVE CLASS_PACK: price 12000 cents, credits_total 10, credits_used 2 (after two bookings)."
            - "Two published OPEN sessions S1 (2026-02-10T10:00Z) and S2 (2026-02-11T10:00Z); M booked R1 on S1 and R2 on S2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /rooms"
              payload: { name: "Reformer A", room_type: "REFORMER", station_capacity: 4 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "Tara", certifications: ["REFORMER"] }
              as: StudioManager
              captures: { teacher_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m2@x.com", full_name: "Mo", home_studio_state: "CA" }
              as: StudioManager
              captures: { m_id: $.data.id }
            - call: "POST /entitlements"
              payload: { member_id: "${m_id}", kind: "CLASS_PACK", price_cents: 12000, credits_total: 10, cycle_start_utc: "2026-02-01T00:00:00Z" }
              as: StudioManager
              captures: { ent_id: $.data.id }
            - call: "POST /entitlements/${ent_id}/activate"
              payload: {}
              as: StudioManager
            - call: "POST /class-sessions"
              payload: { room_id: "${room_id}", teacher_id: "${teacher_id}", discipline: "REFORMER", start_utc: "2026-02-10T10:00:00Z", end_utc: "2026-02-10T11:00:00Z", published_capacity: 4 }
              as: StudioManager
              captures: { s1_id: $.data.id }
            - call: "POST /class-sessions/${s1_id}/publish"
              payload: {}
              as: StudioManager
              captures: { s1_v: $.data.version }
            - call: "POST /reservations"
              payload: { member_id: "${m_id}", class_session_id: "${s1_id}", entitlement_id: "${ent_id}", expected_class_session_version: "${s1_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { room_id: "${room_id}", teacher_id: "${teacher_id}", discipline: "REFORMER", start_utc: "2026-02-11T10:00:00Z", end_utc: "2026-02-11T11:00:00Z", published_capacity: 4 }
              as: StudioManager
              captures: { s2_id: $.data.id }
            - call: "POST /class-sessions/${s2_id}/publish"
              payload: {}
              as: StudioManager
              captures: { s2_v: $.data.version }
            - call: "POST /reservations"
              payload: { member_id: "${m_id}", class_session_id: "${s2_id}", entitlement_id: "${ent_id}", expected_class_session_version: "${s2_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r2_id: $.data.id }
          trigger:
            # Provisional: member early-cancels R1 well before S1 (clock still 2026-02-01).
            - call: "POST /reservations/${r1_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { r1_status: $.data.status }
            # Final cash: studio cancels S2 (cascade refund cash value for R2).
            - call: "POST /class-sessions/${s2_id}/cancel"
              payload: {}
              as: StudioManager
          assert:
            - "Reservation.${r1_id}.status == CANCELLED_EARLY"
            - "after the early-cancel of R1, Entitlement.${ent_id}.credits_used == 1 (decremented by exactly 1 credit)"
            - "Reservation.${r2_id}.status == CANCELLED_EARLY"
            - "the studio cancel of S2 refunds final cash value 1200 cents for R2 (round_half_up(12000/10))"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: renewal_proration_round_per_segment_then_sum
        grounds:
          - calculations.membership_renewal_proration
          - state_machines.Entitlement.ACTIVE_to_ACTIVE
        distinguishing_aspect: |
          Mode (b) nested-rounding-order: a renewal straddling a mid-cycle price change is charged
          round-per-segment-then-sum = 1983 + 7283 = 9266 cents; the forbidden sum-then-round order
          would give 9267. The scaffold pins per-segment rounding.
        test_recipe:
          setup:
            - "Clock 2026-02-28T23:00:00Z. Member M with an ACTIVE auto_renew MEMBERSHIP, cycle_start 2026-02-01, cycle_end 2026-03-03 (30 days)."
            - "A mid-cycle monthly-rate change in the renewing cycle: 8500/mo for first 7 days, 9500/mo for remaining 23 days."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /members"
              payload: { email: "ren@x.com", full_name: "Rena", home_studio_state: "CA" }
              as: StudioManager
              captures: { m_id: $.data.id }
            - call: "POST /entitlements"
              payload: { member_id: "${m_id}", kind: "MEMBERSHIP", price_cents: 8500, credits_total: -1, cycle_start_utc: "2026-02-01T00:00:00Z", auto_renew: true, rollover_cap: 0 }
              as: StudioManager
              captures: { ent_id: $.data.id, ent_v: $.data.version }
            - call: "POST /entitlements/${ent_id}/activate"
              payload: {}
              as: StudioManager
          trigger:
            # Move clock past cycle_end and run ops to fire the auto-renew proration.
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-03T01:00:00Z" }
              as: StudioManager
            - call: "POST /_ops/run"
              payload: {}
              as: StudioManager
          assert:
            - "Entitlement.${ent_id}.lifecycle_status == ACTIVE (renewed, not expired)"
            - "the renewal charge for the split-segment cycle equals 9266 cents (1983 + 7283), NOT 9267"

      - name: bookable_capacity_nested_min_max
        grounds:
          - calculations.bookable_capacity_resolution
          - entities.ClassSession.fields.published_capacity
          - entities.Room.fields.station_capacity
        distinguishing_aspect: |
          Mode (a) >=3-input nested min/max with a conditional branch on session.status:
          effective_capacity = min(published_capacity=4, room.station_capacity downgraded to 2);
          open_seats = max(0, 2 - booked_count). With 2 already booked, a third booking is clamped
          to WAITLISTED even though published_capacity advertises 4.
        test_recipe:
          setup:
            - "Clock 2026-02-01. REFORMER Room cap 4, Teacher REFORMER. Session S published_capacity 4, waitlist_capacity 5."
            - "Two members M1,M2 each with ACTIVE unlimited MEMBERSHIP have BOOKED reservations on S (booked_count=2)."
            - "Room downgraded to station_capacity 2 via PATCH; effective_capacity now clamps to 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /rooms"
              payload: { name: "Reformer A", room_type: "REFORMER", station_capacity: 4 }
              as: StudioManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /teachers"
              payload: { full_name: "Tara", certifications: ["REFORMER"] }
              as: StudioManager
              captures: { teacher_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M1", home_studio_state: "CA" }
              as: StudioManager
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m2@x.com", full_name: "M2", home_studio_state: "CA" }
              as: StudioManager
              captures: { m2_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m3@x.com", full_name: "M3", home_studio_state: "CA" }
              as: StudioManager
              captures: { m3_id: $.data.id }
            - call: "POST /entitlements"
              payload: { member_id: "${m1_id}", kind: "MEMBERSHIP", price_cents: 10000, credits_total: -1, cycle_start_utc: "2026-02-01T00:00:00Z" }
              as: StudioManager
              captures: { e1_id: $.data.id }
            - call: "POST /entitlements/${e1_id}/activate"
              payload: {}
              as: StudioManager
            - call: "POST /entitlements"
              payload: { member_id: "${m2_id}", kind: "MEMBERSHIP", price_cents: 10000, credits_total: -1, cycle_start_utc: "2026-02-01T00:00:00Z" }
              as: StudioManager
              captures: { e2_id: $.data.id }
            - call: "POST /entitlements/${e2_id}/activate"
              payload: {}
              as: StudioManager
            - call: "POST /entitlements"
              payload: { member_id: "${m3_id}", kind: "MEMBERSHIP", price_cents: 10000, credits_total: -1, cycle_start_utc: "2026-02-01T00:00:00Z" }
              as: StudioManager
              captures: { e3_id: $.data.id }
            - call: "POST /entitlements/${e3_id}/activate"
              payload: {}
              as: StudioManager
            - call: "POST /class-sessions"
              payload: { room_id: "${room_id}", teacher_id: "${teacher_id}", discipline: "REFORMER", start_utc: "2026-02-15T10:00:00Z", end_utc: "2026-02-15T11:00:00Z", published_capacity: 4, waitlist_capacity: 5 }
              as: StudioManager
              captures: { s_id: $.data.id }
            - call: "POST /class-sessions/${s_id}/publish"
              payload: {}
              as: StudioManager
              captures: { s_v0: $.data.version }
            - call: "POST /reservations"
              payload: { member_id: "${m1_id}", class_session_id: "${s_id}", entitlement_id: "${e1_id}", expected_class_session_version: "${s_v0}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { s_v1: $.data.id }
            - call: "GET /class-sessions/${s_id}"
              payload: {}
              as: StudioManager
              captures: { s_vA: $.data.version }
            - call: "POST /reservations"
              payload: { member_id: "${m2_id}", class_session_id: "${s_id}", entitlement_id: "${e2_id}", expected_class_session_version: "${s_vA}" }
              as: Member
              as_user_id: "${m2_id}"
            - call: "PATCH /rooms/${room_id}"
              payload: { station_capacity: 2, expected_room_version: "${room_v}" }
              as: StudioManager
          trigger:
            # Third booking: effective_capacity=min(4,2)=2, booked_count=2 -> open_seats=0 -> WAITLISTED.
            - call: "GET /class-sessions/${s_id}"
              payload: {}
              as: StudioManager
              captures: { s_vB: $.data.version }
            - call: "POST /reservations"
              payload: { member_id: "${m3_id}", class_session_id: "${s_id}", entitlement_id: "${e3_id}", expected_class_session_version: "${s_vB}" }
              as: Member
              as_user_id: "${m3_id}"
              captures: { r3_id: $.data.id, r3_status: $.data.status }
          assert:
            - "Reservation.${r3_id}.status == WAITLISTED (clamped by room downgrade, not BOOKED)"
            - "Reservation.${r3_id}.waitlist_position == 1"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: reservation_waitlist_cycle_booked_waitlisted_booked
        grounds:
          - state_machines.Reservation.BOOKED_to_WAITLISTED
          - state_machines.Reservation.WAITLISTED_to_BOOKED
        distinguishing_aspect: |
          The Reservation entity has a cycle: a BOOKED holder is demoted to WAITLISTED on a room
          downgrade, then auto-promoted back to BOOKED when a seat frees — the same row visits
          BOOKED -> WAITLISTED -> BOOKED.
        test_recipe:
          setup:
            - "Clock 2026-02-01. REFORMER Room cap 2, Teacher REFORMER. Session S published_capacity 2."
            - "M1 (BOOKED r1, earliest) and M2 (BOOKED r2, latest) on S; each has ACTIVE unlimited MEMBERSHIP."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /rooms"
              payload: { name: "Reformer A", room_type: "REFORMER", station_capacity: 2 }
              as: StudioManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /teachers"
              payload: { full_name: "Tara", certifications: ["REFORMER"] }
              as: StudioManager
              captures: { teacher_id: $.data.id }
            - call: "POST /members"
              payload: { email: "c1@x.com", full_name: "C1", home_studio_state: "CA" }
              as: StudioManager
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { email: "c2@x.com", full_name: "C2", home_studio_state: "CA" }
              as: StudioManager
              captures: { m2_id: $.data.id }
            - call: "POST /entitlements"
              payload: { member_id: "${m1_id}", kind: "MEMBERSHIP", price_cents: 10000, credits_total: -1, cycle_start_utc: "2026-02-01T00:00:00Z" }
              as: StudioManager
              captures: { e1_id: $.data.id }
            - call: "POST /entitlements/${e1_id}/activate"
              payload: {}
              as: StudioManager
            - call: "POST /entitlements"
              payload: { member_id: "${m2_id}", kind: "MEMBERSHIP", price_cents: 10000, credits_total: -1, cycle_start_utc: "2026-02-01T00:00:00Z" }
              as: StudioManager
              captures: { e2_id: $.data.id }
            - call: "POST /entitlements/${e2_id}/activate"
              payload: {}
              as: StudioManager
            - call: "POST /class-sessions"
              payload: { room_id: "${room_id}", teacher_id: "${teacher_id}", discipline: "REFORMER", start_utc: "2026-02-20T10:00:00Z", end_utc: "2026-02-20T11:00:00Z", published_capacity: 2 }
              as: StudioManager
              captures: { s_id: $.data.id }
            - call: "POST /class-sessions/${s_id}/publish"
              payload: {}
              as: StudioManager
              captures: { s_v0: $.data.version }
            - call: "POST /reservations"
              payload: { member_id: "${m1_id}", class_session_id: "${s_id}", entitlement_id: "${e1_id}", expected_class_session_version: "${s_v0}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { r1_id: $.data.id }
            - call: "GET /class-sessions/${s_id}"
              payload: {}
              as: StudioManager
              captures: { s_vA: $.data.version }
            - call: "POST /reservations"
              payload: { member_id: "${m2_id}", class_session_id: "${s_id}", entitlement_id: "${e2_id}", expected_class_session_version: "${s_vA}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { r2_id: $.data.id }
            # Downgrade room to cap 1 -> demote latest holder r2 (m2) BOOKED->WAITLISTED.
            - call: "PATCH /rooms/${room_id}"
              payload: { station_capacity: 1, expected_room_version: "${room_v}" }
              as: StudioManager
              captures: { room_v2: $.data.version }
          trigger:
            # r1 cancels (early) -> seat frees -> r2 auto-promotes WAITLISTED->BOOKED, closing the cycle.
            - call: "POST /reservations/${r1_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
            - call: "GET /reservations/${r2_id}"
              payload: {}
              as: StudioManager
              captures: { r2_final: $.data.status }
          assert:
            - "Reservation.${r2_id} visited WAITLISTED after the room downgrade, then BOOKED after r1's cancel"
            - "Reservation.${r2_id}.status == BOOKED"
            - "Reservation.${r2_id}.waitlist_position == null"

      - name: entitlement_parallel_lifecycle_x_freeze_dimensions
        grounds:
          - state_machines.Entitlement.ACTIVE_to_ACTIVE
          - entities.Entitlement.fields.lifecycle_status
          - entities.Entitlement.fields.freeze_status
        distinguishing_aspect: |
          The Entitlement entity (different from Reservation) carries two independent state
          dimensions: freeze_status flips UNFROZEN->FROZEN->UNFROZEN via freeze/thaw while
          lifecycle_status stays ACTIVE throughout — parallel axes on one row.
