      - name: presale_percentage_is_inclusive_at_the_threshold
        claim_type: threshold
        grounds:
          - calculations.presale_threshold_evaluation
          - entities.ClosingBatch.fields.presale_pct
          - entities.ClosingBatch.fields.min_presale_threshold_pct
        excluded_because:
          difficulty_instance: presale_pct_inclusive_at_exact_threshold_equality
          rationale: "The §1.8 instance sits the batch exactly on min_presale_threshold_pct and shows the
            >= comparison admitting equality while one fewer qualifying agreement refuses, which is the
            whole threshold-boundary claim."
      - name: notice_tier_and_relocation_cap_uplift_floor_order
        claim_type: tiered_pricing
        grounds:
          - calculations.tenant_notice_and_relocation
          - calculations.tenant_notice_and_relocation.variants.PROTECTED_TIER
          - entities.TenantHousehold.fields.protected_class
        excluded_because:
          difficulty_instance: tenant_notice_tier_branch_cap_uplift_cap_floor
          rationale: "The §1.8 instance walks all three tenancy tiers and the pinned cap -> uplift ->
            cap -> floor order for every protected_class, so re-deriving a tier row here adds nothing."
      - name: suitability_variants_diverge_on_remediation_gain
        claim_type: weighted_scoring
        grounds:
          - calculations.building_suitability_score.variants.AS_INSPECTED
          - calculations.building_suitability_score.variants.POST_REMEDIATION
          - entities.MajorComponent.fields.planned_remediation_gain_years
        excluded_because:
          difficulty_instance: suitability_score_as_inspected_vs_post_remediation
          rationale: "The §1.8 instance scores the identical component set under both variants, including
            the penalty floor and the cap escaping on the remediated RUL, which is the weighted-scoring
            divergence claim in full."
      - name: management_fee_tier_read_off_base_expense_only
        claim_type: constraint_propagation
        grounds:
          - calculations.initial_budget_developer_deficit
          - calculations.initial_budget_developer_deficit.variants.SINGLE_PASS_BASE_TIERED
          - entities.InitialBudget.fields.management_fee_bp
        excluded_because:
          difficulty_instance: budget_single_pass_fee_tier_no_retier_on_total
          rationale: "The §1.8 instance parks base_expense_cents just under MGMT_TIER_1_CEILING_CENTS so
            the total crosses the ceiling the base did not, proving the single-pass no-re-tiering
            contract."
      - name: warrantability_ratios_diverge_between_contract_and_closed_basis
        claim_type: variant_divergence
        grounds:
          - calculations.warrantability_ratios.variants.CONTRACT_BASIS
          - calculations.warrantability_ratios.variants.CLOSED_BASIS
          - entities.ConversionProject.fields.warrantability_verdict
          - entities.ConversionProject.fields.warrantability_verdict_closed_basis
        excluded_because:
          difficulty_instance: warrantability_contract_basis_vs_closed_basis
          rationale: "The §1.8 instance builds one agreement book that yields opposite verdicts on the two
            bases and asserts both percentage quadruples, covering the divergence and the population
            filter behind it."
  - section: validations
    instances:
      - name: pagination_limit_below_minimum_returns_invalid_pagination
        claim_type: violation_to_error
        grounds:
          - validations[priority 15]
          - errors[ERR_INVALID_PAGINATION]
          - response_envelope.pagination_defaults
          - endpoints[GET /conversion-projects]
        distinguishing_aspect: "Both declared bounds are exclusive of the rejected values and inclusive of
          the accepted ones: limit has minimum 1, so limit=0 is a 422 and NOT a silent clamp to the
          default of 10 or an empty page, and it has maximum 100, so limit=101 is a 422 while limit=100
          is accepted and echoed verbatim. A negative offset is rejected on the same row. Each rejection
          must happen before any row is read, and the collection must be unchanged and still readable at
          the defaults afterwards."
        test_recipe:
          setup:
            - "Exactly one ConversionProject exists."
          setup_api_calls:
            - call: "POST /conversion-projects"
              payload: { building_address: "44 Cove Lane, Bangor ME", year_built: 1968, total_unit_count: 2, sponsor_user_id: "sponsor-1" }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { proj_id: "$.data.id" }
          trigger:
            - call: "GET /conversion-projects"
              payload: { limit: 0 }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { err_id: "$.data.error_id" }
            - call: "GET /conversion-projects"
              payload: { limit: 101 }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { err_max: "$.data.error_id" }
            - call: "GET /conversion-projects"
              payload: { offset: -1 }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { err_offset: "$.data.error_id" }
            - call: "GET /conversion-projects"
              payload: { limit: 100, offset: 0 }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
          assert:
            - "after first trigger: http status == 422"
            - "after first trigger: ${err_id} == \"ERR_INVALID_PAGINATION\""
            - "after second trigger: http status == 422"
            - "after second trigger: ${err_max} == \"ERR_INVALID_PAGINATION\""
            - "after third trigger: http status == 422"
            - "after third trigger: ${err_offset} == \"ERR_INVALID_PAGINATION\""
            - "after fourth trigger: http status == 200"
            - "after fourth trigger: that response has limit == 100, offset == 0, total_count == 1 and has_more == false"
            - "GET /conversion-projects with no pagination params returns http status == 200"
            - "that response has limit == 10, offset == 0, total_count == 1 and has_more == false"
            - "that response data is an array whose single element has id \"${proj_id}\""
      - name: duplicate_report_label_within_project_returns_duplicate_key
        claim_type: violation_to_error
        grounds:
          - validations[priority 16]
          - errors[ERR_DUPLICATE_KEY]
          - entities.EngineeringReport.fields.report_label
          - endpoints[POST /conversion-projects/{id}/engineering-reports]
        distinguishing_aspect: "The uniqueness key is the PAIR (conversion_project_id, report_label), so
          ER-1 is rejected on the same project but must be accepted on a second project. A server keying
          on report_label globally would refuse the second project's ER-1."
        test_recipe:
          setup:
            - "Project A owns one DRAFT EngineeringReport labelled ER-1; project B owns none."
          setup_api_calls:
            - call: "POST /conversion-projects"
              payload: { building_address: "44 Cove Lane, Bangor ME", year_built: 1968, total_unit_count: 2, sponsor_user_id: "sponsor-1" }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { proj_a: "$.data.id" }
            - call: "POST /conversion-projects/${proj_a}/engineering-reports"
              payload: { report_label: "ER-1", inspection_date: "2026-07-10T00:00:00Z", submitted_by_user_id: "eng-1" }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { er_a1: "$.data.id" }
            - call: "POST /conversion-projects"
              payload: { building_address: "46 Cove Lane, Bangor ME", year_built: 1968, total_unit_count: 2, sponsor_user_id: "sponsor-1" }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { proj_b: "$.data.id" }
          trigger:
            - call: "POST /conversion-projects/${proj_a}/engineering-reports"
              payload: { report_label: "ER-1", inspection_date: "2026-07-11T00:00:00Z", submitted_by_user_id: "eng-2" }
              as: LicensedEngineer
              as_user_id: "eng-2"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /conversion-projects/${proj_b}/engineering-reports"
              payload: { report_label: "ER-1", inspection_date: "2026-07-11T00:00:00Z", submitted_by_user_id: "eng-2" }
              as: LicensedEngineer
              as_user_id: "eng-2"
              captures: { er_b1: "$.data.id" }
          assert:
            - "after first trigger: http status == 409"
            - "after first trigger: ${err_id} == \"ERR_DUPLICATE_KEY\""
            - "after first trigger: GET /conversion-projects/${proj_a}/engineering-reports returns total_count == 1"
            - "after second trigger: http status == 201"
            - "after second trigger: EngineeringReport.${er_b1}.report_label == \"ER-1\""
            - "after second trigger: EngineeringReport.${er_b1}.conversion_project_id == \"${proj_b}\""
            - "EngineeringReport.${er_a1}.status == DRAFT"
      - name: withdrawing_the_last_included_unit_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority 44]
          - errors[ERR_LAST_INCLUDED_UNIT]
          - endpoints[POST /units/{id}/withdraw]
          - entities.Unit.fields.declaration_status
          - entities.ConversionProject.fields.included_unit_count
        distinguishing_aspect: "The guard counts the INCLUDED set AFTER the hypothetical withdrawal, so
          the second-to-last withdrawal succeeds and only the one that would empty the package is
          refused. A server counting BEFORE the withdrawal would wrongly allow the last one."
        test_recipe:
          setup:
            - "One DeclarationPackage in DRAFT with two INCLUDED units at 5000 base bp each."
          setup_api_calls:
