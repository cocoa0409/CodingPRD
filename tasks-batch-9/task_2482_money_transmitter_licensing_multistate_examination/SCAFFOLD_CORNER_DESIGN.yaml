            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100001", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
