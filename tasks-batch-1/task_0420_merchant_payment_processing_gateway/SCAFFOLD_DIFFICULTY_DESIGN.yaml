  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: funding_window_closed_lower_bound_on_batch
        grounds:
          - validations[priority=14]
          - state_machines.SettlementBatch.SETTLED_to_FUNDED
          - entities.Merchant.fields.funding_delay_days
        distinguishing_aspect: "Funding window on SettlementBatch uses a CLOSED lower bound: fund allowed when clock date >= business_date + funding_delay_days (T+2). At business_date+1 the window has not opened (ERR_FUNDING_DATE_NOT_REACHED); at business_date+2 funding succeeds — boundary inclusivity on the FUTURE side of the interval."
        test_recipe:
          setup:
            - "MEDIUM merchant (T+2), batch settled with business_date 2026-01-01; clock at 2026-01-02 (one day early)."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30, chargeback_fee_cents: 1500 }
              as: PlatformOperator
              captures: { flat_plan_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /merchants"
              payload: { legal_name: "Flat Co", mcc: "5812", fee_plan_id: "${flat_plan_id}", requested_monthly_volume_cents: 100000 }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /merchants/${m_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_id: "$.data[0].id" }
            - call: "POST /merchants/${m_id}/risk-reviews/${rr_id}/approve"
              payload: { assigned_risk_band: "MEDIUM" }
              as: UnderwritingOfficer
              captures: { m_v: $.data.version }
            - call: "POST /merchants/${m_id}/charges"
              payload: { auth_amount_cents: 10000, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { ch_id: $.data.id }
            - call: "POST /charges/${ch_id}/capture"
              payload: { amount_cents: 10000 }
              as: MerchantUser
              as_user_id: "${m_id}"
            - call: "POST /merchants/${m_id}/settlement-batches"
              payload: { business_date: "2026-01-01" }
              as: PlatformOperator
              captures: { batch_id: $.data.id }
            - call: "POST /settlement-batches/${batch_id}/settle"
              payload: { expected_merchant_version: "${m_v}" }
              as: PlatformOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "POST /settlement-batches/${batch_id}/fund"
              payload: {}
              as: PlatformOperator
              captures: { err_id: $.data.error_id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /settlement-batches/${batch_id}/fund"
              payload: {}
              as: PlatformOperator
              captures: { status_after: $.data.batch_status }
          assert:
            - "fund at 2026-01-02 (T+1, window closed) rejected with ERR_FUNDING_DATE_NOT_REACHED"
            - "fund at 2026-01-03 (T+2, boundary inclusive) succeeds: SettlementBatch.${batch_id}.batch_status == FUNDED"

      - name: evidence_window_closed_upper_bound_on_dispute
        grounds:
          - validations[priority=9]
          - state_machines.Dispute.UNDER_REVIEW_to_REPRESENTED
          - entities.Dispute.fields.evidence_due_at
        distinguishing_aspect: "Evidence window on Dispute uses a CLOSED upper bound (opposite interval semantics from the funding window's lower bound, on a different resource): represent allowed when clock <= evidence_due_at; one day past evidence_due_at the window is closed and represent fails with ERR_EVIDENCE_WINDOW_CLOSED."
        test_recipe:
          setup:
            - "Dispute opened at 2026-01-01 (evidence_due_at = 2026-01-15, +14d), acknowledged; clock advanced to 2026-01-16 (past the window)."
          setup_api_calls:
            - call: "POST /fee-plans"
