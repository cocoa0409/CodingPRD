            - "${x2} == ERR_CROSS_PROJECT_REFERENCE with HTTP 409, decided before the version token at priority 25 is even compared"
            - "${x3} == ERR_CROSS_PROJECT_REFERENCE with HTTP 409 and NOT ERR_ARTIFACT_NOT_IN_CASE 409 - priority 22 outranks priority 61, so the misfiling is reported before the membership test"
            - "the control placement succeeds with HTTP 201, ${okpst} == RESERVED, ${okcase} == ${case1} and ${cvnow} == 2 - the same edge is legal inside one project"
            - "${brows} has exactly 1 row with ${bacc} == 2020.77.1 - project A's artifact never appears under project B"
            - "${bzrows} has exactly 1 row with ${bzcode} == Z-B"
            - "no failed cross-project attempt mutated anything: project A's case still reports placed_artifact_count 1 from the control placement only, and ${artb} still reports placement_status UNPLACED with assigned_case_id null"

  - section: state_machines
    instances:
      - name: all_eight_pre_fabrication_machines_start_in_their_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.ExhibitProject.phase
          - state_machines.DesignPackage.status
          - state_machines.ReviewRound.status
          - state_machines.ArtifactCase.status
          - state_machines.ArtifactCase.mount_status
          - state_machines.Artifact.placement_status
          - state_machines.MaterialSpec.status
          - state_machines.Interactive.status
          - calculations.project_readiness_posture
        distinguishing_aspect: |
          Eight of the eleven machines are reachable before FABRICATION, and one row
          (ArtifactCase) carries two of them at once. The claim is that every fresh
          row sits at its §1.2 initial_state with all of its outcome fields null and
          all of its counters at zero - notably that a brand-new case is DRAFT and
          NOT_STARTED simultaneously, and that GalleryZone.occupancy_state starts at
          OPERATING rather than at a value derived from the (currently empty) window
          set. The instance also pins the one side effect that creation alone
          triggers: a MaterialSpec born in SUBMITTED lifts pending_material_count to
          1, which flips the project's derived posture from OPEN to RESTRICTED
          without anybody rejecting anything.
        test_recipe:
          setup:
            - "empty database, logical clock at the 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
          trigger:
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id, ph0: $.data.phase, post0: $.data.posture }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
