              as: Recorder
              as_user_id: "rec-01"
            - call: "POST /screening-visits/${s1}/sub-records"
              payload: { record_type: "VIRAL_MARKER", payload: { hiv_ag_ab: "NON_REACTIVE", hbv_surface_ag: "NON_REACTIVE", hcv_ab: "NON_REACTIVE" } }
              as: Recorder
              as_user_id: "rec-01"
            - call: "POST /screening-visits/${s1}/clear"
              payload: {}
              as: MedicalScreener
              as_user_id: "ms-01"
