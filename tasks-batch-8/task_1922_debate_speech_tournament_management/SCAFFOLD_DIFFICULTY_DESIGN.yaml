            - { call: "POST /ballots", payload: { pairing_id: "${u2}", winner_entry_id: "${u2w}", speaker_points: { "${u2w}": 29, "${u2l}": 23 } }, as: Judge, as_user_id: "${j_e2}", captures: { bu2: $.data.id } }
