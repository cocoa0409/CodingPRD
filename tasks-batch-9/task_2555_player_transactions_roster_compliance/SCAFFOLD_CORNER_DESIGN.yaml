      - name: executing_a_trade_after_its_medical_review_deadline_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=28]
          - errors[ERR_MEDICAL_WINDOW_EXPIRED]
          - state_machines.Trade.MEDICAL_REVIEW_to_EXECUTED
          - entities.Trade.fields.medical_review_deadline_at
        distinguishing_aspect: "A PHYSICAL_CONTINGENT trade in MEDICAL_REVIEW with its trade physical already PASSED and unexpired is still refused one second past medical_review_deadline_at 2026-08-13T14:00:00Z, and because no sweep has run the trade is still MEDICAL_REVIEW rather than VOIDED."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "Two clubs, Harbor Kings (rank 1, initiator) and Basin Otters (rank 2, counterparty), both cap 500000000."
            - "Ray Alder is on an APPROVED 3-year Harbor Kings deal, Contract ACTIVE at 83333333; his entry physical occupied [2026-08-10T13:00:00Z, 2026-08-10T14:30:00Z)."
            - "Harbor Kings proposed a PHYSICAL_CONTINGENT trade sending that contract, Basin Otters accepted at 2026-08-10T14:00:00Z, so the trade is MEDICAL_REVIEW with medical_review_deadline_at == accepted_at + MEDICAL_REVIEW_WINDOW_HOURS 72 == 2026-08-13T14:00:00Z."
            - "At 2026-08-10T15:00:00Z Basin Otters recorded the TRADE_PHYSICAL PASSED over the non-overlapping window [2026-08-10T14:30:00Z, 2026-08-10T20:00:00Z), so it expires 2026-08-24T15:00:00Z."
            - "The clock is then advanced to 2026-08-13T14:00:01Z, still inside the daily processing window, and no sweep is run."
