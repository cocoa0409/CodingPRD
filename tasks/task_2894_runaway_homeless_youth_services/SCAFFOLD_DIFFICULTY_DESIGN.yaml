          assert:
            - "Admission.${post_ava_adm_id}.status == ACTIVE"
            - "Admission.${post_ava_adm_id}.capacity_blocked == false"
            - "ShelterProgram.${post_program_id}.posture == FROZEN"
            - "Bo's admission returns HTTP 201"
            - "Admission.${post_bo_adm_id}.status == WAITLISTED"
            - "Admission.${post_bo_adm_id}.capacity_blocked == true"
            - "Admission.${post_bo_adm_id}.admitted_at == null"
            - "Admission.${post_bo_adm_id}.projected_billable_nights == null"
            - "Admission.${post_bo_adm_id}.priority_score == 31"
            - "GET /ryhs/admissions/${post_bo_adm_id}/guardian-notifications returns total_count 0"
