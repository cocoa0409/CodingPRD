          trigger:
            - call: "POST /taproom-pours"
              payload: { keg_asset_id: "${keg_id}", container_type: "GROWLER_64OZ", price_cents: 2000, container_sanitized: true, sanitizer_ppm: 200, contact_time_seconds: 90, attested_by_user_id: "u_taproom_2", label_fields: { brand_name: "Ridgeline IPA", abv_statement: "6.8% ALC/VOL", net_contents: "64 FL OZ", health_warning: "GOVERNMENT WARNING: ACCORDING TO THE SURGEON GENERAL" } }
              as: TaproomStaff
              as_user_id: "u_taproom_1"
              captures: { err: $.data.error_id }
          assert:
