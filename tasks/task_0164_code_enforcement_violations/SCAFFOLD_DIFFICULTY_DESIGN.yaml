# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Code Enforcement & Violations — 9 rule_ids x 2 instances = 18 instances
#
# Standard FeeSchedule rows seeded by every chain (PlatformAdmin):
#   MINOR : base=5000   daily=200   max=50000   cure=21
#   MAJOR : base=20000  daily=500   max=100000  cure=14
#   HAZARD: base=50000  daily=1000  max=300000  cure=7
# Clock convention: whole_days = floor((b-a)/86400). Issuance at effective_date;
# MAJOR compliance_deadline = effective_date + 14 days.
# =============================================================================
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fine_accrual_provisional_vs_settlement_on_notice
        grounds:
          - calculations.fine_accrual
          - entities.ViolationNotice.fields.fine_total_cents
          - state_machines.ViolationNotice.OVERDUE_to_COMPLIED
        distinguishing_aspect: |
          On the SAME ViolationNotice, the provisional variant (live read while OVERDUE)
          and the settlement variant (frozen at the Reinspection PASSED instant) yield
          different fine_total_cents for the SAME notice — provisional keeps growing with
          the clock, settlement freezes — and this calc operates on the ViolationNotice
          cost domain (distinct from repeat_offender_score's Owner-risk domain).
        test_recipe:
          setup:
            - "MAJOR FeeSchedule (base 20000, daily 500, cap 100000, cure 14)."
            - "Owner FIRST tier; Property; Case; INITIAL inspection VIOLATION_FOUND; MAJOR notice issued at 2026-01-01."
            - "Clock advanced to 2026-01-25 (10 whole days past the 2026-01-15 deadline) -> notice OVERDUE."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { violation_class: "MAJOR", base_fine_cents: 20000, daily_accrual_cents: 500, max_total_cents: 100000, cure_days: 14 }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Olive Owner", mailing_email: "olive@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-1001", street_address: "1 Main St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { case_id: $.data.id }
            - call: "POST /inspections"
              payload: { case_id: "${case_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/submit"
              payload: { outcome: "VIOLATION_FOUND" }
              as: CodeOfficer
            - call: "POST /notices"
              payload: { case_id: "${case_id}", source_inspection_id: "${insp_id}", violation_class: "MAJOR" }
              as: CodeOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /reinspections"
              payload: { notice_id: "${notice_id}" }
              as: CodeOfficer
              captures: { reinsp_id: $.data.id }
          trigger:
            - call: "GET /notices/${notice_id}"
              payload: {}
              as: CodeOfficer
              captures: { provisional_total: $.data.fine_total_cents }
            - call: "POST /reinspections/${reinsp_id}/result"
              payload: { result: "PASSED" }
              as: CodeOfficer
            - call: "GET /notices/${notice_id}"
              payload: {}
              as: CodeOfficer
              captures: { settlement_total: $.data.fine_total_cents }
          assert:
            - "First GET (OVERDUE, provisional): ViolationNotice.${notice_id}.fine_total_cents == 25000"
            - "ViolationNotice.${notice_id}.days_overdue == 10"
            - "After PASSED result, ViolationNotice.${notice_id}.status == COMPLIED"
            - "Second GET (settlement, frozen at result_on=2026-01-25): ViolationNotice.${notice_id}.fine_total_cents == 25000"

      - name: repeat_offender_tier_at_issuance_vs_live_on_owner
        grounds:
          - calculations.repeat_offender_score
          - entities.Owner.fields.repeat_tier
          - entities.ViolationNotice.fields.escalation_multiplier
        distinguishing_aspect: |
          The at_issuance variant freezes escalation_multiplier onto a notice (1.0 for a
          FIRST-tier owner), while the live_tier variant on the SAME Owner read later
          returns REPEAT after two prior COMPLIED notices — different results on the
          Owner-risk domain (distinct from the ViolationNotice-cost domain of fine_accrual).
        test_recipe:
          setup:
            - "MAJOR FeeSchedule. Owner O with two prior notices that reached COMPLIED within the 365-day window, raising live tier to REPEAT (prior_violation_count==2)."
            - "A third notice N3 is issued; its escalation_multiplier was frozen at issuance BEFORE the 2nd prior reached COMPLIED, so N3 froze at FIRST (1.0)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { violation_class: "MAJOR", base_fine_cents: 20000, daily_accrual_cents: 500, max_total_cents: 100000, cure_days: 14 }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Otto Owner", mailing_email: "otto@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-2001", street_address: "2 Main St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop1_id: $.data.id }
            # prior #1 -> COMPLIED
            - call: "POST /cases"
              payload: { property_id: "${prop1_id}" }
              as: CodeOfficer
              captures: { case1_id: $.data.id }
            - call: "POST /inspections"
              payload: { case_id: "${case1_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp1_id: $.data.id }
            - call: "POST /inspections/${insp1_id}/submit"
              payload: { outcome: "VIOLATION_FOUND" }
              as: CodeOfficer
            - call: "POST /notices"
              payload: { case_id: "${case1_id}", source_inspection_id: "${insp1_id}", violation_class: "MAJOR" }
              as: CodeOfficer
              captures: { notice1_id: $.data.id }
            - call: "POST /reinspections"
              payload: { notice_id: "${notice1_id}" }
              as: CodeOfficer
              captures: { reinsp1_id: $.data.id }
            - call: "POST /reinspections/${reinsp1_id}/result"
              payload: { result: "PASSED" }
              as: CodeOfficer
            - call: "POST /cases/${case1_id}/close"
              payload: {}
              as: FinanceClerk
            # prior #2 -> COMPLIED (second property, same owner)
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-2002", street_address: "3 Main St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop2_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop2_id}" }
              as: CodeOfficer
              captures: { case2_id: $.data.id }
            - call: "POST /inspections"
              payload: { case_id: "${case2_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp2_id: $.data.id }
            - call: "POST /inspections/${insp2_id}/submit"
              payload: { outcome: "VIOLATION_FOUND" }
              as: CodeOfficer
            # N3 issued NOW, while owner still has only 1 prior COMPLIED -> froze at FIRST(1.0)
            - call: "POST /notices"
              payload: { case_id: "${case2_id}", source_inspection_id: "${insp2_id}", violation_class: "MAJOR" }
              as: CodeOfficer
              captures: { notice3_id: $.data.id }
            - call: "POST /reinspections"
              payload: { notice_id: "${notice3_id}" }
              as: CodeOfficer
              captures: { reinsp2_id: $.data.id }
            # bring prior #2 (notice3) to COMPLIED -> now owner has 2 priors -> live tier REPEAT
            - call: "POST /reinspections/${reinsp2_id}/result"
              payload: { result: "PASSED" }
              as: CodeOfficer
          trigger:
            - call: "GET /notices/${notice3_id}"
              payload: {}
              as: CodeOfficer
              captures: { frozen_mult: $.data.escalation_multiplier }
            - call: "GET /owners/${owner_id}"
              payload: {}
              as: CodeOfficer
              captures: { live_tier: $.data.repeat_tier, live_count: $.data.prior_violation_count }
          assert:
            - "ViolationNotice.${notice3_id}.escalation_multiplier == 1.0 (frozen at_issuance when only 1 prior COMPLIED existed)"
            - "Owner.${owner_id}.prior_violation_count == 2"
            - "Owner.${owner_id}.repeat_tier == REPEAT (live_tier variant >= REPEAT_THRESHOLD of 2)"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fine_accrual_cap_then_multiply_then_round_order
        grounds:
          - calculations.fine_accrual
          - entities.ViolationNotice.fields.fine_total_cents
          - entities.FeeSchedule.fields.max_total_cents
        distinguishing_aspect: |
          MODE (b) nested-rounding/order: the cap is applied to the per-day-summed accrual
          FIRST, the escalation multiplier is applied to the capped value SECOND, and
          round_half_up is applied exactly ONCE to that product — never per-day. A REPEAT
          (1.5x) MAJOR notice 10 days overdue yields min(25000,100000)*1.5 = 37500, not a
          per-day-rounded sum. (Distinct mode from instance lien_admin_fee_circular_principal_dependency's mode (c).)
        test_recipe:
          setup:
            - "MAJOR FeeSchedule. Owner with 2 prior COMPLIED notices in window -> REPEAT tier (1.5x) frozen at issuance of the test notice."
            - "Test notice issued at 2026-03-01 while owner is REPEAT; clock advanced to 10 whole days past its 2026-03-15 deadline."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { violation_class: "MAJOR", base_fine_cents: 20000, daily_accrual_cents: 500, max_total_cents: 100000, cure_days: 14 }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Rita Repeat", mailing_email: "rita@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-3001", street_address: "30 Main St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_a_id: $.data.id }
            # two priors to COMPLIED
            - call: "POST /cases"
              payload: { property_id: "${prop_a_id}" }
              as: CodeOfficer
              captures: { case_a_id: $.data.id }
            - call: "POST /inspections"
              payload: { case_id: "${case_a_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp_a_id: $.data.id }
            - call: "POST /inspections/${insp_a_id}/submit"
              payload: { outcome: "VIOLATION_FOUND" }
              as: CodeOfficer
            - call: "POST /notices"
              payload: { case_id: "${case_a_id}", source_inspection_id: "${insp_a_id}", violation_class: "MAJOR" }
              as: CodeOfficer
              captures: { notice_a_id: $.data.id }
            - call: "POST /reinspections"
              payload: { notice_id: "${notice_a_id}" }
              as: CodeOfficer
              captures: { reinsp_a_id: $.data.id }
            - call: "POST /reinspections/${reinsp_a_id}/result"
              payload: { result: "PASSED" }
              as: CodeOfficer
            - call: "POST /cases/${case_a_id}/close"
              payload: {}
              as: FinanceClerk
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-3002", street_address: "31 Main St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_b_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_b_id}" }
              as: CodeOfficer
              captures: { case_b_id: $.data.id }
            - call: "POST /inspections"
              payload: { case_id: "${case_b_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp_b_id: $.data.id }
            - call: "POST /inspections/${insp_b_id}/submit"
              payload: { outcome: "VIOLATION_FOUND" }
              as: CodeOfficer
            - call: "POST /notices"
              payload: { case_id: "${case_b_id}", source_inspection_id: "${insp_b_id}", violation_class: "MAJOR" }
              as: CodeOfficer
              captures: { notice_b_id: $.data.id }
            - call: "POST /reinspections"
              payload: { notice_id: "${notice_b_id}" }
              as: CodeOfficer
              captures: { reinsp_b_id: $.data.id }
            - call: "POST /reinspections/${reinsp_b_id}/result"
              payload: { result: "PASSED" }
              as: CodeOfficer
            - call: "POST /cases/${case_b_id}/close"
              payload: {}
              as: FinanceClerk
            # now owner is REPEAT (2 priors). Issue the test notice on a fresh case.
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-3003", street_address: "32 Main St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_t_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_t_id}" }
              as: CodeOfficer
              captures: { case_t_id: $.data.id }
            - call: "POST /inspections"
              payload: { case_id: "${case_t_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp_t_id: $.data.id }
            - call: "POST /inspections/${insp_t_id}/submit"
              payload: { outcome: "VIOLATION_FOUND" }
              as: CodeOfficer
            - call: "POST /notices"
              payload: { case_id: "${case_t_id}", source_inspection_id: "${insp_t_id}", violation_class: "MAJOR" }
              as: CodeOfficer
              captures: { notice_t_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-25T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /notices/${notice_t_id}"
              payload: {}
              as: CodeOfficer
              captures: { total: $.data.fine_total_cents, mult: $.data.escalation_multiplier }
          assert:
            - "ViolationNotice.${notice_t_id}.escalation_multiplier == 1.5 (REPEAT frozen at issuance)"
            - "ViolationNotice.${notice_t_id}.days_overdue == 10"
            - "ViolationNotice.${notice_t_id}.fine_total_cents == 37500 (min(20000+500*10,100000)=25000, then *1.5, rounded once)"

      - name: lien_admin_fee_circular_principal_dependency
        grounds:
          - calculations.lien_amount
          - entities.Lien.fields.principal_cents
          - entities.Lien.fields.admin_fee_cents
          - entities.Lien.fields.total_cents
        distinguishing_aspect: |
          MODE (c) circular-looking evaluation order: admin_fee_cents depends on principal_cents
          (tier keyed on principal), but principal_cents must be fully summed FIRST before the
          tiered admin_rate is selected. With citation 100000 + abatement 400000, principal=500000
          hits the >=500000 tier (0.10) -> admin_fee 50000 -> total 550000. (Distinct mode from
          fine_accrual_cap_then_multiply_then_round_order's mode (b).)
        test_recipe:
          setup:
            - "MAJOR FeeSchedule. Owner FIRST. MAJOR notice issued 2026-01-01, clock advanced to 200 days overdue -> capped citation fine_total 100000."
            - "BOARD_UP abatement completed with actual_cost 400000 -> ABATEMENT_COST Fine 400000 OPEN."
            - "Lien recorded: freezes citation Fine to 100000, principal=100000+400000=500000."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { violation_class: "MAJOR", base_fine_cents: 20000, daily_accrual_cents: 500, max_total_cents: 100000, cure_days: 14 }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Liam Lien", mailing_email: "liam@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-4001", street_address: "40 Main St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { case_id: $.data.id }
            - call: "POST /inspections"
              payload: { case_id: "${case_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/submit"
              payload: { outcome: "VIOLATION_FOUND" }
              as: CodeOfficer
            - call: "POST /notices"
              payload: { case_id: "${case_id}", source_inspection_id: "${insp_id}", violation_class: "MAJOR" }
              as: CodeOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /abatement-orders"
              payload: { case_id: "${case_id}", action_kind: "BOARD_UP", estimated_cost_cents: 400000 }
              as: CodeOfficer
              captures: { ao_id: $.data.id }
            - call: "POST /abatement-orders/${ao_id}/start"
              payload: {}
              as: CodeOfficer
            - call: "POST /abatement-orders/${ao_id}/complete"
              payload: { actual_cost_cents: 400000 }
              as: CodeOfficer
            - call: "GET /cases/${case_id}"
              payload: {}
              as: FinanceClerk
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /liens"
              payload: { case_id: "${case_id}", expected_case_version: "${case_v}" }
              as: FinanceClerk
              captures: { lien_id: $.data.id, principal: $.data.principal_cents, fee: $.data.admin_fee_cents, total: $.data.total_cents }
          assert:
            - "Lien.${lien_id}.principal_cents == 500000 (100000 capped citation + 400000 abatement, summed before tiering)"
            - "Lien.${lien_id}.admin_fee_cents == 50000 (principal>=500000 -> 0.10 rate)"
            - "Lien.${lien_id}.total_cents == 550000"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: notice_contest_cycle_issued_contested_upheld
        grounds:
          - state_machines.ViolationNotice.ISSUED_to_CONTESTED
          - state_machines.ViolationNotice.CONTESTED_to_UPHELD
          - state_machines.Hearing.SCHEDULED_to_HELD_UPHELD
        distinguishing_aspect: |
          The ViolationNotice machine is non-linear (branching+revert): ISSUED forks to
          {COMPLIED, OVERDUE, CONTESTED}; CONTESTED rejoins to UPHELD or DISMISSED with
          divergent side-effect sets (UPHELD resumes accrual; DISMISSED waives the fine).
          This non-linearity is on the ViolationNotice entity (distinct from the Hearing
          continuance cycle instance).
        test_recipe:
          setup:
            - "MAJOR FeeSchedule. Owner is the Registrant. MAJOR notice ISSUED 2026-01-01."
            - "Registrant contests within window (scheduled_for 2026-01-10) -> CONTESTED + Hearing SCHEDULED."
            - "Clock advanced to/after 2026-01-10; HearingOfficer decides UPHELD."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { violation_class: "MAJOR", base_fine_cents: 20000, daily_accrual_cents: 500, max_total_cents: 100000, cure_days: 14 }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Cara Contest", mailing_email: "cara@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-5001", street_address: "50 Main St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { case_id: $.data.id }
            - call: "POST /inspections"
              payload: { case_id: "${case_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/submit"
              payload: { outcome: "VIOLATION_FOUND" }
              as: CodeOfficer
            - call: "POST /notices"
              payload: { case_id: "${case_id}", source_inspection_id: "${insp_id}", violation_class: "MAJOR" }
              as: CodeOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /notices/${notice_id}/contest"
              payload: { scheduled_for: "2026-01-10T00:00:00Z" }
              as: Registrant
              as_user_id: "${owner_id}"
              captures: { hearing_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /hearings/${hearing_id}/decide"
              payload: { decision: "UPHELD" }
              as: HearingOfficer
            - call: "GET /notices/${notice_id}"
              payload: {}
              as: CodeOfficer
              captures: { st: $.data.status }
          assert:
            - "Before decide: ViolationNotice.${notice_id}.status == CONTESTED"
            - "Hearing.${hearing_id}.status == HELD_UPHELD after decide"
            - "ViolationNotice.${notice_id}.status == UPHELD (CONTESTED->UPHELD rejoin)"

      - name: hearing_continuance_cycle_scheduled_continued_scheduled
        grounds:
          - state_machines.Hearing.SCHEDULED_to_CONTINUED
          - state_machines.Hearing.CONTINUED_to_SCHEDULED
          - entities.Hearing.fields.continuance_count
        distinguishing_aspect: |
          The Hearing machine has a true cycle: SCHEDULED -> CONTINUED -> SCHEDULED, with
          continuance_count incrementing each loop. This cyclic non-linearity is on the
          Hearing entity (distinct from the ViolationNotice branching instance).
        test_recipe:
          setup:
            - "A CONTESTED MAJOR notice with a SCHEDULED Hearing (scheduled_for 2026-01-10)."
            - "HearingOfficer continues it once (count 0->1), then reschedules to 2026-01-20."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { violation_class: "MAJOR", base_fine_cents: 20000, daily_accrual_cents: 500, max_total_cents: 100000, cure_days: 14 }
              as: PlatformAdmin
            - call: "POST /owners"
              payload: { full_name: "Cody Cont", mailing_email: "cody@x.com" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", parcel_number: "APN-5101", street_address: "51 Main St", occupancy: "OCCUPIED" }
              as: CodeOfficer
              captures: { prop_id: $.data.id }
            - call: "POST /cases"
              payload: { property_id: "${prop_id}" }
              as: CodeOfficer
              captures: { case_id: $.data.id }
            - call: "POST /inspections"
              payload: { case_id: "${case_id}", kind: "INITIAL" }
              as: CodeOfficer
              captures: { insp_id: $.data.id }
