# Codex config for OpenAI GPT-6 Astra on Amazon Bedrock (bedrock-runtime, OpenAI-compatible endpoint).
# Use with:
#   harbor run -a codex -m global.openai.gpt-6-astra \
#     --ak config=harbor_utils/codex-bedrock.toml --ak web_search=disabled \
#     --mounts '[{"type":"bind","source":"<abs path>/harbor_utils/codex-gpt6-astra-catalog.json","target":"/opt/codex/gpt6-astra-catalog.json","read_only":true}]' \
#     --ae OPENAI_API_KEY="$AWS_BEARER_TOKEN_BEDROCK" --ae AWS_BEARER_TOKEN_BEDROCK="$AWS_BEARER_TOKEN_BEDROCK" \
#     --ae AWS_REGION=us-east-1
# - codex auto-detects the Bedrock host and authenticates with AWS_BEARER_TOKEN_BEDROCK (+ AWS_REGION);
#   OPENAI_API_KEY alone fails with "failed to load AWS credentials".
# - supports_websockets=false: bedrock-runtime rejects codex's wss:// Responses transport (400).
# - web_search must be disabled: bedrock-runtime does not support server-side tools.
# - model_catalog_json: custom providers skip codex's built-in model catalog, so without it codex uses
#   fallback metadata (no native apply_patch tool, generic prompt). The catalog is the official
#   gpt-6-astra entry (codex 0.154) with slug=global.openai.gpt-6-astra, prefer_websockets=false,
#   auto_compact_token_limit=256000, max_context_window=1050000. It must be mounted at this path.
model_catalog_json = "/opt/codex/gpt6-astra-catalog.json"
model_provider = "bedrock"

[model_providers.bedrock]
name = "Amazon Bedrock"
base_url = "https://bedrock-runtime.us-east-1.amazonaws.com/openai/v1"
env_key = "OPENAI_API_KEY"
wire_api = "responses"
supports_websockets = false
# Under load, bedrock-runtime intermittently accepts a request and then sends no SSE data at all
# (job 2026-09-10__15-09-14: ~1080 stalls pinned at codex's 300s default; normal silences p99 = 71s,
# retries usually succeed at once). Detect stalls fast and keep retrying instead of exiting after 5.
stream_idle_timeout_ms = 120000
stream_max_retries = 50
