            - call: "GET /imaging-studies/aaaaaaaa-0000-4000-8000-000000000006"
              as: PracticeAdmin
              captures: { k_nf_imaging: $.data.error_id }
            - call: "GET /treatment-plans/aaaaaaaa-0000-4000-8000-000000000007"
              as: PracticeAdmin
              captures: { k_nf_plan: $.data.error_id }
            - call: "GET /drug-lots/aaaaaaaa-0000-4000-8000-000000000008"
              as: PracticeAdmin
              captures: { k_nf_lot: $.data.error_id }
            - call: "GET /vials/aaaaaaaa-0000-4000-8000-000000000009"
              as: PracticeAdmin
              captures: { k_nf_vial: $.data.error_id }
            - call: "GET /prior-authorizations/aaaaaaaa-0000-4000-8000-00000000000a"
              as: PracticeAdmin
              captures: { k_nf_auth: $.data.error_id }
