              payload: { site_name: "Fellowship Hall Bunkroom", bed_capacity: 12, has_showers: true, nightly_cost_cents: 0 }
              as: VolunteerCoordinator
              as_user_id: u_vc_1
              captures: { l10: "$.data.id" }
            - call: POST /housing-assignments
              payload: { group_id: "${g10}", lodging_site_id: "${l10}", check_in_date: "2026-09-07", check_out_date: "2026-09-12" }
