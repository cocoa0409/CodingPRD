          assert:
            - "${draft_release_err} == ERR_EPISODE_INVALID_STATE with HTTP 409"
            - "${scheduled_rollback_err} == ERR_EPISODE_INVALID_STATE with HTTP 409"
            - "${unapproved_start_err} == ERR_EVENT_INVALID_STATE with HTTP 409"
            - "Episode.${ep2_draft_id}.status == DRAFT"
            - "Episode.${ep_draft_id}.status == SCHEDULED"
            - "Episode.${ep_draft_id}.rollback_count == 0"
            - "LiveEvent.${evt_a_id}.status == PLANNED"
            - "CapacityCluster.${cluster_id}.reserved_ccu == 0"

      - name: corner_sm_idempotency_second_approve_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.LiveEvent.PLANNED_to_APPROVED
          - errors[ERR_EVENT_INVALID_STATE]
