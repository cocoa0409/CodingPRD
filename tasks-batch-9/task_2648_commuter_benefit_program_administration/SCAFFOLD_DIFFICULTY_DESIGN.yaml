            - "ElectionWindow 2026-08 occupies [2026-07-01T00:00:00Z, 2026-08-20T00:00:00Z); the clock is at its 2026-08-01T00:00:00Z default."
            - "The employee's election (pretax 8000, media_quantity 1) has one MediaOrder that was batched, sealed by desk-sealer, released by desk-releaser and shipped, so fulfillment_status is IN_TRANSIT."
            - "The window has since been LOCKED, so funding_status is FUNDED with excluded_amount_cents 8000 and the BenefitAccount holds available_balance_cents 8000."
