        grounds:
          - endpoints.POST_carrier_cancellation_requests_request_id_return_posting
          - calculations.deficiency_and_agent_chargeback
          - state_machines.CarrierCancellationRequest.REQUESTED_to_RETURN_POSTED
          - state_machines.PremiumFinanceAgreement.ACTIVE_to_CANCELLED_DEFICIENT
          - state_machines.ProducerAgent.ACTIVE_to_SUSPENDED_FOR_CHARGEBACKS
          - validations.priority_23_ERR_AGENT_SUSPENDED
        distinguishing_aspect: |
          DEPTH 5, triggered by CarrierCancellationRequest REQUESTED -> RETURN_POSTED. The chain
          crosses four entities and each link exists only because the previous one fired: the posted
          return moves the request terminal (1), which makes every request of the note terminal and
          settles the note into CANCELLED_DEFICIENT (2), which mints an AgentChargeback (3), which
          pushes the agency's outstanding exposure onto its liability cap and suspends the agency
          (4), which blocks submission of a completely unrelated draft agreement that names the same
          agency (5). Hop 5 touches an aggregate the posting never mentioned.
