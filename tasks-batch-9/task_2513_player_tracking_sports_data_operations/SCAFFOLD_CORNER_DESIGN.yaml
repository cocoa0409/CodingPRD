  - section: errors
    instances:
      - name: every_path_parameter_lookup_has_its_own_not_found_error_id
        claim_type: not_found
        grounds:
          - validations[priority=10]
          - errors[ERR_VENUE_NOT_FOUND]
          - errors[ERR_INSTALLATION_NOT_FOUND]
          - errors[ERR_CLUB_NOT_FOUND]
          - errors[ERR_PLAYER_NOT_FOUND]
          - errors[ERR_CONSENT_RECORD_NOT_FOUND]
          - errors[ERR_GAME_NOT_FOUND]
          - errors[ERR_EVENT_TAG_NOT_FOUND]
          - errors[ERR_CORRECTION_REQUEST_NOT_FOUND]
          - errors[ERR_RIGHTS_WINDOW_NOT_FOUND]
          - errors[ERR_LICENSEE_NOT_FOUND]
          - errors[ERR_FEED_SESSION_NOT_FOUND]
        distinguishing_aspect: |
          Eleven addressable resources, eleven distinct error ids, all raised against an empty database with
          the same syntactically valid UUID: none of them may collapse into a generic 404, and none may be
          pre-empted by the role or body checks - priority 10 runs after authentication but before every
          domain rule, so even the action endpoints answer NOT_FOUND rather than a state error.
        test_recipe:
          setup:
            - "empty database; logical clock left at its default"
            - "UUID under test: 00000000-0000-4000-8000-000000000000 (well-formed, never issued)"
          setup_api_calls: []
          trigger:
            - call: "GET /venues/00000000-0000-4000-8000-000000000000"
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { e1: $.data.error_id }
            - call: "GET /installations/00000000-0000-4000-8000-000000000000"
              as: CalibrationEngineer
              as_user_id: "eng-01"
              captures: { e2: $.data.error_id }
            - call: "GET /clubs/00000000-0000-4000-8000-000000000000"
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { e3: $.data.error_id }
            - call: "GET /players/00000000-0000-4000-8000-000000000000"
              as: Statistician
              as_user_id: "stat-01"
              captures: { e4: $.data.error_id }
            - call: "POST /consent-records/00000000-0000-4000-8000-000000000000/ratify"
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { e5: $.data.error_id }
            - call: "GET /games/00000000-0000-4000-8000-000000000000"
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { e6: $.data.error_id }
            - call: "GET /event-tags/00000000-0000-4000-8000-000000000000"
              as: QualityReviewer
              as_user_id: "qr-01"
              captures: { e7: $.data.error_id }
            - call: "POST /correction-requests/00000000-0000-4000-8000-000000000000/approve"
              as: QualityReviewer
              as_user_id: "qr-01"
              captures: { e8: $.data.error_id }
            - call: "POST /rights-windows/00000000-0000-4000-8000-000000000000/revoke"
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { e9: $.data.error_id }
            - call: "GET /licensees/00000000-0000-4000-8000-000000000000"
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { e10: $.data.error_id }
            - call: "GET /feed-sessions/00000000-0000-4000-8000-000000000000"
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { e11: $.data.error_id }
          assert:
            - "all eleven calls return HTTP 404 with response_type \"error\" and a non-empty data.message"
            - "error_ids in call order: ERR_VENUE_NOT_FOUND, ERR_INSTALLATION_NOT_FOUND, ERR_CLUB_NOT_FOUND, ERR_PLAYER_NOT_FOUND, ERR_CONSENT_RECORD_NOT_FOUND, ERR_GAME_NOT_FOUND, ERR_EVENT_TAG_NOT_FOUND, ERR_CORRECTION_REQUEST_NOT_FOUND, ERR_RIGHTS_WINDOW_NOT_FOUND, ERR_LICENSEE_NOT_FOUND, ERR_FEED_SESSION_NOT_FOUND"
            - "no call returns ERR_INVALID_REQUEST, ERR_ROLE_NOT_PERMITTED or any state error"

      - name: body_foreign_keys_are_resolved_before_any_domain_rule_runs
        claim_type: not_found
        grounds:
          - validations[priority=20]
          - errors[ERR_VENUE_NOT_FOUND]
          - errors[ERR_CLUB_NOT_FOUND]
          - errors[ERR_LICENSEE_NOT_FOUND]
          - errors[ERR_RIGHTS_WINDOW_NOT_FOUND]
        distinguishing_aspect: |
          Body-borne references get the same 404 treatment as path parameters, and they are resolved left to
          right before any domain rule: an unknown venue_id on POST /games answers ERR_VENUE_NOT_FOUND, an
          unknown away_club_id answers ERR_CLUB_NOT_FOUND, an unknown polymorphic holder_id under
          holder_type LICENSEE answers ERR_LICENSEE_NOT_FOUND (not ERR_RIGHTS_HOLDER_MISMATCH), and an
          unknown rights_window_id on POST /feed-sessions answers ERR_RIGHTS_WINDOW_NOT_FOUND rather than
          the collection-state error the SCHEDULED game would otherwise raise.
        test_recipe:
          setup:
            - "one venue, two clubs, one SCHEDULED game and one GOLD licensee exist"
            - "UUID under test: 00000000-0000-4000-8000-000000000000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { v_id: $.data.id }
            - call: "POST /clubs"
              payload: { name: "Harbor FC", market_code: "HBR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_home: $.data.id }
            - call: "POST /clubs"
              payload: { name: "Summit SC", market_code: "SMT" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_away: $.data.id }
            - call: "POST /games"
              payload: { venue_id: "${v_id}", home_club_id: "${c_home}", away_club_id: "${c_away}", scheduled_start_utc: "2026-08-01T18:00:00Z", tracking_generation: "G1", licensable_minutes: 240 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { g_id: $.data.id }
            - call: "POST /licensees"
              payload: { name: "Northstar Data", licensee_class: "BROADCASTER", tier: "GOLD", granted_units: 5000, biometric_entitled: false }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { lic_id: $.data.id }
          trigger:
            - call: "POST /games"
              payload: { venue_id: "00000000-0000-4000-8000-000000000000", home_club_id: "${c_home}", away_club_id: "${c_away}", scheduled_start_utc: "2026-08-02T18:00:00Z", tracking_generation: "G1", licensable_minutes: 240 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { e_venue: $.data.error_id }
            - call: "POST /games"
              payload: { venue_id: "${v_id}", home_club_id: "${c_home}", away_club_id: "00000000-0000-4000-8000-000000000000", scheduled_start_utc: "2026-08-02T18:00:00Z", tracking_generation: "G1", licensable_minutes: 240 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { e_club: $.data.error_id }
            - call: "POST /games/${g_id}/rights-windows"
              payload: { rights_class: "COMMERCIAL_LICENSE", holder_type: "LICENSEE", holder_id: "00000000-0000-4000-8000-000000000000", territory: "US", window_start_utc: "2026-08-01T18:00:00Z", window_end_utc: "2026-08-01T21:00:00Z", max_latency_ms: 400, allowed_scopes: ["POSITIONAL"] }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { e_holder: $.data.error_id }
            - call: "POST /feed-sessions"
              payload: { game_id: "${g_id}", rights_window_id: "00000000-0000-4000-8000-000000000000", delivery_mode: "REALTIME", bandwidth_mbps: 20, window_start_utc: "2026-08-01T18:00:00Z", window_end_utc: "2026-08-01T18:30:00Z", requested_latency_ms: 300, scope: ["POSITIONAL"] }
              as: Licensee
              as_user_id: "${lic_id}"
