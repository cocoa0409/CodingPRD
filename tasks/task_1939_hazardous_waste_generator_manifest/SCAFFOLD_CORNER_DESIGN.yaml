            - { call: "POST /hazwaste/manifests", payload: { site_id: "${site_a}", transporter_id: "${transp_id}", tsdf_id: "${tsdf_id}", manifest_tracking_number: "MT-300", line_items: [{ waste_stream_id: "${s_a}", container_id: "${ca1}", quantity_kg: 100.0 }] }, as: WasteCoordinator, as_user_id: "wc-1", captures: { man_a: "$.data.id" } }
