        grounds: ["errors[ERR_EMPTY_WAVE]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / ship_empty_wave_zero_reserved_allocations_rejected
          rationale: "ERR_EMPTY_WAVE is the asserted failure path of the named §1.8 instance."

