              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_id: $.data.id }
            - call: "POST /ats/requisitions/${req_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/requisitions/${req_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
            - call: "POST /ats/candidates"
              payload: { full_name: "CXT Cand", email: "cxtc@example.com", source_channel: "DIRECT", eeo_ethnicity: "WHITE", eeo_gender: "MALE", eeo_veteran: false, eeo_disability: false }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { cand_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${cand_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app_id: $.data.id }
            - call: "POST /ats/applications/${app_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/offers"
              payload: { application_id: "${app_id}", base_salary_cents: 12000000, signing_bonus_cents: 0 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { offer_id: $.data.id, offer_v1: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v1}" }
              as: CompApprover
              as_user_id: "comp_carol"
              captures: { offer_v2: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v2}" }
              as: VP
              as_user_id: "vp_dave"
            - call: "GET /ats/requisitions/${req_id}"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_v_current: $.data.version }
            - call: "POST /ats/requisitions/${req_id}/cancel"
              payload: { expected_requisition_version: "${req_v_current}" }
              as: HiringManager
              as_user_id: "hm_bob"
          trigger:
            - call: "POST /ats/offers/${offer_id}/extend"
