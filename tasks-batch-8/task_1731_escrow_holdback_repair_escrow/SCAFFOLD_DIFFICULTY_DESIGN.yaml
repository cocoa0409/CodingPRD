          - calculations.close_waterfall
          - calculations.ledger_reconciliation
          - state_machines.EscrowFile
        distinguishing_aspect: |
          Depth-3 chain from POST /escrow/holdbacks/{id}/close: holdback close triggers
          ledger waterfall appends (link 1); each append recomputes trust_balance_cents and
          running_balance_cents (link 2, ledger-sync); reaching terminal status with a zero
          balance bubbles up to flip EscrowFile.status OPEN -> CLOSED (link 3). Different
          trigger than draw_approve_shortfall_pledge_cascade.
