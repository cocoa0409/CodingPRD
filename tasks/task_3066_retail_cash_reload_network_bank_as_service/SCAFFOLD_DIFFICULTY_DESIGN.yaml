  - rule_id: transitive_cascade
    instances:

      - name: alert_confirm_freeze_reverse_recover_depth5
        grounds:
          - state_machines.AmlAlert.UNDER_REVIEW_to_CONFIRMED
          - state_machines.CardAccount.REVIEW_to_FROZEN
          - state_machines.LoadTransaction.FUNDED_to_REVERSED
          - state_machines.LossAllocation.POSTED_to_RECOVERED
          - entities.Program.fields.unallocated_confirmed_loss_cents
        distinguishing_aspect: |
          A depth-5 chain originating at the AmlAlert confirm transition where each
          link is caused by the previous one: confirm → freeze the account → reverse
          its funded loads → recover the loss allocations covering those loads →
          recompute the program counters, with no hop skipped and no fan-out.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T12:00:00Z. Program, brand, retailer agreement (pct 0.35, per-txn limit 15000), location QM-001, REG_E account ACCT-0001."
