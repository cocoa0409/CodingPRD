          - errors[ERR_HOURS_CAP_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: a time entry on a CLOSED project that also
          exceeds the hours cap returns ERR_PROJECT_NOT_ACTIVE (state, priority 5), not
          ERR_HOURS_CAP_EXCEEDED (fiscal, priority 12).
        test_recipe:
          setup:
            - "project budget_hours 2 (cap 3.0), activated then CLOSED"
