      - name: endorse_withdraw_support_conservation
        grounds:
          - calculations.quorum_tally
          - state_machines.DirectionEndorsement
          - entities.NoteholderDirection.fields.supporting_principal_cents
        distinguishing_aspect: |
          Conserved quantity: VOTING SUPPORT. An endorsement followed by its
          withdrawal MUST return NoteholderDirection.supporting_principal_cents
          to its exact prior value (400000000 -> 0), flipping the direction
          EFFECTIVE -> CIRCULATING with zero residual weight.
        test_recipe:
          setup:
            - "Active indenture, tranche, positions A 400000000 / B 350000000 / C 250000000; CONFIRMED default; ACCELERATE direction circulating"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
