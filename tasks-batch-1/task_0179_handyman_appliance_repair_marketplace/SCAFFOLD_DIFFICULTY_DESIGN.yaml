  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: dispatch_window_overlap_half_open_adjacency_allowed
        grounds:
          - validations[priority=14]
          - entities.DispatchWindow.fields.window_start
          - entities.DispatchWindow.fields.window_end
        distinguishing_aspect: |
          On the DispatchWindow resource, two windows of one Pro use HALF-OPEN interval semantics:
          a new window [12:00,14:00) touching an existing [10:00,12:00) at the boundary is ALLOWED,
          but [11:00,13:00) overlapping is rejected with ERR_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "a pro with one existing FREE window [10:00,12:00) in ZIP 30301"
          setup_api_calls:
            - call: "POST /pros"
              payload: { email: "p15@x.com", full_name: "P Fifteen", home_zip_code: "30301", skill_tags: ["hvac"] }
              as: Anonymous
              captures: { pro_id: $.data.id }
            - call: "POST /dispatch-windows"
              payload: { pro_id: "${pro_id}", window_start: "2026-06-10T10:00:00.000Z", window_end: "2026-06-10T12:00:00.000Z", service_zip_code: "30301" }
              as: Pro
              as_user_id: "${pro_id}"
              captures: { win1: $.data.id }
            - call: "POST /dispatch-windows"
              payload: { pro_id: "${pro_id}", window_start: "2026-06-10T12:00:00.000Z", window_end: "2026-06-10T14:00:00.000Z", service_zip_code: "30301" }
              as: Pro
              as_user_id: "${pro_id}"
              captures: { win2: $.data.id }
          trigger:
            - call: "POST /dispatch-windows"
              payload: { pro_id: "${pro_id}", window_start: "2026-06-10T11:00:00.000Z", window_end: "2026-06-10T13:00:00.000Z", service_zip_code: "30301" }
              as: Pro
              as_user_id: "${pro_id}"
              captures: { err: $.data.error_id }
          assert:
            - "DispatchWindow(${win2}).hold_state == FREE"
            - "response status == 409"
            - "error_id == ERR_WINDOW_OVERLAP"

      - name: customer_double_book_closed_interval_adjacency_rejected
        grounds:
          - validations[priority=16]
          - state_machines.Job.INSTANT_QUOTED_to_SCHEDULED
          - entities.Customer.fields.id
        distinguishing_aspect: |
          On the Customer resource (a DIFFERENT entity from DispatchWindow), two SCHEDULED jobs use
          CLOSED interval semantics: booking a second window [12:00,14:00] that merely TOUCHES the
          customer's first booked window [10:00,12:00] at the 12:00 boundary is rejected with
          ERR_CUSTOMER_DOUBLE_BOOKED — adjacency forbidden, opposite of the window half-open rule.
        test_recipe:
          setup:
            - "a customer with one SCHEDULED job booked into a CLEARED pro's window [10:00,12:00] in ZIP 30301; a second accepted-quote job at the same ZIP and an adjacent FREE window [12:00,14:00] from a second CLEARED pro"
