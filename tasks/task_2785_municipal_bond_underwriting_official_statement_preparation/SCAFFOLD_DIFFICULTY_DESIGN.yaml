  - rule_id: combinatorial_formula
    instances:

      - name: gross_spread_round_per_tranche_then_sum
        grounds:
          - calculations.gross_spread_disclosure
          - entities.Deal.fields.gross_spread_total_usd
          - entities.Deal.fields.gross_spread_per_bond_usd
          - entities.MaturityTranche.fields.principal_amount_usd
        distinguishing_aspect: |
          Mode (b) nested-rounding order: the maturity schedule is split 2,505,000 / 7,495,000 and
          the per-bond components sum to exactly 8.333, so rounding each tranche's spread to cents
          first and then summing yields 83,330.01 while summing bonds first and rounding once
          yields 83,330.00. The scaffold pins round-per-tranche-then-sum, so 83,330.01 is the only
          correct answer and the one-cent difference is observable.
        test_recipe:
          setup:
            - "One municipal advisor firm, one underwriting firm and one issuer exist."
            - "A NEGOTIATED deal authorizes 10,000,000 split as tranche 1 of 2,505,000 (5.000 coupon, 4.250 yield, matures 2036-08-01) and tranche 2 of 7,495,000 (5.000 coupon, 4.000 yield, matures 2046-08-01, callable 2036-08-01 at 100.000)."
            - "A single senior manager holds 100.0000 percent liability; the undertaking is ACTIVE; the official statement is PRELIMINARY_POSTED; one institutional order period was opened and closed with zero orders."
            - "Logical clock stands at 2026-08-05T14:00:00.000Z."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/firms"
              payload: { name: "Alpha Underwriting", firm_type: "UNDERWRITER", msrb_registration_id: "AU0001" }
              as: ComplianceOfficer
              captures: { uw_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026R", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 10000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 2505000, coupon_rate_pct: 5.000, yield_pct: 4.250 }
