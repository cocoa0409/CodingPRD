            - call: "POST /trace-requests"
              payload: { index_animal_id: "${an_g}", pathogen_class: "DIRECT_CONTACT", direction: "BOTH", lookback_days: 30, max_hops: 3 }
              as: FederalTraceAnalyst
              as_user_id: "fta-1"
              captures: { tr_g: $.data.id }
