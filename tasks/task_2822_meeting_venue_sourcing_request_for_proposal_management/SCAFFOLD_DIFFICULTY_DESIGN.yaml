scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: proposal_cost_contracted_basis_vs_actualized_basis
        grounds:
          - calculations.proposal_total_cost_model
          - entities.Proposal.fields.total_cost_contracted_usd
          - entities.Proposal.fields.total_cost_modeled_usd
          - entities.Proposal.fields.last_evaluation_basis
          - entities.BidEvaluation.fields.total_cost_usd
          - entities.BidEvaluation.fields.attrition_damages_usd
        distinguishing_aspect: |
          The two variants of proposal_total_cost_model price the SAME submitted bid over different
          room-night bases - CONTRACTED_BASIS charges all 587 paid nights, ACTUALIZED_BASIS charges
          the 517 projected nights after the 12% shrink assumption and adds attrition damages - so
          the same Proposal yields total_cost_usd 447844.84 on one basis and 422797.82 on the other,
          a fixed 25047.02 delta.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T09:00:00.000Z."
            - "One RateBenchmark for (TIER_1, USER_CONFERENCE) at 260.00 ADR."
            - "One PREFERRED TIER_1 Venue with 420 guest rooms and 14000 sqft of space."
            - "One MeetingEvent 2027-03-15..2027-03-18 (nights_span 3), budget ceiling 500000.00, with that venue shortlisted and an ISSUED round-1 Rfp."
            - "The venue's Proposal SUBMITTED with 249.00 NET rate, 600 room nights offered, 1 comp per 45 nights, 18.00 resort fee, 24% service charge, 15.6% tax, 22000.00 AV, 145000.00 F&B, 25000.00 concession offered and a 20% attrition allowance."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /sourcing/rate-benchmarks"
              payload: { destination_tier: "TIER_1", program_type: "USER_CONFERENCE", benchmark_adr_usd: 260.00, benchmark_service_charge_pct: 0.24, benchmark_tax_pct: 0.156 }
              as: ProgramAdmin
              captures: { bm_t1_id: $.data.id }
            - call: "POST /sourcing/venues"
              payload: { name: "Harborline Grand", city: "Lisbon", country: "PT", destination_tier: "TIER_1", guest_rooms_total: 420, largest_space_sqft: 14000, preferred_supplier_status: "PREFERRED" }
              as: ProgramAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /sourcing/events"
              payload: { event_code: "EVT-2822-A", name: "Global User Conference 2027", program_type: "USER_CONFERENCE", start_date: "2027-03-15", end_date: "2027-03-18", peak_attendees: 200, requested_room_nights: 600, largest_meeting_space_sqft: 12000, budget_ceiling_usd: 500000.00, preferred_program_only: false }
              as: SourcingManager
              as_user_id: "planner-anita"
              captures: { ev_id: $.data.id }
            - call: "POST /sourcing/events/${ev_id}/lock-requirements"
              payload: {}
              as: SourcingManager
              as_user_id: "planner-anita"
            - call: "POST /sourcing/events/${ev_id}/shortlist-entries"
              payload: { venue_id: "${v1_id}", rank_seq: 1, inspection_required: false }
              as: SourcingManager
              as_user_id: "planner-anita"
              captures: { e1_id: $.data.id }
            - call: "POST /sourcing/shortlist-entries/${e1_id}/shortlist"
              payload: {}
              as: SourcingManager
              as_user_id: "planner-anita"
            - call: "POST /sourcing/events/${ev_id}/rfps"
              payload: { round_number: 1, response_due_at: "2026-09-30T17:00:00.000Z", standard_response_version: "V2", instructions: "Answer every line of the standard grid." }
              as: SourcingManager
              as_user_id: "planner-anita"
              captures: { rfp1_id: $.data.id }
            - call: "POST /sourcing/rfps/${rfp1_id}/issue"
              payload: {}
              as: SourcingManager
              as_user_id: "planner-anita"
            - call: "GET /sourcing/proposals"
              payload: { rfp_id: "${rfp1_id}", venue_id: "${v1_id}" }
              as: SourcingManager
              as_user_id: "planner-anita"
              captures: { p1_id: "$.data[0].id" }
            - call: "POST /sourcing/proposals/${p1_id}/submit"
              payload: { room_rate_usd: 249.00, rate_type: "NET", commission_pct: 0.10, room_nights_offered: 600, comp_room_ratio: 45, resort_fee_usd_per_night: 18.00, service_charge_pct: 0.24, tax_pct: 0.156, av_estimate_usd: 22000.00, fnb_minimum_usd: 145000.00, concession_credit_usd: 25000.00, attrition_allowance_pct: 0.20, cancellation_schedule: [{ days_before_arrival_min: 181, fee_pct: 0.25 }, { days_before_arrival_min: 91, fee_pct: 0.50 }, { days_before_arrival_min: 31, fee_pct: 0.75 }, { days_before_arrival_min: 0, fee_pct: 1.00 }], force_majeure_scope: "STANDARD", rebooking_credit_pct: 0.60 }
              as: VenueRep
              as_user_id: "${v1_id}"
          trigger:
            - call: "POST /sourcing/proposals/${p1_id}/evaluate"
              payload: { basis: "CONTRACTED_BASIS" }
              as: SourcingManager
              as_user_id: "planner-anita"
              captures: { be_contracted_id: $.data.id }
            - call: "POST /sourcing/proposals/${p1_id}/evaluate"
              payload: { basis: "ACTUALIZED_BASIS" }
              as: SourcingManager
              as_user_id: "planner-anita"
              captures: { be_actualized_id: $.data.id }
          assert:
            - "BidEvaluation.${be_contracted_id}.basis == CONTRACTED_BASIS"
            - "BidEvaluation.${be_contracted_id}.paid_room_nights_used == 587"
            - "BidEvaluation.${be_contracted_id}.room_revenue_usd == 146163.00"
            - "BidEvaluation.${be_contracted_id}.resort_fee_total_usd == 10566.00"
            - "BidEvaluation.${be_contracted_id}.av_adjusted_usd == 20900.00"
            - "BidEvaluation.${be_contracted_id}.service_charge_usd == 74895.12"
            - "BidEvaluation.${be_contracted_id}.tax_usd == 62013.76"
            - "BidEvaluation.${be_contracted_id}.concession_applied_usd == 11693.04"
            - "BidEvaluation.${be_contracted_id}.attrition_damages_usd == 0.00"
            - "BidEvaluation.${be_contracted_id}.total_cost_usd == 447844.84"
            - "BidEvaluation.${be_actualized_id}.basis == ACTUALIZED_BASIS"
            - "BidEvaluation.${be_actualized_id}.paid_room_nights_used == 517"
            - "BidEvaluation.${be_actualized_id}.room_revenue_usd == 128733.00"
            - "BidEvaluation.${be_actualized_id}.resort_fee_total_usd == 9306.00"
            - "BidEvaluation.${be_actualized_id}.service_charge_usd == 70711.92"
            - "BidEvaluation.${be_actualized_id}.tax_usd == 58445.54"
            - "BidEvaluation.${be_actualized_id}.concession_applied_usd == 10298.64"
            - "BidEvaluation.${be_actualized_id}.attrition_damages_usd == 0.00"
            - "BidEvaluation.${be_actualized_id}.total_cost_usd == 422797.82"
            - "BidEvaluation.${be_contracted_id}.total_cost_usd - BidEvaluation.${be_actualized_id}.total_cost_usd == 25047.02"
            - "Proposal.${p1_id}.total_cost_contracted_usd == 447844.84 (unchanged by the ACTUALIZED_BASIS evaluation)"
            - "Proposal.${p1_id}.total_cost_modeled_usd == 422797.82"
            - "Proposal.${p1_id}.last_evaluation_basis == ACTUALIZED_BASIS"
            - "Proposal.${p1_id}.status == UNDER_REVIEW"
      - name: venue_performance_recency_weighted_vs_simple_mean
        grounds:
          - calculations.venue_performance_score
          - entities.Venue.fields.performance_score
          - entities.Venue.fields.performance_score_simple_mean
          - entities.Venue.fields.performance_review_count
          - entities.SupplierPerformanceReview.fields.composite_score
        distinguishing_aspect: |
          Both variants consume the identical three composite scores 4.80, 3.25 and 2.25, but
          RECENCY_WEIGHTED applies 0.7 ** (rank - 1) weights over reviews ordered created_at DESC and
          lands on 3.14 while SIMPLE_MEAN averages them unweighted and lands on 3.43 - a different
          entity domain (supplier scorecards) from the money-valued cost-model dual variant.
        test_recipe:
          setup:
            - "One TIER_1 Venue in the supplier master."
            - "Three EXTERNAL SupplierPerformanceReviews captured at three distinct logical-clock instants, worsening over time: (5,5,4,5) then (3,4,3,3) then (2,3,2,2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /sourcing/venues"
              payload: { name: "Harborline Grand", city: "Lisbon", country: "PT", destination_tier: "TIER_1", guest_rooms_total: 420, largest_space_sqft: 14000, preferred_supplier_status: "PREFERRED" }
              as: ProgramAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T09:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /sourcing/venues/${v1_id}/performance-reviews"
              payload: { review_source: "EXTERNAL", service_score: 5, value_score: 5, av_quality_score: 4, responsiveness_score: 5, comment: "Imported 2025 scorecard" }
              as: ProgramAdmin
              captures: { rev_oldest_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-07T09:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /sourcing/venues/${v1_id}/performance-reviews"
              payload: { review_source: "EXTERNAL", service_score: 3, value_score: 4, av_quality_score: 3, responsiveness_score: 3, comment: "Imported 2026 H1 scorecard" }
              as: ProgramAdmin
              captures: { rev_middle_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-08T09:00:00.000Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /sourcing/venues/${v1_id}/performance-reviews"
              payload: { review_source: "EXTERNAL", service_score: 2, value_score: 3, av_quality_score: 2, responsiveness_score: 2, comment: "Imported 2026 H2 scorecard" }
              as: ProgramAdmin
              captures: { rev_newest_id: $.data.id }
          assert:
            - "SupplierPerformanceReview.${rev_oldest_id}.composite_score == 4.80"
            - "SupplierPerformanceReview.${rev_middle_id}.composite_score == 3.25"
            - "SupplierPerformanceReview.${rev_newest_id}.composite_score == 2.25"
            - "Venue.${v1_id}.performance_review_count == 3"
            - "Venue.${v1_id}.performance_score == 3.14"
            - "Venue.${v1_id}.performance_score_simple_mean == 3.43"
            - "Venue.${v1_id}.performance_score != Venue.${v1_id}.performance_score_simple_mean"
  - rule_id: combinatorial_formula
    instances:
    - name: deposit_schedule_per_installment_rounding_then_residual
      grounds:
      - calculations.deposit_schedule_allocation
      - entities.Contract.fields.deposit_total_usd
      - entities.Contract.fields.deposit_outstanding_usd
      - entities.DepositInstallment.fields.amount_usd
      - entities.DepositInstallment.fields.due_date
      - state_machines.DepositInstallment.SCHEDULED_to_PAID
      distinguishing_aspect: 'Mode (b) - order of operations: the 0.34/0.33/0.33 shares of 129651.08 are each rounded to the cent FIRST (44081.37 + 42784.86 + 42784.86 = 129651.09) and the -0.01 residual is then pushed onto installment 3, giving 42784.85; rounding the shares in any other order leaves a schedule that sums to 129651.09 and breaks the conservation identity.'
      test_recipe:
        setup:
        - Logical clock at 2026-08-05T09:00:00.000Z throughout.
        - RateBenchmark (TIER_1, USER_CONFERENCE) at 260.00 ADR, 24% service charge, 15.6% tax.
        - PREFERRED TIER_1 Venue 'Harborline Grand'.
        - MeetingEvent EVT-2822-A 2027-03-15..2027-03-18 (nights_span 3), budget ceiling 500000.00, requirements locked.
        - That venue shortlisted at rank 1; round-1 Rfp issued then closed, so the event sits in BID_REVIEW.
        - The venue's Proposal submitted with the 249.00 NET / 600-night / 145000.00 F&B grid and evaluated once on CONTRACTED_BASIS, so it is UNDER_REVIEW with total_cost_contracted_usd 447844.84.
        - The event awarded to that proposal, the two-step approval route (MANAGER, VP) fully approved, planner-signed and venue-countersigned, so the Contract is EXECUTED with contracted_total_usd 432170.27 and no deposit schedule yet.
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {current_utc: '2026-08-05T09:00:00.000Z'}
          as: ProgramAdmin
        - call: POST /sourcing/rate-benchmarks
          payload: {destination_tier: TIER_1, program_type: USER_CONFERENCE, benchmark_adr_usd: 260.0, benchmark_service_charge_pct: 0.24, benchmark_tax_pct: 0.156}
          as: ProgramAdmin
          captures: {bm_t1_id: $.data.id}
        - call: POST /sourcing/venues
          payload: {name: Harborline Grand, city: Lisbon, country: PT, destination_tier: TIER_1, guest_rooms_total: 420, largest_space_sqft: 14000, preferred_supplier_status: PREFERRED}
          as: ProgramAdmin
          captures: {v1_id: $.data.id}
        - call: POST /sourcing/events
          payload: {event_code: EVT-2822-A, name: Global User Conference 2027, program_type: USER_CONFERENCE, start_date: '2027-03-15', end_date: '2027-03-18', peak_attendees: 200, requested_room_nights: 600, largest_meeting_space_sqft: 12000, budget_ceiling_usd: 500000.0, preferred_program_only: false}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {ev_id: $.data.id}
        - call: POST /sourcing/events/${ev_id}/lock-requirements
          payload: {}
          as: SourcingManager
          as_user_id: planner-anita
        - call: POST /sourcing/events/${ev_id}/shortlist-entries
          payload: {venue_id: '${v1_id}', rank_seq: 1, inspection_required: false}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {e1_id: $.data.id}
        - call: POST /sourcing/shortlist-entries/${e1_id}/shortlist
          payload: {}
          as: SourcingManager
          as_user_id: planner-anita
        - call: POST /sourcing/events/${ev_id}/rfps
          payload: {round_number: 1, response_due_at: '2026-09-30T17:00:00.000Z', standard_response_version: V2, instructions: Answer every line of the standard grid.}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {rfp1_id: $.data.id}
        - call: POST /sourcing/rfps/${rfp1_id}/issue
          payload: {}
          as: SourcingManager
          as_user_id: planner-anita
        - call: GET /sourcing/proposals
          payload: {rfp_id: '${rfp1_id}', venue_id: '${v1_id}'}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {p1_id: '$.data[0].id'}
        - call: POST /sourcing/proposals/${p1_id}/submit
          payload: {room_rate_usd: 249.0, rate_type: NET, commission_pct: 0.1, room_nights_offered: 600, comp_room_ratio: 45, resort_fee_usd_per_night: 18.0, service_charge_pct: 0.24, tax_pct: 0.156, av_estimate_usd: 22000.0, fnb_minimum_usd: 145000.0, concession_credit_usd: 25000.0, attrition_allowance_pct: 0.2, cancellation_schedule: [{days_before_arrival_min: 181, fee_pct: 0.25}, {days_before_arrival_min: 91, fee_pct: 0.5}, {days_before_arrival_min: 31, fee_pct: 0.75}, {days_before_arrival_min: 0, fee_pct: 1.0}], force_majeure_scope: STANDARD, rebooking_credit_pct: 0.6}
          as: VenueRep
          as_user_id: ${v1_id}
        - call: POST /sourcing/rfps/${rfp1_id}/close
          payload: {}
          as: SourcingManager
          as_user_id: planner-anita
        - call: POST /sourcing/proposals/${p1_id}/evaluate
          payload: {basis: CONTRACTED_BASIS}
          as: SourcingManager
          as_user_id: planner-anita
        - call: GET /sourcing/events/${ev_id}
          payload: {}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {ev_ver: $.data.version}
        - call: POST /sourcing/events/${ev_id}/award
          payload: {proposal_id: '${p1_id}', expected_event_version: '${ev_ver}', award_note: Best total cost after negotiation.}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {ct_id: $.data.id}
        - call: POST /sourcing/contracts/${ct_id}/route-approvals
          payload: {}
          as: SourcingManager
          as_user_id: planner-anita
        - call: GET /sourcing/contracts/${ct_id}/approval-steps
          payload: {}
          as: SourcingManager
          as_user_id: planner-anita
          captures: {step1_id: '$.data[0].id', step2_id: '$.data[1].id'}
        - call: POST /sourcing/approval-steps/${step1_id}/decide
          payload: {decision: APPROVED, decision_note: Within delegation.}
          as: ContractApprover
          as_user_id: approver-bo
        - call: POST /sourcing/approval-steps/${step2_id}/decide
          payload: {decision: APPROVED, decision_note: Within delegation.}
          as: ContractApprover
          as_user_id: approver-cy
        - call: POST /sourcing/contracts/${ct_id}/sign
          payload: {planner_signatory_name: Anita Vale}
          as: SourcingManager
          as_user_id: planner-anita
        - call: POST /sourcing/contracts/${ct_id}/countersign
          payload: {venue_signatory_name: Rui Costa}
          as: VenueRep
          as_user_id: ${v1_id}
        trigger:
        - call: POST /sourcing/contracts/${ct_id}/deposit-schedule
          payload: {}
          as: FinanceController
          as_user_id: treasury-mira
        assert:
        - Contract.${ct_id}.deposit_total_usd == 129651.08
        - DepositInstallment(contract_id=${ct_id}, installment_seq=1).weight_pct == 0.34
        - DepositInstallment(contract_id=${ct_id}, installment_seq=1).amount_usd == 44081.37
        - DepositInstallment(contract_id=${ct_id}, installment_seq=1).due_date == 2026-09-16
        - DepositInstallment(contract_id=${ct_id}, installment_seq=2).amount_usd == 42784.86
        - DepositInstallment(contract_id=${ct_id}, installment_seq=2).due_date == 2026-12-15
        - DepositInstallment(contract_id=${ct_id}, installment_seq=3).amount_usd == 42784.85
        - DepositInstallment(contract_id=${ct_id}, installment_seq=3).due_date == 2027-02-13
        - sum of the three DepositInstallment.amount_usd == 129651.08 exactly (not 129651.09)
        - Contract.${ct_id}.deposit_outstanding_usd == 129651.08
        - Contract.${ct_id}.deposit_paid_usd == 0.00
        - every DepositInstallment.status == SCHEDULED
    - name: volume_rebate_tier_read_from_pre_rebate_total
      grounds:
      - calculations.contract_volume_rebate
      - entities.Contract.fields.pre_rebate_total_usd
      - entities.Contract.fields.volume_rebate_pct
      - entities.Contract.fields.volume_rebate_usd
      - entities.Contract.fields.contracted_total_usd
      - calculations.budget_envelope_invariant
      distinguishing_aspect: 'Mode (c) - circular-looking dependency pinned to one direction: the bid''s pre-rebate total 404841.64 sits above the 400000.00 tier minimum while the post-rebate total 390672.18 sits below it, so reading the tier from the output instead of the input yields 0.020 / 382858.74 instead of the correct 0.035 / 390672.18.'
