  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_fiscal_on_enrollment_confirm
        grounds:
          - validations[priority=5]
          - validations[priority=15]
          - state_machines.Enrollment.PENDING_to_CONFIRMED
        distinguishing_aspect: |
          A confirm against an already-DROPPED enrollment in a DELINQUENT family violates BOTH the state
          precondition (priority 5, category state) and the delinquency gate (priority 15, category
          business_fiscal); the lower-priority state check wins -> ERR_INVALID_STATE, not ERR_FAMILY_DELINQUENT.
        test_recipe:
          setup:
            - "Family DELINQUENT (has a PAST_DUE invoice) with a CONFIRMED enrollment that is then DROPPED."
          setup_api_calls:
            - call: "POST /terms"
              payload: { name: "PP Term", start_date: "2026-02-01", end_date: "2026-06-30", age_cutoff_date: "2026-02-01", monthly_billing_day: 10 }
              as: StudioAdmin
              captures: { term_id: $.data.id }
