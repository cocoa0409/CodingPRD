      - name: overlay_scope_error_outranks_overlay_window_error
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CLUSTER_NOT_IN_PLAN
          - errors.ERR_OVERLAY_WINDOW_INVERTED
          - validations[priority=21].ERR_CLUSTER_NOT_IN_PLAN
          - validations[priority=36].ERR_OVERLAY_WINDOW_INVERTED
        distinguishing_aspect: "Both codes are 422, so neither can be reached by HTTP status alone; the request that violates BOTH must return ERR_CLUSTER_NOT_IN_PLAN because priority 21 precedes priority 36. Each code is then isolated by fixing exactly one of the two defects. The final control also pins the overlay window as CLOSED rather than half-open: effective_start == effective_end is a legal single-day overlay, so an implementation that rejects equality as 'inverted' fails while still passing every other assertion here."
        test_recipe:
          setup:
            - "an APPROVED plan with an OptionPlan on cluster Metro A, plus a second cluster Rural B that no OptionPlan of that plan references"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
