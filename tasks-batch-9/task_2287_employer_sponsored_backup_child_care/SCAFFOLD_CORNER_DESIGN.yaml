      - name: corner_cascading_side_effects_chain_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: transitive_cascade / credential_revoke_cascades_credential_provider_reservation_ledger_block
          rationale: "The four-level chain (Credential REVOKED -> Provider SUSPENDED -> every future CONFIRMED Reservation back to MATCHING -> RELEASE ledger rows -> CapacityBlock.reserved_slots decremented) is already asserted level by level, including the ordering-sensitivity claim that an IN_SERVICE reservation is deliberately NOT rewound, by the transitive_cascade instances in §1.8."

      - name: corner_dual_variant_calculation_delta_on_switch
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: dual_variant_calc / in_home_day_charge_provisional_one_day_vs_final_two_days
          rationale: "Both variants and the reconciliation delta are already covered: §1.8 asserts the provisional charge at intake, the final charge at completion, and the exact ledger delta written when the variant switches, for both the in-home day charge and the copay-versus-overage split."

      - name: corner_selector_policy_ranking_is_deterministic_and_tie_broken
        claim_type: selector_policy
        grounds:
          - complexity_profile.complexity_layers[selector_policy]
        excluded_because:
          difficulty_instance: combinatorial_formula / rank_score_probation_factor_demotes_highest_quality_provider_to_last
          rationale: "The candidate-ranking selector, its multiplicative probation factor, and the declared tie-break chain are already exercised by the §1.8 combinatorial_formula and resource_temporal_overlap instances, which assert the full rank_position ordering of the emitted MatchOffer set rather than just the winner."

