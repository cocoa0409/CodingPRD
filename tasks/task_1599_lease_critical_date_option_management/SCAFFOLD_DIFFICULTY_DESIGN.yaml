            - "Option.${oid}.status == WINDOW_OPEN"
            - "Exactly 5 Reminders exist for option ${oid} addressed to contact ${am_id}, all status == PENDING, tiers {T90, T60, T30, T7, T0}"
            - "Reminder tier T90 has scheduled_for == 2026-09-01T09:00:00Z (close 2026-11-30 minus 90 days = 2026-09-01, a Tuesday, no weekend roll)"

      - name: notice_acknowledge_cascades_option_to_lease_to_ledger
        grounds:
          - state_machines.ExerciseNotice.DELIVERED_to_ACKNOWLEDGED
          - state_machines.Option.NOTICE_SENT_to_EXERCISED
          - entities.LedgerEntry
        distinguishing_aspect: |
          Depth-3 chain triggered by notice acknowledgment (a different trigger
          than the clock sweep): acknowledge moves ExerciseNotice DELIVERED→
          ACKNOWLEDGED (hop 1); that moves Option NOTICE_SENT→EXERCISED (hop 2,
          caused by the notice transition); the exercise posts the OPTION_FEE
