          allocation_id: ${alloc_id}
        as: Patron
        as_user_id: ${b2_id}
      - call: POST /ops-runs
        payload:
          as_of_iso8601: '2026-09-12T09:10:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /purchases
        payload:
          performance_id: ${perf_id}
          allocation_id: ${alloc_id}
          quantity: 2
          idempotency_key: block-2
        as: Patron
        as_user_id: ${b2_id}
        captures:
          err: $.data.error_id
          pur_v: $.data.version
      assert:
      - the response status is 409
      - the response reported ${err} == ERR_SEAT_ALREADY_HELD
      - TicketPurchase.${pur1_id}.seat_labels == ["ORCH-D-1", "ORCH-D-2"] and the rejected order created no TicketPurchase for ${b2_id}
      - the rejected run would have intersected the existing run, so the block comparison is set-intersection rather than instant adjacency
      - GET /purchases?performance_id=${perf_id}&patron_id=${b2_id} returns 0 rows
- rule_id: compensating_invariant
  instances:
  - name: invariant_seats_conserved_across_settle_refund_approve_cycle
    grounds:
    - state_machines.TicketPurchase.SETTLED_to_REFUNDED
    - state_machines.RefundRequest.REQUESTED_to_PROCESSING
    - calculations.refund_amount
    - entities.RushAllocation.fields.quantity_sold_today
    distinguishing_aspect: 'The conserved quantity is seats dispensed: quantity_sold_today plus quantity_released_today stays fixed across a full settle-then-refund approval cycle, because the refund settlement returns exactly the seats the purchase consumed and the allocation''s capacity accounting is left with no drift.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-12T09:00:00Z. A MOBILE_PUSH market, an ACTIVE production with refund_window_hours 720 and an ONSALE performance starting 2026-10-05.
      - A SCHEDULED RUSH allocation with daily_quantity 8, discount_pct 0.5 and per_order_limit 3, released for epoch 2026-09-12 so quantity_released_today is 8 and quantity_sold_today is 0.
      - One buyer holds an ADMITTED queue position, so a three-seat order may be placed.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - call: POST /productions/${prod_id}/status-transitions
        payload:
          to_status: ACTIVE
          expected_production_version: ${prod_v}
        as: OpsManager
        captures:
          prod_v: $.data.version
      - call: POST /performances
        payload:
          production_id: ${prod_id}
          market_code: NYC
          venue_name: Invariant Theatre
          starts_at: '2026-10-05T19:00:00Z'
          face_value_cents: 10000
          total_seat_capacity: 30
        as: OpsManager
        captures:
          perf_id: $.data.id
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/status-transitions
        payload:
          to_status: ONSALE
          expected_performance_version: ${perf_v}
        as: OpsManager
        captures:
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/allocations
        payload:
          ticket_type: RUSH
          daily_quantity: 8
          discount_pct: 0.5
          release_time_local: 09:00
          refundable: true
          per_order_limit: 3
        as: AllocationsCoordinator
        captures:
          alloc_id: $.data.id
          alloc_v: $.data.version
      - call: POST /allocations/${alloc_id}/scheduling
        payload:
          expected_allocation_version: ${alloc_v}
        as: AllocationsCoordinator
        captures:
          alloc_v: $.data.version
      - call: POST /allocations/${alloc_id}/releases/2026-09-12
        payload:
          expected_production_version: ${prod_v}
          expected_performance_version: ${perf_v}
          expected_allocation_version: ${alloc_v}
        as: OpsManager
        captures:
          alloc_v: $.data.version
      - call: POST /patrons/registrations
        payload:
          email: invariant_buyer@x.com
          display_name: Invariant Buyer
          market_code: NYC
        as: Anonymous
        captures:
          buyer_id: $.data.id
          patron_v: $.data.version
      - call: POST /performances/${perf_id}/queue-positions
        payload:
          allocation_id: ${alloc_id}
        as: Patron
        as_user_id: ${buyer_id}
      - call: POST /ops-runs
        payload:
          as_of_iso8601: '2026-09-12T09:05:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /purchases
        payload:
          performance_id: ${perf_id}
          allocation_id: ${alloc_id}
          quantity: 3
          idempotency_key: invariant-1
        as: Patron
        as_user_id: ${buyer_id}
        captures:
          pur_id: $.data.id
          pur_v: $.data.version
      - call: POST /purchases/${pur_id}/settlements
        payload:
          expected_purchase_version: ${pur_v}
        as: FinancialOps
        captures:
          pur_v: $.data.version
      - call: POST /purchases/${pur_id}/refund-requests
        payload:
          reason_code: PATRON_REQUEST
          expected_purchase_version: ${pur_v}
        as: Patron
        as_user_id: ${buyer_id}
        captures:
          refund_id: $.data.id
          pur_v2: $.data.version
          refund_v: $.data.version
      - call: POST /refunds/${refund_id}/approvals
        payload:
          decision: APPROVE
          expected_purchase_version: ${pur_v2}
        as: CustomerService
        captures:
          pur_v3: $.data.version
          refund_v: $.data.version
      - call: POST /refunds/${refund_id}/settlement
        payload:
          expected_purchase_version: ${pur_v3}
        as: FinancialOps
        captures:
          alloc_v_after: $.data.version
          refund_v: $.data.version
      - call: GET /performances/${perf_id}/allocations
        payload: {}
        as: ProducerAnalyst
        captures:
          sold_final: $.data[0].quantity_sold_today
          rel_final: $.data[0].quantity_released_today
          alloc_v: $.data[0].version
      assert:
      - RushAllocation.${alloc_id}.quantity_sold_today == 0 after the refund settled, having been 3 after the purchase
      - RushAllocation.${alloc_id}.quantity_released_today == 8 and it is the same value it held before the purchase, so quantity_sold_today + quantity_released_today has returned to its starting value
      - the released quantity never moved because the forward action consumed capacity and the compensating refund settlement restored exactly the three seats it consumed
      - TicketPurchase.${pur_id}.refunded_cents == 15000 and TicketPurchase.${pur_id}.payment_status == REFUNDED
      - 'the conserved seat quantity shows zero drift: 8 before the purchase and 8 after the refund'
  - name: invariant_exchange_money_split_conserved_across_apply_and_compensation
    grounds:
    - calculations.exchange_cost
    - state_machines.ExchangeRequest.QUOTED_to_APPROVED
    - state_machines.ExchangeRequest.APPLIED_to_COMPENSATED
    - entities.TicketPurchase.fields.refunded_cents
    distinguishing_aspect: 'The conserved quantity is money rather than seats: fee_cents plus value_returned_cents always equals the recalled original_amount_cents, so the quote of 500 plus 9500, the application that posts refunded_cents 1000, and the compensating reversal that returns refunded_cents to 0 all leave the 10000 split intact.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-12T09:00:00Z. A MOBILE_PUSH market, an ACTIVE production with exchange_allowed true and exchange_fee_cents 500, and an ONSALE performance starting 2026-09-12T20:00:00Z so the exchange sits eleven hours before curtain, inside the 2-to-24 hour band.
      - Two SCHEDULED RUSH allocations on that performance, both with discount_pct 0.5, so the target's per-seat price equals the source's and the price difference term is zero.
      - A settled two-ticket purchase on the source allocation whose subtotal_cents is 10000 and whose recalled original_amount_cents is 10000.
