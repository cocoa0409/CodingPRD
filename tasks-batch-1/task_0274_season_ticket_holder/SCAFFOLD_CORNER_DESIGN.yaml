  # =========================================================================
  # Errors
  # =========================================================================
  - section: errors
    instances:
      - name: seat_window_conflict_error_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEAT_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / seat_closed_interval_window_adjacency_conflict
          rationale: "ERR_SEAT_WINDOW_CONFLICT is the asserted failure of the §1.8 seat-overlap instance."
      - name: parking_zone_full_error_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_PARKING_ZONE_FULL]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / parking_zone_aggregate_capacity_conflict
          rationale: "ERR_PARKING_ZONE_FULL is the asserted failure of the §1.8 parking-capacity instance."
      # ERR_STALE_SUBSCRIPTION_VERSION is triggered directly by the
      # cross_cutting_complexity_layers / renewal_accept_stale_version_rejected
      # corner instance below (no §1.8 instance asserts it as its primary
      # outcome), so no stub is emitted here.

  # =========================================================================
  # RBAC
  # =========================================================================
  - section: rbac
    instances:
      - name: financeclerk_cannot_create_subscription_forbidden
        claim_type: exclusive_op_denied
        grounds: [roles.FinanceClerk, roles.BoxOfficeAgent, "endpoints[POST /subscriptions]"]
        distinguishing_aspect: "POST /subscriptions is BoxOfficeAgent-exclusive; a FinanceClerk attempting it -> 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["an account and a plan exist"]
          setup_api_calls:
            - call: "POST /season-plans"
              payload: { name: "Full RBAC", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "RBAC Holder", email: "rbac@x.com" }
              as: BoxOfficeAgent
              captures: { acc_id: $.data.id }
          trigger:
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_id}", season_plan_id: "${plan_id}" }
              as: FinanceClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "error_id == ERR_FORBIDDEN"

      - name: holder_cannot_forward_other_holders_assignment_not_owner
        claim_type: peer_isolation
        grounds: ["validations[priority=8]", roles.AccountHolder, "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "An AccountHolder creating a transfer on a SeatAssignment owned by a DIFFERENT account (X-User-ID != owning Account.id) -> 403 ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup: ["holder A owns an ACTIVE subscription with one ASSIGNED seat; holder B is a different account"]
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 480", tier: "STANDARD", base_price_cents: 200000 }
