            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /field-technicians", payload: { display_name: "Tech Four" }, as: MeterOpsAdmin, captures: { tech_id: $.data.id } }
