          Mode (c) - circular-looking dependency pinned by evaluation order: the tier is selected from
          base_value_cents 2900000 (TIER_2) BEFORE the bonus is added, so bonus_cents == 203000 and
          total_engagement_value_cents == 3103000; re-feeding the 3103000 total into tier selection would
