              as: GateOperator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_STACKING_VIOLATION"

      - name: fk_not_found_beats_invalid_request_on_gate_appointment
        claim_type: Priority Ordering
        grounds:
          - "validations[priority=4]"
          - "validations[priority=5]"
          - "errors[ERR_FK_NOT_FOUND]"
        distinguishing_aspect: "Booking with a non-existent container_id AND a bad 90-min window: FK existence (priority 4) outranks body-shape (priority 5) -> ERR_FK_NOT_FOUND (404), not ERR_INVALID_REQUEST."
        test_recipe:
