  - rule_id: non_linear_state_machine
    instances:
      - name: exam_session_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.ExamSession[dimension=session_status]
          - state_machines.ExamSession[dimension=proctoring_status]
          - state_machines.ExamSession.PENDING_ASSIGNMENT_to_ASSIGNED
          - state_machines.ExamSession.CLEARED_to_INCIDENT_UNDER_REVIEW
          - state_machines.ExamSession.INCIDENT_UNDER_REVIEW_to_CLEARED
          - endpoints[POST /exam-sessions/{id}/proctor-assignment]
        distinguishing_aspect: |
          One ExamSession row carries two independent state axes. The proctoring axis advances
          (PENDING_ASSIGNMENT -> ASSIGNED) while session_status stays SCHEDULED, and after the sitting
          reaches the terminal session_status CLOSED the proctoring axis still moves twice more
          (CLEARED -> INCIDENT_UNDER_REVIEW -> CLEARED, a cycle inside the second dimension) without
          session_status changing at all. A single-axis implementation cannot reproduce the observed
          pair sequence (SCHEDULED, PENDING_ASSIGNMENT) -> (SCHEDULED, ASSIGNED) -> (CLOSED, CLEARED)
          -> (CLOSED, INCIDENT_UNDER_REVIEW) -> (CLOSED, CLEARED). Entity: ExamSession.
        test_recipe:
          setup:
            - "Baseline jurisdiction / provider (500000 cents) / EN form / 2-seat site / candidate / REGISTERED proctor."
            - "A 1-unit EXAM_ONLY batch (total_price_cents 3762) with its single code assigned to the candidate."
            - "An IN_PERSON sitting created WITHOUT proctor_id, so proctoring_status starts at PENDING_ASSIGNMENT."
