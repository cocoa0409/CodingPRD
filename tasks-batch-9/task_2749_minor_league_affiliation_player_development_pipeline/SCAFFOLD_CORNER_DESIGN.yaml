            - "Both activations succeeded, so the boundary is about the constant and not about roster capacity: Affiliate.${oy_aff}.active_roster_count == 2"

      - name: expense_cap_headroom_leaves_no_overflow_in_either_variant
        claim_type: waterfall_allocation
        grounds:
          - calculations.expense_allocation_settlement
          - entities.AffiliationAgreement.fields.affiliate_overflow_cents
        distinguishing_aspect: "The cap 2600000 is large enough that every category line fits, and the HOUSING line lands exactly on its pro-rata sub-cap 750000, so the aggregate-bucket variant and the per-category-sub-cap variant agree at 1890000 with zero overflow — the case that separates a correct waterfall from one that always reports overflow."
        test_recipe:
          setup:
            - "One affiliate with a DRAFT agreement declaring club_reimbursement_cap_cents 2600000 and gross expenses housing 1000000, meals 900000, travel 400000, upkeep 800000."
            - "Author-computed club lines: HOUSING round(1000000*0.75) == 750000, MEALS round(900000*0.60) == 540000, TRAVEL round(400000*1.00) == 400000, FACILITY_UPKEEP round(800000*0.25) == 200000; SUM == 1890000."
            - "Author-computed sub-caps at cap 2600000 and SUM_SHARE_PCT 2.60: HOUSING 750000, MEALS 600000, TRAVEL 1000000, FACILITY_UPKEEP 250000 (summing to the cap). Every club line is at or below its sub-cap, HOUSING exactly at it."
            - "Provisional variant: draining one 2600000 bucket in CATEGORY_ORDER takes all four lines in full, so allocated == 1890000 and overflow == 1890000 - 1890000 == 0."
            - "Final variant with no audited figures supplied falls back to the declared grosses, so final_line == club_line for every category: final == 1890000 and overflow == 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "POST /affiliates"
              payload: { name: "Headroom Club", level: "TRIPLE_A", market_city: "Toledo", meal_stipend_cents_per_day: 3300 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { wa_aff: $.data.id }
            - call: "POST /affiliates/${wa_aff}/agreements"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", facility_standard_tier: "TIER_1", club_reimbursement_cap_cents: 2600000, minimum_active_players: 0, housing_expense_cents: 1000000, meal_expense_cents: 900000, travel_expense_cents: 400000, upkeep_expense_cents: 800000 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { wa_agr: $.data.id }
          trigger:
            - call: "POST /agreements/${wa_agr}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${wa_aff}"
              captures: { wa_prov: $.data.provisional_club_obligation_cents, wa_ov1: $.data.affiliate_overflow_cents }
            - call: "POST /agreements/${wa_agr}/disposition"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "POST /agreements/${wa_agr}/disposition"
              payload: { action: "SETTLE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { wa_final: $.data.final_club_obligation_cents, wa_ov2: $.data.affiliate_overflow_cents, wa_settled: $.data.settlement_status }
          assert:
            - "After SUBMIT: provisional_club_obligation_cents == 1890000 and affiliate_overflow_cents == 0"
            - "After SETTLE: final_club_obligation_cents == 1890000 and affiliate_overflow_cents == 0 — both variants agree when no category exceeds its sub-cap"
            - "The HOUSING line 750000 equals its sub-cap exactly, so min(line, sub_cap) is exercised at the boundary without clipping"
            - "AffiliationAgreement.${wa_agr}.settlement_status == SETTLED and status is still ACTIVE (SETTLE is a self-transition)"
            - "The audited_* fields are all null, proving the final variant fell back to the declared gross figures"

      - name: same_logs_produce_two_different_workload_figures
        claim_type: variant_divergence
        grounds:
          - calculations.player_workload_index.variants
        excluded_because:
          difficulty_instance: workload_index_actual_vs_projected_diverge_for_same_logs
          rationale: "The §1.8 dual_variant_calc instance already pins both variants over the same log set (1.27 versus 2.94) and asserts the delta, which is precisely this claim."

      - name: provisional_variant_at_submit_final_variant_at_settlement
        claim_type: variant_selection
        grounds:
          - calculations.expense_allocation_settlement.variants
        excluded_because:
          difficulty_instance: expense_allocation_provisional_vs_final_cap_application
          rationale: "The §1.8 dual_variant_calc instance already shows the provisional variant selected on SUBMIT and the final variant selected on SETTLE for one agreement, so a separate selection instance would re-run the same two dispositions."

      - name: settlement_delta_rewrites_the_overflow_ledger
        claim_type: reconciliation
        grounds:
          - calculations.expense_allocation_settlement
          - entities.AffiliationAgreement.fields.affiliate_overflow_cents
        excluded_because:
          difficulty_instance: expense_allocation_provisional_vs_final_cap_application
          rationale: "That §1.8 instance already asserts affiliate_overflow_cents before and after the variant switch (0 then 380769), which is the ledger reconciliation this claim would check."

      - name: adjacent_and_overlapping_windows_are_distinguished
        claim_type: interval_merge
        grounds:
          - calculations.assignment_window_conflict
        excluded_because:
          difficulty_instance: player_assignment_windows_require_three_day_transfer_gap_on_closed_intervals
          rationale: "The §1.8 resource_temporal_overlap instance already probes the closed-interval gap boundary (gap 2 rejected, gap 3 admitted) for player assignments, and its sibling instance covers the half-open staff-allocation adjacency case."

  # ==========================================================================
  - section: validations
    instances:

      - name: meal_stipend_below_the_league_minimum_is_refused
        claim_type: violation_to_error
        grounds:
          - "validations[priority=90]"
          - errors[ERR_MEAL_STIPEND_BELOW_MINIMUM]
        distinguishing_aspect: "A stipend of 2499, one cent under LEAGUE_MIN_MEAL_STIPEND_CENTS, returns 422 ERR_MEAL_STIPEND_BELOW_MINIMUM rather than the 400 ERR_INVALID_REQUEST used for shape problems, and no affiliate row is created."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FarmDirector
              as_user_id: "u-farm-1"
          trigger:
            - call: "POST /affiliates"
              payload: { name: "Underfed Club", level: "SINGLE_A", market_city: "Augusta", meal_stipend_cents_per_day: 2499 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { ms_err: $.data.error_id }
            - call: "GET /affiliates"
              payload: {}
              as: FarmDirector
              as_user_id: "u-farm-1"
          assert:
            - "HTTP status is 422 with error_id == ERR_MEAL_STIPEND_BELOW_MINIMUM"
            - "GET /affiliates returns total_count == 0 — the whole create was rejected, not partially applied"

      - name: meal_stipend_exactly_at_the_minimum_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - "validations[priority=90]"
          - global_constants.LEAGUE_MIN_MEAL_STIPEND_CENTS
        distinguishing_aspect: "The same endpoint with meal_stipend_cents_per_day exactly 2500 returns 201, proving the comparison is 'at least' and not 'greater than' — the mirror of the violation case at the inclusive boundary."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FarmDirector
              as_user_id: "u-farm-1"
          trigger:
            - call: "POST /affiliates"
              payload: { name: "Exactly Fed Club", level: "COMPLEX", market_city: "Sarasota", meal_stipend_cents_per_day: 2500 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { ok_aff: $.data.id, ok_stipend: $.data.meal_stipend_cents_per_day }
          assert:
            - "HTTP status is 201 and Affiliate.${ok_aff}.meal_stipend_cents_per_day == 2500"
            - "Affiliate.${ok_aff}.roster_limit == 35 from LEVEL_ROSTER_LIMIT[COMPLEX], confirming the create ran to completion"

      - name: auth_shape_and_existence_rungs_fire_in_priority_order
        claim_type: priority_conflict
        grounds:
          - "validations[priority=1]"
          - "validations[priority=2]"
          - "validations[priority=3]"
          - "validations[priority=10]"
          - "validations[priority=20]"
          - "validations[priority=30]"
        distinguishing_aspect: "Four deliberately doubled-up violations walk the low end of the ladder: a bogus role on an unknown path yields 401 (not 404), a valid-but-unlisted role on an unknown path yields 403 (not 404), and a body that is both malformed and points at a missing player yields 400 (not 404)."
        test_recipe:
          setup:
            - "One affiliate and one cleared player exist so that a well-formed assignment body is possible; no clearance is needed because every trigger fails before any state check."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FarmDirector
              as_user_id: "u-farm-1"
            - call: "POST /affiliates"
              payload: { name: "Ladder Club", level: "HIGH_A", market_city: "Bowie", meal_stipend_cents_per_day: 2800 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { pl_aff: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Ladder Player", origin: "DOMESTIC_DRAFT", signed_date: "2025-06-10" }
