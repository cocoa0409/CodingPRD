              as: ProductionPlanner
              captures: { fa_id: $.data.id }
            - call: "POST /api/houses/${h2_id}/flocks"
              payload: { flock_code: "FB", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2026-02-02T00:00:00Z", placed_hen_count: 10000 }
              as: ProductionPlanner
              captures: { fb_id: $.data.id }
            - call: "POST /api/houses/${h3_id}/flocks"
              payload: { flock_code: "FC", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2026-01-26T00:00:00Z", placed_hen_count: 10000 }
              as: ProductionPlanner
