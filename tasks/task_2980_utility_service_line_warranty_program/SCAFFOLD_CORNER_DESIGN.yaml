  - section: state_machines
    instances:

      - name: campaign_submission_moves_draft_to_partner_review
        claim_type: valid_transition
        grounds:
          - state_machines.MarketingCampaign.transitions.DRAFT_to_PARTNER_REVIEW
          - endpoints.POST /campaigns/{campaignId}/submission
        distinguishing_aspect: "The happy-path submission must set submitted_by_user_id and bump version to 2 while leaving revision_count at 0 - revision_count only moves on a resubmission from REJECTED, so a first submission that increments it is wrong."
        test_recipe:
          setup:
            - "Partner Cascadia Water is ACTIVE with one AVAILABLE product; one campaign sits in DRAFT with no sibling campaign, so the drop-window spacing rule has nothing to compare against."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000, permit_covered: true, restoration_covered_scope: "BASIC_BACKFILL", cap_reset_basis: "ENROLLMENT_ANNIVERSARY" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Onboarding complete", expected_partner_version: "${partner_v1}" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_v2: $.data.version }
            - call: "POST /campaigns"
              payload: { partner_id: "${partner_id}", product_id: "${product_id}", name: "Curb Stop Fall Mailer", piece_type: "POSTCARD", drop_date: "2026-08-26", requested_quantity: 100 }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { campaign_id: $.data.id, camp_v1: $.data.version, camp_status_0: $.data.status, rev_0: $.data.revision_count }
          trigger:
            - call: "POST /campaigns/${campaign_id}/submission"
              payload: { note: "Creative approved internally; sending for brand review." }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { camp_status_1: $.data.status, camp_v2: $.data.version, submitted_by: $.data.submitted_by_user_id, rev_1: $.data.revision_count, approved_qty: $.data.approved_quantity, decided_at: $.data.decided_at }
          assert:
            - "HTTP 200 with response_type object"
            - "${camp_status_0} == DRAFT and ${camp_v1} == 1  # declared initial_state before the trigger"
            - "${camp_status_1} == PARTNER_REVIEW and ${camp_v2} == 2"
            - "${submitted_by} == mops-001  # recorded from the X-User-ID that submitted"
            - "${rev_0} == 0 and ${rev_1} == 0  # a first submission is not a revision"
            - "${approved_qty} == null and ${decided_at} == null  # no decision has been taken yet"
            - "GET /campaigns?partner_id=${partner_id}&status=PARTNER_REVIEW returns total_count 1"

