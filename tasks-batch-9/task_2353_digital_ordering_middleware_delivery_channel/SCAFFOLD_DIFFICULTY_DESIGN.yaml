# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_2353
# 9 rule_ids x 2 instances = 18 instances.
#
# Canonical fixture used by most chains:
#   clock                2026-08-03T16:00:00Z (Monday, local 11:00 at offset -300)
#   Store S1             base_prep 12, capacity 2, pos_retry_limit 2,
#                        tablet_backlog_threshold 1, hours Mon 600..1320
#   Channel MARKETMAX    MARKETPLACE, 1500 bps NICKEL, svc 299, comm 2500,
#                        NET_MODE, HONOR_86, SUPPRESS_ON_THROTTLE, CHANNEL_REVIEW
#   Channel AGGRPLUS     AGGREGATOR, 800 bps CENT, svc 149, comm 1800,
#                        GROSS_MODE, IGNORE_86, IGNORE_THROTTLE, AUTO_ACCEPT
#   MenuVersion 2026-Q3-CORE: BURGER 1099/875, FRIES 399/875, PLATTER 46158/0
#   Listing prices        MP: BURGER 1265, FRIES 460 | AGG: PLATTER 49851
#   Order O1 (MP, DELIVERY, 2 BURGER + 1 FRIES, tip 200):
#     subtotal 2990, tax 261, svc 299, tip 200, collected 3750,
#     commission 822, brand_net 2629, markup 393, bucket 44,
#     promised_ready_at 2026-08-03T16:23:00Z
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: dual_variant_quote_provisional_versus_confirmed_on_store
        grounds:
          - calculations.quote_time_calculation
          - entities.Order.fields.promised_ready_at
          - endpoints["GET /stores/{id}/quote"]
        distinguishing_aspect: |
          Entity domain is store/kitchen scheduling: the PROVISIONAL variant
          counts the store's currently open orders (load_count 1) while the
          CONFIRMED variant counts only orders created strictly before the new
          order (load_count 0), so the same store at the same clock instant
          quotes 16:25:00Z but has already pinned 16:23:00Z on order O1.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T16:00:00Z (Monday, local 11:00)"
            - "Store S1 with base_prep_minutes 12, prep_capacity_per_bucket 2, hours Monday 600..1320, menu published"
            - "Channel MARKETMAX with markup 1500 bps NICKEL"
            - "Exactly one open order O1 (DELIVERY, injection_status PENDING, fulfillment_status PREPARING)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /channels"
              payload: { code: "MARKETMAX", name: "MarketMax", channel_type: "MARKETPLACE", markup_bps: 1500, rounding_mode: "NICKEL", service_fee_cents: 299, commission_bps: 2500, settlement_mode: "NET_MODE", eighty_six_policy: "HONOR_86", throttle_policy: "SUPPRESS_ON_THROTTLE", adjustment_review_mode: "CHANNEL_REVIEW", accepts_delivery: true }
              as: PlatformAdmin
              captures: { ch_mp_id: "$.data.id" }
            - call: "POST /menu-versions"
              payload: { brand_code: "BRD1", version_label: "2026-Q3-CORE" }
              as: PlatformAdmin
              captures: { mv_id: "$.data.id" }
            - call: "POST /menu-versions/${mv_id}/items"
              payload: { sku: "BURGER", name: "Burger", base_price_cents: 1099, tax_bps: 875 }
              as: PlatformAdmin
            - call: "POST /menu-versions/${mv_id}/items"
              payload: { sku: "FRIES", name: "Fries", base_price_cents: 399, tax_bps: 875 }
              as: PlatformAdmin
            - call: "POST /menu-versions/${mv_id}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { brand_code: "BRD1", name: "Store One", timezone_offset_minutes: -300, base_prep_minutes: 12, prep_capacity_per_bucket: 2, pos_retry_limit: 2, tablet_backlog_threshold: 1 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v: "$.data.version" }
            - call: "POST /stores/${store_id}/hour-windows"
              payload: { day_of_week: 0, opens_at_minute: 600, closes_at_minute: 1320 }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /stores/${store_id}/publish-menu"
              payload: { menu_version_id: "${mv_id}", expected_store_version: "${store_v}" }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel_id: "${ch_mp_id}", external_ref: "MP-1001", fulfillment_mode: "DELIVERY", lines: [{ sku: "BURGER", quantity: 2 }, { sku: "FRIES", quantity: 1 }], tip_cents: 200 }
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
              captures: { o1_id: "$.data.id" }
          trigger:
            - call: "GET /stores/${store_id}/quote"
              payload: { channel_id: "${ch_mp_id}", fulfillment_mode: "DELIVERY" }
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
            - call: "GET /orders/${o1_id}"
              payload: {}
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
          assert:
            - "quote.variant == PROVISIONAL"
            - "quote.load_count == 1"
            - "quote.prep_minutes == 14"
            - "quote.travel_minutes == 11"
            - "quote.total_minutes == 25"
            - "quote.quoted_ready_at == 2026-08-03T16:25:00Z"
            - "quote.bucket_index == 44"
            - "quote.bucket_load == 1"
            - "Order.${o1_id}.promised_ready_at == 2026-08-03T16:23:00Z"
            - "The two variants differ by exactly 2 minutes (one LOAD_PAD_MINUTES_PER_ORDER)"

      - name: dual_variant_settlement_gross_versus_net_on_statement
        grounds:
          - calculations.remittance_settlement
          - entities.Channel.fields.settlement_mode
          - endpoints["GET /remittance-statements/{id}/preview"]
        distinguishing_aspect: |
          Entity domain is channel remittance money on RemittanceStatement, not
          store scheduling: with tier_base_cents 5578 the GROSS_MODE variant
          pays 5578 while the NET_MODE variant withholds commission 1395 and
          pays 4183, and the persisted statement uses NET_MODE because
          MARKETMAX is a NET_MODE channel.
        test_recipe:
          setup:
            - "Clock 2026-08-03T16:00:00Z; Store S1 published; Channel MARKETMAX (NET_MODE, commission 2500 bps, service fee 299)"
            - "Two MARKETMAX orders O1 and O2 with identical lines, both injected ACCEPTED then marked READY (gross 2 x 3289 = 6578)"
            - "One ACCEPTED REFUND adjustment of 1000 on O1"
            - "Clock advanced to 2026-08-04T01:00:00Z and an OPEN statement for 2026-08-03 with both orders assigned"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /channels"
              payload: { code: "MARKETMAX", name: "MarketMax", channel_type: "MARKETPLACE", markup_bps: 1500, rounding_mode: "NICKEL", service_fee_cents: 299, commission_bps: 2500, settlement_mode: "NET_MODE", eighty_six_policy: "HONOR_86", throttle_policy: "SUPPRESS_ON_THROTTLE", adjustment_review_mode: "CHANNEL_REVIEW", accepts_delivery: true }
              as: PlatformAdmin
              captures: { ch_mp_id: "$.data.id" }
            - call: "POST /menu-versions"
              payload: { brand_code: "BRD1", version_label: "2026-Q3-CORE" }
              as: PlatformAdmin
              captures: { mv_id: "$.data.id" }
            - call: "POST /menu-versions/${mv_id}/items"
              payload: { sku: "BURGER", name: "Burger", base_price_cents: 1099, tax_bps: 875 }
              as: PlatformAdmin
            - call: "POST /menu-versions/${mv_id}/items"
              payload: { sku: "FRIES", name: "Fries", base_price_cents: 399, tax_bps: 875 }
              as: PlatformAdmin
            - call: "POST /menu-versions/${mv_id}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { brand_code: "BRD1", name: "Store One", timezone_offset_minutes: -300, base_prep_minutes: 12, prep_capacity_per_bucket: 2, pos_retry_limit: 2, tablet_backlog_threshold: 1 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v: "$.data.version" }
            - call: "POST /stores/${store_id}/hour-windows"
              payload: { day_of_week: 0, opens_at_minute: 600, closes_at_minute: 1320 }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /stores/${store_id}/publish-menu"
              payload: { menu_version_id: "${mv_id}", expected_store_version: "${store_v}" }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel_id: "${ch_mp_id}", external_ref: "MP-1001", fulfillment_mode: "DELIVERY", lines: [{ sku: "BURGER", quantity: 2 }, { sku: "FRIES", quantity: 1 }], tip_cents: 200 }
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
              captures: { o1_id: "$.data.id" }
            - call: "POST /orders/${o1_id}/inject"
              payload: { pos_result_code: "OK" }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /orders/${o1_id}/ready"
              payload: {}
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel_id: "${ch_mp_id}", external_ref: "MP-1002", fulfillment_mode: "DELIVERY", lines: [{ sku: "BURGER", quantity: 2 }, { sku: "FRIES", quantity: 1 }], tip_cents: 200 }
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
              captures: { o2_id: "$.data.id" }
            - call: "POST /orders/${o2_id}/inject"
              payload: { pos_result_code: "OK" }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /orders/${o2_id}/ready"
              payload: {}
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "GET /orders/${o1_id}"
              payload: {}
              as: SettlementAnalyst
              captures: { o1_v: "$.data.version" }
            - call: "POST /adjustments"
              payload: { order_id: "${o1_id}", adjustment_type: "REFUND", amount_cents: 1000, reason_code: "MISSING_ITEM", expected_order_version: "${o1_v}" }
              as: SettlementAnalyst
              as_user_id: "analyst-1"
              captures: { adj_id: "$.data.id" }
            - call: "POST /adjustments/${adj_id}/submit"
              payload: {}
              as: SettlementAnalyst
              as_user_id: "analyst-1"
            - call: "POST /adjustments/${adj_id}/accept"
              payload: {}
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /remittance-statements"
              payload: { channel_id: "${ch_mp_id}", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-04T00:00:00Z" }
              as: SettlementAnalyst
              as_user_id: "analyst-1"
              captures: { stmt_id: "$.data.id" }
            - call: "POST /remittance-statements/${stmt_id}/assign-orders"
              payload: { order_ids: ["${o1_id}", "${o2_id}"] }
              as: SettlementAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "GET /remittance-statements/${stmt_id}/preview"
              payload: {}
              as: SettlementAnalyst
              as_user_id: "analyst-1"
          assert:
            - "preview.gross_sales_cents == 6578"
            - "preview.adjustment_total_cents == 1000"
            - "preview.tier_base_cents == 5578"
            - "preview.tier == TIER_1"
            - "preview.effective_commission_bps == 2500"
            - "preview.commission_cents == 1395"
            - "preview.rebate_cents == 0"
            - "preview.gross_mode_net_payable_cents == 5578"
            - "preview.net_mode_net_payable_cents == 4183"
            - "preview.settlement_mode == NET_MODE"
            - "RemittanceStatement.${stmt_id}.net_payable_cents == 4183"
            - "The two variants differ by exactly commission_cents 1395"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: nested_rounding_per_line_tax_before_sum
        grounds:
          - calculations.order_channel_totals
          - calculations.channel_listing_price
          - entities.OrderLine.fields.line_tax_cents
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: tax is rounded per line
          (221 on 2530 and 40 on 460) and then summed to 261, which differs
          from rounding the summed subtotal once (round_half_up(2990 * 875 /
          10000) = 262); the scaffold pins per-line-then-sum.
        test_recipe:
          setup:
            - "Clock 2026-08-03T16:00:00Z; Store S1 published; Channel MARKETMAX with markup 1500 bps and NICKEL rounding"
            - "Listing prices BURGER 1265 and FRIES 460, both at tax_bps 875"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /channels"
              payload: { code: "MARKETMAX", name: "MarketMax", channel_type: "MARKETPLACE", markup_bps: 1500, rounding_mode: "NICKEL", service_fee_cents: 299, commission_bps: 2500, settlement_mode: "NET_MODE", eighty_six_policy: "HONOR_86", throttle_policy: "SUPPRESS_ON_THROTTLE", adjustment_review_mode: "CHANNEL_REVIEW", accepts_delivery: true }
              as: PlatformAdmin
              captures: { ch_mp_id: "$.data.id" }
            - call: "POST /menu-versions"
              payload: { brand_code: "BRD1", version_label: "2026-Q3-CORE" }
              as: PlatformAdmin
              captures: { mv_id: "$.data.id" }
            - call: "POST /menu-versions/${mv_id}/items"
              payload: { sku: "BURGER", name: "Burger", base_price_cents: 1099, tax_bps: 875 }
              as: PlatformAdmin
            - call: "POST /menu-versions/${mv_id}/items"
              payload: { sku: "FRIES", name: "Fries", base_price_cents: 399, tax_bps: 875 }
              as: PlatformAdmin
            - call: "POST /menu-versions/${mv_id}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { brand_code: "BRD1", name: "Store One", timezone_offset_minutes: -300, base_prep_minutes: 12, prep_capacity_per_bucket: 2, pos_retry_limit: 2, tablet_backlog_threshold: 1 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v: "$.data.version" }
            - call: "POST /stores/${store_id}/hour-windows"
              payload: { day_of_week: 0, opens_at_minute: 600, closes_at_minute: 1320 }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /stores/${store_id}/publish-menu"
              payload: { menu_version_id: "${mv_id}", expected_store_version: "${store_v}" }
              as: StoreOperator
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel_id: "${ch_mp_id}", external_ref: "MP-1001", fulfillment_mode: "DELIVERY", lines: [{ sku: "BURGER", quantity: 2 }, { sku: "FRIES", quantity: 1 }], tip_cents: 200 }
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
              captures: { o1_id: "$.data.id" }
            - call: "GET /orders/${o1_id}/lines"
              payload: {}
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
          assert:
            - "OrderLine[sku=BURGER].unit_price_cents == 1265"
            - "OrderLine[sku=BURGER].line_subtotal_cents == 2530"
            - "OrderLine[sku=BURGER].line_tax_cents == 221"
            - "OrderLine[sku=FRIES].unit_price_cents == 460"
            - "OrderLine[sku=FRIES].line_subtotal_cents == 460"
            - "OrderLine[sku=FRIES].line_tax_cents == 40"
            - "Order.${o1_id}.subtotal_cents == 2990"
            - "Order.${o1_id}.tax_cents == 261"
            - "Order.${o1_id}.tax_cents != 262"
            - "Order.${o1_id}.markup_cents == 393"
            - "Order.${o1_id}.channel_collected_cents == 3750"
            - "Order.${o1_id}.commission_cents == 822"
            - "Order.${o1_id}.brand_net_cents == 2629"

      - name: circular_tier_base_pins_commission_then_rebate
        grounds:
          - calculations.remittance_settlement
          - entities.RemittanceStatement.fields.tier_base_cents
          - entities.RemittanceStatement.fields.commission_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: commission is charged on
          tier_base_cents, but the commission rate is discounted by a tier that
          is itself selected from tier_base_cents, so the scaffold pins the
          evaluation order tier_base -> tier -> effective_bps -> commission ->
          rebate -> net; at tier_base 50000 this yields effective 1750 bps,
          commission 8750, rebate 125 and GROSS_MODE net 50125.
        test_recipe:
          setup:
            - "Clock 2026-08-03T16:00:00Z; Store S1 published with a PLATTER item priced 46158 base at 0 tax_bps"
            - "Channel AGGRPLUS: AGGREGATOR, 800 bps CENT markup, service fee 149, commission 1800 bps, GROSS_MODE, AUTO_ACCEPT"
            - "AGGRPLUS listing price for PLATTER is 49851, so one PICKUP order gives gross 49851 + 149 = 50000 exactly"
            - "Order fulfilled READY, clock advanced to 2026-08-04T01:00:00Z, statement OPEN with the order assigned"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /channels"
              payload: { code: "AGGRPLUS", name: "AggrPlus", channel_type: "AGGREGATOR", markup_bps: 800, rounding_mode: "CENT", service_fee_cents: 149, commission_bps: 1800, settlement_mode: "GROSS_MODE", eighty_six_policy: "IGNORE_86", throttle_policy: "IGNORE_THROTTLE", adjustment_review_mode: "AUTO_ACCEPT", accepts_delivery: true }
              as: PlatformAdmin
              captures: { ch_agg_id: "$.data.id" }
            - call: "POST /menu-versions"
              payload: { brand_code: "BRD1", version_label: "2026-Q3-CORE" }
              as: PlatformAdmin
              captures: { mv_id: "$.data.id" }
            - call: "POST /menu-versions/${mv_id}/items"
              payload: { sku: "PLATTER", name: "Party Platter", base_price_cents: 46158, tax_bps: 0, is_delivery_eligible: false }
              as: PlatformAdmin
            - call: "POST /menu-versions/${mv_id}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { brand_code: "BRD1", name: "Store One", timezone_offset_minutes: -300, base_prep_minutes: 12, prep_capacity_per_bucket: 2, pos_retry_limit: 2, tablet_backlog_threshold: 1 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v: "$.data.version" }
            - call: "POST /stores/${store_id}/hour-windows"
              payload: { day_of_week: 0, opens_at_minute: 600, closes_at_minute: 1320 }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /stores/${store_id}/publish-menu"
              payload: { menu_version_id: "${mv_id}", expected_store_version: "${store_v}" }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel_id: "${ch_agg_id}", external_ref: "AG-2001", fulfillment_mode: "PICKUP", lines: [{ sku: "PLATTER", quantity: 1 }] }
              as: ChannelPartner
              as_user_id: "${ch_agg_id}"
              captures: { oa_id: "$.data.id" }
            - call: "POST /orders/${oa_id}/inject"
              payload: { pos_result_code: "OK" }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /orders/${oa_id}/ready"
              payload: {}
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /remittance-statements"
              payload: { channel_id: "${ch_agg_id}", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-04T00:00:00Z" }
              as: SettlementAnalyst
              as_user_id: "analyst-1"
              captures: { stmt_id: "$.data.id" }
          trigger:
            - call: "POST /remittance-statements/${stmt_id}/assign-orders"
              payload: { order_ids: ["${oa_id}"] }
              as: SettlementAnalyst
              as_user_id: "analyst-1"
          assert:
            - "Order.${oa_id}.subtotal_cents == 49851"
            - "Order.${oa_id}.tax_cents == 0"
            - "RemittanceStatement.${stmt_id}.gross_sales_cents == 50000"
            - "RemittanceStatement.${stmt_id}.adjustment_total_cents == 0"
            - "RemittanceStatement.${stmt_id}.tier_base_cents == 50000"
            - "RemittanceStatement.${stmt_id}.tier == TIER_2"
            - "RemittanceStatement.${stmt_id}.commission_cents == 8750"
            - "RemittanceStatement.${stmt_id}.rebate_cents == 125"
            - "RemittanceStatement.${stmt_id}.net_payable_cents == 50125"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: order_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.Order.PENDING_to_PENDING
          - state_machines.Order.PENDING_to_ACCEPTED
          - state_machines.Order.PREPARING_to_READY
          - entities.Order.fields.settlement_status
        distinguishing_aspect: |
          Non-linear shape is parallel state dimensions on the Order entity:
          injection_status walks PENDING -> PENDING -> ACCEPTED while
          fulfillment_status stays PREPARING, and fulfillment_status then moves
          to READY without injection_status or settlement_status changing.
        test_recipe:
          setup:
            - "Clock 2026-08-03T16:00:00Z; Store S1 published with pos_retry_limit 2"
            - "Order O1 exists with injection_status PENDING, fulfillment_status PREPARING, settlement_status SETTLEABLE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /channels"
              payload: { code: "MARKETMAX", name: "MarketMax", channel_type: "MARKETPLACE", markup_bps: 1500, rounding_mode: "NICKEL", service_fee_cents: 299, commission_bps: 2500, settlement_mode: "NET_MODE", eighty_six_policy: "HONOR_86", throttle_policy: "SUPPRESS_ON_THROTTLE", adjustment_review_mode: "CHANNEL_REVIEW", accepts_delivery: true }
              as: PlatformAdmin
              captures: { ch_mp_id: "$.data.id" }
            - call: "POST /menu-versions"
              payload: { brand_code: "BRD1", version_label: "2026-Q3-CORE" }
              as: PlatformAdmin
              captures: { mv_id: "$.data.id" }
            - call: "POST /menu-versions/${mv_id}/items"
              payload: { sku: "BURGER", name: "Burger", base_price_cents: 1099, tax_bps: 875 }
              as: PlatformAdmin
            - call: "POST /menu-versions/${mv_id}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { brand_code: "BRD1", name: "Store One", timezone_offset_minutes: -300, base_prep_minutes: 12, prep_capacity_per_bucket: 2, pos_retry_limit: 2, tablet_backlog_threshold: 1 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v: "$.data.version" }
            - call: "POST /stores/${store_id}/hour-windows"
              payload: { day_of_week: 0, opens_at_minute: 600, closes_at_minute: 1320 }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /stores/${store_id}/publish-menu"
              payload: { menu_version_id: "${mv_id}", expected_store_version: "${store_v}" }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "POST /orders"
