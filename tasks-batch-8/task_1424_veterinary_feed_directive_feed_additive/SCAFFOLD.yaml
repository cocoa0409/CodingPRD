    roles: [Inspector]
    code: 200
    input: [to_iso8601]
    output: "{ now_utc: string }"
    side_effects:
      - "VfdAuthorization.status re-evaluated for clock-based expiration"
      - "VcpVerification.status re-evaluated for clock-based expiration"

