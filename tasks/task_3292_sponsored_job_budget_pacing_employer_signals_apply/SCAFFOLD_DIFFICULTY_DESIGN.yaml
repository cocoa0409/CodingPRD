              captures: { camp_wd_v3: $.data.version }
            - call: "POST /api/events/${ev_wd1}/refund"
              payload: { reason: "invalid click", expected_campaign_version: "${camp_wd_v3}" }
              as: TrustReviewer
              captures: { err_wd1: $.data.error_id }
          assert:
            - "at exactly T0+24h the refund of ${ev_wd1} is allowed at the boundary (status 200, SponsorEvent.${ev_wd1}.status == REFUNDED)"
            - "POST /api/_clock/set_current_utc to 2026-09-02T00:00:01Z then POST /api/events/${ev_wd2}/refund returns 409 ERR_REFUND_WINDOW_EXPIRED"
            - "SponsorEvent.${ev_wd2}.status stays BILLED"

      - name: pacing_hold_exclusivity_per_job_per_day
        grounds:
          - state_machines.Campaign.ACTIVE_to_PACING_HOLD
          - errors[ERR_PACING_HOLD_OVERLAP]
          - entities.PacingHold.fields.status
          - validations[priority=9]
        distinguishing_aspect: "Exclusivity semantics on the PacingHold resource: at most one ACTIVE hold may occupy a sponsored job within one logical day, so a second hold for the same job on the same day collides and is rejected with ERR_PACING_HOLD_OVERLAP — a different geometric rule (zero-tolerance exclusivity) from the SponsorEvent refund window."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE CPC campaign; one sponsored job with a 400-cent ACTIVE pacing hold already placed today."
          setup_api_calls:
            - call: "POST /api/employers"
              payload: { legal_name: "HoldCo", domain: "hold.example", ats_provider: "NONE" }
              as: PlatformAdmin
              captures: { emp_hd: $.data.id }
            - call: "POST /api/job-postings"
              payload: { employer_id: "${emp_hd}", title: "Hold Engineer", location: "Austin, TX", description_text: "Hold exclusivity.", apply_mode: "HOSTED" }
              as: Employer
              as_user_id: "${emp_hd}"
              captures: { post_hd: $.data.id }
            - call: "POST /api/campaigns"
              payload: { employer_id: "${emp_hd}", name: "HD", pricing_model: "CPC", daily_budget_cents: 100000, total_budget_cents: 1000000 }
              as: Employer
              as_user_id: "${emp_hd}"
              captures: { camp_hd: $.data.id }
            - call: "POST /api/campaigns/${camp_hd}/activate"
              payload: {}
              as: Employer
              as_user_id: "${emp_hd}"
            - call: "POST /api/sponsored-jobs"
              payload: { campaign_id: "${camp_hd}", job_posting_id: "${post_hd}", cpc_bid_cents: 300, cpa_bid_cents: 900 }
              as: Employer
              as_user_id: "${emp_hd}"
              captures: { sj_hd: $.data.id }
            - call: "POST /api/sponsored-jobs/${sj_hd}/pacing-holds"
              payload: { amount_cents: 400 }
              as: Employer
              as_user_id: "${emp_hd}"
              captures: { hold_hd1: $.data.id }
          trigger:
            - call: "POST /api/sponsored-jobs/${sj_hd}/pacing-holds"
              payload: { amount_cents: 400 }
              as: Employer
              as_user_id: "${emp_hd}"
              captures: { err_hd: $.data.error_id }
          assert:
            - "the trigger response status is 409 and error_id == ERR_PACING_HOLD_OVERLAP"
            - "PacingHold.${hold_hd1}.status stays ACTIVE and Campaign.${camp_hd}.held_cents == 400"
            - "GET /api/sponsored-jobs/${sj_hd}/pacing-holds returns exactly 1 ACTIVE hold"

  # ===========================================================================
  # Rule 9 — compensating_invariant (>= 2 instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: campaign_spend_conserved_across_click_and_refund
        grounds:
          - calculations.total_budget_invariant
          - state_machines.Campaign.ACTIVE_to_PACING_HOLD
          - errors[ERR_REFUND_WINDOW_EXPIRED]
          - entities.Campaign.fields.spent_cents
        distinguishing_aspect: "Conserved quantity = campaign committed spend. A billable CLICK advances spent_cents by exactly its cleared cost, and the compensating refund returns it to the exact prior value, leaving Campaign.spent_cents equal to the net of COMMIT and REFUND ledger entries (0 here) with no drift."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE CPC campaign with daily_budget_cents 100000 and total_budget_cents 1000000; one ELIGIBLE sponsored job as the sole bidder."
          setup_api_calls:
            - call: "POST /api/employers"
              payload: { legal_name: "ConserveCo", domain: "cons.example", ats_provider: "NONE" }
              as: PlatformAdmin
              captures: { emp_cs: $.data.id }
            - call: "POST /api/job-postings"
              payload: { employer_id: "${emp_cs}", title: "Conserve Engineer", location: "Austin, TX", description_text: "Conserve spend.", apply_mode: "HOSTED" }
              as: Employer
              as_user_id: "${emp_cs}"
              captures: { post_cs: $.data.id }
            - call: "POST /api/campaigns"
              payload: { employer_id: "${emp_cs}", name: "CS", pricing_model: "CPC", daily_budget_cents: 100000, total_budget_cents: 1000000 }
              as: Employer
              as_user_id: "${emp_cs}"
              captures: { camp_cs: $.data.id }
            - call: "POST /api/campaigns/${camp_cs}/activate"
              payload: {}
              as: Employer
              as_user_id: "${emp_cs}"
            - call: "POST /api/sponsored-jobs"
              payload: { campaign_id: "${camp_cs}", job_posting_id: "${post_cs}", cpc_bid_cents: 500, cpa_bid_cents: 900 }
              as: Employer
              as_user_id: "${emp_cs}"
              captures: { sj_cs: $.data.id }
            - call: "GET /api/campaigns/${camp_cs}"
              payload: {}
              as: Employer
              as_user_id: "${emp_cs}"
              captures: { camp_cs_v: $.data.version }
            - call: "POST /api/events"
              payload: { campaign_id: "${camp_cs}", sponsored_job_id: "${sj_cs}", event_type: "CLICK", device_fingerprint: "fp-cs-1", ip_hash: "ip-cs-1", expected_campaign_version: "${camp_cs_v}" }
              as: PlatformAdmin
              captures: { ev_cs: $.data.id }
            - call: "GET /api/campaigns/${camp_cs}"
              payload: {}
              as: Employer
              as_user_id: "${emp_cs}"
              captures: { camp_cs_v2: $.data.version }
          trigger:
            - call: "POST /api/events/${ev_cs}/refund"
              payload: { reason: "invalid click", expected_campaign_version: "${camp_cs_v2}" }
              as: TrustReviewer
          assert:
            - "the click cleared cost_cents == 500, so Campaign.${camp_cs}.spent_cents == 500 after the click"
            - "after the refund, Campaign.${camp_cs}.spent_cents == 0 (back to the exact prior value)"
            - "Employer.${emp_cs}.balance_cents == 0 after the refund"
            - "the BudgetLedger nets to 0: sum(COMMIT) + sum(REFUND) == 0"
            - "GET /api/campaigns/${camp_cs}/budget-ledger shows one COMMIT of 500 and one REFUND of -500"

      - name: employer_receivable_conserved_across_suspend_and_reinstate
        grounds:
          - calculations.total_budget_invariant
          - state_machines.Employer.ACTIVE_to_SUSPENDED
          - state_machines.Employer.SUSPENDED_to_ACTIVE
          - entities.Employer.fields.balance_cents
        distinguishing_aspect: "Conserved quantity = employer receivable (a different quantity from campaign spend). Suspension then reinstatement pauses served state but must not write off the receivable: Employer.balance_cents equals the sum of that employer's BILLED SponsorEvent costs before suspension, after suspension, and after reinstatement."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE CPC campaign with daily_budget_cents 100000 and total_budget_cents 1000000 and one BILLED click of 500 cents, giving the employer a 500-cent receivable; the employer is then suspended and reinstated."
          setup_api_calls:
            - call: "POST /api/employers"
              payload: { legal_name: "RecvCo", domain: "recv.example", ats_provider: "NONE" }
              as: PlatformAdmin
              captures: { emp_rc: $.data.id }
            - call: "POST /api/job-postings"
              payload: { employer_id: "${emp_rc}", title: "Receivable Engineer", location: "Austin, TX", description_text: "Conserve receivable.", apply_mode: "HOSTED" }
              as: Employer
              as_user_id: "${emp_rc}"
              captures: { post_rc: $.data.id }
            - call: "POST /api/campaigns"
              payload: { employer_id: "${emp_rc}", name: "RC", pricing_model: "CPC", daily_budget_cents: 100000, total_budget_cents: 1000000 }
              as: Employer
              as_user_id: "${emp_rc}"
              captures: { camp_rc: $.data.id }
            - call: "POST /api/campaigns/${camp_rc}/activate"
              payload: {}
              as: Employer
              as_user_id: "${emp_rc}"
            - call: "POST /api/sponsored-jobs"
              payload: { campaign_id: "${camp_rc}", job_posting_id: "${post_rc}", cpc_bid_cents: 500, cpa_bid_cents: 900 }
              as: Employer
              as_user_id: "${emp_rc}"
              captures: { sj_rc: $.data.id }
            - call: "GET /api/campaigns/${camp_rc}"
              payload: {}
              as: Employer
              as_user_id: "${emp_rc}"
              captures: { camp_rc_v: $.data.version }
            - call: "POST /api/events"
              payload: { campaign_id: "${camp_rc}", sponsored_job_id: "${sj_rc}", event_type: "CLICK", device_fingerprint: "fp-rc-1", ip_hash: "ip-rc-1", expected_campaign_version: "${camp_rc_v}" }
              as: PlatformAdmin
            - call: "GET /api/employers/${emp_rc}"
              payload: {}
              as: PlatformAdmin
              captures: { bal_before: $.data.balance_cents }
          trigger:
            - call: "POST /api/employers/${emp_rc}/suspend"
              payload: { reason: "Account under review" }
              as: TrustReviewer
            - call: "POST /api/employers/${emp_rc}/reinstate"
              payload: {}
              as: TrustReviewer
          assert:
            - "Employer.${emp_rc}.balance_cents == 500 before suspension (${bal_before} == 500)"
            - "after suspension and reinstatement, Employer.${emp_rc}.balance_cents == 500 — the receivable is unchanged"
            - "Employer.${emp_rc}.billing_status == FROZEN while suspended and Campaign.${camp_rc}.status == PAUSED, yet no receivable was written off"
            - "the employer's BILLED SponsorEvent total remains 500"
