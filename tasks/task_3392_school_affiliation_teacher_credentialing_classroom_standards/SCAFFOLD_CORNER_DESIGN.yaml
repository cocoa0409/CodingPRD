  - section: errors
    instances:

      - name: not_found_sweep_plans_events_audits
        claim_type: Violation → Error
        grounds:
          - errors.ERR_PLAN_NOT_FOUND
          - errors.ERR_EVENT_NOT_FOUND
          - errors.ERR_AUDIT_NOT_FOUND
        distinguishing_aspect: "Three entity-specific 404s are triggerable in one sweep: unknown plan id on GET, unknown event id on attendance, unknown audit id on GET — each returns its own error_id, never a generic 404."
        test_recipe:
          setup:
            - "Empty database; clock at default."
          setup_api_calls:
            - *c_clk
          trigger:
            - call: "GET /society/improvement-plans/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AccreditationReviewer
              captures: { e1: $.data.error_id }
            - call: "POST /society/pd-events/00000000-0000-4000-8000-000000000000/attendance"
              payload: { credential_id: "00000000-0000-4000-8000-000000000001" }
              as: SocietyAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /society/classroom-audits/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Consultant
              as_user_id: "con-ada"
              captures: { e3: $.data.error_id }
          assert:
            - "e1 == ERR_PLAN_NOT_FOUND (404)"
            - "e2 == ERR_EVENT_NOT_FOUND (404): the path event id is checked before the body credential id (left-to-right path-first)"
            - "e3 == ERR_AUDIT_NOT_FOUND (404)"

