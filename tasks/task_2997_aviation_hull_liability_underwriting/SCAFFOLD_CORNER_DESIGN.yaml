        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=39]
          - errors[ERR_OVER_INSURED_VALUE]
          - calculations.depreciated_hull_value
        distinguishing_aspect: "The 120% over-insurance cap is inclusive: an agreed value of exactly 47520000 on a 2016 hull worth 66000000 new must be ACCEPTED, and 47520001 must be refused — the cap is derived from the depreciation at the SCHEDULE's effective_from year, not the clock year, so the same request accepted in a 2026-incepting schedule is refused in a 2027-incepting one."
