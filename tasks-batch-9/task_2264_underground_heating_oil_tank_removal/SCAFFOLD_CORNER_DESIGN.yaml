              as: ComplianceOfficer
              captures: { paid_status: $.data.status, reimbursed: $.data.reimbursed_amount_cents, unreimbursed: $.data.unreimbursed_balance_cents, paid_at: $.data.paid_at }
          assert:
            - "${elig} == 818500"
            - "${approved_status} == APPROVED"
            - "HTTP status == 200"
            - "${paid_status} == PAID"
            - "${reimbursed} == 818500"
            - "${unreimbursed} == 0"
            - "${paid_at} == 2026-08-06T13:00:00Z"
            - "TankProject.${proj_id}.status == CLOSED_SETTLED"
            - "InsuranceNotification.${notif_id}.status == CLOSED"
            - "Property.${prop_id}.open_project_count == 0"

      - name: new_sampling_round_is_conditional_on_no_open_change_order
        claim_type: conditional_action
        grounds:
          - state_machines.TankProject.REMEDIATION_ACTIVE_to_SAMPLING
          - validations[priority=40]
          - errors[ERR_PROJECT_STATE_INVALID]
        distinguishing_aspect: "Logging a confirmation sample on a REMEDIATION_ACTIVE project is allowed only while no change order sits in DRAFT or SUBMITTED: with one SUBMITTED change order open the create returns ERR_PROJECT_STATE_INVALID 409 and sampling_round stays 1."
        test_recipe:
          setup:
            - "One NJ project at REMEDIATION_ACTIVE after a GROSS round-1 result, sampling_round 1."
            - "One RemediationChangeOrder at status SUBMITTED on that project."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { street_address: "28 Corner Way", state_code: "NJ", county_code: "MRS", homeowner_name: "Bev Lund", homeowner_email: "bev@example.com", insurance_carrier_code: "CARR-C-28" }
              as: ProjectCoordinator
              captures: { prop_id: $.data.id }
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /tank-projects/${proj_id}/sweep-survey"
              payload: { survey_method: "GPR", tanks_detected_count: 1, tank_capacity_gallons: 550, tank_depth_to_top_inches: 60, tank_distance_to_foundation_inches: 90, tank_under_structure: false, tank_material: "STEEL" }
              as: FieldTechnician
            - call: "POST /disclosures"
              payload: { tank_project_id: "${proj_id}", disclosure_kind: "SWEEP_FINDINGS" }
              as: ProjectCoordinator
              captures: { disc_id: $.data.id }
            - call: "POST /disclosures/${disc_id}/respond"
              payload: { response: "ACKNOWLEDGED", response_channel: "PORTAL" }
              as: Homeowner
              as_user_id: "${prop_id}"
            - call: "POST /permits"
              payload: { tank_project_id: "${proj_id}", permit_type: "MUNICIPAL_DECOMMISSION" }
              as: ProjectCoordinator
              captures: { mun_permit_id: $.data.id }
            - call: "POST /permits/${mun_permit_id}/decision"
              payload: { decision: "ISSUED" }
              as: ComplianceOfficer
            - call: "POST /permits"
              payload: { tank_project_id: "${proj_id}", permit_type: "FIRE_MARSHAL_NOTIFICATION" }
              as: ProjectCoordinator
              captures: { fm_permit_id: $.data.id }
            - call: "POST /permits/${fm_permit_id}/decision"
              payload: { decision: "ISSUED" }
              as: ComplianceOfficer
            - call: "POST /crews"
              payload: { crew_name: "Crew Conditional", cert_level: "TANK_TECH_II" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { tank_project_id: "${proj_id}", crew_id: "${crew_id}", method: "REMOVAL", scheduled_start_at: "2026-08-06T13:00:00Z", scheduled_end_at: "2026-08-06T21:00:00Z" }
              as: ProjectCoordinator
              captures: { wo_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T13:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /work-orders/${wo_id}/field-events"
              payload: { event: "MOBILIZE" }
              as: FieldTechnician
            - call: "POST /work-orders/${wo_id}/field-events"
              payload: { event: "START" }
              as: FieldTechnician
            - call: "POST /work-orders/${wo_id}/field-events"
              payload: { event: "COMPLETE", actual_excavated_cubic_yards: 9.5, hauled_tons: 12.4 }
              as: FieldTechnician
            - call: "POST /laboratories"
              payload: { lab_name: "Conditional Labs", accredited: true, committed_turnaround_hours: 72, holding_time_hours: 336, max_concurrent_analyses: 2 }
              as: ComplianceOfficer
              captures: { lab_id: $.data.id }
            - call: "POST /soil-samples"
              payload: { tank_project_id: "${proj_id}", work_order_id: "${wo_id}", laboratory_id: "${lab_id}", sample_point: "TANK_BOTTOM", depth_inches: 96 }
              as: FieldTechnician
              captures: { s1_id: $.data.id }
            - call: "POST /soil-samples/${s1_id}/chain-of-custody"
              payload: { event: "DISPATCH" }
              as: FieldTechnician
            - call: "POST /soil-samples/${s1_id}/chain-of-custody"
              payload: { event: "RECEIVE" }
              as: LabAnalyst
              as_user_id: "${lab_id}"
            - call: "POST /soil-samples/${s1_id}/result"
              payload: { tph_mg_kg: 6200.0, benzene_mg_kg: 1.2 }
              as: LabAnalyst
              as_user_id: "${lab_id}"
            - call: "GET /tank-projects/${proj_id}"
              as: LicensedSiteProfessional
              captures: { pv1: $.data.version }
            - call: "POST /change-orders"
              payload: { tank_project_id: "${proj_id}", additional_cubic_yards: 3.5, unit_rate_cents: 1001, disposal_class: "NON_HAZARDOUS", expected_project_version: "${pv1}" }
              as: LicensedSiteProfessional
              as_user_id: "lsp-1"
              captures: { co_id: $.data.id }
            - call: "POST /change-orders/${co_id}/submit"
              as: LicensedSiteProfessional
              as_user_id: "lsp-1"
          trigger:
            - call: "POST /soil-samples"
              payload: { tank_project_id: "${proj_id}", work_order_id: "${wo_id}", laboratory_id: "${lab_id}", sample_point: "ROUND_TWO_FLOOR", depth_inches: 72 }
              as: FieldTechnician
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_PROJECT_STATE_INVALID"
            - "HTTP status == 409"
            - "TankProject.${proj_id}.status == REMEDIATION_ACTIVE"
            - "TankProject.${proj_id}.sampling_round == 1"
            - "TankProject.${proj_id}.contamination_class == GROSS"
            - "GET /soil-samples?tank_project_id=${proj_id} returns total_count == 1"

      - name: mobilize_action_endpoint_preconditions
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /work-orders/{id}/field-events]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / work_order_mobilize_requires_effective_fire_marshal_notice
          rationale: "That §1.8 instance drives MOBILIZE both before and after notice_effective_at, covering the action endpoint's cross-entity precondition and its success path."

  # ===========================================================================
  # Every code in §1.6 must be triggerable. The instances below carry the codes
  # that §1.8 does not already raise as an asserted outcome; the stubs at the
  # end of the section name the §1.8 instance that raises the rest. Codes that
  # §1.8 only asserts negatively (`${err} != ...`) are treated as UNCOVERED and
  # get a real trigger here: ERR_EXCAVATION_LIMIT_EXCEEDED,
  # ERR_DISCLOSURE_EXPIRED and ERR_SUPERSEDE_TARGET_INVALID.
  - section: errors
    instances:

      - name: read_endpoints_with_unknown_path_id_return_entity_specific_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DISCLOSURE_NOT_FOUND]
          - errors[ERR_PERMIT_NOT_FOUND]
          - errors[ERR_CREW_NOT_FOUND]
          - errors[ERR_WORK_ORDER_NOT_FOUND]
          - errors[ERR_LABORATORY_NOT_FOUND]
          - errors[ERR_SOIL_SAMPLE_NOT_FOUND]
          - errors[ERR_CHANGE_ORDER_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_NFA_LETTER_NOT_FOUND]
          - errors[ERR_INSURANCE_NOTIFICATION_NOT_FOUND]
          - validations[priority=30]
        distinguishing_aspect: "Each single-resource read resolves its own 404 code rather than a generic one: ten GETs against the all-zero id return ten distinct error_ids, all with HTTP 404."
        test_recipe:
          setup: ["Empty database apart from the clock; no entity of any type exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /disclosures/00000000-0000-0000-0000-000000000000"
              as: ComplianceOfficer
              captures: { e_disc: $.data.error_id }
            - call: "GET /permits/00000000-0000-0000-0000-000000000000"
              as: ComplianceOfficer
              captures: { e_permit: $.data.error_id }
            - call: "GET /crews/00000000-0000-0000-0000-000000000000"
              as: ComplianceOfficer
              captures: { e_crew: $.data.error_id }
            - call: "GET /work-orders/00000000-0000-0000-0000-000000000000"
              as: ComplianceOfficer
              captures: { e_wo: $.data.error_id }
            - call: "GET /laboratories/00000000-0000-0000-0000-000000000000"
              as: ComplianceOfficer
              captures: { e_lab: $.data.error_id }
            - call: "GET /soil-samples/00000000-0000-0000-0000-000000000000"
              as: ComplianceOfficer
              captures: { e_sample: $.data.error_id }
            - call: "GET /change-orders/00000000-0000-0000-0000-000000000000"
              as: ComplianceOfficer
              captures: { e_co: $.data.error_id }
            - call: "GET /trust-fund-claims/00000000-0000-0000-0000-000000000000"
              as: ComplianceOfficer
              captures: { e_claim: $.data.error_id }
            - call: "GET /nfa-letters/00000000-0000-0000-0000-000000000000"
              as: ComplianceOfficer
              captures: { e_nfa: $.data.error_id }
            - call: "GET /insurance-notifications/00000000-0000-0000-0000-000000000000"
              as: ComplianceOfficer
              captures: { e_notif: $.data.error_id }
          assert:
            - "${e_disc} == ERR_DISCLOSURE_NOT_FOUND"
            - "${e_permit} == ERR_PERMIT_NOT_FOUND"
            - "${e_crew} == ERR_CREW_NOT_FOUND"
            - "${e_wo} == ERR_WORK_ORDER_NOT_FOUND"
            - "${e_lab} == ERR_LABORATORY_NOT_FOUND"
            - "${e_sample} == ERR_SOIL_SAMPLE_NOT_FOUND"
            - "${e_co} == ERR_CHANGE_ORDER_NOT_FOUND"
            - "${e_claim} == ERR_CLAIM_NOT_FOUND"
            - "${e_nfa} == ERR_NFA_LETTER_NOT_FOUND"
            - "${e_notif} == ERR_INSURANCE_NOTIFICATION_NOT_FOUND"
            - "every one of the ten responses carries HTTP status 404"

      - name: request_with_no_role_header_is_unauthenticated
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=10]
        distinguishing_aspect: "A caller with no X-User-Role header is stopped at priority 10 with ERR_UNAUTHENTICATED 401 before any existence or role check runs, so the unknown project id in the path never produces a 404."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /tank-projects/00000000-0000-0000-0000-000000000000"
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"
            - "${err} != ERR_TANK_PROJECT_NOT_FOUND"

      - name: field_technician_filing_a_permit_is_forbidden
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ROLE_NOT_PERMITTED]
          - validations[priority=20]
          - rbac.ProjectCoordinator.exclusive_operations
        distinguishing_aspect: "POST /permits is exclusive to ProjectCoordinator, so a FieldTechnician is refused with ERR_ROLE_NOT_PERMITTED 403 at priority 20 — before the body is even validated, which is why the missing permit_type never yields 422."
        test_recipe:
          setup: ["One NJ project at SURVEYED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { street_address: "29 Corner Way", state_code: "NJ", county_code: "MRS", homeowner_name: "Cam Moss", homeowner_email: "cam@example.com", insurance_carrier_code: "CARR-C-29" }
              as: ProjectCoordinator
              captures: { prop_id: $.data.id }
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /tank-projects/${proj_id}/sweep-survey"
              payload: { survey_method: "GPR", tanks_detected_count: 1, tank_capacity_gallons: 550, tank_depth_to_top_inches: 60, tank_distance_to_foundation_inches: 90, tank_under_structure: false, tank_material: "STEEL" }
              as: FieldTechnician
          trigger:
            - call: "POST /permits"
              payload: { tank_project_id: "${proj_id}" }
              as: FieldTechnician
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ROLE_NOT_PERMITTED"
            - "HTTP status == 403"
            - "${err} != ERR_INVALID_REQUEST"
            - "GET /permits?tank_project_id=${proj_id} returns total_count == 0"

      - name: pagination_limit_zero_and_negative_offset_are_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_PAGINATION]
          - validations[priority=36]
        distinguishing_aspect: "limit 0 is below the [1, 100] window and offset -1 is below zero; both list reads return ERR_INVALID_PAGINATION 422 rather than an empty page."
        test_recipe:
          setup: ["Empty database apart from the clock; the codes must fire on validation, not on emptiness."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /tank-projects?limit=0&offset=0"
              as: ProjectCoordinator
              captures: { e_limit: $.data.error_id }
            - call: "GET /soil-samples?limit=10&offset=-1"
              as: ProjectCoordinator
              captures: { e_offset: $.data.error_id }
          assert:
            - "${e_limit} == ERR_INVALID_PAGINATION"
            - "${e_offset} == ERR_INVALID_PAGINATION"
            - "both responses carry HTTP status 422"

      - name: work_order_method_divergence_without_reason_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_METHOD_OVERRIDE_REASON_REQUIRED]
          - validations[priority=62]
        distinguishing_aspect: "recommended_method is REMOVAL, so booking ABANDONMENT_IN_PLACE with no method_override_reason returns ERR_METHOD_OVERRIDE_REASON_REQUIRED 422 and no work order is created — the mirror image of the satisfaction case."
        test_recipe:
          setup: ["One NJ project at SURVEYED (method_score 36.00, recommended_method REMOVAL) and one Crew."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { street_address: "30 Corner Way", state_code: "NJ", county_code: "MRS", homeowner_name: "Dot Nunn", homeowner_email: "dot@example.com", insurance_carrier_code: "CARR-C-30" }
              as: ProjectCoordinator
              captures: { prop_id: $.data.id }
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /tank-projects/${proj_id}/sweep-survey"
              payload: { survey_method: "GPR", tanks_detected_count: 1, tank_capacity_gallons: 550, tank_depth_to_top_inches: 60, tank_distance_to_foundation_inches: 90, tank_under_structure: false, tank_material: "STEEL" }
              as: FieldTechnician
            - call: "POST /crews"
              payload: { crew_name: "Crew No Reason", cert_level: "TANK_TECH_II" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { tank_project_id: "${proj_id}", crew_id: "${crew_id}", method: "ABANDONMENT_IN_PLACE", scheduled_start_at: "2026-08-06T13:00:00Z", scheduled_end_at: "2026-08-06T21:00:00Z" }
              as: ProjectCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_METHOD_OVERRIDE_REASON_REQUIRED"
            - "HTTP status == 422"
            - "GET /work-orders?tank_project_id=${proj_id} returns total_count == 0"

      - name: second_pending_sweep_disclosure_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_DISCLOSURE]
          - validations[priority=75]
        distinguishing_aspect: "Uniqueness is scoped to (tank_project_id, disclosure_kind) over PENDING rows only, so a second SWEEP_FINDINGS notice while the first is still PENDING returns ERR_DUPLICATE_DISCLOSURE 409 and the project keeps exactly one disclosure."
        test_recipe:
          setup: ["One NJ project at SURVEYED with one PENDING SWEEP_FINDINGS disclosure."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { street_address: "31 Corner Way", state_code: "NJ", county_code: "MRS", homeowner_name: "Eli Ochs", homeowner_email: "eli@example.com", insurance_carrier_code: "CARR-C-31" }
              as: ProjectCoordinator
              captures: { prop_id: $.data.id }
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /tank-projects/${proj_id}/sweep-survey"
              payload: { survey_method: "GPR", tanks_detected_count: 1, tank_capacity_gallons: 550, tank_depth_to_top_inches: 60, tank_distance_to_foundation_inches: 90, tank_under_structure: false, tank_material: "STEEL" }
              as: FieldTechnician
            - call: "POST /disclosures"
              payload: { tank_project_id: "${proj_id}", disclosure_kind: "SWEEP_FINDINGS" }
              as: ProjectCoordinator
              captures: { disc_id: $.data.id, exp: $.data.expires_at }
          trigger:
            - call: "POST /disclosures"
              payload: { tank_project_id: "${proj_id}", disclosure_kind: "SWEEP_FINDINGS" }
              as: ProjectCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${exp} == 2026-08-06T08:00:00Z"
            - "${err} == ERR_DUPLICATE_DISCLOSURE"
            - "HTTP status == 409"
            - "GET /disclosures?tank_project_id=${proj_id} returns total_count == 1"
            - "HomeownerDisclosure.${disc_id}.status == PENDING"

      - name: second_open_work_order_on_the_same_project_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_WORK_ORDER_ALREADY_OPEN]
          - validations[priority=76]
        distinguishing_aspect: "The second booking uses a different crew, so the priority-65 buffered overlap check cannot fire; the refusal is the priority-76 one-open-work-order-per-project rule with ERR_WORK_ORDER_ALREADY_OPEN 409."
        test_recipe:
          setup: ["One NJ project at SURVEYED, two distinct Crews, and one SCHEDULED work order held by the first crew."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { street_address: "32 Corner Way", state_code: "NJ", county_code: "MRS", homeowner_name: "Fia Prem", homeowner_email: "fia@example.com", insurance_carrier_code: "CARR-C-32" }
              as: ProjectCoordinator
              captures: { prop_id: $.data.id }
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /tank-projects/${proj_id}/sweep-survey"
              payload: { survey_method: "GPR", tanks_detected_count: 1, tank_capacity_gallons: 550, tank_depth_to_top_inches: 60, tank_distance_to_foundation_inches: 90, tank_under_structure: false, tank_material: "STEEL" }
              as: FieldTechnician
            - call: "POST /crews"
              payload: { crew_name: "Crew Already Open A", cert_level: "TANK_TECH_II" }
              as: ProjectCoordinator
              captures: { crew_a: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Crew Already Open B", cert_level: "TANK_TECH_II" }
              as: ProjectCoordinator
              captures: { crew_b: $.data.id }
            - call: "POST /work-orders"
              payload: { tank_project_id: "${proj_id}", crew_id: "${crew_a}", method: "REMOVAL", scheduled_start_at: "2026-08-06T13:00:00Z", scheduled_end_at: "2026-08-06T21:00:00Z" }
              as: ProjectCoordinator
              captures: { wo_a: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { tank_project_id: "${proj_id}", crew_id: "${crew_b}", method: "REMOVAL", scheduled_start_at: "2026-08-20T13:00:00Z", scheduled_end_at: "2026-08-20T21:00:00Z" }
              as: ProjectCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_WORK_ORDER_ALREADY_OPEN"
            - "HTTP status == 409"
            - "${err} != ERR_CREW_BOOKING_CONFLICT"
            - "GET /work-orders?tank_project_id=${proj_id} returns total_count == 1"
            - "DecommissionWorkOrder.${wo_a}.field_status == SCHEDULED"

      - name: homeowner_response_after_the_disclosure_window_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DISCLOSURE_EXPIRED]
          - validations[priority=53]
          - entities.HomeownerDisclosure.fields.expires_at
        distinguishing_aspect: "The correct homeowner responds one second after expires_at = sent_at + 72h, so the row is flipped to EXPIRED and the request is refused with ERR_DISCLOSURE_EXPIRED 409 — the project stays SURVEYED instead of advancing to DISCLOSED."
        test_recipe:
          setup: ["One NJ project at SURVEYED with a PENDING SWEEP_FINDINGS disclosure sent at 2026-08-03T08:00:00Z (expires 2026-08-06T08:00:00Z); the clock is then moved one second past expiry."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { street_address: "33 Corner Way", state_code: "NJ", county_code: "MRS", homeowner_name: "Gil Roth", homeowner_email: "gil@example.com", insurance_carrier_code: "CARR-C-33" }
              as: ProjectCoordinator
              captures: { prop_id: $.data.id }
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}" }
              as: ProjectCoordinator
