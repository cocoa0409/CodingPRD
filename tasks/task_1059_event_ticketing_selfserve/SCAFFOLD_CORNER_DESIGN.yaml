            - "total_count == 2"
            - "has_more == true"
            - "len(data) == 1"
            - "no returned row has buyer_id == ${b2_id}"

      - name: corner_cascading_side_effects_covered_by_difficulty_index
        claim_type: cascading_side_effects
        grounds: [state_machines.RefundRequest.APPROVED_to_SETTLED]
        excluded_because:
          difficulty_instance: transitive_cascade / refund_settle_drives_order_then_payout_recompute_then_hold
          rationale: "The 4-hop settle cascade into Order, Organizer and Payout is asserted end-to-end by that §1.8 instance."

      - name: corner_rate_threshold_triggers_covered_by_difficulty_index
        claim_type: rate_threshold_triggers
        grounds: [calculations.promo_discount]
        excluded_because:
          difficulty_instance: boundary_precision_check / promo_min_subtotal_is_inclusive_at_exactly_5000_cents
          rationale: "The PROMO_MIN_SUBTOTAL_CENTS breakpoint at 5000 versus 4999 is asserted by that §1.8 instance."

  - section: consistency_model
    instances:

      - name: corner_pay_response_reflects_every_side_effect_immediately
        claim_type: immediate
        grounds: [state_machines.Order.PENDING_to_PAID, entities.Organizer.fields.lifetime_gross_cents, entities.Event.fields.issued_count]
        distinguishing_aspect: "consistency_model is immediate: the very response to POST /api/orders/{id}/pay already shows fulfillment_status ISSUED, and reads issued in the same test see sold_count 2, Event.issued_count 2 and Organizer.lifetime_gross_cents 10000 with no settling delay."
        test_recipe:
          setup:
            - "ONSALE Event E (PASS_ON) with GA TicketType T priced 5000, quantity_total 10."
            - "Buyer B holds an unpaid Order for 2 tickets."
          setup_api_calls:
            - call: "POST /api/organizers"
              payload: { display_name: "Immediate Co", contact_email: "ops@immediate.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Immediate Hall", city: "Missoula", seated_capacity: 60 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { venue_id: $.data.id }
            - call: "POST /api/events"
              payload: { organizer_id: "${org_id}", venue_id: "${venue_id}", title: "Immediate Night", starts_at: "2026-10-25T18:00:00Z", ends_at: "2026-10-25T22:00:00Z", fee_mode: "PASS_ON", refund_policy: "FEE_RETAINED" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /api/ticket-types"
              payload: { event_id: "${ev_id}", name: "General", tier_rank: 1, price_cents: 5000, quantity_total: 10, seating_mode: "GA" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { tt_id: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { ev_v1: $.data.version }
            - call: "POST /api/buyers"
              payload: { email: "quill@example.com", display_name: "Quill" }
              as: Anonymous
              captures: { buyer_id: $.data.id }
            - call: "POST /api/orders"
              payload: { event_id: "${ev_id}", buyer_id: "${buyer_id}", items: [{ ticket_type_id: "${tt_id}", quantity: 2 }], expected_event_version: "${ev_v1}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /api/orders/${order_id}/pay"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { paid_status: $.data.payment_status, fulfil_status: $.data.fulfillment_status }
          assert:
            - "the pay response itself has data.payment_status == PAID and data.fulfillment_status == ISSUED"
            - "TicketType.${tt_id}.sold_count == 2"
            - "TicketType.${tt_id}.held_count == 0"
            - "Event.${ev_id}.issued_count == 2"
            - "Event.${ev_id}.gross_cents == 10000"
            - "Organizer.${org_id}.lifetime_gross_cents == 10000"
            - "GET /api/attendees?order_id=${order_id} returns total_count == 2"
