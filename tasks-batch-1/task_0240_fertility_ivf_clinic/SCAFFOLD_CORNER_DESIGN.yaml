      - name: embryologist_cannot_create_cycle
        claim_type: peer_roles
        grounds: [roles, "errors[ERR_FORBIDDEN_ROLE]", endpoints]
        distinguishing_aspect: "Embryologist calling POST /cycles (Nurse exclusive) -> ERR_FORBIDDEN_ROLE 403; peer roles do not overlap."
