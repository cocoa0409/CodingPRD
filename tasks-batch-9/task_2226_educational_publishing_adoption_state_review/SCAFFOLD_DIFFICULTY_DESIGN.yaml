              payload: { submission_id: "${sub_id}", base_price_cents: 10000, term_years: 1, annual_escalator_bps: 0, projected_adoption_units: 5000, digital_seat_price_cents: 1500, expected_submission_version: "${sub_v2}" }
              as: PricingManager
              captures: { prop_at_id: $.data.id }
          assert:
