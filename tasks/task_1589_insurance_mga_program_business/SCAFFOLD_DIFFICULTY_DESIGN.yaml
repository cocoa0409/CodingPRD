            - "after flat cancel + run-daily: program.consumed_aggregate_cents == 0 AND tranche.consumed_cents == 0 (compensating action restores the conserved quantities exactly; earned == 0 because cancellation_date == effective_from)"
            - "tranche status back to ACTIVE (EXHAUSTED would have flipped only at exact fit; here 300000 was never reached)"
            - "Policy.${pol}.capacity_released_cents == 155000 (retained for possible reinstatement)"

      - name: trust_balance_conserved_under_collect_then_refund
        grounds:
          - state_machines.Policy.PENDING_CANCELLATION_to_CANCELLED
          - entities.Program.fields.trust_balance_cents
          - entities.TrustLedgerEntry.fields.running_balance_cents
        distinguishing_aspect: |
          Conserved quantity = trust dollars (different from capacity units): a
          COLLECTION of 155000 followed by the flat-cancel REFUND of 155000 leaves
          program.trust_balance_cents == 0 and sum(entry amounts) == 0 — the ledger
          shows both compensating entries with running balances 155000 then 0.
        test_recipe:
          setup:
            - "ACTIVE program; policy gross 155000 bound and fully collected (trust 155000)"
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier CI2", naic_code: "NAIC-CI2", contact_email: "uw@ci2.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
