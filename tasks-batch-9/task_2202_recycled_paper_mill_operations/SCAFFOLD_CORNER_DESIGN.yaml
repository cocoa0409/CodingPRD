  # ===========================================================================
  # CONSISTENCY MODEL — `immediate`: every derived field, cascade hop and ledger
  # figure is visible in the SAME response that caused it, with no re-read lag.
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: the_response_to_a_write_already_carries_every_derived_field_it_caused
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.pulp_yield_final
          - calculations.solids_ledger_balance
          - endpoints.POST_pulp_batches_id_clean.side_effects
        distinguishing_aspect: "consistency_model is `immediate`, so the 201/200 body of the clean and approve calls must already contain the recomputed figures — measured_reject_tons 2.000 at CLEANED and final_accepted_tons 18.000, yield_variance_tons 1.120, available_tons 18.000 at APPROVED — and the PULP_REJECT ledger row must be visible to a GET issued immediately afterwards with no settling period. A byte-for-byte comparison of the write body against an immediate re-read is the falsifier: any field that differs proves a deferred recomputation."
        test_recipe:
          setup: ["A PULPING batch charging 20.000 tons of a 2.00%-contamination OCC_11 lot, screened and ready to clean."]
