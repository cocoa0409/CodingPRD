# =============================================================================
# §1.8 Scaffold Difficulty Design — Military Household Goods Move & PCS Entitlement
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only. Every numeric assert below
# was produced by executing the §1.3 formula with its declared constants.
# Logical clock default before any /_clock/set_current_utc call: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: billable_weight_provisional_estimate_replaced_by_final_actual
        grounds:
          - calculations.shipment_billable_weight
          - calculations.survey_estimated_gross_weight
          - calculations.entitlement_excess_weight_and_cost
          - state_machines.Shipment.PENDING_to_ESTIMATED
          - state_machines.Shipment.ESTIMATED_to_ACTUAL_RECORDED
          - entities.Shipment.fields.billable_basis
        distinguishing_aspect: >-
          This instance exercises the two variants of shipment_billable_weight in the WEIGHT
          domain: the PROVISIONAL_ESTIMATED variant charges 5286 lb derived from survey cube,
          the FINAL_ACTUAL variant charges 4700 lb derived from certified scale tickets, and the
          entitlement ledger must REPLACE rather than accumulate (charged goes 5286 -> 4700, never
          9986).
        test_recipe:
          setup:
            - "Clock at 2026-08-03T00:00:00Z."
            - "E6 member with 2 dependents and a spouse; PCS_CONUS orders, 1200 miles, market MKT-BWI."
            - "Counseling completed and entitlement AUTHORIZED with no admin bump: total_billable_cap_lbs == 11000."
            - "One HHG shipment booked against that entitlement, surveyed with 4 rooms."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /hhg/service-members"
              payload: { dod_id: "1000000006", full_name: "Dana Reyes", rank_code: "E6", branch: "ARMY", email: "dana.reyes@example.mil", dependents_count: 2, spouse_present: true }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { m_id: $.data.id }
            - call: "POST /hhg/orders"
              payload: { service_member_id: "${m_id}", order_number: "ORD-2296-0001", move_type: "PCS_CONUS", issue_date: "2026-08-01T00:00:00Z", report_no_later_than_date: "2026-10-01T00:00:00Z", origin_duty_station: "FORT MEADE MD", destination_duty_station: "FORT CARSON CO", origin_market_code: "MKT-BWI", distance_miles: 1200 }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { o_id: $.data.id }
            - call: "POST /hhg/counseling-sessions"
              payload: { order_id: "${o_id}", session_type: "IN_PERSON", scheduled_at: "2026-08-05T00:00:00Z" }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { cs_id: $.data.id }
            - call: "POST /hhg/counseling-sessions/${cs_id}/complete"
              payload: { entitlement_briefed: true }
              as: MoveCounselor
              as_user_id: "counselor-01"
            - call: "GET /hhg/counseling-sessions/${cs_id}/entitlements"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { ent_id: "$.data[0].id" }
            - call: "POST /hhg/entitlements/${ent_id}/authorize"
              payload: { admin_weight_bump_lbs: 0 }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { ent_v: $.data.version }
            - call: "POST /hhg/tsps"
              payload: { name: "Chesapeake Van Lines", scac_code: "CVLQ", markets: ["MKT-BWI"] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { tsp_id: $.data.id }
            - call: "POST /hhg/shipments"
              payload: { order_id: "${o_id}", entitlement_id: "${ent_id}", tsp_id: "${tsp_id}", shipment_code: "SHP-0001", shipment_method: "HHG", origin_market_code: "MKT-BWI", requested_pack_date: "2026-08-14T00:00:00Z", requested_pickup_date: "2026-08-17T00:00:00Z", requested_delivery_date: "2026-08-24T00:00:00Z", expected_entitlement_version: "${ent_v}" }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { s1_id: $.data.id }
            - call: "POST /hhg/shipments/${s1_id}/survey"
              payload: { estimate_method: "CUBE_X7", room_estimates: [{ room_name: "KITCHEN", cube_feet: 143.5 }, { room_name: "LIVING_ROOM", cube_feet: 268.25 }, { room_name: "MASTER_BEDROOM", cube_feet: 210.5 }, { room_name: "GARAGE", cube_feet: 96.75 }] }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
              captures: { est_lbs: $.data.estimated_gross_lbs }
          trigger:
            - call: "POST /hhg/shipments/${s1_id}/record-actual-weight"
              payload: { actual_gross_lbs: 6200, actual_tare_lbs: 1500, weigh_date: "2026-08-03T00:00:00Z", scale_certified: true }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
          assert:
            - "before the trigger: Shipment.${s1_id}.estimated_gross_lbs == 5286 and billable_weight_lbs == 5286 and billable_basis == ESTIMATED"
            - "before the trigger: EntitlementAuthorization.${ent_id}.charged_billable_weight_lbs == 5286"
            - "after the trigger: Shipment.${s1_id}.net_actual_lbs == 4700 and billable_weight_lbs == 4700 and billable_basis == ACTUAL"
            - "after the trigger: Shipment.${s1_id}.weight_recon_status == ACTUAL_RECORDED and movement_status == SURVEYED"
            - "after the trigger: EntitlementAuthorization.${ent_id}.charged_billable_weight_lbs == 4700 (replacement, not 9986)"
            - "after the trigger: EntitlementAuthorization.${ent_id}.excess_weight_lbs == 0 and gross_excess_cost_usd == 0.00"
            - "after the trigger: Shipment.${s1_id}.reweigh_required == false (4700 <= 5286 * 1.10)"

      - name: claim_settlement_frv_versus_depreciated_on_identical_item_set
        grounds:
          - calculations.claim_settlement_valuation
          - state_machines.LossDamageClaim.DRAFT_to_SUBMITTED
          - state_machines.LossDamageClaim.UNDER_REVIEW_to_SETTLED
          - entities.LossDamageClaim.fields.settlement_basis
          - entities.ClaimItem.fields.depreciation_rate_pct_per_year
        distinguishing_aspect: >-
          This instance exercises the two variants of claim_settlement_valuation in the MONEY
          domain on two claims that carry byte-identical item sets on the same delivered shipment:
          the claim filed 42 days after delivery settles FULL_REPLACEMENT_VALUE at 5100.00 while
          the claim filed 314 days after delivery settles DEPRECIATED_VALUE at 3120.00, a delta of
          1980.00 produced purely by the basis selected at filing time.
        test_recipe:
          setup:
            - "Clock starts at 2026-08-03T00:00:00Z; the shipment is driven all the way to DELIVERED on 2026-08-20."
            - "Two claims are opened on that one shipment on 2026-09-01, each with the same two items (ELECTRONICS 4200.00 age 3 documented, CLOTHING 900.00 age 5 undocumented)."
            - "Claim A is filed on 2026-10-01 (42 days) and Claim B on 2027-06-30 (314 days)."
            - "Every item is dispositioned ALLOWED by examiner-01, who then hands settlement to examiner-02 (segregation of duties)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /hhg/service-members"
              payload: { dod_id: "1000000106", full_name: "Dana Reyes", rank_code: "E6", branch: "ARMY", email: "dana.reyes@example.mil", dependents_count: 2, spouse_present: true }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { m_id: $.data.id }
            - call: "POST /hhg/orders"
              payload: { service_member_id: "${m_id}", order_number: "ORD-2296-0002", move_type: "PCS_CONUS", issue_date: "2026-08-01T00:00:00Z", report_no_later_than_date: "2026-10-01T00:00:00Z", origin_duty_station: "FORT MEADE MD", destination_duty_station: "FORT CARSON CO", origin_market_code: "MKT-BWI", distance_miles: 1200 }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { o_id: $.data.id }
            - call: "POST /hhg/counseling-sessions"
              payload: { order_id: "${o_id}", session_type: "IN_PERSON", scheduled_at: "2026-08-05T00:00:00Z" }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { cs_id: $.data.id }
            - call: "POST /hhg/counseling-sessions/${cs_id}/complete"
              payload: { entitlement_briefed: true }
              as: MoveCounselor
              as_user_id: "counselor-01"
            - call: "GET /hhg/counseling-sessions/${cs_id}/entitlements"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { ent_id: "$.data[0].id" }
            - call: "POST /hhg/entitlements/${ent_id}/authorize"
              payload: { admin_weight_bump_lbs: 0 }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { ent_v: $.data.version }
            - call: "POST /hhg/tsps"
              payload: { name: "Chesapeake Van Lines", scac_code: "CVLQ", markets: ["MKT-BWI"] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { tsp_id: $.data.id }
            - call: "POST /hhg/shipments"
              payload: { order_id: "${o_id}", entitlement_id: "${ent_id}", tsp_id: "${tsp_id}", shipment_code: "SHP-0002", shipment_method: "HHG", origin_market_code: "MKT-BWI", requested_pack_date: "2026-08-14T00:00:00Z", requested_pickup_date: "2026-08-17T00:00:00Z", requested_delivery_date: "2026-08-24T00:00:00Z", expected_entitlement_version: "${ent_v}" }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { s_id: $.data.id }
            - call: "POST /hhg/shipments/${s_id}/survey"
              payload: { estimate_method: "CUBE_X7", room_estimates: [{ room_name: "KITCHEN", cube_feet: 143.5 }, { room_name: "LIVING_ROOM", cube_feet: 268.25 }, { room_name: "MASTER_BEDROOM", cube_feet: 210.5 }, { room_name: "GARAGE", cube_feet: 96.75 }] }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
            - call: "POST /hhg/capacity-blocks"
              payload: { tsp_id: "${tsp_id}", market_code: "MKT-BWI", week_start_date: "2026-08-17T00:00:00Z", total_capacity_lbs: 12000, short_notice_reserve_pct: 0.15 }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
              captures: { cb_id: $.data.id, cb_v: $.data.version }
            - call: "POST /hhg/capacity-blocks/${cb_id}/awards"
              payload: { shipment_id: "${s_id}", expected_capacity_block_version: "${cb_v}" }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
            - call: "POST /hhg/shipments/${s_id}/pack"
              payload: { pack_date: "2026-08-15T00:00:00Z" }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
            - call: "POST /hhg/shipments/${s_id}/record-actual-weight"
              payload: { actual_gross_lbs: 6200, actual_tare_lbs: 1500, weigh_date: "2026-08-17T00:00:00Z", scale_certified: true }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
            - call: "POST /hhg/shipments/${s_id}/pickup"
              payload: { actual_pickup_date: "2026-08-17T00:00:00Z" }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
            - call: "POST /hhg/shipments/${s_id}/deliver"
              payload: { delivery_date: "2026-08-20T00:00:00Z" }
              as: TspCoordinator
              as_user_id: "${tsp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /hhg/shipments/${s_id}/claims"
              payload: { claim_type: "DAMAGE", notice_date: "2026-09-01T00:00:00Z", incident_description: "Television and uniforms damaged in transit (claim A)" }
              as: ServiceMember
              as_user_id: "${m_id}"
              captures: { claim_a: $.data.id }
            - call: "POST /hhg/claims/${claim_a}/claim-items"
              payload: { item_description: "65 inch television", inventory_item_number: "0142", category: "ELECTRONICS", replacement_cost_usd: 4200.00, age_years: 3, high_value_inventory_documented: true }
              as: ServiceMember
              as_user_id: "${m_id}"
              captures: { item_a1: $.data.id }
            - call: "POST /hhg/claims/${claim_a}/claim-items"
              payload: { item_description: "Service dress uniforms", inventory_item_number: "0143", category: "CLOTHING", replacement_cost_usd: 900.00, age_years: 5, high_value_inventory_documented: false }
              as: ServiceMember
              as_user_id: "${m_id}"
              captures: { item_a2: $.data.id }
            - call: "POST /hhg/shipments/${s_id}/claims"
              payload: { claim_type: "DAMAGE", notice_date: "2026-09-01T00:00:00Z", incident_description: "Television and uniforms damaged in transit (claim B)" }
              as: ServiceMember
              as_user_id: "${m_id}"
              captures: { claim_b: $.data.id }
            - call: "POST /hhg/claims/${claim_b}/claim-items"
              payload: { item_description: "65 inch television", inventory_item_number: "0242", category: "ELECTRONICS", replacement_cost_usd: 4200.00, age_years: 3, high_value_inventory_documented: true }
              as: ServiceMember
              as_user_id: "${m_id}"
              captures: { item_b1: $.data.id }
            - call: "POST /hhg/claims/${claim_b}/claim-items"
              payload: { item_description: "Service dress uniforms", inventory_item_number: "0243", category: "CLOTHING", replacement_cost_usd: 900.00, age_years: 5, high_value_inventory_documented: false }
              as: ServiceMember
              as_user_id: "${m_id}"
              captures: { item_b2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /hhg/claims/${claim_a}/submit"
              payload: {}
              as: ServiceMember
              as_user_id: "${m_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /hhg/claims/${claim_b}/submit"
              payload: {}
              as: ServiceMember
              as_user_id: "${m_id}"
            - call: "POST /hhg/claims/${claim_a}/review"
              payload: { review_note: "Basis fixed at filing" }
              as: ClaimsExaminer
              as_user_id: "examiner-01"
            - call: "POST /hhg/claims/${claim_b}/review"
              payload: { review_note: "Basis fixed at filing" }
              as: ClaimsExaminer
              as_user_id: "examiner-01"
            - call: "POST /hhg/claim-items/${item_a1}/disposition"
              payload: { disposition: "ALLOWED" }
              as: ClaimsExaminer
              as_user_id: "examiner-01"
            - call: "POST /hhg/claim-items/${item_a2}/disposition"
              payload: { disposition: "ALLOWED" }
              as: ClaimsExaminer
              as_user_id: "examiner-01"
            - call: "POST /hhg/claim-items/${item_b1}/disposition"
              payload: { disposition: "ALLOWED" }
              as: ClaimsExaminer
              as_user_id: "examiner-01"
            - call: "POST /hhg/claim-items/${item_b2}/disposition"
              payload: { disposition: "ALLOWED" }
              as: ClaimsExaminer
              as_user_id: "examiner-01"
          trigger:
            - call: "POST /hhg/claims/${claim_a}/settle"
              payload: { settlement_note: "Full replacement value" }
              as: ClaimsExaminer
              as_user_id: "examiner-02"
            - call: "POST /hhg/claims/${claim_b}/settle"
              payload: { settlement_note: "Depreciated value" }
              as: ClaimsExaminer
              as_user_id: "examiner-02"
          assert:
            - "LossDamageClaim.${claim_a}.filing_window_days == 42 and settlement_basis == FULL_REPLACEMENT_VALUE"
            - "LossDamageClaim.${claim_b}.filing_window_days == 314 and settlement_basis == DEPRECIATED_VALUE"
            - "ClaimItem.${item_a1}.item_settlement_usd == 4200.00 and ClaimItem.${item_a2}.item_settlement_usd == 900.00"
            - "ClaimItem.${item_b1}.item_settlement_usd == 2940.00 and ClaimItem.${item_b2}.item_settlement_usd == 180.00"
            - "LossDamageClaim.${claim_a}.settlement_total_usd == 5100.00"
            - "LossDamageClaim.${claim_b}.settlement_total_usd == 3120.00"
            - "LossDamageClaim.${claim_a}.settlement_total_usd - LossDamageClaim.${claim_b}.settlement_total_usd == 1980.00"

      - name: ppm_reimbursement_incentive_versus_actual_expense_basis
        grounds:
          - calculations.ppm_reimbursement
          - state_machines.PpmSubmission.SUBMITTED_to_APPROVED
          - entities.PpmSubmission.fields.applied_basis
          - entities.PpmSubmission.fields.taxable_amount_usd
          - validations[priority=52]
        distinguishing_aspect: >-
          This instance exercises the two variants of ppm_reimbursement in the REIMBURSEMENT domain
          on two submissions carrying identical weight tickets against one PPM shipment: the packet
          with 1200.00 of receipts is settled on INCENTIVE_BASIS at 6084.18 with 4884.18 taxable,
          while the packet with 6300.00 of receipts is settled on ACTUAL_EXPENSE_BASIS at 6300.00
          with 0.00 taxable — the basis is chosen by AUTO comparison, not by the client.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T00:00:00Z; E6 member with dependents, cap 11000 lb, 1200-mile PCS_CONUS orders."
            - "One shipment with shipment_method PPM and no other shipment charging the entitlement."
            - "Two PPM packets on that shipment, identical trip tickets (3800 + 3400 = 7200 lb moved), 2000.00 advance."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /hhg/service-members"
              payload: { dod_id: "1000000206", full_name: "Dana Reyes", rank_code: "E6", branch: "ARMY", email: "dana.reyes@example.mil", dependents_count: 2, spouse_present: true }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { m_id: $.data.id }
            - call: "POST /hhg/orders"
              payload: { service_member_id: "${m_id}", order_number: "ORD-2296-0003", move_type: "PCS_CONUS", issue_date: "2026-08-01T00:00:00Z", report_no_later_than_date: "2026-10-01T00:00:00Z", origin_duty_station: "FORT MEADE MD", destination_duty_station: "FORT CARSON CO", origin_market_code: "MKT-BWI", distance_miles: 1200 }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { o_id: $.data.id }
            - call: "POST /hhg/counseling-sessions"
              payload: { order_id: "${o_id}", session_type: "IN_PERSON", scheduled_at: "2026-08-05T00:00:00Z" }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { cs_id: $.data.id }
            - call: "POST /hhg/counseling-sessions/${cs_id}/complete"
              payload: { entitlement_briefed: true }
              as: MoveCounselor
              as_user_id: "counselor-01"
            - call: "GET /hhg/counseling-sessions/${cs_id}/entitlements"
              payload: {}
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { ent_id: "$.data[0].id" }
            - call: "POST /hhg/entitlements/${ent_id}/authorize"
              payload: { admin_weight_bump_lbs: 0 }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { ent_v: $.data.version }
            - call: "POST /hhg/tsps"
              payload: { name: "Chesapeake Van Lines", scac_code: "CVLQ", markets: ["MKT-BWI"] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { tsp_id: $.data.id }
            - call: "POST /hhg/shipments"
              payload: { order_id: "${o_id}", entitlement_id: "${ent_id}", tsp_id: "${tsp_id}", shipment_code: "SHP-0003-PPM", shipment_method: "PPM", origin_market_code: "MKT-BWI", requested_pack_date: "2026-08-14T00:00:00Z", requested_pickup_date: "2026-08-17T00:00:00Z", requested_delivery_date: "2026-08-24T00:00:00Z", expected_entitlement_version: "${ent_v}" }
              as: MoveCounselor
              as_user_id: "counselor-01"
              captures: { s_id: $.data.id }
            - call: "POST /hhg/shipments/${s_id}/ppm-submissions"
              payload: { trip_tickets: [{ trip_number: 1, full_lbs: 9200, empty_lbs: 5400, ticket_source: "CERTIFIED_SCALE", certified: true }, { trip_number: 2, full_lbs: 8600, empty_lbs: 5200, ticket_source: "CERTIFIED_SCALE", certified: true }], documented_expenses_usd: 1200.00, advance_paid_usd: 2000.00, elected_basis: "AUTO" }
              as: ServiceMember
              as_user_id: "${m_id}"
              captures: { ppm_low: $.data.id }
            - call: "POST /hhg/shipments/${s_id}/ppm-submissions"
              payload: { trip_tickets: [{ trip_number: 1, full_lbs: 9200, empty_lbs: 5400, ticket_source: "CERTIFIED_SCALE", certified: true }, { trip_number: 2, full_lbs: 8600, empty_lbs: 5200, ticket_source: "CERTIFIED_SCALE", certified: true }], documented_expenses_usd: 6300.00, advance_paid_usd: 2000.00, elected_basis: "AUTO" }
              as: ServiceMember
              as_user_id: "${m_id}"
              captures: { ppm_high: $.data.id }
          trigger:
            - call: "POST /hhg/ppm-submissions/${ppm_low}/approve"
              payload: { approval_note: "Low receipts packet" }
              as: MoveCounselor
              as_user_id: "counselor-01"
            - call: "POST /hhg/ppm-submissions/${ppm_high}/approve"
              payload: { approval_note: "High receipts packet" }
              as: MoveCounselor
              as_user_id: "counselor-01"
          assert:
            - "PpmSubmission.${ppm_low}.moved_weight_lbs == 7200 and allowable_weight_lbs == 7200 and gcc_usd == 6404.40"
            - "PpmSubmission.${ppm_low}.incentive_usd == 6084.18 and applied_basis == INCENTIVE_BASIS"
            - "PpmSubmission.${ppm_low}.reimbursement_usd == 6084.18 and net_payable_usd == 4084.18 and debt_owed_usd == 0.00 and taxable_amount_usd == 4884.18"
            - "PpmSubmission.${ppm_high}.gcc_usd == 6404.40 and incentive_usd == 6084.18"
            - "PpmSubmission.${ppm_high}.applied_basis == ACTUAL_EXPENSE_BASIS and reimbursement_usd == 6300.00"
            - "PpmSubmission.${ppm_high}.net_payable_usd == 4300.00 and debt_owed_usd == 0.00 and taxable_amount_usd == 0.00"
            - "PpmSubmission.${ppm_high}.reimbursement_usd - PpmSubmission.${ppm_low}.reimbursement_usd == 215.82"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: survey_estimate_rounds_each_room_before_summing_and_uplifting
        grounds:
          - calculations.survey_estimated_gross_weight
