      - name: validation_shape_check_outranks_existence_state_and_business_checks
        claim_type: Priority conflict
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - validations[priority=8]
          - validations[priority=10]
          - validations[priority=21]
          - validations[priority=39]
          - errors.ERR_VALIDATION
        distinguishing_aspect: |
          The four validation bands are strictly ordered and each boundary is observable in one call:
          a malformed payload that ALSO names a nonexistent cedent is 422 ERR_VALIDATION, not 404
          ERR_CEDENT_NOT_FOUND; an action on a nonexistent program is 404 ERR_PROGRAM_NOT_FOUND before
          any state test; and go-to-market on a DRAFT program whose cedent is also SUSPENDED reports
          the state error at priority 21, not the business-safety error at priority 39.
        test_recipe:
          setup:
            - "A DRAFT program for a cedent that is then suspended, so the program simultaneously fails the state rule and the cedent-posture rule."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
