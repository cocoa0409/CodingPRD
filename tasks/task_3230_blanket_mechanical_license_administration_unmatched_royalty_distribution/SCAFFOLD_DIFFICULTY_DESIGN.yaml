            - "UsageLine.${l2}.status == DISPUTE_HELD (hop 2: the claim fold-in freezes the line, caused by the dispute open not by any direct line call)"
            - "Claim.${cl2}.status == DISPUTED and Dispute.${d0}.claim_ids[0] == ${cl2}"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: stale_version_masks_share_overflow
        grounds:
          - validations[priority=10]
          - validations[priority=16]
          - concurrency_rules[share-create-stale-work]
        distinguishing_aspect: |
          Pair business_fiscal (priority 16, OCC stale version) vs
          business_constraint (priority 10, share sum): a share create that
          BOTH overflows the 100% cap AND carries a stale expected_work_version
          must surface ERR_STALE_VERSION only because 10 < 16 — the constraint
          check wins by priority ordering.
        test_recipe:
          setup:
            - "Clock 2026-09-01; work 'Kestrel' with an ACTIVE 100% share (version advanced to 2 by the share create)"
            - "Member B exists"
          setup_api_calls:
            - call: "POST /mlc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MLCAdministrator
            - call: "POST /mlc/members"
              payload: { legal_name: "Alder Publishing", member_type: "PUBLISHER", ipi_number: "00000000101" }
              as: MLCAdministrator
              captures: { m_a: $.data.id }
            - call: "POST /mlc/members"
              payload: { legal_name: "Birch Songs", member_type: "PUBLISHER", ipi_number: "00000000202" }
              as: MLCAdministrator
              captures: { m_b: $.data.id }
            - call: "POST /mlc/works"
              payload: { title: "Kestrel" }
              as: MLCAdministrator
              captures: { w0: $.data.id, w0_v: $.data.version }
            - call: "POST /mlc/works/${w0}/shares"
              payload: { claimant_member_id: "${m_a}", share_percent: 100, effective_from: "2026-01-01T00:00:00Z", expected_work_version: "${w0_v}" }
              as: MLCAdministrator
          trigger:
            - call: "POST /mlc/works/${w0}/shares"
              payload: { claimant_member_id: "${m_b}", share_percent: 50, effective_from: "2026-01-01T00:00:00Z", expected_work_version: "${w0_v}" }
              as: MLCAdministrator
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_SHARE_SUM_EXCEEDS_100 (priority 10 fires before priority 16 even though the expected_work_version is also stale)"
            - "HTTP status == 409"
            - "MusicalWork.${w0}.total_share_percent == 100.0 (no share was added)"

      - name: state_before_temporal_claim_window
        grounds:
          - validations[priority=5]
          - validations[priority=19]
          - state_machines.Claim.transitions
