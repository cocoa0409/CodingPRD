# =============================================================================
# §1.9 SCAFFOLD CORNER DESIGN — Coverage Index for Non-Difficulty Tests
# The breadth probe. Sections and claim_type values come from
# references/claim-extraction-guide.md; every chain is executable against
# SCAFFOLD.yaml §1.5 from an empty database.
# =============================================================================

scaffold_corner_design:
- section: entities
  instances:
  - name: create_route_returns_every_declared_field
    claim_type: creation
    grounds:
    - entities.Route
    - endpoints.POST /routes
    distinguishing_aspect: A successful POST /routes returns 201 with id, created_at, updated_at, version 1 and every declared Route field, including the computed cold_capable.
    test_recipe:
      setup:
      - The database is empty.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-05T00:00:00Z'
        as: ClubAdmin
      trigger:
      - call: POST /routes
        payload:
          code: R-NORTH
          name: North Route
          reefer_slots: 2
          route_minimum_cents: 250000
          max_pallets: 12
        as: ClubAdmin
        captures:
          r: $.data.id
      assert:
      - the response status is 201
      - Route.${r}.code == R-NORTH
      - Route.${r}.reefer_slots == 2
      - Route.${r}.route_minimum_cents == 250000
      - Route.${r}.max_pallets == 12
      - Route.${r}.cold_capable == true
      - Route.${r}.version == 1
      - Route.${r}.id is a UUID with no type prefix
  - name: create_route_applies_declared_defaults_when_optionals_are_omitted
    claim_type: defaults
    grounds:
    - entities.Route.fields.reefer_slots
    - entities.Route.fields.route_minimum_cents
    - entities.Route.fields.max_pallets
    distinguishing_aspect: Omitting reefer_slots, route_minimum_cents and max_pallets applies exactly 2, 250000 and 12, the three declared defaults, rather than nulls or zeros.
    test_recipe:
      setup:
      - The database is empty.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-05T00:00:00Z'
        as: ClubAdmin
      trigger:
      - call: POST /routes
        payload:
          code: R-DEFAULTS
          name: Defaults Route
        as: ClubAdmin
        captures:
          r: $.data.id
      assert:
      - Route.${r}.reefer_slots == 2
      - Route.${r}.route_minimum_cents == 250000
      - Route.${r}.max_pallets == 12
      - Route.${r}.cold_capable == true
  - name: member_tier_rank_and_discount_pct_are_derived_from_tier
    claim_type: computed_fields
    grounds:
    - entities.Member.fields.tier_rank
    - entities.Member.fields.discount_pct
    - entities.Member.fields.status
    - entities.Member.fields.credit_balance_cents
    distinguishing_aspect: tier_rank and discount_pct are computed from tier, so a PLUS registration returns 2 and 0.05 with status PENDING and credit_balance_cents 0, with no way for the caller to set them.
    test_recipe:
      setup:
      - North Route and Depot A exist.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-05T00:00:00Z'
        as: ClubAdmin
      - call: POST /routes
        payload:
          code: R-NORTH
          name: North Route
        as: ClubAdmin
        captures:
          r: $.data.id
      - call: POST /drop-points
        payload:
          route_id: ${r}
          name: Depot A
        as: ClubAdmin
        captures:
          d: $.data.id
      trigger:
      - call: POST /members
        payload:
          email: new@coop.test
          full_name: New Member
          home_drop_point_id: ${d}
          tier: PLUS
        as: ClubAdmin
        captures:
          m: $.data.id
      assert:
      - Member.${m}.tier == PLUS
      - Member.${m}.tier_rank == 2
      - Member.${m}.discount_pct == 0.05
      - Member.${m}.status == PENDING
      - Member.${m}.credit_balance_cents == 0
      - Member.${m}.dues_paid_through is null
      - Member.${m}.is_coordinator == false
  - name: naming_a_coordinator_sets_is_coordinator_on_that_member
    claim_type: computed_fields
    grounds:
    - entities.Member.fields.is_coordinator
    - entities.DropPoint.fields.coordinator_member_id
    distinguishing_aspect: 'Member.is_coordinator is derived across entities: it is false right after registration and true once any DropPoint names the member as coordinator_member_id.'
    test_recipe:
      setup:
      - Cora is registered against Depot A and has paid PRO dues.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-05T00:00:00Z'
        as: ClubAdmin
      - call: POST /routes
        payload:
          code: R-NORTH
          name: North Route
          reefer_slots: 2
          route_minimum_cents: 1000
          max_pallets: 12
        as: ClubAdmin
        captures:
          r_north: $.data.id
      - call: POST /drop-points
        payload:
          route_id: ${r_north}
          name: Depot A
          drop_minimum_cents: 1000
        as: ClubAdmin
        captures:
          d_a: $.data.id
      - call: POST /members
        payload:
          email: cora@coop.test
          full_name: Cora Ord
          home_drop_point_id: ${d_a}
          tier: PRO
        as: ClubAdmin
        captures:
          mc_id: $.data.id
          mc_v: $.data.version
      - call: POST /members/${mc_id}/dues-payments
        payload:
          amount_cents: 18000
          term_years: 1
          expected_member_version: ${mc_v}
        as: ClubAdmin
      - call: POST /drop-points
        payload:
          route_id: ${r_north}
          name: Depot B
          coordinator_member_id: ${mc_id}
          drop_minimum_cents: 1000
        as: ClubAdmin
        captures:
          d_b: $.data.id
      - call: POST /members
        payload:
          email: mara@coop.test
          full_name: Mara Plus
          home_drop_point_id: ${d_b}
          tier: PLUS
        as: ClubAdmin
        captures:
          ma_id: $.data.id
          ma_v: $.data.version
      - call: POST /members/${ma_id}/dues-payments
        payload:
          amount_cents: 9000
          term_years: 1
          expected_member_version: ${ma_v}
        as: ClubAdmin
      trigger:
      - call: GET /members/${mc_id}
        payload: {}
        as: ClubAdmin
      assert:
      - Member.${mc_id}.is_coordinator == true
      - Member.${mc_id}.tier_rank == 3
      - Member.${mc_id}.status == ACTIVE
      - GET /drop-points filtered by coordinator_member_id ${mc_id} returns total_count 1
  - name: system_fields_supplied_by_the_caller_are_ignored
    claim_type: system_fields
    grounds:
    - entities.Item.fields.status
    - entities.Item
    distinguishing_aspect: Item.status has source system with default ACTIVE, so a create request cannot land an item directly in DISCONTINUED and the server-minted id, created_at and version 1 stand regardless of the body.
    test_recipe:
      setup:
      - The database is empty.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-05T00:00:00Z'
        as: ClubAdmin
      trigger:
      - call: POST /items
        payload:
          sku: OAT-25
          name: Rolled Oats 25lb
          temp_class: DRY
          case_pack_units: 4
          unit_weight_grams: 1000
          unit_cube_cm3: 3000
        as: ClubAdmin
        captures:
          i: $.data.id
      assert:
      - Item.${i}.status == ACTIVE
      - Item.${i}.split_allowed == true
      - Item.${i}.remainder_policy == SHORT_FILL
      - Item.${i}.version == 1
  - name: create_item_missing_temp_class_returns_validation_error
    claim_type: required_fields
    grounds:
    - validations[priority=7]
    - errors[ERR_VALIDATION]
    distinguishing_aspect: temp_class is declared without a trailing question mark on POST /items, so omitting it fails at validation priority 7 rather than defaulting to DRY.
    test_recipe:
      setup:
      - The database is empty.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-05T00:00:00Z'
        as: ClubAdmin
      trigger:
      - call: POST /items
        payload:
          sku: NO-TEMP
          name: Missing Temp Class
          case_pack_units: 4
          unit_weight_grams: 1000
          unit_cube_cm3: 3000
        as: ClubAdmin
        captures:
          err: $.data.error_id
      assert:
      - the response status is 400
      - the response data.error_id == ERR_VALIDATION
      - GET /items returns total_count 0
  - name: create_item_with_an_unknown_temp_class_returns_invalid_enum
    claim_type: type_constraints
    grounds:
    - validations[priority=8]
    - errors[ERR_INVALID_ENUM]
    - entities.Item.fields.temp_class
    distinguishing_aspect: temp_class admits only FROZEN, CHILLED and DRY, and a value outside that list fails at priority 8 with ERR_INVALID_ENUM rather than the generic ERR_VALIDATION at priority 7.
    test_recipe:
      setup:
      - The database is empty.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-05T00:00:00Z'
        as: ClubAdmin
      trigger:
      - call: POST /items
        payload:
          sku: BAD-TEMP
          name: Bad Temp Class
          temp_class: AMBIENT
          case_pack_units: 4
          unit_weight_grams: 1000
          unit_cube_cm3: 3000
        as: ClubAdmin
        captures:
          err: $.data.error_id
      assert:
      - the response status is 400
      - the response data.error_id == ERR_INVALID_ENUM
      - the response data.error_id != ERR_VALIDATION
  - name: get_drop_run_with_an_unknown_id_returns_drop_run_not_found
    claim_type: not_found
    grounds:
    - validations[priority=4]
    - errors[ERR_DROP_RUN_NOT_FOUND]
    distinguishing_aspect: A path id that matches no DropRun fails at existence priority 4 with the entity-specific ERR_DROP_RUN_NOT_FOUND and HTTP 404.
    test_recipe:
      setup:
      - A May cycle and Depot B's drop run exist, so the collection is not empty.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-05T00:00:00Z'
        as: ClubAdmin
      - call: POST /routes
        payload:
          code: R-NORTH
          name: North Route
          reefer_slots: 2
          route_minimum_cents: 1000
          max_pallets: 12
        as: ClubAdmin
        captures:
          r_north: $.data.id
      - call: POST /drop-points
        payload:
          route_id: ${r_north}
          name: Depot A
          drop_minimum_cents: 1000
        as: ClubAdmin
        captures:
          d_a: $.data.id
      - call: POST /members
        payload:
          email: cora@coop.test
          full_name: Cora Ord
          home_drop_point_id: ${d_a}
          tier: PRO
        as: ClubAdmin
        captures:
          mc_id: $.data.id
          mc_v: $.data.version
      - call: POST /members/${mc_id}/dues-payments
        payload:
          amount_cents: 18000
          term_years: 1
          expected_member_version: ${mc_v}
        as: ClubAdmin
      - call: POST /drop-points
        payload:
          route_id: ${r_north}
          name: Depot B
          coordinator_member_id: ${mc_id}
          drop_minimum_cents: 1000
        as: ClubAdmin
        captures:
          d_b: $.data.id
      - call: POST /members
        payload:
          email: mara@coop.test
          full_name: Mara Plus
          home_drop_point_id: ${d_b}
          tier: PLUS
        as: ClubAdmin
        captures:
          ma_id: $.data.id
          ma_v: $.data.version
      - call: POST /members/${ma_id}/dues-payments
        payload:
          amount_cents: 9000
          term_years: 1
          expected_member_version: ${ma_v}
        as: ClubAdmin
      - call: POST /cycles
        payload:
          code: CY-MAY
          opens_at: '2026-05-05T00:00:00Z'
          cutoff_at: '2026-05-25T00:00:00Z'
        as: ClubAdmin
        captures:
          cyc: $.data.id
      - call: POST /drop-runs
        payload:
          cycle_id: ${cyc}
          drop_point_id: ${d_b}
        as: ClubAdmin
        captures:
          dr_b: $.data.id
          dr_b_v: $.data.version
      trigger:
      - call: GET /drop-runs/00000000-0000-4000-8000-000000000000
        payload: {}
        as: ClubAdmin
        captures:
          err: $.data.error_id
      assert:
      - the response status is 404
      - the response data.error_id == ERR_DROP_RUN_NOT_FOUND
  - name: create_drop_point_with_an_unknown_route_returns_route_not_found
    claim_type: parent_relationships
    grounds:
    - validations[priority=5]
    - errors[ERR_ROUTE_NOT_FOUND]
    - entities.DropPoint.fields.route_id
    distinguishing_aspect: A body foreign key that resolves to nothing fails at existence priority 5 with the parent's own error, ERR_ROUTE_NOT_FOUND, not with ERR_DROP_POINT_NOT_FOUND.
    test_recipe:
      setup:
      - The database is empty.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-05T00:00:00Z'
        as: ClubAdmin
      trigger:
      - call: POST /drop-points
        payload:
          route_id: 00000000-0000-4000-8000-000000000000
          name: Orphan Depot
        as: ClubAdmin
        captures:
          err: $.data.error_id
      assert:
      - the response status is 404
      - the response data.error_id == ERR_ROUTE_NOT_FOUND
      - GET /drop-points returns total_count 0
  - name: create_member_with_an_unknown_home_drop_point_returns_drop_point_not_found
    claim_type: foreign_key_references_validated
    grounds:
    - validations[priority=5]
    - errors[ERR_DROP_POINT_NOT_FOUND]
    - entities.Member.fields.home_drop_point_id
    distinguishing_aspect: The flat topology carries its integrity in body foreign keys rather than in URL nesting, so a bad home_drop_point_id must be caught by the same priority-5 rung that catches path ids.
    test_recipe:
      setup:
      - North Route exists but no drop point does.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-05T00:00:00Z'
        as: ClubAdmin
      - call: POST /routes
        payload:
          code: R-NORTH
          name: North Route
        as: ClubAdmin
        captures:
          r: $.data.id
      trigger:
      - call: POST /members
        payload:
          email: orphan@coop.test
          full_name: Orphan Member
          home_drop_point_id: 00000000-0000-4000-8000-000000000000
        as: ClubAdmin
        captures:
          err: $.data.error_id
      assert:
      - the response status is 404
      - the response data.error_id == ERR_DROP_POINT_NOT_FOUND
  - name: price_version_is_immutable_and_exposes_no_version_field
    claim_type: immutability
    grounds:
    - entities.PriceVersion
    - entities.PriceVersion.fields.split_unit_base_cents
    distinguishing_aspect: PriceVersion is declared common_fields false, so it carries only id and created_at, no updated_at and no version, and §1.5 offers no update or delete endpoint for it.
    test_recipe:
      setup:
      - OAT-25 exists with one price version of 12000 cents per 4-unit case.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-05T00:00:00Z'
        as: ClubAdmin
      - call: POST /routes
        payload:
          code: R-NORTH
          name: North Route
          reefer_slots: 2
          route_minimum_cents: 1000
          max_pallets: 12
        as: ClubAdmin
        captures:
          r_north: $.data.id
      - call: POST /drop-points
        payload:
          route_id: ${r_north}
          name: Depot A
          drop_minimum_cents: 1000
        as: ClubAdmin
        captures:
          d_a: $.data.id
      - call: POST /members
        payload:
          email: cora@coop.test
          full_name: Cora Ord
          home_drop_point_id: ${d_a}
          tier: PRO
        as: ClubAdmin
        captures:
          mc_id: $.data.id
          mc_v: $.data.version
      - call: POST /members/${mc_id}/dues-payments
        payload:
          amount_cents: 18000
          term_years: 1
          expected_member_version: ${mc_v}
        as: ClubAdmin
      - call: POST /drop-points
        payload:
          route_id: ${r_north}
          name: Depot B
          coordinator_member_id: ${mc_id}
          drop_minimum_cents: 1000
        as: ClubAdmin
        captures:
          d_b: $.data.id
      - call: POST /members
        payload:
          email: mara@coop.test
          full_name: Mara Plus
          home_drop_point_id: ${d_b}
          tier: PLUS
        as: ClubAdmin
        captures:
          ma_id: $.data.id
          ma_v: $.data.version
      - call: POST /members/${ma_id}/dues-payments
        payload:
          amount_cents: 9000
          term_years: 1
          expected_member_version: ${ma_v}
        as: ClubAdmin
      - call: POST /items
        payload:
          sku: OAT-25
          name: Rolled Oats 25lb
          temp_class: DRY
          case_pack_units: 4
          unit_weight_grams: 1000
          unit_cube_cm3: 3000
          split_allowed: true
          remainder_policy: SHORT_FILL
        as: ClubAdmin
        captures:
          i_oat: $.data.id
      - call: POST /price-versions
        payload:
          item_id: ${i_oat}
          effective_from: '2026-04-01T00:00:00Z'
          case_price_cents: 12000
        as: ClubAdmin
        captures:
          pv_oat_1: $.data.id
      trigger:
      - call: GET /price-versions/${pv_oat_1}
        payload: {}
        as: ClubAdmin
      assert:
      - the response status is 200
      - PriceVersion.${pv_oat_1}.case_price_cents == 12000
      - PriceVersion.${pv_oat_1}.split_unit_base_cents == 3000
      - the response body carries id and created_at but neither updated_at nor version
      - no PUT, PATCH or DELETE endpoint exists in §1.5 for /price-versions/{price_version_id}
  - name: listing_items_returns_pagination_counters_and_honours_limit
    claim_type: listing
    grounds:
    - endpoints.GET /items
    - response_envelope.pagination_fields
    distinguishing_aspect: GET /items with limit 2 over a four-item catalog returns exactly 2 rows with total_count 4 and has_more true, so the counters describe the filtered set rather than the page.
    test_recipe:
      setup:
      - Four catalog items exist - OAT-25, BERRY-10, CHEESE-2 and RICE-50.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-05T00:00:00Z'
        as: ClubAdmin
      - call: POST /routes
        payload:
          code: R-NORTH
          name: North Route
          reefer_slots: 2
          route_minimum_cents: 1000
          max_pallets: 12
        as: ClubAdmin
        captures:
          r_north: $.data.id
      - call: POST /drop-points
        payload:
          route_id: ${r_north}
          name: Depot A
          drop_minimum_cents: 1000
        as: ClubAdmin
        captures:
          d_a: $.data.id
      - call: POST /members
        payload:
          email: cora@coop.test
          full_name: Cora Ord
          home_drop_point_id: ${d_a}
          tier: PRO
        as: ClubAdmin
        captures:
          mc_id: $.data.id
          mc_v: $.data.version
      - call: POST /members/${mc_id}/dues-payments
        payload:
          amount_cents: 18000
          term_years: 1
          expected_member_version: ${mc_v}
        as: ClubAdmin
      - call: POST /drop-points
        payload:
          route_id: ${r_north}
          name: Depot B
          coordinator_member_id: ${mc_id}
          drop_minimum_cents: 1000
        as: ClubAdmin
        captures:
          d_b: $.data.id
      - call: POST /members
        payload:
          email: mara@coop.test
          full_name: Mara Plus
          home_drop_point_id: ${d_b}
          tier: PLUS
        as: ClubAdmin
        captures:
          ma_id: $.data.id
          ma_v: $.data.version
      - call: POST /members/${ma_id}/dues-payments
        payload:
          amount_cents: 9000
          term_years: 1
          expected_member_version: ${ma_v}
        as: ClubAdmin
      - call: POST /items
        payload:
          sku: OAT-25
          name: Rolled Oats 25lb
          temp_class: DRY
          case_pack_units: 4
          unit_weight_grams: 1000
          unit_cube_cm3: 3000
          split_allowed: true
          remainder_policy: SHORT_FILL
        as: ClubAdmin
        captures:
          i_oat: $.data.id
      - call: POST /price-versions
        payload:
          item_id: ${i_oat}
          effective_from: '2026-04-01T00:00:00Z'
          case_price_cents: 12000
        as: ClubAdmin
        captures:
          pv_oat_1: $.data.id
      - call: POST /items
        payload:
          sku: BERRY-10
          name: Frozen Berries 10lb
          temp_class: FROZEN
          case_pack_units: 6
          unit_weight_grams: 500
          unit_cube_cm3: 1200
          split_allowed: true
          remainder_policy: ROUND_UP
        as: ClubAdmin
        captures:
          i_berry: $.data.id
      - call: POST /price-versions
        payload:
          item_id: ${i_berry}
          effective_from: '2026-04-01T00:00:00Z'
          case_price_cents: 9000
        as: ClubAdmin
        captures:
          pv_berry: $.data.id
      - call: POST /items
        payload:
          sku: CHEESE-2
          name: Raw Cheddar 2lb
          temp_class: CHILLED
          case_pack_units: 3
          unit_weight_grams: 900
          unit_cube_cm3: 1500
          split_allowed: true
          remainder_policy: DROP
        as: ClubAdmin
        captures:
          i_cheese: $.data.id
      - call: POST /price-versions
        payload:
          item_id: ${i_cheese}
          effective_from: '2026-04-01T00:00:00Z'
          case_price_cents: 10000
        as: ClubAdmin
        captures:
          pv_cheese: $.data.id
      - call: POST /items
        payload:
          sku: RICE-50
          name: Brown Rice 50lb
          temp_class: DRY
          case_pack_units: 2
          unit_weight_grams: 22700
          unit_cube_cm3: 30000
          split_allowed: false
          remainder_policy: SHORT_FILL
        as: ClubAdmin
        captures:
          i_rice: $.data.id
      - call: POST /price-versions
        payload:
          item_id: ${i_rice}
          effective_from: '2026-04-01T00:00:00Z'
          case_price_cents: 40000
        as: ClubAdmin
        captures:
          pv_rice: $.data.id
      trigger:
      - call: GET /items
        payload:
          limit: 2
          offset: 0
        as: ClubAdmin
      assert:
      - the response status is 200
      - the response data has length 2
      - the response total_count == 4
      - the response has_more == true
      - the response limit == 2 and offset == 0
  - name: filtered_list_by_foreign_key_returns_only_the_matching_children
    claim_type: retrieval
    grounds:
    - endpoints.GET /price-versions
    - entities.PriceVersion.fields.item_id
    distinguishing_aspect: The filtered-list form is the only discovery channel for children created outside a create response, so GET /price-versions with item_id must return exactly that item's two versions and nothing from the sibling item.
    test_recipe:
      setup:
      - OAT-25 has two price versions and CHEESE-2 has one.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-05T00:00:00Z'
        as: ClubAdmin
      - call: POST /routes
        payload:
          code: R-NORTH
