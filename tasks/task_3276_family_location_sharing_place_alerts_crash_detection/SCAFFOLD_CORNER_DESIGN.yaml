            - call: "GET /api/circles/${cid}/members/${hid}"
              payload: {}
              as: Member
              as_user_id: "${hid}"
              captures: { hv: $.data.version }
            - call: "PATCH /api/circles/${cid}/members/${hid}/privacy"
              payload: { privacy_mode: "HIDDEN", expected_member_version: "${hv}" }
              as: Member
              as_user_id: "${hid}"
            - call: "GET /api/circles/${cid}/members/${hid}"
              payload: {}
              as: Member
              as_user_id: "${hid}"
              captures: { hv2: $.data.version }
          trigger:
            - call: "PATCH /api/circles/${cid}/members/${hid}/privacy"
              payload: { privacy_mode: "PRECISE", expected_member_version: "${hv2}" }
              as: Owner
              as_user_id: "${oid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id == ERR_PRIVACY_SELF_ONLY"
            - "Member.${hid}.privacy_mode remains HIDDEN"

  # ===========================================================================
  - section: rbac
    instances:

      - name: admin_cannot_verify_dispatch
        claim_type: RoleExclusiveViolation
        grounds:
          - roles.Owner.exclusive_operations
          - roles.Admin
        distinguishing_aspect: "An ADMIN calling POST /emergency-dispatches/{id}/verify is rejected 403 ERR_FORBIDDEN — verify is OWNER-exclusive."
        test_recipe:
