              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {c_id: $.data.id}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p_id}", course_id: "${c_id}"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {e_id: $.data.id}
            - call: "POST /studio-resources"
              payload: {resource_code: "STUDIO-A", resource_class: "STUDIO", required_competency_code: "STUDIO_FLOOR", capacity_slots: 1, turnaround_minutes: 30, base_deposit_cents: 12345, replacement_value_cents: 900000}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {res_id: $.data.id}
            - call: "POST /funding-periods"
              payload: {fiscal_year: 2026, quarter: 3, basis: "ACCRUAL", gross_franchise_fee_cents: 5000000, service_period_earned_cents: 5000000, remittance_received_cents: 4800000, capital_grant_cents: 0}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: {fp_id: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-06T00:00:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /course-enrollments/${e_id}/attendance"
              payload: {attended: true}
              as: TrainingCoordinator
              as_user_id: "trn-1"
            - call: "POST /course-enrollments/${e_id}/grade"
              payload: {practical_score: 88}
              as: TrainingCoordinator
              as_user_id: "trn-1"
            - call: "POST /reservations"
              payload: {producer_id: "${p_id}", resource_id: "${res_id}", start_at: "2026-08-20T10:00:00Z", end_at: "2026-08-20T12:00:00Z"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {r_id: $.data.id}
            - call: "POST /reservations/${r_id}/confirm"
              payload: {}
              as: FacilitiesManager
              as_user_id: "fac-1"
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-20T09:45:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /reservations/${r_id}/checkout"
              payload: {}
              as: FacilitiesManager
              as_user_id: "fac-1"
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-20T12:00:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /reservations/${r_id}/return"
              payload: {damage_observed: true, severity: "MINOR", repair_estimate_cents: 4000, damage_notes: "Scuffed cyclorama"}
              as: FacilitiesManager
              as_user_id: "fin-1"
              captures: {ret_status: $.data.status}
            - call: "GET /damage-assessments"
              payload: {reservation_id: "${r_id}"}
