              as: ProductionManager
              captures: { err_b4: "$.data.error_id" }
            - call: "GET /grandstand/fair-editions"
              payload: {}
              as: BoxOfficeManager
          assert:
            - "The BoxOfficeManager edition create returns HTTP 403 with ${err_b1} == ERR_FORBIDDEN_ROLE."
            - "The SettlementController offer create returns HTTP 403 with ${err_b2} == ERR_FORBIDDEN_ROLE."
            - "The TalentBuyer rider rule returns HTTP 403 with ${err_b3} == ERR_FORBIDDEN_ROLE and NOT 404 ERR_RIDER_ITEM_NOT_FOUND: priority 2 precedes priority 13 even though the id is fictitious."
            - "The ProductionManager announce returns HTTP 403 with ${err_b4} == ERR_FORBIDDEN_ROLE and NOT 404 ERR_SHOW_BOOKING_NOT_FOUND."
            - "The BoxOfficeManager list read returns HTTP 200 with total_count == 1: the role is denied only the writes that belong to other roles."
            - "Exactly one FairEdition exists after the sweep -- no refused write persisted anything."

      - name: unknown_agent_identity_and_foreign_roster_are_both_forbidden
