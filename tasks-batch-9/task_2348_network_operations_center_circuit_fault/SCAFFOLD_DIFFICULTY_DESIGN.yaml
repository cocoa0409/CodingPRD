          trigger:
            - call: "POST /sla-credit-claims/${wd_claim_id}/withdraw"
              payload: {}
              as: VendorManager
              as_user_id: "vm-1"
            - call: "GET /carriers/${nlc_id}"
              payload: {}
              as: VendorManager
              as_user_id: "vm-1"
          assert:
            - "before the withdraw: Carrier.${nlc_id}.open_credit_exposure_cents == 45999 and watchlist_state == WATCHLIST"
            - "SlaCreditClaim.${wd_claim_id}.state == WITHDRAWN"
            - "SlaCreditClaim.${wd_claim_id}.credit_amount_cents == 45999 (the historical amount is preserved on the withdrawn row)"
            - "Carrier.${nlc_id}.open_credit_exposure_cents == 0 (exactly the pre-claim value, no residue)"
            - "Carrier.${nlc_id}.watchlist_state == ACTIVE"
            - "CarrierTicket.${t1_id}.state == CLOSED_RESTORED (the compensation does not reopen the ticket)"
            - "Carrier.${nlc_id}.committed_upgrade_mbps == 0 (the bandwidth ledger is untouched by a money compensation)"

      - name: upgrade_order_cancel_restores_committed_bandwidth_not_circuit_capacity
        grounds:
          - state_machines.UpgradeOrder.SUBMITTED_to_CANCELLED
          - calculations.committed_upgrade_bandwidth_ledger
          - entities.Carrier.fields.committed_upgrade_mbps
          - entities.Circuit.fields.bandwidth_mbps
          - entities.Circuit.fields.capacity_state
          - endpoints["POST /upgrade-orders/{id}/cancel"]
        distinguishing_aspect: |
          A BANDWIDTH invariant in a different unit from the money ledger, and its compensation is
          deliberately partial: cancelling the order releases exactly the 200 Mbps it committed
          (committed_upgrade_mbps back to 0) while the cancelled row keeps its frozen 537500-cent costing
          and the circuit's bandwidth_mbps and capacity_state are left exactly as they were, because a
          cancelled upgrade does not relieve the utilization pressure that motivated it.
        test_recipe:
          setup:
            - "Carrier WBF with one MONITORED circuit WBF-CKT-4001 at bandwidth_mbps 100."
            - "Two EGRESS capacity readings above the threshold (95.00 at 01:00 and 96.00 at 01:05) leave consecutive_high_readings 2 and capacity_state WATCH, below the 3-reading auto-order trigger."
            - "A MANUAL expedited order to 300 Mbps is created by cp-1 (delta 200, subtotal 430000, fee 107500, total 537500) and submitted, so Carrier.committed_upgrade_mbps is 200."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Westbound Fiber", carrier_code: "WBF" }
              as: PlatformAdmin
              captures: { wbf_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${wbf_id}", carrier_circuit_identifier: "WBF-CKT-4001", site_a_code: "DEN01", site_z_code: "SLC01", bandwidth_mbps: 100, mrc_cents: 300000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { c4_id: $.data.id }
            - call: "POST /circuits/${c4_id}/capacity-readings"
              payload: { sample_at: "2026-08-05T01:00:00Z", utilization_pct: 95.00, direction: "EGRESS" }
              as: CapacityPlanner
              as_user_id: "cp-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T01:05:00Z" }
              as: PlatformAdmin
            - call: "POST /circuits/${c4_id}/capacity-readings"
              payload: { sample_at: "2026-08-05T01:05:00Z", utilization_pct: 96.00, direction: "EGRESS" }
              as: CapacityPlanner
              as_user_id: "cp-1"
            - call: "GET /circuits/${c4_id}"
              payload: {}
              as: CapacityPlanner
              as_user_id: "cp-1"
              captures: { c4_v2: $.data.version }
            - call: "POST /upgrade-orders"
              payload: { circuit_id: "${c4_id}", target_bandwidth_mbps: 300, expected_circuit_version: "${c4_v2}", expedite: true }
              as: CapacityPlanner
              as_user_id: "cp-1"
              captures: { o2_id: $.data.id }
            - call: "POST /upgrade-orders/${o2_id}/submit"
              payload: {}
              as: CapacityPlanner
              as_user_id: "cp-1"
          trigger:
            - call: "POST /upgrade-orders/${o2_id}/cancel"
              payload: { cancel_reason: "budget deferred to next quarter" }
              as: VendorManager
              as_user_id: "vm-1"
            - call: "GET /carriers/${wbf_id}"
              payload: {}
              as: CapacityPlanner
              as_user_id: "cp-1"
            - call: "GET /circuits/${c4_id}"
              payload: {}
              as: CapacityPlanner
              as_user_id: "cp-1"
          assert:
            - "before the cancel: Carrier.${wbf_id}.committed_upgrade_mbps == 200 and UpgradeOrder.${o2_id}.state == SUBMITTED"
            - "UpgradeOrder.${o2_id}.state == CANCELLED"
            - "UpgradeOrder.${o2_id}.delta_mbps == 200, subtotal_cents == 430000, expedite_fee_cents == 107500 and total_cost_cents == 537500 (frozen, not zeroed)"
            - "Carrier.${wbf_id}.committed_upgrade_mbps == 0 (exactly the pre-order value)"
            - "Circuit.${c4_id}.bandwidth_mbps == 100 (unchanged by the cancellation)"
            - "Circuit.${c4_id}.consecutive_high_readings == 2 and capacity_state == WATCH (the pressure is not relieved)"
            - "Carrier.${wbf_id}.open_credit_exposure_cents == 0 (the money ledger is untouched by a bandwidth compensation)"
