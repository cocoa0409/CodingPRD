  - section: validations
    instances:
      - name: missing_auth_headers_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID/X-User-Role headers fails priority-1 auth before any other check, including on endpoints whose payload would otherwise be invalid."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /service-events", payload: { name: "NoAuth", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 100 }, as: Any, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER; http 400 (note: role Any on a non-GET endpoint is itself an invalid context)"

      - name: body_fk_event_not_found_on_registration
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_EVENT_NOT_FOUND]"]
        distinguishing_aspect: "A registration referencing a nonexistent event_id in the BODY fails existence (priority 5) with ERR_EVENT_NOT_FOUND before any state or capacity logic runs."
        test_recipe:
          setup: ["one volunteer exists"]
          setup_api_calls:
            - { call: "POST /employee-volunteers", payload: { full_name: "Vol One", email: "v1@corp.com", department: "Eng", date_of_birth: "1990-01-01" }, as: CommunityEngagementManager, captures: { vol1: $.data.id } }
          trigger:
            - { call: "POST /registrations", payload: { event_id: "00000000-0000-0000-0000-000000000000", project_id: "00000000-0000-0000-0000-000000000000" }, as: EmployeeVolunteer, as_user_id: "${vol1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EVENT_NOT_FOUND (404); body FKs validated left-to-right (event before project)"

