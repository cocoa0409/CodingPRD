              captures: { obl_id: $.data.id, assessed: $.data.assessed_cents }
          assert:
            - "RepaymentObligation.${obl_id}.assessed_cents == 7500 and source_kind == AUDIT_FINDING"

      - name: multi_package_single_dispense_floor_division
        claim_type: constants_applied
        grounds:
          - calculations.accumulator_replenishment
          - entities.Accumulator.fields.replenished_packages_total
        distinguishing_aspect: "A single 70-unit 340B dispense on package_size-30 crystallises floor(70/30)=2 packages with accrued_units 10 remainder."
