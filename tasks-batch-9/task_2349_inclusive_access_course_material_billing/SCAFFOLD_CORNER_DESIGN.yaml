              as: ProgramAdmin
          assert:
            - "Trigger call 1 -> HTTP 400 ERR_INVALID_REQUEST: priority_flag is not a declared input of POST /adoptions"
            - "Trigger call 2 -> HTTP 400 ERR_INVALID_REQUEST, NOT 404 ERR_TITLE_NOT_FOUND: body shape at priority 25 is checked before body foreign keys at priority 32"
            - "Trigger call 3 -> HTTP 400 ERR_INVALID_REQUEST: min_enrollment must be >= 1"
            - "Trigger call 4 -> HTTP 400 ERR_INVALID_REQUEST: reporting_state_code must be two uppercase letters"
            - "Trigger call 5 -> HTTP 400 ERR_INVALID_REQUEST: HEADCOUNT is not a member of the method enum {ENROLLMENT_SNAPSHOT, ACCESS_DAYS_WEIGHTED}"
            - "Nothing was created or changed: GET /sections/${sec_id}/adoptions returns total_count == 0, GET /titles/${t1_id}/pricing-tiers returns total_count == 0, GET /terms/${term_id}/disclosure-reports returns total_count == 0, GET /agreements/${agr_id}/reconciliation-runs returns total_count == 0, and CourseSection.${sec_id}.version is still 1"

