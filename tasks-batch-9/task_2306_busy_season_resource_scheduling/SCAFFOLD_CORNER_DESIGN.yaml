      - name: realization_variant_divergence_on_one_engagement
        claim_type: variant_divergence
        grounds:
          - "calculations.engagement_realization"
        excluded_because:
          difficulty_instance: dual_variant_calc / realization_provisional_vs_final_diverges_on_same_engagement
          rationale: |
            The §1.8 instance already holds both variants of engagement_realization apart on
            one engagement — committed allocations versus logged time entries, each scaled by
            RATE_MODEL_FACTOR — and asserts standard_value_provisional, realization_pct_provisional,
            standard_value_final and realization_pct_final in the same response. A §1.9
            duplicate would restate the same divergence with smaller numbers.

      - name: burnout_variant_selection_by_direction
        claim_type: variant_selection
        grounds:
          - "calculations.burnout_risk_score"
        excluded_because:
          difficulty_instance: dual_variant_calc / burnout_actual_trailing_vs_committed_forward_diverges_for_same_staff
          rationale: |
            Variant selection for burnout_risk_score is exactly the actual_trailing (backwards
            over logged weeks) versus committed_forward (forwards over committed weeks) split
            that the §1.8 instance drives through GET /scheduling/staff-members/{id}/workload,
            including which variant the turnover_risk_band and TURNOVER_RISK_BLOCK gate consume.

      - name: realization_final_per_line_rounding_precision
        claim_type: precision
        grounds:
          - "calculations.engagement_realization"
        excluded_because:
          difficulty_instance: combinatorial_formula / realization_final_rounds_each_time_entry_before_summing
          rationale: |
            The per-line-then-sum rounding order of the final variant is the whole subject of
            that §1.8 instance, which contrasts the round-each-time-entry total against the
            round-the-sum total that a naive implementation produces.

      - name: effective_weekly_cap_constants_composition
        claim_type: constants_applied
        grounds:
          - "calculations.effective_weekly_cap"
        excluded_because:
          difficulty_instance: combinatorial_formula / effective_weekly_cap_combines_prior_week_tier_waiver_allowance_and_ceiling
          rationale: |
            Every constant of effective_weekly_cap — the GREEN/AMBER/RED tier multipliers
            1.25/1.15/1.00, the approved waiver allowance and the ABSOLUTE_CEILING_MULTIPLIER
            1.40 clamp — is exercised together in that §1.8 instance, including the clamp
            binding after the allowance is added.

  - section: validations
    instances:
      - name: list_limit_above_hundred_rejected_as_invalid_pagination
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_INVALID_PAGINATION]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          limit must land in the closed interval [1, 100]; 101 is one past the ceiling and is
          rejected rather than silently clamped, and offset = -1 is rejected on the same rule.
        test_recipe:
          setup:
            - "Only the logical clock is pinned; the rule fires before any row is read."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FirmAdmin
          trigger:
            - call: "GET /scheduling/staff-members?limit=101&offset=0"
              payload: {}
              as: SchedulingManager
              captures: { err_over: $.data.error_id }
            - call: "GET /scheduling/staff-members?limit=10&offset=-1"
              payload: {}
              as: SchedulingManager
              captures: { err_neg: $.data.error_id }
            - call: "GET /scheduling/staff-members?limit=100&offset=0"
              payload: {}
              as: SchedulingManager
          assert:
            - "first trigger: HTTP 422 and ${err_over} == 'ERR_INVALID_PAGINATION'"
            - "second trigger: HTTP 422 and ${err_neg} == 'ERR_INVALID_PAGINATION'"
            - "third trigger: HTTP 200 (limit == 100 is admissible) with meta.api_request_id present and data.limit == 100, data.offset == 0"

      - name: assignment_with_equal_start_and_end_rejected_as_invalid_date_range
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_INVALID_DATE_RANGE]
          - calculations.assignment_daily_hours
        distinguishing_aspect: |
          Assignment intervals are half-open, so end_date must be strictly greater than
          start_date: an equal pair describes zero calendar days and is rejected here rather
          than dividing allocated_hours by a zero day count downstream.
        test_recipe:
          setup:
            - "Logical clock 2026-08-03T09:00:00Z; MERIDIAN client, partner P1, DOMESTIC senior S1."
            - "Engagement E1 with phase PH1 FIELDWORK expecting 20.00 hours in 2026-08-03..2026-08-31."
