              as: LeaseAdministrator
              captures: { lessee_id: $.data.id }
            - call: "POST /api/v1/lease-contracts"
              payload: { lessee_id: "${lessee_id}", lease_type: "FULL_SERVICE", per_diem_rate_cents: 2001, liability_bearer: "LESSOR", term_start_date: "2026-09-01", term_end_date: "2027-09-01", fleet_car_cap: 10 }
              as: LeaseAdministrator
              captures: { lc_id: $.data.id }
            - call: "POST /api/v1/lease-contracts/${lc_id}/activate"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 2, planned_shop_days: 2, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { po_id: $.data.id }
            - call: "POST /api/v1/production-orders/${po_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/release"
              payload: { lease_contract_id: "${lc_id}" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/FLT-L1/changeover"
              payload: { production_order_id: "${po_id}", scheduled_start_date: "2026-09-02", scheduled_end_date: "2026-09-04" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/complete"
              payload: { completed_qty: 2, completion_date: "2026-09-04" }
              as: ProductionPlanner
            - call: "GET /api/v1/lease-fleet-cars?production_order_id=${po_id}"
              payload: {}
              as: LeaseAdministrator
              captures: { car_a: "$.data[0].id" }
            - call: "POST /api/v1/car-assignments"
              payload: { lease_fleet_car_id: "${car_a}", lease_contract_id: "${lc_id}", lessee_id: "${lessee_id}", start_date: "2026-09-04", end_date: "2026-09-09", mileage_allowance: 1000 }
              as: LeaseAdministrator
              captures: { asg_a: $.data.id }
          trigger:
            - call: "POST /api/v1/car-returns"
              payload: { lease_fleet_car_id: "${car_a}", car_assignment_id: "${asg_a}", return_date: "2026-09-09", mileage_since_last: 5000, condition_grade: "A" }
              as: LeaseAdministrator
              captures: { ret_a: $.data.id, over_a: $.data.mileage_overage_cents }
