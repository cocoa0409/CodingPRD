            - "WorkOrder.${wo_id}.repair_status == REPAIRED and WorkOrder.${wo_id}.verification_status == UNVERIFIED"
            - "WorkOrder.${wo_id}.completed_at == 2026-08-04T09:00:00.000Z"
            - "WorkOrder.${wo_id}.completed_by_user_id == tech-1"
            - "SelfAssessmentSweep.${sw_id}.closure_verified_rate == 0.00"
            - "Deficiency.${d1_id}.status == OPEN"

      - name: property_owner_and_platform_admin_share_the_property_update_operation
        claim_type: shared_operations
        grounds:
          - roles.PropertyOwner.shared_operations
          - roles.PlatformAdmin.shared_operations
          - endpoints[PATCH /properties/{id}]
        distinguishing_aspect: |
          PATCH /properties/{id} is declared for two roles, so both must succeed on the same row and
          each write must bump the same version counter - the admin edit after the owner edit lands on
          version 3, proving the endpoint is not silently owner-only.
        test_recipe:
          setup:
            - "Property Cedar Walk exists at version 1."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Cedar Walk", total_unit_count: 2, capital_reserve_cents: 500000, owner_contact_email: "owner@cedar.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id, pv1: $.data.version }
            - call: "PATCH /properties/${prop_id}"
              payload: { owner_contact_email: "asset.manager@cedar.example" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { pv2: $.data.version }
          trigger:
            - call: "PATCH /properties/${prop_id}"
              payload: { capital_reserve_cents: 900000 }
              as: PlatformAdmin
          assert:
            - "${pv1} == 1 and ${pv2} == 2"
            - "the trigger returns HTTP 200 and Property.${prop_id}.version == 3"
            - "Property.${prop_id}.owner_contact_email == asset.manager@cedar.example"
            - "Property.${prop_id}.capital_reserve_cents == 900000"
            - "Property.${prop_id}.name == Cedar Walk and Property.${prop_id}.total_unit_count == 2"

