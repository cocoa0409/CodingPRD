              captures: { grant_id: $.data.id }
            - call: "POST /daf/grants/${grant_id}/approve"
              payload: {}
              as: GrantOfficer
              as_user_id: "officer-6"
            - call: "POST /daf/grants/${grant_id}/schedule"
              payload: {}
              as: GrantOfficer
              as_user_id: "officer-6"
          trigger:
            - call: "POST /daf/grants/${grant_id}/pay"
