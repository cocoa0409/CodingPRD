            - { call: "POST /potato-shed/sheds", payload: { name: "Shed DU" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b1_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-2", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b2_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-20", original_weight_cwt: 100.00 }, as: IntakeClerk, captures: { l1_id: "$.data.id" } }
