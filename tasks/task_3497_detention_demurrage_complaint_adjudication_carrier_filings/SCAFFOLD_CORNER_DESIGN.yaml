              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { inv_ref: $.data.id }
          trigger:
            - call: "POST /fmc/complaints"
              payload: { respondent_carrier_id: "${carrier_id}", subject_invoice_ids: ["${inv_ref}"], reparations_claimed_cents: 10000 }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { err_party: $.data.error_id }
            - call: "POST /fmc/complaints"
              payload: { respondent_carrier_id: "${carrier_b}", subject_invoice_ids: ["${inv_ref}"], reparations_claimed_cents: 10000 }
