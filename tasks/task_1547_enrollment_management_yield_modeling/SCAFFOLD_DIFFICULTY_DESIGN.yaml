            - { call: "POST /enrollment/applications/${app1}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - { call: "POST /enrollment/applications/${app2}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
