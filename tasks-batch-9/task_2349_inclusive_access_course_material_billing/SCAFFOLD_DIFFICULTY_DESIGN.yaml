              as: Faculty
              as_user_id: "fac-6"
          assert:
            - "Trigger call 1 -> HTTP 200: Adoption.${adopt_b_id}.status == APPROVED - touching windows (A ends 2026-10-01 exclusive, B starts 2026-10-01 inclusive) never share a date, so the count on every date stays 1 <= max_concurrent_titles 1"
            - "Trigger call 5 -> HTTP 409 ERR_CONCURRENT_TITLE_LIMIT: window [2026-09-30, 2026-10-02) shares 2026-09-30 with A and 2026-10-01 with B, pushing the count to 2 on both dates"
            - "Adoption.${adopt_c_id}.status == SUBMITTED after the refusal, with locked_list_price_cents == null"
            - "Trigger call 6 -> HTTP 422 ERR_ACCESS_WINDOW_INVALID (access_end_date must be strictly greater than access_start_date; an empty window is not a zero-day window)"
            - "Trigger call 7 -> HTTP 422 ERR_ACCESS_WINDOW_INVALID (2026-12-13 exceeds term_end_date + 1 day == 2026-12-12)"
            - "GET /adoptions with section_id=${sec_id} and status=APPROVED returns total_count == 2"
            - "CourseSection.${sec_id}.max_concurrent_titles == 1 and ia_status == NOT_FLAGGED throughout"

      - name: temporal_overlap_pricing_tier_bands_adjacent_versus_overlapping
        grounds:
          - validations[priority=85]
          - entities.PricingTier.fields.min_enrollment
          - entities.PricingTier.fields.max_enrollment
          - errors[ERR_TIER_BAND_OVERLAP]
          - calculations.per_student_negotiated_price
        distinguishing_aspect: |
          The overlap domain here is a closed integer interval, not a date range, and the open-ended
          band (max_enrollment null == +infinity) is the trap: [3,5] is accepted immediately after
          [1,2] because adjacency is legal, [5,8] is refused for sharing the single point 5, and once
          [6,null] exists every later band starting at 9 or beyond is refused even though 9 sits far
          from 6.
        test_recipe:
          setup:
            - "PUB-A in DRAFT with title T1 (list 18000) carrying exactly one PricingTier band [1,2] -> 9000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /agreements"
              payload: { publisher_name: "Northgate Academic", agreement_code: "PUB-A", effective_from: "2026-07-01", effective_to: "2027-01-01", admin_fee_pct: 0.05, bookstore_margin_pct: 0.12, price_floor_cents: 2500, rebate_threshold_cents: 16500, rebate_pct: 0.03, max_list_price_pct: 0.60 }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /titles"
              payload: { agreement_id: "${agr_id}", isbn: "978-0-11-000001-0", title: "Principles of Economics", list_price_cents: 18000, format: "DIGITAL" }
              as: ProgramAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /titles/${t1_id}/pricing-tiers"
              payload: { min_enrollment: 1, max_enrollment: 2, per_student_price_cents: 9000 }
              as: ProgramAdmin
              captures: { tier1_id: $.data.id }
          trigger:
            - call: "POST /titles/${t1_id}/pricing-tiers"
              payload: { min_enrollment: 3, max_enrollment: 5, per_student_price_cents: 8000 }
              as: ProgramAdmin
              captures: { tier2_id: $.data.id }
            - call: "POST /titles/${t1_id}/pricing-tiers"
              payload: { min_enrollment: 5, max_enrollment: 8, per_student_price_cents: 7600 }
              as: ProgramAdmin
            - call: "POST /titles/${t1_id}/pricing-tiers"
              payload: { min_enrollment: 6, per_student_price_cents: 7000 }
              as: ProgramAdmin
              captures: { tier3_id: $.data.id }
            - call: "POST /titles/${t1_id}/pricing-tiers"
              payload: { min_enrollment: 9, per_student_price_cents: 6500 }
              as: ProgramAdmin
            - call: "POST /titles/${t1_id}/pricing-tiers"
              payload: { min_enrollment: 2, max_enrollment: 2, per_student_price_cents: 8800 }
              as: ProgramAdmin
          assert:
            - "Trigger call 1 -> HTTP 201: [3,5] is adjacent to [1,2] (new.min_enrollment == existing.max_enrollment + 1), which is explicitly legal"
            - "Trigger call 2 -> HTTP 409 ERR_TIER_BAND_OVERLAP: [5,8] shares exactly the point 5 with [3,5]"
            - "Trigger call 3 -> HTTP 201: [6,null] is adjacent to [3,5] and its max_enrollment is null (+infinity)"
            - "Trigger call 4 -> HTTP 409 ERR_TIER_BAND_OVERLAP: [9,null] collides with [6,null] because null on either side is treated as +infinity"
            - "Trigger call 5 -> HTTP 409 ERR_TIER_BAND_OVERLAP: the single-point band [2,2] is fully contained in [1,2]"
            - "GET /titles/${t1_id}/pricing-tiers returns total_count == 3 with bands [1,2], [3,5] and [6,null] and prices 9000, 8000, 7000"
            - "GET /pricing-tiers with title_id=${t1_id} returns the same three rows (the filtered list is the reverse index of the tier's title_id)"
            - "PricingTier.${tier3_id}.max_enrollment == null, so an enrollment basis of 6, 7 or 40 all resolve to 7000 before fees"

