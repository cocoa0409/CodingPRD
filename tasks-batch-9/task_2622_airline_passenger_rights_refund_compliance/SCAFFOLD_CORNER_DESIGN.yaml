      - name: initiate_settlement_before_election_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority 41]", "errors.ERR_ELECTION_REQUIRED"]
        distinguishing_aspect: "settlement_status is legally UNSETTLED so the priority-40 state check passes; the request still fails at priority 41 with ERR_ELECTION_REQUIRED (409) because the independent election axis is still PENDING_ELECTION."
