      - name: meeting_outcome_is_a_conditional_action_gated_on_the_clock_and_the_current_status
        claim_type: Conditional action
        grounds:
          - endpoints[POST /integrity/case-meetings/{id}/outcome]
          - validations[priority=18]
          - validations[priority=41]
          - errors.ERR_MEETING_WINDOW_INVALID
          - errors.ERR_MEETING_STATE_INVALID
          - state_machines.CaseMeeting
        distinguishing_aspect: |
          The same endpoint admits different outcomes at different instants on the SAME row. HELD is
          refused with ERR_MEETING_WINDOW_INVALID before start_at but accepted from start_at onwards;
          NO_SHOW is refused before end_at (even while the meeting is in progress and HELD would already
          be legal) and accepted from end_at onwards; CANCELLED is accepted at any instant, including
          before start_at. Once any outcome has been recorded the row leaves SCHEDULED and every further
          call is ERR_MEETING_STATE_INVALID (priority 18), which outranks the window check.
