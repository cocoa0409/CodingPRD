    instances:
      - name: list_claims_filtered_by_member
        claim_type: computed_read
        grounds: ["endpoints.GET_/stop-loss/claims"]
        distinguishing_aspect: "GET /stop-loss/claims?member_id={id} returns only that member's claims."
        test_recipe:
          setup: ["Plan, two members each with one claim"]
          setup_api_calls:
            - call: "POST /stop-loss/plans"
              payload: { plan_name: "P", sponsor_tax_id: "99-4444444" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /stop-loss/members"
              payload: { plan_id: "${plan_id}", member_external_id: "A", date_of_birth: "1980-01-01", coverage_start: "2025-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { ma: $.data.id }
            - call: "POST /stop-loss/members"
              payload: { plan_id: "${plan_id}", member_external_id: "B", date_of_birth: "1981-01-01", coverage_start: "2025-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { mb: $.data.id }
            - call: "POST /stop-loss/claims"
              payload: { plan_id: "${plan_id}", member_id: "${ma}", service_date: "2026-02-01T00:00:00Z", billed_amount_cents: 1000000, claim_type: "MEDICAL" }
              as: ClaimsExaminer
            - call: "POST /stop-loss/claims"
              payload: { plan_id: "${plan_id}", member_id: "${mb}", service_date: "2026-02-01T00:00:00Z", billed_amount_cents: 2000000, claim_type: "RX" }
              as: ClaimsExaminer
          trigger:
            - call: "GET /stop-loss/claims"
              payload: {}
              as: PlanAdministrator
          assert:
            - "Filtering by member_id=${ma} returns exactly 1 claim (billed_amount_cents == 1000000)"

      - name: forecast_endpoint_creates_entity
        claim_type: standard_crud
        grounds: ["endpoints.POST_/stop-loss/forecasts"]
        distinguishing_aspect: "POST /stop-loss/forecasts returns 201 with a computed HighCostClaimantForecast carrying projected_excess_cents, projected_member_count, computed_at."
        test_recipe:
          setup: ["Plan with zero claims"]
          setup_api_calls:
            - call: "POST /stop-loss/plans"
              payload: { plan_name: "P", sponsor_tax_id: "99-5555555" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /stop-loss/forecasts"
              payload: { plan_id: "${plan_id}", forecast_basis: "PURE_EXPERIENCE", next_year_specific_deductible_cents: 10000000 }
              as: PlanAdministrator
              captures: { fc_id: $.data.id, fc_excess: $.data.projected_excess_cents }
          assert:
            - "HTTP 201; projected_excess_cents == 0 (no claims); projected_member_count == 0"

      - name: clock_set_endpoint_default
        claim_type: conditional_action
        grounds: ["endpoints.POST_/stop-loss/_clock/set_current_utc"]
        distinguishing_aspect: "Before any clock-set, the server's logical clock reads exactly 2026-08-01T00:00:00Z; after set, it reads the new value."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdministrator
          assert:
            - "HTTP 200; subsequent time-sensitive operations use 2026-01-01 as 'now'"

