            - "HOP 1 — AnnualComplianceTest.${test_y2_id}.window_start_at == \"2027-09-01T00:00:00.000Z\", window_end_at == \"2028-08-31T00:00:00.000Z\", measured_pct_direct == 31.58, result == FAIL, recapture_triggered == true"
            - "HOP 2 — QEI.${qei_id}.compliance_status == RECAPTURED, recapture_trigger_type == SUBSTANTIALLY_ALL_FAILURE, compliance_years_completed == 2, recapture_exposure_cents == 10600000"
            - "HOP 3 — AllocationAward.${award_id}.recaptured_qei_count == 1, at_risk_qei_count == 0, compliance_posture == FROZEN"
            - "HOP 4 — the follow-up POST /nmtc/qlicis returns 409 with error_id == \"ERR_AWARD_POSTURE_RESTRICTED\" (the FROZEN posture at priority 14 is reached before the RECAPTURED check at priority 16)"
            - "HOP 4 — QEI.${qei_id}.uninvested_cash_cents == 65000000 unchanged by the refused deployment"
            - "AnnualComplianceTest.${test_y2_id}.recertification_swept_qalicb_count == 1 and QALICB.${qalicb_id}.eligibility_status == RECERTIFICATION_DUE (last_certified_at 2026-09-01 is more than 365 days before 2028-08-31)"
