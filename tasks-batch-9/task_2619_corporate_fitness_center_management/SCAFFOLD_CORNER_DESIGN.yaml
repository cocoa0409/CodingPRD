            - call: "POST /client-contracts/${c_id}/client-decision"
              payload: { decision: "APPROVE" }
              as: ClientSponsor
              as_user_id: "${c_id}"
            - call: "POST /members"
              payload: { contract_id: "${c_id}", member_class: "EMPLOYEE", full_name: "Iris Okafor", employee_number: "E-1001" }
              as: ClientSponsor
              as_user_id: "${c_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/eligibility-decisions"
              payload: { action: "VERIFY" }
              as: ClientSponsor
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /members"
              payload: { contract_id: "${c_id}", member_class: "DEPENDENT", full_name: "Noa Okafor", sponsor_member_id: "${m1_id}" }
              as: ClientSponsor
