  - rule_id: compensating_invariant
    instances:

      - name: earnout_pool_conserved_across_reserve_settle_clawback
        grounds:
          - calculations.earnout_pool_ledger
          - entities.Affiliation.fields.earnout_unallocated_cents
          - entities.Affiliation.fields.earnout_reserved_cents
          - entities.Affiliation.fields.earnout_settled_cents
          - state_machines.EarnoutTranche.SETTLED_to_CLAWED_BACK
        distinguishing_aspect: |
          The conserved quantity is money: earnout_pool_cents must equal
          unallocated + reserved + settled after every write, and the claw-back
          returns exactly the 41921250 that settlement moved, restoring
          earnout_unallocated_cents to the original 90000000 with zero drift.
        test_recipe:
          setup:
            - "One Affiliation CLOSED at 2026-09-01T00:00:00Z with earnout_pool_cents 90000000, earnout_unallocated_cents 90000000, earnout_reserved_cents 0 and earnout_settled_cents 0."
            - "One PROJECTED EarnoutTranche over [2026-09-01, 2027-09-01) with the logical clock at 2027-03-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /dso/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: DsoIntegrationLead
            - call: "POST /dso/affiliations"
