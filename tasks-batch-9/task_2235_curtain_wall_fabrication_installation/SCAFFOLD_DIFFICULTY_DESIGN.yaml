          elevation_label: NORTH
          area_sqm: 388.63
          height_m: 24.0
          span_mm: 3200
          anchor_type: SLOTTED
          designed_joint_mm: 22.0
          planned_panel_count: 36
          budget_crew_hours: 320.0
        as: CWProjectManager
        captures:
          z2: $.data.id
      - call: POST /hoist-rigs
        payload:
          package_id: ${pkg}
          rig_code: HR-1
          rig_kind: MAST_CLIMBER
          capacity_panels_per_shift: 20
          changeover_buffer_minutes: 45
        as: FieldSuperintendent
        captures:
          rig: $.data.id
      - call: POST /hoist-reservations
        payload:
          rig_id: ${rig}
          zone_id: ${z1}
          window_start: '2026-08-10T06:00:00Z'
          window_end: '2026-08-10T12:00:00Z'
          planned_panel_count: 36
        as: FieldSuperintendent
        captures:
          res1: $.data.id
      trigger:
      - call: POST /hoist-reservations
        payload:
          rig_id: ${rig}
          zone_id: ${z2}
          window_start: '2026-08-10T12:30:00Z'
          window_end: '2026-08-10T16:00:00Z'
          planned_panel_count: 30
        as: FieldSuperintendent
        captures:
          e_conflict: $.data.error_id
      - call: POST /hoist-reservations
        payload:
          rig_id: ${rig}
          zone_id: ${z2}
          window_start: '2026-08-10T12:45:00Z'
          window_end: '2026-08-10T16:00:00Z'
          planned_panel_count: 30
        as: FieldSuperintendent
        captures:
          res2: $.data.id
      assert:
      - HoistReservation.${res1}.blocked_from == 2026-08-10T05:15:00Z and blocked_until == 2026-08-10T12:45:00Z
      - the 12:30 request returns ERR_HOIST_WINDOW_CONFLICT with HTTP 409 (12:30 lies inside [05:15, 12:45))
      - 'the 12:45 request returns 201: window_start == blocked_until is not an intersection under half-open comparison'
      - HoistReservation.${res2}.blocked_from == 2026-08-10T12:00:00Z and blocked_until == 2026-08-10T16:45:00Z
      - the accepted request was not itself expanded by the buffer - had it been, its effective start 12:00 would have collided
        with res1
      - HoistReservation.${res1}.status == RESERVED and HoistReservation.${res2}.status == RESERVED
      - a third request for 2026-08-10T16:44:00Z -> 2026-08-10T18:00:00Z on the same rig returns ERR_HOIST_WINDOW_CONFLICT,
        one minute inside res2 blocked_until
