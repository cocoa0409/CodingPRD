            - { call: "POST /arc/applications/${app1}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_b}" }
            - { call: "POST /arc/applications/${app1}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_c}" }
            - { call: "POST /arc/applications/${app1}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_e}" }
            - { call: "POST /arc/applications/${app1}/decide", payload: { conditions: [] }, as: Manager }
            - { call: "POST /arc/properties/${prop}/applications", payload: { owner_id: "${owner_a}", project_type: PAINT, guideline_section: "SEC-3.1", description: "repaint", requested_window_start: "2026-06-15", requested_window_end: "2026-07-15" }, as: Homeowner, as_user_id: "${owner_a}", captures: { app2: $.data.id } }
            - { call: "POST /arc/applications/${app2}/attachments", payload: { kind: DRAWING, label: "elev", uri: "s3://o/d2" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app2}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "paint", uri: "s3://o/m2" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app2}/submit", as: Homeowner, as_user_id: "${owner_a}" }
