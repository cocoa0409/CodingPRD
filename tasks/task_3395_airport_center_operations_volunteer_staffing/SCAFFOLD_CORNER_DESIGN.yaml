  - section: complexity_layers
    instances:
      - name: occ_screening_create_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[screening-create-stale-volunteer]
        distinguishing_aspect: "Stale expected_volunteer_version is rejected 412 before the state check; with a fresh version the same second-create fails later as ERR_SCREENING_ALREADY_OPEN — proving OCC precedence."
        test_recipe:
          setup: ["Center; volunteer (version observed at creation); one screening already opened (volunteer now SCREENING, version 2)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Tav Center", airport_code: "LBB", occupancy_cap: 10, required_daily_confirmed_assignments: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /volunteers"
              payload: { full_name: "V Occ", email: "vo2@x.org", home_center_id: "${c_id}" }
              as: Anonymous
              captures: { v_id: $.data.id, v_v: $.data.version }
            - call: "POST /volunteers/${v_id}/screenings"
              payload: { expected_volunteer_version: "${v_v}" }
              as: CenterManager
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /volunteers/${v_id}/screenings"
              payload: { expected_volunteer_version: "${v_v}" }
              as: CenterManager
              captures: { err_stale: $.data.error_id }
            - call: "GET /volunteers/${v_id}"
              as: CenterManager
              captures: { v_fresh: $.data.version }
            - call: "POST /volunteers/${v_id}/screenings"
              payload: { expected_volunteer_version: "${v_fresh}" }
              as: CenterManager
              captures: { err_state: $.data.error_id }
          assert:
            - "replay with the pre-first-create version rejected ERR_STALE_VERSION (412)"
            - "with a fresh version the same call passes OCC and fails state: ERR_SCREENING_ALREADY_OPEN (volunteer SCREENING)"
      - name: occ_expense_post_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[expense-post-stale-center]
        distinguishing_aspect: "The expense endpoint bumps Center.version on success; replaying the same expected_center_version is rejected 412, so the waterfall is never driven by a stale view."
        test_recipe:
          setup: ["Center (no agreement needed for expenses); grant 10000 cents; center version captured by a fresh GET"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Kaf2 Center", airport_code: "MFE", occupancy_cap: 10, required_daily_confirmed_assignments: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /funding-grants"
              payload: { center_id: "${c_id}", donor_name: "Donor E", amount_cents: 10000, spend_by_date: "2026-12-31" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "GET /centers/${c_id}"
              as: CenterManager
              captures: { cv: $.data.version }
            - call: "POST /centers/${c_id}/expenses"
              payload: { amount_cents: 100, description: "first", expected_center_version: "${cv}" }
              as: CenterManager
              captures: { posted1: $.data.posted_cents }
          trigger:
            - call: "POST /centers/${c_id}/expenses"
              payload: { amount_cents: 200, description: "second", expected_center_version: "${cv}" }
              as: CenterManager
              captures: { err: $.data.error_id }
          assert:
            - "first expense posts (posted_cents == 100) and bumps Center.version"
            - "second expense with the same (now stale) expected_center_version rejected ERR_STALE_VERSION (412); grant spent_cents stays 100"
      - name: occ_agreement_activate_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[agreement-activate-stale-center]
        distinguishing_aspect: "Activate supersedes the center's ACTIVE agreement, so it OCC-guards on Center.version: a stale expected version from before the first activation is rejected 412 and no supersede happens."
        test_recipe:
          setup: ["Center; agreement A activated (center version now 2); agreement B SUBMITTED; client holds the pre-activation version 1"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Mem2 Center", airport_code: "SPS", occupancy_cap: 10, required_daily_confirmed_assignments: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /centers/${c_id}/site-agreements"
              payload: { facility_space_sqft: 300, utilities_included: true, access_terms: "badge", security_level: 1, start_date: "2026-09-01", end_date: "2027-08-31" }
              as: PlatformAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /site-agreements/${a1_id}/activate"
              payload: { expected_center_version: "${c_v}" }
              as: PlatformAdmin
            - call: "POST /centers/${c_id}/site-agreements"
              payload: { facility_space_sqft: 400, utilities_included: false, access_terms: "badge-plus", security_level: 2, start_date: "2026-09-01", end_date: "2027-08-31" }
              as: PlatformAdmin
              captures: { a2_id: $.data.id }
          trigger:
            - call: "POST /site-agreements/${a2_id}/activate"
              payload: { expected_center_version: "${c_v}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "activating B with the stale pre-A version rejected ERR_STALE_VERSION (412)"
            - "agreement A remains ACTIVE and B remains SUBMITTED (no supersede; read via GET /centers/${c_id}/site-agreements)"
      - name: grant_expiry_run_ops
        claim_type: ops_run_checkpoint
        grounds:
          - state_machines.FundingGrant.ACTIVE_to_EXPIRED
          - "errors[ERR_BUDGET_EXCEEDED]"
        distinguishing_aspect: "run_ops expires ACTIVE grants past spend_by_date; an expired grant leaves the waterfall candidate set, so a later expense fails ERR_BUDGET_EXCEEDED."
        test_recipe:
          setup: ["Center; grant 800 cents spend_by 2026-09-05; clock advanced to 2026-09-06; run_ops executed"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Nun2 Center", airport_code: "GRB", occupancy_cap: 10, required_daily_confirmed_assignments: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /funding-grants"
              payload: { center_id: "${c_id}", donor_name: "Donor F", amount_cents: 800, spend_by_date: "2026-09-05" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers/${c_id}/run_ops"
              as: CenterManager
            - call: "GET /centers/${c_id}"
              as: CenterManager
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /centers/${c_id}/expenses"
              payload: { amount_cents: 100, description: "too late", expected_center_version: "${cv}" }
              as: CenterManager
              captures: { err: $.data.error_id }
          assert:
            - "grant ${g_id} status == EXPIRED after run_ops (spend_by 2026-09-05 < 2026-09-06)"
            - "expense rejected ERR_BUDGET_EXCEEDED (no ACTIVE grant remains; 800 cents are unspendable)"
      - name: event_auto_sweep_run_ops
        claim_type: ops_run_checkpoint
        grounds:
          - state_machines.Event.CONFIRMED_to_EXECUTED
          - state_machines.Event.PLANNED_to_CANCELLED
        distinguishing_aspect: "One run_ops epoch resolves both directions: a CONFIRMED event past its end becomes EXECUTED while a never-confirmed PLANNED event past its start becomes CANCELLED."
        test_recipe:
          setup: ["Center; ev1 DEPLOYMENT 10:00-12:00 confirmed; ev2 DEPLOYMENT 14:00-16:00 left PLANNED; clock at 2026-09-10T17:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Ayin2 Center", airport_code: "ATW", occupancy_cap: 10, required_daily_confirmed_assignments: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /centers/${c_id}/events"
              payload: { kind: "DEPLOYMENT", name: "Ev One", start_at: "2026-09-10T10:00:00Z", end_at: "2026-09-10T12:00:00Z", min_volunteers: 0 }
              as: CenterManager
              captures: { ev1_id: $.data.id }
            - call: "POST /events/${ev1_id}/confirm"
              as: CenterManager
            - call: "POST /centers/${c_id}/events"
              payload: { kind: "DEPLOYMENT", name: "Ev Two", start_at: "2026-09-10T14:00:00Z", end_at: "2026-09-10T16:00:00Z", min_volunteers: 0 }
              as: CenterManager
              captures: { ev2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T17:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /centers/${c_id}/run_ops"
              as: CenterManager
            - call: "GET /centers/${c_id}/events"
              as: CenterManager
              captures: { ev_list: $.data }
          assert:
            - "Event.${ev1_id}.status == EXECUTED (CONFIRMED, end 12:00 <= 17:00)"
            - "Event.${ev2_id}.status == CANCELLED (still PLANNED, start 14:00 <= 17:00 — stale sweep)"
      - name: derived_hours_accumulate
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Volunteer.fields.total_hours
          - state_machines.ShiftAssignment.CONFIRMED_to_COMPLETED
        distinguishing_aspect: "Volunteer.total_hours is a derived accumulator: two completions of 2.5 and 2.0 hours yield exactly 4.5, refreshed on every mutation."
        test_recipe:
