            - call: "POST /casting/locations"
              payload: { name: "River Street Block", state_code: "GA", capacity: 800, turnaround_buffer_minutes: 90, filming_permit_number: "GA-SAV-2026-0455" }
              as: ProductionAdmin
              captures: { loc_permit_id: $.data.id }
          trigger:
            - call: "POST /casting/shoot-blocks"
              payload: { production_id: "${prod_id}", location_id: "${loc_bare_id}", block_kind: "LOCATION_EXTERIOR", start_utc: "2026-09-20T08:00:00Z", end_utc: "2026-09-20T12:00:00Z", participant_agreement_ids: [] }
              as: ProductionAdmin
              captures: { permit_err: $.data.error_id }
            - call: "POST /casting/shoot-blocks"
              payload: { production_id: "${prod_id}", location_id: "${loc_bare_id}", block_kind: "STUDIO", start_utc: "2026-09-20T08:00:00Z", end_utc: "2026-09-20T12:00:00Z", participant_agreement_ids: [] }
              as: ProductionAdmin
              captures: { studio_id: $.data.id, studio_status: $.data.status }
            - call: "POST /casting/shoot-blocks"
              payload: { production_id: "${prod_id}", location_id: "${loc_permit_id}", block_kind: "LOCATION_EXTERIOR", start_utc: "2026-09-20T08:00:00Z", end_utc: "2026-09-20T12:00:00Z", participant_agreement_ids: [] }
              as: ProductionAdmin
              captures: { ext_id: $.data.id, ext_status: $.data.status }
          assert:
            - "${loc_bare_permit} == null"
            - "${permit_err} == ERR_LOCATION_PERMIT_MISSING"
            - "HTTP 422 on the exterior block at the permitless venue"
            - "${studio_status} == SCHEDULED"
            - "${ext_status} == SCHEDULED"
            - "ShootBlock.${studio_id}.minor_participant_count == 0"

