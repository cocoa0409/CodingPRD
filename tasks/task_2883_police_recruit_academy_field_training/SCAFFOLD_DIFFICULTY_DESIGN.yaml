          assert:
            - "POST /course-sessions 11:00:00Z - 13:00:00Z room R1 -> 201  # gap == 0 in the SAME room is allowed under half-open semantics"
            - "CourseSession.${cs2_id}.status == SCHEDULED"
            - "POST /course-sessions 13:00:00Z - 15:00:00Z room R2 -> 409 ERR_INSTRUCTOR_SCHEDULE_CONFLICT  # gap == 0 from the 11:00-13:00 session but a DIFFERENT room"
            - "POST /course-sessions 13:15:00Z - 15:00:00Z room R2 -> 201  # gap == exactly 15 minutes is not < 15"
            - "CourseSession.${cs3_id}.status == SCHEDULED"
            - "POST /course-sessions 10:00:00Z - 12:00:00Z room R1 -> 409 ERR_INSTRUCTOR_SCHEDULE_CONFLICT  # genuine interior intersection with 09:00-11:00"
            - "GET /course-sessions?instructor_id=${instrA} returns data.total_count == 3"
            - "CourseSession.${cs1_id}.scheduled_hours == 2.00"
            - "CourseSession.${cs3_id}.scheduled_hours == 1.75  # 13:15 -> 15:00"

      - name: rotation_closed_interval_adjacency_counts_as_overlap
        grounds:
          - validations[priority 60 category business_temporal ERR_ROTATION_DATE_OVERLAP]
          - entities.FieldTrainingRotation.fields.start_date
          - entities.FieldTrainingRotation.fields.end_date
          - concurrency_rules[rotation-create-stale-recruit]
          - errors.ERR_ROTATION_DATE_OVERLAP
        distinguishing_aspect: |
          The trainee's rotation intervals are CLOSED [start_date, end_date], the exact OPPOSITE of
          the instructor's half-open session intervals in the same scaffold: a phase-2 rotation
          starting on the day the phase-1 rotation ends is a conflict, and only a start one day later
          is accepted. The blocked predecessor is COMPLETED, not active, so the rule spans
