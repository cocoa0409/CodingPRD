              payload: {}
              as: SalesLead
            - call: "POST /demand-opportunities/${d1_id}/staffing-mode"
              payload: { staffing_mode: "INTERNAL" }
              as: ResourceManager
            - call: "POST /assignments"
              payload: { consultant_id: "${c1_id}", demand_opportunity_id: "${d1_id}", allocation_pct: 100.00, start_date: "2026-08-03", end_date: "2026-08-29", category: "BILLABLE", expected_consultant_version: "${c1_v}" }
