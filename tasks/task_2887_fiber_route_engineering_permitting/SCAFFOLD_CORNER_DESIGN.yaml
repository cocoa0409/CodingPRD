              payload: { route_id: "${route_a}", sequence_index: 1, street_name: "Dock Street", municipality_code: "MUN-014", length_feet: 400, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20" }
              as: RouteEngineer
              captures: { seg1_id: $.data.id }
            - call: "GET /routes/${route_a}"
              payload: {}
              as: RouteEngineer
              captures: { rva: $.data.version }
          trigger:
            - call: "POST /segments"
              payload: { route_id: "${route_a}", sequence_index: 1, street_name: "Orchard Road", municipality_code: "MUN-014", length_feet: 300, terrain_class: "RURAL_SHOULDER", planned_work_start_on: "2026-09-21", planned_work_end_on: "2026-09-25" }
              as: RouteEngineer
              captures: { err: $.data.error_id }
            - call: "POST /segments"
              payload: { route_id: "${route_b}", sequence_index: 1, street_name: "Orchard Road", municipality_code: "MUN-014", length_feet: 300, terrain_class: "RURAL_SHOULDER", planned_work_start_on: "2026-09-21", planned_work_end_on: "2026-09-25" }
