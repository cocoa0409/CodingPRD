      - name: supplier_qualification_expiry_is_inclusive_rejected
        claim_type: priority_ordering
        grounds:
          - validations[priority 11]
          - validations[priority 27]
          - errors[ERR_COMPONENT_SUPPLIER_NOT_QUALIFIED]
          - errors[ERR_QUALIFICATION_EXPIRED]
          - entities.Supplier.fields.qualified_until
        distinguishing_aspect: >
          qualified_until is an INCLUSIVE expiry, so a release at exactly that instant must succeed and a
          release one second later must fail - an implementation using a strict `>` rejects the boundary release.
          Priority 11 also outranks 27: a PENDING supplier has no qualified_until at all, so the answer must be
          ERR_COMPONENT_SUPPLIER_NOT_QUALIFIED rather than an expiry error derived from a null.
        test_recipe:
          setup:
            - "Supplier Meridian Controls was qualified with qualified_until 2026-08-02T00:00:00Z while the clock still read 2026-08-01T00:00:00Z, and the clock was then advanced to exactly that expiry instant."
            - "Supplier Aegis Safety was never qualified and is PENDING with qualified_until null."
            - "Each supplier has one QUARANTINED lot awaiting release."
            - "The logical clock now reads exactly 2026-08-02T00:00:00Z, the qualification expiry instant, so the qualify precondition (qualified_until strictly after now) was satisfied when it ran but the expiry is now exactly reached."
          setup_api_calls:
            - call: "POST /mfg/suppliers"
              payload: { name: "Meridian Controls", component_category: "GAS_VALVE", audit_score: 96, defect_ppm: 1000, open_capa_count: 0 }
