              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
              captures: { offer1_id: $.data.id }
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: PricingAnalyst
              captures: { prop_v: $.data.version }
          trigger:
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05, expected_property_version: "${prop_v}" }
              as: PricingAnalyst
              captures: { offer2_id: $.data.id }
          assert:
            - "Offer.${offer1_id}.status == SUPERSEDED"
            - "Offer.${offer2_id}.status == ISSUED"
            - "Property.${prop_id}.active_offer_id == ${offer2_id}"
            - "count of Offers for property with status==ISSUED == 1"
