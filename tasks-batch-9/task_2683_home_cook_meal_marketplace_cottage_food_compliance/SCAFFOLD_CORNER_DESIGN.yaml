          trigger:
            - call: POST /orders
              payload: { menu_item_id: "${mi_id}", production_window_id: "${w_id}", delivery_zone_id: "${dz_id}", quantity: 3, diner_contact_email: "diner1@example.com" }
              as: Diner
              as_user_id: diner-1
              captures: { o_id: "$.data.id", subtotal: "$.data.subtotal_cents", fee: "$.data.diner_service_fee_cents", commission: "$.data.platform_commission_cents", earnings: "$.data.cook_earnings_cents", total: "$.data.total_charge_cents", rate: "$.data.commission_rate", snapshot: "$.data.unit_price_cents_snapshot" }
            - call: GET /orders/${o_id}
              payload: {}
              as: FinanceOperator
              as_user_id: fin-1
              captures: { total_read: "$.data.total_charge_cents", surcharge_read: "$.data.cold_chain_surcharge_cents" }
          assert:
            - "${price} == 610 and ${mi_status} == APPROVED"
            - "${snapshot} == 610 and ${subtotal} == 1830 (610 * 3)"
            - "${fee} == 165, not 164: round_half_up(1830 * 0.09) == round_half_up(164.70)"
            - "${rate} == 0.225 (ytd_gross_sales_cents is 0, strictly below COMMISSION_TIER_1_CEILING_CENTS)"
            - "${commission} == 412, not 411: round_half_up(1830 * 0.225) == round_half_up(411.75)"
            - "${earnings} == 1418 == 1830 - 412, not round_half_up(1830 * 0.775) == 1418 by coincidence - the field is defined as the exact complement"
            - "${total} == 1995 == 1830 + 0 + 165, and ${surcharge_read} == 0 because the order has not been routed yet"
            - "${total_read} == 1995 on re-read: the placement figures are persisted, not recomputed per request"

