# =============================================================================
# Task 1199 §1.8: Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2-3 instances = 23 instances. Every setup chain is replayed against
# SCAFFOLD.yaml §1.2/§1.4/§1.6; all formula-derived asserts are precomputed literals.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_vs_final_diverge
        grounds:
          - calculations.settlement_financials
          - calculations.festival_share_tiered
          - state_machines.Settlement.OPEN_to_RECONCILING
          - state_machines.Settlement.RECONCILING_to_FINALIZED
          - state_machines.PosTransaction.REPORTED_to_SETTLED
        distinguishing_aspect: |
          Dual-variant calculation on the Settlement domain: the provisional variant
          (REPORTED set at reconcile, zero fine deduction) and the final variant
          (late-arriving in-window transactions included, ACKNOWLEDGED fines deducted)
          produce different gross/share/payout for the SAME assignment — pinned here
          as 200000/20000/180000 provisional vs 250000/25000/200000 final.
        test_recipe:
          setup:
            - "Festival (cap 2) driven to LIVE with one ACTIVE assignment (REVENUE_SHARE 1000bp MARGINAL)"
            - "Two REPORTED transactions of 100000 cents exist; settlement reconciled (provisional snapshot taken)"
            - "A third in-window transaction of 50000 cents reported AFTER reconcile; a 25000-cent fine ACKNOWLEDGED"
            - "Logical clock moved past event_end; festival advanced to SETTLEMENT"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FestivalDirector }
            - call: "POST /festivals"
              payload: { name: "Solstice Fest", event_start: "2026-07-10T12:00:00Z", event_end: "2026-07-12T23:00:00Z", category_cap_per_category: 2 }
              as: FestivalDirector
              captures: { fest: $.data.id }
            - call: "POST /zones"
              payload: { festival_id: "${fest}", name: "North", power_capacity_amps: 100, water_hookup_total: 2 }
              as: OperationsLead
              captures: { zone: $.data.id }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "APPLICATIONS_OPEN" }, as: FestivalDirector }
            - call: "POST /vendors"
              payload: { legal_name: "Taco Titan LLC", contact_email: "ops@tacotitan.com" }
              as: VendorManager
              captures: { vend: $.data.id }
            - call: "POST /vendor-applications"
              payload: { vendor_id: "${vend}", festival_id: "${fest}", category: "FOOD_HOT", fee_model: "REVENUE_SHARE", proposed_revenue_share_pct_bp: 1000, power_needed_amps: 30, requires_water: false }
              as: Vendor
              as_user_id: "${vend}"
              captures: { app: $.data.id }
            - { call: "POST /vendor-applications/${app}/start-review", payload: {}, as: VendorManager }
            - call: "POST /vendor-applications/${app}/decide"
              payload: { decision: "ACCEPTED", curated_fee_model: "REVENUE_SHARE", curated_revenue_share_pct_bp: 1000, curated_tier_mode: "MARGINAL" }
              as: VendorManager
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "CURATED" }, as: FestivalDirector }
            - call: "POST /booths"
              payload: { zone_id: "${zone}", label: "N-01", power_outlet_max_amps: 60, has_water_hookup: true }
              as: OperationsLead
              captures: { booth: $.data.id }
            - call: "POST /booth-assignments"
              payload: { application_id: "${app}", booth_id: "${booth}", power_draw_amps: 30, requires_water: false }
              as: OperationsLead
              captures: { asg: $.data.id }
            - { call: "POST /booth-assignments/${asg}/confirm", payload: {}, as: OperationsLead }
            - { call: "POST /booth-assignments/${asg}/provision-utilities", payload: {}, as: OperationsLead }
            - { call: "POST /inspection-records", payload: { assignment_id: "${asg}", type: "HEALTH_PREOPEN", result: "PASS" }, as: HealthInspector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-10T12:00:00Z" }, as: FestivalDirector }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "LIVE" }, as: FestivalDirector }
            - { call: "POST /booth-assignments/${asg}/activate", payload: {}, as: OperationsLead }
            - { call: "POST /pos-transactions", payload: { assignment_id: "${asg}", amount_cents: 100000, occurred_at: "2026-07-10T14:00:00Z", idempotency_key: "s1-t1" }, as: Vendor, as_user_id: "${vend}" }
            - { call: "POST /pos-transactions", payload: { assignment_id: "${asg}", amount_cents: 100000, occurred_at: "2026-07-10T15:00:00Z", idempotency_key: "s1-t2" }, as: Vendor, as_user_id: "${vend}" }
            - call: "POST /settlements"
              payload: { assignment_id: "${asg}" }
              as: FinanceLead
              as_user_id: "fin-1"
              captures: { stl: $.data.id }
            - call: "POST /settlements/${stl}/reconcile"
              payload: {}
              as: FinanceLead
              as_user_id: "fin-1"
              captures: { prov_gross: $.data.provisional_gross_cents, prov_share: $.data.provisional_share_cents, prov_payout: $.data.provisional_payout_cents }
            - { call: "POST /pos-transactions", payload: { assignment_id: "${asg}", amount_cents: 50000, occurred_at: "2026-07-11T13:00:00Z", idempotency_key: "s1-t3" }, as: Vendor, as_user_id: "${vend}" }
            - call: "POST /compliance-fines"
              payload: { assignment_id: "${asg}", type: "WASTE_SORTING", amount_cents: 25000 }
              as: SustainabilityOfficer
              as_user_id: "sus-1"
              captures: { fine: $.data.id }
            - { call: "POST /compliance-fines/${fine}/respond", payload: { response: "ACKNOWLEDGED" }, as: Vendor, as_user_id: "${vend}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-13T00:00:00Z" }, as: FestivalDirector }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "SETTLEMENT" }, as: FestivalDirector }
          trigger:
            - call: "POST /settlements/${stl}/finalize"
              payload: {}
              as: FinanceLead
              as_user_id: "fin-2"
              captures: { fin_gross: $.data.gross_sales_cents, fin_share: $.data.festival_share_cents, fin_ded: $.data.fine_deduction_cents, fin_payout: $.data.vendor_payout_cents, fin_due: $.data.vendor_balance_due_cents, fin_status: $.data.status }
          assert:
            - "captured provisional trio == (200000, 20000, 180000): ${prov_gross}==200000, ${prov_share}==20000, ${prov_payout}==180000"
            - "final fields: ${fin_gross}==250000, ${fin_share}==25000, ${fin_ded}==25000, ${fin_payout}==200000, ${fin_due}==0"
            - "divergence: provisional_gross 200000 != final gross 250000 and provisional_payout 180000 != final payout 200000"
            - "conservation: ${fin_gross} + ${fin_due} == ${fin_share} + ${fin_payout} + ${fin_ded} (250000 + 0 == 25000 + 200000 + 25000)"
            - "${fin_status} == FINALIZED"
            - "GET /pos-transactions?assignment_id=${asg} -> all 3 rows status SETTLED"
            - "GET /performance-reviews?assignment_id=${asg} -> exactly 1 row with status PENDING (auto-created)"

      - name: performance_score_official_vs_strict_diverge
        grounds:
          - calculations.performance_score
          - calculations.sales_percentile
          - entities.PerformanceReview.fields.official_score
          - entities.PerformanceReview.fields.strict_score
        distinguishing_aspect: |
          Dual-variant calculation on the VendorPerformance domain (distinct from the
          Settlement domain of the sibling instance): with identical inputs, the
          official variant excludes the WAIVED fine (score 80) while the strict
          variant still charges 8 points for it (score 78).
        test_recipe:
          setup:
            - "Festival (cap 2) LIVE with two ACTIVE assignments: A (FOOD_HOT, FLAT_FEE 50000) and B (FOOD_COLD, FLAT_FEE 50000)"
            - "A posts one 200000-cent sale; B posts one 100000-cent sale"
            - "A has one 15000-cent WASTE_SORTING fine WAIVED (issuer sus-1, waver dir-1)"
            - "Both settlements finalized (fin-1 reconciles, fin-2 finalizes) after clock passes event_end; reviews auto-created"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FestivalDirector }
            - call: "POST /festivals"
              payload: { name: "Score Fest", event_start: "2026-07-10T12:00:00Z", event_end: "2026-07-12T23:00:00Z", category_cap_per_category: 2 }
              as: FestivalDirector
              captures: { fest: $.data.id }
            - call: "POST /zones"
              payload: { festival_id: "${fest}", name: "North", power_capacity_amps: 200, water_hookup_total: 2 }
              as: OperationsLead
              captures: { zone: $.data.id }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "APPLICATIONS_OPEN" }, as: FestivalDirector }
            - call: "POST /vendors"
              payload: { legal_name: "Alpha Eats LLC", contact_email: "a@alpha.com" }
              as: VendorManager
              captures: { va: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "Beta Bowls LLC", contact_email: "b@beta.com" }
              as: VendorManager
              captures: { vb: $.data.id }
            - call: "POST /vendor-applications"
              payload: { vendor_id: "${va}", festival_id: "${fest}", category: "FOOD_HOT", fee_model: "FLAT_FEE", proposed_flat_fee_cents: 50000, power_needed_amps: 30, requires_water: false }
              as: Vendor
              as_user_id: "${va}"
              captures: { appa: $.data.id }
            - call: "POST /vendor-applications"
              payload: { vendor_id: "${vb}", festival_id: "${fest}", category: "FOOD_COLD", fee_model: "FLAT_FEE", proposed_flat_fee_cents: 50000, power_needed_amps: 20, requires_water: false }
              as: Vendor
              as_user_id: "${vb}"
              captures: { appb: $.data.id }
            - { call: "POST /vendor-applications/${appa}/start-review", payload: {}, as: VendorManager }
            - { call: "POST /vendor-applications/${appa}/decide", payload: { decision: "ACCEPTED", curated_fee_model: "FLAT_FEE", curated_flat_fee_cents: 50000 }, as: VendorManager }
            - { call: "POST /vendor-applications/${appb}/start-review", payload: {}, as: VendorManager }
            - { call: "POST /vendor-applications/${appb}/decide", payload: { decision: "ACCEPTED", curated_fee_model: "FLAT_FEE", curated_flat_fee_cents: 50000 }, as: VendorManager }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "CURATED" }, as: FestivalDirector }
            - call: "POST /booths"
              payload: { zone_id: "${zone}", label: "N-01", power_outlet_max_amps: 60, has_water_hookup: true }
              as: OperationsLead
              captures: { b1: $.data.id }
            - call: "POST /booths"
              payload: { zone_id: "${zone}", label: "N-02", power_outlet_max_amps: 60, has_water_hookup: true }
              as: OperationsLead
              captures: { b2: $.data.id }
            - call: "POST /booth-assignments"
              payload: { application_id: "${appa}", booth_id: "${b1}", power_draw_amps: 30, requires_water: false }
              as: OperationsLead
              captures: { asga: $.data.id }
            - call: "POST /booth-assignments"
              payload: { application_id: "${appb}", booth_id: "${b2}", power_draw_amps: 20, requires_water: false }
              as: OperationsLead
              captures: { asgb: $.data.id }
            - { call: "POST /booth-assignments/${asga}/confirm", payload: {}, as: OperationsLead }
            - { call: "POST /booth-assignments/${asgb}/confirm", payload: {}, as: OperationsLead }
            - { call: "POST /booth-assignments/${asga}/provision-utilities", payload: {}, as: OperationsLead }
            - { call: "POST /booth-assignments/${asgb}/provision-utilities", payload: {}, as: OperationsLead }
            - { call: "POST /inspection-records", payload: { assignment_id: "${asga}", type: "HEALTH_PREOPEN", result: "PASS" }, as: HealthInspector }
            - { call: "POST /inspection-records", payload: { assignment_id: "${asgb}", type: "HEALTH_PREOPEN", result: "PASS" }, as: HealthInspector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-10T12:00:00Z" }, as: FestivalDirector }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "LIVE" }, as: FestivalDirector }
            - { call: "POST /booth-assignments/${asga}/activate", payload: {}, as: OperationsLead }
            - { call: "POST /booth-assignments/${asgb}/activate", payload: {}, as: OperationsLead }
            - { call: "POST /pos-transactions", payload: { assignment_id: "${asga}", amount_cents: 200000, occurred_at: "2026-07-10T14:00:00Z", idempotency_key: "pa1" }, as: Vendor, as_user_id: "${va}" }
            - { call: "POST /pos-transactions", payload: { assignment_id: "${asgb}", amount_cents: 100000, occurred_at: "2026-07-10T14:00:00Z", idempotency_key: "pb1" }, as: Vendor, as_user_id: "${vb}" }
            - call: "POST /compliance-fines"
              payload: { assignment_id: "${asga}", type: "WASTE_SORTING", amount_cents: 15000 }
              as: SustainabilityOfficer
              as_user_id: "sus-1"
              captures: { finea: $.data.id }
            - { call: "POST /compliance-fines/${finea}/waive", payload: {}, as: FestivalDirector, as_user_id: "dir-1" }
            - call: "POST /settlements"
              payload: { assignment_id: "${asga}" }
              as: FinanceLead
              as_user_id: "fin-1"
              captures: { stla: $.data.id }
            - call: "POST /settlements"
              payload: { assignment_id: "${asgb}" }
              as: FinanceLead
              as_user_id: "fin-1"
              captures: { stlb: $.data.id }
            - { call: "POST /settlements/${stla}/reconcile", payload: {}, as: FinanceLead, as_user_id: "fin-1" }
            - { call: "POST /settlements/${stlb}/reconcile", payload: {}, as: FinanceLead, as_user_id: "fin-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-13T00:00:00Z" }, as: FestivalDirector }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "SETTLEMENT" }, as: FestivalDirector }
            - { call: "POST /settlements/${stla}/finalize", payload: {}, as: FinanceLead, as_user_id: "fin-2" }
            - { call: "POST /settlements/${stlb}/finalize", payload: {}, as: FinanceLead, as_user_id: "fin-2" }
            - call: "GET /performance-reviews"
              payload: { assignment_id: "${asga}" }
              as: VendorManager
              captures: { reva: "$.data[0].id" }
          trigger:
            - call: "POST /performance-reviews/${reva}/compute-score"
              payload: {}
              as: VendorManager
              captures: { sp: $.data.sales_percentile, comp: $.data.compliance_component, ops: $.data.operations_component, official: $.data.official_score, strict: $.data.strict_score, rstatus: $.data.status }
          assert:
            - "${sp} == 50 (population = {A gross 200000, B gross 100000}, N=2, one peer below)"
            - "${comp} == 100 (WAIVED fine excluded from official compliance component)"
            - "${ops} == 100 (no NO_SHOW reservations, not FORFEITED)"
            - "${official} == 80 (round_half_up((40*50 + 30*100 + 30*100)/100))"
            - "${strict} == 78 (round_half_up((40*50 + 30*92 + 30*100)/100) = round_half_up(77.6))"
            - "official != strict with identical inputs -> the two variants diverge exactly by the waived-fine penalty"
            - "${rstatus} == SCORED (80 >= 70)"

  - rule_id: combinatorial_formula
    instances:
      - name: tiered_marginal_vs_whole_tier_nonlinear
        grounds:
          - calculations.festival_share_tiered
          - entities.BoothAssignment.fields.tier_mode
        distinguishing_aspect: |
          Mode (a) combinatorial formula: >=3 inputs (gross, negotiated pct, tier_mode)
          with non-linear interaction (nested min/max over tier ceilings, conditional
          branch on tier_mode). Same gross 600000 and same 2000bp: MARGINAL yields
          130000 (500000@2000bp + 100000@3000bp), WHOLE_TIER yields 180000
          (600000 @ 3000bp selected by post-add running gross).
        test_recipe:
          setup:
            - "Festival (cap 2) LIVE with ACTIVE assignments C (BEVERAGE_NA, REVENUE_SHARE 2000bp MARGINAL) and D (DESSERT, REVENUE_SHARE 2000bp WHOLE_TIER)"
            - "Each has exactly one REPORTED transaction of 600000 cents; settlements created"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FestivalDirector }
            - call: "POST /festivals"
              payload: { name: "Tier Fest", event_start: "2026-07-10T12:00:00Z", event_end: "2026-07-12T23:00:00Z", category_cap_per_category: 2 }
              as: FestivalDirector
              captures: { fest: $.data.id }
            - call: "POST /zones"
              payload: { festival_id: "${fest}", name: "North", power_capacity_amps: 200, water_hookup_total: 2 }
              as: OperationsLead
              captures: { zone: $.data.id }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "APPLICATIONS_OPEN" }, as: FestivalDirector }
            - call: "POST /vendors"
              payload: { legal_name: "Cider Co", contact_email: "c@cider.com" }
              as: VendorManager
              captures: { vc: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "Donut Co", contact_email: "d@donut.com" }
              as: VendorManager
              captures: { vd: $.data.id }
            - call: "POST /vendor-applications"
              payload: { vendor_id: "${vc}", festival_id: "${fest}", category: "BEVERAGE_NA", fee_model: "REVENUE_SHARE", proposed_revenue_share_pct_bp: 2000, power_needed_amps: 20, requires_water: false }
              as: Vendor
              as_user_id: "${vc}"
              captures: { appc: $.data.id }
            - call: "POST /vendor-applications"
              payload: { vendor_id: "${vd}", festival_id: "${fest}", category: "DESSERT", fee_model: "REVENUE_SHARE", proposed_revenue_share_pct_bp: 2000, power_needed_amps: 20, requires_water: false }
              as: Vendor
              as_user_id: "${vd}"
              captures: { appd: $.data.id }
            - { call: "POST /vendor-applications/${appc}/start-review", payload: {}, as: VendorManager }
            - { call: "POST /vendor-applications/${appc}/decide", payload: { decision: "ACCEPTED", curated_fee_model: "REVENUE_SHARE", curated_revenue_share_pct_bp: 2000, curated_tier_mode: "MARGINAL" }, as: VendorManager }
            - { call: "POST /vendor-applications/${appd}/start-review", payload: {}, as: VendorManager }
            - { call: "POST /vendor-applications/${appd}/decide", payload: { decision: "ACCEPTED", curated_fee_model: "REVENUE_SHARE", curated_revenue_share_pct_bp: 2000, curated_tier_mode: "WHOLE_TIER" }, as: VendorManager }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "CURATED" }, as: FestivalDirector }
            - call: "POST /booths"
              payload: { zone_id: "${zone}", label: "N-01", power_outlet_max_amps: 60, has_water_hookup: false }
              as: OperationsLead
              captures: { bc: $.data.id }
            - call: "POST /booths"
              payload: { zone_id: "${zone}", label: "N-02", power_outlet_max_amps: 60, has_water_hookup: false }
              as: OperationsLead
              captures: { bd: $.data.id }
            - call: "POST /booth-assignments"
              payload: { application_id: "${appc}", booth_id: "${bc}", power_draw_amps: 20, requires_water: false }
              as: OperationsLead
              captures: { asgc: $.data.id }
            - call: "POST /booth-assignments"
              payload: { application_id: "${appd}", booth_id: "${bd}", power_draw_amps: 20, requires_water: false }
              as: OperationsLead
              captures: { asgd: $.data.id }
            - { call: "POST /booth-assignments/${asgc}/confirm", payload: {}, as: OperationsLead }
            - { call: "POST /booth-assignments/${asgd}/confirm", payload: {}, as: OperationsLead }
            - { call: "POST /booth-assignments/${asgc}/provision-utilities", payload: {}, as: OperationsLead }
            - { call: "POST /booth-assignments/${asgd}/provision-utilities", payload: {}, as: OperationsLead }
            - { call: "POST /inspection-records", payload: { assignment_id: "${asgc}", type: "HEALTH_PREOPEN", result: "PASS" }, as: HealthInspector }
            - { call: "POST /inspection-records", payload: { assignment_id: "${asgd}", type: "HEALTH_PREOPEN", result: "PASS" }, as: HealthInspector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-10T12:00:00Z" }, as: FestivalDirector }
            - { call: "POST /festivals/${fest}/advance-status", payload: { to_status: "LIVE" }, as: FestivalDirector }
            - { call: "POST /booth-assignments/${asgc}/activate", payload: {}, as: OperationsLead }
            - { call: "POST /booth-assignments/${asgd}/activate", payload: {}, as: OperationsLead }
            - { call: "POST /pos-transactions", payload: { assignment_id: "${asgc}", amount_cents: 600000, occurred_at: "2026-07-10T14:00:00Z", idempotency_key: "tc1" }, as: Vendor, as_user_id: "${vc}" }
            - { call: "POST /pos-transactions", payload: { assignment_id: "${asgd}", amount_cents: 600000, occurred_at: "2026-07-10T14:00:00Z", idempotency_key: "td1" }, as: Vendor, as_user_id: "${vd}" }
            - call: "POST /settlements"
              payload: { assignment_id: "${asgc}" }
              as: FinanceLead
              as_user_id: "fin-1"
              captures: { stlc: $.data.id }
            - call: "POST /settlements"
              payload: { assignment_id: "${asgd}" }
              as: FinanceLead
              as_user_id: "fin-1"
              captures: { stld: $.data.id }
          trigger:
            - call: "POST /settlements/${stlc}/reconcile"
              payload: {}
              as: FinanceLead
              as_user_id: "fin-1"
              captures: { c_gross: $.data.provisional_gross_cents, c_share: $.data.provisional_share_cents, c_payout: $.data.provisional_payout_cents }
            - call: "POST /settlements/${stld}/reconcile"
              payload: {}
              as: FinanceLead
              as_user_id: "fin-1"
              captures: { d_gross: $.data.provisional_gross_cents, d_share: $.data.provisional_share_cents, d_payout: $.data.provisional_payout_cents }
          assert:
            - "${c_gross} == 600000 and ${d_gross} == 600000 (identical inputs)"
            - "MARGINAL: ${c_share} == 130000 (100000 + 30000), ${c_payout} == 470000"
            - "WHOLE_TIER: ${d_share} == 180000 (600000 * 3000bp), ${d_payout} == 420000"
            - "${c_share} != ${d_share} — tier_mode alone moves the share by 50000 cents"

      - name: per_line_rounding_order_pinned
        grounds:
          - calculations.per_transaction_rounding_policy
          - calculations.festival_share_tiered
        distinguishing_aspect: |
          Mode (b) combinatorial formula: nested rounding where order matters. Three
          105-cent transactions at 1000bp: pinned per-transaction rounding gives
          round_half_up(10.5)*3 = 33; the rejected sum-then-round order gives
          round_half_up(31.5) = 32. Assert observes 33, proving the pinned order.
        test_recipe:
          setup:
            - "Festival LIVE with one ACTIVE assignment E (FOOD_COLD, REVENUE_SHARE 1000bp MARGINAL)"
            - "Three REPORTED transactions of 105 cents each; settlement created"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FestivalDirector }
            - call: "POST /festivals"
              payload: { name: "Rounding Fest", event_start: "2026-07-10T12:00:00Z", event_end: "2026-07-12T23:00:00Z", category_cap_per_category: 2 }
              as: FestivalDirector
