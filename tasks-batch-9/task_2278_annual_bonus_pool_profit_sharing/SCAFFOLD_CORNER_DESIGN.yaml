# §1.9 Scaffold Corner Design — breadth probe for task 2278
# (Annual Bonus Pool & Profit Sharing Administration).
# Nine sections of references/claim-extraction-guide.md are walked against
# §1.1–§1.7 of SCAFFOLD.yaml: entities, state_machines, calculations,
# validations, endpoints, errors, rbac, cross_cutting_complexity_layers,
# consistency_model. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# carry an `excluded_because:` stub instead of a test_recipe.
#
# Recurring fixtures referenced from `setup:` prose (each instance still spells
# out its own complete setup_api_calls chain):
#   BASE-S   one unit, one plan (50/30/20, discretionary 10.00%), L5 target
#            20.00%, single REVENUE metric weight 100.00 (900/1000/1200) with
#            actual 1000 -> 100.00, one pool with a certified 100.00 scorecard,
#            one participant L5 20,000,000 hired 2025-03-01.
#   CHAIN-L  BASE-S certified (blended 100.00, multiplier 1.0000), pool funded
#            4,000,000 (min_utilization 3,980,000, discretionary budget
#            400,000), award allocated 4,000,000 at ratio 1.0000.
#   CHAIN-LC CHAIN-L calibrated and locked (locked_total 4,000,000).
#   CHAIN-LS CHAIN-LC executed on 2027-03-15 and settled (paid 4,000,000,
#            settlement burden 306,000).
scaffold_corner_design:

  - section: entities
    instances:

      - name: bonus_plan_creation_returns_declared_defaults_and_a_zeroed_ledger
        claim_type: Creation
        grounds:
          - entities.BonusPlan
          - endpoints."POST /bonus-plans"
        distinguishing_aspect: |
          A plan created with only the required inputs must come back 201 with
          every computed money field at 0, governance_posture COMPLIANT,
          status DRAFT and the two optional inputs at their declared defaults
          (discretionary_budget_pct 10.00, termination_treatment_policy
          STRICT_PAYMENT_DATE). An implementation that leaves the computed
          ledger fields null, or that omits them from the create response,
          fails.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /business-units"
              payload: { unit_code: "UNIT-A1", name: "Unit A1" }
              as: PlanAdmin
              captures: { unit_id: "$.data.id" }
          trigger:
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Creation Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "BonusPlan.${plan_id}.status == DRAFT"
            - "BonusPlan.${plan_id}.discretionary_budget_pct == 10.00"
            - "BonusPlan.${plan_id}.termination_treatment_policy == STRICT_PAYMENT_DATE"
            - "BonusPlan.${plan_id}.company_achievement_pct == 0.00"
            - "BonusPlan.${plan_id}.blended_achievement_pct == 0.00"
            - "BonusPlan.${plan_id}.funding_multiplier == 0.0000"
            - "BonusPlan.${plan_id}.total_target_cents == 0"
            - "BonusPlan.${plan_id}.funded_pool_cents == 0"
            - "BonusPlan.${plan_id}.discretionary_budget_cents == 0"
            - "BonusPlan.${plan_id}.accrued_total_cents == 0"
            - "BonusPlan.${plan_id}.true_up_cents == 0"
            - "BonusPlan.${plan_id}.over_allocated_pool_count == 0"
            - "BonusPlan.${plan_id}.under_utilized_pool_count == 0"
            - "BonusPlan.${plan_id}.governance_posture == COMPLIANT"
            - "BonusPlan.${plan_id}.certified_by_user_id == null and BonusPlan.${plan_id}.locked_by_user_id == null"
            - "BonusPlan.${plan_id}.version == 1"
            - "response meta contains api_request_id and api_request_timestamp, response_type == object"

      - name: bonus_plan_retrieval_returns_the_stored_record
        claim_type: Retrieval
        grounds:
          - entities.BonusPlan
          - endpoints."GET /bonus-plans/{planId}"
        distinguishing_aspect: |
          GET /bonus-plans/{planId} must echo exactly what POST persisted,
          including the non-default discretionary_budget_pct 12.50 and the
          GOOD_LEAVER_PRORATION policy, and must be readable by a role that
          cannot write the plan (FinanceController).
        test_recipe:
          setup:
            - "One plan created with discretionary_budget_pct 12.50 and termination_treatment_policy GOOD_LEAVER_PRORATION."
          setup_api_calls:
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Retrieval Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 40.00, business_unit_weight_pct: 40.00, individual_weight_pct: 20.00, discretionary_budget_pct: 12.50, termination_treatment_policy: "GOOD_LEAVER_PRORATION" }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "GET /bonus-plans/${plan_id}"
              payload: {}
              as: FinanceController
          assert:
            - "HTTP status == 200"
            - "BonusPlan.${plan_id}.plan_year == 2026 and BonusPlan.${plan_id}.plan_name == FY26 Retrieval Plan"
            - "BonusPlan.${plan_id}.company_weight_pct == 40.00 and BonusPlan.${plan_id}.business_unit_weight_pct == 40.00 and BonusPlan.${plan_id}.individual_weight_pct == 20.00"
            - "BonusPlan.${plan_id}.discretionary_budget_pct == 12.50"
            - "BonusPlan.${plan_id}.termination_treatment_policy == GOOD_LEAVER_PRORATION"
            - "BonusPlan.${plan_id}.payment_date == 2027-03-15"
            - "BonusPlan.${plan_id}.status == DRAFT"

      - name: bonus_plans_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints."GET /bonus-plans"
          - entities.BonusPlan.fields.plan_year
        distinguishing_aspect: |
          Three plans exist (two in 2026, one in 2027). limit=2&offset=0
          returns 2 rows with total_count 3 and has_more true; offset=2
          returns the last row with has_more false; plan_year=2027 filters to
          exactly one row with total_count 1. An implementation that reports
          total_count as the page length, or that ignores the filter when
          paginating, fails.
        test_recipe:
          setup:
            - "Three plans: two with plan_year 2026 and one with plan_year 2027, created in that order."
          setup_api_calls:
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Plan One", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
              captures: { plan1: "$.data.id" }
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Plan Two", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
              captures: { plan2: "$.data.id" }
            - call: "POST /bonus-plans"
              payload: { plan_year: 2027, plan_name: "FY27 Plan One", plan_period_start: "2027-01-01", plan_period_end: "2028-01-01", payment_date: "2028-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
              captures: { plan3: "$.data.id" }
          trigger:
            - call: "GET /bonus-plans"
              payload: { limit: 2, offset: 0 }
              as: PlanAdmin
            - call: "GET /bonus-plans"
              payload: { limit: 2, offset: 2 }
              as: PlanAdmin
            - call: "GET /bonus-plans"
              payload: { plan_year: 2027 }
              as: PlanAdmin
          assert:
            - "First page: HTTP 200, response_type == array, 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second page: 1 row (${plan3}), total_count == 3, has_more == false, offset == 2"
            - "Filtered read: 1 row (${plan3}), total_count == 1, has_more == false"

      - name: unknown_ids_return_each_resources_own_not_found_error
        claim_type: Not Found
        grounds:
          - validations.priority_30
          - validations.priority_31
          - validations.priority_32
          - validations.priority_33
          - validations.priority_34
          - validations.priority_35
          - validations.priority_36
          - validations.priority_37
          - validations.priority_38
          - validations.priority_39
          - validations.priority_25
          - validations.priority_26
        distinguishing_aspect: |
          Every path parameter has its OWN 404 error_id: a syntactically valid
          but unknown UUID on each of the twelve single-resource GETs must
          return the NOT_FOUND of that resource, never a generic 404 and never
          ERR_PLAN_NOT_FOUND for all of them.
        test_recipe:
          setup:
            - "One plan exists so the database is non-empty; the queried UUID 00000000-0000-0000-0000-0000000000ff belongs to no resource."
          setup_api_calls:
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Not Found Probe", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "GET /bonus-plans/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdmin
            - call: "GET /company-metrics/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdmin
            - call: "GET /business-units/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdmin
            - call: "GET /job-level-targets/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdmin
            - call: "GET /participants/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdmin
            - call: "GET /eligibility-events/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdmin
            - call: "GET /bu-pools/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdmin
            - call: "GET /participant-awards/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdmin
            - call: "GET /discretionary-adjustments/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdmin
            - call: "GET /accrual-periods/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdmin
            - call: "GET /payout-runs/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdmin
            - call: "GET /disputes/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdmin
          assert:
            - "All twelve reads return HTTP 404"
            - "error_id values in call order == [ERR_PLAN_NOT_FOUND, ERR_METRIC_NOT_FOUND, ERR_BUSINESS_UNIT_NOT_FOUND, ERR_JOB_LEVEL_TARGET_NOT_FOUND, ERR_PARTICIPANT_NOT_FOUND, ERR_EVENT_NOT_FOUND, ERR_POOL_NOT_FOUND, ERR_AWARD_NOT_FOUND, ERR_ADJUSTMENT_NOT_FOUND, ERR_ACCRUAL_PERIOD_NOT_FOUND, ERR_PAYOUT_RUN_NOT_FOUND, ERR_DISPUTE_NOT_FOUND]"
            - "Each error body carries response_type == error and a non-empty message"

      - name: bonus_plan_creation_missing_payment_date_rejected
        claim_type: Required Fields
        grounds:
          - validations.priority_40
          - errors.ERR_INVALID_REQUEST
          - endpoints."POST /bonus-plans"
        distinguishing_aspect: |
          payment_date has source input and no default, so omitting it is a
          400 ERR_INVALID_REQUEST — checked at priority 40, i.e. BEFORE the
          weight-sum rule at 50, which the same payload also violates
          (40 + 30 + 20 == 90). The malformed-body error must win.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /business-units"
              payload: { unit_code: "UNIT-A2", name: "Unit A2" }
              as: PlanAdmin
              captures: { unit_id: "$.data.id" }
          trigger:
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Missing Date", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", company_weight_pct: 40.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "error_id != ERR_PLAN_WEIGHTS_INVALID"
            - "No BonusPlan row was created (GET /bonus-plans returns total_count == 0)"

      - name: optional_inputs_take_their_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.BonusPlan.fields.discretionary_budget_pct
          - entities.BonusPlan.fields.termination_treatment_policy
          - entities.EligibilityEvent.fields.paid_leave
          - entities.Participant.fields.employment_status
        distinguishing_aspect: |
          Three different defaults are asserted in one chain: the plan's
          discretionary_budget_pct 10.00 and STRICT_PAYMENT_DATE policy, the
          participant's employment_status ACTIVE, and a LEAVE event recorded
          without paid_leave defaulting to false (which is what makes its days
          consume the 30-day credit cap). An implementation that defaults
          paid_leave to true silently over-credits leave.
        test_recipe:
          setup:
            - "One unit, one plan created without discretionary_budget_pct and without termination_treatment_policy, L3 target row, one participant L3 10,000,000 hired 2025-01-01."
          setup_api_calls:
            - call: "POST /business-units"
              payload: { unit_code: "UNIT-A3", name: "Unit A3" }
              as: PlanAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Defaults Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /job-level-targets"
              payload: { plan_id: "${plan_id}", job_level: "L3", target_bonus_pct: 10.00, guideline_min_ratio: 0.25, guideline_max_ratio: 2.00 }
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", business_unit_id: "${unit_id}", employee_code: "E501", full_name: "Dee Fault", job_level: "L3", base_salary_cents: 10000000, hire_date: "2025-01-01" }
              as: PlanAdmin
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /eligibility-events"
              payload: { participant_id: "${p_id}", event_type: "LEAVE", effective_date: "2026-02-01", leave_end_date: "2026-02-28", note: "leave filed without the paid flag" }
              as: HRBusinessPartner
              captures: { leave_id: "$.data.id" }
          assert:
            - "BonusPlan.${plan_id}.discretionary_budget_pct == 10.00"
            - "BonusPlan.${plan_id}.termination_treatment_policy == STRICT_PAYMENT_DATE"
            - "Participant.${p_id}.employment_status == ACTIVE"
            - "Participant.${p_id}.termination_date == null and Participant.${p_id}.termination_reason == null"
            - "EligibilityEvent.${leave_id}.paid_leave == false"
            - "EligibilityEvent.${leave_id}.superseded == false"
            - "EligibilityEvent.${leave_id}.leave_end_date == 2026-02-28"

      - name: metric_achievement_pct_is_computed_with_client_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.CompanyMetric.fields.achievement_pct
          - calculations.metric_achievement
          - endpoints."POST /company-metrics/{metricId}/actual"
        distinguishing_aspect: |
          achievement_pct has source computed: filing actual 950 against the
          band 900/1000/1200 must return exactly 75.00 (50 + 50/100*50), and a
          client-supplied achievement_pct of 999.99 in the same body must be
          ignored rather than stored. status must also flip to ACTUAL_ENTERED.
        test_recipe:
          setup:
            - "One unit, one plan, one REVENUE metric with band 900/1000/1200 still DRAFT."
          setup_api_calls:
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Computed Field Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /company-metrics"
              payload: { plan_id: "${plan_id}", metric_code: "REVENUE", weight_pct: 100.00, threshold_value: 900, target_value: 1000, max_value: 1200 }
              as: PlanAdmin
              captures: { m_id: "$.data.id" }
          trigger:
            - call: "POST /company-metrics/${m_id}/actual"
              payload: { actual_value: 950, source_note: "audited half-way result", achievement_pct: 999.99 }
              as: PlanAdmin
          assert:
            - "HTTP status == 200"
            - "CompanyMetric.${m_id}.achievement_pct == 75.00"
            - "CompanyMetric.${m_id}.actual_value == 950"
            - "CompanyMetric.${m_id}.status == ACTUAL_ENTERED"
            - "CompanyMetric.${m_id}.source_note == audited half-way result"

      - name: participant_system_fields_are_server_generated_with_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Participant.fields.employment_status
          - entities.Participant.fields.termination_date
          - endpoints."POST /participants"
        distinguishing_aspect: |
          id, created_at, updated_at, version and the system-sourced
          employment_status / termination_date / termination_reason are all
          server-owned: a create body that tries to set employment_status
          TERMINATED with a termination_date must still persist ACTIVE and
          null, and the returned id must not be the client-supplied one.
        test_recipe:
          setup:
            - "One unit, one plan, L3 target row."
          setup_api_calls:
            - call: "POST /business-units"
              payload: { unit_code: "UNIT-A4", name: "Unit A4" }
              as: PlanAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 System Fields Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /job-level-targets"
              payload: { plan_id: "${plan_id}", job_level: "L3", target_bonus_pct: 10.00, guideline_min_ratio: 0.25, guideline_max_ratio: 2.00 }
              as: PlanAdmin
          trigger:
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", business_unit_id: "${unit_id}", employee_code: "E502", full_name: "Sys Field", job_level: "L3", base_salary_cents: 10000000, hire_date: "2025-01-01", id: "00000000-0000-0000-0000-00000000dead", employment_status: "TERMINATED", termination_date: "2026-01-31", version: 99 }
              as: PlanAdmin
              captures: { p_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "Participant.${p_id}.id != 00000000-0000-0000-0000-00000000dead"
            - "Participant.${p_id}.employment_status == ACTIVE"
            - "Participant.${p_id}.termination_date == null"
            - "Participant.${p_id}.termination_reason == null"
            - "Participant.${p_id}.version == 1"
            - "Participant.${p_id}.created_at and Participant.${p_id}.updated_at are server-generated ISO 8601 timestamps"

      - name: job_level_target_guideline_band_type_constraint_rejected
        claim_type: Type Constraints
        grounds:
          - validations.priority_53
          - errors.ERR_GUIDELINE_BAND_INVALID
          - entities.JobLevelTarget.fields.guideline_max_ratio
        distinguishing_aspect: |
          guideline_min_ratio must be strictly less than guideline_max_ratio:
          the equal pair 1.00 / 1.00 is rejected 422 (not accepted as a
          degenerate band), and the reversed pair is rejected too, while the
          later legal row 0.25 / 2.00 is accepted for the same plan and level.
        test_recipe:
          setup:
            - "One plan in DRAFT with no job-level rows yet."
          setup_api_calls:
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Band Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "POST /job-level-targets"
              payload: { plan_id: "${plan_id}", job_level: "L3", target_bonus_pct: 10.00, guideline_min_ratio: 1.00, guideline_max_ratio: 1.00 }
              as: PlanAdmin
            - call: "POST /job-level-targets"
              payload: { plan_id: "${plan_id}", job_level: "L3", target_bonus_pct: 10.00, guideline_min_ratio: 2.00, guideline_max_ratio: 0.25 }
              as: PlanAdmin
            - call: "POST /job-level-targets"
              payload: { plan_id: "${plan_id}", job_level: "L3", target_bonus_pct: 10.00, guideline_min_ratio: 0.25, guideline_max_ratio: 2.00 }
              as: PlanAdmin
              captures: { target_id: "$.data.id" }
          assert:
            - "First attempt: HTTP 422, error_id == ERR_GUIDELINE_BAND_INVALID"
            - "Second attempt: HTTP 422, error_id == ERR_GUIDELINE_BAND_INVALID"
            - "Third attempt: HTTP 201, JobLevelTarget.${target_id}.guideline_min_ratio == 0.25 and JobLevelTarget.${target_id}.guideline_max_ratio == 2.00"
            - "GET /bonus-plans/${plan_id}/job-level-targets returns total_count == 1"

      - name: bonus_plan_invalid_enum_termination_policy_rejected
        claim_type: Type Constraints
        grounds:
          - validations.priority_40
          - errors.ERR_INVALID_REQUEST
          - entities.BonusPlan.fields.termination_treatment_policy
        distinguishing_aspect: |
          termination_treatment_policy is a closed enum of exactly two values;
          a third value must be rejected 400 at priority 40 rather than stored
          or silently coerced to the default STRICT_PAYMENT_DATE.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /business-units"
              payload: { unit_code: "UNIT-A5", name: "Unit A5" }
              as: PlanAdmin
              captures: { unit_id: "$.data.id" }
          trigger:
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Bad Enum", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00, termination_treatment_policy: "PAY_EVERYONE" }
              as: PlanAdmin
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /bonus-plans returns total_count == 0"

      - name: eligibility_event_is_append_only_and_superseded_instead_of_edited
        claim_type: Immutability
        grounds:
          - entities.EligibilityEvent
          - entities.EligibilityEvent.fields.supersedes_event_id
          - entities.EligibilityEvent.fields.superseded
          - endpoints."GET /eligibility-events"
        distinguishing_aspect: |
          EligibilityEvent declares common_fields false: there is no update
          endpoint and no version field, so a wrong TRANSFER is corrected by
          appending a second event that names it in supersedes_event_id. Both
          rows remain readable, the first flips superseded true, and the
          filtered list superseded=false returns only the correction.
        test_recipe:
          setup:
            - "One unit, one plan, L3 and L5 target rows, one participant L3 10,000,000 hired 2025-01-01, and a TRANSFER recorded with the wrong salary."
          setup_api_calls:
            - call: "POST /business-units"
              payload: { unit_code: "UNIT-A6", name: "Unit A6" }
              as: PlanAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Append Only Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /job-level-targets"
              payload: { plan_id: "${plan_id}", job_level: "L3", target_bonus_pct: 10.00, guideline_min_ratio: 0.25, guideline_max_ratio: 2.00 }
              as: PlanAdmin
            - call: "POST /job-level-targets"
              payload: { plan_id: "${plan_id}", job_level: "L5", target_bonus_pct: 20.00, guideline_min_ratio: 0.25, guideline_max_ratio: 2.00 }
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", business_unit_id: "${unit_id}", employee_code: "E503", full_name: "App Endonly", job_level: "L3", base_salary_cents: 10000000, hire_date: "2025-01-01" }
              as: PlanAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /eligibility-events"
              payload: { participant_id: "${p_id}", event_type: "TRANSFER", effective_date: "2026-07-01", new_job_level: "L5", new_base_salary_cents: 19000000, new_business_unit_id: "${unit_id}", note: "wrong salary keyed" }
              as: HRBusinessPartner
              captures: { ev1: "$.data.id" }
          trigger:
            - call: "POST /eligibility-events"
              payload: { participant_id: "${p_id}", event_type: "TRANSFER", effective_date: "2026-07-01", new_job_level: "L5", new_base_salary_cents: 20000000, new_business_unit_id: "${unit_id}", supersedes_event_id: "${ev1}", note: "correction of the keying error" }
              as: HRBusinessPartner
              captures: { ev2: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "EligibilityEvent.${ev1}.superseded == true"
            - "EligibilityEvent.${ev1}.new_base_salary_cents == 19000000 (the original row is not edited in place)"
            - "EligibilityEvent.${ev2}.superseded == false and EligibilityEvent.${ev2}.supersedes_event_id == ${ev1}"
            - "EligibilityEvent rows expose no version field"
            - "GET /eligibility-events?participant_id=${p_id} returns total_count == 2"
            - "GET /eligibility-events?participant_id=${p_id}&superseded=false returns total_count == 1 and the row is ${ev2}"

      - name: participant_with_unknown_parent_ids_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - validations.priority_45
          - errors.ERR_PLAN_NOT_FOUND
          - errors.ERR_BUSINESS_UNIT_NOT_FOUND
          - endpoints."POST /participants"
        distinguishing_aspect: |
          Body foreign keys are resolved at priority 45 and each returns the
          NOT_FOUND of the entity it points at: an unknown plan_id yields
          ERR_PLAN_NOT_FOUND and an unknown business_unit_id yields
          ERR_BUSINESS_UNIT_NOT_FOUND, both 404 — not a 422 validation error
          and not the same generic code.
        test_recipe:
          setup:
            - "One unit and one plan with an L3 target row exist; the UUID 00000000-0000-0000-0000-0000000000ff belongs to no resource."
          setup_api_calls:
            - call: "POST /business-units"
              payload: { unit_code: "UNIT-A7", name: "Unit A7" }
              as: PlanAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Parent FK Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /job-level-targets"
              payload: { plan_id: "${plan_id}", job_level: "L3", target_bonus_pct: 10.00, guideline_min_ratio: 0.25, guideline_max_ratio: 2.00 }
              as: PlanAdmin
          trigger:
            - call: "POST /participants"
              payload: { plan_id: "00000000-0000-0000-0000-0000000000ff", business_unit_id: "${unit_id}", employee_code: "E504", full_name: "No Plan", job_level: "L3", base_salary_cents: 10000000, hire_date: "2025-01-01" }
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", business_unit_id: "00000000-0000-0000-0000-0000000000ff", employee_code: "E505", full_name: "No Unit", job_level: "L3", base_salary_cents: 10000000, hire_date: "2025-01-01" }
              as: PlanAdmin
          assert:
            - "First attempt: HTTP 404, error_id == ERR_PLAN_NOT_FOUND"
            - "Second attempt: HTTP 404, error_id == ERR_BUSINESS_UNIT_NOT_FOUND"
            - "GET /participants?plan_id=${plan_id} returns total_count == 0"

      - name: second_pool_for_the_same_plan_and_unit_is_rejected_as_duplicate
        claim_type: Parent Relationships
        grounds:
          - validations.priority_54
          - errors.ERR_DUPLICATE_RESOURCE
          - entities.BusinessUnitPool.fields.business_unit_id
          - endpoints."POST /bu-pools"
        distinguishing_aspect: |
          Flat entity topology: (plan_id, business_unit_id) is unique, so the
          second pool for the same pair is a 409 ERR_DUPLICATE_RESOURCE, while
          the same unit may carry a pool in a DIFFERENT plan — proving the
          uniqueness is scoped to the plan and not global to the unit.
        test_recipe:
          setup:
            - "One unit and two plans; plan A already has a pool for that unit."
          setup_api_calls:
            - call: "POST /business-units"
              payload: { unit_code: "UNIT-A8", name: "Unit A8" }
              as: PlanAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Duplicate Pool Plan A", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
              captures: { planA: "$.data.id" }
            - call: "POST /bonus-plans"
              payload: { plan_year: 2027, plan_name: "FY27 Duplicate Pool Plan B", plan_period_start: "2027-01-01", plan_period_end: "2028-01-01", payment_date: "2028-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
              captures: { planB: "$.data.id" }
            - call: "POST /bu-pools"
              payload: { plan_id: "${planA}", business_unit_id: "${unit_id}" }
              as: PlanAdmin
              captures: { poolA: "$.data.id" }
          trigger:
            - call: "POST /bu-pools"
              payload: { plan_id: "${planA}", business_unit_id: "${unit_id}" }
              as: PlanAdmin
            - call: "POST /bu-pools"
              payload: { plan_id: "${planB}", business_unit_id: "${unit_id}" }
              as: PlanAdmin
              captures: { poolB: "$.data.id" }
          assert:
            - "First attempt: HTTP 409, error_id == ERR_DUPLICATE_RESOURCE"
            - "Second attempt: HTTP 201 and BusinessUnitPool.${poolB}.plan_id == ${planB}"
            - "GET /bu-pools?plan_id=${planA} returns total_count == 1 (only ${poolA})"
            - "BusinessUnitPool.${poolA}.calibration_status == DRAFT and BusinessUnitPool.${poolA}.distribution_status == NO_ELIGIBLE_PARTICIPANTS"

  - section: state_machines
    instances:

      - name: metric_moves_to_actual_entered_on_the_first_actual
        claim_type: Valid Transition
        grounds:
          - "state_machines.CompanyMetric: DRAFT -> ACTUAL_ENTERED"
          - endpoints."POST /company-metrics/{metricId}/actual"
        distinguishing_aspect: |
          The only CompanyMetric transition fires on the first actual and is
          observable in the same response: status DRAFT -> ACTUAL_ENTERED with
          achievement_pct written by calc metric_achievement (actual 1200 ==
          max_value scores exactly the 150.00 cap, not 149.99 and not an
          uncapped 150+).
        test_recipe:
          setup:
            - "One plan with a single REVENUE metric, band 900/1000/1200, status DRAFT."
          setup_api_calls:
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Metric Transition Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /company-metrics"
              payload: { plan_id: "${plan_id}", metric_code: "REVENUE", weight_pct: 100.00, threshold_value: 900, target_value: 1000, max_value: 1200 }
              as: PlanAdmin
              captures: { m_id: "$.data.id" }
          trigger:
            - call: "POST /company-metrics/${m_id}/actual"
              payload: { actual_value: 1200, source_note: "blow-out year" }
              as: PlanAdmin
          assert:
            - "HTTP status == 200"
            - "CompanyMetric.${m_id}.status == ACTUAL_ENTERED"
            - "CompanyMetric.${m_id}.achievement_pct == 150.00"
            - "GET /bonus-plans/${plan_id}/company-metrics?status=ACTUAL_ENTERED returns total_count == 1"
            - "GET /bonus-plans/${plan_id}/company-metrics?status=DRAFT returns total_count == 0"

      - name: second_metric_actual_rejected_as_already_filed
        claim_type: Idempotency
        grounds:
          - validations.priority_63
          - errors.ERR_METRIC_ACTUAL_ALREADY_FILED
          - "state_machines.CompanyMetric: DRAFT -> ACTUAL_ENTERED"
        distinguishing_aspect: |
          ACTUAL_ENTERED is the metric's terminal state: the same trigger a
          second time is a 409, and — critically — the stored actual_value
          stays 1000 / 100.00 instead of being overwritten by the rejected
          1100. A last-write-wins implementation silently re-bases the whole
          funding formula.
        test_recipe:
          setup:
            - "One plan with a REVENUE metric whose actual 1000 has already been filed (achievement 100.00)."
          setup_api_calls:
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Metric Idempotency Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /company-metrics"
              payload: { plan_id: "${plan_id}", metric_code: "REVENUE", weight_pct: 100.00, threshold_value: 900, target_value: 1000, max_value: 1200 }
              as: PlanAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /company-metrics/${m_id}/actual"
              payload: { actual_value: 1000, source_note: "audited" }
              as: PlanAdmin
          trigger:
            - call: "POST /company-metrics/${m_id}/actual"
              payload: { actual_value: 1100, source_note: "second attempt" }
              as: PlanAdmin
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_METRIC_ACTUAL_ALREADY_FILED"
            - "CompanyMetric.${m_id}.actual_value == 1000"
            - "CompanyMetric.${m_id}.achievement_pct == 100.00"
            - "CompanyMetric.${m_id}.source_note == audited"

      - name: submit_for_certification_from_draft_rejected
        claim_type: Invalid Transitions
        grounds:
          - validations.priority_60
          - errors.ERR_PLAN_STATE_INVALID
          - "state_machines.BonusPlan: TARGETS_SET -> PENDING_CERTIFICATION"
        distinguishing_aspect: |
          submit-for-certification is declared only from TARGETS_SET. From
          DRAFT the request is a 409 ERR_PLAN_STATE_INVALID decided at
          priority 60 — before the referential gates at 104..107 that the same
          plan also violates (no metrics, no scorecards, no awards). The plan
          must still be DRAFT afterwards.
        test_recipe:
          setup:
            - "One plan in DRAFT with no metrics, no pools and no participants."
          setup_api_calls:
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Invalid From Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "POST /bonus-plans/${plan_id}/submit-for-certification"
              payload: {}
              as: PlanAdmin
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_PLAN_STATE_INVALID"
            - "error_id != ERR_METRIC_WEIGHTS_INVALID and error_id != ERR_NO_ELIGIBLE_PARTICIPANTS"
            - "BonusPlan.${plan_id}.status == DRAFT"
            - "BonusPlan.${plan_id}.version == 1"

      - name: new_rows_start_in_their_declared_initial_states
        claim_type: Initial State
        grounds:
          - "state_machines.BonusPlan"
          - "state_machines.BusinessUnitPool"
          - "state_machines.AccrualPeriod"
          - entities.ParticipantAward.fields.allocation_status
          - entities.ParticipantAward.fields.payment_status
        distinguishing_aspect: |
          Five initial states are asserted from one chain: BonusPlan DRAFT,
          CompanyMetric DRAFT, BusinessUnitPool DRAFT, AccrualPeriod OPEN, and
          the award created by target-assignments starting in the parallel
          pair (allocation_status UNALLOCATED, payment_status PENDING) with a
          non-zero prorated target already computed.
        test_recipe:
          setup:
            - "One unit, one plan, L5 target 20.00%, one REVENUE metric (no actual yet), one pool, one participant L5 20,000,000 hired 2025-03-01, and one accrual period created but not posted."
          setup_api_calls:
            - call: "POST /business-units"
              payload: { unit_code: "UNIT-B1", name: "Unit B1" }
              as: PlanAdmin
              captures: { unit_id: "$.data.id" }
