- section: validations
  instances:
  - name: unauthenticated_request_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=1]
    - errors[ERR_UNAUTHENTICATED]
    distinguishing_aspect: Missing X-User-Role/X-User-ID headers produce 401 ERR_UNAUTHENTICATED before any other check.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: GET /awards/seasons
        as: null
        captures:
          err: $.data.error_id
      assert:
      - Response 401 ERR_UNAUTHENTICATED
  - name: forbidden_role_denied
    claim_type: violation_to_error
    grounds:
    - validations[priority=2]
    - errors[ERR_FORBIDDEN_ROLE]
    distinguishing_aspect: An Entrant attempting a ProgramAdmin-only operation (category publish) is rejected 403 ERR_FORBIDDEN_ROLE.
    test_recipe:
      setup:
      - Season with DRAFT category exists.
      setup_api_calls:
      - call: POST /awards/_clock/set_current_utc
        as: ProgramAdmin
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
      - call: POST /awards/seasons
        as: ProgramAdmin
        payload:
          code: GALA-RB1
          title: GALA-RB1
          submission_opens_at: '2026-08-10T00:00:00Z'
          early_fee_ends_at: '2026-08-20T00:00:00Z'
          submission_closes_at: '2026-09-01T00:00:00Z'
          eligibility_window_start: '2026-01-01T00:00:00Z'
          eligibility_window_end: '2026-08-01T00:00:00Z'
          ceremony_scheduled_at: '2026-10-01T19:00:00Z'
          refund_policy: FLAT_FEE
