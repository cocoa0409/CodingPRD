            - "worked_hours 24.00 succeeds: status == WORKED"

  - section: rbac
    instances:
      - name: production_manager_cannot_approve_plot
        claim_type: role_exclusive_operations
        grounds: [roles.StructuralEngineer, "validations[priority=2]", state_machines.LightingPlot.SUBMITTED_to_APPROVED]
        distinguishing_aspect: "Actor-per-transition enforcement on a shared endpoint: POST /api/plots/{id}/transition accepts both ProductionManager and StructuralEngineer at the endpoint level, but to=APPROVED is the engineer's transition — a ProductionManager attempt fails ERR_FORBIDDEN (403) even though the same role may submit."
        test_recipe:
          setup: ["IATSE venue; production PLANNING; plot PL1 SUBMITTED with one point"]
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id, pv0: $.data.version } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager, captures: { pv1: $.data.version } }
            - { call: "POST /api/productions/${p1}/plots", payload: { title: "Main Rig", expected_production_version: "${pv1}" }, as: ProductionManager, captures: { pl1: $.data.id, plv0: $.data.version } }
            - { call: "POST /api/plots/${pl1}/rigging-points", payload: { point_label: "A1", bay_index: 0, hang_type: DEAD_HANG, motor_count: 0, deadweight_kg: 100, expected_plot_version: "${plv0}" }, as: RiggingSupervisor, as_user_id: rig-1 }
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: SUBMITTED }, as: ProductionManager }
          trigger:
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: APPROVED }, as: ProductionManager, captures: { err: $.data.error_id } }
          assert:
            - "returns error_id ERR_FORBIDDEN (HTTP 403); plot stays SUBMITTED"

      - name: crew_chief_identity_binding
        claim_type: role_exclusive_operations
        grounds: [roles.CrewChief]
        excluded_because:
          difficulty_instance: crew_labor_per_line_rounding_order
          rationale: "CrewChief self-confirm and self-report (as_user_id == technician_id) exercised positively there; the negative identity case is covered by §1.9 instance crew_chief_cannot_confirm_others_assignment."

  - section: cross_cutting_complexity_layers
    instances:
      - name: version_increment_observable
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plot-create-stale-production]", "concurrency_rules[point-reserve-stale-plot]"]
        distinguishing_aspect: "Every mutation advances version by exactly 1, which is what makes the OCC checks observable: a production goes 1 (create) -> 2 (PLANNING) -> 3 (plot create), and the plot create response chain proves each hop."
        test_recipe:
          setup: ["IATSE venue; production P1 created"]
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id, pv0: $.data.version } }
          trigger:
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager, captures: { pv1: $.data.version } }
            - { call: "POST /api/productions/${p1}/plots", payload: { title: "Main Rig", expected_production_version: "${pv1}" }, as: ProductionManager, captures: { pl1: $.data.id } }
            - { call: "GET /api/productions/${p1}", as: ProductionManager, captures: { pv2: $.data.version } }
          assert:
            - "version sequence is exactly 1 -> 2 -> 3 across create, transition, and child-create side effect"

      - name: cascade_layer_coverage
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: production_cancel_cascade_chain
          rationale: "N-level cascade verified end-to-end by the named §1.8 instance (production -> call -> assignment plus parallel branches)."

      - name: dual_variant_layer_coverage
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: labor_union_vs_non_union_ruleset
          rationale: "Both variants executed and their delta asserted by the named §1.8 instance (and its two siblings)."

      - name: threshold_layer_coverage
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: overtime_threshold_eight_hours_exact
          rationale: "Cumulative/daily threshold behavior at the exact breakpoint asserted by the named §1.8 instance; the rental day-3/day-4 threshold is covered by §1.9 instance rental_tier_boundary_day3_day4."

      - name: derived_field_reconciliation_coverage
        claim_type: derived_field_reconciliation
        grounds: [entities.LightingPlot.fields.total_factored_load_kg, entities.Production.fields.posture]
        excluded_because:
          difficulty_instance: plot_load_conservation
          rationale: "Derived-field recompute on create/release asserted (400.00 -> 500.00 -> 400.00); posture recompute asserted in §1.8 production_ready_gate_reads_children."

  - section: consistency_model
    instances:
      - name: transition_response_immediate_visibility
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the transition response body itself carries the post-transition state (PLANNING) and a subsequent GET returns the identical status and version — no read-your-writes lag."
        test_recipe:
          setup: ["IATSE venue; production P1 DRAFT"]
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager, captures: { t_status: $.data.status, t_ver: $.data.version } }
            - { call: "GET /api/productions/${p1}", as: ProductionManager, captures: { g_status: $.data.status, g_ver: $.data.version } }
          assert:
            - "transition response shows status PLANNING and version 2 immediately"
            - "subsequent GET agrees: status PLANNING, version 2"
