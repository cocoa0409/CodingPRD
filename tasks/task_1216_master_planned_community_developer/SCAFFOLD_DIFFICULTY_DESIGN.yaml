              payload: {}
              as: DeclarantController
            - call: "POST /mpc/agreements"
              payload: { community_id: "${c_id}", builder_id: "${b_id}", phase_id: "${p1_id}", base_price_per_lot_cents: 5000000, annual_escalation_pct: 6.0, penalty_per_lot_per_day_cents: 1000, earnest_money_cents: 5000000, total_lots_committed: 1 }
