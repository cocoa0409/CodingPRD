# =============================================================================
# SCAFFOLD — task_3115_out_network_claim_repricing_negotiated_discount_network
# Out-of-Network Claim Repricing & Negotiated Discount Network (MultiPlan-style)
# Difficulty: beyond expert (user instruction overrides §0.4 cap).
# =============================================================================

scenario: |
  Generate task much harder than expert level!

  Scenario description:
  Out-of-Network Claim Repricing & Negotiated Discount Network (MultiPlan): payer
  client configuration selecting repricing methodologies by claim type and network
  status, contracted provider network access producing a contractual discount
  without balance billing, negotiation of individual out-of-network claims with
  provider sign-off and settlement agreements, reference-based pricing computation
  against a benchmark with defensibility documentation, no-surprises dispute
  processes including open negotiation periods and independent resolution
  submissions, fee structure based on a percentage of savings with client
  transparency obligations, provider appeal and re-review of repriced claims, data
  feeds and turnaround service levels with payer claim systems.

domain_name: oon-claim-repricing
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: peer_roles
  consistency_model: immediate
  difficulty_target: beyond_expert

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities, flat topology with FK references)
# =============================================================================
entities:
  - name: PayerClient
    parent: null
    common_fields: true
    fields:
      - { name: payer_name, type: string, source: input, description: "Payer organization name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }
      - { name: fee_percent, type: number, source: input, description: "Default percent-of-savings fee rate (e.g., 0.25); used when no tier table is configured" }
      - { name: fee_cap_cents_per_claim, type: integer, source: input, description: "Maximum fee charged per claim, cents" }
      - { name: minimum_invoice_cents, type: integer, source: input, default: 0, description: "Fee invoices with gross fees strictly below this floor are still issued; floor gates nothing when 0" }
      - { name: transparency_reporting_enabled, type: boolean, source: input, default: false, description: "Whether the client may publish savings-transparency reports" }

  - name: RepricingPolicy
    parent: null
    common_fields: true
    fields:
      - { name: payer_client_id, type: string, source: input, description: "FK -> PayerClient.id; owning payer" }
      - { name: claim_type, type: enum, source: input, description: "PROFESSIONAL | FACILITY | ANCILLARY | EMERGENCY" }
      - { name: network_status, type: enum, source: input, description: "IN_NETWORK | OUT_OF_NETWORK | EMERGENCY_OON" }
      - { name: methodology, type: enum, source: input, description: "CONTRACTED_NETWORK | REFERENCE_BASED | PERCENT_OF_MEDICARE | UCR | NEGOTIATION_REQUIRED" }
      - { name: percent_of_medicare, type: number, source: input, description: "Multiplier over the Medicare schedule when methodology PERCENT_OF_MEDICARE (e.g., 1.50)", default: null }
      - { name: rbp_markup_percent, type: number, source: input, description: "Markup over the benchmark gap for REFERENCE_BASED (e.g., 1.20)", default: null }
      - { name: ucr_percentile, type: integer, source: input, description: "Percentile key into UsualCustomaryRate (50 or 80) when methodology UCR", default: null }
      - { name: priority, type: integer, source: input, description: "Selector rank: lower integer wins; ties broken by RepricingPolicy.created_at ascending" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE }
      - { name: rounding_order, type: enum, source: system, description: "PER_LINE_THEN_SUM | AGGREGATE_THEN_ROUND; fixed PER_LINE_THEN_SUM for this system", default: PER_LINE_THEN_SUM }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: npi, type: string, source: input, description: "National Provider Identifier; unique across the platform" }
      - { name: legal_name, type: string, source: input, description: "Provider legal name" }
      - { name: tin, type: string, source: input, description: "Tax identification number" }

  - name: NetworkAgreement
    parent: null
    common_fields: true
    fields:
      - { name: network_name, type: string, source: input, description: "Contracted network label" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; contracted provider" }
      - { name: discount_percent, type: number, source: input, description: "Contractual discount off billed charges (e.g., 0.40 = 40% off)" }
      - { name: effective_start, type: datetime, source: input, description: "Agreement effective interval start (inclusive)" }
      - { name: effective_end, type: datetime, source: input, description: "Agreement effective interval end (inclusive); must be strictly after effective_start" }
      - { name: balance_billing_prohibited, type: boolean, source: system, description: "Always true for contracted agreements; patient responsibility capped at in-network cost share", default: true }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED", default: ACTIVE }

  - name: MedicareFeeScheduleEntry
    parent: null
    common_fields: false
    fields:
      - { name: procedure_code, type: string, source: input, description: "CPT/HCPCS code" }
      - { name: region_code, type: string, source: input, description: "Pricing locality code" }
      - { name: base_rate_cents, type: integer, source: input, description: "Medicare base rate per unit, cents" }
      - { name: geographic_adjustment_factor, type: number, source: input, description: "GPCI-style multiplier applied to base_rate_cents" }
      - { name: effective_year, type: integer, source: input, description: "Schedule year" }

  - name: UsualCustomaryRate
    parent: null
    common_fields: false
    fields:
      - { name: procedure_code, type: string, source: input, description: "CPT/HCPCS code" }
      - { name: region_code, type: string, source: input, description: "Geographic region code" }
      - { name: percentile_50_cents, type: integer, source: input, description: "50th-percentile UCR charge" }
      - { name: percentile_80_cents, type: integer, source: input, description: "80th-percentile UCR charge (defensibility benchmark)" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: payer_client_id, type: string, source: input, description: "FK -> PayerClient.id; claim owner" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; rendering provider" }
      - { name: external_claim_ref, type: string, source: input, description: "Payer-system claim reference; unique per payer_client_id across all claims" }
      - { name: claim_type, type: enum, source: input, description: "PROFESSIONAL | FACILITY | ANCILLARY | EMERGENCY" }
      - { name: network_status, type: enum, source: input, description: "IN_NETWORK | OUT_OF_NETWORK | EMERGENCY_OON" }
      - { name: service_date, type: datetime, source: input, description: "Date of service; selects NetworkAgreement by effective interval" }
      - { name: billed_amount_cents, type: integer, source: computed, description: "Sum of line unit_charge_cents * quantity_units; recomputed whenever a non-VOID line is added" }
      - { name: patient_responsibility_cents, type: integer, source: input, description: "Member cost-share portion of the allowed amount" }
      - { name: nsa_flag, type: boolean, source: input, default: false, description: "True when the claim falls under no-surprises (NSA) protection" }
      - { name: methodology_used, type: enum, source: system, description: "Methodology selected at pricing time; null until PRICED", default: null }
      - { name: allowed_amount_cents, type: integer, source: computed, description: "Priced allowed amount; null until PRICED", default: null }
      - { name: payer_liability_cents, type: integer, source: computed, description: "allowed_amount_cents - patient_responsibility_cents; null until PRICED", default: null }
      - { name: savings_cents, type: integer, source: computed, description: "billed_amount_cents - allowed_amount_cents + patient_responsibility_cents; null until PRICED", default: null }
      - { name: rbp_amount_cents, type: integer, source: computed, description: "Reference-based price output when methodology_used == REFERENCE_BASED; null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "RECEIVED | PENDING_LINES | PRICED | SETTLED | FINALIZED", default: RECEIVED }

  - name: ClaimLine
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; owning claim" }
      - { name: procedure_code, type: string, source: input, description: "CPT/HCPCS code priced" }
      - { name: quantity_units, type: integer, source: input, description: "Units billed; must be >= 1" }
      - { name: unit_charge_cents, type: integer, source: input, description: "Charge per unit; must be > 0" }
      - { name: region_code, type: string, source: input, description: "Pricing region for this line" }
      - { name: allowed_amount_cents, type: integer, source: computed, description: "Per-line allowed after rounding; null until parent claim PRICED", default: null }
      - { name: status, type: enum, source: system, description: "PENDING | PRICED | VOID", default: PENDING }

  - name: RepricingDetermination
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; subject claim" }
      - { name: methodology, type: enum, source: system, description: "Methodology applied: CONTRACTED_NETWORK | REFERENCE_BASED | PERCENT_OF_MEDICARE | UCR | NEGOTIATED" }
      - { name: policy_id, type: string, source: system, description: "FK -> RepricingPolicy.id; policy that drove selection; null for NEGOTIATED determinations" }
      - { name: agreement_id, type: string, source: system, description: "FK -> NetworkAgreement.id; agreement applied for CONTRACTED_NETWORK; null otherwise" }
      - { name: supersedes_determination_id, type: string, source: system, description: "FK -> RepricingDetermination.id; prior determination this one replaces (self-referential); null on the first determination" }
      - { name: input_snapshot, type: object, source: system, description: "Frozen JSON of every rate input used (fee schedule row ids, UCR row ids, agreement discount, policy parameters) for defensibility" }
      - { name: computation_trace, type: array, source: system, description: "Ordered list of computation steps with intermediate values; written once at determination creation" }
      - { name: defensibility_notes, type: string, source: input, description: "Human justification; required when methodology == REFERENCE_BASED" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED", default: ACTIVE }

  - name: NegotiationCase
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; claim under negotiation" }
      - { name: opened_by_role, type: enum, source: system, description: "PayerRep | ProviderRep; which side opened the case" }
      - { name: round_count, type: integer, source: system, description: "Number of provider counteroffers made; increments on each counter", default: 0 }
      - { name: current_offer_cents, type: integer, source: computed, description: "The offer currently on the table (payer offer after open, provider amount after counter)" }
      - { name: status, type: enum, source: system, description: "OPEN | OFFER_PENDING | COUNTERED | ACCEPTED | SETTLED | WITHDRAWN | EXPIRED", default: OPEN }

  - name: SettlementAgreement
    parent: null
    common_fields: true
    fields:
      - { name: negotiation_case_id, type: string, source: input, description: "FK -> NegotiationCase.id; case being settled" }
      - { name: claim_id, type: string, source: computed, description: "FK -> Claim.id; copied from the negotiation case at creation" }
      - { name: settled_amount_cents, type: integer, source: input, description: "Agreed allowed amount" }
      - { name: payer_signed_at, type: datetime, source: system, description: "Set when PayerRep signs; null until then", default: null }
      - { name: provider_signed_at, type: datetime, source: system, description: "Set when ProviderRep signs; null until then", default: null }
      - { name: balance_billing_prohibited, type: boolean, source: system, description: "Always true once EXECUTED; patient responsibility unchanged from claim", default: true }
      - { name: status, type: enum, source: system, description: "PENDING_SIGNATURES | EXECUTED | VOIDED", default: PENDING_SIGNATURES }

  - name: OpenNegotiation
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; NSA claim under federal open negotiation" }
      - { name: initiated_by, type: enum, source: input, description: "PAYER | PROVIDER" }
      - { name: initiated_at, type: datetime, source: system, description: "Logical-clock timestamp at initiation" }
      - { name: expires_at, type: datetime, source: computed, description: "initiated_at plus 30 business days (Mon-Fri only, counting starts the day after initiation); IDR submission forbidden strictly before this instant" }
      - { name: status, type: enum, source: system, description: "ACTIVE | AGREED | EXPIRED | SUPERSEDED_BY_IDR", default: ACTIVE }

  - name: IdrSubmission
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; disputed NSA claim" }
      - { name: open_negotiation_id, type: string, source: input, description: "FK -> OpenNegotiation.id; the completed/expired negotiation this follows" }
      - { name: payer_offer_cents, type: integer, source: input, description: "Payer final offer submitted to the IDR entity" }
      - { name: provider_offer_cents, type: integer, source: input, description: "Provider final offer submitted to the IDR entity" }
      - { name: qpa_cents, type: integer, source: computed, description: "Qualifying payment amount: median of ACTIVE NetworkAgreement contracted rates (post-discount allowed per unit for the claim's primary procedure code and region); computed at submission" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp at submission" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | DECIDED_PAYER | DECIDED_PROVIDER | DISMISSED", default: SUBMITTED }

  - name: ProviderAppeal
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; repriced claim being appealed" }
      - { name: determination_id, type: string, source: input, description: "FK -> RepricingDetermination.id; determination under appeal" }
      - { name: appeal_reason, type: string, source: input, description: "Free-text reason" }
      - { name: appeal_window_deadline, type: datetime, source: computed, description: "determination creation timestamp plus 45 calendar days; appeals submitted after this instant are rejected" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | RE_REVIEWED_UPHELD | RE_REVIEWED_ADJUSTED | DENIED", default: SUBMITTED }

  - name: ClaimFeedBatch
    parent: null
    common_fields: true
    fields:
      - { name: payer_client_id, type: string, source: input, description: "FK -> PayerClient.id; feed owner" }
      - { name: feed_type, type: enum, source: input, description: "CLAIM_INTAKE | REMITTANCE | ELIGIBILITY" }
      - { name: record_count, type: integer, source: input, description: "Number of records in the batch" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp when the batch was received" }
      - { name: sla_due_at, type: datetime, source: computed, description: "received_at plus turnaround_business_hours business hours on a 09:00-17:00 Mon-Fri business-hours calendar" }
      - { name: processed_at, type: datetime, source: system, description: "Logical-clock timestamp when processing completed; null until PROCESSED", default: null }
      - { name: sla_met, type: boolean, source: computed, description: "processed_at <= sla_due_at; null until PROCESSED", default: null }
      - { name: status, type: enum, source: system, description: "RECEIVED | PROCESSED | FAILED", default: RECEIVED }

  - name: FeeInvoice
    parent: null
    common_fields: true
    fields:
      - { name: payer_client_id, type: string, source: input, description: "FK -> PayerClient.id; billed payer" }
      - { name: claim_ids, type: array, source: input, description: "Claim ids whose FINALIZED savings are invoiced; each claim may appear on at most one non-voided FeeInvoice" }
      - { name: gross_fee_cents, type: integer, source: computed, description: "Sum of per-claim fees after tier and per-claim cap" }
      - { name: aggregate_fee_cents, type: integer, source: computed, description: "Sum of gross_fee_cents across all non-voided FeeInvoices of the payer; maintained on every issue/void" }
      - { name: transparency_report_id, type: string, source: system, description: "FK -> TransparencyReport.id published from this invoice; null until published", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | VOIDED", default: DRAFT }

  - name: TransparencyReport
    parent: null
    common_fields: true
    fields:
      - { name: fee_invoice_id, type: string, source: input, description: "FK -> FeeInvoice.id; source invoice" }
      - { name: total_billed_cents, type: integer, source: computed, description: "Sum of billed_amount_cents over the invoice's claims" }
      - { name: total_allowed_cents, type: integer, source: computed, description: "Sum of allowed_amount_cents over the invoice's claims" }
      - { name: total_savings_cents, type: integer, source: computed, description: "Sum of savings_cents over the invoice's claims" }
      - { name: total_fee_cents, type: integer, source: computed, description: "FeeInvoice.gross_fee_cents at publish time" }
      - { name: status, type: enum, source: system, description: "PUBLISHED", default: PUBLISHED }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Claim
    initial_state: RECEIVED
    terminal_states: [FINALIZED]
    transitions:
      - from: RECEIVED
        to: PENDING_LINES
        trigger: "POST /claims/{id}/lines (first line added)"
        actor: PayerRep
        preconditions: ["Claim.payer_client_id matches caller", "claim line fields valid (ERR_INVALID_REQUEST)"]
        side_effects:
          - "ClaimLine created with status PENDING"
          - "Claim.billed_amount_cents recomputed as sum over non-VOID lines of unit_charge_cents * quantity_units"
          - "Claim.version increments by 1"
      - from: PENDING_LINES
        to: PENDING_LINES
        trigger: "POST /claims/{id}/lines (subsequent lines)"
        actor: PayerRep
        preconditions: ["claim not terminal"]
        side_effects:
          - "ClaimLine created with status PENDING"
          - "Claim.billed_amount_cents recomputed"
          - "Claim.version increments by 1"
      - from: PENDING_LINES
        to: PRICED
        trigger: "POST /claims/{id}/reprice"
        actor: PayerRep
        preconditions:
          - "At least one non-VOID ClaimLine exists (ERR_CLAIM_HAS_NO_LINES)"
          - "PayerClient.status == ACTIVE (ERR_PAYER_SUSPENDED)"
          - "If claim.network_status == IN_NETWORK: an ACTIVE NetworkAgreement must exist covering (provider_id, service_date) (ERR_NO_CONTRACTED_AGREEMENT)"
          - "If claim.nsa_flag is true and the selected policy methodology is NEGOTIATION_REQUIRED: rejected (ERR_NSA_METHODOLOGY_CONFLICT); NSA claims route through open negotiation instead"
          - "Exactly one ACTIVE RepricingPolicy is selected: candidates filter payer_client_id + claim_type + network_status; rank by priority ascending, tie-break RepricingPolicy.created_at ascending; empty candidate set -> ERR_NO_REPRICING_POLICY (except IN_NETWORK which prices off NetworkAgreement directly)"
          - "Policy methodology != NEGOTIATION_REQUIRED (ERR_NEGOTIATION_REQUIRED)"
        side_effects:
          - "RepricingDetermination created (status ACTIVE) with input_snapshot and computation_trace"
          - "Each non-VOID ClaimLine allowed_amount_cents computed per repricing_allowability (PER_LINE_THEN_SUM), ClaimLine.status -> PRICED"
          - "Claim.allowed_amount_cents = sum of line allowed amounts; payer_liability_cents = allowed - patient_responsibility_cents; savings_cents = billed - allowed + patient_responsibility_cents"
          - "Claim.methodology_used set"
          - "If methodology CONTRACTED_NETWORK: NetworkAgreement.touch -> increments NetworkAgreement.version by 1 (ledger sync hop 2)"
          - "Claim.version increments by 1"
      - from: PRICED
        to: PRICED
        trigger: "POST /claims/{id}/appeals (appeal RE_REVIEWED_ADJUSTED re-prices in place; claim remains PRICED)"
        actor: system
        preconditions: ["ProviderAppeal resolved RE_REVIEWED_ADJUSTED"]
        side_effects:
          - "New RepricingDetermination created with supersedes_determination_id = prior ACTIVE determination; prior determination status -> SUPERSEDED"
          - "Claim.allowed_amount_cents / payer_liability_cents / savings_cents recomputed from the adjusted determination"
          - "Claim.version increments by 1"
      - from: PRICED
        to: SETTLED
        trigger: "system (SettlementAgreement reaches EXECUTED)"
        actor: system
        preconditions: ["SettlementAgreement.payer_signed_at and provider_signed_at both non-null"]
        side_effects:
          - "Claim.allowed_amount_cents replaced by SettlementAgreement.settled_amount_cents; payer_liability and savings recomputed"
          - "RepricingDetermination created with methodology NEGOTIATED, policy_id null, supersedes_determination_id = prior ACTIVE determination; prior SUPERSEDED"
          - "Claim.version increments by 1"
      - from: SETTLED
        to: FINALIZED
        trigger: "POST /claims/{id}/finalize"
        actor: PayerRep
        preconditions: ["no ProviderAppeal in SUBMITTED or UNDER_REVIEW for this claim (ERR_APPEAL_IN_PROGRESS)"]
        side_effects:
          - "Claim becomes invoiceable for FeeInvoice generation"
          - "Claim.version increments by 1"
      - from: PRICED
        to: FINALIZED
        trigger: "POST /claims/{id}/finalize"
        actor: PayerRep
        preconditions: ["no ProviderAppeal in SUBMITTED or UNDER_REVIEW for this claim (ERR_APPEAL_IN_PROGRESS)"]
        side_effects: ["Claim.version increments by 1"]
    note: "A failed reprice (ERR_NEGOTIATION_REQUIRED / ERR_NO_REPRICING_POLICY / ERR_RATE_INPUT_MISSING) is a pure rejection: the claim remains PENDING_LINES with no persisted failure state."

  - entity: NegotiationCase
    initial_state: OPEN
    terminal_states: [SETTLED, WITHDRAWN, EXPIRED]
    transitions:
      - from: OPEN
        to: OFFER_PENDING
        trigger: "POST /negotiation-cases/{id}/offer (initial payer offer)"
        actor: PayerRep
        preconditions: ["case OPEN", "offer_cents > 0", "offer_cents <= claim.billed_amount_cents (ERR_OFFER_OUT_OF_RANGE)"]
        side_effects: ["current_offer_cents = offer_cents", "NegotiationCase.version increments by 1"]
      - from: OFFER_PENDING
        to: COUNTERED
        trigger: "POST /negotiation-cases/{id}/counter"
        actor: ProviderRep
        preconditions: ["counter_cents >= current_offer_cents (ERR_COUNTER_BELOW_OFFER)", "counter_cents <= claim.billed_amount_cents"]
        side_effects:
          - "current_offer_cents = counter_cents"
          - "round_count increments by 1"
          - "If round_count reaches 5, case auto-transitions COUNTERED -> EXPIRED (negotiation round cap)"
          - "NegotiationCase.version increments by 1"
      - from: COUNTERED
        to: OFFER_PENDING
        trigger: "POST /negotiation-cases/{id}/offer (payer improves offer; cycle)"
        actor: PayerRep
        preconditions: ["offer_cents <= claim.billed_amount_cents"]
        side_effects: ["current_offer_cents = offer_cents", "NegotiationCase.version increments by 1"]
      - from: OFFER_PENDING
        to: ACCEPTED
        trigger: "POST /negotiation-cases/{id}/accept (provider accepts payer offer)"
        actor: ProviderRep
        preconditions: []
        side_effects:
          - "SettlementAgreement created (status PENDING_SIGNATURES) with settled_amount_cents = current_offer_cents"
          - "NegotiationCase.version increments by 1"
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /negotiation-cases/{id}/accept (payer accepts provider counter)"
        actor: PayerRep
        preconditions: []
        side_effects:
          - "SettlementAgreement created (status PENDING_SIGNATURES) with settled_amount_cents = current_offer_cents"
          - "NegotiationCase.version increments by 1"
      - from: ACCEPTED
        to: SETTLED
        trigger: "system (SettlementAgreement reaches EXECUTED)"
        actor: system
        preconditions: ["both signatures present"]
        side_effects: ["NegotiationCase.version increments by 1"]
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /negotiation-cases/{id}/withdraw"
        actor: PayerRep | ProviderRep
        preconditions: []
        side_effects: ["NegotiationCase.version increments by 1"]
      - from: OFFER_PENDING
        to: WITHDRAWN
        trigger: "POST /negotiation-cases/{id}/withdraw"
        actor: PayerRep | ProviderRep
        preconditions: []
        side_effects: ["NegotiationCase.version increments by 1"]
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /negotiation-cases/{id}/withdraw"
        actor: PayerRep | ProviderRep
        preconditions: []
        side_effects: ["NegotiationCase.version increments by 1"]
      - from: COUNTERED
        to: EXPIRED
        trigger: "system (round_count reaches 5)"
        actor: system
        preconditions: []
        side_effects: ["NegotiationCase.version increments by 1"]
    note: "OPEN -> OFFER_PENDING -> COUNTERED -> OFFER_PENDING is the negotiation cycle (non-linear)."

  - entity: SettlementAgreement
    initial_state: PENDING_SIGNATURES
    terminal_states: [EXECUTED, VOIDED]
    transitions:
      - from: PENDING_SIGNATURES
        to: PENDING_SIGNATURES
        trigger: "POST /settlement-agreements/{id}/sign (first signer)"
        actor: PayerRep | ProviderRep
        preconditions: ["signer has not already signed (ERR_ALREADY_SIGNED)"]
        side_effects: ["payer_signed_at or provider_signed_at set", "SettlementAgreement.version increments by 1"]
      - from: PENDING_SIGNATURES
        to: EXECUTED
        trigger: "POST /settlement-agreements/{id}/sign (second signer completes)"
        actor: PayerRep | ProviderRep
        preconditions: ["the other party has already signed", "claim not FINALIZED"]
        side_effects:
          - "balance_billing_prohibited = true"
          - "Claim transition PRICED -> SETTLED fires with settled_amount_cents (cascade hop 1)"
          - "NegotiationCase transition ACCEPTED -> SETTLED fires (cascade hop 2 from claim side-effect resolution)"
          - "SettlementAgreement.version increments by 1"
      - from: PENDING_SIGNATURES
        to: VOIDED
        trigger: "POST /settlement-agreements/{id}/void"
        actor: PayerRep
        preconditions: ["no signature recorded yet (ERR_ALREADY_SIGNED)"]
        side_effects: ["NegotiationCase reverts ACCEPTED -> COUNTERED (compensating action, current_offer_cents unchanged)", "SettlementAgreement.version increments by 1"]
    note: "Void-before-signature is the compensating action that returns the negotiation to COUNTERED."

  - entity: OpenNegotiation
    initial_state: ACTIVE
    terminal_states: [AGREED, EXPIRED, SUPERSEDED_BY_IDR]
    transitions:
      - from: ACTIVE
        to: AGREED
        trigger: "POST /open-negotiations/{id}/agree"
        actor: PayerRep | ProviderRep
        preconditions: ["agreed_amount_cents > 0", "agreed_amount_cents <= claim.billed_amount_cents"]
        side_effects:
          - "Claim allowed_amount_cents replaced by agreed_amount_cents; payer_liability and savings recomputed; new RepricingDetermination (methodology NEGOTIATED) supersedes prior"
          - "Claim transition PRICED -> SETTLED fires"
          - "OpenNegotiation.version increments by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (logical clock passes expires_at without agreement)"
        actor: system
        preconditions: ["current logical time >= expires_at"]
        side_effects: ["OpenNegotiation.version increments by 1"]
      - from: EXPIRED
        to: SUPERSEDED_BY_IDR
        trigger: "POST /idr-submissions (submission references this negotiation)"
        actor: PayerRep | ProviderRep
        preconditions: ["negotiation EXPIRED", "current logical time >= expires_at (IDR window open)"]
        side_effects: ["OpenNegotiation.version increments by 1"]

  - entity: IdrSubmission
    initial_state: SUBMITTED
    terminal_states: [DECIDED_PAYER, DECIDED_PROVIDER, DISMISSED]
    transitions:
      - from: SUBMITTED
        to: DECIDED_PAYER
        trigger: "POST /idr-submissions/{id}/decide with winner PAYER"
        actor: IdrEntity
        preconditions: ["winning_amount_cents == payer_offer_cents (ERR_IDR_AMOUNT_MISMATCH)"]
        side_effects:
          - "Claim allowed_amount_cents replaced by payer_offer_cents; payer_liability and savings recomputed; new RepricingDetermination (methodology NEGOTIATED) supersedes prior"
          - "Claim -> SETTLED"
          - "IdrSubmission.version increments by 1"
      - from: SUBMITTED
        to: DECIDED_PROVIDER
        trigger: "POST /idr-submissions/{id}/decide with winner PROVIDER"
        actor: IdrEntity
        preconditions: ["winning_amount_cents == provider_offer_cents (ERR_IDR_AMOUNT_MISMATCH)"]
        side_effects:
          - "Claim allowed_amount_cents replaced by provider_offer_cents; derived amounts recomputed; new RepricingDetermination supersedes prior"
          - "Claim -> SETTLED"
          - "IdrSubmission.version increments by 1"
      - from: SUBMITTED
        to: DISMISSED
        trigger: "POST /idr-submissions/{id}/dismiss"
        actor: IdrEntity
        preconditions: []
        side_effects: ["IdrSubmission.version increments by 1"]

  - entity: ProviderAppeal
    initial_state: SUBMITTED
    terminal_states: [RE_REVIEWED_UPHELD, RE_REVIEWED_ADJUSTED, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{id}/start-review"
        actor: PayerRep
        preconditions: []
        side_effects: ["ProviderAppeal.version increments by 1"]
      - from: UNDER_REVIEW
        to: RE_REVIEWED_UPHELD
        trigger: "POST /appeals/{id}/resolve with outcome UPHELD"
        actor: PayerRep
        preconditions: []
        side_effects: ["ProviderAppeal.version increments by 1"]
      - from: UNDER_REVIEW
        to: RE_REVIEWED_ADJUSTED
        trigger: "POST /appeals/{id}/resolve with outcome ADJUSTED"
        actor: PayerRep
        preconditions: ["adjusted_amount_cents > 0", "adjusted_amount_cents <= claim.billed_amount_cents"]
        side_effects:
          - "New RepricingDetermination (methodology copied from appealed determination) created; supersedes prior ACTIVE determination (hop 1)"
          - "Prior determination status -> SUPERSEDED (hop 2)"
          - "Claim allowed/liability/savings recomputed; Claim.version increments (hop 3)"
          - "ProviderAppeal.version increments by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /appeals/{id}/resolve with outcome DENIED"
        actor: PayerRep
        preconditions: []
        side_effects: ["ProviderAppeal.version increments by 1"]

  - entity: ClaimFeedBatch
    initial_state: RECEIVED
    terminal_states: [PROCESSED, FAILED]
    transitions:
      - from: RECEIVED
        to: PROCESSED
        trigger: "POST /feed-batches/{id}/process"
        actor: FeedOperator
        preconditions: []
        side_effects:
          - "processed_at = current logical time"
          - "sla_met = (processed_at <= sla_due_at)"
          - "ClaimFeedBatch.version increments by 1"
      - from: RECEIVED
        to: FAILED
        trigger: "POST /feed-batches/{id}/fail"
        actor: FeedOperator
        preconditions: []
        side_effects: ["ClaimFeedBatch.version increments by 1"]

  - entity: FeeInvoice
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /fee-invoices/{id}/issue"
        actor: OpsAdmin
        preconditions: ["every claim in claim_ids is FINALIZED (ERR_CLAIM_NOT_FINALIZED)", "no claim already appears on a non-voided FeeInvoice (ERR_CLAIM_ALREADY_INVOICED)"]
        side_effects:
          - "gross_fee_cents computed per fee_invoice calculation (tiered percent-of-savings with per-claim cap)"
          - "aggregate_fee_cents recomputed across payer's non-voided invoices"
          - "FeeInvoice.version increments by 1"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /fee-invoices/{id}/void"
        actor: OpsAdmin
        preconditions: ["transparency_report_id is null or the report exists (voiding does not delete reports)"]
        side_effects:
          - "aggregate_fee_cents on sibling non-voided invoices of the same payer recomputed"
          - "FeeInvoice.version increments by 1"

  - entity: RepricingDetermination
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (appeal ADJUSTED, settlement EXECUTED, OpenNegotiation AGREED, or IDR decided)"
        actor: system
        preconditions: []
        side_effects: ["RepricingDetermination.version increments by 1"]
    note: "Append-only chain: every repricing event creates a new ACTIVE determination and supersedes the old one; input_snapshot and computation_trace are immutable once written."

  - entity: NetworkAgreement
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /network-agreements/{id}/suspend"
        actor: NetworkAdmin
        preconditions: []
        side_effects: ["NetworkAgreement.version increments by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /network-agreements/{id}/reinstate"
        actor: NetworkAdmin
        preconditions: []
        side_effects: ["NetworkAgreement.version increments by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /network-agreements/{id}/terminate"
        actor: NetworkAdmin
        preconditions: []
        side_effects: ["NetworkAgreement.version increments by 1"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /network-agreements/{id}/terminate"
        actor: NetworkAdmin
        preconditions: []
        side_effects: ["NetworkAgreement.version increments by 1"]

  - entity: PayerClient
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /payer-clients/{id}/suspend"
        actor: OpsAdmin
        preconditions: []
        side_effects: ["PayerClient.version increments by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /payer-clients/{id}/reinstate"
        actor: OpsAdmin
        preconditions: []
        side_effects: ["PayerClient.version increments by 1"]

  - entity: RepricingPolicy
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /repricing-policies/{id}/retire"
        actor: PayerAdmin
        preconditions: []
        side_effects: ["RepricingPolicy.version increments by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: reprice-stale-claim-version
    parent_entity: Claim
    write_endpoint: "POST /claims/{id}/reprice"
    occ_field: "expected_claim_version"
    description: |
      Repricing a Claim whose version has advanced since the caller last observed
      it is rejected. This captures the case where another writer has just added a
      claim line (which legitimately changes the billed amount the repricing is
      based on) and the current writer's view of the claim is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: negotiate-stale-case-version
    parent_entity: NegotiationCase
    write_endpoint: "POST /negotiation-cases/{id}/offer"
    occ_field: "expected_case_version"
    description: |
      Placing an offer on a NegotiationCase whose version has advanced since the
      caller last observed it is rejected. This captures the case where the
      provider has just countered (which legitimately changes the current offer on
      the table) and the payer's view of the case is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: repricing_allowability
    trigger: "POST /claims/{id}/reprice (per non-VOID ClaimLine)"
    algorithm: tiered_pricing
    formula: |
      Per line, by selected methodology:
        CONTRACTED_NETWORK: allowed_line = round_half_up(gross_line * (1 - agreement.discount_percent))
        PERCENT_OF_MEDICARE: base_line = round_half_up(medicare.base_rate_cents * medicare.geographic_adjustment_factor * line.quantity_units)
                             allowed_line = round_half_up(base_line * policy.percent_of_medicare)
        UCR: benchmark_line = (policy.ucr_percentile == 80 ? ucr.percentile_80_cents : ucr.percentile_50_cents) * line.quantity_units
             allowed_line = min(gross_line, benchmark_line)
        REFERENCE_BASED: allowed_line = min(gross_line, round_half_up(policy.rbp_markup_percent * benchmark_line)) where benchmark_line uses the 80th percentile
      where gross_line = line.unit_charge_cents * line.quantity_units
      ROUNDING ORDER (pinned): PER_LINE_THEN_SUM — every per-line allowed amount is
      rounded to whole cents with round_half_up BEFORE summing into
      Claim.allowed_amount_cents. The alternative (sum raw, round once) is
      explicitly NOT used and produces different cents on odd half-cent lines.
    input_set: "Non-VOID ClaimLine rows of the claim; the single selected RepricingPolicy; the NetworkAgreement or MedicareFeeScheduleEntry or UsualCustomaryRate rows named in the determination input_snapshot"
    constants:
      ROUNDING: round_half_up to whole cents, per line
      UCR_BENCHMARK_PERCENTILE: 80
    precision: "whole cents, round_half_up, per line then sum"
    variants:
      - name: contracted_vs_schedule
        when: "Same claim priced once under CONTRACTED_NETWORK (agreement discount path) and once under PERCENT_OF_MEDICARE (schedule multiplier path)"
        difference: "The two paths use different baselines (billed charges vs Medicare schedule) and produce different allowed amounts for identical line data"

  - name: rbp_amount
    trigger: "POST /claims/{id}/reprice when selected methodology == REFERENCE_BASED"
    algorithm: constraint_propagation
    formula: |
      benchmark = UCR percentile_80_cents for the claim's primary (first-created) line procedure_code and region_code
      rbp_amount_cents = min(claim.billed_amount_cents,
                             allowed_amount_cents + round_half_up(policy.rbp_markup_percent * max(0, benchmark - allowed_amount_cents)))
      Written to Claim.rbp_amount_cents alongside allowed_amount_cents.
      Evaluation order (pinned): allowed_amount_cents is fully computed FIRST by
      repricing_allowability; rbp_amount_cents reads it. benchmark enters only via
      the gap term max(0, benchmark - allowed). This resolves the circular-looking
      dependency (rbp defined in terms of allowed, benchmark defined relative to
      billed) with a fixed evaluation order.
    input_set: "Claim, selected policy, UsualCustomaryRate row"
    constants:
      BENCHMARK_PERCENTILE: 80
    precision: "whole cents, round_half_up"

  - name: fee_invoice
    trigger: "POST /fee-invoices/{id}/issue"
    algorithm: waterfall_allocation
    formula: |
      Per claim on the invoice:
        savings = claim.savings_cents
        tier1 = min(savings, TIER1_CAP_CENTS) * TIER1_RATE
        tier2 = max(0, savings - TIER1_CAP_CENTS) * TIER2_RATE
        claim_fee = min(payer.fee_cap_cents_per_claim, round_half_up(tier1 + tier2))
      gross_fee_cents = sum(claim_fee over invoice claims)
      aggregate_fee_cents = sum(gross_fee_cents over all non-voided FeeInvoice of the payer)
    input_set: "FINALIZED claims listed in claim_ids; payer fee configuration"
    constants:
      TIER1_CAP_CENTS: 20000
      TIER1_RATE: 0.25
      TIER2_RATE: 0.20
    precision: "whole cents, round_half_up per claim before summing"

  - name: qpa_benchmark
    trigger: "POST /idr-submissions"
    algorithm: aggregation
    formula: |
      Candidate set: ACTIVE NetworkAgreement rows joined to RepricingDetermination
      input_snapshots that priced the claim's primary procedure_code under
      CONTRACTED_NETWORK, in the claim's region, regardless of payer.
      Per-unit contracted rate per candidate = agreement discount applied to the
      snapshotted gross unit charge (from input_snapshot).
      qpa_cents = median of the candidate rates: sort ascending; for an odd count
      take the middle element; for an even count take the lower-middle element
      (index count/2 - 1, zero-based). Ties are impossible to break by ordering
      alone and need none: equal values collapse.
      Empty candidate set -> ERR_QPA_UNAVAILABLE.
    input_set: "ACTIVE NetworkAgreement rows + their determination snapshots for the procedure/region"
    constants: {}
    precision: "whole cents, no rounding (median of cent values)"

  - name: sla_tracking
    trigger: "POST /feed-batches (compute sla_due_at); POST /feed-batches/{id}/process (compute sla_met)"
    algorithm: chronological
    formula: |
      Business-hours calendar: Mon-Fri, 09:00:00Z-17:00:00Z.
      sla_due_at = received_at + turnaround_business_hours, where hours accrue only
      inside the business-hours calendar (time outside the window does not count).
      Arrival outside business hours starts counting at the next 09:00:00Z.
      sla_met = (processed_at <= sla_due_at); equality counts as met.
    input_set: "ClaimFeedBatch.received_at, payer-configured turnaround hours (fixed 4 for CLAIM_INTAKE, 24 for REMITTANCE and ELIGIBILITY)"
    constants:
      TURNAROUND_CLAIM_INTAKE_HOURS: 4
      TURNAROUND_DEFAULT_HOURS: 24
      BUSINESS_DAY_START: "09:00:00Z"
      BUSINESS_DAY_END: "17:00:00Z"
    precision: "second-level timestamps, no rounding"

  - name: savings_transparency
    trigger: "POST /fee-invoices/{id}/publish-transparency-report"
    algorithm: aggregation
    formula: |
      total_billed_cents = sum(claim.billed_amount_cents) over invoice claims
      total_allowed_cents = sum(claim.allowed_amount_cents) over invoice claims
      total_savings_cents = sum(claim.savings_cents) over invoice claims
      total_fee_cents = FeeInvoice.gross_fee_cents
    input_set: "Claims listed on the ISSUED FeeInvoice"
    constants: {}
    precision: "whole cents, no rounding"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: state
    check: "PayerClient.status == ACTIVE for claim-ingest and reprice operations"
    error_id: ERR_PAYER_SUSPENDED
    http_status: 409
    applies_to: "POST /claims, POST /claims/{id}/lines, POST /claims/{id}/reprice"
  - priority: 5
    category: state
    check: "Target resource state permits the transition (per §1.2 from-states)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_safety
    check: "NSA-flagged claims must not be force-priced under NEGOTIATION_REQUIRED policy"
    error_id: ERR_NSA_METHODOLOGY_CONFLICT
    http_status: 422
    applies_to: "POST /claims/{id}/reprice"
  - priority: 7
    category: business_temporal
    check: "Temporal window rules: IDR submission only at/after OpenNegotiation.expires_at; appeals only at/before appeal_window_deadline"
    error_id: "ERR_OPEN_NEGOTIATION_ACTIVE | ERR_APPEAL_WINDOW_CLOSED"
    http_status: 409
    applies_to: "POST /idr-submissions, POST /claims/{id}/appeals"
  - priority: 8
    category: business_referential
    check: "Referenced rate inputs exist: MedicareFeeScheduleEntry per line (procedure_code, region_code) for PERCENT_OF_MEDICARE; UsualCustomaryRate for REFERENCE_BASED/UCR; NetworkAgreement covering (provider, service_date) for IN_NETWORK claims"
    error_id: "ERR_RATE_INPUT_MISSING | ERR_NO_CONTRACTED_AGREEMENT"
    http_status: 422
    applies_to: "POST /claims/{id}/reprice"
  - priority: 9
    category: business_constraint
    check: "Exactly one selectable ACTIVE RepricingPolicy; negotiation-required methodology blocks direct reprice; claim has at least one non-VOID line"
    error_id: "ERR_NO_REPRICING_POLICY | ERR_NEGOTIATION_REQUIRED | ERR_CLAIM_HAS_NO_LINES"
    http_status: 422
    applies_to: "POST /claims/{id}/reprice"
  - priority: 10
    category: business_constraint
    check: "Offer/counter bounds: counter_cents >= current_offer_cents; offers within (0, billed_amount_cents]"
    error_id: "ERR_COUNTER_BELOW_OFFER | ERR_OFFER_OUT_OF_RANGE"
    http_status: 422
    applies_to: "POST /negotiation-cases/{id}/offer, POST /negotiation-cases/{id}/counter"
  - priority: 11
    category: business_fiscal
    check: "Fee invoice fiscal rules: claims FINALIZED, not already invoiced on a non-voided FeeInvoice"
    error_id: "ERR_CLAIM_NOT_FINALIZED | ERR_CLAIM_ALREADY_INVOICED"
    http_status: 409
    applies_to: "POST /fee-invoices, POST /fee-invoices/{id}/issue"
  - priority: 12
    category: business_constraint
    check: "IDR decision amount must equal the winning party's submitted offer"
    error_id: ERR_IDR_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /idr-submissions/{id}/decide"
  - priority: 13
    category: business_constraint
    check: "external_claim_ref unique per payer among claims not in REPRICE_FAILED; provider npi unique"
    error_id: "ERR_DUPLICATE_CLAIM_REF | ERR_DUPLICATE_NPI"
    http_status: 409
    applies_to: "POST /claims, POST /providers"
  - priority: 14
    category: business_constraint
    check: "NetworkAgreement intervals for the same provider must not overlap among ACTIVE or SUSPENDED rows (half-open [effective_start, effective_end) for overlap detection, though both bounds are stored inclusive-on-start/exclusive-on-end for occupancy)"
    error_id: ERR_AGREEMENT_OVERLAP
    http_status: 409
    applies_to: "POST /network-agreements"
  - priority: 15
    category: business_safety
    check: "Transparency report requires payer.transparency_reporting_enabled == true and invoice ISSUED"
    error_id: ERR_TRANSPARENCY_NOT_ENABLED
    http_status: 422
    applies_to: "POST /fee-invoices/{id}/publish-transparency-report"
  - priority: 16
    category: business_constraint
    check: "OCC: expected_claim_version / expected_case_version match current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /claims/{id}/reprice, POST /negotiation-cases/{id}/offer"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-09-01T00:00:00Z; before any set call the clock reads exactly that default and never falls back to wall-clock time."
    roles: [OpsAdmin, FeedOperator]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects:
      - "Logical clock advances; OpenNegotiation rows whose expires_at is now reached transition ACTIVE -> EXPIRED"

  # --- PayerClient ---
  - method: POST
    path: "/payer-clients"
    description: "Onboard a payer client with fee configuration"
    roles: [OpsAdmin]
    code: 201
    input: [payer_name, fee_percent, fee_cap_cents_per_claim, "minimum_invoice_cents?", "transparency_reporting_enabled?"]
    output: PayerClient
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/payer-clients/{id}"
    description: "Get a payer client"
    roles: [OpsAdmin, PayerAdmin, PayerRep, ProviderRep, NetworkAdmin, FeedOperator, IdrEntity]
    code: 200
    input: []
    output: PayerClient
    side_effects: []
  - method: GET
    path: "/payer-clients"
    description: "List payer clients"
    roles: [OpsAdmin, PayerAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "PayerClient[]"
    side_effects: []
  - method: POST
    path: "/payer-clients/{id}/suspend"
    description: "Suspend a payer client"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: PayerClient
    side_effects: ["status -> SUSPENDED", "increments PayerClient.version by 1"]
  - method: POST
    path: "/payer-clients/{id}/reinstate"
    description: "Reinstate a suspended payer"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: PayerClient
    side_effects: ["status -> ACTIVE", "increments PayerClient.version by 1"]

  # --- RepricingPolicy ---
  - method: POST
    path: "/repricing-policies"
    description: "Create a repricing policy for a payer"
    roles: [PayerAdmin]
    code: 201
    input: [payer_client_id, claim_type, network_status, methodology, "percent_of_medicare?", "rbp_markup_percent?", "ucr_percentile?", priority]
    output: RepricingPolicy
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/repricing-policies/{id}"
    description: "Get a repricing policy"
    roles: [OpsAdmin, PayerAdmin, PayerRep]
    code: 200
    input: []
    output: RepricingPolicy
    side_effects: []
  - method: GET
    path: "/repricing-determinations/{id}"
    description: "Get a single repricing determination"
    roles: [OpsAdmin, PayerAdmin, PayerRep, ProviderRep]
    code: 200
    input: []
    output: RepricingDetermination
    side_effects: []
  - method: GET
    path: "/repricing-policies"
    description: "List repricing policies"
    roles: [OpsAdmin, PayerAdmin, PayerRep]
    code: 200
    input: ["payer_client_id?", "methodology?", "status?", "limit?", "offset?"]
    output: "RepricingPolicy[]"
    side_effects: []
  - method: POST
    path: "/repricing-policies/{id}/retire"
    description: "Retire a policy"
    roles: [PayerAdmin]
    code: 200
    input: []
    output: RepricingPolicy
    side_effects: ["status -> RETIRED", "increments RepricingPolicy.version by 1"]

  # --- Provider ---
  - method: POST
    path: "/providers"
    description: "Register a provider"
    roles: [NetworkAdmin]
    code: 201
    input: [npi, legal_name, tin]
    output: Provider
    side_effects: []
  - method: GET
    path: "/providers/{id}"
    description: "Get a provider"
    roles: [OpsAdmin, PayerAdmin, PayerRep, ProviderRep, NetworkAdmin, FeedOperator, IdrEntity]
    code: 200
    input: []
    output: Provider
    side_effects: []
  - method: GET
    path: "/providers"
    description: "List providers"
    roles: [OpsAdmin, PayerAdmin, PayerRep, ProviderRep, NetworkAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Provider[]"
    side_effects: []

  # --- NetworkAgreement ---
  - method: POST
    path: "/network-agreements"
    description: "Create a contracted network agreement"
    roles: [NetworkAdmin]
    code: 201
    input: [network_name, provider_id, discount_percent, effective_start, effective_end]
    output: NetworkAgreement
    side_effects: ["status=ACTIVE; rejected with ERR_AGREEMENT_OVERLAP when an ACTIVE/SUSPENDED agreement for the same provider overlaps [effective_start, effective_end)"]
  - method: GET
    path: "/network-agreements/{id}"
    description: "Get an agreement"
    roles: [OpsAdmin, PayerAdmin, PayerRep, ProviderRep, NetworkAdmin]
    code: 200
    input: []
    output: NetworkAgreement
    side_effects: []
  - method: GET
    path: "/network-agreements"
    description: "List agreements"
    roles: [OpsAdmin, PayerAdmin, PayerRep, ProviderRep, NetworkAdmin]
    code: 200
    input: ["provider_id?", "status?", "limit?", "offset?"]
    output: "NetworkAgreement[]"
    side_effects: []
  - method: POST
    path: "/network-agreements/{id}/suspend"
    description: "Suspend an agreement"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: NetworkAgreement
    side_effects: ["status -> SUSPENDED", "increments NetworkAgreement.version by 1"]
  - method: POST
    path: "/network-agreements/{id}/reinstate"
    description: "Reinstate an agreement"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: NetworkAgreement
    side_effects: ["status -> ACTIVE", "increments NetworkAgreement.version by 1"]
  - method: POST
    path: "/network-agreements/{id}/terminate"
    description: "Terminate an agreement"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: NetworkAgreement
    side_effects: ["status -> TERMINATED", "increments NetworkAgreement.version by 1"]

  # --- Rate tables ---
  - method: POST
    path: "/medicare-fee-schedule"
    description: "Load a Medicare fee schedule entry"
    roles: [NetworkAdmin]
    code: 201
    input: [procedure_code, region_code, base_rate_cents, geographic_adjustment_factor, effective_year]
    output: MedicareFeeScheduleEntry
    side_effects: []
  - method: GET
    path: "/medicare-fee-schedule"
    description: "List Medicare fee schedule entries"
    roles: [OpsAdmin, PayerAdmin, PayerRep, NetworkAdmin]
    code: 200
    input: ["procedure_code?", "region_code?", "limit?", "offset?"]
    output: "MedicareFeeScheduleEntry[]"
    side_effects: []
  - method: POST
    path: "/ucr-rates"
    description: "Load a UCR benchmark row"
    roles: [NetworkAdmin]
    code: 201
    input: [procedure_code, region_code, percentile_50_cents, percentile_80_cents]
    output: UsualCustomaryRate
    side_effects: []
  - method: GET
    path: "/ucr-rates"
    description: "List UCR rows"
    roles: [OpsAdmin, PayerAdmin, PayerRep, NetworkAdmin]
    code: 200
    input: ["procedure_code?", "region_code?", "limit?", "offset?"]
    output: "UsualCustomaryRate[]"
    side_effects: []

  # --- Claim ---
  - method: POST
    path: "/claims"
    description: "Ingest a claim from a payer feed"
    roles: [PayerRep]
    code: 201
    input: [payer_client_id, provider_id, external_claim_ref, claim_type, network_status, service_date, patient_responsibility_cents, "nsa_flag?"]
    output: Claim
    side_effects: ["status=RECEIVED", "billed_amount_cents=0"]
  - method: GET
    path: "/claims/{id}"
    description: "Get a claim"
    roles: [OpsAdmin, PayerAdmin, PayerRep, ProviderRep, NetworkAdmin, IdrEntity]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/claims"
    description: "List claims"
    roles: [OpsAdmin, PayerAdmin, PayerRep, ProviderRep]
    code: 200
    input: ["payer_client_id?", "provider_id?", "status?", "network_status?", "limit?", "offset?"]
    output: "Claim[]"
    side_effects: []
  - method: POST
    path: "/claims/{id}/lines"
    description: "Add a claim line"
    roles: [PayerRep]
    code: 201
    input: [procedure_code, quantity_units, unit_charge_cents, region_code]
    output: ClaimLine
    side_effects:
      - "Claim.billed_amount_cents recomputed"
      - "Claim.status RECEIVED -> PENDING_LINES on first line"
      - "increments Claim.version by 1"
  - method: GET
    path: "/claims/{id}/lines"
    description: "List lines of a claim"
    roles: [OpsAdmin, PayerAdmin, PayerRep, ProviderRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "ClaimLine[]"
    side_effects: []
  - method: POST
    path: "/claims/{id}/reprice"
    description: "Price a pending claim under the selected policy"
    roles: [PayerRep]
    code: 200
    input: [expected_claim_version, "defensibility_notes?"]
    output: RepricingDetermination
    side_effects:
      - "RepricingDetermination created ACTIVE with input_snapshot + computation_trace"
      - "Claim.status -> PRICED; allowed/liability/savings computed; methodology_used set"
      - "ClaimLine rows -> PRICED with per-line allowed amounts"
      - "CONTRACTED_NETWORK path increments NetworkAgreement.version by 1"
      - "increments Claim.version by 1"
  - method: GET
    path: "/claims/{id}/determinations"
    description: "List the determination chain of a claim"
    roles: [OpsAdmin, PayerAdmin, PayerRep, ProviderRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "RepricingDetermination[]"
    side_effects: []
  - method: GET
    path: "/repricing-determinations"
    description: "List determinations filtered by policy, agreement, or supersession link (reverse reachability for determination FKs)"
    roles: [OpsAdmin, PayerAdmin, PayerRep, ProviderRep]
    code: 200
    input: ["policy_id?", "agreement_id?", "supersedes_determination_id?", "status?", "limit?", "offset?"]
    output: "RepricingDetermination[]"
    side_effects: []
  - method: POST
    path: "/claims/{id}/finalize"
    description: "Finalize a priced or settled claim (makes it invoiceable)"
    roles: [PayerRep]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> FINALIZED", "increments Claim.version by 1"]

  # --- NegotiationCase ---
  - method: POST
    path: "/negotiation-cases"
    description: "Open a negotiation on an out-of-network claim"
    roles: [PayerRep, ProviderRep]
    code: 201
    input: [claim_id]
    output: NegotiationCase
    side_effects: ["status=OPEN; claim must be PRICED or PENDING_LINES; only one non-terminal NegotiationCase per claim (ERR_CASE_ALREADY_OPEN)"]
  - method: GET
    path: "/negotiation-cases/{id}"
    description: "Get a negotiation case"
    roles: [OpsAdmin, PayerAdmin, PayerRep, ProviderRep]
    code: 200
    input: []
    output: NegotiationCase
    side_effects: []
  - method: GET
    path: "/negotiation-cases"
    description: "List negotiation cases"
    roles: [OpsAdmin, PayerAdmin, PayerRep, ProviderRep]
    code: 200
    input: ["claim_id?", "status?", "limit?", "offset?"]
    output: "NegotiationCase[]"
    side_effects: []
  - method: POST
    path: "/negotiation-cases/{id}/offer"
    description: "Payer places or improves an offer"
    roles: [PayerRep]
    code: 200
    input: [offer_cents, expected_case_version]
    output: NegotiationCase
    side_effects: ["status OPEN->OFFER_PENDING or COUNTERED->OFFER_PENDING", "current_offer_cents updated", "increments NegotiationCase.version by 1"]
  - method: POST
    path: "/negotiation-cases/{id}/counter"
    description: "Provider counters the payer offer"
    roles: [ProviderRep]
    code: 200
    input: [counter_cents]
    output: NegotiationCase
    side_effects: ["status -> COUNTERED", "round_count + 1; at 5 the case -> EXPIRED", "increments NegotiationCase.version by 1"]
  - method: POST
    path: "/negotiation-cases/{id}/accept"
    description: "Accept the offer currently on the table (provider accepts payer offer from OFFER_PENDING; payer accepts counter from COUNTERED)"
    roles: [PayerRep, ProviderRep]
    code: 200
    input: []
    output: NegotiationCase
    side_effects: ["status -> ACCEPTED", "SettlementAgreement created PENDING_SIGNATURES with settled_amount_cents = current_offer_cents", "increments NegotiationCase.version by 1"]
  - method: POST
    path: "/negotiation-cases/{id}/withdraw"
    description: "Withdraw a negotiation"
    roles: [PayerRep, ProviderRep]
    code: 200
    input: []
    output: NegotiationCase
    side_effects: ["status -> WITHDRAWN", "increments NegotiationCase.version by 1"]

  # --- SettlementAgreement ---
  - method: GET
    path: "/settlement-agreements/{id}"
    description: "Get a settlement agreement"
    roles: [OpsAdmin, PayerAdmin, PayerRep, ProviderRep]
    code: 200
    input: []
    output: SettlementAgreement
    side_effects: []
  - method: GET
    path: "/settlement-agreements"
    description: "List settlement agreements"
    roles: [OpsAdmin, PayerAdmin, PayerRep, ProviderRep]
    code: 200
    input: ["claim_id?", "negotiation_case_id?", "status?", "limit?", "offset?"]
    output: "SettlementAgreement[]"
    side_effects: []
  - method: POST
    path: "/settlement-agreements/{id}/sign"
    description: "Sign a settlement (each party signs once; second signature executes)"
    roles: [PayerRep, ProviderRep]
    code: 200
    input: []
    output: SettlementAgreement
    side_effects:
      - "sets payer_signed_at / provider_signed_at"
      - "on second signature: status -> EXECUTED; Claim PRICED -> SETTLED with settled_amount_cents; NegotiationCase ACCEPTED -> SETTLED; new NEGOTIATED RepricingDetermination supersedes prior"
      - "increments SettlementAgreement.version by 1"
  - method: POST
    path: "/settlement-agreements/{id}/void"
    description: "Void an unsigned settlement (compensating action)"
    roles: [PayerRep]
    code: 200
    input: []
    output: SettlementAgreement
    side_effects: ["status -> VOIDED", "NegotiationCase ACCEPTED -> COUNTERED", "increments SettlementAgreement.version by 1"]

  # --- OpenNegotiation (NSA) ---
  - method: POST
    path: "/open-negotiations"
    description: "Initiate a federal open negotiation period for an NSA claim"
    roles: [PayerRep, ProviderRep]
    code: 201
    input: [claim_id, initiated_by]
    output: OpenNegotiation
    side_effects: ["status=ACTIVE", "initiated_at = logical clock", "expires_at computed (30 business days)"]
  - method: GET
    path: "/open-negotiations/{id}"
    description: "Get an open negotiation"
    roles: [OpsAdmin, PayerAdmin, PayerRep, ProviderRep, IdrEntity]
    code: 200
    input: []
    output: OpenNegotiation
    side_effects: []
  - method: GET
    path: "/open-negotiations"
    description: "List open negotiations"
    roles: [OpsAdmin, PayerAdmin, PayerRep, ProviderRep, IdrEntity]
    code: 200
    input: ["claim_id?", "status?", "limit?", "offset?"]
    output: "OpenNegotiation[]"
    side_effects: []
  - method: POST
    path: "/open-negotiations/{id}/agree"
    description: "Record agreement during the open negotiation period"
    roles: [PayerRep, ProviderRep]
    code: 200
    input: [agreed_amount_cents]
    output: OpenNegotiation
    side_effects: ["status -> AGREED", "Claim re-priced to agreed_amount_cents and -> SETTLED with a new NEGOTIATED determination", "increments OpenNegotiation.version by 1"]

  # --- IDR ---
  - method: POST
    path: "/idr-submissions"
    description: "Submit a completed open negotiation to independent dispute resolution"
    roles: [PayerRep, ProviderRep]
    code: 201
    input: [claim_id, open_negotiation_id, payer_offer_cents, provider_offer_cents]
    output: IdrSubmission
    side_effects: ["status=SUBMITTED", "qpa_cents computed", "OpenNegotiation EXPIRED -> SUPERSEDED_BY_IDR"]
  - method: GET
    path: "/idr-submissions/{id}"
    description: "Get an IDR submission"
    roles: [OpsAdmin, PayerAdmin, PayerRep, ProviderRep, IdrEntity]
    code: 200
    input: []
    output: IdrSubmission
    side_effects: []
  - method: GET
    path: "/idr-submissions"
    description: "List IDR submissions"
    roles: [OpsAdmin, PayerAdmin, PayerRep, ProviderRep, IdrEntity]
    code: 200
    input: ["claim_id?", "open_negotiation_id?", "status?", "limit?", "offset?"]
    output: "IdrSubmission[]"
    side_effects: []
  - method: POST
    path: "/idr-submissions/{id}/decide"
    description: "IDR entity renders a baseball-style decision"
    roles: [IdrEntity]
    code: 200
    input: [winner, winning_amount_cents]
    output: IdrSubmission
    side_effects: ["status -> DECIDED_PAYER or DECIDED_PROVIDER", "Claim re-priced to winning amount and -> SETTLED with new determination", "increments IdrSubmission.version by 1"]
  - method: POST
    path: "/idr-submissions/{id}/dismiss"
    description: "Dismiss an IDR submission"
    roles: [IdrEntity]
    code: 200
    input: []
    output: IdrSubmission
    side_effects: ["status -> DISMISSED", "increments IdrSubmission.version by 1"]

  # --- ProviderAppeal ---
  - method: POST
    path: "/claims/{id}/appeals"
    description: "Provider appeals a repriced claim"
    roles: [ProviderRep]
    code: 201
    input: [determination_id, appeal_reason]
    output: ProviderAppeal
    side_effects: ["status=SUBMITTED", "appeal_window_deadline = determination.created_at + 45 calendar days"]
  - method: GET
    path: "/appeals/{id}"
    description: "Get an appeal"
    roles: [OpsAdmin, PayerAdmin, PayerRep, ProviderRep]
    code: 200
    input: []
    output: ProviderAppeal
    side_effects: []
  - method: GET
    path: "/appeals"
    description: "List appeals"
    roles: [OpsAdmin, PayerAdmin, PayerRep, ProviderRep]
    code: 200
    input: ["claim_id?", "determination_id?", "status?", "limit?", "offset?"]
    output: "ProviderAppeal[]"
    side_effects: []
  - method: POST
    path: "/appeals/{id}/start-review"
    description: "Payer starts re-review"
    roles: [PayerRep]
    code: 200
    input: []
    output: ProviderAppeal
    side_effects: ["status -> UNDER_REVIEW", "increments ProviderAppeal.version by 1"]
  - method: POST
    path: "/appeals/{id}/resolve"
    description: "Resolve the appeal"
    roles: [PayerRep]
    code: 200
    input: [outcome, "adjusted_amount_cents?"]
    output: ProviderAppeal
    side_effects:
      - "outcome UPHELD -> RE_REVIEWED_UPHELD; DENIED -> DENIED"
      - "outcome ADJUSTED -> RE_REVIEWED_ADJUSTED; new RepricingDetermination supersedes prior; Claim amounts recomputed"
      - "increments ProviderAppeal.version by 1"

  # --- ClaimFeedBatch ---
  - method: POST
    path: "/feed-batches"
    description: "Register receipt of a payer data feed batch"
    roles: [FeedOperator]
    code: 201
    input: [payer_client_id, feed_type, record_count]
    output: ClaimFeedBatch
    side_effects: ["status=RECEIVED", "received_at = logical clock", "sla_due_at computed"]
  - method: GET
    path: "/feed-batches/{id}"
    description: "Get a feed batch"
    roles: [OpsAdmin, PayerAdmin, FeedOperator]
    code: 200
    input: []
    output: ClaimFeedBatch
    side_effects: []
  - method: GET
    path: "/feed-batches"
    description: "List feed batches"
    roles: [OpsAdmin, PayerAdmin, FeedOperator]
    code: 200
    input: ["payer_client_id?", "feed_type?", "status?", "sla_met?", "limit?", "offset?"]
    output: "ClaimFeedBatch[]"
    side_effects: []
  - method: POST
    path: "/feed-batches/{id}/process"
    description: "Mark a feed batch processed"
    roles: [FeedOperator]
    code: 200
    input: []
    output: ClaimFeedBatch
    side_effects: ["status -> PROCESSED", "processed_at set", "sla_met computed", "increments ClaimFeedBatch.version by 1"]
  - method: POST
    path: "/feed-batches/{id}/fail"
    description: "Mark a feed batch failed"
    roles: [FeedOperator]
    code: 200
    input: []
    output: ClaimFeedBatch
    side_effects: ["status -> FAILED", "increments ClaimFeedBatch.version by 1"]

  # --- FeeInvoice / TransparencyReport ---
  - method: POST
    path: "/fee-invoices"
    description: "Create a draft fee invoice over finalized claims"
    roles: [OpsAdmin]
    code: 201
    input: [payer_client_id, claim_ids]
    output: FeeInvoice
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/fee-invoices/{id}"
    description: "Get a fee invoice"
    roles: [OpsAdmin, PayerAdmin]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: []
  - method: GET
    path: "/fee-invoices"
    description: "List fee invoices"
    roles: [OpsAdmin, PayerAdmin]
    code: 200
    input: ["payer_client_id?", "status?", "transparency_report_id?", "limit?", "offset?"]
    output: "FeeInvoice[]"
    side_effects: []
  - method: POST
    path: "/fee-invoices/{id}/issue"
    description: "Issue a fee invoice (computes fees)"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: ["status -> ISSUED", "gross_fee_cents computed per fee_invoice calculation", "aggregate_fee_cents recomputed across payer non-voided invoices", "increments FeeInvoice.version by 1"]
  - method: POST
    path: "/fee-invoices/{id}/void"
    description: "Void an issued invoice"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: ["status -> VOIDED", "aggregate_fee_cents recomputed on sibling invoices", "increments FeeInvoice.version by 1"]
  - method: POST
    path: "/fee-invoices/{id}/publish-transparency-report"
    description: "Publish the client transparency report for an issued invoice"
    roles: [OpsAdmin]
    code: 201
    input: []
    output: TransparencyReport
    side_effects: ["TransparencyReport created PUBLISHED", "FeeInvoice.transparency_report_id set"]
  - method: GET
    path: "/transparency-reports/{id}"
    description: "Get a transparency report"
    roles: [OpsAdmin, PayerAdmin]
    code: 200
    input: []
    output: TransparencyReport
    side_effects: []
  - method: GET
    path: "/transparency-reports"
    description: "List transparency reports"
    roles: [OpsAdmin, PayerAdmin]
    code: 200
    input: ["fee_invoice_id?", "limit?", "offset?"]
    output: "TransparencyReport[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID / X-User-Role missing or role not declared" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, non-positive amounts, quantity_units < 1" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource state does not permit the transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version" }
  - { id: ERR_PAYER_SUSPENDED, http: 409, condition: "Payer client SUSPENDED; claim ingest, line add, and reprice blocked" }
  - { id: ERR_DUPLICATE_CLAIM_REF, http: 409, condition: "external_claim_ref already used by another claim of the same payer" }
  - { id: ERR_DUPLICATE_NPI, http: 409, condition: "Provider npi already registered" }
  - { id: ERR_AGREEMENT_OVERLAP, http: 409, condition: "New NetworkAgreement interval overlaps an ACTIVE or SUSPENDED agreement for the same provider" }
  - { id: ERR_NO_CONTRACTED_AGREEMENT, http: 422, condition: "IN_NETWORK claim has no ACTIVE NetworkAgreement covering (provider_id, service_date)" }
  - { id: ERR_NO_REPRICING_POLICY, http: 422, condition: "No ACTIVE RepricingPolicy matches (payer, claim_type, network_status) for an out-of-network claim" }
  - { id: ERR_NEGOTIATION_REQUIRED, http: 422, condition: "Selected policy methodology is NEGOTIATION_REQUIRED; direct reprice is forbidden" }
  - { id: ERR_NSA_METHODOLOGY_CONFLICT, http: 422, condition: "NSA-flagged claim cannot be force-priced under a NEGOTIATION_REQUIRED policy" }
  - { id: ERR_RATE_INPUT_MISSING, http: 422, condition: "MedicareFeeScheduleEntry or UsualCustomaryRate row missing for a priced line's (procedure_code, region_code)" }
  - { id: ERR_CLAIM_HAS_NO_LINES, http: 422, condition: "Reprice attempted on a claim with zero non-VOID lines" }
  - { id: ERR_CASE_ALREADY_OPEN, http: 409, condition: "A non-terminal NegotiationCase already exists for the claim" }
  - { id: ERR_OFFER_OUT_OF_RANGE, http: 422, condition: "offer_cents outside (0, billed_amount_cents]" }
  - { id: ERR_COUNTER_BELOW_OFFER, http: 422, condition: "counter_cents below the current offer on the table" }
  - { id: ERR_ALREADY_SIGNED, http: 409, condition: "Signing party already signed, or void attempted after a signature" }
  - { id: ERR_OPEN_NEGOTIATION_ACTIVE, http: 409, condition: "IDR submission attempted before the open negotiation period expired" }
  - { id: ERR_QPA_UNAVAILABLE, http: 422, condition: "No contracted-rate candidates exist to compute the QPA benchmark" }
  - { id: ERR_IDR_AMOUNT_MISMATCH, http: 422, condition: "winning_amount_cents does not equal the winning party's submitted offer" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 409, condition: "Appeal submitted after appeal_window_deadline (determination creation + 45 days)" }
  - { id: ERR_APPEAL_IN_PROGRESS, http: 409, condition: "Finalize blocked while a SUBMITTED or UNDER_REVIEW appeal exists for the claim" }
  - { id: ERR_CLAIM_NOT_FINALIZED, http: 409, condition: "Fee invoice includes a claim not in FINALIZED status" }
  - { id: ERR_CLAIM_ALREADY_INVOICED, http: 409, condition: "Claim already appears on a non-voided FeeInvoice" }
  - { id: ERR_TRANSPARENCY_NOT_ENABLED, http: 422, condition: "Payer has transparency_reporting_enabled false, or invoice not ISSUED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OpsAdmin
    description: "Platform operator: onboards payers, manages fee invoices and transparency reports, suspends payers"
    identity: opaque
    exclusive_operations:
      - "POST /payer-clients"
      - "POST /payer-clients/{id}/suspend"
      - "POST /payer-clients/{id}/reinstate"
      - "POST /fee-invoices"
      - "POST /fee-invoices/{id}/issue"
      - "POST /fee-invoices/{id}/void"
      - "POST /fee-invoices/{id}/publish-transparency-report"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET endpoints (broad read access)"
  - name: PayerAdmin
    description: "Payer-side administrator: configures repricing policies"
    identity: entity_backed:PayerClient
    exclusive_operations:
      - "POST /repricing-policies"
      - "POST /repricing-policies/{id}/retire"
    shared_operations:
      - "GET endpoints (broad read access)"
  - name: PayerRep
    description: "Payer claims representative: ingests claims, reprices, negotiates, signs settlements, reviews appeals"
    identity: entity_backed:PayerClient
    exclusive_operations:
      - "POST /claims"
      - "POST /claims/{id}/lines"
      - "POST /claims/{id}/reprice"
      - "POST /claims/{id}/finalize"
      - "POST /negotiation-cases/{id}/offer"
      - "POST /appeals/{id}/start-review"
      - "POST /appeals/{id}/resolve"
      - "POST /settlement-agreements/{id}/void"
    shared_operations:
      - "POST /negotiation-cases"
      - "POST /negotiation-cases/{id}/accept"
      - "POST /negotiation-cases/{id}/withdraw"
      - "POST /settlement-agreements/{id}/sign"
