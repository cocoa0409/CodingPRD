      - name: corner_inmate_worker_link_requires_both_ends_to_exist
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /cfs/inmate-workers]
          - validations[priority=9]
          - errors.ERR_INMATE_NOT_FOUND
        distinguishing_aspect: "The worker row is the junction between an Inmate and a Facility: an unknown inmate_id yields ERR_INMATE_NOT_FOUND with no row written, while the valid link is retrievable through the inmate_id filter on the list endpoint."
        test_recipe:
          setup:
            - "Facility FAC-P04 with one IN_CUSTODY Inmate BK-P04 and no worker rows."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-P04", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-P04", name: "North Unit Kitchen", sharps_authorized_count: 12 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { facility_id: $.data.id }
            - call: "POST /cfs/inmates"
              payload: { facility_id: "${facility_id}", booking_number: "BK-P04", housing_unit: "GENERAL" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { inmate_id: $.data.id }
          trigger:
            - call: "POST /cfs/inmate-workers"
              payload: { inmate_id: "00000000-0000-0000-0000-000000000000", facility_id: "${facility_id}", medical_clearance_expires_at: "2026-12-31T00:00:00Z" }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { link_error: $.data.error_id }
            - call: "POST /cfs/inmate-workers"
              payload: { inmate_id: "${inmate_id}", facility_id: "${facility_id}", medical_clearance_expires_at: "2026-12-31T00:00:00Z" }
