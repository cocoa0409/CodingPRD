              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { bca: $.data.id }
            - call: "POST /benefit-cost-analyses/${bca}/validate"
              payload: { bca_id: "${bca}", decision: "VALIDATE" }
              as: ProgramAdministrator
              as_user_id: "pa-validator"
            - call: "POST /mitigation-projects/${proj}/submit"
              payload: { project_id: "${proj}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /mitigation-projects/${proj}/approve"
              payload: { project_id: "${proj}", decision: "APPROVE" }
              as: ProgramAdministrator
              as_user_id: "pa-approver"
            - call: "POST /parcels/${p1}/appraisals"
              payload: { parcel_id: "${p1}", appraisal_type: "INITIAL", valuation_basis: "PRE_EVENT", appraiser_license_no: "LIC-SA-1", effective_date: "2026-07-01", indicated_value_cents: 20000000 }
              as: StaffAppraiser
              as_user_id: "sa-1"
              captures: { ap_a: $.data.id }
            - call: "POST /appraisals/${ap_a}/submit"
              payload: { appraisal_id: "${ap_a}" }
              as: StaffAppraiser
              as_user_id: "sa-1"
            - call: "POST /appraisals/${ap_a}/review-decision"
              payload: { appraisal_id: "${ap_a}", decision: "ACCEPT" }
              as: ReviewAppraiser
              as_user_id: "ra-1"
            - call: "POST /parcels/${p1}/appraisals"
              payload: { parcel_id: "${p1}", appraisal_type: "INITIAL", valuation_basis: "PRE_EVENT", appraiser_license_no: "LIC-SA-2", effective_date: "2027-06-30", indicated_value_cents: 21000000 }
              as: StaffAppraiser
              as_user_id: "sa-2"
              captures: { ap_d: $.data.id }
            - call: "POST /parcels/${p1}/appraisals"
              payload: { parcel_id: "${p1}", appraisal_type: "INITIAL", valuation_basis: "PRE_EVENT", appraiser_license_no: "LIC-SA-2", effective_date: "2028-01-01", indicated_value_cents: 22000000 }
              as: StaffAppraiser
              as_user_id: "sa-2"
              captures: { ap_e: $.data.id }
            - call: "POST /parcels/${p1}/appraisals"
              payload: { parcel_id: "${p1}", appraisal_type: "INITIAL", valuation_basis: "PRE_EVENT", appraiser_license_no: "LIC-SA-2", effective_date: "2028-06-30", indicated_value_cents: 23000000 }
              as: StaffAppraiser
              as_user_id: "sa-2"
              captures: { ap_f: $.data.id }
          trigger:
            - call: "POST /appraisals/${ap_d}/submit"
