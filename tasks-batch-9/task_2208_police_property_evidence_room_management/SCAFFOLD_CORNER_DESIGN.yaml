      - name: audit_session_starts_in_scheduled_state
        claim_type: Initial State
        grounds:
          - "state_machines.AuditSession"
          - "endpoints[POST /audit-sessions]"
          - "entities.AuditSession.fields.status"
        test_recipe:
          setup:
            - "Base fixture; no item has ever been assigned to G-01, so its version is still 1."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_loc_g
            - *c_aud
          trigger:
            - call: "POST /audit-sessions"
              payload: { storage_location_id: "${loc_g_id}", auditor_id: "${aud_id}", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T17:00:00Z", expected_storage_location_version: "${loc_g_v}" }
              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { sess_id: $.data.id }
          assert:
            - "Responds 201 with status == 'SCHEDULED', the declared initial_state of the AuditSession machine"
            - "risk_index == 0.00, missing_count == 0, misplaced_count == 0, scanned_item_count == 0, expected_item_count == 0"
            - "started_at == null, reconciled_at == null and closed_at == null: no transition has run yet"
            - "GET /storage-locations/${loc_g_id} still shows status == 'OPEN' with sealed_by_audit_session_id == null — scheduling does not seal, only start does — but version == 2 because POST /audit-sessions increments it"

      - name: audit_session_start_seals_location_and_snapshots_expected_items
