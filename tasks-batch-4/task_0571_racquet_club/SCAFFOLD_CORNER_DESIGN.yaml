  - section: cross_cutting
    instances:
      - name: occ_subscription_change_plan_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[subscription-change-plan-stale]"
          - "endpoints"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "After a successful change-plan advances Subscription.version to 2, a second change-plan carrying the original expected_subscription_version (1) is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A member with an ACTIVE subscription (version 1) and two plans to move between."]
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
              payload: { name: "Premier", tier: "PREMIER", monthly_fee_cents: 5000, monthly_court_credits: 8, peak_access: true, guest_fee_cents: 1500, freeze_limit: 2 }
              as: FrontDesk
              captures: { plan_a: "$.data.id" }
            - call: "POST /racquet/membership-plans"
              payload: { name: "Elite", tier: "ELITE", monthly_fee_cents: 9000, monthly_court_credits: 20, peak_access: true, guest_fee_cents: 1000, freeze_limit: 3 }
              as: FrontDesk
              captures: { plan_b: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "Oc C", email: "occ@x.com" }
              as: FrontDesk
              captures: { member_id: "$.data.id" }
            - call: "POST /racquet/subscriptions"
              payload: { member_id: "${member_id}", plan_id: "${plan_a}" }
              as: FrontDesk
              captures: { sub_id: "$.data.id", v0: "$.data.version" }
          trigger:
            - call: "POST /racquet/subscriptions/${sub_id}/change-plan"
              payload: { plan_id: "${plan_b}", expected_subscription_version: "${v0}" }
              as: FrontDesk
            - call: "POST /racquet/subscriptions/${sub_id}/change-plan"
              payload: { plan_id: "${plan_a}", expected_subscription_version: "${v0}" }
              as: FrontDesk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "Subscription.${sub_id}.plan_id == ${plan_b}"

