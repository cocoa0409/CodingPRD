            - "CharterAgreement.${ag2_id}: days_before_start == 59, cancellation_penalty_cents == 1000000 (0.50 tier)"
            - "one calendar day of difference flips the penalty by exactly 400000 cents"

      - name: capacity_equals_limit_passes
        grounds:
          - validations[priority=7]
          - errors[ERR_CAPACITY_EXCEEDED]
          - entities.Yacht.fields.capacity_berths
        distinguishing_aspect: |
          Metric: guests_count vs capacity_berths on POST /charter-requests
          (different metric and endpoint than the cancellation day boundary).
          guests_count == capacity (8) is accepted; capacity + 1 (9) is rejected.
        test_recipe:
          setup:
            - "Yacht A (capacity_berths 8) LISTED; client QUALIFIED"
            - "no other requests exist (order matters: the oversized request is attempted first so the duplicate-active rule cannot mask the capacity error)"
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /clients/${cl_id}/resume/submit", payload: { resume_class: OFFSHORE, skippered_hours: 300 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /clients/${cl_id}/resume/review", payload: { outcome: QUALIFIED }, as: PlatformAdmin }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id } }
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
          trigger:
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-10-01", end_date: "2026-10-11", guests_count: 9 }, as: Client, as_user_id: "${cl_id}", captures: { err: $.data.error_id } }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-10-01", end_date: "2026-10-11", guests_count: 8 }, as: Client, as_user_id: "${cl_id}", captures: { rq_id: $.data.id } }
          assert:
            - "first trigger: err == ERR_CAPACITY_EXCEEDED (9 > 8)"
            - "second trigger: 201, CharterRequest.${rq_id}.status == DRAFT (8 == 8 passes; >= semantics)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: submit_gated_by_client_qualification
        grounds:
          - state_machines.CharterRequest.DRAFT_to_SUBMITTED
          - state_machines.Client.PENDING_REVIEW_to_QUALIFIED
          - errors[ERR_CLIENT_NOT_QUALIFIED]
          - errors[ERR_RESUME_CLASS_INSUFFICIENT]
        distinguishing_aspect: |
          Entity pair CharterRequest x Client: submit requires the Client's
          qualification machine to be QUALIFIED and resume_class to rank >= the
          yacht's requirement — PENDING_REVIEW fails with NOT_QUALIFIED, and
          QUALIFIED-but-COASTAL against an OFFSHORE yacht fails with
          RESUME_CLASS_INSUFFICIENT.
        test_recipe:
          setup:
            - "Yacht A (required_resume_class OFFSHORE) LISTED"
            - "client P: resume submitted (OFFSHORE) but never reviewed -> PENDING_REVIEW"
            - "client Q: resume COASTAL reviewed QUALIFIED"
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Pend Ing", email: "p@example.com" }, as: PlatformAdmin, captures: { clp_id: $.data.id } }
            - { call: "POST /clients/${clp_id}/resume/submit", payload: { resume_class: OFFSHORE, skippered_hours: 300 }, as: Client, as_user_id: "${clp_id}" }
            - { call: "POST /clients", payload: { full_name: "Coast Al", email: "q@example.com" }, as: PlatformAdmin, captures: { clq_id: $.data.id } }
            - { call: "POST /clients/${clq_id}/resume/submit", payload: { resume_class: COASTAL, skippered_hours: 120 }, as: Client, as_user_id: "${clq_id}" }
            - { call: "POST /clients/${clq_id}/resume/review", payload: { outcome: QUALIFIED }, as: PlatformAdmin }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: OFFSHORE, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id } }
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /charter-requests", payload: { client_id: "${clp_id}", yacht_id: "${ya_id}", start_date: "2026-10-01", end_date: "2026-10-11", guests_count: 4 }, as: Client, as_user_id: "${clp_id}", captures: { rqp_id: $.data.id } }
            - { call: "POST /charter-requests", payload: { client_id: "${clq_id}", yacht_id: "${ya_id}", start_date: "2026-10-01", end_date: "2026-10-11", guests_count: 4 }, as: Client, as_user_id: "${clq_id}", captures: { rqq_id: $.data.id } }
          trigger:
            - { call: "POST /charter-requests/${rqp_id}/submit", payload: {}, as: Client, as_user_id: "${clp_id}", captures: { err_p: $.data.error_id } }
            - { call: "POST /charter-requests/${rqq_id}/submit", payload: {}, as: Client, as_user_id: "${clq_id}", captures: { err_q: $.data.error_id } }
          assert:
            - "err_p == ERR_CLIENT_NOT_QUALIFIED (qualification_status PENDING_REVIEW)"
            - "err_q == ERR_RESUME_CLASS_INSUFFICIENT (COASTAL < OFFSHORE)"
            - "both requests remain DRAFT"

      - name: sign_gated_by_verified_insurance
        grounds:
          - state_machines.CharterAgreement.PENDING_SIGNATURES_to_SIGNED
          - state_machines.InsuranceCertificate.PENDING_to_VERIFIED
          - errors[ERR_INSURANCE_NOT_VERIFIED]
        distinguishing_aspect: |
          Entity pair CharterAgreement x InsuranceCertificate: the signature
          transition is blocked until a linked certificate reaches VERIFIED —
          absent certificate and merely PENDING certificate both fail with the
          same error, and only verification unblocks signing.
        test_recipe:
          setup:
            - "Yacht A; request 2026-11-02..2026-11-12 accepted; agreement PENDING_SIGNATURES; no certificate initially"
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /clients/${cl_id}/resume/submit", payload: { resume_class: OFFSHORE, skippered_hours: 300 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /clients/${cl_id}/resume/review", payload: { outcome: QUALIFIED }, as: PlatformAdmin }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id } }
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-11-02", end_date: "2026-11-12", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq_id: $.data.id } }
            - { call: "POST /charter-requests/${rq_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-requests/${rq_id}/offer", payload: {}, as: CentralAgent, as_user_id: "${ca_id}", captures: { rq_v: $.data.version } }
            - { call: "POST /charter-requests/${rq_id}/accept", payload: { expected_charter_request_version: "${rq_v}" }, as: Client, as_user_id: "${cl_id}", captures: { ag_id: $.data.id } }
          trigger:
            - { call: "POST /charter-agreements/${ag_id}/sign", payload: {}, as: Client, as_user_id: "${cl_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /charter-agreements/${ag_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_no: "POL-1", coverage_amount_cents: 1000000, valid_from: "2026-10-01", valid_until: "2026-12-01" }, as: CentralAgent, as_user_id: "${ca_id}", captures: { ic_id: $.data.id } }
            - { call: "POST /charter-agreements/${ag_id}/sign", payload: {}, as: Client, as_user_id: "${cl_id}", captures: { err2: $.data.error_id } }
            - { call: "POST /insurance-certificates/${ic_id}/verify", payload: { outcome: VERIFIED }, as: PlatformAdmin }
            - { call: "POST /charter-agreements/${ag_id}/sign", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-agreements/${ag_id}/sign", payload: {}, as: CentralAgent, as_user_id: "${ca_id}", captures: { ag_status: $.data.status } }
          assert:
            - "err1 == ERR_INSURANCE_NOT_VERIFIED (no certificate at all)"
            - "err2 == ERR_INSURANCE_NOT_VERIFIED (certificate exists but is PENDING)"
            - "after verification: client sign succeeds with status still PENDING_SIGNATURES; central-agent sign flips status == SIGNED"

      - name: start_prep_gated_by_permits
        grounds:
          - state_machines.CharterAgreement.SIGNED_to_IN_PREP
          - state_machines.PortPermit.REQUESTED_to_GRANTED
          - state_machines.ItineraryLeg.PLANNED_to_PERMITTED
          - errors[ERR_PERMIT_NOT_GRANTED]
        distinguishing_aspect: |
          Entity pair CharterAgreement x PortPermit (via ItineraryLeg): with
          funds FULLY_FUNDED, start-prep still fails while the leg's only permit
          is DENIED; only resubmit + GRANTED flips the leg to PERMITTED and
          unblocks the transition.
        test_recipe:
          setup:
            - "Yacht A, 2026-11-02..2026-11-12 (fee 1000000, apa 300000, deposit 500000); SIGNED; FULLY_FUNDED (1000000 + 800000)"
            - "leg 2026-11-03..2026-11-05 with one permit (window 2026-11-01..2026-11-06) decided DENIED"
          setup_api_calls:
