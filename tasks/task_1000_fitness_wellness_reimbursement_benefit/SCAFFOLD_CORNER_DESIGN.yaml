scaffold_corner_design:
  - section: entities
    instances:
      - name: create_employer_returns_201_with_fields
        claim_type: creation
        grounds: [endpoints."POST /api/employers", entities.Employer]
        distinguishing_aspect: "POST with all required fields returns 201 and echoes name/funding_model with system defaults status=ACTIVE, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id, emp_status: $.data.status, emp_v: $.data.version } }
          assert:
            - "response status 201; Employer.status == ACTIVE; Employer.version == 1; id is a prefix-free UUID"

      - name: get_member_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_MEMBER_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: BenefitsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MEMBER_NOT_FOUND; http 404"

      - name: member_eligibility_pending_then_auto_flip
        claim_type: computed_fields
        grounds: [entities.Member.fields.eligibility_status, state_machines.Member.PENDING_to_ELIGIBLE]
        distinguishing_aspect: "hire_date 2026-04-15 under default clock 2026-05-01 creates PENDING; advancing the clock past eligibility_date (2026-05-15) auto-flips to ELIGIBLE with no member-targeted write."
        test_recipe:
          setup: ["ACTIVE plan fixture; member hired 2026-04-15"]
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Standard", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
            - { call: "PUT /api/benefit-plans/${plan_id}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${plan_v}" }, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans/${plan_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/members", payload: { employer_id: "${emp_id}", plan_id: "${plan_id}", external_ref: "E2", full_name: "Mem Two", tier_code: "INDIVIDUAL", hire_date: "2026-04-15T00:00:00Z" }, as: BenefitsAdmin, captures: { m_id: $.data.id, m_status0: $.data.eligibility_status } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-16T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /api/members/${m_id}", payload: {}, as: BenefitsAdmin, captures: { m_status1: $.data.eligibility_status } }
          assert:
            - "Member.${m_id}.eligibility_status == PENDING at creation (eligibility_date 2026-05-15 > clock 2026-05-01)"
            - "Member.${m_id}.eligibility_status == ELIGIBLE after clock crosses 2026-05-15"

      - name: member_create_id_input_ignored
        claim_type: system_fields
        grounds: [entities.Member]
        distinguishing_aspect: "Client-supplied id/version/created_at in the create payload are ignored; the server mints its own id and version 1."
        test_recipe:
          setup: ["ACTIVE plan fixture"]
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Standard", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
            - { call: "PUT /api/benefit-plans/${plan_id}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${plan_v}" }, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans/${plan_id}/activate", payload: {}, as: BenefitsAdmin }
          trigger:
            - { call: "POST /api/members", payload: { employer_id: "${emp_id}", plan_id: "${plan_id}", external_ref: "E3", full_name: "Mem Three", tier_code: "INDIVIDUAL", hire_date: "2026-03-01T00:00:00Z", id: "11111111-1111-4111-8111-111111111111", version: 99 }, as: BenefitsAdmin, captures: { m_id: $.data.id, m_v: $.data.version } }
          assert:
            - "Member.id != 11111111-1111-4111-8111-111111111111 (server-minted)"
            - "Member.version == 1 (client 99 ignored)"

      - name: funding_entry_append_only_ledger
        claim_type: immutability
        grounds: [entities.FundingEntry, calculations.calc_funding_reconciliation]
        distinguishing_aspect: "FundingEntry has no update/delete endpoint; the opening deposit appears as a single DEPOSIT entry whose running_available_cents equals the deposit."
        test_recipe:
          setup: ["employer exists"]
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/funding-accounts", payload: { employer_id: "${emp_id}", benefit_year: 2026, initial_deposit_cents: 50000 }, as: BenefitsAdmin, captures: { fund_id: $.data.id } }
          trigger:
            - { call: "GET /api/funding-accounts/${fund_id}/entries", payload: {}, as: BenefitsAdmin, captures: { e0_type: "$.data[0].entry_type", e0_run: "$.data[0].running_available_cents", e0_amt: "$.data[0].amount_cents" } }
          assert:
            - "exactly 1 entry; entry_type == DEPOSIT; amount_cents == 50000; running_available_cents == 50000"

      - name: put_tiers_duplicate_tier_code_rejected
        claim_type: type_constraints
        grounds: ["errors[ERR_DUPLICATE_TIER_CODE]", entities.PlanTier]
        distinguishing_aspect: "A tiers payload repeating tier_code INDIVIDUAL is rejected before any tier row is written."
        test_recipe:
          setup: ["plan in DRAFT"]
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Standard", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
          trigger:
            - { call: "PUT /api/benefit-plans/${plan_id}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 }, { tier_code: "INDIVIDUAL", annual_allowance_cents: 99999, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${plan_v}" }, as: BenefitsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_TIER_CODE; plan has 0 tiers afterwards (GET tiers returns empty list)"

  - section: state_machines
    instances:
      - name: claim_approve_from_submitted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Claim, "errors[ERR_CLAIM_NOT_REVIEWABLE]"]
        distinguishing_aspect: "Approve from SUBMITTED (skipping start-review) is an invalid-from transition; no reservation or hold changes occur."
        test_recipe:
          setup: ["standard fixture; claim SUBMITTED 1000"]
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Standard", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
            - { call: "PUT /api/benefit-plans/${plan_id}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${plan_v}" }, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans/${plan_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/providers", payload: { name: "GymIn", modality: "GYM", network_tier: "IN_NETWORK", contract_start: "2026-01-01T00:00:00Z", contract_end: "2026-12-31T23:59:59Z", visit_rate_cents: 1500 }, as: BenefitsAdmin, captures: { prov_id: $.data.id } }
            - { call: "POST /api/providers/${prov_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/members", payload: { employer_id: "${emp_id}", plan_id: "${plan_id}", external_ref: "E1", full_name: "Mem One", tier_code: "INDIVIDUAL", hire_date: "2026-03-01T00:00:00Z" }, as: BenefitsAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/enrollments", payload: { member_id: "${m_id}", plan_id: "${plan_id}" }, as: BenefitsAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /api/claims", payload: { enrollment_id: "${enr_id}", claim_type: "REIMBURSEMENT", service_date: "2026-05-02T10:00:00Z", receipt_ref: "R-1", line_items: [ { description: "gym", unit_amount_cents: 1000, quantity: 1, tax_pct: 0.0 } ] }, as: Member, as_user_id: "${m_id}", captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /api/claims/${c_id}/approve", payload: {}, as: ClaimsReviewer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLAIM_NOT_REVIEWABLE; review_status remains SUBMITTED"

      - name: statement_reopen_delivered_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Statement, "errors[ERR_STATEMENT_LOCKED]"]
        distinguishing_aspect: "DELIVERED is terminal: reopen on a delivered statement fails and finalized totals are untouched."
        test_recipe:
          setup: ["standard fixture; statement finalized then delivered"]
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Standard", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
            - { call: "PUT /api/benefit-plans/${plan_id}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${plan_v}" }, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans/${plan_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/members", payload: { employer_id: "${emp_id}", plan_id: "${plan_id}", external_ref: "E1", full_name: "Mem One", tier_code: "INDIVIDUAL", hire_date: "2026-03-01T00:00:00Z" }, as: BenefitsAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/statements", payload: { member_id: "${m_id}", period_yyyymm: "2026-05" }, as: BenefitsAdmin, captures: { st_id: $.data.id } }
            - { call: "POST /api/statements/${st_id}/finalize", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/statements/${st_id}/deliver", payload: {}, as: BenefitsAdmin }
          trigger:
            - { call: "POST /api/statements/${st_id}/reopen", payload: { reason: "too late" }, as: BenefitsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STATEMENT_LOCKED; status remains DELIVERED"

      - name: visit_created_in_recorded_initial_state
        claim_type: initial_state
        grounds: [state_machines.Visit]
        distinguishing_aspect: "A newly recorded visit starts RECORDED with a provisional fraud_score and computed duration_minutes."
        test_recipe:
          setup: ["standard fixture"]
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Standard", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
            - { call: "PUT /api/benefit-plans/${plan_id}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${plan_v}" }, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans/${plan_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/providers", payload: { name: "GymIn", modality: "GYM", network_tier: "IN_NETWORK", contract_start: "2026-01-01T00:00:00Z", contract_end: "2026-12-31T23:59:59Z", visit_rate_cents: 1500 }, as: BenefitsAdmin, captures: { prov_id: $.data.id } }
            - { call: "POST /api/providers/${prov_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/members", payload: { employer_id: "${emp_id}", plan_id: "${plan_id}", external_ref: "E1", full_name: "Mem One", tier_code: "INDIVIDUAL", hire_date: "2026-03-01T00:00:00Z" }, as: BenefitsAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/enrollments", payload: { member_id: "${m_id}", plan_id: "${plan_id}" }, as: BenefitsAdmin, captures: { enr_id: $.data.id } }
          trigger:
            - { call: "POST /api/visits", payload: { enrollment_id: "${enr_id}", member_id: "${m_id}", check_in_at: "2026-05-02T08:00:00Z", check_out_at: "2026-05-02T09:30:00Z", verification_method: "GEO_FENCE" }, as: ProviderOperator, as_user_id: "${prov_id}", captures: { v_status: $.data.status, v_score: $.data.fraud_score, v_dur: $.data.duration_minutes } }
          assert:
            - "Visit.status == RECORDED; duration_minutes == 90; fraud_score == 0 (single GEO_FENCE visit)"

      - name: member_reinstate_terminated_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Member, "errors[ERR_MEMBER_TERMINATED]"]
        distinguishing_aspect: "TERMINATED is terminal for members; reinstate is rejected."
        test_recipe:
          setup: ["standard fixture; member terminated"]
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Standard", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
            - { call: "PUT /api/benefit-plans/${plan_id}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${plan_v}" }, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans/${plan_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/members", payload: { employer_id: "${emp_id}", plan_id: "${plan_id}", external_ref: "E1", full_name: "Mem One", tier_code: "INDIVIDUAL", hire_date: "2026-03-01T00:00:00Z" }, as: BenefitsAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/members/${m_id}/terminate", payload: {}, as: BenefitsAdmin }
          trigger:
            - { call: "POST /api/members/${m_id}/reinstate", payload: {}, as: BenefitsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MEMBER_TERMINATED"

      - name: dependent_deactivate_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.Dependent, "errors[ERR_DEPENDENT_INACTIVE]"]
        distinguishing_aspect: "Second deactivate on an INACTIVE dependent fails; the first deactivation's allowance recompute is not applied twice."
        test_recipe:
          setup: ["standard fixture; SPOUSE dependent added and deactivated once"]
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Standard", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
            - { call: "PUT /api/benefit-plans/${plan_id}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${plan_v}" }, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans/${plan_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/members", payload: { employer_id: "${emp_id}", plan_id: "${plan_id}", external_ref: "E1", full_name: "Mem One", tier_code: "INDIVIDUAL", hire_date: "2026-03-01T00:00:00Z" }, as: BenefitsAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/members/${m_id}/dependents", payload: { full_name: "Spouse One", relationship: "SPOUSE", birth_date: "1990-06-01T00:00:00Z" }, as: BenefitsAdmin, captures: { dep_id: $.data.id } }
            - { call: "POST /api/dependents/${dep_id}/deactivate", payload: {}, as: BenefitsAdmin }
          trigger:
            - { call: "POST /api/dependents/${dep_id}/deactivate", payload: {}, as: BenefitsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DEPENDENT_INACTIVE"

      - name: provider_terminate_cascades_visits_and_claims
        claim_type: cascade_down
        grounds: [state_machines.Provider.ACTIVE_to_TERMINATED]
        distinguishing_aspect: "Provider termination rejects its RECORDED visits; the visit rejections force SUBMITTED claims at that provider into REJECTED and release their reservations."
        test_recipe:
          setup: ["standard fixture; one RECORDED visit; one SUBMITTED claim 1000 created by the same provider as DIRECT_PAY"]
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Standard", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
            - { call: "PUT /api/benefit-plans/${plan_id}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${plan_v}" }, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans/${plan_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/providers", payload: { name: "GymIn", modality: "GYM", network_tier: "IN_NETWORK", contract_start: "2026-01-01T00:00:00Z", contract_end: "2026-12-31T23:59:59Z", visit_rate_cents: 1500 }, as: BenefitsAdmin, captures: { prov_id: $.data.id } }
            - { call: "POST /api/providers/${prov_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/members", payload: { employer_id: "${emp_id}", plan_id: "${plan_id}", external_ref: "E1", full_name: "Mem One", tier_code: "INDIVIDUAL", hire_date: "2026-03-01T00:00:00Z" }, as: BenefitsAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/enrollments", payload: { member_id: "${m_id}", plan_id: "${plan_id}" }, as: BenefitsAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /api/visits", payload: { enrollment_id: "${enr_id}", member_id: "${m_id}", check_in_at: "2026-05-02T08:00:00Z", check_out_at: "2026-05-02T09:00:00Z", verification_method: "GEO_FENCE" }, as: ProviderOperator, as_user_id: "${prov_id}", captures: { v1: $.data.id } }
            - { call: "POST /api/claims", payload: { enrollment_id: "${enr_id}", claim_type: "DIRECT_PAY", service_date: "2026-05-02T10:00:00Z", receipt_ref: "R-DP", line_items: [ { description: "visit fee", unit_amount_cents: 1000, quantity: 1, tax_pct: 0.0 } ], member_id: "${m_id}" }, as: ProviderOperator, as_user_id: "${prov_id}", captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /api/providers/${prov_id}/terminate", payload: {}, as: BenefitsAdmin }
            - { call: "GET /api/visits/${v1}", payload: {}, as: BenefitsAdmin, captures: { v_state: $.data.status } }
            - { call: "GET /api/claims/${c_id}", payload: {}, as: BenefitsAdmin, captures: { c_state: $.data.review_status } }
            - { call: "GET /api/enrollments/${enr_id}/allowance", payload: {}, as: BenefitsAdmin, captures: { enr_res: $.data.reserved_cents } }
          assert:
            - "Visit.${v1}.status == REJECTED (cascade link 1)"
            - "Claim.${c_id}.review_status == REJECTED (cascade link 2)"
            - "Enrollment reserved_cents == 0 (cascade link 3)"
  - section: calculations
    instances:
      - name: visit_frequency_cap_ninth_rejected
        claim_type: correct_result
