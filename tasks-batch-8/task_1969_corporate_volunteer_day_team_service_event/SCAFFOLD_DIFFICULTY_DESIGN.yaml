          (a different endpoint and metric from the supervision ratio): PER_VERIFIED_HOUR rate
          500 with cap 3000 and exactly 6.0 verified hours yields base 500 x 6.0 = 3000 == cap;
          min(base, cap) must return exactly 3000 — the cap is inclusive at equality.
