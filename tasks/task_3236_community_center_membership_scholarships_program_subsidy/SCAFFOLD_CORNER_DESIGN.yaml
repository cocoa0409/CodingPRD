  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations.priority_1
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request with no X-User-Role header is rejected 401 ERR_UNAUTHENTICATED before any existence or schema check runs."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /branches"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 401 with error_id ERR_UNAUTHENTICATED"

      - name: duplicate_member_email_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_9
          - errors.ERR_DUPLICATE_EMAIL
        distinguishing_aspect: "Member email is unique across the association; a second POST /members with the same email fails 409 ERR_DUPLICATE_EMAIL even for a different home branch."
        test_recipe:
          setup:
            - "Association with two branches; one member registered with email dup@x.com."
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { b1: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "UP", name: "Uptown", branch_goal_cents: 500000 }
              as: AssociationAdmin
              captures: { b2: $.data.id }
            - call: "POST /members"
              payload: { full_name: "First User", email: "dup@x.com", birth_date: "1990-01-01", home_branch_id: "${b1}" }
              as: FrontDesk
          trigger:
            - call: "POST /members"
              payload: { full_name: "Second User", email: "dup@x.com", birth_date: "1995-05-05", home_branch_id: "${b2}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id ERR_DUPLICATE_EMAIL"

      - name: scholarship_submit_without_documentation_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_6
          - errors.ERR_DOCUMENTATION_MISSING
        distinguishing_aspect: "An application whose documentation array is empty fails 400 ERR_DOCUMENTATION_MISSING at schema-validation priority, before any fiscal check."
        test_recipe:
          setup:
            - "Association, branch, category, member, ACTIVE membership."
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /categories"
              payload: { branch_id: "${branch_id}", name: "Adult", household_type: "ADULT", joining_fee_cents: 0, monthly_dues_cents: 8000, max_adults: 1, max_dependents: 0 }
              as: BranchDirector
              captures: { cat_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Pat Applicant", email: "pat@x.com", birth_date: "1990-04-01", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /memberships"
              payload: { branch_id: "${branch_id}", category_id: "${cat_id}", primary_member_id: "${member_id}", member_ids: ["${member_id}"] }
              as: FrontDesk
              captures: { mship_id: $.data.id }
          trigger:
            - call: "POST /scholarship-applications"
              payload: { branch_id: "${branch_id}", membership_id: "${mship_id}", applicant_member_id: "${member_id}", household_size: 2, annual_income_cents: 1500000, documentation: [] }
              as: Member
              as_user_id: "${member_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 with error_id ERR_DOCUMENTATION_MISSING"
            - "GET /scholarship-applications?membership_id=${mship_id} returns an empty list"

      - name: household_cap_exceeded_blocks_family_join
        claim_type: violation_to_error
        grounds:
          - validations.priority_6
          - errors.ERR_HOUSEHOLD_CAP_EXCEEDED
        distinguishing_aspect: "A TWO_ADULT category (max_adults 2, max_dependents 0) rejects a member_ids list containing an adult and a child — the child's age is derived from birth_date at join time."
        test_recipe:
          setup:
            - "Branch, TWO_ADULT category, adult member (1990) and child member (2020)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /categories"
              payload: { branch_id: "${branch_id}", name: "Two Adult", household_type: "TWO_ADULT", joining_fee_cents: 5000, monthly_dues_cents: 12000, max_adults: 2, max_dependents: 0 }
              as: BranchDirector
              captures: { cat_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Adult A", email: "a@x.com", birth_date: "1990-01-01", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { adult: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Kid K", email: "k@x.com", birth_date: "2020-06-01", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { kid: $.data.id }
          trigger:
            - call: "POST /memberships"
              payload: { branch_id: "${branch_id}", category_id: "${cat_id}", primary_member_id: "${adult}", member_ids: ["${adult}", "${kid}"] }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 with error_id ERR_HOUSEHOLD_CAP_EXCEEDED (1 dependent > max_dependents 0)"
            - "no membership row is created"

      - name: hold_shorter_than_30_days_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_8
          - errors.ERR_HOLD_WINDOW_INVALID
        distinguishing_aspect: "A hold request of 20 days fails ERR_HOLD_WINDOW_INVALID; the 30-day minimum and 180-day maximum are both enforced (a 200-day request fails the same error)."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Member with ACTIVE membership."
          setup_api_calls:
