              as: RetailLead
            - call: "POST /retail-ops/clearance-schedules"
              payload: { location_id: "${loc_id}", item_id: "${item_id}", start_date: "2026-09-01T00:00:00Z", end_date: "2026-10-01T00:00:00Z", expected_item_version: "${item_v}" }
              as: BoutiqueManager
              captures: { cs_id: $.data.id }
            - call: "POST /retail-ops/clearance-schedules/${cs_id}/activate"
              payload: {}
              as: BoutiqueManager
