              as: StoreAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/${s}/rebate-programs"
              payload: { name: "W", week_start_date: "2026-09-07", week_end_date: "2026-09-14" }
              as: StoreAdmin
              captures: { p: $.data.id }
            - call: "POST /stores/${s}/rebate-programs/${p}/items"
              payload: { sku: "AAA", rebate_pct: 0.1 }
              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-programs/${p}/activate"
              payload: {}
              as: StoreAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T12:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores/${s}/credit-accounts"
              payload: { owner_name: "Ann", account_type: "RETAIL" }
              as: GuestService
              captures: { ac: $.data.id }
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-CM1", account_id: "${ac}", purchase_at: "2026-09-08T10:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 10000, tender_splits: [ { tender_type: "CASH", amount_cents: 10000 } ] } ] }
              as: GuestService
