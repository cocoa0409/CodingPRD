            - call: "POST /broker-agreements/${agr_l_id}/diligence-actions"
              payload: { action: "ISSUE_RFI", note: "round 2 questions" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /broker-agreements/${agr_l_id}/diligence-actions"
              payload: { action: "RESUME_DILIGENCE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
          trigger:
            - call: "POST /broker-agreements/${agr_l_id}/diligence-actions"
              payload: { action: "ISSUE_RFI", note: "round 3 questions" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /broker-agreements/${agr_l_id}/diligence-actions"
