# =============================================================================
# §1.8 Scaffold Difficulty Design — Community Choir & Ensemble Management
# 9 rules x 2 instances = 18 instances. All chains replay from empty-DB.
# Logical clock default: 2026-08-01T00:00:00Z.
# Standard season payload used below (literal-locked):
#   base_dues_cents 20000, early_bird_pct 0.10, early_bird_cutoff 2026-08-15,
#   dues_due_date 2026-09-01, late_fee_weekly 500, late_fee_cap 2000,
#   scholarship_pool 50000, audition_slot_minutes 30, attendance_threshold 0.75
# Standard enroll chain effect: provisional dues = round(20000*0.9) = 18000
#   (issued 2026-08-01 <= cutoff; payment at 2026-08-01 keeps discount).
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: dues_invoice_provisional_vs_final_after_cutoff
        grounds:
          - calculations.dues_invoice_amount
          - entities.DuesInvoice.fields.provisional_amount_cents
          - entities.DuesInvoice.fields.final_amount_cents
        distinguishing_aspect: |
          Dues-domain dual variant: the SAME invoice yields provisional 18000
          (discount keyed on issued_at) but final 20000 (discount keyed on
          payment received_at) because payment lands after the cutoff.
        test_recipe:
          setup:
            - "Season in OPEN posture; one ENROLLED member in section SOPRANO; invoice not yet issued"
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000, audition_slot_minutes: 30, attendance_threshold: 0.75 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/sections", payload: { season_id: "${s_id}", voice_part: "SOPRANO", target_min: 1, target_max: 2 }, as: ChoirDirector, captures: { sec_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada Alto", email: "ada@x.org" }, as: ChoirDirector, captures: { m_id: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m_id}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector, captures: { a_id: $.data.id } }
            - { call: "POST /v1/auditions/${a_id}/score", payload: { tone_score: 8, pitch_score: 7, sight_score: 9 }, as: ChoirDirector }
            - { call: "POST /v1/auditions/${a_id}/decision", payload: { decision: "ACCEPT", section_id: "${sec_id}" }, as: ChoirDirector }
            - { call: "POST /v1/dues-invoices", payload: { member_id: "${m_id}" }, as: Treasurer, captures: { inv_id: $.data.id } }
          trigger:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: President }
            - { call: "POST /v1/dues-payments", payload: { member_id: "${m_id}", amount_cents: 18000, method: "CARD" }, as: Treasurer }
            - { call: "POST /v1/dues-payments", payload: { member_id: "${m_id}", amount_cents: 2000, method: "CARD" }, as: Treasurer }
            - { call: "GET /v1/dues-invoices/${inv_id}", payload: {}, as: Treasurer }
          assert:
            - "DuesInvoice.${inv_id}.provisional_amount_cents == 18000"
            - "DuesInvoice.${inv_id}.final_amount_cents == 20000"
            - "DuesInvoice.${inv_id}.paid_cents == 20000"
            - "DuesInvoice.${inv_id}.status == PAID"

      - name: tour_cost_share_provisional_vs_final
        grounds:
          - calculations.tour_cost_share
          - entities.TourTrip.fields.provisional_share_cents
          - entities.TourTrip.fields.final_share_cents
        distinguishing_aspect: |
          Tour-logistics domain (not dues): provisional share uses denominator
          min_seats=1 (10000), final share uses denominator confirmed_count=2
          (5000) — same tour cost, two valid numbers.
        test_recipe:
          setup:
            - "Season OPEN; two ACTIVE members with dues paid; tour created with min_seats=1, seat_count=2, cost 10000, registration open"
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000, audition_slot_minutes: 30, attendance_threshold: 0.75 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/sections", payload: { season_id: "${s_id}", voice_part: "SOPRANO", target_min: 1, target_max: 4 }, as: ChoirDirector, captures: { sec_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "M One", email: "m1@x.org" }, as: ChoirDirector, captures: { m1: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m1}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector, captures: { a1: $.data.id } }
            - { call: "POST /v1/auditions/${a1}/score", payload: { tone_score: 8, pitch_score: 7, sight_score: 9 }, as: ChoirDirector }
            - { call: "POST /v1/auditions/${a1}/decision", payload: { decision: "ACCEPT", section_id: "${sec_id}" }, as: ChoirDirector }
            - { call: "POST /v1/dues-invoices", payload: { member_id: "${m1}" }, as: Treasurer }
            - { call: "POST /v1/dues-payments", payload: { member_id: "${m1}", amount_cents: 18000, method: "CARD" }, as: Treasurer }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "M Two", email: "m2@x.org" }, as: ChoirDirector, captures: { m2: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m2}", scheduled_at: "2026-08-02T11:00:00Z" }, as: ChoirDirector, captures: { a2: $.data.id } }
            - { call: "POST /v1/auditions/${a2}/score", payload: { tone_score: 8, pitch_score: 7, sight_score: 9 }, as: ChoirDirector }
            - { call: "POST /v1/auditions/${a2}/decision", payload: { decision: "ACCEPT", section_id: "${sec_id}" }, as: ChoirDirector }
            - { call: "POST /v1/dues-invoices", payload: { member_id: "${m2}" }, as: Treasurer }
            - { call: "POST /v1/dues-payments", payload: { member_id: "${m2}", amount_cents: 18000, method: "CARD" }, as: Treasurer }
            - { call: "POST /v1/tours", payload: { season_id: "${s_id}", name: "Fest", destination: "Reno", departure_at: "2026-12-01T00:00:00Z", return_at: "2026-12-05T00:00:00Z", seat_count: 2, min_seats: 1, transport_lodging_cost_cents: 10000 }, as: President, captures: { t_id: $.data.id } }
            - { call: "POST /v1/tours/${t_id}/transition", payload: { action: "OPEN_REGISTRATION" }, as: President }
            - { call: "POST /v1/tour-registrations", payload: { tour_id: "${t_id}" }, as: Member, as_user_id: "${m1}", captures: { r1: $.data.id } }
            - { call: "POST /v1/tour-registrations", payload: { tour_id: "${t_id}" }, as: Member, as_user_id: "${m2}", captures: { r2: $.data.id } }
            - { call: "POST /v1/tour-registrations/${r1}/confirm", payload: {}, as: Treasurer }
            - { call: "POST /v1/tour-registrations/${r2}/confirm", payload: {}, as: Treasurer }
          trigger:
            - { call: "POST /v1/tours/${t_id}/transition", payload: { action: "LOCK_ROSTER" }, as: President }
            - { call: "GET /v1/tour-registrations/${r1}", payload: {}, as: Treasurer }
          assert:
            - "TourTrip.${t_id}.provisional_share_cents == 10000"
            - "TourTrip.${t_id}.final_share_cents == 5000"
            - "TourRegistration.${r1}.share_charge_cents == 5000"
            - "TourRegistration.${r1}.refund_cents == 5000"
            - "Season.${s_id}.treasury_balance_cents == 46000"

  # ---------------------------------------------------------------- rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: guest_fee_per_line_rounding_order
        grounds:
          - calculations.guest_fee_quote
          - entities.GuestContract.fields.quoted_fee_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: per-line round_half_up then sum yields 40005;
          the alternative sum-then-round yields 40004 — the scaffold pins per-line.
        test_recipe:
          setup:
            - "Season in OPEN posture (no sections needed); no members required"
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
          trigger:
            - { call: "POST /v1/guest-contracts", payload: { season_id: "${s_id}", musician_name: "Fiddler", service_lines: [ { kind: "REHEARSAL", units: 1.5, rate_cents: 10001 }, { kind: "MASTERCLASS", units: 2.5, rate_cents: 10001 } ], travel_stipend_cents: 0 }, as: ChoirDirector, captures: { gc_id: $.data.id } }
          assert:
            - "GuestContract.${gc_id}.quoted_fee_cents == 40005"
            - "GuestContract.${gc_id}.status == DRAFT"

      - name: attendance_rate_weighted_conditional
        grounds:
          - calculations.attendance_rate
          - entities.Member.fields.attendance_rate
          - state_machines.Rehearsal.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear conditionals: P/L/X/U weights plus
          cancelled-rehearsal exclusion and enrollment-date filter; one LATE and
          one EXCUSED produce 0.5625, and a CANCELLED rehearsal leaves it unchanged.
        test_recipe:
          setup:
            - "Season REHEARSING with one ACTIVE member; 4 rehearsals held (Aug 5/12/19/26) and a 5th cancelled; clock at 2026-08-27"
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/sections", payload: { season_id: "${s_id}", voice_part: "SOPRANO", target_min: 1, target_max: 2 }, as: ChoirDirector, captures: { sec_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada", email: "ada@x.org" }, as: ChoirDirector, captures: { m_id: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m_id}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector, captures: { a_id: $.data.id } }
            - { call: "POST /v1/auditions/${a_id}/score", payload: { tone_score: 8, pitch_score: 7, sight_score: 9 }, as: ChoirDirector }
            - { call: "POST /v1/auditions/${a_id}/decision", payload: { decision: "ACCEPT", section_id: "${sec_id}" }, as: ChoirDirector }
            - { call: "POST /v1/dues-invoices", payload: { member_id: "${m_id}" }, as: Treasurer }
            - { call: "POST /v1/dues-payments", payload: { member_id: "${m_id}", amount_cents: 18000, method: "CARD" }, as: Treasurer }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "REHEARSING" }, as: President }
            - { call: "POST /v1/rehearsals", payload: { season_id: "${s_id}", scheduled_at: "2026-08-05T19:00:00Z" }, as: ChoirDirector, captures: { r1: $.data.id } }
            - { call: "POST /v1/rehearsals", payload: { season_id: "${s_id}", scheduled_at: "2026-08-12T19:00:00Z" }, as: ChoirDirector, captures: { r2: $.data.id } }
            - { call: "POST /v1/rehearsals", payload: { season_id: "${s_id}", scheduled_at: "2026-08-19T19:00:00Z" }, as: ChoirDirector, captures: { r3: $.data.id } }
            - { call: "POST /v1/rehearsals", payload: { season_id: "${s_id}", scheduled_at: "2026-08-26T19:00:00Z" }, as: ChoirDirector, captures: { r4: $.data.id } }
            - { call: "POST /v1/rehearsals", payload: { season_id: "${s_id}", scheduled_at: "2026-08-27T19:00:00Z" }, as: ChoirDirector, captures: { r5: $.data.id } }
            - { call: "POST /v1/rehearsals/${r5}/cancel", payload: {}, as: ChoirDirector }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-27T00:00:00Z" }, as: President }
            - { call: "POST /v1/rehearsals/${r1}/attendance", payload: { records: [ { member_id: "${m_id}", status: "PRESENT" } ] }, as: ChoirDirector }
            - { call: "POST /v1/rehearsals/${r2}/attendance", payload: { records: [ { member_id: "${m_id}", status: "LATE" } ] }, as: ChoirDirector }
            - { call: "POST /v1/rehearsals/${r3}/attendance", payload: { records: [ { member_id: "${m_id}", status: "ABSENT_EXCUSED" } ] }, as: ChoirDirector }
          trigger:
            - { call: "POST /v1/rehearsals/${r4}/attendance", payload: { records: [ { member_id: "${m_id}", status: "ABSENT_UNEXCUSED" } ] }, as: ChoirDirector }
            - { call: "GET /v1/members/${m_id}", payload: {}, as: ChoirDirector }
          assert:
            - "Member.${m_id}.attendance_rate == 0.5625"
            - "Rehearsal.${r5} (CANCELLED) is excluded from the rate input set"

  # ---------------------------------------------------------------- rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: guest_contract_offer_counter_cycle
        grounds:
          - state_machines.GuestContract.OFFERED_to_COUNTERED
          - state_machines.GuestContract.COUNTERED_to_OFFERED
          - concurrency_rules[guest-contract-counter-stale-write]
        distinguishing_aspect: |
          Cyclic machine on GuestContract: OFFERED -> COUNTERED -> OFFERED loops
          with re-quoted fee and counter_count increment (entity domain: contracts).
        test_recipe:
          setup:
            - "Season OPEN; contract drafted with one CONCERT line at 30000"
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/guest-contracts", payload: { season_id: "${s_id}", musician_name: "Cellist", service_lines: [ { kind: "CONCERT", units: 1, rate_cents: 30000 } ], travel_stipend_cents: 0 }, as: ChoirDirector, captures: { gc: $.data.id } }
            - { call: "POST /v1/guest-contracts/${gc}/offer", payload: {}, as: ChoirDirector, captures: { gc_v: $.data.version } }
          trigger:
            - { call: "POST /v1/guest-contracts/${gc}/counter", payload: { expected_guest_contract_version: "${gc_v}", service_lines: [ { kind: "CONCERT", units: 1, rate_cents: 28000 } ] }, as: ChoirDirector }
            - { call: "POST /v1/guest-contracts/${gc}/offer", payload: {}, as: ChoirDirector }
            - { call: "POST /v1/guest-contracts/${gc}/accept", payload: {}, as: ChoirDirector }
          assert:
            - "GuestContract.${gc}.counter_count == 1"
            - "GuestContract.${gc}.quoted_fee_cents == 28000"
            - "GuestContract.${gc}.status == ACCEPTED"

      - name: member_probation_cycle
        grounds:
          - state_machines.Member.ACTIVE_to_PROBATION
          - state_machines.Member.PROBATION_to_ACTIVE
          - calculations.attendance_rate
        distinguishing_aspect: |
          Cyclic machine on Member (different entity than GuestContract):
          ACTIVE -> PROBATION at rate 0.60, then excuse-driven rate 0.90 returns
          PROBATION -> ACTIVE via two checkpoints.
        test_recipe:
          setup:
            - "Season REHEARSING; one ACTIVE member; 5 rehearsals held Aug 5 - Sep 2; clock 2026-09-03; records P,P,P,U,U"
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/sections", payload: { season_id: "${s_id}", voice_part: "SOPRANO", target_min: 1, target_max: 2 }, as: ChoirDirector, captures: { sec_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada", email: "ada@x.org" }, as: ChoirDirector, captures: { m_id: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m_id}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector, captures: { a_id: $.data.id } }
            - { call: "POST /v1/auditions/${a_id}/score", payload: { tone_score: 8, pitch_score: 7, sight_score: 9 }, as: ChoirDirector }
            - { call: "POST /v1/auditions/${a_id}/decision", payload: { decision: "ACCEPT", section_id: "${sec_id}" }, as: ChoirDirector }
            - { call: "POST /v1/dues-invoices", payload: { member_id: "${m_id}" }, as: Treasurer }
            - { call: "POST /v1/dues-payments", payload: { member_id: "${m_id}", amount_cents: 18000, method: "CARD" }, as: Treasurer }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "REHEARSING" }, as: President, captures: { sv: $.data.version } }
            - { call: "POST /v1/rehearsals", payload: { season_id: "${s_id}", scheduled_at: "2026-08-05T19:00:00Z" }, as: ChoirDirector, captures: { r1: $.data.id } }
            - { call: "POST /v1/rehearsals", payload: { season_id: "${s_id}", scheduled_at: "2026-08-12T19:00:00Z" }, as: ChoirDirector, captures: { r2: $.data.id } }
            - { call: "POST /v1/rehearsals", payload: { season_id: "${s_id}", scheduled_at: "2026-08-19T19:00:00Z" }, as: ChoirDirector, captures: { r3: $.data.id } }
            - { call: "POST /v1/rehearsals", payload: { season_id: "${s_id}", scheduled_at: "2026-08-26T19:00:00Z" }, as: ChoirDirector, captures: { r4: $.data.id } }
            - { call: "POST /v1/rehearsals", payload: { season_id: "${s_id}", scheduled_at: "2026-09-02T19:00:00Z" }, as: ChoirDirector, captures: { r5: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: President }
            - { call: "POST /v1/rehearsals/${r1}/attendance", payload: { records: [ { member_id: "${m_id}", status: "PRESENT" } ] }, as: ChoirDirector }
            - { call: "POST /v1/rehearsals/${r2}/attendance", payload: { records: [ { member_id: "${m_id}", status: "PRESENT" } ] }, as: ChoirDirector }
            - { call: "POST /v1/rehearsals/${r3}/attendance", payload: { records: [ { member_id: "${m_id}", status: "PRESENT" } ] }, as: ChoirDirector }
            - { call: "POST /v1/rehearsals/${r4}/attendance", payload: { records: [ { member_id: "${m_id}", status: "ABSENT_UNEXCUSED" } ] }, as: ChoirDirector }
            - { call: "POST /v1/rehearsals/${r5}/attendance", payload: { records: [ { member_id: "${m_id}", status: "ABSENT_UNEXCUSED" } ] }, as: ChoirDirector }
          trigger:
            - { call: "POST /v1/seasons/${s_id}/checkpoint", payload: { expected_season_version: "${sv}" }, as: President, captures: { sv2: $.data.version } }
            - { call: "GET /v1/members/${m_id}", payload: {}, as: ChoirDirector, captures: { dummy: $.data.status } }
            - { call: "GET /v1/attendance-records?rehearsal_id=${r4}&member_id=${m_id}", payload: { rehearsal_id: "${r4}", member_id: "${m_id}" }, as: ChoirDirector, captures: { ar4: "$.data[0].id" } }
            - { call: "GET /v1/attendance-records?rehearsal_id=${r5}&member_id=${m_id}", payload: { rehearsal_id: "${r5}", member_id: "${m_id}" }, as: ChoirDirector, captures: { ar5: "$.data[0].id" } }
            - { call: "POST /v1/attendance-records/${ar4}/excuse", payload: {}, as: ChoirDirector }
            - { call: "POST /v1/attendance-records/${ar5}/excuse", payload: {}, as: ChoirDirector }
            - { call: "POST /v1/seasons/${s_id}/checkpoint", payload: { expected_season_version: "${sv2}" }, as: President }
            - { call: "GET /v1/members/${m_id}", payload: {}, as: ChoirDirector }
          assert:
            - "After first checkpoint: Member.${m_id}.status == PROBATION (rate 0.60 < 0.75)"
            - "After excusals: Member.${m_id}.attendance_rate == 0.90"
            - "After second checkpoint: Member.${m_id}.status == ACTIVE (cycle completed)"

  # ---------------------------------------------------------------- rule 4
  - rule_id: transitive_cascade
    instances:
      - name: concert_cancel_depth3_cascade
        grounds:
          - state_machines.Concert.VENUE_BOOKED_to_CANCELLED
          - state_machines.ProgramPiece.CONFIRMED_to_VOID
          - state_machines.GuestContract.ACCEPTED_to_CANCELLED
          - calculations.treasury_balance
        distinguishing_aspect: |
          Depth-3 chain: concert CANCEL -> piece VOID -> linked contract CANCELLED
          -> cancellation fee (6000) debits treasury; plus booking RELEASE ->
          deposit refund. Trigger: concert transition (not member drop).
        test_recipe:
          setup:
            - "Season REHEARSING; ACTIVE member paid dues 18000 (treasury 18000); venue+concert; booking CONFIRMED (deposit 10000); contract ACCEPTED (quoted 30000); piece CONFIRMED linked to contract"
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/sections", payload: { season_id: "${s_id}", voice_part: "SOPRANO", target_min: 1, target_max: 2 }, as: ChoirDirector, captures: { sec_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada", email: "ada@x.org" }, as: ChoirDirector, captures: { m_id: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m_id}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector, captures: { a_id: $.data.id } }
            - { call: "POST /v1/auditions/${a_id}/score", payload: { tone_score: 8, pitch_score: 7, sight_score: 9 }, as: ChoirDirector }
            - { call: "POST /v1/auditions/${a_id}/decision", payload: { decision: "ACCEPT", section_id: "${sec_id}" }, as: ChoirDirector }
            - { call: "POST /v1/dues-invoices", payload: { member_id: "${m_id}" }, as: Treasurer }
            - { call: "POST /v1/dues-payments", payload: { member_id: "${m_id}", amount_cents: 18000, method: "CARD" }, as: Treasurer }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "REHEARSING" }, as: President }
