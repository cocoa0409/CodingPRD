          - validations.p8[POST /cycle-loads/{id}/inspection -> ERR_LOAD_ALREADY_INSPECTED]
        distinguishing_aspect: "Inspection is one-shot: a second sample cannot re-open a load that already reads INSPECTED, so the 3000 ppm result and its single 6788-cent chargeback line stand."
