  # ========================================================== validations ====
  - section: validations
    instances:
      - name: val_missing_auth_header_returns_401
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "a request without X-User-Role/X-User-ID is rejected 401 before any role, existence, or body check."
        test_recipe:
          setup: ["empty database; the trigger sends NO auth headers"]
          setup_api_calls: []
          trigger:
            - { call: "GET /project-orders", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and http status 401"

      - name: val_existence_beats_body_validation_returns_404
        claim_type: priority_ordering
        grounds:
          - "validations[priority=3]"
          - "validations[priority=5]"
          - "errors[ERR_ORDER_NOT_FOUND]"
        distinguishing_aspect: "on POST /project-orders/{unknownId}/submit with an empty body, the path-existence check (priority 3) fires before body-shape validation (priority 5): 404 ERR_ORDER_NOT_FOUND, not 400."
        test_recipe:
          setup: ["dealer exists (authenticated caller)"]
          setup_api_calls:
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
          trigger:
            - { call: "POST /project-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/submit", payload: {}, as: DealerRep, as_user_id: "${dlr_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_ORDER_NOT_FOUND and http status 404 (missing expected_order_version body field must NOT surface as 400 first)"

      - name: val_occ_beats_state_on_submit_returns_412
        claim_type: priority_ordering
        grounds:
          - "validations[priority=7]"
          - "validations[priority=8]"
          - "concurrency_rules[order-submit-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "a stale expected_order_version (current minus one) on an ACKNOWLEDGED order returns 412 ERR_STALE_VERSION; the OCC precondition at priority 7 fires before the state check at priority 8."
        test_recipe:
          setup: ["order acknowledged (version 3: create 1, submit 2, acknowledge 3)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
