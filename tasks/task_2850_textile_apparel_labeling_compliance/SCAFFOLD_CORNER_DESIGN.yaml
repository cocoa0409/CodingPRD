          rationale: "That §1.8 instance triggers ERR_LAB_BENCH_CAPACITY at the closed endpoints of the occupancy interval, and its sibling resource_temporal_overlap / published_label_windows_are_half_open_so_touching_windows_are_allowed triggers ERR_LABEL_WINDOW_OVERLAP against the half-open publication window."

