        grounds:
          - roles.PayrollPreparer
          - roles.ComplianceOfficer
          - errors[ERR_FORBIDDEN]
          - endpoints.POST_/garnishment-orders
        distinguishing_aspect: "POST /garnishment-orders by PayrollPreparer is rejected; only ComplianceOfficer can create garnishments. Demonstrates peer-role boundary (Payroll vs Compliance)."
        test_recipe:
          setup:
