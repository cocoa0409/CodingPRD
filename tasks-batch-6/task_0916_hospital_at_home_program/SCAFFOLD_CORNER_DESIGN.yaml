              captures: { ref_cn: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_cn}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: false, assessor_user_id: "phys-1" }
