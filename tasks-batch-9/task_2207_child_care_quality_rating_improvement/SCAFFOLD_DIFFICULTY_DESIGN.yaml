      - name: cycle_expiry_four_hop_provider_allocation_grant_leaf_chain
        grounds:
          - state_machines.RatingCycle.ACTIVE_to_EXPIRED
          - state_machines.ImprovementGrant.OPEN_to_FROZEN
          - entities.Provider.fields.current_tier
          - entities.Provider.fields.public_listing_visible
          - calculations.coaching_allocation_cost
          - entities.CoachingAllocation.fields.remaining_hours
          - entities.GrantExpenditure.fields.status
        distinguishing_aspect: |
          Triggering transition is RatingCycle ACTIVE -> EXPIRED fired by POST
          /qris/expiry-runs — a different trigger from the appeal-sustain chain — and the
          chain runs 4 hops deep: cycle EXPIRED (hop 1) causes the Provider to lose
          current_tier (hop 2), which causes CoachingAllocation ACTIVE -> SUSPENDED and
          ImprovementGrant OPEN -> FROZEN (hop 3), which in turn causes CoachingSession
          SCHEDULED -> CANCELLED with 4.0 hours returned and GrantExpenditure SUBMITTED ->
          VOIDED with 300000 cents returned (hop 4); the expiry run names none of the
          hop-4 rows.
        test_recipe:
          setup:
            - "Logical clock starts at the 2026-08-01T00:00:00Z default."
            - "All 5 StandardDomain rows exist with weights 0.30/0.25/0.20/0.15/0.10; LEARNING_ENVIRONMENT is observation_linked with min_composite_for_block 4.00."
            - "Provider H (URBAN, active_staff_fte 2.00, one DIRECTOR level 4 at 1.00 FTE and one ASSISTANT level 1 at 0.20 FTE both VERIFIED until 2029-12-31, so credential_compliance_pct == 60.00)."
            - "Single-observer visit with all six lead subscales at 4 gives composite 4.00; FINAL award on 2026-08-10 yields weighted_total 50.00, highest_block_cleared 3 and awarded_tier 2, hence validity_months 24, effective_date 2026-09-01 and expires_on 2028-08-31T23:59:59.999Z."
            - "Cycle promoted to ACTIVE by the 2026-09-05 expiry run and PUBLISHED; Provider.current_tier == 2."
            - "ImprovementGrant of 1000000 cents with spend_deadline 2029-06-30 is ACCEPTED (status OPEN) — the deadline is deliberately far in the future so the later FROZEN transition can only be attributed to the cycle leaving ACTIVE."
            - "CoachingAllocation funded by that grant: allocated_hours 20.0 at 9000 cents/hour, so base_hours_cost_cents 180000, admin_fee_cents 16200, total_cost_cents 196200 and spend_cap_cents 750000; provider accepted it, so status ACTIVE."
            - "One GrantExpenditure of 300000 cents (EQUIPMENT, invoice_date 2026-09-10) sits in SUBMITTED, so committed_cents 300000 and available_cents 700000."
            - "One CoachingSession scheduled 2028-09-10T09:00:00Z to 2028-09-10T13:00:00Z (4.0 hours) sits in SCHEDULED, so allocation.scheduled_hours 4.0 and remaining_hours 16.0."
            - "Clock advanced to 2028-09-02T00:00:00Z, strictly after the inclusive expires_on."
          setup_api_calls:
