  - rule_id: priority_pair_validation_conflict
    instances:
      - name: frozen_posture_outranks_exposure_budget_on_contact_log
        grounds:
          - validations[priority=11]
          - validations[priority=26]
          - errors[ERR_BUSINESS_UNIT_FROZEN]
          - errors[ERR_EXPOSURE_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair STATE (priority 11, ERR_BUSINESS_UNIT_FROZEN)
          versus BUSINESS_FISCAL (priority 26, ERR_EXPOSURE_BUDGET_EXCEEDED).
          Both are violated by one contact-log request; the state gate must win
          and the response must be 409 ERR_BUSINESS_UNIT_FROZEN, not 422.
        test_recipe:
