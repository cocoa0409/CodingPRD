      - name: sequence_index_reused_on_the_same_route_returns_sequence_index_taken
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - entities.RouteSegment.fields.sequence_index
        distinguishing_aspect: "Uniqueness is scoped to route_id, so a second segment with sequence_index 1 on the same route is refused with 409 while sequence_index 1 on a different route is accepted."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "two Routes in PLANNING: 'Harbor Loop' with one RouteSegment at sequence_index 1, and 'Inland Spur' with no segments"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_a: $.data.id }
            - call: "POST /routes"
              payload: { name: "Inland Spur", topology_objective: "SPUR", target_in_service_date: "2027-06-01", budget_authorized_cents: 90000000 }
              as: RouteEngineer
              captures: { route_b: $.data.id }
