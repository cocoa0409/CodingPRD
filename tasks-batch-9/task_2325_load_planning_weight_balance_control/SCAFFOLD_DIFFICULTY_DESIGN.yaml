  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: performance_limited_weight_nonlinear_penalty_stack
        mode: a
        grounds:
          - calculations.calculate_performance_limited_takeoff_weight
          - calculations.calculate_allowed_payload
          - entities.PerformanceBand.fields.base_limit_weight_kg
          - entities.Flight.fields.limiting_factor
        distinguishing_aspect: |
          Mode (a): seven inputs interact non-linearly — a band is SELECTED by a
          half-open temperature interval, the temperature penalty is
          max(0, t - band.temp_lo_c) measured from the SELECTED band's own floor,
          the wind credit is min-capped at 900 kg, the contamination factor
          multiplies the whole bracket, the result is floored to a 10 kg step, and
          the payload is then the nested min of five candidate limits with a fixed
          precedence tie-break. Because the penalty resets at each band floor the
          function is not monotone in temperature in any simple way, and the
          limiting_factor flips from MZFW to PERFORMANCE mid-sequence.
        test_recipe:
          setup:
            - "Aircraft HB-AAA (B738), runway LSGG/04 at 1411 ft with three non-overlapping B738 bands: [-10,15) 79000 kg, [15,30) 74500 kg, [30,45) 69800 kg."
            - "One flight with crew 1150 kg at 13.500 m (dry_operating_weight_kg 42550, dry_operating_index 62.53), ramp 9800 / taxi 250 / trip 6900 kg, initially 22 C, 6 kt headwind, DRY."
          setup_api_calls:
            - call: "POST /aircraft"
              payload: { registration: "HB-AAA", type_code: "B738", basic_empty_weight_kg: 41400, basic_index: 66.56, max_takeoff_weight_kg: 79000, max_landing_weight_kg: 66360, max_zero_fuel_weight_kg: 62730, max_taxi_weight_kg: 79200, ref_arm_m: 17.000, lemac_m: 17.000, mac_length_m: 4.200, index_c: 1000, index_k: 50, fuel_arm_m: 17.900, seat_count: 162, zfw_fwd_limit_pct_mac: 6.0, zfw_aft_limit_pct_mac: 30.0, tow_fwd_limit_pct_mac: 5.0, tow_aft_limit_pct_mac: 28.0, tow_knee_weight_kg: 60000, tow_aft_knee_adjust_pct_mac: -1.5 }
              as: LoadControlAdmin
              captures: { ac1: $.data.id }
            - call: "POST /runways"
              payload: { airport_code: "LSGG", designator: "04", elevation_ft: 1411, length_m: 3900, slot_capacity_per_window: 2 }
              as: LoadControlAdmin
              captures: { rw1: $.data.id }
            - call: "POST /performance-bands"
              payload: { runway_id: "${rw1}", aircraft_type_code: "B738", temp_lo_c: -10, temp_hi_c: 15, base_limit_weight_kg: 79000 }
              as: LoadControlAdmin
            - call: "POST /performance-bands"
              payload: { runway_id: "${rw1}", aircraft_type_code: "B738", temp_lo_c: 15, temp_hi_c: 30, base_limit_weight_kg: 74500 }
              as: LoadControlAdmin
            - call: "POST /performance-bands"
              payload: { runway_id: "${rw1}", aircraft_type_code: "B738", temp_lo_c: 30, temp_hi_c: 45, base_limit_weight_kg: 69800 }
              as: LoadControlAdmin
            - call: "POST /weight-programs"
              payload: { code: "STD-2026", program_kind: "STANDARD", male_kg: 88.0, female_kg: 70.0, child_kg: 35.0, infant_kg: 10.0, checked_bag_kg: 13.0, documentation_ref: "OM-A 8.1.3 rev 12" }
              as: LoadControlAdmin
              captures: { wp_std: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T06:00:00Z" }
              as: LoadControlAdmin
            - call: "POST /flights"
              payload: { flight_number: "LX1610", aircraft_id: "${ac1}", departure_runway_id: "${rw1}", weight_program_id: "${wp_std}", scheduled_off_block_utc: "2026-08-15T10:00:00Z", scheduled_on_block_utc: "2026-08-15T12:30:00Z", crew_weight_kg: 1150, crew_arm_m: 13.500, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 22, headwind_component_kt: 6, runway_condition: "DRY" }
              as: LoadController
              captures: { f1: $.data.id }
          trigger:
            - call: "PATCH /flights/${f1}/conditions"
              payload: { outside_air_temp_c: 15 }
              as: LoadController
            - call: "PATCH /flights/${f1}/conditions"
              payload: { outside_air_temp_c: 30 }
              as: LoadController
            - call: "PATCH /flights/${f1}/conditions"
              payload: { headwind_component_kt: 12 }
              as: LoadController
            - call: "PATCH /flights/${f1}/conditions"
              payload: { runway_condition: "WET" }
              as: LoadController
          assert:
            - "at creation (22 C, 6 kt, DRY): Flight.${f1}.performance_limited_takeoff_weight_kg == 73810.00"
            - "at creation: Flight.${f1}.allowed_payload_kg == 20180.00"
            - "at creation: Flight.${f1}.limiting_factor == MZFW"
            - "after the 15 C patch: Flight.${f1}.performance_limited_takeoff_weight_kg == 74720.00"
            - "after the 15 C patch: Flight.${f1}.allowed_payload_kg == 20180.00 and limiting_factor == MZFW"
            - "after the 30 C patch: Flight.${f1}.performance_limited_takeoff_weight_kg == 70020.00"
            - "after the 30 C patch: Flight.${f1}.allowed_payload_kg == 17920.00 and limiting_factor == PERFORMANCE"
            - "after the 12 kt patch: Flight.${f1}.performance_limited_takeoff_weight_kg == 70380.00"
            - "after the 12 kt patch: Flight.${f1}.allowed_payload_kg == 18280.00"
            - "after the WET patch: Flight.${f1}.performance_limited_takeoff_weight_kg == 65460.00"
            - "after the WET patch: Flight.${f1}.allowed_payload_kg == 13360.00 and limiting_factor == PERFORMANCE"
            - "Flight.${f1}.version == 5"

      - name: index_rounding_order_per_line_vs_sum
        mode: b
        grounds:
          - calculations.calculate_balance_chain.variants.per_line_then_sum
          - calculations.calculate_balance_chain.variants.sum_then_round
          - entities.LoadPlan.fields.rounding_mode
        distinguishing_aspect: |
          Mode (b): nested rounding whose ORDER changes the answer. One cabin line
          of 4650.00 kg in OC has raw index delta 27.435 and one hold allocation of
          625.00 kg in H5 has raw index delta 7.125. Rounding each line first gives
          27.44 + 7.13 = 34.57 and index_zfw 97.10; summing at full precision first
          gives exactly 34.560 and index_zfw 97.09. The scaffold pins
          PER_LINE_THEN_SUM as the contract default and the divergence propagates
          into mac_zfw_pct (23.45 vs 23.44) and index_tow (105.70 vs 105.69).
        test_recipe:
          setup:
            - "Aircraft HB-AAA with cabin zone OC (arm 22.900) and hold H5 (arm 28.400); one runway with the [15,30) band; STANDARD program."
            - "Two flights on the SAME airframe at non-overlapping times, 10:00-12:30 and 14:00-16:30 UTC, identical crew, fuel and conditions."
            - "Plan A is created without rounding_mode (contract default PER_LINE_THEN_SUM); plan B is created with rounding_mode SUM_THEN_ROUND. Both carry the identical distribution: OC 50 male / 6 child / 4 infant = 4650.00 kg and H5 625.00 kg of bags."
          setup_api_calls:
            - call: "POST /aircraft"
