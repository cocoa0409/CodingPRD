  # ==========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_submit_gated_by_customer_account_status
        grounds:
          - state_machines.Order.DRAFT_to_PENDING_PAYMENT
          - entities.Customer.fields.account_status
          - errors[ERR_ACCOUNT_INACTIVE]
        distinguishing_aspect: |
          Entity pair = Order → Customer. Order's DRAFT → PENDING_PAYMENT
          transition is gated on Customer.account_status == ACTIVE; a SUSPENDED
          customer cannot submit even with valid cart and stock.
        test_recipe:
          setup:
            - "Customer CU14 SUSPENDED (via direct OpsManager action; no OUT_FOR_DELIVERY orders)"
            - "Product P14 available; Order O14 in DRAFT for CU14"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu Fourteen", email: "cu14@x.com", phone: "14", street_address: "14 Pine", postal_code: "20014" }
              as: CustomerService
              captures: { cu14_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "P14", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 10 }
              as: OperationsManager
              captures: { p14_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu14_id}", delivery_street_address: "14 Pine", delivery_postal_code: "20014", requested_delivery_date: "2026-08-15", lines: [{ product_id: "${p14_id}", quantity: 1.0 }] }
              as: CustomerService
              captures: { o14_id: $.data.id }
            - call: "POST /api/v1/customers/${cu14_id}/suspend"
              payload: { reason: "manual review" }
              as: OperationsManager
          trigger:
            - call: "POST /api/v1/orders/${o14_id}/submit"
              payload: {}
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "error_id == ERR_ACCOUNT_INACTIVE (Order submission gated on Customer.account_status)"

      - name: window_lock_gated_by_child_order_payment_status
        grounds:
          - state_machines.DeliveryWindow.OPEN_to_LOCKED
          - entities.Order.fields.payment_status
        distinguishing_aspect: |
          Entity pair = DeliveryWindow → Order (different from Order → Customer).
          Window OPEN → LOCKED requires ALL orders scheduled into it with
          fulfillment_status == SCHEDULED to have payment_status == PAID. One
          unpaid order blocks the window lock.
        test_recipe:
          setup:
            - "Customer CU15, Product P15, Route R15, Window W15 cap 50 OPEN"
            - "Order O15A scheduled into W15 with payment_status == PAID"
            - "Order O15B scheduled into W15 with payment_status == AUTHORIZED (NOT PAID — should not normally happen but constructed here via test-injected state)"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu Fifteen", email: "cu15@x.com", phone: "15", street_address: "15 Cedar", postal_code: "30015" }
              as: CustomerService
              captures: { cu15_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "P15", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 100 }
              as: OperationsManager
              captures: { p15_id: $.data.id }
            - call: "POST /api/v1/delivery-routes"
              payload: { route_code: "R15", depot_name: "South", service_postal_prefixes: ["3"], capacity_cord_equivalent: 100.0 }
              as: RoutePlanner
              captures: { r15_id: $.data.id }
            - call: "POST /api/v1/delivery-windows"
              payload: { route_id: "${r15_id}", service_date: "2026-08-25", start_hour: 8, end_hour: 18, capacity_cord_equivalent: 100.0 }
              as: RoutePlanner
              captures: { w15_id: $.data.id }
            # Order A: fully paid then scheduled
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu15_id}", delivery_street_address: "15 Cedar", delivery_postal_code: "30015", requested_delivery_date: "2026-08-25", lines: [{ product_id: "${p15_id}", quantity: 1.0 }] }
              as: CustomerService
              captures: { o15a_id: $.data.id }
            - call: "POST /api/v1/orders/${o15a_id}/submit"
              payload: {}
              as: CustomerService
            - call: "POST /api/v1/orders/${o15a_id}/payments"
              payload: { event_kind: "CAPTURE", amount_cents: 53500, external_ref: "cap-15a" }
              as: CustomerService
            - call: "GET /api/v1/orders/${o15a_id}"
              payload: {}
              as: RoutePlanner
              captures: { o15a_v: $.data.version }
            - call: "POST /api/v1/orders/${o15a_id}/schedule"
              payload: { delivery_window_id: "${w15_id}", expected_order_version: "${o15a_v}" }
              as: RoutePlanner
            # Order B: only AUTHORIZED (not captured) — but reaches SCHEDULED via OperationsManager override path
            # For test purposes, we model this by creating B, submitting (so PENDING_PAYMENT), capturing partial only.
            # The cross-entity guard fires on lock regardless; we accept that B's fulfillment reaches SCHEDULED only
            # if payment becomes PAID. To exercise the guard, instead approach: try to lock with B in PENDING_PAYMENT
            # scheduled — which is unreachable through pure API. We therefore directly verify the lock precondition
            # by attempting to lock while Order A is still PENDING_PAYMENT (schedule not permitted), demonstrating
            # the guard. Simpler: invert — schedule A as PAID, then BEFORE capturing B's payment, attempt to lock.
            # B will not be SCHEDULED (can't be), so lock succeeds — showing the guard passes vacuously.
            # Realistic negative test: make Order B reach SCHEDULED while PAID, then REFUND B (payment_status becomes
            # PARTIALLY_REFUNDED or REFUNDED) — now lock MUST fail because a SCHEDULED order is not PAID.
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu15_id}", delivery_street_address: "15 Cedar", delivery_postal_code: "30015", requested_delivery_date: "2026-08-25", lines: [{ product_id: "${p15_id}", quantity: 1.0 }] }
              as: CustomerService
              captures: { o15b_id: $.data.id }
            - call: "POST /api/v1/orders/${o15b_id}/submit"
              payload: {}
              as: CustomerService
            - call: "POST /api/v1/orders/${o15b_id}/payments"
              payload: { event_kind: "CAPTURE", amount_cents: 53500, external_ref: "cap-15b" }
              as: CustomerService
            - call: "GET /api/v1/orders/${o15b_id}"
              payload: {}
              as: RoutePlanner
              captures: { o15b_v: $.data.version }
            - call: "POST /api/v1/orders/${o15b_id}/schedule"
              payload: { delivery_window_id: "${w15_id}", expected_order_version: "${o15b_v}" }
              as: RoutePlanner
            # Now refund B partially: payment_status PAID -> PARTIALLY_REFUNDED, fulfillment stays SCHEDULED
            - call: "POST /api/v1/orders/${o15b_id}/payments"
              payload: { event_kind: "REFUND", amount_cents: 10000, external_ref: "rf-15b" }
              as: CustomerService
          trigger:
            - call: "POST /api/v1/delivery-windows/${w15_id}/lock"
              payload: {}
              as: RoutePlanner
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 (lock rejected)"
            - "error_id == ERR_INVALID_STATE (window lock precondition violated: SCHEDULED order B has payment_status == PARTIALLY_REFUNDED, not PAID)"

  # ==========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: delivery_window_half_open_interval_overlap
        grounds:
          - validations[priority=15]
          - errors[ERR_WINDOW_OVERLAP]
          - entities.DeliveryWindow.fields.start_hour
        distinguishing_aspect: |
          Resource = DeliveryWindow on same (route, service_date). Interval
          semantics = half-open [start_hour, end_hour): two windows where
          A.end_hour == B.start_hour are ADJACENT and PERMITTED; strict
          overlap (A.start < B.end AND B.start < A.end) is REJECTED.
        test_recipe:
          setup:
            - "Route R16 with capacity 100"
            - "Window W16a on R16: date 2026-09-10, hours [8, 12)"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/delivery-routes"
              payload: { route_code: "R16", depot_name: "Central", service_postal_prefixes: ["1"], capacity_cord_equivalent: 100.0 }
              as: RoutePlanner
              captures: { r16_id: $.data.id }
            - call: "POST /api/v1/delivery-windows"
              payload: { route_id: "${r16_id}", service_date: "2026-09-10", start_hour: 8, end_hour: 12, capacity_cord_equivalent: 50.0 }
              as: RoutePlanner
              captures: { w16a_id: $.data.id }
          trigger:
            - call: "POST /api/v1/delivery-windows"
              payload: { route_id: "${r16_id}", service_date: "2026-09-10", start_hour: 12, end_hour: 16, capacity_cord_equivalent: 50.0 }
              as: RoutePlanner
              captures: { w16b_id: $.data.id }
            - call: "POST /api/v1/delivery-windows"
              payload: { route_id: "${r16_id}", service_date: "2026-09-10", start_hour: 11, end_hour: 13, capacity_cord_equivalent: 50.0 }
              as: RoutePlanner
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent window [12,16) after [8,12) is ACCEPTED (half-open: 12 not in [8,12))"
            - "Overlapping window [11,13) is REJECTED with ERR_WINDOW_OVERLAP (11 < 12 AND 8 < 13)"

      - name: area_restriction_year_wrapping_enforcement_window
        grounds:
          - entities.AreaRestriction.fields.enforcement_window_start
          - entities.AreaRestriction.fields.enforcement_window_end
          - validations[priority=9]
        distinguishing_aspect: |
          Resource = postal-code zone (different resource entity from DeliveryWindow).
          Interval semantics = YEAR-WRAPPING calendar window: enforcement window
          11-01 through 03-31 must match dates in Nov, Dec, Jan, Feb, Mar (window
          wraps year-end), not just dates where month-day is lexicographically
          between start and end. Different geometric treatment from DeliveryWindow's
          same-day half-open hours.
        test_recipe:
          setup:
            - "AreaRestriction AR17: postal_codes=['55555'], restricted_kinds=['CORD'], enforcement window 11-01 to 03-31 (wraps year-end)"
            - "Customer CU17 with delivery postal 55555"
            - "Product P17 CORD/OAK/KILN_DRIED"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu Seventeen", email: "cu17@x.com", phone: "17", street_address: "17 Willow", postal_code: "55555" }
              as: CustomerService
              captures: { cu17_id: $.data.id }
            - call: "POST /api/v1/area-restrictions"
              payload: { name: "WinterBan", postal_codes: ["55555"], restricted_kinds: ["CORD"], restricted_species: [], enforcement_window_start: "11-01", enforcement_window_end: "03-31" }
              as: OperationsManager
            - call: "POST /api/v1/products"
              payload: { sku: "P17", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 10 }
              as: OperationsManager
              captures: { p17_id: $.data.id }
          trigger:
            # Requested delivery Jan 15 — inside wrapped window
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu17_id}", delivery_street_address: "17 Willow", delivery_postal_code: "55555", requested_delivery_date: "2027-01-15", lines: [{ product_id: "${p17_id}", quantity: 1.0 }] }
              as: CustomerService
              captures: { err_jan: $.data.error_id }
            # Requested delivery Jun 15 — outside wrapped window
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu17_id}", delivery_street_address: "17 Willow", delivery_postal_code: "55555", requested_delivery_date: "2027-06-15", lines: [{ product_id: "${p17_id}", quantity: 1.0 }] }
              as: CustomerService
              captures: { o17_jun: $.data.id }
          assert:
            - "Order with requested_delivery_date=2027-01-15 rejected: error_id == ERR_AREA_RESTRICTED (Jan 15 IS inside Nov-Mar wrapped window)"
            - "Order with requested_delivery_date=2027-06-15 ACCEPTED (Jun 15 outside window)"

  # ==========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: stock_conservation_reserve_then_cancel_releases
        grounds:
          - state_machines.Order.DRAFT_to_PENDING_PAYMENT
          - state_machines.Order.PENDING_PAYMENT_to_CANCELLED
          - entities.Product.fields.available_qty
          - entities.Product.fields.reserved_qty
        distinguishing_aspect: |
          Conserved quantity = Product stock: available_qty + reserved_qty must
          equal initial stock across the reserve-then-cancel cycle. Forward
          action = submit (reserve), compensating action = cancel (release).
          Invariant: before submit, available+reserved == initial; after submit,
          available+reserved == initial; after cancel, available+reserved == initial.
        test_recipe:
          setup:
            - "Customer CU18, Product P18 (available 5.0, reserved 0 initially)"
            - "Order O18 in DRAFT with line quantity 2.5"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu Eighteen", email: "cu18@x.com", phone: "18", street_address: "18 Fir", postal_code: "60018" }
              as: CustomerService
              captures: { cu18_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "P18", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 5.0 }
              as: OperationsManager
              captures: { p18_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu18_id}", delivery_street_address: "18 Fir", delivery_postal_code: "60018", requested_delivery_date: "2026-08-15", lines: [{ product_id: "${p18_id}", quantity: 2.5 }] }
              as: CustomerService
              captures: { o18_id: $.data.id }
          trigger:
            - call: "POST /api/v1/orders/${o18_id}/submit"
              payload: {}
              as: CustomerService
            - call: "GET /api/v1/products/${p18_id}"
              payload: {}
              as: OperationsManager
              captures: { p18_after_submit: $.data }
            - call: "POST /api/v1/orders/${o18_id}/cancel"
              payload: { reason: "changed mind" }
              as: CustomerService
            - call: "GET /api/v1/products/${p18_id}"
              payload: {}
              as: OperationsManager
              captures: { p18_after_cancel: $.data }
          assert:
            - "After submit: available_qty == 2.5 AND reserved_qty == 2.5 AND (available + reserved) == 5.0"
            - "After cancel: available_qty == 5.0 AND reserved_qty == 0.0 AND (available + reserved) == 5.0"
            - "Invariant (available + reserved) == 5.0 holds at every checkpoint"

      - name: invoice_payment_conservation_capture_then_refund_zeros_out
        grounds:
          - state_machines.Invoice.OPEN_to_PAID
          - state_machines.Invoice.PAID_to_REFUNDED
          - entities.Invoice.fields.paid_cents
          - entities.Invoice.fields.refunded_cents
          - entities.Customer.fields.credit_balance_cents
        distinguishing_aspect: |
          Conserved quantity = net cash position on Invoice (paid_cents -
          refunded_cents) paired with customer wallet credit. Forward = CAPTURE
          full amount; compensating = REFUND full amount. Different conserved
          quantity from stock: this is fiscal, not physical.
        test_recipe:
          setup:
            - "Customer CU19 credit_balance_cents = 0 initially"
            - "Order O19 submitted, total_cents = 53500 (1.0 × 40000 × 1.35 KILN_DRIED CORD, no subscription, STANDARD loyalty, off-peak, zone A '10019' -> 4500 + stacking 0 + ... see pricing breakdown)"
            - "Invoice I19 amount = 53500"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu Nineteen", email: "cu19@x.com", phone: "19", street_address: "19 Willow", postal_code: "10019" }
              as: CustomerService
              captures: { cu19_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "P19", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 10 }
              as: OperationsManager
              captures: { p19_id: $.data.id }
            - call: "POST /api/v1/delivery-routes"
              payload: { route_code: "R19", depot_name: "East", service_postal_prefixes: ["10019"], capacity_cord_equivalent: 50.0 }
              as: RoutePlanner
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu19_id}", delivery_street_address: "19 Willow", delivery_postal_code: "10019", requested_delivery_date: "2026-08-15", lines: [{ product_id: "${p19_id}", quantity: 1.0 }] }
              as: CustomerService
              captures: { o19_id: $.data.id, o19_total: $.data.total_cents }
            - call: "POST /api/v1/orders/${o19_id}/submit"
              payload: {}
              as: CustomerService
            - call: "GET /api/v1/invoices"
              payload: { order_id: "${o19_id}" }
              as: CustomerService
              captures: { i19_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/v1/orders/${o19_id}/payments"
              payload: { event_kind: "AUTHORIZE", amount_cents: 49500, external_ref: "auth-19" }
              as: CustomerService
            - call: "POST /api/v1/orders/${o19_id}/payments"
              payload: { event_kind: "CAPTURE", amount_cents: 49500, external_ref: "cap-19" }
              as: CustomerService
            - call: "POST /api/v1/orders/${o19_id}/payments"
              payload: { event_kind: "REFUND", amount_cents: 49500, external_ref: "rf-19" }
              as: CustomerService
            - call: "GET /api/v1/invoices/${i19_id}"
              payload: {}
              as: CustomerService
              captures: { i19_final: $.data }
            - call: "GET /api/v1/customers/${cu19_id}"
              payload: {}
              as: CustomerService
              captures: { cu19_final: $.data }
          assert:
            - "Order total_cents == 49500 (= 40000*1.35=54000 unit; subtotal 54000, volume 0, subscription 0, loyalty 0, seasonal 0, stacking 0, delivery zone A 4500... test pinned: total = 54000 + 4500 = 58500 with delivery_fee; actually assert via ${o19_total})"
            - "Invoice.paid_cents == ${o19_total} AND Invoice.refunded_cents == ${o19_total}"
            - "Invoice.status == REFUNDED"
            - "Invoice.paid_cents - Invoice.refunded_cents == 0 (net cash position zero)"
            - "Customer.credit_balance_cents == ${o19_total} (refund credits wallet) — conservation: money left Invoice, landed in wallet"
            - "Order.payment_status == REFUNDED"
