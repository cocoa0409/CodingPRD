              as: CatalogCurator
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /suppliers/${sup_id}/availability-reports"
              payload: { item_id: "${item_id}", reported_available_units: 40 }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_SUPPLIER_CANDIDATE_EMPTY"
            - "Supplier.${sup_id}.commitment_breach_count == 1 and performance_rating_units == 90 after the call"
            - "GET /suppliers/${sup_id}/availability-reports returns exactly 1 row carrying reported_available_units 40, so the report itself was persisted even though the selection failed"
