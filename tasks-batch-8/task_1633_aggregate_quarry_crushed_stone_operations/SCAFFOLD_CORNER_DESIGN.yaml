            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:01:00Z" }, as: QuarryAdmin }
            - { call: "POST /queue-entries", payload: { site_id: "${site}", truck_id: "TRK-9", priority_class: "CONTRACT", certified_tare_lbs: 28000, max_payload_lbs: 70000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { e2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:02:00Z" }, as: QuarryAdmin }
            - { call: "POST /queue-entries", payload: { site_id: "${site}", truck_id: "TRK-2", priority_class: "CONTRACT", certified_tare_lbs: 28000, max_payload_lbs: 70000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { e3: $.data.id } }
          trigger:
            - { call: "POST /queue-entries/call-next", payload: { site_id: "${site}" }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { pick1: $.data.id } }
            - { call: "POST /queue-entries/call-next", payload: { site_id: "${site}" }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { pick2: $.data.id } }
            - { call: "POST /queue-entries/call-next", payload: { site_id: "${site}" }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { pick3: $.data.id } }
            - { call: "POST /queue-entries/call-next", payload: { site_id: "${site}" }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { err: $.data.error_id } }
          assert:
