# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml  —  §1.9 Scaffold Corner Design
#
# Task 2956 — Physician Practice Acquisition & Integration
#
# Breadth probe over the surface declared in SCAFFOLD.yaml §1.1–§1.7. The nine
# `section:` values and every `claim_type:` value below are taken verbatim from
# references/claim-extraction-guide.md; no categories are invented here.
#
# Corners already asserted by a named instance in SCAFFOLD_DIFFICULTY_DESIGN.yaml
# carry an `excluded_because:` stub and no `test_recipe`.
#
# Shared fixture conventions (identical to §1.8, so the two files compose):
#   * logical clock parked at 2026-08-01T00:00:00Z unless an instance moves it
#   * user ids: dl-1 DealLead, va-1 / va-2 ValuationAnalyst, co-1 / co-2
#     ComplianceOfficer, cd-1 CompensationDesigner, im-1 IntegrationManager,
#     ${phys_id} PracticePhysician (identity: entity_backed:Physician)
#   * a GET /acquisitions/{acquisitionId} immediately precedes every write that
#     carries expected_acquisition_version, because every child write bumps it
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section 1 — Entities (§1.1)
  # ===========================================================================
  - section: entities
    instances:
      - name: acquisition_creation_returns_201_with_ledgers_initialised
        claim_type: Creation
        grounds:
          - endpoints[POST /acquisitions]
          - entities.Acquisition.fields.retention_pool_available_cents
          - entities.Acquisition.fields.escrow_available_cents
          - entities.Acquisition.fields.deal_status
        distinguishing_aspect: |
          POST /acquisitions with every required input returns 201 and the stored
          row exposes all declared fields, with both money ledgers initialised to
          fully available and both status dimensions at their initial states.
        test_recipe:
          setup:
            - "Empty database, logical clock parked at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
          trigger:
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
          assert:
            - "HTTP status is 201 and response_type is object"
            - "Acquisition.${acq_id}.deal_status == SOURCING and compliance_clearance == PENDING and readiness_posture == BLOCKED"
            - "Acquisition.${acq_id}.retention_pool_committed_cents == 0 and retention_pool_available_cents == 3000000"
            - "Acquisition.${acq_id}.escrow_committed_cents == 0 and escrow_available_cents == 10000000"
            - "Acquisition.${acq_id}.hr_staffing_coverage_pct == 0.00 and version == 1"
            - "Acquisition.${acq_id}.closed_at is null and abandoned_reason is null"

      - name: acquisition_retrieval_returns_the_stored_entity
        claim_type: Retrieval
        grounds:
          - endpoints[GET /acquisitions/{acquisitionId}]
          - entities.Acquisition
        distinguishing_aspect: |
          GET /acquisitions/{acquisitionId} echoes exactly the values persisted by
          the create call, including the input fields and the derived ledgers, with
          no field dropped and no field re-derived differently on read.
        test_recipe:
          setup:
            - "One Acquisition created at 2026-08-01T00:00:00Z with the canonical fixture values."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
          trigger:
            - call: "GET /acquisitions/${acq_id}"
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "HTTP status is 200 and response_type is object"
            - "Acquisition.${acq_id}.target_practice_name == Lakeside Family Medicine and specialty == PRIMARY_CARE and structure == ASSET"
            - "Acquisition.${acq_id}.annual_malpractice_premium_cents == 4800000 and trailing_annual_collections_cents == 500000000"
            - "Acquisition.${acq_id}.target_close_on == 2026-11-01 and required_staff_headcount == 5"
            - "Acquisition.${acq_id}.created_at == 2026-08-01T00:00:00Z and updated_at == 2026-08-01T00:00:00Z"

      - name: acquisition_listing_is_paginated_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /acquisitions]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          GET /acquisitions with limit 2 over three rows returns exactly two items,
          total_count 3 and has_more true; the second page with offset 2 returns one
          item and has_more false, and a deal_status filter narrows total_count.
        test_recipe:
          setup:
            - "Three Acquisitions created in order, the second moved to deal_status ABANDONED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_a_id: "$.data.id" }
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Northgate Cardiology Associates", specialty: "CARDIOLOGY", structure: "EQUITY", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 9600000, trailing_annual_collections_cents: 900000000, target_close_on: "2026-12-01", required_staff_headcount: 8, retention_pool_total_cents: 6000000, escrow_total_cents: 20000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_b_id: "$.data.id" }
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Riverbend Orthopedics", specialty: "ORTHOPEDICS", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 12000000, trailing_annual_collections_cents: 1200000000, target_close_on: "2027-01-04", required_staff_headcount: 11, retention_pool_total_cents: 9000000, escrow_total_cents: 30000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_c_id: "$.data.id" }
            - call: "POST /acquisitions/${acq_b_id}/status"
              payload: { target_status: "ABANDONED", abandoned_reason: "Seller withdrew from the letter of intent." }
              as: DealLead
              as_user_id: "dl-1"
          trigger:
            - call: "GET /acquisitions"
              payload: { limit: 2, offset: 0 }
              as: DealLead
              as_user_id: "dl-1"
          assert:
            - "the response carries exactly 2 items with total_count == 3 and has_more == true"
            - "response_type is array and the pagination block reports limit 2 and offset 0"
            - "GET /acquisitions with limit 2 and offset 2 returns exactly 1 item with has_more == false"
            - "GET /acquisitions with deal_status SOURCING returns total_count 2 covering ${acq_a_id} and ${acq_c_id}"
            - "GET /acquisitions with deal_status ABANDONED returns total_count 1 covering ${acq_b_id}"
            - "GET /acquisitions with no query parameters returns total_count 3 with the default limit of 10"

      - name: acquisition_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: |
          A syntactically valid identifier that resolves to no stored Acquisition
          yields ERR_RESOURCE_NOT_FOUND with HTTP 404, not an empty 200 body.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
          trigger:
            - call: "GET /acquisitions/00000000-0000-4000-8000-000000000000"
              as: DealLead
              as_user_id: "dl-1"
          assert:
            - "response error_id == ERR_RESOURCE_NOT_FOUND with HTTP 404"
            - "response_type is error and the data block carries error_id and message"

      - name: acquisition_missing_required_escrow_total_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority=3]
          - endpoints[POST /acquisitions]
          - entities.Acquisition.fields.escrow_total_cents
        distinguishing_aspect: |
          escrow_total_cents is declared `source: input` with no default, so omitting
          it returns ERR_INVALID_REQUEST with HTTP 400 and no Acquisition row is
          created — the field is not silently defaulted to zero.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
          trigger:
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000 }
              as: DealLead
              as_user_id: "dl-1"
          assert:
            - "response error_id == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /acquisitions reports total_count == 0"
            - "the same omission of retention_pool_total_cents, target_close_on or required_staff_headcount each returns ERR_INVALID_REQUEST (400)"

      - name: acquisition_tail_coverage_months_defaults_to_zero
        claim_type: Defaults
        grounds:
          - entities.Acquisition.fields.tail_coverage_months
          - calculations.malpractice_tail_premium
        distinguishing_aspect: |
          tail_coverage_months is declared with `default: 0`, so omitting it stores 0
          rather than null; on an OCCURRENCE-form deal the omission is harmless
          because tail_coverage_required stays false.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
          trigger:
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
          assert:
            - "Acquisition.${acq_id}.tail_coverage_months == 0, not null"
            - "Acquisition.${acq_id}.tail_coverage_required is null before the DILIGENCE -> BOARD_REVIEW transition computes it"
            - "an otherwise identical create that passes tail_coverage_months 60 stores 60"

      - name: physician_board_certified_defaults_to_false
        claim_type: Defaults
        grounds:
          - entities.Physician.fields.board_certified
          - entities.Physician.fields.employment_status
        distinguishing_aspect: |
          board_certified carries `default: false`, and employment_status is computed
          to PROSPECTIVE at creation; omitting the optional flag stores false rather
          than null, which keeps the board_certified query filter total.
        test_recipe:
          setup:
            - "One Acquisition in deal_status SOURCING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
          trigger:
            - call: "POST /physicians"
              payload: { acquisition_id: "${acq_id}", npi: "1548392017", full_name: "Amara Vance MD", specialty: "PRIMARY_CARE", state_license_expires_on: "2028-06-30" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { phys_id: "$.data.id" }
          assert:
            - "Physician.${phys_id}.board_certified == false, not null"
            - "Physician.${phys_id}.employment_status == PROSPECTIVE"
            - "GET /physicians with acquisition_id ${acq_id} and board_certified false returns total_count 1"

      - name: readiness_task_is_blocking_defaults_to_true
        claim_type: Defaults
        grounds:
          - entities.ReadinessTask.fields.is_blocking
          - entities.ReadinessTask.fields.domain
          - calculations.acquisition_readiness_posture
        distinguishing_aspect: |
          is_blocking carries `default: true`, so a task created without the flag
          enters the blocking set and drags the posture from BLOCKED to AT_RISK; the
          domain field is derived from task_code and is not a client input.
        test_recipe:
          setup:
            - "One Acquisition in deal_status SOURCING with readiness_posture BLOCKED and no ReadinessTask rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
          trigger:
            - call: "POST /readiness-tasks"
              payload: { acquisition_id: "${acq_id}", task_code: "IT_DATA_MIGRATION", due_on: "2026-10-15" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { task_id: "$.data.id" }
          assert:
            - "ReadinessTask.${task_id}.is_blocking == true (default applied)"
            - "ReadinessTask.${task_id}.domain == IT and status == OPEN"
            - "Acquisition.${acq_id}.readiness_posture == AT_RISK"
            - "GET /readiness-tasks with acquisition_id ${acq_id} and is_blocking true returns total_count 1"

      - name: acquisition_consideration_fields_are_null_until_board_review
        claim_type: Computed Fields
        grounds:
          - entities.Acquisition.fields.purchase_price_cents
          - entities.Acquisition.fields.gross_consideration_cents
          - entities.Acquisition.fields.net_consideration_cents
          - calculations.deal_net_consideration
        distinguishing_aspect: |
          The five consideration fields are `source: computed` off the DILIGENCE ->
          BOARD_REVIEW transition, so on a freshly created SOURCING acquisition they
          are all null; they are not zero-initialised and cannot be supplied by the
          client, whose unknown fields are rejected outright.
        test_recipe:
          setup:
            - "One Acquisition in deal_status SOURCING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
          trigger:
            - call: "GET /acquisitions/${acq_id}"
              as: DealLead
              as_user_id: "dl-1"
          assert:
            - "Acquisition.${acq_id}.purchase_price_cents is null"
            - "Acquisition.${acq_id}.integration_reserve_cents is null"
            - "Acquisition.${acq_id}.gross_consideration_cents is null"
            - "Acquisition.${acq_id}.synergy_credit_bps is null and synergy_credit_cents is null"
            - "Acquisition.${acq_id}.net_consideration_cents is null"
            - "Acquisition.${acq_id}.tail_premium_cents is null and tail_coverage_required is null"

      - name: ehr_batch_retention_fields_computed_on_create
        claim_type: Computed Fields
        grounds:
          - calculations.legacy_retention_years
          - entities.EhrMigrationBatch.fields.retention_years
          - entities.EhrMigrationBatch.fields.legacy_purge_eligible_on
          - entities.EhrMigrationBatch.fields.unprocessed_count
        distinguishing_aspect: |
          retention_years, legacy_purge_eligible_on and unprocessed_count are all
          computed at creation: a STRUCTURED adult batch takes
          DEFAULT_RETENTION_YEARS 10 and a purge date of 2036-07-15, and
          unprocessed_count starts at the full record_count of 20000.
        test_recipe:
          setup:
            - "One Acquisition in deal_status SOURCING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
          trigger:
            - call: "POST /ehr-migration-batches"
              payload: { acquisition_id: "${acq_id}", batch_label: "CHARTS-A", source_system: "ATHENA", chart_type: "STRUCTURED", record_count: 20000, contains_minor_records: false, last_encounter_on: "2026-07-15" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { batch_id: "$.data.id" }
          assert:
            - "EhrMigrationBatch.${batch_id}.retention_years == 10"
            - "EhrMigrationBatch.${batch_id}.legacy_purge_eligible_on == 2036-07-15"
            - "EhrMigrationBatch.${batch_id}.validated_count == 0 and defect_count == 0 and unprocessed_count == 20000"
            - "EhrMigrationBatch.${batch_id}.match_rate_bps == 0 and retry_count == 0 and status == STAGED"

      - name: performance_report_is_immutable_and_carries_no_version_field
        claim_type: Immutability
        grounds:
          - entities.PerformanceReport
          - endpoints[POST /performance-reports]
          - endpoints[GET /performance-reports/{reportId}]
        distinguishing_aspect: |
          PerformanceReport is declared `common_fields: false` with only id and
          created_at as system fields, so it exposes no version and no updated_at,
          and §1.5 declares no status or update endpoint for it — the row is an
          append-only fact carrying its own true_up_applied_cents snapshot.
        test_recipe:
          setup:
            - "The canonical CLOSED acquisition with one EXECUTED CompensationPlan, produced by the chain below."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /physicians"
              payload: { acquisition_id: "${acq_id}", npi: "1548392017", full_name: "Amara Vance MD", specialty: "PRIMARY_CARE", board_certified: true, state_license_expires_on: "2028-06-30" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { phys_id: "$.data.id" }
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "DILIGENCE" }
              as: DealLead
              as_user_id: "dl-1"
            - call: "GET /acquisitions/${acq_id}"
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { acq_v1: "$.data.version" }
            - call: "POST /valuation-opinions"
              payload: { acquisition_id: "${acq_id}", expected_acquisition_version: "${acq_v1}", opinion_type: "FMV", method: "MARKET_APPROACH", normalized_ebitda_cents: 290000000, market_multiple_bps: 50000, independence_attested: true, effective_on: "2026-08-01" }
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { fmv_id: "$.data.id" }
            - call: "POST /valuation-opinions/${fmv_id}/status"
              payload: { target_status: "SUBMITTED" }
              as: ValuationAnalyst
              as_user_id: "va-1"
            - call: "POST /valuation-opinions/${fmv_id}/status"
              payload: { target_status: "ACCEPTED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /acquisitions/${acq_id}"
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { acq_v2: "$.data.version" }
            - call: "POST /valuation-opinions"
              payload: { acquisition_id: "${acq_id}", expected_acquisition_version: "${acq_v2}", opinion_type: "COMMERCIAL_REASONABLENESS", method: "NARRATIVE", cr_conclusion: "REASONABLE", independence_attested: true, effective_on: "2026-08-01" }
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { cr_id: "$.data.id" }
            - call: "POST /valuation-opinions/${cr_id}/status"
              payload: { target_status: "SUBMITTED" }
              as: ValuationAnalyst
              as_user_id: "va-1"
            - call: "POST /valuation-opinions/${cr_id}/status"
              payload: { target_status: "ACCEPTED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /acquisitions/${acq_id}/compliance-clearance"
              payload: { target_clearance: "CLEARED", clearance_note: "No referral-linked compensation." }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /acquisitions/${acq_id}"
              as: CompensationDesigner
              as_user_id: "cd-1"
              captures: { acq_v3: "$.data.version" }
            - call: "POST /compensation-plans"
