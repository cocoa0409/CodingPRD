            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/preliminary-results/${rev0_id}/accept"
              payload: { expected_hospital_version: "${p0_v2}" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { err_stale: $.data.error_id }
          assert:
            - "the first accept returns 200 with status ACCEPTED and accepted_at == 2026-06-01T00:00:00Z"
            - "Hospital.${p0_id}.version advanced to ${p0_v3}, so the accept bumped the parent"
