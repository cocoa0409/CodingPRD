            - "GET /pro/reservations?pro_order_id=${order_c_id} returns 1 row"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: order_submit_blocked_until_certificate_verified
        grounds:
          - validations[priority=33]
          - state_machines.TaxExemptCertificate.PENDING_to_VERIFIED
          - entities.ProAccount.fields.tax_exempt_state_codes
          - entities.ProOrder.fields.resale_purchase
          - entities.ProOrder.fields.tax_exempt_applied
        distinguishing_aspect: |
          Entity pair ProOrder x TaxExemptCertificate: a resale order cannot leave DRAFT while the
          certificate for the fulfillment store's state is PENDING (ERR_NO_VALID_TAX_CERTIFICATE, 422);
          the very same submit succeeds once TaxComplianceOfficer verifies the certificate, and the
          order then prices with tax_exempt_applied true and tax_cents 0.
        test_recipe:
          setup:
            - "Store HD-101 in IL (tax 0.0825) stocking MORTAR-BAG at list 2000."
            - "A MEMBER account with a filed but still PENDING IL resale certificate (expires_on 2027-12-31)."
            - "A DRAFT will-call card order for 10 units with resale_purchase true."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_main_id: "$.data.id" }
            - call: "POST /pro/store-stocks"
              payload: { store_id: "${store_main_id}", sku: "MORTAR-BAG", on_hand_units: 500, list_unit_price_cents: 2000 }
              as: PlatformAdmin
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Resale Remodelers", home_store_id: "${store_main_id}", po_required: false, job_name_required: false, tier_review_mode: "PINNED_AT_REVIEW", baseline_volume_cents: 0 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id" }
            - call: "GET /pro/pro-accounts/${acct_id}"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { acct_v: "$.data.version" }
            - call: "POST /pro/tax-exempt-certificates"
              payload: { pro_account_id: "${acct_id}", state_code: "IL", certificate_number: "IL-RESALE-77120", expires_on: "2027-12-31", expected_pro_account_version: "${acct_v}" }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { cert_id: "$.data.id" }
            - call: "POST /pro/pro-orders"
              payload: { pro_account_id: "${acct_id}", fulfillment_store_id: "${store_main_id}", payment_method: "CARD", delivery_mode: "WILL_CALL", lift_gate_required: false, job_lot_required: false, resale_purchase: true }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /pro/pro-orders/${order_id}/lines"
              payload: { sku: "MORTAR-BAG", qty_units: 10 }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /pro/pro-orders/${order_id}/submit"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { err_pending: "$.data.error_id" }
            - call: "POST /pro/tax-exempt-certificates/${cert_id}/verify"
              payload: {}
              as: TaxComplianceOfficer
              as_user_id: "tax-1"
            - call: "POST /pro/pro-orders/${order_id}/submit"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${acct_id}"
          assert:
            - "${err_pending} == ERR_NO_VALID_TAX_CERTIFICATE"
            - "first submit attempt http_status == 422"
            - "TaxExemptCertificate.${cert_id}.status == VERIFIED"
            - "ProAccount.${acct_id}.tax_exempt_state_codes contains IL"
            - "ProOrder.${order_id}.fulfillment_status == SUBMITTED"
            - "ProOrder.${order_id}.subtotal_cents == 20000"
            - "ProOrder.${order_id}.tax_exempt_applied == true"
            - "ProOrder.${order_id}.tax_cents == 0"
            - "ProOrder.${order_id}.total_cents == 20000"

      - name: staging_stage_blocked_until_all_reservations_allocated
        grounds:
          - validations[priority=17]
          - state_machines.WillCallStaging.SCHEDULED_to_STAGED
          - state_machines.Reservation.HELD_to_ALLOCATED
          - state_machines.ProOrder.fulfillment_status.RESERVED_to_STAGED
        distinguishing_aspect: |
          A different entity pair — WillCallStaging x Reservation: a two-line order produces two
          reservations, and staging is refused with ERR_RESERVATIONS_NOT_ALLOCATED (409) while one of
          them is still HELD. Allocating the second reservation, and nothing else, unblocks the exact
          same stage call and drives the order RESERVED -> STAGED.
        test_recipe:
          setup:
            - "Store HD-101 stocking SHINGLE-BUNDLE (list 1999, 600 on hand) and MORTAR-BAG (list 2000, 500 on hand), 2 will-call bays."
            - "A MEMBER account with a will-call card order carrying one 5-unit line of each SKU, submitted and reserved (two HELD reservations)."
            - "A SCHEDULED staging booked for that order at 2026-08-02T08:00:00Z for 6 hours."
            - "Exactly one of the two reservations is allocated."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_main_id: "$.data.id" }
            - call: "POST /pro/store-stocks"
              payload: { store_id: "${store_main_id}", sku: "SHINGLE-BUNDLE", on_hand_units: 600, list_unit_price_cents: 1999 }
              as: PlatformAdmin
            - call: "POST /pro/store-stocks"
              payload: { store_id: "${store_main_id}", sku: "MORTAR-BAG", on_hand_units: 500, list_unit_price_cents: 2000 }
              as: PlatformAdmin
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Corner Handyman", home_store_id: "${store_main_id}", po_required: false, job_name_required: false, tier_review_mode: "PINNED_AT_REVIEW", baseline_volume_cents: 0 }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /pro/pro-orders"
              payload: { pro_account_id: "${acct_id}", fulfillment_store_id: "${store_main_id}", payment_method: "CARD", delivery_mode: "WILL_CALL", lift_gate_required: false, job_lot_required: false, resale_purchase: false }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /pro/pro-orders/${order_id}/lines"
              payload: { sku: "SHINGLE-BUNDLE", qty_units: 5 }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
            - call: "POST /pro/pro-orders/${order_id}/lines"
              payload: { sku: "MORTAR-BAG", qty_units: 5 }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
            - call: "POST /pro/pro-orders/${order_id}/submit"
              payload: {}
              as: ContractorAdmin
