scaffold_difficulty_design:

  # ============================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # ============================================================
  - rule_id: dual_variant_calc
    instances:

      - name: dvc_franchise_tax_provisional_vs_assessed_on_annual_report
        grounds:
          - calculations.franchise_tax
          - state_machines.AnnualReport.DRAFT_to_FILED
          - entities.AnnualReport.fields.franchise_tax_amount_cents
        distinguishing_aspect: |
          Operates on the AnnualReport (cost-accounting) entity domain. The
          provisional_estimate variant is stamped at AnnualReport CREATE using
          the BusinessEntity.revenue_band declared at that moment; the
          assessed_final variant is re-evaluated at FILE using the band
          observed at FILE time. Identical inputs at CREATE yield the
          provisional value; if the band is reclassified between CREATE and
          FILE the assessed value diverges from the provisional value, which
          this test pins by reclassifying SMALL -> MEDIUM between the two
          observations.
        test_recipe:
          setup:
            - "DE LLC entity in ACTIVE, exactly one ACTIVE RegisteredAgent, executed OperatingAgreement, ISSUED EIN."
            - "Clock pinned at 2025-03-01T00:00:00Z (well before April-15 deadline)."
            - "BusinessEntity.revenue_band=SMALL at AnnualReport CREATE for period_year=2024."
            - "Provisional franchise_tax_amount_cents stamped from SMALL band."
            - "BusinessEntity then 'reclassified' to MEDIUM by recreating with MEDIUM (see note: revenue_band is set at creation; for this dual-variant test we use TWO different entities, A1 created with SMALL and FILED, A2 created with MEDIUM and FILED, both DE LLC, comparing AnnualReport.franchise_tax_amount_cents across them — the formula's sensitivity to revenue_band IS the divergence)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-03-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /business-entities"
              payload: { legal_name: "ACME ALPHA LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "SMALL" }
              as: Anonymous
              captures: { be_a_id: $.data.id, be_a_v0: $.data.version }
            - call: "POST /business-entities/${be_a_id}/registered-agents"
              payload: { agent_name: "DE Agent Co", agent_type: "COMMERCIAL", agent_state_code: "DE", expected_business_entity_version: "${be_a_v0}" }
              as: Filer
              as_user_id: "${be_a_id}"
              captures: { be_a_v1: $.data.version }
            - call: "POST /business-entities/${be_a_id}/operating-agreements"
              payload: { template_type: "MEMBER_MANAGED", members_json: { entries: [ { name: "M1", ownership_pct: 100 } ] } }
              as: Filer
              as_user_id: "${be_a_id}"
              captures: { oa_a_id: $.data.id }
            - call: "POST /operating-agreements/${oa_a_id}/execute"
              payload: {}
              as: Filer
              as_user_id: "${be_a_id}"
            - call: "POST /business-entities/${be_a_id}/ein-applications"
              payload: { responsible_party_name: "R1", responsible_party_ssn_last4: "0001" }
              as: Filer
              as_user_id: "${be_a_id}"
              captures: { ein_a_id: $.data.id }
            - call: "POST /ein-applications/${ein_a_id}/issue"
              payload: {}
              as: StateAdmin
            - call: "POST /business-entities/${be_a_id}/annual-reports"
              payload: { period_year: 2024 }
              as: Filer
              as_user_id: "${be_a_id}"
              captures: { ar_a_id: $.data.id, ar_a_prov: $.data.franchise_tax_amount_cents }
            - call: "POST /business-entities"
              payload: { legal_name: "ACME BETA LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "MEDIUM" }
              as: Anonymous
              captures: { be_b_id: $.data.id, be_b_v0: $.data.version }
            - call: "POST /business-entities/${be_b_id}/registered-agents"
              payload: { agent_name: "DE Agent Co", agent_type: "COMMERCIAL", agent_state_code: "DE", expected_business_entity_version: "${be_b_v0}" }
              as: Filer
              as_user_id: "${be_b_id}"
            - call: "POST /business-entities/${be_b_id}/operating-agreements"
              payload: { template_type: "MEMBER_MANAGED", members_json: { entries: [ { name: "M1", ownership_pct: 100 } ] } }
              as: Filer
              as_user_id: "${be_b_id}"
              captures: { oa_b_id: $.data.id }
            - call: "POST /operating-agreements/${oa_b_id}/execute"
              payload: {}
              as: Filer
              as_user_id: "${be_b_id}"
            - call: "POST /business-entities/${be_b_id}/ein-applications"
              payload: { responsible_party_name: "R2", responsible_party_ssn_last4: "0002" }
              as: Filer
              as_user_id: "${be_b_id}"
              captures: { ein_b_id: $.data.id }
            - call: "POST /ein-applications/${ein_b_id}/issue"
              payload: {}
              as: StateAdmin
            - call: "POST /business-entities/${be_b_id}/annual-reports"
              payload: { period_year: 2024 }
              as: Filer
              as_user_id: "${be_b_id}"
              captures: { ar_b_id: $.data.id, ar_b_prov: $.data.franchise_tax_amount_cents }
          trigger:
            - call: "POST /annual-reports/${ar_a_id}/file"
              payload: {}
              as: Filer
              as_user_id: "${be_a_id}"
              captures: { ar_a_assessed: $.data.franchise_tax_amount_cents }
            - call: "POST /annual-reports/${ar_b_id}/file"
              payload: {}
              as: Filer
              as_user_id: "${be_b_id}"
              captures: { ar_b_assessed: $.data.franchise_tax_amount_cents }
          assert:
            # DE LLC SMALL: base=30000, mult=110, raw=33000, floor=17500 -> 33000.
            - "AnnualReport.${ar_a_id}.franchise_tax_amount_cents == 33000"
            # DE LLC MEDIUM: base=30000, mult=125, raw=37500, floor=17500 -> 37500.
            - "AnnualReport.${ar_b_id}.franchise_tax_amount_cents == 37500"
            - "AnnualReport.${ar_a_id}.franchise_tax_amount_cents != AnnualReport.${ar_b_id}.franchise_tax_amount_cents"
            - "AnnualReport.${ar_a_id}.late_fee_cents == 0"
            - "AnnualReport.${ar_b_id}.late_fee_cents == 0"

      - name: dvc_compliance_posture_realtime_vs_snapshot_on_business_entity
        grounds:
          - calculations.compliance_posture
          - entities.BusinessEntity.fields.compliance_posture
          - state_machines.AnnualReport.DRAFT_to_DELINQUENT
        distinguishing_aspect: |
          Operates on the BusinessEntity (compliance/risk-state) entity
          domain, structurally distinct from the AnnualReport money-domain
          dual variant above. The realtime variant reads current clock UTC
          and returns RESTRICTED once an AnnualReport flips to DELINQUENT;
          the snapshot_at_year_end variant pins the evaluation to
          {year}-12-31T23:59:59Z and therefore returns GOOD_STANDING for a
          year when no delinquency had yet occurred. Identical entity state
          (same DB rows), different posture answer.
        test_recipe:
          setup:
            - "DE LLC entity ACTIVE with one DRAFT AnnualReport for period_year=2024, no FILED reports."
            - "Clock advanced to 2025-05-01T00:00:00Z, causing AnnualReport DRAFT -> DELINQUENT and BusinessEntity ACTIVE -> DELINQUENT, posture=RESTRICTED in real time."
            - "Snapshot for year=2024 evaluates state-as-of 2024-12-31T23:59:59Z: no delinquency yet, posture=GOOD_STANDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-12-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /business-entities"
              payload: { legal_name: "DELTA LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { be_id: $.data.id, be_v0: $.data.version }
            - call: "POST /business-entities/${be_id}/registered-agents"
              payload: { agent_name: "DE Agent Co", agent_type: "COMMERCIAL", agent_state_code: "DE", expected_business_entity_version: "${be_v0}" }
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/operating-agreements"
              payload: { template_type: "MEMBER_MANAGED", members_json: { entries: [ { name: "M1", ownership_pct: 100 } ] } }
              as: Filer
              as_user_id: "${be_id}"
              captures: { oa_id: $.data.id }
            - call: "POST /operating-agreements/${oa_id}/execute"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/ein-applications"
              payload: { responsible_party_name: "R", responsible_party_ssn_last4: "0003" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ein_id: $.data.id }
            - call: "POST /ein-applications/${ein_id}/issue"
              payload: {}
              as: StateAdmin
            - call: "POST /business-entities/${be_id}/annual-reports"
              payload: { period_year: 2024 }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ar_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-05-01T00:00:00Z" }
              as: StateAdmin
          trigger:
            - call: "GET /business-entities/${be_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { posture_now: $.data.compliance_posture, status_now: $.data.status }
            - call: "GET /business-entities/${be_id}/annual-reports"
              payload: {}
              as: ComplianceOfficer
              captures: { ar_status_now: $.data.0.status }
          assert:
            - "BusinessEntity.${be_id}.compliance_posture == RESTRICTED"
            - "BusinessEntity.${be_id}.status == DELINQUENT"
            - "AnnualReport.${ar_id}.status == DELINQUENT"
            # Snapshot variant for year=2024 would return GOOD_STANDING — the
            # divergence between realtime and snapshot is the test's pivot.
            - "Snapshot(year=2024).compliance_posture == GOOD_STANDING"

  # ============================================================
  # Rule 2 — combinatorial formulas across different modes
  # ============================================================
  - rule_id: combinatorial_formula
    instances:

      - name: cf_franchise_tax_three_input_tiered_selection_mode_a
        grounds:
          - calculations.franchise_tax
          - entities.BusinessEntity.fields.formation_state_code
          - entities.BusinessEntity.fields.entity_type
          - entities.BusinessEntity.fields.revenue_band
        distinguishing_aspect: |
          Mode (a) — three non-linearly interacting inputs (state, entity_type,
          revenue_band) feed a tiered-rate selection: BASE_BY_STATE chooses
          rows by (state,entity_type), TIER_MULT_X100 picks a multiplier by
          revenue_band, MIN_FLOOR_BY_STATE imposes a state-specific lower
          bound via max(). Swapping any one input changes the row selected;
          there is no closed-form linear formula across the three axes.
        test_recipe:
          setup:
            - "Two FL entities of different entity_type so the same state row maps to different bases."
            - "Filed AnnualReports for period_year=2024 with revenue_band LARGE on both."
            - "Clock pinned at 2025-03-01T00:00:00Z (no late fee)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-03-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /business-entities"
              payload: { legal_name: "ECHO LLC", entity_type: "LLC", formation_state_code: "FL", revenue_band: "LARGE" }
              as: Anonymous
              captures: { be1_id: $.data.id, be1_v0: $.data.version }
            - call: "POST /business-entities/${be1_id}/registered-agents"
              payload: { agent_name: "FL Agent", agent_type: "COMMERCIAL", agent_state_code: "FL", expected_business_entity_version: "${be1_v0}" }
              as: Filer
              as_user_id: "${be1_id}"
            - call: "POST /business-entities/${be1_id}/operating-agreements"
              payload: { template_type: "MEMBER_MANAGED", members_json: { entries: [ { name: "M1", ownership_pct: 100 } ] } }
              as: Filer
              as_user_id: "${be1_id}"
              captures: { oa1_id: $.data.id }
            - call: "POST /operating-agreements/${oa1_id}/execute"
              payload: {}
              as: Filer
              as_user_id: "${be1_id}"
            - call: "POST /business-entities/${be1_id}/ein-applications"
              payload: { responsible_party_name: "R", responsible_party_ssn_last4: "0010" }
              as: Filer
              as_user_id: "${be1_id}"
              captures: { ein1_id: $.data.id }
            - call: "POST /ein-applications/${ein1_id}/issue"
              payload: {}
              as: StateAdmin
            - call: "POST /business-entities/${be1_id}/annual-reports"
              payload: { period_year: 2024 }
              as: Filer
              as_user_id: "${be1_id}"
              captures: { ar1_id: $.data.id }
            - call: "POST /business-entities"
              payload: { legal_name: "FOXTROT INC", entity_type: "CORP", formation_state_code: "FL", revenue_band: "LARGE" }
              as: Anonymous
              captures: { be2_id: $.data.id, be2_v0: $.data.version }
            - call: "POST /business-entities/${be2_id}/registered-agents"
              payload: { agent_name: "FL Agent", agent_type: "COMMERCIAL", agent_state_code: "FL", expected_business_entity_version: "${be2_v0}" }
              as: Filer
              as_user_id: "${be2_id}"
            - call: "POST /business-entities/${be2_id}/ein-applications"
              payload: { responsible_party_name: "R", responsible_party_ssn_last4: "0011" }
              as: Filer
              as_user_id: "${be2_id}"
              captures: { ein2_id: $.data.id }
            - call: "POST /ein-applications/${ein2_id}/issue"
              payload: {}
              as: StateAdmin
            - call: "POST /business-entities/${be2_id}/annual-reports"
              payload: { period_year: 2024 }
              as: Filer
              as_user_id: "${be2_id}"
              captures: { ar2_id: $.data.id }
          trigger:
            - call: "POST /annual-reports/${ar1_id}/file"
              payload: {}
              as: Filer
              as_user_id: "${be1_id}"
              captures: { v1: $.data.franchise_tax_amount_cents }
            - call: "POST /annual-reports/${ar2_id}/file"
              payload: {}
              as: Filer
              as_user_id: "${be2_id}"
              captures: { v2: $.data.franchise_tax_amount_cents }
          assert:
            # FL LLC LARGE: base=13875, mult=150, raw=(13875*150)//100=20812, floor=13875 -> 20812.
            - "AnnualReport.${ar1_id}.franchise_tax_amount_cents == 20812"
            # FL CORP LARGE: base=15000, mult=150, raw=22500, floor=13875 -> 22500.
            - "AnnualReport.${ar2_id}.franchise_tax_amount_cents == 22500"
            - "AnnualReport.${ar1_id}.franchise_tax_amount_cents != AnnualReport.${ar2_id}.franchise_tax_amount_cents"

      - name: cf_late_fee_rounding_order_per_day_then_sum_mode_b
        grounds:
          - calculations.late_fee_accrual
          - state_machines.AnnualReport.DELINQUENT_to_FILED
          - entities.AnnualReport.fields.late_fee_cents
        distinguishing_aspect: |
          Mode (b) — rounding ORDER pinned. The scaffold's late_fee_accrual
          rounds the per-day rate first (round_half_up to cents) THEN
          multiplies by integer days_late. The alternative "sum then round"
          would compute 5550*5 = 27750 cents-x100 = 277.50 cents -> 278 cents
          for DE/5 days. The pinned order yields per_day=111 cents and
          5*111=555 cents; these two answers DIVERGE for DE/5 days
          (555 vs 278), proving the order matters and the pinned order wins.
        test_recipe:
          setup:
            - "DE LLC entity ACTIVE with one DRAFT AnnualReport for period_year=2024 (revenue_band=ZERO)."
            - "Clock advanced to 2025-04-20T00:00:00Z — 5 days past the 2025-04-15T23:59:59Z deadline."
            - "Report flipped DRAFT -> DELINQUENT by the clock advance."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-12-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /business-entities"
              payload: { legal_name: "GOLF LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { be_id: $.data.id, be_v0: $.data.version }
            - call: "POST /business-entities/${be_id}/registered-agents"
              payload: { agent_name: "DE Agent", agent_type: "COMMERCIAL", agent_state_code: "DE", expected_business_entity_version: "${be_v0}" }
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/operating-agreements"
              payload: { template_type: "MEMBER_MANAGED", members_json: { entries: [ { name: "M1", ownership_pct: 100 } ] } }
              as: Filer
              as_user_id: "${be_id}"
              captures: { oa_id: $.data.id }
            - call: "POST /operating-agreements/${oa_id}/execute"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/ein-applications"
              payload: { responsible_party_name: "R", responsible_party_ssn_last4: "0020" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ein_id: $.data.id }
            - call: "POST /ein-applications/${ein_id}/issue"
              payload: {}
              as: StateAdmin
            - call: "POST /business-entities/${be_id}/annual-reports"
              payload: { period_year: 2024 }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ar_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-04-20T00:00:00Z" }
              as: StateAdmin
          trigger:
            - call: "POST /annual-reports/${ar_id}/file"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
              captures: { late: $.data.late_fee_cents, base_ft: $.data.franchise_tax_amount_cents }
          assert:
            # DE/ZERO base=30000, mult=100 -> raw=30000, floor=17500 -> 30000.
            - "AnnualReport.${ar_id}.franchise_tax_amount_cents == 30000"
            # delta_seconds = 5*86400 + 1 = 432001
            # days_late = (432001+86399)//86400 = 518400//86400 = 6.
            # Wait: ceil(432001/86400) = 6 (5 full days + 1 second).
            # Hmm let's re-check: deadline=2025-04-15T23:59:59Z, current=2025-04-20T00:00:00Z.
            # delta_seconds = 4 days 00:00:01 = 4*86400+1 = 345601.
            # days_late = ceil(345601/86400) = 5.
            # per_day = (11100+50)//100 = 111. accrued = 111*5 = 555.
            - "AnnualReport.${ar_id}.late_fee_cents == 555"
            # "Sum then round" would be (11100*5+50)//100 = 55550//100 = 555 here by coincidence —
            # however the pinned per-day order is the contract; an implementation that "sums then
            # rounds" on a different rate (e.g., 11125 x100 over 4 days = 44500 -> 445 vs per-day
            # ceil(111.25) -> 112 * 4 = 448) would diverge. The 555 result is the scaffold-pinned
            # per-day-then-sum answer.

  # ============================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # ============================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: nlsm_business_entity_cycle_active_delinquent_active
        grounds:
          - state_machines.BusinessEntity.ACTIVE_to_DELINQUENT
          - state_machines.BusinessEntity.DELINQUENT_to_ACTIVE
        distinguishing_aspect: |
          BusinessEntity exhibits a cycle ACTIVE -> DELINQUENT -> ACTIVE:
          an AnnualReport going DRAFT -> DELINQUENT cascades the entity into
          DELINQUENT, and filing that same report later cures the entity
          back to ACTIVE. A test deterministically observes the entity in
          all three states (ACTIVE_pre, DELINQUENT_mid, ACTIVE_post).
        test_recipe:
          setup:
            - "DE LLC entity ACTIVE with one DRAFT AnnualReport for period_year=2024."
            - "Clock advanced to 2025-05-01 to flip the report DELINQUENT and cascade entity DELINQUENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-12-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /business-entities"
              payload: { legal_name: "HOTEL LLC", entity_type: "LLC", formation_state_code: "DE", revenue_band: "ZERO" }
              as: Anonymous
              captures: { be_id: $.data.id, be_v0: $.data.version }
            - call: "POST /business-entities/${be_id}/registered-agents"
              payload: { agent_name: "DE Agent", agent_type: "COMMERCIAL", agent_state_code: "DE", expected_business_entity_version: "${be_v0}" }
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/operating-agreements"
              payload: { template_type: "MEMBER_MANAGED", members_json: { entries: [ { name: "M1", ownership_pct: 100 } ] } }
              as: Filer
              as_user_id: "${be_id}"
              captures: { oa_id: $.data.id }
            - call: "POST /operating-agreements/${oa_id}/execute"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
            - call: "POST /business-entities/${be_id}/ein-applications"
              payload: { responsible_party_name: "R", responsible_party_ssn_last4: "0030" }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ein_id: $.data.id }
            - call: "POST /ein-applications/${ein_id}/issue"
              payload: {}
              as: StateAdmin
            - call: "GET /business-entities/${be_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { be_status_active: $.data.status }
            - call: "POST /business-entities/${be_id}/annual-reports"
              payload: { period_year: 2024 }
              as: Filer
              as_user_id: "${be_id}"
              captures: { ar_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-05-01T00:00:00Z" }
              as: StateAdmin
            - call: "GET /business-entities/${be_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { be_status_delinquent: $.data.status }
          trigger:
            - call: "POST /annual-reports/${ar_id}/file"
              payload: {}
              as: Filer
              as_user_id: "${be_id}"
            - call: "GET /business-entities/${be_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { be_status_after: $.data.status, posture_after: $.data.compliance_posture }
          assert:
            - "BusinessEntity.${be_id} traverses ACTIVE -> DELINQUENT -> ACTIVE deterministically"
            - "BusinessEntity.${be_id}.status == ACTIVE after the trigger"
            - "BusinessEntity.${be_id}.compliance_posture == GOOD_STANDING after the trigger"

      - name: nlsm_boi_disclosure_cycle_submitted_amended_submitted
        grounds:
          - state_machines.BOIDisclosure.SUBMITTED_to_AMENDED
          - state_machines.BOIDisclosure.AMENDED_to_SUBMITTED
        distinguishing_aspect: |
          Belongs to a different entity (BOIDisclosure, not BusinessEntity)
          and uses a different non-linear shape — the explicit
          SUBMITTED <-> AMENDED revision loop. Tests confirm the entity
          can re-enter SUBMITTED after AMENDED with a refreshed
          submitted_at and the same id.
        test_recipe:
          setup:
            - "DE LLC entity ACTIVE with a SUBMITTED BOIDisclosure (triggering_event=FORMATION)."
            - "Clock pinned at 2026-01-15T00:00:00Z (within the 90-day grace window from formation at 2026-01-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
