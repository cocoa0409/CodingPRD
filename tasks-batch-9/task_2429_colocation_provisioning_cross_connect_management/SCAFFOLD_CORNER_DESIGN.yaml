              payload: { customer_id: "${cust_id}", contract_number: "C-9401", billing_mode: "METERED_PLUS_COMMIT", committed_cabinet_count: 1, power_commit_kw: 10.0, committed_bandwidth_mbps: 100, cross_connect_cap: 1, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z" }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
