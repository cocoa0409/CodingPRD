            - { call: "POST /program/warranty-claims", payload: { registration_id: "${reg_id}", description: "leak", claim_labor_cost_cents: 300000 }, as: Claimant, captures: { claim_id: $.data.id } }
            - { call: "POST /program/warranty-claims/${claim_id}/evidence", payload: { evidence_type: "PHOTO", note: "x" }, as: Claimant }
            - { call: "POST /program/warranty-claims/${claim_id}/evidence", payload: { evidence_type: "PHOTO", note: "y" }, as: Claimant, captures: { cv: $.data.version } }
            - { call: "POST /program/warranty-claims/${claim_id}/adjudicate", payload: { determination: "MANUFACTURER_DEFECT", expected_claim_version: "${cv}" }, as: ProgramAdmin }
