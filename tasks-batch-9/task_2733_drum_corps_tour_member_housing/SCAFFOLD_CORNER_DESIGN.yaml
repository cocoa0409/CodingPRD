  - section: rbac
    instances:
      - name: peer_role_exclusive_operations_are_forbidden_to_other_roles
        claim_type: exclusive_operation_denial
        grounds:
          - rbac.CorpsDirector.exclusive_operations
          - rbac.MembershipCoordinator.exclusive_operations
          - rbac.TourManager.exclusive_operations
          - rbac.BusinessManager.exclusive_operations
          - complexity_profile.role_model
        distinguishing_aspect: "The five staff roles are peers, not a hierarchy: CorpsDirector — the most senior role — must be refused POST /housing-assignments, which belongs to MembershipCoordinator, and every other cross-role attempt must be ERR_UNAUTHORIZED (403) rather than 404 or 409, even when the target resource is in a state that would also fail."
        test_recipe:
          setup: ["One season and one host school exist so that each denied call targets a real resource."]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /host-schools"
              payload: { name: "Rockford High School", city: "Rockford", state_code: "IL", sleeping_space_count: 30, capacity_per_space: 12, rehearsal_field_count: 2, has_air_conditioning: true }
              as: TourManager
              captures: { school_id: "$.data.id" }
            - call: "GET /host-schools/${school_id}"
              as: TourManager
              note: "Read only to obtain a plausible integer version value for the denied OCC call below."
              captures: { school_v: "$.data.version" }
          trigger:
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Wrong Role", email: "wrong@corps.test", date_of_birth: "2005-03-04", section: "BRASS", dietary_flag: "NONE" }
              as: TourManager
              captures: { members_err: "$.data.error_id" }
            - call: "POST /tour-stops"
              payload: { season_id: "${season_id}", stop_type: "REHEARSAL_ONLY", venue_name: "Wrong Role Stop", city: "Rockford", state_code: "IL", arrive_at: "2027-06-19T08:00:00Z", depart_at: "2027-06-19T20:00:00Z", travel_miles_from_previous: 0, uniform_trunks: 0, instrument_cases: 0, prop_units: 0, truck_count: 1, rehearsal_minutes: 120, heat_index_f: 80 }
              as: MembershipCoordinator
              captures: { stops_err: "$.data.error_id" }
            - call: "POST /host-schools"
              payload: { name: "Wrong Role School", city: "Peoria", state_code: "IL", sleeping_space_count: 10, capacity_per_space: 8, rehearsal_field_count: 1, has_air_conditioning: false }
              as: BusinessManager
              captures: { schools_err: "$.data.error_id" }
            - call: "POST /seasons/${season_id}/run-billing-cycle"
              payload: {}
              as: VolunteerScreener
              captures: { sweep_err: "$.data.error_id" }
            - call: "POST /housing-assignments"
              payload: { facility_agreement_id: "44444444-4444-4444-8444-444444444444", member_id: "55555555-5555-4555-8555-555555555555", space_index: 1, check_in_date: "2027-05-10", check_out_date: "2027-05-20", expected_facility_agreement_version: "${school_v}" }
              as: CorpsDirector
              captures: { housing_err: "$.data.error_id" }
          assert:
            - "${members_err} == ERR_UNAUTHORIZED with HTTP 403"
            - "${stops_err} == ERR_UNAUTHORIZED with HTTP 403"
            - "${schools_err} == ERR_UNAUTHORIZED with HTTP 403"
            - "${sweep_err} == ERR_UNAUTHORIZED with HTTP 403 and Season.${season_id}.billing_epoch == 0"
            - "${housing_err} == ERR_UNAUTHORIZED with HTTP 403 — the priority 2 role check outranks both the unresolvable body FKs (priority 8) and the OCC check (priority 11), and CorpsDirector holds no hierarchical override"
            - "exactly one Season, one HostSchool, no Member, no TourStop and no HousingAssignment exist afterwards"

      - name: entity_backed_roles_cannot_act_on_another_owners_resource
        claim_type: resource_ownership
        grounds:
          - validations.priority_9_ERR_NOT_RESOURCE_OWNER
          - rbac.Member.identity_entity_backed
          - rbac.Volunteer.identity_entity_backed
        distinguishing_aspect: "The two entity_backed roles carry the right ROLE but the wrong IDENTITY, so the failure must be ERR_NOT_RESOURCE_OWNER (priority 9) and not ERR_UNAUTHORIZED: member B signing member A's contract and volunteer Y accepting volunteer X's shift are both 403 owner failures, and each owner's own call then succeeds."
        test_recipe:
          setup:
            - "Two OFFERED members each hold an ISSUED contract, and two screened COOK volunteers each hold a PROPOSED shift on the same stop at non-overlapping times."
