            - "ACTIVE plan; supervisor SUP (EFFECTIVE) and APPs A1, A2, A3 (each EFFECTIVE on the plan)"
            - "ASG1 SUP<-A1 fte 2.0 window 2026-01-01..2026-06-30; ASG2 SUP<-A2 fte 2.0 window 2026-03-01..2026-09-30 (both 201; max concurrent 4.0)"
