  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_rotation_half_open_windows_admit_touching_endpoints
        grounds:
          - validations[priority=55]
          - errors.ERR_ROTATION_WINDOW_OVERLAP
          - entities.EarningCategoryRotation.fields.window_end
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [window_start, window_end) with zero buffer, on the
          MerchantCategory resource. Adjacency is therefore legal — a second rotation starting at
          exactly the first one's window_end is admitted with 201 — while any interior intersection
          is rejected with 409 ERR_ROTATION_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "One MAPPED GROCERY MerchantCategory."
            - "One DRAFT rotation on it with window [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/merchant-categories"
              payload: { mcc_code: "5411", display_name: "Grocery Stores", base_category: "GROCERY", base_multiplier: 1.0, is_fallback: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { mc_id: $.data.id }
            - call: "POST /rewards/rotations"
              payload: { merchant_category_id: "${mc_id}", rotation_code: "SEP-GROCERY", bonus_multiplier: 2.0, capped_spend_cents: 50000, window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { rot_first_id: $.data.id }
          trigger:
            - call: "POST /rewards/rotations"
              payload: { merchant_category_id: "${mc_id}", rotation_code: "OCT-GROCERY", bonus_multiplier: 3.0, capped_spend_cents: 60000, window_start: "2026-10-01T00:00:00Z", window_end: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { rot_touch_id: $.data.id }
            - call: "POST /rewards/rotations"
              payload: { merchant_category_id: "${mc_id}", rotation_code: "MID-GROCERY", bonus_multiplier: 4.0, capped_spend_cents: 70000, window_start: "2026-09-15T00:00:00Z", window_end: "2026-10-15T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "the touching rotation returns 201 and EarningCategoryRotation.${rot_touch_id}.status == DRAFT"
            - "EarningCategoryRotation.${rot_touch_id}.window_start == 2026-10-01T00:00:00Z"
            - "the intersecting rotation returns 409 with error_id ERR_ROTATION_WINDOW_OVERLAP"
            - "no EarningCategoryRotation with rotation_code MID-GROCERY exists"
            - "exactly 2 EarningCategoryRotation rows exist with merchant_category_id ${mc_id}"

      - name: overlap_bonus_event_closed_windows_enforce_24_hour_buffer
        grounds:
          - validations[priority=56]
          - errors.ERR_BONUS_EVENT_WINDOW_CONFLICT
          - entities.TransferBonusEvent.fields.window_end
        distinguishing_aspect: |
          Different interval semantics on a different resource entity (PartnerAgreement, not
          MerchantCategory): CLOSED windows [window_start, window_end] plus a mandatory 24-hour
          separation buffer, admitted only when new.window_start > existing.window_end + 24h.
          Because the comparison is strict, a new event starting exactly 24 hours after the
          incumbent's end is REJECTED — the opposite outcome from the rotation rule, where exact
          touching is admitted.
        test_recipe:
          setup:
            - "One ACTIVE PartnerAgreement."
            - "One SCHEDULED TransferBonusEvent on it with the closed window [2026-09-01T00:00:00Z, 2026-09-10T00:00:00Z]."
          setup_api_calls:
            - call: "POST /rewards/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
