# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Powersports Dealer & Service — Expert tier
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: deal_amount_financed_provisional_vs_final_diverges
        grounds:
          - calculations.deal_amount_financed
          - calculations.deal_trade_equity
          - state_machines.Deal.QUOTED_to_FINANCE_SUBMITTED
          - state_machines.Deal.FINANCE_SUBMITTED_to_APPROVED
          - entities.Deal.fields.amount_financed_cents
        distinguishing_aspect: |
          On the Deal entity domain, the PROVISIONAL financed amount (computed at
          quote using TradeIn.estimated_payoff_cents=500000) is 1775900, while the
          FINAL financed amount (recomputed at approval using
          Deal.approved_lender_payoff_cents=650000) is 1937900 — same deal, two
          payoff inputs, different result.
        test_recipe:
          setup:
            - "A Customer, an IN_STOCK Unit, and an APPRAISED TradeIn exist."
            - "A Deal references all three with sale_price_cents=2000000, freight_setup_cents=0, tax_rate_bps=800, doc_fee_cents=39900, down_payment_cents=100000, approved_lender_payoff_cents=650000."
            - "Deal is quoted (provisional) then submitted to finance; the approval recomputes with the final payoff."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Pat Rider", email: "pat@x.com", phone: "555-0100" }
              as: SalesManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000001", category: "MOTORCYCLE", model_year: 2024, msrp_cents: 2200000, dealer_cost_cents: 1700000, acquisition_kind: "NEW_FLOORED" }
              as: SalesManager
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: SalesManager
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", vin: "JH2RC5007FK000002", category: "MOTORCYCLE", appraised_value_cents: 800000, estimated_payoff_cents: 500000 }
              as: SalesManager
              captures: { trade_id: $.data.id }
            - call: "POST /deals"
              payload: { customer_id: "${cust_id}", unit_id: "${unit_id}", trade_in_id: "${trade_id}", sale_price_cents: 2000000, freight_setup_cents: 0, tax_rate_bps: 800, doc_fee_cents: 39900, down_payment_cents: 100000, approved_lender_payoff_cents: 650000 }
              as: SalesManager
              captures: { deal_id: $.data.id }
            - call: "POST /deals/${deal_id}/quote"
              payload: {}
              as: SalesManager
              captures: { prov_financed: $.data.amount_financed_cents }
            - call: "POST /deals/${deal_id}/submit-finance"
              payload: {}
              as: FinanceManager
          trigger:
            - call: "POST /deals/${deal_id}/approve"
              payload: {}
              as: FinanceManager
              captures: { final_financed: $.data.amount_financed_cents }
          assert:
            - "Deal.${deal_id}.amount_financed_cents == 1937900"
            - "the value captured as prov_financed (from the quote response) == 1775900"
            - "Deal.${deal_id}.status == APPROVED"

      - name: floor_plan_interest_simple_vs_declining_diverges
        grounds:
          - calculations.floor_plan_interest
          - entities.FloorPlanLoan.fields.accrued_interest_cents
          - entities.Curtailment.fields.principal_cents
          - state_machines.FloorPlanLoan.OPEN_to_CURTAILMENT_DUE
        distinguishing_aspect: |
          On the FloorPlanLoan entity domain (different from Deal), the SIMPLE
          accrual (per-diem on original 1000000 for 100 days) is 24700 while the
          DECLINING accrual (per-diem recomputed on principal after a 200000
          curtailment at day 90) is 24200 — same loan and payments, two algorithms,
          different result.
        test_recipe:
          setup:
            - "Clock at 2026-01-01. A NEW_FLOORED Unit (dealer_cost 1000000) received into stock; a FloorPlanLoan opened on it at apr_bps=900, opened_on=2026-01-01."
            - "On day 90 the loan ages to CURTAILMENT_DUE; a SCHEDULED curtailment of 200000 is posted (loan returns to OPEN)."
            - "Clock advanced to 2026-04-11 (100 days after opened_on)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: DealerPrincipal
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000010", category: "ATV", model_year: 2024, msrp_cents: 1300000, dealer_cost_cents: 1000000, acquisition_kind: "NEW_FLOORED" }
              as: DealerPrincipal
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: DealerPrincipal
            - call: "POST /floor-plan-loans"
              payload: { unit_id: "${unit_id}", opened_on: "2026-01-01T00:00:00.000Z", apr_bps: 900 }
              as: DealerPrincipal
              captures: { loan_id: $.data.id, loan_v: $.data.version }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: DealerPrincipal
            - call: "POST /floor-plan-loans/${loan_id}/run-aging"
              payload: {}
              as: DealerPrincipal
              captures: { loan_v2: $.data.version }
            - call: "POST /curtailments"
              payload: { floor_plan_loan_id: "${loan_id}", principal_cents: 200000, reason: "SCHEDULED", expected_floor_plan_loan_version: "${loan_v2}" }
              as: DealerPrincipal
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-04-11T00:00:00.000Z" }
              as: DealerPrincipal
          trigger:
            - call: "GET /floor-plan-loans/${loan_id}?interest_basis=DECLINING"
              payload: {}
              as: DealerPrincipal
              captures: { decl_interest: $.data.accrued_interest_cents }
          assert:
            - "GET /floor-plan-loans/${loan_id}?interest_basis=DECLINING -> data.accrued_interest_cents == 24200"
            - "GET /floor-plan-loans/${loan_id}?interest_basis=SIMPLE -> data.accrued_interest_cents == 24700"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: ro_labor_total_tier_warranty_cap_nonlinear
        grounds:
          - calculations.ro_labor_total
          - entities.RepairOrder.fields.labor_total_cents
          - entities.RepairOrder.fields.shop_supplies_cents
          - entities.ServiceLine.fields.flat_rate_hours
          - state_machines.RepairOrder.IN_PROGRESS_to_WORK_COMPLETE
        distinguishing_aspect: |
          Mode (a): >=3 inputs (total flat hours, is_warranty flag, tier selection)
          with nested branch + tiered rate + min-cap. Retail RO with lines [3.0,1.5]
          (4.5h -> tier2 rate 11500) yields labor 51750 and shop_supplies
          min(4140,5000)=4140 -> ro labor portion 55890; not a single linear product.
        test_recipe:
          setup:
            - "A Customer, an IN_STOCK Unit, and a Technician (hourly_cost any) exist; clock at 2026-06-01."
            - "A retail RepairOrder (is_warranty=false) is opened with two ServiceLines: 3.0h and 1.5h flat-rate; RO is started then completed."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: DealerPrincipal
            - call: "POST /customers"
              payload: { full_name: "Sam Wrench", email: "sam@x.com", phone: "555-0102" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000020", category: "MOTORCYCLE", model_year: 2022, msrp_cents: 1500000, dealer_cost_cents: 1100000, acquisition_kind: "CASH_OWNED" }
              as: SalesManager
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: SalesManager
            - call: "POST /technicians"
              payload: { name: "Tech A", hourly_cost_cents: 4000, cleanup_buffer_minutes: 30 }
              as: ServiceAdvisor
              captures: { tech_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", technician_id: "${tech_id}", appointment_start: "2026-06-02T09:00:00.000Z", appointment_end: "2026-06-02T12:00:00.000Z", is_warranty: false, authorized_amount_cents: 100000 }
              as: ServiceAdvisor
              captures: { ro_id: $.data.id }
            - call: "POST /service-lines"
              payload: { repair_order_id: "${ro_id}", operation_code: "DIAG-1", flat_rate_hours: 3.0 }
              as: ServiceAdvisor
            - call: "POST /service-lines"
              payload: { repair_order_id: "${ro_id}", operation_code: "BRK-1", flat_rate_hours: 1.5 }
              as: ServiceAdvisor
            - call: "POST /repair-orders/${ro_id}/start"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /repair-orders/${ro_id}/complete"
              payload: {}
              as: ServiceAdvisor
              captures: { labor: $.data.labor_total_cents, supplies: $.data.shop_supplies_cents }
          assert:
            - "RepairOrder.${ro_id}.labor_total_cents == 51750"
            - "RepairOrder.${ro_id}.shop_supplies_cents == 4140"
            - "RepairOrder.${ro_id}.work_status == WORK_COMPLETE"

      - name: deal_out_the_door_per_line_rounding_order_pinned
        grounds:
          - calculations.deal_out_the_door
          - entities.Deal.fields.out_the_door_cents
          - entities.Deal.fields.freight_setup_cents
          - state_machines.Deal.DRAFT_to_QUOTED
        distinguishing_aspect: |
          Mode (b): TWO taxable lines (sale net of trade, and freight) each rounded
          to whole cents BEFORE summing. With sale=1234550, freight=4575,
          tax=825bps, doc=39900, no trade: per-line rounding yields OTD 1381252,
          whereas summing the two fractional taxes and rounding once yields 1381253.
          The scaffold pins per-line; expected literal is 1381252.
        test_recipe:
          setup:
            - "A Customer and an IN_STOCK Unit (no trade). A Deal references them with sale_price_cents=1234550, freight_setup_cents=4575, tax_rate_bps=825, doc_fee_cents=39900."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Lee Buyer", email: "lee@x.com", phone: "555-0103" }
              as: SalesManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000030", category: "UTV", model_year: 2025, msrp_cents: 1600000, dealer_cost_cents: 1200000, acquisition_kind: "CASH_OWNED" }
              as: SalesManager
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: SalesManager
            - call: "POST /deals"
              payload: { customer_id: "${cust_id}", unit_id: "${unit_id}", sale_price_cents: 1234550, freight_setup_cents: 4575, tax_rate_bps: 825, doc_fee_cents: 39900, down_payment_cents: 0 }
              as: SalesManager
              captures: { deal_id: $.data.id }
          trigger:
            - call: "POST /deals/${deal_id}/quote"
              payload: {}
              as: SalesManager
              captures: { otd: $.data.out_the_door_cents }
          assert:
            - "Deal.${deal_id}.out_the_door_cents == 1381252"
            - "Deal.${deal_id}.status == QUOTED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: deal_decline_requote_cycle
        grounds:
          - state_machines.Deal.FINANCE_SUBMITTED_to_DECLINED
          - state_machines.Deal.DECLINED_to_QUOTED
          - entities.Deal.fields.status
        distinguishing_aspect: |
          On the Deal entity, the machine is CYCLIC: FINANCE_SUBMITTED -> DECLINED
          -> QUOTED returns the Deal to a non-terminal earlier state and re-holds
          the Unit, proving a revision loop (not a linear pipeline).
        test_recipe:
          setup:
            - "A Customer, IN_STOCK Unit, and a Deal exist; quoted, submitted to finance, then declined (Unit released back to IN_STOCK)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cy Loop", email: "cy@x.com", phone: "555-0104" }
              as: SalesManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000040", category: "MOTORCYCLE", model_year: 2023, msrp_cents: 1400000, dealer_cost_cents: 1000000, acquisition_kind: "CASH_OWNED" }
              as: SalesManager
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: SalesManager
            - call: "POST /deals"
              payload: { customer_id: "${cust_id}", unit_id: "${unit_id}", sale_price_cents: 1400000, tax_rate_bps: 800, down_payment_cents: 0 }
              as: SalesManager
              captures: { deal_id: $.data.id }
            - call: "POST /deals/${deal_id}/quote"
              payload: {}
              as: SalesManager
            - call: "POST /deals/${deal_id}/submit-finance"
              payload: {}
              as: FinanceManager
            - call: "POST /deals/${deal_id}/decline"
              payload: {}
              as: FinanceManager
          trigger:
            - call: "POST /deals/${deal_id}/quote"
              payload: {}
              as: SalesManager
              captures: { status_after: $.data.status }
          assert:
            - "Deal.${deal_id}.status == QUOTED"
            - "Unit.${unit_id}.status == ON_HOLD"
            - "Unit.${unit_id}.held_by_deal_id == ${deal_id}"

      - name: repair_order_parallel_work_and_billing_dimensions
        grounds:
          - state_machines.RepairOrder.OPEN_to_IN_PROGRESS
          - state_machines.RepairOrder.IN_PROGRESS_to_WORK_COMPLETE
          - state_machines.RepairOrder.UNBILLED_to_INVOICED
          - entities.RepairOrder.fields.work_status
          - entities.RepairOrder.fields.billing_status
        distinguishing_aspect: |
          On the RepairOrder entity (different from Deal), work_status and
          billing_status are PARALLEL independent dimensions: work advances
          OPEN->IN_PROGRESS->WORK_COMPLETE while billing remains UNBILLED until a
          separate invoice transition flips it to INVOICED; the two fields are
          read independently on the same row.
        test_recipe:
          setup:
            - "A retail RO with one ServiceLine (2.0h) is started and completed; billing still UNBILLED."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: DealerPrincipal
            - call: "POST /customers"
              payload: { full_name: "Dee Tech", email: "dee@x.com", phone: "555-0105" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000050", category: "ATV", model_year: 2021, msrp_cents: 900000, dealer_cost_cents: 700000, acquisition_kind: "CASH_OWNED" }
              as: SalesManager
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: SalesManager
            - call: "POST /technicians"
              payload: { name: "Tech B", hourly_cost_cents: 4000 }
              as: ServiceAdvisor
              captures: { tech_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", technician_id: "${tech_id}", appointment_start: "2026-06-03T09:00:00.000Z", appointment_end: "2026-06-03T11:00:00.000Z", is_warranty: false, authorized_amount_cents: 50000 }
              as: ServiceAdvisor
              captures: { ro_id: $.data.id }
            - call: "POST /service-lines"
              payload: { repair_order_id: "${ro_id}", operation_code: "OIL-1", flat_rate_hours: 2.0 }
              as: ServiceAdvisor
            - call: "POST /repair-orders/${ro_id}/start"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /repair-orders/${ro_id}/complete"
              payload: {}
              as: ServiceAdvisor
              captures: { ws: $.data.work_status, bs: $.data.billing_status }
          assert:
            - "RepairOrder.${ro_id}.work_status == WORK_COMPLETE"
            - "RepairOrder.${ro_id}.billing_status == UNBILLED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: deal_deliver_cascades_unit_then_floorplan_payoff_depth3
        grounds:
          - state_machines.Deal.APPROVED_to_DELIVERED
          - state_machines.Unit.SOLD_to_DELIVERED
          - state_machines.FloorPlanLoan.OPEN_to_PAID_OFF
          - entities.FloorPlanLoan.fields.principal_outstanding_cents
        distinguishing_aspect: |
          Depth-3 cascade triggered by Deal deliver: hop1 Deal->Unit (SOLD->
          DELIVERED), hop2 Unit DELIVERED triggers a SALE_PAYOFF Curtailment on the
          unit's FloorPlanLoan, hop3 that curtailment drives the loan OPEN->PAID_OFF
          with principal_outstanding_cents==0. Each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "A NEW_FLOORED Unit (dealer_cost 1000000) received, floored (loan OPEN, principal 1000000), quoted/approved deal so Unit is SOLD."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DealerPrincipal
            - call: "POST /customers"
              payload: { full_name: "Mo Deliver", email: "mo@x.com", phone: "555-0106" }
              as: SalesManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000060", category: "MOTORCYCLE", model_year: 2024, msrp_cents: 1300000, dealer_cost_cents: 1000000, acquisition_kind: "NEW_FLOORED" }
              as: SalesManager
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: SalesManager
            - call: "POST /floor-plan-loans"
              payload: { unit_id: "${unit_id}", opened_on: "2026-06-01T00:00:00.000Z", apr_bps: 900 }
              as: DealerPrincipal
              captures: { loan_id: $.data.id }
            - call: "POST /deals"
              payload: { customer_id: "${cust_id}", unit_id: "${unit_id}", sale_price_cents: 1500000, tax_rate_bps: 800, down_payment_cents: 0 }
              as: SalesManager
              captures: { deal_id: $.data.id }
            - call: "POST /deals/${deal_id}/quote"
              payload: {}
              as: SalesManager
            - call: "POST /deals/${deal_id}/submit-finance"
              payload: {}
              as: FinanceManager
            - call: "POST /deals/${deal_id}/approve"
              payload: {}
              as: FinanceManager
          trigger:
            - call: "POST /deals/${deal_id}/deliver"
              payload: {}
              as: SalesManager
          assert:
            - "Deal.${deal_id}.status == DELIVERED"
            - "Unit.${unit_id}.status == DELIVERED"
            - "FloorPlanLoan.${loan_id}.status == PAID_OFF"
            - "FloorPlanLoan.${loan_id}.principal_outstanding_cents == 0"

      - name: deal_deliver_with_trade_cascades_titled_then_mints_unit_depth2
        grounds:
          - state_machines.Deal.APPROVED_to_DELIVERED
          - state_machines.TradeIn.ACCEPTED_to_TITLED
          - entities.TradeIn.fields.resulting_unit_id
          - entities.TradeIn.fields.status
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (Deal deliver on a trade deal):
          hop1 Deal->TradeIn (ACCEPTED->TITLED), hop2 the TITLED transition mints a
          new inventory Unit (acquisition_kind=TRADE_IN, IN_STOCK) and sets
          resulting_unit_id. Distinct propagation pattern from the floor-plan payoff
          cascade.
        test_recipe:
          setup:
            - "A Customer, IN_STOCK Unit (CASH_OWNED, no floor plan), an APPRAISED TradeIn; deal quoted/approved (Unit SOLD, TradeIn ACCEPTED)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ty Trade", email: "ty@x.com", phone: "555-0107" }
              as: SalesManager
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000070", category: "UTV", model_year: 2024, msrp_cents: 2000000, dealer_cost_cents: 1500000, acquisition_kind: "CASH_OWNED" }
              as: SalesManager
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: SalesManager
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", vin: "JH2RC5007FK000071", category: "ATV", appraised_value_cents: 600000, estimated_payoff_cents: 100000 }
              as: SalesManager
              captures: { trade_id: $.data.id }
            - call: "POST /deals"
              payload: { customer_id: "${cust_id}", unit_id: "${unit_id}", trade_in_id: "${trade_id}", sale_price_cents: 2000000, tax_rate_bps: 800, down_payment_cents: 0, approved_lender_payoff_cents: 100000 }
              as: SalesManager
              captures: { deal_id: $.data.id }
            - call: "POST /deals/${deal_id}/quote"
              payload: {}
              as: SalesManager
            - call: "POST /deals/${deal_id}/submit-finance"
              payload: {}
              as: FinanceManager
            - call: "POST /deals/${deal_id}/approve"
              payload: {}
              as: FinanceManager
          trigger:
            - call: "POST /deals/${deal_id}/deliver"
              payload: {}
              as: SalesManager
          assert:
            - "TradeIn.${trade_id}.status == TITLED"
            - "TradeIn.${trade_id}.resulting_unit_id is non-null"
            - "GET /trade-ins/${trade_id} -> data.resulting_unit_id references a Unit with acquisition_kind==TRADE_IN and status==IN_STOCK and dealer_cost_cents==600000"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ro_invoice_state_beats_fiscal_over_authorization
        grounds:
          - validations[priority=7]
          - validations[priority=13]
          - errors[ERR_WORK_NOT_COMPLETE]
          - errors[ERR_OVER_AUTHORIZATION]
          - state_machines.RepairOrder.UNBILLED_to_INVOICED
        distinguishing_aspect: |
          Error-category pair state (priority 7, ERR_WORK_NOT_COMPLETE) vs
          business_fiscal (priority 13, ERR_OVER_AUTHORIZATION). An RO that is both
          not WORK_COMPLETE AND whose total would exceed authorized_amount returns
          the higher-priority state error ERR_WORK_NOT_COMPLETE (409), not the
          fiscal ERR_OVER_AUTHORIZATION.
        test_recipe:
          setup:
            - "A retail RO with one 3.0h line (labor would be > authorized 10000) is started but NOT completed (work_status=IN_PROGRESS)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: DealerPrincipal
            - call: "POST /customers"
              payload: { full_name: "Ann Order", email: "ann@x.com", phone: "555-0108" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000080", category: "MOTORCYCLE", model_year: 2020, msrp_cents: 800000, dealer_cost_cents: 600000, acquisition_kind: "CASH_OWNED" }
              as: SalesManager
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: SalesManager
            - call: "POST /technicians"
              payload: { name: "Tech C", hourly_cost_cents: 4000 }
              as: ServiceAdvisor
              captures: { tech_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", technician_id: "${tech_id}", appointment_start: "2026-06-04T09:00:00.000Z", appointment_end: "2026-06-04T12:00:00.000Z", is_warranty: false, authorized_amount_cents: 10000 }
