            - "Settlement.${stl_1}.state_share_cents == 1125000"
            - "Settlement.${stl_1}.noticing_party_share_cents == 375000"
            - "Settlement.${stl_1}.total_settlement_cents == 2400000"
            - "Settlement.${stl_1}.status == PROPOSED and round_count == 0"

      - name: warning_content_occupancy_precedence_over_food_and_short_form
