              payload: { customer_id: "${cu2_id}", unit_id: "${ua_id}", jurisdiction_id: "${j2_id}", floorplan_configuration_id: "${c2_id}", site_address: "1 Rig Road, Rural TX", start_date: "2026-10-01", term_months: 12 }
              as: LeasingAgent
              as_user_id: "agent-77"
              captures: { la_id: $.data.id }
