  - section: calculations
    instances:
      - name: corner_bgm_exemption_exempt_within_size_and_speaker_limits
        claim_type: correct_result
        grounds:
          - calculations.bgm_exemption_determination
          - entities.Venue.fields.bgm_exemption_status
          - entities.Venue.fields.bgm_exemption_reason
          - endpoints.POST_licensing_venues_venue_id_exemption_analysis
        distinguishing_aspect: "A BACKGROUND_ONLY venue at 1800 sqft with exactly 6 speakers and exactly 4 in one room, no cover charge and retransmission_only true falls through every disqualifying clause to EXEMPT / WITHIN_SIZE_AND_SPEAKER_LIMITS, and the analysis bumps Venue.version."
        test_recipe:
          setup:
            - "Venue V3 is a FITNESS_STUDIO with a complete background-music survey that sits on both speaker limits"
          setup_api_calls:
            - call: "POST /licensing/venues"
              payload: { legal_name: "Pulse Fitness Studio", venue_category: "FITNESS_STUDIO", seating_capacity: 0, standing_capacity: 40, occupancy_limit: 45, music_use_profile: "BACKGROUND_ONLY", weekly_live_performance_nights: 0, annual_cover_revenue_cents: 0, gross_square_feet: 1800, speaker_count: 6, max_speakers_per_room: 4, has_cover_charge: false, retransmission_only: true }
              as: LicensingAdmin
              captures: { v3_id: "$.data.id", v3_status0: "$.data.bgm_exemption_status", v3_ver0: "$.data.version" }
          trigger:
            - call: "POST /licensing/venues/${v3_id}/exemption-analysis"
              payload: {}
              as: LicensingAdmin
          assert:
            - "The captured ${v3_status0} was NOT_ANALYZED with bgm_exemption_reason null, so the verdict is not set at creation"
            - "After the analysis bgm_exemption_status == EXEMPT and bgm_exemption_reason == WITHIN_SIZE_AND_SPEAKER_LIMITS"
            - "Venue.${v3_id}.version == ${v3_ver0} + 1"
            - "No other field changed: gross_square_feet is still 1800, speaker_count 6, max_speakers_per_room 4"

      - name: corner_bgm_exemption_size_limit_boundary_by_venue_category
        claim_type: threshold
        grounds:
          - calculations.bgm_exemption_determination.constants.OTHER_ESTABLISHMENT_SQFT_LIMIT
          - calculations.bgm_exemption_determination.constants.FOOD_DRINK_SQFT_LIMIT
          - endpoints.PATCH_licensing_venues_venue_id
        distinguishing_aspect: "The square-foot boundary is inclusive and category-dependent: a FITNESS_STUDIO is EXEMPT at exactly 2000 and NOT_EXEMPT / SIZE_LIMIT_EXCEEDED at 2001, while a BAR_GRILL at 2001 is still EXEMPT because its limit is 3750."
        test_recipe:
          setup:
            - "Venue V3 is a FITNESS_STUDIO of exactly 2000 gross square feet; Venue V4 is a BAR_GRILL of 2001, both BACKGROUND_ONLY with identical speaker data"
            - "V3 has already been analysed once at 2000 sqft"
          setup_api_calls:
            - call: "POST /licensing/venues"
              payload: { legal_name: "Pulse Fitness Studio", venue_category: "FITNESS_STUDIO", seating_capacity: 0, standing_capacity: 40, occupancy_limit: 45, music_use_profile: "BACKGROUND_ONLY", weekly_live_performance_nights: 0, annual_cover_revenue_cents: 0, gross_square_feet: 2000, speaker_count: 6, max_speakers_per_room: 4, has_cover_charge: false, retransmission_only: true }
              as: LicensingAdmin
              captures: { v3_id: "$.data.id" }
            - call: "POST /licensing/venues"
              payload: { legal_name: "Corner Tap Bar and Grill", venue_category: "BAR_GRILL", seating_capacity: 40, standing_capacity: 60, occupancy_limit: 90, music_use_profile: "BACKGROUND_ONLY", weekly_live_performance_nights: 0, annual_cover_revenue_cents: 0, gross_square_feet: 2001, speaker_count: 6, max_speakers_per_room: 4, has_cover_charge: false, retransmission_only: true }
              as: LicensingAdmin
              captures: { v4_id: "$.data.id" }
            - call: "POST /licensing/venues/${v3_id}/exemption-analysis"
              payload: {}
              as: LicensingAdmin
              captures: { v3_at_limit: "$.data.bgm_exemption_status" }
            - call: "PATCH /licensing/venues/${v3_id}"
              payload: { gross_square_feet: 2001 }
              as: LicensingAdmin
              captures: { v3_after_patch: "$.data.bgm_exemption_status" }
          trigger:
            - call: "POST /licensing/venues/${v3_id}/exemption-analysis"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/venues/${v4_id}/exemption-analysis"
              payload: {}
              as: LicensingAdmin
          assert:
            - "The captured ${v3_at_limit} was EXEMPT: gross_square_feet == OTHER_ESTABLISHMENT_SQFT_LIMIT (2000) is inside the limit"
            - "The captured ${v3_after_patch} was NOT_ANALYZED, because PATCH resets the verdict and its reason to null"
            - "After the re-analysis Venue.${v3_id} reads NOT_EXEMPT / SIZE_LIMIT_EXCEEDED at 2001"
            - "Venue.${v4_id} reads EXEMPT / WITHIN_SIZE_AND_SPEAKER_LIMITS at the same 2001 sqft, because a BAR_GRILL is measured against FOOD_DRINK_SQFT_LIMIT (3750)"

      - name: corner_bgm_exemption_first_matching_clause_wins
        claim_type: constants_applied
        grounds:
          - calculations.bgm_exemption_determination.formula
          - calculations.bgm_exemption_determination.constants.MAX_TOTAL_SPEAKERS
          - calculations.bgm_exemption_determination.constants.MAX_SPEAKERS_PER_ROOM
        distinguishing_aspect: "The clause ladder is ordered, not a set of independent tests: profile ineligibility outranks a compliant survey, a licensed BGM service outranks an oversized noisy room with a cover charge, DATA_INCOMPLETE outranks a cover charge, and the cover charge outranks the retransmission clause."
        test_recipe:
          setup:
            - "Five venues are created, each isolating one rung of the ladder, all otherwise identical to the exempt baseline"
          setup_api_calls:
            - call: "POST /licensing/venues"
              payload: { legal_name: "Mixed Use Tavern", venue_category: "BAR_GRILL", seating_capacity: 40, standing_capacity: 60, occupancy_limit: 90, music_use_profile: "MIXED", weekly_live_performance_nights: 2, annual_cover_revenue_cents: 0, gross_square_feet: 1800, speaker_count: 6, max_speakers_per_room: 4, has_cover_charge: false, retransmission_only: true }
              as: LicensingAdmin
              captures: { va_id: "$.data.id" }
            - call: "POST /licensing/venues"
              payload: { legal_name: "Atrium Hotel Lobby", venue_category: "HOTEL", seating_capacity: 0, standing_capacity: 30, occupancy_limit: 60, music_use_profile: "BACKGROUND_ONLY", weekly_live_performance_nights: 0, annual_cover_revenue_cents: 500000, gross_square_feet: 9999, speaker_count: 40, max_speakers_per_room: 20, has_cover_charge: true, retransmission_only: false, uses_licensed_bgm_service: true, bgm_service_provider: "Ambient Feed Co" }
              as: LicensingAdmin
