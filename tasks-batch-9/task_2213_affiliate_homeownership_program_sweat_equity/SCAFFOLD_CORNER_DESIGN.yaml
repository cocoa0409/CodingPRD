            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-2002", street_address: "44 Oak St", acquisition_cost_cents: 4000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { err_site: $.data.error_id } }
