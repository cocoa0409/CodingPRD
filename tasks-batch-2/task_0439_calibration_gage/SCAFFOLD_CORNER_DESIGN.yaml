# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index (breadth probe)
# Calibration & Gage Management (task_0439) — Expert band
# Walks references/claim-extraction-guide.md row-by-row against §1.1–§1.7.
# Sections/claim_types are taken verbatim from that guide.
# Names are unique across the union with SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: corner_instrument_create_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Instrument
          - endpoints["POST /instruments"]
        distinguishing_aspect: "POST /instruments with all required fields → 201; lifecycle_status defaults ACTIVE, calibration_status defaults UNCALIBRATED, version 1, open_oot_count 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /instruments"
              payload: { asset_tag: "INST-NEW", description: "New gauge", nominal_value: 10.0, tolerance_plus: 0.1, tolerance_minus: 0.1, measurement_unit: "mm", calibration_interval_epochs: 30, criticality: "MAJOR" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, lc: $.data.lifecycle_status, cs: $.data.calibration_status, v: $.data.version }
          assert:
            - "create response status code == 201"
            - "Instrument.lifecycle_status == ACTIVE"
            - "Instrument.calibration_status == UNCALIBRATED"
            - "Instrument.version == 1"
            - "Instrument.open_oot_count == 0"

      - name: corner_instrument_get_not_found
        claim_type: Not Found
        grounds:
          - entities.Instrument
          - endpoints["GET /instruments/{id}"]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /instruments/{unknown-uuid} → 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /instruments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: QualityEngineer
              captures: { err: $.data.error_id }
          assert:
            - "GET response status code == 404"
            - "GET response data.error_id == ERR_NOT_FOUND"

      - name: corner_instrument_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.Instrument.fields.asset_tag
          - endpoints["POST /instruments"]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /instruments omitting required asset_tag → 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /instruments"
              payload: { description: "No tag", nominal_value: 10.0, tolerance_plus: 0.1, tolerance_minus: 0.1, measurement_unit: "mm", calibration_interval_epochs: 30, criticality: "MAJOR" }
              as: QualityEngineer
              captures: { err: $.data.error_id }
          assert:
            - "create response status code == 422"
            - "create response data.error_id == ERR_INVALID_REQUEST"

      - name: corner_instrument_invalid_enum_criticality
        claim_type: Type Constraints
        grounds:
          - entities.Instrument.fields.criticality
          - endpoints["POST /instruments"]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /instruments with criticality not in {CRITICAL,MAJOR,MINOR} → 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /instruments"
              payload: { asset_tag: "INST-BADENUM", description: "Bad enum", nominal_value: 10.0, tolerance_plus: 0.1, tolerance_minus: 0.1, measurement_unit: "mm", calibration_interval_epochs: 30, criticality: "URGENT" }
              as: QualityEngineer
              captures: { err: $.data.error_id }
          assert:
            - "create response status code == 422"
            - "create response data.error_id == ERR_INVALID_REQUEST"

      - name: corner_instrument_negative_tolerance_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Instrument.fields.tolerance_plus
          - endpoints["POST /instruments"]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /instruments with tolerance_plus < 0 → 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /instruments"
              payload: { asset_tag: "INST-NEGTOL", description: "Neg tol", nominal_value: 10.0, tolerance_plus: -0.1, tolerance_minus: 0.1, measurement_unit: "mm", calibration_interval_epochs: 30, criticality: "MAJOR" }
              as: QualityEngineer
              captures: { err: $.data.error_id }
          assert:
            - "create response status code == 422"
            - "create response data.error_id == ERR_INVALID_REQUEST"

      - name: corner_system_fields_input_ignored_on_instrument_create
        claim_type: System Fields
        grounds:
          - entities.Instrument.fields.lifecycle_status
          - endpoints["POST /instruments"]
        distinguishing_aspect: "Client-supplied lifecycle_status is ignored; server forces ACTIVE on create (system field)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /instruments"
              payload: { asset_tag: "INST-IGN", description: "Ignored", nominal_value: 10.0, tolerance_plus: 0.1, tolerance_minus: 0.1, measurement_unit: "mm", calibration_interval_epochs: 30, criticality: "MAJOR" }
              as: QualityEngineer
              captures: { lc: $.data.lifecycle_status }
          assert:
            - "Instrument.lifecycle_status == ACTIVE (any input lifecycle_status ignored)"

      - name: corner_clockstate_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.ClockState
          - endpoints["GET /_clock"]
        distinguishing_aspect: "ClockState has common_fields:false → exposes current_epoch and created_at but no version field; boot value current_epoch == 0."
        test_recipe:
          setup: ["Empty DB, clock unset (boot default)."]
          setup_api_calls: []
          trigger:
            - call: "GET /_clock"
              payload: {}
              as: QualityEngineer
              captures: { e: $.data.current_epoch }
          assert:
            - "GET /_clock data.current_epoch == 0 (boot default 2026-01-01T00:00:00Z)"

      - name: corner_standard_listing_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.CalibrationStandard
          - endpoints["GET /calibration-standards"]
        distinguishing_aspect: "GET /calibration-standards returns array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["One standard registered."]
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "S-LIST", nist_test_number: "NIST-L1", nominal_value: 1.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
          trigger:
            - call: "GET /calibration-standards?limit=10&offset=0"
              payload: {}
              as: Metrologist
          assert:
            - "list response_type == array"
            - "list response meta carries total_count and has_more"

      - name: corner_standard_computed_traceability_depth
        claim_type: Computed Fields
        grounds:
          - entities.CalibrationStandard.fields.traceability_depth
          - calculations.standard_traceability
          - endpoints["GET /calibration-standards/{id}"]
        distinguishing_aspect: "A standard whose parent is the NIST anchor gets traceability_depth == 1 (anchor depth 0 + 1); input depth ignored/computed."
        test_recipe:
          setup: ["Anchor standard (no parent) and a child standard pointing to it."]
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "ANCHOR", nist_test_number: "NIST-A", nominal_value: 1.0, standard_unit: "mm", uncertainty: 0.0005, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { anchor_id: $.data.id }
            - call: "POST /calibration-standards"
              payload: { name: "CHILD", nist_test_number: "", parent_standard_id: "${anchor_id}", nominal_value: 1.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { child_id: $.data.id }
          trigger:
            - call: "GET /calibration-standards/${child_id}"
              payload: {}
              as: Metrologist
              captures: { depth: $.data.traceability_depth }
          assert:
            - "CalibrationStandard.${child_id}.traceability_depth == 1"
            - "CalibrationStandard.${child_id}.is_traceable == true"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: corner_cancel_draft_event_then_invalid_state_on_recancel
        claim_type: Invalid Transitions
        grounds:
          - state_machines.CalibrationEvent.DRAFT_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling an already-CANCELLED event → 409 ERR_INVALID_STATE; terminal-state lockdown for CANCELLED."
        test_recipe:
          setup: ["A DRAFT calibration event, then cancelled."]
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "S-CC", nist_test_number: "NIST-CC", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-CC", description: "CC gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "MINOR" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 5, expected_instrument_version: "${inst_v}" }
              as: Technician
              captures: { ev: $.data.id }
            - call: "POST /calibration-events/${ev}/cancel"
              payload: {}
              as: Technician
          trigger:
            - call: "POST /calibration-events/${ev}/cancel"
              payload: {}
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "second cancel response status code == 409"
            - "second cancel response data.error_id == ERR_INVALID_STATE"

      - name: corner_start_event_without_measurement_points
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.CalibrationEvent.DRAFT_to_IN_PROGRESS
          - validations[priority=15]
          - errors[ERR_NO_MEASUREMENT_POINTS]
        distinguishing_aspect: "Starting an event that has zero measurement points → 409 ERR_NO_MEASUREMENT_POINTS."
        test_recipe:
          setup: ["A DRAFT event with no measurement points, traceable standard, ACTIVE instrument."]
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "S-NP", nist_test_number: "NIST-NP", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-NP", description: "NP gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "MINOR" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 5, expected_instrument_version: "${inst_v}" }
              as: Technician
              captures: { ev: $.data.id }
          trigger:
            - call: "POST /calibration-events/${ev}/start"
              payload: {}
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "start response status code == 409"
            - "start response data.error_id == ERR_NO_MEASUREMENT_POINTS"

      - name: corner_pass_finalize_bubbles_up_instrument_in_tolerance
        claim_type: Side Effect Execution
        grounds:
          - state_machines.CalibrationEvent.IN_PROGRESS_to_PASSED
          - calculations.next_due_epoch
          - entities.Instrument.fields.next_due_epoch
        distinguishing_aspect: "PASS finalize sets instrument calibration_status IN_TOLERANCE and next_due_epoch = scheduled_epoch + interval (5 + 100 = 105)."
        test_recipe:
          setup: ["ACTIVE instrument (interval 100); IN_PROGRESS event at epoch 5, single passing point."]
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "S-BU", nist_test_number: "NIST-BU", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-BU", description: "BU gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "MAJOR" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 5, expected_instrument_version: "${inst_v}" }
              as: Technician
              captures: { ev: $.data.id }
            - call: "POST /calibration-events/${ev}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.00 }
              as: Technician
            - call: "POST /calibration-events/${ev}/start"
              payload: {}
              as: Technician
          trigger:
            - call: "POST /calibration-events/${ev}/finalize"
              payload: {}
              as: Technician
              captures: { res: $.data.result }
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: QualityEngineer
              captures: { cs: $.data.calibration_status, ndue: $.data.next_due_epoch }
          assert:
            - "CalibrationEvent.${ev}.result == PASS"
            - "Instrument.${inst_id}.calibration_status == IN_TOLERANCE"
            - "Instrument.${inst_id}.next_due_epoch == 105"
            - "Instrument.${inst_id}.last_calibration_epoch == 5"

      - name: corner_conditional_pass_when_as_left_recovers
        claim_type: Valid Transition
        grounds:
          - state_machines.CalibrationEvent.IN_PROGRESS_to_CONDITIONAL_PASS
          - calculations.cal_result
          - entities.CalibrationEvent.fields.result
        distinguishing_aspect: "A point failing as_found but passing as_left, with tur>=4.0 → result CONDITIONAL, status CONDITIONAL_PASS, instrument IN_TOLERANCE."
        test_recipe:
          setup: ["ACTIVE instrument (tol ±0.05, standard uncertainty 0.001 → tur 50); point as_found 25.10 (fail) as_left 25.00 (pass)."]
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "S-CP", nist_test_number: "NIST-CP", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-CP", description: "CP gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "MAJOR" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 5, expected_instrument_version: "${inst_v}" }
              as: Technician
              captures: { ev: $.data.id }
            - call: "POST /calibration-events/${ev}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.10, as_left_value: 25.00 }
              as: Technician
            - call: "POST /calibration-events/${ev}/start"
              payload: {}
              as: Technician
          trigger:
            - call: "POST /calibration-events/${ev}/finalize"
              payload: {}
              as: Technician
              captures: { res: $.data.result, aft: $.data.as_found_in_tolerance, alt: $.data.as_left_in_tolerance }
          assert:
            - "CalibrationEvent.${ev}.result == CONDITIONAL"
            - "CalibrationEvent.${ev}.status == CONDITIONAL_PASS"
            - "CalibrationEvent.${ev}.as_found_in_tolerance == false"
            - "CalibrationEvent.${ev}.as_left_in_tolerance == true"

      - name: corner_certificate_reject_then_reissue_revert
        claim_type: Valid Transition
        grounds:
          - state_machines.CalibrationCertificate.ISSUED_to_REJECTED
          - state_machines.CalibrationCertificate.REJECTED_to_ISSUED
        distinguishing_aspect: "An ISSUED certificate rejected → REJECTED then reissued → back to ISSUED (branching-with-revert machine)."
        test_recipe:
          setup: ["Accredited vendor; IN_PROGRESS external event; an ISSUED certificate."]
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "S-RR", nist_test_number: "NIST-RR", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /calibration-vendors"
              payload: { name: "V-RR", accreditation_body: "NVLAP", accreditation_number: "NV-1", accredited_through_epoch: 9999 }
              as: Metrologist
              captures: { vend_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-RR", description: "RR gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "MAJOR" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", vendor_id: "${vend_id}", scheduled_epoch: 5, expected_instrument_version: "${inst_v}" }
              as: Technician
              captures: { ev: $.data.id }
            - call: "POST /calibration-events/${ev}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.00 }
              as: Technician
            - call: "POST /calibration-events/${ev}/start"
              payload: {}
              as: Technician
            - call: "POST /calibration-events/${ev}/certificates"
              payload: { vendor_id: "${vend_id}", certificate_number: "C-100", issued_epoch: 5 }
              as: Metrologist
              captures: { cert_id: $.data.id }
            - call: "POST /certificates/${cert_id}/reject"
              payload: {}
              as: Metrologist
          trigger:
            - call: "POST /certificates/${cert_id}/reissue"
              payload: {}
              as: Metrologist
              captures: { st: $.data.status }
          assert:
            - "CalibrationCertificate.${cert_id}.status == ISSUED (reverted from REJECTED)"

      - name: corner_terminal_retired_instrument_blocks_event_create
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Instrument.lifecycle_status_to_RETIRED
          - errors[ERR_INSTRUMENT_RETIRED]
        distinguishing_aspect: "After retire, POST a calibration event to the RETIRED instrument → 409 ERR_INSTRUMENT_RETIRED."
        test_recipe:
          setup: ["A freshly registered ACTIVE instrument with no open events/impacts, then retired."]
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "S-RET", nist_test_number: "NIST-RET", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-RET", description: "RET gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "MINOR" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/retire"
              payload: { expected_instrument_version: "${inst_v}" }
              as: QualityEngineer
              captures: { inst_v2: $.data.version }
          trigger:
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 5, expected_instrument_version: "${inst_v2}" }
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "create response status code == 409"
            - "create response data.error_id == ERR_INSTRUMENT_RETIRED"

      - name: corner_release_blocked_while_open_impact_exists
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Instrument.lifecycle_status_QUARANTINED_to_ACTIVE
          - validations[priority=18]
          - errors[ERR_OPEN_IMPACT_EXISTS]
        distinguishing_aspect: "Releasing a QUARANTINED instrument while its auto-opened impact is still OPEN → 409 ERR_OPEN_IMPACT_EXISTS."
        test_recipe:
          setup: ["Instrument QUARANTINED by a FAILED event with its impact still OPEN."]
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "S-REL", nist_test_number: "NIST-REL", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-REL", description: "REL gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "CRITICAL" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 5, expected_instrument_version: "${inst_v}" }
              as: Technician
              captures: { ev: $.data.id }
            - call: "POST /calibration-events/${ev}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.40, as_left_value: 25.40 }
              as: Technician
            - call: "POST /calibration-events/${ev}/start"
              payload: {}
              as: Technician
            - call: "POST /calibration-events/${ev}/finalize"
              payload: {}
              as: Technician
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: QualityEngineer
              captures: { inst_v2: $.data.version }
          trigger:
            - call: "POST /instruments/${inst_id}/release"
              payload: { expected_instrument_version: "${inst_v2}" }
              as: QualityEngineer
              captures: { err: $.data.error_id }
          assert:
            - "release response status code == 409"
            - "release response data.error_id == ERR_OPEN_IMPACT_EXISTS"

      - name: corner_fail_finalize_cascade_chain
        claim_type: Cross-entity
        grounds:
          - state_machines.CalibrationEvent.IN_PROGRESS_to_FAILED
          - state_machines.Instrument.calibration_status_to_OUT_OF_TOLERANCE
        excluded_because:
          difficulty_instance: transitive_cascade / fail_finalize_depth3_cascade
          rationale: "The FAIL-finalize cross-entity cascade (event→instrument→impact) is asserted end-to-end by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: corner_max_abs_deviation_aggregation
        claim_type: Correct Result
        grounds:
          - calculations.drift_deviation
          - entities.CalibrationEvent.fields.max_abs_deviation
        distinguishing_aspect: "Two points with deviations 0.04 and 0.03 → max_abs_deviation == 0.04 at finalize."
        test_recipe:
          setup: ["ACTIVE instrument; IN_PROGRESS event with two passing points (25.04 and 24.97 against nominal 25.0)."]
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "S-MAD", nist_test_number: "NIST-MAD", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-MAD", description: "MAD gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "MAJOR" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
