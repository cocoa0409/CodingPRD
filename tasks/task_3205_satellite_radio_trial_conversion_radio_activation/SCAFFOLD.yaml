# =============================================================================
# Task 3205 — Satellite Radio Trial Conversion & Radio Activation (SiriusXM-style)
# Scaffold seed tables §1.0–§1.7
# =============================================================================

scenario: |
  Satellite Radio Trial Conversion & Radio Activation (SiriusXM): trial
  subscriptions delivered with new and used vehicle sales with automaker data
  feeds identifying eligible radios, radio identification tracking through
  vehicle ownership changes with reassignment of subscriptions, activation and
  deactivation signals sent over the satellite and cellular paths with retry
  logic, conversion marketing during and after trials with offer sequencing and
  price step-ups, streaming access bundled with in-vehicle service and separate
  streaming-only plans, package tiering with channel entitlements and family or
  second-radio discounts, cancellation and save-offer handling with regulatory
  requirements on automatic renewal disclosure, used vehicle dealer programs
  reactivating radios at resale.

domain_name: satellite-radio-trial-conversion
api_prefix: /api/v1

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Automaker
    parent: null
    common_fields: true
    fields:
      - { name: oem_code, type: string, source: input, description: "Unique automaker code; unique across Automaker" }
      - { name: name, type: string, source: input, description: "Automaker display name" }
      - { name: feed_contact_email, type: string, source: input, description: "Contact for data-feed operations" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }

  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - { name: dealer_code, type: string, source: input, description: "Unique dealer code; unique across Dealer" }
      - { name: name, type: string, source: input, description: "Dealership name" }
      - { name: used_program_enrolled, type: boolean, source: input, default: false, description: "Enrolled in used-vehicle radio reactivation program" }
      - { name: used_program_enrolled_at, type: datetime, source: system, description: "Timestamp of enrollment; null when not enrolled" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique customer email; unique across Customer" }
      - { name: full_name, type: string, source: input, description: "Customer name" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DEACTIVATED" }
      - { name: household_size, type: integer, source: input, default: 1, constraints: ">= 1", description: "Declared household size used by family-discount eligibility" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: vin, type: string, source: input, description: "17-char VIN; unique across Vehicle" }
      - { name: automaker_id, type: string, source: input, description: "FK -> Automaker.id" }
      - { name: model_year, type: integer, source: input, constraints: ">= 1990", description: "Vehicle model year" }
      - { name: owner_customer_id, type: string, source: input, description: "FK -> Customer.id; current registered owner" }
      - { name: condition, type: enum, source: input, description: "NEW | USED" }

  - name: Radio
    parent: null
    common_fields: true
    fields:
      - { name: esn, type: string, source: input, description: "Electronic serial number; unique across Radio" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle the radio is installed in" }
      - { name: hardware_generation, type: enum, source: input, description: "GEN1 | GEN2 | GEN3; gates cellular signal path and eligible plan tiers" }
      - { name: activation_status, type: enum, source: system, default: UNREGISTERED, description: "UNREGISTERED | REGISTERED | SUSPENDED | DEACTIVATED" }
      - { name: last_signal_at, type: datetime, source: system, description: "Timestamp of last ACKED signal; null if never" }

  - name: PackageTier
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique tier code; unique across PackageTier" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: channel_entitlements, type: array, source: input, description: "List of entitled channel codes (strings)" }
      - { name: includes_streaming, type: boolean, source: input, default: false, description: "Whether streaming access is bundled with in-vehicle service" }
      - { name: min_hardware_generation, type: enum, source: input, default: GEN1, description: "GEN1 | GEN2 | GEN3; minimum radio hardware required for this tier" }

  - name: SubscriptionPlan
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique plan code; unique across SubscriptionPlan" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: package_tier_id, type: string, source: input, description: "FK -> PackageTier.id" }
      - { name: service_mode, type: enum, source: input, description: "IN_VEHICLE | STREAMING_ONLY | BUNDLED" }
      - { name: is_trial, type: boolean, source: input, default: false, description: "Trial plans have term_kind TRIAL and price 0" }
      - { name: term_kind, type: enum, source: input, description: "TRIAL | MONTHLY | ANNUAL" }
      - { name: term_length_days, type: integer, source: input, constraints: "> 0", description: "Billing term length in days" }
      - { name: price_cents, type: integer, source: input, constraints: ">= 0", description: "Gross term price before discounts" }
      - { name: auto_renew_default, type: boolean, source: input, default: true, description: "Whether new paid subscriptions on this plan auto-renew unless customer opts out" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; billing owner of the subscription" }
      - { name: radio_id, type: string, source: system, description: "FK -> Radio.id; null for STREAMING_ONLY subscriptions" }
      - { name: plan_id, type: string, source: input, description: "FK -> SubscriptionPlan.id" }
      - { name: kind, type: enum, source: system, description: "TRIAL | PAID | SAVE_OFFER; derived from plan.is_trial and origin" }
      - { name: status, type: enum, source: system, default: PENDING_ACTIVATION, description: "PENDING_ACTIVATION | ACTIVE | SUSPENDED | CANCEL_SCHEDULED | CANCELLED | EXPIRED | TRANSFERRED_AWAY" }
      - { name: origin, type: enum, source: system, description: "OEM_FEED | USED_DEALER | WEB_SIGNUP | CALL_CENTER | SAVE_ACCEPT | TRANSFER_IN" }
      - { name: start_at, type: datetime, source: system, description: "Subscription start timestamp (clock at creation)" }
      - { name: end_at, type: datetime, source: computed, description: "= start_at + plan.term_length_days" }
      - { name: auto_renew, type: boolean, source: input, description: "Paid subs only; defaults from plan.auto_renew_default" }
      - { name: is_primary_for_discount, type: boolean, source: system, default: false, description: "True when this paid sub is the customer's discount-anchor (see family_discount calc)" }
      - { name: current_term_price_cents, type: integer, source: computed, description: "Price computed for the current term via term_pricing" }
      - { name: disclosure_state, type: enum, source: computed, default: NONE, description: "NONE | REQUIRED | SENT | ACKNOWLEDGED; regulatory auto-renewal disclosure posture" }
      - { name: save_offers_used_in_term, type: integer, source: system, default: 0, constraints: "0..2", description: "Count of accepted save offers in the current term; hard cap 2" }
      - { name: cancel_requested_at, type: datetime, source: system, description: "Set when a cancel is requested; null otherwise" }
      - { name: supersession_seq, type: integer, source: system, default: 0, description: "Monotone counter of supersessions on (radio_id, customer_id); transfer tie-break after created_at" }

  - name: OfferCampaign
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique campaign code; unique across OfferCampaign" }
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: lifecycle_phase, type: enum, source: input, description: "IN_TRIAL | POST_TRIAL | WINBACK | SAVE" }
      - { name: state, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | PAUSED | ARCHIVED" }
      - { name: window_start_at, type: datetime, source: input, description: "Campaign window start (inclusive)" }
      - { name: window_end_at, type: datetime, source: input, description: "Campaign window end (inclusive); must be > window_start_at" }

  - name: OfferStep
    parent: OfferCampaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> OfferCampaign.id" }
      - { name: step_index, type: integer, source: input, constraints: ">= 0; unique within campaign", description: "Sequence position; lowest eligible step_index wins on redemption" }
      - { name: plan_id, type: string, source: input, description: "FK -> SubscriptionPlan.id; plan granted by this step" }
      - { name: step_up_rank, type: integer, source: input, default: 0, description: "Price rank for step-up ordering; redeeming rank R requires every lower rank in the campaign already redeemed or ineligible" }
      - { name: discount_pct_bps, type: integer, source: input, default: 0, constraints: "0..10000", description: "Discount in basis points applied to plan price" }
      - { name: flat_discount_cents, type: integer, source: input, default: 0, constraints: ">= 0", description: "Flat discount applied after pct discount" }
      - { name: eligibility_expr, type: object, source: input, description: "Predicate: min_household_size?, requires_streaming?, required_prior_offer_step_indexes? (array of step_index that must already be redeemed by this customer)" }
      - { name: max_redemptions_per_customer, type: integer, source: input, default: 1, constraints: ">= 1", description: "Cap on redemptions of this step per customer" }

  - name: OfferRedemption
    parent: OfferCampaign
    common_fields: false
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> OfferCampaign.id" }
      - { name: offer_step_id, type: string, source: system, description: "FK -> OfferStep.id" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; subscription created or repriced by this redemption" }
      - { name: redeemed_price_cents, type: integer, source: system, description: "Price charged per term after this step's discounts" }
      - { name: redeemed_at, type: datetime, source: system, description: "Redemption timestamp (immutable)" }

  - name: SignalCommand
    parent: null
    common_fields: true
    fields:
      - { name: radio_id, type: string, source: system, description: "FK -> Radio.id" }
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; subscription whose state this signal materializes" }
      - { name: command_type, type: enum, source: system, description: "ACTIVATE | DEACTIVATE | SUSPEND | RESUME" }
      - { name: path, type: enum, source: computed, description: "SATELLITE | CELLULAR; CELLULAR only when radio.hardware_generation != GEN1" }
      - { name: status, type: enum, source: system, default: QUEUED, description: "QUEUED | SENT | ACKED | FAILED | EXHAUSTED | SUPERSEDED" }
      - { name: attempt_count, type: integer, source: system, default: 0, constraints: "0..3", description: "Number of dispatch attempts; hard cap 3" }
      - { name: next_retry_at, type: datetime, source: computed, description: "= last attempt time + attempt_count * RETRY_BASE_MINUTES minutes (linear backoff)" }
      - { name: idempotency_key, type: string, source: input, description: "Client-supplied key; unique across SignalCommand; duplicate key returns original command" }

  - name: BillingLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id" }
      - { name: entry_type, type: enum, source: system, description: "CHARGE | PRORATION_CREDIT | REFUND | SAVE_CREDIT | TRANSFER_ADJUSTMENT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount; charges positive, credits/refunds negative" }
      - { name: effective_at, type: datetime, source: system, description: "When the entry takes effect (clock at posting)" }
      - { name: idempotency_key, type: string, source: input, description: "Unique across BillingLedgerEntry; duplicate key returns original entry" }
      - { name: note, type: string, source: system, description: "Human/system annotation" }

  - name: DisclosureRecord
    parent: Subscription
    common_fields: false
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id" }
      - { name: disclosure_type, type: enum, source: system, description: "RENEWAL_NOTICE | SAVE_RENEWAL_NOTICE | TRIAL_END_NOTICE" }
      - { name: channel, type: enum, source: input, description: "EMAIL | POSTAL" }
      - { name: sent_at, type: datetime, source: system, description: "When the disclosure was sent (clock at send)" }
      - { name: due_before, type: datetime, source: computed, description: "= subscription.end_at; renewal charges forbidden if sent_at > due_before - lead time" }
      - { name: acknowledged_at, type: datetime, source: system, description: "Set by customer acknowledgment; null until acknowledged" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Subscription
    initial_state: PENDING_ACTIVATION
    terminal_states: [CANCELLED, EXPIRED, TRANSFERRED_AWAY]
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "system — when the linked ACTIVATE SignalCommand for this subscription reaches ACKED"
        actor: system
        preconditions:
          - "subscription.start_at <= now"
        side_effects:
          - "if plan.is_trial: radio.activation_status becomes REGISTERED; radio.last_signal_at = now"
          - "if kind == PAID: disclosure_state becomes REQUIRED when auto_renew == true"
          - "recompute family_discount for the customer's other non-terminal paid subs (anchor may change)"
        note: "STREAMING_ONLY subscriptions have no SignalCommand; they transition to ACTIVE immediately on create when start_at <= now (system transition, no signal hop)."

      - from: PENDING_ACTIVATION
        to: CANCELLED
        trigger: "POST /api/v1/subscriptions/{id}/cancel with effective_mode IMMEDIATE"
        actor: Customer | RetentionAgent
        preconditions:
          - "requester is the subscription owner (customer_id == X-User-ID) or RetentionAgent"
        side_effects:
          - "post refund BillingLedgerEntry per cancellation_refund (zero for never-activated trial)"
          - "radio.activation_status -> DEACTIVATED when radio is not referenced by any other non-terminal subscription"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/v1/subscriptions/{id}/suspend"
        actor: Customer | RetentionAgent
        preconditions:
          - "requester is owner or RetentionAgent"
          - "no EXHAUSTED SignalCommand exists for this subscription (ERR_SIGNAL_EXHAUSTED_BLOCK)"
        side_effects:
          - "enqueue SUSPEND SignalCommand (path via signal_path_selection)"
          - "on signal ACK: radio.activation_status -> SUSPENDED when no other ACTIVE or PENDING_ACTIVATION subscription references the radio"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/v1/subscriptions/{id}/resume"
        actor: Customer | RetentionAgent
        preconditions:
          - "requester is owner or RetentionAgent"
          - "now < end_at (else the sub must expire, not resume)"
        side_effects:
          - "enqueue RESUME SignalCommand"
          - "on signal ACK: radio.activation_status -> REGISTERED"

      - from: SUSPENDED
        to: CANCEL_SCHEDULED
        trigger: "POST /api/v1/subscriptions/{id}/cancel with effective_mode END_OF_TERM"
        actor: Customer | RetentionAgent
        preconditions:
          - "requester is owner or RetentionAgent"
        side_effects:
          - "cancel_requested_at = now"
          - "auto_renew forced to false"
          - "no refund posted"

      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /api/v1/subscriptions/{id}/cancel with effective_mode IMMEDIATE"
        actor: Customer | RetentionAgent
        preconditions:
          - "requester is owner or RetentionAgent"
          - "if kind == PAID and auto_renew == true: disclosure_state IN {SENT, ACKNOWLEDGED} else ERR_RENEWAL_DISCLOSURE_REQUIRED"
          - "no EXHAUSTED SignalCommand exists for this subscription (ERR_SIGNAL_EXHAUSTED_BLOCK)"
        side_effects:
          - "post PRORATION_CREDIT BillingLedgerEntry per cancellation_refund"
          - "enqueue DEACTIVATE SignalCommand; on ACK radio.activation_status -> DEACTIVATED when unreferenced"
          - "recompute family_discount for surviving paid subs of the customer"

      - from: ACTIVE
        to: CANCEL_SCHEDULED
        trigger: "POST /api/v1/subscriptions/{id}/cancel with effective_mode END_OF_TERM"
        actor: Customer | RetentionAgent
        preconditions:
          - "requester is owner or RetentionAgent"
        side_effects:
          - "cancel_requested_at = now"
          - "auto_renew forced to false"
          - "no refund posted (service continues to end_at)"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/v1/subscriptions/{id}/cancel with effective_mode IMMEDIATE"
        actor: Customer | RetentionAgent
        preconditions:
          - "requester is owner or RetentionAgent"
          - "if kind == PAID and auto_renew == true: disclosure_state IN {SENT, ACKNOWLEDGED} else ERR_RENEWAL_DISCLOSURE_REQUIRED (regulatory: may not immediate-cancel an auto-renewing paid sub whose renewal disclosure was never sent — retention flow must disclose first)"
        side_effects:
          - "post PRORATION_CREDIT BillingLedgerEntry per cancellation_refund"
          - "enqueue DEACTIVATE SignalCommand; on ACK radio.activation_status -> DEACTIVATED when unreferenced"
          - "recompute family_discount for surviving paid subs of the customer"

      - from: CANCEL_SCHEDULED
        to: CANCELLED
        trigger: "system — POST /api/v1/_clock/set_current_utc or POST /api/v1/_billing/run_renewals advancing now >= end_at"
        actor: system
        preconditions: ["now >= end_at"]
        side_effects:
          - "enqueue DEACTIVATE SignalCommand; on ACK radio.activation_status -> DEACTIVATED when unreferenced"
          - "recompute family_discount for surviving paid subs"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system — POST /api/v1/_billing/run_renewals when now >= end_at AND (auto_renew == false OR kind == TRIAL)"
        actor: system
        preconditions: ["now >= end_at"]
        side_effects:
          - "enqueue DEACTIVATE SignalCommand; on ACK radio.activation_status -> DEACTIVATED when unreferenced"
          - "recompute family_discount for surviving paid subs"
        note: "auto_renew == true PAID subs do NOT expire; run_renewals renews them in place (see renewal side effects)."

      - from: ACTIVE
        to: TRANSFERRED_AWAY
        trigger: "POST /api/v1/vehicles/{id}/transfer_ownership (ownership change reassigns the radio)"
        actor: Customer | DealerPartner | PlatformAdmin
        preconditions:
          - "radio's vehicle now owned by a different customer"
        side_effects:
          - "enqueue DEACTIVATE SignalCommand (old radio entitlement revoked)"
          - "post TRANSFER_ADJUSTMENT ledger entry refunding unused whole days per transfer_proration"
          - "cascade: is_primary_for_discount recompute for old customer"
        note: "the new owner gets a fresh PENDING_ACTIVATION trial created by the transfer endpoint; this sub is terminal."

      - from: CANCEL_SCHEDULED
        to: ACTIVE
        trigger: "POST /api/v1/subscriptions/{id}/save-offers/accept with a SAVE-phase offer"
        actor: Customer | RetentionAgent
        preconditions:
          - "save_offers_used_in_term < 2"
          - "offer campaign lifecycle_phase == SAVE and state == ACTIVE"
        side_effects:
          - "cancel_requested_at = null; auto_renew restored to true"
          - "kind becomes SAVE_OFFER; current_term_price_cents recomputed at save offer rate for the NEXT term (current term price unchanged)"
          - "save_offers_used_in_term += 1"
          - "post SAVE_CREDIT ledger entry for the difference on the next term (informational, amount = next-term discount)"
          - "disclosure_state -> REQUIRED (new auto-renew terms require fresh disclosure)"
        note: "save-accept reverts the scheduled cancel — cyclic edge CANCEL_SCHEDULED -> ACTIVE."

  - entity: Radio
    initial_state: UNREGISTERED
    terminal_states: []
    transitions:
      - from: UNREGISTERED
        to: REGISTERED
        trigger: "system — first ACTIVATE SignalCommand ACKED for any subscription on this radio"
        actor: system
        preconditions: []
        side_effects: ["last_signal_at = now"]

      - from: REGISTERED
        to: SUSPENDED
        trigger: "system — SUSPEND SignalCommand ACKED and no other ACTIVE/PENDING_ACTIVATION subscription references this radio"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: REGISTERED
        trigger: "system — RESUME SignalCommand ACKED"
        actor: system
        preconditions: []
        side_effects: ["last_signal_at = now"]

      - from: REGISTERED
        to: DEACTIVATED
        trigger: "system — DEACTIVATE SignalCommand ACKED and no non-terminal subscription references this radio"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: DEACTIVATED
        trigger: "system — DEACTIVATE SignalCommand ACKED and no non-terminal subscription references this radio"
        actor: system
        preconditions: []
        side_effects: []

      - from: DEACTIVATED
        to: REGISTERED
        trigger: "system — ACTIVATE SignalCommand ACKED for a new subscription (used-vehicle dealer reactivation or resale trial)"
        actor: system
        preconditions: []
        side_effects: ["last_signal_at = now"]
        note: "cyclic edge: DEACTIVATED radios are reactivatable — this is the used-vehicle dealer program loop."

  - entity: SignalCommand
    initial_state: QUEUED
    terminal_states: [ACKED, EXHAUSTED, SUPERSEDED]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "POST /api/v1/_signals/dispatch (batch dispatch pass)"
        actor: SystemOperator
        preconditions:
          - "command.path == CELLULAR requires radio.hardware_generation != GEN1"
          - "no other non-terminal SignalCommand for the same radio with an earlier created_at still in QUEUED/SENT (strict FIFO per radio, tie-break created_at ASC then supersession of stale)"
        side_effects: ["attempt_count += 1"]
        note: "POST /api/v1/_signals/{id}/force_send dispatches one command directly."

      - from: SENT
        to: ACKED
        trigger: "POST /api/v1/signal-commands/{id}/ack"
        actor: SystemOperator
        preconditions: []
        side_effects:
          - "apply command effect to Radio.activation_status per Radio machine"
          - "if command_type == ACTIVATE and subscription PENDING_ACTIVATION: subscription -> ACTIVE"
          - "radio.last_signal_at = now"

      - from: SENT
        to: FAILED
        trigger: "POST /api/v1/signal-commands/{id}/fail"
        actor: SystemOperator
        preconditions: []
        side_effects:
          - "if attempt_count < 3: command returns to QUEUED with next_retry_at = now + attempt_count * 15 minutes"
          - "if attempt_count == 3: status -> EXHAUSTED instead (see EXHAUSTED edge)"
        note: "modeled as SENT -> FAILED -> (QUEUED | EXHAUSTED); the requeue is the cyclic edge."

      - from: FAILED
        to: QUEUED
        trigger: "system — automatic requeue when attempt_count < 3"
        actor: system
        preconditions: ["attempt_count < 3"]
        side_effects: ["next_retry_at = now + attempt_count * 15 minutes (linear backoff, base 15)"]

      - from: FAILED
        to: EXHAUSTED
        trigger: "system — when attempt_count reaches 3"
        actor: system
        preconditions: ["attempt_count == 3"]
        side_effects:
          - "subscription stays in its pre-signal state"
          - "blocks suspend/cancel IMMEDIATE on the linked subscription until a replacement command is enqueued by RetentionAgent via POST /api/v1/subscriptions/{id}/signals/requeue"

      - from: QUEUED
        to: SUPERSEDED
        trigger: "system — a newer SignalCommand for the same radio with a contradictory command_type is enqueued (e.g. DEACTIVATE after ACTIVATE)"
        actor: system
        preconditions: []
        side_effects: []
        note: "supersession keeps per-radio signal semantics coherent: only the newest contradictory command survives."

      - from: SENT
        to: SUPERSEDED
        trigger: "system — same supersession rule as QUEUED -> SUPERSEDED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: OfferCampaign
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/v1/offer-campaigns/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "campaign has >= 1 OfferStep"
          - "window_end_at > now (campaign not already over)"
          - "no other ACTIVE campaign with the same lifecycle_phase overlapping [window_start_at, window_end_at] (half-open overlap on the phase dimension)"
        side_effects: []

      - from: ACTIVE
        to: PAUSED
        trigger: "POST /api/v1/offer-campaigns/{id}/pause"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["redemptions against this campaign rejected while PAUSED"]

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /api/v1/offer-campaigns/{id}/activate"
        actor: PlatformAdmin
        preconditions: ["window_end_at > now"]
        side_effects: []

      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /api/v1/offer-campaigns/{id}/archive"
        actor: PlatformAdmin
        preconditions: ["now > window_end_at OR campaign has zero OfferRedemption rows"]
        side_effects: []

      - from: PAUSED
        to: ARCHIVED
        trigger: "POST /api/v1/offer-campaigns/{id}/archive"
        actor: PlatformAdmin
        preconditions: ["now > window_end_at OR campaign has zero OfferRedemption rows"]
        side_effects: []

  - entity: DisclosureRecord
    initial_state: SENT_IMPLICIT
    terminal_states: []
    transitions:
      - from: SENT_IMPLICIT
        to: ACKNOWLEDGED_IMPLICIT
        trigger: "POST /api/v1/subscriptions/{id}/disclosures/{disclosureId}/acknowledge"
        actor: Customer
        preconditions:
          - "requester is the subscription owner"
        side_effects:
          - "acknowledged_at = now"
          - "if all REQUIRED disclosures for the subscription are acknowledged: subscription.disclosure_state -> ACKNOWLEDGED"
        note: "DisclosureRecord is modeled as a two-state record (sent_at set at creation = SENT; acknowledged_at set = ACKNOWLEDGED). The pseudo-states SENT_IMPLICIT/ACKNOWLEDGED_IMPLICIT name field combinations, not stored enums."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: trial-provision-stale-radio
    parent_entity: Radio
    write_endpoint: "POST /api/v1/radios/{id}/trials"
    occ_field: "expected_radio_version"
    description: |
      Provisioning a trial subscription against a Radio whose version has
      advanced since the client last observed it is rejected. A prior
      provisioning (or a transfer-driven reassignment) legitimately supersedes
      the caller's view of which subscription anchors the radio, so the stale
      writer must re-read before provisioning.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: transfer-stale-vehicle
    parent_entity: Vehicle
    write_endpoint: "POST /api/v1/vehicles/{id}/transfer_ownership"
    occ_field: "expected_vehicle_version"
    description: |
      Transferring a Vehicle whose version has advanced since the client last
      observed it is rejected. A prior transfer (or a feed-driven owner change)
      has already reassigned subscriptions off the radio; the stale transfer
      would double-reassign.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: term_pricing
    trigger: "on paid subscription creation, on save-offer accept (next-term), on family_discount recompute, and on renewal inside POST /api/v1/_billing/run_renewals"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned to break the circular-looking dependency
      # (family anchor depends on price, price depends on family discount):
      #   step 1: base = plan.price_cents   (raw plan price, pre-discount)
      #   step 2: offer_discount = floor(base * offer_step.discount_pct_bps / 10000)
      #           then subtract offer_step.flat_discount_cents (floor at 0)
      #           -- offer discount applies BEFORE family discount
      #   step 3: if subscription is non-primary AND customer.household_size >= 2
      #           AND the primary anchor sub is ACTIVE/SUSPENDED paid:
      #           family_discount = ceil((base - offer_discount) * 2500 / 10000)  # 25%
      #           else family_discount = 0
      #   step 4: term_price = max(0, base - offer_discount - family_discount)
      # Rounding: pct discounts use floor on the pct step, ceil on the family
      # step — the two rounding directions are pinned and MUST NOT be swapped.
    input_set: "the subscription's plan, the redeeming OfferStep (if any), and the customer's other paid subscriptions with status IN {ACTIVE, SUSPENDED, CANCEL_SCHEDULED}"
    constants:
      FAMILY_DISCOUNT_BPS: 2500
      PRIMARY_ANCHOR: "the paid sub of the customer with the highest base plan.price_cents; tie-break: earliest created_at"
    precision: "integer cents; floor for pct step, ceil for family step"
    variants:
      - name: list_price
        when: "no offer redemption and not family-eligible"
        difference: "term_price = plan.price_cents verbatim"

  - name: family_discount
    trigger: "on any paid subscription create/cancel/expire/transfer/suspend/resume for a customer"
    algorithm: aggregation
    formula: |
      # Anchor selection is recomputed over the customer's paid subs with
      # status IN {ACTIVE, SUSPENDED, CANCEL_SCHEDULED}:
      #   anchor = argmax(plan.price_cents) over that set; tie-break earliest created_at
      #   anchor.is_primary_for_discount = true; all others false
      # Non-anchor subs get the 25% family discount when household_size >= 2.
      # When the anchor itself is cancelled/transferred/expired, the NEXT-highest
      # sub becomes anchor and LOSES its discount (price rises at next renewal):
      # recompute current_term_price_cents for every surviving paid sub.
    input_set: "customer's subscriptions with kind IN {PAID, SAVE_OFFER} and status IN {ACTIVE, SUSPENDED, CANCEL_SCHEDULED}"
    constants:
      FAMILY_DISCOUNT_BPS: 2500
    precision: "integer cents"

  - name: offer_step_pricing
    trigger: "on POST /api/v1/offer-campaigns/{id}/redeem"
    algorithm: tiered_pricing
    formula: |
      # Nested rounding — order pinned:
      #   per-step price = floor(plan.price_cents * discount_pct_bps / 10000)
      #                    - flat_discount_cents, floored at 0  (ROUND PER STEP)
      #   The redeemed term price then feeds term_pricing step 2.
      # Family discount (if applicable) applies on top per term_pricing.
      # Pin: pct THEN flat, PER STEP, never sum-then-round.
    input_set: "the selected OfferStep and its plan"
    constants: {}
    precision: "integer cents; floor pct step; applied per-step before summing into term price"

  - name: cancellation_refund
    trigger: "on POST /api/v1/subscriptions/{id}/cancel with effective_mode IMMEDIATE"
    algorithm: chronological
    formula: |
      # Two valid readings exist; the scaffold pins the FLOOR variant:
      #   unused_days = floor((end_at - now) / 86400s)
      #   refund = floor(current_term_price_cents * unused_days / plan.term_length_days)
      # Trials (price 0) refund 0. Refund posts as PRORATION_CREDIT (negative).
    input_set: "the cancelled subscription"
    constants:
      SECONDS_PER_DAY: 86400
    precision: "integer cents; floor both divisions"
    variants:
      - name: ceil_days_variant
        when: "NEVER used by the API — documented alternative (ceil unused days) that would refund more; tests must pin floor"
        difference: "ceil instead of floor on unused_days; produces >= refund of the pinned variant"

  - name: transfer_proration
    trigger: "on POST /api/v1/vehicles/{id}/transfer_ownership for each ACTIVE/CANCEL_SCHEDULED paid subscription on the vehicle's radios"
    algorithm: chronological
    formula: |
      # Credit the OLD owner for unused whole days; the clock is the transfer time.
      #   unused_days = floor((end_at - now) / 86400s)
      #   credit = floor(current_term_price_cents * unused_days / plan.term_length_days)
      # Posts TRANSFER_ADJUSTMENT (negative). Trials credit 0.
      # Differs from cancellation_refund in entry_type and in that a fresh trial
      # for the NEW owner is created in the same request (see transfer endpoint).
    input_set: "paid subs on radios of the transferred vehicle with status IN {ACTIVE, CANCEL_SCHEDULED}"
    constants:
      SECONDS_PER_DAY: 86400
    precision: "integer cents; floor both divisions"

  - name: renewal_pricing
    trigger: "inside POST /api/v1/_billing/run_renewals for each ACTIVE paid sub with auto_renew == true and now >= end_at"
    algorithm: forward_looking
    formula: |
      # Renewal recomputes the term price FORWARD from current state:
      #   new_price = term_pricing(subscription, offer_step = none, family as of now)
      #   -- offer discounts do NOT carry into renewals (one-term promotional)
      #   -- family discount DOES carry (structural)
      # Then: start_at = end_at; end_at = end_at + plan.term_length_days;
      # current_term_price_cents = new_price; post CHARGE ledger entry;
      # save_offers_used_in_term reset to 0; kind stays PAID/SAVE_OFFER.
      # GATE: renewal is FORBIDDEN unless a DisclosureRecord of type
      # RENEWAL_NOTICE (or SAVE_RENEWAL_NOTICE for SAVE_OFFER subs) exists with
      # sent_at <= end_at - RENEWAL_DISCLOSURE_LEAD_DAYS. If missing, the sub is
      # NOT renewed and NOT expired: it is left ACTIVE past end_at with
      # disclosure_state REQUIRED (regulatory limbo) until disclosure is sent and
      # a later run_renewals processes it. (Auto-renew may not charge without
      # timely disclosure.)
    input_set: "ACTIVE subscriptions with kind IN {PAID, SAVE_OFFER}, auto_renew == true, end_at <= now"
    constants:
      RENEWAL_DISCLOSURE_LEAD_DAYS: 15
    precision: "integer cents"

  - name: signal_path_selection
    trigger: "on enqueue of any SignalCommand"
    algorithm: constraint_propagation
    formula: |
      # path = CELLULAR if radio.hardware_generation IN {GEN2, GEN3} else SATELLITE
      # Propagation constraint: CELLULAR commands retry with base 15 minutes;
      # SATELLITE commands retry with base 60 minutes (satellite windows are
      # scarce) — retry_base = CELLULAR ? 15 : 60, next_retry_at =
      # last_attempt + attempt_count * retry_base.
      # Attempt cap is 3 on BOTH paths.
    input_set: "the radio referenced by the command"
    constants:
      CELLULAR_RETRY_BASE_MINUTES: 15
      SATELLITE_RETRY_BASE_MINUTES: 60
      MAX_ATTEMPTS: 3
    precision: "whole minutes"

  - name: campaign_overlap_check
    trigger: "on POST /api/v1/offer-campaigns/{id}/activate and on POST /api/v1/offer-campaigns with state DRAFT (deferred until activation)"
    algorithm: interval_merge
    formula: |
      # Reject activation when another campaign C' exists with:
      #   C'.state == ACTIVE AND C'.lifecycle_phase == this.lifecycle_phase
      #   AND half-open overlap: this.window_start_at < C'.window_end_at
      #   AND C'.window_start_at < this.window_end_at
      # Adjacent windows (this.window_start_at == C'.window_end_at) do NOT
      # overlap (half-open semantics). PAUSED campaigns DO still count as
      # occupying their window (a paused campaign blocks a new ACTIVE one in
      # the same phase+window) — paused campaigns are included in the
      # occupancy set with state IN {ACTIVE, PAUSED}.
    input_set: "all campaigns with state IN {ACTIVE, PAUSED} and matching lifecycle_phase"
    constants: {}
    precision: "ISO8601 timestamps, half-open intervals [start, end)"

  - name: trial_eligibility
    trigger: "on POST /api/v1/automakers/{id}/data-feeds and on POST /api/v1/radios/{id}/trials"
    algorithm: threshold
    formula: |
      # A radio is trial-eligible iff:
      #   radio.activation_status IN {UNREGISTERED, DEACTIVATED}
      #   AND count(non-terminal subscriptions on this radio) == 0
      #   AND vehicle.condition == NEW  -> automaker feed trial
      #   OR  vehicle.condition == USED -> used-dealer trial requires an
      #       enrolled Dealer (used_program_enrolled == true) as actor
      # Boundary: count == 0 exactly; a single PENDING_ACTIVATION sub blocks.
    input_set: "radio, its vehicle, and the acting partner"
    constants: {}
    precision: "exact integer count comparison at 0"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and a declared role; X-User-ID present for entity_backed roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all except POST /api/v1/customers" }
  - { priority: 2, category: auth, check: "role permitted for the endpoint per §1.5 roles", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "every path-template id resolves to an existing entity, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 4, category: existence, check: "request-body FK references (plan_id, package_tier_id, vehicle_id, automaker_id, offer_step_id) resolve", error_id: ERR_REFERENCE_NOT_FOUND, http_status: 404, applies_to: "endpoints taking body FKs" }
  - { priority: 5, category: state, check: "target entity in a state from which the requested transition is declared in §1.2", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: state, check: "subscription owner match: for customer-scoped actions customer_id == X-User-ID", error_id: ERR_FORBIDDEN_OWNER, http_status: 403, applies_to: "cancel, suspend, resume, save-accept, acknowledge, list-own" }
  - { priority: 7, category: business_safety, check: "regulatory: renewal charge requires RENEWAL_NOTICE disclosure sent >= 15 days before end_at; immediate-cancel of auto-renew paid sub requires disclosure_state IN {SENT, ACKNOWLEDGED}", error_id: ERR_RENEWAL_DISCLOSURE_REQUIRED, http_status: 422, applies_to: "cancel IMMEDIATE, run_renewals (per-sub gate)" }
  - { priority: 8, category: business_safety, check: "no EXHAUSTED SignalCommand on the subscription when suspending or immediate-cancelling", error_id: ERR_SIGNAL_EXHAUSTED_BLOCK, http_status: 409, applies_to: "suspend, cancel IMMEDIATE" }
  - { priority: 9, category: business_constraint, check: "uniqueness: vin, esn, email, oem_code, dealer_code, plan/tier/campaign codes, idempotency_key", error_id: ERR_DUPLICATE, http_status: 409, applies_to: "create endpoints" }
  - { priority: 10, category: business_constraint, check: "trial eligibility per trial_eligibility calc (radio status set, zero non-terminal subs)", error_id: ERR_RADIO_INELIGIBLE, http_status: 422, applies_to: "POST /api/v1/automakers/{id}/data-feeds, POST /api/v1/radios/{id}/trials, POST /api/v1/dealers/{id}/used-reactivations" }
  - { priority: 10.5, category: business_constraint, check: "used-dealer program enrollment: POST /api/v1/dealers/{id}/used-reactivations requires dealer.used_program_enrolled == true", error_id: ERR_DEALER_NOT_ENROLLED, http_status: 422, applies_to: "POST /api/v1/dealers/{id}/used-reactivations" }
  - { priority: 10.6, category: business_constraint, check: "plan-kind gate: trial-provisioning endpoints require plan.is_trial == true", error_id: ERR_TRIAL_PLAN_REQUIRED, http_status: 422, applies_to: "POST /api/v1/radios/{id}/trials, POST /api/v1/automakers/{id}/data-feeds, POST /api/v1/dealers/{id}/used-reactivations" }
  - { priority: 10.7, category: business_constraint, check: "plan-kind gate: direct purchase and redeem require plan.is_trial == false", error_id: ERR_PAID_PLAN_REQUIRED, http_status: 422, applies_to: "POST /api/v1/subscriptions, POST /api/v1/offer-campaigns/{id}/redeem" }
  - { priority: 11, category: business_constraint, check: "hardware gate: plan.package_tier.min_hardware_generation <= radio.hardware_generation (GEN1 < GEN2 < GEN3); STREAMING_ONLY plans exempt (no radio)", error_id: ERR_HARDWARE_INCOMPATIBLE, http_status: 422, applies_to: "subscription-creating endpoints with a radio" }
  - { priority: 12, category: business_temporal, check: "campaign window: redeem only when window_start_at <= now <= window_end_at and campaign state == ACTIVE; campaign create requires window_end_at > window_start_at", error_id: ERR_CAMPAIGN_WINDOW, http_status: 422, applies_to: "redeem, campaign create/activate" }
  - { priority: 13, category: business_temporal, check: "campaign phase-window occupancy per campaign_overlap_check (half-open; PAUSED occupies)", error_id: ERR_CAMPAIGN_OVERLAP, http_status: 409, applies_to: "campaign activate" }
  - { priority: 14, category: business_temporal, check: "offer step-up sequencing: step with step_up_rank R redeemable only if every step in the campaign with rank < R is already redeemed by this customer or fails its own eligibility_expr", error_id: ERR_OFFER_SEQUENCE_VIOLATION, http_status: 422, applies_to: "redeem" }
  - { priority: 15, category: business_referential, check: "offer eligibility_expr satisfied (min_household_size, requires_streaming, required_prior_offer_step_indexes all redeemed by this customer) and per-customer redemption cap not reached", error_id: ERR_OFFER_INELIGIBLE, http_status: 422, applies_to: "redeem" }
  - { priority: 16, category: business_fiscal, check: "save-offer cap: save_offers_used_in_term < 2 (reject third save accept in same term)", error_id: ERR_SAVE_CAP_REACHED, http_status: 422, applies_to: "save-accept" }
  - { priority: 17, category: business_fiscal, check: "OCC: expected_*_version matches current parent version on OCC-guarded endpoints", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /api/v1/radios/{id}/trials, POST /api/v1/vehicles/{id}/transfer_ownership" }
  - { priority: 18, category: business_constraint, check: "enum/format sanity: VIN length 17, ESN non-empty, term_length_days > 0, discount_pct_bps in 0..10000, household_size >= 1", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all creates/updates" }

  - { priority: 19, category: business_temporal, check: "campaign create requires window_end_at strictly greater than window_start_at", error_id: ERR_CAMPAIGN_WINDOW, http_status: 422, applies_to: "POST /api/v1/offer-campaigns" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock & ops (test-driving, declared per §1.5 ladder rung 3) ---
  - method: POST
    path: "/api/v1/_clock/set_current_utc"
    description: "Set the logical clock. Server default before any call is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock. Also drives all system transitions whose preconditions depend on now (expiries, campaign windows)."
    roles: [PlatformAdmin, SystemOperator]
    code: 200
    input: [to_iso8601]
    output: { now_iso8601: string }
    side_effects: ["system transitions with now-dependent preconditions re-evaluated"]

  - method: POST
    path: "/api/v1/_billing/run_renewals"
    description: "Billing batch: process expiries, auto-renewals (with disclosure gate), and CANCEL_SCHEDULED finalizations due as of now"
    roles: [SystemOperator]
    code: 200
    input: []
    output: { expired_count: integer, renewed_count: integer, disclosure_blocked_count: integer, cancel_finalized_count: integer }
    side_effects: ["renewal_pricing per renewed sub", "family_discount recompute per affected customer", "DEACTIVATE signals enqueued per expired/finalized sub"]

  - method: POST
    path: "/api/v1/_signals/dispatch"
    description: "Dispatch all QUEUED SignalCommands whose next_retry_at is null or <= now, in per-radio FIFO order (created_at ASC)"
    roles: [SystemOperator]
    code: 200
    input: []
    output: { dispatched_count: integer, superseded_count: integer }
    side_effects: ["QUEUED -> SENT per eligible command", "supersession sweep per SignalCommand machine"]

  # --- reference data ---
  - method: POST
    path: "/api/v1/automakers"
    description: "Register an automaker"
    roles: [PlatformAdmin]
    code: 201
    input: [oem_code, name, feed_contact_email]
    output: Automaker
    side_effects: []

  - method: GET
    path: "/api/v1/automakers/{id}"
    description: "Get automaker"
    roles: [PlatformAdmin, AutomakerPartner, DealerPartner, Customer, RetentionAgent, SystemOperator]
    code: 200
    input: []
    output: Automaker
    side_effects: []

  - method: POST
    path: "/api/v1/dealers"
    description: "Register a dealer"
    roles: [PlatformAdmin]
    code: 201
    input: [dealer_code, name, "used_program_enrolled?"]
    output: Dealer
    side_effects: ["used_program_enrolled_at set when enrolled true"]

  - method: GET
    path: "/api/v1/dealers/{id}"
    description: "Get dealer"
    roles: [PlatformAdmin, AutomakerPartner, DealerPartner, Customer, RetentionAgent, SystemOperator]
    code: 200
    input: []
    output: Dealer
    side_effects: []

  - method: POST
    path: "/api/v1/dealers/{id}/enroll-used-program"
    description: "Enroll dealer in used-vehicle reactivation program"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Dealer
    side_effects: ["used_program_enrolled = true", "used_program_enrolled_at = now", "increments Dealer.version by 1"]

  - method: POST
    path: "/api/v1/customers"
    description: "Register a customer (self-service; no auth)"
    roles: [Anonymous]
    code: 201
    input: [email, full_name, "household_size?"]
    output: Customer
    side_effects: []

  - method: GET
    path: "/api/v1/customers/{id}"
    description: "Get customer"
    roles: [PlatformAdmin, Customer, RetentionAgent]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/api/v1/customers/{id}/api/v1/subscriptions"
    description: "List subscriptions of a customer"
    roles: [PlatformAdmin, Customer, RetentionAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []

  - method: POST
    path: "/api/v1/package-tiers"
    description: "Create a package tier"
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, channel_entitlements, "includes_streaming?", "min_hardware_generation?"]
    output: PackageTier
    side_effects: []

  - method: GET
    path: "/api/v1/package-tiers/{id}"
    description: "Get package tier"
    roles: [PlatformAdmin, AutomakerPartner, DealerPartner, Customer, RetentionAgent, SystemOperator]
    code: 200
    input: []
    output: PackageTier
    side_effects: []

  - method: POST
    path: "/api/v1/subscription-plans"
    description: "Create a subscription plan"
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, package_tier_id, service_mode, "is_trial?", term_kind, term_length_days, price_cents, "auto_renew_default?"]
    output: SubscriptionPlan
    side_effects: []

  - method: GET
    path: "/api/v1/subscription-plans/{id}"
    description: "Get plan"
    roles: [PlatformAdmin, AutomakerPartner, DealerPartner, Customer, RetentionAgent, SystemOperator]
    code: 200
    input: []
    output: SubscriptionPlan
    side_effects: []

  # --- vehicles & radios ---
  - method: POST
    path: "/api/v1/vehicles"
    description: "Register a vehicle (VIN) for an owner customer"
    roles: [PlatformAdmin, AutomakerPartner, DealerPartner]
    code: 201
    input: [vin, automaker_id, model_year, owner_customer_id, condition]
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/api/v1/vehicles/{id}"
    description: "Get vehicle"
    roles: [PlatformAdmin, AutomakerPartner, DealerPartner, Customer, RetentionAgent, SystemOperator]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/api/v1/vehicles/{id}/api/v1/radios"
    description: "List radios installed in a vehicle"
    roles: [PlatformAdmin, AutomakerPartner, DealerPartner, Customer, RetentionAgent, SystemOperator]
    code: 200
    input: []
    output: Radio[]
    side_effects: []

  - method: POST
    path: "/api/v1/vehicles/{id}/transfer_ownership"
    description: "Transfer vehicle ownership to another customer; reassigns radios' subscriptions (OCC-guarded)"
    roles: [PlatformAdmin, DealerPartner, Customer]
    code: 200
    input: [new_owner_customer_id, expected_vehicle_version, "used_dealer_id?", "trial_plan_id?"]
    output: Vehicle
    side_effects:
      - "vehicle.owner_customer_id = new_owner_customer_id; increments Vehicle.version by 1"
      - "each ACTIVE/CANCEL_SCHEDULED sub on the vehicle's radios -> TRANSFERRED_AWAY with transfer_proration credit"
      - "for each radio: if trial_plan_id present, create PENDING_ACTIVATION trial (origin USED_DEALER when used_dealer_id present else TRANSFER_IN) for the new owner and enqueue ACTIVATE signal"
      - "family_discount recompute for both old and new owner"

  - method: POST
    path: "/api/v1/radios"
    description: "Register a radio (ESN) installed in a vehicle"
    roles: [PlatformAdmin, AutomakerPartner]
    code: 201
    input: [esn, vehicle_id, hardware_generation]
    output: Radio
    side_effects: []

  - method: GET
    path: "/api/v1/radios/{id}"
    description: "Get radio"
    roles: [PlatformAdmin, AutomakerPartner, DealerPartner, Customer, RetentionAgent, SystemOperator]
    code: 200
    input: []
    output: Radio
    side_effects: []

  - method: GET
    path: "/api/v1/radios/{id}/api/v1/subscriptions"
    description: "List subscriptions tied to a radio"
    roles: [PlatformAdmin, AutomakerPartner, DealerPartner, Customer, RetentionAgent, SystemOperator]
    code: 200
    input: ["status?"]
    output: Subscription[]
    side_effects: []

  - method: GET
    path: "/api/v1/radios/{id}/api/v1/signal-commands"
    description: "List signal commands for a radio"
    roles: [PlatformAdmin, SystemOperator, RetentionAgent]
    code: 200
    input: ["status?"]
    output: SignalCommand[]
    side_effects: []

  # --- trial provisioning ---
  - method: POST
    path: "/api/v1/radios/{id}/trials"
    description: "Provision a trial subscription on a radio (OCC-guarded on Radio.version)"
    roles: [PlatformAdmin, AutomakerPartner, DealerPartner, Customer]
    code: 201
    input: [plan_id, customer_id, expected_radio_version]
    output: Subscription
    side_effects:
      - "creates Subscription kind TRIAL origin per actor (OEM_FEED/USED_DEALER/WEB_SIGNUP), status PENDING_ACTIVATION"
      - "enqueue ACTIVATE SignalCommand (path via signal_path_selection)"
      - "increments Radio.version by 1"
      - "increments Radio.version indirectly via activation when signal ACKs"

  - method: POST
    path: "/api/v1/automakers/{id}/data-feeds"
    description: "Automaker data feed: bulk-identify eligible radios and provision trials; per-item results"
    roles: [AutomakerPartner]
    code: 200
    input: [items]
    output: { results: array, provisioned_count: integer, rejected_count: integer }
    side_effects: ["per eligible item: trial Subscription created + ACTIVATE signal enqueued", "per ineligible item: rejection recorded with reason in results"]

  - method: POST
    path: "/api/v1/dealers/{id}/used-reactivations"
    description: "Used-vehicle dealer program: reactivate a DEACTIVATED radio with a fresh trial for the resale buyer"
    roles: [DealerPartner]
    code: 201
    input: [radio_id, customer_id, plan_id]
    output: Subscription
    side_effects:
      - "requires dealer.used_program_enrolled == true and radio.activation_status == DEACTIVATED"
      - "creates trial Subscription origin USED_DEALER"
      - "enqueue ACTIVATE SignalCommand"

  # --- subscription lifecycle ---
  - method: POST
    path: "/api/v1/subscriptions"
    description: "Direct purchase of a paid or streaming-only subscription"
    roles: [Customer, RetentionAgent, PlatformAdmin]
    code: 201
    input: [customer_id, plan_id, "radio_id?", "auto_renew?"]
    output: Subscription
    side_effects:
      - "term_pricing computes current_term_price_cents"
      - "CHARGE ledger entry posted"
      - "IN_VEHICLE/BUNDLED: enqueue ACTIVATE signal, status PENDING_ACTIVATION; STREAMING_ONLY: status ACTIVE immediately"
      - "family_discount recompute for the customer"
      - "disclosure_state -> REQUIRED when auto_renew true and kind PAID"

  - method: GET
    path: "/api/v1/subscriptions/{id}"
    description: "Get subscription"
    roles: [PlatformAdmin, Customer, RetentionAgent, SystemOperator, DealerPartner, AutomakerPartner]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: GET
    path: "/api/v1/subscriptions/{id}/ledger"
    description: "List billing ledger entries of a subscription"
    roles: [PlatformAdmin, Customer, RetentionAgent, SystemOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: BillingLedgerEntry[]
    side_effects: []

  - method: GET
    path: "/api/v1/subscriptions/{id}/disclosures"
    description: "List disclosure records of a subscription"
    roles: [PlatformAdmin, Customer, RetentionAgent]
    code: 200
    input: []
    output: DisclosureRecord[]
    side_effects: []

  - method: POST
    path: "/api/v1/subscriptions/{id}/suspend"
    description: "Suspend an active subscription"
    roles: [Customer, RetentionAgent]
    code: 200
    input: []
    output: Subscription
    side_effects: ["enqueue SUSPEND signal", "family_discount recompute"]

  - method: POST
    path: "/api/v1/subscriptions/{id}/resume"
    description: "Resume a suspended subscription"
    roles: [Customer, RetentionAgent]
    code: 200
    input: []
    output: Subscription
    side_effects: ["enqueue RESUME signal", "family_discount recompute"]

  - method: POST
    path: "/api/v1/subscriptions/{id}/cancel"
    description: "Cancel subscription; IMMEDIATE refunds per cancellation_refund, END_OF_TERM schedules at end_at"
    roles: [Customer, RetentionAgent]
    code: 200
    input: [effective_mode]
    output: Subscription
    side_effects: ["per Subscription machine cancel transitions", "ledger PRORATION_CREDIT when IMMEDIATE on paid"]

  - method: POST
    path: "/api/v1/subscriptions/{id}/save-offers/accept"
    description: "Accept a SAVE-phase offer, reverting a scheduled cancel at a save rate for the next term"
    roles: [Customer, RetentionAgent]
    code: 200
    input: [offer_step_id]
    output: Subscription
    side_effects: ["per CANCEL_SCHEDULED -> ACTIVE transition", "OfferRedemption row created", "SAVE_CREDIT ledger entry"]

  - method: POST
    path: "/api/v1/subscriptions/{id}/disclosures/send"
    description: "Send a renewal/save/trial-end disclosure to the customer"
    roles: [RetentionAgent, PlatformAdmin, SystemOperator]
    code: 201
    input: [disclosure_type, channel]
    output: DisclosureRecord
    side_effects: ["subscription.disclosure_state -> SENT when type matches the REQUIRED disclosure"]

  - method: POST
    path: "/api/v1/subscriptions/{id}/disclosures/{disclosureId}/acknowledge"
    description: "Customer acknowledges a disclosure"
    roles: [Customer]
    code: 200
    input: []
    output: DisclosureRecord
    side_effects: ["acknowledged_at = now", "subscription.disclosure_state -> ACKNOWLEDGED when all required acknowledged"]

  - method: POST
    path: "/api/v1/subscriptions/{id}/signals/requeue"
    description: "Retention re-enqueues a replacement signal after EXHAUSTED (clears the block)"
    roles: [RetentionAgent]
    code: 201
    input: [command_type, idempotency_key]
    output: SignalCommand
    side_effects: ["new QUEUED SignalCommand; prior EXHAUSTED command remains terminal"]

  # --- signals ---
  - method: POST
    path: "/api/v1/signal-commands/{id}/ack"
    description: "Mark a SENT signal acknowledged by the radio"
    roles: [SystemOperator]
    code: 200
    input: []
    output: SignalCommand
    side_effects: ["per SignalCommand SENT -> ACKED side effects"]

  - method: POST
    path: "/api/v1/signal-commands/{id}/fail"
    description: "Mark a SENT signal failed; requeues or exhausts per attempt_count"
    roles: [SystemOperator]
    code: 200
    input: []
    output: SignalCommand
    side_effects: ["per SignalCommand SENT -> FAILED side effects"]

  - method: GET
    path: "/api/v1/signal-commands/{id}"
    description: "Get a signal command"
    roles: [PlatformAdmin, SystemOperator, RetentionAgent]
    code: 200
    input: []
    output: SignalCommand
    side_effects: []

  # --- offers ---
  - method: POST
    path: "/api/v1/offer-campaigns"
    description: "Create a campaign (DRAFT)"
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, lifecycle_phase, window_start_at, window_end_at]
    output: OfferCampaign
    side_effects: []

  - method: GET
    path: "/api/v1/offer-campaigns/{id}"
    description: "Get campaign"
    roles: [PlatformAdmin, Customer, RetentionAgent]
    code: 200
    input: []
    output: OfferCampaign
    side_effects: []

  - method: GET
    path: "/api/v1/offer-campaigns/{id}/steps"
    description: "List steps of a campaign"
    roles: [PlatformAdmin, Customer, RetentionAgent]
    code: 200
    input: []
    output: OfferStep[]
    side_effects: []

  - method: GET
    path: "/api/v1/offer-campaigns/{id}/redemptions"
    description: "List redemptions of a campaign"
    roles: [PlatformAdmin, RetentionAgent]
    code: 200
    input: ["customer_id?"]
    output: OfferRedemption[]
    side_effects: []

  - method: POST
    path: "/api/v1/offer-campaigns/{id}/steps"
    description: "Add an offer step to a DRAFT or PAUSED campaign"
    roles: [PlatformAdmin]
    code: 201
    input: [step_index, plan_id, "step_up_rank?", "discount_pct_bps?", "flat_discount_cents?", "eligibility_expr?", "max_redemptions_per_customer?"]
    output: OfferStep
    side_effects: []

  - method: POST
    path: "/api/v1/offer-campaigns/{id}/activate"
    description: "Activate a DRAFT or PAUSED campaign (overlap-checked)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: OfferCampaign
    side_effects: ["campaign_overlap_check"]

  - method: POST
    path: "/api/v1/offer-campaigns/{id}/pause"
    description: "Pause an ACTIVE campaign"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: OfferCampaign
    side_effects: []

  - method: POST
    path: "/api/v1/offer-campaigns/{id}/archive"
    description: "Archive a campaign"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: OfferCampaign
    side_effects: []

  - method: POST
    path: "/api/v1/offer-campaigns/{id}/redeem"
    description: "Redeem a campaign offer for a customer: provisions the step's plan as a paid sub (or converts the trial's radio)"
    roles: [Customer, RetentionAgent]
    code: 201
    input: [offer_step_id, customer_id, "radio_id?"]
    output: OfferRedemption
    side_effects:
      - "offer_step_pricing computes redeemed_price_cents"
      - "creates PAID Subscription (origin CALL_CENTER when RetentionAgent else WEB_SIGNUP) on the radio (or streaming-only)"
      - "OfferRedemption row persisted with redeemed_price_cents"
      - "CHARGE ledger entry; family_discount recompute"

  # --- filtered list GETs (FK reverse-reachability) ---
  - method: GET
    path: "/api/v1/customers/{id}/vehicles"
    description: "List vehicles owned by a customer"
    roles: [PlatformAdmin, AutomakerPartner, DealerPartner, Customer, RetentionAgent, SystemOperator]
    code: 200
    input: []
    output: Vehicle[]
    side_effects: []

  - method: GET
    path: "/api/v1/package-tiers/{id}/subscription-plans"
    description: "List plans on a package tier"
    roles: [PlatformAdmin, AutomakerPartner, DealerPartner, Customer, RetentionAgent, SystemOperator]
    code: 200
    input: []
    output: SubscriptionPlan[]
    side_effects: []

  - method: GET
    path: "/api/v1/subscription-plans/{id}/subscriptions"
    description: "List subscriptions on a plan"
    roles: [PlatformAdmin, RetentionAgent, SystemOperator]
    code: 200
    input: ["status?"]
    output: Subscription[]
    side_effects: []

  - method: GET
    path: "/api/v1/subscriptions/{id}/redemptions"
    description: "List offer redemptions attached to a subscription (0..1)"
    roles: [PlatformAdmin, Customer, RetentionAgent]
    code: 200
    input: []
    output: OfferRedemption[]
    side_effects: []

  - method: GET
    path: "/api/v1/subscriptions/{id}/signal-commands"
    description: "List signal commands for a subscription"
    roles: [PlatformAdmin, SystemOperator, RetentionAgent]
    code: 200
    input: ["status?"]
    output: SignalCommand[]
    side_effects: []

  - method: GET
    path: "/api/v1/automakers/{id}/vehicles"
    description: "List vehicles of an automaker"
    roles: [PlatformAdmin, AutomakerPartner, RetentionAgent, SystemOperator]
    code: 200
    input: []
    output: Vehicle[]
    side_effects: []

  - method: GET
    path: "/api/v1/offer-steps/{id}"
    description: "Get an offer step"
    roles: [PlatformAdmin, Customer, RetentionAgent]
    code: 200
    input: []
    output: OfferStep
    side_effects: []

  - method: GET
    path: "/api/v1/offer-steps"
    description: "List offer steps, filterable by plan"
    roles: [PlatformAdmin, Customer, RetentionAgent]
    code: 200
    input: ["plan_id?", "campaign_id?"]
    output: OfferStep[]
    side_effects: []

  - method: GET
    path: "/api/v1/offer-steps/{id}/redemptions"
    description: "List redemptions of an offer step"
    roles: [PlatformAdmin, RetentionAgent]
    code: 200
    input: []
    output: OfferRedemption[]
    side_effects: []

  - method: GET
    path: "/api/v1/customers/{id}/redemptions"
    description: "List offer redemptions of a customer"
    roles: [PlatformAdmin, Customer, RetentionAgent]
    code: 200
    input: []
    output: OfferRedemption[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/unknown role header or missing X-User-ID for entity_backed role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "role not permitted for endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path id does not resolve" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "body FK reference does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, bad enum, bad format (VIN length, ranges)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "transition not declared from current state" }
  - { id: ERR_FORBIDDEN_OWNER, http: 403, condition: "customer-scoped action by non-owner" }
  - { id: ERR_DUPLICATE, http: 409, condition: "uniqueness violation (vin, esn, email, codes, idempotency_key)" }
  - { id: ERR_RADIO_INELIGIBLE, http: 422, condition: "radio not eligible for trial per trial_eligibility" }
  - { id: ERR_HARDWARE_INCOMPATIBLE, http: 422, condition: "plan tier requires newer radio hardware generation" }
  - { id: ERR_CAMPAIGN_WINDOW, http: 422, condition: "redeem outside window, campaign not ACTIVE, or window_end_at <= window_start_at on create" }
  - { id: ERR_CAMPAIGN_OVERLAP, http: 409, condition: "phase-window occupied by another ACTIVE/PAUSED campaign (half-open overlap)" }
  - { id: ERR_OFFER_SEQUENCE_VIOLATION, http: 422, condition: "step_up_rank sequencing violated: lower-rank step neither redeemed nor ineligible" }
  - { id: ERR_OFFER_INELIGIBLE, http: 422, condition: "eligibility_expr false or per-customer redemption cap reached" }
  - { id: ERR_SAVE_CAP_REACHED, http: 422, condition: "third save-offer accept in the same term" }
  - { id: ERR_RENEWAL_DISCLOSURE_REQUIRED, http: 422, condition: "regulatory disclosure missing/late for renewal charge or immediate cancel of auto-renew paid sub" }
  - { id: ERR_SIGNAL_EXHAUSTED_BLOCK, http: 409, condition: "suspend/immediate-cancel blocked by EXHAUSTED signal on the subscription" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version mismatch on OCC-guarded endpoint" }
  - { id: ERR_DEALER_NOT_ENROLLED, http: 422, condition: "used-reactivation by dealer not enrolled in used program" }
  - { id: ERR_TRIAL_PLAN_REQUIRED, http: 422, condition: "trials/feed/reactivation endpoints require plan.is_trial == true" }
  - { id: ERR_PAID_PLAN_REQUIRED, http: 422, condition: "direct purchase/redeem requires plan.is_trial == false" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; configures reference data, campaigns, partners"
    identity: opaque
    exclusive_operations: ["POST /api/v1/automakers", "POST /api/v1/dealers", "POST /api/v1/dealers/{id}/enroll-used-program", "POST /api/v1/package-tiers", "POST /api/v1/subscription-plans", "offer-campaign create/activate/pause/archive/steps"]
    shared_operations: ["reads", "POST /api/v1/vehicles", "POST /api/v1/radios", "POST /api/v1/radios/{id}/trials", "POST /api/v1/vehicles/{id}/transfer_ownership", "POST /api/v1/subscriptions", "POST /api/v1/_clock/set_current_utc", "disclosures/send"]

  - name: AutomakerPartner
    description: "Automaker data-feed integration; submits eligibility feeds, registers vehicles/radios"
    identity: "entity_backed:Automaker"
    exclusive_operations: ["POST /api/v1/automakers/{id}/data-feeds"]
    shared_operations: ["POST /api/v1/vehicles", "POST /api/v1/radios", "POST /api/v1/radios/{id}/trials", "reads"]

  - name: DealerPartner
    description: "Franchise/used dealer; used-vehicle reactivation program"
    identity: "entity_backed:Dealer"
    exclusive_operations: ["POST /api/v1/dealers/{id}/used-reactivations"]
    shared_operations: ["POST /api/v1/vehicles", "POST /api/v1/radios/{id}/trials", "POST /api/v1/vehicles/{id}/transfer_ownership", "reads"]

  - name: Customer
    description: "Subscriber; manages own subscriptions, disclosures, save offers"
    identity: "entity_backed:Customer"
    exclusive_operations: ["POST /api/v1/subscriptions/{id}/disclosures/{disclosureId}/acknowledge"]
    shared_operations: ["POST /api/v1/subscriptions", "cancel/suspend/resume/save-accept on own subs", "POST /api/v1/offer-campaigns/{id}/redeem", "POST /api/v1/radios/{id}/trials", "POST /api/v1/vehicles/{id}/transfer_ownership", "reads of own resources"]

  - name: RetentionAgent
    description: "Call-center retention; cancels, save offers, disclosures, signal requeue"
    identity: opaque
    exclusive_operations: ["POST /api/v1/subscriptions/{id}/signals/requeue"]
    shared_operations: ["cancel/suspend/resume/save-accept", "POST /api/v1/subscriptions", "disclosures/send", "redeem", "reads"]

  - name: SystemOperator
    description: "Batch/ops operator; renewals, signal dispatch, ack/fail"
    identity: opaque
    exclusive_operations: ["POST /api/v1/_billing/run_renewals", "POST /api/v1/_signals/dispatch", "POST /api/v1/signal-commands/{id}/ack", "POST /api/v1/signal-commands/{id}/fail"]
    shared_operations: ["POST /api/v1/_clock/set_current_utc", "disclosures/send", "reads"]

  - name: Anonymous
    description: "Unauthenticated self-service registration"
    identity: opaque
    exclusive_operations: ["POST /api/v1/customers"]
    shared_operations: []
