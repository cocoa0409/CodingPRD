        as_user_id: director-1
      assert:
      - the replayed APPROVE returns 409 with data.error_id == "ERR_INVALID_STATE"
      - RiskAssessment.${ra_id}.status is still APPROVED
      - RiskAssessment.${ra_id}.version is still 3 (create 1, SUBMIT 2, APPROVE 3) — the rejected replay does not increment it
      - RiskAssessment.${ra_id}.approved_by_user_id is still "director-1"
      - SecurityEvent.${event_id}.status is still RISK_ASSESSED and SecurityEvent.${event_id}.version is still 2 (create 1, cascade from the first APPROVE 2), so the cascade did not fire a second time
  - name: second_risk_assessment_approval_supersedes_the_prior_approved_one
    claim_type: side_effect_execution
    grounds:
    - state_machines.RiskAssessment.SUBMITTED_to_APPROVED
    - state_machines.RiskAssessment.APPROVED_to_SUPERSEDED
    - state_machines.RiskAssessment.terminal_states
    distinguishing_aspect: |
      APPROVED -> SUPERSEDED is the only transition in this §1.2 driven by a SIBLING row rather than by the row itself or by its parent, so it is the claim that a second approval on the same event silently retires the incumbent assessment: the winner keeps its own numbers while the loser reaches the only terminal state RiskAssessment has, and the event is NOT advanced twice.
    test_recipe:
      setup:
      - logical clock at 2026-09-01T00:00:00Z
      - Venue "Harbor Arena" (gross_capacity 8000, door_count 1) with zones ZF (FLOOR, 200 sqm), ZI (CONCOURSE, 100 sqm, ingress) and ZE (EXIT_CORRIDOR, 50 sqm); SecurityEvent with expected_attendance 200,
