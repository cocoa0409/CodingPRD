scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - distinguishing_aspect: "Dual variant on the Issuer liquidity domain: for identical inputs, the\nexcluding-credit numerator (100000 cents)\
      \ yields 35555 bps while the\nincluding-credit numerator (110000 cents) yields 39111 bps \u2014 the variants\ndiffer by exactly the unused-credit-line\
      \ term, on a different entity\ndomain (Issuer liquidity) than the pass-through payment variants.\n"
    grounds:
    - calculations.liquidity_ratio
    - entities.Issuer.fields.liquidity_ratio_excluding_credit_bps
    - entities.Issuer.fields.liquidity_ratio_including_credit_bps
    name: liquidity_ratio_excluding_vs_including_credit
    test_recipe:
      assert:
      - Issuer.${iss_id}.advance_obligation_cents == 28125
      - PassThroughPayment.${pay_id}.funding_source == ADVANCE and amount_cents == 28125
      - Issuer.${iss_id}.liquidity_ratio_excluding_credit_bps == floor(100000*10000/28125) == 35555
      - Issuer.${iss_id}.liquidity_ratio_including_credit_bps == floor(110000*10000/28125) == 39111
      - Issuer.${iss_id}.status == ACTIVE (both ratios far above the 300 bps hard floor, so no SUSPENDED cascade)
      - the two variants differ by floor(10000*10000/28125) == 3555 bps, attributable solely to the unused_credit_lines_cents numerator term
      setup:
      - Clock 2026-09-10T00:00:00Z. Issuer ACTIVE; PATCH financials sets liquid_assets_cents = 100000 and unused_credit_lines_cents = 10000.
      - Pool LIVE with one loan (principal 4500000 cents, note 850 bps, pool note 750 bps, FHA); auto-created report for 2026-09 submitted and
        accepted, generating a PassThroughPayment of floor(4500000*750/10000/12) = 28125 cents.
      - Issuer P_AND_I custodial account has 0 balance, so settling the payment routes to the ADVANCE path and opens a LiquidityAdvance of 28125
        cents (>= the hard floor so no SUSPENDED cascade interferes with the ratio read).
      setup_api_calls:
      - as: PlatformAdmin
        call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-10T00:00:00Z'
      - as: ApplicantOfficer
        as_user_id: officer-meridian
        call: POST /issuer-applications
        captures:
          app_id: $.data.id
        payload:
          annual_origination_volume_cents: 5000000000
          branch_count: 2
          legal_name: Meridian Home Lending
          liquid_assets_cents: 9000000
          net_worth_cents: 900000000
          origination_experience_months: 60
          unused_credit_lines_cents: 0
      - as: ApplicantOfficer
        as_user_id: officer-meridian
        call: POST /issuer-applications/${app_id}/submit
        payload: {}
      - as: AgencyReviewer
        as_user_id: reviewer-1
        call: POST /issuer-applications/${app_id}/review
        payload: {}
      - as: AgencyReviewer
        as_user_id: reviewer-1
        call: POST /issuer-applications/${app_id}/approve
        payload: {}
      - as: AgencyReviewer
        call: GET /issuer-applications/${app_id}
        captures:
          iss_id: $.data.approved_issuer_id
        payload: {}
      - as: PlatformAdmin
        call: GET /issuers/${iss_id}
        captures:
          iss_v0: $.data.version
        payload: {}
      - as: IssuerOfficer
        as_user_id: ${iss_id}
        call: PATCH /issuers/${iss_id}/financials
        payload:
          expected_issuer_version: ${iss_v0}
          liquid_assets_cents: 100000
          unused_credit_lines_cents: 10000
      - as: PlatformAdmin
        call: GET /issuers/${iss_id}
        captures:
          iss_v1: $.data.version
        payload: {}
      - as: PlatformAdmin
        call: POST /document-custodians
        captures:
          cust_id: $.data.id
        payload:
          firm_name: TrustVault Custody
      - as: IssuerOfficer
        as_user_id: ${iss_id}
        call: POST /custodian-engagements
        payload:
          custodian_id: ${cust_id}
          issuer_id: ${iss_id}
          window_end: '2027-01-01'
          window_start: '2026-01-01'
      - as: IssuerOfficer
        as_user_id: ${iss_id}
        call: POST /pools
        captures:
          pool_id: $.data.id
        payload:
          custodian_id: ${cust_id}
          expected_issuer_version: ${iss_v1}
          issuer_id: ${iss_id}
          note_rate_bps: 750
          pool_type: SINGLE_FAMILY
          term_months: 360
      - as: IssuerOfficer
        as_user_id: ${iss_id}
        call: POST /loans
        payload:
          escrow_monthly_cents: 30000
          government_insurance: FHA
          note_rate_bps: 850
          pool_id: ${pool_id}
          principal_balance_cents: 4500000
      - as: IssuerOfficer
        as_user_id: ${iss_id}
        call: POST /pools/${pool_id}/assemble
        payload: {}
      - as: DocumentCustodian
        as_user_id: ${cust_id}
        call: POST /pools/${pool_id}/certifications
        payload:
          decision: CERTIFIED
      - as: IssuerOfficer
        as_user_id: ${iss_id}
        call: POST /pools/${pool_id}/activate
        payload: {}
      - as: PlatformAdmin
        call: GET /investor-reports
        captures:
          rep_id: $.data[0].id
        payload:
          pool_id: ${pool_id}
      - as: IssuerOfficer
        as_user_id: ${iss_id}
        call: POST /investor-reports/${rep_id}/submit
        payload: {}
      - as: AgencyReviewer
        as_user_id: reviewer-1
        call: POST /investor-reports/${rep_id}/accept
        payload: {}
      - as: PlatformAdmin
        call: GET /pass-through-payments
        captures:
          pay_id: $.data[0].id
        payload:
          report_id: ${rep_id}
      - as: IssuerOfficer
        as_user_id: ${iss_id}
        call: POST /pass-through-payments/${pay_id}/settle
        payload: {}
      trigger:
      - as: PlatformAdmin
        call: GET /issuers/${iss_id}
        captures:
          adv: $.data.advance_obligation_cents
          ratio_ex: $.data.liquidity_ratio_excluding_credit_bps
          ratio_in: $.data.liquidity_ratio_including_credit_bps
          st: $.data.status
        payload: {}
  - name: pass_through_scheduled_vs_actual_collection
    grounds:
    - calculations.pass_through_payment
    - entities.InvestorReport.fields.scheduled_payment_cents
    - entities.InvestorReport.fields.actual_collected_cents
    - entities.InvestorReport.fields.advance_required_cents
    distinguishing_aspect: "Dual variant on the InvestorReport (payment) domain: for identical\nloan data, the scheduled variant rounds per-loan\
      \ interest first\n(667 + 667 = 1334) while the actual variant floors once after\nscaling the unrounded aggregate ratio at 80% collection\
      \ (1067) \u2014\ndifferent rounding order AND different collection assumption.\n"
    test_recipe:
      setup:
      - 'Clock 2026-09-05T00:00:00Z. Issuer ACTIVE. Pool LIVE with two loans: A principal 1000000 note 780bps, B principal 1000100 note 780bps,
        pool note rate 680bps.'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-05T00:00:00Z'
        as: PlatformAdmin
      - call: POST /issuer-applications
        payload:
          legal_name: Canyon Mortgage Co
          net_worth_cents: 900000000
          liquid_assets_cents: 5000000
          origination_experience_months: 48
          branch_count: 1
          annual_origination_volume_cents: 3000000000
        as: ApplicantOfficer
        as_user_id: officer-canyon
        captures:
          app_id: $.data.id
      - call: POST /issuer-applications/${app_id}/submit
        payload: {}
        as: ApplicantOfficer
        as_user_id: officer-canyon
      - call: POST /issuer-applications/${app_id}/review
        payload: {}
        as: AgencyReviewer
        as_user_id: reviewer-2
      - call: POST /issuer-applications/${app_id}/approve
        payload: {}
        as: AgencyReviewer
        as_user_id: reviewer-2
      - call: GET /issuer-applications/${app_id}
        payload: {}
        as: AgencyReviewer
        captures:
          iss_id: $.data.approved_issuer_id
      - call: GET /issuers/${iss_id}
        payload: {}
        as: PlatformAdmin
        captures:
          iss_v: $.data.version
      - call: POST /document-custodians
        payload:
          firm_name: TrustVault Custody
        as: PlatformAdmin
        captures:
          cust_id: $.data.id
      - call: POST /custodian-engagements
        payload:
          custodian_id: ${cust_id}
          issuer_id: ${iss_id}
          window_start: '2026-01-01'
          window_end: '2027-01-01'
        as: IssuerOfficer
        as_user_id: ${iss_id}
      - call: POST /pools
        payload:
          issuer_id: ${iss_id}
          custodian_id: ${cust_id}
          pool_type: SINGLE_FAMILY
          term_months: 360
          note_rate_bps: 680
          expected_issuer_version: ${iss_v}
        as: IssuerOfficer
        as_user_id: ${iss_id}
        captures:
          pool_id: $.data.id
      - call: POST /loans
        payload:
          pool_id: ${pool_id}
          principal_balance_cents: 1000000
          note_rate_bps: 780
          government_insurance: VA
          escrow_monthly_cents: 20000
        as: IssuerOfficer
        as_user_id: ${iss_id}
      - call: POST /loans
        payload:
          pool_id: ${pool_id}
          principal_balance_cents: 1000100
          note_rate_bps: 780
          government_insurance: VA
          escrow_monthly_cents: 20000
        as: IssuerOfficer
        as_user_id: ${iss_id}
      - call: POST /pools/${pool_id}/assemble
        payload: {}
        as: IssuerOfficer
        as_user_id: ${iss_id}
      - call: POST /pools/${pool_id}/certifications
        payload:
          decision: CERTIFIED
        as: DocumentCustodian
        as_user_id: ${cust_id}
      - call: POST /pools/${pool_id}/activate
        payload: {}
        as: IssuerOfficer
        as_user_id: ${iss_id}
        captures:
          pool_v: $.data.version
      trigger:
      - call: POST /investor-reports
        payload:
          pool_id: ${pool_id}
          period_month: 2026-10
          collection_rate_bps: 8000
          expected_pool_version: ${pool_v}
        as: IssuerOfficer
        as_user_id: ${iss_id}
        captures:
          rep_id: $.data.id
          sched: $.data.scheduled_payment_cents
          act: $.data.actual_collected_cents
          advr: $.data.advance_required_cents
      assert:
      - InvestorReport.${rep_id}.scheduled_payment_cents == 11333
      - InvestorReport.${rep_id}.actual_collected_cents == floor((2000100*680/10000/12) * 8000/10000) == floor(11333.9 * 0.8) == 9067
      - InvestorReport.${rep_id}.advance_required_cents == 11333 - 9067 == 2266
      - scheduled (11333) != actual (9067) for identical loan data, and the actual variant is NOT 80% of the scheduled variant (9067 != floor(11333*0.8)=9066)
        because the rounding order differs
- rule_id: combinatorial_formula
  instances:
  - name: net_worth_requirement_branch_vs_volume_tiers
    grounds:
    - calculations.net_worth_requirement
    - entities.IssuerApplication.fields.net_worth_requirement_cents
    distinguishing_aspect: "Mode (a): three inputs (branch_count, annual_origination_volume_cents,\nfloor constant) interact non-linearly through\
      \ max() with a per-branch\nadder and a floored volume term \u2014 the branch tier binds for app A\n(300000000) while the volume tier binds\
      \ for app B (360000000), and the\ntwo requirements differ despite identical net_worth_cents inputs.\n"
    test_recipe:
      setup:
      - Empty database. Two draft applications, both with net_worth_cents = 400000000, liquid_assets_cents = 5000000, origination_experience_months
        = 36.
      - 'App A: branch_count 3, volume 2500000000 -> branch tier 250000000 + (3-1)*25000000 = 300000000; volume tier floor(2500000000*10/10000)
        = 250000000; requirement = 300000000.'
      - 'App B: branch_count 1, volume 3600000000 -> branch tier 250000000; volume tier floor(3600000000*10/10000) = 360000000; requirement =
        360000000.'
      setup_api_calls:
      - call: POST /issuer-applications
        payload:
          legal_name: Three Branch Bank
          net_worth_cents: 400000000
          liquid_assets_cents: 5000000
          origination_experience_months: 36
          branch_count: 3
          annual_origination_volume_cents: 2500000000
        as: ApplicantOfficer
        as_user_id: officer-a
        captures:
          app_a: $.data.id
      - call: POST /issuer-applications
        payload:
          legal_name: High Volume Lender
          net_worth_cents: 400000000
          liquid_assets_cents: 5000000
          origination_experience_months: 36
          branch_count: 1
          annual_origination_volume_cents: 3600000000
        as: ApplicantOfficer
        as_user_id: officer-b
        captures:
          app_b: $.data.id
      trigger:
      - call: GET /issuer-applications/${app_a}
        payload: {}
        as: AgencyReviewer
        captures:
          req_a: $.data.net_worth_requirement_cents
      - call: GET /issuer-applications/${app_b}
        payload: {}
        as: AgencyReviewer
        captures:
          req_b: $.data.net_worth_requirement_cents
      assert:
      - IssuerApplication.${app_a}.net_worth_requirement_cents == 300000000 (branch tier binds)
      - IssuerApplication.${app_b}.net_worth_requirement_cents == 360000000 (volume tier binds)
      - 300000000 != 360000000 although both applications declared identical net_worth_cents
  - name: pass_through_payment_rounding_order_pinned
    grounds:
    - calculations.pass_through_payment
    distinguishing_aspect: "Mode (b) \u2014 different mode than instance 1: the scheduled variant rounds\neach loan's monthly interest FIRST then\
      \ sums (5666 + 5667 = 11333),\nwhereas the actual variant floors once after scaling the unrounded\naggregate ratio at 80% collection (9067);\
      \ floor(11333*0.8) = 9066\nwould be the wrong order, so the two orders observably diverge by one\ncent at identical inputs.\n"
    test_recipe:
      setup:
      - Clock 2026-09-05T00:00:00Z. Issuer ACTIVE. Pool LIVE with loans 1000000 and 1000100 cents at note 780 bps; pool note 680 bps.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
