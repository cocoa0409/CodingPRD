              payload: { vote: "APPROVE" }
              as: CommitteeMember
              as_user_id: "${m1_id}"
            - call: "POST /exception-requests/${ex_id}/vote"
              payload: { vote: "APPROVE" }
              as: CommitteeMember
              as_user_id: "${m2_id}"
            - call: "POST /blackout-windows"
              payload: { kind: "QUARTERLY", fiscal_year: 2026, fiscal_quarter: "Q3", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
          trigger:
