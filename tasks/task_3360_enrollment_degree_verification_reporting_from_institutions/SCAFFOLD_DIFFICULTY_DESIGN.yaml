  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: degree_seal_requires_institution_active
        grounds:
          - state_machines.DegreeRecord.REPORTED_to_SEALED
          - errors[ERR_INSTITUTION_SUSPENDED]
        distinguishing_aspect: |
          Pair (DegreeRecord -> Institution): a REPORTED degree cannot seal while
          its institution is SUSPENDED — the degree's own transition set is
          conditional on a different entity's state.
        test_recipe:
          setup:
            - "Compliant institution; one student; REPORTED degree; institution then ops-suspended"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id", cert_uid: "$.data.users[1].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-08-01", term_end: "2026-12-15", submission_opens_at: "2026-08-15", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-08-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { st1: "$.data[0].student_id" } }
            - { call: "POST /degree-records", payload: { institution_id: "${inst_id}", student_id: "${st1}", degree_level: "BACHELOR", degree_title: "BS CS", conferred_on: "2026-05-15" }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { deg1: "$.data.id" } }
            - { call: "POST /institutions/${inst_id}/suspend", payload: {}, as: ClearinghouseOps }
          trigger:
            - { call: "POST /degree-records/${deg1}/seal", payload: {}, as: RegistrarCertifier, as_user_id: "${cert_uid}", captures: { seal_err: "$.data.error_id" } }
            - { call: "GET /degree-records/${deg1}", payload: {}, as: ClearinghouseOps, captures: { deg_status: "$.data.status" } }
          assert:
            - "captured seal_err == ERR_INSTITUTION_SUSPENDED"
            - "captured deg_status == REPORTED (no transition occurred)"

      - name: file_upload_requires_period_not_scheduled
        grounds:
          - state_machines.ReportingPeriod
          - errors[ERR_PERIOD_NOT_OPEN]
          - concurrency_rules[file-upload-stale-period]
        distinguishing_aspect: |
          Pair (EnrollmentFile -> ReportingPeriod): an upload presented with the
          CORRECT period version (OCC satisfied) is still rejected while the
          period is SCHEDULED — cross-entity state, not staleness, is what blocks.
        test_recipe:
          setup:
            - "Compliant institution; period Fall 2026 with submission_opens_at 2026-11-01 is still SCHEDULED at the default clock 2026-09-01 (version 1)"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-09-01", term_end: "2026-12-15", submission_opens_at: "2026-11-01", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
          trigger:
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { up_err: "$.data.error_id" } }
          assert:
            - "captured up_err == ERR_PERIOD_NOT_OPEN (period SCHEDULED at default clock 2026-09-01 < opens 2026-11-01)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: agreement_half_open_adjacency
        grounds:
          - validations[priority=30]
          - errors[ERR_AGREEMENT_OVERLAP]
          - entities.ParticipationAgreement.fields.effective_to
        distinguishing_aspect: |
          Half-open semantics on ParticipationAgreement: [from, to) — a new
          agreement whose effective_from equals the incumbent's effective_to is
          ADJACENT and allowed, while one day earlier overlaps and is rejected.
        test_recipe:
          setup:
            - "Institution with agreement A [2026-01-01, 2027-06-30) ACTIVE"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
          trigger:
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2027-06-29", effective_to: "2028-06-30" }, as: ClearinghouseOps, captures: { ov_err: "$.data.error_id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2027-06-30", effective_to: "2028-06-30" }, as: ClearinghouseOps, captures: { adj_status: "$.data.status" } }
          assert:
            - "captured ov_err == ERR_AGREEMENT_OVERLAP (2027-06-29 < incumbent's exclusive end 2027-06-30)"
            - "captured adj_status == SCHEDULED (adjacent half-open successor accepted; starts in the future)"

      - name: period_closed_occupancy_through_due_date
        grounds:
          - validations[priority=31]
          - errors[ERR_PERIOD_OVERLAP]
          - entities.ReportingPeriod.fields.submission_due_at
        distinguishing_aspect: |
          Different semantics on a different resource: ReportingPeriod occupancy
          is the CLOSED interval [term_start, submission_due_at], so a new period
          whose term_start falls exactly ON the incumbent's due date collides
          (contrast: agreement adjacency is allowed); only the day after passes.
        test_recipe:
          setup:
            - "Institution with period P1 term [2026-09-01, 2026-12-15], submission_due_at 2026-12-20"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id" } }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-09-01", term_end: "2026-12-15", submission_opens_at: "2026-11-01", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { p1_id: "$.data.id" } }
          trigger:
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Winter 2026", term_start: "2026-12-20", term_end: "2027-03-15", submission_opens_at: "2027-01-05", submission_due_at: "2027-03-31" }, as: ClearinghouseOps, captures: { ov_err: "$.data.error_id" } }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Winter 2026", term_start: "2026-12-21", term_end: "2027-03-15", submission_opens_at: "2027-01-05", submission_due_at: "2027-03-31" }, as: ClearinghouseOps, captures: { ok_id: "$.data.id", ok_status: "$.data.status" } }
          assert:
            - "captured ov_err == ERR_PERIOD_OVERLAP (term_start == incumbent submission_due_at collides under closed occupancy)"
            - "captured ok_status == SCHEDULED (term_start 2026-12-21 strictly after due 2026-12-20)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: failed_fulfillment_refund_conserves_balance
        grounds:
          - state_machines.VerificationRequest.PAID_to_BLOCKED_PRIVACY
          - entities.Requester.fields.credit_balance_cents
          - entities.VerificationRequest.fields.refund_cents
        distinguishing_aspect: |
          Conserved quantity is monetary: requester.credit_balance_cents after a
          pay (debit 2599) followed by a BLOCKED_PRIVACY fulfill (credit 2599)
          must equal the pre-pay balance exactly — the compensating action
          zeroes the forward action.
        test_recipe:
          setup:
            - "Compliant institution with one student; VETTED requester balance 10000; PAID DEGREE request (fee 2599); DIRECTORY_BLOCK placed on the student AFTER payment"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-08-01", term_end: "2026-12-15", submission_opens_at: "2026-08-15", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-08-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { st1: "$.data[0].student_id" } }
            - { call: "POST /requesters", payload: { org_name: "Acme Hiring", requester_kind: "EMPLOYER", initial_credit_cents: 10000 }, as: ClearinghouseOps, captures: { rq_id: "$.data.id" } }
            - { call: "POST /requesters/${rq_id}/vet", payload: { outcome: "VET" }, as: ClearinghouseOps }
            - { call: "POST /verification-requests", payload: { requester_id: "${rq_id}", student_id: "${st1}", institution_id: "${inst_id}", product_type: "DEGREE", purpose: "EMPLOYMENT" }, as: Requester, as_user_id: "${rq_id}", captures: { vr1: "$.data.id" } }
            - { call: "POST /verification-requests/${vr1}/pay", payload: {}, as: Requester, as_user_id: "${rq_id}" }
            - { call: "GET /requesters/${rq_id}", payload: {}, as: ClearinghouseOps, captures: { bal_mid: "$.data.credit_balance_cents" } }
            - { call: "GET /students/${st1}", payload: {}, as: ClearinghouseOps, captures: { st_v: "$.data.version" } }
            - { call: "POST /students/${st1}/privacy-directives", payload: { directive_type: "DIRECTORY_BLOCK", effective_from: "2026-01-01", expected_student_version: "${st_v}" }, as: ClearinghouseOps }
          trigger:
            - { call: "POST /verification-requests/${vr1}/fulfill", payload: {}, as: ClearinghouseOps, captures: { vr_status: "$.data.status", vr_refund: "$.data.refund_cents" } }
            - { call: "GET /requesters/${rq_id}", payload: {}, as: ClearinghouseOps, captures: { bal_end: "$.data.credit_balance_cents" } }
          assert:
            - "captured bal_mid == 7401 (10000 - 2599)"
            - "captured vr_status == BLOCKED_PRIVACY and vr_refund == 2599"
            - "captured bal_end == 10000 (forward + compensating action conserve the balance)"

      - name: correction_conserves_period_student_coverage
        grounds:
          - state_machines.CorrectionCase.FILED_to_APPLIED
          - state_machines.EnrollmentEntry.ACCEPTED_to_SUPERSEDED
          - entities.EnrollmentFile.fields.row_count
        distinguishing_aspect: |
          Different conserved quantity (coverage cardinality, not money): applying
          a correction supersedes one entry and creates its replacement for the
          SAME student, so the set of distinct students covered by ACCEPTED
          non-SUPERSEDED entries for the period is invariant (exactly {S1,S2,S3}),
          while the file's row partition row_count == accepted_rows + rejected_rows
          also holds at 4 == 4 + 0.
        test_recipe:
          setup:
            - "Compliant institution; certified Fall file with three students S1,S2,S3 (UNDERGRAD 12.0); correction on S1's entry lowering credits to 3.0, APPROVED"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id", cert_uid: "$.data.users[1].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-09-01", term_end: "2026-12-15", submission_opens_at: "2026-11-01", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Student One", date_of_birth: "2004-01-01", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S2", full_name: "Student Two", date_of_birth: "2004-01-02", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S3", full_name: "Student Three", date_of_birth: "2004-01-03", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
            - { call: "POST /enrollment-files/${file_id}/certify", payload: {}, as: RegistrarCertifier, as_user_id: "${cert_uid}" }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { e1: "$.data[0].id", st1: "$.data[0].student_id" } }
            - { call: "POST /correction-cases", payload: { enrollment_entry_id: "${e1}", corrected_credit_hours: 3.0, reason_code: "REPORTING_ERROR" }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { case_id: "$.data.id" } }
          trigger:
            - { call: "POST /correction-cases/${case_id}/decision", payload: { outcome: "APPROVED" }, as: RegistrarCertifier, as_user_id: "${cert_uid}" }
            - { call: "GET /enrollment-entries", payload: { institution_id: "${inst_id}", entry_status: "ACCEPTED" }, as: ClearinghouseOps, captures: { acc_count: "$.meta.total_count" } }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { e1_after: "$.data[0].entry_status", e2_credits: "$.data[3].credit_hours", e2_status: "$.data[3].status_code", e2_student: "$.data[3].student_id" } }
            - { call: "GET /enrollment-files/${file_id}", payload: {}, as: ClearinghouseOps, captures: { f_rows: "$.data.row_count", f_acc: "$.data.accepted_rows", f_rej: "$.data.rejected_rows" } }
          assert:
            - "captured acc_count == 3 (exactly 3 ACCEPTED non-SUPERSEDED entries remain; coverage {S1,S2,S3} unchanged)"
            - "captured e1_after == SUPERSEDED"
            - "captured e2_student == ${st1} (replacement covers the same student)"
            - "captured e2_credits == 3.0 and e2_status == LESS_THAN_HALF_TIME"
            - "captured f_rows == 4 and f_acc == 4 and f_rej == 0 (partition 4 == 4 + 0 conserved)"
