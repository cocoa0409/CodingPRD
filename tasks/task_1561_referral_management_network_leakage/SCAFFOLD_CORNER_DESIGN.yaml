          assert:
            - "stale booking -> error_id == ERR_STALE_VERSION, HTTP 412; no appointment created"
            - "fresh booking (version 4) succeeds: Appointment.${a2} created"
            - "Appointment.${a1}.status == CANCELLED and superseded == true"
            - "Referral.${r}.status == SCHEDULED and version == 5"

