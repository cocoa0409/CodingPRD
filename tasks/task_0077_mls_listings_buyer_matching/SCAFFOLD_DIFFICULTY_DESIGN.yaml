              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/lockboxes"
              payload: { serial_no: "LB-14" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_v2: $.data.version }
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_id: "${buyer_id}", buyer_agent_id: "${ba_id}", initial_price_cents: 50000000, earnest_money_cents: 0, requested_contingencies: ["INSPECTION", "APPRAISAL"] }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offers/${off_id}/accept"
              payload: { expected_listing_version: "${lst_v2}" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "GET /offers/${off_id}/contingencies"
              payload: {}
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { ins_id: "$.data[?(@.kind=='INSPECTION')].id", appr_id: "$.data[?(@.kind=='APPRAISAL')].id" }
            - call: "POST /contingencies/${ins_id}/fail"
              payload: {}
              as: BuyerAgent
              as_user_id: "${ba_id}"
          trigger:
            - call: "POST /contingencies/${appr_id}/resolve"
              payload: { appraised_value_cents: 50000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Resolving the APPRAISAL contingency returns ERR_INVALID_STATE (409) — Listing reverted to ACTIVE so contingencies can no longer be worked (also the contingency was already WAIVED by compensation)"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: showing_buffered_overlap_within_turnaround
        grounds:
          - calculations.showing_overlap
          - state_machines.ShowingAppointment.transitions.REQUESTED_to_CONFIRMED
          - errors[ERR_SHOWING_CONFLICT]
        distinguishing_aspect: |
          On the Lockbox resource, the overlap test widens each CONFIRMED interval by turnaround_minutes on the END:
          a second showing starting one second inside the first's end+buffer (15:30 + 30min = 16:00, candidate at 15:59:59)
          conflicts with ERR_SHOWING_CONFLICT — buffer-extended half-open interval arithmetic.
        test_recipe:
          setup:
            - "ACTIVE listing, lockbox turnaround_minutes=30, one CONFIRMED showing [15:00,15:30)."
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara", license_no: "L-1015" }
              as: Anonymous
              captures: { la_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Ben", license_no: "B-2015" }
              as: Anonymous
              captures: { ba_id: $.data.id }
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${ba_id}", full_name: "Bob", max_budget_cents: 60000000, monthly_income_cents: 2000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "15 Oak St", list_price_cents: 50000000 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/lockboxes"
              payload: { serial_no: "LB-15", turnaround_minutes: 30 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lb_id: $.data.id }
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /lockboxes/${lb_id}/showings"
              payload: { buyer_agent_id: "${ba_id}", buyer_id: "${buyer_id}", start_at: "2026-07-01T15:00:00Z", end_at: "2026-07-01T15:30:00Z" }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { sh1_id: $.data.id }
            - call: "POST /showings/${sh1_id}/confirm"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /lockboxes/${lb_id}/showings"
              payload: { buyer_agent_id: "${ba_id}", buyer_id: "${buyer_id}", start_at: "2026-07-01T15:59:59Z", end_at: "2026-07-01T16:30:00Z" }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { sh2_id: $.data.id }
          trigger:
            - call: "POST /showings/${sh2_id}/confirm"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Second confirm returns ERR_SHOWING_CONFLICT (409) — 15:59:59 < 15:30+30min buffer boundary 16:00:00"

      - name: address_uniqueness_among_non_terminal_listings
        grounds:
          - validations[priority=12]
          - entities.Listing.fields.address
          - errors[ERR_DUPLICATE]
        distinguishing_aspect: |
          On the Listing resource a second listing reusing an address already held by a non-terminal listing
          (status NOT IN {WITHDRAWN, CLOSED}) is rejected ERR_DUPLICATE — a point-occupancy (zero-length identity
          interval) semantics distinct from the showing's buffered time interval, and freed once the prior is WITHDRAWN.
        test_recipe:
          setup:
            - "A DRAFT listing already occupies address '20 Pine St'."
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara", license_no: "L-1016" }
              as: Anonymous
              captures: { la_id: $.data.id }
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "20 Pine St", list_price_cents: 50000000 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst1_id: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "20 Pine St", list_price_cents: 60000000 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Second create returns ERR_DUPLICATE (409) — address occupied by a non-terminal listing"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: commission_shares_sum_to_total_invariant
        grounds:
          - calculations.run_commission_split
          - entities.CommissionLedger.fields.coop_commission_cents
          - entities.CommissionLedger.fields.listing_side_commission_cents
          - entities.CommissionLedger.fields.total_commission_cents
        distinguishing_aspect: |
          Conserved quantity = total_commission_cents: coop_commission_cents + listing_side_commission_cents MUST
          equal total_commission_cents exactly, even when the co-op rounding produces a remainder (at sale 16666675:
          500001 + 500000 == 1000001). The listing side absorbs the penny so the split conserves the total.
        test_recipe:
          setup:
            - "Listing PENDING (no-contingency accepted offer effective_price 16666675), about to close."
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara", license_no: "L-1017" }
              as: Anonymous
              captures: { la_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Ben", license_no: "B-2017" }
              as: Anonymous
              captures: { ba_id: $.data.id }
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${ba_id}", full_name: "Bob", max_budget_cents: 20000000, monthly_income_cents: 2000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "17 Oak St", list_price_cents: 16666675 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/lockboxes"
              payload: { serial_no: "LB-17" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_v2: $.data.version }
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_id: "${buyer_id}", buyer_agent_id: "${ba_id}", initial_price_cents: 16666675, earnest_money_cents: 0, requested_contingencies: [] }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offers/${off_id}/accept"
              payload: { expected_listing_version: "${lst_v2}" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "GET /listings/${lst_id}"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_v4: $.data.version }
          trigger:
            - call: "POST /listings/${lst_id}/close"
              payload: { expected_listing_version: "${lst_v4}" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "GET /listings/${lst_id}/commission-ledger"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { total: "$.data[0].total_commission_cents", coop: "$.data[0].coop_commission_cents", lside: "$.data[0].listing_side_commission_cents" }
          assert:
            - "coop_commission_cents (500001) + listing_side_commission_cents (500000) == total_commission_cents (1000001)"

      - name: failed_contingency_restores_listing_live_offer_count
        grounds:
          - state_machines.Contingency.transitions.PENDING_to_FAILED
          - state_machines.Listing.transitions.UNDER_CONTRACT_to_ACTIVE
          - calculations.listing_offer_posture
        distinguishing_aspect: |
          Conserved quantity = the listing's live-offer count (offers in {OPEN, SELLER_COUNTERED, BUYER_COUNTERED}).
          Accepting an offer (forward) drops a surviving sibling out of the live set (rejected) and the accepted one out
          (ACCEPTED); a FAILED contingency (compensation) does NOT resurrect rejected siblings, so the post-compensation
          live count equals exactly zero (the accepted offer becomes WITHDRAWN, not OPEN) — pinned, not drifting upward.
        test_recipe:
          setup:
            - "ACTIVE listing with two OPEN offers; offer A (with INSPECTION contingency) is accepted, rejecting sibling B; then A's INSPECTION fails."
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara", license_no: "L-1018" }
              as: Anonymous
              captures: { la_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Ben", license_no: "B-2018" }
              as: Anonymous
              captures: { ba_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Cara", license_no: "B-2019" }
              as: Anonymous
              captures: { ba2_id: $.data.id }
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${ba_id}", full_name: "Bob", max_budget_cents: 60000000, monthly_income_cents: 2000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { buyer1_id: $.data.id }
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${ba2_id}", full_name: "Cathy", max_budget_cents: 60000000, monthly_income_cents: 2000000 }
              as: BuyerAgent
              as_user_id: "${ba2_id}"
              captures: { buyer2_id: $.data.id }
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "18 Oak St", list_price_cents: 50000000 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/lockboxes"
              payload: { serial_no: "LB-18" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_v2: $.data.version }
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_id: "${buyer1_id}", buyer_agent_id: "${ba_id}", initial_price_cents: 50000000, earnest_money_cents: 0, requested_contingencies: ["INSPECTION"] }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { offA_id: $.data.id }
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_id: "${buyer2_id}", buyer_agent_id: "${ba2_id}", initial_price_cents: 49000000, earnest_money_cents: 0, requested_contingencies: [] }
              as: BuyerAgent
              as_user_id: "${ba2_id}"
              captures: { offB_id: $.data.id }
            - call: "GET /listings/${lst_id}"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_v3: $.data.version }
            - call: "POST /offers/${offA_id}/accept"
              payload: { expected_listing_version: "${lst_v3}" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "GET /offers/${offA_id}/contingencies"
              payload: {}
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { ins_id: "$.data[0].id" }
          trigger:
            - call: "POST /contingencies/${ins_id}/fail"
              payload: {}
              as: BuyerAgent
              as_user_id: "${ba_id}"
            - call: "GET /listings/${lst_id}/offers"
              payload: { status: "OPEN" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "GET /listings/${lst_id}"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { posture: $.data.offer_posture }
          assert:
            - "After compensation: live-offer count == 0 — offA is WITHDRAWN (not resurrected to OPEN), offB stays REJECTED"
            - "Listing.status == ACTIVE and offer_posture == NONE (zero live offers, no drift up to SINGLE/MULTIPLE)"
