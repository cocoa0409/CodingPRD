              captures: { end_rev: $.data.lifetime_recognized_revenue_usd_cents }
          assert:
            - "baseline ledger == 1000 after first purchase"
            - "After purchase+full-refund pair: Title.${t_id}.lifetime_recognized_revenue_usd_cents == 1000 (== baseline; zero drift)"
            - "Purchase.${p2}.status == REFUNDED and refunded_cents == 1000"

      - name: purchase_gross_equals_fee_plus_share_conservation
        grounds:
          - calculations.purchase_split
        distinguishing_aspect: |
          Conserved quantity (per-transaction split): for EVERY purchase,
          platform_fee_cents + developer_share_cents == gross_price_cents exactly —
          a different conserved quantity than the revenue ledger (per-row arithmetic
          identity vs cross-entity money conservation), invariant across tier rates
          and currencies.
        test_recipe:
