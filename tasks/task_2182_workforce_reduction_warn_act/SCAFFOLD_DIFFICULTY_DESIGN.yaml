            - call: "POST /severance-offers"
              payload: { selection_id: "${sel_alice}", variant: "ENHANCED_RELEASE", expected_selection_version: "${sel_v2}" }
              as: BenefitsAdministrator
              as_user_id: "u-benefits-1"
              captures: { offer_enh: $.data.id }
          assert:
            - "SeveranceOffer.${offer_std}.weekly_rate_cents == 167308"
            - "SeveranceOffer.${offer_std}.weeks_awarded == 16"
            - "SeveranceOffer.${offer_std}.base_severance_cents == 2676928"
            - "SeveranceOffer.${offer_std}.notice_shortfall_days == 0"
            - "SeveranceOffer.${offer_std}.notice_pay_offset_cents == 0"
            - "SeveranceOffer.${offer_std}.benefit_subsidy_months == 9"
            - "SeveranceOffer.${offer_std}.total_separation_cost_cents == 3553428"
            - "SeveranceOffer.${offer_enh}.weeks_awarded == 18.5"
            - "SeveranceOffer.${offer_enh}.base_severance_cents == 3095198"
            - "SeveranceOffer.${offer_enh}.total_separation_cost_cents == 3971698"
            - "SeveranceOffer.${offer_std}.base_severance_cents != SeveranceOffer.${offer_enh}.base_severance_cents"
            - "ReductionPlan.${plan_id}.severance_reserve_cents == 0"

  - rule_id: combinatorial_formula
    instances:

      - name: severance_rounding_order_weekly_rate_rounded_before_multiplication
        grounds:
          - calculations.severance_award_cents
          - entities.SeveranceOffer.fields.weekly_rate_cents
          - entities.SeveranceOffer.fields.base_severance_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding whose order changes the cents. The scaffold pins
          "round the weekly rate to whole cents first, multiply second, round the
          product once": 9455000 / 52 rounds half-up to 181827, times 13.5 weeks gives
          2454664.5 which rounds half-up to 2454665, whereas the sum-then-round order
          9455000 / 52 * 13.5 gives 2454663 — a two-cent divergence on one line item.
        test_recipe:
          setup:
            - "A TX site with three full-time employees and no WarnRule configured, so no jurisdiction is triggered and Site.required_notice_days stays 0."
            - "Grace (hired 2018-06-01, annual_base_cents 9455000, born 1980-12-01, 8 completed years of service) is the only SELECTED employee for 2026-12-01."
            - "Plan APPROVED with a CLEARED analysis and an ATTACHED disclosure; Grace's notice has been delivered with the standard manager script."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Austin Campus", state_code: "TX", is_single_site: true }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/roster-import"
              payload: { entries: [ { full_name: "Grace Lindqvist", job_title: "Principal Engineer", birth_date: "1980-12-01", hire_date: "2018-06-01", annual_base_cents: 9455000, weekly_hours: 40, demographic_code: "CLASS_A", monthly_premium_cents: 90000 }, { full_name: "Ben Okafor", job_title: "Analyst", birth_date: "1990-02-20", hire_date: "2020-01-15", annual_base_cents: 6240000, weekly_hours: 40, demographic_code: "CLASS_A", monthly_premium_cents: 90000 }, { full_name: "Carla Reyes", job_title: "Ops Manager", birth_date: "1972-11-05", hire_date: "2018-06-01", annual_base_cents: 7280000, weekly_hours: 40, demographic_code: "CLASS_B", monthly_premium_cents: 90000 } ] }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { grace_id: "$.data.employee_ids[0]", ben_id: "$.data.employee_ids[1]", carla_id: "$.data.employee_ids[2]" }
            - call: "POST /reduction-plans"
              payload: { name: "Austin Engineering Reduction", decisional_unit_name: "Austin Engineering", selection_criteria: [ { criterion_code: "PERFORMANCE", weight_pct: 50, description: "Most recent performance rating" }, { criterion_code: "CRITICAL_SKILLS", weight_pct: 30, description: "Retained-skill criticality" }, { criterion_code: "TENURE", weight_pct: 20, description: "Length of continuous service" } ], severance_budget_cents: 20000000 }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { plan_id: $.data.id }
            - call: "POST /reduction-plans/${plan_id}/lock-criteria"
              payload: {}
              as: RestructuringLead
              as_user_id: "u-lead-1"
            - call: "POST /selections"
              payload: { plan_id: "${plan_id}", employee_id: "${grace_id}", proposed_separation_date: "2026-12-01", criterion_scores: [ { criterion_code: "PERFORMANCE", score: 72 }, { criterion_code: "CRITICAL_SKILLS", score: 55 }, { criterion_code: "TENURE", score: 88 } ] }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { sel_grace: $.data.id }
            - call: "POST /selections/${sel_grace}/decide"
              payload: { decision: "SELECT" }
              as: RestructuringLead
              as_user_id: "u-lead-1"
            - call: "GET /reduction-plans/${plan_id}"
              payload: {}
              as: EmploymentCounsel
              as_user_id: "u-counsel-1"
              captures: { plan_v1: $.data.version }
            - call: "POST /adverse-impact-analyses"
              payload: { plan_id: "${plan_id}", method: "IMPACT_RATIO", expected_plan_version: "${plan_v1}" }
              as: EmploymentCounsel
              as_user_id: "u-counsel-1"
              captures: { analysis_id: $.data.id }
            - call: "POST /adverse-impact-analyses/${analysis_id}/clear"
              payload: { justification: "Role eliminated outright; no comparable retained position." }
              as: EmploymentCounsel
              as_user_id: "u-counsel-1"
            - call: "POST /reduction-plans/${plan_id}/submit-legal-review"
              payload: {}
              as: RestructuringLead
              as_user_id: "u-lead-1"
            - call: "POST /reduction-plans/${plan_id}/legal-decision"
              payload: { decision: "APPROVE" }
              as: EmploymentCounsel
              as_user_id: "u-counsel-1"
            - call: "POST /owbpa-disclosures"
              payload: { plan_id: "${plan_id}" }
              as: EmploymentCounsel
              as_user_id: "u-counsel-1"
              captures: { disclosure_id: $.data.id }
            - call: "POST /selections/${sel_grace}/deliver-notice"
