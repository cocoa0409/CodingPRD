            - "after issuing contract B: BuybackContract.${contractb_id}.fee_usd_cents == 2732 and locked_fx_minor_units == 80000 and liability_usd_cents == 82423, and Branch.${br_id}.buyback_liability_usd_cents == 101999"
            - "after cancelling contract B: Branch.${br_id}.buyback_liability_usd_cents == 19576, byte-equal to ${liab_before}"
            - "BuybackContract.${contractb_id}.status == CANCELLED and remaining_fx_minor_units == 0 and liability_usd_cents == 0"
            - "ExchangeTransaction.${txn2_id}.buyback_contract_id == null (the origin deal is reversible again)"
            - "BuybackContract.${contracta_id}.status == ISSUED and liability_usd_cents == 19576, untouched by B's lifecycle"

