              captures: { pe_geo_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0116", unit_name: "Ash Pond 116", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /ccr/units/${unit_id}/complete-closure"
              payload: { completed_on: "2026-08-01" }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /ccr/units/${unit_id}/certify-care-complete"
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "both trigger calls return HTTP 409 with error_id ERR_INVALID_UNIT_STATE"
            - "DisposalUnit.${unit_id}.closure_state is still ACTIVE"
            - "DisposalUnit.${unit_id}.cap_integrity_state is still NOT_APPLICABLE"
            - "DisposalUnit.${unit_id}.closure_completed_on == null and post_closure_care_start_on == null and post_closure_care_end_date == null"
            - "DisposalUnit.${unit_id}.closure_timeliness == PENDING"

      - name: new_rows_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.DisposalUnit
          - state_machines.MonitoringProgram
          - state_machines.BeneficialReuseAgreement
          - state_machines.ClosureExtensionRequest
          - state_machines.PublicPosting
        distinguishing_aspect: |
          Five state machines declare five different initial states, and a freshly created row of each
          must sit in its own — including the two dimensions of DisposalUnit, whose closure_state starts
          ACTIVE while its cap_integrity_state starts NOT_APPLICABLE rather than ADEQUATE. Creating one
          row per family in a single chain makes a copy-pasted default in any one of them visible.
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Mia Chen", license_number: "HG-33003", license_state: "NC", discipline: "HYDROGEOLOGY" }
              as: UtilityAdmin
              captures: { hg_id: $.data.id }
          trigger:
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0117", unit_name: "Ash Pond 117", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id, prog_id: $.data.monitoring_program_id }
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "BG-01", well_role: "BACKGROUND", aquifer_zone: "UPPER SAND", screen_top_ft: 22.00, screen_bottom_ft: 42.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { well_id: $.data.id }
            - call: "POST /ccr/reuse-agreements"
              payload: { unit_id: "${unit_id}", agreement_code: "AGR-0117", product_type: "CONCRETE_POZZOLAN", offtaker_name: "Piedmont Ready-Mix", committed_tons: 30000, commitment_start_on: "2026-01-01", commitment_end_on: "2026-12-31", loi_percent: 6.00, retained_325_percent: 20.00, oxide_sum_percent: 82.00, market_price_usd_cents_per_ton: 3200, haul_distance_miles: 60 }
              as: UtilityAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /ccr/extension-requests"
              payload: { unit_id: "${unit_id}", requested_months: 24, justification_category: "PERMANENT_CESSATION", narrative: "Generation has permanently ceased at this station and the ash will be consolidated" }
              as: UtilityAdmin
              captures: { ext_id: $.data.id }
            - call: "POST /ccr/public-postings"
              payload: { unit_id: "${unit_id}", posting_type: "ANNUAL_GW_REPORT", posted_on: "2026-07-01", document_uri: "https://utility.example.com/ccr/imp-0117/annual-gw-2025.pdf", document_sha256: "c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2" }
              as: ComplianceOfficer
              captures: { posting_id: $.data.id }
          assert:
            - "DisposalUnit.${unit_id}.closure_state == ACTIVE and cap_integrity_state == NOT_APPLICABLE"
            - "MonitoringProgram.${prog_id}.phase == DETECTION with network_certified == false and sampling_frequency == SEMIANNUAL"
            - "MonitoringWell.${well_id}.well_status == CERTIFIED"
            - "BeneficialReuseAgreement.${agr_id}.status == DRAFT with shipped_tons_total == 0 and qualified_by == null"
            - "ClosureExtensionRequest.${ext_id}.status == REQUESTED with granted_months == 0 and decided_on == null"
            - "PublicPosting.${posting_id}.status == POSTED"
            - "every one of the five reads returns version == 1 for the entities that carry version"

      - name: a_withdrawn_posting_cannot_be_withdrawn_again
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.PublicPosting.POSTED_to_WITHDRAWN
          - validations.priority_27_ERR_INVALID_POSTING_STATE
        distinguishing_aspect: |
          WITHDRAWN is the terminal state of the posting machine and no transition leaves it, so the
          second withdrawal must be a 409 that neither overwrites withdrawn_on nor appends a second
          reason. The first withdrawal's audit values must survive the refused call byte-identically.
        test_recipe:
          setup:
            - "One clean unit with one POSTED ANNUAL_GW_REPORT posting"
          setup_api_calls:
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0118", unit_name: "Ash Pond 118", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /ccr/public-postings"
              payload: { unit_id: "${unit_id}", posting_type: "ANNUAL_GW_REPORT", posted_on: "2026-07-01", document_uri: "https://utility.example.com/ccr/imp-0118/annual-gw-2025.pdf", document_sha256: "a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1" }
              as: ComplianceOfficer
              captures: { posting_id: $.data.id }
          trigger:
            - call: "POST /ccr/public-postings/${posting_id}/withdraw"
              payload: { withdrawn_on: "2026-07-20", withdrawal_reason: "Superseded by a corrected annual groundwater monitoring report" }
              as: ComplianceOfficer
            - call: "POST /ccr/public-postings/${posting_id}/withdraw"
              payload: { withdrawn_on: "2026-07-25", withdrawal_reason: "Duplicate withdrawal attempt against a terminal posting" }
              as: ComplianceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "trigger call 1 returns HTTP 200 and PublicPosting.${posting_id}.status == WITHDRAWN"
            - "PublicPosting.${posting_id}.withdrawn_on == 2026-07-20 after the first call"
            - "trigger call 2 returns HTTP 409 with error_id ERR_INVALID_POSTING_STATE"
            - "PublicPosting.${posting_id}.withdrawn_on is still 2026-07-20 and withdrawal_reason still names the corrected report"
            - "PublicPosting.${posting_id}.satisfied_obligation == false and days_late == 0"

      - name: decommissioning_a_background_well_re_derives_the_program_well_counts
        claim_type: ledger_sync
        grounds:
          - state_machines.MonitoringWell.CERTIFIED_to_DECOMMISSIONED
          - calculations.network_certification_readiness
          - validations.priority_36_ERR_NO_BACKGROUND_WELL
        distinguishing_aspect: |
          The well's own transition must push a recount into the parent program in the same request:
          background_well_count drops from two to one while downgradient_well_count is untouched. The
          second decommission is then refused by the floor of one background well, which proves the count
          the rule reads is the re-derived one and not the value stored at certification time.
