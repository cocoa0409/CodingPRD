              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "POST /recreation/enrollments/${e1}/withdraw"
              payload: {}
              as: IntakeCoordinator
            - call: "GET /recreation/program-sessions/${sess}"
              payload: {}
              as: ProgramAdmin
              captures: { committed_after: "$.data.slots_committed", available_after: "$.data.slots_available" }
          assert:
            - "ProgramSession.${sess}.slots_committed == 2 and slots_available == 0 immediately before the withdraw"
            - "ProgramSession.${sess}.slots_committed == 1 and slots_available == 1 after the withdraw"
            - "ProgramSession.${sess}.slot_capacity == ProgramSession.${sess}.slots_committed + ProgramSession.${sess}.slots_available == 2 at both observation points"
            - "GET /recreation/enrollments filtered by session_id ${sess} and enrollment_status CONFIRMED returns total_count 1"
            - "Enrollment.${e2}.enrollment_status == CONFIRMED (untouched by the compensating action)"

      - name: partial_disbursement_then_release_conserves_the_funding_ledger
        grounds:
          - calculations.encumbrance_release_cents
          - state_machines.ScholarshipAward.ENCUMBERED_to_PARTIALLY_DISBURSED
          - state_machines.ScholarshipAward.PARTIALLY_DISBURSED_to_RELEASED
          - entities.FundingSource.fields.available_cents
          - entities.FundingSource.fields.encumbered_cents
          - entities.FundingSource.fields.disbursed_cents
        distinguishing_aspect: |
          Conserved quantity 2 = CENTS in a FundingSource, a different kind of quantity
          from program slots. total_budget_cents == available + encumbered + disbursed
          holds after the encumbrance, after the 2000-cent partial disbursement, and
          after the REMAINDER release, which returns exactly 3000 and never touches the
          2000 already paid out.
        test_recipe:
          setup:
            - "An OPEN period and an OPEN FLAT_CAP funding source with total_budget_cents 10000 and flat_award_cents 5000, created by FundingOfficer 'officer-1'."
            - "One ACTIVE participant with a REQUESTED (deliberately not yet confirmed) enrollment whose program fee is 8000 cents, so no auto-encumbrance has fired."
            - "A 5000-cent award on that enrollment, manually ENCUMBERED."
          setup_api_calls:
            - call: "POST /recreation/operating-periods"
              payload: { name: "FY26", starts_on: "2026-01-01", ends_on: "2026-12-31" }
              as: ProgramAdmin
