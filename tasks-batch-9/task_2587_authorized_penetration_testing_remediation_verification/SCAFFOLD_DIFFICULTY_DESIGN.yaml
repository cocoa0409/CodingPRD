        distinguishing_aspect: |
          Resource entity: the Asset, contended for by AuthorizedTarget windows. Interval semantics:
          CLOSED/INCLUSIVE bounds WIDENED by COOLDOWN_HOURS[asset_class] on both sides — for a NETWORK
