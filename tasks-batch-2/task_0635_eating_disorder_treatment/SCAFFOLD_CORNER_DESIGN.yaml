              payload: { expected_patient_version: "${pvx}" }
              as: Clinician
            - call: "POST /edt/admissions"
              payload: { patient_id: "${pidx}", facility_id: "${fid}", program_id: "${pgid}", cohort_id: "${cid}", requested_length_of_stay_days: 14 }
              as: Intake
              captures: { aidx: $.data.id }
            - call: "POST /edt/authorizations"
              payload: { admission_id: "${aidx}", facility_id: "${fid}", payer_name: "BlueCo", daily_rate_cents: 100000, coinsurance_pct: 0.20 }
              as: UtilizationReviewer
              captures: { authidx: $.data.id }
            - call: "POST /edt/reviews"
              payload: { authorization_id: "${authidx}", facility_id: "${fid}", decision: "APPROVE", window_start_iso: "2026-01-01T00:00:00Z", window_end_iso: "2026-01-15T00:00:00Z" }
              as: UtilizationReviewer
            - call: "POST /edt/admissions/${aidx}/promote"
              as: Intake
            - call: "POST /edt/admissions/${aidx}/admit"
              as: Intake
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat Y1", age_band: "ADULT", bmi: 17.0 }
              as: Intake
              captures: { pidy: $.data.id }
            - call: "POST /edt/admissions"
              payload: { patient_id: "${pidy}", facility_id: "${fid}", program_id: "${pgid}", cohort_id: "${cid}", requested_length_of_stay_days: 7 }
              as: Intake
              captures: { aidy: $.data.id }
            - call: "POST /edt/family-programs"
              payload: { admission_id: "${aidx}", facility_id: "${fid}", family_contact_name: "Kin", sessions_required: 1 }
              as: Clinician
              captures: { fpidx: $.data.id }
            - call: "POST /edt/family-programs/${fpidx}/waive"
              as: Clinician
            - call: "POST /edt/discharge-plans"
              payload: { admission_id: "${aidx}", facility_id: "${fid}", aftercare_level_of_care: "IOP", relapse_warning_signs: "skipping meals", relapse_plan_complete: true }
              as: Clinician
              captures: { dpidx: $.data.id }
            - call: "POST /edt/discharge-plans/${dpidx}/finalize"
