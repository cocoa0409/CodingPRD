      - name: body_fk_existence_outranks_optimistic_concurrency_on_grant_create
        grounds:
          - validations.priority_5_body_fk_existence
          - validations.priority_8_optimistic_concurrency
          - concurrency_rules.access-grant-create-stale-project
          - errors.ERR_INVESTIGATOR_NOT_FOUND
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: |
          The create request carries BOTH an unknown investigator_id and a project version that
          the earlier grant create already superseded. Existence (priority 5, 404) must answer
          before the version guard (priority 8, 412); swapping them leaks the concurrency state
          of a project to a caller whose request never named a real investigator. Replacing only
          the investigator_id with a real one then produces 412, and refreshing the version last
          produces 201 — the same endpoint returns three different results for three payloads
          that differ in one field each.
        test_recipe:
          setup:
            - "Logical clock at the default 2026-08-01T00:00:00Z."
            - "Investigators INV_A and INV_B; project P with controlled_area_capacity 2."
            - "p_ver_stale is captured BEFORE the first grant create, which increments Project.version and makes that value stale."
