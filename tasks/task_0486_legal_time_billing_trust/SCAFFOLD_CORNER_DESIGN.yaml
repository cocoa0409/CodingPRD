scaffold_corner_design:

  # =========================================================================
  # Section 1 — Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_client_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Client, endpoints]
        distinguishing_aspect: "POST /firm/clients with display_name + client_type returns 201, status defaults to PROSPECT, ar_balance_cents defaults to 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id, st: $.data.status, ar: $.data.ar_balance_cents }
          assert:
            - "response HTTP 201; data.id is a non-empty UUID"
            - "Client.${cl_id}.status == PROSPECT"
            - "Client.${cl_id}.ar_balance_cents == 0"
            - "Client.${cl_id}.version == 1"

      - name: get_client_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Client, endpoints]
        distinguishing_aspect: "GET /firm/clients/{id} returns the same display_name and client_type that were created."
        test_recipe:
          setup: ["One client 'Acme Corp' created."]
          setup_api_calls:
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
          trigger:
            - call: "GET /firm/clients/${cl_id}"
              payload: {}
              as: Attorney
              captures: { name: $.data.display_name, t: $.data.client_type }
          assert:
            - "Client.${cl_id}.display_name == 'Acme Corp'"
            - "Client.${cl_id}.client_type == ORGANIZATION"

      - name: list_clients_paginated_envelope
        claim_type: Listing
        grounds: [entities.Client, endpoints]
        distinguishing_aspect: "GET /firm/clients returns response_type array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two clients created."]
          setup_api_calls:
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
            - call: "POST /firm/clients"
              payload: { display_name: "Beta LLC", client_type: "ORGANIZATION" }
              as: BillingClerk
          trigger:
            - call: "GET /firm/clients"
              payload: { limit: 1, offset: 0 }
              as: BillingClerk
          assert:
            - "response_type == array; meta.total_count == 2; has_more == true; data length == 1"

      - name: get_client_not_found
        claim_type: Not Found
        grounds: [entities.Client, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /firm/clients/{id} with a non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /firm/clients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND"

      - name: create_client_missing_required_field
        claim_type: Required Fields
        grounds: [entities.Client.fields.client_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /firm/clients missing client_type returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp" }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; error_id == ERR_INVALID_REQUEST"

      - name: create_client_invalid_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.Client.fields.client_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /firm/clients with client_type='COMPANY' (not in {INDIVIDUAL, ORGANIZATION}) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "COMPANY" }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; error_id == ERR_INVALID_REQUEST"

      - name: timekeeper_is_active_default_true
        claim_type: Defaults
        grounds: [entities.Timekeeper.fields.is_active]
        distinguishing_aspect: "POST /firm/timekeepers omitting is_active yields is_active == true by default."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /firm/timekeepers"
              payload: { full_name: "Pat Partner", role_kind: "PARTNER", standard_rate_cents: 50000 }
              as: PlatformAdmin
              captures: { tk_id: $.data.id, act: $.data.is_active }
          assert:
            - "Timekeeper.${tk_id}.is_active == true"

      - name: time_entry_resolved_rate_is_computed_not_input
        claim_type: Computed Fields
        grounds: [entities.TimeEntry.fields.resolved_rate_cents, calculations.billable_rate_resolution]
        distinguishing_aspect: "TimeEntry.resolved_rate_cents is server-computed from the rate ladder; it has no input slot — matter_rate 30000 yields resolved 30000 regardless of any client wish."
        test_recipe:
          setup: ["Matter OPEN with matter_rate 30000; codes L110/A101."]
          setup_api_calls:
            - call: "POST /firm/billing-codes"
              payload: { code: "L110", kind: "TASK", label: "Fact Investigation" }
              as: PlatformAdmin
            - call: "POST /firm/billing-codes"
              payload: { code: "A101", kind: "ACTIVITY", label: "Plan and prepare" }
              as: PlatformAdmin
            - call: "POST /firm/timekeepers"
              payload: { full_name: "Pat Partner", role_kind: "PARTNER", standard_rate_cents: 50000 }
              as: PlatformAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
            - call: "POST /firm/matters"
              payload: { client_id: "${cl_id}", responsible_timekeeper_id: "${tk_id}", title: "M", matter_rate_cents: 30000 }
              as: BillingClerk
              captures: { m_id: $.data.id }
            - call: "POST /firm/matters/${m_id}/conflict-checks"
              payload: { adverse_party_name: "Opposing Co" }
              as: BillingClerk
            - call: "POST /firm/matters/${m_id}/open"
              payload: {}
              as: Attorney
          trigger:
            - call: "POST /firm/time-entries"
              payload: { matter_id: "${m_id}", timekeeper_id: "${tk_id}", worked_at: "2026-05-01T09:00:00Z", minutes: 60, utbms_task_code: "L110", utbms_activity_code: "A101" }
              as: Attorney
              captures: { te_id: $.data.id, rr: $.data.resolved_rate_cents }
          assert:
            - "TimeEntry.${te_id}.resolved_rate_cents == 30000"
            - "TimeEntry.${te_id}.billable_amount_cents == 30000 (30000*ceil(60/6)/10 = 30000*10/10)"

      - name: billing_code_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.BillingCode]
        distinguishing_aspect: "BillingCode has common_fields:false — it exposes id and created_at but no version/updated_at, and there is no update endpoint."
        test_recipe:
          setup: ["One billing code L110 created."]
          setup_api_calls:
            - call: "POST /firm/billing-codes"
              payload: { code: "L110", kind: "TASK", label: "Fact Investigation" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
          trigger:
            - call: "GET /firm/billing-codes"
              payload: { kind: "TASK" }
              as: BillingClerk
          assert:
            - "the listed BillingCode has id and created_at; no version field is present"

      - name: matter_requires_existing_client_parent
        claim_type: Parent Relationships
        grounds: [entities.Matter.fields.client_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /firm/matters with a non-existent client_id returns 404 ERR_NOT_FOUND (FK integrity)."
        test_recipe:
          setup: ["A timekeeper exists; no client with the supplied id."]
          setup_api_calls:
            - call: "POST /firm/timekeepers"
              payload: { full_name: "Pat Partner", role_kind: "PARTNER", standard_rate_cents: 50000 }
              as: PlatformAdmin
              captures: { tk_id: $.data.id }
          trigger:
            - call: "POST /firm/matters"
              payload: { client_id: "00000000-0000-4000-8000-000000000000", responsible_timekeeper_id: "${tk_id}", title: "Ghost" }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND"

      - name: code_kind_mismatch_on_time_entry
        claim_type: Type Constraints
        grounds: ["validations[priority=4]", "errors[ERR_CODE_KIND_MISMATCH]"]
        distinguishing_aspect: "POST /firm/time-entries with utbms_task_code pointing at an ACTIVITY-kind code returns 422 ERR_CODE_KIND_MISMATCH (referential kind check, flat topology)."
        test_recipe:
          setup: ["Codes A101(ACTIVITY) only; matter OPEN."]
          setup_api_calls:
            - call: "POST /firm/billing-codes"
              payload: { code: "A101", kind: "ACTIVITY", label: "Plan and prepare" }
              as: PlatformAdmin
            - call: "POST /firm/timekeepers"
              payload: { full_name: "Pat Partner", role_kind: "PARTNER", standard_rate_cents: 50000 }
              as: PlatformAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
            - call: "POST /firm/matters"
              payload: { client_id: "${cl_id}", responsible_timekeeper_id: "${tk_id}", title: "M", matter_rate_cents: 50000 }
              as: BillingClerk
              captures: { m_id: $.data.id }
            - call: "POST /firm/matters/${m_id}/conflict-checks"
              payload: { adverse_party_name: "Opposing Co" }
              as: BillingClerk
            - call: "POST /firm/matters/${m_id}/open"
              payload: {}
              as: Attorney
          trigger:
            - call: "POST /firm/time-entries"
              payload: { matter_id: "${m_id}", timekeeper_id: "${tk_id}", worked_at: "2026-05-01T09:00:00Z", minutes: 60, utbms_task_code: "A101", utbms_activity_code: "A101" }
              as: Attorney
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_CODE_KIND_MISMATCH (A101 is ACTIVITY, not TASK)"

      - name: duplicate_billing_code_rejected
        claim_type: Type Constraints
        grounds: [entities.BillingCode.fields.code, "errors[ERR_DUPLICATE_CODE]"]
        distinguishing_aspect: "POST /firm/billing-codes with a code that already exists returns 409 ERR_DUPLICATE_CODE (uniqueness)."
        test_recipe:
          setup: ["Code L110 already exists."]
          setup_api_calls:
            - call: "POST /firm/billing-codes"
              payload: { code: "L110", kind: "TASK", label: "Fact Investigation" }
              as: PlatformAdmin
          trigger:
            - call: "POST /firm/billing-codes"
              payload: { code: "L110", kind: "TASK", label: "Duplicate" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_DUPLICATE_CODE"

  # =========================================================================
  # Section 2 — State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: matter_initial_state_is_intake
        claim_type: Initial State
        grounds: [state_machines.Matter, entities.Matter.fields.status]
        distinguishing_aspect: "A newly created Matter starts in INTAKE before any conflict screen."
        test_recipe:
          setup: ["A client and timekeeper exist."]
          setup_api_calls:
            - call: "POST /firm/timekeepers"
              payload: { full_name: "Pat Partner", role_kind: "PARTNER", standard_rate_cents: 50000 }
              as: PlatformAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /firm/matters"
              payload: { client_id: "${cl_id}", responsible_timekeeper_id: "${tk_id}", title: "M" }
              as: BillingClerk
              captures: { m_id: $.data.id, st: $.data.status }
          assert:
            - "Matter.${m_id}.status == INTAKE"

      - name: open_matter_from_intake_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Matter.CONFLICT_CLEARED_to_OPEN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /firm/matters/{id}/open on a matter still in INTAKE (no conflict screen run) is rejected — open requires CONFLICT_CLEARED. Returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A matter in INTAKE (no conflict check yet)."]
          setup_api_calls:
            - call: "POST /firm/timekeepers"
              payload: { full_name: "Pat Partner", role_kind: "PARTNER", standard_rate_cents: 50000 }
              as: PlatformAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
            - call: "POST /firm/matters"
              payload: { client_id: "${cl_id}", responsible_timekeeper_id: "${tk_id}", title: "M" }
              as: BillingClerk
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /firm/matters/${m_id}/open"
              payload: {}
              as: Attorney
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE (INTAKE is not CONFLICT_CLEARED)"

      - name: finalize_already_issued_invoice_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Invoice.billing_status=DRAFT_to_billing_status=ISSUED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /firm/invoices/{id}/finalize on an already ISSUED invoice returns 409 ERR_INVALID_STATE (finalize requires DRAFT); idempotent re-finalize fails."
        test_recipe:
          setup: ["One ISSUED invoice total 50000."]
          setup_api_calls:
            - call: "POST /firm/billing-codes"
              payload: { code: "L110", kind: "TASK", label: "Fact Investigation" }
              as: PlatformAdmin
            - call: "POST /firm/billing-codes"
              payload: { code: "A101", kind: "ACTIVITY", label: "Plan and prepare" }
              as: PlatformAdmin
            - call: "POST /firm/timekeepers"
              payload: { full_name: "Pat Partner", role_kind: "PARTNER", standard_rate_cents: 50000 }
              as: PlatformAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
            - call: "POST /firm/matters"
              payload: { client_id: "${cl_id}", responsible_timekeeper_id: "${tk_id}", title: "M", matter_rate_cents: 50000 }
              as: BillingClerk
              captures: { m_id: $.data.id }
            - call: "POST /firm/matters/${m_id}/conflict-checks"
              payload: { adverse_party_name: "Opposing Co" }
              as: BillingClerk
            - call: "POST /firm/matters/${m_id}/open"
              payload: {}
              as: Attorney
            - call: "POST /firm/time-entries"
              payload: { matter_id: "${m_id}", timekeeper_id: "${tk_id}", worked_at: "2026-05-01T09:00:00Z", minutes: 60, utbms_task_code: "L110", utbms_activity_code: "A101" }
              as: Attorney
            - call: "POST /firm/invoices"
              payload: { matter_id: "${m_id}", issue_date: "2026-06-01T00:00:00Z", net_terms_days: 30 }
              as: BillingClerk
              captures: { inv_id: $.data.id }
            - call: "POST /firm/invoices/${inv_id}/finalize"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /firm/invoices/${inv_id}/finalize"
              payload: {}
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE"

      - name: void_issued_invoice_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Invoice.billing_status=DRAFT_to_billing_status=VOID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /firm/invoices/{id}/void on an ISSUED invoice returns 409 ERR_INVALID_STATE — only DRAFT invoices may be voided."
        test_recipe:
          setup: ["One ISSUED invoice."]
          setup_api_calls:
            - call: "POST /firm/billing-codes"
              payload: { code: "L110", kind: "TASK", label: "Fact Investigation" }
              as: PlatformAdmin
            - call: "POST /firm/billing-codes"
              payload: { code: "A101", kind: "ACTIVITY", label: "Plan and prepare" }
              as: PlatformAdmin
            - call: "POST /firm/timekeepers"
              payload: { full_name: "Pat Partner", role_kind: "PARTNER", standard_rate_cents: 50000 }
              as: PlatformAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
            - call: "POST /firm/matters"
              payload: { client_id: "${cl_id}", responsible_timekeeper_id: "${tk_id}", title: "M", matter_rate_cents: 50000 }
              as: BillingClerk
              captures: { m_id: $.data.id }
            - call: "POST /firm/matters/${m_id}/conflict-checks"
              payload: { adverse_party_name: "Opposing Co" }
              as: BillingClerk
            - call: "POST /firm/matters/${m_id}/open"
              payload: {}
              as: Attorney
            - call: "POST /firm/time-entries"
              payload: { matter_id: "${m_id}", timekeeper_id: "${tk_id}", worked_at: "2026-05-01T09:00:00Z", minutes: 60, utbms_task_code: "L110", utbms_activity_code: "A101" }
              as: Attorney
            - call: "POST /firm/invoices"
              payload: { matter_id: "${m_id}", issue_date: "2026-06-01T00:00:00Z", net_terms_days: 30 }
              as: BillingClerk
              captures: { inv_id: $.data.id }
            - call: "POST /firm/invoices/${inv_id}/finalize"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /firm/invoices/${inv_id}/void"
              payload: {}
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE"

      - name: confirm_already_confirmed_tx_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.TrustTransaction.PENDING_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /firm/trust-transactions/{id}/confirm on an already CONFIRMED tx returns 409 ERR_INVALID_STATE; the bank leg is not double-applied."
        test_recipe:
          setup: ["A CONFIRMED 100000 DEPOSIT."]
          setup_api_calls:
            - call: "POST /firm/trust-accounts"
              payload: { name: "IOLTA Pool" }
              as: PlatformAdmin
              captures: { ta_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
            - call: "POST /firm/trust-ledgers"
              payload: { trust_account_id: "${ta_id}", client_id: "${cl_id}", retainer_floor_cents: 0 }
              as: BillingClerk
              captures: { led_id: $.data.id }
            - call: "POST /firm/trust-transactions"
              payload: { client_trust_ledger_id: "${led_id}", kind: "DEPOSIT", amount_cents: 100000, initiated_by_user_id: "clerk-1" }
              as: BillingClerk
              captures: { dep_id: $.data.id }
            - call: "POST /firm/trust-transactions/${dep_id}/confirm"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /firm/trust-transactions/${dep_id}/confirm"
              payload: {}
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE"

      - name: reverse_already_voided_tx_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.TrustTransaction.CONFIRMED_to_VOIDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From the terminal VOIDED state, POST /firm/trust-transactions/{id}/reverse is rejected with 409 ERR_INVALID_STATE — no transition out of VOIDED."
        test_recipe:
          setup: ["A PENDING deposit that has been reversed to VOIDED."]
          setup_api_calls:
            - call: "POST /firm/trust-accounts"
              payload: { name: "IOLTA Pool" }
              as: PlatformAdmin
              captures: { ta_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
            - call: "POST /firm/trust-ledgers"
              payload: { trust_account_id: "${ta_id}", client_id: "${cl_id}", retainer_floor_cents: 0 }
              as: BillingClerk
              captures: { led_id: $.data.id }
            - call: "POST /firm/trust-transactions"
              payload: { client_trust_ledger_id: "${led_id}", kind: "DEPOSIT", amount_cents: 100000, initiated_by_user_id: "clerk-1" }
              as: BillingClerk
              captures: { dep_id: $.data.id }
            - call: "POST /firm/trust-transactions/${dep_id}/reverse"
              payload: {}
              as: Attorney
              as_user_id: "att-9"
          trigger:
            - call: "POST /firm/trust-transactions/${dep_id}/reverse"
              payload: {}
              as: Attorney
              as_user_id: "att-9"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE (VOIDED is terminal)"

      - name: send_to_collections_from_current_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Invoice.collection_status=OVERDUE_to_collection_status=IN_COLLECTIONS, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /firm/invoices/{id}/send-to-collections on a CURRENT (not OVERDUE) invoice returns 409 ERR_INVALID_STATE — the collection dimension is not yet OVERDUE."
        test_recipe:
          setup: ["ISSUED invoice, clock at issue_date so collection_status is DUE/CURRENT (not OVERDUE)."]
          setup_api_calls:
            - call: "POST /firm/billing-codes"
              payload: { code: "L110", kind: "TASK", label: "Fact Investigation" }
              as: PlatformAdmin
            - call: "POST /firm/billing-codes"
              payload: { code: "A101", kind: "ACTIVITY", label: "Plan and prepare" }
              as: PlatformAdmin
            - call: "POST /firm/timekeepers"
              payload: { full_name: "Pat Partner", role_kind: "PARTNER", standard_rate_cents: 50000 }
              as: PlatformAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firm/clients"
              payload: { display_name: "Acme Corp", client_type: "ORGANIZATION" }
              as: BillingClerk
              captures: { cl_id: $.data.id }
            - call: "POST /firm/matters"
              payload: { client_id: "${cl_id}", responsible_timekeeper_id: "${tk_id}", title: "M", matter_rate_cents: 50000 }
              as: BillingClerk
              captures: { m_id: $.data.id }
            - call: "POST /firm/matters/${m_id}/conflict-checks"
              payload: { adverse_party_name: "Opposing Co" }
              as: BillingClerk
            - call: "POST /firm/matters/${m_id}/open"
              payload: {}
              as: Attorney
            - call: "POST /firm/time-entries"
