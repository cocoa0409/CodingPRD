            - { call: "POST /cabinet/production-slots", payload: { plant_code: PLANT_EAST, family_code: "F1", week: "2026-W37", capacity_units: 100 }, as: PlantScheduler }
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: JOB_SITE, jobsite_address: "1 Job Ln", requested_delivery_week: "2026-W40", lines: [{ family_code: "F1", finish_code: "OAK", quantity: 10 }] }
              as: DealerRep
              as_user_id: "${acct}"
              captures: { o1: $.data.id }
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: JOB_SITE, jobsite_address: "2 Job Ln", requested_delivery_week: "2026-W40", lines: [{ family_code: "F1", finish_code: "OAK", quantity: 1 }] }
              as: DealerRep
