# =============================================================================
# §1.9 Scaffold Corner Design — task_1266 consent & ad-tech compliance
# Breadth probe: every testable claim of §1.1–§1.7 not covered by §1.8.
# Sections/claim_types per references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ============================================================ entities
  - section: entities
    instances:
      - name: property_create_applies_defaults
        claim_type: defaults
        grounds: [entities.Property.fields.posture, entities.Property.fields.granted_purpose_count]
        distinguishing_aspect: "New property starts posture NORMAL, granted_purpose_count 0, version 1, 201."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/properties", payload: { name: "D", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id, posture: $.data.posture, cnt: $.data.granted_purpose_count, v: $.data.version } }
          assert: ["posture == NORMAL", "cnt == 0", "v == 1", "HTTP 201"]

      - name: visitor_create_defaults_unverified
        claim_type: defaults
        grounds: [entities.VisitorProfile.fields.age_status, entities.VisitorProfile.fields.gpc_effective]
        distinguishing_aspect: "New visitor starts age_status UNVERIFIED, gpc_effective UNSET, sale_share_opted_out false."
        test_recipe:
          setup: ["Property P"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
          trigger:
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "d@x.com", jurisdiction_code: "US-CA" }, as: Anonymous, captures: { a: $.data.age_status, g: $.data.gpc_effective, o: $.data.sale_share_opted_out } }
          assert: ["a == UNVERIFIED", "g == UNSET", "o == false"]

      - name: visitor_birthdate_at_registration_stays_unverified
        claim_type: computed_fields
        grounds: [entities.VisitorProfile.fields.age_status, calculations.age_years_at_attestation]
        distinguishing_aspect: "Supplying attested_birthdate at registration stores it but does NOT compute age_status — only the attestation endpoint does."
        test_recipe:
          setup: ["Property P with ACTIVE policy US-CA min_age 16"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", banner_regime: "OPT_OUT_ALLOWED", min_consent_age: 16, retention_days: 30, gpc_honored: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
          trigger:
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "bd@x.com", jurisdiction_code: "US-CA", attested_birthdate: "1990-01-01T00:00:00Z" }, as: Anonymous, captures: { a: $.data.age_status } }
          assert: ["a == UNVERIFIED (birthdate stored, age gate not yet evaluated)"]

      - name: property_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PROPERTY_NOT_FOUND]"]
        distinguishing_aspect: "Unknown property id -> ERR_PROPERTY_NOT_FOUND, 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/properties/00000000-0000-0000-0000-000000000000", as: Any, captures: { err: $.data.error_id } }
          assert: ["err == ERR_PROPERTY_NOT_FOUND", "HTTP 404"]

      - name: consent_create_snapshots_policy_and_config
        claim_type: computed_fields
        grounds: [entities.ConsentRecord.fields.policy_snapshot_retention_days, entities.ConsentRecord.fields.banner_config_id]
        distinguishing_aspect: "Grant snapshots retention_days from the ACTIVE policy and the currently PUBLISHED banner config id (null when none published); source_of_decision EXPLICIT_GRANT."
        test_recipe:
          setup: ["Property P; ACTIVE policy EU-GDPR retention 30 window covering; ADULT visitor; no published config"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "NO_SALE_NO_SHARE" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "EU-GDPR", banner_regime: "OPT_IN_REQUIRED", min_consent_age: 16, retention_days: 30, gpc_honored: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "s@x.com", jurisdiction_code: "EU-GDPR" }, as: Anonymous, captures: { vis: $.data.id } }
            - { call: "POST /v1/visitors/${vis}/age-attestation", payload: { attested_birthdate: "1990-01-01T00:00:00Z" }, as: Visitor, as_user_id: "${vis}" }
          trigger:
            - { call: "POST /v1/visitors/${vis}/consent-records", payload: { purpose_category: "ANALYTICS" }, as: Visitor, as_user_id: "${vis}", captures: { snap: $.data.policy_snapshot_retention_days, cfg: $.data.banner_config_id, src: $.data.source_of_decision, st: $.data.status } }
          assert: ["snap == 30", "cfg == null (no PUBLISHED config)", "src == EXPLICIT_GRANT", "st == GRANTED", "HTTP 201"]

      - name: property_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Property.fields.sale_share_designation, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Enum outside the declared set is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/properties", payload: { name: "X", sale_share_designation: "MAYBE" }, as: PrivacyAdmin, captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_REQUEST", "HTTP 400"]

      - name: vendor_create_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Vendor.fields.legal_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Missing required legal_name -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Property P"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
          trigger:
            - { call: "POST /v1/vendors", payload: { property_id: "${prop}", declared_purposes: ["ADVERTISING"], tracker_signatures: ["t.com"] }, as: VendorManager, captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_REQUEST", "HTTP 400"]

      - name: property_create_client_id_input_ignored
        claim_type: system_fields
        grounds: [entities.Property]
        distinguishing_aspect: "Client-supplied id/version fields are ignored; server mints a UUID and version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/properties", payload: { name: "S", sale_share_designation: "SHARES_ONLY", id: "11111111-1111-1111-1111-111111111111", version: 99 }, as: PrivacyAdmin, captures: { id: $.data.id, v: $.data.version } }
          assert: ["id != '11111111-1111-1111-1111-111111111111' (server-minted)", "v == 1"]

      - name: gpc_signal_event_immutable_no_version
        claim_type: immutability
        grounds: [entities.GpcSignalEvent]
        distinguishing_aspect: "common_fields:false event entity — response carries id and created_at but no version/updated_at."
        test_recipe:
          setup: ["Property P; visitor U"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "e@x.com", jurisdiction_code: "US-CA" }, as: Anonymous, captures: { vis: $.data.id } }
          trigger:
            - { call: "POST /v1/visitors/${vis}/gpc-signals", payload: { signal: "ON" }, as: Visitor, as_user_id: "${vis}", captures: { ev: $.data.id } }
            - { call: "GET /v1/visitors/${vis}/gpc-signals", as: Any, captures: { sig0: "$.data[0].signal" } }
          assert: ["event response has no version field (immutable event)", "sig0 == ON", "event.visitor_id == ${vis}"]

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: policy_retire_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.JurisdictionPolicy, "errors[ERR_POLICY_INVALID_TRANSITION]"]
        distinguishing_aspect: "RETIRED is reachable only from ACTIVE; DRAFT -> RETIRED rejected."
        test_recipe:
          setup: ["Property P; policy DRAFT"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "NO_SALE_NO_SHARE" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", banner_regime: "OPT_IN_REQUIRED", min_consent_age: 16, retention_days: 30, gpc_honored: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol: $.data.id } }
          trigger:
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "RETIRED" }, as: PrivacyAdmin, captures: { err: $.data.error_id } }
          assert: ["err == ERR_POLICY_INVALID_TRANSITION", "HTTP 409"]

      - name: vendor_approve_after_suspend_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Vendor, "errors[ERR_VENDOR_INVALID_TRANSITION]"]
        distinguishing_aspect: "SUSPENDED is terminal; approve after suspend rejected."
        test_recipe:
          setup: ["Property P; vendor approved then suspended"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/vendors", payload: { property_id: "${prop}", legal_name: "V", declared_purposes: ["ADVERTISING"], tracker_signatures: ["v.com"] }, as: VendorManager, captures: { vend: $.data.id } }
            - { call: "POST /v1/vendors/${vend}/approve", as: PrivacyAdmin }
            - { call: "POST /v1/vendors/${vend}/suspend", as: PrivacyAdmin }
          trigger:
            - { call: "POST /v1/vendors/${vend}/approve", as: PrivacyAdmin, captures: { err: $.data.error_id } }
          assert: ["err == ERR_VENDOR_INVALID_TRANSITION"]

      - name: consent_withdraw_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.ConsentRecord.GRANTED_to_WITHDRAWN, "errors[ERR_CONSENT_INVALID_TRANSITION]"]
        distinguishing_aspect: "Second withdraw of an already-WITHDRAWN record -> ERR_CONSENT_INVALID_TRANSITION; no side effects."
        test_recipe:
          setup: ["Property P; ACTIVE policy; ADULT visitor; GRANTED ANALYTICS record"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "NO_SALE_NO_SHARE" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "EU-GDPR", banner_regime: "OPT_IN_REQUIRED", min_consent_age: 16, retention_days: 30, gpc_honored: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "w@x.com", jurisdiction_code: "EU-GDPR" }, as: Anonymous, captures: { vis: $.data.id } }
            - { call: "POST /v1/visitors/${vis}/age-attestation", payload: { attested_birthdate: "1990-01-01T00:00:00Z" }, as: Visitor, as_user_id: "${vis}" }
            - { call: "POST /v1/visitors/${vis}/consent-records", payload: { purpose_category: "ANALYTICS" }, as: Visitor, as_user_id: "${vis}", captures: { rec: $.data.id } }
            - { call: "POST /v1/consent-records/${rec}/withdraw", as: Visitor, as_user_id: "${vis}" }
          trigger:
            - { call: "POST /v1/consent-records/${rec}/withdraw", as: Visitor, as_user_id: "${vis}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_CONSENT_INVALID_TRANSITION"]

      - name: dns_verify_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DoNotSellRequest, "errors[ERR_DNS_INVALID_STATE]"]
        distinguishing_aspect: "Verification dimension: VERIFIED is not re-verifiable."
        test_recipe:
          setup: ["Property P (SELLS_AND_SHARES); visitor; VERIFIED request"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "v@x.com", jurisdiction_code: "US-CA" }, as: Anonymous, captures: { vis: $.data.id } }
            - { call: "POST /v1/visitors/${vis}/do-not-sell-requests", payload: {}, as: Visitor, as_user_id: "${vis}", captures: { req: $.data.id } }
            - { call: "PUT /v1/do-not-sell-requests/${req}", payload: { verification_status: "VERIFIED" }, as: PrivacyAdmin }
          trigger:
            - { call: "PUT /v1/do-not-sell-requests/${req}", payload: { verification_status: "VERIFIED" }, as: PrivacyAdmin, captures: { err: $.data.error_id } }
          assert: ["err == ERR_DNS_INVALID_STATE"]

      - name: propagation_confirm_twice_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.VendorPropagation, "errors[ERR_PROPAGATION_INVALID_STATE]"]
        distinguishing_aspect: "CONFIRMED is terminal; a second confirm -> ERR_PROPAGATION_INVALID_STATE."
        test_recipe:
          setup: ["Property P; APPROVED vendor declared SALE_SHARE; VERIFIED request; propagated (1 PENDING)"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/vendors", payload: { property_id: "${prop}", legal_name: "V", declared_purposes: ["SALE_SHARE"], tracker_signatures: ["v.com"] }, as: VendorManager, captures: { vend: $.data.id } }
            - { call: "POST /v1/vendors/${vend}/approve", as: PrivacyAdmin }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "p@x.com", jurisdiction_code: "US-CA" }, as: Anonymous, captures: { vis: $.data.id } }
            - { call: "POST /v1/visitors/${vis}/do-not-sell-requests", payload: {}, as: Visitor, as_user_id: "${vis}", captures: { req: $.data.id } }
            - { call: "PUT /v1/do-not-sell-requests/${req}", payload: { verification_status: "VERIFIED" }, as: PrivacyAdmin }
            - { call: "POST /v1/do-not-sell-requests/${req}/propagate", as: PrivacyAdmin }
            - { call: "GET /v1/do-not-sell-requests/${req}/propagations", as: Any, captures: { g1: "$.data[0].id" } }
            - { call: "PUT /v1/vendor-propagations/${g1}", payload: { status: "CONFIRMED" }, as: VendorManager }
          trigger:
            - { call: "PUT /v1/vendor-propagations/${g1}", payload: { status: "CONFIRMED" }, as: VendorManager, captures: { err: $.data.error_id } }
          assert: ["err == ERR_PROPAGATION_INVALID_STATE"]

      - name: scan_run_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.TagAuditScan, "errors[ERR_SCAN_NOT_RUNNABLE]"]
        distinguishing_aspect: "Run requires SCHEDULED; a second run on COMPLETED -> ERR_SCAN_NOT_RUNNABLE."
        test_recipe:
          setup: ["Property P; scan created and run once (empty observations)"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "NO_SALE_NO_SHARE" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/tag-audit-scans", payload: { property_id: "${prop}", scheduled_start: "2026-06-01T10:00:00Z", duration_minutes: 30 }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { scan: $.data.id } }
            - { call: "POST /v1/tag-audit-scans/${scan}/run", payload: { observed_trackers: [] }, as: ComplianceAuditor, as_user_id: "aud-1" }
          trigger:
            - { call: "POST /v1/tag-audit-scans/${scan}/run", payload: { observed_trackers: [] }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { err: $.data.error_id } }
          assert: ["err == ERR_SCAN_NOT_RUNNABLE"]

      - name: finding_close_from_open_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TrackerFinding, "errors[ERR_FINDING_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED requires REMEDIATED or CONFIRMED_VIOLATION; direct close from OPEN rejected."
        test_recipe:
          setup: ["Property P; scan run observing one rogue tracker -> OPEN finding"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "NO_SALE_NO_SHARE" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/tag-audit-scans", payload: { property_id: "${prop}", scheduled_start: "2026-06-01T10:00:00Z", duration_minutes: 30 }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { scan: $.data.id } }
            - { call: "POST /v1/tag-audit-scans/${scan}/run", payload: { observed_trackers: [{ tracker_signature: "rogue.com", purpose_category: "ADVERTISING" }] }, as: ComplianceAuditor, as_user_id: "aud-1" }
            - { call: "GET /v1/tag-audit-scans/${scan}/findings", as: Any, captures: { f1: "$.data[0].id" } }
          trigger:
            - { call: "PUT /v1/tracker-findings/${f1}", payload: { status: "CLOSED" }, as: ComplianceAuditor, as_user_id: "aud-2", captures: { err: $.data.error_id } }
          assert: ["err == ERR_FINDING_INVALID_STATE"]

      - name: sweep_respond_after_deadline_auto_escalates
        claim_type: valid_transition
        grounds: [state_machines.RegulatorySweep, "errors[ERR_SWEEP_DEADLINE_PASSED]", entities.RegulatorySweep.fields.response_due_at]
        distinguishing_aspect: "Respond after response_due_at fails AND auto-escalates: sweep ESCALATED, posture FROZEN, response_due_at == created_at + deadline_days."
        test_recipe:
          setup: ["Property P; sweep created at clock 2026-05-01T00:00:00Z with deadline_days 5 (due 2026-05-06T00:00:00Z); clock advanced to 2026-05-06T00:00:01Z"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/regulatory-sweeps", payload: { property_id: "${prop}", regulator_ref: "LATE-1", jurisdiction_code: "US-CA", deadline_days: 5 }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { sweep: $.data.id, due: $.data.response_due_at } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:01Z" }, as: PrivacyAdmin }
          trigger:
            - { call: "POST /v1/regulatory-sweeps/${sweep}/respond", as: PrivacyAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /v1/regulatory-sweeps/${sweep}", as: Any, captures: { st: $.data.status } }
            - { call: "GET /v1/properties/${prop}", as: Any, captures: { posture: $.data.posture } }
          assert:
            - "err == ERR_SWEEP_DEADLINE_PASSED"
            - "due == '2026-05-06T00:00:00Z' (created_at 2026-05-01 + 5 days)"
            - "st == ESCALATED (deadline miss auto-escalated)"
            - "posture == FROZEN"

      - name: banner_archive_then_publish_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ConsentBannerConfig, "errors[ERR_BANNER_CONFIG_NOT_PUBLISHABLE]"]
        distinguishing_aspect: "ARCHIVED is terminal; publish from ARCHIVED rejected."
        test_recipe:
          setup: ["Property P; ACTIVE policy US-CA; config C DRAFT archived"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "NO_SALE_NO_SHARE" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", banner_regime: "OPT_IN_REQUIRED", min_consent_age: 16, retention_days: 30, gpc_honored: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
            - { call: "POST /v1/banner-configs", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", categories_shown: ["ANALYTICS"], config_label: "c" }, as: PrivacyAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /v1/banner-configs/${cfg}/archive", as: PrivacyAdmin }
            - { call: "GET /v1/properties/${prop}", as: Any, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /v1/banner-configs/${cfg}/publish", payload: { expected_property_version: "${pv}" }, as: PrivacyAdmin, captures: { err: $.data.error_id } }
          assert: ["err == ERR_BANNER_CONFIG_NOT_PUBLISHABLE"]

      - name: publish_supersedes_previous_config
        claim_type: side_effect_execution
        grounds: [state_machines.ConsentBannerConfig.DRAFT_to_PUBLISHED, state_machines.TagRule.ENABLED_to_DISABLED]
        distinguishing_aspect: "Publishing config B for the same (property, jurisdiction) supersedes the published A and disables A's ENABLED tag rules; B becomes PUBLISHED."
        test_recipe:
          setup: ["Property P; ACTIVE policy US-CA; config A PUBLISHED with ENABLED rule R; config B DRAFT"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id, pv1: $.data.version } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", banner_regime: "OPT_OUT_ALLOWED", min_consent_age: 16, retention_days: 30, gpc_honored: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
            - { call: "POST /v1/banner-configs", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", categories_shown: ["ADVERTISING"], config_label: "A" }, as: PrivacyAdmin, captures: { cfgA: $.data.id } }
            - { call: "POST /v1/banner-configs/${cfgA}/publish", payload: { expected_property_version: "${pv1}" }, as: PrivacyAdmin }
            - { call: "POST /v1/vendors", payload: { property_id: "${prop}", legal_name: "V", declared_purposes: ["ADVERTISING"], tracker_signatures: ["v.com"] }, as: VendorManager, captures: { vend: $.data.id } }
            - { call: "POST /v1/vendors/${vend}/approve", as: PrivacyAdmin }
            - { call: "POST /v1/tag-rules", payload: { vendor_id: "${vend}", banner_config_id: "${cfgA}", purpose_category: "ADVERTISING" }, as: VendorManager, captures: { rule: $.data.id } }
            - { call: "POST /v1/banner-configs", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", categories_shown: ["ADVERTISING", "SALE_SHARE"], config_label: "B" }, as: PrivacyAdmin, captures: { cfgB: $.data.id } }
            - { call: "GET /v1/properties/${prop}", as: Any, captures: { pv2: $.data.version } }
          trigger:
            - { call: "POST /v1/banner-configs/${cfgB}/publish", payload: { expected_property_version: "${pv2}" }, as: PrivacyAdmin, captures: { stB: $.data.status } }
            - { call: "GET /v1/banner-configs/${cfgA}", as: Any, captures: { stA: $.data.status } }
            - { call: "GET /v1/tag-rules/${rule}", as: Any, captures: { stR: $.data.status } }
          assert: ["stB == PUBLISHED", "stA == SUPERSEDED", "stR == DISABLED (supersede cascade)"]

      - name: tag_rule_enable_after_retire_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.TagRule, "errors[ERR_TAG_RULE_INVALID_TRANSITION]"]
        distinguishing_aspect: "RETIRED is terminal; enable from RETIRED rejected."
        test_recipe:
          setup: ["Property P; config; APPROVED vendor; rule created then RETIRED"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/banner-configs", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", categories_shown: ["ANALYTICS"], config_label: "c" }, as: PrivacyAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /v1/vendors", payload: { property_id: "${prop}", legal_name: "V", declared_purposes: ["ANALYTICS"], tracker_signatures: ["v.com"] }, as: VendorManager, captures: { vend: $.data.id } }
            - { call: "POST /v1/vendors/${vend}/approve", as: PrivacyAdmin }
            - { call: "POST /v1/tag-rules", payload: { vendor_id: "${vend}", banner_config_id: "${cfg}", purpose_category: "ANALYTICS" }, as: VendorManager, captures: { rule: $.data.id } }
            - { call: "PUT /v1/tag-rules/${rule}", payload: { status: "RETIRED" }, as: VendorManager }
          trigger:
            - { call: "PUT /v1/tag-rules/${rule}", payload: { status: "ENABLED" }, as: VendorManager, captures: { err: $.data.error_id } }
          assert: ["err == ERR_TAG_RULE_INVALID_TRANSITION"]

      - name: sweep_close_from_open_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RegulatorySweep, "errors[ERR_SWEEP_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED requires RESPONDED or ESCALATED; close from OPEN rejected."
        test_recipe:
          setup: ["Property P; sweep OPEN"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/regulatory-sweeps", payload: { property_id: "${prop}", regulator_ref: "C-1", jurisdiction_code: "US-CA", deadline_days: 30 }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { sweep: $.data.id } }
          trigger:
            - { call: "POST /v1/regulatory-sweeps/${sweep}/close", as: PrivacyAdmin, captures: { err: $.data.error_id } }
          assert: ["err == ERR_SWEEP_INVALID_STATE"]

      - name: sweep_escalation_cascade_corner
        claim_type: side_effect_execution
        grounds: [state_machines.RegulatorySweep.OPEN_to_ESCALATED]
        excluded_because:
          difficulty_instance: "transitive_cascade / sweep_escalation_cascade_depth3"
          rationale: "Posture freeze + config suppression + tag-rule disable asserted hop-by-hop there."

      - name: vendor_suspend_cascade_corner
        claim_type: side_effect_execution
        grounds: [state_machines.Vendor.APPROVED_to_SUSPENDED]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / tag_rule_gated_by_vendor_approval"
          rationale: "Suspend -> DISABLED cascade asserted there (st_mid == DISABLED)."

      - name: gpc_withdraw_cascade_corner
        claim_type: side_effect_execution
        grounds: [state_machines.ConsentRecord.GRANTED_to_WITHDRAWN]
        excluded_because:
          difficulty_instance: "transitive_cascade / gpc_signal_cascade_depth3"
          rationale: "AUTO_GPC_WITHDRAW cascade asserted there end to end."

  # ============================================================ calculations
  - section: calculations
    instances:
      - name: propagate_empty_vendor_pool_all_confirmed
        claim_type: correct_result
        grounds: [calculations.propagation_counters, state_machines.DoNotSellRequest]
        distinguishing_aspect: "Empty in-scope pool fallback: propagate with no APPROVED vendor matching scope -> zero children and propagation_status ALL_CONFIRMED immediately."
        test_recipe:
          setup: ["Property P (SELLS_AND_SHARES); one APPROVED vendor declared [ADVERTISING] only (out of default SALE_SHARE scope); visitor; VERIFIED request"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/vendors", payload: { property_id: "${prop}", legal_name: "AdsOnly", declared_purposes: ["ADVERTISING"], tracker_signatures: ["ao.com"] }, as: VendorManager, captures: { vend: $.data.id } }
            - { call: "POST /v1/vendors/${vend}/approve", as: PrivacyAdmin }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "e@x.com", jurisdiction_code: "US-CA" }, as: Anonymous, captures: { vis: $.data.id } }
            - { call: "POST /v1/visitors/${vis}/do-not-sell-requests", payload: {}, as: Visitor, as_user_id: "${vis}", captures: { req: $.data.id } }
            - { call: "PUT /v1/do-not-sell-requests/${req}", payload: { verification_status: "VERIFIED" }, as: PrivacyAdmin }
          trigger:
            - { call: "POST /v1/do-not-sell-requests/${req}/propagate", as: PrivacyAdmin, captures: { pst: $.data.propagation_status, t: $.data.total_propagations } }
          assert: ["pst == ALL_CONFIRMED", "t == 0 (empty pool)"]

      - name: effective_consent_waterfall_corner
        claim_type: correct_result
        grounds: [calculations.effective_consent_resolution]
        excluded_because:
          difficulty_instance: "combinatorial_formula / consent_resolution_waterfall_branches"
          rationale: "Five waterfall branches asserted there via consent-preview."

      - name: retention_dual_variant_corner
        claim_type: variant_divergence
        grounds: [calculations.retention_expiry_dual]
        excluded_because:
          difficulty_instance: "dual_variant_calc / retention_pinned_vs_rolling_expiry"
          rationale: "Pinned vs rolling divergence asserted there."

      - name: vendor_risk_dual_variant_corner
        claim_type: variant_divergence
        grounds: [calculations.vendor_risk_scores]
        excluded_because:
          difficulty_instance: "dual_variant_calc / vendor_risk_strict_vs_weighted"
          rationale: "Strict vs weighted divergence asserted there."

      - name: sweep_penalty_rounding_corner
        claim_type: correct_result
        grounds: [calculations.sweep_penalty_exposure_cents]
        excluded_because:
          difficulty_instance: "combinatorial_formula / sweep_penalty_round_per_finding_then_sum"
          rationale: "Round-per-finding-then-sum pinned there with literals."

      - name: granted_count_sync_corner
        claim_type: correct_result
        grounds: [calculations.granted_purpose_count_sync]
        excluded_because:
          difficulty_instance: "compensating_invariant / grant_withdraw_regrant_counter_conservation"
          rationale: "Counter == filtered recount asserted there."

  # ============================================================ validations
  - section: validations
    instances:
      - name: consent_without_attestation_returns_age_unverified
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_AGE_UNVERIFIED]"]
        distinguishing_aspect: "Grant with age_status UNVERIFIED -> ERR_AGE_UNVERIFIED before any safety/duplicate check."
        test_recipe:
          setup: ["Property P; ACTIVE policy EU-GDPR min_age 16; visitor never attested"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "NO_SALE_NO_SHARE" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "EU-GDPR", banner_regime: "OPT_IN_REQUIRED", min_consent_age: 16, retention_days: 30, gpc_honored: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "u@x.com", jurisdiction_code: "EU-GDPR" }, as: Anonymous, captures: { vis: $.data.id } }
          trigger:
            - { call: "POST /v1/visitors/${vis}/consent-records", payload: { purpose_category: "ANALYTICS" }, as: Visitor, as_user_id: "${vis}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_AGE_UNVERIFIED"]

      - name: child_consent_blocked_directly
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_CHILD_CONSENT_FORBIDDEN]"]
        distinguishing_aspect: "On a NORMAL property (no freeze mask): CHILD granting ADVERTISING -> ERR_CHILD_CONSENT_FORBIDDEN; CHILD granting NECESSARY succeeds."
        test_recipe:
          setup: ["Property P; ACTIVE policy US-CA min_age 16 window covering; CHILD visitor (2015-06-01)"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", banner_regime: "OPT_OUT_ALLOWED", min_consent_age: 16, retention_days: 30, gpc_honored: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "k@x.com", jurisdiction_code: "US-CA" }, as: Anonymous, captures: { vis: $.data.id } }
            - { call: "POST /v1/visitors/${vis}/age-attestation", payload: { attested_birthdate: "2015-06-01T00:00:00Z" }, as: Visitor, as_user_id: "${vis}" }
          trigger:
            - { call: "POST /v1/visitors/${vis}/consent-records", payload: { purpose_category: "ADVERTISING" }, as: Visitor, as_user_id: "${vis}", captures: { err: $.data.error_id } }
            - { call: "POST /v1/visitors/${vis}/consent-records", payload: { purpose_category: "NECESSARY" }, as: Visitor, as_user_id: "${vis}", captures: { st: $.data.status } }
          assert: ["err == ERR_CHILD_CONSENT_FORBIDDEN (HTTP 403)", "st == GRANTED (NECESSARY exempt)"]

      - name: duplicate_consent_purpose_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_DUPLICATE_CONSENT_PURPOSE]"]
        distinguishing_aspect: "Second create for same (visitor, purpose) while GRANTED -> ERR_DUPLICATE_CONSENT_PURPOSE."
        test_recipe:
          setup: ["Property P; ACTIVE policy; ADULT visitor with GRANTED ANALYTICS"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "NO_SALE_NO_SHARE" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "EU-GDPR", banner_regime: "OPT_IN_REQUIRED", min_consent_age: 16, retention_days: 30, gpc_honored: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "d@x.com", jurisdiction_code: "EU-GDPR" }, as: Anonymous, captures: { vis: $.data.id } }
            - { call: "POST /v1/visitors/${vis}/age-attestation", payload: { attested_birthdate: "1990-01-01T00:00:00Z" }, as: Visitor, as_user_id: "${vis}" }
            - { call: "POST /v1/visitors/${vis}/consent-records", payload: { purpose_category: "ANALYTICS" }, as: Visitor, as_user_id: "${vis}" }
          trigger:
            - { call: "POST /v1/visitors/${vis}/consent-records", payload: { purpose_category: "ANALYTICS" }, as: Visitor, as_user_id: "${vis}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_DUPLICATE_CONSENT_PURPOSE"]

      - name: expired_record_allows_fresh_create
        claim_type: satisfaction_pass
        grounds: ["validations[priority=15]", state_machines.ConsentRecord.GRANTED_to_EXPIRED]
        distinguishing_aspect: "Once the record is EXPIRED the uniqueness gate releases: a fresh create for the same purpose succeeds with a new id; old record stays EXPIRED."
        test_recipe:
          setup: ["Property P; ACTIVE policy EU-GDPR retention 30 window [2026-01-01, 2027-01-01); ADULT visitor; ANALYTICS record granted at 2026-05-01; clock advanced to 2026-06-01 (record lazily EXPIRED)"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "NO_SALE_NO_SHARE" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "EU-GDPR", banner_regime: "OPT_IN_REQUIRED", min_consent_age: 16, retention_days: 30, gpc_honored: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "x@x.com", jurisdiction_code: "EU-GDPR" }, as: Anonymous, captures: { vis: $.data.id } }
            - { call: "POST /v1/visitors/${vis}/age-attestation", payload: { attested_birthdate: "1990-01-01T00:00:00Z" }, as: Visitor, as_user_id: "${vis}" }
            - { call: "POST /v1/visitors/${vis}/consent-records", payload: { purpose_category: "ANALYTICS" }, as: Visitor, as_user_id: "${vis}", captures: { rec1: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PrivacyAdmin }
            - { call: "GET /v1/consent-records/${rec1}", as: Any, captures: { st1: $.data.status } }
          trigger:
            - { call: "POST /v1/visitors/${vis}/consent-records", payload: { purpose_category: "ANALYTICS" }, as: Visitor, as_user_id: "${vis}", captures: { rec2: $.data.id, st2: $.data.status } }
          assert: ["st1 == EXPIRED", "st2 == GRANTED", "rec2 != rec1", "HTTP 201"]

      - name: dns_on_no_sale_property_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_DNS_NOT_APPLICABLE]"]
        distinguishing_aspect: "Property designation NO_SALE_NO_SHARE makes do-not-sell inapplicable."
        test_recipe:
          setup: ["Property P (NO_SALE_NO_SHARE); visitor"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "NO_SALE_NO_SHARE" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "n@x.com", jurisdiction_code: "US-CA" }, as: Anonymous, captures: { vis: $.data.id } }
          trigger:
            - { call: "POST /v1/visitors/${vis}/do-not-sell-requests", payload: {}, as: Visitor, as_user_id: "${vis}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_DNS_NOT_APPLICABLE"]

      - name: consent_after_policy_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_POLICY_OUTSIDE_COVERAGE_WINDOW]"]
        distinguishing_aspect: "ACTIVE policy whose window ended before the clock -> consent grant rejected with ERR_POLICY_OUTSIDE_COVERAGE_WINDOW."
        test_recipe:
          setup: ["Property P; ACTIVE policy EU-GDPR window [2026-01-01, 2026-03-01); ADULT visitor attested; clock at default 2026-05-01 (past window)"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "NO_SALE_NO_SHARE" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "EU-GDPR", banner_regime: "OPT_IN_REQUIRED", min_consent_age: 16, retention_days: 30, gpc_honored: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-03-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "t@x.com", jurisdiction_code: "EU-GDPR" }, as: Anonymous, captures: { vis: $.data.id } }
            - { call: "POST /v1/visitors/${vis}/age-attestation", payload: { attested_birthdate: "1990-01-01T00:00:00Z" }, as: Visitor, as_user_id: "${vis}" }
          trigger:
            - { call: "POST /v1/visitors/${vis}/consent-records", payload: { purpose_category: "ANALYTICS" }, as: Visitor, as_user_id: "${vis}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_POLICY_OUTSIDE_COVERAGE_WINDOW"]

      - name: consent_after_policy_retire_no_active_policy
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_NO_ACTIVE_POLICY]"]
        distinguishing_aspect: "After the only policy is RETIRED, consent for another purpose fails ERR_NO_ACTIVE_POLICY; the existing GRANTED record is untouched."
        test_recipe:
          setup: ["Property P; policy EU-GDPR ACTIVE then RETIRED; ADULT visitor with GRANTED ANALYTICS from before retirement"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "NO_SALE_NO_SHARE" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "EU-GDPR", banner_regime: "OPT_IN_REQUIRED", min_consent_age: 16, retention_days: 30, gpc_honored: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "r@x.com", jurisdiction_code: "EU-GDPR" }, as: Anonymous, captures: { vis: $.data.id } }
            - { call: "POST /v1/visitors/${vis}/age-attestation", payload: { attested_birthdate: "1990-01-01T00:00:00Z" }, as: Visitor, as_user_id: "${vis}" }
            - { call: "POST /v1/visitors/${vis}/consent-records", payload: { purpose_category: "ANALYTICS" }, as: Visitor, as_user_id: "${vis}", captures: { rec: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "RETIRED" }, as: PrivacyAdmin }
          trigger:
            - { call: "POST /v1/visitors/${vis}/consent-records", payload: { purpose_category: "ADVERTISING" }, as: Visitor, as_user_id: "${vis}", captures: { err: $.data.error_id } }
            - { call: "GET /v1/consent-records/${rec}", as: Any, captures: { st: $.data.status } }
          assert: ["err == ERR_NO_ACTIVE_POLICY", "st == GRANTED (retirement does not retroactively kill records)"]

      - name: duplicate_tag_rule_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_DUPLICATE_TAG_RULE]"]
        distinguishing_aspect: "Second tag rule for the same (banner_config_id, purpose_category) -> ERR_DUPLICATE_TAG_RULE."
        test_recipe:
          setup: ["Property P; config C; APPROVED vendor V; rule (C, ANALYTICS) exists"]
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/banner-configs", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", categories_shown: ["ANALYTICS"], config_label: "c" }, as: PrivacyAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /v1/vendors", payload: { property_id: "${prop}", legal_name: "V", declared_purposes: ["ANALYTICS"], tracker_signatures: ["v.com"] }, as: VendorManager, captures: { vend: $.data.id } }
            - { call: "POST /v1/vendors/${vend}/approve", as: PrivacyAdmin }
            - { call: "POST /v1/tag-rules", payload: { vendor_id: "${vend}", banner_config_id: "${cfg}", purpose_category: "ANALYTICS" }, as: VendorManager }
          trigger:
            - { call: "POST /v1/tag-rules", payload: { vendor_id: "${vend}", banner_config_id: "${cfg}", purpose_category: "ANALYTICS" }, as: VendorManager, captures: { err: $.data.error_id } }
          assert: ["err == ERR_DUPLICATE_TAG_RULE"]

  # ============================================================ endpoints
  - section: endpoints
    instances:
      - name: success_envelope_shape
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Success responses carry meta.api_request_id, meta.api_request_timestamp, response_type 'object', and data."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/properties", payload: { name: "ENV", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { rid: $.data.id } }
          assert: ["response has meta.api_request_id and meta.api_request_timestamp", "response_type == 'object'", "data.id present"]

      - name: error_envelope_shape
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Error responses carry response_type 'error' and data.error_id + data.message."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/properties/00000000-0000-0000-0000-000000000000", as: Any, captures: { err: $.data.error_id, msg: $.data.message } }
          assert: ["response_type == 'error'", "err == ERR_PROPERTY_NOT_FOUND", "msg is a non-empty string"]

      - name: vendors_pagination_defaults
        claim_type: pagination
        grounds: [response_envelope.pagination_defaults]
