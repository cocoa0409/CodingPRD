          Identical gross 1000000 with identical windows produces
          seller_fee_cents == 105000 for a STANDARD seller but
          seller_fee_cents == 80000 for a VOLUME seller (different entity
          domain from GatePass storage: seller-fee schedule on Settlement vs
          winner storage on GatePass), and the two nets differ accordingly
          (893000 vs 918000).
        test_recipe:
          setup:
            - "Two sellers: STANDARD and VOLUME. Same CA yard (rate 1000, free 1)."
            - "Each seller runs one vehicle through to sale: title + condition + 5 images + ready on 2026-09-01, auction closes 2026-09-10 with a 1000000 live bid from a BASIC US buyer."
