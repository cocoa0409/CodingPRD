            - "The second APPROVE returns 409 with ${not_approvable_error_id} == ERR_PAYMENT_NOT_APPROVABLE and approved_by_user_id is still admin-approver"
            - "The WITHDRAW returns 200 with RateRenegotiation.${rn1_id}.status == WITHDRAWN"
            - "ACCEPT on the WITHDRAWN renegotiation returns 409 with ${not_actionable_error_id} == ERR_RENEGOTIATION_NOT_ACTIONABLE and ServiceAgreement.${agr_id}.annual_subsidy_usd is still 1200000.00"
            - "The final DISBURSE returns 200 with status DISBURSED, ServicePeriod.${per1_id}.status == PAID, disbursed_to_date_usd == 100000.00 and obligated_remaining_usd == 1100000.00"

