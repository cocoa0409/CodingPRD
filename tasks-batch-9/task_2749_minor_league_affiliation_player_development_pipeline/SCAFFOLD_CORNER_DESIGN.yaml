        distinguishing_aspect: "The same action replayed on two unrelated machines fails the second time with each machine's own state error (ERR_INVALID_AGREEMENT_STATE, ERR_INVALID_CLEARANCE_STATE) and no field is written twice — the endpoints are not idempotent by design."
        test_recipe:
