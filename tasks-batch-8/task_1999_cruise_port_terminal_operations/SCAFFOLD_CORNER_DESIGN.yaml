            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${v700}", voyage_ref: "V700", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 0, booked_debark_pax: 0 }, as: VesselAgent, as_user_id: "${v700}", captures: { pc1: $.data.id, pc1_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pc1}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T22:00:00Z", expected_port_call_version: "${pc1_v}" }, as: Harbormaster, captures: { ba1: $.data.id } }
            - { call: "POST /port-ops/berth-assignments/${ba1}/confirm", as: Harbormaster }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${v701}", voyage_ref: "V701", scheduled_eta: "2026-08-12T08:00:00Z", scheduled_etd: "2026-08-12T20:00:00Z", booked_embark_pax: 0, booked_debark_pax: 0 }, as: VesselAgent, as_user_id: "${v701}", captures: { pc2: $.data.id, pc2_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pc2}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-12T22:00:00Z", expected_port_call_version: "${pc2_v}" }, as: Harbormaster, captures: { ba2: $.data.id } }
            - { call: "POST /port-ops/berth-assignments/${ba2}/confirm", as: Harbormaster }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${v1000}", voyage_ref: "V1000", scheduled_eta: "2026-08-14T08:00:00Z", scheduled_etd: "2026-08-14T20:00:00Z", booked_embark_pax: 0, booked_debark_pax: 0 }, as: VesselAgent, as_user_id: "${v1000}", captures: { pc3: $.data.id, pc3_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pc3}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-14T06:00:00Z", window_end: "2026-08-14T22:00:00Z", expected_port_call_version: "${pc3_v}" }, as: Harbormaster, captures: { ba3: $.data.id } }
            - { call: "POST /port-ops/berth-assignments/${ba3}/confirm", as: Harbormaster }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${v1001}", voyage_ref: "V1001", scheduled_eta: "2026-08-16T08:00:00Z", scheduled_etd: "2026-08-16T20:00:00Z", booked_embark_pax: 0, booked_debark_pax: 0 }, as: VesselAgent, as_user_id: "${v1001}", captures: { pc4: $.data.id, pc4_v: $.data.version } }
