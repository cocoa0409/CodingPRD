            - "Licensee with credit_limit_cents 10000000."
            - "BlanketAgreement: coverage 2026-08-01 to 2027-08-01, annual_fee_cents 4800000, MONTHLY cadence, usage_cap_minutes 10, pool_share_pct 20.00, left in coverage_status DRAFT."
            - "Logical clock at 2026-08-01T00:00:00Z."
