  - section: errors
    instances:
      - name: error_sod_signer_conflict
        claim_type: violation_to_error
        grounds: ["errors[ERR_SOD_SIGNER_CONFLICT]"]
        excluded_because:
          difficulty_instance: sign_sod_precedes_no_studies_referential
          rationale: "ERR_SOD_SIGNER_CONFLICT is the asserted outcome of the named §1.8 instance."
      - name: error_run_stale_on_submit
        claim_type: violation_to_error
        grounds: ["errors[ERR_RUN_STALE]"]
        excluded_because:
          difficulty_instance: study_submit_gated_on_run_freshness
          rationale: "ERR_RUN_STALE is the asserted outcome of the named §1.8 instance."
      - name: error_study_not_approved_on_attach
        claim_type: violation_to_error
        grounds: ["errors[ERR_STUDY_NOT_APPROVED]"]
        excluded_because:
          difficulty_instance: opinion_attach_gated_on_study_approved
          rationale: "ERR_STUDY_NOT_APPROVED is the asserted outcome of the named §1.8 instance."
      - name: error_pattern_period_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_PATTERN_PERIOD_OVERLAP]"]
        excluded_because:
          difficulty_instance: pattern_window_half_open_overlap_and_adjacency
          rationale: "ERR_PATTERN_PERIOD_OVERLAP is the asserted outcome of the named §1.8 instance."
      - name: error_cat_event_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_CAT_EVENT_DATE_OVERLAP]"]
        excluded_because:
          difficulty_instance: cat_event_closed_interval_touching_rejected
          rationale: "ERR_CAT_EVENT_DATE_OVERLAP is the asserted outcome of the named §1.8 instance."
  # ===========================================================================
  # From Table 7 (RBAC)
  # ===========================================================================
  - section: rbac
    instances:
      - name: claims_examiner_cannot_create_reserve_run
        claim_type: role_denial
        grounds:
          - roles[ClaimsExaminer]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "ClaimsExaminer (claims-side role) is not in the reserve-runs roles list; denial is 403 ERR_FORBIDDEN regardless of payload validity."
        test_recipe:
          setup: ["Segment exists"]
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "RB Book", line_of_business: "PROPERTY", large_loss_threshold_cents: 250000, max_range_width_pct: 0.8, benchmark_open_severity_cents: 30000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
          trigger:
            - call: "POST /actuarial/reserve-runs"
              payload: { segment_id: "${seg}", valuation_quarter: "2025-Q1", method: "CHAIN_LADDER", basis: "PAID" }
              as: ClaimsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN and HTTP status 403"
      - name: actuarial_analyst_cannot_sign_opinion
        claim_type: role_denial
        grounds:
          - roles[ActuarialAnalyst]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Signing is exclusive to AppointedActuary; the preparer role is denied even when the opinion itself would otherwise be signable."
        test_recipe:
          setup: ["DRAFT opinion exists (created by aa-1)"]
          setup_api_calls:
            - call: "POST /actuarial/opinions"
              payload: { statement_date: "2025-09-30", opinion_scope: "REASONABLE" }
              as: AppointedActuary
              as_user_id: "aa-1"
              captures: { op: $.data.id }
          trigger:
            - call: "POST /actuarial/opinions/${op}/sign"
              as: ActuarialAnalyst
              as_user_id: "analyst-9"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN and HTTP status 403"
      - name: peer_reviewer_cannot_create_study
        claim_type: role_denial
        grounds:
          - roles[PeerReviewer]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Study creation is exclusive to ActuarialAnalyst — the reviewer role cannot seed the work it later reviews (structural SoD support)."
        test_recipe:
          setup: ["Segment exists"]
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "RB Book", line_of_business: "PROPERTY", large_loss_threshold_cents: 250000, max_range_width_pct: 0.8, benchmark_open_severity_cents: 30000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
          trigger:
            - call: "POST /actuarial/studies"
              payload: { segment_id: "${seg}", valuation_quarter: "2025-Q1", selected_method: "CHAIN_LADDER", selected_basis: "PAID" }
              as: PeerReviewer
              as_user_id: "reviewer-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN and HTTP status 403"
      - name: appointed_actuary_cannot_post_claim_transactions
        claim_type: role_denial
        grounds:
          - roles[AppointedActuary]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Even the most senior role cannot write claim financials — transaction posting is exclusive to ClaimsExaminer."
        test_recipe:
          setup: ["Segment and claim exist"]
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "RB Book", line_of_business: "PROPERTY", large_loss_threshold_cents: 250000, max_range_width_pct: 0.8, benchmark_open_severity_cents: 30000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-R", accident_date: "2025-01-15", report_date: "2025-01-20" }
              as: ClaimsExaminer
              captures: { cl_r: $.data.id }
          trigger:
            - call: "POST /actuarial/claims/${cl_r}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-02-01T00:00:00Z", amount_cents: 1000 }
              as: AppointedActuary
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN and HTTP status 403"
      - name: actuarial_analyst_cannot_review_study
        claim_type: role_denial
        grounds:
          - roles[PeerReviewer]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Review is exclusive to PeerReviewer; an analyst (even one who did not prepare the study) is denied at the role layer before any SoD comparison."
        test_recipe:
          setup: ["Segment; DRAFT study created by analyst-1"]
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "RB Book", line_of_business: "PROPERTY", large_loss_threshold_cents: 250000, max_range_width_pct: 0.8, benchmark_open_severity_cents: 30000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/studies"
              payload: { segment_id: "${seg}", valuation_quarter: "2025-Q1", selected_method: "CHAIN_LADDER", selected_basis: "PAID" }
              as: ActuarialAnalyst
              as_user_id: "analyst-1"
              captures: { st: $.data.id }
          trigger:
            - call: "POST /actuarial/studies/${st}/review"
              payload: { decision: "APPROVE" }
              as: ActuarialAnalyst
              as_user_id: "analyst-2"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN and HTTP status 403"
  # ===========================================================================
  # From Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: study_patch_occ_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[study-patch-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on ReservingStudy.version: a PATCH carrying the pre-mutation version (1) succeeds and bumps the version to 2; a second PATCH still carrying 1 is rejected 412 even though the study is still DRAFT and the payload is otherwise valid."
        test_recipe:
          setup: ["Segment; DRAFT study created by analyst-1 (version 1 captured)"]
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "OCC Book", line_of_business: "PROPERTY", large_loss_threshold_cents: 250000, max_range_width_pct: 0.8, benchmark_open_severity_cents: 30000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/studies"
              payload: { segment_id: "${seg}", valuation_quarter: "2025-Q1", selected_method: "CHAIN_LADDER", selected_basis: "PAID" }
              as: ActuarialAnalyst
              as_user_id: "analyst-1"
              captures: { st: $.data.id, st_v: $.data.version }
          trigger:
            - call: "PATCH /actuarial/studies/${st}"
              payload: { expected_study_version: "${st_v}", selected_method: "BORNHUETTER_FERGUSON" }
              as: ActuarialAnalyst
              as_user_id: "analyst-1"
              captures: { v2: $.data.version, m2: $.data.selected_method }
            - call: "PATCH /actuarial/studies/${st}"
              payload: { expected_study_version: "${st_v}", selected_method: "CHAIN_LADDER" }
              as: ActuarialAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "v2 == 2 and m2 == BORNHUETTER_FERGUSON (first PATCH applied)"
            - "err == ERR_STALE_VERSION and HTTP status 412 (second PATCH carried the pre-mutation version)"
            - "ReservingStudy.${st}.selected_method == BORNHUETTER_FERGUSON (rejected PATCH left no partial write)"
      - name: derived_fields_recompute_on_method_switch
        claim_type: derived_field_reconciliation
        grounds:
          - entities.ReservingStudy.fields.selected_ibnr_cents
          - calculations.method_reconciliation
        distinguishing_aspect: "The study's denormalized selected_* fields track the selection: after PATCH switches selected_method from CHAIN_LADDER to BORNHUETTER_FERGUSON (both runs fresh), selected_ibnr_cents moves 75000 -> 64000 on the next read."
        test_recipe:
          setup: ["Main Book shared fixture with fresh CL and BF runs; DRAFT study selecting CHAIN_LADDER (version captured)"]
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "Main Book", line_of_business: "COMMERCIAL_AUTO", large_loss_threshold_cents: 400000, max_range_width_pct: 0.5, benchmark_open_severity_cents: 50000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-A", accident_date: "2025-01-15", report_date: "2025-01-20" }
              as: ClaimsExaminer
              captures: { cl_a: $.data.id }
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-02-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-05-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_a}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-09-01T00:00:00Z", amount_cents: 50000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "C-B", accident_date: "2025-04-10", report_date: "2025-04-12" }
              as: ClaimsExaminer
              captures: { cl_b: $.data.id }
            - call: "POST /actuarial/claims/${cl_b}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-05-15T00:00:00Z", amount_cents: 200000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/claims/${cl_b}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-08-10T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/triangles"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q3" }
              as: ActuarialAnalyst
            - call: "POST /actuarial/development-patterns"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q3", effective_from_quarter: "2025-Q3", effective_to_quarter: "2026-Q2" }
              as: ActuarialAnalyst
              captures: { pat: $.data.id }
            - call: "POST /actuarial/development-patterns/${pat}/select"
              as: ActuarialAnalyst
            - call: "POST /actuarial/reserve-runs"
              payload: { segment_id: "${seg}", valuation_quarter: "2025-Q3", method: "CHAIN_LADDER", basis: "PAID" }
              as: ActuarialAnalyst
            - call: "POST /actuarial/reserve-runs"
              payload: { segment_id: "${seg}", valuation_quarter: "2025-Q3", method: "BORNHUETTER_FERGUSON", basis: "PAID", earned_exposure_cents: 400000, a_priori_loss_ratio: 0.8 }
              as: ActuarialAnalyst
            - call: "POST /actuarial/studies"
              payload: { segment_id: "${seg}", valuation_quarter: "2025-Q3", selected_method: "CHAIN_LADDER", selected_basis: "PAID" }
              as: ActuarialAnalyst
              as_user_id: "analyst-1"
              captures: { st: $.data.id, st_v: $.data.version }
          trigger:
            - call: "GET /actuarial/studies/${st}"
              as: ActuarialAnalyst
              captures: { ibnr_before: $.data.selected_ibnr_cents }
            - call: "PATCH /actuarial/studies/${st}"
              payload: { expected_study_version: "${st_v}", selected_method: "BORNHUETTER_FERGUSON" }
              as: ActuarialAnalyst
              as_user_id: "analyst-1"
            - call: "GET /actuarial/studies/${st}"
              as: ActuarialAnalyst
              captures: { ibnr_after: $.data.selected_ibnr_cents, ult_after: $.data.selected_ultimate_cents }
          assert:
            - "ibnr_before == 75000 (CL run matched before the switch)"
            - "ibnr_after == 64000 and ult_after == 614000 (derived fields re-resolved to the BF run)"
      - name: layer_dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds:
          - calculations.chain_ladder_ultimate
          - calculations.case_reserve_adequacy
        excluded_because:
          difficulty_instance: chain_ladder_vs_bornhuetter_ferguson_ultimate_divergence
          rationale: "Layer behavior is exercised by both dual_variant_calc §1.8 instances."
      - name: layer_cascading_side_effects
        claim_type: cascading_side_effects
        grounds:
          - entities.LossTriangle.fields.is_stale
          - entities.ReserveRun.fields.is_stale
        excluded_because:
          difficulty_instance: transaction_posting_staleness_cascade
          rationale: "N-level cascade verified end-to-end by both transitive_cascade §1.8 instances."
      - name: layer_rate_threshold_trigger
        claim_type: rate_threshold_triggers
        grounds:
          - entities.Claim.fields.is_large_loss
        excluded_because:
          difficulty_instance: large_loss_threshold_exact_equality_segregates
          rationale: "Threshold boundary (>=) is asserted by the named §1.8 instance."
      - name: layer_ops_run_checkpoint
        claim_type: ops_run_checkpoint
        grounds:
          - calculations.quarter_close_checkpoint
          - entities.ReservingSegment.fields.last_closed_quarter
        excluded_because:
          difficulty_instance: study_draft_in_review_revision_loop
          rationale: "Checkpoint advance is asserted there (last_closed_quarter == 2025-Q3 after approval); the gate's rejection path is additionally covered by corner quarter_closed_back_dated_transaction_rejected."
  # ===========================================================================
  # From Consistency Model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_of_cascade_effects
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        excluded_because:
          difficulty_instance: transaction_posting_staleness_cascade
          rationale: "The named §1.8 instance reads claim, triangle, run and study immediately after the triggering POST and asserts every cascaded value — immediate consistency is exactly what it proves."
