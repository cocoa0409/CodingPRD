            - "Trigger call 2: data.status is still ACTIVE - cascade link 2 of repairs only lifts a FAULT_HOLD household, and this one never left ACTIVE, so intab_count stays 1 and no boost is disarmed"

      - name: run_edit_weight_publish_happy_path
        claim_type: valid_transition
        grounds:
          - state_machines.ProcessingRun
          - endpoints[POST /processing-runs/{processing_run_id}/publish]
          - calculations.projected_average_audience
        distinguishing_aspect: "The full OPEN -> EDITED -> WEIGHTED -> PUBLISHED walk on a single-household run, with publication both stamping published_by_user_id from a SECOND statistician and making the pinned scheduled deliverable due."
        test_recipe:
          setup:
            - "CHAIN C with CODE DMA-633, RANK 133, T 1, B 2000, BUDGET 500000, PERSONS 2, SERIAL MT-002033, LABEL RS-C33, opened by stat-opener-33 - carried only as far as step C9, so the run is OPEN."
            - "A STANDARD client (72h SLA) contracted to DMA-633 holds one scheduled deliverable pinned to the still-unpublished run, so its due_at is null."
          setup_api_calls:
            - call: "GET /processing-runs"
              payload: { state: "OPEN" }
              as: MethodologyStatistician
              captures: { run33_id: "$.data[0].id", run33_minutes: "$.data[0].window_minutes", m33_id: "$.data[0].market_id" }
            - call: "POST /clients"
              payload: { name: "Riverbend Broadcasting", tier: "STANDARD", contract_market_ids: ["${m33_id}"] }
              as: ClientServiceRep
              captures: { cl33_id: "$.data.id" }
            - call: "POST /clients/${cl33_id}/scheduled-deliverables"
              payload: { processing_run_id: "${run33_id}", requested_cell_count: 1 }
              as: ClientServiceRep
              captures: { d33_id: "$.data.id", d33_due: "$.data.due_at" }
          trigger:
            - call: "POST /processing-runs/${run33_id}/edit"
              payload: {}
              as: MethodologyStatistician
            - call: "POST /processing-runs/${run33_id}/weight"
              payload: { weight_variant: "FINAL" }
              as: MethodologyStatistician
            - call: "POST /processing-runs/${run33_id}/publish"
              payload: {}
              as: MethodologyStatistician
              as_user_id: "stat-publisher-33"
            - call: "GET /client-deliverables/${d33_id}"
              payload: {}
              as: ClientServiceRep
            - call: "GET /household-weights"
              payload: { processing_run_id: "${run33_id}" }
              as: MethodologyStatistician
          assert:
            - "Setup call 3: ${d33_due} == null - a scheduled dataset pinned to an unpublished run has no due date yet"
            - "Trigger call 1: HTTP 200 with data.state == EDITED, data.contributing_household_count == 1, data.invalidated_interval_count == 0, data.ascribed_interval_count == 0, data.outlier_household_count == 0"
            - "Trigger call 2: HTTP 200 with data.state == WEIGHTED, data.weight_variant == FINAL, data.total_weight_mass == 100000.0000 and data.projected_average_audience == 24306 (contribution round_half_up(100000 * 350 / 1440, 2) == 24305.56, then round_half_up(24305.56, 0))"
            - "Trigger call 3: HTTP 200 with data.state == PUBLISHED, data.published_by_user_id == stat-publisher-33 and data.opened_by_user_id == stat-opener-33, and ${run33_minutes} == 1440"
            - "Trigger call 3: data.limitation_disclosures == [] - the market carried no disclosures to append"
            - "Trigger call 4: data.due_at == 2026-08-14T00:00:00Z - publication set it to the logical clock 2026-08-11T00:00:00Z plus the client's 72 SLA hours, and data.state is still SCHEDULED"
            - "Trigger call 5: total_count == 1 with base_weight == 100000.0000, adjusted_weight == 100000.0000, capped == false, usable_minutes == 350, contribution == 24305.56 and run_compliance_rate == 1.0000 (ceil(1440/1440) == 1 evaluated day, 350 >= 30 credited minutes)"

      - name: published_run_rejects_edit_weight_publish_and_repin
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ProcessingRun.terminal_states
          - validations[priority 38, 39, 42, 70]
        distinguishing_aspect: "PUBLISHED is terminal against four different triggers and each answers with its own state-specific error id, so a published measurement can never be silently re-weighted."
        test_recipe:
          setup:
            - "CHAIN C complete, with CODE DMA-634, RANK 134, T 1, B 2000, BUDGET 500000, PERSONS 2, SERIAL MT-002034, LABEL RS-C34, opened by stat-opener-34 and published by stat-publisher-34, yielding the PUBLISHED run ${run34_id}."
          setup_api_calls:
            - call: "GET /processing-runs"
              payload: { state: "PUBLISHED" }
              as: MethodologyStatistician
              captures: { run34_id: "$.data[0].id", run34_projected: "$.data[0].projected_average_audience" }
          trigger:
            - call: "POST /processing-runs/${run34_id}/edit"
              payload: {}
              as: MethodologyStatistician
              captures: { e34a: "$.data.error_id" }
            - call: "POST /processing-runs/${run34_id}/detect-faults"
              payload: {}
              as: MethodologyStatistician
              captures: { e34b: "$.data.error_id" }
            - call: "POST /processing-runs/${run34_id}/weight"
              payload: { weight_variant: "DESIGN" }
              as: MethodologyStatistician
              captures: { e34c: "$.data.error_id" }
            - call: "POST /processing-runs/${run34_id}/publish"
              payload: {}
              as: MethodologyStatistician
              as_user_id: "stat-third-34"
              captures: { e34d: "$.data.error_id" }
            - call: "POST /processing-runs/${run34_id}/repin"
              payload: {}
              as: MethodologyStatistician
              captures: { e34e: "$.data.error_id" }
          assert:
            - "Trigger call 1: HTTP 409 with ${e34a} == ERR_RUN_NOT_OPEN (priority 38)"
            - "Trigger call 2: HTTP 409 with ${e34b} == ERR_RUN_NOT_OPEN - the same rule guards both OPEN-only endpoints"
            - "Trigger call 3: HTTP 409 with ${e34c} == ERR_RUN_NOT_EDITED (priority 39) - the WEIGHTED -> WEIGHTED re-weight edge does not reopen from PUBLISHED"
            - "Trigger call 4: HTTP 409 with ${e34d} == ERR_RUN_NOT_WEIGHTED (priority 42), which is checked before the segregation-of-duties rule at priority 44"
            - "Trigger call 5: HTTP 409 with ${e34e} == ERR_RUN_NOT_PENDING_REPIN (priority 70)"
            - "GET /processing-runs/${run34_id} still reports state PUBLISHED with projected_average_audience == ${run34_projected} == 24306 and weight_variant FINAL"

      - name: universe_supersede_pends_the_repin_and_repin_restores_raw_intervals
        claim_type: compensation
        grounds:
