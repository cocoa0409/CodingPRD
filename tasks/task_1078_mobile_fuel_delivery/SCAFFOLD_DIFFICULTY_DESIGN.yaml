  - rule_id: compensating_invariant
    instances:
      - name: fuel_reservation_conserved_across_reserve_then_release
        grounds:
          - calculations.fuel_reservation_conservation
          - state_machines.DeliveryOrder.SCHEDULED_to_ROUTED
          - state_machines.DeliveryOrder.ROUTED_to_CANCELLED
          - entities.TruckCompartment.fields.gallons_available
        distinguishing_aspect: |
          Conserved quantity: compartment onboard gallons. assign-route reserves 8 gal
          (available 100 -> 92); cancel releases exactly 8 (available -> 100). The reserve+release
          round trip leaves gallons_available unchanged and gallons_reserved back at 0.
        test_recipe:
          setup:
            - "REGULAR/ZONE_A price 419 effective 2026-04-01; clock default."
            - "Individual customer, REGULAR vehicle tank 40 level 0; truck REGULAR compartment onboard 100 on a PLANNING ZONE_A route; per-fill order (8 gal) assigned (ROUTED, reserved 8)."
          setup_api_calls:
            - call: "POST /fuel-prices"
              payload: { fuel_type: "REGULAR", zone: "ZONE_A", price_per_gallon_cents: 419, effective_date: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { name: "Mia Ind", email: "mia@x.com", customer_type: "INDIVIDUAL" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make_model: "T-Roc", fuel_type: "REGULAR", tank_capacity_gallons: 40, current_fuel_level_gallons: 0 }
              as: Member
              as_user_id: "${cust_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /trucks"
              payload: { plate: "TRK-9", home_zone: "ZONE_A" }
              as: PlatformAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /trucks/${truck_id}/compartments"
              payload: { fuel_type: "REGULAR", gallons_capacity: 200, gallons_onboard: 100 }
              as: PlatformAdmin
              captures: { comp_id: $.data.id }
            - call: "POST /routes"
              payload: { truck_id: "${truck_id}", assigned_driver_id: "driver-9", zone: "ZONE_A", window_start: "2026-05-02T06:00:00Z", window_end: "2026-05-02T20:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", zone: "ZONE_A", delivery_address: "8 Rsv St", requested_gallons: 8, delivery_window_start: "2026-05-02T09:00:00Z", delivery_window_end: "2026-05-02T11:00:00Z" }
              as: Member
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/assign-route"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
          trigger:
            - call: "POST /orders/${ord_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${cust_id}"
          assert:
            - "DeliveryOrder.${ord_id}.status == CANCELLED"
            - "TruckCompartment.${comp_id}.gallons_reserved == 0"
            - "TruckCompartment.${comp_id}.gallons_available == 100"

      - name: fleet_budget_conserved_across_commit_then_release
        grounds:
          - calculations.vehicle_budget_conservation
          - state_machines.DeliveryOrder.SCHEDULED_to_CANCELLED
          - entities.Vehicle.fields.committed_spend_cents
          - entities.FleetAccount.fields.committed_budget_cents
        distinguishing_aspect: |
          Conserved quantity: budget cents (a DIFFERENT conserved quantity from gallons). Creating a
          fleet order commits estimated_total 5790 (vehicle committed 5790, remaining 94210); cancel
          releases exactly 5790 so committed returns to 0 and remaining to the full 100000 cap.
        test_recipe:
          setup:
            - "DIESEL/ZONE_A price 459 effective 2026-04-01; clock default."
            - "FLEET customer + FleetAccount (budget 100000, allowed [DIESEL]) with a DIESEL vehicle (cap 100000, tank 100 level 0); one SCHEDULED fleet order (10 gal, est_total 5790)."
          setup_api_calls:
            - call: "POST /fuel-prices"
              payload: { fuel_type: "DIESEL", zone: "ZONE_A", price_per_gallon_cents: 459, effective_date: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { name: "GoldFleet", email: "ops@goldfleet.com", customer_type: "FLEET" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { customer_id: "${cust_id}", monthly_budget_cap_cents: 100000, allowed_fuel_types: ["DIESEL"], allowed_addons: [] }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { fa_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", fleet_account_id: "${fa_id}", make_model: "Sprinter", fuel_type: "DIESEL", tank_capacity_gallons: 100, current_fuel_level_gallons: 0, monthly_spend_cap_cents: 100000 }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", fleet_account_id: "${fa_id}", zone: "ZONE_A", delivery_address: "9 Depot Rd", requested_gallons: 10, delivery_window_start: "2026-05-02T09:00:00Z", delivery_window_end: "2026-05-02T11:00:00Z" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /orders/${ord_id}/cancel"
              payload: {}
              as: FleetManager
              as_user_id: "${cust_id}"
          assert:
            - "DeliveryOrder.${ord_id}.status == CANCELLED"
            - "Vehicle.${veh_id}.committed_spend_cents == 0"
            - "Vehicle.${veh_id}.remaining_budget_cents == 100000"
            - "FleetAccount.${fa_id}.committed_budget_cents == 0"
