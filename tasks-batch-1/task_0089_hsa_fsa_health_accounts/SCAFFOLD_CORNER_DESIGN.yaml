      - name: participant_cannot_submit_claim_for_other_owner
        claim_type: role_denied
        grounds: ["validations[priority=5]", "errors[ERR_NOT_RESOURCE_OWNER]", roles]
        distinguishing_aspect: "Participant P2 submitting a claim against P1's account returns 403 ERR_NOT_RESOURCE_OWNER (entity_backed ownership: account.participant_id != X-User-ID)."
        test_recipe:
          setup: ["P1 owns an ACTIVE HEALTH_FSA; P2 is a different participant acting as the claimant."]
          setup_api_calls:
