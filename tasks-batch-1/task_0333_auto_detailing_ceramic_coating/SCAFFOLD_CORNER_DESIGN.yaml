scaffold_corner_design:

  # ===================================================================
  # Entities
  # ===================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Customer.fields.email
          - entities.Customer.fields.loyalty_tier
        distinguishing_aspect: "POST /detailing/customers with email+full_name returns 201, loyalty_tier=BRONZE, spends=0."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /detailing/customers"
              payload: { email: "new@x.com", full_name: "New Cust" }
              as: Scheduler
              captures: { cust_id: $.data.id }
          assert:
            - "response.http_status == 201"
            - "Customer.${cust_id}.loyalty_tier == BRONZE"
            - "Customer.${cust_id}.chronological_lifetime_spend_cents == 0"
            - "Customer.${cust_id}.projected_lifetime_spend_cents == 0"
            - "Customer.${cust_id}.version == 1"

      - name: get_customer_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /detailing/customers/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /detailing/customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_FOUND"
            - "response.http_status == 404"

      - name: create_customer_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Customer.fields.full_name
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /detailing/customers omitting full_name returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /detailing/customers"
              payload: { email: "x@x.com" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"
            - "response.http_status == 422"

      - name: create_customer_email_without_at_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Customer.fields.email
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /detailing/customers with email lacking '@' returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /detailing/customers"
              payload: { email: "noatsign", full_name: "Bad Email" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"
            - "response.http_status == 422"

      - name: appointment_invalid_enum_tier_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Appointment.fields.tier
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /detailing/appointments with tier='PLATINUM' (illegal enum) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Catalog + customer + mobile unit seeded."
          setup_api_calls:
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T08:00:00Z" }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "SEDAN", size_multiplier_bps: 10000 }
              as: Scheduler
            - call: "POST /detailing/customers"
              payload: { email: "enum@x.com", full_name: "Enum Test" }
              as: Scheduler
              captures: { cust_id: $.data.id }
            - call: "POST /detailing/mobile-units"
              payload: { unit_code: "ME1", travel_buffer_minutes: 30 }
              as: Scheduler
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /detailing/appointments"
              payload: { customer_id: "${cust_id}", tier: "PLATINUM", vehicle_size: "SEDAN", location_mode: "MOBILE", scheduled_start_utc: "2026-06-15T10:00:00Z", mobile_unit_id: "${unit_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"
            - "response.http_status == 422"

      - name: appointment_system_fields_generated_not_accepted_from_input
        claim_type: System Fields
        grounds:
          - entities.Appointment.fields.work_status
          - entities.Appointment.fields.payment_status
        distinguishing_aspect: "POST /detailing/appointments yields server-set work_status=BOOKED, payment_status=UNPAID, version=1; id/created_at system-minted."
        test_recipe:
          setup:
            - "Catalog + customer + mobile unit seeded."
          setup_api_calls:
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T08:00:00Z" }
              as: Scheduler
            - call: "POST /detailing/packages"
              payload: { tier: "FULL", base_price_cents: 12000, prep_minutes: 20, service_minutes: 120, cure_minutes: 0, guarantee_days: 7 }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "SEDAN", size_multiplier_bps: 10000 }
              as: Scheduler
            - call: "POST /detailing/customers"
              payload: { email: "sys@x.com", full_name: "Sys F" }
              as: Scheduler
              captures: { cust_id: $.data.id }
            - call: "POST /detailing/mobile-units"
              payload: { unit_code: "ME2", travel_buffer_minutes: 30 }
              as: Scheduler
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /detailing/appointments"
              payload: { customer_id: "${cust_id}", tier: "FULL", vehicle_size: "SEDAN", location_mode: "MOBILE", scheduled_start_utc: "2026-06-15T10:00:00Z", mobile_unit_id: "${unit_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
          assert:
            - "Appointment.${appt_id}.work_status == BOOKED"
            - "Appointment.${appt_id}.payment_status == UNPAID"
            - "Appointment.${appt_id}.version == 1"

      - name: appointment_default_use_membership_credit_false
        claim_type: Defaults
        grounds:
          - entities.Appointment.fields.use_membership_credit
          - entities.Appointment.fields.credit_applied_cents
        distinguishing_aspect: "Omitting use_membership_credit defaults to false; credit_applied_cents stays 0."
        test_recipe:
          setup:
            - "Catalog + customer + mobile unit seeded (no membership)."
          setup_api_calls:
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T08:00:00Z" }
              as: Scheduler
            - call: "POST /detailing/packages"
              payload: { tier: "FULL", base_price_cents: 12000, prep_minutes: 20, service_minutes: 120, cure_minutes: 0, guarantee_days: 7 }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "SEDAN", size_multiplier_bps: 10000 }
              as: Scheduler
            - call: "POST /detailing/customers"
              payload: { email: "def@x.com", full_name: "Def G" }
              as: Scheduler
              captures: { cust_id: $.data.id }
            - call: "POST /detailing/mobile-units"
              payload: { unit_code: "ME3", travel_buffer_minutes: 30 }
              as: Scheduler
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /detailing/appointments"
              payload: { customer_id: "${cust_id}", tier: "FULL", vehicle_size: "SEDAN", location_mode: "MOBILE", scheduled_start_utc: "2026-06-15T10:00:00Z", mobile_unit_id: "${unit_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
          assert:
            - "Appointment.${appt_id}.use_membership_credit == false"
            - "Appointment.${appt_id}.credit_applied_cents == 0"

      - name: appointment_fk_customer_not_found_returns_fk_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Appointment.fields.customer_id
          - validations[priority=5]
          - errors[ERR_FK_NOT_FOUND]
        distinguishing_aspect: "POST /detailing/appointments with a non-existent customer_id returns ERR_FK_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Catalog + mobile unit seeded; no customer with the supplied id."
          setup_api_calls:
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T08:00:00Z" }
              as: Scheduler
            - call: "POST /detailing/packages"
              payload: { tier: "FULL", base_price_cents: 12000, prep_minutes: 20, service_minutes: 120, cure_minutes: 0, guarantee_days: 7 }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "SEDAN", size_multiplier_bps: 10000 }
              as: Scheduler
            - call: "POST /detailing/mobile-units"
              payload: { unit_code: "ME4", travel_buffer_minutes: 30 }
              as: Scheduler
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /detailing/appointments"
              payload: { customer_id: "00000000-0000-4000-8000-000000000001", tier: "FULL", vehicle_size: "SEDAN", location_mode: "MOBILE", scheduled_start_utc: "2026-06-15T10:00:00Z", mobile_unit_id: "${unit_id}" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_FK_NOT_FOUND"
            - "response.http_status == 404"

      - name: list_customers_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints
        distinguishing_aspect: "GET /detailing/customers returns a paginated array with total_count and has_more in meta."
        test_recipe:
          setup:
            - "Two customers created."
          setup_api_calls:
            - call: "POST /detailing/customers"
              payload: { email: "p1@x.com", full_name: "P One" }
              as: Scheduler
            - call: "POST /detailing/customers"
              payload: { email: "p2@x.com", full_name: "P Two" }
              as: Scheduler
          trigger:
            - call: "GET /detailing/customers?limit=1&offset=0"
              payload: {}
              as: Scheduler
          assert:
            - "response.data is an array of length 1"
            - "response.total_count == 2"
            - "response.has_more == true"

      - name: pagination_limit_out_of_range_returns_validation
        claim_type: Type Constraints
        grounds:
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "GET /detailing/customers with limit=0 (below min 1) returns ERR_VALIDATION (422)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /detailing/customers?limit=0"
              payload: {}
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_VALIDATION"
            - "response.http_status == 422"

      - name: immutable_packagecatalog_has_no_version_field
        claim_type: Immutability
        grounds:
          - entities.PackageCatalog.fields.tier
        distinguishing_aspect: "PackageCatalog (common_fields:false) exposes id+created_at but no version field; the create response carries no version."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /detailing/packages"
              payload: { tier: "WASH", base_price_cents: 4000, prep_minutes: 10, service_minutes: 30, cure_minutes: 0, guarantee_days: 0 }
              as: Scheduler
              captures: { pkg_id: $.data.id }
          assert:
            - "response.http_status == 201"
            - "PackageCatalog.${pkg_id}.base_price_cents == 4000"

  # ===================================================================
  # State Machines
  # ===================================================================
  - section: state_machines
    instances:
      - name: appointment_initial_work_status_is_booked
        claim_type: Initial State
        grounds:
          - state_machines.Appointment.BOOKED_to_CHECKED_IN
          - entities.Appointment.fields.work_status
        distinguishing_aspect: "A freshly created Appointment starts work_status=BOOKED, payment_status=UNPAID."
        excluded_because:
          difficulty_instance: non_linear_state_machine / appointment_parallel_work_and_payment_dimensions_evolve_independently
          rationale: "The parallel-dimension instance asserts the BOOKED initial work_status alongside the payment transition."

      - name: start_prep_without_before_photo_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Appointment.CHECKED_IN_to_IN_PREP
          - validations[priority=14]
          - errors[ERR_PHOTO_REQUIRED]
        distinguishing_aspect: "start-prep from CHECKED_IN with no BEFORE photo returns ERR_PHOTO_REQUIRED (409)."
        test_recipe:
          setup:
            - "FULL/SEDAN MOBILE appointment checked-in, no BEFORE photo attached."
          setup_api_calls:
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T08:00:00Z" }
              as: Scheduler
            - call: "POST /detailing/packages"
              payload: { tier: "FULL", base_price_cents: 12000, prep_minutes: 20, service_minutes: 120, cure_minutes: 0, guarantee_days: 7 }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "SEDAN", size_multiplier_bps: 10000 }
              as: Scheduler
            - call: "POST /detailing/customers"
              payload: { email: "ph1@x.com", full_name: "Ph One" }
              as: Scheduler
              captures: { cust_id: $.data.id }
            - call: "POST /detailing/mobile-units"
              payload: { unit_code: "MP1", travel_buffer_minutes: 30 }
              as: Scheduler
              captures: { unit_id: $.data.id }
            - call: "POST /detailing/appointments"
              payload: { customer_id: "${cust_id}", tier: "FULL", vehicle_size: "SEDAN", location_mode: "MOBILE", scheduled_start_utc: "2026-06-15T09:00:00Z", mobile_unit_id: "${unit_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /detailing/appointments/${appt_id}/check-in"
              payload: {}
              as: Detailer
          trigger:
            - call: "POST /detailing/appointments/${appt_id}/start-prep"
              payload: {}
              as: Detailer
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_PHOTO_REQUIRED"
            - "response.http_status == 409"

      - name: finish_service_without_after_photo_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Appointment.IN_SERVICE_to_READY
          - validations[priority=14]
          - errors[ERR_PHOTO_REQUIRED]
        distinguishing_aspect: "finish-service from IN_SERVICE with no AFTER photo returns ERR_PHOTO_REQUIRED (409)."
        test_recipe:
          setup:
            - "FULL/SEDAN MOBILE appointment in IN_SERVICE with only a BEFORE photo."
          setup_api_calls:
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T08:00:00Z" }
              as: Scheduler
            - call: "POST /detailing/packages"
              payload: { tier: "FULL", base_price_cents: 12000, prep_minutes: 20, service_minutes: 120, cure_minutes: 0, guarantee_days: 7 }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "SEDAN", size_multiplier_bps: 10000 }
              as: Scheduler
            - call: "POST /detailing/customers"
              payload: { email: "ph2@x.com", full_name: "Ph Two" }
              as: Scheduler
              captures: { cust_id: $.data.id }
            - call: "POST /detailing/mobile-units"
              payload: { unit_code: "MP2", travel_buffer_minutes: 30 }
              as: Scheduler
              captures: { unit_id: $.data.id }
            - call: "POST /detailing/appointments"
              payload: { customer_id: "${cust_id}", tier: "FULL", vehicle_size: "SEDAN", location_mode: "MOBILE", scheduled_start_utc: "2026-06-15T09:00:00Z", mobile_unit_id: "${unit_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /detailing/appointments/${appt_id}/check-in"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/photos"
              payload: { phase: "BEFORE", image_url: "s3://b.jpg" }
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/start-prep"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/start-service"
              payload: {}
              as: Detailer
          trigger:
            - call: "POST /detailing/appointments/${appt_id}/finish-service"
              payload: {}
              as: Detailer
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_PHOTO_REQUIRED"
            - "response.http_status == 409"

      - name: ceramic_finish_cure_before_release_time_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Appointment.CURING_to_READY
          - validations[priority=15]
          - errors[ERR_CURE_NOT_ELAPSED]
        distinguishing_aspect: "finish-cure with now (2026-06-16T12:44:00Z) one minute before vehicle_release_utc (12:45:00Z) returns ERR_CURE_NOT_ELAPSED (409)."
        test_recipe:
          setup:
            - "CERAMIC/SEDAN SHOP appointment driven to CURING; vehicle_release_utc = 2026-06-16T12:45:00Z; clock at 12:44:00Z."
          setup_api_calls:
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T07:00:00Z" }
              as: Scheduler
            - call: "POST /detailing/packages"
              payload: { tier: "CERAMIC", base_price_cents: 50000, prep_minutes: 45, service_minutes: 240, cure_minutes: 1440, guarantee_days: 90 }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "SEDAN", size_multiplier_bps: 10000 }
              as: Scheduler
            - call: "POST /detailing/customers"
              payload: { email: "cu1@x.com", full_name: "Cu One" }
              as: Scheduler
              captures: { cust_id: $.data.id }
            - call: "POST /detailing/service-bays"
              payload: { bay_code: "CB1", supports_ceramic: true }
              as: Scheduler
              captures: { bay_id: $.data.id, bay_v: $.data.version }
            - call: "POST /detailing/appointments"
              payload: { customer_id: "${cust_id}", tier: "CERAMIC", vehicle_size: "SEDAN", location_mode: "SHOP", scheduled_start_utc: "2026-06-15T08:00:00Z", service_bay_id: "${bay_id}", expected_service_bay_version: "${bay_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /detailing/appointments/${appt_id}/check-in"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/photos"
              payload: { phase: "BEFORE", image_url: "s3://b.jpg" }
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/start-prep"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/start-service"
              payload: {}
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/photos"
              payload: { phase: "AFTER", image_url: "s3://a.jpg" }
              as: Detailer
            - call: "POST /detailing/appointments/${appt_id}/finish-service"
              payload: {}
              as: Detailer
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T12:44:00Z" }
              as: Scheduler
          trigger:
            - call: "POST /detailing/appointments/${appt_id}/finish-cure"
              payload: {}
              as: Detailer
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_CURE_NOT_ELAPSED"
            - "response.http_status == 409"

      - name: cancel_already_cancelled_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Appointment.BOOKED_to_CANCELLED
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling an appointment that is already CANCELLED returns ERR_INVALID_STATE (409); no further side effects."
        test_recipe:
          setup:
            - "FULL/SEDAN MOBILE appointment cancelled once (no deposit)."
          setup_api_calls:
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T08:00:00Z" }
              as: Scheduler
            - call: "POST /detailing/packages"
              payload: { tier: "FULL", base_price_cents: 12000, prep_minutes: 20, service_minutes: 120, cure_minutes: 0, guarantee_days: 7 }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "SEDAN", size_multiplier_bps: 10000 }
              as: Scheduler
            - call: "POST /detailing/customers"
              payload: { email: "cc1@x.com", full_name: "Cc One" }
              as: Scheduler
              captures: { cust_id: $.data.id }
            - call: "POST /detailing/mobile-units"
              payload: { unit_code: "MC1", travel_buffer_minutes: 30 }
              as: Scheduler
              captures: { unit_id: $.data.id }
            - call: "POST /detailing/appointments"
              payload: { customer_id: "${cust_id}", tier: "FULL", vehicle_size: "SEDAN", location_mode: "MOBILE", scheduled_start_utc: "2026-06-15T09:00:00Z", mobile_unit_id: "${unit_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /detailing/appointments/${appt_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /detailing/appointments/${appt_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: released_appointment_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Appointment.READY_to_RELEASED
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From terminal RELEASED, check-in is rejected ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "FULL/SEDAN MOBILE appointment fully completed, paid, and RELEASED."
          setup_api_calls:
            - call: "POST /detailing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T08:00:00Z" }
              as: Scheduler
            - call: "POST /detailing/packages"
              payload: { tier: "FULL", base_price_cents: 12000, prep_minutes: 20, service_minutes: 120, cure_minutes: 0, guarantee_days: 7 }
              as: Scheduler
            - call: "POST /detailing/vehicle-size-rates"
              payload: { vehicle_size: "SEDAN", size_multiplier_bps: 10000 }
              as: Scheduler
            - call: "POST /detailing/customers"
              payload: { email: "tl1@x.com", full_name: "Tl One" }
              as: Scheduler
              captures: { cust_id: $.data.id }
            - call: "POST /detailing/mobile-units"
              payload: { unit_code: "MT1", travel_buffer_minutes: 30 }
              as: Scheduler
              captures: { unit_id: $.data.id }
