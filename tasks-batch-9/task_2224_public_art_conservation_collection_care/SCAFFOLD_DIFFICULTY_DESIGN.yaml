          A different category pair from the first instance: business_safety (priority 19) versus
          business_referential (priority 36) on POST /public-art/deaccession-cases/{id}/execute. The
          notice exists and is ACKNOWLEDGED so priority 18 passes, but its earliest_action_at is
          2026-10-30 while the clock is 2026-09-15, and the TRANSFER case has a null
          disposition_target_ref; only ERR_MORAL_RIGHTS_WAIT_ACTIVE may be returned.
