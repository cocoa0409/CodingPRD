            - "${mid_status} == OPEN and ${mid_v} == ${cycle_v}: the blocked close left the cycle untouched and bumped no version"
            - "${rej_status} == REJECTED with ${rej_units} == 0: a rejection clears the block without funding a single unit"
            - "${after_reject} == DECIDED: with no PROPOSED decision left the cycle bubbles up on its own"
            - "${closed_status} == CLOSED on the replayed close - the same call, the same actor, the same cycle id, and now it succeeds"
            - "no ReceiptCommitment exists for the plan: GET /otb/receipt-commitments filtered to plan_month_id ${m1_id} returns total_count 0"

      - name: reforecast_round_cap_is_reached_after_three_cycles
        claim_type: violation_to_error
        grounds:
          - errors.ERR_REFORECAST_ROUND_LIMIT
          - validations[priority=18].ERR_REFORECAST_ROUND_LIMIT
          - state_machines.CategoryPlan.APPROVED_to_REFORECAST_OPEN
        distinguishing_aspect: "The cap counts rounds CUMULATIVELY on the plan and is never reset by the plan cycling back through SUBMITTED and APPROVED: three complete reforecast loops leave reforecast_round at 3 and the plan sitting in APPROVED with no OPEN cycle, so every other precondition of the fourth request is satisfied and only the counter blocks it. An implementation that stored the round on the cycle, or that zeroed the counter on re-approval, would let the fourth reforecast through."
        test_recipe:
          setup:
            - "an APPROVED plan that has been through three full reforecast loops: open a cycle, close it with no decisions, re-submit and re-approve"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
