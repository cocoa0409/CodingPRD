            - { call: "POST /talent/cycles/${cy_adj}/sessions", payload: { candidate_id: "${cd1}", interviewer_id: "${iv1}", guide_id: "${g_adj}", scheduled_start: "2026-08-12T11:00:00Z", scheduled_end: "2026-08-12T12:00:00Z" }, as: HiringManager, as_user_id: hm-1, captures: { s_d1a: $.data.id } }
