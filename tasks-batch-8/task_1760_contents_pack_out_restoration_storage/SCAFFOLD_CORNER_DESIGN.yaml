          assert:
            - "error_id == ERR_HAZMAT_MANIFEST_REQUIRED (hazmat item without manifest_number / wrong method)"
            - "DisposalRecord.${drec}.status remains DRAFT"

  # -------------------------------------------------------------- endpoints ----
  - section: endpoints
    instances:
      - name: rooms_list_pagination_envelope
        claim_type: pagination
        grounds: ["response_envelope", "endpoints"]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more: 2 rooms, limit=1 -> 1 row + has_more true; offset=1 -> second row + has_more false."
        test_recipe:
          setup: ["job with two rooms (Alpha, Beta)"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-EP1", property_address: "84 Willow St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Alpha", room_type: "LIVING" }, as: ProjectManager }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Beta", room_type: "BATH" }, as: ProjectManager }
          trigger:
            - { call: "GET /api/pack-out-jobs/${job}/rooms?limit=1&offset=0", payload: {}, as: ProjectManager }
            - { call: "GET /api/pack-out-jobs/${job}/rooms?limit=1&offset=1", payload: {}, as: ProjectManager }
          assert:
            - "page 1: response_type == 'array', exactly 1 room row, total_count == 2, has_more == true, limit == 1, offset == 0"
            - "page 2: exactly 1 room row, total_count == 2, has_more == false, offset == 1"
      - name: payment_exceeds_balance_returns_error
        claim_type: precondition_enforcement
        grounds: ["validations[priority=12]", "errors[ERR_PAYMENT_EXCEEDS_BALANCE]", "state_machines.CarrierInvoice.transitions"]
        distinguishing_aspect: "On a SUBMITTED invoice (state allows RECORD_PAYMENT) the fiscal bound fires alone: amount 1051 > balance 1050 -> ERR_PAYMENT_EXCEEDS_BALANCE, amount_paid unchanged."
        test_recipe:
          setup: ["SUBMITTED invoice with total/balance 1050 (statement final 0 + adjustment 1000 + fee 50)"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-EP2", property_address: "86 Beech St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id, job_v1: $.data.version } }
            - { call: "POST /api/pack-out-jobs/${job}/storage-statements", payload: { period_start: "2026-08-01", period_end: "2026-09-01", expected_job_version: "${job_v1}" }, as: BillingClerk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BillingClerk }
            - { call: "POST /api/billing-runs", payload: {}, as: BillingClerk }
            - { call: "POST /api/pack-out-jobs/${job}/carrier-invoices", payload: { adjustment_cents: 1000 }, as: BillingClerk, captures: { inv: $.data.id } }
            - { call: "POST /api/carrier-invoices/${inv}/transition", payload: { action: "SUBMIT" }, as: BillingClerk }
          trigger:
            - { call: "POST /api/carrier-invoices/${inv}/transition", payload: { action: "RECORD_PAYMENT", amount_cents: 1051 }, as: BillingClerk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PAYMENT_EXCEEDS_BALANCE (1051 > 1050)"
            - "GET /api/carrier-invoices/${inv}: amount_paid_cents == 0 and balance_cents == 1050"

  # ------------------------------------------------------------------- rbac ----
  - section: rbac
    instances:
      - name: technician_cannot_create_vault
        claim_type: rbac_denial
        grounds: ["roles[InventoryTechnician]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Vault creation is ProjectManager-exclusive; an InventoryTechnician is rejected with ERR_FORBIDDEN_ROLE (403) at priority 2 before any existence or business check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/vaults", payload: { code: "V-RB1", climate_class: "STANDARD", capacity_cu_ft: 100, monthly_rate_cents_per_cu_ft: 100 }, as: InventoryTechnician, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403; error_id == ERR_FORBIDDEN_ROLE"
      - name: subcontractor_contact_cannot_act_on_other_vendors_referral
        claim_type: rbac_denial
        grounds: ["roles[SubcontractorContact]", "errors[ERR_NOT_REFERRAL_SUBCONTRACTOR]"]
        distinguishing_aspect: "Entity-backed identity: SubcontractorContact with X-User-ID of subcontractor B cannot RECEIVE a referral owned by subcontractor A — ERR_NOT_REFERRAL_SUBCONTRACTOR (403)."
        test_recipe:
          setup: ["two subcontractors A and B; referral on sub A, DISPATCHED"]
          setup_api_calls:
            - { call: "POST /api/subcontractors", payload: { name: "Vendor A", specialty_types: ["FUR_CLEANING"], max_concurrent_referrals: 5 }, as: ProjectManager, captures: { sub_a: $.data.id } }
            - { call: "POST /api/subcontractors", payload: { name: "Vendor B", specialty_types: ["FUR_CLEANING"], max_concurrent_referrals: 5 }, as: ProjectManager, captures: { sub_b: $.data.id } }
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-RB2", property_address: "88 Cherry St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Closet", room_type: "BEDROOM" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-RB2", description: "Fur coat", item_category: "TEXTILE", declared_value_cents: 80000, volume_cu_ft: 3 }, as: InventoryTechnician, captures: { item: $.data.id, item_v: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v}" }, as: InventoryTechnician }
            - { call: "POST /api/items/${item}/specialty-referrals", payload: { subcontractor_id: "${sub_a}", specialty_type: "FUR_CLEANING", quoted_cost_cents: 7000 }, as: ProjectManager, captures: { ref: $.data.id } }
            - { call: "POST /api/specialty-referrals/${ref}/transition", payload: { action: "DISPATCH" }, as: ProjectManager }
          trigger:
            - { call: "POST /api/specialty-referrals/${ref}/transition", payload: { action: "RECEIVE" }, as: SubcontractorContact, as_user_id: "${sub_b}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403; error_id == ERR_NOT_REFERRAL_SUBCONTRACTOR (X-User-ID is vendor B, referral belongs to vendor A)"
            - "SpecialtyReferral.${ref}.status remains DISPATCHED"
      - name: claim_filer_cannot_approve_own_claim
        claim_type: rbac_denial
        grounds: ["validations[priority=3]", "errors[ERR_SEGREGATION_OF_DUTIES]", "entities.HandlingClaim.fields.filed_by_user_id"]
        distinguishing_aspect: "Segregation of duties across roles: the ClaimsAdjuster role may approve claims, but the same human (X-User-ID pm-1) who filed the claim is rejected with ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["claim filed by pm-1 and moved to UNDER_REVIEW by adj-1"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-RB3", property_address: "90 Oak St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Den", room_type: "LIVING" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-RB3", description: "Console", item_category: "ELECTRONICS", declared_value_cents: 40000, volume_cu_ft: 3 }, as: InventoryTechnician, captures: { item: $.data.id } }
            - { call: "POST /api/items/${item}/handling-claims", payload: { claim_type: "DAMAGE", description: "Cracked casing", replacement_cost_cents: 40000, item_age_years: 2 }, as: ProjectManager, as_user_id: "pm-1", captures: { claim: $.data.id } }
            - { call: "POST /api/handling-claims/${claim}/transition", payload: { action: "SUBMIT_REVIEW" }, as: ClaimsAdjuster, as_user_id: "adj-1" }
          trigger:
            - { call: "POST /api/handling-claims/${claim}/transition", payload: { action: "APPROVE" }, as: ClaimsAdjuster, as_user_id: "pm-1", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403; error_id == ERR_SEGREGATION_OF_DUTIES (approver pm-1 == filer pm-1)"
            - "HandlingClaim.${claim}.status remains UNDER_REVIEW and settlement_amount_cents remains null"

  # -------------------------------------------- cross-cutting complexity layers ----
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_item_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[triage-decision-stale-item]", "errors[ERR_STALE_ITEM_VERSION]"]
        distinguishing_aspect: "Optimistic concurrency on Item.version: after a first triage advances the version, a second triage carrying the previously observed version is rejected with 412 — two strictly sequential requests, no parallelism."
        test_recipe:
          setup: ["one REGISTERED item (version 1 captured at creation)"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-LA1", property_address: "92 Pine St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id } }
            - { call: "POST /api/pack-out-jobs/${job}/rooms", payload: { name: "Study", room_type: "OTHER" }, as: ProjectManager, captures: { room: $.data.id } }
            - { call: "POST /api/rooms/${room}/items", payload: { barcode: "BC-LA1", description: "Desk", item_category: "FURNITURE", declared_value_cents: 5000, volume_cu_ft: 12 }, as: InventoryTechnician, captures: { item: $.data.id, item_v1: $.data.version } }
          trigger:
            - { call: "POST /api/items/${item}/triage", payload: { determination: "SALVAGEABLE", expected_item_version: "${item_v1}" }, as: InventoryTechnician, captures: { item_v2: $.data.version } }
            - { call: "POST /api/items/${item}/triage", payload: { determination: "NON_SALVAGEABLE", expected_item_version: "${item_v1}" }, as: InventoryTechnician, captures: { err: $.data.error_id } }
          assert:
            - "first triage succeeds (version 1 -> 2)"
            - "second triage with stale expected_item_version == the pre-mutation value: HTTP 412, error_id == ERR_STALE_ITEM_VERSION"
            - "Item.${item}.condition_triage remains SALVAGEABLE"
      - name: occ_stale_job_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[statement-create-stale-job]", "errors[ERR_STALE_JOB_VERSION]"]
        distinguishing_aspect: "Optimistic concurrency on PackOutJob.version for create-with-supersede: after statement S1 advances the job version, a superseding create carrying the pre-S1 version is rejected with 412."
        test_recipe:
          setup: ["job (version captured at creation) with PROVISIONAL statement S1 created against that version"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-LA2", property_address: "94 Elm St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id, job_v1: $.data.version } }
            - { call: "POST /api/pack-out-jobs/${job}/storage-statements", payload: { period_start: "2026-08-01", period_end: "2026-09-01", expected_job_version: "${job_v1}" }, as: BillingClerk, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /api/pack-out-jobs/${job}/storage-statements", payload: { period_start: "2026-08-01", period_end: "2026-09-01", supersedes_statement_id: "${s1}", expected_job_version: "${job_v1}" }, as: BillingClerk, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 412; error_id == ERR_STALE_JOB_VERSION (job version advanced when S1 was created)"
            - "S1 remains PROVISIONAL (failed supersede left it untouched)"
      - name: billing_run_finalizes_only_elapsed_statements
        claim_type: ops_run_checkpoint
        grounds: ["state_machines.StorageStatement.PROVISIONAL_to_FINALIZED", "calculations.storage_charge_accrual"]
        distinguishing_aspect: "Ops-run checkpoint with inclusive boundary: at logical clock 2026-09-01 a statement with period_end 2026-09-01 IS finalized (period_end <= now), while one with period_end 2026-10-01 stays PROVISIONAL; a second run finalizes nothing new."
        test_recipe:
          setup: ["statement S1 [2026-08-01, 2026-09-01) PROVISIONAL; clock advanced to exactly 2026-09-01T00:00:00Z; first run finalizes S1; then S2 [2026-09-01, 2026-10-01) created"]
          setup_api_calls:
            - { call: "POST /api/pack-out-jobs", payload: { claim_number: "CLM-LA3", property_address: "96 Birch St", carrier_name: "Acme Mutual", policy_coverage_type: "ACV" }, as: ProjectManager, captures: { job: $.data.id, job_v1: $.data.version } }
            - { call: "POST /api/pack-out-jobs/${job}/storage-statements", payload: { period_start: "2026-08-01", period_end: "2026-09-01", expected_job_version: "${job_v1}" }, as: BillingClerk, captures: { s1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BillingClerk }
            - { call: "POST /api/billing-runs", payload: {}, as: BillingClerk, captures: { fin1: $.data.finalized_count } }
            - { call: "GET /api/pack-out-jobs/${job}", payload: {}, as: BillingClerk, captures: { job_v2: $.data.version } }
            - { call: "POST /api/pack-out-jobs/${job}/storage-statements", payload: { period_start: "2026-09-01", period_end: "2026-10-01", expected_job_version: "${job_v2}" }, as: BillingClerk, captures: { s2: $.data.id } }
          trigger:
            - { call: "POST /api/billing-runs", payload: {}, as: BillingClerk, captures: { fin2: $.data.finalized_count } }
            - { call: "GET /api/storage-statements/${s2}", payload: {}, as: BillingClerk, captures: { s2st: $.data.status } }
          assert:
            - "first run finalized_count == 1 (S1, boundary period_end == clock is inclusive)"
            - "S1 final_total_cents == 0 (no placements) and status FINALIZED"
            - "second run finalized_count == 0 and S2 remains PROVISIONAL (period_end 2026-10-01 > clock)"
      - name: immediate_consistency_vault_occupancy
        claim_type: derived_field_reconciliation
        grounds: ["calculations.vault_occupancy"]
        excluded_because:
          difficulty_instance: vault_occupancy_activate_release_compensation
          rationale: "That §1.8 instance reads the vault immediately after each mutation (create placement -> occupied 100; release -> 0), which is exactly the immediate-consistency assertion."

