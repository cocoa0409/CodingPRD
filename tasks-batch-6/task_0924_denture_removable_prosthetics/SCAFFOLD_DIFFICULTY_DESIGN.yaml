            - call: "POST /prosthetics/try-ins/${tryin_id}/decide"
              payload: { decision: "RESUBMIT" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/try-ins/${tryin_id}/decide"
              payload: { decision: "ADJUST" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/try-ins/${tryin_id}/decide"
