              as: StaffingManager
            - call: "POST /va-staffing/virtual-assistants"
              payload: { full_name: "Va Resp", email: "varesp@x.com", skill_tag_ids: ["${skill}"], weekly_capacity_hours: 40, rating: 4.0 }
              as: StaffingManager
              captures: { va: $.data.id }
            - call: "POST /va-staffing/clients"
              payload: { company_name: "Pi", contact_email: "pi@x.com" }
              as: Client
              captures: { cli: $.data.id }
            - call: "PATCH /va-staffing/clients/${cli}/scope"
              payload: { scope_summary: "admin", required_skill_tag_ids: ["${skill}"], monthly_retainer_hours: 10, base_rate_cents: 5000, overage_rate_cents: 8000, rollover_cap_hours: 0 }
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/engagements"
              payload: { client_id: "${cli}", va_id: "${va}" }
              as: StaffingManager
              captures: { eng: $.data.id }
            - call: "POST /va-staffing/engagements/${eng}/accept"
              payload: {}
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/engagements/${eng}/activate"
              payload: { onboarding_checklist_done: true }
              as: StaffingManager
            - call: "POST /va-staffing/tasks"
              payload: { client_id: "${cli}", title: "Resp task", priority: "STANDARD", required_skill_tag_id: "${skill}", estimated_hours: 1 }
              as: Client
              as_user_id: "${cli}"
              captures: { task: $.data.id }
            - call: "POST /va-staffing/tasks/${task}/assign"
              payload: {}
              as: StaffingManager
          trigger:
            - call: "POST /va-staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T01:00:01Z" }
              as: StaffingManager
            - call: "GET /va-staffing/tasks/${task}"
              payload: {}
              as: StaffingManager
              captures: { st: $.data.sla_state }
          assert:
            - "Task.${task}.response_due_iso == 2026-03-01T01:00:00Z"
            - "Task.${task}.first_action_at_iso == null"
            - "Task.${task}.sla_state == RESPONSE_BREACHED"

      # --- 8.B resolution-window interval semantics (cumulative window, different resource field)
      - name: sla_resolution_window_cumulative_latches_at_completion
        grounds:
          - calculations.sla_due
          - entities.Task.fields.resolution_due_iso
          - entities.Task.fields.completed_at_iso
          - entities.Task.fields.sla_state
        distinguishing_aspect: |
          Interval semantics #2 (a cumulative resolution window that LATCHES at completion):
          resolution_due_iso = assigned_at + 24h; once the task reaches DONE, sla_state is frozen
          to RESOLUTION_BREACHED iff completed_at_iso > resolution_due_iso, independent of later
          clock movement. Geometry: a fixed-length window whose verdict is sealed by the DONE
          event — distinct adjacency/latch treatment from 8.A's point response deadline.
        test_recipe:
          setup:
            - "STANDARD policy resolution_hours=24; task ASSIGNED at 2026-03-01T00:00:00Z."
            - "Task started and completed at clock 2026-03-02T00:00:01Z (1s past resolution_due), with one APPROVED entry."
          setup_api_calls:
