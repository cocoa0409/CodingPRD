              captures: { p_retest_outcome: $.data.outcome, p_retest_flag: $.data.is_retest }
            - call: "GET /material-lots/${mlp_id}"
              payload: {}
              as: QAReleaser
              captures: { p_retests_after: $.data.retest_count }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${mlp_id}", test_code: "POTENCY", measured_value: 100.0, is_retest: true }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { err_max_retests: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${mlq_id}", test_code: "POTENCY", measured_value: 100.0, is_retest: true }
