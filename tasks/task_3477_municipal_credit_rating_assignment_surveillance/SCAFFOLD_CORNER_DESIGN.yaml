        distinguishing_aspect: "A FINAL bond sale created against a PUBLISHED A rating round-trips through GET with effective_yield_bps 390, annual_interest_cents 3900000, total_interest_cents 19500000 for par 100000000 over 5 years — the computed read exposes the stored calculation."
