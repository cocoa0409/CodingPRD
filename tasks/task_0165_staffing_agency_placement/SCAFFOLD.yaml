# =============================================================================
# Staffing Agency Placement — seed tables (Expert band)
# =============================================================================

scenario: |
  165. Staffing Agency Placement: candidate pool/skill, job order, submission/interview pipeline, placement (temp/temp-to-perm/direct), bill/pay-rate margin, timesheet/invoicing, assignment end/redeploy, conversion fee

domain_name: staffing-agency-placement
api_prefix: /staffing

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys; no nested-ownership URL chains. The
  # only hierarchy is Invoice -> InvoiceLineItem. Placement is self-referential
  # (predecessor_placement_id) to model assignment-end -> redeploy.

  state_machine_shape: parallel
  # Submission is branching; Candidate, Timesheet, and JobOrder are cyclic
  # (availability / revision / hold loops); Placement carries two independent
  # state axes (assignment_status x conversion_status).

  relationship_patterns:
    - one_to_many        # Client -> JobOrder, Placement -> Timesheet, Invoice -> InvoiceLineItem
    - self_referential   # Placement.predecessor_placement_id -> Placement.id (redeploy)
    - cross_aggregate    # Submission references both JobOrder and Candidate; InvoiceLineItem references Timesheet

  role_model: peer_roles
  # Recruiter and AccountManager own different operational surfaces; Client and
  # Candidate are entity-backed self-service actors.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Client company name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum total exposure (open-placement projection + issued-invoice balance) the agency will extend, in cents" }
      - { name: conversion_fee_pct, type: number, source: input, default: 0.20, description: "Conversion fee rate as a fraction of first-year salary for DIRECT placements and temp-to-perm conversions; e.g. 0.20 = 20%", constraints: "0 < value <= 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; ACTIVE on create. SUSPENDED blocks opening job orders and creating placements", constraints: "ACTIVE | SUSPENDED" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Read-only: sum of total_cents over this client's invoices in status ISSUED. Recomputed on invoice issue/void/pay" }
      - { name: open_exposure_cents, type: integer, source: computed, description: "Read-only: sum of projected_weekly_bill_cents over this client's placements whose assignment_status == ACTIVE. Recomputed on placement create/start/end" }

  - name: Skill
    parent: null
    common_fields: false  # id, created_at only — configuration catalog, immutable
    fields:
      - { name: code, type: string, source: input, description: "Unique skill code, uppercased on store (e.g. JAVA, RN, FORKLIFT)", constraints: "unique across Skill" }
      - { name: category, type: enum, source: input, description: "TECH | CLINICAL | INDUSTRIAL | CLERICAL", constraints: "TECH | CLINICAL | INDUSTRIAL | CLERICAL" }

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Candidate full name" }
      - { name: skill_codes, type: array, source: input, description: "Array of Skill.code values the candidate holds; each MUST reference an existing Skill (validated against the catalog)" }
      - { name: base_pay_rate_cents, type: integer, source: input, description: "Candidate's expected hourly pay rate, in cents/hour" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ON_ASSIGNMENT | INACTIVE; AVAILABLE on create", constraints: "AVAILABLE | ON_ASSIGNMENT | INACTIVE" }

  - name: JobOrder
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: title, type: string, source: input, description: "Role title for the requisition" }
      - { name: employment_type, type: enum, source: input, description: "TEMP | TEMP_TO_PERM | DIRECT; fixes the placement_type produced from this order", constraints: "TEMP | TEMP_TO_PERM | DIRECT" }
      - { name: required_skill_code, type: string, source: input, description: "FK -> Skill.code; a candidate must hold this skill to be submitted" }
      - { name: openings, type: integer, source: input, description: "Number of seats to fill", constraints: ">= 1" }
      - { name: bill_rate_cents, type: integer, source: input, description: "Hourly rate billed to the client, in cents/hour (TEMP / TEMP_TO_PERM)" }
      - { name: target_pay_rate_cents, type: integer, source: input, description: "Hourly pay rate offered to the placed candidate, in cents/hour (TEMP / TEMP_TO_PERM)" }
      - { name: annual_salary_cents, type: integer, source: input, default: 0, description: "First-year salary used as the conversion-fee base for DIRECT orders, in cents/year; 0 for pure TEMP" }
      - { name: filled_count, type: integer, source: computed, description: "Read-only: count of this job order's placements whose assignment_status == ACTIVE. Starts at 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | ON_HOLD | FILLED | CLOSED | CANCELLED; DRAFT on create", constraints: "DRAFT | OPEN | ON_HOLD | FILLED | CLOSED | CANCELLED" }

  - name: Submission
    parent: null
    common_fields: true
    fields:
      - { name: job_order_id, type: string, source: input, description: "FK -> JobOrder.id" }
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id" }
      - { name: submitted_pay_rate_cents, type: integer, source: input, description: "Proposed hourly pay rate for this candidate on this order, in cents/hour" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | CLIENT_REVIEW | INTERVIEWING | OFFER_EXTENDED | PLACED | REJECTED | WITHDRAWN; SUBMITTED on create", constraints: "SUBMITTED | CLIENT_REVIEW | INTERVIEWING | OFFER_EXTENDED | PLACED | REJECTED | WITHDRAWN" }
      - { name: rejection_reason, type: string, source: input, required: false, description: "Free-text reason recorded on REJECTED; system sets ORDER_FILLED / ORDER_CLOSED on cascade rejections" }

  - name: Interview
    parent: null
    common_fields: true
    fields:
      - { name: submission_id, type: string, source: input, description: "FK -> Submission.id" }
      - { name: scheduled_start, type: datetime, source: input, description: "Interview start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Interview end (ISO 8601 UTC); MUST be after scheduled_start" }
      - { name: outcome, type: enum, source: system, description: "PENDING | PASSED | FAILED; PENDING on create", constraints: "PENDING | PASSED | FAILED" }

  - name: Placement
    parent: null
    common_fields: true
    fields:
      - { name: submission_id, type: string, source: input, description: "FK -> Submission.id; the submission this placement is created from" }
      - { name: job_order_id, type: string, source: system, description: "JobOrder id, copied from the submission at placement time (derivable via submission_id; not an independently set FK)" }
      - { name: candidate_id, type: string, source: system, description: "Candidate id, copied from the submission at placement time (derivable via submission_id; not an independently set FK)" }
      - { name: predecessor_placement_id, type: string, source: input, required: false, description: "FK -> Placement.id; set only when this placement was created by redeploying an ENDED placement" }
      - { name: placement_type, type: enum, source: system, description: "TEMP | TEMP_TO_PERM | DIRECT; copied from the job order's employment_type", constraints: "TEMP | TEMP_TO_PERM | DIRECT" }
      - { name: bill_rate_cents, type: integer, source: system, description: "Hourly bill rate, copied from job order at placement time" }
      - { name: pay_rate_cents, type: integer, source: system, description: "Hourly pay rate, copied from the submission's submitted_pay_rate_cents" }
      - { name: standard_weekly_hours, type: integer, source: input, default: 40, description: "Planned weekly hours used for the projected-margin calculation", constraints: ">= 1" }
      - { name: start_date, type: datetime, source: input, description: "Assignment start (ISO 8601 UTC)" }
      - { name: end_date, type: datetime, source: input, description: "Planned assignment end (ISO 8601 UTC); MUST be after start_date. For DIRECT placements assignment is instantaneous and assignment_status is ENDED on create" }
      - { name: projected_weekly_bill_cents, type: integer, source: computed, description: "Read-only: provisional weekly bill = bill_rate_cents * standard_weekly_hours (0 for DIRECT). Feeds Client.open_exposure_cents while ACTIVE" }
      - { name: projected_weekly_margin_cents, type: integer, source: computed, description: "Read-only: provisional weekly margin = (bill_rate_cents - pay_rate_cents) * standard_weekly_hours (0 for DIRECT)" }
      - { name: actual_margin_cents, type: integer, source: computed, description: "Read-only: cumulative final margin across this placement's APPROVED+INVOICED timesheets; starts at 0" }
      - { name: assignment_status, type: enum, source: system, description: "PENDING_START | ACTIVE | ENDED; PENDING_START on create for TEMP/TEMP_TO_PERM, ENDED on create for DIRECT. Independent of conversion_status", constraints: "PENDING_START | ACTIVE | ENDED" }
      - { name: conversion_status, type: enum, source: system, description: "NONE | CONVERTED; NONE on create; only TEMP_TO_PERM placements may become CONVERTED. Independent of assignment_status", constraints: "NONE | CONVERTED" }

  - name: Timesheet
    parent: null
    common_fields: true
    fields:
      - { name: placement_id, type: string, source: input, description: "FK -> Placement.id" }
      - { name: week_start, type: datetime, source: input, description: "First instant of the timesheet week (ISO 8601 UTC), inclusive" }
      - { name: week_end, type: datetime, source: input, description: "Exclusive end of the timesheet week (ISO 8601 UTC); MUST be after week_start. Weeks are half-open [week_start, week_end)" }
      - { name: hours, type: number, source: input, description: "Hours worked in the week; > 0", constraints: "> 0" }
      - { name: pay_cents, type: integer, source: computed, description: "Read-only: candidate pay for the week including overtime (see timesheet_pay)" }
      - { name: bill_cents, type: integer, source: computed, description: "Read-only: client bill for the week including overtime (see timesheet_bill)" }
      - { name: margin_cents, type: integer, source: computed, description: "Read-only: bill_cents - pay_cents for the week" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | INVOICED; DRAFT on create", constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED | INVOICED" }
      - { name: invoice_id, type: string, source: system, required: false, description: "Invoice id, set when the timesheet is swept onto an issued invoice; cleared on void (back-reference, not an independently set FK)" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Read-only: sum of line_total_cents over this invoice's line items" }
      - { name: volume_discount_cents, type: integer, source: computed, description: "Read-only: discount applied on subtotal per the volume tier (see invoice_total)" }
      - { name: processing_fee_cents, type: integer, source: computed, description: "Read-only: processing fee on the discounted subtotal (see invoice_total)" }
      - { name: total_cents, type: integer, source: computed, description: "Read-only: subtotal_cents - volume_discount_cents + processing_fee_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | VOID; DRAFT on create", constraints: "DRAFT | ISSUED | PAID | VOID" }

  - name: InvoiceLineItem
    parent: Invoice
    common_fields: false  # id, created_at only — immutable once created
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id" }
      - { name: timesheet_id, type: string, source: input, description: "Timesheet id billed by this line; the timesheet's own invoice_id back-references this invoice (derivable; not an independently set FK)" }
      - { name: line_total_cents, type: integer, source: computed, description: "Read-only: copied from the timesheet's bill_cents at line-creation time" }

  - name: ConversionFee
    parent: null
    common_fields: true
    fields:
      - { name: placement_id, type: string, source: input, description: "FK -> Placement.id; the TEMP_TO_PERM placement being converted, or a DIRECT placement's at-create fee" }
      - { name: client_id, type: string, source: system, description: "Client id, copied from the placement's job order (derivable via placement_id; not an independently set FK)" }
      - { name: annual_salary_cents, type: integer, source: input, description: "First-year salary used as the conversion-fee base, in cents/year. Supplied in the convert request for TEMP_TO_PERM; copied from JobOrder.annual_salary_cents for the auto-created DIRECT fee" }
      - { name: fee_cents, type: integer, source: computed, description: "Read-only: computed conversion fee (see conversion_fee)" }
      - { name: status, type: enum, source: system, description: "BILLED | WAIVED; BILLED on create unless waive flag set", constraints: "BILLED | WAIVED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: JobOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "PATCH /staffing/job-orders/{id} (target_status=OPEN)"
        actor: AccountManager
        preconditions:
          - "JobOrder.status == DRAFT (ERR_JOB_ORDER_NOT_DRAFT)"
          - "Client.status == ACTIVE (ERR_CLIENT_SUSPENDED)"
        side_effects: []
      - from: OPEN
        to: ON_HOLD
        trigger: "PATCH /staffing/job-orders/{id} (target_status=ON_HOLD)"
        actor: AccountManager
        preconditions:
          - "JobOrder.status == OPEN (ERR_JOB_ORDER_NOT_OPEN)"
        side_effects: []
      - from: ON_HOLD
        to: OPEN
        trigger: "PATCH /staffing/job-orders/{id} (target_status=OPEN)"
        actor: AccountManager
        preconditions:
          - "JobOrder.status == ON_HOLD (ERR_JOB_ORDER_NOT_ON_HOLD)"
        side_effects: []
        note: "Cyclic: OPEN <-> ON_HOLD hold/resume loop."
      - from: OPEN
        to: FILLED
        trigger: "system (automatic when a placement creation raises filled_count to openings)"
        actor: system
        preconditions:
          - "JobOrder.filled_count == JobOrder.openings after the triggering placement is created"
        side_effects:
          - "All of this job order's submissions whose status IN {SUBMITTED, CLIENT_REVIEW, INTERVIEWING, OFFER_EXTENDED} are auto-transitioned to REJECTED with rejection_reason='ORDER_FILLED' (cascade hop 3)"
      - from: FILLED
        to: OPEN
        trigger: "system (automatic when an ACTIVE placement on this order ends, lowering filled_count below openings)"
        actor: system
        preconditions:
          - "JobOrder.filled_count < JobOrder.openings after a placement ends"
        side_effects: []
        note: "Re-opens so a redeploy/backfill can refill the seat."
      - from: OPEN
        to: CLOSED
        trigger: "PATCH /staffing/job-orders/{id} (target_status=CLOSED)"
        actor: AccountManager
        preconditions:
          - "JobOrder.status IN {OPEN, ON_HOLD} (ERR_JOB_ORDER_NOT_CLOSEABLE)"
        side_effects:
          - "All submissions whose status IN {SUBMITTED, CLIENT_REVIEW, INTERVIEWING, OFFER_EXTENDED} are auto-transitioned to REJECTED with rejection_reason='ORDER_CLOSED'"
      - from: ON_HOLD
        to: CLOSED
        trigger: "PATCH /staffing/job-orders/{id} (target_status=CLOSED)"
        actor: AccountManager
        preconditions:
          - "JobOrder.status IN {OPEN, ON_HOLD} (ERR_JOB_ORDER_NOT_CLOSEABLE)"
        side_effects:
          - "Same submission-rejection cascade as OPEN -> CLOSED"
      - from: DRAFT
        to: CANCELLED
        trigger: "PATCH /staffing/job-orders/{id} (target_status=CANCELLED)"
        actor: AccountManager
        preconditions:
          - "JobOrder.status == DRAFT (ERR_JOB_ORDER_NOT_DRAFT)"
        side_effects: []

  - entity: Candidate
    initial_state: AVAILABLE
    terminal_states: [INACTIVE]
    transitions:
      - from: AVAILABLE
        to: ON_ASSIGNMENT
        trigger: "system (automatic when a placement is created for this candidate via POST /staffing/placements)"
        actor: system
        preconditions:
          - "Candidate.status == AVAILABLE (ERR_CANDIDATE_NOT_AVAILABLE)"
        side_effects: []
      - from: ON_ASSIGNMENT
        to: AVAILABLE
        trigger: "system (automatic when the candidate's last ACTIVE placement ends)"
        actor: system
        preconditions:
          - "Candidate has no remaining placements with assignment_status == ACTIVE"
        side_effects: []
        note: "Cyclic: AVAILABLE <-> ON_ASSIGNMENT as assignments start and end (redeploy loop)."
      - from: AVAILABLE
        to: INACTIVE
        trigger: "PATCH /staffing/candidates/{id} (target_status=INACTIVE)"
        actor: Recruiter
        preconditions:
          - "Candidate.status == AVAILABLE (ERR_CANDIDATE_NOT_AVAILABLE)"
        side_effects: []

  - entity: Submission
    initial_state: SUBMITTED
    terminal_states: [PLACED, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: CLIENT_REVIEW
        trigger: "PATCH /staffing/submissions/{id} (target_status=CLIENT_REVIEW)"
        actor: Recruiter
        preconditions:
          - "Submission.status == SUBMITTED (ERR_SUBMISSION_BAD_STATE)"
          - "JobOrder.status == OPEN (ERR_JOB_ORDER_NOT_OPEN)"
        side_effects: []
      - from: CLIENT_REVIEW
        to: INTERVIEWING
        trigger: "POST /staffing/submissions/{id}/interviews"
        actor: Client
        preconditions:
          - "Submission.status == CLIENT_REVIEW (ERR_SUBMISSION_BAD_STATE)"
          - "JobOrder.status == OPEN (ERR_JOB_ORDER_NOT_OPEN)"
        side_effects:
          - "Interview created in outcome PENDING; submission advances to INTERVIEWING"
      - from: INTERVIEWING
        to: OFFER_EXTENDED
        trigger: "PATCH /staffing/submissions/{id} (target_status=OFFER_EXTENDED)"
        actor: Client
        preconditions:
          - "Submission.status == INTERVIEWING (ERR_SUBMISSION_BAD_STATE)"
          - "At least one Interview for this submission has outcome == PASSED (ERR_NO_PASSED_INTERVIEW)"
          - "JobOrder.status == OPEN (ERR_JOB_ORDER_NOT_OPEN)"
        side_effects: []
      - from: CLIENT_REVIEW
        to: REJECTED
        trigger: "PATCH /staffing/submissions/{id} (target_status=REJECTED)"
        actor: Client
        preconditions:
          - "Submission.status IN {CLIENT_REVIEW, INTERVIEWING, OFFER_EXTENDED} (ERR_SUBMISSION_BAD_STATE)"
        side_effects: []
        note: "Branching: any non-terminal client-side review state may be rejected."
      - from: INTERVIEWING
        to: REJECTED
        trigger: "PATCH /staffing/submissions/{id} (target_status=REJECTED)"
        actor: Client
        preconditions:
          - "Submission.status IN {CLIENT_REVIEW, INTERVIEWING, OFFER_EXTENDED} (ERR_SUBMISSION_BAD_STATE)"
        side_effects: []
      - from: OFFER_EXTENDED
        to: REJECTED
        trigger: "PATCH /staffing/submissions/{id} (target_status=REJECTED)"
        actor: Client
        preconditions:
          - "Submission.status IN {CLIENT_REVIEW, INTERVIEWING, OFFER_EXTENDED} (ERR_SUBMISSION_BAD_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "PATCH /staffing/submissions/{id} (target_status=WITHDRAWN)"
        actor: Recruiter
        preconditions:
          - "Submission.status IN {SUBMITTED, CLIENT_REVIEW, INTERVIEWING} (ERR_SUBMISSION_BAD_STATE)"
        side_effects: []
      - from: CLIENT_REVIEW
        to: WITHDRAWN
        trigger: "PATCH /staffing/submissions/{id} (target_status=WITHDRAWN)"
        actor: Recruiter
        preconditions:
          - "Submission.status IN {SUBMITTED, CLIENT_REVIEW, INTERVIEWING} (ERR_SUBMISSION_BAD_STATE)"
        side_effects: []
      - from: INTERVIEWING
        to: WITHDRAWN
        trigger: "PATCH /staffing/submissions/{id} (target_status=WITHDRAWN)"
        actor: Recruiter
        preconditions:
          - "Submission.status IN {SUBMITTED, CLIENT_REVIEW, INTERVIEWING} (ERR_SUBMISSION_BAD_STATE)"
        side_effects: []
      - from: OFFER_EXTENDED
        to: PLACED
        trigger: "POST /staffing/placements"
        actor: Recruiter
        preconditions:
          - "Submission.status == OFFER_EXTENDED (ERR_SUBMISSION_NOT_OFFER_EXTENDED)"
          - "JobOrder.status == OPEN (ERR_JOB_ORDER_NOT_OPEN)"
          - "Candidate.status != INACTIVE (ERR_CANDIDATE_INACTIVE)"
          - "No overlapping ACTIVE/PENDING_START placement for the candidate (ERR_PLACEMENT_DATE_OVERLAP)"
          - "JobOrder.filled_count < JobOrder.openings (ERR_NO_OPENINGS_REMAINING)"
          - "expected_job_order_version matches JobOrder.version (ERR_STALE_JOB_ORDER_VERSION)"
          - "Projected exposure within client credit_limit (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Placement created (cascade hop 1); placement.job_order_id and candidate_id copied from the submission"
          - "Candidate AVAILABLE -> ON_ASSIGNMENT (only if currently AVAILABLE; a candidate already ON_ASSIGNMENT from a non-overlapping placement stays ON_ASSIGNMENT)"
          - "JobOrder.filled_count += 1; increments JobOrder.version by 1 (cascade hop 2); if filled_count == openings, JobOrder OPEN -> FILLED (hop 2 -> hop 3)"
          - "If placement_type == DIRECT: ConversionFee (BILLED) created from JobOrder.annual_salary_cents * client.conversion_fee_pct (clamped)"
          - "Client.open_exposure_cents recomputed"

  - entity: Placement
    initial_state: PENDING_START
    terminal_states: []   # assignment_status terminal is ENDED; conversion_status is an independent axis
    transitions:
      - from: PENDING_START
        to: ACTIVE
        trigger: "PATCH /staffing/placements/{id} (target_assignment_status=ACTIVE)"
        actor: Recruiter
        preconditions:
          - "Placement.assignment_status == PENDING_START (ERR_PLACEMENT_NOT_PENDING_START)"
          - "placement_type IN {TEMP, TEMP_TO_PERM} (DIRECT placements are created already ENDED)"
        side_effects:
          - "Client.open_exposure_cents recomputed (projected_weekly_bill now counts)"
        note: "assignment_status axis."
      - from: ACTIVE
        to: ENDED
        trigger: "PATCH /staffing/placements/{id} (target_assignment_status=ENDED)"
        actor: Recruiter
        preconditions:
          - "Placement.assignment_status == ACTIVE (ERR_PLACEMENT_NOT_ACTIVE)"
        side_effects:
          - "Client.open_exposure_cents recomputed (projected_weekly_bill removed)"
          - "JobOrder.filled_count -= 1; if it drops below openings and JobOrder.status == FILLED, JobOrder FILLED -> OPEN"
          - "If candidate has no remaining ACTIVE placements, Candidate ON_ASSIGNMENT -> AVAILABLE"
        note: "assignment_status axis. End is the redeploy enabler: candidate frees up and the seat re-opens."
      - from: NONE
        to: CONVERTED
        trigger: "POST /staffing/placements/{id}/convert"
        actor: AccountManager
        preconditions:
          - "Placement.placement_type == TEMP_TO_PERM (ERR_PLACEMENT_NOT_CONVERTIBLE)"
          - "Placement.conversion_status == NONE (ERR_PLACEMENT_ALREADY_CONVERTED)"
          - "Placement.assignment_status == ACTIVE (ERR_PLACEMENT_NOT_ACTIVE)"
        side_effects:
          - "ConversionFee created in status BILLED (or WAIVED if waive=true)"
          - "conversion_status NONE -> CONVERTED"
          - "Placement.assignment_status ACTIVE -> ENDED (the temp engagement closes when it converts to perm); triggers the ACTIVE -> ENDED side effects above"
        note: "conversion_status axis runs independently of assignment_status until conversion forces the assignment to ENDED."

  - entity: Timesheet
    initial_state: DRAFT
    terminal_states: [INVOICED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "PATCH /staffing/timesheets/{id} (target_status=SUBMITTED)"
        actor: Candidate
        preconditions:
          - "Timesheet.status == DRAFT (ERR_TIMESHEET_BAD_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "PATCH /staffing/timesheets/{id} (target_status=APPROVED)"
        actor: Client
        preconditions:
          - "Timesheet.status == SUBMITTED (ERR_TIMESHEET_BAD_STATE)"
        side_effects:
          - "Placement.actual_margin_cents += this timesheet's margin_cents (derived-field reconciliation)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "PATCH /staffing/timesheets/{id} (target_status=REJECTED)"
        actor: Client
        preconditions:
          - "Timesheet.status == SUBMITTED (ERR_TIMESHEET_BAD_STATE)"
        side_effects: []
      - from: REJECTED
        to: DRAFT
        trigger: "PATCH /staffing/timesheets/{id} (target_status=DRAFT, optional hours)"
        actor: Candidate
        preconditions:
          - "Timesheet.status == REJECTED (ERR_TIMESHEET_BAD_STATE)"
        side_effects:
          - "If hours supplied, pay_cents/bill_cents/margin_cents recomputed"
        note: "Cyclic: SUBMITTED -> REJECTED -> DRAFT revision loop."
      - from: APPROVED
        to: INVOICED
        trigger: "system (automatic when an invoice carrying a line item for this timesheet is ISSUED)"
        actor: system
        preconditions:
          - "Timesheet.status == APPROVED"
        side_effects:
          - "Timesheet.invoice_id set; Placement.actual_margin_cents unchanged (already counted at APPROVED)"
      - from: INVOICED
        to: APPROVED
        trigger: "system (automatic when the carrying invoice is VOIDed)"
        actor: system
        preconditions:
          - "Timesheet.status == INVOICED and its invoice transitions ISSUED -> VOID"
        side_effects:
          - "Timesheet.invoice_id cleared; the timesheet becomes re-billable"
        note: "Compensating reversal of the APPROVED -> INVOICED sweep."

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "PATCH /staffing/invoices/{id} (target_status=ISSUED)"
        actor: AccountManager
        preconditions:
          - "Invoice.status == DRAFT (ERR_INVOICE_BAD_STATE)"
          - "Invoice has at least one line item (ERR_INVOICE_EMPTY)"
        side_effects:
          - "Each referenced Timesheet APPROVED -> INVOICED and its invoice_id set (cascade hop 1)"
          - "Client.outstanding_balance_cents += total_cents (cascade hop 2)"
      - from: ISSUED
        to: PAID
        trigger: "PATCH /staffing/invoices/{id} (target_status=PAID)"
        actor: AccountManager
        preconditions:
          - "Invoice.status == ISSUED (ERR_INVOICE_BAD_STATE)"
        side_effects:
          - "Client.outstanding_balance_cents -= total_cents"
      - from: ISSUED
        to: VOID
        trigger: "PATCH /staffing/invoices/{id} (target_status=VOID)"
        actor: AccountManager
        preconditions:
          - "Invoice.status == ISSUED (ERR_INVOICE_BAD_STATE)"
        side_effects:
          - "Client.outstanding_balance_cents -= total_cents (compensating reversal — leaves balance == sum of remaining ISSUED invoice totals)"
          - "Each referenced Timesheet reverts INVOICED -> APPROVED and its invoice_id is cleared"

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: placement-create-stale-job-order
    parent_entity: JobOrder
    write_endpoint: "POST /staffing/placements"
    occ_field: "expected_job_order_version"
    description: |
      Creating a Placement against a JobOrder whose version has advanced since
      the client last observed it is rejected. This captures the case where a
      prior placement was created against the same order (legitimately raising
      filled_count and bumping the order's version), so the current writer's
      view of the order — and of how many openings remain — is stale.
    error_id: ERR_STALE_JOB_ORDER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: placement_projected_margin
    trigger: "Placement creation (POST /staffing/placements) — provisional variant of placement margin"
    algorithm: forward_looking
    formula: |
      projected_weekly_bill_cents   = bill_rate_cents * standard_weekly_hours
      projected_weekly_margin_cents = (bill_rate_cents - pay_rate_cents) * standard_weekly_hours
      For DIRECT placements both are 0 (no hourly billing; revenue is the conversion/placement fee).
    input_set: "Single placement at creation; rates copied from JobOrder.bill_rate_cents and Submission.submitted_pay_rate_cents."
    constants: {}
    precision: "integer cents (integer multiply; no rounding needed)"
    variants:
      - name: provisional
        when: "At placement creation (Placement entity)."
        difference: "Uses planned standard_weekly_hours and copied rates; this is the projection that feeds Client.open_exposure_cents."
      - name: actual
        when: "Reconciled as timesheets are APPROVED (see placement_actual_margin)."
        difference: "Replaces the weekly projection with the cents-exact sum of realized weekly margins; the two diverge whenever real hours != standard_weekly_hours."

  - name: placement_actual_margin
    trigger: "Timesheet APPROVED (PATCH /staffing/timesheets/{id} target_status=APPROVED) — final variant of placement margin"
    algorithm: aggregation
    formula: |
      Placement.actual_margin_cents = sum of margin_cents over this placement's
      timesheets whose status IN {APPROVED, INVOICED}, accumulated in chronological
      order of week_start ASC, ties broken by Timesheet.created_at ASC. On each
      APPROVE transition the just-approved timesheet's margin_cents is added.
    input_set: "Timesheets of one placement in status APPROVED or INVOICED (DRAFT/SUBMITTED/REJECTED excluded)."
    constants: {}
    precision: "integer cents"
    note: "Trigger ↔ side-effect: the Timesheet SUBMITTED -> APPROVED transition lists 'Placement.actual_margin_cents += margin_cents'."

  - name: client_credit_exposure
    trigger: "Read of Client.open_exposure_cents / outstanding_balance_cents and the credit check during placement creation"
    algorithm: aggregation
    formula: |
      open_exposure_cents       = sum of projected_weekly_bill_cents over the client's
                                  placements whose assignment_status == ACTIVE.
      outstanding_balance_cents = sum of total_cents over the client's invoices whose
                                  status == ISSUED.
      Credit check on placement create: (open_exposure_cents + new_projected_weekly_bill_cents
      + outstanding_balance_cents) must be <= credit_limit_cents, else ERR_CREDIT_LIMIT_EXCEEDED.
      Equality is allowed (<=, not <).
    input_set: "Placements with assignment_status == ACTIVE (projection) and Invoices with status == ISSUED (realized)."
    constants: {}
    precision: "integer cents"
    variants:
      - name: provisional_exposure
        when: "Forward-looking gate at placement creation (Client.open_exposure_cents)."
        difference: "Counts not-yet-billed projected weekly bill of ACTIVE placements; a forward projection of future client liability."
      - name: actual_outstanding
        when: "Realized once invoices are ISSUED (Client.outstanding_balance_cents)."
        difference: "Counts only issued-invoice totals (money actually owed). Diverges from provisional_exposure because projection uses standard_weekly_hours while invoices use realized timesheet bills."

  - name: timesheet_pay
    trigger: "Timesheet creation and revise (recompute pay_cents / margin_cents)"
    algorithm: threshold
    formula: |
      regular_hours  = min(hours, OT_THRESHOLD_HOURS)
      overtime_hours = max(0, hours - OT_THRESHOLD_HOURS)
      pay_cents = round_half_up(regular_hours  * pay_rate_cents
                                + overtime_hours * pay_rate_cents * OT_MULTIPLIER)
      Overtime applies STRICTLY ABOVE the threshold: hours == 40.0 yields 0 overtime hours.
    input_set: "One timesheet; pay_rate_cents copied from the placement."
    constants:
      OT_THRESHOLD_HOURS: 40
      OT_MULTIPLIER: 1.5
    precision: "round_half_up to integer cents AFTER summing regular and overtime components (sum-then-round)"

  - name: timesheet_bill
    trigger: "Timesheet creation and revise (recompute bill_cents / margin_cents)"
    algorithm: threshold
    formula: |
      regular_hours  = min(hours, OT_THRESHOLD_HOURS)
      overtime_hours = max(0, hours - OT_THRESHOLD_HOURS)
      bill_cents = round_half_up(regular_hours  * bill_rate_cents
                                 + overtime_hours * bill_rate_cents * OT_BILL_MULTIPLIER)
      margin_cents = bill_cents - pay_cents
    input_set: "One timesheet; bill_rate_cents copied from the placement."
    constants:
      OT_THRESHOLD_HOURS: 40
      OT_BILL_MULTIPLIER: 1.5
    precision: "round_half_up to integer cents AFTER summing regular and overtime components (sum-then-round)"

  - name: invoice_total
    trigger: "Recomputed on every InvoiceLineItem add and on invoice read; finalized at issue"
    algorithm: tiered_pricing
    formula: |
      EVALUATION ORDER IS PINNED (resolves the circular-looking subtotal/discount/fee dependency):
        STEP 1  subtotal_cents = sum over line items of line_total_cents.
                Each line_total_cents was itself rounded (round_half_up) at line-creation
                time from the timesheet's bill_cents — so this is ROUND-PER-LINE-ITEM THEN SUM,
                NOT sum-then-round.
        STEP 2  volume_discount_cents = round_half_up(subtotal_cents * tier_rate(subtotal_cents)),
                tier_rate selected from the subtotal tier table.
        STEP 3  discounted = subtotal_cents - volume_discount_cents
        STEP 4  processing_fee_cents = round_half_up(discounted * PROCESSING_FEE_PCT)
                (fee keyed on the POST-discount amount, fixing evaluation order).
        STEP 5  total_cents = subtotal_cents - volume_discount_cents + processing_fee_cents
      Tier boundaries are inclusive at the lower edge (subtotal_cents >= boundary selects that tier).
    input_set: "InvoiceLineItems of one invoice; each line's line_total_cents copied from its timesheet's bill_cents."
    constants:
      TIER_1_MIN_CENTS: 500000     # 500000 <= subtotal < 2000000 -> 3%
      TIER_1_RATE: 0.03
      TIER_2_MIN_CENTS: 2000000    # subtotal >= 2000000 -> 6%
      TIER_2_RATE: 0.06
      PROCESSING_FEE_PCT: 0.015    # subtotal < 500000 -> 0% discount
    precision: "round_half_up to integer cents at each pinned step (round-per-line-item then sum at STEP 1; round discount and fee independently)"
    note: "Combinatorial modes (b)+(c): per-line rounding-then-sum order is pinned, AND the subtotal->discount->fee evaluation order is pinned so the value is well-defined."

  - name: conversion_fee
    trigger: "Placement convert (POST /staffing/placements/{id}/convert) and DIRECT placement creation"
    algorithm: tiered_pricing
    formula: |
      base = annual_salary_cents (from the convert request, or JobOrder.annual_salary_cents for DIRECT)
      effective_pct depends on placement_type and prior temp tenure:
        - DIRECT:        effective_pct = client.conversion_fee_pct
        - TEMP_TO_PERM:  effective_pct = client.conversion_fee_pct * tenure_factor
            tenure_factor = 1.0 if weeks_worked < TENURE_DISCOUNT_WEEKS
                            else TENURE_DISCOUNT_FACTOR   (long temp tenure discounts the perm fee)
            weeks_worked = count of the placement's timesheets in status IN {APPROVED, INVOICED}
      raw_fee   = round_half_up(base * effective_pct)
      fee_cents = max(MIN_FEE_CENTS, min(raw_fee, MAX_FEE_CENTS))
    input_set: "One placement; tenure derived from its APPROVED/INVOICED timesheets; rate from the client."
    constants:
      TENURE_DISCOUNT_WEEKS: 13
      TENURE_DISCOUNT_FACTOR: 0.5
      MIN_FEE_CENTS: 250000
      MAX_FEE_CENTS: 5000000
    precision: "round_half_up to integer cents before the min/max clamp"
    note: "Combinatorial mode (a): >=3 inputs (base, rate, tenure) with nested min/max clamp and a conditional branch on placement_type."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is one of the declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 401
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Acting role permitted for this operation per RBAC; entity-backed actor owns the targeted resource"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Every resource id in the path and every FK in the body exists; validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_CLIENT_NOT_FOUND, ERR_SKILL_NOT_FOUND, ERR_CANDIDATE_NOT_FOUND, ERR_JOB_ORDER_NOT_FOUND, ERR_SUBMISSION_NOT_FOUND, ERR_INTERVIEW_NOT_FOUND, ERR_PLACEMENT_NOT_FOUND, ERR_TIMESHEET_NOT_FOUND, ERR_INVOICE_NOT_FOUND)"
    http_status: 404
    applies_to: all endpoints with a path id or FK body field

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present and typed; enums in range; scheduled_end > scheduled_start; end_date > start_date; week_end > week_start; hours > 0; openings >= 1; PATCH target_status is a defined value"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all write endpoints

  - priority: 5
    category: state
    check: "Target resource is in the correct state for the requested transition (state-machine from: clause)"
    error_id: "varies (ERR_JOB_ORDER_NOT_OPEN, ERR_SUBMISSION_BAD_STATE, ERR_TIMESHEET_BAD_STATE, ERR_INVOICE_BAD_STATE, ERR_PLACEMENT_NOT_ACTIVE, ERR_PLACEMENT_NOT_PENDING_START, ...)"
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 6
    category: state
    check: "Line-item timesheet must be APPROVED; record-outcome interview must be PENDING (state of the referenced child resource)"
    error_id: "ERR_TIMESHEET_NOT_APPROVED | ERR_INTERVIEW_BAD_STATE"
    http_status: 409
    applies_to: "POST /staffing/invoices/{id}/line-items, PATCH /staffing/interviews/{id}"

  - priority: 7
    category: business_referential
    check: "Candidate holds the JobOrder.required_skill_code (skill match) when creating a submission"
    error_id: ERR_SKILL_MISMATCH
    http_status: 409
    applies_to: "POST /staffing/submissions"

  - priority: 8
    category: business_referential
    check: "Candidate.status != INACTIVE when creating a placement (an ON_ASSIGNMENT candidate may take a non-overlapping concurrent placement; an INACTIVE candidate may not)"
    error_id: ERR_CANDIDATE_INACTIVE
    http_status: 409
    applies_to: "POST /staffing/placements"

  - priority: 9
    category: business_temporal
    check: "New placement's [start_date, end_date] must not overlap any existing ACTIVE/PENDING_START placement of the same candidate (CLOSED-interval overlap: shared endpoints conflict)"
    error_id: ERR_PLACEMENT_DATE_OVERLAP
    http_status: 409
    applies_to: "POST /staffing/placements"

  - priority: 10
    category: business_temporal
    check: "New timesheet's HALF-OPEN week [week_start, week_end) must not overlap any non-REJECTED timesheet of the same placement (adjacency at a shared boundary is allowed; only interior overlap conflicts)"
    error_id: ERR_TIMESHEET_WEEK_OVERLAP
    http_status: 409
    applies_to: "POST /staffing/timesheets"

  - priority: 11
    category: business_constraint
    check: "No remaining openings on the job order (filled_count < openings) when creating a placement"
    error_id: ERR_NO_OPENINGS_REMAINING
    http_status: 409
    applies_to: "POST /staffing/placements"

  - priority: 12
    category: business_referential
    check: "Line-item timesheet's placement must belong to the invoice's client"
    error_id: ERR_TIMESHEET_CLIENT_MISMATCH
    http_status: 409
    applies_to: "POST /staffing/invoices/{id}/line-items"

  - priority: 13
    category: state
    check: "OCC: expected_job_order_version equals the JobOrder's current version on placement create"
    error_id: ERR_STALE_JOB_ORDER_VERSION
    http_status: 412
    applies_to: "POST /staffing/placements"

  - priority: 14
    category: business_fiscal
    check: "Projected exposure (open_exposure + new projected_weekly_bill + outstanding_balance) must not exceed Client.credit_limit_cents (<=, equality allowed)"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /staffing/placements"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Client ---
  - method: POST
    path: "/staffing/clients"
    description: "Create a client"
    roles: [AccountManager]
    code: 201
    input: [name, credit_limit_cents, "conversion_fee_pct?"]
    output: Client
    side_effects: ["status=ACTIVE; outstanding_balance_cents=0; open_exposure_cents=0; version=1"]

  - method: GET
    path: "/staffing/clients/{id}"
    description: "Get a client (includes computed outstanding_balance_cents and open_exposure_cents)"
    roles: [AccountManager, Recruiter, Client]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: POST
    path: "/staffing/clients/{id}/suspend"
    description: "Suspend a client (blocks opening job orders and creating placements)"
    roles: [AccountManager]
    code: 200
    input: []
    output: Client
    side_effects: ["status ACTIVE -> SUSPENDED"]

  # --- Skill ---
  - method: POST
    path: "/staffing/skills"
    description: "Create a skill catalog entry"
    roles: [Recruiter, AccountManager]
    code: 201
    input: [code, category]
    output: Skill
    side_effects: ["code uppercased; ERR_SKILL_CODE_DUPLICATE if code exists"]

  - method: GET
    path: "/staffing/skills/{id}"
    description: "Get a skill"
    roles: [AccountManager, Recruiter]
    code: 200
    input: []
    output: Skill
    side_effects: []

  # --- Candidate ---
  - method: POST
    path: "/staffing/candidates"
    description: "Create a candidate"
    roles: [Recruiter]
    code: 201
    input: [full_name, skill_codes, base_pay_rate_cents]
    output: Candidate
    side_effects: ["status=AVAILABLE; each skill_code validated against the Skill catalog"]

  - method: GET
    path: "/staffing/candidates/{id}"
    description: "Get a candidate"
    roles: [Recruiter, AccountManager, Candidate]
    code: 200
    input: []
    output: Candidate
    side_effects: []

  - method: PATCH
    path: "/staffing/candidates/{id}"
    description: "Candidate status transition (deactivate an AVAILABLE candidate)"
    roles: [Recruiter]
    code: 200
    input: [target_status]
    output: Candidate
    side_effects: ["status AVAILABLE -> INACTIVE"]

  # --- JobOrder ---
  - method: POST
    path: "/staffing/job-orders"
    description: "Create a job order (DRAFT)"
    roles: [AccountManager]
    code: 201
    input: [client_id, title, employment_type, required_skill_code, openings, bill_rate_cents, target_pay_rate_cents, "annual_salary_cents?"]
    output: JobOrder
    side_effects: ["status=DRAFT; filled_count=0; version=1"]

  - method: GET
    path: "/staffing/job-orders"
    description: "List job orders (filter by client_id, status)"
    roles: [AccountManager, Recruiter, Client]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: "JobOrder[]"
    side_effects: []

  - method: GET
    path: "/staffing/job-orders/{id}"
    description: "Get a job order (includes computed filled_count)"
    roles: [AccountManager, Recruiter, Client]
    code: 200
    input: []
    output: JobOrder
    side_effects: []

  - method: PATCH
    path: "/staffing/job-orders/{id}"
    description: "Job-order lifecycle transition (target_status = OPEN | ON_HOLD | CLOSED | CANCELLED)"
    roles: [AccountManager]
    code: 200
    input: [target_status]
    output: JobOrder
    side_effects:
      - "DRAFT->OPEN (requires Client ACTIVE); OPEN<->ON_HOLD; {OPEN,ON_HOLD}->CLOSED (cascade-reject open submissions, reason ORDER_CLOSED); DRAFT->CANCELLED"

  # --- Submission ---
  - method: POST
    path: "/staffing/submissions"
    description: "Submit a candidate to a job order (skill match enforced)"
    roles: [Recruiter]
    code: 201
    input: [job_order_id, candidate_id, submitted_pay_rate_cents]
    output: Submission
    side_effects: ["status=SUBMITTED; ERR_SKILL_MISMATCH if candidate lacks required_skill_code"]

  - method: GET
    path: "/staffing/submissions"
    description: "List submissions (filter by job_order_id, candidate_id, status)"
    roles: [AccountManager, Recruiter, Client]
    code: 200
    input: ["job_order_id?", "candidate_id?", "status?", "limit?", "offset?"]
    output: "Submission[]"
    side_effects: []

  - method: GET
    path: "/staffing/submissions/{id}"
    description: "Get a submission"
    roles: [AccountManager, Recruiter, Client]
    code: 200
    input: []
    output: Submission
    side_effects: []

  - method: PATCH
    path: "/staffing/submissions/{id}"
    description: "Submission pipeline transition (target_status = CLIENT_REVIEW | OFFER_EXTENDED | REJECTED | WITHDRAWN)"
    roles: [Recruiter, Client]
    code: 200
    input: [target_status, "rejection_reason?"]
    output: Submission
    side_effects:
      - "SUBMITTED->CLIENT_REVIEW (Recruiter); INTERVIEWING->OFFER_EXTENDED (Client, requires a PASSED interview); {CLIENT_REVIEW,INTERVIEWING,OFFER_EXTENDED}->REJECTED (Client); {SUBMITTED,CLIENT_REVIEW,INTERVIEWING}->WITHDRAWN (Recruiter)"

  # --- Interview ---
  - method: POST
    path: "/staffing/submissions/{id}/interviews"
    description: "Schedule an interview for a CLIENT_REVIEW submission (advances it to INTERVIEWING)"
    roles: [Client]
    code: 201
    input: [scheduled_start, scheduled_end]
    output: Interview
    side_effects: ["Interview created PENDING; submission CLIENT_REVIEW -> INTERVIEWING"]

  - method: GET
    path: "/staffing/submissions/{id}/interviews"
    description: "List interviews for a submission (FK reverse-reachability)"
    roles: [AccountManager, Recruiter, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: "Interview[]"
    side_effects: []

  - method: PATCH
    path: "/staffing/interviews/{id}"
    description: "Record an interview outcome (outcome = PASSED | FAILED)"
    roles: [Client]
    code: 200
    input: [outcome]
    output: Interview
    side_effects: ["Interview.outcome PENDING -> PASSED | FAILED; requires outcome == PENDING (else ERR_INTERVIEW_BAD_STATE)"]

  # --- Placement ---
  - method: POST
    path: "/staffing/placements"
    description: "Place a candidate from an OFFER_EXTENDED submission (OCC on job order)"
    roles: [Recruiter]
    code: 201
    input: [submission_id, start_date, end_date, expected_job_order_version, "standard_weekly_hours?", "predecessor_placement_id?"]
    output: Placement
    side_effects:
      - "Submission OFFER_EXTENDED -> PLACED"
      - "placement_type/bill_rate/pay_rate/job_order_id/candidate_id copied; projected_weekly_bill/margin computed"
      - "Candidate AVAILABLE -> ON_ASSIGNMENT (only if currently AVAILABLE); assignment_status=PENDING_START (TEMP/TEMP_TO_PERM) or ENDED (DIRECT); conversion_status=NONE"
      - "JobOrder.filled_count += 1; increments JobOrder.version by 1; JobOrder OPEN -> FILLED if filled_count == openings (then cascade-reject other open submissions, reason ORDER_FILLED)"
      - "If placement_type == DIRECT: a ConversionFee (status BILLED) is created at once using JobOrder.annual_salary_cents and the client's conversion_fee_pct (the direct-hire placement fee)"
      - "Client.open_exposure_cents recomputed"

  - method: GET
    path: "/staffing/placements"
    description: "List placements (filter by job_order_id, candidate_id, submission_id, predecessor_placement_id, assignment_status)"
    roles: [AccountManager, Recruiter, Client, Candidate]
    code: 200
    input: ["job_order_id?", "candidate_id?", "submission_id?", "predecessor_placement_id?", "assignment_status?", "limit?", "offset?"]
    output: "Placement[]"
    side_effects: []

  - method: GET
    path: "/staffing/placements/{id}"
    description: "Get a placement (includes computed margins and both status axes)"
    roles: [AccountManager, Recruiter, Client, Candidate]
    code: 200
    input: []
    output: Placement
    side_effects: []

  - method: GET
    path: "/staffing/placements/{id}/timesheets"
    description: "List timesheets for a placement (FK reverse-reachability)"
    roles: [AccountManager, Recruiter, Client, Candidate]
    code: 200
    input: ["limit?", "offset?"]
    output: "Timesheet[]"
    side_effects: []

  - method: PATCH
    path: "/staffing/placements/{id}"
    description: "Assignment-status transition (target_assignment_status = ACTIVE | ENDED)"
    roles: [Recruiter]
    code: 200
    input: [target_assignment_status]
    output: Placement
    side_effects:
      - "PENDING_START->ACTIVE (open_exposure now counts) ; ACTIVE->ENDED (recompute open_exposure; JobOrder.filled_count -= 1 and FILLED->OPEN if below openings; Candidate -> AVAILABLE if no other ACTIVE placement)"

  - method: POST
    path: "/staffing/placements/{id}/convert"
    description: "Convert a TEMP_TO_PERM placement to direct hire (conversion_status axis); bills a conversion fee and ends the assignment"
    roles: [AccountManager]
    code: 200
    input: [annual_salary_cents, "waive?"]
    output: Placement
    side_effects:
      - "conversion_status NONE -> CONVERTED; ConversionFee created (BILLED, or WAIVED if waive=true)"
      - "assignment_status ACTIVE -> ENDED with the same end side-effects as the PATCH ENDED transition"

  # --- Timesheet ---
  - method: POST
    path: "/staffing/timesheets"
    description: "Create a draft timesheet for an ACTIVE placement (computes pay/bill/margin)"
    roles: [Candidate, Recruiter]
    code: 201
    input: [placement_id, week_start, week_end, hours]
    output: Timesheet
    side_effects: ["status=DRAFT; pay_cents/bill_cents/margin_cents computed; week-overlap checked; placement must be ACTIVE"]

  - method: GET
    path: "/staffing/timesheets"
    description: "List timesheets (filter by placement_id, invoice_id, status)"
    roles: [AccountManager, Recruiter, Client, Candidate]
    code: 200
    input: ["placement_id?", "invoice_id?", "status?", "limit?", "offset?"]
    output: "Timesheet[]"
    side_effects: []

  - method: GET
    path: "/staffing/timesheets/{id}"
    description: "Get a timesheet"
    roles: [AccountManager, Recruiter, Client, Candidate]
    code: 200
    input: []
    output: Timesheet
    side_effects: []

  - method: PATCH
    path: "/staffing/timesheets/{id}"
    description: "Timesheet transition (target_status = SUBMITTED | APPROVED | REJECTED | DRAFT). DRAFT (revise) may carry new hours"
    roles: [Candidate, Client]
    code: 200
    input: [target_status, "hours?"]
    output: Timesheet
    side_effects:
      - "DRAFT->SUBMITTED (Candidate); SUBMITTED->APPROVED (Client; Placement.actual_margin_cents += margin_cents); SUBMITTED->REJECTED (Client); REJECTED->DRAFT (Candidate; recompute pay/bill/margin if hours changed)"

  # --- Invoice ---
  - method: POST
    path: "/staffing/invoices"
    description: "Create a draft invoice for a client"
    roles: [AccountManager]
    code: 201
    input: [client_id]
    output: Invoice
    side_effects: ["status=DRAFT; all totals=0; version=1"]

  - method: GET
    path: "/staffing/invoices"
    description: "List invoices (filter by client_id, status)"
    roles: [AccountManager, Client]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  - method: GET
    path: "/staffing/invoices/{id}"
    description: "Get an invoice (includes computed subtotal/discount/fee/total)"
    roles: [AccountManager, Client]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/staffing/invoices/{id}/line-items"
    description: "List line items for an invoice (FK reverse-reachability)"
    roles: [AccountManager, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: "InvoiceLineItem[]"
    side_effects: []

  - method: POST
    path: "/staffing/invoices/{id}/line-items"
    description: "Add a line item billing one APPROVED timesheet (recomputes invoice totals)"
    roles: [AccountManager]
    code: 201
    input: [timesheet_id]
    output: InvoiceLineItem
    side_effects: ["line_total_cents=timesheet.bill_cents; invoice subtotal/discount/fee/total recomputed; timesheet must be APPROVED (else ERR_TIMESHEET_NOT_APPROVED) and on a placement of the invoice's client (else ERR_TIMESHEET_CLIENT_MISMATCH)"]

  - method: PATCH
    path: "/staffing/invoices/{id}"
    description: "Invoice lifecycle transition (target_status = ISSUED | PAID | VOID)"
    roles: [AccountManager]
    code: 200
    input: [target_status]
    output: Invoice
    side_effects:
      - "DRAFT->ISSUED (>=1 line item; sweep timesheets APPROVED->INVOICED; outstanding_balance += total); ISSUED->PAID (outstanding_balance -= total); ISSUED->VOID (outstanding_balance -= total; timesheets INVOICED->APPROVED, invoice_id cleared)"

  # --- ConversionFee ---
  - method: GET
    path: "/staffing/conversion-fees"
    description: "List conversion fees (filter by placement_id, client_id)"
    roles: [AccountManager, Client]
    code: 200
    input: ["placement_id?", "client_id?", "limit?", "offset?"]
    output: "ConversionFee[]"
    side_effects: []

  - method: GET
    path: "/staffing/conversion-fees/{id}"
    description: "Get a conversion fee (includes computed fee_cents)"
    roles: [AccountManager, Client]
    code: 200
    input: []
    output: ConversionFee
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 401, condition: "X-User-ID or X-User-Role header missing or X-User-Role not a declared role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for the operation, or entity-backed actor does not own the targeted resource" }

  # --- existence ---
  - { id: ERR_CLIENT_NOT_FOUND, http: 404, condition: "Client id in path or body does not exist" }
  - { id: ERR_SKILL_NOT_FOUND, http: 404, condition: "Skill code referenced does not exist in the catalog" }
  - { id: ERR_CANDIDATE_NOT_FOUND, http: 404, condition: "Candidate id does not exist" }
  - { id: ERR_JOB_ORDER_NOT_FOUND, http: 404, condition: "JobOrder id does not exist" }
  - { id: ERR_SUBMISSION_NOT_FOUND, http: 404, condition: "Submission id does not exist" }
  - { id: ERR_INTERVIEW_NOT_FOUND, http: 404, condition: "Interview id does not exist" }
  - { id: ERR_PLACEMENT_NOT_FOUND, http: 404, condition: "Placement id (or predecessor_placement_id) does not exist" }
  - { id: ERR_TIMESHEET_NOT_FOUND, http: 404, condition: "Timesheet id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice id does not exist" }

  # --- request validation ---
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing/wrong-typed required field, enum out of range, end<=start, week_end<=week_start, hours<=0, openings<1, or undefined PATCH target value" }
  - { id: ERR_SKILL_CODE_DUPLICATE, http: 409, condition: "Creating a Skill whose code already exists" }

  # --- state ---
  - { id: ERR_CLIENT_SUSPENDED, http: 409, condition: "Client is SUSPENDED; cannot open job orders or create placements against it" }
  - { id: ERR_JOB_ORDER_NOT_DRAFT, http: 409, condition: "Operation requires JobOrder.status == DRAFT (open / cancel)" }
  - { id: ERR_JOB_ORDER_NOT_OPEN, http: 409, condition: "Operation requires JobOrder.status == OPEN" }
  - { id: ERR_JOB_ORDER_NOT_ON_HOLD, http: 409, condition: "resume requires JobOrder.status == ON_HOLD" }
  - { id: ERR_JOB_ORDER_NOT_CLOSEABLE, http: 409, condition: "close requires JobOrder.status IN {OPEN, ON_HOLD}" }
  - { id: ERR_CANDIDATE_NOT_AVAILABLE, http: 409, condition: "deactivate requires Candidate.status == AVAILABLE" }
  - { id: ERR_CANDIDATE_INACTIVE, http: 409, condition: "Placement create requires Candidate.status != INACTIVE" }
  - { id: ERR_SUBMISSION_BAD_STATE, http: 409, condition: "Submission is not in a state permitting the requested transition" }
  - { id: ERR_SUBMISSION_NOT_OFFER_EXTENDED, http: 409, condition: "Placement create requires the submission to be OFFER_EXTENDED" }
  - { id: ERR_NO_PASSED_INTERVIEW, http: 409, condition: "extend-offer requires at least one Interview with outcome PASSED" }
  - { id: ERR_INTERVIEW_BAD_STATE, http: 409, condition: "record-outcome requires Interview.outcome == PENDING" }
  - { id: ERR_PLACEMENT_NOT_PENDING_START, http: 409, condition: "start requires Placement.assignment_status == PENDING_START" }
  - { id: ERR_PLACEMENT_NOT_ACTIVE, http: 409, condition: "end / convert / timesheet-create requires Placement.assignment_status == ACTIVE" }
  - { id: ERR_PLACEMENT_NOT_CONVERTIBLE, http: 409, condition: "convert requires placement_type == TEMP_TO_PERM" }
  - { id: ERR_PLACEMENT_ALREADY_CONVERTED, http: 409, condition: "convert requires conversion_status == NONE" }
  - { id: ERR_TIMESHEET_BAD_STATE, http: 409, condition: "Timesheet is not in a state permitting the requested transition" }
  - { id: ERR_INVOICE_BAD_STATE, http: 409, condition: "Invoice is not in a state permitting the requested transition" }
  - { id: ERR_INVOICE_EMPTY, http: 409, condition: "issue requires the invoice to have at least one line item" }
  - { id: ERR_TIMESHEET_NOT_APPROVED, http: 409, condition: "A line item may only reference a timesheet in status APPROVED" }
  - { id: ERR_TIMESHEET_CLIENT_MISMATCH, http: 409, condition: "Line-item timesheet's placement client differs from the invoice's client" }

  # --- OCC ---
  - { id: ERR_STALE_JOB_ORDER_VERSION, http: 412, condition: "expected_job_order_version does not match the JobOrder's current version on placement create" }

  # --- business referential / temporal / fiscal ---
  - { id: ERR_SKILL_MISMATCH, http: 409, condition: "Candidate does not hold the job order's required_skill_code at submission time" }
  - { id: ERR_PLACEMENT_DATE_OVERLAP, http: 409, condition: "New placement's date range overlaps an existing ACTIVE/PENDING_START placement of the same candidate (closed-interval)" }
  - { id: ERR_TIMESHEET_WEEK_OVERLAP, http: 409, condition: "New timesheet's half-open week overlaps a non-REJECTED timesheet of the same placement" }
  - { id: ERR_NO_OPENINGS_REMAINING, http: 409, condition: "JobOrder.filled_count already equals openings" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Projected exposure + new projected bill + outstanding balance would exceed Client.credit_limit_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Recruiter
    description: "Agency-side operator owning the candidate pool and the submission pipeline through placement."
    identity: opaque
    exclusive_operations:
      - "POST /staffing/candidates — create candidate"
      - "PATCH /staffing/candidates/{id} — deactivate candidate"
      - "POST /staffing/submissions — submit candidate to job order"
      - "PATCH /staffing/submissions/{id} target_status IN {CLIENT_REVIEW, WITHDRAWN} — recruiter-side pipeline moves"
      - "POST /staffing/placements — create placement"
      - "PATCH /staffing/placements/{id} — start / end placement"
    shared_operations:
      - "POST /staffing/skills — create skill (with AccountManager)"
      - "POST /staffing/timesheets — create timesheet (with Candidate)"
      - "GET reads on clients, skills, candidates, job-orders, submissions, interviews, placements, timesheets"

  - name: AccountManager
    description: "Agency-side operator owning client relationships, job orders, conversions, and billing."
    identity: opaque
    exclusive_operations:
      - "POST /staffing/clients — create client"
      - "POST /staffing/clients/{id}/suspend — suspend client"
      - "POST /staffing/job-orders — create job order"
      - "PATCH /staffing/job-orders/{id} — job-order lifecycle"
      - "POST /staffing/placements/{id}/convert — convert temp-to-perm"
      - "POST /staffing/invoices — create invoice"
      - "POST /staffing/invoices/{id}/line-items — add line item"
      - "PATCH /staffing/invoices/{id} — invoice lifecycle (issue / pay / void)"
    shared_operations:
      - "POST /staffing/skills — create skill (with Recruiter)"
      - "GET reads on clients, skills, candidates, job-orders, submissions, interviews, placements, timesheets, invoices, conversion-fees"

  - name: Client
    description: "Employer; reviews submissions, runs interviews, extends/rejects offers, approves timesheets. Acts only on resources tied to its own client_id (job orders where job_order.client_id == X-User-ID, and their submissions/interviews/placements/timesheets/invoices)."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /staffing/submissions/{id}/interviews — schedule interview (advances to INTERVIEWING)"
      - "PATCH /staffing/interviews/{id} — record interview outcome"
      - "PATCH /staffing/submissions/{id} target_status IN {OFFER_EXTENDED, REJECTED} — client-side pipeline moves"
      - "PATCH /staffing/timesheets/{id} target_status IN {APPROVED, REJECTED} — approve / reject timesheet"
    shared_operations:
      - "GET reads scoped to the client's own job-orders, submissions, interviews, placements, timesheets, invoices, conversion-fees"

  - name: Candidate
    description: "Placed worker; submits and revises own timesheets. Acts only on resources tied to its own candidate_id (placements where placement.candidate_id == X-User-ID, and their timesheets)."
    identity: "entity_backed:Candidate"
    exclusive_operations:
      - "PATCH /staffing/timesheets/{id} target_status IN {SUBMITTED, DRAFT} — submit / revise own timesheet"
    shared_operations:
      - "POST /staffing/timesheets — create own timesheet (with Recruiter)"
      - "GET reads scoped to the candidate's own placements and timesheets"
