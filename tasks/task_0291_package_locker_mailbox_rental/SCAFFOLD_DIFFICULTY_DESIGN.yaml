              as: FacilityOperator
              captures: { cust: $.data.id }
            - call: "POST /forms-1583"
              payload: { facility_id: "${fac}", customer_id: "${cust}", primary_id_type: "PASSPORT", address_proof_type: "LEASE" }
              as: FacilityOperator
              captures: { form: $.data.id }
            - call: "POST /forms-1583/${form}/recipients"
              payload: { recipient_name: "C17", relationship: "SELF" }
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/submit"
              payload: {}
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rental-agreements"
              payload: { facility_id: "${fac}", customer_id: "${cust}", mailbox_unit_id: "${box}", form_1583_id: "${form}", term_months: 1 }
              as: FacilityOperator
              captures: { agr: $.data.id }
            - call: "POST /rental-agreements/${agr}/activate"
              payload: {}
              as: FacilityOperator
            - call: "GET /facilities/${fac}"
              payload: {}
              as: FacilityOperator
              captures: { avail_before: $.data.available_locker_count }
            - call: "POST /packages"
              payload: { facility_id: "${fac}", rental_agreement_id: "${agr}", carrier: "UPS", size_tier: "MEDIUM", longest_dim_cm: 40, weight_g: 3000 }
              as: FacilityOperator
              captures: { pkg: $.data.id, code: $.data.pickup_code }
            - call: "POST /packages/${pkg}/notify"
              payload: {}
              as: FacilityOperator
            - call: "GET /packages/${pkg}"
              payload: {}
              as: FacilityOperator
              captures: { v: $.data.version }
          trigger:
            - call: "POST /packages/${pkg}/pickup"
              payload: { pickup_code: "${code}", expected_package_version: "${v}" }
              as: FacilityOperator
            - call: "GET /facilities/${fac}"
              payload: {}
              as: FacilityOperator
              captures: { avail_after: $.data.available_locker_count }
          assert:
            - "Facility.${fac}.available_locker_count == 1 before receive, 0 while OCCUPIED, and 1 again after pickup (conserved)"

      # --- (2) conserved quantity: Invoice.balance_cents identity ---
      - name: invoice_balance_conserved_charge_then_payment
        grounds:
          - calculations.invoice_balance
          - entities.Invoice.fields.balance_cents
          - state_machines.ForwardingRequest.REQUESTED_to_COMPLETED
          - entities.Payment.fields.amount_cents
        distinguishing_aspect: "Conserved quantity Invoice.balance_cents: completing a SCAN forwarding posts a 150c FORWARDING charge (balance +150) and an equal manual Payment of 150c (balance -150) leaves balance_cents back at its pre-charge value (3000 -> 3150 -> 3000) — a money invariant distinct from the locker-count quantity."
        test_recipe:
          setup:
            - "ACTIVE rental F18 monthly 3000 1-month, autopay OFF (RENTAL 3000 unpaid, balance 3000). One STORED mail item with a REQUESTED SCAN forwarding (fee 150)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F18", time_zone: "UTC" }
              as: FacilityOperator
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
