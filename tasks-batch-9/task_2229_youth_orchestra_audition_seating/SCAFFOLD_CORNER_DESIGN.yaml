              as: FinanceOfficer
              captures: { acct1_id: "$.data[0].id" }
          trigger:
            - call: "POST /tuition-accounts/${acct1_id}/aid-request"
              payload: { aid_requested_cents: 40000 }
              as: Guardian
              as_user_id: "${m1_id}"
            - call: "POST /tuition-accounts/${acct1_id}/aid-review"
