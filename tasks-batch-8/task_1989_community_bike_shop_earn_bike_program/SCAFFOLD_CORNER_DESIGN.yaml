          trigger:
            - { call: "POST /scrap-tickets/${tk}/pick-up", as: ProgramDirector, captures: { err: $.data.error_id } }
            - { call: "GET /scrap-tickets/statement?month=2026-08", as: ProgramDirector, captures: { tot: $.data.total_payout_cents, cnt: $.data.ticket_count } }
          assert:
            - "second pick-up -> error_id ERR_TICKET_NOT_OPEN"
            - "statement.ticket_count == 1 and total_payout_cents == 30 (no double count)"

