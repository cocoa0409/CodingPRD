# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3439_carpet_tile_take_back_program_product_carbon
#
# Breadth probe over §1.1–§1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# Standard fixture var names: col_id/col_v (collection), lot1..lot6,
# b1/b2 (batches), site1, tb1 (take-back), rep1, cl1, tgt1, ord1/ord2, z1/z2.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: collection_create_applies_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.ProductCollection
          - endpoints."POST /carpetloop/collections"
          - response_envelope
        distinguishing_aspect: "A collection created without claim_intent comes back 201 with claim_intent defaulted to NONE, status ACTIVE, version 1, system id, and created_at stamped from the logical clock — none of status/version/id/created_at are client-settable."
        test_recipe:
          setup: ["Empty database; logical clock pinned at the default 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /carpetloop/collections"
              payload: { name: "Cirrus", pattern_code: "CIR", backing_type: "STANDARD", lifecycle_boundary: "CRADLE_TO_GRAVE" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
          assert:
            - "response status 201 with response_type object; meta.api_request_id and meta.api_request_timestamp present"
            - "ProductCollection.${col_id}.claim_intent == NONE (default applied)"
            - "ProductCollection.${col_id}.status == ACTIVE and version == 1"
            - "created_at == \"2026-09-01T00:00:00Z\" (logical clock stamp) and updated_at == created_at"
            - "id is a server-minted UUID"

      - name: collection_get_round_trips_all_fields
        claim_type: Retrieval
        grounds:
          - entities.ProductCollection
          - endpoints."GET /carpetloop/collections/{collection_id}"
        distinguishing_aspect: "Every configuration field of a collection round-trips through GET unchanged, including an explicitly supplied claim_intent CARBON_NEGATIVE."
        test_recipe:
          setup: ["Logical clock at default; one collection created with all fields supplied."]
          setup_api_calls:
            - *c_clock
            - &c_col_full
              call: "POST /carpetloop/collections"
              payload: { name: "Looplet", pattern_code: "LOP", backing_type: "ADHESIVE_FREE_CAPABLE", lifecycle_boundary: "CRADLE_TO_GRAVE", claim_intent: "CARBON_NEGATIVE" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
          trigger:
            - call: "GET /carpetloop/collections/${col_id}"
              payload: {}
              as: SustainabilityManager
              as_user_id: "sm-carol"
          assert:
            - "response status 200; name == \"Looplet\", pattern_code == \"LOP\", backing_type == ADHESIVE_FREE_CAPABLE"
            - "lifecycle_boundary == CRADLE_TO_GRAVE and claim_intent == CARBON_NEGATIVE"
            - "status == ACTIVE, version == 1"

      - name: batches_list_filters_by_collection_and_paginates
        claim_type: Listing
        grounds:
          - endpoints."GET /carpetloop/batches"
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /carpetloop/batches with collection_id filter and limit=2 returns total_count 3 with has_more true on page 0 and exactly 1 row with has_more false at offset 2 — total_count counts the whole filtered set, and the filter excludes the other collection's batch."
        test_recipe:
          setup: ["Collections A and B; three batches in A (DL-A1..DL-A3), one in B (DL-B1)."]
          setup_api_calls:
            - *c_clock
            - &c_col_a
              call: "POST /carpetloop/collections"
              payload: { name: "Alpha", pattern_code: "ALP", backing_type: "STANDARD", lifecycle_boundary: "CRADLE_TO_GATE", claim_intent: "NONE" }
              as: PlatformAdmin
              captures: { colA: $.data.id }
            - &c_col_b
              call: "POST /carpetloop/collections"
              payload: { name: "Beta", pattern_code: "BET", backing_type: "STANDARD", lifecycle_boundary: "CRADLE_TO_GATE", claim_intent: "NONE" }
              as: PlatformAdmin
              captures: { colB: $.data.id }
            - call: "POST /carpetloop/collections/${colA}/batches"
              payload: { dye_lot_code: "DL-A1", production_date: "2026-09-05T00:00:00Z", produced_m2: 10, mfg_intensity_kgco2e_per_m2: 1.0, delta_e: 0.1 }
              as: PlatformAdmin
            - call: "POST /carpetloop/collections/${colA}/batches"
              payload: { dye_lot_code: "DL-A2", production_date: "2026-09-06T00:00:00Z", produced_m2: 20, mfg_intensity_kgco2e_per_m2: 1.0, delta_e: 0.2 }
              as: PlatformAdmin
            - call: "POST /carpetloop/collections/${colA}/batches"
              payload: { dye_lot_code: "DL-A3", production_date: "2026-09-07T00:00:00Z", produced_m2: 30, mfg_intensity_kgco2e_per_m2: 1.0, delta_e: 0.3 }
              as: PlatformAdmin
            - call: "POST /carpetloop/collections/${colB}/batches"
              payload: { dye_lot_code: "DL-B1", production_date: "2026-09-08T00:00:00Z", produced_m2: 40, mfg_intensity_kgco2e_per_m2: 1.0, delta_e: 0.4 }
              as: PlatformAdmin
          trigger:
            - call: "GET /carpetloop/batches"
              payload: { collection_id: "${colA}", limit: 2, offset: 0 }
              as: Specifier
              as_user_id: "spec-ada"
            - call: "GET /carpetloop/batches"
              payload: { collection_id: "${colA}", limit: 2, offset: 2 }
              as: Specifier
              as_user_id: "spec-ada"
            - call: "GET /carpetloop/batches"
              payload: { collection_id: "${colB}" }
              as: Specifier
              as_user_id: "spec-ada"
          assert:
            - "page 0: 2 rows, total_count == 3, has_more == true"
            - "page 2: 1 row, total_count == 3, has_more == false"
            - "filter by collection B: 1 row (DL-B1), total_count == 1 — cross-collection rows excluded"
            - "omitting limit/offset uses the envelope defaults (limit 10, offset 0)"

      - name: zone_get_with_unknown_id_returns_404
        claim_type: Not Found
        grounds:
          - endpoints."GET /carpetloop/zones/{zone_id}"
          - errors[ERR_ZONE_NOT_FOUND]
        distinguishing_aspect: "GET on a well-formed but nonexistent zone id returns the resource-specific 404 error in the standard error envelope, not a generic 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /carpetloop/zones/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ZONE_NOT_FOUND with http 404"
            - "error envelope: response_type == error and data.message present"

      - name: site_create_missing_required_budget_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.CustomerSite.fields.annual_replacement_budget_cents
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required annual_replacement_budget_cents from site creation fails with ERR_INVALID_REQUEST (400) and persists nothing — required input fields are enforced before any state exists."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /carpetloop/sites"
              payload: { contractor_name: "inst-bob", address: "1 Harbor Way", install_window_start: "2026-09-02T00:00:00Z", install_window_end: "2026-09-03T00:00:00Z", installation_system: "CONVENTIONAL", adhesive_free_certified: false, cert_expires_on: "2027-01-01T00:00:00Z" }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST with http 400"
            - "no site is created (a following GET /carpetloop/sites would be empty — nothing to reference)"

      - name: collection_create_with_invalid_backing_type_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.ProductCollection.fields.backing_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "An enum field rejects a non-member (backing_type MAGNETIC) with ERR_INVALID_REQUEST 400 at creation time."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /carpetloop/collections"
              payload: { name: "Bad", pattern_code: "BAD", backing_type: "MAGNETIC", lifecycle_boundary: "CRADLE_TO_GATE" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST with http 400"

      - name: report_computed_variants_stay_null_until_submit
        claim_type: Computed Fields
        grounds:
          - entities.PCFReport.fields.operational_kgco2e_per_m2
          - entities.PCFReport.fields.lifecycle_kgco2e_per_m2
          - endpoints."POST /carpetloop/pcf-reports"
        distinguishing_aspect: "A freshly created report carries null operational/lifecycle values and null submitted_by — the footprint is computed only at submit, never at create, regardless of what the client might wish."
        test_recipe:
          setup: ["Collection GATE exists (CRADLE_TO_GATE)."]
          setup_api_calls:
            - *c_clock
            - &c_col_gate_none
              call: "POST /carpetloop/collections"
              payload: { name: "Gatehouse", pattern_code: "GAT", backing_type: "STANDARD", lifecycle_boundary: "CRADLE_TO_GATE", claim_intent: "NONE" }
              as: PlatformAdmin
              captures: { col_id: $.data.id, col_v: $.data.version }
          trigger:
            - &c_rep_gate
              call: "POST /carpetloop/pcf-reports"
              payload: { collection_id: "${col_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", boundary: "CRADLE_TO_GATE", expected_collection_version: "${col_v}" }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { rep1: $.data.id }
          assert:
            - "PCFReport.${rep1}.status == DRAFT"
            - "operational_kgco2e_per_m2 is null and lifecycle_kgco2e_per_m2 is null at creation"
            - "submitted_by, verifier_org, verified_by are all null"

      - name: offset_retirement_is_immutable_record_without_version
        claim_type: Immutability
        grounds:
          - entities.OffsetRetirement
          - endpoints."POST /carpetloop/carbon-claims/{id}/offsets"
        distinguishing_aspect: "OffsetRetirement has common_fields false: the creation response carries id and created_at plus retired_at, and no version or updated_at fields exist; there is no update or delete endpoint for the entity."
        test_recipe:
          setup:
            - "Published CRADLE_TO_GATE report (operational 6.400) on collection GAT with batch DL-100 (100 m2, mix 200 kg @0.50 + 200 kg @2.10, intensity 1.2)."
            - "Claim CL-1 CARBON_NEUTRAL volume 50 submitted (IN_REVIEW, required 320.0) so offsets are accepted."
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - &c_lot_net200
              call: "POST /carpetloop/feedstock-lots"
              payload: { supplier_name: "NETCO", source_type: "RECLAIMED_FISHING_NET", quantity_kg: 200, carbon_factor_kgco2e_per_kg: 0.50 }
              as: PlatformAdmin
              captures: { lot1: $.data.id }
            - &c_lot_vir200
              call: "POST /carpetloop/feedstock-lots"
              payload: { supplier_name: "POLYCO", source_type: "VIRGIN", quantity_kg: 200, carbon_factor_kgco2e_per_kg: 2.10 }
              as: PlatformAdmin
              captures: { lot2: $.data.id }
            - &c_qc_lot1
              call: "POST /carpetloop/feedstock-lots/${lot1}/qc"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - &c_qc_lot2
              call: "POST /carpetloop/feedstock-lots/${lot2}/qc"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - &c_batch_b1
              call: "POST /carpetloop/collections/${col_id}/batches"
              payload: { dye_lot_code: "DL-100", production_date: "2026-09-05T00:00:00Z", produced_m2: 100, mfg_intensity_kgco2e_per_m2: 1.2, delta_e: 0.4 }
              as: PlatformAdmin
              captures: { b1: $.data.id }
            - &c_alloc1
              call: "POST /carpetloop/feedstock-lots/${lot1}/allocate"
              payload: { batch_id: "${b1}", quantity_kg: 200 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
            - &c_alloc2
              call: "POST /carpetloop/feedstock-lots/${lot2}/allocate"
              payload: { batch_id: "${b1}", quantity_kg: 200 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
            - &c_rel_b1
              call: "POST /carpetloop/batches/${b1}/release"
              payload: {}
              as: PlatformAdmin
            - *c_rep_gate
            - &c_submit1
              call: "POST /carpetloop/pcf-reports/${rep1}/submit"
              payload: {}
              as: SustainabilityManager
              as_user_id: "sm-carol"
            - &c_assign1
              call: "POST /carpetloop/pcf-reports/${rep1}/verification"
              payload: { action: "ASSIGN", verifier_org: "EcoAssure" }
              as: SustainabilityManager
              as_user_id: "sm-carol"
            - &c_clear1
              call: "POST /carpetloop/pcf-reports/${rep1}/verification"
              payload: { action: "CLEAR" }
              as: Verifier
              as_user_id: "ver-dana"
            - &c_publish1
              call: "POST /carpetloop/pcf-reports/${rep1}/publish"
              payload: {}
              as: SustainabilityManager
              as_user_id: "sm-carol"
            - &c_claim_neutral
              call: "POST /carpetloop/carbon-claims"
              payload: { collection_id: "${col_id}", report_id: "${rep1}", claim_type: "CARBON_NEUTRAL", claimed_volume_m2: 50, boundary: "CRADLE_TO_GATE" }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { cl1: $.data.id }
            - &c_cl_submit
              call: "POST /carpetloop/carbon-claims/${cl1}/submit"
              payload: {}
              as: SustainabilityManager
              as_user_id: "sm-carol"
          trigger:
            - call: "POST /carpetloop/carbon-claims/${cl1}/offsets"
              payload: { registry: "ACR", vintage_year: 2021, quantity_kgco2e: 10 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { off1: $.data.id }
          assert:
            - "response status 201; data carries id and created_at and retired_at"
            - "the response object has no version and no updated_at keys (common_fields false)"
            - "retired_at == \"2026-09-01T00:00:00Z\" (logical clock)"
            - "claim side effect applied: CarbonClaim.${cl1}.retired_kgco2e == 10 and offset_coverage == PARTIAL (10 < 320.0)"

      - name: package_version_increments_and_prior_is_superseded
        claim_type: Computed Fields
        grounds:
          - entities.SpecPackage.fields.package_version
          - state_machines.SpecPackage.ISSUED_to_SUPERSEDED
          - endpoints."POST /carpetloop/spec-packages"
        distinguishing_aspect: "Issuing two packages for the same (architect_firm, collection) pair yields package_version 1 then 2 and flips the first to SUPERSEDED; a different firm starts its own sequence at 1."
        test_recipe:
          setup: ["Published report REP-1 on collection GAT (same fixture chain as the immutability corner)."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_lot_net200
            - *c_lot_vir200
            - *c_qc_lot1
            - *c_qc_lot2
            - *c_batch_b1
            - *c_alloc1
            - *c_alloc2
            - *c_rel_b1
            - *c_rep_gate
            - *c_submit1
            - *c_assign1
            - *c_clear1
            - *c_publish1
            - &c_get_col
              call: "GET /carpetloop/collections/${col_id}"
              payload: {}
              as: PlatformAdmin
              captures: { col_v2: $.data.version }
            - call: "POST /carpetloop/spec-packages"
              payload: { architect_firm: "FIRM-A", collection_id: "${col_id}", report_id: "${rep1}", expected_collection_version: "${col_v2}" }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { pkg1: $.data.id }
            - call: "GET /carpetloop/collections/${col_id}"
              payload: {}
              as: PlatformAdmin
              captures: { col_v3: $.data.version }
            - call: "POST /carpetloop/spec-packages"
              payload: { architect_firm: "FIRM-A", collection_id: "${col_id}", report_id: "${rep1}", expected_collection_version: "${col_v3}" }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { pkg2: $.data.id }
            - call: "GET /carpetloop/collections/${col_id}"
              payload: {}
              as: PlatformAdmin
              captures: { col_v4: $.data.version }
            - call: "POST /carpetloop/spec-packages"
              payload: { architect_firm: "FIRM-B", collection_id: "${col_id}", report_id: "${rep1}", expected_collection_version: "${col_v4}" }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { pkg3: $.data.id }
          trigger:
            - call: "GET /carpetloop/spec-packages/${pkg1}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "SpecPackage.${pkg1}.status == SUPERSEDED and package_version == 1"
            - "SpecPackage.${pkg2}.status == ISSUED and package_version == 2 (next in the FIRM-A x GAT sequence)"
            - "SpecPackage.${pkg3}.status == ISSUED and package_version == 1 (FIRM-B has its own sequence)"

      - name: batch_created_quarantine_with_full_availability_and_empty_mix
        claim_type: Initial State
        grounds:
          - entities.TileBatch
          - state_machines.TileBatch
          - endpoints."POST /carpetloop/collections/{collection_id}/batches"
        distinguishing_aspect: "A new batch starts QUARANTINE with available_m2 == produced_m2, empty feedstock_mix, allocated_mass_kg 0, and null recycled_content_pct / embodied_carbon_kg_per_m2 (computed only once mix exists)."
        test_recipe:
          setup: ["Collection GAT exists."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
          trigger:
            - *c_batch_b1
          assert:
            - "TileBatch.${b1}.status == QUARANTINE and available_m2 == 100"
            - "feedstock_mix == [] and allocated_mass_kg == 0"
            - "recycled_content_pct is null and embodied_carbon_kg_per_m2 is null before any allocation"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: batch_release_from_released_returns_409
        claim_type: Invalid Transitions
        grounds:
          - state_machines.TileBatch.QUARANTINE_to_RELEASED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "RELEASED has no outgoing release edge: repeating the release call on an already-RELEASED batch fails with ERR_INVALID_STATE and changes nothing."
        test_recipe:
          setup: ["Collection GAT; batch DL-100 fully allocated (400 kg == 100 m2 x 4.0) and RELEASED."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_lot_net200
            - *c_lot_vir200
            - *c_qc_lot1
            - *c_qc_lot2
            - *c_batch_b1
            - *c_alloc1
            - *c_alloc2
            - *c_rel_b1
          trigger:
            - call: "POST /carpetloop/batches/${b1}/release"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE with http 409"
            - "TileBatch.${b1}.status remains RELEASED; recycled_content_pct == 50.00 and embodied_carbon_kg_per_m2 == 6.400 unchanged"

      - name: sunset_is_terminal_and_blocks_new_children
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ProductCollection.ACTIVE_to_SUNSET
          - errors[ERR_COLLECTION_SUNSET]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "SUNSET is terminal (a second sunset fails ERR_INVALID_STATE) and downstream creation gates observe it: batch create and report create against the sunset collection both fail ERR_COLLECTION_SUNSET while reads keep working."
        test_recipe:
          setup: ["Collection GAT created ACTIVE."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - call: "POST /carpetloop/collections/${col_id}/sunset"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /carpetloop/collections/${col_id}/sunset"
              payload: {}
              as: PlatformAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /carpetloop/collections/${col_id}/batches"
              payload: { dye_lot_code: "DL-X", production_date: "2026-09-05T00:00:00Z", produced_m2: 10, mfg_intensity_kgco2e_per_m2: 1.0, delta_e: 0.1 }
              as: PlatformAdmin
              captures: { err2: $.data.error_id }
            - call: "GET /carpetloop/collections/${col_id}"
              payload: {}
              as: PlatformAdmin
              captures: { col_vs: $.data.version }
            - call: "POST /carpetloop/pcf-reports"
              payload: { collection_id: "${col_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", boundary: "CRADLE_TO_GATE", expected_collection_version: "${col_vs}" }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { err3: $.data.error_id }
            - call: "GET /carpetloop/collections/${col_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "err1 == ERR_INVALID_STATE (SUNSET is terminal)"
            - "err2 == ERR_COLLECTION_SUNSET and err3 == ERR_COLLECTION_SUNSET (409)"
            - "GET still returns the collection with status == SUNSET — sunset is not deletion"
        # NOTE: the GET re-captures the collection version (2 after the sunset bump)
        # so the OCC check passes and the ERR_COLLECTION_SUNSET state guard is what
        # must surface — priority 6 state guards precede nothing here OCC-wise.

      - name: credited_takeback_is_terminal_for_sort_and_cancel
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.TakeBackRequest
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CREDITED is terminal: a second sort and a late cancel both fail ERR_INVALID_STATE and the stored credit does not move."
        test_recipe:
          setup: ["Collection GAT (claim_intent NONE); site INSTALLED; take-back collected 160 kg then sorted (CREDITED, credit 6000 STANDARD)."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - &c_site1
              call: "POST /carpetloop/sites"
              payload: { contractor_name: "inst-bob", address: "1 Harbor Way", install_window_start: "2026-09-02T00:00:00Z", install_window_end: "2026-09-03T00:00:00Z", installation_system: "CONVENTIONAL", adhesive_free_certified: false, cert_expires_on: "2027-01-01T00:00:00Z", annual_replacement_budget_cents: 1000000 }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { site1: $.data.id }
            - &c_install1
              call: "POST /carpetloop/sites/${site1}/install"
              payload: {}
              as: Installer
              as_user_id: "inst-bob"
            - &c_tb1
              call: "POST /carpetloop/take-back-requests"
              payload: { site_id: "${site1}", collection_id: "${col_id}", condition_grade: "B", declared_area_m2: 40 }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { tb1: $.data.id }
            - &c_sched1
              call: "POST /carpetloop/take-back-requests/${tb1}/schedule"
              payload: { pickup_window_start: "2026-09-12T00:00:00Z", pickup_window_end: "2026-09-13T00:00:00Z" }
              as: Installer
              as_user_id: "inst-bob"
            - &c_clock_sep12
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T06:00:00Z" }
              as: PlatformAdmin
            - &c_collect1
              call: "POST /carpetloop/take-back-requests/${tb1}/collect"
              payload: { collected_kg: 160 }
              as: Installer
              as_user_id: "inst-bob"
            - &c_sort1
              call: "POST /carpetloop/take-back-requests/${tb1}/sort"
              payload: { reuse_kg: 40, depolymerize_kg: 80, downcycle_kg: 40, landfill_kg: 0 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
          trigger:
            - call: "POST /carpetloop/take-back-requests/${tb1}/sort"
