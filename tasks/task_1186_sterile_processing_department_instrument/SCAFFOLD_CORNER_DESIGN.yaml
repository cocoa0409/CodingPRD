      - name: reserved_tray_expired_blocks_case_start_then_sweeps
        claim_type: precondition_enforcement
        grounds:
          - "errors[ERR_RESERVED_TRAY_EXPIRED]"
          - "state_machines.Tray"
          - "state_machines.TrayReservation.RESERVED_to_RELEASED"
        distinguishing_aspect: "Case start observes the reserved tray as stored (target-entity-only sweep): a tray whose expiry passed is not swept during case start, so the start fails with ERR_RESERVED_TRAY_EXPIRED; a subsequent direct read of the tray applies the sweep (tray -> AWAITING_DECONTAMINATION, reservation -> RELEASED, case -> SCHEDULED)."
        test_recipe:
          setup:
            - "Template, technicians A and S, sterilizer; tray te STERILE with sterility_expires_at 2026-05-31T03:00:00Z, reserved for case CX (2026-05-10T09:00-11:00); case TRAYS_RESERVED"
            - "Logical clock advanced to 2026-06-01T00:00:00Z (past the tray expiry)"
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "GEN-01", name: "General", specialty: "GEN", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 10 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { ta: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Sup S", certification_level: 3, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { ts: "$.data.id" } }
            - { call: "POST /spd/sterilizers", payload: { name: "SG", method: "STEAM_GRAVITY", chamber_capacity: 4, cycle_minutes: 60, required_certification_level: 1 }, as: FacilityAdmin, captures: { sg: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "TE" }, as: SpdTechnician, as_user_id: "${ta}", captures: { te: "$.data.id" } }
            - { call: "POST /spd/trays/${te}/decontamination/start", as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/trays/${te}/decontamination/complete", as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/trays/${te}/assembly/start", as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/trays/${te}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${sg}", planned_start_at: "2026-05-01T00:00:00Z" }, as: SpdTechnician, as_user_id: "${ta}", captures: { le: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads/${le}/trays", payload: { tray_id: "${te}" }, as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/sterilization-loads/${le}/start", as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/sterilization-loads/${le}/complete", as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T03:00:00Z" }, as: FacilityAdmin }
            - { call: "GET /spd/biological-indicators?load_id=${le}", as: Any, captures: { be: "$.data[0].id" } }
            - { call: "POST /spd/biological-indicators/${be}/record-result", payload: { result: "NEGATIVE" }, as: QualityAuditor }
            - { call: "POST /spd/sterilization-loads/${le}/release", as: SpdSupervisor, as_user_id: "${ts}" }
            - { call: "POST /spd/or-cases", payload: { case_number: "C-X", surgeon: "Dr X", scheduled_start_at: "2026-05-10T09:00:00Z", scheduled_end_at: "2026-05-10T11:00:00Z", priority: "ELECTIVE" }, as: OrScheduler, captures: { cx: "$.data.id", cx_v: "$.data.version" } }
            - { call: "POST /spd/or-cases/${cx}/reservations", payload: { tray_id: "${te}", expected_or_case_version: "${cx_v}" }, as: OrScheduler, captures: { rx: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: FacilityAdmin }
          trigger:
            - { call: "POST /spd/or-cases/${cx}/start", as: OrScheduler, captures: { err: "$.data.error_id" } }
            - { call: "GET /spd/trays/${te}", as: Any, captures: { tst: "$.data.status" } }
            - { call: "GET /spd/tray-reservations/${rx}", as: Any, captures: { rst: "$.data.status" } }
            - { call: "GET /spd/or-cases/${cx}", as: Any, captures: { cst: "$.data.status" } }
          assert:
            - "err == ERR_RESERVED_TRAY_EXPIRED (reserved tray's stored expiry 2026-05-31T03:00:00Z <= now 2026-06-01T00:00:00Z)"
            - "After the direct tray read, the sweep fired: tst == AWAITING_DECONTAMINATION"
            - "rst == RELEASED and cst == SCHEDULED (0 RESERVED reservations remain)"

      - name: abort_compensates_load_membership
        claim_type: side_effect_execution
        grounds:
          - "state_machines.SterilizationLoad.LOADING_to_ABORTED"
          - "state_machines.Tray.IN_LOAD_to_ASSEMBLED"
        distinguishing_aspect: "Aborting a LOADING load returns both member trays to ASSEMBLED and zeroes tray_count — full compensation of the add-tray actions."
        test_recipe:
          setup: ["template, technician, sterilizer; trays b1, b2 ASSEMBLED and added to load LB (tray_count 2)"]
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "GEN-01", name: "General", specialty: "GEN", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 10 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { ta: "$.data.id" } }
            - { call: "POST /spd/sterilizers", payload: { name: "SG", method: "STEAM_GRAVITY", chamber_capacity: 4, cycle_minutes: 60, required_certification_level: 1 }, as: FacilityAdmin, captures: { sg: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "B1" }, as: SpdTechnician, as_user_id: "${ta}", captures: { b1: "$.data.id" } }
            - { call: "POST /spd/trays/${b1}/decontamination/start", as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/trays/${b1}/decontamination/complete", as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/trays/${b1}/assembly/start", as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/trays/${b1}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "B2" }, as: SpdTechnician, as_user_id: "${ta}", captures: { b2: "$.data.id" } }
            - { call: "POST /spd/trays/${b2}/decontamination/start", as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/trays/${b2}/decontamination/complete", as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/trays/${b2}/assembly/start", as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/trays/${b2}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${sg}", planned_start_at: "2026-05-01T00:00:00Z" }, as: SpdTechnician, as_user_id: "${ta}", captures: { lb: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads/${lb}/trays", payload: { tray_id: "${b1}" }, as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/sterilization-loads/${lb}/trays", payload: { tray_id: "${b2}" }, as: SpdTechnician, as_user_id: "${ta}", captures: { tc: "$.data.tray_count" } }
          trigger:
            - { call: "POST /spd/sterilization-loads/${lb}/abort", as: SpdTechnician, as_user_id: "${ta}", captures: { tc2: "$.data.tray_count", lst: "$.data.status" } }
            - { call: "GET /spd/trays/${b1}", as: Any }
            - { call: "GET /spd/trays/${b2}", as: Any }
          assert:
            - "Before abort: tc == 2"
            - "lst == ABORTED and tc2 == 0"
            - "Tray.${b1} and Tray.${b2} both ASSEMBLED with current_load_id null"

