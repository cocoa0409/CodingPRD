        distinguishing_aspect: "Reschedule returns the NEW booking with rescheduled_from_booking_id pointing at the old one; the old booking is RESCHEDULED; the self-FK reverse list GET /conf/bookings?rescheduled_from_booking_id= finds the successor."
        test_recipe:
