              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/facilities"
              payload: { applicant_id: "${app_id}", site_name: "Plant 9", air_handling_class: "FILTERED_ZONED" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /gfco/products"
              payload: { applicant_id: "${app_id}", facility_id: "${fac_id}", name: "Rice Sandwich Loaf", sku: "RSL-001" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { prod_id: $.data.id, prod_plan: $.data.testing_plan_status, prod_thr: $.data.threshold_ppm }
