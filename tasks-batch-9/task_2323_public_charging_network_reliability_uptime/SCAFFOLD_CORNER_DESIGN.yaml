            - "A complaint over a session 2026-08-01T10:00:00Z .. 2026-08-01T10:30:00Z, 10.000 kWh at 40 cents, charged 1000 cents, no idle fee; TRIAGED and linked to the outage; an ENERGY_PRORATED refund of 600 cents already requested."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
