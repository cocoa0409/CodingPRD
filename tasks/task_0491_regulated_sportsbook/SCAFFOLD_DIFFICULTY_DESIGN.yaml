  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: same_game_parlay_two_legs_same_market_rejected
        grounds:
          - validations[priority=12]
          - entities.BetLeg.fields.selection_id
          - errors[ERR_DUPLICATE_LEG]
        distinguishing_aspect: |
          Interval semantics = same-market correlation collision on the Selection
          resource: a SAME_GAME_PARLAY whose two legs reference two selections of
          the SAME market_id overlap on the correlated-line dimension and are
          rejected with ERR_DUPLICATE_LEG (adjacency on market_id is treated as a
          conflict, not allowed).
        test_recipe:
          setup:
            - "Verified/active Bettor, cash 100000, eligible geo."
            - "One event, one MONEYLINE market with two selections HOME @-150 and AWAY @+130."
          setup_api_calls:
