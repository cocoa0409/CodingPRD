            - { call: "POST /lease-program/lease-agreements", payload: { owner_operator_id: "${op}", truck_id: "${truck}", start_date: "2026-08-03", term_weeks: 52, weekly_payment_cents: 65000, escrow_weekly_contribution_cents: 20000, escrow_cap_cents: 500000, buyout_base_price_cents: 4500000, min_revenue_guarantee_weekly_cents: 150000 }, as: LeaseAdmin, captures: { lease: $.data.id } }
            - { call: "POST /lease-program/lease-agreements/${lease}/activate", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-program/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: LeaseAdmin }
            - { call: "POST /lease-program/settlement-statements", payload: { lease_id: "${lease}", week_start_date: "2026-08-03", gross_revenue_cents: 250000, fuel_gallons: 200, fuel_price_cents_per_gallon: 350, insurance_weekly_cents: 22000, miles_driven: 2500, load_declined_flag: false }, as: SettlementClerk, captures: { st: $.data.id } }
            - { call: "POST /lease-program/_clock/set_current_utc", payload: { to_iso8601: "2027-08-03T00:00:00Z" }, as: LeaseAdmin }
            - { call: "POST /lease-program/lease-agreements/${lease}/complete", payload: {}, as: LeaseAdmin }
          trigger:
            - { call: "POST /lease-program/settlement-statements/${st}/issue", payload: {}, as: SettlementClerk, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_LEASE_NOT_ACTIVE  (issue gated on lease state, pair Settlement->Lease)"
            - "SettlementStatement.${st}.status == DRAFT (complete does not cancel drafts; only terminate does)"
            - "LeaseAgreement.${lease}.status == COMPLETED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: lane_half_open_adjacency_vs_overlap
        grounds:
          - calculations.lane_window_overlap_check
          - state_machines.LaneAssignment.OFFERED_to_ACCEPTED
          - entities.LaneAssignment.fields.end_date
        distinguishing_aspect: |
          Resource = LeaseAgreement's lane calendar, half-open [start_date, end_date)
          semantics: a lane starting exactly when the ACCEPTED lane ends is allowed
          (adjacency), while one overlapping by 16 days is rejected with
          ERR_LANE_WINDOW_OVERLAP. Checked at accept time.
        test_recipe:
          setup:
            - "ACTIVE lease; lane L1 ACCEPTED [2026-08-03, 2026-09-01)"
            - "L2 offered [2026-09-01, 2026-10-01) (adjacent); L3 offered [2026-08-15, 2026-09-10) (overlapping)"
          setup_api_calls:
            - { call: "POST /lease-program/owner-operators", payload: { legal_name: "Pat Owner", cdl_number: "CDL-TO1" }, as: LeaseAdmin, captures: { op: $.data.id } }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "W9", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d1: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d1}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "OPERATING_AUTHORITY", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d2: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d2}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "INSURANCE_CERTIFICATE", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d3: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d3}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/trucks", payload: { vin: "VIN-TO1", year: 2023, make: "Freightliner", model: "Cascadia", odometer_current: 30000, powertrain_warranty_expires_on: "2027-01-01", powertrain_warranty_mileage_limit: 100000 }, as: LeaseAdmin, captures: { truck: $.data.id } }
            - { call: "POST /lease-program/lease-agreements", payload: { owner_operator_id: "${op}", truck_id: "${truck}", start_date: "2026-08-03", term_weeks: 52, weekly_payment_cents: 65000, escrow_weekly_contribution_cents: 20000, escrow_cap_cents: 500000, buyout_base_price_cents: 4500000, min_revenue_guarantee_weekly_cents: 150000 }, as: LeaseAdmin, captures: { lease: $.data.id } }
            - { call: "POST /lease-program/lease-agreements/${lease}/activate", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-program/lane-assignments", payload: { lease_id: "${lease}", origin: "ATL", destination: "DAL", weekly_commitment_cents: 120000, start_date: "2026-08-03", end_date: "2026-09-01" }, as: LeaseAdmin, captures: { l1: $.data.id } }
            - { call: "POST /lease-program/lane-assignments/${l1}/accept", payload: {}, as: Driver, as_user_id: "${op}" }
            - { call: "POST /lease-program/lane-assignments", payload: { lease_id: "${lease}", origin: "DAL", destination: "HOU", weekly_commitment_cents: 110000, start_date: "2026-09-01", end_date: "2026-10-01" }, as: LeaseAdmin, captures: { l2: $.data.id } }
            - { call: "POST /lease-program/lane-assignments", payload: { lease_id: "${lease}", origin: "CHI", destination: "MSP", weekly_commitment_cents: 110000, start_date: "2026-08-15", end_date: "2026-09-10" }, as: LeaseAdmin, captures: { l3: $.data.id } }
          trigger:
            - { call: "POST /lease-program/lane-assignments/${l2}/accept", payload: {}, as: Driver, as_user_id: "${op}" }
            - { call: "POST /lease-program/lane-assignments/${l3}/accept", payload: {}, as: Driver, as_user_id: "${op}", captures: { err: $.data.error_id } }
          assert:
            - "LaneAssignment.${l2}.status == ACCEPTED  (adjacency allowed: 2026-09-01 == L1 end_date, half-open)"
            - "captured err == ERR_LANE_WINDOW_OVERLAP  (L3 [08-15, 09-10) intersects both ACCEPTED windows)"
            - "LaneAssignment.${l3}.status == OFFERED (unchanged)"

      - name: bay_two_hour_buffer_semantics
        grounds:
          - calculations.bay_window_conflict_check
          - state_machines.MaintenanceWorkOrder
          - entities.MaintenanceWorkOrder.fields.scheduled_start
        distinguishing_aspect: |
          Resource = ServiceBay, buffer semantics: bookings must keep a gap >= 2 hours
          between windows (a gap of exactly 2h is allowed, 30 minutes is rejected with
          ERR_BAY_WINDOW_CONFLICT). Different interval semantics (mandatory buffer vs
          plain half-open adjacency) and a different resource than the lane calendar.
        test_recipe:
          setup:
            - "ACTIVE lease; bay B registered"
            - "WO1 booked [2026-08-04T08:00Z, 2026-08-04T10:00Z); WO2 booked [2026-08-04T12:00Z, 2026-08-04T13:00Z) (gap exactly 2h)"
