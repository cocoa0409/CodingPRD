            - "the survey is still SUBMITTED with condition_index == null: the surveyor's finalize attempt was refused on the role, before any state or photo check ran"
            - "the funding pool read refusal shows that the finance endpoints are also read-restricted, to FinanceOfficer, PublicArtManager and ChiefConservator only"
            - "the seventh and eighth trigger calls both return 201: POST /public-art/maintenance-protocols is a shared operation of ChiefConservator and PublicArtManager"
            - "GET /public-art/maintenance-protocols reports total_count 2 and GET /public-art/artworks reports total_count 1"

      - name: an_artist_representative_cannot_answer_another_artists_consultation
        claim_type: resource_ownership
        grounds:
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles.ArtistRepresentative
        distinguishing_aspect: "ArtistRepresentative is an entity-backed role, so holding the role is not enough: the acting X-User-ID must equal the consultation's own artist_id, which makes 403 ERR_NOT_RESOURCE_OWNER distinct from the flat 403 ERR_UNAUTHORIZED a wrong role would get."
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z; two artists, one artwork by the first artist and a PENDING consultation addressed to that first artist"
