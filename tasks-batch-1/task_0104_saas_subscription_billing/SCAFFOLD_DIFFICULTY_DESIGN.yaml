  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: price_schedule_half_open_positive_overlap_rejected
        grounds:
          - validations[priority=15]
          - entities.PlanPriceSchedule.fields.effective_from
          - entities.PlanPriceSchedule.fields.effective_to
          - errors[ERR_PRICE_SCHEDULE_OVERLAP]
          - endpoints["POST /plans/{id}/price-schedules"]
        distinguishing_aspect: |
          Half-open interval semantics on PlanPriceSchedule: a window [2026-03-01, 2026-06-01) that
          overlaps the existing [2026-01-01, 2026-04-01) by positive measure is rejected, while a
          touching window would be allowed (see corner test) — adjacency-permissive geometry.
        test_recipe:
          setup:
            - "A plan with one price schedule [2026-01-01, 2026-04-01)"
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 0 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/price-schedules"
              payload: { monthly_fee_cents: 3000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-04-01T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /plans/${plan_id}/price-schedules"
              payload: { monthly_fee_cents: 3500, effective_from: "2026-03-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_PRICE_SCHEDULE_OVERLAP"

      - name: pause_window_buffer_gap_conflict_rejected
        grounds:
          - validations[priority=16]
          - entities.SubscriptionPauseWindow.fields.pause_from
          - entities.SubscriptionPauseWindow.fields.pause_to
          - errors[ERR_PAUSE_WINDOW_CONFLICT]
          - endpoints["POST /accounts/{id}/subscriptions/{sid}/pause-windows"]
        distinguishing_aspect: |
          Different interval geometry on a different resource: SubscriptionPauseWindow uses a 7-day
          BUFFER gap, so a non-overlapping window [2026-06-12, 2026-06-15) only 2 days after the
          existing [2026-06-01, 2026-06-10) is still rejected — buffered, not adjacency-permissive.
        test_recipe:
          setup:
            - "Clock 2026-06-01; US-CA; BASIC plan trial_days 0; account with an ACTIVE subscription"
            - "An existing SCHEDULED pause window [2026-06-01, 2026-06-10)"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, included_usage_units: 1000, overage_tiers: [{ up_to_units: null, rate_cents_per_unit: 1 }], trial_days: 0 }
              as: BillingAdmin
              captures: { basic_plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "pw@x.com", company_name: "PwCo", region_code: "US-CA", payment_method_ok: true }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { plan_id: "${basic_plan_id}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/pause-windows"
              payload: { pause_from: "2026-06-01T00:00:00Z", pause_to: "2026-06-10T00:00:00Z" }
              as: AccountOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /accounts/${acct_id}/subscriptions/${sub_id}/pause-windows"
              payload: { pause_from: "2026-06-12T00:00:00Z", pause_to: "2026-06-15T00:00:00Z" }
