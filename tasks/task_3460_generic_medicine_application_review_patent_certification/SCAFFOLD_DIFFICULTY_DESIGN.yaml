              captures: { award_status: $.data.status, award_reason: $.data.forfeiture_reason }
          assert:
            - "deficiency_response_due_date == \"2027-11-01\" (issued 2026-11-01 + 12 months)"
            - "hop 1: ReviewCycle.${cyc_id}.status == LAPSED after the clock passes the due date with no response"
            - "hop 2: GenericApplication.${app_id}.status == LAPSED"
            - "hop 3: ExclusivityAward.${award_id}.status == FORFEITED with forfeiture_reason == APPLICATION_LAPSED"
            - "the lapse, not the 30-month TA-failure clock (2029-03-01), caused the forfeiture — the observed date 2027-11-02 precedes it"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_state_error_beats_nce_temporal_error
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors.ERR_INVALID_STATE
          - errors.ERR_NCE_SUBMISSION_BARRED
        distinguishing_aspect: |
          Error-category pair (state, business_temporal): a submit on a
          WITHDRAWN application that would ALSO violate the NCE bar must return
          the state error ERR_INVALID_STATE, not ERR_NCE_SUBMISSION_BARRED —
          the sibling instance exercises the (business_safety,
          business_constraint) pair instead.
        test_recipe:
          setup:
            - "Clock default 2026-09-01. NCE reference product approved 2025-06-15 (48-month P4 window opens 2029-06-15, so the NCE bar is active) with no listed patents; one application created and then withdrawn from DRAFT."
          setup_api_calls:
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "Conflict Generics", contact_email: "reg@cf.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Newentitex", active_ingredient: "newentitexol", strength: "80 mg", dosage_form: "TABLET", rld_approval_date: "2025-06-15", is_new_chemical_entity: true, indication_codes: ["IND-HTN"], patent_owner_user_id: "innovator-ops-10" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
            - call: "POST /generic-drug-review/applications"
              payload: { reference_product_id: "${rld_id}", applicant_id: "${ac_id}", review_priority: "STANDARD", labeling_mode: "FULL", carved_indication_codes: [] }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { app_id: $.data.id }
            - call: "POST /generic-drug-review/applications/${app_id}/withdraw"
              payload: {}
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
          trigger:
            - call: "POST /generic-drug-review/applications/${app_id}/submit"
              payload: {}
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and data.error_id == ERR_INVALID_STATE (application is WITHDRAWN, not DRAFT)"
            - "the NCE-bar error ERR_NCE_SUBMISSION_BARRED is NOT returned even though 2026-09-01 < 2029-06-15 also violates priority 11 — state (priority 7) wins over business_temporal (priority 11)"

      - name: approval_facility_safety_beats_carveout_constraint
        grounds:
          - validations[priority=9]
          - validations[priority=14]
          - errors.ERR_FACILITY_CLEARANCE_FAILED
          - errors.ERR_LABEL_CARVE_OUT_INCOMPLETE
        distinguishing_aspect: |
          Error-category pair (business_safety, business_constraint): an
          approval decision with a FAILED latest facility inspection AND a
          stale carve-out set (a protection registered after submission) must
          return ERR_FACILITY_CLEARANCE_FAILED, not
          ERR_LABEL_CARVE_OUT_INCOMPLETE — a different pair than the sibling's
          (state, business_temporal).
        test_recipe:
          setup:
            - "Clock default 2026-09-01. Non-NCE RLD with indication_codes [IND-A, IND-B] and no protections at application creation or submit; application with ACCEPTED BE study, no patents to certify; submitted. Then registry drift: ProgramAdmin registers an ACTIVE ProtectedIndication for IND-A (2026-01-01 .. 2028-01-01), and the application's only inspection is recorded FAILED."
          setup_api_calls:
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "Drift Generics", contact_email: "reg@dg.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Driftex", active_ingredient: "driftexol", strength: "30 mg", dosage_form: "TABLET", rld_approval_date: "2011-01-20", is_new_chemical_entity: false, indication_codes: ["IND-A", "IND-B"], patent_owner_user_id: "innovator-ops-11" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
            - call: "POST /generic-drug-review/applications"
              payload: { reference_product_id: "${rld_id}", applicant_id: "${ac_id}", review_priority: "STANDARD", labeling_mode: "FULL", carved_indication_codes: [] }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { app_id: $.data.id }
            - call: "POST /generic-drug-review/applications/${app_id}/bioequivalence-studies"
              payload: { study_type: "FASTING", analyte: "driftexol", auc_ratio_pct: 100.0, auc_ci_low_pct: 92.0, auc_ci_high_pct: 108.0, cmax_ratio_pct: 99.0, cmax_ci_low_pct: 90.0, cmax_ci_high_pct: 110.0 }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
            - call: "POST /generic-drug-review/manufacturing-facilities"
              payload: { applicant_id: "${ac_id}", facility_name: "DG Plant", fei_number: "FEI-DG-1", country_code: "US" }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /generic-drug-review/facility-inspections"
              payload: { facility_id: "${fac_id}", application_id: "${app_id}", scheduled_start_date: "2026-09-05", scheduled_end_date: "2026-09-07" }
              as: RegulatoryReviewer
              captures: { insp_id: $.data.id }
            - call: "POST /generic-drug-review/applications/${app_id}/submit"
              payload: {}
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
            - call: "POST /generic-drug-review/reference-products/${rld_id}/protected-indications"
              payload: { indication_code: "IND-A", effective_from: "2026-01-01", protected_until: "2028-01-01" }
              as: ProgramAdmin
            - call: "POST /generic-drug-review/facility-inspections/${insp_id}/record-outcome"
              payload: { outcome: "FAILED" }
              as: FacilityInspector
          trigger:
            - call: "POST /generic-drug-review/applications/${app_id}/approval-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and data.error_id == ERR_FACILITY_CLEARANCE_FAILED (latest inspection outcome is FAILED)"
            - "ERR_LABEL_CARVE_OUT_INCOMPLETE is NOT returned even though ACTIVE protection IND-A is missing from carved_indication_codes — business_safety (priority 9) wins over business_constraint (priority 14)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: be_ci_upper_bound_inclusive_boundary
        grounds:
          - calculations.be_adequacy_determination
          - entities.BioequivalenceStudy.fields.is_adequate
        distinguishing_aspect: |
          Metric: CI percentage on the bioequivalence endpoint — a rounded
          upper bound of exactly 125.00 passes (inclusive) while 125.01 fails;
          the sibling boundary is a calendar date on the submit endpoint.
        test_recipe:
          setup:
            - "Clock default 2026-09-01. Applicant, non-NCE RLD with no patents, DRAFT application."
          setup_api_calls:
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "Boundary Bio", contact_email: "reg@bb.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Boundex", active_ingredient: "boundexol", strength: "2 mg", dosage_form: "TABLET", rld_approval_date: "2010-05-05", is_new_chemical_entity: false, indication_codes: ["IND-HTN"], patent_owner_user_id: "innovator-ops-12" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
            - call: "POST /generic-drug-review/applications"
              payload: { reference_product_id: "${rld_id}", applicant_id: "${ac_id}", review_priority: "STANDARD", labeling_mode: "FULL", carved_indication_codes: [] }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /generic-drug-review/applications/${app_id}/bioequivalence-studies"
              payload: { study_type: "FASTING", analyte: "boundexol", auc_ratio_pct: 100.0, auc_ci_low_pct: 80.0, auc_ci_high_pct: 125.0, cmax_ratio_pct: 99.0, cmax_ci_low_pct: 90.0, cmax_ci_high_pct: 110.0 }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { st_edge_ok: $.data.id, st_edge_ok_status: $.data.status }
            - call: "POST /generic-drug-review/applications/${app_id}/bioequivalence-studies"
              payload: { study_type: "FED", analyte: "boundexol", auc_ratio_pct: 100.5, auc_ci_low_pct: 82.0, auc_ci_high_pct: 125.01, cmax_ratio_pct: 99.0, cmax_ci_low_pct: 90.0, cmax_ci_high_pct: 110.0 }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { st_edge_fail: $.data.id, st_edge_fail_status: $.data.status }
          assert:
            - "BioequivalenceStudy.${st_edge_ok}.status == ACCEPTED: both bounds exactly at 80.00 and 125.00 are inclusive"
            - "BioequivalenceStudy.${st_edge_fail}.status == DEFICIENT: 125.01 > 125.00 by one hundredth of a percent"

      - name: nce_p4_bar_exact_four_year_date
        grounds:
          - calculations.nce_submission_bar
          - validations[priority=11]
        distinguishing_aspect: |
          Metric: calendar date on the submit endpoint (not a percentage on
          the BE endpoint): submission exactly 48 months after an NCE
          product's approval is allowed when a P4 certification is present;
          one day earlier is barred.
        test_recipe:
          setup:
            - "Clock default 2026-09-01. NCE reference product approved 2022-12-10 with one LISTED patent expiring 2030-01-01; application carries a PARAGRAPH_IV_CHALLENGE certification and an ACCEPTED BE study. The 48-month boundary is 2026-12-10."
          setup_api_calls:
            - call: "POST /generic-drug-review/applicant-companies"
              payload: { legal_name: "Dateline Generics", contact_email: "reg@dl.example", headquarters_country: "US" }
              as: ProgramAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /generic-drug-review/reference-products"
              payload: { brand_name: "Ncebrand", active_ingredient: "ncebrandle", strength: "120 mg", dosage_form: "INJECTION", rld_approval_date: "2022-12-10", is_new_chemical_entity: true, indication_codes: ["IND-ONC"], patent_owner_user_id: "innovator-ops-13" }
              as: ProgramAdmin
              captures: { rld_id: $.data.id }
            - call: "POST /generic-drug-review/reference-products/${rld_id}/listed-patents"
              payload: { patent_number: "US9500006", patent_type: "DRUG_SUBSTANCE", expiry_date: "2030-01-01" }
              as: InnovatorSponsor
              as_user_id: "innovator-ops-13"
              captures: { pat_id: $.data.id }
            - call: "POST /generic-drug-review/applications"
              payload: { reference_product_id: "${rld_id}", applicant_id: "${ac_id}", review_priority: "STANDARD", labeling_mode: "FULL", carved_indication_codes: [] }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
            - call: "POST /generic-drug-review/applications/${app_id}/bioequivalence-studies"
              payload: { study_type: "FASTING", analyte: "ncebrandle", auc_ratio_pct: 100.0, auc_ci_low_pct: 92.0, auc_ci_high_pct: 108.0, cmax_ratio_pct: 99.0, cmax_ci_low_pct: 90.0, cmax_ci_high_pct: 110.0 }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
            - call: "POST /generic-drug-review/applications/${app_id}/patent-certifications"
              payload: { patent_id: "${pat_id}", certification_type: "PARAGRAPH_IV_CHALLENGE", expected_application_version: "${app_v0}" }
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-09T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /generic-drug-review/applications/${app_id}/submit"
              payload: {}
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /generic-drug-review/applications/${app_id}/submit"
              payload: {}
              as: ApplicantSponsor
              as_user_id: "${ac_id}"
              captures: { status_after: $.data.status, received: $.data.received_date }
          assert:
            - "at 2026-12-09 (one day before the 48-month mark) submit returns 422 with data.error_id == ERR_NCE_SUBMISSION_BARRED"
            - "at 2026-12-10 (exactly rld_approval_date + 48 months) submit succeeds: status == RECEIVED and received_date == \"2026-12-10\""
            - "the boundary is inclusive and day-precise; the P4 certification is what unlocks the [48, 60) month window"

