  - section: endpoints
    instances:
      - name: growers_list_pagination_fields
        claim_type: listing
        grounds:
          - "endpoints: GET /agronomy/growers"
          - response_envelope.pagination_fields
        distinguishing_aspect: "Pagination contract: limit=2 over 3 growers returns 2 items with has_more true and total_count 3; offset=2 returns the last item with has_more false."
        test_recipe:
          setup: ["three growers created"]
          setup_api_calls:
            - call: "POST /agronomy/growers"
              payload: { legal_name: "Page Farm 1", credit_limit_cents: 100000 }
              as: CreditManager
            - call: "POST /agronomy/growers"
              payload: { legal_name: "Page Farm 2", credit_limit_cents: 100000 }
              as: CreditManager
            - call: "POST /agronomy/growers"
              payload: { legal_name: "Page Farm 3", credit_limit_cents: 100000 }
              as: CreditManager
          trigger:
            - call: "GET /agronomy/growers"
              payload: { limit: 2, offset: 0 }
              as: CreditManager
            - call: "GET /agronomy/growers"
              payload: { limit: 2, offset: 2 }
              as: CreditManager
          assert:
            - "page 1: len(data) == 2, total_count == 3, has_more == true"
            - "page 2: len(data) == 1, total_count == 3, has_more == false"

      - name: inventory_lots_filtered_by_product
        claim_type: listing
        grounds:
          - "endpoints: GET /agronomy/inventory-lots"
          - entities.InventoryLot.fields.product_id
        distinguishing_aspect: "The product_id filter narrows the lot list to exactly the requested product's lots (FK reverse-reachability via filtered list)."
        test_recipe:
          setup: ["products UREA and MOP; storage permit ACTIVE; one lot per product"]
          setup_api_calls:
            - call: "POST /agronomy/products"
              payload: { name: "UREA 46-0-0", analysis_n_pct: 46, analysis_p2o5_pct: 0, analysis_k2o_pct: 0, form: "DRY" }
              as: BranchAdmin
              captures: { p_urea: $.data.id }
            - call: "POST /agronomy/products"
              payload: { name: "MOP 0-0-60", analysis_n_pct: 0, analysis_p2o5_pct: 0, analysis_k2o_pct: 60, form: "DRY" }
              as: BranchAdmin
              captures: { p_mop: $.data.id }
            - call: "POST /agronomy/environmental-permits"
              payload: { permit_type: "FERTILIZER_STORAGE", site_code: "SITE-1", setback_ft: 200, max_storage_tons: 1000 }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
