              as: Director
              captures: { t_id: $.data.id }
            - call: "POST /tournaments/${t_id}/open-registration"
              payload: {}
              as: Director
            - call: "POST /registrations"
              payload: { tournament_id: "${t_id}", player_id: "${p1}" }
              as: Player
              as_user_id: "${p1}"
              captures: { r1: $.data.id }
            - call: "POST /registrations"
              payload: { tournament_id: "${t_id}", player_id: "${p2}" }
              as: Player
              as_user_id: "${p2}"
              captures: { r2: $.data.id }
            - call: "POST /tournaments/${t_id}/close-registration"
              payload: {}
              as: Director
            - call: "POST /registrations/${r1}/check-in"
              payload: {}
              as: Player
              as_user_id: "${p1}"
            - call: "POST /registrations/${r2}/check-in"
              payload: {}
              as: Player
              as_user_id: "${p2}"
            - call: "POST /tournaments/${t_id}/generate-bracket"
              payload: {}
              as: Director
            - call: "POST /tournaments/${t_id}/start"
              payload: {}
              as: Director
            - call: "GET /tournaments/${t_id}/matches"
              payload: {}
              as: Public
              captures: { m_id: "$.data[0].id" }
            - call: "POST /matches/${m_id}/schedule"
              payload: { station_id: "${st_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-01T11:00:00Z" }
              as: Referee
            - call: "POST /matches/${m_id}/report"
              payload: { home_score: 2, away_score: 0 }
              as: Player
              as_user_id: "${p1}"
              captures: { m_ver: $.data.version }
            - call: "POST /matches/${m_id}/confirm"
              payload: { expected_match_version: "${m_ver}" }
              as: Referee
              as_user_id: "ref-1"
            - call: "GET /tournaments/${t_id}"
              payload: {}
              as: Director
              captures: { t_ver: $.data.version }
          trigger:
            - call: "POST /tournaments/${t_id}/complete"
              payload: { expected_tournament_version: "${t_ver}" }
              as: Director
          assert:
            - "FINAL Payout placement==1 gross_amount_cents == 166 (167 minus the 1-cent remainder pushed to first)."
            - "FINAL Payout placement==2 gross_amount_cents == 100."
            - "FINAL Payout placement==3 gross_amount_cents == 67; sum of FINAL gross == 333 == prize_pool_cents."

      - name: standings_gamediff_multiinput_sort
        grounds:
          - calculations.standings_ranking
          - entities.Match.fields.home_score
          - entities.Match.fields.away_score
          - entities.Registration.fields.seed
        distinguishing_aspect: "Mode (a) non-linear multi-input ordering: the GAME_DIFF ranking key is the lexicographic tuple (match_points DESC, game_diff DESC, seed ASC) over 3 independent inputs; a cyclic 2-1 result set leaves all three tied on match_points AND game_diff, so the ordering resolves only at the third input (seed) — a nested lexicographic sort distinct from the payout rounding mode."
        test_recipe:
          setup:
            - "3-player ROUND_ROBIN, tiebreak_method=GAME_DIFF; ratings A 1500 (seed1), B 1400 (seed2), C 1000 (seed3); cyclic results A beats B 2-1, B beats C 2-1, C beats A 2-1, so every player is 1W1L with match_points==3 and game_diff==0; only seed can order them."
