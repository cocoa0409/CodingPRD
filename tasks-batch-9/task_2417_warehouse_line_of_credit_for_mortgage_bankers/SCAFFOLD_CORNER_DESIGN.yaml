            - "CurePayment.${cpf_id}.applied_to_principal_cents == 50000000"
            - "CurePayment.${cpf_id}.principal_allocation has exactly 1 element: {${a1_id}: 50000000} — no leftover cents exist when the covered set is a singleton"
            - "GET /advances/${a3b_id}/ledger-entries returns total_count == 0"
            - "Advance.${a3b_id}.outstanding_balance_cents == 0 and funding_status == REQUESTED"
            - "Advance.${a1_id}.outstanding_balance_cents == 1910000000"
            - "MarginCall.${mcf2_id}.cured_amount_cents == 50000000 and status == PARTIALLY_CURED"

