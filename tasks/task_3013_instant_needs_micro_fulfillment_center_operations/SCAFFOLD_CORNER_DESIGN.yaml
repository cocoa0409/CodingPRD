  # ===========================================================================
  - section: endpoints
    instances:

      - name: dispatch_selector_ranks_by_run_size_then_created_at
        claim_type: conditional_action
        grounds:
          - state_machines.DeliveryBag.UNASSIGNED_to_ASSIGNED
          - complexity_profile.complexity_layers
        distinguishing_aspect: "Selector policy end-to-end: omitting driver_id assigns the AVAILABLE driver with the smallest current run; ties break by Driver.created_at ASC; a driver at max_run_orders is excluded; with no eligible driver the assign fails 409 ERR_NO_DRIVER_AVAILABLE."
        test_recipe:
          setup: ["Logical clock 2026-09-10T14:00:00Z. SITE-A; SKU-CHIPS stocked; customer; Pat/Sam; drivers D-OLD (run cap 2, created first) and D-NEW (run cap 2); three orders sealed across two batches with three bags: bag1 assigned (goes to D-OLD, run 1), bag2 assigned (D-OLD and D-NEW tie at run... D-OLD has 1, D-NEW 0 -> D-NEW, run 1), bag3 pending with both at run 1 -> tie -> D-OLD by created_at."]
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 3, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-CHIPS", name: "Chips", price_cents: 500, product_class: "STANDARD" }
              as: SiteOps
              captures: { prod_chips: $.data.id }
            - call: "POST /mfc/inventory-balances"
              payload: { site_id: "${site_id}", product_id: "${prod_chips}", min_par_level: 0 }
              as: SiteOps
              captures: { bal_chips: $.data.id }
            - call: "POST /mfc/inventory-balances/${bal_chips}/adjustments"
              payload: { kind: "RECEIPT", qty: 50, reason: "opening" }
              as: SiteOps
            - call: "POST /mfc/customers"
              payload: { email: "ada@example.com", full_name: "Ada Adult", date_of_birth: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /mfc/pickers"
              payload: { site_id: "${site_id}", name: "Pat Picker" }
              as: SiteOps
              captures: { picker_1: $.data.id }
            - call: "POST /mfc/pickers"
              payload: { site_id: "${site_id}", name: "Sam Sealer" }
              as: SiteOps
              captures: { picker_2: $.data.id }
            - call: "POST /mfc/drivers"
              payload: { site_id: "${site_id}", name: "D-OLD", max_run_orders: 2 }
              as: SiteOps
              captures: { d_old: $.data.id }
            - call: "POST /mfc/drivers"
              payload: { site_id: "${site_id}", name: "D-NEW", max_run_orders: 2 }
              as: SiteOps
              captures: { d_new: $.data.id }
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_chips}", qty: 1 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o1: $.data.id }
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_chips}", qty: 1 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_id}"
