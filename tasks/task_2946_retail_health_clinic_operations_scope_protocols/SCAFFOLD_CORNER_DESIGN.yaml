      - name: corner_float_coverage_selection_prefers_the_home_site_clinician
        claim_type: correct_result
        grounds:
          - calculations.float_coverage_selection
          - endpoints[POST /clinics/{clinicId}/float-coverages]
          - state_machines.Clinic.CLOSED_to_OPEN
        distinguishing_aspect: "The ranking's first key is the home-site flag, so the clinic's own float-eligible clinician wins over an equally idle float-eligible clinician from another CA site, and the FLOAT assignment inherits exactly the cancelled assignment's [starts_at, ends_at) interval — reopening the clinic."
        test_recipe:
          setup:
            - "CA StateRule exists; two CA clinics: the covered site (min_clinicians_required 1) and a second site."
            - "Three clinicians share one supervising physician: the PRIMARY at the covered site, a float-eligible clinician whose home_clinic is the covered site, and a float-eligible clinician whose home_clinic is the second site. Neither float candidate holds any assignment."
            - "The PRIMARY assignment [00:00, 23:00) is ACTIVE and then cancelled, so the clinic is CLOSED with on_duty_clinician_count 0."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 40, review_deadline_hours: 72, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: false, max_supervised_clinicians_per_physician: 3 }
              as: ClinicAdmin
            - call: "POST /clinics"
              payload: { name: "CA Store 49 Covered", state_code: "CA", min_clinicians_required: 1, appointment_slots_per_hour: 2, walk_in_queue_capacity: 5 }
              as: ClinicAdmin
              captures: { c49_id: $.data.id }
            - call: "POST /clinics"
              payload: { name: "CA Store 49 Neighbour", state_code: "CA", min_clinicians_required: 1, appointment_slots_per_hour: 2, walk_in_queue_capacity: 5 }
              as: ClinicAdmin
              captures: { c49b_id: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Quill", licensed_state_codes: ["CA"], max_supervised_clinicians: 3 }
              as: ClinicAdmin
              captures: { p49_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP Primary Quill", credential: "NP", license_state_code: "CA", home_clinic_id: "${c49_id}", supervising_physician_id: "${p49_id}" }
              as: ClinicAdmin
              captures: { cl49_primary_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP Home Float", credential: "NP", license_state_code: "CA", home_clinic_id: "${c49_id}", supervising_physician_id: "${p49_id}", float_eligible: true }
              as: ClinicAdmin
              captures: { cl49_home_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP Away Float", credential: "NP", license_state_code: "CA", home_clinic_id: "${c49b_id}", supervising_physician_id: "${p49_id}", float_eligible: true }
              as: ClinicAdmin
              captures: { cl49_away_id: $.data.id }
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${c49_id}", clinician_id: "${cl49_primary_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T23:00:00Z", pinned_supervising_physician_id: "${p49_id}" }
              as: ClinicAdmin
              captures: { sa49_id: $.data.id, sa49_status: $.data.status }
            - call: "POST /staffing-assignments/${sa49_id}/cancel"
              payload: { cancel_reason: "Called out sick" }
              as: ClinicAdmin
              captures: { sa49_cancelled_status: $.data.status }
            - call: "GET /clinics/${c49_id}"
              payload: {}
              as: ClinicAdmin
              captures: { c49_version: $.data.version, c49_posture_before: $.data.open_status }
          trigger:
            - call: "POST /clinics/${c49_id}/float-coverages"
              payload: { covers_assignment_id: "${sa49_id}", expected_clinic_version: "${c49_version}", pinned_supervising_physician_id: "${p49_id}" }
              as: ClinicAdmin
              captures: { float_id: $.data.id, float_clinician: $.data.clinician_id, float_role: $.data.role_kind, float_status: $.data.status, float_starts: $.data.starts_at, float_ends: $.data.ends_at }
            - call: "GET /clinics/${c49_id}"
              payload: {}
              as: ClinicAdmin
              captures: { c49_posture_after: $.data.open_status, c49_headcount_after: $.data.on_duty_clinician_count }
          assert:
            - "${sa49_status} == ACTIVE and ${sa49_cancelled_status} == CANCELLED and ${c49_posture_before} == CLOSED"
            - "${float_clinician} == ${cl49_home_id}   # home-site flag 0 beats the neighbour site's equally idle candidate"
            - "${float_clinician} != ${cl49_away_id}"
            - "${float_role} == FLOAT and ${float_status} == ACTIVE"
            - "${float_starts} == 2026-08-01T00:00:00Z and ${float_ends} == 2026-08-01T23:00:00Z   # the covered interval, unchanged"
            - "${c49_posture_after} == OPEN and ${c49_headcount_after} == 1"
            - "Clinician.${cl49_home_id}.active_assignment_count == 1 and Clinician.${cl49_away_id}.active_assignment_count == 0"
            - "Physician.${p49_id}.current_supervised_count == 1   # only the float assignment is SCHEDULED/ACTIVE now"

