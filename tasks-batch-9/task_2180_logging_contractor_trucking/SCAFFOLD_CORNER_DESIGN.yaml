        claim_type: conditional_action
        grounds:
          - endpoints[PATCH /mill-contracts/{id}]
          - state_machines.MillContract.OPEN_to_SUSPENDED
          - state_machines.MillContract.SUSPENDED_to_OPEN
          - errors[ERR_INVALID_MILL_CONTRACT_STATE]
          - errors[ERR_VALIDATION]
