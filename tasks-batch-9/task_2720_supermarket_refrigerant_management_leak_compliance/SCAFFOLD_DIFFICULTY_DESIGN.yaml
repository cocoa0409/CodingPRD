      - name: retrofit_completion_cascades_deescalation_down_to_penalty_reprice
        grounds:
          - state_machines.RetrofitPlan.IN_PROGRESS_to_COMPLETED
          - state_machines.RefrigerantSystem.RETROFIT_MANDATED_to_COMPLIANT
          - state_machines.LeakEvent.RETROFIT_MANDATED_to_VERIFIED_CLOSED
          - calculations.store_compliance_posture
          - calculations.inspection_penalty_exposure
        distinguishing_aspect: |
          A de-escalating chain fired by a completely different transition
          (RetrofitPlan.IN_PROGRESS_to_COMPLETED rather than a verification
          test), and the links run the other way: the plan completion swaps the
          system's refrigerant_type_id and clears its RETROFIT_MANDATED state
          (link 1), which is the only reason the mandated LeakEvent may close
          (link 2), which is the only reason the store drops to COMPLIANT
          (link 3), which is the only reason the OPEN inspection is re-priced
