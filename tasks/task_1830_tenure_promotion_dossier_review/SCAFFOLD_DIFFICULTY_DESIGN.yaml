  - rule_id: transitive_cascade
    instances:
      - name: appeal_remand_four_entity_cascade
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_REMANDED
          - state_machines.TenureCase.NOTIFIED_to_DEPT_COMMITTEE
          - state_machines.ProvostDecision.RECORDED_to_VOIDED
          - state_machines.Candidate.NOT_RENEWED_to_ACTIVE
        distinguishing_aspect: |
          Depth-3 chain from ONE trigger (appeal resolve): Appeal -> REMANDED
          causes TenureCase NOTIFIED -> DEPT_COMMITTEE (hop 1); the case remand
          causes ProvostDecision RECORDED -> VOIDED and creates a fresh
          DEPARTMENT round (hop 2); the decision voiding causes Candidate
          NOT_RENEWED -> ACTIVE (hop 3). Each hop is caused by the previous
          mutation, not by the resolve call itself.
        test_recipe:
          setup:
            - "Case fully reviewed (all three levels pass 1/1 YES, score 1.0), decision DENY recorded by a DIFFERENT officer (po_decider), notification sent same day, appeal filed and under review"
            - "Clock pinned at 2026-08-01 throughout: notification_deadline 2026-08-11, appeal_filing_deadline 2026-08-31"
