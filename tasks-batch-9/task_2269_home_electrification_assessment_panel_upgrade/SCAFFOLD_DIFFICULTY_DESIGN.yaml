  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_gate_beats_budget_exhaustion_on_reservation
        grounds:
          - validations.priority_8
          - validations.priority_22
          - validation_priority_conflicts[0]
          - errors.ERR_PROJECT_NOT_APPROVED_FOR_RESERVATION
          - errors.ERR_PROGRAM_BUDGET_EXHAUSTED
        distinguishing_aspect: |
          Category pair: state (priority 8, 409) vs business_fiscal
          (priority 22, 422) — the widest gap in the table, 14 levels. Both
          conditions are live in the same request: the project never reached
          APPROVED and the program has one cent of appropriation left against
          an 800000 ask. The state error must win, and the status code
          therefore has to be 409 rather than 422.
        test_recipe:
          setup:
            - "An OPEN program whose budget_total_cents is 1, so budget_available_cents is 1 — enough to open the program (the DRAFT -> OPEN precondition needs > 0) and far short of any reservation."
            - "Catalog: HP-HVAC-01 unit 800000 / cap 800000 / HVAC_GROUP / 200 A / anchor."
            - "A LOW-tier household with lifetime_cap_remaining_cents 1400000, so the priority-20 household-cap rule is satisfied and cannot pre-empt either rule under test."
            - "An APPROVED assessment and a project left in SUBMITTED — never reviewed, so reviewed_by_user_id is null and the priority-10 segregation-of-duties rule cannot fire either."
            - "provisional_total_incentive_cents is 800000, so the fiscal rule is genuinely violated."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Pair A", state_code: "CO", budget_total_cents: 1, low_tier_cap_cents: 1400000, low_tier_cost_share_pct: 1.00, group_cap_cents: 800000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "HP-HVAC-01", measure_name: "Ducted air-source heat pump", category: "HVAC", unit_incentive_cents: 800000, max_quantity: 1, measure_cap_cents: 800000, combined_cap_group: "HVAC_GROUP", required_panel_capacity_amps: 200, qualifies_as_appliance_anchor: true, sort_order: 10 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /households"
