scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: damages_total_multiplier_vs_per_diem
        grounds:
          - calculations.calc_damages_total
          - entities.Damages.fields.pain_suffering_method
          - entities.Damages.fields.multiplier_value
          - entities.Damages.fields.per_diem_rate_cents
          - entities.Damages.fields.per_diem_days
        distinguishing_aspect: |
          Identical economic inputs on the same Damages row produce different total_damages_cents
          depending on pain_suffering_method; this instance pins the Damages-entity domain
          (non-economic valuation) and is structurally distinct from the disbursement instance below
          which pins the Lien/SettlementDisbursement domain (allocation).
        test_recipe:
          setup:
            - "Create Client (CA), Case (jurisdiction=CA, incident=2024-01-15, AUTO)."
            - "Create one MedicalRecordRequest, send it, then PATCH status=RECEIVED with billed_amount_cents=2000000."
            - "Create Damages with lost_wages_cents=500000, property_damage_cents=0, pain_suffering_method=MULTIPLIER, multiplier_value=3.0."
            - "GET damages and record total_damages_cents."
            - "PATCH damages pain_suffering_method=PER_DIEM, per_diem_rate_cents=15000, per_diem_days=365 (clear multiplier inputs)."
          trigger:
            - "GET /pi-cases/{cid}/damages"
          assert:
            - "MULTIPLIER branch: economic = 2,000,000 + 500,000 + 0 = 2,500,000 cents; pain_suffering_cents == 7,500,000; total_damages_cents == 10,000,000."
            - "PER_DIEM branch (after PATCH): pain_suffering_cents == 15,000 × 365 == 5,475,000; total_damages_cents == 2,500,000 + 5,475,000 == 7,975,000."
            - "10,000,000 != 7,975,000 — same economic inputs, different totals."

      - name: net_disbursement_chronological_vs_prorata
        grounds:
          - calculations.calc_net_disbursement
          - entities.Lien.fields.lien_type
          - entities.Lien.fields.face_amount_cents
          - entities.Lien.fields.negotiated_amount_cents
          - entities.SettlementDisbursement.fields.strategy
          - entities.SettlementDisbursement.fields.client_net_cents
        distinguishing_aspect: |
          On the SettlementDisbursement entity domain (allocation across Lien rows), the
          CHRONOLOGICAL_PRIORITY and FORWARD_LOOKING_PRORATA strategies produce different
          per-lien final_paid_amount_cents and different client_net_cents for the same gross +
          lien set. This is a distinct entity domain from the Damages-valuation instance above.
        test_recipe:
          setup:
            - "Build two SETTLED cases A and B with identical inputs: gross=10,000,000; case_costs=250,000; ContingencyFeeAgreement pre_suit_rate_bps=3333; one MEDICARE lien face=1,500,000 (no negotiated; remains ASSERTED — accepted because statutory auto-reduce); one PROVIDER_NEGOTIATED lien face=800,000 — POST /liens/{lid}/negotiate then PATCH negotiated_amount_cents=400,000 (status becomes REDUCED)."
            - "Run /pi-cases/{a}/disbursement/approve with strategy=CHRONOLOGICAL_PRIORITY."
            - "Run /pi-cases/{b}/disbursement/approve with strategy=FORWARD_LOOKING_PRORATA."
          trigger:
            - "GET both SettlementDisbursement rows."
          assert:
            - "Chronological: MEDICARE.final_paid_amount_cents == 962,550 (= 1,500,000 × (1 − 0.3333 − 0.025) rounded half-up); PROVIDER.final_paid_amount_cents == 400,000; client_net_cents == 5,054,450."
            - "Prorata: MEDICARE.final_paid_amount_cents == 1,500,000; PROVIDER.final_paid_amount_cents == 800,000; client_net_cents == 4,117,000."
            - "5,054,450 != 4,117,000 — same inputs, different client_net."

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: net_disbursement_nested_min_with_state_branch
        grounds:
          - calculations.calc_net_disbursement
          - calculations.calc_attorney_fee
          - entities.Case.fields.filed_in_court
          - entities.Case.fields.status
        distinguishing_aspect: |
          MODE (a) — combinatorial formula with ≥3 inputs and non-linear interaction. Net disbursement
          chains a tier-conditional attorney_fee (branch on Case.status==TRIAL_AWARDED vs
          Case.filed_in_court vs default) with a per-lien min(reduced_or_negotiated, remaining_pool)
          inside a waterfall that also branches on lien_type. Inputs: gross, case_costs, contingency
          tier (3 branches), lien_type (7 categories with different reduction paths), remaining_pool.
        test_recipe:
          setup:
            - "Create Case, Damages, ContingencyFeeAgreement (3333/4000/4500 bps)."
            - "Drive Case to SETTLED via NEGOTIATING route (Case.filed_in_court==false): gross=10,000,000, case_costs=250,000."
            - "Add MEDICARE lien face=1,500,000 (remains ASSERTED — statutory auto-reduce branch)."
            - "Add PROVIDER_NEGOTIATED lien face=800,000; POST /liens/{lid}/negotiate then PATCH negotiated_amount_cents=400,000 (REDUCED — non-statutory branch)."
            - "Add CHILD_SUPPORT lien face=500,000 (remains ASSERTED — statutory auto-reduce branch)."
          trigger:
            - "POST /pi-cases/{id}/disbursement/approve {strategy: CHRONOLOGICAL_PRIORITY}."
          assert:
            - "attorney_fee_cents == 3,333,000 (pre-suit tier selected because filed_in_court==false)."
            - "MEDICARE final_paid_amount_cents == 962,550 (statutory reduction with ratios 0.3333+0.025)."
            - "CHILD_SUPPORT final_paid_amount_cents == 320,850 (= round_half_up_int(500,000 × 0.6417), statutory)."
            - "PROVIDER final_paid_amount_cents == 400,000 (negotiated)."
            - "client_net_cents == 6,417,000 − 962,550 − 320,850 − 400,000 == 4,733,600."

      - name: attorney_fee_rounding_order_pin
        grounds:
          - calculations.calc_attorney_fee
          - entities.ContingencyFeeAgreement.fields.pre_suit_rate_bps
          - entities.Case.fields.gross_settlement_cents
        distinguishing_aspect: |
          MODE (b) — nested rounding where order matters. The scaffold pins
          attorney_fee = round_half_up_int(gross × rate_bps / 10000), i.e. ROUND-AFTER-DIVIDE with
          HALF-UP rounding. With gross=10,000,002 and rate_bps=3333, gross × rate_bps == 33,330,006,666
          → /10000 == 3,333,000.6666 → round_half_up_int == 3,333,001. A floor / truncate ordering
          (or banker's rounding when the fraction is below 0.5) would yield 3,333,000 — a one-cent
          divergence the assertion catches.
        test_recipe:
          setup:
            - "Create Case, ContingencyFeeAgreement(pre_suit_rate_bps=3333, post_suit=4000, trial=4500)."
            - "Drive Case to SETTLED with gross_settlement_cents=10,000,002 (chosen so the divided value is 3,333,000.6666, exposing half-up vs floor) and case_costs=0."
            - "No liens."
          trigger:
            - "POST /pi-cases/{id}/disbursement/approve {strategy: FORWARD_LOOKING_PRORATA}."
          assert:
            - "SettlementDisbursement.attorney_fee_cents == 3,333,001 (= round_half_up_int(10,000,002 × 3333 / 10000))."
            - "SettlementDisbursement.client_net_cents == 6,667,001 (= 10,000,002 − 3,333,001 − 0 − 0)."

      - name: sol_deadline_evaluation_order_pin
        grounds:
          - calculations.calc_sol_deadline
          - entities.Case.fields.sol_deadline
          - entities.Case.fields.sol_tolled_days
          - entities.Client.fields.is_minor_at_incident
        distinguishing_aspect: |
          MODE (c) — circular-looking dependency where evaluation order must be explicit.
          sol_deadline depends on base_deadline; base_deadline depends on (incident_date + base_years)
          OR (dob + 18 + minor_tail) whichever is later; tolling is added LAST on top of the chosen
          base. Reversing order (adding tolling to incident-based deadline THEN taking max with
          minor-deadline) produces different dates when minor wins by margin smaller than the toll.
          The scaffold pins: (1) compute base via max, then (2) add sol_tolled_days.
        test_recipe:
          setup:
            - "Create Client with dob=2010-01-15 (minor at incident in CA)."
            - "Create Case incident_date=2024-01-15, jurisdiction_state=CA, incident_type=AUTO. base_years=2 → incident-based deadline 2026-01-15; minor-tail=2 → minor deadline 2010-01-15 + 20y = 2030-01-15; base_deadline=max(2026-01-15, 2030-01-15)=2030-01-15."
            - "POST /pi-cases/{id}/toll {additional_days: 10, reason: 'incapacity'}."
          trigger:
            - "GET /pi-cases/{id}"
          assert:
            - "Case.sol_deadline == '2030-01-25' (= max(incident+2y, dob+20y) + 10 days), not '2026-01-25' (= incident+2y+10d) nor '2030-02-04' (= incident+2y+10d, replaced incorrectly)."
            - "Case.sol_tolled_days == 10."

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: settlement_offer_cyclic_counter_rounds
        grounds:
          - state_machines.SettlementOffer
          - state_machines.SettlementOffer.PENDING_to_COUNTERED
          - entities.SettlementOffer.fields.predecessor_offer_id
          - entities.SettlementOffer.fields.round_number
        distinguishing_aspect: |
          CYCLE on the SettlementOffer entity: PENDING→COUNTERED is realized by creating a new
          SettlementOffer whose predecessor_offer_id == this.id and opposite party. The chain forms
          a self-referential loop in offer-space; round_number grows with each hop. This is a true
          cycle in the negotiation graph, not a linear pipeline.
        test_recipe:
          setup:
            - "Drive Case to NEGOTIATING (intake → records → demand sent → defendant offer)."
            - "Create offer O1 from DEFENDANT, amount_cents=5,000,000, expires_at = now()+7d. round_number=1."
            - "Create offer O2 from PLAINTIFF predecessor_offer_id=O1.id, amount_cents=8,000,000. round_number=2."
            - "Create offer O3 from DEFENDANT predecessor_offer_id=O2.id, amount_cents=6,000,000. round_number=3."
          trigger:
            - "GET /pi-cases/{cid}/settlement-offers"
          assert:
            - "Three offers exist with round_number 1, 2, 3."
            - "O1.status == COUNTERED after O2 created; O2.status == COUNTERED after O3 created."
            - "O3.status == PENDING; predecessor chain is O3→O2→O1 (cycle structure of party alternation: DEF→PLA→DEF)."

      - name: case_branching_demand_to_negotiating_or_litigation
        grounds:
          - state_machines.Case
          - state_machines.Case.DEMAND_SENT_to_NEGOTIATING
          - state_machines.Case.DEMAND_SENT_to_LITIGATION
          - state_machines.Case.NEGOTIATING_to_LITIGATION
          - state_machines.Case.NEGOTIATING_to_SETTLED
          - state_machines.Case.LITIGATION_to_SETTLED
          - state_machines.Case.LITIGATION_to_TRIAL_AWARDED
        distinguishing_aspect: |
          BRANCHING fork on the Case entity: from DEMAND_SENT the case can branch to NEGOTIATING
          (defendant offers) or LITIGATION (complaint filed before response). From NEGOTIATING it
          branches to either SETTLED (offer accepted) or LITIGATION (case filed). From LITIGATION it
          branches to SETTLED or TRIAL_AWARDED. Side-effect sets differ per branch (e.g., LITIGATION
          flips filed_in_court=true and SUPERSEDES the demand letter; NEGOTIATING flips letter to
          RESPONDED). This is a different entity than SettlementOffer above.
        test_recipe:
          setup:
            - "Drive two parallel cases A and B both to DEMAND_SENT."
            - "On A: POST defendant SettlementOffer → A transitions to NEGOTIATING; DemandLetter.status=RESPONDED."
            - "On B: advance clock past response_due_at; POST CourtEvent {event_type: COMPLAINT_FILED} → B transitions to LITIGATION; DemandLetter.status=SUPERSEDED; Case.filed_in_court=true."
          trigger:
            - "GET Case A and Case B."
          assert:
            - "Case A.status == 'NEGOTIATING'; A's DemandLetter.status == 'RESPONDED'; A.filed_in_court == false."
            - "Case B.status == 'LITIGATION'; B's DemandLetter.status == 'SUPERSEDED'; B.filed_in_court == true."
            - "From the same fork (DEMAND_SENT) the two cases reached different states with different side-effect sets."

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: records_received_cascade_to_ready_for_demand
        grounds:
          - state_machines.MedicalRecordRequest.SENT_to_RECEIVED
          - calculations.calc_damages_total
          - state_machines.Case.RECORDS_PENDING_to_READY_FOR_DEMAND
          - entities.Damages.fields.medical_bills_cents
          - entities.Damages.fields.total_damages_cents
          - entities.Case.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from a Paralegal trigger: (A) PATCH MedicalRecordRequest status=RECEIVED
          mutates request.billed_amount_cents and request.status → (B) that mutation triggers
          recompute of Damages.medical_bills_cents and Damages.total_damages_cents → (C) that mutation,
          if it brings total_damages_cents > 0 AND it was the last non-terminal request, triggers
          Case.status RECORDS_PENDING→READY_FOR_DEMAND. Each hop is CAUSED BY the previous hop, not
          by the original PATCH.
        test_recipe:
          setup:
            - "Create Case with assigned_attorney_id; create one MedicalRecordRequest; POST /send → status=SENT."
            - "Create Damages with lost_wages_cents=0, property_damage_cents=0, MULTIPLIER, multiplier_value=2.0."
            - "Confirm Case.status==RECORDS_PENDING; Damages.total_damages_cents==0."
          trigger:
            - "PATCH /medical-record-requests/{rid} status=RECEIVED, billed_amount_cents=1,000,000."
          assert:
            - "Hop 1: MedicalRecordRequest.status == 'RECEIVED' and billed_amount_cents == 1,000,000."
            - "Hop 2 (caused by hop 1): Damages.medical_bills_cents == 1,000,000; Damages.total_damages_cents == 1,000,000 + 1,000,000×2.0 == 3,000,000; Damages.version incremented."
            - "Hop 3 (caused by hop 2's total>0 + last-non-terminal): Case.status == 'READY_FOR_DEMAND'."

      - name: complaint_filed_cascade_through_negotiation_to_litigation
        grounds:
          - state_machines.Case.NEGOTIATING_to_LITIGATION
          - state_machines.SettlementOffer
          - entities.SettlementOffer.fields.status
          - entities.Case.fields.filed_in_court
          - entities.DemandLetter.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from a different Attorney trigger (POST CourtEvent COMPLAINT_FILED while
          NEGOTIATING): (A) CourtEvent row inserted → (B) Case.filed_in_court mutates true and that
          mutation triggers Case.status NEGOTIATING→LITIGATION → (C) the LITIGATION transition itself
          triggers withdrawal of all PENDING SettlementOffer rows on the case. Trigger and chain
          differ from instance above.
        test_recipe:
          setup:
            - "Drive Case to NEGOTIATING with two PENDING SettlementOffer rows (O1 DEFENDANT countered; O3 DEFENDANT PENDING)."
            - "Confirm Case.filed_in_court==false."
          trigger:
            - "POST /pi-cases/{id}/court-events {event_type: COMPLAINT_FILED, scheduled_at: now()+7d, duration_minutes: 30}."
          assert:
            - "Hop 1: CourtEvent row created with event_type=='COMPLAINT_FILED'."
            - "Hop 2 (caused by hop 1's first-COMPLAINT_FILED rule): Case.filed_in_court == true; Case.status == 'LITIGATION'."
            - "Hop 3 (caused by hop 2's LITIGATION entry): all PENDING SettlementOffer rows on the case (here O3) flipped to 'WITHDRAWN'; the previously-COUNTERED O1 remains COUNTERED."

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_demand_send
        grounds:
          - validations[priority=22]
          - validations[priority=51]
          - endpoints[POST /pi-cases/{cid}/demand-letters/{lid}/send]
        distinguishing_aspect: |
          Pair (state vs business_fiscal): On POST /demand-letters/{lid}/send, simultaneously (a) the
          DemandLetter is NOT in DRAFT (already SENT) AND (b) demanded_amount_cents <
          current Damages.total_damages_cents. Priority 22 (state, ERR_DEMAND_NOT_DRAFT) precedes
          priority 51 (business_fiscal, ERR_DEMAND_BELOW_DAMAGES); the test pins state wins.
        test_recipe:
          setup:
            - "Drive Case to READY_FOR_DEMAND: create + send one MedicalRecordRequest; PATCH it RECEIVED with billed_amount_cents=1,000,000. Create Damages MULTIPLIER mult=2.0, lost_wages=0, property=0 → total_damages_cents = 1,000,000 + 1,000,000×2.0 = 3,000,000."
            - "Create DemandLetter with demanded_amount_cents == 3,000,000 (= damages, satisfies fiscal check)."
            - "POST /demand-letters/{lid}/send → success; letter.status=SENT; Case.status=DEMAND_SENT."
            - "PATCH /pi-cases/{cid}/damages lost_wages_cents=10,000,000 → cascade recomputes total_damages_cents = (1,000,000+10,000,000) + (11,000,000×2.0) = 33,000,000. The existing letter's demanded_amount_cents (3,000,000) is now BELOW damages."
          trigger:
            - "POST /pi-cases/{cid}/demand-letters/{lid}/send (second attempt on the already-SENT letter)"
          assert:
            - "Response.error_id == 'ERR_DEMAND_NOT_DRAFT' (priority 22), NOT 'ERR_DEMAND_BELOW_DAMAGES' (priority 51)."
            - "HTTP status == 409."
            - "Both violations apply concurrently — letter is not DRAFT AND demanded_amount_cents (3,000,000) < total_damages_cents (33,000,000) — but the priority ordering produces the state error first."

      - name: business_safety_vs_business_temporal_on_court_event
        grounds:
          - validations[priority=30]
          - validations[priority=60]
          - endpoints[POST /pi-cases/{cid}/court-events]
        distinguishing_aspect: |
          DIFFERENT pair (business_safety vs business_temporal): On POST /court-events, simultaneously
          (a) Case.sol_deadline has expired (priority 30, ERR_STATUTE_OF_LIMITATIONS_EXPIRED) AND
          (b) scheduled_at is before Case.incident_date (priority 60,
          ERR_COURT_EVENT_TIME_INVALID). Priority 30 (safety) precedes priority 60 (temporal); the
          test pins safety wins. This is a structurally DIFFERENT pair from the (state, business_fiscal)
          conflict above.
        test_recipe:
          setup:
            - "Create Case (CA, AUTO) incident_date=2024-01-15 → sol_deadline=2026-01-15."
            - "Advance clock past 2026-01-15 (now() = 2026-02-01). Case is now out-of-statute."
          trigger:
            - "POST /pi-cases/{cid}/court-events {event_type: MOTION_HEARING, scheduled_at: '2023-12-31T10:00:00Z', duration_minutes: 60}."
          assert:
            - "Response.error_id == 'ERR_STATUTE_OF_LIMITATIONS_EXPIRED' (priority 30), NOT 'ERR_COURT_EVENT_TIME_INVALID' (priority 60)."
            - "HTTP status == 422."

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: sol_deadline_hard_ge_boundary
        grounds:
          - validations[priority=30]
          - calculations.calc_sol_deadline
          - entities.Case.fields.sol_deadline
          - endpoints[POST /pi-cases/{cid}/demand-letters/{lid}/send]
        distinguishing_aspect: |
          Numeric-threshold boundary on the metric (now() vs sol_deadline). The spec pins:
          OUT-OF-STATUTE iff now() >= sol_deadline (HARD >=, NOT >). At the exact midnight tick the
          case becomes blocked. Endpoint exercised: POST /demand-letters/{lid}/send.
        test_recipe:
          setup:
            - "Create Case (CA, AUTO) incident_date=2024-01-15 → sol_deadline=2026-01-15."
            - "Drive Case to READY_FOR_DEMAND with a valid DemandLetter DRAFT."
            - "Advance clock so that now() = 2026-01-14T23:59:59Z (one second before midnight)."
            - "POST /demand-letters/{lid}/send → succeeds (case still in-statute by >)."
            - "Reset: create a second identical case + draft letter. Advance clock so that now() = 2026-01-15T00:00:00Z (exactly midnight)."
          trigger:
            - "POST /pi-cases/{cid}/demand-letters/{lid}/send (on the second case)."
          assert:
            - "First case /send returned 200; letter.status=='SENT'."
            - "Second case /send returned 422 with error_id 'ERR_STATUTE_OF_LIMITATIONS_EXPIRED' (the HARD >= triggered exactly at 00:00:00)."

      - name: empty_records_set_blocks_ready_for_demand
        grounds:
          - state_machines.Case.RECORDS_PENDING_to_READY_FOR_DEMAND
          - entities.MedicalRecordRequest.fields.status
          - entities.Case.fields.status
          - endpoints[PATCH /pi-cases/{cid}/medical-record-requests/{rid}]
        distinguishing_aspect: |
          Empty-set boundary on a different metric (count of RECEIVED requests, not a numeric
          threshold). The transition RECORDS_PENDING→READY_FOR_DEMAND requires AT LEAST ONE request
          in RECEIVED. If the last outstanding request is REJECTED (terminal but not RECEIVED), the
          terminal-set predicate is satisfied but the at-least-one-RECEIVED predicate is not, so the
          Case remains RECORDS_PENDING. Endpoint exercised: PATCH /medical-record-requests/{rid}.
        test_recipe:
          setup:
            - "Create Case → RECORDS_PENDING via creation of MedicalRecordRequest R1; POST /send so R1.status=SENT."
            - "Confirm Case.status=='RECORDS_PENDING'."
          trigger:
            - "PATCH /pi-cases/{cid}/medical-record-requests/{R1}/ status=REJECTED."
          assert:
            - "R1.status == 'REJECTED' (terminal)."
            - "Case.status == 'RECORDS_PENDING' (NOT 'READY_FOR_DEMAND') because the count of RECEIVED requests is exactly 0."
            - "Boundary distinction: had R1 been RECEIVED, Case.status would have flipped (count == 1 satisfies the >=1 boundary)."

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: case_disbursement_blocked_by_unresolved_liens
        grounds:
          - state_machines.Case.SETTLED_to_CLOSED
          - entities.Lien.fields.status
          - endpoints[POST /pi-cases/{id}/disbursement/approve]
        distinguishing_aspect: |
          Entity pair (Case, Lien): Case.SETTLED→CLOSED transition's valid-now predicate depends on
          all Lien rows being in {REDUCED, RESOLVED, DISPUTED}. If any sibling Lien is still ASSERTED
          or NEGOTIATING, the disbursement is blocked. The two entity types are different (Case vs
          Lien) and the dependency is from Case to Lien.
        test_recipe:
          setup:
            - "Drive Case to SETTLED with gross=10,000,000."
            - "Create Lien L1 (PROVIDER_NEGOTIATED, face=500,000); do NOT negotiate it (status remains ASSERTED)."
            - "Create ContingencyFee."
          trigger:
            - "POST /pi-cases/{id}/disbursement/approve {strategy: CHRONOLOGICAL_PRIORITY}."
          assert:
            - "Response.error_id == 'ERR_INVALID_STATE' with HTTP 409 (Lien L1.status == 'ASSERTED' fails the disbursement precondition)."
            - "Case.status remains 'SETTLED'; no SettlementDisbursement row created."

      - name: medical_record_request_send_blocked_by_case_status
        grounds:
          - state_machines.MedicalRecordRequest.DRAFT_to_SENT
          - entities.Case.fields.status
          - validations[priority=21]
          - endpoints[POST /pi-cases/{cid}/medical-record-requests/{rid}/send]
        distinguishing_aspect: |
          DIFFERENT entity pair (MedicalRecordRequest, Case): MedicalRecordRequest.DRAFT→SENT requires
          Case.status IN {RECORDS_PENDING}. If the Case has been dismissed (Case.status=='DISMISSED'),
          the child-resource send is rejected. Distinct from the Case-by-Lien dependency above (the
          dependency direction reverses and the child entity differs).
        test_recipe:
          setup:
            - "Create Case → RECORDS_PENDING with MedicalRecordRequest R1 in DRAFT."
            - "ManagingPartner POST /pi-cases/{id}/dismiss {reason: 'client withdrew'} → Case.status='DISMISSED'."
          trigger:
            - "Paralegal POST /pi-cases/{cid}/medical-record-requests/{R1}/send."
          assert:
            - "Response.error_id == 'ERR_CASE_CLOSED' with HTTP 409."
            - "R1.status remains 'DRAFT' (or 'CANCELED' if it was swept by the dismiss cascade — pin the test: dismiss cascade canceled DRAFT requests, so this assert reads R1.status == 'CANCELED', and the /send rejects with state error)."

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: attorney_calendar_buffered_overlap
        grounds:
          - calculations.calc_attorney_calendar_overlap
          - validations[priority=70]
          - entities.CourtEvent.fields.scheduled_at
          - entities.CourtEvent.fields.duration_minutes
          - entities.Case.fields.assigned_attorney_id
        distinguishing_aspect: |
          Interval semantics #1 — half-open intervals WITH a 15-minute travel buffer on each side.
          Touching at the buffered edge (exactly 30 minutes apart) is allowed. Resource: attorney
          (Case.assigned_attorney_id). Different geometric treatment than instance below.
        test_recipe:
          setup:
            - "Create two Cases A and B with the same assigned_attorney_id."
            - "Drive both to LITIGATION."
            - "POST CourtEvent EA on Case A: scheduled_at='2025-06-01T10:00:00Z', duration_minutes=60 (interval [10:00, 11:00), buffered [09:45, 11:15))."
          trigger:
            - "Attempt POST CourtEvent EB1 on Case B: scheduled_at='2025-06-01T11:29:00Z', duration_minutes=60 (buffered [11:14, 12:44))."
            - "Then attempt POST CourtEvent EB2 on Case B: scheduled_at='2025-06-01T11:30:00Z', duration_minutes=60 (buffered [11:15, 12:45))."
          assert:
            - "EB1 rejected with error_id == 'ERR_ATTORNEY_CALENDAR_CONFLICT', HTTP 409 (buffered overlap: max(09:45,11:14)=11:14 < min(11:15,12:44)=11:15)."
            - "EB2 accepted (exact buffer-edge adjacency 11:15==11:15 → half-open + exact-touch allowed)."

      - name: courtroom_unbuffered_overlap
        grounds:
          - validations[priority=71]
          - entities.CourtEvent.fields.courtroom
          - entities.CourtEvent.fields.scheduled_at
          - entities.CourtEvent.fields.duration_minutes
        distinguishing_aspect: |
          DIFFERENT interval semantics #2 — half-open intervals WITH NO buffer, on a different
          resource (courtroom string, not attorney). Adjacency event_a.end == event_b.start is
          allowed because intervals are half-open. The geometric treatment (no buffer) is structurally
          different from the buffered attorney rule above.
        test_recipe:
          setup:
            - "Create Cases A and B with DIFFERENT assigned attorneys (so attorney overlap rule does not apply)."
            - "Drive both to LITIGATION."
            - "POST CourtEvent EA on Case A: scheduled_at='2025-06-02T14:00:00Z', duration_minutes=60, courtroom='Room-3' (interval [14:00, 15:00))."
          trigger:
            - "Attempt POST CourtEvent EB1 on Case B: scheduled_at='2025-06-02T14:59:00Z', duration_minutes=60, courtroom='Room-3'."
            - "Then attempt POST CourtEvent EB2 on Case B: scheduled_at='2025-06-02T15:00:00Z', duration_minutes=60, courtroom='Room-3'."
          assert:
            - "EB1 rejected with error_id == 'ERR_COURTROOM_DOUBLE_BOOKED', HTTP 409 (overlap at minute 14:59)."
            - "EB2 accepted (exact half-open adjacency: 15:00 == 15:00, no buffer)."

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: disbursement_cents_conservation
        grounds:
          - calculations.calc_net_disbursement
          - entities.SettlementDisbursement.fields.gross_amount_cents
          - entities.SettlementDisbursement.fields.attorney_fee_cents
          - entities.SettlementDisbursement.fields.case_costs_cents
          - entities.SettlementDisbursement.fields.total_lien_payment_cents
          - entities.SettlementDisbursement.fields.client_net_cents
          - validations[priority=80]
        distinguishing_aspect: |
          Conserved quantity #1 — TOTAL CENTS of the settlement pie. The pinned invariant is:
          gross_amount_cents == attorney_fee_cents + case_costs_cents + total_lien_payment_cents +
          client_net_cents. The pinned residual-rounding rule (any prorata residual rolled to the LAST
          lien) makes this exact at the cent level, not approximate. NO drift allowed.
        test_recipe:
          setup:
            - "Drive Case to SETTLED with gross=10,000,002 (chosen so half-up rounding produces a non-trivial cent), case_costs=250,000, no liens; fee 3333 bps."
            - "POST /disbursement/approve {strategy: FORWARD_LOOKING_PRORATA}."
          trigger:
            - "GET the SettlementDisbursement."
          assert:
            - "SettlementDisbursement.gross_amount_cents == 10,000,002."
            - "SettlementDisbursement.attorney_fee_cents == 3,333,001."
            - "SettlementDisbursement.case_costs_cents == 250,000."
            - "SettlementDisbursement.total_lien_payment_cents == 0."
            - "SettlementDisbursement.client_net_cents == 6,417,001."
            - "Invariant check: 3,333,001 + 250,000 + 0 + 6,417,001 == 10,000,002 (exact)."

      - name: sol_tolling_days_conservation
        grounds:
          - calculations.calc_sol_deadline
          - entities.Case.fields.sol_tolled_days
          - entities.Case.fields.sol_deadline
          - endpoints[POST /pi-cases/{id}/toll]
        distinguishing_aspect: |
          DIFFERENT conserved quantity #2 — TOTAL TOLLING DAYS applied to a case. The pinned invariant
          is: Case.sol_deadline == base_deadline + Case.sol_tolled_days (calendar days). Multiple toll
          calls accumulate exactly into sol_tolled_days; sol_deadline equals base_deadline shifted by
          that count, no day lost or gained. This is a different conserved quantity (count of days,
          not cents) than the disbursement invariant above.
        test_recipe:
          setup:
            - "Create Client (adult, dob=1990-01-01) and Case (CA, AUTO, incident_date=2024-01-15). base_deadline computed as 2026-01-15 (no minor-tail). Initial sol_tolled_days=0, sol_deadline=2026-01-15."
            - "POST /pi-cases/{id}/toll {additional_days: 7, reason: 'incapacity-1'}."
            - "POST /pi-cases/{id}/toll {additional_days: 3, reason: 'incapacity-2'}."
            - "POST /pi-cases/{id}/toll {additional_days: 20, reason: 'fraud-concealment'}."
          trigger:
            - "GET /pi-cases/{id}"
          assert:
            - "Case.sol_tolled_days == 30 (= 7 + 3 + 20, exact)."
            - "Case.sol_deadline == '2026-02-14' (= 2026-01-15 + 30 calendar days, exact)."
            - "Invariant check: (sol_deadline as date) − (base_deadline as date) == 30 days; matches sol_tolled_days exactly."
