          trigger:
            - call: "POST /eqp/insurers/${ins_id}/compliance-action"
              payload: { action: "SANCTION", reason: "Too early" }
              as: ProgramAdmin
              captures: { early_err: $.data.error_id }
            - call: "POST /eqp/insurers/${ins_id}/take-up-evaluation"
              payload: { window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { ev_comp: $.data.compliance_status, ev_rate: $.data.last_take_up_rate_bp, ev_considered: $.data.offers_recorded_count }
            - call: "POST /eqp/insurers/${ins_id}/compliance-action"
              payload: { action: "SANCTION", reason: "Persistent under-offering" }
              as: ProgramAdmin
              captures: { s_comp: $.data.compliance_status }
            - call: "POST /eqp/insurers/${ins_id}/compliance-action"
              payload: { action: "REINSTATE" }
              as: ProgramAdmin
              captures: { r_comp: $.data.compliance_status, r_undoc: $.data.undocumented_decline_count }
            - call: "POST /eqp/insurers/${ins_id}/compliance-action"
              payload: { action: "REINSTATE" }
              as: ProgramAdmin
              captures: { r2_err: $.data.error_id }
            - call: "POST /eqp/insurers/${ins_id}/compliance-action"
              payload: { action: "WITHDRAW", reason: "Exiting the state" }
              as: ProgramAdmin
              captures: { w_status: $.data.status, w_comp: $.data.compliance_status }
            - call: "POST /eqp/insurers/${ins_id}/compliance-action"
              payload: { action: "WITHDRAW" }
              as: ProgramAdmin
              captures: { w2_err: $.data.error_id }
          assert:
            - "${early_err} == \"ERR_INSURER_NOT_SANCTIONED\" with HTTP 409 - a COMPLIANT insurer cannot be sanctioned by hand"
            - "${ev_considered} == 5, ${ev_rate} == 2000 and ${ev_comp} == \"UNDER_REVIEW\" - the evaluation is what opens the door"
            - "${s_comp} == \"SANCTIONED\" once the insurer is UNDER_REVIEW"
            - "${r_comp} == \"COMPLIANT\" and ${r_undoc} == 0 - REINSTATE never resets the decline counter, which was already 0 here"
            - "${r2_err} == \"ERR_INSURER_NOT_SANCTIONED\" - the second REINSTATE has nothing to reinstate"
            - "${w_status} == \"WITHDRAWN\" with ${w_comp} == \"COMPLIANT\" - the two dimensions are independent"
            - "${w2_err} == \"ERR_INSURER_ALREADY_WITHDRAWN\" with HTTP 409"

