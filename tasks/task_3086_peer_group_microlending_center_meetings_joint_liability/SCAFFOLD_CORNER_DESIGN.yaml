              as: CenterManager
              as_user_id: "${c_mgr_id}"
              captures: { txn_6000: $.data.id }
          assert:
            - "RepaymentTransaction.${txn_6000}.savings_applied_cents == 200"
            - "RepaymentTransaction.${txn_6000}.installment_applied_cents == 4600"
            - "RepaymentTransaction.${txn_6000}.principal_applied_cents == 5800 (4600 + 1200 prepayment)"
            - "Loan.${c_loan1_id}.principal_outstanding_cents == 104800 (110600 - 5800)"
            - "Loan.${c_loan1_id}.installments_on_time == 1 (prepayment does not consume future installments)"

      - name: sweep_consumes_multiple_dues_in_chronological_order
        claim_type: Boundary / Edge
        grounds:
          - calculations.delinquency_evaluation
        distinguishing_aspect: "Advancing the clock 37 days consumes two unpaid dues (8 and 15 days late) in one sweep: installments_missed == 2, next_due_date advanced 14 days, and the loan is DELINQUENT — not DEFAULTED — because the OLDEST consumed due is only 30 - 7 = 23... precisely: oldest due is 30 days past only at day 38; at day 37 days_past_due(oldest) == 30 triggers DEFAULTED only at >= 30, and day 37 gives 37 - 7 = 30 -> DEFAULTED; the pinned boundary is exercised at day 36 (29 -> stays DELINQUENT) vs day 37 (30 -> DEFAULTED)."
        test_recipe:
          setup: ["Applicant A with an ACTIVE cycle-1 loan disbursed at 2026-09-01T00:00:00Z (first due 2026-09-08). No collections."]
          setup_api_calls:
            - *c_clock0
            - *c_mgr
            - *c_center
            - *c_group
            - *c_peer_1
            - *c_peer_2
            - *c_peer_3
            - *c_peer_4
