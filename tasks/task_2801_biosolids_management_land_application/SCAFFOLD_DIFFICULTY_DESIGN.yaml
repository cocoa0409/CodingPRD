        endpoint: POST /solids-batches/{batchId}/advance-process
        grounds:
          - calculations.volatile_solids_reduction
          - state_machines.SolidsBatch.QUAL_UNTESTED_to_QUAL_REJECTED
          - validations.priority_34_ERR_VSR_BELOW_MINIMUM
          - entities.SolidsBatch.fields.rejection_reason
        distinguishing_aspect: |
          Two digester runs that differ by one hundredth of a percent of outlet volatile solids
          land on either side of the inclusive minimum: 43.11% out gives van Kleeck exactly 38.00
          and is ACCEPTED (>= not >), while 43.12% out gives 37.97 and rejects with
          VSR_BELOW_MINIMUM. The rounding to two decimals happens before the comparison.
        test_recipe:
          setup:
            - "TreatmentFacility posture OPEN, 5000.00 wet tons of storage."
            - "Two THICKENED SolidsBatches, each 800.00 wet tons, 200.000 dry tons in at 55.00% volatile solids, vector_option VAR_OPTION_1_VSR."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-facilities"
              payload: { name: "North Water Reclamation Plant", npdes_permit_number: "NP-1001", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 40.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
            - call: "POST /solids-batches"
              payload: { facility_id: "${fac_id}", batch_code: "B-2026-001", wet_tons: 800.00, dry_tons_in: 200.000, volatile_solids_in_pct: 55.00, percent_solids: 20.0, detention_days: 20.0, digester_temp_c: 36.0, stabilization_process: "ANAEROBIC_DIGESTION", pathogen_option: "PSRP_ALT1_TIME_TEMP", vector_option: "VAR_OPTION_1_VSR", nh4_n_mg_kg: 4000.0, organic_n_mg_kg: 30000.0, nitrate_n_mg_kg: 100.0, total_p_mg_kg: 25000.0 }
              as: FacilityOperator
              captures: { batch_edge: $.data.id }
            - call: "POST /solids-batches"
              payload: { facility_id: "${fac_id}", batch_code: "B-2026-002", wet_tons: 800.00, dry_tons_in: 200.000, volatile_solids_in_pct: 55.00, percent_solids: 20.0, detention_days: 20.0, digester_temp_c: 36.0, stabilization_process: "ANAEROBIC_DIGESTION", pathogen_option: "PSRP_ALT1_TIME_TEMP", vector_option: "VAR_OPTION_1_VSR", nh4_n_mg_kg: 4000.0, organic_n_mg_kg: 30000.0, nitrate_n_mg_kg: 100.0, total_p_mg_kg: 25000.0 }
              as: FacilityOperator
              captures: { batch_below: $.data.id }
          trigger:
            - call: "POST /solids-batches/${batch_edge}/advance-process"
              payload: { to_status: "DIGESTED", dry_tons_out: 160.000, volatile_solids_out_pct: 43.11, detention_days: 20.0, digester_temp_c: 36.0 }
              as: FacilityOperator
              captures: { vsr_edge: $.data.vsr_pct_van_kleeck }
            - call: "POST /solids-batches/${batch_below}/advance-process"
              payload: { to_status: "DIGESTED", dry_tons_out: 160.000, volatile_solids_out_pct: 43.12, detention_days: 20.0, digester_temp_c: 36.0 }
              as: FacilityOperator
              captures: { vsr_below: $.data.vsr_pct_van_kleeck }
          assert:
            - "SolidsBatch.${batch_edge}.vsr_pct_van_kleeck == 38.00"
            - "SolidsBatch.${batch_edge}.quality_status == UNTESTED and rejection_reason == null"
            - "SolidsBatch.${batch_edge}.process_status == DIGESTED"
            - "SolidsBatch.${batch_edge}.vsr_pct_mass_balance == 37.29"
            - "SolidsBatch.${batch_below}.vsr_pct_van_kleeck == 37.97"
            - "SolidsBatch.${batch_below}.quality_status == REJECTED and rejection_reason == VSR_BELOW_MINIMUM"
            - "SolidsBatch.${batch_below}.process_status == DIGESTED (the process dimension advanced even though the quality dimension rejected)"
            - "SolidsBatch.${batch_below}.ceiling_exceedance_flag == false and TreatmentFacility.${fac_id}.posture == OPEN"

      - name: cplr_projection_exactly_equal_to_limit_is_accepted
        metric: cumulative pollutant loading rate headroom in kg/ha
        endpoint: POST /application-events
        grounds:
          - calculations.cplr_headroom_check
          - validations.priority_52_ERR_CPLR_HEADROOM_EXCEEDED
          - calculations.cumulative_loading_ledger
          - errors.ERR_CPLR_HEADROOM_EXCEEDED
        distinguishing_aspect: |
          With the CADMIUM CPLR set to exactly 0.1793 kg/ha, an application at rate 4.00 projects
          0.1793 and is accepted because equality passes, while rate 4.01 projects 0.1798 and is
          refused. The comparison uses the 4-decimal rounded increment, not the raw
          0.17933608 kg/ha, so an implementation comparing unrounded values rejects the first
          request too.
        test_recipe:
          setup:
            - "The standard base fixture with the CADMIUM CPLR pinned to 0.1793 kg/ha (ceiling 85.0, monthly average 39.0, APLR 1.9)."
            - "SolidsBatch DEWATERED + QUALIFIED with 160.000 dry tons and one CADMIUM result at 20.0 mg/kg."
            - "PERMITTED 100-acre site with no ledger history, so cumulative loading starts at 0.0000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-facilities"
              payload: { name: "North Water Reclamation Plant", npdes_permit_number: "NP-1001", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 40.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
            - call: "POST /pollutant-limits"
