  # Stubs for corners already covered by §1.8 instances
  # ===========================================================================
  - section: calculations
    instances:
      - name: occupancy_rate_variants_diverge
        claim_type: Variant Divergence
        grounds:
          - calculations.occupancy_rate_resolution
        excluded_because:
          difficulty_instance: dual_variant_calc / occupancy_rate_banded_vs_actual_headcount_divergence
          rationale: "Both variants priced and asserted as literals in the §1.8 instance."

      - name: lsi_schedule_variants_diverge
        claim_type: Variant Divergence
        grounds:
          - calculations.lsi_accrual
        excluded_because:
          difficulty_instance: dual_variant_calc / lsi_linear_vs_declining_balance_divergence
          rationale: "LINEAR vs DECLINING_BALANCE asserted as literals at offset 12 in the §1.8 instance."

      - name: franchise_fee_rounding_order_pinned
        claim_type: Precision
        grounds:
          - calculations.franchise_fee
        excluded_because:
          difficulty_instance: combinatorial_formula / franchise_fee_per_line_rounding_order
          rationale: "Per-line vs aggregate rounding order asserted (1695 vs 1694) in the §1.8 instance."

      - name: lottery_allocation_order_and_promotion
        claim_type: Correct Result
        grounds:
