              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /comm-services/contracts"
              payload: { facility_id: "${fac_id}", commission_pct: 0.5, commission_basis: "GROSS", deposit_fee_cents: 25, closure_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /comm-services/contracts/${c_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /comm-services/contracts/${c_id}/rate-schedules"
              payload: { local_per_minute_cents: 25, intrastate_per_minute_cents: 25, interstate_per_minute_cents: 25, international_per_minute_cents: 25, connection_fee_cents: 300, message_price_cents: 500, video_session_fee_cents: 500 }
              as: PlatformAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /comm-services/contracts/${c_id}/rate-schedules"
              payload: { local_per_minute_cents: 25, intrastate_per_minute_cents: 25, interstate_per_minute_cents: 26, international_per_minute_cents: 25, connection_fee_cents: 300, message_price_cents: 500, video_session_fee_cents: 500 }
              as: PlatformAdmin
              captures: { s2_id: $.data.id }
          trigger:
            - call: "POST /comm-services/rate-schedules/${s1_id}/activate"
              payload: { expected_contract_version: "${c_v}" }
              as: PlatformAdmin
              captures: { s1_status: $.data.status }
            - call: "GET /comm-services/contracts/${c_id}"
              payload: {}
              as: PlatformAdmin
              captures: { c_v2: $.data.version }
            - call: "POST /comm-services/rate-schedules/${s2_id}/activate"
              payload: { expected_contract_version: "${c_v2}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "S1 (all rates exactly at cap) activates: s1_status == ACTIVE"
            - "the activation bumped FacilityContract.${c_id}.version to ${c_v} + 1 (observed as c_v2)"
            - "S2 (interstate 26, one cent over): status 409 and err == ERR_RATE_EXCEEDS_CAP"
            - "RateSchedule.${s2_id}.status stays DRAFT and S1 stays ACTIVE (the failed activation supersedes nothing)"

      - name: account_close_refundable_exactly_zero_creates_no_refund_request
