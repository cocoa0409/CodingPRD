        distinguishing_aspect: "Holder hB requesting a distribution on hA's account returns ERR_NOT_ACCOUNT_OWNER (403) — entity_backed ownership check on HsaAccount.accountholder_id."
        test_recipe:
          setup: ["ACTIVE account owned by holder hA (cash 80000). A second holder hB exists."]
          setup_api_calls:
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Holder A", email: "ha@x.com", date_of_birth: "1980-07-17" }
              as: AccountAdmin
              captures: { ha_id: $.data.id }
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Holder B", email: "hb@x.com", date_of_birth: "1980-08-18" }
              as: AccountAdmin
              captures: { hb_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${ha_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "SELF_ONLY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${ha_id}"
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/distributions"
              payload: { method: "REIMBURSEMENT", amount_cents: 10000 }
              as: Accountholder
              as_user_id: "${hb_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_NOT_ACCOUNT_OWNER (403)"

      - name: receipt_not_available_wrong_account
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_RECEIPT_NOT_AVAILABLE]"]
        distinguishing_aspect: "Substantiating account A's distribution with a receipt vaulted to a DIFFERENT account B returns ERR_RECEIPT_NOT_AVAILABLE (receipt.account_id mismatch)."
        test_recipe:
          setup: ["Two ACTIVE accounts accA (cash 80000, one CLEARED 50000 distribution) and accB (with a VAULTED 60000 receipt)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Owner A", email: "oa@x.com", date_of_birth: "1980-09-19" }
              as: AccountAdmin
              captures: { ha_id: $.data.id }
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Owner B", email: "ob@x.com", date_of_birth: "1980-10-20" }
              as: AccountAdmin
              captures: { hb_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${ha_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { accA: $.data.id, tokA: $.data.verification_token }
            - call: "POST /hsa/accounts/${accA}/coverage-periods"
              payload: { coverage_tier: "SELF_ONLY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${accA}/verify"
              payload: { verification_token: "${tokA}" }
              as: Accountholder
              as_user_id: "${ha_id}"
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${hb_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { accB: $.data.id, tokB: $.data.verification_token }
            - call: "POST /hsa/accounts/${accB}/coverage-periods"
              payload: { coverage_tier: "SELF_ONLY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${accB}/verify"
              payload: { verification_token: "${tokB}" }
              as: Accountholder
              as_user_id: "${hb_id}"
            - call: "POST /hsa/receipts"
              payload: { account_id: "${accB}", merchant: "OtherClinic", service_date: "2026-02-03T00:00:00Z", amount_cents: 60000, is_qualified_medical: true }
              as: Accountholder
              as_user_id: "${hb_id}"
              captures: { rcpt_b: $.data.id }
            - call: "POST /hsa/accounts/${accA}/contributions"
              payload: { channel: "INDIVIDUAL", amount_cents: 80000 }
              as: AccountAdmin
              captures: { cA: $.data.id }
            - call: "POST /hsa/accounts/${accA}/contributions/${cA}/post"
              as: AccountAdmin
            - call: "POST /hsa/accounts/${accA}/distributions"
              payload: { method: "REIMBURSEMENT", amount_cents: 50000 }
              as: Accountholder
              as_user_id: "${ha_id}"
              captures: { dA: $.data.id }
            - call: "POST /hsa/accounts/${accA}/distributions/${dA}/clear"
              as: AccountAdmin
              as_user_id: "adminA"
          trigger:
            - call: "POST /hsa/accounts/${accA}/distributions/${dA}/substantiate"
              payload: { receipt_id: "${rcpt_b}" }
              as: AccountAdmin
              as_user_id: "adminB"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_RECEIPT_NOT_AVAILABLE (receipt belongs to accB, not accA)"

      - name: coverage_overlap_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_COVERAGE_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / coverage_period_closed_closed_overlap
          rationale: "ERR_COVERAGE_OVERLAP is the asserted failure of the §1.8 closed-closed overlap instance."

      - name: payroll_period_overlap_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_PAYROLL_PERIOD_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / payroll_period_half_open_overlap
          rationale: "ERR_PAYROLL_PERIOD_OVERLAP is the asserted failure of the §1.8 half-open overlap instance."

      - name: nothing_to_sweep_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOTHING_TO_SWEEP]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / sweep_threshold_strict_greater_boundary
          rationale: "ERR_NOTHING_TO_SWEEP is the asserted failure of the §1.8 sweep-threshold boundary instance."

  # ===========================================================================
  - section: rbac
    instances:
      - name: employer_cannot_post_contribution
        claim_type: peer_role_isolation
        grounds: [roles, "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Employer may CREATE a PAYROLL contribution but POST /contributions/{id}/post is AccountAdmin-exclusive; an Employer calling post returns ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["ACTIVE account sponsored by employer E; a PENDING PAYROLL contribution created by the Employer."]
          setup_api_calls:
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Np Qrs", email: "np.qrs@x.com", date_of_birth: "1980-11-21" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/employers"
              payload: { name: "Initech" }
              as: AccountAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", employer_id: "${emp_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "SELF_ONLY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
            - call: "POST /hsa/accounts/${acc_id}/contributions"
              payload: { channel: "PAYROLL", amount_cents: 30000 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/contributions/${c_id}/post"
              as: Employer
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_FORBIDDEN (403); Contribution.${c_id}.status remains PENDING"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_sweep_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[sweep-create-stale-account]", "errors[ERR_STALE_ACCOUNT_VERSION]"]
        distinguishing_aspect: "After observing the account at version V and then a contribution post bumps it to V+1, a sweep carrying expected_account_version == V-relative-stale (the previously observed value) is rejected ERR_STALE_ACCOUNT_VERSION (412)."
        test_recipe:
          setup: ["ACTIVE account, cash 250000 (one posted contribution). Client captured the account version BEFORE a second contribution post advanced it."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Op Rst", email: "op.rst@x.com", date_of_birth: "1980-12-22" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "FAMILY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
            - call: "POST /hsa/accounts/${acc_id}/contributions"
              payload: { channel: "INDIVIDUAL", amount_cents: 250000 }
              as: AccountAdmin
              captures: { c1: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/contributions/${c1}/post"
              as: AccountAdmin
            - call: "GET /hsa/accounts/${acc_id}"
              as: AccountAdmin
              captures: { acc_v_stale: $.data.version }
            - call: "POST /hsa/accounts/${acc_id}/contributions"
              payload: { channel: "INDIVIDUAL", amount_cents: 10000 }
              as: AccountAdmin
              captures: { c2: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/contributions/${c2}/post"
              as: AccountAdmin
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/sweeps"
              payload: { requested_amount_cents: 50000, expected_account_version: "${acc_v_stale}" }
              as: AccountAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_STALE_ACCOUNT_VERSION (412); no InvestmentSweep persisted"
            - "HsaAccount.${acc_id}.invested_balance_cents == 0"

      - name: occ_correction_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[correction-create-stale-account]", "errors[ERR_STALE_ACCOUNT_VERSION]"]
        excluded_because:
          difficulty_instance: transitive_cascade / correction_execute_depth3_cascade
          rationale: "The corrections OCC create path and version-advance side effect are exercised by the §1.8 cascade instance, which captures the live account version immediately before creating the correction; the stale-version negative is the symmetric case of the sweep OCC instance above."

      - name: derived_field_contributions_ytd_reconciles_after_reverse
        claim_type: derived_field_reconciliation
        grounds: [entities.HsaAccount.fields.contributions_ytd_cents, state_machines.Distribution.CLEARED_to_REVERSED]
        excluded_because:
          difficulty_instance: compensating_invariant / distribution_reverse_conserves_cash
          rationale: "Derived cash_balance_cents reconciliation after a clear+reverse is asserted by the §1.8 cash-conservation instance; contributions_ytd reconciliation after contribution reverse is asserted by the depth-3 cascade instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_balances_in_post_response
        claim_type: immediate_visibility
        grounds: [entities.HsaAccount.fields.cash_balance_cents]
        distinguishing_aspect: "Posting a contribution returns the Contribution; the very next GET /hsa/accounts/{id} (same logical step, no delay) shows cash_balance_cents already credited — immediate consistency, no eventual lag."
        test_recipe:
          setup: ["ACTIVE account, one PENDING INDIVIDUAL contribution of 70000."]
          setup_api_calls:
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Qr Stu", email: "qr.stu@x.com", date_of_birth: "1980-01-11" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "SELF_ONLY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
            - call: "POST /hsa/accounts/${acc_id}/contributions"
              payload: { channel: "INDIVIDUAL", amount_cents: 70000 }
              as: AccountAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/contributions/${c_id}/post"
              as: AccountAdmin
          trigger:
            - call: "GET /hsa/accounts/${acc_id}"
              as: AccountAdmin
              captures: { cash: $.data.cash_balance_cents }
          assert:
            - "HsaAccount.${acc_id}.cash_balance_cents == 70000 immediately after post"
