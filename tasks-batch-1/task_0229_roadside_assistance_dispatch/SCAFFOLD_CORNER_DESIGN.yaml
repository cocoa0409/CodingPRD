  # =========================================================================
  # RBAC — auth/authorization denials, ownership
  # =========================================================================
  - section: rbac
    instances:
      - name: missing_headers_returns_unauthenticated
        claim_type: role_can_perform
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "POST /membership-plans with no X-User-Role/X-User-ID headers returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB; call sent without auth headers."]
          setup_api_calls: []
          trigger:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW"], base_service_fee_cents: 0 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response status == 401"
            - "data.error_id == ERR_UNAUTHENTICATED"

      - name: member_cannot_create_plan_forbidden_role
        claim_type: role_cannot_perform
        grounds: [roles, "validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "A Member calling POST /membership-plans (DispatchOperator-exclusive) returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["A member acting as Member."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 7500 }
              as: DispatchOperator
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", full_name: "Mia Member", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /membership-plans"
              payload: { tier: "BASIC", annual_service_limit: 2, per_incident_mileage_cap_miles: 3, overage_rate_cents_per_mile: 300, priority_weight: 5, covered_service_types: ["JUMP"], base_service_fee_cents: 9000 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "data.error_id == ERR_FORBIDDEN_ROLE"

      - name: member_cannot_cancel_another_members_call_not_owner
        claim_type: peer_roles
        grounds: [roles, "validations[priority=4]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "Member B calling POST /service-calls/{id}/cancel on member A's DISPATCHING call returns ERR_NOT_RESOURCE_OWNER (403); ownership is compared via call.member_id."
        test_recipe:
          setup: ["Member A owns a DISPATCHING call; member B attempts to cancel it."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 7500 }
              as: DispatchOperator
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", full_name: "Member A", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_a: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", full_name: "Member B", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_b: $.data.id }
            - call: "POST /service-calls"
              payload: { member_id: "${mem_a}", service_type: "JUMP", breakdown_lat: 0.0, breakdown_lng: 0.0 }
