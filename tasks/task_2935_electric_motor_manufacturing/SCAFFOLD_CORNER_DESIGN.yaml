  # ===========================================================================
  # Table 6 (Errors) — 56 error codes, each triggerable
  # ===========================================================================
  - section: errors
    instances:

      - name: unauthenticated_calls_are_rejected_for_blank_and_undeclared_headers
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Priority 1 has three independent failure modes and one error id: an empty X-User-Role, an
          empty X-User-ID, and a syntactically fine role name that §1.7 never declares. All three
          must answer ERR_UNAUTHENTICATED with 401 — not 403, which belongs to priority 2 — and the
          identical request with both headers correct must return the row.
        test_recipe:
          setup:
            - "One DRAFT design D1 authored by u_eng_1."
          setup_api_calls:
            - call: "POST /motor-designs"
              payload: { model_code: "WM-132M-7K5-IE3", frame_size: "132M", poles: 4, rated_output_kw: 7.5, rated_voltage_v: 400, target_efficiency_class: "IE3", lamination_grade: "M330_35A", lamination_stack_length_mm: 180, winding_copper_kg: 12.0, winding_type: "LAP", insulation_class: "F", stator_bore_id_mm: 135.400, design_air_gap_mm: 0.450, air_gap_tolerance_mm: 0.050, rotor_construction: "DIE_CAST_ALUMINUM", rotor_bar_count: 34, shaft_diameter_mm: 38.000, shaft_tolerance_class: "k6", bearing_spec_de: "6208-2Z", bearing_spec_nde: "6206-2Z", lubrication_spec: "GREASE_REGREASABLE", duty_type: "S1", enclosure: "IP55", mounting: "B3" }
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { d1_id: $.data.id }
          trigger:
            - call: "GET /motor-designs/${d1_id}"
              payload: {}
              as: ""
              as_user_id: "u_eng_1"
              captures: { e_blank_role: $.data.error_id }
            - call: "GET /motor-designs/${d1_id}"
              payload: {}
              as: DesignEngineer
              as_user_id: ""
              captures: { e_blank_id: $.data.error_id }
            - call: "GET /motor-designs/${d1_id}"
              payload: {}
              as: "Janitor"
              as_user_id: "u_eng_1"
              captures: { e_undeclared_role: $.data.error_id }
            - call: "GET /motor-designs/${d1_id}"
              payload: {}
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { ok_status: $.data.status }
          assert:
            - "${e_blank_role} == ERR_UNAUTHENTICATED with HTTP 401 — the X-User-Role header is sent with the empty string value, never omitted-with-whitespace"
            - "${e_blank_id} == ERR_UNAUTHENTICATED with HTTP 401"
            - "${e_undeclared_role} == ERR_UNAUTHENTICATED with HTTP 401 — not ERR_UNAUTHORIZED (403), because a role §1.7 does not declare fails authentication first"
            - "trigger 4 returns HTTP 200 with ${ok_status} == DRAFT"

      - name: stale_design_version_on_work_order_creation
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[work-order-create-stale-design]
          - errors[ERR_STALE_DESIGN_VERSION]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / work_order_creation_blocked_while_pinned_design_sits_in_review
          rationale: "That §1.8 instance sends expected_design_version one behind the current version and asserts the 412."

      - name: work_order_creation_against_an_unreleased_design
        claim_type: violation_to_error
        grounds:
          - validations[priority=40]
          - errors[ERR_DESIGN_NOT_RELEASED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / design_not_released_outranks_stock_allowance_exceeded_on_confirm
          rationale: "That §1.8 instance asserts the error id as the winning half of the priority pair."

      - name: surge_margin_below_zero_on_a_thin_insulation_system
        claim_type: violation_to_error
        grounds:
          - validations[priority=63]
          - errors[ERR_SURGE_MARGIN_NEGATIVE]
        excluded_because:
          difficulty_instance: boundary_precision_check / surge_insulation_margin_exactly_zero_accepted_one_hundredth_below_rejected
