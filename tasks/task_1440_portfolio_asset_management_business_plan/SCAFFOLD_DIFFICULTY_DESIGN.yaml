                  - { category: MANAGEMENT_FEE_EXPENSE, month_index: 1, budget_amount_cents: 120000 }
                  - { category: OTHER_OPEX, month_index: 1, budget_amount_cents: 90000 }
                  - { category: CAPITAL, month_index: 1, budget_amount_cents: 36000000 }
              as: AssetManager
              as_user_id: "am-1"
              captures: { rent_m1: "$.data[0].id", rent_m2: "$.data[1].id", rent_m3: "$.data[2].id" }
            - { call: "POST /api/business-plans/${pl1}/submit", payload: {}, as: AssetManager, as_user_id: "am-1" }
            - { call: "POST /api/business-plans/${pl1}/approve", payload: {}, as: PortfolioDirector }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-04-05T00:00:00Z" }, as: PortfolioDirector }
            - { call: "POST /api/actuals-reports", payload: { plan_id: "${pl1}", month_index: 1, lines: [ { budget_line_id: "${rent_m1}", actual_amount_cents: 11000000 } ] }, as: PropertyManager, as_user_id: "${pm1}", captures: { ar1: $.data.id } }
            - { call: "POST /api/actuals-reports/${ar1}/accept", payload: {}, as: AssetManager, as_user_id: "am-1" }
            - { call: "POST /api/actuals-reports", payload: { plan_id: "${pl1}", month_index: 2, lines: [ { budget_line_id: "${rent_m2}", actual_amount_cents: 11000000 } ] }, as: PropertyManager, as_user_id: "${pm1}", captures: { ar2: $.data.id } }
