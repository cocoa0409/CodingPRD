              captures: { p_ch_id: "$.data.id" }
            - call: "POST /ti-proposals/${p_ch_id}/accept"
              payload: {}
              as: Tenant
              as_user_id: "${t_ch_id}"
            - call: "POST /leases/${l_ch_id}/escrow-deposits"
              payload: { amount_usd: 36750.00 }
              as: Tenant
              as_user_id: "${t_ch_id}"
            - call: "POST /leases/${l_ch_id}/execute"
              payload: {}
              as: LandlordAssetManager
              as_user_id: u_landlord_signer
            - call: "POST /fit-out-projects"
              payload: { lease_id: "${l_qc_id}", floor_id: "${f2_id}", design_exhaust_cfm: 12000, design_power_kw: 180, scope_summary: "QC lab fit-out, floor 2" }
              as: LandlordAssetManager
              captures: { pr_qc_id: "$.data.id" }
            - call: "POST /fit-out-projects/${pr_qc_id}/permit-application"
              payload: {}
              as: LandlordAssetManager
            - call: "POST /fit-out-projects/${pr_qc_id}/permit-decision"
              payload: { decision: "ISSUE" }
              as: AHJPermitOfficer
            - call: "POST /fit-out-projects"
              payload: { lease_id: "${l_ch_id}", floor_id: "${f2_id}", design_exhaust_cfm: 16000, design_power_kw: 220, scope_summary: "Chemistry synthesis fit-out, floor 2" }
              as: LandlordAssetManager
              captures: { pr_ch_id: "$.data.id" }
            - call: "POST /fit-out-projects/${pr_ch_id}/permit-application"
              payload: {}
              as: LandlordAssetManager
            - call: "POST /fit-out-projects/${pr_ch_id}/permit-decision"
              payload: { decision: "ISSUE" }
              as: AHJPermitOfficer
            - call: "POST /hazmat-permits"
              payload: { project_id: "${pr_qc_id}", floor_id: "${f2_id}", hazard_class: "FLAMMABLE_IB", use_condition: "CLOSED_SYSTEM_USE", quantity_gal: 150.00, control_area_index: 1 }
              as: Tenant
              as_user_id: "${t_qc_id}"
              captures: { hz_qc_id: "$.data.id" }
            - call: "POST /hazmat-permits/${hz_qc_id}/decision"
              payload: { decision: "APPROVE" }
              as: AHJPermitOfficer
            - call: "POST /hazmat-permits"
              payload: { project_id: "${pr_ch_id}", floor_id: "${f2_id}", hazard_class: "FLAMMABLE_IB", use_condition: "CLOSED_SYSTEM_USE", quantity_gal: 40.00, control_area_index: 1 }
              as: Tenant
              as_user_id: "${t_ch_id}"
              captures: { hz_ch_id: "$.data.id" }
          trigger:
            - call: "GET /floors/${f2_id}/hazmat-utilization"
              payload: { hazard_class: "FLAMMABLE_IB", control_area_index: 1 }
              as: AHJPermitOfficer
              captures: { basis_before: "$.data.per_control_area_basis_gal", allow: "$.data.allowance_per_control_area_gal" }
            - call: "POST /hazmat-permits/${hz_ch_id}/decision"
              payload: { decision: "APPROVE" }
              as: AHJPermitOfficer
              captures: { e_maq: "$.data.error_id" }
            - call: "POST /hazmat-permits/${hz_qc_id}/decision"
              payload: { decision: "REVOKE", decision_reason: "QC tenant surrendered its flammable inventory ahead of schedule" }
              as: AHJPermitOfficer
              captures: { qc_st: "$.data.status" }
            - call: "GET /floors/${f2_id}/hazmat-utilization"
              payload: { hazard_class: "FLAMMABLE_IB", control_area_index: 1 }
              as: AHJPermitOfficer
              captures: { basis_after: "$.data.per_control_area_basis_gal" }
            - call: "POST /hazmat-permits/${hz_ch_id}/decision"
              payload: { decision: "APPROVE" }
              as: AHJPermitOfficer
              captures: { ch_st: "$.data.status" }
            - call: "GET /floors/${f2_id}/hazmat-utilization"
              payload: { hazard_class: "FLAMMABLE_IB", control_area_index: 1 }
              as: AHJPermitOfficer
              captures: { basis_final: "$.data.per_control_area_basis_gal", util_final: "$.data.per_control_area_utilization_pct" }
          assert:
            - "second trigger call -> HTTP 409; third, fifth -> HTTP 200"
            - "${allow} == 180.00"
            - "${basis_before} == 190.00 (report basis includes the REQUESTED 40.00: 150.00 APPROVED + 40.00 REQUESTED)"
            - "${e_maq} == ERR_CONTROL_AREA_MAQ_EXCEEDED"
            - "the approval-time basis at the moment of the refusal is 150.00 (APPROVED and ACTIVE only) and 150.00 + 40.00 = 190.00 > 180.00"
            - "${qc_st} == REVOKED"
            - "${basis_after} == 40.00 (the REVOKED 150.00 leaves the report basis, the still-REQUESTED 40.00 remains)"
            - "the approval-time basis after the revoke is 0.00, so 0.00 + 40.00 = 40.00 <= 180.00"
            - "${ch_st} == APPROVED"
            - "${basis_final} == 40.00"
            - "${util_final} == 22.22"
            - "the REVOKED permit is excluded from both bases, so the identical 40.00 approval that failed at 190.00 succeeds at 40.00"
            - "HazmatUsePermit.${hz_qc_id}.decision_reason == QC tenant surrendered its flammable inventory ahead of schedule"
            - "HazmatUsePermit.${hz_ch_id}.status == APPROVED"

      - name: commissioning_pass_cascade_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.FitOutProject.C_SUBSTANTIAL_COMPLETION_to_C_ACCEPTED
          - state_machines.CapacityReservation.RESERVED_to_COMMITTED
          - state_machines.HazmatUsePermit.APPROVED_to_ACTIVE
          - state_machines.Lease.EXECUTED_to_ACTIVE
        excluded_because:
          difficulty_instance: commissioning_pass_cascades_project_reservation_permit_building_and_lease
          rationale: "The named §1.8 instance already walks the full five-level chain from the last PASS through project acceptance, reservation commitment, permit activation, building pool recomputation and lease activation, and asserts every level's literal end state."

      - name: cascade_ordering_sensitivity_on_the_phase_hold_chain
        claim_type: cascading_side_effects
        grounds:
          - state_machines.PhasePackage.SCHEDULED_to_VIBRATION_HOLD
          - state_machines.PhasePackage.SCHEDULED_to_BLOCKED
          - state_machines.AmenityAllocation.CONFIRMED_to_PREEMPTED
        excluded_because:
          difficulty_instance: phase_hold_cascades_transitive_successors_project_and_amenity_allocations
          rationale: "The named §1.8 instance already asserts the transitive successor closure, the project suspension and the allocation preemption produced by a single hold, including the successor that must NOT be touched."

      - name: both_suitability_variants_and_the_switch_delta
        claim_type: dual_variant_calculation
        grounds:
          - calculations.suitability_score
          - entities.SuitabilityAssessment.assessment_basis
        excluded_because:
          difficulty_instance: assessment_screening_vs_investigation_divergence
          rationale: "The named §1.8 instance already runs both SCREENING and INVESTIGATION over byte-identical inputs and asserts each variant's literal score, verdict and the delta between them."

      - name: both_hazmat_bases_and_the_switch_delta
        claim_type: dual_variant_calculation
        grounds:
          - calculations.floor_hazmat_utilization
          - validations.hazmat_project_maq
          - validations.hazmat_floor_wide_maq
        excluded_because:
          difficulty_instance: hazmat_per_control_area_vs_aggregate_floor_basis
          rationale: "The named §1.8 instance already contrasts the project-scoped create basis against the floor-wide cross-tenant approval basis on the same permit rows and asserts both literal outcomes."

      - name: cumulative_maq_threshold_tested_at_the_allowance_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - validations.hazmat_project_maq
          - errors.ERR_CONTROL_AREA_MAQ_EXCEEDED
        excluded_because:
          difficulty_instance: hazmat_maq_boundary_180_00_accepted_180_01_rejected
          rationale: "The named §1.8 instance already pins the cumulative gallon threshold at exactly the allowance and one cent above it."

      - name: instantaneous_amenity_threshold_tested_at_the_capacity_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - validations.allocation_concurrent_capacity
          - errors.ERR_AMENITY_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: amenity_capacity_counts_half_open_windows_end_instant_excluded
          rationale: "The named §1.8 instance already pins the instantaneous concurrency threshold at the capacity boundary and fixes the half-open window convention at the end instant."

  - section: consistency_model
    instances:
      - name: every_write_response_already_carries_its_recomputed_derived_state
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.building_capacity_pools
          - calculations.phase_ti_commitment
          - calculations.floor_hazmat_utilization
        distinguishing_aspect: "No read-after-write lag anywhere: the mutating response body itself carries the new derived values, and an immediate GET on the affected sibling aggregate - building pools, floor hazmat utilization, lease commitment buckets - returns the identical literals with no second call, retry or delay."
        test_recipe:
          setup:
            - "QC lease executed (ti_authorized 200000.00); project P_ISSUED; one REQUESTED hazmat permit of 100.00 gal on floor 2 control area 1"
            - "One SHELL phase (hard 100000.00, restoration 90000.00) already IN_PROGRESS"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LandlordAssetManager
            - call: "POST /buildings"
              payload: { name: "Kendall Labs 400", address_city: "Cambridge", occupancy_status: "PARTIALLY_OCCUPIED", published_floor_to_floor_ft: 14.0, published_live_load_psf: 95, published_vibration_class: "VC_C", exhaust_riser_capacity_cfm: 60000, emergency_power_capacity_kw: 800, chilled_water_capacity_tons: 1200 }
