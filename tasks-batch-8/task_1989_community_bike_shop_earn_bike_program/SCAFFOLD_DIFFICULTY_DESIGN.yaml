  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: hours_exact_threshold_promotes
        grounds: [calculations.hours_accrual, state_machines.EarnABikeParticipant.ENROLLED_to_HOURS_MET, "endpoints[POST /hour-logs/{id}/approve]"]
        distinguishing_aspect: "Boundary on the hours metric via the approve endpoint: at hours_earned 11 (required 12) the participant stays ENROLLED; the log that lands the total exactly ON 12 triggers HOURS_MET — the >= (equality counts) semantics, distinct from the count and stock boundaries."
        test_recipe:
          setup:
            - "ADULT participant (required 12) enrolled at default clock; three PENDING logs 6h (08-02), 5h (08-03), 1h (08-04); clock 2026-08-07"
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "P Adult", contact_email: "pa@x.org", age_group: "ADULT" }, as: ShopCoordinator, captures: { pa: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: ShopCoordinator }
            - { call: "POST /participants/${pa}/hour-logs", payload: { work_date: "2026-08-02", hours: 6, activity_type: "REFURB_WORK" }, as: Participant, as_user_id: "${pa}", captures: { h1: $.data.id } }
            - { call: "POST /participants/${pa}/hour-logs", payload: { work_date: "2026-08-03", hours: 5, activity_type: "SHOP_HELP" }, as: Participant, as_user_id: "${pa}", captures: { h2: $.data.id } }
            - { call: "POST /participants/${pa}/hour-logs", payload: { work_date: "2026-08-04", hours: 1, activity_type: "OUTREACH" }, as: Participant, as_user_id: "${pa}", captures: { h3: $.data.id } }
            - { call: "GET /participants/${pa}", as: ShopCoordinator, captures: { v1: $.data.version } }
            - { call: "POST /hour-logs/${h1}/approve", payload: { expected_participant_version: "${v1}" }, as: ShopCoordinator, as_user_id: "sc-approver-1" }
            - { call: "GET /participants/${pa}", as: ShopCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /hour-logs/${h2}/approve", payload: { expected_participant_version: "${v2}" }, as: ShopCoordinator, as_user_id: "sc-approver-1" }
            - { call: "GET /participants/${pa}", as: ShopCoordinator, captures: { st_mid: $.data.status, h_mid: $.data.hours_earned, v3: $.data.version } }
          trigger:
            - { call: "POST /hour-logs/${h3}/approve", payload: { expected_participant_version: "${v3}" }, as: ShopCoordinator, as_user_id: "sc-approver-1" }
            - { call: "GET /participants/${pa}", as: ShopCoordinator, captures: { st_end: $.data.status, h_end: $.data.hours_earned } }
          assert:
            - "mid-chain observation: hours_earned == 11 and status == ENROLLED  (11 < 12: no transition)"
            - "final: hours_earned == 12 and status == HOURS_MET  (== required_hours triggers, >= semantics)"
            - "EarnABikeParticipant.${pa}.required_hours == 12"

