        distinguishing_aspect: |
          Entity pair {Admission -> Program}: a PENDING_ADMISSION admission cannot be
          admitted while its Program.status == CLOSED, even though the admission itself is
          in a valid from-state; rejected ERR_PROGRAM_CLOSED.
