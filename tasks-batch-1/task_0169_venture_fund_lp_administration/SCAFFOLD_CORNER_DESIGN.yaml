            - "response.data.error_id == ERR_RESOURCE_NOT_FOUND"

      - name: no_participating_commitments_on_call
        claim_type: violation_to_error
        grounds: ["errors[ERR_COMMITMENT_NOT_ACCEPTED]"]
        distinguishing_aspect: "Issuing a capital call on a fund with no ACTIVE commitments -> ERR_COMMITMENT_NOT_ACCEPTED (409)."
