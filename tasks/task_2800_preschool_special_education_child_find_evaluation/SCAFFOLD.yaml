# =============================================================================
# PRD Benchmark Seed Tables — task_2800
# Preschool Special Education Child Find & Evaluation
# =============================================================================

scenario: |
  2800. Preschool Special Education Child Find & Evaluation (district early
  childhood special education): community-wide child find outreach and screening
  event scheduling, referral intake from pediatricians, early intervention and
  families with age-eligibility calculations, transition from early intervention
  with birthday-deadline eligibility determination, multidisciplinary evaluation
  across developmental domains with play-based assessment, eligibility
  determination and service setting decisions including community preschool
  placement, service minutes assignment, itinerant staffing and caseload
  planning, parent consent, notice and interpreter provision, kindergarten
  transition planning

domain_name: preschool-child-find
api_prefix: "/child-find"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  difficulty_level: expert
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Two independent hard cores that share the same entity graph. (1) Statutory
    compliance: consent-anchored evaluation deadlines capped by the child's
    third birthday for Part C transition cases, language-access (interpreter)
    gating on every parent notice, and a chair-vs-evaluator segregation rule.
    (2) Finite-capacity allocation: screening slots on a site window, IEP seats
    on a community preschool site, and two independent Provider capacity
    dimensions (weekly service minutes with travel overhead, and evaluation
    caseload). Referral carries two orthogonal state dimensions
    (intake_status x consent_status); EvaluationCase and ServiceLine both cycle;
    ServicePlan branches on service setting with divergent side effects.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Child
    parent: null
    common_fields: true
    fields:
      - name: first_name
        type: string
        source: input
        description: Child's given name.
        constraints: non-empty, max 80 chars
      - name: last_name
        type: string
        source: input
        description: Child's family name.
        constraints: non-empty, max 80 chars
      - name: date_of_birth
        type: string
        source: input
        description: Calendar date of birth, used for every age computation.
        constraints: "ISO date YYYY-MM-DD; must be strictly before the logical clock date"
      - name: guardian_full_name
        type: string
        source: input
        description: Name of the parent/guardian who holds educational rights.
        constraints: non-empty
      - name: district_of_residence
        type: string
        source: input
        description: District code of residence; child find obligation follows residence.
        constraints: non-empty, max 20 chars
      - name: primary_language_code
        type: string
        source: input
        default: "en"
        description: ISO 639-1 language of the home, drives notice and interpreter rules.
        constraints: "lowercase 2-letter code"
      - name: interpreter_required
        type: boolean
        source: computed
        description: "True exactly when primary_language_code != 'en'."
      - name: part_c_enrolled
        type: boolean
        source: input
        default: false
        description: Whether the child is currently served under early intervention (Part C).
      - name: part_c_exit_date
        type: string
        source: input
        default: null
        description: "Planned Part C exit date; required when part_c_enrolled is true."
        constraints: "ISO date YYYY-MM-DD"
      - name: third_birthday
        type: string
        source: computed
        description: "date_of_birth + 3 years; Feb-29 births map to Mar-01. Part B deadline anchor."
      - name: kindergarten_eligibility_date
        type: string
        source: computed
        description: "First September 1 on or after the child's fifth birthday."
      - name: status
        type: enum
        source: computed
        description: Derived child-find lifecycle position, evaluated by fixed precedence.
        constraints: "NO_ACTIVE_REFERRAL | REFERRED | IN_EVALUATION | NOT_ELIGIBLE | SERVED | SERVICES_DECLINED | EXITED_TO_KINDERGARTEN"

  - name: CommunityPreschoolSite
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Site name.
        constraints: non-empty
      - name: region_code
        type: string
        source: input
        description: Travel region the site belongs to.
        constraints: non-empty, max 20 chars
      - name: licensed_capacity
        type: integer
        source: input
        description: Total licensed enrollment of the community preschool.
        constraints: ">= 1"
      - name: iep_seat_capacity
        type: integer
        source: input
        description: Number of enrollment seats reserved for children with an IEP.
        constraints: ">= 1 and <= licensed_capacity"
      - name: reserved_iep_seat_count
        type: integer
        source: computed
        default: 0
        description: Live count of IEP seats currently held by non-terminal service plans.
      - name: languages_supported
        type: array
        source: input
        default: ["en"]
        description: ISO 639-1 codes the site can serve without external interpretation.
      - name: screening_host_approved
        type: boolean
        source: input
        default: false
        description: Whether the site is approved to host child find screening events.
      - name: status
        type: enum
        source: input
        default: ACTIVE
        description: Site availability for placement and screening hosting.
        constraints: "ACTIVE | INACTIVE"

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Staff member name.
        constraints: non-empty
      - name: discipline
        type: enum
        source: input
        description: Professional discipline; also selects which duties the provider may hold.
        constraints: "SCHOOL_PSYCHOLOGIST | SLP | OT | PT | ECSE_TEACHER | SOCIAL_WORKER | INTERPRETER"
      - name: languages
        type: array
        source: input
        default: ["en"]
        description: ISO 639-1 codes this provider can deliver service or interpretation in.
      - name: home_region_code
        type: string
        source: input
        description: Region the provider is based in.
        constraints: non-empty, max 20 chars
      - name: status
        type: enum
        source: input
        default: ACTIVE
        description: Employment availability.
        constraints: "ACTIVE | ON_LEAVE | INACTIVE"
      - name: max_weekly_service_minutes
        type: integer
        source: input
        default: 1500
        description: Hard ceiling on assigned_weekly_service_minutes.
        constraints: ">= 0, multiple of 5"
      - name: direct_weekly_service_minutes
        type: integer
        source: computed
        default: 0
        description: Sum of weekly_minutes across the provider's in-scope STAFFED service lines.
      - name: travel_overhead_minutes
        type: integer
        source: computed
        default: 0
        description: Travel loading added on top of direct minutes, tiered off direct minutes only.
      - name: assigned_weekly_service_minutes
        type: integer
        source: computed
        default: 0
        description: "direct_weekly_service_minutes + travel_overhead_minutes (PROJECTED variant)."
      - name: service_capacity_posture
        type: enum
        source: computed
        default: OPEN
        description: Utilisation band gating further staffing.
        constraints: "OPEN | NEAR_CAPACITY | AT_CAPACITY"
      - name: max_evaluation_caseload
        type: integer
        source: input
        default: 12
        description: Ceiling on the number of concurrently open evaluation cases.
        constraints: ">= 0"
      - name: active_evaluation_count
        type: integer
        source: computed
        default: 0
        description: Count of distinct non-terminal evaluation cases this provider chairs or assesses in.
      - name: evaluation_intake_posture
        type: enum
        source: computed
        default: OPEN
        description: Whether the provider may take on another evaluation case.
        constraints: "OPEN | AT_CAPACITY"
      - name: max_weekly_interpreter_assignments
        type: integer
        source: input
        default: 0
        description: Ceiling on open interpreter assignments; only meaningful when discipline is INTERPRETER.
        constraints: ">= 0"
      - name: assigned_interpreter_assignment_count
        type: integer
        source: computed
        default: 0
        description: Count of consent records naming this provider as interpreter with decision in {PENDING, GRANTED}.
      - name: is_evaluation_chair_eligible
        type: boolean
        source: computed
        description: "True exactly when discipline is in {SCHOOL_PSYCHOLOGIST, ECSE_TEACHER}."

  - name: ScreeningEvent
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> CommunityPreschoolSite.id; host site that the event window occupies."
      - name: event_label
        type: string
        source: input
        description: Public label used in outreach materials.
        constraints: non-empty
      - name: window_start_utc
        type: datetime
        source: input
        description: Inclusive start of the event occupation window on the site.
        constraints: "ISO 8601 UTC, three fractional digits"
      - name: window_end_utc
        type: datetime
        source: input
        description: Exclusive end of the event occupation window on the site.
        constraints: "ISO 8601 UTC; strictly after window_start_utc"
      - name: slot_length_minutes
        type: integer
        source: input
        default: 20
        description: Fixed duration of every screening slot in this event.
        constraints: "multiple of 5, between 10 and 60 inclusive"
      - name: slot_capacity
        type: integer
        source: input
        description: Staff-declared maximum number of children who may be booked.
        constraints: ">= 1"
      - name: effective_slot_capacity
        type: integer
        source: computed
        description: "min(slot_capacity, floor(window_minutes / slot_length_minutes))."
      - name: booked_slot_count
        type: integer
        source: computed
        default: 0
        description: Count of this event's slots whose status is in {BOOKED, ATTENDED, NO_SHOW}.
      - name: interpreter_languages
        type: array
        source: input
        default: []
        description: ISO 639-1 codes with on-site interpreter coverage during this event.
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: Event lifecycle; only OPEN accepts bookings.
        constraints: "SCHEDULED | OPEN | CLOSED | COMPLETED | CANCELLED"

  - name: ScreeningSlot
    parent: null
    common_fields: true
    fields:
      - name: screening_event_id
        type: string
        source: input
        description: "FK -> ScreeningEvent.id; the event this slot consumes capacity from."
      - name: child_id
        type: string
        source: input
        description: "FK -> Child.id; the child booked into the slot."
      - name: slot_start_utc
        type: datetime
        source: input
        description: Inclusive start of the child's screening appointment.
        constraints: "ISO 8601 UTC; must satisfy event containment"
      - name: slot_end_utc
        type: datetime
        source: computed
        description: "slot_start_utc + event.slot_length_minutes."
      - name: requested_language_code
        type: string
        source: input
        default: "en"
        description: Language the family requested for the screening encounter.
        constraints: "lowercase 2-letter code"
      - name: status
        type: enum
        source: system
        default: BOOKED
        description: Attendance lifecycle of the booked slot.
        constraints: "BOOKED | ATTENDED | NO_SHOW | CANCELLED"
      - name: screening_result
        type: enum
        source: computed
        default: null
        description: Outcome recorded when attendance is ATTENDED.
        constraints: "PASS | REFER | RESCREEN | null"

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: child_id
        type: string
        source: input
        description: "FK -> Child.id; subject of the referral."
      - name: source
        type: enum
        source: input
        description: Who initiated the referral.
        constraints: "PEDIATRICIAN | PART_C_TRANSITION | SCREENING | PARENT | SCHOOL"
      - name: referring_provider_npi
        type: string
        source: input
        default: null
        description: "National provider identifier of the referring pediatrician; required when source is PEDIATRICIAN."
        constraints: "exactly 10 digits when present"
      - name: originating_screening_slot_id
        type: string
        source: system
        default: null
        description: "FK -> ScreeningSlot.id; set by the system when the referral was auto-created from a REFER screening outcome."
      - name: received_at
        type: datetime
        source: system
        description: Logical-clock instant at which the referral entered the district's system.
      - name: age_months_at_referral
        type: integer
        source: computed
        description: Whole completed months between date_of_birth and date(received_at).
      - name: eligibility_pathway
        type: enum
        source: computed
        description: Which statutory timeline rule governs this referral.
        constraints: "PART_C_TRANSITION_DEADLINE | STANDARD_60_DAY | AGE_INELIGIBLE"
      - name: intake_status
        type: enum
        source: system
        default: RECEIVED
        description: First of two orthogonal state dimensions - the intake workflow position.
        constraints: "RECEIVED | CONSENT_PENDING | EVALUATION_AUTHORIZED | DECLINED | WITHDRAWN | SUPERSEDED"
      - name: consent_status
        type: enum
        source: system
        default: NOT_REQUESTED
        description: Second orthogonal state dimension - the parental consent position, advanced only by ConsentRecord decisions.
        constraints: "NOT_REQUESTED | REQUESTED | GRANTED | REFUSED | REVOKED"
      - name: consent_granted_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant at which evaluation consent was granted; anchor of the pinned due date.
      - name: evaluation_due_date
        type: string
        source: computed
        default: null
        description: Pinned statutory due date for completing the evaluation, null until consent is granted.
      - name: superseded_by_referral_id
        type: string
        source: system
        default: null
        description: "FK -> Referral.id; self-referential link to the later referral that displaced this one."

  - name: ConsentRecord
    parent: null
    common_fields: true
    fields:
      - name: referral_id
        type: string
        source: input
        description: "FK -> Referral.id; the referral whose consent/notice this record documents."
      - name: kind
        type: enum
        source: system
        description: Which consent this record seeks; set by the creating endpoint, never by the client.
        constraints: "EVALUATION_CONSENT | SERVICE_CONSENT"
      - name: requested_at
        type: datetime
        source: system
        description: Logical-clock instant the prior written notice was issued.
      - name: decision
        type: enum
        source: system
        default: PENDING
        description: Parent's decision on this consent request.
        constraints: "PENDING | GRANTED | REFUSED | REVOKED"
      - name: decided_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of the most recent decision transition.
      - name: notice_language_code
        type: string
        source: input
        description: Language the prior written notice was delivered in.
        constraints: "lowercase 2-letter code"
      - name: notice_delivery_method
        type: enum
        source: input
        description: How the notice reached the guardian.
        constraints: "HAND_DELIVERY | MAIL | EMAIL | INTERPRETED_ORAL"
      - name: interpreter_provider_id
        type: string
        source: input
        default: null
        description: "FK -> Provider.id; the INTERPRETER-discipline provider supplying language access for this notice."
      - name: interpreter_modality
        type: enum
        source: input
        default: null
        description: Delivery channel of the interpretation.
        constraints: "IN_PERSON | TELEPHONIC | VIDEO | null"
      - name: service_plan_id
        type: string
        source: system
        default: null
        description: "FK -> ServicePlan.id; set only on SERVICE_CONSENT records, naming the plan awaiting consent."

  - name: EvaluationCase
    parent: null
    common_fields: true
    fields:
      - name: referral_id
        type: string
        source: input
        description: "FK -> Referral.id; the consented referral that authorised this evaluation."
      - name: child_id
        type: string
        source: system
        description: "FK -> Child.id; copied from the referral at creation, immutable thereafter."
      - name: chair_provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the multidisciplinary team chair; must be chair-eligible and may not assess any domain on this case."
      - name: assessment_protocol
        type: enum
        source: input
        description: Selects which composite delay variant is pinned for this case.
        constraints: "STANDARDIZED | PLAY_BASED"
      - name: required_domain_count
        type: integer
        source: system
        default: 5
        description: Number of distinct developmental domains that must be completed before determination.
      - name: completed_domain_count
        type: integer
        source: computed
        default: 0
        description: Count of distinct domains with a COMPLETED assessment on this case.
      - name: qualifying_domain_count
        type: integer
        source: computed
        default: 0
        description: Count of domains whose weighted_percent_delay reaches DELAY_QUALIFY_PCT under the pinned variant.
      - name: max_weighted_percent_delay
        type: number
        source: computed
        default: null
        description: Largest weighted_percent_delay among the domains entering the pinned variant.
      - name: composite_eligibility_recommendation
        type: enum
        source: computed
        default: INDETERMINATE
        description: Team recommendation derived from the pinned composite variant.
        constraints: "ELIGIBLE_RECOMMENDED | NOT_ELIGIBLE_RECOMMENDED | INDETERMINATE"
      - name: recommended_weekly_minutes
        type: integer
        source: computed
        default: 0
        description: Service-minute recommendation from the pinned per-line rounding order.
      - name: revision_round
        type: integer
        source: computed
        default: 0
        description: Number of completed revision cycles on the evaluation report.
      - name: report_narrative_summary
        type: string
        source: computed
        default: null
        description: Narrative text supplied by the chair on the most recent report draft.
      - name: report_drafted_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of the most recent report draft.
      - name: last_revision_note
        type: string
        source: computed
        default: null
        description: Reviewer note attached to the most recent revision request.
      - name: due_date
        type: string
        source: computed
        default: null
        description: Denormalised copy of the parent referral's evaluation_due_date, re-derived on every referral consent change.
      - name: timeline_compliance
        type: enum
        source: computed
        default: ON_TIME
        description: Deadline posture derived from the logical clock against due_date.
        constraints: "ON_TIME | AT_RISK | OVERDUE"
      - name: status
        type: enum
        source: system
        default: PLANNED
        description: Evaluation lifecycle; cycles between report drafting and revision.
        constraints: "PLANNED | IN_PROGRESS | DOMAINS_COMPLETE | REPORT_DRAFTED | REVISIONS_REQUESTED | ELIGIBILITY_DETERMINED | CANCELLED"

  - name: DomainAssessment
    parent: null
    common_fields: true
    fields:
      - name: evaluation_case_id
        type: string
        source: input
        description: "FK -> EvaluationCase.id; the case this domain assessment belongs to."
      - name: evaluator_provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the assessing team member, who occupies the window on their own calendar."
      - name: assessment_site_id
        type: string
        source: input
        default: null
        description: "FK -> CommunityPreschoolSite.id; where the assessment takes place; null means the district assessment centre."
      - name: domain
        type: enum
        source: input
        description: Developmental domain assessed.
        constraints: "COGNITIVE | COMMUNICATION | PHYSICAL_MOTOR | SOCIAL_EMOTIONAL | ADAPTIVE"
      - name: method
        type: enum
        source: input
        description: Assessment method; determines whether and how the result enters each composite variant.
        constraints: "STANDARDIZED | PLAY_BASED | OBSERVATION | PARENT_REPORT"
      - name: window_start_utc
        type: datetime
        source: input
        description: Inclusive start of the evaluator's occupation window.
        constraints: "ISO 8601 UTC, three fractional digits"
      - name: window_end_utc
        type: datetime
        source: input
        description: Exclusive end of the evaluator's occupation window.
        constraints: "ISO 8601 UTC; strictly after window_start_utc"
      - name: chronological_age_months
        type: integer
        source: computed
        description: Whole completed months between the child's date_of_birth and date(window_start_utc).
      - name: age_equivalent_months
        type: integer
        source: input
        default: null
        description: Developmental age equivalent in months; required at completion.
        constraints: ">= 0 and <= chronological_age_months"
      - name: standard_score
        type: number
        source: input
        default: null
        description: Norm-referenced standard score when the method is STANDARDIZED.
        constraints: ">= 0"
      - name: percent_delay
        type: number
        source: computed
        default: null
        description: Unweighted percentage delay, one decimal place.
      - name: weighted_percent_delay
        type: number
        source: computed
        default: null
        description: percent_delay after the pinned variant's method weighting; null when the method is excluded by the pinned variant.
      - name: qualifies_delay
        type: boolean
        source: computed
        default: false
        description: True exactly when weighted_percent_delay is non-null and reaches DELAY_QUALIFY_PCT.
      - name: invalidation_reason
        type: string
        source: computed
        default: null
        description: Chair-supplied reason recorded when the assessment is invalidated.
      - name: completed_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant the assessment was completed.
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: Assessment lifecycle.
        constraints: "SCHEDULED | COMPLETED | INVALIDATED"

  - name: ServicePlan
    parent: null
    common_fields: true
    fields:
      - name: evaluation_case_id
        type: string
        source: input
        description: "FK -> EvaluationCase.id; the determination this plan records."
      - name: child_id
        type: string
        source: system
        description: "FK -> Child.id; copied from the evaluation case at creation."
      - name: community_site_id
        type: string
        source: input
        default: null
        description: "FK -> CommunityPreschoolSite.id; the community preschool holding the child's IEP seat; must be null unless setting is COMMUNITY_PRESCHOOL."
      - name: eligibility_decision
        type: enum
        source: input
        description: The team's determination of Part B eligibility.
        constraints: "ELIGIBLE | NOT_ELIGIBLE"
      - name: disability_category
        type: enum
        source: input
        default: null
        description: Statutory category; required when eligibility_decision is ELIGIBLE.
        constraints: "DEVELOPMENTAL_DELAY | SPEECH_OR_LANGUAGE_IMPAIRMENT | OTHER_HEALTH_IMPAIRMENT | null"
      - name: setting
        type: enum
        source: input
        default: null
        description: Least-restrictive-environment decision; required when eligibility_decision is ELIGIBLE.
        constraints: "COMMUNITY_PRESCHOOL | DISTRICT_ECSE_CLASSROOM | HOME_BASED | ITINERANT_ONLY | null"
      - name: override_justification
        type: string
        source: input
        default: null
        description: Written rationale required when eligibility_decision contradicts the composite recommendation.
      - name: recommended_weekly_minutes
        type: integer
        source: computed
        default: 0
        description: Copied from the evaluation case at creation, for comparison against assigned minutes.
      - name: assigned_weekly_minutes
        type: integer
        source: computed
        default: 0
        description: Sum of weekly_minutes over this plan's lines whose status is in {PROPOSED, STAFFED, UNSTAFFED}.
      - name: determined_by_user_id
        type: string
        source: system
        description: X-User-ID of the placement administrator who recorded the determination.
      - name: start_date
        type: string
        source: computed
        default: null
        description: Logical-clock date on which the plan became ACTIVE.
      - name: exit_date
        type: string
        source: computed
        default: null
        description: Logical-clock date on which the plan exited to kindergarten.
      - name: kindergarten_transition_status
        type: enum
        source: computed
        default: NOT_STARTED
        description: Progress of the kindergarten transition workflow.
        constraints: "NOT_STARTED | CONFERENCE_SCHEDULED | PACKET_SENT | COMPLETE"
      - name: transition_conference_date
        type: string
        source: computed
        default: null
        description: Scheduled date of the kindergarten transition conference.
      - name: receiving_school_code
        type: string
        source: computed
        default: null
        description: Code of the receiving elementary school the transition packet was sent to.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Plan lifecycle; branches at consent submission on the chosen setting.
        constraints: "DRAFT | PENDING_PARENT_CONSENT | ACTIVE | DECLINED | EXITED_TO_KINDERGARTEN | SUPERSEDED | CLOSED_NOT_ELIGIBLE"

  - name: ServiceLine
    parent: null
    common_fields: true
    fields:
      - name: service_plan_id
        type: string
        source: input
        description: "FK -> ServicePlan.id; the plan this service line belongs to."
      - name: provider_id
        type: string
        source: system
        default: null
        description: "FK -> Provider.id; the itinerant provider staffed to this line; null while PROPOSED or UNSTAFFED."
      - name: delivery_site_id
        type: string
        source: input
        default: null
        description: "FK -> CommunityPreschoolSite.id; where the minutes are actually delivered, supplied at staffing time because an itinerant provider may serve a child at a partner site. Defaults to the parent plan's community_site_id when omitted; null means the district centre and is the only legal value for non-community settings."
      - name: discipline
        type: enum
        source: input
        description: Discipline the minutes are drawn from; must match the staffed provider's discipline.
        constraints: "SLP | OT | PT | ECSE_TEACHER | SOCIAL_WORKER"
      - name: weekly_minutes
        type: integer
        source: input
        description: Direct service minutes per week assigned to this line.
        constraints: "multiple of 5, between 5 and 600 inclusive"
      - name: delivery_model
        type: enum
        source: input
        description: How the minutes are delivered.
        constraints: "DIRECT | CONSULT | PUSH_IN"
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: Staffing lifecycle; may cycle between STAFFED and UNSTAFFED.
        constraints: "PROPOSED | STAFFED | UNSTAFFED | DISCONTINUED"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ScreeningEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /child-find/screening-events/{id}/status with to_status=OPEN"
        actor: ChildFindCoordinator
        preconditions:
          - "site.status == ACTIVE"
          - "site.screening_host_approved == true"
          - "logical clock < window_end_utc"
        side_effects:
          - "status := OPEN"
          - "increments ScreeningEvent.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /child-find/screening-events/{id}/status with to_status=CLOSED"
        actor: ChildFindCoordinator
        preconditions: ["none beyond from-state"]
        side_effects:
          - "status := CLOSED; further slot bookings are rejected with ERR_INVALID_EVENT_STATE"
          - "increments ScreeningEvent.version by 1"
      - from: CLOSED
        to: COMPLETED
        trigger: "POST /child-find/screening-events/{id}/status with to_status=COMPLETED"
        actor: ChildFindCoordinator
        preconditions:
          - "every ScreeningSlot with screening_event_id == this event has status IN {ATTENDED, NO_SHOW, CANCELLED} (no slot left in BOOKED), else ERR_SCREENING_SLOTS_UNRESOLVED"
        side_effects:
          - "status := COMPLETED"
          - "increments ScreeningEvent.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /child-find/screening-events/{id}/status with to_status=CANCELLED"
        actor: ChildFindCoordinator
        preconditions: ["none beyond from-state"]
        side_effects:
          - "status := CANCELLED"
          - "increments ScreeningEvent.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /child-find/screening-events/{id}/status with to_status=CANCELLED"
        actor: ChildFindCoordinator
        preconditions: ["none beyond from-state"]
        side_effects:
          - "status := CANCELLED"
          - "conditional cascade: every ScreeningSlot of this event with status == BOOKED transitions BOOKED -> CANCELLED; slots already ATTENDED/NO_SHOW/CANCELLED are untouched"
          - "booked_slot_count recomputed (drops to the count of ATTENDED + NO_SHOW slots)"
          - "increments ScreeningEvent.version by 1"
      - from: CLOSED
        to: CANCELLED
        trigger: "POST /child-find/screening-events/{id}/status with to_status=CANCELLED"
        actor: ChildFindCoordinator
        preconditions: ["none beyond from-state"]
        side_effects:
          - "status := CANCELLED"
          - "conditional cascade: every ScreeningSlot of this event with status == BOOKED transitions BOOKED -> CANCELLED"
          - "increments ScreeningEvent.version by 1"

  - entity: ScreeningSlot
    initial_state: BOOKED
    terminal_states: [ATTENDED, NO_SHOW, CANCELLED]
    transitions:
      - from: BOOKED
        to: ATTENDED
        trigger: "POST /child-find/screening-slots/{id}/outcome with attendance=ATTENDED"
        actor: ChildFindCoordinator
        preconditions:
          - "screening_result is supplied and is one of {PASS, REFER, RESCREEN}, else ERR_INVALID_REQUEST"
          - "parent ScreeningEvent.status IN {OPEN, CLOSED}, else ERR_INVALID_EVENT_STATE"
        side_effects:
          - "status := ATTENDED; screening_result := supplied value"
          - "when screening_result == REFER: the system creates a Referral for slot.child_id with source=SCREENING, originating_screening_slot_id := this slot, received_at := logical clock (see the Referral RECEIVED entry side effects for the onward chain)"
          - "increments ScreeningSlot.version by 1"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /child-find/screening-slots/{id}/outcome with attendance=NO_SHOW"
        actor: ChildFindCoordinator
        preconditions: ["parent ScreeningEvent.status IN {OPEN, CLOSED}"]
        side_effects:
          - "status := NO_SHOW; screening_result stays null"
          - "increments ScreeningSlot.version by 1"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /child-find/screening-slots/{id}/outcome with attendance=CANCELLED, or cascade from ScreeningEvent OPEN/CLOSED -> CANCELLED"
        actor: ChildFindCoordinator | system
        preconditions: ["none beyond from-state"]
        side_effects:
          - "status := CANCELLED"
          - "parent ScreeningEvent.booked_slot_count recomputed (cancelled slots leave the count)"
          - "increments ScreeningSlot.version by 1"

  - entity: Referral
    dimension: intake_status
    initial_state: RECEIVED
    terminal_states: [DECLINED, WITHDRAWN, SUPERSEDED]
    note: |
      Referral carries two orthogonal state dimensions on the same row.
      This machine governs intake_status; the machine below governs
      consent_status. The two advance independently: a referral may sit at
      intake_status=CONSENT_PENDING with consent_status=REQUESTED, and any
      consent decision drives both dimensions in the same request.
    transitions:
      - from: RECEIVED
        to: CONSENT_PENDING
        trigger: "POST /child-find/referrals/{id}/consent-requests"
        actor: ChildFindCoordinator
        preconditions:
          - "eligibility_pathway != AGE_INELIGIBLE"
          - "consent_status == NOT_REQUESTED, else ERR_CONSENT_ALREADY_REQUESTED"
        side_effects:
          - "intake_status := CONSENT_PENDING"
          - "consent_status := REQUESTED (consent dimension advances in the same request)"
          - "a ConsentRecord with kind=EVALUATION_CONSENT, decision=PENDING is created"
          - "the named interpreter Provider's assigned_interpreter_assignment_count is recomputed"
          - "increments Referral.version by 1"
      - from: CONSENT_PENDING
        to: EVALUATION_AUTHORIZED
        trigger: "POST /child-find/consent-records/{id}/decision with decision=GRANTED on the EVALUATION_CONSENT record"
        actor: Parent
        preconditions: ["the granting ConsentRecord.kind == EVALUATION_CONSENT and its decision == PENDING"]
        side_effects:
          - "intake_status := EVALUATION_AUTHORIZED"
          - "consent_status := GRANTED; consent_granted_at := logical clock"
          - "evaluation_due_date recomputed via calculations.referral_evaluation_due_date (pinned CONSENT_ANCHORED variant with the Part C third-birthday cap)"
          - "increments Referral.version by 1"
      - from: CONSENT_PENDING
        to: DECLINED
        trigger: "POST /child-find/consent-records/{id}/decision with decision=REFUSED on the EVALUATION_CONSENT record"
        actor: Parent
        preconditions: ["the refusing ConsentRecord.kind == EVALUATION_CONSENT and its decision == PENDING"]
        side_effects:
          - "intake_status := DECLINED; consent_status := REFUSED"
          - "evaluation_due_date stays null"
          - "the named interpreter Provider's assigned_interpreter_assignment_count is recomputed (a REFUSED record no longer occupies an interpreter assignment)"
          - "increments Referral.version by 1"
      - from: RECEIVED
        to: DECLINED
        trigger: "system, immediately after a SCREENING-sourced referral is auto-created whose eligibility_pathway computes to AGE_INELIGIBLE"
        actor: system
        preconditions: ["source == SCREENING and eligibility_pathway == AGE_INELIGIBLE"]
        side_effects:
          - "intake_status := DECLINED; consent_status stays NOT_REQUESTED"
          - "increments Referral.version by 1"
      - from: EVALUATION_AUTHORIZED
        to: WITHDRAWN
        trigger: "POST /child-find/consent-records/{id}/decision with decision=REVOKED on the EVALUATION_CONSENT record"
        actor: Parent
        preconditions: ["the revoking ConsentRecord.kind == EVALUATION_CONSENT and its decision == GRANTED"]
        side_effects:
          - "intake_status := WITHDRAWN; consent_status := REVOKED"
          - "cascade hop 2: the EvaluationCase whose referral_id == this referral, when its status is NOT IN {ELIGIBILITY_DETERMINED, CANCELLED}, transitions to CANCELLED (see the EvaluationCase machine for hops 3 and 4)"
          - "increments Referral.version by 1"
      - from: RECEIVED
        to: SUPERSEDED
        trigger: "system, when a newer Referral is created for the same child_id"
        actor: system
        preconditions: ["a newer Referral for the same child_id was just created"]
        side_effects:
          - "intake_status := SUPERSEDED; superseded_by_referral_id := the new referral's id"
          - "increments Referral.version by 1"
      - from: CONSENT_PENDING
        to: SUPERSEDED
        trigger: "system, when a newer Referral is created for the same child_id"
        actor: system
        preconditions: ["a newer Referral for the same child_id was just created"]
        side_effects:
          - "intake_status := SUPERSEDED; superseded_by_referral_id := the new referral's id"
          - "any ConsentRecord on this referral whose decision == PENDING transitions PENDING -> REFUSED"
          - "increments Referral.version by 1"
      - from: EVALUATION_AUTHORIZED
        to: SUPERSEDED
        trigger: "system, when a newer Referral is created for the same child_id"
        actor: system
        preconditions: ["a newer Referral for the same child_id was just created"]
        side_effects:
          - "intake_status := SUPERSEDED; superseded_by_referral_id := the new referral's id"
          - "the EvaluationCase whose referral_id == this referral, when its status is NOT IN {ELIGIBILITY_DETERMINED, CANCELLED}, transitions to CANCELLED"
          - "increments Referral.version by 1"

  - entity: Referral
    dimension: consent_status
    initial_state: NOT_REQUESTED
    terminal_states: [REFUSED, REVOKED]
    note: |
      Parallel dimension on the same Referral row. NOT_REQUESTED -> REQUESTED is
      driven by notice issuance; REQUESTED -> GRANTED/REFUSED and
      GRANTED -> REVOKED are driven only by ConsentRecord decisions on the
      EVALUATION_CONSENT record. SERVICE_CONSENT decisions never touch this
      dimension - they drive the ServicePlan machine instead.
    transitions:
      - from: NOT_REQUESTED
        to: REQUESTED
        trigger: "POST /child-find/referrals/{id}/consent-requests"
        actor: ChildFindCoordinator
        preconditions: ["intake_status == RECEIVED"]
        side_effects: ["consent_status := REQUESTED"]
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /child-find/consent-records/{id}/decision with decision=GRANTED (kind=EVALUATION_CONSENT)"
        actor: Parent
        preconditions: ["intake_status == CONSENT_PENDING"]
        side_effects:
          - "consent_status := GRANTED; consent_granted_at := logical clock"
          - "evaluation_due_date recomputed"
      - from: REQUESTED
        to: REFUSED
        trigger: "POST /child-find/consent-records/{id}/decision with decision=REFUSED (kind=EVALUATION_CONSENT)"
        actor: Parent
        preconditions: ["intake_status == CONSENT_PENDING"]
        side_effects: ["consent_status := REFUSED"]
      - from: GRANTED
        to: REVOKED
        trigger: "POST /child-find/consent-records/{id}/decision with decision=REVOKED (kind=EVALUATION_CONSENT)"
        actor: Parent
        preconditions: ["intake_status == EVALUATION_AUTHORIZED"]
        side_effects:
          - "consent_status := REVOKED"
          - "evaluation_due_date is retained as the historical deadline (not cleared)"

  - entity: ConsentRecord
    initial_state: PENDING
    terminal_states: [REFUSED, REVOKED]
    note: |
      GRANTED is non-terminal for kind=EVALUATION_CONSENT (revocable) and
      absorbing for kind=SERVICE_CONSENT (a granted service consent cannot be
      revoked; the plan must instead exit to kindergarten).
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /child-find/consent-records/{id}/decision with decision=GRANTED"
        actor: Parent
        preconditions:
          - "X-User-ID equals the Child.id reached through referral_id -> Referral.child_id, else ERR_NOT_CHILD_GUARDIAN"
        side_effects:
          - "decision := GRANTED; decided_at := logical clock"
          - "when kind == EVALUATION_CONSENT: Referral CONSENT_PENDING -> EVALUATION_AUTHORIZED and consent_status REQUESTED -> GRANTED"
          - "when kind == SERVICE_CONSENT: the ServicePlan named by service_plan_id transitions PENDING_PARENT_CONSENT -> ACTIVE"
          - "increments ConsentRecord.version by 1"
      - from: PENDING
        to: REFUSED
        trigger: "POST /child-find/consent-records/{id}/decision with decision=REFUSED, or cascade when the parent Referral is SUPERSEDED"
        actor: Parent | system
        preconditions:
          - "X-User-ID equals the Child.id reached through referral_id -> Referral.child_id (guardian path only)"
        side_effects:
          - "decision := REFUSED; decided_at := logical clock"
          - "when kind == EVALUATION_CONSENT: Referral CONSENT_PENDING -> DECLINED and consent_status REQUESTED -> REFUSED"
          - "when kind == SERVICE_CONSENT: cascade hop 1 - the ServicePlan named by service_plan_id transitions PENDING_PARENT_CONSENT -> DECLINED"
          - "the named interpreter Provider's assigned_interpreter_assignment_count is recomputed"
          - "increments ConsentRecord.version by 1"
      - from: GRANTED
        to: REVOKED
        trigger: "POST /child-find/consent-records/{id}/decision with decision=REVOKED"
        actor: Parent
        preconditions:
          - "kind == EVALUATION_CONSENT, else ERR_CONSENT_NOT_REVOCABLE"
          - "X-User-ID equals the Child.id reached through referral_id -> Referral.child_id"
        side_effects:
          - "decision := REVOKED; decided_at := logical clock"
          - "cascade hop 1: Referral EVALUATION_AUTHORIZED -> WITHDRAWN and consent_status GRANTED -> REVOKED"
          - "the named interpreter Provider's assigned_interpreter_assignment_count is recomputed"
          - "increments ConsentRecord.version by 1"

  - entity: EvaluationCase
    initial_state: PLANNED
    terminal_states: [CANCELLED]
    note: |
      Non-linear on two counts: the REPORT_DRAFTED <-> REVISIONS_REQUESTED
      revision loop, and the DOMAINS_COMPLETE -> IN_PROGRESS reversion when a
      completed assessment is invalidated. ELIGIBILITY_DETERMINED is absorbing
      except for its own self-loop when a superseding ServicePlan is created.
      The reversion edge exists ONLY from DOMAINS_COMPLETE: invalidating a
      COMPLETED assessment while the case is REPORT_DRAFTED or
      REVISIONS_REQUESTED leaves the status untouched (the drafted report is not
      retracted) but drops completed_domain_count below required_domain_count,
      which is the only reachable way to make eligibility determination fail
      with ERR_DOMAINS_INCOMPLETE.
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "system, on the first successful POST /child-find/evaluation-cases/{id}/domain-assessments"
        actor: system
        preconditions: ["at least one DomainAssessment now exists with status == SCHEDULED"]
        side_effects:
          - "status := IN_PROGRESS"
          - "increments EvaluationCase.version by 1"
      - from: IN_PROGRESS
        to: DOMAINS_COMPLETE
        trigger: "system, on POST /child-find/domain-assessments/{id}/completion when the last required domain completes"
        actor: system
        preconditions: ["completed_domain_count == required_domain_count (5 distinct domains COMPLETED)"]
        side_effects:
          - "status := DOMAINS_COMPLETE"
          - "qualifying_domain_count, max_weighted_percent_delay, composite_eligibility_recommendation and recommended_weekly_minutes recomputed via calculations.evaluation_composite_delay_profile and calculations.service_minutes_recommendation"
          - "increments EvaluationCase.version by 1"
      - from: DOMAINS_COMPLETE
        to: IN_PROGRESS
        trigger: "system, on POST /child-find/domain-assessments/{id}/invalidation of a COMPLETED assessment"
        actor: system
        preconditions: ["completed_domain_count < required_domain_count after the invalidation"]
        side_effects:
          - "status := IN_PROGRESS (bubble-up reversion)"
          - "composite_eligibility_recommendation recomputed to INDETERMINATE"
          - "increments EvaluationCase.version by 1"
      - from: DOMAINS_COMPLETE
        to: REPORT_DRAFTED
        trigger: "POST /child-find/evaluation-cases/{id}/report"
        actor: EvaluationChair
        preconditions:
          - "X-User-ID == chair_provider_id, else ERR_NOT_CASE_CHAIR"
          - "completed_domain_count == required_domain_count"
        side_effects:
          - "status := REPORT_DRAFTED; report_narrative_summary := supplied narrative; report_drafted_at := logical clock"
          - "increments EvaluationCase.version by 1"
      - from: REPORT_DRAFTED
        to: REVISIONS_REQUESTED
        trigger: "POST /child-find/evaluation-cases/{id}/revision-requests"
        actor: PlacementAdministrator
        preconditions:
          - "revision_round < MAX_REVISION_ROUNDS (2), else ERR_REVISION_LIMIT_REACHED"
        side_effects:
          - "status := REVISIONS_REQUESTED; revision_round := revision_round + 1; last_revision_note := supplied note"
          - "increments EvaluationCase.version by 1"
      - from: REVISIONS_REQUESTED
        to: REPORT_DRAFTED
        trigger: "POST /child-find/evaluation-cases/{id}/report"
        actor: EvaluationChair
        preconditions:
          - "X-User-ID == chair_provider_id"
          - "completed_domain_count == required_domain_count"
        side_effects:
          - "status := REPORT_DRAFTED; report_narrative_summary replaced; report_drafted_at := logical clock (revision loop closes here)"
          - "increments EvaluationCase.version by 1"
      - from: REPORT_DRAFTED
        to: ELIGIBILITY_DETERMINED
        trigger: "POST /child-find/evaluation-cases/{id}/service-plans"
        actor: PlacementAdministrator
        preconditions:
          - "expected_evaluation_case_version equals the case's current version, else ERR_STALE_EVALUATION_CASE_VERSION"
          - "completed_domain_count == required_domain_count, else ERR_DOMAINS_INCOMPLETE"
        side_effects:
          - "status := ELIGIBILITY_DETERMINED"
          - "a ServicePlan is created in DRAFT with recommended_weekly_minutes copied from this case"
          - "when eligibility_decision == NOT_ELIGIBLE the new plan immediately auto-transitions DRAFT -> CLOSED_NOT_ELIGIBLE"
          - "increments EvaluationCase.version by 1"
      - from: ELIGIBILITY_DETERMINED
        to: ELIGIBILITY_DETERMINED
        trigger: "POST /child-find/evaluation-cases/{id}/service-plans (superseding determination)"
        actor: PlacementAdministrator
        preconditions:
          - "expected_evaluation_case_version equals the case's current version, else ERR_STALE_EVALUATION_CASE_VERSION"
          - "the existing ServicePlan on this case has status == DRAFT, else ERR_INVALID_PLAN_STATE"
        side_effects:
          - "the existing DRAFT ServicePlan transitions DRAFT -> SUPERSEDED and every one of its lines transitions to DISCONTINUED"
          - "a new ServicePlan is created in DRAFT"
          - "increments EvaluationCase.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "system, cascade from Referral -> WITHDRAWN or Referral -> SUPERSEDED"
        actor: system
        preconditions: ["parent Referral.intake_status IN {WITHDRAWN, SUPERSEDED}"]
        side_effects:
          - "status := CANCELLED"
          - "increments EvaluationCase.version by 1"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system, cascade from Referral -> WITHDRAWN or Referral -> SUPERSEDED"
        actor: system
        preconditions: ["parent Referral.intake_status IN {WITHDRAWN, SUPERSEDED}"]
        side_effects:
          - "status := CANCELLED"
          - "cascade hop 3: every DomainAssessment of this case with status IN {SCHEDULED, COMPLETED} transitions to INVALIDATED with invalidation_reason='CASE_CANCELLED'"
          - "increments EvaluationCase.version by 1"
      - from: DOMAINS_COMPLETE
        to: CANCELLED
        trigger: "system, cascade from Referral -> WITHDRAWN or Referral -> SUPERSEDED"
        actor: system
        preconditions: ["parent Referral.intake_status IN {WITHDRAWN, SUPERSEDED}"]
        side_effects:
          - "status := CANCELLED"
          - "every DomainAssessment of this case with status IN {SCHEDULED, COMPLETED} transitions to INVALIDATED"
          - "increments EvaluationCase.version by 1"
      - from: REPORT_DRAFTED
        to: CANCELLED
        trigger: "system, cascade from Referral -> WITHDRAWN or Referral -> SUPERSEDED"
        actor: system
        preconditions: ["parent Referral.intake_status IN {WITHDRAWN, SUPERSEDED}"]
        side_effects:
          - "status := CANCELLED"
          - "every DomainAssessment of this case with status IN {SCHEDULED, COMPLETED} transitions to INVALIDATED"
          - "increments EvaluationCase.version by 1"
      - from: REVISIONS_REQUESTED
        to: CANCELLED
        trigger: "system, cascade from Referral -> WITHDRAWN or Referral -> SUPERSEDED"
        actor: system
        preconditions: ["parent Referral.intake_status IN {WITHDRAWN, SUPERSEDED}"]
        side_effects:
          - "status := CANCELLED"
          - "every DomainAssessment of this case with status IN {SCHEDULED, COMPLETED} transitions to INVALIDATED"
          - "increments EvaluationCase.version by 1"

  - entity: DomainAssessment
    initial_state: SCHEDULED
    terminal_states: [INVALIDATED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /child-find/domain-assessments/{id}/completion"
        actor: Evaluator
        preconditions:
          - "X-User-ID == evaluator_provider_id, else ERR_NOT_ASSIGNED_EVALUATOR"
          - "parent EvaluationCase.status IN {IN_PROGRESS, DOMAINS_COMPLETE}, else ERR_INVALID_CASE_STATE"
          - "age_equivalent_months is supplied and <= chronological_age_months, else ERR_INVALID_REQUEST"
        side_effects:
          - "status := COMPLETED; completed_at := logical clock"
          - "percent_delay, weighted_percent_delay and qualifies_delay computed via calculations.domain_percent_delay"
          - "parent EvaluationCase completed_domain_count, qualifying_domain_count, max_weighted_percent_delay, composite_eligibility_recommendation and recommended_weekly_minutes recomputed"
          - "parent EvaluationCase may auto-transition IN_PROGRESS -> DOMAINS_COMPLETE"
          - "increments DomainAssessment.version by 1"
      - from: SCHEDULED
        to: INVALIDATED
        trigger: "POST /child-find/domain-assessments/{id}/invalidation, or cascade from EvaluationCase -> CANCELLED"
        actor: EvaluationChair | system
        preconditions:
          - "X-User-ID == parent EvaluationCase.chair_provider_id (chair path only)"
        side_effects:
          - "status := INVALIDATED; invalidation_reason := supplied reason"
          - "cascade hop 4: the evaluator Provider's active_evaluation_count is recomputed, which in turn re-derives evaluation_intake_posture"
          - "increments DomainAssessment.version by 1"
      - from: COMPLETED
        to: INVALIDATED
        trigger: "POST /child-find/domain-assessments/{id}/invalidation, or cascade from EvaluationCase -> CANCELLED"
        actor: EvaluationChair | system
        preconditions:
          - "X-User-ID == parent EvaluationCase.chair_provider_id (chair path only)"
          - "parent EvaluationCase.status != ELIGIBILITY_DETERMINED, else ERR_INVALID_CASE_STATE"
        side_effects:
          - "status := INVALIDATED; invalidation_reason := supplied reason; percent_delay, weighted_percent_delay and qualifies_delay are retained as historical values but stop entering the case aggregates"
          - "parent EvaluationCase aggregates recomputed; the case may revert DOMAINS_COMPLETE -> IN_PROGRESS"
          - "the evaluator Provider's active_evaluation_count and evaluation_intake_posture recomputed"
          - "increments DomainAssessment.version by 1"

  - entity: ServicePlan
    initial_state: DRAFT
    terminal_states: [DECLINED, EXITED_TO_KINDERGARTEN, SUPERSEDED, CLOSED_NOT_ELIGIBLE]
    note: |
      Branching fork-join: DRAFT forks at consent submission on `setting` into
      four branches with divergent side-effect sets (COMMUNITY_PRESCHOOL
      reserves an IEP seat on the named site; DISTRICT_ECSE_CLASSROOM requires a
      STAFFED ECSE_TEACHER line and reserves no seat; HOME_BASED requires a
      STAFFED DIRECT line; ITINERANT_ONLY requires any STAFFED line). All four
      branches join at PENDING_PARENT_CONSENT and then at ACTIVE.
    transitions:
      - from: DRAFT
        to: CLOSED_NOT_ELIGIBLE
        trigger: "system, immediately on creation when eligibility_decision == NOT_ELIGIBLE"
        actor: system
        preconditions: ["eligibility_decision == NOT_ELIGIBLE"]
        side_effects:
          - "status := CLOSED_NOT_ELIGIBLE"
          - "Child.status recomputed to NOT_ELIGIBLE via calculations.child_status_precedence"
          - "increments ServicePlan.version by 1"
      - from: DRAFT
        to: PENDING_PARENT_CONSENT
        trigger: "POST /child-find/service-plans/{id}/consent-submission"
        actor: PlacementAdministrator
        preconditions:
          - "eligibility_decision == ELIGIBLE and setting is non-null, else ERR_INVALID_PLAN_STATE"
          - "at least one ServiceLine of this plan has status == STAFFED, else ERR_PLAN_SETTING_REQUIREMENTS_UNMET"
          - "branch COMMUNITY_PRESCHOOL: community_site_id is non-null, that site's status == ACTIVE and child.primary_language_code IN site.languages_supported (else ERR_SITE_NOT_ELIGIBLE), and reserved_iep_seat_count + 1 <= iep_seat_capacity (else ERR_IEP_SEAT_CAPACITY_EXCEEDED)"
          - "branch DISTRICT_ECSE_CLASSROOM: community_site_id is null and at least one STAFFED line has discipline == ECSE_TEACHER, else ERR_PLAN_SETTING_REQUIREMENTS_UNMET"
          - "branch HOME_BASED: community_site_id is null and at least one STAFFED line has delivery_model == DIRECT, else ERR_PLAN_SETTING_REQUIREMENTS_UNMET"
          - "branch ITINERANT_ONLY: community_site_id is null, else ERR_PLAN_SETTING_REQUIREMENTS_UNMET"
          - "language-access rule of validations[priority=14] holds for the service notice"
        side_effects:
          - "status := PENDING_PARENT_CONSENT"
          - "a ConsentRecord with kind=SERVICE_CONSENT, decision=PENDING, service_plan_id := this plan and referral_id := the case's referral is created"
          - "branch COMMUNITY_PRESCHOOL only: the named site's reserved_iep_seat_count is incremented by 1 (conserved quantity of compensating_invariant iep_seat_conservation)"
          - "branches DISTRICT_ECSE_CLASSROOM / HOME_BASED / ITINERANT_ONLY: no seat is reserved on any site"
          - "Child.status recomputed via calculations.child_status_precedence; it stays IN_EVALUATION because a plan awaiting parental consent is not yet a service"
          - "increments ServicePlan.version by 1"
      - from: PENDING_PARENT_CONSENT
        to: ACTIVE
        trigger: "POST /child-find/consent-records/{id}/decision with decision=GRANTED on the SERVICE_CONSENT record"
        actor: Parent
        preconditions: ["the granting ConsentRecord.kind == SERVICE_CONSENT and service_plan_id == this plan"]
        side_effects:
          - "status := ACTIVE; start_date := logical clock date"
          - "the IEP seat reserved at consent submission is retained (COMMUNITY_PRESCHOOL branch)"
          - "Child.status recomputed via calculations.child_status_precedence to SERVED, the first request in which the child counts as served"
          - "increments ServicePlan.version by 1"
      - from: PENDING_PARENT_CONSENT
        to: DECLINED
        trigger: "POST /child-find/consent-records/{id}/decision with decision=REFUSED on the SERVICE_CONSENT record"
        actor: Parent
        preconditions: ["the refusing ConsentRecord.kind == SERVICE_CONSENT and service_plan_id == this plan"]
        side_effects:
          - "status := DECLINED"
          - "cascade hop 2: every ServiceLine of this plan with status IN {PROPOSED, STAFFED, UNSTAFFED} transitions to DISCONTINUED"
          - "cascade hop 3: for each line that left STAFFED, its provider's direct_weekly_service_minutes, travel_overhead_minutes and assigned_weekly_service_minutes are recomputed"
          - "cascade hop 4: each affected provider's service_capacity_posture is re-derived from the new assigned_weekly_service_minutes"
          - "COMMUNITY_PRESCHOOL branch only: the named site's reserved_iep_seat_count is decremented by 1"
          - "Child.status recomputed to SERVICES_DECLINED"
          - "increments ServicePlan.version by 1"
      - from: ACTIVE
        to: EXITED_TO_KINDERGARTEN
        trigger: "POST /child-find/service-plans/{id}/kindergarten-transition with action=EXIT"
        actor: PlacementAdministrator
        preconditions:
          - "kindergarten_transition_status == PACKET_SENT, else ERR_TRANSITION_SEQUENCE_VIOLATION"
        side_effects:
          - "status := EXITED_TO_KINDERGARTEN; exit_date := logical clock date; kindergarten_transition_status := COMPLETE"
          - "cascade hop 2: every ServiceLine of this plan with status IN {PROPOSED, STAFFED, UNSTAFFED} transitions to DISCONTINUED"
          - "cascade hop 3: for each line that left STAFFED, its provider's direct_weekly_service_minutes, travel_overhead_minutes and assigned_weekly_service_minutes are recomputed"
          - "cascade hop 4: each affected provider's service_capacity_posture is re-derived from the new assigned_weekly_service_minutes"
          - "COMMUNITY_PRESCHOOL branch only: the named site's reserved_iep_seat_count is decremented by 1"
          - "Child.status recomputed to EXITED_TO_KINDERGARTEN"
          - "increments ServicePlan.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system, when a superseding ServicePlan is created on the same EvaluationCase"
        actor: system
        preconditions: ["a newer ServicePlan on the same evaluation_case_id was just created"]
        side_effects:
          - "status := SUPERSEDED"
          - "every ServiceLine of this plan transitions to DISCONTINUED, with the provider minute and posture recomputation chain of hops 3 and 4"
          - "increments ServicePlan.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /child-find/service-plans/{id}/kindergarten-transition with action=SCHEDULE_CONFERENCE or action=SEND_PACKET"
        actor: PlacementAdministrator
        preconditions:
          - "action=SCHEDULE_CONFERENCE requires kindergarten_transition_status == NOT_STARTED and (child.kindergarten_eligibility_date - transition_conference_date) >= KINDERGARTEN_CONFERENCE_LEAD_DAYS (90), else ERR_TRANSITION_CONFERENCE_TOO_LATE"
          - "action=SEND_PACKET requires kindergarten_transition_status == CONFERENCE_SCHEDULED and receiving_school_code supplied, else ERR_TRANSITION_SEQUENCE_VIOLATION"
        side_effects:
          - "kindergarten_transition_status := CONFERENCE_SCHEDULED (with transition_conference_date set) or PACKET_SENT (with receiving_school_code set)"
          - "status stays ACTIVE (self-loop advancing only the transition sub-state)"
          - "increments ServicePlan.version by 1"

  - entity: ServiceLine
    initial_state: PROPOSED
    terminal_states: [DISCONTINUED]
    note: "Cyclic: STAFFED -> UNSTAFFED -> STAFFED is the sanctioned itinerant re-assignment loop."
    transitions:
      - from: PROPOSED
        to: STAFFED
        trigger: "POST /child-find/service-lines/{id}/staff"
        actor: PlacementAdministrator
        preconditions:
          - "expected_provider_version equals the named Provider's current version, else ERR_STALE_PROVIDER_VERSION"
          - "parent ServicePlan.status IN {DRAFT, ACTIVE}, else ERR_INVALID_PLAN_STATE"
          - "Provider.status == ACTIVE, else ERR_PROVIDER_NOT_ACTIVE"
          - "Provider.discipline == this line's discipline, else ERR_DISCIPLINE_MISMATCH"
          - "recomputed assigned_weekly_service_minutes <= Provider.max_weekly_service_minutes, else ERR_PROVIDER_CASELOAD_EXCEEDED"
        side_effects:
          - "status := STAFFED; provider_id := named provider; delivery_site_id := supplied site or null"
          - "Provider.direct_weekly_service_minutes, travel_overhead_minutes and assigned_weekly_service_minutes recomputed via calculations.provider_assigned_weekly_minutes"
          - "Provider.service_capacity_posture re-derived"
          - "parent ServicePlan.assigned_weekly_minutes recomputed"
          - "increments Provider.version by 1"
          - "increments ServiceLine.version by 1"
      - from: STAFFED
        to: UNSTAFFED
        trigger: "POST /child-find/service-lines/{id}/unstaff"
        actor: PlacementAdministrator
        preconditions:
          - "parent ServicePlan.status IN {DRAFT, ACTIVE}, else ERR_INVALID_PLAN_STATE"
        side_effects:
          - "status := UNSTAFFED; the releasing provider is remembered only through the recomputation, provider_id := null, delivery_site_id := null"
          - "the releasing Provider's direct_weekly_service_minutes, travel_overhead_minutes and assigned_weekly_service_minutes recomputed - compensating action of compensating_invariant provider_minute_conservation"
          - "the releasing Provider's service_capacity_posture re-derived"
          - "parent ServicePlan.assigned_weekly_minutes unchanged (UNSTAFFED lines still count toward the plan total)"
          - "increments Provider.version by 1"
          - "increments ServiceLine.version by 1"
      - from: UNSTAFFED
        to: STAFFED
        trigger: "POST /child-find/service-lines/{id}/staff (re-assignment)"
        actor: PlacementAdministrator
        preconditions:
          - "expected_provider_version equals the named Provider's current version, else ERR_STALE_PROVIDER_VERSION"
          - "parent ServicePlan.status IN {DRAFT, ACTIVE}"
          - "Provider.status == ACTIVE; Provider.discipline == line discipline; recomputed assigned minutes within cap"
        side_effects:
          - "status := STAFFED; provider_id and delivery_site_id set to the newly named provider and site"
          - "the newly named Provider's minute fields and service_capacity_posture recomputed"
          - "increments Provider.version by 1"
          - "increments ServiceLine.version by 1"
      - from: PROPOSED
        to: DISCONTINUED
        trigger: "system, cascade from ServicePlan -> DECLINED / EXITED_TO_KINDERGARTEN / SUPERSEDED"
        actor: system
        preconditions: ["parent ServicePlan reached a terminal state"]
        side_effects:
          - "status := DISCONTINUED"
          - "increments ServiceLine.version by 1"
      - from: STAFFED
        to: DISCONTINUED
        trigger: "system, cascade from ServicePlan -> DECLINED / EXITED_TO_KINDERGARTEN / SUPERSEDED"
        actor: system
        preconditions: ["parent ServicePlan reached a terminal state"]
        side_effects:
          - "status := DISCONTINUED; provider_id and delivery_site_id are retained for audit"
          - "the provider's minute fields are recomputed (DISCONTINUED lines leave the in-scope set) and service_capacity_posture re-derived"
          - "increments Provider.version by 1"
          - "increments ServiceLine.version by 1"
      - from: UNSTAFFED
        to: DISCONTINUED
        trigger: "system, cascade from ServicePlan -> DECLINED / EXITED_TO_KINDERGARTEN / SUPERSEDED"
        actor: system
        preconditions: ["parent ServicePlan reached a terminal state"]
        side_effects:
          - "status := DISCONTINUED"
          - "increments ServiceLine.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent entity's `version`)
# =============================================================================
concurrency_rules:
  - rule_id: slot-book-stale-screening-event
    parent_entity: ScreeningEvent
    write_endpoint: "POST /child-find/screening-events/{id}/slots"
    occ_field: "expected_screening_event_version"
    description: |
      Booking a screening slot against a ScreeningEvent whose version has
      advanced since the coordinator last read it is rejected. This captures the
      case where another booking has already consumed capacity on the event: the
      new booking is legitimate product behaviour whenever capacity remains, so
      no state precondition rejects it, and the coordinator's view of
      booked_slot_count / effective_slot_capacity is stale.
    error_id: ERR_STALE_SCREENING_EVENT_VERSION
    http_status: 412
  - rule_id: plan-create-stale-evaluation-case
    parent_entity: EvaluationCase
    write_endpoint: "POST /child-find/evaluation-cases/{id}/service-plans"
    occ_field: "expected_evaluation_case_version"
    description: |
      Recording an eligibility determination against an EvaluationCase whose
      version has advanced is rejected. A second determination is legitimate
      product behaviour - it supersedes the prior DRAFT plan under the
      ELIGIBILITY_DETERMINED self-loop - so the writer's stale view of the case
      must be caught by the version check rather than by a state precondition.
    error_id: ERR_STALE_EVALUATION_CASE_VERSION
    http_status: 412
  - rule_id: line-staff-stale-provider
    parent_entity: Provider
    write_endpoint: "POST /child-find/service-lines/{id}/staff"
    occ_field: "expected_provider_version"
    description: |
      Staffing a service line to a Provider whose version has advanced since the
      administrator read the provider's caseload is rejected. Staffing a further
      line to the same provider is legitimate whenever the minute cap still
      holds, so nothing in the state machine rejects it; the version check is
      what makes the administrator's stale caseload view observable.
    error_id: ERR_STALE_PROVIDER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
# Global arithmetic conventions
#  - All money-free numeric arithmetic is exact decimal, never binary float.
#  - "whole_months(d0, d1)" means:
#        m = (d1.year - d0.year) * 12 + (d1.month - d0.month)
#        if d1.day < d0.day: m = m - 1
#        return m
#  - "ceil5(x)" means 5 * ceil(x / 5) evaluated in exact decimal.
#  - No calculation, selector, ordering or tie-break anywhere in this scaffold
#    reads an entity `id`. Where a deterministic fallback order is needed the
#    key is `created_at ASC`.
calculations:
  - name: referral_age_and_pathway
    trigger: "On POST /child-find/referrals, and on the system-created referral behind a REFER screening outcome"
    algorithm: threshold
    formula: |
      age_months_at_referral = whole_months(child.date_of_birth, date(received_at))
      if age_months_at_referral < AGE_MIN_MONTHS or age_months_at_referral > AGE_MAX_MONTHS:
          eligibility_pathway = AGE_INELIGIBLE
      elif child.part_c_enrolled == true and age_months_at_referral <= PART_C_PATHWAY_MAX_AGE_MONTHS:
          eligibility_pathway = PART_C_TRANSITION_DEADLINE
      else:
          eligibility_pathway = STANDARD_60_DAY
    input_set: "Exactly one Child row (referral.child_id) and the referral's own system-stamped received_at; no other rows participate."
    constants:
      AGE_MIN_MONTHS: 33
      AGE_MAX_MONTHS: 71
      PART_C_PATHWAY_MAX_AGE_MONTHS: 35
    precision: "integer months, truncated by the whole_months rule (no rounding)"
    boundary_notes: |
      AGE_MIN_MONTHS is inclusive: age_months_at_referral == 33 is eligible,
      32 is AGE_INELIGIBLE. AGE_MAX_MONTHS is inclusive: 71 is eligible, 72 is
      AGE_INELIGIBLE. PART_C_PATHWAY_MAX_AGE_MONTHS is inclusive: an
      early-intervention child at exactly 35 months takes the Part C pathway, at
      36 months the standard pathway even when part_c_enrolled is true.

  - name: referral_evaluation_due_date
    trigger: "On the Referral transition CONSENT_PENDING -> EVALUATION_AUTHORIZED (side effect 'evaluation_due_date recomputed'); re-read by GET /child-find/referrals/{id}/timeline"
    algorithm: forward_looking
    formula: |
      # PINNED variant: CONSENT_ANCHORED
      if referral.consent_status != GRANTED:
          evaluation_due_date = null
      else:
          consent_anchored_due_date = date(consent_granted_at) + EVAL_WINDOW_DAYS days
          if eligibility_pathway == PART_C_TRANSITION_DEADLINE:
              evaluation_due_date = min(consent_anchored_due_date, child.third_birthday)
          else:
              evaluation_due_date = consent_anchored_due_date
      # Reporting-only companion value, never persisted on Referral:
      receipt_anchored_due_date = date(received_at) + EVAL_WINDOW_DAYS days
    input_set: "The referral's own received_at / consent_granted_at / eligibility_pathway plus child.third_birthday. Referrals whose consent_status is not GRANTED have a null due date and are excluded from every compliance aggregate."
    constants:
      EVAL_WINDOW_DAYS: 60
    precision: "calendar dates, whole days; the +60 is calendar-day addition, weekends and holidays included"
    variants:
      - name: RECEIPT_ANCHORED
        when: "Exposed by GET /child-find/referrals/{id}/timeline as receipt_anchored_due_date; the interpretation that the 60-day clock starts when the district first received the referral"
        difference: "Anchors on date(received_at) instead of date(consent_granted_at) and applies NO third-birthday cap; for the same referral this yields an earlier date whenever consent lagged receipt, and can even fall before the pinned date."
      - name: CONSENT_ANCHORED
        when: "PINNED. Persisted as Referral.evaluation_due_date and denormalised to EvaluationCase.due_date"
        difference: "Anchors on date(consent_granted_at) and, for PART_C_TRANSITION_DEADLINE referrals only, caps the result at child.third_birthday so the IEP is in place by the third birthday."

  - name: child_kindergarten_eligibility_date
    trigger: "On POST /child-find/children (child creation) and re-derived on read"
    algorithm: threshold
    formula: |
      fifth_birthday = date_of_birth + KINDERGARTEN_AGE_YEARS years   # Feb-29 -> Mar-01
      y = fifth_birthday.year
      cutoff_y = date(y, 9, 1)
      kindergarten_eligibility_date = cutoff_y if fifth_birthday <= cutoff_y else date(y + 1, 9, 1)
      third_birthday = date_of_birth + 3 years                        # Feb-29 -> Mar-01
    input_set: "The child's own date_of_birth only."
    constants:
      KINDERGARTEN_AGE_YEARS: 5
      KINDERGARTEN_CUTOFF_MONTH_DAY: "09-01"
    precision: "calendar dates"
    boundary_notes: "A fifth birthday falling exactly on September 1 uses that same September 1 (<= is inclusive); September 2 pushes to the following year."

  - name: domain_percent_delay
    trigger: "On the DomainAssessment transition SCHEDULED -> COMPLETED (side effect 'percent_delay, weighted_percent_delay and qualifies_delay computed')"
    algorithm: weighted_scoring
    formula: |
      chronological_age_months = whole_months(child.date_of_birth, date(window_start_utc))
      percent_delay = round_half_up(100 * (chronological_age_months - age_equivalent_months)
                                    / chronological_age_months, 1)
      # Method weight under the case's PINNED composite variant:
      #   pinned variant STANDARDIZED_STRICT  -> STANDARDIZED: 1.0 ; every other method: EXCLUDED
      #   pinned variant PLAY_BASED_INCLUSIVE -> STANDARDIZED: 1.0 ;
      #                                          PLAY_BASED: PLAY_BASED_CONFIDENCE_WEIGHT ;
      #                                          OBSERVATION: PLAY_BASED_CONFIDENCE_WEIGHT ;
      #                                          PARENT_REPORT: EXCLUDED
      if method is EXCLUDED under the pinned variant:
          weighted_percent_delay = null
          qualifies_delay = false
      else:
          # PINNED rounding order: round percent_delay to 1dp FIRST, then apply the
          # weight, then round to 1dp again. Never weight the unrounded quotient.
          weighted_percent_delay = round_half_up(percent_delay * method_weight, 1)
          qualifies_delay = (weighted_percent_delay >= DELAY_QUALIFY_PCT)
    input_set: "This DomainAssessment row plus child.date_of_birth plus the parent case's assessment_protocol. Assessments with status INVALIDATED keep their historical values but are excluded from every case aggregate."
    constants:
      DELAY_QUALIFY_PCT: 25.0
      PLAY_BASED_CONFIDENCE_WEIGHT: 0.9
    precision: "1 decimal place, round_half_up, applied twice per the pinned order above"
    boundary_notes: "DELAY_QUALIFY_PCT is inclusive: weighted_percent_delay == 25.0 qualifies, 24.9 does not. age_equivalent_months == chronological_age_months yields percent_delay 0.0."

  - name: evaluation_composite_delay_profile
    trigger: "On every DomainAssessment SCHEDULED -> COMPLETED and every transition to INVALIDATED (side effect 'parent EvaluationCase ... recomputed'); also on EvaluationCase IN_PROGRESS -> DOMAINS_COMPLETE; re-read by GET /child-find/evaluation-cases/{id}/eligibility-profile"
    algorithm: weighted_scoring
    formula: |
      completed = { da in DomainAssessment : da.evaluation_case_id == case.id
                                             and da.status == COMPLETED }
      completed_domain_count = count of DISTINCT da.domain over `completed`
      # Which members of `completed` enter the delay profile depends on the variant:
      entering(STANDARDIZED_STRICT)  = { da in completed : da.method == STANDARDIZED }
      entering(PLAY_BASED_INCLUSIVE) = { da in completed : da.method != PARENT_REPORT }
      pinned_variant = STANDARDIZED_STRICT if case.assessment_protocol == STANDARDIZED
                       else PLAY_BASED_INCLUSIVE
      E = entering(pinned_variant)
      qualifying_domain_count = count of DISTINCT da.domain over
                                { da in E : da.weighted_percent_delay >= DELAY_QUALIFY_PCT }
      max_weighted_percent_delay = max(da.weighted_percent_delay for da in E)   # null when E is empty
      if completed_domain_count < REQUIRED_DOMAIN_COUNT:
          composite_eligibility_recommendation = INDETERMINATE
      elif (max_weighted_percent_delay is not null
            and max_weighted_percent_delay >= SEVERE_SINGLE_DOMAIN_PCT)
           or qualifying_domain_count >= MULTI_DOMAIN_MIN_COUNT:
          composite_eligibility_recommendation = ELIGIBLE_RECOMMENDED
      else:
          composite_eligibility_recommendation = NOT_ELIGIBLE_RECOMMENDED
    input_set: "DomainAssessment rows of this case with status == COMPLETED only. SCHEDULED and INVALIDATED rows are excluded from completed_domain_count, from E, and from max_weighted_percent_delay. No time window and no ordering is involved, so no tie-break is needed; max over an empty set is null, never 0.0."
    constants:
      REQUIRED_DOMAIN_COUNT: 5
      DELAY_QUALIFY_PCT: 25.0
      SEVERE_SINGLE_DOMAIN_PCT: 33.0
      MULTI_DOMAIN_MIN_COUNT: 2
    precision: "counts are integers; max_weighted_percent_delay carries the 1dp precision of its source"
    variants:
      - name: STANDARDIZED_STRICT
        when: "PINNED when case.assessment_protocol == STANDARDIZED; also always reported by GET /child-find/evaluation-cases/{id}/eligibility-profile"
        difference: "Only STANDARDIZED-method assessments enter the delay profile at weight 1.0; PLAY_BASED, OBSERVATION and PARENT_REPORT results are discarded entirely, so a case whose delays were captured through play-based assessment can show qualifying_domain_count 0."
      - name: PLAY_BASED_INCLUSIVE
        when: "PINNED when case.assessment_protocol == PLAY_BASED; also always reported by the eligibility-profile endpoint"
        difference: "STANDARDIZED, PLAY_BASED and OBSERVATION all enter, with PLAY_BASED and OBSERVATION discounted by PLAY_BASED_CONFIDENCE_WEIGHT (0.9); PARENT_REPORT is still excluded. On identical assessment rows this variant can reach ELIGIBLE_RECOMMENDED where STANDARDIZED_STRICT reaches NOT_ELIGIBLE_RECOMMENDED."

  - name: service_minutes_recommendation
    trigger: "On EvaluationCase IN_PROGRESS -> DOMAINS_COMPLETE and on every recomputation of the composite profile (side effect 'recommended_weekly_minutes recomputed'); copied onto ServicePlan.recommended_weekly_minutes at plan creation"
    algorithm: tiered_pricing
    formula: |
      Q = { da in E(pinned_variant) : da.weighted_percent_delay >= DELAY_QUALIFY_PCT }
      # one line per DISTINCT domain in Q; when two assessments of the same domain
      # both qualify, the one with the greater weighted_percent_delay is used, and
      # if those tie, the one with the earlier created_at.
      for each distinct domain d in Q:
          pd = the representative weighted_percent_delay for d
          if pd >= SEVERITY_BAND_PROFOUND_PCT:        mult = SEVERITY_MULT_PROFOUND
          elif pd >= SEVERITY_BAND_SIGNIFICANT_PCT:   mult = SEVERITY_MULT_SIGNIFICANT
          else:                                       mult = SEVERITY_MULT_MODERATE
          raw_d  = BASE_MINUTES_PER_QUALIFYING_DOMAIN * mult      # exact decimal
          line_d = ceil5(raw_d)                                   # ROUND PER LINE
      recommended_weekly_minutes = sum(line_d for d in Q)          # THEN SUM
    input_set: "Only the qualifying domains Q of the pinned composite variant. Non-qualifying and excluded-method domains contribute nothing. Q empty yields 0."
    constants:
      BASE_MINUTES_PER_QUALIFYING_DOMAIN: 50
      SEVERITY_MULT_MODERATE: 1.0
      SEVERITY_MULT_SIGNIFICANT: 1.15
      SEVERITY_MULT_PROFOUND: 1.4
      SEVERITY_BAND_SIGNIFICANT_PCT: 33.0
      SEVERITY_BAND_PROFOUND_PCT: 50.0
      MINUTE_ROUNDING_INCREMENT: 5
    precision: |
      PINNED ROUNDING ORDER: ceil-to-5 is applied PER LINE and the rounded lines
      are then summed. The alternative order - sum the raw per-domain minutes and
      ceil-to-5 once - is explicitly NOT the rule and yields a smaller number
      whenever the accumulated per-line slack reaches 5 minutes. Worked example:
      two qualifying domains at 33.3% and 36.1% both take mult 1.15, so
      raw = 57.5 each; per-line-then-sum gives ceil5(57.5) + ceil5(57.5) =
      60 + 60 = 120, whereas sum-then-round gives ceil5(115.0) = 115.
      GET /child-find/evaluation-cases/{id}/eligibility-profile reports both so
      the divergence is observable.
    boundary_notes: "SEVERITY_BAND_SIGNIFICANT_PCT and SEVERITY_BAND_PROFOUND_PCT are inclusive lower bounds: pd == 33.0 takes mult 1.15, pd == 32.9 takes 1.0; pd == 50.0 takes 1.4."

  - name: provider_assigned_weekly_minutes
    trigger: "On ServiceLine PROPOSED -> STAFFED, STAFFED -> UNSTAFFED, UNSTAFFED -> STAFFED, any -> DISCONTINUED, on ServicePlan transitions that cascade to lines, and on ServicePlan setting/site changes (side effect 'assigning provider minutes recomputed'); re-read by GET /child-find/providers/{id}/caseload"
    algorithm: constraint_propagation
    formula: |
      # PINNED variant: PROJECTED
      counted_plan_states = {DRAFT, PENDING_PARENT_CONSENT, ACTIVE}
      L = { l in ServiceLine : l.provider_id == provider.id
                               and l.status == STAFFED
                               and plan(l).status in counted_plan_states }
      direct_weekly_service_minutes = sum(l.weekly_minutes for l in L
                                          where l.delivery_model == DIRECT)
      # STEP ORDER IS PINNED. The travel tier is selected from the DIRECT total
      # ALONE, before any travel minutes exist, and is never re-selected after
      # the per-site minutes are added.
      D = direct_weekly_service_minutes
      if   D <= TRAVEL_TIER1_MAX_DIRECT_MINUTES: tier_pct = TRAVEL_TIER1_PCT
      elif D <= TRAVEL_TIER2_MAX_DIRECT_MINUTES: tier_pct = TRAVEL_TIER2_PCT
      else:                                      tier_pct = TRAVEL_TIER3_PCT
      distinct_sites = count of DISTINCT l.delivery_site_id over L,
                       with a null delivery_site_id normalised to the sentinel
                       "DISTRICT_CENTER" (so all district-delivered lines collapse
                       to one site)
      extra_sites = max(0, distinct_sites - 1)
      travel_overhead_minutes = ceil5( D * tier_pct
                                       + extra_sites * TRAVEL_PER_EXTRA_SITE_MINUTES )
      assigned_weekly_service_minutes = direct_weekly_service_minutes
                                        + travel_overhead_minutes
    input_set: |
      ServiceLine rows with status == STAFFED only, and only where the owning
      ServicePlan is in {DRAFT, PENDING_PARENT_CONSENT, ACTIVE}. PROPOSED,
      UNSTAFFED and DISCONTINUED lines contribute nothing, and lines under a
      DECLINED / SUPERSEDED / EXITED_TO_KINDERGARTEN / CLOSED_NOT_ELIGIBLE plan
      contribute nothing. CONSULT and PUSH_IN lines participate in
      distinct_sites (they do require travel) but NOT in the DIRECT total.
    constants:
      TRAVEL_TIER1_MAX_DIRECT_MINUTES: 300
      TRAVEL_TIER1_PCT: 0.05
      TRAVEL_TIER2_MAX_DIRECT_MINUTES: 600
      TRAVEL_TIER2_PCT: 0.10
      TRAVEL_TIER3_PCT: 0.15
      TRAVEL_PER_EXTRA_SITE_MINUTES: 15
      MINUTE_ROUNDING_INCREMENT: 5
    precision: |
      travel_overhead_minutes is the single ceil-to-5 of the whole travel
      expression; the percentage part and the per-extra-site part are NOT
      rounded separately. Worked example: D = 290 across two distinct sites.
      Tier is selected from 290 (<= 300) so tier_pct = 0.05, giving
      ceil5(14.5 + 15) = ceil5(29.5) = 30 and assigned = 320. Re-selecting the
      tier after adding travel (290 + 30 = 320 > 300 -> 0.10) would give
      ceil5(29.0 + 15) = 45 and assigned = 335; that re-selection is wrong.
    variants:
      - name: COMMITTED_ONLY
        when: "Exposed by GET /child-find/providers/{id}/caseload as committed_weekly_minutes; the interpretation that only parent-facing commitments consume capacity"
        difference: "counted_plan_states is {PENDING_PARENT_CONSENT, ACTIVE} - DRAFT plans are excluded - so a provider staffed onto draft plans shows a lower direct total, possibly a lower travel tier, and a lower assigned total than the pinned value."
      - name: PROJECTED
        when: "PINNED. Persisted as Provider.assigned_weekly_service_minutes and used by the ERR_PROVIDER_CASELOAD_EXCEEDED check"
        difference: "counted_plan_states includes DRAFT, so minutes are held from the moment a line is staffed, before parent consent is even requested."

  - name: provider_service_capacity_posture
    trigger: "Whenever assigned_weekly_service_minutes is recomputed"
    algorithm: threshold
    formula: |
      utilization = assigned_weekly_service_minutes / max_weekly_service_minutes
      if assigned_weekly_service_minutes >= max_weekly_service_minutes:
          service_capacity_posture = AT_CAPACITY
      elif utilization >= NEAR_CAPACITY_UTILIZATION:
          service_capacity_posture = NEAR_CAPACITY
      else:
          service_capacity_posture = OPEN
      # The staffing gate is a strict-greater test on the POST-write total:
      #   reject with ERR_PROVIDER_CASELOAD_EXCEEDED iff
      #   projected_assigned_weekly_service_minutes > max_weekly_service_minutes
    input_set: "The provider's own recomputed minutes and its max_weekly_service_minutes."
    constants:
      NEAR_CAPACITY_UTILIZATION: 0.80
    precision: "utilization compared as an exact decimal ratio, never pre-rounded"
    boundary_notes: |
      A staffing request whose resulting assigned total EQUALS
      max_weekly_service_minutes is ACCEPTED (the gate is >, not >=) and leaves
      the provider AT_CAPACITY; one more minute is rejected. utilization exactly
      0.80 is NEAR_CAPACITY (e.g. assigned 320 of max 400).

  - name: provider_evaluation_caseload
    trigger: "On EvaluationCase creation and on every EvaluationCase transition into or out of a non-terminal state"
    algorithm: aggregation
    formula: |
      active_evaluation_count = count( ec in EvaluationCase :
          ec.chair_provider_id == provider.id and ec.status in
          {PLANNED, IN_PROGRESS, DOMAINS_COMPLETE, REPORT_DRAFTED, REVISIONS_REQUESTED} )
      evaluation_intake_posture = AT_CAPACITY
          if active_evaluation_count >= max_evaluation_caseload else OPEN
      # Gate: POST /child-find/referrals/{id}/evaluation-cases rejects with
      # ERR_EVALUATION_CASELOAD_EXCEEDED iff the chair's active_evaluation_count
      # is already >= max_evaluation_caseload BEFORE the new case is created.
      assigned_interpreter_assignment_count = count( cr in ConsentRecord :
          cr.interpreter_provider_id == provider.id
          and cr.decision in {PENDING, GRANTED} )
    input_set: "EvaluationCase rows chaired by this provider in the five non-terminal statuses; ELIGIBILITY_DETERMINED and CANCELLED cases are excluded, which is what makes the CANCEL cascade release capacity. Interpreter counting excludes REFUSED and REVOKED consent records."
    constants:
      DEFAULT_MAX_EVALUATION_CASELOAD: 12
      DEFAULT_MAX_INTERPRETER_ASSIGNMENTS: 0
    precision: "integer counts"
    boundary_notes: "The evaluation-caseload gate compares the PRE-write count with >=, so a chair at exactly max_evaluation_caseload is refused; the interpreter gate is identical in shape and raises ERR_INTERPRETER_UNAVAILABLE."

  - name: screening_event_effective_capacity
    trigger: "On POST /child-find/screening-events, on every slot booking or cancellation, and on read"
    algorithm: threshold
    formula: |
      window_minutes = whole minutes between window_start_utc and window_end_utc
      effective_slot_capacity = min( slot_capacity,
                                     floor(window_minutes / slot_length_minutes) )
      booked_slot_count = count( s in ScreeningSlot :
          s.screening_event_id == event.id and s.status in {BOOKED, ATTENDED, NO_SHOW} )
      # Gate: POST /child-find/screening-events/{id}/slots rejects with
      # ERR_SCREENING_CAPACITY_EXCEEDED iff booked_slot_count >=
      # effective_slot_capacity before the booking.
      slot_end_utc = slot_start_utc + event.slot_length_minutes
    input_set: "Slots of this event in {BOOKED, ATTENDED, NO_SHOW}; CANCELLED slots are excluded and free their capacity."
    precision: "integer minutes; floor on the window division, never round"
    boundary_notes: "A declared slot_capacity larger than the window can hold is silently clamped by the min(), so the binding limit can be the window rather than the declared capacity. booked_slot_count == effective_slot_capacity refuses the next booking."

  - name: site_reserved_iep_seat_count
    trigger: "On ServicePlan DRAFT -> PENDING_PARENT_CONSENT, PENDING_PARENT_CONSENT -> ACTIVE/DECLINED, ACTIVE -> EXITED_TO_KINDERGARTEN, and any transition to SUPERSEDED (side effect 'site reserved_iep_seat_count recomputed')"
    algorithm: aggregation
    formula: |
      reserved_iep_seat_count = count( p in ServicePlan :
          p.community_site_id == site.id
          and p.status in {PENDING_PARENT_CONSENT, ACTIVE} )
      # Gate: POST /child-find/service-plans/{id}/consent-submission rejects with
      # ERR_IEP_SEAT_CAPACITY_EXCEEDED iff the plan names a community_site_id and
      # that site's reserved_iep_seat_count >= iep_seat_capacity before the write.
    input_set: "ServicePlan rows naming this site whose status is PENDING_PARENT_CONSENT or ACTIVE. DRAFT plans hold no seat, and DECLINED / SUPERSEDED / EXITED_TO_KINDERGARTEN / CLOSED_NOT_ELIGIBLE plans release theirs."
    precision: "integer count"
    boundary_notes: "Seat reservation begins at consent submission, not at plan drafting, so two DRAFT plans on a one-seat site can both exist and only the first consent submission succeeds."

  - name: evaluation_timeline_compliance
    trigger: "On EvaluationCase creation, on POST /child-find/_clock/set_current_utc, and on read"
    algorithm: chronological
    formula: |
      if case.status in {ELIGIBILITY_DETERMINED, CANCELLED}:
          timeline_compliance = ON_TIME if case.status == CANCELLED
                                or date(case.determined_at_or_now) <= case.due_date
                                else OVERDUE
      else:
          days_remaining = (case.due_date - current_utc_date) in whole days
          if days_remaining < 0:                 timeline_compliance = OVERDUE
          elif days_remaining <= AT_RISK_DAYS:   timeline_compliance = AT_RISK
          else:                                  timeline_compliance = ON_TIME
    input_set: "The case's own denormalised due_date plus the logical clock. A case whose referral has no consent yet cannot exist, so due_date is never null on an EvaluationCase."
    constants:
      AT_RISK_DAYS: 10
    precision: "whole calendar days, computed on dates not timestamps"
    boundary_notes: "days_remaining == 10 is AT_RISK, 11 is ON_TIME, 0 is AT_RISK (due today), -1 is OVERDUE."

  - name: child_status_precedence
    trigger: "On every referral, evaluation-case and service-plan write that touches the child"
    algorithm: threshold
    formula: |
      # First matching clause wins; clauses are evaluated top to bottom.
      if exists ServicePlan p (p.child_id == child.id
                               and p.status == EXITED_TO_KINDERGARTEN):
          status = EXITED_TO_KINDERGARTEN
      elif exists ServicePlan p (p.child_id == child.id and p.status == ACTIVE):
          status = SERVED
      elif exists ServicePlan p (p.child_id == child.id and p.status == DECLINED):
          status = SERVICES_DECLINED
      elif exists ServicePlan p (p.child_id == child.id
                                 and p.status == CLOSED_NOT_ELIGIBLE):
          status = NOT_ELIGIBLE
      elif exists EvaluationCase ec (ec.child_id == child.id and ec.status in
               {PLANNED, IN_PROGRESS, DOMAINS_COMPLETE, REPORT_DRAFTED,
                REVISIONS_REQUESTED}):
          status = IN_EVALUATION
      elif exists ServicePlan p (p.child_id == child.id
                                 and p.status in {DRAFT, PENDING_PARENT_CONSENT}):
          status = IN_EVALUATION
      elif exists Referral r (r.child_id == child.id and r.intake_status in
               {RECEIVED, CONSENT_PENDING, EVALUATION_AUTHORIZED}):
          status = REFERRED
      else:
          status = NO_ACTIVE_REFERRAL
      # DRAFT and PENDING_PARENT_CONSENT plans deliberately do NOT earn SERVED:
      # a plan the parent has not yet consented to is not a service, so the
      # child stays IN_EVALUATION even though its EvaluationCase has already
      # left the five in-evaluation states for ELIGIBILITY_DETERMINED.
    input_set: "All Referral, EvaluationCase and ServicePlan rows of this child. No ordering by created_at is required because the clause ladder is total; SUPERSEDED plans and DECLINED/WITHDRAWN/SUPERSEDED referrals never match any clause."
    precision: "enum, no arithmetic"
    boundary_notes: "A child with both an ACTIVE plan and a fresh RECEIVED referral is SERVED, not REFERRED, because the ladder is ordered by outcome finality rather than recency."

# =============================================================================
# 1.4 Validation Rules Table (evaluated in ascending priority; first violation
#     wins and no later rule is consulted)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID header present and non-empty on every request"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: "Checked before anything else, including path existence, so a missing header on a bogus path still returns 401."

  - priority: 2
    category: auth
    check: "X-User-Role header present, a recognised role name, and listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
    description: "An unrecognised role string and a recognised-but-unauthorised role produce the same error. Precedes schema validation, so a forbidden role with a malformed body still returns 403."

  - priority: 3
    category: schema
    check: "Request body parses, contains every required input field, rejects unknown fields' influence, and every field matches its declared type / enum / range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
    description: "Also covers pagination bounds (limit 1..100, offset >= 0), ISO-8601 parseability, weekly_minutes being a multiple of 5 in 5..600, and window_end_utc strictly after window_start_utc."

  - priority: 4
    category: existence
    check: "Every {id} path segment resolves to an existing row of the expected entity"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
    description: "Left-to-right for nested paths. Uses the entity-specific code from §1.6 (ERR_CHILD_NOT_FOUND, ERR_REFERRAL_NOT_FOUND, ...)."

  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /child-find/screening-events, POST /child-find/screening-events/{id}/slots, POST /child-find/referrals, POST /child-find/referrals/{id}/consent-requests, POST /child-find/referrals/{id}/evaluation-cases, POST /child-find/evaluation-cases/{id}/domain-assessments, POST /child-find/evaluation-cases/{id}/service-plans, POST /child-find/service-plans/{id}/service-lines, POST /child-find/service-lines/{id}/staff"
    description: "Body FKs are checked after path IDs, in the field order declared by the endpoint's input list."

  - priority: 6
    category: auth
    check: "When the caller's role is Parent, the X-User-ID must equal the Child.id that the target row belongs to"
    error_id: ERR_NOT_CHILD_GUARDIAN
    http_status: 403
    applies_to: "GET /child-find/children/{id}, GET /child-find/referrals/{id}, GET /child-find/referrals/{id}/timeline, GET /child-find/service-plans/{id}, POST /child-find/consent-records/{id}/decision"
    description: "Ownership is resolved by walking the row's child_id (directly, or via referral_id / evaluation_case_id). Runs after existence so a Parent probing another family's row learns only 403 for rows that exist and 404 for rows that do not."

  - priority: 7
    category: auth
    check: "When the caller's role is Evaluator, the X-User-ID must equal DomainAssessment.evaluator_provider_id of the target assessment"
    error_id: ERR_NOT_ASSIGNED_EVALUATOR
    http_status: 403
    applies_to: "POST /child-find/domain-assessments/{id}/completion, POST /child-find/domain-assessments/{id}/invalidation"
    description: "An Evaluator can only complete or invalidate their own assessment; the EvaluationChair of the case is separately authorised on the same endpoints and bypasses this rule."

  - priority: 8
    category: auth
    check: "When the caller's role is EvaluationChair, the X-User-ID must equal EvaluationCase.chair_provider_id of the target case"
    error_id: ERR_NOT_CASE_CHAIR
    http_status: 403
    applies_to: "POST /child-find/evaluation-cases/{id}/domain-assessments, POST /child-find/evaluation-cases/{id}/report, POST /child-find/evaluation-cases/{id}/service-plans, POST /child-find/domain-assessments/{id}/completion, POST /child-find/domain-assessments/{id}/invalidation"
    description: "Chair identity is checked before any state or capacity rule, so the wrong chair on a CANCELLED case sees 403 and not the state error."

  - priority: 9
    category: business_safety
    check: "The provider named as chair_provider_id has is_evaluation_chair_eligible true (discipline SCHOOL_PSYCHOLOGIST or ECSE_TEACHER)"
    error_id: ERR_CHAIR_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /child-find/referrals/{id}/evaluation-cases"
    description: "Discipline-based duty restriction, independent of the caller's own identity."

  - priority: 10
    category: concurrency
    check: "When the endpoint declares an expected_<parent>_version input, the submitted value equals the parent row's current version"
    error_id: "the concurrency rule's error_id (ERR_STALE_SCREENING_EVENT_VERSION | ERR_STALE_EVALUATION_CASE_VERSION | ERR_STALE_PROVIDER_VERSION)"
    http_status: 412
    applies_to: "POST /child-find/screening-events/{id}/slots, POST /child-find/evaluation-cases/{id}/service-plans, POST /child-find/service-lines/{id}/staff"
    description: "Runs after all authorisation and existence checks and before every state, temporal, constraint and capacity rule, so a stale version on a full screening event returns 412 rather than the capacity error."

  - priority: 11
    category: state
    check: "The target row is in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_INVALID_<ENTITY>_STATE (ERR_INVALID_EVENT_STATE | ERR_INVALID_SLOT_STATE | ERR_INVALID_REFERRAL_STATE | ERR_INVALID_CONSENT_STATE | ERR_INVALID_CASE_STATE | ERR_INVALID_ASSESSMENT_STATE | ERR_INVALID_PLAN_STATE | ERR_INVALID_LINE_STATE)"
    http_status: 409
    applies_to: "every action endpoint"
    description: "Covers terminal-state lockdown and repeat-trigger idempotency failures. Deliberately ordered ABOVE every business_referential and business_fiscal rule. TWO carve-outs, both forced by the Referral's two parallel dimensions. Carve-out A, on POST /child-find/referrals/{id}/consent-requests: the intake dimension is inspected ONLY when the referral has no EVALUATION_CONSENT record whose decision is PENDING or GRANTED; when such a record exists (intake CONSENT_PENDING or EVALUATION_AUTHORIZED) validation 28 answers with ERR_CONSENT_ALREADY_REQUESTED, and ERR_INVALID_REFERRAL_STATE stays reachable there for the DECLINED, WITHDRAWN and SUPERSEDED intake states, whose records are REFUSED or REVOKED. Carve-out B, on POST /child-find/referrals/{id}/evaluation-cases: this rule inspects intake_status ONLY when consent_status == GRANTED (the reachable case being a GRANTED referral that has since been SUPERSEDED by a newer referral for the same child, which yields ERR_INVALID_REFERRAL_STATE); whenever consent_status is not GRANTED the intake dimension is left unreported and validation 13 answers with ERR_CONSENT_NOT_GRANTED instead."

  - priority: 12
    category: state
    check: "Cross-entity state precondition: the row's related entity is in a state that permits the operation"
    error_id: "ERR_INVALID_EVENT_STATE (slot booking) | ERR_INVALID_CASE_STATE (plan creation) | ERR_INVALID_PLAN_STATE (service line creation)"
    http_status: 409
    applies_to: "POST /child-find/screening-events/{id}/slots, POST /child-find/evaluation-cases/{id}/service-plans, POST /child-find/service-plans/{id}/service-lines"
    description: "The guard names the RELATED entity in the error, never the row being created: booking a ScreeningSlot into a CLOSED event is ERR_INVALID_EVENT_STATE, not ERR_INVALID_SLOT_STATE, and creating a ServicePlan against a CANCELLED evaluation case is ERR_INVALID_CASE_STATE. Case creation is deliberately absent here: its related-entity gate is the referral itself, which validation 11 and validation 13 already partition between them."

  - priority: 13
    category: business_safety
    check: "Written parental consent for evaluation has been granted on the referral (consent_status == GRANTED) before any evaluation activity"
    error_id: ERR_CONSENT_NOT_GRANTED
    http_status: 409
    applies_to: "POST /child-find/referrals/{id}/evaluation-cases"
    description: "Statutory prior-written-consent gate, and the ONLY error reported when a referral has not reached GRANTED consent: a referral still at consent_status REQUESTED (intake CONSENT_PENDING), one whose consent was REFUSED (intake DECLINED) and one whose consent was REVOKED (intake WITHDRAWN) all return ERR_CONSENT_NOT_GRANTED here rather than ERR_INVALID_REFERRAL_STATE, per the carve-out in validation 11. ERR_INVALID_REFERRAL_STATE remains reachable on this endpoint for the one state pair the consent dimension cannot explain: consent_status GRANTED with intake_status SUPERSEDED."

  - priority: 14
    category: business_safety
    check: "A parent notice may not be issued in a language the family cannot read: when child.interpreter_required is true, the consent request must either be written in child.primary_language_code or name an interpreter_provider_id whose discipline is INTERPRETER and whose languages contain that code"
    error_id: ERR_INTERPRETER_NOT_PROVIDED
    http_status: 422
    applies_to: "POST /child-find/referrals/{id}/consent-requests, POST /child-find/service-plans/{id}/consent-submission"
    description: "Language access is the highest business_safety rule below consent itself, and is checked before the interpreter's own availability cap."

  - priority: 15
    category: business_safety
    check: "A screening slot may not be booked in a language the event cannot serve: when requested_language_code != 'en' it must appear in the event's interpreter_languages"
    error_id: ERR_INTERPRETER_NOT_PROVIDED
    http_status: 422
    applies_to: "POST /child-find/screening-events/{id}/slots"
    description: "Same error id, different surface; sits above the event capacity rule so an unservable language is reported even on a full event."

  - priority: 16
    category: business_safety
    check: "Segregation of duties: the evaluator of a domain assessment may not be the chair of the same evaluation case"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /child-find/evaluation-cases/{id}/domain-assessments"
    description: "Compares evaluator_provider_id against the case's chair_provider_id. Also forbids the chair from being the interpreter of record on the same case's consent notices."

  - priority: 17
    category: business_safety
    check: "The child's age in whole months at referral receipt is within [AGE_MIN_MONTHS, AGE_MAX_MONTHS]"
    error_id: ERR_AGE_INELIGIBLE
    http_status: 422
    applies_to: "POST /child-find/referrals"
    description: "Part B preschool eligibility spans 33 through 71 months inclusive; outside that the district cannot open an evaluation."

  - priority: 18
    category: business_referential
    check: "The provider named on a write is ACTIVE (Provider.status == ACTIVE)"
    error_id: ERR_PROVIDER_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /child-find/referrals/{id}/evaluation-cases, POST /child-find/evaluation-cases/{id}/domain-assessments, POST /child-find/service-lines/{id}/staff, POST /child-find/referrals/{id}/consent-requests"
    description: "ON_LEAVE and INACTIVE providers may not take new chairs, assessments, service lines or interpreter assignments. Ordered strictly below the priority-11/12 state rules, which is the pinned tie-break for the state-vs-referential conflict."

  - priority: 19
    category: business_referential
    check: "The staffed provider's discipline equals the ServiceLine.discipline, and an INTERPRETER-discipline provider may never be staffed to a service line"
    error_id: ERR_DISCIPLINE_MISMATCH
    http_status: 422
    applies_to: "POST /child-find/service-lines/{id}/staff, POST /child-find/evaluation-cases/{id}/domain-assessments"
    description: "For domain assessments the mapping is COMMUNICATION -> SLP or ECSE_TEACHER, PHYSICAL_MOTOR -> OT or PT, COGNITIVE -> SCHOOL_PSYCHOLOGIST or ECSE_TEACHER, SOCIAL_EMOTIONAL -> SOCIAL_WORKER or SCHOOL_PSYCHOLOGIST, ADAPTIVE -> any non-INTERPRETER discipline."

  - priority: 20
    category: business_referential
    check: "The community preschool site named on a write is eligible for that use: status ACTIVE, and screening_host_approved true when hosting a screening event, and languages_supported covering the child's primary_language_code when receiving a COMMUNITY_PRESCHOOL placement"
    error_id: ERR_SITE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /child-find/screening-events, POST /child-find/evaluation-cases/{id}/service-plans, POST /child-find/service-plans/{id}/service-lines"
    description: "One error covers all three site-eligibility facets; the message names the facet."

  - priority: 21
    category: business_temporal
    check: "A new screening event window must not overlap another non-CANCELLED event at the same site (half-open intervals, conflict iff new_start < existing_end AND existing_start < new_end)"
    error_id: ERR_SITE_EVENT_OVERLAP
    http_status: 409
    applies_to: "POST /child-find/screening-events"
    description: "No buffer is applied, so exact adjacency (new_start == existing_end) is allowed. CANCELLED events are ignored entirely."

  - priority: 22
    category: business_temporal
    check: "A new domain assessment window must not conflict with another SCHEDULED or COMPLETED assessment of the same evaluator, where a TRAVEL_BUFFER_MINUTES gap is required only when the two assessments are at different sites (null assessment_site_id normalises to the district centre): conflict iff new_start < existing_end + buffer AND existing_start < new_end + buffer"
    error_id: ERR_EVALUATOR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /child-find/evaluation-cases/{id}/domain-assessments"
    description: "Same-site back-to-back assessments are legal (buffer 0); a cross-site pair needs 30 minutes of travel. INVALIDATED assessments are ignored."

  - priority: 23
    category: business_temporal
    check: "A screening slot must fall entirely inside its event window: slot_start_utc >= window_start_utc and slot_start_utc + slot_length_minutes <= window_end_utc"
    error_id: ERR_SLOT_OUTSIDE_EVENT_WINDOW
    http_status: 422
    applies_to: "POST /child-find/screening-events/{id}/slots"
    description: "Ordered above the capacity rule, which is the pinned tie-break for the temporal-vs-fiscal conflict."

  - priority: 24
    category: business_temporal
    check: "A kindergarten transition conference must be scheduled at least KINDERGARTEN_CONFERENCE_LEAD_DAYS before the child's kindergarten_eligibility_date and strictly after the logical clock date"
    error_id: ERR_TRANSITION_CONFERENCE_TOO_LATE
    http_status: 422
    applies_to: "POST /child-find/service-plans/{id}/kindergarten-transition"
    description: "Applies only to the SCHEDULE_CONFERENCE action."

  - priority: 25
    category: business_constraint
    check: "All REQUIRED_DOMAIN_COUNT distinct developmental domains have a COMPLETED assessment before a report is drafted or a service plan is created"
    error_id: ERR_DOMAINS_INCOMPLETE
    http_status: 409
    applies_to: "POST /child-find/evaluation-cases/{id}/report, POST /child-find/evaluation-cases/{id}/service-plans"
    description: "Equivalent to composite_eligibility_recommendation == INDETERMINATE; the empty-assessment-set case lands here rather than producing a 0.0 delay profile."

  - priority: 26
    category: business_constraint
    check: "A case may not have two SCHEDULED-or-COMPLETED assessments of the same domain"
    error_id: ERR_DUPLICATE_DOMAIN_ASSESSMENT
    http_status: 409
    applies_to: "POST /child-find/evaluation-cases/{id}/domain-assessments"
    description: "INVALIDATED assessments do not block, which is how a re-assessment after invalidation is permitted."

  - priority: 27
    category: business_constraint
    check: "A case may not exceed MAX_REVISION_ROUNDS revision requests"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /child-find/evaluation-cases/{id}/revision-requests"
    description: "revision_round is incremented on each REPORT_DRAFTED -> REVISIONS_REQUESTED transition; the third request is refused."

  - priority: 28
    category: business_constraint
    check: "A consent request may not be issued for a referral that already has a PENDING or GRANTED evaluation consent record"
    error_id: ERR_CONSENT_ALREADY_REQUESTED
    http_status: 409
    applies_to: "POST /child-find/referrals/{id}/consent-requests"
    description: "Pre-empts the priority-11 state rule on this endpoint (carve-out A there), so re-issuing a notice while the family is still deciding returns ERR_CONSENT_ALREADY_REQUESTED rather than ERR_INVALID_REFERRAL_STATE, and so does asking again after consent has already been granted. A referral whose record is REFUSED or REVOKED has no blocking record, so it falls through to the priority-11 state rule and reports ERR_INVALID_REFERRAL_STATE for its DECLINED or WITHDRAWN intake state."

  - priority: 29
    category: business_constraint
    check: "Only an EVALUATION_CONSENT record in decision GRANTED may be revoked"
    error_id: ERR_CONSENT_NOT_REVOCABLE
    http_status: 409
    applies_to: "POST /child-find/consent-records/{id}/decision"
    description: "A SERVICE_CONSENT record has no revoke path; withdrawal of services is expressed by the plan lifecycle instead."

  - priority: 30
    category: business_constraint
    check: "Service-setting requirements are met: COMMUNITY_PRESCHOOL requires a community_site_id, DISTRICT_ECSE_CLASSROOM and HOME_BASED require community_site_id to be null, ITINERANT_ONLY requires every service line to be DIRECT or CONSULT and no line above 300 weekly minutes"
    error_id: ERR_PLAN_SETTING_REQUIREMENTS_UNMET
    http_status: 422
    applies_to: "POST /child-find/evaluation-cases/{id}/service-plans, POST /child-find/service-plans/{id}/service-lines, POST /child-find/service-plans/{id}/consent-submission"
    description: "The fork guard for the ServicePlan branching state machine."

  - priority: 31
    category: business_constraint
    check: "An eligibility_decision that contradicts composite_eligibility_recommendation requires a non-empty override_justification"
    error_id: ERR_ELIGIBILITY_OVERRIDE_JUSTIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /child-find/evaluation-cases/{id}/service-plans"
    description: "Contradiction means decision ELIGIBLE against NOT_ELIGIBLE_RECOMMENDED, or NOT_ELIGIBLE against ELIGIBLE_RECOMMENDED."

  - priority: 32
    category: business_constraint
    check: "Kindergarten transition actions must follow the order SCHEDULE_CONFERENCE -> SEND_PACKET -> EXIT"
    error_id: ERR_TRANSITION_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "POST /child-find/service-plans/{id}/kindergarten-transition"
    description: "kindergarten_transition_status must be NOT_STARTED for SCHEDULE_CONFERENCE, CONFERENCE_SCHEDULED for SEND_PACKET, PACKET_SENT for EXIT."

  - priority: 33
    category: business_constraint
    check: "A screening event may not be COMPLETED while any of its slots is still BOOKED"
    error_id: ERR_SCREENING_SLOTS_UNRESOLVED
    http_status: 409
    applies_to: "POST /child-find/screening-events/{id}/status"
    description: "Every slot must be ATTENDED, NO_SHOW or CANCELLED first."

  - priority: 34
    category: business_fiscal
    check: "booked_slot_count < effective_slot_capacity before a slot is booked"
    error_id: ERR_SCREENING_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /child-find/screening-events/{id}/slots"
    description: "The binding limit is min(slot_capacity, floor(window_minutes / slot_length_minutes))."

  - priority: 35
    category: business_fiscal
    check: "A community preschool site's reserved_iep_seat_count < iep_seat_capacity before a plan reserves a seat"
    error_id: ERR_IEP_SEAT_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /child-find/service-plans/{id}/consent-submission"
    description: "Seats are held by PENDING_PARENT_CONSENT and ACTIVE plans only."

  - priority: 36
    category: business_fiscal
    check: "A chair's active_evaluation_count < max_evaluation_caseload before a new case is opened"
    error_id: ERR_EVALUATION_CASELOAD_EXCEEDED
    http_status: 422
    applies_to: "POST /child-find/referrals/{id}/evaluation-cases"
    description: "Counts the five non-terminal case statuses; cancelling a case frees a slot."

  - priority: 37
    category: business_fiscal
    check: "The provider's projected assigned_weekly_service_minutes after the write must not exceed max_weekly_service_minutes"
    error_id: ERR_PROVIDER_CASELOAD_EXCEEDED
    http_status: 422
    applies_to: "POST /child-find/service-lines/{id}/staff"
    description: "Strict greater-than test, so landing exactly on the cap is allowed; the projection includes the recomputed travel overhead, not just the direct minutes."

  - priority: 38
    category: business_fiscal
    check: "An interpreter's assigned_interpreter_assignment_count < max_weekly_interpreter_assignments before a notice names them"
    error_id: ERR_INTERPRETER_UNAVAILABLE
    http_status: 422
    applies_to: "POST /child-find/referrals/{id}/consent-requests, POST /child-find/service-plans/{id}/consent-submission"
    description: "The lowest-priority rule in the ladder, so an unavailable interpreter is only reported once every language, referential and state rule has passed."

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
# Header contract: every request carries X-User-ID and X-User-Role.
# Every list endpoint accepts limit? / offset? / status? and returns the
# paginated envelope of §1.0.
endpoints:

  # ---------------------------------------------------------------- reads: one
  - method: GET
    path: "/child-find/children/{id}"
