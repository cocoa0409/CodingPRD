              captures: { crn_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr_nodisc_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${pol_id}", confidence: 0.70, matched_snippet: "urges a yes vote" }, { policy_rule_id: "${alc_id}", confidence: 0.60, matched_snippet: "spirits industry support" }], expected_ad_creative_version: "${crn_v}" }
              as: PolicyAdmin
