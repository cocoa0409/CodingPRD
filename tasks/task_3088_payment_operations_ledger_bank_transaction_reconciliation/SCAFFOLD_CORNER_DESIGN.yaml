  - name: dispatch_from_returned_is_locked_out_by_the_terminal_state
    claim_type: Terminal State Lockdown
    grounds:
    - state_machines.PaymentOrder.transitions.IN_FLIGHT_to_RETURNED
    - state_machines.PaymentOrder.terminal_states
    - errors[ERR_INVALID_TRANSITION]
