            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: EMAIL, received_at: "2026-08-01T00:00:00Z", raw_message: "Soft matter, no injury." }, captures: { ct1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: FOREIGN_MATERIAL, reported_batch_code: "A1B20260710", foreign_object_class: SOFT }, captures: { cp1: "$.data.id" } }
            - { call: "POST /complaints/${cp1}/triage", as: CareSupervisor, as_user_id: "${sup1}", payload: { reviewer_note: "Low." } }
            - { call: "POST /regulatory-reports", as: RegulatoryOfficer, as_user_id: "${ro1}", payload: { complaint_id: "${cp1}", report_kind: FOREIGN_MATERIAL_INJURY }, captures: { rr1: "$.data.id", st1: "$.data.status" } }
          trigger:
            - { call: "POST /regulatory-reports", as: RegulatoryOfficer, as_user_id: "${ro1}", payload: { complaint_id: "${cp1}", report_kind: ADVERSE_EVENT }, captures: { e1: "$.data.error_id" } }
            - { call: "POST /regulatory-reports/${rr1}/submit", as: RegulatoryOfficer, as_user_id: "${ro1}", payload: { agency_reference: "AG-00001" }, captures: { e2: "$.data.error_id" } }
