            - { call: "POST /api/partner-institutions", payload: { legal_name: "Harbor CU", charter_type: "CREDIT_UNION" }, as: CoalitionAdmin, captures: { inst_id: $.data.id, inst_v: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst_v}" }, as: CoalitionAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /api/certification-reviews/${rev_id}/score", payload: { criteria_ratings: [ { criterion: "FEE_COMPLIANCE", rating: 4 }, { criterion: "ACCESS", rating: 4 }, { criterion: "ALT_ID", rating: 4 }, { criterion: "CHEX_POLICY", rating: 4 }, { criterion: "EDUCATION_SUPPORT", rating: 4 } ] }, as: CoalitionAdmin, as_user_id: "admin-scorer" }
            - { call: "POST /api/certification-reviews/${rev_id}/finalize", payload: {}, as: CoalitionAdmin, as_user_id: "admin-finalizer" }
          trigger:
            - { call: "POST /api/partner-institutions/${inst_id}/suspend", payload: {}, as: CoalitionAdmin, captures: { s1: $.data.certification_status } }
            - { call: "POST /api/partner-institutions/${inst_id}/reinstate", payload: {}, as: CoalitionAdmin, captures: { s2: $.data.certification_status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2028-05-02T00:00:00Z" }, as: CoalitionAdmin }
            - { call: "POST /api/ops/evaluate-due", payload: {}, as: CoalitionAdmin }
            - { call: "GET /api/partner-institutions/${inst_id}", payload: {}, as: CoalitionAdmin, captures: { s3: $.data.certification_status, inst_v2: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-04-01", period_end: "2026-04-30", expected_institution_version: "${inst_v2}" }, as: CoalitionAdmin, captures: { rev2: $.data.id, s4: $.data.status } }
            - { call: "POST /api/certification-reviews/${rev2}/score", payload: { criteria_ratings: [ { criterion: "FEE_COMPLIANCE", rating: 4 }, { criterion: "ACCESS", rating: 4 }, { criterion: "ALT_ID", rating: 4 }, { criterion: "CHEX_POLICY", rating: 4 }, { criterion: "EDUCATION_SUPPORT", rating: 4 } ] }, as: CoalitionAdmin, as_user_id: "admin-scorer" }
            - { call: "POST /api/certification-reviews/${rev2}/finalize", payload: {}, as: CoalitionAdmin, as_user_id: "admin-finalizer" }
            - { call: "GET /api/partner-institutions/${inst_id}", payload: {}, as: CoalitionAdmin, captures: { s5: $.data.certification_status, cert_at: $.data.certified_at } }
          assert:
            - "suspend hop: certification_status == SUSPENDED"
            - "reinstate hop: certification_status == CERTIFIED (clock 2026-05-01 < expiry 2028-05-01)"
            - "lapse hop: after clock 2028-05-02 + evaluate-due, certification_status == LAPSED"
            - "recert hop: new review creation moves LAPSED -> UNDER_REVIEW and review period 2026-04-01 satisfies the 30-day gap after period_end 2026-02-28"
            - "final hop: certification_status == CERTIFIED with certified_at == 2028-05-02T00:00:00Z (clock at finalize)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (two different triggers; depths 4 and 3)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: decert_finalize_fail_cascade
        grounds:
          - state_machines.CertificationReview.SCORED_to_FINALIZED_FAIL
          - state_machines.PartnerInstitution.UNDER_REVIEW_to_DECERTIFIED
          - state_machines.AccountOpeningEvent.SCHEDULED_to_CANCELLED
          - state_machines.Referral.BOOKED_to_DOCS_COMPLETE
          - calculations.participant_pipeline
        distinguishing_aspect: |
          Depth-4 chain from trigger POST .../finalize (FAIL): review FINALIZED_FAIL ->
          institution DECERTIFIED (1) -> SCHEDULED event CANCELLED (2) -> BOOKED referral
          released to DOCS_COMPLETE (3) -> participant pipeline_stage recomputed to
          DOCS_READY (4); each link caused by the previous link's mutation.
        test_recipe:
          setup:
            - "CERTIFIED institution; participant with DOCS_COMPLETE referral BOOKED onto a SCHEDULED event (booked_count 1, stage EVENT_BOOKED)"
            - "A second CertificationReview in SCORED with FEE_COMPLIANCE rating 0 (mandatory floor -> outcome FAIL)"
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
