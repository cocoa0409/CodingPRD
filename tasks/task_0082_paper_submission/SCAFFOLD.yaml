scenario: |
  Scientific paper submission system: submission management with author registration and ORCID binding,
  co-author confirmation, manuscript and supplementary-material upload, declaration forms
  (conflict-of-interest/funding/ethics), submission-status tracking, and withdrawal workflow;
  editor preliminary review and assignment with editor-in-chief and section-editor roster,
  scope-and-formatting pre-screening, desk-rejection workflow, plagiarism-detection integration,
  associate-editor assignment by topic, and assignment-acceptance window; reviewer matching
  (conflict-of-interest avoidance) with reviewer pool, expertise-tag matching, author-suggested and
  author-excluded reviewers handling, conflict rules (co-authorship/same-institution/recent
  collaboration), reviewer invitation workflow, and reviewer-acceptance-and-decline tracking;
  multi-round review comments with single-blind / double-blind / open review modes, review-form
  template, comment-aggregation across reviewers, reviewer-rating of paper, review-deadline
  reminder, and late-reviewer substitute arrangement; editor decision with decision categories
  (accept/minor-revision/major-revision/reject/transfer), decision-letter template with reviewer
  comments compilation, editor-recommendation-aggregation rules, editor-in-chief final decision,
  and decision-record archiving; revision tracking with author response letter, point-by-point
  reply, revised-manuscript with track changes, re-review by same or new reviewers,
  revision-round counter, and revision-time-limit enforcement; typesetting and publication with
  copy-editing workflow, proof-correction by author, DOI assignment, online-first and
  issue-assignment, indexing-database submission (PubMed/Web of Science/Scopus), and
  post-publication correction/retraction handling; event-driven synchronization with ORCID,
  plagiarism-detection service, IM, and indexing-database systems; audit logging for
  review-process and decision records.

domain_name: paper-submission
api_prefix: /manuscripts

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - selector_policy
    - version_pinning_on_approval
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Author
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Author full name as recorded for correspondence
      - name: email
        type: string
        source: input
        description: Unique email used as contact identifier
        constraints: "globally unique among Author rows"
      - name: orcid_id
        type: string
        source: input
        description: 16-digit ORCID identifier in the form 0000-0000-0000-0000
        constraints: "regex ^\\d{4}-\\d{4}-\\d{4}-\\d{4}$ when present; unique when present"
      - name: orcid_verified
        type: boolean
        source: computed
        description: True after ORCID binding event has been emitted for this orcid_id
        default: false
      - name: institution
        type: string
        source: input
        description: Affiliation institution name; used by conflict-of-interest checks
      - name: recent_collaborator_ids
        type: array
        source: input
        description: Array of Author.id values the author co-published with in the last 36 months
        default: []

  - name: Reviewer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Reviewer name
      - name: email
        type: string
        source: input
        description: Unique reviewer email
        constraints: "globally unique among Reviewer rows"
      - name: institution
        type: string
        source: input
        description: Affiliation institution name
      - name: expertise_tags
        type: array
        source: input
        description: Array of topic tag strings (lower-snake-case)
        constraints: "non-empty; each tag matches ^[a-z0-9_]+$"
      - name: recent_collaborator_ids
        type: array
        source: input
        description: Array of Author.id values the reviewer co-published with in last 36 months
        default: []
      - name: active_assignments
        type: integer
        source: computed
        description: Count of ReviewerInvitation rows with status=ACCEPTED whose Review is not yet SUBMITTED
        default: 0
      - name: status
        type: enum
        source: input
        description: Lifecycle status of the reviewer pool entry
        constraints: "values: ACTIVE, SUSPENDED"
        default: ACTIVE

  - name: Editor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Editor name
      - name: email
        type: string
        source: input
        description: Unique editor email
        constraints: "globally unique among Editor rows"
      - name: institution
        type: string
        source: input
        description: Affiliation
      - name: role
        type: enum
        source: input
        description: Editor seat
        constraints: "values: EDITOR_IN_CHIEF, SECTION_EDITOR, ASSOCIATE_EDITOR"
      - name: topic_tags
        type: array
        source: input
        description: Topic tags this editor handles (lower-snake-case)
        constraints: "non-empty for SECTION_EDITOR and ASSOCIATE_EDITOR; ignored for EDITOR_IN_CHIEF"
      - name: recent_collaborator_ids
        type: array
        source: input
        description: Array of Author.id values the editor co-published with in last 36 months
        default: []

  - name: Manuscript
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: Manuscript title
      - name: corresponding_author_id
        type: string
        source: input
        description: Author.id of the corresponding author who submits the manuscript
      - name: co_author_ids
        type: array
        source: input
        description: Ordered list of Author.id values for non-corresponding co-authors
        default: []
      - name: topic_tag
        type: string
        source: input
        description: Primary topic tag used for editor and reviewer matching
        constraints: "matches ^[a-z0-9_]+$"
      - name: review_mode
        type: enum
        source: input
        description: Anonymity mode applied to all rounds of this manuscript
        constraints: "values: SINGLE_BLIND, DOUBLE_BLIND, OPEN"
      - name: manuscript_file_uri
        type: string
        source: input
        description: URI of the main manuscript file
      - name: supplementary_file_uris
        type: array
        source: input
        description: URIs of supplementary files
        default: []
      - name: declaration_coi
        type: string
        source: input
        description: Conflict-of-interest declaration text
      - name: declaration_funding
        type: string
        source: input
        description: Funding declaration text
      - name: declaration_ethics
        type: string
        source: input
        description: Ethics declaration text
      - name: suggested_reviewer_ids
        type: array
        source: input
        description: Reviewer.id values author requests
        default: []
      - name: excluded_reviewer_ids
        type: array
        source: input
        description: Reviewer.id values author explicitly excludes
        default: []
      - name: status
        type: enum
        source: computed
        description: Top-level lifecycle status (see §1.2 Manuscript state machine)
        constraints: "values: DRAFT, AWAITING_COAUTHOR, SUBMITTED, DESK_REJECTED, UNDER_REVIEW, REVISION_REQUIRED, REVISION_SUBMITTED, ACCEPTED, REJECTED, WITHDRAWN, IN_PRODUCTION, PUBLISHED, RETRACTED"
        default: DRAFT
      - name: section_editor_id
        type: string
        source: computed
        description: Editor.id assigned as section editor (set on SUBMITTED → UNDER_REVIEW path)
        default: null
      - name: associate_editor_id
        type: string
        source: computed
        description: Editor.id assigned by the section editor
        default: null
      - name: associate_assigned_at
        type: datetime
        source: computed
        description: Timestamp when associate_editor_id was set; opens the 5-day acceptance window
        default: null
      - name: associate_window_end_at
        type: datetime
        source: computed
        description: associate_assigned_at + 5 days; the assignment-acceptance window closes at this time
        default: null
      - name: revision_round
        type: integer
        source: computed
        description: Number of completed revision rounds; starts at 0
        default: 0
      - name: revision_deadline_at
        type: datetime
        source: computed
        description: Deadline by which the author must submit the next revision; null until set
        default: null
      - name: plagiarism_similarity
        type: number
        source: computed
        description: Latest plagiarism similarity percentage from the external service (0-100)
        default: null
      - name: doi
        type: string
        source: computed
        description: DOI minted on PUBLISHED transition; immutable after assignment
        default: null
      - name: issue_label
        type: string
        source: computed
        description: Volume/issue label assigned at publication
        default: null

  - name: CoAuthorConfirmation
    parent: Manuscript
    common_fields: true
    fields:
      - name: manuscript_id
        type: string
        source: input
        description: Manuscript.id being confirmed
      - name: author_id
        type: string
        source: input
        description: Author.id of the co-author confirming
      - name: status
        type: enum
        source: computed
        description: Confirmation status for this co-author on this manuscript
        constraints: "values: PENDING, CONFIRMED, DECLINED"
        default: PENDING
      - name: responded_at
        type: datetime
        source: computed
        description: When the co-author responded; null while PENDING
        default: null

  - name: PlagiarismCheck
    parent: Manuscript
    common_fields: false
    fields:
      - name: manuscript_id
        type: string
        source: input
        description: Manuscript.id this check belongs to
      - name: revision_round
        type: integer
        source: input
        description: Manuscript.revision_round at the time of the check
      - name: similarity_percent
        type: number
        source: input
        description: Similarity percentage (0-100) reported by the external service
      - name: report_uri
        type: string
        source: input
        description: URI of the detailed plagiarism report
      - name: result
        type: enum
        source: computed
        description: PASS when below threshold, FAIL when at or above
        constraints: "values: PASS, FAIL"

  - name: ReviewerInvitation
    parent: Manuscript
    common_fields: true
    fields:
      - name: manuscript_id
        type: string
        source: input
        description: Manuscript.id this invitation is for
      - name: reviewer_id
        type: string
        source: input
        description: Reviewer.id being invited
      - name: revision_round
        type: integer
        source: computed
        description: Manuscript.revision_round at time of invitation creation
      - name: response_deadline_at
        type: datetime
        source: computed
        description: Deadline by which the reviewer must accept or decline (server clock + 7 days)
      - name: status
        type: enum
        source: computed
        description: Invitation status
        constraints: "values: PENDING, ACCEPTED, DECLINED, EXPIRED, WITHDRAWN"
        default: PENDING
      - name: coi_score
        type: number
        source: computed
        description: Conflict-of-interest score (0-100) pinned at invitation creation
      - name: match_score
        type: number
        source: computed
        description: Reviewer-match score pinned at invitation creation

  - name: Review
    parent: ReviewerInvitation
    common_fields: true
    fields:
      - name: invitation_id
        type: string
        source: input
        description: ReviewerInvitation.id this review belongs to
      - name: manuscript_id
        type: string
        source: computed
        description: Denormalized Manuscript.id for query convenience
      - name: revision_round
        type: integer
        source: computed
        description: Round at which this review was solicited
      - name: rating
        type: integer
        source: input
        description: Reviewer's numeric rating of the paper, 1-5 inclusive
        constraints: "1 <= rating <= 5"
      - name: recommendation
        type: enum
        source: input
        description: Reviewer recommendation to the editor
        constraints: "values: ACCEPT, MINOR_REVISION, MAJOR_REVISION, REJECT"
      - name: comments_to_author
        type: string
        source: input
        description: Comments visible to the author
      - name: comments_to_editor
        type: string
        source: input
        description: Confidential comments to the editor
      - name: status
        type: enum
        source: computed
        description: Review lifecycle status
        constraints: "values: DRAFT, SUBMITTED, SUPERSEDED"
        default: DRAFT
      - name: submitted_at
        type: datetime
        source: computed
        description: When the reviewer submitted the review; null while DRAFT
        default: null
      - name: review_deadline_at
        type: datetime
        source: computed
        description: Deadline copied from the invitation acceptance plus 21 days

  - name: EditorDecision
    parent: Manuscript
    common_fields: true
    fields:
      - name: manuscript_id
        type: string
        source: input
        description: Manuscript.id
      - name: revision_round
        type: integer
        source: input
        description: Round this decision finalizes
      - name: recommendation_from_associate
        type: enum
        source: input
        description: Associate editor's recommendation for this round
        constraints: "values: ACCEPT, MINOR_REVISION, MAJOR_REVISION, REJECT, TRANSFER"
      - name: aggregate_score
        type: number
        source: computed
        description: Aggregated reviewer score for this round (see C4)
      - name: aggregated_category
        type: enum
        source: computed
        description: Aggregated category derived from aggregate_score (see C1)
        constraints: "values: ACCEPT, MINOR_REVISION, MAJOR_REVISION, REJECT"
      - name: final_decision
        type: enum
        source: input
        description: Editor-in-chief's final decision; recorded when status=FINALIZED
        constraints: "values: ACCEPT, MINOR_REVISION, MAJOR_REVISION, REJECT, TRANSFER"
      - name: decision_letter_body
        type: string
        source: input
        description: Final decision letter body authored by editor-in-chief
      - name: compiled_reviewer_comments
        type: string
        source: computed
        description: Snapshot of submitted reviewer comments_to_author, concatenated in submitted_at order
      - name: status
        type: enum
        source: computed
        description: Decision lifecycle status
        constraints: "values: DRAFT, RECOMMENDED, FINALIZED"
        default: DRAFT
      - name: finalized_at
        type: datetime
        source: computed
        description: When the editor-in-chief finalized; null otherwise
        default: null

  - name: Publication
    parent: Manuscript
    common_fields: true
    fields:
      - name: manuscript_id
        type: string
        source: input
        description: Manuscript.id (1:1 with Manuscript once created)
        constraints: "unique"
      - name: copy_edit_uri
        type: string
        source: input
        description: URI of copy-edited manuscript
      - name: proof_uri
        type: string
        source: input
        description: URI of the proof produced for author correction
      - name: doi
        type: string
        source: computed
        description: DOI minted on PUBLISHED transition
      - name: issue_label
        type: string
        source: input
        description: Volume/issue label
      - name: indexing_targets
        type: array
        source: input
        description: Indexing databases requested
        constraints: "subset of {PUBMED, WEB_OF_SCIENCE, SCOPUS}"
        default: []
      - name: indexing_status
        type: object
        source: computed
        description: Map of target -> status, where status in {PENDING, ACK, FAILED}
        default: {}
      - name: status
        type: enum
        source: computed
        description: Publication pipeline status
        constraints: "values: COPY_EDITING, PROOF_REVIEW, ONLINE_FIRST, PUBLISHED, RETRACTED"
        default: COPY_EDITING
      - name: published_at
        type: datetime
        source: computed
        description: Set when status enters PUBLISHED
        default: null

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: actor_role
        type: string
        source: system
        description: X-User-Role header at time of event
      - name: actor_id
        type: string
        source: system
        description: X-User-ID header at time of event
      - name: entity
        type: string
        source: system
        description: Affected entity name (e.g., Manuscript, Review)
      - name: entity_id
        type: string
        source: system
        description: Affected entity primary key
      - name: action
        type: string
        source: system
        description: Symbolic action token (e.g., MANUSCRIPT_SUBMITTED, DECISION_FINALIZED)
      - name: from_state
        type: string
        source: system
        description: State before transition; null for create
      - name: to_state
        type: string
        source: system
        description: State after transition; null for read
      - name: details
        type: object
        source: system
        description: Free-form structured details
        default: {}

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Manuscript
    initial_state: DRAFT
    terminal_states: [DESK_REJECTED, REJECTED, WITHDRAWN, PUBLISHED, RETRACTED]
    transitions:
      - from: DRAFT
        to: AWAITING_COAUTHOR
        trigger: "POST /manuscripts/{id}/submit"
        actor: Author
        preconditions:
          - "Author of corresponding_author_id has orcid_verified=true"
          - "all required declarations (coi, funding, ethics) non-empty"
          - "manuscript_file_uri non-empty"
          - "co_author_ids is non-empty"
        side_effects:
          - "create one CoAuthorConfirmation row per co_author_id with status=PENDING"
          - "append AuditLog action=MANUSCRIPT_SUBMITTED"

      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /manuscripts/{id}/submit"
        actor: Author
        preconditions:
          - "co_author_ids is empty"
          - "Author of corresponding_author_id has orcid_verified=true"
          - "all required declarations non-empty"
        side_effects:
          - "request plagiarism check via POST /_events/plagiarism-result (recorded as PlagiarismCheck)"
          - "append AuditLog action=MANUSCRIPT_SUBMITTED"

      - from: AWAITING_COAUTHOR
        to: SUBMITTED
        trigger: "automatic when last CoAuthorConfirmation.status flips to CONFIRMED"
        actor: system
        preconditions:
          - "all CoAuthorConfirmation rows for this manuscript have status=CONFIRMED"
        side_effects:
          - "request plagiarism check (PlagiarismCheck row recorded on /_events/plagiarism-result)"
          - "append AuditLog action=COAUTHORS_CONFIRMED"

      - from: AWAITING_COAUTHOR
        to: WITHDRAWN
        trigger: "automatic when any CoAuthorConfirmation.status flips to DECLINED"
        actor: system
        preconditions:
          - "at least one CoAuthorConfirmation row for this manuscript has status=DECLINED"
        side_effects:
          - "set remaining PENDING CoAuthorConfirmation rows to status=DECLINED with responded_at=now"
          - "append AuditLog action=COAUTHOR_DECLINED_AUTO_WITHDRAW"

      - from: SUBMITTED
        to: DESK_REJECTED
        trigger: "POST /manuscripts/{id}/desk-reject"
        actor: SectionEditor
        preconditions:
          - "latest PlagiarismCheck.result == FAIL OR section editor cites scope/formatting reason"
          - "Manuscript has section_editor_id assigned"
        side_effects:
          - "append AuditLog action=DESK_REJECTED"
          - "emit IM notification event"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /manuscripts/{id}/assign-associate"
        actor: SectionEditor
        preconditions:
          - "latest PlagiarismCheck.result == PASS"
          - "associate_editor_id supplied refers to Editor with role=ASSOCIATE_EDITOR and topic_tags containing manuscript.topic_tag"
          - "no ReviewerInvitation rows exist for this manuscript at current revision_round"
          - "candidate associate editor has no other Manuscript with associate_window_end_at > now (no overlapping assignment-acceptance window per ERR_EDITOR_WINDOW_OVERLAP)"
        side_effects:
          - "set associate_editor_id"
          - "set associate_assigned_at = now, associate_window_end_at = now + 5 days"
          - "append AuditLog action=ASSOCIATE_ASSIGNED"

      - from: UNDER_REVIEW
        to: REVISION_REQUIRED
        trigger: "POST /manuscripts/{id}/decisions/{decisionId}/finalize with final_decision in {MINOR_REVISION, MAJOR_REVISION}"
        actor: EditorInChief
        preconditions:
          - "EditorDecision.status == RECOMMENDED for current revision_round"
          - "at least two Review rows with status=SUBMITTED for current revision_round"
        side_effects:
          - "set revision_deadline_at = now + (30 days if MINOR_REVISION else 60 days)"
          - "set EditorDecision.status=FINALIZED"
          - "emit IM notification to corresponding_author_id"
          - "append AuditLog action=REVISION_REQUESTED"

      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /manuscripts/{id}/decisions/{decisionId}/finalize with final_decision=ACCEPT"
        actor: EditorInChief
        preconditions:
          - "EditorDecision.status == RECOMMENDED"
          - "at least two Review rows with status=SUBMITTED for current revision_round"
        side_effects:
          - "set EditorDecision.status=FINALIZED, finalized_at=now"
          - "append AuditLog action=ACCEPTED"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /manuscripts/{id}/decisions/{decisionId}/finalize with final_decision=REJECT"
        actor: EditorInChief
        preconditions:
          - "EditorDecision.status == RECOMMENDED"
          - "at least two Review rows with status=SUBMITTED for current revision_round"
        side_effects:
          - "set EditorDecision.status=FINALIZED, finalized_at=now"
          - "append AuditLog action=REJECTED"

      - from: REVISION_REQUIRED
        to: REVISION_SUBMITTED
        trigger: "POST /manuscripts/{id}/revisions"
        actor: Author
        preconditions:
          - "now <= revision_deadline_at"
          - "request body supplies response_letter and revised_file_uri"
        side_effects:
          - "increment revision_round by 1"
          - "supersede prior Review rows (status DRAFT/SUBMITTED at old round) to status=SUPERSEDED"
          - "append AuditLog action=REVISION_SUBMITTED"

      - from: REVISION_REQUIRED
        to: WITHDRAWN
        trigger: "automatic at sweep time when now > revision_deadline_at"
        actor: system
        preconditions:
          - "revision_deadline_at is not null and now > revision_deadline_at"
        side_effects:
          - "append AuditLog action=REVISION_TIMEOUT_AUTO_WITHDRAW"

      - from: REVISION_SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /manuscripts/{id}/reinvite-reviewers"
        actor: AssociateEditor
        preconditions:
          - "at least one new ReviewerInvitation created at the new revision_round"
        side_effects:
          - "append AuditLog action=NEW_ROUND_STARTED"

      - from: ACCEPTED
        to: IN_PRODUCTION
        trigger: "POST /manuscripts/{id}/publications (create Publication)"
        actor: PlatformAdmin
        preconditions:
          - "no Publication exists for manuscript_id"
        side_effects:
          - "create Publication row with status=COPY_EDITING"
          - "append AuditLog action=PRODUCTION_STARTED"

      - from: IN_PRODUCTION
        to: PUBLISHED
        trigger: "automatic when Publication.status transitions to PUBLISHED"
        actor: system
        preconditions:
          - "Publication.status == PUBLISHED"
        side_effects:
          - "copy Publication.doi to Manuscript.doi"
          - "copy Publication.issue_label to Manuscript.issue_label"
          - "append AuditLog action=MANUSCRIPT_PUBLISHED"

      - from: PUBLISHED
        to: RETRACTED
        trigger: "POST /manuscripts/{id}/retract"
        actor: EditorInChief
        preconditions:
          - "Manuscript.status == PUBLISHED"
        side_effects:
          - "set Publication.status=RETRACTED"
          - "append AuditLog action=RETRACTED"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /manuscripts/{id}/withdraw"
        actor: Author
        preconditions: []
        side_effects:
          - "append AuditLog action=WITHDRAWN_BY_AUTHOR"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /manuscripts/{id}/withdraw"
        actor: Author
        preconditions: []
        side_effects:
          - "set all PENDING ReviewerInvitation rows for this manuscript at current revision_round to status=WITHDRAWN"
          - "append AuditLog action=WITHDRAWN_BY_AUTHOR"

      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /manuscripts/{id}/withdraw"
        actor: Author
        preconditions: []
        side_effects:
          - "set all PENDING ReviewerInvitation rows for this manuscript at current revision_round to status=WITHDRAWN"
          - "supersede all DRAFT/SUBMITTED Review rows at current revision_round (status=SUPERSEDED)"
          - "append AuditLog action=WITHDRAWN_BY_AUTHOR"

  - entity: CoAuthorConfirmation
    initial_state: PENDING
    terminal_states: [CONFIRMED, DECLINED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /manuscripts/{mid}/coauthor-confirmations/{id}/confirm"
        actor: Author
        preconditions:
          - "X-User-ID equals author_id"
        side_effects:
          - "set responded_at=now"
          - "Manuscript bubble-up: when last sibling flips to CONFIRMED, Manuscript transitions AWAITING_COAUTHOR -> SUBMITTED"

      - from: PENDING
        to: DECLINED
        trigger: "POST /manuscripts/{mid}/coauthor-confirmations/{id}/decline"
        actor: Author
        preconditions:
          - "X-User-ID equals author_id"
        side_effects:
          - "set responded_at=now"
          - "Manuscript bubble-up: Manuscript transitions AWAITING_COAUTHOR -> WITHDRAWN (cascaded auto-decline of remaining PENDING siblings)"

  - entity: ReviewerInvitation
    initial_state: PENDING
    terminal_states: [DECLINED, EXPIRED, WITHDRAWN, ACCEPTED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /manuscripts/{mid}/invitations/{id}/accept"
        actor: Reviewer
        preconditions:
          - "X-User-ID equals reviewer_id"
          - "now <= response_deadline_at"
          - "Manuscript.status == UNDER_REVIEW"
        side_effects:
          - "create Review row with status=DRAFT and review_deadline_at = now + 21 days"
          - "increment Reviewer.active_assignments by 1"

      - from: PENDING
        to: DECLINED
        trigger: "POST /manuscripts/{mid}/invitations/{id}/decline"
        actor: Reviewer
        preconditions:
          - "X-User-ID equals reviewer_id"
        side_effects:
          - "append AuditLog action=INVITATION_DECLINED"

      - from: PENDING
        to: EXPIRED
        trigger: "automatic at sweep when now > response_deadline_at"
        actor: system
        preconditions:
          - "now > response_deadline_at"
        side_effects:
          - "append AuditLog action=INVITATION_EXPIRED"

      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /manuscripts/{mid}/invitations/{id}/withdraw"
        actor: AssociateEditor
        preconditions:
          - "Manuscript.associate_editor_id equals X-User-ID"
        side_effects:
          - "append AuditLog action=INVITATION_WITHDRAWN"

  - entity: Review
    initial_state: DRAFT
    terminal_states: [SUBMITTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /reviews/{id}/submit"
        actor: Reviewer
        preconditions:
          - "X-User-ID equals reviewer_id of parent ReviewerInvitation"
          - "rating, recommendation, comments_to_author, comments_to_editor all non-empty"
          - "Manuscript.status == UNDER_REVIEW"
        side_effects:
          - "set submitted_at=now"
          - "decrement Reviewer.active_assignments by 1"

      - from: DRAFT
        to: SUPERSEDED
        trigger: "automatic when parent Manuscript transitions to REVISION_SUBMITTED at higher revision_round, or when Manuscript transitions to WITHDRAWN/REJECTED"
        actor: system
        preconditions: []
        side_effects:
          - "set submitted_at=null"
          - "append AuditLog action=REVIEW_SUPERSEDED"

      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "automatic when parent Manuscript transitions to REVISION_SUBMITTED at higher revision_round"
        actor: system
        preconditions: []
        side_effects:
          - "append AuditLog action=REVIEW_SUPERSEDED"

  - entity: EditorDecision
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: RECOMMENDED
        trigger: "POST /manuscripts/{mid}/decisions/{id}/recommend"
        actor: AssociateEditor
        preconditions:
          - "Manuscript.associate_editor_id == X-User-ID"
          - "at least two Review rows with status=SUBMITTED at Manuscript.revision_round"
          - "recommendation_from_associate supplied"
        side_effects:
          - "compute aggregate_score and aggregated_category per C1 and C4"
          - "compile compiled_reviewer_comments from submitted reviews (ordered by submitted_at)"

      - from: RECOMMENDED
        to: FINALIZED
        trigger: "POST /manuscripts/{mid}/decisions/{id}/finalize"
        actor: EditorInChief
        preconditions:
          - "final_decision supplied and decision_letter_body non-empty"
        side_effects:
          - "set finalized_at=now"
          - "Manuscript transitions UNDER_REVIEW -> (ACCEPTED | REJECTED | REVISION_REQUIRED) per final_decision"
          - "append AuditLog action=DECISION_FINALIZED"

  - entity: Publication
    initial_state: COPY_EDITING
    terminal_states: [RETRACTED, PUBLISHED]
    transitions:
      - from: COPY_EDITING
        to: PROOF_REVIEW
        trigger: "POST /publications/{id}/send-proof"
        actor: PlatformAdmin
        preconditions:
          - "copy_edit_uri non-empty"
          - "proof_uri non-empty"
        side_effects:
          - "append AuditLog action=PROOF_SENT"

      - from: PROOF_REVIEW
        to: ONLINE_FIRST
        trigger: "POST /publications/{id}/approve-proof"
        actor: Author
        preconditions:
          - "X-User-ID equals Manuscript.corresponding_author_id"
        side_effects:
          - "mint doi via POST /_events/doi-mint result; assign Publication.doi"
          - "append AuditLog action=ONLINE_FIRST"

      - from: ONLINE_FIRST
        to: PUBLISHED
        trigger: "POST /publications/{id}/publish-issue"
        actor: PlatformAdmin
        preconditions:
          - "doi is non-null"
          - "issue_label non-empty"
        side_effects:
          - "set published_at=now"
          - "initialize indexing_status: each target -> PENDING"
          - "cascade Manuscript: IN_PRODUCTION -> PUBLISHED (which copies doi and issue_label to Manuscript)"

      - from: PUBLISHED
        to: RETRACTED
        trigger: "automatic when Manuscript.status flips to RETRACTED"
        actor: system
        preconditions: []
        side_effects:
          - "set all indexing_status entries to FAILED"
          - "append AuditLog action=PUBLICATION_RETRACTED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two simultaneous POST /manuscripts/{id}/invitations for the same reviewer on the same manuscript at the same revision_round"
    guarantee: "At most one ReviewerInvitation row exists per (manuscript_id, reviewer_id, revision_round); the second creation is rejected"
    error_id: ERR_INVITATION_ALREADY_EXISTS
    http_status: 409
    serialization: "First-writer-wins on (manuscript_id, reviewer_id, revision_round) tuple"

  - scenario: "Associate editor finalizes a recommendation while another associate editor reassigns the manuscript"
    guarantee: "Exactly one outcome wins; the loser sees the manuscript in an unexpected associate_editor_id"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Manuscript.version"

  - scenario: "Two co-authors confirm and decline simultaneously on the same manuscript while the last sibling is pending"
    guarantee: "Manuscript transitions atomically once; only one of SUBMITTED or WITHDRAWN can win"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Manuscript.status flip from AWAITING_COAUTHOR"

  - scenario: "Editor-in-chief finalizes decision while author submits revision against the same revision_round"
    guarantee: "First write wins; loser of FINALIZE sees ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Manuscript.status (UNDER_REVIEW -> {ACCEPTED|REJECTED|REVISION_REQUIRED} vs UNDER_REVIEW stays)"

  - scenario: "Editor-in-chief finalizes decision while author submits revision against the same revision_round, but the revision write commits first"
    guarantee: "Revision wins; the FINALIZE call sees the manuscript no longer in UNDER_REVIEW"
    error_id: ERR_REVIEW_ROUND_MISMATCH
    http_status: 409
    serialization: "First-writer-wins on Manuscript.revision_round"

  - scenario: "Two PlatformAdmin POST /manuscripts/{id}/publications calls race"
    guarantee: "At most one Publication per Manuscript"
    error_id: ERR_PUBLICATION_ALREADY_EXISTS
    http_status: 409
    serialization: "Unique constraint on Publication.manuscript_id"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: aggregated_category_from_recommendation_vote
    trigger: "during POST /manuscripts/{mid}/decisions/{id}/recommend; written to EditorDecision.aggregated_category"
    algorithm: aggregation
    formula: |
      # Let R = submitted Review rows for Manuscript at current revision_round, ordered by submitted_at ascending.
      # Map each Review.recommendation to a category index:
      #   ACCEPT=0, MINOR_REVISION=1, MAJOR_REVISION=2, REJECT=3
      # vote_counts[i] = number of reviews with category i
      # Pick the category with the highest count. Tie-break: when two or more categories tie,
      # pick the category with the LOWEST index (most lenient) — pinned tie-break.
      # If associate's recommendation_from_associate == TRANSFER, output ACCEPT (TRANSFER is logged but
      # aggregated_category is constrained to {ACCEPT, MINOR_REVISION, MAJOR_REVISION, REJECT}).
      categories = [r.recommendation for r in R]
      counts = [categories.count(c) for c in ['ACCEPT','MINOR_REVISION','MAJOR_REVISION','REJECT']]
      max_count = max(counts)
      aggregated_category = ['ACCEPT','MINOR_REVISION','MAJOR_REVISION','REJECT'][counts.index(max_count)]
    input_set: "Review rows with status=SUBMITTED at Manuscript.revision_round (submitted reviews only)"
    constants: {}
    precision: "n/a (categorical)"
    variants:
      - name: majority_vote
        when: "default — aggregated_category as above"
        difference: "Pure plurality among reviewer recommendations; aggregate_score is informational"
      - name: editor_discretion_override
        when: "editor-in-chief finalize step — final_decision in body MAY override aggregated_category"
        difference: "Manuscript transition is driven by final_decision, NOT aggregated_category. Two valid algorithms on the same data: (a) trust aggregated_category, (b) accept the editor-in-chief's final_decision verbatim. Reference implementation uses (b) at finalize, but aggregated_category is still recorded for audit and CAN diverge from final_decision (different result for identical reviewer set)."

  - name: aggregate_score_from_ratings
    trigger: "during POST /manuscripts/{mid}/decisions/{id}/recommend; written to EditorDecision.aggregate_score"
    algorithm: aggregation
    formula: |
      # R = submitted Review rows at Manuscript.revision_round.
      # rating_i in {1,2,3,4,5} (integer).
      # Each reviewer's contribution is weight-adjusted by recommendation:
      #   recommendation_weight: ACCEPT=1.20, MINOR_REVISION=1.00, MAJOR_REVISION=0.85, REJECT=0.60
      #
      # PINNED ORDER (matters): round-per-reviewer THEN average. Two valid orderings exist:
      #   Order A (pinned, official): weighted_i = round(rating_i * weight_i, 2, ROUND_HALF_UP)
      #                               aggregate_score = round(sum(weighted_i) / len(R), 2, ROUND_HALF_UP)
      #   Order B (alternative):      aggregate_score = round(sum(rating_i * weight_i) / len(R), 2, ROUND_HALF_UP)
      # Order A and Order B can yield different aggregate_score for identical inputs because the
      # per-reviewer round introduces or absorbs sub-cent fractions before the final average round.
      # Reference implementation uses Order A (round per-reviewer first, then average).
      weighted_i = round(rating_i * recommendation_weight(recommendation_i), 2)
      aggregate_score = round(sum(weighted_i) / len(R), 2)  # round_half_up
    input_set: "Review rows with status=SUBMITTED at current revision_round; exclude SUPERSEDED and DRAFT"
    constants:
      WEIGHT_ACCEPT: 1.215
      WEIGHT_MINOR_REVISION: 1.005
      WEIGHT_MAJOR_REVISION: 0.835
      WEIGHT_REJECT: 0.605
    precision: "2 decimal places, round_half_up"
    variants:
      - name: round_then_average
        when: "default — pinned order"
        difference: "Per-reviewer round first, then average, then final 2-decimal round"
      - name: average_then_round
        when: "alternative order (NOT used)"
        difference: "Sum raw weighted rating then divide then round. Worked example showing divergence: 2 reviewers, ratings=[3,4], both with recommendation MAJOR_REVISION (weight=0.835). Order A: weighted_1 = round(3*0.835, 2) = round(2.505, 2) = 2.51 (half-up); weighted_2 = round(4*0.835, 2) = round(3.34, 2) = 3.34; aggregate = round((2.51+3.34)/2, 2) = round(2.925, 2) = 2.93 (half-up). Order B: aggregate = round((3*0.835 + 4*0.835)/2, 2) = round(5.845/2, 2) = round(2.9225, 2) = 2.92. Identical inputs, different outputs — the scaffold pins Order A so aggregate_score=2.93."

  - name: conflict_of_interest_score
    trigger: "during POST /manuscripts/{mid}/invitations (creation); written to ReviewerInvitation.coi_score"
    algorithm: weighted_scoring
    formula: |
      # Inputs: manuscript M (with author_set = {corresponding_author_id} + co_author_ids),
      #         reviewer R, all Authors in author_set.
      # Three independent COI signals, each contributes a weighted penalty:
      #
      # signal_co_authorship: any author A in author_set has A.id in R.recent_collaborator_ids
      #                       OR R.id in A.recent_collaborator_ids
      # signal_same_institution: any author A in author_set has A.institution == R.institution
      # signal_excluded: R.id in M.excluded_reviewer_ids
      #
      # Combinatorial formula with 3 inputs:
      #   raw = (W_COAUTHOR if signal_co_authorship else 0)
      #       + (W_INSTITUTION if signal_same_institution else 0)
      #       + (W_EXCLUDED if signal_excluded else 0)
      #
      # Apply non-linear cap: coi_score = min(raw, COI_CAP)
      #
      # When coi_score >= COI_REJECT_THRESHOLD, ReviewerInvitation creation is REJECTED with
      # ERR_REVIEWER_CONFLICT.
    input_set: "Author rows referenced by manuscript + the candidate Reviewer row"
    constants:
      W_COAUTHOR: 60
      W_INSTITUTION: 30
      W_EXCLUDED: 100
      COI_CAP: 100
      COI_REJECT_THRESHOLD: 50
    precision: "integer 0-100"
    variants:
      - name: strict_threshold
        when: "default"
        difference: "Any single signal that crosses COI_REJECT_THRESHOLD (e.g., W_EXCLUDED alone) rejects; combined small signals can also cross threshold"

  - name: reviewer_match_score
    trigger: "during POST /manuscripts/{mid}/invitations (creation); written to ReviewerInvitation.match_score"
    algorithm: weighted_scoring
    formula: |
      # Inputs: Manuscript M (with topic_tag), Reviewer R (with expertise_tags array, active_assignments).
      # tag_match = 1 if M.topic_tag in R.expertise_tags else 0
      # suggested_bonus = 1 if R.id in M.suggested_reviewer_ids else 0
      # load_penalty = R.active_assignments
      #
      # raw = (W_TAG * tag_match) + (W_SUGGESTED * suggested_bonus) - (W_LOAD * load_penalty)
      # match_score = max(0, min(100, raw))
      #
      # Used to rank candidate reviewers and recorded at invitation creation for audit.
      # Two valid algorithms exist (load_subtractive vs load_multiplicative). The reference
      # implementation pins load_subtractive at invitation creation. The alternative algorithm
      # would yield different match_score for identical (tag_match, suggested_bonus, load_penalty)
      # inputs whenever load_penalty > 0.
    input_set: "Manuscript and Reviewer rows"
    constants:
      W_TAG: 60
      W_SUGGESTED: 30
      W_LOAD: 10
      REVIEWER_MAX_CONCURRENT: 3
      EDITOR_ASSIGNMENT_WINDOW_DAYS: 5
    precision: "integer 0-100"
    variants:
      - name: load_subtractive
        when: "default — used by /invitations creation"
        difference: "match_score = max(0, min(100, W_TAG*tag_match + W_SUGGESTED*suggested_bonus - W_LOAD*load_penalty))"
      - name: load_multiplicative
        when: "alternate algorithm a different team could legitimately implement"
        difference: "match_score = max(0, min(100, (W_TAG*tag_match + W_SUGGESTED*suggested_bonus) * (1 - 0.1*load_penalty))). For tag=1, suggested=0, load=3: subtractive yields 60-30=30; multiplicative yields 60*0.7=42 — different result for identical inputs."

  - name: plagiarism_pass_fail
    trigger: "on POST /_events/plagiarism-result; written to PlagiarismCheck.result"
    algorithm: threshold
    formula: |
      # result = FAIL if similarity_percent >= PLAGIARISM_THRESHOLD else PASS
      # Boundary is INCLUSIVE on FAIL side (>=).
    input_set: "PlagiarismCheck row being inserted"
    constants:
      PLAGIARISM_THRESHOLD: 25.0
    precision: "1 decimal place on similarity"
    variants:
      - name: strict_ge
        when: "default"
        difference: "Inclusive >= on threshold: 25.0 fails, 24.9 passes"

  - name: revision_deadline
    trigger: "on Manuscript transition UNDER_REVIEW -> REVISION_REQUIRED; written to Manuscript.revision_deadline_at"
    algorithm: threshold
    formula: |
      # if final_decision == MINOR_REVISION: delta = 30 days
      # if final_decision == MAJOR_REVISION: delta = 60 days
      # revision_deadline_at = now + delta
    input_set: "EditorDecision.final_decision and server clock"
    constants:
      MINOR_DAYS: 30
      MAJOR_DAYS: 60
    precision: "millisecond"
    variants:
      - name: server_clock
        when: "default"
        difference: "Uses /_clock/advance for tests; production uses wall clock"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and parseable"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role permitted for this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resources resolve left-to-right; parent (e.g., Manuscript) must exist before child (Review, Invitation)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Foreign-key fields in request body reference existing rows (corresponding_author_id, co_author_ids, suggested_reviewer_ids, excluded_reviewer_ids, associate_editor_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "Target entity is in a state from which the requested transition is allowed (see §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all

  - priority: 6
    category: state
    check: "Optimistic concurrency: if request body contains `version`, it must equal stored entity version; otherwise reject"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all mutation endpoints with optional version field"

  - priority: 7
    category: business_safety
    check: "On manuscript submit (POST /manuscripts/{id}/submit), corresponding author must have orcid_verified=true"
    error_id: ERR_ORCID_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /manuscripts/{id}/submit"

  - priority: 8
    category: business_safety
    check: "On manuscript submit, declarations_coi, declarations_funding, declarations_ethics all non-empty AND manuscript_file_uri non-empty"
    error_id: ERR_DECLARATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /manuscripts/{id}/submit"

  - priority: 9
    category: business_safety
    check: "On reviewer invitation create, the candidate reviewer must NOT trigger conflict-of-interest (coi_score < COI_REJECT_THRESHOLD)"
    error_id: ERR_REVIEWER_CONFLICT
    http_status: 422
    applies_to: "POST /manuscripts/{id}/invitations"

  - priority: 10
    category: business_referential
    check: "On reviewer invitation create, the candidate reviewer.id must NOT be in manuscript.excluded_reviewer_ids (this is one source of ERR_REVIEWER_CONFLICT but produces this distinct error when it is the ONLY signal)"
    error_id: ERR_REVIEWER_EXCLUDED_BY_AUTHOR
    http_status: 422
    applies_to: "POST /manuscripts/{id}/invitations"

  - priority: 11
    category: business_referential
    check: "On assign-associate, associate editor's topic_tags must contain manuscript.topic_tag"
    error_id: ERR_EDITOR_TOPIC_MISMATCH
    http_status: 422
    applies_to: "POST /manuscripts/{id}/assign-associate"

  - priority: 12
    category: business_temporal
    check: "On invitation accept, now <= response_deadline_at"
    error_id: ERR_INVITATION_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /manuscripts/{mid}/invitations/{id}/accept"

  - priority: 13
    category: business_temporal
    check: "On revision submission, now <= revision_deadline_at"
    error_id: ERR_REVISION_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /manuscripts/{id}/revisions"

  - priority: 14
    category: business_constraint
    check: "On EditorDecision recommend, at least two Review rows with status=SUBMITTED exist at Manuscript.revision_round"
    error_id: ERR_INSUFFICIENT_REVIEWS
    http_status: 422
    applies_to: "POST /manuscripts/{mid}/decisions/{id}/recommend"

  - priority: 15
    category: business_constraint
    check: "On desk-reject, EITHER latest PlagiarismCheck.result=FAIL OR request body supplies non-empty `reason` string"
    error_id: ERR_DESK_REJECT_REASON_REQUIRED
    http_status: 422
    applies_to: "POST /manuscripts/{id}/desk-reject"

  - priority: 16
    category: business_constraint
    check: "On Review submit, rating in [1,5], recommendation in enum set, comments_to_author and comments_to_editor non-empty"
    error_id: ERR_REVIEW_INCOMPLETE
    http_status: 422
    applies_to: "POST /reviews/{id}/submit"

  - priority: 17
    category: business_fiscal
    check: "On Publication publish-issue, doi present (from prior ONLINE_FIRST mint) and issue_label non-empty"
    error_id: ERR_PUBLICATION_NOT_READY
    http_status: 422
    applies_to: "POST /publications/{id}/publish-issue"

  - priority: 18
    category: business_constraint
    check: "On Manuscript create, co_author_ids must not contain corresponding_author_id and must contain no duplicates"
    error_id: ERR_COAUTHOR_LIST_INVALID
    http_status: 422
    applies_to: "POST /manuscripts"

  - priority: 19
    category: business_constraint
    check: "On Manuscript create, suggested_reviewer_ids and excluded_reviewer_ids must be disjoint"
    error_id: ERR_REVIEWER_LISTS_OVERLAP
    http_status: 422
    applies_to: "POST /manuscripts"

  - priority: 20
    category: business_referential
    check: "On finalize, EditorDecision.revision_round must equal Manuscript.revision_round"
    error_id: ERR_REVIEW_ROUND_MISMATCH
    http_status: 409
    applies_to: "POST /manuscripts/{mid}/decisions/{id}/finalize"

  - priority: 21
    category: business_constraint
    check: "On invitation accept (interval-overlap on Reviewer resource as aggregate-capacity): Reviewer.active_assignments + 1 must be <= REVIEWER_MAX_CONCURRENT (= 3). The 'review interval' is the half-open window [accept_time, submit_time); aggregate capacity caps the count of overlapping windows on a single Reviewer."
    error_id: ERR_REVIEWER_OVERLOADED
    http_status: 422
    applies_to: "POST /manuscripts/{mid}/invitations/{id}/accept"

  - priority: 22
    category: business_constraint
    check: "On assign-associate (interval-overlap on Editor resource as strict-non-overlap): The candidate associate_editor must NOT already be the associate_editor of another manuscript whose current revision_round is in state UNDER_REVIEW with an open 'assignment-acceptance window' (the 5-day window starting when they were assigned). Two manuscripts whose associate-editor acceptance windows overlap on the same Editor are rejected."
    error_id: ERR_EDITOR_WINDOW_OVERLAP
    http_status: 422
    applies_to: "POST /manuscripts/{id}/assign-associate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Authors ----
  - method: POST
    path: "/authors"
    description: "Register an author"
    roles: [PlatformAdmin, Author]
    code: 201
    input: [full_name, email, "orcid_id?", institution, "recent_collaborator_ids?"]
    output: Author
    side_effects: []

  - method: GET
    path: "/authors/{id}"
    description: "Fetch one author"
    roles: [PlatformAdmin, Author, EditorInChief, SectionEditor, AssociateEditor]
    code: 200
    input: []
    output: Author
    side_effects: []

  - method: GET
    path: "/authors"
    description: "List authors (pagination)"
    roles: [PlatformAdmin, EditorInChief, SectionEditor, AssociateEditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Author[]
    side_effects: []

  # ---- Reviewers ----
  - method: POST
    path: "/reviewers"
    description: "Add a reviewer to the pool"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, institution, expertise_tags, "recent_collaborator_ids?"]
    output: Reviewer
    side_effects: []

  - method: GET
    path: "/reviewers/{id}"
    description: "Fetch one reviewer"
    roles: [PlatformAdmin, EditorInChief, SectionEditor, AssociateEditor, Reviewer]
    code: 200
    input: []
    output: Reviewer
    side_effects: []

  - method: GET
    path: "/reviewers"
    description: "List reviewers, filter by expertise tag or status"
    roles: [PlatformAdmin, EditorInChief, SectionEditor, AssociateEditor]
    code: 200
    input: ["limit?", "offset?", "expertise_tag?", "status?"]
    output: Reviewer[]
    side_effects: []

  # ---- Editors ----
  - method: POST
    path: "/editors"
    description: "Register an editor"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, institution, role, "topic_tags?", "recent_collaborator_ids?"]
    output: Editor
    side_effects: []

  - method: GET
    path: "/editors/{id}"
    description: "Fetch one editor"
    roles: [PlatformAdmin, EditorInChief, SectionEditor, AssociateEditor]
    code: 200
    input: []
    output: Editor
    side_effects: []

  - method: GET
    path: "/editors"
    description: "List editors filterable by role and topic_tag"
    roles: [PlatformAdmin, EditorInChief, SectionEditor]
    code: 200
    input: ["limit?", "offset?", "role?", "topic_tag?"]
    output: Editor[]
    side_effects: []

  # ---- Manuscripts ----
  - method: POST
    path: "/manuscripts"
    description: "Create a manuscript in DRAFT"
    roles: [Author]
    code: 201
    input: [title, corresponding_author_id, "co_author_ids?", topic_tag, review_mode, manuscript_file_uri, "supplementary_file_uris?", declaration_coi, declaration_funding, declaration_ethics, "suggested_reviewer_ids?", "excluded_reviewer_ids?"]
    output: Manuscript
    side_effects: ["validates lists (§1.4 priorities 18, 19)"]

  - method: GET
    path: "/manuscripts/{id}"
    description: "Fetch one manuscript"
    roles: [PlatformAdmin, Author, EditorInChief, SectionEditor, AssociateEditor]
    code: 200
    input: []
    output: Manuscript
    side_effects: []

  - method: GET
    path: "/manuscripts"
    description: "List manuscripts filterable by status, topic_tag, corresponding_author_id"
    roles: [PlatformAdmin, EditorInChief, SectionEditor, AssociateEditor]
    code: 200
    input: ["limit?", "offset?", "status?", "topic_tag?", "corresponding_author_id?"]
    output: Manuscript[]
    side_effects: []

  - method: POST
    path: "/manuscripts/{id}/submit"
    description: "Submit a DRAFT manuscript to enter the review pipeline"
    roles: [Author]
    code: 200
    input: ["version?"]
    output: Manuscript
    side_effects: ["create CoAuthorConfirmation rows OR transition straight to SUBMITTED; emit AuditLog"]

  - method: POST
    path: "/manuscripts/{id}/withdraw"
    description: "Author withdraws the manuscript before publication"
    roles: [Author]
    code: 200
    input: ["version?"]
    output: Manuscript
    side_effects: ["withdraw open invitations and supersede in-flight reviews (cascade per §1.2)"]

  - method: POST
    path: "/manuscripts/{id}/coauthor-confirmations/{cid}/confirm"
    description: "Co-author confirms participation"
    roles: [Author]
    code: 200
    input: []
    output: CoAuthorConfirmation
    side_effects: ["may transition Manuscript AWAITING_COAUTHOR -> SUBMITTED"]

  - method: POST
    path: "/manuscripts/{id}/coauthor-confirmations/{cid}/decline"
    description: "Co-author declines participation"
    roles: [Author]
    code: 200
    input: []
    output: CoAuthorConfirmation
    side_effects: ["transition Manuscript AWAITING_COAUTHOR -> WITHDRAWN (cascade auto-decline of remaining PENDING)"]

  - method: GET
    path: "/manuscripts/{id}/coauthor-confirmations"
    description: "List co-author confirmations"
    roles: [PlatformAdmin, Author, EditorInChief, SectionEditor, AssociateEditor]
    code: 200
    input: []
    output: CoAuthorConfirmation[]
    side_effects: []

  - method: POST
    path: "/manuscripts/{id}/assign-section-editor"
    description: "Editor-in-chief assigns a section editor"
    roles: [EditorInChief]
    code: 200
    input: [section_editor_id, "version?"]
    output: Manuscript
    side_effects: ["sets Manuscript.section_editor_id"]

  - method: POST
    path: "/manuscripts/{id}/desk-reject"
    description: "Section editor desk-rejects (transitions to DESK_REJECTED)"
    roles: [SectionEditor]
    code: 200
    input: ["reason?", "version?"]
    output: Manuscript
    side_effects: []

  - method: POST
    path: "/manuscripts/{id}/assign-associate"
    description: "Section editor assigns associate editor and starts review"
    roles: [SectionEditor]
    code: 200
    input: [associate_editor_id, "version?"]
    output: Manuscript
    side_effects: ["Manuscript SUBMITTED -> UNDER_REVIEW"]

  - method: POST
    path: "/manuscripts/{id}/invitations"
    description: "Associate editor invites a reviewer at current revision_round"
    roles: [AssociateEditor]
    code: 201
    input: [reviewer_id]
    output: ReviewerInvitation
    side_effects: ["compute coi_score and match_score; reject if coi_score >= COI_REJECT_THRESHOLD"]

  - method: GET
    path: "/manuscripts/{id}/invitations"
    description: "List invitations for a manuscript"
    roles: [PlatformAdmin, EditorInChief, SectionEditor, AssociateEditor]
    code: 200
    input: ["revision_round?", "status?"]
    output: ReviewerInvitation[]
    side_effects: []

  - method: POST
    path: "/manuscripts/{mid}/invitations/{id}/accept"
    description: "Reviewer accepts invitation"
    roles: [Reviewer]
    code: 200
    input: []
    output: ReviewerInvitation
    side_effects: ["create Review DRAFT with review_deadline_at = now + 21 days; bump Reviewer.active_assignments"]

  - method: POST
    path: "/manuscripts/{mid}/invitations/{id}/decline"
    description: "Reviewer declines invitation"
    roles: [Reviewer]
    code: 200
    input: []
    output: ReviewerInvitation
    side_effects: []

  - method: POST
    path: "/manuscripts/{mid}/invitations/{id}/withdraw"
    description: "Associate editor withdraws a pending invitation"
    roles: [AssociateEditor]
    code: 200
    input: []
    output: ReviewerInvitation
    side_effects: []

  - method: GET
    path: "/reviews/{id}"
    description: "Fetch one review"
    roles: [PlatformAdmin, EditorInChief, SectionEditor, AssociateEditor, Reviewer]
    code: 200
    input: []
    output: Review
    side_effects: []

  - method: PATCH
    path: "/reviews/{id}"
    description: "Reviewer updates DRAFT review fields"
    roles: [Reviewer]
    code: 200
    input: ["rating?", "recommendation?", "comments_to_author?", "comments_to_editor?", "version?"]
    output: Review
    side_effects: []

  - method: POST
    path: "/reviews/{id}/submit"
    description: "Reviewer submits the review"
    roles: [Reviewer]
    code: 200
    input: ["version?"]
    output: Review
    side_effects: ["decrement Reviewer.active_assignments"]

  - method: POST
    path: "/manuscripts/{id}/decisions"
    description: "Associate editor creates a DRAFT decision for the current revision_round"
    roles: [AssociateEditor]
    code: 201
    input: [recommendation_from_associate]
    output: EditorDecision
    side_effects: []

  - method: POST
    path: "/manuscripts/{mid}/decisions/{id}/recommend"
    description: "Associate editor moves decision DRAFT -> RECOMMENDED; runs aggregation calculations"
    roles: [AssociateEditor]
    code: 200
    input: ["version?"]
    output: EditorDecision
    side_effects: ["compute aggregate_score (C2/aggregate_score_from_ratings) and aggregated_category (C1)"]

  - method: POST
    path: "/manuscripts/{mid}/decisions/{id}/finalize"
    description: "Editor-in-chief finalizes the decision"
    roles: [EditorInChief]
    code: 200
    input: [final_decision, decision_letter_body, "version?"]
    output: EditorDecision
    side_effects: ["cascade Manuscript transition per final_decision; if revision -> set revision_deadline_at via revision_deadline calc"]

  - method: POST
    path: "/manuscripts/{id}/revisions"
    description: "Author submits a revised manuscript (response letter + revised file)"
    roles: [Author]
    code: 200
    input: [response_letter, revised_file_uri, "version?"]
    output: Manuscript
    side_effects: ["increment revision_round; supersede prior reviews; transition to REVISION_SUBMITTED"]

  - method: POST
    path: "/manuscripts/{id}/reinvite-reviewers"
    description: "Associate editor starts the next round by creating at least one new invitation; transitions REVISION_SUBMITTED -> UNDER_REVIEW"
    roles: [AssociateEditor]
    code: 200
    input: [reviewer_ids, "version?"]
    output: Manuscript
    side_effects: ["create one ReviewerInvitation per reviewer_id at new revision_round"]

  - method: POST
    path: "/manuscripts/{id}/publications"
    description: "PlatformAdmin starts production: create Publication COPY_EDITING"
    roles: [PlatformAdmin]
    code: 201
    input: [copy_edit_uri, proof_uri, issue_label, "indexing_targets?"]
    output: Publication
    side_effects: ["transition Manuscript ACCEPTED -> IN_PRODUCTION"]

  - method: POST
    path: "/publications/{id}/send-proof"
    description: "PlatformAdmin sends proof to author"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: Publication
    side_effects: []

  - method: POST
    path: "/publications/{id}/approve-proof"
    description: "Corresponding author approves the proof; DOI is minted"
    roles: [Author]
    code: 200
    input: ["version?"]
    output: Publication
    side_effects: ["DOI minted via /_events/doi-mint"]

  - method: POST
    path: "/publications/{id}/publish-issue"
    description: "PlatformAdmin issues publication and triggers indexing"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: Publication
    side_effects: ["cascade Manuscript IN_PRODUCTION -> PUBLISHED; initialize indexing_status entries to PENDING"]

  - method: POST
    path: "/manuscripts/{id}/retract"
    description: "Editor-in-chief retracts a published manuscript"
    roles: [EditorInChief]
    code: 200
    input: ["version?"]
    output: Manuscript
    side_effects: ["cascade Publication.status -> RETRACTED; set indexing_status entries to FAILED"]

  - method: GET
    path: "/audit-logs"
    description: "List audit log entries (filter by entity, entity_id, action)"
    roles: [PlatformAdmin, EditorInChief]
    code: 200
    input: ["limit?", "offset?", "entity?", "entity_id?", "action?"]
    output: AuditLog[]
    side_effects: []

  # ---- Event ingestion / clock (test-driving endpoints) ----
  - method: POST
    path: "/_clock/advance"
    description: "Advance server clock for tests (drives invitation/revision deadline transitions)"
    roles: [PlatformAdmin]
    code: 200
    input: [to]
    output: null
    side_effects: []

  - method: POST
    path: "/_sweep/run"
    description: "Run deadline sweep: expire overdue invitations; auto-withdraw overdue REVISION_REQUIRED manuscripts"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: null
    side_effects: ["ReviewerInvitation PENDING->EXPIRED; Manuscript REVISION_REQUIRED->WITHDRAWN when past deadline"]

  - method: POST
    path: "/_events/orcid-verified"
    description: "External ORCID system confirms an author's orcid_id is bound and verified"
    roles: [PlatformAdmin]
    code: 200
    input: [author_id, orcid_id]
    output: Author
    side_effects: ["set Author.orcid_verified=true if orcid_id matches"]

  - method: POST
    path: "/_events/plagiarism-result"
    description: "External plagiarism service reports a similarity percentage"
    roles: [PlatformAdmin]
    code: 200
    input: [manuscript_id, similarity_percent, report_uri]
    output: PlagiarismCheck
    side_effects: ["create PlagiarismCheck; compute result via plagiarism_pass_fail"]

  - method: POST
    path: "/_events/doi-mint"
    description: "External DOI registry reports the minted DOI for a Publication in ONLINE_FIRST"
    roles: [PlatformAdmin]
    code: 200
    input: [publication_id, doi]
    output: Publication
    side_effects: ["set Publication.doi"]

  - method: POST
    path: "/_events/indexing-ack"
    description: "External indexing database (PubMed/WoS/Scopus) acknowledges a publication"
    roles: [PlatformAdmin]
    code: 200
    input: [publication_id, target, status]
    output: Publication
    side_effects: ["set Publication.indexing_status[target] = status (ACK | FAILED)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing or unparseable X-User-Role or X-User-ID header"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted to invoke the requested endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or referenced foreign-key resource does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity not in a state from which the requested transition is permitted"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Request body version != stored entity version"
  - id: ERR_ORCID_NOT_VERIFIED
    http: 422
    condition: "Author has orcid_verified=false at manuscript submission"
  - id: ERR_DECLARATION_INCOMPLETE
    http: 422
    condition: "One or more required declarations or manuscript_file_uri missing at submission"
  - id: ERR_REVIEWER_CONFLICT
    http: 422
    condition: "Reviewer's coi_score >= COI_REJECT_THRESHOLD on invitation creation"
  - id: ERR_REVIEWER_EXCLUDED_BY_AUTHOR
    http: 422
    condition: "Reviewer id is in manuscript.excluded_reviewer_ids and that is the only COI signal"
  - id: ERR_EDITOR_TOPIC_MISMATCH
    http: 422
    condition: "Associate editor's topic_tags do not contain manuscript.topic_tag"
  - id: ERR_INVITATION_DEADLINE_PASSED
    http: 422
    condition: "Reviewer attempts to accept invitation after response_deadline_at"
  - id: ERR_REVISION_DEADLINE_PASSED
    http: 422
    condition: "Author attempts to submit revision after revision_deadline_at"
  - id: ERR_INSUFFICIENT_REVIEWS
    http: 422
    condition: "Fewer than two Review rows with status=SUBMITTED at current revision_round when recommending"
  - id: ERR_DESK_REJECT_REASON_REQUIRED
    http: 422
    condition: "Desk-reject called without plagiarism FAIL and without a reason string"
  - id: ERR_REVIEW_INCOMPLETE
    http: 422
    condition: "Review submit called while rating, recommendation, or comments fields are missing/out of range"
  - id: ERR_PUBLICATION_NOT_READY
    http: 422
    condition: "Publish-issue called without doi or issue_label"
  - id: ERR_COAUTHOR_LIST_INVALID
    http: 422
    condition: "co_author_ids contains corresponding_author_id or has duplicates"
  - id: ERR_REVIEWER_LISTS_OVERLAP
    http: 422
    condition: "suggested_reviewer_ids and excluded_reviewer_ids share at least one id"
  - id: ERR_REVIEW_ROUND_MISMATCH
    http: 409
    condition: "EditorDecision.revision_round != Manuscript.revision_round on finalize"
  - id: ERR_INVITATION_ALREADY_EXISTS
    http: 409
    condition: "Active ReviewerInvitation already exists for (manuscript_id, reviewer_id, revision_round)"
  - id: ERR_PUBLICATION_ALREADY_EXISTS
    http: 409
    condition: "Publication already exists for this manuscript_id"
  - id: ERR_VALIDATION
    http: 400
    condition: "Generic malformed-input error (missing required field, bad enum value)"
  - id: ERR_REVIEWER_OVERLOADED
    http: 422
    condition: "Accepting this invitation would push Reviewer.active_assignments above REVIEWER_MAX_CONCURRENT"
  - id: ERR_EDITOR_WINDOW_OVERLAP
    http: 422
    condition: "Associate editor already has an open assignment-acceptance window overlapping the requested assignment"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operations role: registers users, runs sweeps and clock, ingests external events, drives publication"
    identity: opaque
    exclusive_operations:
      - "POST /reviewers"
      - "POST /editors"
      - "POST /_clock/advance"
      - "POST /_sweep/run"
      - "POST /_events/orcid-verified"
      - "POST /_events/plagiarism-result"
      - "POST /_events/doi-mint"
      - "POST /_events/indexing-ack"
      - "POST /manuscripts/{id}/publications"
      - "POST /publications/{id}/send-proof"
      - "POST /publications/{id}/publish-issue"
    shared_operations:
      - "POST /authors (also Author)"
      - "GET /authors, /reviewers, /editors, /manuscripts, /audit-logs"

  - name: Author
    description: "Submits manuscripts, responds to revisions, confirms co-authorship, approves proofs"
    identity: "entity_backed:Author"
    exclusive_operations:
      - "POST /manuscripts"
      - "POST /manuscripts/{id}/submit"
      - "POST /manuscripts/{id}/withdraw"
      - "POST /manuscripts/{id}/coauthor-confirmations/{cid}/confirm"
      - "POST /manuscripts/{id}/coauthor-confirmations/{cid}/decline"
      - "POST /manuscripts/{id}/revisions"
      - "POST /publications/{id}/approve-proof"
    shared_operations:
      - "POST /authors (also PlatformAdmin)"
      - "GET /manuscripts/{id}, /manuscripts/{id}/coauthor-confirmations"

  - name: EditorInChief
    description: "Top editor; assigns section editors; finalizes decisions; retracts"
    identity: "entity_backed:Editor"
    exclusive_operations:
      - "POST /manuscripts/{id}/assign-section-editor"
      - "POST /manuscripts/{mid}/decisions/{id}/finalize"
      - "POST /manuscripts/{id}/retract"
    shared_operations:
      - "GET /authors, /reviewers, /editors, /manuscripts, /audit-logs"

  - name: SectionEditor
    description: "Topic-area gatekeeper; runs pre-screening, desk-rejection, associate-editor assignment"
    identity: "entity_backed:Editor"
    exclusive_operations:
      - "POST /manuscripts/{id}/desk-reject"
      - "POST /manuscripts/{id}/assign-associate"
    shared_operations:
      - "GET /authors, /reviewers, /editors, /manuscripts, /manuscripts/{id}/invitations"

  - name: AssociateEditor
    description: "Topic specialist who manages reviewer invitations and authors the recommended decision"
    identity: "entity_backed:Editor"
    exclusive_operations:
      - "POST /manuscripts/{id}/invitations"
      - "POST /manuscripts/{mid}/invitations/{id}/withdraw"
      - "POST /manuscripts/{id}/decisions"
      - "POST /manuscripts/{mid}/decisions/{id}/recommend"
      - "POST /manuscripts/{id}/reinvite-reviewers"
    shared_operations:
      - "GET /manuscripts/{id}, /manuscripts/{id}/invitations, /reviews/{id}"

  - name: Reviewer
    description: "Accepts/declines invitations, drafts and submits reviews"
    identity: "entity_backed:Reviewer"
    exclusive_operations:
      - "POST /manuscripts/{mid}/invitations/{id}/accept"
      - "POST /manuscripts/{mid}/invitations/{id}/decline"
      - "PATCH /reviews/{id}"
      - "POST /reviews/{id}/submit"
    shared_operations:
      - "GET /reviewers/{id}, /reviews/{id}"
