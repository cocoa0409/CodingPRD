              payload: { store_id: "${store_s5_id}", cases: 600, weight_lbs: 13000, requested_window_start: "2026-08-08T00:00:00Z", requested_window_end: "2026-08-08T08:00:00Z", temperature_mode: "DRY", priority: 3 }
              as: FleetPlanner
              captures: { ord_q_id: $.data.id }
            - call: "POST /fleet/trips"
              payload: { trip_code: "TRIP-Q", domicile_id: "${dom_slc_id}", planned_start_at: "2026-08-08T00:00:00Z" }
              as: FleetPlanner
              captures: { trip_q_id: $.data.id }
            - call: "POST /fleet/trips/${trip_q_id}/stops"
              payload: { sequence: 1, stop_type: "DELIVERY", store_id: "${store_s5_id}", replenishment_order_id: "${ord_q_id}", scheduled_arrival_at: "2026-08-08T04:00:00Z", scheduled_departure_at: "2026-08-08T05:15:00Z", drive_minutes_from_prev: 240, miles_from_prev: 240, segment_loaded: true, cases: 600 }
              as: FleetPlanner
            - call: "POST /fleet/trips/${trip_q_id}/stops"
              payload: { sequence: 2, stop_type: "DROP_OFF", scheduled_arrival_at: "2026-08-08T09:16:00Z", scheduled_departure_at: "2026-08-08T09:36:00Z", drive_minutes_from_prev: 241, miles_from_prev: 200, segment_loaded: true, cases: 0 }
              as: FleetPlanner
          trigger:
            - call: "POST /fleet/trips/${trip_p_id}/assignments"
              payload: { driver_id: "${drv_81_id}", tractor_id: "${trc_511_id}", trailer_id: "${trl_910_id}" }
              as: TransportManager
              captures: { p_drive: $.data.planned_drive_minutes, p_service: $.data.planned_service_minutes, p_break: $.data.planned_break_minutes, p_duty: $.data.planned_duty_minutes }
            - call: "POST /fleet/trips/${trip_q_id}/assignments"
              payload: { driver_id: "${drv_82_id}", tractor_id: "${trc_512_id}", trailer_id: "${trl_911_id}" }
              as: TransportManager
              captures: { q_drive: $.data.planned_drive_minutes, q_service: $.data.planned_service_minutes, q_break: $.data.planned_break_minutes, q_duty: $.data.planned_duty_minutes }
          assert:
            - "${p_stop1_service} == 75 and ${p_stop2_service} == 20"
            - "${p_drive} == 480, ${p_service} == 95, ${p_break} == 0 and ${p_duty} == 575 (HTTP 200; 480 is NOT > 480)"
            - "${q_drive} == 481, ${q_service} == 95, ${q_break} == 30 and ${q_duty} == 606 (HTTP 200)"
            - "${q_duty} - ${p_duty} == 31 - one extra drive minute costs 31 duty minutes because it drags the whole 30-minute break in"
            - "neither trip trips HOS: projected drive 480 and 481 are both <= 660, projected duty 575 and 606 are both <= 840"

      - name: margin_floor_admits_exactly_0_0800_and_refuses_0_0799
        grounds:
          - calculations.backhaul_contribution_margin
          - calculations.backhaul_contribution_margin.constants.MIN_MARGIN_PCT
          - validations[priority 16 fiscal]
          - errors.ERR_MARGIN_BELOW_FLOOR
          - endpoints[POST /fleet/backhaul-offers/{offer_id}/accept]
        distinguishing_aspect: |
          METRIC: margin_pct, a 4-decimal ratio, at the MIN_MARGIN_PCT floor
          of 0.0800.
          ENDPOINT: POST /fleet/backhaul-offers/{offer_id}/accept.
          Seven cents of revenue separate the two offers (47697 versus 47690);
          they share the same 42450-cent variable cost and the same 1431-cent
          commission, so contribution margin differs by exactly 7 cents and
          the rounded ratio lands on 0.0800 versus 0.0799. Unlike the
          break-minute instance, the boundary here decides HTTP 200 versus
          HTTP 422, and unlike the safety instance the metric is a rounded
          ratio, so the correct rounding mode (half-up at 4 decimals) is what
          makes 0.0800 admissible at all.
        test_recipe:
          setup:
            - "Store S-1006 is the delivery destination for both offers; no trip is ever created, so no trailer or temperature gate applies and the margin floor is the only obstacle."
            - "Both offers: 400 cases, 42 deadhead miles, 168 loaded miles, DRY. incremental_miles 210 -> line_haul 210*185 = 38850; handling 400*9 = 3600; reefer 0; variable_cost_cents 42450."
            - "OFFER-HI revenue 47697: gross 5247, tier_margin_pct 0.1100 (< 0.20 -> 3%), commission round_half_up(47697*0.03) = 1431, contribution 3816, margin_pct 3816/47697 = 0.0800 -> at the floor, accepted."
            - "OFFER-LO revenue 47690: gross 5240, tier_margin_pct 0.1099, commission round_half_up(47690*0.03) = 1431, contribution 3809, margin_pct 3809/47690 = 0.0799 -> below the floor, refused."
            - "The offers are created by user-planner-1 so that the margin-exception path can be exercised by a different operator, user-tm-9."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/stores"
              payload: { store_code: "S-1006", region_code: "SOUTH", dock_count: 2, cases_per_hour_unload_rate: 600, dock_open_minute: 0, dock_close_minute: 1439 }
              as: FleetPlanner
              captures: { store_s6_id: $.data.id }
            - call: "POST /fleet/backhaul-offers"
              payload: { origin_kind: "VENDOR_PICKUP", shipper_name: "Cascade Foods", origin_region_code: "SOUTH", dest_store_id: "${store_s6_id}", revenue_cents: 47697, cases: 400, weight_lbs: 9000, deadhead_miles: 42, loaded_miles: 168, temperature_mode: "DRY", pickup_window_start: "2026-08-05T10:00:00Z", pickup_window_end: "2026-08-05T16:00:00Z", offer_expires_at: "2026-08-04T00:00:00Z" }
              as: FleetPlanner
              as_user_id: "user-planner-1"
              captures: { offer_hi_id: $.data.id, offer_hi_status: $.data.status }
            - call: "POST /fleet/backhaul-offers"
              payload: { origin_kind: "VENDOR_PICKUP", shipper_name: "Cascade Foods", origin_region_code: "SOUTH", dest_store_id: "${store_s6_id}", revenue_cents: 47690, cases: 400, weight_lbs: 9000, deadhead_miles: 42, loaded_miles: 168, temperature_mode: "DRY", pickup_window_start: "2026-08-05T10:00:00Z", pickup_window_end: "2026-08-05T16:00:00Z", offer_expires_at: "2026-08-04T00:00:00Z" }
              as: FleetPlanner
              as_user_id: "user-planner-1"
              captures: { offer_lo_id: $.data.id }
            - call: "POST /fleet/backhaul-offers/${offer_hi_id}/submit-review"
              payload: {}
              as: FleetPlanner
              as_user_id: "user-planner-1"
              captures: { hi_vc: $.data.variable_cost_cents, hi_gross: $.data.gross_margin_cents, hi_tier: $.data.tier_margin_pct, hi_commission: $.data.commission_cents, hi_cm: $.data.contribution_margin_cents, hi_mp: $.data.margin_pct }
            - call: "POST /fleet/backhaul-offers/${offer_lo_id}/submit-review"
              payload: {}
              as: FleetPlanner
              as_user_id: "user-planner-1"
              captures: { lo_vc: $.data.variable_cost_cents, lo_gross: $.data.gross_margin_cents, lo_tier: $.data.tier_margin_pct, lo_commission: $.data.commission_cents, lo_cm: $.data.contribution_margin_cents, lo_mp: $.data.margin_pct }
          trigger:
            - call: "POST /fleet/backhaul-offers/${offer_hi_id}/accept"
              payload: {}
              as: TransportManager
              as_user_id: "user-tm-9"
              captures: { hi_final_status: $.data.status }
            - call: "POST /fleet/backhaul-offers/${offer_lo_id}/accept"
              payload: {}
              as: TransportManager
              as_user_id: "user-tm-9"
              captures: { lo_error: $.data.error_id }
            - call: "GET /fleet/backhaul-offers/${offer_lo_id}"
              payload: {}
              as: TransportManager
              captures: { lo_status_after: $.data.status, lo_exception_after: $.data.margin_exception_approved }
            - call: "POST /fleet/backhaul-offers/${offer_lo_id}/accept"
              payload: { margin_exception_approved: true }
              as: TransportManager
              as_user_id: "user-tm-9"
              captures: { lo_final_status: $.data.status, lo_exception_final: $.data.margin_exception_approved }
          assert:
            - "${offer_hi_status} == PROPOSED at creation"
            - "${hi_vc} == 42450, ${hi_gross} == 5247, ${hi_tier} == 0.1100, ${hi_commission} == 1431, ${hi_cm} == 3816, ${hi_mp} == 0.0800"
            - "${lo_vc} == 42450, ${lo_gross} == 5240, ${lo_tier} == 0.1099, ${lo_commission} == 1431, ${lo_cm} == 3809, ${lo_mp} == 0.0799"
            - "${hi_final_status} == ACCEPTED with HTTP 200 - 0.0800 is >= MIN_MARGIN_PCT, the floor is inclusive"
            - "${lo_error} == ERR_MARGIN_BELOW_FLOOR with HTTP 422 for a ratio one ten-thousandth lower"
            - "${lo_status_after} == UNDER_REVIEW and ${lo_exception_after} == false - the refused accept left the offer untouched"
            - "${lo_final_status} == ACCEPTED and ${lo_exception_final} == true - user-tm-9 differs from created_by_user_id user-planner-1, so the exception is admissible and only the floor was blocking"

      - name: safety_score_of_exactly_80_may_bid_while_79_is_refused
        grounds:
          - calculations.driver_safety_score
          - validations[priority 11 eligibility]
          - errors.ERR_DRIVER_SAFETY_INELIGIBLE
          - endpoints[POST /fleet/route-bids]
        distinguishing_aspect: |
          METRIC: Driver.safety_score at MIN_BID_SAFETY_SCORE = 80.
          ENDPOINT: POST /fleet/route-bids.
          Twenty open penalty points leave a score of exactly 80 and the bid
          is accepted; twenty-one leave 79 and the same posting refuses the
          bid. Both drivers are far above the separate COACHING_HOLD_THRESHOLD
          of 70, so coaching_hold is false on both sides and the bid floor is
          isolated from the hold gate. Distinct from the other two instances:
          the metric is an integer score assembled from event points rather
          than a minute total or a rounded ratio, and the boundary is checked
          on a bidding endpoint, not on assignment or acceptance.
        test_recipe:
          setup:
            - "Domicile DOM-DEN, one pay plan, and drivers D-91 and D-92 both domiciled at DOM-DEN so the domicile clause of the eligibility rule is satisfied for both."
            - "Posting RT-900 is OPEN with bid_close_at 2026-08-20T00:00:00Z, comfortably ahead of the 2026-08-01 clock, and was created by user-tm-1."
            - "D-91 accrues SEATBELT severity 3 (4*3 = 12), FOLLOWING_DISTANCE severity 2 (2*2 = 4) and HARD_BRAKE severity 2 (2*2 = 4): 20 open points, score 100 - 20 = 80, coaching_hold false because 80 >= 70."
            - "D-92 accrues SEATBELT severity 3 (12) and SPEEDING severity 3 (3*3 = 9): 21 open points, score 79, coaching_hold still false."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-DEN", region_code: "MOUNTAIN", tractor_capacity: 28, driver_headcount_target: 14, fixed_ownership_cents_per_day: 10500, overhead_cents_per_day: 3200, dedicated_rate_cents_per_mile: 278, dedicated_rate_cents_per_case: 202 }
              as: FleetPlanner
              captures: { dom_den_id: $.data.id }
            - call: "POST /fleet/driver-pay-plans"
              payload: { plan_code: "MILE-A", mileage_cents_per_mile: 78, stop_cents_per_stop: 2200, drop_hook_cents: 1500, hourly_cents_per_minute: 42, minimum_daily_cents: 24000, backhaul_bonus_pct: 0.05 }
              as: PayrollAnalyst
              captures: { plan_a_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-91", domicile_id: "${dom_den_id}", pay_plan_id: "${plan_a_id}", seniority_date: "2017-04-01" }
              as: TransportManager
              captures: { drv_91_id: $.data.id, drv_91_score0: $.data.safety_score }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-92", domicile_id: "${dom_den_id}", pay_plan_id: "${plan_a_id}", seniority_date: "2016-04-01" }
              as: TransportManager
              captures: { drv_92_id: $.data.id }
            - call: "POST /fleet/telematics-events"
              payload: { driver_id: "${drv_91_id}", event_type: "SEATBELT", severity: 3, occurred_at: "2026-07-20T12:00:00Z" }
              as: SafetyManager
              captures: { ev_91_a_points: $.data.penalty_points }
            - call: "POST /fleet/telematics-events"
              payload: { driver_id: "${drv_91_id}", event_type: "FOLLOWING_DISTANCE", severity: 2, occurred_at: "2026-07-21T12:00:00Z" }
              as: SafetyManager
              captures: { ev_91_b_points: $.data.penalty_points }
            - call: "POST /fleet/telematics-events"
              payload: { driver_id: "${drv_91_id}", event_type: "HARD_BRAKE", severity: 2, occurred_at: "2026-07-22T12:00:00Z" }
              as: SafetyManager
              captures: { ev_91_c_points: $.data.penalty_points }
            - call: "POST /fleet/telematics-events"
              payload: { driver_id: "${drv_92_id}", event_type: "SEATBELT", severity: 3, occurred_at: "2026-07-20T12:00:00Z" }
              as: SafetyManager
            - call: "POST /fleet/telematics-events"
              payload: { driver_id: "${drv_92_id}", event_type: "SPEEDING", severity: 3, occurred_at: "2026-07-21T12:00:00Z" }
              as: SafetyManager
              captures: { ev_92_b_points: $.data.penalty_points }
            - call: "GET /fleet/drivers/${drv_91_id}"
              payload: {}
              as: SafetyManager
              captures: { d91_open: $.data.open_penalty_points, d91_score: $.data.safety_score, d91_hold: $.data.coaching_hold }
            - call: "GET /fleet/drivers/${drv_92_id}"
              payload: {}
              as: SafetyManager
              captures: { d92_open: $.data.open_penalty_points, d92_score: $.data.safety_score, d92_hold: $.data.coaching_hold }
            - call: "POST /fleet/route-postings"
              payload: { route_code: "RT-900", domicile_id: "${dom_den_id}", weekly_miles: 2400, weekly_stops: 40, start_effective_date: "2026-09-01", bid_close_at: "2026-08-20T00:00:00Z" }
              as: TransportManager
              as_user_id: "user-tm-1"
              captures: { posting_id: $.data.id, posting_v0: $.data.version, posting_bids0: $.data.bid_count }
          trigger:
            - call: "POST /fleet/route-bids"
              payload: { route_posting_id: "${posting_id}", expected_posting_version: "${posting_v0}" }
              as: Driver
              as_user_id: "${drv_91_id}"
              captures: { bid_91_id: $.data.id, bid_91_status: $.data.status, bid_91_score_snap: $.data.safety_score_snapshot }
            - call: "GET /fleet/route-postings/${posting_id}"
              payload: {}
              as: TransportManager
              captures: { posting_v1: $.data.version, posting_bids1: $.data.bid_count }
            - call: "POST /fleet/route-bids"
              payload: { route_posting_id: "${posting_id}", expected_posting_version: "${posting_v1}" }
              as: Driver
              as_user_id: "${drv_92_id}"
              captures: { bid_92_error: $.data.error_id }
            - call: "GET /fleet/route-postings/${posting_id}"
              payload: {}
              as: TransportManager
              captures: { posting_v2: $.data.version, posting_bids2: $.data.bid_count }
          assert:
            - "${drv_91_score0} == 100 and ${posting_bids0} == 0 at creation"
            - "${ev_91_a_points} == 12, ${ev_91_b_points} == 4, ${ev_91_c_points} == 4 and ${ev_92_b_points} == 9"
            - "${d91_open} == 20, ${d91_score} == 80, ${d91_hold} == false"
            - "${d92_open} == 21, ${d92_score} == 79, ${d92_hold} == false"
            - "${bid_91_status} == SUBMITTED with HTTP 201 and ${bid_91_score_snap} == 80 - the floor is inclusive"
            - "${bid_92_error} == ERR_DRIVER_SAFETY_INELIGIBLE with HTTP 422 for a score one point lower, while coaching_hold is false on both drivers"
            - "${posting_bids1} == 1 and ${posting_bids2} == 1, ${posting_v2} == ${posting_v1} - the refused bid neither incremented bid_count nor bumped the posting version"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: order_creation_depends_on_the_store_status_dimension
        grounds:
          - state_machines.Store
          - validations[priority 10 cross_entity_state]
          - errors.ERR_STORE_SUSPENDED
          - endpoints[POST /fleet/replenishment-orders]
          - endpoints[POST /fleet/stores/{store_id}/status]
        distinguishing_aspect: |
          ENTITY PAIR: ReplenishmentOrder (created) depends on Store (state
          owner). The dependency is on a status dimension the order does not
          own and cannot see: an identical order body is accepted, then
          refused, then accepted again, with only POST
          /fleet/stores/{store_id}/status running in between. This pair is the
          only one of the three whose gate is reversible in both directions
          within a single recipe, and the only one where the dependent row does
          not yet exist at the moment the gate is evaluated.
        test_recipe:
          setup:
            - "Store S-1007 is created and defaults to status ACTIVE."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/stores"
              payload: { store_code: "S-1007", region_code: "EAST", dock_count: 2, cases_per_hour_unload_rate: 600, dock_open_minute: 240, dock_close_minute: 1320 }
              as: FleetPlanner
              captures: { store_s7_id: $.data.id, store_s7_status0: $.data.status }
            - call: "POST /fleet/replenishment-orders"
              payload: { store_id: "${store_s7_id}", cases: 300, weight_lbs: 6500, requested_window_start: "2026-08-06T08:00:00Z", requested_window_end: "2026-08-06T14:00:00Z", temperature_mode: "DRY", priority: 3 }
              as: FleetPlanner
              captures: { ord_pre_id: $.data.id, ord_pre_status: $.data.status }
          trigger:
            - call: "POST /fleet/stores/${store_s7_id}/status"
              payload: { status: "SUSPENDED" }
              as: TransportManager
              captures: { store_suspended: $.data.status }
            - call: "POST /fleet/replenishment-orders"
              payload: { store_id: "${store_s7_id}", cases: 300, weight_lbs: 6500, requested_window_start: "2026-08-06T08:00:00Z", requested_window_end: "2026-08-06T14:00:00Z", temperature_mode: "DRY", priority: 3 }
              as: FleetPlanner
              captures: { blocked_error: $.data.error_id }
            - call: "POST /fleet/stores/${store_s7_id}/status"
              payload: { status: "ACTIVE" }
              as: TransportManager
              captures: { store_reinstated: $.data.status }
            - call: "POST /fleet/replenishment-orders"
              payload: { store_id: "${store_s7_id}", cases: 300, weight_lbs: 6500, requested_window_start: "2026-08-06T08:00:00Z", requested_window_end: "2026-08-06T14:00:00Z", temperature_mode: "DRY", priority: 3 }
              as: FleetPlanner
              captures: { ord_post_id: $.data.id, ord_post_status: $.data.status }
            - call: "GET /fleet/stores/${store_s7_id}"
              payload: {}
              as: FleetPlanner
              captures: { store_open_cases: $.data.open_scheduled_cases }
          assert:
            - "${store_s7_status0} == ACTIVE and ${ord_pre_status} == UNSCHEDULED - the pre-suspension order proves the body itself is valid"
            - "${store_suspended} == SUSPENDED"
            - "${blocked_error} == ERR_STORE_SUSPENDED with HTTP 409 for the byte-identical order body"
            - "${store_reinstated} == ACTIVE"
            - "${ord_post_id} is a new id and ${ord_post_status} == UNSCHEDULED - the gate is fully reversible"
            - "${store_open_cases} == 0 throughout: an UNSCHEDULED order is not yet inside the store's case ledger, so the refused create left no trace"
            - "the order created before the suspension keeps status UNSCHEDULED - suspending a store does NOT cascade to existing orders"

      - name: bid_admission_depends_on_the_posting_status_after_its_own_occ_gate
        grounds:
          - state_machines.RoutePosting
          - validations[priority 9 concurrency]
          - validations[priority 10 cross_entity_state]
          - errors.ERR_POSTING_NOT_OPEN
          - errors.ERR_STALE_POSTING_VERSION
          - endpoints[POST /fleet/route-bids]
          - endpoints[POST /fleet/route-postings/{posting_id}/cancel]
        distinguishing_aspect: |
          ENTITY PAIR: RouteBid (created) depends on RoutePosting (state
          owner) - a different pair from ReplenishmentOrder/Store and from
          Trip/BackhaulOffer. What makes this dependency non-obvious is that
          the OCC gate on the very same parent row runs FIRST: cancelling the
          posting both closes the board and bumps its version, so a bid
          carrying the pre-cancel version reports ERR_STALE_POSTING_VERSION
          (412) and the cross-entity state objection is never reached. Only a
          bid carrying the CURRENT version of the cancelled posting exposes
          ERR_POSTING_NOT_OPEN (409).
        test_recipe:
          setup:
            - "Domicile DOM-ATL with driver D-95 (safety_score 100, coaching_hold false, ACTIVE)."
            - "Two postings: RT-910 will be cancelled, RT-911 stays OPEN as the control. Both close 2026-08-20T00:00:00Z, well after the 2026-08-01 clock."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-ATL", region_code: "SOUTH", tractor_capacity: 26, driver_headcount_target: 13, fixed_ownership_cents_per_day: 9800, overhead_cents_per_day: 3100, dedicated_rate_cents_per_mile: 272, dedicated_rate_cents_per_case: 198 }
              as: FleetPlanner
              captures: { dom_atl_id: $.data.id }
            - call: "POST /fleet/driver-pay-plans"
              payload: { plan_code: "MILE-A", mileage_cents_per_mile: 78, stop_cents_per_stop: 2200, drop_hook_cents: 1500, hourly_cents_per_minute: 42, minimum_daily_cents: 24000, backhaul_bonus_pct: 0.05 }
              as: PayrollAnalyst
              captures: { plan_a_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-95", domicile_id: "${dom_atl_id}", pay_plan_id: "${plan_a_id}", seniority_date: "2015-02-09" }
              as: TransportManager
              captures: { drv_95_id: $.data.id, drv_95_score: $.data.safety_score, drv_95_status: $.data.status }
            - call: "POST /fleet/route-postings"
              payload: { route_code: "RT-910", domicile_id: "${dom_atl_id}", weekly_miles: 2100, weekly_stops: 35, start_effective_date: "2026-09-01", bid_close_at: "2026-08-20T00:00:00Z" }
              as: TransportManager
              as_user_id: "user-tm-1"
              captures: { posting_x_id: $.data.id, posting_x_v0: $.data.version, posting_x_status0: $.data.status }
            - call: "POST /fleet/route-postings"
              payload: { route_code: "RT-911", domicile_id: "${dom_atl_id}", weekly_miles: 2100, weekly_stops: 35, start_effective_date: "2026-09-01", bid_close_at: "2026-08-20T00:00:00Z" }
              as: TransportManager
              as_user_id: "user-tm-1"
              captures: { posting_y_id: $.data.id, posting_y_v0: $.data.version }
            - call: "POST /fleet/route-postings/${posting_x_id}/cancel"
              payload: { reason_code: "ROUTE_RETIRED" }
              as: TransportManager
              as_user_id: "user-tm-1"
              captures: { posting_x_status1: $.data.status, posting_x_v1: $.data.version, posting_x_bids1: $.data.bid_count }
          trigger:
            - call: "POST /fleet/route-bids"
              payload: { route_posting_id: "${posting_x_id}", expected_posting_version: "${posting_x_v0}" }
              as: Driver
              as_user_id: "${drv_95_id}"
              captures: { stale_error: $.data.error_id }
            - call: "POST /fleet/route-bids"
              payload: { route_posting_id: "${posting_x_id}", expected_posting_version: "${posting_x_v1}" }
              as: Driver
              as_user_id: "${drv_95_id}"
              captures: { closed_error: $.data.error_id }
            - call: "POST /fleet/route-bids"
              payload: { route_posting_id: "${posting_y_id}", expected_posting_version: "${posting_y_v0}" }
              as: Driver
              as_user_id: "${drv_95_id}"
              captures: { ok_bid_id: $.data.id, ok_bid_status: $.data.status }
          assert:
            - "${posting_x_status0} == OPEN and ${drv_95_score} == 100 with ${drv_95_status} == ACTIVE - the driver is never the obstacle"
            - "${posting_x_status1} == CANCELLED, ${posting_x_bids1} == 0 and ${posting_x_v1} > ${posting_x_v0}"
            - "${stale_error} == ERR_STALE_POSTING_VERSION with HTTP 412 - priority 9 pre-empts the priority-10 objection even though the posting is also closed"
            - "${closed_error} == ERR_POSTING_NOT_OPEN with HTTP 409 - same driver, same posting, current version"
            - "${ok_bid_status} == SUBMITTED with HTTP 201 against the OPEN posting, proving the refusals came from the posting's state and not from the bidder"
            - "GET /fleet/route-postings/${posting_x_id} still reports bid_count == 0 and version == ${posting_x_v1}"

      - name: trip_backhaul_credit_tracks_the_offer_state_without_touching_the_trip
        grounds:
          - state_machines.BackhaulOffer
          - validations[priority 10 cross_entity_state]
          - errors.ERR_OFFER_NOT_ACCEPTED
          - endpoints[POST /fleet/trips/{trip_id}/backhaul-assignments]
          - endpoints[POST /fleet/backhaul-offers/{offer_id}/accept]
          - calculations.backhaul_contribution_margin
        distinguishing_aspect: |
          ENTITY PAIR: Trip (dependent) versus BackhaulOffer (state owner) -
          the third distinct pair. Two things are demonstrated that neither
          other instance shows. First, the admissibility set is not a single
          state: PROPOSED and UNDER_REVIEW offers may be pre-linked, while
          REJECTED, WITHDRAWN and EXPIRED can never be, so a REJECTED offer
          yields ERR_OFFER_NOT_ACCEPTED. Second, the dependent field keeps
          tracking the owner AFTER the link: accepting the offer rewrites
          Trip.backhaul_credit_cents from 0 to 8310 although no request is ever
          addressed to the trip.
        test_recipe:
          setup:
            - "Store S-1008 is the destination for both offers; trip TRIP-R is DRAFT with no stops, which is a legal state for linking."
            - "Both offers carry 400 cases, 42 deadhead miles, 168 loaded miles and DRY temperature: variable_cost_cents 210*185 + 400*9 = 42450."
            - "OFFER-OK revenue 54000: gross 11550, tier_margin_pct 0.2139 (>= 0.20 -> 6%), commission 3240, contribution_margin_cents 8310, margin_pct 0.1539 - above the 0.08 floor, so it accepts cleanly."
            - "OFFER-BAD is submitted for review and then rejected, landing in REJECTED, which is permanently unlinkable."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/stores"
              payload: { store_code: "S-1008", region_code: "MIDWEST", dock_count: 2, cases_per_hour_unload_rate: 600, dock_open_minute: 0, dock_close_minute: 1439 }
              as: FleetPlanner
              captures: { store_s8_id: $.data.id }
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-STL", region_code: "MIDWEST", tractor_capacity: 22, driver_headcount_target: 11, fixed_ownership_cents_per_day: 9500, overhead_cents_per_day: 3000, dedicated_rate_cents_per_mile: 270, dedicated_rate_cents_per_case: 195 }
              as: FleetPlanner
              captures: { dom_stl_id: $.data.id }
            - call: "POST /fleet/trips"
              payload: { trip_code: "TRIP-R", domicile_id: "${dom_stl_id}", planned_start_at: "2026-08-09T06:00:00Z" }
              as: FleetPlanner
              captures: { trip_r_id: $.data.id, trip_r_v0: $.data.version, trip_r_credit0: $.data.backhaul_credit_cents, trip_r_offer0: $.data.backhaul_offer_id }
            - call: "POST /fleet/backhaul-offers"
              payload: { origin_kind: "THIRD_PARTY", shipper_name: "Prairie Freight", origin_region_code: "MIDWEST", dest_store_id: "${store_s8_id}", revenue_cents: 54000, cases: 400, weight_lbs: 9000, deadhead_miles: 42, loaded_miles: 168, temperature_mode: "DRY", pickup_window_start: "2026-08-09T10:00:00Z", pickup_window_end: "2026-08-09T16:00:00Z", offer_expires_at: "2026-08-08T00:00:00Z" }
              as: FleetPlanner
              as_user_id: "user-planner-2"
              captures: { offer_ok_id: $.data.id, offer_ok_status0: $.data.status }
            - call: "POST /fleet/backhaul-offers"
              payload: { origin_kind: "THIRD_PARTY", shipper_name: "Prairie Freight", origin_region_code: "MIDWEST", dest_store_id: "${store_s8_id}", revenue_cents: 54000, cases: 400, weight_lbs: 9000, deadhead_miles: 42, loaded_miles: 168, temperature_mode: "DRY", pickup_window_start: "2026-08-09T10:00:00Z", pickup_window_end: "2026-08-09T16:00:00Z", offer_expires_at: "2026-08-08T00:00:00Z" }
              as: FleetPlanner
              as_user_id: "user-planner-2"
              captures: { offer_bad_id: $.data.id }
            - call: "POST /fleet/backhaul-offers/${offer_bad_id}/submit-review"
              payload: {}
              as: FleetPlanner
              as_user_id: "user-planner-2"
            - call: "POST /fleet/backhaul-offers/${offer_bad_id}/reject"
              payload: { reason_code: "LANE_NOT_NEEDED" }
              as: TransportManager
              captures: { offer_bad_status: $.data.status }
          trigger:
            - call: "POST /fleet/trips/${trip_r_id}/backhaul-assignments"
              payload: { backhaul_offer_id: "${offer_bad_id}", expected_trip_version: "${trip_r_v0}" }
              as: TransportManager
              captures: { reject_link_error: $.data.error_id }
            - call: "POST /fleet/trips/${trip_r_id}/backhaul-assignments"
              payload: { backhaul_offer_id: "${offer_ok_id}", expected_trip_version: "${trip_r_v0}" }
              as: TransportManager
              captures: { linked_offer: $.data.backhaul_offer_id, linked_credit: $.data.backhaul_credit_cents, trip_r_v1: $.data.version }
            - call: "POST /fleet/backhaul-offers/${offer_ok_id}/submit-review"
              payload: {}
              as: FleetPlanner
