# =============================================================================
# Task 1209: Fair Lending Analysis & Redlining Monitoring — §1.9 Corner Design
# Breadth index: every testable claim of §1.1–§1.7 not already covered by §1.8.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: market_created_with_required_fields_and_defaults
        claim_type: creation
        grounds:
          - "entities.Market"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /fair-lending/markets with all four required inputs -> 201; response echoes inputs and carries server-minted id, created_at, updated_at, version == 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id, mv: $.data.version } }
          assert:
            - "201; Market.${m1}.name == 'Metro One', msa_code == 'M001', protected_group_population_share == 0.40, peer_group_code == 'PG7'"
            - "system fields present: id non-null, created_at/updated_at ISO8601 with 3 fractional digits, version == 1"

      - name: market_missing_required_field_returns_invalid_request
        claim_type: required_field_validation
        grounds:
          - "entities.Market.fields.msa_code"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required input msa_code -> 400 ERR_INVALID_REQUEST; no Market row is persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"

      - name: application_invalid_enum_returns_invalid_request
        claim_type: type_constraint
        grounds:
          - "entities.Application.fields.outcome"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "outcome 'PENDING_REVIEW' is outside the declared enum {ORIGINATED, DENIED, WITHDRAWN, APPROVED_NOT_ACCEPTED} -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["market, branch, officer exist"]
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
            - { call: "POST /fair-lending/branches", payload: { market_id: "${m1}", name: "Main", tract_minority_pct: 55.0, opened_on: "2020-01-15" }, as: BankAdmin, captures: { b1: $.data.id } }
            - { call: "POST /fair-lending/loan-officers", payload: { branch_id: "${b1}", full_name: "Officer One" }, as: BankAdmin, captures: { o1: $.data.id } }
          trigger:
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: PENDING_REVIEW, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 720, dti_pct: 36.0, application_date: "2026-01-05", decision_date: "2026-01-20" }, as: LendingDataOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"

      - name: application_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=4]"
        distinguishing_aspect: "GET on a well-formed UUID that does not exist -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /fair-lending/applications/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: LendingDataOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"

      - name: list_pagination_defaults_and_envelope
        claim_type: listing
        grounds:
          - "response_envelope"
        distinguishing_aspect: "GET /fair-lending/applications with 12 rows stored and no params returns exactly 10 rows (default limit), offset 0, total_count 12, has_more true; success envelope carries meta.api_request_id and response_type == 'array'."
        test_recipe:
          setup: ["market, branch, officer, and 12 applications exist"]
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
            - { call: "POST /fair-lending/branches", payload: { market_id: "${m1}", name: "Main", tract_minority_pct: 55.0, opened_on: "2020-01-15" }, as: BankAdmin, captures: { b1: $.data.id } }
            - { call: "POST /fair-lending/loan-officers", payload: { branch_id: "${b1}", full_name: "Officer One" }, as: BankAdmin, captures: { o1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 720, dti_pct: 36.0, application_date: "2026-01-01", decision_date: "2026-01-10" }, as: LendingDataOps }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 721, dti_pct: 36.0, application_date: "2026-01-02", decision_date: "2026-01-11" }, as: LendingDataOps }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 722, dti_pct: 36.0, application_date: "2026-01-03", decision_date: "2026-01-12" }, as: LendingDataOps }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 723, dti_pct: 36.0, application_date: "2026-01-04", decision_date: "2026-01-13" }, as: LendingDataOps }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 724, dti_pct: 36.0, application_date: "2026-01-05", decision_date: "2026-01-14" }, as: LendingDataOps }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 725, dti_pct: 36.0, application_date: "2026-01-06", decision_date: "2026-01-15" }, as: LendingDataOps }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 726, dti_pct: 36.0, application_date: "2026-01-07", decision_date: "2026-01-16" }, as: LendingDataOps }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 727, dti_pct: 36.0, application_date: "2026-01-08", decision_date: "2026-01-17" }, as: LendingDataOps }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 728, dti_pct: 36.0, application_date: "2026-01-09", decision_date: "2026-01-18" }, as: LendingDataOps }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 729, dti_pct: 36.0, application_date: "2026-01-10", decision_date: "2026-01-19" }, as: LendingDataOps }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 730, dti_pct: 36.0, application_date: "2026-01-11", decision_date: "2026-01-20" }, as: LendingDataOps }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 731, dti_pct: 36.0, application_date: "2026-01-12", decision_date: "2026-01-21" }, as: LendingDataOps }
          trigger:
            - { call: "GET /fair-lending/applications", payload: {}, as: LendingDataOps }
          assert:
            - "response data array length == 10 (default limit); pagination fields: total_count == 12, has_more == true, offset == 0, limit == 10"
            - "envelope: meta.api_request_id non-null, response_type == 'array'"
            - "GET /fair-lending/applications with limit 5 offset 10 returns exactly 2 rows and has_more == false"

      - name: computed_field_input_ignored
        claim_type: computed_fields
        grounds:
          - "entities.Application.fields.status"
          - "entities.Application.fields.has_exception"
        distinguishing_aspect: "Client-supplied status/has_exception on create are ignored: the row is persisted with the system defaults RECEIVED / NONE regardless of smuggled values."
        test_recipe:
          setup: ["market, branch, officer exist"]
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
            - { call: "POST /fair-lending/branches", payload: { market_id: "${m1}", name: "Main", tract_minority_pct: 55.0, opened_on: "2020-01-15" }, as: BankAdmin, captures: { b1: $.data.id } }
            - { call: "POST /fair-lending/loan-officers", payload: { branch_id: "${b1}", full_name: "Officer One" }, as: BankAdmin, captures: { o1: $.data.id } }
          trigger:
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 720, dti_pct: 36.0, application_date: "2026-01-05", decision_date: "2026-01-20", status: VALIDATED, has_exception: APPROVED }, as: LendingDataOps, captures: { a1: $.data.id, a_status: $.data.status, a_exc: $.data.has_exception } }
          assert:
            - "201; Application.${a1}.status == RECEIVED and has_exception == NONE (client-supplied computed/system fields ignored)"

      - name: branch_create_with_unknown_market_returns_not_found
        claim_type: parent_relationship
        grounds:
          - "entities.Branch.fields.market_id"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Body FK integrity: POST /fair-lending/branches with a non-existent market_id -> 404 ERR_NOT_FOUND (existence priority 4)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fair-lending/branches", payload: { market_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", name: "Main", tract_minority_pct: 55.0, opened_on: "2020-01-15" }, as: BankAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"

      - name: finding_supersession_self_reference
        claim_type: cross_entity_reference
        grounds:
          - "entities.DisparityFinding.fields.superseded_by_finding_id"
          - "state_machines.DisparityFinding.UNDER_REVIEW_to_SUPERSEDED"
        distinguishing_aspect: "Self-referential FK: creating manual finding F2 with supersedes_finding_id F1 moves F1 -> SUPERSEDED (terminal), sets F1.superseded_by_finding_id == F2, and GET /fair-lending/findings?superseded_by_finding_id=F2 returns exactly [F1]."
        test_recipe:
          setup:
            - "Run R COMPUTED over 1 VALIDATED ORIGINATED CONTROL app; manual finding F1 kind=MANUAL in UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
            - { call: "POST /fair-lending/branches", payload: { market_id: "${m1}", name: "Main", tract_minority_pct: 55.0, opened_on: "2020-01-15" }, as: BankAdmin, captures: { b1: $.data.id } }
            - { call: "POST /fair-lending/loan-officers", payload: { branch_id: "${b1}", full_name: "Officer One" }, as: BankAdmin, captures: { o1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 720, dti_pct: 36.0, application_date: "2026-01-05", decision_date: "2026-01-20" }, as: LendingDataOps, captures: { c1: $.data.id } }
            - { call: "POST /fair-lending/applications/${c1}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/analysis-runs", payload: { market_id: "${m1}", product_type: CONVENTIONAL, prohibited_basis: RACE, period_start: "2026-01-01", period_end: "2026-04-01" }, as: FairLendingAnalyst, captures: { r1: $.data.id } }
            - { call: "POST /fair-lending/analysis-runs/${r1}/lock", payload: {}, as: FairLendingAnalyst }
            - { call: "POST /fair-lending/analysis-runs/${r1}/compute", payload: {}, as: FairLendingAnalyst }
            - { call: "POST /fair-lending/findings", payload: { analysis_run_id: "${r1}", kind: MANUAL, notes: "first pass" }, as: FairLendingAnalyst, as_user_id: "analyst-creator", captures: { f1: $.data.id } }
            - { call: "POST /fair-lending/findings/${f1}/begin-review", payload: {}, as: FairLendingAnalyst }
          trigger:
            - { call: "POST /fair-lending/findings", payload: { analysis_run_id: "${r1}", kind: MANUAL, notes: "second pass supersedes", supersedes_finding_id: "${f1}" }, as: FairLendingAnalyst, as_user_id: "analyst-creator", captures: { f2: $.data.id } }
            - { call: "GET /fair-lending/findings/${f1}", payload: {}, as: FairLendingAnalyst, captures: { f1_status: $.data.status, f1_sup: $.data.superseded_by_finding_id } }
            - { call: "GET /fair-lending/findings", payload: { superseded_by_finding_id: "${f2}" }, as: FairLendingAnalyst, captures: { hit: "$.data[0].id" } }
          assert:
            - "F1.status == SUPERSEDED and F1.superseded_by_finding_id == ${f2}"
            - "filtered list GET /fair-lending/findings?superseded_by_finding_id=${f2} returns exactly [${f1}] (total_count == 1)"
            - "run.open_finding_count unchanged at 1 (F1 left non-terminal count as F2 entered FLAGGED)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: validate_excluded_application_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Application"
          - "errors[ERR_ALREADY_TERMINAL]"
        distinguishing_aspect: "From terminal EXCLUDED, POST validate must fail with ERR_ALREADY_TERMINAL (not generic ERR_INVALID_STATE); no side effects fire."
        test_recipe:
          setup: ["application a1 exists and is EXCLUDED"]
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
            - { call: "POST /fair-lending/branches", payload: { market_id: "${m1}", name: "Main", tract_minority_pct: 55.0, opened_on: "2020-01-15" }, as: BankAdmin, captures: { b1: $.data.id } }
            - { call: "POST /fair-lending/loan-officers", payload: { branch_id: "${b1}", full_name: "Officer One" }, as: BankAdmin, captures: { o1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 720, dti_pct: 36.0, application_date: "2026-01-05", decision_date: "2026-01-20" }, as: LendingDataOps, captures: { a1: $.data.id } }
            - { call: "POST /fair-lending/applications/${a1}/exclude", payload: {}, as: LendingDataOps }
          trigger:
            - { call: "POST /fair-lending/applications/${a1}/validate", payload: {}, as: LendingDataOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL (http 409); Application.${a1}.status remains EXCLUDED"

      - name: unlock_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.AnalysisRun.DATA_LOCKED_to_DRAFT"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "unlock is defined only from DATA_LOCKED; calling it on a DRAFT run -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["run R exists in DRAFT"]
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
            - { call: "POST /fair-lending/analysis-runs", payload: { market_id: "${m1}", product_type: CONVENTIONAL, prohibited_basis: RACE, period_start: "2026-01-01", period_end: "2026-04-01" }, as: FairLendingAnalyst, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /fair-lending/analysis-runs/${r1}/unlock", payload: {}, as: FairLendingAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409); run remains DRAFT"

      - name: unlock_blocked_when_findings_exist
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.AnalysisRun.DATA_LOCKED_to_DRAFT"
          - "errors[ERR_RUN_HAS_OPEN_FINDINGS]"
        distinguishing_aspect: "DATA_LOCKED -> DRAFT is blocked once any finding exists on the run: after compute auto-flagged one, unlock -> 409 ERR_RUN_HAS_OPEN_FINDINGS."
        test_recipe:
          setup:
            - "Run R DATA_LOCKED over fixture that computes to ADVERSE (control 1 DENIED of 1 decided... see calls: CONTROL 1 DENIED; PROTECTED_1 1 ORIGINATED + 1 DENIED -> control rate 0.0 -> ratio 0.0 -> ADVERSE auto-finding)"
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
            - { call: "POST /fair-lending/branches", payload: { market_id: "${m1}", name: "Main", tract_minority_pct: 55.0, opened_on: "2020-01-15" }, as: BankAdmin, captures: { b1: $.data.id } }
            - { call: "POST /fair-lending/loan-officers", payload: { branch_id: "${b1}", full_name: "Officer One" }, as: BankAdmin, captures: { o1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: DENIED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 640, dti_pct: 44.0, application_date: "2026-01-05", decision_date: "2026-01-20" }, as: LendingDataOps, captures: { c1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: PROTECTED_1, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 715, dti_pct: 36.0, application_date: "2026-02-01", decision_date: "2026-02-10" }, as: LendingDataOps, captures: { p1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: PROTECTED_1, outcome: DENIED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 645, dti_pct: 44.0, application_date: "2026-02-02", decision_date: "2026-02-11" }, as: LendingDataOps, captures: { p2: $.data.id } }
            - { call: "POST /fair-lending/applications/${c1}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/applications/${p1}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/applications/${p2}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/analysis-runs", payload: { market_id: "${m1}", product_type: CONVENTIONAL, prohibited_basis: RACE, period_start: "2026-01-01", period_end: "2026-04-01" }, as: FairLendingAnalyst, captures: { r1: $.data.id } }
            - { call: "POST /fair-lending/analysis-runs/${r1}/lock", payload: {}, as: FairLendingAnalyst }
            - { call: "POST /fair-lending/analysis-runs/${r1}/compute", payload: {}, as: FairLendingAnalyst, captures: { r_status: $.data.status, r_open: $.data.open_finding_count } }
          trigger:
            - { call: "POST /fair-lending/analysis-runs/${r1}/unlock", payload: {}, as: FairLendingAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "precondition state confirmed: run COMPUTED with open_finding_count == 1 (auto DENIAL_DISPARITY finding)"
            - "unlock -> 409 ERR_RUN_HAS_OPEN_FINDINGS; run remains COMPUTED"

      - name: lock_empty_scope_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.AnalysisRun.DRAFT_to_DATA_LOCKED"
          - "errors[ERR_NO_IN_SCOPE_APPLICATIONS]"
        distinguishing_aspect: "Lock with a zero-row in-scope set (empty-collection edge) -> 422 ERR_NO_IN_SCOPE_APPLICATIONS; the run stays DRAFT."
        test_recipe:
          setup: ["run R over (M1, FHA, RACE, Q1) with zero FHA applications in scope"]
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
