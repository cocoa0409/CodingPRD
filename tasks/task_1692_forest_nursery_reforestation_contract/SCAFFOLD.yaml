scenario: "Forest Nursery & Reforestation Contract (state forest nursery): seed collection zone & seedling order lead time, sowing/lifting schedule & cold storage, seedling grading & culls, planting contract crew scheduling & spacing spec, survival survey & replant obligation, herbicide/site prep coordination, cost-share program documentation, seedling shipment & handling window"

domain_name: forest-nursery-reforestation
api_prefix: /reforestation

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Landowner
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Landowner or organization legal name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: tax_id, type: string, source: input, description: "Tax identification number used on cost-share documentation" }
      - { name: cost_share_eligible, type: boolean, source: input, description: "Whether the landowner may enroll in cost-share programs", default: true }

  - name: SeedZone
    parent: null
    common_fields: true
    fields:
      - { name: zone_code, type: string, source: input, description: "Unique seed-collection-zone code", constraints: "unique across SeedZone" }
      - { name: min_elevation_ft, type: integer, source: input, description: "Lower elevation bound of the zone band, feet", constraints: ">= 0 and < max_elevation_ft" }
      - { name: max_elevation_ft, type: integer, source: input, description: "Upper elevation bound of the zone band, feet" }
      - { name: band_midpoint_ft, type: number, source: computed, description: "(min_elevation_ft + max_elevation_ft) / 2, used by the seed-transfer tolerance rule" }

  - name: SeedLot
    parent: null
    common_fields: true
    fields:
      - { name: source_zone_id, type: string, source: input, description: "FK -> SeedZone.id; zone where the seed was collected" }
      - { name: species, type: enum, source: input, description: "Tree species of the lot", constraints: "one of DOUGLAS_FIR, LOBLOLLY_PINE, WHITE_OAK" }
      - { name: collected_on, type: string, source: input, description: "Collection date, ISO date YYYY-MM-DD" }
      - { name: quantity_grams, type: integer, source: input, description: "Total collected seed mass in grams", constraints: "> 0" }
      - { name: germination_pct, type: number, source: input, description: "Latest lab germination fraction (0..1); overwritten by release retest", constraints: "0 < germination_pct <= 1" }
      - { name: remaining_grams, type: integer, source: computed, description: "quantity_grams minus sown_grams of every CropBatch of this lot (any batch status)" }
      - { name: status, type: enum, source: system, description: "Lot lifecycle", constraints: "AVAILABLE | QUARANTINED | DEPLETED", default: AVAILABLE }

  - name: CropBatch
    parent: null
    common_fields: true
    fields:
      - { name: seed_lot_id, type: string, source: input, description: "FK -> SeedLot.id; lot sown for this batch" }
      - { name: planned_sow_date, type: string, source: input, description: "Planned sow date, ISO date" }
      - { name: lift_window_start, type: string, source: input, description: "First permitted lift date, ISO date" }
      - { name: lift_window_end, type: string, source: input, description: "Last permitted lift date, ISO date", constraints: ">= lift_window_start" }
      - { name: actual_sow_date, type: string, source: system, description: "Set by the sow transition" }
      - { name: sown_grams, type: integer, source: system, description: "Grams debited from the lot at sow" }
      - { name: projected_plantable, type: integer, source: computed, description: "Forward-looking estimate per plantable_yield_projection (floor)" }
      - { name: lifted_on, type: string, source: system, description: "Actual lift date set by the lift transition" }
      - { name: lifted_count, type: integer, source: system, description: "Seedlings lifted, set by the lift transition" }
      - { name: plantable_count, type: integer, source: system, description: "Plantable (grade-acceptable) seedlings, set by the grade transition" }
      - { name: cull_count, type: integer, source: computed, description: "lifted_count - plantable_count after grading" }
      - { name: reserved_plantable, type: integer, source: computed, description: "Sum of quantity over ACTIVE Allocation rows referencing this batch" }
      - { name: status, type: enum, source: system, description: "Batch lifecycle", constraints: "PLANNED | SOWN | LIFTED | GRADED | DEPLETED", default: PLANNED }

  - name: SeedlingOrder
    parent: null
    common_fields: true
    fields:
      - { name: landowner_id, type: string, source: input, description: "FK -> Landowner.id; ordering landowner (must equal X-User-ID when role is Landowner)" }
      - { name: destination_zone_id, type: string, source: input, description: "FK -> SeedZone.id; zone where the seedlings will be planted" }
      - { name: species, type: enum, source: input, description: "Requested species", constraints: "one of DOUGLAS_FIR, LOBLOLLY_PINE, WHITE_OAK" }
      - { name: quantity, type: integer, source: input, description: "Seedlings requested", constraints: "> 0" }
      - { name: requested_ship_date, type: string, source: input, description: "Requested ship date, ISO date; lead-time rule applies" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Server-side species price: DOUGLAS_FIR 320, LOBLOLLY_PINE 280, WHITE_OAK 540" }
      - { name: total_price_cents, type: integer, source: computed, description: "Per order_total_price; tier keyed on pre-discount subtotal" }
      - { name: allocated_quantity, type: integer, source: computed, description: "Sum of quantity over ACTIVE Allocation rows for this order" }
      - { name: shipped_quantity, type: integer, source: computed, description: "Sum of quantity over Shipment rows of this order's contracts with status in {DISPATCHED, DELIVERED, PLANTED}" }
      - { name: status, type: enum, source: system, description: "Order lifecycle", constraints: "PENDING_REVIEW | CONFIRMED | ALLOCATED | FULFILLED | CANCELLED", default: PENDING_REVIEW }

  - name: Allocation
    parent: null
    common_fields: true
    fields:
      - { name: seedling_order_id, type: string, source: input, description: "FK -> SeedlingOrder.id; order receiving the reservation" }
      - { name: crop_batch_id, type: string, source: input, description: "FK -> CropBatch.id; graded batch supplying the reservation" }
      - { name: quantity, type: integer, source: input, description: "Reserved seedlings", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED", constraints: "ACTIVE | RELEASED", default: ACTIVE }

  - name: StorageUnit
    parent: null
    common_fields: true
    fields:
      - { name: unit_code, type: string, source: input, description: "Unique cold-storage unit code", constraints: "unique across StorageUnit" }
      - { name: capacity_units, type: integer, source: input, description: "Maximum seedlings held at any instant", constraints: "> 0" }
      - { name: temp_min_c, type: number, source: input, description: "Lower cold-chain temperature bound, Celsius" }
      - { name: temp_max_c, type: number, source: input, description: "Upper cold-chain temperature bound, Celsius", constraints: "> temp_min_c" }
      - { name: current_load, type: integer, source: computed, description: "Sum of (quantity - withdrawn_quantity) over ACTIVE StoragePlacement rows in this unit" }

  - name: StoragePlacement
    parent: null
    common_fields: true
    fields:
      - { name: crop_batch_id, type: string, source: input, description: "FK -> CropBatch.id; graded batch being stored" }
      - { name: storage_unit_id, type: string, source: input, description: "FK -> StorageUnit.id; receiving unit" }
      - { name: quantity, type: integer, source: input, description: "Seedlings placed", constraints: "> 0" }
      - { name: placed_on, type: string, source: input, description: "Date placed into cold storage, ISO date" }
      - { name: withdrawn_quantity, type: integer, source: computed, description: "Cumulative seedlings withdrawn by shipments; starts 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | WITHDRAWN | DISCARDED", constraints: "ACTIVE | WITHDRAWN | DISCARDED", default: ACTIVE }

  - name: PlantingContract
    parent: null
    common_fields: true
    fields:
      - { name: landowner_id, type: string, source: input, description: "FK -> Landowner.id; contracting landowner" }
      - { name: seedling_order_id, type: string, source: input, description: "FK -> SeedlingOrder.id; supply order feeding this contract" }
      - { name: site_zone_id, type: string, source: input, description: "FK -> SeedZone.id; planting-site seed zone" }
      - { name: acres, type: number, source: input, description: "Contracted acres", constraints: "> 0" }
      - { name: trees_per_acre, type: integer, source: input, description: "Spacing specification", constraints: "200 <= trees_per_acre <= 800" }
      - { name: contingency_pct, type: number, source: input, description: "Overage fraction for culls/mortality, e.g. 0.10", constraints: "0 <= contingency_pct <= 0.25" }
      - { name: required_seedlings, type: integer, source: computed, description: "Per required_seedlings calculation (ceil, large-acreage surcharge branch)" }
      - { name: planting_window_start, type: string, source: input, description: "First permitted planting date, ISO date" }
      - { name: planting_window_end, type: string, source: input, description: "Last permitted planting date, ISO date", constraints: ">= planting_window_start" }
      - { name: herbicide_applied_on, type: string, source: system, description: "Most recent recorded herbicide application date" }
      - { name: site_prep_status, type: enum, source: system, description: "NONE | RECORDED | VERIFIED | STALE", constraints: "NONE | RECORDED | VERIFIED | STALE", default: NONE }
      - { name: last_planted_on, type: string, source: system, description: "Date of the most recent complete-planting transition" }
      - { name: planted_quantity, type: integer, source: system, description: "Seedlings planted recorded at complete-planting (cumulative across replant cycles)" }
      - { name: obligation_count, type: integer, source: computed, description: "Number of SurvivalSurvey rows of this contract ever created with below_threshold true" }
      - { name: status, type: enum, source: system, description: "Contract lifecycle", constraints: "DRAFT | SITE_PREP | READY_TO_PLANT | BLOCKED | PLANTING | PLANTED | SURVEYED | REPLANT_REQUIRED | CLOSED | CANCELLED", default: DRAFT }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: crew_code, type: string, source: input, description: "Unique crew code", constraints: "unique across Crew" }
      - { name: capacity_per_day, type: integer, source: input, description: "Seedlings the crew can plant per day", constraints: "> 0" }
      - { name: active, type: boolean, source: input, description: "Whether the crew may receive new assignments", default: true }

  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id; assigned crew" }
      - { name: planting_contract_id, type: string, source: input, description: "FK -> PlantingContract.id; contract being planted" }
      - { name: start_date, type: string, source: input, description: "First work date, ISO date; interval is half-open [start_date, end_date)" }
      - { name: end_date, type: string, source: input, description: "Half-open interval end, ISO date", constraints: "> start_date" }
      - { name: planned_seedlings, type: integer, source: input, description: "Seedlings planned over the interval", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONFIRMED | COMPLETED | RELEASED", constraints: "SCHEDULED | CONFIRMED | COMPLETED | RELEASED", default: SCHEDULED }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: planting_contract_id, type: string, source: input, description: "FK -> PlantingContract.id; destination contract" }
      - { name: crop_batch_id, type: string, source: input, description: "FK -> CropBatch.id; batch drawn from" }
      - { name: quantity, type: integer, source: input, description: "Seedlings dispatched", constraints: "> 0" }
      - { name: dispatched_at, type: datetime, source: system, description: "Logical-clock timestamp at creation" }
      - { name: handling_deadline, type: datetime, source: computed, description: "dispatched_at + HANDLING_WINDOW_HOURS (72h)" }
      - { name: delivered_at, type: datetime, source: system, description: "Set by the deliver transition" }
      - { name: planted_confirmed_at, type: datetime, source: system, description: "Set by the confirm-planted transition" }
      - { name: spoilage_reason, type: enum, source: system, description: "TEMP_EXCURSION | WINDOW_EXPIRED | HANDLING_DAMAGE, set by report-spoilage", constraints: "TEMP_EXCURSION | WINDOW_EXPIRED | HANDLING_DAMAGE" }
      - { name: status, type: enum, source: system, description: "DISPATCHED | DELIVERED | PLANTED | SPOILED", constraints: "DISPATCHED | DELIVERED | PLANTED | SPOILED", default: DISPATCHED }

  - name: SurvivalSurvey
    parent: null
    common_fields: true
    fields:
      - { name: planting_contract_id, type: string, source: input, description: "FK -> PlantingContract.id; surveyed contract" }
      - { name: surveyed_on, type: string, source: input, description: "Survey date, ISO date; must fall in the survey window" }
      - { name: planted_count_snapshot, type: integer, source: system, description: "contract.planted_quantity captured at survey creation" }
      - { name: alive_count, type: integer, source: input, description: "Living seedlings counted", constraints: ">= 0 and <= planted_count_snapshot" }
      - { name: survival_pct, type: number, source: computed, description: "round_half_up(alive_count / planted_count_snapshot * 100, 2)" }
      - { name: threshold_pct, type: number, source: computed, description: "70.00 standard; 80.00 when the landowner holds an enrollment in {APPROVED, PAYMENT_HELD, PAID}" }
      - { name: below_threshold, type: boolean, source: computed, description: "survival_pct < threshold_pct" }
      - { name: owed_quantity, type: integer, source: computed, description: "Per replant_owed_quantity when below_threshold, else 0" }
      - { name: replant_date, type: string, source: system, description: "Scheduled replant date, set by schedule-replant" }
      - { name: waiver_reason, type: string, source: system, description: "Set by waive-replant" }
      - { name: obligation_status, type: enum, source: system, description: "Embedded replant-obligation lifecycle", constraints: "NONE | OPEN | SCHEDULED | FULFILLED | WAIVED", default: NONE }

  - name: CostShareEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: landowner_id, type: string, source: input, description: "FK -> Landowner.id; enrolled landowner" }
      - { name: program_code, type: string, source: input, description: "Cost-share program identifier" }
      - { name: enrolled_acres, type: number, source: input, description: "Acres approved for enrollment", constraints: "> 0" }
      - { name: rate_per_acre_cents, type: integer, source: input, description: "Program cost-share rate per acre, cents", constraints: "> 0" }
      - { name: cap_cents, type: integer, source: input, description: "Maximum award for this enrollment, cents", constraints: "> 0" }
      - { name: documented_acres, type: number, source: system, description: "Verified acres from submitted documentation" }
      - { name: documented_cost_cents, type: integer, source: system, description: "Documented eligible cost from submitted documentation" }
      - { name: provisional_award_cents, type: integer, source: computed, description: "Award estimate from enrolled_acres at create/submit (provisional variant)" }
      - { name: final_award_cents, type: integer, source: computed, description: "Award from documented_acres at approve (final variant)" }
      - { name: paid_cents, type: integer, source: computed, description: "Cumulative disbursed amount" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | APPROVED | PAYMENT_HELD | PAID", constraints: "DRAFT | UNDER_REVIEW | APPROVED | PAYMENT_HELD | PAID", default: DRAFT }

state_machines:
  - entity: SeedLot
    initial_state: AVAILABLE
    terminal_states: [DEPLETED]
    transitions:
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /reforestation/seed-lots/{id}/quarantine"
        actor: NurseryManager
        preconditions: ["lot.status == AVAILABLE"]
        side_effects: ["germination hold: allocations against batches of this lot are rejected while QUARANTINED (validation, not mutation)"]
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /reforestation/seed-lots/{id}/release"
        actor: NurseryManager
        preconditions: ["lot.status == QUARANTINED", "0 < retest_germination_pct <= 1"]
        side_effects: ["lot.germination_pct := retest_germination_pct", "recompute projected_plantable for every CropBatch of this lot in status PLANNED"]
        note: "cycle AVAILABLE -> QUARANTINED -> AVAILABLE is unrestricted in count"
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system: automatic when remaining_grams reaches 0 at a successful sow"
        actor: system
        preconditions: ["lot.remaining_grams == 0 immediately after the sow debit"]
        side_effects: []

  - entity: CropBatch
    initial_state: PLANNED
    terminal_states: [DEPLETED]
    transitions:
      - from: PLANNED
        to: SOWN
        trigger: "POST /reforestation/crop-batches/{id}/sow"
        actor: NurseryManager
        preconditions: ["batch.status == PLANNED", "seed lot status == AVAILABLE", "sown_grams <= lot.remaining_grams", "sown_grams > 0"]
        side_effects: ["lot.remaining_grams -= sown_grams", "if lot.remaining_grams == 0 then lot.status := DEPLETED", "batch.actual_sow_date := payload", "batch.projected_plantable := plantable_yield_projection(sown_grams, lot.germination_pct, lot.species)"]
      - from: SOWN
        to: LIFTED
        trigger: "POST /reforestation/crop-batches/{id}/lift"
        actor: NurseryManager
        preconditions: ["batch.status == SOWN", "lift_window_start <= lifted_on <= lift_window_end", "lifted_count > 0"]
        side_effects: ["batch.lifted_on := payload.lifted_on", "batch.lifted_count := payload.lifted_count"]
      - from: LIFTED
        to: GRADED
        trigger: "POST /reforestation/crop-batches/{id}/grade"
        actor: NurseryManager
        preconditions: ["batch.status == LIFTED", "0 < plantable_count <= lifted_count"]
        side_effects:
          - "batch.plantable_count := payload.plantable_count; batch.cull_count := lifted_count - plantable_count"
          - "CASCADE A link 1: while reserved_plantable > plantable_count, release the most recently created ACTIVE Allocation of this batch (created_at DESC, then id is never used) until reserved_plantable <= plantable_count; each released Allocation.status := RELEASED"
          - "CASCADE A link 2: each Allocation release mutates its SeedlingOrder: allocated_quantity recomputed; if the order was ALLOCATED and allocated_quantity < quantity then order.status := CONFIRMED"
          - "CASCADE A link 3: each order demotion ALLOCATED -> CONFIRMED re-evaluates every PlantingContract with seedling_order_id == order.id: if contract.status == READY_TO_PLANT then contract.status := BLOCKED"
      - from: GRADED
        to: DEPLETED
        trigger: "system: automatic when every plantable seedling has left storage"
        actor: system
        preconditions: ["sum of quantity over Shipment rows of this batch in any status == plantable_count", "no ACTIVE StoragePlacement rows remain for this batch"]
        side_effects: []

  - entity: SeedlingOrder
    initial_state: PENDING_REVIEW
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: PENDING_REVIEW
        to: CONFIRMED
        trigger: "POST /reforestation/seedling-orders/{id}/confirm"
        actor: ContractOfficer
        preconditions: ["order.status == PENDING_REVIEW", "requested_ship_date - current logical date >= LEAD_DAYS(species category)"]
        side_effects: []
      - from: CONFIRMED
        to: PENDING_REVIEW
        trigger: "POST /reforestation/seedling-orders/{id}/amend"
        actor: Landowner
        preconditions: ["order.status in {PENDING_REVIEW, CONFIRMED}", "amendment keeps lead-time rule satisfiable", "expected_seedling_order_version == order.version"]
        side_effects: ["quantity/requested_ship_date updated", "total_price_cents recomputed", "order.status := PENDING_REVIEW (reopens review)"]
        note: "amendment loop CONFIRMED -> PENDING_REVIEW -> CONFIRMED is unrestricted"
      - from: CONFIRMED
        to: ALLOCATED
        trigger: "system: automatic when allocated_quantity reaches quantity at allocation creation"
        actor: system
        preconditions: ["allocated_quantity == quantity after the new Allocation"]
        side_effects: []
      - from: ALLOCATED
        to: CONFIRMED
        trigger: "system: automatic when an Allocation release drops allocated_quantity below quantity"
        actor: system
        preconditions: ["allocated_quantity < quantity after the release"]
        side_effects: ["CASCADE A link 3: demote linked READY_TO_PLANT contracts to BLOCKED"]
      - from: PENDING_REVIEW
        to: CANCELLED
        trigger: "POST /reforestation/seedling-orders/{id}/cancel"
        actor: Landowner | ContractOfficer
        preconditions: ["order.status in {PENDING_REVIEW, CONFIRMED}", "shipped_quantity == 0"]
        side_effects: ["every ACTIVE Allocation of this order := RELEASED (compensation)", "batch reserved_plantable recomputed for each affected batch"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /reforestation/seedling-orders/{id}/cancel"
        actor: Landowner | ContractOfficer
        preconditions: ["order.status in {PENDING_REVIEW, CONFIRMED}", "shipped_quantity == 0"]
        side_effects: ["every ACTIVE Allocation of this order := RELEASED (compensation)"]
      - from: ALLOCATED
        to: FULFILLED
        trigger: "system: automatic when shipped_quantity >= quantity"
        actor: system
        preconditions: ["shipped_quantity >= quantity after a shipment mutation"]
        side_effects: []

  - entity: Allocation
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /reforestation/allocations/{id}/release or cascade (grade shortfall / order cancel)"
        actor: ContractOfficer | system
        preconditions: ["allocation.status == ACTIVE", "for manual release: no Shipment in {DISPATCHED, DELIVERED} references the allocation's batch for the order's contracts"]
        side_effects: ["order.allocated_quantity -= quantity", "if order.status == ALLOCATED then order.status := CONFIRMED", "batch.reserved_plantable -= quantity", "contract demotion cascade (CASCADE A link 3)"]

  - entity: StoragePlacement
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN, DISCARDED]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "system: automatic when withdrawn_quantity reaches quantity via shipment withdrawal"
        actor: system
        preconditions: ["withdrawn_quantity == quantity after withdrawal"]
        side_effects: ["storage unit current_load recomputed"]
      - from: ACTIVE
        to: DISCARDED
        trigger: "POST /reforestation/storage-placements/{id}/discard"
        actor: NurseryManager
        preconditions: ["placement.status == ACTIVE"]
        side_effects: ["unwithdrawn remainder written off as culls (does not change batch.cull_count)", "storage unit current_load recomputed"]

  - entity: PlantingContract
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SITE_PREP
        trigger: "POST /reforestation/planting-contracts/{id}/record-site-prep"
        actor: ContractOfficer
        preconditions: ["contract.status in {DRAFT, REPLANT_REQUIRED}", "herbicide_applied_on <= current logical date"]
        side_effects: ["contract.herbicide_applied_on := payload", "contract.site_prep_status := RECORDED"]
        note: "from REPLANT_REQUIRED this same transition closes the replant loop"
      - from: REPLANT_REQUIRED
        to: SITE_PREP
        trigger: "POST /reforestation/planting-contracts/{id}/record-site-prep"
        actor: ContractOfficer
        preconditions: ["contract.status in {DRAFT, REPLANT_REQUIRED}"]
        side_effects: ["site_prep_status := RECORDED (prior VERIFIED is superseded)"]
      - from: SITE_PREP
        to: READY_TO_PLANT
        trigger: "POST /reforestation/planting-contracts/{id}/mark-ready"
        actor: ContractOfficer
        preconditions: ["contract.status in {SITE_PREP, BLOCKED}", "site_prep_status == VERIFIED", "order (seedling_order_id) allocated_quantity >= contract.required_seedlings"]
        side_effects: []
      - from: BLOCKED
        to: READY_TO_PLANT
        trigger: "POST /reforestation/planting-contracts/{id}/mark-ready"
        actor: ContractOfficer
        preconditions: ["contract.status in {SITE_PREP, BLOCKED}", "site_prep_status == VERIFIED", "order allocated_quantity >= required_seedlings"]
        side_effects: []
      - from: READY_TO_PLANT
        to: BLOCKED
        trigger: "system: automatic when CASCADE A demotes the supply order below full allocation"
        actor: system
        preconditions: ["linked order allocated_quantity < required_seedlings"]
        side_effects: []
      - from: READY_TO_PLANT
        to: PLANTING
        trigger: "POST /reforestation/planting-contracts/{id}/start-planting"
        actor: ContractOfficer
        preconditions:
          - "contract.status == READY_TO_PLANT"
          - "herbicide age at current logical date in [14, 120] days: 14 <= current_date - herbicide_applied_on <= 120"
          - "exists a CONFIRMED CrewAssignment of this contract with start_date <= current_date < end_date"
          - "current logical date within [planting_window_start, planting_window_end]"
        side_effects: []
      - from: PLANTING
        to: PLANTED
        trigger: "POST /reforestation/planting-contracts/{id}/complete-planting"
        actor: ContractOfficer
        preconditions: ["contract.status == PLANTING", "planted_qty >= acres * trees_per_acre when obligation_count == 0 (initial planting; equality passes)", "on replant cycles (obligation_count >= 1): planted_qty >= owed_quantity of the most recent obligation with status in {OPEN, SCHEDULED}"]
        side_effects: ["contract.planted_quantity += payload quantity", "contract.last_planted_on := current logical date", "every CONFIRMED CrewAssignment of this contract := COMPLETED (auto)"]
      - from: PLANTED
        to: SURVEYED
        trigger: "system: automatic on POST /reforestation/survival-surveys creation"
        actor: system
        preconditions: ["survey created successfully"]
        side_effects: ["immediately re-evaluated: SURVEYED -> CLOSED if below_threshold == false, else SURVEYED -> REPLANT_REQUIRED"]
      - from: SURVEYED
        to: CLOSED
        trigger: "system: automatic when the new survey has below_threshold == false"
        actor: system
        preconditions: ["survival_pct >= threshold_pct"]
        side_effects: []
      - from: SURVEYED
        to: REPLANT_REQUIRED
        trigger: "system: automatic when the new survey has below_threshold == true"
        actor: system
        preconditions: ["survival_pct < threshold_pct"]
        side_effects:
          - "CASCADE B link 1: survey.obligation_status := OPEN, owed_quantity computed"
          - "CASCADE B link 2 (from contract flip): every CrewAssignment of this contract in {SCHEDULED, CONFIRMED} := RELEASED"
          - "CASCADE B link 2 (from contract flip): if the contract's landowner has a CostShareEnrollment in APPROVED, that enrollment := PAYMENT_HELD"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /reforestation/planting-contracts/{id}/cancel"
        actor: ContractOfficer
        preconditions: ["contract.status in {DRAFT, SITE_PREP, READY_TO_PLANT, BLOCKED}", "no Shipment of this contract in {DISPATCHED, DELIVERED, PLANTED}"]
        side_effects: ["every CrewAssignment of this contract in {SCHEDULED, CONFIRMED} := RELEASED (compensation restores crew capacity)", "order allocations are NOT released (order lifecycle is independent)"]
      - from: SITE_PREP
        to: CANCELLED
        trigger: "POST /reforestation/planting-contracts/{id}/cancel"
        actor: ContractOfficer
        preconditions: ["contract.status in {DRAFT, SITE_PREP, READY_TO_PLANT, BLOCKED}", "no Shipment of this contract in {DISPATCHED, DELIVERED, PLANTED}"]
        side_effects: ["assignments in {SCHEDULED, CONFIRMED} := RELEASED"]
      - from: READY_TO_PLANT
        to: CANCELLED
        trigger: "POST /reforestation/planting-contracts/{id}/cancel"
        actor: ContractOfficer
        preconditions: ["contract.status in {DRAFT, SITE_PREP, READY_TO_PLANT, BLOCKED}", "no Shipment of this contract in {DISPATCHED, DELIVERED, PLANTED}"]
        side_effects: ["assignments in {SCHEDULED, CONFIRMED} := RELEASED"]
      - from: BLOCKED
        to: CANCELLED
        trigger: "POST /reforestation/planting-contracts/{id}/cancel"
        actor: ContractOfficer
        preconditions: ["contract.status in {DRAFT, SITE_PREP, READY_TO_PLANT, BLOCKED}", "no Shipment of this contract in {DISPATCHED, DELIVERED, PLANTED}"]
        side_effects: ["assignments in {SCHEDULED, CONFIRMED} := RELEASED"]

  - entity: CrewAssignment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, RELEASED]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /reforestation/crew-assignments/{id}/confirm"
        actor: ContractOfficer
        preconditions: ["assignment.status == SCHEDULED", "contract.status in {SITE_PREP, READY_TO_PLANT, BLOCKED}"]
        side_effects: []
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system: automatic on contract complete-planting"
        actor: system
        preconditions: ["contract transition PLANTING -> PLANTED succeeds"]
        side_effects: ["crew daily load recomputed"]
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /reforestation/crew-assignments/{id}/release or cascade (contract cancel / REPLANT_REQUIRED)"
        actor: ContractOfficer | system
        preconditions: ["assignment.status in {SCHEDULED, CONFIRMED}"]
        side_effects: ["crew daily load recomputed (capacity restored)"]
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /reforestation/crew-assignments/{id}/release or cascade"
        actor: ContractOfficer | system
        preconditions: ["assignment.status in {SCHEDULED, CONFIRMED}"]
        side_effects: ["crew daily load recomputed (capacity restored)"]

  - entity: Shipment
    initial_state: DISPATCHED
    terminal_states: [PLANTED, SPOILED]
    transitions:
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /reforestation/shipments/{id}/deliver"
        actor: NurseryManager
        preconditions: ["shipment.status == DISPATCHED", "delivered_at >= dispatched_at"]
        side_effects: ["shipment.delivered_at := payload"]
      - from: DELIVERED
        to: PLANTED
        trigger: "POST /reforestation/shipments/{id}/confirm-planted"
        actor: ContractOfficer
        preconditions: ["shipment.status == DELIVERED", "planted_confirmed_at <= handling_deadline (equality passes)", "contract.status == PLANTING"]
        side_effects: ["shipment.planted_confirmed_at := payload"]
      - from: DISPATCHED
        to: SPOILED
        trigger: "POST /reforestation/shipments/{id}/report-spoilage"
        actor: FieldAuditor
        preconditions: ["shipment.status in {DISPATCHED, DELIVERED}"]
        side_effects: ["spoilage_reason := payload.reason", "order.shipped_quantity -= quantity (spoiled stock no longer counts toward fulfillment; stock is written off, not returned to storage)"]
      - from: DELIVERED
        to: SPOILED
        trigger: "POST /reforestation/shipments/{id}/report-spoilage"
        actor: FieldAuditor
        preconditions: ["shipment.status in {DISPATCHED, DELIVERED}"]
        side_effects: ["spoilage_reason := payload.reason", "order.shipped_quantity -= quantity"]

  - entity: SurvivalSurvey
    initial_state: NONE
    terminal_states: [FULFILLED, WAIVED, NONE]
    transitions:
      - from: NONE
        to: OPEN
        trigger: "system: automatic at survey creation when below_threshold == true"
        actor: system
        preconditions: ["survival_pct < threshold_pct"]
        side_effects: ["owed_quantity computed per replant_owed_quantity"]
      - from: OPEN
        to: SCHEDULED
        trigger: "POST /reforestation/survival-surveys/{id}/schedule-replant"
        actor: ContractOfficer
        preconditions: ["obligation_status == OPEN", "replant_date >= current logical date"]
        side_effects: ["survey.replant_date := payload"]
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /reforestation/survival-surveys/{id}/reopen-replant"
        actor: ContractOfficer
        preconditions: ["obligation_status == SCHEDULED"]
        side_effects: ["survey.replant_date cleared"]
        note: "reschedule loop SCHEDULED -> OPEN -> SCHEDULED is unrestricted"
      - from: SCHEDULED
        to: FULFILLED
        trigger: "POST /reforestation/survival-surveys/{id}/fulfill-replant"
        actor: ContractOfficer
        preconditions: ["obligation_status == SCHEDULED", "contract.status in {PLANTED, SURVEYED, CLOSED} with last_planted_on > survey.created_at date (a replant cycle completed after the survey)"]
        side_effects: ["hold release: if no other SurvivalSurvey of any contract of the same landowner has obligation_status in {OPEN, SCHEDULED}, that landowner's PAYMENT_HELD enrollments return to APPROVED"]
      - from: OPEN
        to: WAIVED
        trigger: "POST /reforestation/survival-surveys/{id}/waive-replant"
        actor: ProgramAdministrator
        preconditions: ["obligation_status == OPEN", "waiver_reason non-empty"]
        side_effects: ["waiver_reason := payload", "hold release (same rule as FULFILLED)"]

  - entity: CostShareEnrollment
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /reforestation/cost-share-enrollments/{id}/submit"
        actor: Landowner
        preconditions: ["enrollment.status == DRAFT", "documented_acres > 0 and documented_acres <= enrolled_acres", "documented_cost_cents > 0"]
        side_effects: ["documented_acres/documented_cost_cents recorded", "provisional_award_cents recomputed from documented_acres"]
      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /reforestation/cost-share-enrollments/{id}/return-for-correction"
        actor: ProgramAdministrator
        preconditions: ["enrollment.status == UNDER_REVIEW", "reason non-empty"]
        side_effects: ["documentation returned to the landowner for correction (loop DRAFT -> UNDER_REVIEW -> DRAFT unrestricted)"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /reforestation/cost-share-enrollments/{id}/approve"
        actor: ProgramAdministrator
        preconditions: ["enrollment.status == UNDER_REVIEW"]
        side_effects: ["final_award_cents := cost_share_award final variant (documented_acres)", "provisional_award_cents retained for delta reporting"]
      - from: APPROVED
        to: PAYMENT_HELD
        trigger: "system: automatic when CASCADE B flips a contract of the same landowner to REPLANT_REQUIRED"
        actor: system
        preconditions: ["landowner has a contract entering REPLANT_REQUIRED"]
        side_effects: []
      - from: PAYMENT_HELD
        to: APPROVED
        trigger: "system: automatic when the landowner's last {OPEN, SCHEDULED} obligation resolves to FULFILLED or WAIVED"
        actor: system
        preconditions: ["no SurvivalSurvey of the landowner's contracts has obligation_status in {OPEN, SCHEDULED}"]
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /reforestation/cost-share-enrollments/{id}/pay"
        actor: ProgramAdministrator
        preconditions: ["enrollment.status == APPROVED (not PAYMENT_HELD)"]
        side_effects: ["paid_cents := final_award_cents (single disbursement)"]

concurrency_rules:
  - rule_id: crop-batch-create-stale-lot
    parent_entity: SeedLot
    write_endpoint: "POST /reforestation/crop-batches"
    occ_field: expected_seed_lot_version
    description: |
      Creating a CropBatch against a SeedLot whose version has advanced since
      the client last observed it is rejected. The client planned the sow from
      a stale view of remaining_grams (another sow may have debited the lot
      in between), so the create must carry the observed version and the
      server compares it against the lot's current version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: order-amend-stale-order
    parent_entity: SeedlingOrder
    write_endpoint: "POST /reforestation/seedling-orders/{id}/amend"
    occ_field: expected_seedling_order_version
    description: |
      Amending a SeedlingOrder whose version has advanced since the client
      last observed it is rejected. The amendment was computed against a stale
      quantity/price view (e.g., a confirm or a prior amend mutated the order
      in between), so the request must carry the observed version and the
      server rejects the write when it no longer matches.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: required_seedlings
    trigger: "on PlantingContract creation"
    algorithm: threshold
    formula: |
      c_eff = contingency_pct + (0.05 if acres >= LARGE_SITE_ACRES else 0)
      required_seedlings = ceil(acres * trees_per_acre * (1 + c_eff))
    input_set: "the new PlantingContract (acres, trees_per_acre, contingency_pct)"
    constants:
      LARGE_SITE_ACRES: 50
    precision: "integer via ceil"
    note: "mode (a) combinatorial: 3 inputs with a conditional branch on acres"
  - name: plantable_yield_projection
    trigger: "on CropBatch sow transition (projected) and grade transition (actual)"
    algorithm: forward_looking
    formula: |
      projected: projected_plantable = floor(sown_grams * SEEDS_PER_GRAM[species] * germination_pct * (1 - EXPECTED_CULL_RATE))
      actual: plantable_count as recorded by grade
    input_set: "the CropBatch and its SeedLot"
    constants:
      EXPECTED_CULL_RATE: 0.12
      SEEDS_PER_GRAM: { DOUGLAS_FIR: 88, LOBLOLLY_PINE: 55, WHITE_OAK: 0.2 }
    precision: "integer via floor"
    variants:
      - name: projected
        when: "before grading; used for planning reads"
        difference: "estimate from seed mass and lab germination; ignores field reality"
      - name: actual
        when: "after grading"
        difference: "physical count from the grade run; almost always differs from projected"
  - name: survival_pct_and_threshold
    trigger: "on SurvivalSurvey creation"
    algorithm: threshold
    formula: |
      survival_pct = round_half_up(alive_count / planted_count_snapshot * 100, 2)
      threshold_pct = 80.00 if landowner holds any CostShareEnrollment in {APPROVED, PAYMENT_HELD, PAID} else 70.00
      below_threshold = survival_pct < threshold_pct   (equality passes)
    input_set: "the new SurvivalSurvey plus the contract's landowner's enrollments"
    constants:
      STANDARD_THRESHOLD_PCT: 70.00
      COST_SHARE_THRESHOLD_PCT: 80.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: standard
        when: "landowner has no enrollment in {APPROVED, PAYMENT_HELD, PAID}"
        difference: "pass bar is 70.00"
      - name: cost_share
        when: "landowner holds an enrollment in {APPROVED, PAYMENT_HELD, PAID}"
        difference: "identical alive/planted data is judged against 80.00; a survey at 75.00 passes standard but fails cost_share"
  - name: replant_owed_quantity
    trigger: "on SurvivalSurvey creation when below_threshold == true"
    algorithm: threshold
    formula: |
      required_surviving = ceil(contract.required_seedlings * threshold_pct / 100)
      base_owed = max(0, required_surviving - alive_count)
      if contract.obligation_count (prior below-threshold surveys) >= 1:
          owed = ceil(base_owed * REPEAT_FAILURE_FACTOR)
      else:
          owed = base_owed
      owed_quantity = min(ESCALATION_CAP_MULT * planted_count_snapshot, min(planted_count_snapshot, owed))
    input_set: "the new SurvivalSurvey, its PlantingContract, and prior below-threshold surveys of that contract"
    constants:
      REPEAT_FAILURE_FACTOR: 1.25
      ESCALATION_CAP_MULT: 2
    precision: "integer via ceil after multiplication"
    note: "mode (a) combinatorial: nested min/max with a conditional escalation branch"
  - name: order_total_price
    trigger: "on SeedlingOrder creation and on amend"
    algorithm: tiered_pricing
    formula: |
      subtotal = quantity * unit_price_cents
      tier = 0.15 if subtotal >= TIER2_MIN_CENTS else (0.10 if subtotal >= TIER1_MIN_CENTS else 0)
      # EVALUATION ORDER PINNED: the discount tier is keyed on the PRE-discount subtotal.
      # Keying it on the post-discount total would be circular and is forbidden.
      total_price_cents = round_half_up(subtotal * (1 - tier), 0)
    input_set: "the SeedlingOrder (quantity, species)"
    constants:
      TIER1_MIN_CENTS: 2000000
      TIER2_MIN_CENTS: 5000000
    precision: "integer cents, round_half_up"
    note: "mode (c) combinatorial: circular-looking tier keyed on the value being discounted; pinned to pre-discount subtotal"
  - name: cost_share_award
    trigger: "provisional at enrollment create/submit; final at approve"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER PINNED: each component is rounded to integer cents BEFORE summing.
      # base and bonus are rounded individually; summing first and rounding once is forbidden.
      base_cents   = round_half_up(acres_basis * rate_per_acre_cents, 0)
      bonus_cents  = round_half_up(base_cents * STEWARDSHIP_BONUS_PCT, 0)
      award_cents  = min(cap_cents, base_cents + bonus_cents)
      provisional variant: acres_basis = enrolled_acres
      final variant:       acres_basis = documented_acres
    input_set: "the CostShareEnrollment"
    constants:
      STEWARDSHIP_BONUS_PCT: 0.10
    precision: "integer cents, round_half_up per component"
    variants:
      - name: provisional
        when: "at create and at submit"
        difference: "uses enrolled_acres; recomputed at submit from documented_acres"
      - name: final
        when: "at approve"
        difference: "uses documented_acres; diverges from provisional whenever documented != enrolled"
    note: "mode (b) combinatorial: nested rounding order pinned"
  - name: storage_load
    trigger: "on placement create, shipment withdrawal, discard"
    algorithm: aggregation
    formula: |
      current_load(unit) = sum over StoragePlacement p where p.storage_unit_id == unit.id
                           and p.status == ACTIVE of (p.quantity - p.withdrawn_quantity)
      placement admissible iff current_load + new_quantity <= capacity_units   (equality passes)
    input_set: "ACTIVE StoragePlacement rows of the unit"
    constants: {}
    precision: "integer"
  - name: crew_daily_load
    trigger: "on assignment create/confirm/release/complete and start-planting checks"
    algorithm: aggregation
    formula: |
      days(a) = (a.end_date - a.start_date).days            # half-open interval
      daily_load(a) = ceil(a.planned_seedlings / days(a))
      feasibility: daily_load(new) <= crew.capacity_per_day - sum of daily_load(x) over
        assignments x of the crew with status in {SCHEDULED, CONFIRMED} whose [start,end) intersects
      free_capacity(crew, d) = capacity_per_day - sum of daily_load(x) over x covering date d
        with status in {SCHEDULED, CONFIRMED}
    input_set: "CrewAssignment rows of the crew in {SCHEDULED, CONFIRMED}"
    constants: {}
    precision: "integer via ceil"
  - name: handling_and_age_deadlines
    trigger: "on shipment create (stock age) and confirm-planted (handling window)"
    algorithm: threshold
    formula: |
      handling_deadline = dispatched_at + HANDLING_WINDOW_HOURS hours
      confirm-planted admissible iff planted_confirmed_at <= handling_deadline   (equality passes)
      stock age admissible iff (dispatch_date - placement.placed_on).days <= COLD_STORAGE_MAX_DAYS
        for every ACTIVE placement of the batch that the withdrawal touches   (equality passes)
    input_set: "the Shipment and the StoragePlacement rows it withdraws from"
    constants:
      HANDLING_WINDOW_HOURS: 72
      COLD_STORAGE_MAX_DAYS: 45
    precision: "hour granularity for handling; day granularity for age"

validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role; for entity_backed Landowner the id must resolve to an existing Landowner", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is in the endpoint's role list; Landowner role may only touch resources whose landowner_id == X-User-ID", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path parameters and body FK references resolve to existing resources, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "OCC: expected_<parent>_version matches the parent entity's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /reforestation/crop-batches; POST /reforestation/seedling-orders/{id}/amend" }
  - { priority: 5, category: state, check: "state-machine from-state permits the requested transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: business_safety, check: "seed lot is not QUARANTINED when sowing, allocating, or shipping", error_id: ERR_LOT_QUARANTINED, http_status: 422, applies_to: "POST /reforestation/crop-batches/{id}/sow; POST /reforestation/seedling-orders/{id}/allocations; POST /reforestation/shipments" }
  - { priority: 7, category: business_safety, check: "site prep recorded and VERIFIED before mark-ready; FieldAuditor verification required (recorder role cannot verify)", error_id: ERR_SITE_PREP_NOT_VERIFIED, http_status: 422, applies_to: "POST /reforestation/planting-contracts/{id}/mark-ready; POST /reforestation/planting-contracts/{id}/verify-site-prep" }
  - { priority: 8, category: business_temporal, check: "lead time: requested_ship_date - current logical date >= LEAD_DAYS (210 conifer, 120 hardwood); equality passes", error_id: ERR_LEAD_TIME_INSUFFICIENT, http_status: 422, applies_to: "POST /reforestation/seedling-orders; POST /reforestation/seedling-orders/{id}/confirm; POST /reforestation/seedling-orders/{id}/amend" }
  - { priority: 9, category: business_temporal, check: "herbicide efficacy window at start-planting: 14 <= current_date - herbicide_applied_on <= 120 days", error_id: ERR_SITE_PREP_WINDOW_INVALID, http_status: 422, applies_to: "POST /reforestation/planting-contracts/{id}/start-planting" }
  - { priority: 10, category: business_temporal, check: "survey window: surveyed_on in [last_planted_on + 300, last_planted_on + 400] days inclusive", error_id: ERR_SURVEY_WINDOW_INVALID, http_status: 422, applies_to: "POST /reforestation/survival-surveys" }
  - { priority: 11, category: business_temporal, check: "handling window: planted_confirmed_at <= dispatched_at + 72h (equality passes)", error_id: ERR_HANDLING_WINDOW_EXCEEDED, http_status: 422, applies_to: "POST /reforestation/shipments/{id}/confirm-planted" }
  - { priority: 12, category: business_temporal, check: "cold-storage age: every ACTIVE placement touched by a shipment has (dispatch_date - placed_on) <= 45 days (equality passes)", error_id: ERR_STOCK_AGE_EXCEEDED, http_status: 422, applies_to: "POST /reforestation/shipments" }
  - { priority: 13, category: business_temporal, check: "lift window: lift_window_start <= lifted_on <= lift_window_end inclusive", error_id: ERR_LIFT_WINDOW_INVALID, http_status: 422, applies_to: "POST /reforestation/crop-batches/{id}/lift" }
  - { priority: 14, category: business_constraint, check: "seed-transfer rule: species match and |source zone band_midpoint_ft - destination zone band_midpoint_ft| <= 500 ft for allocations and shipments", error_id: ERR_SPECIES_ZONE_MISMATCH, http_status: 422, applies_to: "POST /reforestation/seedling-orders/{id}/allocations; POST /reforestation/shipments" }
  - { priority: 15, category: business_constraint, check: "crew overlap: for the same crew, half-open [start_date, end_date) intervals of assignments in {SCHEDULED, CONFIRMED} must not intersect; same-contract adjacency (new.start == existing.end) allowed; different contracts additionally require a 1-day buffer (new.start >= existing.end + 1 day or new.end <= existing.start - 1 day)", error_id: ERR_CREW_OVERLAP, http_status: 409, applies_to: "POST /reforestation/crew-assignments" }
  - { priority: 16, category: business_constraint, check: "spacing spec: 200 <= trees_per_acre <= 800", error_id: ERR_SPACING_SPEC_INVALID, http_status: 422, applies_to: "POST /reforestation/planting-contracts" }
  - { priority: 17, category: business_constraint, check: "interval sanity: end strictly after start / window end >= window start / elevations ordered", error_id: ERR_WINDOW_INVERTED, http_status: 400, applies_to: "POST /reforestation/crew-assignments; POST /reforestation/crop-batches; POST /reforestation/planting-contracts; POST /reforestation/seed-zones" }
  - { priority: 18, category: business_constraint, check: "required fields present and well-typed; enum values in declared sets", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 19, category: business_referential, check: "shipment batch must be GRADED with species/zone tolerance satisfied; allocation batch must be in {SOWN, LIFTED, GRADED} (SOWN/LIFTED reserve against projected_plantable, GRADED against plantable_count) with species match", error_id: ERR_BATCH_NOT_GRADED, http_status: 422, applies_to: "POST /reforestation/seedling-orders/{id}/allocations; POST /reforestation/shipments" }
  - { priority: 20, category: business_constraint, check: "complete-planting quantity floor: planted_qty >= acres * trees_per_acre on initial planting (equality passes), or >= owed_quantity of the driving obligation on replant cycles", error_id: ERR_PLANTING_QUANTITY_SHORT, http_status: 422, applies_to: "POST /reforestation/planting-contracts/{id}/complete-planting" }
  - { priority: 21, category: business_fiscal, check: "allocation quantity <= min(order quantity - allocated_quantity, allocatable_basis - reserved_plantable) where allocatable_basis = batch.plantable_count when GRADED else batch.projected_plantable", error_id: ERR_ALLOCATION_EXCEEDS_AVAILABLE, http_status: 422, applies_to: "POST /reforestation/seedling-orders/{id}/allocations" }
  - { priority: 21.5, category: business_fiscal, check: "shipment stock sufficiency: sum of (quantity - withdrawn_quantity) over ACTIVE placements of the batch >= shipment quantity, and ACTIVE allocations of the contract's order on this batch sum >= quantity", error_id: ERR_INSUFFICIENT_STORED_STOCK, http_status: 422, applies_to: "POST /reforestation/shipments" }
  - { priority: 22, category: business_fiscal, check: "placement quantity <= batch.plantable_count - sum(quantity over non-DISCARDED placements of the batch)", error_id: ERR_PLACEMENT_EXCEEDS_PLANTABLE, http_status: 422, applies_to: "POST /reforestation/storage-placements" }
  - { priority: 23, category: business_fiscal, check: "storage capacity: current_load + quantity <= capacity_units (equality passes)", error_id: ERR_STORAGE_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /reforestation/storage-placements" }
  - { priority: 24, category: business_fiscal, check: "crew feasibility: ceil(planned_seedlings / days) <= crew free capacity over the interval", error_id: ERR_CREW_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /reforestation/crew-assignments" }
  - { priority: 25, category: business_fiscal, check: "mark-ready requires order.allocated_quantity >= contract.required_seedlings", error_id: ERR_ORDER_UNDER_ALLOCATED, http_status: 422, applies_to: "POST /reforestation/planting-contracts/{id}/mark-ready" }
  - { priority: 26, category: business_fiscal, check: "enrollment documented_acres <= enrolled_acres", error_id: ERR_ENROLLMENT_ACRES_EXCEEDED, http_status: 422, applies_to: "POST /reforestation/cost-share-enrollments/{id}/submit" }
  - { priority: 27, category: business_fiscal, check: "cancel forbidden once any shipment of the contract exists in {DISPATCHED, DELIVERED, PLANTED}; order cancel forbidden once shipped_quantity > 0", error_id: ERR_NOT_CANCELLABLE, http_status: 409, applies_to: "POST /reforestation/planting-contracts/{id}/cancel; POST /reforestation/seedling-orders/{id}/cancel" }
  - { priority: 28, category: business_fiscal, check: "pay requires APPROVED (a PAYMENT_HELD enrollment cannot be paid)", error_id: ERR_PAYMENT_HELD, http_status: 422, applies_to: "POST /reforestation/cost-share-enrollments/{id}/pay" }

endpoints:
  - { method: POST, path: "/reforestation/_clock/set_current_utc", description: "Test-driving logical clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z (server startup default; never wall-clock). Sets the logical current UTC instant used by all date/datetime rules.", roles: [NurseryManager, ContractOfficer, ProgramAdministrator, FieldAuditor], code: 200, input: [to_iso8601], output: { current_utc: datetime }, side_effects: [] }

  - { method: POST, path: "/reforestation/landowners", description: "Register a landowner", roles: [ContractOfficer], code: 201, input: [legal_name, contact_email, tax_id, 'cost_share_eligible?'], output: Landowner, side_effects: [] }
  - { method: GET, path: "/reforestation/landowners/{id}", description: "Read one landowner; Landowner role may read only its own id", roles: [ContractOfficer, ProgramAdministrator, Landowner], code: 200, input: [], output: Landowner, side_effects: [] }

  - { method: POST, path: "/reforestation/seed-zones", description: "Create a seed collection zone", roles: [NurseryManager], code: 201, input: [zone_code, min_elevation_ft, max_elevation_ft], output: SeedZone, side_effects: ["band_midpoint_ft computed"] }
  - { method: GET, path: "/reforestation/seed-zones/{id}", description: "Read one seed zone", roles: [NurseryManager, ContractOfficer], code: 200, input: [], output: SeedZone, side_effects: [] }

  - { method: POST, path: "/reforestation/seed-lots", description: "Register a seed lot", roles: [NurseryManager], code: 201, input: [source_zone_id, species, collected_on, quantity_grams, germination_pct], output: SeedLot, side_effects: ["remaining_grams := quantity_grams"] }
  - { method: GET, path: "/reforestation/seed-lots/{id}", description: "Read one seed lot", roles: [NurseryManager, ContractOfficer], code: 200, input: [], output: SeedLot, side_effects: [] }
  - { method: GET, path: "/reforestation/seed-lots", description: "List seed lots, optionally filtered", roles: [NurseryManager, ContractOfficer], code: 200, input: ['source_zone_id?', 'species?', 'status?'], output: "SeedLot[]", side_effects: [] }
  - { method: POST, path: "/reforestation/seed-lots/{id}/quarantine", description: "Quarantine a lot after a failed germination retest", roles: [NurseryManager], code: 200, input: [], output: SeedLot, side_effects: ["status AVAILABLE -> QUARANTINED", "increments SeedLot.version by 1"] }
  - { method: POST, path: "/reforestation/seed-lots/{id}/release", description: "Release a quarantined lot with a passing retest", roles: [NurseryManager], code: 200, input: [retest_germination_pct], output: SeedLot, side_effects: ["status QUARANTINED -> AVAILABLE", "germination_pct := retest_germination_pct", "recompute projected_plantable for PLANNED batches", "increments SeedLot.version by 1"] }

  - { method: POST, path: "/reforestation/crop-batches", description: "Plan a crop batch against a seed lot (OCC on lot version)", roles: [NurseryManager], code: 201, input: [seed_lot_id, planned_sow_date, lift_window_start, lift_window_end, expected_seed_lot_version], output: CropBatch, side_effects: ["increments SeedLot.version by 1"] }
  - { method: GET, path: "/reforestation/crop-batches/{id}", description: "Read one crop batch", roles: [NurseryManager, ContractOfficer], code: 200, input: [], output: CropBatch, side_effects: [] }
  - { method: GET, path: "/reforestation/crop-batches", description: "List crop batches, optionally filtered", roles: [NurseryManager, ContractOfficer], code: 200, input: ['seed_lot_id?', 'status?'], output: "CropBatch[]", side_effects: [] }
  - { method: POST, path: "/reforestation/crop-batches/{id}/sow", description: "Record sowing; debits the lot", roles: [NurseryManager], code: 200, input: [actual_sow_date, sown_grams], output: CropBatch, side_effects: ["lot.remaining_grams -= sown_grams", "lot -> DEPLETED when remaining hits 0", "projected_plantable computed", "increments SeedLot.version by 1"] }
  - { method: POST, path: "/reforestation/crop-batches/{id}/lift", description: "Record lifting within the lift window", roles: [NurseryManager], code: 200, input: [lifted_on, lifted_count], output: CropBatch, side_effects: ["status SOWN -> LIFTED"] }
  - { method: POST, path: "/reforestation/crop-batches/{id}/grade", description: "Record grading; sets plantable/cull counts and fires CASCADE A on shortfall", roles: [NurseryManager], code: 200, input: [plantable_count], output: CropBatch, side_effects: ["status LIFTED -> GRADED", "cull_count := lifted_count - plantable_count", "CASCADE A: release latest-created ACTIVE allocations until reserved <= plantable; demote orders ALLOCATED -> CONFIRMED; demote linked contracts READY_TO_PLANT -> BLOCKED"] }

  - { method: POST, path: "/reforestation/seedling-orders", description: "Place a seedling order (lead-time rule applies); Landowner acts for self", roles: [Landowner], code: 201, input: [landowner_id, destination_zone_id, species, quantity, requested_ship_date], output: SeedlingOrder, side_effects: ["unit_price_cents and total_price_cents computed"] }
  - { method: GET, path: "/reforestation/seedling-orders/{id}", description: "Read one order; Landowner may read only its own", roles: [Landowner, ContractOfficer, NurseryManager], code: 200, input: [], output: SeedlingOrder, side_effects: [] }
  - { method: GET, path: "/reforestation/seedling-orders", description: "List orders with filters; Landowner sees only its own", roles: [Landowner, ContractOfficer, NurseryManager], code: 200, input: ['landowner_id?', 'destination_zone_id?', 'status?'], output: "SeedlingOrder[]", side_effects: [] }
  - { method: POST, path: "/reforestation/seedling-orders/{id}/confirm", description: "Confirm a pending order", roles: [ContractOfficer], code: 200, input: [], output: SeedlingOrder, side_effects: ["status PENDING_REVIEW -> CONFIRMED"] }
  - { method: POST, path: "/reforestation/seedling-orders/{id}/amend", description: "Amend quantity/ship date (OCC on order version); sends order back to PENDING_REVIEW", roles: [Landowner], code: 200, input: ['quantity?', 'requested_ship_date?', expected_seedling_order_version], output: SeedlingOrder, side_effects: ["status -> PENDING_REVIEW", "total_price_cents recomputed", "increments SeedlingOrder.version by 1"] }
  - { method: POST, path: "/reforestation/seedling-orders/{id}/cancel", description: "Cancel an order before any shipment; releases allocations", roles: [Landowner, ContractOfficer], code: 200, input: [], output: SeedlingOrder, side_effects: ["status -> CANCELLED", "ACTIVE allocations released (compensation)"] }
  - { method: POST, path: "/reforestation/seedling-orders/{id}/allocations", description: "Reserve stock from a batch for this order; SOWN/LIFTED batches reserve against projected_plantable, GRADED against plantable_count", roles: [ContractOfficer], code: 201, input: [crop_batch_id, quantity], output: Allocation, side_effects: ["order.allocated_quantity recomputed", "order auto ALLOCATED when fully covered", "batch.reserved_plantable recomputed", "increments SeedlingOrder.version by 1"] }

  - { method: GET, path: "/reforestation/allocations/{id}", description: "Read one allocation", roles: [ContractOfficer, NurseryManager], code: 200, input: [], output: Allocation, side_effects: [] }
  - { method: GET, path: "/reforestation/allocations", description: "List allocations, optionally filtered", roles: [ContractOfficer, NurseryManager], code: 200, input: ['seedling_order_id?', 'crop_batch_id?', 'status?'], output: "Allocation[]", side_effects: [] }
  - { method: POST, path: "/reforestation/allocations/{id}/release", description: "Manually release an active allocation", roles: [ContractOfficer], code: 200, input: [], output: Allocation, side_effects: ["status ACTIVE -> RELEASED", "order demoted to CONFIRMED if it drops below full allocation", "contract demotion cascade"] }

  - { method: POST, path: "/reforestation/storage-units", description: "Create a cold-storage unit", roles: [NurseryManager], code: 201, input: [unit_code, capacity_units, temp_min_c, temp_max_c], output: StorageUnit, side_effects: [] }
  - { method: GET, path: "/reforestation/storage-units/{id}", description: "Read one storage unit", roles: [NurseryManager], code: 200, input: [], output: StorageUnit, side_effects: [] }

  - { method: POST, path: "/reforestation/storage-placements", description: "Place graded stock into a unit (aggregate capacity rule)", roles: [NurseryManager], code: 201, input: [crop_batch_id, storage_unit_id, quantity, placed_on], output: StoragePlacement, side_effects: ["unit.current_load recomputed"] }
  - { method: GET, path: "/reforestation/storage-placements/{id}", description: "Read one placement", roles: [NurseryManager], code: 200, input: [], output: StoragePlacement, side_effects: [] }
  - { method: GET, path: "/reforestation/storage-placements", description: "List placements, optionally filtered", roles: [NurseryManager], code: 200, input: ['crop_batch_id?', 'storage_unit_id?', 'status?'], output: "StoragePlacement[]", side_effects: [] }
  - { method: POST, path: "/reforestation/storage-placements/{id}/discard", description: "Write off the unwithdrawn remainder (over-age or damaged stock)", roles: [NurseryManager], code: 200, input: [reason], output: StoragePlacement, side_effects: ["status ACTIVE -> DISCARDED", "unit.current_load recomputed"] }

  - { method: POST, path: "/reforestation/planting-contracts", description: "Create a planting contract with spacing spec and window", roles: [ContractOfficer], code: 201, input: [landowner_id, seedling_order_id, site_zone_id, acres, trees_per_acre, contingency_pct, planting_window_start, planting_window_end], output: PlantingContract, side_effects: ["required_seedlings computed"] }
  - { method: GET, path: "/reforestation/planting-contracts/{id}", description: "Read one contract; Landowner may read only its own", roles: [ContractOfficer, FieldAuditor, ProgramAdministrator, Landowner], code: 200, input: [], output: PlantingContract, side_effects: [] }
  - { method: GET, path: "/reforestation/planting-contracts", description: "List contracts with filters; Landowner sees only its own", roles: [ContractOfficer, FieldAuditor, ProgramAdministrator, Landowner], code: 200, input: ['landowner_id?', 'site_zone_id?', 'seedling_order_id?', 'status?'], output: "PlantingContract[]", side_effects: [] }
  - { method: POST, path: "/reforestation/planting-contracts/{id}/record-site-prep", description: "Record herbicide application (DRAFT -> SITE_PREP; also closes REPLANT_REQUIRED loop)", roles: [ContractOfficer], code: 200, input: [herbicide_applied_on], output: PlantingContract, side_effects: ["site_prep_status := RECORDED"] }
  - { method: POST, path: "/reforestation/planting-contracts/{id}/verify-site-prep", description: "FieldAuditor verifies the recorded site prep (recorder cannot verify)", roles: [FieldAuditor], code: 200, input: [], output: PlantingContract, side_effects: ["site_prep_status RECORDED -> VERIFIED"] }
  - { method: POST, path: "/reforestation/planting-contracts/{id}/mark-ready", description: "Gate SITE_PREP/BLOCKED -> READY_TO_PLANT on verified prep + full allocation", roles: [ContractOfficer], code: 200, input: [], output: PlantingContract, side_effects: [] }
  - { method: POST, path: "/reforestation/planting-contracts/{id}/start-planting", description: "Open the planting window for the crew (herbicide age + confirmed crew + window checks)", roles: [ContractOfficer], code: 200, input: [], output: PlantingContract, side_effects: ["status READY_TO_PLANT -> PLANTING"] }
  - { method: POST, path: "/reforestation/planting-contracts/{id}/complete-planting", description: "Record planted quantity (initial planting: >= acres * trees_per_acre; replant cycle: >= owed_quantity of the driving obligation); auto-completes confirmed crews", roles: [ContractOfficer], code: 200, input: [planted_qty], output: PlantingContract, side_effects: ["planted_quantity += planted_qty", "last_planted_on := current date", "CONFIRMED assignments -> COMPLETED"] }
  - { method: POST, path: "/reforestation/planting-contracts/{id}/cancel", description: "Cancel before any shipment; releases crew assignments", roles: [ContractOfficer], code: 200, input: [], output: PlantingContract, side_effects: ["assignments in {SCHEDULED, CONFIRMED} -> RELEASED"] }

  - { method: POST, path: "/reforestation/crews", description: "Register a planting crew", roles: [ContractOfficer], code: 201, input: [crew_code, capacity_per_day, 'active?'], output: Crew, side_effects: [] }
  - { method: GET, path: "/reforestation/crews/{id}", description: "Read one crew", roles: [ContractOfficer], code: 200, input: [], output: Crew, side_effects: [] }

  - { method: POST, path: "/reforestation/crew-assignments", description: "Schedule a crew onto a contract (overlap + capacity rules)", roles: [ContractOfficer], code: 201, input: [crew_id, planting_contract_id, start_date, end_date, planned_seedlings], output: CrewAssignment, side_effects: ["crew daily load recomputed"] }
  - { method: GET, path: "/reforestation/crew-assignments/{id}", description: "Read one assignment", roles: [ContractOfficer], code: 200, input: [], output: CrewAssignment, side_effects: [] }
  - { method: GET, path: "/reforestation/crew-assignments", description: "List assignments, optionally filtered", roles: [ContractOfficer], code: 200, input: ['crew_id?', 'planting_contract_id?', 'status?'], output: "CrewAssignment[]", side_effects: [] }
  - { method: POST, path: "/reforestation/crew-assignments/{id}/confirm", description: "Confirm a scheduled assignment", roles: [ContractOfficer], code: 200, input: [], output: CrewAssignment, side_effects: [] }
  - { method: POST, path: "/reforestation/crew-assignments/{id}/release", description: "Release an assignment, restoring crew capacity", roles: [ContractOfficer], code: 200, input: [], output: CrewAssignment, side_effects: ["crew daily load recomputed"] }

  - { method: POST, path: "/reforestation/shipments", description: "Dispatch seedlings from cold storage to a contract site. Cross-entity state gate: contract.status must be READY_TO_PLANT or PLANTING (else ERR_INVALID_STATE). Withdraws from placements oldest-first (placed_on ASC, created_at ASC tie-break)", roles: [NurseryManager], code: 201, input: [planting_contract_id, crop_batch_id, quantity], output: Shipment, side_effects: ["dispatched_at := logical clock; handling_deadline := +72h", "withdrawal from ACTIVE placements oldest-first; placement auto-WITHDRAWN at zero", "order.shipped_quantity += quantity", "order auto FULFILLED when shipped >= quantity"] }
  - { method: GET, path: "/reforestation/shipments/{id}", description: "Read one shipment", roles: [NurseryManager, ContractOfficer, FieldAuditor], code: 200, input: [], output: Shipment, side_effects: [] }
  - { method: GET, path: "/reforestation/shipments", description: "List shipments, optionally filtered", roles: [NurseryManager, ContractOfficer, FieldAuditor], code: 200, input: ['planting_contract_id?', 'crop_batch_id?', 'status?'], output: "Shipment[]", side_effects: [] }
  - { method: POST, path: "/reforestation/shipments/{id}/deliver", description: "Record delivery at the site", roles: [NurseryManager], code: 200, input: [delivered_at], output: Shipment, side_effects: ["status DISPATCHED -> DELIVERED"] }
  - { method: POST, path: "/reforestation/shipments/{id}/confirm-planted", description: "Confirm seedlings in the ground within the handling window; contract must be PLANTING", roles: [ContractOfficer], code: 200, input: [planted_confirmed_at], output: Shipment, side_effects: ["status DELIVERED -> PLANTED"] }
  - { method: POST, path: "/reforestation/shipments/{id}/report-spoilage", description: "FieldAuditor writes off a shipment (temperature excursion, window expiry, handling damage)", roles: [FieldAuditor], code: 200, input: [reason], output: Shipment, side_effects: ["status -> SPOILED", "order.shipped_quantity -= quantity"] }

  - { method: POST, path: "/reforestation/survival-surveys", description: "Record a survival survey; fires threshold variant, replant obligation, and CASCADE B", roles: [FieldAuditor], code: 201, input: [planting_contract_id, surveyed_on, alive_count], output: SurvivalSurvey, side_effects: ["planted_count_snapshot := contract.planted_quantity", "survival_pct / threshold_pct / below_threshold / owed_quantity computed", "contract PLANTED -> SURVEYED -> CLOSED or REPLANT_REQUIRED", "CASCADE B on below_threshold: contract crews released, landowner enrollment APPROVED -> PAYMENT_HELD"] }
  - { method: GET, path: "/reforestation/survival-surveys/{id}", description: "Read one survey", roles: [FieldAuditor, ContractOfficer, ProgramAdministrator], code: 200, input: [], output: SurvivalSurvey, side_effects: [] }
  - { method: GET, path: "/reforestation/survival-surveys", description: "List surveys, optionally filtered", roles: [FieldAuditor, ContractOfficer, ProgramAdministrator], code: 200, input: ['planting_contract_id?'], output: "SurvivalSurvey[]", side_effects: [] }
  - { method: POST, path: "/reforestation/survival-surveys/{id}/schedule-replant", description: "Schedule the replant obligation", roles: [ContractOfficer], code: 200, input: [replant_date], output: SurvivalSurvey, side_effects: ["obligation_status OPEN -> SCHEDULED"] }
  - { method: POST, path: "/reforestation/survival-surveys/{id}/reopen-replant", description: "Send a scheduled obligation back to OPEN for rescheduling", roles: [ContractOfficer], code: 200, input: [], output: SurvivalSurvey, side_effects: ["obligation_status SCHEDULED -> OPEN", "replant_date cleared"] }
  - { method: POST, path: "/reforestation/survival-surveys/{id}/fulfill-replant", description: "Close the obligation after a completed replant cycle; releases payment hold", roles: [ContractOfficer], code: 200, input: [], output: SurvivalSurvey, side_effects: ["obligation_status SCHEDULED -> FULFILLED", "enrollment PAYMENT_HELD -> APPROVED when no obligations remain"] }
  - { method: POST, path: "/reforestation/survival-surveys/{id}/waive-replant", description: "Waive the obligation (ProgramAdministrator only; waiver_reason required)", roles: [ProgramAdministrator], code: 200, input: [waiver_reason], output: SurvivalSurvey, side_effects: ["obligation_status OPEN -> WAIVED", "enrollment PAYMENT_HELD -> APPROVED when no obligations remain"] }

  - { method: POST, path: "/reforestation/cost-share-enrollments", description: "Enroll a landowner in a cost-share program", roles: [Landowner], code: 201, input: [landowner_id, program_code, enrolled_acres, rate_per_acre_cents, cap_cents], output: CostShareEnrollment, side_effects: ["provisional_award_cents computed from enrolled_acres"] }
  - { method: GET, path: "/reforestation/cost-share-enrollments/{id}", description: "Read one enrollment; Landowner may read only its own", roles: [Landowner, ProgramAdministrator], code: 200, input: [], output: CostShareEnrollment, side_effects: [] }
  - { method: GET, path: "/reforestation/cost-share-enrollments", description: "List enrollments; Landowner sees only its own", roles: [Landowner, ProgramAdministrator], code: 200, input: ['landowner_id?', 'status?'], output: "CostShareEnrollment[]", side_effects: [] }
  - { method: POST, path: "/reforestation/cost-share-enrollments/{id}/submit", description: "Submit practice documentation (documented acres/cost)", roles: [Landowner], code: 200, input: [documented_acres, documented_cost_cents], output: CostShareEnrollment, side_effects: ["status DRAFT -> UNDER_REVIEW", "provisional_award_cents recomputed"] }
  - { method: POST, path: "/reforestation/cost-share-enrollments/{id}/approve", description: "Approve and fix the final award", roles: [ProgramAdministrator], code: 200, input: [], output: CostShareEnrollment, side_effects: ["final_award_cents computed (final variant)"] }
  - { method: POST, path: "/reforestation/cost-share-enrollments/{id}/return-for-correction", description: "Return documentation to the landowner (review loop)", roles: [ProgramAdministrator], code: 200, input: [reason], output: CostShareEnrollment, side_effects: ["status UNDER_REVIEW -> DRAFT"] }
  - { method: POST, path: "/reforestation/cost-share-enrollments/{id}/pay", description: "Disburse the final award (blocked while PAYMENT_HELD)", roles: [ProgramAdministrator], code: 200, input: [], output: CostShareEnrollment, side_effects: ["paid_cents := final_award_cents", "status -> PAID"] }

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID, or entity_backed role id not resolvable" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "role not in endpoint role list, or Landowner touching another landowner's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path or body reference does not resolve" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "state-machine from-state forbids the requested transition" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, wrong type, or unknown enum value" }
  - { id: ERR_WINDOW_INVERTED, http: 400, condition: "end <= start, lift window inverted, or elevation bounds unordered" }
  - { id: ERR_LOT_QUARANTINED, http: 422, condition: "sow/allocate/ship attempted against a QUARANTINED lot" }
  - { id: ERR_SITE_PREP_NOT_VERIFIED, http: 422, condition: "mark-ready without VERIFIED site prep, or verify attempted by the recording role" }
  - { id: ERR_SITE_PREP_WINDOW_INVALID, http: 422, condition: "herbicide age outside [14, 120] days at start-planting" }
  - { id: ERR_LEAD_TIME_INSUFFICIENT, http: 422, condition: "requested_ship_date - current date < LEAD_DAYS for the species category" }
  - { id: ERR_SURVEY_WINDOW_INVALID, http: 422, condition: "surveyed_on outside [last_planted_on + 300, last_planted_on + 400]" }
  - { id: ERR_HANDLING_WINDOW_EXCEEDED, http: 422, condition: "planted_confirmed_at later than dispatched_at + 72h" }
  - { id: ERR_STOCK_AGE_EXCEEDED, http: 422, condition: "shipment touches an ACTIVE placement older than 45 days" }
  - { id: ERR_LIFT_WINDOW_INVALID, http: 422, condition: "lifted_on outside [lift_window_start, lift_window_end]" }
  - { id: ERR_SPECIES_ZONE_MISMATCH, http: 422, condition: "species mismatch or elevation band midpoints more than 500 ft apart" }
  - { id: ERR_CREW_OVERLAP, http: 409, condition: "crew interval intersects another SCHEDULED/CONFIRMED assignment (with cross-contract 1-day buffer rule)" }
  - { id: ERR_SPACING_SPEC_INVALID, http: 422, condition: "trees_per_acre outside [200, 800]" }
  - { id: ERR_BATCH_NOT_GRADED, http: 422, condition: "allocation or shipment references a batch not in GRADED" }
  - { id: ERR_PLANTING_QUANTITY_SHORT, http: 422, condition: "complete-planting quantity below the acres*TPA floor (initial) or owed_quantity floor (replant)" }
  - { id: ERR_INSUFFICIENT_STORED_STOCK, http: 422, condition: "shipment exceeds stored unwithdrawn stock of the batch or the order's active allocations on it" }
  - { id: ERR_ALLOCATION_EXCEEDS_AVAILABLE, http: 422, condition: "allocation exceeds order remainder or batch unreserved plantable" }
  - { id: ERR_PLACEMENT_EXCEEDS_PLANTABLE, http: 422, condition: "placement exceeds the batch's unplaced plantable remainder" }
  - { id: ERR_STORAGE_CAPACITY_EXCEEDED, http: 422, condition: "placement would push unit current_load above capacity_units" }
  - { id: ERR_CREW_CAPACITY_EXCEEDED, http: 422, condition: "ceil(planned_seedlings/days) exceeds crew free capacity over the interval" }
  - { id: ERR_ORDER_UNDER_ALLOCATED, http: 422, condition: "mark-ready with order.allocated_quantity < contract.required_seedlings" }
  - { id: ERR_ENROLLMENT_ACRES_EXCEEDED, http: 422, condition: "documented_acres > enrolled_acres at submit" }
  - { id: ERR_NOT_CANCELLABLE, http: 409, condition: "cancel after a shipment exists (contract) or after shipped_quantity > 0 (order)" }
  - { id: ERR_PAYMENT_HELD, http: 422, condition: "pay attempted while enrollment is PAYMENT_HELD" }

roles:
  - name: NurseryManager
    description: "State nursery operator: zones, lots, crop batches, cold storage, dispatch"
    identity: opaque
    exclusive_operations: [seed-zone create, seed-lot create/quarantine/release, crop-batch create/sow/lift/grade, storage-unit create, storage-placement create/discard, shipment create/deliver]
    shared_operations: [read orders/allocations/batches/shipments]
  - name: ContractOfficer
    description: "Reforestation contract administrator: orders confirmation, contracts, crews, replant scheduling"
    identity: opaque
    exclusive_operations: [landowner create, order confirm/cancel, allocation create/release, contract create and all contract actions except verify-site-prep, crew and assignment management, shipment confirm-planted, replant schedule/reopen/fulfill]
    shared_operations: [read lots/batches/shipments/surveys]
  - name: FieldAuditor
    description: "Independent field verifier: site-prep verification, survival surveys, spoilage reports"
    identity: opaque
    exclusive_operations: [verify-site-prep, survival-survey create, shipment report-spoilage]
    shared_operations: [read contracts/shipments/surveys]
  - name: ProgramAdministrator
    description: "Cost-share program authority: enrollment review/approval/payment, replant waivers"
    identity: opaque
    exclusive_operations: [enrollment approve/return-for-correction/pay, replant waive]
    shared_operations: [read contracts/surveys/enrollments/landowners]
  - name: Landowner
    description: "External landowner: places and amends own seedling orders, enrolls in cost-share, submits documentation"
    identity: entity_backed:Landowner
    exclusive_operations: [seedling-order create/amend, cost-share-enrollment create/submit]
    shared_operations: [order cancel (with ContractOfficer), read own orders/contracts/enrollments]
