              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-07-12T09:00:00Z", window_end: "2026-07-12T10:00:00Z", expected_job_version: "${job_vacc}" }
              as: Dispatcher
              captures: { disp_id: $.data.id }
