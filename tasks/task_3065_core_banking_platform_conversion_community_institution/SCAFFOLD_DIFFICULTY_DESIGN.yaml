  - rule_id: compensating_invariant
    instances:

      - name: account_exception_cycle_conserves_gl_expected
        grounds:
          - state_machines.Account.MAPPED_to_EXCEPTION
          - state_machines.Account.EXCEPTION_to_CLEARED
          - calculations.gl_variance
        distinguishing_aspect: |
          Conserved quantity 1: the GL expected-balance sum. flag-exception
          (forward) and clear-exception (compensating) both keep the account
          inside gl_variance's input set {MAPPED, EXCEPTION, CLEARED,
          CONVERTED}, so GLAccount.expected_balance_cents is invariant across
          the round trip: before == during == after == 1000000.
        test_recipe:
          setup:
            - "Project MOCK_CONVERSION; account L-9001 principal 1000000 MAPPED to GL-1000 (expected 1000000)."
          setup_api_calls:
            - call: "POST /api/v1/conversions"
              payload: { institution_name: "First Community Bank", incumbent_core_name: "LegacyCore", target_core_name: "Fiserv DNA" }
              as: ProjectManager
              as_user_id: "pm-alice"
              captures: { proj_id: $.data.id }
