# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — task 1879 cardiac cath lab scheduling
# §1.9 Coverage Index: every testable non-Difficulty claim of §1.1–§1.7.
# Sections/claim_types follow references/claim-extraction-guide.md.
# Names are unique across this file and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_room_with_defaults_returns_201
        claim_type: creation
        grounds: ["entities.CathLabRoom", "endpoints.POST_/cath-lab/rooms"]
        distinguishing_aspect: "POST /cath-lab/rooms with only room_name succeeds with 201; status defaults to ACTIVE and equipment_profile to []."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1" }
              as: CathLabScheduler
              captures: { room_id: $.data.id, room_status: $.data.status, room_equip: $.data.equipment_profile }
          assert:
            - "Response code 201; CathLabRoom.${room_id}.status == ACTIVE"
            - "CathLabRoom.${room_id}.equipment_profile == [] (default applied)"

      - name: create_staff_applies_field_defaults
        claim_type: defaults
        grounds: ["entities.StaffMember.fields.credentials", "entities.StaffMember.fields.is_active"]
        distinguishing_aspect: "Omitting credentials and is_active yields credentials == [] and is_active == true."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Tech One", staff_role: SCRUB_TECHNOLOGIST }
              as: CathLabScheduler
              captures: { staff_id: $.data.id, creds: $.data.credentials, active: $.data.is_active }
          assert:
            - "StaffMember.${staff_id}.credentials == []"
            - "StaffMember.${staff_id}.is_active == true"

      - name: case_contrast_limit_cap_and_uncapped_values
        claim_type: computed
        grounds: ["calculations.contrast_limit_ml", "entities.CathCase.fields.contrast_limit_ml"]
        distinguishing_aspect: "contrast_limit_ml is system-computed: 60kg/1.5 -> 200.0 (uncapped); 80kg/1.0 -> raw 400 capped to 300.0."
        test_recipe:
          setup: ["One cardiologist exists"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
          trigger:
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 60, serum_creatinine: 1.5 }
              as: CathLabScheduler
              captures: { c1_limit: $.data.contrast_limit_ml }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-2", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 80, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { c2_limit: $.data.contrast_limit_ml }
          assert:
            - "Case 1 contrast_limit_ml == 200.0 (5.0 * 60 / 1.5)"
            - "Case 2 contrast_limit_ml == 300.0 (raw 400.0 capped at CONTRAST_CAP_ML)"

      - name: system_fields_server_generated_on_create
        claim_type: system_fields
        grounds: ["entities.CathLabRoom"]
        distinguishing_aspect: "id, created_at, updated_at, version are server-generated: version starts at 1 and created_at == updated_at at creation."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [IVUS] }
              as: CathLabScheduler
              captures: { room_id: $.data.id, room_v: $.data.version, room_created: $.data.created_at, room_updated: $.data.updated_at }
          assert:
            - "id is a server-minted UUID (no type prefix)"
            - "version == 1; created_at == updated_at; both ISO8601 UTC with three fractional digits"

      - name: get_case_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CASE_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent case UUID returns 404 ERR_CASE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /cath-lab/cases/11111111-2222-3333-4444-555555555555"
              as: CathLabScheduler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_CASE_NOT_FOUND"

      - name: get_device_lot_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_LOT_NOT_FOUND]"]
        distinguishing_aspect: "GET /cath-lab/device-lots/{unknown} returns ERR_LOT_NOT_FOUND (distinct resource error from ERR_CASE_NOT_FOUND)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /cath-lab/device-lots/11111111-2222-3333-4444-555555555555"
              as: CathLabTechnologist
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_LOT_NOT_FOUND"

      - name: create_case_missing_required_patient_mrn_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input patient_mrn is rejected ERR_INVALID_REQUEST (400) before any state/business checks."
        test_recipe:
          setup: ["One cardiologist exists"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
          trigger:
            - call: "POST /cath-lab/cases"
              payload: { procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; error_id == ERR_INVALID_REQUEST"

      - name: create_case_invalid_procedure_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=4]", "entities.CathCase.fields.procedure_type"]
        distinguishing_aspect: "procedure_type outside {DIAGNOSTIC_CATHETERIZATION, PCI, STEMI_PCI, DEVICE_IMPLANT, EP_STUDY} is rejected ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One cardiologist exists"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
          trigger:
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: ANGIOPLASTY_BAD, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; error_id == ERR_INVALID_REQUEST"

      - name: create_case_zero_weight_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=4]", "entities.CathCase.fields.weight_kg"]
        distinguishing_aspect: "weight_kg == 0 violates the > 0 range rule and is rejected ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One cardiologist exists"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
          trigger:
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 0, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; error_id == ERR_INVALID_REQUEST"

      - name: stemi_create_missing_scheduled_start_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=4]", "endpoints.POST_/cath-lab/cases"]
        distinguishing_aspect: "priority STEMI without scheduled_start fails the conditional requirement (ERR_INVALID_REQUEST); no case is persisted."
        test_recipe:
          setup: ["One cardiologist and one ACTIVE room exist"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
          trigger:
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-S", procedure_type: STEMI_PCI, priority: STEMI, performing_physician_id: "${phys1_id}", weight_kg: 80, serum_creatinine: 1.1 }
              as: CathLabScheduler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; error_id == ERR_INVALID_REQUEST"
            - "GET /cath-lab/cases returns total_count == 0 (nothing persisted)"

      - name: list_cases_pagination_envelope_and_defaults
        claim_type: listing
        grounds: ["response_envelope", "endpoints.GET_/cath-lab/cases"]
        distinguishing_aspect: "List responses carry limit/offset/total_count/has_more; limit=2 over 3 cases yields has_more true then false at offset 2; default limit is 10."
        test_recipe:
          setup: ["One cardiologist; three POSTED cases exist"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-2", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-3", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
          trigger:
            - call: "GET /cath-lab/cases"
              payload: { limit: 2, offset: 0 }
              as: CathLabScheduler
            - call: "GET /cath-lab/cases"
              payload: { limit: 2, offset: 2 }
              as: CathLabScheduler
          assert:
            - "First page: 2 items, total_count == 3, has_more == true"
            - "Second page (offset 2): 1 item, total_count == 3, has_more == false"
            - "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type, data"

      - name: list_device_lots_filter_by_status
        claim_type: listing
        grounds: ["endpoints.GET_/cath-lab/device-lots", "calculations.device_lot_status"]
        distinguishing_aspect: "The status filter returns only matching lots: LOW_STOCK filter excludes the ACTIVE lot."
        test_recipe:
          setup: ["Lot A qty 3 threshold 3 (ACTIVE: 3 >= 3); lot B qty 1 threshold 2 (LOW_STOCK: 0 < 1 < 2)"]
          setup_api_calls:
            - call: "POST /cath-lab/device-lots"
              payload: { device_type: STENT_DES, manufacturer: "Acme", model_number: "DS-100", lot_number: "LOT-A", ownership: OWNED, quantity_on_hand: 3, reorder_threshold: 3, expiration_date: "2027-01-01T00:00:00Z" }
              as: CathLabTechnologist
              captures: { lot_a_id: $.data.id }
            - call: "POST /cath-lab/device-lots"
              payload: { device_type: STENT_BMS, manufacturer: "Acme", model_number: "BS-1", lot_number: "LOT-B", ownership: CONSIGNMENT, quantity_on_hand: 1, reorder_threshold: 2, expiration_date: "2027-01-01T00:00:00Z" }
              as: CathLabTechnologist
              captures: { lot_b_id: $.data.id, lot_b_status: $.data.status }
          trigger:
            - call: "GET /cath-lab/device-lots"
              payload: { status: LOW_STOCK }
              as: CathLabTechnologist
          assert:
            - "Filtered list contains exactly lot ${lot_b_id} (total_count == 1)"
            - "DeviceLot.${lot_b_id}.status == LOW_STOCK at creation (derived: 0 < available 1 < threshold 2)"

      - name: create_case_with_unknown_performing_physician_returns_not_found
        claim_type: fk_integrity
        grounds: ["validations[priority=3]", "entities.CathCase.fields.performing_physician_id", "errors[ERR_STAFF_NOT_FOUND]"]
        distinguishing_aspect: "A body FK (performing_physician_id) referencing a nonexistent StaffMember is rejected ERR_STAFF_NOT_FOUND at existence priority."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "11111111-2222-3333-4444-555555555555", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_STAFF_NOT_FOUND"

      - name: schedule_with_unknown_lab_id_returns_not_found
        claim_type: fk_integrity
        grounds: ["validations[priority=3]", "errors[ERR_ROOM_NOT_FOUND]"]
        distinguishing_aspect: "Schedule body lab_id referencing a nonexistent room is rejected ERR_ROOM_NOT_FOUND before state checks."
        test_recipe:
          setup: ["One cardiologist; one POSTED URGENT case"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "11111111-2222-3333-4444-555555555555", scheduled_start: "2026-08-10T09:00:00Z" }
              as: CathLabScheduler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_ROOM_NOT_FOUND"
            - "CathCase.${case_id}.status remains POSTED"

  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: case_created_initial_state_posted
        claim_type: initial_state
        grounds: ["state_machines.CathCase"]
        distinguishing_aspect: "A non-STEMI case starts in POSTED with lab_id/scheduled_start null and bump_count 0."
        test_recipe:
          setup: ["One cardiologist"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
          trigger:
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: EP_STUDY, priority: ELECTIVE, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id, st: $.data.status, lab: $.data.lab_id, bumps: $.data.bump_count }
          assert:
            - "status == POSTED; lab_id == null; scheduled_start == null; bump_count == 0"

      - name: stemi_case_created_directly_scheduled
        claim_type: initial_state
        grounds: ["state_machines.CathCase.POSTED_to_SCHEDULED", "calculations.bump_room_selector"]
        distinguishing_aspect: "A STEMI case is auto-scheduled at creation: status SCHEDULED, lab_id set, scheduled_end == scheduled_start + 75 min (STEMI_PCI, setup 0)."
        test_recipe:
          setup: ["One cardiologist; one ACTIVE room; one AVAILABLE bed"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
          trigger:
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-S", procedure_type: STEMI_PCI, priority: STEMI, performing_physician_id: "${phys1_id}", weight_kg: 80, serum_creatinine: 1.1, scheduled_start: "2026-08-10T09:00:00Z" }
              as: CathLabScheduler
              captures: { case_id: $.data.id, st: $.data.status, lab: $.data.lab_id, end: $.data.scheduled_end }
          assert:
            - "status == SCHEDULED; lab_id == ${room1_id}"
            - "scheduled_end == 2026-08-10T10:15:00Z (75 base + 0 setup)"
            - "RecoveryBed.${bed1_id}.status == RESERVED with held_case_id == ${case_id}"

      - name: cancel_completed_case_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.CathCase", "errors[ERR_CASE_INVALID_STATE]"]
        distinguishing_aspect: "COMPLETED is terminal: cancel after completion is rejected ERR_CASE_INVALID_STATE."
        test_recipe:
          setup: ["URGENT case C fully staffed and COMPLETED"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Tech One", staff_role: SCRUB_TECHNOLOGIST }
              as: CathLabScheduler
              captures: { tech1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Nurse One", staff_role: CIRCULATING_NURSE }
              as: CathLabScheduler
              captures: { nurse1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/staff-assignments"
              payload: { staff_id: "${tech1_id}", role_in_case: SCRUB }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/staff-assignments"
              payload: { staff_id: "${nurse1_id}", role_in_case: CIRCULATOR }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/start"
              as: InterventionalCardiologist
              as_user_id: "${phys1_id}"
            - call: "POST /cath-lab/cases/${case_id}/complete"
              as: InterventionalCardiologist
              as_user_id: "${phys1_id}"
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/cancel"
              as: CathLabScheduler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_CASE_INVALID_STATE"
            - "CathCase.${case_id}.status remains COMPLETED"

      - name: double_release_assignment_returns_invalid_state
        claim_type: idempotency
        grounds: ["state_machines.StaffAssignment", "errors[ERR_ASSIGNMENT_INVALID_STATE]"]
        distinguishing_aspect: "Releasing an already-RELEASED assignment is rejected ERR_ASSIGNMENT_INVALID_STATE (no silent no-op)."
        test_recipe:
          setup: ["URGENT case SCHEDULED with SCRUB assignment A"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Tech One", staff_role: SCRUB_TECHNOLOGIST }
              as: CathLabScheduler
              captures: { tech1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/staff-assignments"
              payload: { staff_id: "${tech1_id}", role_in_case: SCRUB }
              as: CathLabScheduler
              captures: { asg_id: $.data.id }
            - call: "POST /cath-lab/staff-assignments/${asg_id}/release"
              as: CathLabScheduler
          trigger:
            - call: "POST /cath-lab/staff-assignments/${asg_id}/release"
              as: CathLabScheduler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_ASSIGNMENT_INVALID_STATE"
            - "StaffAssignment.${asg_id}.status remains RELEASED"
      - name: record_decision_on_accepted_submission_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.RegistrySubmission", "errors[ERR_SUBMISSION_INVALID_STATE]"]
        distinguishing_aspect: "ACCEPTED is terminal: a second record-decision is rejected ERR_SUBMISSION_INVALID_STATE."
        test_recipe:
          setup:
            - "URGENT PCI case COMPLETED at logical 2026-08-10T10:30:00Z with one ACTIVE RADIATION record (completeness 100.0)"
            - "RegistrySubmission X SUBMITTED then record-decision ACCEPTED"
          setup_api_calls:
            - call: "POST /cath-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: CathLabScheduler
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Tech One", staff_role: SCRUB_TECHNOLOGIST }
              as: CathLabScheduler
              captures: { tech1_id: $.data.id }
            - call: "POST /cath-lab/staff"
