      - name: program_creation_rejects_a_short_mix_an_out_of_bounds_component_and_a_past_meeting_date
        claim_type: triggerability
        grounds:
          - errors[ERR_PAY_MIX_MUST_TOTAL_100]
          - errors[ERR_MIX_COMPONENT_OUT_OF_BOUNDS]
          - errors[ERR_MEETING_DATE_NOT_FUTURE]
          - validations.priority_37_ERR_MEETING_DATE_NOT_FUTURE
          - validations.priority_38_ERR_PAY_MIX_MUST_TOTAL_100
          - validations.priority_39_ERR_MIX_COMPONENT_OUT_OF_BOUNDS
          - calculations.target_total_direct_comp
        distinguishing_aspect: |
          The three creation-time design rules are isolated one at a time so each error is provably its own:
          20.00/25.00/50.00 sums to 95.00 and fails the total rule while every component is in bounds;
          2.00/18.00/80.00 sums to exactly 100.00 yet the 2.00 salary leg is under the 5.00 floor; and a
          2026-07-01 meeting date is in the past for the pinned 2026-08-01 clock while its mix is perfectly legal.
        test_recipe:
          setup:
            - "MINI fixture with an APPROVED one-peer group and the logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
