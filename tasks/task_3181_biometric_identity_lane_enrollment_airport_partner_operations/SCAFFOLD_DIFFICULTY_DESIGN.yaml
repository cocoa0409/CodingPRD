      - name: family_slots_used_invariant_add_remove_cancel
        grounds:
          - entities.FamilyGroup.fields.slots_used
          - state_machines.FamilyGroup.ACTIVE_to_DISSOLVED
          - state_machines.Subscription
        distinguishing_aspect: |
          Conserved quantity: FamilyGroup.slots_used always equals the number
          of members with family_group_id == group.id. Pinned formula:
          slots_used == 1 + (adds) - (removals), and subscription cancel
          dissolves the group driving slots_used to 0 with all members
          detached — forward actions and their compensating actions leave the
          relation exact, never drifting.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Primary P ACTIVE with FAMILY subscription; dependants D1, D2 ACTIVE."
          setup_api_calls:
            - call: "POST /airports"
              payload: { iata_code: "MSP", name: "Minneapolis St Paul", city: "Minneapolis", state_code: "MN" }
              as: OpsAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /partner-agreements"
              payload: { airport_id: "${ap_id}", rev_share_rate: 0.10, subscription_share_rate: 0.02, monthly_minimum_cents: 10000, federal_integration: false, staffing_footprint_seats: 4, term_months: 12, effective_from: "2026-09-01T00:00:00Z" }
              as: PartnerManager
              captures: { agr_id: $.data.id }
            - call: "POST /partner-agreements/${agr_id}/activate"
              payload: {}
              as: PartnerManager
            - call: "POST /enrollment-centers"
              payload: { airport_id: "${ap_id}", name: "MSP Center", ambassador_capacity: 6 }
              as: OpsAdmin
              captures: { ec_id: $.data.id }
            - call: "POST /members/register"
              payload: { email: "p@x.com", full_name: "Pri P", date_of_birth: "1980-01-01" }
              as: Member
              captures: { mp: $.data.id }
            - call: "POST /enrollments"
              payload: { member_id: "${mp}", site_type: "ENROLLMENT_CENTER", site_id: "${ec_id}", document_type: "PASSPORT", document_number: "PM000001", document_expiry: "2030-01-01", biometric_capture_ok: true }
              as: Member
              as_user_id: "${mp}"
              captures: { ep: $.data.id }
            - call: "POST /enrollments/${ep}/submit-document"
              payload: {}
              as: Member
              as_user_id: "${mp}"
            - call: "POST /enrollments/${ep}/capture-biometric"
              payload: {}
              as: Member
              as_user_id: "${mp}"
            - call: "POST /enrollments/${ep}/complete"
              payload: {}
              as: Member
              as_user_id: "${mp}"
            - call: "POST /subscriptions"
              payload: { member_id: "${mp}", plan: "FAMILY", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${mp}"
              captures: { sub_id: $.data.id }
            - call: "GET /family-groups"
              payload: { primary_subscription_id: "${sub_id}" }
              as: Member
              as_user_id: "${mp}"
              captures: { fg_id: "$.data[0].id", used0: "$.data[0].slots_used" }
            - call: "POST /members/register"
              payload: { email: "d1@x.com", full_name: "Dep One", date_of_birth: "1982-01-01" }
              as: Member
              captures: { md1: $.data.id }
            - call: "POST /enrollments"
              payload: { member_id: "${md1}", site_type: "ENROLLMENT_CENTER", site_id: "${ec_id}", document_type: "PASSPORT", document_number: "PM000002", document_expiry: "2030-01-01", biometric_capture_ok: true }
              as: Member
              as_user_id: "${md1}"
              captures: { ed1: $.data.id }
            - call: "POST /enrollments/${ed1}/submit-document"
              payload: {}
              as: Member
              as_user_id: "${md1}"
            - call: "POST /enrollments/${ed1}/capture-biometric"
              payload: {}
              as: Member
              as_user_id: "${md1}"
            - call: "POST /enrollments/${ed1}/complete"
              payload: {}
              as: Member
              as_user_id: "${md1}"
            - call: "POST /members/register"
              payload: { email: "d2@x.com", full_name: "Dep Two", date_of_birth: "1984-01-01" }
              as: Member
              captures: { md2: $.data.id }
            - call: "POST /enrollments"
              payload: { member_id: "${md2}", site_type: "ENROLLMENT_CENTER", site_id: "${ec_id}", document_type: "PASSPORT", document_number: "PM000003", document_expiry: "2030-01-01", biometric_capture_ok: true }
              as: Member
              as_user_id: "${md2}"
              captures: { ed2: $.data.id }
            - call: "POST /enrollments/${ed2}/submit-document"
              payload: {}
              as: Member
              as_user_id: "${md2}"
            - call: "POST /enrollments/${ed2}/capture-biometric"
              payload: {}
              as: Member
              as_user_id: "${md2}"
            - call: "POST /enrollments/${ed2}/complete"
              payload: {}
              as: Member
              as_user_id: "${md2}"
          trigger:
            - call: "POST /family-groups/${fg_id}/members"
              payload: { member_id: "${md1}" }
              as: Member
              as_user_id: "${mp}"
              captures: { used1: $.data.slots_used }
            - call: "POST /family-groups/${fg_id}/members"
              payload: { member_id: "${md2}" }
              as: Member
              as_user_id: "${mp}"
              captures: { used2: $.data.slots_used }
            - call: "DELETE /family-groups/${fg_id}/members/${md1}"
              payload: {}
              as: Member
              as_user_id: "${mp}"
              captures: { used3: $.data.slots_used }
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mp}"
            - call: "GET /family-groups/${fg_id}"
              payload: {}
              as: OpsAdmin
              captures: { used_final: $.data.slots_used, fg_status: $.data.status }
            - call: "GET /members/${md2}"
              payload: {}
              as: OpsAdmin
              captures: { d2_group: $.data.family_group_id }
          assert:
            - "${used0} == 1 (primary occupies a slot at group creation)"
            - "${used1} == 2 and ${used2} == 3 after the two adds"
            - "${used3} == 2 after the compensating removal (add/remove pair leaves the count exact)"
            - "${used_final} == 0 and ${fg_status} == DISSOLVED after subscription cancel"
            - "${d2_group} is null (cancellation detached the remaining dependant)"
