              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${hold_id}", month: "2026-09", level_units: 500, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${ok_id}", month: "2026-09", level_units: 500, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
