scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: organization_create_applies_system_defaults
        claim_type: defaults
        grounds: ["entities.Organization"]
        distinguishing_aspect: "A fresh Organization is born ACTIVE/CLEAR with every derived counter at 0 and version 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-0001", name: "Dealer Zero", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org: $.data.id, st: $.data.status, post: $.data.compliance_posture, lrc: $.data.late_report_count, ppt: $.data.published_par_total, apc: $.data.active_professional_count, ver: $.data.version }
          trigger: []
          assert:
            - "${st} == ACTIVE"
            - "${post} == CLEAR"
            - "${lrc} == 0"
            - "${ppt} == 0"
            - "${apc} == 0"
            - "${ver} == 1"
      - name: organization_missing_org_type_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Organization.fields.org_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required org_type field is a schema error ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-0002", name: "No Type Dealer" }
              as: PortalOperator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
      - name: organization_invalid_org_type_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.Organization.fields.org_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An org_type outside {ISSUER, OBLIGATED_PERSON, BROKER_DEALER, MUNICIPAL_ADVISOR} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-0003", name: "Fund", org_type: "HEDGE_FUND" }
              as: PortalOperator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
      - name: organization_computed_fields_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Organization.fields.late_report_count", "entities.Organization.fields.compliance_posture"]
        distinguishing_aspect: "Client-supplied computed fields are silently ignored: posting late_report_count 99 and compliance_posture WATCH still yields 0 / CLEAR."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-0004", name: "Sneaky Dealer", org_type: "BROKER_DEALER", late_report_count: 99, compliance_posture: "WATCH" }
              as: PortalOperator
              captures: { lrc: $.data.late_report_count, post: $.data.compliance_posture }
          assert:
            - "${lrc} == 0"
            - "${post} == CLEAR"
      - name: organization_get_missing_id_returns_not_found
        claim_type: not_found
        grounds: ["entities.Organization", "errors[ERR_ORG_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but unknown organization id returns 404 ERR_ORG_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /msrb/organizations/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: PortalOperator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ORG_NOT_FOUND"
      - name: solicitation_record_has_no_version_or_updated_at
        claim_type: immutability
        grounds: ["entities.SolicitationRecord"]
        distinguishing_aspect: "SolicitationRecord is an append-only event (common_fields false): its create response carries id and created_at but no version and no updated_at."
        test_recipe:
          setup: ["An ACTIVE MUNICIPAL_ADVISOR organization."]
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "MA-0005", name: "Advisor Five", org_type: "MUNICIPAL_ADVISOR" }
              as: PortalOperator
              captures: { org_ma: $.data.id }
          trigger:
            - call: "POST /msrb/solicitation-records"
              payload: { advisor_org_id: "${org_ma}", municipal_entity_name: "City of Example", compensation_type: "FIXED", compensation_cents: 100000, disclosure_provided: true }
              as: DealerRep
              as_user_id: "${org_ma}"
              captures: { rec_id: $.data.id }
          assert:
            - "SolicitationRecord create response data contains key 'id' and key 'created_at'"
            - "SolicitationRecord create response data does NOT contain keys 'version' or 'updated_at'"
      - name: proposal_create_defaults_draft_no_supersede
        claim_type: defaults
        grounds: ["entities.RuleProposal.fields.status", "entities.RuleProposal.fields.comment_round", "entities.RuleProposal.fields.supersedes_proposal_id"]
        distinguishing_aspect: "A fresh RuleProposal is DRAFT with comment_round 0, expedited false, and supersedes_proposal_id null when omitted."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-001", title: "Defaults rule", body: "d", category: "QUALIFICATION" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { st: $.data.status, cr: $.data.comment_round, sup: $.data.supersedes_proposal_id, exp: $.data.expedited }
          assert:
            - "${st} == DRAFT"
            - "${cr} == 0"
            - "${sup} == null"
            - "${exp} == false"
  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: trade_report_created_directly_disseminated
        claim_type: initial_state
        grounds: ["state_machines.TradeReport", "entities.TradeReport.fields.status"]
        distinguishing_aspect: "A validated trade report lands immediately in DISSEMINATED (price transparency publication is synchronous with acceptance)."
        test_recipe:
          setup: ["An ACTIVE BROKER_DEALER org; clock 2026-09-01T12:00:00Z."]
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-1002", name: "Dealer Init", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_d: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /msrb/trade-reports"
              payload: { dealer_org_id: "${org_d}", cusip: "123456789", trade_type: "CUSTOMER_BUY", par_amount: 500000, price: 100.0, executed_at: "2026-09-01T11:55:00Z" }
              as: DealerRep
              as_user_id: "${org_d}"
              captures: { st: $.data.status }
          assert:
            - "${st} == DISSEMINATED"
      - name: decide_on_draft_proposal_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.RuleProposal", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "decide is defined only from PENDING_APPROVAL; calling it on a DRAFT proposal fails with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT proposal."]
          setup_api_calls:
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-002", title: "Early decide", body: "e", category: "DISCLOSURE" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /msrb/rule-proposals/${p_id}/decide"
              payload: { decision: "APPROVE" }
              as: Regulator
              as_user_id: regulator-1
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
      - name: moderate_dismissed_letter_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.CommentLetter", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DISMISSED is terminal for a comment letter; a second moderate attempt fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A proposal OPEN_FOR_COMMENT with one letter already DISMISSED."]
          setup_api_calls:
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-003", title: "Moderation rule", body: "m", category: "MARKET_DATA" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { p_id: $.data.id }
            - call: "POST /msrb/rule-proposals/${p_id}/open-comment-period"
              payload: { comment_period_days: 21 }
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /msrb/rule-proposals/${p_id}/comment-letters"
              payload: { author_name: "Spammer", body: "junk", sentiment: "NEUTRAL" }
              as: PublicReader
              captures: { letter: $.data.id }
            - call: "POST /msrb/comment-letters/${letter}/moderate"
              payload: { action: "DISMISS", reason: "duplicative" }
              as: PortalOperator
          trigger:
            - call: "POST /msrb/comment-letters/${letter}/moderate"
              payload: { action: "PUBLISH" }
              as: PortalOperator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
      - name: cancel_cancelled_trade_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.TradeReport", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal for a trade; a second cancel by the owning dealer fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["An ACTIVE BROKER_DEALER org with one DISSEMINATED trade, then cancelled once."]
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-1003", name: "Dealer Cancel", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_d: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: SystemAdmin
            - call: "POST /msrb/trade-reports"
              payload: { dealer_org_id: "${org_d}", cusip: "123456789", trade_type: "INTER_DEALER", par_amount: 100000, price: 100.0, executed_at: "2026-09-01T11:55:00Z" }
              as: DealerRep
              as_user_id: "${org_d}"
              captures: { t: $.data.id }
            - call: "POST /msrb/trade-reports/${t}/cancel"
              payload: {}
              as: DealerRep
              as_user_id: "${org_d}"
          trigger:
            - call: "POST /msrb/trade-reports/${t}/cancel"
              payload: {}
              as: DealerRep
              as_user_id: "${org_d}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
      - name: rejected_subscription_transition_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.DataSubscription", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED (cascade terminal state) accepts no further transitions: transition to_state ACTIVE fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["An ACTIVE BROKER_DEALER org whose posture flipped to WATCH after five late trades, rejecting its PENDING subscription."]
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-1004", name: "Dealer Rejected", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_d: $.data.id }
            - call: "POST /msrb/data-subscriptions"
              payload: { product_code: "TRADE_HISTORICAL", licensee_org_id: "${org_d}", subscriber_principal: "sub-rj", license_scope: "INTERNAL", seats: 2 }
              as: LicensingOfficer
              captures: { sub: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /msrb/trade-reports"
              payload: { dealer_org_id: "${org_d}", cusip: "123456789", trade_type: "INTER_DEALER", par_amount: 100000, price: 100.0, executed_at: "2026-09-01T08:00:00Z" }
              as: DealerRep
              as_user_id: "${org_d}"
            - call: "POST /msrb/trade-reports"
              payload: { dealer_org_id: "${org_d}", cusip: "123456789", trade_type: "INTER_DEALER", par_amount: 100000, price: 100.0, executed_at: "2026-09-01T08:00:00Z" }
              as: DealerRep
              as_user_id: "${org_d}"
            - call: "POST /msrb/trade-reports"
              payload: { dealer_org_id: "${org_d}", cusip: "123456789", trade_type: "INTER_DEALER", par_amount: 100000, price: 100.0, executed_at: "2026-09-01T08:00:00Z" }
              as: DealerRep
              as_user_id: "${org_d}"
            - call: "POST /msrb/trade-reports"
              payload: { dealer_org_id: "${org_d}", cusip: "123456789", trade_type: "INTER_DEALER", par_amount: 100000, price: 100.0, executed_at: "2026-09-01T08:00:00Z" }
              as: DealerRep
              as_user_id: "${org_d}"
            - call: "POST /msrb/trade-reports"
              payload: { dealer_org_id: "${org_d}", cusip: "123456789", trade_type: "INTER_DEALER", par_amount: 100000, price: 100.0, executed_at: "2026-09-01T08:00:00Z" }
              as: DealerRep
              as_user_id: "${org_d}"
          trigger:
            - call: "POST /msrb/data-subscriptions/${sub}/transition"
              payload: { to_state: "ACTIVE" }
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
      - name: open_comment_period_sets_window_fields
        claim_type: side_effect_execution
        grounds: ["state_machines.RuleProposal.DRAFT_to_OPEN_FOR_COMMENT", "entities.RuleProposal.fields.comment_window_end"]
        distinguishing_aspect: "Opening a 21-day comment period at the default clock stamps start 2026-09-01T00:00:00Z, end 2026-09-22T00:00:00Z, comment_round 1, and stores the expedited flag."
        test_recipe:
          setup: ["A DRAFT proposal."]
          setup_api_calls:
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-004", title: "Window rule", body: "w", category: "DISCLOSURE" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /msrb/rule-proposals/${p_id}/open-comment-period"
              payload: { comment_period_days: 21, expedited: true }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { ws: $.data.comment_window_start, we: $.data.comment_window_end, cr: $.data.comment_round, exp: $.data.expedited }
          assert:
            - "${ws} == '2026-09-01T00:00:00Z'"
            - "${we} == '2026-09-22T00:00:00Z'"
            - "${cr} == 1"
            - "${exp} == true"
      - name: org_suspend_does_not_cascade_to_professional
        claim_type: side_effect_execution
        grounds: ["state_machines.Organization.ACTIVE_to_SUSPENDED"]
        distinguishing_aspect: "Suspending an organization explicitly does NOT cascade: the professional's own standing remains ACTIVE (gates apply to future operations only)."
        test_recipe:
          setup: ["An ACTIVE BROKER_DEALER org with one professional."]
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-1005", name: "Dealer Nocascade", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_d: $.data.id }
            - call: "POST /msrb/professionals"
              payload: { full_name: "Pro Steady", employer_org_id: "${org_d}", professional_class: "MUNICIPAL_DEALER_REP" }
              as: ExamAdmin
              captures: { prof: $.data.id }
          trigger:
            - call: "POST /msrb/organizations/${org_d}/suspend"
              payload: { reason: "net capital deficiency" }
              as: ComplianceOfficer
              as_user_id: co-1
          assert:
            - "MunicipalProfessional.${prof}.standing == ACTIVE"
            - "MunicipalProfessional.${prof}.qualification_status == UNQUALIFIED"
      - name: superseded_proposal_rejects_further_transitions
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.RuleProposal", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "SUPERSEDED is terminal: open-comment-period on a superseded proposal fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Rule A (G-100) EFFECTIVE and then SUPERSEDED by expedited rule B (G-101) effectuating at 2026-11-22T00:00:00Z."]
          setup_api_calls:
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-100", title: "Rule A", body: "a", category: "TRADE_REPORTING" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { pa: $.data.id }
            - call: "POST /msrb/rule-proposals/${pa}/open-comment-period"
              payload: { comment_period_days: 21 }
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-22T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /msrb/rule-proposals/${pa}/submit-for-approval"
              payload: {}
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /msrb/rule-proposals/${pa}/decide"
              payload: { decision: "APPROVE" }
              as: Regulator
              as_user_id: regulator-1
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-22T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-101", title: "Rule B", body: "b", category: "TRADE_REPORTING", supersedes_proposal_id: "${pa}" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { pb: $.data.id }
            - call: "POST /msrb/rule-proposals/${pb}/open-comment-period"
              payload: { comment_period_days: 21, expedited: true }
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-12T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /msrb/rule-proposals/${pb}/submit-for-approval"
              payload: {}
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /msrb/rule-proposals/${pb}/decide"
              payload: { decision: "APPROVE" }
              as: Regulator
              as_user_id: regulator-1
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-22T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /msrb/rule-proposals/${pa}/open-comment-period"
              payload: { comment_period_days: 21 }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "RuleProposal.${pa}.status == SUPERSEDED"
      - name: deficient_submission_is_terminal
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.DisclosureSubmission", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DEFICIENT is terminal: a second review-outcome on a DEFICIENT submission fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["An ACTIVE ISSUER org with one submission already marked DEFICIENT."]
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "IS-1006", name: "Issuer Six", org_type: "ISSUER" }
              as: PortalOperator
              captures: { org_i: $.data.id }
            - call: "POST /msrb/disclosure-submissions"
              payload: { issuer_org_id: "${org_i}", submission_type: "VOLUNTARY", document_uri: "doc://v1", cusip: "123456789" }
              as: IssuerRep
              as_user_id: "${org_i}"
              captures: { sub: $.data.id }
            - call: "POST /msrb/disclosure-submissions/${sub}/review-outcome"
              payload: { outcome: "DEFICIENT", deficiency_reason: "missing exhibits" }
              as: PortalOperator
          trigger:
            - call: "POST /msrb/disclosure-submissions/${sub}/review-outcome"
              payload: { outcome: "PUBLISH" }
              as: PortalOperator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
      - name: standing_side_effect_on_org_headcount
        claim_type: side_effect_execution
        grounds: ["state_machines.MunicipalProfessional.ACTIVE_to_SUSPENDED", "entities.Organization.fields.active_professional_count"]
        excluded_because:
          difficulty_instance: standing_cycle_conserves_active_professional_count
          rationale: "The +/-1 headcount side effect and its compensation are asserted there."
      - name: approval_side_effects_and_effectiveness_variant
        claim_type: side_effect_execution
        grounds: ["state_machines.RuleProposal.PENDING_APPROVAL_to_APPROVED", "entities.RuleProposal.fields.effective_at"]
        excluded_because:
          difficulty_instance: rule_effectiveness_standard_vs_expedited
          rationale: "approval_at stamping and both effective_at variants are asserted there."
  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: event_notice_day10_timely_day11_late
        claim_type: boundary
        grounds:
          - calculations.event_notice_timeliness
          - entities.DisclosureSubmission.fields.timeliness
        distinguishing_aspect: "The 10-calendar-day event-notice deadline is inclusive: filing on exactly day 10 classifies TIMELY, day 11 classifies LATE."
        test_recipe:
          setup:
            - "An ACTIVE ISSUER org; clock will be set so that created_at lands on the 10th and 11th calendar day after an event dated 2026-09-01."
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "IS-2001", name: "Issuer Event", org_type: "ISSUER" }
              as: PortalOperator
              captures: { org_i: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /msrb/disclosure-submissions"
              payload: { issuer_org_id: "${org_i}", submission_type: "EVENT_NOTICE", event_category: "PAYMENT_DEFAULT", event_occurred_at: "2026-09-01T00:00:00Z", document_uri: "doc://ev10", cusip: "123456789" }
              as: IssuerRep
              as_user_id: "${org_i}"
              captures: { t10: $.data.timeliness }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /msrb/disclosure-submissions"
              payload: { issuer_org_id: "${org_i}", submission_type: "EVENT_NOTICE", event_category: "RATING_CHANGE", event_occurred_at: "2026-09-01T00:00:00Z", document_uri: "doc://ev11", cusip: "123456789" }
              as: IssuerRep
              as_user_id: "${org_i}"
              captures: { t11: $.data.timeliness }
          assert:
            - "${t10} == TIMELY"
            - "${t11} == LATE"
      - name: late_tally_counts_only_late_and_decays_outside_window
        claim_type: input_set_filtering
        grounds:
          - calculations.late_report_tally_and_posture
          - entities.Organization.fields.late_report_count
        distinguishing_aspect: "The tally includes only late_flag == true DISSEMINATED trades inside the half-open trailing 30-day window: a timely trade never counts, and the late trade drops out once the window slides past it."
        test_recipe:
          setup:
            - "An ACTIVE BROKER_DEALER org; clock 2026-09-01T12:00:00Z."
          setup_api_calls:
