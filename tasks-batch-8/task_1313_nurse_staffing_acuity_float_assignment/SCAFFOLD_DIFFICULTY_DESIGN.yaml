              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SHIFT_NOT_OPEN (priority 6 state beats priority 7 business_safety ERR_COMPETENCY_NOT_HELD)"
            - "HTTP status == 409"

      - name: safety_beats_fiscal_on_offer_create
        grounds:
