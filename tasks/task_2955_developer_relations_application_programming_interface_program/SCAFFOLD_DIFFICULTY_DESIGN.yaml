              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /quota-assignments/${qa1_id}/usage-windows"
              payload: { window_start: "2026-08-01T02:00:00Z", total_calls: 50000, burst_calls: 0 }
