            - "RiskZone.${z_b_id}.assessment_status == SERVICE_COMPLETE"
            - "CanvassRoute.${r_b_id}.status == IN_PROGRESS"

      - name: grant_report_returns_to_draft_and_resubmits_on_revision_cycle
        grounds:
          - state_machines.GrantReport.SUBMITTED_to_DRAFT
          - state_machines.GrantReport.DRAFT_to_SUBMITTED
          - entities.GrantReport.fields.revision_no
          - entities.GrantReport.fields.last_decision
          - endpoints[POST /crr/grant-reports/{id}/decision]
        distinguishing_aspect: |
          Non-linearity on GrantReport, a different entity and a different shape than the visit axes:
          the SUBMITTED -> DRAFT reverse edge makes the lifecycle cyclic, and the second pass through
          DRAFT -> SUBMITTED must leave revision_no at 1 (bumped once, on the return only) while
          clearing and then re-setting submitted_by_user_id.
        test_recipe:
          setup:
