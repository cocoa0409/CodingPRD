            - "call 2: 422 with the SAME error_id ERR_DISPUTE_AMOUNT_EXCEEDS_SHARE — the rule also carries the >= 1 lower bound, so a zero-cent dispute is not a generic ERR_INVALID_REQUEST"
            - "call 3: 201 with status == OPEN, evidence_round_count == 0, opened_by_user_id == ${m1_id}, accrual_status_before == ACCRUED and RebateAccrual.${a1_id}.status == DISPUTED — the upper bound is inclusive"
