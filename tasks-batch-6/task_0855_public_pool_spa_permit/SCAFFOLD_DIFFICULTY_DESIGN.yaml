            - "Facility.${fac_id}.operating_posture == CLOSED and posture_reason == CLOSURE_ORDER_OPEN"

  - rule_id: boundary_precision_check
    instances:

      - name: free_chlorine_exactly_at_imminent_floor_is_out_of_range_not_hazard
        grounds:
          - calculations.water_reading_classification
          - entities.WaterChemistryReading.fields.compliance_status
          - entities.WaterChemistryReading.fields.out_of_range_parameters
          - errors[ERR_IMMINENT_HEALTH_HAZARD]
        distinguishing_aspect: |
          Boundary metric 1 — the free-chlorine ppm scale on POST /facilities/{id}/water-readings:
          0.5 ppm on a POOL is exactly the imminent floor and is therefore OUT_OF_RANGE with no
          auto-closure, while 1.0 ppm is exactly the compliant minimum and is IN_RANGE; both
          comparisons are strict (< floor, < minimum), never <=.
        test_recipe:
          setup:
            - "One operator and one CLASS_B_PUBLIC pool facility exist; the clock is at its 2026-05-01T00:00:00Z default and no closure order is open."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /facilities/${fac_id}/water-readings"
              payload: { sampled_at: "2026-05-01T00:00:00Z", source: "OPERATOR_LOG", free_chlorine_ppm: 0.5, combined_chloramine_ppm: 0.1, ph: 7.4, water_temp_f: 82.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { rd_floor_id: $.data.id }
            - call: "POST /facilities/${fac_id}/water-readings"
              payload: { sampled_at: "2026-05-01T00:00:00Z", source: "OPERATOR_LOG", free_chlorine_ppm: 1.0, combined_chloramine_ppm: 0.4, ph: 7.8, water_temp_f: 95.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { rd_min_id: $.data.id }
          assert:
            - "WaterChemistryReading.${rd_floor_id}.compliance_status == OUT_OF_RANGE (0.5 is not strictly below the 0.5 imminent floor)"
            - "WaterChemistryReading.${rd_floor_id}.out_of_range_parameters == [FREE_CHLORINE_LOW]"
            - "WaterChemistryReading.${rd_floor_id}.triggered_closure_order_id == null"
            - "WaterChemistryReading.${rd_min_id}.compliance_status == IN_RANGE with every parameter sitting exactly on its limit (1.0 ppm, 0.4 ppm chloramine, pH 7.8, 95.0 F)"
            - "WaterChemistryReading.${rd_min_id}.out_of_range_parameters == []"
            - "GET /closure-orders?facility_id=${fac_id} returns zero rows"
            - "Facility.${fac_id}.operating_posture == CLOSED and posture_reason == PERMIT_MISSING (no closure was ever created)"

      - name: rwi_risk_score_exactly_at_escalation_threshold_escalates
        grounds:
          - calculations.rwi_risk_score
          - entities.Complaint.fields.escalated
          - entities.Complaint.fields.risk_score
          - state_machines.Complaint.null_to_RECEIVED
        distinguishing_aspect: |
          Boundary metric 2 — the recreational-water-illness risk score on POST /complaints, a
          different metric reached through a different endpoint from the chlorine boundary: a score
          of exactly 60 escalates (>= threshold) and opens an RWI_OUTBREAK closure, while 59 does
          not, and the 5-case complaint also lands exactly on the 60-point case-component cap.
        test_recipe:
          setup:
            - "One operator owns two separate CLASS_B_PUBLIC pools so that neither complaint can cluster with the other."
            - "The clock is at its 2026-05-01T00:00:00Z default; both reports carry a symptom onset of 2026-04-21, 10 days back, so neither earns the recency bonus."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Twin Pools Trust", contact_email: "ops@twinpools.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "North Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_a_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "South Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_b_id: $.data.id }
          trigger:
            - call: "POST /complaints"
              payload: { facility_id: "${fac_a_id}", complaint_type: "RWI_ILLNESS", narrative: "Five swimmers reported diarrhoeal illness after a birthday party", symptom_onset_date: "2026-04-21", illness_case_count: 5 }
              as: Anonymous
              captures: { c_at_id: $.data.id }
            - call: "POST /complaints"
              payload: { facility_id: "${fac_b_id}", complaint_type: "RWI_ILLNESS", narrative: "Two swimmers reported respiratory illness", symptom_onset_date: "2026-04-21", illness_case_count: 2, pathogen_suspected: "LEGIONELLA" }
              as: Anonymous
              captures: { c_below_id: $.data.id }
          assert:
            - "Complaint.${c_at_id}.risk_score == 60 (case component capped at exactly 60, null pathogen contributes 0, no recency bonus)"
            - "Complaint.${c_at_id}.escalated == true — the threshold comparison is >= 60, not > 60"
            - "GET /closure-orders?facility_id=${fac_a_id} returns exactly one order with closure_reason == RWI_OUTBREAK"
            - "Complaint.${c_below_id}.risk_score == 59"
            - "Complaint.${c_below_id}.escalated == false"
            - "GET /closure-orders?facility_id=${fac_b_id} returns zero rows"
            - "Facility.${fac_a_id}.posture_reason == CLOSURE_ORDER_OPEN while Facility.${fac_b_id}.posture_reason == PERMIT_MISSING"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: permit_issuance_gated_on_plan_review_approved_state
        grounds:
          - validations[priority=37]
          - state_machines.Permit.UNDER_REVIEW_to_ISSUED
          - state_machines.PlanReview.UNDER_REVIEW_to_APPROVED
          - entities.Permit.fields.plan_review_id
          - errors[ERR_PLAN_REVIEW_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair Permit -> PlanReview: the Permit UNDER_REVIEW -> ISSUED edge is legal only
          while the referenced PlanReview sits in APPROVED, so the identical ISSUE request fails
          with ERR_PLAN_REVIEW_NOT_APPROVED at plan-review status SUBMITTED and succeeds unchanged
          once the reviewer approves.
        test_recipe:
          setup:
            - "A CLASS_B_PUBLIC pool created with requires_plan_review true."
            - "A NEW_CONSTRUCTION plan review is on file in status SUBMITTED, having posted a 25000-cent plan-review fee that the operator has already paid off, so fee_balance_cents is 0."
            - "An annual permit application referencing that review sits in UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Civic Aquatic Center", contact_email: "permits@civic.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Civic Competition Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 12, drain_count: 2, requires_plan_review: true }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /plan-reviews"
              payload: { facility_id: "${fac_id}", project_type: "NEW_CONSTRUCTION", drawing_reference: "DR-2026-014" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pr_id: $.data.id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "ANNUAL", term_start_date: "2026-05-01", plan_review_id: "${pr_id}" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "SUBMIT" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "START_REVIEW" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /operators/${op_id}/payments"
              payload: { amount_cents: 25000, reference_note: "Plan review fee" }
              as: Operator
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "ISSUE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /plan-reviews/${pr_id}/transition"
              payload: { action: "START_REVIEW" }
              as: PlanReviewer
              as_user_id: "pr-1"
            - call: "POST /plan-reviews/${pr_id}/transition"
              payload: { action: "APPROVE" }
              as: PlanReviewer
              as_user_id: "pr-1"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "ISSUE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          assert:
            - "The first ISSUE returns 409 with data.error_id == ERR_PLAN_REVIEW_NOT_APPROVED"
            - "After the first ISSUE, Permit.${permit_id}.status == UNDER_REVIEW and assessed_fee_cents == 0"
            - "PlanReview.${pr_id}.status == APPROVED with decided_by_user_id == pr-1 after the reviewer acts"
            - "The second ISSUE succeeds: Permit.${permit_id}.status == ISSUED and assessed_fee_cents == 40000"
            - "Operator.${op_id}.fee_balance_cents == 40000 (25000 plan-review fee charged, 25000 paid, 40000 permit fee charged)"
            - "GET /fee-ledger-entries?operator_id=${op_id} returns three entries: PLAN_REVIEW_FEE +25000, PAYMENT -25000, PERMIT_FEE +40000"

      - name: reopen_approval_gated_on_verification_reading_in_range_state
        grounds:
          - validations[priority=26]
          - state_machines.ClosureOrder.REOPEN_REQUESTED_to_CLEARED
          - calculations.water_reading_classification
          - entities.ClosureOrder.fields.verification_reading_id
          - errors[ERR_WATER_NOT_IN_RANGE]
        distinguishing_aspect: |
          Entity pair ClosureOrder -> WaterChemistryReading, a different pair from Permit ->
          PlanReview: the CLEARED edge depends on the classification the attached reading carries,
          so an OUT_OF_RANGE reading blocks the approval with ERR_WATER_NOT_IN_RANGE even though
          the remediation clock has already elapsed.
        test_recipe:
          setup:
            - "A CLASS_B_PUBLIC pool has a CHEMICAL closure order opened at 2026-05-01T00:00:00Z with a 60-minute FIXED_TABLE window (earliest_reopen_at 2026-05-01T01:00:00.000Z)."
            - "The clock now reads 2026-05-01T02:00:00Z, well past that window."
            - "A verification reading sampled at 2026-05-01T01:30:00Z carries 0.8 ppm free chlorine, which is OUT_OF_RANGE but not IMMINENT_HAZARD, and it has been attached by a reopen request."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /closure-orders"
              payload: { facility_id: "${fac_id}", closure_reason: "CHEMICAL", expected_facility_version: "${fac_v}", note: "Chlorine feeder overdose" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { co_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T02:00:00Z" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /facilities/${fac_id}/water-readings"
              payload: { sampled_at: "2026-05-01T01:30:00Z", source: "REOPEN_VERIFICATION", free_chlorine_ppm: 0.8, combined_chloramine_ppm: 0.1, ph: 7.4, water_temp_f: 82.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { rd_id: $.data.id }
            - call: "POST /closure-orders/${co_id}/reopen-request"
              payload: { verification_reading_id: "${rd_id}" }
              as: Operator
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /closure-orders/${co_id}/reopen-decision"
              payload: { decision: "APPROVE" }
              as: Inspector
              as_user_id: "insp-2"
              captures: { err_id: $.data.error_id }
          assert:
            - "The response is 409 with data.error_id == ERR_WATER_NOT_IN_RANGE"
            - "The response is NOT ERR_REMEDIATION_INCOMPLETE — earliest_reopen_at is 2026-05-01T01:00:00.000Z and the clock is 2026-05-01T02:00:00Z"
            - "WaterChemistryReading.${rd_id}.compliance_status == OUT_OF_RANGE with out_of_range_parameters == [FREE_CHLORINE_LOW]"
            - "ClosureOrder.${co_id}.status == REOPEN_REQUESTED (unchanged) and cleared_at == null"
            - "ClosureOrder.${co_id}.remediation_variant == FIXED_TABLE and required_remediation_minutes == 60 (no treatment data was supplied)"
            - "Facility.${fac_id}.operating_posture == CLOSED and posture_reason == CLOSURE_ORDER_OPEN"

  - rule_id: resource_temporal_overlap
    instances:

      - name: staff_shift_half_open_interval_touching_allowed_overlap_rejected
        grounds:
          - validations[priority=33]
          - errors[ERR_STAFF_SHIFT_OVERLAP]
          - entities.StaffAssignment.fields.staff_ref
          - state_machines.StaffAssignment.null_to_SCHEDULED
        distinguishing_aspect: |
          Interval semantics 1 — unbuffered half-open [start, end) occupation of the staff_ref
          resource: a shift beginning at the exact instant another ends is accepted, and only a
          strict interior overlap is rejected with ERR_STAFF_SHIFT_OVERLAP.
        test_recipe:
          setup:
            - "A CLASS_B_PUBLIC pool with an ISSUED annual permit (posture RESTRICTED, not CLOSED) already carries a SCHEDULED shift for staff_ref LG-001 from 2026-05-02T08:00:00Z to 2026-05-02T12:00:00Z."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "ANNUAL", term_start_date: "2026-05-01" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "SUBMIT" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "START_REVIEW" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "ISSUE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /staff-assignments"
              payload: { facility_id: "${fac_id}", staff_ref: "LG-001", staff_name: "Ana Ruiz", role_type: "LIFEGUARD", certification_expires_on: "2026-12-31", shift_start_at: "2026-05-02T08:00:00Z", shift_end_at: "2026-05-02T12:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { sa1_id: $.data.id }
          trigger:
            - call: "POST /staff-assignments"
              payload: { facility_id: "${fac_id}", staff_ref: "LG-001", staff_name: "Ana Ruiz", role_type: "LIFEGUARD", certification_expires_on: "2026-12-31", shift_start_at: "2026-05-02T12:00:00Z", shift_end_at: "2026-05-02T16:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { sa2_id: $.data.id }
            - call: "POST /staff-assignments"
              payload: { facility_id: "${fac_id}", staff_ref: "LG-001", staff_name: "Ana Ruiz", role_type: "LIFEGUARD", certification_expires_on: "2026-12-31", shift_start_at: "2026-05-02T15:59:00Z", shift_end_at: "2026-05-02T20:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "The touching shift is created: 201 with StaffAssignment.${sa2_id}.status == SCHEDULED and shift_start_at == 2026-05-02T12:00:00.000Z"
            - "The third request returns 409 with data.error_id == ERR_STAFF_SHIFT_OVERLAP (15:59 is strictly inside [12:00, 16:00))"
            - "GET /facilities/${fac_id}/staff-assignments returns exactly two rows, both SCHEDULED"

      - name: inspection_buffered_closed_window_conflicts_at_exact_buffer_edge
        grounds:
          - validations[priority=29]
          - errors[ERR_INSPECTION_WINDOW_CONFLICT]
          - entities.Inspection.fields.scheduled_start_at
          - state_machines.Inspection.null_to_SCHEDULED
        distinguishing_aspect: |
          Interval semantics 2 — a 60-minute buffer applied to both ends with inclusive
          comparisons, occupying the Facility resource rather than a staff_ref: a visit starting
          exactly 60 minutes after another ends still conflicts, and one minute later does not.
        test_recipe:
          setup:
            - "One operator and one CLASS_B_PUBLIC pool facility exist."
            - "A ROUTINE inspection is SCHEDULED for 2026-05-02T09:00:00Z to 2026-05-02T11:00:00Z, so its buffered footprint runs 08:00 to 12:00 inclusive."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /inspections"
              payload: { facility_id: "${fac_id}", inspection_type: "ROUTINE", scheduled_start_at: "2026-05-02T09:00:00Z", scheduled_end_at: "2026-05-02T11:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { i1_id: $.data.id }
          trigger:
            - call: "POST /inspections"
              payload: { facility_id: "${fac_id}", inspection_type: "ROUTINE", scheduled_start_at: "2026-05-02T12:00:00Z", scheduled_end_at: "2026-05-02T13:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /inspections"
              payload: { facility_id: "${fac_id}", inspection_type: "ROUTINE", scheduled_start_at: "2026-05-02T12:01:00Z", scheduled_end_at: "2026-05-02T13:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { i3_id: $.data.id }
          assert:
            - "The 12:00 request returns 409 with data.error_id == ERR_INSPECTION_WINDOW_CONFLICT (12:00 <= 11:00 + 60 minutes is inclusive)"
            - "The 12:01 request returns 201 with Inspection.${i3_id}.workflow_status == SCHEDULED"
            - "GET /inspections?facility_id=${fac_id} returns exactly two rows"
            - "Inspection.${i1_id}.workflow_status == SCHEDULED and enforcement_status == NONE (unchanged by either attempt)"

  - rule_id: compensating_invariant
    instances:

      - name: permit_refund_restores_operator_fee_balance_exactly
        grounds:
          - calculations.operator_fee_balance
          - calculations.permit_fee_assessment
          - state_machines.Permit.ISSUED_to_REVOKED
          - entities.Operator.fields.fee_balance_cents
          - entities.FeeLedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity 1 (money): Operator.fee_balance_cents must always equal
          SUM(FeeLedgerEntry.amount_cents). Issuing a late permit posts +40000 and +10000; the
          compensating REVOKE with refund_eligible posts exactly -50000, returning the balance to
          the pre-issuance 0 with no drift.
        test_recipe:
          setup:
            - "A CLASS_B_PUBLIC pool of 60000 gallons whose annual permit term started 2026-04-01, one month before the default clock, making it a late application."
            - "The permit sits in UNDER_REVIEW and the operator's balance is 0."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "ANNUAL", term_start_date: "2026-04-01" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "SUBMIT" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "START_REVIEW" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "ISSUE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "REVOKE", reason: "Operator surrendered the permit", refund_eligible: true }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          assert:
            - "Permit.${permit_id}.is_late_application == true and term_end_date == 2027-03-31"
            - "Permit.${permit_id}.assessed_fee_cents == 50000 (subtotal 40000 plus a 10000 late penalty)"
            - "Immediately after ISSUE, Operator.${op_id}.fee_balance_cents == 50000"
            - "After REVOKE, Operator.${op_id}.fee_balance_cents == 0 — exactly the pre-issuance value"
            - "Permit.${permit_id}.status == REVOKED and refunded == true"
            - "GET /fee-ledger-entries?operator_id=${op_id} returns exactly three rows with amount_cents 40000, 10000 and -50000, whose sum equals Operator.${op_id}.fee_balance_cents"

      - name: violation_correction_then_rejection_restores_demerit_points_exactly
        grounds:
          - calculations.facility_open_demerit_points
          - state_machines.Violation.OPEN_to_CORRECTED
          - state_machines.Violation.CORRECTED_to_OPEN
          - entities.Facility.fields.open_demerit_points
          - entities.Violation.fields.rejection_count
        distinguishing_aspect: |
          Conserved quantity 2 (compliance demerit points, not money): correcting a violation
          removes exactly its frozen points_assessed from Facility.open_demerit_points and a
          rejected verification puts exactly the same value back, so the facility total returns to
          12 with zero drift while the inspection's frozen score stays at 88.
        test_recipe:
          setup:
            - "A CLASS_B_PUBLIC pool has a FINALIZED ROUTINE inspection carrying one uncorrected CRITICAL finding (10 points) and one corrected-on-site NONCRITICAL finding (2 points)."
            - "Facility.open_demerit_points therefore stands at 12."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /inspections"
              payload: { facility_id: "${fac_id}", inspection_type: "ROUTINE", scheduled_start_at: "2026-05-01T09:00:00Z", scheduled_end_at: "2026-05-01T11:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/transition"
              payload: { action: "START" }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /inspections/${insp_id}/violations"
              payload: { code: "WQ-101", severity: "CRITICAL", description: "Free chlorine below minimum", corrected_on_site: false }
              as: Inspector
              as_user_id: "insp-1"
              captures: { v_crit_id: $.data.id }
            - call: "POST /inspections/${insp_id}/violations"
              payload: { code: "SN-201", severity: "NONCRITICAL", description: "Deck hose left uncoiled", corrected_on_site: true }
              as: Inspector
              as_user_id: "insp-1"
              captures: { v_minor_id: $.data.id }
            - call: "POST /inspections/${insp_id}/transition"
              payload: { action: "SUBMIT" }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /inspections/${insp_id}/transition"
              payload: { action: "FINALIZE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /violations/${v_crit_id}/correct"
              payload: { correction_note: "Chlorinator repaired and residual restored" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /violations/${v_crit_id}/verify"
              payload: { outcome: "REJECTED" }
              as: Inspector
              as_user_id: "insp-1"
          assert:
            - "Violation.${v_crit_id}.points_assessed == 10 and Violation.${v_minor_id}.points_assessed == 2"
            - "Immediately after FINALIZE, Facility.${fac_id}.open_demerit_points == 12"
            - "After the correction, Facility.${fac_id}.open_demerit_points == 2"
            - "After the rejected verification, Facility.${fac_id}.open_demerit_points == 12 — bit-for-bit the pre-correction value"
            - "Violation.${v_crit_id}.status == OPEN, rejection_count == 1, verified_at == null and corrected_at retains the 2026-05-01T00:00:00.000Z stamp from the correction"
            - "Inspection.${insp_id}.score == 88 and result == CONDITIONAL throughout — the frozen scoring is unaffected by the correction cycle"
