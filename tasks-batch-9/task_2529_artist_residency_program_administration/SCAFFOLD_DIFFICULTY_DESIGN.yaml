                         score_technical_readiness: 8 }
              as: Panelist
              as_user_id: "${p2}"
              captures: { t2: "$.data.panelist_total_100" }
            - call: "POST /panel-assignments/${pa3}/scores"
              payload: { score_artistic_merit: 9, score_feasibility: 9, score_community_fit: 8,
                         score_technical_readiness: 8 }
              as: Panelist
