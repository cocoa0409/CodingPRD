      - name: soft_deleted_book_rows_keep_their_history_but_leave_the_valuation
        claim_type: soft_delete
        grounds:
          - endpoints[DELETE /lateral-hiring/client-book-entries/{entry_id}]
          - endpoints[GET /lateral-hiring/client-book-entries/{entry_id}]
          - endpoints[GET /lateral-hiring/collection-records]
          - entities.ClientBookEntry.fields.status
          - complexity_layers.derived_field_reconciliation
        distinguishing_aspect: |
          A soft delete has to be simultaneously invisible and durable, and the two halves
          pull in opposite directions: the withdrawn row must still resolve by id with 200
          (never 404) and its append-only CollectionRecord rows must all survive, yet the row
          must vanish from the next valuation. Re-valuing the book after the withdrawal is the
          only assertion that can tell a real exclusion from a cosmetic status flip - the
          totals must drop from the AB BOOK's 1601112.15 to the SLIM BOOK's 1269000.00 while
          the withdrawn row KEEPS its own last computed 332112.15, so the money is not zeroed
          out anywhere.
