      - name: bid_round_award_reopen_cycle
        grounds:
          - state_machines.BidRound
          - state_machines.ShiftBid
          - calculations.bid_award_and_preference_honor
          - entities.BidRound.fields.reopen_count
          - entities.BidRound.fields.preference_honor_rate
          - validations.priority_100
        distinguishing_aspect: |
          The BidRound lifecycle is cyclic: DRAFT -> OPEN -> SCORING -> AWARDED -> OPEN, and the
          reopen is bounded by max_reopen_count. Across the cycle preference_honor_rate is
          0.5000, then null after the reopen (with every bid back to SUBMITTED and both minted
          DRAFT shifts cancelled and slots_awarded back to 0), then 0.5000 again after the second
          award -- and the third reopen is refused with ERR_REOPEN_LIMIT_REACHED while the round
          stays AWARDED. A linear state machine, or a reopen that forgets to release
          template.slots_awarded, cannot reproduce the second award.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "LA-CORE with preference_honor_floor_pct 0.50; OPEN cycle W37-BID."
            - "Two VOICE_EN templates T-A and T-B, each slots_total 1, days_of_week [0]."
            - "Two ACTIVE agents: E-001 seniority_rank 1, E-002 seniority_rank 2, both skills [VOICE_EN]."
            - "Round BR-1 with max_reopen_count 1, driven DRAFT -> OPEN; both agents bid preference [T-A, T-B]; round moved to SCORING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SchedulingManager
            - call: "POST /labor-agreements"
              payload: { code: "LA-CORE", min_rest_hours: 11, max_weekly_hours: 45, max_consecutive_days: 6, vto_min_notice_hours: 12, preference_honor_floor_pct: 0.50, ot_premium_multiplier: 1.00 }
              as: CapacityPlanner
              captures: { la_id: "$.data.id" }
            - call: "POST /planning-cycles"
              payload: { name: "W37-BID", horizon_start_date: "2026-09-07", horizon_end_date: "2026-09-13", interval_minutes: 30, requirement_basis: "MAX_OF_BOTH", ot_budget_cents: 1000000, intraday_alert_short_threshold: 99 }
              as: CapacityPlanner
              captures: { cyc_id: "$.data.id" }
            - call: "POST /shift-templates"
              payload: { planning_cycle_id: "${cyc_id}", code: "T-A", skill_code: "VOICE_EN", start_time_local: "08:00", duration_minutes: 480, unpaid_break_minutes: 30, days_of_week: [0], slots_total: 1 }
              as: SchedulingManager
              captures: { tpl_a_id: "$.data.id" }
            - call: "POST /shift-templates"
              payload: { planning_cycle_id: "${cyc_id}", code: "T-B", skill_code: "VOICE_EN", start_time_local: "14:00", duration_minutes: 300, unpaid_break_minutes: 30, days_of_week: [0], slots_total: 1 }
              as: SchedulingManager
              captures: { tpl_b_id: "$.data.id" }
            - call: "POST /agents"
              payload: { labor_agreement_id: "${la_id}", employee_code: "E-001", full_name: "Agent One", skills: ["VOICE_EN"], seniority_rank: 1, weekly_contracted_hours: 37.5, hourly_rate_cents: 2400 }
              as: SchedulingManager
              captures: { ag1_id: "$.data.id" }
            - call: "POST /agents"
              payload: { labor_agreement_id: "${la_id}", employee_code: "E-002", full_name: "Agent Two", skills: ["VOICE_EN"], seniority_rank: 2, weekly_contracted_hours: 37.5, hourly_rate_cents: 2400 }
              as: SchedulingManager
              captures: { ag2_id: "$.data.id" }
            - call: "POST /bid-rounds"
              payload: { planning_cycle_id: "${cyc_id}", code: "BR-1", max_reopen_count: 1 }
              as: SchedulingManager
              captures: { br_id: "$.data.id" }
            - call: "POST /bid-rounds/${br_id}/status"
              payload: { target_status: "OPEN" }
              as: SchedulingManager
            - call: "POST /shift-bids"
              payload: { bid_round_id: "${br_id}", agent_id: "${ag1_id}", preference_template_ids: ["${tpl_a_id}", "${tpl_b_id}"] }
              as: Agent
              as_user_id: "${ag1_id}"
              captures: { bid1_id: "$.data.id" }
            - call: "POST /shift-bids"
              payload: { bid_round_id: "${br_id}", agent_id: "${ag2_id}", preference_template_ids: ["${tpl_a_id}", "${tpl_b_id}"] }
              as: Agent
              as_user_id: "${ag2_id}"
              captures: { bid2_id: "$.data.id" }
            - call: "POST /bid-rounds/${br_id}/status"
              payload: { target_status: "SCORING" }
              as: SchedulingManager
          trigger:
            - call: "POST /bid-rounds/${br_id}/award"
              payload: {}
              as: SchedulingManager
              captures: { rate_first: "$.data.preference_honor_rate", awarded_first: "$.data.awarded_bid_count" }
            - call: "POST /bid-rounds/${br_id}/status"
              payload: { target_status: "OPEN" }
              as: SchedulingManager
              captures: { rate_after_reopen: "$.data.preference_honor_rate", reopen_count_1: "$.data.reopen_count" }
            - call: "GET /shift-bids/${bid2_id}"
              payload: {}
              as: SchedulingManager
              captures: { bid2_status_after_reopen: "$.data.status" }
            - call: "GET /shift-templates/${tpl_a_id}"
              payload: {}
              as: SchedulingManager
              captures: { tpl_a_awarded_after_reopen: "$.data.slots_awarded" }
            - call: "POST /bid-rounds/${br_id}/status"
              payload: { target_status: "SCORING" }
              as: SchedulingManager
            - call: "POST /bid-rounds/${br_id}/award"
              payload: {}
              as: SchedulingManager
              captures: { rate_second: "$.data.preference_honor_rate" }
            - call: "POST /bid-rounds/${br_id}/status"
              payload: { target_status: "OPEN" }
              as: SchedulingManager
          assert:
            - "rate_first == 0.5000 and awarded_first == 2"
            - "ShiftBid.${bid1_id}.awarded_shift_template_id == \"${tpl_a_id}\" and ShiftBid.${bid1_id}.awarded_preference_index == 0"
            - "rate_after_reopen is null and reopen_count_1 == 1"
            - "bid2_status_after_reopen == \"SUBMITTED\" and tpl_a_awarded_after_reopen == 0"
            - "rate_second == 0.5000"
            - "the final reopen returns 409 ERR_REOPEN_LIMIT_REACHED"
            - "BidRound.${br_id}.status == \"AWARDED\" and BidRound.${br_id}.reopen_count == 1"
            - "ShiftBid.${bid2_id}.awarded_shift_template_id == \"${tpl_b_id}\" and ShiftBid.${bid2_id}.awarded_preference_index == 1"

  - rule_id: transitive_cascade
    instances:
      - name: marketing_event_confirm_four_hop_posture_alert
        grounds:
          - state_machines.MarketingEvent.DRAFT_to_CONFIRMED
          - calculations.interval_volume_forecast
          - calculations.staffing_requirement
          - calculations.interval_allocatable_volume
          - entities.IntervalPlan.fields.coverage_state
          - entities.PlanningCycle.fields.short_interval_count
          - state_machines.PlanningCycle.SCHEDULE_PUBLISHED_to_INTRADAY_ALERT
        distinguishing_aspect: |
          One CONFIRMED status write has to travel five hops: event uplift -> interval volume and
          AHT -> both staffing variants -> per-interval coverage_state -> cycle
          short_interval_count -> the SCHEDULE_PUBLISHED -> INTRADAY_ALERT posture edge. The
          fixture is tuned so exactly two of four intervals tip to SHORT and the cycle's
          intraday_alert_short_threshold is exactly 2, so an implementation that stops the cascade
          one hop short (recomputing volumes but not requirements, or requirements but not the
          posture) leaves the cycle in SCHEDULE_PUBLISHED and fails.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "LA-CORE; cycle W37-ALERT with intraday_alert_short_threshold 2 and interval_minutes 30."
            - "CHAT/CHAT_EN group FG-C: base_daily_volume 40, base_aht_seconds 60, curve [0.4,0.3,0.2,0.1], all dow multipliers 1.0, slt 0.80 / 20s, occupancy 0.85, shrinkage 0.30, operating minutes 480..600 -> 4 intervals of 16 / 12 / 8 / 4 contacts requiring 1 agent each."
            - "Agent E-001 (skills [CHAT_EN]) with one PUBLISHED 08:00-16:00 shift on 2026-09-07 covering all four intervals, so every interval is COVERED and short_interval_count is 0."
            - "Cycle posture driven OPEN -> REQUIREMENTS_LOCKED -> SCHEDULE_PUBLISHED."
            - "One DRAFT HIGH event of uplift 0.30 over 2026-09-07T08:00Z..10:00Z scoped to FG-C."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CapacityPlanner
            - call: "POST /labor-agreements"
