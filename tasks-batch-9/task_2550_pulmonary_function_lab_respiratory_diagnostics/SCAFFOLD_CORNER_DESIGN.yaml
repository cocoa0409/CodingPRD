            - "session SESS-1 (09:00-09:30) was accepted with quality_grade A, so the device is SOILED with last_session_end_at 2026-08-03T09:30:00Z"
            - "the logical clock is then advanced to 2026-08-03T09:35:00Z so new quality events land after the session end"
          setup_api_calls:
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
