              captures: { b_state: $.data.state, b_fulfilled_at: $.data.accommodation_fulfilled_at }
            - call: "POST /complaints/${cmp_a_id}/close"
              payload: { closure_outcome: "REMEDIATION_SCHEDULED" }
              as: AccessibilityLead
            - call: "POST /complaints/${cmp_b_id}/close"
              payload: { closure_outcome: "ACCOMMODATION_PROVIDED" }
              as: AccessibilityLead
          assert:
            - "${a_state} == LINKED"
            - "${a_link} == ${iss_id}"
            - "${b_state} == ACCOMMODATED"
            - "${b_fulfilled_at} == 2026-08-01T00:00:00Z"
            - "Complaint.${cmp_a_id}.state == CLOSED"
            - "Complaint.${cmp_a_id}.accommodation_fulfilled_at is null (the REMEDIATION branch never writes it)"
            - "Complaint.${cmp_b_id}.state == CLOSED"
            - "Complaint.${cmp_b_id}.linked_issue_id is null (the ACCOMMODATION branch never writes it)"
            - "KnownIssue.${iss_id}.linked_complaint_count == 1"
            - "Product.${prod_id}.accommodations_fulfilled_count == 1"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: run_completion_readiness_chain
        grounds:
          - state_machines.AssessmentRun.SCHEDULED_to_COMPLETED
          - state_machines.ProductComponent.IN_TESTING_to_COMPLETE
          - calculations.component_testing_coverage_pct
          - entities.Product.fields.components_complete_count
        distinguishing_aspect: |
          Cascade 1 of 3, triggered by run completion, depth 3: completing the run writes
          ProductComponent.evidence_units_total (hop 1); that write forces the coverage_pct
          recompute to 45.00 (hop 2); crossing MIN_ATTEST_COVERAGE_PCT moves assessment_state
          IN_TESTING -> COMPLETE (hop 3), which in turn lifts Product.components_complete_count
          and assessment_readiness (hop 4). Each hop is caused by the previous hop, not by the call.
        test_recipe:
          setup:
            - "One in-scope component with applicable_criteria_count 40, evidence_units_total 0, coverage_pct 0.00, assessment_state IN_TESTING because one run already exists"
            - "That run is MANUAL, SCREEN_READER, 40 exercised criteria, still SCHEDULED"
            - "Product.components_in_scope_count is 1 and components_complete_count is 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
