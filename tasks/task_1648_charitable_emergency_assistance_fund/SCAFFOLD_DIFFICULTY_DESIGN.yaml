  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; depth >= 3 and >= 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: payment_clear_bubble_up_cascade
        grounds:
          - state_machines.Payment.ISSUED_to_CLEARED
          - state_machines.FundingAllocation.RESERVED_to_CONSUMED
          - state_machines.AssistanceAward.ACTIVE_to_DISBURSED
          - state_machines.AssistanceApplication.APPROVED_to_PAID
        distinguishing_aspect: |
          Depth-3 chain from POST /payments/{id}/clear: payment clear mutates the
          allocation (link 1); the allocation fully consuming mutates the award
          (link 2); the award disbursing mutates the application (link 3) — each
          hop caused by the previous, not by the original trigger.
