            - "${blocked_before} == 0"
            - "${prop_state} == ACCEPTED"
            - "Component.${c_prov}.current_major_version == 2 and Component.${c_prov}.pending_breaking_change_count == 1"
            - "ComponentDependency.${dep_id}.compatibility_state == INCOMPATIBLE"
            - "Component.${c_cons}.blocked_dependency_count == 1"
            - "PlatformImplementation.${impl_id}.status == BLOCKED and PlatformImplementation.${impl_id}.blocked_reason == UPSTREAM_BREAKING_CHANGE"
            - "Component.${c_cons}.shipped_platform_count == 0 and Component.${c_cons}.coverage_state == NONE"
            - "Team.${team_id}.blocked_implementation_count == 1"
            - "Component.${c_prov}.docs_state == PUBLISHED (DOC_PAGE evidence was filed)"

      - name: provider_sunset_cascades_three_hops_and_demotes_stable_consumer
        grounds:
          - state_machines.DeprecationPlan.ANNOUNCED_to_SUNSET
          - state_machines.Component.DEPRECATION_ANNOUNCED_to_SUNSET
          - state_machines.Component.STABLE_to_BETA
          - entities.DeprecationPlan.fields.blocked_dependent_count
          - entities.Component.fields.maturity_demotion_reason
          - calculations.deprecation_notice_window
        distinguishing_aspect: |
          A THREE-hop chain rooted in a different trigger (a time-gated DeprecationPlan advance,
          not an acceptance) that terminates in a different terminal observable: the consumer's
          maturity dimension is demoted STABLE->BETA with maturity_demotion_reason
          UPSTREAM_SUNSET while its implementations stay SHIPPED and coverage_state stays PARTIAL
          — the opposite end-state from the breaking-change cascade, which blocks implementations
          and leaves maturity untouched.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z during setup, then advanced to 2026-08-20T00:00:00.000Z"
            - "Team `design-guild`; provider Component `icon-set` EXPERIMENTAL / ACTIVE with no implementations (coverage_state NONE, so required_notice_days == 14)"
            - "consumer Component `menu-button` created with docs_state PUBLISHED, WEB and IOS implementations both SHIPPED on zero-defect AA evidence, promoted EXPERIMENTAL -> BETA -> STABLE (governance_conformance_score 100.00, coverage_state PARTIAL)"
            - "one COMPATIBLE ComponentDependency menu-button -> icon-set pinned to provider major 1"
            - "a DeprecationPlan on the provider with announced_at 2026-08-01, sunset_at 2026-08-20, removal_at 2026-09-25, migration guide PUBLISHED, state ANNOUNCED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Icon Set", slug: "icon-set", owning_team_id: "${team_id}", docs_state: "DRAFT" }
              as: DesignSystemLead
              captures: { c_prov: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Menu Button", slug: "menu-button", owning_team_id: "${team_id}", docs_state: "PUBLISHED" }
              as: DesignSystemLead
              captures: { c_cons: $.data.id }
            - call: "POST /design-system/components/${c_cons}/platform-implementations"
              payload: { platform: "WEB", package_name: "@ds/menu-button-web", package_version: "1.0.0", token_compliance_ratio: 1.00 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { impl_web: $.data.id }
            - call: "POST /design-system/platform-implementations/${impl_web}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/mb-web-auto" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/platform-implementations/${impl_web}/accessibility-audits"
              payload: { method: "MANUAL", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/mb-web-manual" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/platform-implementations/${impl_web}/ship"
              payload: { package_version: "1.0.0", token_compliance_ratio: 1.00 }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/components/${c_cons}/platform-implementations"
              payload: { platform: "IOS", package_name: "DSMenuButton", package_version: "1.0.0", token_compliance_ratio: 1.00 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { impl_ios: $.data.id }
            - call: "POST /design-system/platform-implementations/${impl_ios}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/mb-ios-auto" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/platform-implementations/${impl_ios}/accessibility-audits"
              payload: { method: "MANUAL", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/mb-ios-manual" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/platform-implementations/${impl_ios}/ship"
              payload: { package_version: "1.0.0", token_compliance_ratio: 1.00 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { cons_coverage: $.data.status }
            - call: "POST /design-system/components/${c_cons}/promote-maturity"
              payload: { target_maturity_level: "BETA" }
              as: DesignSystemLead
              as_user_id: "lead-1"
            - call: "POST /design-system/components/${c_cons}/promote-maturity"
              payload: { target_maturity_level: "STABLE" }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { cons_maturity_before: $.data.maturity_level, cons_coverage_before: $.data.coverage_state, cons_score_before: $.data.governance_conformance_score }
            - call: "POST /design-system/components/${c_cons}/dependencies"
              payload: { provider_component_id: "${c_prov}", pinned_provider_major: 1 }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { dep_id: $.data.id }
            - call: "POST /design-system/components/${c_prov}/deprecation-plans"
              payload: { announced_at: "2026-08-01T00:00:00.000Z", sunset_at: "2026-08-20T00:00:00.000Z", removal_at: "2026-09-25T00:00:00.000Z", replacement_component_id: "${c_cons}", migration_guide_url: "https://ds.example.com/migrate/icon-set" }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { plan_id: $.data.id, req_days: $.data.required_notice_days, act_days: $.data.actual_notice_days }
            - call: "POST /design-system/deprecation-plans/${plan_id}/migration-guide"
              payload: { migration_guide_url: "https://ds.example.com/migrate/icon-set", publish: true }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { plan_state_announced: $.data.state, guide_state: $.data.migration_guide_state }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00.000Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /design-system/deprecation-plans/${plan_id}/advance"
              payload: {}
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { plan_state_sunset: $.data.state, blocked_dependents: $.data.blocked_dependent_count }
          assert:
            - "${req_days} == 14 and ${act_days} == 19"
            - "${plan_state_announced} == ANNOUNCED and ${guide_state} == PUBLISHED"
            - "${cons_maturity_before} == STABLE and ${cons_coverage_before} == PARTIAL and ${cons_score_before} == 100.00"
            - "${plan_state_sunset} == SUNSET and ${blocked_dependents} == 1"
            - "Component.${c_prov}.lifecycle_state == SUNSET"
            - "ComponentDependency.${dep_id}.compatibility_state == SUNSET_PROVIDER"
            - "Component.${c_cons}.blocked_dependency_count == 1"
            - "Component.${c_cons}.maturity_level == BETA and Component.${c_cons}.maturity_demotion_reason == UPSTREAM_SUNSET"
            - "PlatformImplementation.${impl_web}.status == SHIPPED and PlatformImplementation.${impl_ios}.status == SHIPPED"
            - "Component.${c_cons}.coverage_state == PARTIAL and Team.${team_id}.blocked_implementation_count == 0"

  # =========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: exception_state_gate_outranks_debt_budget_gate
        grounds:
          - validations[priority=7]
          - validations[priority=30]
          - errors[ERR_INVALID_EXCEPTION_GRANT_STATE]
          - errors[ERR_TEAM_DEBT_BUDGET_EXCEEDED]
          - state_machines.ExceptionGrant.REQUESTED_to_DENIED
        distinguishing_aspect: |
          Category pair `state` (priority 7) vs `business_fiscal` (priority 30) on
          POST /design-system/exception-grants/{id}/decision: the grant is already DENIED AND its
          10.50 points would breach the team's 5.00 budget, so both rules are violated in one
          request and the response MUST be ERR_INVALID_EXCEPTION_GRANT_STATE (409), never
          ERR_TEAM_DEBT_BUDGET_EXCEEDED (422).
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `frugal-team` with debt_budget_points 5.00 and outstanding_debt_points 0.00"
            - "Component `hero-banner` EXPERIMENTAL / ACTIVE"
            - "one ExceptionGrant ONE_OFF_COMPONENT / platform_scope ALL against that component, already moved REQUESTED -> DENIED (debt_points still 0.00). Approving it would freeze 12 * 1.75 * 0.50 = 10.50 points, which exceeds the 5.00 budget."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Frugal Team", slug: "frugal-team", platform_scope: "ALL", debt_budget_points: 5.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Hero Banner", slug: "hero-banner", owning_team_id: "${team_id}", docs_state: "DRAFT" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/exception-grants"
              payload: { requesting_team_id: "${team_id}", substitute_for_component_id: "${comp_id}", exception_kind: "ONE_OFF_COMPONENT", platform_scope: "ALL", justification: "Campaign banner needs a bespoke layout for two weeks.", expires_at: "2026-12-31T00:00:00.000Z" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { grant_id: $.data.id }
            - call: "POST /design-system/exception-grants/${grant_id}/decision"
              payload: { decision: "DENY", decision_notes: "Use the system banner." }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { state_after_deny: $.data.state }
          trigger:
            - call: "POST /design-system/exception-grants/${grant_id}/decision"
              payload: { decision: "APPROVE", decision_notes: "Reversing the denial." }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { err: $.data.error_id }
          assert:
            - "${state_after_deny} == DENIED"
            - "${err} == ERR_INVALID_EXCEPTION_GRANT_STATE"
            - "HTTP status == 409"
            - "ExceptionGrant.${grant_id}.state == DENIED and ExceptionGrant.${grant_id}.debt_points == 0.00"
            - "Team.${team_id}.outstanding_debt_points == 0.00 and Team.${team_id}.debt_state == CLEAR"

      - name: promotion_conformance_gate_outranks_deprecation_in_progress_gate
        grounds:
          - validations[priority=12]
          - validations[priority=15]
          - errors[ERR_A11Y_CONFORMANCE_INSUFFICIENT]
          - errors[ERR_COMPONENT_DEPRECATION_IN_PROGRESS]
          - calculations.a11y_conformance_score
        distinguishing_aspect: |
          A DIFFERENT category pair on a different endpoint: `business_safety` (priority 12) vs
          `business_referential` (priority 15) on POST /design-system/components/{id}/promote-maturity.
          The component's governance_conformance_score is 66.00 (below the 70.00 BETA floor) AND
          it has an ANNOUNCED DeprecationPlan, so the response MUST be
          ERR_A11Y_CONFORMANCE_INSUFFICIENT (422), never ERR_COMPONENT_DEPRECATION_IN_PROGRESS.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; Component `tooltip` EXPERIMENTAL with docs_state DRAFT"
            - "one WEB implementation with three AA audits: AUTOMATED defect_load 40, then AUTOMATED defect_load 0 (so the ship gate passes on the latest row), then MANUAL defect_load 30 — giving latest_evidence 82.00 on the implementation and governance_sweep 66.00 on the component"
            - "that implementation is SHIPPED, so coverage_state == WEB_ONLY and shipped_platform_count == 1 (the coverage gate at priority 21 is satisfied)"
            - "a DeprecationPlan on the same component is ANNOUNCED with a PUBLISHED migration guide, so lifecycle_state == DEPRECATION_ANNOUNCED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Tooltip", slug: "tooltip", owning_team_id: "${team_id}", docs_state: "DRAFT" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/components/${comp_id}/platform-implementations"
              payload: { platform: "WEB", package_name: "@ds/tooltip-web", package_version: "1.0.0", token_compliance_ratio: 0.95 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { impl_id: $.data.id }
            - call: "POST /design-system/platform-implementations/${impl_id}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 4, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/tt-auto-1" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { load_bad: $.data.defect_load }
            - call: "POST /design-system/platform-implementations/${impl_id}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/tt-auto-2" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/platform-implementations/${impl_id}/accessibility-audits"
              payload: { method: "MANUAL", wcag_level: "AA", violations_critical: 3, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/tt-manual-1" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { load_manual: $.data.defect_load }
            - call: "POST /design-system/platform-implementations/${impl_id}/ship"
              payload: { package_version: "1.0.0", token_compliance_ratio: 0.95 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { impl_score: $.data.conformance_score }
            - call: "POST /design-system/components/${comp_id}/deprecation-plans"
              payload: { announced_at: "2026-08-01T00:00:00.000Z", sunset_at: "2026-08-20T00:00:00.000Z", removal_at: "2026-09-25T00:00:00.000Z", migration_guide_url: "https://ds.example.com/migrate/tooltip" }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { plan_id: $.data.id }
            - call: "POST /design-system/deprecation-plans/${plan_id}/migration-guide"
              payload: { migration_guide_url: "https://ds.example.com/migrate/tooltip", publish: true }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { plan_state: $.data.state }
          trigger:
            - call: "POST /design-system/components/${comp_id}/promote-maturity"
              payload: { target_maturity_level: "BETA" }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { err: $.data.error_id }
          assert:
            - "${load_bad} == 40 and ${load_manual} == 30"
            - "${impl_score} == 82.00"
            - "${plan_state} == ANNOUNCED"
            - "${err} == ERR_A11Y_CONFORMANCE_INSUFFICIENT"
            - "HTTP status == 422"
            - "Component.${comp_id}.governance_conformance_score == 66.00"
            - "Component.${comp_id}.maturity_level == EXPERIMENTAL and Component.${comp_id}.maturity_demotion_reason == NONE"
            - "Component.${comp_id}.lifecycle_state == DEPRECATION_ANNOUNCED"

      - name: deprecation_notice_gate_outranks_window_overlap_gate
        grounds:
          - validations[priority=25]
          - validations[priority=26]
          - errors[ERR_DEPRECATION_NOTICE_TOO_SHORT]
          - errors[ERR_DEPRECATION_WINDOW_OVERLAP]
          - calculations.deprecation_notice_window
        distinguishing_aspect: |
          A THIRD distinct category pair — `business_temporal` (priority 25) vs
          `business_constraint` (priority 26) — on POST /design-system/components/{id}/deprecation-plans:
          the second plan gives only 4 notice days against the required 14 AND its half-open
          window [2026-09-01, 2026-11-01) intersects the DRAFT plan's [2026-08-01, 2026-12-01),
          so the response MUST be ERR_DEPRECATION_NOTICE_TOO_SHORT (422), never
          ERR_DEPRECATION_WINDOW_OVERLAP (409).
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; Component `legacy-modal` EXPERIMENTAL / ACTIVE with no implementations, so required_notice_days == 14 + 0 == 14"
            - "one DeprecationPlan left in DRAFT occupying [2026-08-01T00:00:00.000Z, 2026-12-01T00:00:00.000Z) with actual_notice_days 19"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Legacy Modal", slug: "legacy-modal", owning_team_id: "${team_id}", docs_state: "DRAFT" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/components/${comp_id}/deprecation-plans"
              payload: { announced_at: "2026-08-01T00:00:00.000Z", sunset_at: "2026-08-20T00:00:00.000Z", removal_at: "2026-12-01T00:00:00.000Z" }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { plan1_id: $.data.id, plan1_state: $.data.state, plan1_req: $.data.required_notice_days, plan1_act: $.data.actual_notice_days }
          trigger:
            - call: "POST /design-system/components/${comp_id}/deprecation-plans"
              payload: { announced_at: "2026-09-01T00:00:00.000Z", sunset_at: "2026-09-05T00:00:00.000Z", removal_at: "2026-11-01T00:00:00.000Z" }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { err: $.data.error_id }
          assert:
            - "${plan1_state} == DRAFT and ${plan1_req} == 14 and ${plan1_act} == 19"
            - "${err} == ERR_DEPRECATION_NOTICE_TOO_SHORT"
            - "HTTP status == 422"
            - "GET /design-system/components/${comp_id}/deprecation-plans returns total_count == 1 (only ${plan1_id} exists; the rejected plan was not persisted)"
            - "Component.${comp_id}.lifecycle_state == ACTIVE"

  # =========================================================================
  # RULE 6 — boundary_precision_check
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: beta_promotion_at_exact_conformance_floor_seventy
        grounds:
          - calculations.a11y_conformance_score
          - validations[priority=12]
          - state_machines.Component.maturity.EXPERIMENTAL_to_BETA
        distinguishing_aspect: |
          Inclusive boundary EXACTLY AT the BETA_MIN_SCORE constant: the governance_sweep score
          computes to 70.00 (worst AUTOMATED load 30, worst MANUAL load 30 =>
          0.4*30 + 0.6*30 = 30.00 => 100 - 30.00), and because the priority-12 check is
          `>= 70.00` the promotion MUST succeed. Boundary quantity = score in points.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; Component `switch` EXPERIMENTAL / ACTIVE, conformance_baseline_at 2026-08-01T00:00:00.000Z"
            - "one WEB implementation with four AA audits in this order: AUTOMATED critical 3 (defect_load 30), MANUAL critical 3 (defect_load 30), AUTOMATED all-zero (defect_load 0), MANUAL all-zero (defect_load 0)"
            - "the implementation is SHIPPED, so the component's governance sweep takes the WORST row per method inside the baseline window: 30 and 30"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Switch", slug: "switch", owning_team_id: "${team_id}", docs_state: "DRAFT" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id, baseline_at: $.data.conformance_baseline_at }
            - call: "POST /design-system/components/${comp_id}/platform-implementations"
              payload: { platform: "WEB", package_name: "@ds/switch-web", package_version: "2.1.0", token_compliance_ratio: 0.99 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { impl_id: $.data.id }
            - call: "POST /design-system/platform-implementations/${impl_id}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 3, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/sw-auto-1" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { load_auto_bad: $.data.defect_load }
            - call: "GET /design-system/platform-implementations/${impl_id}"
              payload: {}
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { score_after_auto_bad: $.data.conformance_score }
            - call: "POST /design-system/platform-implementations/${impl_id}/accessibility-audits"
              payload: { method: "MANUAL", wcag_level: "AA", violations_critical: 3, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/sw-manual-1" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { load_manual_bad: $.data.defect_load }
            - call: "GET /design-system/platform-implementations/${impl_id}"
              payload: {}
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { score_both_bad: $.data.conformance_score }
