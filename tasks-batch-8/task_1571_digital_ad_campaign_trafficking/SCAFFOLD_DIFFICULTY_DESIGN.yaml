scaffold_difficulty_design:
  # ------------------------------------------------------------------ Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: pacing_projection_lifetime_vs_trailing
        grounds:
          - calculations.pacing_projection
          - entities.LineItem.fields.pacing_projection_impressions
          - entities.LineItem.fields.pacing_projection_trailing_impressions
        distinguishing_aspect: |
          Same delivery data on the same LineItem yields two different projections:
          lifetime-average variant projects 80000 while the trailing-3-day variant
          projects 63333, because the trailing window divides by 3 calendar days
          (missing day counts 0) instead of averaging over elapsed days.
        test_recipe:
          setup:
            - "IO flight 2026-08-01..2026-08-10 (10 days), budget 100000, LOWER_OF"
            - "Line item goal 100000 @ cpm 500, EVEN pacing, LIVE with one LIVE creative"
            - "POSTED snapshots: Aug1 10000/100, Aug2 10000/100, Aug3 6000/60, Aug4 6000/60, Aug5 8000/80"
            - "logical clock = 2026-08-06T00:00:00Z (elapsed 5, remaining 5)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-10", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-10", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_id: $.data.id } }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li_id}", name: "CR1", asset_url: "https://cdn.example.com/a.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr_id: $.data.id } }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "TAG", ad_tag: "<script src=\"https://ad.example.com/tag.js\"></script>" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
            - { call: "POST /delivery-snapshots", payload: { line_item_id: "${li_id}", snapshot_date: "2026-08-01", impressions: 10000, clicks: 100 }, as: Trafficker }
            - { call: "POST /delivery-snapshots", payload: { line_item_id: "${li_id}", snapshot_date: "2026-08-02", impressions: 10000, clicks: 100 }, as: Trafficker }
            - { call: "POST /delivery-snapshots", payload: { line_item_id: "${li_id}", snapshot_date: "2026-08-03", impressions: 6000, clicks: 60 }, as: Trafficker }
            - { call: "POST /delivery-snapshots", payload: { line_item_id: "${li_id}", snapshot_date: "2026-08-04", impressions: 6000, clicks: 60 }, as: Trafficker }
            - { call: "POST /delivery-snapshots", payload: { line_item_id: "${li_id}", snapshot_date: "2026-08-05", impressions: 8000, clicks: 80 }, as: Trafficker }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: AdOpsManager }
          trigger:
            - { call: "GET /line-items/${li_id}", as: Trafficker }
          assert:
            - "LineItem.${li_id}.delivered_impressions == 40000"
            - "LineItem.${li_id}.delivered_spend_cents == 16000"
            - "LineItem.${li_id}.pacing_projection_impressions == 80000"
            - "LineItem.${li_id}.pacing_projection_trailing_impressions == 63333"
            - "pacing_projection_impressions != pacing_projection_trailing_impressions"

      - name: billing_basis_variants_diverge
        grounds:
          - calculations.billing_impressions
          - entities.InsertionOrder.fields.billing_basis
        distinguishing_aspect: |
          Identical delivery (agency 40000, third-party 34000/38000) bills 40000
          under AGENCY_PLATFORM, 34000 under THIRD_PARTY_TAG, and 40000 under
          LOWER_OF when |discrepancy| = 0.05 <= 0.10 (tolerance gate suppresses min).
        test_recipe:
          setup:
            - "Three IOs, identical except billing_basis: AGENCY_PLATFORM, THIRD_PARTY_TAG, LOWER_OF; each flight 2026-08-01..2026-08-10, budget 100000"
            - "Each has one LIVE line item (goal 100000 @ cpm 500) with one POSTED snapshot Aug5: 40000 impressions / 200 clicks"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "A", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-10", billing_basis: "AGENCY_PLATFORM" }, as: AdOpsManager, captures: { io_a: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_a}", name: "LIA", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-10", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_a: $.data.id } }
            - { call: "POST /insertion-orders/${io_a}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li_a}", name: "CRA", asset_url: "https://cdn.example.com/a.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr_a: $.data.id } }
            - { call: "POST /creatives/${cr_a}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_a}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_a}/transition", payload: { action: "TAG", ad_tag: "<script>ta</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li_a}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li_a}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
            - { call: "POST /delivery-snapshots", payload: { line_item_id: "${li_a}", snapshot_date: "2026-08-05", impressions: 40000, clicks: 200 }, as: Trafficker }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "B", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-10", billing_basis: "THIRD_PARTY_TAG" }, as: AdOpsManager, captures: { io_b: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_b}", name: "LIB", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-10", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_b: $.data.id } }
            - { call: "POST /insertion-orders/${io_b}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li_b}", name: "CRB", asset_url: "https://cdn.example.com/b.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr_b: $.data.id } }
            - { call: "POST /creatives/${cr_b}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_b}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_b}/transition", payload: { action: "TAG", ad_tag: "<script>tb</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li_b}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li_b}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
            - { call: "POST /delivery-snapshots", payload: { line_item_id: "${li_b}", snapshot_date: "2026-08-05", impressions: 40000, clicks: 200 }, as: Trafficker }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "C", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-10", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_c: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_c}", name: "LIC", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-10", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_c: $.data.id } }
            - { call: "POST /insertion-orders/${io_c}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li_c}", name: "CRC", asset_url: "https://cdn.example.com/c.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr_c: $.data.id } }
            - { call: "POST /creatives/${cr_c}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_c}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_c}/transition", payload: { action: "TAG", ad_tag: "<script>tc</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li_c}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li_c}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
            - { call: "POST /delivery-snapshots", payload: { line_item_id: "${li_c}", snapshot_date: "2026-08-05", impressions: 40000, clicks: 200 }, as: Trafficker }
            - { call: "POST /reconciliations", payload: { line_item_id: "${li_a}", period_start: "2026-08-01", period_end: "2026-08-10", third_party_impressions: 34000 }, as: BillingManager, captures: { rec_a: $.data.id } }
            - { call: "POST /reconciliations/${rec_a}/transition", payload: { action: "RECONCILE" }, as: BillingManager }
            - { call: "POST /reconciliations", payload: { line_item_id: "${li_b}", period_start: "2026-08-01", period_end: "2026-08-10", third_party_impressions: 34000 }, as: BillingManager, captures: { rec_b: $.data.id } }
            - { call: "POST /reconciliations/${rec_b}/transition", payload: { action: "RECONCILE" }, as: BillingManager }
            - { call: "POST /reconciliations", payload: { line_item_id: "${li_c}", period_start: "2026-08-01", period_end: "2026-08-10", third_party_impressions: 38000 }, as: BillingManager, captures: { rec_c: $.data.id } }
            - { call: "POST /reconciliations/${rec_c}/transition", payload: { action: "RECONCILE" }, as: BillingManager }
          trigger:
            - { call: "GET /reconciliations/${rec_a}", as: BillingManager }
            - { call: "GET /reconciliations/${rec_b}", as: BillingManager }
            - { call: "GET /reconciliations/${rec_c}", as: BillingManager }
          assert:
            - "Reconciliation.${rec_a}.billing_impressions == 40000"
            - "Reconciliation.${rec_a}.billable_cents == 20000"
            - "Reconciliation.${rec_a}.discrepancy_pct == -0.15"
            - "Reconciliation.${rec_b}.billing_impressions == 34000"
            - "Reconciliation.${rec_b}.billable_cents == 17000"
            - "Reconciliation.${rec_c}.discrepancy_pct == -0.05"
            - "Reconciliation.${rec_c}.billing_impressions == 40000"
            - "Reconciliation.${rec_a}.billing_impressions != Reconciliation.${rec_b}.billing_impressions"

  # ------------------------------------------------------------------ Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: billing_lower_of_gated_min_branch
        grounds:
          - calculations.billing_impressions
          - validations[priority=11]
        distinguishing_aspect: |
          Mode (a): billing_impressions combines 4 inputs (agency sum over
          POSTED-only snapshots, third_party, basis, tolerance) with a conditional
          branch on |discrepancy| and a nested min; a VOIDED snapshot is excluded,
          yielding agency 40000, discrepancy -0.15, billing min(40000, 34000) = 34000.
        test_recipe:
          setup:
            - "LOWER_OF IO, flight 2026-08-01..2026-08-10; LIVE line item goal 100000 @ cpm 500"
            - "Snapshots: Aug3 25000/125 POSTED, Aug4 15000/75 POSTED, Aug5 5000/25 then VOIDED → agency base 40000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-10", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-10", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_id: $.data.id } }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li_id}", name: "CR1", asset_url: "https://cdn.example.com/a.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr_id: $.data.id } }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "TAG", ad_tag: "<script>t</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
            - { call: "POST /delivery-snapshots", payload: { line_item_id: "${li_id}", snapshot_date: "2026-08-03", impressions: 25000, clicks: 125 }, as: Trafficker }
            - { call: "POST /delivery-snapshots", payload: { line_item_id: "${li_id}", snapshot_date: "2026-08-04", impressions: 15000, clicks: 75 }, as: Trafficker }
            - { call: "POST /delivery-snapshots", payload: { line_item_id: "${li_id}", snapshot_date: "2026-08-05", impressions: 5000, clicks: 25 }, as: Trafficker, captures: { snap_id: $.data.id } }
            - { call: "POST /delivery-snapshots/${snap_id}/transition", payload: { action: "VOID" }, as: Trafficker }
            - { call: "POST /reconciliations", payload: { line_item_id: "${li_id}", period_start: "2026-08-01", period_end: "2026-08-10", third_party_impressions: 34000 }, as: BillingManager, captures: { rec_id: $.data.id } }
          trigger:
            - { call: "POST /reconciliations/${rec_id}/transition", payload: { action: "RECONCILE" }, as: BillingManager }
          assert:
            - "Reconciliation.${rec_id}.agency_impressions == 40000"
            - "Reconciliation.${rec_id}.discrepancy_pct == -0.15"
            - "Reconciliation.${rec_id}.billing_impressions == 34000"
            - "Reconciliation.${rec_id}.billable_cents == 17000"
            - "Reconciliation.${rec_id}.status == RECONCILED"

      - name: wrap_net_billable_per_recon_rounding
        grounds:
          - calculations.wrap_report_totals
          - calculations.billing_impressions
          - entities.WrapReport.fields.net_billable_cents
        distinguishing_aspect: |
          Mode (b): billable cents are rounded per reconciliation FIRST then summed
          (250 + 250 = 500); sum-then-round of the raw products would give 501.
          Net billable subtracts APPLIED make-good credit 75 → 425.
        test_recipe:
          setup:
            - "AGENCY_PLATFORM IO, flight 2026-08-01..2026-08-10, budget 100000"
            - "LI1 and LI2, each goal 100000 @ cpm 250 (budget 25000 each), LIVE, one POSTED snapshot Aug3 of 1001 impressions / 50 clicks each (spend 250 each)"
            - "BREACH verification report on LI1 (measured 100000, viewable 69000, ivt 2100 → max credit 775) with a CREDIT make-good of 75 APPLIED"
            - "Each line item reconciled [2026-08-01, 2026-08-10): agency 1001 → billable 250; both LOCKED (reconciled by bm-1, locked by bm-2)"
            - "Clock at 2026-08-11; both line items COMPLETED; IO COMPLETED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-10", billing_basis: "AGENCY_PLATFORM" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 250, start_date: "2026-08-01", end_date: "2026-08-10", pacing_mode: "EVEN" }, as: Trafficker, captures: { li1: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI2", goal_impressions: 100000, cpm_rate_cents: 250, start_date: "2026-08-01", end_date: "2026-08-10", pacing_mode: "EVEN" }, as: Trafficker, captures: { li2: $.data.id } }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li1}", name: "CR1", asset_url: "https://cdn.example.com/1.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr1: $.data.id } }
            - { call: "POST /creatives/${cr1}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr1}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr1}/transition", payload: { action: "TAG", ad_tag: "<script>1</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li1}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li1}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
            - { call: "POST /creatives", payload: { line_item_id: "${li2}", name: "CR2", asset_url: "https://cdn.example.com/2.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr2: $.data.id } }
            - { call: "POST /creatives/${cr2}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr2}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr2}/transition", payload: { action: "TAG", ad_tag: "<script>2</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li2}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li2}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "ACTIVATE" }, as: AdOpsManager }
            - { call: "POST /delivery-snapshots", payload: { line_item_id: "${li1}", snapshot_date: "2026-08-03", impressions: 1001, clicks: 50 }, as: Trafficker }
            - { call: "POST /delivery-snapshots", payload: { line_item_id: "${li2}", snapshot_date: "2026-08-03", impressions: 1001, clicks: 50 }, as: Trafficker }
            - { call: "POST /verification-reports", payload: { line_item_id: "${li1}", vendor: "MOAT", period_start: "2026-08-01", period_end: "2026-08-10", measured_impressions: 100000, viewable_impressions: 69000, ivt_impressions: 2100 }, as: VerificationAnalyst, as_user_id: "va-1", captures: { vr_id: $.data.id } }
            - { call: "POST /make-goods", payload: { verification_report_id: "${vr_id}", kind: "CREDIT", credit_cents: 75 }, as: VerificationAnalyst, as_user_id: "va-1", captures: { mg_id: $.data.id } }
            - { call: "POST /make-goods/${mg_id}/transition", payload: { action: "APPROVE" }, as: BillingManager, as_user_id: "bm-2" }
            - { call: "POST /make-goods/${mg_id}/transition", payload: { action: "APPLY" }, as: BillingManager, as_user_id: "bm-2" }
            - { call: "POST /reconciliations", payload: { line_item_id: "${li1}", period_start: "2026-08-01", period_end: "2026-08-10", third_party_impressions: 900 }, as: BillingManager, captures: { rec1: $.data.id } }
            - { call: "POST /reconciliations/${rec1}/transition", payload: { action: "RECONCILE" }, as: BillingManager, as_user_id: "bm-1" }
            - { call: "POST /reconciliations/${rec1}/transition", payload: { action: "LOCK" }, as: BillingManager, as_user_id: "bm-2" }
            - { call: "POST /reconciliations", payload: { line_item_id: "${li2}", period_start: "2026-08-01", period_end: "2026-08-10", third_party_impressions: 900 }, as: BillingManager, captures: { rec2: $.data.id } }
            - { call: "POST /reconciliations/${rec2}/transition", payload: { action: "RECONCILE" }, as: BillingManager, as_user_id: "bm-1" }
            - { call: "POST /reconciliations/${rec2}/transition", payload: { action: "LOCK" }, as: BillingManager, as_user_id: "bm-2" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /line-items/${li1}/transition", payload: { action: "COMPLETE" }, as: Trafficker }
            - { call: "POST /line-items/${li2}/transition", payload: { action: "COMPLETE" }, as: Trafficker }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "COMPLETE" }, as: AdOpsManager }
          trigger:
            - { call: "POST /wrap-reports", payload: { io_id: "${io_id}", attribution_model: "LINEAR_CLICKS", total_conversions: 10 }, as: BillingManager, captures: { wrap_id: $.data.id } }
          assert:
            - "WrapReport.${wrap_id}.total_delivered_impressions == 2002"
            - "WrapReport.${wrap_id}.total_spend_cents == 500"
            - "WrapReport.${wrap_id}.total_billable_cents == 500"
            - "WrapReport.${wrap_id}.total_applied_credit_cents == 75"
            - "WrapReport.${wrap_id}.net_billable_cents == 425"
            - "WrapReport.${wrap_id}.attribution == [{li1, weight 0.5, attributed_conversions 5}, {li2, weight 0.5, attributed_conversions 5}]"

  # ------------------------------------------------------------------ Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: creative_qa_revision_loop
        grounds:
          - state_machines.Creative.IN_QA_to_QA_FAILED
          - state_machines.Creative.QA_FAILED_to_IN_QA
        distinguishing_aspect: |
          Creative machine is cyclic: IN_QA → QA_FAILED → (REVISE) → IN_QA, and the
          loop clears qa_failure_reason; a second PASS_QA + TAG then succeeds on the
          same entity — a purely linear machine could not express this.
        test_recipe:
          setup:
            - "IO approved with one DRAFT line item; creative uploaded"
          setup_api_calls:
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_id: $.data.id } }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li_id}", name: "CR1", asset_url: "https://cdn.example.com/a.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr_id: $.data.id } }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
          trigger:
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "FAIL_QA", qa_failure_reason: "click macro broken" }, as: Trafficker, captures: { st1: $.data.status } }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "REVISE" }, as: Trafficker, captures: { st2: $.data.status, reason2: $.data.qa_failure_reason } }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "TAG", ad_tag: "<script>t</script>" }, as: Trafficker, captures: { st4: $.data.status } }
          assert:
            - "st1 == QA_FAILED"
            - "st2 == IN_QA and reason2 == null"
            - "st4 == TAGGED"

      - name: reconciliation_reopen_recompute_loop
        grounds:
          - state_machines.Reconciliation.RECONCILED_to_OPEN
          - state_machines.Reconciliation.OPEN_to_RECONCILED
          - calculations.billing_impressions
        distinguishing_aspect: |
          Reconciliation machine is cyclic (OPEN → RECONCILED → OPEN → RECONCILED)
          and the second RECONCILE recomputes from current POSTED snapshots: after
          voiding the only snapshot, agency drops to 0 and LOWER_OF bills 0 — a
          different result than the first pass on the same entity.
        test_recipe:
          setup:
            - "LOWER_OF IO; LIVE line item goal 100000 @ cpm 500; one POSTED snapshot Aug5 40000/200"
            - "Reconciliation [2026-08-01, 2026-08-10) with third_party 34000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-10", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-10", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_id: $.data.id } }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li_id}", name: "CR1", asset_url: "https://cdn.example.com/a.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr_id: $.data.id } }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "TAG", ad_tag: "<script>t</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
            - { call: "POST /delivery-snapshots", payload: { line_item_id: "${li_id}", snapshot_date: "2026-08-05", impressions: 40000, clicks: 200 }, as: Trafficker, captures: { snap_id: $.data.id } }
            - { call: "POST /reconciliations", payload: { line_item_id: "${li_id}", period_start: "2026-08-01", period_end: "2026-08-10", third_party_impressions: 34000 }, as: BillingManager, captures: { rec_id: $.data.id } }
          trigger:
            - { call: "POST /reconciliations/${rec_id}/transition", payload: { action: "RECONCILE" }, as: BillingManager, as_user_id: "bm-1", captures: { b1: $.data.billing_impressions } }
            - { call: "POST /reconciliations/${rec_id}/transition", payload: { action: "REOPEN" }, as: BillingManager }
            - { call: "POST /delivery-snapshots/${snap_id}/transition", payload: { action: "VOID" }, as: Trafficker }
            - { call: "POST /reconciliations/${rec_id}/transition", payload: { action: "RECONCILE" }, as: BillingManager, as_user_id: "bm-1", captures: { a2: $.data.agency_impressions, d2: $.data.discrepancy_pct, b2: $.data.billing_impressions, c2: $.data.billable_cents } }
          assert:
            - "b1 == 34000"
            - "a2 == 0"
            - "d2 == null"
            - "b2 == 0"
            - "c2 == 0"
            - "Reconciliation.${rec_id}.status == RECONCILED"

  # ------------------------------------------------------------------ Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: ivt_breach_fraud_cascade_depth3
        grounds:
          - calculations.verification_assessment
          - state_machines.LineItem.LIVE_to_PAUSED
          - state_machines.Creative.LIVE_to_PAUSED
        distinguishing_aspect: |
          Depth-3 chain triggered by filing a verification report: report assessment
          BREACH mutates LineItem.fraud_posture (hop 1); the posture mutation itself
          forces LineItem LIVE→PAUSED (hop 2); the pause cascades to the LIVE
          creative → PAUSED (hop 3). Viewability-only breaches do NOT fire it.
        test_recipe:
          setup:
            - "IO approved; line item LIVE with one LIVE creative; fraud_posture CLEAR"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_id: $.data.id } }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li_id}", name: "CR1", asset_url: "https://cdn.example.com/a.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr_id: $.data.id } }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "TAG", ad_tag: "<script>t</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
          trigger:
            - { call: "POST /verification-reports", payload: { line_item_id: "${li_id}", vendor: "IAS", period_start: "2026-08-01", period_end: "2026-08-07", measured_impressions: 100000, viewable_impressions: 80000, ivt_impressions: 5000 }, as: VerificationAnalyst, as_user_id: "va-1", captures: { vr_id: $.data.id, assess: $.data.assessment } }
          assert:
            - "assess == BREACH (ivt_rate 0.05 > 0.02 while viewability 0.8 passes)"
            - "VerificationReport.${vr_id}.make_good_max_credit_cents == 2500"
            - "LineItem.${li_id}.fraud_posture == BREACH"
            - "LineItem.${li_id}.status == PAUSED"
            - "Creative.${cr_id}.status == PAUSED"

      - name: io_cancel_two_hop_cascade
        grounds:
          - state_machines.InsertionOrder.ACTIVE_to_CANCELLED
          - state_machines.LineItem.LIVE_to_CANCELLED
          - state_machines.Creative.TAGGED_to_ARCHIVED
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (IO CANCEL): IO → each non-terminal
          LineItem → CANCELLED (hop 1), and each line-item cancellation itself
          archives its non-terminal creatives (hop 2), including a TAGGED creative
          on a DRAFT line item that was never launched.
        test_recipe:
          setup:
            - "IO ACTIVE; LI1 LIVE with one LIVE creative; LI2 DRAFT with one TAGGED creative"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker, captures: { li1: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI2", goal_impressions: 50000, cpm_rate_cents: 400, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "ASAP" }, as: Trafficker, captures: { li2: $.data.id } }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li1}", name: "CR1", asset_url: "https://cdn.example.com/1.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr1: $.data.id } }
            - { call: "POST /creatives/${cr1}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr1}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr1}/transition", payload: { action: "TAG", ad_tag: "<script>1</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li1}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li1}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
            - { call: "POST /creatives", payload: { line_item_id: "${li2}", name: "CR2", asset_url: "https://cdn.example.com/2.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr2: $.data.id } }
            - { call: "POST /creatives/${cr2}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr2}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr2}/transition", payload: { action: "TAG", ad_tag: "<script>2</script>" }, as: Trafficker }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "ACTIVATE" }, as: AdOpsManager }
          trigger:
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "CANCEL" }, as: AdOpsManager }
          assert:
            - "InsertionOrder.${io_id}.status == CANCELLED"
            - "LineItem.${li1}.status == CANCELLED"
            - "LineItem.${li2}.status == CANCELLED"
            - "Creative.${cr1}.status == ARCHIVED"
            - "Creative.${cr2}.status == ARCHIVED"
            - "InsertionOrder.${io_id}.booked_budget_cents == 0"

  # ------------------------------------------------------------------ Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_patch
        grounds:
          - validations[priority=6]
          - validations[priority=23]
        distinguishing_aspect: |
          Pair state × business_fiscal: PATCH on a CANCELLED line item whose new
          goal would also blow the IO budget returns ERR_INVALID_STATE (priority 6),
          never ERR_BUDGET_EXCEEDED (priority 23).
        test_recipe:
          setup:
            - "IO approved; line item (goal 100000 @ 500, budget 50000) CANCELLED from DRAFT"
          setup_api_calls:
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_id: $.data.id } }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "CANCEL" }, as: Trafficker }
            - { call: "GET /line-items/${li_id}", as: Trafficker, captures: { li_v: $.data.version } }
          trigger:
            - { call: "PATCH /line-items/${li_id}", payload: { expected_line_item_version: "${li_v}", goal_impressions: 1000000 }, as: Trafficker, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE"
            - "http status == 409"
            - "LineItem.${li_id}.goal_impressions == 100000 (unchanged)"

      - name: schema_beats_temporal_on_report_filing
        grounds:
          - validations[priority=3]
          - validations[priority=12]
        distinguishing_aspect: |
          Pair business_constraint(schema) × business_temporal: a verification
          report whose body is internally inconsistent (viewable 200 > measured 100)
          AND whose period overlaps an existing report returns ERR_INVALID_REQUEST
          (priority 3), never ERR_VERIFICATION_PERIOD_OVERLAP (priority 12).
        test_recipe:
          setup:
            - "LIVE line item; existing MOAT report with closed period [2026-08-01, 2026-08-05] (PASS numbers)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_id: $.data.id } }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li_id}", name: "CR1", asset_url: "https://cdn.example.com/a.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr_id: $.data.id } }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "TAG", ad_tag: "<script>t</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
            - { call: "POST /verification-reports", payload: { line_item_id: "${li_id}", vendor: "MOAT", period_start: "2026-08-01", period_end: "2026-08-05", measured_impressions: 1000, viewable_impressions: 800, ivt_impressions: 0 }, as: VerificationAnalyst, as_user_id: "va-1" }
          trigger:
            - { call: "POST /verification-reports", payload: { line_item_id: "${li_id}", vendor: "MOAT", period_start: "2026-08-03", period_end: "2026-08-08", measured_impressions: 100, viewable_impressions: 200, ivt_impressions: 0 }, as: VerificationAnalyst, as_user_id: "va-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "http status == 400"

  # ------------------------------------------------------------------ Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: frequency_cap_exact_boundary
        grounds:
          - calculations.frequency_cap_check
          - validations[priority=21]
        distinguishing_aspect: |
          Metric: per-user impression count. With cap 3 / 24h, the 3rd in-window
          event is accepted (count 2 < 3 before write) and the 4th rejected
          (count 3 >= 3); an event exactly 24h old falls OUTSIDE the half-open
          window [now−24h, now) and does not count.
        test_recipe:
          setup:
            - "LIVE line item with frequency_cap_max_impressions 3, frequency_cap_window_hours 24"
            - "logical clock 2026-08-05T12:00:00Z"
            - "existing events for user_key u1: one at 2026-08-04T12:00:00Z (exactly 24h old, excluded), then 2026-08-05T10:00 / 11:00 / 11:30 (in-window)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN", frequency_cap_max_impressions: 3, frequency_cap_window_hours: 24 }, as: Trafficker, captures: { li_id: $.data.id } }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li_id}", name: "CR1", asset_url: "https://cdn.example.com/a.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr_id: $.data.id } }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "TAG", ad_tag: "<script>t</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T12:00:00Z" }, as: AdOpsManager }
            - { call: "POST /impression-events", payload: { line_item_id: "${li_id}", user_key: "u1", occurred_at: "2026-08-04T12:00:00Z" }, as: Trafficker }
            - { call: "POST /impression-events", payload: { line_item_id: "${li_id}", user_key: "u1", occurred_at: "2026-08-05T10:00:00Z" }, as: Trafficker }
            - { call: "POST /impression-events", payload: { line_item_id: "${li_id}", user_key: "u1", occurred_at: "2026-08-05T11:00:00Z" }, as: Trafficker }
            - { call: "POST /impression-events", payload: { line_item_id: "${li_id}", user_key: "u1", occurred_at: "2026-08-05T11:30:00Z" }, as: Trafficker }
          trigger:
            - { call: "POST /impression-events", payload: { line_item_id: "${li_id}", user_key: "u1", occurred_at: "2026-08-05T11:45:00Z" }, as: Trafficker, captures: { err: $.data.error_id } }
            - { call: "GET /line-items/${li_id}/impression-events", payload: { user_key: "u1" }, as: Trafficker, captures: { evts: $.data } }
          assert:
            - "err == ERR_FREQUENCY_CAP_EXCEEDED"
            - "http status == 422"
            - "evts contains exactly 4 entries (the exactly-24h-old event was stored but excluded from the window count; the 4th in-window event was rejected)"
      - name: verification_threshold_equality_pass
        grounds:
          - calculations.verification_assessment
          - entities.VerificationReport.fields.assessment
        distinguishing_aspect: |
          Metric: vendor rates. viewability_rate exactly == threshold (0.70) and
          ivt_rate exactly == threshold (0.02) both PASS — breach is strictly
          viewability < threshold OR ivt > threshold; no fraud cascade fires.
        test_recipe:
          setup:
            - "IO with default thresholds (viewability 0.70, ivt 0.02); LIVE line item with LIVE creative"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_id: $.data.id } }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li_id}", name: "CR1", asset_url: "https://cdn.example.com/a.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr_id: $.data.id } }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "TAG", ad_tag: "<script>t</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
          trigger:
            - { call: "POST /verification-reports", payload: { line_item_id: "${li_id}", vendor: "DOUBLEVERIFY", period_start: "2026-08-01", period_end: "2026-08-07", measured_impressions: 100000, viewable_impressions: 70000, ivt_impressions: 2000 }, as: VerificationAnalyst, as_user_id: "va-1", captures: { vr_id: $.data.id } }
          assert:
            - "VerificationReport.${vr_id}.viewability_rate == 0.7"
            - "VerificationReport.${vr_id}.ivt_rate == 0.02"
            - "VerificationReport.${vr_id}.assessment == PASS"
            - "LineItem.${li_id}.fraud_posture == CLEAR"
            - "LineItem.${li_id}.status == LIVE"

  # ------------------------------------------------------------------ Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: line_item_launch_requires_io_approved
        grounds:
          - state_machines.LineItem.TRAFFICKED_to_LIVE
          - validations[priority=14]
        distinguishing_aspect: |
          Pair LineItem→InsertionOrder: LAUNCH is rejected with ERR_IO_NOT_APPROVED
          while the parent IO is still DRAFT, even though the line item itself is
          TRAFFICKED with a TAGGED creative and inside its flight window.
        test_recipe:
          setup:
            - "IO DRAFT (never approved); line item TRAFFICKED with one TAGGED creative; clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_id: $.data.id } }
            - { call: "POST /creatives", payload: { line_item_id: "${li_id}", name: "CR1", asset_url: "https://cdn.example.com/a.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr_id: $.data.id } }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "TAG", ad_tag: "<script>t</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
          trigger:
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "LAUNCH" }, as: Trafficker, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_IO_NOT_APPROVED"
            - "LineItem.${li_id}.status == TRAFFICKED"
            - "Creative.${cr_id}.status == TAGGED (no flip to LIVE)"

      - name: creative_activate_requires_line_item_live
        grounds:
          - state_machines.Creative.TAGGED_to_LIVE
          - validations[priority=15]
        distinguishing_aspect: |
          Pair Creative→LineItem (different pair than launch→IO): manual ACTIVATE of
          a TAGGED creative is rejected with ERR_LINE_ITEM_NOT_LIVE while the parent
          line item is merely TRAFFICKED; the creative may reach LIVE only via the
          LAUNCH side effect or after the line item is LIVE.
        test_recipe:
          setup:
            - "IO APPROVED; line item TRAFFICKED (creative CR1 TAGGED); second creative CR2 also TAGGED, line item still not launched"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_id: $.data.id } }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li_id}", name: "CR1", asset_url: "https://cdn.example.com/1.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr1: $.data.id } }
            - { call: "POST /creatives/${cr1}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr1}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr1}/transition", payload: { action: "TAG", ad_tag: "<script>1</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /creatives", payload: { line_item_id: "${li_id}", name: "CR2", asset_url: "https://cdn.example.com/2.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr2: $.data.id } }
            - { call: "POST /creatives/${cr2}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr2}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr2}/transition", payload: { action: "TAG", ad_tag: "<script>2</script>" }, as: Trafficker }
          trigger:
            - { call: "POST /creatives/${cr2}/transition", payload: { action: "ACTIVATE" }, as: Trafficker, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_LINE_ITEM_NOT_LIVE"
            - "Creative.${cr2}.status == TAGGED"

  # ------------------------------------------------------------------ Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: reconciliation_periods_half_open_adjacency
        grounds:
          - validations[priority=11]
          - calculations.billing_impressions
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [period_start, period_end) on the line
          item's reconciliation ledger — a new period starting exactly at the
          previous period_end (2026-08-10) is ACCEPTED, while one overlapping by
          a single day (2026-08-09) is rejected with ERR_RECONCILIATION_OVERLAP.
        test_recipe:
          setup:
            - "LIVE line item; existing reconciliation [2026-08-01, 2026-08-10)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_id: $.data.id } }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li_id}", name: "CR1", asset_url: "https://cdn.example.com/a.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr_id: $.data.id } }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "TAG", ad_tag: "<script>t</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
            - { call: "POST /reconciliations", payload: { line_item_id: "${li_id}", period_start: "2026-08-01", period_end: "2026-08-10", third_party_impressions: 100 }, as: BillingManager, captures: { rec1: $.data.id } }
          trigger:
            - { call: "POST /reconciliations", payload: { line_item_id: "${li_id}", period_start: "2026-08-10", period_end: "2026-08-20", third_party_impressions: 100 }, as: BillingManager, captures: { rec2: $.data.id } }
            - { call: "POST /reconciliations", payload: { line_item_id: "${li_id}", period_start: "2026-08-09", period_end: "2026-08-15", third_party_impressions: 100 }, as: BillingManager, captures: { err: $.data.error_id } }
          assert:
            - "rec2 creation succeeded (201, adjacency allowed under half-open semantics)"
            - "err == ERR_RECONCILIATION_OVERLAP"

      - name: verification_periods_closed_touch_conflict
        grounds:
          - validations[priority=12]
          - entities.VerificationReport.fields.period_end
        distinguishing_aspect: |
          Interval semantics differ from reconciliations: CLOSED [start, end] per
          (line_item, vendor) — a report starting on the previous report's end date
          (2026-08-05) CONFLICTS, and the same date range under a different vendor
          is independent (no conflict).
        test_recipe:
          setup:
            - "LIVE line item; existing MOAT report [2026-08-01, 2026-08-05] (PASS numbers)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_id: $.data.id } }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li_id}", name: "CR1", asset_url: "https://cdn.example.com/a.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr_id: $.data.id } }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "TAG", ad_tag: "<script>t</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
            - { call: "POST /verification-reports", payload: { line_item_id: "${li_id}", vendor: "MOAT", period_start: "2026-08-01", period_end: "2026-08-05", measured_impressions: 1000, viewable_impressions: 800, ivt_impressions: 0 }, as: VerificationAnalyst, as_user_id: "va-1" }
          trigger:
            - { call: "POST /verification-reports", payload: { line_item_id: "${li_id}", vendor: "MOAT", period_start: "2026-08-06", period_end: "2026-08-08", measured_impressions: 1000, viewable_impressions: 800, ivt_impressions: 0 }, as: VerificationAnalyst, as_user_id: "va-1", captures: { vr2: $.data.id } }
            - { call: "POST /verification-reports", payload: { line_item_id: "${li_id}", vendor: "MOAT", period_start: "2026-08-05", period_end: "2026-08-07", measured_impressions: 1000, viewable_impressions: 800, ivt_impressions: 0 }, as: VerificationAnalyst, as_user_id: "va-1", captures: { err: $.data.error_id } }
            - { call: "POST /verification-reports", payload: { line_item_id: "${li_id}", vendor: "IAS", period_start: "2026-08-03", period_end: "2026-08-06", measured_impressions: 1000, viewable_impressions: 800, ivt_impressions: 0 }, as: VerificationAnalyst, as_user_id: "va-1", captures: { vr3: $.data.id } }
          assert:
            - "vr2 created (201): start 2026-08-06 is clear of closed interval ending 2026-08-05"
            - "err == ERR_VERIFICATION_PERIOD_OVERLAP (touching at 2026-08-05 conflicts under closed semantics)"
            - "vr3 created (201): overlapping dates but vendor IAS is an independent stream"

  # ------------------------------------------------------------------ Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: snapshot_post_void_restores_delivered
        grounds:
          - invariants[delivered_volume_post_void]
          - calculations.snapshot_spend
          - state_machines.DeliverySnapshot.POSTED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity: delivered volume/spend. POST snapshot (5000 imps, 50
          clicks, spend 2500) followed by VOID returns delivered_impressions,
          delivered_clicks and delivered_spend_cents exactly to their pre-pair
          value 0 — no drift.
        test_recipe:
          setup:
            - "LIVE line item goal 100000 @ cpm 500; no snapshots yet (delivered 0)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_id: $.data.id } }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li_id}", name: "CR1", asset_url: "https://cdn.example.com/a.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr_id: $.data.id } }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "TAG", ad_tag: "<script>t</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
          trigger:
            - { call: "POST /delivery-snapshots", payload: { line_item_id: "${li_id}", snapshot_date: "2026-08-03", impressions: 5000, clicks: 50 }, as: Trafficker, captures: { snap_id: $.data.id, spend: $.data.spend_cents } }
            - { call: "POST /delivery-snapshots/${snap_id}/transition", payload: { action: "VOID" }, as: Trafficker, captures: { st: $.data.status } }
            - { call: "GET /line-items/${li_id}", as: Trafficker, captures: { di: $.data.delivered_impressions, dc: $.data.delivered_clicks, ds: $.data.delivered_spend_cents } }
          assert:
            - "spend == 2500"
            - "st == VOIDED"
            - "di == 0"
            - "dc == 0"
            - "ds == 0"

      - name: make_good_apply_reverse_restores_credit
        grounds:
          - invariants[applied_credit_apply_reverse]
          - state_machines.MakeGood.APPROVED_to_APPLIED
          - state_machines.MakeGood.APPLIED_to_REVERSED
        distinguishing_aspect: |
          Conserved quantity: applied credit cents on the InsertionOrder (different
          quantity than delivered volume). APPLY(2000) raises
          total_applied_credit_cents to 2000; REVERSE returns it exactly to 0.
        test_recipe:
          setup:
            - "LIVE line item (goal 100000 @ cpm 500) under LOWER_OF IO; IVT-only BREACH report (measured 100000, viewable 80000, ivt 5000 → max credit 2500); CREDIT make-good 2000 proposed by va-1, approved by bm-2"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_id: $.data.id } }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li_id}", name: "CR1", asset_url: "https://cdn.example.com/a.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr_id: $.data.id } }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "TAG", ad_tag: "<script>t</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
            - { call: "POST /verification-reports", payload: { line_item_id: "${li_id}", vendor: "IAS", period_start: "2026-08-01", period_end: "2026-08-07", measured_impressions: 100000, viewable_impressions: 80000, ivt_impressions: 5000 }, as: VerificationAnalyst, as_user_id: "va-1", captures: { vr_id: $.data.id } }
            - { call: "POST /make-goods", payload: { verification_report_id: "${vr_id}", kind: "CREDIT", credit_cents: 2000 }, as: VerificationAnalyst, as_user_id: "va-1", captures: { mg_id: $.data.id } }
            - { call: "POST /make-goods/${mg_id}/transition", payload: { action: "APPROVE" }, as: BillingManager, as_user_id: "bm-2" }
          trigger:
            - { call: "POST /make-goods/${mg_id}/transition", payload: { action: "APPLY" }, as: BillingManager, as_user_id: "bm-2" }
            - { call: "GET /insertion-orders/${io_id}", as: BillingManager, captures: { cr_after_apply: $.data.total_applied_credit_cents } }
            - { call: "POST /make-goods/${mg_id}/transition", payload: { action: "REVERSE" }, as: BillingManager, as_user_id: "bm-2", captures: { mg_status: $.data.status } }
            - { call: "GET /insertion-orders/${io_id}", as: BillingManager, captures: { cr_after_reverse: $.data.total_applied_credit_cents } }
          assert:
            - "cr_after_apply == 2000"
            - "mg_status == REVERSED"
            - "cr_after_reverse == 0"
