          Mode (c) instance - a circular-looking dependency whose evaluation order the scaffold pins:
          term length depends on surplus, surplus on required_refresher_hours, that on renewal_tier, and
          renewal_tier on reinstatement_count which THIS SAME renewal increments. With 11.3 accrued hours
