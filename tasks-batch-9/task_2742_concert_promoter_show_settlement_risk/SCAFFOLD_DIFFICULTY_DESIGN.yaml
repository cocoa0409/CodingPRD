              as: TalentBuyer
            - call: "POST /ticket-tiers/${ga_id}/sales"
              payload: { qty: 600 }
              as: TalentBuyer
            - call: "POST /ticket-tiers/${pit_id}/sales"
              payload: { qty: 400 }
              as: TalentBuyer
            - call: "POST /vendor-invoices"
              payload: { show_id: "${sh_id}", budget_line_id: "${bl_prod_id}", vendor_name: "Cascade Staging", amount_cents: 1650000, invoice_date: "2026-10-09", documentation_ref: "INV-PROD-0001" }
              as: TourAccountant
              as_user_id: "acct-alice"
              captures: { inv_prod_id: $.data.id }
            - call: "POST /vendor-invoices/${inv_prod_id}/verify"
              payload: {}
              as: TourAccountant
              as_user_id: "acct-alice"
            - call: "POST /vendor-invoices/${inv_prod_id}/approve"
              payload: {}
              as: TourAccountant
              as_user_id: "acct-bob"
            - call: "POST /vendor-invoices"
              payload: { show_id: "${sh_id}", budget_line_id: "${bl_mkt_id}", vendor_name: "Northline Media", amount_cents: 900000, invoice_date: "2026-10-09", documentation_ref: "INV-MKT-0001" }
