          assert:
            - "err == ERR_INSPECTION_DATE_INVALID with HTTP 422 (scheduled_date 2026-07-01 < now 2026-08-01)"

      - name: v_amend_eligibility_violation_rejected
        claim_type: violation_to_error
        grounds:
          - calculations.eligibility_size_vs_load
          - "errors[ERR_PRODUCTION_EXCEEDS_LOAD]"
          - "errors[ERR_SIZE_EXCEEDS_CLASS_CAP]"
        distinguishing_aspect: "Amend re-runs eligibility as a request rejection (unlike the completeness path which DENIES): an over-cap production estimate yields 422 ERR_PRODUCTION_EXCEEDS_LOAD and an over-class-cap size yields 422 ERR_SIZE_EXCEEDS_CLASS_CAP, each leaving the stored design untouched."
        test_recipe:
          setup:
            - "Program cap 1000000; feeder peak 10000000 pre 0; transformer nameplate 10000000 pre 0."
            - "Account P (COMMERCIAL, usage 20000000) with app1 10000 W / production 15000000 in CAPACITY_RESERVED; account R (RESIDENTIAL, usage 20000000) with app2 10000 W / production 15000000 in CAPACITY_RESERVED."
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "AV", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog: $.data.id } }
            - { call: "POST /tariff-schedules", payload: { program_id: "${prog}", schedule_code: "AV-2026", effective_from: "2026-01-01T00:00:00Z", import_rate_millicents_per_kwh: 30000, export_rate_millicents_per_kwh: 12000, net_surplus_rate_millicents_per_kwh: 4500 }, as: ProgramAdministrator }
            - { call: "POST /feeders", payload: { feeder_code: "F-AV", peak_load_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { feed: $.data.id } }
            - { call: "POST /service-transformers", payload: { feeder_id: "${feed}", transformer_code: "T-AV", nameplate_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { tx: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "AV Cust", email: "av@x.com" }, as: ProgramAdministrator, captures: { cust: $.data.id } }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx}", account_number: "AV-P", service_class: COMMERCIAL, prior_annual_usage_wh: 20000000 }, as: ProgramAdministrator, captures: { acct_p: $.data.id } }
            - { call: "POST /applications", payload: { service_account_id: "${acct_p}", program_id: "${prog}", technology: SOLAR_PV, system_size_watts_ac: 10000, estimated_annual_production_wh: 15000000 }, as: Applicant, as_user_id: "${cust}", captures: { app_p: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app_p}", doc_type: SITE_PLAN, title: "site" }, as: Applicant, as_user_id: "${cust}", captures: { doc_p1: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app_p}", doc_type: SINGLE_LINE_DIAGRAM, title: "sld" }, as: Applicant, as_user_id: "${cust}", captures: { doc_p2: $.data.id } }
            - { call: "POST /documents/${doc_p1}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /documents/${doc_p2}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /applications/${app_p}/submit", payload: {}, as: Applicant, as_user_id: "${cust}" }
            - { call: "POST /applications/${app_p}/completeness-decision", payload: { outcome: COMPLETE }, as: InterconnectionCoordinator }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx}", account_number: "AV-R", service_class: RESIDENTIAL, prior_annual_usage_wh: 20000000 }, as: ProgramAdministrator, captures: { acct_r: $.data.id } }
            - { call: "POST /applications", payload: { service_account_id: "${acct_r}", program_id: "${prog}", technology: SOLAR_PV, system_size_watts_ac: 10000, estimated_annual_production_wh: 15000000 }, as: Applicant, as_user_id: "${cust}", captures: { app_r: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app_r}", doc_type: SITE_PLAN, title: "site" }, as: Applicant, as_user_id: "${cust}", captures: { doc_r1: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app_r}", doc_type: SINGLE_LINE_DIAGRAM, title: "sld" }, as: Applicant, as_user_id: "${cust}", captures: { doc_r2: $.data.id } }
            - { call: "POST /documents/${doc_r1}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /documents/${doc_r2}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /applications/${app_r}/submit", payload: {}, as: Applicant, as_user_id: "${cust}" }
            - { call: "POST /applications/${app_r}/completeness-decision", payload: { outcome: COMPLETE }, as: InterconnectionCoordinator }
          trigger:
            - { call: "POST /applications/${app_p}/amend", payload: { estimated_annual_production_wh: 23000000 }, as: Applicant, as_user_id: "${cust}", captures: { err1: $.data.error_id } }
            - { call: "POST /applications/${app_r}/amend", payload: { system_size_watts_ac: 30000 }, as: Applicant, as_user_id: "${cust}", captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_PRODUCTION_EXCEEDS_LOAD with HTTP 422 (23000000 > floor(20000000 * 110 / 100) = 22000000)"
            - "err2 == ERR_SIZE_EXCEEDS_CLASS_CAP with HTTP 422 (30000 > RESIDENTIAL cap 25000)"
            - "InterconnectionApplication.${app_p}.estimated_annual_production_wh == 15000000 and InterconnectionApplication.${app_r}.system_size_watts_ac == 10000 (both unchanged, both still CAPACITY_RESERVED)"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: ep_clock_default_value
        claim_type: computed_read
        grounds:
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z (never wall-clock)."
        test_recipe:
          setup: ["Fresh server; no clock call has been issued."]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "CLK", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator }
          trigger:
            - { call: "GET /_clock", as: ProgramAdministrator, captures: { now: $.data.current_utc } }
          assert:
            - "now == 2026-08-01T00:00:00Z"

      - name: ep_list_applications_filter_and_pagination_envelope
        claim_type: standard_crud
        grounds:
          - endpoints[GET /applications]
          - response_envelope
        distinguishing_aspect: "List endpoint composes the application_status filter with the fixed pagination envelope (limit/offset/total_count/has_more, default limit 10)."
        test_recipe:
          setup: ["One program/account-set with three applications: two in DRAFT, one WITHDRAWN."]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "LS", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog: $.data.id } }
            - { call: "POST /feeders", payload: { feeder_code: "F-LS", peak_load_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { feed: $.data.id } }
            - { call: "POST /service-transformers", payload: { feeder_id: "${feed}", transformer_code: "T-LS", nameplate_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { tx: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "LS Cust", email: "ls@x.com" }, as: ProgramAdministrator, captures: { cust: $.data.id } }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx}", account_number: "LS-1", service_class: COMMERCIAL, prior_annual_usage_wh: 20000000 }, as: ProgramAdministrator, captures: { acct1: $.data.id } }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx}", account_number: "LS-2", service_class: COMMERCIAL, prior_annual_usage_wh: 20000000 }, as: ProgramAdministrator, captures: { acct2: $.data.id } }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx}", account_number: "LS-3", service_class: COMMERCIAL, prior_annual_usage_wh: 20000000 }, as: ProgramAdministrator, captures: { acct3: $.data.id } }
            - { call: "POST /applications", payload: { service_account_id: "${acct1}", program_id: "${prog}", technology: SOLAR_PV, system_size_watts_ac: 10000, estimated_annual_production_wh: 15000000 }, as: Applicant, as_user_id: "${cust}" }
            - { call: "POST /applications", payload: { service_account_id: "${acct2}", program_id: "${prog}", technology: WIND, system_size_watts_ac: 5000, estimated_annual_production_wh: 8000000 }, as: Applicant, as_user_id: "${cust}" }
            - { call: "POST /applications", payload: { service_account_id: "${acct3}", program_id: "${prog}", technology: FUEL_CELL, system_size_watts_ac: 5000, estimated_annual_production_wh: 8000000 }, as: Applicant, as_user_id: "${cust}", captures: { app3: $.data.id } }
            - { call: "POST /applications/${app3}/withdraw", payload: {}, as: Applicant, as_user_id: "${cust}" }
          trigger:
            - { call: "GET /applications?application_status=DRAFT", as: ProgramAdministrator }
            - { call: "GET /applications?application_status=WITHDRAWN", as: ProgramAdministrator }
          assert:
            - "First response: response_type == array, total_count == 2, has_more == false, limit == 10, offset == 0"
            - "Second response: total_count == 1 and the single element is InterconnectionApplication.${app3}"
            - "Both responses carry meta.api_request_id and meta.api_request_timestamp"

      - name: ep_get_program_computed_read
        claim_type: computed_read
        grounds:
          - endpoints[GET /programs/{program_id}]
          - entities.Program.fields.available_capacity_watts
        distinguishing_aspect: "The program read exposes the derived capacity ledger consistent with the reservation that just landed."
        test_recipe:
          setup: ["Program cap 1000000; one 10000 W application driven to CAPACITY_RESERVED."]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "CR", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog: $.data.id } }
            - { call: "POST /tariff-schedules", payload: { program_id: "${prog}", schedule_code: "CR-2026", effective_from: "2026-01-01T00:00:00Z", import_rate_millicents_per_kwh: 30000, export_rate_millicents_per_kwh: 12000, net_surplus_rate_millicents_per_kwh: 4500 }, as: ProgramAdministrator }
            - { call: "POST /feeders", payload: { feeder_code: "F-CR", peak_load_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { feed: $.data.id } }
            - { call: "POST /service-transformers", payload: { feeder_id: "${feed}", transformer_code: "T-CR", nameplate_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { tx: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "CR Cust", email: "cr@x.com" }, as: ProgramAdministrator, captures: { cust: $.data.id } }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx}", account_number: "ACCT-CR", service_class: COMMERCIAL, prior_annual_usage_wh: 20000000 }, as: ProgramAdministrator, captures: { acct: $.data.id } }
            - { call: "POST /applications", payload: { service_account_id: "${acct}", program_id: "${prog}", technology: SOLAR_PV, system_size_watts_ac: 10000, estimated_annual_production_wh: 15000000 }, as: Applicant, as_user_id: "${cust}", captures: { app: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app}", doc_type: SITE_PLAN, title: "site" }, as: Applicant, as_user_id: "${cust}", captures: { doc1: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app}", doc_type: SINGLE_LINE_DIAGRAM, title: "sld" }, as: Applicant, as_user_id: "${cust}", captures: { doc2: $.data.id } }
            - { call: "POST /documents/${doc1}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /documents/${doc2}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /applications/${app}/submit", payload: {}, as: Applicant, as_user_id: "${cust}" }
            - { call: "POST /applications/${app}/completeness-decision", payload: { outcome: COMPLETE }, as: InterconnectionCoordinator }
          trigger:
            - { call: "GET /programs/${prog}", as: ProgramAdministrator }
          assert:
            - "Program.${prog}.reserved_watts == 10000 and available_capacity_watts == 990000 and interconnected_watts == 0 and queued_count == 0"

      - name: ep_sweep_expires_estimate_and_reservation
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /programs/{program_id}/sweep]
          - state_machines.UpgradeCostEstimate.ISSUED_to_EXPIRED
          - calculations.queue_promotion_scan
        distinguishing_aspect: "The sweep runs its pinned phase order: (1) estimate expiry withdraws app1 as ESTIMATE_EXPIRED (releasing 20000 W), (2) reservation expiry withdraws app2 as RESERVATION_EXPIRED (releasing 10000 W), (3) the promotion scan lands queued app3 with a fresh 180-day expiry from the sweep instant."
        test_recipe:
          setup:
            - "Program cap 30000 W. app1 (20000 W, on feeder F1 pre-existing 140000 / limit 150000) fails screening, completes supplemental review UPGRADES_REQUIRED, and holds an ISSUED estimate created at 2026-08-01 (valid_until 2026-08-31T00:00:00Z). app2 (10000 W, on feeder F2) is CAPACITY_RESERVED (exact fit, available 0, reservation_expires_at 2027-01-28T00:00:00Z). app3 (8000 W, on F2) is WAITING_FOR_CAPACITY position 1."
            - "Clock advanced to 2027-02-01T00:00:00Z (both deadlines passed); no sweep has run yet."
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "SWP", aggregate_cap_watts: 30000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog: $.data.id } }
            - { call: "POST /tariff-schedules", payload: { program_id: "${prog}", schedule_code: "SWP-2026", effective_from: "2026-01-01T00:00:00Z", import_rate_millicents_per_kwh: 30000, export_rate_millicents_per_kwh: 12000, net_surplus_rate_millicents_per_kwh: 4500 }, as: ProgramAdministrator }
            - { call: "POST /feeders", payload: { feeder_code: "F-SWP1", peak_load_watts: 1000000, pre_existing_der_watts: 140000 }, as: ProgramAdministrator, captures: { feed1: $.data.id } }
            - { call: "POST /service-transformers", payload: { feeder_id: "${feed1}", transformer_code: "T-SWP1", nameplate_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { tx1: $.data.id } }
            - { call: "POST /feeders", payload: { feeder_code: "F-SWP2", peak_load_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { feed2: $.data.id } }
            - { call: "POST /service-transformers", payload: { feeder_id: "${feed2}", transformer_code: "T-SWP2", nameplate_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { tx2: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "SWP Cust", email: "swp@x.com" }, as: ProgramAdministrator, captures: { cust: $.data.id } }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx1}", account_number: "SWP-1", service_class: COMMERCIAL, prior_annual_usage_wh: 100000000 }, as: ProgramAdministrator, captures: { acct1: $.data.id } }
            - { call: "POST /applications", payload: { service_account_id: "${acct1}", program_id: "${prog}", technology: SOLAR_PV, system_size_watts_ac: 20000, estimated_annual_production_wh: 30000000 }, as: Applicant, as_user_id: "${cust}", captures: { app1: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app1}", doc_type: SITE_PLAN, title: "site" }, as: Applicant, as_user_id: "${cust}", captures: { doc1a: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app1}", doc_type: SINGLE_LINE_DIAGRAM, title: "sld" }, as: Applicant, as_user_id: "${cust}", captures: { doc1b: $.data.id } }
            - { call: "POST /documents/${doc1a}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /documents/${doc1b}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /applications/${app1}/submit", payload: {}, as: Applicant, as_user_id: "${cust}" }
            - { call: "POST /applications/${app1}/completeness-decision", payload: { outcome: COMPLETE }, as: InterconnectionCoordinator }
            - { call: "POST /screening-reports", payload: { application_id: "${app1}" }, as: DistributionEngineer }
            - { call: "POST /supplemental-reviews", payload: { application_id: "${app1}", review_type: FACILITIES_STUDY }, as: DistributionEngineer, captures: { rev1: $.data.id } }
            - { call: "POST /supplemental-reviews/${rev1}/complete", payload: { outcome: UPGRADES_REQUIRED }, as: DistributionEngineer }
            - { call: "GET /applications/${app1}", as: ProgramAdministrator, captures: { app1_v: $.data.version } }
            - { call: "POST /cost-estimates", payload: { application_id: "${app1}", supplemental_review_id: "${rev1}", expected_application_version: "${app1_v}", items: [{ description: "transformer", amount_cents: 50000 }], contingency_pct: 10 }, as: DistributionEngineer, captures: { est1: $.data.id } }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx2}", account_number: "SWP-2", service_class: COMMERCIAL, prior_annual_usage_wh: 100000000 }, as: ProgramAdministrator, captures: { acct2: $.data.id } }
            - { call: "POST /applications", payload: { service_account_id: "${acct2}", program_id: "${prog}", technology: SOLAR_PV, system_size_watts_ac: 10000, estimated_annual_production_wh: 30000000 }, as: Applicant, as_user_id: "${cust}", captures: { app2: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app2}", doc_type: SITE_PLAN, title: "site" }, as: Applicant, as_user_id: "${cust}", captures: { doc2a: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app2}", doc_type: SINGLE_LINE_DIAGRAM, title: "sld" }, as: Applicant, as_user_id: "${cust}", captures: { doc2b: $.data.id } }
            - { call: "POST /documents/${doc2a}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /documents/${doc2b}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /applications/${app2}/submit", payload: {}, as: Applicant, as_user_id: "${cust}" }
