  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: media_asset_transcode_failure_retry_cycle
        grounds:
          - state_machines.MediaAsset.TRANSCODING_to_FAILED
          - state_machines.MediaAsset.FAILED_to_TRANSCODING
          - state_machines.MediaAsset.TRANSCODING_to_READY
          - entities.MediaAsset.fields.transcode_attempts
        distinguishing_aspect: |
          Cyclic on MediaAsset: TRANSCODING→FAILED→TRANSCODING→READY is a real cycle through
          TRANSCODING; transcode_attempts increments to 2 across the retry, proving the loop ran.
        test_recipe:
          setup:
            - "Episode epM under ACTIVE show; MediaAsset maM UPLOADED"
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "PubM", payout_email: "pm@x.com" }
              as: PlatformAdmin
              captures: { pubM: $.data.id }
            - call: "POST /shows"
              payload: { publisher_id: "${pubM}", title: "ShowM", category: "NEWS" }
              as: Publisher
              as_user_id: "${pubM}"
              captures: { showM: $.data.id }
            - call: "POST /shows/${showM}/activate"
              payload: {}
              as: Publisher
              as_user_id: "${pubM}"
            - call: "POST /episodes"
              payload: { show_id: "${showM}", title: "EpM", total_ad_slots: 0, offered_positions: [] }
              as: Publisher
              as_user_id: "${pubM}"
              captures: { epM: $.data.id }
            - call: "POST /media-assets"
              payload: { episode_id: "${epM}", source_filename: "m.wav", source_duration_ms: 300000 }
              as: Publisher
              as_user_id: "${pubM}"
              captures: { maM: $.data.id }
            - call: "POST /media-assets/${maM}/transcode-start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /media-assets/${maM}/transcode-result"
              payload: { outcome: "FAILURE" }
              as: PlatformAdmin
            - call: "POST /media-assets/${maM}/transcode-start"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /media-assets/${maM}/transcode-result"
              payload: { outcome: "SUCCESS", output_duration_ms: 300000 }
              as: PlatformAdmin
          assert:
            - "MediaAsset.${maM}.status == READY"
            - "MediaAsset.${maM}.transcode_attempts == 2"
            - "Episode.${epM}.media_status == READY"
            - "Episode.${epM}.duration_ms == 300000"

      - name: episode_parallel_axes_media_and_publish_independent
        grounds:
          - state_machines.Episode.field_publish_status
          - state_machines.Episode.field_media_status
          - entities.Episode.fields.publish_status
          - entities.Episode.fields.media_status
        distinguishing_aspect: |
          Parallel dimensions on Episode (different entity from MediaAsset's cycle): publish_status
          reaches SCHEDULED while media_status independently advances NONE→PENDING→PROCESSING→READY;
          the two axes hold distinct values (SCHEDULED, READY) on the same row at once.
        test_recipe:
          setup:
            - "Episode epX DRAFT under ACTIVE show; no media yet"
            - "clock set to 2026-02-01 so a future scheduled_publish_at is valid"
          setup_api_calls:
