# =============================================================================
# Task 1866 — Patient Portal Message Triage & Billing (ambulatory practice inbox)
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: >-
  1866. Patient Portal Message Triage & Billing (ambulatory practice inbox team):
  message intake & routing by clinical urgency, response-time target & pool
  coverage, clinical vs administrative classification, billable e-visit
  determination & consent for charge, provider inbox burden measurement,
  delegation protocol & cosign requirement, after-hours & escalation to
  on-call, patient education on appropriate use

domain_name: patient-portal-inbox
api_prefix: /inbox

notes:
  - "Logical clock: all timestamps (received_at, triaged_at, responded_at, windows, selector evaluation, SLA math) read the logical clock, whose startup default is exactly 2026-08-01T00:00:00Z and which moves only via POST /inbox/_clock/set_current_utc."
  - "List endpoints return items ordered by created_at ASC. Because the logical clock can stand still, created_at ties are possible; tests MUST NOT assert tie order — filter to a single element (e.g., by status) or assert order-independent properties (counts, membership, total_count, has_more)."

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: delegated_authority
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient full name" }
      - { name: date_of_birth, type: string, source: input, required: false, description: "ISO date of birth" }
      - { name: plan_type, type: enum, source: input, description: "COPAY | COINSURANCE — cost-sharing model used by patient_responsibility" }
      - { name: copay_cents, type: integer, source: input, required: false, description: "Flat copay in cents; REQUIRED iff plan_type == COPAY" }
      - { name: coinsurance_pct, type: number, source: input, required: false, description: "Coinsurance fraction, 0 < pct <= 1; REQUIRED iff plan_type == COINSURANCE" }
      - { name: outstanding_billed_cents, type: integer, source: computed, default: 0, description: "= SUM(patient_responsibility_cents) over this patient's EVisitClaims with status IN {SUBMITTED, DENIED}; maintained per outstanding_billed_maintenance" }
      - { name: education_gate_open, type: boolean, source: computed, default: false, description: "True iff EXISTS PatientEducationNotice for this patient with blocking == true AND status == ISSUED; gates POST /inbox/portal-messages" }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Staff full name" }
      - { name: staff_type, type: enum, source: input, description: "PROVIDER | NURSE | FRONT_DESK | BILLING_SPECIALIST | PRACTICE_ADMIN — must agree with X-User-Role per role-staff consistency rule" }
      - { name: open_inbox_count, type: integer, source: computed, default: 0, description: "= count of PortalMessages with assignee_id == this staff AND status IN {ASSIGNED, IN_REVIEW, PENDING_CONSENT, PENDING_COSIGN, ESCALATED, REOPENED}; maintained per open_inbox_count_maintenance" }
      - { name: inbox_overloaded, type: boolean, source: computed, default: false, description: "True iff open_inbox_count >= OVERLOAD_THRESHOLD (5); re-evaluated on every open_inbox_count change" }

  - name: Pool
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Pool display name" }
      - { name: pool_kind, type: enum, source: input, description: "NURSE_TRIAGE | PROVIDER_INBOX | FRONT_DESK | BILLING" }
      - { name: target_minutes_emergent, type: integer, source: input, description: "Response-time target (minutes) for EMERGENT messages" }
      - { name: target_minutes_urgent, type: integer, source: input, description: "Response-time target (minutes) for URGENT messages" }
      - { name: target_minutes_routine, type: integer, source: input, description: "Response-time target (minutes) for ROUTINE messages" }
      - { name: deadline_policy, type: enum, source: input, description: "FROM_RECEIPT | FROM_TRIAGE — selects response_deadline variant" }

  - name: CoverageWindow
    parent: null
    common_fields: true
    fields:
      - { name: pool_id, type: string, source: input, description: "FK -> Pool.id; pool being staffed" }
      - { name: staff_id, type: string, source: input, description: "FK -> StaffMember.id; staff member covering" }
      - { name: start_utc, type: datetime, source: input, description: "Coverage start (half-open interval start, inclusive)" }
      - { name: end_utc, type: datetime, source: input, description: "Coverage end (half-open interval end, EXCLUSIVE): window covers t iff start_utc <= t < end_utc" }

  - name: OnCallShift
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> StaffMember.id; must reference staff_type == PROVIDER" }
      - { name: start_utc, type: datetime, source: input, description: "On-call start (CLOSED interval start, inclusive)" }
      - { name: end_utc, type: datetime, source: input, description: "On-call end (CLOSED interval end, INCLUSIVE): shift covers t iff start_utc <= t <= end_utc" }

  - name: DelegationGrant
    parent: null
    common_fields: true
    fields:
      - { name: delegator_provider_id, type: string, source: system, description: "FK -> StaffMember.id; set from X-User-ID of the creating Provider" }
      - { name: delegate_staff_id, type: string, source: input, description: "FK -> StaffMember.id; delegate (must differ from delegator)" }
      - { name: pool_id, type: string, source: input, description: "FK -> Pool.id; pool the delegate may claim from (must be pool_kind == PROVIDER_INBOX)" }
      - { name: start_utc, type: datetime, source: input, description: "Grant window start (CLOSED interval, inclusive)" }
      - { name: end_utc, type: datetime, source: input, description: "Grant window end (CLOSED interval, INCLUSIVE)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | REVOKED" }
      - { name: revoked_at, type: datetime, source: system, required: false, description: "Set when revoked" }

  - name: PortalMessage
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; authoring patient (must equal X-User-ID when role == Patient)" }
      - { name: subject, type: string, source: input, description: "Message subject" }
      - { name: body, type: string, source: input, description: "Message body text" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp at creation" }
      - { name: urgency, type: enum, source: input, required: false, description: "EMERGENT | URGENT | ROUTINE — null until triage; set via /triage" }
      - { name: category, type: enum, source: input, required: false, description: "CLINICAL | ADMINISTRATIVE — null until triage; set via /triage" }
      - { name: triaged_at, type: datetime, source: system, required: false, description: "Logical-clock timestamp of latest triage" }
      - { name: assigned_pool_id, type: string, source: system, required: false, description: "FK -> Pool.id; routing target set by triage" }
      - { name: assignee_id, type: string, source: system, required: false, description: "FK -> StaffMember.id; current owner (set by assign with staff_id, start-review, escalate, or cascade)" }
      - { name: pending_cosign_by_id, type: string, source: system, required: false, description: "FK -> StaffMember.id; designated cosigner (delegator) when cosign routed via grant; null = any Provider may cosign" }
      - { name: resolved_by_id, type: string, source: system, required: false, description: "FK -> StaffMember.id; staff member whose complete/cosign moved the message to RESOLVED" }
      - { name: resolved_at, type: datetime, source: system, required: false, description: "Logical-clock timestamp of latest RESOLVED entry" }
      - { name: first_response_at, type: datetime, source: system, required: false, description: "Logical-clock timestamp of first staff reply; set once" }
      - { name: response_due_at, type: datetime, source: computed, required: false, description: "Computed at triage per response_deadline; null until first triage" }
      - { name: sla_breached, type: boolean, source: computed, default: false, description: "Sticky flag per sla_breach_evaluation; once true stays true (including across re-triage)" }
      - { name: billing_disposition, type: enum, source: system, default: UNDETERMINED, description: "UNDETERMINED | BILLABLE_CANDIDATE | CHARGEABLE | NOT_BILLABLE" }
      - { name: clinical_minutes_total, type: integer, source: computed, default: 0, description: "= SUM(minutes) of StaffTimeEntries on this message with entry_kind == CLINICAL_REVIEW whose staff has staff_type == PROVIDER" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Increments on every RESOLVED -> REOPENED transition" }
      - { name: resolution_summary, type: string, source: input, required: false, description: "Closing summary recorded at complete" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED | TRIAGED | ASSIGNED | IN_REVIEW | PENDING_CONSENT | PENDING_COSIGN | ESCALATED | RESOLVED | REOPENED | CLOSED" }

  - name: StaffTimeEntry
    parent: null
    common_fields: true
    fields:
      - { name: message_id, type: string, source: input, description: "FK -> PortalMessage.id; message worked" }
      - { name: staff_id, type: string, source: system, description: "FK -> StaffMember.id; set from X-User-ID" }
      - { name: entry_kind, type: enum, source: input, description: "CLINICAL_REVIEW | ADMINISTRATIVE" }
      - { name: minutes, type: integer, source: input, description: "Whole minutes worked; 1 <= minutes <= 480" }
      - { name: note, type: string, source: input, required: false, description: "Optional work note" }

  - name: ConsentRecord
    parent: null
    common_fields: true
    fields:
      - { name: message_id, type: string, source: system, description: "FK -> PortalMessage.id; at most one REQUESTED record per message" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; denormalized from message.patient_id at creation" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | GRANTED | DECLINED | SUPERSEDED" }
      - { name: disclosed_code, type: enum, source: system, description: "CPT_99421 | CPT_99422 | CPT_99423 — code tier at consent-request time (version-pinned)" }
      - { name: disclosed_fee_cents, type: integer, source: system, description: "Fee disclosed to patient at consent-request time (version-pinned)" }
      - { name: requested_at, type: datetime, source: system, description: "Logical-clock timestamp of creation" }
      - { name: responded_at, type: datetime, source: system, required: false, description: "Logical-clock timestamp of patient response" }

  - name: EVisitClaim
    parent: null
    common_fields: true
    fields:
      - { name: message_id, type: string, source: input, description: "FK -> PortalMessage.id; source message" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; denormalized from message at creation" }
      - { name: rendering_provider_id, type: string, source: input, description: "FK -> StaffMember.id; must have >= 1 CLINICAL_REVIEW time entry on the message" }
      - { name: code, type: enum, source: computed, description: "CPT_99421 | CPT_99422 | CPT_99423 — from e_visit_tier_selection at creation; recomputed on rework" }
      - { name: fee_cents, type: integer, source: computed, description: "Fee for code per e_visit_tier_selection constants" }
      - { name: patient_responsibility_cents, type: integer, source: computed, description: "Per patient_responsibility (round_half_up per claim)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | PAID | DENIED | VOID" }
      - { name: denial_reason, type: string, source: input, required: false, description: "Required iff record-adjudication outcome == DENIED" }
      - { name: submitted_at, type: datetime, source: system, required: false, description: "Logical-clock timestamp of latest submit" }
      - { name: adjudicated_at, type: datetime, source: system, required: false, description: "Logical-clock timestamp of adjudication" }

  - name: Escalation
    parent: null
    common_fields: true
    fields:
      - { name: message_id, type: string, source: system, description: "FK -> PortalMessage.id; escalated message" }
      - { name: provider_id, type: string, source: system, description: "FK -> StaffMember.id; on-call provider chosen by on_call_selector" }
      - { name: reason, type: string, source: input, description: "Escalation reason" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | ACKNOWLEDGED" }
      - { name: acknowledged_at, type: datetime, source: system, required: false, description: "Logical-clock timestamp of acknowledgement" }

  - name: PatientEducationNotice
    parent: null
    common_fields: true
    fields:
      - { name: message_id, type: string, source: input, description: "FK -> PortalMessage.id; triggering message" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; denormalized from message.patient_id" }
      - { name: notice_kind, type: enum, source: input, description: "EMERGENT_MISUSE | PORTAL_SCOPE_GUIDANCE | BILLING_EXPLAINER" }
      - { name: blocking, type: boolean, source: input, default: true, description: "When true, an ISSUED record opens the patient's education gate" }
      - { name: body, type: string, source: input, description: "Education content shown to patient" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | ACKNOWLEDGED" }
      - { name: acknowledged_at, type: datetime, source: system, required: false, description: "Logical-clock timestamp of acknowledgement" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PortalMessage
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    transitions:
      - from: RECEIVED
        to: TRIAGED
        trigger: "POST /inbox/portal-messages/{id}/triage"
        actor: TriageNurse
        preconditions:
          - "status == RECEIVED (ERR_MESSAGE_INVALID_STATE)"
          - "expected_message_version == message.version (ERR_STALE_VERSION)"
        side_effects:
          - "urgency, category, assigned_pool_id set from payload; triaged_at = now"
          - "response_due_at computed per response_deadline (pool deadline_policy variant)"
          - "increments PortalMessage.version by 1"
      - from: TRIAGED
        to: TRIAGED
        trigger: "POST /inbox/portal-messages/{id}/triage (re-triage supersedes prior classification)"
        actor: TriageNurse
        preconditions:
          - "expected_message_version == message.version (ERR_STALE_VERSION)"
        side_effects:
          - "urgency, category, assigned_pool_id overwritten; triaged_at = now"
          - "response_due_at recomputed per response_deadline (FROM_RECEIPT keeps original received_at; FROM_TRIAGE uses new triaged_at)"
          - "sla_breached is sticky: never reset by re-triage"
          - "increments PortalMessage.version by 1"
      - from: REOPENED
        to: TRIAGED
        trigger: "POST /inbox/portal-messages/{id}/triage"
        actor: TriageNurse
        preconditions:
          - "expected_message_version == message.version (ERR_STALE_VERSION)"
        side_effects:
          - "urgency, category, assigned_pool_id set from payload; triaged_at = now"
          - "response_due_at recomputed per response_deadline (FROM_RECEIPT uses ORIGINAL received_at, so a reopened message may be due in the past)"
          - "assignee_id CLEARED (message returns to the pool queue): prior assignee open_inbox_count -= 1 (open_inbox_count_maintenance; TRIAGED is not a counted status); inbox_overloaded re-evaluated"
          - "increments PortalMessage.version by 1"
      - from: TRIAGED
        to: ASSIGNED
        trigger: "POST /inbox/portal-messages/{id}/assign"
        actor: TriageNurse
        preconditions:
          - "status == TRIAGED (ERR_MESSAGE_INVALID_STATE)"
        side_effects:
          - "if payload staff_id present: assignee_id = staff_id AND assignee StaffMember.open_inbox_count += 1 (open_inbox_count_maintenance); else assignee_id stays null (pool queue)"
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /inbox/portal-messages/{id}/assign (re-route)"
        actor: TriageNurse
        preconditions:
          - "status == ASSIGNED (ERR_MESSAGE_INVALID_STATE)"
        side_effects:
          - "previous assignee (if any) open_inbox_count -= 1; new assignee (if staff_id present) open_inbox_count += 1 (open_inbox_count_maintenance; zero-sum reassign)"
      - from: ASSIGNED
        to: IN_REVIEW
        trigger: "POST /inbox/portal-messages/{id}/start-review"
        actor: "TriageNurse | FrontDesk | Provider"
        preconditions:
          - "status == ASSIGNED (ERR_MESSAGE_INVALID_STATE)"
          - "caller staff_type eligible for assigned pool kind, OR caller is delegate on an ACTIVE DelegationGrant for a PROVIDER_INBOX pool (ERR_POOL_ROLE_MISMATCH)"
          - "caller has a CoverageWindow for message.assigned_pool_id covering now, OR an ACTIVE DelegationGrant (delegate == caller, pool == message.assigned_pool_id) whose window covers now (ERR_NO_ACTIVE_COVERAGE)"
        side_effects:
          - "if assignee_id was null: assignee_id = caller AND caller.open_inbox_count += 1; if assignee_id == caller already: no count change; assigning to a different owner is NOT possible here"
      - from: IN_REVIEW
        to: PENDING_CONSENT
        trigger: "POST /inbox/portal-messages/{id}/determine-billing with disposition == BILLABLE_CANDIDATE"
        actor: Provider
        preconditions:
          - "status == IN_REVIEW (ERR_MESSAGE_INVALID_STATE)"
          - "expected_message_version == message.version (ERR_STALE_VERSION)"
          - "category == CLINICAL (ERR_CATEGORY_NOT_CLINICAL)"
          - "clinical_minutes_total >= EVISIT_MIN_MINUTES (5) (ERR_EVISIT_MINUTES_BELOW_MINIMUM)"
          - "no other message of same patient with billing_disposition == CHARGEABLE and received_at in (received_at - 168h, received_at] (ERR_EVISIT_DUPLICATE_WITHIN_7_DAYS)"
          - "no ConsentRecord with status == REQUESTED for this message (ERR_CONSENT_REQUEST_PENDING)"
          - "no EVisitClaim for this message with status IN {SUBMITTED, DENIED} (ERR_CLAIM_IN_FLIGHT)"
        side_effects:
          - "billing_disposition = BILLABLE_CANDIDATE"
          - "create ConsentRecord: status REQUESTED, disclosed_code/disclosed_fee_cents = e_visit_tier_selection at CURRENT clinical_minutes_total (version-pinned), patient_id copied from message"
          - "prior ConsentRecord with status IN {GRANTED, DECLINED} (if any) -> SUPERSEDED"
          - "increments PortalMessage.version by 1"
      - from: IN_REVIEW
        to: IN_REVIEW
        trigger: "POST /inbox/portal-messages/{id}/determine-billing with disposition == NOT_BILLABLE"
        actor: Provider
        preconditions:
          - "status == IN_REVIEW (ERR_MESSAGE_INVALID_STATE)"
          - "expected_message_version == message.version (ERR_STALE_VERSION)"
          - "no ConsentRecord with status == REQUESTED for this message (ERR_CONSENT_REQUEST_PENDING)"
          - "no EVisitClaim for this message with status IN {SUBMITTED, DENIED} (ERR_CLAIM_IN_FLIGHT)"
        side_effects:
          - "billing_disposition = NOT_BILLABLE"
          - "prior ConsentRecord with status IN {GRANTED, DECLINED} (if any) -> SUPERSEDED"
          - "increments PortalMessage.version by 1"
      - from: PENDING_CONSENT
        to: IN_REVIEW
        trigger: "POST /inbox/consent-records/{id}/respond (GRANTED or DECLINED) on the message's REQUESTED consent"
        actor: Patient
        preconditions:
          - "consent.status == REQUESTED (ERR_CONSENT_ALREADY_RESPONDED)"
          - "caller patient_id == consent.patient_id (ERR_PATIENT_OWNERSHIP_MISMATCH)"
        side_effects:
          - "GRANTED: message.billing_disposition = CHARGEABLE; DECLINED: message.billing_disposition = NOT_BILLABLE"
          - "consent.responded_at = now; message returns to IN_REVIEW with assignee retained (open_inbox_count unchanged — PENDING_CONSENT and IN_REVIEW are both counted statuses)"
      - from: IN_REVIEW
        to: PENDING_COSIGN
        trigger: "POST /inbox/portal-messages/{id}/complete when cosign is required"
        actor: "TriageNurse | FrontDesk | Provider"
        preconditions:
          - "status == IN_REVIEW (ERR_MESSAGE_INVALID_STATE)"
          - "caller == message.assignee_id (ERR_NOT_ASSIGNEE)"
        side_effects:
          - "cosign required iff category == CLINICAL AND assignee.staff_type != PROVIDER"
          - "pending_cosign_by_id = delegator_provider_id of the ACTIVE DelegationGrant linking assignee to message.assigned_pool_id whose window covers now; null when no such grant (any Provider may then cosign)"
          - "resolution_summary recorded; open_inbox_count unchanged (PENDING_COSIGN is a counted status)"
      - from: IN_REVIEW
        to: RESOLVED
        trigger: "POST /inbox/portal-messages/{id}/complete when cosign is NOT required"
        actor: "TriageNurse | FrontDesk | Provider"
        preconditions:
          - "status == IN_REVIEW (ERR_MESSAGE_INVALID_STATE)"
          - "caller == message.assignee_id (ERR_NOT_ASSIGNEE)"
        side_effects:
          - "resolved_by_id = caller; resolved_at = now; resolution_summary recorded"
          - "assignee.open_inbox_count -= 1 (open_inbox_count_maintenance); inbox_overloaded re-evaluated (overload_flag)"
          - "sla_breached latched per sla_breach_evaluation: breached iff (first_response_at ?? now) > response_due_at"
      - from: PENDING_COSIGN
        to: RESOLVED
        trigger: "POST /inbox/portal-messages/{id}/cosign with action == COSIGN"
        actor: Provider
        preconditions:
          - "status == PENDING_COSIGN (ERR_NOT_AWAITING_COSIGN)"
          - "pending_cosign_by_id null OR caller == pending_cosign_by_id (ERR_NOT_AUTHORIZED_COSIGNER)"
        side_effects:
          - "resolved_by_id = cosigning provider; resolved_at = now"
          - "assignee.open_inbox_count -= 1 (open_inbox_count_maintenance); inbox_overloaded re-evaluated"
          - "sla_breached latched per sla_breach_evaluation"
      - from: PENDING_COSIGN
        to: IN_REVIEW
        trigger: "POST /inbox/portal-messages/{id}/cosign with action == RETURN"
        actor: Provider
        preconditions:
          - "status == PENDING_COSIGN (ERR_NOT_AWAITING_COSIGN)"
          - "pending_cosign_by_id null OR caller == pending_cosign_by_id (ERR_NOT_AUTHORIZED_COSIGNER)"
        side_effects:
          - "pending_cosign_by_id cleared; assignee retained (open_inbox_count unchanged — both are counted statuses)"
      - from: TRIAGED
        to: ESCALATED
        trigger: "POST /inbox/portal-messages/{id}/escalate"
        actor: "TriageNurse | Provider"
        preconditions:
          - "status IN {TRIAGED, ASSIGNED, IN_REVIEW} (ERR_MESSAGE_INVALID_STATE)"
          - "urgency IN {URGENT, EMERGENT} (ERR_URGENCY_NOT_ESCALATABLE)"
          - "on_call_selector yields a provider (ERR_NO_ONCALL_COVERAGE)"
        side_effects:
          - "create Escalation: status OPEN, provider_id = on_call_selector(message), reason from payload"
          - "message.assignee_id = escalation.provider_id; previous assignee (if any) open_inbox_count -= 1, on-call provider open_inbox_count += 1 (open_inbox_count_maintenance); inbox_overloaded re-evaluated for both"
      - from: ASSIGNED
        to: ESCALATED
        trigger: "POST /inbox/portal-messages/{id}/escalate"
        actor: "TriageNurse | Provider"
        preconditions:
          - "status IN {TRIAGED, ASSIGNED, IN_REVIEW} (ERR_MESSAGE_INVALID_STATE)"
          - "urgency IN {URGENT, EMERGENT} (ERR_URGENCY_NOT_ESCALATABLE)"
          - "on_call_selector yields a provider (ERR_NO_ONCALL_COVERAGE)"
        side_effects:
          - "create Escalation: status OPEN, provider_id = on_call_selector(message)"
          - "message.assignee_id = escalation.provider_id; previous assignee open_inbox_count -= 1, on-call provider open_inbox_count += 1; inbox_overloaded re-evaluated for both"
      - from: IN_REVIEW
        to: ESCALATED
        trigger: "POST /inbox/portal-messages/{id}/escalate"
        actor: "TriageNurse | Provider"
        preconditions:
          - "status IN {TRIAGED, ASSIGNED, IN_REVIEW} (ERR_MESSAGE_INVALID_STATE)"
          - "urgency IN {URGENT, EMERGENT} (ERR_URGENCY_NOT_ESCALATABLE)"
          - "on_call_selector yields a provider (ERR_NO_ONCALL_COVERAGE)"
        side_effects:
          - "create Escalation: status OPEN, provider_id = on_call_selector(message)"
          - "message.assignee_id = escalation.provider_id; previous assignee open_inbox_count -= 1, on-call provider open_inbox_count += 1; inbox_overloaded re-evaluated for both"
      - from: ESCALATED
        to: IN_REVIEW
        trigger: "POST /inbox/escalations/{id}/acknowledge on the message's OPEN escalation"
        actor: Provider
        preconditions:
          - "escalation.status == OPEN (ERR_ESCALATION_INVALID_STATE)"
          - "caller == escalation.provider_id (ERR_NOT_ASSIGNEE)"
        side_effects:
          - "escalation.status = ACKNOWLEDGED, acknowledged_at = now"
          - "message moves to IN_REVIEW with assignee retained (open_inbox_count unchanged — both counted statuses)"
      - from: RESOLVED
        to: REOPENED
        trigger: "POST /inbox/portal-messages/{id}/reply by the patient"
        actor: Patient
        preconditions:
          - "status == RESOLVED (ERR_MESSAGE_INVALID_STATE)"
          - "caller patient_id == message.patient_id (ERR_PATIENT_OWNERSHIP_MISMATCH)"
        side_effects:
          - "reopen_count += 1; resolved_by_id/resolved_at retained as history"
          - "assignee retained -> assignee.open_inbox_count += 1 (open_inbox_count_maintenance); inbox_overloaded re-evaluated"
          - "response_due_at cleared until next triage"
        note: "REOPENED exits only via triage; a patient reply on a REOPENED (or any non-RESOLVED) message is rejected with ERR_MESSAGE_INVALID_STATE"
      - from: RESOLVED
        to: REOPENED
        trigger: "system (EVisitClaim SUBMITTED -> DENIED on linked claim)"
        actor: system
        preconditions:
          - "linked claim transitioned to DENIED"
        side_effects:
          - "assignee_id = claim.rendering_provider_id; reopen_count += 1"
          - "rendering provider open_inbox_count += 1 (open_inbox_count_maintenance) — CAUSED BY the claim DENIED transition"
          - "if rendering provider open_inbox_count >= OVERLOAD_THRESHOLD (5): inbox_overloaded flips true (overload_flag) — CAUSED BY the count increment"
          - "response_due_at cleared until next triage"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /inbox/portal-messages/{id}/close"
        actor: "TriageNurse | Provider"
        preconditions:
          - "status == RESOLVED (ERR_MESSAGE_INVALID_STATE)"
          - "no EVisitClaim for this message with status IN {DRAFT, SUBMITTED, DENIED} (ERR_CLAIM_IN_FLIGHT)"
        side_effects: []
      - from: RESOLVED
        to: CLOSED
        trigger: "system (EVisitClaim -> PAID on linked claim)"
        actor: system
        preconditions:
          - "linked claim transitioned to PAID AND message.status == RESOLVED"
        side_effects: []
  - entity: EVisitClaim
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /inbox/e-visit-claims/{id}/submit"
        actor: BillingSpecialist
        preconditions:
          - "status == DRAFT (ERR_CLAIM_INVALID_STATE)"
          - "claim.fee_cents <= REQUESTED/GRANTED consent.disclosed_fee_cents for the message (ERR_DISCLOSED_FEE_EXCEEDED)"
        side_effects:
          - "submitted_at = now"
          - "patient.outstanding_billed_cents += patient_responsibility_cents (outstanding_billed_maintenance)"
      - from: SUBMITTED
        to: PAID
        trigger: "POST /inbox/e-visit-claims/{id}/record-adjudication with outcome == PAID"
        actor: BillingSpecialist
        preconditions:
          - "status == SUBMITTED (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "adjudicated_at = now"
          - "patient.outstanding_billed_cents -= patient_responsibility_cents (outstanding_billed_maintenance)"
          - "CASCADE: if message.status == RESOLVED -> message CLOSED"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /inbox/e-visit-claims/{id}/record-adjudication with outcome == DENIED (denial_reason required)"
        actor: BillingSpecialist
        preconditions:
          - "status == SUBMITTED (ERR_CLAIM_INVALID_STATE)"
          - "denial_reason present (ERR_INVALID_REQUEST)"
        side_effects:
          - "adjudicated_at = now; outstanding_billed_cents UNCHANGED (DENIED remains in the outstanding set)"
          - "CASCADE hop 1: message RESOLVED -> REOPENED with assignee_id = rendering_provider_id, reopen_count += 1"
          - "CASCADE hop 2 (caused by hop 1): rendering provider open_inbox_count += 1"
          - "CASCADE hop 3 (caused by hop 2): if open_inbox_count >= OVERLOAD_THRESHOLD (5) -> inbox_overloaded = true"
      - from: DENIED
        to: DRAFT
        trigger: "POST /inbox/e-visit-claims/{id}/rework"
        actor: BillingSpecialist
        preconditions:
          - "status == DENIED (ERR_CLAIM_INVALID_STATE)"
          - "message.status == RESOLVED (ERR_MESSAGE_NOT_RESOLVED)"
        side_effects:
          - "code, fee_cents, patient_responsibility_cents RECOMPUTED from current clinical_minutes_total (e_visit_tier_selection + patient_responsibility)"
          - "patient.outstanding_billed_cents -= OLD patient_responsibility_cents (DENIED leaves the outstanding set)"
      - from: DRAFT
        to: VOID
        trigger: "POST /inbox/e-visit-claims/{id}/void"
        actor: BillingSpecialist
        preconditions:
          - "status IN {DRAFT, DENIED} (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "from DRAFT: outstanding UNCHANGED (DRAFT was never in the outstanding set)"
      - from: DENIED
        to: VOID
        trigger: "POST /inbox/e-visit-claims/{id}/void"
        actor: BillingSpecialist
        preconditions:
          - "status IN {DRAFT, DENIED} (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "patient.outstanding_billed_cents -= patient_responsibility_cents (DENIED leaves the outstanding set)"

  - entity: ConsentRecord
    initial_state: REQUESTED
    terminal_states: [GRANTED, DECLINED, SUPERSEDED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /inbox/consent-records/{id}/respond with decision == GRANTED"
        actor: Patient
        preconditions:
          - "status == REQUESTED (ERR_CONSENT_ALREADY_RESPONDED)"
        side_effects: ["message: PENDING_CONSENT -> IN_REVIEW, billing_disposition = CHARGEABLE (see PortalMessage machine)"]
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /inbox/consent-records/{id}/respond with decision == DECLINED"
        actor: Patient
        preconditions:
          - "status == REQUESTED (ERR_CONSENT_ALREADY_RESPONDED)"
        side_effects: ["message: PENDING_CONSENT -> IN_REVIEW, billing_disposition = NOT_BILLABLE"]
      - from: GRANTED
        to: SUPERSEDED
        trigger: "system (re-determination of billing on the same message)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DECLINED
        to: SUPERSEDED
        trigger: "system (re-determination of billing on the same message)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Escalation
    initial_state: OPEN
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /inbox/escalations/{id}/acknowledge"
        actor: Provider
        preconditions:
          - "status == OPEN (ERR_ESCALATION_INVALID_STATE)"
          - "caller == escalation.provider_id (ERR_NOT_ASSIGNEE)"
        side_effects: ["message ESCALATED -> IN_REVIEW"]

  - entity: PatientEducationNotice
    initial_state: ISSUED
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /inbox/education-notices/{id}/acknowledge"
        actor: Patient
        preconditions:
          - "status == ISSUED (ERR_NOTICE_ALREADY_ACKNOWLEDGED)"
          - "caller patient_id == notice.patient_id (ERR_PATIENT_OWNERSHIP_MISMATCH)"
        side_effects: ["acknowledged_at = now; patient.education_gate_open recomputed (education_gate)"]

  - entity: DelegationGrant
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /inbox/delegation-grants/{id}/revoke"
        actor: Provider
        preconditions:
          - "status == ACTIVE (ERR_GRANT_ALREADY_REVOKED)"
          - "caller == grant.delegator_provider_id (ERR_NOT_GRANT_OWNER)"
        side_effects:
          - "revoked_at = now"
          - "CASCADE hop 1: every PortalMessage with assignee_id == delegate_staff_id AND assigned_pool_id == grant.pool_id AND status IN {ASSIGNED, IN_REVIEW, PENDING_COSIGN} is reassigned: assignee_id = delegator_provider_id (status retained)"
          - "CASCADE hop 2 (caused by hop 1): delegate.open_inbox_count -= N, delegator.open_inbox_count += N (N = number of reassigned messages); inbox_overloaded re-evaluated for both"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: triage-stale-message-version
    parent_entity: PortalMessage
    write_endpoint: "POST /inbox/portal-messages/{id}/triage"
    occ_field: expected_message_version
    description: |
      Re-triage is legitimate from TRIAGED (a nurse may reclassify), so a second
      sequential triage still observes a triageable state and would succeed on
      product semantics. The write is therefore guarded by OCC: a triage call
      carrying an expected_message_version below the message's current version
      is rejected as stale, because the client's view of the classification
      predates the latest triage.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: determine-billing-stale-message-version
    parent_entity: PortalMessage
    write_endpoint: "POST /inbox/portal-messages/{id}/determine-billing"
    occ_field: expected_message_version
    description: |
      Re-determination is legitimate while the message is IN_REVIEW (a prior
      NOT_BILLABLE/CHARGEABLE disposition may be superseded), so a second
      sequential determine-billing call observes the same state and would
      succeed. OCC rejects the call when expected_message_version is below the
      message's current version: the client's view predates another writer's
      disposition change.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: response_deadline
    trigger: "PortalMessage triage transition (RECEIVED/TRIAGED/REOPENED -> TRIAGED)"
    algorithm: forward_looking
    formula: |
      target = pool.target_minutes_emergent if urgency == EMERGENT
               else pool.target_minutes_urgent if urgency == URGENT
               else pool.target_minutes_routine
      base   = message.received_at           if pool.deadline_policy == FROM_RECEIPT
               else message.triaged_at       if pool.deadline_policy == FROM_TRIAGE
      response_due_at = base + target minutes
      FROM_RECEIPT always uses the ORIGINAL received_at (even after reopen +
      re-triage); FROM_TRIAGE uses the LATEST triaged_at.
    input_set: "The triaged PortalMessage and its newly assigned Pool"
    precision: "second precision ISO8601 UTC; no rounding"
    variants:
      - name: from_receipt
        when: "pool.deadline_policy == FROM_RECEIPT"
        difference: "base = original received_at; re-triage does NOT move the base"
      - name: from_triage
        when: "pool.deadline_policy == FROM_TRIAGE"
        difference: "base = latest triaged_at; each re-triage moves the deadline"

  - name: sla_breach_evaluation
    trigger: "staff reply (first_response_at set), message resolution (complete/cosign), and POST /inbox/_sla/sweep"
    algorithm: threshold
    formula: |
      effective_response = message.first_response_at if set else now (logical clock)
      breached = effective_response > message.response_due_at     # STRICTLY greater
      Equality (effective_response == response_due_at) is NOT a breach.
      Messages with response_due_at == null (not yet triaged) are skipped.
      Sweep persists sla_breached = true for non-terminal messages (status NOT IN
      {RESOLVED, CLOSED}) that breach; complete/cosign latches the flag at
      resolution. sla_breached is sticky: once true it never resets.
    input_set: "Sweep: all PortalMessages with status NOT IN {RESOLVED, CLOSED} and response_due_at != null"
    precision: "second comparison, strict >"

  - name: clinical_minutes_total
    trigger: "StaffTimeEntry creation on the message"
    algorithm: aggregation
    formula: |
      message.clinical_minutes_total =
        SUM(entry.minutes) over StaffTimeEntry entries with
          entry.message_id == message.id
          AND entry.entry_kind == CLINICAL_REVIEW
          AND entry.staff_id references a StaffMember with staff_type == PROVIDER
      ADMINISTRATIVE entries and CLINICAL_REVIEW entries by non-PROVIDER staff
      are EXCLUDED.
    input_set: "All StaffTimeEntries of the message (no time window)"

  - name: e_visit_tier_selection
    trigger: "determine-billing (BILLABLE_CANDIDATE: disclosed_code/disclosed_fee_cents), EVisitClaim creation, EVisitClaim rework"
    algorithm: tiered_pricing
    formula: |
      m = message.clinical_minutes_total
      if m < EVISIT_MIN_MINUTES (5):        not billable (ERR_EVISIT_MINUTES_BELOW_MINIMUM at the calling validation)
      elif 5 <= m <= 10:  code = CPT_99421, fee_cents = 5000
      elif 11 <= m <= 20: code = CPT_99422, fee_cents = 8000
      else (m >= 21):     code = CPT_99423, fee_cents = 12000
      Tier boundaries are inclusive at BOTH ends of each band; a value on a
      boundary belongs to the band whose range contains it (10 -> 99421;
      11 -> 99422; 20 -> 99422; 21 -> 99423).
    input_set: "clinical_minutes_total of the single source message"
    constants:
      EVISIT_MIN_MINUTES: 5
      FEE_99421_CENTS: 5000
      FEE_99422_CENTS: 8000
      FEE_99423_CENTS: 12000
    precision: "integer cents"

  - name: patient_responsibility
    trigger: "EVisitClaim creation and rework"
    algorithm: aggregation
    formula: |
      if patient.plan_type == COPAY:
        patient_responsibility_cents = min(patient.copay_cents, claim.fee_cents)
      else (COINSURANCE):
        patient_responsibility_cents =
          min(claim.fee_cents, round_half_up(claim.fee_cents * patient.coinsurance_pct))
      ROUNDING ORDER (pinned): each claim's responsibility is rounded to integer
      cents with round_half_up AT CLAIM CREATION/REWORK; patient-level totals
      (outstanding_billed_cents) are plain integer sums of the per-claim rounded
      values. Do NOT sum unrounded products and round once at the end — the two
      orders differ (e.g. 2 x round_half_up(5000 * 0.3333) = 2 x 1667 = 3334 vs
      round_half_up(2 * 1666.5) = 3333).
    input_set: "The claim's fee_cents and the patient's plan fields"
    precision: "integer cents, round_half_up per claim"

  - name: open_inbox_count_maintenance
    trigger: "assign, start-review, escalate, complete, cosign(COSIGN), patient-reply reopen, claim-denial cascade, delegation-revoke cascade"
    algorithm: aggregation
    formula: |
      staff.open_inbox_count ==
        COUNT(PortalMessage m where m.assignee_id == staff.id
              AND m.status IN {ASSIGNED, IN_REVIEW, PENDING_CONSENT,
                               PENDING_COSIGN, ESCALATED, REOPENED})
      Maintained incrementally on every transition that changes assignee_id or
      moves a message into/out of the counted status set. CONSERVED QUANTITY:
      the global sum over all staff of open_inbox_count equals the number of
      messages in counted statuses with non-null assignee_id; reassign-style
      transitions (assign re-route, escalate, revoke cascade) are zero-sum.
    input_set: "All PortalMessages in counted statuses with non-null assignee_id"

  - name: overload_flag
    trigger: "every open_inbox_count change"
    algorithm: threshold
    formula: |
      staff.inbox_overloaded = (staff.open_inbox_count >= OVERLOAD_THRESHOLD)
      Boundary: count == 5 -> true; count == 4 -> false.
    constants:
      OVERLOAD_THRESHOLD: 5

  - name: outstanding_billed_maintenance
    trigger: "EVisitClaim submit, record-adjudication (PAID), rework, void (from DENIED)"
    algorithm: aggregation
    formula: |
      patient.outstanding_billed_cents ==
        SUM(claim.patient_responsibility_cents) over EVisitClaim claims with
          claim.patient_id == patient.id AND claim.status IN {SUBMITTED, DENIED}
      Transition deltas: DRAFT->SUBMITTED: +r; SUBMITTED->PAID: -r;
      SUBMITTED->DENIED: 0; DENIED->DRAFT: -r_old; DENIED->VOID: -r;
      DRAFT->VOID: 0. CONSERVED QUANTITY: submit followed by PAID (or DENIED
      followed by VOID) leaves outstanding_billed_cents unchanged net.
    input_set: "All EVisitClaims of the patient in statuses {SUBMITTED, DENIED}"

  - name: provider_inbox_burden
    trigger: "GET /inbox/staff/{id}/burden-summary (computed on read)"
    algorithm: aggregation
    formula: |
      attributed_resolutions = COUNT(PortalMessage m where
        m.resolved_by_id == staff.id AND m.status IN {RESOLVED, CLOSED})
      touched_resolutions    = COUNT(DISTINCT entry.message_id) over
        StaffTimeEntry entries with entry.staff_id == staff.id (any entry_kind)
      clinical_minutes       = SUM(entry.minutes) over entries with
        entry.staff_id == staff.id AND entry.entry_kind == CLINICAL_REVIEW
      Also returns open_inbox_count and inbox_overloaded (stored fields).
    input_set: "All PortalMessages / StaffTimeEntries (all-time, no window)"
    variants:
      - name: attributed
        when: "metric == ATTRIBUTED (default)"
        difference: "counts only messages the staff member personally resolved (resolved_by_id)"
      - name: touched
        when: "metric == TOUCHED"
        difference: "counts every message the staff member logged any time entry on, regardless of who resolved it; a message resolved by another provider but worked by this one counts here but NOT under attributed"

  - name: education_gate
    trigger: "PatientEducationNotice creation (blocking == true) and acknowledge"
    algorithm: aggregation
    formula: |
      patient.education_gate_open =
        EXISTS PatientEducationNotice n where n.patient_id == patient.id
          AND n.blocking == true AND n.status == ISSUED
    input_set: "All PatientEducationNotices of the patient"

  - name: on_call_selector
    trigger: "POST /inbox/portal-messages/{id}/escalate"
    algorithm: aggregation
    formula: |
      candidates = StaffMembers s with s.staff_type == PROVIDER AND EXISTS
        OnCallShift sh with sh.provider_id == s.id AND
        sh.start_utc <= now <= sh.end_utc          # CLOSED interval containment
      ranking:   covering shift.start_utc ASC (earliest-starting shift wins)
      tie-break: shift.created_at ASC (earliest-created shift wins)
      fallback:  empty candidate set -> ERR_NO_ONCALL_COVERAGE (409)
      The chosen provider becomes escalation.provider_id and message.assignee_id.
    input_set: "All OnCallShifts covering the logical-clock now"
    precision: "deterministic; id NEVER participates in ranking or tie-break"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.5 roles / §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "For staff-backed roles (TriageNurse/FrontDesk/Provider/BillingSpecialist): X-User-ID references an existing StaffMember whose staff_type matches the role (NURSE/FRONT_DESK/PROVIDER/BILLING_SPECIALIST respectively); PracticeAdmin is opaque and exempt"
    error_id: ERR_ROLE_STAFF_MISMATCH
    http_status: 403
    applies_to: all
  - priority: 4
    category: auth
    check: "Patient role: X-User-ID references an existing Patient, and may only act on own resources: message.patient_id / consent.patient_id / notice.patient_id == X-User-ID; Patient-role list calls MUST pass patient_id == X-User-ID"
    error_id: ERR_PATIENT_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "Patient-role endpoints (reply, consent respond, notice acknowledge, GET single/list as Patient)"
  - priority: 5
    category: existence
    check: "Path and body-referenced resources exist (left-to-right): message, patient, staff, pool, window, shift, grant, consent, claim, escalation, notice"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints
  - priority: 6
    category: state
    check: "OCC: expected_message_version == current PortalMessage.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /inbox/portal-messages/{id}/triage, POST /inbox/portal-messages/{id}/determine-billing"
  - priority: 7
    category: state
    check: "Target resource in a valid from-state for the action (per §1.2): message status for triage/assign/start-review/reply/complete/cosign/escalate/close/time-entry; claim status for submit/adjudicate/rework/void; consent ISSUED-only-once via REQUESTED check; notice ISSUED; grant ACTIVE; escalation OPEN"
    error_id: "ERR_MESSAGE_INVALID_STATE | ERR_CLAIM_INVALID_STATE | ERR_CONSENT_ALREADY_RESPONDED | ERR_NOTICE_ALREADY_ACKNOWLEDGED | ERR_GRANT_ALREADY_REVOKED | ERR_ESCALATION_INVALID_STATE | ERR_NOT_AWAITING_COSIGN"
    http_status: 409
    applies_to: all action endpoints
  - priority: 8
    category: business_safety
    check: "Education gate closed: POST /inbox/portal-messages rejected while patient.education_gate_open (a blocking ISSUED notice exists)"
    error_id: ERR_EDUCATION_ACK_REQUIRED
    http_status: 403
    applies_to: "POST /inbox/portal-messages"
  - priority: 9
    category: business_safety
    check: "Billing compliance: claim create requires message.billing_disposition == CHARGEABLE (i.e., consent GRANTED and not superseded)"
    error_id: ERR_MESSAGE_NOT_CHARGEABLE
    http_status: 409
    applies_to: "POST /inbox/e-visit-claims"
  - priority: 10
    category: business_safety
    check: "Cosign identity: caller == message.pending_cosign_by_id when set (any Provider when null)"
    error_id: ERR_NOT_AUTHORIZED_COSIGNER
    http_status: 403
    applies_to: "POST /inbox/portal-messages/{id}/cosign"
  - priority: 11
    category: business_safety
    check: "E-visit category: determine-billing with BILLABLE_CANDIDATE requires message.category == CLINICAL"
    error_id: ERR_CATEGORY_NOT_CLINICAL
    http_status: 422
    applies_to: "POST /inbox/portal-messages/{id}/determine-billing"
  - priority: 12
    category: business_referential
    check: "Pool-kind/staff-type eligibility at start-review: NURSE_TRIAGE<-NURSE, FRONT_DESK<-FRONT_DESK, BILLING<-BILLING_SPECIALIST, PROVIDER_INBOX<-PROVIDER or a delegate with an ACTIVE grant covering now"
    error_id: ERR_POOL_ROLE_MISMATCH
    http_status: 403
    applies_to: "POST /inbox/portal-messages/{id}/start-review"
  - priority: 13
    category: business_referential
    check: "Assignee-only actions: staff reply and complete require caller == message.assignee_id; escalation acknowledge requires caller == escalation.provider_id. Time entries are NOT assignee-restricted (team-based care): any staff-backed role may log time on a message in a working status IN {IN_REVIEW, PENDING_CONSENT, PENDING_COSIGN, ESCALATED, REOPENED} (else ERR_MESSAGE_INVALID_STATE)"
    error_id: ERR_NOT_ASSIGNEE
    http_status: 403
    applies_to: "POST /inbox/portal-messages/{id}/reply, POST /inbox/portal-messages/{id}/complete, POST /inbox/escalations/{id}/acknowledge"
  - priority: 14
    category: business_referential
    check: "OnCallShift.provider_id must reference staff_type == PROVIDER"
    error_id: ERR_ONCALL_PROVIDER_TYPE
    http_status: 422
    applies_to: "POST /inbox/on-call-shifts"
  - priority: 15
    category: business_referential
    check: "DelegationGrant: delegator is the calling Provider; delegate_staff_id != delegator; delegate exists; pool exists and pool.pool_kind == PROVIDER_INBOX"
    error_id: ERR_INVALID_DELEGATION_TARGET
    http_status: 422
    applies_to: "POST /inbox/delegation-grants"
  - priority: 16
    category: business_referential
    check: "EVisitClaim.rendering_provider_id must reference a PROVIDER with >= 1 CLINICAL_REVIEW StaffTimeEntry on the message"
    error_id: ERR_RENDERING_PROVIDER_NOT_ON_THREAD
    http_status: 422
    applies_to: "POST /inbox/e-visit-claims"
  - priority: 17
    category: business_referential
    check: "DelegationGrant revoke: caller == grant.delegator_provider_id"
    error_id: ERR_NOT_GRANT_OWNER
    http_status: 403
    applies_to: "POST /inbox/delegation-grants/{id}/revoke"
  - priority: 18
    category: business_temporal
    check: "Time range validity: end_utc > start_utc (strictly) for CoverageWindow, OnCallShift, DelegationGrant"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 400
    applies_to: "POST /inbox/coverage-windows, POST /inbox/on-call-shifts, POST /inbox/delegation-grants"
  - priority: 19
    category: business_temporal
    check: "CoverageWindow overlap (HALF-OPEN): for the same staff_id, [start_utc, end_utc) must not intersect any existing window; adjacency (new.start == existing.end or new.end == existing.start) is ALLOWED"
    error_id: ERR_COVERAGE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /inbox/coverage-windows"
  - priority: 20
    category: business_temporal
    check: "OnCallShift overlap (CLOSED): for the same provider_id, [start_utc, end_utc] must not intersect any existing shift; touching endpoints (new.start == existing.end) COUNT as overlap"
    error_id: ERR_ONCALL_SHIFT_OVERLAP
    http_status: 409
    applies_to: "POST /inbox/on-call-shifts"
  - priority: 21
    category: business_temporal
    check: "DelegationGrant overlap (CLOSED): for the same (delegator_provider_id, delegate_staff_id) pair, ACTIVE grants' [start_utc, end_utc] must not intersect; touching endpoints COUNT as overlap"
    error_id: ERR_DELEGATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /inbox/delegation-grants"
  - priority: 22
    category: business_temporal
    check: "Active coverage at claim time: caller has a CoverageWindow for the message's pool covering now, or an ACTIVE DelegationGrant (delegate == caller, pool == message pool) covering now"
    error_id: ERR_NO_ACTIVE_COVERAGE
    http_status: 409
    applies_to: "POST /inbox/portal-messages/{id}/start-review"
  - priority: 23
    category: business_temporal
    check: "E-visit 7-day dedupe: no other message of the same patient with billing_disposition == CHARGEABLE and received_at in (this.received_at - 168h, this.received_at]; exactly 168h earlier is OUTSIDE the window (exclusive lower bound)"
    error_id: ERR_EVISIT_DUPLICATE_WITHIN_7_DAYS
    http_status: 409
    applies_to: "POST /inbox/portal-messages/{id}/determine-billing (BILLABLE_CANDIDATE)"
  - priority: 24
    category: business_constraint
    check: "Escalation urgency gate: message.urgency IN {URGENT, EMERGENT}"
    error_id: ERR_URGENCY_NOT_ESCALATABLE
    http_status: 409
    applies_to: "POST /inbox/portal-messages/{id}/escalate"
  - priority: 25
    category: business_constraint
    check: "On-call selector non-empty (on_call_selector fallback)"
    error_id: ERR_NO_ONCALL_COVERAGE
    http_status: 409
    applies_to: "POST /inbox/portal-messages/{id}/escalate"
  - priority: 26
    category: business_constraint
    check: "At most one REQUESTED ConsentRecord per message"
    error_id: ERR_CONSENT_REQUEST_PENDING
    http_status: 409
    applies_to: "POST /inbox/portal-messages/{id}/determine-billing"
  - priority: 27
    category: business_constraint
    check: "At most one active EVisitClaim per message (status IN {DRAFT, SUBMITTED, DENIED})"
    error_id: ERR_CLAIM_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /inbox/e-visit-claims"
  - priority: 28
    category: business_constraint
    check: "Claim-in-flight blocks: close requires no claim in {DRAFT, SUBMITTED, DENIED}; determine-billing supersede blocked only by claim in {SUBMITTED, DENIED}"
    error_id: ERR_CLAIM_IN_FLIGHT
    http_status: 409
    applies_to: "POST /inbox/portal-messages/{id}/close, POST /inbox/portal-messages/{id}/determine-billing"
  - priority: 29
    category: business_fiscal
    check: "E-visit minimum time: clinical_minutes_total >= 5 for BILLABLE_CANDIDATE determination and for claim creation"
    error_id: ERR_EVISIT_MINUTES_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /inbox/portal-messages/{id}/determine-billing (BILLABLE_CANDIDATE), POST /inbox/e-visit-claims"
  - priority: 30
    category: business_fiscal
    check: "Disclosed-fee ceiling: claim.fee_cents <= disclosed_fee_cents of the message's GRANTED (not superseded) ConsentRecord; re-checked at submit"
    error_id: ERR_DISCLOSED_FEE_EXCEEDED
    http_status: 422
    applies_to: "POST /inbox/e-visit-claims, POST /inbox/e-visit-claims/{id}/submit"
  - priority: 31
    category: existence
    check: "Input shape: required fields present, enum members valid, integers in range (minutes 1..480), plan-conditional fields (copay_cents iff COPAY; coinsurance_pct iff COINSURANCE), denial_reason iff outcome == DENIED"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
    note: "Malformed-input checks run after auth (1-4) and BEFORE path-existence? No — input-shape failures on the request body are reported as ERR_INVALID_REQUEST; when both a body-field error and a path-existence error apply, existence (priority 5) wins. This row governs body-only failures."

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Patients ---
  - method: POST
    path: "/inbox/patients"
    description: "Register a patient"
    roles: [PracticeAdmin]
    code: 201
    input: [full_name, plan_type, "copay_cents?", "coinsurance_pct?", "date_of_birth?"]
    output: Patient
    side_effects: ["outstanding_billed_cents = 0", "education_gate_open = false"]
  - method: GET
    path: "/inbox/patients/{id}"
    description: "Get a patient (Patient role: own record only)"
    roles: [PracticeAdmin, TriageNurse, FrontDesk, Provider, BillingSpecialist, Patient]
    code: 200
    input: []
    output: Patient
    side_effects: []

  # --- Staff ---
  - method: POST
    path: "/inbox/staff"
    description: "Create a staff member"
    roles: [PracticeAdmin]
    code: 201
    input: [full_name, staff_type]
    output: StaffMember
    side_effects: ["open_inbox_count = 0", "inbox_overloaded = false"]
  - method: GET
    path: "/inbox/staff/{id}"
    description: "Get a staff member"
    roles: [PracticeAdmin, TriageNurse, FrontDesk, Provider, BillingSpecialist]
    code: 200
    input: []
    output: StaffMember
    side_effects: []
  - method: GET
    path: "/inbox/staff/{id}/burden-summary"
    description: "Provider inbox burden measurement (provider_inbox_burden; both variants returned)"
    roles: [PracticeAdmin, TriageNurse, FrontDesk, Provider, BillingSpecialist]
    code: 200
    input: ["metric?"]
    output: "{ open_inbox_count: integer, inbox_overloaded: boolean, attributed_resolutions: integer, touched_resolutions: integer, clinical_minutes: integer }"
    side_effects: []

  # --- Pools ---
  - method: POST
    path: "/inbox/pools"
    description: "Create a routing pool with response-time targets and deadline policy"
    roles: [PracticeAdmin]
    code: 201
    input: [name, pool_kind, target_minutes_emergent, target_minutes_urgent, target_minutes_routine, deadline_policy]
    output: Pool
    side_effects: []
  - method: GET
    path: "/inbox/pools/{id}"
    description: "Get a pool"
    roles: [PracticeAdmin, TriageNurse, FrontDesk, Provider, BillingSpecialist]
    code: 200
    input: []
    output: Pool
    side_effects: []

  # --- Coverage windows ---
  - method: POST
    path: "/inbox/coverage-windows"
    description: "Create a coverage window (half-open interval, per-staff overlap check)"
    roles: [PracticeAdmin]
    code: 201
    input: [pool_id, staff_id, start_utc, end_utc]
    output: CoverageWindow
    side_effects: []
  - method: GET
    path: "/inbox/coverage-windows"
    description: "List coverage windows (FK reverse reachability for pool_id and staff_id)"
    roles: [PracticeAdmin, TriageNurse, FrontDesk, Provider, BillingSpecialist]
    code: 200
    input: ["pool_id?", "staff_id?", "limit?", "offset?"]
    output: "CoverageWindow[]"
    side_effects: []
  - method: GET
    path: "/inbox/coverage-windows/{id}"
    description: "Get a coverage window"
    roles: [PracticeAdmin, TriageNurse, FrontDesk, Provider, BillingSpecialist]
    code: 200
    input: []
    output: CoverageWindow
    side_effects: []

  # --- On-call shifts ---
  - method: POST
    path: "/inbox/on-call-shifts"
    description: "Create an on-call shift (CLOSED interval, per-provider touch-is-overlap check)"
    roles: [PracticeAdmin]
    code: 201
    input: [provider_id, start_utc, end_utc]
    output: OnCallShift
    side_effects: []
  - method: GET
    path: "/inbox/on-call-shifts"
    description: "List on-call shifts (FK reverse reachability for provider_id)"
    roles: [PracticeAdmin, TriageNurse, FrontDesk, Provider, BillingSpecialist]
    code: 200
    input: ["provider_id?", "limit?", "offset?"]
    output: "OnCallShift[]"
    side_effects: []
  - method: GET
    path: "/inbox/on-call-shifts/{id}"
    description: "Get an on-call shift"
    roles: [PracticeAdmin, TriageNurse, FrontDesk, Provider, BillingSpecialist]
    code: 200
    input: []
    output: OnCallShift
    side_effects: []

  # --- Delegation grants ---
  - method: POST
    path: "/inbox/delegation-grants"
    description: "Provider delegates inbox coverage of a PROVIDER_INBOX pool to another staff member"
    roles: [Provider]
    code: 201
    input: [delegate_staff_id, pool_id, start_utc, end_utc]
    output: DelegationGrant
    side_effects: ["delegator_provider_id = X-User-ID", "status = ACTIVE"]
  - method: GET
    path: "/inbox/delegation-grants"
    description: "List delegation grants (FK reverse reachability for delegator_provider_id, delegate_staff_id, pool_id)"
    roles: [PracticeAdmin, TriageNurse, FrontDesk, Provider, BillingSpecialist]
    code: 200
    input: ["delegator_provider_id?", "delegate_staff_id?", "pool_id?", "status?", "limit?", "offset?"]
    output: "DelegationGrant[]"
    side_effects: []
  - method: GET
    path: "/inbox/delegation-grants/{id}"
    description: "Get a delegation grant"
    roles: [PracticeAdmin, TriageNurse, FrontDesk, Provider, BillingSpecialist]
    code: 200
    input: []
    output: DelegationGrant
    side_effects: []
  - method: POST
    path: "/inbox/delegation-grants/{id}/revoke"
    description: "Revoke a grant; cascade reassigns the delegate's in-flight messages in that pool to the delegator"
    roles: [Provider]
    code: 200
    input: []
    output: DelegationGrant
    side_effects: ["status = REVOKED", "revocation cascade per DelegationGrant machine (reassign + open_inbox_count zero-sum shift)"]

  # --- Portal messages ---
  - method: POST
    path: "/inbox/portal-messages"
    description: "Patient sends a portal message (intake). Blocked while the patient's education gate is open."
    roles: [Patient]
    code: 201
    input: [subject, body]
    output: PortalMessage
    side_effects: ["status = RECEIVED", "received_at = logical clock now", "patient_id = X-User-ID", "billing_disposition = UNDETERMINED"]
  - method: GET
    path: "/inbox/portal-messages"
    description: "List messages with filters (Patient role must pass own patient_id). FK reverse reachability for patient_id, assigned_pool_id, assignee_id, pending_cosign_by_id, resolved_by_id."
    roles: [PracticeAdmin, TriageNurse, FrontDesk, Provider, BillingSpecialist, Patient]
    code: 200
    input: ["patient_id?", "assigned_pool_id?", "assignee_id?", "pending_cosign_by_id?", "resolved_by_id?", "status?", "limit?", "offset?"]
    output: "PortalMessage[]"
    side_effects: []
  - method: GET
    path: "/inbox/portal-messages/{id}"
    description: "Get a message (Patient role: own only)"
    roles: [PracticeAdmin, TriageNurse, FrontDesk, Provider, BillingSpecialist, Patient]
    code: 200
    input: []
    output: PortalMessage
    side_effects: []
  - method: POST
    path: "/inbox/portal-messages/{id}/triage"
    description: "Classify (urgency, category) and route to a pool; allowed from RECEIVED, TRIAGED (re-triage supersedes), REOPENED. OCC-guarded."
    roles: [TriageNurse]
    code: 200
    input: [urgency, category, pool_id, expected_message_version]
    output: PortalMessage
    side_effects: ["status -> TRIAGED", "triaged_at = now", "response_due_at computed per response_deadline", "increments PortalMessage.version by 1"]
  - method: POST
    path: "/inbox/portal-messages/{id}/assign"
    description: "Assign to a specific staff member (staff_id) or leave on the pool queue (no staff_id); re-route allowed from ASSIGNED"
    roles: [TriageNurse]
    code: 200
    input: ["staff_id?"]
    output: PortalMessage
    side_effects: ["status -> ASSIGNED", "open_inbox_count_maintenance on assignee change"]
  - method: POST
    path: "/inbox/portal-messages/{id}/start-review"
    description: "Caller claims the message from its pool queue; pool-kind eligibility + active coverage (own window or delegation grant) required"
    roles: [TriageNurse, FrontDesk, Provider]
    code: 200
    input: []
    output: PortalMessage
    side_effects: ["status -> IN_REVIEW", "assignee_id = caller if previously null", "open_inbox_count_maintenance"]
  - method: POST
    path: "/inbox/portal-messages/{id}/reply"
    description: "Staff reply (assignee only; sets first_response_at once, latches sla_breached). Patient reply on own RESOLVED message reopens it."
    roles: [Patient, TriageNurse, FrontDesk, Provider]
    code: 200
    input: [body]
    output: PortalMessage
    side_effects: ["staff: first_response_at ??= now; sla_breach_evaluation latch", "patient on RESOLVED: status -> REOPENED, reopen_count += 1, open_inbox_count_maintenance"]
  - method: POST
    path: "/inbox/portal-messages/{id}/complete"
    description: "Assignee completes work; routes to PENDING_COSIGN when cosign required (clinical work by non-provider), else RESOLVED"
    roles: [TriageNurse, FrontDesk, Provider]
    code: 200
    input: [resolution_summary]
    output: PortalMessage
    side_effects: ["status -> PENDING_COSIGN | RESOLVED", "on RESOLVED: open_inbox_count_maintenance + sla latch + resolved_by/resolved_at"]
  - method: POST
    path: "/inbox/portal-messages/{id}/cosign"
    description: "Provider cosigns (action COSIGN -> RESOLVED) or returns (action RETURN -> IN_REVIEW) a PENDING_COSIGN message"
    roles: [Provider]
    code: 200
    input: [action]
    output: PortalMessage
    side_effects: ["COSIGN: status -> RESOLVED + open_inbox_count_maintenance + sla latch", "RETURN: status -> IN_REVIEW, pending_cosign_by_id cleared"]
  - method: POST
    path: "/inbox/portal-messages/{id}/escalate"
    description: "Escalate an URGENT/EMERGENT message to the on-call provider (on_call_selector); creates the Escalation record"
    roles: [TriageNurse, Provider]
    code: 201
    input: [reason]
    output: Escalation
    side_effects: ["Escalation created (OPEN)", "message -> ESCALATED with assignee = on-call provider", "open_inbox_count_maintenance for prior and new assignee"]
  - method: POST
    path: "/inbox/portal-messages/{id}/determine-billing"
    description: "Provider determines e-visit billability. BILLABLE_CANDIDATE creates a REQUESTED ConsentRecord with version-pinned disclosed code/fee and moves the message to PENDING_CONSENT. OCC-guarded."
    roles: [Provider]
    code: 200
    input: [disposition, expected_message_version]
    output: PortalMessage
    side_effects: ["billing_disposition updated", "BILLABLE_CANDIDATE: ConsentRecord created; prior responded consent SUPERSEDED", "increments PortalMessage.version by 1"]
  - method: POST
    path: "/inbox/portal-messages/{id}/close"
    description: "Close a RESOLVED message with no claim in flight (terminal)"
    roles: [TriageNurse, Provider]
    code: 200
    input: []
    output: PortalMessage
    side_effects: ["status -> CLOSED"]

  # --- Time entries ---
  - method: POST
    path: "/inbox/time-entries"
    description: "Log work minutes on a message (any staff-backed role; team-based care; message must be in a working status IN {IN_REVIEW, PENDING_CONSENT, PENDING_COSIGN, ESCALATED, REOPENED})"
    roles: [TriageNurse, FrontDesk, Provider]
    code: 201
    input: [message_id, entry_kind, minutes, "note?"]
    output: StaffTimeEntry
    side_effects: ["staff_id = X-User-ID", "message.clinical_minutes_total recomputed (clinical_minutes_total)"]
  - method: GET
    path: "/inbox/time-entries"
    description: "List time entries (FK reverse reachability for message_id and staff_id)"
    roles: [PracticeAdmin, TriageNurse, FrontDesk, Provider, BillingSpecialist]
    code: 200
    input: ["message_id?", "staff_id?", "entry_kind?", "limit?", "offset?"]
    output: "StaffTimeEntry[]"
    side_effects: []
  - method: GET
    path: "/inbox/time-entries/{id}"
    description: "Get a time entry"
    roles: [PracticeAdmin, TriageNurse, FrontDesk, Provider, BillingSpecialist]
    code: 200
    input: []
    output: StaffTimeEntry
    side_effects: []

  # --- Education notices ---
  - method: POST
    path: "/inbox/education-notices"
    description: "Issue a patient-education notice tied to a message (appropriate-use guidance; blocking notices open the education gate)"
    roles: [TriageNurse]
    code: 201
    input: [message_id, notice_kind, body, "blocking?"]
    output: PatientEducationNotice
    side_effects: ["patient_id copied from message", "status = ISSUED", "patient.education_gate_open recomputed (education_gate)"]
  - method: GET
    path: "/inbox/education-notices"
    description: "List education notices (FK reverse reachability for message_id and patient_id; Patient role must pass own patient_id)"
    roles: [PracticeAdmin, TriageNurse, FrontDesk, Provider, BillingSpecialist, Patient]
    code: 200
    input: ["message_id?", "patient_id?", "status?", "limit?", "offset?"]
    output: "PatientEducationNotice[]"
    side_effects: []
  - method: GET
    path: "/inbox/education-notices/{id}"
    description: "Get an education notice (Patient role: own only)"
    roles: [PracticeAdmin, TriageNurse, FrontDesk, Provider, BillingSpecialist, Patient]
    code: 200
    input: []
    output: PatientEducationNotice
    side_effects: []
  - method: POST
    path: "/inbox/education-notices/{id}/acknowledge"
    description: "Patient acknowledges a notice; gate closes when no blocking ISSUED notices remain"
    roles: [Patient]
    code: 200
    input: []
    output: PatientEducationNotice
    side_effects: ["status = ACKNOWLEDGED", "acknowledged_at = now", "education_gate recomputed"]

  # --- Consent records ---
  - method: GET
    path: "/inbox/consent-records"
    description: "List consent records (FK reverse reachability for message_id and patient_id; Patient role must pass own patient_id)"
    roles: [PracticeAdmin, TriageNurse, FrontDesk, Provider, BillingSpecialist, Patient]
    code: 200
    input: ["message_id?", "patient_id?", "status?", "limit?", "offset?"]
    output: "ConsentRecord[]"
    side_effects: []
  - method: GET
    path: "/inbox/consent-records/{id}"
    description: "Get a consent record (Patient role: own only)"
    roles: [PracticeAdmin, TriageNurse, FrontDesk, Provider, BillingSpecialist, Patient]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: []
  - method: POST
    path: "/inbox/consent-records/{id}/respond"
    description: "Patient grants or declines the charge consent; message disposition and status update accordingly"
    roles: [Patient]
    code: 200
    input: [decision]
    output: ConsentRecord
    side_effects: ["status -> GRANTED | DECLINED", "responded_at = now", "message PENDING_CONSENT -> IN_REVIEW with billing_disposition CHARGEABLE | NOT_BILLABLE"]

  # --- E-visit claims ---
  - method: POST
    path: "/inbox/e-visit-claims"
    description: "Billing creates a DRAFT claim from a RESOLVED + CHARGEABLE message; code/fee/responsibility computed at creation"
    roles: [BillingSpecialist]
    code: 201
    input: [message_id, rendering_provider_id]
    output: EVisitClaim
    side_effects: ["code/fee per e_visit_tier_selection", "patient_responsibility_cents per patient_responsibility", "status = DRAFT"]
  - method: GET
    path: "/inbox/e-visit-claims"
    description: "List claims (FK reverse reachability for message_id, patient_id, rendering_provider_id; Patient role must pass own patient_id)"
    roles: [PracticeAdmin, TriageNurse, FrontDesk, Provider, BillingSpecialist, Patient]
    code: 200
    input: ["message_id?", "patient_id?", "rendering_provider_id?", "status?", "limit?", "offset?"]
    output: "EVisitClaim[]"
    side_effects: []
  - method: GET
    path: "/inbox/e-visit-claims/{id}"
    description: "Get a claim"
    roles: [PracticeAdmin, TriageNurse, FrontDesk, Provider, BillingSpecialist, Patient]
    code: 200
    input: []
    output: EVisitClaim
    side_effects: []
  - method: POST
    path: "/inbox/e-visit-claims/{id}/submit"
    description: "Submit a DRAFT claim; disclosed-fee ceiling re-checked; debits patient outstanding"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: EVisitClaim
    side_effects: ["status -> SUBMITTED", "submitted_at = now", "outstanding_billed_maintenance (+r)"]
  - method: POST
    path: "/inbox/e-visit-claims/{id}/record-adjudication"
    description: "Record payer adjudication. PAID credits outstanding and auto-closes a RESOLVED message; DENIED cascades: message reopens to the rendering provider (denial_reason required)"
    roles: [BillingSpecialist]
    code: 200
    input: [outcome, "denial_reason?"]
    output: EVisitClaim
    side_effects: ["status -> PAID | DENIED", "adjudicated_at = now", "outstanding_billed_maintenance", "PAID: message auto-close cascade", "DENIED: 3-hop cascade (message REOPENED -> provider count +1 -> overload re-eval)"]
  - method: POST
    path: "/inbox/e-visit-claims/{id}/rework"
    description: "Return a DENIED claim to DRAFT after the message is RESOLVED again; code/fee/responsibility recomputed from current minutes"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: EVisitClaim
    side_effects: ["status -> DRAFT", "e_visit_tier_selection + patient_responsibility recomputed", "outstanding_billed_maintenance (-r_old)"]
  - method: POST
    path: "/inbox/e-visit-claims/{id}/void"
    description: "Void a claim in DRAFT or DENIED (write-off); DENIED void credits outstanding"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: EVisitClaim
    side_effects: ["status -> VOID", "outstanding_billed_maintenance (0 from DRAFT; -r from DENIED)"]

  # --- Escalations ---
  - method: GET
    path: "/inbox/escalations"
    description: "List escalations (FK reverse reachability for message_id and provider_id)"
    roles: [PracticeAdmin, TriageNurse, FrontDesk, Provider, BillingSpecialist]
    code: 200
    input: ["message_id?", "provider_id?", "status?", "limit?", "offset?"]
    output: "Escalation[]"
    side_effects: []
  - method: GET
    path: "/inbox/escalations/{id}"
    description: "Get an escalation"
    roles: [PracticeAdmin, TriageNurse, FrontDesk, Provider, BillingSpecialist]
    code: 200
    input: []
    output: Escalation
    side_effects: []
  - method: POST
    path: "/inbox/escalations/{id}/acknowledge"
    description: "On-call provider acknowledges; message moves ESCALATED -> IN_REVIEW"
    roles: [Provider]
    code: 200
    input: []
    output: Escalation
    side_effects: ["status = ACKNOWLEDGED", "acknowledged_at = now", "message -> IN_REVIEW"]

  # --- Test-driving endpoints ---
  - method: POST
    path: "/inbox/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any set call) is exactly 2026-08-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time. All received_at/triaged_at/deadline/overlap/selector evaluations read this clock."
    roles: [PracticeAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock := to_iso8601"]
  - method: POST
    path: "/inbox/_sla/sweep"
    description: "Run the SLA sweep: persists sla_breached for every non-terminal message whose (first_response_at ?? now) is STRICTLY greater than response_due_at; skips untriaged messages"
    roles: [PracticeAdmin]
    code: 200
    input: []
    output: "{ swept_count: integer, newly_breached_count: integer }"
    side_effects: ["sla_breach_evaluation over all PortalMessages with status NOT IN {RESOLVED, CLOSED} and response_due_at != null"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_ROLE_STAFF_MISMATCH, http: 403, condition: "Staff-backed role's X-User-ID is not a StaffMember whose staff_type matches the role" }
  - { id: ERR_PATIENT_OWNERSHIP_MISMATCH, http: 403, condition: "Patient role acting on a resource owned by a different patient (or list without own patient_id filter)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, invalid enum, out-of-range value, or unmet conditional field (copay_cents iff COPAY; coinsurance_pct iff COINSURANCE; denial_reason iff DENIED)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_message_version != current PortalMessage.version on OCC-guarded writes (triage, determine-billing)" }
  - { id: ERR_MESSAGE_INVALID_STATE, http: 409, condition: "Message not in a valid from-state for the requested action" }
  - { id: ERR_CLAIM_INVALID_STATE, http: 409, condition: "Claim not in a valid from-state for submit/adjudicate/rework/void" }
  - { id: ERR_CONSENT_ALREADY_RESPONDED, http: 409, condition: "Consent record not in REQUESTED when responding" }
  - { id: ERR_NOTICE_ALREADY_ACKNOWLEDGED, http: 409, condition: "Education notice not in ISSUED when acknowledging" }
  - { id: ERR_GRANT_ALREADY_REVOKED, http: 409, condition: "Delegation grant not ACTIVE when revoking" }
  - { id: ERR_ESCALATION_INVALID_STATE, http: 409, condition: "Escalation not OPEN when acknowledging" }
  - { id: ERR_NOT_AWAITING_COSIGN, http: 409, condition: "Message not in PENDING_COSIGN when cosign is attempted" }
  - { id: ERR_EDUCATION_ACK_REQUIRED, http: 403, condition: "Patient has a blocking ISSUED education notice; portal message creation blocked until acknowledged" }
  - { id: ERR_MESSAGE_NOT_CHARGEABLE, http: 409, condition: "Claim creation requires message.billing_disposition == CHARGEABLE" }
  - { id: ERR_MESSAGE_NOT_RESOLVED, http: 409, condition: "Claim creation/rework requires message.status == RESOLVED" }
  - { id: ERR_NOT_AUTHORIZED_COSIGNER, http: 403, condition: "Cosign caller is not the designated pending_cosign_by_id provider" }
  - { id: ERR_CATEGORY_NOT_CLINICAL, http: 422, condition: "BILLABLE_CANDIDATE determination requires category == CLINICAL" }
  - { id: ERR_POOL_ROLE_MISMATCH, http: 403, condition: "Caller staff_type not eligible for the message's pool kind and no covering delegation grant" }
  - { id: ERR_NOT_ASSIGNEE, http: 403, condition: "Caller is not the message assignee (reply/complete/time-entry) or the escalation's on-call provider (acknowledge)" }
  - { id: ERR_ONCALL_PROVIDER_TYPE, http: 422, condition: "OnCallShift.provider_id does not reference a PROVIDER" }
  - { id: ERR_INVALID_DELEGATION_TARGET, http: 422, condition: "Delegation target invalid: delegate == delegator, delegate/staff/pool missing, or pool not PROVIDER_INBOX" }
  - { id: ERR_RENDERING_PROVIDER_NOT_ON_THREAD, http: 422, condition: "Rendering provider has no CLINICAL_REVIEW time entry on the message" }
  - { id: ERR_NOT_GRANT_OWNER, http: 403, condition: "Revoke caller is not the grant's delegator" }
  - { id: ERR_INVALID_TIME_RANGE, http: 400, condition: "end_utc <= start_utc on window/shift/grant creation" }
  - { id: ERR_COVERAGE_WINDOW_OVERLAP, http: 409, condition: "Half-open coverage window intersects an existing window for the same staff_id" }
  - { id: ERR_ONCALL_SHIFT_OVERLAP, http: 409, condition: "Closed on-call shift intersects (incl. touching endpoints) an existing shift for the same provider" }
  - { id: ERR_DELEGATION_WINDOW_OVERLAP, http: 409, condition: "Closed grant window intersects (incl. touching) an existing ACTIVE grant for the same delegator+delegate pair" }
  - { id: ERR_NO_ACTIVE_COVERAGE, http: 409, condition: "Caller has no covering CoverageWindow and no covering ACTIVE DelegationGrant for the message's pool at start-review" }
  - { id: ERR_EVISIT_DUPLICATE_WITHIN_7_DAYS, http: 409, condition: "Another CHARGEABLE message of the same patient was received within the trailing 168h (exclusive lower bound)" }
  - { id: ERR_URGENCY_NOT_ESCALATABLE, http: 409, condition: "Escalation requires urgency IN {URGENT, EMERGENT}" }
  - { id: ERR_NO_ONCALL_COVERAGE, http: 409, condition: "On-call selector found no PROVIDER with a shift covering now" }
  - { id: ERR_CONSENT_REQUEST_PENDING, http: 409, condition: "A REQUESTED ConsentRecord already exists for the message" }
  - { id: ERR_CLAIM_ALREADY_EXISTS, http: 409, condition: "An active claim (DRAFT/SUBMITTED/DENIED) already exists for the message" }
  - { id: ERR_CLAIM_IN_FLIGHT, http: 409, condition: "Close blocked by claim in {DRAFT, SUBMITTED, DENIED}; determine-billing supersede blocked by claim in {SUBMITTED, DENIED}" }
  - { id: ERR_EVISIT_MINUTES_BELOW_MINIMUM, http: 422, condition: "clinical_minutes_total < 5 for e-visit determination or claim creation" }
  - { id: ERR_DISCLOSED_FEE_EXCEEDED, http: 422, condition: "Computed fee exceeds the version-pinned disclosed_fee_cents on the GRANTED consent" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Patient
    description: "Portal user; sends messages, replies, answers charge consents, acknowledges education notices"
    identity: "entity_backed:Patient"
    exclusive_operations:
      - "POST /inbox/portal-messages — send message (own; education-gated)"
      - "POST /inbox/consent-records/{id}/respond — grant/decline charge consent (own)"
      - "POST /inbox/education-notices/{id}/acknowledge — acknowledge notice (own)"
    shared_operations:
      - "POST /inbox/portal-messages/{id}/reply — patient reply on own message (reopen)"
      - "GET /inbox/portal-messages | /inbox/consent-records | /inbox/e-visit-claims | /inbox/education-notices — lists restricted to own patient_id"
      - "GET /inbox/patients/{id}, GET /inbox/portal-messages/{id}, GET /inbox/e-visit-claims/{id} — own records only"

  - name: TriageNurse
    description: "Inbox triage nurse (staff_type NURSE); intake classification, routing, escalation, education outreach; works NURSE_TRIAGE pool"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /inbox/portal-messages/{id}/triage — classify + route (OCC)"
      - "POST /inbox/portal-messages/{id}/assign — assign / re-route"
      - "POST /inbox/education-notices — issue appropriate-use education"
    shared_operations:
      - "POST /inbox/portal-messages/{id}/escalate — escalate to on-call (shared with Provider)"
      - "POST /inbox/portal-messages/{id}/start-review — claim from NURSE_TRIAGE pool (or PROVIDER_INBOX as delegate)"
      - "POST /inbox/portal-messages/{id}/reply, /complete — work own assigned messages"
      - "POST /inbox/portal-messages/{id}/close — close resolved message (shared with Provider)"
      - "POST /inbox/time-entries — log own work"
      - "GET endpoints per §1.5 roles"

  - name: FrontDesk
    description: "Front-desk staff (staff_type FRONT_DESK); handles ADMINISTRATIVE messages from the FRONT_DESK pool"
    identity: "entity_backed:StaffMember"
    exclusive_operations: []
    shared_operations:
      - "POST /inbox/portal-messages/{id}/start-review — claim from FRONT_DESK pool"
      - "POST /inbox/portal-messages/{id}/reply, /complete — work own assigned messages"
      - "POST /inbox/time-entries — log own work"
      - "GET endpoints per §1.5 roles"

  - name: Provider
    description: "Physician/APP (staff_type PROVIDER); clinical review, e-visit determination, cosign, delegation, on-call acknowledgement"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /inbox/portal-messages/{id}/determine-billing — e-visit determination (OCC)"
      - "POST /inbox/portal-messages/{id}/cosign — cosign/return delegate work"
      - "POST /inbox/delegation-grants — delegate pool coverage"
      - "POST /inbox/delegation-grants/{id}/revoke — revoke own grant (cascade)"
      - "POST /inbox/escalations/{id}/acknowledge — acknowledge own on-call escalation"
    shared_operations:
      - "POST /inbox/portal-messages/{id}/start-review — claim from PROVIDER_INBOX pool"
      - "POST /inbox/portal-messages/{id}/reply, /complete — work own assigned messages (no cosign needed for providers)"
      - "POST /inbox/portal-messages/{id}/escalate, /close — shared with TriageNurse"
      - "POST /inbox/time-entries — log own work (provider CLINICAL_REVIEW minutes drive e-visit tiers)"
      - "GET endpoints per §1.5 roles"

  - name: BillingSpecialist
    description: "Billing staff (staff_type BILLING_SPECIALIST); owns the e-visit claim lifecycle"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /inbox/e-visit-claims — create DRAFT claim"
      - "POST /inbox/e-visit-claims/{id}/submit — submit claim"
      - "POST /inbox/e-visit-claims/{id}/record-adjudication — record PAID/DENIED"
      - "POST /inbox/e-visit-claims/{id}/rework — DENIED -> DRAFT rework"
      - "POST /inbox/e-visit-claims/{id}/void — write off"
    shared_operations:
      - "POST /inbox/portal-messages/{id}/start-review — claim from BILLING pool"
      - "GET endpoints per §1.5 roles"

  - name: PracticeAdmin
    description: "Practice administrator; owns reference data, rosters, and the logical clock. Opaque operator identity (not entity-backed) so the first admin can bootstrap master data."
    identity: "opaque"
    exclusive_operations:
      - "POST /inbox/patients, POST /inbox/staff — master data"
      - "POST /inbox/pools — pool + response-target configuration"
      - "POST /inbox/coverage-windows — pool coverage scheduling"
      - "POST /inbox/on-call-shifts — on-call roster"
      - "POST /inbox/_clock/set_current_utc — logical clock"
      - "POST /inbox/_sla/sweep — SLA sweep"
    shared_operations:
      - "GET endpoints per §1.5 roles"
