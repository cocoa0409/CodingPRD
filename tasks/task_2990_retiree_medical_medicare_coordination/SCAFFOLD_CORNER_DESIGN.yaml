  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_retiree_version_returns_412_then_fresh_read_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.eligibility-determination-create-stale-retiree
          - validations[priority=14]
          - errors.ERR_STALE_RETIREE_VERSION
          - endpoints[POST /retiree-benefits/eligibility-determinations]
        distinguishing_aspect: |
          The first determination create bumps Retiree.version as a side effect
          of its own success, so the very version the client just used goes
          stale immediately. Re-sending it for a second plan year must fail with
          412 ERR_STALE_RETIREE_VERSION - not 409 for a duplicate, and not a
          silent success - while a re-read followed by the same call succeeds.
          The rejected attempt must leave determination_sequence untouched.
        test_recipe:
          setup:
            - "PlanYear 2027 OPEN and PlanYear 2028 OPEN."
            - "R1 Rosa Alvarez created at version 1; the client remembers that value."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
