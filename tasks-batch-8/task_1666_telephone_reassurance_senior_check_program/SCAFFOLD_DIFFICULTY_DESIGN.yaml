            - { call: "POST /api/call-assignments/${a2}/call-logs", payload: { called_at: "2026-08-03T10:05:00Z", duration_seconds: 300, outcome: "REACHED_CONCERN", concern_level: "ROUTINE", concern_categories: ["MEDICATION"] }, as: VolunteerCaller, as_user_id: "${v_id}", captures: { log_flag: $.data.id } }
          trigger:
            - { call: "POST /api/service-referrals", payload: { participant_id: "${p_id}", service_type: "MEALS", source_call_log_id: "${log_ok}" }, as: ProgramCoordinator, captures: { ref1: $.data.id } }
            - { call: "POST /api/service-referrals/${ref1}/submit", payload: {}, as: ProgramCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /api/service-referrals", payload: { participant_id: "${p_id}", service_type: "MEALS", source_call_log_id: "${log_flag}" }, as: ProgramCoordinator, captures: { ref2: $.data.id } }
            - { call: "POST /api/service-referrals/${ref2}/submit", payload: {}, as: ProgramCoordinator, captures: { st: $.data.status, due: $.data.sla_due_at } }
          assert:
            - "err == ERR_CONCERN_NOT_FLAGGED — CallLog.${log_ok}.concern_flag == false gates the referral submit"
            - "Second referral submits: st == SUBMITTED and due == 2026-08-06T11:00:00Z (STANDARD 72h from clock 2026-08-03T11:00:00Z)"
            - "CallLog.${log_flag}.concern_flag == true (outcome REACHED_CONCERN)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: availability_window_half_open_adjacency
        grounds:
          - calculations.assignment_conflict
          - errors[ERR_AVAILABILITY_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN with no buffer on AvailabilityWindow — a new MON 10:00-12:00
          window touching an existing MON 08:00-10:00 window at the shared endpoint is ACCEPTED,
          while MON 09:59-11:00 overlapping the interior is rejected. Contrasts with
          assignment_buffer_closed_interval_conflict, where touching at the buffered endpoint IS a
          conflict on a different resource (CallAssignment).
        test_recipe:
          setup: ["Program; volunteer registered (certification not required for availability management)"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 5, current_policy_version: "v2026.1", max_reserve_slots: 0 }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers", payload: { full_name: "Vol A", phone: "555-2900" }, as: ProgramCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /api/volunteers/${v_id}/availability-windows", payload: { weekday: "MON", window_start: "08:00", window_end: "10:00", effective_from: "2026-08-01" }, as: ProgramCoordinator, captures: { w1: $.data.id } }
          trigger:
            - { call: "POST /api/volunteers/${v_id}/availability-windows", payload: { weekday: "MON", window_start: "10:00", window_end: "12:00", effective_from: "2026-08-01" }, as: ProgramCoordinator, captures: { w2: $.data.id } }
            - { call: "POST /api/volunteers/${v_id}/availability-windows", payload: { weekday: "MON", window_start: "09:59", window_end: "11:00", effective_from: "2026-08-01" }, as: ProgramCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /api/volunteers/${v_id}/availability-windows", payload: { weekday: "TUE", window_start: "09:59", window_end: "11:00", effective_from: "2026-08-01" }, as: ProgramCoordinator, captures: { w4: $.data.id } }
          assert:
            - "w2 created: shared endpoint 10:00 is NOT an overlap under half-open [start, end) semantics"
            - "err == ERR_AVAILABILITY_OVERLAP for 09:59-11:00 (intersects both [08:00,10:00) and [10:00,12:00))"
            - "w4 created: same clock times on a DIFFERENT weekday do not overlap"

      - name: assignment_buffer_closed_interval_conflict
        grounds:
          - calculations.assignment_conflict
          - errors[ERR_ASSIGNMENT_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Interval semantics: CLOSED interval with a 15-minute documentation buffer on
          CallAssignment — an existing 09:00-09:30 assignment occupies [09:00, 09:45] inclusive, so
          a new 09:45 start CONFLICTS (touching the buffered endpoint) while 09:46 succeeds. This is
          the opposite adjacency rule from availability_window_half_open_adjacency on a different
          resource entity.
        test_recipe:
          setup:
            - "Program (default doc_buffer_minutes 15); enrolled participant with MON 09:00-11:00 schedule; certified volunteer with MON 08:00-17:00 availability; existing assignment 2026-08-03 09:00-09:30"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 5, current_policy_version: "v2026.1", max_reserve_slots: 0 }, as: ProgramCoordinator }
            - { call: "POST /api/participants", payload: { full_name: "Buf P", date_of_birth: "1952-01-01", phone: "555-3000", address: "1 Buf Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 1, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/emergency-contacts", payload: { full_name: "KB", phone: "555-3001", relationship: "son", contact_rank: "PRIMARY" }, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/approve", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/call-schedules", payload: { weekday: "MON", window_start: "09:00", window_end: "11:00" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers", payload: { full_name: "Vol B", phone: "555-3002" }, as: ProgramCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /api/volunteers/${v_id}/begin-training", payload: {}, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "SAFETY_PROTOCOL", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "LISTENING_SKILLS", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "MANDATED_REPORTING", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/confidentiality-agreements", payload: { policy_version: "v2026.1", valid_until: "2027-08-01T00:00:00Z" }, as: VolunteerCaller, as_user_id: "${v_id}" }
            - { call: "POST /api/volunteers/${v_id}/certify", payload: {}, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/availability-windows", payload: { weekday: "MON", window_start: "08:00", window_end: "17:00", effective_from: "2026-08-01" }, as: ProgramCoordinator }
            - { call: "POST /api/call-assignments", payload: { participant_id: "${p_id}", volunteer_id: "${v_id}", scheduled_date: "2026-08-03", window_start: "09:00", window_end: "09:30" }, as: ProgramCoordinator, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /api/call-assignments", payload: { participant_id: "${p_id}", volunteer_id: "${v_id}", scheduled_date: "2026-08-03", window_start: "09:45", window_end: "10:15" }, as: ProgramCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /api/call-assignments", payload: { participant_id: "${p_id}", volunteer_id: "${v_id}", scheduled_date: "2026-08-03", window_start: "09:46", window_end: "10:16" }, as: ProgramCoordinator, captures: { a2: $.data.id, a2_status: $.data.status } }
          assert:
            - "err == ERR_ASSIGNMENT_WINDOW_CONFLICT: 09:45 <= buffered end 09:45 (closed bound — touching conflicts)"
            - "a2_status == SCHEDULED for 09:46-10:16 (one minute past the buffered endpoint is free)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: occupied_slots_conserved_across_suspend_resume_and_swap
        grounds:
          - entities.Program.fields.occupied_slots
          - state_machines.Participant.ENROLLED_to_SUSPENDED
          - state_machines.Participant.ENROLLED_to_DISENROLLED
          - state_machines.WaitlistEntry.OFFERED_to_ACCEPTED
        distinguishing_aspect: |
          Conserved quantity: Program.occupied_slots == count of participants in
          {ENROLLED, SUSPENDED, WELFARE_HOLD}. Two compensating pairs are exercised: suspend+resume
          (net zero at each step) and disenroll+waitlist-accept (a slot leaves and is refilled,
          returning the total to exactly its pre-pair value of 1). Different conserved quantity than
          weekly_load_conserved_across_same_week_reschedule (minutes vs slots).
        test_recipe:
          setup:
            - "Program total_capacity 1, reserve 0; PA enrolled (occupied 1); PB waitlisted (entry E)"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 1, current_policy_version: "v2026.1", max_reserve_slots: 0 }, as: ProgramCoordinator, captures: { prog_id: $.data.id } }
            - { call: "POST /api/participants", payload: { full_name: "Inv A", date_of_birth: "1950-02-01", phone: "555-3100", address: "1 Inv Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 1, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { pa: $.data.id } }
            - { call: "POST /api/participants/${pa}/emergency-contacts", payload: { full_name: "KIA", phone: "555-3101", relationship: "son", contact_rank: "PRIMARY" }, as: IntakeWorker }
            - { call: "POST /api/participants/${pa}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${pa}/approve", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants", payload: { full_name: "Inv B", date_of_birth: "1950-02-02", phone: "555-3102", address: "2 Inv Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 1, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { pb: $.data.id } }
            - { call: "POST /api/participants/${pb}/emergency-contacts", payload: { full_name: "KIB", phone: "555-3103", relationship: "son", contact_rank: "PRIMARY" }, as: IntakeWorker }
            - { call: "POST /api/participants/${pb}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${pb}/approve", payload: {}, as: IntakeWorker, captures: { pb_status: $.data.status } }
            - { call: "GET /api/participants/${pb}/waitlist-entries", payload: {}, as: IntakeWorker, captures: { e_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/participants/${pa}/suspend", payload: { reason: "respite" }, as: ProgramCoordinator }
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: IntakeWorker, captures: { occ_suspend: $.data.occupied_slots } }
            - { call: "POST /api/participants/${pa}/resume", payload: {}, as: ProgramCoordinator }
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: IntakeWorker, captures: { occ_resume: $.data.occupied_slots } }
            - { call: "POST /api/participants/${pa}/disenroll", payload: { reason: "moved" }, as: ProgramCoordinator }
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: IntakeWorker, captures: { occ_dis: $.data.occupied_slots, pv: $.data.version } }
            - { call: "POST /api/programs/${prog_id}/promotion-runs", payload: { expected_program_version: "${pv}" }, as: IntakeWorker }
            - { call: "POST /api/waitlist-entries/${e_id}/accept", payload: {}, as: IntakeWorker, captures: { e_status: $.data.status } }
            - { call: "GET /api/programs/${prog_id}", payload: {}, as: IntakeWorker, captures: { occ_final: $.data.occupied_slots, wait_final: $.data.waiting_count } }
          assert:
            - "pb_status == WAITLISTED while the single slot was occupied"
            - "occ_suspend == 1 and occ_resume == 1 (suspend+resume pair: SUSPENDED still occupies; invariant holds at both observations)"
            - "occ_dis == 0 after disenroll"
            - "e_status == ACCEPTED and occ_final == 1 — the disenroll+accept swap restores the invariant occupied_slots == 1"
            - "wait_final == 0"

      - name: weekly_load_conserved_across_same_week_reschedule
        grounds:
          - calculations.volunteer_weekly_load
          - state_machines.CallAssignment.SCHEDULED_to_CANCELLED
          - calculations.volunteer_weekly_load
        distinguishing_aspect: |
          Conserved quantity: the volunteer's ISO-week assigned minutes. Rescheduling a 30-minute
          assignment within the same ISO week cancels the old row (RESCHEDULED, contributes 0) and
          creates the replacement (contributes 30 + 15 buffer): current_week_minutes == 45 both
          before and after the pair. Different conserved quantity than
          occupied_slots_conserved_across_suspend_resume_and_swap.
        test_recipe:
          setup:
            - "Program; enrolled participant with MON and WED 09:00-11:00 schedules; certified volunteer with MON+WED availability"
            - "Assignment A1 on MON 2026-08-03 09:00-09:30 (load 45)"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 5, current_policy_version: "v2026.1", max_reserve_slots: 0 }, as: ProgramCoordinator }
            - { call: "POST /api/participants", payload: { full_name: "Res P", date_of_birth: "1952-02-03", phone: "555-3200", address: "3 Inv Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 1, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/emergency-contacts", payload: { full_name: "KRE", phone: "555-3201", relationship: "son", contact_rank: "PRIMARY" }, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/approve", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/call-schedules", payload: { weekday: "MON", window_start: "09:00", window_end: "11:00" }, as: ProgramCoordinator }
            - { call: "POST /api/participants/${p_id}/call-schedules", payload: { weekday: "WED", window_start: "09:00", window_end: "11:00" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers", payload: { full_name: "Vol RE", phone: "555-3202" }, as: ProgramCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /api/volunteers/${v_id}/begin-training", payload: {}, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "SAFETY_PROTOCOL", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "LISTENING_SKILLS", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "MANDATED_REPORTING", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/confidentiality-agreements", payload: { policy_version: "v2026.1", valid_until: "2027-08-01T00:00:00Z" }, as: VolunteerCaller, as_user_id: "${v_id}" }
            - { call: "POST /api/volunteers/${v_id}/certify", payload: {}, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/availability-windows", payload: { weekday: "MON", window_start: "08:00", window_end: "17:00", effective_from: "2026-08-01" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/availability-windows", payload: { weekday: "WED", window_start: "08:00", window_end: "17:00", effective_from: "2026-08-01" }, as: ProgramCoordinator }
            - { call: "POST /api/call-assignments", payload: { participant_id: "${p_id}", volunteer_id: "${v_id}", scheduled_date: "2026-08-03", window_start: "09:00", window_end: "09:30" }, as: ProgramCoordinator, captures: { a1: $.data.id } }
          trigger:
            - { call: "GET /api/volunteers/${v_id}", payload: {}, as: ProgramCoordinator, captures: { load_pre: $.data.current_week_minutes } }
            - { call: "POST /api/call-assignments/${a1}/reschedule", payload: { new_scheduled_date: "2026-08-05", new_window_start: "09:00", new_window_end: "09:30" }, as: ProgramCoordinator, captures: { a2: $.data.id, a2_from: $.data.rescheduled_from_id } }
            - { call: "GET /api/volunteers/${v_id}", payload: {}, as: ProgramCoordinator, captures: { load_post: $.data.current_week_minutes } }
            - { call: "GET /api/call-assignments/${a1}", payload: {}, as: ProgramCoordinator, captures: { a1_status: $.data.status, a1_reason: $.data.cancel_reason } }
          assert:
            - "load_pre == 45 (one 30-minute slot + 15-minute buffer)"
            - "load_post == 45 — cancel+create pair conserves weekly minutes within the same ISO week (2026-08-03 and 2026-08-05 share the week)"
            - "a1_status == CANCELLED and a1_reason == RESCHEDULED (the compensating leg of the pair)"
            - "CallAssignment.${a2}.rescheduled_from_id == ${a1} and status == SCHEDULED"
