            - "data.cumulative_pass_rate == 0.875 (70 passed / 80 total, pooling both runs)"
            - "data.open_blocker_count == 0"
            - "data.state == 'TESTING'"
            - "second trigger response status is 200"
            - "second trigger response data.state == 'CERTIFIED' — certification read latest_pass_rate 1.0, not the 0.75 of the last-inserted run"
            - "second trigger response data.certified_by_user_id == 'si-certifier-3'"

      - name: dependency_graph_topological_order_with_two_predecessors
        claim_type: topological
        grounds:
          - "§1.3 critical_path_schedule runs Kahn's algorithm over MilestoneDependency edges, sets ES = max over drivers, EF = ES + effective_duration, LF from the backward pass and is_critical = total_float_days == 0; a join node with two predecessors makes the driving predecessor decide ES and leaves the shorter branch with float."
        distinguishing_aspect: "INTERIOR_FIT_OUT has two predecessors of unequal length, so its early_start is driven by the longer branch (2026-09-21) and MEP_ROUGH_IN picks up total_float_days 5 while the other two milestones stay on the critical path."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
            - "Three milestones STRUCTURE_TOPPED_OUT (20 days, planned_start 2026-09-01), MEP_ROUGH_IN (15 days, 2026-09-02) and INTERIOR_FIT_OUT (10 days, 2026-09-25), with FINISH_START lag 0 edges from each of the first two into INTERIOR_FIT_OUT; the program is still PLANNING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
