            - "all three rows have status == \"SUPERSEDED\""
            - "the row with round_index 3 has countered_at_utc == \"2026-08-01T06:00:00Z\" and cooldown_until_utc == \"2026-08-01T08:00:00Z\""
            - "the row with round_index 1 has buyer_demand_cents == 250000 and the row with round_index 3 has buyer_demand_cents == 230000"
            - "GET /arbitration/sales/${sale_id} returns arbitration_status == \"ACTIVE\" and open_case_count == 1   # the loop never touched the sale's dimensions"

      - name: sale_settlement_and_arbitration_dimensions_move_independently
        grounds:
          - state_machines.AuctionSale.settlement_status_UNSETTLED_to_SETTLED
          - state_machines.AuctionSale.settlement_status_SETTLED_to_REVERSED
          - state_machines.AuctionSale.arbitration_status_NONE_to_ACTIVE
          - state_machines.AuctionSale.arbitration_status_ACTIVE_to_RESOLVED
          - entities.AuctionSale.fields.settlement_status
          - entities.AuctionSale.fields.arbitration_status
        distinguishing_aspect: |
          Parallel dimensions on one row: settlement_status and arbitration_status are
          driven by different endpoints, different actors and different triggers, and
          neither gates the other — the sale is SETTLED while arbitration is already
          ACTIVE, and the intermediate observation (SETTLED x ACTIVE) is a combination no
          single-dimension model can represent.
