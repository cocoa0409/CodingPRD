scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: risk_score_provisional_excludes_in_flight_complaint_audit_includes
        grounds:
          - calculations.establishment_risk_score
          - entities.Establishment.fields.risk_score
          - state_machines.Complaint.RECEIVED_to_TRIAGED
          - endpoints["GET /body-art/establishments/{establishment_id}/compliance-summary"]
        distinguishing_aspect: |
          This dual variant lives on the Establishment risk domain: identical stored rows
          yield risk_score_provisional == 25 and risk_score_audit == 30 because the AUDIT
          variant adds IN_FLIGHT_COMPLAINT_WEIGHT for the single TRIAGED complaint that the
          PROVISIONAL variant ignores entirely.
        test_recipe:
          setup:
            - "One Establishment permitted and ACTIVE with operating_posture OPEN, zero sterilization records on file (so sterilization_compliance_status is NONCOMPLIANT and the PROVISIONAL risk score is exactly the 25-point sterilization penalty)."
            - "One Complaint against that establishment sitting in TRIAGED — in flight, not yet substantiated."
          setup_api_calls:
            - call: "POST /body-art/establishments"
              payload: { name: "Ink Alley", street_address: "12 Main St", county_code: "ADA", establishment_type: "TATTOO" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_id: $.data.id }
            - call: "POST /body-art/plan-reviews"
              payload: { establishment_id: "${est_id}", floor_plan_reference: "FP-100", sterilization_area_sqft: 60, procedure_station_count: 3, has_handwash_sink: true }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { pr_id: $.data.id }
            - call: "POST /body-art/plan-reviews/${pr_id}/decision"
              payload: { decision: "APPROVE", decision_notes: "Plans meet code" }
              as: PlanReviewer
              as_user_id: "reviewer-1"
            - call: "POST /body-art/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "PREOPENING", scheduled_start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-05-01T02:00:00Z" }
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { ins_pre_id: $.data.id }
            - call: "POST /body-art/inspections/${ins_pre_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
            - call: "POST /body-art/inspections/${ins_pre_id}/finalize"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
            - call: "POST /body-art/establishments/${est_id}/activate"
              payload: {}
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "POST /body-art/complaints"
              payload: { establishment_id: "${est_id}", complainant_contact: "citizen@example.com", category: "SANITATION", narrative: "Floor was visibly dirty during my session." }
              as: PublicUser
              as_user_id: "citizen-9"
              captures: { cmp_id: $.data.id }
            - call: "POST /body-art/complaints/${cmp_id}/transition"
              payload: { action: "TRIAGE" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
          trigger:
            - call: "GET /body-art/establishments/${est_id}/compliance-summary"
              payload: {}
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { prov: $.data.risk_score_provisional, aud: $.data.risk_score_audit, posture: $.data.operating_posture }
          assert:
            - "${prov} == 25"
            - "${aud} == 30"
            - "${aud} - ${prov} == 5, exactly IN_FLIGHT_COMPLAINT_WEIGHT for the one TRIAGED complaint"
            - "${posture} == OPEN"
            - "Establishment.${est_id}.risk_score == 25 (only the PROVISIONAL figure is persisted)"
            - "Complaint.${cmp_id}.status == TRIAGED"

      - name: renewal_fee_estimate_vs_final_diverge_on_artist_count
        grounds:
          - calculations.renewal_fee_total
          - entities.RenewalApplication.fields.fee_estimate_cents
          - entities.RenewalApplication.fields.fee_final_cents
          - entities.RenewalApplication.fields.fee_balance_due_cents
          - state_machines.RenewalApplication.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          This dual variant lives on the RenewalApplication fiscal domain, not on the
          Establishment risk domain: the ESTIMATE written at submit uses the one ACTIVE
          artist on the roster and yields 36067 cents, while the FINAL written at approval
          re-reads the roster (now two ACTIVE artists) and yields 45258 cents, leaving a
          9191-cent balance due.
        test_recipe:
          setup:
            - "One ACTIVE Establishment with exactly one ACTIVE Artist and one PASS sterilization record filed in the trailing window (so sterilization_compliance_status is DEFICIENT and does not block approval)."
            - "A RenewalApplication SUBMITTED while the roster held one ACTIVE artist, fully paid against its ESTIMATE."
            - "A second Artist activated after submission but before the approval decision."
          setup_api_calls:
            - call: "POST /body-art/establishments"
              payload: { name: "Needle & Thread", street_address: "44 Oak Ave", county_code: "ADA", establishment_type: "COMBINED" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_id: $.data.id }
            - call: "POST /body-art/plan-reviews"
              payload: { establishment_id: "${est_id}", floor_plan_reference: "FP-200", sterilization_area_sqft: 55, procedure_station_count: 2, has_handwash_sink: true }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { pr_id: $.data.id }
            - call: "POST /body-art/plan-reviews/${pr_id}/decision"
              payload: { decision: "APPROVE", decision_notes: "Approved" }
              as: PlanReviewer
              as_user_id: "reviewer-1"
            - call: "POST /body-art/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "PREOPENING", scheduled_start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-05-01T02:00:00Z" }
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { ins_pre_id: $.data.id }
            - call: "POST /body-art/inspections/${ins_pre_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
            - call: "POST /body-art/inspections/${ins_pre_id}/finalize"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
            - call: "POST /body-art/establishments/${est_id}/activate"
              payload: {}
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "POST /body-art/artists"
              payload: { establishment_id: "${est_id}", legal_name: "Rae Lin" }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /body-art/artists/${a1_id}/bbp-training"
              payload: { completed_on: "2026-04-01T00:00:00Z" }
              as: Artist
              as_user_id: "${a1_id}"
            - call: "POST /body-art/artists/${a1_id}/activate"
              payload: {}
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "POST /body-art/sterilization-records"
              payload: { establishment_id: "${est_id}", device_serial: "AC-1", cycle_completed_at: "2026-04-20T00:00:00Z", spore_test_result: "PASS" }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
            - call: "GET /body-art/establishments/${est_id}"
              payload: {}
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_v: $.data.version }
            - call: "POST /body-art/renewal-applications"
              payload: { establishment_id: "${est_id}", requested_term_start_on: "2027-05-01T00:00:00Z", attested_bbp_current: true, attested_sterilization_logs_complete: true, expedite_requested: false, expected_establishment_version: "${est_v}" }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /body-art/renewal-applications/${ra_id}/submit"
              payload: {}
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { est_fee: $.data.fee_estimate_cents }
            - call: "POST /body-art/artists"
              payload: { establishment_id: "${est_id}", legal_name: "Kai Vo" }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { a2_id: $.data.id }
            - call: "POST /body-art/artists/${a2_id}/bbp-training"
              payload: { completed_on: "2026-04-01T00:00:00Z" }
              as: Artist
              as_user_id: "${a2_id}"
            - call: "POST /body-art/artists/${a2_id}/activate"
              payload: {}
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "POST /body-art/renewal-applications/${ra_id}/payment"
              payload: { amount_cents: 36067 }
              as: RecordsClerk
              as_user_id: "clerk-1"
          trigger:
            - call: "POST /body-art/renewal-applications/${ra_id}/review"
              payload: { decision: "APPROVE" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { fin_fee: $.data.fee_final_cents, bal: $.data.fee_balance_due_cents }
          assert:
            - "${est_fee} == 36067"
            - "${fin_fee} == 45258"
            - "${bal} == 9191"
            - "RenewalApplication.${ra_id}.status == APPROVED"
            - "RenewalApplication.${ra_id}.artist_count_at_submit == 1"
            - "RenewalApplication.${ra_id}.late_fee_applied == false"
            - "Establishment.${est_id}.permit_expires_on == 2027-05-01T00:00:00.000Z"
            - "Establishment.${est_id}.active_artist_count == 2"

  - rule_id: combinatorial_formula
    instances:
      - name: reinspection_factor_applies_after_repeat_and_carryover_are_summed
        grounds:
          - calculations.inspection_score
          - entities.Inspection.fields.open_violation_count_at_start
          - entities.Violation.fields.repeat_multiplier_applied
          - entities.Violation.fields.deduction_points
          - state_machines.Inspection.IN_PROGRESS_to_FAILED
        distinguishing_aspect: |
          Mode (a): three independent inputs (the cited violation set with its per-line
          repeat multiplier, the capped open-violation carryover, and the REINSPECTION
          type factor) interact non-linearly — 18 + 6 raw plus a min()-capped carryover of
          10 is multiplied once by 1.25 and rounded half-up to 43, giving score 57. No
          rounding-order or circular-dependency question is involved here.
        test_recipe:
          setup:
            - "An ACTIVE Establishment that already failed a ROUTINE inspection on 2026-05-10, citing BBP_001 (CRITICAL), STER_004 and HAND_002 (both NONCRITICAL)."
            - "The BBP_001 citation has been corrected and VERIFIED, so it is eligible as a repeat precedent; STER_004 and HAND_002 remain ISSUED, giving open_violation_count == 2."
            - "A REINSPECTION scheduled for 2026-05-20 that is started with that carryover of 2 and cites BBP_001 (CRITICAL, a repeat) plus STER_009 (NONCRITICAL, new)."
          setup_api_calls:
            - call: "POST /body-art/establishments"
              payload: { name: "Iron Rose", street_address: "9 Elm Rd", county_code: "ADA", establishment_type: "TATTOO" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_id: $.data.id }
            - call: "POST /body-art/plan-reviews"
              payload: { establishment_id: "${est_id}", floor_plan_reference: "FP-300", sterilization_area_sqft: 50, procedure_station_count: 2, has_handwash_sink: true }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { pr_id: $.data.id }
            - call: "POST /body-art/plan-reviews/${pr_id}/decision"
              payload: { decision: "APPROVE", decision_notes: "Approved" }
              as: PlanReviewer
              as_user_id: "reviewer-1"
            - call: "POST /body-art/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "PREOPENING", scheduled_start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-05-01T02:00:00Z" }
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { ins_pre_id: $.data.id }
            - call: "POST /body-art/inspections/${ins_pre_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
            - call: "POST /body-art/inspections/${ins_pre_id}/finalize"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
            - call: "POST /body-art/establishments/${est_id}/activate"
              payload: {}
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "POST /body-art/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "ROUTINE", scheduled_start_at: "2026-05-10T00:00:00Z", scheduled_end_at: "2026-05-10T02:00:00Z" }
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { ins1_id: $.data.id }
            - call: "POST /body-art/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "POST /body-art/inspections/${ins1_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
            - call: "POST /body-art/inspections/${ins1_id}/violations"
              payload: { violation_code: "BBP_001", severity: "CRITICAL", narrative: "Sharps container overfull." }
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { v1_id: $.data.id }
            - call: "POST /body-art/inspections/${ins1_id}/violations"
              payload: { violation_code: "STER_004", severity: "NONCRITICAL", narrative: "Autoclave log gap." }
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { v2_id: $.data.id }
            - call: "POST /body-art/inspections/${ins1_id}/violations"
              payload: { violation_code: "HAND_002", severity: "NONCRITICAL", narrative: "Handwash soap empty." }
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { v3_id: $.data.id }
            - call: "POST /body-art/inspections/${ins1_id}/finalize"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
            - call: "POST /body-art/violations/${v1_id}/correction"
              payload: { correction_note: "Sharps container replaced and logged." }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
            - call: "POST /body-art/violations/${v1_id}/correction-decision"
              payload: { decision: "VERIFY" }
              as: Inspector
              as_user_id: "officer-insp-1"
            - call: "POST /body-art/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "REINSPECTION", scheduled_start_at: "2026-05-20T00:00:00Z", scheduled_end_at: "2026-05-20T02:00:00Z" }
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { ins2_id: $.data.id }
            - call: "POST /body-art/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "POST /body-art/inspections/${ins2_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { carryover_snapshot: $.data.open_violation_count_at_start }
            - call: "POST /body-art/inspections/${ins2_id}/violations"
              payload: { violation_code: "BBP_001", severity: "CRITICAL", narrative: "Sharps container overfull again." }
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { v4_id: $.data.id }
            - call: "POST /body-art/inspections/${ins2_id}/violations"
              payload: { violation_code: "STER_009", severity: "NONCRITICAL", narrative: "Weekly spore test not run." }
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { v5_id: $.data.id }
          trigger:
            - call: "POST /body-art/inspections/${ins2_id}/finalize"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { score2: $.data.score, status2: $.data.status }
          assert:
            - "${carryover_snapshot} == 2"
            - "${score2} == 57"
            - "${status2} == FAILED"
            - "Violation.${v4_id}.repeat_multiplier_applied == 1.5"
            - "Violation.${v4_id}.deduction_points == 18"
            - "Violation.${v5_id}.repeat_multiplier_applied == 1.0"
            - "Violation.${v5_id}.deduction_points == 6"
            - "Inspection.${ins1_id}.score == 76"

      - name: renewal_fee_rounds_each_line_before_summing
        grounds:
          - calculations.renewal_fee_total
          - entities.RenewalApplication.fields.fee_estimate_cents
          - state_machines.RenewalApplication.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (b): with exactly one ACTIVE artist the three raw lines 25000, 7500 and 1050
          become 26875, 8063 and 1129 after per-line rounding, summing to 36067 — while
          summing first (33550 * 1.075 = 36066.25) and rounding once gives 36066. The
          scaffold pins the per-line order, so 36067 is the only correct answer.
        test_recipe:
          setup:
            - "One ACTIVE Establishment whose permit expires 2027-05-01, with exactly one ACTIVE Artist and no expedite request, submitting well before expiry so no late line applies."
          setup_api_calls:
            - call: "POST /body-art/establishments"
              payload: { name: "Bluebird Body Art", street_address: "77 Pine St", county_code: "ADA", establishment_type: "PIERCING" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_id: $.data.id }
            - call: "POST /body-art/plan-reviews"
              payload: { establishment_id: "${est_id}", floor_plan_reference: "FP-400", sterilization_area_sqft: 45, procedure_station_count: 1, has_handwash_sink: true }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { pr_id: $.data.id }
            - call: "POST /body-art/plan-reviews/${pr_id}/decision"
              payload: { decision: "APPROVE", decision_notes: "Approved" }
              as: PlanReviewer
              as_user_id: "reviewer-1"
            - call: "POST /body-art/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "PREOPENING", scheduled_start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-05-01T02:00:00Z" }
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { ins_pre_id: $.data.id }
            - call: "POST /body-art/inspections/${ins_pre_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
            - call: "POST /body-art/inspections/${ins_pre_id}/finalize"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
            - call: "POST /body-art/establishments/${est_id}/activate"
              payload: {}
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "POST /body-art/artists"
              payload: { establishment_id: "${est_id}", legal_name: "Sol Marek" }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /body-art/artists/${a1_id}/bbp-training"
              payload: { completed_on: "2026-04-01T00:00:00Z" }
              as: Artist
              as_user_id: "${a1_id}"
            - call: "POST /body-art/artists/${a1_id}/activate"
              payload: {}
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "GET /body-art/establishments/${est_id}"
              payload: {}
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_v: $.data.version }
            - call: "POST /body-art/renewal-applications"
              payload: { establishment_id: "${est_id}", requested_term_start_on: "2027-05-01T00:00:00Z", attested_bbp_current: true, attested_sterilization_logs_complete: true, expedite_requested: false, expected_establishment_version: "${est_v}" }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { ra_id: $.data.id }
          trigger:
            - call: "POST /body-art/renewal-applications/${ra_id}/submit"
              payload: {}
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { fee: $.data.fee_estimate_cents, late: $.data.late_fee_applied, n_at_submit: $.data.artist_count_at_submit }
          assert:
            - "${fee} == 36067"
            - "${fee} != 36066"
            - "${late} == false"
            - "${n_at_submit} == 1"
            - "RenewalApplication.${ra_id}.status == SUBMITTED"
            - "RenewalApplication.${ra_id}.cycle_count == 1"

  - rule_id: non_linear_state_machine
    instances:
      - name: violation_correction_reject_cycles_back_to_issued
        grounds:
          - state_machines.Violation.CORRECTION_SUBMITTED_to_ISSUED
          - state_machines.Violation.ISSUED_to_CORRECTION_SUBMITTED
          - state_machines.Violation.CORRECTION_SUBMITTED_to_VERIFIED
          - entities.Violation.fields.correction_note
        distinguishing_aspect: |
          Non-linearity on the Violation entity is a true cycle: REJECT before
          abatement_due_at returns the row to ISSUED with correction_note cleared, so the
          same ISSUED -> CORRECTION_SUBMITTED -> ISSUED loop can be walked more than once
          before a VERIFY finally terminates it.
        test_recipe:
          setup:
            - "An ACTIVE Establishment with an IN_PROGRESS ROUTINE inspection at logical clock 2026-05-05."
            - "One NONCRITICAL violation STER_004 ISSUED at 2026-05-05, whose abatement_due_at is 2026-05-19, with a correction already submitted."
          setup_api_calls:
            - call: "POST /body-art/establishments"
              payload: { name: "Loop Ink", street_address: "3 Birch Ln", county_code: "ADA", establishment_type: "TATTOO" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_id: $.data.id }
            - call: "POST /body-art/plan-reviews"
              payload: { establishment_id: "${est_id}", floor_plan_reference: "FP-500", sterilization_area_sqft: 48, procedure_station_count: 2, has_handwash_sink: true }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { pr_id: $.data.id }
            - call: "POST /body-art/plan-reviews/${pr_id}/decision"
              payload: { decision: "APPROVE", decision_notes: "Approved" }
              as: PlanReviewer
              as_user_id: "reviewer-1"
            - call: "POST /body-art/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "PREOPENING", scheduled_start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-05-01T02:00:00Z" }
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { ins_pre_id: $.data.id }
            - call: "POST /body-art/inspections/${ins_pre_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
            - call: "POST /body-art/inspections/${ins_pre_id}/finalize"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
            - call: "POST /body-art/establishments/${est_id}/activate"
              payload: {}
              as: HealthOfficer
