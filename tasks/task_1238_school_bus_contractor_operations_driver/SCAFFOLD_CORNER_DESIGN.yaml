  # ===========================================================================
  # Excluded stubs — corners already exercised as §1.8 difficulty instances
  # ===========================================================================
  - section: errors
    instances:
      - name: corner_driver_not_active_covered
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_DRIVER_NOT_ACTIVE]"
        excluded_because:
          difficulty_instance: confirm_requires_active_driver
          rationale: "ERR_DRIVER_NOT_ACTIVE is the asserted outcome of the named §1.8 cross-entity dependency instance."
      - name: corner_bus_not_in_service_covered
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_BUS_NOT_IN_SERVICE]"
        excluded_because:
          difficulty_instance: confirm_requires_in_service_bus
          rationale: "ERR_BUS_NOT_IN_SERVICE is the asserted outcome of the named §1.8 instance (and of the safety-vs-fiscal priority instance)."
      - name: corner_endorsement_missing_on_reinstate_covered
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_ENDORSEMENT_MISSING]"
        excluded_because:
          difficulty_instance: reinstate_requires_valid_credentials
          rationale: "ERR_ENDORSEMENT_MISSING on REINSTATE is the asserted outcome of the named §1.8 instance; ACTIVATE-path coverage is in error_endorsement_missing_on_activate_returns_409."
      - name: corner_shortage_variant_selection_covered
        claim_type: variant_selection
        grounds:
          - calculations.shortage_penalty
        excluded_because:
          difficulty_instance: shortage_penalty_flat_vs_student_minute
          rationale: "Variant selection by contract.penalty_mode plus the numeric divergence are asserted in the named §1.8 instance."
      - name: corner_invoice_variant_selection_covered
        claim_type: variant_selection
        grounds:
          - calculations.invoice_billing_core
        excluded_because:
          difficulty_instance: invoice_provisional_vs_final_billing
          rationale: "PROVISIONAL-at-generate vs FINAL-at-issue selection and the 200000/100000 divergence are asserted in the named §1.8 instance."
      - name: corner_driver_overlap_covered
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_DRIVER_OVERLAP_CONFLICT]"
        excluded_because:
          difficulty_instance: driver_overlap_half_open_adjacency
          rationale: "The half-open overlap rejection and the adjacency allowance are both asserted in the named §1.8 instance."
      - name: corner_charter_buffer_covered
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_CHARTER_BUS_UNAVAILABLE]"
        excluded_because:
          difficulty_instance: charter_bus_buffered_window_overlap
          rationale: "The buffered closed-window rejection and the clear-window acceptance are both asserted in the named §1.8 instance."
