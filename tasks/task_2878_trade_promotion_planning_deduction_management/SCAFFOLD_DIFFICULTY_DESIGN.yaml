              captures: { alloc_v1: $.data.version }
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_id}", name: "Promotion X", window_start: "2026-08-03", window_end: "2026-08-31", accrual_method: "CONSUMPTION", expected_allocation_version: "${alloc_v1}" }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { promo_x_id: $.data.id }
            - call: "GET /trade-marketing/budget-allocations/${alloc_id}"
