              payload: {}
              as: ContractingOfficer
              as_user_id: "officer-exec-02"
              captures: { v_after_plan_create: $.data.version }
            - call: "POST /operating-plans/${plan_id}/approve"
              payload: {}
              as: ContractingOfficer
              as_user_id: "officer-exec-02"
            - call: "GET /leases/${lease_id}"
              payload: {}
              as: ContractingOfficer
              as_user_id: "officer-exec-02"
              captures: { v_after_plan_approve: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-07-02T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gross-receipts-reports"
              payload: { lease_id: "${lease_id}", period_start: "2027-04-01", period_end: "2027-05-01", lodging_receipts_cents: 10000000, food_beverage_receipts_cents: 20000000, retail_receipts_cents: 8000000, activity_receipts_cents: 2000000 }
              as: Concessionaire
              as_user_id: "${offeror_id}"
              captures: { rpt1_id: $.data.id }
            - call: "GET /leases/${lease_id}"
              payload: {}
              as: ContractingOfficer
              as_user_id: "officer-exec-02"
              captures: { v_after_report_create: $.data.version }
          trigger:
            - call: "POST /gross-receipts-reports/${rpt1_id}/accept"
              payload: { remittance_received_cents: 2150000 }
              as: ContractingOfficer
              as_user_id: "officer-exec-02"
            - call: "GET /leases/${lease_id}"
              payload: {}
              as: ContractingOfficer
              as_user_id: "officer-exec-02"
          assert:
            - "${v_award} == 1"
            - "${v_exec} == 2"
            - "${v_after_plan_create} == 3"
            - "${v_after_plan_approve} == 3"
            - "${v_after_report_create} == 3"
            - "the accept returns HTTP 200 and the follow-up lease read returns data.version == 4"
            - "OperatingPlan.${plan_id}.version == 2"
            - "the follow-up lease read returns reported_receipts_ytd_cents == 40000000 and maintenance_reserve_balance_cents == 200000"

      - name: audit_finalization_fans_out_across_four_aggregates
        claim_type: cascading_side_effects
        grounds:
          - endpoints.POST_audit_engagements_id_finalize
        excluded_because:
          difficulty_instance: "transitive_cascade / audit_finalize_cascades_restatement_reconciliation_balance_and_notice"
          rationale: "That instance drives finalization once and asserts every hop — per-report restatement with the remainder absorbed by the last period, the superseded prior reconciliation, the audit-minted replacement with penalty and interest, the recomputed lease balance and the system-issued delinquency notice. Nothing about the cascading-side-effects layer is left unprobed."

      - name: annual_and_period_fee_variants_coexist_on_one_lease
        claim_type: dual_variant_calculation
        grounds:
          - calculations.period_franchise_fee
          - calculations.annual_fee_reconciliation
        excluded_because:
          difficulty_instance: "dual_variant_calc / annual_tiered_ladder_diverges_from_period_remittance_sum"
          rationale: "The dual-variant layer is exactly what that instance exists to attack: the same receipts priced twice, once per period at category rates and once per year on the marginal ladder, with the divergence asserted as a non-zero base_delta."

      - name: underreport_rate_crossing_the_penalty_threshold_arms_the_penalty
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.audit_underreport_assessment
          - constants.UNDERREPORT_PENALTY_THRESHOLD_PCT
        excluded_because:
          difficulty_instance: "boundary_precision_check / underreport_pct_at_exact_threshold_triggers_penalty_flag"
          rationale: "The threshold-trigger layer has one observable: penalty_applies flipping as the computed rate crosses UNDERREPORT_PENALTY_THRESHOLD_PCT. That instance parks the rate exactly on the constant after rounding, which subsumes any coarser probe of the same trigger."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: award_cascade_is_readable_immediately_after_the_write_returns
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_prospectuses_id_award
        distinguishing_aspect: "The scaffold's consistency model is immediate, so there is no settle step and no eventual convergence: the moment award returns 201, independent reads of the minted lease, the minted bond, the losing proposal, the prospectus and the opportunity must all already show their post-cascade values. Reads performed by a different role in the very next call must agree with the write's own response body field for field."
