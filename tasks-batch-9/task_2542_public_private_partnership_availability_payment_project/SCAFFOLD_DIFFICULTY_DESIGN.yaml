  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: service_period_two_axes_advance_independently_with_one_cross_axis_gate
        grounds:
          - state_machines.ServicePeriod.reporting_status
          - state_machines.ServicePeriod.payment_status
          - state_machines.ServicePeriod.payment_status.UNBILLED_to_INVOICED
          - complexity_profile.state_machine_shape
          - validations.priority_40
        distinguishing_aspect: |
          Entity = ServicePeriod. Non-linearity by PARALLEL AXES: reporting_status
          (PENDING -> SELF_REPORTED -> VERIFIED, itself cyclic) and payment_status
          (UNBILLED -> INVOICED -> PAID) are two independent state fields on one row.
          The machine is not a chain: exactly one cross-axis gate exists (invoice requires
          reporting_status == VERIFIED) and every other combination is legal. The test walks
          the reporting axis backwards through the reject edge — SELF_REPORTED -> PENDING —
          while payment_status sits still at UNBILLED, then forwards again, proving the two
          axes neither share a cursor nor advance in lockstep.
