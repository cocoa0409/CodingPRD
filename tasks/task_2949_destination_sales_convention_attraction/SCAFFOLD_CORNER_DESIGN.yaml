              as: SalesManager
            - call: "POST /space-holds"
              payload: { opportunity_id: "${opp_b_id}", center_hall_id: "${hall_id}", move_in_start: "2028-04-08T00:00:00Z", move_out_end: "2028-04-13T00:00:00Z" }
