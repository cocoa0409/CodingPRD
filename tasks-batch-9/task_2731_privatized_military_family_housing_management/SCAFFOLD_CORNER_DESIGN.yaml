              captures: { m_epoch2: "$.data.metrics_run_epoch", m_last2: "$.data.last_metrics_run_at" }
            - call: "POST /reinvestment-accounts/${acct_id}/metrics-run"
              payload: { period_month: "2026-11" }
              as: PropertyManager
              captures: { e_future: "$.data.error_id" }
          assert:
            - "${bal1} == 218150 after the first allotment run - one CHARGE of the net rent was posted for 2026-09."
            - "${bal2} == 218150 and the period_month=2026-09 ledger read still returns exactly 1 row (total_count 1) - the REPEATED allotment run for the same period is a silent no-op: HTTP 200, no second CHARGE, no balance movement, no error. The allotment run re-run policy is skip-if-present."
            - "${o_epoch} == 2 and ${o_last} == 2026-10-01T09:00:00Z with ${o_pending} == 0 and ${o_assigned} == 0 - the offer run advanced its checkpoint even though it had NOTHING to offer, because its checkpoint is not keyed by a period. Compare the allotment run above, which did nothing AND recorded nothing."
            - "${m_epoch} == 1 and ${m_last} == 2026-10-01T09:00:00Z - the first metrics run advanced the third checkpoint."
            - "${e_rerun} == ERR_PERIOD_ALREADY_POSTED with HTTP 409, and ${m_epoch2} == 1 with ${m_last2} == 2026-10-01T09:00:00Z - the metrics run re-run policy is a HARD REFUSAL and the refused call left the checkpoint untouched."
            - "${e_future} == ERR_PERIOD_ALREADY_POSTED with HTTP 409 - the same code also guards a period ahead of the logical clock, so one error id covers both directions of the metrics-period rule."
            - "Three ops runs, three different re-run policies on the same fixture: skip-if-present (allotment), always-advance (offer), refuse (metrics). Nothing in the payload distinguishes them - only the checkpoint each one keeps."

      - name: a_write_that_cascades_into_three_entities_at_once
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - endpoints.POST_/leases/{id}/terminate
          - entities.Installation.fields.occupied_unit_count
          - entities.HousingUnit.fields.status
          - entities.AllotmentTransaction.fields.type
        excluded_because:
          difficulty_instance: lease_termination_cascades_unit_release_to_installation_counters
          rationale: "The cascading_side_effects layer is not a breadth surface here - the interesting content is whether ONE write moves the lease, the unit, the installation counters and the ledger consistently, which is precisely the fan-out the cited difficulty instance walks entity by entity. A separate corner instance would repeat that fixture and its assertions with nothing added."

      - name: one_calculation_family_with_two_variants_on_the_same_row
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.gross_rent_determination
          - entities.Lease.fields.rent_basis
          - entities.Lease.fields.gross_rent_cents
        excluded_because:
          difficulty_instance: lease_gross_rent_provisional_vs_final_divergence
          rationale: "Both declared dual-variant families (gross rent and occupancy rate) are depth probes whose whole value is the DIVERGENCE between the two variants on identical inputs; the cited instance drives that divergence, and the cross-cutting layer is additionally exercised in this file by the rent-redetermination OCC instance, which flips rent_basis to MOVE_IN_FINAL and asserts the resulting rent."

      - name: a_threshold_ladder_that_arms_only_after_enough_hours_overdue
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.habitability_escalation_eligibility
          - endpoints.POST_/work-orders/{id}/escalate
          - errors.ERR_ESCALATION_NOT_DUE
        excluded_because:
          difficulty_instance: emergency_escalation_eligible_at_exact_completion_due_at
          rationale: "The threshold layer here is the overdue-hours ladder gating each escalation level, and its only non-obvious behaviour is the inclusive boundary at the exact hour - which the cited instance pins on both sides. A breadth restatement would exercise the same ladder one hour away from the boundary and prove strictly less."


  # =========================================================================
  # SECTION 10 - CONSISTENCY MODEL. §1.0 declares consistency_model: immediate.
  # One instance proves it end to end: every cascade of a write is already present
  # in that write own response body AND in an immediately following read of every
  # other entity it touched - no settling step, no reconciliation pass, and no
  # compensating transaction anywhere in the chain.
  # =========================================================================
  - section: consistency_model
    instances:

      - name: every_cascade_is_final_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/leases
          - endpoints.POST_/leases/{id}/move-in
          - state_machines.Lease
          - state_machines.WaitlistApplication
          - state_machines.HousingUnit
          - entities.Installation.fields.occupied_unit_count
          - entities.Installation.fields.assigned_unit_count
          - entities.Lease.fields.rent_basis
          - calculations.unit_inventory_conservation
        distinguishing_aspect: "Asserts the declared model in both directions on a two-write chain: the write response is compared field-for-field against an immediate re-read (no lag), and the intermediate state after POST /leases is asserted to be a fully settled PARTIAL cascade (unit still ASSIGNED) rather than a half-applied one waiting to finish."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-25T00:00:00Z."
            - "One installation (Fort Cavazos Family Housing, ARMY, TX-FTC, bill_of_rights_version 2026.1) with the Installation defaults, and one 2026 E5 with-dependents BahRate row (monthly_rate_cents 245000, utility_allowance_cents 19500)."
            - "One unit A-101, 2 bedrooms, TOWNHOME, JUNIOR_ENLISTED."
            - "One E5 sponsor with three full-time-custody dependents (spouse 1992-03-04, boys 2018-04-10 and 2022-03-15), so bedroom_eligibility is 2."
            - "The application was offered A-101 by an offer run and has ACCEPTED it, so the unit is ASSIGNED and Installation counters read available 0 / assigned 1 / occupied 0 with pending_application_count 0."
            - "No lease exists yet - the whole write chain is the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { inst_id: "$.data.id" }
            - call: "POST /bah-rates"
              payload: { installation_id: "${inst_id}", pay_grade: "E5", with_dependents: true, effective_year: 2026, monthly_rate_cents: 245000, utility_allowance_cents: 19500 }
              as: PlatformAdmin
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "A-101", bedroom_count: 2, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED", historic_flag: false }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - call: "POST /service-members"
              payload: { dodid: "1000000001", last_name: "Reyes", first_name: "Ana", branch: "ARMY", pay_grade: "E5" }
              as: PlatformAdmin
              captures: { sm1_id: "$.data.id" }
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "SPOUSE", date_of_birth: "1992-03-04", gender: "FEMALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "CHILD", date_of_birth: "2018-04-10", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "CHILD", date_of_birth: "2022-03-15", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /waitlist-applications"
              payload: { installation_id: "${inst_id}", service_member_id: "${sm1_id}", pcs_orders_date: "2026-08-25", expected_arrival_date: "2026-09-01", accessibility_required: false }
              as: ServiceMember
              as_user_id: "${sm1_id}"
              captures: { app1_id: "$.data.id" }
            - call: "POST /installations/${inst_id}/waitlist-offer-run"
              payload: {}
              as: PropertyManager
            - call: "POST /waitlist-applications/${app1_id}/accept-offer"
              payload: {}
              as: ServiceMember
              as_user_id: "${sm1_id}"
          trigger:
            - call: "POST /leases"
              payload: { application_id: "${app1_id}", housing_unit_id: "${u1_id}", start_date: "2026-09-01", term_months: 12 }
              as: PropertyManager
              captures: { l1_id: "$.data.id", w_occ: "$.data.occupancy_status", w_allot: "$.data.allotment_status", w_basis: "$.data.rent_basis", w_gross: "$.data.gross_rent_cents" }
            - call: "GET /waitlist-applications/${app1_id}"
              payload: {}
              as: PropertyManager
              captures: { a_status: "$.data.status" }
            - call: "GET /housing-units/${u1_id}"
              payload: {}
              as: PropertyManager
              captures: { u_mid: "$.data.status" }
            - call: "GET /installations/${inst_id}"
              payload: {}
              as: PlatformAdmin
              captures: { i_assigned_mid: "$.data.assigned_unit_count", i_occupied_mid: "$.data.occupied_unit_count", i_pending_mid: "$.data.pending_application_count" }
            - call: "POST /move-in-inspections"
              payload: { lease_id: "${l1_id}", scheduled_date: "2026-08-31" }
              as: PropertyManager
              captures: { insp1_id: "$.data.id" }
            - call: "POST /move-in-inspections/${insp1_id}/tenant-acknowledge"
              payload: { tenant_signature_name: "Ana Reyes", bill_of_rights_version_ack: "2026.1" }
              as: ServiceMember
              as_user_id: "${sm1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /leases/${l1_id}/move-in"
              payload: {}
              as: PropertyManager
              captures: { m_occ: "$.data.occupancy_status", m_allot: "$.data.allotment_status", m_basis: "$.data.rent_basis", m_gross: "$.data.gross_rent_cents", m_net: "$.data.net_rent_cents", m_daily: "$.data.daily_rent_cents", m_bal: "$.data.allotment_balance_cents", m_ver: "$.data.version" }
            - call: "GET /leases/${l1_id}"
              payload: {}
              as: ServiceMember
              as_user_id: "${sm1_id}"
              captures: { r_occ: "$.data.occupancy_status", r_allot: "$.data.allotment_status", r_basis: "$.data.rent_basis", r_gross: "$.data.gross_rent_cents", r_net: "$.data.net_rent_cents", r_daily: "$.data.daily_rent_cents", r_bal: "$.data.allotment_balance_cents", r_ver: "$.data.version" }
            - call: "GET /housing-units/${u1_id}"
              payload: {}
              as: MaintenanceTech
              captures: { u_end: "$.data.status" }
            - call: "GET /installations/${inst_id}"
              payload: {}
              as: PlatformAdmin
              captures: { i_available: "$.data.available_unit_count", i_assigned: "$.data.assigned_unit_count", i_occupied: "$.data.occupied_unit_count", i_total: "$.data.total_unit_count" }
            - call: "GET /waitlist-applications/${app1_id}"
              payload: {}
              as: InstallationHousingOffice
              captures: { a_status_end: "$.data.status" }
            - call: "GET /move-in-inspections/${insp1_id}"
              payload: {}
              as: PropertyManager
              captures: { insp_status: "$.data.status" }
          assert:
            - "${w_occ} == PENDING_MOVE_IN, ${w_allot} == NOT_STARTED and ${w_basis} == OFFER_PROVISIONAL in the CREATE response itself - the write returns the post-cascade row, not a pre-cascade echo of the request."
            - "${a_status} == HOUSED on the very next read - the WaitlistApplication ACCEPTED -> HOUSED cascade of POST /leases is visible immediately, with no intervening run, job or refresh call of any kind."
            - "${u_mid} == ASSIGNED and ${i_assigned_mid} == 1 with ${i_occupied_mid} == 0 and ${i_pending_mid} == 0 - immediate does not mean indiscriminate: lease creation deliberately leaves the unit ASSIGNED, and that partial state is itself fully settled and readable."
            - "${m_occ} == OCCUPIED, ${m_allot} == ACTIVE, ${m_basis} == MOVE_IN_FINAL, ${m_gross} == 237650, ${m_net} == 218150, ${m_daily} == 7172 and ${m_bal} == 0 in the MOVE-IN response body - both status dimensions, the variant flip and all three money fields are final in the same response."
            - "${r_occ} == ${m_occ}, ${r_allot} == ${m_allot}, ${r_basis} == ${m_basis}, ${r_gross} == ${m_gross}, ${r_net} == ${m_net}, ${r_daily} == ${m_daily}, ${r_bal} == ${m_bal} and ${r_ver} == ${m_ver} - the follow-up GET is field-for-field identical to the write response, so there is no read-your-writes lag and no second-phase materialisation."
            - "${u_end} == OCCUPIED and ${i_available} == 0, ${i_assigned} == 0, ${i_occupied} == 1, ${i_total} == 1 - the two-hop cascade lease -> unit -> installation counters is complete before the next request is served, and the counters still conserve the inventory (0 + 0 + 1 == 1)."
            - "${a_status_end} == HOUSED and ${insp_status} == COMPLETED - no cascade was rolled back or re-applied later; nothing in the chain is compensated, which is what distinguishes immediate from saga."
            - "At no point does any response carry a pending, syncing or in-progress marker, and no read had to be repeated to obtain a settled value."

