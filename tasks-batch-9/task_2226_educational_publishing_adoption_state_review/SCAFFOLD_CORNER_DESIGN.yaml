      - name: logical_clock_gates_both_calendar_advances
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PHASE_NOT_DUE]
          - errors[ERR_PANEL_SESSION_NOT_DUE]
          - validations[priority=48]
          - validations[priority=49]
        distinguishing_aspect: |
          Advancing a SCHEDULED cycle before submission_open_at returns ERR_PHASE_NOT_DUE (409) and
          opening a panel session before session_start_at returns ERR_PANEL_SESSION_NOT_DUE (409);
          neither call mutates its entity, so the cycle stays SCHEDULED and the panel stays
          SCHEDULED.
