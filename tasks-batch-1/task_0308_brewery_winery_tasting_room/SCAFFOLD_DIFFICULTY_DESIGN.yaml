          - state_machines.Shipment.SCHEDULED_to_RELEASED
        distinguishing_aspect: |
          Numeric threshold crossing on Shipment RELEASE: a member who has shipped
          exactly 23 cases to CA (limit 24) and now claims exactly 1 case lands on
          prior+this == 24 == limit, which PASSES (strict >, not >=); 24+anything>0
          would fail. Boundary precision on the case-equivalent metric.
