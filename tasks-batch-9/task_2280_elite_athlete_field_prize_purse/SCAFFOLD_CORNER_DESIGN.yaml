      - name: corner_validation_suspended_agent_cannot_be_offered_to
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors.ERR_AGENT_SUSPENDED
          - entities.RepAgent.fields.status
        distinguishing_aspect: >-
          Priority 12 covers agent suspension as well as athlete availability: an invitation naming a
          SUSPENDED agent must be refused at offer time with ERR_AGENT_SUSPENDED, while an otherwise
          identical invitation through an ACTIVE agent succeeds.
        test_recipe:
          setup:
            - "One FIELD_OPEN edition; one SUSPENDED agent and one ACTIVE agent; two athletes each with a VERIFIED 7900 performance and a DRAFT invitation, one per agent."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
