              captures: { cl_early: $.data.id }
            - call: "POST /mlc/claims"
              payload: { accrual_id: "${acc2}", claimant_member_id: "${m_a}", claimed_work_id: "${w0}", share_percent_claimed: 100 }
              as: MemberUser
              as_user_id: "${m_a}"
