              as_user_id: "rev-1"
              captures: { gc_v: $.data.version }
            - call: "POST /eqp/retrofit-grants/${gr_id}/reserve-funds"
              payload: { expected_grant_cycle_version: "${gc_v}" }
              as: ProgramAdmin
              as_user_id: "admin-9"
