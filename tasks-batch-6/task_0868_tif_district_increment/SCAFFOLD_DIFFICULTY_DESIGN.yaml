  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_disburse
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_OBLIGATION_NOT_REGISTERED]
        distinguishing_aspect: "Pair (state, business_fiscal): disbursing to an UNDER_REVIEW obligation for an amount that also exceeds the fund returns the state error ERR_OBLIGATION_NOT_REGISTERED, never ERR_INSUFFICIENT_FUND_BALANCE."
        test_recipe:
          setup:
            - "Certified district, fund 38,800,000; a BOND obligation only submitted (UNDER_REVIEW, not registered)."
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "PC1 TIF", municipality_name: "Iota", base_tax_year: 2025, base_eav_cents: 1000000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/increment-records"
              payload: { tax_year: 2026, current_eav_cents: 1500000000 }
              as: CountyClerk
            - call: "POST /obligations"
              payload: { district_id: "${d_id}", obligation_type: "BOND", principal_cents: 20000000, interest_rate_bps: 0, issue_tax_year: 2026, final_maturity_tax_year: 2040 }
              as: MunicipalAdmin
              captures: { ob_id: $.data.id }
            - call: "POST /obligations/${ob_id}/submit"
              payload: {}
              as: MunicipalAdmin
            - call: "GET /tif-districts/${d_id}/project-fund"
              payload: {}
              as: MunicipalAdmin
              captures: { f_ver: "$.data[0].version" }
          trigger:
            - call: "POST /obligations/${ob_id}/disbursements"
              payload: { amount_cents: 99000000000, disbursement_tax_year: 2026, expected_fund_version: "${f_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-2"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OBLIGATION_NOT_REGISTERED"
            - "response HTTP status == 409"

      - name: validation_beats_referential_on_surplus_agreement
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Pair (business_constraint, business_referential): a surplus agreement with end_tax_year <= start_tax_year AND a foreign taxing_body_id returns ERR_VALIDATION (priority 4), never ERR_TAXING_BODY_NOT_IN_DISTRICT (priority 5)."
        test_recipe:
          setup:
            - "District A certified with its own bodies; District B certified with a taxing body tb_foreign that does NOT belong to A."
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "A TIF", municipality_name: "Kappa", base_tax_year: 2025, base_eav_cents: 100000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { dA: $.data.id }
            - call: "POST /tif-districts/${dA}/taxing-bodies"
              payload: { name: "School A", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${dA}/certify"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /tif-districts"
              payload: { name: "B TIF", municipality_name: "Lambda", base_tax_year: 2025, base_eav_cents: 100000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { dB: $.data.id }
            - call: "POST /tif-districts/${dB}/taxing-bodies"
              payload: { name: "School B", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
              captures: { tb_foreign: $.data.id }
            - call: "POST /tif-districts/${dB}/certify"
              payload: {}
              as: MunicipalAdmin
          trigger:
            - call: "POST /tif-districts/${dA}/surplus-agreements"
              payload: { taxing_body_id: "${tb_foreign}", start_tax_year: 2030, end_tax_year: 2028, surplus_share_ppm_override: 500000 }
              as: MunicipalAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "response HTTP status == 422"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: increment_zero_when_current_equals_base
        grounds:
          - calculations.increment_capture
          - entities.IncrementRecord.fields.incremental_eav_cents
        distinguishing_aspect: "Metric = incremental EAV at the exact base boundary: current_eav_cents == base_eav_cents yields incremental_eav 0 and captured 0 via POST increment-records; the fund is unchanged."
        test_recipe:
          setup:
            - "Certified district with base_eav 1,000,000,000."
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Zero TIF", municipality_name: "Mu", base_tax_year: 2025, base_eav_cents: 1000000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
          trigger:
            - call: "POST /tif-districts/${d_id}/increment-records"
              payload: { tax_year: 2026, current_eav_cents: 1000000000 }
              as: CountyClerk
              captures: { ir_id: $.data.id }
          assert:
            - "IncrementRecord.${ir_id}.incremental_eav_cents == 0"
            - "IncrementRecord.${ir_id}.gross_increment_cents == 0"
            - "IncrementRecord.${ir_id}.captured_increment_cents == 0"
            - "ProjectFund(district ${d_id}).balance_cents == 0"

      - name: surplus_zero_when_balance_equals_reserve
        grounds:
          - calculations.annual_surplus_determination
          - entities.AnnualReport.fields.surplus_declared_cents
        distinguishing_aspect: "Metric = fund-balance-vs-reserve at strict equality: ending_balance 970,000 == GROSS reserve 970,000 yields surplus_declared 0 via POST accept (surplus requires strict >)."
        test_recipe:
          setup:
            - "Certified GROSS district, fund 970,000 from a 2026 increment; one SENIOR bond principal 9,700,000, 0% interest, 2026-2035 (per-year reserve 970,000)."
            - "A filed 2027 report."
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Edge TIF", municipality_name: "Nu", base_tax_year: 2025, base_eav_cents: 100000000, term_years: 23, surplus_policy: "GROSS" }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "County", body_type: "COUNTY", tax_rate: 0.02 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "City", body_type: "MUNICIPAL", tax_rate: 0.01 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
              captures: { d_ver: $.data.version }
            - call: "POST /tif-districts/${d_id}/increment-records"
              payload: { tax_year: 2026, current_eav_cents: 112500000 }
              as: CountyClerk
            - call: "POST /obligations"
              payload: { district_id: "${d_id}", obligation_type: "BOND", principal_cents: 9700000, interest_rate_bps: 0, issue_tax_year: 2026, final_maturity_tax_year: 2035 }
              as: MunicipalAdmin
              captures: { ob_id: $.data.id }
            - call: "POST /obligations/${ob_id}/submit"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /obligations/${ob_id}/register"
              payload: { priority_rank: 1, expected_district_version: "${d_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-1"
            - call: "POST /tif-districts/${d_id}/annual-reports"
              payload: { report_tax_year: 2027 }
              as: CountyClerk
              captures: { ar_id: $.data.id }
            - call: "POST /annual-reports/${ar_id}/file"
              payload: {}
              as: CountyClerk
            - call: "GET /tif-districts/${d_id}/project-fund"
              payload: {}
              as: MunicipalAdmin
              captures: { f_ver: "$.data[0].version" }
          trigger:
            - call: "POST /annual-reports/${ar_id}/accept"
              payload: { expected_fund_version: "${f_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-2"
          assert:
            - "AnnualReport.${ar_id}.ending_balance_cents == 970000"
            - "AnnualReport.${ar_id}.obligation_reserve_cents == 970000"
            - "AnnualReport.${ar_id}.surplus_declared_cents == 0"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: decertify_blocked_by_outstanding_senior_bond
        grounds:
          - state_machines.TifDistrict.CERTIFIED_to_DECERTIFIED
          - errors[ERR_SENIOR_OBLIGATION_OUTSTANDING]
          - entities.Obligation.fields.seniority
        distinguishing_aspect: "Pair (TifDistrict, Obligation): District.CERTIFIED→DECERTIFIED is blocked because a SENIOR bond is still REGISTERED with outstanding balance → ERR_SENIOR_OBLIGATION_OUTSTANDING."
        test_recipe:
          setup:
            - "Certified district; a registered SENIOR bond (principal 20,000,000) with no disbursements (outstanding 20,000,000)."
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Block TIF", municipality_name: "Xi", base_tax_year: 2025, base_eav_cents: 1000000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
              captures: { d_ver: $.data.version }
            - call: "POST /obligations"
              payload: { district_id: "${d_id}", obligation_type: "BOND", principal_cents: 20000000, interest_rate_bps: 0, issue_tax_year: 2026, final_maturity_tax_year: 2040 }
              as: MunicipalAdmin
              captures: { ob_id: $.data.id }
            - call: "POST /obligations/${ob_id}/submit"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /obligations/${ob_id}/register"
              payload: { priority_rank: 1, expected_district_version: "${d_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /tif-districts/${d_id}/decertify"
              payload: { termination_type: "EXPIRATION", termination_tax_year: 2048 }
              as: MunicipalAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SENIOR_OBLIGATION_OUTSTANDING"
            - "TifDistrict.${d_id}.status == CERTIFIED"

      - name: increment_requires_certified_district
        grounds:
          - state_machines.IncrementRecord.__create___to_CERTIFIED
          - errors[ERR_DISTRICT_NOT_CERTIFIED]
          - entities.TifDistrict.fields.status
        distinguishing_aspect: "Pair (IncrementRecord, TifDistrict): creating an IncrementRecord on a DRAFT (not-yet-certified) district → ERR_DISTRICT_NOT_CERTIFIED, a different entity pair than District↔Obligation."
        test_recipe:
          setup:
            - "District created and left in DRAFT (a taxing body added but not certified)."
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Draft TIF", municipality_name: "Omicron", base_tax_year: 2025, base_eav_cents: 1000000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
          trigger:
            - call: "POST /tif-districts/${d_id}/increment-records"
              payload: { tax_year: 2026, current_eav_cents: 1500000000 }
              as: CountyClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DISTRICT_NOT_CERTIFIED"
            - "response HTTP status == 409"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: increment_year_exact_slot_collision
        grounds:
          - state_machines.IncrementRecord.__create___to_CERTIFIED
          - errors[ERR_INCREMENT_YEAR_EXISTS]
          - entities.IncrementRecord.fields.tax_year
        distinguishing_aspect: "Interval semantics = discrete exact-year slot on the District resource: a second IncrementRecord for the same (district, tax_year 2026) collides → ERR_INCREMENT_YEAR_EXISTS, while a different year (2027) would be free."
        test_recipe:
          setup:
            - "Certified district with a 2026 increment already recorded."
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Slot TIF", municipality_name: "Pi", base_tax_year: 2025, base_eav_cents: 1000000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/increment-records"
              payload: { tax_year: 2026, current_eav_cents: 1500000000 }
              as: CountyClerk
          trigger:
            - call: "POST /tif-districts/${d_id}/increment-records"
              payload: { tax_year: 2026, current_eav_cents: 1600000000 }
              as: CountyClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INCREMENT_YEAR_EXISTS"
            - "response HTTP status == 409"

      - name: surplus_agreement_halfopen_window_overlap
        grounds:
          - state_machines.TifDistrict.CERTIFIED_to_DECERTIFIED
          - errors[ERR_AGREEMENT_PERIOD_OVERLAP]
          - entities.SurplusAgreement.fields.end_tax_year
        distinguishing_aspect: "Interval semantics = half-open [start,end) range on the TaxingBody resource: [2029,2032) overlaps existing [2027,2030) for the same body → ERR_AGREEMENT_PERIOD_OVERLAP, whereas an adjacent [2030,2033) would be allowed."
        test_recipe:
          setup:
            - "Certified district; one taxing body with a surplus agreement covering [2027,2030)."
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Agr TIF", municipality_name: "Rho", base_tax_year: 2025, base_eav_cents: 100000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
              captures: { tb_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/surplus-agreements"
              payload: { taxing_body_id: "${tb_id}", start_tax_year: 2027, end_tax_year: 2030, surplus_share_ppm_override: 400000 }
              as: MunicipalAdmin
          trigger:
            - call: "POST /tif-districts/${d_id}/surplus-agreements"
              payload: { taxing_body_id: "${tb_id}", start_tax_year: 2029, end_tax_year: 2032, surplus_share_ppm_override: 300000 }
              as: MunicipalAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_AGREEMENT_PERIOD_OVERLAP"
            - "response HTTP status == 409"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cash_conservation_on_disburse_void
        grounds:
          - state_machines.Disbursement.PAID_to_VOIDED
          - entities.ProjectFund.fields.lifetime_increment_cents
          - calculations.disbursement_allocation
        distinguishing_aspect: "Conserved quantity = fund cash: after disburse(5,000,000)+void, lifetime_increment_cents (38,800,000) == balance_cents + lifetime_disbursed_cents + lifetime_surplus_cents (38,800,000 + 0 + 0), and the obligation balance is fully restored."
        test_recipe:
          setup:
            - "Certified district, fund 38,800,000; registered SENIOR bond (principal 20,000,000 @500bps), one year interest accrued (outstanding 21,000,000); one PAID disbursement of 5,000,000 by admin-2."
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Cons TIF", municipality_name: "Sigma", base_tax_year: 2025, base_eav_cents: 1000000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "County", body_type: "COUNTY", tax_rate: 0.02 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "City", body_type: "MUNICIPAL", tax_rate: 0.01 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
              captures: { d_ver: $.data.version }
            - call: "POST /tif-districts/${d_id}/increment-records"
              payload: { tax_year: 2026, current_eav_cents: 1500000000 }
              as: CountyClerk
            - call: "POST /obligations"
              payload: { district_id: "${d_id}", obligation_type: "BOND", principal_cents: 20000000, interest_rate_bps: 500, issue_tax_year: 2026, final_maturity_tax_year: 2040 }
              as: MunicipalAdmin
              captures: { ob_id: $.data.id }
            - call: "POST /obligations/${ob_id}/submit"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /obligations/${ob_id}/register"
              payload: { priority_rank: 1, expected_district_version: "${d_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-1"
            - call: "POST /obligations/${ob_id}/accrue-interest"
              payload: { accrual_tax_year: 2026 }
              as: MunicipalAdmin
            - call: "GET /tif-districts/${d_id}/project-fund"
              payload: {}
              as: MunicipalAdmin
              captures: { f_ver: "$.data[0].version" }
            - call: "POST /obligations/${ob_id}/disbursements"
              payload: { amount_cents: 5000000, disbursement_tax_year: 2026, expected_fund_version: "${f_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-2"
              captures: { disb_id: $.data.id }
          trigger:
            - call: "POST /disbursements/${disb_id}/void"
              payload: {}
              as: MunicipalAdmin
          assert:
            - "Disbursement.${disb_id}.status == VOIDED"
            - "ProjectFund(district ${d_id}).balance_cents == 38800000"
            - "ProjectFund(district ${d_id}).lifetime_disbursed_cents == 0"
            - "ProjectFund(district ${d_id}).lifetime_increment_cents == 38800000"
            - "Obligation.${ob_id}.outstanding_balance_cents == 21000000"
            - "Obligation.${ob_id}.accrued_interest_cents == 1000000"
            - "Obligation.${ob_id}.principal_remaining_cents == 20000000"

      - name: eav_split_conservation_on_finalize_reopen
        grounds:
          - state_machines.IncrementRecord.FINALIZED_to_CERTIFIED
          - entities.IncrementRecord.fields.incremental_eav_cents
          - calculations.increment_capture
        distinguishing_aspect: "Conserved quantity = assessed-value split (not cash): across finalize+reopen the EAV identity current_eav_cents (1,500,000,000) == base_eav_cents (1,000,000,000) + incremental_eav_cents (500,000,000) is untouched, and captured returns to the provisional 38,800,000."
        test_recipe:
          setup:
            - "Certified district base 1,000,000,000; 2026 increment current 1,500,000,000 finalized at collection_rate 0.90."
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "EAV TIF", municipality_name: "Tau", base_tax_year: 2025, base_eav_cents: 1000000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
