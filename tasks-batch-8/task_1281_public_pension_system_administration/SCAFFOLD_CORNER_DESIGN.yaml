  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers is rejected 401 before any other check."
        test_recipe:
          setup: ["Fund exists"]
          setup_api_calls:
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
              captures: { fund_id: $.data.id }
          trigger:
            - call: "GET /pension-funds/${fund_id}"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED, HTTP 401"
      # NOTE: 'Anonymous' is a name-only marker for a headerless request; the
      # unit-test generator transcribes this trigger WITHOUT X-User-Role/X-User-ID.

      - name: approver_cannot_decide_disability_returns_forbidden
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
          - roles[BenefitApprover]
        distinguishing_aspect: "BenefitApprover's exclusive operations are retirement-approve and survivor-approve; disability decision is MedicalReviewer-only -> 403."
        test_recipe:
          setup: ["Fund, Employer, Member, disability application UNDER_MEDICAL_REVIEW"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundAdmin }
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "City Hall", employer_code: "CH" }
              as: FundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /members"
              payload: { employer_id: "${emp_id}", full_name: "Duty Doug", date_of_birth: "1970-01-01", hire_date: "2018-01-01" }
              as: MemberServicesAnalyst
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/disability-applications"
              payload: { disability_type: "DUTY" }
              as: MemberServicesAnalyst
              captures: { dis_id: $.data.id }
          trigger:
            - call: "POST /disability-applications/${dis_id}/decision"
              payload: { outcome: "APPROVE" }
              as: BenefitApprover
              as_user_id: "approver-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403; application stays UNDER_MEDICAL_REVIEW"

      - name: member_cannot_review_line_returns_forbidden
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - roles[Member]
        distinguishing_aspect: "Line review is MemberServicesAnalyst-exclusive; a Member (even the line's own member) gets 403."
        test_recipe:
          setup: ["Fund, Employer, Member, SUBMITTED report with one PENDING line"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundAdmin }
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "City Hall", employer_code: "CH" }
              as: FundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /members"
              payload: { employer_id: "${emp_id}", full_name: "Review Rachel", date_of_birth: "1970-01-01", hire_date: "2018-01-01" }
              as: MemberServicesAnalyst
              captures: { mem_id: $.data.id }
            - call: "POST /employers/${emp_id}/contribution-reports"
              payload: { period_start: "2023-01-01", period_end: "2024-01-01", declared_total_cents: 480000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { rep1: $.data.id }
            - call: "POST /contribution-reports/${rep1}/lines"
