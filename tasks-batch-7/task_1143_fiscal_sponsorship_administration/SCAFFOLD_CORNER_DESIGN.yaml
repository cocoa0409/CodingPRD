          setup: ["COMPREHENSIVE project ACTIVE"]
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "RB7", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 1000, contact_email: "rb7@x.org" }, as: Applicant, as_user_id: user_c_b7, captures: { app: $.data.id } }
