    code: 200
    input: [consent_received_on]
    output: SpedReferral
    side_effects: ["status → CONSENTED, evaluation_due_on := consent_received_on + 60 days"]

  - method: POST
    path: "/districts/{districtId}/schools/{schoolId}/students/{studentId}/sped-referrals/{referralId}/start-evaluation"
    description: "Begin the evaluation"
    roles: [SpEdDirector]
    code: 200
    input: []
    output: SpedReferral
    side_effects: ["status → EVAL_IN_PROGRESS"]

  - method: POST
    path: "/districts/{districtId}/schools/{schoolId}/students/{studentId}/sped-referrals/{referralId}/determine"
    description: "Determine eligibility"
    roles: [SpEdDirector]
    code: 200
    input: [outcome]
    output: SpedReferral
    side_effects:
