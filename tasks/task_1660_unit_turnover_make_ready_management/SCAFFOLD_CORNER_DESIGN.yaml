  # ------------------------------------------------------------ validations
  - section: validations
    instances:
      - name: authz_precedes_existence_unauthorized
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=4]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Role authorization (priority 2) fires before path-id existence (priority 4): a TurnCoordinator hitting the PM-only close endpoint on a NONEXISTENT turn id gets 403 ERR_UNAUTHORIZED, never 404."
        test_recipe:
          setup: ["empty DB (no turns at all)"]
          setup_api_calls: []
          trigger:
            - call: "POST /make-ready/turns/00000000-0000-0000-0000-000000000000/close"
              payload: {}
              as: TurnCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED (http 403), not ERR_NOT_FOUND"

      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
