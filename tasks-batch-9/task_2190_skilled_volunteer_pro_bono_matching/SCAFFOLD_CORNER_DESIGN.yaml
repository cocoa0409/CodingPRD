        claim_type: priority_ordering
        grounds: ["validation_priority_conflicts[confidentiality_beats_superseded_scope]", "validations[priority=34]", "validations[priority=49]"]
        distinguishing_aspect: "Locks the winner of the handoff ladder: with confidentiality_attested false the response MUST be ERR_CONFIDENTIALITY_ATTESTATION_MISSING (priority 34) and MUST NOT be the pinned-revision error ERR_SCOPE_VERSION_SUPERSEDED (priority 49) - the attestation gate is evaluated before the pinned revision is even inspected. Reachability note: on this surface a pinned APPROVED revision can only move to SUPERSEDED/WITHDRAWN through transitions that first terminate the engagement (IN_DELIVERY -> RESCOPING terminates with SCOPE_BREACH; abandon and partner suspension likewise terminate), after which priority 23 ERR_INVALID_WORK_STATE would pre-empt both checks; the co-violating half is therefore asserted negatively here rather than fabricated."
