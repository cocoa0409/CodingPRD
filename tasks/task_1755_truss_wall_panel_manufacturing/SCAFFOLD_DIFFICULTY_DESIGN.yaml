            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "TR-01", component_type: "ROOF_TRUSS", span_ft: 32.0, pitch_degrees: 26.57, design_load_psf: 42.0, lumber_grade: "SPF_MSR2400", plating: "P20", quantity_required: 10, supersedes_design_id: "${dsg1}", expected_job_version: "${job_v3}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { dsg1r2: $.data.id } }
