            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-13T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /market-loads/${load1}/deliver", payload: { live_weight_lbs_total: 28000 }, as: TransportCoordinator }
            - { call: "GET /settlements", payload: { group_id: "${group_id}" }, as: IntegratorAdmin, captures: { sett_id: "$.data[0].id" } }
            - { call: "POST /settlements/${sett_id}/approve", payload: {}, as: IntegratorAdmin, as_user_id: "adm_1" }
          trigger:
            - { call: "POST /settlements/${sett_id}/pay", payload: {}, as: IntegratorAdmin, as_user_id: "adm_1", captures: { err: $.data.error_id } }
