  - section: calculations
    instances:
      - name: ltv_bps_round_half_up_at_endorsement
        claim_type: precision
        grounds: ["calculations.ltv_bps", "entities.LoanCase.fields.ltv_bps"]
        distinguishing_aspect: "ltv_bps uses round_half_up: base 30000000 / value 31250000 x 10000 = 9600 exactly; base 30000001 / value 31250000 = 9600.0032 rounds DOWN to 9600, while a .5 fraction would round up."
        test_recipe:
          setup: ["one approved lender with a case whose base_loan_amount_cents / appraised_value_cents produces a sub-half fraction; ACCEPTED appraisal attached"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "LTV Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
