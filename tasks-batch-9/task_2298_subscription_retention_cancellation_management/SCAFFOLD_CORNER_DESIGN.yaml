      - name: targeting_inside_the_involuntary_suppression_window_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_WINBACK_SUPPRESSION_ACTIVE]
          - validations[priority=42]
          - global_constants.INVOLUNTARY_SUPPRESSION_DAYS
        distinguishing_aspect: |
          An involuntary write-off on 2026-02-07 suppresses win-back until 2026-03-09; at
          2026-03-08 the lapse bound check passes (29 days, inside [0, 120]) but the suppression
          check fires, so the answer is 422 ERR_WINBACK_SUPPRESSION_ACTIVE, one day before the same
          call would succeed.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan BOUND (not negative option); subscriber A subscribed."
            - "The 2026-02-07 renewal invoice was hard-declined with DO_NOT_HONOR, writing it off: churn INVOLUNTARY, lapsed_at 2026-02-07, winback_suppressed_until 2026-03-09."
            - "Clock advanced to 2026-03-08; a LAUNCHED campaign with bounds [0, 120] exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
