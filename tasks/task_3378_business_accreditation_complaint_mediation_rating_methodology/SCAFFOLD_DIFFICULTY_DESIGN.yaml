            - "Business B: volume_deduction == 6 (4 outcomes vs MICRO threshold 3), advertising_deduction == 5, score == 89, grade == B_PLUS"
            - "one point of score flips the grade: A at 90, B_PLUS at 89"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: mediation_offer_requires_complaint_unresolved
        grounds:
          - state_machines.Complaint.UNRESOLVED_to_MEDIATION_OFFERED
          - errors.ERR_COMPLAINT_INVALID_STATE
        distinguishing_aspect: "MediationCase creation is gated on the COMPLAINT's state (pair MediationCase->Complaint, different from the Application->AdvertisingReview pair): creating while RESPONSE_RECEIVED fails ERR_COMPLAINT_INVALID_STATE; after CONSUMER_REJECT moves it to UNRESOLVED the same call succeeds."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Bureau fee 0 over IA/NE; consumer; LARGE business founded 2018-01-01."
            - "c1 FORWARDED then answered: RESPONSE_RECEIVED."
          setup_api_calls:
            - *d_clock
            - *d_bureau
            - *d_consumer
            - *d_biz_large
            - *d_c1_file
            - *d_c1_forward
            - call: "POST /complaints/${c1_id}/responses"
              payload: { kind: "BUSINESS_RESPONSE", body: "initial offer" }
              as: BusinessRep
              as_user_id: "${biz_id}"
          trigger:
            - call: "POST /complaints/${c1_id}/mediation-cases"
              payload: {}
              as: BureauAdmin
              captures: { error_id: $.data.error_id }
            - call: "POST /complaints/${c1_id}/responses"
              payload: { kind: "CONSUMER_REJECT", body: "still unhappy" }
              as: Consumer
              as_user_id: "${consumer_id}"
            - call: "POST /complaints/${c1_id}/mediation-cases"
              payload: {}
              as: BureauAdmin
              captures: { mc_id: $.data.id, mc_status: $.data.status }
          assert:
            - "first mediation create returns 409 with error_id == ERR_COMPLAINT_INVALID_STATE (complaint RESPONSE_RECEIVED, not UNRESOLVED)"
            - "after CONSUMER_REJECT the complaint is UNRESOLVED and the second create returns 201"
            - "MediationCase.${mc_id}.status == OFFERED and offer_deadline_at == offered_at + 7 days"
            - "Complaint.${c1_id}.status == MEDIATION_OFFERED and last_unresolved_at == the rejection instant"

      - name: application_approve_blocked_until_ad_review_clears
        grounds:
          - state_machines.AccreditationApplication (SUBMITTED -> APPROVED_PENDING_DUES precondition)
          - errors.ERR_ADVERTISING_REVIEW_ADVERSE
        distinguishing_aspect: "AccreditationApplication's APPROVE transition depends on ADVERTISING-REVIEW state (pair Application->AdvertisingReview, different from MediationCase->Complaint): APPROVE while a review is UNDER_REVIEW fails ERR_ADVERTISING_REVIEW_ADVERSE; after the review concludes CLEARED the identical payload succeeds."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Bureau fee 0 over IA/NE; MEDIUM business (50 employees, founded 2020-01-01)."
            - "Application SUBMITTED; one AdvertisingReview UNDER_REVIEW against the business."
          setup_api_calls:
            - *d_clock
            - *d_bureau
            - *d_biz_medium
            - *d_app_prepaid
            - *d_app_submit
            - *d_ad_review_open
          trigger:
            - call: "POST /accreditation-applications/${app_id}/decision"
              payload: { decision: "APPROVE", advertising_practices_result: "PASS", complaint_history_result: "PASS", licensing_result: "PASS" }
              as: StandardsReviewer
              captures: { error_id: $.data.error_id }
            - *d_ad_conclude_clear
            - call: "POST /accreditation-applications/${app_id}/decision"
              payload: { decision: "APPROVE", advertising_practices_result: "PASS", complaint_history_result: "PASS", licensing_result: "PASS" }
              as: StandardsReviewer
              captures: { app_status: $.data.status, app_invoice: $.data.dues_invoice_id }
          assert:
            - "first APPROVE returns 422 with error_id == ERR_ADVERTISING_REVIEW_ADVERSE (review UNDER_REVIEW blocks)"
            - "application stays SUBMITTED after the blocked decision"
            - "after CLEARED the identical APPROVE succeeds: status == APPROVED_PENDING_DUES and dues_invoice_id is non-null"
            - "the issued DuesInvoice has amount_due_cents == 109250 (MEDIUM prepaid, fee 0)"

