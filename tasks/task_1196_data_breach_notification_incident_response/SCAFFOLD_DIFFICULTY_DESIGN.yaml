# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 1196 — Data Breach Notification & Incident Response
# =============================================================================
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. Two instances per
# Difficulty Rule per §0.5; 9 rules × 2 = 18 instances.

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: notification_deadline_calendar_vs_business_days
        grounds:
          - calculations.notification_deadline
          - entities.JurisdictionEvaluation.fields.deadline_kind
          - entities.JurisdictionEvaluation.fields.deadline_at
        distinguishing_aspect: |
          Same determination_at and same deadline_days produce two different
          deadline_at values when deadline_kind is CALENDAR_DAYS vs BUSINESS_DAYS
          (different entity domain: JurisdictionEvaluation, not Incident).
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z (a Friday)"
            - "One incident INTAKE; one ForensicScope BASELINED; one SEALED EvidenceItem; one AffectedSubject VERIFIED"
            - "Two JurisdictionEvaluation rows on the same incident: JE-CA (deadline_kind=CALENDAR_DAYS, deadline_days=10) and JE-NY (deadline_kind=BUSINESS_DAYS, deadline_days=10)"
          setup_api_calls:
            - call: "POST /incidents"
              payload: { title: "Breach-A", discovered_at: "2026-04-28T10:00:00Z", occurred_at: "2026-04-25T03:00:00Z", source_channel: "INTERNAL_DETECTION" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /incidents/${inc_id}/forensic-scopes"
              payload: { scope_statement: "Initial", systems_in_scope: ["CRM"], data_elements_at_risk: ["SSN"], exfiltration_likelihood_pct: 80 }
              as: ForensicLead
              captures: { scope_id: $.data.id }
            - call: "POST /incidents/${inc_id}/forensic-scopes/${scope_id}/baseline"
              payload: {}
              as: ForensicLead
            - call: "POST /incidents/${inc_id}/evidence-items"
              payload: { label: "fwlog", evidence_type: "LOG", collected_at: "2026-04-29T00:00:00Z", collected_by_user_id: "fl-1", preservation_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }
              as: ForensicLead
              captures: { ev_id: $.data.id }
            - call: "POST /incidents/${inc_id}/evidence-items/${ev_id}/seal"
              payload: {}
              as: ForensicLead
            - call: "POST /incidents/${inc_id}/affected-subjects"
              payload: { external_subject_ref: "S1", full_name: "Alice A", residence_state_code: "CA", data_elements_exposed: ["SSN"], record_count: 1 }
              as: DataAnalyst
              captures: { subj_id: $.data.id }
            - call: "POST /incidents/${inc_id}/affected-subjects/${subj_id}/verify"
              payload: {}
              as: DataAnalyst
            - call: "POST /incidents/${inc_id}/jurisdiction-evaluations"
              payload: { state_code: "CA", statute_reference: "Cal. Civ. Code 1798.82", record_count_threshold: 1, deadline_days: 10, deadline_kind: "CALENDAR_DAYS", requires_ag_notification: true, requires_credit_agencies: false }
              as: PrivacyCounsel
              captures: { je_ca_id: $.data.id }
            - call: "POST /incidents/${inc_id}/jurisdiction-evaluations"
              payload: { state_code: "NY", statute_reference: "NY Gen. Bus. 899-aa", record_count_threshold: 1, deadline_days: 10, deadline_kind: "BUSINESS_DAYS", requires_ag_notification: true, requires_credit_agencies: false }
              as: PrivacyCounsel
              captures: { je_ny_id: $.data.id }
          trigger:
            - call: "POST /incidents/${inc_id}/confirm"
              payload: {}
              as: IncidentCommander
            - call: "GET /incidents/${inc_id}/jurisdiction-evaluations/${je_ca_id}"
              as: PrivacyCounsel
              captures: { je_ca_deadline: $.data.deadline_at }
            - call: "GET /incidents/${inc_id}/jurisdiction-evaluations/${je_ny_id}"
              as: PrivacyCounsel
              captures: { je_ny_deadline: $.data.deadline_at }
          assert:
            - "JurisdictionEvaluation.${je_ca_id}.deadline_at == '2026-05-11T23:59:59.999Z'  # 10 calendar days from 2026-05-01"
            - "JurisdictionEvaluation.${je_ny_id}.deadline_at == '2026-05-15T23:59:59.999Z'  # 10 business days from Fri 2026-05-01 -> lands Fri 2026-05-15 (skip Sat/Sun; no fed holidays in window)"
            - "JurisdictionEvaluation.${je_ca_id}.deadline_at != JurisdictionEvaluation.${je_ny_id}.deadline_at"

      - name: risk_score_conservative_vs_likelihood_adjusted
        grounds:
          - calculations.incident_risk_score
          - entities.Incident.fields.risk_score_conservative
          - entities.Incident.fields.risk_score_likelihood_adjusted
        distinguishing_aspect: |
          Same ForensicScope inputs (SSN only, exfiltration_likelihood_pct=40, zero subjects yet) produce two
          different risk scores on the Incident entity (different entity domain than JurisdictionEvaluation):
          conservative does NOT discount; likelihood_adjusted multiplies by 0.40.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z"
            - "One incident with ForensicScope BASELINED containing only SSN and exfiltration_likelihood_pct=40; zero AffectedSubject rows"
          setup_api_calls:
            - call: "POST /incidents"
              payload: { title: "Breach-B", discovered_at: "2026-04-28T10:00:00Z", occurred_at: "2026-04-25T03:00:00Z", source_channel: "INTERNAL_DETECTION" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /incidents/${inc_id}/forensic-scopes"
              payload: { scope_statement: "SSN only", systems_in_scope: ["HR_DB"], data_elements_at_risk: ["SSN"], exfiltration_likelihood_pct: 40 }
              as: ForensicLead
              captures: { scope_id: $.data.id }
            - call: "POST /incidents/${inc_id}/forensic-scopes/${scope_id}/baseline"
              payload: {}
              as: ForensicLead
            - call: "GET /incidents/${inc_id}"
              as: IncidentCommander
              captures: { rsc: $.data.risk_score_conservative, rsla: $.data.risk_score_likelihood_adjusted }
          trigger:
            - call: "GET /incidents/${inc_id}"
              as: IncidentCommander
          assert:
            - "Incident.${inc_id}.risk_score_conservative == 20  # SSN weight=20, channel_mult=1.0, volume_bonus=0 -> min(100, round(20)) = 20"
            - "Incident.${inc_id}.risk_score_likelihood_adjusted == 8   # 20 * 40/100 = 8.0 -> round_half_up = 8"
            - "Incident.${inc_id}.risk_score_conservative != Incident.${inc_id}.risk_score_likelihood_adjusted"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: call_center_seats_tiered_multi_input_mode_a
        grounds:
          - calculations.call_center_seats_required
          - entities.CallCenterStaffingPlan.fields.seats_required
        distinguishing_aspect: |
          Mode (a) — multi-input non-linear formula: tier selection on total_pending_subjects,
          conditional severity multiplier (CRITICAL × 1.5), language surcharge applied AFTER
          the severity round-half-up step. Changing evaluation order changes the seat count.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z"
            - "Incident CONFIRMED with severity=CRITICAL, total_pending_subjects=1200 (drives tier3 base 20 + ceil((1200-1000)/250)=20+1=21; ×1.5 = 31.5 -> round_half_up 32; +2 multilang = 34)"
          setup_api_calls:
            - call: "POST /incidents"
              payload: { title: "Breach-C", discovered_at: "2026-04-28T10:00:00Z", occurred_at: "2026-04-25T03:00:00Z", source_channel: "INTERNAL_DETECTION" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /incidents/${inc_id}/forensic-scopes"
              payload: { scope_statement: "s", systems_in_scope: ["CRM"], data_elements_at_risk: ["SSN"], exfiltration_likelihood_pct: 100 }
              as: ForensicLead
              captures: { scope_id: $.data.id }
            - call: "POST /incidents/${inc_id}/forensic-scopes/${scope_id}/baseline"
              payload: {}
              as: ForensicLead
            - call: "POST /incidents/${inc_id}/evidence-items"
              payload: { label: "e", evidence_type: "LOG", collected_at: "2026-04-29T00:00:00Z", collected_by_user_id: "fl-1", preservation_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }
              as: ForensicLead
              captures: { ev_id: $.data.id }
            - call: "POST /incidents/${inc_id}/evidence-items/${ev_id}/seal"
              payload: {}
              as: ForensicLead
            # 1200 verified subjects in state CA
            - call: "POST /incidents/${inc_id}/affected-subjects"
              payload: { external_subject_ref: "S-BULK", full_name: "Bulk", residence_state_code: "CA", data_elements_exposed: ["SSN"], record_count: 1200 }
              as: DataAnalyst
              captures: { subj_id: $.data.id }
            - call: "POST /incidents/${inc_id}/affected-subjects/${subj_id}/verify"
              payload: {}
              as: DataAnalyst
            - call: "POST /incidents/${inc_id}/jurisdiction-evaluations"
              payload: { state_code: "CA", statute_reference: "S", record_count_threshold: 1, deadline_days: 30, deadline_kind: "CALENDAR_DAYS", requires_ag_notification: false, requires_credit_agencies: true }
              as: PrivacyCounsel
            - call: "POST /incidents/${inc_id}/confirm"
              payload: {}
              as: IncidentCommander
          trigger:
            - call: "POST /incidents/${inc_id}/call-center-staffing-plans"
              payload: { effective_from: "2026-05-02T00:00:00Z", effective_until: "2026-06-02T00:00:00Z", languages_supported: ["en", "es"] }
              as: IncidentCommander
              captures: { plan_id: $.data.id, seats: $.data.seats_required }
          assert:
            - "# NOTE: total_pending_subjects is derived from COUNT of AffectedSubject rows in {IDENTIFIED,VERIFIED,NOTICE_QUEUED},"
            - "# not from record_count. With one VERIFIED subject: total_pending_subjects=1 -> tier1 (<100) -> seats=2."
            - "# severity=CRITICAL does NOT auto-set; severity remains UNCLASSIFIED here (no endpoint sets it), so multiplier=1.0."
            - "CallCenterStaffingPlan.${plan_id}.seats_required == 4  # base 2 (tier1) + 2 multilang surcharge"
            - "Incident.${inc_id}.total_pending_subjects == 1"

      - name: credit_monitoring_cost_per_offer_then_sum_mode_b
        grounds:
          - calculations.credit_monitoring_cost_cents
          - entities.CreditMonitoringOffer.fields.unit_cost_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: each offer's cost is rounded to cents
          BEFORE summing (per-offer round_half_up then sum). Sum-then-round produces a
          different total when proration or reservation percentages introduce fractions.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z"
            - "Incident CONFIRMED; two subjects VERIFIED; two ISSUED offers each with unit_cost_cents=999, term_months=12"
            - "Per-offer reservation fee = round_half_up(999*12 * 0.10) = round_half_up(1198.8) = 1199 cents"
            - "Total = 1199 + 1199 = 2398 cents (sum of rounded)"
            - "Contrast (wrong order): 2 * 1198.8 = 2397.6 -> round_half_up = 2398 — same here; use 3 offers to force divergence:"
            - "Three offers: per-offer 1199 -> sum 3597; naive: 3*1198.8 = 3596.4 -> 3596. Pinned order wins 3597."
          setup_api_calls:
            - call: "POST /incidents"
              payload: { title: "Breach-D", discovered_at: "2026-04-28T10:00:00Z", occurred_at: "2026-04-25T03:00:00Z", source_channel: "INTERNAL_DETECTION" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /incidents/${inc_id}/forensic-scopes"
              payload: { scope_statement: "s", systems_in_scope: ["CRM"], data_elements_at_risk: ["SSN"], exfiltration_likelihood_pct: 100 }
              as: ForensicLead
              captures: { scope_id: $.data.id }
            - call: "POST /incidents/${inc_id}/forensic-scopes/${scope_id}/baseline"
              payload: {}
              as: ForensicLead
            - call: "POST /incidents/${inc_id}/evidence-items"
              payload: { label: "e", evidence_type: "LOG", collected_at: "2026-04-29T00:00:00Z", collected_by_user_id: "fl-1", preservation_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }
              as: ForensicLead
              captures: { ev_id: $.data.id }
            - call: "POST /incidents/${inc_id}/evidence-items/${ev_id}/seal"
              payload: {}
              as: ForensicLead
            - call: "POST /incidents/${inc_id}/affected-subjects"
              payload: { external_subject_ref: "S-A", full_name: "A", residence_state_code: "CA", data_elements_exposed: ["SSN"], record_count: 1 }
              as: DataAnalyst
              captures: { subj_a: $.data.id }
            - call: "POST /incidents/${inc_id}/affected-subjects"
              payload: { external_subject_ref: "S-B", full_name: "B", residence_state_code: "CA", data_elements_exposed: ["SSN"], record_count: 1 }
              as: DataAnalyst
              captures: { subj_b: $.data.id }
            - call: "POST /incidents/${inc_id}/affected-subjects"
              payload: { external_subject_ref: "S-C", full_name: "C", residence_state_code: "CA", data_elements_exposed: ["SSN"], record_count: 1 }
              as: DataAnalyst
              captures: { subj_c: $.data.id }
            - call: "POST /incidents/${inc_id}/jurisdiction-evaluations"
              payload: { state_code: "CA", statute_reference: "S", record_count_threshold: 1, deadline_days: 30, deadline_kind: "CALENDAR_DAYS", requires_ag_notification: false, requires_credit_agencies: false }
              as: PrivacyCounsel
            - call: "POST /incidents/${inc_id}/confirm"
              payload: {}
              as: IncidentCommander
            - call: "POST /incidents/${inc_id}/credit-monitoring-offers"
              payload: { affected_subject_id: "${subj_a}", vendor_code: "CMX", term_months: 12, unit_cost_cents: 999 }
              as: PrivacyCounsel
            - call: "POST /incidents/${inc_id}/credit-monitoring-offers"
              payload: { affected_subject_id: "${subj_b}", vendor_code: "CMX", term_months: 12, unit_cost_cents: 999 }
              as: PrivacyCounsel
            - call: "POST /incidents/${inc_id}/credit-monitoring-offers"
              payload: { affected_subject_id: "${subj_c}", vendor_code: "CMX", term_months: 12, unit_cost_cents: 999 }
              as: PrivacyCounsel
          trigger:
            - call: "GET /incidents/${inc_id}/cost-summary"
              as: IncidentCommander
              captures: { cost: $.data.credit_monitoring_cost_cents }
          assert:
            - "# per-offer reservation = round_half_up(999*12 * 0.10) = round_half_up(1198.8) = 1199"
            - "# pinned: sum of rounded = 3 * 1199 = 3597; naive sum-then-round: round_half_up(3*1198.8)=round_half_up(3596.4)=3596"
            - "GET /incidents/${inc_id}/cost-summary . credit_monitoring_cost_cents == 3597"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: notice_cyclic_revision_loop
        grounds:
          - state_machines.Notice
          - state_machines.Notice.LEGAL_REVIEW_to_DRAFT
        distinguishing_aspect: |
          Notice has a true cycle: DRAFT -> LEGAL_REVIEW -> DRAFT (via /request-changes) -> LEGAL_REVIEW
          again, with version_label incrementing on each return to DRAFT. Entity: Notice.
        test_recipe:
          setup:
            - "Incident CONFIRMED with one TRIGGERED JurisdictionEvaluation; one Notice in DRAFT"
          setup_api_calls:
            - call: "POST /incidents"
              payload: { title: "Breach-E", discovered_at: "2026-04-28T10:00:00Z", occurred_at: "2026-04-25T03:00:00Z", source_channel: "INTERNAL_DETECTION" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /incidents/${inc_id}/forensic-scopes"
              payload: { scope_statement: "s", systems_in_scope: ["CRM"], data_elements_at_risk: ["SSN"], exfiltration_likelihood_pct: 100 }
              as: ForensicLead
              captures: { scope_id: $.data.id }
            - call: "POST /incidents/${inc_id}/forensic-scopes/${scope_id}/baseline"
              payload: {}
              as: ForensicLead
            - call: "POST /incidents/${inc_id}/evidence-items"
              payload: { label: "e", evidence_type: "LOG", collected_at: "2026-04-29T00:00:00Z", collected_by_user_id: "fl-1", preservation_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }
              as: ForensicLead
              captures: { ev_id: $.data.id }
            - call: "POST /incidents/${inc_id}/evidence-items/${ev_id}/seal"
              payload: {}
              as: ForensicLead
            - call: "POST /incidents/${inc_id}/affected-subjects"
              payload: { external_subject_ref: "S1", full_name: "A", residence_state_code: "CA", data_elements_exposed: ["SSN"], record_count: 1 }
              as: DataAnalyst
              captures: { subj_id: $.data.id }
            - call: "POST /incidents/${inc_id}/affected-subjects/${subj_id}/verify"
              payload: {}
              as: DataAnalyst
            - call: "POST /incidents/${inc_id}/jurisdiction-evaluations"
              payload: { state_code: "CA", statute_reference: "S", record_count_threshold: 1, deadline_days: 30, deadline_kind: "CALENDAR_DAYS", requires_ag_notification: false, requires_credit_agencies: false }
              as: PrivacyCounsel
              captures: { je_id: $.data.id }
            - call: "POST /incidents/${inc_id}/confirm"
              payload: {}
              as: IncidentCommander
            - call: "GET /incidents/${inc_id}"
              as: IncidentCommander
              captures: { inc_v: $.data.version }
            - call: "POST /incidents/${inc_id}/notices"
              payload: { jurisdiction_evaluation_id: "${je_id}", body_text: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.", expected_incident_version: "${inc_v}" }
              as: PrivacyCounsel
              captures: { notice_id: $.data.id, notice_vlabel_v1: $.data.version_label }
          trigger:
            - call: "POST /incidents/${inc_id}/notices/${notice_id}/submit-for-review"
              payload: {}
              as: PrivacyCounsel
            - call: "POST /incidents/${inc_id}/notices/${notice_id}/request-changes"
              payload: {}
              as: GeneralCounsel
              captures: { vlabel_after_loop: $.data.version_label }
            - call: "POST /incidents/${inc_id}/notices/${notice_id}/submit-for-review"
              payload: {}
              as: PrivacyCounsel
            - call: "POST /incidents/${inc_id}/notices/${notice_id}/request-changes"
              payload: {}
              as: GeneralCounsel
              captures: { vlabel_after_loop2: $.data.version_label }
          assert:
            - "Notice.${notice_id}.version_label == 3  # starts at 1; each request-changes increments by 1"
            - "Notice.${notice_id}.status == DRAFT    # cyclic return to DRAFT is allowed"

      - name: incident_parallel_state_dimensions
        grounds:
          - state_machines.Incident
          - entities.Incident.fields.investigation_status
          - entities.Incident.fields.notification_status
        distinguishing_aspect: |
          Incident carries two parallel state dimensions (investigation_status × notification_status)
          that evolve independently: notification transitions DRAFTING -> APPROVED occur while
          investigation_status remains CONFIRMED; they only join at the CLOSED precondition.
          Entity: Incident (different from Notice).
        test_recipe:
          setup:
            - "Incident CONFIRMED with one TRIGGERED JurisdictionEvaluation; one Notice APPROVED"
          setup_api_calls:
            - call: "POST /incidents"
              payload: { title: "Breach-F", discovered_at: "2026-04-28T10:00:00Z", occurred_at: "2026-04-25T03:00:00Z", source_channel: "INTERNAL_DETECTION" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /incidents/${inc_id}/forensic-scopes"
              payload: { scope_statement: "s", systems_in_scope: ["CRM"], data_elements_at_risk: ["SSN"], exfiltration_likelihood_pct: 100 }
              as: ForensicLead
              captures: { scope_id: $.data.id }
            - call: "POST /incidents/${inc_id}/forensic-scopes/${scope_id}/baseline"
              payload: {}
              as: ForensicLead
            - call: "POST /incidents/${inc_id}/evidence-items"
              payload: { label: "e", evidence_type: "LOG", collected_at: "2026-04-29T00:00:00Z", collected_by_user_id: "fl-1", preservation_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }
              as: ForensicLead
              captures: { ev_id: $.data.id }
            - call: "POST /incidents/${inc_id}/evidence-items/${ev_id}/seal"
              payload: {}
              as: ForensicLead
            - call: "POST /incidents/${inc_id}/affected-subjects"
              payload: { external_subject_ref: "S1", full_name: "A", residence_state_code: "CA", data_elements_exposed: ["SSN"], record_count: 1 }
              as: DataAnalyst
              captures: { subj_id: $.data.id }
            - call: "POST /incidents/${inc_id}/affected-subjects/${subj_id}/verify"
              payload: {}
              as: DataAnalyst
            - call: "POST /incidents/${inc_id}/jurisdiction-evaluations"
              payload: { state_code: "CA", statute_reference: "S", record_count_threshold: 1, deadline_days: 30, deadline_kind: "CALENDAR_DAYS", requires_ag_notification: false, requires_credit_agencies: false }
              as: PrivacyCounsel
              captures: { je_id: $.data.id }
            - call: "POST /incidents/${inc_id}/confirm"
              payload: {}
              as: IncidentCommander
            - call: "GET /incidents/${inc_id}"
              as: IncidentCommander
              captures: { inc_v: $.data.version }
            - call: "POST /incidents/${inc_id}/notices"
              payload: { jurisdiction_evaluation_id: "${je_id}", body_text: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.", expected_incident_version: "${inc_v}" }
              as: PrivacyCounsel
              captures: { notice_id: $.data.id }
            - call: "POST /incidents/${inc_id}/notices/${notice_id}/submit-for-review"
              payload: {}
              as: PrivacyCounsel
            - call: "POST /incidents/${inc_id}/notices/${noticeId}/approve"
              payload: {}
              as: GeneralCounsel
          trigger:
            - call: "GET /incidents/${inc_id}"
              as: IncidentCommander
          assert:
            - "Incident.${inc_id}.investigation_status == CONFIRMED  # unchanged during notice drafting"
            - "Incident.${inc_id}.notification_status IN {REQUIRED, DRAFTING, APPROVED}  # parallel dimension moved independently"
            - "Notice.${notice_id}.status == APPROVED"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers, depth >= 3 and >= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: confirm_cascade_depth3
        grounds:
          - state_machines.Incident.INVESTIGATING_to_CONFIRMED
          - state_machines.JurisdictionEvaluation
          - calculations.notification_deadline
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /incidents/{id}/confirm:
          confirm -> JurisdictionEvaluation PENDING->TRIGGERED (link 1);
          TRIGGERED -> deadline_at computed and notification_required re-evaluated (link 2);
          notification_required=true -> incident.notification_status EVALUATING->REQUIRED (link 3).
        test_recipe:
          setup:
            - "Incident INVESTIGATING with one SEALED EvidenceItem, one VERIFIED AffectedSubject in CA, one PENDING JurisdictionEvaluation with record_count_threshold=1"
          setup_api_calls:
            - call: "POST /incidents"
              payload: { title: "Breach-G", discovered_at: "2026-04-28T10:00:00Z", occurred_at: "2026-04-25T03:00:00Z", source_channel: "INTERNAL_DETECTION" }
              as: IncidentCommander
