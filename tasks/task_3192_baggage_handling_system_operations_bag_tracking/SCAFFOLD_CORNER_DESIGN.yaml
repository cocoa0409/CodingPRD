# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3192_baggage_handling_system_operations_bag_tracking
#
# Breadth probe: every claim the §1.1-§1.7 surface declares that §1.8 does not
# already exercise. Sections and claim_type values follow
# references/claim-extraction-guide.md verbatim; no new categories.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: airline_create_returns_declared_fields_immutable
        claim_type: Creation
        grounds:
          - entities.Airline
          - endpoints.POST_/baggage/airlines
        distinguishing_aspect: "An airline created with only its declared fields comes back 201 with a non-null id, version 1 and the supplied interline flag, and there is no PUT endpoint that can mutate it afterwards."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /baggage/airlines"
              payload: { code: "DL", name: "Delta Air Lines", interline_agreement_active: true, max_excess_weight_lb: 50, excess_weight_fee_cents: 7500, compensation_cap_cents: 300000 }
              as: PlatformAdmin
              captures: { al: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Airline.${al}.code == \"DL\" and max_excess_weight_lb == 50"
            - "Airline.${al}.version == 1 and id, created_at and updated_at are all non-null"
            - "Airline.${al}.excess_weight_fee_cents == 7500 and compensation_cap_cents == 300000"
            - "re-POSTing the same code returns 409 ERR_DUPLICATE_AIRLINE"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: station_get_round_trips_every_configuration_field
        claim_type: Retrieval
        grounds:
          - entities.Station
          - endpoints.GET_/baggage/stations/{id}
        distinguishing_aspect: "Every Station configuration field survives a GET unchanged, including the computed posture OPEN, the false outage flag and the zeroed counters, and outage_started_utc is null."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; no station yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "SEA", name: "Seattle-Tacoma", sorter_capacity_bags: 60 }
              as: PlatformAdmin
              captures: { st: $.data.id }
          trigger:
            - call: "GET /baggage/stations/${st}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the response status is 200 and response_type is object"
            - "Station.${st}.code == \"SEA\" and sorter_capacity_bags == 60"
            - "Station.${st}.posture == OPEN and outage_active == false"
            - "Station.${st}.outage_started_utc is null"
            - "Station.${st}.active_bag_count == 0, manual_queue_depth == 0 and open_liability_cents == 0"
            - "Station.${st}.ops_run_index == 0"

      - name: bags_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/baggage/bags
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three bags on file, limit=2&offset=0 returns two rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false — total_count counts the filtered set, not the page."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; one station SEA, one airline DL, one flight DL1423, and three bags B1..B3 accepted onto it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "SEA", name: "Seattle-Tacoma", sorter_capacity_bags: 60 }
              as: PlatformAdmin
              captures: { st: $.data.id }
            - call: "POST /baggage/airlines"
              payload: { code: "DL", name: "Delta Air Lines", interline_agreement_active: true, max_excess_weight_lb: 50, excess_weight_fee_cents: 7500, compensation_cap_cents: 300000 }
              as: PlatformAdmin
              captures: { al: $.data.id }
            - call: "POST /baggage/flights"
              payload: { station_id: "${st}", airline_id: "${al}", flight_number: "DL1423", bank_code: "B1", scheduled_departure_utc: "2026-09-01T15:00:00Z" }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", flight_id: "${f1}", passenger_name: "Adeyemi, Tunde", passenger_ref: "PNR9K3L", itinerary_type: "DOMESTIC", weight_lb: 48, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", flight_id: "${f1}", passenger_name: "Reyes, Ana", passenger_ref: "PNR7X2Q", itinerary_type: "DOMESTIC", weight_lb: 48, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", flight_id: "${f1}", passenger_name: "Okafor, Ben", passenger_ref: "PNR4M1T", itinerary_type: "INTERNATIONAL", weight_lb: 48, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
          trigger:
            - call: "GET /baggage/bags"
              payload: { flight_id: "${f1}", limit: 2, offset: 0 }
              as: AcceptanceAgent
          assert:
            - "the response status is 200 and response_type is array"
            - "the page carries exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /baggage/bags?flight_id=${f1}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /baggage/bags?flight_id=${f1}&itinerary_type=INTERNATIONAL returns exactly 1 row, the Okafor bag"
            - "GET /baggage/bags?flight_id=${f1} with no paging parameters defaults limit to 10 and offset to 0"
            - "a limit of 101 is rejected with 400 ERR_INVALID_REQUEST because the declared maximum is 100"

      - name: station_get_with_an_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/baggage/stations/{id}
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A syntactically well-formed but unallocated id on a path segment produces a 404 rather than a 400 or a 500, and the error envelope carries exactly error_id and message."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; no station has been created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /baggage/stations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "the response status is 404 and response_type is error"
            - "the error envelope carries exactly the keys error_id and message, and error_id is non-empty"
            - "the message is a non-empty string"
            - "a malformed path id that is not a UUID returns 400 ERR_INVALID_REQUEST rather than 404"
            - "no Station row is created as a side effect of the failed lookup"

      - name: bag_create_requires_passenger_name_and_weight
        claim_type: Required Fields
        grounds:
          - entities.Bag.fields.passenger_name
          - entities.Bag.fields.weight_lb
          - endpoints.POST_/baggage/bags
        distinguishing_aspect: "Omitting a required input field is rejected with 400 ERR_INVALID_REQUEST before any existence or state check runs, and the tag number is never minted."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA and airline DL exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "SEA", name: "Seattle-Tacoma", sorter_capacity_bags: 60 }
              as: PlatformAdmin
              captures: { st: $.data.id }
          trigger:
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", itinerary_type: "DOMESTIC", weight_lb: 48, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id is ERR_INVALID_REQUEST"
            - "the message names passenger_name as the missing field"
            - "GET /baggage/bags?station_id=${st} still returns 0 rows, so no partial bag was persisted"
            - "a second call omitting weight_lb instead also returns 400 ERR_INVALID_REQUEST"
            - "the station's active_bag_count is still 0 after both rejections"

      - name: bag_envelope_and_itinerary_enum_are_constrained
        claim_type: Type Constraints
        grounds:
          - entities.Bag.fields.itinerary_type
          - entities.Bag.fields.linear_in
          - errors[ERR_INVALID_ENUM_VALUE]
        distinguishing_aspect: "An out-of-set itinerary_type is rejected with 400 ERR_INVALID_ENUM_VALUE while a size beyond the declared belt envelope is rejected with 422 ERR_BAG_OVERSIZE, so the two constraint classes carry different codes."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "SEA", name: "Seattle-Tacoma", sorter_capacity_bags: 60 }
              as: PlatformAdmin
              captures: { st: $.data.id }
          trigger:
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", passenger_name: "Reyes, Ana", passenger_ref: "PNR7X2Q", itinerary_type: "CODESHARE", weight_lb: 48, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id is ERR_INVALID_ENUM_VALUE"
            - "the message lists the four permitted values DOMESTIC, INTERNATIONAL, INTERLINE"
            - "a bag posted instead with 50x40x40 dimensions is accepted at 201 and its linear_in == 130"
            - "a bag posted instead with 41x40x50 dimensions is rejected with 422 ERR_BAG_OVERSIZE, because 131 exceeds the 130-inch envelope"
            - "no bag row was created for the CODESHARE rejection"

      - name: bag_tag_number_is_server_minted_and_ignored_from_input
        claim_type: System Fields
        grounds:
          - entities.Bag.fields.tag_number
          - endpoints.POST_/baggage/bags
        distinguishing_aspect: "The tag number is never client-supplied — the response carries a ten-digit server-minted value, and id/created_at/updated_at are all server-generated on the same response."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "SEA", name: "Seattle-Tacoma", sorter_capacity_bags: 60 }
              as: PlatformAdmin
              captures: { st: $.data.id }
          trigger:
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", passenger_name: "Reyes, Ana", passenger_ref: "PNR7X2Q", itinerary_type: "DOMESTIC", weight_lb: 48, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { b: $.data.id, tag: $.data.tag_number }
          assert:
            - "the response status is 201 and Bag.${b}.tag_number matches ^[0-9]{10}$"
            - "GET /baggage/bags/${b} returns the same tag_number ${tag}"
            - "GET /baggage/tracking/${tag} resolves to the same bag"
            - "Bag.${b}.version == 1 and id, created_at and updated_at are non-null"
            - "a second bag accepted for a different passenger_ref carries a different tag_number"

      - name: delivery_create_is_server_synthesized_on_offload
        claim_type: Defaults
        grounds:
          - entities.Delivery
          - entities.Delivery.fields.method
          - state_machines.Bag.LOADED_to_OFFLOADED
        distinguishing_aspect: "A bag that has never had a delivery arranged gains a Delivery row with the declared default method PASSENGER_PICKUP and status PENDING the moment it is offloaded, so the default is applied rather than left null."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA with make-up area MA-3 and lane EDS-2; airline DL; flight DL1423 departs 15:00"
            - "bag B1 48 lb DOMESTIC loaded at clock 13:50 and the flight departed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "SEA", name: "Seattle-Tacoma", sorter_capacity_bags: 60 }
              as: PlatformAdmin
              captures: { st: $.data.id }
            - call: "POST /baggage/airlines"
              payload: { code: "DL", name: "Delta Air Lines", interline_agreement_active: true, max_excess_weight_lb: 50, excess_weight_fee_cents: 7500, compensation_cap_cents: 300000 }
              as: PlatformAdmin
              captures: { al: $.data.id }
            - call: "POST /baggage/makeup-areas"
              payload: { station_id: "${st}", code: "MA-3", capacity_slots: 2, buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { ma: $.data.id }
            - call: "POST /baggage/screening-lanes"
              payload: { station_id: "${st}", lane_code: "EDS-2" }
              as: PlatformAdmin
              captures: { lane: $.data.id }
            - call: "POST /baggage/flights"
              payload: { station_id: "${st}", airline_id: "${al}", flight_number: "DL1423", bank_code: "B1", scheduled_departure_utc: "2026-09-01T15:00:00Z" }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", flight_id: "${f1}", passenger_name: "Reyes, Ana", passenger_ref: "PNR7X2Q", itinerary_type: "DOMESTIC", weight_lb: 48, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { bag: $.data.id }
            - call: "POST /baggage/bags/${bag}/weigh"
              payload: { scale_weight_lb: 48.0 }
              as: AcceptanceAgent
              captures: { bag_v: $.data.version }
            - call: "POST /baggage/screenings"
              payload: { bag_id: "${bag}", lane_id: "${lane}", start_utc: "2026-09-01T09:00:00Z" }
              as: Screener
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T13:40:00Z" }
              as: PlatformAdmin
            - call: "GET /baggage/bags/${bag}"
              payload: {}
              as: AcceptanceAgent
              captures: { bag_v_f: $.data.version }
            - call: "POST /baggage/bags/${bag}/assign-makeup"
              payload: { expected_bag_version: "${bag_v_f}", makeup_area_id: "${ma}", induction_utc: "2026-09-01T13:40:00Z", makeup_interval_minutes: 120 }
              as: SortationAgent
            - call: "POST /baggage/bags/${bag}/load"
              payload: {}
              as: LoadAgent
            - call: "GET /baggage/bags/${bag}/deliveries"
              payload: {}
              as: BaggageServiceAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T14:05:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations/${st}/run_ops"
              payload: {}
              as: PlatformAdmin
            - call: "POST /baggage/flights/${f1}/depart"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /baggage/bags/${bag}/offload"
              payload: {}
              as: LoadAgent
          assert:
            - "the response returns 200 and Bag.${bag}.custody_status == OFFLOADED"
            - "GET /baggage/bags/${bag}/deliveries returns exactly 1 row"
            - "Delivery.method == PASSENGER_PICKUP and Delivery.status == PENDING"
            - "Delivery.proof_required == false and Delivery.delivered_utc is null"
            - "Delivery.scheduled_utc is null and mishandled_report_id is null"
            - "the pre-offload read GET /baggage/bags/${bag}/deliveries returned 0 rows, so the row was synthesized by the offload itself"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: bag_weigh_from_sorted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Bag.ACCEPTED_to_SCREENING
          - state_machines.Bag.HELD_to_ACCEPTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A second weigh is legal only from ACCEPTED or HELD; a weigh against a bag already in SORTED is refused with ERR_INVALID_STATE and mints no new scan."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA with lane EDS-2; airline DL; flight DL1423 departs 15:00; bag B1 48 lb DOMESTIC"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "SEA", name: "Seattle-Tacoma", sorter_capacity_bags: 60 }
              as: PlatformAdmin
              captures: { st: $.data.id }
            - call: "POST /baggage/airlines"
              payload: { code: "DL", name: "Delta Air Lines", interline_agreement_active: true, max_excess_weight_lb: 50, excess_weight_fee_cents: 7500, compensation_cap_cents: 300000 }
              as: PlatformAdmin
              captures: { al: $.data.id }
            - call: "POST /baggage/screening-lanes"
              payload: { station_id: "${st}", lane_code: "EDS-2" }
              as: PlatformAdmin
              captures: { lane: $.data.id }
            - call: "POST /baggage/flights"
              payload: { station_id: "${st}", airline_id: "${al}", flight_number: "DL1423", bank_code: "B1", scheduled_departure_utc: "2026-09-01T15:00:00Z" }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", flight_id: "${f1}", passenger_name: "Reyes, Ana", passenger_ref: "PNR7X2Q", itinerary_type: "DOMESTIC", weight_lb: 48, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { bag: $.data.id }
            - call: "POST /baggage/bags/${bag}/weigh"
              payload: { scale_weight_lb: 48.0 }
              as: AcceptanceAgent
            - call: "POST /baggage/screenings"
              payload: { bag_id: "${bag}", lane_id: "${lane}", start_utc: "2026-09-01T09:00:00Z" }
              as: Screener
          trigger:
            - call: "POST /baggage/bags/${bag}/weigh"
              payload: { scale_weight_lb: 48.5 }
              as: AcceptanceAgent
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id is ERR_INVALID_STATE"
            - "Bag.${bag}.custody_status is still SORTED and screening_status is still CLEARED"
            - "Bag.${bag}.scale_weight_lb is still 48.0, not 48.5"
            - "GET /baggage/bags/${bag}/scans returns exactly 2 rows (INDUCTION and SCREENING), so no third scan was appended"
            - "the bag's version is unchanged by the refusal"

      - name: manual_inspection_task_cannot_be_claimed_twice
        claim_type: Idempotency
        grounds:
          - state_machines.ManualInspectionTask.QUEUED_to_IN_PROGRESS
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Claiming the same queued inspection task twice fails on the second attempt, because the first claim moved it out of QUEUED — the second call observes IN_PROGRESS and is rejected."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA with make-up area MA-3 and lane EDS-2; airline DL; flight DL1423 departs 15:00"
            - "bag M1 carrying MOBILITY_DEVICE, cleanly screened, then assign-makeup opened its inspection task"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /baggage/stations"
              payload: { code: "SEA", name: "Seattle-Tacoma", sorter_capacity_bags: 60 }
              as: PlatformAdmin
              captures: { st: $.data.id }
            - call: "POST /baggage/airlines"
              payload: { code: "DL", name: "Delta Air Lines", interline_agreement_active: true, max_excess_weight_lb: 50, excess_weight_fee_cents: 7500, compensation_cap_cents: 300000 }
              as: PlatformAdmin
              captures: { al: $.data.id }
            - call: "POST /baggage/makeup-areas"
              payload: { station_id: "${st}", code: "MA-3", capacity_slots: 2, buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { ma: $.data.id }
            - call: "POST /baggage/screening-lanes"
              payload: { station_id: "${st}", lane_code: "EDS-2" }
              as: PlatformAdmin
              captures: { lane: $.data.id }
            - call: "POST /baggage/flights"
              payload: { station_id: "${st}", airline_id: "${al}", flight_number: "DL1423", bank_code: "B1", scheduled_departure_utc: "2026-09-01T15:00:00Z" }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /baggage/bags"
              payload: { station_id: "${st}", flight_id: "${f1}", passenger_name: "Adeyemi, Tunde", passenger_ref: "PNR9K3L", itinerary_type: "DOMESTIC", weight_lb: 48, length_in: 20, width_in: 14, height_in: 16 }
              as: AcceptanceAgent
              captures: { m1: $.data.id }
            - call: "POST /baggage/bags/${m1}/special-items"
              payload: { item_type: "MOBILITY_DEVICE", declared_value_cents: 400000 }
              as: AcceptanceAgent
            - call: "POST /baggage/bags/${m1}/weigh"
              payload: { scale_weight_lb: 48.0 }
              as: AcceptanceAgent
              captures: { m1v: $.data.version }
            - call: "POST /baggage/screenings"
              payload: { bag_id: "${m1}", lane_id: "${lane}", start_utc: "2026-09-01T09:00:00Z" }
              as: Screener
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T13:40:00Z" }
              as: PlatformAdmin
            - call: "GET /baggage/bags/${m1}"
              payload: {}
              as: AcceptanceAgent
              captures: { m1v_f: $.data.version }
            - call: "POST /baggage/bags/${m1}/assign-makeup"
              payload: { expected_bag_version: "${m1v_f}", makeup_area_id: "${ma}", induction_utc: "2026-09-01T13:40:00Z", makeup_interval_minutes: 120 }
              as: SortationAgent
            - call: "GET /baggage/inspections"
              payload: { station_id: "${st}", status: "QUEUED" }
              as: Screener
              captures: { task: "$.data[0].id" }
          trigger:
            - call: "POST /baggage/inspections/${task}/claim"
              payload: {}
              as: Screener
              captures: { task_after: $.data.id }
            - call: "POST /baggage/inspections/${task}/claim"
              payload: {}
              as: Screener
              captures: { err: $.data.error_id }
          assert:
            - "the first claim returns 200 and ManualInspectionTask.${task}.status == IN_PROGRESS"
            - "the second claim returns 409 with error_id ERR_INVALID_STATE"
            - "ManualInspectionTask.${task}.assigned_to is still the first claimer's identity"
            - "Station.${st}.manual_queue_depth == 1 both before and after the second claim, because IN_PROGRESS is still counted"
            - "resolving the task CLEARED then claiming it again also returns ERR_INVALID_STATE"

      - name: screening_event_cannot_be_resolved_twice
        claim_type: Idempotency
        grounds:
          - state_machines.ScreeningEvent.ALARMED_to_CLEARED
          - errors[ERR_SCREENING_EVENT_NOT_ALARMED]
        distinguishing_aspect: "Once an alarmed screening window has been resolved it is no longer ALARMED, so a second resolve is refused with ERR_SCREENING_EVENT_NOT_ALARMED rather than silently reapplying the outcome."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA with lane EDS-2; airline DL; flight DL1423 departs 15:00; bag B1 48 lb weighed and then alarmed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
