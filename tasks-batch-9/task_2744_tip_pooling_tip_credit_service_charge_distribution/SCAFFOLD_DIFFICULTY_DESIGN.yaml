          assert:
            - "Dispute.${dispute_id}.status == UPHELD with adjudicated_amount_cents == 1500, the full claim, because the UPHELD arm ignores awarded_cents"
            - "GET /back-wage-corrections?pay_line_id=${pay_line_id} returns exactly 2 rows"
            - "the new correction has status PENDING, amount_cents 1500, reason_code TIP_CREDIT_INVALID, dispute_id ${dispute_id} and supersedes_correction_id == ${corr1_id}"
            - "BackWageCorrection.${corr1_id}.status == VOIDED with voided_at 2026-08-10T12:00:00Z, and its amount_cents is still 1000 because voiding is not deletion"
