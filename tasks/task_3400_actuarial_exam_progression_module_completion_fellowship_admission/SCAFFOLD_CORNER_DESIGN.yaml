  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: rbac_committee_cannot_administer_windows
        claim_type: violation_to_error
        grounds: ["roles.ExamCommittee", "roles.Registrar", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "ExamCommittee calling the Registrar-only window-creation endpoint gets ERR_UNAUTHORIZED_ROLE (403) even with a well-formed payload."
        test_recipe:
          setup: ["empty DB (role check fires before existence)"]
          setup_api_calls: []
          trigger:
            - call: "POST /actuarial/exam-windows"
              payload: { exam_id: "00000000-0000-0000-0000-000000000000", window_code: "X-1", registration_opens_at: "2026-09-01T00:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", testing_starts_at: "2026-10-10T09:00:00Z", testing_ends_at: "2026-10-12T17:00:00Z", capacity: 30, base_fee_cents: 30000, late_surcharge_cents: 7500 }
              as: ExamCommittee
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED_ROLE"
      - name: rbac_grader_cannot_review_vee
        claim_type: violation_to_error
        grounds: ["roles.Grader", "roles.AcademicReviewer", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Grader calling the AcademicReviewer-only VEE review endpoint gets ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /actuarial/vee-submissions/00000000-0000-0000-0000-000000000000/review"
              payload: { decision: "APPROVE" }
              as: Grader
              as_user_id: "grader-001"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED_ROLE"
      - name: rbac_board_cannot_file_case
        claim_type: violation_to_error
        grounds: ["roles.DisciplineBoard", "roles.Registrar", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Segregation of duties across the discipline process: the DisciplineBoard adjudicates but cannot file — POST /actuarial/discipline-cases as DisciplineBoard fails ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["one candidate"]
          setup_api_calls:
            - call: "POST /actuarial/candidates"
              payload: { email: "cand1@example.com", full_name: "Cand One" }
              as: Anonymous
              captures: { cand_id: $.data.id }
          trigger:
            - call: "POST /actuarial/discipline-cases"
              payload: { candidate_id: "${cand_id}", charge: "self-filed", severity: 5 }
              as: DisciplineBoard
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED_ROLE (filing is the Registrar's exclusive operation)"
      - name: rbac_registrar_cannot_sanction
        claim_type: violation_to_error
        grounds: ["roles.Registrar", "roles.DisciplineBoard", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "The mirror segregation: the Registrar who filed the case cannot resolve it — sanction as Registrar fails ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["one candidate with a FILED case"]
          setup_api_calls:
            - call: "POST /actuarial/candidates"
              payload: { email: "cand1@example.com", full_name: "Cand One" }
              as: Anonymous
              captures: { cand_id: $.data.id }
            - call: "POST /actuarial/discipline-cases"
              payload: { candidate_id: "${cand_id}", charge: "Misconduct", severity: 5 }
              as: Registrar
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /actuarial/discipline-cases/${case_id}/sanction"
              payload: { resolution: "REPRIMAND" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED_ROLE (sanction is the DisciplineBoard's exclusive operation)"
      - name: rbac_anonymous_cannot_read_candidates
        claim_type: violation_to_error
        grounds: ["roles.Anonymous", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Anonymous may only self-register; reading a candidate record as Anonymous fails ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["one candidate"]
          setup_api_calls:
            - call: "POST /actuarial/candidates"
              payload: { email: "cand1@example.com", full_name: "Cand One" }
              as: Anonymous
              captures: { cand_id: $.data.id }
          trigger:
            - call: "GET /actuarial/candidates/${cand_id}"
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED_ROLE"

