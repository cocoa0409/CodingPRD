  # =========================================================================
  # Cross-cutting complexity layers (§1.2.1 + complexity_profile)
  # =========================================================================
  - section: cross-cutting complexity layers
    instances:
      - name: corner_occ_stale_employee_version_then_reread_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[certification-create-stale-employee]
          - validations[priority=15]
          - errors.ERR_STALE_EMPLOYEE_VERSION
          - endpoints[POST /loan-certifications]
        distinguishing_aspect: "A payroll line posted between the client's read and its write advances Employee.version, so the claim create with the stale expected_employee_version returns 412 ERR_STALE_EMPLOYEE_VERSION; re-reading the employee and resubmitting the identical body then returns 201."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN with two OPEN PayrollPeriods."
            - "One Employee with a first payroll line of 1000000 cents compensation and 20000 cents deferral."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /employees"
              payload: { external_id: "E-OCC1", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000, vesting_service_months: 72 }
              as: BenefitsAdministrator
              captures: { emp_id: $.data.id }
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 1, start_date: "2026-01-01T00:00:00Z", end_date: "2026-01-31T23:59:59Z", pay_date: "2026-02-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp1_id: $.data.id }
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 2, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T23:59:59Z", pay_date: "2026-03-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp2_id: $.data.id }
            - call: "POST /contribution-records"
              payload: { employee_id: "${emp_id}", payroll_period_id: "${pp1_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 20000 }
              as: PayrollOperator
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
              captures: { emp_v1: $.data.version, space1: $.data.remaining_qslp_space_cents }
            - call: "POST /contribution-records"
              payload: { employee_id: "${emp_id}", payroll_period_id: "${pp2_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 15000 }
              as: PayrollOperator
          trigger:
            - call: "POST /loan-certifications"
              payload: { employee_id: "${emp_id}", plan_year_id: "${py_id}", certification_method: "SERVICER_STATEMENT", expected_employee_version: "${emp_v1}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
              captures: { emp_v2: $.data.version, space2: $.data.remaining_qslp_space_cents }
            - call: "POST /loan-certifications"
              payload: { employee_id: "${emp_id}", plan_year_id: "${py_id}", certification_method: "SERVICER_STATEMENT", expected_employee_version: "${emp_v2}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { cert_id: $.data.id, cert_st: $.data.status }
          assert:
            - "space1 == 2280000  # 2300000 - 20000"
            - "err == ERR_STALE_EMPLOYEE_VERSION"
            - "HTTP status == 412 on the first create"
            - "emp_v2 > emp_v1"
            - "space2 == 2265000  # 2300000 - 35000"
            - "cert_st == DRAFT"
            - "HTTP status == 201 on the second create"
            - "exactly one LoanCertification row exists for employee ${emp_id}"

      - name: corner_occ_stale_plan_year_version_on_allocation_correction
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[allocation-correction-stale-plan-year]
          - validations[priority=16]
          - errors.ERR_STALE_PLAN_YEAR_VERSION
          - endpoints[POST /match-allocations/{allocation_id}/corrections]
        distinguishing_aspect: "The second OCC rule guards a different parent on a different write endpoint: a payroll line posted after the ledger read advances PlanYear.version, so the correction with the stale expected_plan_year_version returns 412 ERR_STALE_PLAN_YEAR_VERSION and only succeeds after the client re-reads the reconciled ledger."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN with an EFFECTIVE PlanAmendment and two OPEN PayrollPeriods."
            - "One Employee with a first payroll line of 1000000 cents compensation and 20000 cents deferral."
            - "One ACCEPTED LoanCertification of 30000 cents whose 20000-cent MIRROR allocation is SCHEDULED into a PENDING FundingBatch."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /plan-amendments"
              payload: { plan_year_id: "${py_id}", document_ref: "AMD-2026-CORNER-12", effective_date: "2026-01-01T00:00:00Z" }
              as: BenefitsAdministrator
              captures: { amd_id: $.data.id }
            - call: "POST /plan-amendments/${amd_id}/status"
              payload: { to_status: "ADOPTED" }
              as: BenefitsAdministrator
            - call: "POST /plan-amendments/${amd_id}/status"
              payload: { to_status: "NOTICE_SENT", notice_channel: "EMAIL" }
              as: BenefitsAdministrator
            - call: "POST /plan-amendments/${amd_id}/status"
              payload: { to_status: "EFFECTIVE" }
