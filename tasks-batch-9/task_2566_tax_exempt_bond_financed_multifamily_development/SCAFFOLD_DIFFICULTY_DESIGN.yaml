        grounds:
          - state_machines.ComplianceReport.SUBMITTED_to_NONCOMPLIANCE_FOUND
          - state_machines.Project.RESTRICTED_to_NONCOMPLIANT
          - state_machines.CreditAllocation.ISSUED_to_RECAPTURE_PENDING
          - state_machines.InvestorDelivery.ACCEPTED_to_RECAPTURE_FLAGGED
          - calculations.recapture_exposure
          - entities.CreditAllocation.fields.recapture_amount_cents
          - entities.ComplianceReport.fields.achieved_set_aside_bps
