        actor: PremiumSalesRep | StadiumAdmin
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/transfer-requests/{id}/set_status {target_status: WITHDRAWN}"
        actor: AccountHolder
        preconditions: ["caller owns from_account_id"]
        side_effects: []
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /api/transfer-requests/{id}/set_status {target_status: WITHDRAWN}"
        actor: AccountHolder
        preconditions: ["caller owns from_account_id"]
        side_effects: []
      - from: APPROVED
