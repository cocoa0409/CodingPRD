      - name: kitchen_lead_cannot_approve_pre_show_content
        claim_type: denied
        grounds:
          - roles.KitchenLead
          - roles.PreShowProducer.exclusive_operations
        distinguishing_aspect: "Content approval belongs to the producer alone, so the kitchen lead is denied it even though the same role owns every showtime lifecycle action."
