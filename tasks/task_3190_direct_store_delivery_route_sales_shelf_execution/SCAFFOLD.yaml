# =============================================================================
# SCAFFOLD.yaml — task_3190_direct_store_delivery_route_sales_shelf_execution
# Direct Store Delivery Route Sales & Shelf Execution (Frito-Lay style DSD)
# §1.0–§1.7 seed tables. §1.8 and §1.9 live in sibling files.
# =============================================================================

scenario: |
  Direct Store Delivery Route Sales & Shelf Execution (Frito-Lay): route sales
  representative territory assignment with a fixed set of stores and a service
  frequency schedule, handheld order entry and truck inventory management with
  per-route stock allocation, in-store shelf stocking, rotation and display
  building executed by the delivery representative rather than store staff,
  stale product pull and credit with return accounting against route
  performance, promotional display execution against retailer agreements with
  compliance photos, route settlement reconciling truck inventory, sales and
  credits at day end, seasonal and event demand surges with additional route
  capacity, retailer service level and out-of-stock measurement.

domain_name: dsd-route-sales
api_prefix: /dsd

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_target: beyond_expert
  rationale: |
    Flat peer topology: every cross-entity rule travels over explicit FKs in
    request bodies, never over nested paths. Core difficulty lives in (a) the
    dual-algorithm settlement ledger (inventory-delta vs chronological event
    replay), (b) per-route truck stock allocation competing across store
    orders under a nested-min capacity rule with an event-surge branch,
    (c) FEFO lot consumption interacting with a freshness guarantee that
    renders short-dated lots undeliverable but stale-creditable, and
    (d) segregation of duties between the rep who executes shelf/credit work
    and the supervisor/store manager who must approve it.

# =============================================================================
# §1.1 Entity-Relationship Table
# (flat topology — all collections top-level under /dsd; FKs in bodies)
# =============================================================================
entities:
  - name: RouteSalesRepresentative
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Rep display name" }
      - { name: home_depot, type: string, source: input, description: "Home distribution depot code" }
      - { name: status, type: enum, source: input, default: "ACTIVE", constraints: "ACTIVE | INACTIVE", description: "Employment status; INACTIVE reps cannot own routes (reactivate precondition)" }

  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: store_code, type: string, source: input, constraints: "unique across all stores", description: "Retailer account code" }
      - { name: name, type: string, source: input, description: "Store display name" }
      - { name: format, type: enum, source: input, constraints: "CONVENIENCE | GROCERY | SUPERCENTER | DOLLAR", description: "Store format" }
      - { name: credit_policy, type: enum, source: input, constraints: "FULL_RETAIL | SALVAGE_RATE", description: "Stale-credit pricing policy for this retailer agreement" }
      - { name: delivery_window_start_minute, type: integer, source: input, constraints: "0..1439, < delivery_window_end_minute", description: "Earliest minute-of-day (UTC) a delivery may be submitted" }
      - { name: delivery_window_end_minute, type: integer, source: input, constraints: "1..1440, > delivery_window_start_minute", description: "Half-open end of delivery window (minute-of-day UTC); delivery at exactly this minute is rejected" }
      - { name: store_credit_cap_cents, type: integer, source: input, constraints: ">= 0", description: "Max total stale-credit value (PENDING_APPROVAL + APPROVED) per store per route day" }
      - { name: promo_rebate_balance_cents, type: integer, source: computed, default: 0, description: "Cumulative promo rebates earned by this store from verified display executions" }
      - { name: status, type: enum, source: system, constraints: "ACTIVE | SUSPENDED", description: "Suspended stores cannot receive orders, credits, or new executions" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, constraints: "unique across all products", description: "Stock-keeping unit code" }
      - { name: name, type: string, source: input, description: "Product display name" }
      - { name: case_price_cents, type: integer, source: input, constraints: "> 0", description: "List price per case in cents" }
      - { name: shelf_life_days, type: integer, source: input, constraints: "> 0", description: "Days from production to expiration (informational)" }
      - { name: promo_eligible, type: boolean, source: input, default: true, description: "Whether the product may appear in promo agreements" }

  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: territory_code, type: string, source: input, constraints: "unique across all routes", description: "Territory identifier" }
      - { name: rsr_id, type: string, source: input, description: "FK -> RouteSalesRepresentative.id; the single rep assigned to this route" }
      - { name: base_capacity_cases, type: integer, source: input, constraints: "> 0", description: "Standard per-day case allocation for the route" }
      - { name: truck_cap_cases, type: integer, source: input, constraints: "> 0", description: "Physical truck capacity ceiling in cases" }
      - { name: performance_flag, type: enum, source: computed, default: "CLEAR", constraints: "CLEAR | PERFORMANCE_WATCH", description: "Derived from stale ratio at snapshot time" }
      - { name: status, type: enum, source: system, constraints: "ACTIVE | SUSPENDED", description: "Suspended routes cannot plan route days or accept assignments" }

  - name: RouteStoreAssignment
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> Route.id" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: service_weekdays, type: array, source: input, constraints: "non-empty subset of [MON,TUE,WED,THU,FRI,SAT,SUN]", description: "Service frequency schedule: weekdays this store is serviced by this route" }
      - { name: stop_sequence, type: integer, source: input, constraints: ">= 1", description: "Position of the store in the route's stop order" }
      - { name: status, type: enum, source: system, constraints: "ACTIVE | RETIRED", description: "Retired assignments are excluded from day-conflict checks and order gating" }

  - name: RouteDay
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> Route.id" }
      - { name: service_date, type: string, source: input, constraints: "ISO date YYYY-MM-DD", description: "Calendar date of the service run" }
      - { name: is_event_day, type: boolean, source: input, default: false, description: "Seasonal/event surge flag" }
      - { name: event_surge_cases, type: integer, source: input, default: 0, constraints: ">= 0; must be 0 when is_event_day is false", description: "Additional surge allocation requested for an event day" }
      - { name: capacity_cases, type: integer, source: computed, description: "min(base_capacity_cases + (is_event_day ? event_surge_cases : 0), truck_cap_cases)" }
      - { name: loaded_cases, type: integer, source: computed, default: 0, description: "Sum of loaded_cases over the day's lots" }
      - { name: delivered_cases, type: integer, source: computed, default: 0, description: "Sum of delivered_cases over the day's lots" }
      - { name: stale_pulled_cases, type: integer, source: computed, default: 0, description: "Sum of stale_pulled_cases over the day's lots" }
      - { name: status, type: enum, source: system, constraints: "PLANNED | LOADED | IN_PROGRESS | SETTLED | CANCELLED", description: "Operational posture of the route day" }

  - name: TruckInventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: route_day_id, type: string, source: system, description: "FK -> RouteDay.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: lot_code, type: string, source: input, description: "Production lot code" }
      - { name: expiration_date, type: string, source: input, constraints: "ISO date YYYY-MM-DD", description: "Expiration date of this lot" }
      - { name: loaded_cases, type: integer, source: input, constraints: "> 0", description: "Cases loaded onto the truck from this lot" }
      - { name: delivered_cases, type: integer, source: computed, default: 0, description: "Cases delivered to stores from this lot (FEFO)" }
      - { name: stale_pulled_cases, type: integer, source: computed, default: 0, description: "Cases pulled as stale and credited from this lot" }
      - { name: returned_cases, type: integer, source: computed, default: 0, description: "Cases returned to depot at settlement or on cancel" }
      - { name: remaining_cases, type: integer, source: computed, description: "loaded_cases - delivered_cases - stale_pulled_cases - returned_cases" }
      - { name: status, type: enum, source: system, constraints: "SEALED | OPEN | CLOSED", description: "SEALED after load, OPEN while route day IN_PROGRESS, CLOSED at settle/cancel" }

  - name: StoreOrder
    parent: null
    common_fields: true
    fields:
      - { name: route_day_id, type: string, source: input, description: "FK -> RouteDay.id" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: order_type, type: enum, source: input, default: "STANDARD", constraints: "STANDARD | EVENT_SURGE", description: "EVENT_SURGE permitted only when the route day is an event day" }
      - { name: status, type: enum, source: system, constraints: "DRAFT | SUBMITTED | DELIVERED | CANCELLED", description: "Handheld order lifecycle; SUBMITTED may loop back to DRAFT" }
      - { name: gross_total_cents, type: integer, source: computed, default: 0, description: "Sum of per-line line_total_cents (per-line rounding then sum)" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of last submission" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock timestamp of delivery" }

  - name: OrderLine
    parent: null
    common_fields: false
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> StoreOrder.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: qty_ordered_cases, type: integer, source: input, constraints: "> 0", description: "Cases ordered" }
      - { name: line_discount_pct, type: number, source: input, default: 0, constraints: "0 <= x < 1", description: "Line-level discount fraction" }
      - { name: qty_delivered_cases, type: integer, source: computed, default: 0, description: "Cases actually delivered (set at deliver)" }
      - { name: line_total_cents, type: integer, source: computed, description: "round_half_up(qty_ordered_cases * case_price_cents * (1 - line_discount_pct)) — rounded per line" }
      - { name: line_seq, type: integer, source: system, description: "1-based position of the line within the order payload" }

  - name: ShelfExecution
    parent: null
    common_fields: true
    fields:
      - { name: route_day_id, type: string, source: input, description: "FK -> RouteDay.id" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: qty_placed_cases, type: integer, source: input, constraints: ">= 0", description: "Cases the rep placed on the shelf/display" }
      - { name: rotated, type: boolean, source: input, description: "Whether the rep rotated stock (oldest to front)" }
      - { name: display_built, type: boolean, source: input, description: "Whether the rep built/rebuilt a display" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the rep who recorded the execution" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the store manager who verified (null until verified)" }
      - { name: status, type: enum, source: system, constraints: "RECORDED | VERIFIED | REJECTED", description: "Store-manager verification outcome" }

  - name: StaleCredit
    parent: null
    common_fields: true
    fields:
      - { name: route_day_id, type: string, source: input, description: "FK -> RouteDay.id" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: lot_id, type: string, source: system, description: "FK -> TruckInventoryLot.id; FEFO-selected stale-eligible lot at creation" }
      - { name: qty_cases, type: integer, source: input, constraints: "> 0", description: "Cases pulled as stale" }
      - { name: pricing_variant, type: enum, source: computed, constraints: "FULL_RETAIL | SALVAGE_RATE", description: "Snapshot of the store's credit policy at creation" }
      - { name: credit_cents, type: integer, source: computed, description: "FULL_RETAIL: qty * case_price_cents; SALVAGE_RATE: round_half_up(qty * case_price_cents * 0.40)" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator (rep or supervisor)" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of approver/rejecter (null until decided)" }
      - { name: reject_reason, type: string, source: input, description: "Reason supplied on reject (null otherwise)" }
      - { name: status, type: enum, source: system, constraints: "PENDING_APPROVAL | APPROVED | REJECTED", description: "REJECTED may be resubmitted to PENDING_APPROVAL" }

  - name: PromoAgreement
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: window_start, type: string, source: input, constraints: "ISO date", description: "First date (inclusive) display execution is valid" }
      - { name: window_end, type: string, source: input, constraints: "ISO date, > window_start", description: "End date (exclusive) — half-open window [window_start, window_end)" }
      - { name: display_type, type: enum, source: input, constraints: "ENDCAP | AISLE | DUMP_BIN | COUNTER", description: "Contracted display type" }
      - { name: rebate_cents, type: integer, source: input, constraints: ">= 0", description: "Rebate paid to the store on verified compliant execution" }
      - { name: status, type: enum, source: system, constraints: "SCHEDULED | ACTIVE | COMPLETED | BREACHED | EXPIRED", description: "Agreement lifecycle against the retailer contract" }

  - name: PromoExecution
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> PromoAgreement.id" }
      - { name: route_day_id, type: string, source: input, description: "FK -> RouteDay.id" }
      - { name: photo_url, type: string, source: input, description: "Compliance photo evidence URL" }
      - { name: built_by_user_id, type: string, source: system, description: "X-User-ID of the rep who built the display" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of verifier (store manager of the agreement's store, or a supervisor)" }
      - { name: reject_reason, type: string, source: input, description: "Reason supplied on reject (null otherwise)" }
      - { name: status, type: enum, source: system, constraints: "SUBMITTED | VERIFIED | REJECTED", description: "Compliance review outcome; a REJECTED execution may be superseded by a new submission" }

  - name: RouteSettlement
    parent: null
    common_fields: true
    fields:
      - { name: route_day_id, type: string, source: input, description: "FK -> RouteDay.id; unique — at most one settlement per route day" }
      - { name: status, type: enum, source: system, constraints: "OPEN | BALANCED | DISPUTED | POSTED", description: "Day-end reconciliation lifecycle; DISPUTED loops back to OPEN" }
      - { name: gross_delivered_cents, type: integer, source: computed, default: 0, description: "Sum of line_total_cents over DELIVERED orders of the route day (per-line priced)" }
      - { name: credits_cents, type: integer, source: computed, default: 0, description: "Sum of credit_cents over APPROVED stale credits of the route day" }
      - { name: forward_expected_cents, type: integer, source: computed, default: 0, description: "Inventory-delta variant: (sum over lots of (loaded - stale_pulled - remaining) * case_price_cents) - credits_cents" }
      - { name: chronological_expected_cents, type: integer, source: computed, default: 0, description: "Event-replay variant: gross_delivered_cents - credits_cents" }
      - { name: recon_delta_cents, type: integer, source: computed, default: 0, description: "forward_expected_cents - chronological_expected_cents (captures discount drift)" }
      - { name: cash_collected_cents, type: integer, source: input, description: "Cash/remittance declared at balance time (null until first balance)" }
      - { name: variance_cents, type: integer, source: computed, description: "cash_collected_cents - chronological_expected_cents" }
      - { name: posted_at, type: datetime, source: system, description: "Logical-clock timestamp of posting (null until POSTED)" }

  - name: ServiceLevelSnapshot
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id" }
      - { name: period_start, type: string, source: input, constraints: "ISO date", description: "Start of measurement window (inclusive)" }
      - { name: period_end, type: string, source: input, constraints: "ISO date, > period_start", description: "End of measurement window (exclusive) — half-open [period_start, period_end)" }
      - { name: orders_count, type: integer, source: computed, description: "Count of DELIVERED orders on the route's route days whose service_date is in the window" }
      - { name: fill_rate, type: number, source: computed, description: "sum(qty_delivered_cases) / sum(qty_ordered_cases) over those orders, 4 decimal places round_half_up" }
      - { name: oos_rate, type: number, source: computed, description: "1 - fill_rate, 4 decimal places" }
      - { name: service_grade, type: enum, source: computed, constraints: "GOLD | SILVER | BRONZE", description: "GOLD if oos_rate < 0.02; SILVER if oos_rate < 0.05; else BRONZE" }
      - { name: stale_ratio, type: number, source: computed, description: "approved stale credit cents on route days in window / gross delivered cents in window, 4 decimal places; 0 when gross is 0" }
      - { name: performance_flag_result, type: enum, source: computed, constraints: "CLEAR | PERFORMANCE_WATCH", description: "PERFORMANCE_WATCH if stale_ratio > 0.08 (strictly), else CLEAR; also written onto Route.performance_flag" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Route
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /dsd/routes/{routeId}/suspend"
        actor: RouteSupervisor
        preconditions: []
        side_effects:
          - "Route day creation and new assignments on this route become invalid (ERR_ROUTE_NOT_ACTIVE)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /dsd/routes/{routeId}/reactivate"
        actor: RouteSupervisor
        preconditions:
          - "RouteSalesRepresentative referenced by rsr_id has status ACTIVE (ERR_INVALID_STATE)"
        side_effects: []
        note: "Cyclic: a route may be suspended and reactivated repeatedly."

  - entity: Store
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /dsd/stores/{storeId}/suspend"
        actor: RouteSupervisor
        preconditions: []
        side_effects:
          - "Order creation, stale-credit creation, and shelf/promo executions for this store become invalid (ERR_STORE_NOT_ACTIVE)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /dsd/stores/{storeId}/reactivate"
        actor: RouteSupervisor
        preconditions: []
        side_effects: []

  - entity: RouteStoreAssignment
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /dsd/route-assignments/{assignmentId}/retire"
        actor: RouteSupervisor
        preconditions: []
        side_effects:
          - "Assignment excluded from weekday-coverage checks and day-conflict checks from retirement onward"

  - entity: RouteDay
    initial_state: PLANNED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: PLANNED
        to: LOADED
        trigger: "POST /dsd/route-days/{routeDayId}/load"
        actor: RouteSalesRep
        preconditions:
          - "Acting rep's X-User-ID equals route.rsr_id (ERR_REP_NOT_ASSIGNED)"
          - "Route status ACTIVE (ERR_ROUTE_NOT_ACTIVE)"
          - "Sum of lot loaded_cases <= capacity_cases (ERR_CAPACITY_EXCEEDED)"
          - "Every lot's product exists (ERR_PRODUCT_NOT_FOUND)"
        side_effects:
          - "Creates one TruckInventoryLot per payload lot, status SEALED"
          - "loaded_cases recomputed; increments RouteDay.version by 1"
      - from: LOADED
        to: IN_PROGRESS
        trigger: "POST /dsd/route-days/{routeDayId}/start"
        actor: RouteSalesRep
        preconditions:
          - "Acting rep's X-User-ID equals route.rsr_id (ERR_REP_NOT_ASSIGNED)"
          - "RouteDay status must be LOADED (ERR_ROUTE_DAY_NOT_LOADED)"
        side_effects:
          - "All lots of the day: SEALED -> OPEN"
          - "increments RouteDay.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /dsd/route-days/{routeDayId}/cancel"
        actor: RouteSupervisor
        preconditions: []
        side_effects: []
      - from: LOADED
        to: CANCELLED
        trigger: "POST /dsd/route-days/{routeDayId}/cancel"
        actor: RouteSupervisor
        preconditions: []
        side_effects:
          - "Every lot: returned_cases = loaded_cases - delivered_cases - stale_pulled_cases (= loaded_cases, since no movement possible before start), status -> CLOSED"
          - "loaded/delivered/stale totals recomputed; lot conservation invariant restored with all cases returned"
      - from: IN_PROGRESS
        to: SETTLED
        trigger: "system (automatic when the route day's settlement transitions BALANCED -> POSTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Every OPEN lot: returned_cases = remaining_cases, status -> CLOSED"

  - entity: TruckInventoryLot
    initial_state: SEALED
    terminal_states: [CLOSED]
    transitions:
      - from: SEALED
        to: OPEN
        trigger: "system (automatic on route-day start)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "system (automatic on settlement post or route-day cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "returned_cases = remaining_cases (all unsold, unstaled cases return to depot)"

  - entity: StoreOrder
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /dsd/orders/{orderId}/submit"
        actor: RouteSalesRep
        preconditions:
          - "RouteDay of the order is IN_PROGRESS (ERR_ROUTE_DAY_NOT_IN_PROGRESS)"
          - "Store is ACTIVE (ERR_STORE_NOT_ACTIVE)"
          - "Logical clock minute-of-day within [store.delivery_window_start_minute, store.delivery_window_end_minute) (ERR_DELIVERY_WINDOW_MISSED)"
          - "Order has at least one line (ERR_VALIDATION)"
        side_effects:
          - "submitted_at = logical clock; increments StoreOrder.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /dsd/orders/{orderId}/unsubmit"
        actor: RouteSalesRep
        preconditions: []
        side_effects:
          - "increments StoreOrder.version by 1"
        note: "Revision loop: rep may pull the order back to DRAFT to edit on the handheld."
      - from: SUBMITTED
        to: DELIVERED
        trigger: "POST /dsd/orders/{orderId}/deliver"
        actor: RouteSalesRep
        preconditions:
          - "RouteDay of the order is IN_PROGRESS (ERR_ROUTE_DAY_NOT_IN_PROGRESS)"
          - "Every payload line's product is on the order (ERR_DELIVERY_LINE_NOT_ON_ORDER)"
          - "Freshness: every lot consumed has days_to_expiry > 5 (ERR_FRESHNESS_GUARANTEE_VIOLATION)"
          - "Sufficient remaining stock across the day's freshness-eligible lots per line (ERR_INSUFFICIENT_TRUCK_STOCK)"
          - "qty_delivered_cases per line <= qty_ordered_cases (ERR_VALIDATION)"
        side_effects:
          - "Per line: qty_delivered_cases set from payload (absent lines default 0)"
          - "FEFO consumption: for each line, consume from the day's freshness-eligible OPEN lots of that product ordered by expiration_date ASC, tie-break lot created_at ASC; increment lot.delivered_cases"
          - "RouteDay.delivered_cases recomputed from lots (lot mutation triggers route-day recompute)"
          - "If a RouteSettlement exists for the day and is OPEN: gross_delivered_cents, forward_expected_cents, chronological_expected_cents recomputed (route-day mutation triggers settlement recompute)"
          - "delivered_at = logical clock; increments StoreOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /dsd/orders/{orderId}/cancel"
        actor: RouteSalesRep
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /dsd/orders/{orderId}/cancel"
        actor: RouteSalesRep
        preconditions: []
        side_effects: []

  - entity: ShelfExecution
    initial_state: RECORDED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: RECORDED
        to: VERIFIED
        trigger: "POST /dsd/shelf-executions/{execId}/verify with outcome=VERIFIED"
        actor: StoreManager
        preconditions:
          - "Acting store manager's X-User-ID equals execution.store_id (ERR_STORE_SCOPE_VIOLATION)"
        side_effects:
          - "verified_by_user_id = acting user"
      - from: RECORDED
        to: REJECTED
        trigger: "POST /dsd/shelf-executions/{execId}/verify with outcome=REJECTED"
        actor: StoreManager
        preconditions:
          - "Acting store manager's X-User-ID equals execution.store_id (ERR_STORE_SCOPE_VIOLATION)"
        side_effects:
          - "verified_by_user_id = acting user; reject_reason recorded"

  - entity: StaleCredit
    initial_state: PENDING_APPROVAL
    terminal_states: [APPROVED]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /dsd/stale-credits/{creditId}/approve"
        actor: RouteSupervisor
        preconditions:
          - "Approver X-User-ID != credit.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_by_user_id = approver"
          - "Lot (lot_id): stale_pulled_cases += qty_cases (approval mutates the lot)"
          - "RouteDay.stale_pulled_cases recomputed from lots (lot mutation triggers route-day recompute)"
          - "If a RouteSettlement exists for the day: credits_cents and both expected variants recomputed; if settlement was BALANCED it auto-reopens to OPEN (route-day stale mutation triggers settlement recompute and reopen)"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /dsd/stale-credits/{creditId}/reject"
        actor: RouteSupervisor
        preconditions:
          - "Rejecter X-User-ID != credit.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "reject_reason required (ERR_VALIDATION)"
        side_effects:
          - "decided_by_user_id = rejecter; no lot or settlement effect"
      - from: REJECTED
        to: PENDING_APPROVAL
        trigger: "POST /dsd/stale-credits/{creditId}/resubmit"
        actor: RouteSalesRep
        preconditions:
          - "RouteDay of the credit is IN_PROGRESS (ERR_ROUTE_DAY_NOT_IN_PROGRESS)"
        side_effects:
          - "reject_reason cleared; decided_by_user_id cleared"
        note: "Cyclic resubmission loop: REJECTED -> PENDING_APPROVAL -> REJECTED/APPROVED any number of times."

  - entity: PromoAgreement
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, BREACHED, EXPIRED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /dsd/promo-agreements/{agreementId}/activate"
        actor: RouteSupervisor
        preconditions:
          - "Logical clock date within [window_start, window_end) (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (automatic when a PromoExecution for this agreement transitions SUBMITTED -> VERIFIED)"
        actor: system
        preconditions: []
        side_effects:
          - "Store.promo_rebate_balance_cents += rebate_cents (agreement completion posts the rebate to the store)"
      - from: ACTIVE
        to: BREACHED
        trigger: "POST /dsd/promo-agreements/{agreementId}/breach"
        actor: RouteSupervisor
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: EXPIRED
        trigger: "system (automatic when POST /dsd/_clock/set_current_utc advances the logical clock to a date >= window_end)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when POST /dsd/_clock/set_current_utc advances the logical clock to a date >= window_end)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PromoExecution
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /dsd/promo-executions/{execId}/verify"
        actor: StoreManager
        preconditions:
          - "StoreManager: X-User-ID equals agreement.store_id (ERR_STORE_SCOPE_VIOLATION); RouteSupervisor may also verify"
          - "Agreement still ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "PromoAgreement: ACTIVE -> COMPLETED (execution verification completes the agreement)"
          - "Store.promo_rebate_balance_cents += agreement.rebate_cents (agreement completion posts rebate)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /dsd/promo-executions/{execId}/reject"
        actor: StoreManager
        preconditions:
          - "StoreManager: X-User-ID equals agreement.store_id (ERR_STORE_SCOPE_VIOLATION); RouteSupervisor may also reject"
          - "reject_reason required (ERR_VALIDATION)"
        side_effects:
          - "Agreement stays ACTIVE; a new PromoExecution may be submitted (supersedes)"

  - entity: RouteSettlement
    initial_state: OPEN
    terminal_states: [POSTED]
    transitions:
      - from: OPEN
        to: BALANCED
        trigger: "POST /dsd/route-settlements/{settlementId}/balance"
        actor: RouteSupervisor
        preconditions:
          - "abs(variance_cents) <= 200 after recording cash_collected_cents (otherwise settlement remains OPEN, 200 response with status OPEN)"
        side_effects:
          - "cash_collected_cents recorded; variance_cents recomputed"
      - from: BALANCED
        to: OPEN
        trigger: "system (automatic when a stale-credit approval or a new delivery changes credits_cents or gross_delivered_cents for the day)"
        actor: system
        preconditions: []
        side_effects:
          - "cash_collected_cents retained; variance recomputed on next balance"
        note: "Auto-reopen: a BALANCED settlement is stale the moment the underlying ledger moves."
      - from: BALANCED
        to: POSTED
        trigger: "POST /dsd/route-settlements/{settlementId}/post"
        actor: RouteSupervisor
        preconditions:
          - "No order of the route day in SUBMITTED status (ERR_UNRESOLVED_ORDERS)"
        side_effects:
          - "posted_at = logical clock"
          - "RouteDay: IN_PROGRESS -> SETTLED (posting settles the day)"
          - "Every OPEN lot of the day: returned_cases = remaining_cases, OPEN -> CLOSED (day settlement closes the lots)"
      - from: OPEN
        to: DISPUTED
        trigger: "POST /dsd/route-settlements/{settlementId}/dispute"
        actor: RouteSalesRep
        preconditions:
          - "Acting rep's X-User-ID equals the route's rsr_id (ERR_REP_NOT_ASSIGNED)"
        side_effects: []
      - from: BALANCED
        to: DISPUTED
        trigger: "POST /dsd/route-settlements/{settlementId}/dispute"
        actor: RouteSalesRep
        preconditions:
          - "Acting rep's X-User-ID equals the route's rsr_id (ERR_REP_NOT_ASSIGNED)"
        side_effects: []
      - from: DISPUTED
        to: OPEN
        trigger: "POST /dsd/route-settlements/{settlementId}/resolve"
        actor: RouteSupervisor
        preconditions: []
        side_effects: []
        note: "Dispute cycle: OPEN/BALANCED <-> DISPUTED via resolve."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; serial-observable only)
# =============================================================================
concurrency_rules:
  - rule_id: order-revise-stale-order
    parent_entity: StoreOrder
    write_endpoint: "PUT /dsd/orders/{orderId}"
    occ_field: "expected_store_order_version"
    description: |
      Revising a DRAFT order replaces its lines wholesale. A revision carrying
      an expected_store_order_version older than the order's current version
      is rejected: another accepted revision has already advanced the version,
      so the writer's view of the line set is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: promo-execution-create-stale-agreement
    parent_entity: PromoAgreement
    write_endpoint: "POST /dsd/promo-executions"
    occ_field: "expected_promo_agreement_version"
    description: |
      Submitting a PromoExecution against an agreement whose version has
      advanced since the client last observed it is rejected: a prior
      execution submission (or other agreement mutation) has already advanced
      the version, so the writer's view of the agreement is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: route_day_capacity
    trigger: "RouteDay creation"
    algorithm: constraint_propagation
    formula: |
      capacity_cases = min(route.base_capacity_cases + surge, route.truck_cap_cases)
      where surge = event_surge_cases if is_event_day else 0
      Load validity: sum(lots.loaded_cases) <= capacity_cases (equality permitted).
    input_set: "The Route row referenced by route_id; the creation payload"
    constants: {}
    precision: "integer cases"
    variants:
      - name: event_day
        when: "is_event_day = true"
        difference: "surge = event_surge_cases is added before the truck-cap ceiling"
      - name: standard_day
        when: "is_event_day = false"
        difference: "surge = 0 regardless of any event_surge_cases payload value (payload must be 0)"

  - name: order_line_pricing
    trigger: "StoreOrder creation and revision (PUT); stored per line"
    algorithm: aggregation
    formula: |
      For each line i:
        line_total_cents_i = round_half_up(qty_ordered_cases_i * product.case_price_cents * (1 - line_discount_pct_i))
      order.gross_total_cents = sum_i(line_total_cents_i)
      PINNED ROUNDING ORDER: round per line first, then sum the rounded line
      totals. Rounding the unrounded sum is NOT equivalent and is forbidden.
    input_set: "The order's lines and their referenced Product.case_price_cents"
    constants: {}
    precision: "integer cents; per-line round_half_up at the cent, then integer sum"

  - name: stale_credit_amount
    trigger: "StaleCredit creation"
    algorithm: tiered_pricing
    formula: |
      variant = store.credit_policy (snapshotted onto credit.pricing_variant)
      FULL_RETAIL:  credit_cents = qty_cases * product.case_price_cents
      SALVAGE_RATE: credit_cents = round_half_up(qty_cases * product.case_price_cents * SALVAGE_RATE)
    input_set: "The credit payload, the Store.credit_policy, the Product.case_price_cents"
    constants:
      SALVAGE_RATE: 0.40
    precision: "integer cents, round_half_up"
    variants:
      - name: full_retail
        when: "store.credit_policy == FULL_RETAIL"
        difference: "credits 100% of list value"
      - name: salvage_rate
        when: "store.credit_policy == SALVAGE_RATE"
        difference: "credits 40% of list value — diverges from full_retail for identical qty and price"

  - name: settlement_reconciliation
    trigger: "RouteSettlement creation; recomputed on every delivery, stale-credit approval, and settlement balance"
    algorithm: forward_looking
    formula: |
      chronological_expected_cents = gross_delivered_cents - credits_cents
        where gross_delivered_cents = sum of line_total_cents over DELIVERED orders of the day
              credits_cents         = sum of credit_cents over APPROVED stale credits of the day
      forward_expected_cents = (sum over the day's lots of (loaded_cases - stale_pulled_cases - remaining_cases) * product.case_price_cents) - credits_cents
        (everything that left the truck and was not stale-pulled or returned is presumed sold at LIST price)
      recon_delta_cents = forward_expected_cents - chronological_expected_cents
      variance_cents = cash_collected_cents - chronological_expected_cents
    input_set: "DELIVERED orders of the route day; APPROVED stale credits of the route day; all lots of the route day"
    constants:
      VARIANCE_TOLERANCE_CENTS: 200
    precision: "integer cents"
    variants:
      - name: chronological
        when: "always computed — event replay over delivered order lines"
        difference: "uses per-line discounted prices; invisible to unrecorded inventory drift"
      - name: forward_looking
        when: "always computed — inventory delta over lots"
        difference: "values sold cases at LIST price, so line discounts surface as a positive recon_delta; the two variants diverge on identical data whenever any line_discount_pct > 0"

  - name: settlement_balance_gate
    trigger: "POST /dsd/route-settlements/{id}/balance"
    algorithm: threshold
    formula: |
      variance_cents = cash_collected_cents - chronological_expected_cents
      if abs(variance_cents) <= VARIANCE_TOLERANCE_CENTS: status -> BALANCED
      else: settlement remains OPEN (200 response; not an error)
      Boundary: abs(variance) == 200 balances; 201 does not.
    input_set: "The settlement row"
    constants:
      VARIANCE_TOLERANCE_CENTS: 200
    precision: "integer cents"

  - name: fefo_lot_consumption
    trigger: "StoreOrder delivery (per line) and StaleCredit creation (lot selection)"
    algorithm: chronological
    formula: |
      Delivery: candidate lots = the route day's OPEN lots for the product with
        remaining_cases > 0 AND days_to_expiry > FRESHNESS_MIN_DAYS.
      Stale pull: candidate lots = the route day's OPEN lots for the product with
        remaining_cases > 0 AND days_to_expiry <= STALE_WINDOW_DAYS.
      days_to_expiry = expiration_date - route_day.service_date, in whole days.
      Consume in order expiration_date ASC; tie-break lot.created_at ASC; never id.
    input_set: "OPEN lots of the route day for the product"
    constants:
      FRESHNESS_MIN_DAYS: 5
      STALE_WINDOW_DAYS: 5
    precision: "integer cases; integer days"
    note: "Freshness and stale windows are complementary at the boundary: days_to_expiry == 5 is undeliverable but stale-eligible; == 6 is deliverable and not stale-eligible."

  - name: service_level_measurement
    trigger: "POST /dsd/routes/{routeId}/service-level-snapshots"
    algorithm: aggregation
    formula: |
      window = [period_start, period_end) on route_day.service_date, half-open
      orders = DELIVERED orders on this route's route days in window
      orders_count = len(orders); if orders_count == 0: ERR_NO_DELIVERED_ORDERS
      fill_rate = round_half_up(sum(qty_delivered_cases) / sum(qty_ordered_cases), 4)
      oos_rate = round_half_up(1 - fill_rate, 4)
      service_grade = GOLD if oos_rate < 0.02 else SILVER if oos_rate < 0.05 else BRONZE
      Boundary: oos_rate == 0.02 is SILVER, not GOLD; == 0.05 is BRONZE, not SILVER.
    input_set: "DELIVERED StoreOrders of route days belonging to the route with service_date in [period_start, period_end); CANCELLED/DRAFT/SUBMITTED orders excluded"
    constants:
      GOLD_MAX_OOS: 0.02
      SILVER_MAX_OOS: 0.05
    precision: "4 decimal places, round_half_up"

  - name: route_performance_ratio
    trigger: "POST /dsd/routes/{routeId}/service-level-snapshots (computed alongside service_level_measurement)"
    algorithm: threshold
    formula: |
      stale_cents = sum of credit_cents over APPROVED stale credits on the route's route days in window
      gross_cents = sum of gross_total_cents over DELIVERED orders in window
      stale_ratio = round_half_up(stale_cents / gross_cents, 4) if gross_cents > 0 else 0
      performance_flag_result = PERFORMANCE_WATCH if stale_ratio > STALE_WATCH_THRESHOLD else CLEAR
      Route.performance_flag is overwritten with performance_flag_result (increments Route.version).
      Boundary: stale_ratio == 0.08 exactly is CLEAR (strictly-greater comparison).
    input_set: "APPROVED StaleCredits and DELIVERED StoreOrders on the route's route days with service_date in [period_start, period_end)"
    constants:
      STALE_WATCH_THRESHOLD: 0.08
    precision: "4 decimal places, round_half_up"

  - name: promo_window_lifecycle
    trigger: "Agreement activation, execution verification, and clock advancement"
    algorithm: threshold
    formula: |
      Half-open window [window_start, window_end) over logical-clock DATE.
      activate permitted iff window_start <= clock_date < window_end.
      verify permitted iff agreement ACTIVE (activation already pinned the window).
      On every POST /dsd/_clock/set_current_utc: agreements in SCHEDULED or ACTIVE
      with clock_date >= window_end transition to EXPIRED.
    input_set: "PromoAgreement rows in SCHEDULED or ACTIVE"
    constants: {}
    precision: "whole ISO dates"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for the endpoint; ownership scope (rep owns the route day via route.rsr_id; store manager scoped to their store)"
    error_id: "ERR_FORBIDDEN_ROLE | ERR_REP_NOT_ASSIGNED | ERR_STORE_SCOPE_VIOLATION"
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path ids exist (left-to-right), then body FK ids in the endpoint's declared input order"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 4
    category: auth
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /dsd/orders/{orderId}; POST /dsd/promo-executions"

  - priority: 5
    category: state
    check: "Target resource in a valid from-state for the transition; route ACTIVE; store ACTIVE; route day IN_PROGRESS/LOADED as required; agreement ACTIVE"
    error_id: "ERR_INVALID_STATE | ERR_ROUTE_NOT_ACTIVE | ERR_STORE_NOT_ACTIVE | ERR_ROUTE_DAY_NOT_IN_PROGRESS | ERR_ROUTE_DAY_NOT_LOADED | ERR_AGREEMENT_NOT_ACTIVE | ERR_SETTLEMENT_ALREADY_EXISTS | ERR_PENDING_EXECUTION_EXISTS | ERR_UNRESOLVED_ORDERS"
    http_status: 409
    applies_to: "All transition and child-creation endpoints"

  - priority: 6
    category: auth
    check: "Segregation of duties: stale-credit approver/rejecter must differ from credit.created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /dsd/stale-credits/{id}/approve, /reject"

  - priority: 7
    category: business_safety
    check: "Freshness guarantee: delivery may not consume a lot with days_to_expiry <= 5"
    error_id: ERR_FRESHNESS_GUARANTEE_VIOLATION
    http_status: 422
    applies_to: "POST /dsd/orders/{id}/deliver"

  - priority: 8
    category: business_temporal
    check: "Delivery window half-open [start_minute, end_minute) on logical clock; promo window overlap for same store+product; assignment weekday-set intersection per store; route-day service weekday covered by an ACTIVE assignment; agreement activation inside [window_start, window_end)"
    error_id: "ERR_DELIVERY_WINDOW_MISSED | ERR_PROMO_WINDOW_OVERLAP | ERR_ASSIGNMENT_DAY_CONFLICT | ERR_NO_SCHEDULED_STOP"
    http_status: 409
    applies_to: "Order submit; promo-agreement create/activate; assignment create; route-day create"

  - priority: 9
    category: business_referential
    check: "Order/deliver products allocated on the route day (an OPEN lot exists for the product); deliver lines reference products on the order; credit product allocated on the route day"
    error_id: "ERR_PRODUCT_NOT_ALLOCATED | ERR_DELIVERY_LINE_NOT_ON_ORDER"
    http_status: 422
    applies_to: "Order create/PUT/deliver; stale-credit create"

  - priority: 10
    category: business_constraint
    check: "Capacity and stock: loaded cases <= capacity_cases; FEFO-available stock >= delivered qty; stale-eligible stock >= pulled qty; stale pull only when days_to_expiry <= 5"
    error_id: "ERR_CAPACITY_EXCEEDED | ERR_INSUFFICIENT_TRUCK_STOCK | ERR_PRODUCT_NOT_STALE_ELIGIBLE"
    http_status: 422
    applies_to: "Route-day load; order deliver; stale-credit create"

  - priority: 11
    category: business_fiscal
    check: "Store credit cap: sum of PENDING_APPROVAL + APPROVED credit_cents for (store, route day) + new credit_cents <= store_credit_cap_cents (equality permitted)"
    error_id: ERR_STORE_CREDIT_CAP_EXCEEDED
    http_status: 402
    applies_to: "POST /dsd/stale-credits"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default time fixed at startup) ---
  - method: POST
    path: "/dsd/_clock/set_current_utc"
    description: "Advance the logical clock. Startup default is exactly 2026-09-01T00:00:00Z (never wall-clock). Advancing past a promo agreement's window_end expires SCHEDULED/ACTIVE agreements."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "PromoAgreements in SCHEDULED or ACTIVE with window_end <= new clock date -> EXPIRED"

  # --- RouteSalesRepresentative ---
  - method: POST
    path: "/dsd/reps"
    description: "Register a route sales representative"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, home_depot, "status?"]
    output: RouteSalesRepresentative
    side_effects: ["status = provided value or ACTIVE"]
  - method: GET
    path: "/dsd/reps/{repId}"
    description: "Get a rep"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: []
    output: RouteSalesRepresentative
    side_effects: []

  # --- Store ---
  - method: POST
    path: "/dsd/stores"
    description: "Create a store account with its service agreement terms"
    roles: [PlatformAdmin]
    code: 201
    input: [store_code, name, format, credit_policy, delivery_window_start_minute, delivery_window_end_minute, store_credit_cap_cents]
    output: Store
    side_effects: ["status = ACTIVE", "promo_rebate_balance_cents = 0"]
  - method: GET
    path: "/dsd/stores/{storeId}"
    description: "Get a store"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: []
    output: Store
    side_effects: []
  - method: POST
    path: "/dsd/stores/{storeId}/suspend"
    description: "Suspend a store (blocks new orders, credits, executions)"
    roles: [RouteSupervisor]
    code: 200
    input: []
    output: Store
    side_effects: ["status -> SUSPENDED", "increments Store.version by 1"]
  - method: POST
    path: "/dsd/stores/{storeId}/reactivate"
    description: "Reactivate a suspended store"
    roles: [RouteSupervisor]
    code: 200
    input: []
    output: Store
    side_effects: ["status -> ACTIVE", "increments Store.version by 1"]

  # --- Product ---
  - method: POST
    path: "/dsd/products"
    description: "Create a catalog product"
    roles: [PlatformAdmin]
    code: 201
    input: [sku, name, case_price_cents, shelf_life_days, "promo_eligible?"]
    output: Product
    side_effects: []
  - method: GET
    path: "/dsd/products/{productId}"
    description: "Get a product"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: []
    output: Product
    side_effects: []

  # --- Route ---
  - method: POST
    path: "/dsd/routes"
    description: "Create a route with its assigned rep and capacity parameters"
    roles: [RouteSupervisor]
    code: 201
    input: [territory_code, rsr_id, base_capacity_cases, truck_cap_cases]
    output: Route
    side_effects: ["status = ACTIVE", "performance_flag = CLEAR"]
  - method: GET
    path: "/dsd/routes/{routeId}"
    description: "Get a route"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: []
    output: Route
    side_effects: []
  - method: GET
    path: "/dsd/routes"
    description: "List routes (reverse-lookup of routes by rep)"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: ["rsr_id?", "limit?", "offset?"]
    output: "Route[]"
    side_effects: []
  - method: POST
    path: "/dsd/routes/{routeId}/suspend"
    description: "Suspend a route"
    roles: [RouteSupervisor]
    code: 200
    input: []
    output: Route
    side_effects: ["status -> SUSPENDED", "increments Route.version by 1"]
  - method: POST
    path: "/dsd/routes/{routeId}/reactivate"
    description: "Reactivate a suspended route"
    roles: [RouteSupervisor]
    code: 200
    input: []
    output: Route
    side_effects: ["status -> ACTIVE", "increments Route.version by 1"]

  # --- RouteStoreAssignment ---
  - method: POST
    path: "/dsd/route-assignments"
    description: "Assign a store to a route with a service-weekday schedule"
    roles: [RouteSupervisor]
    code: 201
    input: [route_id, store_id, service_weekdays, stop_sequence]
    output: RouteStoreAssignment
    side_effects:
      - "Rejects when another ACTIVE assignment for the same store intersects service_weekdays (ERR_ASSIGNMENT_DAY_CONFLICT)"
  - method: GET
    path: "/dsd/route-assignments/{assignmentId}"
    description: "Get an assignment"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: []
    output: RouteStoreAssignment
    side_effects: []
  - method: GET
    path: "/dsd/route-assignments"
    description: "List assignments filtered by route and/or store"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: ["route_id?", "store_id?", "limit?", "offset?"]
    output: "RouteStoreAssignment[]"
    side_effects: []
  - method: POST
    path: "/dsd/route-assignments/{assignmentId}/retire"
    description: "Retire an assignment"
    roles: [RouteSupervisor]
    code: 200
    input: []
    output: RouteStoreAssignment
    side_effects: ["status -> RETIRED"]

  # --- RouteDay ---
  - method: POST
    path: "/dsd/route-days"
    description: "Plan a route day for a service date"
    roles: [RouteSupervisor]
    code: 201
    input: [route_id, service_date, "is_event_day?", "event_surge_cases?"]
    output: RouteDay
    side_effects:
      - "capacity_cases computed per route_day_capacity"
      - "status = PLANNED"
      - "Requires an ACTIVE assignment of the route whose service_weekdays contains service_date's weekday (ERR_NO_SCHEDULED_STOP)"
  - method: GET
    path: "/dsd/route-days/{routeDayId}"
    description: "Get a route day"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: []
    output: RouteDay
    side_effects: []
  - method: GET
    path: "/dsd/route-days"
    description: "List route days filtered by route and/or status"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: ["route_id?", "status?", "limit?", "offset?"]
    output: "RouteDay[]"
    side_effects: []
  - method: POST
    path: "/dsd/route-days/{routeDayId}/load"
    description: "Load the truck: creates one TruckInventoryLot per payload lot (PLANNED -> LOADED)"
    roles: [RouteSalesRep]
    code: 200
    input: [lots]
    output: RouteDay
    side_effects:
      - "Creates TruckInventoryLot rows (SEALED); lot ids discoverable via GET /dsd/truck-lots?route_day_id="
      - "loaded_cases recomputed; increments RouteDay.version by 1"
  - method: POST
    path: "/dsd/route-days/{routeDayId}/start"
    description: "Start the route day (LOADED -> IN_PROGRESS; lots OPEN)"
    roles: [RouteSalesRep]
    code: 200
    input: []
    output: RouteDay
    side_effects: ["Lots SEALED -> OPEN", "increments RouteDay.version by 1"]
  - method: POST
    path: "/dsd/route-days/{routeDayId}/cancel"
    description: "Cancel a PLANNED or LOADED route day; returns all loaded cases to depot"
    roles: [RouteSupervisor]
    code: 200
    input: []
    output: RouteDay
    side_effects: ["Lots: returned_cases = loaded_cases, status -> CLOSED", "status -> CANCELLED"]

  # --- TruckInventoryLot ---
  - method: GET
    path: "/dsd/truck-lots/{lotId}"
    description: "Get a truck inventory lot"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: []
    output: TruckInventoryLot
    side_effects: []
  - method: GET
    path: "/dsd/truck-lots"
    description: "List lots filtered by route day, product, and/or lot_code"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: ["route_day_id?", "product_id?", "lot_code?", "limit?", "offset?"]
    output: "TruckInventoryLot[]"
    side_effects: []

  # --- StoreOrder / OrderLine ---
  - method: POST
    path: "/dsd/orders"
    description: "Handheld order entry: create a DRAFT order at a store"
    roles: [RouteSalesRep]
    code: 201
    input: [route_day_id, store_id, lines, "order_type?"]
    output: StoreOrder
    side_effects:
      - "status = DRAFT; per-line line_total_cents computed (per-line rounding then sum); gross_total_cents computed"
      - "Requires route day IN_PROGRESS, store ACTIVE, an ACTIVE assignment covering route+store+service weekday, every line product allocated on the day (an OPEN lot exists), EVENT_SURGE only on event days (ERR_VALIDATION)"
  - method: GET
    path: "/dsd/orders/{orderId}"
    description: "Get an order"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: []
    output: StoreOrder
    side_effects: []
  - method: GET
    path: "/dsd/orders"
    description: "List orders filtered by route day, store, and/or status"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: ["route_day_id?", "store_id?", "status?", "limit?", "offset?"]
    output: "StoreOrder[]"
    side_effects: []
  - method: PUT
    path: "/dsd/orders/{orderId}"
    description: "Revise a DRAFT order's lines wholesale (OCC on order version)"
    roles: [RouteSalesRep]
    code: 200
    input: [lines, expected_store_order_version]
    output: StoreOrder
    side_effects:
      - "OrderLines replaced; line totals and gross_total_cents recomputed; increments StoreOrder.version by 1"
  - method: POST
    path: "/dsd/orders/{orderId}/submit"
    description: "Submit a DRAFT order (delivery-window checked against the logical clock)"
    roles: [RouteSalesRep]
    code: 200
    input: []
    output: StoreOrder
    side_effects: ["status -> SUBMITTED", "submitted_at = logical clock", "increments StoreOrder.version by 1"]
  - method: POST
    path: "/dsd/orders/{orderId}/unsubmit"
    description: "Pull a SUBMITTED order back to DRAFT for revision"
    roles: [RouteSalesRep]
    code: 200
    input: []
    output: StoreOrder
    side_effects: ["status -> DRAFT", "increments StoreOrder.version by 1"]
  - method: POST
    path: "/dsd/orders/{orderId}/deliver"
    description: "Deliver a SUBMITTED order with actual quantities; FEFO lot consumption"
    roles: [RouteSalesRep]
    code: 200
    input: [lines]
    output: StoreOrder
    side_effects:
      - "status -> DELIVERED; qty_delivered_cases set per line (absent lines default 0); delivered_at set"
      - "FEFO consumption increments lot.delivered_cases (freshness-eligible lots only)"
      - "RouteDay.delivered_cases recomputed; OPEN settlement (if any) recomputed"
      - "increments StoreOrder.version by 1"
  - method: POST
    path: "/dsd/orders/{orderId}/cancel"
    description: "Cancel a DRAFT or SUBMITTED order"
    roles: [RouteSalesRep]
    code: 200
    input: []
    output: StoreOrder
    side_effects: ["status -> CANCELLED", "increments StoreOrder.version by 1"]
  - method: GET
    path: "/dsd/order-lines/{lineId}"
    description: "Get a single order line"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: GET
    path: "/dsd/order-lines"
    description: "List order lines filtered by order and/or product"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: ["order_id?", "product_id?", "limit?", "offset?"]
    output: "OrderLine[]"
    side_effects: []

  # --- ShelfExecution ---
  - method: POST
    path: "/dsd/shelf-executions"
    description: "Record rep-executed shelf stocking/rotation/display work"
    roles: [RouteSalesRep]
    code: 201
    input: [route_day_id, store_id, product_id, qty_placed_cases, rotated, display_built]
    output: ShelfExecution
    side_effects:
      - "status = RECORDED; created_by_user_id = acting rep"
      - "Requires route day IN_PROGRESS, store ACTIVE, product allocated on the day"
  - method: GET
    path: "/dsd/shelf-executions/{execId}"
    description: "Get a shelf execution"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: []
    output: ShelfExecution
    side_effects: []
  - method: GET
    path: "/dsd/shelf-executions"
    description: "List shelf executions filtered by store, route day, and/or product"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: ["store_id?", "route_day_id?", "product_id?", "limit?", "offset?"]
    output: "ShelfExecution[]"
    side_effects: []
  - method: POST
    path: "/dsd/shelf-executions/{execId}/verify"
    description: "Store manager verifies or rejects the shelf work"
    roles: [StoreManager]
    code: 200
    input: [outcome, "reject_reason?"]
    output: ShelfExecution
    side_effects: ["status -> VERIFIED or REJECTED", "verified_by_user_id = acting store manager"]

  # --- StaleCredit ---
  - method: POST
    path: "/dsd/stale-credits"
    description: "Pull stale product and request credit; FEFO lot selection among stale-eligible lots"
    roles: [RouteSalesRep, RouteSupervisor]
    code: 201
    input: [route_day_id, store_id, product_id, qty_cases]
    output: StaleCredit
    side_effects:
      - "status = PENDING_APPROVAL; lot_id pinned to FEFO-selected lot; credit_cents computed per store credit_policy; created_by_user_id recorded"
      - "No lot mutation until approval"
  - method: GET
    path: "/dsd/stale-credits/{creditId}"
    description: "Get a stale credit"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: []
    output: StaleCredit
    side_effects: []
  - method: GET
    path: "/dsd/stale-credits"
    description: "List stale credits filtered by store, route day, product, and/or status"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: ["store_id?", "route_day_id?", "product_id?", "lot_id?", "status?", "limit?", "offset?"]
    output: "StaleCredit[]"
    side_effects: []
  - method: POST
    path: "/dsd/stale-credits/{creditId}/approve"
    description: "Supervisor approves a pending credit (segregation of duties enforced)"
    roles: [RouteSupervisor]
    code: 200
    input: []
    output: StaleCredit
    side_effects:
      - "status -> APPROVED; lot.stale_pulled_cases += qty_cases"
      - "RouteDay stale totals recomputed; OPEN/BALANCED settlement recomputed (BALANCED auto-reopens to OPEN)"
  - method: POST
    path: "/dsd/stale-credits/{creditId}/reject"
    description: "Supervisor rejects a pending credit (segregation of duties enforced)"
    roles: [RouteSupervisor]
    code: 200
    input: [reject_reason]
    output: StaleCredit
    side_effects: ["status -> REJECTED; no lot or settlement effect"]
  - method: POST
    path: "/dsd/stale-credits/{creditId}/resubmit"
    description: "Resubmit a rejected credit for reconsideration"
    roles: [RouteSalesRep]
    code: 200
    input: []
    output: StaleCredit
    side_effects: ["status -> PENDING_APPROVAL; reject_reason and decided_by_user_id cleared"]

  # --- PromoAgreement ---
  - method: POST
    path: "/dsd/promo-agreements"
    description: "Create a promotional display agreement with a half-open execution window"
    roles: [RouteSupervisor]
    code: 201
    input: [store_id, product_id, window_start, window_end, display_type, rebate_cents]
    output: PromoAgreement
    side_effects:
      - "status = SCHEDULED"
      - "Rejects when another SCHEDULED/ACTIVE/COMPLETED agreement for the same store+product has window_start < new.window_end AND new.window_start < window_end (half-open overlap; adjacency permitted) (ERR_PROMO_WINDOW_OVERLAP)"
  - method: GET
    path: "/dsd/promo-agreements/{agreementId}"
    description: "Get a promo agreement"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: []
    output: PromoAgreement
    side_effects: []
  - method: GET
    path: "/dsd/promo-agreements"
    description: "List promo agreements filtered by store, product, and/or status"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: ["store_id?", "product_id?", "status?", "limit?", "offset?"]
    output: "PromoAgreement[]"
    side_effects: []
  - method: POST
    path: "/dsd/promo-agreements/{agreementId}/activate"
    description: "Activate an agreement when the logical clock is inside its window"
    roles: [RouteSupervisor]
    code: 200
    input: []
    output: PromoAgreement
    side_effects: ["status -> ACTIVE", "increments PromoAgreement.version by 1"]
  - method: POST
    path: "/dsd/promo-agreements/{agreementId}/breach"
    description: "Mark an ACTIVE agreement breached (retailer non-compliance)"
    roles: [RouteSupervisor]
    code: 200
    input: []
    output: PromoAgreement
    side_effects: ["status -> BREACHED", "increments PromoAgreement.version by 1"]

  # --- PromoExecution ---
  - method: POST
    path: "/dsd/promo-executions"
    description: "Submit display execution with compliance photo (OCC on agreement version)"
    roles: [RouteSalesRep]
    code: 201
    input: [agreement_id, route_day_id, photo_url, expected_promo_agreement_version]
    output: PromoExecution
    side_effects:
      - "status = SUBMITTED; built_by_user_id = acting rep"
      - "Requires agreement ACTIVE, route day IN_PROGRESS, no other SUBMITTED execution for the agreement (ERR_PENDING_EXECUTION_EXISTS)"
      - "increments PromoAgreement.version by 1"
  - method: GET
    path: "/dsd/promo-executions/{execId}"
    description: "Get a promo execution"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: []
    output: PromoExecution
    side_effects: []
  - method: GET
    path: "/dsd/promo-executions"
    description: "List promo executions filtered by agreement and/or route day"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: ["agreement_id?", "route_day_id?", "limit?", "offset?"]
    output: "PromoExecution[]"
    side_effects: []
  - method: POST
    path: "/dsd/promo-executions/{execId}/verify"
    description: "Verify compliant display: completes the agreement and posts the rebate to the store"
    roles: [StoreManager, RouteSupervisor]
    code: 200
    input: []
    output: PromoExecution
    side_effects:
      - "status -> VERIFIED"
      - "PromoAgreement ACTIVE -> COMPLETED"
      - "Store.promo_rebate_balance_cents += agreement.rebate_cents"
  - method: POST
    path: "/dsd/promo-executions/{execId}/reject"
    description: "Reject non-compliant display; agreement stays ACTIVE for resubmission"
    roles: [StoreManager, RouteSupervisor]
    code: 200
    input: [reject_reason]
    output: PromoExecution
    side_effects: ["status -> REJECTED"]

  # --- RouteSettlement ---
  - method: POST
    path: "/dsd/route-settlements"
    description: "Open day-end settlement for an IN_PROGRESS route day (one per day)"
    roles: [RouteSupervisor]
    code: 201
    input: [route_day_id]
    output: RouteSettlement
    side_effects:
      - "status = OPEN; gross/credits/forward/chronological/recon_delta computed at creation"
      - "Second settlement for the same route day rejected (ERR_SETTLEMENT_ALREADY_EXISTS)"
  - method: GET
    path: "/dsd/route-settlements/{settlementId}"
    description: "Get a settlement"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: []
    output: RouteSettlement
    side_effects: []
  - method: GET
    path: "/dsd/route-settlements"
    description: "List settlements filtered by route day"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: ["route_day_id?", "limit?", "offset?"]
    output: "RouteSettlement[]"
    side_effects: []
  - method: POST
    path: "/dsd/route-settlements/{settlementId}/balance"
    description: "Record collected cash; balances when |variance| <= 200 cents (otherwise remains OPEN)"
    roles: [RouteSupervisor]
    code: 200
    input: [cash_collected_cents]
    output: RouteSettlement
    side_effects: ["cash_collected_cents recorded; variance_cents recomputed; status -> BALANCED iff |variance| <= 200"]
  - method: POST
    path: "/dsd/route-settlements/{settlementId}/post"
    description: "Post a BALANCED settlement; settles the route day and closes its lots"
    roles: [RouteSupervisor]
    code: 200
    input: []
    output: RouteSettlement
    side_effects:
      - "status -> POSTED; posted_at = logical clock"
      - "RouteDay -> SETTLED; every OPEN lot: returned_cases = remaining_cases, -> CLOSED"
  - method: POST
    path: "/dsd/route-settlements/{settlementId}/dispute"
    description: "Route rep disputes an OPEN or BALANCED settlement"
    roles: [RouteSalesRep]
    code: 200
    input: []
    output: RouteSettlement
    side_effects: ["status -> DISPUTED"]
  - method: POST
    path: "/dsd/route-settlements/{settlementId}/resolve"
    description: "Supervisor resolves a dispute, returning the settlement to OPEN"
    roles: [RouteSupervisor]
    code: 200
    input: []
    output: RouteSettlement
    side_effects: ["status -> OPEN"]

  # --- ServiceLevelSnapshot (ops-run checkpoint) ---
  - method: POST
    path: "/dsd/routes/{routeId}/service-level-snapshots"
    description: "Compute the service-level/OOS checkpoint for a route over a half-open date window; updates Route.performance_flag"
    roles: [RouteSupervisor]
    code: 201
    input: [period_start, period_end]
    output: ServiceLevelSnapshot
    side_effects:
      - "Snapshot fields computed per service_level_measurement and route_performance_ratio"
      - "Route.performance_flag overwritten with performance_flag_result; increments Route.version by 1"
  - method: GET
    path: "/dsd/service-level-snapshots/{snapshotId}"
    description: "Get a snapshot"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: []
    output: ServiceLevelSnapshot
    side_effects: []
  - method: GET
    path: "/dsd/service-level-snapshots"
    description: "List snapshots filtered by route"
    roles: [PlatformAdmin, RouteSupervisor, RouteSalesRep, StoreManager]
    code: 200
    input: ["route_id?", "limit?", "offset?"]
    output: "ServiceLevelSnapshot[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed payload: missing required field, invalid enum, non-positive quantity, empty lines array, event_surge_cases > 0 on a non-event day, EVENT_SURGE order on a non-event day, end minute <= start minute" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for the endpoint" }
  - { id: ERR_REP_NOT_ASSIGNED, http: 403, condition: "Acting rep's X-User-ID does not equal the route's rsr_id for the route day being operated on" }
  - { id: ERR_STORE_SCOPE_VIOLATION, http: 403, condition: "StoreManager X-User-ID does not match the store that owns the resource being verified" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Stale-credit approver/rejecter is the same user who created the credit" }
  - { id: ERR_REP_NOT_FOUND, http: 404, condition: "RouteSalesRepresentative id does not exist" }
  - { id: ERR_STORE_NOT_FOUND, http: 404, condition: "Store id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id does not exist (path or lot/line/agreement body reference)" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "Route id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "RouteStoreAssignment id does not exist" }
  - { id: ERR_ROUTE_DAY_NOT_FOUND, http: 404, condition: "RouteDay id does not exist" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "TruckInventoryLot id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "StoreOrder id does not exist" }
  - { id: ERR_SHELF_EXECUTION_NOT_FOUND, http: 404, condition: "ShelfExecution id does not exist" }
  - { id: ERR_STALE_CREDIT_NOT_FOUND, http: 404, condition: "StaleCredit id does not exist" }
  - { id: ERR_PROMO_AGREEMENT_NOT_FOUND, http: 404, condition: "PromoAgreement id does not exist" }
  - { id: ERR_PROMO_EXECUTION_NOT_FOUND, http: 404, condition: "PromoExecution id does not exist" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "RouteSettlement id does not exist" }
  - { id: ERR_SNAPSHOT_NOT_FOUND, http: 404, condition: "ServiceLevelSnapshot id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic transition violation: from-state not permitted for the trigger, or terminal-state lockdown" }
  - { id: ERR_ROUTE_NOT_ACTIVE, http: 409, condition: "Route SUSPENDED: route-day creation, assignment creation, or load attempted" }
  - { id: ERR_STORE_NOT_ACTIVE, http: 409, condition: "Store SUSPENDED: order create/submit, stale-credit create, shelf-execution create, or promo-agreement create attempted" }
  - { id: ERR_ROUTE_DAY_NOT_IN_PROGRESS, http: 409, condition: "Operation requires the route day to be IN_PROGRESS (orders, deliveries, credits, shelf/promo executions, settlement creation, resubmission)" }
  - { id: ERR_ROUTE_DAY_NOT_LOADED, http: 409, condition: "Start attempted on a route day not in LOADED" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Promo execution or activation attempted while the agreement is not in the required window/state" }
  - { id: ERR_NO_SCHEDULED_STOP, http: 409, condition: "No ACTIVE assignment of the route covers the service_date's weekday" }
  - { id: ERR_DELIVERY_WINDOW_MISSED, http: 409, condition: "Logical-clock minute-of-day outside [delivery_window_start_minute, delivery_window_end_minute) at submit" }
  - { id: ERR_PROMO_WINDOW_OVERLAP, http: 409, condition: "New agreement's half-open window overlaps an existing SCHEDULED/ACTIVE/COMPLETED agreement for the same store+product" }
  - { id: ERR_ASSIGNMENT_DAY_CONFLICT, http: 409, condition: "Another ACTIVE assignment for the same store has a non-empty service_weekdays intersection" }
  - { id: ERR_SETTLEMENT_ALREADY_EXISTS, http: 409, condition: "A settlement already exists for the route day" }
  - { id: ERR_PENDING_EXECUTION_EXISTS, http: 409, condition: "A SUBMITTED PromoExecution already exists for the agreement" }
  - { id: ERR_UNRESOLVED_ORDERS, http: 409, condition: "Settlement post attempted while the route day has orders in SUBMITTED status" }
  - { id: ERR_NO_DELIVERED_ORDERS, http: 409, condition: "Snapshot window contains no DELIVERED orders for the route" }
  - { id: ERR_FRESHNESS_GUARANTEE_VIOLATION, http: 422, condition: "Delivery would consume a lot with days_to_expiry <= 5" }
  - { id: ERR_PRODUCT_NOT_ALLOCATED, http: 422, condition: "No lot for the product exists on the route day" }
  - { id: ERR_DELIVERY_LINE_NOT_ON_ORDER, http: 422, condition: "Deliver payload line references a product not present on the order" }
  - { id: ERR_INSUFFICIENT_TRUCK_STOCK, http: 422, condition: "Freshness-eligible (delivery) or stale-eligible (pull) remaining stock is less than requested qty" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "Sum of lot loaded_cases exceeds route-day capacity_cases" }
  - { id: ERR_PRODUCT_NOT_STALE_ELIGIBLE, http: 422, condition: "No lot of the product on the route day has days_to_expiry <= 5" }
  - { id: ERR_STORE_CREDIT_CAP_EXCEEDED, http: 402, condition: "Store's PENDING_APPROVAL + APPROVED credit total for the route day plus the new credit exceeds store_credit_cap_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Head-office catalog operator: reps, stores, products, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /dsd/_clock/set_current_utc"
      - "POST /dsd/reps"
      - "POST /dsd/stores"
      - "POST /dsd/products"
    shared_operations:
      - "All GET endpoints"

  - name: RouteSupervisor
    description: "District supervisor: owns route planning, assignments, credit adjudication, settlement posting, promo agreements, and service-level checkpoints"
    identity: opaque
    exclusive_operations:
      - "POST /dsd/routes, /suspend, /reactivate"
      - "POST /dsd/route-assignments (+ retire)"
      - "POST /dsd/route-days (+ cancel)"
      - "POST /dsd/stores/{id}/suspend, /reactivate"
      - "POST /dsd/stale-credits/{id}/approve, /reject"
      - "POST /dsd/route-settlements (+ balance, post, resolve)"
      - "POST /dsd/promo-agreements (+ activate, breach)"
      - "POST /dsd/routes/{id}/service-level-snapshots"
    shared_operations:
      - "POST /dsd/stale-credits (may originate a credit — but then cannot approve/reject it)"
      - "POST /dsd/promo-executions/{id}/verify, /reject"
      - "All GET endpoints"

  - name: RouteSalesRep
    description: "Route sales representative: drives the truck, loads inventory, enters orders, delivers, executes shelf/display work, pulls stales, disputes settlements"
    identity: "entity_backed:RouteSalesRepresentative"
    exclusive_operations:
      - "POST /dsd/route-days/{id}/load, /start"
      - "POST /dsd/orders (+ PUT, submit, unsubmit, deliver, cancel)"
      - "POST /dsd/shelf-executions"
      - "POST /dsd/stale-credits/{id}/resubmit"
      - "POST /dsd/promo-executions"
      - "POST /dsd/route-settlements/{id}/dispute"
    shared_operations:
      - "POST /dsd/stale-credits"
      - "All GET endpoints"

  - name: StoreManager
    description: "Store-side verifier: confirms shelf execution and promo display compliance for their own store only"
    identity: "entity_backed:Store"
    exclusive_operations:
      - "POST /dsd/shelf-executions/{id}/verify"
    shared_operations:
      - "POST /dsd/promo-executions/{id}/verify, /reject"
      - "All GET endpoints"
