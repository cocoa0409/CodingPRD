            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "spe@x.com", full_name: "S PE", postal_code: "30047" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/courier-zones", payload: { zone_code: "ZPE", window_capacity: 10 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "PE", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro_id}", zone_id: "${zone_id}", window_start: "2026-05-02T09:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { ap: $.data.id } }
          trigger:
            - { call: "POST /v1/pickup-appointments/${ap}/start", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert: ["err == ERR_PICKUP_TOO_EARLY (now 2026-05-01T00:00 < 2026-05-02T08:00)"]

      - name: error_label_expired_on_lazy_confirm
        claim_type: violation_to_error
        grounds: ["errors[ERR_LABEL_EXPIRED]", "validations[priority=10]"]
        distinguishing_aspect: "confirm-dropoff evaluates label expiry lazily at call time: past expires_at the call fails with ERR_LABEL_EXPIRED even before any sweep ran (label row still ISSUED)."
        test_recipe:
          setup: ["COUNTER_DROP order with label issued at default clock; clock advanced +11 days; NO sweep run; counter location OPERATIONAL"]
