              as: PlatformAdmin
            - call: "POST /api/pricebook/tasks"
              payload: { code: "HVAC-COIL", category: "HVAC", display_name: "Coil Clean", required_skill_code: "HVAC", estimated_hours: 1.0, flat_rate_cents: 100000, status: "PUBLISHED" }
              as: Dispatcher
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Ada", postal_code: "78701", window_start_utc: "2026-09-10T09:00:00Z", window_end_utc: "2026-09-10T11:00:00Z" }
              as: Dispatcher
              captures: { ap_id: $.data.id }
            - call: "POST /api/appointments/${ap_id}/lines"
              payload: { pricebook_task_code: "HVAC-COIL" }
              as: Dispatcher
            - call: "POST /api/dispatch/orders"
              payload: { appointment_id: "${ap_id}" }
              as: Dispatcher
            - call: "POST /api/appointments/${ap_id}/override-requests"
              payload: { requested_price_cents: 150000 }
              as: Technician
              captures: { or_id: $.data.id }
            - call: "GET /api/appointments/${ap_id}"
              payload: {}
              as: Manager
              captures: { ap_v: $.data.version }
          trigger:
            - call: "POST /api/override-requests/${or_id}/decide"
              payload: { decision: "APPROVE", expected_appointment_version: "${ap_v}" }
