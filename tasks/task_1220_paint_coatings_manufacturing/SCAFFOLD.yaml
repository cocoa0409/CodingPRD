# =============================================================================
# Task 1220: Paint & Coatings Manufacturing (Benjamin Moore style plant)
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  generate task hard than expert level! 1220. Paint & Coatings Manufacturing (Benjamin Moore style plant): tint base & colorant formula library, batch mill/dispersion cycle & viscosity adjust, color match approval & retain sample, VOC limit by category & state rule, can/pail filling & fill weight, shelf-life & freeze-damage credit, custom color minimum & rush, obsolete/return goods disposal

domain_name: paint-coatings-manufacturing
api_prefix: /coatings

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # VOC-by-state limits, retain samples, disposal manifests, segregation of duties
  secondary_archetype: workflow_orchestration # batch mill → dispersion → tint → QC → fill pipeline with rework loops
  complexity_layers:
    - optimistic_concurrency        # OCC on Formula.version for supersede-with-create
    - version_pinning_on_approval   # Batch pins formula version; ColorMatch pins target_delta_e snapshot
    - cascading_side_effects        # formula activation → batches ON_HOLD → orders BLOCKED (depth 3)
    - rate_threshold_triggers       # rush daily capacity, fill tolerance, credit bands
  entity_topology: flat             # peer entities with FK references; no nested URL ownership
  state_machine_shape: cyclic       # Batch QC-rework cycle + dispersion self-loop; SalesOrder branching fork/join
  relationship_patterns:
    - one_to_many                   # Formula → FormulaLine; Batch → BatchAdjustment / ColorMatch / Container
    - self_referential              # Formula.predecessor_formula_id (supersede chains)
    - cross_aggregate               # Batch → SalesOrder; CreditClaim → Customer × Container; DisposalRequest → Container[]/Batch[]
  role_model: segregation_of_duties # measurement vs approval; claim approval vs settlement
  consistency_model: immediate      # all side effects visible in the same request/response

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Dealer / account display name" }
      - { name: home_state_code, type: string, source: input, description: "Two-letter US state code of the dealer's home location" }
      - { name: annual_credit_cap_cents, type: integer, source: input, description: "Maximum total credit memo cents issuable to this customer per calendar year" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Open credit memo balance = sum(final_credit_cents over claims in SETTLED) - sum(final_credit_cents reversed by void)" }
      - { name: credit_used_ytd_cents, type: integer, source: computed, default: 0, description: "Sum of final_credit_cents over claims currently in SETTLED state (moves with settle/void)" }

  - name: TintBase
    parent: null
    common_fields: true
    fields:
      - { name: base_code, type: string, source: input, description: "Unique base product code (e.g. B-100)" , constraints: "unique across all TintBase rows" }
      - { name: product_category, type: enum, source: input, description: "FLAT | NONFLAT | PRIMER | INDUSTRIAL_MAINTENANCE | TRAFFIC_MARKING — VOC rule category key" }
      - { name: base_family, type: enum, source: input, description: "LATEX_INTERIOR | LATEX_EXTERIOR | ALKYD — mill washdown-buffer sharing key" }
      - { name: base_voc_gpl, type: number, source: input, description: "VOC contribution of the base itself, grams per liter of batch volume" }
      - { name: water_fraction_pct, type: number, source: input, description: "Percent of batch volume that is water (excluded from VOC denominator)", constraints: "0 <= x < 100" }
      - { name: density_kg_per_gal, type: number, source: input, description: "Finished-product density used for fill reconciliation" }
      - { name: base_cost_per_gal_cents, type: integer, source: input, description: "Raw material cost of base per gallon" }
      - { name: unit_price_per_gal_cents, type: integer, source: input, description: "Sale price per gallon for order lines using formulas on this base" }
      - { name: shelf_life_months, type: integer, source: input, description: "Shelf life in calendar months from container manufacture date" }
      - { name: grind_spec_um, type: number, source: input, description: "Maximum acceptable dispersion grind reading in microns" }

  - name: Colorant
    parent: null
    common_fields: true
    fields:
      - { name: colorant_code, type: string, source: input, description: "Unique colorant code (e.g. MAG-7)", constraints: "unique across all Colorant rows" }
      - { name: voc_g_per_unit, type: number, source: input, description: "VOC grams contributed per dispensed shot" }
      - { name: cost_per_shot_cents, type: integer, source: input, description: "Colorant cost per shot" }
      - { name: is_hazmat, type: boolean, source: input, description: "True if colorant is hazardous — forces HAZARDOUS disposal class for its batches" }

  - name: Formula
    parent: null
    common_fields: true
    fields:
      - { name: formula_code, type: string, source: input, description: "Formula code", constraints: "unique among formulas with status != DEPRECATED" }
      - { name: color_name, type: string, source: input, description: "Display color name" }
      - { name: tint_base_id, type: string, source: input, description: "FK -> TintBase.id; base this formula tints" }
      - { name: is_custom, type: boolean, source: input, description: "True for custom color-match formulas (drives minimums and setup fee)" }
      - { name: target_delta_e, type: number, source: input, description: "Maximum acceptable CIE dE2000 for color match approval" }
      - { name: min_batch_gallons, type: integer, source: computed, description: "= 50 when is_custom else 1; minimum planned_gallons for batches and per-line order minimum base" }
      - { name: formula_version_no, type: integer, source: system, default: 1, description: "Supersede chain ordinal; successor = predecessor.formula_version_no + 1" }
      - { name: predecessor_formula_id, type: string, source: system, description: "FK -> Formula.id; set when created via supersede; null otherwise", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | DEPRECATED" }
      - { name: activated_at, type: datetime, source: system, description: "Logical clock timestamp of activation; null until ACTIVE", constraints: "nullable" }

  - name: FormulaLine
    parent: null
    common_fields: false
    fields:
      - { name: formula_id, type: string, source: system, description: "FK -> Formula.id; owning formula" }
      - { name: colorant_id, type: string, source: input, description: "FK -> Colorant.id; colorant dispensed" }
      - { name: shots_per_gallon, type: number, source: input, description: "Colorant shots per finished gallon", constraints: "> 0" }
      - { name: sequence, type: integer, source: input, description: "Dispense order within the formula" }

  - name: VocRule
    parent: null
    common_fields: true
    fields:
      - { name: category, type: enum, source: input, description: "FLAT | NONFLAT | PRIMER | INDUSTRIAL_MAINTENANCE | TRAFFIC_MARKING" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code, or '*' for the national wildcard rule" }
      - { name: max_voc_gpl, type: number, source: input, description: "Maximum VOC grams per liter allowed by this rule" }
      - { name: effective_from, type: datetime, source: input, description: "Window start date (inclusive), ISO date" }
      - { name: effective_to, type: datetime, source: input, description: "Window end date (exclusive); null = open-ended", constraints: "nullable; must be > effective_from when present" }
      - { name: exempt_container_l, type: number, source: input, description: "Containers with size_liters <= this value are exempt from this rule; null = no exemption", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED" }

  - name: Mill
    parent: null
    common_fields: true
    fields:
      - { name: mill_code, type: string, source: input, description: "Unique mill identifier", constraints: "unique across all Mill rows" }
      - { name: capacity_gallons, type: integer, source: input, description: "Maximum batch size in gallons" }
      - { name: status, type: enum, source: system, description: "ACTIVE | MAINTENANCE" }
      - { name: reserved_minutes, type: integer, source: computed, default: 0, description: "Sum of mill_window minutes over batches in PLANNED | ON_HOLD | MILLING | TINTING | QC_PENDING | REWORK | QC_APPROVED | FILLING | DISPOSAL_PENDING on this mill; released at CANCELLED or DISPOSED" }

  - name: Batch
    parent: null
    common_fields: true
    fields:
      - { name: batch_code, type: string, source: system, description: "Server-minted human batch code (B-000001, monotonically increasing)" }
      - { name: formula_id, type: string, source: input, description: "FK -> Formula.id; formula being produced (repointed only by resume)" }
      - { name: pinned_formula_version_no, type: integer, source: system, description: "Formula.formula_version_no snapshot taken at batch creation (version pinning)" }
      - { name: product_category, type: enum, source: system, description: "Snapshot of tint base product_category at creation; VOC compliance key" }
      - { name: base_family, type: enum, source: system, description: "Snapshot of tint base base_family at creation; mill washdown-buffer key" }
      - { name: mill_id, type: string, source: input, description: "FK -> Mill.id; reserved mill" }
      - { name: order_id, type: string, source: input, description: "FK -> SalesOrder.id; order this batch serves; null for stock batches", constraints: "nullable" }
      - { name: planned_gallons, type: number, source: input, description: "Planned batch size in gallons" }
      - { name: actual_gallons, type: number, source: system, description: "Actual gallons after tinting; set by submit-qc", constraints: "nullable until first submit-qc" }
      - { name: mill_window_start, type: datetime, source: input, description: "Mill reservation window start (closed interval semantics)" }
      - { name: mill_window_end, type: datetime, source: input, description: "Mill reservation window end (must be > start)" }
      - { name: status, type: enum, source: system, description: "PLANNED | MILLING | TINTING | QC_PENDING | QC_APPROVED | FILLING | FILLED | CLOSED | REWORK | ON_HOLD | DISPOSAL_PENDING | DISPOSED | CANCELLED" }
      - { name: rework_count, type: integer, source: system, default: 0, description: "Number of QC rejections absorbed; MAX_REWORK = 2" }
      - { name: dispersion_cycles, type: integer, source: system, default: 0, description: "Number of failed dispersion checks (grind reading above spec)" }
      - { name: voc_actual_gpl, type: number, source: computed, description: "Computed VOC of the batch as tinted; null until first submit-qc", constraints: "nullable" }
      - { name: theoretical_cost_cents, type: integer, source: computed, description: "Provisional cost variant computed at creation from planned gallons and formula lines" }
      - { name: actual_cost_cents, type: integer, source: computed, description: "Final cost variant computed at complete-filling from actuals, adjustments, waste, rework fee", constraints: "nullable until complete-filling" }
      - { name: filled_net_kg, type: number, source: computed, default: 0, description: "Sum of net_weight_kg over non-REJECTED containers (per-container rounding then sum — pinned order)" }
      - { name: waste_gallons, type: number, source: system, description: "Declared process waste at complete-filling", constraints: "nullable until complete-filling" }
      - { name: closed_at, type: datetime, source: system, description: "Logical clock timestamp of closure", constraints: "nullable" }

  - name: BatchAdjustment
    parent: null
    common_fields: false
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> Batch.id; owning batch" }
      - { name: kind, type: enum, source: input, description: "THINNER | THICKENER | TINT_SHOT | EXEMPT_SOLVENT" }
      - { name: quantity, type: number, source: input, description: "mL for THINNER/THICKENER/EXEMPT_SOLVENT; shots for TINT_SHOT", constraints: "> 0" }
      - { name: colorant_id, type: string, source: input, description: "FK -> Colorant.id; required iff kind = TINT_SHOT, forbidden otherwise", constraints: "nullable" }
      - { name: voc_contribution_g, type: number, source: computed, description: "THINNER: quantity_ml * 0.9; TINT_SHOT: quantity * colorant.voc_g_per_unit; THICKENER/EXEMPT_SOLVENT: 0" }
      - { name: cycle_index, type: integer, source: system, description: "Batch.rework_count at the time the adjustment was recorded" }

  - name: ColorMatch
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: input, description: "FK -> Batch.id; batch under QC" }
      - { name: cycle_index, type: integer, source: system, description: "Batch.rework_count at measurement time; approvals only valid for the batch's current cycle" }
      - { name: measured_delta_e, type: number, source: input, description: "Measured CIE dE2000 vs standard" }
      - { name: threshold_delta_e, type: number, source: system, description: "Snapshot of formula.target_delta_e at measurement time (version pinning on approval)" }
      - { name: measured_by_user_id, type: string, source: system, description: "X-User-ID of the operator who entered the measurement" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the approver/rejecter", constraints: "nullable" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock timestamp of decision", constraints: "nullable" }
      - { name: retain_sample_id, type: string, source: system, description: "Server-minted retain sample id, set on approval", constraints: "nullable" }
      - { name: retain_until, type: datetime, source: computed, description: "decided_at + RETENTION_MONTHS[batch.product_category]; null until approval", constraints: "nullable" }
      - { name: retain_purged_at, type: datetime, source: system, description: "Set by daily sweep when logical clock passes retain_until", constraints: "nullable" }

  - name: Container
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> Batch.id; batch this can/pail was filled from" }
      - { name: size_code, type: enum, source: input, description: "QUART | GALLON | FIVE_GALLON" }
      - { name: nominal_fill_g, type: integer, source: system, description: "Nominal fill weight by size: QUART 1150, GALLON 4600, FIVE_GALLON 23000" }
      - { name: actual_fill_g, type: integer, source: input, description: "Scale reading in grams at fill (or reweigh)" }
      - { name: fill_variance_g, type: integer, source: computed, description: "= actual_fill_g - nominal_fill_g" }
      - { name: net_weight_kg, type: number, source: computed, description: "= round_half_up(actual_fill_g / 1000, 2)" }
      - { name: volume_gal, type: number, source: computed, description: "Nominal volume by size: QUART 0.25, GALLON 1.0, FIVE_GALLON 5.0" }
      - { name: size_liters, type: number, source: computed, description: "QUART 0.946, GALLON 3.785, FIVE_GALLON 18.927 — VOC exemption key" }
      - { name: status, type: enum, source: system, description: "IN_STOCK | QUARANTINED | REJECTED | SHIPPED | RETURNED | OBSOLETE | DISPOSAL_PENDING | DISPOSED" }
      - { name: order_id, type: string, source: system, description: "FK -> SalesOrder.id; set at ship; null while unshipped", constraints: "nullable" }
      - { name: destination_state_code, type: string, source: system, description: "Copied from order at ship; VOC rule resolution key", constraints: "nullable" }
      - { name: manufactured_at, type: datetime, source: system, description: "Logical clock timestamp at fill" }
      - { name: expiry_date, type: datetime, source: computed, description: "= manufactured_at + tint base shelf_life_months (calendar months)" }
      - { name: freeze_exposure_count, type: integer, source: system, default: 0, description: "Number of recorded freeze-exposure events" }
      - { name: shipped_at, type: datetime, source: system, description: "Logical clock timestamp of ship", constraints: "nullable" }
      - { name: disposal_request_id, type: string, source: system, description: "FK -> DisposalRequest.id; set while in a non-terminal disposal request", constraints: "nullable" }
      - { name: pre_disposal_status, type: enum, source: system, description: "Status before DISPOSAL_PENDING (OBSOLETE | RETURNED | REJECTED); restored on disposal cancel", constraints: "nullable" }

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; ordering dealer" }
      - { name: destination_state_code, type: string, source: input, description: "Two-letter ship-to state; VOC rule resolution key" }
      - { name: rush_flag, type: boolean, source: input, description: "True for rush service (fee + daily capacity + higher custom minimum)" }
      - { name: lines, type: array, source: input, description: "Order lines: [{ formula_id, gallons, size_code }]" }
      - { name: is_custom_order, type: boolean, source: computed, description: "True when any line's formula is_custom" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of per-line round_half_up(gallons * unit_price_per_gal_cents)" }
      - { name: setup_fee_cents, type: integer, source: computed, description: "7500 per custom-formula line" }
      - { name: rush_fee_cents, type: integer, source: computed, default: 0, description: "0 until rush approval; on approval: 12% of subtotal when subtotal >= 200000 else flat 15000" }
      - { name: total_cents, type: integer, source: computed, description: "= subtotal_cents + setup_fee_cents + rush_fee_cents" }
      - { name: status, type: enum, source: system, description: "PLACED | RUSH_REVIEW | SCHEDULED | IN_PRODUCTION | BLOCKED | FULFILLED | CANCELLED" }
      - { name: rush_approved_date, type: datetime, source: system, description: "UTC calendar date of rush approval; daily rush capacity key", constraints: "nullable" }

  - name: CreditClaim
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; claiming dealer" }
      - { name: container_id, type: string, source: input, description: "FK -> Container.id; claimed unit" }
      - { name: claim_type, type: enum, source: input, description: "FREEZE_DAMAGE | SHELF_LIFE_EXPIRY" }
      - { name: invoice_value_cents, type: integer, source: input, description: "Invoice value claimed", constraints: "> 0" }
      - { name: claimed_exposure_count, type: integer, source: input, default: 0, description: "Dealer-claimed freeze exposures; drives provisional credit only" }
      - { name: verified_exposure_count, type: integer, source: system, description: "Copied from container.freeze_exposure_count at review; drives final credit", constraints: "nullable until review" }
      - { name: remaining_days_at_claim, type: integer, source: computed, description: "container.expiry_date minus claim created_at, in whole days" }
      - { name: provisional_credit_cents, type: integer, source: computed, description: "Provisional variant at submission: band pct by remaining_days_at_claim, freeze penalty from claimed_exposure_count" }
      - { name: final_credit_cents, type: integer, source: computed, description: "Final variant at approval: same bands, penalty from verified_exposure_count", constraints: "nullable until approval" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "RegulatoryClerk X-User-ID at review", constraints: "nullable" }
      - { name: approved_by_user_id, type: string, source: system, description: "PlantManager X-User-ID at approval", constraints: "nullable" }
      - { name: settled_by_user_id, type: string, source: system, description: "PlantManager X-User-ID at settlement", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED | SETTLED | VOIDED" }

  - name: DisposalRequest
    parent: null
    common_fields: true
    fields:
      - { name: reason, type: enum, source: input, description: "OBSOLETE_STOCK | RETURNED_GOODS | BATCH_REJECT | DAMAGED_STOCK" }
      - { name: container_ids, type: array, source: input, description: "Array of Container.id values to destroy (cross-reference, may be empty when batch_ids given)" }
      - { name: batch_ids, type: array, source: input, description: "Array of Batch.id values in DISPOSAL_PENDING to destroy", constraints: "may be empty" }
      - { name: hazmat_class, type: enum, source: computed, description: "HAZARDOUS when any referenced container's batch has voc_actual_gpl > 250 or uses an is_hazmat colorant, else NON_HAZARDOUS" }
      - { name: manifest_no, type: string, source: system, description: "Hazmat manifest number recorded at manifest step", constraints: "nullable; unique among non-CANCELLED requests" }
      - { name: expected_destroyed_kg, type: number, source: computed, description: "Sum of net_weight_kg over referenced containers" }
      - { name: actual_destroyed_kg, type: number, source: system, description: "Scale-verified destroyed mass at completion", constraints: "nullable until complete" }
      - { name: gross_cost_cents, type: integer, source: computed, description: "rate_per_kg(hazmat_class) * expected_destroyed_kg + 45000 manifest fee; null until complete", constraints: "nullable" }
      - { name: recovery_credit_cents, type: integer, source: computed, description: "300 per FIVE_GALLON metal pail, capped at 20% of gross_cost_cents", constraints: "nullable" }
      - { name: net_cost_cents, type: integer, source: computed, description: "= gross_cost_cents - recovery_credit_cents", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "REQUESTED | MANIFESTED | DISPOSED | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Formula
    initial_state: DRAFT
    terminal_states: [DEPRECATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /coatings/formulas/{id}/activate"
        actor: LabTechnician
        preconditions:
          - "formula has at least one FormulaLine"
          - "every line's colorant exists"
          - "no other non-DEPRECATED formula has the same formula_code"
        side_effects:
          - "activated_at = current logical clock"
          - "if predecessor_formula_id is not null and predecessor.status == ACTIVE: predecessor -> DEPRECATED (cascade link 1)"
          - "predecessor deprecation cascades: every Batch with formula_id == predecessor.id and status == PLANNED -> ON_HOLD (cascade link 2)"
          - "each such ON_HOLD batch's order (batch.order_id, status SCHEDULED) -> BLOCKED (cascade link 3)"
      - from: ACTIVE
        to: DEPRECATED
        trigger: "POST /coatings/formulas/{id}/deprecate"
        actor: LabTechnician
        preconditions: []
        side_effects:
          - "every Batch with formula_id == this.id and status == PLANNED -> ON_HOLD"
          - "each such ON_HOLD batch's order (status SCHEDULED) -> BLOCKED"
      - from: DRAFT
        to: DEPRECATED
        trigger: "POST /coatings/formulas/{id}/deprecate"
        actor: LabTechnician
        preconditions: []
        side_effects: []
        note: "Abandon a draft; no batch can reference a DRAFT formula so no cascade"

  - entity: VocRule
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /coatings/voc-rules/{id}/activate"
        actor: RegulatoryClerk
        preconditions:
          - "effective_to is null or effective_to > effective_from (else ERR_INVALID_REQUEST)"
          - "no ACTIVE rule with same (category, state_code) whose half-open window [effective_from, effective_to) intersects this window (ERR_VOC_RULE_OVERLAP); adjacency (one.effective_to == other.effective_from) is allowed"
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /coatings/voc-rules/{id}/retire"
        actor: RegulatoryClerk
        preconditions: []
        side_effects: ["rule immediately excluded from VOC compliance resolution"]
      - from: DRAFT
        to: RETIRED
        trigger: "POST /coatings/voc-rules/{id}/retire"
        actor: RegulatoryClerk
        preconditions: []
        side_effects: []

  - entity: Mill
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: MAINTENANCE
        trigger: "POST /coatings/mills/{id}/enter-maintenance"
        actor: PlantManager
        preconditions:
          - "no batch on this mill in MILLING | TINTING | QC_PENDING | REWORK | QC_APPROVED | FILLING (ERR_MILL_BUSY)"
        side_effects: []
      - from: MAINTENANCE
        to: ACTIVE
        trigger: "POST /coatings/mills/{id}/return-to-service"
        actor: PlantManager
        preconditions: []
        side_effects: []

  - entity: Batch
    initial_state: PLANNED
    terminal_states: [CLOSED, DISPOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: MILLING
        trigger: "POST /coatings/batches/{id}/start-mill"
        actor: ProductionOperator
        preconditions:
          - "formula.status == ACTIVE (ERR_FORMULA_NOT_ACTIVE)"
          - "mill.status == ACTIVE (ERR_MILL_NOT_AVAILABLE)"
          - "if order_id set: order.status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "if order_id set: order SCHEDULED -> IN_PRODUCTION"
      - from: MILLING
        to: MILLING
        trigger: "POST /coatings/batches/{id}/dispersion-check with grind_reading > base.grind_spec_um"
        actor: ProductionOperator
        preconditions: []
        side_effects: ["dispersion_cycles += 1"]
        note: "Self-loop: milling continues until grind spec is met"
      - from: MILLING
        to: TINTING
        trigger: "POST /coatings/batches/{id}/dispersion-check with grind_reading <= base.grind_spec_um"
        actor: ProductionOperator
        preconditions: []
        side_effects: []
      - from: TINTING
        to: QC_PENDING
        trigger: "POST /coatings/batches/{id}/submit-qc"
        actor: ProductionOperator
        preconditions: []
        side_effects:
          - "actual_gallons = input actual_gallons (re-set on each submit-qc)"
          - "recompute voc_actual_gpl (calculation voc_actual_gpl)"
      - from: QC_PENDING
        to: QC_APPROVED
        trigger: "system (automatic when a ColorMatch for the current cycle_index is APPROVED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QC_PENDING
        to: REWORK
        trigger: "system (automatic when a ColorMatch for the current cycle_index is REJECTED and rework_count < MAX_REWORK=2)"
        actor: system
        preconditions: []
        side_effects:
          - "rework_count += 1"
          - "if order_id set and order.status == IN_PRODUCTION: order -> BLOCKED (cascade link 2)"
      - from: QC_PENDING
        to: DISPOSAL_PENDING
        trigger: "system (automatic when a ColorMatch for the current cycle_index is REJECTED and rework_count == MAX_REWORK=2)"
        actor: system
        preconditions: []
        side_effects:
          - "if order_id set and order.status == IN_PRODUCTION: order -> BLOCKED"
        note: "Third rejection condemns the batch — conditional cascade on entity state"
      - from: REWORK
        to: MILLING
        trigger: "POST /coatings/batches/{id}/rework"
        actor: ProductionOperator
        preconditions: ["mill.status == ACTIVE (ERR_MILL_NOT_AVAILABLE)"]
        side_effects:
          - "if order_id set and order.status == BLOCKED: order -> IN_PRODUCTION"
      - from: QC_APPROVED
        to: FILLING
        trigger: "system (automatic on first accepted POST /coatings/batches/{id}/fills)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FILLING
        to: FILLED
        trigger: "POST /coatings/batches/{id}/complete-filling"
        actor: ProductionOperator
        preconditions: ["fill_reconciliation passes within 0.5% (ERR_FILL_RECONCILIATION_FAILED)"]
        side_effects:
          - "waste_gallons recorded"
          - "compute actual_cost_cents (calculation batch_cost, final variant)"
      - from: FILLED
        to: CLOSED
        trigger: "POST /coatings/batches/{id}/close"
        actor: ProductionOperator
        preconditions:
          - "no container of this batch in QUARANTINED (ERR_INVALID_STATE)"
          - "an APPROVED ColorMatch for the final cycle exists with retain_purged_at == null (ERR_RETAIN_SAMPLE_MISSING)"
        side_effects: ["closed_at = current logical clock"]
      - from: PLANNED
        to: ON_HOLD
        trigger: "system (automatic when batch's formula is DEPRECATED — via successor activation or manual deprecate)"
        actor: system
        preconditions: []
        side_effects: ["if order_id set and order.status == SCHEDULED: order -> BLOCKED"]
      - from: ON_HOLD
        to: PLANNED
        trigger: "POST /coatings/batches/{id}/resume"
        actor: ProductionOperator
        preconditions: ["new_formula_id references an ACTIVE formula (ERR_FORMULA_NOT_ACTIVE)"]
        side_effects:
          - "formula_id = new_formula_id; pinned_formula_version_no re-snapshotted"
          - "if order_id set and order.status == BLOCKED: order -> SCHEDULED"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /coatings/batches/{id}/cancel"
        actor: ProductionOperator
        preconditions: []
        side_effects: ["mill reservation released (mill.reserved_minutes -= window minutes)"]
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /coatings/batches/{id}/cancel"
        actor: ProductionOperator
        preconditions: []
        side_effects: ["mill reservation released"]
      - from: MILLING
        to: DISPOSAL_PENDING
        trigger: "POST /coatings/batches/{id}/dispose"
        actor: ProductionOperator
        preconditions: []
        side_effects: ["if order_id set and order.status == IN_PRODUCTION: order -> BLOCKED"]
      - from: TINTING
        to: DISPOSAL_PENDING
        trigger: "POST /coatings/batches/{id}/dispose"
        actor: ProductionOperator
        preconditions: []
        side_effects: ["if order_id set and order.status == IN_PRODUCTION: order -> BLOCKED"]
      - from: QC_PENDING
        to: DISPOSAL_PENDING
        trigger: "POST /coatings/batches/{id}/dispose"
        actor: ProductionOperator
        preconditions: []
        side_effects: ["if order_id set and order.status == IN_PRODUCTION: order -> BLOCKED"]
      - from: REWORK
        to: DISPOSAL_PENDING
        trigger: "POST /coatings/batches/{id}/dispose"
        actor: ProductionOperator
        preconditions: []
        side_effects: ["if order_id set and order.status == BLOCKED: stays BLOCKED"]
      - from: QC_APPROVED
        to: DISPOSAL_PENDING
        trigger: "POST /coatings/batches/{id}/dispose"
        actor: ProductionOperator
        preconditions: []
        side_effects: []
      - from: DISPOSAL_PENDING
        to: DISPOSED
        trigger: "system (automatic when a DisposalRequest referencing this batch completes)"
        actor: system
        preconditions: []
        side_effects: ["mill reservation released"]

  - entity: ColorMatch
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /coatings/color-matches/{id}/approve"
        actor: QCInspector
        preconditions:
          - "batch.status == QC_PENDING (ERR_INVALID_STATE)"
          - "cycle_index == batch.rework_count (stale-cycle measurement, ERR_INVALID_STATE)"
          - "measured_delta_e <= threshold_delta_e (ERR_DELTA_E_EXCEEDED)"
          - "X-User-ID != measured_by_user_id (segregation of duties, ERR_SEGREGATION_OF_DUTY)"
        side_effects:
          - "decided_by_user_id, decided_at set"
          - "retain_sample_id minted; retain_until = decided_at + RETENTION_MONTHS[batch.product_category]"
          - "batch QC_PENDING -> QC_APPROVED (cascade link 1 of fill-gating)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /coatings/color-matches/{id}/reject"
        actor: QCInspector
        preconditions:
          - "batch.status == QC_PENDING (ERR_INVALID_STATE)"
          - "cycle_index == batch.rework_count (ERR_INVALID_STATE)"
          - "X-User-ID != measured_by_user_id (ERR_SEGREGATION_OF_DUTY)"
        side_effects:
          - "batch QC_PENDING -> REWORK with rework_count += 1 when rework_count < 2 (cascade link 1), else batch -> DISPOSAL_PENDING"
          - "order BLOCKED cascade per Batch machine (cascade link 2)"

  - entity: Container
    initial_state: IN_STOCK
    terminal_states: [DISPOSED]
    transitions:
      - from: IN_STOCK
        to: QUARANTINED
        trigger: "never (a container is born QUARANTINED when its fill fails fill_weigh_check)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Creation-time branch: weigh pass -> IN_STOCK, weigh fail -> QUARANTINED"
      - from: QUARANTINED
        to: IN_STOCK
        trigger: "POST /coatings/containers/{id}/reweigh with new actual_fill_g passing fill_weigh_check"
        actor: QCInspector
        preconditions: []
        side_effects: ["actual_fill_g, fill_variance_g, net_weight_kg recomputed; batch.filled_net_kg reconciled"]
      - from: QUARANTINED
        to: REJECTED
        trigger: "POST /coatings/containers/{id}/reweigh with mark_rejected = true"
        actor: QCInspector
        preconditions: []
        side_effects: ["batch.filled_net_kg reconciled (rejected containers excluded)"]
      - from: IN_STOCK
        to: SHIPPED
        trigger: "POST /coatings/containers/{id}/ship"
        actor: ProductionOperator
        preconditions:
          - "order exists; order.status in {PLACED, SCHEDULED, IN_PRODUCTION} (ERR_INVALID_STATE)"
          - "VOC compliance resolvable and passing for (batch.product_category, order.destination_state_code, ship date, container size) (ERR_VOC_RULE_MISSING / ERR_VOC_LIMIT_EXCEEDED)"
        side_effects:
          - "order_id, destination_state_code, shipped_at set"
          - "if sum(volume_gal over SHIPPED containers with order_id == order.id) >= sum(order line gallons): order -> FULFILLED (bubble-up)"
      - from: SHIPPED
        to: RETURNED
        trigger: "POST /coatings/containers/{id}/customer-return"
        actor: ProductionOperator
        preconditions: []
        side_effects: []
      - from: IN_STOCK
        to: OBSOLETE
        trigger: "system (daily sweep when logical clock >= expiry_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OBSOLETE
        to: DISPOSAL_PENDING
        trigger: "system (when referenced by a DisposalRequest at creation)"
        actor: system
        preconditions: []
        side_effects: ["pre_disposal_status = OBSOLETE; disposal_request_id set"]
      - from: RETURNED
        to: DISPOSAL_PENDING
        trigger: "system (when referenced by a DisposalRequest at creation)"
        actor: system
        preconditions: []
        side_effects: ["pre_disposal_status = RETURNED; disposal_request_id set"]
      - from: REJECTED
        to: DISPOSAL_PENDING
        trigger: "system (when referenced by a DisposalRequest at creation)"
        actor: system
        preconditions: []
        side_effects: ["pre_disposal_status = REJECTED; disposal_request_id set"]
      - from: DISPOSAL_PENDING
        to: DISPOSED
        trigger: "system (when the DisposalRequest completes)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPOSAL_PENDING
        to: OBSOLETE
        trigger: "system (when the DisposalRequest is cancelled; restores pre_disposal_status)"
        actor: system
        preconditions: []
        side_effects: ["disposal_request_id = null; pre_disposal_status = null"]
      - from: DISPOSAL_PENDING
        to: RETURNED
        trigger: "system (disposal cancel restore)"
        actor: system
        preconditions: []
        side_effects: ["disposal_request_id = null; pre_disposal_status = null"]
      - from: DISPOSAL_PENDING
        to: REJECTED
        trigger: "system (disposal cancel restore)"
        actor: system
        preconditions: []
        side_effects: ["disposal_request_id = null; pre_disposal_status = null"]

  - entity: SalesOrder
    initial_state: PLACED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: PLACED
        to: RUSH_REVIEW
        trigger: "creation-time branch: POST /coatings/orders with rush_flag = true creates the order directly in RUSH_REVIEW"
        actor: Dealer
        preconditions: []
        side_effects: []
        note: "Fork: rush orders enter RUSH_REVIEW; standard orders stay PLACED"
      - from: RUSH_REVIEW
        to: PLACED
        trigger: "POST /coatings/orders/{id}/rush-approve"
        actor: PlantManager
        preconditions:
          - "fewer than RUSH_DAILY_LIMIT=3 rush approvals already granted on the current UTC date (ERR_RUSH_CAPACITY_EXCEEDED)"
        side_effects:
          - "rush_fee_cents computed (order_pricing); total_cents recomputed"
          - "rush_approved_date = current UTC date; daily rush counter incremented"
      - from: RUSH_REVIEW
        to: PLACED
        trigger: "POST /coatings/orders/{id}/rush-reject"
        actor: PlantManager
        preconditions: []
        side_effects: ["rush_flag = false; rush_fee_cents stays 0; total_cents unchanged"]
        note: "Revert branch: order continues as standard — divergent side effects vs approve"
      - from: PLACED
        to: SCHEDULED
        trigger: "POST /coatings/orders/{id}/schedule"
        actor: ProductionOperator
        preconditions:
          - "batch_id references a batch with batch.order_id == order.id (ERR_ORDER_BATCH_MISMATCH)"
          - "batch.status == PLANNED (ERR_INVALID_STATE)"
        side_effects: []
      - from: SCHEDULED
        to: IN_PRODUCTION
        trigger: "system (when the scheduled batch enters MILLING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: BLOCKED
        trigger: "system (when the scheduled batch enters ON_HOLD)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PRODUCTION
        to: BLOCKED
        trigger: "system (when the batch enters REWORK or DISPOSAL_PENDING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BLOCKED
        to: SCHEDULED
        trigger: "system (when the batch resumes to PLANNED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BLOCKED
        to: IN_PRODUCTION
        trigger: "system (when the batch re-enters MILLING via rework)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PRODUCTION
        to: FULFILLED
        trigger: "system (when cumulative shipped volume covers all order line gallons — checked on each ship)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLACED
        to: FULFILLED
        trigger: "system (stock-only fulfillment: shipped volume covers all lines while no batch scheduled)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLACED
        to: CANCELLED
        trigger: "POST /coatings/orders/{id}/cancel"
        actor: "Dealer (own orders only) or PlantManager"
        preconditions: []
        side_effects: []
      - from: RUSH_REVIEW
        to: CANCELLED
        trigger: "POST /coatings/orders/{id}/cancel"
        actor: "Dealer (own orders only) or PlantManager"
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /coatings/orders/{id}/cancel"
        actor: "Dealer (own orders only) or PlantManager"
        preconditions: []
        side_effects: []
      - from: BLOCKED
        to: CANCELLED
        trigger: "POST /coatings/orders/{id}/cancel"
        actor: "Dealer (own orders only) or PlantManager"
        preconditions: []
        side_effects: []
      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "forbidden — product is being made (ERR_INVALID_STATE)"
        actor: any
        preconditions: []
        side_effects: []

  - entity: CreditClaim
    initial_state: SUBMITTED
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /coatings/credit-claims/{id}/review"
        actor: RegulatoryClerk
        preconditions: []
        side_effects:
          - "verified_exposure_count = container.freeze_exposure_count"
          - "reviewed_by_user_id set"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /coatings/credit-claims/{id}/approve"
        actor: PlantManager
        preconditions:
          - "final_credit_cents <= customer.annual_credit_cap_cents - customer.credit_used_ytd_cents (ERR_CREDIT_CAP_EXCEEDED)"
        side_effects:
          - "final_credit_cents computed (freeze_credit_calc, final variant)"
          - "approved_by_user_id set"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /coatings/credit-claims/{id}/reject"
        actor: PlantManager
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /coatings/credit-claims/{id}/reject"
        actor: PlantManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SETTLED
        trigger: "POST /coatings/credit-claims/{id}/settle"
        actor: PlantManager
        preconditions:
          - "X-User-ID != approved_by_user_id (segregation of duties, ERR_SEGREGATION_OF_DUTY)"
        side_effects:
          - "customer.credit_balance_cents += final_credit_cents"
          - "customer.credit_used_ytd_cents += final_credit_cents"
          - "settled_by_user_id set"
      - from: SETTLED
        to: VOIDED
        trigger: "POST /coatings/credit-claims/{id}/void"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "customer.credit_balance_cents -= final_credit_cents (compensating reversal)"
          - "customer.credit_used_ytd_cents -= final_credit_cents"

  - entity: DisposalRequest
    initial_state: REQUESTED
    terminal_states: [DISPOSED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: MANIFESTED
        trigger: "POST /coatings/disposal-requests/{id}/manifest"
        actor: RegulatoryClerk
        preconditions: ["manifest_no unique among non-CANCELLED requests (ERR_DUPLICATE_CODE)"]
        side_effects: ["manifest_no recorded"]
      - from: MANIFESTED
        to: DISPOSED
        trigger: "POST /coatings/disposal-requests/{id}/complete"
        actor: PlantManager
        preconditions:
          - "quantity gate: expected_destroyed_kg == 0 requires actual_destroyed_kg == 0; else abs(actual - expected) / expected <= 2% (ERR_DISPOSAL_QUANTITY_MISMATCH)"
        side_effects:
          - "every referenced container -> DISPOSED"
          - "every referenced batch -> DISPOSED (mill reservation released)"
          - "gross_cost_cents, recovery_credit_cents, net_cost_cents computed (disposal_cost)"
      - from: REQUESTED
        to: DISPOSED
        trigger: "POST /coatings/disposal-requests/{id}/complete (NON_HAZARDOUS shortcut)"
        actor: PlantManager
        preconditions:
          - "hazmat_class == NON_HAZARDOUS (HAZARDOUS requests must pass through MANIFESTED first, ERR_INVALID_STATE)"
          - "quantity gate as above (ERR_DISPOSAL_QUANTITY_MISMATCH)"
        side_effects:
          - "every referenced container -> DISPOSED"
          - "every referenced batch -> DISPOSED"
          - "cost fields computed"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /coatings/disposal-requests/{id}/cancel"
        actor: RegulatoryClerk
        preconditions: []
        side_effects: ["every referenced container restores pre_disposal_status; disposal_request_id cleared"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: formula-supersede-stale-version
    parent_entity: Formula
    write_endpoint: "POST /coatings/formulas/{id}/supersede"
    occ_field: expected_formula_version
    description: |
      Superseding an ACTIVE formula creates a DRAFT successor while the
      predecessor stays ACTIVE (it is deprecated only when a successor
      activates). A supersede request carrying an expected_formula_version
      that no longer matches the predecessor's current version is rejected:
      the caller's view of the formula predates a mutation it has not seen
      (for example an already-created successor that advanced the version).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: voc_actual_gpl
    trigger: "POST /coatings/batches/{id}/submit-qc (recomputed on every submission)"
    algorithm: aggregation
    formula: |
      batch_L       = actual_gallons * 3.78541
      water_L       = batch_L * tint_base.water_fraction_pct / 100
      exempt_L      = sum(quantity / 1000 for adjustments with kind == EXEMPT_SOLVENT)
      colorant_voc  = sum over formula lines: shots_per_gallon * actual_gallons * colorant.voc_g_per_unit
                    + sum over adjustments kind == TINT_SHOT: quantity * colorant.voc_g_per_unit
      thinner_voc   = sum(quantity * 0.9 for adjustments with kind == THINNER)
      voc_mass_g    = tint_base.base_voc_gpl * batch_L + colorant_voc + thinner_voc
      denominator_L = batch_L - water_L - exempt_L
      voc_actual_gpl = round_half_up(voc_mass_g / denominator_L, 2)
    input_set: "The batch's tint base (via formula), all formula lines, all BatchAdjustment rows of the batch (any cycle_index — adjustments persist across rework)"
    constants:
      GAL_TO_L: 3.78541
      THINNER_VOC_G_PER_ML: 0.9
    precision: "2 decimal places, round_half_up"

  - name: voc_compliance_resolution
    trigger: "POST /coatings/containers/{id}/ship"
    algorithm: threshold
    formula: |
      eligible = VocRule rows with status == ACTIVE,
                 category == batch.product_category,
                 state_code IN {order.destination_state_code, "*"},
                 effective_from <= ship_date AND (effective_to IS NULL OR ship_date < effective_to)
      drop from eligible any rule where exempt_container_l IS NOT NULL AND container.size_liters <= rule.exempt_container_l
      if the unfiltered eligible set is empty: reject ERR_VOC_RULE_MISSING
      if the filtered set is empty (all eligible rules exempt this size): compliant
      limit = min(max_voc_gpl over filtered eligible set)
      compliant iff batch.voc_actual_gpl <= limit  (equality passes)
    input_set: "ACTIVE VocRule rows only (DRAFT and RETIRED excluded); ship_date = logical clock date at ship"
    constants: {}
    precision: "comparison on the 2-decimal voc_actual_gpl"
    variants: []

  - name: order_pricing
    trigger: "POST /coatings/orders (create); rush fee recomputed at rush-approve; rush-reject clears the flag without a fee"
    algorithm: tiered_pricing
    formula: |
      PINNED EVALUATION ORDER (circular-looking dependency broken explicitly):
      (1) per line: line_amount_cents = round_half_up(gallons * formula.tint_base.unit_price_per_gal_cents, 0)
      (2) subtotal_cents = sum(line_amount_cents)
      (3) setup_fee_cents  = 7500 * count(lines where formula.is_custom)
      (4) rush fee tier keyed on the PRE-FEE subtotal only:
          at create: rush_fee_cents = 0
          at rush-approve: rush_fee_cents = round_half_up(0.12 * subtotal_cents, 0) when subtotal_cents >= 200000
                                           else 15000
      (5) total_cents = subtotal_cents + setup_fee_cents + rush_fee_cents
      The rush tier must never be keyed on total_cents (which contains the fee itself).
      Custom minimum (validated, not priced): each custom line gallons >= 50,
      or >= 100 when rush_flag is true (ERR_CUSTOM_MINIMUM_NOT_MET).
    input_set: "Order lines with their formulas and tint bases"
    constants:
      CUSTOM_SETUP_FEE_CENTS: 7500
      RUSH_PCT: 0.12
      RUSH_PCT_THRESHOLD_CENTS: 200000
      RUSH_FLAT_CENTS: 15000
      CUSTOM_MIN_GALLONS: 50
      CUSTOM_MIN_GALLONS_RUSH: 100
    precision: "integer cents, round_half_up per line before summation"

  - name: fill_weigh_check
    trigger: "POST /coatings/batches/{id}/fills and POST /coatings/containers/{id}/reweigh"
    algorithm: threshold
    formula: |
      tolerance_g = max(round_half_up(nominal_fill_g * 0.015, 0), 10)
      pass iff abs(actual_fill_g - nominal_fill_g) <= tolerance_g   (equality passes)
      fail at fill  -> container born QUARANTINED
      fail at reweigh (mark_rejected absent/false) -> stays QUARANTINED
    input_set: "The single container being weighed"
    constants:
      NOMINAL_QUART_G: 1150
      NOMINAL_GALLON_G: 4600
      NOMINAL_FIVE_GALLON_G: 23000
      TOLERANCE_PCT: 0.015
      TOLERANCE_FLOOR_G: 10
    precision: "integer grams"

  - name: fill_reconciliation
    trigger: "POST /coatings/batches/{id}/complete-filling"
    algorithm: aggregation
    formula: |
      PINNED ROUNDING ORDER: round each container FIRST, then sum.
      per-container net_weight_kg = round_half_up(actual_fill_g / 1000, 2)
      filled_kg  = sum(net_weight_kg over containers with status != REJECTED)
      drawdown_kg = (actual_gallons - waste_gallons) * tint_base.density_kg_per_gal
      pass iff abs(filled_kg - drawdown_kg) / drawdown_kg * 100 <= 0.5  (else ERR_FILL_RECONCILIATION_FAILED)
      batch.filled_net_kg = filled_kg  (persisted with the per-container-first rounding)
      (Sum-then-round of raw grams is the WRONG order and yields different hundredths;
       e.g. 3 x 4605 g -> 4.61 + 4.61 + 4.61 = 13.83 kg, not round(13.815) = 13.82 kg.)
    input_set: "All containers of the batch with status != REJECTED (QUARANTINED included — their mass left the tank)"
    constants:
      RECON_TOLERANCE_PCT: 0.5
    precision: "kg at 2 decimals per container, round_half_up; ratio compared at full precision"

  - name: batch_cost
    trigger: "provisional at POST /coatings/batches; final at POST /coatings/batches/{id}/complete-filling"
    algorithm: aggregation
    formula: |
      provisional (theoretical_cost_cents):
        planned_gallons * (base.base_cost_per_gal_cents
                           + sum over formula lines: shots_per_gallon * colorant.cost_per_shot_cents)
      final (actual_cost_cents):
        actual_gallons * base.base_cost_per_gal_cents
        + (sum over lines: shots_per_gallon * actual_gallons * cost_per_shot_cents)
        + (sum over TINT_SHOT adjustments: quantity * cost_per_shot_cents)
        + round_half_up(waste_gallons * base.base_cost_per_gal_cents * WASTE_RECOVERY, 0)
        + rework_count * REWORK_FEE_CENTS
    input_set: "Batch, its formula + lines + tint base, all BatchAdjustment rows"
    constants:
      WASTE_RECOVERY: 0.5
      REWORK_FEE_CENTS: 25000
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "computed at batch creation, stored as theoretical_cost_cents"
        difference: "uses planned_gallons and nominal formula shots only; no adjustments, waste, or rework fee"
      - name: final
        when: "computed at complete-filling, stored as actual_cost_cents"
        difference: "uses actual_gallons, actual dispensed shots incl. TINT_SHOT adjustments, waste at 50% recovery, plus 25000 per rework cycle — same batch data yields a different number than provisional"

  - name: freeze_credit_calc
    trigger: "provisional at POST /coatings/credit-claims; final at POST /coatings/credit-claims/{id}/approve"
    algorithm: threshold
    formula: |
      remaining_days_at_claim = (container.expiry_date - claim.created_at).days  (whole days)
      band_pct: remaining_days >= 540 -> 1.00
                360 <= remaining_days < 540 -> 0.60   (exactly 360 takes the 0.60 band)
                180 <= remaining_days < 360 -> 0.30
                remaining_days < 180 -> 0.00
      provisional_credit_cents = round_half_up(invoice_value_cents * band_pct
                                               * (0.5 when claim_type == FREEZE_DAMAGE and claimed_exposure_count > 2 else 1), 0)
      final_credit_cents       = round_half_up(invoice_value_cents * band_pct
                                               * (0.5 when claim_type == FREEZE_DAMAGE and verified_exposure_count > 2 else 1), 0)
      approval additionally requires final_credit_cents <= customer.annual_credit_cap_cents - customer.credit_used_ytd_cents
    input_set: "Claim, its container (expiry_date, freeze_exposure_count), its customer (cap fields)"
    constants:
      BAND_FULL_DAYS: 540
      BAND_MID_DAYS: 360
      BAND_LOW_DAYS: 180
      FREEZE_PENALTY_FACTOR: 0.5
      FREEZE_PENALTY_EXPOSURE_THRESHOLD: 2
    precision: "integer cents, round_half_up after all multiplications"
    variants:
      - name: provisional
        when: "at claim submission"
        difference: "freeze penalty driven by dealer-claimed claimed_exposure_count"
      - name: final
        when: "at approval"
        difference: "freeze penalty driven by verified_exposure_count copied from the container at review — diverges from provisional whenever claimed != verified"

  - name: rush_capacity
    trigger: "POST /coatings/orders/{id}/rush-approve"
    algorithm: threshold
    formula: |
      approvals_today = count of SalesOrder rows with rush_approved_date == current UTC calendar date
      approve allowed iff approvals_today < RUSH_DAILY_LIMIT  (the 3rd approval of a day succeeds, the 4th fails)
      counter resets implicitly at each UTC date rollover (date-keyed, no manual reset)
    input_set: "All SalesOrder rows regardless of current status, keyed by rush_approved_date"
    constants:
      RUSH_DAILY_LIMIT: 3
    precision: "whole approvals"

  - name: disposal_cost
    trigger: "POST /coatings/disposal-requests/{id}/complete"
    algorithm: tiered_pricing
    formula: |
      hazmat_class (computed at request creation):
        HAZARDOUS when any referenced container's batch has voc_actual_gpl > 250
                    or any colorant used by that batch's formula has is_hazmat == true
        else NON_HAZARDOUS
      expected_destroyed_kg = sum(net_weight_kg over referenced containers)
      quantity gate: when expected_destroyed_kg == 0, require actual_destroyed_kg == 0;
        otherwise require abs(actual - expected) / expected * 100 <= 2
      rate_per_kg_cents = 250 when HAZARDOUS else 90
      gross_cost_cents = round_half_up(rate_per_kg_cents * expected_destroyed_kg, 0) + MANIFEST_FEE_CENTS
      recovery_credit_cents = min(300 * count(containers with size_code == FIVE_GALLON),
                                  round_half_up(0.20 * gross_cost_cents, 0))
      net_cost_cents = gross_cost_cents - recovery_credit_cents
    input_set: "Referenced containers (with their batches and formulas' colorants)"
    constants:
      HAZMAT_VOC_THRESHOLD_GPL: 250
      RATE_HAZMAT_CENTS_PER_KG: 250
      RATE_NONHAZMAT_CENTS_PER_KG: 90
      MANIFEST_FEE_CENTS: 45000
      PAIL_RECOVERY_CENTS: 300
      RECOVERY_CAP_PCT: 0.20
      QUANTITY_TOLERANCE_PCT: 2
    precision: "integer cents, round_half_up; kg at 2 decimals"

  - name: lifecycle_dates
    trigger: "container creation (expiry), color-match approval (retain), daily sweep (transitions)"
    algorithm: chronological
    formula: |
      container.expiry_date  = manufactured_at + tint_base.shelf_life_months calendar months
      match.retain_until     = decided_at + RETENTION_MONTHS[batch.product_category] calendar months
      daily sweep at logical clock date D:
        every container IN_STOCK with expiry_date <= D        -> OBSOLETE   (expiry day itself is obsolete)
        every APPROVED ColorMatch with retain_until < D       -> retain_purged_at = D   (purged only strictly after)
    input_set: "Containers in IN_STOCK; APPROVED ColorMatch rows with retain_purged_at null"
    constants:
      RETENTION_MONTHS: { FLAT: 24, NONFLAT: 24, PRIMER: 18, INDUSTRIAL_MAINTENANCE: 36, TRAFFIC_MARKING: 12 }
    precision: "calendar-month arithmetic on dates; whole-day comparisons"

  - name: claim_window
    trigger: "POST /coatings/credit-claims"
    algorithm: threshold
    formula: |
      allowed iff claim.created_at <= container.shipped_at + 30 days   (exactly 30 days later passes; one second beyond fails with ERR_CLAIM_WINDOW_EXPIRED)
    input_set: "The claim and its container"
    constants:
      CLAIM_WINDOW_DAYS: 30
    precision: "second-level timestamp comparison"

  - name: mill_reservation
    trigger: "POST /coatings/batches (create), start-mill, resume; daily checks never move windows"
    algorithm: interval_merge
    formula: |
      Each batch occupies CLOSED interval [mill_window_start, mill_window_end] on its mill.
      For two reservations X (existing) and Y (new) on the same mill:
        required gap = 0 minutes when X.base_family == Y.base_family (shared washdown)
                       else 30 minutes washdown buffer
        conflict iff NOT (Y.start >= X.end + gap OR X.start >= Y.end + gap)   -> ERR_MILL_WINDOW_CONFLICT
        (boundary: Y.start exactly == X.end + gap is allowed; same-family adjacency Y.start == X.end is allowed)
      mill.reserved_minutes = sum(window minutes) over batches in
        {PLANNED, ON_HOLD, MILLING, TINTING, QC_PENDING, REWORK, QC_APPROVED, FILLING}
      release: cancel (PLANNED/ON_HOLD) or DISPOSED transitions subtract the window.
    input_set: "Non-terminal, non-CANCELLED batches of the mill"
    constants:
      WASHDOWN_BUFFER_MIN: 30
    precision: "whole minutes"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles; entity-backed ownership (Dealer may only act on resources whose customer_id == X-User-ID)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Request body schema: required fields present, types valid, enum values in range, mill_window_end > mill_window_start, effective_to > effective_from"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "Every id in path and body exists, validated left-to-right through the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: state
    check: "expected_formula_version matches the predecessor formula's current version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /coatings/formulas/{id}/supersede"
  - priority: 6
    category: state
    check: "Target resource is in a state that permits the operation (incl. stale-cycle color match, non-cancellable IN_PRODUCTION order, HAZARDOUS disposal completing without manifest, tint adjustments in the wrong batch phase)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "VOC compliance: rule resolvable and batch voc_actual_gpl within the resolved limit for destination state, category, ship date, container size"
    error_id: "ERR_VOC_RULE_MISSING / ERR_VOC_LIMIT_EXCEEDED"
    http_status: 422
    applies_to: "POST /coatings/containers/{id}/ship"
  - priority: 8
    category: business_referential
    check: "Cross-referenced entities in a valid relation: formula ACTIVE for batch creation and order lines; scheduled batch belongs to the order; claim container was SHIPPED to the claiming customer"
    error_id: "ERR_FORMULA_NOT_ACTIVE / ERR_ORDER_BATCH_MISMATCH / ERR_CONTAINER_NOT_CREDITABLE"
    http_status: 422
    applies_to: "POST /coatings/batches, POST /coatings/orders, POST /coatings/orders/{id}/schedule, POST /coatings/credit-claims, POST /coatings/batches/{id}/resume"
  - priority: 9
    category: business_temporal
    check: "Claim submitted within 30 days of container shipment (inclusive boundary)"
    error_id: ERR_CLAIM_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /coatings/credit-claims"
  - priority: 10
    category: business_constraint
    check: "Constraint satisfaction: VOC rule window overlap, mill window conflict with washdown buffer, mill capacity, mill availability/busy, unique codes (base/colorant/formula/manifest), segregation of duties, delta-e threshold, fill reconciliation, retain sample presence, disposal quantity reconciliation, rush daily capacity"
    error_id: "ERR_VOC_RULE_OVERLAP / ERR_MILL_WINDOW_CONFLICT / ERR_MILL_NOT_AVAILABLE / ERR_MILL_BUSY / ERR_MILL_CAPACITY_EXCEEDED / ERR_DUPLICATE_CODE / ERR_SEGREGATION_OF_DUTY / ERR_DELTA_E_EXCEEDED / ERR_FILL_RECONCILIATION_FAILED / ERR_RETAIN_SAMPLE_MISSING / ERR_DISPOSAL_QUANTITY_MISMATCH / ERR_RUSH_CAPACITY_EXCEEDED"
    http_status: 422
    applies_to: "per-error endpoints (see §1.6)"
  - priority: 11
    category: business_fiscal
    check: "Fiscal floors and ceilings: custom color line minimums (50 gal, 100 gal rush); claim final credit within customer's remaining annual cap"
    error_id: "ERR_CUSTOM_MINIMUM_NOT_MET / ERR_CREDIT_CAP_EXCEEDED"
    http_status: 422
    applies_to: "POST /coatings/orders, POST /coatings/batches, POST /coatings/credit-claims/{id}/approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Customer ---
  - method: POST
    path: "/coatings/customers"
    description: "Register a dealer customer"
    roles: [PlantManager]
    code: 201
    input: [name, home_state_code, annual_credit_cap_cents]
    output: Customer
    side_effects: ["credit_balance_cents = 0, credit_used_ytd_cents = 0"]
  - method: GET
    path: "/coatings/customers/{id}"
    description: "Get a customer (Dealer may only read its own id)"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- TintBase ---
  - method: POST
    path: "/coatings/tint-bases"
    description: "Create a tint base product"
    roles: [LabTechnician]
    code: 201
    input: [base_code, product_category, base_family, base_voc_gpl, water_fraction_pct, density_kg_per_gal, base_cost_per_gal_cents, unit_price_per_gal_cents, shelf_life_months, grind_spec_um]
    output: TintBase
    side_effects: []
  - method: GET
    path: "/coatings/tint-bases/{id}"
    description: "Get a tint base"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: []
    output: TintBase
    side_effects: []

  # --- Colorant ---
  - method: POST
    path: "/coatings/colorants"
    description: "Create a colorant"
    roles: [LabTechnician]
    code: 201
    input: [colorant_code, voc_g_per_unit, cost_per_shot_cents, is_hazmat]
    output: Colorant
    side_effects: []
  - method: GET
    path: "/coatings/colorants/{id}"
    description: "Get a colorant"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: []
    output: Colorant
    side_effects: []
  - method: GET
    path: "/coatings/colorants/{id}/formula-lines"
    description: "List formula lines referencing this colorant"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: []
    output: FormulaLine[]
    side_effects: []
  - method: GET
    path: "/coatings/colorants/{id}/batch-adjustments"
    description: "List batch adjustments referencing this colorant (TINT_SHOT rows)"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: []
    output: BatchAdjustment[]
    side_effects: []

  # --- Formula ---
  - method: POST
    path: "/coatings/formulas"
    description: "Create a formula with its colorant lines (starts DRAFT)"
    roles: [LabTechnician]
    code: 201
    input: [formula_code, color_name, tint_base_id, is_custom, target_delta_e, lines]
    output: Formula
    side_effects: ["FormulaLine rows created from the lines array; status = DRAFT; min_batch_gallons computed"]
  - method: GET
    path: "/coatings/formulas/{id}"
    description: "Get a formula"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: []
    output: Formula
    side_effects: []
  - method: GET
    path: "/coatings/formulas"
    description: "List formulas with optional filters"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: ["tint_base_id?", "predecessor_formula_id?", "status?"]
    output: Formula[]
    side_effects: []
  - method: GET
    path: "/coatings/formulas/{id}/lines"
    description: "List a formula's colorant lines"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: []
    output: FormulaLine[]
    side_effects: []
  - method: POST
    path: "/coatings/formulas/{id}/supersede"
    description: "Create a DRAFT successor of an ACTIVE formula (OCC-guarded; predecessor deprecated only when a successor activates)"
    roles: [LabTechnician]
    code: 201
    input: [formula_code, color_name, target_delta_e, lines, expected_formula_version]
    output: Formula
    side_effects:
      - "new formula: DRAFT, formula_version_no = predecessor.formula_version_no + 1, predecessor_formula_id set"
      - "increments predecessor Formula.version by 1"
  - method: POST
    path: "/coatings/formulas/{id}/activate"
    description: "Activate a DRAFT formula (cascades to predecessor, batches, orders)"
    roles: [LabTechnician]
    code: 200
    input: []
    output: Formula
    side_effects:
      - "status -> ACTIVE, activated_at set"
      - "predecessor -> DEPRECATED; its PLANNED batches -> ON_HOLD; their SCHEDULED orders -> BLOCKED"
  - method: POST
    path: "/coatings/formulas/{id}/deprecate"
    description: "Manually deprecate an ACTIVE or DRAFT formula (same batch/order cascade)"
    roles: [LabTechnician]
    code: 200
    input: []
    output: Formula
    side_effects:
      - "status -> DEPRECATED"
      - "from ACTIVE: PLANNED batches on this formula -> ON_HOLD; their SCHEDULED orders -> BLOCKED"

  # --- VocRule ---
  - method: POST
    path: "/coatings/voc-rules"
    description: "Create a VOC limit rule (starts DRAFT)"
    roles: [RegulatoryClerk]
    code: 201
    input: [category, state_code, max_voc_gpl, effective_from, "effective_to?", "exempt_container_l?"]
    output: VocRule
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/coatings/voc-rules/{id}"
    description: "Get a VOC rule"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: []
    output: VocRule
    side_effects: []
  - method: GET
    path: "/coatings/voc-rules"
    description: "List VOC rules with optional filters"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: ["category?", "state_code?"]
    output: VocRule[]
    side_effects: []
  - method: POST
    path: "/coatings/voc-rules/{id}/activate"
    description: "Activate a VOC rule (half-open window overlap check per category+state)"
    roles: [RegulatoryClerk]
    code: 200
    input: []
    output: VocRule
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/coatings/voc-rules/{id}/retire"
    description: "Retire a VOC rule (excluded from resolution immediately)"
    roles: [RegulatoryClerk]
    code: 200
    input: []
    output: VocRule
    side_effects: ["status -> RETIRED"]

  # --- Mill ---
  - method: POST
    path: "/coatings/mills"
    description: "Create a grinding mill"
    roles: [PlantManager]
    code: 201
    input: [mill_code, capacity_gallons]
    output: Mill
    side_effects: ["status = ACTIVE, reserved_minutes = 0"]
  - method: GET
    path: "/coatings/mills/{id}"
    description: "Get a mill"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: []
    output: Mill
    side_effects: []
  - method: POST
    path: "/coatings/mills/{id}/enter-maintenance"
    description: "Take a mill out of service (blocked while batches are in flight)"
    roles: [PlantManager]
    code: 200
    input: []
    output: Mill
    side_effects: ["status -> MAINTENANCE"]
  - method: POST
    path: "/coatings/mills/{id}/return-to-service"
    description: "Return a mill to service"
    roles: [PlantManager]
    code: 200
    input: []
    output: Mill
    side_effects: ["status -> ACTIVE"]
  - method: GET
    path: "/coatings/mills/{id}/batches"
    description: "List batches reserving this mill"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: []
    output: Batch[]
    side_effects: []

  # --- Batch ---
  - method: POST
    path: "/coatings/batches"
    description: "Plan a production batch (reserves the mill window)"
    roles: [ProductionOperator]
    code: 201
    input: [formula_id, mill_id, planned_gallons, mill_window_start, mill_window_end, "order_id?"]
    output: Batch
    side_effects:
      - "status = PLANNED; pinned_formula_version_no, product_category, base_family snapshotted"
      - "theoretical_cost_cents computed (batch_cost provisional)"
      - "mill.reserved_minutes += window minutes"
  - method: GET
    path: "/coatings/batches/{id}"
    description: "Get a batch"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: []
    output: Batch
    side_effects: []
  - method: GET
    path: "/coatings/batches"
    description: "List batches with optional filters"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: ["formula_id?", "mill_id?", "order_id?", "status?"]
    output: Batch[]
    side_effects: []
  - method: POST
    path: "/coatings/batches/{id}/start-mill"
    description: "Begin milling (PLANNED -> MILLING)"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: Batch
    side_effects: ["status -> MILLING; linked order SCHEDULED -> IN_PRODUCTION"]
  - method: POST
    path: "/coatings/batches/{id}/dispersion-check"
    description: "Record a grind reading; fail self-loops MILLING, pass advances to TINTING"
    roles: [ProductionOperator]
    code: 200
    input: [grind_reading]
    output: Batch
    side_effects: ["fail: dispersion_cycles += 1; pass: status -> TINTING"]
  - method: POST
    path: "/coatings/batches/{id}/adjustments"
    description: "Record a viscosity or tint adjustment (phase-gated by kind)"
    roles: [ProductionOperator]
    code: 201
    input: [kind, quantity, "colorant_id?"]
    output: BatchAdjustment
    side_effects: ["voc_contribution_g and cycle_index recorded"]
  - method: GET
    path: "/coatings/batches/{id}/adjustments"
    description: "List a batch's adjustments"
    roles: [PlantManager, LabTechnician, ProductionOperator, QCInspector, RegulatoryClerk, Dealer]
    code: 200
    input: []
    output: BatchAdjustment[]
    side_effects: []
  - method: POST
    path: "/coatings/batches/{id}/submit-qc"
    description: "Finish tinting and submit the batch for color QC (TINTING -> QC_PENDING)"
    roles: [ProductionOperator]
    code: 200
    input: [actual_gallons]
    output: Batch
    side_effects: ["actual_gallons recorded; voc_actual_gpl recomputed; status -> QC_PENDING"]
  - method: POST
    path: "/coatings/batches/{id}/rework"
    description: "Send a rejected batch back to milling (REWORK -> MILLING)"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: Batch
    side_effects: ["status -> MILLING; BLOCKED order -> IN_PRODUCTION"]
  - method: POST
    path: "/coatings/batches/{id}/resume"
    description: "Repoint an ON_HOLD batch to a new ACTIVE formula (ON_HOLD -> PLANNED)"
    roles: [ProductionOperator]
    code: 200
    input: [new_formula_id]
    output: Batch
    side_effects: ["formula_id and pinned_formula_version_no updated; BLOCKED order -> SCHEDULED"]
  - method: POST
    path: "/coatings/batches/{id}/fills"
    description: "Record one filled can/pail with its scale weight (first fill moves QC_APPROVED -> FILLING)"
    roles: [ProductionOperator]
    code: 201
    input: [size_code, actual_fill_g]
    output: Container
    side_effects:
      - "container created IN_STOCK (weigh pass) or QUARANTINED (weigh fail)"
      - "manufactured_at and expiry_date stamped from logical clock"
      - "batch.filled_net_kg reconciled"
  - method: POST
    path: "/coatings/batches/{id}/complete-filling"
    description: "Declare filling done; runs mass reconciliation (FILLING -> FILLED)"
    roles: [ProductionOperator]
    code: 200
    input: [waste_gallons]
    output: Batch
    side_effects: ["fill_reconciliation enforced; actual_cost_cents computed (batch_cost final); status -> FILLED"]
  - method: POST
    path: "/coatings/batches/{id}/close"
    description: "Close a filled batch (FILLED -> CLOSED; requires retain sample and no quarantined containers)"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: Batch
    side_effects: ["status -> CLOSED; closed_at set"]
  - method: POST
    path: "/coatings/batches/{id}/cancel"
    description: "Cancel a PLANNED or ON_HOLD batch (releases the mill reservation)"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: Batch
    side_effects: ["status -> CANCELLED; mill.reserved_minutes -= window minutes"]
  - method: POST
    path: "/coatings/batches/{id}/dispose"
    description: "Condemn an in-flight batch (pre-FILLING states -> DISPOSAL_PENDING)"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: Batch
    side_effects: ["status -> DISPOSAL_PENDING; IN_PRODUCTION order -> BLOCKED"]

