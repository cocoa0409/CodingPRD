      - name: lot_auto_depletes_when_fully_drawn_and_refuses_further_feeds
        claim_type: side_effect_execution
        grounds:
          - state_machines.GypsumLot.status.APPROVED_to_DEPLETED
          - errors[ERR_LOT_NOT_APPROVED]
        distinguishing_aspect: |
          Depletion is a system transition with no endpoint of its own: drawing the last 100.000 t flips
          the lot APPROVED -> DEPLETED inside the feed call (two version bumps in one request), and the
          next feed against it fails the priority-8 lot-status check with ERR_LOT_NOT_APPROVED rather
          than the priority-12 tonnage check.
        test_recipe:
          setup:
            - "Plant GYP-1 with one APPROVED 100.000 t synthetic lot and batch BM PLANNED."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant_id}", source_type: "SYNTHETIC", supplier_name: "Pawnee FGD", received_tons: 100.000, declared_free_moisture_pct: 10.00, declared_purity_pct: 90.0 }
