scenario: |
  Generate task harder than expert level!

  2574. Instant Payments Participation & Liquidity Management (bank instant payments operations):
  participation model selection for send, receive or receive-only with enrollment onboarding,
  twenty-four-hour liquidity monitoring and prefunded balance management with alerting thresholds,
  transaction limits by customer segment and velocity controls, request-for-payment handling and
  message response obligations, irrevocability of credit transfers and exception handling through
  return requests, fraud scoring at origination with hold-and-review queues, settlement reporting
  and reconciliation with core deposit systems, outage contingency and fallback to alternate rails

domain_name: instant-payments-participation-liquidity
api_prefix: ""

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a top-level collection joined by explicit foreign keys; no
  # entity is nested inside another entity's URL path for writes. Sub-resource
  # GETs exist only as reverse-reachability read channels.

  state_machine_shape: parallel
  # CreditTransfer carries two independent state dimensions on the same row
  # (clearing_status x exception_status). Participant likewise carries
  # enrollment_status (actor-driven) x operational_posture (system-derived).
  # RequestForPayment adds a cycle (DELIVERED -> AMENDMENT_REQUESTED -> DELIVERED)
  # and SettlementCycle adds a cycle (OUT_OF_BALANCE -> RECONCILING).

  relationship_patterns:
    - one_to_many          # Participant -> CustomerAccount / CustomerSegmentPolicy / CreditTransfer
    - self_referential     # CreditTransfer.compensating_for_transfer_id -> CreditTransfer.id
    - cross_aggregate      # ReconciliationRun spans SettlementCycle and Participant
    - polymorphic_scope    # OutageEvent.scope NETWORK_WIDE (participant_id null) or PARTICIPANT

  role_model: segregation_of_duties
  # A FraudReviewer may not review a CreditTransfer they themselves originated
  # (CreditTransfer.initiated_by_user_id vs FraudReview.assigned_reviewer_user_id),
  # and only the counterparty side (NetworkOperator) may honor or decline a
  # ReturnRequest raised by the originating PaymentOperator.

  consistency_model: immediate

global_constants:
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
  MIN_PREFUND_CENTS: 100000000
  THROTTLED_PER_TXN_CAP_CENTS: 50000000
  FRAUD_HOLD_THRESHOLD: 60
  FRAUD_BLOCK_THRESHOLD: 85
  AMOUNT_WEIGHT: 2
  AMOUNT_UNIT_CENTS: 100000
  AMOUNT_TERM_CAP: 10
  VELOCITY_WEIGHT_ORIGINATION: 4
  VELOCITY_FREE_COUNT_ORIGINATION: 3
  VELOCITY_WEIGHT_FINAL: 3
  VELOCITY_FREE_COUNT_FINAL: 5
  NEW_BENEFICIARY_BONUS: 12
  SEGMENT_MULTIPLIER_CONSUMER: 1.00
  SEGMENT_MULTIPLIER_SMALL_BUSINESS: 1.05
  SEGMENT_MULTIPLIER_CORPORATE: 1.10
  SEGMENT_MULTIPLIER_HIGH_RISK: 1.25
  VELOCITY_WINDOW_MINUTES: 60
  FINAL_VELOCITY_WINDOW_MINUTES: 1440
  FEE_RATE_BPS: 10
  FEE_REBATE_MIN_COUNT: 10
  FEE_REBATE_PCT: 0.10
  VARIANCE_TOLERANCE_CENTS: 100
  ACK_SLA_MINUTES: 60
  QUEUE_TTL_MINUTES: 120
  RFP_RESPONSE_SLA_MINUTES: 30
  RETURN_RESPONSE_SLA_MINUTES: 1440
  RETURN_REQUEST_WINDOW_MINUTES: 4320
  MAX_AMENDMENT_ROUNDS: 2
  OUTAGE_STABILIZATION_BUFFER_MINUTES: 15

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Participant
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Enrolled bank legal name.
      - name: routing_number
        type: string
        source: input
        description: Nine-digit ABA routing number of the participant.
        constraints: exactly 9 digits; unique across Participant
      - name: settlement_agent_reference
        type: string
        source: input
        description: Reference of the settlement agent holding the prefunded position.
      - name: participation_model
        type: enum
        source: input
        description: Participation tier selected at enrollment and changeable while not LIVE.
        default: RECEIVE_ONLY
        constraints: "one of {SEND_AND_RECEIVE, RECEIVE_ONLY, RECEIVE_AND_REQUEST_FOR_PAYMENT}"
      - name: enrollment_status
        type: enum
        source: system
        description: Onboarding/enrollment lifecycle dimension (see state_machines Participant.enrollment_status).
        default: DRAFT
        constraints: "one of {DRAFT, ATTESTATION_PENDING, CERTIFICATION_TESTING, REMEDIATION, CERTIFIED, LIVE, SUSPENDED, WITHDRAWN}"
      - name: operational_posture
        type: enum
        source: computed
        description: Derived gating posture recomputed from PrefundedPositionAccount.alert_tier, enrollment_status and open OutageEvent rows (calculations.operational_posture_derivation).
        default: NORMAL
        constraints: "one of {NORMAL, THROTTLED, SEND_FROZEN, OFFLINE}"
      - name: attestation_document_reference
        type: string
        source: input
        description: Operational-readiness attestation document reference captured at attestation submission.
        default: null
      - name: certification_test_suite_version
        type: string
        source: input
        description: Rail certification suite version the participant is being tested against.
        default: null
      - name: certification_round
        type: integer
        source: system
        description: Number of certification windows opened so far; increments on every entry into CERTIFICATION_TESTING.
        default: 0
      - name: go_live_business_date
        type: string
        source: input
        description: UTC date (YYYY-MM-DD) on which the participant was activated.
        default: null
      - name: suspension_reason
        type: string
        source: input
        description: Reason recorded on the most recent status-change into SUSPENDED or WITHDRAWN.
        default: null

  - name: PrefundedPositionAccount
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; at most one PrefundedPositionAccount per Participant."
        constraints: unique across PrefundedPositionAccount
      - name: opening_balance_cents
        type: integer
        source: input
        description: Balance the account was opened with; immutable baseline of the ledger identity.
        constraints: ">= MIN_PREFUND_CENTS"
      - name: current_balance_cents
        type: integer
        source: computed
        description: Funded position, recomputed as opening_balance_cents plus the signed sum of all LiquidityLedgerEntry rows of this account (calculations.position_balance_and_availability).
      - name: reserved_cents
        type: integer
        source: computed
        description: Liquidity earmarked by in-flight outbound CreditTransfer rows (calculations.position_balance_and_availability).
      - name: available_cents
        type: integer
        source: computed
        description: current_balance_cents minus reserved_cents; the quantity send-eligibility is tested against.
      - name: warning_threshold_cents
        type: integer
        source: input
        description: Balance at or below which alert_tier becomes AMBER.
      - name: critical_threshold_cents
        type: integer
        source: input
        description: Balance at or below which alert_tier becomes RED.
        constraints: must be strictly less than warning_threshold_cents
      - name: floor_cents
        type: integer
        source: input
        description: Regulatory floor; sends must leave available_cents at or above this value, and a balance strictly below it makes alert_tier BREACH.
        constraints: must be strictly less than critical_threshold_cents and >= 0
      - name: alert_tier
        type: enum
        source: computed
        description: Threshold band of current_balance_cents (calculations.liquidity_alert_tier).
        default: GREEN
        constraints: "one of {GREEN, AMBER, RED, BREACH}"
      - name: last_ledger_sequence_no
        type: integer
        source: system
        description: Highest sequence_no assigned to a LiquidityLedgerEntry of this account.
        default: 0

  - name: LiquidityLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> PrefundedPositionAccount.id; the account whose funded position this entry moves."
      - name: related_transfer_id
        type: string
        source: system
        description: "FK -> CreditTransfer.id; null for funding, withdrawal and fee entries."
        default: null
      - name: entry_type
        type: enum
        source: input
        description: Kind of movement.
        constraints: "one of {FUNDING_CREDIT, WITHDRAWAL_DEBIT, TRANSFER_DEBIT, RETURN_CREDIT, FEE_DEBIT}"
      - name: amount_cents
        type: integer
        source: computed
        description: Signed movement in cents; positive for FUNDING_CREDIT and RETURN_CREDIT, negative for WITHDRAWAL_DEBIT, TRANSFER_DEBIT and FEE_DEBIT.
      - name: balance_after_cents
        type: integer
        source: computed
        description: current_balance_cents of the account immediately after this entry was posted.
      - name: business_date
        type: string
        source: computed
        description: UTC date (YYYY-MM-DD) of the logical clock when the entry was posted.
      - name: sequence_no
        type: integer
        source: system
        description: Monotonic per-account ordinal starting at 1; ties are impossible by construction.
      - name: reference
        type: string
        source: input
        description: Operator-supplied external reference for the movement.
        default: null

  - name: LiquidityAlert
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> PrefundedPositionAccount.id; the monitored account."
      - name: tier
        type: enum
        source: computed
        description: alert_tier value that opened this alert.
        constraints: "one of {AMBER, RED, BREACH}"
      - name: threshold_cents
        type: integer
        source: computed
        description: Threshold constant that was crossed (warning_threshold_cents for AMBER, critical_threshold_cents for RED, floor_cents for BREACH).
      - name: observed_balance_cents
        type: integer
        source: computed
        description: current_balance_cents observed when the alert opened.
      - name: status
        type: enum
        source: system
        description: Alert handling lifecycle (see state_machines LiquidityAlert.status).
        default: OPEN
        constraints: "one of {OPEN, ACKNOWLEDGED, ESCALATED, CLEARED}"
      - name: acknowledged_by_user_id
        type: string
        source: input
        description: Opaque LiquidityOfficer operator id that acknowledged the alert; never compared to any entity id.
        default: null
      - name: remediation_plan
        type: string
        source: input
        description: Funding remediation plan recorded at acknowledgement.
        default: null
      - name: escalated_at
        type: datetime
        source: system
        description: Logical-clock instant at which a sweep escalated an unacknowledged alert.
        default: null
      - name: cleared_at
        type: datetime
        source: system
        description: Logical-clock instant at which the alert cleared because alert_tier returned to GREEN.
        default: null

  - name: CustomerSegmentPolicy
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; policies are scoped per participant."
      - name: segment
        type: enum
        source: input
        description: Customer segment this policy governs.
        constraints: "one of {CONSUMER, SMALL_BUSINESS, CORPORATE, HIGH_RISK}"
      - name: per_transaction_limit_cents
        type: integer
        source: input
        description: Maximum amount_cents of a single CreditTransfer for this segment; compared with <=.
        constraints: "> 0"
      - name: daily_aggregate_limit_cents
        type: integer
        source: input
        description: Maximum settled-plus-in-flight outbound amount per customer account per business date; compared with <=.
        constraints: ">= per_transaction_limit_cents"
      - name: rolling_window_count_limit
        type: integer
        source: input
        description: Maximum number of prior in-window transfers permitted before a new send is refused (velocity count control).
        constraints: "> 0"
      - name: rolling_window_amount_limit_cents
        type: integer
        source: input
        description: Maximum summed amount inside the rolling velocity window; compared with <=.
        constraints: "> 0"
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of the policy window.
      - name: effective_to
        type: datetime
        source: input
        description: Exclusive end of the policy window; null means open-ended.
        default: null
      - name: superseded_at
        type: datetime
        source: system
        description: Logical-clock instant at which a later policy closed this open-ended window.
        default: null

  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the bank holding this customer relationship."
      - name: segment
        type: enum
        source: input
        description: Segment used to select the governing CustomerSegmentPolicy and the fraud segment multiplier.
        constraints: "one of {CONSUMER, SMALL_BUSINESS, CORPORATE, HIGH_RISK}"
      - name: account_reference
        type: string
        source: input
        description: Bank-internal deposit account reference.
        constraints: unique per participant_id
      - name: fraud_risk_baseline
        type: integer
        source: input
        description: Static customer risk baseline fed into the fraud score.
        constraints: 0..100 inclusive
      - name: status
        type: enum
        source: system
        description: ACTIVE on creation; flipped to RESTRICTED by the fraud-block cascade.
        default: ACTIVE
        constraints: "one of {ACTIVE, RESTRICTED}"
      - name: daily_sent_amount_cents
        type: integer
        source: computed
        description: Conserved velocity-usage quantity for the current business date (calculations.customer_daily_sent_usage).
        default: 0
      - name: restricted_at
        type: datetime
        source: system
        description: Logical-clock instant at which a fraud BLOCK decision restricted this customer account.
        default: null

  - name: CreditTransfer
    parent: null
    common_fields: true
    fields:
      - name: originator_participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the sending participant whose position funds the transfer."
      - name: customer_account_id
        type: string
        source: input
        description: "FK -> CustomerAccount.id; the debtor customer account for OUTBOUND, the creditor for INBOUND."
      - name: segment_policy_id
        type: string
        source: system
        description: "FK -> CustomerSegmentPolicy.id; policy row pinned at origination and never re-resolved afterwards."
      - name: rfp_id
        type: string
        source: input
        description: "FK -> RequestForPayment.id; set when the transfer discharges an accepted request for payment."
        default: null
      - name: compensating_for_transfer_id
        type: string
        source: system
        description: "FK -> CreditTransfer.id; set on the INBOUND transfer minted when a return request is honored."
        default: null
      - name: receiver_routing_number
        type: string
        source: input
        description: Nine-digit routing number of the counterparty institution.
        constraints: exactly 9 digits
      - name: amount_cents
        type: integer
        source: input
        description: Transfer amount in cents.
        constraints: "> 0"
      - name: direction
        type: enum
        source: system
        description: OUTBOUND for operator-initiated sends; INBOUND only for compensating return credits.
        default: OUTBOUND
        constraints: "one of {OUTBOUND, INBOUND}"
      - name: rail
        type: enum
        source: system
        description: Rail the transfer is riding; switched by a diversion.
        default: INSTANT
        constraints: "one of {INSTANT, FALLBACK_ACH, FALLBACK_WIRE}"
      - name: clearing_status
        type: enum
        source: system
        description: Clearing dimension of the parallel state machine (see state_machines CreditTransfer.clearing_status).
        default: INITIATED
        constraints: "one of {INITIATED, FRAUD_HOLD, QUEUED_THROTTLED, ACCEPTED, SETTLED, REJECTED, DIVERTED, EXPIRED}"
      - name: exception_status
        type: enum
        source: system
        description: Exception dimension of the parallel state machine, independent of clearing_status (see state_machines CreditTransfer.exception_status).
        default: NONE
        constraints: "one of {NONE, RETURN_REQUESTED, RETURN_HONORED, RETURN_DECLINED, RETURN_EXPIRED}"
      - name: fraud_score
        type: integer
        source: computed
        description: Origination-variant fraud score frozen at creation (calculations.fraud_score variant ORIGINATION).
      - name: fraud_reason_codes
        type: array
        source: computed
        description: Reason codes contributed by non-zero fraud score terms at origination.
      - name: initiated_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the PaymentOperator that created the transfer; used by the segregation-of-duties check on fraud review assignment.
      - name: settlement_business_date
        type: string
        source: computed
        description: UTC date (YYYY-MM-DD) stamped when clearing_status became SETTLED.
        default: null
      - name: accepted_at
        type: datetime
        source: system
        description: Logical-clock instant of rail acceptance.
        default: null
      - name: irrevocable_at
        type: datetime
        source: system
        description: Equals accepted_at; once non-null the transfer can only be undone through a honored ReturnRequest.
        default: null
      - name: settled_at
        type: datetime
        source: system
        description: Logical-clock instant of settlement.
        default: null
      - name: queued_at
        type: datetime
        source: system
        description: Logical-clock instant at which a posture cascade parked the transfer in QUEUED_THROTTLED.
        default: null
      - name: remittance_reference
        type: string
        source: input
        description: End-to-end remittance reference.
        default: null
      - name: rejection_reason_code
        type: enum
        source: system
        description: Reason a transfer ended in REJECTED.
        default: null
        constraints: "one of {FRAUD_BLOCK_AUTOMATIC, FRAUD_BLOCK_REVIEW}"

  - name: RequestForPayment
    parent: null
    common_fields: true
    fields:
      - name: requestor_participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the participant asking to be paid."
      - name: debtor_customer_account_id
        type: string
        source: input
        description: "FK -> CustomerAccount.id; the customer account asked to pay."
      - name: amount_cents
        type: integer
        source: input
        description: Requested amount in cents; replaced on every honored amendment.
        constraints: "> 0"
      - name: expiry_at
        type: datetime
        source: input
        description: Instant after which the request may no longer be answered; swept to EXPIRED.
      - name: memo
        type: string
        source: input
        description: Free-text purpose of the request.
        default: null
      - name: status
        type: enum
        source: system
        description: Request lifecycle including the amendment cycle (see state_machines RequestForPayment.status).
        default: CREATED
        constraints: "one of {CREATED, DELIVERED, AMENDMENT_REQUESTED, ACCEPTED, DECLINED, EXPIRED}"
      - name: delivered_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent delivery to the debtor.
        default: null
      - name: response_deadline_at
        type: datetime
        source: system
        description: The message response obligation deadline, set to min(expiry_at, delivered_at plus RFP_RESPONSE_SLA_MINUTES) whenever the request is delivered or redelivered after an amendment; null while the request is CREATED or AMENDMENT_REQUESTED.
        default: null
      - name: amendment_round
        type: integer
        source: system
        description: Count of honored amendments; capped by MAX_AMENDMENT_ROUNDS.
        default: 0
      - name: last_response
        type: enum
        source: system
        description: Most recent debtor response recorded against the request.
        default: null
        constraints: "one of {ACCEPT, DECLINE, REQUEST_AMENDMENT}"
      - name: decline_reason_code
        type: enum
        source: input
        description: Reason recorded with a DECLINE response.
        default: null
        constraints: "one of {ACCOUNT_CLOSED, AMOUNT_DISPUTED, NOT_RECOGNIZED, INSUFFICIENT_FUNDS}"

  - name: FraudReview
    parent: null
    common_fields: true
    fields:
      - name: credit_transfer_id
        type: string
        source: input
        description: "FK -> CreditTransfer.id; the held transfer under review."
        constraints: at most one FraudReview per CreditTransfer
      - name: score_at_origination
        type: integer
        source: computed
        description: Copy of CreditTransfer.fraud_score taken when the hold was raised.
      - name: final_fraud_score
        type: integer
        source: computed
        description: Recomputed score using calculations.fraud_score variant REVIEW_FINAL, written when a decision is recorded.
        default: null
      - name: queue_priority
        type: integer
        source: computed
        description: 1 when score_at_origination >= FRAUD_BLOCK_THRESHOLD minus 10, else 2; lower value is worked first.
      - name: status
        type: enum
        source: system
        description: Hold-and-review queue lifecycle (see state_machines FraudReview.status).
        default: QUEUED
        constraints: "one of {QUEUED, UNDER_REVIEW, RELEASED, BLOCKED}"
      - name: assigned_reviewer_user_id
        type: string
        source: input
        description: Opaque FraudReviewer operator id holding the item; must differ from CreditTransfer.initiated_by_user_id.
        default: null
      - name: sla_deadline_at
        type: datetime
        source: system
        description: Instant by which the queue item should be decided (assignment time plus ACK_SLA_MINUTES).
        default: null
      - name: decision_rationale
        type: string
        source: input
        description: Reviewer narrative recorded with the decision.
        default: null

  - name: ReturnRequest
    parent: null
    common_fields: true
    fields:
      - name: credit_transfer_id
        type: string
        source: input
        description: "FK -> CreditTransfer.id; the settled transfer whose funds are being asked back."
      - name: requested_by_participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the originating participant raising the exception."
      - name: honored_transfer_id
        type: string
        source: system
        description: "FK -> CreditTransfer.id; the INBOUND compensating transfer minted when the request is honored."
        default: null
      - name: reason_code
        type: enum
        source: input
        description: Return reason.
        constraints: "one of {DUPLICATE_PAYMENT, WRONG_BENEFICIARY, FRAUD_SUSPECTED, TECHNICAL_ERROR}"
      - name: original_amount_cents
        type: integer
        source: computed
        description: Copy of the original CreditTransfer.amount_cents at request time.
      - name: returned_amount_cents
        type: integer
        source: input
        description: "Amount the counterparty returns; must be > 0 and <= original_amount_cents, and defaults to the full original_amount_cents when omitted (see validations priority 76)."
        default: null
      - name: status
        type: enum
        source: system
        description: Exception handling lifecycle (see state_machines ReturnRequest.status).
        default: REQUESTED
        constraints: "one of {REQUESTED, HONORED, DECLINED, EXPIRED}"
      - name: response_deadline_at
        type: datetime
        source: system
        description: Creation instant plus RETURN_RESPONSE_SLA_MINUTES; swept to EXPIRED when passed.
      - name: narrative
        type: string
        source: input
        description: Free-text description of the exception.
        default: null
      - name: decline_reason_code
        type: enum
        source: input
        description: Counterparty reason for refusing the return.
        default: null
        constraints: "one of {FUNDS_DISBURSED, BENEFICIARY_REFUSED, OUT_OF_TIME}"

  - name: SettlementCycle
    parent: null
    common_fields: true
    fields:
      - name: business_date
        type: string
        source: input
        description: UTC date (YYYY-MM-DD) the cycle covers.
        constraints: unique across SettlementCycle
      - name: status
        type: enum
        source: system
        description: Cycle lifecycle including the OUT_OF_BALANCE re-entry cycle (see state_machines SettlementCycle.status).
        default: OPEN
        constraints: "one of {OPEN, CUTOFF, RECONCILING, RECONCILED, OUT_OF_BALANCE}"
      - name: cutoff_at
        type: datetime
        source: system
        description: Logical-clock instant of cutoff.
        default: null
      - name: assessed_fee_total_cents
        type: integer
        source: computed
        description: Sum of per-participant net access fees posted at cutoff (calculations.intraday_liquidity_access_fee).
        default: 0
      - name: settled_transfer_count
        type: integer
        source: computed
        description: Number of OUTBOUND CreditTransfer rows with clearing_status SETTLED and settlement_business_date equal to business_date.
        default: 0
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant of reconciliation closure.
        default: null

  - name: ReconciliationRun
    parent: null
    common_fields: true
    fields:
      - name: settlement_cycle_id
        type: string
        source: input
        description: "FK -> SettlementCycle.id; the cycle being reconciled."
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the participant whose rail activity is compared with core deposits."
      - name: variant
        type: enum
        source: input
        description: Which reconciliation algorithm to run (calculations.reconciliation_variance).
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: revision
        type: integer
        source: system
        description: Count of previously persisted runs for the same (settlement_cycle_id, participant_id, variant) triple plus one; gives a total order over runs with no tie-break needed.
        default: 1
      - name: core_deposit_total_cents
        type: integer
        source: input
        description: Signed net position the core deposit system reports for the participant on the cycle business date.
      - name: rail_net_position_cents
        type: integer
        source: computed
        description: Signed net position derived from rail records under the chosen variant.
      - name: variance_cents
        type: integer
        source: computed
        description: core_deposit_total_cents minus rail_net_position_cents.
      - name: outcome
        type: enum
        source: computed
        description: BALANCED when the absolute variance is at or below VARIANCE_TOLERANCE_CENTS, else OUT_OF_BALANCE.
        constraints: "one of {BALANCED, OUT_OF_BALANCE}"
      - name: included_transfer_count
        type: integer
        source: computed
        description: Number of CreditTransfer rows the variant's input set admitted.
      - name: fee_component_cents
        type: integer
        source: computed
        description: Signed FEE_DEBIT component included by the FINAL variant; always 0 under PROVISIONAL.

  - name: OutageEvent
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; null when scope is NETWORK_WIDE."
        default: null
      - name: scope
        type: enum
        source: input
        description: Whether the outage covers one participant or the whole rail.
        constraints: "one of {PARTICIPANT, NETWORK_WIDE}"
      - name: severity
        type: enum
        source: input
        description: Declared severity of the incident.
        constraints: "one of {DEGRADED, FULL_OUTAGE}"
      - name: fallback_rail
        type: enum
        source: input
        description: Alternate rail operators may divert to while the outage is open.
        constraints: "one of {FALLBACK_ACH, FALLBACK_WIRE, NONE}"
      - name: status
        type: enum
        source: system
        description: Contingency lifecycle (see state_machines OutageEvent.status).
        default: DECLARED
        constraints: "one of {DECLARED, RESOLVED}"
      - name: started_at
        type: datetime
        source: input
        description: Inclusive start of the outage interval.
      - name: ended_at
        type: datetime
        source: input
        description: Inclusive end of the outage interval, written at resolution.
        default: null
      - name: diverted_transfer_count
        type: integer
        source: computed
        description: Number of CreditTransfer rows this declaration parked for diversion.
        default: 0

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Participant
    dimension: enrollment_status
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: ATTESTATION_PENDING
        trigger: "POST /participants/{id}/attestation"
        actor: ParticipantAdmin
        preconditions:
          - "enrollment_status == DRAFT"
          - "payload operational_readiness_confirmed == true"
        side_effects:
          - "writes Participant.attestation_document_reference"
          - "increments Participant.version by 1 and refreshes updated_at"
        note: "operational_readiness_confirmed == false is rejected with ERR_ATTESTATION_INCOMPLETE."
      - from: ATTESTATION_PENDING
        to: CERTIFICATION_TESTING
        trigger: "POST /participants/{id}/certification-window"
        actor: NetworkOperator
        preconditions:
          - "enrollment_status IN {ATTESTATION_PENDING, REMEDIATION}"
        side_effects:
          - "writes Participant.certification_test_suite_version"
          - "increments Participant.certification_round by 1"
          - "increments Participant.version by 1"
      - from: REMEDIATION
        to: CERTIFICATION_TESTING
        trigger: "POST /participants/{id}/certification-window"
        actor: NetworkOperator
        preconditions:
          - "enrollment_status IN {ATTESTATION_PENDING, REMEDIATION}"
        side_effects:
          - "writes Participant.certification_test_suite_version"
          - "increments Participant.certification_round by 1"
          - "increments Participant.version by 1"
        note: "Closes the certification cycle CERTIFICATION_TESTING -> REMEDIATION -> CERTIFICATION_TESTING."
      - from: CERTIFICATION_TESTING
        to: CERTIFIED
        trigger: "POST /participants/{id}/certification-results with outcome == PASS"
        actor: NetworkOperator
        preconditions:
          - "enrollment_status == CERTIFICATION_TESTING"
        side_effects:
          - "increments Participant.version by 1"
      - from: CERTIFICATION_TESTING
        to: REMEDIATION
        trigger: "POST /participants/{id}/certification-results with outcome == FAIL"
        actor: NetworkOperator
        preconditions:
          - "enrollment_status == CERTIFICATION_TESTING"
        side_effects:
          - "increments Participant.version by 1"
      - from: CERTIFIED
        to: LIVE
        trigger: "POST /participants/{id}/activation"
        actor: NetworkOperator
        preconditions:
          - "enrollment_status == CERTIFIED"
          - "a PrefundedPositionAccount with participant_id == this participant exists"
          - "that account's current_balance_cents >= MIN_PREFUND_CENTS"
          - "that account's alert_tier == GREEN"
        side_effects:
          - "writes Participant.go_live_business_date"
          - "recomputes Participant.operational_posture via calculations.operational_posture_derivation (DRAFT-era NORMAL is confirmed, or THROTTLED/SEND_FROZEN if the account tier says so)"
          - "increments Participant.version by 1"
      - from: LIVE
        to: SUSPENDED
        trigger: "POST /participants/{id}/status-change with target_status == SUSPENDED"
        actor: NetworkOperator
        preconditions:
          - "enrollment_status == LIVE"
        side_effects:
          - "writes Participant.suspension_reason"
          - "recomputes operational_posture: a SUSPENDED participant is SEND_FROZEN unless an open OutageEvent forces OFFLINE"
          - "the resulting SEND_FROZEN posture parks every CreditTransfer of this participant whose clearing_status == INITIATED into QUEUED_THROTTLED, releasing their reserved_cents"
          - "increments Participant.version by 1"
      - from: SUSPENDED
        to: LIVE
        trigger: "POST /participants/{id}/status-change with target_status == LIVE"
        actor: NetworkOperator
        preconditions:
          - "enrollment_status == SUSPENDED"
        side_effects:
          - "clears Participant.suspension_reason"
          - "recomputes operational_posture from calculations.operational_posture_derivation"
          - "if the recomputed posture is NORMAL or THROTTLED, runs calculations.throttled_release_waterfall over this participant's QUEUED_THROTTLED transfers"
          - "increments Participant.version by 1"
      - from: LIVE
        to: WITHDRAWN
        trigger: "POST /participants/{id}/status-change with target_status == WITHDRAWN"
        actor: NetworkOperator
        preconditions:
          - "enrollment_status IN {LIVE, SUSPENDED}"
          - "no CreditTransfer of this participant has clearing_status IN {INITIATED, FRAUD_HOLD, QUEUED_THROTTLED, ACCEPTED}"
        side_effects:
          - "writes Participant.suspension_reason"
          - "sets operational_posture to SEND_FROZEN permanently"
          - "increments Participant.version by 1"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /participants/{id}/status-change with target_status == WITHDRAWN"
        actor: NetworkOperator
        preconditions:
          - "enrollment_status IN {LIVE, SUSPENDED}"
          - "no CreditTransfer of this participant has clearing_status IN {INITIATED, FRAUD_HOLD, QUEUED_THROTTLED, ACCEPTED}"
        side_effects:
          - "writes Participant.suspension_reason"
          - "sets operational_posture to SEND_FROZEN permanently"
          - "increments Participant.version by 1"

  - entity: Participant
    dimension: operational_posture
    initial_state: NORMAL
    terminal_states: []
    note: |
      Second, system-derived dimension evolving independently of enrollment_status on the
      same row. Every transition below is the output of
      calculations.operational_posture_derivation re-run after some other mutation; no
      endpoint targets this dimension directly.
    transitions:
      - from: NORMAL
        to: THROTTLED
        trigger: "system: any mutation that leaves PrefundedPositionAccount.alert_tier == AMBER"
        actor: system
        preconditions:
          - "enrollment_status == LIVE"
          - "no OutageEvent with status == DECLARED covers this participant"
          - "account alert_tier == AMBER"
        side_effects:
          - "new sends are additionally capped at THROTTLED_PER_TXN_CAP_CENTS"
          - "increments Participant.version by 1"
      - from: THROTTLED
        to: SEND_FROZEN
        trigger: "system: any mutation that leaves PrefundedPositionAccount.alert_tier IN {RED, BREACH}"
        actor: system
        preconditions:
          - "no OutageEvent with status == DECLARED covers this participant"
          - "account alert_tier IN {RED, BREACH} or enrollment_status == SUSPENDED"
        side_effects:
          - "parks every CreditTransfer of this participant with clearing_status == INITIATED into QUEUED_THROTTLED and stamps queued_at"
          - "those parked transfers leave the reserved_cents input set, so PrefundedPositionAccount.reserved_cents drops and available_cents rises"
          - "increments Participant.version by 1"
      - from: NORMAL
        to: SEND_FROZEN
        trigger: "system: any mutation that leaves PrefundedPositionAccount.alert_tier IN {RED, BREACH}, or a status-change into SUSPENDED"
        actor: system
        preconditions:
          - "no OutageEvent with status == DECLARED covers this participant"
          - "account alert_tier IN {RED, BREACH} or enrollment_status == SUSPENDED"
        side_effects:
          - "parks every CreditTransfer of this participant with clearing_status == INITIATED into QUEUED_THROTTLED and stamps queued_at"
          - "those parked transfers leave the reserved_cents input set"
          - "increments Participant.version by 1"
      - from: SEND_FROZEN
        to: NORMAL
        trigger: "system: any mutation that leaves alert_tier == GREEN with enrollment_status == LIVE and no open OutageEvent"
        actor: system
        preconditions:
          - "account alert_tier == GREEN"
          - "enrollment_status == LIVE"
          - "no OutageEvent with status == DECLARED covers this participant"
        side_effects:
          - "runs calculations.throttled_release_waterfall, moving fitting QUEUED_THROTTLED transfers back to INITIATED in the pinned order and re-reserving their amounts"
          - "increments Participant.version by 1"
      - from: SEND_FROZEN
        to: THROTTLED
        trigger: "system: any mutation that leaves alert_tier == AMBER with enrollment_status == LIVE and no open OutageEvent"
        actor: system
        preconditions:
          - "account alert_tier == AMBER"
          - "enrollment_status == LIVE"
          - "no OutageEvent with status == DECLARED covers this participant"
        side_effects:
          - "runs calculations.throttled_release_waterfall over QUEUED_THROTTLED transfers, skipping none and stopping at the first that does not fit"
          - "increments Participant.version by 1"
      - from: THROTTLED
        to: NORMAL
        trigger: "system: any mutation that leaves alert_tier == GREEN with enrollment_status == LIVE"
        actor: system
        preconditions:
          - "account alert_tier == GREEN"
          - "enrollment_status == LIVE"
          - "no OutageEvent with status == DECLARED covers this participant"
        side_effects:
          - "runs calculations.throttled_release_waterfall"
          - "increments Participant.version by 1"
      - from: NORMAL
        to: OFFLINE
        trigger: "POST /outage-events (scope covering this participant)"
        actor: system
        preconditions:
          - "an OutageEvent with status == DECLARED covers this participant"
        side_effects:
          - "parks every CreditTransfer of this participant with clearing_status IN {INITIATED, QUEUED_THROTTLED} into QUEUED_THROTTLED, releasing reserved_cents, and increments OutageEvent.diverted_transfer_count by the number parked"
          - "increments Participant.version by 1"
        note: "OFFLINE outranks every other posture value regardless of alert_tier."
      - from: THROTTLED
        to: OFFLINE
        trigger: "POST /outage-events (scope covering this participant)"
        actor: system
        preconditions:
          - "an OutageEvent with status == DECLARED covers this participant"
        side_effects:
          - "parks INITIATED transfers into QUEUED_THROTTLED and increments OutageEvent.diverted_transfer_count"
          - "increments Participant.version by 1"
      - from: SEND_FROZEN
        to: OFFLINE
        trigger: "POST /outage-events (scope covering this participant)"
        actor: system
        preconditions:
          - "an OutageEvent with status == DECLARED covers this participant"
        side_effects:
          - "increments OutageEvent.diverted_transfer_count by the number of INITIATED transfers parked (zero when the freeze already parked them)"
          - "increments Participant.version by 1"
      - from: OFFLINE
        to: NORMAL
        trigger: "POST /outage-events/{id}/resolution"
        actor: system
        preconditions:
          - "no remaining OutageEvent with status == DECLARED covers this participant"
          - "account alert_tier == GREEN"
          - "enrollment_status == LIVE"
        side_effects:
          - "runs calculations.throttled_release_waterfall over QUEUED_THROTTLED transfers that were not diverted"
          - "increments Participant.version by 1"
      - from: OFFLINE
        to: SEND_FROZEN
        trigger: "POST /outage-events/{id}/resolution"
        actor: system
        preconditions:
          - "no remaining OutageEvent with status == DECLARED covers this participant"
          - "account alert_tier IN {RED, BREACH} or enrollment_status == SUSPENDED"
        side_effects:
          - "no release waterfall runs; QUEUED_THROTTLED transfers stay parked"
          - "increments Participant.version by 1"

  - entity: CreditTransfer
    dimension: clearing_status
    initial_state: INITIATED
    terminal_states: [SETTLED, REJECTED, DIVERTED, EXPIRED]
    note: |
      First of two independent dimensions on the same CreditTransfer row. The
      creation call lands in INITIATED and then, in the same request, the system
      applies at most one of the two score-driven transitions below.
    transitions:
      - from: INITIATED
        to: FRAUD_HOLD
        trigger: "system, inside POST /credit-transfers, when FRAUD_HOLD_THRESHOLD <= fraud_score < FRAUD_BLOCK_THRESHOLD"
        actor: system
        preconditions:
          - "fraud_score >= FRAUD_HOLD_THRESHOLD"
          - "fraud_score < FRAUD_BLOCK_THRESHOLD"
        side_effects:
          - "creates one FraudReview with status QUEUED, credit_transfer_id set, score_at_origination = CreditTransfer.fraud_score, queue_priority per its formula, sla_deadline_at null"
          - "amount_cents stays inside the reserved_cents input set (FRAUD_HOLD is a reserving state)"
      - from: INITIATED
        to: REJECTED
        trigger: "system, inside POST /credit-transfers, when fraud_score >= FRAUD_BLOCK_THRESHOLD"
        actor: system
        preconditions:
          - "fraud_score >= FRAUD_BLOCK_THRESHOLD"
        side_effects:
          - "writes rejection_reason_code = FRAUD_BLOCK_AUTOMATIC"
          - "amount_cents leaves the reserved_cents input set, so PrefundedPositionAccount.reserved_cents returns to its pre-call value"
          - "no FraudReview is created and CustomerAccount.status is left ACTIVE (only a reviewer BLOCK restricts the customer)"
      - from: FRAUD_HOLD
        to: INITIATED
        trigger: "POST /fraud-reviews/{id}/decision with decision == RELEASE"
        actor: FraudReviewer
        preconditions:
          - "FraudReview.status == UNDER_REVIEW"
          - "FraudReview.final_fraud_score < FRAUD_BLOCK_THRESHOLD"
        side_effects:
          - "FraudReview.status becomes RELEASED and final_fraud_score is written from calculations.fraud_score variant REVIEW_FINAL"
          - "CreditTransfer.fraud_score is NOT overwritten; the origination value stays frozen"
        note: "Closes the clearing cycle INITIATED -> FRAUD_HOLD -> INITIATED."
      - from: FRAUD_HOLD
        to: REJECTED
        trigger: "POST /fraud-reviews/{id}/decision with decision == BLOCK"
        actor: FraudReviewer
        preconditions:
          - "FraudReview.status == UNDER_REVIEW"
        side_effects:
          - "FraudReview.status becomes BLOCKED and final_fraud_score is written"
          - "writes rejection_reason_code = FRAUD_BLOCK_REVIEW"
          - "amount_cents leaves the reserved_cents input set, so reserved_cents drops and available_cents rises"
          - "cascade hop 2: the transfer's CustomerAccount.status flips ACTIVE -> RESTRICTED and restricted_at is stamped"
          - "cascade hop 3: because that customer account is RESTRICTED, every other CreditTransfer of the same customer_account_id with clearing_status == INITIATED is parked into QUEUED_THROTTLED with queued_at stamped, releasing their reserved_cents too"
      - from: INITIATED
        to: ACCEPTED
        trigger: "POST /credit-transfers/{id}/acceptance"
        actor: NetworkOperator
        preconditions:
          - "clearing_status == INITIATED"
          - "originator Participant.enrollment_status == LIVE"
          - "originator Participant.operational_posture IN {NORMAL, THROTTLED}"
          - "the CustomerAccount.status == ACTIVE"
        side_effects:
          - "stamps accepted_at and irrevocable_at with the logical clock"
          - "amount_cents remains inside the reserved_cents input set"
          - "increments CreditTransfer.version by 1"
        note: "Once irrevocable_at is non-null the transfer can no longer be diverted or cancelled; only a honored ReturnRequest can undo it."
      - from: INITIATED
        to: QUEUED_THROTTLED
        trigger: "system: originator posture becomes SEND_FROZEN or OFFLINE"
        actor: system
        preconditions:
          - "clearing_status == INITIATED"
          - "originator Participant.operational_posture IN {SEND_FROZEN, OFFLINE} after the recomputation"
        side_effects:
          - "stamps queued_at"
          - "amount_cents leaves the reserved_cents input set"
      - from: QUEUED_THROTTLED
        to: INITIATED
        trigger: "system: calculations.throttled_release_waterfall admits this transfer"
        actor: system
        preconditions:
          - "originator Participant.operational_posture IN {NORMAL, THROTTLED}"
          - "running available liquidity minus amount_cents >= floor_cents at this transfer's turn in the pinned order"
        side_effects:
          - "clears queued_at"
          - "amount_cents re-enters the reserved_cents input set"
      - from: QUEUED_THROTTLED
        to: DIVERTED
        trigger: "POST /credit-transfers/{id}/diversion"
        actor: PaymentOperator
        preconditions:
          - "clearing_status == QUEUED_THROTTLED"
          - "irrevocable_at IS NULL"
          - "an OutageEvent with status == DECLARED covers the originator participant"
          - "payload fallback_rail equals that OutageEvent.fallback_rail and is not NONE"
        side_effects:
          - "writes rail = payload fallback_rail"
          - "the transfer stays out of the reserved_cents input set (DIVERTED is terminal and non-reserving)"
      - from: QUEUED_THROTTLED
        to: EXPIRED
        trigger: "POST /network-sweeps"
        actor: NetworkOperator
        preconditions:
          - "clearing_status == QUEUED_THROTTLED"
          - "queued_at plus QUEUE_TTL_MINUTES <= logical clock now"
        side_effects:
          - "the transfer stays out of the reserved_cents input set"
      - from: ACCEPTED
        to: SETTLED
        trigger: "POST /credit-transfers/{id}/settlement"
        actor: NetworkOperator
        preconditions:
          - "clearing_status == ACCEPTED"
          - "a SettlementCycle whose business_date equals the logical clock UTC date exists with status == OPEN"
        side_effects:
          - "cascade hop 1: stamps settled_at and settlement_business_date, and amount_cents leaves the reserved_cents input set"
          - "cascade hop 2: posts one LiquidityLedgerEntry (entry_type TRANSFER_DEBIT, amount_cents = -CreditTransfer.amount_cents, related_transfer_id set, sequence_no = account.last_ledger_sequence_no + 1), which lowers PrefundedPositionAccount.current_balance_cents and increments that account's version by 1"
          - "cascade hop 3: the new current_balance_cents is re-banded by calculations.liquidity_alert_tier; when the tier degrades to AMBER, RED or BREACH a LiquidityAlert row is opened with status OPEN, tier, threshold_cents and observed_balance_cents"
          - "cascade hop 4: the freshly opened RED or BREACH alert drives calculations.operational_posture_derivation, moving Participant.operational_posture to SEND_FROZEN, which in turn parks this participant's remaining INITIATED transfers into QUEUED_THROTTLED"
          - "increments CustomerAccount.daily_sent_amount_cents by amount_cents and increments SettlementCycle.settled_transfer_count by 1"

  - entity: CreditTransfer
    dimension: exception_status
    initial_state: NONE
    terminal_states: [RETURN_HONORED, RETURN_DECLINED, RETURN_EXPIRED]
    note: |
      Second dimension on the same row, evolving independently: clearing_status stays
      SETTLED through the entire exception lifecycle because an instant credit transfer
      is irrevocable - the money comes back as a separate INBOUND CreditTransfer, never
      by rewinding the original.
    transitions:
      - from: NONE
        to: RETURN_REQUESTED
        trigger: "POST /return-requests"
        actor: PaymentOperator
        preconditions:
          - "clearing_status == SETTLED"
          - "exception_status == NONE"
          - "settled_at plus RETURN_REQUEST_WINDOW_MINUTES > logical clock now"
          - "no other ReturnRequest already references this transfer"
        side_effects:
          - "creates a ReturnRequest with status REQUESTED, original_amount_cents copied from the transfer and response_deadline_at = now plus RETURN_RESPONSE_SLA_MINUTES"
          - "increments CreditTransfer.version by 1"
      - from: RETURN_REQUESTED
        to: RETURN_HONORED
        trigger: "POST /return-requests/{id}/honor"
        actor: NetworkOperator
        preconditions:
          - "ReturnRequest.status == REQUESTED"
          - "ReturnRequest.response_deadline_at > logical clock now"
          - "ReturnRequest.returned_amount_cents is non-null and <= original_amount_cents (it was fixed when the request was lodged; POST /return-requests/{id}/honor takes no payload and can neither raise nor lower it)"
        side_effects:
          - "cascade hop 1: ReturnRequest.status becomes HONORED and returned_amount_cents is stored"
          - "cascade hop 2: a compensating CreditTransfer is minted with direction INBOUND, rail INSTANT, clearing_status SETTLED, amount_cents = returned_amount_cents, compensating_for_transfer_id = the original transfer id, settlement_business_date = the clock UTC date, fraud_score 0; ReturnRequest.honored_transfer_id points at it"
          - "cascade hop 3: that compensating transfer posts one LiquidityLedgerEntry (entry_type RETURN_CREDIT, amount_cents = +returned_amount_cents), raising PrefundedPositionAccount.current_balance_cents back and incrementing the account version"
          - "cascade hop 4: the restored balance is re-banded by calculations.liquidity_alert_tier; when the tier returns to GREEN every LiquidityAlert of the account with status IN {OPEN, ACKNOWLEDGED, ESCALATED} becomes CLEARED with cleared_at stamped"
          - "cascade hop 5: with no non-cleared alert left, calculations.operational_posture_derivation moves Participant.operational_posture back to NORMAL, which runs calculations.throttled_release_waterfall over the participant's QUEUED_THROTTLED transfers"
          - "the original row leaves the daily-sent input set (its exception_status is now RETURN_HONORED), so CustomerAccount.daily_sent_amount_cents is recomputed and drops by the ORIGINAL amount_cents even when returned_amount_cents is smaller; this asymmetry with the ledger credit is deliberate - the position is restored by the returned amount only"
      - from: RETURN_REQUESTED
        to: RETURN_DECLINED
        trigger: "POST /return-requests/{id}/decline"
        actor: NetworkOperator
        preconditions:
          - "ReturnRequest.status == REQUESTED"
          - "ReturnRequest.response_deadline_at > logical clock now"
        side_effects:
          - "ReturnRequest.status becomes DECLINED and decline_reason_code is stored"
          - "no ledger entry is posted; current_balance_cents, reserved_cents and CustomerAccount.daily_sent_amount_cents are all left untouched"
      - from: RETURN_REQUESTED
        to: RETURN_EXPIRED
        trigger: "POST /network-sweeps"
        actor: NetworkOperator
        preconditions:
          - "ReturnRequest.status == REQUESTED"
          - "ReturnRequest.response_deadline_at <= logical clock now"
        side_effects:
          - "ReturnRequest.status becomes EXPIRED"
          - "no ledger entry is posted"

  - entity: RequestForPayment
    initial_state: CREATED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    note: "Carries the negotiation cycle DELIVERED -> AMENDMENT_REQUESTED -> DELIVERED, bounded by MAX_AMENDMENT_ROUNDS."
    transitions:
      - from: CREATED
        to: DELIVERED
        trigger: "POST /request-for-payments/{id}/delivery"
        actor: NetworkOperator
        preconditions:
          - "status == CREATED"
          - "expiry_at > logical clock now"
          - "requestor Participant.enrollment_status == LIVE"
          - "requestor Participant.participation_model IN {SEND_AND_RECEIVE, RECEIVE_AND_REQUEST_FOR_PAYMENT}"
        side_effects:
          - "stamps delivered_at with the logical clock and response_deadline_at = min(expiry_at, delivered_at plus RFP_RESPONSE_SLA_MINUTES)"
          - "increments RequestForPayment.version by 1"
      - from: DELIVERED
        to: ACCEPTED
        trigger: "POST /request-for-payments/{id}/response with response == ACCEPT"
        actor: PaymentOperator
        preconditions:
          - "status == DELIVERED"
          - "response_deadline_at > logical clock now"
          - "expiry_at > logical clock now"
          - "debtor CustomerAccount.status == ACTIVE"
        side_effects:
          - "writes last_response = ACCEPT"
          - "unlocks POST /credit-transfers with rfp_id set to this request"
      - from: DELIVERED
        to: DECLINED
        trigger: "POST /request-for-payments/{id}/response with response == DECLINE"
        actor: PaymentOperator
        preconditions:
          - "status == DELIVERED"
          - "response_deadline_at > logical clock now"
          - "payload decline_reason_code is present"
        side_effects:
          - "writes last_response = DECLINE and decline_reason_code"
      - from: DELIVERED
        to: AMENDMENT_REQUESTED
        trigger: "POST /request-for-payments/{id}/response with response == REQUEST_AMENDMENT"
        actor: PaymentOperator
        preconditions:
          - "status == DELIVERED"
          - "response_deadline_at > logical clock now"
          - "amendment_round < MAX_AMENDMENT_ROUNDS"
        side_effects:
          - "writes last_response = REQUEST_AMENDMENT"
          - "clears response_deadline_at until the amended request is redelivered"
      - from: AMENDMENT_REQUESTED
        to: DELIVERED
        trigger: "POST /request-for-payments/{id}/amendment"
        actor: PaymentOperator
        preconditions:
          - "status == AMENDMENT_REQUESTED"
          - "expiry_at > logical clock now"
          - "amendment_round < MAX_AMENDMENT_ROUNDS"
        side_effects:
          - "overwrites amount_cents and expiry_at from the payload"
          - "increments amendment_round by 1"
          - "stamps delivered_at and response_deadline_at = min(expiry_at, delivered_at plus RFP_RESPONSE_SLA_MINUTES)"
        note: "Closes the negotiation cycle; the third amendment attempt is rejected with ERR_AMENDMENT_ROUNDS_EXHAUSTED."
      - from: CREATED
        to: EXPIRED
        trigger: "POST /network-sweeps"
        actor: NetworkOperator
        preconditions:
          - "status IN {CREATED, DELIVERED, AMENDMENT_REQUESTED}"
          - "expiry_at <= logical clock now"
        side_effects:
          - "no other entity is touched"
      - from: DELIVERED
        to: EXPIRED
        trigger: "POST /network-sweeps"
        actor: NetworkOperator
        preconditions:
          - "status IN {CREATED, DELIVERED, AMENDMENT_REQUESTED}"
          - "expiry_at <= logical clock now"
        side_effects:
          - "no other entity is touched"
      - from: AMENDMENT_REQUESTED
        to: EXPIRED
        trigger: "POST /network-sweeps"
        actor: NetworkOperator
        preconditions:
          - "status IN {CREATED, DELIVERED, AMENDMENT_REQUESTED}"
          - "expiry_at <= logical clock now"
        side_effects:
          - "no other entity is touched"

  - entity: FraudReview
    initial_state: QUEUED
    terminal_states: [RELEASED, BLOCKED]
    transitions:
      - from: QUEUED
        to: UNDER_REVIEW
        trigger: "POST /fraud-reviews/{id}/assignment"
        actor: FraudReviewer
        preconditions:
          - "status == QUEUED"
          - "the acting X-User-ID (POST /fraud-reviews/{id}/assignment takes no payload) differs from the reviewed CreditTransfer.initiated_by_user_id (segregation of duties)"
          - "the reviewed CreditTransfer.clearing_status == FRAUD_HOLD"
        side_effects:
          - "writes assigned_reviewer_user_id and sla_deadline_at = now plus ACK_SLA_MINUTES"
      - from: UNDER_REVIEW
        to: RELEASED
        trigger: "POST /fraud-reviews/{id}/decision with decision == RELEASE"
        actor: FraudReviewer
        preconditions:
          - "status == UNDER_REVIEW"
          - "the acting X-User-ID equals assigned_reviewer_user_id"
          - "calculations.fraud_score variant REVIEW_FINAL yields a value < FRAUD_BLOCK_THRESHOLD"
        side_effects:
          - "writes final_fraud_score and decision_rationale"
          - "moves the reviewed CreditTransfer FRAUD_HOLD -> INITIATED"
      - from: UNDER_REVIEW
        to: BLOCKED
        trigger: "POST /fraud-reviews/{id}/decision with decision == BLOCK"
        actor: FraudReviewer
        preconditions:
          - "status == UNDER_REVIEW"
          - "the acting X-User-ID equals assigned_reviewer_user_id"
        side_effects:
          - "writes final_fraud_score and decision_rationale"
          - "moves the reviewed CreditTransfer FRAUD_HOLD -> REJECTED, which restricts the CustomerAccount and parks that customer's other INITIATED transfers"

  - entity: LiquidityAlert
    initial_state: OPEN
    terminal_states: [CLEARED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /liquidity-alerts/{id}/acknowledgement"
        actor: LiquidityOfficer
        preconditions:
          - "status IN {OPEN, ESCALATED}"
        side_effects:
          - "writes acknowledged_by_user_id from X-User-ID and remediation_plan from the payload"
      - from: ESCALATED
        to: ACKNOWLEDGED
        trigger: "POST /liquidity-alerts/{id}/acknowledgement"
        actor: LiquidityOfficer
        preconditions:
          - "status IN {OPEN, ESCALATED}"
        side_effects:
          - "writes acknowledged_by_user_id and remediation_plan"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /network-sweeps"
        actor: NetworkOperator
        preconditions:
          - "status == OPEN"
          - "created_at plus ACK_SLA_MINUTES <= logical clock now"
        side_effects:
          - "stamps escalated_at"
      - from: OPEN
        to: CLEARED
        trigger: "system: any mutation that leaves PrefundedPositionAccount.alert_tier == GREEN"
        actor: system
        preconditions:
          - "status IN {OPEN, ACKNOWLEDGED, ESCALATED}"
          - "the account's recomputed alert_tier == GREEN"
        side_effects:
          - "stamps cleared_at"
          - "when no non-CLEARED alert remains, calculations.operational_posture_derivation lifts the participant out of SEND_FROZEN"
      - from: ACKNOWLEDGED
        to: CLEARED
        trigger: "system: any mutation that leaves PrefundedPositionAccount.alert_tier == GREEN"
        actor: system
        preconditions:
          - "status IN {OPEN, ACKNOWLEDGED, ESCALATED}"
          - "the account's recomputed alert_tier == GREEN"
        side_effects:
          - "stamps cleared_at"
      - from: ESCALATED
        to: CLEARED
        trigger: "system: any mutation that leaves PrefundedPositionAccount.alert_tier == GREEN"
        actor: system
        preconditions:
          - "status IN {OPEN, ACKNOWLEDGED, ESCALATED}"
          - "the account's recomputed alert_tier == GREEN"
        side_effects:
          - "stamps cleared_at"

  - entity: ReturnRequest
    initial_state: REQUESTED
    terminal_states: [HONORED, DECLINED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: HONORED
        trigger: "POST /return-requests/{id}/honor"
        actor: NetworkOperator
        preconditions:
          - "status == REQUESTED"
          - "response_deadline_at > logical clock now"
          - "returned_amount_cents is non-null and <= original_amount_cents (fixed at lodgement; the honor call takes no payload)"
        side_effects:
          - "mints the compensating INBOUND CreditTransfer and writes honored_transfer_id"
          - "drives the five-hop cascade documented on CreditTransfer.exception_status RETURN_REQUESTED -> RETURN_HONORED"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /return-requests/{id}/decline"
        actor: NetworkOperator
        preconditions:
          - "status == REQUESTED"
          - "response_deadline_at > logical clock now"
          - "payload decline_reason_code is present"
        side_effects:
          - "sets the original CreditTransfer.exception_status to RETURN_DECLINED"
      - from: REQUESTED
        to: EXPIRED
        trigger: "POST /network-sweeps"
        actor: NetworkOperator
        preconditions:
          - "status == REQUESTED"
          - "response_deadline_at <= logical clock now"
        side_effects:
          - "sets the original CreditTransfer.exception_status to RETURN_EXPIRED"

  - entity: SettlementCycle
    initial_state: OPEN
    terminal_states: [RECONCILED]
    transitions:
      - from: OPEN
        to: CUTOFF
        trigger: "POST /settlement-cycles/{id}/cutoff"
        actor: NetworkOperator
        preconditions:
          - "status == OPEN"
          - "no CreditTransfer with settlement-relevant clearing_status ACCEPTED remains for this business_date"
        side_effects:
          - "stamps cutoff_at"
          - "cascade hop 1: for every Participant with enrollment_status == LIVE, calculations.intraday_liquidity_access_fee is evaluated and, when net_fee_cents > 0, one LiquidityLedgerEntry with entry_type FEE_DEBIT and amount_cents = -net_fee_cents is posted, in participant created_at ASC order"
          - "cascade hop 2: each FEE_DEBIT lowers that account's current_balance_cents and increments the account version"
          - "cascade hop 3: the lowered balance is re-banded by calculations.liquidity_alert_tier and may open a LiquidityAlert, which in turn may move Participant.operational_posture"
          - "writes SettlementCycle.assessed_fee_total_cents as the sum of all net_fee_cents posted"
      - from: CUTOFF
        to: RECONCILING
        trigger: "POST /reconciliation-runs with variant == FINAL"
        actor: CoreBankingSystem
        preconditions:
          - "status == CUTOFF"
        side_effects:
          - "the run row is persisted with computed rail_net_position_cents, variance_cents and outcome"
          - "cycle status becomes OUT_OF_BALANCE instead of RECONCILING when any LIVE participant's highest-revision FINAL run for this cycle has outcome OUT_OF_BALANCE"
      - from: RECONCILING
        to: OUT_OF_BALANCE
        trigger: "POST /reconciliation-runs with variant == FINAL yielding outcome OUT_OF_BALANCE"
        actor: CoreBankingSystem
        preconditions:
          - "status IN {CUTOFF, RECONCILING}"
          - "abs(variance_cents) > VARIANCE_TOLERANCE_CENTS"
        side_effects:
          - "no ledger movement; the variance must be resolved by a superseding FINAL run"
      - from: OUT_OF_BALANCE
        to: RECONCILING
        trigger: "POST /reconciliation-runs with variant == FINAL (superseding revision) yielding outcome BALANCED for every LIVE participant"
        actor: CoreBankingSystem
        preconditions:
          - "status == OUT_OF_BALANCE"
          - "after persisting the new run, no LIVE participant's highest-revision FINAL run has outcome OUT_OF_BALANCE"
        side_effects:
          - "increments ReconciliationRun.revision for the superseding run"
        note: "Closes the reconciliation cycle RECONCILING -> OUT_OF_BALANCE -> RECONCILING."
      - from: RECONCILING
        to: RECONCILED
        trigger: "POST /settlement-cycles/{id}/reconciliation-closure"
        actor: NetworkOperator
        preconditions:
          - "status == RECONCILING"
          - "every Participant with enrollment_status == LIVE has at least one FINAL ReconciliationRun for this cycle"
          - "each such participant's highest-revision FINAL run has outcome == BALANCED"
        side_effects:
          - "stamps closed_at"
          - "increments SettlementCycle.version by 1"

  - entity: OutageEvent
    initial_state: DECLARED
    terminal_states: [RESOLVED]
    transitions:
      - from: DECLARED
        to: RESOLVED
        trigger: "POST /outage-events/{id}/resolution"
        actor: NetworkOperator
        preconditions:
          - "status == DECLARED"
          - "payload ended_at >= started_at"
          - "payload ended_at <= logical clock now"
        side_effects:
          - "writes ended_at"
          - "for every Participant the event covered, calculations.operational_posture_derivation re-runs, lifting OFFLINE to NORMAL, THROTTLED or SEND_FROZEN"
          - "when the recomputed posture is NORMAL or THROTTLED, calculations.throttled_release_waterfall re-admits QUEUED_THROTTLED transfers"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: transfer-create-stale-position
    parent_entity: PrefundedPositionAccount
    write_endpoint: "POST /credit-transfers"
    occ_field: "expected_position_account_version"
    description: |
      Creating a CreditTransfer against a PrefundedPositionAccount whose version has
      advanced since the client last read it is rejected. Every accepted transfer,
      funding adjustment, settlement debit, fee debit and return credit bumps that
      version, so a client holding a stale version is reasoning about liquidity
      headroom that no longer exists - and a second transfer that would legitimately
      succeed under fresh liquidity must not be admitted on a stale view.
    error_id: ERR_STALE_POSITION_VERSION
    http_status: 412

  - rule_id: segment-policy-supersede-stale-participant
    parent_entity: Participant
    write_endpoint: "POST /segment-policies"
    occ_field: "expected_participant_version"
    description: |
      Creating a CustomerSegmentPolicy against a Participant whose version has advanced
      since the client last read it is rejected. A create carrying
      supersede_open_ended true legitimately closes the participant's existing
      open-ended policy window for that segment, so two creates are both individually
      valid; the stale-version check is what stops a writer from superseding a policy
      set it never observed.
    error_id: ERR_STALE_PARTICIPANT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: position_balance_and_availability
    trigger: "Recomputed inside every request that posts a LiquidityLedgerEntry or changes any CreditTransfer.clearing_status of the participant, and returned by GET /position-accounts/{id}"
    algorithm: aggregation
    formula: |
      current_balance_cents =
          opening_balance_cents
        + SUM(e.amount_cents for e in LiquidityLedgerEntry where e.account_id == account.id)

      reserved_cents =
          SUM(t.amount_cents for t in CreditTransfer
              where t.originator_participant_id == account.participant_id
                and t.direction == 'OUTBOUND'
                and t.clearing_status IN {'INITIATED', 'FRAUD_HOLD', 'ACCEPTED'})

      available_cents = current_balance_cents - reserved_cents
    input_set: |
      (a) Ledger side: every LiquidityLedgerEntry of the account, no status filter (entries are
      append-only and immutable), unbounded window - the identity holds over all time.
      (b) Reservation side: CreditTransfer rows of the participant in exactly the three reserving
      clearing states {INITIATED, FRAUD_HOLD, ACCEPTED}. QUEUED_THROTTLED, SETTLED, REJECTED,
      DIVERTED and EXPIRED rows are OUTSIDE the set: parking a transfer therefore releases its
      reservation, and settling it moves the amount from reserved_cents into a TRANSFER_DEBIT
      ledger entry so available_cents is unchanged by settlement.
      (c) Both sums are order-insensitive, so no tie-break is required.
    constants: {}
    precision: "integer cents, no rounding"

  - name: liquidity_alert_tier
    trigger: "Recomputed immediately after every LiquidityLedgerEntry posting (funding, withdrawal, settlement debit, fee debit, return credit)"
    algorithm: threshold
    formula: |
      # Evaluated on current_balance_cents (the funded position), NOT on available_cents:
      # reserving and releasing a transfer must not move the tier, only real money movement does.
      if current_balance_cents <  floor_cents:                 tier = 'BREACH'
      elif current_balance_cents <= critical_threshold_cents:  tier = 'RED'
      elif current_balance_cents <= warning_threshold_cents:   tier = 'AMBER'
      else:                                                   tier = 'GREEN'

      # Alert emission: when the recomputed tier is not GREEN and no LiquidityAlert of this
      # account already has (tier == recomputed tier and status IN {OPEN, ACKNOWLEDGED, ESCALATED}),
      # one LiquidityAlert row is opened with:
      #   tier                   = recomputed tier
      #   threshold_cents        = warning_threshold_cents  when tier == 'AMBER'
      #                            critical_threshold_cents when tier == 'RED'
      #                            floor_cents              when tier == 'BREACH'
      #   observed_balance_cents = current_balance_cents
      # When the recomputed tier is GREEN, every alert of the account with status
      # IN {OPEN, ACKNOWLEDGED, ESCALATED} becomes CLEARED.
    input_set: "The single PrefundedPositionAccount row plus its non-CLEARED LiquidityAlert rows"
    constants: {}
    precision: "integer cents; boundaries use <= so a balance exactly equal to critical_threshold_cents is RED and one exactly equal to floor_cents is RED (not BREACH)"

  - name: operational_posture_derivation
    trigger: "Recomputed at the end of every request that changes Participant.enrollment_status, PrefundedPositionAccount.alert_tier, or any OutageEvent.status"
    algorithm: constraint_propagation
    formula: |
      covering_outage = EXISTS(OutageEvent o where o.status == 'DECLARED'
                               and (o.scope == 'NETWORK_WIDE' or o.participant_id == participant.id))
      account = the PrefundedPositionAccount whose participant_id == participant.id (null if none)

      if covering_outage:                                       posture = 'OFFLINE'
      elif participant.enrollment_status IN {'SUSPENDED','WITHDRAWN'}: posture = 'SEND_FROZEN'
      elif account IS NULL:                                     posture = 'NORMAL'
      elif account.alert_tier IN {'RED','BREACH'}:              posture = 'SEND_FROZEN'
      elif account.alert_tier == 'AMBER':                       posture = 'THROTTLED'
      else:                                                     posture = 'NORMAL'

      # Propagation, in this pinned order:
      # 1. if the new posture IN {SEND_FROZEN, OFFLINE}: every CreditTransfer of the participant
      #    with clearing_status == 'INITIATED' becomes QUEUED_THROTTLED (created_at ASC), which
      #    removes it from the reserved_cents input set.
      # 2. if the new posture IN {NORMAL, THROTTLED} and the previous posture was
      #    SEND_FROZEN or OFFLINE: run calculations.throttled_release_waterfall.
      # The order matters: freezing releases reservations before any release pass can consume them.
    input_set: "The Participant row, its PrefundedPositionAccount (if any), and all OutageEvent rows with status DECLARED"
    constants: {}
    precision: "enumerated value; precedence is strictly OFFLINE > SEND_FROZEN > THROTTLED > NORMAL"

  - name: governing_segment_policy_selection
    trigger: "Runs once inside POST /credit-transfers to pin CreditTransfer.segment_policy_id; never re-resolved afterwards"
    algorithm: interval_merge
    formula: |
      candidates = CustomerSegmentPolicy p where
            p.participant_id == transfer.originator_participant_id
        and p.segment       == customer_account.segment
        and p.effective_from <= clock_now
        and (p.effective_to IS NULL or p.effective_to > clock_now)   # half-open [from, to)
      ranking   = ORDER BY p.effective_from DESC
      tie_break = then ORDER BY p.created_at DESC        # never p.id
      fallback  = when candidates is empty, reject the request with ERR_NO_GOVERNING_SEGMENT_POLICY (422)
      result    = the first row after ranking and tie-break; its id is written to
                  CreditTransfer.segment_policy_id and its limit fields are the ones enforced,
                  even if a later policy supersedes it before the transfer settles.
    input_set: "CustomerSegmentPolicy rows of the originating participant for the debtor's segment"
    constants: {}
    precision: "exact instant comparison; effective_from is inclusive and effective_to exclusive"

  - name: velocity_window_usage
    trigger: "Evaluated inside POST /credit-transfers before the transfer row is persisted, and again inside POST /fraud-reviews/{id}/decision for the REVIEW_FINAL fraud variant"
    algorithm: aggregation
    formula: |
      window_start = clock_now - MINUTES(window_minutes)
      window_end   = clock_now                      # half-open [window_start, window_end)
      rows = CreditTransfer t where
                 t.customer_account_id == customer_account.id
             and t.direction == 'OUTBOUND'
             and t.clearing_status IN {'INITIATED','FRAUD_HOLD','QUEUED_THROTTLED','ACCEPTED','SETTLED'}
             and t.created_at >= window_start
             and t.created_at <  window_end
      window_count        = COUNT(rows)
      window_amount_cents = SUM(rows.amount_cents)
    input_set: |
      Only the five non-terminal-or-successful clearing states above. REJECTED, DIVERTED and
      EXPIRED rows never count toward velocity. The transfer being scored is not yet persisted
      at origination, so it is never in its own window; for REVIEW_FINAL the transfer under
      review is explicitly excluded even though it is persisted.
    constants:
      ORIGINATION_WINDOW_MINUTES: 60
      REVIEW_FINAL_WINDOW_MINUTES: 1440
    precision: "integer count and integer cents; a row created exactly at window_start counts, a row created exactly at clock_now does not"

  - name: customer_daily_sent_usage
    trigger: "Recomputed whenever a CreditTransfer of the customer account settles, is returned, or is created"
    algorithm: aggregation
    formula: |
      business_date = UTC date of clock_now

      daily_sent_amount_cents =
          SUM(t.amount_cents for t in CreditTransfer where
                  t.customer_account_id == account.id
              and t.direction == 'OUTBOUND'
              and t.clearing_status == 'SETTLED'
              and t.settlement_business_date == business_date
              and t.exception_status != 'RETURN_HONORED')

      daily_exposure_cents =
          daily_sent_amount_cents
        + SUM(t.amount_cents for t in CreditTransfer where
                  t.customer_account_id == account.id
              and t.direction == 'OUTBOUND'
              and t.clearing_status IN {'INITIATED','FRAUD_HOLD','QUEUED_THROTTLED','ACCEPTED'}
              and UTC date of t.created_at == business_date)
    input_set: |
      daily_sent_amount_cents is the CONSERVED velocity-usage quantity: honoring a return removes
      the original transfer from the set (exception_status becomes RETURN_HONORED) so the counter
      returns to its pre-transfer value, while a DECLINED or EXPIRED return leaves it consumed.
      daily_exposure_cents is what the daily_aggregate_limit_cents check is measured against.
    constants: {}
    precision: "integer cents"

  - name: fraud_score
    trigger: "Variant ORIGINATION runs inside POST /credit-transfers and freezes CreditTransfer.fraud_score; variant REVIEW_FINAL runs inside POST /fraud-reviews/{id}/decision and writes FraudReview.final_fraud_score"
    algorithm: weighted_scoring
    formula: |
      base                 = customer_account.fraud_risk_baseline
      amount_term          = AMOUNT_WEIGHT * min(AMOUNT_TERM_CAP,
                                                 floor(transfer.amount_cents / AMOUNT_UNIT_CENTS))
      velocity_term        = velocity_weight * max(0, window_count - velocity_free_count)
      new_beneficiary_term = NEW_BENEFICIARY_BONUS
                             if NOT EXISTS(CreditTransfer x where
                                    x.customer_account_id == transfer.customer_account_id
                                and x.direction == 'OUTBOUND'
                                and x.clearing_status == 'SETTLED'
                                and x.receiver_routing_number == transfer.receiver_routing_number
                                and x.id != transfer.id)
                             else 0
      raw    = base + amount_term + velocity_term + new_beneficiary_term
      score  = min(100, round_half_up(raw * segment_multiplier[customer_account.segment]))

      # Non-linear interaction: the multiplier scales a sum whose amount and velocity terms are
      # themselves clamped, and the min(100, ...) ceiling is applied AFTER the multiplication.
      # Multiplying before clamping the terms, or clamping at 100 before the multiplier, both
      # produce different scores; the order above is the rule.

      fraud_reason_codes (ORIGINATION only, in this fixed order) =
        ['BASELINE_RISK']    if base >= 40                 else []
        + ['AMOUNT_BAND']    if amount_term > 0            else []
        + ['VELOCITY_BURST'] if velocity_term > 0          else []
        + ['NEW_BENEFICIARY'] if new_beneficiary_term > 0  else []

      # Routing at origination:
      #   score >= FRAUD_BLOCK_THRESHOLD -> clearing_status REJECTED (FRAUD_BLOCK_AUTOMATIC)
      #   FRAUD_HOLD_THRESHOLD <= score < FRAUD_BLOCK_THRESHOLD -> clearing_status FRAUD_HOLD + FraudReview
      #   score < FRAUD_HOLD_THRESHOLD -> stays INITIATED
    input_set: "The transfer under evaluation, its CustomerAccount, and the CreditTransfer history of that customer account"
    constants:
      AMOUNT_WEIGHT: 2
      AMOUNT_UNIT_CENTS: 100000
      AMOUNT_TERM_CAP: 10
      NEW_BENEFICIARY_BONUS: 12
      FRAUD_HOLD_THRESHOLD: 60
      FRAUD_BLOCK_THRESHOLD: 85
      SEGMENT_MULTIPLIER_CONSUMER: 1.00
      SEGMENT_MULTIPLIER_SMALL_BUSINESS: 1.05
      SEGMENT_MULTIPLIER_CORPORATE: 1.10
      SEGMENT_MULTIPLIER_HIGH_RISK: 1.25
    precision: "integer score 0..100, round_half_up on the product before the min(100, ...) ceiling"
    variants:
      - name: ORIGINATION
        when: "Inside POST /credit-transfers, before the row is persisted"
        difference: |
          velocity_weight     = VELOCITY_WEIGHT_ORIGINATION (4)
          velocity_free_count = VELOCITY_FREE_COUNT_ORIGINATION (3)
          window_count        = velocity_window_usage.window_count over the 60-minute half-open window
          new_beneficiary_term is evaluated against the settled history that exists at origination.
          Result is frozen into CreditTransfer.fraud_score and never recomputed.
      - name: REVIEW_FINAL
        when: "Inside POST /fraud-reviews/{id}/decision, on a transfer already sitting in FRAUD_HOLD"
        difference: |
          velocity_weight     = VELOCITY_WEIGHT_FINAL (3)
          velocity_free_count = VELOCITY_FREE_COUNT_FINAL (5)
          window_count        = velocity_window_usage.window_count over the 1440-minute half-open
                                window, EXCLUDING the transfer under review itself
          new_beneficiary_term is re-evaluated at decision time, so a beneficiary that has since
          received a SETTLED transfer from the same customer account drops the bonus to 0.
          Same base and amount_term, same multiplier - yet a strictly different score for
          identical stored transfer data, which is why RELEASE is gated on the FINAL value while
          the origination value stays visible on the transfer.

  - name: intraday_liquidity_access_fee
    trigger: "Runs once per LIVE Participant inside POST /settlement-cycles/{id}/cutoff"
    algorithm: tiered_pricing
    formula: |
      input_rows = CreditTransfer t where
                       t.originator_participant_id == participant.id
                   and t.direction == 'OUTBOUND'
                   and t.clearing_status == 'SETTLED'
                   and t.settlement_business_date == cycle.business_date
                   # exception_status is deliberately IGNORED: honoring a return does not refund
                   # the access fee already earned on the outbound leg.

      # PINNED ROUNDING ORDER - round per transfer, THEN sum:
      per_transfer_fee_cents(t) = round_half_up(t.amount_cents * FEE_RATE_BPS / 10000)
      gross_fee_cents = SUM(per_transfer_fee_cents(t) for t in input_rows ORDER BY t.created_at ASC)
      # Summing amount_cents first and rounding once at the end yields a DIFFERENT (usually
      # smaller) number - e.g. amounts 1500, 2500, 3500 give 2 + 3 + 4 = 9 per-transfer versus
      # round_half_up(7500 * 10 / 10000) = 8 sum-first. The per-transfer order above is the rule.

      settled_count = COUNT(input_rows)
      rebate_cents  = floor(gross_fee_cents * FEE_REBATE_PCT) if settled_count >= FEE_REBATE_MIN_COUNT else 0
      net_fee_cents = gross_fee_cents - rebate_cents

      # When net_fee_cents > 0 a LiquidityLedgerEntry (FEE_DEBIT, amount_cents = -net_fee_cents)
      # is posted to the participant's account; when it is 0 no entry is posted at all.
      # Participants are processed in Participant.created_at ASC order.
    input_set: "SETTLED OUTBOUND transfers of the participant stamped with the cycle's business_date; INBOUND compensating credits are excluded"
    constants:
      FEE_RATE_BPS: 10
      FEE_REBATE_MIN_COUNT: 10
      FEE_REBATE_PCT: 0.10
    precision: "round_half_up to whole cents per transfer, then integer summation; the rebate uses floor"

  - name: reconciliation_variance
    trigger: "Runs inside POST /reconciliation-runs, once per request, for the requested variant"
    algorithm: chronological
    formula: |
      D       = the SettlementCycle.business_date of the referenced cycle
      account = the PrefundedPositionAccount of the referenced participant

      credits = SUM(t.amount_cents for t in CreditTransfer where
                        t.originator_participant_id == participant.id
                    and t.direction == 'INBOUND'
                    and t.clearing_status == 'SETTLED'
                    and t.settlement_business_date == D)

      # debits and fee_component depend on the variant (see variants below)
      rail_net_position_cents = credits - debits + fee_component_cents
      variance_cents          = core_deposit_total_cents - rail_net_position_cents
      outcome                 = 'BALANCED' if abs(variance_cents) <= VARIANCE_TOLERANCE_CENTS
                                else 'OUT_OF_BALANCE'
      included_transfer_count = COUNT(debit rows) + COUNT(credit rows)
      revision                = 1 + COUNT(existing ReconciliationRun rows with the same
                                          (settlement_cycle_id, participant_id, variant))
    input_set: |
      Both variants read the same stored rows; they differ only in which clearing states and which
      exception states are admitted and whether fee entries are netted. An empty input set is legal
      and yields rail_net_position_cents == fee_component_cents (0 under PROVISIONAL), so the
      variance equals core_deposit_total_cents exactly.
    constants:
      VARIANCE_TOLERANCE_CENTS: 100
    precision: "integer cents, signed; abs() comparison uses <= so a variance of exactly 100 cents is BALANCED"
    variants:
      - name: PROVISIONAL
        when: "Requested with variant PROVISIONAL; permitted while cycle.status IN {OPEN, CUTOFF, RECONCILING, OUT_OF_BALANCE}"
        difference: |
          debits admits clearing_status IN {'ACCEPTED','SETTLED'} - accepted-but-unsettled transfers
          are matched to the cycle by (UTC date of accepted_at == D) since settlement_business_date
          is still null on them.
          exception_status is IGNORED entirely, so an already honored return is still counted as a
          debit.
          fee_component_cents = 0 always.
          Never changes SettlementCycle.status.
      - name: FINAL
        when: "Requested with variant FINAL; requires cycle.status IN {CUTOFF, RECONCILING, OUT_OF_BALANCE}"
        difference: |
          debits admits clearing_status == 'SETTLED' only, and excludes rows whose
          exception_status == 'RETURN_HONORED' (returned money is netted out rather than counted).
          fee_component_cents = SUM(e.amount_cents for e in LiquidityLedgerEntry where
                                    e.account_id == account.id and e.entry_type == 'FEE_DEBIT'
                                    and e.business_date == D)   # negative or zero
          Drives the SettlementCycle status transitions and gates reconciliation closure.

  - name: throttled_release_waterfall
    trigger: "Runs when calculations.operational_posture_derivation moves a Participant out of SEND_FROZEN or OFFLINE into NORMAL or THROTTLED"
    algorithm: waterfall_allocation
    formula: |
      candidates = CreditTransfer t where
                       t.originator_participant_id == participant.id
                   and t.clearing_status == 'QUEUED_THROTTLED'
      priority_rank(t) = 1 if t.rfp_id IS NOT NULL else 2      # accepted RFP obligations first
      order = ORDER BY priority_rank(t) ASC, then t.created_at ASC     # never t.id

      running_available = account.current_balance_cents - account.reserved_cents
      for t in candidates in order:
          if running_available - t.amount_cents >= account.floor_cents:
              t.clearing_status = 'INITIATED'; t.queued_at = null
              running_available = running_available - t.amount_cents
          else:
              STOP                    # strict waterfall

      # PINNED SEMANTICS: the pass STOPS at the first candidate that does not fit. It does NOT
      # skip that candidate to release a smaller later one - a skip-and-continue reading of the
      # same prose releases a different set of transfers and is explicitly not the rule.
      # An empty candidate set is a no-op and never an error.
    input_set: "QUEUED_THROTTLED transfers of the participant; reserved_cents at pass start excludes them by definition"
    constants: {}
    precision: "integer cents; the fit test uses >= so a release that lands available_cents exactly on floor_cents is admitted"

  - name: liquidity_projection_24h
    trigger: "Runs on GET /position-accounts/{id}/liquidity-projection"
    algorithm: forward_looking
    formula: |
      horizon_end = clock_now + MINUTES(1440)

      scheduled_outflow_cents =
          SUM(r.amount_cents for r in RequestForPayment where
                  r.debtor_customer_account_id IN (CustomerAccount ids of this participant)
              and r.status IN {'DELIVERED','ACCEPTED'}
              and r.expiry_at >= clock_now
              and r.expiry_at <  horizon_end)          # half-open [now, now+24h)

      expected_inflow_cents =
          SUM(r.amount_cents for r in RequestForPayment where
                  r.requestor_participant_id == account.participant_id
              and r.status == 'ACCEPTED'
              and r.expiry_at >= clock_now
              and r.expiry_at <  horizon_end)

      projected_balance_cents   = current_balance_cents - scheduled_outflow_cents + expected_inflow_cents
      projected_available_cents = projected_balance_cents - reserved_cents
      projected_alert_tier      = calculations.liquidity_alert_tier applied to projected_balance_cents
    input_set: |
      Committed in-flight transfers are NOT added again - they are already inside reserved_cents,
      and double counting them is the classic wrong reading of this projection. Requests whose
      expiry_at is exactly clock_now are included; requests whose expiry_at is exactly
      horizon_end are excluded.
    constants:
      HORIZON_MINUTES: 1440
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  # ---- 10..25: authentication, authorization, ownership scope -----------------
  - priority: 10
    category: auth
    check: "Both X-User-Role and X-User-ID request headers are present and non-empty, and X-User-Role names a role declared in section 1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 20
    category: auth
    check: "The caller's X-User-Role appears in the roles list of the endpoint being invoked"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 25
    category: auth
    check: "A ParticipantAdmin caller may only read or write resources whose owning participant id equals the caller's X-User-ID; the participant resolved from the path, from the body participant_id, or transitively from the referenced position account / customer account / transfer must match"
    error_id: ERR_PARTICIPANT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints whose roles include ParticipantAdmin"

  # ---- 30..44: existence (path ids left-to-right, then body references) ------
  - priority: 30
    category: existence
    check: "The {id} in /participants/{id}/... resolves to an existing Participant"
    error_id: ERR_PARTICIPANT_NOT_FOUND
    http_status: 404
    applies_to: "GET /participants/{id}, PATCH /participants/{id}/participation-model, POST /participants/{id}/attestation, POST /participants/{id}/certification-window, POST /participants/{id}/certification-results, POST /participants/{id}/activation, POST /participants/{id}/status-change, GET /participants/{id}/position-accounts, GET /participants/{id}/segment-policies, GET /participants/{id}/customer-accounts, GET /participants/{id}/outage-events"
  - priority: 31
    category: existence
    check: "The {id} in /position-accounts/{id}/... resolves to an existing PrefundedPositionAccount"
    error_id: ERR_POSITION_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "GET /position-accounts/{id}, POST /position-accounts/{id}/ledger-adjustments, GET /position-accounts/{id}/ledger-entries, GET /position-accounts/{id}/alerts, GET /position-accounts/{id}/liquidity-projection"
  - priority: 32
    category: existence
    check: "The {id} in /liquidity-alerts/{id}/... resolves to an existing LiquidityAlert"
    error_id: ERR_LIQUIDITY_ALERT_NOT_FOUND
    http_status: 404
    applies_to: "POST /liquidity-alerts/{id}/acknowledgement"
  - priority: 33
    category: existence
    check: "The {id} in /credit-transfers/{id}/... resolves to an existing CreditTransfer"
    error_id: ERR_CREDIT_TRANSFER_NOT_FOUND
    http_status: 404
    applies_to: "GET /credit-transfers/{id}, POST /credit-transfers/{id}/acceptance, POST /credit-transfers/{id}/settlement, POST /credit-transfers/{id}/diversion, GET /credit-transfers/{id}/ledger-entries, GET /credit-transfers/{id}/fraud-reviews"
  - priority: 34
    category: existence
    check: "The {id} in /request-for-payments/{id}/... resolves to an existing RequestForPayment"
    error_id: ERR_RFP_NOT_FOUND
    http_status: 404
    applies_to: "GET /request-for-payments/{id}, POST /request-for-payments/{id}/delivery, POST /request-for-payments/{id}/response, POST /request-for-payments/{id}/amendment"
  - priority: 35
    category: existence
    check: "The {id} in /fraud-reviews/{id}/... resolves to an existing FraudReview"
    error_id: ERR_FRAUD_REVIEW_NOT_FOUND
    http_status: 404
    applies_to: "POST /fraud-reviews/{id}/assignment, POST /fraud-reviews/{id}/decision"
  - priority: 36
    category: existence
    check: "The {id} in /return-requests/{id}/... resolves to an existing ReturnRequest"
    error_id: ERR_RETURN_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "GET /return-requests/{id}, POST /return-requests/{id}/honor, POST /return-requests/{id}/decline"
  - priority: 37
    category: existence
    check: "The {id} in /settlement-cycles/{id}/... resolves to an existing SettlementCycle"
    error_id: ERR_SETTLEMENT_CYCLE_NOT_FOUND
    http_status: 404
    applies_to: "GET /settlement-cycles/{id}, POST /settlement-cycles/{id}/cutoff, POST /settlement-cycles/{id}/reconciliation-closure"
  - priority: 38
    category: existence
    check: "The {id} in /reconciliation-runs/{id} resolves to an existing ReconciliationRun"
    error_id: ERR_RECONCILIATION_RUN_NOT_FOUND
    http_status: 404
    applies_to: "GET /reconciliation-runs/{id}"
  - priority: 39
    category: existence
    check: "The {id} in /outage-events/{id}/... resolves to an existing OutageEvent"
    error_id: ERR_OUTAGE_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /outage-events/{id}/resolution"
  - priority: 40
    category: existence
    check: "A participant_id supplied in the request body resolves to an existing Participant"
    error_id: ERR_PARTICIPANT_NOT_FOUND
    http_status: 404
    applies_to: "POST /position-accounts, POST /segment-policies, POST /customer-accounts, POST /credit-transfers (originator_participant_id), POST /request-for-payments (requestor_participant_id), POST /return-requests (requested_by_participant_id), POST /reconciliation-runs, POST /outage-events"
  - priority: 41
    category: existence
    check: "A customer_account_id or debtor_customer_account_id supplied in the request body resolves to an existing CustomerAccount"
    error_id: ERR_CUSTOMER_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "POST /credit-transfers, POST /request-for-payments"
  - priority: 42
    category: existence
    check: "A settlement_cycle_id supplied in the request body resolves to an existing SettlementCycle"
    error_id: ERR_SETTLEMENT_CYCLE_NOT_FOUND
    http_status: 404
    applies_to: "POST /reconciliation-runs"
  - priority: 43
    category: existence
    check: "A credit_transfer_id supplied in the request body resolves to an existing CreditTransfer"
    error_id: ERR_CREDIT_TRANSFER_NOT_FOUND
    http_status: 404
    applies_to: "POST /return-requests"
  - priority: 44
    category: existence
    check: "An optional rfp_id supplied in the request body, when non-null, resolves to an existing RequestForPayment"
    error_id: ERR_RFP_NOT_FOUND
    http_status: 404
    applies_to: "POST /credit-transfers"

  # ---- 45..48: payload shape, enums, ranges, interval well-formedness --------
  - priority: 45
    category: existence
    check: "Every field declared as required input for the endpoint is present, every enum-typed value is a member of its declared enum, and no field has the wrong JSON type"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 46
    category: existence
    check: "Every *_cents amount supplied as input is an integer strictly greater than zero, including the ledger adjustment magnitude_cents whose sign is derived from entry_type rather than supplied; core_deposit_total_cents is the sole exception and may be any signed integer including zero"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /position-accounts, POST /position-accounts/{id}/ledger-adjustments, POST /segment-policies, POST /credit-transfers, POST /request-for-payments, POST /return-requests, POST /reconciliation-runs"
  - priority: 47
    category: existence
    check: "Threshold ordering on a position account is well formed: floor_cents <= critical_threshold_cents <= warning_threshold_cents <= opening_balance_cents; equal adjacent thresholds are accepted"
    error_id: ERR_INVALID_THRESHOLD_ORDERING
    http_status: 422
    applies_to: "POST /position-accounts"
  - priority: 48
    category: existence
    check: "Interval inputs are well formed: a segment policy needs effective_from strictly before effective_to when effective_to is non-null, an outage event needs ended_at strictly after started_at when ended_at is non-null, and a request-for-payment needs expiry_at strictly after the current logical clock"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /segment-policies, POST /outage-events, POST /outage-events/{id}/resolution, POST /request-for-payments"

  # ---- 50..51: optimistic concurrency (see section 1.2.1) --------------------
  - priority: 50
    category: state
    check: "expected_position_account_version equals the current version of the referenced PrefundedPositionAccount"
    error_id: ERR_STALE_POSITION_VERSION
    http_status: 412
    applies_to: "POST /credit-transfers"
  - priority: 51
    category: state
    check: "expected_participant_version equals the current version of the referenced Participant"
    error_id: ERR_STALE_PARTICIPANT_VERSION
    http_status: 412
    applies_to: "POST /segment-policies"

  # ---- 55..64: state preconditions -------------------------------------------
  - priority: 55
    category: state
    check: "The originating or requesting Participant has enrollment_status LIVE (a DRAFT, ATTESTATION_PENDING, CERTIFICATION_TESTING, REMEDIATION, CERTIFIED, SUSPENDED or WITHDRAWN participant cannot originate payment traffic)"
    error_id: ERR_PARTICIPANT_NOT_LIVE
    http_status: 409
    applies_to: "POST /credit-transfers, POST /request-for-payments, POST /return-requests, POST /segment-policies, POST /customer-accounts"
  - priority: 56
    category: state
    check: "The originating Participant's operational_posture is not OFFLINE"
    error_id: ERR_PARTICIPANT_OFFLINE
    http_status: 409
    applies_to: "POST /credit-transfers, POST /request-for-payments"
  - priority: 57
    category: state
    check: "The originating Participant's operational_posture is not SEND_FROZEN. This send-side freeze is a posture check and therefore outranks every liquidity, limit and velocity check below: a frozen participant is told it is frozen, never that it lacks funds."
    error_id: ERR_PARTICIPANT_SEND_FROZEN
    http_status: 409
    applies_to: "POST /credit-transfers"
  - priority: 58
    category: state
    check: "The requested transition is declared for the entity's current state in section 1.2 (for example acceptance only from INITIATED, settlement only from ACCEPTED, certification-results only while CERTIFICATION_TESTING, cutoff only from OPEN, resolution only from DECLARED)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "PATCH /participants/{id}/participation-model, POST /participants/{id}/attestation, POST /participants/{id}/certification-window, POST /participants/{id}/certification-results, POST /participants/{id}/activation, POST /participants/{id}/status-change, POST /credit-transfers/{id}/acceptance, POST /credit-transfers/{id}/settlement, POST /credit-transfers/{id}/diversion, POST /request-for-payments/{id}/delivery, POST /request-for-payments/{id}/response, POST /request-for-payments/{id}/amendment, POST /fraud-reviews/{id}/assignment, POST /fraud-reviews/{id}/decision, POST /return-requests/{id}/honor, POST /return-requests/{id}/decline, POST /settlement-cycles/{id}/cutoff, POST /settlement-cycles/{id}/reconciliation-closure, POST /outage-events/{id}/resolution, POST /liquidity-alerts/{id}/acknowledgement"
  - priority: 59
    category: state
    check: "A FraudReview decision requires status UNDER_REVIEW, which means the review must have been assigned first; deciding a QUEUED review is rejected"
    error_id: ERR_FRAUD_REVIEW_NOT_ASSIGNED
    http_status: 409
    applies_to: "POST /fraud-reviews/{id}/decision"
  - priority: 60
    category: state
    check: "A return request may only be raised against a CreditTransfer whose clearing_status is SETTLED; INITIATED, FRAUD_HOLD, ACCEPTED, QUEUED_THROTTLED, DIVERTED and REJECTED transfers are not returnable"
    error_id: ERR_TRANSFER_NOT_SETTLED
    http_status: 409
    applies_to: "POST /return-requests"
  - priority: 61
    category: state
    check: "A settled credit transfer is irrevocable: no endpoint may cancel, reverse, amend the amount of, or re-settle it; the only permitted remedy is a ReturnRequest that the receiving side may honor or decline"
    error_id: ERR_TRANSFER_IRREVOCABLE
    http_status: 409
    applies_to: "POST /credit-transfers/{id}/acceptance, POST /credit-transfers/{id}/settlement, POST /credit-transfers/{id}/diversion"
  - priority: 62
    category: state
    check: "A LiquidityAlert acknowledgement requires status OPEN or ESCALATED; an alert already ACKNOWLEDGED or CLEARED cannot be acknowledged again"
    error_id: ERR_ALERT_NOT_ACKNOWLEDGEABLE
    http_status: 409
    applies_to: "POST /liquidity-alerts/{id}/acknowledgement"
  - priority: 63
    category: state
    check: "A credit transfer may only be settled while its SettlementCycle for the current business date is OPEN; once the cycle is CUTOFF or later, settlement is closed for that date"
    error_id: ERR_CYCLE_NOT_OPEN
    http_status: 409
    applies_to: "POST /credit-transfers/{id}/settlement"
  - priority: 64
    category: state
    check: "A FINAL reconciliation run requires its SettlementCycle status to be CUTOFF, RECONCILING or OUT_OF_BALANCE; a PROVISIONAL run additionally accepts OPEN. Neither variant is accepted once the cycle is RECONCILED."
    error_id: ERR_CYCLE_NOT_RECONCILABLE
    http_status: 409
    applies_to: "POST /reconciliation-runs"

  # ---- 65..70: business safety, compliance, segregation of duties ------------
  - priority: 65
    category: business_safety
    check: "The originating Participant's participation_model permits sending: RECEIVE_ONLY and RECEIVE_AND_REQUEST_FOR_PAYMENT participants may never originate a credit transfer. This model-capability check is a network compliance rule and therefore outranks every per-transaction, velocity and daily limit check: a receive-only participant is told its model forbids sending, never that it exceeded a limit."
    error_id: ERR_SEND_NOT_PERMITTED_FOR_MODEL
    http_status: 422
    applies_to: "POST /credit-transfers"
  - priority: 66
    category: business_safety
    check: "Requesting payment requires a participation_model of RECEIVE_AND_REQUEST_FOR_PAYMENT or SEND_AND_RECEIVE, and the debtor's participant must be able to receive request-for-payment messages under its own model"
    error_id: ERR_REQUEST_NOT_PERMITTED_FOR_MODEL
    http_status: 422
    applies_to: "POST /request-for-payments"
  - priority: 67
    category: business_safety
    check: "The referenced CustomerAccount status is ACTIVE; a RESTRICTED account can neither originate a transfer nor be named as the debtor of a request for payment"
    error_id: ERR_CUSTOMER_ACCOUNT_RESTRICTED
    http_status: 422
    applies_to: "POST /credit-transfers, POST /request-for-payments"
  - priority: 68
    category: business_safety
    check: "Segregation of duties on fraud review: the X-User-ID taking or deciding a FraudReview must differ from the reviewed CreditTransfer.initiated_by_user_id, and on the decision it must additionally equal FraudReview.assigned_reviewer_user_id"
    error_id: ERR_FRAUD_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /fraud-reviews/{id}/assignment, POST /fraud-reviews/{id}/decision"
  - priority: 69
    category: business_safety
    check: "Segregation of duties on liquidity remediation: the X-User-ID acknowledging a LiquidityAlert must differ from the X-User-ID that posted the ledger adjustment which triggered that alert"
    error_id: ERR_ALERT_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /liquidity-alerts/{id}/acknowledgement"
  - priority: 70
    category: business_safety
    check: "A participant may not be activated unless it has a PrefundedPositionAccount, a recorded attestation_document_reference, and a PASS certification result in its current certification_round"
    error_id: ERR_ACTIVATION_PREREQUISITES_NOT_MET
    http_status: 422
    applies_to: "POST /participants/{id}/activation"

  # ---- 72..76: referential coherence between related rows --------------------
  - priority: 72
    category: business_referential
    check: "The referenced CustomerAccount's participant_id equals the originator_participant_id named in the same request. This rule is deliberately NOT applied to POST /request-for-payments, whose debtor_customer_account_id legitimately belongs to a different participant (the requestor asks another bank's customer to pay)."
    error_id: ERR_CUSTOMER_ACCOUNT_PARTICIPANT_MISMATCH
    http_status: 422
    applies_to: "POST /credit-transfers"
  - priority: 73
    category: business_referential
    check: "A governing CustomerSegmentPolicy exists for the pair (participant, customer account segment) whose half-open effective window contains the current logical clock and whose superseded_at is null"
    error_id: ERR_NO_GOVERNING_SEGMENT_POLICY
    http_status: 422
    applies_to: "POST /credit-transfers"
  - priority: 74
    category: business_referential
    check: "When rfp_id is supplied, the referenced RequestForPayment has status ACCEPTED, its debtor_customer_account_id equals the transfer's customer_account_id, and the transfer amount_cents equals the request amount_cents exactly"
    error_id: ERR_RFP_FULFILMENT_MISMATCH
    http_status: 422
    applies_to: "POST /credit-transfers"
  - priority: 75
    category: business_referential
    check: "A return request may only be raised by the participant on the receiving side of the transfer, which is the participant whose routing_number equals CreditTransfer.receiver_routing_number; the originator cannot request a return of its own payment"
    error_id: ERR_RETURN_REQUESTOR_NOT_RECEIVER
    http_status: 422
    applies_to: "POST /return-requests"
  - priority: 76
    category: business_referential
    check: "returned_amount_cents, when supplied, is greater than zero and less than or equal to the original transfer amount_cents; when omitted it defaults to the full original amount"
    error_id: ERR_RETURN_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /return-requests"
  - priority: 77
    category: business_referential
    check: "A reconciliation run's participant must have a PrefundedPositionAccount, since the rail net position is computed against that account's ledger"
    error_id: ERR_POSITION_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "POST /reconciliation-runs"

  # ---- 80..86: temporal windows, overlaps, deadlines -------------------------
  - priority: 80
    category: business_temporal
    check: "The logical clock may only move forward or stay put: a POST /_clock/set_current_utc whose target instant precedes the currently stored instant is rejected"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"
  - priority: 81
    category: business_temporal
    check: "A return request must be raised within RETURN_REQUEST_WINDOW_MINUTES (4320) of CreditTransfer.settled_at; the window is half-open, so a request at exactly settled_at + 4320 minutes is too late while one at 4319 minutes is in time"
    error_id: ERR_RETURN_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /return-requests"
  - priority: 82
    category: business_temporal
    check: "A new CustomerSegmentPolicy must not overlap any non-superseded policy for the same (participant_id, segment) pair. Windows are half-open [effective_from, effective_to), so a policy starting exactly when the incumbent ends is adjacent and accepted, while one starting one minute earlier overlaps and is rejected. A null effective_to is an open-ended window that overlaps everything after its effective_from, unless the request carries supersede_open_ended true, which closes the incumbent at the new effective_from and so removes the overlap."
    error_id: ERR_POLICY_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /segment-policies"
  - priority: 83
    category: business_temporal
    check: "A new OutageEvent must not conflict with an existing event of overlapping scope. Outage intervals are CLOSED on both ends [started_at, ended_at], so touching endpoints DO conflict. A RESOLVED event additionally reserves OUTAGE_STABILIZATION_BUFFER_MINUTES (15) after its ended_at: the reservation is the half-open range (ended_at, ended_at + 15 minutes), so a new event of the same scope starting at exactly ended_at + 15 minutes is admitted while one starting at ended_at + 14 minutes is rejected. A NETWORK_WIDE event overlaps every PARTICIPANT-scoped event and vice versa."
    error_id: ERR_OUTAGE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /outage-events"
  - priority: 84
    category: business_temporal
    check: "A request-for-payment response, amendment or fulfilling credit transfer is refused once the current logical clock has reached the applicable closing instant: expiry_at for every one of the three operations, and additionally response_deadline_at (= min(expiry_at, delivered_at plus RFP_RESPONSE_SLA_MINUTES)) for POST /request-for-payments/{id}/response. Both comparisons are >=, so an operation at exactly the closing instant is late."
    error_id: ERR_RFP_EXPIRED
    http_status: 422
    applies_to: "POST /request-for-payments/{id}/response, POST /request-for-payments/{id}/amendment, POST /credit-transfers"
  - priority: 85
    category: business_temporal
    check: "A return request response is refused once the current logical clock has reached ReturnRequest.response_deadline_at (the request creation instant plus RETURN_RESPONSE_SLA_MINUTES); the comparison is >=, so an honor at exactly the deadline is late"
    error_id: ERR_RETURN_RESPONSE_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /return-requests/{id}/honor, POST /return-requests/{id}/decline"
  - priority: 86
    category: business_temporal
    check: "A SettlementCycle's business_date must not be in the future relative to the UTC date of the current logical clock, and a cutoff may only be taken on or after the cycle's business_date"
    error_id: ERR_BUSINESS_DATE_NOT_REACHED
    http_status: 422
    applies_to: "POST /settlement-cycles, POST /settlement-cycles/{id}/cutoff"

  # ---- 88..95: uniqueness, capability limits, velocity controls --------------
  - priority: 88
    category: business_constraint
    check: "Participant.routing_number is unique across all participants"
    error_id: ERR_DUPLICATE_ROUTING_NUMBER
    http_status: 409
    applies_to: "POST /participants"
  - priority: 89
    category: business_constraint
    check: "A Participant has at most one PrefundedPositionAccount, and CustomerAccount.account_reference is unique within a participant"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /position-accounts, POST /customer-accounts"
  - priority: 90
    category: business_constraint
    check: "SettlementCycle.business_date is unique across all cycles, and at most one ReconciliationRun per (settlement_cycle_id, participant_id, variant) may exist per revision - a repeat request creates the next revision rather than failing"
    error_id: ERR_DUPLICATE_SETTLEMENT_CYCLE
    http_status: 409
    applies_to: "POST /settlement-cycles"
  - priority: 91
    category: business_constraint
    check: "The exception dimension of a CreditTransfer is one-shot: a second ReturnRequest is refused while the first is still REQUESTED and also once the transfer's exception_status has reached any of the terminal exception states RETURN_HONORED, RETURN_DECLINED or RETURN_EXPIRED. Only a transfer whose exception_status is still NONE may be lodged against."
    error_id: ERR_DUPLICATE_RETURN_REQUEST
    http_status: 409
    applies_to: "POST /return-requests"
  - priority: 92
    category: business_constraint
    check: "amount_cents must not exceed the governing CustomerSegmentPolicy.per_transaction_limit_cents; the comparison is <=, so an amount exactly equal to the limit is admitted"
    error_id: ERR_PER_TRANSACTION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /credit-transfers"
  - priority: 93
    category: business_constraint
    check: "While the originating Participant's operational_posture is THROTTLED, amount_cents must not exceed THROTTLED_PER_TXN_CAP_CENTS (50000000) even when the segment policy would permit more"
    error_id: ERR_THROTTLED_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /credit-transfers"
  - priority: 94
    category: business_constraint
    check: "Velocity controls over the 60-minute half-open window ending at the current logical clock: the count of the customer account's prior countable transfers plus one must not exceed rolling_window_count_limit, and their summed amount plus this amount must not exceed rolling_window_amount_limit_cents. Count is checked before amount."
    error_id: ERR_VELOCITY_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /credit-transfers"
  - priority: 95
    category: business_constraint
    check: "calculations.customer_daily_sent_usage.daily_exposure_cents plus amount_cents must not exceed the governing policy's daily_aggregate_limit_cents for the current business date"
    error_id: ERR_DAILY_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /credit-transfers"
  - priority: 96
    category: business_constraint
    check: "A request-for-payment may pass through at most MAX_AMENDMENT_ROUNDS (2) amendments; a third POST /request-for-payments/{id}/amendment is refused even though the state machine permits the AMENDMENT_REQUESTED -> DELIVERED hop"
    error_id: ERR_AMENDMENT_ROUNDS_EXHAUSTED
    http_status: 422
    applies_to: "POST /request-for-payments/{id}/amendment"

  # ---- 97..99: fiscal / liquidity capacity (checked last) --------------------
  - priority: 97
    category: business_fiscal
    check: "A new PrefundedPositionAccount must open with opening_balance_cents >= MIN_PREFUND_CENTS (100000000)"
    error_id: ERR_PREFUND_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /position-accounts"
  - priority: 98
    category: business_fiscal
    check: "A ledger adjustment must not drive current_balance_cents below zero; the resulting balance may fall below floor_cents (which raises a BREACH alert) but never below zero"
    error_id: ERR_LEDGER_ADJUSTMENT_WOULD_GO_NEGATIVE
    http_status: 422
    applies_to: "POST /position-accounts/{id}/ledger-adjustments"
  - priority: 99
    category: business_fiscal
    check: "The originating account must have available_cents - amount_cents >= floor_cents; the comparison is >=, so a transfer that lands available_cents exactly on floor_cents is admitted while one cent more is refused"
    error_id: ERR_INSUFFICIENT_LIQUIDITY
    http_status: 422
    applies_to: "POST /credit-transfers"
  - priority: 100
    category: business_fiscal
    check: "A settlement cycle may only be closed when the latest FINAL ReconciliationRun (highest revision) for every LIVE participant has outcome BALANCED"
    error_id: ERR_VARIANCE_UNRESOLVED
    http_status: 409
    applies_to: "POST /settlement-cycles/{id}/reconciliation-closure"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving surface (underscore namespace) ---------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, expiry, window and business-date rule reads. Before the first call the clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. The clock may only move forward or stay put."
    roles: [NetworkOperator]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["logical clock advanced; no entity is mutated and no sweep is performed"]
  - method: POST
    path: "/network-sweeps"
    description: "Run the network housekeeping sweep at the current logical clock: expire request-for-payments past expiry_at, expire return requests past response_deadline_at, expire QUEUED_THROTTLED transfers whose queued_at is older than QUEUE_TTL_MINUTES, and escalate OPEN liquidity alerts older than ACK_SLA_MINUTES."
    roles: [NetworkOperator]
    code: 200
    input: []
    output:
      expired_rfp_count: integer
      expired_return_request_count: integer
      expired_transfer_count: integer
      escalated_alert_count: integer
    side_effects:
      - "RequestForPayment CREATED/DELIVERED/AMENDMENT_REQUESTED -> EXPIRED when clock >= expiry_at"
      - "ReturnRequest REQUESTED -> EXPIRED and the transfer's exception_status -> RETURN_EXPIRED when clock >= response_deadline_at"
      - "CreditTransfer QUEUED_THROTTLED -> EXPIRED when clock >= queued_at + QUEUE_TTL_MINUTES, releasing its reserved_cents"
      - "LiquidityAlert OPEN -> ESCALATED with escalated_at stamped when clock >= created_at + ACK_SLA_MINUTES"
      - "calculations.position_balance_and_availability and operational_posture_derivation re-run for every affected account"

  # ---- participant enrollment and lifecycle ---------------------------------
  - method: POST
    path: "/participants"
    description: "Enrol a bank into the instant payments network in DRAFT status with the requested participation model."
    roles: [NetworkOperator]
    code: 201
    input: [legal_name, routing_number, settlement_agent_reference, "participation_model?"]
    output: Participant
    side_effects: ["Participant created with enrollment_status DRAFT, operational_posture NORMAL, certification_round 0"]
  - method: GET
    path: "/participants/{id}"
    description: "Read a participant, including its derived operational_posture."
    roles: [NetworkOperator, ParticipantAdmin, LiquidityOfficer, PaymentOperator, FraudReviewer, CoreBankingSystem]
    code: 200
    input: []
    output: Participant
    side_effects: []
  - method: PATCH
    path: "/participants/{id}/participation-model"
    description: "Change the requested participation model. Permitted only while enrollment_status is DRAFT, ATTESTATION_PENDING or REMEDIATION; a LIVE participant must withdraw and re-enrol to change model."
    roles: [ParticipantAdmin]
    code: 200
    input: [participation_model]
    output: Participant
    side_effects: ["Participant.participation_model replaced; version incremented"]
  - method: POST
    path: "/participants/{id}/attestation"
    description: "File the operational readiness attestation, moving DRAFT -> ATTESTATION_PENDING."
    roles: [ParticipantAdmin]
    code: 200
    input: [attestation_document_reference]
    output: Participant
    side_effects: ["enrollment_status DRAFT -> ATTESTATION_PENDING; attestation_document_reference stored"]
  - method: POST
    path: "/participants/{id}/certification-window"
    description: "Open a certification testing window, moving ATTESTATION_PENDING or REMEDIATION -> CERTIFICATION_TESTING and incrementing certification_round."
    roles: [NetworkOperator]
    code: 200
    input: [certification_test_suite_version]
    output: Participant
    side_effects: ["enrollment_status -> CERTIFICATION_TESTING; certification_round incremented by 1; certification_test_suite_version stored"]
  - method: POST
    path: "/participants/{id}/certification-results"
    description: "Record the outcome of the open certification window: PASS moves to CERTIFIED, FAIL moves to REMEDIATION so the participant can re-enter testing."
    roles: [NetworkOperator]
    code: 200
    input: [outcome]
    output: Participant
    side_effects: ["enrollment_status CERTIFICATION_TESTING -> CERTIFIED on PASS, -> REMEDIATION on FAIL"]
  - method: POST
    path: "/participants/{id}/activation"
    description: "Take a CERTIFIED participant live. Requires a prefunded position account, a filed attestation, and a PASS in the current certification round."
    roles: [NetworkOperator]
    code: 200
    input: [go_live_business_date]
    output: Participant
    side_effects:
      - "enrollment_status CERTIFIED -> LIVE; go_live_business_date stored"
      - "calculations.operational_posture_derivation re-run so posture reflects the current alert_tier"
  - method: POST
    path: "/participants/{id}/status-change"
    description: "Suspend, reinstate or withdraw a participant."
    roles: [NetworkOperator]
    code: 200
    input: [target_status, "suspension_reason?"]
    output: Participant
    side_effects:
      - "enrollment_status moves per the section 1.2 Participant lifecycle machine"
      - "SUSPENDED forces operational_posture SEND_FROZEN and parks the participant's INITIATED transfers as QUEUED_THROTTLED"
      - "reinstatement to LIVE re-derives posture and runs calculations.throttled_release_waterfall"
  - method: GET
    path: "/participants/{id}/position-accounts"
    description: "List the participant's prefunded position accounts (zero or one)."
    roles: [NetworkOperator, ParticipantAdmin, LiquidityOfficer, CoreBankingSystem]
    code: 200
    input: []
    output: PrefundedPositionAccount[]
    side_effects: []
  - method: GET
    path: "/participants/{id}/segment-policies"
    description: "List the participant's customer segment policies, newest effective_from first."
    roles: [NetworkOperator, ParticipantAdmin, PaymentOperator]
    code: 200
    input: ["segment?", "limit?", "offset?"]
    output: CustomerSegmentPolicy[]
    side_effects: []
  - method: GET
    path: "/participants/{id}/customer-accounts"
    description: "List the participant's customer accounts."
    roles: [NetworkOperator, ParticipantAdmin, PaymentOperator, FraudReviewer]
    code: 200
    input: ["segment?", "status?", "limit?", "offset?"]
    output: CustomerAccount[]
    side_effects: []
  - method: GET
    path: "/participants/{id}/outage-events"
    description: "List outage events scoped to this participant."
    roles: [NetworkOperator, ParticipantAdmin, PaymentOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OutageEvent[]
    side_effects: []

  # ---- prefunded liquidity -------------------------------------------------
  - method: POST
    path: "/position-accounts"
    description: "Open the participant's prefunded position account with its alerting thresholds. The opening deposit is recorded as the account's opening_balance_cents and is not a ledger entry."
    roles: [LiquidityOfficer]
    code: 201
    input: [participant_id, opening_balance_cents, warning_threshold_cents, critical_threshold_cents, floor_cents]
    output: PrefundedPositionAccount
    side_effects:
      - "calculations.position_balance_and_availability seeds current_balance_cents, reserved_cents 0 and available_cents"
      - "calculations.liquidity_alert_tier sets alert_tier; a non-GREEN tier immediately opens a LiquidityAlert"
      - "calculations.operational_posture_derivation re-runs for the owning participant"
  - method: GET
    path: "/position-accounts/{id}"
    description: "Read the position account with its live balance, reservations and alert tier. Read this immediately before an optimistic-concurrency write to obtain a fresh version."
    roles: [NetworkOperator, LiquidityOfficer, ParticipantAdmin, PaymentOperator]
    code: 200
    input: []
    output: PrefundedPositionAccount
    side_effects: []
  - method: POST
    path: "/position-accounts/{id}/ledger-adjustments"
    description: "Post a funding or withdrawal entry against the prefunded position: FUNDING_CREDIT and RETURN_CREDIT are positive, WITHDRAWAL_DEBIT is negative, and the signed amount_cents is derived from entry_type and the supplied magnitude."
    roles: [LiquidityOfficer]
    code: 201
    input: [entry_type, magnitude_cents, "reference?"]
    output: LiquidityLedgerEntry
    side_effects:
      - "LiquidityLedgerEntry appended with the next sequence_no and balance_after_cents; account.last_ledger_sequence_no advanced"
      - "calculations.position_balance_and_availability and liquidity_alert_tier re-run on the account"
      - "a tier downgrade opens a LiquidityAlert; a return to GREEN clears every non-CLEARED alert on the account"
      - "calculations.operational_posture_derivation re-runs, which may park siblings as QUEUED_THROTTLED or run calculations.throttled_release_waterfall"
  - method: GET
    path: "/position-accounts/{id}/ledger-entries"
    description: "List the account's liquidity ledger entries in ascending sequence_no order."
    roles: [NetworkOperator, LiquidityOfficer, ParticipantAdmin, CoreBankingSystem]
    code: 200
    input: ["entry_type?", "business_date?", "related_transfer_id?", "limit?", "offset?"]
    output: LiquidityLedgerEntry[]
    side_effects: []
  - method: GET
    path: "/position-accounts/{id}/alerts"
    description: "List the liquidity alerts raised on this account, newest first."
    roles: [NetworkOperator, LiquidityOfficer, ParticipantAdmin]
    code: 200
    input: ["status?", "tier?", "limit?", "offset?"]
    output: LiquidityAlert[]
    side_effects: []
  - method: GET
    path: "/position-accounts/{id}/liquidity-projection"
    description: "Twenty-four-hour forward liquidity projection over the half-open window [clock_now, clock_now + 24h) per calculations.liquidity_projection_24h."
    roles: [NetworkOperator, LiquidityOfficer, ParticipantAdmin]
    code: 200
    input: []
    output:
      current_balance_cents: integer
      reserved_cents: integer
      available_cents: integer
      scheduled_outflow_cents: integer
      expected_inflow_cents: integer
      projected_balance_cents: integer
      projected_available_cents: integer
      projected_alert_tier: string
      horizon_end: datetime
    side_effects: []
  - method: POST
    path: "/liquidity-alerts/{id}/acknowledgement"
    description: "Acknowledge an OPEN or ESCALATED liquidity alert with a remediation plan. The acknowledging user must not be the user who posted the adjustment that raised the alert."
    roles: [LiquidityOfficer]
    code: 200
    input: [remediation_plan]
    output: LiquidityAlert
    side_effects: ["LiquidityAlert status -> ACKNOWLEDGED; acknowledged_by_user_id set from X-User-ID; the alert tier and the participant's posture are unchanged by acknowledgement"]

  # ---- limits and customer accounts ------------------------------------------
  - method: POST
    path: "/segment-policies"
    description: "Publish a transaction-limit and velocity policy for one customer segment over a half-open effective window. Requires the caller to pin the participant's current version."
    roles: [ParticipantAdmin]
    code: 201
    input: [participant_id, segment, per_transaction_limit_cents, daily_aggregate_limit_cents, rolling_window_count_limit, rolling_window_amount_limit_cents, effective_from, "effective_to?", "supersede_open_ended?", expected_participant_version]
    output: CustomerSegmentPolicy
    side_effects:
      - "CustomerSegmentPolicy created; overlapping non-superseded windows for the same (participant, segment) are rejected rather than merged"
      - "supersede_open_ended true closes the incumbent open-ended policy of the same (participant, segment): its effective_to is set to the new policy's effective_from and superseded_at is stamped with the current clock, turning what would have been an overlap into adjacency"
      - "Participant.version incremented, so a second publication must re-read the participant"
  - method: POST
    path: "/customer-accounts"
    description: "Register a customer deposit account eligible for instant payments, with its segment and fraud risk baseline."
    roles: [ParticipantAdmin]
    code: 201
    input: [participant_id, segment, account_reference, fraud_risk_baseline]
    output: CustomerAccount
    side_effects: ["CustomerAccount created ACTIVE with daily_sent_amount_cents 0"]
  - method: GET
    path: "/customer-accounts/{id}"
    description: "Read a customer account, including its rolling daily sent total."
    roles: [NetworkOperator, ParticipantAdmin, PaymentOperator, FraudReviewer]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: []

  # ---- credit transfers ------------------------------------------------------
  - method: POST
    path: "/credit-transfers"
    description: "Originate an instant credit transfer. Runs the full validation ladder of section 1.4, then calculations.fraud_score variant ORIGINATION, which may park the transfer in FRAUD_HOLD or reject it outright. Requires the caller to pin the position account's current version."
    roles: [PaymentOperator]
    code: 201
    input: [originator_participant_id, customer_account_id, receiver_routing_number, amount_cents, "rfp_id?", "remittance_reference?", expected_position_account_version]
    output: CreditTransfer
    side_effects:
      - "CreditTransfer created with direction OUTBOUND, clearing_status INITIATED, exception_status NONE, segment_policy_id resolved by calculations.governing_segment_policy_selection, initiated_by_user_id from X-User-ID"
      - "calculations.fraud_score (ORIGINATION) freezes fraud_score and fraud_reason_codes"
      - "a score in [FRAUD_HOLD_THRESHOLD, FRAUD_BLOCK_THRESHOLD) moves clearing_status to FRAUD_HOLD and creates a FraudReview in QUEUED"
      - "a score >= FRAUD_BLOCK_THRESHOLD moves clearing_status to REJECTED with rejection_reason_code FRAUD_BLOCK_AUTOMATIC and restricts the CustomerAccount"
      - "calculations.position_balance_and_availability re-runs so reserved_cents covers the new in-flight amount"
      - "calculations.customer_daily_sent_usage re-runs: the new in-flight row raises daily_exposure_cents, while CustomerAccount.daily_sent_amount_cents stays unchanged until settlement"
      - "PrefundedPositionAccount.version incremented, so a follow-up transfer must re-read the account"
  - method: GET
    path: "/credit-transfers/{id}"
    description: "Read a credit transfer with its clearing and exception dimensions, frozen fraud score and reason codes."
    roles: [NetworkOperator, PaymentOperator, ParticipantAdmin, FraudReviewer, CoreBankingSystem]
    code: 200
    input: []
    output: CreditTransfer
    side_effects: []
  - method: GET
    path: "/credit-transfers"
    description: "List credit transfers with filters; this is the discovery channel for cascade-created compensating transfers."
    roles: [NetworkOperator, PaymentOperator, ParticipantAdmin, FraudReviewer, CoreBankingSystem]
    code: 200
    input: ["originator_participant_id?", "customer_account_id?", "segment_policy_id?", "rfp_id?", "compensating_for_transfer_id?", "clearing_status?", "exception_status?", "settlement_business_date?", "limit?", "offset?"]
    output: CreditTransfer[]
    side_effects: []
  - method: POST
    path: "/credit-transfers/{id}/acceptance"
    description: "Rail acceptance of an INITIATED transfer by the receiving side. Requires the originating participant to be LIVE with posture NORMAL or THROTTLED."
    roles: [NetworkOperator]
    code: 200
    input: []
    output: CreditTransfer
    side_effects: ["clearing_status INITIATED -> ACCEPTED; accepted_at and irrevocable_at stamped with the current clock; the amount stays inside reserved_cents"]
  - method: POST
    path: "/credit-transfers/{id}/settlement"
    description: "Settle an ACCEPTED transfer against the prefunded position, stamping it with the open cycle's business date. This is the irrevocability point after which only a return request can move money back."
    roles: [NetworkOperator]
    code: 200
    input: []
    output: CreditTransfer
    side_effects:
      - "clearing_status ACCEPTED -> SETTLED; settled_at stamped; settlement_business_date set to the OPEN cycle's business_date"
      - "cascade hop 1: LiquidityLedgerEntry TRANSFER_DEBIT posted for -amount_cents with related_transfer_id set"
      - "cascade hop 2: calculations.position_balance_and_availability lowers current_balance_cents and releases the reservation; liquidity_alert_tier re-derives alert_tier"
      - "cascade hop 3: a tier downgrade opens a LiquidityAlert"
      - "cascade hop 4: calculations.operational_posture_derivation may move the participant to THROTTLED or SEND_FROZEN"
      - "cascade hop 5: a SEND_FROZEN posture parks the participant's remaining INITIATED transfers as QUEUED_THROTTLED with queued_at stamped"
      - "CustomerAccount.daily_sent_amount_cents recomputed by calculations.customer_daily_sent_usage, rising by amount_cents"
      - "SettlementCycle.settled_transfer_count recomputed"
  - method: POST
    path: "/credit-transfers/{id}/diversion"
    description: "Divert a queued transfer to the fallback rail declared by an open outage event, so payment obligations survive an instant-rail outage."
    roles: [NetworkOperator, PaymentOperator]
    code: 200
    input: [fallback_rail]
    output: CreditTransfer
    side_effects:
      - "clearing_status QUEUED_THROTTLED -> DIVERTED; rail set to the fallback rail; reserved_cents released"
      - "the covering OutageEvent.diverted_transfer_count incremented"
  - method: GET
    path: "/credit-transfers/{id}/ledger-entries"
    description: "List the liquidity ledger entries generated by this transfer, in ascending sequence_no order: the settlement debit and, when a return was honored, the compensating credit."
    roles: [NetworkOperator, LiquidityOfficer, PaymentOperator, CoreBankingSystem]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: LiquidityLedgerEntry[]
    side_effects: []
  - method: GET
    path: "/credit-transfers/{id}/fraud-reviews"
    description: "List the fraud reviews raised for this transfer, newest first. This is the only discovery channel for the review created by the origination cascade."
    roles: [NetworkOperator, FraudReviewer, PaymentOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FraudReview[]
    side_effects: []
  - method: POST
    path: "/fraud-reviews/{id}/assignment"
    description: "Take a QUEUED fraud review into UNDER_REVIEW, binding the acting reviewer to it."
    roles: [FraudReviewer]
    code: 200
    input: []
    output: FraudReview
    side_effects: ["status QUEUED -> UNDER_REVIEW; assigned_reviewer_user_id set from X-User-ID; sla_deadline_at stamped at the assignment clock plus ACK_SLA_MINUTES (60)"]
  - method: POST
    path: "/fraud-reviews/{id}/decision"
    description: "Decide a review under segregation of duties: the reviewer must be the assignee and must not be the user who originated the transfer. Recomputes calculations.fraud_score variant REVIEW_FINAL before applying the decision."
    roles: [FraudReviewer]
    code: 200
    input: [decision, "decision_rationale?"]
    output: FraudReview
    side_effects:
      - "calculations.fraud_score (REVIEW_FINAL) writes final_fraud_score on the review"
      - "RELEASE: review -> RELEASED and CreditTransfer FRAUD_HOLD -> INITIATED, re-entering the normal clearing path"
      - "BLOCK: review -> BLOCKED, CreditTransfer -> REJECTED with rejection_reason_code FRAUD_BLOCK_REVIEW, reserved_cents released, CustomerAccount -> RESTRICTED with restricted_at stamped, and the account's other INITIATED transfers parked as QUEUED_THROTTLED"

  # ---- request for payment ---------------------------------------------------
  - method: POST
    path: "/request-for-payments"
    description: "Raise a request for payment against a debtor customer account, with a hard expiry the debtor side must answer before."
    roles: [PaymentOperator]
    code: 201
    input: [requestor_participant_id, debtor_customer_account_id, amount_cents, expiry_at, "memo?"]
    output: RequestForPayment
    side_effects: ["RequestForPayment created in CREATED with amendment_round 0"]
  - method: GET
    path: "/request-for-payments/{id}"
    description: "Read a request for payment with its response state and deadline."
    roles: [NetworkOperator, PaymentOperator, ParticipantAdmin]
    code: 200
    input: []
    output: RequestForPayment
    side_effects: []
  - method: GET
    path: "/request-for-payments"
    description: "List requests for payment with filters."
    roles: [NetworkOperator, PaymentOperator, ParticipantAdmin, LiquidityOfficer]
    code: 200
    input: ["requestor_participant_id?", "debtor_customer_account_id?", "status?", "limit?", "offset?"]
    output: RequestForPayment[]
    side_effects: []
  - method: POST
    path: "/request-for-payments/{id}/delivery"
    description: "Deliver the request to the debtor side, starting the message response obligation clock."
    roles: [NetworkOperator]
    code: 200
    input: []
    output: RequestForPayment
    side_effects: ["status CREATED -> DELIVERED; delivered_at stamped; response_deadline_at set to min(expiry_at, delivered_at + RFP_RESPONSE_SLA_MINUTES)"]
  - method: POST
    path: "/request-for-payments/{id}/response"
    description: "Discharge the debtor side's message response obligation with ACCEPT, DECLINE or REQUEST_AMENDMENT. A DELIVERED request can cycle back through amendment any number of times up to MAX_AMENDMENT_ROUNDS."
    roles: [PaymentOperator]
    code: 200
    input: [response, "decline_reason_code?"]
    output: RequestForPayment
    side_effects:
      - "status DELIVERED -> ACCEPTED, DECLINED or AMENDMENT_REQUESTED; last_response recorded"
      - "an ACCEPTED request becomes payable exactly once via POST /credit-transfers with rfp_id set"
  - method: POST
    path: "/request-for-payments/{id}/amendment"
    description: "Re-deliver an amended request after the debtor asked for a change, moving AMENDMENT_REQUESTED back to DELIVERED."
    roles: [PaymentOperator]
    code: 200
    input: [amount_cents, "memo?"]
    output: RequestForPayment
    side_effects:
      - "status AMENDMENT_REQUESTED -> DELIVERED; amount_cents replaced; amendment_round incremented; last_response cleared"
      - "response_deadline_at re-derived from the current clock; expiry_at is never extended by an amendment"

  # ---- returns and exception handling ---------------------------------------
  - method: POST
    path: "/return-requests"
    description: "Ask the originating side to return a settled credit transfer. This is the only remedy against an irrevocable settled payment; it never cancels the original transfer."
    roles: [PaymentOperator]
    code: 201
    input: [credit_transfer_id, requested_by_participant_id, reason_code, "returned_amount_cents?", "narrative?"]
    output: ReturnRequest
    side_effects:
      - "ReturnRequest created in REQUESTED with original_amount_cents copied from the transfer and response_deadline_at set to clock + RETURN_RESPONSE_SLA_MINUTES"
      - "CreditTransfer.exception_status NONE -> RETURN_REQUESTED, leaving clearing_status SETTLED untouched"
  - method: GET
    path: "/return-requests/{id}"
    description: "Read a return request with its response deadline and outcome."
    roles: [NetworkOperator, PaymentOperator, ParticipantAdmin]
    code: 200
    input: []
    output: ReturnRequest
    side_effects: []
  - method: GET
    path: "/return-requests"
    description: "List return requests with filters; this is the discovery channel for the honored_transfer_id linkage."
    roles: [NetworkOperator, PaymentOperator, ParticipantAdmin, CoreBankingSystem]
    code: 200
    input: ["credit_transfer_id?", "honored_transfer_id?", "requested_by_participant_id?", "status?", "limit?", "offset?"]
    output: ReturnRequest[]
    side_effects: []
  - method: POST
    path: "/return-requests/{id}/honor"
    description: "Honor the return by originating a compensating inbound credit transfer that settles immediately, restoring the prefunded position without violating irrevocability of the original."
    roles: [NetworkOperator]
    code: 200
    input: []
    output: ReturnRequest
    side_effects:
      - "cascade hop 1: ReturnRequest status REQUESTED -> HONORED and the original CreditTransfer.exception_status -> RETURN_HONORED"
      - "cascade hop 2: a compensating CreditTransfer is created with direction INBOUND, clearing_status SETTLED, compensating_for_transfer_id pointing at the original, amount returned_amount_cents, and no fraud scoring"
      - "cascade hop 3: LiquidityLedgerEntry RETURN_CREDIT posted for +returned_amount_cents; calculations.position_balance_and_availability raises current_balance_cents"
      - "cascade hop 4: calculations.liquidity_alert_tier re-derives the tier and a return to GREEN clears every non-CLEARED LiquidityAlert on the account"
      - "cascade hop 5: calculations.operational_posture_derivation lifts SEND_FROZEN, then calculations.throttled_release_waterfall releases queued transfers in priority order"
      - "the original row leaves the daily-sent input set because its exception_status became RETURN_HONORED, so CustomerAccount.daily_sent_amount_cents recomputes down by the original amount_cents, restoring the pre-transfer velocity headroom"
  - method: POST
    path: "/return-requests/{id}/decline"
    description: "Decline the return request with a reason code, leaving the original settled transfer final."
    roles: [NetworkOperator]
    code: 200
    input: [decline_reason_code]
    output: ReturnRequest
    side_effects: ["ReturnRequest status REQUESTED -> DECLINED; original CreditTransfer.exception_status -> RETURN_DECLINED; no money moves and no ledger entry is written"]

  # ---- settlement and reconciliation ---------------------------------------
  - method: POST
    path: "/settlement-cycles"
    description: "Open the settlement cycle for a business date. Exactly one cycle exists per business date."
    roles: [NetworkOperator]
    code: 201
    input: [business_date]
    output: SettlementCycle
    side_effects: ["SettlementCycle created in OPEN with assessed_fee_total_cents 0 and settled_transfer_count 0"]
  - method: GET
    path: "/settlement-cycles/{id}"
    description: "Read a settlement cycle with its assessed fee total and settled transfer count."
    roles: [NetworkOperator, LiquidityOfficer, CoreBankingSystem, ParticipantAdmin]
    code: 200
    input: []
    output: SettlementCycle
    side_effects: []
  - method: POST
    path: "/settlement-cycles/{id}/cutoff"
    description: "Take the cycle cutoff: close the date for settlement and assess each LIVE participant's intraday liquidity access fee per calculations.intraday_liquidity_access_fee."
    roles: [NetworkOperator]
    code: 200
    input: []
    output: SettlementCycle
    side_effects:
      - "status OPEN -> CUTOFF; cutoff_at stamped"
      - "cascade hop 1: for each LIVE participant in created_at ascending order, calculations.intraday_liquidity_access_fee computes net_fee_cents"
      - "cascade hop 2: a positive net fee posts a LiquidityLedgerEntry FEE_DEBIT of -net_fee_cents; a zero net fee posts nothing"
      - "cascade hop 3: calculations.position_balance_and_availability, liquidity_alert_tier and operational_posture_derivation re-run per affected account"
      - "SettlementCycle.assessed_fee_total_cents set to the sum of assessed net fees"
  - method: POST
    path: "/settlement-cycles/{id}/reconciliation-closure"
    description: "Close a reconciled cycle. Permitted only when the highest-revision FINAL reconciliation run of every LIVE participant reports BALANCED."
    roles: [NetworkOperator]
    code: 200
    input: []
    output: SettlementCycle
    side_effects: ["status RECONCILING -> RECONCILED; closed_at stamped; the cycle becomes terminal and rejects further cutoff or reconciliation runs"]
  - method: POST
    path: "/reconciliation-runs"
    description: "Reconcile the core deposit system's view of a participant's position against the rail's, in either the PROVISIONAL or the FINAL variant per calculations.reconciliation_variance."
    roles: [CoreBankingSystem]
    code: 201
    input: [settlement_cycle_id, participant_id, variant, core_deposit_total_cents]
    output: ReconciliationRun
    side_effects:
      - "ReconciliationRun created with revision one greater than the newest run for the same (cycle, participant, variant) triple"
      - "rail_net_position_cents, variance_cents, outcome, included_transfer_count and fee_component_cents computed by the requested variant"
      - "a FINAL run moves the cycle CUTOFF -> RECONCILING, and an OUT_OF_BALANCE outcome moves RECONCILING -> OUT_OF_BALANCE"
      - "a superseding FINAL run that returns every LIVE participant to BALANCED moves OUT_OF_BALANCE -> RECONCILING"
      - "a PROVISIONAL run never changes the cycle status"
  - method: GET
    path: "/reconciliation-runs/{id}"
    description: "Read a reconciliation run with its computed variance and outcome."
    roles: [NetworkOperator, CoreBankingSystem, LiquidityOfficer, ParticipantAdmin]
    code: 200
    input: []
    output: ReconciliationRun
    side_effects: []
  - method: GET
    path: "/reconciliation-runs"
    description: "List reconciliation runs with filters, ascending by revision within a triple."
    roles: [NetworkOperator, CoreBankingSystem, LiquidityOfficer, ParticipantAdmin]
    code: 200
    input: ["settlement_cycle_id?", "participant_id?", "variant?", "outcome?", "limit?", "offset?"]
    output: ReconciliationRun[]
    side_effects: []

  # ---- outage contingency ----------------------------------------------------
  - method: POST
    path: "/outage-events"
    description: "Declare an instant-rail outage over a closed time interval with a fallback rail, taking the affected participants offline for origination."
    roles: [NetworkOperator]
    code: 201
    input: [scope, severity, fallback_rail, started_at, "participant_id?", "ended_at?"]
    output: OutageEvent
    side_effects:
      - "OutageEvent created in DECLARED"
      - "cascade hop 1: every participant in scope moves operational_posture to OFFLINE"
      - "cascade hop 2: their INITIATED transfers are parked as QUEUED_THROTTLED with queued_at stamped, awaiting diversion or release"
  - method: POST
    path: "/outage-events/{id}/resolution"
    description: "Resolve a declared outage, restoring normal or liquidity-derived posture and releasing the queue. The resolved interval reserves a stabilization buffer during which no new outage of the same scope may start."
    roles: [NetworkOperator]
    code: 200
    input: [ended_at]
    output: OutageEvent
    side_effects:
      - "status DECLARED -> RESOLVED; ended_at recorded"
      - "cascade hop 1: calculations.operational_posture_derivation re-derives each in-scope participant's posture from its alert_tier"
      - "cascade hop 2: calculations.throttled_release_waterfall releases queued transfers in priority order for every participant that came back to NORMAL or THROTTLED"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- authentication / authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role not declared in section 1.7"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The caller's role is not listed in the invoked endpoint's roles"
  - id: ERR_PARTICIPANT_SCOPE_VIOLATION
    http: 403
    condition: "A ParticipantAdmin acted on a resource belonging to a participant other than its own X-User-ID"
  - id: ERR_FRAUD_SEGREGATION_OF_DUTIES
    http: 403
    condition: "A fraud review assignment or decision was attempted by the transfer's originating user, or a decision was attempted by a reviewer who is not the assigned reviewer"
  - id: ERR_ALERT_SEGREGATION_OF_DUTIES
    http: 403
    condition: "A liquidity alert acknowledgement was attempted by the same user whose ledger adjustment raised the alert"

  # ---- not found -------------------------------------------------------------
  - id: ERR_PARTICIPANT_NOT_FOUND
    http: 404
    condition: "No Participant exists for the id in the path or in a participant_id body field"
  - id: ERR_POSITION_ACCOUNT_NOT_FOUND
    http: 404
    condition: "No PrefundedPositionAccount exists for the id in the path, or the participant named in a reconciliation run has no position account"
  - id: ERR_LIQUIDITY_ALERT_NOT_FOUND
    http: 404
    condition: "No LiquidityAlert exists for the id in the path"
  - id: ERR_CUSTOMER_ACCOUNT_NOT_FOUND
    http: 404
    condition: "No CustomerAccount exists for the id in the path or in a customer_account_id / debtor_customer_account_id body field"
  - id: ERR_CREDIT_TRANSFER_NOT_FOUND
    http: 404
    condition: "No CreditTransfer exists for the id in the path or in a credit_transfer_id body field"
  - id: ERR_RFP_NOT_FOUND
    http: 404
    condition: "No RequestForPayment exists for the id in the path or in a non-null rfp_id body field"
  - id: ERR_FRAUD_REVIEW_NOT_FOUND
    http: 404
    condition: "No FraudReview exists for the id in the path"
  - id: ERR_RETURN_REQUEST_NOT_FOUND
    http: 404
    condition: "No ReturnRequest exists for the id in the path"
  - id: ERR_SETTLEMENT_CYCLE_NOT_FOUND
    http: 404
    condition: "No SettlementCycle exists for the id in the path or in a settlement_cycle_id body field"
  - id: ERR_RECONCILIATION_RUN_NOT_FOUND
    http: 404
    condition: "No ReconciliationRun exists for the id in the path"
  - id: ERR_OUTAGE_EVENT_NOT_FOUND
    http: 404
    condition: "No OutageEvent exists for the id in the path"

  # ---- payload shape ---------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required input field is missing, an enum value is outside its declared set, a JSON type is wrong, or a magnitude/amount that must be positive is zero or negative"
  - id: ERR_INVALID_THRESHOLD_ORDERING
    http: 422
    condition: "Position account thresholds violate floor_cents <= critical_threshold_cents <= warning_threshold_cents <= opening_balance_cents"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "effective_from is not strictly before effective_to, ended_at is not strictly after started_at, or a request-for-payment expiry_at is not strictly after the current logical clock"

  # ---- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_POSITION_VERSION
    http: 412
    condition: "expected_position_account_version does not equal the current version of the referenced PrefundedPositionAccount, so the caller's view of the prefunded position is out of date"
  - id: ERR_STALE_PARTICIPANT_VERSION
    http: 412
    condition: "expected_participant_version does not equal the current version of the referenced Participant, so the caller's view of the participant's enrollment and policy set is out of date"

  # ---- state preconditions ---------------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The requested transition is not declared for the entity's current state in section 1.2, including a second application of the same trigger and any attempt to leave a terminal state"
  - id: ERR_PARTICIPANT_NOT_LIVE
    http: 409
    condition: "The acting participant's enrollment_status is not LIVE"
  - id: ERR_PARTICIPANT_OFFLINE
    http: 409
    condition: "The acting participant's operational_posture is OFFLINE because an outage event covering it is DECLARED"
  - id: ERR_PARTICIPANT_SEND_FROZEN
    http: 409
    condition: "The acting participant's operational_posture is SEND_FROZEN because its prefunded position sits at or below the critical threshold, or because it is suspended; this outranks every liquidity, limit and velocity check"
  - id: ERR_FRAUD_REVIEW_NOT_ASSIGNED
    http: 409
    condition: "A fraud review decision was attempted while the review status is still QUEUED"
  - id: ERR_TRANSFER_NOT_SETTLED
    http: 409
    condition: "A return request was raised against a transfer whose clearing_status is not SETTLED"
  - id: ERR_TRANSFER_IRREVOCABLE
    http: 409
    condition: "An acceptance, settlement or diversion was attempted on an already SETTLED transfer; a settled instant credit transfer can only be remedied by a return request"
  - id: ERR_ALERT_NOT_ACKNOWLEDGEABLE
    http: 409
    condition: "A liquidity alert acknowledgement was attempted while the alert status is ACKNOWLEDGED or CLEARED"
  - id: ERR_CYCLE_NOT_OPEN
    http: 409
    condition: "A settlement was attempted while no SettlementCycle for the current business date is OPEN"
  - id: ERR_CYCLE_NOT_RECONCILABLE
    http: 409
    condition: "A reconciliation run was requested against a cycle whose status does not admit the requested variant, including any run against a RECONCILED cycle"
  - id: ERR_VARIANCE_UNRESOLVED
    http: 409
    condition: "Cycle closure was attempted while at least one LIVE participant's highest-revision FINAL reconciliation run reports OUT_OF_BALANCE"

  # ---- participation model, compliance, safety -------------------------------
  - id: ERR_SEND_NOT_PERMITTED_FOR_MODEL
    http: 422
    condition: "A credit transfer origination was attempted by a participant whose participation_model is RECEIVE_ONLY or RECEIVE_AND_REQUEST_FOR_PAYMENT; this compliance check outranks per-transaction, velocity and daily limit checks"
  - id: ERR_REQUEST_NOT_PERMITTED_FOR_MODEL
    http: 422
    condition: "A request for payment was raised by a participant whose participation_model does not include the request capability, or against a debtor whose participant cannot receive requests"
  - id: ERR_CUSTOMER_ACCOUNT_RESTRICTED
    http: 422
    condition: "The referenced CustomerAccount status is RESTRICTED"
  - id: ERR_ACTIVATION_PREREQUISITES_NOT_MET
    http: 422
    condition: "Activation was attempted without a prefunded position account, without a filed attestation, or without a PASS result in the current certification round"

  # ---- referential coherence -------------------------------------------------
  - id: ERR_CUSTOMER_ACCOUNT_PARTICIPANT_MISMATCH
    http: 422
    condition: "The referenced customer account belongs to a different participant than the one named in the request"
  - id: ERR_NO_GOVERNING_SEGMENT_POLICY
    http: 422
    condition: "No non-superseded CustomerSegmentPolicy for the (participant, segment) pair has a half-open effective window containing the current logical clock"
  - id: ERR_RFP_FULFILMENT_MISMATCH
    http: 422
    condition: "The referenced request for payment is not ACCEPTED, names a different debtor customer account, or its amount_cents differs from the transfer amount"
  - id: ERR_RETURN_REQUESTOR_NOT_RECEIVER
    http: 422
    condition: "The requesting participant is not the receiving side of the transfer, identified by routing_number equal to CreditTransfer.receiver_routing_number"
  - id: ERR_RETURN_AMOUNT_INVALID
    http: 422
    condition: "returned_amount_cents is zero, negative, or greater than the original transfer amount_cents"

  # ---- temporal --------------------------------------------------------------
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "A logical clock set was requested to an instant strictly before the currently stored instant"
  - id: ERR_RETURN_WINDOW_EXPIRED
    http: 422
    condition: "A return request was raised at or after settled_at plus RETURN_REQUEST_WINDOW_MINUTES"
  - id: ERR_POLICY_WINDOW_OVERLAP
    http: 409
    condition: "A new segment policy's half-open effective window overlaps a non-superseded policy for the same (participant, segment) pair; adjacency where one window's effective_to equals the next window's effective_from is not an overlap"
  - id: ERR_OUTAGE_WINDOW_CONFLICT
    http: 409
    condition: "A new outage event's closed interval touches or overlaps an existing event of the same scope, or starts inside the OUTAGE_STABILIZATION_BUFFER_MINUTES window that follows a RESOLVED event's ended_at"
  - id: ERR_RFP_EXPIRED
    http: 422
    condition: "A response, amendment or fulfilling transfer was attempted at or after the request for payment's expiry_at, or a response was attempted at or after its response_deadline_at"
  - id: ERR_RETURN_RESPONSE_DEADLINE_PASSED
    http: 422
    condition: "An honor or decline was attempted at or after the return request's response_deadline_at"
  - id: ERR_BUSINESS_DATE_NOT_REACHED
    http: 422
    condition: "A settlement cycle was opened for a business date after the current logical clock's UTC date, or a cutoff was attempted before the cycle's business date"

  # ---- uniqueness ------------------------------------------------------------
  - id: ERR_DUPLICATE_ROUTING_NUMBER
    http: 409
    condition: "Another Participant already holds the supplied routing_number"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "The participant already has a PrefundedPositionAccount, or the supplied account_reference already exists within the participant"
  - id: ERR_DUPLICATE_SETTLEMENT_CYCLE
    http: 409
    condition: "A SettlementCycle already exists for the supplied business_date"
  - id: ERR_DUPLICATE_RETURN_REQUEST
    http: 409
    condition: "The transfer already carries a REQUESTED return request, or its exception_status has already reached RETURN_HONORED, RETURN_DECLINED or RETURN_EXPIRED"

  # ---- limits, velocity, liquidity capacity ---------------------------------
  - id: ERR_PER_TRANSACTION_LIMIT_EXCEEDED
    http: 422
    condition: "amount_cents exceeds the governing segment policy's per_transaction_limit_cents"
  - id: ERR_THROTTLED_CAP_EXCEEDED
    http: 422
    condition: "amount_cents exceeds THROTTLED_PER_TXN_CAP_CENTS while the originating participant's posture is THROTTLED"
  - id: ERR_VELOCITY_LIMIT_EXCEEDED
    http: 422
    condition: "The customer account's 60-minute rolling window would exceed rolling_window_count_limit or rolling_window_amount_limit_cents"
  - id: ERR_DAILY_LIMIT_EXCEEDED
    http: 422
    condition: "daily_exposure_cents plus amount_cents exceeds the governing policy's daily_aggregate_limit_cents"
  - id: ERR_AMENDMENT_ROUNDS_EXHAUSTED
    http: 422
    condition: "A request for payment has already been amended MAX_AMENDMENT_ROUNDS times"
  - id: ERR_PREFUND_BELOW_MINIMUM
    http: 422
    condition: "opening_balance_cents is below MIN_PREFUND_CENTS"
  - id: ERR_LEDGER_ADJUSTMENT_WOULD_GO_NEGATIVE
    http: 422
    condition: "The adjustment would drive current_balance_cents below zero"
  - id: ERR_INSUFFICIENT_LIQUIDITY
    http: 422
    condition: "available_cents minus amount_cents would fall below floor_cents"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NetworkOperator
    description: "The instant payments rail operator: enrols and certifies participants, drives clearing and settlement, runs cycles, declares outages, and adjudicates return requests."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /network-sweeps"
      - "POST /participants"
      - "POST /participants/{id}/certification-window"
      - "POST /participants/{id}/certification-results"
      - "POST /participants/{id}/activation"
      - "POST /participants/{id}/status-change"
      - "POST /credit-transfers/{id}/acceptance"
      - "POST /credit-transfers/{id}/settlement"
      - "POST /request-for-payments/{id}/delivery"
      - "POST /return-requests/{id}/honor"
      - "POST /return-requests/{id}/decline"
      - "POST /settlement-cycles"
      - "POST /settlement-cycles/{id}/cutoff"
      - "POST /settlement-cycles/{id}/reconciliation-closure"
      - "POST /outage-events"
      - "POST /outage-events/{id}/resolution"
    shared_operations:
      - "POST /credit-transfers/{id}/diversion (with PaymentOperator)"
      - "every GET read endpoint"
  - name: ParticipantAdmin
    description: "A participating bank's own administrator: files attestations, chooses the participation model before go-live, publishes segment limit policies, and registers customer accounts. Acts only within its own participant."
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "PATCH /participants/{id}/participation-model"
      - "POST /participants/{id}/attestation"
      - "POST /segment-policies"
      - "POST /customer-accounts"
    shared_operations:
      - "GET /participants/{id} and its sub-resource lists, scoped to its own participant"
      - "GET /position-accounts/{id}, GET /customer-accounts/{id}, GET /credit-transfers, GET /request-for-payments, GET /return-requests, GET /reconciliation-runs, GET /settlement-cycles/{id}, scoped to its own participant"
  - name: LiquidityOfficer
    description: "Treasury operator responsible for twenty-four-hour liquidity monitoring: opens prefunded position accounts, posts funding and withdrawal entries, and acknowledges liquidity alerts with a remediation plan."
    identity: opaque
    exclusive_operations:
      - "POST /position-accounts"
      - "POST /position-accounts/{id}/ledger-adjustments"
      - "POST /liquidity-alerts/{id}/acknowledgement"
    shared_operations:
      - "GET /position-accounts/{id}, GET /position-accounts/{id}/ledger-entries, GET /position-accounts/{id}/alerts, GET /position-accounts/{id}/liquidity-projection"
      - "GET /participants/{id}, GET /participants/{id}/position-accounts, GET /request-for-payments, GET /settlement-cycles/{id}, GET /reconciliation-runs"
  - name: PaymentOperator
    description: "Payment operations staff who originate credit transfers, raise and answer requests for payment, and lodge return requests on the receiving side."
    identity: opaque
    exclusive_operations:
      - "POST /credit-transfers"
      - "POST /request-for-payments"
      - "POST /request-for-payments/{id}/response"
      - "POST /request-for-payments/{id}/amendment"
      - "POST /return-requests"
    shared_operations:
      - "POST /credit-transfers/{id}/diversion (with NetworkOperator)"
      - "GET /participants/{id} and its segment-policy, customer-account and outage-event lists"
      - "GET /credit-transfers, GET /credit-transfers/{id}, GET /credit-transfers/{id}/ledger-entries, GET /credit-transfers/{id}/fraud-reviews, GET /customer-accounts/{id}, GET /request-for-payments, GET /return-requests"
  - name: FraudReviewer
    description: "Fraud analyst who works the hold-and-review queue. Under segregation of duties a reviewer may never decide a transfer it originated, and only the assigned reviewer may decide."
    identity: opaque
    exclusive_operations:
      - "POST /fraud-reviews/{id}/assignment"
      - "POST /fraud-reviews/{id}/decision"
    shared_operations:
      - "GET /credit-transfers/{id}, GET /credit-transfers, GET /credit-transfers/{id}/fraud-reviews, GET /customer-accounts/{id}, GET /participants/{id}, GET /participants/{id}/customer-accounts"
  - name: CoreBankingSystem
    description: "The bank's core deposit platform, which submits its own view of each participant's position for reconciliation against the rail."
    identity: opaque
    exclusive_operations:
      - "POST /reconciliation-runs"
    shared_operations:
      - "GET /reconciliation-runs, GET /reconciliation-runs/{id}, GET /settlement-cycles/{id}"
      - "GET /credit-transfers, GET /credit-transfers/{id}, GET /credit-transfers/{id}/ledger-entries, GET /position-accounts/{id}/ledger-entries, GET /participants/{id}, GET /participants/{id}/position-accounts, GET /return-requests"
