        distinguishing_aspect: "Packing an event whose order has a TEFAP-sourced line for a CERTIFIED-but-not-tefap_eligible household is blocked with ERR_HOUSEHOLD_NOT_CERTIFIED (the TEFAP-specific arm of priority 8)."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / event_pack_requires_household_certified
          rationale: "The household-certification gate at event pack (ERR_HOUSEHOLD_NOT_CERTIFIED, priority 8) is already exercised as the failure path of the named §1.8 instance."

      - name: fair_share_exceeded_on_over_cap_order
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_FAIR_SHARE_EXCEEDED]
        distinguishing_aspect: "Approving an order requesting 7501 against a 7500 cap returns ERR_FAIR_SHARE_EXCEEDED."
        test_recipe:
          setup:
            - "Two ACTIVE agencies (A weight 3, B weight 1); cycle pool 10000 opened (cap A = 7500). Order requests 7501."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency A", service_area: "County-A", fair_share_weight: 3 }
              as: AllocationManager
              captures: { agency_a: $.data.id }
            - call: "POST /agencies"
              payload: { name: "Agency B", service_area: "County-B", fair_share_weight: 1 }
              as: AllocationManager
              captures: { agency_b: $.data.id }
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 20000 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 9000, expiration_date: "2026-09-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /allocation-cycles"
              payload: { label: "2026-W48", total_pool_lbs: 10000 }
              as: AllocationManager
              captures: { cycle_id: $.data.id }
            - call: "POST /allocation-cycles/${cycle_id}/open"
              payload: {}
              as: AllocationManager
            - call: "POST /agency-orders"
              payload: { agency_id: "${agency_a}", allocation_cycle_id: "${cycle_id}", lines: [ { food_category: "PRODUCE", requested_lbs: 7501 } ] }
              as: AgencyCoordinator
              as_user_id: "${agency_a}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /agency-orders/${order_id}/approve"
              payload: { expected_lot_version: "${lot_v}" }
              as: AllocationManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and response error_id == ERR_FAIR_SHARE_EXCEEDED"

      - name: cold_storage_capacity_exceeded_alone
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_COLD_STORAGE_CAPACITY_EXCEEDED]
        distinguishing_aspect: "Capacity-exceeded on intake is already asserted by the §1.8 aggregate-occupancy overlap instance."
        excluded_because:
          difficulty_instance: resource_temporal_overlap / cold_storage_capacity_aggregate_occupancy_overlap
          rationale: "ERR_COLD_STORAGE_CAPACITY_EXCEEDED is the asserted failure of the named §1.8 overlap instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: approve_response_reflects_reservation_immediately
        claim_type: immediate
        grounds:
          - state_machines.AgencyOrder.SUBMITTED_to_APPROVED
          - entities.AgencyOrder.fields.approved_lbs
        distinguishing_aspect: "The approve response immediately carries approved_lbs and APPROVED status (consistency_model: immediate) — no re-read needed."
        test_recipe:
          setup:
            - "A submitted order against a 500-lb PRODUCE lot in an OPEN cycle."
          setup_api_calls:
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 5000 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 500, expiration_date: "2026-07-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /agencies"
              payload: { name: "Pantry Z", service_area: "County-26", fair_share_weight: 1 }
              as: AllocationManager
              captures: { agency_id: $.data.id }
            - call: "POST /allocation-cycles"
              payload: { label: "2026-W49", total_pool_lbs: 10000 }
              as: AllocationManager
              captures: { cycle_id: $.data.id }
            - call: "POST /allocation-cycles/${cycle_id}/open"
              payload: {}
              as: AllocationManager
            - call: "POST /agency-orders"
              payload: { agency_id: "${agency_id}", allocation_cycle_id: "${cycle_id}", lines: [ { food_category: "PRODUCE", requested_lbs: 250 } ] }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /agency-orders/${order_id}/approve"
              payload: { expected_lot_version: "${lot_v}" }
              as: AllocationManager
              captures: { st: $.data.status, approved: $.data.approved_lbs }
          assert:
            - "AgencyOrder.status == APPROVED and approved_lbs == 250.00 in the same response"
