              payload: { payment_at: "2026-08-05T00:00:00Z", cure_amount_cents: 3000000 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
          assert:
            - "returns 200 with DefaultNotice.${notice_id}.status == LESSEE_CURED and cured_by == LESSEE"
            - "LeaseholdMortgage.${m1_id}.status == RECORDED and LeaseholdMortgage.${m2_id}.status == RECORDED, both with mortgagee_notified_at back to null"
            - "Lease.${lease_id}.lease_status == ACTIVE and arrears_balance_cents == 1000000 (4000000 - 3000000, not floored to 0)"
            - "the mortgages' outstanding_principal_cents are untouched at 3000000 and 2000000"

      - name: termination_voids_open_statements_but_spares_final_assessed_ones
        claim_type: conditional_cascade
        grounds:
          - state_machines.PercentageRentStatement.to_VOID_on_lease_termination
          - state_machines.PercentageRentStatement.terminal_states
          - endpoints.POST_/portfolio/default-notices/{id}/terminate
        distinguishing_aspect: |
          The termination cascade is status-filtered: only SUBMITTED and PROVISIONAL_ASSESSED statements
          are voided, and a FINAL_ASSESSED statement is terminal and must survive with its assessed
          figures intact. Voiding it would also silently orphan the 3500000 it already posted to arrears,
          which must remain on the ledger after termination.
        test_recipe:
          setup:
            - "One lease with statement A audited to FINAL_ASSESSED, statement B left SUBMITTED, and a MONETARY notice whose lessee window has lapsed."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-94", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
            - call: "GET /portfolio/leases/${lease_id}"
              payload: {}
              as: LeaseAccountant
              as_user_id: "acct-1"
              captures: { lease_v1: $.data.version }
            - call: "POST /portfolio/percentage-rent-statements"
              payload: { lease_id: "${lease_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", reported_gross_sales_cents: 200000000, expected_lease_version: "${lease_v1}" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { stmt_a: $.data.id }
            - call: "GET /portfolio/leases/${lease_id}"
              payload: {}
              as: LeaseAccountant
              as_user_id: "acct-1"
              captures: { lease_v2: $.data.version }
            - call: "POST /portfolio/percentage-rent-statements"
              payload: { lease_id: "${lease_id}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", reported_gross_sales_cents: 100000000, expected_lease_version: "${lease_v2}" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { stmt_b: $.data.id }
            - call: "POST /portfolio/percentage-rent-statements/${stmt_a}/assess"
              payload: {}
              as: LeaseAccountant
              as_user_id: "acct-1"
            - call: "POST /portfolio/percentage-rent-statements/${stmt_a}/audit"
              payload: { audited_gross_sales_cents: 200000000 }
              as: LeaseAccountant
              as_user_id: "acct-1"
            - call: "POST /portfolio/leases/${lease_id}/default-notices"
              payload: { default_type: "MONETARY_RENT_ARREARS", claimed_amount_cents: 3500000 }
              as: AssetManager
              as_user_id: "am-1"
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: LessorAdmin
            - call: "POST /portfolio/administration-runs"
              payload: {}
              as: LessorAdmin
          trigger:
            - call: "POST /portfolio/default-notices/${notice_id}/terminate"
              payload: {}
              as: LeaseAccountant
              as_user_id: "acct-1"
          assert:
            - "after setup: PercentageRentStatement.${stmt_a}.status == FINAL_ASSESSED with amount_due_cents 3500000 and underreport_penalty_cents 0; ${stmt_b}.status == SUBMITTED; Lease.${lease_id}.arrears_balance_cents == 3500000; DefaultNotice.${notice_id}.status == LESSEE_CURE_LAPSED"
            - "trigger returns 200 with status TERMINATION_EFFECTED and terminated_by_user_id acct-1"
            - "PercentageRentStatement.${stmt_b}.status == VOID"
            - "PercentageRentStatement.${stmt_a}.status is still FINAL_ASSESSED with amount_due_cents still 3500000 - the cascade skipped it"
            - "Lease.${lease_id}.lease_status == TERMINATED, rent_status == FROZEN and arrears_balance_cents still 3500000"

      - name: lease_parallel_axes_move_independently_corner
        claim_type: parallel
        excluded_because:
          difficulty_instance: lease_parallel_axes_tenancy_and_rent_move_independently
          rationale: |
            The parallel-shape claim - the two Lease dimensions (lease_status and rent_status) advancing
            without dragging each other, and only coupling when the tenancy axis reaches TERMINATED or
            EXPIRED - is exactly the named §1.8 non_linear_state_machine instance, which drives a
            revaluation through a default and back and asserts the full 2x2 combined state.

      - name: revaluation_round_cycle_terminates_corner
        claim_type: cyclic
        excluded_because:
          difficulty_instance: revaluation_round_cycle_reopens_then_refuses_a_third_round
          rationale: |
            The cyclic-shape claim - looping PROPOSALS_EXCHANGED -> OPEN_FOR_APPRAISALS and respecting the
            MAX_NEGOTIATION_ROUNDS termination condition - is the named §1.8 instance, which walks round 1
            to round 2 and shows the third request refused.

      - name: guarded_cross_entity_transitions_corner
        claim_type: guarded_transitions
        excluded_because:
          difficulty_instance: arbitration_referral_blocked_while_the_lease_sits_in_default
          rationale: |
            The guarded-transition claim - "A -> B only if entity C is in state X" - is covered three
            times over by the §1.8 cross_entity_state_dependency instances
            (arbitration_referral_blocked_while_the_lease_sits_in_default,
            alteration_approval_blocked_until_the_casualty_election_is_made and
            estoppel_certificate_blocked_while_a_revaluation_is_in_arbitration), each asserting the
            ERR_CROSS_ENTITY_BLOCKED refusal and the unchanged guarded row.

      - name: cross_entity_side_effect_reversal_corner
        claim_type: cross_entity
        excluded_because:
          difficulty_instance: condemnation_allocation_rescinded_restores_arrears_and_every_mortgage_principal_exactly
          rationale: |
            The cross-entity side-effect claim - a LossEvent transition adjusting Lease and
            LeaseholdMortgage rows, verified on the other entities' states and fields - is the named §1.8
            compensating_invariant instance, which asserts every mortgage principal and the lease ledger
            both after allocation and after the rescission that must restore them byte-for-byte.

  - section: calculations
    instances:
      - name: revaluation_indicated_rent_clamped_by_both_collar_bounds
        claim_type: constants_applied
        grounds:
          - calculations.revaluation_reset_rent
          - state_machines.RentRevaluation.PROPOSALS_EXCHANGED_to_RESOLVED
        distinguishing_aspect: |
          The collar is expressed in basis points of uplift over the PRIOR rent, not as absolute bounds,
          and it bites in both directions on the same 10000000 prior rent: a midpoint of 10200000 is
          raised to the 11000000 floor (+1000 bps) and a midpoint of 25000000 is cut to the 15000000
          ceiling (+5000 bps). An implementation that only floors, only caps, or reads the bps off the
          indicated rent instead of the prior rent fails one of the two halves.
        test_recipe:
          setup:
            - "Two leases, each with a PROPOSALS_EXCHANGED revaluation: lease F at 10400000 / 10000000 (midpoint under the floor) and lease C at 30000000 / 20000000 (midpoint over the ceiling)."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-95", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_f: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-96", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 20000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_c: $.data.id }
            - call: "POST /portfolio/leases/${lease_f}/rent-revaluations"
              payload: { valuation_date: "2027-06-01T00:00:00Z" }
              as: LessorAdmin
              captures: { reval_f: $.data.id }
            - call: "POST /portfolio/rent-revaluations/${reval_f}/appraisals"
              payload: { appointed_by: "LESSOR", appraised_annual_rent_cents: 10400000, valuation_method_code: "COMPARABLE_LAND" }
              as: LessorAdmin
              as_user_id: "appraiser-lessor-1"
            - call: "POST /portfolio/rent-revaluations/${reval_f}/appraisals"
              payload: { appointed_by: "LESSEE", appraised_annual_rent_cents: 10000000, valuation_method_code: "INCOME_CAP" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /portfolio/rent-revaluations/${reval_f}/exchange"
              payload: {}
              as: LessorAdmin
            - call: "POST /portfolio/leases/${lease_c}/rent-revaluations"
              payload: { valuation_date: "2027-06-01T00:00:00Z" }
              as: LessorAdmin
              captures: { reval_c: $.data.id }
            - call: "POST /portfolio/rent-revaluations/${reval_c}/appraisals"
              payload: { appointed_by: "LESSOR", appraised_annual_rent_cents: 30000000, valuation_method_code: "COMPARABLE_LAND" }
              as: LessorAdmin
              as_user_id: "appraiser-lessor-1"
            - call: "POST /portfolio/rent-revaluations/${reval_c}/appraisals"
              payload: { appointed_by: "LESSEE", appraised_annual_rent_cents: 20000000, valuation_method_code: "INCOME_CAP" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /portfolio/rent-revaluations/${reval_c}/exchange"
              payload: {}
              as: LessorAdmin
          trigger:
            - call: "POST /portfolio/rent-revaluations/${reval_f}/settle"
              payload: {}
              as: LessorAdmin
            - call: "POST /portfolio/rent-revaluations/${reval_c}/settle"
              payload: {}
              as: LessorAdmin
          assert:
            - "trigger[0] returns 200 with resolved_annual_base_rent_cents == 11000000 (midpoint 10200000 raised to 10000000 + 1000 bps) and resolution_method MIDPOINT_SETTLEMENT"
            - "Lease.${lease_f}.current_annual_base_rent_cents == 11000000 and rent_status == RESET_APPLIED"
            - "trigger[1] returns 200 with resolved_annual_base_rent_cents == 15000000 (midpoint 25000000 cut to 20000000 + 5000 bps)"
            - "Lease.${lease_c}.current_annual_base_rent_cents == 15000000 and rent_status == RESET_APPLIED"
            - "RentRevaluation.${reval_f}.divergence_bps == 400 and RentRevaluation.${reval_c}.divergence_bps == 5000"

      - name: revaluation_midpoint_inside_the_collar_is_left_unclamped
        claim_type: correct_result
        grounds:
          - calculations.revaluation_reset_rent
        distinguishing_aspect: |
          With appraisals of 12000000 and 10500000 the midpoint is 11250000, which sits between the
          11000000 floor and the 15000000 ceiling and must pass through untouched - the collar is not a
          rounding target. The divergence on the same row exercises the round_half_up on a non-terminating
          quotient: 1500000 * 10000 / 10500000 == 1428.57..., so 1429, not 1428 and not 1428.57.
        test_recipe:
          setup:
            - "One lease with a PROPOSALS_EXCHANGED revaluation at 12000000 / 10500000."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
