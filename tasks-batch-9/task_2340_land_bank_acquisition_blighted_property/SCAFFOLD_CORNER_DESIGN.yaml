            - "DispositionApplication.${app3_id}.status == DRAFT and Property.${p3_id}.custody_status == LISTED"

      - name: state_gate_outranks_funding_gate_on_board_approval
        claim_type: priority_ordering
        grounds:
          - validations[priority=96]
          - validations[priority=98]
        excluded_because:
          difficulty_instance: state_precondition_outranks_funding_insufficiency
          rationale: "The ladder claim - a CONSTRAINED source with too little money violates both priority 96 and priority 98 and the caller must see ERR_FUNDING_CONSTRAINED - is the §1.8 priority-pair fixture; a second copy here would assert the identical ordering on the identical endpoint."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: acquisition_packet_crud_create_read_and_filtered_list
        claim_type: standard_crud
        grounds:
          - endpoints[POST /land-bank/acquisition-packets]
          - endpoints[GET /land-bank/acquisition-packets/{id}]
          - endpoints[GET /land-bank/acquisition-packets]
        distinguishing_aspect: "The packet resource supports the whole read path: creation echoes the channel-conditional fields, GET by id returns the stored row, and the collection endpoint composes two filters (funding_source_id plus status) with limit 1 so that total_count is 2 while only one row comes back."
        test_recipe:
          setup:
            - "One funding source and two parcels, each with a DUE_DILIGENCE packet drawn on that source: one TAX_FORECLOSURE (with foreclosure_case_no) and one DONATION (with donor_name)."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Packet CRUD Line", source_type: "GENERAL_FUND", authorized_cents: 900000, restriction: "ACQUISITION_ONLY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-203220", address: "3220 Viburnum Ln", situs_ward: 5, lot_area_sqft: 6000, assessed_value_cents: 250000, structure_present: true, structure_condition_grade: "C", vacancy_months: 3 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p1_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-203221", address: "3221 Viburnum Ln", situs_ward: 5, lot_area_sqft: 6000, assessed_value_cents: 250000, structure_present: false, structure_condition_grade: "C", vacancy_months: 3 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p2_id: $.data.id }
          trigger:
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p1_id}", funding_source_id: "${fs_id}", channel: "TAX_FORECLOSURE", offer_price_cents: 0, title_search_fee_cents: 6000, foreclosure_case_no: "CV-2026-3220" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk1_id: $.data.id, pk1_status: $.data.status, pk1_case: $.data.foreclosure_case_no, pk1_donor: $.data.donor_name }
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p2_id}", funding_source_id: "${fs_id}", channel: "DONATION", offer_price_cents: 0, title_search_fee_cents: 0, donor_name: "Viburnum Family Trust" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk2_id: $.data.id, pk2_donor: $.data.donor_name }
            - call: "GET /land-bank/acquisition-packets/${pk1_id}"
              payload: {}
              as: CountyTreasurer
              as_user_id: "treas-1"
              captures: { got_id: $.data.id, got_property: $.data.property_id, got_fee: $.data.title_search_fee_cents }
            - call: "GET /land-bank/acquisition-packets?funding_source_id=${fs_id}&status=DUE_DILIGENCE&limit=1&offset=0"
              payload: { funding_source_id: "${fs_id}", status: "DUE_DILIGENCE", limit: 1, offset: 0 }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { first_pk: "$.data[0].id", total: $.meta.total_count, more: $.meta.has_more }
          assert:
            - "HTTP 201 twice; ${pk1_status} == DUE_DILIGENCE, ${pk1_case} == CV-2026-3220 and ${pk1_donor} == null"
            - "${pk2_donor} == 'Viburnum Family Trust'  # the conditional-required field is stored per channel"
            - "HTTP 200 and ${got_id} == ${pk1_id} and ${got_property} == ${p1_id} and ${got_fee} == 6000"
            - "${first_pk} == ${pk1_id}  # oldest first"
            - "${total} == 2 and ${more} == true  # both packets match the filter pair, one page of 1 was returned"

      - name: inventory_summary_computed_read_reconciles_ward_and_ledger
