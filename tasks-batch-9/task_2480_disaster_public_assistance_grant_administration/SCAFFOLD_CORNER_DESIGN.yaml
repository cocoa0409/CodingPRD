          assert:
            - "Applicant.${applicant_t_id}.risk_score_screening == 58.00"
            - "Applicant.${applicant_t_id}.risk_tier == MEDIUM (58.00 >= 30 and < 60)"
            - "Applicant.${applicant_t_id}.risk_score_monitoring == null and monitoring_scored_at == null"
            - "Applicant.${applicant_n_id}.risk_score_screening == 18.00 (0.30 * 60 with no facilities)"
            - "Applicant.${applicant_n_id}.risk_tier == LOW"
            - "both applicants have eligibility_status == ELIGIBLE, monitoring_status == STANDARD and drawdown_status == ACTIVE"

      - name: eligible_cost_provisional_and_final_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.project_eligible_cost.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / project_eligible_cost_provisional_vs_final_divergence
          rationale: "That §1.8 instance asserts both stored variants and their delta on the same project after actuals and a settlement diverge from the estimate and the anticipated proceeds."

      - name: risk_score_variant_is_selected_by_context
        claim_type: variant_selection
        grounds:
          - calculations.applicant_risk_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / applicant_risk_score_screening_vs_monitoring_divergence
          rationale: "That §1.8 instance runs the SCREENING variant at eligibility determination and the MONITORING variant at the reporting sweep and asserts which score drives risk_tier."

      - name: federal_share_per_component_rounding
        claim_type: precision
        grounds:
          - calculations.federal_share_obligation
        excluded_because:
          difficulty_instance: combinatorial_formula / federal_share_obligation_per_component_rounding_order
          rationale: "That §1.8 instance pins the two independent round_half_up operations and shows the one-cent difference from rounding the summed components once."

      - name: mitigation_cap_percentage_selected_by_size_class
        claim_type: threshold
        grounds:
          - calculations.mitigation_cap_allocation
        excluded_because:
          difficulty_instance: combinatorial_formula / mitigation_cap_allocation_pinned_evaluation_order
          rationale: "That §1.8 instance pins the evaluation order in which size_class selects the cap percentage and is never re-derived from the mitigation-inclusive total."

      - name: small_project_threshold_boundary_value
        claim_type: threshold
        grounds:
          - calculations.project_review_basis
        excluded_because:
          difficulty_instance: boundary_precision_check / repair_basis_exactly_at_small_project_threshold_is_large
          rationale: "That §1.8 instance tests a repair basis exactly equal to small_project_threshold_cents and asserts LARGE, plus the value one cent below."

      - name: labor_three_component_rounding_and_fringe_cap
        claim_type: correct_result
        grounds:
          - calculations.cost_line_item_eligible_cost
        excluded_because:
          difficulty_instance: combinatorial_formula / cost_line_item_labor_branch_nonlinear_interaction
          rationale: "That §1.8 instance drives the work_type x employee_type matrix with the fringe cap and the three separate roundings."

      - name: cash_ledger_running_total_after_reversal
        claim_type: aggregation
        grounds:
          - calculations.applicant_grant_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / cash_ledger_conserved_by_full_drawdown_refund
          rationale: "That §1.8 instance asserts the cash ledger returns to its starting value after a full refund while total_drawn_cents and total_refunded_cents both rise."

  # ===========================================================================
  - section: validations
    instances:
      - name: incident_period_end_not_after_start_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 12]
          - errors[ERR_INCIDENT_PERIOD_INVALID]
          - endpoints[PATCH /public-assistance/disasters/{disaster_id}/incident-period]
        distinguishing_aspect: "Declaring with incident_end_at equal to incident_start_at is rejected, and an amendment must move the end strictly forward, so re-stating the current end is rejected while a later end succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "One valid declaration DR-4969 with incident period 2026-06-10T00:00:00Z through 2026-06-25T00:00:00Z."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4969", state_code: "TX", incident_type: "FLOOD", incident_start_at: "2026-06-10T00:00:00Z", incident_end_at: "2026-06-25T00:00:00Z", population: 2000000 }
              as: PlatformAdmin
              captures: { disaster_id: $.data.id }
          trigger:
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4969-B", state_code: "OK", incident_type: "FLOOD", incident_start_at: "2026-06-10T00:00:00Z", incident_end_at: "2026-06-10T00:00:00Z", population: 500000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "PATCH /public-assistance/disasters/${disaster_id}/incident-period"
              payload: { incident_end_at: "2026-06-20T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "PATCH /public-assistance/disasters/${disaster_id}/incident-period"
              payload: { incident_end_at: "2026-06-25T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "PATCH /public-assistance/disasters/${disaster_id}/incident-period"
              payload: { incident_end_at: "2026-06-30T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "creation with end == start -> HTTP 422 with error_id ERR_INCIDENT_PERIOD_INVALID and no Disaster row created"
            - "amendment to 2026-06-20 (backwards) -> HTTP 422 ERR_INCIDENT_PERIOD_INVALID"
            - "amendment to 2026-06-25 (equal, not strictly forward) -> HTTP 422 ERR_INCIDENT_PERIOD_INVALID"
            - "amendment to 2026-06-30 -> HTTP 200 with Disaster.${disaster_id}.incident_end_at == '2026-06-30T00:00:00Z'"
            - "Disaster.${disaster_id}.version == 2 (only the accepted amendment wrote)"

      - name: uniqueness_constraints_on_declaration_and_report_period_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 23]
          - errors[ERR_DECLARATION_NUMBER_DUPLICATE]
          - errors[ERR_DUPLICATE_REPORT_PERIOD]
        distinguishing_aspect: "declaration_number is unique globally even across a different state and a disjoint period, while (applicant_id, quarter_label) is unique only per applicant, so a second applicant may file the same quarter."
        test_recipe:
          setup:
            - "Logical clock at 2026-07-31T00:00:00Z."
            - "Declaration DR-4970 with two applicants A and B; applicant A has already filed 2026-Q2."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4970", state_code: "TX", incident_type: "FLOOD", incident_start_at: "2026-06-10T00:00:00Z", incident_end_at: "2026-06-25T00:00:00Z", population: 2000000 }
              as: PlatformAdmin
              captures: { disaster_id: $.data.id }
            - call: "POST /public-assistance/applicants"
              payload: { disaster_id: "${disaster_id}", name: "City of Harborview", applicant_type: "LOCAL_GOVERNMENT", population_served: 120000 }
              as: PlatformAdmin
              captures: { applicant_a_id: $.data.id }
            - call: "POST /public-assistance/applicants"
              payload: { disaster_id: "${disaster_id}", name: "Coastal Bend Tribe", applicant_type: "TRIBE", population_served: 9000 }
              as: PlatformAdmin
              captures: { applicant_b_id: $.data.id }
            - call: "POST /public-assistance/progress-reports"
              payload: { applicant_id: "${applicant_a_id}", quarter_label: "2026-Q2", expenditures_to_date_cents: 250000, pct_complete: 40 }
              as: ApplicantAgent
              as_user_id: "${applicant_a_id}"
              captures: { report_a_id: $.data.id }
          trigger:
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4970", state_code: "OK", incident_type: "SEVERE_STORM", incident_start_at: "2026-08-01T00:00:00Z", incident_end_at: "2026-08-10T00:00:00Z", population: 400000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /public-assistance/progress-reports"
              payload: { applicant_id: "${applicant_a_id}", quarter_label: "2026-Q2", expenditures_to_date_cents: 300000, pct_complete: 50 }
              as: ApplicantAgent
              as_user_id: "${applicant_a_id}"
              captures: { err: $.data.error_id }
            - call: "POST /public-assistance/progress-reports"
              payload: { applicant_id: "${applicant_b_id}", quarter_label: "2026-Q2", expenditures_to_date_cents: 100000, pct_complete: 20 }
              as: ApplicantAgent
              as_user_id: "${applicant_b_id}"
              captures: { report_b_id: $.data.id }
          assert:
            - "duplicate declaration_number -> HTTP 409 with error_id ERR_DECLARATION_NUMBER_DUPLICATE"
            - "GET /public-assistance/disasters -> total_count == 1"
            - "second 2026-Q2 report for applicant A -> HTTP 409 with error_id ERR_DUPLICATE_REPORT_PERIOD"
            - "ProgressReport.${report_a_id}.expenditures_to_date_cents == 250000 (the rejected filing wrote nothing)"
            - "2026-Q2 report for applicant B -> HTTP 201 with ProgressReport.${report_b_id}.status == SUBMITTED"

      - name: pagination_limit_and_offset_out_of_range_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 5]
          - errors[ERR_INVALID_PAGINATION]
          - endpoints[GET /public-assistance/applicants]
        distinguishing_aspect: "limit is a closed range [1, 100] and offset must be >= 0, so limit 0, limit 101 and offset -1 are each rejected while limit 100 with offset 0 succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z, declaration DR-4971 with one applicant."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4971", state_code: "TX", incident_type: "FLOOD", incident_start_at: "2026-06-10T00:00:00Z", incident_end_at: "2026-06-25T00:00:00Z", population: 2000000 }
              as: PlatformAdmin
              captures: { disaster_id: $.data.id }
            - call: "POST /public-assistance/applicants"
              payload: { disaster_id: "${disaster_id}", name: "City of Harborview", applicant_type: "LOCAL_GOVERNMENT", population_served: 120000 }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "GET /public-assistance/applicants?limit=0"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "GET /public-assistance/applicants?limit=101"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "GET /public-assistance/applicants?offset=-1"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "GET /public-assistance/applicants?limit=100&offset=0"
              payload: {}
              as: PlatformAdmin
          assert:
            - "limit=0 -> HTTP 422 with error_id ERR_INVALID_PAGINATION"
            - "limit=101 -> HTTP 422 with error_id ERR_INVALID_PAGINATION"
            - "offset=-1 -> HTTP 422 with error_id ERR_INVALID_PAGINATION"
            - "limit=100&offset=0 -> HTTP 200 with total_count == 1, has_more == false and one row whose id == ${applicant_id}"

      - name: mitigation_request_above_repair_estimate_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 28]
          - errors[ERR_MITIGATION_EXCEEDS_REPAIR]
          - endpoints[POST /public-assistance/projects]
        distinguishing_aspect: "The bar is mitigation_requested_cents <= estimated_repair_cost_cents, so one cent above the estimate is rejected at creation while a request exactly equal to the estimate is accepted and stored with mitigation_approved_cents still 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z, declaration DR-4972, applicant ELIGIBLE, facility ELIGIBLE."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4972", state_code: "TX", incident_type: "FLOOD", incident_start_at: "2026-06-10T00:00:00Z", incident_end_at: "2026-06-25T00:00:00Z", population: 2000000 }
              as: PlatformAdmin
              captures: { disaster_id: $.data.id }
            - call: "POST /public-assistance/applicants"
              payload: { disaster_id: "${disaster_id}", name: "City of Harborview", applicant_type: "LOCAL_GOVERNMENT", population_served: 120000 }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /public-assistance/applicants/${applicant_id}/eligibility-determination"
              payload: { decision: "ELIGIBLE", rationale: "Local government inside the declared area" }
