scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: facility_create_patch_get_defaults
        claim_type: creation_defaults
        grounds: [entities.Facility, endpoints.POST_/transload/facilities, "endpoints.PATCH_/transload/facilities/{facilityId}"]
        distinguishing_aspect: "Facility creation applies documented defaults (free_demurrage_hours 48, sit_free_days 2, switch_buffer_minutes 30, free_switches_per_period 0, STRICT_MATRIX, posture NORMAL); PATCH updates config and bumps version."
        test_recipe:
          setup: ["Empty database; clock at default."]
          setup_api_calls:
            - { call: "POST /transload/facilities", payload: { name: "FT-E1" }, as: FacilityAdmin, captures: { fac: $.data.id, fac_posture: $.data.safety_posture, fac_free: $.data.free_demurrage_hours, fac_sit: $.data.sit_free_days, fac_buf: $.data.switch_buffer_minutes, fac_pol: $.data.contamination_policy, fac_v: $.data.version } }
          trigger:
            - { call: "PATCH /transload/facilities/${fac}", payload: { free_demurrage_hours: 24, contamination_policy: "WEIGHTED_SCORE" }, as: FacilityAdmin, captures: { fac_v2: $.data.version, fac_free2: $.data.free_demurrage_hours, fac_pol2: $.data.contamination_policy } }
            - { call: "GET /transload/facilities/${fac}", payload: {}, as: FacilityAdmin, captures: { fac_open: $.data.open_incident_count } }
          assert:
            - "create response: safety_posture == NORMAL, free_demurrage_hours == 48, sit_free_days == 2, switch_buffer_minutes == 30, contamination_policy == STRICT_MATRIX, version == 1, open_incident_count == 0"
            - "PATCH response: free_demurrage_hours == 24, contamination_policy == WEIGHTED_SCORE, version == 2"
            - "GET after PATCH: open_incident_count == 0 and id == ${fac}"
      - name: master_data_create_and_get
        claim_type: creation
        grounds: [entities.Customer, entities.Product, entities.Track, entities.Equipment, entities.InventoryLot, entities.Invoice]
        distinguishing_aspect: "Each master-data entity is created with 201 and server defaults (customer GOOD_STANDING/CONSTRUCTIVE/CALENDAR; track ACTIVE/DISENGAGED with zero counters; equipment AVAILABLE with null last_product_id; lot stamps sit_free_days 2 and CALENDAR from customer; invoice DRAFT with zero totals) and is retrievable by id."
        test_recipe:
          setup: ["Facility exists; clock 2026-08-03T00:00Z."]
          setup_api_calls:
            - { call: "POST /transload/facilities", payload: { name: "FT-E2" }, as: FacilityAdmin }
          trigger:
            - { call: "POST /transload/customers", payload: { name: "ACME", allocated_car_spots: 4 }, as: FacilityAdmin, captures: { cust: $.data.id, cust_credit: $.data.credit_standing, cust_basis: $.data.demurrage_basis, cust_sit: $.data.sit_day_basis } }
            - { call: "POST /transload/products", payload: { name: "Salt", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 3 }, as: FacilityAdmin, captures: { trk: $.data.id, trk_st: $.data.status, trk_der: $.data.derail_protection, trk_occ: $.data.occupied_spots } }
            - { call: "POST /transload/equipment", payload: { name: "PUMP-1", equipment_type: "PUMP" }, as: FacilityAdmin, captures: { eq: $.data.id, eq_st: $.data.status, eq_lp: $.data.last_product_id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id, lot_st: $.data.status, lot_free: $.data.sit_free_days, lot_basis: $.data.sit_day_basis, lot_start: $.data.sit_start_timestamp } }
            - { call: "POST /transload/invoices", payload: { customer_id: "${cust}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z" }, as: BillingClerk, captures: { inv: $.data.id, inv_st: $.data.status, inv_tot: $.data.total_cents, inv_cnt: $.data.charge_count } }
            - { call: "GET /transload/customers/${cust}", payload: {}, as: BillingClerk, captures: { g_cust: $.data.name } }
            - { call: "GET /transload/products/${prod}", payload: {}, as: YardMaster, captures: { g_prod: $.data.name } }
            - { call: "GET /transload/tracks/${trk}", payload: {}, as: SafetyOfficer, captures: { g_trk: $.data.spot_capacity } }
            - { call: "GET /transload/equipment/${eq}", payload: {}, as: TransferOperator, captures: { g_eq: $.data.name } }
            - { call: "GET /transload/lots/${lot}", payload: {}, as: CustomerRep, as_user_id: "${cust}", captures: { g_lot: $.data.quantity_on_hand_tons } }
            - { call: "GET /transload/invoices/${inv}", payload: {}, as: CustomerRep, as_user_id: "${cust}", captures: { g_inv: $.data.status } }
          assert:
            - "customer defaults: credit_standing == GOOD_STANDING, demurrage_basis == CONSTRUCTIVE, sit_day_basis == CALENDAR"
            - "track: status == ACTIVE, derail_protection == DISENGAGED, occupied_spots == 0, reserved_spots == 0"
            - "equipment: status == AVAILABLE, last_product_id == null"
            - "lot: status == ACTIVE, sit_free_days == 2 (stamped from facility), sit_day_basis == CALENDAR (stamped from customer), sit_start_timestamp == creation clock, quantity_received/shipped/on_hand == 0"
            - "invoice: status == DRAFT, total_cents == 0, charge_count == 0"
            - "all GET-by-id calls return 200 with matching ids"
      - name: entity_create_rejected_invalid_request
        claim_type: required_fields_and_type_constraints
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Missing required fields, invalid enum members, non-positive numbers, and reversed windows each produce 400 ERR_INVALID_REQUEST at creation time."
        test_recipe:
          setup: ["Facility, customer, product, lot, track exist (for FK references)."]
          setup_api_calls:
            - { call: "POST /transload/facilities", payload: { name: "FT-E3" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "ACME", allocated_car_spots: 4 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Salt", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 2 }, as: FacilityAdmin, captures: { trk: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "95001", quantity_loaded_tons: 40.0 }, as: YardMaster, captures: { car: $.data.id, car_v: $.data.version } }
          trigger:
            - { call: "POST /transload/customers", payload: { allocated_car_spots: 4 }, as: FacilityAdmin, captures: { e1: $.data.error_id } }
            - { call: "POST /transload/products", payload: { name: "X", hazard_class: "RADIOACTIVE", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { e2: $.data.error_id } }
            - { call: "POST /transload/tracks", payload: { name: "T2", spot_capacity: 0 }, as: FacilityAdmin, captures: { e3: $.data.error_id } }
            - { call: "POST /transload/equipment", payload: { name: "Z", equipment_type: "CRANE" }, as: FacilityAdmin, captures: { e4: $.data.error_id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "95002", quantity_loaded_tons: 0 }, as: YardMaster, captures: { e5: $.data.error_id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}" }, as: FacilityAdmin, captures: { e6: $.data.error_id } }
            - { call: "POST /transload/railcars/${car}/spot-orders", payload: { expected_railcar_version: "${car_v}", track_id: "${trk}", spot_number: 1, window_start: "2026-08-03T05:00:00Z", window_end: "2026-08-03T01:00:00Z" }, as: YardMaster, captures: { e7: $.data.error_id } }
            - { call: "POST /transload/invoices", payload: { customer_id: "${cust}", period_start: "2026-08-31T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }, as: BillingClerk, captures: { e8: $.data.error_id } }
            - { call: "POST /transload/incidents", payload: { severity: "CATASTROPHIC", description: "x" }, as: SafetyOfficer, captures: { e9: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: {}, as: FacilityAdmin, captures: { e10: $.data.error_id } }
          assert:
            - "all ten triggers return HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "no customer/product/track/equipment/railcar/lot/spot-order/invoice/incident was created by the rejected calls (counts unchanged on subsequent list GETs)"
      - name: entity_get_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET (or action) with a well-formed but unknown UUID returns 404 ERR_NOT_FOUND for every resource type."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - { call: "GET /transload/facilities/00000000-0000-0000-0000-000000000000", payload: {}, as: FacilityAdmin, captures: { e1: $.data.error_id } }
            - { call: "GET /transload/customers/00000000-0000-0000-0000-000000000000", payload: {}, as: FacilityAdmin, captures: { e2: $.data.error_id } }
            - { call: "GET /transload/products/00000000-0000-0000-0000-000000000000", payload: {}, as: FacilityAdmin, captures: { e3: $.data.error_id } }
            - { call: "GET /transload/tracks/00000000-0000-0000-0000-000000000000", payload: {}, as: YardMaster, captures: { e4: $.data.error_id } }
            - { call: "GET /transload/equipment/00000000-0000-0000-0000-000000000000", payload: {}, as: TransferOperator, captures: { e5: $.data.error_id } }
            - { call: "GET /transload/incidents/00000000-0000-0000-0000-000000000000", payload: {}, as: SafetyOfficer, captures: { e6: $.data.error_id } }
            - { call: "GET /transload/railcars/00000000-0000-0000-0000-000000000000", payload: {}, as: YardMaster, captures: { e7: $.data.error_id } }
            - { call: "GET /transload/lots/00000000-0000-0000-0000-000000000000", payload: {}, as: FacilityAdmin, captures: { e8: $.data.error_id } }
            - { call: "GET /transload/spot-orders/00000000-0000-0000-0000-000000000000", payload: {}, as: YardMaster, captures: { e9: $.data.error_id } }
            - { call: "GET /transload/switch-orders/00000000-0000-0000-0000-000000000000", payload: {}, as: YardMaster, captures: { e10: $.data.error_id } }
            - { call: "GET /transload/transfer-orders/00000000-0000-0000-0000-000000000000", payload: {}, as: TransferOperator, captures: { e11: $.data.error_id } }
            - { call: "GET /transload/weight-tickets/00000000-0000-0000-0000-000000000000", payload: {}, as: TransferOperator, captures: { e12: $.data.error_id } }
            - { call: "GET /transload/charges/00000000-0000-0000-0000-000000000000", payload: {}, as: BillingClerk, captures: { e13: $.data.error_id } }
            - { call: "GET /transload/invoices/00000000-0000-0000-0000-000000000000", payload: {}, as: BillingClerk, captures: { e14: $.data.error_id } }
          assert:
            - "all fourteen triggers return HTTP 404 with error_id == ERR_NOT_FOUND"
      - name: system_and_computed_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Facility.fields.safety_posture, entities.Track.fields.occupied_spots, entities.Railcar.fields.placement_status]
        distinguishing_aspect: "Client-supplied values for system/computed fields (id, created_at, version, posture, counters, status) in create payloads are ignored; the server-stamped values win."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - { call: "POST /transload/facilities", payload: { name: "FT-E5", safety_posture: "SUSPENDED", open_incident_count: 9, version: 42 }, as: FacilityAdmin, captures: { fac_posture: $.data.safety_posture, fac_open: $.data.open_incident_count, fac_v: $.data.version } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 2, status: "OUT_OF_SERVICE", occupied_spots: 7, derail_protection: "ENGAGED" }, as: FacilityAdmin, captures: { trk_st: $.data.status, trk_occ: $.data.occupied_spots, trk_der: $.data.derail_protection } }
          assert:
            - "facility created with safety_posture == NORMAL, open_incident_count == 0, version == 1 (client values ignored)"
            - "track created with status == ACTIVE, occupied_spots == 0, derail_protection == DISENGAGED (client values ignored)"
      - name: customer_patch_and_version_progression
        claim_type: retrieval
        grounds: ["endpoints.PATCH_/transload/customers/{customerId}", entities.Customer.fields.version]
        distinguishing_aspect: "PATCH updates only the supplied fields, leaves others intact, and increments version by exactly 1 per call."
        test_recipe:
          setup: ["Facility and customer exist (version 1)."]
          setup_api_calls:
            - { call: "POST /transload/facilities", payload: { name: "FT-E6" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "ACME", allocated_car_spots: 4 }, as: FacilityAdmin, captures: { cust: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "PATCH /transload/customers/${cust}", payload: { credit_standing: "CREDIT_WATCH" }, as: FacilityAdmin, captures: { v2: $.data.version, cr2: $.data.credit_standing, b2: $.data.demurrage_basis } }
            - { call: "PATCH /transload/customers/${cust}", payload: { demurrage_basis: "ACTUAL" }, as: FacilityAdmin, captures: { v3: $.data.version, cr3: $.data.credit_standing, b3: $.data.demurrage_basis } }
          assert:
            - "after first PATCH: version == 2, credit_standing == CREDIT_WATCH, demurrage_basis still == CONSTRUCTIVE"
            - "after second PATCH: version == 3, credit_standing still == CREDIT_WATCH, demurrage_basis == ACTUAL"
  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: railcar_full_lifecycle_happy_path
        claim_type: valid_transition
        grounds: [state_machines.Railcar, state_machines.SpotOrder, state_machines.SwitchOrder]
        distinguishing_aspect: "A clean-required car walks the full chain REGISTERED -> ARRIVED -> SPOTTED -> IN_TRANSFER -> EMPTY_AWAITING_CLEANING -> CLEANING -> READY_FOR_RELEASE -> RELEASED -> DEPARTED, and the terminal reads show placing spot order CLOSED and both switch orders COMPLETED."
        test_recipe:
          setup:
            - "Facility; customer; FOOD_GRADE product with requires_full_clean=true; lot; track cap 1; equipment; car 10.0 t."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-S1" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 5 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Flour", hazard_class: "FOOD_GRADE", segregation_group: "FOOD_GRAIN", requires_full_clean: true }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 1 }, as: FacilityAdmin, captures: { trk: $.data.id } }
            - { call: "POST /transload/equipment", payload: { name: "CONV-1", equipment_type: "CONVEYOR" }, as: FacilityAdmin, captures: { eq: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "96001", quantity_loaded_tons: 10.0 }, as: YardMaster, captures: { car: $.data.id, st0: $.data.placement_status } }
          trigger:
            - { call: "POST /transload/railcars/${car}/arrive", payload: {}, as: YardMaster, captures: { st1: $.data.placement_status, arr_ts: $.data.arrival_timestamp, rem1: $.data.quantity_remaining_tons, car_v: $.data.version } }
            - { call: "POST /transload/railcars/${car}/spot-orders", payload: { expected_railcar_version: "${car_v}", track_id: "${trk}", spot_number: 1, window_start: "2026-08-03T01:00:00Z", window_end: "2026-08-03T05:00:00Z" }, as: YardMaster, captures: { so: $.data.id, so_st: $.data.status } }
            - { call: "POST /transload/spot-orders/${so}/schedule", payload: {}, as: YardMaster, captures: { so_st2: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T02:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/spot-orders/${so}/execute", payload: {}, as: YardMaster, captures: { so_st3: $.data.status } }
            - { call: "GET /transload/railcars/${car}", payload: {}, as: YardMaster, captures: { st2: $.data.placement_status, placed_ts: $.data.placed_timestamp } }
            - { call: "POST /transload/transfer-orders", payload: { railcar_id: "${car}", equipment_id: "${eq}", quantity_planned_tons: 10.0 }, as: TransferOperator, captures: { to: $.data.id } }
            - { call: "POST /transload/transfer-orders/${to}/activate", payload: {}, as: TransferOperator, captures: { to_st: $.data.status } }
            - { call: "POST /transload/transfer-orders/${to}/weight-tickets", payload: { truck_reference: "TRK-1", gross_weight_tons: 24.0, tare_weight_tons: 14.0, truck_max_payload_tons: 40.0 }, as: TransferOperator, captures: { wt: $.data.id } }
            - { call: "POST /transload/weight-tickets/${wt}/certify", payload: {}, as: TransferOperator }
            - { call: "GET /transload/railcars/${car}", payload: {}, as: TransferOperator, captures: { st3: $.data.placement_status } }
            - { call: "POST /transload/railcars/${car}/start-cleaning", payload: { wash_type: "DETERGENT" }, as: TransferOperator, captures: { st4: $.data.placement_status } }
            - { call: "POST /transload/railcars/${car}/pass-cleaning", payload: {}, as: TransferOperator, captures: { st5: $.data.placement_status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/railcars/${car}/release", payload: {}, as: YardMaster, captures: { st6: $.data.placement_status, rel_ts: $.data.released_timestamp } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T07:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/railcars/${car}/depart", payload: {}, as: YardMaster, captures: { st7: $.data.placement_status, dep_ts: $.data.departed_timestamp } }
            - { call: "GET /transload/spot-orders/${so}", payload: {}, as: YardMaster, captures: { so_final: $.data.status } }
            - { call: "GET /transload/switch-orders?railcar_id=${car}", payload: {}, as: YardMaster, captures: { sw1_st: "$.data[0].status", sw2_st: "$.data[1].status", sw2_type: "$.data[1].move_type" } }
          assert:
            - "initial placement_status == REGISTERED; after arrive == ARRIVED with arrival_timestamp == 2026-08-03T00:00:00Z and quantity_remaining_tons == 10.0"
            - "spot order: REQUESTED -> SCHEDULED -> EXECUTED; after execute car SPOTTED with placed_timestamp == 2026-08-03T02:00:00Z, track_id == ${trk}, spot_number == 1"
            - "after full certification: car == EMPTY_AWAITING_CLEANING (clean required, so no auto-advance)"
            - "start-cleaning -> CLEANING; pass-cleaning -> READY_FOR_RELEASE"
            - "release at 2026-08-03T06:00Z -> RELEASED with released_timestamp == 2026-08-03T06:00:00Z"
            - "depart at 2026-08-03T07:00Z -> DEPARTED with departed_timestamp == 2026-08-03T07:00:00Z"
            - "placing spot order status == CLOSED; both switch orders (SPOT then PULL) == COMPLETED"
      - name: railcar_invalid_transitions_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Railcar, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Every trigger fired from a placement/hold state that does not list it is rejected with 409 ERR_INVALID_STATE, including terminal lockdown of a DEPARTED car."
        test_recipe:
          setup: ["Facility; customer; clean=false product; lot; track cap 1; car registered."]
          setup_api_calls:
            - { call: "POST /transload/facilities", payload: { name: "FT-S2" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 5 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Salt", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 1 }, as: FacilityAdmin, captures: { trk: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "96002", quantity_loaded_tons: 40.0 }, as: YardMaster, captures: { car: $.data.id, car_v: $.data.version } }
          trigger:
            - { call: "POST /transload/railcars/${car}/depart", payload: {}, as: YardMaster, captures: { e1: $.data.error_id } }
            - { call: "POST /transload/railcars/${car}/release", payload: {}, as: YardMaster, captures: { e2: $.data.error_id } }
            - { call: "POST /transload/railcars/${car}/start-cleaning", payload: { wash_type: "RINSE" }, as: TransferOperator, captures: { e3: $.data.error_id } }
            - { call: "POST /transload/railcars/${car}/pass-cleaning", payload: {}, as: TransferOperator, captures: { e4: $.data.error_id } }
            - { call: "POST /transload/railcars/${car}/arrive", payload: {}, as: YardMaster, captures: { st1: $.data.placement_status } }
            - { call: "POST /transload/railcars/${car}/arrive", payload: {}, as: YardMaster, captures: { e5: $.data.error_id } }
            - { call: "POST /transload/railcars/${car}/lift-hold", payload: {}, as: SafetyOfficer, captures: { e6: $.data.error_id } }
          assert:
            - "depart/release/start-cleaning/pass-cleaning from REGISTERED all rejected: ERR_INVALID_STATE (409)"
            - "first arrive succeeds (placement_status == ARRIVED); second arrive rejected: ERR_INVALID_STATE (idempotency of transition)"
            - "lift-hold while hold_status == NONE rejected: ERR_INVALID_STATE"
      - name: railcar_terminal_lockdown_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Railcar, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A DEPARTED car rejects arrive, release, place-hold, and new spot orders — no transition leaves the terminal state."
        test_recipe:
          setup: ["A car fully processed to DEPARTED (clean=false product, 5.0 t, full transfer, release, depart)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-S3" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 5 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Salt", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
