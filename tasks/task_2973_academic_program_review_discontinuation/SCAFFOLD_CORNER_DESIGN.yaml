              as: ProgramChair
              as_user_id: "${prog_id}"
          assert:
            - "${prog_v2} == ${prog_v1} + 1 — filing the first plan bumped the program's version, so the same expected_program_version could not be replayed"
            - "the second trigger returns 201 with a new plan in DRAFT (final_award_term_index 6) and TeachOutPlan.${plan1_id}.state == SUPERSEDED — a DRAFT is replaceable"
            - "SUBMIT then APPROVE return 200: TeachOutPlan.${plan2_id}.state == APPROVED with seat_shortfall == 0 and at_risk_student_count == 0 on an empty plan"
            - "the sixth trigger returns 409 with data.error_id == ERR_TEACH_OUT_IN_EFFECT — the identical create shape that succeeded at DRAFT is refused once a plan on the program is APPROVED"
            - "the refusal creates nothing: the list returns total_count == 2 (one SUPERSEDED, one APPROVED) and AcademicProgram.${prog_id}.version is still ${prog_v3}"
            - "TeachOutPlan.${plan2_id}.final_award_term_index is still 6 — the refused write did not partially apply its 7"


      - name: the_visit_and_cycle_list_channels_carry_the_derived_span_and_report_count
        claim_type: computed_read
        grounds:
          - endpoints[GET /provost/reviewer-visits]
          - endpoints[GET /provost/reviewer-visits/{id}]
          - endpoints[GET /provost/academic-programs/{id}/review-cycles]
          - entities.ReviewerVisit.span_start_date
          - entities.ReviewerVisit.report_count
        distinguishing_aspect: |
          A two-reviewer team makes the visit list channel discriminating: the two
          visits differ in reviewer, in state and in the number of calendar days
          they span, so every declared filter has both a match and a non-match to
          separate. The single-visit read exposes the two derived date fields,
          which are calendar dates cut from instants rather than the instants
          themselves — a window that ends at 17:00 UTC still spans its own day —
          and report_count, which is derived from child rows rather than stored.
          The cycle list channel is the reverse-reachability path for
          ReviewCycle.program_id and answers its state and cycle_year filters
          against a cycle whose state moved three times since it was created.
        test_recipe:
          setup:
            - "One program with three metric snapshots and an ACCEPTED self-study, hosting two external reviewers: r1 visiting 2026-08-20T09:00:00Z to 2026-08-22T17:00:00Z and r2 visiting 2026-08-25T08:00:00Z to 2026-08-25T18:00:00Z. r1's visit is completed at clock 2026-08-23 and r1 files a report; r2's visit stays SCHEDULED."
