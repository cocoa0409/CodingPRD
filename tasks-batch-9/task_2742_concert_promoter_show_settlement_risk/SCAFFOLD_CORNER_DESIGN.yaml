  # ===========================================================================
  # SECTION 2 — state_machines
  #
  # Rows skipped as non-applicable:
  #   shape `compound`  — no machine derives a parent state from its children
  #   pattern `Bubble up` — no transition fires because ALL children reached a
  #                         terminal state; Show -> SETTLED is driven by the
  #                         Settlement trigger, not by its BudgetLine children
  # ===========================================================================
  - section: state_machines
    instances:
      - name: every_machine_starts_in_its_declared_initial_state
        claim_type: Initial State
        grounds:
          - "state_machines[*].initial_state"
        distinguishing_aspect: |
          All seven declared machines are instantiated in one pass, including the two dimensions of
          Show, which must BOTH be at their initial values on a fresh row (PLANNED and PRE_SALE), and
          BudgetLine, whose variance machine starts at WITHIN_TOLERANCE while its independent lifecycle
          field starts at ACTIVE. A row whose enum defaults to the first alphabetical value, or which
          conflates variance_status with status, fails.
        test_recipe:
          setup:
            - "One Market, one Venue, two Artists and two PLANNED shows on non-overlapping dates."
            - "Show B exists only to receive a CancellationEvent so that show A stays untouched."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Initial Market", region_code: "INI", guarantee_exposure_limit_cents: 5000000 }
              as: RiskOfficer
              captures: { in_mk_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${in_mk_id}", name: "Initial Hall", gross_capacity: 1000, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { in_vn_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Initial Act A", agency: "Ini Talent", tier: "CLUB", historical_sellthrough_pct: 50.00 }
              as: TalentBuyer
              captures: { in_ar_a: $.data.id }
            - call: "POST /artists"
              payload: { name: "Initial Act B", agency: "Ini Talent", tier: "CLUB", historical_sellthrough_pct: 50.00 }
              as: TalentBuyer
              captures: { in_ar_b: $.data.id }
          trigger:
            - call: "POST /shows"
              payload: { artist_id: "${in_ar_a}", venue_id: "${in_vn_id}", event_at: "2026-10-15T02:00:00.000Z", load_in_at: "2026-10-14T14:00:00.000Z", load_out_at: "2026-10-15T08:00:00.000Z", announce_at: "2026-08-10T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 100000 }
              as: TalentBuyer
              captures: { in_sh_a: $.data.id, in_sh_a_v: $.data.version, in_sh_a_status: $.data.show_status, in_sh_a_sales: $.data.sales_status }
            - call: "POST /shows"
              payload: { artist_id: "${in_ar_b}", venue_id: "${in_vn_id}", event_at: "2026-10-22T02:00:00.000Z", load_in_at: "2026-10-21T14:00:00.000Z", load_out_at: "2026-10-22T08:00:00.000Z", announce_at: "2026-08-10T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 100000 }
              as: TalentBuyer
              captures: { in_sh_b: $.data.id }
            - call: "POST /offers"
              payload: { show_id: "${in_sh_a}", expected_show_version: "${in_sh_a_v}", deal_structure: "VERSUS", guarantee_cents: 800000, deposit_cents: 0, expense_cap_cents: 600000, versus_pct: 85.00 }
              as: TalentBuyer
              captures: { in_of_id: $.data.id, in_of_status: $.data.status }
            - call: "POST /budget-lines"
              payload: { show_id: "${in_sh_a}", category: "HOSPITALITY", description: "Dressing room buyout", budgeted_cents: 60000 }
              as: TourAccountant
              captures: { in_bl_id: $.data.id, in_bl_vstatus: $.data.variance_status, in_bl_status: $.data.status }
            - call: "POST /vendor-invoices"
              payload: { show_id: "${in_sh_a}", budget_line_id: "${in_bl_id}", vendor_name: "Green Room Catering", amount_cents: 60000, invoice_date: "2026-08-01T00:00:00.000Z", documentation_ref: "PKT-010" }
              as: TourAccountant
              captures: { in_vi_id: $.data.id, in_vi_status: $.data.status }
            - call: "POST /ticket-tiers"
              payload: { show_id: "${in_sh_a}", tier_name: "GA", price_cents: 4500, allocation_qty: 500 }
              as: TalentBuyer
              captures: { in_tt_id: $.data.id, in_tt_status: $.data.status }
            - call: "POST /ticket-holds"
              payload: { ticket_tier_id: "${in_tt_id}", kind: "ARTIST_HOLD", qty: 10, holder: "Act A guest list" }
              as: TalentBuyer
              captures: { in_th_id: $.data.id, in_th_status: $.data.status }
            - call: "POST /settlements"
              payload: { show_id: "${in_sh_a}" }
              as: TourAccountant
              captures: { in_st_id: $.data.id, in_st_status: $.data.status }
            - call: "POST /cancellation-events"
              payload: { show_id: "${in_sh_b}", kind: "CANCELLED", reason: "Routing collapse" }
              as: RiskOfficer
              captures: { in_ce_id: $.data.id, in_ce_status: $.data.status, in_ce_occurred: $.data.occurred_at }
          assert:
            - "SHOW, BOTH DIMENSIONS — ${in_sh_a_status} == PLANNED and ${in_sh_a_sales} == PRE_SALE on the same fresh row"
            - "${in_of_status} == DRAFT — creating an offer does not submit it"
            - "${in_bl_vstatus} == WITHIN_TOLERANCE while ${in_bl_status} == ACTIVE — two independent fields, two different initial values"
            - "${in_vi_status} == SUBMITTED — an invoice is never born VERIFIED even when its amount equals the budget exactly"
            - "${in_tt_status} == DRAFT — a tier created before on-sale is not sellable yet"
            - "${in_th_status} == HELD"
            - "${in_st_status} == DRAFT — a settlement can be opened while the show is still PLANNED; only calculate demands PERFORMED"
            - "${in_ce_status} == OPENED and ${in_ce_occurred} == 2026-08-01T00:00:00.000Z (the logical clock, not a wall clock)"
            - "Show A is untouched by show B's cancellation: GET /shows/${in_sh_a} still reports PLANNED / PRE_SALE"

      - name: settlement_walks_draft_calculated_signed_paid_end_to_end
        claim_type: Valid Transition
        grounds:
          - "state_machines.Settlement"
          - "state_machines.Show[dimension=show_status]"
          - "calculations.artist_settlement_earnings"
          - "calculations.settlement_split"
          - "calculations.market_performance_index"
        distinguishing_aspect: |
          The happy path across the whole domain in one sequence — offer accept, on-sale, sales,
          perform, settlement open, calculate, sign, pay — with every intermediate state named. Each
          money figure is a literal derived from the scaffold's own formulas, so an implementation that
          reaches PAID with the wrong arithmetic still fails. Note the FLAT_GUARANTEE co-op leg:
          MIN(50% of 0 recognised marketing, 5% of base) is 0, not 25000.
          Arithmetic: gross 1000000, tax 0, facility 0, card ROUND(1000000*2.5/100) = 25000,
          adjusted 975000; the single PRODUCTION line is not artist-deductible so allowed 0 and
          breakeven 500000; base 500000; coop MIN(0, 25000) = 0; earnings 500000; withholding 0;
          payment_due 500000 - 100000 = 400000; RENTAL venue_share = rental_fee 150000;
          promoter_borne = 100000; promoter_net = 975000 - 500000 - 100000 - 150000 = 225000.
          Projection: (500 - 0 - 0) * 5000 = 2500000 gross, card 62500, projected adjusted 2437500,
          projected_promoter_net = 2437500 - 500000 - 100000 = 1837500; index =
          ROUND(225000*100/1837500) = ROUND(12.2449) = 12.
        test_recipe:
          setup:
            - "Market limit 5000000. Venue with facility_fee_cents_per_ticket 0 and ticket_tax_pct 0, so only the card fee bites."
            - "Artist with withholding_pct 0. RENTAL show, rental_fee_cents 150000, announce 2026-08-05, event 2026-09-01T02:00Z."
            - "One PRODUCTION budget line of 100000 with a matching 100000 invoice, because validations priority 30 also demands at least one BudgetLine before a settlement may be calculated and priority 36 demands every invoice be resolved."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
