              as: PharmacyOperations
          assert:
            - "before the reversal Prescription.${rx_cold} has refills_remaining 2, refills_consumed 1, days_dispensed_total 28, last_dispensed_date 2026-08-15, last_dispensed_days_supply 28, prior_last_dispensed_date 2026-07-18, prior_last_dispensed_days_supply 28"
            - "240 > COLD_CHAIN_EXCURSION_LIMIT_MINUTES (120), so Shipment.${ship_1}.status == EXCEPTION_RETURNED and delivered_at is NOT stamped"
            - "CycleLine.${line_cold}.line_status == CREDITED"
            - "CONSERVATION of refill units: refills_remaining + refills_consumed == refills_authorized == 3 both before (2 + 1) and after (3 + 0) the reversal"
            - "CONSERVATION of dispensed days: Prescription.${rx_cold}.days_dispensed_total returns to 0, exactly the 28 days the adjudication had added"
