            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s1_id}", item_id: "${item_id}", on_hand_units: 10, size_on_hand: [{ size_code: "S", units: 3 }, { size_code: "M", units: 4 }, { size_code: "L", units: 3 }], min_units: 8, max_units: 20, weekly_forecast_units: 3, trailing_4wk_sales_units: 12 }
              as: Allocator
