scaffold_corner_design:
  - section: entities
    instances:
      - name: study_missing_required_protocol_number_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Study.fields.protocol_number, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /api/studies omitting protocol_number (source: input, no default) is rejected with ERR_INVALID_REQUEST (400); no entity is created."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/studies", payload: { title: "No Protocol", phase: "PHASE_II", blinding_model: "DOUBLE_BLIND", max_dose_per_visit_mg: 200 }, as: SponsorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP status 400"
      - name: staff_is_unblinded_defaults_to_false
        claim_type: defaults
        grounds: [entities.PharmacyStaff.fields.is_unblinded]
        distinguishing_aspect: "Omitting is_unblinded on staff creation persists the default false."
        test_recipe:
          setup: ["study + site exist"]
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-COR-1", title: "Corner", phase: "PHASE_I", blinding_model: "OPEN_LABEL", max_dose_per_visit_mg: 100 }, as: SponsorAdmin, captures: { study: $.data.id } }
            - { call: "POST /api/sites", payload: { study_id: "${study}", site_number: "S1", name: "Site", principal_investigator: "Dr A" }, as: SponsorAdmin, captures: { site: $.data.id } }
          trigger:
            - { call: "POST /api/staff", payload: { site_id: "${site}", full_name: "Default Flag", license_number: "L-COR-1" }, as: SponsorAdmin, captures: { flag: $.data.is_unblinded } }
          assert:
            - "flag == false (server default applied; field omitted from payload)"
      - name: temperature_log_system_timestamp_uses_default_logical_clock
        claim_type: system_fields
        grounds: [entities.TemperatureLog.fields.recorded_at, endpoints."POST /api/_clock/set_current_utc"]
        distinguishing_aspect: "recorded_at is server-stamped from the logical clock; with no prior clock-set it reads exactly the startup default 2026-08-01T00:00:00Z, proving both the system-source field and the pinned clock default."
        test_recipe:
          setup: ["study + site exist; logical clock never set"]
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-COR-2", title: "Corner", phase: "PHASE_I", blinding_model: "OPEN_LABEL", max_dose_per_visit_mg: 100 }, as: SponsorAdmin, captures: { study: $.data.id } }
            - { call: "POST /api/sites", payload: { study_id: "${study}", site_number: "S1", name: "Site", principal_investigator: "Dr A" }, as: SponsorAdmin, captures: { site: $.data.id } }
            - { call: "POST /api/staff", payload: { site_id: "${site}", full_name: "P", license_number: "L-COR-2" }, as: SponsorAdmin, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /api/temperature-logs", payload: { site_id: "${site}", celsius: 5.0, source: "MANUAL" }, as: Pharmacist, as_user_id: "${p1}", captures: { ts: $.data.recorded_at, exc: $.data.excursion_id } }
          assert:
            - "ts == 2026-08-01T00:00:00Z (default logical clock; no recorded_at was supplied in the payload)"
            - "exc == null (no lot at the site means no range to breach)"
      - name: study_invalid_phase_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Study.fields.phase, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "phase is a closed enum; PHASE_V is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/studies", payload: { protocol_number: "P-COR-3", title: "Bad Enum", phase: "PHASE_V", blinding_model: "DOUBLE_BLIND", max_dose_per_visit_mg: 200 }, as: SponsorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP status 400"
      - name: kit_get_with_unknown_id_returns_kit_not_found
        claim_type: not_found
        grounds: ["errors[ERR_KIT_NOT_FOUND]", response_envelope]
        distinguishing_aspect: "GET on a non-existent kit id returns 404 ERR_KIT_NOT_FOUND inside the fixed error envelope (response_type == error, data.error_id + data.message present)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/kits/00000000-0000-0000-0000-000000000000", as: SponsorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_KIT_NOT_FOUND and HTTP status 404"
            - "response envelope: response_type == 'error' and data.message is a non-empty string"
      - name: kits_list_pagination_envelope_and_defaults
        claim_type: listing
        grounds: [response_envelope, endpoints."GET /api/kits"]
        distinguishing_aspect: "List responses carry limit/offset/total_count/has_more; default limit is 10 and with exactly 1 kit has_more == false."
        test_recipe:
          setup: ["study + site + lot exist; one kit shipped"]
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-COR-4", title: "Corner", phase: "PHASE_I", blinding_model: "OPEN_LABEL", max_dose_per_visit_mg: 100 }, as: SponsorAdmin, captures: { study: $.data.id } }
            - { call: "POST /api/sites", payload: { study_id: "${study}", site_number: "S1", name: "Site", principal_investigator: "Dr A" }, as: SponsorAdmin, captures: { site: $.data.id } }
            - { call: "POST /api/lots", payload: { study_id: "${study}", lot_number: "LOT-COR-4", product_name: "DrugX", strength_mg: 50, dosage_form: "VIAL", expiry_date: "2027-06-01T00:00:00Z", storage_temp_min_celsius: 2, storage_temp_max_celsius: 8, stability_budget_minutes: 600 }, as: SponsorAdmin, captures: { lot: $.data.id } }
            - { call: "POST /api/shipments", payload: { lot_id: "${lot}", site_id: "${site}", kit_numbers: ["K-PG"], units_per_kit: 10 }, as: SponsorAdmin }
          trigger:
            - { call: "GET /api/kits", payload: { site_id: "${site}" }, as: SponsorAdmin, captures: { first_status: "$.data[0].status" } }
          assert:
            - "response contains pagination fields limit == 10 (default), offset == 0, total_count == 1, has_more == false"
            - "first_status == IN_TRANSIT"
      - name: site_creation_with_unknown_study_returns_study_not_found
        claim_type: parent_relationships
        grounds: [entities.Site.fields.study_id, "errors[ERR_STUDY_NOT_FOUND]"]
        distinguishing_aspect: "A body FK that does not resolve is rejected with the parent-specific 404 ERR_STUDY_NOT_FOUND; no site is persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/sites", payload: { study_id: "00000000-0000-0000-0000-000000000000", site_number: "S1", name: "Site", principal_investigator: "Dr A" }, as: SponsorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STUDY_NOT_FOUND and HTTP status 404"
      - name: temperature_log_is_append_only_without_version
        claim_type: immutability
        grounds: [entities.TemperatureLog]
        distinguishing_aspect: "TemperatureLog declares common_fields: false — its representation carries id and created_at but NO version or updated_at fields, and no update endpoint exists."
        test_recipe:
          setup: ["study + site + staff exist"]
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-COR-5", title: "Corner", phase: "PHASE_I", blinding_model: "OPEN_LABEL", max_dose_per_visit_mg: 100 }, as: SponsorAdmin, captures: { study: $.data.id } }
            - { call: "POST /api/sites", payload: { study_id: "${study}", site_number: "S1", name: "Site", principal_investigator: "Dr A" }, as: SponsorAdmin, captures: { site: $.data.id } }
            - { call: "POST /api/staff", payload: { site_id: "${site}", full_name: "P", license_number: "L-COR-5" }, as: SponsorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/temperature-logs", payload: { site_id: "${site}", celsius: 5.0, source: "MANUAL" }, as: Pharmacist, as_user_id: "${p1}", captures: { log: $.data.id } }
          trigger:
            - { call: "GET /api/temperature-logs/${log}", as: SponsorAdmin }
          assert:
            - "response data contains id and created_at"
            - "response data contains NO 'version' key and NO 'updated_at' key"

  - section: state_machines
    instances:
      - name: kit_release_from_available_returns_kit_not_releasable
        claim_type: invalid_transition
        grounds: [state_machines.Kit.QUARANTINED_RECEIPT_to_AVAILABLE, "errors[ERR_KIT_NOT_RELEASABLE]"]
        distinguishing_aspect: "Release is only valid from QUARANTINED_RECEIPT; repeating it on an already-AVAILABLE kit fails with ERR_KIT_NOT_RELEASABLE and no state change."
        test_recipe:
          setup: ["study ACTIVE; site ACTIVE; kit K-RL released to AVAILABLE"]
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-SM-1", title: "SM", phase: "PHASE_II", blinding_model: "DOUBLE_BLIND", max_dose_per_visit_mg: 200, unblinding_suspension_threshold_pct: 10 }, as: SponsorAdmin, captures: { study: $.data.id, study_v1: $.data.version } }
            - { call: "POST /api/fee-schedules", payload: { study_id: "${study}", setup_fee_cents: 0, dispensing_fee_cents: 5000, dispensing_tier_threshold: 2, dispensing_tier_fee_cents: 3000, monitoring_fee_cents_per_hour: 10000, storage_fee_cents_per_kit_month: 100, unblinding_fee_cents: 25000, overhead_pct: 0 }, as: SponsorAdmin, captures: { fs: $.data.id } }
            - { call: "POST /api/fee-schedules/${fs}/approve", payload: { expected_study_version: "${study_v1}" }, as: SponsorAdmin }
            - { call: "POST /api/studies/${study}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin }
            - { call: "POST /api/sites", payload: { study_id: "${study}", site_number: "S1", name: "Site", principal_investigator: "Dr A" }, as: SponsorAdmin, captures: { site: $.data.id } }
            - { call: "POST /api/sites/${site}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin }
            - { call: "POST /api/staff", payload: { site_id: "${site}", full_name: "P", license_number: "L-SM-1" }, as: SponsorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/lots", payload: { study_id: "${study}", lot_number: "LOT-SM-1", product_name: "DrugX", strength_mg: 50, dosage_form: "VIAL", expiry_date: "2027-06-01T00:00:00Z", storage_temp_min_celsius: 2, storage_temp_max_celsius: 8, stability_budget_minutes: 600 }, as: SponsorAdmin, captures: { lot: $.data.id } }
            - { call: "POST /api/shipments", payload: { lot_id: "${lot}", site_id: "${site}", kit_numbers: ["K-RL"], units_per_kit: 10 }, as: SponsorAdmin, captures: { k1: "$.data[0].id" } }
            - { call: "POST /api/kits/${k1}/receive", payload: { storage_temp_celsius: 5 }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k1}/release", as: Pharmacist, as_user_id: "${p1}" }
          trigger:
            - { call: "POST /api/kits/${k1}/release", as: Pharmacist, as_user_id: "${p1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_KIT_NOT_RELEASABLE and HTTP status 409"
            - "Kit.${k1}.status remains AVAILABLE"
      - name: destroyed_kit_is_terminal_for_all_actions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Kit, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "A DESTROYED kit accepts no further transitions: receive and release both fail with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["full loop: kit dispensed (qty 4), returned (4), destruction DRAFT -> WITNESSED -> FINALIZED, so kit is DESTROYED"]
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-SM-2", title: "SM", phase: "PHASE_II", blinding_model: "DOUBLE_BLIND", max_dose_per_visit_mg: 200, unblinding_suspension_threshold_pct: 10 }, as: SponsorAdmin, captures: { study: $.data.id, study_v1: $.data.version } }
            - { call: "POST /api/fee-schedules", payload: { study_id: "${study}", setup_fee_cents: 0, dispensing_fee_cents: 5000, dispensing_tier_threshold: 2, dispensing_tier_fee_cents: 3000, monitoring_fee_cents_per_hour: 10000, storage_fee_cents_per_kit_month: 100, unblinding_fee_cents: 25000, overhead_pct: 0 }, as: SponsorAdmin, captures: { fs: $.data.id } }
            - { call: "POST /api/fee-schedules/${fs}/approve", payload: { expected_study_version: "${study_v1}" }, as: SponsorAdmin }
            - { call: "POST /api/studies/${study}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin, captures: { study_v3: $.data.version } }
            - { call: "POST /api/sites", payload: { study_id: "${study}", site_number: "S1", name: "Site", principal_investigator: "Dr A" }, as: SponsorAdmin, captures: { site: $.data.id } }
            - { call: "POST /api/sites/${site}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin }
            - { call: "POST /api/staff", payload: { site_id: "${site}", full_name: "P1", license_number: "L-SM-2a" }, as: SponsorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/staff", payload: { site_id: "${site}", full_name: "P2", license_number: "L-SM-2b" }, as: SponsorAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/lots", payload: { study_id: "${study}", lot_number: "LOT-SM-2", product_name: "DrugX", strength_mg: 50, dosage_form: "VIAL", expiry_date: "2027-06-01T00:00:00Z", storage_temp_min_celsius: 2, storage_temp_max_celsius: 8, stability_budget_minutes: 600 }, as: SponsorAdmin, captures: { lot: $.data.id } }
            - { call: "POST /api/shipments", payload: { lot_id: "${lot}", site_id: "${site}", kit_numbers: ["K-DS"], units_per_kit: 10 }, as: SponsorAdmin, captures: { k1: "$.data[0].id" } }
            - { call: "POST /api/kits/${k1}/receive", payload: { storage_temp_celsius: 5 }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k1}/release", as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/studies/${study}/randomization-slots/replace", payload: { slots: [ { sequence_number: 1, stratum: "STANDARD", kit_number: "K-DS", arm_code: "TRT-A" } ], expected_study_version: "${study_v3}" }, as: SponsorAdmin }
            - { call: "POST /api/subjects", payload: { site_id: "${site}", subject_number: "SUB-DS", stratum: "STANDARD" }, as: Pharmacist, as_user_id: "${p1}", captures: { sub: $.data.id } }
            - { call: "POST /api/subjects/${sub}/randomize", as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/dispensing-records", payload: { subject_id: "${sub}", kit_id: "${k1}", visit_number: 1, quantity_dispensed: 4 }, as: Pharmacist, as_user_id: "${p1}", captures: { disp: $.data.id } }
            - { call: "POST /api/returns", payload: { dispensing_record_id: "${disp}", quantity_returned: 4 }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/destruction-records", payload: { kit_id: "${k1}", site_id: "${site}", method: "INCINERATION", facility_window_start: "2026-08-20T10:00:00Z", facility_window_end: "2026-08-20T11:00:00Z", quantity_destroyed: 10, witness_staff_id: "${p2}" }, as: Pharmacist, as_user_id: "${p1}", captures: { dr: $.data.id } }
            - { call: "POST /api/destruction-records/${dr}/attest", as: Pharmacist, as_user_id: "${p2}" }
            - { call: "POST /api/destruction-records/${dr}/finalize", as: Pharmacist, as_user_id: "${p1}" }
          trigger:
            - { call: "POST /api/kits/${k1}/release", as: Pharmacist, as_user_id: "${p1}", captures: { err: $.data.error_id } }
          assert:
            - "before trigger: Kit.${k1}.status == DESTROYED and units_destroyed == 10 and on_hand_units == 0"
            - "err == ERR_ALREADY_TERMINAL and HTTP status 409; status remains DESTROYED"
      - name: shipment_creates_kits_in_initial_in_transit_state
        claim_type: initial_state
        grounds: [state_machines.Kit]
        distinguishing_aspect: "Kits created by a shipment start in IN_TRANSIT, not AVAILABLE or QUARANTINED_RECEIPT."
        test_recipe:
          setup: ["study + site + lot exist"]
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-SM-3", title: "SM", phase: "PHASE_I", blinding_model: "OPEN_LABEL", max_dose_per_visit_mg: 100 }, as: SponsorAdmin, captures: { study: $.data.id } }
            - { call: "POST /api/sites", payload: { study_id: "${study}", site_number: "S1", name: "Site", principal_investigator: "Dr A" }, as: SponsorAdmin, captures: { site: $.data.id } }
            - { call: "POST /api/lots", payload: { study_id: "${study}", lot_number: "LOT-SM-3", product_name: "DrugX", strength_mg: 50, dosage_form: "VIAL", expiry_date: "2027-06-01T00:00:00Z", storage_temp_min_celsius: 2, storage_temp_max_celsius: 8, stability_budget_minutes: 600 }, as: SponsorAdmin, captures: { lot: $.data.id } }
          trigger:
            - { call: "POST /api/shipments", payload: { lot_id: "${lot}", site_id: "${site}", kit_numbers: ["K-IT"], units_per_kit: 10 }, as: SponsorAdmin, captures: { st: "$.data[0].status" } }
          assert:
            - "st == IN_TRANSIT"
      - name: randomize_twice_returns_subject_not_randomizable
        claim_type: invalid_transition
        grounds: [state_machines.Subject.SCREENING_to_RANDOMIZED, "errors[ERR_SUBJECT_NOT_RANDOMIZABLE]"]
        distinguishing_aspect: "Randomize is only valid from SCREENING; a second randomize on a RANDOMIZED subject fails with ERR_SUBJECT_NOT_RANDOMIZABLE and consumes no slot."
        test_recipe:
          setup: ["study ACTIVE; site ACTIVE; kits K-R1/K-R2 AVAILABLE; slots seq 1/2; SUB-RT already randomized (slot 1 consumed)"]
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-SM-4", title: "SM", phase: "PHASE_II", blinding_model: "DOUBLE_BLIND", max_dose_per_visit_mg: 200, unblinding_suspension_threshold_pct: 10 }, as: SponsorAdmin, captures: { study: $.data.id, study_v1: $.data.version } }
            - { call: "POST /api/fee-schedules", payload: { study_id: "${study}", setup_fee_cents: 0, dispensing_fee_cents: 5000, dispensing_tier_threshold: 2, dispensing_tier_fee_cents: 3000, monitoring_fee_cents_per_hour: 10000, storage_fee_cents_per_kit_month: 100, unblinding_fee_cents: 25000, overhead_pct: 0 }, as: SponsorAdmin, captures: { fs: $.data.id } }
            - { call: "POST /api/fee-schedules/${fs}/approve", payload: { expected_study_version: "${study_v1}" }, as: SponsorAdmin }
            - { call: "POST /api/studies/${study}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin, captures: { study_v3: $.data.version } }
            - { call: "POST /api/sites", payload: { study_id: "${study}", site_number: "S1", name: "Site", principal_investigator: "Dr A" }, as: SponsorAdmin, captures: { site: $.data.id } }
            - { call: "POST /api/sites/${site}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin }
            - { call: "POST /api/staff", payload: { site_id: "${site}", full_name: "P", license_number: "L-SM-4" }, as: SponsorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/lots", payload: { study_id: "${study}", lot_number: "LOT-SM-4", product_name: "DrugX", strength_mg: 50, dosage_form: "VIAL", expiry_date: "2027-06-01T00:00:00Z", storage_temp_min_celsius: 2, storage_temp_max_celsius: 8, stability_budget_minutes: 600 }, as: SponsorAdmin, captures: { lot: $.data.id } }
            - { call: "POST /api/shipments", payload: { lot_id: "${lot}", site_id: "${site}", kit_numbers: ["K-R1", "K-R2"], units_per_kit: 10 }, as: SponsorAdmin, captures: { k1: "$.data[0].id", k2: "$.data[1].id" } }
            - { call: "POST /api/kits/${k1}/receive", payload: { storage_temp_celsius: 5 }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k1}/release", as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k2}/receive", payload: { storage_temp_celsius: 5 }, as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/kits/${k2}/release", as: Pharmacist, as_user_id: "${p1}" }
            - { call: "POST /api/studies/${study}/randomization-slots/replace", payload: { slots: [ { sequence_number: 1, stratum: "STANDARD", kit_number: "K-R1", arm_code: "TRT-A" }, { sequence_number: 2, stratum: "STANDARD", kit_number: "K-R2", arm_code: "PBO" } ], expected_study_version: "${study_v3}" }, as: SponsorAdmin }
            - { call: "POST /api/subjects", payload: { site_id: "${site}", subject_number: "SUB-RT", stratum: "STANDARD" }, as: Pharmacist, as_user_id: "${p1}", captures: { sub: $.data.id } }
            - { call: "POST /api/subjects/${sub}/randomize", as: Pharmacist, as_user_id: "${p1}" }
          trigger:
            - { call: "POST /api/subjects/${sub}/randomize", as: Pharmacist, as_user_id: "${p1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SUBJECT_NOT_RANDOMIZABLE and HTTP status 409"
            - "exactly one slot is ASSIGNED (the second randomize consumed nothing): GET /api/randomization-slots?study_id&status=ASSIGNED has total_count == 1"
      - name: excursion_assess_after_resolution_returns_already_resolved
        claim_type: invalid_transition
        grounds: [state_machines.TemperatureExcursion, "errors[ERR_EXCURSION_ALREADY_RESOLVED]"]
        distinguishing_aspect: "Assess on a non-OPEN excursion (already RESOLVED_ACCEPTABLE) with outcome UNACCEPTABLE fails with ERR_EXCURSION_ALREADY_RESOLVED; only VOID is legal from RESOLVED_ACCEPTABLE."
        test_recipe:
          setup: ["study ACTIVE; site ACTIVE; lot range [2,8]; kit AVAILABLE; excursion opened by one 9.0 reading, assessed ACCEPTABLE"]
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-SM-5", title: "SM", phase: "PHASE_II", blinding_model: "DOUBLE_BLIND", max_dose_per_visit_mg: 200, unblinding_suspension_threshold_pct: 10 }, as: SponsorAdmin, captures: { study: $.data.id, study_v1: $.data.version } }
            - { call: "POST /api/fee-schedules", payload: { study_id: "${study}", setup_fee_cents: 0, dispensing_fee_cents: 5000, dispensing_tier_threshold: 2, dispensing_tier_fee_cents: 3000, monitoring_fee_cents_per_hour: 10000, storage_fee_cents_per_kit_month: 100, unblinding_fee_cents: 25000, overhead_pct: 0 }, as: SponsorAdmin, captures: { fs: $.data.id } }
            - { call: "POST /api/fee-schedules/${fs}/approve", payload: { expected_study_version: "${study_v1}" }, as: SponsorAdmin }
            - { call: "POST /api/studies/${study}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin }
            - { call: "POST /api/sites", payload: { study_id: "${study}", site_number: "S1", name: "Site", principal_investigator: "Dr A" }, as: SponsorAdmin, captures: { site: $.data.id } }
            - { call: "POST /api/sites/${site}/transition", payload: { to: "ACTIVE" }, as: SponsorAdmin }
            - { call: "POST /api/staff", payload: { site_id: "${site}", full_name: "P", license_number: "L-SM-5" }, as: SponsorAdmin, captures: { p1: $.data.id } }
