              payload: { client_id: "${client_id}" }
              as: IntakeCoordinator
          assert:
            - "response is an array containing Episode.${ep_id}"
            - "response meta/envelope includes total_count and has_more for the filtered list"

      - name: room_close_blocks_confirm
        claim_type: Conditional action
        grounds: [endpoints, state_machines.Booking.transitions.HELD_to_CONFIRMED, entities.Room.fields.status]
        distinguishing_aspect: "Confirming a HELD booking whose Room is CLOSED -> ERR_INVALID_STATE (409): Room.status==OPEN is a confirm precondition."
        test_recipe:
          setup: ["Standard kit+package+client+episode; Room R1 with a HELD booking, then the room is closed."]
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
            - call: "POST /birth-center/rooms"
              payload: { name: "Garden Suite", turnover_minutes: 0 }
              as: CenterAdmin
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /birth-center/bookings"
              payload: { episode_id: "${ep_id}", room_id: "${room_id}", starts_at: "2026-01-02T00:00:00Z", ends_at: "2026-01-03T00:00:00Z", expected_room_version: "${room_v}" }
              as: CenterAdmin
              captures: { bk_id: $.data.id }
            - call: "POST /birth-center/rooms/${room_id}/close"
              payload: {}
              as: CenterAdmin
          trigger:
            - call: "POST /birth-center/bookings/${bk_id}/confirm"
              payload: {}
              as: CenterAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE (Room CLOSED)"

