scaffold_difficulty_design:

  # ------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: fee_late_charge_accrual_vs_frozen
        grounds:
          - calculations.fee_late_charge
          - calculations.fee_late_charge.variants.accrual_until_now
          - calculations.fee_late_charge.variants.frozen_at_payment
          - state_machines.FeeBill.OVERDUE_to_PAID
        distinguishing_aspect: |
          Operates on the FeeBill (billing) entity domain: accrual_until_now lets late_fee_amount grow with each clock advance, while frozen_at_payment freezes it at the timestamp of the fully reconciling payment. Identical principal + late_fee_daily_rate inputs yield different total_due depending on whether payment has reached the freeze instant.
        test_recipe:
          setup:
            - "Create FeeBillingRule(kind=PER_SQM_MONTHLY, rate=2.50, late_fee_daily_rate=0.0005, late_fee_cap_pct=0.30)"
            - "Create Property(area_sqm=80.00) with Owner; issue bill for previous month so principal_amount=200.00, due_date set 14 days into that month"
            - "POST /_clock/advance to a date 20 days past due_date — bill auto-transitions OPEN→OVERDUE; total_due must be 202.00"
          trigger:
            - "POST /payments {bill_id, channel=WECHAT, external_txn_id=tx1, amount=202.00, paid_at=now()} — bill transitions OVERDUE→PAID"
            - "POST /_clock/advance another 30 days"
            - "GET /fee-bills/{id}"
          assert:
            - "After payment, FeeBill.late_fee_amount == 2.00 and total_due == 202.00 (frozen_at_payment variant)"
            - "After the further 30 days clock advance, FeeBill.late_fee_amount STILL == 2.00 (variant pinned to payment_freeze_at, not now())"
            - "If instead no payment had occurred, fee_late_charge accrual_until_now would have produced late_fee_amount == 5.00 and total_due == 205.00 at the post-advance read"

      - name: vote_tally_per_household_vs_per_area
        grounds:
          - calculations.vote_tally
          - calculations.vote_tally.variants.per_household
          - calculations.vote_tally.variants.per_area
          - state_machines.Proposal.OPEN_to_TALLIED_PASSED
          - state_machines.Proposal.OPEN_to_TALLIED_FAILED
        distinguishing_aspect: |
          Operates on the Proposal (governance) entity domain — distinct from fee_late_charge's billing domain. Same set of cast Vote rows, same eligible owner population, but per_household weights every property at 1.0 while per_area weights by Property.area_sqm; the two variants can flip a result from PASS to FAIL on identical inputs.
        test_recipe:
          setup:
            - "Create 4 Owners with 4 Properties of area_sqm {80.00, 100.00, 120.00, 200.00}; all ELIGIBLE"
            - "Create Proposal A with voting_method=PER_HOUSEHOLD, pass_threshold_pct=0.6667"
            - "Create Proposal B with voting_method=PER_AREA, pass_threshold_pct=0.6667 (same window)"
            - "Open both proposals; cast YES for the 80.00, 100.00 and 120.00 properties; NO for the 200.00 property"
            - "Advance clock past voting_ends_at"
          trigger:
            - "POST /proposals/A/tally"
            - "POST /proposals/B/tally"
          assert:
            - "Proposal A.eligible_weight_total == 4.0; A.yes_weight == 3.0; A.status == TALLIED_PASSED (3.0/4.0 = 0.75 >= 0.6667)"
            - "Proposal B.eligible_weight_total == 500.00; B.yes_weight == 300.00; B.status == TALLIED_FAILED (300.00/500.00 = 0.60 < 0.6667)"

  # ------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: fee_principal_per_line_rounding_then_discount
        grounds:
          - calculations.fee_principal
          - calculations.fee_principal.variants.regular_property_fee
        distinguishing_aspect: |
          Mode (b) — nested-rounding order matters. The scaffold pins per-line rounding: round(rate*area_sqm, 2) FIRST, then apply 12-month discount, then round again. "Sum-then-round" (apply discount on the unrounded base) yields different cents at boundary inputs.
        test_recipe:
          setup:
            - "Create FeeBillingRule(kind=PER_SQM_MONTHLY, rate=2.485)"
            - "Create Property(area_sqm=80.20) with Owner who has 12 consecutive PAID bills preceding (qualifies for 5% discount)"
          trigger:
            - "POST /fee-bills/issue {period_year, period_month}"
          assert:
            - "FeeBill.principal_amount == 189.34  # per-line: base = round(2.485*80.20, 2) = round(199.297, 2) = 199.30; principal = round(199.30*0.95, 2) = round(189.335, 2) = 189.34"
            - "Sum-then-round alternative would compute round(2.485*80.20*0.95, 2) = round(189.33215, 2) = 189.33 — DIFFERENT cents. Assert exact 189.34 to enforce per-line rounding order."

      - name: vote_pass_threshold_branch_on_frozen_denominator
        grounds:
          - calculations.vote_tally
          - state_machines.Proposal.DRAFT_to_OPEN
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency where evaluation order is pinned. The vote pass criterion uses eligible_weight_total FROZEN at OPEN time, NOT live (yes+no+abstain) at tally; if an Owner becomes INELIGIBLE_DELINQUENT during the voting window, their pre-frozen weight still counts as denominator while their absent vote does not count as numerator. The scaffold pins the freeze instant; reversing the order (re-snapshotting at tally) flips outcomes.
        test_recipe:
          setup:
            - "Create 3 Owners (each one Property), all ELIGIBLE; method PER_HOUSEHOLD; pass_threshold_pct=0.6667"
            - "POST /proposals + open — eligible_weight_total frozen = 3.0"
            - "Cast 2 YES from owners 1 and 2; before owner 3 votes, mark a FeeBill OVERDUE for owner 3 (simulate via clock advance) so voting_status=INELIGIBLE_DELINQUENT"
            - "Owner 3 attempts to vote — must be rejected (was on the eligible list snapshot? — yes, snapshot was at OPEN; ERR_VOTER_NOT_ELIGIBLE only fires for owners NOT on snapshot)"
            - "Clock advances past voting_ends_at"
          trigger:
            - "POST /proposals/{id}/tally"
          assert:
            - "Proposal.eligible_weight_total == 3.0 (frozen, NOT 2.0 even though one owner is delinquent at tally time)"
            - "Proposal.yes_weight == 2.0; ratio 2.0/3.0 = 0.6667 — exactly at threshold"
            - "Because pass criterion is yes/eligible >= 0.6667 and 2.0/3.0 = 0.6666... < 0.6667 (numerically), Proposal.status == TALLIED_FAILED. (Boundary check on >= — see Rule 6.)"

  # ------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # ------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_revision_cycle_resolved_to_submitted
        grounds:
          - state_machines.WorkOrder
          - state_machines.WorkOrder.RESOLVED_to_SUBMITTED
          - state_machines.WorkOrder.SUBMITTED_to_DISPATCHED
        distinguishing_aspect: |
          Cycle on WorkOrder: SUBMITTED → DISPATCHED → IN_PROGRESS → RESOLVED → SUBMITTED (reopen) → DISPATCHED again. Owner can reopen within the 72h confirm window, returning the work order to SUBMITTED so it loops through dispatch and resolution once more. This cycle (revision loop) is on the WorkOrder entity.
        test_recipe:
          setup:
            - "Create Property + Owner; submit work order; dispatch; start; resolve"
            - "Within 72h of resolved_at:"
          trigger:
            - "POST /work-orders/{id}/reopen as Owner"
            - "POST /work-orders/{id}/dispatch (second iteration)"
          assert:
            - "After reopen: WorkOrder.status == SUBMITTED, assigned_staff_id is null, resolved_at is null, confirm_deadline_at is null"
            - "After second dispatch: WorkOrder.status == DISPATCHED again — the revision cycle proves the state machine is non-linear (visits SUBMITTED twice)"
            - "WorkOrder.version increments on each reopen"

      - name: fee_bill_branching_payment_paths
        grounds:
          - state_machines.FeeBill
          - state_machines.FeeBill.OPEN_to_PARTIALLY_PAID
          - state_machines.FeeBill.OPEN_to_PAID
          - state_machines.FeeBill.OPEN_to_OVERDUE
          - state_machines.FeeBill.PARTIALLY_PAID_to_PAID
          - state_machines.FeeBill.OPEN_to_WAIVED
        distinguishing_aspect: |
          Branching fork on FeeBill from OPEN: the same outbound state has 4 divergent next-states — OVERDUE (auto via clock), PARTIALLY_PAID (small payment), PAID (full payment), WAIVED (manager action). Each branch carries different side_effects (dunning_stage move, voting_status recompute, AuditEntry shape). Distinct from Rule 3's cycle on WorkOrder — same rule_id but non-linear shape on a different entity.
        test_recipe:
          setup:
            - "Create three FeeBills (B1, B2, B3) all status=OPEN, principal_amount=200.00, due_date=now()+14d"
          trigger:
            - "B1: POST /payments amount=50.00 → expect PARTIALLY_PAID"
            - "B2: POST /payments amount=200.00 → expect PAID"
            - "B3: POST /fee-bills/{B3}/waive {reason='hardship'} → expect WAIVED"
            - "Issue B4 separately, advance clock past due_date with no payment → expect OVERDUE"
          assert:
            - "B1.status == PARTIALLY_PAID; B2.status == PAID; B3.status == WAIVED; B4.status == OVERDUE"
            - "Each branch's side_effects diverge — B2 freezes late_fee, B3 appends AuditEntry(BILL_WAIVED), B4 sets dunning_stage=REMINDED"

  # ------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # ------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: clock_advance_overdue_dunning_voting_disqualification
        grounds:
          - state_machines.FeeBill.OPEN_to_OVERDUE
          - state_machines.FeeBill.OVERDUE_to_OVERDUE
          - calculations.fee_late_charge
          - validations[priority=12]
          - state_machines.Proposal.OPEN_to_TALLIED_FAILED
        distinguishing_aspect: |
          Depth-3 cascade (different trigger from Rule 4 instance 2). Triggering action: POST /_clock/advance.
          Hop 1: clock advance mutates FeeBill.status OPEN→OVERDUE and recomputes late_fee_amount (the FeeBill mutation IS the side effect of the clock event).
          Hop 2: that FeeBill mutation itself causes Owner.voting_status to recompute to INELIGIBLE_DELINQUENT (the Owner mutation is caused by the bill mutation, not by the original clock advance).
          Hop 3: that Owner mutation in turn blocks the next attempted POST /reservations with ERR_OWNER_DELINQUENT (the reservation rejection is caused by the voting_status mutation).
          Each hop is caused by the previous one; this is a chain, not a fan-out.
        test_recipe:
          setup:
            - "Create Owner+Property; issue FeeBill principal=200.00 due 14d into the period; status=OPEN"
            - "Create Facility(damage_deposit=100, capacity_per_slot=1)"
          trigger:
            - "POST /_clock/advance to due_date + 20d"
            - "POST /reservations as Owner"
          assert:
            - "Hop 1: FeeBill.status flipped OPEN→OVERDUE; FeeBill.late_fee_amount > 0; FeeBill.dunning_stage == REMINDED"
            - "Hop 2: Owner.voting_status flipped to INELIGIBLE_DELINQUENT (caused by the bill flip — the cascade engine recomputes voting_status whenever any FeeBill of an owner's properties enters OVERDUE)"
            - "Hop 3: POST /reservations returns 403 ERR_OWNER_DELINQUENT (caused by the voting_status flip — fresh request would have succeeded before)"

      - name: reservation_damage_spillover_cascade
        grounds:
          - state_machines.Reservation.CHECKED_IN_to_DAMAGED
          - calculations.reservation_deposit_settlement
          - state_machines.FeeBill.OPEN_to_OVERDUE
          - validations[priority=12]
        distinguishing_aspect: |
          Depth-≥2 cascade originating from a different trigger than instance 1: the manager's POST /reservations/{id}/close with damage_amount > deposit_held.
          Hop 1: close action mutates Reservation.status CHECKED_IN→DAMAGED and absorbs deposit (Reservation mutation is the side effect of the close).
          Hop 2: that Reservation mutation itself causes a NEW FeeBill to be created with principal_amount=spillover (the FeeBill creation is caused by the Reservation mutation, not by the original API call's body).
          (Optional Hop 3 reachable: subsequent clock advance pushes that spillover bill OPEN→OVERDUE and re-disqualifies the owner — depth 3 if exercised.)
        test_recipe:
          setup:
            - "Create Owner+Property; Facility(damage_deposit=500.00, slot_minutes=60); reservation booked, deposit_held=500.00"
            - "Owner check-in; clock past slot_end_at"
          trigger:
            - "POST /reservations/{id}/close {damage_amount=800.00} as PropertyManager"
          assert:
            - "Hop 1: Reservation.status == DAMAGED; deposit_held forfeited (set 0)"
            - "Hop 2: A NEW FeeBill exists tied to the same Property with principal_amount == 300.00 (= damage_amount - deposit, computed via reservation_deposit_settlement spillover branch), status=OPEN, due_date == close_at + 14d. The bill creation is caused by the Reservation mutation, not directly by the close request body"

  # ------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_reservation
        grounds:
          - validations[priority=6]
          - validations[priority=12]
        distinguishing_aspect: |
          Error-category pair: state (priority 6) vs business_safety (priority 12). When a delinquent owner attempts POST /reservations/{id}/cancel on an already-CANCELLED reservation, both checks fail; the priority order says state wins, returning ERR_INVALID_STATE not ERR_OWNER_DELINQUENT. (Note: ERR_OWNER_DELINQUENT applies to POST /reservations creation; here we use POST /reservations as the triggering endpoint where both could collide — see test recipe.)
        test_recipe:
          setup:
            - "Create delinquent Owner (one OVERDUE FeeBill); voting_status=INELIGIBLE_DELINQUENT"
            - "Create Facility; submit a Reservation in BOOKED state (allow even if delinquent for setup purposes by clearing then re-flipping delinquency post-booking)"
            - "Now the owner has both: an existing OVERDUE bill AND attempts to book a NEW reservation while the existing one is BOOKED"
          trigger:
            - "POST /reservations as Owner — server sees both: (a) ERR_OWNER_DELINQUENT precondition could fire (priority 12), and (b) state-precondition style error if the request also had a stale reservation reference. Concretely, test crafts a request whose path id refers to an entity in wrong state AND the owner is delinquent."
            - "Concretely: POST /reservations/{id}/check-in on a CANCELLED reservation while owner is delinquent — both INVALID_STATE (the reservation is CANCELLED) and OWNER_DELINQUENT could apply"
          assert:
            - "Server returns 409 ERR_INVALID_STATE (priority 6 state precedes priority 12 business_safety), NOT 403 ERR_OWNER_DELINQUENT"
            - "Error-category pair distinction verified: state vs business_safety — different from instance 2's pair"

      - name: business_constraint_vs_business_fiscal_on_payment
        grounds:
          - validations[priority=16]
          - validations[priority=17]
        distinguishing_aspect: |
          Error-category pair: business_constraint (priority 16, ERR_DUPLICATE_PAYMENT) vs business_fiscal (priority 17, ERR_PAYMENT_AMOUNT_INVALID). When a duplicate (channel, external_txn_id) is also accompanied by an amount of 0, both fail. Priority 16 fires first → ERR_DUPLICATE_PAYMENT.
        test_recipe:
          setup:
            - "Create FeeBill with total_due=200.00"
            - "Submit a successful POST /payments (channel=WECHAT, external_txn_id=tx1, amount=200.00)"
          trigger:
            - "POST /payments {channel=WECHAT, external_txn_id=tx1, amount=0}  # duplicate AND invalid amount"
          assert:
            - "Server returns 409 ERR_DUPLICATE_PAYMENT, NOT 422 ERR_PAYMENT_AMOUNT_INVALID"
            - "Error-category pair distinction verified: business_constraint vs business_fiscal — different from instance 1's state vs business_safety pair"

  # ------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: vote_pass_threshold_strict_ge
        grounds:
          - calculations.vote_tally
          - state_machines.Proposal.OPEN_to_TALLIED_PASSED
          - state_machines.Proposal.OPEN_to_TALLIED_FAILED
        distinguishing_aspect: |
          Numeric metric boundary on yes_weight/eligible_weight_total >= pass_threshold_pct, reachable through endpoint POST /proposals/{id}/tally. Tests exact equality at the threshold: 2/3 = 0.6666... vs threshold 0.6667 — strictly less, so FAIL. Demonstrates that pass criterion uses strict >= without rounding.
        test_recipe:
          setup:
            - "3 ELIGIBLE owners (one property each); PER_HOUSEHOLD; pass_threshold_pct=0.6667"
            - "Open proposal; cast 2 YES, 0 NO, owner 3 abstains"
            - "Advance past voting_ends_at"
          trigger:
            - "POST /proposals/{id}/tally"
          assert:
            - "Proposal.status == TALLIED_FAILED (2.0/3.0 = 0.6666... is strictly less than 0.6667)"
            - "If instead 2 of 2 ELIGIBLE owners voted YES (eligible_weight_total=2.0, yes_weight=2.0, ratio=1.0), status would be TALLIED_PASSED — boundary distinguishes >= from >"

      - name: facility_slot_full_capacity_boundary
        grounds:
          - validations[priority=11]
          - entities.Facility.fields.capacity_per_slot
          - concurrency_rules[scenario-keyword=facility-slot]
        distinguishing_aspect: |
          Empty-set / count-equals-capacity boundary on a different metric (Reservation count per slot), reachable through a different endpoint POST /reservations. Distinct from instance 1's numeric-ratio boundary.
        test_recipe:
          setup:
            - "Facility F with capacity_per_slot=2, slot_minutes=60"
            - "Two Reservations exist for slot S in BOOKED state"
          trigger:
            - "POST /reservations {facility_id=F, slot_start_at=S, slot_end_at=S+60min} from third Owner"
          assert:
            - "Server returns 409 ERR_FACILITY_SLOT_FULL — the count is exactly 2 == capacity, the third is rejected. Confirms boundary uses strict '< capacity' semantics."
            - "If two existing reservations were instead CANCELLED, count of non-terminal reservations is 0 and the third booking succeeds — empty-set edge tested"

  # ------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: reservation_check_in_blocked_when_owner_delinquent
        grounds:
          - state_machines.Reservation
          - validations[priority=12]
          - entities.Owner.fields.voting_status
        distinguishing_aspect: |
          Entity pair: Reservation × Owner. Reservation transitions (specifically POST /reservations creation, and as a side-effect /residents tenant move-in) depend on Owner.voting_status != INELIGIBLE_DELINQUENT. Distinct from the entity pair in instance 2.
        test_recipe:
          setup:
            - "Owner with one OVERDUE FeeBill → voting_status=INELIGIBLE_DELINQUENT"
            - "Create Facility"
          trigger:
            - "POST /reservations as Owner"
          assert:
            - "Server returns 403 ERR_OWNER_DELINQUENT — the Reservation transition (creation) was blocked by Owner's state, not by anything about the Reservation itself"

      - name: parking_application_approve_requires_property_quota_room
        grounds:
          - state_machines.ParkingApplication.PENDING_to_APPROVED
          - validations[priority=13]
          - entities.Property.fields.parking_quota
        distinguishing_aspect: |
          Entity pair: ParkingApplication × Property — different pair from instance 1's Reservation × Owner. Approving a FIXED ParkingApplication is gated by Property.parking_quota minus existing APPROVED FIXED applications for that property.
        test_recipe:
          setup:
            - "Property P with parking_quota=1; one existing APPROVED FIXED ParkingApplication on P"
            - "Create AVAILABLE ParkingSpace S2 (kind=FIXED)"
            - "Create new PENDING ParkingApplication PA2 on P (requested_kind=FIXED)"
          trigger:
            - "POST /parking-applications/{PA2}/approve {allocated_space_id=S2}"
          assert:
            - "Server returns 422 ERR_PARKING_QUOTA_EXCEEDED — the ParkingApplication transition was blocked by the Property's quota state, not the application's own fields"
            - "Different entity pair from instance 1; both pairs exercise cross-entity dependencies"

  # ------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: facility_slot_half_open_interval_with_capacity
        grounds:
          - entities.Facility.fields.slot_minutes
          - entities.Facility.fields.capacity_per_slot
          - validations[priority=9]
          - validations[priority=11]
        distinguishing_aspect: |
          Resource: Facility slots. Interval semantics: HALF-OPEN [slot_start_at, slot_end_at) on a discrete grid (multiples of slot_minutes from 00:00 base), AGGREGATE-CAPACITY-BASED — multiple reservations may coexist up to capacity_per_slot. Adjacent intervals (one ending exactly when next begins) do NOT overlap because of half-open semantics.
        test_recipe:
          setup:
            - "Facility F with slot_minutes=60, capacity_per_slot=1"
            - "Reservation R1 BOOKED for slot [10:00, 11:00)"
          trigger:
            - "POST /reservations {facility_id=F, slot_start_at=11:00, slot_end_at=12:00} (adjacent slot)"
            - "POST /reservations {facility_id=F, slot_start_at=10:30, slot_end_at=11:30} (misaligned overlap)"
          assert:
            - "Adjacent slot [11:00, 12:00) succeeds — half-open intervals do NOT collide at the boundary"
            - "Misaligned slot [10:30, 11:30) returns 422 ERR_SLOT_MISALIGNED (start not on grid), demonstrating grid-snap rejection before overlap check"
            - "If a properly grid-aligned overlap were attempted [10:00,11:00), capacity check returns 409 ERR_FACILITY_SLOT_FULL"

      - name: parking_space_exclusive_allocation
        grounds:
          - state_machines.ParkingApplication.PENDING_to_APPROVED
          - entities.ParkingSpace.fields.status
          - validations[priority=15]
          - concurrency_rules[scenario-keyword=parking-space]
        distinguishing_aspect: |
          Resource: ParkingSpace — different resource entity from instance 1 (Facility). Interval semantics: SINGLE-OCCUPANT, OPEN-ENDED (allocation runs from started_at until TERMINATED with no fixed end), CAPACITY=1 (no aggregate concept). Distinct geometric treatment: instance 1 is bounded half-open intervals with capacity; this is open-ended exclusive lock.
        test_recipe:
          setup:
            - "ParkingSpace S kind=FIXED, status=AVAILABLE"
            - "Two PENDING ParkingApplications PA1 and PA2 both targeting S"
          trigger:
            - "POST /parking-applications/{PA1}/approve {allocated_space_id=S} (succeeds, S→ALLOCATED)"
            - "POST /parking-applications/{PA2}/approve {allocated_space_id=S}"
          assert:
            - "Second approval returns 409 ERR_PARKING_SPACE_TAKEN — exclusive lock semantics, no overlap allowed regardless of any time bounds"
            - "Distinct interval semantics from instance 1 — different resource entity, different geometric treatment"

  # ------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: reservation_deposit_conservation_yuan
        grounds:
          - calculations.reservation_deposit_settlement
          - state_machines.Reservation.BOOKED_to_CANCELLED
          - state_machines.Reservation.CHECKED_IN_to_COMPLETED
        distinguishing_aspect: |
          Conserved quantity: deposit yuan-amount on the Reservation. Forward action POST /reservations holds deposit_held = facility.damage_deposit; compensating actions (cancel within window, completed normally) MUST satisfy: facility.damage_deposit == refund + forfeit_to_property (and remaining deposit_held after settlement reflects only the post-settlement state). Spillover from DAMAGED is NOT included because it's a separate conserved quantity (creates a new FeeBill).
        test_recipe:
          setup:
            - "Facility F damage_deposit=500.00, cancellation_window_hours=24"
            - "Reservation R booked >24h in advance, deposit_held=500.00"
          trigger:
            - "POST /reservations/{R}/cancel as Owner (within free window)"
          assert:
            - "Invariant: 500.00 (initial deposit) == refund (500.00) + forfeit (0.00). Sum exact, no drift."
            - "Late-cancel variant: if cancelled within 24h, refund==250.00 and forfeit==250.00 — sum still 500.00. Invariant holds across both branches of the compensating action."

      - name: vote_weight_conservation_yes_no_abstain
        grounds:
          - calculations.vote_tally
          - state_machines.Proposal.DRAFT_to_OPEN
          - entities.Vote.fields.weight
        distinguishing_aspect: |
          Conserved quantity: vote-weight units (DIFFERENT type from yuan in instance 1). Invariant: at any moment after Proposal.OPEN, sum of cast Vote.weight over (YES + NO + ABSTAIN choices) == total weight cast, and this sum can only grow — never decrease — because votes are append-only (no compensating "uncast" action). Additionally, eligible_weight_total - sum_of_cast_weights == abstainers_not_yet_voted_weight; this remainder is invariant under any single Vote insertion (one new vote shifts exactly one unit of weight from "not-cast" into one of the three buckets).
        test_recipe:
          setup:
            - "Proposal P with PER_AREA, eligible owners with areas [80, 100, 120, 200]; eligible_weight_total = 500.00 frozen at OPEN"
            - "Cast Vote v1: owner of area 80, choice=YES → yes_weight=80, total_cast=80, uncast=420"
            - "Cast Vote v2: owner of area 100, choice=NO → yes_weight=80, no_weight=100, total_cast=180, uncast=320"
          trigger:
            - "GET /proposals/{P} after each cast"
          assert:
            - "Before any vote: yes_weight + no_weight + abstain_weight + uncast == 500.00 (uncast=500.00, others=0). After v1: 80 + 0 + 0 + 420 == 500.00. After v2: 80 + 100 + 0 + 320 == 500.00."
