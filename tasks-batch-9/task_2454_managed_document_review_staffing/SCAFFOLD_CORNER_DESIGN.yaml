              as: EngagementManager
              captures: { e3: $.data.error_id }
            - call: "GET /sessions/66666666-6666-4666-8666-666666666666"
              payload: {}
              as: EngagementManager
              captures: { e4: $.data.error_id }
            - call: "GET /assignments/66666666-6666-4666-8666-666666666666"
              payload: {}
              as: EngagementManager
              captures: { e5: $.data.error_id }
            - call: "GET /qc-samples/66666666-6666-4666-8666-666666666666"
              payload: {}
              as: EngagementManager
              captures: { e6: $.data.error_id }
            - call: "GET /privilege-log-entries/66666666-6666-4666-8666-666666666666"
              payload: {}
              as: EngagementManager
              captures: { e7: $.data.error_id }
          assert:
            - "all seven calls return HTTP 404 with success false, data null and a non-null error_id"
            - "the error ids are, in order, ERR_PROTOCOL_NOT_FOUND, ERR_SCREENING_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_SESSION_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_QC_SAMPLE_NOT_FOUND, ERR_PRIVILEGE_ENTRY_NOT_FOUND"
            - "GET /clients/66666666-6666-4666-8666-666666666666 would likewise return ERR_CLIENT_NOT_FOUND, completing the 404 family"

      - name: removed_reviewer_is_refused
        claim_type: triggerability
        grounds:
          - errors[ERR_REVIEWER_REMOVED]
        excluded_because:
          difficulty_instance: transitive_cascade / qc_failure_to_strike_to_removal_to_void_sweep
          rationale: "Removal is only reachable through the three-strike cascade, which that instance drives end to end and then asserts the refusal of further work."

      - name: onsite_seats_exhausted_is_reachable
        claim_type: triggerability
        grounds:
          - errors[ERR_ONSITE_SEATS_EXHAUSTED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / onsite_seat_overlap_is_half_open
          rationale: "That instance saturates the seats with two overlapping sessions and asserts both the 409 and the adjacent-window success."

      - name: agreement_coverage_overlap_is_reachable
        claim_type: triggerability
        grounds:
          - errors[ERR_CA_COVERAGE_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / agreement_coverage_overlap_is_closed_interval
          rationale: "The closed-interval overlap (2026-10-31 rejected, 2026-11-01 accepted) is asserted there."

      - name: budget_cap_breach_is_reachable
        claim_type: triggerability
        grounds:
          - errors[ERR_BUDGET_WOULD_EXCEED]
        excluded_because:
          difficulty_instance: boundary_precision_check / budget_cap_equality_permitted_then_exceeded
          rationale: "Equality-permitted then one-cent-over is asserted there on the same matter."

      - name: qc_validator_conflict_is_reachable
        claim_type: triggerability
        grounds:
          - errors[ERR_QC_VALIDATOR_CONFLICT]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / qc_sample_validator_must_not_hold_batch_assignment
          rationale: "That instance shows the same reviewer refused as validator and a conflict-free reviewer accepted."

      - name: reviewer_capacity_exceeded_is_reachable
        claim_type: triggerability
        grounds:
          - errors[ERR_REVIEWER_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / credential_gate_precedes_capacity_gate
          rationale: "The capacity error is asserted there as the surviving error once the credential clause is satisfied."

      - name: protocol_not_approved_is_reachable
        claim_type: triggerability
        grounds:
          - errors[ERR_PROTOCOL_NOT_APPROVED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / protocol_gate_precedes_budget_gate
          rationale: "That instance carves a batch under a DRAFT revision and asserts ERR_PROTOCOL_NOT_APPROVED ahead of the budget error."

  # =========================================================================
  # SECTION: rbac
  # =========================================================================
  - section: rbac
    instances:
      - name: missing_and_unknown_role_headers_rejected
        claim_type: identity_headers
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_MISSING_AUTH_HEADERS]
          - errors[ERR_UNKNOWN_ROLE]
        distinguishing_aspect: "The two header failures are separate 401s decided before any lookup: omitting the headers entirely yields ERR_MISSING_AUTH_HEADERS, while sending a syntactically fine but unknown X-Role yields ERR_UNKNOWN_ROLE — and only POST /_clock/set_current_utc is exempt."
        test_recipe:
          setup:
            - "the core Client and Matter exist"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
          trigger:
            - call: "GET /matters/${m_id}"
              payload: {}
              as: EngagementManager
              captures: { err_missing: $.data.error_id }
            - call: "GET /matters/${m_id}"
              payload: {}
              as: "MatterPartner"
              captures: { err_unknown: $.data.error_id }
          assert:
            - "first call is issued with BOTH X-Role and X-User-ID omitted: HTTP 401 with error_id \"ERR_MISSING_AUTH_HEADERS\""
            - "second call is issued with X-Role \"MatterPartner\" (not one of the five declared roles) and a valid X-User-ID: HTTP 401 with error_id \"ERR_UNKNOWN_ROLE\""
            - "both responses have success false and data null; neither leaks any matter field"
            - "the setup's POST /_clock/set_current_utc succeeded without any identity headers, which is the single declared exemption"

      - name: role_exclusive_operations_rejects_other_roles
        claim_type: peer_roles
        grounds:
          - validations[priority=3]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - endpoints[GET /matters]
        distinguishing_aspect: "Permission is per endpoint, not per entity: a Reviewer cannot carve batches, a QCLead cannot mint reviewers, and ClientCounsel is refused the matter LIST endpoint while still reading her own matter by id."
        test_recipe:
          setup:
            - "the core matter with an APPROVED protocol and Reviewer A onboarded"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
            - *c_rev_a
            - *c_rev_a_verify
            - *c_screen_a
            - *c_screen_a_clear
            - *c_ca_a
            - *c_ca_a_exec
          trigger:
            - call: "POST /matters/${m_id}/batches"
              payload: { document_count: 100, priority_rank: 5 }
              as: Reviewer
              as_user_id: "${ra_id}"
              captures: { err_reviewer: $.data.error_id }
            - call: "POST /reviewers"
              payload:
                full_name: "QC Lead Overreach"
                bar_admissions: ["NY"]
                languages: ["EN"]
                subject_matter_tags: []
                tier: "FIRST_PASS"
                hourly_cost_cents: 5000
              as: QCLead
              captures: { err_qclead: $.data.error_id }
            - call: "GET /matters"
              payload: { client_id: "${cl_id}" }
              as: ClientCounsel
              as_user_id: "${cl_id}"
              captures: { err_list: $.data.error_id }
            - call: "GET /matters/${m_id}"
              payload: {}
              as: ClientCounsel
              as_user_id: "${cl_id}"
              captures: { seen_status: $.data.status }
          assert:
            - "first call: HTTP 403 with error_id \"ERR_ROLE_NOT_PERMITTED\"; Matter.${m_id}.unbatched_document_count is still 600"
            - "second call: HTTP 403 with error_id \"ERR_ROLE_NOT_PERMITTED\"; GET /reviewers returns exactly 1 row"
            - "third call: HTTP 403 with error_id \"ERR_ROLE_NOT_PERMITTED\" — ClientCounsel is absent from the roles list of GET /matters"
            - "fourth call: HTTP 200 with status \"IN_REVIEW\" — the same role reads the same matter by id"

      - name: reviewer_identity_binding_rejects_another_reviewers_row
        claim_type: identity_binding
        grounds:
          - validations[priority=6]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - endpoints[POST /confidentiality-agreements/{id}/execute]
        distinguishing_aspect: "Holding the Reviewer role is not enough: Ben, a legitimate Reviewer, cannot execute Ada's confidentiality agreement (ERR_NOT_RESOURCE_OWNER), while Ada executing her own row succeeds — the binding is on X-User-ID against the row's reviewer_id."
        test_recipe:
          setup:
            - "the core matter with an APPROVED protocol"
            - "Reviewer A and Reviewer B are both VERIFIED and CLEARED, and both have PENDING agreements"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
            - *c_rev_a
            - *c_rev_a_verify
            - *c_screen_a
            - *c_screen_a_clear
            - *c_ca_a
            - *c_rev_b
            - *c_rev_b_verify
            - *c_screen_b
            - *c_screen_b_clear
          trigger:
            - call: "POST /confidentiality-agreements/${caa_id}/execute"
              payload: { signature_name: "Ben Calder signing for Ada" }
              as: Reviewer
              as_user_id: "${rb_id}"
              captures: { err: $.data.error_id }
            - *c_ca_a_exec
          assert:
            - "first call: HTTP 403 with error_id \"ERR_NOT_RESOURCE_OWNER\""
            - "ConfidentialityAgreement.${caa_id}.status stays \"PENDING\" with signature_name null and executed_at null after the refusal"
            - "second call: HTTP 200 with status \"EXECUTED\" and signature_name \"Ada Ishikawa\""
            - "Matter.${m_id}.staffed_reviewer_count == 1 and status == \"IN_REVIEW\""

      - name: client_counsel_identity_binding_rejects_another_clients_matter
        claim_type: identity_binding
        grounds:
          - validations[priority=7]
          - errors[ERR_NOT_MATTER_CLIENT]
          - endpoints[POST /protocols/{id}/client-decision]
        distinguishing_aspect: "ClientCounsel is entity-backed by Client, so the counsel of an unrelated client is refused the protocol decision with ERR_NOT_MATTER_CLIENT even though the endpoint is ClientCounsel-exclusive; the matter's own client then approves the identical payload."
        test_recipe:
          setup:
            - "two clients exist; the core matter belongs to the first"
            - "the matter's protocol revision 1 has been submitted and is in CLIENT_REVIEW"
          setup_api_calls:
            - *c_clock
            - *c_client
            - call: "POST /clients"
              payload: { legal_name: "Unrelated Holdings, Ltd.", primary_state: "DE" }
              as: EngagementManager
              captures: { cl2_id: $.data.id }
            - *c_matter
            - *c_proto
            - *c_proto_submit
          trigger:
            - call: "POST /protocols/${p_id}/client-decision"
              payload: { decision: "APPROVE" }
              as: ClientCounsel
              as_user_id: "${cl2_id}"
              captures: { err: $.data.error_id }
            - *c_proto_approve
          assert:
            - "first call: HTTP 403 with error_id \"ERR_NOT_MATTER_CLIENT\""
            - "ReviewProtocol.${p_id}.status stays \"CLIENT_REVIEW\" with approved_at null, and Matter.${m_id}.status stays \"PROTOCOL_PENDING\" after the refusal"
            - "second call: HTTP 200 with status \"APPROVED\"; Matter.${m_id}.status == \"STAFFING\""
            - "Client.${cl2_id}.matter_count == 0"

      - name: same_user_cannot_do_both_halves_of_the_qc_step
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=21]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / qc_sample_validator_must_not_hold_batch_assignment
          rationale: "The role_model is segregation_of_duties, and that instance is exactly its enforcement point: the reviewer who coded a batch cannot validate its sample."

  # =========================================================================
  # SECTION: cross_cutting_complexity_layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_matter_version_rejected_on_protocol_revision
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[protocol-revision-stale-matter]
          - validations[priority=10]
          - errors[ERR_STALE_MATTER_VERSION]
        distinguishing_aspect: "The matter's version has moved twice (mint, then approval cascade) by the time a second revision is attempted, so the creation-time token is refused with ERR_STALE_MATTER_VERSION (412); replaying with the freshly read version supersedes revision 1 and returns the matter to PROTOCOL_PENDING."
        test_recipe:
          setup:
            - "the core matter with ReviewProtocol revision 1 APPROVED, so the matter is in STAFFING"
            - "the caller still holds the version token captured when the matter was created"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
          trigger:
            - call: "POST /matters/${m_id}/protocols"
              payload:
                expected_matter_version: "${m_v1}"
                issue_codes: ["RESPONSIVE", "NOT_RESPONSIVE", "PRIVILEGED", "HOT", "FOREIGN_LANGUAGE"]
                privilege_criteria: ["ATTORNEY_CLIENT", "WORK_PRODUCT"]
                qc_sample_pct: 0.10
                privilege_sample_pct: 0.20
                max_discrepancy_pct: 0.05
                min_pace_dph: 55
                second_level_required: false
              as: EngagementManager
              captures: { err: $.data.error_id }
            - call: "GET /matters/${m_id}"
              payload: {}
              as: EngagementManager
              captures: { m_v_now: $.data.version }
            - call: "POST /matters/${m_id}/protocols"
              payload:
                expected_matter_version: "${m_v_now}"
                issue_codes: ["RESPONSIVE", "NOT_RESPONSIVE", "PRIVILEGED", "HOT", "FOREIGN_LANGUAGE"]
                privilege_criteria: ["ATTORNEY_CLIENT", "WORK_PRODUCT"]
                qc_sample_pct: 0.10
                privilege_sample_pct: 0.20
                max_discrepancy_pct: 0.05
                min_pace_dph: 55
                second_level_required: false
              as: EngagementManager
              captures: { p2_id: $.data.id }
          assert:
            - "first call: HTTP 412 with error_id \"ERR_STALE_MATTER_VERSION\" — ${m_v1} is 1 but the matter is at 3"
            - "after the refusal ReviewProtocol.${p_id}.status is still \"APPROVED\" and GET /protocols?matter_id=${m_id} returns 1 row"
            - "second call reports version 3 (creation 1, mint 2, approval cascade 3)"
            - "third call: HTTP 201 with revision_number 2 and status \"DRAFT\"; ReviewProtocol.${p_id}.status == \"SUPERSEDED\""
            - "Matter.${m_id}.status == \"PROTOCOL_PENDING\" and version == 4"

      - name: stale_batch_version_rejected_on_both_assignment_paths
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assignment-create-stale-batch]
          - concurrency_rules[auto-assign-stale-batch]
          - errors[ERR_STALE_BATCH_VERSION]
        distinguishing_aspect: "Both write endpoints that carry expected_batch_version enforce it identically: after the first assignment lifts the batch to version 2, the explicit path and the auto-assign path each return ERR_STALE_BATCH_VERSION (412) for the same stale token, and neither leaves a partial write."
        test_recipe:
          setup:
            - "the core matter with an APPROVED protocol; Reviewers A and D are both fully onboarded"
            - "Batch 1 (400 documents) was created at version 1 and has just been assigned to Reviewer A"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
            - *c_rev_a
            - *c_rev_a_verify
            - *c_screen_a
            - *c_screen_a_clear
            - *c_ca_a
            - *c_ca_a_exec
            - *c_rev_d
            - *c_rev_d_verify
            - *c_screen_d
            - *c_screen_d_clear
            - *c_ca_d
            - *c_ca_d_exec
            - *c_batch1
            - *c_assign_a1
          trigger:
            - call: "POST /batches/${b1_id}/assignments"
              payload: { expected_batch_version: "${b1_v}", reviewer_id: "${rd_id}", pass_type: "FIRST_PASS" }
              as: StaffingCoordinator
              captures: { err_explicit: $.data.error_id }
            - call: "POST /batches/${b1_id}/auto-assign"
              payload: { expected_batch_version: "${b1_v}", pass_type: "FIRST_PASS" }
              as: StaffingCoordinator
              captures: { err_auto: $.data.error_id }
          assert:
            - "first call: HTTP 412 with error_id \"ERR_STALE_BATCH_VERSION\" — ${b1_v} is 1 but the batch is at 2"
            - "second call: HTTP 412 with error_id \"ERR_STALE_BATCH_VERSION\" — the same guard on the auto-assign path"
            - "Batch.${b1_id}.version == 2 and status == \"ASSIGNED\"; GET /assignments?batch_id=${b1_id} returns exactly 1 row"
            - "Matter.${m_id}.committed_spend_cents == 85200 and GET /matters/${m_id}/budget-ledger returns exactly 1 row"
            - "Reviewer.${rd_id}.engagement_status == \"CLEARED\" and active_assignment_count == 0"

      - name: version_increments_on_every_write_but_not_on_reads
        claim_type: optimistic_concurrency
        grounds:
          - entities.Matter.fields.version
          - entities.Batch.fields.version
          - state_machines.Matter.STAFFING_to_IN_REVIEW
        distinguishing_aspect: "Every write that changes a versioned row bumps its version by exactly one — including the SYSTEM cascade that lifts the matter to IN_REVIEW after an agreement execution — while pure reads never do."
        test_recipe:
          setup:
            - "the core Client and Matter exist at version 1"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
          trigger:
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
            - *c_rev_a
            - *c_rev_a_verify
            - *c_screen_a
            - *c_screen_a_clear
            - *c_ca_a
            - *c_ca_a_exec
            - *c_batch1
            - *c_assign_a1
            - call: "GET /matters/${m_id}"
              payload: {}
              as: EngagementManager
              captures: { m_v_final: $.data.version }
          assert:
            - "Matter.${m_id}.version was 2 after the protocol mint, 3 after the approval cascade and 4 after the agreement execution lifted STAFFING -> IN_REVIEW"
            - "POST /protocols/${p_id}/submit changed no matter field and left the matter at version 2"
            - "Batch.${b1_id}.version == 2 after the assignment creation (created at 1)"
            - "the final GET returns version 4 and repeating the GET returns 4 again — reads never bump a version"

      - name: pace_threshold_is_inclusive_at_the_protocol_floor
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.reviewer_scorecard_strikes
          - entities.Assignment.fields.pace_dph
          - entities.ScorecardEvent.fields.event_type
        distinguishing_aspect: "The pace gate is inclusive at min_pace_dph: 55 documents in exactly 60 minutes is 55.00 dph and appends no event, while the same 55 documents in 61 minutes is 54.10 dph and appends a PACE_SHORTFALL — one minute either side of the boundary."
        test_recipe:
          setup:
            - "the core matter with an APPROVED protocol (min_pace_dph 55) and Reviewer A onboarded with an ACTIVE onsite session"
            - "two 55-document batches are carved and both assigned to Reviewer A"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
            - *c_rev_a
            - *c_rev_a_verify
            - *c_screen_a
            - *c_screen_a_clear
            - *c_ca_a
            - *c_ca_a_exec
            - *c_sess_a
            - *c_sess_a_active
            - call: "POST /matters/${m_id}/batches"
              payload: { document_count: 55, priority_rank: 5 }
              as: EngagementManager
              captures: { bp1_id: $.data.id, bp1_v: $.data.version }
            - call: "POST /matters/${m_id}/batches"
              payload: { document_count: 55, priority_rank: 5 }
              as: EngagementManager
              captures: { bp2_id: $.data.id, bp2_v: $.data.version }
            - call: "POST /batches/${bp1_id}/assignments"
              payload: { expected_batch_version: "${bp1_v}", reviewer_id: "${ra_id}", pass_type: "FIRST_PASS" }
              as: StaffingCoordinator
              captures: { ap1_id: $.data.id }
            - call: "POST /batches/${bp2_id}/assignments"
              payload: { expected_batch_version: "${bp2_v}", reviewer_id: "${ra_id}", pass_type: "FIRST_PASS" }
              as: StaffingCoordinator
              captures: { ap2_id: $.data.id }
            - call: "POST /assignments/${ap1_id}/start"
              payload: {}
              as: Reviewer
              as_user_id: "${ra_id}"
            - call: "POST /assignments/${ap1_id}/progress"
              payload: { documents_coded: 55, minutes_logged: 60, privilege_hits_logged: 0 }
              as: Reviewer
              as_user_id: "${ra_id}"
          trigger:
            - call: "POST /assignments/${ap1_id}/submit"
              payload: {}
              as: Reviewer
              as_user_id: "${ra_id}"
            - call: "POST /assignments/${ap2_id}/start"
              payload: {}
              as: Reviewer
              as_user_id: "${ra_id}"
            - call: "POST /assignments/${ap2_id}/progress"
              payload: { documents_coded: 55, minutes_logged: 61, privilege_hits_logged: 0 }
              as: Reviewer
              as_user_id: "${ra_id}"
            - call: "POST /assignments/${ap2_id}/submit"
              payload: {}
              as: Reviewer
              as_user_id: "${ra_id}"
          assert:
            - "after the first submit: Assignment.${ap1_id}.pace_dph == 55.00, GET /reviewers/${ra_id}/scorecard-events is empty and scorecard_strikes == 0"
            - "after the last submit: Assignment.${ap2_id}.pace_dph == 54.10 (round_half_up(55 / (61/60), 2))"
            - "GET /reviewers/${ra_id}/scorecard-events now returns exactly 1 row with event_type \"PACE_SHORTFALL\" and strike_delta +1"
            - "Reviewer.${ra_id}.scorecard_strikes == 1 and engagement_status == \"ENGAGED\""
            - "Reviewer.${ra_id}.pace_dph == 54.55 (110 documents over 121 minutes) and each assignment billed 11715 (55 * 213)"

      - name: qc_failure_propagates_through_four_levels
        claim_type: cascading_side_effects
        grounds:
          - state_machines.QCSample.PENDING_to_FAILED
        excluded_because:
          difficulty_instance: transitive_cascade / qc_failure_to_strike_to_removal_to_void_sweep
          rationale: "The full four-level chain with its ordering and its money consequences is asserted there; a second walk would duplicate it exactly."

      - name: both_accuracy_weightings_on_one_dataset
        claim_type: dual_variant_calculation
        grounds:
          - calculations.reviewer_accuracy_score
        excluded_because:
          difficulty_instance: dual_variant_calc / reviewer_accuracy_sample_weighted_vs_assignment_mean
          rationale: "Both weightings and the delta on switching are asserted there (0.9833 vs 0.9875)."

      - name: derived_money_fields_reconcile_after_reversal
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Matter.fields.committed_spend_cents
        excluded_because:
          difficulty_instance: compensating_invariant / commitment_then_void_returns_ledger_to_zero
          rationale: "Reconciliation of committed_spend_cents against the ledger after a compensating reversal is asserted there."

  # =========================================================================
  # SECTION: consistency_model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: derived_fields_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - endpoints[POST /batches/{id}/assignments]
          - entities.Matter.fields.committed_spend_cents
          - entities.Reviewer.fields.active_assignment_count
        distinguishing_aspect: "The declared consistency model is immediate: the assignment-creation response already carries its frozen rate and commitment, and reads issued straight afterwards show the matter's committed spend, the batch's new version, the reviewer's ENGAGED axis and the ledger row with no intervening step."
        test_recipe:
          setup:
            - "the core matter with an APPROVED protocol and Reviewer A onboarded; Batch 1 (400 documents) is CREATED"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
            - *c_rev_a
            - *c_rev_a_verify
            - *c_screen_a
            - *c_screen_a_clear
            - *c_ca_a
            - *c_ca_a_exec
            - *c_batch1
          trigger:
            - *c_assign_a1
            - call: "GET /matters/${m_id}"
              payload: {}
              as: EngagementManager
              captures: { committed_now: $.data.committed_spend_cents }
            - call: "GET /reviewers/${ra_id}"
              payload: {}
