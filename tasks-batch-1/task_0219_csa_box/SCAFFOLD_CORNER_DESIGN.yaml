  # §1.9.4 Validations
  # ===========================================================================
  - section: validations
    instances:
      - name: duplicate_member_email_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=16]", "errors[ERR_DUPLICATE_EMAIL]"]
        distinguishing_aspect: "Registering a second member with an email differing only in case → ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["A member with email dup@x.com already exists"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "dup@x.com", full_name: "Dup One", sliding_scale_tier: "BASELINE" }
              as: Anonymous
          trigger:
            - call: "POST /members"
              payload: { email: "DUP@x.com", full_name: "Dup Two", sliding_scale_tier: "BASELINE" }
              as: Anonymous
              captures: { err: "$.data.error_id" }
          assert:
            - "response code == 409"
            - "response error_id == ERR_DUPLICATE_EMAIL"

