        claim_type: input_set_filtering
        grounds: [calculations.family_balance]
        distinguishing_aspect: "family_balance_cents sums only same-family accounts in OPEN years: siblings A1 (3000) and A2 (2000) each report 5000 while the unrelated fam-y account (9000) is excluded."
