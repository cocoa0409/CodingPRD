      - name: ner_below_floor_at_accept_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=25]", "errors[ERR_NER_BELOW_FLOOR]"]
        distinguishing_aspect: "Pure fiscal failure with state satisfied: SUBMITTED LOI with NER 5.69 against asking 12.00 (floor 7.20) -> ERR_NER_BELOW_FLOOR on accept."
