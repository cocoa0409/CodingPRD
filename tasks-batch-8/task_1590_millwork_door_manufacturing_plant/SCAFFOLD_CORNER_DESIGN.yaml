scaffold_corner_design:
  # ==================================================================
  # Section: entities
  # ==================================================================
  - section: entities
    instances:
      - name: create_project_applies_defaults
        claim_type: creation
        grounds: ["entities.Project", "endpoints[POST /millwork/projects]"]
        distinguishing_aspect: "A project created with the three required inputs returns 201 with system fields initialized: status OPEN, version 1, server-minted id, created_at/updated_at present."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "Atrium", site_address: "1 Main St", contract_code: "CC-1" }, as: PlantManager, captures: { proj_id: $.data.id } }
          trigger:
            - { call: "GET /millwork/projects/${proj_id}", as: Any, captures: { st: $.data.status, v: $.data.version } }
          assert:
            - "captured ${st} == OPEN"
            - "captured ${v} == 1"
            - "Project.${proj_id}.id is a UUID without type prefix and created_at has three fractional digits"
      - name: create_order_missing_required_species_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.MillworkOrder.fields.species", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input field species on order creation fails with ERR_INVALID_REQUEST (400) before any business logic."
        test_recipe:
          setup: ["Project exists."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CC-2" }, as: PlantManager, captures: { proj_id: $.data.id } }
          trigger:
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-X", profile_code: "PR-1", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_INVALID_REQUEST"
      - name: create_order_with_unknown_field_returns_invalid_request
        claim_type: system_fields
        grounds: ["entities.MillworkOrder.fields.budget_quote_cents", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Client-supplied computed/system fields (budget_quote_cents, status) are not part of the input schema; sending them fails with ERR_INVALID_REQUEST — computed fields are server-owned."
        test_recipe:
          setup: ["Project exists."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CC-3" }, as: PlantManager, captures: { proj_id: $.data.id } }
          trigger:
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-Y", species: "OAK", profile_code: "PR-1", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE", budget_quote_cents: 1 }, as: Estimator, captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_INVALID_REQUEST"
      - name: create_opening_applies_leaf_count_default
        claim_type: defaults
        grounds: ["entities.Opening.fields.leaf_count"]
        distinguishing_aspect: "Omitting optional leaf_count on opening creation applies the default 1."
        test_recipe:
          setup: ["Project and DRAFT order exist."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CC-4" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-D", species: "OAK", profile_code: "PR-1", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_id: $.data.id } }
          trigger:
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "D1", width_in: 36, height_in: 84, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator, captures: { lc: $.data.leaf_count } }
          assert:
            - "captured ${lc} == 1"
      - name: create_order_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.MillworkOrder.fields.species", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "species 'PINE' is outside the declared enum OAK|MAPLE|CHERRY|WALNUT|PAINT_GRADE and is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Project exists."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CC-5" }, as: PlantManager, captures: { proj_id: $.data.id } }
          trigger:
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-E", species: "PINE", profile_code: "PR-1", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_INVALID_REQUEST"
      - name: get_opening_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_OPENING_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown opening id returns 404 ERR_OPENING_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /millwork/openings/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_OPENING_NOT_FOUND"
      - name: create_opening_with_unknown_order_returns_404
        claim_type: parent_relationships
        grounds: ["entities.Opening.fields.order_id", "errors[ERR_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "Flat-topology FK integrity: creating an opening whose body FK order_id does not exist fails 404 ERR_ORDER_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /millwork/openings", payload: { order_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", opening_no: "Z1", width_in: 36, height_in: 84, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator, captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_ORDER_NOT_FOUND"
      - name: list_openings_filter_and_pagination
        claim_type: listing
        grounds: ["endpoints[GET /millwork/openings]", "response_envelope"]
        distinguishing_aspect: "Filtered list returns only the queried order's openings and honors the pagination envelope: limit=2 yields has_more=true with total_count=3; offset=2 yields the last item with has_more=false."
        test_recipe:
          setup: ["Order A with openings A1, A2, A3; order B with opening B1."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CC-6" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-LA", species: "OAK", profile_code: "PR-1", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_a: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-LB", species: "MAPLE", profile_code: "PR-1", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_b: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_a}", opening_no: "A1", width_in: 36, height_in: 84, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_a}", opening_no: "A2", width_in: 36, height_in: 84, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_a}", opening_no: "A3", width_in: 36, height_in: 84, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_b}", opening_no: "B1", width_in: 36, height_in: 84, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator, captures: { op_b: $.data.id } }
          trigger:
            - { call: "GET /millwork/openings", payload: { order_id: "${ord_a}", limit: 2, offset: 0 }, as: Any, captures: { page1_first_oid: "$.data[0].order_id" } }
            - { call: "GET /millwork/openings", payload: { order_id: "${ord_a}", limit: 2, offset: 2 }, as: Any, captures: { page2_first_no: "$.data[0].opening_no" } }
          assert:
            - "page 1 response envelope: total_count == 3 and has_more == true"
            - "page 2 response envelope: has_more == false and exactly one item"
            - "captured ${page1_first_oid} == ${ord_a} (filter correctness: only order A's openings)"
            - "captured ${page2_first_no} == A3 (offset 2 lands on the third opening)"
      - name: order_version_increments_on_each_mutation
        claim_type: system_fields
        grounds: ["entities.MillworkOrder", "concurrency_rules[drawing-create-stale-order]"]
        distinguishing_aspect: "version starts at 1 on create and increments by exactly 1 per mutation: PUT status CONFIGURE -> 2, drawing create -> 3."
        test_recipe:
          setup: ["Order with one opening."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CC-7" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-V", species: "OAK", profile_code: "PR-1", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_id: $.data.id, v0: $.data.version } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "V1", width_in: 36, height_in: 84, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator }
          trigger:
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator, captures: { v1: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${v1}" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { v2: $.data.version } }
          assert:
            - "captured ${v0} == 1 and captured ${v1} == 2 and captured ${v2} == 3"

  # ==================================================================
  # Section: state_machines
  # ==================================================================
  - section: state_machines
    instances:
      - name: order_initial_state_draft
        claim_type: initial_state
        grounds: ["state_machines.MillworkOrder"]
        distinguishing_aspect: "A newly created order starts in DRAFT with config_locked false and no price fields set."
        test_recipe:
          setup: ["Project exists."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CS-1" }, as: PlantManager, captures: { proj_id: $.data.id } }
          trigger:
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-I", species: "OAK", profile_code: "PR-1", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { st: $.data.status, locked: $.data.config_locked } }
          assert:
            - "captured ${st} == DRAFT and captured ${locked} == false"
      - name: put_order_status_invalid_transition_returns_409
        claim_type: invalid_transition
        grounds: ["state_machines.MillworkOrder", "errors[ERR_INVALID_ORDER_STATUS_TRANSITION]"]
        distinguishing_aspect: "DRAFT -> SHIPPED is not a declared pair; the request fails with ERR_INVALID_ORDER_STATUS_TRANSITION and no side effects fire."
        test_recipe:
          setup: ["DRAFT order exists."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CS-2" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-T", species: "OAK", profile_code: "PR-1", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_id: $.data.id } }
          trigger:
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "SHIPPED" }, as: ShippingCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_INVALID_ORDER_STATUS_TRANSITION"
            - "Order.${ord_id}.status == DRAFT"
      - name: cancelled_order_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: ["state_machines.MillworkOrder", "errors[ERR_INVALID_ORDER_STATUS_TRANSITION]"]
        distinguishing_aspect: "CANCELLED is terminal: a subsequent configure attempt is rejected with ERR_INVALID_ORDER_STATUS_TRANSITION."
        test_recipe:
          setup: ["DRAFT order cancelled."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CS-3" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-C", species: "OAK", profile_code: "PR-1", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CANCELLED" }, as: Estimator }
          trigger:
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator, captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_INVALID_ORDER_STATUS_TRANSITION"
            - "Order.${ord_id}.status == CANCELLED"
      - name: rejected_drawing_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: ["state_machines.ShopDrawing", "errors[ERR_INVALID_DRAWING_STATUS_TRANSITION]"]
        distinguishing_aspect: "REJECTED is terminal for a revision: approving the rejected drawing is rejected with ERR_INVALID_DRAWING_STATUS_TRANSITION (the revision loop requires creating a new DRAFT revision instead)."
        test_recipe:
          setup: ["Order CONFIGURED; drawing submitted then REJECTED by arch-1."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CS-4" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-R", species: "OAK", profile_code: "PR-1", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "R1", width_in: 36, height_in: 84, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v}" }, as: Estimator, captures: { drw_id: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "REJECTED" }, as: Architect, as_user_id: "arch-1" }
          trigger:
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-2", captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_INVALID_DRAWING_STATUS_TRANSITION"
            - "ShopDrawing.${drw_id}.status == REJECTED"
      - name: machine_opening_requires_order_in_production
        claim_type: guarded_transition
        grounds: ["state_machines.Opening", "errors[ERR_ORDER_NOT_IN_PRODUCTION]", "errors[ERR_NO_RELEASED_PROGRAM]", "errors[ERR_ORDER_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Cross-entity guard: machining an opening while its order is APPROVED (not yet IN_PRODUCTION) fails with ERR_ORDER_NOT_IN_PRODUCTION; IN_PRODUCTION itself is gated by a RELEASED program (ERR_NO_RELEASED_PROGRAM); once IN_PRODUCTION the cancel path is closed (ERR_ORDER_NOT_CANCELLABLE) and machining succeeds."
        test_recipe:
          setup: ["OAK order APPROVED (drawing approved), no program yet."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CS-5" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-G", species: "OAK", profile_code: "PR-2", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "G1", width_in: 36, height_in: 84, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator, captures: { op1: $.data.id } }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v}" }, as: Estimator, captures: { drw_id: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
          trigger:
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "IN_PRODUCTION" }, as: ProductionLead, captures: { err_noprog: $.data.error_id } }
            - { call: "PUT /millwork/openings/${op1}/status", payload: { target_fab_status: "MACHINED" }, as: ProductionLead, captures: { err_notip: $.data.error_id } }
            - { call: "POST /millwork/machining-programs", payload: { drawing_id: "${drw_id}", order_id: "${ord_id}", estimated_minutes: 30 }, as: ProductionLead, captures: { prog_id: $.data.id } }
            - { call: "POST /millwork/moulder-machines", payload: { machine_code: "M-G", supported_species: ["OAK"] }, as: PlantManager, captures: { mach_id: $.data.id } }
            - { call: "POST /millwork/moulder-setup-slots", payload: { program_id: "${prog_id}", machine_id: "${mach_id}", start_hour: 8, end_hour: 9 }, as: ProductionLead, captures: { slot_id: $.data.id } }
            - { call: "PUT /millwork/moulder-setup-slots/${slot_id}/status", payload: { target_status: "COMPLETED" }, as: ProductionLead }
            - { call: "PUT /millwork/machining-programs/${prog_id}/status", payload: { target_status: "RELEASED" }, as: ProductionLead }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "IN_PRODUCTION" }, as: ProductionLead }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CANCELLED" }, as: Estimator, captures: { err_cancel: $.data.error_id } }
            - { call: "PUT /millwork/openings/${op1}/status", payload: { target_fab_status: "MACHINED" }, as: ProductionLead, captures: { fab: $.data.fab_status } }
          assert:
            - "captured ${err_noprog} == ERR_NO_RELEASED_PROGRAM"
            - "captured ${err_notip} == ERR_ORDER_NOT_IN_PRODUCTION"
            - "captured ${err_cancel} == ERR_ORDER_NOT_CANCELLABLE"
            - "captured ${fab} == MACHINED"
      - name: slot_cancel_revert_and_complete_promote_program
        claim_type: side_effect_execution
        grounds: ["state_machines.MoulderSetupSlot", "state_machines.MachiningProgram", "errors[ERR_PROGRAM_NOT_AWAITING_SETUP]", "errors[ERR_INVALID_SLOT_STATUS_TRANSITION]", "errors[ERR_INVALID_PROGRAM_STATUS_TRANSITION]", "errors[ERR_PRODUCTION_ALREADY_RELEASED]"]
        distinguishing_aspect: "Booking moves program CREATED->SETUP_BOOKED (a second booking then fails ERR_PROGRAM_NOT_AWAITING_SETUP); explicit slot cancel reverts the program to CREATED allowing rebooking; completing the slot promotes it to PROVEN; completing twice fails ERR_INVALID_SLOT_STATUS_TRANSITION; releasing a CREATED program fails ERR_INVALID_PROGRAM_STATUS_TRANSITION."
        test_recipe:
          setup: ["OAK order APPROVED with program CREATED; machine available."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CS-6" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-S", species: "OAK", profile_code: "PR-2", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "S1", width_in: 36, height_in: 84, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v}" }, as: Estimator, captures: { drw_id: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
            - { call: "POST /millwork/machining-programs", payload: { drawing_id: "${drw_id}", order_id: "${ord_id}", estimated_minutes: 30 }, as: ProductionLead, captures: { prog_id: $.data.id } }
            - { call: "POST /millwork/moulder-machines", payload: { machine_code: "M-S", supported_species: ["OAK"] }, as: PlantManager, captures: { mach_id: $.data.id } }
          trigger:
            - { call: "PUT /millwork/machining-programs/${prog_id}/status", payload: { target_status: "RELEASED" }, as: ProductionLead, captures: { err_rel: $.data.error_id } }
