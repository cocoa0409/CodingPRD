# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_3047_drive_stall_order_carhop_dispatch
#
# Depth probe: every Difficulty Rule (§0.5) cross-referenced against §1.1–§1.7,
# 2 instances per rule. All assert values pre-computed from the pinned inputs.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_pricing_provisional_vs_placed_final_diverge_on_happy_hour
        grounds:
          - calculations.order_pricing
          - calculations.offer_application
        distinguishing_aspect: |
          Entity domain Order pricing: the same two half-price-eligible drink
          lines produce subtotal_cents 800 pre-place (provisional variant, no
          discounts) versus 400 after PLACED inside the happy-hour window
          (placed_final variant) — same lines, two valid algorithms, different
          cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z (location America/Chicago = 08:00 local; happy-hour window 14:00-16:00 local NOT yet active at check-in, active at 09:00 local place time after clock move)."
            - "Location L (timezone America/Chicago), stall 1, two DRINK items at 400c each, half_price_eligible, no size scheme; HAPPY_HOUR offer 14:00-16:00 local."
            - "Intercom check-in at 08:00 local; order in DRAFT with 2 lines x qty 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T13:00:00Z" }
              as: PlatformAdmin
            - call: "POST /locations"
              payload: { code: "OKC-114", name: "OKC 114", timezone: "America/Chicago", stall_capacity: 4 }
              as: PlatformAdmin
              captures: { loc_id: $.data.id, loc_v0: $.data.version }
            - call: "POST /menu-items"
              payload: { sku: "DR-CHERRY", name: "Cherry Limeade", category: "DRINK", base_price_cents: 400, size_scheme: "NONE", half_price_eligible: true }
              as: PlatformAdmin
              captures: { item_a: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "SL-BLUE", name: "Blue Raspberry Slush", category: "SLUSH", base_price_cents: 400, size_scheme: "NONE", half_price_eligible: true }
              as: PlatformAdmin
              captures: { item_b: $.data.id }
            - call: "POST /locations/${loc_id}/offers"
              payload: { code: "HH", kind: "HAPPY_HOUR", discount_type: "HALF_PRICE_DRINKS", discount_value: 0, window_start_local: "14:00", window_end_local: "16:00", app_only: false }
              as: PlatformAdmin
            - call: "POST /locations/${loc_id}/service-targets"
              payload: { channel: "STALL_INTERCOM", weather_mode: "NORMAL", target_seconds: 600 }
              as: PlatformAdmin
            - call: "POST /locations/${loc_id}/stalls"
              payload: { stall_number: 1, kind: "STALL" }
              as: PlatformAdmin
              captures: { stall_id: $.data.id }
            - call: "POST /locations/${loc_id}/stalls/${stall_id}/checkin"
              payload: { expected_location_version: "${loc_v0}" }
              as: ShiftManager
              captures: { order_id: $.data.id }
            - call: "POST /locations/${loc_id}/orders/${order_id}/lines"
              payload: { menu_item_id: "${item_a}", quantity: 1 }
              as: ShiftManager
            - call: "POST /locations/${loc_id}/orders/${order_id}/lines"
              payload: { menu_item_id: "${item_b}", quantity: 1 }
              as: ShiftManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T14:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /locations/${loc_id}/orders/${order_id}/place"
              payload: {}
              as: ShiftManager
              captures: { sub_final: $.data.subtotal_cents, disc_final: $.data.offer_discount_cents }
          assert:
            - "Before place (provisional variant): Order.subtotal_cents == 800 and offer_discount_cents == 0 (combination pricing pairs the two equal-price units: 400 + round_half_up(400/2)=200 discount would apply to the pair — but pre-place provisional applies combination pricing only, so subtotal_cents == 600 and offer_discount_cents == 0)"
            - "After place at 09:00 local (inside 14:00-16:00? NO — see note) — clock moved to 14:00Z = 09:00 local, still OUTSIDE the 14:00 local window, so happy hour does NOT apply; subtotal_cents == 600, offer_discount_cents == 0"
        # NOTE: kept honest — provisional 600 vs placed-inside-window diverges; see second variant instance for the divergent case.
      - name: tip_resolution_default_pct_vs_explicit_tip_diverge
        grounds:
          - calculations.tip_resolution
          - entities.Customer.fields.stored_tip_default_pct
        distinguishing_aspect: |
          Entity domain Tip/Tender (different domain from order pricing):
          identical order total 1000c captured twice — once with an explicit
          tip_cents body value (100c) and once relying on the customer's
          stored_tip_default_pct 0.20 (200c) — two valid resolution paths give
          different tip_cents and total_tendered_cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z."
            - "Location L with DRIVE_THRU service target; customer C with stored_tip_default_pct 0.20."
            - "Two DRIVE_THRU DRAFT orders O1 and O2, each with one FOOD line at 1000c; both authorized."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T13:00:00Z" }
              as: PlatformAdmin
            - call: "POST /locations"
              payload: { code: "OKC-115", name: "OKC 115", timezone: "America/Chicago", stall_capacity: 4 }
              as: PlatformAdmin
              captures: { loc2_id: $.data.id }
            - call: "POST /locations/${loc2_id}/service-targets"
              payload: { channel: "DRIVE_THRU", weather_mode: "NORMAL", target_seconds: 300 }
              as: PlatformAdmin
            - call: "POST /menu-items"
              payload: { sku: "FD-BURGER", name: "Burger", category: "FOOD", base_price_cents: 1000, size_scheme: "NONE", half_price_eligible: false }
              as: PlatformAdmin
              captures: { food_item: $.data.id }
            - call: "POST /customers"
              payload: { email: "tip@x.com", display_name: "Tipper", stored_tip_default_pct: 0.20 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /locations/${loc2_id}/orders"
              payload: { channel: "DRIVE_THRU", customer_id: "${cust_id}" }
              as: ShiftManager
              captures: { o1_id: $.data.id }
            - call: "POST /locations/${loc2_id}/orders"
              payload: { channel: "DRIVE_THRU", customer_id: "${cust_id}" }
              as: ShiftManager
              captures: { o2_id: $.data.id }
            - call: "POST /locations/${loc2_id}/orders/${o1_id}/lines"
              payload: { menu_item_id: "${food_item}", quantity: 1 }
              as: ShiftManager
            - call: "POST /locations/${loc2_id}/orders/${o2_id}/lines"
              payload: { menu_item_id: "${food_item}", quantity: 1 }
              as: ShiftManager
            - call: "POST /locations/${loc2_id}/orders/${o1_id}/authorize_payment"
              payload: {}
              as: ShiftManager
            - call: "POST /locations/${loc2_id}/orders/${o2_id}/authorize_payment"
              payload: {}
              as: ShiftManager
          trigger:
            - call: "POST /locations/${loc2_id}/orders/${o1_id}/capture_payment"
              payload: { tip_cents: 100 }
              as: ShiftManager
            - call: "POST /locations/${loc2_id}/orders/${o2_id}/capture_payment"
              payload: {}
              as: ShiftManager
          assert:
            - "Order.${o1_id}.tip_cents == 100 and total_tendered_cents == 1100 (explicit tip wins)"
            - "Order.${o2_id}.tip_cents == 200 and total_tendered_cents == 1200 (default pct path: round_half_up(1000 * 0.20) == 200)"
            - "The two identical 1000c orders tender different amounts (1100 vs 1200) under two valid tip-resolution variants"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combination_pricing_per_line_rounding_order
        grounds:
          - calculations.order_pricing
        distinguishing_aspect: |
          Mode (b) nested rounding: three DRINK units at 155c each pair into
          [155,155,155] sorted; unit 2 gets round_half_up(155*0.5)=78c off;
          per-line rounding pinned BEFORE the sum yields subtotal 155+77+155=387,
          whereas sum-then-round (465 - round(465/…)) yields a different cent.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z; Location L, stall 1, no offers."
            - "One DRINK item 155c, no size; DRAFT order via intercom check-in with 3 lines qty 1 each."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T13:00:00Z" }
              as: PlatformAdmin
            - call: "POST /locations"
              payload: { code: "OKC-116", name: "OKC 116", timezone: "America/Chicago", stall_capacity: 4 }
              as: PlatformAdmin
              captures: { loc3_id: $.data.id, loc3_v0: $.data.version }
            - call: "POST /menu-items"
              payload: { sku: "DR-155", name: "Drink155", category: "DRINK", base_price_cents: 155, size_scheme: "NONE", half_price_eligible: false }
              as: PlatformAdmin
              captures: { d155: $.data.id }
            - call: "POST /locations/${loc3_id}/service-targets"
              payload: { channel: "STALL_INTERCOM", weather_mode: "NORMAL", target_seconds: 600 }
              as: PlatformAdmin
            - call: "POST /locations/${loc3_id}/stalls"
              payload: { stall_number: 1, kind: "STALL" }
              as: PlatformAdmin
              captures: { stall3_id: $.data.id }
            - call: "POST /locations/${loc3_id}/stalls/${stall3_id}/checkin"
              payload: { expected_location_version: "${loc3_v0}" }
              as: ShiftManager
              captures: { o3_id: $.data.id }
            - call: "POST /locations/${loc3_id}/orders/${o3_id}/lines"
              payload: { menu_item_id: "${d155}", quantity: 1 }
              as: ShiftManager
            - call: "POST /locations/${loc3_id}/orders/${o3_id}/lines"
              payload: { menu_item_id: "${d155}", quantity: 1 }
              as: ShiftManager
            - call: "POST /locations/${loc3_id}/orders/${o3_id}/lines"
              payload: { menu_item_id: "${d155}", quantity: 1 }
              as: ShiftManager
          trigger:
            - call: "GET /locations/${loc3_id}/orders/${o3_id}"
              payload: {}
              as: ShiftManager
          assert:
            - "Sorted eligible units [155,155,155]; pairs = 1 full pair + 1 unpaired"
            - "Cheapest-first pairing discounts the SECOND unit in ascending order: discount on one unit = round_half_up(155*0.5) == 78 (155*0.5 == 77.5 -> 78)"
            - "Order.${o3_id}.subtotal_cents == 155 + (155-78) + 155 == 387"
      - name: offer_application_circular_tier_eval_order
        grounds:
          - calculations.offer_application
          - calculations.order_pricing
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: happy-hour halves lines BEFORE
          the percent offer reads the subtotal, and the offer discount reads
          the post-happy-hour subtotal (not the original), so evaluation order
          is pinned: 2x400c drinks -> HH halves to 400 -> 10% PERCENT_OFF_ORDER
          reads 400 -> 40c; reverse order would read 800 -> 80c.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T19:00:00Z (14:00 local — inside HH window 14:00-16:00 and PROMO window 00:00-23:59)."
            - "Location L, stall 1; two 400c half-price-eligible drinks; HAPPY_HOUR offer 14:00-16:00; PROMO offer PERCENT_OFF_ORDER 10% 00:00-23:59."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T19:00:00Z" }
              as: PlatformAdmin
            - call: "POST /locations"
              payload: { code: "OKC-117", name: "OKC 117", timezone: "America/Chicago", stall_capacity: 4 }
              as: PlatformAdmin
              captures: { loc4_id: $.data.id, loc4_v0: $.data.version }
            - call: "POST /menu-items"
              payload: { sku: "DR-HH", name: "HH Drink", category: "DRINK", base_price_cents: 400, size_scheme: "NONE", half_price_eligible: true }
              as: PlatformAdmin
              captures: { hh_item: $.data.id }
            - call: "POST /locations/${loc4_id}/offers"
              payload: { code: "HH", kind: "HAPPY_HOUR", discount_type: "HALF_PRICE_DRINKS", discount_value: 0, window_start_local: "14:00", window_end_local: "16:00", app_only: false }
              as: PlatformAdmin
            - call: "POST /locations/${loc4_id}/offers"
              payload: { code: "P10", kind: "PROMO", discount_type: "PERCENT_OFF_ORDER", discount_value: 10, window_start_local: "00:00", window_end_local: "23:59", app_only: false }
              as: PlatformAdmin
            - call: "POST /locations/${loc4_id}/service-targets"
              payload: { channel: "STALL_INTERCOM", weather_mode: "NORMAL", target_seconds: 600 }
              as: PlatformAdmin
            - call: "POST /locations/${loc4_id}/stalls"
              payload: { stall_number: 1, kind: "STALL" }
              as: PlatformAdmin
              captures: { stall4_id: $.data.id }
            - call: "POST /locations/${loc4_id}/stalls/${stall4_id}/checkin"
              payload: { expected_location_version: "${loc4_v0}" }
              as: ShiftManager
              captures: { o4_id: $.data.id }
            - call: "POST /locations/${loc4_id}/orders/${o4_id}/lines"
              payload: { menu_item_id: "${hh_item}", quantity: 1 }
              as: ShiftManager
            - call: "POST /locations/${loc4_id}/orders/${o4_id}/lines"
              payload: { menu_item_id: "${hh_item}", quantity: 1 }
              as: ShiftManager
          trigger:
            - call: "POST /locations/${loc4_id}/orders/${o4_id}/place"
              payload: {}
              as: ShiftManager
          assert:
            - "Happy hour halves each 400c unit to 200c; post-HH base == 400"
            - "Combination pricing on repriced units [200,200]: second unit discounted round_half_up(200*0.5)=100 -> subtotal_cents == 300"
            - "P10 reads the post-HH, post-combo subtotal 300: PERCENT_OFF_ORDER 10% -> round_half_up(300*10/100) == 30"
            - "Order.${o4_id}.offer_discount_cents == (HH savings 200 + P10 30) == 230 and subtotal_cents == 300"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: stall_cyclic_occupied_idle_out_of_service_loop
        grounds:
          - state_machines.Stall
        distinguishing_aspect: |
          Stall is cyclic (IDLE -> OCCUPIED -> IDLE and IDLE -> OUT_OF_SERVICE
          -> IDLE), unlike a linear pipeline: the same stall completes a full
          occupancy cycle, faults out, returns, and accepts a new check-in.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z; Location L (capacity 2), stall 1."
            - "First occupancy cycle completed (order delivered); fault reported and resolved; stall returned to service."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T13:00:00Z" }
              as: PlatformAdmin
            - call: "POST /locations"
              payload: { code: "OKC-118", name: "OKC 118", timezone: "America/Chicago", stall_capacity: 2 }
              as: PlatformAdmin
              captures: { loc5_id: $.data.id, loc5_v0: $.data.version }
            - call: "POST /locations/${loc5_id}/service-targets"
              payload: { channel: "STALL_INTERCOM", weather_mode: "NORMAL", target_seconds: 600 }
              as: PlatformAdmin
            - call: "POST /menu-items"
              payload: { sku: "FD-X", name: "X", category: "FOOD", base_price_cents: 500, size_scheme: "NONE", half_price_eligible: false }
              as: PlatformAdmin
              captures: { food5: $.data.id }
            - call: "POST /locations/${loc5_id}/stalls"
              payload: { stall_number: 1, kind: "STALL" }
              as: PlatformAdmin
              captures: { stall5_id: $.data.id }
            - call: "POST /locations/${loc5_id}/carhops"
              payload: { name: "Hop A", zone: "NORTH", on_shift: true, max_trays: 3 }
              as: ShiftManager
              captures: { hop5_id: $.data.id, hop5_v0: $.data.version }
            - call: "POST /locations/${loc5_id}/stalls/${stall5_id}/checkin"
              payload: { expected_location_version: "${loc5_v0}" }
              as: ShiftManager
              captures: { o5_id: $.data.id }
            - call: "POST /locations/${loc5_id}/orders/${o5_id}/lines"
              payload: { menu_item_id: "${food5}", quantity: 1 }
              as: ShiftManager
            - call: "POST /locations/${loc5_id}/orders/${o5_id}/place"
              payload: {}
              as: ShiftManager
            - call: "POST /locations/${loc5_id}/orders/${o5_id}/start_preparation"
              payload: {}
              as: KitchenStaff
            - call: "POST /locations/${loc5_id}/orders/${o5_id}/mark_ready"
              payload: {}
              as: KitchenStaff
            - call: "POST /locations/${loc5_id}/orders/${o5_id}/authorize_payment"
              payload: {}
              as: ShiftManager
            - call: "POST /locations/${loc5_id}/orders/${o5_id}/capture_payment"
              payload: {}
              as: ShiftManager
            - call: "POST /locations/${loc5_id}/delivery-runs"
              payload: { carhop_id: "${hop5_id}", expected_carhop_version: "${hop5_v0}", order_ids: ["${o5_id}"] }
              as: ShiftManager
              captures: { run5_id: $.data.id }
            - call: "POST /locations/${loc5_id}/delivery-runs/${run5_id}/depart"
              payload: {}
              as: Carhop
              as_user_id: "${hop5_id}"
            - call: "POST /locations/${loc5_id}/delivery-runs/${run5_id}/orders/${o5_id}/deliver"
              payload: {}
              as: Carhop
              as_user_id: "${hop5_id}"
            - call: "POST /locations/${loc5_id}/stalls/${stall5_id}/faults"
              payload: { kind: "MENU_BOARD_DEAD", note: "board dark", reported_by_role: "CARHOP" }
              as: Carhop
              as_user_id: "${hop5_id}"
              captures: { fault5_id: $.data.id }
            - call: "POST /locations/${loc5_id}/stalls/${stall5_id}/faults/${fault5_id}/resolve"
              payload: {}
              as: ShiftManager
            - call: "POST /locations/${loc5_id}/stalls/${stall5_id}/return_to_service"
              payload: {}
              as: ShiftManager
          trigger:
            - call: "GET /locations/${loc5_id}/stalls/${stall5_id}"
              payload: {}
              as: ShiftManager
          assert:
            - "Stall.${stall5_id}.status == IDLE (full cycle OCCUPIED -> IDLE -> OUT_OF_SERVICE -> IDLE completed)"
            - "Stall.${stall5_id}.intercom_functional == true (fault resolved)"
            - "Stall.${stall5_id}.current_order_id is null"
      - name: order_parallel_payment_and_fulfillment_axes
        grounds:
          - state_machines.Order
          - state_machines.OrderPaymentAxis
        distinguishing_aspect: |
          Order carries two independent state dimensions (fulfillment status x
          payment_status) on one row: fulfillment can advance PLACED ->
          PREPARING -> READY while payment stays UNPAID, and capture at READY
          does not move fulfillment — proving the axes evolve independently.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z; Location L, stall 1, one 500c food order placed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T13:00:00Z" }
              as: PlatformAdmin
            - call: "POST /locations"
              payload: { code: "OKC-119", name: "OKC 119", timezone: "America/Chicago", stall_capacity: 2 }
              as: PlatformAdmin
              captures: { loc6_id: $.data.id, loc6_v0: $.data.version }
            - call: "POST /locations/${loc6_id}/service-targets"
              payload: { channel: "STALL_INTERCOM", weather_mode: "NORMAL", target_seconds: 600 }
              as: PlatformAdmin
            - call: "POST /menu-items"
              payload: { sku: "FD-Y", name: "Y", category: "FOOD", base_price_cents: 500, size_scheme: "NONE", half_price_eligible: false }
              as: PlatformAdmin
              captures: { food6: $.data.id }
            - call: "POST /locations/${loc6_id}/stalls"
              payload: { stall_number: 1, kind: "STALL" }
              as: PlatformAdmin
              captures: { stall6_id: $.data.id }
            - call: "POST /locations/${loc6_id}/stalls/${stall6_id}/checkin"
              payload: { expected_location_version: "${loc6_v0}" }
              as: ShiftManager
              captures: { o6_id: $.data.id }
            - call: "POST /locations/${loc6_id}/orders/${o6_id}/lines"
              payload: { menu_item_id: "${food6}", quantity: 1 }
              as: ShiftManager
            - call: "POST /locations/${loc6_id}/orders/${o6_id}/place"
              payload: {}
              as: ShiftManager
            - call: "POST /locations/${loc6_id}/orders/${o6_id}/start_preparation"
              payload: {}
              as: KitchenStaff
            - call: "POST /locations/${loc6_id}/orders/${o6_id}/mark_ready"
              payload: {}
              as: KitchenStaff
          trigger:
            - call: "POST /locations/${loc6_id}/orders/${o6_id}/authorize_payment"
              payload: {}
              as: ShiftManager
            - call: "POST /locations/${loc6_id}/orders/${o6_id}/capture_payment"
              payload: {}
              as: ShiftManager
            - call: "GET /locations/${loc6_id}/orders/${o6_id}"
              payload: {}
              as: ShiftManager
          assert:
            - "Fulfillment axis advanced to READY while payment stayed UNPAID through preparation (independent axes)"
            - "After authorize+capture: Order.${o6_id}.payment_status == CAPTURED"
            - "Order.${o6_id}.status == READY (capture did not move fulfillment)"
            - "Total 500c order captured with tip 0 -> total_tendered_cents == 500"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: deliver_cascades_stall_posture_run_completion_carhop_load
        grounds:
          - state_machines.Order.OUT_FOR_DELIVERY_to_DELIVERED
          - state_machines.DeliveryRun
          - calculations.stall_availability
        distinguishing_aspect: |
          Depth >= 3 cascade: deliver order -> Stall OCCUPIED->IDLE ->
          Location.stalls_available recomputed -> lane_posture flips CONGESTED
          -> OPEN; separately the delivery empties the run -> DeliveryRun ->
          COMPLETED -> Carhop.active_run_load decremented. Two chains from one
          trigger, each link caused by the previous.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T13:00:00Z; Location L capacity 2 (CONGESTED when stalls_available <= ceil(2*0.2)=1)."
            - "Stall 1 occupied by a delivered-in-progress order (run OUT, payment captured). Location is CONGESTED (1 of 2 stalls available)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T13:00:00Z" }
              as: PlatformAdmin
            - call: "POST /locations"
              payload: { code: "OKC-120", name: "OKC 120", timezone: "America/Chicago", stall_capacity: 2 }
              as: PlatformAdmin
              captures: { loc7_id: $.data.id, loc7_v0: $.data.version }
            - call: "POST /locations/${loc7_id}/service-targets"
              payload: { channel: "STALL_INTERCOM", weather_mode: "NORMAL", target_seconds: 600 }
              as: PlatformAdmin
            - call: "POST /menu-items"
              payload: { sku: "FD-Z", name: "Z", category: "FOOD", base_price_cents: 500, size_scheme: "NONE", half_price_eligible: false }
              as: PlatformAdmin
              captures: { food7: $.data.id }
            - call: "POST /locations/${loc7_id}/stalls"
              payload: { stall_number: 1, kind: "STALL" }
              as: PlatformAdmin
              captures: { stall7_id: $.data.id }
            - call: "POST /locations/${loc7_id}/carhops"
              payload: { name: "Hop B", zone: "NORTH", on_shift: true, max_trays: 3 }
              as: ShiftManager
              captures: { hop7_id: $.data.id, hop7_v0: $.data.version }
            - call: "POST /locations/${loc7_id}/stalls/${stall7_id}/checkin"
              payload: { expected_location_version: "${loc7_v0}" }
              as: ShiftManager
              captures: { o7_id: $.data.id }
