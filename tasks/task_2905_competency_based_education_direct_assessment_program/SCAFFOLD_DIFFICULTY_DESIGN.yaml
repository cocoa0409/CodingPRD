  - rule_id: resource_temporal_overlap
    instances:
      - name: term_window_overlap_half_open_adjacent_allowed
        grounds:
          - validations.priority_31_ERR_TERM_WINDOW_OVERLAP
          - entities.SubscriptionTerm.fields.term_start_utc
          - entities.SubscriptionTerm.fields.term_end_utc
          - state_machines.SubscriptionTerm.PENDING_to_ACTIVE
          - endpoints.POST_subscription_terms
        distinguishing_aspect: |
          Resource entity: SubscriptionTerm, i.e. the student's exclusive enrolment
          timeline. Interval semantics: MUTUAL EXCLUSION over half-open windows
          [term_start_utc, term_end_utc) — overlap is forbidden but exact adjacency
          is legal, so a window starting at 2026-12-01T00:00:00.000Z (the instant
          the first window ends) must be accepted while one starting
          2026-11-15T00:00:00.000Z must be rejected. An implementation using closed
          intervals rejects the legal adjacent window.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T00:00:00.000Z"
            - "PUBLISHED program with one ACTIVE competency"
            - "ACTIVE student holding one ACTIVE term T1 over [2026-09-01, 2026-12-01)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs"
              payload: { code: "CBE-BSIT", title: "BS Information Technology" }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "IT-101", title: "Relational Data Modeling", unit_value: 4, level: "FOUNDATION" }
              as: Registrar
              captures: { c1_id: $.data.id }
            - call: "POST /programs/${prog_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /students"
              payload: { program_id: "${prog_id}", full_name: "Ada Learner", email: "ada@example.edu" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /students/${stu_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /subscription-terms"
              payload: { student_id: "${stu_id}", term_start_utc: "2026-09-01T00:00:00.000Z", term_end_utc: "2026-12-01T00:00:00.000Z", tuition_cents: 375000 }
              as: Registrar
              captures: { t1_id: $.data.id }
            - call: "POST /subscription-terms/${t1_id}/activate"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /subscription-terms"
              payload: { student_id: "${stu_id}", term_start_utc: "2026-11-15T00:00:00.000Z", term_end_utc: "2027-02-15T00:00:00.000Z", tuition_cents: 375000 }
              as: Registrar
              captures: { overlap_error: $.data.error_id }
            - call: "POST /subscription-terms"
              payload: { student_id: "${stu_id}", term_start_utc: "2026-12-01T00:00:00.000Z", term_end_utc: "2027-03-01T00:00:00.000Z", tuition_cents: 375000 }
              as: Registrar
              captures: { t2_id: $.data.id, t2_status: $.data.status }
          assert:
            - "${overlap_error} == ERR_TERM_WINDOW_OVERLAP"
            - "the overlapping create returned HTTP 409 and no SubscriptionTerm row was written"
            - "the adjacent create returned HTTP 201"
            - "${t2_status} == PENDING"
            - "SubscriptionTerm.${t2_id}.term_start_utc == 2026-12-01T00:00:00.000Z"
            - "SubscriptionTerm.${t1_id}.status == ACTIVE"
            - "SubscriptionTerm.${t1_id}.term_end_utc == 2026-12-01T00:00:00.000Z"
            - "the student now owns exactly two SubscriptionTerm rows"

      - name: blueprint_window_contiguous_tiling_with_notice
        grounds:
          - calculations.effective_blueprint_resolution
          - validations.priority_32_ERR_BLUEPRINT_WINDOW_NOT_CONTIGUOUS
          - validations.priority_33_ERR_BLUEPRINT_NOTICE_TOO_SHORT
          - entities.AssessmentBlueprint.fields.effective_to_utc
          - entities.Program.fields.blueprint_notice_days
        distinguishing_aspect: |
          A different resource entity (AssessmentBlueprint — the competency's rubric
          timeline) with the OPPOSITE interval semantics: instead of mutual
          exclusion, the windows must form a CONTIGUOUS half-open tiling with no
          gap, so a successful create does not merely coexist with the incumbent, it
          closes the incumbent's window (effective_to_utc = the new
          effective_from_utc, status SUPERSEDED). It also layers a forward notice
          period: 2026-09-14 is refused for short notice while 2026-09-15 (exactly
          Program.blueprint_notice_days = 14 days ahead, boundary inclusive) is
          accepted, and repeating 2026-09-15 afterwards is a contiguity failure
          because step 3 requires a STRICTLY later instant and runs before the
          notice check.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T00:00:00.000Z"
            - "program with the default blueprint_notice_days 14"
            - "competency IT-101 with its first blueprint bp1 effective from 2026-09-01 (the first blueprint is exempt from the notice period)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs"
              payload: { code: "CBE-BSIT", title: "BS Information Technology" }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "IT-101", title: "Relational Data Modeling", unit_value: 4, level: "FOUNDATION" }
              as: Registrar
              captures: { c1_id: $.data.id, c1_v1: $.data.version }
            - call: "POST /assessment-blueprints"
              payload: { competency_id: "${c1_id}", expected_competency_version: "${c1_v1}", dimensions: [{ code: "D1", weight: 1.0000, max_score: 100, critical: false }], passing_rule: "WEIGHTED_ONLY", required_evaluator_count: 1, effective_from_utc: "2026-09-01T00:00:00.000Z" }
              as: Registrar
              captures: { bp1_id: $.data.id }
            - call: "POST /programs/${prog_id}/publish"
              payload: {}
              as: Registrar
            - call: "GET /competencies/${c1_id}"
              payload: {}
              as: Registrar
              captures: { c1_v2: $.data.version, eff_bp_before: $.data.effective_blueprint_id }
          trigger:
            - call: "POST /assessment-blueprints"
              payload: { competency_id: "${c1_id}", expected_competency_version: "${c1_v2}", dimensions: [{ code: "D1", weight: 1.0000, max_score: 100, critical: false }], passing_rule: "WEIGHTED_ONLY", required_evaluator_count: 1, effective_from_utc: "2026-09-14T00:00:00.000Z" }
              as: Registrar
              captures: { notice_error: $.data.error_id }
            - call: "POST /assessment-blueprints"
              payload: { competency_id: "${c1_id}", expected_competency_version: "${c1_v2}", dimensions: [{ code: "D1", weight: 1.0000, max_score: 100, critical: false }], passing_rule: "WEIGHTED_ONLY", required_evaluator_count: 1, effective_from_utc: "2026-09-15T00:00:00.000Z" }
              as: Registrar
              captures: { bp2_id: $.data.id, bp2_status: $.data.status, bp2_from: $.data.effective_from_utc }
            - call: "GET /competencies/${c1_id}"
              payload: {}
              as: Registrar
              captures: { c1_v3: $.data.version }
            - call: "POST /assessment-blueprints"
              payload: { competency_id: "${c1_id}", expected_competency_version: "${c1_v3}", dimensions: [{ code: "D1", weight: 1.0000, max_score: 100, critical: false }], passing_rule: "WEIGHTED_ONLY", required_evaluator_count: 1, effective_from_utc: "2026-09-15T00:00:00.000Z" }
              as: Registrar
              captures: { contiguity_error: $.data.error_id }
          assert:
            - "${eff_bp_before} == ${bp1_id}"
            - "${notice_error} == ERR_BLUEPRINT_NOTICE_TOO_SHORT"
            - "the short-notice create returned HTTP 422 and left bp1 PUBLISHED with effective_to_utc null"
            - "${bp2_status} == PUBLISHED"
            - "${bp2_from} == 2026-09-15T00:00:00.000Z"
            - "AssessmentBlueprint.${bp2_id}.effective_to_utc == null"
            - "AssessmentBlueprint.${bp1_id}.status == SUPERSEDED"
            - "AssessmentBlueprint.${bp1_id}.effective_to_utc == 2026-09-15T00:00:00.000Z"
            - "Competency.${c1_id}.effective_blueprint_id == ${bp1_id} at the logical clock 2026-09-01T00:00:00.000Z, because the new window does not own that instant"
            - "${contiguity_error} == ERR_BLUEPRINT_WINDOW_NOT_CONTIGUOUS"
            - "the repeated-instant create returned HTTP 409, not 422, because contiguity is checked before notice"
            - "the competency still has exactly two blueprint rows and its windows tile [2026-09-01, 2026-09-15) and [2026-09-15, null)"

  - rule_id: compensating_invariant
    instances:
      - name: unit_conservation_on_integrity_void
        grounds:
          - calculations.unit_conservation
          - state_machines.AssessmentAttempt.SCORED_MASTERED_to_VOIDED
          - entities.Student.fields.mastered_unit_total
          - entities.SubscriptionTerm.fields.units_mastered_in_term
          - endpoints.GET_students_id_progress_summary
        distinguishing_aspect: |
          Conserved quantity: COMPETENCY UNITS (and the credit equivalency derived
          from them). The invariant asserted is
          Student.mastered_unit_total == SUM of units_mastered_in_term over the
          student's terms == SUM of unit_value over currently SCORED_MASTERED
          attempts, holding both after the award (10 units) and after the void of a
          4-unit attempt (6 units), with cumulative_credit_equivalency recomputed
          downwards to 2.0 and mastered_competency_count falling 2 -> 1. A partially
          compensating implementation that only decrements the student but not the
          term leaves credit_equivalency_variance non-zero.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T00:00:00.000Z"
            - "PUBLISHED program with units_per_credit_hour 3.0 and aid_min_credit_equivalency 1"
            - "competencies IT-101 (4 units) and IT-102 (6 units), each with a single-reader 1.0000-weight 100-point blueprint"
            - "ACTIVE student with an ACTIVE term 2026-09-01 to 2026-12-01"
