      - name: segregation_of_duties_names_two_acts_and_no_more
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - validations[priority 13 ERR_SEGREGATION_OF_DUTIES]
          - validations[priority 14 ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          The two segregation rules are narrow by design: they compare the acting identity with the
          criticism's issuer and with the executed order's drafter, and with nothing else. One supervisor
          therefore creates the examination, locks its scope, sustains a criticism raised by an examiner,
          reviews the plan and drafts the order without a single refusal - the accumulation of roles is not
          itself a conflict.
