  - section: errors
    instances:
      - name: error_unauthenticated_missing_headers
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_UNAUTHENTICATED]"
          - "validations[priority=1]"
        distinguishing_aspect: "A request with no X-User-Role header returns 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/clubs"
              payload: {}
              as: __NO_ROLE__
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED"

