  # ---------------------------------------------------------------------------
  # Rule 7: cross_entity_state_dependency — different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: dispatch_requires_vendor_active
        grounds:
          - validations[priority=9]
          - state_machines.Vendor.ACTIVE_to_SUSPENDED
          - state_machines.WorkOrder.TRIAGED_to_ASSIGNED
        distinguishing_aspect: |
          Entity pair WorkOrder -> Vendor: a TRIAGED work order cannot transition
          to ASSIGNED while the target Vendor is in SUSPENDED status.
        test_recipe:
          setup:
            - "Vendor V suspended; work order TRIAGED"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "XDep Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "113", full_name: "R Thirteen", email: "r13@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /vendors"
              payload: { property_id: "${prop_id}", company_name: "V Co", trade: "PLUMBING", insurance_valid_until: "2027-01-01T00:00:00Z" }
              as: PropertyManager
              captures: { ven_id: $.data.id }
            - call: "POST /vendors/${ven_id}/events"
              payload: { event_type: "SUSPEND" }
              as: PropertyManager
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Needs vendor" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "VENDOR", vendor_id: "${ven_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VENDOR_NOT_ACTIVE, HTTP 409"
            - "WorkOrder.${wo_id}.status remains TRIAGED"

      - name: completion_blocked_by_open_purchase_request
        grounds:
          - validations[priority=17]
          - state_machines.PurchaseRequest
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Entity pair WorkOrder -> PurchaseRequest (different pair from the vendor
          instance): IN_PROGRESS -> COMPLETED is blocked while any PurchaseRequest
          of the work order is PENDING or APPROVED, and unblocks after RECEIVE
          moves it to RECEIVED.
        test_recipe:
          setup:
            - "Work order IN_PROGRESS (in-house, signed off); a PurchaseRequest over the default 50000 threshold sits PENDING"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Block Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "114", full_name: "R Fourteen", email: "r14@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /parts"
              payload: { property_id: "${prop_id}", sku: "PMP-1", name: "Pump", unit_cost_cents: 30000, reorder_level: 0, initial_stock: 0 }
              as: PropertyManager
              captures: { part_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Pump replacement" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: { resident_consent_confirmed: true }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wo_v3: $.data.version }
            - call: "POST /work-orders/${wo_id}/sign-off"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
            - call: "POST /work-orders/${wo_id}/purchase-requests"
              payload: { part_id: "${part_id}", quantity: 2, quoted_unit_cost_cents: 30000, shipping_fee_cents: 0, expected_work_order_version: "${wo_v3}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { pr_id: $.data.id, pr_status: $.data.status }
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { photo_urls: ["https://x/g1.jpg"], damage_reported: false }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
            - call: "POST /purchase-requests/${pr_id}/events"
              payload: { event_type: "APPROVE" }
              as: PropertyManager
            - call: "POST /purchase-requests/${pr_id}/events"
              payload: { event_type: "RECEIVE" }
              as: PropertyManager
              captures: { pr_final: $.data.status }
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { photo_urls: ["https://x/g1.jpg"], damage_reported: false }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wo_done: $.data.status }
          assert:
            - "PurchaseRequest.${pr_id} total 64800 (60000 + handling 4800) > 50000 -> created PENDING"
            - "First complete: error_id == ERR_OPEN_PURCHASE_REQUESTS, HTTP 409"
            - "After APPROVE then RECEIVE: PurchaseRequest.${pr_id}.status == RECEIVED (terminal)"
            - "Second complete succeeds: WorkOrder.${wo_id}.status == COMPLETED"

  # ---------------------------------------------------------------------------
  # Rule 8: resource_temporal_overlap — different interval semantics/resources
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: technician_half_open_adjacency
        grounds:
          - validations[priority=11]
          - errors[ERR_TECHNICIAN_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Resource: Technician; semantics: pure half-open intervals with no
          buffer — a job starting exactly when another ends (12:00 == 12:00) is
          allowed, while a genuine overlap (11:00-13:00 vs 10:00-12:00) conflicts.
        test_recipe:
          setup:
            - "Technician T (PLUMBING); work order W1 dispatched to T with window 2026-08-01T10:00-12:00; W2 and W3 are TRIAGED"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Tech Overlap Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "115", full_name: "R Fifteen", email: "r15@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Job 1" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo1: $.data.id }
            - call: "POST /work-orders/${wo1}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Job 2" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo2: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Job 3" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo3: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo2}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T12:00:00Z", scheduled_end_at: "2026-08-01T14:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
              captures: { wo2_status: $.data.status }
            - call: "POST /work-orders/${wo3}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T11:00:00Z", scheduled_end_at: "2026-08-01T13:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent dispatch (12:00 start == 12:00 end of W1): succeeds, WorkOrder.${wo2}.status == ASSIGNED"
            - "Overlapping dispatch (11:00-13:00): error_id == ERR_TECHNICIAN_SCHEDULE_CONFLICT, HTTP 409"
            - "WorkOrder.${wo3}.status remains TRIAGED"

      - name: vendor_travel_buffer_gap
        grounds:
          - validations[priority=12]
          - errors[ERR_VENDOR_SCHEDULE_CONFLICT]
          - entities.Property.fields.vendor_travel_buffer_minutes
        distinguishing_aspect: |
          Resource: Vendor; semantics: buffer-padded intervals — consecutive
          vendor jobs must be separated by >= vendor_travel_buffer_minutes (60),
          so a gap of exactly 60 minutes is allowed but a 30-minute gap conflicts
          even though the raw windows do not overlap.
        test_recipe:
          setup:
            - "Vendor V (ACTIVE, insured) with job J1 window 2026-08-01T10:00-12:00; J2 and J3 are TRIAGED"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Vendor Buffer Property", vendor_travel_buffer_minutes: 60 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "116", full_name: "R Sixteen", email: "r16@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /vendors"
              payload: { property_id: "${prop_id}", company_name: "V Co", trade: "PLUMBING", insurance_valid_until: "2027-01-01T00:00:00Z" }
              as: PropertyManager
              captures: { ven_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Vendor job 1" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo1: $.data.id }
            - call: "POST /work-orders/${wo1}/dispatch"
              payload: { assignment_type: "VENDOR", vendor_id: "${ven_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Vendor job 2" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo2: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Vendor job 3" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo3: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo2}/dispatch"
              payload: { assignment_type: "VENDOR", vendor_id: "${ven_id}", scheduled_start_at: "2026-08-01T13:00:00Z", scheduled_end_at: "2026-08-01T15:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
              captures: { wo2_status: $.data.status }
            - call: "POST /work-orders/${wo3}/dispatch"
              payload: { assignment_type: "VENDOR", vendor_id: "${ven_id}", scheduled_start_at: "2026-08-01T12:30:00Z", scheduled_end_at: "2026-08-01T14:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Gap exactly == buffer (13:00 >= 12:00 + 60min): succeeds, WorkOrder.${wo2}.status == ASSIGNED"
            - "Gap 30 minutes (12:30 start after 12:00 end): error_id == ERR_VENDOR_SCHEDULE_CONFLICT, HTTP 409 — raw windows do not overlap but the buffer rule rejects it"
            - "WorkOrder.${wo3}.status remains TRIAGED"

  # ---------------------------------------------------------------------------
  # Rule 9: compensating_invariant — different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: part_reserve_release_conserves_stock
        grounds:
          - calculations.part_stock_ledger
          - state_machines.WorkOrderPart.RESERVED_to_RELEASED
          - entities.Part.fields.quantity_on_hand
          - entities.Part.fields.reserved_quantity
        distinguishing_aspect: |
          Conserved quantity: physical stock units — for a Part,
          (quantity_on_hand + reserved_quantity) is identical before a reserve and
          after its compensating release (5+0 == 2+3 == 5+0).
        test_recipe:
          setup:
            - "Part P initial_stock 5, reorder_level 0; work order ASSIGNED to technician"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Stock Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "117", full_name: "R Seventeen", email: "r17@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /parts"
              payload: { property_id: "${prop_id}", sku: "GSK-1", name: "Gasket", unit_cost_cents: 250, reorder_level: 0, initial_stock: 5 }
              as: PropertyManager
              captures: { part_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Gasket job" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo_id}/parts"
              payload: { part_id: "${part_id}", quantity: 3 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wop_id: $.data.id }
            - call: "GET /parts/${part_id}"
              payload: {}
              as: PropertyManager
              captures: { onhand_mid: $.data.quantity_on_hand, resv_mid: $.data.reserved_quantity }
            - call: "POST /work-orders/${wo_id}/parts/${wop_id}/release"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /parts/${part_id}"
              payload: {}
              as: PropertyManager
              captures: { onhand_end: $.data.quantity_on_hand, resv_end: $.data.reserved_quantity }
          assert:
            - "After reserve: quantity_on_hand == 2, reserved_quantity == 3 (sum 5 == initial stock)"
            - "After release: quantity_on_hand == 5, reserved_quantity == 0 (sum 5 — the reserve/release pair conserves on_hand + reserved)"
            - "WorkOrderPart.${wop_id}.status == RELEASED"

      - name: chargeback_bill_waive_conserves_balance
        grounds:
          - calculations.resident_chargeback_balance
          - state_machines.Chargeback.PENDING_to_BILLED
          - state_machines.Chargeback.BILLED_to_WAIVED
          - entities.Resident.fields.chargeback_balance_cents
        distinguishing_aspect: |
          Conserved quantity: resident fiscal balance in cents — BILL followed by
          its compensating WAIVE leaves Resident.chargeback_balance_cents
          identical to its pre-BILL value (0 -> 10000 -> 0).
        test_recipe:
          setup:
            - "Resident balance 0; PENDING chargeback (provisional 10000) exists from a damage completion"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Fiscal Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "118", full_name: "R Eighteen", email: "r18@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Door damage" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: { resident_consent_confirmed: true }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/sign-off"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { photo_urls: ["https://x/h1.jpg"], damage_reported: true, estimated_damage_cost_cents: 10000 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /chargebacks"
              payload: { work_order_id: "${wo_id}" }
              as: PropertyManager
              captures: {cb_id: "$.data[0].id"}
          trigger:
            - call: "POST /chargebacks/${cb_id}/events"
              payload: { event_type: "BILL", line_items: [{ description: "Door", quantity: 1, unit_cost_cents: 10000, resident_share_pct: 1.0 }] }
              as: PropertyManager
            - call: "GET /residents/${res_id}"
              payload: {}
              as: PropertyManager
              captures: { bal_billed: $.data.chargeback_balance_cents }
            - call: "POST /chargebacks/${cb_id}/events"
              payload: { event_type: "WAIVE" }
              as: PropertyManager
            - call: "GET /residents/${res_id}"
              payload: {}
              as: PropertyManager
              captures: { bal_waived: $.data.chargeback_balance_cents }
          assert:
            - "After BILL: chargeback_balance_cents == 10000"
            - "After WAIVE: chargeback_balance_cents == 0 — exactly the pre-BILL balance; the BILL/WAIVE pair conserves it"
            - "Chargeback.${cb_id}.status == WAIVED"
