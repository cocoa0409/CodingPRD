              as: ClientLiaison
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${c1_file_id}", account_ref: "ABC4702", sequence_no: 2, statement_amount_cents: 4000, address_line1: "4702 Stale View Way", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "4702" }
              as: ClientLiaison
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${c1_file_id}", account_ref: "ABC4703", sequence_no: 3, statement_amount_cents: 4000, address_line1: "4704 Stale View Way", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "4703" }
              as: ClientLiaison
            - call: "POST /bureau/data-files/${c1_file_id}/validate-format"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/data-files/${c1_file_id}/control-check"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/composition-jobs"
              payload: { data_file_id: "${c1_file_id}", template_id: "${c1_template_id}", rush_requested: false }
              as: CompositionOperator
              as_user_id: "op-1"
              captures: { c1_job_id: "$.data.id" }
            - call: "POST /bureau/composition-jobs/${c1_job_id}/presort"
              payload: {}
              as: CompositionOperator
            - call: "GET /bureau/mail-pieces?composition_job_id=${c1_job_id}"
              payload: {}
              as: IntegrityAuditor
              captures: { c1_piece_1: "$.data[0].id", c1_barcode_1: "$.data[0].imb_barcode", c1_piece_2: "$.data[1].id", c1_piece_3: "$.data[2].id" }
            - call: "POST /bureau/composition-jobs/${c1_job_id}/schedule"
              payload: { window_start: "2026-08-05T09:00:00Z", press_line_id: "${c1_line_id}" }
              as: ProductionScheduler
              captures: { c1_run_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/print-runs/${c1_run_id}/start"
              payload: {}
              as: ProductionScheduler
            - call: "POST /bureau/mail-pieces/${c1_piece_1}/scans"
              payload: { stage: "PRINT", scanned_barcode: "${c1_barcode_1}", device_code: "SCN-C1" }
              as: IntegrityAuditor
            - call: "POST /bureau/mail-pieces/${c1_piece_1}/scans"
              payload: { stage: "INSERT", scanned_barcode: "${c1_barcode_1}", device_code: "SCN-C1" }
              as: IntegrityAuditor
            - call: "POST /bureau/mail-pieces/${c1_piece_1}/scans"
              payload: { stage: "INDUCT", scanned_barcode: "${c1_barcode_1}", device_code: "SCN-C1" }
              as: IntegrityAuditor
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T10:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/print-runs/${c1_run_id}/complete"
              payload: {}
              as: ProductionScheduler
            - call: "POST /bureau/composition-jobs/${c1_job_id}/reconcile-integrity"
              payload: {}
              as: IntegrityAuditor
              captures: { c1_stale_version: "$.data.version", c1_held_status: "$.data.status" }
            - call: "POST /bureau/mail-pieces/${c1_piece_2}/reprints"
              payload: { expected_composition_job_version: "${c1_stale_version}", reprint_reason: "no scans at all" }
              as: IntegrityAuditor
              captures: { c1_replacement_2: "$.data.id" }
            - call: "POST /bureau/composition-jobs/${c1_job_id}/reconcile-integrity"
              payload: {}
              as: IntegrityAuditor
              captures: { c1_fresh_version: "$.data.version", c1_second_hold: "$.data.status", c1_missing: "$.data.missing_scan_count" }
          trigger:
            - call: "POST /bureau/mail-pieces/${c1_piece_3}/reprints"
              payload: { expected_composition_job_version: "${c1_stale_version}", reprint_reason: "still no scans" }
              as: IntegrityAuditor
              captures: { c1_occ_error: "$.data.error_id" }
            - call: "POST /bureau/mail-pieces/${c1_piece_3}/reprints"
              payload: { expected_composition_job_version: "${c1_fresh_version}", reprint_reason: "still no scans" }
              as: IntegrityAuditor
              captures: { c1_replacement_3: "$.data.id", c1_replacement_of: "$.data.reprint_of_piece_id" }
          assert:
            - "${c1_held_status} == INTEGRITY_HELD and ${c1_second_hold} == INTEGRITY_HELD, with ${c1_fresh_version} == ${c1_stale_version} + 2 (one bump for the reprint, one for reconcile #2)"
            - "${c1_missing} == 2 — piece 3 and the replacement of piece 2 are both unscanned, so the reprint state gates at priorities 23 and 28 both pass"
            - "HTTP 412 with ${c1_occ_error} == ERR_STALE_COMPOSITION_JOB_VERSION for the stale version, and MailPiece.${c1_piece_3}.piece_status is still COMPOSED (not VOID)"
            - "HTTP 201 with the fresh version: ${c1_replacement_of} == ${c1_piece_3} and ${c1_replacement_3} != ${c1_replacement_2}"
            - "GET /bureau/mail-pieces?composition_job_id=${c1_job_id}&piece_status=VOID returns total_count == 2, so the 412 attempt voided nothing"

      - name: seal_optimistic_concurrency_is_covered_by_the_difficulty_design
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.batch-seal-stale-client-escrow, errors.ERR_STALE_CLIENT_VERSION]
        excluded_because:
          difficulty_instance: stale_client_version_outranks_postage_escrow_shortfall
          rationale: "That instance seals a sibling batch to advance Client.version, then replays the stale expected_client_version against a batch whose escrow is also short, asserting the 412 rather than the 402 — it already covers the success path, the stale path and the version increment for this concurrency rule."

      - name: cascading_side_effects_are_covered_by_the_difficulty_design
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers.cascading_side_effects]
        excluded_because:
          difficulty_instance: print_run_abort_unwinds_a_four_link_chain
          rationale: "The abort chain instance verifies a four-link cascade end-to-end (run -> pieces -> job -> press line ledger) and the undeliverable classification instance verifies a three-link cascade to the client counter, so the layer's chain, ordering and partial-state claims are already exercised."

      - name: dual_variant_postage_and_sla_are_covered_by_the_difficulty_design
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers.dual_variant_calculation]
        excluded_because:
          difficulty_instance: postage_estimate_and_manifest_variants_diverge_on_one_batch
          rationale: "Both variant pairs already have dedicated instances: the postage instance proves estimated vs manifested divergence and the recorded postage_variance_cents delta, and sla_projected_and_assessed_variants_diverge_on_one_job proves the projected/assessed switch."

      - name: press_line_selector_policy_is_covered_by_the_difficulty_design
        claim_type: selector_policy
        grounds: [complexity_profile.complexity_layers.selector_policy]
        excluded_because:
          difficulty_instance: press_line_selection_scores_headroom_speed_and_capability_surplus
          rationale: "That instance exercises the full selector — headroom and speed weights, the capability-surplus penalty and the sheets_per_hour DESC then line_code ASC tie-break — and the §1.9 endpoint instance omitting_the_press_line_selects_one_and_records_selection_mode_selected covers the EXPLICIT vs SELECTED recording."

  - section: consistency_model
    instances:

      - name: composition_response_carries_every_derived_counter_in_the_same_request
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, entities.CompositionJob.fields.total_sheet_count, entities.CompositionJob.fields.print_sheet_count, calculations.variable_content_sheet_composition]
        distinguishing_aspect: "Nothing is deferred to a later read: the 201 body of the composition call already contains the piece counts, the two divergent sheet bases, the reserved insert movement and the SLA due date, and an immediate re-read returns byte-identical values."
        test_recipe:
          setup:
            - "Insert stock INS-D1 with received_count 10 and sheets_per_insert 2, ACTIVE from 2026-01-01."
            - "Client CL-D1 (default sla_turnaround_hours 48, dr_readiness_required false) with ACTIVE template T-D1: sheets_per_document 2, color_pages_per_document 1, required_insert_codes [INS-D1], no variable content rules."
            - "A three-record file accepted at exactly 2026-08-01T00:00:00Z; account ABC4802 is paperless-confirmed before composition, so its piece composes SUPPRESSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/insert-stocks"
              payload: { insert_code: "INS-D1", description: "Two-sheet regulatory notice", jurisdiction_code: "US", effective_from: "2026-01-01T00:00:00Z", sheets_per_insert: 2, received_count: 10 }
              as: BureauAdmin
              captures: { d1_insert_id: "$.data.id" }
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-D1", name: "Immediate Insight Insurance", dr_readiness_required: false }
              as: BureauAdmin
              captures: { d1_client_id: "$.data.id" }
            - call: "POST /bureau/composition-templates"
              payload: { client_id: "${d1_client_id}", template_code: "T-D1", version_no: 1, duplex_required: false, sheets_per_document: 2, color_pages_per_document: 1, mail_class_preference: "FIRST_CLASS", required_insert_codes: ["INS-D1"], variable_content_rules: [] }
              as: BureauAdmin
              captures: { d1_template_id: "$.data.id" }
            - call: "POST /bureau/composition-templates/${d1_template_id}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/paperless-enrollments"
              payload: { client_id: "${d1_client_id}", account_ref: "ABC4802", channel: "EMAIL" }
              as: ClientLiaison
            - call: "POST /bureau/clients/${d1_client_id}/paperless-sync"
              payload: { confirm_pending_account_refs: ["ABC4802"] }
              as: ClientLiaison
            - call: "POST /bureau/data-files"
              payload: { client_id: "${d1_client_id}", file_name: "d1.csv", format_spec_code: "DELIMITED", declared_record_count: 3, declared_control_total_cents: 12000 }
              as: ClientLiaison
              captures: { d1_file_id: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${d1_file_id}", account_ref: "ABC4801", sequence_no: 1, statement_amount_cents: 4000, address_line1: "4800 Immediate Isle", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "4801" }
              as: ClientLiaison
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${d1_file_id}", account_ref: "ABC4802", sequence_no: 2, statement_amount_cents: 4000, address_line1: "4802 Immediate Isle", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "4802" }
              as: ClientLiaison
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${d1_file_id}", account_ref: "ABC4803", sequence_no: 3, statement_amount_cents: 4000, address_line1: "4804 Immediate Isle", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "4803" }
              as: ClientLiaison
            - call: "POST /bureau/data-files/${d1_file_id}/validate-format"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/data-files/${d1_file_id}/control-check"
              payload: {}
              as: CompositionOperator
              captures: { d1_accepted_at: "$.data.accepted_at" }
          trigger:
            - call: "POST /bureau/composition-jobs"
              payload: { data_file_id: "${d1_file_id}", template_id: "${d1_template_id}", rush_requested: false }
              as: CompositionOperator
              as_user_id: "op-1"
              captures: { d1_job_id: "$.data.id", d1_expected: "$.data.expected_piece_count", d1_print_pieces: "$.data.print_piece_count", d1_electronic: "$.data.electronic_piece_count", d1_accountable: "$.data.accountable_piece_count", d1_total_sheets: "$.data.total_sheet_count", d1_print_sheets: "$.data.print_sheet_count", d1_insert_sheets: "$.data.insert_sheet_total", d1_color: "$.data.color_page_count", d1_due: "$.data.sla_due_at" }
            - call: "GET /bureau/composition-jobs/${d1_job_id}"
              payload: {}
              as: CompositionOperator
              captures: { d1_reread_total: "$.data.total_sheet_count", d1_reread_print: "$.data.print_sheet_count", d1_reread_due: "$.data.sla_due_at" }
            - call: "GET /bureau/insert-stocks/${d1_insert_id}"
              payload: {}
              as: BureauAdmin
              captures: { d1_on_hand: "$.data.on_hand_count", d1_reserved: "$.data.reserved_count" }
            - call: "GET /bureau/data-files/${d1_file_id}"
              payload: {}
              as: ClientLiaison
              captures: { d1_file_status: "$.data.status" }
          assert:
            - "${d1_accepted_at} == 2026-08-01T00:00:00Z, so ${d1_due} == 2026-08-03T00:00:00Z (accepted_at plus the default 48 hours) is already present in the composition response"
            - "${d1_expected} == 3, ${d1_print_pieces} == 2, ${d1_electronic} == 1 and ${d1_accountable} == 3 in the 201 body itself"
            - "Each piece has sheet_count == 4 == 2 template sheets + 2 insert sheets, so ${d1_total_sheets} == 12 (billable basis, all three pieces) while ${d1_print_sheets} == 8 (press basis, the suppressed piece excluded)"
            - "${d1_insert_sheets} == 6 and ${d1_color} == 3 == 3 * min(1, 4 * 2)"
            - "${d1_reread_total} == 12, ${d1_reread_print} == 8 and ${d1_reread_due} == ${d1_due} — the immediate re-read adds nothing and changes nothing"
            - "${d1_on_hand} == 8 and ${d1_reserved} == 2: only the two non-SUPPRESSED pieces reserved a copy, visible without any settling delay"
            - "${d1_file_status} == CONSUMED in the same request cycle as the composition"

      - name: seal_escrow_visibility_is_covered_by_the_difficulty_design
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, entities.Client.fields.postage_escrow_cents]
        excluded_because:
          difficulty_instance: postage_escrow_conserved_across_seal_and_unseal
          rationale: "That instance reads postage_escrow_cents and postage_committed_cents straight out of the seal and unseal responses and re-reads the client immediately afterwards, so the immediate-visibility claim for the escrow ledger is already asserted there."
