scenario: |
  Voiceover Casting & Session Booking (voiceover talent agency): audition brief & talent roster search, self-audition intake & client selection, session scheduling with studio/directed patch, usage terms (broadcast/digital/term) & buyout pricing, retake/pickup session policy, talent payment & agent commission, conflict/exclusivity by product category, file delivery & revision window

domain_name: voiceover-casting
api_prefix: /api

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED — verbatim per §1.0)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Talent
    parent: null
    common_fields: true
    fields:
      - { name: stage_name, type: string, source: input, description: "Talent stage name" }
      - { name: email, type: string, source: input, description: "Contact email, unique" }
      - { name: voice_profile, type: enum, source: input, description: "MALE_DEEP | MALE_LIGHT | FEMALE_DEEP | FEMALE_LIGHT | NONBINARY | CHILD" }
      - { name: languages, type: array, source: input, description: "List of ISO 639-1 language codes" }
      - { name: union_status, type: enum, source: input, description: "UNION | NON_UNION | FICORE" }
      - { name: base_session_fee_cents, type: integer, source: input, description: "Talent's 1-hour session fee before usage multipliers" }
      - { name: roster_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | OFFBOARDED", default: ACTIVE }
      - { name: active_conflict_categories, type: array, source: computed, description: "Product categories for which talent has live exclusivity" }

  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Brand/agency name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email, unique" }
      - { name: billing_email, type: string, source: input, description: "Invoice recipient" }
      - { name: default_currency, type: enum, source: input, description: "USD | EUR | GBP", default: USD }
      - { name: account_status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }

  - name: Project
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; owning client" }
      - { name: title, type: string, source: input, description: "Project name" }
      - { name: product_category, type: enum, source: input, description: "AUTOMOTIVE | PHARMA | FAST_FOOD | FINANCE | TECH | RETAIL | ALCOHOL | GAMING" }
      - { name: usage_type, type: enum, source: input, description: "BROADCAST | DIGITAL | TERM" }
      - { name: term_months, type: integer, source: input, description: "License duration in months; required iff usage_type=TERM", default: null }
      - { name: spots_count, type: integer, source: input, description: "Number of distinct spots covered by the buyout" }
      - { name: exclusivity_required, type: boolean, source: input, description: "If true, talent must have no active conflict in product_category", default: false }
      - { name: brief_text, type: string, source: input, description: "Direction notes & script excerpt" }
      - { name: audition_deadline, type: datetime, source: input, description: "Self-audition submission cutoff (ISO8601 UTC)" }
      - { name: status, type: enum, source: system, description: "DRAFT | CASTING | CAST | IN_SESSION | DELIVERED | CLOSED | CANCELLED", default: DRAFT }
      - { name: selected_talent_id, type: string, source: system, description: "FK -> Talent.id; chosen talent, null until cast", default: null }
      - { name: buyout_quote_cents, type: integer, source: computed, description: "Provisional buyout quote computed at CASTING entry" }
      - { name: buyout_final_cents, type: integer, source: computed, description: "Final buyout computed at cast confirmation; may differ from quote due to spot-count tiering" }

  - name: SelfAudition
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: talent_id, type: string, source: system, description: "FK -> Talent.id; submitting talent" }
      - { name: audio_file_url, type: string, source: input, description: "Submitted MP3/WAV URL" }
      - { name: slate_text, type: string, source: input, description: "Optional slate notes", default: "" }
      - { name: submitted_at, type: datetime, source: system, description: "Server timestamp" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | SHORTLISTED | REJECTED | SELECTED", default: SUBMITTED }

  - name: Studio
    parent: null
    common_fields: true
    fields:
      - { name: studio_name, type: string, source: input, description: "Studio identifier" }
      - { name: location, type: string, source: input, description: "City / room description" }
      - { name: has_directed_patch, type: boolean, source: input, description: "Supports remote directed patch (Source-Connect/ISDN)" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Studio hourly rate" }
      - { name: operating_tz, type: string, source: input, description: "IANA timezone string, e.g. America/Los_Angeles" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", default: OPEN }

  - name: Session
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: talent_id, type: string, source: system, description: "FK -> Talent.id (denormalized from Project at booking time)" }
      - { name: studio_id, type: string, source: input, description: "FK -> Studio.id" }
      - { name: session_kind, type: enum, source: input, description: "PRIMARY | PICKUP | RETAKE" }
      - { name: directed_patch, type: boolean, source: input, description: "True iff remote direction over patch; requires Studio.has_directed_patch" }
      - { name: start_at, type: datetime, source: input, description: "Session start (ISO8601 UTC)" }
      - { name: duration_minutes, type: integer, source: input, description: "Scheduled length in minutes (>=15)" }
      - { name: status, type: enum, source: system, description: "TENTATIVE | CONFIRMED | COMPLETED | CANCELLED", default: TENTATIVE }
      - { name: end_at, type: datetime, source: computed, description: "start_at + duration_minutes, derived server-side" }

  - name: UsageTerms
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; 1:1 (array of length 0–1 in reverse GET)" }
      - { name: usage_type, type: enum, source: system, description: "BROADCAST | DIGITAL | TERM (mirrors Project.usage_type)" }
      - { name: term_months, type: integer, source: system, description: "Mirrors Project.term_months; null for non-TERM" }
      - { name: broadcast_regions, type: array, source: input, description: "List of region codes, e.g. [NA, EU, APAC]; required iff usage_type=BROADCAST", default: [] }
      - { name: digital_placements, type: array, source: input, description: "List of placements, e.g. [PRE_ROLL, SOCIAL_PAID, OLV]; required iff usage_type=DIGITAL", default: [] }
      - { name: buyout_cents, type: integer, source: computed, description: "Final usage buyout total in cents" }
      - { name: agent_commission_cents, type: integer, source: computed, description: "Agency commission deducted from talent payout" }
      - { name: talent_payout_cents, type: integer, source: computed, description: "Amount owed to talent after commission" }
      - { name: locked_at_cast, type: boolean, source: system, description: "True once Project reaches CAST; terms immutable thereafter", default: false }

  - name: Invoice
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: invoice_kind, type: enum, source: system, description: "BUYOUT | SESSION_FEE | PICKUP_FEE" }
      - { name: talent_amount_cents, type: integer, source: computed, description: "Portion payable to talent" }
      - { name: agent_commission_cents, type: integer, source: computed, description: "Portion retained by agency" }
      - { name: total_cents, type: integer, source: computed, description: "talent_amount_cents + agent_commission_cents" }
      - { name: status, type: enum, source: system, description: "PENDING | ISSUED | PAID | VOID", default: PENDING }
      - { name: issued_at, type: datetime, source: system, description: "Set on transition to ISSUED" }

  - name: ConflictExclusion
    parent: Talent
    common_fields: true
    fields:
      - { name: talent_id, type: string, source: system, description: "FK -> Talent.id" }
      - { name: product_category, type: enum, source: input, description: "AUTOMOTIVE | PHARMA | FAST_FOOD | FINANCE | TECH | RETAIL | ALCOHOL | GAMING" }
      - { name: starts_at, type: datetime, source: input, description: "Exclusivity window start (ISO8601 UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Exclusivity window end (ISO8601 UTC); half-open interval [starts_at, ends_at)" }
      - { name: source, type: enum, source: system, description: "PROJECT_CAST | MANUAL_HOLD", default: PROJECT_CAST }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED | EXPIRED", default: ACTIVE }

  - name: Delivery
    parent: Project
    common_fields: false
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: session_id, type: string, source: system, description: "FK -> Session.id whose audio was delivered" }
      - { name: file_url, type: string, source: input, description: "Final mix URL" }
      - { name: delivered_at, type: datetime, source: system, description: "Server timestamp" }
      - { name: revision_window_hours, type: integer, source: system, description: "Constant 72", default: 72 }
      - { name: revision_window_closes_at, type: datetime, source: computed, description: "delivered_at + 72h" }
      - { name: revision_requested, type: boolean, source: system, description: "True if client requested revision within window", default: false }

  - name: ClockState
    parent: null
    common_fields: false
    fields:
      - { name: current_utc, type: datetime, source: system, description: "Logical clock; starts at 2026-08-01T00:00:00Z, advanced only via /_clock/set_current_utc" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CASTING
        trigger: "POST /api/projects/{project_id}/open_casting"
        actor: CastingDirector
        preconditions:
          - "Project.audition_deadline > clock.current_utc"
          - "Project.brief_text non-empty"
        side_effects:
          - "Compute Project.buyout_quote_cents via buyout_quote calculation"

      - from: CASTING
        to: CAST
        trigger: "POST /api/projects/{project_id}/select_talent"
        actor: Client
        preconditions:
          - "selected SelfAudition exists on project with status=SUBMITTED or SHORTLISTED"
          - "Project.client_id == acting client"
          - "If Project.exclusivity_required: selected Talent has no ACTIVE ConflictExclusion overlapping [clock.current_utc, clock.current_utc + Project.term_months months) in Project.product_category"
          - "Talent.roster_status == ACTIVE"
        side_effects:
          - "SelfAudition.status → SELECTED for the chosen audition"
          - "Other SelfAudition rows on the same project with status IN {SUBMITTED, SHORTLISTED} → REJECTED"
          - "Project.selected_talent_id ← chosen talent"
          - "Compute Project.buyout_final_cents via buyout_final calculation"
          - "Create UsageTerms row for project with locked_at_cast=true and computed buyout_cents, agent_commission_cents, talent_payout_cents"
          - "Create ConflictExclusion row for (talent, product_category) with window [now, now + term_months months) when Project.exclusivity_required=true; sets Talent.active_conflict_categories"

      - from: CAST
        to: IN_SESSION
        trigger: "POST /api/sessions/{id}/confirm (when it is the project's first CONFIRMED session)"
        actor: CastingDirector
        preconditions:
          - "Project.status == CAST"
          - "Session being confirmed exists and is TENTATIVE"
        side_effects:
          - "Project.status ← IN_SESSION"

      - from: IN_SESSION
        to: DELIVERED
        trigger: "POST /api/projects/{project_id}/deliveries"
        actor: StudioEngineer
        preconditions:
          - "At least one Session on the project has status == COMPLETED"
          - "No PICKUP session on the project is in status CONFIRMED or TENTATIVE"
        side_effects:
          - "Create Delivery row with revision_window_closes_at = delivered_at + 72h"
          - "Generate BUYOUT Invoice (PENDING) referencing UsageTerms.buyout_cents"
          - "Generate SESSION_FEE Invoices for every COMPLETED PRIMARY/RETAKE session not yet invoiced"

      - from: DELIVERED
        to: CLOSED
        trigger: "system (clock.current_utc > Delivery.revision_window_closes_at AND Delivery.revision_requested == false) OR POST /api/projects/{project_id}/close"
        actor: "system or Client"
        preconditions:
          - "System path: clock advanced past revision_window_closes_at with no revision request"
          - "Client path: client confirms acceptance"
        side_effects:
          - "All PENDING Invoices for the project → ISSUED"

      - from: DELIVERED
        to: CAST
        trigger: "POST /api/projects/{project_id}/request_revision"
        actor: Client
        preconditions:
          - "clock.current_utc <= Delivery.revision_window_closes_at"
          - "Delivery.revision_requested == false"
        side_effects:
          - "Delivery.revision_requested ← true"
          - "Project reverts to CAST for a retake/pickup round (cyclic)"
          - "RETAKE session is allowed to be scheduled; PICKUP only if scope expands"

      - from: [DRAFT, CASTING, CAST]
        to: CANCELLED
        trigger: "POST /api/projects/{project_id}/cancel"
        actor: Client
        preconditions:
          - "No Session on the project has status == CONFIRMED"
          - "No Invoice on the project has status == ISSUED or PAID"
        side_effects:
          - "All non-terminal SelfAudition rows → REJECTED"
          - "All TENTATIVE Sessions → CANCELLED"
          - "Active ConflictExclusion rows created by this project → RELEASED"
          - "PENDING Invoices → VOID"

  - entity: SelfAudition
    field: status
    initial_state: SUBMITTED
    terminal_states: [REJECTED, SELECTED]
    transitions:
      - from: SUBMITTED
        to: SHORTLISTED
        trigger: "POST /api/self_auditions/{id}/shortlist"
        actor: Client
        preconditions:
          - "Project.status == CASTING"
          - "Project.client_id == acting client"
        side_effects: []

      - from: [SUBMITTED, SHORTLISTED]
        to: SELECTED
        trigger: "system (Project CASTING→CAST transition)"
        actor: system
        preconditions: []
        side_effects:
          - "Sibling auditions on the same project → REJECTED"

      - from: [SUBMITTED, SHORTLISTED]
        to: REJECTED
        trigger: "POST /api/self_auditions/{id}/reject OR system (sibling selected, or project cancelled)"
        actor: "Client or system"
        preconditions: []
        side_effects: []

  - entity: Session
    field: status
    initial_state: TENTATIVE
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: TENTATIVE
        to: CONFIRMED
        trigger: "POST /api/sessions/{id}/confirm"
        actor: CastingDirector
        preconditions:
          - "Studio.status == OPEN"
          - "No overlapping CONFIRMED session for Studio (half-open interval)"
          - "No overlapping CONFIRMED session for Talent (half-open interval)"
          - "If session_kind == PICKUP: project already has at least one COMPLETED PRIMARY session"
          - "If session_kind == RETAKE: project has Delivery.revision_requested == true"
        side_effects:
          - "If this is the project's first CONFIRMED session and Project.status == CAST: Project → IN_SESSION"

      - from: [TENTATIVE, CONFIRMED]
        to: COMPLETED
        trigger: "POST /api/sessions/{id}/complete"
        actor: StudioEngineer
        preconditions:
          - "clock.current_utc >= Session.end_at"
        side_effects:
          - "If session_kind == PRIMARY or RETAKE: generate SESSION_FEE Invoice (PENDING) when project delivers"
          - "If session_kind == PICKUP: generate PICKUP_FEE Invoice (PENDING) immediately"

      - from: [TENTATIVE, CONFIRMED]
        to: CANCELLED
        trigger: "POST /api/sessions/{id}/cancel OR system (project cancelled)"
        actor: "CastingDirector or system"
        preconditions:
          - "Manual cancel: clock.current_utc < Session.start_at"
        side_effects: []

  - entity: Invoice
    field: status
    initial_state: PENDING
    terminal_states: [PAID, VOID]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "system (Project DELIVERED→CLOSED) OR POST /api/invoices/{id}/issue"
        actor: "system or Agent"
        preconditions: []
        side_effects:
          - "issued_at ← clock.current_utc"

      - from: ISSUED
        to: PAID
        trigger: "POST /api/invoices/{id}/mark_paid"
        actor: Agent
        preconditions: []
        side_effects: []

      - from: PENDING
        to: VOID
        trigger: "system (project cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ConflictExclusion
    field: status
    initial_state: ACTIVE
    terminal_states: [RELEASED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "system (project cancelled) OR POST /api/conflict_exclusions/{id}/release"
        actor: "system or CastingDirector"
        preconditions: []
        side_effects:
          - "Remove product_category from Talent.active_conflict_categories if no other ACTIVE exclusion covers it"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock.current_utc >= ends_at, evaluated lazily on read AND on every cast attempt)"
        actor: system
        preconditions: []
        side_effects:
          - "Remove product_category from Talent.active_conflict_categories if no other ACTIVE exclusion covers it"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: talent-roster-update-stale-version
    parent_entity: Talent
    write_endpoint: "PUT /api/talents/{id}"
    occ_field: "expected_talent_version"
    description: |
      Updating a Talent whose version has advanced since the client last
      observed it is rejected. Captures the case where another writer just
      updated the roster entry (e.g., fee change) and the current writer's
      view of the talent is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: project-cancel-stale-version
    parent_entity: Project
    write_endpoint: "POST /api/projects/{id}/cancel"
    occ_field: "expected_project_version"
    description: |
      Cancelling a Project whose version has advanced since the client last
      observed it is rejected. Captures the case where another writer has
      just mutated the project (e.g., confirmed a session) and the
      cancellation request is based on stale state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: buyout_quote
    trigger: "Project DRAFT → CASTING (open_casting)"
    algorithm: tiered_pricing
    formula: |
      # Provisional quote at CASTING entry, used for budgeting.
      # Union multiplier: UNION=1.00, FICORE=1.00, NON_UNION=0.85 (uses UNION as default since talent unknown).
      base = UNION_SCALE_SESSION_FEE_CENTS  # 65000
      usage_mult = { BROADCAST: 2.50, DIGITAL: 1.50, TERM: 1.00 + 0.10 * term_months }[Project.usage_type]
      spot_mult = 1.00 + 0.20 * max(0, Project.spots_count - 1)
      quote = round_half_up(base * usage_mult * spot_mult)
    input_set: "Project fields only (talent unknown at CASTING entry); UNION scale assumed"
    constants:
      UNION_SCALE_SESSION_FEE_CENTS: 65000
    precision: "integer cents, round_half_up"
    variants: []

  - name: buyout_final
    trigger: "Project CASTING → CAST (select_talent)"
    algorithm: tiered_pricing
    formula: |
      # Final buyout, computed once talent is known.
      # Round per line item then sum — the order matters (mode b of combinatorial_formula).
      # line_item_1 = talent.base_session_fee_cents * usage_mult
      # line_item_2 = line_item_1 * (spot_mult - 1)  [incremental spot uplift]
      # total = round_half_up(line_item_1) + round_half_up(line_item_2)
      usage_mult = { BROADCAST: 2.50, DIGITAL: 1.50, TERM: 1.00 + 0.10 * term_months }[Project.usage_type]
      spot_mult = 1.00 + 0.20 * max(0, Project.spots_count - 1)
      union_mult = { UNION: 1.00, FICORE: 1.00, NON_UNION: 0.85 }[Talent.union_status]
      line1 = Talent.base_session_fee_cents * usage_mult * union_mult
      line2 = line1 * (spot_mult - 1.00)
      total = round_half_up(line1) + round_half_up(line2)
    input_set: "Project + selected Talent fields"
    constants:
      BROADCAST_MULT: 2.50
      DIGITAL_MULT: 1.50
      TERM_BASE: 1.00
      TERM_PER_MONTH: 0.10
      SPOT_UPLIFT_PER_EXTRA: 0.20
      NON_UNION_DISCOUNT: 0.85
    precision: "integer cents, round_half_up per line item then sum"

  - name: agent_commission
    trigger: "UsageTerms row creation at CAST"
    algorithm: waterfall_allocation
    formula: |
      # Agent commission depends on talent union status AND volume tier of the buyout.
      # Tier 1: buyout_final_cents <  500000 → 10%
      # Tier 2: 500000 <= buyout_final_cents < 1500000 → 15%
      # Tier 3: buyout_final_cents >= 1500000 → 20%
      # Union talents get a 2-point reduction (minimum 5% floor).
      base_pct = tier_pct(buyout_final_cents)
      if Talent.union_status == UNION:
        pct = max(0.05, base_pct - 0.02)
      else:
        pct = base_pct
      agent_commission_cents = round_half_up(buyout_final_cents * pct)
      talent_payout_cents = buyout_final_cents - agent_commission_cents
    input_set: "Project.buyout_final_cents + Talent.union_status"
    constants:
      TIER1_MAX_CENTS: 500000
      TIER2_MAX_CENTS: 1500000
      TIER1_PCT: 0.10
      TIER2_PCT: 0.15
      TIER3_PCT: 0.20
      UNION_REDUCTION: 0.02
      FLOOR_PCT: 0.05
    precision: "integer cents, round_half_up"

  - name: session_fee_provisional_vs_final
    trigger: "Session COMPLETED"
    algorithm: threshold
    formula: |
      # Session fee has two variants (dual_variant_calc on a different entity domain than buyout):
      #   provisional (quoted at booking): duration_hours rounded UP to nearest 15min block,
      #     billed at Studio.hourly_rate_cents
      #   final (at completion): actual elapsed from start_at to completed_at,
      #     15-minute minimum, then 5-minute granularity rounding, plus 25% directed_patch surcharge
      # The two variants can produce different totals for identical bookings.
      provisional_hours = ceil(duration_minutes / 15) * 15 / 60
      provisional_total = Studio.hourly_rate_cents * provisional_hours
      # final:
      elapsed_minutes = (completed_at - start_at).total_minutes()
      billed_minutes = max(15, ceil(elapsed_minutes / 5) * 5)
      final_total = Studio.hourly_rate_cents * (billed_minutes / 60)
      if Session.directed_patch:
        final_total = round_half_up(final_total * 1.25)
    input_set: "Session + Studio"
    constants:
      MIN_BILLED_MINUTES: 15
      PROVISIONAL_BLOCK_MINUTES: 15
      FINAL_GRANULARITY_MINUTES: 5
      DIRECTED_PATCH_SURCHARGE: 0.25
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "Session created (TENTATIVE); used for budget display"
        difference: "Rounds duration_minutes UP to 15-min blocks; no patch surcharge"
      - name: final
        when: "Session transitions to COMPLETED"
        difference: "Uses actual elapsed time, 15-min minimum, 5-min granularity, applies 25% patch surcharge"

  - name: talent_active_conflict_categories
    trigger: "ConflictExclusion transitions (create, release, expire)"
    algorithm: aggregation
    formula: |
      # Derived array on Talent; recomputed on any ConflictExclusion change.
      # Include only rows with status == ACTIVE AND starts_at <= clock.current_utc < ends_at.
      # Sorted ascending by ends_at, tie-break by created_at ASC (never id).
      active = [ ce.product_category
                 for ce in ConflictExclusion.where(talent_id=Talent.id, status=ACTIVE)
                 if ce.starts_at <= clock.current_utc < ce.ends_at ]
      talent.active_conflict_categories = sorted_unique(active, order_by=(ce.ends_at ASC, ce.created_at ASC))
    input_set: "ConflictExclusion rows for the talent with status ACTIVE and current-utc within [starts_at, ends_at)"
    precision: "set semantics, deterministic ordering"

  - name: revision_window_closure
    trigger: "Delivery creation"
    algorithm: forward_looking
    formula: |
      revision_window_closes_at = delivered_at + 72 hours
      # Boundary precision (>= vs >): a revision request at exactly
      # delivered_at + 72h IS still allowed (window closes AFTER that instant).
      # Rule: request accepted iff clock.current_utc <= revision_window_closes_at.
    input_set: "Delivery.delivered_at"
    constants:
      REVISION_WINDOW_HOURS: 72
    precision: "ISO8601 UTC, second precision"

  - name: session_overlap_check
    trigger: "Session POST and POST /confirm"
    algorithm: interval_merge
    formula: |
      # Half-open interval overlap: [s1, e1) collides with [s2, e2) iff s1 < e2 AND s2 < e1.
      # Adjacent sessions (e1 == s2) do NOT collide — buffer is zero.
      # Applies independently per Studio and per Talent.
      collision(existing, new) = existing.start_at < new.end_at AND new.start_at < existing.end_at
    input_set: "All CONFIRMED sessions sharing Studio.id (or Talent.id) with the new session"
    precision: "ISO8601 UTC, minute precision"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /api/_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Referenced resources exist (path ids then body FKs, left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 4
    category: existence
    check: "Ownership match — entity-backed role's id must equal the resource's owner FK (e.g., Client acting on own Project, Talent on own SelfAudition)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "endpoints with ownership semantics"

  - priority: 5
    category: state
    check: "Target resource in valid state for requested transition (includes: session creation requires Project.status IN {CAST}; self_audition creation requires Project.status == CASTING; shortlist/reject requires Project.status == CASTING; delivery requires Project.status == IN_SESSION)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state transition endpoints"

  - priority: 6
    category: business_temporal
    check: "Temporal preconditions: audition_deadline in future at open_casting; clock within revision window at request_revision; clock >= end_at at complete; clock < start_at at cancel"
    error_id: ERR_TEMPORAL_VIOLATION
    http_status: 422
    applies_to: "time-gated transitions"

  - priority: 7
    category: business_safety
    check: "Conflict/exclusivity: talent has no overlapping ACTIVE ConflictExclusion in the project's product_category when exclusivity_required=true"
    error_id: ERR_TALENT_CONFLICT
    http_status: 409
    applies_to: "POST /api/projects/{id}/select_talent"

  - priority: 8
    category: business_constraint
    check: "Resource overlap: no CONFIRMED session overlaps [start_at, end_at) for the same Studio or same Talent"
    error_id: ERR_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /api/projects/{id}/sessions, POST /api/sessions/{id}/confirm"

  - priority: 9
    category: business_constraint
    check: "Directed patch capability: Studio.has_directed_patch must be true when session.directed_patch=true"
    error_id: ERR_PATCH_NOT_SUPPORTED
    http_status: 422
    applies_to: "POST /api/projects/{id}/sessions"

  - priority: 10
    category: business_constraint
    check: "Uniqueness: Talent.email and Client.contact_email must be unique; at most one UsageTerms row per Project; a SelfAudition must be unique per (project_id, talent_id)"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /api/talents, POST /api/clients, POST /api/projects/{id}/self_auditions"

  - priority: 11
    category: business_constraint
    check: "Enum & shape: valid enum members, term_months present iff usage_type=TERM, duration_minutes >= 15, spots_count >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "creation endpoints"

  - priority: 12
    category: business_referential
    check: "Pickup/retake preconditions: PICKUP requires an existing COMPLETED PRIMARY session; RETAKE requires Delivery.revision_requested=true"
    error_id: ERR_PICKUP_PREREQUISITE
    http_status: 422
    applies_to: "POST /api/sessions/{id}/confirm"

  - priority: 13
    category: business_fiscal
    check: "Project cannot transition to CAST with buyout_final_cents <= 0; UsageTerms broadcast_regions non-empty iff usage_type=BROADCAST"
    error_id: ERR_FISCAL_INVALID
    http_status: 422
    applies_to: "POST /api/projects/{id}/select_talent, PUT /api/projects/{id}/usage_terms"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Advance the logical clock. Startup default is 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: ClockState
    side_effects:
      - "ClockState.current_utc ← to_iso8601 (must be strictly monotonically increasing)"
      - "Lazily expire ACTIVE ConflictExclusion rows whose ends_at <= new clock"

  # --- Talents ---
  - method: POST
    path: "/api/talents"
    description: "Register a new talent"
    roles: [CastingDirector]
    code: 201
    input: [stage_name, email, voice_profile, languages, union_status, base_session_fee_cents]
    output: Talent
    side_effects: ["roster_status=ACTIVE"]

  - method: GET
    path: "/api/talents/{id}"
    description: "Get talent"
    roles: [CastingDirector, Client, Talent, Agent]
    code: 200
    input: []
    output: Talent
    side_effects: []

  - method: GET
    path: "/api/talents"
    description: "List talents, filterable by voice_profile, union_status, roster_status"
    roles: [CastingDirector, Client]
    code: 200
    input: ["voice_profile?", "union_status?", "roster_status?", "limit?", "offset?"]
    output: Talent[]
    side_effects: []

  - method: PUT
    path: "/api/talents/{id}"
    description: "Update roster entry (OCC via expected_talent_version)"
    roles: [CastingDirector]
    code: 200
    input: ["stage_name?", "base_session_fee_cents?", "roster_status?", expected_talent_version]
    output: Talent
    side_effects: ["increments Talent.version by 1"]

  - method: GET
    path: "/api/talents/{id}/conflict_exclusions"
    description: "List conflict exclusions for a talent (FK reverse-reachability)"
    roles: [CastingDirector, Client, Talent, Agent]
    code: 200
    input: []
    output: ConflictExclusion[]
    side_effects: []

  # --- Clients ---
  - method: POST
    path: "/api/clients"
    description: "Register a client"
    roles: [CastingDirector]
    code: 201
    input: [company_name, contact_email, billing_email, "default_currency?"]
    output: Client
    side_effects: ["account_status=ACTIVE"]

  - method: GET
    path: "/api/clients/{id}"
    description: "Get client"
    roles: [CastingDirector, Client, Agent]
    code: 200
    input: []
    output: Client
    side_effects: []

  # --- Projects ---
  - method: POST
    path: "/api/projects"
    description: "Create a project (DRAFT)"
    roles: [Client]
    code: 201
    input: [client_id, title, product_category, usage_type, "term_months?", spots_count, "exclusivity_required?", brief_text, audition_deadline]
    output: Project
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/api/projects/{id}"
    description: "Get project"
    roles: [CastingDirector, Client, Talent, Agent]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: GET
    path: "/api/projects"
    description: "List projects, filterable by client_id, selected_talent_id and status"
    roles: [CastingDirector, Client, Agent]
    code: 200
    input: ["client_id?", "selected_talent_id?", "status?", "limit?", "offset?"]
    output: Project[]
    side_effects: []

  - method: POST
    path: "/api/projects/{id}/open_casting"
    description: "Move project DRAFT → CASTING"
    roles: [CastingDirector]
    code: 200
    input: []
    output: Project
    side_effects: ["compute buyout_quote_cents"]

  - method: POST
    path: "/api/projects/{id}/select_talent"
    description: "Choose a SelfAudition → CAST"
    roles: [Client]
    code: 200
    input: [self_audition_id]
    output: Project
    side_effects:
      - "compute buyout_final_cents; create UsageTerms; create ConflictExclusion if exclusivity_required"
      - "sibling auditions REJECTED"

  - method: POST
    path: "/api/projects/{id}/cancel"
    description: "Cancel project (OCC via expected_project_version)"
    roles: [Client]
    code: 200
    input: [expected_project_version]
    output: Project
    side_effects:
      - "increments Project.version by 1"
      - "cascade: reject auditions, cancel tentative sessions, release conflicts, void pending invoices"

  - method: POST
    path: "/api/projects/{id}/close"
    description: "Client-accept delivery → CLOSED"
    roles: [Client]
    code: 200
    input: []
    output: Project
    side_effects: ["issue pending invoices"]

  - method: POST
    path: "/api/projects/{id}/request_revision"
    description: "Within 72h of delivery, revert project DELIVERED → CAST for retake"
    roles: [Client]
    code: 200
    input: []
    output: Project
    side_effects: ["Delivery.revision_requested ← true"]

  # --- SelfAuditions ---
  - method: POST
    path: "/api/projects/{id}/self_auditions"
    description: "Talent self-submits audition"
    roles: [Talent]
    code: 201
    input: [talent_id, audio_file_url, "slate_text?"]
    output: SelfAudition
    side_effects: ["status=SUBMITTED, submitted_at=clock"]

  - method: GET
    path: "/api/projects/{id}/self_auditions"
    description: "List auditions for a project"
    roles: [CastingDirector, Client]
    code: 200
    input: []
    output: SelfAudition[]
    side_effects: []

  - method: GET
    path: "/api/self_auditions"
    description: "List auditions, filterable by talent_id"
    roles: [CastingDirector, Client, Talent]
    code: 200
    input: ["talent_id?", "limit?", "offset?"]
    output: SelfAudition[]
    side_effects: []

  - method: GET
    path: "/api/self_auditions/{id}"
    description: "Get audition"
    roles: [CastingDirector, Client, Talent]
    code: 200
    input: []
    output: SelfAudition
    side_effects: []

  - method: POST
    path: "/api/self_auditions/{id}/shortlist"
    description: "Shortlist an audition"
    roles: [Client]
    code: 200
    input: []
    output: SelfAudition
    side_effects: []

  - method: POST
    path: "/api/self_auditions/{id}/reject"
    description: "Reject an audition"
    roles: [Client]
    code: 200
    input: []
    output: SelfAudition
    side_effects: []

  # --- Studios ---
  - method: POST
    path: "/api/studios"
    description: "Register a studio"
    roles: [CastingDirector]
    code: 201
    input: [studio_name, location, has_directed_patch, hourly_rate_cents, operating_tz]
    output: Studio
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/api/studios/{id}"
    description: "Get studio"
    roles: [CastingDirector, Client, StudioEngineer]
    code: 200
    input: []
    output: Studio
    side_effects: []

  # --- Sessions ---
  - method: POST
    path: "/api/projects/{id}/sessions"
    description: "Create a session (TENTATIVE)"
    roles: [CastingDirector]
    code: 201
    input: [studio_id, session_kind, directed_patch, start_at, duration_minutes]
    output: Session
    side_effects: ["talent_id denormalized from Project.selected_talent_id"]

  - method: GET
    path: "/api/projects/{id}/sessions"
    description: "List sessions for a project"
    roles: [CastingDirector, Client, Talent, StudioEngineer]
    code: 200
    input: []
    output: Session[]
    side_effects: []

  - method: GET
    path: "/api/sessions"
    description: "List sessions, filterable by talent_id and studio_id"
    roles: [CastingDirector, Client, Talent, StudioEngineer]
    code: 200
    input: ["talent_id?", "studio_id?", "limit?", "offset?"]
    output: Session[]
    side_effects: []

  - method: GET
    path: "/api/sessions/{id}"
    description: "Get session"
    roles: [CastingDirector, Client, Talent, StudioEngineer]
    code: 200
    input: []
    output: Session
    side_effects: []

  - method: POST
    path: "/api/sessions/{id}/confirm"
    description: "Confirm a tentative session"
    roles: [CastingDirector]
    code: 200
    input: []
    output: Session
    side_effects: ["overlap re-checked; Project may → IN_SESSION"]

  - method: POST
    path: "/api/sessions/{id}/complete"
    description: "Mark session completed (after end_at)"
    roles: [StudioEngineer]
    code: 200
    input: []
    output: Session
    side_effects: ["may generate PICKUP_FEE invoice immediately for PICKUP sessions"]

  - method: POST
    path: "/api/sessions/{id}/cancel"
    description: "Cancel a session (before start_at)"
    roles: [CastingDirector]
    code: 200
    input: []
    output: Session
    side_effects: []

  # --- UsageTerms ---
  - method: GET
    path: "/api/projects/{id}/usage_terms"
    description: "Get the usage terms for a project (1:1, array of 0–1)"
    roles: [CastingDirector, Client, Agent]
    code: 200
    input: []
    output: UsageTerms[]
    side_effects: []

  - method: PUT
    path: "/api/projects/{id}/usage_terms"
    description: "Edit usage terms (only before locked_at_cast=true)"
    roles: [Client]
    code: 200
    input: ["broadcast_regions?", "digital_placements?"]
    output: UsageTerms
    side_effects: []

  # --- Deliveries ---
  - method: POST
    path: "/api/projects/{id}/deliveries"
    description: "Deliver final files → project DELIVERED"
    roles: [StudioEngineer]
    code: 201
    input: [session_id, file_url]
    output: Delivery
    side_effects: ["create Delivery; compute revision_window_closes_at; generate BUYOUT + SESSION_FEE invoices"]

  - method: GET
    path: "/api/projects/{id}/deliveries"
    description: "List deliveries for a project"
    roles: [CastingDirector, Client, StudioEngineer]
    code: 200
    input: []
    output: Delivery[]
    side_effects: []

  - method: GET
    path: "/api/deliveries"
    description: "List deliveries, filterable by session_id"
    roles: [CastingDirector, Client, StudioEngineer]
    code: 200
    input: ["session_id?", "limit?", "offset?"]
    output: Delivery[]
    side_effects: []

  - method: GET
    path: "/api/deliveries/{id}"
    description: "Get delivery"
    roles: [CastingDirector, Client, StudioEngineer]
    code: 200
    input: []
    output: Delivery
    side_effects: []

  # --- Invoices ---
  - method: GET
    path: "/api/projects/{id}/invoices"
    description: "List invoices for a project"
    roles: [CastingDirector, Client, Agent, Talent]
    code: 200
    input: []
    output: Invoice[]
    side_effects: []

  - method: GET
    path: "/api/invoices/{id}"
    description: "Get invoice"
    roles: [CastingDirector, Client, Agent, Talent]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/api/invoices/{id}/issue"
    description: "Issue a pending invoice"
    roles: [Agent]
    code: 200
    input: []
    output: Invoice
    side_effects: ["issued_at ← clock"]

  - method: POST
    path: "/api/invoices/{id}/mark_paid"
    description: "Mark issued invoice paid"
    roles: [Agent]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  # --- Conflict Exclusions ---
  - method: GET
    path: "/api/conflict_exclusions/{id}"
    description: "Get conflict exclusion"
    roles: [CastingDirector, Client, Talent, Agent]
    code: 200
    input: []
    output: ConflictExclusion
    side_effects: []

  - method: POST
    path: "/api/conflict_exclusions/{id}/release"
    description: "Manually release an ACTIVE exclusion"
    roles: [CastingDirector]
    code: 200
    input: []
    output: ConflictExclusion
    side_effects: ["update Talent.active_conflict_categories"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Entity-backed role's id does not match resource owner FK" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in valid state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match current resource version (OCC)" }
  - { id: ERR_TEMPORAL_VIOLATION, http: 422, condition: "Clock-based precondition failed (deadline past, window closed, session not yet ended, cancel too late)" }
  - { id: ERR_TALENT_CONFLICT, http: 409, condition: "Talent has overlapping ACTIVE ConflictExclusion in the requested product_category" }
  - { id: ERR_SESSION_OVERLAP, http: 409, condition: "CONFIRMED session overlaps [start_at, end_at) for the same Studio or Talent" }
  - { id: ERR_PATCH_NOT_SUPPORTED, http: 422, condition: "directed_patch=true but Studio.has_directed_patch=false" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Uniqueness violation (email, project+talent audition, single UsageTerms per project)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Schema/enum/shape validation failed" }
  - { id: ERR_PICKUP_PREREQUISITE, http: 422, condition: "PICKUP requires completed PRIMARY; RETAKE requires revision_requested=true" }
  - { id: ERR_FISCAL_INVALID, http: 422, condition: "Buyout computed non-positive, or usage-terms payload inconsistent with usage_type" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CastingDirector
    description: "Agency casting director; manages roster, projects, studios, sessions"
    identity: opaque
    exclusive_operations:
      - "POST /api/talents, PUT /api/talents/{id}"
      - "POST /api/clients"
      - "POST /api/studios"
      - "POST /api/projects/{id}/open_casting"
      - "POST /api/projects/{id}/sessions"
      - "POST /api/sessions/{id}/confirm, POST /api/sessions/{id}/cancel"
      - "POST /api/conflict_exclusions/{id}/release"
    shared_operations:
      - "GET endpoints across the graph"

  - name: Client
    description: "Brand/agency client; owns projects, selects talent, accepts deliveries"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /api/projects"
      - "POST /api/projects/{id}/select_talent, cancel, close, request_revision"
      - "POST /api/self_auditions/{id}/shortlist, reject"
      - "PUT /api/projects/{id}/usage_terms"
    shared_operations:
      - "GET /api/talents, GET /api/projects, GET project children"

  - name: Talent
    description: "Voiceover artist; submits auditions"
    identity: "entity_backed:Talent"
    exclusive_operations:
      - "POST /api/projects/{id}/self_auditions"
    shared_operations:
      - "GET /api/talents/{id}, GET /api/sessions/{id}, GET /api/projects/{id}/invoices"

  - name: StudioEngineer
    description: "Studio operator; confirms completion and delivers files"
    identity: opaque
    exclusive_operations:
      - "POST /api/sessions/{id}/complete"
      - "POST /api/projects/{id}/deliveries"
    shared_operations:
      - "GET /api/studios/{id}, GET /api/sessions/{id}, GET project children"

  - name: Agent
    description: "Agency finance rep; issues and settles invoices"
    identity: opaque
    exclusive_operations:
      - "POST /api/invoices/{id}/issue, mark_paid"
    shared_operations:
      - "GET /api/projects/{id}/invoices, GET /api/invoices/{id}"

  - name: PlatformAdmin
    description: "Operator; clock management only"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
    shared_operations: []
