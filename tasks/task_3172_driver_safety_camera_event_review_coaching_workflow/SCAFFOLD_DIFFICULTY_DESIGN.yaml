# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3172_driver_safety_camera_event_review_coaching_workflow
# 9 rules x 2 instances = 18 instances. Every instance grounds in SCAFFOLD.yaml
# §1.1–§1.7 and replays from empty-DB through §1.5 endpoints only.
#
# Shared base anchors (defined in the first instance, aliased later):
#   clock at 2026-09-01T00:00:00Z; fleet (budget 1000000c); terminal; driver
#   (E-1001, consent true); HIGH-tier vehicle; ACTIVE policy (cap 100 MB,
#   inward enabled, all detections on, retention 30/180d).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: driver_score_provisional_vs_final_diverge
        grounds:
          - calculations.driver_safety_score
          - entities.Driver.fields.safety_score_provisional
          - entities.Driver.fields.safety_score_final
        distinguishing_aspect: |
          Entity domain = Driver scoring. Provisional counts IN_REVIEW events,
          final counts only CONFIRMED: one HIGH event still IN_REVIEW plus one
          MEDIUM event CONFIRMED yield provisional 77.50 but final 92.50 for
          identical underlying data.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; base fleet/terminal/driver/vehicle/policy up; one HIGH event IN_REVIEW and one MEDIUM event CONFIRMED, both fresh (age factor 1.00)."
          setup_api_calls:
            - &k_clock
              call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &k_fleet
              call: "POST /api/fleets"
              payload: { name: "Blue Ridge Freight", incentive_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { fleet_id: $.data.id }
            - &k_term
              call: "POST /api/terminals"
              payload: { fleet_id: "${fleet_id}", name: "Knoxville Depot", region_code: "TN" }
              as: PlatformAdmin
              captures: { term_id: $.data.id }
            - &k_drv
              call: "POST /api/drivers"
              payload: { terminal_id: "${term_id}", employee_ref: "E-1001", name: "Dana Ruiz", hire_date: "2024-03-01T00:00:00Z", inward_camera_consent: true }
              as: PlatformAdmin
              captures: { drv_id: $.data.id }
            - &k_veh
              call: "POST /api/vehicles"
              payload: { terminal_id: "${term_id}", vin: "1HGCM82633A004352", camera_unit_id: "CAM-77", bandwidth_tier: "HIGH" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id }
            - &k_pol
              call: "POST /api/camera-policies"
              payload: { fleet_id: "${fleet_id}", name: "Standard Policy", retention_days_standard: 30, retention_days_collision: 180, daily_upload_cap_mb: 100, inward_capture_enabled: true, distraction_detection_enabled: true, seatbelt_detection_enabled: true, effective_from: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - &k_pol_act
              call: "POST /api/camera-policies/${pol_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "HARSH_BRAKE", severity: "HIGH", occurred_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { ev_a: $.data.id }
            - call: "POST /api/footage-clips"
              payload: { event_id: "${ev_a}", camera_angle: "FORWARD", size_mb: 5, captured_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { cl_a: $.data.id }
            - call: "POST /api/footage-clips/${cl_a}/upload-begin"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/footage-clips/${cl_a}/upload-complete"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "FOLLOWING_DISTANCE", severity: "MEDIUM", occurred_at: "2026-08-31T00:00:00Z" }
              as: TelematicsIngest
              captures: { ev_b: $.data.id }
            - call: "POST /api/footage-clips"
              payload: { event_id: "${ev_b}", camera_angle: "FORWARD", size_mb: 5, captured_at: "2026-08-31T00:00:00Z" }
              as: TelematicsIngest
              captures: { cl_b: $.data.id }
            - call: "POST /api/footage-clips/${cl_b}/upload-begin"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/footage-clips/${cl_b}/upload-complete"
              payload: {}
              as: TelematicsIngest
            - call: "GET /api/safety-events/${ev_b}"
              payload: {}
              as: SafetyManager
              captures: { ev_b_v: $.data.version }
            - call: "POST /api/safety-events/${ev_b}/review"
              payload: { action: "CONFIRM", rationale: "clear tailgating", expected_event_version: "${ev_b_v}" }
              as: SafetyManager
              as_user_id: "sm-1"
          trigger:
            - call: "GET /api/drivers/${drv_id}"
              payload: {}
              as: SafetyManager
          assert:
            - "Driver.${drv_id}.safety_score_provisional == 77.50  (100 - 15.00 HIGH in review - 7.50 MEDIUM confirmed)"
            - "Driver.${drv_id}.safety_score_final == 92.50  (only the CONFIRMED MEDIUM counts)"
            - "Driver.${drv_id}.safety_score_provisional != Driver.${drv_id}.safety_score_final"
            - "Driver.${drv_id}.confirmed_events_90d == 1"

      - name: incentive_projection_vs_final_repricing
        grounds:
          - calculations.incentive_pricing
          - entities.IncentiveAward.fields.amount_cents
          - entities.SafetyScoreSnapshot.fields.status
        distinguishing_aspect: |
          Entity domain = IncentiveAward pricing (distinct from Driver scoring).
          A PROJECTED award priced off the provisional score (85.00, BRONZE,
          10000c) is repriced in place to GOLD 50000c when the FINAL snapshot
          excludes the dismissed IN_REVIEW event and scores 100.00.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; base setup; one HIGH event IN_REVIEW (provisional 85.00, final unaffected); a PROVISIONAL driver snapshot and its PROJECTED award exist."
          setup_api_calls:
            - *k_clock
            - *k_fleet
            - *k_term
            - *k_drv
            - *k_veh
            - *k_pol
            - *k_pol_act
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "DISTRACTION", severity: "HIGH", occurred_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { ev_c: $.data.id }
            - call: "POST /api/footage-clips"
              payload: { event_id: "${ev_c}", camera_angle: "FORWARD", size_mb: 5, captured_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { cl_c: $.data.id }
            - call: "POST /api/footage-clips/${cl_c}/upload-begin"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/footage-clips/${cl_c}/upload-complete"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/fleets/${fleet_id}/score-snapshots/compute"
              payload: { scope_type: "DRIVER", scope_id: "${drv_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z", finalize: false }
              as: FleetAdmin
              captures: { snap_prov: $.data.id }
            - call: "GET /api/drivers/${drv_id}/incentive-awards"
              payload: {}
              as: FleetAdmin
              captures: { award_id: "$.data[0].id" }
            - call: "GET /api/safety-events/${ev_c}"
              payload: {}
              as: SafetyManager
              captures: { ev_c_v: $.data.version }
            - call: "POST /api/safety-events/${ev_c}/review"
              payload: { action: "DISMISS", rationale: "false positive from reflection", expected_event_version: "${ev_c_v}" }
              as: SafetyManager
              as_user_id: "sm-1"
          trigger:
            - call: "POST /api/fleets/${fleet_id}/score-snapshots/compute"
              payload: { scope_type: "DRIVER", scope_id: "${drv_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z", finalize: true }
              as: FleetAdmin
              captures: { snap_final: $.data.id }
          assert:
            - "SafetyScoreSnapshot.${snap_prov}.status == PROVISIONAL and score == 85.00"
            - "SafetyScoreSnapshot.${snap_final}.status == FINAL and score == 100.00"
            - "IncentiveAward.${award_id}.amount_cents == 50000 and tier == GOLD and status == PROJECTED"
            - "IncentiveAward.${award_id}.snapshot_id == ${snap_final}  (repriced in place from the FINAL snapshot)"
            - "GET /api/score-snapshots/${snap_prov}/incentive-awards returns 0 rows (the award no longer references the PROVISIONAL snapshot)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: upload_priority_combinatorial
        grounds:
          - calculations.upload_priority_score
          - entities.SafetyEvent.fields.upload_priority_score
        distinguishing_aspect: |
          Mode (a): severity weight x age-step x bandwidth-tier multiplier with a
          COLLISION conditional boost — a CRITICAL COLLISION on a HIGH-tier
          vehicle aged 3h scores 1120 (10*4*3 + 1000) while a LOW HARSH_BRAKE
          on a LOW-tier vehicle aged 72h scores 1 (1*1*1).
        test_recipe:
          setup:
            - "Logical clock 2026-08-30T00:00:00Z; base setup plus a second LOW-tier vehicle; two events ingested with different severity/type/tier/age combinations."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T00:00:00Z" }
              as: PlatformAdmin
            - *k_fleet
            - *k_term
            - *k_drv
            - *k_veh
            - *k_pol
            - *k_pol_act
            - call: "POST /api/vehicles"
              payload: { terminal_id: "${term_id}", vin: "5YJSA1E26HF122334", camera_unit_id: "CAM-12", bandwidth_tier: "LOW" }
              as: PlatformAdmin
              captures: { veh_low: $.data.id }
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "COLLISION", severity: "CRITICAL", occurred_at: "2026-08-29T21:00:00Z" }
              as: TelematicsIngest
              captures: { ev_hi: $.data.id }
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_low}", event_type: "HARSH_BRAKE", severity: "LOW", occurred_at: "2026-08-27T00:00:00Z" }
              as: TelematicsIngest
              captures: { ev_lo: $.data.id }
          trigger:
            - call: "GET /api/fleets/${fleet_id}/safety-events"
              payload: {}
              as: SafetyManager
          assert:
            - "SafetyEvent.${ev_hi}.upload_priority_score == 1120  (CRITICAL 10 x age_step 4 x HIGH tier 3 + COLLISION_BOOST 1000)"
            - "SafetyEvent.${ev_lo}.upload_priority_score == 1  (LOW 1 x age_step 1 x LOW tier 1, no boost)"
            - "the review queue lists ${ev_hi} before ${ev_lo} (score DESC ordering)"
            - "SafetyEvent.${ev_hi}.status == DETECTED and SafetyEvent.${ev_lo}.status == DETECTED"

      - name: per_event_rounding_then_sum_pinned
        grounds:
          - calculations.driver_safety_score
          - entities.Driver.fields.safety_score_final
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — two aged LOW events each
          contribute round_half_up(1 x 2.5 x 0.33, 2) = 0.83; rounding per event
          then summing yields total 1.66 (score 98.34), while sum-then-round
          yields 1.65 (score 98.35). The scaffold pins 98.34.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; base setup; two LOW events occurred 2026-07-15T00:00:00Z (48 days old -> aged factor 0.33), both CONFIRMED (2 confirmed < 3, so no escalation)."
          setup_api_calls:
            - *k_clock
            - *k_fleet
            - *k_term
            - *k_drv
            - *k_veh
            - *k_pol
            - *k_pol_act
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "SEAT_BELT", severity: "LOW", occurred_at: "2026-07-15T00:00:00Z" }
              as: TelematicsIngest
              captures: { ev_r1: $.data.id }
            - call: "POST /api/footage-clips"
              payload: { event_id: "${ev_r1}", camera_angle: "FORWARD", size_mb: 5, captured_at: "2026-07-15T00:00:00Z" }
              as: TelematicsIngest
              captures: { cl_r1: $.data.id }
            - call: "POST /api/footage-clips/${cl_r1}/upload-begin"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/footage-clips/${cl_r1}/upload-complete"
              payload: {}
              as: TelematicsIngest
            - call: "GET /api/safety-events/${ev_r1}"
              payload: {}
              as: SafetyManager
              captures: { ev_r1_v: $.data.version }
            - call: "POST /api/safety-events/${ev_r1}/review"
              payload: { action: "CONFIRM", rationale: "belt unfastened", expected_event_version: "${ev_r1_v}" }
              as: SafetyManager
              as_user_id: "sm-1"
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "SEAT_BELT", severity: "LOW", occurred_at: "2026-07-15T12:00:00Z" }
              as: TelematicsIngest
              captures: { ev_r2: $.data.id }
            - call: "POST /api/footage-clips"
              payload: { event_id: "${ev_r2}", camera_angle: "FORWARD", size_mb: 5, captured_at: "2026-07-15T12:00:00Z" }
              as: TelematicsIngest
              captures: { cl_r2: $.data.id }
            - call: "POST /api/footage-clips/${cl_r2}/upload-begin"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/footage-clips/${cl_r2}/upload-complete"
              payload: {}
              as: TelematicsIngest
            - call: "GET /api/safety-events/${ev_r2}"
              payload: {}
              as: SafetyManager
              captures: { ev_r2_v: $.data.version }
            - call: "POST /api/safety-events/${ev_r2}/review"
              payload: { action: "CONFIRM", rationale: "belt unfastened again", expected_event_version: "${ev_r2_v}" }
              as: SafetyManager
              as_user_id: "sm-1"
          trigger:
            - call: "GET /api/drivers/${drv_id}"
              payload: {}
              as: SafetyManager
          assert:
            - "Driver.${drv_id}.safety_score_final == 98.34  (0.83 + 0.83 = 1.66; per-event rounding first)"
            - "Driver.${drv_id}.safety_score_final != 98.35  (the sum-then-round order is rejected)"
            - "Driver.${drv_id}.confirmed_events_90d == 2"
            - "Driver.${drv_id}.status == ACTIVE  (2 confirmations do not trigger the escalation threshold)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: event_reclassify_reopen_cycle
        grounds:
          - state_machines.SafetyEvent.IN_REVIEW_to_RECLASSIFIED
          - state_machines.SafetyEvent.RECLASSIFIED_to_IN_REVIEW
          - entities.ReviewDecision
        distinguishing_aspect: |
          SafetyEvent machine is cyclic: IN_REVIEW -> RECLASSIFIED -> IN_REVIEW
          -> CONFIRMED, with the reclassification mutating event_type/severity
          and every hop appending to the append-only ReviewDecision log.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; base setup; one MEDIUM HARSH_BRAKE event IN_REVIEW."
          setup_api_calls:
            - *k_clock
            - *k_fleet
            - *k_term
            - *k_drv
            - *k_veh
            - *k_pol
            - *k_pol_act
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "HARSH_BRAKE", severity: "MEDIUM", occurred_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { ev_cyc: $.data.id }
            - call: "POST /api/footage-clips"
              payload: { event_id: "${ev_cyc}", camera_angle: "FORWARD", size_mb: 5, captured_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { cl_cyc: $.data.id }
            - call: "POST /api/footage-clips/${cl_cyc}/upload-begin"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/footage-clips/${cl_cyc}/upload-complete"
              payload: {}
              as: TelematicsIngest
          trigger:
            - call: "GET /api/safety-events/${ev_cyc}"
              payload: {}
              as: SafetyManager
              captures: { ev_cyc_v: $.data.version }
            - call: "POST /api/safety-events/${ev_cyc}/review"
              payload: { action: "RECLASSIFY", rationale: "actually a following-distance event, and worse", new_event_type: "FOLLOWING_DISTANCE", new_severity: "HIGH", expected_event_version: "${ev_cyc_v}" }
              as: SafetyManager
              as_user_id: "sm-1"
              captures: { ev_cyc_v2: $.data.version }
            - call: "POST /api/safety-events/${ev_cyc}/review"
              payload: { action: "REOPEN", rationale: "second look after driver statement", expected_event_version: "${ev_cyc_v2}" }
              as: SafetyManager
              as_user_id: "sm-1"
              captures: { ev_cyc_v3: $.data.version }
            - call: "POST /api/safety-events/${ev_cyc}/review"
              payload: { action: "CONFIRM", rationale: "confirmed after reopen", expected_event_version: "${ev_cyc_v3}" }
              as: SafetyManager
              as_user_id: "sm-1"
          assert:
            - "SafetyEvent.${ev_cyc}.status == CONFIRMED after the cycle"
            - "SafetyEvent.${ev_cyc}.event_type == FOLLOWING_DISTANCE and severity == HIGH"
            - "SafetyEvent.${ev_cyc}.review_count == 3"
            - "GET /api/safety-events/${ev_cyc}/review-decisions returns exactly 3 rows with actions [RECLASSIFY, REOPEN, CONFIRM] in chronological order"
            - "Driver.${drv_id}.safety_score_final == 85.00  (HIGH fresh penalty 15.00)"
            - "Driver.${drv_id}.confirmed_events_90d == 1"

      - name: footage_parallel_dimensions_independent
        grounds:
          - state_machines.FootageClip
          - entities.FootageClip.fields.upload_status
          - entities.FootageClip.fields.retention_class
        distinguishing_aspect: |
          FootageClip carries two parallel state dimensions on one row:
          upload_status (QUEUED->UPLOADING->UPLOADED) and retention_class
          (COLLISION->LITIGATION_HOLD->COLLISION) evolve independently — a hold
          placement mid-upload never disturbs upload_status and vice versa.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; base setup; one COLLISION event with a clip whose retention_class initialized to COLLISION, still QUEUED."
          setup_api_calls:
            - *k_clock
            - *k_fleet
            - *k_term
            - *k_drv
            - *k_veh
            - *k_pol
            - *k_pol_act
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "COLLISION", severity: "HIGH", occurred_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { ev_pd: $.data.id }
            - call: "POST /api/footage-clips"
              payload: { event_id: "${ev_pd}", camera_angle: "FORWARD", size_mb: 5, captured_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { cl_pd: $.data.id }
          trigger:
            - call: "POST /api/litigation-holds"
              payload: { fleet_id: "${fleet_id}", scope: "EVENT", event_id: "${ev_pd}", reason: "claim CLM-881 by third party" }
              as: SafetyManager
              as_user_id: "sm-1"
              captures: { hold_pd: $.data.id }
            - call: "POST /api/footage-clips/${cl_pd}/upload-begin"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/footage-clips/${cl_pd}/upload-complete"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/litigation-holds/${hold_pd}/release"
              payload: {}
              as: SafetyManager
              as_user_id: "sm-1"
          assert:
            - "after hold placement: FootageClip.${cl_pd}.retention_class == LITIGATION_HOLD and upload_status == QUEUED (hold did not disturb the upload dimension)"
            - "after upload-begin: upload_status == UPLOADING and retention_class == LITIGATION_HOLD (upload did not disturb the retention dimension)"
            - "after upload-complete: upload_status == UPLOADED and retention_class == LITIGATION_HOLD"
            - "after release: retention_class == COLLISION (deterministic revert by event_type) and upload_status == UPLOADED"
            - "SafetyEvent.${ev_pd}.status == IN_REVIEW (first-clip bubble fired exactly once)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: confirm_to_session_to_escalation_to_driver_hold
        grounds:
          - state_machines.SafetyEvent.IN_REVIEW_to_CONFIRMED
          - state_machines.Driver.ACTIVE_to_COACHING_HOLD
          - calculations.confirmed_events_90d
        distinguishing_aspect: |
          Depth-4 cascade from one review CONFIRM: event CONFIRMED -> (1)
          CoachingSession auto-created, (2) driver.confirmed_events_90d
          recomputed to 3 -> (3) EscalationCase auto-opened -> (4) Driver.status
          flips to COACHING_HOLD. Each link is caused by the previous one.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; base setup; two HIGH events already CONFIRMED (driver count 2, still ACTIVE); a third HIGH event IN_REVIEW."
          setup_api_calls:
            - *k_clock
            - *k_fleet
            - *k_term
            - *k_drv
            - *k_veh
            - *k_pol
            - *k_pol_act
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "HARSH_BRAKE", severity: "HIGH", occurred_at: "2026-08-28T00:00:00Z" }
              as: TelematicsIngest
              captures: { ev_e1: $.data.id }
            - call: "POST /api/footage-clips"
              payload: { event_id: "${ev_e1}", camera_angle: "FORWARD", size_mb: 5, captured_at: "2026-08-28T00:00:00Z" }
              as: TelematicsIngest
              captures: { cl_e1: $.data.id }
            - call: "POST /api/footage-clips/${cl_e1}/upload-begin"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/footage-clips/${cl_e1}/upload-complete"
              payload: {}
              as: TelematicsIngest
            - call: "GET /api/safety-events/${ev_e1}"
              payload: {}
              as: SafetyManager
              captures: { ev_e1_v: $.data.version }
            - call: "POST /api/safety-events/${ev_e1}/review"
              payload: { action: "CONFIRM", rationale: "hard brake confirmed", expected_event_version: "${ev_e1_v}" }
              as: SafetyManager
              as_user_id: "sm-1"
            - call: "POST /api/safety-events"
