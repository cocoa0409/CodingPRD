            - "PercentageRentStatement.${stmt_r0_id}.gross_percentage_rent_cents == 0 - an excess of 8 cents rounds down under round_half_up"
            - "PercentageRentStatement.${stmt_r1_id}.gross_percentage_rent_cents == 1 - an excess of 9 cents rounds up to one cent"
            - "all three rows have base_rent_offset_credit_cents == 2500000 and amount_due_cents == 0 (floored, never negative)"
            - "Lease.${lease_id}.arrears_balance_cents == 0 after all three assessments and all three rows are PROVISIONAL_ASSESSED"
            - "GET /portfolio/leases/${lease_id}/rent-summary reports percentage_rent_sublease_base_cents 0 and active_sublease_count 0"

      - name: lessee_cure_succeeds_at_the_deadline_instant_and_fails_one_second_later
        grounds:
          - calculations.cure_window_deadlines
          - validations.priority_12_cure_window
          - state_machines.DefaultNotice.SERVED_to_LESSEE_CURED
          - state_machines.DefaultNotice.SERVED_to_LESSEE_CURE_LAPSED
          - errors.ERR_CURE_WINDOW_CLOSED
        distinguishing_aspect: |
          The cure window is closed only when the clock is strictly after the deadline, so the exact
          instant 2026-08-11T00:00:00Z is still inside it - both for the tenant's cure and for the
          administration-run lapse sweep, which must move nothing at that instant. One second later the
          identical call on an identical notice is refused with ERR_CURE_WINDOW_CLOSED and the sweep does
          lapse it, so the comparison is pinned on the instant rather than the calendar date.
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00Z default."
            - "Two identical leases, each with arrears 1000000 and no mortgages, each served a MONETARY_RENT_ARREARS notice by acct-1, so both lessee_cure_deadlines are 2026-08-11T00:00:00Z and both mortgagee deadlines are null."
