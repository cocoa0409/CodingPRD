      - name: rent_growth_step_clamp_binds_at_exactly_20000_cents
        grounds:
          - calculations.rent_growth_repricing
          - calculations.absorption_pacing_index
          - entities.MarketRentSchedule.fields.applied_growth_bps
          - state_machines.MarketRentSchedule.publication.PUBLISHED_to_SUPERSEDED
        distinguishing_aspect: |
          MAX_STEP_CENTS = 20000 is exercised from both sides inside one community. The COTTAGE line
          reprices from 800000 at +250 bps, whose step is exactly 20000, so the clamp is a no-op and the
          new rent is 820000. The DETACHED line reprices from 900000 at the same +250 bps, whose step is
          22500, so the clamp binds and the new rent is 920000 rather than 922500 — while
          applied_growth_bps is still recorded as the recommended 250, not a back-solved 222. Both
          reviews must land on pacing_index exactly 1.2500 through the supply_factor ceiling (3/2 and
          2/1 both clamp to 1.25), so the clamp is being tested with an unclamped sibling as its foil.
