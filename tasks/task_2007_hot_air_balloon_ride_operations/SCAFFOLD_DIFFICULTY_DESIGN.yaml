          Conserved quantity: money per reservation. paid_cents ==
          refunded_cents + retained_revenue_cents across the cancel + approve +
          pay chain; a partial 80% refund leaves no cent unaccounted and the
          customer's wallet grows by exactly the refunded amount when paid via
