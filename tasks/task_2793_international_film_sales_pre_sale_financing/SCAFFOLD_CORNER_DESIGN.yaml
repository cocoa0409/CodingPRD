    instances:

      - name: immediate_consistency_means_the_causing_response_already_carries_the_derived_values
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - "endpoints[POST /film-sales/payment-milestones/{id}/receipt]"
          - calculations.sales_commission_accrual
        distinguishing_aspect: |
          There is no settlement lag: the receipt response itself reports status RECEIVED and
          accrued_commission_usd 90000.00, and reads of the agreement, the film and the account
          immediately afterwards already show 900000.00 collected. Reading each row twice returns
          byte-identical values, so no lazy recompute-on-read window exists.
