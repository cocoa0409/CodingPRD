scaffold_corner_design:
  # ===================================================================
  # Section: entities
  # ===================================================================
  - section: entities
    instances:
      - name: agency_creation_assigns_defaults
        claim_type: defaults
        grounds: [entities.RegulatorAgency.fields.active]
        distinguishing_aspect: "Omitting `active` on POST /regulatory-exams/agencies applies default true."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "X", agency_name: "X", jurisdiction: "STATE", escalation_threshold_days: 10, repeat_finding_multiplier_bp: 15000 }
              as: PlatformAdmin
              captures: { ag: $.data.id, active: $.data.active }
          assert:
            - "active == true (default applied)"

      - name: examination_system_fields_present
        claim_type: system_fields
        grounds: [entities.Examination]
        distinguishing_aspect: "id, created_at, updated_at, version are server-stamped; client input to those fields is ignored."
        test_recipe:
          setup: ["one agency"]
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "SYS", agency_name: "S", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { ag: $.data.id }
          trigger:
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag}", exam_cycle_code: "S1", exam_type: "IT", scheduled_start_date: "2026-07-06T00:00:00Z", scheduled_end_date: "2026-07-10T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex: $.data.id, ver: $.data.version }
          assert:
            - "ver == 1 (fresh entity starts at version 1)"
            - "id matches UUID format with no type prefix"

      - name: agency_invalid_enum_jurisdiction_rejected
        claim_type: type_constraints
        grounds: [entities.RegulatorAgency.fields.jurisdiction, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "jurisdiction enum violation returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "BAD", agency_name: "B", jurisdiction: "INTERNATIONAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_REQUEST"

      - name: agency_code_uniqueness_enforced
        claim_type: uniqueness
        grounds: ["validations[priority=11]", "errors[ERR_DUPLICATE_KEY]"]
        distinguishing_aspect: "Second agency with same agency_code returns ERR_DUPLICATE_KEY (409)."
        test_recipe:
          setup: ["one agency with code DUP"]
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "DUP", agency_name: "A", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
          trigger:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "DUP", agency_name: "B", jurisdiction: "STATE", escalation_threshold_days: 60, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_DUPLICATE_KEY"

      - name: get_nonexistent_entity_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a random UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /regulatory-exams/examinations/00000000-0000-0000-0000-000000000000"
              as: RegulatoryAffairsManager
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_NOT_FOUND"

      - name: commitment_log_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.CommitmentLogEntry]
        distinguishing_aspect: "CommitmentLogEntry has common_fields: false and no update endpoint; append-only."
        test_recipe:
          setup: ["one exam"]
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "C1", agency_name: "C1", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { ag: $.data.id }
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag}", exam_cycle_code: "C1", exam_type: "IT", scheduled_start_date: "2026-07-06T00:00:00Z", scheduled_end_date: "2026-07-10T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex: $.data.id }
            - call: "POST /regulatory-exams/officers"
              payload: { full_name: "O", email: "o@x", officer_role_title: "CRO" }
              as: PlatformAdmin
              captures: { off: $.data.id }
          trigger:
            - call: "POST /regulatory-exams/examinations/${ex}/commitments"
              payload: { commitment_text: "Will remediate by Q4", committed_by_user_id: "${off}", due_date: "2026-12-31T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { cmt: $.data.id, created: $.data.created_at }
          assert:
            - "cmt is valid UUID"
            - "Response does not include `version` field (common_fields: false)"
            - "created is non-null"

  # ===================================================================
  # Section: state_machines
  # ===================================================================
  - section: state_machines
    instances:
      - name: exam_cancel_from_scheduled_only
        claim_type: invalid_transition
        grounds: [state_machines.Examination.SCHEDULED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancel from FIRST_DAY_ISSUED is rejected; only SCHEDULED can cancel."
        test_recipe:
          setup: ["exam in FIRST_DAY_ISSUED"]
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "CX", agency_name: "CX", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { ag: $.data.id }
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag}", exam_cycle_code: "CX", exam_type: "IT", scheduled_start_date: "2026-07-06T00:00:00Z", scheduled_end_date: "2026-07-10T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex}/first-day-items"
              payload: { request_ref: "F", description: "d", due_date: "2026-07-15T00:00:00Z" }
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examinations/${ex}/issue-first-day-letter"
              payload: {}
              as: RegulatoryAffairsManager
          trigger:
            - call: "POST /regulatory-exams/examinations/${ex}/cancel"
              payload: { cancelled_reason: "bad" }
              as: RegulatoryAffairsManager
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE"

      - name: issue_first_day_letter_requires_at_least_one_item
        claim_type: precondition_enforcement
        grounds: [state_machines.Examination.SCHEDULED_to_FIRST_DAY_ISSUED]
        distinguishing_aspect: "issue-first-day-letter on exam with zero items fails."
        test_recipe:
          setup: ["exam with no items"]
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "PD", agency_name: "PD", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { ag: $.data.id }
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag}", exam_cycle_code: "PD", exam_type: "IT", scheduled_start_date: "2026-07-06T00:00:00Z", scheduled_end_date: "2026-07-10T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex: $.data.id }
          trigger:
            - call: "POST /regulatory-exams/examinations/${ex}/issue-first-day-letter"
              payload: {}
              as: RegulatoryAffairsManager
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE"

      - name: begin_fieldwork_blocked_by_pending_items
        claim_type: precondition_enforcement
        grounds: [state_machines.Examination.FIRST_DAY_ISSUED_to_FIELDWORK]
        distinguishing_aspect: "Any PENDING item blocks begin-fieldwork."
        test_recipe:
          setup: ["exam FIRST_DAY_ISSUED with one PENDING item"]
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "BF", agency_name: "BF", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { ag: $.data.id }
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag}", exam_cycle_code: "BF", exam_type: "IT", scheduled_start_date: "2026-07-06T00:00:00Z", scheduled_end_date: "2026-07-10T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex}/first-day-items"
              payload: { request_ref: "F", description: "d", due_date: "2026-07-15T00:00:00Z" }
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examinations/${ex}/issue-first-day-letter"
              payload: {}
              as: RegulatoryAffairsManager
          trigger:
            - call: "POST /regulatory-exams/examinations/${ex}/begin-fieldwork"
              payload: {}
              as: RegulatoryAffairsManager
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE"

      - name: deliver_findings_requires_finalized_meeting
        claim_type: precondition_enforcement
        grounds: [state_machines.Examination.FIELDWORK_to_FINDINGS_DELIVERED]
        distinguishing_aspect: "deliver-findings without any FINALIZED meeting fails."
        test_recipe:
          setup: ["exam FIELDWORK, meeting still DRAFT"]
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "DF", agency_name: "DF", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { ag: $.data.id }
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag}", exam_cycle_code: "DF", exam_type: "IT", scheduled_start_date: "2026-07-06T00:00:00Z", scheduled_end_date: "2026-07-10T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex}/first-day-items"
              payload: { request_ref: "F", description: "d", due_date: "2026-07-15T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { it: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex}/issue-first-day-letter"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/first-day-items/${it}/waive"
              payload: { waived_reason: "na" }
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examinations/${ex}/begin-fieldwork"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examiner-meetings"
              payload: { examination_id: "${ex}", meeting_date: "2026-07-07T10:00:00Z", attendees: ["E", "O"], minutes_summary: "m" }
              as: RegulatoryAffairsManager
          trigger:
            - call: "POST /regulatory-exams/examinations/${ex}/deliver-findings"
              payload: {}
              as: RegulatoryAffairsManager
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE (meeting not finalized)"

      - name: terminal_state_lockdown_closed_exam_rejects_further_transitions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Examination, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "Once CLOSED, no further transitions allowed."
        test_recipe:
          setup: ["exam fully driven to CLOSED"]
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "TL", agency_name: "TL", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { ag: $.data.id }
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag}", exam_cycle_code: "TL", exam_type: "IT", scheduled_start_date: "2026-07-06T00:00:00Z", scheduled_end_date: "2026-07-10T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex: $.data.id, ex_v0: $.data.version }
            - call: "POST /regulatory-exams/examinations/${ex}/first-day-items"
              payload: { request_ref: "F", description: "d", due_date: "2026-07-15T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { it: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex}/issue-first-day-letter"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/first-day-items/${it}/waive"
              payload: { waived_reason: "na" }
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examinations/${ex}/begin-fieldwork"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examiner-meetings"
              payload: { examination_id: "${ex}", meeting_date: "2026-07-07T10:00:00Z", attendees: ["E", "O"], minutes_summary: "m" }
              as: RegulatoryAffairsManager
              captures: { mt: $.data.id }
            - call: "POST /regulatory-exams/examiner-meetings/${mt}/finalize"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examinations/${ex}/deliver-findings"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "GET /regulatory-exams/examinations/${ex}"
              as: RegulatoryAffairsManager
              captures: { ex_v: $.data.version }
            - call: "POST /regulatory-exams/examinations/${ex}/issues"
              payload: { issue_ref: "MRA-T", classification: "MRA", severity: "LOW", due_date: "2026-09-01T00:00:00Z", expected_examination_version: "${ex_v}" }
              as: RegulatoryAffairsManager
              captures: { iss: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex}/open-remediation"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/officers"
              payload: { full_name: "O", email: "o@x", officer_role_title: "CRO" }
              as: PlatformAdmin
              captures: { off: $.data.id }
            - call: "POST /regulatory-exams/reviewers"
              payload: { full_name: "R", email: "r@x", certification_level: "L1" }
              as: PlatformAdmin
              captures: { rev: $.data.id }
            - call: "POST /regulatory-exams/issues/${iss}/remediation-plans"
              payload: { owner_user_id: "${off}", root_cause_narrative: "c", corrective_action_summary: "s" }
              as: RemediationOwner
              as_user_id: "${off}"
              captures: { pl: $.data.id }
            - call: "POST /regulatory-exams/remediation-plans/${pl}/submit"
              payload: {}
              as: RemediationOwner
              as_user_id: "${off}"
            - call: "POST /regulatory-exams/remediation-plans/${pl}/approve"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "${rev}"
            - call: "POST /regulatory-exams/remediation-plans/${pl}/activate"
              payload: {}
              as: RemediationOwner
              as_user_id: "${off}"
            - call: "GET /regulatory-exams/remediation-plans/${pl}"
              as: RemediationOwner
              captures: { pl_v: $.data.version }
            - call: "POST /regulatory-exams/remediation-plans/${pl}/milestones"
              payload: { milestone_name: "m", due_date: "2026-08-10T00:00:00Z", expected_plan_version: "${pl_v}" }
              as: RemediationOwner
              as_user_id: "${off}"
              captures: { ms: $.data.id }
            - call: "POST /regulatory-exams/remediation-milestones/${ms}/start"
              payload: {}
              as: RemediationOwner
              as_user_id: "${off}"
            - call: "POST /regulatory-exams/remediation-milestones/${ms}/complete"
              payload: {}
              as: RemediationOwner
              as_user_id: "${off}"
            - call: "POST /regulatory-exams/issues/${iss}/validation-evidence"
              payload: { evidence_type: "TEST_RESULTS", artifact_manifest: [{artifact_id: "a", name: "n", sha256: "h"}], submitted_by_user_id: "${off}" }
              as: RemediationOwner
              as_user_id: "${off}"
              captures: { ev: $.data.id }
            - call: "POST /regulatory-exams/validation-evidence/${ev}/mark-sufficient"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "${rev}"
            - call: "POST /regulatory-exams/issues/${iss}/submit-validation"
              payload: { validation_evidence_id: "${ev}", closure_narrative: "done" }
              as: RemediationOwner
              as_user_id: "${off}"
              captures: { cr: $.data.id }
            - call: "GET /regulatory-exams/issues/${iss}"
              as: ComplianceReviewer
              captures: { iss_v: $.data.version }
            - call: "POST /regulatory-exams/closure-requests/${cr}/approve"
              payload: { expected_issue_version: "${iss_v}" }
              as: ComplianceReviewer
              as_user_id: "${rev}"
            - call: "POST /regulatory-exams/examinations/${ex}/close"
              payload: {}
              as: RegulatoryAffairsManager
          trigger:
            - call: "POST /regulatory-exams/examinations/${ex}/cancel"
              payload: { cancelled_reason: "post-close attempt" }
              as: RegulatoryAffairsManager
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_ALREADY_TERMINAL (CLOSED is terminal)"

      - name: initial_state_of_new_exam_is_scheduled
        claim_type: initial_state
        grounds: [state_machines.Examination]
        distinguishing_aspect: "Freshly created exam has status == SCHEDULED."
        test_recipe:
          setup: ["one agency"]
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "IS", agency_name: "IS", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { ag: $.data.id }
          trigger:
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag}", exam_cycle_code: "IS", exam_type: "IT", scheduled_start_date: "2026-07-06T00:00:00Z", scheduled_end_date: "2026-07-10T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { st: $.data.status }
          assert:
            - "st == SCHEDULED"

      - name: meeting_finalize_valid_transition
        claim_type: valid_transition
        grounds: [state_machines.ExaminerMeeting.DRAFT_to_FINALIZED]
        distinguishing_aspect: "DRAFT -> FINALIZED succeeds when minutes_summary non-empty and exam in FIELDWORK."
        test_recipe:
          setup: ["exam FIELDWORK, meeting DRAFT"]
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "VT", agency_name: "VT", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { ag: $.data.id }
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag}", exam_cycle_code: "VT", exam_type: "IT", scheduled_start_date: "2026-07-06T00:00:00Z", scheduled_end_date: "2026-07-10T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex}/first-day-items"
              payload: { request_ref: "F", description: "d", due_date: "2026-07-15T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { it: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex}/issue-first-day-letter"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/first-day-items/${it}/waive"
              payload: { waived_reason: "na" }
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examinations/${ex}/begin-fieldwork"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examiner-meetings"
              payload: { examination_id: "${ex}", meeting_date: "2026-07-07T10:00:00Z", attendees: ["E", "O"], minutes_summary: "m" }
              as: RegulatoryAffairsManager
              captures: { mt: $.data.id }
          trigger:
            - call: "POST /regulatory-exams/examiner-meetings/${mt}/finalize"
              payload: {}
              as: RegulatoryAffairsManager
              captures: { st: $.data.status }
          assert:
            - "st == FINALIZED"

      - name: informal_findings_require_finalized_meeting
        claim_type: side_effect_execution
        grounds: [state_machines.ExaminerMeeting]
        distinguishing_aspect: "Cannot record informal finding on a DRAFT meeting."
        test_recipe:
          setup: ["exam FIELDWORK, meeting DRAFT"]
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "IF", agency_name: "IF", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { ag: $.data.id }
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag}", exam_cycle_code: "IF", exam_type: "IT", scheduled_start_date: "2026-07-06T00:00:00Z", scheduled_end_date: "2026-07-10T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex}/first-day-items"
              payload: { request_ref: "F", description: "d", due_date: "2026-07-15T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { it: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex}/issue-first-day-letter"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/first-day-items/${it}/waive"
              payload: { waived_reason: "na" }
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examinations/${ex}/begin-fieldwork"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examiner-meetings"
              payload: { examination_id: "${ex}", meeting_date: "2026-07-07T10:00:00Z", attendees: ["E", "O"], minutes_summary: "m" }
              as: RegulatoryAffairsManager
              captures: { mt: $.data.id }
          trigger:
            - call: "POST /regulatory-exams/examiner-meetings/${mt}/informal-findings"
              payload: { finding_text: "t", severity_hint: "HIGH" }
              as: RegulatoryAffairsManager
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE (parent meeting must be FINALIZED)"

  # ===================================================================
  # Section: calculations
  # ===================================================================
  - section: calculations
    instances:
      - name: overdue_count_excludes_items_due_today
        claim_type: boundary_condition
        grounds: [calculations.overdue_item_count]
        distinguishing_aspect: "due_date < current_logical_date (strict); item due exactly on today's date is NOT overdue."
        test_recipe:
          setup: ["exam with one item due exactly at clock date"]
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
