  - name: boundary_bioload_utilisation_exactly_95_stays_open
    grounds:
    - §1.3 exhibit_posture constant BIOLOAD_PRESSURE_PCT 95.0 with a STRICT '>' comparison
    - §1.3 exhibit_bioload_ledger
    - §1.1 Exhibit.bioload_utilization_pct / posture / last_posture_reason
    - §1.5 PATCH /aquarium/exhibits/{id} with expected_exhibit_version
    - §1.4 priority 9 ERR_STALE_EXHIBIT_VERSION
    distinguishing_aspect: 19.00 / 20.00 is exactly 95.00 and must stay OPEN because the comparison is strict. Shrinking the denominator to 19 makes it exactly 100.00 -> RESTRICTED, and 18 makes it 105.5555... which must round HALF-UP to 105.56 (not truncate to 105.55). Restoring capacity 20 must return the exhibit to OPEN with last_posture_reason back to null, so the posture derivation cannot be latched.
    test_recipe:
      setup: An exhibit with bioload_capacity_units 20 holding one specimen of a species whose bioload_units_per_specimen is 19, under an APPROVED plan entry with planned_count 1. The plant is NORMAL and not redundancy-overdue throughout, so bioload pressure is the only posture driver.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
