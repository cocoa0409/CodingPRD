            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-GRIP-1", department: "GRIP_ELECTRIC", classification: "GAFFER", daily_rate_cents: 90000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-SND-1", department: "SOUND", classification: "BOOM_OPERATOR", daily_rate_cents: 80000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/productions/${prod_id}/start-production", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments/${cam_id}/transition", payload: { to_state: "ACTIVE" }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/work-day-logs", payload: { crew_assignment_id: "${cam_id}", work_date: "2026-08-10", call_time_minutes: 480, wrap_time_minutes: 1200, meal_breaks: [ { start_minutes: 600, end_minutes: 630 } ] }, as: ProducerRep, as_user_id: "${co_id}" }
          trigger:
            - { call: "POST /union-compliance/work-day-logs", payload: { crew_assignment_id: "${cam_id}", work_date: "2026-08-11", call_time_minutes: 480, wrap_time_minutes: 1200, meal_breaks: [ { start_minutes: 600, end_minutes: 630 } ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { l2_id: $.data.id } }
            - { call: "POST /union-compliance/work-day-logs", payload: { crew_assignment_id: "${cam_id}", work_date: "2026-08-12", call_time_minutes: 419, wrap_time_minutes: 900, meal_breaks: [ { start_minutes: 600, end_minutes: 630 } ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { l3_id: $.data.id } }
          assert:
            - "WorkDayLog.${l2_id}.turnaround_violation == false (elapsed 720 == threshold, not a violation)"
            - "WorkDayLog.${l2_id}.turnaround_penalty_cents == 0"
            - "WorkDayLog.${l3_id}.turnaround_violation == true (elapsed 659 < 720)"
            - "WorkDayLog.${l3_id}.turnaround_penalty_cents == 12500"

