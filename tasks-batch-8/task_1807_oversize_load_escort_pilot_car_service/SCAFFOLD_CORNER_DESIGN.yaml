            - { call: "POST /jobs/${job_id}/depart", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/deliver", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/incidents", payload: { incident_type: "EQUIPMENT_DAMAGE", description: "flag torn", claimed_amount_cents: 2000 }, as: Dispatcher, as_user_id: "disp-1", captures: { inc_id: $.data.id } }
            - { call: "POST /jobs/${job_id}/invoices", payload: {}, as: BillingClerk, as_user_id: "bc-1", captures: { inv_id: $.data.id } }
            - { call: "POST /invoices/${inv_id}/finalize", payload: {}, as: BillingClerk, as_user_id: "bc-2" }
          trigger:
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}", captures: { d1: $.data.error_id } }
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: Dispatcher, captures: { d2: $.data.error_id } }
