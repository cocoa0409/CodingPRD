      - name: player_group_optout_three_hop_cascade_to_authorization
        grounds:
          - state_machines.MarkRight.ACTIVE_to_WITHDRAWN
          - state_machines.ProductSubmission.APPROVED_to_REVOKED
          - state_machines.RetailerAuthorization.AUTHORIZED_to_SUSPENDED
          - entities.Player.fields.group_licensing_opt_in
          - entities.LicenseAgreement.fields.approved_sku_count
          - entities.RetailerAuthorization.fields.suspension_reason
        distinguishing_aspect: |
          A THREE-hop chain across three DIFFERENT entity types from one PlayerAgent
          call: group-licensing opt-out withdraws the PLAYER_GROUP MarkRight, which
          revokes every APPROVED submission whose mark_ids contain it, which drops
          agreement.approved_sku_count to 0 and therefore suspends the retailer
          authorization with suspension_reason NO_APPROVED_SKUS. The falsifier is the
          re-opt-in: the mark returns to ACTIVE but REVOKED is terminal, so the
          submission does NOT come back, approved_sku_count stays 0 and the
          authorization stays SUSPENDED — an implementation that treats the cascade as
          reversible would restore all three.
