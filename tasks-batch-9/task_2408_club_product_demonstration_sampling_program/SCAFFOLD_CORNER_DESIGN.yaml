# =============================================================================
# §1.9 Scaffold Corner Design — task_2408 In-Club Product Demonstration &
# Sampling Program (club-demo-sampling)
#
# Breadth probe over the §1.1-§1.7 surface declared in SCAFFOLD.yaml. Sections
# and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; corners already carried by an §1.8
# instance are emitted as excluded_because stubs naming that instance.
#
# Conventions (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   - opaque roles act as readable literal user ids: "admin_hq", "staff_ops",
#     and for segregation of duties "admin_billing" / "admin_controller"
#   - entity_backed roles act as the owning row's id: Manufacturer ->
#     ${mfr_id}, ClubOperations -> ${club_id}, Demonstrator -> ${dem_id}
#   - the logical clock starts at 2026-08-01T00:00:00Z; 2026-09-14, 2026-09-21
#     and 2026-10-05 are Mondays
#   - day-part shifts: MORNING [08:15Z, 14:15Z], MIDDAY [11:15Z, 17:15Z],
#     AFTERNOON [14:15Z, 20:15Z]
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — Entities (§1.1)
  # ===========================================================================
  - section: entities
    instances:

      - name: manufacturer_creation_returns_201_with_every_declared_field
        claim_type: creation
        grounds:
          - entities.Manufacturer.fields.legal_name
          - entities.Manufacturer.fields.program_tier
          - entities.Manufacturer.fields.credit_terms_days
          - endpoints[POST /manufacturers]
        distinguishing_aspect: "POST /manufacturers with all five input fields returns 201 and a body carrying the echoed inputs plus id, created_at, updated_at, version 1, account_status ACTIVE, outstanding_balance_cents 0 and credit_note_balance_cents 0."
        test_recipe:
          setup:
            - "Empty database; the logical clock sits at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /manufacturers"
              payload: { legal_name: "Bellhaven Foods Inc", billing_email: "ap@bellhaven.example", program_tier: "PLATINUM", credit_limit_cents: 900000, credit_terms_days: 60 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id", mfr_version: "$.data.version" }
          assert:
            - "the response status is 201"
            - "Manufacturer.${mfr_id}.legal_name == Bellhaven Foods Inc"
            - "Manufacturer.${mfr_id}.program_tier == PLATINUM"
            - "Manufacturer.${mfr_id}.credit_limit_cents == 900000"
            - "Manufacturer.${mfr_id}.credit_terms_days == 60"
            - "Manufacturer.${mfr_id}.account_status == ACTIVE"
            - "Manufacturer.${mfr_id}.outstanding_balance_cents == 0"
            - "Manufacturer.${mfr_id}.credit_note_balance_cents == 0"
            - "${mfr_version} == 1"
            - "the response body carries meta.api_request_id and meta.api_request_timestamp with response_type object"

      - name: club_retrieval_by_id_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - entities.Club.fields.club_number
          - entities.Club.fields.club_status
          - endpoints[GET /clubs/{id}]
        distinguishing_aspect: "GET /clubs/{id} returns byte-identical field values to the POST response, including the OPEN default and the unchanged version 1, and does not mutate updated_at."
        test_recipe:
          setup:
            - "One club created with club_number C-6001, club_tier SATELLITE, daily_event_capacity 2, food_station_count 0 and health_permit_expires_on 2027-03-31."
          setup_api_calls:
            - call: "POST /clubs"
              payload: { club_number: "C-6001", name: "Bellhaven Club 6001", region_code: "SW", club_tier: "SATELLITE", daily_event_capacity: 2, food_station_count: 0, health_permit_expires_on: "2027-03-31" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id", created_version: "$.data.version" }
          trigger:
            - call: "GET /clubs/${club_id}"
              payload: {}
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { read_version: "$.data.version", read_status: "$.data.club_status" }
          assert:
            - "the response status is 200"
            - "${read_status} == OPEN"
            - "${read_version} == ${created_version}"
            - "${read_version} == 1"
            - "Club.${club_id}.food_station_count == 0"
            - "Club.${club_id}.health_permit_expires_on == 2027-03-31"

      - name: demonstrator_listing_paginates_with_limit_offset_and_total_count
        claim_type: listing
        grounds:
          - endpoints[GET /demonstrators]
          - validations[priority=5]
        distinguishing_aspect: "With three demonstrators at one club, GET /demonstrators?home_club_id=&limit=2&offset=0 returns exactly the two oldest rows with total_count 3 and has_more true, and offset=2 returns the third row with has_more false; limit=0 is rejected with ERR_VALIDATION."
        test_recipe:
          setup:
            - "One club and three demonstrators created in the order Ada, Bo, Cy so created_at ASC is deterministic."
          setup_api_calls:
            - call: "POST /clubs"
              payload: { club_number: "C-6002", name: "Bellhaven Club 6002", region_code: "SW", club_tier: "STANDARD", daily_event_capacity: 3, food_station_count: 1, health_permit_expires_on: "2027-03-31" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /demonstrators"
              payload: { home_club_id: "${club_id}", full_name: "Ada Reyes", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { d1_id: "$.data.id" }
            - call: "POST /demonstrators"
              payload: { home_club_id: "${club_id}", full_name: "Bo Ferrand", hourly_rate_cents: 2100 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { d2_id: "$.data.id" }
            - call: "POST /demonstrators"
              payload: { home_club_id: "${club_id}", full_name: "Cy Okafor", hourly_rate_cents: 2200 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { d3_id: "$.data.id" }
          trigger:
            - call: "GET /demonstrators?home_club_id=${club_id}&limit=2&offset=0"
              payload: { home_club_id: "${club_id}", limit: 2, offset: 0 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { page1_first: "$.data[0].id", page1_second: "$.data[1].id" }
            - call: "GET /demonstrators?home_club_id=${club_id}&limit=2&offset=2"
              payload: { home_club_id: "${club_id}", limit: 2, offset: 2 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { page2_first: "$.data[0].id" }
            - call: "GET /demonstrators?home_club_id=${club_id}&limit=0"
              payload: { home_club_id: "${club_id}", limit: 0 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { err_limit: "$.data.error_id" }
          assert:
            - "the first page has exactly 2 rows with total_count 3, limit 2, offset 0 and has_more true"
            - "${page1_first} == ${d1_id}"
            - "${page1_second} == ${d2_id}"
            - "the second page has exactly 1 row with total_count 3, offset 2 and has_more false"
            - "${page2_first} == ${d3_id}"
            - "${err_limit} == ERR_VALIDATION"
            - "the limit=0 request responds with HTTP 400"

      - name: get_demo_event_with_unknown_path_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=6]
          - errors[ERR_DEMO_EVENT_NOT_FOUND]
          - endpoints[GET /demo-events/{id}]
        distinguishing_aspect: "A syntactically valid but unpersisted id on GET /demo-events/{id} returns ERR_DEMO_EVENT_NOT_FOUND with HTTP 404 — the event-specific 404 from §1.6's family, not the generic ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database; no DemoEvent has ever been created, so no id can collide."
          setup_api_calls: []
          trigger:
            - call: "GET /demo-events/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { err_id: "$.data.error_id", err_msg: "$.data.message" }
          assert:
            - "${err_id} == ERR_DEMO_EVENT_NOT_FOUND"
            - "the response status is 404"
            - "${err_id} != ERR_RESOURCE_NOT_FOUND"
            - "${err_msg} is a non-empty string"
            - "the body carries response_type error"

      - name: product_create_missing_required_samples_per_case_is_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - entities.Product.fields.samples_per_case
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Omitting samples_per_case — an input field with no declared default — from POST /products returns ERR_VALIDATION 400 and persists nothing, while emergency_reserve_cases may be omitted freely because it defaults to 0."
        test_recipe:
          setup:
            - "One manufacturer exists to own the product."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Corran Dairy", billing_email: "ap@corran.example", program_tier: "STANDARD", credit_limit_cents: 500000, credit_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
          trigger:
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "CD-YOG-001", name: "Greek Yogurt Cups", category: "DAIRY", requires_food_handling: true, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 150, weekly_sample_case_pool: 12 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "GET /products?manufacturer_id=${mfr_id}"
              payload: { manufacturer_id: "${mfr_id}" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
          assert:
            - "${err_id} == ERR_VALIDATION"
            - "the response status is 400"
            - "GET /products?manufacturer_id=${mfr_id} -> data has exactly 0 rows and total_count 0"

      - name: demo_event_omitted_optionals_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.DemoEvent.fields.attribution_window_days
          - entities.DemoEvent.fields.addon_services
          - entities.Demonstrator.fields.max_weekly_events
          - entities.Product.fields.emergency_reserve_cases
        distinguishing_aspect: "Creating a DemoEvent without attribution_window_days or addon_services yields 14 and [] respectively; a Demonstrator without max_weekly_events yields 5; a Product without emergency_reserve_cases yields 0 — each the declared default, not null."
        test_recipe:
          setup:
            - "A manufacturer, a club and a NON_FOOD product created with emergency_reserve_cases omitted."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Dunmere Household", billing_email: "ap@dunmere.example", program_tier: "STANDARD", credit_limit_cents: 500000, credit_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-6003", name: "Dunmere Club 6003", region_code: "MW", club_tier: "STANDARD", daily_event_capacity: 3, food_station_count: 1, health_permit_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "DH-MAT-003", name: "Anti-Fatigue Mat", category: "HOUSEHOLD", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 2400, samples_per_case: 2, weekly_sample_case_pool: 12 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id", reserve_default: "$.data.emergency_reserve_cases" }
          trigger:
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "MORNING", requested_sample_cases: 2 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { event_id: "$.data.id", attr_days: "$.data.attribution_window_days", addons: "$.data.addon_services" }
            - call: "POST /demonstrators"
              payload: { home_club_id: "${club_id}", full_name: "Nils Aberg", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { dem_id: "$.data.id", weekly_default: "$.data.max_weekly_events" }
          assert:
            - "${attr_days} == 14"
            - "${addons} == []"
            - "${weekly_default} == 5"
            - "${reserve_default} == 0"
            - "Demonstrator.${dem_id}.employment_status == ACTIVE"
            - "Demonstrator.${dem_id}.reliability_score_rolling_90 == 100.0"
            - "Demonstrator.${dem_id}.reliability_score_program_to_date == 100.0"
            - "Demonstrator.${dem_id}.no_show_strike_count == 0"
            - "DemoEvent.${event_id}.allocated_sample_cases == 0"

      - name: equipment_unit_requires_food_cert_is_computed_from_equipment_type
        claim_type: computed_fields
        grounds:
          - entities.EquipmentUnit.fields.requires_food_cert
          - entities.EquipmentUnit.fields.equipment_type
          - endpoints[POST /equipment-units]
        distinguishing_aspect: "requires_food_cert is derived from equipment_type alone — true for a CONVECTION_OVEN and false for a TV_CART — and the field is absent from the endpoint's input, so a client cannot set it."
        test_recipe:
          setup:
            - "One club to own both units."
          setup_api_calls:
            - call: "POST /clubs"
              payload: { club_number: "C-6004", name: "Evershaw Club 6004", region_code: "NE", club_tier: "STANDARD", daily_event_capacity: 3, food_station_count: 2, health_permit_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
          trigger:
            - call: "POST /equipment-units"
              payload: { club_id: "${club_id}", asset_tag: "EQ-6004-OVEN", equipment_type: "CONVECTION_OVEN" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { oven_id: "$.data.id", oven_flag: "$.data.requires_food_cert", oven_sanitation: "$.data.sanitation_status" }
            - call: "POST /equipment-units"
              payload: { club_id: "${club_id}", asset_tag: "EQ-6004-TV", equipment_type: "TV_CART" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { tv_id: "$.data.id", tv_flag: "$.data.requires_food_cert" }
          assert:
            - "${oven_flag} == true"
            - "${tv_flag} == false"
            - "${oven_sanitation} == SANITIZED"
            - "EquipmentUnit.${oven_id}.last_sanitized_at == null"
            - "EquipmentUnit.${tv_id}.sanitation_status == SANITIZED"

      - name: demo_event_system_stamps_start_null_and_are_set_only_by_transitions
        claim_type: system_fields
        grounds:
          - entities.DemoEvent.fields.submitted_at
          - entities.DemoEvent.fields.approved_at
          - state_machines.DemoEvent.transitions.DRAFT_to_SUBMITTED
        distinguishing_aspect: "submitted_at and approved_at are source system, absent from every request body, null on a freshly created DemoEvent, and stamped only by their own transitions — SUBMIT sets submitted_at while approved_at stays null."
        test_recipe:
          setup:
            - "A manufacturer, club, NON_FOOD product and one DRAFT DemoEvent dated 2026-09-14, which clears MIN_BOOKING_LEAD_DAYS 7 against the startup clock 2026-08-01."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Faircot Supply", billing_email: "ap@faircot.example", program_tier: "STANDARD", credit_limit_cents: 500000, credit_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-6005", name: "Faircot Club 6005", region_code: "W", club_tier: "STANDARD", daily_event_capacity: 3, food_station_count: 1, health_permit_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "FS-BIN-005", name: "Utility Bin", category: "HOUSEHOLD", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 1200, samples_per_case: 2, weekly_sample_case_pool: 12 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "MIDDAY", requested_sample_cases: 2, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { event_id: "$.data.id", created_submitted_at: "$.data.submitted_at", created_approved_at: "$.data.approved_at", v_created: "$.data.version" }
          trigger:
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { after_submitted_at: "$.data.submitted_at", after_approved_at: "$.data.approved_at", v_after: "$.data.version" }
          assert:
            - "${created_submitted_at} == null"
            - "${created_approved_at} == null"
            - "${v_created} == 1"
            - "${after_submitted_at} is not null"
            - "${after_approved_at} == null"
            - "${v_after} == 2"
            - "DemoEvent.${event_id}.event_window_start_utc == 2026-09-14T12:00:00Z"
            - "DemoEvent.${event_id}.event_window_end_utc == 2026-09-14T16:00:00Z"

      - name: club_create_rejects_out_of_range_and_illegal_enum_values
        claim_type: type_constraints
        grounds:
          - entities.Club.fields.daily_event_capacity
          - entities.Club.fields.club_tier
          - validations[priority=4]
        distinguishing_aspect: "daily_event_capacity 13 breaches the declared 1..12 range and an unlisted club_tier value breaches the enum, and both return ERR_VALIDATION 400 rather than being silently clamped or coerced."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /clubs"
              payload: { club_number: "C-6006", name: "Grantley Club 6006", region_code: "NE", club_tier: "STANDARD", daily_event_capacity: 13, food_station_count: 1, health_permit_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { err_range: "$.data.error_id" }
            - call: "POST /clubs"
              payload: { club_number: "C-6006", name: "Grantley Club 6006", region_code: "NE", club_tier: "MEGA", daily_event_capacity: 4, food_station_count: 1, health_permit_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { err_enum: "$.data.error_id" }
            - call: "POST /clubs"
              payload: { club_number: "C-6006", name: "Grantley Club 6006", region_code: "NE", club_tier: "STANDARD", daily_event_capacity: 12, food_station_count: 8, health_permit_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { ok_club_id: "$.data.id" }
          assert:
            - "${err_range} == ERR_VALIDATION"
            - "the capacity-13 request responds with HTTP 400"
            - "${err_enum} == ERR_VALIDATION"
            - "the MEGA-tier request responds with HTTP 400"
            - "Club.${ok_club_id}.daily_event_capacity == 12"
            - "Club.${ok_club_id}.food_station_count == 8"
            - "the third request responds with HTTP 201, proving both upper bounds are inclusive"

      - name: sales_lift_measurement_is_immutable_with_no_version_and_no_update_path
        claim_type: immutability
        grounds:
          - entities.SalesLiftMeasurement.fields.measurement_status
          - endpoints[GET /demo-events/{id}/lift-measurements]
        distinguishing_aspect: "SalesLiftMeasurement declares common_fields false, so its rows carry id and created_at but no updated_at and no version, and §1.5 exposes no PATCH or DELETE for them — a superseding measurement is a new row while the old one is only re-labelled SUPERSEDED."
        test_recipe:
          setup:
            - "The measurement rows produced by the §1.8 dual-variant chain are not needed; a single PROVISIONAL row on a COMPLETED event with a ClubProductBaseline suffices. Setup drives one NON_FOOD event through CLOSE_OUT, files its reconciliation, then posts one PROVISIONAL measurement."
            - "Baseline: baseline_weekly_units 70, baseline_unit_price_cents 500, baseline_week_start_date 2026-09-14."
            - "Clock moved to 2026-09-14T14:00:00Z so the MORNING assignment can check in at 08:15Z and out at 12:45Z."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Hollimere Goods", billing_email: "ap@hollimere.example", program_tier: "STANDARD", credit_limit_cents: 900000, credit_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-6007", name: "Hollimere Club 6007", region_code: "MW", club_tier: "STANDARD", daily_event_capacity: 3, food_station_count: 1, health_permit_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "HG-KET-007", name: "Electric Kettle", category: "ELECTRONICS", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 3900, samples_per_case: 2, weekly_sample_case_pool: 12 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
            - call: "POST /club-product-baselines"
              payload: { club_id: "${club_id}", product_id: "${product_id}", baseline_weekly_units: 70, baseline_unit_price_cents: 500, baseline_week_start_date: "2026-09-14" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { baseline_id: "$.data.id" }
            - call: "POST /demonstrators"
              payload: { home_club_id: "${club_id}", full_name: "Imre Voss", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { dem_id: "$.data.id" }
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "MORNING", requested_sample_cases: 2, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { event_id: "$.data.id" }
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
            - call: "POST /demo-events/${event_id}/sample-shipments"
              payload: { cases_shipped: 2, carrier_reference: "TRK-66007" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { shipment_id: "$.data.id" }
            - call: "POST /sample-shipments/${shipment_id}/receive"
              payload: { cases_received: 2 }
              as: ClubOperations
              as_user_id: "${club_id}"
            - call: "POST /demo-events/${event_id}/assignments"
