  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:

      - name: dispute_then_resolve_same_fail_preserves_fail_count_invariant
        grounds:
          - state_machines.Verification.REPORTED_to_DISPUTED
          - state_machines.Verification.DISPUTED_to_RESOLVED
          - calculations.compute_overall_result
        distinguishing_aspect: |
          Conserved quantity (per order_id): count of Verifications whose effective
          result == FAIL, formally `count(v in Verifications where v.order_id=X AND
          v.result == FAIL AND v.status IN {REPORTED, DISPUTED, RESOLVED})`. Forward
          action REPORT(FAIL) increments this count by 1. Compensating action chain
          DISPUTE -> RESOLVE(new_result=FAIL) leaves it unchanged. The count is an
          integer (categorical quantity); BackgroundCheckOrder.overall_result remains
          CONSIDER throughout.
        test_recipe:
          setup:
            - "Order COMPLETE with CRIMINAL=FAIL, MVR=PASS, EDUCATION=PASS; fail_count=1; overall_result=CONSIDER."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/jurisdictions"
