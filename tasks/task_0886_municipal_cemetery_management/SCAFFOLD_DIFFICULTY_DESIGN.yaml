  - rule_id: cross_entity_state_dependency
    instances:
      - name: interment_requires_issued_deed
        grounds:
          - state_machines.Interment.SCHEDULED
          - state_machines.Deed.PENDING_PAYMENT_to_ISSUED
          - errors[ERR_DEED_NOT_ISSUED]
