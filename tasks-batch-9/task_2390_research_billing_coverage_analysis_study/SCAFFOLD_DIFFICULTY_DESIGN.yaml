      - name: study_lifecycle_cycles_back_while_budget_dimension_supersedes
        grounds: "§1.2 Study declares dimension A lifecycle_status (LC-1..LC-5, including the LC-4 cycle OPEN_TO_ACCRUAL/COVERAGE_APPROVED -> COVERAGE_PENDING) and dimension B budget_status (BG-1, BG-2, BG-4); §1.5 POST /research-billing/amendments/{id}/implement."
        distinguishing_aspect: "One request drives two dimensions of the same row in different directions: lifecycle_status travels BACKWARD to COVERAGE_PENDING, a state it already left (the cycle), while budget_status travels FORWARD to the fresh state SUPERSEDED. A single-status implementation cannot represent 'coverage pending again but the old budget still on file'. This is a different entity and a different non-linearity from charge_routing_and_billing_dimensions_move_independently (which pairs two forward-only dimensions) and from analysis_return_loop_closes_twice_then_is_bounded (a bounded single-dimension loop)."
