            - "${both_error} is NOT ERR_MEDIA_REGION_INELIGIBLE - rule 58 resolves the category row that rule 60 needs"
            - "the active-category request returns HTTP 422"
            - "${region_error} == ERR_MEDIA_REGION_INELIGIBLE"

