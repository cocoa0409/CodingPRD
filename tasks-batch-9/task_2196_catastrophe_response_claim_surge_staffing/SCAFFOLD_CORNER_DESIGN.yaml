              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { hb: $.data.id, hb_status_at_create: $.data.status }
            - call: "POST /claims"
              payload: { policy_number: "POL-1103A", loss_state: "TX", loss_date_utc: "2026-07-26T00:00:00.000Z", reported_loss_amount: 40000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 100000, deductible_amount: 0, estimated_damage_amount: 50000 }], event_id: "${ev}" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl: $.data.id }
            - call: "GET /catastrophe-events/${ev}"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev_v: $.data.version }
            - call: "POST /loss-estimates"
              payload: { event_id: "${ev}", method: "EXPOSURE_BASED", expected_event_version: "${ev_v}" }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { les: $.data.id, les_hw: $.data.input_reserve_sequence_high_water, les_stale_at_create: $.data.stale }
            - call: "POST /claims/${cl}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
          trigger:
            - call: "POST /catastrophe-events/${ev}/activate-surge"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /housing-blocks/${hb}/open"
              payload: {}
              as: DeploymentCoordinator
              as_user_id: "dc_1"
            - call: "POST /catastrophe-events/${ev}/activate-surge"
