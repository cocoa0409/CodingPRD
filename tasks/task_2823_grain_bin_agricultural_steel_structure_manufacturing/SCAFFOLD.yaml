scenario: |
  2823. Grain Bin & Agricultural Steel Structure Manufacturing (grain storage equipment
  manufacturer): bin sizing and structural design by grain type, moisture and wind or seismic
  loading, roll-forming of corrugated sheets with coating selection for corrosion resistance,
  kit configuration with sidewall sheets, stiffeners, roof panels and hardware counts, dealer
  order processing with seasonal peaks after harvest and delivery scheduling, aeration, drying
  and unloading system integration with capacity calculations, engineering seal requirements
  for permitting in some jurisdictions, freight optimization for high-cube kits and staging at
  dealer yards, installation crew certification and field failure investigation on collapses
  or corrosion

domain_name: grain-bin-manufacturing
api_prefix: ""

complexity_profile:
  difficulty_level: expert
  primary_archetype: compliance_audit_workflow
  secondary_archetype: quota_allocation_workflow
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers
    - derived_field_reconciliation
    - pagination_with_filtering
  entity_topology: flat
  state_machine_shape: cyclic
  state_machine_shape_notes: |
    BinDesign carries a revision cycle (DRAFT -> UNDER_REVIEW -> REVISION_REQUIRED -> DRAFT).
    DealerOrder carries two independent state dimensions on one row
    (production_status x financial_status) plus a third readiness dimension
    (installation_readiness). FieldFailure branches on determined_cause into three
    divergent side-effect sets.
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Jurisdiction
    parent: null
    common_fields: false
    fields:
      - name: code
        type: string
        source: input
        description: permitting authority code, unique across Jurisdiction
        constraints: unique; 3-16 chars
      - name: name
        type: string
        source: input
        description: human readable authority name
      - name: seal_required
        type: boolean
        source: input
        description: when true a BinDesign in this jurisdiction must reach SEALED and clear its permit review window before an order may be confirmed
      - name: min_design_wind_speed_mph
        type: integer
        source: input
        description: minimum design wind speed the jurisdiction accepts on a BinDesign
        constraints: 80..200
      - name: seismic_design_category
        type: enum
        source: input
        description: seismic design category driving SEISMIC_FACTOR selection
        constraints: one of A, B, C, D
      - name: permit_review_days
        type: integer
        source: input
        description: whole days added to sealed_at to obtain BinDesign.permit_ready_at
        constraints: 0..90

  - name: GrainProfile
    parent: null
    common_fields: false
    fields:
      - name: grain_code
        type: string
        source: input
        description: grain identifier, unique across GrainProfile
        constraints: unique
      - name: bulk_density_kg_per_m3
        type: number
        source: input
        description: bulk density used for lateral pressure and stored mass
        constraints: 300..1400
      - name: janssen_k_ratio
        type: number
        source: input
        description: Janssen lateral-to-vertical pressure ratio
        constraints: 0.20..0.70
      - name: max_safe_moisture_pct
        type: number
        source: input
        description: storage moisture above which a moisture surcharge is applied to lateral demand and drying is required
        constraints: 8.0..20.0
      - name: aeration_cfm_per_m3_base
        type: number
        source: input
        description: base aeration airflow per cubic metre of bin capacity
        constraints: 0.5..6.0
      - name: drying_multiplier
        type: number
        source: input
        description: airflow multiplier applied when aeration_package is DRYING_FULL
        constraints: 1.0..8.0

  - name: CoatingSpec
    parent: null
    common_fields: false
    fields:
      - name: coating_code
        type: string
        source: input
        description: galvanized coating designation, unique across CoatingSpec
        constraints: unique
      - name: zinc_mass_g_per_m2
        type: integer
        source: input
        description: total zinc mass per square metre of sheet
        constraints: 150..900
      - name: corrosion_class
        type: enum
        source: computed
        description: corrosion resistance class derived from zinc_mass_g_per_m2 by calculations.coating_corrosion_class
        constraints: one of C2, C3, C4, C5
      - name: coating_cost_per_kg_cents
        type: integer
        source: input
        description: coating adder in cents per kilogram of steel component weight
        constraints: 0..500
      - name: changeover_minutes
        type: integer
        source: input
        description: minutes of roll-forming line buffer required between two runs whose coating_code differs
        constraints: 0..480
      - name: max_ambient_moisture_pct
        type: number
        source: input
        description: highest BinDesign.moisture_pct this coating may be specified for
        constraints: 8.0..24.0

  - name: RollFormingLine
    parent: null
    common_fields: false
    fields:
      - name: line_code
        type: string
        source: input
        description: roll-forming line identifier, unique across RollFormingLine
        constraints: unique
      - name: max_gauge_mm
        type: number
        source: input
        description: heaviest sheet gauge this line can form
        constraints: 0.8..6.0

  - name: Engineer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: engineer of record name
      - name: license_number
        type: string
        source: input
        description: professional engineering license number, unique across Engineer
        constraints: unique
      - name: licensed_jurisdiction_codes
        type: array
        source: input
        description: array of Jurisdiction.code strings this engineer may author or seal designs in
        constraints: non-empty array of strings
      - name: status
        type: enum
        source: computed
        description: ACTIVE at creation; LAPSED after POST /engineers/{id}/lapse
        default: ACTIVE
        constraints: one of ACTIVE, LAPSED

  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: dealership name
      - name: region_code
        type: string
        source: input
        description: sales region code
      - name: jurisdiction_id
        type: string
        source: input
        description: FK -> {Jurisdiction}.id; permitting authority governing this dealer's yard
      - name: credit_limit_cents
        type: integer
        source: input
        description: maximum aggregate credit the plant extends to this dealer
        constraints: 0..100000000000
      - name: program_tier
        type: enum
        source: input
        description: dealer program tier selecting PROGRAM_DISCOUNT_PCT
        constraints: one of BASE, PREFERRED, ELITE
      - name: staging_slots
        type: integer
        source: input
        description: number of kits that may occupy the dealer yard in any one staging window
        constraints: 1..20
      - name: high_cube_access
        type: boolean
        source: input
        description: when false this yard cannot receive a HIGH_CUBE_VAN FreightLoad
      - name: credit_committed_cents
        type: integer
        source: computed
        description: sum of credit_hold_cents over this dealer's DealerOrder rows per calculations.dealer_credit_ledger
        default: 0
      - name: credit_available_cents
        type: integer
        source: computed
        description: credit_limit_cents minus credit_committed_cents; may go negative when the limit is lowered
        default: 0
      - name: staged_kit_count
        type: integer
        source: computed
        description: count of this dealer's FreightLoad rows in status PLANNED
        default: 0
      - name: status
        type: enum
        source: computed
        description: ACTIVE while credit_available_cents >= 0; CREDIT_HOLD once it goes negative
        default: ACTIVE
        constraints: one of ACTIVE, CREDIT_HOLD

  - name: BinDesign
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: FK -> {Dealer}.id; dealer this design was drawn for
      - name: jurisdiction_id
        type: string
        source: input
        description: FK -> {Jurisdiction}.id; permitting authority the design is checked against
      - name: grain_profile_id
        type: string
        source: input
        description: FK -> {GrainProfile}.id; stored product driving lateral pressure and airflow
      - name: coating_spec_id
        type: string
        source: input
        description: FK -> {CoatingSpec}.id; corrosion protection specified for all steel components
      - name: author_engineer_id
        type: string
        source: system
        description: FK -> {Engineer}.id; taken from the X-User-ID of the DesignEngineer who created or last revised the design
      - name: sealed_by_engineer_id
        type: string
        source: computed
        description: FK -> {Engineer}.id; taken from the X-User-ID of the SealingEngineer on POST /bin-designs/{id}/seal, null before sealing
        default: null
      - name: diameter_m
        type: number
        source: input
        description: bin inside diameter in metres
        constraints: 4.0..30.0
      - name: eave_height_m
        type: number
        source: input
        description: sidewall eave height in metres
        constraints: 3.2..24.0
      - name: roof_pitch_deg
        type: enum
        source: input
        description: roof pitch in degrees, selecting ROOF_RISE_RATIO
        constraints: one of 25, 30, 35
      - name: design_wind_speed_mph
        type: integer
        source: input
        description: design wind speed used for wind demand and the high-wind stiffener bonus
        constraints: 80..200
      - name: moisture_pct
        type: number
        source: input
        description: design storage moisture of the grain, percent wet basis
        constraints: 8.0..24.0
      - name: design_method
        type: enum
        source: input
        description: structural design method selecting the allowable stiffener capacity variant
        constraints: one of ASD, LRFD
      - name: sheet_courses
        type: integer
        source: computed
        description: number of stacked sidewall courses per calculations.bin_geometry_and_capacity
      - name: sheets_per_course
        type: integer
        source: computed
        description: number of corrugated sheets around one course
      - name: sidewall_sheet_count
        type: integer
        source: computed
        description: sheet_courses multiplied by sheets_per_course
      - name: roof_panel_count
        type: integer
        source: computed
        description: number of roof panels around the eave circle
      - name: circumference_m
        type: number
        source: computed
        description: eave circumference in metres, 3 decimal places
      - name: capacity_m3
        type: number
        source: computed
        description: cylinder plus roof cone volume in cubic metres, 2 decimal places
      - name: grain_lateral_kpa
        type: number
        source: computed
        description: Janssen lateral pressure at the depth-capped design depth, kPa
      - name: moisture_factor
        type: number
        source: computed
        description: 1 plus MOISTURE_SURCHARGE_PER_PCT for each point of moisture above GrainProfile.max_safe_moisture_pct
      - name: grain_demand_kpa
        type: number
        source: computed
        description: grain_lateral_kpa multiplied by moisture_factor, 3 decimal places
      - name: wind_demand_kpa
        type: number
        source: computed
        description: wind load demand, 3 decimal places
      - name: seismic_demand_kpa
        type: number
        source: computed
        description: seismic base shear demand for the jurisdiction's seismic_design_category, 3 decimal places
      - name: governing_load_case
        type: enum
        source: computed
        description: which demand is largest, resolved by calculations.structural_stiffener_requirement
        constraints: one of GRAIN_LATERAL, WIND_UPLIFT, SEISMIC_BASE_SHEAR
      - name: governing_demand_kpa
        type: number
        source: computed
        description: the largest of grain_demand_kpa, wind_demand_kpa, seismic_demand_kpa
      - name: required_stiffener_count
        type: integer
        source: computed
        description: stiffener count under this design's own design_method, clamped to STIFFENER_MAX_COUNT
      - name: utilization_ratio
        type: number
        source: computed
        description: governing demand over installed stiffener capacity, 4 decimal places
      - name: sheet_gauge_mm
        type: number
        source: computed
        description: lowest SHEET_GAUGE_LADDER value at or above governing_demand_kpa multiplied by GAUGE_KPA_TO_MM
      - name: roof_ring_required
        type: boolean
        source: computed
        description: true when design_wind_speed_mph is at or above HIGH_WIND_THRESHOLD_MPH
      - name: seal_required
        type: boolean
        source: computed
        description: copied from the referenced Jurisdiction.seal_required at design creation
      - name: revision_round
        type: integer
        source: computed
        description: number of completed revision cycles; 0 at creation, incremented by POST /bin-designs/{id}/revise
        default: 0
      - name: sealed_at
        type: datetime
        source: computed
        description: logical clock value when the design reached SEALED, null before that
        default: null
      - name: permit_ready_at
        type: datetime
        source: computed
        description: sealed_at plus Jurisdiction.permit_review_days whole days; null while seal_required is false or the design is unsealed
        default: null
      - name: status
        type: enum
        source: computed
        description: design lifecycle state
        default: DRAFT
        constraints: one of DRAFT, UNDER_REVIEW, REVISION_REQUIRED, SEALED, RECALLED

  - name: DesignAnalysis
    parent: BinDesign
    common_fields: true
    fields:
      - name: bin_design_id
        type: string
        source: system
        description: FK -> {BinDesign}.id; design this analysis evaluates
      - name: design_method
        type: enum
        source: input
        description: structural method this analysis run applies, independent of BinDesign.design_method
        constraints: one of ASD, LRFD
      - name: allowable_kpa_m
        type: number
        source: computed
        description: allowable per-stiffener capacity for design_method per calculations.structural_stiffener_requirement
      - name: governing_load_case
        type: enum
        source: computed
        description: governing load case observed by this analysis run
        constraints: one of GRAIN_LATERAL, WIND_UPLIFT, SEISMIC_BASE_SHEAR
      - name: governing_demand_kpa
        type: number
        source: computed
        description: governing demand observed by this analysis run, 3 decimal places
      - name: required_stiffener_count
        type: integer
        source: computed
        description: stiffener count this analysis run derives under its own design_method
      - name: utilization_ratio
        type: number
        source: computed
        description: governing demand over installed capacity for this run, 4 decimal places
      - name: verdict
        type: enum
        source: computed
        description: PASS when utilization_ratio is at or below 1.0, otherwise FAIL
        constraints: one of PASS, FAIL
      - name: analysis_index
        type: integer
        source: computed
        description: 1-based ordinal of this analysis within its BinDesign, assigned in creation order
      - name: superseded
        type: boolean
        source: computed
        description: set true for every prior analysis of the design when POST /bin-designs/{id}/revise runs
        default: false

  - name: CoilLot
    parent: null
    common_fields: true
    fields:
      - name: coating_spec_id
        type: string
        source: input
        description: FK -> {CoatingSpec}.id; coating carried by this coil lot
      - name: heat_number
        type: string
        source: input
        description: mill heat number, unique across CoilLot
        constraints: unique
      - name: gauge_mm
        type: number
        source: input
        description: coil gauge in millimetres
        constraints: 0.8..6.0
      - name: received_kg
        type: number
        source: input
        description: mass received into the plant, immutable after creation
        constraints: 100.0..200000.0
      - name: reserved_kg
        type: number
        source: computed
        description: sum of planned_kg over this lot's RollFormingRun rows in status SCHEDULED
        default: 0
      - name: consumed_kg
        type: number
        source: computed
        description: sum of consumed_kg over this lot's RollFormingRun rows in status COMPLETED
        default: 0
      - name: scrap_kg
        type: number
        source: computed
        description: sum of scrap_kg over this lot's RollFormingRun rows in status COMPLETED
        default: 0
      - name: remaining_kg
        type: number
        source: computed
        description: received_kg minus reserved_kg minus consumed_kg minus scrap_kg, 2 decimal places
        default: 0
      - name: status
        type: enum
        source: computed
        description: AVAILABLE while remaining_kg is above 0; DEPLETED once remaining_kg reaches 0; QUARANTINED once a COATING_INADEQUATE determination names this lot's coating_spec_id
        default: AVAILABLE
        constraints: one of AVAILABLE, DEPLETED, QUARANTINED

  - name: RollFormingRun
    parent: null
    common_fields: true
    fields:
      - name: roll_forming_line_id
        type: string
        source: input
        description: FK -> {RollFormingLine}.id; line occupied by this run
      - name: coil_lot_id
        type: string
        source: input
        description: FK -> {CoilLot}.id; coil consumed by this run
      - name: dealer_order_id
        type: string
        source: input
        description: FK -> {DealerOrder}.id; order whose kit this run forms
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the line occupation window
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the line occupation window
      - name: planned_kg
        type: number
        source: input
        description: mass reserved from the coil lot while the run is SCHEDULED
        constraints: 1.0..200000.0
      - name: coating_code
        type: string
        source: computed
        description: CoatingSpec.coating_code of the referenced coil lot, copied at creation and used for changeover-buffer comparison
      - name: consumed_kg
        type: number
        source: computed
        description: mass actually drawn from the lot, posted by POST /roll-forming-runs/{id}/complete, reset to 0 by void
        default: 0
      - name: scrap_kg
        type: number
        source: computed
        description: mass scrapped, posted by POST /roll-forming-runs/{id}/complete, reset to 0 by void
        default: 0
      - name: status
        type: enum
        source: computed
        description: run lifecycle state
        default: SCHEDULED
        constraints: one of SCHEDULED, COMPLETED, VOIDED

  - name: DealerOrder
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: FK -> {Dealer}.id; ordering dealership
      - name: bin_design_id
        type: string
        source: input
        description: FK -> {BinDesign}.id; design whose kit is being ordered
      - name: freight_load_id
        type: string
        source: computed
        description: FK -> {FreightLoad}.id; load this order is currently assigned to, null when unassigned
        default: null
      - name: installation_crew_id
        type: string
        source: computed
        description: FK -> {InstallationCrew}.id; crew assigned by POST /dealer-orders/{id}/assign-crew, null when unassigned
        default: null
      - name: order_season
        type: enum
        source: input
        description: commercial season the order is booked into; must equal the season derived from the logical clock month
        constraints: one of PRESEASON, HARVEST_PEAK, OFFSEASON
      - name: aeration_package
        type: enum
        source: input
        description: aeration and drying package selecting the airflow multiplier and fan count
        constraints: one of NONE, AERATION, DRYING_FULL
      - name: unload_system
        type: enum
        source: input
        description: unloading system selecting the discharge rate and the UNLOAD_SYSTEM kit line
        constraints: one of GRAVITY, SWEEP_AUGER, POWER_SWEEP
      - name: kit_subtotal_cents
        type: integer
        source: computed
        description: sum of KitLine.extended_cents per calculations.kit_bill_of_materials
      - name: season_uplift_cents
        type: integer
        source: computed
        description: SEASON_UPLIFT_PCT of kit_subtotal_cents, negative for PRESEASON
      - name: program_discount_cents
        type: integer
        source: computed
        description: PROGRAM_DISCOUNT_PCT of kit_subtotal_cents plus season_uplift_cents
      - name: net_subtotal_cents
        type: integer
        source: computed
        description: kit_subtotal_cents plus season_uplift_cents minus program_discount_cents; this field selects the freight tier
      - name: freight_surcharge_pct
        type: number
        source: computed
        description: FREIGHT_SURCHARGE_TIERS rate selected by net_subtotal_cents
      - name: freight_surcharge_cents
        type: integer
        source: computed
        description: net_subtotal_cents multiplied by freight_surcharge_pct
      - name: total_cents
        type: integer
        source: computed
        description: net_subtotal_cents plus freight_surcharge_cents
      - name: required_deposit_cents
        type: integer
        source: computed
        description: DEPOSIT_PCT of total_cents
      - name: credit_hold_cents
        type: integer
        source: computed
        description: total_cents minus required_deposit_cents while the order is non-terminal, otherwise 0
        default: 0
      - name: deposit_paid_cents
        type: integer
        source: computed
        description: cumulative deposit received via POST /dealer-orders/{id}/payments
        default: 0
      - name: kit_weight_kg
        type: number
        source: computed
        description: sum of KitLine.weight_kg, 2 decimal places
      - name: kit_cube_m3
        type: number
        source: computed
        description: sum of KitLine.cube_m3, 3 decimal places
      - name: grain_mass_kg
        type: number
        source: computed
        description: BinDesign.capacity_m3 multiplied by GrainProfile.bulk_density_kg_per_m3, 2 decimal places
      - name: required_fan_cfm
        type: integer
        source: computed
        description: aeration airflow requirement per calculations.aeration_and_drying_capacity, 0 when aeration_package is NONE
      - name: drying_hours_estimate
        type: integer
        source: computed
        description: whole hours of drying implied by required_fan_cfm and grain_mass_kg, 0 when aeration_package is NONE
      - name: unload_rate_bph
        type: integer
        source: computed
        description: discharge rate in bushels per hour for the chosen unload_system
      - name: allocated_freight_cents
        type: integer
        source: computed
        description: this order's share of its FreightLoad.linehaul_cost_cents per calculations.freight_load_allocation, 0 when unassigned
        default: 0
      - name: freight_sequence
        type: integer
        source: computed
        description: 1-based assignment ordinal within the current FreightLoad, used as the rounding-residual target; null when unassigned
        default: null
      - name: production_status
        type: enum
        source: computed
        description: production dimension of the order state
        default: DRAFT
        constraints: one of DRAFT, QUEUED, KITTED, SHIPPED, HOLD_CREDIT, HOLD_ENGINEERING, CANCELLED
      - name: financial_status
        type: enum
        source: computed
        description: financial dimension of the order state, advancing independently of production_status
        default: AWAITING_DEPOSIT
        constraints: one of AWAITING_DEPOSIT, DEPOSIT_PAID, RELEASED, VOIDED
      - name: installation_readiness
        type: enum
        source: computed
        description: installation dimension of the order state
        default: UNASSIGNED
        constraints: one of UNASSIGNED, ASSIGNED, BLOCKED

  - name: KitLine
    parent: DealerOrder
    common_fields: false
    fields:
      - name: dealer_order_id
        type: string
        source: system
        description: FK -> {DealerOrder}.id; order this bill-of-materials line belongs to
      - name: component_code
        type: enum
        source: computed
        description: kit component this line prices
        constraints: one of SIDEWALL_SHEET, STIFFENER, ROOF_PANEL, ANCHOR_BOLT, BOLT_PACK, AERATION_FAN, UNLOAD_SYSTEM
      - name: quantity
        type: integer
        source: computed
        description: component count derived by calculations.kit_bill_of_materials
      - name: unit_price_cents
        type: integer
        source: computed
        description: COMPONENT_BASE_PRICE_CENTS plus the rounded coating adder for steel components
      - name: extended_cents
        type: integer
        source: computed
        description: quantity multiplied by unit_price_cents
      - name: weight_kg
        type: number
        source: computed
        description: quantity multiplied by COMPONENT_WEIGHT_KG, 2 decimal places
      - name: cube_m3
        type: number
        source: computed
        description: quantity multiplied by COMPONENT_CUBE_M3, 3 decimal places

  - name: FreightLoad
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: FK -> {Dealer}.id; destination dealer yard
      - name: trailer_type
        type: enum
        source: input
        description: trailer selecting cube and weight capacity, linehaul base cost, and whether the high-cube utilization gate applies
        constraints: one of FLATBED, HIGH_CUBE_VAN, STEP_DECK
      - name: allocation_basis
        type: enum
        source: input
        description: prorate basis for splitting linehaul_cost_cents across assigned orders
        constraints: one of WEIGHT, CUBE
      - name: yard_window_start
        type: datetime
        source: input
        description: inclusive start of the dealer-yard staging window
      - name: yard_window_end
        type: datetime
        source: input
        description: inclusive end of the dealer-yard staging window
      - name: max_cube_m3
        type: number
        source: computed
        description: cube capacity for trailer_type from TRAILER_CUBE_M3
      - name: max_weight_kg
        type: integer
        source: computed
        description: payload capacity for trailer_type from TRAILER_WEIGHT_KG
      - name: assigned_cube_m3
        type: number
        source: computed
        description: sum of DealerOrder.kit_cube_m3 over orders whose freight_load_id is this load, 3 decimal places
        default: 0
      - name: assigned_weight_kg
        type: number
        source: computed
        description: sum of DealerOrder.kit_weight_kg over orders whose freight_load_id is this load, 2 decimal places
        default: 0
      - name: cube_utilization_pct
        type: number
        source: computed
        description: assigned_cube_m3 over max_cube_m3 as a percentage, 2 decimal places
        default: 0
      - name: linehaul_cost_cents
        type: integer
        source: computed
        description: LINEHAUL_BASE_CENTS for trailer_type plus LINEHAUL_PER_KG_CENTS multiplied by assigned_weight_kg
        default: 0
      - name: order_count
        type: integer
        source: computed
        description: count of DealerOrder rows whose freight_load_id is this load
        default: 0
      - name: status
        type: enum
        source: computed
        description: load lifecycle state
        default: PLANNED
        constraints: one of PLANNED, DISPATCHED, DELIVERED, CANCELLED

  - name: InstallationCrew
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: FK -> {Dealer}.id; dealership the crew works for
      - name: crew_name
        type: string
        source: input
        description: crew identifier
      - name: certification_tier
        type: enum
        source: input
        description: certification tier supplied at creation and downgraded one step by an INSTALLATION_DEFECT determination
        constraints: one of T1, T2, T3
      - name: max_diameter_m
        type: number
        source: computed
        description: largest BinDesign.diameter_m this tier may erect, from CREW_TIER_MAX_DIAMETER_M
      - name: certified_until
        type: datetime
        source: input
        description: instant after which the certification is expired for assignment purposes
      - name: status
        type: enum
        source: computed
        description: CERTIFIED at creation; PROBATION after a downgrade from T2 or T3; REVOKED when a T1 crew is downgraded
        default: CERTIFIED
        constraints: one of CERTIFIED, PROBATION, REVOKED

  - name: FieldFailure
    parent: null
    common_fields: true
    fields:
      - name: dealer_order_id
        type: string
        source: input
        description: FK -> {DealerOrder}.id; order whose erected bin failed in service
      - name: bin_design_id
        type: string
        source: system
        description: FK -> {BinDesign}.id; copied from the referenced order's bin_design_id at intake
      - name: failure_mode
        type: enum
        source: input
        description: observed failure mode reported from the field
        constraints: one of SIDEWALL_BUCKLE, ROOF_COLLAPSE, CORROSION_PERFORATION, ANCHOR_PULLOUT
      - name: observed_load_kpa
        type: number
        source: input
        description: lateral load reconstructed from field evidence, kPa
        constraints: 0.0..500.0
      - name: measured_coating_loss_pct
        type: number
        source: input
        description: measured zinc loss at the failure location, percent
        constraints: 0.0..100.0
      - name: service_years
        type: number
        source: input
        description: years in service at the time of failure
        constraints: 0.0..60.0
      - name: structural_verdict
        type: enum
        source: computed
        description: EXCEEDS_DESIGN when observed_load_kpa is above BinDesign.governing_demand_kpa, otherwise WITHIN_DESIGN; assigned by POST /field-failures/{id}/start-analysis
        default: null
        constraints: one of WITHIN_DESIGN, EXCEEDS_DESIGN
      - name: corrosion_verdict
        type: enum
        source: computed
        description: EXCEEDS_CLASS when measured_coating_loss_pct is above CORROSION_LOSS_LIMIT for the design's CoatingSpec.corrosion_class, otherwise WITHIN_CLASS; assigned by POST /field-failures/{id}/start-analysis
        default: null
        constraints: one of WITHIN_CLASS, EXCEEDS_CLASS
      - name: determined_cause
        type: enum
        source: computed
        description: root cause fixed by calculations.failure_root_cause_determination on POST /field-failures/{id}/determine
        default: null
        constraints: one of STRUCTURAL_UNDERDESIGN, COATING_INADEQUATE, INSTALLATION_DEFECT, OVERLOAD_MISUSE
      - name: status
        type: enum
        source: computed
        description: investigation lifecycle state
        default: INTAKE
        constraints: one of INTAKE, ANALYSIS_IN_PROGRESS, DETERMINED

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Engineer
    initial_state: ACTIVE
    terminal_states: [LAPSED]
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /engineers/{id}/lapse"
        actor: PlantAdmin
        preconditions: ["Engineer.status == ACTIVE"]
        side_effects:
          - "sets Engineer.status = LAPSED"
          - "increments Engineer.version by 1"
        note: "A LAPSED engineer may no longer author, revise, or seal a BinDesign; existing designs are untouched."

  - entity: Dealer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "system event: Dealer.credit_available_cents becomes negative after recomputation of calculations.dealer_credit_ledger (reached from POST /dealers/{id}/credit-limit or POST /dealer-orders/{id}/confirm)"
        actor: system
        preconditions: ["Dealer.status == ACTIVE", "Dealer.credit_available_cents < 0 after recomputation"]
        side_effects:
          - "sets Dealer.status = CREDIT_HOLD"
          - "cascade hop 2 (caused by the dealer entering CREDIT_HOLD, not by the original request): every DealerOrder with dealer_id == this dealer and production_status == QUEUED moves to HOLD_CREDIT"
          - "increments Dealer.version by 1 and each affected DealerOrder.version by 1"
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "system event: Dealer.credit_available_cents becomes zero or positive after recomputation of calculations.dealer_credit_ledger (reached from POST /dealer-orders/{id}/cancel or POST /dealers/{id}/credit-limit)"
        actor: system
        preconditions: ["Dealer.status == CREDIT_HOLD", "Dealer.credit_available_cents >= 0 after recomputation"]
        side_effects:
          - "sets Dealer.status = ACTIVE"
          - "cascade hop 3 (caused by the dealer returning to ACTIVE): every DealerOrder with dealer_id == this dealer and production_status == HOLD_CREDIT moves back to QUEUED"
          - "increments Dealer.version by 1 and each affected DealerOrder.version by 1"

  - entity: BinDesign
    initial_state: DRAFT
    terminal_states: [RECALLED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /bin-designs/{id}/submit-review"
        actor: DesignEngineer
        preconditions:
          - "BinDesign.status == DRAFT"
          - "at least one DesignAnalysis exists with bin_design_id == this design, superseded == false, and design_method == BinDesign.design_method"
          - "the governing analysis (greatest analysis_index among those rows) has verdict == PASS"
        side_effects:
          - "sets BinDesign.status = UNDER_REVIEW"
          - "increments BinDesign.version by 1"
      - from: UNDER_REVIEW
        to: REVISION_REQUIRED
        trigger: "POST /bin-designs/{id}/request-revision"
        actor: SealingEngineer
        preconditions:
          - "BinDesign.status == UNDER_REVIEW"
          - "the acting Engineer id is not equal to BinDesign.author_engineer_id"
        side_effects:
          - "sets BinDesign.status = REVISION_REQUIRED"
          - "increments BinDesign.version by 1"
      - from: REVISION_REQUIRED
        to: DRAFT
        trigger: "POST /bin-designs/{id}/revise"
        actor: DesignEngineer
        preconditions:
          - "BinDesign.status == REVISION_REQUIRED"
          - "the acting Engineer.status == ACTIVE and the referenced Jurisdiction.code appears in that Engineer.licensed_jurisdiction_codes"
        side_effects:
          - "overwrites the supplied geometry, loading, and design_method inputs and re-runs calculations.bin_geometry_and_capacity and calculations.structural_stiffener_requirement, refreshing every computed geometry and structural field"
          - "increments BinDesign.revision_round by 1"
          - "sets superseded = true on every DesignAnalysis with bin_design_id == this design"
          - "sets BinDesign.author_engineer_id to the acting Engineer id"
          - "sets BinDesign.status = DRAFT, closing the revision cycle"
          - "increments BinDesign.version by 1"
        note: "This is the cycle edge: DRAFT -> UNDER_REVIEW -> REVISION_REQUIRED -> DRAFT, repeatable, with revision_round as the loop counter."
      - from: UNDER_REVIEW
        to: SEALED
        trigger: "POST /bin-designs/{id}/seal"
        actor: SealingEngineer
        preconditions:
          - "BinDesign.status == UNDER_REVIEW"
          - "the acting Engineer id is not equal to BinDesign.author_engineer_id"
          - "the acting Engineer.status == ACTIVE"
          - "the referenced Jurisdiction.code appears in the acting Engineer.licensed_jurisdiction_codes"
        side_effects:
          - "sets BinDesign.sealed_by_engineer_id to the acting Engineer id"
          - "sets BinDesign.sealed_at to the current logical clock value"
          - "sets BinDesign.permit_ready_at = sealed_at plus Jurisdiction.permit_review_days whole days"
          - "sets BinDesign.status = SEALED"
          - "increments BinDesign.version by 1"
      - from: SEALED
        to: RECALLED
        trigger: "system event: a FieldFailure on this design reaches DETERMINED with determined_cause == STRUCTURAL_UNDERDESIGN (POST /field-failures/{id}/determine)"
        actor: system
        preconditions: ["BinDesign.status == SEALED"]
        side_effects:
          - "sets BinDesign.status = RECALLED (cascade hop 1)"
          - "cascade hop 2 (caused by the design entering RECALLED): every DealerOrder with bin_design_id == this design and production_status IN {QUEUED, KITTED} moves to HOLD_ENGINEERING"
          - "increments BinDesign.version by 1"
      - from: UNDER_REVIEW
        to: RECALLED
        trigger: "system event: a FieldFailure on this design reaches DETERMINED with determined_cause == STRUCTURAL_UNDERDESIGN (POST /field-failures/{id}/determine)"
        actor: system
        preconditions: ["BinDesign.status == UNDER_REVIEW"]
        side_effects:
          - "sets BinDesign.status = RECALLED (cascade hop 1)"
          - "cascade hop 2 (caused by the design entering RECALLED): every DealerOrder with bin_design_id == this design and production_status IN {QUEUED, KITTED} moves to HOLD_ENGINEERING"
          - "increments BinDesign.version by 1"

  - entity: DesignAnalysis
    initial_state: CURRENT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: CURRENT
        to: SUPERSEDED
        trigger: "POST /bin-designs/{id}/revise"
        actor: DesignEngineer
        preconditions: ["DesignAnalysis.superseded == false"]
        side_effects:
          - "sets DesignAnalysis.superseded = true"
          - "increments DesignAnalysis.version by 1"
        note: "Modelled on the boolean field `superseded`: CURRENT means superseded == false, SUPERSEDED means superseded == true. Superseded rows are excluded from the submit-review governing-analysis selection."

  - entity: DealerOrder
    initial_state: DRAFT
    terminal_states: [CANCELLED, SHIPPED]
    note: |
      Parallel state dimensions on one row. `production_status` (DRAFT, QUEUED, KITTED, SHIPPED,
      HOLD_CREDIT, HOLD_ENGINEERING, CANCELLED) and `financial_status` (AWAITING_DEPOSIT,
      DEPOSIT_PAID, RELEASED, VOIDED) advance on different triggers and neither reads the other
      as a precondition, except that `cancel` terminates both at once. `installation_readiness`
      (UNASSIGNED, ASSIGNED, BLOCKED) is a third independent dimension driven only by crew
      assignment and by crew decertification. `initial_state` and `terminal_states` above name the
      production dimension.
    transitions:
      - from: "production_status DRAFT"
        to: "production_status QUEUED"
        trigger: "POST /dealer-orders/{id}/confirm"
        actor: DealerPrincipal
        preconditions:
          - "DealerOrder.production_status == DRAFT"
          - "BinDesign.status == SEALED when BinDesign.seal_required is true, otherwise BinDesign.status IN {UNDER_REVIEW, SEALED}"
          - "current logical clock is at or after BinDesign.permit_ready_at when BinDesign.seal_required is true"
          - "Dealer.credit_available_cents >= DealerOrder.credit_hold_cents"
        side_effects:
          - "sets DealerOrder.production_status = QUEUED"
          - "recomputes Dealer.credit_committed_cents and Dealer.credit_available_cents per calculations.dealer_credit_ledger"
          - "increments DealerOrder.version by 1 and Dealer.version by 1"
        note: "financial_status is untouched by this transition and remains AWAITING_DEPOSIT."
      - from: "financial_status AWAITING_DEPOSIT"
        to: "financial_status DEPOSIT_PAID"
        trigger: "POST /dealer-orders/{id}/payments"
        actor: DealerPrincipal
        preconditions:
          - "DealerOrder.financial_status == AWAITING_DEPOSIT"
          - "DealerOrder.production_status NOT IN {CANCELLED}"
          - "amount_cents == DealerOrder.required_deposit_cents"
        side_effects:
          - "sets DealerOrder.deposit_paid_cents = amount_cents"
          - "sets DealerOrder.financial_status = DEPOSIT_PAID"
          - "increments DealerOrder.version by 1"
        note: "production_status is untouched by this transition; a DRAFT order may pay its deposit before confirmation."
      - from: "production_status QUEUED"
        to: "production_status KITTED"
        trigger: "POST /roll-forming-runs/{id}/complete on a RollFormingRun whose dealer_order_id is this order"
        actor: ProductionPlanner
        preconditions:
          - "DealerOrder.production_status == QUEUED"
          - "RollFormingRun.status == SCHEDULED"
        side_effects:
          - "sets DealerOrder.production_status = KITTED"
          - "increments DealerOrder.version by 1"
      - from: "production_status KITTED"
        to: "production_status QUEUED"
        trigger: "POST /roll-forming-runs/{id}/void on a COMPLETED RollFormingRun whose dealer_order_id is this order"
        actor: ProductionPlanner
        preconditions:
          - "DealerOrder.production_status == KITTED"
          - "RollFormingRun.status == COMPLETED"
        side_effects:
          - "sets DealerOrder.production_status = QUEUED"
          - "increments DealerOrder.version by 1"
        note: "Compensating edge for the KITTED transition; paired with the CoilLot mass restoration on the run's void."
      - from: "production_status QUEUED or KITTED"
        to: "production_status SHIPPED"
        trigger: "POST /freight-loads/{id}/dispatch"
        actor: LogisticsCoordinator
        preconditions:
          - "DealerOrder.freight_load_id == the dispatched FreightLoad.id"
          - "DealerOrder.production_status IN {QUEUED, KITTED}"
          - "DealerOrder.financial_status == DEPOSIT_PAID"
        side_effects:
          - "sets DealerOrder.production_status = SHIPPED"
          - "increments DealerOrder.version by 1"
      - from: "financial_status DEPOSIT_PAID"
        to: "financial_status RELEASED"
        trigger: "POST /freight-loads/{id}/deliver"
        actor: LogisticsCoordinator
        preconditions:
          - "DealerOrder.freight_load_id == the delivered FreightLoad.id"
          - "DealerOrder.financial_status == DEPOSIT_PAID"
        side_effects:
          - "sets DealerOrder.financial_status = RELEASED"
          - "sets DealerOrder.credit_hold_cents = 0 and recomputes Dealer.credit_committed_cents and Dealer.credit_available_cents"
          - "increments DealerOrder.version by 1 and Dealer.version by 1"
      - from: "production_status QUEUED"
        to: "production_status HOLD_CREDIT"
        trigger: "system event: the owning Dealer transitions ACTIVE -> CREDIT_HOLD"
        actor: system
        preconditions: ["DealerOrder.production_status == QUEUED", "Dealer.status == CREDIT_HOLD"]
        side_effects:
          - "sets DealerOrder.production_status = HOLD_CREDIT"
          - "increments DealerOrder.version by 1"
      - from: "production_status HOLD_CREDIT"
        to: "production_status QUEUED"
        trigger: "system event: the owning Dealer transitions CREDIT_HOLD -> ACTIVE"
        actor: system
        preconditions: ["DealerOrder.production_status == HOLD_CREDIT", "Dealer.status == ACTIVE"]
        side_effects:
          - "sets DealerOrder.production_status = QUEUED"
          - "increments DealerOrder.version by 1"
      - from: "production_status QUEUED or KITTED"
        to: "production_status HOLD_ENGINEERING"
        trigger: "system event: the referenced BinDesign transitions to RECALLED"
        actor: system
        preconditions: ["DealerOrder.production_status IN {QUEUED, KITTED}", "BinDesign.status == RECALLED"]
        side_effects:
          - "sets DealerOrder.production_status = HOLD_ENGINEERING"
          - "cascade hop 3 (caused by this order leaving the shippable set, not by the determination request): when DealerOrder.freight_load_id is not null and that FreightLoad.status == PLANNED, the order is detached - freight_load_id = null, allocated_freight_cents = 0, freight_sequence = null - and the load's assigned_cube_m3, assigned_weight_kg, cube_utilization_pct, linehaul_cost_cents and order_count are recomputed, then calculations.freight_load_allocation is re-run over the orders that remain, re-numbering their freight_sequence in ascending created_at order"
          - "increments DealerOrder.version by 1 and, when a detach occurred, FreightLoad.version by 1"
      - from: "production_status DRAFT, QUEUED, KITTED, HOLD_CREDIT or HOLD_ENGINEERING"
        to: "production_status CANCELLED and financial_status VOIDED"
        trigger: "POST /dealer-orders/{id}/cancel"
        actor: DealerPrincipal
        preconditions: ["DealerOrder.production_status NOT IN {SHIPPED, CANCELLED}"]
        side_effects:
          - "sets DealerOrder.production_status = CANCELLED and DealerOrder.financial_status = VOIDED (cascade hop 1)"
          - "sets DealerOrder.credit_hold_cents = 0 and detaches the order from any FreightLoad in status PLANNED exactly as in the HOLD_ENGINEERING transition"
          - "cascade hop 2 (caused by the credit hold being released): Dealer.credit_committed_cents and Dealer.credit_available_cents are recomputed per calculations.dealer_credit_ledger, which may drive the Dealer CREDIT_HOLD -> ACTIVE transition"
          - "increments DealerOrder.version by 1 and Dealer.version by 1"
      - from: "installation_readiness UNASSIGNED"
        to: "installation_readiness ASSIGNED"
        trigger: "POST /dealer-orders/{id}/assign-crew"
        actor: PlantAdmin
        preconditions:
          - "DealerOrder.installation_crew_id is null"
          - "DealerOrder.production_status NOT IN {CANCELLED, SHIPPED}"
          - "InstallationCrew.status == CERTIFIED"
          - "InstallationCrew.dealer_id == DealerOrder.dealer_id"
          - "BinDesign.diameter_m <= InstallationCrew.max_diameter_m"
          - "current logical clock is at or before InstallationCrew.certified_until"
        side_effects:
          - "sets DealerOrder.installation_crew_id and DealerOrder.installation_readiness = ASSIGNED"
          - "increments DealerOrder.version by 1"
      - from: "installation_readiness ASSIGNED"
        to: "installation_readiness BLOCKED"
        trigger: "system event: the assigned InstallationCrew leaves CERTIFIED"
        actor: system
        preconditions: ["DealerOrder.installation_readiness == ASSIGNED", "InstallationCrew.status IN {PROBATION, REVOKED}"]
        side_effects:
          - "sets DealerOrder.installation_readiness = BLOCKED"
          - "increments DealerOrder.version by 1"

  - entity: CoilLot
    initial_state: AVAILABLE
    terminal_states: [QUARANTINED]
    transitions:
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system event: calculations.coil_mass_ledger recomputation leaves remaining_kg == 0 (reached from POST /roll-forming-runs or POST /roll-forming-runs/{id}/complete)"
        actor: system
        preconditions: ["CoilLot.status == AVAILABLE", "CoilLot.remaining_kg == 0 after recomputation"]
        side_effects:
          - "sets CoilLot.status = DEPLETED"
          - "increments CoilLot.version by 1"
      - from: DEPLETED
        to: AVAILABLE
        trigger: "system event: calculations.coil_mass_ledger recomputation leaves remaining_kg above 0 (reached from POST /roll-forming-runs/{id}/void)"
        actor: system
        preconditions: ["CoilLot.status == DEPLETED", "CoilLot.remaining_kg > 0 after recomputation"]
        side_effects:
          - "sets CoilLot.status = AVAILABLE"
          - "increments CoilLot.version by 1"
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "system event: a FieldFailure reaches DETERMINED with determined_cause == COATING_INADEQUATE and this lot's coating_spec_id equals the failed BinDesign.coating_spec_id"
        actor: system
        preconditions: ["CoilLot.status == AVAILABLE"]
        side_effects:
          - "sets CoilLot.status = QUARANTINED (cascade hop 1)"
          - "cascade hop 2 (caused by the lot entering QUARANTINED): every RollFormingRun with coil_lot_id == this lot and status == SCHEDULED moves to VOIDED"
          - "increments CoilLot.version by 1"
      - from: DEPLETED
        to: QUARANTINED
        trigger: "system event: a FieldFailure reaches DETERMINED with determined_cause == COATING_INADEQUATE and this lot's coating_spec_id equals the failed BinDesign.coating_spec_id"
        actor: system
        preconditions: ["CoilLot.status == DEPLETED"]
        side_effects:
          - "sets CoilLot.status = QUARANTINED (cascade hop 1)"
          - "cascade hop 2 (caused by the lot entering QUARANTINED): every RollFormingRun with coil_lot_id == this lot and status == SCHEDULED moves to VOIDED"
          - "increments CoilLot.version by 1"

  - entity: RollFormingRun
    initial_state: SCHEDULED
    terminal_states: [VOIDED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /roll-forming-runs/{id}/complete"
        actor: ProductionPlanner
        preconditions:
          - "RollFormingRun.status == SCHEDULED"
          - "consumed_kg + scrap_kg <= RollFormingRun.planned_kg"
        side_effects:
          - "sets RollFormingRun.consumed_kg and RollFormingRun.scrap_kg from the request"
          - "sets RollFormingRun.status = COMPLETED"
          - "recomputes the CoilLot reserved_kg, consumed_kg, scrap_kg and remaining_kg per calculations.coil_mass_ledger"
          - "advances the run's DealerOrder production_status QUEUED -> KITTED"
          - "increments RollFormingRun.version by 1, CoilLot.version by 1, DealerOrder.version by 1"
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /roll-forming-runs/{id}/void"
        actor: ProductionPlanner
        preconditions: ["RollFormingRun.status == COMPLETED"]
        side_effects:
          - "sets RollFormingRun.consumed_kg = 0 and RollFormingRun.scrap_kg = 0"
          - "sets RollFormingRun.status = VOIDED"
          - "recomputes the CoilLot ledger, restoring CoilLot.remaining_kg to satisfy received_kg == remaining_kg + reserved_kg + consumed_kg + scrap_kg with zero drift"
          - "reverts the run's DealerOrder production_status KITTED -> QUEUED"
          - "increments RollFormingRun.version by 1, CoilLot.version by 1, DealerOrder.version by 1"
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /roll-forming-runs/{id}/void, or system event: the run's CoilLot enters QUARANTINED"
        actor: ProductionPlanner | system
        preconditions: ["RollFormingRun.status == SCHEDULED"]
        side_effects:
          - "sets RollFormingRun.status = VOIDED"
          - "cascade hop 3 (caused by the run leaving SCHEDULED, not by the quarantine itself): the CoilLot reserved_kg drops by this run's planned_kg and remaining_kg is recomputed per calculations.coil_mass_ledger"
          - "increments RollFormingRun.version by 1 and CoilLot.version by 1"
        note: "The run's DealerOrder is untouched here because a SCHEDULED run never advanced it to KITTED."

  - entity: FreightLoad
    initial_state: PLANNED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /freight-loads/{id}/dispatch"
        actor: LogisticsCoordinator
        preconditions:
          - "FreightLoad.status == PLANNED"
          - "FreightLoad.order_count >= 1"
          - "FreightLoad.cube_utilization_pct >= MIN_CUBE_UTILIZATION_PCT when trailer_type == HIGH_CUBE_VAN; no utilization floor applies to FLATBED or STEP_DECK"
          - "every assigned DealerOrder has financial_status == DEPOSIT_PAID"
          - "every assigned DealerOrder has production_status IN {QUEUED, KITTED}"
        side_effects:
          - "sets FreightLoad.status = DISPATCHED"
          - "advances every assigned DealerOrder production_status to SHIPPED"
          - "recomputes Dealer.staged_kit_count (the load leaves the PLANNED set, freeing its yard slot)"
          - "increments FreightLoad.version by 1, each DealerOrder.version by 1, Dealer.version by 1"
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /freight-loads/{id}/deliver"
        actor: LogisticsCoordinator
        preconditions: ["FreightLoad.status == DISPATCHED"]
        side_effects:
          - "sets FreightLoad.status = DELIVERED"
          - "advances every assigned DealerOrder financial_status DEPOSIT_PAID -> RELEASED and zeroes its credit_hold_cents"
          - "recomputes Dealer.credit_committed_cents and Dealer.credit_available_cents, which may drive Dealer CREDIT_HOLD -> ACTIVE"
          - "increments FreightLoad.version by 1, each DealerOrder.version by 1, Dealer.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /freight-loads/{id}/cancel, or system event: FreightLoad.order_count reaches 0 after an order detach"
        actor: LogisticsCoordinator | system
        preconditions: ["FreightLoad.status == PLANNED"]
        side_effects:
          - "sets FreightLoad.status = CANCELLED (cascade hop 4 when reached from an order detach)"
          - "detaches any orders still attached - freight_load_id = null, allocated_freight_cents = 0, freight_sequence = null - when reached from the explicit cancel endpoint"
          - "recomputes Dealer.staged_kit_count, releasing the yard staging slot"
          - "increments FreightLoad.version by 1, Dealer.version by 1, and each detached DealerOrder.version by 1"

  - entity: InstallationCrew
    initial_state: CERTIFIED
    terminal_states: [REVOKED]
    transitions:
      - from: CERTIFIED
        to: PROBATION
        trigger: "system event: a FieldFailure on an order assigned to this crew reaches DETERMINED with determined_cause == INSTALLATION_DEFECT while certification_tier IN {T2, T3}"
        actor: system
        preconditions: ["InstallationCrew.status == CERTIFIED", "InstallationCrew.certification_tier IN {T2, T3}"]
        side_effects:
          - "downgrades InstallationCrew.certification_tier one step (T3 -> T2, T2 -> T1) and recomputes max_diameter_m (cascade hop 1)"
          - "sets InstallationCrew.status = PROBATION"
          - "cascade hop 2 (caused by the crew leaving CERTIFIED): every DealerOrder with installation_crew_id == this crew and production_status NOT IN {CANCELLED, SHIPPED} moves installation_readiness ASSIGNED -> BLOCKED"
          - "increments InstallationCrew.version by 1 and each affected DealerOrder.version by 1"
      - from: CERTIFIED
        to: REVOKED
        trigger: "system event: a FieldFailure on an order assigned to this crew reaches DETERMINED with determined_cause == INSTALLATION_DEFECT while certification_tier == T1"
        actor: system
        preconditions: ["InstallationCrew.status == CERTIFIED", "InstallationCrew.certification_tier == T1"]
        side_effects:
          - "leaves InstallationCrew.certification_tier at T1 because there is no lower tier"
          - "sets InstallationCrew.status = REVOKED (cascade hop 1)"
          - "cascade hop 2 (caused by the crew leaving CERTIFIED): every DealerOrder with installation_crew_id == this crew and production_status NOT IN {CANCELLED, SHIPPED} moves installation_readiness ASSIGNED -> BLOCKED"
          - "increments InstallationCrew.version by 1 and each affected DealerOrder.version by 1"

  - entity: FieldFailure
    initial_state: INTAKE
    terminal_states: [DETERMINED]
    transitions:
      - from: INTAKE
        to: ANALYSIS_IN_PROGRESS
        trigger: "POST /field-failures/{id}/start-analysis"
        actor: QualityInspector
        preconditions: ["FieldFailure.status == INTAKE"]
        side_effects:
          - "sets FieldFailure.structural_verdict and FieldFailure.corrosion_verdict per calculations.failure_root_cause_determination steps 1 and 2"
          - "sets FieldFailure.status = ANALYSIS_IN_PROGRESS"
          - "increments FieldFailure.version by 1"
      - from: ANALYSIS_IN_PROGRESS
        to: DETERMINED
        trigger: "POST /field-failures/{id}/determine"
        actor: QualityInspector
        preconditions: ["FieldFailure.status == ANALYSIS_IN_PROGRESS"]
        side_effects:
          - "sets FieldFailure.determined_cause per calculations.failure_root_cause_determination step 3"
          - "sets FieldFailure.status = DETERMINED"
          - "branch STRUCTURAL_UNDERDESIGN: drives the referenced BinDesign to RECALLED, which is cascade hop 1 of the four-hop design-recall chain"
          - "branch COATING_INADEQUATE: drives every CoilLot whose coating_spec_id equals the design's coating_spec_id and whose status IN {AVAILABLE, DEPLETED} to QUARANTINED, which is cascade hop 1 of the coating-quarantine chain"
          - "branch INSTALLATION_DEFECT: drives the order's InstallationCrew out of CERTIFIED, which is cascade hop 1 of the crew-decertification chain"
          - "branch OVERLOAD_MISUSE: no cross-entity side effect fires; only FieldFailure itself changes"
          - "increments FieldFailure.version by 1"
        note: "Fork with four divergent side-effect sets selected by determined_cause; the branch is chosen by the calculation, not by request input."

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: analysis-create-stale-design
    parent_entity: BinDesign
    write_endpoint: "POST /bin-designs/{id}/analyses"
    occ_field: "expected_bin_design_version"
    description: |
      Creating a DesignAnalysis against a BinDesign whose version has advanced since the client
      last observed it is rejected. A newly created analysis legitimately becomes the governing
      analysis for submit-review (greatest analysis_index among non-superseded rows matching the
      design's design_method), so a second create carrying an outdated version would silently
      displace a governing analysis the writer never saw. OCC on BinDesign.version reduces this
      to a stale-version check.
    error_id: ERR_STALE_DESIGN_VERSION
    http_status: 412

  - rule_id: freight-load-create-stale-dealer
    parent_entity: Dealer
    write_endpoint: "POST /freight-loads"
    occ_field: "expected_dealer_version"
    description: |
      Creating a FreightLoad against a Dealer whose version has advanced since the client last
      observed it is rejected. Yard staging slots are an aggregate capacity over the dealer's
      PLANNED loads, so a create issued against an outdated view of the dealer can consume a slot
      the writer believed was free. OCC on Dealer.version reduces this to a stale-version check.
    error_id: ERR_STALE_DEALER_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: coating_corrosion_class
    trigger: "POST /coating-specs"
    algorithm: threshold
    formula: |
      z = CoatingSpec.zinc_mass_g_per_m2
      corrosion_class = C2 when z < 300
                        C3 when 300 <= z < 400
                        C4 when 400 <= z < 550
                        C5 when z >= 550
    input_set: "the single CoatingSpec row being created"
    constants:
      ZINC_CLASS_BREAKS_G_PER_M2: [300, 400, 550]
    precision: "integer comparison, no rounding"

  - name: bin_geometry_and_capacity
    trigger: "POST /bin-designs and POST /bin-designs/{id}/revise; side_effects of both refresh sheet_courses, sheets_per_course, sidewall_sheet_count, roof_panel_count, circumference_m, capacity_m3"
    algorithm: aggregation
    formula: |
      sheet_courses       = ceil(eave_height_m / SHEET_COURSE_HEIGHT_M)
      circumference_m     = round(PI * diameter_m, 3)
      sheets_per_course   = ceil(circumference_m / SHEET_WIDTH_M)
      sidewall_sheet_count= sheet_courses * sheets_per_course
      roof_panel_count    = ceil(circumference_m / ROOF_PANEL_ARC_M)
      radius_m            = diameter_m / 2
      cylinder_m3         = PI * radius_m * radius_m * eave_height_m
      roof_rise_m         = radius_m * ROOF_RISE_RATIO[roof_pitch_deg]
      cone_m3             = PI * radius_m * radius_m * roof_rise_m / 3
      capacity_m3         = round(cylinder_m3 + cone_m3, 2)
    input_set: "the BinDesign row being created or revised; no other rows participate"
    constants:
      PI: 3.14159
      SHEET_COURSE_HEIGHT_M: 0.8
      SHEET_WIDTH_M: 1.1
      ROOF_PANEL_ARC_M: 0.9
      ROOF_RISE_RATIO: { 25: 0.466, 30: 0.577, 35: 0.700 }
    precision: |
      circumference_m 3 decimal places round_half_up; capacity_m3 2 decimal places round_half_up;
      every count uses ceil, never round. circumference_m is rounded to 3 places BEFORE it is
      divided by SHEET_WIDTH_M and ROOF_PANEL_ARC_M, so the sheet counts derive from the rounded
      circumference, not from the unrounded product.

  - name: structural_stiffener_requirement
    trigger: "POST /bin-designs, POST /bin-designs/{id}/revise (writing BinDesign.required_stiffener_count, utilization_ratio, governing_load_case, governing_demand_kpa, sheet_gauge_mm, roof_ring_required) and POST /bin-designs/{id}/analyses (writing the same quantities onto DesignAnalysis)"
    algorithm: threshold
    formula: |
      depth_m           = min(eave_height_m, JANSSEN_DEPTH_CAP_M)
      grain_lateral_kpa = round(bulk_density_kg_per_m3 * G * janssen_k_ratio * depth_m / 1000, 3)
      moisture_factor   = 1 + MOISTURE_SURCHARGE_PER_PCT * max(0, moisture_pct - max_safe_moisture_pct)
      grain_demand_kpa  = round(grain_lateral_kpa * moisture_factor, 3)
      wind_demand_kpa   = round(WIND_COEFF * design_wind_speed_mph^2 * eave_height_m / (diameter_m * 1000), 3)
      seismic_demand_kpa= round(SEISMIC_FACTOR[Jurisdiction.seismic_design_category]
                                * bulk_density_kg_per_m3 * G * depth_m / 1000, 3)
      governing_demand_kpa = max(grain_demand_kpa, wind_demand_kpa, seismic_demand_kpa)
      governing_load_case  = GRAIN_LATERAL       when grain_demand_kpa   == governing_demand_kpa
                             else WIND_UPLIFT    when wind_demand_kpa    == governing_demand_kpa
                             else SEISMIC_BASE_SHEAR
      allowable_kpa_m   = STIFFENER_NOMINAL_KPA_M / ASD_SAFETY_FACTOR                        (variant ASD)
                        = STIFFENER_NOMINAL_KPA_M * LRFD_RESISTANCE_FACTOR / LRFD_LOAD_FACTOR (variant LRFD)
      high_wind         = design_wind_speed_mph >= HIGH_WIND_THRESHOLD_MPH
      raw_required      = max(STIFFENER_MIN_COUNT,
                              ceil(governing_demand_kpa * circumference_m / allowable_kpa_m))
                          + (HIGH_WIND_STIFFENER_BONUS when high_wind else 0)
      required_stiffener_count = min(raw_required, STIFFENER_MAX_COUNT)
      utilization_ratio = round(governing_demand_kpa * circumference_m
                                / (required_stiffener_count * allowable_kpa_m), 4)
      verdict           = PASS when utilization_ratio <= 1.0 else FAIL
      sheet_gauge_mm    = lowest value in SHEET_GAUGE_LADDER that is >= governing_demand_kpa * GAUGE_KPA_TO_MM,
                          or 3.0 when no ladder value qualifies
      roof_ring_required= high_wind
    input_set: |
      the BinDesign row plus its referenced GrainProfile (bulk_density_kg_per_m3, janssen_k_ratio,
      max_safe_moisture_pct) and Jurisdiction (seismic_design_category). For a DesignAnalysis the
      design_method comes from the analysis request, not from BinDesign.design_method, so the two
      may disagree.
    constants:
      G: 9.81
      JANSSEN_DEPTH_CAP_M: 12.0
      MOISTURE_SURCHARGE_PER_PCT: 0.04
      WIND_COEFF: 0.9
      SEISMIC_FACTOR: { A: 0.05, B: 0.12, C: 0.22, D: 0.33 }
      HIGH_WIND_THRESHOLD_MPH: 115
      HIGH_WIND_STIFFENER_BONUS: 2
      STIFFENER_NOMINAL_KPA_M: 180.0
      ASD_SAFETY_FACTOR: 2.00
      LRFD_RESISTANCE_FACTOR: 0.90
      LRFD_LOAD_FACTOR: 1.60
      STIFFENER_MIN_COUNT: 4
      STIFFENER_MAX_COUNT: 24
      SHEET_GAUGE_LADDER: [1.0, 1.3, 1.6, 2.0, 2.5, 3.0]
      GAUGE_KPA_TO_MM: 0.05
    precision: |
      every kPa quantity 3 decimal places round_half_up; utilization_ratio 4 decimal places
      round_half_up; the ceil in raw_required is applied to the rounded governing_demand_kpa and
      the rounded circumference_m. The high-wind bonus is added AFTER the max() with
      STIFFENER_MIN_COUNT and BEFORE the min() with STIFFENER_MAX_COUNT.
    variants:
      - name: ASD
        when: "the design_method in force for this evaluation is ASD"
        difference: "allowable_kpa_m = 180.0 / 2.00 = 90.0 kPa-m per stiffener"
      - name: LRFD
        when: "the design_method in force for this evaluation is LRFD"
        difference: "allowable_kpa_m = 180.0 * 0.90 / 1.60 = 101.25 kPa-m per stiffener, which is 12.5 percent higher than ASD and can therefore yield a strictly smaller required_stiffener_count for identical geometry and loading"

  - name: aeration_and_drying_capacity
    trigger: "POST /dealer-orders; side_effects write DealerOrder.grain_mass_kg, required_fan_cfm, drying_hours_estimate and unload_rate_bph"
    algorithm: threshold
    formula: |
      grain_mass_kg   = round(BinDesign.capacity_m3 * GrainProfile.bulk_density_kg_per_m3, 2)
      moisture_excess = max(0, BinDesign.moisture_pct - GrainProfile.max_safe_moisture_pct)
      package_mult    = 0.0                              when aeration_package == NONE
                        1.0                              when aeration_package == AERATION
                        GrainProfile.drying_multiplier   when aeration_package == DRYING_FULL
      base_cfm        = BinDesign.capacity_m3 * GrainProfile.aeration_cfm_per_m3_base
      depth_penalty   = 1 + DEPTH_PENALTY_PER_M * max(0, BinDesign.eave_height_m - DEPTH_PENALTY_FREE_M)
      moisture_penalty= 1 + MOISTURE_CFM_PER_PCT * moisture_excess
      raw_cfm         = base_cfm * package_mult * depth_penalty * moisture_penalty
      required_fan_cfm= ceil(min(MAX_FAN_CFM, raw_cfm))
      drying_hours_estimate =
            0                                                                    when aeration_package == NONE
            ceil(grain_mass_kg / (required_fan_cfm * DRY_RATE_KG_PER_CFM_HR))     when moisture_excess == 0
            ceil(grain_mass_kg * (1 + moisture_excess * WET_HOUR_PER_PCT)
                 / (required_fan_cfm * DRY_RATE_KG_PER_CFM_HR))                   otherwise
      unload_rate_bph = floor(BinDesign.capacity_m3 * GRAVITY_BPH_PER_M3) when unload_system == GRAVITY
                        SWEEP_BPH                                        when unload_system == SWEEP_AUGER
                        POWER_SWEEP_BPH                                  when unload_system == POWER_SWEEP
    input_set: "the DealerOrder being created plus its BinDesign and that design's GrainProfile"
    constants:
      DEPTH_PENALTY_PER_M: 0.03
      DEPTH_PENALTY_FREE_M: 8.0
      MOISTURE_CFM_PER_PCT: 0.12
      FAN_UNIT_CFM: 5000
      MAX_FAN_CFM: 60000
      DRY_RATE_KG_PER_CFM_HR: 0.010
      WET_HOUR_PER_PCT: 0.25
      GRAVITY_BPH_PER_M3: 3
      SWEEP_BPH: 5000
      POWER_SWEEP_BPH: 9000
    precision: |
      grain_mass_kg 2 decimal places round_half_up. required_fan_cfm and drying_hours_estimate are
      whole numbers produced by ceil, never by round; unload_rate_bph for GRAVITY uses floor. The
      min() with MAX_FAN_CFM is applied to raw_cfm BEFORE the ceil, so a raw requirement above the
      cap saturates at exactly 60000 rather than rounding past it. Validation
      ERR_AERATION_UNDERSIZED at priority 13 rejects the order when raw_cfm exceeds MAX_FAN_CFM and
      aeration_package is not NONE, so a saturated required_fan_cfm is never persisted.
    note: |
      Combinatorial mode (a): four multiplicative inputs (capacity, package multiplier, depth
      penalty, moisture penalty) feed a nested min()/ceil, and the drying-hours branch selects on
      whether moisture_excess is exactly 0.

  - name: kit_bill_of_materials
    trigger: "POST /dealer-orders; side_effects create the KitLine rows and write DealerOrder.kit_subtotal_cents, kit_weight_kg and kit_cube_m3"
    algorithm: aggregation
    formula: |
      quantities, in the fixed component order
      [SIDEWALL_SHEET, STIFFENER, ROOF_PANEL, ANCHOR_BOLT, BOLT_PACK, AERATION_FAN, UNLOAD_SYSTEM]:
        SIDEWALL_SHEET = BinDesign.sidewall_sheet_count
        STIFFENER      = BinDesign.required_stiffener_count
        ROOF_PANEL     = BinDesign.roof_panel_count
        ANCHOR_BOLT    = BinDesign.required_stiffener_count * ANCHOR_BOLTS_PER_STIFFENER
        BOLT_PACK      = ceil(BinDesign.sheets_per_course * BOLTS_PER_SEAM / BOLTS_PER_PACK)
                         * BinDesign.sheet_courses
        AERATION_FAN   = 0 when aeration_package == NONE,
                         else ceil(DealerOrder.required_fan_cfm / FAN_UNIT_CFM)
        UNLOAD_SYSTEM  = 0 when unload_system == GRAVITY, else 1
      a KitLine row is emitted only for components whose quantity is 1 or more, in the fixed order above
      unit_price_cents = COMPONENT_BASE_PRICE_CENTS[component_code]
                         + round(COMPONENT_WEIGHT_KG[component_code]
                                 * CoatingSpec.coating_cost_per_kg_cents)   for steel components
                       = COMPONENT_BASE_PRICE_CENTS[component_code]          for AERATION_FAN and UNLOAD_SYSTEM
      extended_cents   = quantity * unit_price_cents
      weight_kg        = round(quantity * COMPONENT_WEIGHT_KG[component_code], 2)
      cube_m3          = round(quantity * COMPONENT_CUBE_M3[component_code], 3)
      kit_subtotal_cents = sum of extended_cents over the emitted KitLine rows
      kit_weight_kg      = round(sum of weight_kg over the emitted KitLine rows, 2)
      kit_cube_m3        = round(sum of cube_m3 over the emitted KitLine rows, 3)
    input_set: "the DealerOrder being created, its BinDesign, and that design's CoatingSpec; only the seven component codes listed above are ever emitted"
    constants:
      ANCHOR_BOLTS_PER_STIFFENER: 4
      BOLTS_PER_SEAM: 18
      BOLTS_PER_PACK: 250
      FAN_UNIT_CFM: 5000
      STEEL_COMPONENTS: [SIDEWALL_SHEET, STIFFENER, ROOF_PANEL, ANCHOR_BOLT, BOLT_PACK]
      COMPONENT_BASE_PRICE_CENTS:
        SIDEWALL_SHEET: 4200
        STIFFENER: 9800
        ROOF_PANEL: 3600
        ANCHOR_BOLT: 450
        BOLT_PACK: 1900
        AERATION_FAN: 285000
        UNLOAD_SYSTEM: 412000
      COMPONENT_WEIGHT_KG:
        SIDEWALL_SHEET: 12.5
        STIFFENER: 41.0
        ROOF_PANEL: 9.4
        ANCHOR_BOLT: 1.2
        BOLT_PACK: 6.0
        AERATION_FAN: 120.0
        UNLOAD_SYSTEM: 340.0
      COMPONENT_CUBE_M3:
        SIDEWALL_SHEET: 0.038
        STIFFENER: 0.055
        ROOF_PANEL: 0.031
        ANCHOR_BOLT: 0.002
        BOLT_PACK: 0.012
        AERATION_FAN: 1.900
        UNLOAD_SYSTEM: 3.400
    precision: |
      Combinatorial mode (b) - nested rounding order is pinned twice and both orders are
      observable.
      (1) BOLT_PACK quantity is ceil-per-course THEN summed over courses:
          ceil(sheets_per_course * BOLTS_PER_SEAM / BOLTS_PER_PACK) * sheet_courses.
          The forbidden alternative reading, sum-then-ceil
          (ceil(sheet_courses * sheets_per_course * BOLTS_PER_SEAM / BOLTS_PER_PACK)), yields a
          strictly smaller pack count for the same bin and is NOT the pinned order.
      (2) the coating adder is rounded per component code to whole cents BEFORE it is multiplied by
          quantity; the forbidden alternative is to multiply the unrounded adder by quantity and
          round the extended amount.
      All money rounding is round_half_up to whole cents; weight 2 decimal places, cube 3 decimal
      places, both round_half_up, applied per KitLine and then again on the order-level sum.

  - name: order_price_and_credit
    trigger: "POST /dealer-orders; side_effects write season_uplift_cents, program_discount_cents, net_subtotal_cents, freight_surcharge_pct, freight_surcharge_cents, total_cents, required_deposit_cents and credit_hold_cents"
    algorithm: tiered_pricing
    formula: |
      evaluation order is pinned; steps MUST run S1 through S8 in this order
      S1 kit_subtotal_cents      = calculations.kit_bill_of_materials output
      S2 season_uplift_cents     = round(kit_subtotal_cents * SEASON_UPLIFT_PCT[order_season])
      S3 program_discount_cents  = round((kit_subtotal_cents + season_uplift_cents)
                                         * PROGRAM_DISCOUNT_PCT[Dealer.program_tier])
      S4 net_subtotal_cents      = kit_subtotal_cents + season_uplift_cents - program_discount_cents
      S5 freight_surcharge_pct   = FREIGHT_SURCHARGE_TIERS rate whose half-open cents band contains
                                   net_subtotal_cents  (NOT total_cents)
      S6 freight_surcharge_cents = round(net_subtotal_cents * freight_surcharge_pct)
      S7 total_cents             = net_subtotal_cents + freight_surcharge_cents
      S8 required_deposit_cents  = round(total_cents * DEPOSIT_PCT)
         credit_hold_cents       = total_cents - required_deposit_cents
    input_set: "the DealerOrder being created, its Dealer (program_tier) and its own order_season; no other orders participate"
    constants:
      SEASON_UPLIFT_PCT: { PRESEASON: -0.05, HARVEST_PEAK: 0.07, OFFSEASON: 0.00 }
      PROGRAM_DISCOUNT_PCT: { BASE: 0.00, PREFERRED: 0.03, ELITE: 0.06 }
      FREIGHT_SURCHARGE_TIERS:
        - { max_net_subtotal_cents_exclusive: 2000000, rate: 0.060 }
        - { max_net_subtotal_cents_exclusive: 6000000, rate: 0.045 }
        - { max_net_subtotal_cents_exclusive: null, rate: 0.030 }
      DEPOSIT_PCT: 0.20
    precision: |
      Combinatorial mode (c) - circular-looking dependency resolved by a pinned evaluation order.
      total_cents depends on freight_surcharge_cents, and the surcharge rate is a tier lookup, so
      the naive reading keys the tier on total_cents and never terminates. S5 pins the tier lookup
      to net_subtotal_cents, which is fully determined at S4. Each tier band is half-open:
      net_subtotal_cents < 2000000 selects 0.060, 2000000 <= net_subtotal_cents < 6000000 selects
      0.045, net_subtotal_cents >= 6000000 selects 0.030. Every money step rounds to whole cents
      round_half_up independently; no step consumes an unrounded intermediate.

  - name: dealer_credit_ledger
    trigger: "POST /dealer-orders/{id}/confirm, POST /dealer-orders/{id}/cancel, POST /dealers/{id}/credit-limit, POST /freight-loads/{id}/deliver; each of those transitions lists recomputation of Dealer.credit_committed_cents and Dealer.credit_available_cents in its side_effects"
    algorithm: aggregation
    formula: |
      credit_committed_cents = sum of DealerOrder.credit_hold_cents over every DealerOrder with
                               dealer_id == Dealer.id and production_status IN
                               {QUEUED, KITTED, SHIPPED, HOLD_CREDIT, HOLD_ENGINEERING}
      credit_available_cents = Dealer.credit_limit_cents - credit_committed_cents
      status                 = CREDIT_HOLD when credit_available_cents < 0 else ACTIVE
      conserved invariant (MUST hold after every mutation, forward or compensating):
        Dealer.credit_committed_cents == sum of credit_hold_cents over that dealer's DealerOrder
        rows in the states listed above
    input_set: |
      DealerOrder rows with the named dealer_id whose production_status is in
      {QUEUED, KITTED, SHIPPED, HOLD_CREDIT, HOLD_ENGINEERING}. DRAFT orders are excluded because
      credit is committed by confirmation, not by pricing: an unconfirmed order carries a populated
      credit_hold_cents but contributes nothing to the ledger. SHIPPED is included because dispatch
      releases nothing: the hold survives until POST /freight-loads/{id}/deliver sets
      financial_status = RELEASED and zeroes credit_hold_cents, which is the single point at which a
      completed sale leaves the ledger. Orders in CANCELLED are excluded and that state forces
      credit_hold_cents to 0, so the exclusion and the zeroing agree. Sum order is irrelevant
      because addition over integers is commutative; no tie-break is required.
    constants: {}
    precision: "whole cents, exact integer arithmetic, no rounding"

  - name: freight_load_allocation
    trigger: "POST /freight-loads/{id}/assign-order, and every order detach reached from POST /dealer-orders/{id}/cancel, the DealerOrder HOLD_ENGINEERING transition, or POST /freight-loads/{id}/cancel; side_effects of each write FreightLoad.assigned_cube_m3, assigned_weight_kg, cube_utilization_pct, linehaul_cost_cents, order_count and each attached DealerOrder.allocated_freight_cents and freight_sequence"
    algorithm: waterfall_allocation
    formula: |
      attached          = DealerOrder rows with freight_load_id == FreightLoad.id, ordered by
                          created_at ascending; freight_sequence is renumbered 1..N in that order
      max_cube_m3       = TRAILER_CUBE_M3[trailer_type]
      max_weight_kg     = TRAILER_WEIGHT_KG[trailer_type]
      assigned_cube_m3  = round(sum of DealerOrder.kit_cube_m3 over attached, 3)
      assigned_weight_kg= round(sum of DealerOrder.kit_weight_kg over attached, 2)
      cube_utilization_pct = round(assigned_cube_m3 / max_cube_m3 * 100, 2)
      linehaul_cost_cents  = LINEHAUL_BASE_CENTS[trailer_type]
                             + round(assigned_weight_kg * LINEHAUL_PER_KG_CENTS)
      per order share, by variant:
        WEIGHT: share_i = round(linehaul_cost_cents * kit_weight_kg_i / assigned_weight_kg)
        CUBE:   share_i = round(linehaul_cost_cents * kit_cube_m3_i  / assigned_cube_m3)
      residual_cents    = linehaul_cost_cents - sum of share_i over attached
      allocated_freight_cents = share_i for every order, plus residual_cents added to the single
                                order whose freight_sequence == 1 (the earliest created_at); the
                                residual may be negative and is applied with its sign
      order_count       = count of attached
      empty-set clause: when attached is empty, assigned_cube_m3, assigned_weight_kg,
                        cube_utilization_pct, linehaul_cost_cents and order_count are all 0 - the
                        trailer base linehaul is NOT charged to a load carrying nothing
      invariant: sum of allocated_freight_cents over attached == linehaul_cost_cents exactly
                 (trivially 0 == 0 for the empty set)
    input_set: "DealerOrder rows whose freight_load_id equals this load; detached orders contribute nothing and carry allocated_freight_cents 0 and freight_sequence null"
    constants:
      TRAILER_CUBE_M3: { FLATBED: 62.0, HIGH_CUBE_VAN: 95.0, STEP_DECK: 74.0 }
      TRAILER_WEIGHT_KG: { FLATBED: 21000, HIGH_CUBE_VAN: 28000, STEP_DECK: 22500 }
      LINEHAUL_BASE_CENTS: { FLATBED: 145000, HIGH_CUBE_VAN: 198000, STEP_DECK: 172000 }
      LINEHAUL_PER_KG_CENTS: 3
      MIN_CUBE_UTILIZATION_PCT: 75.0
    precision: |
      cube 3 decimal places, weight 2 decimal places, utilization percentage 2 decimal places, all
      round_half_up. Each per-order share is rounded to whole cents independently and the residual
      is then absorbed by freight_sequence 1, so the shares always re-sum to linehaul_cost_cents.
      Ordering and the residual target are decided by freight_sequence, which derives from
      created_at ascending; entity id is never consulted.
    variants:
      - name: WEIGHT
        when: "FreightLoad.allocation_basis == WEIGHT"
        difference: "prorates linehaul_cost_cents by each order's kit_weight_kg share of assigned_weight_kg"
      - name: CUBE
        when: "FreightLoad.allocation_basis == CUBE"
        difference: "prorates linehaul_cost_cents by each order's kit_cube_m3 share of assigned_cube_m3, which diverges from WEIGHT whenever the orders' weight-to-cube densities differ - a bare sheet kit is dense while an aeration-and-unload kit is bulky"

  - name: coil_mass_ledger
    trigger: "POST /roll-forming-runs, POST /roll-forming-runs/{id}/complete, POST /roll-forming-runs/{id}/void, and the CoilLot QUARANTINED transition; each lists recomputation of the CoilLot mass fields in its side_effects"
    algorithm: aggregation
    formula: |
      reserved_kg  = round(sum of RollFormingRun.planned_kg  over runs with coil_lot_id == lot.id
                           and status == SCHEDULED, 2)
      consumed_kg  = round(sum of RollFormingRun.consumed_kg over runs with coil_lot_id == lot.id
                           and status == COMPLETED, 2)
      scrap_kg     = round(sum of RollFormingRun.scrap_kg    over runs with coil_lot_id == lot.id
                           and status == COMPLETED, 2)
      remaining_kg = round(received_kg - reserved_kg - consumed_kg - scrap_kg, 2)
      conserved invariant (MUST hold after every forward and every compensating action):
        CoilLot.received_kg == remaining_kg + reserved_kg + consumed_kg + scrap_kg
      status       = QUARANTINED when already QUARANTINED (terminal)
                     DEPLETED    when remaining_kg == 0
                     AVAILABLE   otherwise
    input_set: "RollFormingRun rows with this coil_lot_id; VOIDED runs contribute nothing to any of the four sums because void resets consumed_kg and scrap_kg to 0 and removes the row from the SCHEDULED set"
    constants: {}
    precision: "2 decimal places round_half_up on each of the four sums; received_kg is never recomputed"

  - name: crew_certification_envelope
    trigger: "POST /installation-crews and the InstallationCrew downgrade transitions; side_effects write InstallationCrew.max_diameter_m"
    algorithm: threshold
    formula: |
      max_diameter_m = CREW_TIER_MAX_DIAMETER_M[certification_tier]
      an assignment is admissible only when BinDesign.diameter_m <= max_diameter_m and the current
      logical clock is at or before certified_until
    input_set: "the InstallationCrew row plus the BinDesign of the order being assigned"
    constants:
      CREW_TIER_MAX_DIAMETER_M: { T1: 9.5, T2: 15.5, T3: 30.0 }
    precision: "metres compared to 1 decimal place as stored; the comparison is inclusive (<=), so a 15.5 m bin is admissible for a T2 crew"

  - name: failure_root_cause_determination
    trigger: "POST /field-failures/{id}/start-analysis writes structural_verdict and corrosion_verdict (steps 1 and 2); POST /field-failures/{id}/determine writes determined_cause (step 3)"
    algorithm: projection
    formula: |
      step 1 structural_verdict = EXCEEDS_DESIGN when observed_load_kpa > BinDesign.governing_demand_kpa
                                  else WITHIN_DESIGN
      step 2 corrosion_verdict  = EXCEEDS_CLASS when measured_coating_loss_pct
                                  > CORROSION_LOSS_LIMIT[CoatingSpec.corrosion_class]
                                  else WITHIN_CLASS
      step 3 determined_cause, evaluated in this fixed branch order:
        3a failure_mode == CORROSION_PERFORATION ->
             COATING_INADEQUATE when corrosion_verdict == EXCEEDS_CLASS else OVERLOAD_MISUSE
        3b failure_mode == ANCHOR_PULLOUT ->
             INSTALLATION_DEFECT
        3c failure_mode IN {SIDEWALL_BUCKLE, ROOF_COLLAPSE} ->
             STRUCTURAL_UNDERDESIGN when structural_verdict == WITHIN_DESIGN else OVERLOAD_MISUSE
    input_set: "the FieldFailure row, the BinDesign it copied at intake, and that design's CoatingSpec"
    constants:
      CORROSION_LOSS_LIMIT: { C2: 25.0, C3: 40.0, C4: 55.0, C5: 70.0 }
    precision: |
      both comparisons are strict (>), so a measured loss exactly equal to the class limit is
      WITHIN_CLASS and an observed load exactly equal to governing_demand_kpa is WITHIN_DESIGN.
      Branch order 3a, 3b, 3c is exhaustive over the four failure_mode values and the first
      matching branch wins.

  - name: order_season_window
    trigger: "POST /dealer-orders; validation ERR_SEASON_WINDOW_MISMATCH at priority 23 consumes the result"
    algorithm: chronological
    formula: |
      m = calendar month (1..12) of the current logical clock in UTC
      derived_season = PRESEASON    when m IN {1,2,3,4,5,6}
                       HARVEST_PEAK when m IN {9,10,11}
                       OFFSEASON    when m IN {7,8,12}
      the request's order_season MUST equal derived_season
    input_set: "the logical clock only"
    constants:
      SEASON_MONTHS:
        PRESEASON: [1, 2, 3, 4, 5, 6]
        HARVEST_PEAK: [9, 10, 11]
        OFFSEASON: [7, 8, 12]
    precision: "month boundaries are UTC calendar months; the default clock 2026-08-01T00:00:00Z falls in month 8 and therefore derives OFFSEASON"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the role in X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every required field named in the endpoint's input is present, of the declared type, within its declared numeric range, and - for enum fields - one of the declared members; unknown body fields are ignored"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "each id in the request path resolves to a stored row, validated left to right; ERR_CONFIG_NOT_FOUND covers Jurisdiction, GrainProfile, CoatingSpec and RollFormingLine, the others use their own error"
    error_id: ERR_CONFIG_NOT_FOUND | ERR_ENGINEER_NOT_FOUND | ERR_DEALER_NOT_FOUND | ERR_BIN_DESIGN_NOT_FOUND | ERR_COIL_LOT_NOT_FOUND | ERR_ROLL_FORMING_RUN_NOT_FOUND | ERR_DEALER_ORDER_NOT_FOUND | ERR_FREIGHT_LOAD_NOT_FOUND | ERR_INSTALLATION_CREW_NOT_FOUND | ERR_FIELD_FAILURE_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 5
    category: existence
    check: "each foreign key supplied in the request body resolves to a stored row, validated in the order the fields appear in the endpoint's input list"
    error_id: ERR_CONFIG_NOT_FOUND | ERR_DEALER_NOT_FOUND | ERR_BIN_DESIGN_NOT_FOUND | ERR_COIL_LOT_NOT_FOUND | ERR_DEALER_ORDER_NOT_FOUND | ERR_INSTALLATION_CREW_NOT_FOUND
    http_status: 404
    applies_to: "POST /dealers, POST /bin-designs, POST /coil-lots, POST /roll-forming-runs, POST /dealer-orders, POST /freight-loads, POST /freight-loads/{id}/assign-order, POST /installation-crews, POST /dealer-orders/{id}/assign-crew, POST /field-failures"

  - priority: 6
    category: auth
    check: "for entity_backed roles the acting X-User-ID must own the addressed resource: a DealerPrincipal's id must equal DealerOrder.dealer_id (or the dealer_id in the body); a DesignEngineer or SealingEngineer id must resolve to a stored Engineer"
    error_id: ERR_DEALER_SCOPE_VIOLATION | ERR_ENGINEER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /dealer-orders, POST /dealer-orders/{id}/confirm, POST /dealer-orders/{id}/payments, POST /dealer-orders/{id}/cancel, POST /bin-designs, POST /bin-designs/{id}/analyses, POST /bin-designs/{id}/submit-review, POST /bin-designs/{id}/request-revision, POST /bin-designs/{id}/revise, POST /bin-designs/{id}/seal"

  - priority: 7
    category: state
    check: "the addressed resource, and any resource this operation reads as a gate, is in a state that admits the transition; the per-endpoint from-states are the ones listed in the matching state_machines transition. On POST /dealer-orders/{id}/confirm the BinDesign gate uses ERR_DESIGN_NOT_SEALED; on POST /dealer-orders the design must not be RECALLED; on POST /roll-forming-runs the CoilLot must be AVAILABLE"
    error_id: ERR_DESIGN_STATE_INVALID | ERR_DESIGN_NOT_SEALED | ERR_DESIGN_RECALLED | ERR_ORDER_STATE_INVALID | ERR_DEPOSIT_ALREADY_PAID | ERR_LOAD_STATE_INVALID | ERR_RUN_STATE_INVALID | ERR_COIL_LOT_NOT_AVAILABLE | ERR_FAILURE_STATE_INVALID | ERR_CREW_NOT_CERTIFIED
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 8
    category: state
    check: "the expected_<parent>_version supplied in the body equals the current parent version, per the matching concurrency_rules entry"
    error_id: ERR_STALE_DESIGN_VERSION | ERR_STALE_DEALER_VERSION
    http_status: 412
    applies_to: "POST /bin-designs/{id}/analyses, POST /freight-loads"

  - priority: 9
    category: business_safety
    check: "BinDesign.moisture_pct <= CoatingSpec.max_ambient_moisture_pct of the referenced coating"
    error_id: ERR_MOISTURE_EXCEEDS_COATING_LIMIT
    http_status: 422
    applies_to: "POST /bin-designs, POST /bin-designs/{id}/revise"

  - priority: 10
    category: business_safety
    check: "BinDesign.design_wind_speed_mph >= Jurisdiction.min_design_wind_speed_mph"
    error_id: ERR_WIND_BELOW_JURISDICTION_MINIMUM
    http_status: 422
    applies_to: "POST /bin-designs, POST /bin-designs/{id}/revise"

  - priority: 11
    category: business_safety
    check: "the governing DesignAnalysis (greatest analysis_index among rows with superseded == false and design_method == BinDesign.design_method) exists and has verdict == PASS"
    error_id: ERR_NO_PASSING_ANALYSIS | ERR_DESIGN_ANALYSIS_FAILED
    http_status: 422
    applies_to: "POST /bin-designs/{id}/submit-review"

  - priority: 12
    category: business_safety
    check: "BinDesign.diameter_m <= InstallationCrew.max_diameter_m for the crew being assigned"
    error_id: ERR_CREW_TIER_INSUFFICIENT
    http_status: 422
    applies_to: "POST /dealer-orders/{id}/assign-crew"

  - priority: 13
    category: business_safety
    check: "when aeration_package is AERATION or DRYING_FULL, the unsaturated raw_cfm from calculations.aeration_and_drying_capacity must not exceed MAX_FAN_CFM"
    error_id: ERR_AERATION_UNDERSIZED
    http_status: 422
    applies_to: "POST /dealer-orders"

  - priority: 14
    category: business_safety
    check: "the sealing engineer's X-User-ID must differ from BinDesign.author_engineer_id - segregation of duties between authoring and sealing"
    error_id: ERR_SEAL_SEGREGATION_VIOLATION
    http_status: 403
    applies_to: "POST /bin-designs/{id}/seal, POST /bin-designs/{id}/request-revision"

  - priority: 15
    category: business_referential
    check: "the acting Engineer.status == ACTIVE and the referenced Jurisdiction.code appears in that Engineer.licensed_jurisdiction_codes"
    error_id: ERR_ENGINEER_LICENSE_LAPSED | ERR_ENGINEER_NOT_LICENSED_IN_JURISDICTION
    http_status: 422
    applies_to: "POST /bin-designs, POST /bin-designs/{id}/revise, POST /bin-designs/{id}/seal"

  - priority: 16
    category: business_referential
    check: "InstallationCrew.dealer_id == DealerOrder.dealer_id"
    error_id: ERR_CREW_DEALER_MISMATCH
    http_status: 422
    applies_to: "POST /dealer-orders/{id}/assign-crew"

  - priority: 17
    category: business_referential
    check: "the assigned DealerOrder.dealer_id == FreightLoad.dealer_id"
    error_id: ERR_LOAD_DEALER_MISMATCH
    http_status: 422
    applies_to: "POST /freight-loads/{id}/assign-order"

  - priority: 18
    category: business_referential
    check: "the RollFormingRun's CoilLot.gauge_mm equals the BinDesign.sheet_gauge_mm of the run's DealerOrder"
    error_id: ERR_COIL_GAUGE_MISMATCH
    http_status: 422
    applies_to: "POST /roll-forming-runs"

  - priority: 19
    category: business_temporal
    check: "window_end is strictly after window_start; yard_window_end is at or after yard_window_start"
    error_id: ERR_WINDOW_ORDER_INVALID
    http_status: 400
    applies_to: "POST /roll-forming-runs, POST /freight-loads"

  - priority: 20
    category: business_temporal
    check: "the current logical clock is at or before InstallationCrew.certified_until"
    error_id: ERR_CREW_CERTIFICATION_EXPIRED
    http_status: 422
    applies_to: "POST /dealer-orders/{id}/assign-crew"

  - priority: 21
    category: business_temporal
    check: |
      half-open interval semantics on RollFormingLine. The new run's [window_start, window_end)
      must not intersect the half-open window of any SCHEDULED or COMPLETED run on the same line.
      Zero-gap adjacency (new.window_start == existing.window_end, or
      new.window_end == existing.window_start) is permitted ONLY when the two runs carry the same
      coating_code; when the coating_code differs, a gap of at least
      CoatingSpec.changeover_minutes of the incoming run's coating is required on the touching side,
      so the effective forbidden zone is the existing window expanded by the changeover buffer.
    error_id: ERR_LINE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /roll-forming-runs"

  - priority: 22
    category: business_temporal
    check: |
      closed interval semantics with aggregate capacity on the Dealer yard. Count the dealer's
      FreightLoad rows in status PLANNED whose closed [yard_window_start, yard_window_end] interval
      intersects the new load's closed interval - touching endpoints DO intersect. Reject when that
      count is already >= Dealer.staging_slots. A single overlap is legal while slots remain.
    error_id: ERR_YARD_SLOTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /freight-loads"

  - priority: 23
    category: business_temporal
    check: "the request's order_season equals the season derived from the logical clock month by calculations.order_season_window"
    error_id: ERR_SEASON_WINDOW_MISMATCH
    http_status: 422
    applies_to: "POST /dealer-orders"

  - priority: 24
    category: business_temporal
    check: "when BinDesign.seal_required is true, the current logical clock is at or after BinDesign.permit_ready_at"
    error_id: ERR_PERMIT_REVIEW_PENDING
    http_status: 422
    applies_to: "POST /dealer-orders/{id}/confirm"

  - priority: 25
    category: business_constraint
    check: "BinDesign.sheet_gauge_mm of the run's DealerOrder <= RollFormingLine.max_gauge_mm"
    error_id: ERR_GAUGE_EXCEEDS_LINE_CAPACITY
    http_status: 422
    applies_to: "POST /roll-forming-runs"

  - priority: 26
    category: business_constraint
    check: "trailer_type may be HIGH_CUBE_VAN only when Dealer.high_cube_access is true"
    error_id: ERR_HIGH_CUBE_ACCESS_DENIED
    http_status: 422
    applies_to: "POST /freight-loads"

  - priority: 27
    category: business_constraint
    check: "after adding the order, assigned_cube_m3 <= max_cube_m3 and assigned_weight_kg <= max_weight_kg"
    error_id: ERR_LOAD_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /freight-loads/{id}/assign-order"

  - priority: 28
    category: business_constraint
    check: "the order is not already attached to this or any other FreightLoad (DealerOrder.freight_load_id is null)"
    error_id: ERR_ORDER_ALREADY_ON_LOAD
    http_status: 409
    applies_to: "POST /freight-loads/{id}/assign-order"

  - priority: 29
    category: business_constraint
    check: "FreightLoad.order_count >= 1 - a load with the empty order set cannot be dispatched"
    error_id: ERR_LOAD_HAS_NO_ORDERS
    http_status: 409
    applies_to: "POST /freight-loads/{id}/dispatch"

  - priority: 30
    category: business_constraint
    check: "conditional on trailer_type == HIGH_CUBE_VAN only: cube_utilization_pct >= MIN_CUBE_UTILIZATION_PCT (75.0). FLATBED and STEP_DECK loads are exempt"
    error_id: ERR_LOAD_BELOW_MIN_CUBE_UTILIZATION
    http_status: 409
    applies_to: "POST /freight-loads/{id}/dispatch"

  - priority: 31
    category: business_fiscal
    check: "planned_kg <= CoilLot.remaining_kg at the moment of scheduling"
    error_id: ERR_COIL_INSUFFICIENT_MASS
    http_status: 422
    applies_to: "POST /roll-forming-runs"

  - priority: 32
    category: business_fiscal
    check: "consumed_kg + scrap_kg <= RollFormingRun.planned_kg"
    error_id: ERR_RUN_MASS_EXCEEDS_RESERVED
    http_status: 422
    applies_to: "POST /roll-forming-runs/{id}/complete"

  - priority: 33
    category: business_fiscal
    check: "Dealer.credit_available_cents >= DealerOrder.credit_hold_cents at confirmation"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /dealer-orders/{id}/confirm"

  - priority: 34
    category: business_fiscal
    check: "amount_cents == DealerOrder.required_deposit_cents exactly; partial and over-payments are rejected"
    error_id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /dealer-orders/{id}/payments"

  - priority: 35
    category: business_fiscal
    check: "every DealerOrder attached to the load has financial_status == DEPOSIT_PAID"
    error_id: ERR_DEPOSIT_REQUIRED
    http_status: 402
    applies_to: "POST /freight-loads/{id}/dispatch"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time. All deadline, permit-review, certification-expiry, season-window and staging-window comparisons read this clock."
    roles: [PlantAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["sets the logical clock to to_iso8601"]

  - method: POST
    path: "/jurisdictions"
    description: "Registers a permitting jurisdiction."
    roles: [PlantAdmin]
    code: 201
    input: [code, name, seal_required, min_design_wind_speed_mph, seismic_design_category, permit_review_days]
    output: Jurisdiction
    side_effects: []

  - method: POST
    path: "/grain-profiles"
    description: "Registers a stored-product profile."
    roles: [PlantAdmin]
    code: 201
    input: [grain_code, bulk_density_kg_per_m3, janssen_k_ratio, max_safe_moisture_pct, aeration_cfm_per_m3_base, drying_multiplier]
    output: GrainProfile
    side_effects: []

  - method: POST
    path: "/coating-specs"
    description: "Registers a galvanized coating specification."
    roles: [PlantAdmin]
    code: 201
    input: [coating_code, zinc_mass_g_per_m2, coating_cost_per_kg_cents, changeover_minutes, max_ambient_moisture_pct]
    output: CoatingSpec
    side_effects: ["runs calculations.coating_corrosion_class writing corrosion_class"]

  - method: POST
    path: "/roll-forming-lines"
    description: "Registers a roll-forming line."
    roles: [PlantAdmin]
    code: 201
    input: [line_code, max_gauge_mm]
    output: RollFormingLine
    side_effects: []

  - method: GET
    path: "/jurisdictions/{id}"
    description: "Reads one jurisdiction. Immutable configuration, so the row carries only id and created_at alongside its business fields."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  - method: GET
    path: "/jurisdictions"
    description: "Lists jurisdictions in ascending created_at order."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: Jurisdiction[]
    side_effects: []

  - method: GET
    path: "/grain-profiles/{id}"
    description: "Reads one stored-product profile."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: []
    output: GrainProfile
    side_effects: []

  - method: GET
    path: "/grain-profiles"
    description: "Lists stored-product profiles in ascending created_at order."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: GrainProfile[]
    side_effects: []

  - method: GET
    path: "/coating-specs/{id}"
    description: "Reads one coating specification including its computed corrosion_class."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: []
    output: CoatingSpec
    side_effects: []

  - method: GET
    path: "/coating-specs"
    description: "Lists coating specifications in ascending created_at order."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: CoatingSpec[]
    side_effects: []

  - method: GET
    path: "/roll-forming-lines/{id}"
    description: "Reads one roll-forming line."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: []
    output: RollFormingLine
    side_effects: []

  - method: GET
    path: "/roll-forming-lines"
    description: "Lists roll-forming lines in ascending created_at order."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: RollFormingLine[]
    side_effects: []

  - method: POST
    path: "/engineers"
    description: "Registers an engineer of record with the jurisdictions they are licensed in."
    roles: [PlantAdmin]
    code: 201
    input: [name, license_number, licensed_jurisdiction_codes]
    output: Engineer
    side_effects: ["sets Engineer.status = ACTIVE"]

  - method: POST
    path: "/engineers/{id}/lapse"
    description: "Marks an engineer's license lapsed."
    roles: [PlantAdmin]
    code: 200
    input: []
    output: Engineer
    side_effects: ["sets Engineer.status = LAPSED", "increments Engineer.version by 1"]

  - method: GET
    path: "/engineers/{id}"
    description: "Reads one engineer of record including status and licensed_jurisdiction_codes."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: []
    output: Engineer
    side_effects: []

  - method: GET
    path: "/engineers"
    description: "Lists engineers of record, optionally filtered by status, in ascending created_at order."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Engineer[]
    side_effects: []

  - method: POST
    path: "/dealers"
    description: "Registers a dealership with its credit line, program tier and yard staging capacity."
    roles: [PlantAdmin]
    code: 201
    input: [name, region_code, jurisdiction_id, credit_limit_cents, program_tier, staging_slots, high_cube_access]
    output: Dealer
    side_effects: ["initialises credit_committed_cents to 0, credit_available_cents to credit_limit_cents, staged_kit_count to 0 and status to ACTIVE"]

  - method: GET
    path: "/dealers/{id}"
    description: "Reads one dealership including its credit ledger, staged kit count and version."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: []
    output: Dealer
    side_effects: []

  - method: GET
    path: "/dealers"
    description: "Lists dealerships, optionally filtered by jurisdiction."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: ["jurisdiction_id?", "limit?", "offset?"]
    output: Dealer[]
    side_effects: []

  - method: POST
    path: "/dealers/{id}/credit-limit"
    description: "Resets a dealership's credit limit. Lowering it below the committed amount drives the dealer into CREDIT_HOLD and cascades to its QUEUED orders."
    roles: [PlantAdmin]
    code: 200
    input: [credit_limit_cents]
    output: Dealer
    side_effects:
      - "recomputes calculations.dealer_credit_ledger writing credit_committed_cents and credit_available_cents"
      - "may drive Dealer ACTIVE -> CREDIT_HOLD or CREDIT_HOLD -> ACTIVE with the corresponding DealerOrder cascade"
      - "increments Dealer.version by 1"

  - method: GET
    path: "/dealers/{id}/installation-crews"
    description: "Lists the installation crews belonging to one dealership."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: InstallationCrew[]
    side_effects: []

  - method: POST
    path: "/installation-crews"
    description: "Registers an installation crew under a dealership at a certification tier."
    roles: [PlantAdmin]
    code: 201
    input: [dealer_id, crew_name, certification_tier, certified_until]
    output: InstallationCrew
    side_effects: ["runs calculations.crew_certification_envelope writing max_diameter_m", "sets status = CERTIFIED"]

  - method: GET
    path: "/installation-crews/{id}"
    description: "Reads one installation crew including its computed max_diameter_m and its current status."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: []
    output: InstallationCrew
    side_effects: []

  - method: GET
    path: "/installation-crews"
    description: "Lists installation crews, optionally filtered by dealer, in ascending created_at order."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: ["dealer_id?", "limit?", "offset?"]
    output: InstallationCrew[]
    side_effects: []

  - method: POST
    path: "/bin-designs"
    description: "Creates a bin design for a dealer in a jurisdiction. author_engineer_id is taken from X-User-ID."
    roles: [DesignEngineer]
    code: 201
    input: [dealer_id, jurisdiction_id, grain_profile_id, coating_spec_id, diameter_m, eave_height_m, roof_pitch_deg, design_wind_speed_mph, moisture_pct, design_method]
    output: BinDesign
    side_effects:
      - "runs calculations.bin_geometry_and_capacity writing sheet_courses, sheets_per_course, sidewall_sheet_count, roof_panel_count, circumference_m, capacity_m3"
      - "runs calculations.structural_stiffener_requirement writing grain_lateral_kpa, moisture_factor, grain_demand_kpa, wind_demand_kpa, seismic_demand_kpa, governing_load_case, governing_demand_kpa, required_stiffener_count, utilization_ratio, sheet_gauge_mm, roof_ring_required"
      - "copies Jurisdiction.seal_required onto BinDesign.seal_required"
      - "sets status = DRAFT and revision_round = 0"

  - method: GET
    path: "/bin-designs/{id}"
    description: "Reads one bin design including every computed geometry and structural field and its version."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: []
    output: BinDesign
    side_effects: []

  - method: GET
    path: "/bin-designs"
    description: "Lists bin designs, optionally filtered by any of their foreign keys."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: ["dealer_id?", "jurisdiction_id?", "grain_profile_id?", "coating_spec_id?", "author_engineer_id?", "sealed_by_engineer_id?", "limit?", "offset?"]
    output: BinDesign[]
    side_effects: []

  - method: POST
    path: "/bin-designs/{id}/analyses"
    description: "Runs a structural analysis on the design under an explicitly chosen design method, which may differ from the design's own design_method. OCC guarded on the design version."
    roles: [DesignEngineer]
    code: 201
    input: [design_method, expected_bin_design_version]
    output: DesignAnalysis
    side_effects:
      - "runs calculations.structural_stiffener_requirement under the requested design_method writing allowable_kpa_m, governing_load_case, governing_demand_kpa, required_stiffener_count, utilization_ratio and verdict"
      - "assigns analysis_index as one more than the highest existing analysis_index on the design"
      - "increments BinDesign.version by 1"

  - method: GET
    path: "/bin-designs/{id}/analyses"
    description: "Lists the analyses of one bin design in ascending analysis_index order."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: DesignAnalysis[]
    side_effects: []

  - method: POST
    path: "/bin-designs/{id}/submit-review"
    description: "Submits a DRAFT design for sealing review; requires a passing governing analysis under the design's own design_method."
    roles: [DesignEngineer]
    code: 200
    input: []
    output: BinDesign
    side_effects: ["sets status = UNDER_REVIEW", "increments BinDesign.version by 1"]

  - method: POST
    path: "/bin-designs/{id}/request-revision"
    description: "Sealing engineer returns an UNDER_REVIEW design for revision."
    roles: [SealingEngineer]
    code: 200
    input: [revision_note]
    output: BinDesign
    side_effects: ["sets status = REVISION_REQUIRED", "increments BinDesign.version by 1"]

  - method: POST
    path: "/bin-designs/{id}/revise"
    description: "Applies a revision to a REVISION_REQUIRED design, closing the revision cycle back to DRAFT. Omitted fields keep their current values."
    roles: [DesignEngineer]
    code: 200
    input: ["diameter_m?", "eave_height_m?", "roof_pitch_deg?", "design_wind_speed_mph?", "moisture_pct?", "design_method?"]
    output: BinDesign
    side_effects:
      - "re-runs calculations.bin_geometry_and_capacity and calculations.structural_stiffener_requirement over the merged inputs"
      - "increments revision_round by 1"
      - "sets superseded = true on every DesignAnalysis of this design"
      - "sets author_engineer_id to the acting engineer and status = DRAFT"
      - "increments BinDesign.version by 1"

  - method: POST
    path: "/bin-designs/{id}/seal"
    description: "Sealing engineer applies the engineering seal, starting the jurisdiction's permit review window. The sealing engineer must not be the design's author."
    roles: [SealingEngineer]
    code: 200
    input: []
    output: BinDesign
    side_effects:
      - "sets sealed_by_engineer_id, sealed_at and permit_ready_at"
      - "sets status = SEALED"
      - "increments BinDesign.version by 1"

  - method: POST
    path: "/coil-lots"
    description: "Receives a coil lot of a given coating and gauge into the plant."
    roles: [ProductionPlanner]
    code: 201
    input: [coating_spec_id, heat_number, gauge_mm, received_kg]
    output: CoilLot
    side_effects: ["initialises reserved_kg, consumed_kg and scrap_kg to 0, remaining_kg to received_kg and status to AVAILABLE"]

  - method: GET
    path: "/coil-lots/{id}"
    description: "Reads one coil lot including its four mass ledger fields."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: []
    output: CoilLot
    side_effects: []

  - method: GET
    path: "/coil-lots"
    description: "Lists coil lots, optionally filtered by coating specification."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: ["coating_spec_id?", "limit?", "offset?"]
    output: CoilLot[]
    side_effects: []

  - method: POST
    path: "/roll-forming-runs"
    description: "Schedules a roll-forming run on a line against a coil lot for one dealer order, reserving mass from the lot."
    roles: [ProductionPlanner]
    code: 201
    input: [roll_forming_line_id, coil_lot_id, dealer_order_id, window_start, window_end, planned_kg]
    output: RollFormingRun
    side_effects:
      - "copies the lot's CoatingSpec.coating_code onto RollFormingRun.coating_code"
      - "recomputes calculations.coil_mass_ledger, raising CoilLot.reserved_kg by planned_kg and lowering remaining_kg"
      - "may drive CoilLot AVAILABLE -> DEPLETED"
      - "increments CoilLot.version by 1"

  - method: GET
    path: "/roll-forming-runs/{id}"
    description: "Reads one roll-forming run."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: []
    output: RollFormingRun
    side_effects: []

  - method: GET
    path: "/roll-forming-runs"
    description: "Lists roll-forming runs, optionally filtered by line, coil lot or dealer order."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: ["roll_forming_line_id?", "coil_lot_id?", "dealer_order_id?", "limit?", "offset?"]
    output: RollFormingRun[]
    side_effects: []

  - method: POST
    path: "/roll-forming-runs/{id}/complete"
    description: "Posts the actual consumed and scrapped mass for a scheduled run and advances the order to KITTED."
    roles: [ProductionPlanner]
    code: 200
    input: [consumed_kg, scrap_kg]
    output: RollFormingRun
    side_effects:
      - "sets status = COMPLETED and stores consumed_kg and scrap_kg"
      - "recomputes calculations.coil_mass_ledger on the CoilLot"
      - "advances the DealerOrder production_status QUEUED -> KITTED"
      - "increments RollFormingRun.version, CoilLot.version and DealerOrder.version by 1 each"

  - method: POST
    path: "/roll-forming-runs/{id}/void"
    description: "Voids a run. This is the compensating action for both scheduling and completion; the coil lot's mass conservation identity must hold with zero drift afterwards."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: RollFormingRun
    side_effects:
      - "sets status = VOIDED and resets consumed_kg and scrap_kg to 0"
      - "recomputes calculations.coil_mass_ledger, releasing both reservation and consumption"
      - "may drive CoilLot DEPLETED -> AVAILABLE"
      - "reverts the DealerOrder production_status KITTED -> QUEUED when the run had been COMPLETED"
      - "increments RollFormingRun.version, CoilLot.version and, when the order changed, DealerOrder.version by 1 each"

  - method: POST
    path: "/dealer-orders"
    description: "Places a dealer order for a bin design's kit, pricing the whole kit and sizing its aeration, drying and unloading systems."
    roles: [DealerPrincipal]
    code: 201
    input: [dealer_id, bin_design_id, order_season, aeration_package, unload_system]
    output: DealerOrder
    side_effects:
      - "runs calculations.order_season_window to validate order_season"
      - "runs calculations.aeration_and_drying_capacity writing grain_mass_kg, required_fan_cfm, drying_hours_estimate and unload_rate_bph"
      - "runs calculations.kit_bill_of_materials creating the KitLine rows and writing kit_subtotal_cents, kit_weight_kg and kit_cube_m3"
      - "runs calculations.order_price_and_credit writing season_uplift_cents, program_discount_cents, net_subtotal_cents, freight_surcharge_pct, freight_surcharge_cents, total_cents, required_deposit_cents and credit_hold_cents"
      - "sets production_status = DRAFT, financial_status = AWAITING_DEPOSIT, installation_readiness = UNASSIGNED"

  - method: GET
    path: "/dealer-orders/{id}"
    description: "Reads one dealer order including all three state dimensions and every priced and sized field."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: []
    output: DealerOrder
    side_effects: []

  - method: GET
    path: "/dealer-orders"
    description: "Lists dealer orders, optionally filtered by dealer, design, freight load or installation crew."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: ["dealer_id?", "bin_design_id?", "freight_load_id?", "installation_crew_id?", "limit?", "offset?"]
    output: DealerOrder[]
    side_effects: []

  - method: GET
    path: "/dealer-orders/{id}/kit-lines"
    description: "Lists the bill-of-materials lines of one dealer order in the fixed component order."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: KitLine[]
    side_effects: []

  - method: POST
    path: "/dealer-orders/{id}/confirm"
    description: "Confirms a DRAFT order, gating on the design's seal and permit posture and on the dealer's available credit."
    roles: [DealerPrincipal]
    code: 200
    input: []
    output: DealerOrder
    side_effects:
      - "sets production_status = QUEUED"
      - "recomputes calculations.dealer_credit_ledger on the Dealer"
      - "increments DealerOrder.version by 1 and Dealer.version by 1"

  - method: POST
    path: "/dealer-orders/{id}/payments"
    description: "Records the order deposit. The amount must equal required_deposit_cents exactly. Advances only the financial dimension."
    roles: [DealerPrincipal]
    code: 200
    input: [amount_cents]
    output: DealerOrder
    side_effects:
      - "sets deposit_paid_cents and financial_status = DEPOSIT_PAID"
      - "increments DealerOrder.version by 1"

  - method: POST
    path: "/dealer-orders/{id}/cancel"
    description: "Cancels an order, releasing its credit hold, detaching it from any PLANNED freight load and terminating both the production and financial dimensions."
    roles: [DealerPrincipal]
    code: 200
    input: []
    output: DealerOrder
    side_effects:
      - "sets production_status = CANCELLED, financial_status = VOIDED and credit_hold_cents = 0"
      - "detaches from any PLANNED FreightLoad and re-runs calculations.freight_load_allocation over the remaining orders"
      - "recomputes calculations.dealer_credit_ledger, which may drive Dealer CREDIT_HOLD -> ACTIVE and requeue that dealer's HOLD_CREDIT orders"
      - "may drive FreightLoad PLANNED -> CANCELLED when order_count reaches 0"
      - "increments DealerOrder.version, Dealer.version and any touched FreightLoad.version by 1 each"

  - method: POST
    path: "/dealer-orders/{id}/assign-crew"
    description: "Assigns a certified installation crew to an order, gating on tier diameter envelope, dealer match and certification expiry."
    roles: [PlantAdmin]
    code: 200
    input: [installation_crew_id]
    output: DealerOrder
    side_effects:
      - "sets installation_crew_id and installation_readiness = ASSIGNED"
      - "increments DealerOrder.version by 1"

  - method: POST
    path: "/freight-loads"
    description: "Plans a freight load onto a dealer yard staging window. OCC guarded on the dealer version because yard slots are aggregate capacity."
    roles: [LogisticsCoordinator]
    code: 201
    input: [dealer_id, trailer_type, allocation_basis, yard_window_start, yard_window_end, expected_dealer_version]
    output: FreightLoad
    side_effects:
      - "writes max_cube_m3 and max_weight_kg from the trailer constants"
      - "initialises assigned_cube_m3, assigned_weight_kg, cube_utilization_pct, linehaul_cost_cents and order_count to 0 and status to PLANNED"
      - "recomputes Dealer.staged_kit_count"
      - "increments Dealer.version by 1"

  - method: GET
    path: "/freight-loads/{id}"
    description: "Reads one freight load including capacity, utilization and linehaul cost."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: []
    output: FreightLoad
    side_effects: []

  - method: GET
    path: "/freight-loads"
    description: "Lists freight loads, optionally filtered by dealer."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: ["dealer_id?", "limit?", "offset?"]
    output: FreightLoad[]
    side_effects: []

  - method: POST
    path: "/freight-loads/{id}/assign-order"
    description: "Attaches a dealer order to a planned load and re-prorates the linehaul cost across every attached order under the load's allocation basis."
    roles: [LogisticsCoordinator]
    code: 200
    input: [dealer_order_id]
    output: FreightLoad
    side_effects:
      - "sets DealerOrder.freight_load_id and assigns freight_sequence in ascending created_at order"
      - "runs calculations.freight_load_allocation writing assigned_cube_m3, assigned_weight_kg, cube_utilization_pct, linehaul_cost_cents, order_count and every attached DealerOrder.allocated_freight_cents"
      - "increments FreightLoad.version by 1 and each attached DealerOrder.version by 1"

  - method: POST
    path: "/freight-loads/{id}/dispatch"
    description: "Dispatches a planned load. Rejects the empty order set, enforces the high-cube utilization floor for HIGH_CUBE_VAN only, and requires every attached order's deposit."
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: FreightLoad
    side_effects:
      - "sets status = DISPATCHED"
      - "advances every attached DealerOrder production_status to SHIPPED"
      - "recomputes Dealer.staged_kit_count, freeing the yard slot"
      - "increments FreightLoad.version, each DealerOrder.version and Dealer.version by 1 each"

  - method: POST
    path: "/freight-loads/{id}/deliver"
    description: "Marks a dispatched load delivered at the dealer yard, releasing each attached order's credit hold."
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: FreightLoad
    side_effects:
      - "sets status = DELIVERED"
      - "advances every attached DealerOrder financial_status DEPOSIT_PAID -> RELEASED and zeroes credit_hold_cents"
      - "recomputes calculations.dealer_credit_ledger, which may drive Dealer CREDIT_HOLD -> ACTIVE"
      - "increments FreightLoad.version, each DealerOrder.version and Dealer.version by 1 each"

  - method: POST
    path: "/freight-loads/{id}/cancel"
    description: "Cancels a planned load, detaching every attached order and releasing the yard staging slot."
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: FreightLoad
    side_effects:
      - "sets status = CANCELLED"
      - "detaches every attached DealerOrder, zeroing allocated_freight_cents and nulling freight_load_id and freight_sequence"
      - "recomputes Dealer.staged_kit_count"
      - "increments FreightLoad.version, each detached DealerOrder.version and Dealer.version by 1 each"

  - method: POST
    path: "/field-failures"
    description: "Opens a field failure investigation against any DealerOrder in any production_status. bin_design_id is copied from the order at intake and frozen."
    roles: [QualityInspector]
    code: 201
    input: [dealer_order_id, failure_mode, observed_load_kpa, measured_coating_loss_pct, service_years]
    output: FieldFailure
    side_effects: ["copies DealerOrder.bin_design_id onto FieldFailure.bin_design_id", "sets status = INTAKE"]

  - method: GET
    path: "/field-failures/{id}"
    description: "Reads one field failure investigation including both verdicts and the determined cause."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: []
    output: FieldFailure
    side_effects: []

  - method: GET
    path: "/field-failures"
    description: "Lists field failure investigations, optionally filtered by order or design."
    roles: [PlantAdmin, DesignEngineer, SealingEngineer, ProductionPlanner, DealerPrincipal, LogisticsCoordinator, QualityInspector]
    code: 200
    input: ["dealer_order_id?", "bin_design_id?", "limit?", "offset?"]
    output: FieldFailure[]
    side_effects: []

  - method: POST
    path: "/field-failures/{id}/start-analysis"
    description: "Starts the metallurgical and structural analysis, fixing the structural and corrosion verdicts against the design and its coating class."
    roles: [QualityInspector]
    code: 200
    input: []
    output: FieldFailure
    side_effects:
      - "runs calculations.failure_root_cause_determination steps 1 and 2 writing structural_verdict and corrosion_verdict"
      - "sets status = ANALYSIS_IN_PROGRESS"
      - "increments FieldFailure.version by 1"

  - method: POST
    path: "/field-failures/{id}/determine"
    description: "Fixes the root cause and fires the branch-specific cascade: design recall, coating quarantine, crew decertification, or nothing for operator overload."
    roles: [QualityInspector]
    code: 200
    input: []
    output: FieldFailure
    side_effects:
      - "runs calculations.failure_root_cause_determination step 3 writing determined_cause"
      - "sets status = DETERMINED"
      - "STRUCTURAL_UNDERDESIGN branch: BinDesign -> RECALLED, its QUEUED and KITTED orders -> HOLD_ENGINEERING, those orders detach from PLANNED FreightLoads with allocation re-run, and a load left with order_count 0 -> CANCELLED"
      - "COATING_INADEQUATE branch: matching CoilLot rows -> QUARANTINED, their SCHEDULED runs -> VOIDED, and the released reservations recomputed into the coil mass ledger"
      - "INSTALLATION_DEFECT branch: the order's InstallationCrew is downgraded out of CERTIFIED and its assigned orders' installation_readiness -> BLOCKED"
      - "increments FieldFailure.version by 1 plus the version of every entity touched by the selected branch"

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent, or X-User-Role is not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing, of the wrong type, out of its declared numeric range, or not a declared enum member"
  - id: ERR_DEALER_SCOPE_VIOLATION
    http: 403
    condition: "a DealerPrincipal acts on an order or body dealer_id that is not the dealership their X-User-ID identifies"
  - id: ERR_ENGINEER_SCOPE_VIOLATION
    http: 403
    condition: "a DesignEngineer or SealingEngineer X-User-ID does not resolve to a stored Engineer"
  - id: ERR_CONFIG_NOT_FOUND
    http: 404
    condition: "a referenced Jurisdiction, GrainProfile, CoatingSpec or RollFormingLine id does not exist"
  - id: ERR_ENGINEER_NOT_FOUND
    http: 404
    condition: "the addressed Engineer id does not exist"
  - id: ERR_DEALER_NOT_FOUND
    http: 404
    condition: "the addressed or referenced Dealer id does not exist"
  - id: ERR_BIN_DESIGN_NOT_FOUND
    http: 404
    condition: "the addressed or referenced BinDesign id does not exist"
  - id: ERR_COIL_LOT_NOT_FOUND
    http: 404
    condition: "the addressed or referenced CoilLot id does not exist"
  - id: ERR_ROLL_FORMING_RUN_NOT_FOUND
    http: 404
    condition: "the addressed RollFormingRun id does not exist"
  - id: ERR_DEALER_ORDER_NOT_FOUND
    http: 404
    condition: "the addressed or referenced DealerOrder id does not exist"
  - id: ERR_FREIGHT_LOAD_NOT_FOUND
    http: 404
    condition: "the addressed FreightLoad id does not exist"
  - id: ERR_INSTALLATION_CREW_NOT_FOUND
    http: 404
    condition: "the addressed or referenced InstallationCrew id does not exist"
  - id: ERR_FIELD_FAILURE_NOT_FOUND
    http: 404
    condition: "the addressed FieldFailure id does not exist"
  - id: ERR_DESIGN_STATE_INVALID
    http: 409
    condition: "the BinDesign is not in a state that admits the requested design transition (submit-review needs DRAFT, request-revision and seal need UNDER_REVIEW, revise needs REVISION_REQUIRED, and RECALLED admits nothing)"
  - id: ERR_DESIGN_NOT_SEALED
    http: 409
    condition: "order confirmation is attempted while the referenced BinDesign has not reached SEALED and its jurisdiction requires a seal"
  - id: ERR_DESIGN_RECALLED
    http: 409
    condition: "an order is placed against a BinDesign in status RECALLED"
  - id: ERR_ORDER_STATE_INVALID
    http: 409
    condition: "the DealerOrder is not in a state that admits the requested transition (confirm needs production_status DRAFT; cancel rejects SHIPPED and CANCELLED; assign-crew rejects SHIPPED and CANCELLED and an already assigned crew)"
  - id: ERR_DEPOSIT_ALREADY_PAID
    http: 409
    condition: "a deposit is posted while financial_status is already DEPOSIT_PAID, RELEASED or VOIDED"
  - id: ERR_LOAD_STATE_INVALID
    http: 409
    condition: "the FreightLoad is not in a state that admits the requested transition (assign-order, dispatch and cancel need PLANNED; deliver needs DISPATCHED)"
  - id: ERR_RUN_STATE_INVALID
    http: 409
    condition: "the RollFormingRun is not in a state that admits the requested transition (complete needs SCHEDULED; void rejects VOIDED)"
  - id: ERR_COIL_LOT_NOT_AVAILABLE
    http: 409
    condition: "a run is scheduled against a CoilLot whose status is DEPLETED or QUARANTINED"
  - id: ERR_FAILURE_STATE_INVALID
    http: 409
    condition: "the FieldFailure is not in a state that admits the requested transition (start-analysis needs INTAKE; determine needs ANALYSIS_IN_PROGRESS)"
  - id: ERR_CREW_NOT_CERTIFIED
    http: 409
    condition: "crew assignment is attempted with an InstallationCrew whose status is PROBATION or REVOKED"
  - id: ERR_STALE_DESIGN_VERSION
    http: 412
    condition: "expected_bin_design_version does not equal the current BinDesign.version"
  - id: ERR_STALE_DEALER_VERSION
    http: 412
    condition: "expected_dealer_version does not equal the current Dealer.version"
  - id: ERR_MOISTURE_EXCEEDS_COATING_LIMIT
    http: 422
    condition: "BinDesign.moisture_pct exceeds the referenced CoatingSpec.max_ambient_moisture_pct"
  - id: ERR_WIND_BELOW_JURISDICTION_MINIMUM
    http: 422
    condition: "design_wind_speed_mph is below the referenced Jurisdiction.min_design_wind_speed_mph"
  - id: ERR_NO_PASSING_ANALYSIS
    http: 422
    condition: "submit-review finds no non-superseded DesignAnalysis whose design_method equals BinDesign.design_method"
  - id: ERR_DESIGN_ANALYSIS_FAILED
    http: 422
    condition: "the governing DesignAnalysis has verdict FAIL because utilization_ratio exceeds 1.0 at the clamped stiffener count"
  - id: ERR_CREW_TIER_INSUFFICIENT
    http: 422
    condition: "BinDesign.diameter_m exceeds the crew's tier max_diameter_m"
  - id: ERR_AERATION_UNDERSIZED
    http: 422
    condition: "the required airflow for the chosen aeration_package exceeds MAX_FAN_CFM before saturation"
  - id: ERR_SEAL_SEGREGATION_VIOLATION
    http: 403
    condition: "the acting SealingEngineer id equals BinDesign.author_engineer_id"
  - id: ERR_ENGINEER_LICENSE_LAPSED
    http: 422
    condition: "the acting Engineer.status is LAPSED"
  - id: ERR_ENGINEER_NOT_LICENSED_IN_JURISDICTION
    http: 422
    condition: "the design's Jurisdiction.code is absent from the acting Engineer.licensed_jurisdiction_codes"
  - id: ERR_CREW_DEALER_MISMATCH
    http: 422
    condition: "InstallationCrew.dealer_id differs from DealerOrder.dealer_id"
  - id: ERR_LOAD_DEALER_MISMATCH
    http: 422
    condition: "the assigned DealerOrder.dealer_id differs from FreightLoad.dealer_id"
  - id: ERR_COIL_GAUGE_MISMATCH
    http: 422
    condition: "CoilLot.gauge_mm differs from the BinDesign.sheet_gauge_mm of the run's dealer order"
  - id: ERR_WINDOW_ORDER_INVALID
    http: 400
    condition: "window_end is not strictly after window_start, or yard_window_end is before yard_window_start"
  - id: ERR_CREW_CERTIFICATION_EXPIRED
    http: 422
    condition: "the logical clock is after InstallationCrew.certified_until at assignment time"
  - id: ERR_LINE_WINDOW_CONFLICT
    http: 409
    condition: "the new run's half-open window intersects an existing run on the same line, or touches it with no changeover buffer while the coating_code differs"
  - id: ERR_YARD_SLOTS_EXHAUSTED
    http: 409
    condition: "the dealer already has staging_slots PLANNED loads whose closed yard windows intersect the new load's closed window"
  - id: ERR_SEASON_WINDOW_MISMATCH
    http: 422
    condition: "order_season differs from the season derived from the logical clock month"
  - id: ERR_PERMIT_REVIEW_PENDING
    http: 422
    condition: "confirmation is attempted before permit_ready_at on a design whose jurisdiction requires a seal"
  - id: ERR_GAUGE_EXCEEDS_LINE_CAPACITY
    http: 422
    condition: "the order's design sheet_gauge_mm exceeds RollFormingLine.max_gauge_mm"
  - id: ERR_HIGH_CUBE_ACCESS_DENIED
    http: 422
    condition: "a HIGH_CUBE_VAN load is planned for a dealer whose high_cube_access is false"
  - id: ERR_LOAD_CAPACITY_EXCEEDED
    http: 409
    condition: "adding the order would push assigned_cube_m3 above max_cube_m3 or assigned_weight_kg above max_weight_kg"
  - id: ERR_ORDER_ALREADY_ON_LOAD
    http: 409
    condition: "the order's freight_load_id is already set"
  - id: ERR_LOAD_HAS_NO_ORDERS
    http: 409
    condition: "dispatch is attempted while FreightLoad.order_count is 0"
  - id: ERR_LOAD_BELOW_MIN_CUBE_UTILIZATION
    http: 409
    condition: "a HIGH_CUBE_VAN load is dispatched with cube_utilization_pct below MIN_CUBE_UTILIZATION_PCT"
  - id: ERR_COIL_INSUFFICIENT_MASS
    http: 422
    condition: "planned_kg exceeds CoilLot.remaining_kg"
  - id: ERR_RUN_MASS_EXCEEDS_RESERVED
    http: 422
    condition: "consumed_kg plus scrap_kg exceeds RollFormingRun.planned_kg"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "Dealer.credit_available_cents is below the order's credit_hold_cents at confirmation"
  - id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http: 422
    condition: "amount_cents does not equal required_deposit_cents exactly"
  - id: ERR_DEPOSIT_REQUIRED
    http: 402
    condition: "dispatch is attempted while an attached order's financial_status is still AWAITING_DEPOSIT"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: PlantAdmin
    description: "Plant operations administrator: registers configuration, engineers, dealerships, crews, moves the logical clock, resets credit limits and assigns installation crews."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /jurisdictions"
      - "POST /grain-profiles"
      - "POST /coating-specs"
      - "POST /roll-forming-lines"
      - "POST /engineers"
      - "POST /engineers/{id}/lapse"
      - "POST /dealers"
      - "POST /dealers/{id}/credit-limit"
      - "POST /installation-crews"
      - "POST /dealer-orders/{id}/assign-crew"
    shared_operations: ["every GET endpoint"]

  - name: DesignEngineer
    description: "Engineer of record who authors, analyses, submits and revises bin designs. Never seals their own work."
    identity: "entity_backed:Engineer"
    exclusive_operations:
      - "POST /bin-designs"
      - "POST /bin-designs/{id}/analyses"
      - "POST /bin-designs/{id}/submit-review"
      - "POST /bin-designs/{id}/revise"
    shared_operations: ["every GET endpoint"]

  - name: SealingEngineer
    description: "Engineer of record who reviews an UNDER_REVIEW design and either returns it for revision or applies the engineering seal. Segregation of duties: the acting engineer id must differ from the design's author_engineer_id."
    identity: "entity_backed:Engineer"
    exclusive_operations:
      - "POST /bin-designs/{id}/request-revision"
      - "POST /bin-designs/{id}/seal"
    shared_operations: ["every GET endpoint"]

  - name: ProductionPlanner
    description: "Schedules roll-forming line time against coil lots and posts run completion or void."
    identity: "opaque"
    exclusive_operations:
      - "POST /coil-lots"
      - "POST /roll-forming-runs"
      - "POST /roll-forming-runs/{id}/complete"
      - "POST /roll-forming-runs/{id}/void"
    shared_operations: ["every GET endpoint"]

  - name: DealerPrincipal
    description: "Dealership principal who places, confirms, pays deposits on and cancels their own orders. X-User-ID equals the Dealer id they act for."
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "POST /dealer-orders"
      - "POST /dealer-orders/{id}/confirm"
      - "POST /dealer-orders/{id}/payments"
      - "POST /dealer-orders/{id}/cancel"
    shared_operations: ["every GET endpoint"]

  - name: LogisticsCoordinator
    description: "Plans freight loads onto dealer yard windows, assigns orders, dispatches and delivers."
    identity: "opaque"
    exclusive_operations:
      - "POST /freight-loads"
      - "POST /freight-loads/{id}/assign-order"
      - "POST /freight-loads/{id}/dispatch"
      - "POST /freight-loads/{id}/deliver"
      - "POST /freight-loads/{id}/cancel"
    shared_operations: ["every GET endpoint"]

  - name: QualityInspector
    description: "Opens and adjudicates field failure investigations on collapses and corrosion."
    identity: "opaque"
    exclusive_operations:
      - "POST /field-failures"
      - "POST /field-failures/{id}/start-analysis"
      - "POST /field-failures/{id}/determine"
    shared_operations: ["every GET endpoint"]
