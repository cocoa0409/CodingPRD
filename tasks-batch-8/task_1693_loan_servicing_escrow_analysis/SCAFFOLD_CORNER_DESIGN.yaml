# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Loan Servicing Escrow Analysis
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_loan_success_defaults
        claim_type: creation
        grounds: [entities.Loan]
        distinguishing_aspect: "POST with required fields -> 201; escrow_required defaults true; status ONBOARDING; version 1; id/created_at server-minted."
        test_recipe:
          setup: ["empty DB; clock unset (default 2026-08-01T00:00:00Z)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-ENT-1", borrower_name: "Ed Ent", principal_balance_cents: 30000000, monthly_pi_cents: 180000, closing_date: "2026-08-01" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
          assert:
            - "Loan.${loan_id}.status == ONBOARDING"
            - "Loan.${loan_id}.escrow_required == true (default applied)"
            - "Loan.${loan_id}.version == 1"
            - "Loan.${loan_id}.created_at == 2026-08-01T00:00:00Z (default clock)"

      - name: create_loan_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Loan, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting loan_number -> 400 ERR_INVALID_REQUEST; no resource created."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /servicing/loans", payload: { borrower_name: "No Number", principal_balance_cents: 30000000, monthly_pi_cents: 180000, closing_date: "2026-08-01" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "GET /servicing/loans returns 0 rows"

      - name: get_loan_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Loan, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /servicing/loans/00000000-0000-4000-8000-000000000000", payload: {}, as: ComplianceOfficer, as_user_id: "co_1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND (http 404)"

      - name: escrow_account_create_extra_field_ignored
        claim_type: computed_fields
        grounds: [entities.EscrowAccount.fields.balance_cents, entities.EscrowAccount.fields.target_cushion_cents]
        distinguishing_aspect: "Computed fields in the request body are silently ignored: target_cushion_cents 999999 in, response shows the computed 0."
        test_recipe:
          setup: ["loan LN-ENT-2 ONBOARDING"]
          setup_api_calls:
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-ENT-2", borrower_name: "Ig Nored", principal_balance_cents: 30000000, monthly_pi_cents: 180000, closing_date: "2026-08-01", escrow_required: true }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
          trigger:
            - { call: "POST /servicing/loans/${loan_id}/escrow-account", payload: { target_cushion_cents: 999999, balance_cents: 777 }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_id: $.data.id } }
          assert:
            - "EscrowAccount.${acct_id}.target_cushion_cents == 0 (computed, input ignored)"
            - "EscrowAccount.${acct_id}.balance_cents == 0 (computed, input ignored)"
            - "EscrowAccount.${acct_id}.account_status == SETUP and hold_status == NONE"

      - name: payee_created_pending_with_sod_anchor
        claim_type: defaults
        grounds: [entities.Payee]
        distinguishing_aspect: "New payee starts PENDING_VERIFICATION with created_by_user_id pinned to the creator and verified_at null."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /servicing/payees", payload: { payee_type: "TAX_AUTHORITY", legal_name: "County Treasurer", remit_to_address: "1 Civic Center", ach_routing_mask: "****1234" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { pay_id: $.data.id } }
          assert:
            - "Payee.${pay_id}.verification_status == PENDING_VERIFICATION"
            - "Payee.${pay_id}.created_by_user_id == dp_1"
            - "Payee.${pay_id}.verified_by_user_id == null and verified_at == null"

      - name: analysis_projection_start_invalid_rejected
        claim_type: type_constraints
        grounds: [entities.EscrowAnalysisCycle.fields.projection_start_date, "errors[ERR_PROJECTION_START_INVALID]"]
        distinguishing_aspect: "projection_start_date not on a month boundary (2026-09-15) -> ERR_PROJECTION_START_INVALID."
        test_recipe:
          setup: ["Setup A account ACTIVE (one TAX line item suffices)"]
          setup_api_calls:
            - { call: "POST /servicing/payees", payload: { payee_type: "TAX_AUTHORITY", legal_name: "County Treasurer", remit_to_address: "1 Civic Center", ach_routing_mask: "****1234" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { pay_id: $.data.id } }
            - { call: "POST /servicing/payees/${pay_id}/verify", payload: {}, as: PayeeVerifier, as_user_id: "pv_1" }
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-ENT-3", borrower_name: "Pro Jection", principal_balance_cents: 30000000, monthly_pi_cents: 180000, closing_date: "2026-08-01", escrow_required: true }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/escrow-account", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "PROPERTY_TAX", expected_annual_amount_cents: 240000, installments_per_year: 2, first_due_date: "2026-12-15" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/activate", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "GET /servicing/escrow-accounts/${acct_id}", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_v: $.data.version } }
          trigger:
            - { call: "POST /servicing/escrow-accounts/${acct_id}/analyses", payload: { analysis_year: 2027, projection_start_date: "2026-09-15", method: "PROSPECTIVE", expected_escrow_account_version: "${acct_v}" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_PROJECTION_START_INVALID"
            - "GET /servicing/escrow-accounts/${acct_id}/analyses returns 0 rows"

  - section: state_machines
    instances:
      - name: disbursement_created_in_scheduled
        claim_type: initial_state
        grounds: [state_machines.Disbursement]
        distinguishing_aspect: "A newly scheduled disbursement is SCHEDULED with scheduled_by_user_id pinned and released_by_user_id null."
        test_recipe:
          setup: ["Setup A account ACTIVE with TAX line item"]
          setup_api_calls:
            - { call: "POST /servicing/payees", payload: { payee_type: "TAX_AUTHORITY", legal_name: "County Treasurer", remit_to_address: "1 Civic Center", ach_routing_mask: "****1234" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { pay_id: $.data.id } }
            - { call: "POST /servicing/payees/${pay_id}/verify", payload: {}, as: PayeeVerifier, as_user_id: "pv_1" }
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-SM-1", borrower_name: "St Macy", principal_balance_cents: 30000000, monthly_pi_cents: 180000, closing_date: "2026-08-01", escrow_required: true }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/escrow-account", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "PROPERTY_TAX", expected_annual_amount_cents: 240000, installments_per_year: 2, first_due_date: "2026-12-15" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { li_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/activate", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
          trigger:
            - { call: "POST /servicing/escrow-accounts/${acct_id}/disbursements", payload: { line_item_id: "${li_id}", payee_id: "${pay_id}", amount_cents: 30000, due_date: "2026-12-20", scheduled_release_date: "2026-12-01" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { disb_id: $.data.id } }
          assert:
            - "Disbursement.${disb_id}.status == SCHEDULED"
            - "Disbursement.${disb_id}.scheduled_by_user_id == dp_1"
            - "Disbursement.${disb_id}.released_by_user_id == null and late_release == false"

      - name: cancel_released_disbursement_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Disbursement]
        distinguishing_aspect: "cancel from RELEASED is not in the transition table -> ERR_INVALID_STATE_TRANSITION; disbursement stays RELEASED."
        test_recipe:
          setup: ["Setup A account ACTIVE; balance 100000; disbursement 30000 released on 2026-08-10"]
          setup_api_calls:
            - { call: "POST /servicing/payees", payload: { payee_type: "TAX_AUTHORITY", legal_name: "County Treasurer", remit_to_address: "1 Civic Center", ach_routing_mask: "****1234" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { pay_id: $.data.id } }
            - { call: "POST /servicing/payees/${pay_id}/verify", payload: {}, as: PayeeVerifier, as_user_id: "pv_1" }
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-SM-2", borrower_name: "Re Leased", principal_balance_cents: 30000000, monthly_pi_cents: 180000, closing_date: "2026-08-01", escrow_required: true }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/escrow-account", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "PROPERTY_TAX", expected_annual_amount_cents: 240000, installments_per_year: 2, first_due_date: "2026-12-15" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { li_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/activate", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/deposits", payload: { amount_cents: 100000, effective_date: "2026-08-05" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/disbursements", payload: { line_item_id: "${li_id}", payee_id: "${pay_id}", amount_cents: 30000, due_date: "2026-08-20", scheduled_release_date: "2026-08-10" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { disb_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/disbursements/${disb_id}/release", payload: {}, as: DisbursementProcessor, as_user_id: "dp_2" }
          trigger:
            - { call: "POST /servicing/disbursements/${disb_id}/cancel", payload: {}, as: DisbursementProcessor, as_user_id: "dp_1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"
            - "Disbursement.${disb_id}.status == RELEASED (unchanged)"
            - "EscrowAccount.${acct_id}.balance_cents == 70000 (no compensation posted)"

      - name: terminal_case_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.ErrorResolutionCase]
        distinguishing_aspect: "Resolving an already RESOLVED_NO_ERROR case -> ERR_ALREADY_TERMINAL (409)."
        test_recipe:
          setup: ["Case on LN-SM-3 resolved NO_ERROR (acknowledge, assign to ea_9, resolve as co_1)"]
          setup_api_calls:
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-SM-3", borrower_name: "Ter Minal", principal_balance_cents: 22000000, monthly_pi_cents: 140000, closing_date: "2026-07-01", escrow_required: false }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/loans/${loan_id}/error-cases", payload: { error_type: "PAYMENT_APPLICATION_ERROR", description: "Payment misapplied" }, as: Borrower, as_user_id: "${loan_id}", captures: { case_id: $.data.id } }
            - { call: "POST /servicing/error-cases/${case_id}/acknowledge", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/error-cases/${case_id}/assign", payload: { assigned_to_user_id: "ea_9" }, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/error-cases/${case_id}/resolve", payload: { outcome: "NO_ERROR", resolution_note: "Ledger verified correct" }, as: ComplianceOfficer, as_user_id: "co_1" }
          trigger:
            - { call: "POST /servicing/error-cases/${case_id}/resolve", payload: { outcome: "NO_ERROR", resolution_note: "again" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ALREADY_TERMINAL"
            - "ErrorResolutionCase.${case_id}.status == RESOLVED_NO_ERROR (unchanged)"

      - name: notice_double_acknowledge_rejected
        claim_type: idempotency
        grounds: [state_machines.PaymentChangeNotice]
        distinguishing_aspect: "Second acknowledge on an ACKNOWLEDGED notice -> ERR_INVALID_STATE_TRANSITION; stored shortage_option unchanged."
        test_recipe:
          setup: ["Setup A finalized (shortage 60000); notice SENT; borrower acknowledged SPREAD_12 once"]
          setup_api_calls:
            - { call: "POST /servicing/payees", payload: { payee_type: "TAX_AUTHORITY", legal_name: "County Treasurer", remit_to_address: "1 Civic Center", ach_routing_mask: "****1234" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { pay_id: $.data.id } }
            - { call: "POST /servicing/payees/${pay_id}/verify", payload: {}, as: PayeeVerifier, as_user_id: "pv_1" }
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-SM-4", borrower_name: "Idem Potent", principal_balance_cents: 30000000, monthly_pi_cents: 180000, closing_date: "2026-08-01", escrow_required: true }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/escrow-account", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "PROPERTY_TAX", expected_annual_amount_cents: 240000, installments_per_year: 2, first_due_date: "2026-12-15" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "HAZARD_INSURANCE", expected_annual_amount_cents: 120000, installments_per_year: 1, first_due_date: "2027-03-01" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/activate", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/deposits", payload: { amount_cents: 60000, effective_date: "2026-08-10" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "GET /servicing/escrow-accounts/${acct_id}", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_v: $.data.version } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/analyses", payload: { analysis_year: 2027, projection_start_date: "2026-09-01", method: "PROSPECTIVE", expected_escrow_account_version: "${acct_v}" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { ana_id: $.data.id } }
            - { call: "POST /servicing/analyses/${ana_id}/compute", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/analyses/${ana_id}/issue-statement", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/analyses/${ana_id}/finalize", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "GET /servicing/analyses/${ana_id}/notices", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { not_id: "$.data[0].id" } }
            - { call: "POST /servicing/notices/${not_id}/send", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/notices/${not_id}/acknowledge", payload: { shortage_option: "SPREAD_12" }, as: Borrower, as_user_id: "${loan_id}" }
          trigger:
            - { call: "POST /servicing/notices/${not_id}/acknowledge", payload: { shortage_option: "LUMP_SUM" }, as: Borrower, as_user_id: "${loan_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"
            - "PaymentChangeNotice.${not_id}.status == ACKNOWLEDGED and shortage_option == SPREAD_12 (first write kept)"

      - name: payee_suspend_blocks_and_reverify_restores
        claim_type: side_effect_execution
        grounds: [state_machines.Payee, state_machines.Disbursement.SCHEDULED_to_BLOCKED]
        distinguishing_aspect: "Conditional cascade both ways: suspending the payee flips its SCHEDULED disbursement to BLOCKED; re-verifying the same payee flips it back to SCHEDULED."
        test_recipe:
          setup: ["Setup A account ACTIVE; disbursement 30000 SCHEDULED (due 2026-12-20, release 2026-12-01)"]
          setup_api_calls:
            - { call: "POST /servicing/payees", payload: { payee_type: "TAX_AUTHORITY", legal_name: "County Treasurer", remit_to_address: "1 Civic Center", ach_routing_mask: "****1234" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { pay_id: $.data.id } }
            - { call: "POST /servicing/payees/${pay_id}/verify", payload: {}, as: PayeeVerifier, as_user_id: "pv_1" }
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-SM-5", borrower_name: "Su Spended", principal_balance_cents: 30000000, monthly_pi_cents: 180000, closing_date: "2026-08-01", escrow_required: true }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/escrow-account", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "PROPERTY_TAX", expected_annual_amount_cents: 240000, installments_per_year: 2, first_due_date: "2026-12-15" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { li_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/activate", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/disbursements", payload: { line_item_id: "${li_id}", payee_id: "${pay_id}", amount_cents: 30000, due_date: "2026-12-20", scheduled_release_date: "2026-12-01" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { disb_id: $.data.id } }
          trigger:
            - { call: "POST /servicing/payees/${pay_id}/suspend", payload: {}, as: PayeeVerifier, as_user_id: "pv_2" }
            - { call: "POST /servicing/payees/${pay_id}/verify", payload: {}, as: PayeeVerifier, as_user_id: "pv_1" }
          assert:
            - "After suspend: Payee.${pay_id}.verification_status == SUSPENDED and Disbursement.${disb_id}.status == BLOCKED"
            - "After re-verify: Payee.${pay_id}.verification_status == VERIFIED and Disbursement.${disb_id}.status == SCHEDULED (restored by cascade)"

      - name: loan_payoff_closes_escrow_with_refund
        claim_type: side_effect_execution
        grounds: [state_machines.Loan.ACTIVE_to_PAID_OFF, state_machines.EscrowAccount]
        distinguishing_aspect: "Payoff cascade: escrow account CLOSED, residual 50000 refunded via SURPLUS_REFUND entry, pending disbursement CANCELLED, loan PAID_OFF."
        test_recipe:
          setup: ["Setup A account ACTIVE; balance 50000; one SCHEDULED disbursement; no advances"]
          setup_api_calls:
            - { call: "POST /servicing/payees", payload: { payee_type: "TAX_AUTHORITY", legal_name: "County Treasurer", remit_to_address: "1 Civic Center", ach_routing_mask: "****1234" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { pay_id: $.data.id } }
            - { call: "POST /servicing/payees/${pay_id}/verify", payload: {}, as: PayeeVerifier, as_user_id: "pv_1" }
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-SM-6", borrower_name: "Pay Off", principal_balance_cents: 30000000, monthly_pi_cents: 180000, closing_date: "2026-08-01", escrow_required: true }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/escrow-account", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "PROPERTY_TAX", expected_annual_amount_cents: 240000, installments_per_year: 2, first_due_date: "2026-12-15" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { li_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/activate", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
