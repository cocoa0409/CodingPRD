  # ===========================================================================
  - section: consistency_model
    instances:
      - name: refund_cascade_fully_visible_in_same_request
        claim_type: immediate
        grounds: [state_machines.FinancedPurchase.settlement_status_SETTLED_to_REFUNDED, state_machines.Settlement.PAID_to_CLAWED_BACK]
        excluded_because:
          difficulty_instance: transitive_cascade / refund_depth3_purchase_settlement_provider_account_delinquency
          rationale: "The immediate-consistency claim (all cascade effects visible after the single refund request) is exactly what the depth-3 refund cascade §1.8 instance asserts end-to-end."
