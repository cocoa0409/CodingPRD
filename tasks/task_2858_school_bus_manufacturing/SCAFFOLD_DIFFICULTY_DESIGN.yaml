      - name: recall_build_window_closed_endpoint_on_delivery_date
        grounds:
          - calculations.recall_scope
          - validations[priority=45]
          - errors[ERR_NO_AFFECTED_UNITS]
          - state_machines.RecallCampaign.DRAFT_to_LAUNCHED
          - entities.RecallCampaign.fields.build_window_end
        distinguishing_aspect: |
          The build window is a CLOSED date interval on the unit's delivered_at date, so a bus delivered
          exactly on 2026-08-01 is out of scope for a window ending 2026-07-31 (launch refused for having
          no affected units) and in scope for a window ending 2026-08-01. One calendar day, evaluated on
          the date part of an instant, flips a campaign from unlaunchable to a one-task campaign.
        test_recipe:
          setup:
            - "TYPE_C_CONV + DSL-100 and the PUBLISHED TX 2026-2027 profile"
            - "Dealer D-TX-02 licensed in TX"
            - "The logical clock left at its default 2026-08-01T00:00:00Z"
            - "One legacy fleet record delivered exactly 2026-08-01T00:00:00Z (equal to the clock, which validation priority 53 allows)"
            - "Campaign RC-EDGE-A with build window 2026-01-01 .. 2026-07-31 and RC-EDGE-B with build window 2026-01-01 .. 2026-08-01, both DRAFT, kits_per_unit 1, total_kits 3"
