  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: reinstatement_window_half_open
        grounds:
          - state_machines.Policy
          - validations[priority=6]
        distinguishing_aspect: |
          Reinstatement window semantics: half-open [lapse_date,
          lapse_date + 5 years) — at exactly lapse_date + 5y, request is
          REJECTED (window expired). Interval semantics = half-open with
          strict inequality at the upper bound. Resource = Policy.
        test_recipe:
          setup:
            - "Policy lapsed on 2026-07-03 (grace ended 2026-07-02, lapsed 2026-07-03)"
            - "Clock advanced to exactly 2031-07-03 (5y later)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Yara Y", date_of_birth: "1980-09-01T00:00:00Z", tobacco_user: false, gender: "FEMALE" }
              as: Agent
              captures: { ip_y: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-Y", product_type: "WHOLE_LIFE_NON_PARTICIPATING", participating: false, allows_policy_loans: false, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 50, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_y: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_y}", product_template_id: "${tpl_y}", requested_face_amount_cents: 10000000, premium_mode: "MONTHLY" }
              as: Agent
              captures: { app_y: $.data.id }
            - call: "POST /applications/${app_y}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${app_y}/approve"
              payload: { underwriting_class: "STANDARD_NON_TOBACCO" }
              as: Underwriter
            - call: "POST /applications/${app_y}/issue"
              payload: {}
              as: PolicyIssuer
              captures: { pol_y: $.data.id }
            # Lapse the policy: advance past cycle end + grace
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-03T00:00:00Z" }
              as: PlatformAdmin
            # Advance to just inside window (1 day before 5y mark) — should succeed
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2031-07-02T23:59:59Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /policies/${pol_y}/reinstatement-requests"
              payload: {}
              as: Agent
              captures: { rr_y: $.data.id }
            # Move past the boundary, then attempt another reinstatement (after declining the first)
            - call: "POST /policies/${pol_y}/reinstatement-requests/${rr_y}/decline"
              payload: {}
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2031-07-03T00:00:01Z" }
              as: PlatformAdmin
            - call: "POST /policies/${pol_y}/reinstatement-requests"
              payload: {}
              as: Agent
              captures: { err: $.data.error_id }
          assert:
            - "First reinstatement at 2031-07-02T23:59:59Z succeeds (inside window)"
            - "Second reinstatement at 2031-07-03T00:00:01Z fails with ERR_WINDOW_EXPIRED"

      - name: conversion_window_aggregate_capacity
        grounds:
          - state_machines.ConversionRequest
          - validations[priority=6]
        distinguishing_aspect: |
          Conversion window semantics differ from reinstatement: the
          window is closed-inclusive on the lower bound (issue_date) but
          the upper bound is treated as "on-or-before" (<= issue_date + 5y
          succeeds; > fails). Different interval semantics from the
          half-open reinstatement window, on a different resource
          (ConversionRequest vs Policy).
        test_recipe:
          setup:
            - "TERM_CONVERTIBLE policy issued 2026-05-01"
            - "Clock at exactly 2031-05-01 (5y anniversary, inclusive)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Zach Z", date_of_birth: "1985-05-10T00:00:00Z", tobacco_user: false, gender: "MALE" }
              as: Agent
              captures: { ip_z: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "TERM-Z", product_type: "TERM_CONVERTIBLE", participating: false, allows_policy_loans: false, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 20, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_z_term: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-Z", product_type: "WHOLE_LIFE_NON_PARTICIPATING", participating: false, allows_policy_loans: true, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 50, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_z_wl: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_z}", product_template_id: "${tpl_z_term}", requested_face_amount_cents: 10000000, premium_mode: "ANNUAL" }
              as: Agent
              captures: { app_z: $.data.id }
            - call: "POST /applications/${app_z}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${app_z}/approve"
              payload: { underwriting_class: "STANDARD_NON_TOBACCO" }
              as: Underwriter
            - call: "POST /applications/${app_z}/issue"
              payload: {}
              as: PolicyIssuer
              captures: { pol_z: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2031-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /policies/${pol_z}/conversion-requests"
              payload: { target_product_template_id: "${tpl_z_wl}", requested_face_amount_cents: 5000000 }
              as: Agent
              captures: { conv_z: $.data.id }
            - call: "POST /policies/${pol_z}/conversion-requests/${conv_z}/decline"
              payload: {}
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2031-05-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /policies/${pol_z}/conversion-requests"
              payload: { target_product_template_id: "${tpl_z_wl}", requested_face_amount_cents: 5000000 }
              as: Agent
              captures: { err: $.data.error_id }
          assert:
            - "Conversion at exactly 5y anniversary succeeds (inclusive upper bound)"
            - "Conversion at 5y + 1 day fails with ERR_WINDOW_EXPIRED"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: loan_origination_repayment_conserves_cash_value_plus_outstanding
        grounds:
          - entities.Policy.fields.cash_value_cents
          - entities.Policy.fields.outstanding_loan_principal_cents
          - entities.PolicyLoan
        distinguishing_aspect: |
          Conserved quantity: cash_value_cents +
          outstanding_loan_principal_cents. Loan origination debits cash
          value and credits outstanding principal by the same amount
          (ignoring interest); full repayment reverses it. After
          origination-then-full-repayment, the sum MUST equal its value
          before origination (modulo interest accrued, which is added to
          cash value via PREMIUM_CREDIT or tracked separately).
        test_recipe:
          setup:
            - "Policy with cash_value_cents = 100_000_00; no loans"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Anna A2", date_of_birth: "1981-11-11T00:00:00Z", tobacco_user: false, gender: "FEMALE" }
              as: Agent
              captures: { ip_a2: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-A2", product_type: "WHOLE_LIFE_NON_PARTICIPATING", participating: false, allows_policy_loans: true, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 50, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_a2: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_a2}", product_template_id: "${tpl_a2}", requested_face_amount_cents: 10000000, premium_mode: "ANNUAL" }
              as: Agent
              captures: { app_a2: $.data.id }
            - call: "POST /applications/${app_a2}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${app_a2}/approve"
              payload: { underwriting_class: "STANDARD_NON_TOBACCO" }
              as: Underwriter
            - call: "POST /applications/${app_a2}/issue"
              payload: {}
              as: PolicyIssuer
              captures: { pol_a2: $.data.id }
            - call: "POST /policies/${pol_a2}/premium-payments"
              payload: { amount_cents: 10000000 }
              as: Agent
            - call: "GET /policies/${pol_a2}"
              payload: {}
              as: Agent
              captures: { cv_before: $.data.cash_value_cents, ol_before: $.data.outstanding_loan_principal_cents }
          trigger:
            - call: "POST /policies/${pol_a2}/loans"
              payload: { requested_amount_cents: 3000000 }
              as: Policyholder
              as_user_id: "${ip_a2}"
              captures: { loan_a2: $.data.id }
            - call: "POST /policies/${pol_a2}/loans/${loan_a2}/repayments"
              payload: { amount_cents: 3000000 }
              as: Policyholder
              as_user_id: "${ip_a2}"
            - call: "GET /policies/${pol_a2}"
              payload: {}
              as: Agent
              captures: { cv_after: $.data.cash_value_cents, ol_after: $.data.outstanding_loan_principal_cents }
          assert:
            - "PolicyLoan.${loan_a2}.status == REPAID"
            - "Policy.${pol_a2}.outstanding_loan_principal_cents == 0"
            - "Policy.${pol_a2}.cash_value_cents + Policy.${pol_a2}.outstanding_loan_principal_cents == (cash_value before loan) + (outstanding before loan)  # conserved"

      - name: dividend_paid_up_additions_conserves_total_value
        grounds:
          - entities.Policy.fields.dividend_accumulation_cents
          - entities.Policy.fields.face_amount_cents
          - entities.DividendDeclaration
        distinguishing_aspect: |
          Different conserved quantity from the loan invariant:
          dividend_accumulation_cents + face_amount_cents. A
          PAID_UP_ADDITIONS dividend credits both fields by declared
          amount and face-addition respectively; if the policy is then
          surrendered, the payout_cents MUST equal cash_value +
          dividend_accumulation - surrender_charge (no leakage). Conserved
          across declaration → surrender forward/compensating pair.
        test_recipe:
          setup:
            - "Participating WHOLE_LIFE policy, dividend_option = PAID_UP_ADDITIONS"
            - "Declared dividend of 50_000_00 applied"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /insured-persons"
              payload: { full_name: "Beth B2", date_of_birth: "1970-02-02T00:00:00Z", tobacco_user: false, gender: "FEMALE" }
              as: Agent
              captures: { ip_b2: $.data.id }
            - call: "POST /product-templates"
              payload: { product_code: "WL-PAR-B2", product_type: "WHOLE_LIFE_PARTICIPATING", participating: true, allows_policy_loans: true, min_face_amount_cents: 1000000, max_face_amount_cents: 100000000, base_monthly_premium_rate_per_thousand_cents: 60, coi_rate_table: [], surrender_charge_schedule: [] }
              as: PlatformAdmin
              captures: { tpl_b2: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_b2}", product_template_id: "${tpl_b2}", requested_face_amount_cents: 10000000, premium_mode: "ANNUAL" }
              as: Agent
              captures: { app_b2: $.data.id }
            - call: "POST /applications/${app_b2}/begin-review"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${app_b2}/approve"
              payload: { underwriting_class: "STANDARD_NON_TOBACCO" }
              as: Underwriter
            - call: "POST /applications/${app_b2}/issue"
              payload: {}
              as: PolicyIssuer
              captures: { pol_b2: $.data.id, pol_v_b2: $.data.version }
            - call: "POST /policies/${pol_b2}/premium-payments"
              payload: { amount_cents: 10000000 }
              as: Agent
            # Switch option to PAID_UP_ADDITIONS
            - call: "GET /policies/${pol_b2}"
              payload: {}
              as: Policyholder
              as_user_id: "${ip_b2}"
              captures: { pol_v_b2b: $.data.version, face_before: $.data.face_amount_cents, accum_before: $.data.dividend_accumulation_cents }
            - call: "POST /policies/${pol_b2}/dividend-option"
              payload: { dividend_option: "PAID_UP_ADDITIONS", expected_policy_version: "${pol_v_b2b}" }
              as: Policyholder
              as_user_id: "${ip_b2}"
          trigger:
            - call: "POST /policies/${pol_b2}/dividend-declarations"
              payload: { policy_year: 1, declared_amount_cents: 5000000 }
              as: PlatformAdmin
            - call: "GET /policies/${pol_b2}"
              payload: {}
              as: Agent
              captures: { face_after: $.data.face_amount_cents, accum_after: $.data.dividend_accumulation_cents }
          assert:
            - "Policy.${pol_b2}.dividend_accumulation_cents == (accum before) + 5000000"
            - "Policy.${pol_b2}.face_amount_cents == (face before) + round_half_up(5000000 / rate_for_attained_age)  # paid-up addition credits face"
            - "Sum dividend_accumulation_cents + face_amount_cents strictly increases by declared + face_addition (no drift)"
