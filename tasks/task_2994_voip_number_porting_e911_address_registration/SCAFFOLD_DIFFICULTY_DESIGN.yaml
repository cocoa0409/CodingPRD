          setup:
            - "clock at 2026-08-03T09:00:00Z (a Monday); ACTIVE account; STRICT carrier with foc_business_days 3 and porting_buffer_minutes 60"
            - "one block with exactly one minted number, held by a HELD PORT_BRIDGE reservation for the account"
            - "port request VALIDATED by a matching CSR snapshot, SCHEDULED onto an OPEN slot [2026-08-10T14:00Z, 2026-08-10T18:00Z), and bridged by a PROVISIONED TemporaryBridge"
