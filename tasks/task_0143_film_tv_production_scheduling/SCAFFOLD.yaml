# =============================================================================
# PRD Benchmark Scaffold — Film/TV Production Scheduling
# =============================================================================
scenario: |
  Film/TV Production Scheduling: shooting schedule/stripboard, call sheet,
  SAG-AFTRA day rate/turnaround/meal penalty, location permit, budget vs actual,
  residual tracking, dailies, union fringe

domain_name: film-tv-production-scheduling
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities joined by foreign keys; URLs are flat top-level collections
  # (`/productions/{id}`, `/assignments/{id}`, …) with parent ids carried in the
  # request body, not nested in the path.

  state_machine_shape: parallel
  # Assignment carries two independent state dimensions (attendance_status ×
  # payment_status); CallSheet is cyclic (PUBLISHED→REVISED→PUBLISHED);
  # LocationPermit and ShootingDay branch (fork to terminal-or-revert);
  # Dailies cycles (FLAGGED→IN_REVIEW→APPROVED).

  relationship_patterns:
    - one_to_many        # Production → ShootingDay, CrewMember, Location, BudgetLine
    - cross_aggregate    # Assignment references ShootingDay AND CrewMember
    - polymorphic        # (not used) — all FKs are typed

  role_model: peer_roles
  # LineProducer owns budget/permits/productions; FirstAD owns the schedule and
  # call sheets; PayrollCoordinator owns assignment payment + residuals;
  # PostSupervisor owns dailies. UnionRep is a read/audit role.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Production
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: Production title.
        constraints: non-empty
      - name: production_type
        type: enum
        source: input
        description: Whether this is a feature film or episodic TV.
        constraints: "one of {FEATURE, EPISODIC}"
      - name: status
        type: enum
        source: system
        description: Production lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, PRE_PRODUCTION, ACTIVE, WRAPPED, CLOSED}"
      - name: total_budget_cents
        type: integer
        source: input
        description: Top-line approved budget in cents.
        constraints: ">= 0"
      - name: committed_cost_cents
        type: integer
        source: computed
        description: >
          Sum of estimated_cost_cents over every Assignment of this Production
          whose payment_status IN {UNPAID, APPROVED}, plus paid_cost_cents over
          PAID assignments. Recomputed on every assignment cost change.
        default: 0
      - name: actual_cost_cents
        type: integer
        source: computed
        description: >
          Sum of paid_cost_cents over every Assignment of this Production whose
          payment_status == PAID. Recomputed when an assignment is marked PAID.
        default: 0
      - name: residual_reserve_cents
        type: integer
        source: computed
        description: >
          Running residual liability accrued from ResidualEvents under this
          Production, recomputed by the residual calculation on each new event.
        default: 0

  - name: BudgetLine
    parent: Production
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; the production this line belongs to."
      - name: category
        type: enum
        source: input
        description: Budget category.
        constraints: "one of {ABOVE_THE_LINE, BELOW_THE_LINE_LABOR, LOCATIONS, POST, FRINGES}"
      - name: estimated_cents
        type: integer
        source: input
        description: Estimated amount budgeted for this category.
        constraints: ">= 0"
      - name: actual_cents
        type: integer
        source: computed
        description: >
          Sum of cost actually attributed to this category. For
          BELOW_THE_LINE_LABOR this equals the sum of paid_cost_cents over PAID
          Assignments of the production; for FRINGES it is the accrued fringe;
          other categories are updated by explicit actuals postings.
        default: 0
      - name: variance_cents
        type: integer
        source: computed
        description: "estimated_cents - actual_cents (positive = under budget)."
        default: 0

  - name: ShootingDay
    parent: Production
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; the production being shot."
      - name: shoot_date
        type: string
        source: input
        description: Calendar date of the shoot (YYYY-MM-DD).
        constraints: ISO date
      - name: day_number
        type: integer
        source: input
        description: Stripboard ordinal of this shooting day within the production.
        constraints: ">= 1, unique per production among non-CANCELLED days"
      - name: unit
        type: enum
        source: input
        description: Which shooting unit covers this day.
        default: MAIN
        constraints: "one of {MAIN, SECOND, SPLINTER}"
      - name: status
        type: enum
        source: system
        description: Shooting-day lifecycle state.
        default: PLANNED
        constraints: "one of {PLANNED, CALLED, IN_PROGRESS, WRAPPED, CANCELLED}"
      - name: estimated_page_eighths
        type: integer
        source: computed
        description: Sum of page_eighths over all Scenes scheduled on this day.
        default: 0

  - name: Scene
    parent: Production
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; the production this scene belongs to."
      - name: shooting_day_id
        type: string
        source: input
        description: "FK -> ShootingDay.id; the day this strip is scheduled on (nullable until scheduled)."
        constraints: nullable
      - name: scene_number
        type: string
        source: input
        description: Script scene number (e.g. "14A").
        constraints: non-empty
      - name: page_eighths
        type: integer
        source: input
        description: Script length of the scene in eighths of a page.
        constraints: ">= 1"
      - name: int_ext
        type: enum
        source: input
        description: Interior or exterior strip.
        constraints: "one of {INT, EXT}"
      - name: day_night
        type: enum
        source: input
        description: Day or night strip.
        constraints: "one of {DAY, NIGHT}"

  - name: CrewMember
    parent: Production
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; the production that hired this person."
      - name: full_name
        type: string
        source: input
        description: Crew/cast member name.
        constraints: non-empty
      - name: role_title
        type: string
        source: input
        description: Job title (e.g. "Lead Actor", "Gaffer").
        constraints: non-empty
      - name: is_sag_aftra
        type: boolean
        source: input
        description: True when this person is covered by the SAG-AFTRA agreement.
        default: false
      - name: daily_rate_cents
        type: integer
        source: input
        description: Contracted base day rate in cents.
        constraints: ">= 0"
      - name: union_code
        type: enum
        source: input
        description: Union local that governs fringe for this person.
        default: NONE
        constraints: "one of {SAG_AFTRA, IATSE, DGA, NONE}"

  - name: Assignment
    parent: ShootingDay
    common_fields: true
    fields:
      - name: shooting_day_id
        type: string
        source: input
        description: "FK -> ShootingDay.id; the day this person is booked on."
      - name: crew_member_id
        type: string
        source: input
        description: "FK -> CrewMember.id; the booked person."
      - name: call_time
        type: string
        source: input
        description: Scheduled call time (ISO 8601 UTC).
        constraints: ISO datetime
      - name: wrap_time
        type: string
        source: computed
        description: Actual wrap time (ISO 8601 UTC), stamped at check-out. Null until wrapped.
        default: null
      - name: meal_breaks_taken
        type: integer
        source: input
        description: Number of compliant meal breaks given before wrap (provided at check-out).
        default: 0
        constraints: ">= 0"
      - name: hours_worked
        type: number
        source: computed
        description: "(wrap_time - call_time) in hours, stamped at check-out."
        default: 0
      - name: attendance_status
        type: enum
        source: system
        description: Attendance state dimension (independent of payment).
        default: SCHEDULED
        constraints: "one of {SCHEDULED, CHECKED_IN, WRAPPED, NO_SHOW}"
      - name: payment_status
        type: enum
        source: system
        description: Payment state dimension (independent of attendance).
        default: UNPAID
        constraints: "one of {UNPAID, APPROVED, PAID, VOID}"
      - name: estimated_cost_cents
        type: integer
        source: computed
        description: >
          Forward-looking labor estimate computed at creation from the crew
          member's daily_rate_cents plus projected fringe; see calc
          estimated_assignment_cost.
        default: 0
      - name: meal_penalty_cents
        type: integer
        source: computed
        description: SAG-AFTRA meal-penalty accrual stamped at check-out.
        default: 0
      - name: turnaround_penalty_cents
        type: integer
        source: computed
        description: Forced-call / turnaround-violation penalty stamped at check-out.
        default: 0
      - name: fringe_cents
        type: integer
        source: computed
        description: Union fringe accrued on this assignment, stamped at check-out.
        default: 0
      - name: paid_cost_cents
        type: integer
        source: computed
        description: >
          Final actual cost locked when payment_status becomes APPROVED; see
          calc actual_assignment_cost. Zero until approved.
        default: 0
      - name: prior_assignment_id
        type: string
        source: computed
        description: >
          "FK -> Assignment.id; the same crew member's immediately preceding
          WRAPPED assignment (by wrap_time) used for turnaround measurement.
          Null when none." Resolved at check-out.
        default: null

  - name: CallSheet
    parent: ShootingDay
    common_fields: true
    fields:
      - name: shooting_day_id
        type: string
        source: input
        description: "FK -> ShootingDay.id; the day this call sheet covers."
      - name: status
        type: enum
        source: system
        description: Call-sheet lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, REVISED, FINALIZED, CANCELLED}"
      - name: revision_number
        type: integer
        source: system
        description: Increments by 1 each time a published call sheet is revised.
        default: 0
      - name: general_call_time
        type: string
        source: input
        description: General crew call time printed on the sheet (ISO 8601 UTC).
        constraints: ISO datetime
      - name: published_at
        type: string
        source: system
        description: Timestamp of the most recent publish/re-publish. Null while DRAFT.
        default: null

  - name: Location
    parent: Production
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; the production using this location."
      - name: name
        type: string
        source: input
        description: Location name.
        constraints: non-empty
      - name: address
        type: string
        source: input
        description: Physical address.
        constraints: non-empty

  - name: LocationPermit
    parent: Location
    common_fields: true
    fields:
      - name: location_id
        type: string
        source: input
        description: "FK -> Location.id; the location this permit covers."
      - name: permit_number
        type: string
        source: input
        description: Municipal permit identifier.
        constraints: non-empty
      - name: window_start
        type: string
        source: input
        description: Inclusive start of the permitted occupation window (ISO 8601 UTC).
        constraints: ISO datetime
      - name: window_end
        type: string
        source: input
        description: Exclusive end of the permitted occupation window (ISO 8601 UTC).
        constraints: "ISO datetime, > window_start"
      - name: status
        type: enum
        source: system
        description: Permit lifecycle state.
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, ACTIVE, EXPIRED, DENIED, REVOKED}"

  - name: ResidualEvent
    parent: Production
    common_fields: false
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; the production earning the residual."
      - name: market
        type: enum
        source: input
        description: Distribution market that generated the residual.
        constraints: "one of {THEATRICAL, SVOD, BASIC_CABLE, NETWORK, HOME_VIDEO}"
      - name: gross_receipts_cents
        type: integer
        source: input
        description: Reported gross receipts for this market event.
        constraints: ">= 0"
      - name: event_date
        type: string
        source: input
        description: Date the receipts were reported (YYYY-MM-DD).
        constraints: ISO date
      - name: residual_amount_cents
        type: integer
        source: computed
        description: Residual liability computed for this event; see calc residual_accrual.
        default: 0

  - name: UnionFringe
    parent: Production
    common_fields: true
    fields:
      - name: production_id
        type: string
        source: input
        description: "FK -> Production.id; the production this fringe config applies to."
      - name: union_code
        type: enum
        source: input
        description: Union local this fringe rate applies to.
        constraints: "one of {SAG_AFTRA, IATSE, DGA}; unique per production"
      - name: fringe_rate_bps
        type: integer
        source: input
        description: Fringe rate in basis points applied to straight-time wages.
        constraints: "0..10000"
      - name: pension_health_flat_cents
        type: integer
        source: input
        description: Flat pension/health contribution added per worked day.
        default: 0
        constraints: ">= 0"

  - name: Dailies
    parent: ShootingDay
    common_fields: true
    fields:
      - name: shooting_day_id
        type: string
        source: input
        description: "FK -> ShootingDay.id; the day this footage was shot."
      - name: reel_label
        type: string
        source: input
        description: Reel/clip identifier.
        constraints: non-empty
      - name: status
        type: enum
        source: system
        description: Dailies review lifecycle state.
        default: PENDING
        constraints: "one of {PENDING, IN_REVIEW, APPROVED, FLAGGED, ARCHIVED}"
      - name: flagged_reason
        type: string
        source: input
        description: Reason recorded when footage is flagged for reshoot review.
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Production
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PRE_PRODUCTION
        trigger: "POST /productions/{id}/advance"
        actor: LineProducer
        preconditions:
          - "Production.status == DRAFT"
          - "at least one BudgetLine exists for the production"
        side_effects:
          - "increments Production.version by 1"
      - from: PRE_PRODUCTION
        to: ACTIVE
        trigger: "POST /productions/{id}/advance"
        actor: LineProducer
        preconditions:
          - "Production.status == PRE_PRODUCTION"
          - "at least one ShootingDay exists for the production"
        side_effects:
          - "increments Production.version by 1"
      - from: ACTIVE
        to: WRAPPED
        trigger: "POST /productions/{id}/advance"
        actor: LineProducer
        preconditions:
          - "Production.status == ACTIVE"
          - "no ShootingDay of this production is in status PLANNED, CALLED, or IN_PROGRESS"
        side_effects:
          - "increments Production.version by 1"
      - from: WRAPPED
        to: CLOSED
        trigger: "POST /productions/{id}/close"
        actor: LineProducer
        preconditions:
          - "Production.status == WRAPPED"
          - "no Assignment of this production has payment_status IN {UNPAID, APPROVED}"
        side_effects:
          - "increments Production.version by 1"

  - entity: ShootingDay
    initial_state: PLANNED
    terminal_states: [WRAPPED, CANCELLED]
    transitions:
      - from: PLANNED
        to: CALLED
        trigger: "POST /call-sheets/{id}/publish (first publish of the day's call sheet)"
        actor: FirstAD
        preconditions:
          - "ShootingDay.status == PLANNED"
          - "the day has at least one Assignment"
          - "the parent Production.status == ACTIVE"
        side_effects:
          - "CallSheet.status DRAFT -> PUBLISHED"
      - from: CALLED
        to: IN_PROGRESS
        trigger: "POST /shooting-days/{id}/start"
        actor: FirstAD
        preconditions:
          - "ShootingDay.status == CALLED"
        side_effects:
          - "increments ShootingDay.version by 1"
      - from: IN_PROGRESS
        to: WRAPPED
        trigger: "POST /shooting-days/{id}/wrap"
        actor: FirstAD
        preconditions:
          - "ShootingDay.status == IN_PROGRESS"
          - "no Assignment on this day has attendance_status IN {SCHEDULED, CHECKED_IN} (else ERR_OPEN_ASSIGNMENTS_BLOCK_WRAP)"
        side_effects:
          - "increments ShootingDay.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /shooting-days/{id}/cancel"
        actor: FirstAD
        preconditions:
          - "ShootingDay.status == PLANNED"
        side_effects:
          - "every Assignment on this day with attendance_status == SCHEDULED transitions to NO_SHOW and payment_status to VOID"
          - "every Scene scheduled on this day has shooting_day_id reset to null (unscheduled)"
          - "increments ShootingDay.version by 1"
      - from: CALLED
        to: CANCELLED
        trigger: "POST /shooting-days/{id}/cancel"
        actor: FirstAD
        preconditions:
          - "ShootingDay.status == CALLED"
        side_effects:
          - "the day's CallSheet transitions PUBLISHED -> CANCELLED"
          - "every Assignment on this day with attendance_status == SCHEDULED transitions to NO_SHOW and payment_status to VOID"
          - "every Scene scheduled on this day has shooting_day_id reset to null (unscheduled)"
          - "increments ShootingDay.version by 1"

  - entity: Assignment
    initial_state: "attendance_status=SCHEDULED, payment_status=UNPAID"
    terminal_states: ["attendance_status=NO_SHOW", "payment_status=PAID", "payment_status=VOID"]
    note: >
      Assignment carries two independent state dimensions. attendance_status
      evolves SCHEDULED -> CHECKED_IN -> WRAPPED (or SCHEDULED -> NO_SHOW).
      payment_status evolves UNPAID -> APPROVED -> PAID (or -> VOID). The two
      axes are mutated by different actors and different endpoints.
    transitions:
      - from: "attendance_status=SCHEDULED"
        to: "attendance_status=CHECKED_IN"
        trigger: "POST /assignments/{id}/check-in"
        actor: FirstAD
        preconditions:
          - "Assignment.attendance_status == SCHEDULED"
          - "parent ShootingDay.status == IN_PROGRESS"
        side_effects:
          - "increments Assignment.version by 1"
      - from: "attendance_status=CHECKED_IN"
        to: "attendance_status=WRAPPED"
        trigger: "POST /assignments/{id}/check-out"
        actor: FirstAD
        preconditions:
          - "Assignment.attendance_status == CHECKED_IN"
          - "wrap_time provided and wrap_time > call_time"
        side_effects:
          - "stamps Assignment.wrap_time and hours_worked"
          - "resolves prior_assignment_id = same crew member's most recent WRAPPED assignment by wrap_time DESC, created_at DESC tie-break, else null"
          - "computes meal_penalty_cents (calc meal_penalty)"
          - "computes turnaround_penalty_cents (calc turnaround_penalty)"
          - "computes fringe_cents (calc union_fringe_accrual)"
          - "increments Assignment.version by 1"
      - from: "attendance_status=SCHEDULED"
        to: "attendance_status=NO_SHOW"
        trigger: "POST /assignments/{id}/no-show OR cascade from ShootingDay cancel"
        actor: FirstAD
        preconditions:
          - "Assignment.attendance_status == SCHEDULED"
        side_effects:
          - "payment_status SCHEDULED-path forced to VOID"
          - "increments Assignment.version by 1"
      - from: "payment_status=UNPAID"
        to: "payment_status=APPROVED"
        trigger: "POST /assignments/{id}/approve-pay"
        actor: PayrollCoordinator
        preconditions:
          - "Assignment.payment_status == UNPAID"
          - "Assignment.attendance_status == WRAPPED"
        side_effects:
          - "locks paid_cost_cents (calc actual_assignment_cost)"
          - "Production.committed_cost_cents recomputed"
          - "increments Assignment.version by 1"
      - from: "payment_status=APPROVED"
        to: "payment_status=PAID"
        trigger: "POST /assignments/{id}/mark-paid"
        actor: PayrollCoordinator
        preconditions:
          - "Assignment.payment_status == APPROVED"
        side_effects:
          - "Production.actual_cost_cents increased by paid_cost_cents"
          - "BudgetLine(category=BELOW_THE_LINE_LABOR).actual_cents increased by (paid_cost_cents - fringe_cents); variance recomputed"
          - "BudgetLine(category=FRINGES).actual_cents increased by fringe_cents; variance recomputed"
          - "increments Assignment.version by 1"

  - entity: CallSheet
    initial_state: DRAFT
    terminal_states: [FINALIZED, CANCELLED]
    note: >
      Cyclic revision loop: a PUBLISHED sheet can be REVISED and then re-PUBLISHED
      any number of times (PUBLISHED -> REVISED -> PUBLISHED) until FINALIZED.
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /call-sheets/{id}/publish"
        actor: FirstAD
        preconditions:
          - "CallSheet.status == DRAFT"
          - "parent ShootingDay.status == PLANNED"
          - "the grandparent Production.status == ACTIVE (else ERR_PRODUCTION_NOT_ACTIVE)"
          - "the parent ShootingDay has at least one Assignment"
        side_effects:
          - "stamps published_at"
          - "parent ShootingDay transitions PLANNED -> CALLED"
          - "increments CallSheet.version by 1"
      - from: PUBLISHED
        to: REVISED
        trigger: "POST /call-sheets/{id}/revise"
        actor: FirstAD
        preconditions:
          - "CallSheet.status == PUBLISHED"
          - "parent ShootingDay.status IN {CALLED, IN_PROGRESS}"
        side_effects:
          - "increments revision_number by 1"
          - "increments CallSheet.version by 1"
      - from: REVISED
        to: PUBLISHED
        trigger: "POST /call-sheets/{id}/publish"
        actor: FirstAD
        preconditions:
          - "CallSheet.status == REVISED"
        side_effects:
          - "stamps published_at (re-publish)"
          - "increments CallSheet.version by 1"
      - from: PUBLISHED
        to: FINALIZED
        trigger: "POST /call-sheets/{id}/finalize"
        actor: FirstAD
        preconditions:
          - "CallSheet.status == PUBLISHED"
          - "parent ShootingDay.status == WRAPPED"
        side_effects:
          - "increments CallSheet.version by 1"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "system cascade from ShootingDay cancel (CALLED -> CANCELLED)"
        actor: system
        preconditions:
          - "CallSheet.status == PUBLISHED"
          - "parent ShootingDay transitioned to CANCELLED"
        side_effects:
          - "increments CallSheet.version by 1"

  - entity: LocationPermit
    initial_state: REQUESTED
    terminal_states: [EXPIRED, DENIED, REVOKED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /location-permits/{id}/approve"
        actor: LineProducer
        preconditions:
          - "LocationPermit.status == REQUESTED"
          - "no other APPROVED or ACTIVE permit on the same Location overlaps [window_start, window_end)"
        side_effects:
          - "increments LocationPermit.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /location-permits/{id}/deny"
        actor: LineProducer
        preconditions:
          - "LocationPermit.status == REQUESTED"
        side_effects:
          - "increments LocationPermit.version by 1"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /location-permits/{id}/activate"
        actor: LineProducer
        preconditions:
          - "LocationPermit.status == APPROVED"
        side_effects:
          - "increments LocationPermit.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /location-permits/{id}/expire"
        actor: LineProducer
        preconditions:
          - "LocationPermit.status == ACTIVE"
        side_effects:
          - "increments LocationPermit.version by 1"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /location-permits/{id}/revoke"
        actor: LineProducer
        preconditions:
          - "LocationPermit.status == APPROVED"
        side_effects:
          - "increments LocationPermit.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /location-permits/{id}/revoke"
        actor: LineProducer
        preconditions:
          - "LocationPermit.status == ACTIVE"
        side_effects:
          - "increments LocationPermit.version by 1"

  - entity: Dailies
    initial_state: PENDING
    terminal_states: [ARCHIVED]
    note: >
      Cyclic review loop: footage can be FLAGGED and sent back IN_REVIEW any
      number of times (IN_REVIEW -> FLAGGED -> IN_REVIEW) before APPROVED.
    transitions:
      - from: PENDING
        to: IN_REVIEW
        trigger: "POST /dailies/{id}/start-review"
        actor: PostSupervisor
        preconditions:
          - "Dailies.status == PENDING"
          - "parent ShootingDay.status IN {WRAPPED, IN_PROGRESS}"
        side_effects:
          - "increments Dailies.version by 1"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /dailies/{id}/approve"
        actor: PostSupervisor
        preconditions:
          - "Dailies.status == IN_REVIEW"
        side_effects:
          - "increments Dailies.version by 1"
      - from: IN_REVIEW
        to: FLAGGED
        trigger: "POST /dailies/{id}/flag"
        actor: PostSupervisor
        preconditions:
          - "Dailies.status == IN_REVIEW"
          - "flagged_reason provided (else ERR_DAILIES_FLAG_REASON_REQUIRED)"
        side_effects:
          - "increments Dailies.version by 1"
      - from: FLAGGED
        to: IN_REVIEW
        trigger: "POST /dailies/{id}/start-review"
        actor: PostSupervisor
        preconditions:
          - "Dailies.status == FLAGGED"
        side_effects:
          - "increments Dailies.version by 1"
      - from: APPROVED
        to: ARCHIVED
        trigger: "POST /dailies/{id}/archive"
        actor: PostSupervisor
        preconditions:
          - "Dailies.status == APPROVED"
        side_effects:
          - "increments Dailies.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-shooting-day
    parent_entity: ShootingDay
    write_endpoint: "POST /assignments"
    occ_field: "expected_shooting_day_version"
    description: |
      Creating an Assignment against a ShootingDay whose version has advanced
      since the client last observed it is rejected. A prior writer may have
      cancelled or wrapped the day (advancing its version and changing which
      bookings are legal); the current writer's view of the day is therefore
      stale and the booking is refused on the stale-version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: budget-line-actuals-stale-production
    parent_entity: Production
    write_endpoint: "POST /budget-lines/{id}/post-actual"
    occ_field: "expected_production_version"
    description: |
      Posting a manual actual to a BudgetLine carries the production version the
      client last observed. When another writer has already mutated the
      production (e.g. a mark-paid cascade bumped committed/actual cost and the
      production version), the posting is rejected as stale rather than layered
      on top of an unobserved cost change.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: estimated_assignment_cost
    trigger: "POST /assignments (assignment creation)"
    algorithm: forward_looking
    formula: |
      base = crew.daily_rate_cents
      # projected fringe at booking time uses the production's configured fringe
      # rate for the crew member's union_code, else 0 when no UnionFringe row exists
      if crew.union_code in {SAG_AFTRA, IATSE, DGA} and a UnionFringe row exists:
          proj_fringe = round_half_up(base * fringe.fringe_rate_bps / 10000)
                        + fringe.pension_health_flat_cents
      else:
          proj_fringe = 0
      estimated_cost_cents = base + proj_fringe
    input_set: "the single crew member booked; no penalties are projected at booking"
    constants: {}
    precision: "integer cents, round_half_up on the rate multiplication"
    variants:
      - name: estimate_at_booking
        when: "assignment creation, attendance_status SCHEDULED"
        difference: "uses contracted daily_rate_cents and projected fringe only; excludes meal/turnaround penalties and actual hours"

  - name: actual_assignment_cost
    trigger: "POST /assignments/{id}/approve-pay (payment_status UNPAID -> APPROVED)"
    algorithm: aggregation
    formula: |
      straight_time = crew.daily_rate_cents
      # overtime: hours beyond 12.0 paid at 1.5x the hourly equiv of the day rate
      hourly = crew.daily_rate_cents / 12.0
      ot_hours = max(0, hours_worked - 12.0)
      overtime = round_half_up(hourly * 1.5 * ot_hours)
      paid_cost_cents = straight_time
                        + overtime
                        + meal_penalty_cents
                        + turnaround_penalty_cents
                        + fringe_cents
    input_set: "this assignment's stamped hours_worked, meal_penalty_cents, turnaround_penalty_cents, fringe_cents"
    constants:
      STANDARD_DAY_HOURS: 12.0
      OVERTIME_MULTIPLIER: 1.5
    precision: "integer cents, round_half_up; overtime computed as one rounded term (rate*mult then round), NOT per-hour rounding"
    variants:
      - name: actual_at_approval
        when: "approve-pay, attendance_status WRAPPED"
        difference: "uses actual hours_worked and all stamped penalties; diverges from estimate_at_booking whenever hours > 12 or any penalty fired"

  - name: meal_penalty
    trigger: "POST /assignments/{id}/check-out"
    algorithm: threshold
    formula: |
      # SAG-AFTRA: a meal must be called within 6.0 worked hours of the prior
      # meal/call; each required-but-missing meal break accrues stacking penalties.
      required_meals = floor(hours_worked / MEAL_INTERVAL_HOURS)
      missed = max(0, required_meals - meal_breaks_taken)
      # stacking schedule: 1st violation FIRST_CENTS, every additional NEXT_CENTS
      if missed <= 0:
          meal_penalty_cents = 0
      else:
          meal_penalty_cents = FIRST_CENTS + (missed - 1) * NEXT_CENTS
    input_set: "this assignment's hours_worked and meal_breaks_taken at check-out"
    constants:
      MEAL_INTERVAL_HOURS: 6.0
      FIRST_CENTS: 2500
      NEXT_CENTS: 3500
    precision: "integer cents; floor on required_meals; boundary is hours_worked >= 6.0 triggers first required meal"
    variants:
      - name: sag_meal_penalty
        when: "crew.is_sag_aftra == true"
        difference: "non-SAG crew accrue meal_penalty_cents = 0 regardless of missed meals"

  - name: turnaround_penalty
    trigger: "POST /assignments/{id}/check-out"
    algorithm: threshold
    formula: |
      # SAG-AFTRA turnaround: >= 10.0 rest hours required between a prior WRAPPED
      # assignment's wrap_time and this assignment's call_time.
      if prior_assignment_id is null or crew.is_sag_aftra == false:
          turnaround_penalty_cents = 0
      else:
          rest_hours = (this.call_time - prior.wrap_time) in hours
          if rest_hours >= MIN_TURNAROUND_HOURS:
              turnaround_penalty_cents = 0
          else:
              # forced call: one full day rate per breach (flat)
              turnaround_penalty_cents = crew.daily_rate_cents
    input_set: "this assignment.call_time and the prior WRAPPED assignment.wrap_time for the same crew member"
    constants:
      MIN_TURNAROUND_HOURS: 10.0
    precision: "integer cents; boundary is rest_hours >= 10.0 is compliant, < 10.0 breaches"
    variants:
      - name: sag_turnaround
        when: "crew.is_sag_aftra == true and a prior WRAPPED assignment exists"
        difference: "non-SAG or first-of-run assignments never accrue a turnaround penalty"

  - name: union_fringe_accrual
    trigger: "POST /assignments/{id}/check-out"
    algorithm: aggregation
    formula: |
      if crew.union_code in {SAG_AFTRA, IATSE, DGA} and a UnionFringe row exists for that union:
          straight = crew.daily_rate_cents
          fringe_cents = round_half_up(straight * fringe.fringe_rate_bps / 10000)
                         + fringe.pension_health_flat_cents
      else:
          fringe_cents = 0
    input_set: "the matching UnionFringe row for crew.union_code under the production"
    constants: {}
    precision: "integer cents, round_half_up on the percentage term, then add the flat term (round-then-add, not add-then-round)"

  - name: residual_accrual
    trigger: "POST /residual-events (new ResidualEvent)"
    algorithm: chronological
    formula: |
      # Residuals are accrued tier-by-tier on the production's CUMULATIVE gross
      # across all prior ResidualEvents of the same production, processed in
      # event_date ASC, created_at ASC order. Each event's residual is the
      # marginal residual produced by moving the cumulative total from its
      # pre-event value to its post-event value across the tier schedule.
      prior_cumulative = sum(gross_receipts_cents of earlier events, same production)
      new_cumulative   = prior_cumulative + this.gross_receipts_cents
      residual_amount_cents = tier_residual(new_cumulative) - tier_residual(prior_cumulative)
      # tier_residual(x): marginal-rate schedule
      #   tier 1: first 1,000,000_00 cents at 1.20%  (120 bps)
      #   tier 2: next  4,000,000_00 cents at 1.80%  (180 bps)
      #   tier 3: above 5,000,000_00 cents at 2.40%  (240 bps)
      # Production.residual_reserve_cents += residual_amount_cents
    input_set: "all ResidualEvents of this production with event_date <= this event, ordered event_date ASC then created_at ASC"
    constants:
      TIER1_CAP_CENTS: 100000000
      TIER2_CAP_CENTS: 500000000
      TIER1_BPS: 120
      TIER2_BPS: 180
      TIER3_BPS: 240
    precision: "integer cents; tier_residual is computed once over the cumulative total then differenced (sum-then-rate per tier), NOT per-event rounding"
    variants:
      - name: marginal_chronological
        when: "every new ResidualEvent"
        difference: "uses cumulative-then-marginal accrual; differs from a naive per-event flat-rate which ignores tier position"

  - name: production_budget_variance
    trigger: "GET /productions/{id}/budget-summary; recomputed on any BudgetLine actual change"
    algorithm: aggregation
    formula: |
      for each BudgetLine of the production:
          variance_cents = estimated_cents - actual_cents
      total_estimated = sum(BudgetLine.estimated_cents)
      total_actual    = sum(BudgetLine.actual_cents)
      total_variance  = total_estimated - total_actual
      over_budget     = total_actual > total_estimated   # strict >
    input_set: "all BudgetLines of the production"
    constants: {}
    precision: "integer cents; over_budget uses strict > (equal actual to estimated is NOT over budget)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role is permitted to perform this operation per the RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every resource referenced in the path or FK body field exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: validation
    check: "required body fields are present and well-typed; enum values are members of the declared set"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 5
    category: state
    check: "the target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version equals the current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /assignments, POST /budget-lines/{id}/post-actual"

  - priority: 7
    category: business_referential
    check: "an Assignment's crew_member_id and shooting_day_id belong to the same Production"
    error_id: ERR_CROSS_PRODUCTION_REFERENCE
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 8
    category: business_constraint
    check: "no other non-CANCELLED ShootingDay of the production shares the same day_number"
    error_id: ERR_DUPLICATE_DAY_NUMBER
    http_status: 409
    applies_to: "POST /shooting-days"

  - priority: 9
    category: business_constraint
    check: "a crew member already has an Assignment on the same ShootingDay (one booking per person per day)"
    error_id: ERR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 10
    category: business_temporal
    check: "a permit's [window_start, window_end) overlaps an existing APPROVED/ACTIVE permit on the same Location (half-open interval overlap)"
    error_id: ERR_PERMIT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /location-permits/{id}/approve"

  - priority: 11
    category: business_temporal
    check: "two Assignments of the same crew member have overlapping [call_time, wrap_time] occupations once wrapped (closed-interval, touching endpoints conflict)"
    error_id: ERR_CREW_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /assignments/{id}/check-out"

  - priority: 12
    category: business_temporal
    check: "wrap_time must be strictly after call_time at check-out"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "POST /assignments/{id}/check-out"

  - priority: 13
    category: business_constraint
    check: "permit window_end must be strictly after window_start at creation"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "POST /location-permits"

  - priority: 14
    category: business_constraint
    check: "UnionFringe union_code must be unique per production"
    error_id: ERR_DUPLICATE_FRINGE
    http_status: 409
    applies_to: "POST /union-fringes"

  - priority: 15
    category: business_fiscal
    check: "approving an Assignment for pay whose locked paid_cost_cents would push the production committed_cost_cents strictly above total_budget_cents is rejected"
    error_id: ERR_BUDGET_WOULD_EXCEED
    http_status: 409
    applies_to: "POST /assignments/{id}/approve-pay"

  - priority: 16
    category: business_constraint
    check: "a Scene can only be scheduled onto a ShootingDay of the same Production and only while that day is PLANNED"
    error_id: ERR_SCENE_SCHEDULE_LOCKED
    http_status: 409
    applies_to: "POST /scenes/{id}/schedule"

  - priority: 17
    category: state
    check: "publishing a DRAFT call sheet (which calls the day) requires the parent Production to be ACTIVE"
    error_id: ERR_PRODUCTION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /call-sheets/{id}/publish"

  - priority: 4
    category: validation
    check: "numeric body fields respect their declared ranges (cents >= 0, page_eighths >= 1, fringe_rate_bps in 0..10000, meal_breaks_taken >= 0)"
    error_id: ERR_VALIDATION_FAILED
    http_status: 422
    applies_to: "all create/post-actual endpoints with numeric inputs"

  - priority: 4
    category: validation
    check: "pagination limit in 1..100 and offset >= 0 on list endpoints"
    error_id: ERR_PAGINATION_INVALID
    http_status: 400
    applies_to: "all GET list endpoints"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Production -----------------------------------------------------------
  - method: POST
    path: "/productions"
    description: Create a production in DRAFT.
    roles: [LineProducer]
    code: 201
    input: [title, production_type, total_budget_cents]
    output: Production
    side_effects: ["Production created with status=DRAFT, version=1, computed costs 0"]

  - method: GET
    path: "/productions/{id}"
    description: Fetch a production with computed cost fields.
    roles: [LineProducer, FirstAD, PayrollCoordinator, PostSupervisor, UnionRep]
    code: 200
    input: []
    output: Production
    side_effects: []

  - method: GET
    path: "/productions"
    description: List productions (paginated).
    roles: [LineProducer, FirstAD, PayrollCoordinator, PostSupervisor, UnionRep]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Production[]
    side_effects: []

  - method: POST
    path: "/productions/{id}/advance"
    description: Advance production lifecycle one step (DRAFT->PRE_PRODUCTION->ACTIVE->WRAPPED).
    roles: [LineProducer]
    code: 200
    input: []
    output: Production
    side_effects: ["status advances per state machine", "increments Production.version by 1"]

  - method: POST
    path: "/productions/{id}/close"
    description: Close a WRAPPED production.
    roles: [LineProducer]
    code: 200
    input: []
    output: Production
    side_effects: ["status WRAPPED -> CLOSED", "increments Production.version by 1"]

  - method: GET
    path: "/productions/{id}/budget-summary"
    description: Computed budget-vs-actual rollup for the production.
    roles: [LineProducer, PayrollCoordinator, UnionRep]
    code: 200
    input: []
    output: "{ total_estimated_cents: integer, total_actual_cents: integer, total_variance_cents: integer, over_budget: boolean, residual_reserve_cents: integer }"
    side_effects: ["runs calc production_budget_variance"]

  # ---- BudgetLine -----------------------------------------------------------
  - method: POST
    path: "/budget-lines"
    description: Create a budget line under a production.
    roles: [LineProducer]
    code: 201
    input: [production_id, category, estimated_cents]
    output: BudgetLine
    side_effects: ["BudgetLine created with actual_cents=0, variance_cents=estimated_cents"]

  - method: GET
    path: "/budget-lines/{id}"
    description: Fetch a budget line.
    roles: [LineProducer, PayrollCoordinator, UnionRep]
    code: 200
    input: []
    output: BudgetLine
    side_effects: []

  - method: GET
    path: "/budget-lines"
    description: List budget lines, filterable by production.
    roles: [LineProducer, PayrollCoordinator, UnionRep]
    code: 200
    input: ["production_id?", "limit?", "offset?"]
    output: BudgetLine[]
    side_effects: []

  - method: POST
    path: "/budget-lines/{id}/post-actual"
    description: Manually post an actual amount to a budget line (OCC-guarded on production).
    roles: [LineProducer]
    code: 200
    input: [amount_cents, expected_production_version]
    output: BudgetLine
    side_effects:
      - "actual_cents increased by amount_cents; variance recomputed"
      - "increments Production.version by 1"

  # ---- ShootingDay ----------------------------------------------------------
  - method: POST
    path: "/shooting-days"
    description: Create a planned shooting day.
    roles: [FirstAD]
    code: 201
    input: ["production_id", "shoot_date", "day_number", "unit?"]
    output: ShootingDay
    side_effects: ["ShootingDay created with status=PLANNED"]

  - method: GET
    path: "/shooting-days/{id}"
    description: Fetch a shooting day with estimated_page_eighths.
    roles: [LineProducer, FirstAD, PayrollCoordinator, PostSupervisor, UnionRep]
    code: 200
    input: []
    output: ShootingDay
    side_effects: []

  - method: GET
    path: "/shooting-days"
    description: List shooting days, filterable by production.
    roles: [LineProducer, FirstAD, PayrollCoordinator, PostSupervisor, UnionRep]
    code: 200
    input: ["production_id?", "status?", "limit?", "offset?"]
    output: ShootingDay[]
    side_effects: []

  - method: POST
    path: "/shooting-days/{id}/start"
    description: Move a CALLED day to IN_PROGRESS.
    roles: [FirstAD]
    code: 200
    input: []
    output: ShootingDay
    side_effects: ["status CALLED -> IN_PROGRESS", "increments ShootingDay.version by 1"]

  - method: POST
    path: "/shooting-days/{id}/wrap"
    description: Wrap an IN_PROGRESS day.
    roles: [FirstAD]
    code: 200
    input: []
    output: ShootingDay
    side_effects: ["status IN_PROGRESS -> WRAPPED", "increments ShootingDay.version by 1"]

  - method: POST
    path: "/shooting-days/{id}/cancel"
    description: Cancel a PLANNED or CALLED day (cascades to assignments, scenes, call sheet).
    roles: [FirstAD]
    code: 200
    input: []
    output: ShootingDay
    side_effects:
      - "status -> CANCELLED"
      - "SCHEDULED assignments -> NO_SHOW / payment VOID"
      - "scheduled scenes unscheduled (shooting_day_id=null)"
      - "PUBLISHED call sheet -> CANCELLED (when day was CALLED)"
      - "increments ShootingDay.version by 1"

  # ---- Scene ----------------------------------------------------------------
  - method: POST
    path: "/scenes"
    description: Create a script scene (initially unscheduled).
    roles: [FirstAD]
    code: 201
    input: [production_id, scene_number, page_eighths, int_ext, day_night]
    output: Scene
    side_effects: ["Scene created with shooting_day_id=null"]

  - method: GET
    path: "/scenes/{id}"
    description: Fetch a scene.
    roles: [LineProducer, FirstAD, PostSupervisor, UnionRep]
    code: 200
    input: []
    output: Scene
    side_effects: []

  - method: GET
    path: "/scenes"
    description: List scenes, filterable by production or shooting day.
    roles: [LineProducer, FirstAD, PostSupervisor, UnionRep]
    code: 200
    input: ["production_id?", "shooting_day_id?", "limit?", "offset?"]
    output: Scene[]
    side_effects: []

  - method: POST
    path: "/scenes/{id}/schedule"
    description: Schedule a scene onto a PLANNED shooting day of the same production.
    roles: [FirstAD]
    code: 200
    input: [shooting_day_id]
    output: Scene
    side_effects: ["Scene.shooting_day_id set", "parent ShootingDay.estimated_page_eighths recomputed"]

  # ---- CrewMember -----------------------------------------------------------
  - method: POST
    path: "/crew-members"
    description: Hire a crew/cast member onto a production.
    roles: [LineProducer]
    code: 201
    input: ["production_id", "full_name", "role_title", "daily_rate_cents", "is_sag_aftra?", "union_code?"]
    output: CrewMember
    side_effects: ["CrewMember created"]

  - method: GET
    path: "/crew-members/{id}"
    description: Fetch a crew member.
    roles: [LineProducer, FirstAD, PayrollCoordinator, UnionRep]
    code: 200
    input: []
    output: CrewMember
    side_effects: []

  - method: GET
    path: "/crew-members"
    description: List crew members, filterable by production.
    roles: [LineProducer, FirstAD, PayrollCoordinator, UnionRep]
    code: 200
    input: ["production_id?", "limit?", "offset?"]
    output: CrewMember[]
    side_effects: []

  # ---- Assignment -----------------------------------------------------------
  - method: POST
    path: "/assignments"
    description: Book a crew member onto a shooting day (OCC-guarded on the day).
    roles: [FirstAD]
    code: 201
    input: [shooting_day_id, crew_member_id, call_time, expected_shooting_day_version]
    output: Assignment
    side_effects:
      - "Assignment created with attendance=SCHEDULED, payment=UNPAID"
      - "runs calc estimated_assignment_cost"
      - "Production.committed_cost_cents recomputed"
      - "increments ShootingDay.version by 1"

  - method: GET
    path: "/assignments/{id}"
    description: Fetch an assignment with all computed cost fields.
    roles: [LineProducer, FirstAD, PayrollCoordinator, UnionRep]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: GET
    path: "/assignments"
    description: List assignments, filterable by shooting day or crew member.
    roles: [LineProducer, FirstAD, PayrollCoordinator, UnionRep]
    code: 200
    input: ["shooting_day_id?", "crew_member_id?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []

  - method: POST
    path: "/assignments/{id}/check-in"
    description: Check a scheduled crew member in on an IN_PROGRESS day.
    roles: [FirstAD]
    code: 200
    input: []
    output: Assignment
    side_effects: ["attendance SCHEDULED -> CHECKED_IN", "increments Assignment.version by 1"]

  - method: POST
    path: "/assignments/{id}/check-out"
    description: Wrap an assignment; stamps hours and computes penalties + fringe.
    roles: [FirstAD]
    code: 200
    input: ["wrap_time", "meal_breaks_taken?"]
    output: Assignment
    side_effects:
      - "stamps wrap_time, hours_worked, prior_assignment_id"
      - "runs calc meal_penalty, turnaround_penalty, union_fringe_accrual"
      - "attendance CHECKED_IN -> WRAPPED"
      - "increments Assignment.version by 1"

  - method: POST
    path: "/assignments/{id}/no-show"
    description: Mark a scheduled assignment a no-show.
    roles: [FirstAD]
    code: 200
    input: []
    output: Assignment
    side_effects: ["attendance SCHEDULED -> NO_SHOW", "payment -> VOID", "increments Assignment.version by 1"]

  - method: POST
    path: "/assignments/{id}/approve-pay"
    description: Approve a wrapped assignment for payment; locks paid_cost_cents.
    roles: [PayrollCoordinator]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "runs calc actual_assignment_cost; locks paid_cost_cents"
      - "payment UNPAID -> APPROVED"
      - "Production.committed_cost_cents recomputed"
      - "increments Assignment.version by 1"

  - method: POST
    path: "/assignments/{id}/mark-paid"
    description: Mark an approved assignment paid; flows actuals to budget lines.
    roles: [PayrollCoordinator]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "payment APPROVED -> PAID"
      - "Production.actual_cost_cents += paid_cost_cents"
      - "BudgetLine BELOW_THE_LINE_LABOR.actual_cents += (paid_cost_cents - fringe_cents)"
      - "BudgetLine FRINGES.actual_cents += fringe_cents"
      - "increments Assignment.version by 1"

  # ---- CallSheet ------------------------------------------------------------
  - method: POST
    path: "/call-sheets"
    description: Create a DRAFT call sheet for a shooting day.
    roles: [FirstAD]
    code: 201
    input: [shooting_day_id, general_call_time]
    output: CallSheet
    side_effects: ["CallSheet created with status=DRAFT, revision_number=0"]

  - method: GET
    path: "/call-sheets/{id}"
    description: Fetch a call sheet.
    roles: [LineProducer, FirstAD, PayrollCoordinator, PostSupervisor, UnionRep]
    code: 200
    input: []
    output: CallSheet
    side_effects: []

  - method: GET
    path: "/call-sheets"
    description: List call sheets, filterable by shooting day.
    roles: [LineProducer, FirstAD, PayrollCoordinator, PostSupervisor, UnionRep]
    code: 200
    input: ["shooting_day_id?", "status?", "limit?", "offset?"]
    output: CallSheet[]
    side_effects: []

  - method: POST
    path: "/call-sheets/{id}/publish"
    description: Publish a DRAFT or re-publish a REVISED call sheet; first publish calls the day.
    roles: [FirstAD]
    code: 200
    input: []
    output: CallSheet
    side_effects:
      - "status DRAFT->PUBLISHED or REVISED->PUBLISHED; stamps published_at"
      - "on first publish, parent ShootingDay PLANNED -> CALLED"
      - "increments CallSheet.version by 1"

  - method: POST
    path: "/call-sheets/{id}/revise"
    description: Revise a PUBLISHED call sheet (bumps revision_number).
    roles: [FirstAD]
    code: 200
    input: ["general_call_time?"]
    output: CallSheet
    side_effects: ["status PUBLISHED -> REVISED", "increments revision_number by 1", "increments CallSheet.version by 1"]

  - method: POST
    path: "/call-sheets/{id}/finalize"
    description: Finalize a PUBLISHED call sheet after the day is WRAPPED.
    roles: [FirstAD]
    code: 200
    input: []
    output: CallSheet
    side_effects: ["status PUBLISHED -> FINALIZED", "increments CallSheet.version by 1"]

  # ---- Location & LocationPermit -------------------------------------------
  - method: POST
    path: "/locations"
    description: Create a location under a production.
    roles: [LineProducer]
    code: 201
    input: [production_id, name, address]
    output: Location
    side_effects: ["Location created"]

  - method: GET
    path: "/locations/{id}"
    description: Fetch a location.
    roles: [LineProducer, FirstAD, UnionRep]
    code: 200
    input: []
    output: Location
    side_effects: []

  - method: GET
    path: "/locations"
    description: List locations, filterable by production.
    roles: [LineProducer, FirstAD, UnionRep]
    code: 200
    input: ["production_id?", "limit?", "offset?"]
    output: Location[]
    side_effects: []

  - method: POST
    path: "/location-permits"
    description: Request a permit for a location with an occupation window.
    roles: [LineProducer]
    code: 201
    input: [location_id, permit_number, window_start, window_end]
    output: LocationPermit
    side_effects: ["LocationPermit created with status=REQUESTED"]

  - method: GET
    path: "/location-permits/{id}"
    description: Fetch a permit.
    roles: [LineProducer, FirstAD, UnionRep]
    code: 200
    input: []
    output: LocationPermit
    side_effects: []

  - method: GET
    path: "/location-permits"
    description: List permits, filterable by location.
    roles: [LineProducer, FirstAD, UnionRep]
    code: 200
    input: ["location_id?", "status?", "limit?", "offset?"]
    output: LocationPermit[]
    side_effects: []

  - method: POST
    path: "/location-permits/{id}/approve"
    description: Approve a requested permit (rejects window overlaps on the location).
    roles: [LineProducer]
    code: 200
    input: []
    output: LocationPermit
    side_effects: ["status REQUESTED -> APPROVED", "increments LocationPermit.version by 1"]

  - method: POST
    path: "/location-permits/{id}/deny"
    description: Deny a requested permit.
    roles: [LineProducer]
    code: 200
    input: []
    output: LocationPermit
    side_effects: ["status REQUESTED -> DENIED", "increments LocationPermit.version by 1"]

  - method: POST
    path: "/location-permits/{id}/activate"
    description: Activate an approved permit.
    roles: [LineProducer]
    code: 200
    input: []
    output: LocationPermit
    side_effects: ["status APPROVED -> ACTIVE", "increments LocationPermit.version by 1"]

  - method: POST
    path: "/location-permits/{id}/expire"
    description: Expire an active permit.
    roles: [LineProducer]
    code: 200
    input: []
    output: LocationPermit
    side_effects: ["status ACTIVE -> EXPIRED", "increments LocationPermit.version by 1"]

  - method: POST
    path: "/location-permits/{id}/revoke"
    description: Revoke an approved or active permit.
    roles: [LineProducer]
    code: 200
    input: []
    output: LocationPermit
    side_effects: ["status -> REVOKED", "increments LocationPermit.version by 1"]

  # ---- ResidualEvent --------------------------------------------------------
  - method: POST
    path: "/residual-events"
    description: Record a residual-generating market event; accrues tiered residual.
    roles: [PayrollCoordinator]
    code: 201
    input: [production_id, market, gross_receipts_cents, event_date]
    output: ResidualEvent
    side_effects:
      - "runs calc residual_accrual; stamps residual_amount_cents"
      - "Production.residual_reserve_cents += residual_amount_cents"

  - method: GET
    path: "/residual-events/{id}"
    description: Fetch a residual event.
    roles: [PayrollCoordinator, LineProducer, UnionRep]
    code: 200
    input: []
    output: ResidualEvent
    side_effects: []

  - method: GET
    path: "/residual-events"
    description: List residual events, filterable by production.
    roles: [PayrollCoordinator, LineProducer, UnionRep]
    code: 200
    input: ["production_id?", "limit?", "offset?"]
    output: ResidualEvent[]
    side_effects: []

  # ---- UnionFringe ----------------------------------------------------------
  - method: POST
    path: "/union-fringes"
    description: Configure a union fringe rate for a production (unique per union).
    roles: [LineProducer]
    code: 201
    input: ["production_id", "union_code", "fringe_rate_bps", "pension_health_flat_cents?"]
    output: UnionFringe
    side_effects: ["UnionFringe created"]

  - method: GET
    path: "/union-fringes/{id}"
    description: Fetch a union fringe config.
    roles: [LineProducer, PayrollCoordinator, UnionRep]
    code: 200
    input: []
    output: UnionFringe
    side_effects: []

  - method: GET
    path: "/union-fringes"
    description: List union fringe configs, filterable by production.
    roles: [LineProducer, PayrollCoordinator, UnionRep]
    code: 200
    input: ["production_id?", "limit?", "offset?"]
    output: UnionFringe[]
    side_effects: []

  # ---- Dailies --------------------------------------------------------------
  - method: POST
    path: "/dailies"
    description: Register dailies footage for a shooting day.
    roles: [PostSupervisor]
    code: 201
    input: [shooting_day_id, reel_label]
    output: Dailies
    side_effects: ["Dailies created with status=PENDING"]

  - method: GET
    path: "/dailies/{id}"
    description: Fetch a dailies record.
    roles: [LineProducer, FirstAD, PostSupervisor, UnionRep]
    code: 200
    input: []
    output: Dailies
    side_effects: []

  - method: GET
    path: "/dailies"
    description: List dailies, filterable by shooting day.
    roles: [LineProducer, FirstAD, PostSupervisor, UnionRep]
    code: 200
    input: ["shooting_day_id?", "status?", "limit?", "offset?"]
    output: Dailies[]
    side_effects: []

  - method: POST
    path: "/dailies/{id}/start-review"
    description: Begin (or resume) review of dailies footage.
    roles: [PostSupervisor]
    code: 200
    input: []
    output: Dailies
    side_effects: ["status PENDING|FLAGGED -> IN_REVIEW", "increments Dailies.version by 1"]

  - method: POST
    path: "/dailies/{id}/approve"
    description: Approve reviewed dailies.
    roles: [PostSupervisor]
    code: 200
    input: []
    output: Dailies
    side_effects: ["status IN_REVIEW -> APPROVED", "increments Dailies.version by 1"]

  - method: POST
    path: "/dailies/{id}/flag"
    description: Flag reviewed dailies for reshoot consideration.
    roles: [PostSupervisor]
    code: 200
    input: [flagged_reason]
    output: Dailies
    side_effects: ["status IN_REVIEW -> FLAGGED", "increments Dailies.version by 1"]

  - method: POST
    path: "/dailies/{id}/archive"
    description: Archive approved dailies.
    roles: [PostSupervisor]
    code: 200
    input: []
    output: Dailies
    side_effects: ["status APPROVED -> ARCHIVED", "increments Dailies.version by 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or missing X-User-ID header"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "the acting role is not permitted to perform this operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path or FK-referenced resource does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, or invalid enum value"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the resource is not in a state from which this transition is defined"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not equal the current parent version"
  - id: ERR_CROSS_PRODUCTION_REFERENCE
    http: 409
    condition: "an assignment's crew member and shooting day belong to different productions"
  - id: ERR_DUPLICATE_DAY_NUMBER
    http: 409
    condition: "another non-CANCELLED shooting day of the production already uses this day_number"
  - id: ERR_DOUBLE_BOOKED
    http: 409
    condition: "the crew member already has an assignment on this shooting day"
  - id: ERR_PERMIT_WINDOW_CONFLICT
    http: 409
    condition: "the permit window overlaps an existing APPROVED/ACTIVE permit on the same location"
  - id: ERR_CREW_TIME_CONFLICT
    http: 409
    condition: "the crew member's wrapped time occupation collides with another wrapped assignment (closed interval)"
  - id: ERR_INVALID_TIME_RANGE
    http: 422
    condition: "end is not strictly after start (wrap_time<=call_time or window_end<=window_start)"
  - id: ERR_DUPLICATE_FRINGE
    http: 409
    condition: "a UnionFringe already exists for this production and union_code"
  - id: ERR_BUDGET_WOULD_EXCEED
    http: 409
    condition: "approving this assignment for pay would push committed cost strictly above the production budget"
  - id: ERR_SCENE_SCHEDULE_LOCKED
    http: 409
    condition: "the target shooting day is not PLANNED, or belongs to a different production"
  - id: ERR_VALIDATION_FAILED
    http: 422
    condition: "a numeric field is out of its declared range (e.g. negative cents, page_eighths < 1, fringe_rate_bps out of 0..10000)"
  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit/offset outside the allowed bounds (limit 1..100, offset >= 0)"
  - id: ERR_DAILIES_FLAG_REASON_REQUIRED
    http: 422
    condition: "flagging dailies without a flagged_reason"
  - id: ERR_PRODUCTION_NOT_ACTIVE
    http: 409
    condition: "a scheduling/publish operation requires the parent production to be ACTIVE but it is not"
  - id: ERR_OPEN_ASSIGNMENTS_BLOCK_WRAP
    http: 409
    condition: "wrapping a shooting day while it still has SCHEDULED or CHECKED_IN assignments"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LineProducer
    description: "Owns the production shell, budget, crew hiring, locations, permits, and union fringe config."
    identity: opaque
    exclusive_operations:
      - "POST /productions"
      - "POST /productions/{id}/advance"
      - "POST /productions/{id}/close"
      - "POST /budget-lines"
      - "POST /budget-lines/{id}/post-actual"
      - "POST /crew-members"
      - "POST /locations"
      - "POST /location-permits"
      - "POST /location-permits/{id}/approve"
      - "POST /location-permits/{id}/deny"
      - "POST /location-permits/{id}/activate"
      - "POST /location-permits/{id}/expire"
      - "POST /location-permits/{id}/revoke"
      - "POST /union-fringes"
    shared_operations:
      - "GET (read) endpoints across productions, budget, crew, locations, permits, fringes, residuals, budget-summary"

  - name: FirstAD
    description: "First Assistant Director: owns the shooting schedule, scenes, assignments, and call sheets."
    identity: opaque
    exclusive_operations:
      - "POST /shooting-days"
      - "POST /shooting-days/{id}/start"
      - "POST /shooting-days/{id}/wrap"
      - "POST /shooting-days/{id}/cancel"
      - "POST /scenes"
      - "POST /scenes/{id}/schedule"
      - "POST /assignments"
      - "POST /assignments/{id}/check-in"
      - "POST /assignments/{id}/check-out"
      - "POST /assignments/{id}/no-show"
      - "POST /call-sheets"
      - "POST /call-sheets/{id}/publish"
      - "POST /call-sheets/{id}/revise"
      - "POST /call-sheets/{id}/finalize"
    shared_operations:
      - "GET (read) endpoints across schedule, scenes, assignments, call sheets, crew, locations, permits, dailies"

  - name: PayrollCoordinator
    description: "Owns assignment payment approval/payment and residual recording."
    identity: opaque
    exclusive_operations:
      - "POST /assignments/{id}/approve-pay"
      - "POST /assignments/{id}/mark-paid"
      - "POST /residual-events"
    shared_operations:
      - "GET (read) endpoints across assignments, budget, crew, residuals, fringes, budget-summary"

  - name: PostSupervisor
    description: "Owns the dailies review pipeline."
    identity: opaque
    exclusive_operations:
      - "POST /dailies"
      - "POST /dailies/{id}/start-review"
      - "POST /dailies/{id}/approve"
      - "POST /dailies/{id}/flag"
      - "POST /dailies/{id}/archive"
    shared_operations:
      - "GET (read) endpoints across dailies, scenes, shooting days"

  - name: UnionRep
    description: "Read-only audit role for union compliance (fringe, residuals, penalties)."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET (read) endpoints across all collections and budget-summary"
