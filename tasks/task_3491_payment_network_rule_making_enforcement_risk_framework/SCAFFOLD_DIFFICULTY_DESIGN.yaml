              as: PlatformAdmin
              captures: { ea2: $.data.id }
            - call: "POST /network/enforcement-actions/${ea2}/transition"
              payload: { to_state: "UPHELD" }
              as: PlatformAdmin
            - call: "POST /network/enforcement-actions"
