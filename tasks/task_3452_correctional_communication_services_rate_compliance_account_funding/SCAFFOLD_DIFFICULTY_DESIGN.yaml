            - call: "POST /comm-services/rate-schedules/${s_lb}/activate"
              payload: { expected_contract_version: "${c_lb_v}" }
              as: PlatformAdmin
            - call: "POST /comm-services/facilities/${fac_lb}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /comm-services/inmates"
              payload: { facility_id: "${fac_lb}", booking_number: "B-2002", full_name: "Inmate Lifo" }
              as: FacilityStaff
              captures: { inm_lb: $.data.id }
            - call: "POST /comm-services/accounts"
              payload: { facility_id: "${fac_lb}", inmate_id: "${inm_lb}", funding_model: "PREPAID", owner_name: "Fam Lifo", owner_contact: "fl@x.com" }
              as: FacilityStaff
              captures: { acct_lb: $.data.id }
            - call: "POST /comm-services/recipient-numbers"
              payload: { account_id: "${acct_lb}", e164_number: "+15550003333", label: "Mom", relationship_type: "FAMILY" }
              as: AccountHolder
              as_user_id: "${acct_lb}"
              captures: { recip_lb: $.data.id, code_lb: $.data.verification_code }
            - call: "POST /comm-services/recipient-numbers/${recip_lb}/verify"
              payload: { verification_code: "${code_lb}", consent_to_recording: true }
              as: RecipientParty
              as_user_id: "${recip_lb}"
            - call: "POST /comm-services/accounts/${acct_lb}/deposits"
              payload: { amount_cents: 1000 }
              as: AccountHolder
              as_user_id: "${acct_lb}"
            - call: "POST /comm-services/accounts/${acct_lb}/deposits"
              payload: { amount_cents: 500 }
              as: AccountHolder
              as_user_id: "${acct_lb}"
            - call: "POST /comm-services/calls"
              payload: { account_id: "${acct_lb}", inmate_id: "${inm_lb}", recipient_number_id: "${recip_lb}", call_type: "INTERSTATE" }
              as: FacilityStaff
              captures: { call_lb: $.data.id }
