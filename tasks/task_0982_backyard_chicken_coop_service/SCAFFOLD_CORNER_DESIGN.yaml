            - call: "POST /coopcare/subscription-plans"
              payload: { plan_code: "OCCB", monthly_fee_cents: 4900, included_cleanings_per_period: 4, included_health_checks_per_period: 2, supply_discount_pct: 0.10, sitting_discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_b: $.data.id }
