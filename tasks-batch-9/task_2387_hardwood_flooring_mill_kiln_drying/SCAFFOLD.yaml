scenario: "2387. Hardwood Flooring Mill & Kiln Drying (hardwood flooring manufacturer): log and green lumber procurement with species mix, grade and moisture at receipt, kiln drying schedules by species and thickness with moisture gradient and stress relief, milling to tongue-and-groove profiles with tolerance control and moisture-related dimensional planning, grading to industry rules with character grade separation and yield optimization, prefinishing lines with sanding, staining and ultraviolet-cured coating application, engineered versus solid product lines with core material sourcing, cupping and gapping warranty claims tied to installation moisture conditions, byproduct sales of sawdust, shavings and shorts"

domain_name: hardwood-flooring-mill-kiln-drying
api_prefix: /mill

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: posture_driven_gating
  entity_topology: graph
  state_machine_shape: cyclic + parallel + branching mix
  role_model: peer_roles + segregation_of_duties
  consistency_model: immediate
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation
  difficulty_band: beyond-expert
  notes: >
    Green lumber flows receipt -> kiln charge -> flooring lot -> grade run -> prefinish run, with
    byproduct batches and warranty claims hanging off the same spine. Two independent ledgers are
    conserved (green board feet on KilnCharge, warranty cents on ProductLine), two calculations are
    dual-variant (lot yield provisional/final, warranty liability estimated/adjudicated), and kiln
    chamber occupancy plus prefinish line loading impose two different interval geometries
    (closed interval with cooldown buffer vs half-open interval with aggregate capacity).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: SpeciesProfile
    description: "Wood species reference data driving drying schedules, shrinkage planning and moisture targets."
    common_fields: true
    fields:
      - { name: species_code, type: string, source: input, required: true, description: "Unique mill species code, e.g. RED_OAK." }
      - { name: common_name, type: string, source: input, required: true, description: "Human readable species name." }
      - { name: density_class, type: enum, source: input, required: true, enum: [DENSE, MEDIUM, SOFT], description: "Density class selecting kiln base hours and shrink percentages." }
      - { name: tangential_shrinkage_coefficient, type: decimal, source: input, required: true, description: "Dimensional change per 1 percentage point of moisture change, fraction of width." }
      - { name: target_moisture_pct, type: decimal, source: input, required: true, description: "Target average kiln-dry moisture content in percent." }
      - { name: max_moisture_gradient_pp, type: decimal, source: input, required: true, description: "Maximum allowed shell-to-core moisture gradient in percentage points." }
      - { name: green_to_dry_shrink_pct, type: decimal, source: computed, description: "Board-foot shrink percentage from green to kiln-dry, derived from density_class." }

  - name: DryingSchedule
    description: "Kiln schedule for one species and one thickness, including conditioning and stress relief legs."
    common_fields: true
    fields:
      - { name: species_profile_id, type: uuid, source: input, required: true, description: "FK -> SpeciesProfile.id; species whose density class sets base hours." }
      - { name: schedule_code, type: string, source: input, required: true, description: "Unique schedule code." }
      - { name: thickness_in, type: decimal, source: input, required: true, description: "Nominal green thickness in inches, selecting the thickness tier factor." }
      - { name: initial_moisture_pct, type: decimal, source: input, required: true, description: "Design green moisture content in percent used to size the drying leg." }
      - { name: final_moisture_pct, type: decimal, source: input, required: true, description: "Design kiln-dry moisture content in percent." }
      - { name: conditioning_hours, type: integer, source: input, required: true, description: "Hours of equalisation/conditioning after the drying leg." }
      - { name: stress_relief_hours, type: integer, source: input, required: true, description: "Hours of stress relief (steaming) after conditioning." }
      - { name: planned_dry_hours, type: decimal, source: computed, description: "Total planned schedule duration in hours from kiln_schedule_duration." }

  - name: GreenReceipt
    description: "One inbound delivery of logs or green lumber, graded and moisture-tested at receipt."
    common_fields: true
    fields:
      - { name: species_profile_id, type: uuid, source: input, required: true, description: "FK -> SpeciesProfile.id; species delivered." }
      - { name: supplier_name, type: string, source: input, required: true, description: "Supplier of record." }
      - { name: received_board_feet, type: integer, source: input, required: true, description: "Gross green board feet as delivered." }
      - { name: receipt_grade, type: enum, source: input, required: true, enum: [FAS, SELECT, NO1_COMMON, NO2_COMMON], description: "Grade assigned at the receiving deck." }
      - { name: moisture_pct_at_receipt, type: decimal, source: input, required: true, description: "Measured green moisture content in percent at receipt." }
      - { name: accepted_board_feet, type: integer, source: system, default: 0, description: "Green board feet accepted after scaling; set by the accept transition." }
      - { name: kiln_charge_id, type: uuid, source: system, nullable: true, description: "FK -> KilnCharge.id; charge this receipt is currently allocated to, null when unallocated." }
      - { name: rejection_reason, type: string, source: system, nullable: true, description: "Reason recorded when the receipt is rejected." }
      - { name: status, type: enum, source: system, default: RECEIVED, enum: [RECEIVED, ACCEPTED, ALLOCATED, CONSUMED, REJECTED], description: "Receipt lifecycle state." }

  - name: KilnChamber
    description: "A physical kiln chamber that can hold at most one charge over any instant plus a cooldown buffer."
    common_fields: true
    fields:
      - { name: chamber_code, type: string, source: input, required: true, description: "Unique chamber code." }
      - { name: capacity_board_feet, type: integer, source: input, required: true, description: "Maximum green board feet the chamber can hold." }
      - { name: maintenance_note, type: string, source: system, nullable: true, description: "Note recorded when the chamber enters maintenance." }
      - { name: status, type: enum, source: system, default: AVAILABLE, enum: [AVAILABLE, OCCUPIED, MAINTENANCE], description: "Chamber availability state." }

  - name: KilnCharge
    description: "One kiln load run against a drying schedule, tracking allocated green volume, moisture gradient and dry output."
    common_fields: true
    fields:
      - { name: drying_schedule_id, type: uuid, source: input, required: true, description: "FK -> DryingSchedule.id; schedule governing this charge." }
      - { name: kiln_chamber_id, type: uuid, source: input, required: true, description: "FK -> KilnChamber.id; chamber the charge occupies." }
      - { name: planned_start_utc, type: datetime, source: input, required: true, description: "Planned charge start instant in UTC." }
      - { name: planned_dry_hours, type: decimal, source: computed, description: "Snapshot of the schedule duration in hours at charge creation." }
      - { name: planned_end_utc, type: datetime, source: computed, description: "planned_start_utc advanced by planned_dry_hours." }
      - { name: blocked_until_utc, type: datetime, source: computed, description: "planned_end_utc advanced by the chamber cooldown buffer; end of the occupancy window." }
      - { name: charged_green_bf, type: integer, source: computed, default: 0, description: "Sum of accepted_board_feet over currently allocated receipts." }
      - { name: weighted_initial_moisture_pct, type: decimal, source: computed, nullable: true, description: "Volume-weighted green moisture content across allocated receipts." }
      - { name: shell_moisture_pct, type: decimal, source: system, nullable: true, description: "Shell moisture reading from the stress test." }
      - { name: core_moisture_pct, type: decimal, source: system, nullable: true, description: "Core moisture reading from the stress test." }
      - { name: moisture_gradient_pp, type: decimal, source: computed, nullable: true, description: "Absolute shell-to-core gradient in percentage points." }
      - { name: average_moisture_pct, type: decimal, source: computed, nullable: true, description: "Mean of shell and core moisture readings." }
      - { name: dry_bf_out, type: decimal, source: computed, nullable: true, description: "Kiln-dry board feet produced, set when the charge is released." }
      - { name: remaining_dry_bf, type: decimal, source: computed, nullable: true, description: "dry_bf_out less input_dry_bf of all non-voided flooring lots drawn from this charge." }
      - { name: redry_count, type: integer, source: computed, default: 0, description: "Number of times the charge has been sent back for redry." }
      - { name: displaced_reason, type: string, source: system, nullable: true, description: "Reason recorded when the charge is displaced from its chamber window." }
      - { name: status, type: enum, source: system, default: SCHEDULED, enum: [SCHEDULED, DISPLACED, LOADED, DRYING, CONDITIONING, REDRY, RELEASED, CLOSED], description: "Charge lifecycle state." }

  - name: ProductLine
    description: "A saleable flooring product line, solid or engineered, carrying its own warranty reserve and gating posture."
    common_fields: true
    fields:
      - { name: line_code, type: string, source: input, required: true, description: "Unique product line code." }
      - { name: species_profile_id, type: uuid, source: input, required: true, description: "FK -> SpeciesProfile.id; face species of the line." }
      - { name: construction_type, type: enum, source: input, required: true, enum: [SOLID, ENGINEERED], description: "Solid lines mill straight from kiln-dry lumber; engineered lines also consume core stock." }
      - { name: nominal_width_in, type: decimal, source: input, required: true, description: "Nominal face width in inches before moisture planning." }
      - { name: nominal_thickness_in, type: decimal, source: input, required: true, description: "Nominal finished thickness in inches." }
      - { name: material_value_cents_per_sf, type: integer, source: input, required: true, description: "Replacement material value in cents per square foot, used for warranty liability." }
      - { name: warranty_funded_total_cents, type: integer, source: input, required: true, description: "Cumulative warranty reserve funded for this line, in cents." }
      - { name: warranty_balance_cents, type: integer, source: computed, description: "Unspent warranty reserve in cents." }
      - { name: warranty_committed_cents, type: integer, source: computed, default: 0, description: "Warranty reserve committed to approved claims in cents." }
      - { name: freeze_override, type: boolean, source: system, default: false, description: "Administrative freeze flag forcing posture FROZEN." }
      - { name: posture, type: enum, source: computed, default: OPEN, enum: [OPEN, RESTRICTED, FROZEN], description: "Gating posture derived from the warranty reserve balance and the freeze flag." }

  - name: CoreStock
    description: "Engineered core material inventory reserved by engineered flooring lots."
    common_fields: true
    fields:
      - { name: product_line_id, type: uuid, source: input, required: true, description: "FK -> ProductLine.id; engineered line this core stock serves." }
      - { name: core_material, type: enum, source: input, required: true, enum: [BIRCH_PLY, HDF, EUCALYPTUS_PLY], description: "Core substrate type." }
      - { name: lot_reference, type: string, source: input, required: true, description: "Supplier core lot reference." }
      - { name: available_square_feet, type: decimal, source: input, required: true, description: "Core square feet on hand." }
      - { name: reserved_square_feet, type: decimal, source: computed, default: 0, description: "Core square feet reserved by non-voided engineered lots." }

  - name: FlooringLot
    description: "One milling lot converting kiln-dry lumber into tongue-and-groove flooring for a product line."
    common_fields: true
    fields:
      - { name: product_line_id, type: uuid, source: input, required: true, description: "FK -> ProductLine.id; line being produced." }
      - { name: kiln_charge_id, type: uuid, source: input, required: true, description: "FK -> KilnCharge.id; released charge supplying kiln-dry lumber." }
      - { name: core_stock_id, type: uuid, source: input, nullable: true, description: "FK -> CoreStock.id; required for ENGINEERED lines, must be omitted for SOLID lines." }
      - { name: input_dry_bf, type: decimal, source: input, required: true, description: "Kiln-dry board feet drawn from the charge." }
      - { name: construction_type, type: enum, source: computed, enum: [SOLID, ENGINEERED], description: "Snapshot of the product line construction type." }
      - { name: nominal_width_in, type: decimal, source: computed, description: "Snapshot of the product line nominal face width in inches." }
      - { name: planned_finished_width_in, type: decimal, source: computed, description: "Moisture-planned finished face width in inches." }
      - { name: dimensional_growth_allowance_in, type: decimal, source: computed, description: "Per-board width allowance for in-service moisture change, in inches." }
      - { name: reserved_core_sf, type: decimal, source: computed, nullable: true, description: "Core square feet reserved for this lot, null for SOLID lots." }
      - { name: actual_milled_width_in, type: decimal, source: system, nullable: true, description: "Measured milled face width in inches recorded at milling completion." }
      - { name: net_flooring_bf, type: decimal, source: system, nullable: true, description: "Net board feet of full-length flooring produced." }
      - { name: shorts_bf, type: decimal, source: system, nullable: true, description: "Board feet diverted to shorts." }
      - { name: sawdust_tons, type: decimal, source: system, nullable: true, description: "Sawdust tonnage captured at milling." }
      - { name: shavings_tons, type: decimal, source: system, nullable: true, description: "Shavings tonnage captured at milling." }
      - { name: residue_bf, type: decimal, source: computed, nullable: true, description: "Board-foot equivalent of shorts plus sawdust plus shavings." }
      - { name: waste_bf, type: decimal, source: computed, nullable: true, description: "Unaccounted board feet from the mill mass balance." }
      - { name: provisional_yield_pct, type: decimal, source: computed, nullable: true, description: "Provisional variant of lot yield, from milled volume only." }
      - { name: final_yield_pct, type: decimal, source: computed, nullable: true, description: "Final variant of lot yield, from grade-credited volume." }
      - { name: final_grade_run_id, type: uuid, source: system, nullable: true, description: "FK -> GradeRun.id; finalized grade run used to close out the lot." }
      - { name: quarantine_reason, type: string, source: system, nullable: true, description: "Reason recorded when the lot fails the yield floor." }
      - { name: void_reason, type: string, source: system, nullable: true, description: "Reason recorded when the lot is voided." }
      - { name: status, type: enum, source: system, default: PLANNED, enum: [PLANNED, MILLED, GRADED, QUARANTINED, VOIDED], description: "Lot lifecycle state." }

  - name: GradeRun
    description: "One grading pass over a milled lot under an industry ruleset, tallying bundles by grade class."
    common_fields: true
    fields:
      - { name: flooring_lot_id, type: uuid, source: input, required: true, description: "FK -> FlooringLot.id; lot being graded." }
      - { name: inspector_ruleset, type: enum, source: input, required: true, enum: [NHLA, MILL_CHARACTER], description: "Grading ruleset applied; MILL_CHARACTER permits character grade separation." }
      - { name: tally_board_feet, type: decimal, source: computed, nullable: true, description: "Sum of bundle board feet at finalization." }
      - { name: tally_value_cents, type: integer, source: computed, nullable: true, description: "Sum of per-bundle tally values in cents at finalization." }
      - { name: credited_board_feet, type: decimal, source: computed, nullable: true, description: "Grade-credit weighted board feet at finalization." }
      - { name: superseded_by_run_id, type: uuid, source: system, nullable: true, description: "FK -> GradeRun.id; replacement run that superseded this one." }
      - { name: status, type: enum, source: system, default: DRAFT, enum: [DRAFT, FINALIZED, SUPERSEDED], description: "Grade run lifecycle state." }

  - name: GradeBundle
    description: "An immutable graded bundle line inside a grade run."
    common_fields: false
    fields:
      - { name: id, type: uuid, source: system, description: "Bundle identifier." }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp." }
      - { name: grade_run_id, type: uuid, source: input, required: true, description: "FK -> GradeRun.id; run this bundle belongs to." }
      - { name: grade_class, type: enum, source: input, required: true, enum: [CLEAR, SELECT, NO1_COMMON, NO2_COMMON, CHARACTER, CABIN], description: "Assigned grade class." }
      - { name: bundle_board_feet, type: decimal, source: input, required: true, description: "Board feet in this bundle." }
      - { name: average_length_in, type: decimal, source: input, required: true, description: "Average board length in inches, selecting the length factor." }
      - { name: length_factor, type: decimal, source: computed, description: "Length factor applied to the bundle price." }
      - { name: credit_factor, type: decimal, source: computed, description: "Grade credit factor applied to bundle board feet." }
      - { name: tally_value_cents, type: integer, source: computed, description: "Rounded value of this bundle in cents." }

  - name: PrefinishLine
    description: "A prefinishing line performing sanding, staining and ultraviolet-cured coating passes."
    common_fields: true
    fields:
      - { name: line_code, type: string, source: input, required: true, description: "Unique prefinish line code." }
      - { name: daily_capacity_linear_feet, type: integer, source: input, required: true, description: "Maximum linear feet the line can process across any overlapping window set." }
      - { name: coating_passes, type: integer, source: input, required: true, description: "Number of ultraviolet-cured coating passes the line applies." }

  - name: PrefinishRun
    description: "A scheduled prefinishing run for one flooring lot on one prefinish line."
    common_fields: true
    fields:
      - { name: prefinish_line_id, type: uuid, source: input, required: true, description: "FK -> PrefinishLine.id; line executing the run." }
      - { name: flooring_lot_id, type: uuid, source: input, required: true, description: "FK -> FlooringLot.id; graded lot being prefinished." }
      - { name: product_line_id, type: uuid, source: computed, description: "FK -> ProductLine.id; snapshot of the lot's product line, used for posture gating." }
      - { name: window_start_utc, type: datetime, source: input, required: true, description: "Half-open window start instant in UTC." }
      - { name: window_end_utc, type: datetime, source: input, required: true, description: "Half-open window end instant in UTC." }
      - { name: scheduled_linear_feet, type: integer, source: input, required: true, description: "Linear feet scheduled through the line in this window." }
      - { name: sanding_grit_sequence, type: string, source: input, required: true, description: "Ordered sanding grit sequence, e.g. 80-120-150." }
      - { name: stain_code, type: string, source: input, nullable: true, description: "Stain code, null for natural finish." }
      - { name: coating_liters, type: decimal, source: computed, description: "Ultraviolet-cured coating volume in liters for the run." }
      - { name: hold_reason, type: string, source: system, nullable: true, description: "Reason recorded when the run is held by product line posture." }
      - { name: status, type: enum, source: system, default: SCHEDULED, enum: [SCHEDULED, HELD, RUNNING, COMPLETED], description: "Prefinish run lifecycle state." }

  - name: ByproductBatch
    description: "A saleable byproduct batch created from a milled lot."
    common_fields: true
    fields:
      - { name: flooring_lot_id, type: uuid, source: input, required: true, description: "FK -> FlooringLot.id; lot that produced the byproduct." }
      - { name: byproduct_type, type: enum, source: input, required: true, enum: [SAWDUST, SHAVINGS, SHORTS], description: "Byproduct stream." }
      - { name: available_tons, type: decimal, source: computed, description: "Tonnage available for sale from the producing lot." }
      - { name: sold_tons, type: decimal, source: computed, default: 0, description: "Tonnage already committed to sales." }

  - name: ByproductSale
    description: "A byproduct sale drawing tonnage from a byproduct batch, priced with volume discount and haulage."
    common_fields: true
    fields:
      - { name: byproduct_batch_id, type: uuid, source: input, required: true, description: "FK -> ByproductBatch.id; batch being drawn down." }
      - { name: buyer_name, type: string, source: input, required: true, description: "Buyer of record." }
      - { name: quantity_tons, type: decimal, source: input, required: true, description: "Tonnage sold." }
      - { name: unit_price_cents_per_ton, type: integer, source: input, required: true, description: "Unit price in cents per ton." }
      - { name: haul_distance_miles, type: integer, source: input, required: true, description: "Haulage distance in miles, billed to the buyer." }
      - { name: gross_cents, type: integer, source: computed, description: "Undiscounted goods value in cents." }
      - { name: discount_cents, type: integer, source: computed, description: "Volume discount in cents." }
      - { name: haul_cents, type: integer, source: computed, description: "Haulage charge in cents." }
      - { name: net_cents, type: integer, source: computed, description: "Invoiced total in cents." }

  - name: WarrantyClaim
    description: "A cupping or gapping warranty claim adjudicated against installation moisture conditions."
    common_fields: true
    fields:
      - { name: product_line_id, type: uuid, source: input, required: true, description: "FK -> ProductLine.id; line the claim is filed against." }
      - { name: flooring_lot_id, type: uuid, source: input, nullable: true, description: "FK -> FlooringLot.id; installed lot, when traceable." }
      - { name: claim_type, type: enum, source: input, required: true, enum: [CUPPING, GAPPING], description: "Failure mode claimed." }
      - { name: affected_square_feet, type: decimal, source: input, required: true, description: "Claimed affected floor area in square feet." }
      - { name: installation_date, type: date, source: input, required: true, description: "Installation date used for warranty age and depreciation." }
      - { name: subfloor_moisture_pct_at_install, type: decimal, source: input, required: true, description: "Claimed subfloor moisture content in percent at installation." }
      - { name: ambient_rh_pct_at_install, type: decimal, source: input, required: true, description: "Claimed ambient relative humidity in percent at installation." }
      - { name: estimated_liability_cents, type: integer, source: computed, description: "Estimated variant of warranty liability in cents." }
      - { name: adjudicated_affected_sf, type: decimal, source: system, nullable: true, description: "Inspector-verified affected area in square feet." }
      - { name: adjudicated_subfloor_moisture_pct, type: decimal, source: system, nullable: true, description: "Inspector-verified subfloor moisture content in percent." }
      - { name: adjudicated_ambient_rh_pct, type: decimal, source: system, nullable: true, description: "Inspector-verified ambient relative humidity in percent." }
      - { name: installer_share_pct, type: decimal, source: computed, nullable: true, description: "Installer responsibility share in percent from the moisture delta tiers." }
      - { name: mill_share_pct, type: decimal, source: computed, nullable: true, description: "Mill responsibility share in percent, complement of installer_share_pct." }
      - { name: service_months, type: integer, source: computed, nullable: true, description: "Whole months in service between installation and adjudication." }
      - { name: depreciation_pct, type: decimal, source: computed, nullable: true, description: "Age depreciation percentage applied to the gross liability." }
      - { name: adjudicated_liability_cents, type: integer, source: computed, nullable: true, description: "Adjudicated variant of warranty liability in cents, charged to the reserve." }
      - { name: submitted_by_user_id, type: string, source: system, description: "User id that submitted the claim, captured from X-User-ID." }
      - { name: adjudicated_by_user_id, type: string, source: system, nullable: true, description: "User id that adjudicated the claim." }
      - { name: info_request_note, type: string, source: system, nullable: true, description: "Note recorded when additional information is requested." }
      - { name: denial_reason, type: string, source: system, nullable: true, description: "Reason recorded when the claim is denied." }
      - { name: reversal_reason, type: string, source: system, nullable: true, description: "Reason recorded when an approval is reversed." }
      - { name: adjudication_status, type: enum, source: system, default: SUBMITTED, enum: [SUBMITTED, INFO_REQUESTED, APPROVED, DENIED, REVERSED], description: "Adjudication dimension of the claim state." }
      - { name: remediation_status, type: enum, source: system, default: NOT_STARTED, enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, CANCELLED], description: "Remediation dimension of the claim state, independent of adjudication." }

state_machines:
  - entity: GreenReceipt
    state_field: status
    initial_state: RECEIVED
    terminal_states: [REJECTED, CONSUMED]
    shape: branching + cyclic
    transitions:
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /mill/green-receipts/{green_receipt_id}/accept"
        preconditions:
          - "accepted_board_feet <= received_board_feet"
        side_effects:
          - "Set accepted_board_feet from the request."
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /mill/green-receipts/{green_receipt_id}/reject"
        preconditions: []
        side_effects:
          - "Set rejection_reason from the request."
          - "Leave accepted_board_feet at 0."
      - from: ACCEPTED
        to: ALLOCATED
        trigger: "POST /mill/kiln-charges/{kiln_charge_id}/allocate_receipt"
        preconditions:
          - "Target KilnCharge.status == SCHEDULED."
          - "Receipt species_profile_id equals the charge schedule species_profile_id."
          - "charged_green_bf + accepted_board_feet <= chamber capacity_board_feet."
        side_effects:
          - "Set kiln_charge_id to the target charge."
          - "Recompute KilnCharge.charged_green_bf and KilnCharge.weighted_initial_moisture_pct."
      - from: ALLOCATED
        to: ACCEPTED
        trigger: "POST /mill/kiln-charges/{kiln_charge_id}/deallocate_receipt"
        preconditions:
          - "Owning KilnCharge.status in [SCHEDULED, DISPLACED]."
        side_effects:
          - "Clear kiln_charge_id."
          - "Recompute KilnCharge.charged_green_bf and KilnCharge.weighted_initial_moisture_pct."
      - from: ALLOCATED
        to: ACCEPTED
        trigger: "cascade from POST /mill/kiln-charges/{kiln_charge_id}/record_stress_test displacing a downstream charge"
        preconditions:
          - "The owning charge is being displaced from its chamber window."
        side_effects:
          - "Clear kiln_charge_id."
          - "Recompute the displaced KilnCharge.charged_green_bf to 0."
      - from: ALLOCATED
        to: CONSUMED
        trigger: "POST /mill/kiln-charges/{kiln_charge_id}/load"
        preconditions:
          - "Owning KilnCharge.status == SCHEDULED."
        side_effects:
          - "Freeze accepted_board_feet and kiln_charge_id against further allocation changes."

  - entity: KilnChamber
    state_field: status
    initial_state: AVAILABLE
    terminal_states: []
    shape: cyclic
    transitions:
      - from: AVAILABLE
        to: OCCUPIED
        trigger: "POST /mill/kiln-charges/{kiln_charge_id}/load"
        preconditions:
          - "Chamber has no other charge in status LOADED, DRYING, CONDITIONING or REDRY."
        side_effects: []
      - from: OCCUPIED
        to: AVAILABLE
        trigger: "POST /mill/kiln-charges/{kiln_charge_id}/record_stress_test releasing the charge"
        preconditions:
          - "The releasing charge is the chamber's occupying charge."
        side_effects: []
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /mill/kiln-chambers/{kiln_chamber_id}/start_maintenance"
        preconditions: []
        side_effects:
          - "Set maintenance_note from the request."
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /mill/kiln-chambers/{kiln_chamber_id}/complete_maintenance"
        preconditions: []
        side_effects:
          - "Clear maintenance_note."

  - entity: KilnCharge
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    shape: cyclic + branching
    transitions:
      - from: SCHEDULED
        to: LOADED
        trigger: "POST /mill/kiln-charges/{kiln_charge_id}/load"
        preconditions:
          - "KilnChamber.status == AVAILABLE."
          - "charged_green_bf > 0."
          - "weighted_initial_moisture_pct is within MC_PLAN_TOLERANCE_PP of the schedule initial_moisture_pct."
        side_effects:
          - "Set KilnChamber.status to OCCUPIED."
          - "Set every allocated GreenReceipt.status to CONSUMED."
      - from: LOADED
        to: DRYING
        trigger: "POST /mill/kiln-charges/{kiln_charge_id}/start_drying"
        preconditions: []
        side_effects: []
      - from: DRYING
        to: CONDITIONING
        trigger: "POST /mill/kiln-charges/{kiln_charge_id}/begin_conditioning"
        preconditions: []
        side_effects: []
      - from: CONDITIONING
        to: RELEASED
        trigger: "POST /mill/kiln-charges/{kiln_charge_id}/record_stress_test"
        preconditions:
          - "moisture_gradient_pp <= SpeciesProfile.max_moisture_gradient_pp."
          - "average_moisture_pct is within TARGET_MC_BAND_PP of SpeciesProfile.target_moisture_pct."
        side_effects:
          - "Store shell_moisture_pct, core_moisture_pct, moisture_gradient_pp and average_moisture_pct."
          - "Compute dry_bf_out from dry_yield_conversion and set remaining_dry_bf = dry_bf_out."
          - "Set KilnChamber.status to AVAILABLE."
      - from: CONDITIONING
        to: REDRY
        trigger: "POST /mill/kiln-charges/{kiln_charge_id}/record_stress_test"
        preconditions:
          - "moisture_gradient_pp > SpeciesProfile.max_moisture_gradient_pp or average_moisture_pct outside the target band."
          - "redry_count < MAX_REDRY_CYCLES."
        side_effects:
          - "Store shell_moisture_pct, core_moisture_pct, moisture_gradient_pp and average_moisture_pct."
          - "Increment redry_count."
          - "Advance planned_end_utc by REDRY_EXTENSION_HOURS and recompute blocked_until_utc."
          - "Cascade: every SCHEDULED charge on the same chamber whose window now overlaps the extended window moves to DISPLACED."
      - from: REDRY
        to: CONDITIONING
        trigger: "POST /mill/kiln-charges/{kiln_charge_id}/resume_conditioning"
        preconditions: []
        side_effects:
          - "Clear shell_moisture_pct, core_moisture_pct, moisture_gradient_pp and average_moisture_pct."
      - from: SCHEDULED
        to: DISPLACED
        trigger: "cascade from POST /mill/kiln-charges/{kiln_charge_id}/record_stress_test on the occupying charge"
        preconditions:
          - "The extended occupancy window of the redrying charge overlaps this charge's window."
        side_effects:
          - "Set displaced_reason."
          - "Every ALLOCATED GreenReceipt on this charge returns to ACCEPTED and charged_green_bf becomes 0."
      - from: DISPLACED
        to: SCHEDULED
        trigger: "POST /mill/kiln-charges/{kiln_charge_id}/reschedule"
        preconditions:
          - "The new window does not overlap any other occupancy window on the chamber."
        side_effects:
          - "Recompute planned_start_utc, planned_end_utc and blocked_until_utc."
          - "Clear displaced_reason."
      - from: RELEASED
        to: CLOSED
        trigger: "auto-transition on POST /mill/flooring-lots when remaining_dry_bf reaches 0"
        preconditions:
          - "remaining_dry_bf == 0 after the lot draw."
        side_effects: []

  - entity: FlooringLot
    state_field: status
    initial_state: PLANNED
    terminal_states: [GRADED, QUARANTINED, VOIDED]
    shape: branching
    transitions:
      - from: PLANNED
        to: MILLED
        trigger: "POST /mill/flooring-lots/{flooring_lot_id}/complete_milling"
        preconditions:
          - "net_flooring_bf + shorts_bf + residue tonnage board-foot equivalent <= input_dry_bf."
          - "abs(actual_milled_width_in - planned_finished_width_in) <= PROFILE_TOLERANCE_IN."
        side_effects:
          - "Store actual_milled_width_in, net_flooring_bf, shorts_bf, sawdust_tons, shavings_tons."
          - "Compute residue_bf, waste_bf and provisional_yield_pct."
          - "Create one ByproductBatch per stream: SAWDUST, SHAVINGS and SHORTS."
      - from: MILLED
        to: GRADED
        trigger: "POST /mill/flooring-lots/{flooring_lot_id}/finalize"
        preconditions:
          - "Referenced GradeRun.status == FINALIZED and belongs to this lot."
          - "final_yield_pct >= YIELD_FLOOR_PCT."
        side_effects:
          - "Set final_grade_run_id and final_yield_pct."
      - from: MILLED
        to: QUARANTINED
        trigger: "POST /mill/flooring-lots/{flooring_lot_id}/finalize"
        preconditions:
          - "Referenced GradeRun.status == FINALIZED and belongs to this lot."
          - "final_yield_pct < YIELD_FLOOR_PCT."
        side_effects:
          - "Set final_grade_run_id and final_yield_pct."
          - "Set quarantine_reason."
      - from: PLANNED
        to: VOIDED
        trigger: "POST /mill/flooring-lots/{flooring_lot_id}/void"
        preconditions: []
        side_effects:
          - "Release reserved_core_sf back to CoreStock.reserved_square_feet when construction_type == ENGINEERED."
          - "Restore input_dry_bf to KilnCharge.remaining_dry_bf and return a CLOSED charge to RELEASED."
          - "Set void_reason."
      - from: MILLED
        to: VOIDED
        trigger: "POST /mill/flooring-lots/{flooring_lot_id}/void"
        preconditions:
          - "No ByproductSale exists against any ByproductBatch of this lot."
        side_effects:
          - "Release reserved_core_sf back to CoreStock.reserved_square_feet when construction_type == ENGINEERED."
          - "Restore input_dry_bf to KilnCharge.remaining_dry_bf and return a CLOSED charge to RELEASED."
          - "Set every ByproductBatch.available_tons of this lot to 0."
          - "Set void_reason."

  - entity: GradeRun
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    shape: linear
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /mill/grade-runs/{grade_run_id}/finalize"
        preconditions:
          - "At least one GradeBundle exists on the run."
          - "Sum of bundle_board_feet <= FlooringLot.net_flooring_bf."
          - "No CHARACTER or CABIN bundle exists when inspector_ruleset == NHLA."
        side_effects:
          - "Compute tally_board_feet, credited_board_feet and tally_value_cents."
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "POST /mill/grade-runs/{grade_run_id}/supersede"
        preconditions:
          - "Replacement GradeRun exists, belongs to the same lot and is in status FINALIZED."
          - "The lot is not already in status GRADED or QUARANTINED against this run."
        side_effects:
          - "Set superseded_by_run_id to the replacement run."

  - entity: PrefinishRun
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    shape: cyclic
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "cascade from POST /mill/warranty-claims/{warranty_claim_id}/adjudicate when the product line posture becomes RESTRICTED or FROZEN"
        preconditions:
          - "The run's product_line_id matches the posture-changed line."
        side_effects:
          - "Set hold_reason."
      - from: HELD
        to: SCHEDULED
        trigger: "POST /mill/prefinish-runs/{prefinish_run_id}/release_hold"
        preconditions:
          - "ProductLine.posture == OPEN."
        side_effects:
          - "Clear hold_reason."
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /mill/prefinish-runs/{prefinish_run_id}/start"
        preconditions:
          - "ProductLine.posture == OPEN."
          - "FlooringLot.status == GRADED."
        side_effects: []
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /mill/prefinish-runs/{prefinish_run_id}/complete"
        preconditions: []
        side_effects: []

  - entity: WarrantyClaim
    state_field: adjudication_status
    parallel_state_field: remediation_status
    initial_state: SUBMITTED
    terminal_states: [DENIED, REVERSED]
    shape: parallel + cyclic
    transitions:
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /mill/warranty-claims/{warranty_claim_id}/request_info"
        preconditions: []
        side_effects:
          - "Set info_request_note."
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /mill/warranty-claims/{warranty_claim_id}/resubmit"
        preconditions: []
        side_effects:
          - "Overwrite affected_square_feet, subfloor_moisture_pct_at_install and ambient_rh_pct_at_install."
          - "Recompute estimated_liability_cents."
          - "Clear info_request_note."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /mill/warranty-claims/{warranty_claim_id}/adjudicate with decision APPROVED"
        preconditions:
          - "The adjudicating X-User-ID differs from submitted_by_user_id."
          - "ProductLine.warranty_balance_cents >= adjudicated_liability_cents."
        side_effects:
          - "Store adjudicated readings and compute installer_share_pct, mill_share_pct, service_months, depreciation_pct and adjudicated_liability_cents."
          - "Debit ProductLine.warranty_balance_cents and credit ProductLine.warranty_committed_cents by adjudicated_liability_cents."
          - "Recompute ProductLine.posture; when it becomes RESTRICTED or FROZEN every SCHEDULED PrefinishRun on that line moves to HELD."
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /mill/warranty-claims/{warranty_claim_id}/adjudicate with decision DENIED"
        preconditions:
          - "The adjudicating X-User-ID differs from submitted_by_user_id."
        side_effects:
          - "Set denial_reason and adjudicated_by_user_id."
          - "Leave the warranty reserve untouched."
      - from: APPROVED
        to: REVERSED
        trigger: "POST /mill/warranty-claims/{warranty_claim_id}/reverse"
        preconditions:
          - "remediation_status != COMPLETED."
        side_effects:
          - "Credit ProductLine.warranty_balance_cents and debit ProductLine.warranty_committed_cents by adjudicated_liability_cents."
          - "Recompute ProductLine.posture; when it returns to OPEN held runs stay HELD until released explicitly."
          - "Move remediation_status to CANCELLED when it is NOT_STARTED or IN_PROGRESS."
          - "Set reversal_reason."
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "POST /mill/warranty-claims/{warranty_claim_id}/start_remediation"
        preconditions:
          - "adjudication_status == APPROVED."
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /mill/warranty-claims/{warranty_claim_id}/complete_remediation"
        preconditions:
          - "adjudication_status == APPROVED."
        side_effects: []

  - entity: ProductLine
    state_field: posture
    initial_state: OPEN
    terminal_states: []
    shape: derived
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "derived recomputation after any warranty reserve movement"
        preconditions:
          - "0 < warranty_balance_cents < WARRANTY_RESTRICT_FLOOR_CENTS and freeze_override == false."
        side_effects:
          - "Every SCHEDULED PrefinishRun on the line moves to HELD."
      - from: RESTRICTED
        to: OPEN
        trigger: "derived recomputation after POST /mill/product-lines/{product_line_id}/fund_warranty or a claim reversal"
        preconditions:
          - "warranty_balance_cents >= WARRANTY_RESTRICT_FLOOR_CENTS and freeze_override == false."
        side_effects: []
      - from: OPEN
        to: FROZEN
        trigger: "POST /mill/product-lines/{product_line_id}/freeze"
        preconditions: []
        side_effects:
          - "Set freeze_override to true."
          - "Every SCHEDULED PrefinishRun on the line moves to HELD."
      - from: RESTRICTED
        to: FROZEN
        trigger: "POST /mill/product-lines/{product_line_id}/freeze"
        preconditions: []
        side_effects:
          - "Set freeze_override to true."
      - from: FROZEN
        to: OPEN
        trigger: "POST /mill/product-lines/{product_line_id}/unfreeze"
        preconditions:
          - "warranty_balance_cents >= WARRANTY_RESTRICT_FLOOR_CENTS."
        side_effects:
          - "Set freeze_override to false."
      - from: FROZEN
        to: RESTRICTED
        trigger: "POST /mill/product-lines/{product_line_id}/unfreeze"
        preconditions:
          - "warranty_balance_cents < WARRANTY_RESTRICT_FLOOR_CENTS."
        side_effects:
          - "Set freeze_override to false."

concurrency_rules:
  - rule_id: drying-schedule-supersede-stale-species-profile
    parent_entity: SpeciesProfile
    child_entity: DryingSchedule
    occ_field: version
    write_endpoint: "POST /mill/drying-schedules"
    required_input: expected_species_profile_version
    error_id: ERR_STALE_SPECIES_PROFILE_VERSION
    status: 412
    description: >
      A drying schedule is only meaningful against the species profile revision it was designed for.
      The create call must carry expected_species_profile_version; when it does not match the stored
      SpeciesProfile.version the write is refused with ERR_STALE_SPECIES_PROFILE_VERSION. A successful
      create bumps SpeciesProfile.version, so a caller holding a pre-write version is refused on the
      next attempt until it re-reads the profile.

  - rule_id: grade-run-create-stale-lot
    parent_entity: FlooringLot
    child_entity: GradeRun
    occ_field: version
    write_endpoint: "POST /mill/grade-runs"
    required_input: expected_lot_version
    error_id: ERR_STALE_LOT_VERSION
    status: 412
    description: >
      Grading must be pinned to the milled measurements it was based on. The create call must carry
      expected_lot_version; a mismatch against the stored FlooringLot.version is refused with
      ERR_STALE_LOT_VERSION. A successful create bumps FlooringLot.version, so a caller that read the
      lot before an intervening write is refused until it re-reads.

calculations:
  - name: kiln_schedule_duration
    description: "Total planned kiln schedule duration in hours for a species and thickness, including conditioning and stress relief legs."
    algorithm_type: threshold
    trigger: "POST /mill/drying-schedules (stored on DryingSchedule.planned_dry_hours) and snapshotted onto KilnCharge.planned_dry_hours at charge creation."
    formula: |
      base = SPECIES_BASE_HOURS[species.density_class]
      per_point = MC_HOURS_PER_POINT[species.density_class]
      tier = THICKNESS_TIER_FACTOR selected by thickness_in
      drying_leg = (base + per_point * (initial_moisture_pct - final_moisture_pct)) * tier
      raw = drying_leg + conditioning_hours + stress_relief_hours
      planned_dry_hours = clamp(ROUND_HALF_UP(raw, 1), MIN_SCHEDULE_HOURS, MAX_SCHEDULE_HOURS)
    constants:
      SPECIES_BASE_HOURS: { DENSE: 96, MEDIUM: 72, SOFT: 54 }
      MC_HOURS_PER_POINT: { DENSE: 3.5, MEDIUM: 2.5, SOFT: 1.8 }
      THICKNESS_TIER_FACTOR: "thickness_in <= 1.00 -> 1.00; <= 1.25 -> 1.45; <= 1.50 -> 1.95; otherwise 2.60"
      MIN_SCHEDULE_HOURS: 48
      MAX_SCHEDULE_HOURS: 360
    rounding: "ROUND_HALF_UP to 1 decimal place, clamped after rounding."
    worked_example: "DENSE, thickness 1.00, initial 45.0, final 7.0, conditioning 24, stress relief 12 -> (96 + 3.5*38)*1.00 + 36 = 265.0 hours."

  - name: charge_occupancy_window
    description: "Chamber occupancy window of a kiln charge, including the post-release cooldown buffer."
    algorithm_type: interval_merge
    trigger: "POST /mill/kiln-charges, POST /mill/kiln-charges/{kiln_charge_id}/reschedule and the REDRY extension."
    formula: |
      planned_end_utc = planned_start_utc + planned_dry_hours hours
      blocked_until_utc = planned_end_utc + COOLDOWN_BUFFER_HOURS hours
      On REDRY: planned_end_utc = planned_end_utc + REDRY_EXTENSION_HOURS hours, then blocked_until_utc recomputed.
      Occupancy interval is CLOSED on both ends: [planned_start_utc, blocked_until_utc].
    constants:
      COOLDOWN_BUFFER_HOURS: 6
      REDRY_EXTENSION_HOURS: 48
    rounding: "Whole minutes; instants serialized as ISO8601 with milliseconds in UTC."
    worked_example: "Start 2026-08-05T00:00:00.000Z with 265.0 hours -> end 2026-08-16T01:00:00.000Z, blocked_until 2026-08-16T07:00:00.000Z."

  - name: chamber_window_conflict_detection
    description: "Detects whether a candidate charge window collides with an existing occupancy window on the same chamber."
    algorithm_type: interval_merge
    trigger: "POST /mill/kiln-charges and POST /mill/kiln-charges/{kiln_charge_id}/reschedule."
    formula: |
      input_set = KilnCharge rows on the same kiln_chamber_id with status in
                  [SCHEDULED, LOADED, DRYING, CONDITIONING, REDRY, RELEASED]
      conflict iff candidate.planned_start_utc <= other.blocked_until_utc
             and candidate.blocked_until_utc >= other.planned_start_utc
      Touching endpoints therefore CONFLICT (closed interval semantics).
    constants: {}
    rounding: "n/a"
    worked_example: "Existing window ends blocked_until 2026-08-16T07:00:00.000Z: a candidate starting exactly 2026-08-16T07:00:00.000Z conflicts; a candidate starting 2026-08-16T08:00:00.000Z does not."

  - name: weighted_initial_moisture
    description: "Volume-weighted green moisture content across the receipts currently allocated to a charge."
    algorithm_type: weighted_scoring
    trigger: "allocate_receipt and deallocate_receipt on a kiln charge."
    formula: |
      input_set = GreenReceipt rows with kiln_charge_id == charge.id and status == ALLOCATED
      charged_green_bf = sum(accepted_board_feet)
      weighted_initial_moisture_pct = ROUND_HALF_UP(
          sum(accepted_board_feet * moisture_pct_at_receipt) / charged_green_bf, 1)
      When the input set is empty, charged_green_bf is 0 and weighted_initial_moisture_pct is null.
    constants: {}
    rounding: "ROUND_HALF_UP to 1 decimal place, applied once on the aggregate ratio."
    worked_example: "5800 bf at 46.0 plus 3900 bf at 44.0 -> 438400 / 9700 = 45.195 -> 45.2."

  - name: moisture_plan_deviation_check
    description: "Guards charge loading against a green moisture content the schedule was not designed for."
    algorithm_type: threshold
    trigger: "POST /mill/kiln-charges/{kiln_charge_id}/load."
    formula: |
      deviation = abs(weighted_initial_moisture_pct - schedule.initial_moisture_pct)
      pass iff deviation <= MC_PLAN_TOLERANCE_PP
    constants:
      MC_PLAN_TOLERANCE_PP: 3.0
    rounding: "Compared at 1 decimal place."
    worked_example: "Schedule design 45.0 with weighted 45.2 -> deviation 0.2 passes; weighted 38.6 -> deviation 6.4 fails."

  - name: moisture_gradient_assessment
    description: "Evaluates the stress test to decide between release and redry."
    algorithm_type: threshold
    trigger: "POST /mill/kiln-charges/{kiln_charge_id}/record_stress_test."
    formula: |
      moisture_gradient_pp = ROUND_HALF_UP(abs(core_moisture_pct - shell_moisture_pct), 1)
      average_moisture_pct = ROUND_HALF_UP((core_moisture_pct + shell_moisture_pct) / 2, 1)
      released iff moisture_gradient_pp <= species.max_moisture_gradient_pp
             and abs(average_moisture_pct - species.target_moisture_pct) <= TARGET_MC_BAND_PP
      otherwise the charge goes to REDRY.
    constants:
      TARGET_MC_BAND_PP: 1.0
    rounding: "ROUND_HALF_UP to 1 decimal place before comparison."
    worked_example: "Shell 6.4 core 8.2 -> gradient 1.8, average 7.3, target 7.0, max gradient 2.0 -> RELEASED. Shell 6.0 core 8.0 -> gradient exactly 2.0 -> still RELEASED. Shell 5.9 core 8.0 -> gradient 2.1 -> REDRY."

  - name: dry_yield_conversion
    description: "Converts allocated green board feet into kiln-dry board feet available for milling."
    algorithm_type: aggregation
    trigger: "Charge release (CONDITIONING -> RELEASED)."
    formula: |
      dry_bf_out = ROUND_HALF_UP(charged_green_bf * (1 - GREEN_TO_DRY_SHRINK_PCT[density_class] / 100), 2)
      remaining_dry_bf = dry_bf_out - sum(input_dry_bf of FlooringLot rows on this charge with status != VOIDED)
    constants:
      GREEN_TO_DRY_SHRINK_PCT: { DENSE: 7.5, MEDIUM: 6.0, SOFT: 5.0 }
    rounding: "ROUND_HALF_UP to 2 decimal places."
    worked_example: "9700 green bf, DENSE -> 9700 * 0.925 = 8972.50 dry bf."

  - name: dimensional_shrinkage_plan
    description: "Moisture-aware tongue-and-groove width planning for a flooring lot."
    algorithm_type: threshold
    trigger: "POST /mill/flooring-lots (planning) and complete_milling (tolerance check)."
    formula: |
      lot_mc = KilnCharge.average_moisture_pct (falls back to species.target_moisture_pct when null)
      movement = ROUND_HALF_UP(nominal_width_in * species.tangential_shrinkage_coefficient
                               * abs(lot_mc - INSERVICE_MC_PCT) / 100, 4)
      dimensional_growth_allowance_in = movement
      when lot_mc < INSERVICE_MC_PCT (the boards will take up moisture and widen in service):
          planned_finished_width_in = ROUND_HALF_UP(nominal_width_in - MILL_KERF_ALLOWANCE_IN + movement, 3)
      otherwise (the boards will give up moisture and narrow in service):
          planned_finished_width_in = ROUND_HALF_UP(nominal_width_in - MILL_KERF_ALLOWANCE_IN - movement, 3)
      tolerance check at milling: abs(actual_milled_width_in - planned_finished_width_in) <= PROFILE_TOLERANCE_IN
    constants:
      INSERVICE_MC_PCT: 7.5
      MILL_KERF_ALLOWANCE_IN: 0.0625
      PROFILE_TOLERANCE_IN: 0.006
    rounding: "Movement ROUND_HALF_UP to 4 decimal places, planned width ROUND_HALF_UP to 3 decimal places, in that order."
    worked_example: "Nominal 3.250, coefficient 0.145, lot_mc 7.3 -> movement 0.0009, planned 3.250 - 0.0625 + 0.0009 = 3.1884 -> 3.188; actual 3.190 is inside tolerance (0.002), actual 3.194 is exactly at tolerance (0.006), actual 3.195 exceeds it. With lot_mc 7.0 -> movement 0.0024, planned 3.190."

  - name: core_reservation
    description: "Engineered core square footage reserved by a flooring lot."
    algorithm_type: aggregation
    trigger: "POST /mill/flooring-lots for ENGINEERED lines, released on void."
    formula: |
      reserved_core_sf = ROUND_HALF_UP(input_dry_bf * CORE_SF_PER_BF, 2)
      CoreStock.reserved_square_feet = sum(reserved_core_sf of FlooringLot rows on this stock with status != VOIDED)
      pass iff CoreStock.reserved_square_feet + reserved_core_sf <= CoreStock.available_square_feet
    constants:
      CORE_SF_PER_BF: 1.10
    rounding: "ROUND_HALF_UP to 2 decimal places."
    worked_example: "input_dry_bf 2900 -> 3190.00 core square feet reserved."

  - name: mill_mass_balance
    description: "Reconciles kiln-dry input against flooring, shorts, residue and unaccounted waste."
    algorithm_type: aggregation
    trigger: "POST /mill/flooring-lots/{flooring_lot_id}/complete_milling."
    formula: |
      residue_bf = ROUND_HALF_UP((sawdust_tons + shavings_tons) * BF_PER_TON, 2)
      waste_bf = ROUND_HALF_UP(input_dry_bf - net_flooring_bf - shorts_bf - residue_bf, 2)
      reject with ERR_MILL_MASS_BALANCE_VIOLATION when waste_bf < 0
      reject with ERR_WASTE_LIMIT_EXCEEDED when waste_bf > ROUND_HALF_UP(input_dry_bf * MAX_WASTE_PCT / 100, 2)
    constants:
      BF_PER_TON: 285
      MAX_WASTE_PCT: 12
    rounding: "ROUND_HALF_UP to 2 decimal places on each named quantity, residue before waste."
    worked_example: "input 6000, net 4680, shorts 180, sawdust 1.20 t, shavings 0.80 t -> residue 570.00, waste 570.00, limit 720.00 -> accepted."

  - name: lot_yield_dual_variant
    description: "Lot yield percentage, computed provisionally from milled volume and finally from grade-credited volume."
    algorithm_type: weighted_scoring
    trigger: "complete_milling computes the provisional variant; finalize computes the final variant."
    variants:
      provisional:
        when: "At milling completion, before any grade run is finalized."
        formula: "provisional_yield_pct = ROUND_HALF_UP(net_flooring_bf / input_dry_bf * 100, 2)"
      final:
        when: "At lot finalize against a FINALIZED grade run."
        formula: "final_yield_pct = ROUND_HALF_UP(grade_run.credited_board_feet / input_dry_bf * 100, 2)"
    reconciliation: "The final variant replaces the provisional one for the GRADED / QUARANTINED branch decision; provisional_yield_pct is retained unchanged for the milling record."
    constants:
      YIELD_FLOOR_PCT: 55.00
    rounding: "ROUND_HALF_UP to 2 decimal places, applied once to the percentage."
    worked_example: "input 6000, net 4680 -> provisional 78.00. Credited 3970.2625 -> final 66.17 (>= 55.00, GRADED). A character-heavy run crediting 2200.0000 -> final 36.67 (< 55.00, QUARANTINED)."

  - name: grade_tally_valuation
    description: "Per-bundle grade credit and value, aggregated into the grade run tally."
    algorithm_type: tiered_pricing
    trigger: "POST /mill/grade-runs/{grade_run_id}/bundles computes the bundle fields; finalize aggregates them."
    formula: |
      length_factor = LENGTH_FACTOR selected by average_length_in
      credit_factor = GRADE_CREDIT[grade_class]
      bundle.tally_value_cents = ROUND_HALF_UP(bundle_board_feet
                                 * GRADE_PRICE_CENTS_PER_BF[grade_class] * length_factor, 0)
      run.tally_board_feet   = ROUND_HALF_UP(sum(bundle_board_feet), 2)
      run.credited_board_feet = ROUND_HALF_UP(sum(bundle_board_feet * credit_factor), 4)
      run.tally_value_cents  = sum(bundle.tally_value_cents)   # per-bundle rounding, then exact integer sum
    constants:
      GRADE_CREDIT: { CLEAR: 1.00, SELECT: 0.95, NO1_COMMON: 0.85, NO2_COMMON: 0.70, CHARACTER: 0.60, CABIN: 0.40 }
      GRADE_PRICE_CENTS_PER_BF: { CLEAR: 640, SELECT: 520, NO1_COMMON: 395, NO2_COMMON: 280, CHARACTER: 240, CABIN: 150 }
      LENGTH_FACTOR: "average_length_in < 24 -> 0.83; < 48 -> 1.00; >= 48 -> 1.07"
    rounding: "Each bundle value is rounded to whole cents FIRST, then summed; the run total is never recomputed from unrounded bundle values."
    worked_example: "CLEAR 1187.25 bf at 50 in -> 813029; SELECT 1502.60 at 36 in -> 781352; NO1_COMMON 1098.45 at 30 in -> 433888; CHARACTER 703.10 at 20 in -> 140058; run total 2168327 cents (summing unrounded values and rounding once would give 2168326)."

  - name: prefinish_line_load_check
    description: "Aggregate linear-foot loading check across overlapping prefinish windows on one line."
    algorithm_type: interval_merge
    trigger: "POST /mill/prefinish-runs."
    formula: |
      input_set = PrefinishRun rows on the same prefinish_line_id with status in [SCHEDULED, HELD, RUNNING]
                  whose HALF-OPEN window [window_start_utc, window_end_utc) intersects the candidate window
      overlap iff existing.window_start_utc < candidate.window_end_utc
             and candidate.window_start_utc < existing.window_end_utc
      pass iff sum(scheduled_linear_feet of overlapping rows) + candidate.scheduled_linear_feet
               <= line.daily_capacity_linear_feet
      Back-to-back windows (gap = 0) do NOT overlap.
    constants: {}
    rounding: "Integer linear feet."
    worked_example: "Capacity 9000; existing run 06:00-14:00 at 5000 lf; a candidate 13:00-14:00 at 4000 lf totals exactly 9000 and is accepted, at 4001 lf it is rejected; a candidate 14:00-22:00 at 5000 lf does not overlap and is accepted."

  - name: prefinish_coating_consumption
    description: "Ultraviolet-cured coating volume for a prefinish run."
    algorithm_type: aggregation
    trigger: "POST /mill/prefinish-runs."
    formula: |
      width_in = FlooringLot.actual_milled_width_in
      square_feet = scheduled_linear_feet * width_in / 12
      coating_liters = ROUND_HALF_UP(square_feet * COAT_L_PER_SQFT * line.coating_passes, 2)
    constants:
      COAT_L_PER_SQFT: 0.012
    rounding: "ROUND_HALF_UP to 2 decimal places, applied once at the end (square footage is not pre-rounded)."
    worked_example: "5000 lf at 3.190 in -> 1329.1666... sq ft; * 0.012 * 3 passes = 47.85 liters."

  - name: byproduct_settlement
    description: "Byproduct sale pricing with volume discount tiers and haulage billed to the buyer."
    algorithm_type: tiered_pricing
    trigger: "POST /mill/byproduct-sales."
    formula: |
      gross_cents = ROUND_HALF_UP(quantity_tons * unit_price_cents_per_ton, 0)
      discount_pct = BYPRODUCT_DISCOUNT_TIERS selected by quantity_tons
      discount_cents = ROUND_HALF_UP(gross_cents * discount_pct / 100, 0)
      haul_cents = HAUL_BASE_CENTS + HAUL_CENTS_PER_MI * haul_distance_miles
      net_cents = gross_cents - discount_cents + haul_cents
      batch.sold_tons = sum(quantity_tons of sales on the batch)
      pass iff batch.sold_tons + quantity_tons <= batch.available_tons
      ByproductBatch.available_tons is set once at complete_milling, per stream:
        SAWDUST  -> FlooringLot.sawdust_tons
        SHAVINGS -> FlooringLot.shavings_tons
        SHORTS   -> ROUND_HALF_UP(FlooringLot.shorts_bf / BF_PER_TON, 2)
      and is set to 0 when the producing lot is voided.
    constants:
      BYPRODUCT_DISCOUNT_TIERS: "quantity_tons < 5 -> 0; < 20 -> 3; >= 20 -> 6"
      HAUL_BASE_CENTS: 2500
      HAUL_CENTS_PER_MI: 180
    rounding: "ROUND_HALF_UP to whole cents in the order gross, discount, haul, net."
    worked_example: "5.00 t at 2200 c/t over 20 mi -> gross 11000, discount 330, haul 6100, net 16770. At 4.99 t -> gross 10978, discount 0, haul 6100, net 17078."

  - name: warranty_liability_dual_variant
    description: "Warranty exposure for a cupping or gapping claim, as an estimate at intake and as an adjudicated charge against the reserve."
    algorithm_type: tiered_pricing
    trigger: "POST /mill/warranty-claims and resubmit compute the estimated variant; adjudicate computes the adjudicated variant."
    variants:
      estimated:
        when: "Claim intake and resubmission, using the claimant's own figures."
        formula: |
          step 1 base_cents  = ROUND_HALF_UP(affected_square_feet
                               * (line.material_value_cents_per_sf + REMEDIATION_LABOR_CENTS_PER_SF), 0)
          step 2 admin_pct   = ADMIN_PCT_TIER selected by base_cents
          step 3 admin_cents = ROUND_HALF_UP(base_cents * admin_pct, 0)
          step 4 estimated_liability_cents = base_cents + admin_cents
      adjudicated:
        when: "Adjudication, using the inspector-verified figures, age depreciation and the mill responsibility share."
        formula: |
          step 1 base_cents  = ROUND_HALF_UP(adjudicated_affected_sf
                               * (line.material_value_cents_per_sf + REMEDIATION_LABOR_CENTS_PER_SF), 0)
          step 2 admin_pct   = ADMIN_PCT_TIER selected by base_cents
          step 3 admin_cents = ROUND_HALF_UP(base_cents * admin_pct, 0)
          step 4 gross_cents = base_cents + admin_cents
          step 5 service_months  = whole months from installation_date to the current logical date
                 depreciation_pct = min(DEPRECIATION_PP_PER_MONTH * service_months, MAX_DEPRECIATION_PCT)
                 depreciated_cents = ROUND_HALF_UP(gross_cents * (1 - depreciation_pct / 100), 0)
          step 6 adjudicated_liability_cents = ROUND_HALF_UP(depreciated_cents * mill_share_pct / 100, 0)
    reconciliation: "estimated_liability_cents is informational only; only adjudicated_liability_cents moves the reserve, and a reversal moves exactly that amount back."
    constants:
      REMEDIATION_LABOR_CENTS_PER_SF: 475
      ADMIN_PCT_TIER: "base_cents < 500000 -> 0.08; <= 1500000 -> 0.06; otherwise 0.045"
      DEPRECIATION_PP_PER_MONTH: 0.5
      MAX_DEPRECIATION_PCT: 40
    rounding: "ROUND_HALF_UP to whole cents at every named step, in the pinned step order 1..6; no step may be algebraically collapsed into another."
    worked_example: "Line material 895 c/sf. Claimed 240 sf -> base 328800, admin 26304, estimated 355104. Adjudicated 210 sf -> base 287700, admin 23016, gross 310716; installed 2026-03-15 adjudicated 2026-08-20 -> 5 months, depreciation 2.5 pct, depreciated 302948; mill share 50 pct -> adjudicated 151474."

  - name: responsibility_split
    description: "Splits warranty responsibility between installer and mill from the installation moisture conditions."
    algorithm_type: threshold
    trigger: "POST /mill/warranty-claims/{warranty_claim_id}/adjudicate."
    formula: |
      reference_mc = FlooringLot -> KilnCharge.average_moisture_pct when flooring_lot_id is set,
                     otherwise species.target_moisture_pct
      mc_delta = ROUND_HALF_UP(abs(adjudicated_subfloor_moisture_pct - reference_mc), 1)
      installer_share_pct = INSTALLER_SHARE_TIERS selected by mc_delta
      when adjudicated_ambient_rh_pct is outside [RH_MIN_PCT, RH_MAX_PCT]:
          installer_share_pct = min(installer_share_pct + RH_PENALTY_PP, 100)
      mill_share_pct = 100 - installer_share_pct
    constants:
      INSTALLER_SHARE_TIERS: "mc_delta <= 2.0 -> 0; <= 4.0 -> 40; <= 6.0 -> 70; > 6.0 -> 100"
      RH_MIN_PCT: 30
      RH_MAX_PCT: 50
      RH_PENALTY_PP: 10
    rounding: "mc_delta ROUND_HALF_UP to 1 decimal place; shares are whole percentages."
    worked_example: "Reference 7.3, subfloor 10.5 -> mc_delta 3.2 -> installer 40; ambient RH 62 is outside [30, 50] -> installer 50, mill 50."

  - name: product_line_posture
    description: "Derives the gating posture of a product line from its warranty reserve and freeze flag."
    algorithm_type: threshold
    trigger: "Recomputed after fund_warranty, freeze, unfreeze, claim approval and claim reversal."
    formula: |
      warranty_balance_cents = warranty_funded_total_cents - warranty_committed_cents
      posture = FROZEN     when freeze_override is true
              = RESTRICTED when warranty_balance_cents < WARRANTY_RESTRICT_FLOOR_CENTS
              = OPEN       otherwise
    constants:
      WARRANTY_RESTRICT_FLOOR_CENTS: 500000
    rounding: "Whole cents."
    worked_example: "Funded 600000 with 151474 committed -> balance 448526 < 500000 -> RESTRICTED; funding another 100000 -> balance 548526 -> OPEN."

  - name: green_board_feet_conservation
    description: "Conservation invariant tying allocated receipts to the charge volume ledger."
    algorithm_type: aggregation
    trigger: "Checked after every allocate_receipt, deallocate_receipt, displacement cascade and charge load."
    formula: |
      For every KilnCharge in status SCHEDULED, DISPLACED or LOADED:
        charged_green_bf == sum(accepted_board_feet of GreenReceipt rows with kiln_charge_id == charge.id
                                and status in [ALLOCATED, CONSUMED])
      Allocation and deallocation are exact inverses: allocate then deallocate restores both
      charged_green_bf and weighted_initial_moisture_pct to their pre-allocation values, and returns the
      receipt to ACCEPTED with kiln_charge_id null.
    constants: {}
    rounding: "Integer board feet; no rounding drift is permitted across allocate/deallocate cycles."
    worked_example: "Two receipts of 5800 and 3900 give charged_green_bf 9700; deallocating the 3900 receipt gives 5800 with weighted moisture 46.0; re-allocating restores 9700 and 45.2."

  - name: warranty_reserve_conservation
    description: "Conservation invariant on the warranty reserve of a product line."
    algorithm_type: aggregation
    trigger: "Checked after fund_warranty, claim approval and claim reversal."
    formula: |
      warranty_balance_cents + warranty_committed_cents == warranty_funded_total_cents
      warranty_committed_cents == sum(adjudicated_liability_cents of WarrantyClaim rows on the line
                                      with adjudication_status == APPROVED)
      A reversal credits exactly the amount the approval debited, so approve-then-reverse returns the
      line to its pre-approval balance, committed amount and posture with no residue.
    constants: {}
    rounding: "Whole cents."
    worked_example: "Funded 600000: approving a 151474 claim gives balance 448526 and committed 151474; reversing gives balance 600000 and committed 0."

validations:
  - priority: 1
    category: auth
    rule: "The request must carry an authenticated principal via the X-Role header."
    error_id: ERR_UNAUTHENTICATED
    status: 401
    applies_to: all endpoints
  - priority: 2
    category: authz
    rule: "The principal's role must be permitted for the endpoint."
    error_id: ERR_FORBIDDEN_ROLE
    status: 403
    applies_to: all endpoints
  - priority: 3
    category: schema
    rule: "Required fields present, types well formed, enum values in range, decimals non-negative where applicable, pagination limit in [1, 100] and offset >= 0."
    error_id: ERR_INVALID_REQUEST
    status: 400
    applies_to: all endpoints
  - priority: 4
    category: existence
    rule: "Referenced configuration row (SpeciesProfile, DryingSchedule, KilnChamber, ProductLine, CoreStock, PrefinishLine) must exist."
    error_id: ERR_CONFIG_NOT_FOUND
    status: 404
    applies_to: "config paths and every body reference to a configuration entity"
  - priority: 5
    category: existence
    rule: "Referenced GreenReceipt must exist."
    error_id: ERR_RECEIPT_NOT_FOUND
    status: 404
    applies_to: "green receipt paths, allocate_receipt and deallocate_receipt bodies"
  - priority: 6
    category: existence
    rule: "Referenced KilnCharge must exist."
    error_id: ERR_CHARGE_NOT_FOUND
    status: 404
    applies_to: "kiln charge paths and flooring lot creation"
  - priority: 7
    category: existence
    rule: "Referenced FlooringLot must exist."
    error_id: ERR_LOT_NOT_FOUND
    status: 404
    applies_to: "flooring lot paths, grade run creation, prefinish run creation, warranty claim creation"
  - priority: 8
    category: existence
    rule: "Referenced GradeRun must exist."
    error_id: ERR_GRADE_RUN_NOT_FOUND
    status: 404
    applies_to: "grade run paths, bundle creation, lot finalize, supersede replacement reference"
  - priority: 9
    category: existence
    rule: "Referenced PrefinishRun must exist."
    error_id: ERR_PREFINISH_RUN_NOT_FOUND
    status: 404
    applies_to: "prefinish run paths"
  - priority: 10
    category: existence
    rule: "Referenced ByproductBatch must exist."
    error_id: ERR_BATCH_NOT_FOUND
    status: 404
    applies_to: "byproduct batch paths and byproduct sale creation"
  - priority: 11
    category: existence
    rule: "Referenced WarrantyClaim must exist."
    error_id: ERR_CLAIM_NOT_FOUND
    status: 404
    applies_to: "warranty claim paths"
  - priority: 12
    category: concurrency
    rule: "expected_species_profile_version must equal the stored SpeciesProfile.version."
    error_id: ERR_STALE_SPECIES_PROFILE_VERSION
    status: 412
    applies_to: "POST /mill/drying-schedules"
  - priority: 13
    category: concurrency
    rule: "expected_lot_version must equal the stored FlooringLot.version."
    error_id: ERR_STALE_LOT_VERSION
    status: 412
    applies_to: "POST /mill/grade-runs"
  - priority: 14
    category: segregation_of_duties
    rule: "The X-User-ID adjudicating a warranty claim must differ from the claim's submitted_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    status: 403
    applies_to: "POST /mill/warranty-claims/{warranty_claim_id}/adjudicate"
  - priority: 15
    category: state
    rule: "The GreenReceipt must be in a state permitting the requested transition."
    error_id: ERR_RECEIPT_STATE_INVALID
    status: 409
    applies_to: "accept, reject, allocate_receipt, deallocate_receipt"
  - priority: 16
    category: state
    rule: "The KilnCharge must be in a state permitting the requested transition."
    error_id: ERR_CHARGE_STATE_INVALID
    status: 409
    applies_to: "all kiln charge action endpoints and flooring lot creation (charge must be RELEASED)"
  - priority: 17
    category: state
    rule: "The KilnChamber must be in a state permitting the requested transition or occupancy."
    error_id: ERR_CHAMBER_STATE_INVALID
    status: 409
    applies_to: "start_maintenance, complete_maintenance, charge create, charge load"
  - priority: 18
    category: state
    rule: "The FlooringLot must be in a state permitting the requested transition."
    error_id: ERR_LOT_STATE_INVALID
    status: 409
    applies_to: "complete_milling, finalize, void, grade run creation"
  - priority: 19
    category: state
    rule: "The GradeRun must be in a state permitting the requested transition."
    error_id: ERR_GRADE_RUN_STATE_INVALID
    status: 409
    applies_to: "bundle creation, finalize, supersede, lot finalize reference"
  - priority: 20
    category: state
    rule: "The PrefinishRun must be in a state permitting the requested transition."
    error_id: ERR_PREFINISH_RUN_STATE_INVALID
    status: 409
    applies_to: "start, complete, release_hold"
  - priority: 21
    category: state
    rule: "The WarrantyClaim adjudication or remediation dimension must be in a state permitting the requested transition."
    error_id: ERR_CLAIM_STATE_INVALID
    status: 409
    applies_to: "request_info, resubmit, adjudicate, reverse, start_remediation, complete_remediation"
  - priority: 22
    category: state
    rule: "The ProductLine posture must be OPEN for prefinish scheduling, starting and hold release."
    error_id: ERR_PRODUCT_LINE_POSTURE_BLOCKED
    status: 409
    applies_to: "POST /mill/prefinish-runs, start, release_hold"
  - priority: 23
    category: business_safety
    rule: "A charge may not be sent back for redry more than MAX_REDRY_CYCLES times."
    error_id: ERR_REDRY_LIMIT_EXCEEDED
    status: 409
    applies_to: "record_stress_test"
    constants: { MAX_REDRY_CYCLES: 2 }
  - priority: 24
    category: business_safety
    rule: "Only a GRADED flooring lot may be scheduled for prefinishing."
    error_id: ERR_LOT_NOT_GRADED
    status: 409
    applies_to: "POST /mill/prefinish-runs"
  - priority: 25
    category: business_safety
    rule: "The charge weighted green moisture content must sit within MC_PLAN_TOLERANCE_PP of the schedule design moisture."
    error_id: ERR_MC_PLAN_DEVIATION
    status: 422
    applies_to: "POST /mill/kiln-charges/{kiln_charge_id}/load"
  - priority: 26
    category: business_safety
    rule: "The milled face width must sit within PROFILE_TOLERANCE_IN of planned_finished_width_in."
    error_id: ERR_PROFILE_TOLERANCE_EXCEEDED
    status: 422
    applies_to: "complete_milling"
  - priority: 27
    category: business_safety
    rule: "A milled lot with any byproduct sale recorded against its batches may not be voided."
    error_id: ERR_BYPRODUCT_SALE_EXISTS
    status: 409
    applies_to: "void"
  - priority: 28
    category: business_referential
    rule: "A receipt may only be allocated to a charge whose schedule species matches the receipt species."
    error_id: ERR_SPECIES_MISMATCH
    status: 422
    applies_to: "allocate_receipt"
  - priority: 29
    category: business_referential
    rule: "An ENGINEERED product line lot must reference a core_stock_id."
    error_id: ERR_CORE_STOCK_REQUIRED
    status: 422
    applies_to: "POST /mill/flooring-lots"
  - priority: 30
    category: business_referential
    rule: "A SOLID product line lot must not reference a core_stock_id."
    error_id: ERR_CORE_STOCK_NOT_ALLOWED
    status: 422
    applies_to: "POST /mill/flooring-lots"
  - priority: 31
    category: business_referential
    rule: "The referenced core stock must belong to the lot's product line."
    error_id: ERR_CORE_STOCK_LINE_MISMATCH
    status: 422
    applies_to: "POST /mill/flooring-lots"
  - priority: 32
    category: business_referential
    rule: "A grade run referenced by a lot finalize, or a replacement run in a supersede, must belong to that same lot."
    error_id: ERR_GRADE_RUN_LOT_MISMATCH
    status: 422
    applies_to: "finalize, supersede"
  - priority: 33
    category: business_referential
    rule: "CHARACTER and CABIN bundles are only permitted under the MILL_CHARACTER ruleset."
    error_id: ERR_CHARACTER_GRADE_NOT_PERMITTED
    status: 422
    applies_to: "POST /mill/grade-runs/{grade_run_id}/bundles, POST /mill/grade-runs/{grade_run_id}/finalize"
  - priority: 34
    category: business_temporal
    rule: "A prefinish window must be non-empty and no longer than MAX_PREFINISH_WINDOW_HOURS."
    error_id: ERR_PREFINISH_WINDOW_INVALID
    status: 422
    applies_to: "POST /mill/prefinish-runs"
    constants: { MAX_PREFINISH_WINDOW_HOURS: 24 }
  - priority: 35
    category: business_temporal
    rule: "A charge occupancy window may not collide with another occupancy window on the same chamber."
    error_id: ERR_CHAMBER_WINDOW_CONFLICT
    status: 409
    applies_to: "POST /mill/kiln-charges, reschedule"
  - priority: 36
    category: business_temporal
    rule: "A claimed installation date may not be after the current logical date."
    error_id: ERR_INSTALL_DATE_IN_FUTURE
    status: 422
    applies_to: "POST /mill/warranty-claims"
  - priority: 37
    category: business_temporal
    rule: "A claim may not be filed more than WARRANTY_MONTHS whole months after installation."
    error_id: ERR_WARRANTY_PERIOD_EXPIRED
    status: 422
    applies_to: "POST /mill/warranty-claims"
    constants: { WARRANTY_MONTHS: 60 }
  - priority: 38
    category: business_constraint
    rule: "accepted_board_feet may not exceed received_board_feet."
    error_id: ERR_ACCEPTED_BF_EXCEEDS_RECEIVED
    status: 422
    applies_to: "accept"
  - priority: 39
    category: business_constraint
    rule: "charged_green_bf may not exceed the chamber capacity_board_feet."
    error_id: ERR_CHAMBER_CAPACITY_EXCEEDED
    status: 422
    applies_to: "allocate_receipt"
  - priority: 40
    category: business_constraint
    rule: "A lot may not draw more than the charge remaining_dry_bf."
    error_id: ERR_CHARGE_DRY_BF_EXCEEDED
    status: 422
    applies_to: "POST /mill/flooring-lots"
  - priority: 41
    category: business_constraint
    rule: "Core reservations may not exceed CoreStock.available_square_feet."
    error_id: ERR_CORE_STOCK_INSUFFICIENT
    status: 422
    applies_to: "POST /mill/flooring-lots"
  - priority: 42
    category: business_constraint
    rule: "Reported milling outputs may not exceed the kiln-dry input (negative waste)."
    error_id: ERR_MILL_MASS_BALANCE_VIOLATION
    status: 422
    applies_to: "complete_milling"
  - priority: 43
    category: business_constraint
    rule: "Unaccounted waste may not exceed MAX_WASTE_PCT of the kiln-dry input."
    error_id: ERR_WASTE_LIMIT_EXCEEDED
    status: 422
    applies_to: "complete_milling"
  - priority: 44
    category: business_constraint
    rule: "A grade run must carry at least one bundle before it can be finalized."
    error_id: ERR_NO_GRADE_BUNDLES
    status: 422
    applies_to: "POST /mill/grade-runs/{grade_run_id}/finalize"
  - priority: 45
    category: business_constraint
    rule: "Total bundle board feet may not exceed the lot net_flooring_bf."
    error_id: ERR_BUNDLE_BF_EXCEEDS_LOT
    status: 422
    applies_to: "POST /mill/grade-runs/{grade_run_id}/bundles, POST /mill/grade-runs/{grade_run_id}/finalize"
  - priority: 46
    category: business_constraint
    rule: "Aggregate scheduled linear feet across overlapping windows may not exceed the line daily capacity."
    error_id: ERR_PREFINISH_CAPACITY_EXCEEDED
    status: 422
    applies_to: "POST /mill/prefinish-runs"
  - priority: 47
    category: business_constraint
    rule: "A byproduct sale may not draw more tonnage than the batch has unsold."
    error_id: ERR_BYPRODUCT_QUANTITY_EXCEEDS_BATCH
    status: 422
    applies_to: "POST /mill/byproduct-sales"
  - priority: 48
    category: business_constraint
    rule: "A product line may not carry more than MAX_OPEN_CLAIMS claims in SUBMITTED or INFO_REQUESTED at once."
    error_id: ERR_TOO_MANY_OPEN_CLAIMS
    status: 409
    applies_to: "POST /mill/warranty-claims"
    constants: { MAX_OPEN_CLAIMS: 3 }
  - priority: 49
    category: business_constraint
    rule: "Configuration codes (species_code, schedule_code, chamber_code, line_code) must be unique."
    error_id: ERR_DUPLICATE_CODE
    status: 409
    applies_to: "config create endpoints"
  - priority: 50
    category: business_fiscal
    rule: "adjudicated_affected_sf may not exceed the claimed affected_square_feet."
    error_id: ERR_ADJUDICATED_SF_EXCEEDS_CLAIM
    status: 422
    applies_to: "adjudicate"
  - priority: 51
    category: business_fiscal
    rule: "The product line warranty reserve balance must cover adjudicated_liability_cents."
    error_id: ERR_WARRANTY_RESERVE_INSUFFICIENT
    status: 422
    applies_to: "adjudicate with decision APPROVED"

endpoints:
  - method: POST
    path: /_clock/set_current_utc
    description: "Test-driving endpoint: sets the logical clock used for warranty age, service months and future-date checks. Default logical clock is 2026-08-01T00:00:00Z."
    roles: &all_readers [MillAdmin, ProcurementClerk, KilnOperator, MillSupervisor, GradeInspector, PrefinishScheduler, ByproductBroker, WarrantyAdjudicator]
    input: [current_utc]
    output: "{ current_utc: datetime }"
    code: 200
    side_effects:
      - "All subsequent date-dependent calculations use this instant."

  - method: POST
    path: /mill/species-profiles
    description: "Register a wood species profile."
    roles: [MillAdmin]
    input: [species_code, common_name, density_class, tangential_shrinkage_coefficient, target_moisture_pct, max_moisture_gradient_pp]
    output: SpeciesProfile
    code: 201
    side_effects:
      - "Derive green_to_dry_shrink_pct from density_class."
  - method: GET
    path: /mill/species-profiles/{species_profile_id}
    description: "Fetch one species profile."
    roles: *all_readers
    input: []
    output: SpeciesProfile
    code: 200
  - method: GET
    path: /mill/species-profiles
    description: "List species profiles."
    roles: *all_readers
    input: ["density_class?", "limit?", "offset?"]
    output: SpeciesProfile[]
    code: 200

  - method: POST
    path: /mill/drying-schedules
    description: "Create a kiln drying schedule for one species and thickness. Optimistically concurrent on the species profile."
    roles: [MillAdmin, KilnOperator]
    input: [species_profile_id, schedule_code, thickness_in, initial_moisture_pct, final_moisture_pct, conditioning_hours, stress_relief_hours, expected_species_profile_version]
    output: DryingSchedule
    code: 201
    side_effects:
      - "Compute planned_dry_hours from kiln_schedule_duration."
      - "Increment SpeciesProfile.version."
  - method: GET
    path: /mill/drying-schedules/{drying_schedule_id}
    description: "Fetch one drying schedule."
    roles: *all_readers
    input: []
    output: DryingSchedule
    code: 200
  - method: GET
    path: /mill/drying-schedules
    description: "List drying schedules, optionally by species profile."
    roles: *all_readers
    input: ["species_profile_id?", "limit?", "offset?"]
    output: DryingSchedule[]
    code: 200

  - method: POST
    path: /mill/green-receipts
    description: "Record an inbound green lumber or log receipt."
    roles: [ProcurementClerk, MillAdmin]
    input: [species_profile_id, supplier_name, received_board_feet, receipt_grade, moisture_pct_at_receipt]
    output: GreenReceipt
    code: 201
  - method: GET
    path: /mill/green-receipts/{green_receipt_id}
    description: "Fetch one green receipt."
    roles: *all_readers
    input: []
    output: GreenReceipt
    code: 200
  - method: GET
    path: /mill/green-receipts
    description: "List green receipts, optionally by species, allocated charge or status."
    roles: *all_readers
    input: ["species_profile_id?", "kiln_charge_id?", "status?", "limit?", "offset?"]
    output: GreenReceipt[]
    code: 200
  - method: POST
    path: /mill/green-receipts/{green_receipt_id}/accept
    description: "Accept a receipt with its scaled board footage."
    roles: [ProcurementClerk, MillAdmin]
    input: [accepted_board_feet]
    output: GreenReceipt
    code: 200
    side_effects:
      - "Set accepted_board_feet and move status to ACCEPTED."
  - method: POST
    path: /mill/green-receipts/{green_receipt_id}/reject
    description: "Reject a receipt at the receiving deck."
    roles: [ProcurementClerk, MillAdmin]
    input: [rejection_reason]
    output: GreenReceipt
    code: 200
    side_effects:
      - "Set rejection_reason and move status to REJECTED."

  - method: POST
    path: /mill/kiln-chambers
    description: "Register a kiln chamber."
    roles: [MillAdmin]
    input: [chamber_code, capacity_board_feet]
    output: KilnChamber
    code: 201
  - method: GET
    path: /mill/kiln-chambers/{kiln_chamber_id}
    description: "Fetch one kiln chamber."
    roles: *all_readers
    input: []
    output: KilnChamber
    code: 200
  - method: GET
    path: /mill/kiln-chambers
    description: "List kiln chambers."
    roles: *all_readers
    input: ["status?", "limit?", "offset?"]
    output: KilnChamber[]
    code: 200
  - method: POST
    path: /mill/kiln-chambers/{kiln_chamber_id}/start_maintenance
    description: "Take a chamber out of service for maintenance."
    roles: [KilnOperator, MillAdmin]
    input: [maintenance_note]
    output: KilnChamber
    code: 200
    side_effects:
      - "Move status to MAINTENANCE."
  - method: POST
    path: /mill/kiln-chambers/{kiln_chamber_id}/complete_maintenance
    description: "Return a chamber to service."
    roles: [KilnOperator, MillAdmin]
    input: []
    output: KilnChamber
    code: 200
    side_effects:
      - "Move status to AVAILABLE and clear maintenance_note."

  - method: POST
    path: /mill/kiln-charges
    description: "Schedule a kiln charge in a chamber against a drying schedule."
    roles: [KilnOperator, MillAdmin]
    input: [drying_schedule_id, kiln_chamber_id, planned_start_utc]
    output: KilnCharge
    code: 201
    side_effects:
      - "Snapshot planned_dry_hours and compute planned_end_utc and blocked_until_utc."
      - "Reject when the occupancy window collides with another window on the chamber."
  - method: GET
    path: /mill/kiln-charges/{kiln_charge_id}
    description: "Fetch one kiln charge."
    roles: *all_readers
    input: []
    output: KilnCharge
    code: 200
  - method: GET
    path: /mill/kiln-charges
    description: "List kiln charges, optionally by schedule, chamber or status."
    roles: *all_readers
    input: ["drying_schedule_id?", "kiln_chamber_id?", "status?", "limit?", "offset?"]
    output: KilnCharge[]
    code: 200
  - method: POST
    path: /mill/kiln-charges/{kiln_charge_id}/allocate_receipt
    description: "Allocate an accepted receipt to a scheduled charge."
    roles: [KilnOperator, MillAdmin]
    input: [green_receipt_id]
    output: KilnCharge
    code: 200
    side_effects:
      - "Receipt moves to ALLOCATED with kiln_charge_id set."
      - "Recompute charged_green_bf and weighted_initial_moisture_pct."
  - method: POST
    path: /mill/kiln-charges/{kiln_charge_id}/deallocate_receipt
    description: "Remove an allocated receipt from a charge."
    roles: [KilnOperator, MillAdmin]
    input: [green_receipt_id]
    output: KilnCharge
    code: 200
    side_effects:
      - "Receipt returns to ACCEPTED with kiln_charge_id cleared."
      - "Recompute charged_green_bf and weighted_initial_moisture_pct."
  - method: POST
    path: /mill/kiln-charges/{kiln_charge_id}/load
    description: "Load the charge into its chamber."
    roles: [KilnOperator]
    input: []
    output: KilnCharge
    code: 200
    side_effects:
      - "Chamber moves to OCCUPIED."
      - "All allocated receipts move to CONSUMED."
  - method: POST
    path: /mill/kiln-charges/{kiln_charge_id}/start_drying
    description: "Begin the drying leg."
    roles: [KilnOperator]
    input: []
    output: KilnCharge
    code: 200
  - method: POST
    path: /mill/kiln-charges/{kiln_charge_id}/begin_conditioning
    description: "Begin equalisation and conditioning."
    roles: [KilnOperator]
    input: []
    output: KilnCharge
    code: 200
  - method: POST
    path: /mill/kiln-charges/{kiln_charge_id}/record_stress_test
    description: "Record the shell and core moisture readings, releasing the charge or sending it back for redry."
    roles: [KilnOperator]
    input: [shell_moisture_pct, core_moisture_pct]
    output: KilnCharge
    code: 200
    side_effects:
      - "Compute moisture_gradient_pp and average_moisture_pct."
      - "On release: compute dry_bf_out and remaining_dry_bf, free the chamber."
      - "On redry: increment redry_count, extend the occupancy window, displace overlapping scheduled charges and return their receipts to ACCEPTED."
  - method: POST
    path: /mill/kiln-charges/{kiln_charge_id}/resume_conditioning
    description: "Return a redrying charge to conditioning."
    roles: [KilnOperator]
    input: []
    output: KilnCharge
    code: 200
    side_effects:
      - "Clear the stored stress test readings."
  - method: POST
    path: /mill/kiln-charges/{kiln_charge_id}/reschedule
    description: "Reschedule a displaced charge into a free window."
    roles: [KilnOperator, MillAdmin]
    input: [planned_start_utc]
    output: KilnCharge
    code: 200
    side_effects:
      - "Recompute the occupancy window and clear displaced_reason."

  - method: POST
    path: /mill/product-lines
    description: "Create a solid or engineered product line with its warranty reserve."
    roles: [MillAdmin]
    input: [line_code, species_profile_id, construction_type, nominal_width_in, nominal_thickness_in, material_value_cents_per_sf, warranty_funded_total_cents]
