      - name: corner_val_explicit_cleaner_eligibility_versus_empty_selector_pool
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=32]
          - validations[priority=34]
          - errors.ERR_CLEANER_NOT_ELIGIBLE
          - errors.ERR_NO_ELIGIBLE_CLEANER
        distinguishing_aspect: |
          The same underlying eligibility predicate produces two different errors depending on the
          selection mode: naming an ineligible cleaner is a 422 ERR_CLEANER_NOT_ELIGIBLE, whereas
          letting the SELECTOR run over a pool that filters down to nothing is a 422
          ERR_NO_ELIGIBLE_CLEANER. Both ineligibility routes are exercised - skill_level below the
          property's min_skill_level, and a zone the cleaner neither lives in, lists as secondary,
          nor accepts as cross-zone - and exclude_cleaner_ids is used to empty a pool that would
          otherwise resolve.
        test_recipe:
          setup:
            - "Property P1 'AUS-101' ZONE_A with min_skill_level 2; turnover T1 at version 1 in PENDING_ASSIGNMENT."
            - "Cleaner LOW: home ZONE_A, skill_level 1. Cleaner FAR: home ZONE_D, skill_level 5, accepts_cross_zone false, no secondary zones. Neither is eligible."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, local_utc_offset_minutes: -300, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /cleaners"
              payload: { name: "Cleaner LOW", home_zone_code: "ZONE_A", skill_level: 1 }
              as: PlatformAdmin
              captures: { c_low: "$.data.id", low_skill: "$.data.skill_level", low_q: "$.data.quality_score" }
            - call: "POST /cleaners"
              payload: { name: "Cleaner FAR", home_zone_code: "ZONE_D", skill_level: 5 }
              as: PlatformAdmin
              captures: { c_far: "$.data.id", far_zones: "$.data.secondary_zone_codes", far_cross: "$.data.accepts_cross_zone" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b_out: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "IN-1", guest_name: "Guest In", checkin_at: "2026-08-08T21:00:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { b_in: "$.data.id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out}", incoming_booking_id: "${b_in}" }
              as: Coordinator
              captures: { t1: "$.data.id", t1_v: "$.data.version" }
          trigger:
            - call: "POST /turnovers/${t1}/assign"
              payload: { expected_turnover_version: "${t1_v}", cleaner_id: "${c_low}" }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { e1: "$.data.error_id" }
            - call: "POST /turnovers/${t1}/assign"
              payload: { expected_turnover_version: "${t1_v}", cleaner_id: "${c_far}" }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { e2: "$.data.error_id" }
            - call: "POST /turnovers/${t1}/assign"
              payload: { expected_turnover_version: "${t1_v}" }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { e3: "$.data.error_id" }
            - call: "POST /cleaners"
              payload: { name: "Cleaner OK", home_zone_code: "ZONE_A", skill_level: 2 }
              as: PlatformAdmin
              captures: { c_ok: "$.data.id", ok_q: "$.data.quality_score" }
            - call: "POST /turnovers/${t1}/assign"
              payload: { expected_turnover_version: "${t1_v}", exclude_cleaner_ids: ["${c_ok}"] }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { e4: "$.data.error_id" }
            - call: "POST /turnovers/${t1}/assign"
              payload: { expected_turnover_version: "${t1_v}" }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { a1: "$.data.id", a1_cleaner: "$.data.cleaner_id", a1_score: "$.data.match_score", a1_mode: "$.data.selection_mode", a1_zone: "$.data.zone_match_factor" }
            - call: "GET /turnovers/${t1}"
              payload: {}
              as: Coordinator
              captures: { t1_ver: "$.data.version", t1_status: "$.data.status" }
          assert:
            - "${low_skill} == 1 and ${low_q} == 80.0 (declared default); ${far_zones} == [] and ${far_cross} == false (declared defaults)"
            - "${e1} == ERR_CLEANER_NOT_ELIGIBLE (422) - skill_level 1 < min_skill_level 2, even though the zone matches"
            - "${e2} == ERR_CLEANER_NOT_ELIGIBLE (422) - ZONE_D is neither home, secondary, nor cross-zone-accepted, even though skill 5 clears the bar"
            - "${e3} == ERR_NO_ELIGIBLE_CLEANER (422) - SELECTOR mode over a pool that filters to empty"
            - "${e4} == ERR_NO_ELIGIBLE_CLEANER (422) - the only eligible candidate was excluded by exclude_cleaner_ids"
            - "${a1_mode} == SELECTOR, ${a1_cleaner} == ${c_ok}, ${a1_zone} == 1.0"
            - "${a1_score} == 0.7500 (0.5 * 0.80 + 0.3 * 1.0 + 0.2 * 0.25 == 0.4000 + 0.3000 + 0.0500)"
            - "${t1_ver} == 2 and ${t1_status} == PENDING_ASSIGNMENT - only the successful offer bumped the version; five refusals bumped nothing"

      - name: corner_val_photo_evidence_is_required_before_stock_availability_is_checked
        claim_type: Priority conflict
        grounds:
          - validations[priority=15]
          - validations[priority=35]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / photo_required_outranks_insufficient_on_hand
          rationale: "That instance submits a RESTOCK row with no photo_uri and a qty_used above on_hand_qty at once and asserts ERR_PHOTO_REQUIRED (422, priority 15) rather than ERR_INSUFFICIENT_ON_HAND (409, priority 35), then fixes the photo to surface the second error."

      - name: corner_val_overlapping_stays_on_one_property_are_refused
        claim_type: Temporal validation
        grounds:
          - validations[priority=21]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / booking_occupancy_half_open_adjacency_allowed_on_property
          rationale: "That instance books a stay starting exactly at the prior checkout (accepted) and one minute earlier (ERR_BOOKING_OVERLAP), which is the priority 21 boundary in both directions."

      - name: corner_val_gating_sibling_states_block_turnover_creation_offers_and_starts
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=13]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / turnover_creation_requires_property_active
          rationale: "The three priority 13 sibling gates each have a dedicated §1.8 instance: turnover_creation_requires_property_active (ERR_PROPERTY_NOT_ACTIVE), assign_requires_named_cleaner_active (ERR_CLEANER_NOT_ACTIVE) and start_requires_outgoing_booking_checked_out (ERR_GUEST_NOT_CHECKED_OUT)."

      - name: corner_val_window_sufficiency_outranks_turnover_uniqueness
        claim_type: Priority conflict
        grounds:
          - validations[priority=23]
          - validations[priority=29]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / window_override_required_outranks_turnover_already_exists
          rationale: "That instance sends a second turnover for an outgoing booking that already has one AND a window shorter than required, asserting ERR_WINDOW_OVERRIDE_REQUIRED (priority 23) before ERR_TURNOVER_ALREADY_EXISTS (priority 29), then supplies override_reason to surface the uniqueness error."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: corner_ep_pay_preview_is_a_pure_computed_read_with_no_side_effects
        claim_type: Computed read
        grounds:
          - endpoints["GET /turnovers/{id}/pay-preview"]
          - calculations.cleaner_pay_line
          - entities.PayLine
        distinguishing_aspect: |
          pay-preview declares an empty side_effects list and returns a PayLine SHAPE rather than a
          stored row, so calling it repeatedly must be free: the numbers match the persisted
          PROVISIONAL line field for field, the turnover version does not move, no second PayLine
          appears in GET /pay-lines, and Cleaner.pending_payout_cents does not double. The full
          breakdown is asserted so the preview cannot be a stub that only fills net_cents.
        test_recipe:
          setup:
            - "Canonical P1 turnover T1 with LINEN lines par 6 and par 8; Cleaner C accepted the offer, which created the PROVISIONAL pay line."
            - "PROVISIONAL arithmetic: base 8325 + rush round_half_up(8325 * 0.15) 1249 + tight 0 + cross-zone 0 + linen 120 * 14 = 1680 -> gross 11254; bonuses 800 + 500; penalties 0; net 12554."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, local_utc_offset_minutes: -300, min_clean_minutes: 120, min_skill_level: 2 }
