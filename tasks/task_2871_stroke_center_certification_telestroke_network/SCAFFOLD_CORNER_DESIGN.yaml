        as: ProgramCoordinator
        captures:
          pe_ctr: $.data.id
      - call: POST /stroke-network/code-strokes
        payload:
          center_id: ${pe_ctr}
          patient_ref: P-PE-001
          door_at: '2026-09-01T08:00:00Z'
          lkw_precision: EXACT
          arrival_mode: EMS
          last_known_well_at: '2026-09-01T07:40:00Z'
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          pe_case: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:05:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers/${pe_ctr}/readiness-attestations
        payload:
          component: CT_SCANNER
          result: FAIL
          note: gantry fault reported by radiology
        as: ProgramCoordinator
        captures:
          pe_ct: $.data.ct_scanner_ready
          pe_eq: $.data.equipment_readiness_posture
          pe_ems: $.data.ems_routing_posture
      trigger:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:10:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/code-strokes/${pe_case}/imaging-complete
        payload:
          imaging_modality: CT_NON_CONTRAST
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          pe_id: $.data.error_id
          pe_msg: $.data.message
      - call: GET /stroke-network/code-strokes/${pe_case}
        as: EdPhysician
        captures:
          pe_status: $.data.status
          pe_img: $.data.imaging_at
          pe_v: $.data.version
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:30:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers/${pe_ctr}/readiness-attestations
        payload:
          component: CT_SCANNER
          result: PASS
          note: gantry replaced and calibrated
        as: ProgramCoordinator
        captures:
          pe_eq2: $.data.equipment_readiness_posture
      - call: POST /stroke-network/code-strokes/${pe_case}/imaging-complete
        payload:
          imaging_modality: CT_NON_CONTRAST
        as: EdPhysician
        as_user_id: ed_ann
      - call: GET /stroke-network/code-strokes/${pe_case}
        as: EdPhysician
        captures:
          pe_status2: $.data.status
          pe_dti2: $.data.door_to_imaging_minutes
      assert:
      - after the FAIL attestation ${pe_ct} == false, ${pe_eq} == DEGRADED (only one flag down) and ${pe_ems} == DIVERT_ADVISORY
      - the imaging call returns HTTP 409 with ${pe_id} == ERR_CENTER_EQUIPMENT_OFFLINE
      - ${pe_status} is still ACTIVATED, ${pe_img} == null and ${pe_v} == 1 — the refusal wrote nothing
      - after the PASS attestation ${pe_eq2} == READY and the identical imaging call returns HTTP 200
      - ${pe_status2} == IMAGING_COMPLETE and ${pe_dti2} == 30 (floor of 08:00 -> 08:30), so the retry clock is the one that counts
  - name: consult_creation_applies_every_declared_routing_side_effect
    claim_type: side_effect_execution
    grounds:
    - state_machines.CodeStrokeCase IMAGING_COMPLETE -> CONSULT_IN_PROGRESS
