  - section: cross_cutting_complexity_layers
    instances:
      - name: all_four_declared_races_refuse_a_stale_parent_version_and_admit_the_fresh_one
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers.optimistic_concurrency
          - concurrency_rules.seat-offer-stale-room
          - concurrency_rules.room-reconfigure-stale-room
          - concurrency_rules.assignment-create-stale-episode
          - concurrency_rules.season-reschedule-stale-season
          - errors.ERR_STALE_ROOM_VERSION
          - errors.ERR_STALE_EPISODE_VERSION
          - errors.ERR_STALE_SEASON_VERSION
        distinguishing_aspect: |
          Each of the four declared races is exercised with a version that was genuinely current when it was
          read and went stale because of an unrelated write, and OCC at priority 20 must beat every business
          check below it - the stale seat offer names ERR_STALE_ROOM_VERSION even though the same payload
          would also fail the availability check at priority 66. A refused write never increments the
          parent's version, so the fresh retry uses version+1 and not version+2.
        test_recipe:
          setup:
            - "Room RM is in STAFFING with one OFFERED seat S1, so the version captured at open-staffing is one write behind."
            - "W3 exists but owns no availability window at all, which is what makes the priority ordering observable."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W3
            - *C_SE
            - *C_AW1
            - *C_RM
            - *C_OPEN
            - *C_S1
          trigger:
            - call: "POST /rooms/${rm}/seats"
              payload: { writer_id: "${w3}", level_at_hire: "STAFF_WRITER", offered_weekly_compensation_cents: 450000, exclusivity: "NON_EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", expected_room_version: "${rv1}" }
              as: Showrunner
              as_user_id: "${sr}"
            - call: "POST /rooms/${rm}/reconfigure"
              payload: { format: "REMOTE", duration_weeks_committed: 26, expected_room_version: "${rv1}" }
              as: StudioExecutive
            - call: "GET /rooms/${rm}"
              payload: {}
              as: StudioExecutive
              captures: { rv26: "$.data.version" }
            - call: "POST /rooms/${rm}/reconfigure"
              payload: { format: "REMOTE", duration_weeks_committed: 26, expected_room_version: "${rv26}" }
              as: StudioExecutive
            - *C_ACC1
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - call: "POST /episodes/${ep1}/script-assignments"
              payload: { writer_id: "${w1}", assignment_type: "STORY", expected_episode_version: "${ev1}" }
              as: Showrunner
              as_user_id: "${sr}"
            - call: "GET /seasons/${se}"
              payload: {}
              as: StudioExecutive
              captures: { sv2: "$.data.version" }
            - call: "POST /seasons/${se}/reschedule"
              payload: { new_production_start_date: "2026-11-16T00:00:00Z", expected_season_version: "${sv2}" }
              as: StudioExecutive
            - call: "POST /seasons/${se}/reschedule"
              payload: { new_production_start_date: "2026-12-01T00:00:00Z", expected_season_version: "${sv2}" }
              as: StudioExecutive
          assert:
            - "Trigger call 1 returns 412 ERR_STALE_ROOM_VERSION and NOT 422 ERR_WRITER_UNAVAILABLE: ${rv1} was read at open-staffing (version 2) and the S1 offer moved the room to 3, and OCC at priority 20 precedes the window check at priority 66"
            - "Trigger call 2 returns 412 ERR_STALE_ROOM_VERSION with the same stale ${rv1}; WritersRoom.${rm}.format is still IN_PERSON and version is still 3, so neither refusal consumed a version"
            - "Trigger call 4 returns 200 with format REMOTE, facility_surcharge_weekly_cents == 80000 (200000 * REMOTE 0.4), weekly_burn_cents == 80000 (no CONFIRMED seat yet) and version ${rv26} + 1 == 4"
            - "Trigger call 9 returns 412 ERR_STALE_EPISODE_VERSION: ${ev1} was the version read at episode creation and the ${a1} create moved the episode to 2; GET /script-assignments?episode_id=${ep1} returns total_count == 1"
            - "Trigger call 11 returns 200: Season.${se}.production_start_date == 2026-11-16T00:00:00Z, Episode.${ep1}.production_start_date == 2026-11-16T00:00:00Z (the same +14 day delta) and the ${a1} milestones move to 2026-10-05, 2026-10-19 and 2026-11-02 (all 23:59:59.999Z) with polish_due_date 2026-11-13T23:59:59.999Z"
            - "Trigger call 12 returns 412 ERR_STALE_SEASON_VERSION using the version that trigger call 11 superseded, and Season.${se}.production_start_date is still 2026-11-16T00:00:00Z"
            - "Every successful write in the sequence incremented exactly one version: WritersRoom.${rm} ends at 6 (create, open-staffing, offer, reconfigure, accept, activate) and Season.${se}.version == ${sv2} + 1"

      - name: the_seat_selector_ranks_confirmed_seats_by_confirmation_time
        claim_type: selector_policy
        grounds:
          - complexity_profile.complexity_layers.selector_policy
          - entities.ScriptAssignment.fields.room_seat_id
          - errors.ERR_WRITER_NOT_STAFFED
        distinguishing_aspect: |
          When a writer holds two CONFIRMED seats in two ACTIVE rooms of the same season the assignment does
          not pick the newest, the cheapest or the room named in any payload - it picks the earliest
          confirmed_at, and the choice is frozen at creation: releasing the selected seat sends the existing
          assignment to REASSIGNMENT_PENDING rather than re-pointing it at the surviving seat, while the
          NEXT assignment created selects that surviving seat.
        test_recipe:
          setup:
            - "W1 holds two windows and is CONFIRMED in two ACTIVE rooms of season SE: S23 in RM (confirmed at 2026-08-01) and S24 in RM15 (confirmed at 2026-08-05)."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_SE
            - call: "POST /writers/${w1}/availability-windows"
              payload: { start_date: "2026-08-15T00:00:00Z", end_date: "2027-06-01T00:00:00Z", commitment_type: "NON_EXCLUSIVE" }
              as: Writer
              as_user_id: "${w1}"
              captures: { aw15: "$.data.id" }
            - call: "POST /writers/${w1}/availability-windows"
              payload: { start_date: "2026-08-20T00:00:00Z", end_date: "2027-06-05T00:00:00Z", commitment_type: "NON_EXCLUSIVE" }
              as: Writer
              as_user_id: "${w1}"
              captures: { aw16: "$.data.id" }
            - *C_RM
            - *C_OPEN
            - call: "POST /rooms/${rm}/seats"
              payload: { writer_id: "${w1}", level_at_hire: "STORY_EDITOR", offered_weekly_compensation_cents: 600000, exclusivity: "NON_EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", episodic_guarantee_count: 1, expected_room_version: "${rv1}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { s23: "$.data.id" }
            - call: "POST /room-seats/${s23}/accept"
              payload: {}
              as: Writer
              as_user_id: "${w1}"
            - call: "POST /rooms/${rm}/activate"
              payload: {}
              as: StudioExecutive
            - call: "POST /seasons/${se}/rooms"
              payload: { name: "Late Mini Room", format: "IN_PERSON", seat_capacity: 2, duration_weeks_committed: 26, start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rm15: "$.data.id" }
            - call: "POST /rooms/${rm15}/open-staffing"
              payload: {}
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rv27: "$.data.version" }
            - call: "POST /rooms/${rm15}/seats"
              payload: { writer_id: "${w1}", level_at_hire: "STORY_EDITOR", offered_weekly_compensation_cents: 600000, exclusivity: "NON_EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", episodic_guarantee_count: 2, expected_room_version: "${rv27}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { s24: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: StudioExecutive
            - call: "POST /room-seats/${s24}/accept"
              payload: {}
              as: Writer
              as_user_id: "${w1}"
            - call: "POST /rooms/${rm15}/activate"
              payload: {}
              as: StudioExecutive
            - *C_EP1
          trigger:
            - call: "POST /episodes/${ep1}/script-assignments"
              payload: { writer_id: "${w1}", assignment_type: "TELEPLAY", expected_episode_version: "${ev1}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { a14: "$.data.id" }
            - call: "POST /room-seats/${s23}/release"
              payload: { reason: "Room folded into the second unit." }
              as: StudioExecutive
            - call: "GET /episodes/${ep1}"
              payload: {}
              as: StudioExecutive
              captures: { ev16: "$.data.version" }
            - call: "POST /episodes/${ep1}/script-assignments"
              payload: { writer_id: "${w1}", assignment_type: "STORY", expected_episode_version: "${ev16}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { a15: "$.data.id" }
            - call: "POST /room-seats/${s24}/release"
              payload: { reason: "Writer left the show." }
              as: StudioExecutive
            - call: "GET /episodes/${ep1}"
              payload: {}
              as: StudioExecutive
              captures: { ev17: "$.data.version" }
            - call: "POST /episodes/${ep1}/script-assignments"
              payload: { writer_id: "${w1}", assignment_type: "STORY_AND_TELEPLAY", expected_episode_version: "${ev17}" }
              as: Showrunner
              as_user_id: "${sr}"
          assert:
            - "Before the trigger: RoomSeat.${s23}.confirmed_at == 2026-08-01T00:00:00Z with episodic_guarantee_count 1, RoomSeat.${s24}.confirmed_at == 2026-08-05T00:00:00Z with episodic_guarantee_count 2, and AvailabilityWindow.${aw15} is CONSUMED by ${s23} while ${aw16} is CONSUMED by ${s24}"
            - "Trigger call 1 returns 201 with ScriptAssignment.${a14}.room_seat_id == ${s23} - the earliest confirmed_at wins over the seat with more guarantee slots"
            - "Trigger call 1 also shows guarantee_slot_applied == true against ${s23}: RoomSeat.${s23}.guarantee_slots_consumed == 1 and RoomSeat.${s24}.guarantee_slots_consumed == 0"
            - "After trigger call 2: ScriptAssignment.${a14}.status == REASSIGNMENT_PENDING and room_seat_id is STILL ${s23} - the selector does not re-run on release"
            - "Trigger call 4 returns 201 with ScriptAssignment.${a15}.room_seat_id == ${s24}: the candidate set is now a single seat"
            - "Trigger call 7 returns 422 ERR_WRITER_NOT_STAFFED once both seats are RELEASED - the empty candidate set is a business refusal, not a null room_seat_id"
            - "Writer.${w1}.active_seat_count == 2 before trigger call 2, 1 after it and 0 after trigger call 5"

      - name: n_level_cascade_from_a_season_reschedule
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - endpoints.POST_/seasons/{season_id}/reschedule
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_a_season_reschedule_propagates_to_milestone_lateness_and_back
          rationale: "That §1.8 instance walks CASCADE A end to end - season date, episode dates, milestone due dates, PENDING<->LATE flips and late_milestone_count - and back again on a second reschedule."

      - name: n_level_cascade_from_a_seat_release
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - endpoints.POST_/room-seats/{seat_id}/release
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_b_seat_release_reaches_availability_window_assignment_room_and_season
          rationale: "That §1.8 instance asserts every link of CASCADE B (window, assignment, episode readiness, room counters, season coverage) in one release call."

      - name: both_guarantee_modes_produce_their_own_settlement
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.guarantee_settlement
        excluded_because:
          difficulty_instance: dual_variant_calc / guarantee_forward_commit_awards_slot_to_earliest_created_assignment
          rationale: "That §1.8 instance and its CHRONOLOGICAL_ON_ACCEPTANCE sibling run identical data through both variants and assert the divergent slot award and the GUARANTEE_REALLOCATION delta."

      - name: the_credit_variant_delta_is_applied_when_the_arbitration_supersedes_the_claims
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.credit_share_determination
        excluded_because:
          difficulty_instance: dual_variant_calc / credit_shares_diverge_between_provisional_claim_split_and_arbitrated_panel_mean
          rationale: "That §1.8 instance asserts the provisional claim-normalised shares, the arbitrated panel-mean shares and the reconciliation that rewrites the episode's final shares."

  - section: consistency_model
    instances:
      - name: every_derived_field_is_already_correct_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.season_staffing_commitment
          - calculations.script_coverage_index
          - calculations.season_script_fee_commitment
          - response_envelope
        distinguishing_aspect: |
          The model is immediate, so no read-after-write is ever required: the body of the seat-acceptance
          call already carries the seat's final derived compensation, and a GET of the room, the season and
          the writer taken immediately afterwards returns figures identical to those the write's own
          response implied - with no intermediate state in which the seat is CONFIRMED but the season
          commitment still reads the pre-acceptance value.
        test_recipe:
          setup:
            - "Room RM is in STAFFING with OFFERED seat S1 for W1 (STORY_EDITOR, 600000, guarantee 1) and season SE has commitment 200000."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_SE
            - *C_AW1
            - *C_RM
            - *C_OPEN
            - *C_S1
          trigger:
            - *C_ACC1
            - call: "GET /rooms/${rm}"
              payload: {}
              as: StudioExecutive
            - call: "GET /seasons/${se}"
              payload: {}
              as: StudioExecutive
            - call: "GET /writers/${w1}"
              payload: {}
              as: StudioExecutive
            - call: "GET /availability-windows/${aw1}"
              payload: {}
              as: StudioExecutive
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - call: "GET /fee-ledger-entries?season_id=${se}"
              payload: {}
              as: StudioExecutive
          assert:
            - "Trigger call 1's own 200 body already carries RoomSeat.${s1}.status == CONFIRMED, confirmed_at == 2026-08-01T00:00:00Z, weekly_compensation_cents == 600000, prorated_commitment_cents == 15514284, guarantee_slots_remaining == 1 and consumed_window_id == ${aw1}"
            - "Trigger call 2 returns weekly_burn_cents == 800000 and confirmed_seat_count == 1 - the same figures implied by trigger call 1, with no lag"
            - "Trigger call 3 returns staffing_commitment_weekly_cents == 800000 immediately, and trigger call 4 returns Writer.${w1}.active_seat_count == 1"
            - "Trigger call 5 returns AvailabilityWindow.${aw1}.status == CONSUMED with consumed_by_seat_id == ${s1} in the very next read after the acceptance"
            - "Trigger call 8's own 201 body already carries gross_fee_cents == 3500000, guarantee_offset_cents == 1750000 and payable_fee_cents == 1750000, and trigger call 9 already lists both ledger rows (total_count == 2) summing to 1750000"
            - "Every response in the sequence uses the envelope { data: ... } on success with no meta/pagination keys on single-resource reads, and { data: [...], total_count, has_more } on the list read"
