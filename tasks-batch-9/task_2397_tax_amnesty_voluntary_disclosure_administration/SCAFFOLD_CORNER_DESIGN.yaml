              captures: { ret_id: $.data.id }
            - call: "POST /amnesty/returns/${ret_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /amnesty/agreements/${agr_id}/certify-compliance"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "auditor-one"
              captures: { err_not_settled: $.data.error_id }
