# =============================================================================
# PRD Benchmark Scaffold — Mobile Car Wash & Fleet Washing Service
# =============================================================================

scenario: |
  Mobile Car Wash & Fleet Washing Service (mobile detailing/fleet wash operator): route/stop scheduling by lot & fleet size, water reclamation & discharge compliance at customer sites, per-vehicle pricing tier & fleet contract minimums, technician crew & equipment van inventory, weather rescheduling & freeze policy, damage claim & pre-existing condition documentation, recurring subscription & pause handling, quality audit & re-wash guarantee

domain_name: mobile-car-wash-fleet-washing
api_prefix: /fleet-wash

complexity_profile:
  primary_archetype: temporal_windowing        # route/stop scheduling, site service windows, guarantee windows
  secondary_archetype: compliance_audit        # water reclamation/discharge rules, damage claims, quality audits
  complexity_layers:
    - optimistic_concurrency                   # OCC on Route / WashOrder / FleetContract versions
    - cascading_side_effects                   # weather freeze cascade; compliance incident cascade; rewash cascade
    - dual_variant_calculation                 # quote vs final pricing; projection vs final invoicing
    - rate_threshold_triggers                  # freeze 32F, rain 60%, audit 80, pause 90d/2-count, 72h windows
  entity_topology: flat                        # peer entities joined by FK references; no nested ownership in URLs
  state_machine_shape: cyclic                  # weather-hold loop, subscription pause loop, invoice dispute loop, rewash loop
  relationship_patterns:
    - one_to_many
    - many_to_many                             # RouteStop junction between Route and WashOrder
    - self_referential                         # WashOrder.rewash_of_id
    - cross_aggregate                          # Invoice lines drawn from WashOrder; DamageClaim vs InspectionReport
  role_model: segregation_of_duties            # claim approver cannot mark the same claim paid; peer roles elsewhere
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer display name" }
      - { name: customer_type, type: enum, source: input, description: "RETAIL | FLEET", default: RETAIL, constraints: "enum {RETAIL, FLEET}; default RETAIL" }
      - { name: email, type: string, source: input, description: "Contact email; unique across customers" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE, constraints: "enum {ACTIVE, SUSPENDED}; initialized ACTIVE" }

  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owner of this lot" }
      - { name: name, type: string, source: input, description: "Site display name" }
      - { name: lot_size_sqft, type: integer, source: input, description: "Paved lot area in sqft; drives setup minutes", constraints: "> 0" }
      - { name: containment_type, type: enum, source: input, description: "NONE | BERMS | RECLAIM_MAT | VACUUM_RECOVERY", constraints: "enum {NONE, BERMS, RECLAIM_MAT, VACUUM_RECOVERY}" }
      - { name: water_reclaim_required, type: boolean, source: input, description: "True when local ordinance requires reclamation at this site" }
      - { name: max_discharge_gal, type: number, source: input, description: "Maximum permitted discharge gallons per wash order at this site", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE, constraints: "enum {ACTIVE, SUSPENDED}; initialized ACTIVE" }
      - { name: suspension_reason, type: enum, source: system, description: "MANUAL | COMPLIANCE_INCIDENT; set when suspended", constraints: "enum {MANUAL, COMPLIANCE_INCIDENT}; null when ACTIVE" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; home lot where this vehicle is usually washed" }
      - { name: plate, type: string, source: input, description: "License plate; unique across vehicles" }
      - { name: vehicle_class, type: enum, source: input, description: "SEDAN | SUV_PICKUP | VAN_BOXTRUCK | HEAVY_FLEET; drives pricing tier, service minutes, gallons", constraints: "enum {SEDAN, SUV_PICKUP, VAN_BOXTRUCK, HEAVY_FLEET}" }

  - name: Van
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Van call sign" }
      - { name: tank_capacity_gal, type: number, source: input, description: "Fresh water tank capacity in gallons", constraints: "> 0" }
      - { name: reclaim_system, type: enum, source: input, description: "NONE | BASIC | ADVANCED; recovery rate 0.00 / 0.60 / 0.85", constraints: "enum {NONE, BASIC, ADVANCED}" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | MAINTENANCE", default: AVAILABLE, constraints: "enum {AVAILABLE, MAINTENANCE}; initialized AVAILABLE" }
      - { name: water_loaded_gal, type: number, source: system, description: "Current gallons in tank; set by LOAD_WATER; never negative", default: 0 }
      - { name: water_reserved_gal, type: number, source: system, description: "Gallons reserved by non-terminal route stops; released on stop cancel/skip/complete", default: 0 }
      - { name: water_used_gal, type: number, source: system, description: "Gallons drawn by completed stops since last LOAD_WATER", default: 0 }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Technician name" }
      - { name: water_reclaim_certified, type: boolean, source: input, description: "Certified to operate ADVANCED reclaim systems", default: false }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: ACTIVE, constraints: "enum {ACTIVE, INACTIVE}; initialized ACTIVE" }

  - name: FleetContract
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; must reference a FLEET customer" }
      - { name: start_date, type: string, source: input, description: "Contract start date YYYY-MM-DD" }
      - { name: end_date, type: string, source: input, description: "Contract end date YYYY-MM-DD; after start_date" }
      - { name: monthly_minimum_cents, type: integer, source: input, description: "Monthly minimum billing commitment in cents", constraints: ">= 0" }
      - { name: sedan_rate_cents, type: integer, source: input, description: "Contract per-wash rate for SEDAN", constraints: "> 0" }
      - { name: suv_pickup_rate_cents, type: integer, source: input, description: "Contract per-wash rate for SUV_PICKUP", constraints: "> 0" }
      - { name: van_boxtruck_rate_cents, type: integer, source: input, description: "Contract per-wash rate for VAN_BOXTRUCK", constraints: "> 0" }
      - { name: heavy_fleet_rate_cents, type: integer, source: input, description: "Contract per-wash rate for HEAVY_FLEET", constraints: "> 0" }
      - { name: loyalty_credit_pct, type: number, source: input, description: "Per-order loyalty credit fraction, e.g. 0.025", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | TERMINATED", default: DRAFT, constraints: "enum {DRAFT, ACTIVE, SUSPENDED, TERMINATED}; initialized DRAFT" }
      - { name: early_termination_fee_cents, type: integer, source: system, description: "Computed on early TERMINATE; null until terminated", constraints: "null until status == TERMINATED" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; subscriber" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; subscribed vehicle (one ACTIVE/PAUSED subscription per vehicle)" }
      - { name: cadence, type: enum, source: input, description: "WEEKLY | BIWEEKLY | MONTHLY", constraints: "enum {WEEKLY, BIWEEKLY, MONTHLY}" }
      - { name: next_service_date, type: string, source: input, description: "Next scheduled service date YYYY-MM-DD; extended by pause days on RESUME" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED | CANCELLED", default: ACTIVE, constraints: "enum {ACTIVE, PAUSED, CANCELLED}; initialized ACTIVE" }
      - { name: pauses, type: array, source: system, description: "Append-only list of pause records {started_at, ended_at, days}; open pause has ended_at null", default: [] }
      - { name: pause_count_365d, type: integer, source: computed, description: "Count of pauses whose started_at falls in the trailing 365 days from the logical clock" }
      - { name: paused_days_365d, type: integer, source: computed, description: "Sum of days over pauses in the trailing 365 days (open pause counted through the logical clock date)" }

  - name: WashOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; booking customer" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; service location" }
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; optional subscription billing link", constraints: "optional; when present the subscription must cover one of vehicle_ids" }
      - { name: vehicle_ids, type: array, source: input, description: "Ordered list of FK -> Vehicle.id to be washed", constraints: "non-empty; every vehicle must belong to customer_id" }
      - { name: scheduled_window_start, type: datetime, source: input, description: "Planned service window start (ISO 8601 UTC)" }
      - { name: scheduled_window_end, type: datetime, source: input, description: "Planned service window end (ISO 8601 UTC); strictly after start" }
      - { name: requires_inspection, type: boolean, source: input, description: "When true, START requires a SUBMITTED InspectionReport", default: false }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | ASSIGNED | IN_PROGRESS | COMPLETED | REWASH_PENDING | CLOSED | WEATHER_HELD | CANCELLED", constraints: "lifecycle enum; initialized DRAFT" }
      - { name: billing_status, type: enum, source: system, description: "UNBILLED | INVOICED | PAID | WAIVED; independent billing dimension on the same row", constraints: "initialized UNBILLED; WAIVED for rewash orders" }
      - { name: vehicle_count, type: integer, source: computed, description: "len(vehicle_ids)" }
      - { name: quote_cents, type: integer, source: computed, description: "QUOTED_AT_BOOKING variant of wash_quote_cents over vehicle_ids; 0 for rewash orders" }
      - { name: final_cents, type: integer, source: computed, description: "FINAL_AT_COMPLETION variant of wash_quote_cents over vehicles_washed_ids; set on COMPLETE; null before" }
      - { name: vehicles_washed_ids, type: array, source: system, description: "Subset of vehicle_ids actually washed; set on COMPLETE" }
      - { name: rewash_of_id, type: string, source: system, description: "FK -> WashOrder.id; set on rewash orders; null otherwise", constraints: "optional; self-reference" }
      - { name: is_rewash, type: boolean, source: computed, description: "true iff rewash_of_id is not null" }
      - { name: hold_reason, type: enum, source: system, description: "WEATHER_FREEZE; set when WEATHER_HELD", constraints: "enum {WEATHER_FREEZE}; null otherwise" }
      - { name: held_at, type: datetime, source: system, description: "Logical-clock timestamp when the order entered WEATHER_HELD", constraints: "serialized ISO 8601 UTC with three fractional digits" }
      - { name: cancel_reason, type: enum, source: system, description: "CUSTOMER_REQUEST | DISPATCH | SITE_SUSPENDED | NO_SHOW | WEATHER_EXPIRED", constraints: "enum {CUSTOMER_REQUEST, DISPATCH, SITE_SUSPENDED, NO_SHOW, WEATHER_EXPIRED}; null unless CANCELLED" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of COMPLETE", constraints: "serialized ISO 8601 UTC with three fractional digits" }

  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: route_date, type: string, source: input, description: "Service date YYYY-MM-DD" }
      - { name: shift_start_at, type: datetime, source: input, description: "First stop's planned start; defaults to route_dateT08:00:00Z when omitted", constraints: "optional; must fall on route_date" }
      - { name: van_id, type: string, source: input, description: "FK -> Van.id; assigned equipment van" }
      - { name: lead_technician_id, type: string, source: input, description: "FK -> Technician.id; lead crew member" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | LOCKED | COMPLETED | CANCELLED", default: DRAFT, constraints: "enum {DRAFT, PUBLISHED, LOCKED, COMPLETED, CANCELLED}; initialized DRAFT" }
      - { name: cancel_reason, type: enum, source: system, description: "DISPATCH | WEATHER_FREEZE", constraints: "enum {DISPATCH, WEATHER_FREEZE}; null unless CANCELLED" }
      - { name: assigned_vehicle_count, type: integer, source: computed, description: "Sum of vehicle_count over orders whose stop is in {PLANNED, ARRIVED, DONE} on this route" }
      - { name: reserved_water_gal, type: number, source: computed, description: "Sum of reserved_water_gal over stops in {PLANNED, ARRIVED}" }

  - name: RouteStop
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id; owning route (path)" }
      - { name: wash_order_id, type: string, source: input, description: "FK -> WashOrder.id; the order served at this stop" }
      - { name: sequence, type: integer, source: system, description: "1-based append order within the route" }
      - { name: planned_start_at, type: datetime, source: computed, description: "First stop: route shift_start_at (default route_date 08:00:00Z); later stops: previous stop planned_end_at + 20 minutes", constraints: "serialized ISO 8601 UTC with three fractional digits" }
      - { name: planned_end_at, type: datetime, source: computed, description: "planned_start_at + lot setup minutes + per-vehicle service minutes", constraints: "serialized ISO 8601 UTC with three fractional digits" }
      - { name: status, type: enum, source: system, description: "PLANNED | ARRIVED | DONE | SKIPPED | CANCELLED", default: PLANNED, constraints: "enum {PLANNED, ARRIVED, DONE, SKIPPED, CANCELLED}; initialized PLANNED" }
      - { name: reserved_water_gal, type: number, source: computed, description: "Projected net draw for the order on this route's van: gross gallons x (1 - van recovery)" }

  - name: InspectionReport
    parent: null
    common_fields: true
    fields:
      - { name: wash_order_id, type: string, source: input, description: "FK -> WashOrder.id; order being inspected" }
      - { name: technician_id, type: string, source: system, description: "FK -> Technician.id; taken from X-User-ID of the filing Technician" }
      - { name: areas, type: array, source: input, description: "List of {area, pre_existing_damage, notes}; area in {EXTERIOR_BODY, GLASS, WHEELS, INTERIOR, TRIM}; each area at most once", constraints: "non-empty list; unique areas" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED", default: DRAFT, constraints: "enum {DRAFT, SUBMITTED}; initialized DRAFT; SUBMITTED is immutable" }

  - name: QualityAudit
    parent: null
    common_fields: false
    fields:
      - { name: wash_order_id, type: string, source: input, description: "FK -> WashOrder.id; audited order (must be COMPLETED)" }
      - { name: auditor_id, type: string, source: system, description: "Opaque X-User-ID of the QualityAuditor" }
      - { name: exterior_score, type: integer, source: input, description: "0..20" , constraints: "0 <= score <= 20" }
      - { name: wheels_score, type: integer, source: input, description: "0..20", constraints: "0 <= score <= 20" }
      - { name: glass_score, type: integer, source: input, description: "0..20", constraints: "0 <= score <= 20" }
      - { name: trim_score, type: integer, source: input, description: "0..20", constraints: "0 <= score <= 20" }
      - { name: water_spotting_score, type: integer, source: input, description: "0..20", constraints: "0 <= score <= 20" }
      - { name: total_score, type: integer, source: computed, description: "Sum of the five category scores (0..100)" }
      - { name: result, type: enum, source: computed, description: "PASS when total_score >= 80 else FAIL", constraints: "enum {PASS, FAIL}" }

  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - { name: wash_order_id, type: string, source: input, description: "FK -> WashOrder.id; order the claim refers to (must be COMPLETED)" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; copied from the wash order" }
      - { name: area, type: enum, source: input, description: "EXTERIOR_BODY | GLASS | WHEELS | INTERIOR | TRIM", constraints: "enum {EXTERIOR_BODY, GLASS, WHEELS, INTERIOR, TRIM}" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount claimed in cents", constraints: "> 0" }
      - { name: description, type: string, source: input, description: "Free-text damage description" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | APPROVED | DENIED | PAID", default: FILED, constraints: "enum {FILED, UNDER_REVIEW, APPROVED, DENIED, PAID}; initialized FILED" }
      - { name: approved_amount_cents, type: integer, source: system, description: "min(claimed_amount_cents, class cap) unless a lower explicit amount given; null until APPROVED" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp at filing", constraints: "serialized ISO 8601 UTC with three fractional digits" }
      - { name: reviewed_by, type: string, source: system, description: "Opaque X-User-ID of the QualityAuditor who approved or denied" }
      - { name: paid_by, type: string, source: system, description: "Opaque X-User-ID of the QualityAuditor who marked paid; must differ from reviewed_by" }
      - { name: deny_reason, type: string, source: system, description: "Reason recorded on DENY" }

  - name: ComplianceIncident
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; site where the incident occurred" }
      - { name: wash_order_id, type: string, source: input, description: "FK -> WashOrder.id; optional related order", constraints: "optional" }
      - { name: incident_type, type: enum, source: input, description: "DISCHARGE_TO_STORM_DRAIN | CONTAINMENT_FAILURE | RECLAIM_EQUIPMENT_FAILURE | SPILL", constraints: "enum {DISCHARGE_TO_STORM_DRAIN, CONTAINMENT_FAILURE, RECLAIM_EQUIPMENT_FAILURE, SPILL}" }
      - { name: notes, type: string, source: input, description: "Free-text incident notes" }
      - { name: status, type: enum, source: system, description: "REPORTED | UNDER_REVIEW | CONFIRMED | DISMISSED | RESOLVED", default: REPORTED, constraints: "enum {REPORTED, UNDER_REVIEW, CONFIRMED, DISMISSED, RESOLVED}; initialized REPORTED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: fleet_contract_id, type: string, source: input, description: "FK -> FleetContract.id; billed contract" }
      - { name: period_month, type: string, source: input, description: "Billing period YYYY-MM" }
      - { name: variant, type: enum, source: input, description: "PROJECTION | FINAL", constraints: "enum {PROJECTION, FINAL}" }
      - { name: status, type: enum, source: system, description: "PREVIEW | DRAFT | ISSUED | PAID | DISPUTED | VOID", constraints: "enum {PREVIEW, DRAFT, ISSUED, PAID, DISPUTED, VOID}; PROJECTION generates PREVIEW, FINAL generates DRAFT" }
      - { name: line_count, type: integer, source: computed, description: "Number of wash-order lines included" }
      - { name: charges_cents, type: integer, source: computed, description: "Sum of per-order charges (each rounded half-up per line)" }
      - { name: loyalty_credits_cents, type: integer, source: computed, description: "Sum of per-line loyalty credits (each rounded half-up per line)" }
      - { name: minimum_applied, type: boolean, source: computed, description: "True when charges minus loyalty credits fell below monthly_minimum_cents" }
      - { name: billed_cents, type: integer, source: computed, description: "max(charges_cents - loyalty_credits_cents, monthly_minimum_cents)" }
      - { name: claim_credits_cents, type: integer, source: computed, description: "PAID damage-claim credits applied, capped at 25% of billed_cents (round_half_up)" }
      - { name: net_due_cents, type: integer, source: computed, description: "billed_cents - claim_credits_cents" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /fleet-wash/customers/{id}/events (SUSPEND)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["No cascade to existing orders or subscriptions; only new booking/subscription creation is blocked (ERR_CUSTOMER_SUSPENDED)"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /fleet-wash/customers/{id}/events (REACTIVATE)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: Site
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /fleet-wash/sites/{id}/events (SUSPEND) or system (ComplianceIncident CONFIRMED)"
        actor: "ComplianceOfficer | system"
        preconditions: []
        side_effects:
          - "suspension_reason = MANUAL (officer) or COMPLIANCE_INCIDENT (system)"
          - "Every WashOrder at this site with status IN {SCHEDULED, ASSIGNED} -> CANCELLED with cancel_reason=SITE_SUSPENDED"
          - "Each such ASSIGNED order's RouteStop -> CANCELLED; stop reserved_water_gal released from the route's van (Van.water_reserved_gal decreases); Route.assigned_vehicle_count and Route.reserved_water_gal recomputed"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /fleet-wash/sites/{id}/events (REINSTATE) or system (ComplianceIncident RESOLVED with no remaining CONFIRMED incidents at this site)"
        actor: "ComplianceOfficer | system"
        preconditions:
          - "No ComplianceIncident at this site with status CONFIRMED (ERR_OPEN_COMPLIANCE_INCIDENT otherwise)"
        side_effects: ["suspension_reason cleared"]

  - entity: Van
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /fleet-wash/vans/{id}/events (MAINTENANCE_START)"
        actor: Dispatcher
        preconditions:
          - "No Route with this van_id and status IN {DRAFT, PUBLISHED, LOCKED} (ERR_VAN_ROUTE_CONFLICT)"
        side_effects: []
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /fleet-wash/vans/{id}/events (MAINTENANCE_END)"
        actor: Dispatcher
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: AVAILABLE
        trigger: "POST /fleet-wash/vans/{id}/events (LOAD_WATER)"
        actor: Dispatcher
        preconditions:
          - "gallons <= tank_capacity_gal (ERR_VALIDATION)"
          - "No Route with this van_id and status IN {PUBLISHED, LOCKED} (ERR_VAN_ROUTE_CONFLICT)"
        side_effects:
          - "water_loaded_gal = gallons; water_reserved_gal = 0; water_used_gal = 0"
          - "increments Van.version by 1"

  - entity: Technician
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /fleet-wash/technicians/{id}/events (DEACTIVATE)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["Existing routes keep their lead; only new route creation is blocked (ERR_TECHNICIAN_NOT_ACTIVE)"]
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /fleet-wash/technicians/{id}/events (REACTIVATE)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /fleet-wash/technicians/{id}/events (CERTIFY_RECLAIM)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["water_reclaim_certified = true"]

  - entity: FleetContract
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /fleet-wash/fleet-contracts/{id}/events (ACTIVATE)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["increments FleetContract.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /fleet-wash/fleet-contracts/{id}/events (SUSPEND)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["increments FleetContract.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /fleet-wash/fleet-contracts/{id}/events (REINSTATE)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["increments FleetContract.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /fleet-wash/fleet-contracts/{id}/events (TERMINATE)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "early_termination_fee_cents computed via early_termination_fee (0 when logical clock date >= end_date)"
          - "increments FleetContract.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /fleet-wash/fleet-contracts/{id}/events (TERMINATE)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "early_termination_fee_cents computed via early_termination_fee (0 when logical clock date >= end_date)"
          - "increments FleetContract.version by 1"
      - from: "DRAFT | ACTIVE"
        to: "DRAFT | ACTIVE"
        trigger: "PUT /fleet-wash/fleet-contracts/{id} (amend rates/minimum; state unchanged)"
        actor: PlatformAdmin
        preconditions:
          - "status IN {DRAFT, ACTIVE} (ERR_INVALID_STATE otherwise)"
          - "expected_fleet_contract_version equals current version (ERR_STALE_VERSION)"
        side_effects: ["increments FleetContract.version by 1"]

  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /fleet-wash/subscriptions/{id}/events (PAUSE)"
        actor: "Customer (owner) | PlatformAdmin"
        preconditions:
          - "pause_count_365d < 2 (ERR_PAUSE_LIMIT_EXCEEDED)"
          - "7 <= pause_days AND paused_days_365d + pause_days <= 90 (ERR_PAUSE_DURATION_EXCEEDED)"
        side_effects:
          - "Appends open pause record {started_at: logical clock, ended_at: null, days: pause_days}"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /fleet-wash/subscriptions/{id}/events (RESUME)"
        actor: "Customer (owner) | PlatformAdmin"
        preconditions: []
        side_effects:
          - "Closes the open pause record with ended_at = logical clock date and days = clock_date - started_at"
          - "next_service_date += paused days of the closed record (chronological extension)"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /fleet-wash/subscriptions/{id}/events (CANCEL)"
        actor: "Customer (owner) | PlatformAdmin"
        preconditions: []
        side_effects: []
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /fleet-wash/subscriptions/{id}/events (CANCEL)"
        actor: "Customer (owner) | PlatformAdmin"
        preconditions: []
        side_effects: ["Closes the open pause record with ended_at = logical clock date and days = clock_date - started_at"]

  - entity: WashOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /fleet-wash/wash-orders/{id}/events (CONFIRM)"
        actor: "Customer (owner) | Dispatcher"
        preconditions:
          - "Customer.status == ACTIVE (ERR_CUSTOMER_SUSPENDED)"
          - "Site.status == ACTIVE (ERR_SITE_SUSPENDED)"
          - "If subscription_id present: Subscription.status == ACTIVE (ERR_SUBSCRIPTION_NOT_ACTIVE)"
          - "If customer is FLEET with a FleetContract: a FleetContract with status == ACTIVE exists for customer_id (ERR_CONTRACT_NOT_ACTIVE)"
          - "Site containment: NOT (site.water_reclaim_required AND site.containment_type == NONE) (ERR_CONTAINMENT_REQUIRED)"
          - "Site window: half-open [scheduled_window_start, scheduled_window_end) must not overlap any other order at this site with status IN {SCHEDULED, ASSIGNED, IN_PROGRESS} (ERR_SITE_WINDOW_CONFLICT)"
        side_effects: ["increments WashOrder.version by 1"]
      - from: SCHEDULED
        to: ASSIGNED
        trigger: "system (POST /fleet-wash/routes/{route_id}/stops adds this order)"
        actor: system
        preconditions: []
        side_effects: ["increments WashOrder.version by 1"]
      - from: ASSIGNED
        to: SCHEDULED
        trigger: "system (RouteStop REMOVE, or route CANCEL with cancel_reason=DISPATCH)"
        actor: system
        preconditions: []
        side_effects: ["increments WashOrder.version by 1"]
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /fleet-wash/wash-orders/{id}/events (START)"
        actor: "Technician (lead of the route holding this order's stop)"
        preconditions:
          - "The order's non-CANCELLED RouteStop has status == ARRIVED (ERR_INVALID_STATE otherwise)"
          - "Site.status == ACTIVE (ERR_SITE_SUSPENDED)"
          - "If requires_inspection: a SUBMITTED InspectionReport exists for this order (ERR_INSPECTION_REQUIRED)"
        side_effects: ["increments WashOrder.version by 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /fleet-wash/wash-orders/{id}/events (COMPLETE)"
        actor: "Technician (lead of the route holding this order's stop)"
        preconditions:
          - "vehicles_washed_ids is a non-empty subset of vehicle_ids (ERR_VALIDATION)"
        side_effects:
          - "final_cents = FINAL_AT_COMPLETION variant of wash_quote_cents over vehicles_washed_ids"
          - "completed_at = logical clock"
          - "RouteStop -> DONE; its reserved_water_gal released from Van.water_reserved_gal; Van.water_used_gal += actual net draw (gross gallons of vehicles_washed_ids x (1 - van recovery))"
          - "Route.assigned_vehicle_count and Route.reserved_water_gal recomputed"
          - "If this order is a rewash (rewash_of_id set): the original order transitions REWASH_PENDING -> CLOSED"
          - "increments WashOrder.version by 1"
      - from: SCHEDULED
        to: WEATHER_HELD
        trigger: "system (weather evaluation freeze on the order's scheduled date) or POST /fleet-wash/wash-orders/{id}/events (WEATHER_HOLD)"
        actor: "system | Dispatcher"
        preconditions: []
        side_effects: ["hold_reason=WEATHER_FREEZE; held_at = logical clock"]
      - from: ASSIGNED
        to: WEATHER_HELD
        trigger: "system (weather evaluation freeze: route -> CANCELLED -> stop -> CANCELLED -> order)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_reason=WEATHER_FREEZE; held_at = logical clock"
          - "The order's RouteStop -> CANCELLED and its reserved water is released from the van before this transition lands"
      - from: WEATHER_HELD
        to: SCHEDULED
        trigger: "POST /fleet-wash/wash-orders/{id}/reschedule"
        actor: "Customer (owner) | Dispatcher"
        preconditions:
          - "Logical clock date <= held_at date + 14 days (ERR_RESCHEDULE_WINDOW_EXPIRED)"
          - "New window does not overlap another order at this site with status IN {SCHEDULED, ASSIGNED, IN_PROGRESS} (ERR_SITE_WINDOW_CONFLICT)"
          - "expected_wash_order_version equals current version (ERR_STALE_VERSION)"
        side_effects:
          - "scheduled_window_start/end replaced; hold_reason and held_at cleared"
          - "increments WashOrder.version by 1"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /fleet-wash/wash-orders/{id}/reschedule"
        actor: "Customer (owner) | Dispatcher"
        preconditions:
          - "New window does not overlap another order at this site with status IN {SCHEDULED, ASSIGNED, IN_PROGRESS} (ERR_SITE_WINDOW_CONFLICT)"
          - "expected_wash_order_version equals current version (ERR_STALE_VERSION)"
        side_effects:
          - "scheduled_window_start/end replaced"
          - "increments WashOrder.version by 1"
      - from: COMPLETED
        to: REWASH_PENDING
        trigger: "POST /fleet-wash/wash-orders/{id}/rewash or system (QualityAudit result == FAIL)"
        actor: "Customer (owner) | system"
        preconditions:
          - "Customer path: logical clock <= completed_at + 72 hours (ERR_REWASH_WINDOW_EXPIRED)"
          - "No other WashOrder with rewash_of_id == this id and status IN {DRAFT, SCHEDULED, ASSIGNED, IN_PROGRESS, WEATHER_HELD} (ERR_REWASH_IN_PROGRESS)"
        side_effects:
          - "Creates a new WashOrder: customer_id/site_id/vehicle_ids copied, rewash_of_id = this id, billing_status = WAIVED, quote_cents = 0, status = SCHEDULED, scheduled window = logical clock date + 1 day, 08:00:00Z-10:00:00Z"
          - "increments WashOrder.version by 1"
      - from: REWASH_PENDING
        to: CLOSED
        trigger: "system (linked rewash order COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REWASH_PENDING
        to: COMPLETED
        trigger: "system (linked rewash order CANCELLED before completion — compensating revert)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMPLETED
        to: CLOSED
        trigger: "system (POST /fleet-wash/ops/run-daily: completed_at <= clock - 72 hours and still COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WEATHER_HELD
        to: CANCELLED
        trigger: "POST /fleet-wash/wash-orders/{id}/events (CANCEL) or system (run-daily: held_at date + 14 days < clock date, cancel_reason=WEATHER_EXPIRED)"
        actor: "Customer (owner) | Dispatcher | system"
        preconditions: []
        side_effects: ["cancel_reason set by actor path"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /fleet-wash/wash-orders/{id}/events (CANCEL)"
        actor: "Customer (owner) | Dispatcher"
        preconditions: []
        side_effects: ["cancel_reason = CUSTOMER_REQUEST or DISPATCH"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /fleet-wash/wash-orders/{id}/events (CANCEL) or system (site suspended)"
        actor: "Customer (owner) | Dispatcher | system"
        preconditions: []
        side_effects: ["cancel_reason = CUSTOMER_REQUEST | DISPATCH | SITE_SUSPENDED"]
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /fleet-wash/wash-orders/{id}/events (CANCEL) or system (site suspended, or stop SKIPPED with cancel_reason=NO_SHOW)"
        actor: "Customer (owner) | Dispatcher | system"
        preconditions: []
        side_effects:
          - "The order's RouteStop -> CANCELLED; reserved water released from van; Route counters recomputed"
          - "If this order is a rewash: the original order transitions REWASH_PENDING -> COMPLETED (compensation)"
      - from: UNBILLED
        to: INVOICED
        trigger: "system (Invoice ISSUE includes this order as a line)"
        actor: system
        preconditions: []
        side_effects: []
        note: "billing_status dimension (UNBILLED | INVOICED | PAID | WAIVED) evolves independently of the lifecycle status on the same WashOrder row"
      - from: INVOICED
        to: PAID
        trigger: "system (Invoice MARK_PAID)"
        actor: system
        preconditions: []
        side_effects: []
      - from: INVOICED
        to: UNBILLED
        trigger: "system (Invoice VOID — compensating revert)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Route
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /fleet-wash/routes/{id}/events (PUBLISH)"
        actor: Dispatcher
        preconditions: []
        side_effects: ["increments Route.version by 1"]
      - from: PUBLISHED
        to: DRAFT
        trigger: "POST /fleet-wash/routes/{id}/events (UNPUBLISH)"
        actor: Dispatcher
        preconditions:
          - "No RouteStop on this route with status IN {ARRIVED, DONE} (ERR_INVALID_STATE)"
        side_effects: ["increments Route.version by 1"]
      - from: PUBLISHED
        to: LOCKED
        trigger: "POST /fleet-wash/routes/{id}/events (LOCK)"
        actor: Dispatcher
        preconditions: []
        side_effects: ["increments Route.version by 1"]
      - from: LOCKED
        to: COMPLETED
        trigger: "POST /fleet-wash/routes/{id}/events (COMPLETE)"
        actor: Dispatcher
        preconditions:
          - "Every RouteStop on this route has status IN {DONE, SKIPPED, CANCELLED} (ERR_INVALID_STATE)"
        side_effects: ["increments Route.version by 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /fleet-wash/routes/{id}/events (CANCEL) or system (weather freeze)"
        actor: "Dispatcher | system"
        preconditions: []
        side_effects:
          - "cancel_reason = DISPATCH (manual) or WEATHER_FREEZE (system)"
          - "RouteStops with status IN {PLANNED, ARRIVED} -> CANCELLED; reserved water released from van"
          - "Manual: orders of those stops ASSIGNED -> SCHEDULED. Weather: orders ASSIGNED -> WEATHER_HELD (hold_reason=WEATHER_FREEZE, held_at set)"
          - "increments Route.version by 1"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /fleet-wash/routes/{id}/events (CANCEL) or system (weather freeze)"
        actor: "Dispatcher | system"
        preconditions: []
        side_effects:
          - "cancel_reason = DISPATCH (manual) or WEATHER_FREEZE (system)"
          - "RouteStops with status IN {PLANNED, ARRIVED} -> CANCELLED; reserved water released from van"
          - "Manual: orders of those stops ASSIGNED -> SCHEDULED. Weather: orders ASSIGNED -> WEATHER_HELD (hold_reason=WEATHER_FREEZE, held_at set)"
          - "increments Route.version by 1"
      - from: LOCKED
        to: CANCELLED
        trigger: "POST /fleet-wash/routes/{id}/events (CANCEL) or system (weather freeze)"
        actor: "Dispatcher | system"
        preconditions: []
        side_effects:
          - "cancel_reason = DISPATCH (manual) or WEATHER_FREEZE (system)"
          - "RouteStops with status IN {PLANNED, ARRIVED} -> CANCELLED; reserved water released from van"
          - "Manual: orders of those stops ASSIGNED -> SCHEDULED. Weather: orders ASSIGNED -> WEATHER_HELD (hold_reason=WEATHER_FREEZE, held_at set)"
          - "increments Route.version by 1"

  - entity: RouteStop
    initial_state: PLANNED
    terminal_states: [DONE, SKIPPED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ARRIVED
        trigger: "POST /fleet-wash/routes/{route_id}/stops/{stop_id}/events (ARRIVE)"
        actor: "Technician (route lead)"
        preconditions:
          - "Route status IN {PUBLISHED, LOCKED} (ERR_ROUTE_LOCKED for DRAFT)"
        side_effects: []
      - from: PLANNED
        to: DONE
        trigger: "system (wash order COMPLETED)"
        actor: system
        preconditions: []
        side_effects: ["reserved_water_gal released from Van.water_reserved_gal; Van.water_used_gal += actual net draw; Route counters recomputed"]
      - from: ARRIVED
        to: DONE
        trigger: "system (wash order COMPLETED)"
        actor: system
        preconditions: []
        side_effects: ["reserved_water_gal released from Van.water_reserved_gal; Van.water_used_gal += actual net draw; Route counters recomputed"]
      - from: PLANNED
        to: SKIPPED
        trigger: "POST /fleet-wash/routes/{route_id}/stops/{stop_id}/events (SKIP)"
        actor: "Technician (route lead) | Dispatcher"
        preconditions: []
        side_effects: ["WashOrder ASSIGNED -> CANCELLED with cancel_reason=NO_SHOW; reserved water released; Route counters recomputed"]
      - from: ARRIVED
        to: SKIPPED
        trigger: "POST /fleet-wash/routes/{route_id}/stops/{stop_id}/events (SKIP)"
        actor: "Technician (route lead) | Dispatcher"
        preconditions: []
        side_effects: ["WashOrder -> CANCELLED with cancel_reason=NO_SHOW (from ASSIGNED or IN_PROGRESS); reserved water released; Route counters recomputed"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /fleet-wash/routes/{route_id}/stops/{stop_id}/events (REMOVE) or system (route cancelled, site suspended, order cancelled)"
        actor: "Dispatcher | system"
        preconditions:
          - "Manual REMOVE: Route status IN {DRAFT, PUBLISHED} (ERR_ROUTE_LOCKED)"
        side_effects: ["Manual REMOVE: WashOrder ASSIGNED -> SCHEDULED. System paths follow the triggering cascade. Reserved water released; Route counters recomputed"]

  - entity: InspectionReport
    initial_state: DRAFT
    terminal_states: [SUBMITTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /fleet-wash/inspection-reports/{id}/events (SUBMIT)"
        actor: "Technician (the report's technician_id)"
        preconditions:
          - "WashOrder status IN {SCHEDULED, ASSIGNED, IN_PROGRESS, COMPLETED, REWASH_PENDING} (ERR_INVALID_STATE); documentation may be finalized after the wash"
        side_effects: ["Report becomes immutable; blocks future DamageClaim APPROVE on any area flagged pre_existing_damage"]

  - entity: DamageClaim
    initial_state: FILED
    terminal_states: [DENIED, PAID]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /fleet-wash/damage-claims/{id}/events (START_REVIEW)"
        actor: QualityAuditor
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /fleet-wash/damage-claims/{id}/events (APPROVE)"
        actor: QualityAuditor
        preconditions:
          - "No SUBMITTED InspectionReport for this wash order flags the claimed area with pre_existing_damage == true (ERR_PRE_EXISTING_CONDITION_DOCUMENTED)"
          - "Explicit approved_amount_cents, when given, must be <= min(claimed_amount_cents, class cap) (ERR_CLAIM_CAP_EXCEEDED)"
        side_effects:
          - "approved_amount_cents = explicit value or min(claimed_amount_cents, cap by first vehicle's class: SEDAN 25000, SUV_PICKUP 30000, VAN_BOXTRUCK 40000, HEAVY_FLEET 60000)"
          - "reviewed_by = X-User-ID"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /fleet-wash/damage-claims/{id}/events (DENY)"
        actor: QualityAuditor
        preconditions: []
        side_effects: ["deny_reason set; reviewed_by = X-User-ID; no credit is created"]
      - from: APPROVED
        to: PAID
        trigger: "POST /fleet-wash/damage-claims/{id}/events (MARK_PAID)"
        actor: QualityAuditor
        preconditions:
          - "X-User-ID != reviewed_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["paid_by = X-User-ID; the claim becomes eligible for Invoice claim_credits in the wash order's completion period"]

  - entity: ComplianceIncident
    initial_state: REPORTED
    terminal_states: [DISMISSED, RESOLVED]
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /fleet-wash/compliance-incidents/{id}/events (START_REVIEW)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: CONFIRMED
        trigger: "POST /fleet-wash/compliance-incidents/{id}/events (CONFIRM)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Site -> SUSPENDED with suspension_reason=COMPLIANCE_INCIDENT (cascades to orders, stops, route counters, van water per Site state machine)"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /fleet-wash/compliance-incidents/{id}/events (DISMISS)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: RESOLVED
        trigger: "POST /fleet-wash/compliance-incidents/{id}/events (RESOLVE)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "If no other ComplianceIncident at this site has status CONFIRMED: Site -> ACTIVE, suspension_reason cleared"

  - entity: Invoice
    initial_state: "PREVIEW (variant=PROJECTION) or DRAFT (variant=FINAL)"
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /fleet-wash/invoices/{id}/events (ISSUE)"
        actor: Dispatcher
        preconditions:
          - "variant == FINAL (ERR_INVALID_STATE for PREVIEW)"
        side_effects: ["Every included WashOrder with billing_status == UNBILLED -> INVOICED"]
      - from: ISSUED
        to: PAID
        trigger: "POST /fleet-wash/invoices/{id}/events (MARK_PAID)"
        actor: Dispatcher
        preconditions: []
        side_effects: ["Every included WashOrder with billing_status == INVOICED -> PAID"]
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /fleet-wash/invoices/{id}/events (DISPUTE)"
        actor: "Customer (the contract's customer) | Dispatcher"
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: VOID
        trigger: "POST /fleet-wash/invoices/{id}/events (VOID)"
        actor: Dispatcher
        preconditions: []
        side_effects: ["Every included WashOrder with billing_status == INVOICED -> UNBILLED (compensating revert)"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: route-stop-add-stale-route
    parent_entity: Route
    write_endpoint: "POST /fleet-wash/routes/{id}/stops"
    occ_field: "expected_route_version"
    description: |
      Adding a stop to a Route whose version has advanced since the client last
      observed it is rejected. Stop planning (sequence, planned windows, water
      reservation) is derived from the route's stop list at observation time, so
      a plan built on a stale version must not land. The check is a stale-version
      comparison on Route.version, deterministic across two ordered requests.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: wash-order-reschedule-stale-order
    parent_entity: WashOrder
    write_endpoint: "POST /fleet-wash/wash-orders/{id}/reschedule"
    occ_field: "expected_wash_order_version"
    description: |
      Rescheduling a WashOrder whose version has advanced since the client last
      observed it is rejected; the client's chosen window was validated against
      the observed record and must not overwrite a newer one. Resolved purely as
      a stale-version check on WashOrder.version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: fleet-contract-amend-stale-contract
    parent_entity: FleetContract
    write_endpoint: "PUT /fleet-wash/fleet-contracts/{id}"
    occ_field: "expected_fleet_contract_version"
    description: |
      Amending a FleetContract whose version has advanced since the client last
      observed it is rejected, because the new rate card supersedes whatever
      terms the client read. Resolved purely as a stale-version check on
      FleetContract.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: wash_quote_cents
    trigger: "WashOrder creation (QUOTED_AT_BOOKING over vehicle_ids) and WashOrder COMPLETE (FINAL_AT_COMPLETION over vehicles_washed_ids)"
    algorithm: tiered_pricing
    formula: |
      rate(c) = contract rate card of the customer's ACTIVE FleetContract when one exists,
                else retail card {SEDAN 3500, SUV_PICKUP 4500, VAN_BOXTRUCK 7000, HEAVY_FLEET 12000}.
      Evaluation order is pinned:
        1. subtotal_cents = SUM(rate(vehicle_class) for each vehicle in the input set)
        2. discount_pct(n) = 0.15 if n >= 20; 0.10 if n >= 10; 0.05 if n >= 5; else 0.00
           where n = number of vehicles in the input set
        3. discount_cents = round_half_up(subtotal_cents * discount_pct(n))
        4. after_discount_cents = subtotal_cents - discount_cents
        5. reclaim_surcharge_cents = round_half_up(after_discount_cents * 0.08)
                                     if site.water_reclaim_required else 0
        6. total_cents = after_discount_cents + reclaim_surcharge_cents
      Rewash orders (is_rewash) always price 0 regardless of this formula.
    input_set: "QUOTED_AT_BOOKING: all vehicles in vehicle_ids. FINAL_AT_COMPLETION: only vehicles in vehicles_washed_ids (subset, may change n and therefore the discount tier)."
    constants:
      RETAIL_SEDAN_CENTS: 3500
      RETAIL_SUV_PICKUP_CENTS: 4500
      RETAIL_VAN_BOXTRUCK_CENTS: 7000
      RETAIL_HEAVY_FLEET_CENTS: 12000
      DISCOUNT_TIER_20: 0.15
      DISCOUNT_TIER_10: 0.10
      DISCOUNT_TIER_5: 0.05
      RECLAIM_SURCHARGE_PCT: 0.08
    precision: "integer cents; round_half_up wherever a fraction arises"
    variants:
      - name: QUOTED_AT_BOOKING
        when: "Order creation; stored on quote_cents"
        difference: "Input set = vehicle_ids (booked count drives the discount tier)"
      - name: FINAL_AT_COMPLETION
        when: "COMPLETE transition; stored on final_cents"
        difference: "Input set = vehicles_washed_ids (actual count drives the discount tier); identical order data yields a different amount whenever the washed count crosses a tier boundary or drops any vehicle"

  - name: stop_planning
    trigger: "POST /fleet-wash/routes/{id}/stops (each appended stop)"
    algorithm: aggregation
    formula: |
      lot_setup_minutes(lot_size_sqft) = 15 if < 10000; 25 if 10000..49999; 40 if >= 50000.
      service_minutes = SUM over order vehicles of {SEDAN 20, SUV_PICKUP 25, VAN_BOXTRUCK 35, HEAVY_FLEET 50}.
      stop_duration_minutes = lot_setup_minutes + service_minutes.
      planned_start_at = route.shift_start_at (default route_dateT08:00:00Z) for sequence 1;
                         otherwise previous stop's planned_end_at + DRIVE_MINUTES.
      planned_end_at = planned_start_at + stop_duration_minutes.
      Stops are processed in ascending sequence; the sort key is sequence and
      sequence assignment is append-only, so no tie-break is ever needed.
    input_set: "All RouteStops on the route with status IN {PLANNED, ARRIVED, DONE}"
    constants:
      SHIFT_START_HOUR_UTC: 8
      DRIVE_MINUTES: 20
      SETUP_SMALL: 15
      SETUP_MEDIUM: 25
      SETUP_LARGE: 40
      LOT_MEDIUM_MIN_SQFT: 10000
      LOT_LARGE_MIN_SQFT: 50000
      SVC_SEDAN_MIN: 20
      SVC_SUV_PICKUP_MIN: 25
      SVC_VAN_BOXTRUCK_MIN: 35
      SVC_HEAVY_FLEET_MIN: 50
    precision: "whole minutes; datetimes ISO 8601 UTC"

  - name: route_water_budget
    trigger: "LOAD_WATER (reset), stop add (reserve), stop REMOVE/SKIP/route-cancel (release), order COMPLETE (draw)"
    algorithm: waterfall_allocation
    formula: |
      gross_gallons(vehicles) = SUM of {SEDAN 8, SUV_PICKUP 10, VAN_BOXTRUCK 15, HEAVY_FLEET 25}.
      recovery(reclaim_system) = NONE 0.00 | BASIC 0.60 | ADVANCED 0.85.
      projected_net_gal = gross_gallons(order.vehicle_ids) * (1 - recovery(route.van)).
      On stop add:    stop.reserved_water_gal = projected_net_gal; Van.water_reserved_gal += projected_net_gal.
      Feasibility:    Van.water_loaded_gal - Van.water_used_gal - Van.water_reserved_gal >= projected_net_gal
                      (equality allowed; ERR_ROUTE_WATER_CAPACITY_EXCEEDED otherwise).
      On COMPLETE:    actual_net_gal = gross_gallons(vehicles_washed_ids) * (1 - recovery);
                      Van.water_used_gal += actual_net_gal; Van.water_reserved_gal -= stop.reserved_water_gal.
      On release:     Van.water_reserved_gal -= stop.reserved_water_gal.
      On LOAD_WATER:  water_loaded_gal = gallons; water_reserved_gal = 0; water_used_gal = 0.
      CONSERVED QUANTITY (van water budget): at all times
        water_loaded_gal == water_used_gal + water_reserved_gal + free_gal
        where free_gal = water_loaded_gal - water_used_gal - water_reserved_gal >= 0.
    input_set: "Stops with status IN {PLANNED, ARRIVED} hold reservations; DONE/SKIPPED/CANCELLED hold none"
    constants:
      GAL_SEDAN: 8
      GAL_SUV_PICKUP: 10
      GAL_VAN_BOXTRUCK: 15
      GAL_HEAVY_FLEET: 25
      RECOVERY_NONE: 0.0
      RECOVERY_BASIC: 0.60
      RECOVERY_ADVANCED: 0.85
    precision: "gallons to 1 decimal place; comparisons exact"

  - name: discharge_projection
    trigger: "POST /fleet-wash/routes/{id}/stops (compliance check before reservation)"
    algorithm: threshold
    formula: |
      projected_discharge_gal = gross_gallons(order.vehicle_ids) * (1 - recovery(route.van.reclaim_system)).
      If site.water_reclaim_required:
        - recovery < 0.60 -> ERR_CONTAINMENT_REQUIRED (equipment adequacy, checked first)
        - projected_discharge_gal > site.max_discharge_gal -> ERR_DISCHARGE_CAP_EXCEEDED
          (exactly equal to the cap is allowed: comparison is strictly greater-than)
    input_set: "The candidate stop's order and the route's van"
    constants:
      MIN_RECOVERY_AT_RECLAIM_SITE: 0.60
    precision: "gallons to 1 decimal place"

  - name: fleet_invoice_billing
    trigger: "POST /fleet-wash/invoices/generate"
    algorithm: tiered_pricing
    formula: |
      For each included WashOrder (see input_set):
        charge_cents(order) = wash_quote_cents evaluated with the contract rate card
          (FINAL variant over vehicles_washed_ids for COMPLETED orders;
           QUOTED variant over vehicle_ids for not-yet-completed orders).
        ROUNDING ORDER (pinned): each order line's charge_cents is rounded half-up to
        integer cents FIRST; lines are then summed. Summing exact fractions and rounding
        once at the end is FORBIDDEN (the two orders can differ by cents).
        line_credit_cents(order) = round_half_up(charge_cents(order) * contract.loyalty_credit_pct).
      charges_cents         = SUM charge_cents over lines
      loyalty_credits_cents = SUM line_credit_cents over lines
      net_before_minimum    = charges_cents - loyalty_credits_cents
      billed_cents          = max(net_before_minimum, contract.monthly_minimum_cents)
      minimum_applied       = net_before_minimum < contract.monthly_minimum_cents
      A period with zero included orders produces line_count = 0, charges_cents = 0,
      and billed_cents = monthly_minimum_cents (the minimum still bills).
    input_set: "FINAL variant: WashOrders of the contract's customer with status IN {COMPLETED, REWASH_PENDING, CLOSED} and completed_at inside period_month, billing_status != WAIVED. PROJECTION variant: additionally includes status IN {SCHEDULED, ASSIGNED, IN_PROGRESS} orders whose scheduled_window_start falls inside period_month, priced at quote_cents."
    constants: {}
    precision: "integer cents; round_half_up per line before summing"
    variants:
      - name: PROJECTION
        when: "variant=PROJECTION on generate; produces a PREVIEW invoice that can never be ISSUED"
        difference: "Includes scheduled-but-unfinished orders at quote_cents; identical period data yields a different total than FINAL whenever unfinished orders exist or a quote differs from its final"
      - name: FINAL
        when: "variant=FINAL on generate; produces a DRAFT invoice that may be ISSUED"
        difference: "Completed orders only, at final_cents"

  - name: claim_credit_cap
    trigger: "POST /fleet-wash/invoices/generate (after billed_cents is known)"
    algorithm: constraint_propagation
    formula: |
      EVALUATION ORDER (pinned; the dependency is circular-looking without it):
        1. charges_cents and loyalty_credits_cents per fleet_invoice_billing
        2. billed_cents = max(charges - credits, monthly_minimum_cents)
        3. cap_cents = round_half_up(billed_cents * 0.25)      # cap derives from POST-minimum billed_cents
        4. eligible = SUM approved_amount_cents over DamageClaims with status PAID
                      whose wash order's completed_at falls inside period_month
                      and whose wash order belongs to the contract's customer
        5. claim_credits_cents = min(eligible, cap_cents)
        6. net_due_cents = billed_cents - claim_credits_cents
      The cap MUST be computed from billed_cents (step 2), never from net_due_cents.
    input_set: "DamageClaims with status == PAID, order completed inside period_month, order's customer == contract customer"
    constants:
      CLAIM_CREDIT_CAP_PCT: 0.25
    precision: "integer cents; round_half_up for the cap"

  - name: early_termination_fee
    trigger: "FleetContract TERMINATE when logical clock date < end_date"
    algorithm: chronological
    formula: |
      remaining_full_months = count of calendar months M such that
        first_day(M) > logical_clock_date AND M <= month(end_date).
      (The month containing the clock date never counts; the end month counts
      only if it is fully after the clock date.)
      early_termination_fee_cents = remaining_full_months * monthly_minimum_cents * 0.50
      If logical clock date >= end_date: fee = 0.
      Example: clock 2026-08-14, end_date 2026-12-31, minimum 200000 ->
      full months Sep, Oct, Nov, Dec = 4 -> fee = 4 * 200000 * 0.50 = 400000.
    input_set: "The terminating contract"
    constants:
      EARLY_TERMINATION_RATE: 0.50
    precision: "integer cents"

  - name: pause_accounting
    trigger: "Subscription PAUSE / RESUME / CANCEL events"
    algorithm: chronological
    formula: |
      Pauses are replayed in started_at order (tie-break impossible: a subscription
      has at most one open pause; started_at values are distinct clock dates).
      window_start = logical_clock_date - 365 days.
      pause_count_365d  = count of pause records with started_at >= window_start
                          (the prospective pause is NOT yet counted).
      paused_days_365d  = SUM of record days for records with started_at >= window_start;
                          an open record contributes (clock_date - started_at) days.
      PAUSE admitted iff pause_count_365d < 2 AND 7 <= pause_days
                          AND paused_days_365d + pause_days <= 90  (90 exactly is allowed).
      RESUME: closed record days = clock_date - started_at;
              next_service_date += closed days  (calendar-date shift).
      CONSERVED QUANTITY (subscription calendar): across a PAUSE/RESUME pair,
        next_service_date_after - next_service_date_before == closed pause days.
    input_set: "The subscription's pauses array"
    constants:
      PAUSE_MAX_COUNT_365D: 2
      PAUSE_MAX_DAYS_365D: 90
      PAUSE_MIN_DAYS: 7
      PAUSE_WINDOW_DAYS: 365
    precision: "whole days; date arithmetic in UTC"

  - name: weather_policy_evaluation
    trigger: "POST /fleet-wash/weather/evaluations"
    algorithm: threshold
    formula: |
      Inputs: evaluation_date, forecast_low_f (integer), precip_probability_pct (integer 0..100).
      FREEZE: forecast_low_f <= 32  (32 exactly freezes; 33 does not)
        -> every Route with route_date == evaluation_date and status IN {PUBLISHED, LOCKED}
           transitions to CANCELLED with cancel_reason=WEATHER_FREEZE;
           each such route's stops in {PLANNED, ARRIVED} -> CANCELLED (reserved water released);
           each stop's WashOrder in ASSIGNED -> WEATHER_HELD (hold_reason=WEATHER_FREEZE, held_at=clock);
           every unrouted WashOrder with window date == evaluation_date and status == SCHEDULED
           -> WEATHER_HELD.
      RAIN ADVISORY: forecast_low_f > 32 AND precip_probability_pct >= 60
        (60 exactly raises the advisory; 59 does not)
        -> advisory = true in the evaluation result; no order or route changes state.
      Otherwise: no effect.
    input_set: "Routes and WashOrders keyed by the UTC date of route_date / scheduled_window_start"
    constants:
      FREEZE_THRESHOLD_F: 32
      RAIN_ADVISORY_PCT: 60
    precision: "integer degrees Fahrenheit; integer percent"

  - name: audit_scoring
    trigger: "POST /fleet-wash/quality-audits"
    algorithm: weighted_scoring
    formula: |
      total_score = exterior_score + wheels_score + glass_score + trim_score + water_spotting_score
      (equal weights of 1; each category 0..20; total 0..100).
      result = PASS when total_score >= 80 (80 exactly passes), else FAIL.
      FAIL side effect: if no open rewash exists for the order (status IN
      {DRAFT, SCHEDULED, ASSIGNED, IN_PROGRESS, WEATHER_HELD}), a rewash WashOrder
      is created (billing_status=WAIVED, quote_cents=0, status SCHEDULED, window =
      clock date + 1 day 08:00-10:00Z) and the audited order -> REWASH_PENDING.
    input_set: "One COMPLETED WashOrder"
    constants:
      AUDIT_PASS_SCORE: 80
      CATEGORY_MAX: 20
    precision: "integer scores"

  - name: guarantee_windows
    trigger: "DamageClaim create, WashOrder rewash request, run-daily close sweep"
    algorithm: threshold
    formula: |
      CLAIM_WINDOW: filed_at - order.completed_at <= 72 hours (exactly 72h allowed; later -> ERR_CLAIM_WINDOW_EXPIRED).
      REWASH_WINDOW: request clock - order.completed_at <= 72 hours (exactly 72h allowed; later -> ERR_REWASH_WINDOW_EXPIRED).
      GUARANTEE_CLOSE (run-daily): orders with status COMPLETED and completed_at <= clock - 72 hours -> CLOSED.
      WEATHER_EXPIRE (run-daily): orders with status WEATHER_HELD and held_at date + 14 days < clock date
        -> CANCELLED with cancel_reason=WEATHER_EXPIRED (held exactly 14 days is NOT expired).
    input_set: "Time-delta checks against the logical clock; all comparisons on UTC instants/dates"
    constants:
      CLAIM_WINDOW_HOURS: 72
      REWASH_WINDOW_HOURS: 72
      GUARANTEE_CLOSE_HOURS: 72
      WEATHER_RESCHEDULE_DAYS: 14
    precision: "hour-accurate for claim/rewash windows; date-accurate for sweeps"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and names a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for the endpoint; ownership checks (Customer acts only on own resources: body/referenced customer_id == X-User-ID; Technician acts only as route lead or report filer: X-User-ID == lead_technician_id / technician_id)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids and body FK references exist (validated left-to-right)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "Required fields present; types, enum members, and ranges valid (dates parse, window_end > window_start, gallons > 0, scores 0..20)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 5, category: existence, check: "OCC: expected_<parent>_version equals the parent entity's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /fleet-wash/routes/{id}/stops; POST /fleet-wash/wash-orders/{id}/reschedule; PUT /fleet-wash/fleet-contracts/{id}" }
  - { priority: 6, category: state, check: "Target entity is in a valid from-state for the requested transition (event endpoints, rewash source COMPLETED, invoice ISSUE from DRAFT FINAL, route stop mutations only while DRAFT/PUBLISHED)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all event/action endpoints" }
  - { priority: 6, category: state, check: "Route must be DRAFT or PUBLISHED to accept stop add/remove (LOCKED/COMPLETED/CANCELLED reject). Tie-break at shared priority 6: on the stop-add/remove endpoints the path resource state (Route) is checked before the referenced wash order's state", error_id: ERR_ROUTE_LOCKED, http_status: 409, applies_to: "POST /fleet-wash/routes/{id}/stops; POST /fleet-wash/routes/{id}/stops/{stop_id}/events (REMOVE)" }
  - { priority: 7, category: business_safety, check: "Containment adequacy: order CONFIRM rejects when site.water_reclaim_required AND site.containment_type == NONE; stop add rejects when site.water_reclaim_required AND van recovery < 0.60", error_id: ERR_CONTAINMENT_REQUIRED, http_status: 422, applies_to: "POST /fleet-wash/wash-orders/{id}/events (CONFIRM); POST /fleet-wash/routes/{id}/stops" }
  - { priority: 8, category: business_safety, check: "Discharge cap: projected discharge gallons must be <= site.max_discharge_gal (equality allowed)", error_id: ERR_DISCHARGE_CAP_EXCEEDED, http_status: 422, applies_to: "POST /fleet-wash/routes/{id}/stops" }
  - { priority: 9, category: business_safety, check: "Certification: a route on an ADVANCED-reclaim van requires lead technician water_reclaim_certified == true", error_id: ERR_CERTIFICATION_REQUIRED, http_status: 422, applies_to: "POST /fleet-wash/routes" }
  - { priority: 10, category: business_temporal, check: "Site service-window overlap: half-open [start, end) windows of orders at the same site with status IN {SCHEDULED, ASSIGNED, IN_PROGRESS} must not overlap; touching endpoints (end == start) do not conflict", error_id: ERR_SITE_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /fleet-wash/wash-orders/{id}/events (CONFIRM); POST /fleet-wash/wash-orders/{id}/reschedule" }
  - { priority: 11, category: business_temporal, check: "Technician travel buffer: across different routes on the same date led by the same technician, the gap between one stop's planned_end_at and another's planned_start_at must be >= 30 minutes (exactly 30 allowed)", error_id: ERR_TECHNICIAN_SCHEDULE_CONFLICT, http_status: 409, applies_to: "POST /fleet-wash/routes/{id}/stops" }
  - { priority: 12, category: business_temporal, check: "Damage claim filed within 72 hours of order completed_at (exactly 72h allowed)", error_id: ERR_CLAIM_WINDOW_EXPIRED, http_status: 422, applies_to: "POST /fleet-wash/damage-claims" }
  - { priority: 13, category: business_temporal, check: "Rewash requested within 72 hours of order completed_at (exactly 72h allowed)", error_id: ERR_REWASH_WINDOW_EXPIRED, http_status: 422, applies_to: "POST /fleet-wash/wash-orders/{id}/rewash" }
  - { priority: 14, category: business_temporal, check: "WEATHER_HELD order rescheduled within 14 days of held_at date (the 14th day allowed)", error_id: ERR_RESCHEDULE_WINDOW_EXPIRED, http_status: 422, applies_to: "POST /fleet-wash/wash-orders/{id}/reschedule" }
  - { priority: 15, category: business_constraint, check: "Route water capacity: van free gallons (loaded - used - reserved) >= candidate stop's projected net gallons (equality allowed)", error_id: ERR_ROUTE_WATER_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /fleet-wash/routes/{id}/stops" }
  - { priority: 16, category: business_constraint, check: "Route vehicle capacity: assigned_vehicle_count + candidate order vehicle_count <= 40 (exactly 40 allowed)", error_id: ERR_ROUTE_VEHICLE_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /fleet-wash/routes/{id}/stops" }
  - { priority: 17, category: business_constraint, check: "One non-terminal route per van per date: no other route with same van_id, same route_date, status IN {DRAFT, PUBLISHED, LOCKED}", error_id: ERR_VAN_ROUTE_CONFLICT, http_status: 409, applies_to: "POST /fleet-wash/routes; POST /fleet-wash/vans/{id}/events (MAINTENANCE_START, LOAD_WATER)" }
  - { priority: 18, category: business_constraint, check: "Lead technician status == ACTIVE at route creation", error_id: ERR_TECHNICIAN_NOT_ACTIVE, http_status: 409, applies_to: "POST /fleet-wash/routes" }
  - { priority: 19, category: business_constraint, check: "At most one subscription with status IN {ACTIVE, PAUSED} per vehicle", error_id: ERR_DUPLICATE_SUBSCRIPTION, http_status: 409, applies_to: "POST /fleet-wash/subscriptions" }
  - { priority: 20, category: business_constraint, check: "Subscription PAUSE count: pause_count_365d must be < 2 and pause_days >= 7 (checked before the day budget)", error_id: ERR_PAUSE_LIMIT_EXCEEDED, http_status: 422, applies_to: "POST /fleet-wash/subscriptions/{id}/events (PAUSE)" }
  - { priority: 21, category: business_constraint, check: "Subscription PAUSE duration budget: paused_days_365d + pause_days must be <= 90 (exactly 90 allowed)", error_id: ERR_PAUSE_DURATION_EXCEEDED, http_status: 422, applies_to: "POST /fleet-wash/subscriptions/{id}/events (PAUSE)" }
  - { priority: 22, category: business_constraint, check: "Damage claim APPROVE blocked when a SUBMITTED InspectionReport for the order flags the claimed area pre_existing_damage", error_id: ERR_PRE_EXISTING_CONDITION_DOCUMENTED, http_status: 409, applies_to: "POST /fleet-wash/damage-claims/{id}/events (APPROVE)" }
  - { priority: 23, category: business_constraint, check: "Wash order START requires a SUBMITTED InspectionReport when requires_inspection is true", error_id: ERR_INSPECTION_REQUIRED, http_status: 409, applies_to: "POST /fleet-wash/wash-orders/{id}/events (START)" }
  - { priority: 24, category: business_constraint, check: "Rewash request rejected while another rewash of the same order is open (status IN {DRAFT, SCHEDULED, ASSIGNED, IN_PROGRESS, WEATHER_HELD})", error_id: ERR_REWASH_IN_PROGRESS, http_status: 409, applies_to: "POST /fleet-wash/wash-orders/{id}/rewash" }
  - { priority: 25, category: business_referential, check: "Customer status == ACTIVE for new wash orders and subscriptions", error_id: ERR_CUSTOMER_SUSPENDED, http_status: 409, applies_to: "POST /fleet-wash/wash-orders; POST /fleet-wash/subscriptions; POST /fleet-wash/wash-orders/{id}/events (CONFIRM)" }
  - { priority: 26, category: business_referential, check: "Site status == ACTIVE for order CONFIRM and START", error_id: ERR_SITE_SUSPENDED, http_status: 409, applies_to: "POST /fleet-wash/wash-orders/{id}/events (CONFIRM, START)" }
  - { priority: 27, category: business_referential, check: "Subscription status == ACTIVE when confirming a subscription-billed order", error_id: ERR_SUBSCRIPTION_NOT_ACTIVE, http_status: 409, applies_to: "POST /fleet-wash/wash-orders/{id}/events (CONFIRM)" }
  - { priority: 28, category: business_referential, check: "FleetContract status == ACTIVE for fleet order CONFIRM and invoice generation", error_id: ERR_CONTRACT_NOT_ACTIVE, http_status: 409, applies_to: "POST /fleet-wash/wash-orders/{id}/events (CONFIRM); POST /fleet-wash/invoices/generate" }
  - { priority: 29, category: business_fiscal, check: "At most one FINAL-variant invoice per contract+period in status IN {DRAFT, ISSUED, DISPUTED, PAID} (PREVIEW rows never block; VOID releases the period)", error_id: ERR_INVOICE_EXISTS, http_status: 409, applies_to: "POST /fleet-wash/invoices/generate" }
  - { priority: 30, category: business_fiscal, check: "Explicit approved_amount_cents on APPROVE must be <= min(claimed_amount_cents, class cap)", error_id: ERR_CLAIM_CAP_EXCEEDED, http_status: 422, applies_to: "POST /fleet-wash/damage-claims/{id}/events (APPROVE)" }
  - { priority: 31, category: business_fiscal, check: "Segregation of duties: MARK_PAID X-User-ID must differ from the claim's reviewed_by", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /fleet-wash/damage-claims/{id}/events (MARK_PAID)" }
  - { priority: 32, category: business_referential, check: "Site REINSTATE blocked while any ComplianceIncident at the site has status CONFIRMED", error_id: ERR_OPEN_COMPLIANCE_INCIDENT, http_status: 409, applies_to: "POST /fleet-wash/sites/{id}/events (REINSTATE)" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving / ops ---
  - method: POST
    path: "/fleet-wash/_clock/set_current_utc"
    description: "Advance the server's logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. All deadline/window rules evaluate against this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: []
  - method: POST
    path: "/fleet-wash/ops/run-daily"
    description: "Daily sweep: closes COMPLETED orders past the 72h guarantee window; auto-cancels WEATHER_HELD orders whose 14-day reschedule window has lapsed"
    roles: [Dispatcher]
    code: 200
    input: []
    output: { closed_order_ids: "string[]", expired_order_ids: "string[]" }
    side_effects: ["COMPLETED orders with completed_at <= clock - 72h -> CLOSED", "WEATHER_HELD orders with held_at date + 14 days < clock date -> CANCELLED (WEATHER_EXPIRED)"]
  - method: POST
    path: "/fleet-wash/weather/evaluations"
    description: "Evaluate the freeze/rain policy for a service date; freeze cascades route cancellations, stop cancellations, and order weather holds"
    roles: [Dispatcher]
    code: 201
    input: [evaluation_date, forecast_low_f, precip_probability_pct]
    output: { evaluation_date: string, freeze: boolean, advisory: boolean, cancelled_route_ids: "string[]", held_order_ids: "string[]" }
    side_effects: ["weather_policy_evaluation cascades: PUBLISHED/LOCKED routes on the date -> CANCELLED (WEATHER_FREEZE); their stops -> CANCELLED (water released); stops' ASSIGNED orders and unrouted SCHEDULED orders on the date -> WEATHER_HELD"]

  # --- customers ---
  - method: POST
    path: "/fleet-wash/customers"
    description: "Create a customer"
    roles: [PlatformAdmin]
    code: 201
    input: [name, email, "customer_type?"]
    output: Customer
    side_effects: ["status ACTIVE"]
  - method: GET
    path: "/fleet-wash/customers/{id}"
    description: "Get a customer"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/fleet-wash/customers/{id}/events"
    description: "Customer lifecycle events: SUSPEND, REACTIVATE"
    roles: [PlatformAdmin]
    code: 200
    input: [event_type]
    output: Customer
    side_effects: ["SUSPEND: status -> SUSPENDED; REACTIVATE: status -> ACTIVE; increments Customer.version by 1"]

  # --- sites ---
  - method: POST
    path: "/fleet-wash/sites"
    description: "Create a customer site (lot)"
    roles: [PlatformAdmin, Dispatcher]
    code: 201
    input: [customer_id, name, lot_size_sqft, containment_type, water_reclaim_required, max_discharge_gal]
    output: Site
    side_effects: ["status ACTIVE"]
  - method: GET
    path: "/fleet-wash/sites/{id}"
    description: "Get a site"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: []
    output: Site
    side_effects: []
  - method: GET
    path: "/fleet-wash/sites"
    description: "List sites with optional filters"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: Site[]
    side_effects: []
  - method: POST
    path: "/fleet-wash/sites/{id}/events"
    description: "Site lifecycle events: SUSPEND, REINSTATE"
    roles: [ComplianceOfficer]
    code: 200
    input: [event_type]
    output: Site
    side_effects: ["SUSPEND: site -> SUSPENDED (MANUAL) with order/stop cascade; REINSTATE: site -> ACTIVE when no CONFIRMED incidents remain; increments Site.version by 1"]

  # --- vehicles ---
  - method: POST
    path: "/fleet-wash/vehicles"
    description: "Register a vehicle (Customer registers own vehicles: customer_id must equal X-User-ID)"
    roles: [PlatformAdmin, Customer]
    code: 201
    input: [customer_id, site_id, plate, vehicle_class]
    output: Vehicle
    side_effects: []
  - method: GET
    path: "/fleet-wash/vehicles/{id}"
    description: "Get a vehicle"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: []
    output: Vehicle
    side_effects: []
  - method: GET
    path: "/fleet-wash/vehicles"
    description: "List vehicles with optional filters"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: ["customer_id?", "site_id?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  # --- fleet contracts ---
  - method: POST
    path: "/fleet-wash/fleet-contracts"
    description: "Create a fleet contract in DRAFT for a FLEET customer"
    roles: [PlatformAdmin]
    code: 201
    input: [customer_id, start_date, end_date, monthly_minimum_cents, sedan_rate_cents, suv_pickup_rate_cents, van_boxtruck_rate_cents, heavy_fleet_rate_cents, "loyalty_credit_pct?"]
    output: FleetContract
    side_effects: ["status DRAFT, version 1"]
  - method: GET
    path: "/fleet-wash/fleet-contracts/{id}"
    description: "Get a fleet contract"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: []
    output: FleetContract
    side_effects: []
  - method: GET
    path: "/fleet-wash/fleet-contracts"
    description: "List fleet contracts with optional filters"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: FleetContract[]
    side_effects: []
  - method: PUT
    path: "/fleet-wash/fleet-contracts/{id}"
    description: "Amend rate card / minimum / dates while DRAFT or ACTIVE (OCC-guarded)"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_fleet_contract_version, "monthly_minimum_cents?", "sedan_rate_cents?", "suv_pickup_rate_cents?", "van_boxtruck_rate_cents?", "heavy_fleet_rate_cents?", "loyalty_credit_pct?", "start_date?", "end_date?"]
    output: FleetContract
    side_effects: ["increments FleetContract.version by 1"]
  - method: POST
    path: "/fleet-wash/fleet-contracts/{id}/events"
    description: "Contract lifecycle events: ACTIVATE, SUSPEND, REINSTATE, TERMINATE"
    roles: [PlatformAdmin]
    code: 200
    input: [event_type]
    output: FleetContract
    side_effects: ["TERMINATE computes early_termination_fee_cents when early; increments FleetContract.version by 1"]

  # --- subscriptions ---
  - method: POST
    path: "/fleet-wash/subscriptions"
    description: "Create a recurring subscription for a vehicle (Customer for self)"
    roles: [PlatformAdmin, Customer]
    code: 201
    input: [customer_id, vehicle_id, cadence, next_service_date]
    output: Subscription
    side_effects: ["status ACTIVE"]
  - method: GET
    path: "/fleet-wash/subscriptions/{id}"
    description: "Get a subscription"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/fleet-wash/subscriptions"
    description: "List subscriptions with optional filters"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: ["customer_id?", "vehicle_id?", "status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/fleet-wash/subscriptions/{id}/events"
    description: "Subscription events: PAUSE {pause_days}, RESUME, CANCEL (Customer for own subscription)"
    roles: [PlatformAdmin, Customer]
    code: 200
    input: [event_type, "pause_days?"]
    output: Subscription
    side_effects: ["PAUSE opens a pause record; RESUME closes it and extends next_service_date by the paused days; increments Subscription.version by 1"]

  # --- wash orders ---
  - method: POST
    path: "/fleet-wash/wash-orders"
    description: "Create a wash order in DRAFT (Customer for self); quote_cents computed via QUOTED_AT_BOOKING"
    roles: [PlatformAdmin, Dispatcher, Customer]
    code: 201
    input: [customer_id, site_id, vehicle_ids, scheduled_window_start, scheduled_window_end, "subscription_id?", "requires_inspection?"]
    output: WashOrder
    side_effects: ["status DRAFT, billing_status UNBILLED, quote_cents computed"]
  - method: GET
    path: "/fleet-wash/wash-orders/{id}"
    description: "Get a wash order"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: []
    output: WashOrder
    side_effects: []
  - method: GET
    path: "/fleet-wash/wash-orders"
    description: "List wash orders with optional filters"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: ["customer_id?", "site_id?", "subscription_id?", "rewash_of_id?", "status?", "limit?", "offset?"]
    output: WashOrder[]
    side_effects: []
  - method: POST
    path: "/fleet-wash/wash-orders/{id}/events"
    description: "Order lifecycle events: CONFIRM, START, COMPLETE {vehicles_washed_ids}, CANCEL {cancel_reason?}, WEATHER_HOLD. START/COMPLETE only by the route's lead Technician; CONFIRM/CANCEL by owning Customer or Dispatcher; WEATHER_HOLD by Dispatcher"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician]
    code: 200
    input: [event_type, "vehicles_washed_ids?", "cancel_reason?"]
    output: WashOrder
    side_effects: ["CONFIRM runs booking validations; COMPLETE computes final_cents and van water draw; CANCEL releases route stop; increments WashOrder.version by 1"]
  - method: POST
    path: "/fleet-wash/wash-orders/{id}/reschedule"
    description: "Move a SCHEDULED or WEATHER_HELD order to a new window (OCC-guarded)"
    roles: [PlatformAdmin, Dispatcher, Customer]
    code: 200
    input: [scheduled_window_start, scheduled_window_end, expected_wash_order_version]
    output: WashOrder
    side_effects: ["window replaced; WEATHER_HELD -> SCHEDULED clears hold fields; increments WashOrder.version by 1"]
  - method: POST
    path: "/fleet-wash/wash-orders/{id}/rewash"
    description: "Customer requests a guarantee rewash of a COMPLETED order within 72 hours"
    roles: [Customer]
    code: 201
    input: []
    output: WashOrder
    side_effects: ["creates rewash WashOrder (billing_status WAIVED, quote_cents 0, status SCHEDULED, window clock+1d 08:00-10:00Z); original -> REWASH_PENDING"]
  - method: GET
    path: "/fleet-wash/wash-orders/{id}/route-stops"
    description: "List route stops serving this order (0 or 1 non-cancelled)"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: RouteStop[]
    side_effects: []

  # --- routes ---
  - method: POST
    path: "/fleet-wash/routes"
    description: "Create a route for a date, van, and lead technician"
    roles: [Dispatcher]
    code: 201
    input: [route_date, van_id, lead_technician_id, "shift_start_at?"]
