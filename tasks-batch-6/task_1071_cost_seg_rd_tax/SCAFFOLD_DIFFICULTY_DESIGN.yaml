            - { call: "POST /asset-components/${c5}/allocate", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /studies/${st}/submit-review", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /studies/${st}/finalize", payload: {}, as: Reviewer, as_user_id: "${rev}" }
          trigger:
            - { call: "POST /studies/${st}/audit-cases", payload: { irs_notice_ref: "CP2000" }, as: StudyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: property_cost_seg_same_tax_year_overlap
        grounds:
          - validations[priority=8]
          - state_machines.Study.DRAFT_to_SCOPING
        distinguishing_aspect: |
          Scoping a second non-CANCELLED COST_SEGREGATION study to the same Property with the same tax_year
          (2024) is rejected with ERR_PROPERTY_STUDY_OVERLAP; the resource is the Property and the interval
          semantics are same-year point collision.
        test_recipe:
          setup:
            - "ACTIVE client; one property; study A COST_SEGREGATION 2024 already scoped to the property"
            - "study B COST_SEGREGATION 2024 for the same client, DRAFT"
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Ov Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /properties", payload: { client_id: "${cli}", address: "11 Main", building_type: "COMMERCIAL", purchase_price_cents: 120000000, land_value_cents: 20000000, placed_in_service_date: "2024-03-01T00:00:00.000Z" }, as: StudyManager, captures: { prop: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "COST_SEGREGATION", tax_year: 2024 }, as: StudyManager, captures: { sa: "$.data.id" } }
            - { call: "POST /studies/${sa}/scope", payload: { fee_type: "FIXED", fee_fixed_amount_cents: 100000, property_id: "${prop}" }, as: StudyManager }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "COST_SEGREGATION", tax_year: 2024 }, as: StudyManager, captures: { sb: "$.data.id" } }
          trigger:
            - { call: "POST /studies/${sb}/scope", payload: { fee_type: "FIXED", fee_fixed_amount_cents: 100000, property_id: "${prop}" }, as: StudyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_PROPERTY_STUDY_OVERLAP"
            - "http status == 409"

      - name: rd_base_period_window_overlap
        grounds:
          - validations[priority=9]
          - state_machines.Study.DRAFT_to_SCOPING
        distinguishing_aspect: |
          Scoping a second RD_CREDIT study for the same client whose base period [tax_year-3, tax_year)
          overlaps an existing study's base period is rejected with ERR_RD_BASE_PERIOD_OVERLAP; the resource
          is the Client and the interval semantics are half-open range overlap ([2021,2024) vs [2022,2025)).
        test_recipe:
          setup:
            - "ACTIVE client; study A RD_CREDIT tax_year 2024 scoped (base [2021,2024))"
            - "study B RD_CREDIT tax_year 2025 for the same client, DRAFT (base [2022,2025) overlaps A)"
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Ov Co2", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "RD_CREDIT", tax_year: 2024 }, as: StudyManager, captures: { sa: "$.data.id" } }
            - { call: "POST /studies/${sa}/scope", payload: { fee_type: "FIXED", fee_fixed_amount_cents: 100000, credit_method: "ASC" }, as: StudyManager }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "RD_CREDIT", tax_year: 2025 }, as: StudyManager, captures: { sb: "$.data.id" } }
          trigger:
            - { call: "POST /studies/${sb}/scope", payload: { fee_type: "FIXED", fee_fixed_amount_cents: 100000, credit_method: "ASC" }, as: StudyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_RD_BASE_PERIOD_OVERLAP"
            - "http status == 409"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: allocation_ledger_conserved_on_allocate_then_exclude
        grounds:
          - state_machines.AssetComponent.PROPOSED_to_ALLOCATED
          - state_machines.AssetComponent.ALLOCATED_to_EXCLUDED
          - entities.Study.fields.total_allocated_cost_cents
        distinguishing_aspect: |
          Allocating component B (+5000000) then excluding B (-5000000) leaves study.total_allocated_cost_cents
          exactly at the pre-B value (3000000 from component A); the conserved quantity is total_allocated_cost_cents.
        test_recipe:
          setup:
            - "ACTIVE client; property; COST_SEGREGATION study in ENGINEERING; component A (3000000) ALLOCATED; component B (5000000) ALLOCATED"
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Inv Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /engineers", payload: { full_name: "Prep Eng", email: "prep12@x.com" }, as: StudyManager, captures: { eng: "$.data.id" } }
            - { call: "POST /properties", payload: { client_id: "${cli}", address: "12 Main", building_type: "COMMERCIAL", purchase_price_cents: 120000000, land_value_cents: 20000000, placed_in_service_date: "2024-03-01T00:00:00.000Z" }, as: StudyManager, captures: { prop: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "COST_SEGREGATION", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /studies/${st}/scope", payload: { fee_type: "FIXED", fee_fixed_amount_cents: 100000, property_id: "${prop}" }, as: StudyManager }
            - { call: "POST /studies/${st}/assign-engineer", payload: { assigned_engineer_id: "${eng}" }, as: StudyManager }
            - { call: "POST /studies/${st}/asset-components", payload: { component_name: "A", asset_class: "FIVE_YEAR", allocated_cost_cents: 3000000 }, as: Engineer, as_user_id: "${eng}", captures: { ca: "$.data.id" } }
            - { call: "POST /studies/${st}/asset-components", payload: { component_name: "B", asset_class: "FIVE_YEAR", allocated_cost_cents: 5000000 }, as: Engineer, as_user_id: "${eng}", captures: { cb: "$.data.id" } }
            - { call: "POST /asset-components/${ca}/allocate", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /asset-components/${cb}/allocate", payload: {}, as: Engineer, as_user_id: "${eng}" }
          trigger:
            - { call: "POST /asset-components/${cb}/exclude", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "GET /studies/${st}", payload: {}, as: StudyManager, captures: { tot: "$.data.total_allocated_cost_cents" } }
          assert:
            - "Study.${st}.total_allocated_cost_cents == 3000000"

      - name: fee_ledger_conserved_on_issue_then_void
        grounds:
          - state_machines.Study.IN_REVIEW_to_FINALIZED
          - state_machines.FeeInvoice.ISSUED_to_VOID
          - entities.Client.fields.outstanding_fee_cents
        distinguishing_aspect: |
          Finalize issues a FeeInvoice (+1102227 to client.outstanding_fee_cents); voiding it (-1102227)
          returns client.outstanding_fee_cents to its pre-finalize value of 0; the conserved quantity is the
          fee-ledger balance, different from the allocation-basis quantity.
        test_recipe:
          setup:
            - "The finalize_report_fee_client_chain study taken to FINALIZED (client.outstanding_fee_cents=1102227, one ISSUED FeeInvoice)"
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Inv Co2", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /engineers", payload: { full_name: "Prep Eng", email: "prep13@x.com" }, as: StudyManager, captures: { eng: "$.data.id" } }
            - { call: "POST /engineers", payload: { full_name: "Rev Eng", email: "rev13@x.com" }, as: StudyManager, captures: { rev: "$.data.id" } }
            - { call: "POST /properties", payload: { client_id: "${cli}", address: "13 Main", building_type: "COMMERCIAL", purchase_price_cents: 120000000, land_value_cents: 20000000, placed_in_service_date: "2024-03-01T00:00:00.000Z" }, as: StudyManager, captures: { prop: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "COST_SEGREGATION", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /studies/${st}/scope", payload: { fee_type: "PERCENT", fee_percent_bps: 2500, property_id: "${prop}" }, as: StudyManager }
            - { call: "POST /studies/${st}/assign-engineer", payload: { assigned_engineer_id: "${eng}" }, as: StudyManager }
            - { call: "POST /studies/${st}/asset-components", payload: { component_name: "5yr", asset_class: "FIVE_YEAR", allocated_cost_cents: 10000000 }, as: Engineer, as_user_id: "${eng}", captures: { c5: "$.data.id" } }
            - { call: "POST /studies/${st}/asset-components", payload: { component_name: "15yr", asset_class: "FIFTEEN_YEAR", allocated_cost_cents: 20000000 }, as: Engineer, as_user_id: "${eng}", captures: { c15: "$.data.id" } }
            - { call: "POST /studies/${st}/asset-components", payload: { component_name: "39yr", asset_class: "THIRTY_NINE_YEAR", allocated_cost_cents: 70000000 }, as: Engineer, as_user_id: "${eng}", captures: { c39: "$.data.id" } }
            - { call: "POST /asset-components/${c5}/allocate", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /asset-components/${c15}/allocate", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /asset-components/${c39}/allocate", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /studies/${st}/submit-review", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /studies/${st}/finalize", payload: {}, as: Reviewer, as_user_id: "${rev}" }
          trigger:
            - { call: "GET /studies/${st}/fee-invoices", payload: {}, as: StudyManager, captures: { inv: "$.data[0].id" } }
            - { call: "POST /fee-invoices/${inv}/void", payload: {}, as: StudyManager }
            - { call: "GET /clients/${cli}", payload: {}, as: StudyManager, captures: { out: "$.data.outstanding_fee_cents" } }
          assert:
            - "Client.${cli}.outstanding_fee_cents == 0"
