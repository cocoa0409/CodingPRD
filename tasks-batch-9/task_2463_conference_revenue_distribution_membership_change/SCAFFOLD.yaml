  - method: POST
    path: /championship-events/{id}/settle
    description: "Settle a hosted event, paying the host share out of positive net revenue and restating the linked pool's gross revenue with the participant pool, which invalidates any computed run on that pool."
    roles: [FinanceOfficer]
    input: ["ticket_revenue_cents", "sponsorship_revenue_cents", "event_expense_cents"]
    output: ChampionshipEvent
    side_effects:
      - "runs championship_event_settlement and writes net_event_revenue_cents, host_share_cents and participant_pool_cents, then sets status SETTLED"
      - "adds participant_pool_cents to the linked RevenuePool.gross_revenue_cents"
      - "sets the linked pool back to DRAFT if it was OPEN or BOOKS_CLOSED, clearing audited_expense_cents"
      - "sets every COMPUTED DistributionRun on that pool to SUPERSEDED and every ACTIVE line of those runs to VOIDED"
      - "increments RevenuePool version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CONFERENCE_NOT_INITIALIZED, ERR_CHAMPIONSHIP_EVENT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_EVENT_STATE_INVALID, ERR_POOL_CLOSED_TO_REVENUE]

