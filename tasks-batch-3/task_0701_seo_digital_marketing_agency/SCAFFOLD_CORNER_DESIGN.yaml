        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[retainer-rollover-stale-version]", state_machines.Retainer.ACTIVE_to_ACTIVE]
        distinguishing_aspect: "A second rollover carrying the pre-first-rollover version (expression ${v}-1 ... here ${v_after_activate}) is stale and rejected with ERR_STALE_RETAINER_VERSION (412)."
        test_recipe:
          setup: ["ACTIVE retainer; one successful rollover already performed (version advanced)"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Stale Co", primary_domain: "stale.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "GROWTH", monthly_credits: 20, wholesale_price_cents: 200000 }
              as: AgencyAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retainers/${ret_id}/activate"
              payload: {}
              as: AgencyAdmin
              captures: { v_after_activate: $.data.version }
            - call: "POST /retainers/${ret_id}/rollover"
              payload: { expected_retainer_version: "${v_after_activate}" }
              as: AccountManager
          trigger:
            - call: "POST /retainers/${ret_id}/rollover"
              payload: { expected_retainer_version: "${v_after_activate}" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "second rollover with the now-stale ${v_after_activate} returns error_id == ERR_STALE_RETAINER_VERSION (412)"

      - name: get_client_recomputes_health_derived_field
        claim_type: derived_field_reconciliation
        grounds: [entities.Client.fields.health_score, calculations.account_health_score]
        distinguishing_aspect: "Opening a fresh AUDITED-then-ACTIVE client with no reports/disputes/overdue work yields health_score 100 on GET (derived field reconciled on read)."
        test_recipe:
          setup: ["ACTIVE client, no reports, no disputes, no overdue deliverables"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Der Co", primary_domain: "der.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "GROWTH", monthly_credits: 20, wholesale_price_cents: 200000 }
              as: AgencyAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retainers/${ret_id}/activate"
              payload: {}
              as: AgencyAdmin
          trigger:
            - call: "GET /clients/${cl_id}"
              payload: {}
              as: AgencyAdmin
              captures: { hs: $.data.health_score, st: $.data.status }
          assert:
            - "Client.${cl_id}.status == ACTIVE and health_score == 100"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: assign_visible_in_same_response_immediate
        claim_type: immediate
        grounds: [state_machines.Deliverable.DRAFT_to_ASSIGNED, entities.Retainer.fields.credits_committed]
        distinguishing_aspect: "Immediate consistency: the assign response itself shows status ASSIGNED, and an immediate GET on the retainer shows credits_committed already updated to 3 — no lag."
        test_recipe:
          setup: ["ACTIVE retainer+sprint; DRAFT deliverable cost 3"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { company_name: "Imm2 Co", primary_domain: "imm2.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "GROWTH", monthly_credits: 20, wholesale_price_cents: 200000 }
              as: AgencyAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retainers/${ret_id}/activate"
              payload: {}
              as: AgencyAdmin
              captures: { ret_v: $.data.version }
            - call: "POST /sprints"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", name: "S", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z", capacity_credits: 20 }
              as: AccountManager
              captures: { sp_id: $.data.id }
            - call: "POST /sprints/${sp_id}/start"
              payload: {}
              as: AccountManager
            - call: "POST /deliverables"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", sprint_id: "${sp_id}", kind: "CONTENT", complexity: "STANDARD" }
              as: AccountManager
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /deliverables/${d_id}/assign"
              payload: { expected_retainer_version: "${ret_v}" }
              as: AccountManager
              captures: { st: $.data.status }
            - call: "GET /retainers/${ret_id}"
              payload: {}
              as: AgencyAdmin
              captures: { committed: $.data.credits_committed, avail: $.data.credits_available }
          assert:
            - "assign response shows Deliverable.status == ASSIGNED"
            - "immediate GET shows Retainer.credits_committed == 3 and credits_available == 17"

