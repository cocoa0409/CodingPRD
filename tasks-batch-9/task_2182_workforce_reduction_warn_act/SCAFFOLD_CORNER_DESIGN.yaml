        distinguishing_aspect: "A triggered NY site blocks execution with ERR_WARN_NOTICE_REQUIRED until a notice is ISSUED; a notice whose content_codes omit UNION_NOTICE is refused at issue with ERR_WARN_CONTENT_INCOMPLETE; and issuing an already ISSUED notice answers ERR_INVALID_NOTICE_STATE."
