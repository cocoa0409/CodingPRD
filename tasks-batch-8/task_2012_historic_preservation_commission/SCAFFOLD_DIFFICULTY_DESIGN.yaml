              as: PreservationStaff
              captures: { p_id: $.data.id }
            - call: "POST /preservation/applications"
              payload: { property_id: "${p_id}", owner_id: "${o_id}", application_type: "DEMOLITION", is_visible_from_public_way: true, after_the_fact: false, work_items: [{ category: "DEMOLITION", description: "raze main", estimated_cost_cents: 500000 }] }
              as: Applicant
              as_user_id: "${o_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /preservation/applications/${d1_id}/begin-review"
              payload: {}
              as: PreservationStaff
            - call: "POST /preservation/applications/${d1_id}/accept-completeness"
              payload: { verified_work_items: [{ category: "DEMOLITION", verified_cost_cents: 500000 }] }
              as: PreservationStaff
              as_user_id: "staff-1"
              captures: { d1_v: $.data.version }
            - call: "POST /preservation/applications"
              payload: { property_id: "${p_id}", owner_id: "${o_id}", application_type: "DEMOLITION", is_visible_from_public_way: true, after_the_fact: false, work_items: [{ category: "DEMOLITION", description: "raze garage", estimated_cost_cents: 200000 }] }
              as: Applicant
