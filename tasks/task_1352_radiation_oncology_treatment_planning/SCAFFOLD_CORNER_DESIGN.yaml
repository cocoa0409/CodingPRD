        claim_type: conditional_action
        grounds: [endpoints.POST_/oncology/_clock/set_current_utc, state_machines.TreatmentMachine.OPERATIONAL_to_DOWN]
        distinguishing_aspect: "Without any set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z: a session starting 2026-08-03T09:00 is in the future relative to the default and IS cancelled by the DOWN cascade, producing one OPEN interruption."
