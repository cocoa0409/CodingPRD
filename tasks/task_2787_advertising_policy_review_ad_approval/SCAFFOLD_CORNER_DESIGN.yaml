      - name: rbac_segregation_of_duties_bars_the_issuing_reviewer_from_adjudicating_the_appeal
        claim_type: Segregation of duties
        grounds:
          - validations[priority=58].ERR_SEGREGATION_OF_DUTIES
          - complexity_profile.role_model
          - state_machines.DisapprovalNotice.status.APPEALED_to_APPEAL_UPHELD
        distinguishing_aspect: |
          Both reviewers hold the same role and the same queue authorisations, so this is not a
          permission question but an identity question: the one recorded on
          DisapprovalNotice.decided_by_reviewer_id is refused at priority 58 while any other
          reviewer succeeds on the identical call.
        test_recipe:
          setup:
            - "Rule FIN_CREDIT (auto 0.90, manual 0.20, default_queue STANDARD), one verified advertiser, two interchangeable reviewers R1 and R2 on STANDARD authorised for US."
            - "R1 disapproves the creative for 4.00 points and the advertiser appeals the resulting notice, which is now APPEALED with the appeal SUBMITTED."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.20, default_queue: "STANDARD" }
              as: PolicyAdmin
              captures: { fin_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Beacon Lending Co", country_code: "US", industry_code: "CONSUMER_FINANCE" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "R1 Deciding", queue_specialties: ["STANDARD"], country_authorizations: ["US"], max_concurrent_claims: 3 }
              as: PolicyAdmin
              captures: { rev1: "$.data.id" }
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "R2 Adjudicating", queue_specialties: ["STANDARD"], country_authorizations: ["US"], max_concurrent_claims: 3 }
