scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: demurrage_constructive_vs_actual_basis
        grounds:
          - calculations.demurrage_accrual
          - entities.Customer.fields.demurrage_basis
          - entities.Railcar.fields.demurrage_accrued_cents
        distinguishing_aspect: |
          Entity domain Railcar/demurrage: identical operational data (arrive
          2026-08-03T00:00Z, place 2026-08-05T12:00Z, observe 2026-08-07T06:00Z)
          yields demurrage_billable_days 3 / 22500 cents under CONSTRUCTIVE basis
          but 0 / 0 under ACTUAL basis, because the clock start differs.
        test_recipe:
          setup:
            - "Facility (free_demurrage_hours default 48); customer CONS (basis CONSTRUCTIVE) and customer ACT (basis ACTUAL), each with a lot (rate 5000) and a NON_HAZARDOUS product; tracks T1 and T2 (capacity 1 each); car1 (CONS) and car2 (ACT) both arrived 2026-08-03T00:00Z, both spotted 2026-08-05T12:00Z via spot orders with window [2026-08-05T11:00Z, 2026-08-05T13:00Z); logical clock at 2026-08-07T06:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-DV" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "CONS", allocated_car_spots: 5, demurrage_basis: "CONSTRUCTIVE" }, as: FacilityAdmin, captures: { cust_cons: $.data.id } }
            - { call: "POST /transload/customers", payload: { name: "ACT", allocated_car_spots: 5, demurrage_basis: "ACTUAL" }, as: FacilityAdmin, captures: { cust_act: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Urea", hazard_class: "NON_HAZARDOUS", segregation_group: "FERTILIZER", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust_cons}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot_cons: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust_act}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot_act: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 1 }, as: FacilityAdmin, captures: { t1: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T2", spot_capacity: 1 }, as: FacilityAdmin, captures: { t2: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust_cons}", product_id: "${prod}", lot_id: "${lot_cons}", car_initials: "WATX", car_number: "10001", quantity_loaded_tons: 50.0 }, as: YardMaster, captures: { car1: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust_act}", product_id: "${prod}", lot_id: "${lot_act}", car_initials: "WATX", car_number: "10002", quantity_loaded_tons: 50.0 }, as: YardMaster, captures: { car2: $.data.id } }
            - { call: "POST /transload/railcars/${car1}/arrive", payload: {}, as: YardMaster, captures: { car1_v: $.data.version } }
            - { call: "POST /transload/railcars/${car2}/arrive", payload: {}, as: YardMaster, captures: { car2_v: $.data.version } }
            - { call: "POST /transload/railcars/${car1}/spot-orders", payload: { expected_railcar_version: "${car1_v}", track_id: "${t1}", spot_number: 1, window_start: "2026-08-05T11:00:00Z", window_end: "2026-08-05T13:00:00Z" }, as: YardMaster, captures: { so1: $.data.id } }
            - { call: "POST /transload/railcars/${car2}/spot-orders", payload: { expected_railcar_version: "${car2_v}", track_id: "${t2}", spot_number: 1, window_start: "2026-08-05T11:00:00Z", window_end: "2026-08-05T13:00:00Z" }, as: YardMaster, captures: { so2: $.data.id } }
            - { call: "POST /transload/spot-orders/${so1}/schedule", payload: {}, as: YardMaster }
            - { call: "POST /transload/spot-orders/${so2}/schedule", payload: {}, as: YardMaster }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T12:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/spot-orders/${so1}/execute", payload: {}, as: YardMaster }
            - { call: "POST /transload/spot-orders/${so2}/execute", payload: {}, as: YardMaster }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T06:00:00Z" }, as: FacilityAdmin }
          trigger:
            - { call: "GET /transload/railcars/${car1}", payload: {}, as: YardMaster, captures: { c1_days: $.data.demurrage_billable_days, c1_cents: $.data.demurrage_accrued_cents } }
            - { call: "GET /transload/railcars/${car2}", payload: {}, as: YardMaster, captures: { c2_days: $.data.demurrage_billable_days, c2_cents: $.data.demurrage_accrued_cents } }
          assert:
            - "car1 demurrage_billable_days == 3 and demurrage_accrued_cents == 22500 (elapsed 6120 min - 2880 free = 3240 -> ceil(3240/1440) = 3 days x 7500)"
            - "car2 demurrage_billable_days == 0 and demurrage_accrued_cents == 0 (ACTUAL start at placed 2026-08-05T12:00Z -> elapsed 2520 min < 2880 free)"
            - "car1 arrival_timestamp == 2026-08-03T00:00:00Z and placed_timestamp == 2026-08-05T12:00:00Z for both cars (identical operational data)"
      - name: contamination_strict_vs_weighted_policy
        grounds:
          - calculations.contamination_risk_score
          - entities.Facility.fields.contamination_policy
          - entities.TransferOrder.fields.risk_score
        distinguishing_aspect: |
          Entity domain TransferOrder/contamination (different from Railcar
          demurrage): identical inputs (equipment last product CHEMICAL group,
          incoming PETROLEUM group, both NON_HAZARDOUS) are a hard block under
          STRICT_MATRIX (score 100 -> ERR_CONTAMINATION_RISK) but score 60 and
          activate under WEIGHTED_SCORE.
        test_recipe:
          setup:
            - "Facility with contamination_policy STRICT_MATRIX (default); customer (10 spots); products CHEM (CHEMICAL group) and PETR (PETROLEUM group), both NON_HAZARDOUS, requires_full_clean=false; two lots; one track capacity 2; car1 (CHEM) and car2 (PETR) spotted on spots 1 and 2; equipment EQ; TO1 (car1, EQ) activated then paused so EQ.last_product_id == CHEM product."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-CT" }, as: FacilityAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 10 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Solvent", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod_chem: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "LubeOil", hazard_class: "NON_HAZARDOUS", segregation_group: "PETROLEUM", requires_full_clean: false }, as: FacilityAdmin, captures: { prod_petr: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod_chem}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot1: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod_petr}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot2: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 2 }, as: FacilityAdmin, captures: { trk: $.data.id } }
            - { call: "POST /transload/equipment", payload: { name: "PUMP-1", equipment_type: "PUMP" }, as: FacilityAdmin, captures: { eq: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod_chem}", lot_id: "${lot1}", car_initials: "WATX", car_number: "20001", quantity_loaded_tons: 60.0 }, as: YardMaster, captures: { car1: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod_petr}", lot_id: "${lot2}", car_initials: "WATX", car_number: "20002", quantity_loaded_tons: 60.0 }, as: YardMaster, captures: { car2: $.data.id } }
            - { call: "POST /transload/railcars/${car1}/arrive", payload: {}, as: YardMaster, captures: { car1_v: $.data.version } }
            - { call: "POST /transload/railcars/${car2}/arrive", payload: {}, as: YardMaster, captures: { car2_v: $.data.version } }
            - { call: "POST /transload/railcars/${car1}/spot-orders", payload: { expected_railcar_version: "${car1_v}", track_id: "${trk}", spot_number: 1, window_start: "2026-08-03T01:00:00Z", window_end: "2026-08-03T02:00:00Z" }, as: YardMaster, captures: { so1: $.data.id } }
            - { call: "POST /transload/railcars/${car2}/spot-orders", payload: { expected_railcar_version: "${car2_v}", track_id: "${trk}", spot_number: 2, window_start: "2026-08-03T02:30:00Z", window_end: "2026-08-03T03:30:00Z" }, as: YardMaster, captures: { so2: $.data.id } }
            - { call: "POST /transload/spot-orders/${so1}/schedule", payload: {}, as: YardMaster }
            - { call: "POST /transload/spot-orders/${so2}/schedule", payload: {}, as: YardMaster }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T01:30:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/spot-orders/${so1}/execute", payload: {}, as: YardMaster }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T03:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/spot-orders/${so2}/execute", payload: {}, as: YardMaster }
            - { call: "POST /transload/transfer-orders", payload: { railcar_id: "${car1}", equipment_id: "${eq}", quantity_planned_tons: 30.0 }, as: TransferOperator, captures: { to1: $.data.id } }
            - { call: "POST /transload/transfer-orders/${to1}/activate", payload: {}, as: TransferOperator }
            - { call: "POST /transload/transfer-orders/${to1}/pause", payload: {}, as: TransferOperator }
            - { call: "POST /transload/transfer-orders", payload: { railcar_id: "${car2}", equipment_id: "${eq}", quantity_planned_tons: 30.0 }, as: TransferOperator, captures: { to2: $.data.id } }
          trigger:
            - { call: "POST /transload/transfer-orders/${to2}/activate", payload: {}, as: TransferOperator, captures: { err: $.data.error_id } }
            - { call: "PATCH /transload/facilities/${fac}", payload: { contamination_policy: "WEIGHTED_SCORE" }, as: FacilityAdmin }
            - { call: "POST /transload/transfer-orders/${to2}/activate", payload: {}, as: TransferOperator, captures: { to2_status: $.data.status, to2_risk: $.data.risk_score } }
          assert:
            - "first activate rejected: error_id == ERR_CONTAMINATION_RISK (HTTP 409) under STRICT_MATRIX"
            - "after policy switch: second activate succeeds; TO2.status == ACTIVE and TO2.risk_score == 60 (60*1 group_mismatch + 25*0 + 15*0)"
            - "Equipment.${eq}.status == IN_USE and Railcar.${car2}.placement_status == IN_TRANSFER after second activate"
      - name: sit_calendar_vs_business_days
        grounds:
          - calculations.sit_accrual
          - entities.InventoryLot.fields.sit_day_basis
          - entities.InventoryLot.fields.sit_accrued_cents
        distinguishing_aspect: |
          Entity domain InventoryLot/SIT (third distinct domain): identical
          custody interval (start Mon 2026-08-03T00:00Z, 2 free days, observe Mon
          2026-08-10T00:00Z, rate 5000) yields 5 billable days / 25000 cents under
          CALENDAR but 3 billable days / 15000 under BUSINESS (Aug 5-7 weekdays
          count; Aug 8-9 weekend blocks free).
        test_recipe:
          setup:
            - "Facility (sit_free_days default 2); customer CAL (sit_day_basis CALENDAR) and customer BUS (BUSINESS); one product; lot_cal and lot_bus created at clock 2026-08-03T00:00Z with sit_daily_rate_cents 5000; clock advanced to 2026-08-10T00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-SIT" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "CAL", allocated_car_spots: 5, sit_day_basis: "CALENDAR" }, as: FacilityAdmin, captures: { cust_cal: $.data.id } }
            - { call: "POST /transload/customers", payload: { name: "BUS", allocated_car_spots: 5, sit_day_basis: "BUSINESS" }, as: FacilityAdmin, captures: { cust_bus: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Corn", hazard_class: "FOOD_GRADE", segregation_group: "FOOD_GRAIN", requires_full_clean: true }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust_cal}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot_cal: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust_bus}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot_bus: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: FacilityAdmin }
          trigger:
            - { call: "GET /transload/lots/${lot_cal}", payload: {}, as: FacilityAdmin, captures: { cal_days: $.data.sit_billable_days, cal_cents: $.data.sit_accrued_cents } }
            - { call: "GET /transload/lots/${lot_bus}", payload: {}, as: FacilityAdmin, captures: { bus_days: $.data.sit_billable_days, bus_cents: $.data.sit_accrued_cents } }
          assert:
            - "lot_cal sit_billable_days == 5 and sit_accrued_cents == 25000 (blocks Aug 5,6,7,8,9 all count)"
            - "lot_bus sit_billable_days == 3 and sit_accrued_cents == 15000 (only Aug 5 Wed, 6 Thu, 7 Fri blocks count)"
            - "both lots: sit_free_days == 2 and sit_start_timestamp == 2026-08-03T00:00:00Z (identical custody interval)"
  # =====================================================================
  # Rule 2 — combinatorial_formula
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_line_rounding_then_sum
        grounds:
          - calculations.invoice_total
          - calculations.demurrage_accrual
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: two HAZARDOUS cars of a CREDIT_WATCH customer
          each accrue exactly 1 billable day -> 7500 x 1.5 x 1.25 = 14062.5 cents;
          per-line round_half_up gives 14063 each so the invoice total for the two
          demurrage lines is 28126, NOT the 28125 that sum-then-round would give.
        test_recipe:
          setup:
            - "Facility (free 48h, free_switches_per_period 0); customer WATCH (credit_standing CREDIT_WATCH, CONSTRUCTIVE basis); HAZARDOUS product (requires_full_clean=false); two lots; tracks T1/T2 (cap 1); equipment E1/E2; car1 and car2 (20.0 t each) arrived 2026-08-03T00:00Z, spotted 2026-08-03T10:30Z, fully transferred (ticket net 20.000 each) so both are READY_FOR_RELEASE; clock 2026-08-05T16:00Z at release (elapsed 64h -> 960 billable min -> 1 day)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-INV" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "WATCH", allocated_car_spots: 10, credit_standing: "CREDIT_WATCH" }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Acid", hazard_class: "HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot1: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot2: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 1 }, as: FacilityAdmin, captures: { t1: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T2", spot_capacity: 1 }, as: FacilityAdmin, captures: { t2: $.data.id } }
            - { call: "POST /transload/equipment", payload: { name: "PUMP-A", equipment_type: "PUMP" }, as: FacilityAdmin, captures: { eq1: $.data.id } }
            - { call: "POST /transload/equipment", payload: { name: "PUMP-B", equipment_type: "PUMP" }, as: FacilityAdmin, captures: { eq2: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot1}", car_initials: "WATX", car_number: "30001", quantity_loaded_tons: 20.0 }, as: YardMaster, captures: { car1: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot2}", car_initials: "WATX", car_number: "30002", quantity_loaded_tons: 20.0 }, as: YardMaster, captures: { car2: $.data.id } }
            - { call: "POST /transload/railcars/${car1}/arrive", payload: {}, as: YardMaster, captures: { car1_v: $.data.version } }
            - { call: "POST /transload/railcars/${car2}/arrive", payload: {}, as: YardMaster, captures: { car2_v: $.data.version } }
            - { call: "POST /transload/railcars/${car1}/spot-orders", payload: { expected_railcar_version: "${car1_v}", track_id: "${t1}", spot_number: 1, window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T12:00:00Z" }, as: YardMaster, captures: { so1: $.data.id } }
            - { call: "POST /transload/railcars/${car2}/spot-orders", payload: { expected_railcar_version: "${car2_v}", track_id: "${t2}", spot_number: 1, window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T12:00:00Z" }, as: YardMaster, captures: { so2: $.data.id } }
            - { call: "POST /transload/spot-orders/${so1}/schedule", payload: {}, as: YardMaster }
            - { call: "POST /transload/spot-orders/${so2}/schedule", payload: {}, as: YardMaster }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:30:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/spot-orders/${so1}/execute", payload: {}, as: YardMaster }
            - { call: "POST /transload/spot-orders/${so2}/execute", payload: {}, as: YardMaster }
            - { call: "POST /transload/transfer-orders", payload: { railcar_id: "${car1}", equipment_id: "${eq1}", quantity_planned_tons: 20.0 }, as: TransferOperator, captures: { to1: $.data.id } }
            - { call: "POST /transload/transfer-orders", payload: { railcar_id: "${car2}", equipment_id: "${eq2}", quantity_planned_tons: 20.0 }, as: TransferOperator, captures: { to2: $.data.id } }
            - { call: "POST /transload/transfer-orders/${to1}/activate", payload: {}, as: TransferOperator }
            - { call: "POST /transload/transfer-orders/${to2}/activate", payload: {}, as: TransferOperator }
            - { call: "POST /transload/transfer-orders/${to1}/weight-tickets", payload: { truck_reference: "TRK-A", gross_weight_tons: 34.0, tare_weight_tons: 14.0, truck_max_payload_tons: 40.0 }, as: TransferOperator, captures: { wt1: $.data.id } }
            - { call: "POST /transload/transfer-orders/${to2}/weight-tickets", payload: { truck_reference: "TRK-B", gross_weight_tons: 34.0, tare_weight_tons: 14.0, truck_max_payload_tons: 40.0 }, as: TransferOperator, captures: { wt2: $.data.id } }
            - { call: "POST /transload/weight-tickets/${wt1}/certify", payload: {}, as: TransferOperator }
            - { call: "POST /transload/weight-tickets/${wt2}/certify", payload: {}, as: TransferOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T16:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/railcars/${car1}/release", payload: {}, as: YardMaster }
            - { call: "POST /transload/railcars/${car2}/release", payload: {}, as: YardMaster }
            - { call: "POST /transload/invoices", payload: { customer_id: "${cust}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z" }, as: BillingClerk, captures: { inv: $.data.id } }
          trigger:
            - { call: "POST /transload/invoices/${inv}/issue", payload: {}, as: BillingClerk, captures: { inv_total: $.data.total_cents, inv_count: $.data.charge_count } }
            - { call: "GET /transload/charges?customer_id=${cust}&charge_type=DEMURRAGE", payload: {}, as: BillingClerk, captures: { dem1_amt: "$.data[0].amount_cents", dem2_amt: "$.data[1].amount_cents" } }
          assert:
            - "each DEMURRAGE charge amount_cents == 14063 (7500 x 1.5 x 1.25 = 14062.5, round_half_up per line)"
            - "Invoice.total_cents == 106126 (= 2 x 18500 spot-switch + 2 x 20500 pull-switch + 2 x 14063 demurrage)"
            - "Invoice.charge_count == 6 and Invoice.status == ISSUED"
            - "the two demurrage lines sum to 28126, proving round-per-line-then-sum (sum-then-round would yield 28125)"
      - name: switching_fee_allowance_sequence
        grounds:
          - calculations.switching_fee
          - entities.SwitchOrder.fields.sequence_number
          - entities.SwitchOrder.fields.fee_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the fee of a move depends on the
          per-customer count of chargeable moves in the month, which the move
          itself increments; pinned evaluation order (count pre-existing moves ->
          sequence = count+1 -> fee by sequence vs allowance) makes car A's SPOT
          free (seq 1 <= allowance 1), car B's SPOT 18500 (seq 2), and car A's
          PULL 20500 (seq 3).
        test_recipe:
          setup:
            - "Facility with free_switches_per_period=1, switch_buffer_minutes default 30; customer GOOD; product NON_HAZARDOUS clean=false; track T1 cap 2; car A arrived 2026-08-03T09:00Z with spot order window [10:00,11:00) scheduled (SW seq 1); car B arrived with spot order window [12:00,13:00) on spot 2 scheduled (SW seq 2); car A executed at 10:30, fully transferred 10.000 t, READY_FOR_RELEASE; clock 2026-08-03T13:30Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-SW", free_switches_per_period: 1 }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 5 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Salt", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 2 }, as: FacilityAdmin, captures: { trk: $.data.id } }
            - { call: "POST /transload/equipment", payload: { name: "CONV-1", equipment_type: "CONVEYOR" }, as: FacilityAdmin, captures: { eq: $.data.id } }
