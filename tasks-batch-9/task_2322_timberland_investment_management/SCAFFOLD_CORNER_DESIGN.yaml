        grounds:
          - "entities.Fund.fields.valuation_basis_stale_count"
          - "calculations.fund_nav_and_cash_yield"
          - "state_machines.Property.SIGNED_to_STALE"
          - "state_machines.Property.STALE_to_SUBMITTED"
