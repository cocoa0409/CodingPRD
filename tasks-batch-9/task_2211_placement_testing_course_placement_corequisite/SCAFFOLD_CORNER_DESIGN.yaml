      - name: appeal_review_and_endorsement_each_exclude_the_previous_hand
        claim_type: approval_chain
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]", "errors[ERR_NOT_APPEAL_REVIEWER]", "validations[priority=10]", "validations[priority=11]"]
        distinguishing_aspect: |
          The appeal chain enforces TWO separate separations: the reviewer may not be the
          user who minted the appealed determination (SoD-2) and the endorser may not be
          the reviewer (SoD-3). Both are identity checks against stamps left by earlier
          steps. When the decide step is attempted by the determination's author, SoD-2
          at priority 10 answers BEFORE the reviewer-binding check at priority 11, even
          though both are 403.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Courses MATH-050 and MATH-100; one ACTIVE rule TRANSCRIPT_GPA -> MATH-050 (min_hs_gpa 2.0)."
            - "Student SSD2 (hs_gpa 2.50 VERIFIED, transcript 2025-06-01T00:00:00Z) whose determination was minted by staff-1, and who has filed an appeal requesting MATH-100."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_050: $.data.id }
            - call: "POST /courses"
              payload: { course_code: "MATH-100", title: "College Algebra", subject_area: "MATH", level_rank: 100, units: 4.0, is_support_course: false, transfer_level: true }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_100: $.data.id }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_050}", priority_rank: 10, min_hs_gpa: 2.0, effective_from: "2026-07-01T00:00:00Z", version_label: "V1" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rule: $.data.id }
            - call: "POST /placement-rules/${rule}/activate"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
            - call: "POST /students"
              payload: { student_number: "SSD2", full_name: "Student S D Two", race_ethnicity_code: "HISPANIC", hs_gpa: 2.50, hs_transcript_status: "VERIFIED", transcript_recorded_at: "2025-06-01T00:00:00Z" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { ssd2: $.data.id, ssd2_v: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${ssd2}", subject_area: "MATH", expected_student_version: "${ssd2_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { d_ssd2: $.data.id, d_ssd2_v: $.data.version, d_ssd2_by: $.data.determined_by_user_id }
            - call: "POST /placement-appeals"
              payload: { determination_id: "${d_ssd2}", requested_course_id: "${c_100}", grounds: "NEW_TRANSCRIPT", statement: "My verified transcript shows a higher GPA than the one on file.", expected_determination_version: "${d_ssd2_v}" }
              as: Student
              as_user_id: "${ssd2}"
              captures: { app: $.data.id, app_state: $.data.state }
          trigger:
            - call: "POST /placement-appeals/${app}/start-review"
              payload: {}
              as: Registrar
              as_user_id: "staff-1"
              captures: { e_sod2: $.data.error_id }
            - call: "POST /placement-appeals/${app}/start-review"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { app_review: $.data.state, app_reviewer: $.data.reviewed_by_user_id }
            - call: "POST /placement-appeals/${app}/endorse"
              payload: {}
              as: Instructor
              as_user_id: "registrar-1"
              captures: { e_sod3: $.data.error_id }
            - call: "POST /placement-appeals/${app}/endorse"
              payload: {}
              as: Instructor
              as_user_id: "instructor-1"
              captures: { app_endorsed: $.data.state, app_endorser: $.data.endorsed_by_user_id }
            - call: "POST /placement-appeals/${app}/decide"
              payload: { decision: "GRANT", decision_note: "The author of the determination trying to decide the appeal." }
              as: Registrar
              as_user_id: "staff-1"
              captures: { e_decide: $.data.error_id }
            - call: "GET /placement-appeals/${app}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { app_state_after: $.data.state, app_decided_by: $.data.decided_at }
          assert:
            - "${d_ssd2_by} == \"staff-1\" and ${app_state} == \"SUBMITTED\" (setup)"
            - "${e_sod2} == \"ERR_SEGREGATION_OF_DUTIES\" with HTTP 403 — staff-1 minted the appealed determination, so staff-1 may not take the appeal under review (SoD-2), even though the Registrar role is correct"
            - "${app_review} == \"UNDER_REVIEW\" and ${app_reviewer} == \"registrar-1\" — the reviewer stamp is what the next separation reads"
            - "${e_sod3} == \"ERR_SEGREGATION_OF_DUTIES\" with HTTP 403 — the endorser may not be the reviewer (SoD-3); the identity, not the role, is the problem"
            - "${app_endorsed} == \"INSTRUCTOR_ENDORSED\" and ${app_endorser} == \"instructor-1\""
            - "${e_decide} == \"ERR_SEGREGATION_OF_DUTIES\", NOT \"ERR_NOT_APPEAL_REVIEWER\" — staff-1 violates BOTH (they are not registrar-1 AND they authored the determination), and priority 10 answers ahead of priority 11 despite both being 403"
            - "${app_state_after} == \"INSTRUCTOR_ENDORSED\" and ${app_decided_by} == null — the refused decision left the chain exactly where the endorsement put it"

  # ===========================================================================
  # 8. From Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: Cross-Cutting Complexity Layers
    instances:

      - name: determination_create_rejects_a_stale_student_version_from_any_earlier_write
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.determination-create-stale-student, "errors[ERR_STALE_STUDENT_VERSION]", "validations[priority=7]"]
        distinguishing_aspect: |
          The OCC parent of a determination is the STUDENT, and every write to that
          student invalidates a held version — including POST /students/{id}/measures,
          which is not a determination endpoint at all. The stale request is otherwise
          perfectly legal (a new determination legitimately supersedes the old one), so
          only the version check can stop it, and a rejected attempt must leave the
          version alone so that a refreshed retry works.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Course MATH-050 and one ACTIVE rule TRANSCRIPT_GPA -> MATH-050 (min_hs_gpa 2.0)."
            - "Student SX1 (hs_gpa 2.50 VERIFIED, transcript 2025-06-01T00:00:00Z), version 1."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
