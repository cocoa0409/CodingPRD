  # =================================================================
  # Rule 4 — transitive_cascade (different triggers; depths >= 3 and >= 2)
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: permit_expiry_cascade_depth4
        grounds:
          - state_machines.Permit.ACTIVE_to_EXPIRED
          - state_machines.Face.AVAILABLE_to_PERMIT_SUSPENDED
          - entities.Flight.fields.suspension_started_at
          - entities.Campaign.fields.delivery_posture
        distinguishing_aspect: |
          Trigger = POST /api/_clock/set_current_utc. Chain of four caused links:
          clock sweep expires the Permit (1) -> Face flips to PERMIT_SUSPENDED and
          booking_posture BLOCKED (2) -> the LIVE flight on the face is mutated with
          suspension_started_at (3) -> the flight's Campaign recomputes
          delivery_posture to AT_RISK (4). Each link is caused by the previous link's
          mutation, not by the clock directly.
        test_recipe:
          setup:
            - "Static face F1 (illuminated, 300000) with permit expiring 2026-09-15T00:00:00Z (renewal window opens 2026-08-16)"
            - "Flight 2026-08-10..2026-10-04 (8 weeks, gross 2300000) LIVE via on-time verified posting at clock 2026-08-10; campaign auto-ACTIVE; advertiser limit 90000000"
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "STATIC", base_weekly_cents: 200000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
