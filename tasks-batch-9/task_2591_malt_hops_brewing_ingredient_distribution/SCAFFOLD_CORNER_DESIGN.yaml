              captures: { uc_err: $.data.error_id }
          assert:
            - "${uc_reef_cold} == true on the hop line, so SalesOrder.${uc_reef_id}.requires_cold_chain == true"
            - "ambient order: HTTP 200, ${uc_amb_status} == CONFIRMED and ${uc_amb_total} == 105500 (68500 + 25000 freight with no reefer surcharge + 4500 pallet break + 7500 small-order surcharge)"
            - "reefer order: HTTP 422 with ${uc_err} == ERR_COLD_CHAIN_NOT_CERTIFIED and fulfillment_status still DRAFT"
            - "HopVariety.${uc_citra_id}.available_spot_lbs == 20000 — the refused confirm reserved nothing"
            - "after PUT /brewers/{id}/credit-profile sets cold_chain_certified true with the current expected_brewer_version, the same confirm succeeds with total_cents 95380"
            - "measured before the certification fix: Brewer.${uc_id}.credit_exposure_cents == 105500 — the refused reefer order is still DRAFT and a DRAFT order's total_cents is 0, so it contributes nothing"

      - name: unknown_id_is_reported_before_the_brewer_scope_check
        claim_type: Priority Ordering
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors.ERR_BREWER_NOT_FOUND
          - errors.ERR_BREWER_SCOPE_VIOLATION
        distinguishing_aspect: "Existence at priority 5 is decided before tenancy at priority 6, so a brewer probing a non-existent id gets a 404 and a brewer probing a REAL foreign id gets a 403 — the pair proves the platform is not leaking existence through the scope check, nor hiding it behind one."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Two brewers, PRY and OTHER, both onboarded by the credit desk."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Prying Brewing", brewery_license_no: "BR-1031", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: false, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { pr_id: $.data.id }
            - call: "POST /brewers"
              payload: { name: "Other Brewing", brewery_license_no: "BR-1032", credit_terms_days: 45, credit_limit_cents: 7000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { ot_id: $.data.id }
          trigger:
            - call: "GET /brewers/00000000-0000-4000-8000-000000000999"
              payload: {}
              as: Brewer
              as_user_id: "${pr_id}"
              captures: { pr_err_missing: $.data.error_id }
            - call: "GET /brewers/${ot_id}"
              payload: {}
              as: Brewer
              as_user_id: "${pr_id}"
              captures: { pr_err_scope: $.data.error_id }
            - call: "GET /brewers/${pr_id}"
              payload: {}
              as: Brewer
              as_user_id: "${pr_id}"
              captures: { pr_own_name: $.data.name }
          assert:
            - "unknown id: HTTP 404 with ${pr_err_missing} == ERR_BREWER_NOT_FOUND"
            - "real foreign id: HTTP 403 with ${pr_err_scope} == ERR_BREWER_SCOPE_VIOLATION"
            - "own id: HTTP 200 with ${pr_own_name} == Prying Brewing"
            - "the credit desk reading GET /brewers/${ot_id} gets HTTP 200 — the scope rule binds the Brewer role only"
            - "GET /sales-orders as Brewer with X-User-ID ${pr_id} returns total_count 0 rather than a 403, because list scoping filters instead of refusing"

      - name: payload_shape_is_judged_before_the_duplicate_key
        claim_type: Priority Ordering
        grounds:
          - validations[priority=4]
          - validations[priority=32]
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_DUPLICATE_BREWERY_LICENSE
        distinguishing_aspect: "A request that is BOTH malformed and duplicate reports the malformation, because priority 4 runs before priority 32 — and only after the payload is repaired does the uniqueness collision surface."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One brewer already holding licence BR-1033."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Incumbent Brewing", brewery_license_no: "BR-1033", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: false, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { in_id: $.data.id }
          trigger:
            - call: "POST /brewers"
              payload: { brewery_license_no: "BR-1033", credit_terms_days: 30 }
              as: CreditManager
              captures: { du_err_shape: $.data.error_id }
            - call: "POST /brewers"
              payload: { name: "Impostor Brewing", brewery_license_no: "BR-1033", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: false, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { du_err_dup: $.data.error_id }
            - call: "POST /brewers"
              payload: { name: "Impostor Brewing", brewery_license_no: "BR-1034", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: false, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { du_new_id: $.data.id }
          assert:
            - "malformed and duplicate together: HTTP 422 with ${du_err_shape} == ERR_INVALID_REQUEST — never the 409"
            - "well-formed duplicate: HTTP 409 with ${du_err_dup} == ERR_DUPLICATE_BREWERY_LICENSE"
            - "a fresh licence: HTTP 201 and ${du_new_id} != ${in_id}"
            - "GET /brewers returns total_count 2 — neither refusal left a row behind"
            - "two brewers may share the same name, because only brewery_license_no is a unique key"

      - name: individually_affordable_lines_jointly_overdraw_the_contract
        claim_type: Aggregate validation
        grounds:
          - validations[priority=41]
          - errors.ERR_CONTRACT_VOLUME_EXHAUSTED
          - entities.HopContract.fields.remaining_lbs
