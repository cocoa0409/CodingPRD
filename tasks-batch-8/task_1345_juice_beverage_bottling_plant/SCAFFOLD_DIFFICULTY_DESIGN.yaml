            - { call: "POST /v1/bottling-lines", payload: { line_code: "L-7", supported_container_types: ["PET_473"], nominal_cpm: 200 }, as: PlantManager, captures: { line_id: $.data.id } }
            - { call: "POST /v1/container-lots", payload: { container_type: "PET_473", quantity_received: 5000, supplier_lot_code: "SUP-7" }, as: WarehouseLead, captures: { clot_id: $.data.id } }
            - { call: "POST /v1/container-lots/${clot_id}/qc-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/production-runs", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", container_type: "PET_473", planned_units: 1000, unit_price_cents: 150 }, as: ProductionPlanner, captures: { run1_id: $.data.id, run1_v: $.data.version } }
            - { call: "POST /v1/production-runs/${run1_id}/confirm", payload: {}, as: ProductionPlanner, captures: { run1_v: $.data.version } }
            - { call: "POST /v1/production-runs/${run1_id}/schedule", payload: { batch_id: "${batch_id}", line_id: "${line_id}", scheduled_start_at: "2026-08-11T08:00:00Z", scheduled_end_at: "2026-08-11T12:00:00Z", expected_production_run_version: "${run1_v}" }, as: ProductionPlanner }
