# =============================================================================
# University Course Selection System — benchmark seed tables (v1)
# =============================================================================

scenario: |
  University Course Selection System: Student course selection, prerequisite
  dependency graph, credit limit quota, conflict detection, waitlist,
  professor approval, cross-departmental course selection permissions

domain_name: course-selection
api_prefix: /semesters

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: graph_constraint        # prerequisite DAG, cycle detection, transitive closure
  secondary_archetype: quota_allocation      # credit-hour pool, seat capacity, waitlist promotion
  complexity_layers:
    - optimistic_concurrency                 # enrollment_seq on sections to prevent race conditions
    - cascading_side_effects                 # dropping a course triggers waitlist promotion, credit recalc, prerequisite re-check
    - rate_threshold_triggers                # credit floor/ceiling, GPA thresholds for honors courses
    - derived_field_reconciliation           # section seats_available, student credits_enrolled, waitlist_position

  entity_topology: graph                     # prerequisite DAG between courses, many-to-many enrollment
  state_machine_shape: branching             # enroll/waitlist fork, approve/reject, drop/withdraw
  relationship_patterns:
    - many_to_many                           # students <-> sections via enrollments
    - self_referential                       # Course.prerequisites references other Courses
    - cross_aggregate                        # cross-department permissions reference foreign departments

  role_model: approval_chain                 # Student requests -> Professor approves -> Registrar overrides
  consistency_model: immediate               # all enrollment changes atomic within single request

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Semester
    parent: null
    common_fields: true      # id, opened_on, modified_on, enrollment_seq
    fields:
      - { name: term_label, type: string, source: input, description: "e.g. Fall 2026, Spring 2027" }
      - { name: year, type: integer, source: input, description: "Academic year" }
      - { name: registration_opens, type: datetime, source: input, description: "When students may begin selecting courses" }
      - { name: registration_closes, type: datetime, source: input, description: "Hard deadline for add/drop without penalty" }
      - { name: late_drop_deadline, type: datetime, source: input, description: "Last day for late withdrawal (W grade)" }
      - { name: phase, type: enum, source: system, description: "PLANNING | OPEN_ENROLLMENT | CLOSED_ENROLLMENT | FINALIZED" }

  - name: Department
    parent: Semester
    common_fields: true
    fields:
      - { name: semester_id, type: string, source: system, description: "Parent semester" }
      - { name: dept_code, type: string, source: input, description: "Short code, e.g. CS, MATH, PHYS" }
      - { name: dept_name, type: string, source: input, description: "Full department name" }
      - { name: cross_dept_open, type: boolean, source: input, default: false, description: "Whether non-majors can enroll without explicit permission" }

  - name: Course
    parent: Department
    common_fields: true
    fields:
      - { name: department_id, type: string, source: system, description: "Owning department" }
      - { name: course_code, type: string, source: input, description: "Catalog number, e.g. CS-301" }
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: credit_hours, type: integer, source: input, description: "Credits awarded on completion" }
      - { name: level, type: enum, source: input, description: "INTRODUCTORY | INTERMEDIATE | ADVANCED | GRADUATE" }
      - { name: min_gpa, type: number, source: input, default: 0.0, description: "Minimum cumulative GPA required for enrollment" }
      - { name: prerequisite_ids, type: array, source: input, default: [], description: "List of Course IDs that must be completed before enrollment" }
      - { name: corequisite_ids, type: array, source: input, default: [], description: "Courses that must be taken concurrently or already completed" }
      - { name: is_active, type: boolean, source: system, default: true, description: "Soft-delete flag; inactive courses cannot have new sections" }

  - name: Section
    parent: Course
    common_fields: true
    fields:
      - { name: course_id, type: string, source: system, description: "Parent course" }
      - { name: section_number, type: string, source: input, description: "e.g. 001, 002, LAB-A" }
      - { name: instructor_id, type: string, source: input, description: "Professor teaching this section" }
      - { name: capacity, type: integer, source: input, description: "Maximum enrolled students" }
      - { name: waitlist_cap, type: integer, source: input, default: 10, description: "Maximum students on the waitlist" }
      - { name: schedule_days, type: string, source: input, description: "Meeting days pattern, e.g. MWF, TR" }
      - { name: schedule_start, type: string, source: input, description: "Start time in HH:MM 24h format" }
      - { name: schedule_end, type: string, source: input, description: "End time in HH:MM 24h format" }
      - { name: location, type: string, source: input, description: "Room or building code" }
      - { name: seats_enrolled, type: integer, source: computed, description: "Count of ENROLLED enrollments" }
      - { name: seats_available, type: integer, source: computed, description: "capacity - seats_enrolled" }
      - { name: waitlist_count, type: integer, source: computed, description: "Count of WAITLISTED enrollments" }
      - { name: requires_approval, type: boolean, source: input, default: false, description: "If true, enrollment requires professor sign-off" }
      - { name: enrollment_seq, type: integer, source: system, description: "Monotonic counter for optimistic concurrency" }

  - name: Instructor
    parent: Semester
    common_fields: true
    fields:
      - { name: semester_id, type: string, source: system, description: "Semester scope" }
      - { name: employee_number, type: string, source: input, description: "University employee ID" }
      - { name: full_name, type: string, source: input, description: "Display name" }
      - { name: home_department_id, type: string, source: input, description: "Primary department affiliation" }
      - { name: can_approve_cross_dept, type: boolean, source: input, default: false, description: "May approve students outside home department" }

  - name: Student
    parent: Semester
    common_fields: true
    fields:
      - { name: semester_id, type: string, source: system, description: "Semester scope" }
      - { name: student_number, type: string, source: input, description: "University student ID" }
      - { name: full_name, type: string, source: input, description: "Display name" }
      - { name: major_department_id, type: string, source: input, description: "Declared major department" }
      - { name: academic_standing, type: enum, source: input, default: "GOOD", description: "GOOD | PROBATION | SUSPENDED" }
      - { name: cumulative_gpa, type: number, source: input, description: "Running GPA from prior semesters" }
      - { name: max_credits, type: integer, source: input, default: 18, description: "Per-semester credit ceiling (overridable by registrar)" }
      - { name: credits_enrolled, type: integer, source: computed, description: "Sum of credit_hours for ENROLLED + PENDING_APPROVAL enrollments" }
      - { name: credits_available, type: integer, source: computed, description: "max_credits - credits_enrolled" }
      - { name: completed_course_ids, type: array, source: input, default: [], description: "Course IDs the student has already passed (from transcript)" }

  - name: Enrollment
    parent: Section
    common_fields: true
    fields:
      - { name: section_id, type: string, source: system, description: "Target section" }
      - { name: student_id, type: string, source: input, description: "Enrolling student" }
      - { name: status, type: enum, source: system, description: "PENDING_APPROVAL | ENROLLED | WAITLISTED | DROPPED | WITHDRAWN | REJECTED" }
      - { name: waitlist_position, type: integer, source: computed, description: "Position in waitlist queue (null if not waitlisted)" }
      - { name: enrolled_on, type: datetime, source: system, description: "Timestamp when status became ENROLLED" }
      - { name: dropped_on, type: datetime, source: system, description: "Timestamp when dropped or withdrawn" }
      - { name: approval_note, type: string, source: input, default: null, description: "Professor's note on approval or rejection" }
      - { name: is_cross_dept, type: boolean, source: computed, description: "True when student.major_department_id differs from course's department_id" }
      - { name: enrollment_seq, type: integer, source: system, description: "Snapshot of section.enrollment_seq at last mutation for OCC" }

  - name: CrossDeptPermission
    parent: Semester
    common_fields: true
    fields:
      - { name: semester_id, type: string, source: system, description: "Semester scope" }
      - { name: student_id, type: string, source: input, description: "Permitted student" }
      - { name: target_department_id, type: string, source: input, description: "Department the student is allowed to enroll in" }
      - { name: granted_by, type: string, source: system, description: "Instructor or Registrar who granted permission" }
      - { name: max_courses, type: integer, source: input, default: 2, description: "Maximum courses in that department under this grant" }
      - { name: courses_used, type: integer, source: computed, description: "How many cross-dept enrollments the student currently holds in this department" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED" }

  - name: ScheduleConflict
    parent: null
    common_fields: false     # append-only diagnostic record
    fields:
      - { name: id, type: string, source: system, description: "Conflict record ID" }
      - { name: student_id, type: string, source: system, description: "Student whose schedule overlaps" }
      - { name: section_a_id, type: string, source: system, description: "First conflicting section" }
      - { name: section_b_id, type: string, source: system, description: "Second conflicting section" }
      - { name: overlap_days, type: string, source: computed, description: "Days where overlap occurs, e.g. MW" }
      - { name: overlap_minutes, type: integer, source: computed, description: "Duration of overlap in minutes" }
      - { name: detected_on, type: datetime, source: system, description: "When the conflict was detected" }

  - name: WaitlistPromotion
    parent: null
    common_fields: false     # append-only event log
    fields:
      - { name: id, type: string, source: system, description: "Promotion event ID" }
      - { name: enrollment_id, type: string, source: system, description: "Enrollment that was promoted" }
      - { name: section_id, type: string, source: system, description: "Section where the promotion occurred" }
      - { name: previous_position, type: integer, source: system, description: "Waitlist position before promotion" }
      - { name: trigger_event, type: string, source: system, description: "What caused the seat to open (e.g. drop, withdrawal, capacity increase)" }
      - { name: promoted_on, type: datetime, source: system, description: "When the promotion happened" }

  - name: PrerequisiteGraph
    parent: null
    common_fields: false     # read-only computed view
    fields:
      - { name: course_id, type: string, source: system, description: "Source course" }
      - { name: dependency_chain, type: array, source: computed, description: "Ordered list of transitive prerequisite course IDs (topological sort)" }
      - { name: depth, type: integer, source: computed, description: "Longest chain length from this course to a root (no prerequisites)" }
      - { name: has_cycle, type: boolean, source: computed, description: "True if a cycle was detected involving this course" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Semester
    field: phase
    initial_state: PLANNING
    terminal_states: [FINALIZED]
    transitions:
      - from: PLANNING
        to: OPEN_ENROLLMENT
        trigger: "POST /semesters/{semesterId}/open-enrollment"
        actor: Registrar
        preconditions:
          - "At least one department, one course, and one section must exist"
        side_effects: []

      - from: OPEN_ENROLLMENT
        to: CLOSED_ENROLLMENT
        trigger: "POST /semesters/{semesterId}/close-enrollment"
        actor: Registrar
        preconditions: []
        side_effects:
          - "All PENDING_APPROVAL enrollments auto-rejected with note 'Registration period closed'"
          - "All WAITLISTED enrollments auto-dropped with note 'Registration period closed'"

      - from: CLOSED_ENROLLMENT
        to: FINALIZED
        trigger: "POST /semesters/{semesterId}/finalize"
        actor: Registrar
        preconditions:
          - "No PENDING_APPROVAL enrollments remain"
        side_effects:
          - "All enrollment records become immutable"

      - from: CLOSED_ENROLLMENT
        to: OPEN_ENROLLMENT
        trigger: "POST /semesters/{semesterId}/reopen-enrollment"
        actor: Registrar
        preconditions: []
        side_effects: []
        note: "Late add/drop period — registrar can reopen briefly"

  - entity: Enrollment
    field: status
    initial_state: PENDING_APPROVAL | ENROLLED | WAITLISTED    # depends on section state
    terminal_states: [DROPPED, WITHDRAWN, REJECTED]
    transitions:
      - from: PENDING_APPROVAL
        to: ENROLLED
        trigger: "POST .../enrollments/{enrollmentId}/approve"
        actor: Professor
        preconditions:
          - "Section has available seats (seats_available > 0)"
          - "Student credit limit not exceeded after adding this course"
          - "No schedule conflict with student's existing ENROLLED sections"
        side_effects:
          - "section.seats_enrolled += 1, section.seats_available -= 1"
          - "student.credits_enrolled += course.credit_hours"

      - from: PENDING_APPROVAL
        to: WAITLISTED
        trigger: "POST .../enrollments/{enrollmentId}/approve"
        actor: Professor
        preconditions:
          - "Section is full (seats_available == 0)"
          - "Waitlist not at capacity"
        side_effects:
          - "waitlist_position assigned as section.waitlist_count + 1"
          - "section.waitlist_count += 1"
        note: "Approval when section is full places student on waitlist"

      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST .../enrollments/{enrollmentId}/reject"
        actor: Professor
        preconditions: []
        side_effects:
          - "student.credits_enrolled -= course.credit_hours (release reserved credits)"

      - from: ENROLLED
        to: DROPPED
        trigger: "POST .../enrollments/{enrollmentId}/drop"
        actor: Student | Registrar
        preconditions:
          - "Semester phase is OPEN_ENROLLMENT or within late_drop_deadline"
        side_effects:
          - "section.seats_enrolled -= 1, section.seats_available += 1"
          - "student.credits_enrolled -= course.credit_hours"
          - "Trigger waitlist promotion: top WAITLISTED student auto-enrolled if eligible"
          - "Update cross-dept permission courses_used if is_cross_dept"

      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST .../enrollments/{enrollmentId}/withdraw"
        actor: Registrar
        preconditions:
          - "Current date is past registration_closes but before late_drop_deadline"
        side_effects:
          - "section.seats_enrolled -= 1, section.seats_available += 1"
          - "student.credits_enrolled -= course.credit_hours"
          - "Trigger waitlist promotion"
          - "W grade recorded (not modeled here, just noted)"

      - from: WAITLISTED
        to: ENROLLED
        trigger: "system (waitlist promotion when seat opens)"
        actor: system
        preconditions:
          - "Student still passes prerequisite check"
          - "Student credit limit not exceeded"
          - "No new schedule conflicts since waitlisting"
        side_effects:
          - "section.seats_enrolled += 1, section.seats_available -= 1"
          - "section.waitlist_count -= 1"
          - "student.credits_enrolled += course.credit_hours"
          - "All waitlist_positions above this one shift down by 1"
          - "WaitlistPromotion event created"
        note: "If promotion fails validation, student stays waitlisted and next in queue is tried"

      - from: WAITLISTED
        to: DROPPED
        trigger: "POST .../enrollments/{enrollmentId}/drop"
        actor: Student | Registrar
        preconditions: []
        side_effects:
          - "section.waitlist_count -= 1"
          - "All waitlist_positions above this one shift down by 1"

      - from: PENDING_APPROVAL
        to: DROPPED
        trigger: "POST .../enrollments/{enrollmentId}/drop"
        actor: Student
        preconditions: []
        side_effects:
          - "student.credits_enrolled -= course.credit_hours (release reserved credits)"

  - entity: CrossDeptPermission
    field: status
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST .../cross-dept-permissions/{permissionId}/revoke"
        actor: Registrar | Professor
        preconditions:
          - "No ENROLLED cross-dept enrollments currently depend on this permission"
        side_effects:
          - "WAITLISTED or PENDING_APPROVAL enrollments in that department for this student are auto-dropped"

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: prerequisite_chain_resolution
    trigger: "course creation or prerequisite_ids update"
    algorithm: topological
    formula: |
      For each course C:
        1. Build directed graph: C -> prerequisite_ids[i] for all courses
        2. Run DFS from C to compute transitive closure (all ancestors)
        3. Detect cycles: if DFS revisits C, set has_cycle = true
        4. dependency_chain = topologically sorted list of all transitive prerequisites
        5. depth = length of longest path from C to any root node
    input_set: "All courses in the semester"
    constants: {}
    precision: "exact integer"
    variants:
      - name: strict_chain
        when: "default — all prerequisites must be in completed_course_ids"
        difference: "Every course in dependency_chain must appear in student.completed_course_ids"
      - name: concurrent_enrollment
        when: "corequisite_ids used — courses being taken simultaneously satisfy the requirement"
        difference: "Corequisites may be satisfied by current ENROLLED status, not just completed_course_ids"

  - name: credit_load_computation
    trigger: "enrollment creation, approval, drop, withdrawal, rejection"
    algorithm: aggregation
    formula: |
      credits_enrolled = SUM(course.credit_hours)
        for all enrollments WHERE status IN (ENROLLED, PENDING_APPROVAL)
        AND enrollment.student_id = student.id
      credits_available = student.max_credits - credits_enrolled
    input_set: "All enrollments for the student in this semester"
    constants:
      DEFAULT_MAX_CREDITS: 18
      PROBATION_MAX_CREDITS: 12
      HONORS_MAX_CREDITS: 22
    precision: "exact integer"
    variants:
      - name: standard_load
        when: "student.academic_standing == GOOD"
        difference: "max_credits as set on student record (default 18)"
      - name: probation_load
        when: "student.academic_standing == PROBATION"
        difference: "max_credits capped at 12 regardless of student record setting"
      - name: honors_override
        when: "registrar explicitly sets max_credits above 18"
        difference: "Allows up to 22 credits; must be set before enrollment"

  - name: schedule_overlap_detection
    trigger: "enrollment creation, waitlist promotion"
    algorithm: interval_merge
    formula: |
      For student S with proposed section X:
        existing_sections = all sections where S has status ENROLLED
        For each existing section E:
          common_days = intersection(X.schedule_days, E.schedule_days)
          if common_days is not empty:
            if X.schedule_start < E.schedule_end AND E.schedule_start < X.schedule_end:
              overlap_minutes = min(X.schedule_end, E.schedule_end) - max(X.schedule_start, E.schedule_start)
              CONFLICT detected — create ScheduleConflict record
    input_set: "Student's ENROLLED sections + proposed section"
    constants: {}
    precision: "exact integer minutes"
    variants:
      - name: strict_overlap
        when: "default — any minute of overlap is a conflict"
        difference: "Even 1-minute overlap blocks enrollment"
      - name: back_to_back_buffer
        when: "sections in different buildings"
        difference: "10-minute travel buffer added; sections ending at 10:00 conflict with sections starting before 10:10 in a different location"

  - name: waitlist_position_recomputation
    trigger: "enrollment dropped from waitlist, waitlist promotion, new waitlist entry"
    algorithm: aggregation
    formula: |
      For section S:
        waitlisted = all enrollments WHERE status = WAITLISTED AND section_id = S.id
        sort by original enrolled_on ASC (FIFO)
        for i, enrollment in enumerate(waitlisted):
          enrollment.waitlist_position = i + 1
        section.waitlist_count = len(waitlisted)
    input_set: "All WAITLISTED enrollments for the section"
    constants: {}
    precision: "exact integer"

  - name: section_capacity_summary
    trigger: "any enrollment status change in the section"
    algorithm: aggregation
    formula: |
      seats_enrolled = COUNT(enrollments WHERE status = ENROLLED AND section_id = S.id)
      seats_available = S.capacity - seats_enrolled
      waitlist_count = COUNT(enrollments WHERE status = WAITLISTED AND section_id = S.id)
    input_set: "All enrollments for the section"
    constants: {}
    precision: "exact integer"

  - name: cross_dept_usage_tracking
    trigger: "enrollment creation, drop, withdrawal for cross-dept enrollments"
    algorithm: aggregation
    formula: |
      For CrossDeptPermission P:
        courses_used = COUNT(enrollments WHERE
          student_id = P.student_id AND
          status IN (ENROLLED, PENDING_APPROVAL, WAITLISTED) AND
          course.department_id = P.target_department_id)
    input_set: "All enrollments for the student in the target department"
    constants: {}
    precision: "exact integer"

  - name: waitlist_promotion_cascade
    trigger: "seat becomes available (drop, withdrawal, capacity increase)"
    algorithm: waterfall_allocation
    formula: |
      When a seat opens in section S:
        candidates = WAITLISTED enrollments for S, ordered by waitlist_position ASC
        for candidate in candidates:
          if passes_prerequisite_check(candidate.student) AND
             passes_credit_limit(candidate.student) AND
             passes_schedule_check(candidate.student, S):
            promote candidate: status -> ENROLLED
            create WaitlistPromotion event
            recompute section capacity and student credits
            BREAK (only one seat opened)
          else:
            skip candidate, try next
            # candidate remains WAITLISTED at current position
    input_set: "WAITLISTED enrollments for the section, student records"
    constants: {}
    precision: "N/A"
    variants:
      - name: single_seat
        when: "one student drops"
        difference: "Exactly one seat to fill; first eligible waitlisted student wins"
      - name: capacity_increase
        when: "section capacity increased via PATCH"
        difference: "Multiple seats may open; run promotion loop for each new seat"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-Student-Number or X-Instructor-Id or X-Registrar-Id header must be present; X-Caller-Role must be one of Student, Professor, Registrar"
    error_id: ENROLLMENT_AUTH_MISSING
    http_status: 401
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Caller role must be authorized for the requested operation"
    error_id: ENROLLMENT_ROLE_DENIED
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Semester referenced in path must exist"
    error_id: SEMESTER_UNKNOWN
    http_status: 404
    applies_to: all nested endpoints under /semesters/{semesterId}

  - priority: 4
    category: existence
    check: "Department referenced in path must exist and belong to this semester"
    error_id: DEPARTMENT_UNKNOWN
    http_status: 404
    applies_to: department-scoped endpoints

  - priority: 5
    category: existence
    check: "Course referenced in path must exist and belong to this department"
    error_id: COURSE_UNKNOWN
    http_status: 404
    applies_to: course-scoped endpoints

  - priority: 6
    category: existence
    check: "Section referenced in path must exist and belong to this course"
    error_id: SECTION_UNKNOWN
    http_status: 404
    applies_to: section-scoped endpoints

  - priority: 7
    category: existence
    check: "Student referenced in body must exist in this semester"
    error_id: STUDENT_UNKNOWN
    http_status: 404
    applies_to: enrollment creation

  - priority: 8
    category: existence
    check: "Enrollment referenced in path must exist"
    error_id: ENROLLMENT_UNKNOWN
    http_status: 404
    applies_to: enrollment action endpoints

  - priority: 9
    category: state
    check: "Semester must be in OPEN_ENROLLMENT phase for enrollment mutations"
    error_id: REGISTRATION_NOT_OPEN
    http_status: 409
    applies_to: enrollment creation, approve, reject, drop (except registrar withdraw)

  - priority: 10
    category: state
    check: "Enrollment must be in the correct status for the requested transition"
    error_id: ENROLLMENT_STATE_INVALID
    http_status: 409
    applies_to: all enrollment action endpoints

  - priority: 11
    category: state
    check: "Semester must be in the correct phase for the requested phase transition"
    error_id: SEMESTER_PHASE_INVALID
    http_status: 409
    applies_to: semester phase transition endpoints

  - priority: 12
    category: business_constraint
    check: "Student academic_standing must not be SUSPENDED"
    error_id: STUDENT_SUSPENDED
    http_status: 403
    applies_to: enrollment creation

  - priority: 13
    category: business_constraint
    check: "All prerequisite courses must be in student.completed_course_ids (transitive closure)"
    error_id: PREREQUISITE_NOT_MET
    http_status: 422
    applies_to: enrollment creation, waitlist promotion

  - priority: 14
    category: business_constraint
    check: "Corequisite courses must be either completed or concurrently enrolled"
    error_id: COREQUISITE_NOT_SATISFIED
    http_status: 422
    applies_to: enrollment creation, waitlist promotion

  - priority: 15
    category: business_constraint
    check: "Prerequisite graph for the course must not contain a cycle"
    error_id: PREREQUISITE_CYCLE_DETECTED
    http_status: 422
    applies_to: course creation, course prerequisite update

  - priority: 16
    category: business_constraint
    check: "Student must not already have an active enrollment (ENROLLED, PENDING_APPROVAL, WAITLISTED) in another section of the same course"
    error_id: DUPLICATE_COURSE_ENROLLMENT
    http_status: 409
    applies_to: enrollment creation

  - priority: 17
    category: business_temporal
    check: "Proposed section must not conflict with student's existing enrolled sections (schedule overlap)"
    error_id: SCHEDULE_CONFLICT
    http_status: 409
    applies_to: enrollment creation, waitlist promotion

  - priority: 18
    category: business_constraint
    check: "Cross-departmental enrollment requires either dept.cross_dept_open=true or an ACTIVE CrossDeptPermission"
    error_id: CROSS_DEPT_NOT_PERMITTED
    http_status: 403
    applies_to: enrollment creation where is_cross_dept=true

  - priority: 19
    category: business_constraint
    check: "CrossDeptPermission.courses_used must be < max_courses"
    error_id: CROSS_DEPT_LIMIT_REACHED
    http_status: 422
    applies_to: enrollment creation where cross-dept permission is used

  - priority: 20
    category: business_constraint
    check: "Student cumulative_gpa must meet course.min_gpa threshold"
    error_id: GPA_BELOW_MINIMUM
    http_status: 422
    applies_to: enrollment creation

  - priority: 21
    category: business_fiscal
    check: "Student credits_enrolled + course.credit_hours must not exceed student.max_credits (or probation cap)"
    error_id: CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: enrollment creation, approve, waitlist promotion

  - priority: 22
    category: business_constraint
    check: "Section must have available seats for direct enrollment (seats_available > 0)"
    error_id: SECTION_FULL
    http_status: 409
    applies_to: enrollment creation (when not auto-waitlisting)
    description: "If section is full and waitlist has room, student is waitlisted instead of rejected"

  - priority: 23
    category: business_constraint
    check: "Waitlist must not be at capacity (waitlist_count < waitlist_cap)"
    error_id: WAITLIST_FULL
    http_status: 409
    applies_to: enrollment creation when section is full

  - priority: 24
    category: business_constraint
    check: "Optimistic concurrency: provided enrollment_seq must match section's current enrollment_seq"
    error_id: ENROLLMENT_CONFLICT
    http_status: 409
    applies_to: all enrollment mutation endpoints that supply enrollment_seq

  - priority: 25
    category: business_temporal
    check: "Withdrawal requires current date between registration_closes and late_drop_deadline"
    error_id: WITHDRAWAL_WINDOW_CLOSED
    http_status: 422
    applies_to: enrollment withdraw

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "result": { "request_id": "csel_xxx", "timestamp": "ISO8601Z" },
      "kind": "single" | "list", "payload": {} | [] }
  error: |
    { "result": { "request_id": "csel_xxx", "timestamp": "ISO8601Z" },
      "kind": "error", "payload": { "code": "PREREQUISITE_NOT_MET", "detail": "..." } }
  pagination_fields: ["page_size", "page_token", "total_results", "next_page_token"]
  pagination_defaults: { page_size: 20, min: 1, max: 50 }

endpoints:
  # --- Semester ---
  - method: POST
    path: "/semesters"
    description: "Create a new semester"
    roles: [Registrar]
    code: 201
    input: [term_label, year, registration_opens, registration_closes, late_drop_deadline]
    output: Semester
    side_effects: ["phase = PLANNING"]

  - method: GET
    path: "/semesters"
    description: "List all semesters"
    roles: [Any]
    code: 200
    input: ["page_size?, page_token?"]
    output: "Semester[]"
    side_effects: []

  - method: GET
    path: "/semesters/{semesterId}"
    description: "Get semester details"
    roles: [Any]
    code: 200
    input: []
    output: Semester
    side_effects: []

  - method: POST
    path: "/semesters/{semesterId}/open-enrollment"
    description: "Transition semester to OPEN_ENROLLMENT"
    roles: [Registrar]
    code: 200
    input: []
    output: Semester
    side_effects: ["phase -> OPEN_ENROLLMENT"]

  - method: POST
    path: "/semesters/{semesterId}/close-enrollment"
    description: "Transition semester to CLOSED_ENROLLMENT"
    roles: [Registrar]
    code: 200
    input: []
    output: Semester
    side_effects:
      - "phase -> CLOSED_ENROLLMENT"
      - "Auto-reject PENDING_APPROVAL enrollments"
      - "Auto-drop WAITLISTED enrollments"

  - method: POST
    path: "/semesters/{semesterId}/reopen-enrollment"
    description: "Reopen enrollment from CLOSED_ENROLLMENT"
    roles: [Registrar]
    code: 200
    input: []
    output: Semester
    side_effects: ["phase -> OPEN_ENROLLMENT"]

  - method: POST
    path: "/semesters/{semesterId}/finalize"
    description: "Finalize the semester — all enrollments become immutable"
    roles: [Registrar]
    code: 200
    input: []
    output: Semester
    side_effects: ["phase -> FINALIZED; all enrollment records locked"]

  # --- Department ---
  - method: POST
    path: "/semesters/{semesterId}/departments"
    description: "Create a department within a semester"
    roles: [Registrar]
    code: 201
    input: ["dept_code, dept_name, cross_dept_open?"]
    output: Department
    side_effects: []

  - method: GET
    path: "/semesters/{semesterId}/departments"
    description: "List departments in a semester"
    roles: [Any]
    code: 200
    input: ["page_size?, page_token?"]
    output: "Department[]"
    side_effects: []

  - method: GET
    path: "/semesters/{semesterId}/departments/{departmentId}"
    description: "Get department details"
    roles: [Any]
    code: 200
    input: []
    output: Department
    side_effects: []

  # --- Course ---
  - method: POST
    path: "/semesters/{semesterId}/departments/{departmentId}/courses"
    description: "Create a course with prerequisites and corequisites"
    roles: [Registrar, Professor]
    code: 201
    input: ["course_code, title, credit_hours, level, min_gpa?, prerequisite_ids?, corequisite_ids?"]
    output: Course
    side_effects: ["Prerequisite graph recomputed; cycle detection triggered"]

  - method: GET
    path: "/semesters/{semesterId}/departments/{departmentId}/courses"
    description: "List courses in a department"
    roles: [Any]
    code: 200
    input: ["page_size?, page_token?, level?"]
    output: "Course[]"
    side_effects: []

  - method: GET
    path: "/semesters/{semesterId}/departments/{departmentId}/courses/{courseId}"
    description: "Get course details including prerequisite chain"
    roles: [Any]
    code: 200
    input: []
    output: Course
    side_effects: []

  - method: PATCH
    path: "/semesters/{semesterId}/departments/{departmentId}/courses/{courseId}"
    description: "Update course fields (prerequisite_ids, min_gpa, is_active)"
    roles: [Registrar]
    code: 200
    input: ["prerequisite_ids?, corequisite_ids?, min_gpa?, is_active?"]
    output: Course
    side_effects: ["Prerequisite graph recomputed if prerequisite_ids changed"]

  - method: GET
    path: "/semesters/{semesterId}/departments/{departmentId}/courses/{courseId}/prerequisite-graph"
    description: "Get the full transitive prerequisite graph for a course"
    roles: [Any]
    code: 200
    input: []
    output: PrerequisiteGraph
    side_effects: []

  # --- Section ---
  - method: POST
    path: "/semesters/{semesterId}/departments/{departmentId}/courses/{courseId}/sections"
    description: "Create a section for a course"
    roles: [Registrar, Professor]
    code: 201
    input: ["section_number, instructor_id, capacity, waitlist_cap?, schedule_days, schedule_start, schedule_end, location, requires_approval?"]
    output: Section
    side_effects: ["seats_enrolled=0, seats_available=capacity, waitlist_count=0, enrollment_seq=1"]

  - method: GET
    path: "/semesters/{semesterId}/departments/{departmentId}/courses/{courseId}/sections"
    description: "List sections for a course"
    roles: [Any]
    code: 200
    input: ["page_size?, page_token?"]
    output: "Section[]"
    side_effects: []

  - method: GET
    path: "/semesters/{semesterId}/departments/{departmentId}/courses/{courseId}/sections/{sectionId}"
    description: "Get section details with live capacity counts"
    roles: [Any]
    code: 200
    input: []
    output: Section
    side_effects: []

  - method: PATCH
    path: "/semesters/{semesterId}/departments/{departmentId}/courses/{courseId}/sections/{sectionId}"
    description: "Update section capacity, schedule, or requires_approval"
    roles: [Registrar, Professor]
    code: 200
    input: ["capacity?, waitlist_cap?, schedule_days?, schedule_start?, schedule_end?, location?, requires_approval?, enrollment_seq?"]
    output: Section
    side_effects:
      - "If capacity increased, trigger waitlist_promotion_cascade for each new seat"
      - "If schedule changed, detect new conflicts for all ENROLLED students"

  # --- Enrollment ---
  - method: POST
    path: "/semesters/{semesterId}/departments/{departmentId}/courses/{courseId}/sections/{sectionId}/enrollments"
    description: "Request enrollment in a section"
    roles: [Student, Registrar]
    code: 201
    input: ["student_id, enrollment_seq?"]
    output: Enrollment
    side_effects:
      - "Full validation chain: auth, existence, state, prerequisites, corequisites, GPA, schedule, cross-dept, credits"
      - "If requires_approval: status=PENDING_APPROVAL, credits reserved"
      - "If section full + waitlist open: status=WAITLISTED"
      - "If section has room: status=ENROLLED, section/student counters updated"
      - "ScheduleConflict record created if overlap detected (blocks enrollment)"
      - "is_cross_dept computed and cross-dept permission checked"

  - method: GET
    path: "/semesters/{semesterId}/departments/{departmentId}/courses/{courseId}/sections/{sectionId}/enrollments"
    description: "List enrollments for a section"
    roles: [Any]
    code: 200
    input: ["page_size?, page_token?, status?"]
    output: "Enrollment[]"
    side_effects: []

  - method: GET
    path: "/semesters/{semesterId}/departments/{departmentId}/courses/{courseId}/sections/{sectionId}/enrollments/{enrollmentId}"
    description: "Get enrollment details"
    roles: [Any]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: POST
    path: "/semesters/{semesterId}/departments/{departmentId}/courses/{courseId}/sections/{sectionId}/enrollments/{enrollmentId}/approve"
    description: "Professor approves a pending enrollment"
    roles: [Professor]
    code: 200
    input: ["approval_note?, enrollment_seq?"]
    output: Enrollment
    side_effects:
      - "If seats available: status -> ENROLLED"
      - "If section full + waitlist open: status -> WAITLISTED"
      - "Section and student counters updated"

  - method: POST
    path: "/semesters/{semesterId}/departments/{departmentId}/courses/{courseId}/sections/{sectionId}/enrollments/{enrollmentId}/reject"
    description: "Professor rejects a pending enrollment"
    roles: [Professor]
    code: 200
    input: ["approval_note?, enrollment_seq?"]
    output: Enrollment
    side_effects:
      - "status -> REJECTED"
      - "student.credits_enrolled decreased"

  - method: POST
    path: "/semesters/{semesterId}/departments/{departmentId}/courses/{courseId}/sections/{sectionId}/enrollments/{enrollmentId}/drop"
    description: "Drop an enrollment (from ENROLLED, WAITLISTED, or PENDING_APPROVAL)"
    roles: [Student, Registrar]
    code: 200
    input: ["enrollment_seq?"]
    output: Enrollment
    side_effects:
      - "status -> DROPPED"
      - "Counters adjusted on section and student"
      - "Waitlist promotion triggered if dropping from ENROLLED"
      - "Waitlist reordered if dropping from WAITLISTED"

  - method: POST
    path: "/semesters/{semesterId}/departments/{departmentId}/courses/{courseId}/sections/{sectionId}/enrollments/{enrollmentId}/withdraw"
    description: "Late withdrawal with W grade (registrar only, within window)"
    roles: [Registrar]
    code: 200
    input: ["enrollment_seq?"]
    output: Enrollment
    side_effects:
      - "status -> WITHDRAWN"
      - "Counters adjusted"
      - "Waitlist promotion triggered"

  # --- Instructor ---
  - method: POST
    path: "/semesters/{semesterId}/instructors"
    description: "Register an instructor for the semester"
    roles: [Registrar]
    code: 201
    input: ["employee_number, full_name, home_department_id, can_approve_cross_dept?"]
    output: Instructor
    side_effects: []

  - method: GET
    path: "/semesters/{semesterId}/instructors"
    description: "List instructors"
    roles: [Any]
    code: 200
    input: ["page_size?, page_token?"]
    output: "Instructor[]"
    side_effects: []

  - method: GET
    path: "/semesters/{semesterId}/instructors/{instructorId}"
    description: "Get instructor details"
    roles: [Any]
    code: 200
    input: []
    output: Instructor
    side_effects: []

  # --- Student ---
  - method: POST
    path: "/semesters/{semesterId}/students"
    description: "Register a student for the semester"
    roles: [Registrar]
    code: 201
    input: ["student_number, full_name, major_department_id, academic_standing?, cumulative_gpa, max_credits?, completed_course_ids?"]
    output: Student
    side_effects: ["credits_enrolled = 0, credits_available = max_credits"]

  - method: GET
    path: "/semesters/{semesterId}/students"
    description: "List students"
    roles: [Any]
    code: 200
    input: ["page_size?, page_token?, academic_standing?"]
    output: "Student[]"
    side_effects: []

  - method: GET
    path: "/semesters/{semesterId}/students/{studentId}"
    description: "Get student details with current credit load"
    roles: [Any]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: PATCH
    path: "/semesters/{semesterId}/students/{studentId}"
    description: "Update student max_credits or completed_course_ids (registrar override)"
    roles: [Registrar]
    code: 200
    input: ["max_credits?, completed_course_ids?, academic_standing?"]
    output: Student
    side_effects: ["credits_available recomputed"]

  - method: GET
    path: "/semesters/{semesterId}/students/{studentId}/schedule"
    description: "Get student's full schedule (all ENROLLED sections with times)"
    roles: [Student, Registrar, Professor]
    code: 200
    input: []
    output: "Section[]"
    side_effects: []

  # --- CrossDeptPermission ---
  - method: POST
    path: "/semesters/{semesterId}/cross-dept-permissions"
    description: "Grant a student permission to enroll in another department"
    roles: [Registrar, Professor]
    code: 201
    input: ["student_id, target_department_id, max_courses?"]
    output: CrossDeptPermission
    side_effects: ["courses_used = 0, status = ACTIVE"]

  - method: GET
    path: "/semesters/{semesterId}/cross-dept-permissions"
    description: "List cross-department permissions"
    roles: [Any]
    code: 200
    input: ["page_size?, page_token?, student_id?, target_department_id?"]
    output: "CrossDeptPermission[]"
    side_effects: []

  - method: GET
    path: "/semesters/{semesterId}/cross-dept-permissions/{permissionId}"
    description: "Get cross-department permission details"
    roles: [Any]
    code: 200
    input: []
    output: CrossDeptPermission
    side_effects: []

  - method: POST
    path: "/semesters/{semesterId}/cross-dept-permissions/{permissionId}/revoke"
    description: "Revoke a cross-department permission"
    roles: [Registrar, Professor]
    code: 200
    input: []
    output: CrossDeptPermission
    side_effects:
      - "status -> REVOKED"
      - "WAITLISTED/PENDING_APPROVAL enrollments in that dept for this student auto-dropped"

  # --- Computed / Diagnostic ---
  - method: GET
    path: "/semesters/{semesterId}/schedule-conflicts"
    description: "List all detected schedule conflicts in the semester"
    roles: [Registrar]
    code: 200
    input: ["page_size?, page_token?, student_id?"]
    output: "ScheduleConflict[]"
    side_effects: []

  - method: GET
    path: "/semesters/{semesterId}/waitlist-promotions"
    description: "List waitlist promotion events"
    roles: [Registrar]
    code: 200
    input: ["page_size?, page_token?, section_id?"]
    output: "WaitlistPromotion[]"
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Authentication & Authorization ---
  - id: ENROLLMENT_AUTH_MISSING
    http: 401
    condition: "Required identity header (X-Student-Number, X-Instructor-Id, or X-Registrar-Id) or X-Caller-Role is missing or invalid"

  - id: ENROLLMENT_ROLE_DENIED
    http: 403
    condition: "Caller's role does not have permission for the requested operation"

  # --- Resource Not Found ---
  - id: SEMESTER_UNKNOWN
    http: 404
    condition: "Semester with the given semesterId does not exist"

  - id: DEPARTMENT_UNKNOWN
    http: 404
    condition: "Department with the given departmentId does not exist in this semester"

  - id: COURSE_UNKNOWN
    http: 404
    condition: "Course with the given courseId does not exist in this department"

  - id: SECTION_UNKNOWN
    http: 404
    condition: "Section with the given sectionId does not exist for this course"

  - id: STUDENT_UNKNOWN
    http: 404
    condition: "Student with the given studentId does not exist in this semester"

  - id: INSTRUCTOR_UNKNOWN
    http: 404
    condition: "Instructor with the given instructorId does not exist in this semester"

  - id: ENROLLMENT_UNKNOWN
    http: 404
    condition: "Enrollment with the given enrollmentId does not exist"

  - id: CROSS_DEPT_PERMISSION_UNKNOWN
    http: 404
    condition: "CrossDeptPermission with the given permissionId does not exist"

  # --- State Errors ---
  - id: REGISTRATION_NOT_OPEN
    http: 409
    condition: "Semester is not in OPEN_ENROLLMENT phase; enrollment mutations blocked"

  - id: ENROLLMENT_STATE_INVALID
    http: 409
    condition: "Enrollment is not in the required status for the requested transition"

  - id: SEMESTER_PHASE_INVALID
    http: 409
    condition: "Semester is not in the required phase for the requested phase transition"

  # --- Prerequisite & Corequisite ---
  - id: PREREQUISITE_NOT_MET
    http: 422
    condition: "Student has not completed one or more prerequisite courses in the transitive chain"

  - id: COREQUISITE_NOT_SATISFIED
    http: 422
    condition: "Required corequisite course is neither completed nor concurrently enrolled"

  - id: PREREQUISITE_CYCLE_DETECTED
    http: 422
    condition: "Adding this prerequisite would create a cycle in the prerequisite dependency graph"

  # --- Enrollment Constraints ---
  - id: DUPLICATE_COURSE_ENROLLMENT
    http: 409
    condition: "Student already has an active enrollment (ENROLLED, PENDING_APPROVAL, or WAITLISTED) in another section of the same course"

  - id: SCHEDULE_CONFLICT
    http: 409
    condition: "Proposed section's schedule overlaps with one of the student's existing enrolled sections"

  - id: SECTION_FULL
    http: 409
    condition: "Section has no available seats and waitlist is also at capacity"

  - id: WAITLIST_FULL
    http: 409
    condition: "Section waitlist has reached its cap; no more waitlist entries allowed"

  - id: STUDENT_SUSPENDED
    http: 403
    condition: "Student with academic_standing SUSPENDED cannot enroll in courses"

  - id: GPA_BELOW_MINIMUM
    http: 422
    condition: "Student's cumulative_gpa is below the course's min_gpa requirement"

  - id: CREDIT_LIMIT_EXCEEDED
    http: 422
    condition: "Enrolling in this course would push student's credits_enrolled beyond max_credits"

  # --- Cross-Department ---
  - id: CROSS_DEPT_NOT_PERMITTED
    http: 403
    condition: "Student's major department differs from the course department, and no cross-dept permission or open enrollment flag exists"

  - id: CROSS_DEPT_LIMIT_REACHED
    http: 422
    condition: "Student has already used all allowed cross-department course slots for this department"

  - id: CROSS_DEPT_REVOKE_BLOCKED
    http: 409
    condition: "Cannot revoke permission while student has ENROLLED enrollments depending on it"

  # --- Concurrency ---
  - id: ENROLLMENT_CONFLICT
    http: 409
    condition: "Provided enrollment_seq does not match the section's current enrollment_seq (stale data)"

  # --- Temporal ---
  - id: WITHDRAWAL_WINDOW_CLOSED
    http: 422
    condition: "Late withdrawal is only allowed between registration_closes and late_drop_deadline"

  # --- Pagination ---
  - id: INVALID_PAGE_PARAMS
    http: 400
    condition: "page_size out of range (1-50) or page_token is malformed"

  # --- Course Lifecycle ---
  - id: COURSE_INACTIVE
    http: 409
    condition: "Cannot create sections for an inactive course (is_active=false)"

  # --- Waitlist Promotion Failure (informational, logged but not returned to caller) ---
  - id: WAITLIST_PROMOTION_SKIPPED
    http: 422
    condition: "Waitlisted student failed re-validation during promotion (prerequisites changed, credits exceeded, or schedule conflict emerged)"

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: Registrar
    description: "University registrar — manages semesters, departments, students, instructors, cross-dept permissions, and can override enrollment actions"
    exclusive_operations:
      - "POST /semesters — Create semester"
      - "POST .../open-enrollment — Open enrollment"
      - "POST .../close-enrollment — Close enrollment"
      - "POST .../reopen-enrollment — Reopen enrollment"
      - "POST .../finalize — Finalize semester"
      - "POST .../departments — Create department"
      - "POST .../instructors — Register instructor"
      - "POST .../students — Register student"
      - "PATCH .../students/{id} — Override student max_credits, standing, transcript"
      - "POST .../enrollments/{id}/withdraw — Late withdrawal with W grade"
      - "GET .../schedule-conflicts — View conflict report"
      - "GET .../waitlist-promotions — View promotion log"
    shared_operations:
      - "POST .../courses — Create course (shared with Professor)"
      - "PATCH .../courses/{id} — Update course (Registrar only for prerequisite changes)"
      - "POST .../sections — Create section (shared with Professor)"
      - "PATCH .../sections/{id} — Update section (shared with Professor)"
      - "POST .../enrollments — Enroll on behalf of student (shared with Student)"
      - "POST .../enrollments/{id}/drop — Drop enrollment (shared with Student)"
      - "POST .../cross-dept-permissions — Grant permission (shared with Professor)"
      - "POST .../cross-dept-permissions/{id}/revoke — Revoke permission (shared with Professor)"
      - "All GET endpoints"

  - name: Professor
    description: "Course instructor — manages own course sections, approves/rejects enrollment requests, can grant cross-dept permissions for own department"
    exclusive_operations:
      - "POST .../enrollments/{id}/approve — Approve pending enrollment"
      - "POST .../enrollments/{id}/reject — Reject pending enrollment"
    shared_operations:
      - "POST .../courses — Create course (shared with Registrar)"
      - "POST .../sections — Create section (shared with Registrar)"
      - "PATCH .../sections/{id} — Update section (shared with Registrar, own sections only)"
      - "POST .../cross-dept-permissions — Grant permission (shared with Registrar, own dept only)"
      - "POST .../cross-dept-permissions/{id}/revoke — Revoke permission (shared with Registrar)"
      - "All GET endpoints"

  - name: Student
    description: "Enrolled student — can request enrollment, drop own enrollments, view own schedule"
    exclusive_operations: []
    shared_operations:
      - "POST .../enrollments — Request enrollment (shared with Registrar)"
      - "POST .../enrollments/{id}/drop — Drop own enrollment (shared with Registrar)"
      - "GET .../students/{id}/schedule — View own schedule"
      - "All GET endpoints (read-only access to catalog)"

  - name: Any
    description: "Any authenticated caller"
    shared_operations:
      - "GET /semesters — List semesters"
      - "GET /semesters/{id} — Get semester details"
      - "GET .../departments — List departments"
      - "GET .../departments/{id} — Get department details"
      - "GET .../courses — List courses"
      - "GET .../courses/{id} — Get course details"
      - "GET .../courses/{id}/prerequisite-graph — View prerequisite chain"
      - "GET .../sections — List sections"
      - "GET .../sections/{id} — Get section details"
      - "GET .../enrollments — List enrollments"
      - "GET .../enrollments/{id} — Get enrollment details"
      - "GET .../instructors — List instructors"
      - "GET .../instructors/{id} — Get instructor details"
      - "GET .../students — List students"
      - "GET .../students/{id} — Get student details"
      - "GET .../cross-dept-permissions — List permissions"
      - "GET .../cross-dept-permissions/{id} — Get permission details"
