            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/courier-services", payload: { name: "Speedy", serves_station_ids: ["${stn}"], turnaround_buffer_minutes: 60 }, as: SystemAdmin, captures: { crr: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234581", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag_a: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234582", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag_b: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234583", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag_c: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00081", passenger_id: "${pax}", bag_tag_id: "${bag_a}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt_a: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00082", passenger_id: "${pax}", bag_tag_id: "${bag_b}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt_b: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00083", passenger_id: "${pax}", bag_tag_id: "${bag_c}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt_c: $.data.id } }
            - { call: "POST /baggage/reports/${rpt_a}/tracing-events", payload: { carrier_id: "${car_aa}", station_id: "${stn}", event_type: "LOCATED" }, as: BaggageServiceAgent }
            - { call: "POST /baggage/reports/${rpt_b}/tracing-events", payload: { carrier_id: "${car_aa}", station_id: "${stn}", event_type: "LOCATED" }, as: BaggageServiceAgent }
            - { call: "POST /baggage/reports/${rpt_c}/tracing-events", payload: { carrier_id: "${car_aa}", station_id: "${stn}", event_type: "LOCATED" }, as: BaggageServiceAgent }
            - { call: "POST /baggage/dispatches", payload: { report_id: "${rpt_a}", courier_service_id: "${crr}", pickup_at: "2026-08-02T10:00:00Z", travel_minutes: 120, delivery_address: "1 Main St" }, as: BaggageServiceAgent, captures: { dsp_a: $.data.id } }
          trigger:
            - { call: "POST /baggage/dispatches", payload: { report_id: "${rpt_b}", courier_service_id: "${crr}", pickup_at: "2026-08-02T13:00:00Z", travel_minutes: 120, delivery_address: "2 Oak Ave" }, as: BaggageServiceAgent, captures: { dsp_b: $.data.id } }
            - { call: "POST /baggage/dispatches", payload: { report_id: "${rpt_c}", courier_service_id: "${crr}", pickup_at: "2026-08-02T12:30:00Z", travel_minutes: 120, delivery_address: "3 Pine Rd" }, as: BaggageServiceAgent, captures: { err: $.data.error_id } }
          assert:
            - "Dispatch B (exactly buffer after A's end) is created: DeliveryDispatch.${dsp_b}.status == DISPATCHED"
            - "Dispatch C is rejected: error_id == ERR_DISPATCH_WINDOW_CONFLICT"
            - "HTTP status == 409 for the C request"
            - "IrregularityReport.${rpt_c}.status == FOUND_PENDING_DELIVERY"

      - name: repair_vendor_half_open_bench_capacity
        grounds:
          - validations[priority=8]
          - errors[ERR_VENDOR_CAPACITY_EXCEEDED]
          - entities.RepairVendor.fields.bench_capacity
        distinguishing_aspect: |
          Resource RepairVendor with half-open aggregate-capacity semantics (different interval
          arithmetic than the courier buffer rule): an order starting on the day another ends
          ([a,D) vs [D,c)) does NOT overlap, but any day carrying bench_capacity=2 open orders
          rejects a third.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; station JFK; carrier AA; vendor with bench_capacity 2"
            - "DAMAGED report assessed repairable (hosts multiple orders while in DAMAGE_REVIEW)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/repair-vendors", payload: { name: "FixIt", bench_capacity: 2 }, as: SystemAdmin, captures: { vnd: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234584", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00084", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DAMAGED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
            - { call: "POST /baggage/reports/${rpt}/assess-damage", payload: { repairable: true, contents_damage_cents: 5000 }, as: ClaimsAdjuster }
            - { call: "POST /baggage/repair-orders", payload: { report_id: "${rpt}", vendor_id: "${vnd}", intake_date: "2026-08-03", promised_date: "2026-08-10", purchase_price_cents: 100000, purchase_date: "2024-08-01", repair_estimate_cents: 40000 }, as: ClaimsAdjuster, captures: { ro_a: $.data.id } }
            - { call: "POST /baggage/repair-orders", payload: { report_id: "${rpt}", vendor_id: "${vnd}", intake_date: "2026-08-05", promised_date: "2026-08-12", purchase_price_cents: 100000, purchase_date: "2024-08-01", repair_estimate_cents: 40000 }, as: ClaimsAdjuster, captures: { ro_b: $.data.id } }
          trigger:
            - { call: "POST /baggage/repair-orders", payload: { report_id: "${rpt}", vendor_id: "${vnd}", intake_date: "2026-08-10", promised_date: "2026-08-15", purchase_price_cents: 100000, purchase_date: "2024-08-01", repair_estimate_cents: 40000 }, as: ClaimsAdjuster, captures: { ro_c: $.data.id } }
            - { call: "POST /baggage/repair-orders", payload: { report_id: "${rpt}", vendor_id: "${vnd}", intake_date: "2026-08-06", promised_date: "2026-08-09", purchase_price_cents: 100000, purchase_date: "2024-08-01", repair_estimate_cents: 40000 }, as: ClaimsAdjuster, captures: { err: $.data.error_id } }
          assert:
            - "Order C (starts the day A ends; overlaps only B) is created: RepairOrder.${ro_c}.status == INTAKE"
            - "Order D (overlaps both A and B on 2026-08-06..08) is rejected: error_id == ERR_VENDOR_CAPACITY_EXCEEDED"
            - "HTTP status == 409 for the D request"
            - "RepairVendor.${vnd}.occupied_bench_slots == 3"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: settlement_money_conserved_across_issue_and_void
        grounds:
          - calculations.final_settlement_payment
          - state_machines.SettlementPayment.ISSUED_to_VOIDED
          - entities.IrregularityReport.fields.amount_payable_cents
        distinguishing_aspect: |
          Conserved quantity = settlement money in cents: offer 100000 must always equal
          report.amount_payable_cents + sum(settlement_component_cents of ISSUED/PAID payments).
          Issue moves 100000 payable->issued (0+100000); void moves it back (100000+0).
        test_recipe:
          setup:
            - "Clock initially 2026-08-01T00:00:00Z; station JFK; carrier AA; passenger; international bag declared 0"
            - "DELAYED report swept to DECLARED_LOST; assess-loss 100000; offer (MISCONNECT) 100000; passenger accepted"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234591", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: true, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00091", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/reports/${rpt}/assess-loss", payload: { contents_loss_cents: 100000 }, as: ClaimsAdjuster }
            - { call: "POST /baggage/reports/${rpt}/offer-settlement", payload: { root_cause: "MISCONNECT", root_cause_station_id: "${stn}" }, as: ClaimsAdjuster }
            - { call: "POST /baggage/reports/${rpt}/accept-settlement", payload: {}, as: Passenger, as_user_id: "${pax}", captures: { rpt_v: $.data.version } }
          trigger:
            - { call: "POST /baggage/reports/${rpt}/settlement-payments", payload: { expected_report_version: "${rpt_v}" }, as: ClaimsAdjuster, captures: { pay: $.data.id, comp: $.data.settlement_component_cents } }
            - { call: "GET /baggage/reports/${rpt}", as: ClaimsAdjuster }
            - { call: "POST /baggage/settlement-payments/${pay}/void", payload: {}, as: ClaimsAdjuster }
            - { call: "GET /baggage/reports/${rpt}", as: ClaimsAdjuster }
          assert:
            - "SettlementPayment.${pay}.settlement_component_cents == 100000"
            - "SettlementPayment.${pay}.expense_component_cents == 0"
            - "SettlementPayment.${pay}.amount_cents == 100000"
            - "After issue: IrregularityReport.${rpt}.amount_payable_cents == 0 (100000 payable + 0 issued-prior = offer)"
            - "After void: SettlementPayment.${pay}.status == VOIDED"
            - "After void: IrregularityReport.${rpt}.amount_payable_cents == 100000 (0 voided contribution + 100000 payable = offer)"
            - "IrregularityReport.${rpt}.status == SETTLEMENT_ACCEPTED"

      - name: vendor_bench_slots_conserved_across_intake_and_completion
        grounds:
          - state_machines.RepairOrder.REPAIR_IN_PROGRESS_to_REPAIR_SETTLED
          - entities.RepairVendor.fields.occupied_bench_slots
          - entities.RepairVendor.fields.available_bench_slots
        distinguishing_aspect: |
          Conserved quantity = bench slot count (different quantity than settlement cents):
          occupied_bench_slots + available_bench_slots == bench_capacity (3) must hold after
          intake (1+2) and after the compensating completion (0+3).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; station JFK; carrier AA; vendor bench_capacity 3"
            - "DAMAGED report assessed repairable; one repair order in INTAKE"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/repair-vendors", payload: { name: "FixIt", bench_capacity: 3 }, as: SystemAdmin, captures: { vnd: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234592", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00092", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DAMAGED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
            - { call: "POST /baggage/reports/${rpt}/assess-damage", payload: { repairable: true, contents_damage_cents: 5000 }, as: ClaimsAdjuster }
            - { call: "POST /baggage/repair-orders", payload: { report_id: "${rpt}", vendor_id: "${vnd}", intake_date: "2026-08-05", promised_date: "2026-08-12", purchase_price_cents: 100000, purchase_date: "2024-08-01", repair_estimate_cents: 40000 }, as: ClaimsAdjuster, captures: { ro: $.data.id } }
            - { call: "POST /baggage/repair-orders/${ro}/decide", payload: {}, as: ClaimsAdjuster }
          trigger:
            - { call: "GET /baggage/repair-vendors/${vnd}", as: ClaimsAdjuster }
            - { call: "POST /baggage/repair-orders/${ro}/complete", payload: {}, as: ClaimsAdjuster }
            - { call: "GET /baggage/repair-vendors/${vnd}", as: ClaimsAdjuster }
          assert:
            - "Before complete: RepairVendor.${vnd}.occupied_bench_slots == 1 and available_bench_slots == 2 (sum 3)"
            - "After complete: RepairVendor.${vnd}.occupied_bench_slots == 0 and available_bench_slots == 3 (sum 3)"
            - "RepairOrder.${ro}.status == REPAIR_SETTLED"
            - "IrregularityReport.${rpt}.status == CLAIM_REVIEW"
