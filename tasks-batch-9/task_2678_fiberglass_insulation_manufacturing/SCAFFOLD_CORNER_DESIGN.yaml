            - "after both refusals ProductLine.${pl_a}.certification_status is STILL PENDING_CERTIFICATION with certified_by_user_id == null and effective_declared_r_value == null"
            - "the identical CERTIFY payload from co-2 returns HTTP 200: certification_status == CERTIFIED, effective_declared_r_value == 13.0 and certified_by_user_id == \"co-2\""
