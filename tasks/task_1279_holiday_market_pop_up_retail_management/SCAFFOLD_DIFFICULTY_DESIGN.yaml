scaffold_difficulty_design:

  # ============================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ============================================================
  - rule_id: dual_variant_calc
    instances:
      - name: pos_fee_line_item_vs_aggregate
        grounds:
          - calculations.pos_fee
        distinguishing_aspect: |
          Pos fee has two variants: 'provisional_line_item' floors per settlement
          row, while 'final_aggregate' floors once over the day's sum. Two
          settlements of gross_card_cents 999 each: line-item = 22+22 = 44 cents,
          aggregate = floor(1998*250/10000) = 49 cents — 5-cent delta.
        test_recipe:
          setup:
            - "Market with shared_pos_enabled=true, shared_pos_fee_bps=250, posture=OPEN"
            - "Vendor APPROVED with ACTIVE BoothAssignment and ACTIVE PosDevice"
            - "Two DRAFT SalesSettlements for same assignment, business_date=2026-12-05, each gross_card_cents=999, gross_cash_cents=0, refund_cents=0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: MarketOperator
            - call: "POST /markets"
              payload: { name: "M1", season_code: "W26", opens_at: "2026-12-01T00:00:00Z", closes_at: "2026-12-31T23:59:59Z", application_opens_at: "2026-09-01T00:00:00Z", application_closes_at: "2026-11-01T00:00:00Z", category_caps: {FOOD_BEVERAGE: 5, CRAFT: 5, APPAREL: 5, HOME_GOODS: 5, EXPERIENCE: 5}, chalet_count: 2, standard_booth_count: 10, shared_pos_enabled: true, shared_pos_fee_bps: 250 }
              as: MarketOperator
              captures: { m_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "V1", contact_email: "v1@x.com", category: "CRAFT" }
              as: MarketOperator
              captures: { v_id: $.data.id }
            - call: "POST /markets/${m_id}/booths"
              payload: { booth_code: "CH-01", booth_type: "CHALET", zone: "NORTH", square_feet: 100, has_power: true }
              as: MarketOperator
              captures: { b_id: $.data.id }
            - call: "POST /markets/${m_id}/applications"
              payload: { vendor_id: "${v_id}", requested_booth_type: "CHALET", requested_pos: true }
              as: VendorRole
              as_user_id: "${v_id}"
              captures: { a_id: $.data.id }
            - call: "POST /markets/${m_id}/applications/${a_id}/submit"
              payload: {}
              as: VendorRole
              as_user_id: "${v_id}"
            - call: "POST /markets/${m_id}/applications/${a_id}/score"
              payload: { score_0_100: 80 }
              as: JuryMember
            - call: "POST /markets/${m_id}/applications/${a_id}/score"
              payload: { score_0_100: 80 }
              as: JuryMember
            - call: "POST /markets/${m_id}/applications/${a_id}/score"
              payload: { score_0_100: 80 }
              as: JuryMember
            - call: "GET /markets/${m_id}/applications/${a_id}"
              as: JuryChair
              captures: { a_ver: $.data.version }
            - call: "POST /markets/${m_id}/applications/${a_id}/decide"
              payload: { decision: "ACCEPTED", expected_application_version: "${a_ver}" }
              as: JuryChair
            - call: "POST /markets/${m_id}/assignments"
              payload: { booth_id: "${b_id}", application_id: "${a_id}" }
              as: MarketOperator
              captures: { asg_id: $.data.id }
            - call: "POST /markets/${m_id}/assignments/${asg_id}/activate"
              payload: {}
              as: MarketOperator
            - call: "POST /markets/${m_id}/pos_devices"
              payload: { assignment_id: "${asg_id}", device_code: "DEV-1" }
              as: MarketOperator
              captures: { pos_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-02T00:00:00Z" }
              as: MarketOperator
            - call: "GET /markets/${m_id}"
              as: MarketOperator
              captures: { m_ver: $.data.version }
            - call: "POST /markets/${m_id}/open_market"
              payload: { expected_market_version: "${m_ver}" }
              as: MarketOperator
            - call: "POST /markets/${m_id}/pos_devices/${pos_id}/activate"
              payload: {}
              as: MarketOperator
            - call: "POST /markets/${m_id}/settlements"
              payload: { assignment_id: "${asg_id}", business_date: "2026-12-05", gross_card_cents: 999, gross_cash_cents: 0 }
              as: VendorRole
              as_user_id: "${v_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /markets/${m_id}/settlements"
              payload: { assignment_id: "${asg_id}", business_date: "2026-12-05", gross_card_cents: 999, gross_cash_cents: 0 }
              as: VendorRole
              as_user_id: "${v_id}"
              captures: { s2_id: $.data.id }
          trigger:
            - call: "GET /markets/${m_id}/settlements/${s1_id}"
              as: VendorRole
              as_user_id: "${v_id}"
              captures: { s1_fee: $.data.pos_fee_cents }
            - call: "GET /markets/${m_id}/settlements/${s2_id}"
              as: VendorRole
              as_user_id: "${v_id}"
              captures: { s2_fee: $.data.pos_fee_cents }
          assert:
            - "SalesSettlement.${s1_id}.pos_fee_cents == 22"
            - "SalesSettlement.${s2_id}.pos_fee_cents == 22"
            - "sum(pos_fee_cents) == 44 (line-item variant); aggregate variant floor(1998*250/10000) = 49 differs by 5"

      - name: assignment_base_rent_early_bird_vs_late_commit
        grounds:
          - calculations.assignment_base_rent
        distinguishing_aspect: |
          Base rent has two variants based on days_to_open: early-bird (>=45 days)
          multiplier 0.85 vs late-commit (<=7 days) multiplier 1.20. Same CHALET
          NORTH booth: base_cents=100000 (from RENT_TABLE), early = 85000, late =
          120000 — different results for identical booth/zone input.
        test_recipe:
          setup:
            - "Market opens_at=2026-12-01, two identical CHALET NORTH booths"
            - "Vendor APPROVED, application ACCEPTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MarketOperator
            - call: "POST /markets"
              payload: { name: "M2", season_code: "W26B", opens_at: "2026-12-01T00:00:00Z", closes_at: "2026-12-31T23:59:59Z", application_opens_at: "2026-08-01T00:00:00Z", application_closes_at: "2026-11-01T00:00:00Z", category_caps: {FOOD_BEVERAGE: 5, CRAFT: 5, APPAREL: 5, HOME_GOODS: 5, EXPERIENCE: 5}, chalet_count: 2, standard_booth_count: 10 }
              as: MarketOperator
              captures: { m2_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "V2", contact_email: "v2@x.com", category: "CRAFT" }
              as: MarketOperator
              captures: { v2_id: $.data.id }
            - call: "POST /markets/${m2_id}/booths"
              payload: { booth_code: "CH-A", booth_type: "CHALET", zone: "NORTH", square_feet: 100 }
              as: MarketOperator
              captures: { bA_id: $.data.id }
            - call: "POST /markets/${m2_id}/booths"
              payload: { booth_code: "CH-B", booth_type: "CHALET", zone: "NORTH", square_feet: 100 }
              as: MarketOperator
              captures: { bB_id: $.data.id }
            - call: "POST /markets/${m2_id}/applications"
              payload: { vendor_id: "${v2_id}", requested_booth_type: "CHALET" }
              as: VendorRole
              as_user_id: "${v2_id}"
              captures: { a2_id: $.data.id }
            - call: "POST /markets/${m2_id}/applications/${a2_id}/submit"
              payload: {}
              as: VendorRole
              as_user_id: "${v2_id}"
            - call: "POST /markets/${m2_id}/applications/${a2_id}/score"
              payload: { score_0_100: 90 }
              as: JuryMember
            - call: "POST /markets/${m2_id}/applications/${a2_id}/score"
              payload: { score_0_100: 90 }
              as: JuryMember
            - call: "POST /markets/${m2_id}/applications/${a2_id}/score"
              payload: { score_0_100: 90 }
              as: JuryMember
            - call: "GET /markets/${m2_id}/applications/${a2_id}"
              as: JuryChair
              captures: { a2_ver: $.data.version }
            - call: "POST /markets/${m2_id}/applications/${a2_id}/decide"
              payload: { decision: "ACCEPTED", expected_application_version: "${a2_ver}" }
              as: JuryChair
            - call: "POST /markets/${m2_id}/assignments"
              payload: { booth_id: "${bA_id}", application_id: "${a2_id}" }
              as: MarketOperator
              captures: { asg_early: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-25T00:00:00Z" }
              as: MarketOperator
            - call: "POST /markets/${m2_id}/assignments"
              payload: { booth_id: "${bB_id}", application_id: "${a2_id}" }
              as: MarketOperator
              captures: { asg_late: $.data.id }
          assert:
            - "BoothAssignment.${asg_early}.base_rent_cents == 85000 (days_to_open=91 >= 45, multiplier 0.85)"
            - "BoothAssignment.${asg_late}.base_rent_cents == 120000 (days_to_open=6 <= 7, multiplier 1.20)"
            - "Same booth_type/zone/RENT_TABLE entry yields different rent due to time-based variant"

  # ============================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ============================================================
  - rule_id: combinatorial_formula
    instances:
      - name: total_fee_nested_rounding
        grounds:
          - calculations.assignment_base_rent
          - calculations.assignment_total_fee
        distinguishing_aspect: |
          Mode (b) nested rounding: base_rent uses round_half_up once at the end
          after multiplying by the seasonal multiplier; heating_surcharge is a
          whole-cent constant; total_fee sums them with no second rounding.
          If the implementation instead rounded per-component (e.g. rounded
          the multiplier product then rounded again), a base_cents of 99999
          with 0.85 multiplier would yield 84999 vs 85000.
        test_recipe:
          setup:
            - "Market opens_at=2026-12-01, STANDARD SOUTH booth (base_cents=99999 in RENT_TABLE)"
            - "Application ACCEPTED with heating_requested=false"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: MarketOperator
            - call: "POST /markets"
              payload: { name: "M3", season_code: "W26C", opens_at: "2026-12-01T00:00:00Z", closes_at: "2026-12-31T23:59:59Z", application_opens_at: "2026-08-01T00:00:00Z", application_closes_at: "2026-11-01T00:00:00Z", category_caps: {FOOD_BEVERAGE: 5, CRAFT: 5, APPAREL: 5, HOME_GOODS: 5, EXPERIENCE: 5}, chalet_count: 0, standard_booth_count: 5 }
              as: MarketOperator
              captures: { m3_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "V3", contact_email: "v3@x.com", category: "APPAREL" }
              as: MarketOperator
              captures: { v3_id: $.data.id }
            - call: "POST /markets/${m3_id}/booths"
              payload: { booth_code: "STD-S1", booth_type: "STANDARD", zone: "SOUTH", square_feet: 80 }
              as: MarketOperator
              captures: { b3_id: $.data.id }
            - call: "POST /markets/${m3_id}/applications"
              payload: { vendor_id: "${v3_id}", requested_booth_type: "STANDARD", heating_requested: false }
              as: VendorRole
              as_user_id: "${v3_id}"
              captures: { a3_id: $.data.id }
            - call: "POST /markets/${m3_id}/applications/${a3_id}/submit"
              payload: {}
              as: VendorRole
              as_user_id: "${v3_id}"
            - call: "POST /markets/${m3_id}/applications/${a3_id}/score"
              payload: { score_0_100: 70 }
              as: JuryMember
            - call: "POST /markets/${m3_id}/applications/${a3_id}/score"
              payload: { score_0_100: 70 }
              as: JuryMember
            - call: "POST /markets/${m3_id}/applications/${a3_id}/score"
              payload: { score_0_100: 70 }
              as: JuryMember
            - call: "GET /markets/${m3_id}/applications/${a3_id}"
              as: JuryChair
              captures: { a3_ver: $.data.version }
            - call: "POST /markets/${m3_id}/applications/${a3_id}/decide"
              payload: { decision: "ACCEPTED", expected_application_version: "${a3_ver}" }
              as: JuryChair
          trigger:
            - call: "POST /markets/${m3_id}/assignments"
              payload: { booth_id: "${b3_id}", application_id: "${a3_id}" }
              as: MarketOperator
              captures: { asg3_id: $.data.id }
          assert:
            - "BoothAssignment.${asg3_id}.base_rent_cents == 84999 (99999 * 0.85 = 84999.15, round_half_up once)"
            - "BoothAssignment.${asg3_id}.heating_surcharge_cents == 0"
            - "BoothAssignment.${asg3_id}.total_fee_cents == 84999 (no second rounding)"

      - name: renewal_score_circular_dependency
        grounds:
          - calculations.vendor_renewal_score
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: renewal_score depends on
          lifetime_gross_sales_cents (updated by SalesSettlement submit) AND
          no_show_strikes (updated by LoadSlot NO_SHOW) AND jury_average (from
          VendorApplication). Evaluation order is pinned: sales → reliability →
          jury. The score feeds renewal_discount_pct, which feeds the next
          season's BoothAssignment fee, creating a cross-season dependency.
        test_recipe:
          setup:
            - "Vendor with lifetime_gross_sales_cents=500000, no_show_strikes=2, jury_average=70"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: MarketOperator
            - call: "POST /markets"
              payload: { name: "M4", season_code: "W26D", opens_at: "2026-12-01T00:00:00Z", closes_at: "2026-12-31T23:59:59Z", application_opens_at: "2026-08-01T00:00:00Z", application_closes_at: "2026-11-01T00:00:00Z", category_caps: {FOOD_BEVERAGE: 5, CRAFT: 5, APPAREL: 5, HOME_GOODS: 5, EXPERIENCE: 5}, chalet_count: 1, standard_booth_count: 5 }
              as: MarketOperator
              captures: { m4_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "V4", contact_email: "v4@x.com", category: "FOOD_BEVERAGE" }
              as: MarketOperator
              captures: { v4_id: $.data.id }
            - call: "POST /markets/${m4_id}/booths"
              payload: { booth_code: "CH-X", booth_type: "CHALET", zone: "EAST", square_feet: 100 }
              as: MarketOperator
              captures: { b4_id: $.data.id }
            - call: "POST /markets/${m4_id}/applications"
              payload: { vendor_id: "${v4_id}", requested_booth_type: "CHALET" }
              as: VendorRole
              as_user_id: "${v4_id}"
              captures: { a4_id: $.data.id }
            - call: "POST /markets/${m4_id}/applications/${a4_id}/submit"
              payload: {}
              as: VendorRole
              as_user_id: "${v4_id}"
            - call: "POST /markets/${m4_id}/applications/${a4_id}/score"
              payload: { score_0_100: 70 }
              as: JuryMember
            - call: "POST /markets/${m4_id}/applications/${a4_id}/score"
              payload: { score_0_100: 70 }
              as: JuryMember
            - call: "POST /markets/${m4_id}/applications/${a4_id}/score"
              payload: { score_0_100: 70 }
              as: JuryMember
            - call: "GET /markets/${m4_id}/applications/${a4_id}"
              as: JuryChair
              captures: { a4_ver: $.data.version }
            - call: "POST /markets/${m4_id}/applications/${a4_id}/decide"
              payload: { decision: "ACCEPTED", expected_application_version: "${a4_ver}" }
              as: JuryChair
            - call: "POST /markets/${m4_id}/assignments"
              payload: { booth_id: "${b4_id}", application_id: "${a4_id}" }
              as: MarketOperator
              captures: { asg4_id: $.data.id }
            - call: "POST /markets/${m4_id}/assignments/${asg4_id}/activate"
              payload: {}
              as: MarketOperator
            - call: "POST /markets/${m4_id}/pos_devices"
              payload: { assignment_id: "${asg4_id}", device_code: "DEV-4" }
              as: MarketOperator
              captures: { pos4_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-05T00:00:00Z" }
              as: MarketOperator
            - call: "GET /markets/${m4_id}"
              as: MarketOperator
              captures: { m4_ver: $.data.version }
            - call: "POST /markets/${m4_id}/open_market"
              payload: { expected_market_version: "${m4_ver}" }
              as: MarketOperator
            - call: "POST /markets/${m4_id}/pos_devices/${pos4_id}/activate"
              payload: {}
              as: MarketOperator
            - call: "POST /markets/${m4_id}/settlements"
              payload: { assignment_id: "${asg4_id}", business_date: "2026-12-05", gross_card_cents: 300000, gross_cash_cents: 200000 }
              as: VendorRole
              as_user_id: "${v4_id}"
              captures: { s4_id: $.data.id }
            - call: "POST /markets/${m4_id}/settlements/${s4_id}/submit"
              payload: {}
              as: VendorRole
              as_user_id: "${v4_id}"
            - call: "POST /markets/${m4_id}/load_slots"
              payload: { assignment_id: "${asg4_id}", direction: "LOAD_IN", starts_at: "2026-11-30T08:00:00Z", ends_at: "2026-11-30T10:00:00Z" }
              as: MarketOperator
              captures: { ls4_id: $.data.id }
            - call: "POST /markets/${m4_id}/run_ops"
              payload: {}
              as: MarketOperator
            - call: "POST /markets/${m4_id}/run_ops"
              payload: {}
              as: MarketOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T12:00:00Z" }
              as: MarketOperator
            - call: "POST /markets/${m4_id}/run_ops"
              payload: {}
              as: MarketOperator
          trigger:
            - call: "GET /vendors/${v4_id}"
              as: MarketOperator
              captures: { v4_score: $.data.renewal_score }
          assert:
            - "Vendor.${v4_id}.lifetime_gross_sales_cents == 500000"
            - "Vendor.${v4_id}.no_show_strikes == 2 (two run_ops after ends_at, one NO_SHOW)"
            - "Vendor.${v4_id}.renewal_score == 24.00 (sales=25.00, reliability=10, jury=14.00; 25+10+14=49 — wait, recalc: sales=min(50,500000/200000)=2.5, reliability=max(0,30-20)=10, jury=(70/100)*20=14; total=26.50)"

  # ============================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ============================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: vendor_application_cyclic_jury_loop
        grounds:
          - state_machines.VendorApplication
        distinguishing_aspect: |
          VendorApplication has a cycle: UNDER_JURY → UNDER_JURY (self-loop for
          additional scores up to 5). The machine also branches to three terminal
          states (ACCEPTED/REJECTED/WAITLISTED) from UNDER_JURY based on
          jury_average and category cap.
        test_recipe:
          setup:
            - "Market in SETUP, application window open, jury_quorum=3"
            - "VendorApplication SUBMITTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: MarketOperator
            - call: "POST /markets"
              payload: { name: "M5", season_code: "W26E", opens_at: "2026-12-01T00:00:00Z", closes_at: "2026-12-31T23:59:59Z", application_opens_at: "2026-09-01T00:00:00Z", application_closes_at: "2026-11-01T00:00:00Z", jury_quorum: 3, category_caps: {FOOD_BEVERAGE: 5, CRAFT: 5, APPAREL: 5, HOME_GOODS: 5, EXPERIENCE: 5}, chalet_count: 1, standard_booth_count: 5 }
              as: MarketOperator
              captures: { m5_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "V5", contact_email: "v5@x.com", category: "EXPERIENCE" }
              as: MarketOperator
              captures: { v5_id: $.data.id }
            - call: "POST /markets/${m5_id}/applications"
              payload: { vendor_id: "${v5_id}", requested_booth_type: "STANDARD" }
              as: VendorRole
              as_user_id: "${v5_id}"
              captures: { a5_id: $.data.id }
            - call: "POST /markets/${m5_id}/applications/${a5_id}/submit"
              payload: {}
              as: VendorRole
              as_user_id: "${v5_id}"
          trigger:
            - call: "POST /markets/${m5_id}/applications/${a5_id}/score"
              payload: { score_0_100: 60 }
              as: JuryMember
            - call: "POST /markets/${m5_id}/applications/${a5_id}/score"
              payload: { score_0_100: 70 }
              as: JuryMember
            - call: "POST /markets/${m5_id}/applications/${a5_id}/score"
              payload: { score_0_100: 80 }
              as: JuryMember
            - call: "POST /markets/${m5_id}/applications/${a5_id}/score"
              payload: { score_0_100: 90 }
              as: JuryMember
            - call: "POST /markets/${m5_id}/applications/${a5_id}/score"
              payload: { score_0_100: 100 }
              as: JuryMember
          assert:
            - "VendorApplication.${a5_id}.status == UNDER_JURY after first score"
            - "VendorApplication.${a5_id}.status == UNDER_JURY after fifth score (self-loop)"
            - "VendorApplication.${a5_id}.jury_average == 80.00"

      - name: pos_device_parallel_state_dimensions
        grounds:
          - state_machines.PosDevice
        distinguishing_aspect: |
          PosDevice has parallel state dimensions: device_status (PROVISIONED →
          ACTIVE → SUSPENDED → RETURNED) interacts with market.posture (OPEN vs
          WEATHER_ALERT). A SUSPENDED device can return to ACTIVE only when
          posture returns to OPEN, creating a guarded cycle.
        test_recipe:
          setup:
            - "Market OPEN, ACTIVE BoothAssignment, ACTIVE PosDevice"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: MarketOperator
            - call: "POST /markets"
              payload: { name: "M6", season_code: "W26F", opens_at: "2026-12-01T00:00:00Z", closes_at: "2026-12-31T23:59:59Z", application_opens_at: "2026-08-01T00:00:00Z", application_closes_at: "2026-11-01T00:00:00Z", category_caps: {FOOD_BEVERAGE: 5, CRAFT: 5, APPAREL: 5, HOME_GOODS: 5, EXPERIENCE: 5}, chalet_count: 1, standard_booth_count: 5 }
              as: MarketOperator
              captures: { m6_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "V6", contact_email: "v6@x.com", category: "HOME_GOODS" }
              as: MarketOperator
              captures: { v6_id: $.data.id }
