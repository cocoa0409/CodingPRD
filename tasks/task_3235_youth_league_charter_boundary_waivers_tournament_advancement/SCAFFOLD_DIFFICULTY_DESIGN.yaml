  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: tournament_entry_blocked_when_league_not_chartered
        grounds:
          - validations[priority=4]
          - errors.ERR_LEAGUE_NOT_CHARTERED
          - state_machines.League
        distinguishing_aspect: |
          Entity pair League -> TournamentEntry: entry creation is gated on
          the LEAGUE's charter_status — a SUBMITTED roster in a PROVISIONAL
          league cannot enter a tournament even though every roster-level
          precondition passes.
        test_recipe:
          setup:
            - "League PROVISIONAL (no renewal approved): created at clock 2026-10-15; P1..P3 registered at 2027-02-01 and left PENDING — verify-eligibility is NOT charter-gated, so they stay unverified; roster creation IS charter-gated, so to exercise the roster path we approve the charter, build+submit the roster, then create a SECOND league that stays PROVISIONAL and attempt entry creation against a roster there — impossible. Instead: attempt entry creation in league A BEFORE approving its renewal (roster built and submitted after chartering is impossible too). Resolution: charter league A, build and SUBMIT roster R, then suspend A via clock sweep (2028-04-01, no 2028 renewal), then attempt a new DISTRICT entry on the LOCKED roster — roster is LOCKED, so that hits ERR_ROSTER_NOT_SUBMITTED, not the charter gate. Therefore this instance uses league B, PROVISIONAL, with roster creation blocked: the observable gate is ERR_LEAGUE_NOT_CHARTERED on roster creation and on entry creation."
            - "Final chosen probe: in PROVISIONAL league B, POST all-star-rosters AND POST tournament-entries both hit the charter gate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
              payload: { league_name: "Ungated LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
            - call: "GET /leagues/${lg}/divisions"
              payload: {}
              as: DistrictAdministrator
              captures: { maj: "$.data[2].id" }
          trigger:
            - call: "POST /leagues/${lg}/all-star-rosters"
              payload: { division_id: "${maj}" }
              as: LeagueAdministrator
              captures: { err_roster: $.data.error_id }
            - call: "POST /leagues/${lg}/tournament-entries"
              payload: { roster_id: "00000000-0000-0000-0000-000000000000", level: "DISTRICT" }
              as: TournamentDirector
              captures: { err_entry: $.data.error_id }
          assert:
            - "${err_roster} == ERR_LEAGUE_NOT_CHARTERED (priority-4 charter gate precedes roster creation in a PROVISIONAL league)"
            - "${err_entry} == ERR_LEAGUE_NOT_CHARTERED — the charter gate (priority 4) fires even though the referenced roster does not exist, because state gates precede the roster-state check for this operation"
            - "League.${lg}.charter_status == PROVISIONAL (unchanged)"

      - name: selection_blocked_when_player_not_eligible
        grounds:
          - errors.ERR_PLAYER_NOT_ELIGIBLE
          - state_machines.Player
          - state_machines.AllStarRoster
