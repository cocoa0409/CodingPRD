  # =====================================================================
  # Section: errors
  # =====================================================================
  - section: errors
    instances:
      - name: curriculum_activate_without_effective_version_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_NO_EFFECTIVE_VERSION]"
          - "state_machines.Curriculum.DRAFT_to_ACTIVE"
        distinguishing_aspect: "Activation requires a version effective NOW: a curriculum whose only version starts in the future cannot be activated."
        test_recipe:
          setup: ["Clock 2026-08-03T09:00:00Z; regulator REG-NEV; curriculum CUR-NEV (DRAFT) with only version V1 effective_from 2027-01-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-NEV", name: "NEV Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-NEV", title: "NEV Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2027-01-01T00:00:00Z", content_uri: "uri://nev-future" }, as: ComplianceAdmin }
          trigger:
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
            - { call: "GET /compliance/curricula/${cur_id}", as: ComplianceAdmin, captures: { cur_st: "$.data.status" } }
          assert:
            - "err == \"ERR_NO_EFFECTIVE_VERSION\""
            - "cur_st == \"DRAFT\" (unchanged)"

      - name: retired_regulator_rejects_new_curriculum
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_REGULATOR_RETIRED]"
          - "state_machines.Regulator"
        distinguishing_aspect: "A RETIRED regulator keeps existing data but rejects new curricula."
