              as: SalesRep
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_zip: "94020" }
              as: SalesRep
          trigger:
            - call: "GET /customers/${cust}/projects"
              payload: { limit: 1, offset: 0 }
              as: SalesRep
          assert:
            - "HTTP 200"
            - "response_type == array; total_count == 2; has_more == true (limit 1 of 2)"

      - name: customer_referrals_reverse_reachability_after_referral
        claim_type: Cross-reference link
        grounds: [endpoints, entities.Referral.fields.referrer_customer_id]
        distinguishing_aspect: "After POST /referrals, GET /customers/{referrer}/referrals returns the Referral (reverse-reachability of referrer_customer_id)."
        test_recipe:
          setup: ["Referrer + referred customers and a project; one referral created."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Refa", email: "refa@x.com" }
              as: SalesRep
              captures: { cust_r: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Newt", email: "newt@x.com" }
              as: SalesRep
              captures: { cust_n: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_n}", site_zip: "94016" }
              as: SalesRep
              captures: { proj: $.data.id }
            - call: "POST /referrals"
              payload: { referrer_customer_id: "${cust_r}", referred_customer_id: "${cust_n}", project_id: "${proj}" }
              as: SalesRep
              captures: { ref: $.data.id }
          trigger:
            - call: "GET /customers/${cust_r}/referrals"
              payload: {}
              as: SalesRep
              captures: { first_ref: "$.data[0].id" }
          assert:
            - "HTTP 200"
            - "first_ref == ${ref} (referral discoverable from referrer)"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_project_version_on_accept_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[quote-accept-stale-project]", "errors[ERR_STALE_PROJECT_VERSION]", entities.Project.fields.version]
        distinguishing_aspect: "Reading project at v3 after the first send, then sending a SECOND quote (bumps version to 4), then accepting the first quote with expected_project_version=3 returns ERR_STALE_PROJECT_VERSION (412); accepting with the current version succeeds."
        test_recipe:
          setup: ["A project with two SENT quotes; the second send advanced Project.version past the stale value the client holds."]
          setup_api_calls:
            - call: "POST /coating-systems"
              payload: { name: "Flake Std", family: "FLAKE", sku: "FLAKE_STANDARD" }
              as: PlatformAdmin
              captures: { sys_fs: $.data.id }
            - call: "POST /color-options"
              payload: { coating_system_id: "${sys_fs}", name: "Slate Flake", flake_blend_code: "FS-SL" }
              as: PlatformAdmin
              captures: { color_fs: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cora Customer", email: "cora@x.com" }
              as: SalesRep
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_zip: "94016" }
              as: SalesRep
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/assessments"
              payload: { measured_sqft: 600, oil_stain_pct: 50, crack_density: 20, crack_linear_ft: 15, spalling: true, moisture_pct: 30 }
              as: SalesRep
              captures: { assess: $.data.id }
            - call: "POST /projects/${proj}/quotes"
              payload: { assessment_id: "${assess}", coating_system_id: "${sys_fs}", color_option_id: "${color_fs}", install_season: "STANDARD" }
              as: SalesRep
              captures: { q1: $.data.id }
            - call: "POST /quotes/${q1}/send"
              payload: {}
              as: SalesRep
            - call: "GET /projects/${proj}"
              payload: {}
              as: SalesRep
              captures: { pv_stale: $.data.version }
            - call: "POST /projects/${proj}/quotes"
              payload: { assessment_id: "${assess}", coating_system_id: "${sys_fs}", color_option_id: "${color_fs}", install_season: "STANDARD" }
              as: SalesRep
              captures: { q2: $.data.id }
            - call: "POST /quotes/${q2}/send"
              payload: {}
              as: SalesRep
            - call: "GET /projects/${proj}"
              payload: {}
              as: SalesRep
              captures: { pv_current: $.data.version }
          trigger:
            - call: "POST /quotes/${q1}/accept"
              payload: { expected_project_version: "${pv_stale}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
            - call: "POST /quotes/${q1}/accept"
              payload: { expected_project_version: "${pv_current}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { st: $.data.status }
          assert:
            - "first accept HTTP 412 and err == ERR_STALE_PROJECT_VERSION (stale pv_stale)"
            - "second accept HTTP 200 and st == ACCEPTED (current version)"

      - name: project_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Project.fields.version, state_machines.Project.sales_status.LEAD_to_ASSESSED]
        distinguishing_aspect: "Project.version increments by exactly 1 on each mutating step: 1 at create, 2 after assessment, 3 after first send."
        test_recipe:
          setup: ["A project, then an assessment, then a sent quote."]
          setup_api_calls:
            - call: "POST /coating-systems"
              payload: { name: "Flake Std", family: "FLAKE", sku: "FLAKE_STANDARD" }
              as: PlatformAdmin
              captures: { sys_fs: $.data.id }
            - call: "POST /color-options"
              payload: { coating_system_id: "${sys_fs}", name: "Slate Flake", flake_blend_code: "FS-SL" }
              as: PlatformAdmin
              captures: { color_fs: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cora Customer", email: "cora@x.com" }
              as: SalesRep
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_zip: "94016" }
              as: SalesRep
              captures: { proj: $.data.id, v_create: $.data.version }
            - call: "POST /projects/${proj}/assessments"
              payload: { measured_sqft: 600, oil_stain_pct: 50, crack_density: 20, crack_linear_ft: 15, spalling: true, moisture_pct: 30 }
              as: SalesRep
              captures: { assess: $.data.id }
            - call: "GET /projects/${proj}"
              payload: {}
              as: SalesRep
              captures: { v_assessed: $.data.version }
            - call: "POST /projects/${proj}/quotes"
              payload: { assessment_id: "${assess}", coating_system_id: "${sys_fs}", color_option_id: "${color_fs}", install_season: "STANDARD" }
              as: SalesRep
              captures: { q: $.data.id }
            - call: "POST /quotes/${q}/send"
              payload: {}
              as: SalesRep
          trigger:
            - call: "GET /projects/${proj}"
              payload: {}
              as: SalesRep
              captures: { v_sent: $.data.version }
          assert:
            - "v_create == 1"
            - "v_assessed == 2"
            - "v_sent == 3 (quote create does not bump; first send does)"

      - name: warranty_void_excluded_stub
        claim_type: derived_field_reconciliation
        grounds: [state_machines.Warranty.ACTIVE_to_VOID]
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_cascades_install_warranty_claim_referral_depth3
          rationale: "Warranty VOID on project cancel is asserted as hop1 of the named §1.8 cascade instance."
