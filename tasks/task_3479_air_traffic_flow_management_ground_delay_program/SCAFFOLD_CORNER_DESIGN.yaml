            - "a different CommandCenterAdmin id (cc-1) then publishes successfully: st == PUBLISHED"

      - name: shared_read_operator_allowed
        claim_type: shared_operation
        grounds:
          - roles[Operator]
        distinguishing_aspect: "GET endpoints are shared: an Operator can read a TMI that involves other operators' flights (CDM visibility), receiving 200 with the full TMI body."
        test_recipe:
          setup:
            - "PROPOSED GDP exists; operator exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
