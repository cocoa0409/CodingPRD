      - name: corner_contract_program_link_requires_a_real_program_and_flips_billing_mode
        claim_type: Cross-reference link
        grounds:
          - endpoints.POST_contracts
          - errors.ERR_PROGRAM_NOT_FOUND
          - entities.ServiceContract.fields.funding_status
          - entities.ServiceAccount.fields.billing_mode
        distinguishing_aspect: |
          The optional brewer_program_id is a real cross-aggregate link: an
          unknown id is ERR_PROGRAM_NOT_FOUND (404) and consumes nothing (the
          account version is untouched, so the retry reuses it), while a valid
          id stamps funding_status BREWER_FUNDED on the contract and, once the
          contract activates, flips the account to PROGRAM_BILL — and the link is
          reverse-queryable by brewer_program_id.
        test_recipe:
          setup:
            - "ServiceAccount 'Anchor Alehouse' ACTIVE at version 1."
