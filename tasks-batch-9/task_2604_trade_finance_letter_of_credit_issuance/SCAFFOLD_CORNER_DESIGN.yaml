      - name: facility_suspend_then_reinstate_completes_the_cyclic_loop
        claim_type: cyclic
        grounds:
          - state_machines.CreditFacility.ACTIVE_to_SUSPENDED
          - state_machines.CreditFacility.SUSPENDED_to_ACTIVE
          - state_machines.DocumentaryCredit.APPROVED_to_ON_HOLD
          - state_machines.DocumentaryCredit.ON_HOLD_to_APPROVED
          - endpoints.POST_/facilities/{id}/status-changes
        distinguishing_aspect: |
          state_machine_shape is cyclic: SUSPEND then REINSTATE returns the
          facility to the exact state it started in (ACTIVE, OPEN,
          suspended_reason null) and returns the ON_HOLD credit to APPROVED,
          and a manual SUSPEND records suspended_reason MANUAL_SUSPENSION rather
          than RESTRICT_THRESHOLD_BREACH. The loop's termination condition is
          allocated_cents < restrict_threshold_cents, checked on REINSTATE.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One applicant with a USD facility of limit_cents 50000000, allocated_cents 0."
            - "One APPROVED (not issued) credit of 10000000 on that facility."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
            - call: "POST /applicants"
              payload: { legal_name: "Baltic Timber Imports AS", country_code: "NO", industry_code: "4671", internal_risk_grade: "A", kyc_status: "CLEARED" }
              as: CreditOfficer
              as_user_id: "co_1"
