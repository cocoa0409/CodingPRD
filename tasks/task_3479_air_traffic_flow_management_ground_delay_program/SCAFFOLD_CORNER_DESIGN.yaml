      - name: substitution_shift_exceeded_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - errors[ERR_SUBSTITUTION_SHIFT_EXCEEDED]
        distinguishing_aspect: "Swapping slot 13:00 onto a flight scheduled 13:05 with a partner at 15:10 (sched 15:15) moves F0 by 125 minutes — over SUBSTITUTION_MAX_SHIFT_MINUTES 120 — so the swap is rejected while a 120-minute-or-less swap would pass."
