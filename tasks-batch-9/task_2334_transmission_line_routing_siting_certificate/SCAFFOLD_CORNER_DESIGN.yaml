        distinguishing_aspect: "The certificate certifies Route A, so scheduling on a Route B segment — a route the same order pushed to REJECTED — fails at priority 40 with ERR_SEGMENT_ROUTE_MISMATCH (422) even though the segment row still exists and carries capacity."
