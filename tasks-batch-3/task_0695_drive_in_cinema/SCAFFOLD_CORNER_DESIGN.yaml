  # =========================================================================
  # Cross-cutting complexity layers — OCC, derived-field reconciliation, scheduled actions
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_rental_approve_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[rental-approve-stale-rental]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Approving a PrivateRental with expected_private_rental_version one behind the current version (after an intervening reject attempt bumps nothing — use a deliberately decremented version) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A REQUESTED private rental; its current version observed."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "VC36", fm_channel_pool: ["103.1"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /private-rentals"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", organizer_id: "org-occ", start_utc: "2026-08-20T02:00:00Z", end_utc: "2026-08-20T05:00:00Z", flat_venue_fee_cents: 100000, per_hour_cents: 10000 }
              as: VenueOperator
              captures: { r_id: $.data.id, r_v: $.data.version }
          trigger:
            - call: "POST /private-rentals/${r_id}/approve"
              payload: { expected_private_rental_version: "${r_v} - 1" }
              as: VenueOperator
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 412"
            - "trigger response error_id == ERR_STALE_VERSION"

      - name: version_increments_on_each_showtime_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Showtime.fields.status]
        excluded_because:
          difficulty_instance: compensating_invariant / stall_capacity_conserved_create_then_cancel
          rationale: "Showtime.version progression across reservation create/cancel is implicitly exercised by the OCC-guarded create+cancel in the conserved-stall §1.8 instance."

      - name: reserved_person_count_reconciled_on_create
        claim_type: derived_field_reconciliation
        grounds: [entities.Showtime.fields.reserved_person_count, calculations]
        distinguishing_aspect: "Creating a PER_PERSON reservation occupant_count=3 sets showtime.reserved_person_count to 3 (derived sum reconciled on create)."
        test_recipe:
          setup: ["A PER_PERSON showtime on a lot with person_capacity=50, no reservations."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "VC37", fm_channel_pool: ["103.3"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 50 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 100, rating: "G" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-08-21T02:00:00Z", pricing_mode: "PER_PERSON", base_price_cents: 900 }
              as: VenueOperator
              captures: { st_id: $.data.id, st_v: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { showtime_id: "${st_id}", patron_id: "patron-rp", occupant_count: 3, expected_showtime_version: "${st_v}" }
              as: Patron
              as_user_id: "patron-rp"
              captures: { resv_id: $.data.id }
          assert:
            - "Showtime.${st_id}.reserved_person_count == 3"
            - "Reservation.${resv_id}.stalls_used == 0"

      - name: rental_approve_closes_lot_reopens_on_cancel
        claim_type: cascading_side_effects
        grounds: [state_machines.PrivateRental.REQUESTED_to_APPROVED, state_machines.PrivateRental.APPROVED_to_CANCELLED, entities.Lot.fields.status]
        distinguishing_aspect: "Approving a rental sets Lot.status to CLOSED; cancelling the approved rental restores Lot.status to OPEN."
        test_recipe:
          setup: ["A REQUESTED private rental on an OPEN lot."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "VC38", fm_channel_pool: ["103.5"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /private-rentals"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", organizer_id: "org-c", start_utc: "2026-08-22T02:00:00Z", end_utc: "2026-08-22T05:00:00Z", flat_venue_fee_cents: 100000, per_hour_cents: 10000 }
              as: VenueOperator
              captures: { r_id: $.data.id, r_v: $.data.version }
            - call: "POST /private-rentals/${r_id}/approve"
              payload: { expected_private_rental_version: "${r_v}" }
              as: VenueOperator
          trigger:
            - call: "POST /private-rentals/${r_id}/cancel"
              payload: {}
              as: VenueOperator
          assert:
            - "Lot.${lot_id}.status == OPEN (closed on approve, reopened on cancel)"
            - "PrivateRental.${r_id}.status == CANCELLED"

  # =========================================================================
  # Consistency model — immediate visibility
  # =========================================================================
  - section: consistency_model
    instances:
      - name: reservation_create_reflects_capacity_immediately
        claim_type: immediate
        grounds: [entities.Showtime.fields.reserved_stall_count]
        distinguishing_aspect: "Immediately after POST /reservations, GET /showtimes/{id} shows reserved_stall_count==1 in the same logical request flow (no lag)."
        test_recipe:
          setup: ["A PER_CAR showtime, no reservations."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "VC39", fm_channel_pool: ["104.1"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 100, rating: "G" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-08-23T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000 }
              as: VenueOperator
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /reservations"
              payload: { showtime_id: "${st_id}", patron_id: "patron-im", occupant_count: 2, expected_showtime_version: "${st_v}" }
              as: Patron
              as_user_id: "patron-im"
          trigger:
            - call: "GET /showtimes/${st_id}"
              payload: {}
              as: VenueOperator
          assert:
            - "Showtime.${st_id}.reserved_stall_count == 1 (visible immediately after the create)"
