      - name: err_label_ladder_guards_ownership_then_conditional_payload
        claim_type: guard_ladder
        grounds:
          - errors[ERR_FORMULATION_PROJECT_MISMATCH]
          - errors[ERR_UNSUPPORTED_CLAIMS_REQUIRED]
          - state_machines[LabelApproval]
        distinguishing_aspect: |
          A label approval must describe a formulation of its own project, and a conditional
          regulatory decision must name the claims it does not support, so the same decision
          payload is refused with 422 when unsupported_claims is absent and accepted with 200 when
          it carries one entry, while the auto-approval side effect is a silent no-op because no
          regulatory checklist item exists yet at IDEA.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "Two IDEA projects, each with its own DRAFT formulation, and only the first formulation carried through pilot and shelf life."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /pilot-lines"
              payload: { plant_name: "Lima", line_code: "LIM-03", changeover_buffer_minutes: 240, allergen_regime: "NONE", hourly_cost_usd: 500.00 }
              as: PortfolioAdmin
              captures: { lb_line_id: $.data.id }
