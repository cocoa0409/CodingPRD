              payload: { offering_kind: "SEMINAR", title: "Rope Care", starts_at_utc: "2026-10-01T10:00:00Z", ends_at_utc: "2026-10-01T11:00:00Z", registration_cap: 10, attraction_id: "${at_id}" }
              as: EventsCoordinator
              captures: { ev_id: $.data.id }
