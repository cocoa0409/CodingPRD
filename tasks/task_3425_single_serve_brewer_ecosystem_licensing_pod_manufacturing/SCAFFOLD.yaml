# =============================================================================
# PRD Benchmark Scaffold — Single-Serve Brewer Ecosystem Licensing & Pod Manufacturing
# =============================================================================

scenario: |
  Single-Serve Brewer Ecosystem Licensing & Pod Manufacturing (Keurig Dr Pepper): brewer hardware sold at low margin to expand the installed base with pod consumption driving profit, licensing program allowing outside brands to produce compatible pods with royalty terms and quality requirements, unlicensed compatible pod competition affecting the economics with technical and marketing responses, pod manufacturing across owned and partner facilities with filling line capacity by roast and flavor, brewer installed base tracking and pod consumption modeling by household, retail assortment management for a very large number of pod varieties with slow movers, recyclable pod transitions requiring material changes and consumer education, brewer warranty and descaling support affecting long-term pod consumption

domain_name: single-serve-brewer-ecosystem
api_prefix: "/"

complexity_profile:
  primary_archetype: quota-allocation        # filling-line capacity: reserved, committed, released
  secondary_archetype: pricing-engine        # tiered royalty accrual with stacked multipliers
  complexity_layers:
    - dual_variant_calculation               # provisional-vs-final royalty; forward-vs-trailing household consumption
    - cascading_side_effects                 # audit FAIL -> license suspend -> varieties blocked -> runs cancelled
    - rate_threshold_triggers                # royalty brackets, unlicensed-share discount, descale boundary, slow-mover floor
    - ops_run_checkpoint                     # logical-clock lazy evaluation: license expiry, warranty expiry, dormancy sweep
    - version_pinning_on_approval            # assortment approval revalidates slot varieties pinned at proposal
  entity_topology: flat                      # peer entities joined by foreign keys; sub-resources used only for creation/reads
  state_machine_shape: cyclic                # license suspension loop + statement dispute loop + brewer independent dimensions
  relationship_patterns:
    - one_to_many                            # Brand->PodVariety, Facility->FillingLine, Household->Brewer
    - self_referential                       # LicenseAgreement.amendment_of_id
    - cross_aggregate                        # ProductionRun references FillingLine AND PodVariety
  role_model: peer_roles                     # each role owns a distinct resource family; BrandManager is entity-backed
  consistency_model: immediate               # all mutations visible in the same request's response

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Brand
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Brand display name" }
      - { name: kind, type: enum, source: input, description: "PLATFORM_OWNED | LICENSED | UNLICENSED_COMPATIBLE — UNLICENSED_COMPATIBLE brands sell compatible pods without an agreement and can never hold one" }
      - { name: home_region, type: string, source: input, description: "Primary market region code" }

  - name: LicenseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id; brand must have kind LICENSED" }
      - { name: territory_code, type: string, source: input, description: "ISO-style territory this agreement covers" }
      - { name: effective_start, type: string, source: input, description: "Inclusive first day (YYYY-MM-DD) the agreement is in force" }
      - { name: effective_end, type: string, source: input, description: "Inclusive last day (YYYY-MM-DD); agreement expires when the logical clock's date passes it" }
      - { name: royalty_tiers, type: array, source: input, description: "Ordered marginal brackets [{up_to_units: integer|null, millicents_per_pod: integer}]; up_to_units ascending, exactly one trailing null for the open bracket; at least one entry" }
      - { name: quality_min_cup_score, type: integer, source: input, description: "Minimum cup score (0-100) a quality audit must reach" }
      - { name: exclusive, type: boolean, source: input, description: "Exclusive territory supply; grants EXCLUSIVITY_DISCOUNT_PCT off royalty" }
      - { name: amendment_of_id, type: string, source: system, default: null, description: "FK -> LicenseAgreement.id; set on the DRAFT created by /amend; null for original agreements", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> SUSPENDED (cycle back to ACTIVE) -> TERMINATED; ACTIVE -> EXPIRED (lazy clock) / SUPERSEDED (amendment activated)" }

  - name: QualityAudit
    parent: LicenseAgreement
    common_fields: false
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> LicenseAgreement.id (path-scoped)" }
      - { name: audited_at, type: datetime, source: input, description: "When the audit was performed; must be <= logical clock" }
      - { name: cup_score, type: integer, source: input, description: "0-100 sensory score" }
      - { name: defect_rate_ppm, type: integer, source: input, description: "Defective pods per million" }
      - { name: result, type: enum, source: computed, description: "PASS when cup_score >= agreement.quality_min_cup_score AND defect_rate_ppm <= DEFECT_HARD_MAX_PPM; else FAIL. FAIL on an ACTIVE agreement cascades suspension" }

  - name: PodVariety
    parent: null
    common_fields: true
    fields:
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id; must equal acting BrandManager's X-User-ID" }
      - { name: name, type: string, source: input, description: "Variety name (e.g. 'Donut Shop Dark')" }
      - { name: roast_level, type: enum, source: input, description: "LIGHT | MEDIUM | DARK" }
      - { name: flavor_family, type: enum, source: input, description: "UNFLAVORED | FLAVORED" }
      - { name: material, type: enum, source: input, default: "CONVENTIONAL", description: "CONVENTIONAL | RECYCLABLE; changed only via transition target CONVERT_RECYCLABLE" }
      - { name: wholesale_price_cents, type: integer, source: input, description: "Per-pod wholesale price to retail" }
      - { name: margin_cents, type: integer, source: input, description: "Per-pod contribution margin used by assortment productivity" }
      - { name: education_notices_sent, type: integer, source: system, default: 0, description: "Consumer-education notices delivered; set by CONVERT_RECYCLABLE transition" }
      - { name: velocity_units_90d, type: integer, source: computed, description: "Sum of actual_units over COMPLETED ProductionRuns of this variety whose window_end falls inside [clock - 90 days, clock]" }
      - { name: slow_mover, type: boolean, source: computed, description: "true when created_at <= clock - SLOW_MOVER_MIN_AGE_DAYS AND velocity_units_90d < SLOW_MOVER_FLOOR_UNITS_90D" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> PHASE_OUT (revertible) -> DELISTED; ACTIVE <-> SUPPLY_BLOCKED via license cascade" }

  - name: BrewerModel
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "Hardware model identifier" }
      - { name: firmware_compat, type: enum, source: input, description: "OPEN (brews any pod) | RESTRICTIVE (blocks UNLICENSED_COMPATIBLE-brand pods — the technical response to unlicensed competition)" }
      - { name: warranty_months, type: integer, source: input, description: "Whole months a registered brewer stays IN_WARRANTY" }
      - { name: descale_interval_brews, type: integer, source: input, description: "Brew count interval after which descaling is due" }
      - { name: msrp_cents, type: integer, source: input, description: "Retail price of the brewer" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Manufacturing cost of the brewer" }
      - { name: subsidy_cents, type: integer, source: computed, description: "Hardware subsidy snapshot computed at creation from the global installed base (see brewer_subsidy_snapshot); never recomputed afterwards" }
      - { name: margin_cents, type: integer, source: computed, description: "= msrp_cents - unit_cost_cents - subsidy_cents" }

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: kind, type: enum, source: input, description: "OWNED | PARTNER — partner facilities run licensed-brand volume" }
      - { name: region, type: string, source: input, description: "Region code" }
      - { name: total_capacity_pods_per_day, type: integer, source: computed, description: "Sum of capacity_pods_per_day over all FillingLines at this facility" }

  - name: FillingLine
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id (path-scoped)" }
      - { name: line_code, type: string, source: input, description: "Line identifier within the facility" }
      - { name: supported_roast, type: enum, source: input, description: "LIGHT | MEDIUM | DARK | UNIVERSAL — UNIVERSAL accepts any roast_level" }
      - { name: supports_flavored, type: boolean, source: input, description: "Whether the line can fill FLAVORED varieties" }
      - { name: material_capability, type: enum, source: input, description: "CONVENTIONAL | RECYCLABLE | BOTH — which pod materials the line can run" }
      - { name: capacity_pods_per_day, type: integer, source: input, description: "Maximum pods filled per 24h day" }
      - { name: changeover_hours, type: integer, source: input, description: "Required idle gap after a run when the next run differs in roast_level or material" }

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - { name: line_id, type: string, source: input, description: "FK -> FillingLine.id" }
      - { name: variety_id, type: string, source: input, description: "FK -> PodVariety.id; variety must be ACTIVE at creation" }
      - { name: window_start, type: datetime, source: input, description: "Half-open window start; must be >= logical clock at creation" }
      - { name: window_end, type: datetime, source: input, description: "Half-open window end; must be > window_start" }
      - { name: planned_units, type: integer, source: input, description: "Pods to fill; 1 <= planned_units <= line.capacity_pods_per_day * window_days" }
      - { name: actual_units, type: integer, source: system, default: null, description: "Set on COMPLETED transition; feeds PodVariety.velocity_units_90d", constraints: "null until COMPLETED" }
      - { name: status, type: enum, source: system, description: "RESERVED -> IN_PROGRESS -> COMPLETED; RESERVED -> CANCELLED" }

  - name: Household
    parent: null
    common_fields: true
    fields:
      - { name: region, type: string, source: input, description: "Region code" }
      - { name: size, type: integer, source: input, description: "Number of residents; >= 1" }
      - { name: installed_brewers, type: integer, source: computed, description: "Count of this household's Brewers with operational in {ACTIVE, DORMANT}" }
      - { name: engagement, type: enum, source: computed, description: "ENGAGED if any brewer ACTIVE; else LAPSED if any brewer DORMANT; else CHURNED (zero brewers or all DECOMMISSIONED)" }
      - { name: trailing_avg_pods, type: number, source: computed, description: "Chronological weighted average of the last 3 ConsumptionRecords (weights 3/2/1, most recent heaviest, normalized over present records), 2dp round_half_up" }
      - { name: expected_monthly_pods, type: number, source: computed, description: "Forward-looking model: size * PER_PERSON_PODS * engagement_factor * descale_factor * warranty_factor, 2dp round_half_up" }

  - name: Brewer
    parent: Household
    common_fields: true
    fields:
      - { name: household_id, type: string, source: system, description: "FK -> Household.id (path-scoped)" }
      - { name: model_id, type: string, source: input, description: "FK -> BrewerModel.id" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial" }
      - { name: registered_at, type: datetime, source: system, description: "Logical clock timestamp at registration" }
      - { name: brew_count, type: integer, source: system, default: 0, description: "Lifetime pods brewed; incremented by record-brews" }
      - { name: last_brew_at, type: datetime, source: system, description: "Logical clock at last record-brews; initialized to registered_at" }
      - { name: last_descaled_brew_count, type: integer, source: system, default: 0, description: "brew_count at last resolved DESCALING event" }
      - { name: descale_overdue, type: boolean, source: computed, description: "true when brew_count - last_descaled_brew_count >= model.descale_interval_brews" }
      - { name: warranty_status, type: enum, source: system, description: "IN_WARRANTY -> EXPIRED (lazy: clock >= registered_at + warranty_months) | VOID (misuse-confirmed claim); VOID and EXPIRED are permanent" }
      - { name: operational, type: enum, source: system, description: "ACTIVE -> DORMANT (lazy: no brews for DORMANCY_DAYS) -> ACTIVE (record-brews reactivates); ACTIVE|DORMANT -> DECOMMISSIONED (REPLACEMENT resolve). Independent of warranty_status." }

  - name: ConsumptionRecord
    parent: Household
    common_fields: false
    fields:
      - { name: household_id, type: string, source: system, description: "FK -> Household.id (path-scoped)" }
      - { name: period, type: string, source: input, description: "Calendar month YYYY-MM; must be <= logical clock month; unique per household" }
      - { name: pods_brewed, type: integer, source: input, description: "Pods consumed by the household that month; >= 0" }

  - name: ServiceEvent
    parent: Brewer
    common_fields: true
    fields:
      - { name: brewer_id, type: string, source: system, description: "FK -> Brewer.id (path-scoped)" }
      - { name: kind, type: enum, source: input, description: "WARRANTY_CLAIM | DESCALING | REPLACEMENT" }
      - { name: note, type: string, source: input, description: "Free-text detail", constraints: "optional" }
      - { name: status, type: enum, source: system, description: "OPEN -> RESOLVED | DENIED. WARRANTY_CLAIM created while descale_overdue is DENIED at creation (resolution AUTO_DENIED_DESCALE)" }
      - { name: resolution, type: enum, source: system, default: null, description: "APPROVED | DENIED | MISUSE_CONFIRMED | AUTO_DENIED_DESCALE", constraints: "null while OPEN" }
      - { name: resolved_at, type: datetime, source: system, default: null, description: "Logical clock at resolve", constraints: "null while OPEN" }

  - name: RetailAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Retail chain name" }
      - { name: region, type: string, source: input, description: "Region code" }
      - { name: shelf_slots_total, type: integer, source: input, description: "Total pod shelf facings the account offers per period" }
      - { name: productivity_floor_cents, type: integer, source: input, description: "Minimum plan productivity required at APPROVED" }

  - name: AssortmentPlan
    parent: RetailAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> RetailAccount.id (path-scoped)" }
      - { name: period, type: string, source: input, description: "Plan period YYYY-MM" }
      - { name: slots, type: array, source: input, description: "Non-empty array of {variety_id, facings: integer >= 1, clearance_flag: boolean}" }
      - { name: productivity_cents, type: integer, source: computed, default: null, description: "Computed at APPROVED: per-slot round_half_up(facings * velocity_units_90d * margin_cents / 90, 0) THEN summed (rounding order pinned per-slot-first)", constraints: "null until APPROVED" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PROPOSED -> APPROVED -> LOCKED; PROPOSED -> DRAFT (revert); DRAFT|PROPOSED -> CANCELLED; APPROVED -> SUPERSEDED when a new plan for the same account+period is created" }

  - name: RoyaltyStatement
    parent: LicenseAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> LicenseAgreement.id (path-scoped)" }
      - { name: period, type: string, source: input, description: "Statement month YYYY-MM within the agreement window, <= current clock month; unique per agreement" }
      - { name: sell_in_units, type: integer, source: input, description: "Pods shipped into retail this period (provisional basis)" }
      - { name: sell_through_units, type: integer, source: input, description: "Confirmed pods sold through retail this period (final basis)" }
      - { name: unlicensed_share_pct, type: integer, source: input, description: "0-100 market intel estimate of unlicensed compatible pod share; >= UNLICENSED_SHARE_THRESHOLD_PCT grants the marketing-response discount" }
      - { name: provisional_royalty_cents, type: integer, source: computed, description: "At creation: marginal brackets over sell_in_units starting from bracket position 0, NO multipliers" }
      - { name: final_royalty_cents, type: integer, source: computed, default: null, description: "At ISSUED: marginal brackets over sell_through_units starting at the year's cumulative ISSUED|SETTLED units, then exclusivity, quality-penalty, unlicensed-discount multipliers in that pinned order", constraints: "null until first ISSUED" }
      - { name: dispute_count, type: integer, source: system, default: 0, description: "Increments on each ISSUED -> DISPUTED transition" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ISSUED -> SETTLED; ISSUED -> DISPUTED -> ISSUED (cycle, with corrected units)" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: LicenseAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /license-agreements/{id}/transition (target_state=ACTIVE)"
        actor: LicensingManager
        preconditions:
          - "brand.kind == LICENSED (else ERR_BRAND_NOT_LICENSED)"
          - "effective_start <= effective_end (else ERR_INVALID_WINDOW)"
          - "No ACTIVE or SUSPENDED agreement for the same brand_id + territory_code whose [effective_start, effective_end] CLOSED interval overlaps this one; agreements joined by an amendment_of_id chain are exempt from this check (ERR_TERRITORY_WINDOW_CONFLICT)"
        side_effects:
          - "If amendment_of_id is not null and that source agreement is ACTIVE: source.status -> SUPERSEDED"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /license-agreements/{id}/transition (target_state=SUSPENDED) OR system (automatic when a QualityAudit with result FAIL is created for this agreement)"
        actor: LicensingManager | system
        preconditions: []
        side_effects:
          - "Every PodVariety of this agreement's brand with status ACTIVE -> SUPPLY_BLOCKED"
          - "Every ProductionRun of those varieties with status RESERVED -> CANCELLED (its window capacity on the FillingLine is released); IN_PROGRESS runs are NOT touched"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /license-agreements/{id}/transition (target_state=ACTIVE)"
        actor: LicensingManager
        preconditions:
          - "Latest QualityAudit for this agreement (ordered by audited_at DESC, tie-break created_at DESC) has result PASS (else ERR_INVALID_STATE)"
        side_effects:
          - "Every PodVariety of this agreement's brand with status SUPPLY_BLOCKED -> ACTIVE"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /license-agreements/{id}/transition (target_state=TERMINATED)"
        actor: LicensingManager
        preconditions: []
        side_effects:
          - "Every PodVariety of this agreement's brand with status in {ACTIVE, SUPPLY_BLOCKED, PHASE_OUT} -> DELISTED"
          - "Every ProductionRun of those varieties with status RESERVED -> CANCELLED (capacity released)"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /license-agreements/{id}/transition (target_state=TERMINATED)"
        actor: LicensingManager
        preconditions: []
        side_effects:
          - "Every PodVariety of this agreement's brand with status in {SUPPLY_BLOCKED, PHASE_OUT} -> DELISTED"
          - "Every ProductionRun of those varieties with status RESERVED -> CANCELLED (capacity released)"

      - from: DRAFT
        to: TERMINATED
        trigger: "POST /license-agreements/{id}/transition (target_state=TERMINATED)"
        actor: LicensingManager
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy: evaluated on every agreement-scoped read or write — when the logical clock's date > effective_end, status becomes EXPIRED; the write that observes it then fails with ERR_AGREEMENT_EXPIRED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "DRAFT agreements never expire. SUPERSEDED is reached only via an amendment's DRAFT->ACTIVE transition."

  - entity: PodVariety
    initial_state: ACTIVE
    terminal_states: [DELISTED]
    transitions:
      - from: ACTIVE
        to: PHASE_OUT
        trigger: "POST /pod-varieties/{id}/transition (target_state=PHASE_OUT)"
        actor: BrandManager
        preconditions: []
        side_effects: []

      - from: PHASE_OUT
        to: ACTIVE
        trigger: "POST /pod-varieties/{id}/transition (target_state=ACTIVE)"
        actor: BrandManager
        preconditions: []
        side_effects: []
        note: "Revert path — PHASE_OUT is not absorbing"

      - from: ACTIVE
        to: DELISTED
        trigger: "POST /pod-varieties/{id}/transition (target_state=DELISTED)"
        actor: BrandManager
        preconditions: []
        side_effects:
          - "Every ProductionRun of this variety with status RESERVED -> CANCELLED (capacity released)"

      - from: PHASE_OUT
        to: DELISTED
        trigger: "POST /pod-varieties/{id}/transition (target_state=DELISTED)"
        actor: BrandManager
        preconditions: []
        side_effects:
          - "Every ProductionRun of this variety with status RESERVED -> CANCELLED (capacity released)"

      - from: ACTIVE
        to: SUPPLY_BLOCKED
        trigger: "system (license suspension cascade — see LicenseAgreement ACTIVE->SUSPENDED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUPPLY_BLOCKED
        to: ACTIVE
        trigger: "system (license reinstatement cascade — see LicenseAgreement SUSPENDED->ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUPPLY_BLOCKED
        to: DELISTED
        trigger: "system (license termination cascade — see LicenseAgreement ->TERMINATED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /pod-varieties/{id}/transition (target_state=CONVERT_RECYCLABLE)"
        actor: BrandManager
        preconditions:
          - "education_notices_sent payload >= EDUCATION_MIN_NOTICES (else ERR_EDUCATION_REQUIRED)"
          - "At least one FillingLine exists with material_capability in {RECYCLABLE, BOTH} (else ERR_NO_COMPATIBLE_LINE)"
        side_effects:
          - "material CONVENTIONAL -> RECYCLABLE"
          - "education_notices_sent := payload value"
        note: "Material conversion is a same-state transition; status stays ACTIVE. Already-RECYCLABLE varieties cannot convert (ERR_INVALID_STATE)."

  - entity: ProductionRun
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: RESERVED
        to: IN_PROGRESS
        trigger: "POST /production-runs/{id}/transition (target_state=IN_PROGRESS)"
        actor: ProductionPlanner
        preconditions:
          - "window_start <= logical clock < window_end (else ERR_INVALID_STATE: window not open)"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /production-runs/{id}/transition (target_state=COMPLETED)"
        actor: ProductionPlanner
        preconditions:
          - "actual_units payload present, 0 <= actual_units <= line.capacity_pods_per_day * window_days where window_days = ceil((window_end - window_start)/86400), minimum 1 (else ERR_CAPACITY_EXCEEDED)"
        side_effects:
          - "actual_units := payload; contributes to PodVariety.velocity_units_90d once window_end is inside the trailing 90-day window"

      - from: RESERVED
        to: CANCELLED
        trigger: "POST /production-runs/{id}/transition (target_state=CANCELLED)"
        actor: ProductionPlanner
        preconditions: []
        side_effects:
          - "Window capacity on the FillingLine is released (compensating invariant: reserved+free is conserved)"

  - entity: Brewer
    initial_state: "operational=ACTIVE, warranty_status=IN_WARRANTY (two independent dimensions)"
    terminal_states: ["operational=DECOMMISSIONED"]
    transitions:
      - from: "operational ACTIVE"
        to: "operational DORMANT"
        trigger: "system (lazy: evaluated on every brewer-scoped read or write — when logical clock - last_brew_at >= DORMANCY_DAYS, operational becomes DORMANT and is persisted on writes)"
        actor: system
        preconditions: []
        side_effects:
          - "Household.engagement recomputes (ENGAGED -> LAPSED when no other brewer ACTIVE); expected_monthly_pods recomputes"

      - from: "operational DORMANT"
        to: "operational ACTIVE"
        trigger: "POST /brewers/{id}/record-brews (automatic reactivation on any recorded brew)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Household.engagement recomputes (LAPSED -> ENGAGED); expected_monthly_pods recomputes"

      - from: "operational ACTIVE|DORMANT"
        to: "operational DECOMMISSIONED"
        trigger: "POST /service-events/{id}/resolve (outcome=APPROVED) on a REPLACEMENT event of this brewer"
        actor: SupportAgent
        preconditions: []
        side_effects:
          - "Household.installed_brewers recomputes; if it reaches 0, Household.engagement -> CHURNED and expected_monthly_pods -> 0.00"

      - from: "warranty_status IN_WARRANTY"
        to: "warranty_status EXPIRED"
        trigger: "system (lazy: evaluated on every brewer-scoped read or write — when logical clock >= registered_at + model.warranty_months months, warranty_status becomes EXPIRED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Independent of the operational dimension; a DORMANT brewer still ages out of warranty"

      - from: "warranty_status IN_WARRANTY"
        to: "warranty_status VOID"
        trigger: "POST /service-events/{id}/resolve (outcome=MISUSE_CONFIRMED) on a WARRANTY_CLAIM of this brewer"
        actor: SupportAgent
        preconditions: []
        side_effects: []

  - entity: ServiceEvent
    initial_state: OPEN
    terminal_states: [RESOLVED, DENIED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /service-events/{id}/resolve (outcome=APPROVED or MISUSE_CONFIRMED)"
        actor: SupportAgent
        preconditions: []
        side_effects:
          - "kind=DESCALING and outcome=APPROVED: brewer.last_descaled_brew_count := brewer.brew_count (descale_overdue clears)"
          - "kind=WARRANTY_CLAIM and outcome=MISUSE_CONFIRMED: brewer.warranty_status -> VOID"
          - "kind=REPLACEMENT and outcome=APPROVED: brewer.operational -> DECOMMISSIONED, then Household.installed_brewers recomputes, then engagement/expected_monthly_pods recompute"
          - "resolved_at := logical clock; resolution := payload outcome"

      - from: OPEN
        to: DENIED
        trigger: "POST /service-events/{id}/resolve (outcome=DENIED)"
        actor: SupportAgent
        preconditions: []
        side_effects:
          - "resolved_at := logical clock; resolution := DENIED"

  - entity: AssortmentPlan
    initial_state: DRAFT
    terminal_states: [LOCKED, CANCELLED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /assortment-plans/{id}/transition (target_state=PROPOSED)"
        actor: CategoryManager
        preconditions:
          - "slots non-empty (else ERR_EMPTY_SLOTS)"
          - "Every slot variety status in {ACTIVE, PHASE_OUT} (else ERR_VARIETY_NOT_LISTABLE)"
          - "sum(slots.facings) <= account.shelf_slots_total (else ERR_CAPACITY_EXCEEDED)"
        side_effects: []

      - from: PROPOSED
        to: APPROVED
        trigger: "POST /assortment-plans/{id}/transition (target_state=APPROVED)"
        actor: CategoryManager
        preconditions:
          - "Re-validate every slot variety status in {ACTIVE, PHASE_OUT} against CURRENT state — a variety delisted since proposal fails here (else ERR_VARIETY_NOT_LISTABLE)"
          - "productivity_cents (recomputed now, per-slot rounding then sum) >= account.productivity_floor_cents (else ERR_PRODUCTIVITY_FLOOR_UNMET)"
        side_effects:
          - "productivity_cents computed and pinned on the plan"

      - from: APPROVED
        to: LOCKED
        trigger: "POST /assortment-plans/{id}/transition (target_state=LOCKED)"
        actor: CategoryManager
        preconditions:
          - "Every slot with a slow_mover variety has clearance_flag == true (else ERR_SLOW_MOVER_SLOT)"
        side_effects: []

      - from: PROPOSED
        to: DRAFT
        trigger: "POST /assortment-plans/{id}/transition (target_state=DRAFT)"
        actor: CategoryManager
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /assortment-plans/{id}/transition (target_state=CANCELLED)"
        actor: CategoryManager
        preconditions: []
        side_effects: []

      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /assortment-plans/{id}/transition (target_state=CANCELLED)"
        actor: CategoryManager
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (automatic when a new AssortmentPlan is created for the same account_id + period)"
        actor: system
        preconditions: []
        side_effects: []
        note: "A LOCKED plan can never be superseded — creating a same-period plan while a LOCKED plan exists fails with ERR_INVALID_STATE"

  - entity: RoyaltyStatement
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /royalty-statements/{id}/transition (target_state=ISSUED)"
        actor: FinanceAnalyst
        preconditions:
          - "agreement.status == ACTIVE — if SUSPENDED then ERR_LICENSE_SUSPENDED; if DRAFT/TERMINATED/SUPERSEDED then ERR_INVALID_STATE; lazy expiry applies first (ERR_AGREEMENT_EXPIRED)"
        side_effects:
          - "final_royalty_cents computed (final variant: cumulative bracket position, exclusivity -> quality-penalty -> unlicensed-discount order)"

      - from: ISSUED
        to: DISPUTED
        trigger: "POST /royalty-statements/{id}/transition (target_state=DISPUTED, dispute_reason required)"
        actor: FinanceAnalyst
        preconditions: []
        side_effects:
          - "dispute_count += 1"

      - from: DISPUTED
        to: ISSUED
        trigger: "POST /royalty-statements/{id}/transition (target_state=ISSUED; sell_through_units / unlicensed_share_pct payloads, when present, replace the stored values before recomputation)"
        actor: FinanceAnalyst
        preconditions:
          - "agreement.status == ACTIVE (same error split as DRAFT->ISSUED)"
        side_effects:
          - "final_royalty_cents recomputed from the corrected inputs"

      - from: ISSUED
        to: SETTLED
        trigger: "POST /royalty-statements/{id}/transition (target_state=SETTLED)"
        actor: FinanceAnalyst
        preconditions: []
        side_effects: []

# =============================================================================
# Section 1.2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: license-amend-stale-agreement
    parent_entity: LicenseAgreement
    write_endpoint: "POST /license-agreements/{id}/amend"
    occ_field: expected_license_agreement_version
    description: |
      Creating an amendment DRAFT against a LicenseAgreement whose version has
      advanced since the client last observed it is rejected. Another writer may
      have transitioned or amended the agreement in between, so the would-be
      amendment is based on stale terms; the client must re-read and retry.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: assortment-create-stale-account
    parent_entity: RetailAccount
    write_endpoint: "POST /retail-accounts/{id}/assortment-plans"
    occ_field: expected_retail_account_version
    description: |
      Creating an AssortmentPlan against a RetailAccount whose version has
      advanced since the client last observed it is rejected. A new plan for the
      same period legitimately supersedes the prior APPROVED plan, so a plan
      written from a stale account view must not silently supersede plans the
      client never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: royalty_accrual
    trigger: "RoyaltyStatement creation (provisional variant) and DRAFT|DISPUTED -> ISSUED transition (final variant)"
    algorithm: tiered_pricing
    formula: |
      # Shared marginal bracket walk over the agreement's royalty_tiers.
      # Brackets are MARGINAL: units up to each up_to_units boundary are billed
      # at that bracket's millicents_per_pod; the open bracket (up_to_units null)
      # takes the remainder.
      def bracket_cents(units, start_position, tiers):
          cents = 0.0            # accumulated with 2dp slice rounding
          consumed = start_position
          remaining = units
          for tier in tiers:     # ascending order as declared
              cap = tier.up_to_units
              room = infinity if cap is null else max(0, cap - consumed)
              take = min(remaining, room)
              slice = round_half_up(take * tier.millicents_per_pod / 1000, 2)
              cents += slice
              consumed += take
              remaining -= take
              if remaining == 0: break
          return round_half_up(cents, 0)

      # PROVISIONAL (at statement creation):
      provisional_royalty_cents = bracket_cents(sell_in_units, 0, tiers)
      #   — no multipliers of any kind.

      # FINAL (at ISSUED):
      prior_units = sum(sell_through_units of this agreement's statements with
                        status in {ISSUED, SETTLED} and period in the same
                        calendar year as this statement's period)
      base = bracket_cents(sell_through_units, prior_units, tiers)
      # Multiplier order is PINNED; each step rounds to integer cents half-up:
      step1 = round_half_up(base * (1 - EXCLUSIVITY_DISCOUNT_PCT/100), 0) if agreement.exclusive else base
      latest = latest QualityAudit of the agreement (audited_at DESC, tie-break created_at DESC)
      step2 = round_half_up(step1 * (1 + QUALITY_PENALTY_PCT/100), 0)
              if (latest exists and latest.defect_rate_ppm > DEFECT_SOFT_MAX_PPM) else step1
      final_royalty_cents = round_half_up(step2 * (1 - UNLICENSED_DISCOUNT_PCT/100), 0)
              if unlicensed_share_pct >= UNLICENSED_SHARE_THRESHOLD_PCT else step2
    input_set: "Statements of one agreement; final variant counts only ISSUED|SETTLED statements in the same calendar year for bracket position"
    constants:
      EXCLUSIVITY_DISCOUNT_PCT: 8
      QUALITY_PENALTY_PCT: 10
      DEFECT_SOFT_MAX_PPM: 200
      DEFECT_HARD_MAX_PPM: 500
      UNLICENSED_SHARE_THRESHOLD_PCT: 15
      UNLICENSED_DISCOUNT_PCT: 5
    precision: "integer cents; bracket slices rounded to 2dp half-up, each multiplier step re-rounded to integer cents half-up"
    variants:
      - name: provisional
        when: "statement creation (status DRAFT)"
        difference: "uses sell_in_units, bracket position always starts at 0, and applies NO exclusivity / quality / unlicensed multipliers — identical inputs therefore diverge from final"
      - name: final
        when: "DRAFT|DISPUTED -> ISSUED"
        difference: "uses sell_through_units, bracket position starts at same-year ISSUED|SETTLED cumulative units, and applies the three pinned multipliers"

  - name: household_consumption_model
    trigger: "recomputed on every read of Household and after any brewer/consumption mutation on that household"
    algorithm: forward_looking
    formula: |
      # Forward-looking variant:
      engagement_factor = 1.0 if ENGAGED else 0.4 if LAPSED else 0.0   # CHURNED
      descale_factor = 0.85 if any ACTIVE brewer of the household has descale_overdue true else 1.0
      warranty_factor = 0.90 if (installed_brewers > 0 and every non-DECOMMISSIONED brewer has warranty_status != IN_WARRANTY) else 1.0
      expected_monthly_pods = round_half_up(size * PER_PERSON_PODS * engagement_factor * descale_factor * warranty_factor, 2)
    input_set: "The household plus all its brewers (operational/warranty as currently evaluated)"
    constants:
      PER_PERSON_PODS: 30
    precision: "2 decimal places, round_half_up"
    variants:
      - name: forward_looking
        when: "expected_monthly_pods field"
        difference: "projects from household size and brewer engagement/descale/warranty posture; ignores ConsumptionRecords entirely"
      - name: chronological_trailing
        when: "trailing_avg_pods field"
        difference: "weighted replay of the last 3 ConsumptionRecords by period DESC with weights 3,2,1 normalized over present records: (3*p1 + 2*p2 + 1*p3) / (3+2+1 present-weight sum); zero records -> 0.00; ignores brewer posture entirely"

  - name: brewer_subsidy_snapshot
    trigger: "POST /brewer-models (computed once at creation; never recomputed)"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is PINNED to break the circular-looking dependency
      # (subsidy -> price -> future brewer sales -> installed base -> subsidy):
      #   1. snapshot the CURRENT global installed base (count of all Brewers
      #      with operational in {ACTIVE, DORMANT} across all households) at
      #      creation time — future sales are NOT projected;
      #   2. recoverable_per_brewer_cents = AVG_PODS_PER_BREWER_MONTH * POD_MARGIN_CENTS
      #      * SUBSIDY_RECOVERY_RATIO / PAYBACK_MONTHS   (= 40*18*0.5/24 = 15 cents);
      #   3. subsidy_cents = min(SUBSIDY_CAP_CENTS, round_half_up(base_snapshot * 15, 0));
      #   4. margin_cents = msrp_cents - unit_cost_cents - subsidy_cents.
      # Existing models are never re-snapshotted: two models created before and
      # after installed-base growth carry different subsidies by design.
    input_set: "All Brewers with operational in {ACTIVE, DORMANT} at model-creation time"
    constants:
      AVG_PODS_PER_BREWER_MONTH: 40
      POD_MARGIN_CENTS: 18
      SUBSIDY_RECOVERY_RATIO: 0.5
      PAYBACK_MONTHS: 24
      SUBSIDY_CAP_CENTS: 20000
    precision: "integer cents, round_half_up"

  - name: variety_velocity
    trigger: "recomputed on read of PodVariety and during AssortmentPlan approval / slow-mover evaluation"
    algorithm: aggregation
    formula: |
      velocity_units_90d = sum(actual_units over ProductionRuns of this variety
                               with status COMPLETED and
                               clock - 90 days <= window_end <= clock)
      age_ok = created_at <= clock - SLOW_MOVER_MIN_AGE_DAYS
      slow_mover = age_ok AND velocity_units_90d < SLOW_MOVER_FLOOR_UNITS_90D
    input_set: "COMPLETED runs only; RESERVED/IN_PROGRESS/CANCELLED runs never contribute; window boundary is inclusive on both ends"
    constants:
      SLOW_MOVER_FLOOR_UNITS_90D: 50000
      SLOW_MOVER_MIN_AGE_DAYS: 90
    precision: "integer units"

  - name: assortment_productivity
    trigger: "AssortmentPlan PROPOSED -> APPROVED"
    algorithm: weighted_scoring
    formula: |
      # Rounding order is PINNED: round each slot to integer cents FIRST, then sum.
      # (Summing raw fractions then rounding once yields a different total and is
      #  NOT the contract.)
      productivity_cents = sum over slots of
          round_half_up(facings * variety.velocity_units_90d * variety.margin_cents / 90, 0)
      # variety fields are read at approval time (re-validation on approval).
    input_set: "The plan's slots with current PodVariety.velocity_units_90d and margin_cents"
    precision: "integer cents, round_half_up per slot"

  - name: filling_line_capacity
    trigger: "ProductionRun creation and IN_PROGRESS -> COMPLETED"
    algorithm: threshold
    formula: |
      window_days = max(1, ceil((window_end - window_start) / 86400))
      # Runs never overlap on a line (see temporal_overlap_rules), so per-day
      # load is single-run: planned_units <= capacity_pods_per_day * window_days
      # at creation; actual_units <= capacity_pods_per_day * window_days at
      # completion (ERR_CAPACITY_EXCEEDED otherwise).
      # Compensating invariant: create-then-cancel leaves the line's bookable
      # windows exactly as before — no capacity drift.
    input_set: "Runs of one FillingLine with status RESERVED or IN_PROGRESS"
    precision: "integer units"

  - name: descale_and_dormancy_clock
    trigger: "record-brews (descale), every brewer-scoped read/write (lazy dormancy and warranty expiry)"
    algorithm: threshold
    formula: |
      descale_overdue = (brew_count - last_descaled_brew_count) >= model.descale_interval_brews
      # boundary: equality means overdue (>=, not >)
      dormant_when = (clock - last_brew_at) >= DORMANCY_DAYS   # boundary: equality flips to DORMANT
      warranty_expired_when = clock >= registered_at + model.warranty_months months  # equality expires
    input_set: "One brewer, its model, and the logical clock"
    constants:
      DORMANCY_DAYS: 60
    precision: "integer brews / whole days"

  - name: temporal_overlap_rules
    trigger: "ProductionRun creation; LicenseAgreement creation and activation"
    algorithm: interval_merge
    formula: |
      # (i) FillingLine runs — HALF-OPEN [window_start, window_end):
      #     two runs on the same line conflict iff start_a < end_b AND start_b < end_a
      #     (back-to-back runs where end_a == start_b are allowed).
      #     CHANGEOVER BUFFER: when two runs on the same line differ in
      #     roast_level OR material, the later run must additionally satisfy
      #     later.start >= earlier.end + line.changeover_hours
      #     (ERR_CHANGEOVER_BUFFER_VIOLATION) — this makes adjacency legal only
      #     for same-spec runs.
      # (ii) LicenseAgreement territory windows — CLOSED [effective_start, effective_end]
      #     at day granularity: two agreements for the same brand_id +
      #     territory_code with status in {ACTIVE, SUSPENDED} conflict iff
      #     start_a <= end_b AND start_b <= end_a; an agreement starting the day
      #     AFTER another's effective_end is legal, starting ON effective_end
      #     conflicts (ERR_TERRITORY_WINDOW_CONFLICT). Amendment-chain members
      #     are exempt.
      # The two rules deliberately differ: half-open with conditional buffer vs
      # closed day-granularity without buffer.
    input_set: "Non-terminal runs of one line; ACTIVE|SUSPENDED agreements of one brand+territory"
    precision: "datetimes to the second (runs); dates to the day (agreements)"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "BrandManager ownership: X-User-ID must equal the brand_id of the PodVariety being created or transitioned"
    error_id: ERR_BRAND_OWNERSHIP
    http_status: 403
    applies_to: "POST /pod-varieties, POST /pod-varieties/{id}/transition"

  - priority: 4
    category: existence
    check: "Path resources exist, validated left-to-right; body foreign keys (brand_id, model_id, line_id, variety_id, slots[].variety_id) resolve"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 5
    category: business_constraint
    check: "Payload shape: required fields present, types correct, enum membership valid, numeric ranges valid (pods_brewed >= 0, brews 1..10000, unlicensed_share_pct 0..100, cup_score 0..100, facings >= 1, size >= 1); period format YYYY-MM and not after the current clock month; royalty_tiers non-empty, ascending, exactly one trailing null up_to_units; slots array non-empty on plan creation"
    error_id: "ERR_INVALID_REQUEST / ERR_EMPTY_SLOTS (plan create or propose with empty slots)"
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 6
    category: business_constraint
    check: "Window shape: window_start < window_end (runs); effective_start <= effective_end (agreements)"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /production-runs, POST /license-agreements, POST /license-agreements/{id}/amend"

  - priority: 7
    category: state
    check: "State precondition: the (from, target) pair is a declared transition of the entity's state machine; terminal states accept no transitions; lazy evaluations (agreement expiry, brewer dormancy, warranty expiry) are applied BEFORE this check"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all /transition and /resolve endpoints"

  - priority: 8
    category: state
    check: "OCC: expected_license_agreement_version == LicenseAgreement.version; expected_retail_account_version == RetailAccount.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /license-agreements/{id}/amend, POST /retail-accounts/{id}/assortment-plans"

  - priority: 9
    category: business_temporal
    check: "Temporal: run window_start >= logical clock (else ERR_WINDOW_IN_PAST); agreement-scoped writes after lazy expiry (else ERR_AGREEMENT_EXPIRED); audit audited_at <= logical clock (else ERR_WINDOW_IN_PAST is NOT used — future audit dates are ERR_INVALID_REQUEST at priority 5)"
    error_id: "ERR_WINDOW_IN_PAST / ERR_AGREEMENT_EXPIRED"
    http_status: 422
    note: "ERR_WINDOW_IN_PAST is 422; ERR_AGREEMENT_EXPIRED is 409 per the error catalog"
    applies_to: "POST /production-runs, agreement-scoped writes"

  - priority: 10
    category: business_constraint
    check: "Resource conflicts and capability: line half-open overlap (ERR_LINE_WINDOW_CONFLICT); changeover buffer (ERR_CHANGEOVER_BUFFER_VIOLATION); territory closed-interval overlap (ERR_TERRITORY_WINDOW_CONFLICT); line roast/flavor/material capability (ERR_LINE_INCOMPATIBLE); conversion requires a RECYCLABLE-capable line to exist (ERR_NO_COMPATIBLE_LINE); unique (agreement, period) statement (ERR_DUPLICATE_STATEMENT_PERIOD); unique (household, period) record (ERR_DUPLICATE_CONSUMPTION_PERIOD)"
    error_id: "ERR_LINE_WINDOW_CONFLICT / ERR_CHANGEOVER_BUFFER_VIOLATION / ERR_TERRITORY_WINDOW_CONFLICT / ERR_LINE_INCOMPATIBLE / ERR_NO_COMPATIBLE_LINE / ERR_DUPLICATE_STATEMENT_PERIOD / ERR_DUPLICATE_CONSUMPTION_PERIOD"
    http_status: 409
    note: "Per-error HTTP status is authoritative in the error catalog: ERR_LINE_INCOMPATIBLE is 422; the conflict/duplicate errors are 409"
    applies_to: "POST /production-runs, POST /license-agreements(+transition/amend), POST /pod-varieties/{id}/transition, statement/record creation"

  - priority: 11
    category: business_referential
    check: "Referenced-entity state: run variety ACTIVE (ERR_VARIETY_NOT_ACTIVE); plan slot varieties in {ACTIVE, PHASE_OUT} (ERR_VARIETY_NOT_LISTABLE); agreement ACTIVE for statement issue / statement creation (SUSPENDED -> ERR_LICENSE_SUSPENDED, other non-ACTIVE -> ERR_INVALID_STATE); agreement status in {ACTIVE, SUSPENDED} for audit creation (else ERR_INVALID_STATE); brand kind LICENSED for agreements (ERR_BRAND_NOT_LICENSED); WARRANTY_CLAIM requires brewer IN_WARRANTY (ERR_WARRANTY_NOT_ACTIVE); record-brews variety exists and not DELISTED (ERR_VARIETY_NOT_ACTIVE); RESTRICTIVE brewer + UNLICENSED_COMPATIBLE-brand variety (ERR_POD_BLOCKED); CONVERT_RECYCLABLE requires education_notices_sent >= 1 (ERR_EDUCATION_REQUIRED); record-brews brewer not DECOMMISSIONED (ERR_INVALID_STATE)"
    error_id: "ERR_VARIETY_NOT_ACTIVE / ERR_VARIETY_NOT_LISTABLE / ERR_LICENSE_SUSPENDED / ERR_BRAND_NOT_LICENSED / ERR_WARRANTY_NOT_ACTIVE / ERR_POD_BLOCKED / ERR_EDUCATION_REQUIRED"
    http_status: 409
    note: "Per-error HTTP status is authoritative in the error catalog: ERR_BRAND_NOT_LICENSED, ERR_POD_BLOCKED and ERR_EDUCATION_REQUIRED are 422; the rest are 409"
    applies_to: "POST /production-runs, plan transitions, statement creation/transition, audit creation, agreement creation, service-event creation, record-brews, variety transition"

  - priority: 12
    category: business_fiscal
    check: "Capacity and fiscal floors last: run planned/actual units <= capacity_pods_per_day * window_days (ERR_CAPACITY_EXCEEDED); plan facings <= shelf_slots_total (ERR_CAPACITY_EXCEEDED); plan productivity >= productivity_floor_cents (ERR_PRODUCTIVITY_FLOOR_UNMET); no non-clearance slow-mover slots at LOCKED (ERR_SLOW_MOVER_SLOT)"
    error_id: "ERR_CAPACITY_EXCEEDED / ERR_PRODUCTIVITY_FLOOR_UNMET / ERR_SLOW_MOVER_SLOT"
    http_status: 409
    note: "ERR_PRODUCTIVITY_FLOOR_UNMET is 422 per the error catalog; the others are 409"
    applies_to: "run create/complete, plan PROPOSED/APPROVED/LOCKED transitions"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving / clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-09-01T00:00:00Z (fixed startup default — never wall-clock). All lazy evaluations (agreement expiry, warranty expiry, dormancy) and window checks read this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["sets the logical clock; subsequent lazy evaluations use the new value"]

  # --- Brand ---
  - method: POST
    path: "/brands"
    description: "Register a brand (platform-owned, licensed, or unlicensed compatible)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, kind, home_region]
    output: Brand
    side_effects: []

  # --- LicenseAgreement ---
  - method: POST
    path: "/license-agreements"
    description: "Create a license agreement in DRAFT"
    roles: [LicensingManager]
    code: 201
    input: [brand_id, territory_code, effective_start, effective_end, royalty_tiers, quality_min_cup_score, exclusive]
    output: LicenseAgreement
    side_effects: ["status=DRAFT, amendment_of_id=null, version=1"]

  - method: GET
    path: "/license-agreements/{id}"
    description: "Read one agreement (lazy EXPIRED evaluation applied)"
    roles: [LicensingManager, QualityAuditor, FinanceAnalyst]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: []

  - method: GET
    path: "/license-agreements"
    description: "List agreements with optional filters"
    roles: [LicensingManager, FinanceAnalyst]
    code: 200
    input: ["brand_id?", "amendment_of_id?", "status?", "territory_code?", "limit?", "offset?"]
    output: "LicenseAgreement[]"
    side_effects: []

  - method: POST
    path: "/license-agreements/{id}/transition"
    description: "Drive the agreement state machine; target_state in {ACTIVE, SUSPENDED, TERMINATED}"
    roles: [LicensingManager]
    code: 200
    input: [target_state]
    output: LicenseAgreement
    side_effects:
      - "increments LicenseAgreement.version by 1"
      - "ACTIVE->SUSPENDED cascades: brand's ACTIVE varieties -> SUPPLY_BLOCKED; their RESERVED runs -> CANCELLED"
      - "SUSPENDED->ACTIVE cascades: SUPPLY_BLOCKED varieties -> ACTIVE"
      - "->TERMINATED cascades: varieties -> DELISTED; RESERVED runs -> CANCELLED"
      - "amendment DRAFT->ACTIVE: source agreement -> SUPERSEDED"

  - method: POST
    path: "/license-agreements/{id}/amend"
    description: "Create an amendment DRAFT that will supersede this agreement when activated"
    roles: [LicensingManager]
    code: 201
    input: [expected_license_agreement_version, territory_code, effective_start, effective_end, royalty_tiers, quality_min_cup_score, exclusive]
    output: LicenseAgreement
    side_effects:
      - "requires source status ACTIVE and expected_license_agreement_version == source.version (ERR_STALE_VERSION 412)"
      - "increments source LicenseAgreement.version by 1"
      - "new agreement: status=DRAFT, amendment_of_id=source.id, brand_id copied from source, version=1"

  # --- QualityAudit ---
  - method: POST
    path: "/license-agreements/{id}/quality-audits"
    description: "Record a completed quality audit; a FAIL result on an ACTIVE agreement fires the suspension cascade"
    roles: [QualityAuditor]
    code: 201
    input: [audited_at, cup_score, defect_rate_ppm]
    output: QualityAudit
    side_effects:
      - "result computed (PASS/FAIL)"
      - "result FAIL and agreement ACTIVE: agreement -> SUSPENDED (full cascade per state machine)"

  - method: GET
    path: "/license-agreements/{id}/quality-audits"
    description: "List audits of an agreement (audited_at DESC, tie-break created_at DESC)"
    roles: [QualityAuditor, LicensingManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "QualityAudit[]"
    side_effects: []

  # --- PodVariety ---
  - method: POST
    path: "/pod-varieties"
    description: "Create a pod variety (ACTIVE at creation)"
    roles: [BrandManager]
    code: 201
    input: [brand_id, name, roast_level, flavor_family, "material?", wholesale_price_cents, margin_cents]
    output: PodVariety
    side_effects: ["status=ACTIVE, material defaults CONVENTIONAL, version=1"]

  - method: GET
    path: "/pod-varieties/{id}"
    description: "Read one variety (velocity/slow_mover recomputed against the logical clock)"
    roles: [BrandManager, CategoryManager, ProductionPlanner, PlatformAdmin]
    code: 200
    input: []
    output: PodVariety
    side_effects: []

  - method: GET
    path: "/pod-varieties"
    description: "List varieties with optional filters"
    roles: [BrandManager, CategoryManager, ProductionPlanner, PlatformAdmin]
    code: 200
    input: ["brand_id?", "status?", "roast_level?", "material?", "limit?", "offset?"]
    output: "PodVariety[]"
    side_effects: []

  - method: POST
    path: "/pod-varieties/{id}/transition"
    description: "Drive the variety state machine; target_state in {PHASE_OUT, ACTIVE, DELISTED, CONVERT_RECYCLABLE}"
    roles: [BrandManager]
    code: 200
    input: [target_state, "education_notices_sent?"]
    output: PodVariety
    side_effects:
      - "increments PodVariety.version by 1"
      - "->DELISTED cascades: this variety's RESERVED runs -> CANCELLED"
      - "CONVERT_RECYCLABLE: material -> RECYCLABLE, education_notices_sent := payload"

  # --- BrewerModel ---
  - method: POST
    path: "/brewer-models"
    description: "Register a brewer model; subsidy_cents snapshot and margin_cents computed at creation"
    roles: [PlatformAdmin]
    code: 201
    input: [model_code, firmware_compat, warranty_months, descale_interval_brews, msrp_cents, unit_cost_cents]
    output: BrewerModel
    side_effects: ["subsidy_cents snapshot from current global installed base; margin_cents derived"]

  # --- Facility / FillingLine ---
  - method: POST
    path: "/facilities"
    description: "Register a production facility (OWNED or PARTNER)"
    roles: [OperationsDirector]
    code: 201
    input: [name, kind, region]
    output: Facility
    side_effects: ["total_capacity_pods_per_day = 0"]

  - method: GET
    path: "/facilities/{id}"
    description: "Read one facility including computed total capacity"
    roles: [OperationsDirector, ProductionPlanner]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: POST
    path: "/facilities/{id}/filling-lines"
    description: "Add a filling line to a facility"
    roles: [OperationsDirector]
    code: 201
    input: [line_code, supported_roast, supports_flavored, material_capability, capacity_pods_per_day, changeover_hours]
    output: FillingLine
    side_effects: ["facility.total_capacity_pods_per_day recomputes"]

  - method: GET
    path: "/facilities/{id}/filling-lines"
    description: "List filling lines of a facility"
    roles: [OperationsDirector, ProductionPlanner]
    code: 200
    input: ["limit?", "offset?"]
    output: "FillingLine[]"
    side_effects: []

  # --- ProductionRun ---
  - method: POST
    path: "/production-runs"
    description: "Reserve a filling-line window for a variety (creates status RESERVED)"
    roles: [ProductionPlanner]
    code: 201
    input: [line_id, variety_id, window_start, window_end, planned_units]
    output: ProductionRun
    side_effects: ["status=RESERVED; capacity committed for the window"]

  - method: GET
    path: "/production-runs/{id}"
    description: "Read one production run"
    roles: [ProductionPlanner, OperationsDirector]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []

  - method: GET
    path: "/production-runs"
    description: "List production runs with optional filters"
    roles: [ProductionPlanner, OperationsDirector]
    code: 200
    input: ["line_id?", "variety_id?", "status?", "limit?", "offset?"]
    output: "ProductionRun[]"
    side_effects: []

  - method: POST
    path: "/production-runs/{id}/transition"
    description: "Drive the run state machine; target_state in {IN_PROGRESS, COMPLETED, CANCELLED}; actual_units required when COMPLETED"
    roles: [ProductionPlanner]
    code: 200
    input: [target_state, "actual_units?"]
    output: ProductionRun
    side_effects:
      - "increments ProductionRun.version by 1"
      - "COMPLETED: actual_units stored; feeds variety velocity"
      - "CANCELLED: window capacity released"

  # --- Household ---
  - method: POST
    path: "/households"
    description: "Register a household"
    roles: [PlatformAdmin]
    code: 201
    input: [region, size]
    output: Household
    side_effects: ["installed_brewers=0, engagement=CHURNED, trailing_avg_pods=0.00, expected_monthly_pods=0.00"]

  - method: GET
    path: "/households/{id}"
    description: "Read one household (all computed fields recomputed)"
    roles: [PlatformAdmin, SupportAgent]
    code: 200
    input: []
    output: Household
    side_effects: []

  # --- Brewer ---
  - method: POST
    path: "/households/{id}/brewers"
    description: "Register a brewer to a household"
    roles: [PlatformAdmin]
    code: 201
    input: [model_id, serial_number]
    output: Brewer
    side_effects: ["operational=ACTIVE, warranty_status=IN_WARRANTY, registered_at=logical clock, last_brew_at=registered_at, brew_count=0; household engagement/installed_brewers/expected_monthly_pods recompute"]

  - method: GET
    path: "/brewers/{id}"
    description: "Read one brewer (lazy dormancy and warranty-expiry evaluation applied)"
    roles: [PlatformAdmin, SupportAgent]
    code: 200
    input: []
    output: Brewer
    side_effects: []

  - method: GET
    path: "/brewers"
    description: "List brewers with optional filters"
    roles: [PlatformAdmin, SupportAgent]
    code: 200
    input: ["household_id?", "model_id?", "operational?", "warranty_status?", "limit?", "offset?"]
    output: "Brewer[]"
    side_effects: []

  - method: POST
    path: "/brewers/{id}/record-brews"
    description: "Record pods brewed on a brewer for a variety; reactivates DORMANT brewers"
    roles: [PlatformAdmin]
    code: 200
    input: [brews, variety_id]
    output: Brewer
    side_effects:
      - "increments Brewer.version by 1"
      - "brew_count += brews; last_brew_at := logical clock"
      - "operational DORMANT -> ACTIVE; household engagement and expected_monthly_pods recompute"

  # --- ConsumptionRecord ---
  - method: POST
    path: "/households/{id}/consumption-records"
    description: "Append a monthly consumption record (immutable; one per household per period)"
    roles: [PlatformAdmin]
    code: 201
    input: [period, pods_brewed]
    output: ConsumptionRecord
    side_effects: ["household.trailing_avg_pods recomputes"]

  - method: GET
    path: "/households/{id}/consumption-records"
    description: "List a household's consumption records (period DESC)"
    roles: [PlatformAdmin, SupportAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "ConsumptionRecord[]"
    side_effects: []

  # --- ServiceEvent ---
  - method: POST
    path: "/brewers/{id}/service-events"
    description: "Open a service event; WARRANTY_CLAIM requires IN_WARRANTY and is auto-DENIED when descale_overdue"
    roles: [SupportAgent]
    code: 201
    input: [kind, "note?"]
    output: ServiceEvent
    side_effects:
      - "kind=WARRANTY_CLAIM and descale_overdue: status=DENIED, resolution=AUTO_DENIED_DESCALE at creation"
      - "kind=REPLACEMENT requires brewer operational != DECOMMISSIONED (ERR_INVALID_STATE)"

  - method: GET
    path: "/brewers/{id}/service-events"
    description: "List service events of a brewer"
    roles: [SupportAgent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ServiceEvent[]"
    side_effects: []

  - method: POST
    path: "/service-events/{id}/resolve"
    description: "Resolve or deny an OPEN service event; outcome in {APPROVED, DENIED, MISUSE_CONFIRMED}"
    roles: [SupportAgent]
    code: 200
    input: [outcome]
    output: ServiceEvent
    side_effects:
      - "increments ServiceEvent.version by 1"
      - "kind-specific side effects per state machine (descale reset / warranty VOID / decommission cascade)"

  # --- RetailAccount / AssortmentPlan ---
  - method: POST
    path: "/retail-accounts"
    description: "Register a retail account"
    roles: [CategoryManager]
    code: 201
    input: [name, region, shelf_slots_total, productivity_floor_cents]
    output: RetailAccount
    side_effects: []

  - method: GET
    path: "/retail-accounts/{id}"
    description: "Read one retail account"
    roles: [CategoryManager]
    code: 200
    input: []
    output: RetailAccount
    side_effects: []

  - method: POST
    path: "/retail-accounts/{id}/assortment-plans"
    description: "Create an assortment plan in DRAFT; supersedes any APPROVED plan for the same account+period"
    roles: [CategoryManager]
    code: 201
    input: [expected_retail_account_version, period, slots]
    output: AssortmentPlan
    side_effects:
      - "requires expected_retail_account_version == account.version (ERR_STALE_VERSION 412)"
      - "increments RetailAccount.version by 1"
      - "existing APPROVED plan for same account+period -> SUPERSEDED; existing LOCKED plan for same period -> reject ERR_INVALID_STATE"

  - method: GET
    path: "/retail-accounts/{id}/assortment-plans"
    description: "List assortment plans of an account"
    roles: [CategoryManager]
    code: 200
    input: ["period?", "status?", "limit?", "offset?"]
    output: "AssortmentPlan[]"
    side_effects: []

  - method: POST
    path: "/assortment-plans/{id}/transition"
    description: "Drive the plan state machine; target_state in {PROPOSED, APPROVED, LOCKED, DRAFT, CANCELLED}"
    roles: [CategoryManager]
    code: 200
    input: [target_state]
    output: AssortmentPlan
    side_effects:
      - "increments AssortmentPlan.version by 1"
      - "APPROVED: productivity_cents computed and pinned (per-slot rounding, then sum)"

  # --- RoyaltyStatement ---
  - method: POST
    path: "/license-agreements/{id}/royalty-statements"
    description: "Create a royalty statement in DRAFT; provisional royalty computed from sell_in_units"
    roles: [FinanceAnalyst]
    code: 201
    input: [period, sell_in_units, sell_through_units, unlicensed_share_pct]
    output: RoyaltyStatement
    side_effects: ["provisional_royalty_cents computed (provisional variant); status=DRAFT"]

  - method: GET
    path: "/license-agreements/{id}/royalty-statements"
    description: "List royalty statements of an agreement"
    roles: [FinanceAnalyst, LicensingManager]
    code: 200
    input: ["period?", "status?", "limit?", "offset?"]
    output: "RoyaltyStatement[]"
    side_effects: []

  - method: POST
    path: "/royalty-statements/{id}/transition"
    description: "Drive the statement state machine; target_state in {ISSUED, DISPUTED, SETTLED}"
    roles: [FinanceAnalyst]
    code: 200
    input: [target_state, "sell_through_units?", "unlicensed_share_pct?", "dispute_reason?"]
    output: RoyaltyStatement
    side_effects:
      - "increments RoyaltyStatement.version by 1"
      - "->ISSUED: final_royalty_cents computed (final variant; corrected inputs applied first on re-issue)"
      - "->DISPUTED: dispute_count += 1"

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_BRAND_OWNERSHIP, http: 403, condition: "BrandManager X-User-ID does not match the variety's brand_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid field, bad enum member, range violation, bad period format, future period, malformed royalty_tiers" }
  - { id: ERR_EMPTY_SLOTS, http: 400, condition: "Assortment plan created or proposed with an empty slots array" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "window_start >= window_end, or effective_start > effective_end" }
  - { id: ERR_WINDOW_IN_PAST, http: 422, condition: "ProductionRun window_start is before the logical clock" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "No declared transition from current state to target, or a cross-entity state gate other than suspension/expiry fails" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version" }
  - { id: ERR_AGREEMENT_EXPIRED, http: 409, condition: "Agreement-scoped write after lazy expiry (clock date > effective_end)" }
  - { id: ERR_LICENSE_SUSPENDED, http: 409, condition: "Statement creation/issue while the agreement is SUSPENDED" }
  - { id: ERR_TERRITORY_WINDOW_CONFLICT, http: 409, condition: "Closed-interval overlap with an ACTIVE/SUSPENDED agreement for the same brand+territory" }
  - { id: ERR_LINE_WINDOW_CONFLICT, http: 409, condition: "Half-open overlap with an existing non-terminal run on the same filling line" }
  - { id: ERR_CHANGEOVER_BUFFER_VIOLATION, http: 409, condition: "Run follows a different-roast or different-material run without changeover_hours of idle gap" }
  - { id: ERR_LINE_INCOMPATIBLE, http: 422, condition: "Line cannot run the variety's roast_level, flavor_family, or material" }
  - { id: ERR_NO_COMPATIBLE_LINE, http: 409, condition: "CONVERT_RECYCLABLE requested but no line with material_capability RECYCLABLE|BOTH exists" }
  - { id: ERR_VARIETY_NOT_ACTIVE, http: 409, condition: "Production run or brew recording references a variety that is not ACTIVE (runs) or is DELISTED (brews)" }
  - { id: ERR_VARIETY_NOT_LISTABLE, http: 409, condition: "Assortment slot references a variety outside {ACTIVE, PHASE_OUT}" }
  - { id: ERR_BRAND_NOT_LICENSED, http: 422, condition: "License agreement references a brand whose kind is not LICENSED" }
  - { id: ERR_EDUCATION_REQUIRED, http: 422, condition: "CONVERT_RECYCLABLE with education_notices_sent < EDUCATION_MIN_NOTICES (1)" }
  - { id: ERR_WARRANTY_NOT_ACTIVE, http: 409, condition: "WARRANTY_CLAIM opened on a brewer whose warranty_status is EXPIRED or VOID" }
  - { id: ERR_POD_BLOCKED, http: 422, condition: "RESTRICTIVE-firmware brewer asked to brew a variety of an UNLICENSED_COMPATIBLE brand" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "Run units exceed line capacity * window_days, or plan facings exceed shelf_slots_total" }
  - { id: ERR_PRODUCTIVITY_FLOOR_UNMET, http: 422, condition: "Plan productivity_cents below account productivity_floor_cents at APPROVED" }
  - { id: ERR_SLOW_MOVER_SLOT, http: 409, condition: "LOCKED requested while a slot holds a slow_mover variety without clearance_flag" }
  - { id: ERR_DUPLICATE_STATEMENT_PERIOD, http: 409, condition: "A statement already exists for this agreement + period" }
  - { id: ERR_DUPLICATE_CONSUMPTION_PERIOD, http: 409, condition: "A consumption record already exists for this household + period" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator: brands, brewer models, households, brewers, consumption telemetry, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /brands"
      - "POST /brewer-models"
      - "POST /households"
      - "POST /households/{id}/brewers"
      - "POST /households/{id}/consumption-records"
      - "POST /brewers/{id}/record-brews"
    shared_operations:
      - "GET /pod-varieties(+/{id})"
      - "GET /households/{id}"
      - "GET /brewers(+/{id})"
      - "GET /households/{id}/consumption-records"
      - "GET /brewers/{id}/service-events"

  - name: LicensingManager
    description: "Owns the licensing program: agreements, amendments, suspension/reinstatement"
    identity: opaque
    exclusive_operations:
      - "POST /license-agreements"
      - "POST /license-agreements/{id}/transition"
      - "POST /license-agreements/{id}/amend"
    shared_operations:
      - "GET /license-agreements(+/{id})"
      - "GET /license-agreements/{id}/quality-audits"
      - "GET /license-agreements/{id}/royalty-statements"

  - name: QualityAuditor
    description: "Records quality audits against licensed brands"
    identity: opaque
    exclusive_operations:
      - "POST /license-agreements/{id}/quality-audits"
    shared_operations:
      - "GET /license-agreements/{id}"
      - "GET /license-agreements/{id}/quality-audits"

  - name: BrandManager
    description: "Acts as a Brand: manages that brand's pod varieties only"
    identity: "entity_backed:Brand"
    exclusive_operations:
      - "POST /pod-varieties"
      - "POST /pod-varieties/{id}/transition"
    shared_operations:
      - "GET /pod-varieties(+/{id})"

  - name: OperationsDirector
    description: "Owns facilities and filling lines"
    identity: opaque
    exclusive_operations:
      - "POST /facilities"
      - "POST /facilities/{id}/filling-lines"
    shared_operations:
      - "GET /facilities/{id}"
      - "GET /facilities/{id}/filling-lines"
      - "GET /production-runs(+/{id})"

  - name: ProductionPlanner
    description: "Schedules and completes production runs"
    identity: opaque
    exclusive_operations:
      - "POST /production-runs"
      - "POST /production-runs/{id}/transition"
    shared_operations:
      - "GET /production-runs(+/{id})"
      - "GET /facilities/{id}"
      - "GET /facilities/{id}/filling-lines"
      - "GET /pod-varieties(+/{id})"

  - name: CategoryManager
    description: "Owns retail accounts and assortment plans"
    identity: opaque
    exclusive_operations:
      - "POST /retail-accounts"
      - "POST /retail-accounts/{id}/assortment-plans"
      - "POST /assortment-plans/{id}/transition"
    shared_operations:
      - "GET /retail-accounts/{id}"
      - "GET /retail-accounts/{id}/assortment-plans"
      - "GET /pod-varieties(+/{id})"

  - name: FinanceAnalyst
    description: "Owns royalty statements: create, issue, dispute, settle"
    identity: opaque
    exclusive_operations:
      - "POST /license-agreements/{id}/royalty-statements"
      - "POST /royalty-statements/{id}/transition"
    shared_operations:
      - "GET /license-agreements(+/{id})"
      - "GET /license-agreements/{id}/royalty-statements"

  - name: SupportAgent
    description: "Consumer support: warranty, descaling, replacement service events"
    identity: opaque
    exclusive_operations:
      - "POST /brewers/{id}/service-events"
      - "POST /service-events/{id}/resolve"
    shared_operations:
      - "GET /households/{id}"
      - "GET /brewers(+/{id})"
      - "GET /brewers/{id}/service-events"
      - "GET /households/{id}/consumption-records"
