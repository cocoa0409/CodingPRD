scaffold_corner_design:

  - section: entities
    instances:

      - name: create_operator_returns_server_minted_identity_and_zero_balance
        claim_type: Creation
        grounds: [entities.Operator, endpoints.POST_/operators]
        distinguishing_aspect: "POST /operators returns 201 with a dashed UUID id, version 1, fee_balance_cents 0 and created_at rendered as 2026-05-01T00:00:00.000Z from the default logical clock."
        test_recipe:
          setup: ["Empty database; the logical clock sits at its 2026-05-01T00:00:00Z startup default."]
          setup_api_calls: []
          trigger:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example", phone: "555-0100" }
              as: Anonymous
              captures: { op_id: $.data.id }
          assert:
            - "HTTP 201 and response_type == object"
            - "Operator.${op_id}.fee_balance_cents == 0 and version == 1"
            - "Operator.${op_id}.created_at == 2026-05-01T00:00:00.000Z"
            - "data.id matches the dashed 8-4-4-4-12 UUID form with no type prefix"
            - "meta carries api_request_id and api_request_timestamp"

      - name: get_operator_returns_stored_row
        claim_type: Retrieval
        grounds: ["endpoints.GET_/operators/{id}", entities.Operator.fields.legal_name]
        distinguishing_aspect: "GET /operators/{id} returns exactly the row POST /operators created, with the same id and legal_name."
        test_recipe:
          setup: ["One operator exists."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
          trigger:
            - call: "GET /operators/${op_id}"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
          assert:
            - "HTTP 200 with data.id == ${op_id}"
            - "data.legal_name == Blue Lagoon Aquatics and data.contact_email == ops@bluelagoon.example"
            - "data.fee_balance_cents == 0"

      - name: facility_computed_classification_fields_for_pool
        claim_type: Computed Fields
        grounds:
          - calculations.facility_classification_derivation
          - entities.Facility.fields.max_bather_load
          - entities.Facility.fields.lifeguard_required
          - entities.Facility.fields.required_signage_types
        distinguishing_aspect: "A CLASS_B_PUBLIC venue of 1200 sqft derives water_type POOL, max_bather_load 60 (1200/20), lifeguard_required true (60 >= 50) and a three-entry signage list without NO_LIFEGUARD_WARNING."
        test_recipe:
          setup: ["One operator exists."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
          trigger:
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
          assert:
            - "Facility.${fac_id}.water_type == POOL"
            - "Facility.${fac_id}.max_bather_load == 60"
            - "Facility.${fac_id}.lifeguard_required == true"
            - "Facility.${fac_id}.required_signage_types == [DEPTH_MARKERS, EMERGENCY_PHONE, DIARRHEA_NOTICE]"
            - "Facility.${fac_id}.vgb_compliance_status == NONCOMPLIANT (no drain certification on file)"

      - name: spa_facility_uses_spa_divisor_and_spa_signage_set
        claim_type: Computed Fields
        grounds:
          - calculations.facility_classification_derivation
          - entities.Facility.fields.water_type
          - entities.Facility.fields.required_signage_types
        distinguishing_aspect: "A SPA venue of 400 sqft derives water_type SPA, max_bather_load 40 (400/10), lifeguard_required false, and therefore a four-entry signage list ending in NO_LIFEGUARD_WARNING."
        test_recipe:
          setup: ["One operator exists."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
          trigger:
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Rooftop Spa", facility_class: "SPA", surface_area_sqft: 400, water_volume_gallons: 900, max_depth_feet: 4, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { spa_id: $.data.id }
          assert:
            - "Facility.${spa_id}.water_type == SPA"
            - "Facility.${spa_id}.max_bather_load == 40"
            - "Facility.${spa_id}.lifeguard_required == false"
            - "Facility.${spa_id}.required_signage_types == [SPA_TEMP_WARNING, EMERGENCY_PHONE, DIARRHEA_NOTICE, NO_LIFEGUARD_WARNING]"

      - name: facility_defaults_applied_when_optional_fields_omitted
        claim_type: Defaults
        grounds:
          - entities.Facility.fields.features
          - entities.Facility.fields.is_seasonal
          - entities.Facility.fields.requires_plan_review
        distinguishing_aspect: "Omitting features, is_seasonal and requires_plan_review yields [], false and false respectively, and both season dates stay null."
        test_recipe:
          setup: ["One operator exists."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
          trigger:
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_C_SEMI_PUBLIC", surface_area_sqft: 600, water_volume_gallons: 25000, max_depth_feet: 6, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
          assert:
            - "Facility.${fac_id}.features == []"
            - "Facility.${fac_id}.is_seasonal == false"
            - "Facility.${fac_id}.requires_plan_review == false"
            - "Facility.${fac_id}.season_start_date == null and season_end_date == null"

      - name: create_facility_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: ["validations[priority=4]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting facility_class, an input field with no default, is rejected with ERR_VALIDATION (400) and no facility row is created."
        test_recipe:
          setup: ["One operator exists."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
          trigger:
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_VALIDATION"
            - "GET /facilities?operator_id=${op_id} returns zero rows"

      - name: create_facility_invalid_enum_value_rejected
        claim_type: Type Constraints
        grounds: ["validations[priority=4]", "errors[ERR_VALIDATION]", entities.Facility.fields.facility_class]
        distinguishing_aspect: "facility_class CLASS_D is outside the declared enum set and is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["One operator exists."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
          trigger:
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_D", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_VALIDATION"

      - name: facility_seasonal_without_season_dates_rejected
        claim_type: Type Constraints
        grounds: ["validations[priority=4]", entities.Facility.fields.season_start_date]
        distinguishing_aspect: "is_seasonal true with no season_start_date/season_end_date is a conditional-field violation answered with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["One operator exists."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
          trigger:
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Seasonal Pool", facility_class: "CLASS_C_SEMI_PUBLIC", surface_area_sqft: 600, water_volume_gallons: 30000, max_depth_feet: 6, drain_count: 2, is_seasonal: true }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_VALIDATION"

      - name: water_reading_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds: [entities.WaterChemistryReading, "endpoints.POST_/facilities/{id}/water-readings"]
        distinguishing_aspect: "WaterChemistryReading is declared common_fields false, so its response carries id and created_at but no version and no updated_at, and no endpoint mutates it."
        test_recipe:
          setup: ["One operator and one pool facility exist."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /facilities/${fac_id}/water-readings"
              payload: { sampled_at: "2026-05-01T00:00:00Z", source: "OPERATOR_LOG", free_chlorine_ppm: 2.0, combined_chloramine_ppm: 0.1, ph: 7.4, water_temp_f: 82.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { rd_id: $.data.id }
          assert:
            - "HTTP 201 with data.id present and data.created_at == 2026-05-01T00:00:00.000Z"
            - "The response body contains no version field and no updated_at field"
            - "WaterChemistryReading.${rd_id}.compliance_status == IN_RANGE and cyanuric_acid_ppm == 0 (default applied)"

      - name: facility_list_pagination_reports_total_count_and_has_more
        claim_type: Listing
        grounds: [endpoints.GET_/facilities, response_envelope.pagination_fields]
        distinguishing_aspect: "With three facilities on file, limit=2 offset=0 returns two rows with meta.total_count 3 and meta.has_more true; offset=2 returns one row with has_more false."
        test_recipe:
          setup: ["One operator owns exactly three facilities."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Tri Pools", contact_email: "ops@tripools.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Pool One", facility_class: "CLASS_C_SEMI_PUBLIC", surface_area_sqft: 600, water_volume_gallons: 20000, max_depth_feet: 6, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { f1_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Pool Two", facility_class: "CLASS_C_SEMI_PUBLIC", surface_area_sqft: 600, water_volume_gallons: 20000, max_depth_feet: 6, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { f2_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Pool Three", facility_class: "CLASS_C_SEMI_PUBLIC", surface_area_sqft: 600, water_volume_gallons: 20000, max_depth_feet: 6, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { f3_id: $.data.id }
          trigger:
            - call: "GET /facilities"
              payload: { operator_id: "${op_id}", limit: 2, offset: 0 }
              as: Operator
              as_user_id: "${op_id}"
            - call: "GET /facilities"
              payload: { operator_id: "${op_id}", limit: 2, offset: 2 }
              as: Operator
              as_user_id: "${op_id}"
          assert:
            - "First call: response_type == array, len(data) == 2, meta.total_count == 3, meta.has_more == true, meta.limit == 2, meta.offset == 0"
            - "First call returns ${f1_id} then ${f2_id} in created_at ascending order"
            - "Second call: len(data) == 1 containing ${f3_id}, meta.has_more == false"

      - name: pagination_limit_above_maximum_returns_validation
        claim_type: Type Constraints
        grounds: ["validations[priority=4]", response_envelope.pagination_defaults, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "limit=101 exceeds the declared maximum of 100 and is rejected with ERR_VALIDATION (400) rather than silently clamped."
        test_recipe:
          setup: ["One operator exists."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
          trigger:
            - call: "GET /facilities"
              payload: { limit: 101 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_VALIDATION"

      - name: unknown_path_ids_return_entity_specific_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors[ERR_PERMIT_NOT_FOUND]
          - errors[ERR_CLOSURE_ORDER_NOT_FOUND]
          - errors[ERR_COMPLAINT_NOT_FOUND]
          - errors[ERR_LEDGER_ENTRY_NOT_FOUND]
          - errors[ERR_OPERATOR_NOT_FOUND]
        distinguishing_aspect: "Each unresolved path id yields the 404 error code named after that entity, never a generic one."
        test_recipe:
          setup: ["One operator exists so the caller is authenticated; the queried ids belong to nothing."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
          trigger:
            - call: "GET /permits/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
              captures: { e_permit: $.data.error_id }
            - call: "GET /closure-orders/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
              captures: { e_closure: $.data.error_id }
            - call: "GET /complaints/33333333-3333-4333-8333-333333333333"
              payload: {}
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
              captures: { e_complaint: $.data.error_id }
            - call: "GET /fee-ledger-entries/44444444-4444-4444-8444-444444444444"
              payload: {}
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
              captures: { e_ledger: $.data.error_id }
            - call: "GET /operators/55555555-5555-4555-8555-555555555555"
              payload: {}
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
              captures: { e_operator: $.data.error_id }
          assert:
            - "All five responses are HTTP 404"
            - "error_ids are ERR_PERMIT_NOT_FOUND, ERR_CLOSURE_ORDER_NOT_FOUND, ERR_COMPLAINT_NOT_FOUND, ERR_LEDGER_ENTRY_NOT_FOUND and ERR_OPERATOR_NOT_FOUND respectively"

      - name: unknown_body_foreign_keys_return_entity_specific_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=6]
          - errors[ERR_FACILITY_NOT_FOUND]
          - errors[ERR_PLAN_REVIEW_NOT_FOUND]
          - errors[ERR_INSPECTION_NOT_FOUND]
        distinguishing_aspect: "Foreign keys carried in the request body are resolved with the same 404 discipline as path ids: an unknown facility_id, plan_review_id or prior_inspection_id each produce their own not-found code."
        test_recipe:
          setup: ["One operator and one pool facility exist."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { facility_id: "66666666-6666-4666-8666-666666666666", permit_type: "ANNUAL", term_start_date: "2026-05-01" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { e_fac: $.data.error_id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "ANNUAL", term_start_date: "2026-05-01", plan_review_id: "77777777-7777-4777-8777-777777777777" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { e_pr: $.data.error_id }
            - call: "POST /inspections"
              payload: { facility_id: "${fac_id}", inspection_type: "REINSPECTION", scheduled_start_at: "2026-05-02T09:00:00Z", scheduled_end_at: "2026-05-02T10:00:00Z", prior_inspection_id: "88888888-8888-4888-8888-888888888888" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { e_insp: $.data.error_id }
          assert:
            - "The three responses are ERR_FACILITY_NOT_FOUND, ERR_PLAN_REVIEW_NOT_FOUND and ERR_INSPECTION_NOT_FOUND, all HTTP 404"
            - "GET /permits?facility_id=${fac_id} returns zero rows"

  - section: state_machines
    instances:

      - name: permit_starts_in_draft_and_issue_from_draft_rejected
        claim_type: Initial State
        grounds: [state_machines.Permit.null_to_DRAFT, "validations[priority=13]", "errors[ERR_INVALID_PERMIT_STATE]"]
        distinguishing_aspect: "A new permit is created in DRAFT with assessed_fee_cents 0, and ISSUE is not a declared edge from DRAFT, so it is rejected with ERR_INVALID_PERMIT_STATE (409)."
        test_recipe:
          setup: ["One operator owns one pool facility; no permit exists yet."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "ANNUAL", term_start_date: "2026-05-01" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "ISSUE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "Permit.${permit_id}.status == DRAFT immediately after creation, with assessed_fee_cents == 0 and fee_variant == null"
            - "Permit.${permit_id}.term_end_date == 2027-04-30 and term_days == 365"
            - "The ISSUE attempt returns 409 with data.error_id == ERR_INVALID_PERMIT_STATE"
            - "Permit.${permit_id}.status is still DRAFT and Operator.${op_id}.fee_balance_cents == 0"

      - name: permit_revoked_is_terminal_and_further_transitions_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Permit.ISSUED_to_REVOKED, "errors[ERR_INVALID_PERMIT_STATE]"]
        distinguishing_aspect: "REVOKED is a declared terminal state, so a subsequent SUSPEND is rejected with ERR_INVALID_PERMIT_STATE and the facility posture stays CLOSED / PERMIT_NOT_ACTIVE."
        test_recipe:
          setup: ["An annual permit has been issued and then revoked without a refund."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "ANNUAL", term_start_date: "2026-05-01" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "SUBMIT" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "START_REVIEW" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "ISSUE" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "REVOKE", reason: "Repeated non-compliance" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "SUSPEND" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_INVALID_PERMIT_STATE"
            - "Permit.${permit_id}.status == REVOKED and refunded == false"
            - "Operator.${op_id}.fee_balance_cents == 40000 (no refund was requested)"
            - "Facility.${fac_id}.operating_posture == CLOSED and posture_reason == PERMIT_NOT_ACTIVE"

      - name: permit_submit_twice_rejected_on_second_attempt
        claim_type: Idempotency
        grounds: [state_machines.Permit.DRAFT_to_SUBMITTED, "errors[ERR_INVALID_PERMIT_STATE]"]
        distinguishing_aspect: "The same SUBMIT sent twice succeeds once; the second call observes status SUBMITTED and is rejected with ERR_INVALID_PERMIT_STATE rather than silently succeeding."
        test_recipe:
          setup: ["A DRAFT annual permit exists."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
