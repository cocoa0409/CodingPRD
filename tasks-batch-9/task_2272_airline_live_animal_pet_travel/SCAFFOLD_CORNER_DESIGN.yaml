  - section: errors
    instances:
      - name: request_without_x_user_headers_rejected
        claim_type: auth_error
        grounds:
          - validations.priority_1
          - errors.ERR_MISSING_AUTH_HEADER
        distinguishing_aspect: "The header gate at priority 1 runs before every other check, so a syntactically perfect create with no X-User-ID / X-User-Role pair returns 401 ERR_MISSING_AUTH_HEADER rather than 400 for the body or 403 for the role."
        test_recipe:
          setup:
            - "An empty database"
          setup_api_calls: []
          trigger:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "" }
          assert:
            - "response status is 401 with error_id ERR_MISSING_AUTH_HEADER"
            - "the body follows the error envelope: response_type error and data.error_id present"
            - "GET /species-profiles with valid headers returns total_count 0, so nothing was written"
            - "an empty-string X-User-ID with a valid role is rejected the same way, since the check requires non-empty values"

      - name: request_with_unknown_role_header_rejected
        claim_type: auth_error
        grounds:
          - validations.priority_2
          - errors.ERR_INVALID_ROLE
        distinguishing_aspect: "An unrecognised role value fails the enum check at priority 2 with 401 ERR_INVALID_ROLE, which is distinct from a recognised role that simply lacks permission - that case is the 403 at priority 3."
        test_recipe:
          setup:
            - "An empty database"
          setup_api_calls: []
          trigger:
            - { call: "POST /stations", payload: { iata_code: "HKG", country_code: "HK", kennel_bay_count: 4 }, as: KennelSupervisor, as_user_id: "who-01" }
          assert:
            - "response status is 401 with error_id ERR_INVALID_ROLE"
            - "GET /stations with a valid role returns total_count 0"
            - "the same call as ReservationsAgent - a declared but unauthorised role - returns 403 ERR_UNAUTHORIZED instead"

      - name: list_with_limit_above_maximum_rejected
        claim_type: pagination_error
        grounds:
          - validations.priority_5
          - errors.ERR_INVALID_PAGINATION
        distinguishing_aspect: "limit is validated against the declared 1..100 window rather than being clamped: 101 is refused with 400 ERR_INVALID_PAGINATION while exactly 100 is accepted."
        test_recipe:
          setup:
            - "Three stations exist"
          setup_api_calls:
            - { call: "POST /stations", payload: { iata_code: "HKG", country_code: "HK", kennel_bay_count: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_hkg: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "LAX", country_code: "US", kennel_bay_count: 6 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_lax: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "JFK", country_code: "US", kennel_bay_count: 6 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_jfk: $.data.id } }
          trigger:
            - { call: "GET /stations", payload: { limit: 101, offset: 0 }, as: ProgramAdmin, as_user_id: "admin-01" }
          assert:
            - "response status is 400 with error_id ERR_INVALID_PAGINATION"
            - "the same call with limit 100 returns 200 with total_count 3"
            - "limit 0 and offset -1 are refused with the same error"

      - name: create_with_an_unknown_body_field_rejected
        claim_type: validation_error
        grounds:
          - validations.priority_4
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Unknown fields are rejected rather than ignored: a station create carrying an extra sanitation_crew_size key returns 400 ERR_INVALID_REQUEST and stores nothing, so the strictness is observable in the table as well as the status code."
        test_recipe:
          setup:
            - "An empty database"
          setup_api_calls: []
          trigger:
            - { call: "POST /stations", payload: { iata_code: "HKG", country_code: "HK", kennel_bay_count: 4, sanitation_crew_size: 3 }, as: ProgramAdmin, as_user_id: "admin-01" }
          assert:
            - "response status is 400 with error_id ERR_INVALID_REQUEST"
            - "GET /stations returns total_count 0"
            - "the same body without sanitation_crew_size returns 201"
            - "a payload with kennel_bay_count as the string \"4\" is refused with the same error, since the declared type is checked too"

      - name: segment_create_with_two_unknown_foreign_keys_returns_animal_not_found
        claim_type: not_found_error
        grounds:
          - validations.priority_7
          - errors.ERR_ANIMAL_NOT_FOUND
        distinguishing_aspect: "Body foreign keys are resolved in the declared input order, so when BOTH animal_record_id and flight_leg_id are unknown the response is ERR_ANIMAL_NOT_FOUND - the first field in the endpoint's input list - and never ERR_FLIGHT_LEG_NOT_FOUND."
        test_recipe:
          setup:
            - "An empty database with no animal records and no flight legs"
          setup_api_calls: []
          trigger:
            - { call: "POST /segment-assignments", payload: { animal_record_id: "an-does-not-exist", flight_leg_id: "leg-does-not-exist", routing_type: "CHECKED", sequence_index: 1, expected_flight_leg_version: "${missing_version}" }, as: ReservationsAgent, as_user_id: "agent-01" }
          assert:
            - "response status is 404 with error_id ERR_ANIMAL_NOT_FOUND"
            - "the error is not ERR_FLIGHT_LEG_NOT_FOUND and not ERR_STALE_FLIGHT_LEG_VERSION, since existence at priority 7 precedes the version check at priority 9"
            - "GET /segment-assignments returns total_count 0"

      - name: document_revision_cap_error
        claim_type: state_error
        grounds:
          - errors.ERR_DOC_REVISION_LIMIT_REACHED
        excluded_because:
          difficulty_instance: non_linear_state_machine / health_document_fourth_resubmission_rejected_at_revision_cap
          rationale: "The named §1.8 instance walks the reject/resubmit loop to revision_count 3 and asserts the 409 on the fourth attempt."

      - name: disclosure_pending_error
        claim_type: state_error
        grounds:
          - errors.ERR_DISCLOSURE_PENDING
        excluded_because:
          difficulty_instance: non_linear_state_machine / disclosable_incident_cannot_close_before_disclosure_while_minor_incident_closes_directly
          rationale: "The named §1.8 instance contrasts a disclosable incident blocked at close with a minor one that closes directly."

  - section: rbac
    instances:
      - name: program_admin_cannot_screen_animal_forbidden
        claim_type: role_denied
        grounds:
          - validations.priority_3
          - roles.ProgramAdmin
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Screening is exclusive to AcceptanceAgent, so the ProgramAdmin who configured the whole reference dataset is still refused with 403 ERR_UNAUTHORIZED and the animal stays DRAFT."
        test_recipe:
          setup:
            - "A CHECKED reservation with one DRAFT animal record"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilation_area_pct: 15, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_k9l: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Wu", contact_email: "wu@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Mochi", breed_name: "Labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 52 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
          trigger:
            - { call: "POST /animal-records/${an1}/screen", payload: {}, as: ProgramAdmin, as_user_id: "admin-01" }
          assert:
            - "response status is 403 with error_id ERR_UNAUTHORIZED"
            - "AnimalRecord.${an1}.status == DRAFT and container_compliance_state == UNEVALUATED"
            - "the identical call as AcceptanceAgent accept-01 returns 200"

      - name: reservations_agent_cannot_verify_health_document_forbidden
        claim_type: role_denied
        grounds:
          - validations.priority_3
          - roles.VeterinaryReviewer
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The agent who filed the document is not allowed to bless it: verification is exclusive to VeterinaryReviewer, so the 403 lands even though the same ReservationsAgent legitimately created and may resubmit that very row."
        test_recipe:
          setup:
            - "A CHECKED reservation whose screened animal has a SUBMITTED HEALTH_CERTIFICATE filed by agent-01"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilation_area_pct: 15, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_k9l: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Wu", contact_email: "wu@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Mochi", breed_name: "Labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 52 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
            - { call: "POST /animal-records/${an1}/screen", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
            - { call: "POST /health-documents", payload: { animal_record_id: "${an1}", document_type: "HEALTH_CERTIFICATE", issuing_country_code: "HK", issued_at: "2026-08-20T00:00:00Z", expires_at: "2026-11-20T00:00:00Z" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { doc1: $.data.id } }
          trigger:
            - { call: "POST /health-documents/${doc1}/verify", payload: {}, as: ReservationsAgent, as_user_id: "agent-01" }
          assert:
            - "response status is 403 with error_id ERR_UNAUTHORIZED"
            - "HealthDocument.${doc1}.status == SUBMITTED and reviewed_by_user_id is null"
            - "the error is not ERR_DOCUMENT_INVALID_STATE: the role check at priority 3 precedes the state check at priority 15"

      - name: booking_agent_cannot_accept_its_own_reservation_forbidden
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_8
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "Segregation of duties is keyed on the opaque X-User-ID, not on the role: a person carrying the AcceptanceAgent role passes the role check yet is refused with 403 ERR_SEGREGATION_OF_DUTIES because that same user id is stored as the reservation's booked_by_agent_id."
        test_recipe:
          setup:
            - "A CHECKED reservation booked by user dual-01 acting as ReservationsAgent, so booked_by_agent_id is dual-01"
            - "Its screened animal holds a RESERVED sequence-1 segment on AN101"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilation_area_pct: 15, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_k9l: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "HKG", country_code: "HK", kennel_bay_count: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_hkg: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "LAX", country_code: "US", kennel_bay_count: 6 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_lax: $.data.id } }
            - { call: "POST /flight-legs", payload: { flight_number: "AN101", origin_station_id: "${st_hkg}", destination_station_id: "${st_lax}", scheduled_departure_utc: "2026-09-10T02:00:00Z", scheduled_arrival_utc: "2026-09-10T15:00:00Z", forecast_high_c: 25, forecast_low_c: 15, cabin_animal_limit: 2, checked_animal_limit: 2, cargo_animal_limit: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { leg1: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Wu", contact_email: "wu@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "dual-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Mochi", breed_name: "Labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 52 }, as: ReservationsAgent, as_user_id: "dual-01", captures: { an1: $.data.id } }
            - { call: "POST /animal-records/${an1}/screen", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
            - { call: "GET /flight-legs/${leg1}", payload: {}, as: ReservationsAgent, as_user_id: "dual-01", captures: { leg1_v1: $.data.version } }
            - { call: "POST /segment-assignments", payload: { animal_record_id: "${an1}", flight_leg_id: "${leg1}", routing_type: "CHECKED", sequence_index: 1, expected_flight_leg_version: "${leg1_v1}" }, as: ReservationsAgent, as_user_id: "dual-01", captures: { seg1: $.data.id } }
          trigger:
            - { call: "POST /segment-assignments/${seg1}/accept", payload: {}, as: AcceptanceAgent, as_user_id: "dual-01" }
          assert:
            - "response status is 403 with error_id ERR_SEGREGATION_OF_DUTIES"
            - "the error is not ERR_RESERVATION_INVALID_STATE or ERR_ANIMAL_INVALID_STATE: priority 8 precedes both state gates"
            - "SegmentAssignment.${seg1}.status == RESERVED and fee_variant == PROVISIONAL"
            - "Reservation.${res1}.booked_by_agent_id == dual-01"

      - name: incident_reporter_cannot_investigate_own_report_forbidden
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_8
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "The second segregation pair compares the actor against AnimalIncident.reported_by_user_id: a ComplianceOfficer may report an incident, but that same user id may not then investigate it, so the 403 comes from provenance rather than from role scope."
        test_recipe:
          setup:
            - "A CHECKED reservation with one screened animal"
            - "An INJURY incident reported by comp-01 acting as ComplianceOfficer, so reported_by_user_id is comp-01"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilation_area_pct: 15, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_k9l: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Wu", contact_email: "wu@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Mochi", breed_name: "Labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 52 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
            - { call: "POST /animal-records/${an1}/screen", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
            - { call: "POST /animal-incidents", payload: { animal_record_id: "${an1}", incident_type: "INJURY", discovered_at_utc: "2026-08-01T06:00:00Z" }, as: ComplianceOfficer, as_user_id: "comp-01", captures: { inc1: $.data.id } }
          trigger:
            - { call: "POST /animal-incidents/${inc1}/investigate", payload: {}, as: ComplianceOfficer, as_user_id: "comp-01" }
          assert:
            - "response status is 403 with error_id ERR_SEGREGATION_OF_DUTIES"
            - "AnimalIncident.${inc1}.status == REPORTED and investigated_by_user_id is null"
            - "the same call as comp-02 returns 200 and sets investigated_by_user_id to comp-02"

      - name: investigator_cannot_close_the_incident_it_investigated_forbidden
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_8
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "The third segregation pair compares the actor against investigated_by_user_id, so the chain needs three distinct people: reporter accept-01, investigator comp-01 and a closer who must differ from comp-01, and the adjudicated score is never written on the refused close."
        test_recipe:
          setup:
            - "A CHECKED reservation with one screened animal"
            - "An INJURY incident reported by accept-01 and investigated by comp-01"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilation_area_pct: 15, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_k9l: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Wu", contact_email: "wu@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Mochi", breed_name: "Labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 52 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
            - { call: "POST /animal-records/${an1}/screen", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
            - { call: "POST /animal-incidents", payload: { animal_record_id: "${an1}", incident_type: "INJURY", discovered_at_utc: "2026-08-01T06:00:00Z" }, as: AcceptanceAgent, as_user_id: "accept-01", captures: { inc1: $.data.id } }
            - { call: "POST /animal-incidents/${inc1}/investigate", payload: {}, as: ComplianceOfficer, as_user_id: "comp-01" }
          trigger:
            - { call: "POST /animal-incidents/${inc1}/close", payload: { veterinary_finding: "INDETERMINATE" }, as: ComplianceOfficer, as_user_id: "comp-01" }
          assert:
            - "response status is 403 with error_id ERR_SEGREGATION_OF_DUTIES"
            - "AnimalIncident.${inc1}.status == INVESTIGATING, adjudicated_severity_score is null and closed_by_user_id is null"
            - "the same close as comp-02 returns 200 with adjudicated_severity_score 36, the 0.9 INDETERMINATE factor on the preliminary 40"

      - name: animal_update_is_shared_between_reservations_and_acceptance_agents
        claim_type: shared_operation
        grounds:
          - roles.ReservationsAgent.shared_operations
          - roles.AcceptanceAgent.shared_operations
          - endpoints.PUT /animal-records/{id}
        distinguishing_aspect: "PUT /animal-records/{id} is the one write both booking and acceptance staff hold, so two different roles amend the same row in sequence and both succeed, each bumping the version - unlike the screen and confirm verbs which are exclusive to one role apiece."
        test_recipe:
          setup:
            - "A CHECKED reservation with one DRAFT animal record at version 1"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilation_area_pct: 15, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_k9l: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Wu", contact_email: "wu@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Mochi", breed_name: "Labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 52 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
            - { call: "PUT /animal-records/${an1}", payload: { behavior_attestation_on_file: true }, as: ReservationsAgent, as_user_id: "agent-01" }
          trigger:
            - { call: "PUT /animal-records/${an1}", payload: { measured_weight_kg: 21.4 }, as: AcceptanceAgent, as_user_id: "accept-01" }
          assert:
            - "response status is 200 on both amendments"
            - "AnimalRecord.${an1}.behavior_attestation_on_file == true and measured_weight_kg == 21.4"
            - "AnimalRecord.${an1}.version == 3 and status == DRAFT"
            - "the same PUT as VeterinaryReviewer returns 403 ERR_UNAUTHORIZED, so the sharing is limited to the two declared roles"

      - name: every_role_can_read_a_flight_leg
        claim_type: shared_read
        grounds:
          - endpoints.GET /flight-legs/{id}
          - roles.ComplianceOfficer.shared_operations
        distinguishing_aspect: "All five roles list GET endpoints as shared, so the same flight leg detail read succeeds for each of them and returns identical derived values - reads are never partitioned by role in this domain."
        test_recipe:
          setup:
            - "AN101 HKG->LAX scheduled 2026-09-10T02:00Z -> 15:00Z with no bookings"
          setup_api_calls:
            - { call: "POST /stations", payload: { iata_code: "HKG", country_code: "HK", kennel_bay_count: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_hkg: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "LAX", country_code: "US", kennel_bay_count: 6 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_lax: $.data.id } }
            - { call: "POST /flight-legs", payload: { flight_number: "AN101", origin_station_id: "${st_hkg}", destination_station_id: "${st_lax}", scheduled_departure_utc: "2026-09-10T02:00:00Z", scheduled_arrival_utc: "2026-09-10T15:00:00Z", forecast_high_c: 25, forecast_low_c: 15, cabin_animal_limit: 2, checked_animal_limit: 2, cargo_animal_limit: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { leg1: $.data.id } }
            - { call: "GET /flight-legs/${leg1}", payload: {}, as: ProgramAdmin, as_user_id: "admin-01" }
            - { call: "GET /flight-legs/${leg1}", payload: {}, as: ReservationsAgent, as_user_id: "agent-01" }
            - { call: "GET /flight-legs/${leg1}", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
            - { call: "GET /flight-legs/${leg1}", payload: {}, as: VeterinaryReviewer, as_user_id: "vet-01" }
          trigger:
            - { call: "GET /flight-legs/${leg1}", payload: {}, as: ComplianceOfficer, as_user_id: "comp-01" }
          assert:
            - "all five reads return 200"
            - "every response reports block_minutes 780, posture OPEN, status SCHEDULED and version 1"
            - "GET /reservations/{id}/charge-summary is the one read that is NOT shared with VeterinaryReviewer, per its declared roles list"

  - section: cross_cutting_complexity_layers
    instances:
      - name: segment_create_with_stale_flight_leg_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.assignment-create-stale-leg
          - validations.priority_9
          - errors.ERR_STALE_FLIGHT_LEG_VERSION
        distinguishing_aspect: "The booking token is the PARENT leg's version: an agent who read the leg before the forecast was revised holds version 1 while the row is at 2, so the booking is refused with 412 ERR_STALE_FLIGHT_LEG_VERSION and must re-read before retrying."
        test_recipe:
          setup:
            - "AN101 HKG->LAX created at version 1, and that version is captured by the booking agent"
