scenario: |
  Public health epidemic monitoring: case reporting with case-type classification
  (suspected/confirmed/asymptomatic), case-information form (demographics/symptoms/
  onset-date/exposure-history), reporting-institution authentication, reporting-time-
  limit monitoring, and case-deduplication across reports; close-contact tracing with
  relationship-graph modeling (person nodes and contact edges), contact-event ingestion
  (transit/venue/co-worker/household), tier-classification (close-contact/sub-close-
  contact), tracing-task dispatch to local CDC, tracing-completion confirmation, and
  graph-visualization for epidemiological analysis; isolation management with isolation-
  mode (centralized-facility/home/medical-observation), isolation-start-and-end dates,
  daily health-status reporting, isolation-violation alerts (geofence/access-control),
  facility-capacity allocation, and release-criteria check before lifting isolation;
  test-result entry with test-ordering record, sample-collection chain-of-custody,
  laboratory-result ingestion (PCR/antigen/antibody), result-validity rules, abnormal-
  result follow-up, and individual-and-batch result lookup; risk-level assessment with
  regional risk-tier rules (high/medium/low) based on case density and transmission
  chains, sub-district granularity, risk-tier adjustment workflow with expert review,
  automatic-and-manual hybrid, and public-publication coordination; supply allocation
  with reserve-inventory of PPE/test-kits/medication/vaccines, demand-collection from
  districts and hospitals, allocation-priority rules, dispatch-and-delivery tracking,
  and consumption-reporting back to the platform; information disclosure with daily-
  bulletin generation, case-trajectory anonymized disclosure, official-channel
  publication (website/app/press), rumor-correction workflow, and historical-bulletin
  archiving; event-driven synchronization with hospital HIS, laboratory LIS, transit/
  venue-code platforms, and inter-agency data-sharing systems; audit logging for case-
  status changes and risk-tier decisions.

domain_name: epidemic-monitoring
api_prefix: /epi

complexity_profile:
  primary_archetype: graph_constraint
  secondary_archetype: quota_allocation
  complexity_layers:
    - contagion_risk_propagation
    - derived_field_reconciliation
    - cascading_side_effects
    - scheduled_deferred_actions
  entity_topology: graph
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ReportingInstitution
    parent: null
    common_fields: true
    fields:
      - name: institution_code
        type: string
        source: input
        description: Unique short code identifying the hospital, lab, or CDC office.
        constraints: "Unique; 4-12 alphanumeric chars."
      - name: institution_type
        type: enum
        source: input
        description: Type of reporting institution.
        constraints: "One of {HOSPITAL, LAB, CDC, VENUE, TRANSIT}."
      - name: district_code
        type: string
        source: input
        description: Sub-district code where the institution is located.
      - name: status
        type: enum
        source: computed
        description: Operational status of this institution in the platform.
        default: ACTIVE
        constraints: "One of {ACTIVE, SUSPENDED, ARCHIVED}."

  - name: Region
    parent: null
    common_fields: true
    fields:
      - name: district_code
        type: string
        source: input
        description: Sub-district granularity code (unique).
        constraints: "Unique."
      - name: population
        type: integer
        source: input
        description: Resident population used for case density calculation.
        constraints: "> 0."
      - name: current_risk_tier
        type: enum
        source: computed
        description: Currently published risk tier for this sub-district.
        default: LOW
        constraints: "One of {LOW, MEDIUM, HIGH}."
      - name: provisional_risk_tier
        type: enum
        source: computed
        description: Automatically computed tier prior to expert review.
        default: LOW
        constraints: "One of {LOW, MEDIUM, HIGH}."
      - name: last_tier_decision_id
        type: string
        source: computed
        description: FK to the most recent RiskTierDecision row that set current_risk_tier.

  - name: Person
    parent: null
    common_fields: true
    fields:
      - name: person_hash
        type: string
        source: input
        description: Deduplication hash over (national_id_last4 + dob + name_initials). Unique.
        constraints: "Unique; lowercase hex; 16 chars."
      - name: demographics
        type: object
        source: input
        description: Structured object {age_band, gender, occupation_category}.
      - name: district_code
        type: string
        source: input
        description: Sub-district of residence.
      - name: isolation_status
        type: enum
        source: computed
        description: Current isolation status for this person.
        default: NONE
        constraints: "One of {NONE, ACTIVE, RELEASED, VIOLATED_TERMINATED}."
      - name: latest_case_id
        type: string
        source: computed
        description: FK to most recent Case for this Person (nullable).

  - name: Case
    parent: null
    common_fields: true
    fields:
      - name: person_id
        type: string
        source: input
        description: FK to Person; deduplication key with reporting_institution_id.
      - name: reporting_institution_id
        type: string
        source: input
        description: FK to ReportingInstitution that filed this case.
      - name: case_type
        type: enum
        source: input
        description: Classification at report time.
        constraints: "One of {SUSPECTED, CONFIRMED, ASYMPTOMATIC}."
      - name: onset_date
        type: datetime
        source: input
        description: Symptom onset date (UTC date at 00:00:00.000Z).
      - name: reported_at
        type: datetime
        source: system
        description: Wall-clock timestamp the case was filed.
      - name: report_deadline_at
        type: datetime
        source: computed
        description: onset_date + REPORT_LIMIT_HOURS; used to compute is_late_report.
      - name: is_late_report
        type: boolean
        source: computed
        description: True iff reported_at > report_deadline_at.
        default: false
      - name: symptoms
        type: array
        source: input
        description: List of symptom enum codes.
      - name: exposure_history
        type: array
        source: input
        description: Free-text history snippets used by tracers (optional).
      - name: status
        type: enum
        source: computed
        description: Case lifecycle status.
        default: REPORTED
        constraints: "One of {REPORTED, UNDER_TRACING, CONFIRMED, RECOVERED, DEDUPLICATED}."
      - name: superseded_by_case_id
        type: string
        source: computed
        description: If status=DEDUPLICATED, FK to the surviving Case row.

  - name: ContactEvent
    parent: null
    common_fields: false
    fields:
      - name: source_person_id
        type: string
        source: input
        description: FK to Person — the index/origin person of the contact edge.
      - name: target_person_id
        type: string
        source: input
        description: FK to Person — the contacted person.
      - name: event_type
        type: enum
        source: input
        description: Channel of contact.
        constraints: "One of {TRANSIT, VENUE, COWORKER, HOUSEHOLD}."
      - name: event_time
        type: datetime
        source: input
        description: When the contact happened.
      - name: duration_minutes
        type: integer
        source: input
        description: Reported duration of the contact event.
        constraints: ">= 0."
      - name: distance_meters
        type: number
        source: input
        description: Reported proximity at time of contact.
        constraints: ">= 0."
      - name: tier
        type: enum
        source: computed
        description: Classification of the contacted person relative to the source.
        constraints: "One of {CLOSE, SUB_CLOSE}."
      - name: ingested_from
        type: enum
        source: input
        description: External system that fed this event.
        constraints: "One of {HIS, LIS, TRANSIT_CODE, VENUE_CODE, MANUAL}."

  - name: TracingTask
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK to the index Case being traced.
      - name: assigned_cdc_id
        type: string
        source: computed
        description: FK to the ReportingInstitution (institution_type=CDC) handling this tracing.
      - name: status
        type: enum
        source: computed
        description: Tracing lifecycle.
        default: DISPATCHED
        constraints: "One of {DISPATCHED, IN_PROGRESS, NEEDS_REVISION, COMPLETED, CLOSED}."
      - name: due_at
        type: datetime
        source: computed
        description: SLA deadline = dispatched_at + TRACING_SLA_HOURS.
      - name: dispatched_at
        type: datetime
        source: system
        description: When the task was assigned.
      - name: completed_at
        type: datetime
        source: system
        description: When the tracing was confirmed complete.
      - name: discovered_contact_count
        type: integer
        source: computed
        description: ContactEvent edges attributed to this tracing.
        default: 0

  - name: Isolation
    parent: null
    common_fields: true
    fields:
      - name: person_id
        type: string
        source: input
        description: FK to Person being isolated.
      - name: mode
        type: enum
        source: input
        description: Isolation modality.
        constraints: "One of {CENTRALIZED, HOME, MEDICAL_OBSERVATION}."
      - name: facility_id
        type: string
        source: input
        description: FK to IsolationFacility when mode=CENTRALIZED; null otherwise.
      - name: start_date
        type: datetime
        source: input
        description: Calendar start (UTC date at 00:00:00.000Z).
      - name: planned_end_date
        type: datetime
        source: computed
        description: start_date + ISOLATION_MIN_DAYS by mode.
      - name: actual_end_date
        type: datetime
        source: system
        description: Set when isolation is RELEASED or VIOLATED_TERMINATED.
      - name: status
        type: enum
        source: computed
        description: Isolation lifecycle.
        default: ACTIVE
        constraints: "One of {ACTIVE, EXTENDED, RELEASED, VIOLATED_TERMINATED}."
      - name: extension_count
        type: integer
        source: computed
        description: Times this isolation was extended due to ineligible release check.
        default: 0
      - name: daily_reports_received
        type: integer
        source: computed
        description: Count of DailyHealthReport rows attached.
        default: 0
      - name: violations_count
        type: integer
        source: computed
        description: Count of recorded violation events.
        default: 0

  - name: IsolationFacility
    parent: null
    common_fields: true
    fields:
      - name: facility_code
        type: string
        source: input
        description: Unique short code.
        constraints: "Unique."
      - name: district_code
        type: string
        source: input
        description: Sub-district of the facility.
      - name: capacity
        type: integer
        source: input
        description: Total beds.
        constraints: "> 0."
      - name: occupied
        type: integer
        source: computed
        description: Currently active Isolations with mode=CENTRALIZED and facility_id=this.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Operational status.
        default: OPEN
        constraints: "One of {OPEN, FULL, CLOSED}."

  - name: DailyHealthReport
    parent: null
    common_fields: false
    fields:
      - name: isolation_id
        type: string
        source: input
        description: FK to Isolation.
      - name: report_date
        type: datetime
        source: input
        description: Calendar date of the report (UTC date at 00:00:00.000Z).
      - name: temperature_c
        type: number
        source: input
        description: Body temperature in Celsius.
      - name: symptoms
        type: array
        source: input
        description: Symptom enum codes reported that day.
      - name: is_abnormal
        type: boolean
        source: computed
        description: True iff temperature_c >= FEVER_THRESHOLD or symptoms list non-empty.

  - name: TestOrder
    parent: null
    common_fields: true
    fields:
      - name: person_id
        type: string
        source: input
        description: FK to Person being tested.
      - name: ordering_institution_id
        type: string
        source: input
        description: FK to ReportingInstitution that ordered the test.
      - name: test_type
        type: enum
        source: input
        description: Modality.
        constraints: "One of {PCR, ANTIGEN, ANTIBODY}."
      - name: collected_at
        type: datetime
        source: system
        description: Sample-collection timestamp (set by COLLECT).
      - name: result
        type: enum
        source: computed
        description: Lab outcome.
        default: PENDING
        constraints: "One of {PENDING, POSITIVE, NEGATIVE, INVALID}."
      - name: result_recorded_at
        type: datetime
        source: system
        description: When the lab result was ingested.
      - name: status
        type: enum
        source: computed
        description: Order lifecycle.
        default: ORDERED
        constraints: "One of {ORDERED, COLLECTED, RESULTED, FOLLOW_UP, CLOSED, VOID}."
      - name: chain_of_custody
        type: array
        source: computed
        description: Append-only list of {actor_role, actor_id, action, at} entries.

  - name: RiskTierDecision
    parent: null
    common_fields: false
    fields:
      - name: region_id
        type: string
        source: input
        description: FK to Region.
      - name: previous_tier
        type: enum
        source: system
        description: Tier prior to this decision.
      - name: provisional_tier
        type: enum
        source: computed
        description: Auto-tier produced by case_density_risk_score formula.
      - name: final_tier
        type: enum
        source: input
        description: Tier confirmed by expert review.
      - name: mode
        type: enum
        source: input
        description: Decision pathway.
        constraints: "One of {AUTO, EXPERT_OVERRIDE}."
      - name: expert_reviewer_id
        type: string
        source: input
        description: Opaque user id for the RiskExpert who reviewed (null if AUTO).
      - name: published_at
        type: datetime
        source: system
        description: Time the tier was published to public channels (null until publish).
      - name: status
        type: enum
        source: computed
        description: Decision lifecycle.
        default: PROVISIONAL
        constraints: "One of {PROVISIONAL, UNDER_REVIEW, APPROVED, PUBLISHED, REJECTED}."

  - name: SupplyItem
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: Unique SKU.
        constraints: "Unique."
      - name: category
        type: enum
        source: input
        description: Supply class.
        constraints: "One of {PPE, TEST_KIT, MEDICATION, VACCINE}."
      - name: reserve_quantity
        type: integer
        source: computed
        description: On-hand reserve units.
        default: 0
      - name: allocated_quantity
        type: integer
        source: computed
        description: Reserved but not yet dispatched.
        default: 0

  - name: SupplyRequest
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: FK to SupplyItem.sku.
      - name: requesting_institution_id
        type: string
        source: input
        description: FK to ReportingInstitution submitting demand.
      - name: requested_quantity
        type: integer
        source: input
        description: Units requested.
        constraints: "> 0."
      - name: priority_score
        type: integer
        source: computed
        description: Allocation priority (high tier > high case_density > submission order).
      - name: allocated_quantity
        type: integer
        source: computed
        description: Units the platform actually committed (may be 0..requested_quantity).
        default: 0
      - name: dispatched_quantity
        type: integer
        source: computed
        description: Units shipped on a Dispatch.
        default: 0
      - name: consumed_quantity
        type: integer
        source: computed
        description: Units reported as consumed by requester.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Request lifecycle.
        default: PENDING
        constraints: "One of {PENDING, ALLOCATED, DISPATCHED, DELIVERED, CONSUMED, CANCELLED}."

  - name: Dispatch
    parent: null
    common_fields: false
    fields:
      - name: request_id
        type: string
        source: input
        description: FK to SupplyRequest.
      - name: quantity
        type: integer
        source: input
        description: Units in this dispatch.
        constraints: "> 0."
      - name: dispatched_at
        type: datetime
        source: system
        description: Time of dispatch.
      - name: delivered_at
        type: datetime
        source: system
        description: Time of delivery confirmation.
      - name: status
        type: enum
        source: computed
        description: Dispatch lifecycle.
        default: IN_TRANSIT
        constraints: "One of {IN_TRANSIT, DELIVERED}."

  - name: Bulletin
    parent: null
    common_fields: true
    fields:
      - name: bulletin_date
        type: datetime
        source: input
        description: Calendar date the bulletin covers (UTC date 00:00:00.000Z).
        constraints: "Unique per bulletin_date."
      - name: total_new_cases
        type: integer
        source: computed
        description: Count of Cases reported on bulletin_date (UTC).
      - name: tier_summary
        type: object
        source: computed
        description: "{HIGH: count, MEDIUM: count, LOW: count} of sub-districts."
      - name: status
        type: enum
        source: computed
        description: Bulletin lifecycle.
        default: DRAFT
        constraints: "One of {DRAFT, PUBLISHED, RETRACTED, ARCHIVED}."
      - name: channels
        type: array
        source: input
        description: Subset of {WEBSITE, APP, PRESS}.
      - name: rumor_corrections
        type: array
        source: computed
        description: Append-only list of rumor-correction objects.

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: entity_type
        type: enum
        source: input
        description: Which entity changed.
        constraints: "One of {Case, RiskTierDecision, Isolation, TestOrder}."
      - name: entity_id
        type: string
        source: input
        description: FK to the changed entity.
      - name: from_state
        type: string
        source: input
        description: Prior status.
      - name: to_state
        type: string
        source: input
        description: New status.
      - name: actor_role
        type: string
        source: input
        description: Role that performed the change.
      - name: actor_id
        type: string
        source: input
        description: X-User-ID at time of change.
      - name: at
        type: datetime
        source: system
        description: Timestamp.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Case
    initial_state: REPORTED
    terminal_states: [RECOVERED, DEDUPLICATED]
    transitions:
      - from: REPORTED
        to: UNDER_TRACING
        trigger: "POST /epi/tracing-tasks (dispatch a tracing task referencing this case)"
        actor: CDCDispatcher
        preconditions:
          - "Case.status == REPORTED"
          - "Case.case_type IN {CONFIRMED, ASYMPTOMATIC}"
          - "Case.status != DEDUPLICATED"
        side_effects:
          - "Create TracingTask in DISPATCHED with due_at = now() + TRACING_SLA_HOURS"
          - "Append AuditLog {Case, REPORTED -> UNDER_TRACING}"
      - from: REPORTED
        to: DEDUPLICATED
        trigger: "POST /epi/cases (a newer report keys to an existing (person_id, case_type) for which a non-terminal Case exists)"
        actor: system
        preconditions:
          - "Another Case for same (person_id, case_type) already exists in {REPORTED, UNDER_TRACING, CONFIRMED}"
        side_effects:
          - "Set superseded_by_case_id = surviving Case.id"
          - "Append AuditLog {Case, REPORTED -> DEDUPLICATED}"
      - from: UNDER_TRACING
        to: CONFIRMED
        trigger: "POST /epi/test-orders/{id}/result with result=POSITIVE for this Case.person_id and TestOrder.test_type=PCR"
        actor: LabTechnician
        preconditions:
          - "TestOrder.person_id == Case.person_id"
          - "Case.status == UNDER_TRACING"
          - "Case.case_type IN {SUSPECTED, ASYMPTOMATIC}"
        side_effects:
          - "Set Case.case_type = CONFIRMED if previously SUSPECTED"
          - "Recompute Region.provisional_risk_tier (case_density_risk_score)"
          - "Append AuditLog {Case, UNDER_TRACING -> CONFIRMED}"
      - from: CONFIRMED
        to: RECOVERED
        trigger: "POST /epi/cases/{id}/recover"
        actor: CDCDispatcher
        preconditions:
          - "Case.status == CONFIRMED"
          - "Linked Isolation for Case.person_id is in {RELEASED}"
          - "Two prior TestOrder rows for Case.person_id with result=NEGATIVE and test_type=PCR exist (chronologically distinct collection dates)"
        side_effects:
          - "Append AuditLog {Case, CONFIRMED -> RECOVERED}"

  - entity: TracingTask
    initial_state: DISPATCHED
    terminal_states: [CLOSED]
    transitions:
      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /epi/tracing-tasks/{id}/accept"
        actor: CDCTracer
        preconditions:
          - "TracingTask.status == DISPATCHED"
        side_effects:
          - "Set Case.status = UNDER_TRACING if currently REPORTED"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /epi/tracing-tasks/{id}/complete"
        actor: CDCTracer
        preconditions:
          - "TracingTask.status == IN_PROGRESS"
          - "discovered_contact_count >= 0 (i.e., tracer has finalized the contact list; may be zero)"
        side_effects:
          - "Set completed_at = now()"
          - "For each ContactEvent linked to this task with tier=CLOSE, create Isolation in ACTIVE for target_person_id (mode defaulted to HOME unless overridden by tracer)"
          - "Recompute Region.provisional_risk_tier for Case.region (via case_density_risk_score)"
      - from: COMPLETED
        to: NEEDS_REVISION
        trigger: "POST /epi/tracing-tasks/{id}/reject"
        actor: CDCSupervisor
        preconditions:
          - "TracingTask.status == COMPLETED"
        side_effects:
          - "Cancel auto-created Isolations whose status == ACTIVE and no DailyHealthReport attached"
      - from: NEEDS_REVISION
        to: IN_PROGRESS
        trigger: "POST /epi/tracing-tasks/{id}/accept"
        actor: CDCTracer
        preconditions:
          - "TracingTask.status == NEEDS_REVISION"
        side_effects: []
      - from: COMPLETED
        to: CLOSED
        trigger: "POST /epi/tracing-tasks/{id}/close"
        actor: CDCSupervisor
        preconditions:
          - "TracingTask.status == COMPLETED"
        side_effects: []

  - entity: Isolation
    initial_state: ACTIVE
    terminal_states: [RELEASED, VIOLATED_TERMINATED]
    transitions:
      - from: ACTIVE
        to: EXTENDED
        trigger: "POST /epi/isolations/{id}/check-release with isolation_release_eligibility returning EXTEND"
        actor: CDCTracer
        preconditions:
          - "Isolation.status == ACTIVE"
          - "now() >= start_date + ISOLATION_MIN_DAYS[mode]"
          - "isolation_release_eligibility(this) == EXTEND"
        side_effects:
          - "Increment extension_count by 1"
          - "Recompute planned_end_date = now() + EXTENSION_DAYS"
      - from: EXTENDED
        to: ACTIVE
        trigger: "system (rolls forward each extension cycle)"
        actor: system
        preconditions:
          - "Isolation.status == EXTENDED"
          - "now() < planned_end_date"
        side_effects: []
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /epi/isolations/{id}/check-release with isolation_release_eligibility returning RELEASE"
        actor: CDCTracer
        preconditions:
          - "Isolation.status IN {ACTIVE, EXTENDED}"
          - "isolation_release_eligibility(this) == RELEASE"
        side_effects:
          - "Set actual_end_date = now()"
          - "Set Person.isolation_status = RELEASED"
          - "If mode=CENTRALIZED: decrement IsolationFacility.occupied by 1; if facility status was FULL, transition to OPEN when occupied < capacity"
      - from: EXTENDED
        to: RELEASED
        trigger: "POST /epi/isolations/{id}/check-release with isolation_release_eligibility returning RELEASE"
        actor: CDCTracer
        preconditions:
          - "Isolation.status == EXTENDED"
          - "isolation_release_eligibility(this) == RELEASE"
        side_effects:
          - "Same as ACTIVE -> RELEASED side effects"
      - from: ACTIVE
        to: VIOLATED_TERMINATED
        trigger: "POST /epi/isolations/{id}/violation"
        actor: CDCTracer
        preconditions:
          - "Isolation.status IN {ACTIVE, EXTENDED}"
        side_effects:
          - "Increment violations_count by 1"
          - "Set actual_end_date = now()"
          - "Set Person.isolation_status = VIOLATED_TERMINATED"
          - "If mode=CENTRALIZED: decrement IsolationFacility.occupied by 1"
      - from: EXTENDED
        to: VIOLATED_TERMINATED
        trigger: "POST /epi/isolations/{id}/violation"
        actor: CDCTracer
        preconditions:
          - "Isolation.status == EXTENDED"
        side_effects:
          - "Same as ACTIVE -> VIOLATED_TERMINATED side effects"

  - entity: TestOrder
    initial_state: ORDERED
    terminal_states: [CLOSED, VOID]
    transitions:
      - from: ORDERED
        to: COLLECTED
        trigger: "POST /epi/test-orders/{id}/collect"
        actor: HospitalReporter
        preconditions:
          - "TestOrder.status == ORDERED"
        side_effects:
          - "Append {actor, COLLECT, now()} to chain_of_custody"
          - "Set collected_at = now()"
      - from: COLLECTED
        to: RESULTED
        trigger: "POST /epi/test-orders/{id}/result"
        actor: LabTechnician
        preconditions:
          - "TestOrder.status == COLLECTED"
          - "now() - collected_at <= TEST_VALIDITY_HOURS[test_type]"
        side_effects:
          - "Append {actor, RESULT_INGEST, now()} to chain_of_custody"
          - "Set result_recorded_at = now()"
          - "If result=POSITIVE and Person has open Case in {REPORTED, UNDER_TRACING}: trigger Case status advance (see Case state machine)"
          - "If result=POSITIVE and Person has no open Case: emit reminder side-effect (does not auto-create a Case)"
      - from: COLLECTED
        to: VOID
        trigger: "system (sweep when now() - collected_at > TEST_VALIDITY_HOURS[test_type] and result still PENDING)"
        actor: system
        preconditions:
          - "TestOrder.status == COLLECTED"
          - "result == PENDING"
        side_effects:
          - "Set result = INVALID"
          - "Append {system, EXPIRY_VOID, now()} to chain_of_custody"
      - from: RESULTED
        to: FOLLOW_UP
        trigger: "POST /epi/test-orders/{id}/flag-followup"
        actor: LabTechnician
        preconditions:
          - "TestOrder.status == RESULTED"
          - "result IN {POSITIVE, INVALID}"
        side_effects: []
      - from: FOLLOW_UP
        to: CLOSED
        trigger: "POST /epi/test-orders/{id}/close"
        actor: CDCTracer
        preconditions:
          - "TestOrder.status == FOLLOW_UP"
        side_effects: []
      - from: RESULTED
        to: CLOSED
        trigger: "POST /epi/test-orders/{id}/close"
        actor: CDCTracer
        preconditions:
          - "TestOrder.status == RESULTED"
          - "result == NEGATIVE"
        side_effects: []

  - entity: RiskTierDecision
    initial_state: PROVISIONAL
    terminal_states: [PUBLISHED, REJECTED]
    transitions:
      - from: PROVISIONAL
        to: UNDER_REVIEW
        trigger: "POST /epi/risk-decisions/{id}/submit-review"
        actor: CDCSupervisor
        preconditions:
          - "RiskTierDecision.status == PROVISIONAL"
          - "RiskTierDecision.provisional_tier != Region.current_risk_tier"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /epi/risk-decisions/{id}/approve"
        actor: RiskExpert
        preconditions:
          - "RiskTierDecision.status == UNDER_REVIEW"
          - "final_tier set in request body"
        side_effects: []
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /epi/risk-decisions/{id}/publish"
        actor: PressOfficer
        preconditions:
          - "RiskTierDecision.status == APPROVED"
          - "Region.current_risk_tier != final_tier (or first publication)"
        side_effects:
          - "Set Region.current_risk_tier = final_tier"
          - "Set Region.last_tier_decision_id = this.id"
          - "Set published_at = now()"
          - "Recompute SupplyRequest.priority_score for all PENDING requests in this Region (cascade)"
          - "If final_tier == HIGH: auto-flag any DRAFT Bulletin for this date to include this Region in HIGH bucket"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /epi/risk-decisions/{id}/reject"
        actor: RiskExpert
        preconditions:
          - "RiskTierDecision.status == UNDER_REVIEW"
        side_effects: []

  - entity: SupplyRequest
    initial_state: PENDING
    terminal_states: [CONSUMED, CANCELLED]
    transitions:
      - from: PENDING
        to: ALLOCATED
        trigger: "POST /epi/supply-requests/{id}/allocate (or batch /epi/supply/allocate-batch)"
        actor: SupplyManager
        preconditions:
          - "SupplyRequest.status == PENDING"
          - "Sufficient SupplyItem.reserve_quantity - SupplyItem.allocated_quantity >= allocation share computed by supply_allocation_distribution"
        side_effects:
          - "Set allocated_quantity per supply_allocation_distribution result"
          - "Increment SupplyItem.allocated_quantity by allocated_quantity"
      - from: ALLOCATED
        to: DISPATCHED
        trigger: "POST /epi/supply-requests/{id}/dispatch"
        actor: SupplyManager
        preconditions:
          - "SupplyRequest.status == ALLOCATED"
          - "Dispatch.quantity == SupplyRequest.allocated_quantity"
        side_effects:
          - "Create Dispatch in IN_TRANSIT"
          - "Decrement SupplyItem.reserve_quantity by allocated_quantity"
          - "Decrement SupplyItem.allocated_quantity by allocated_quantity"
          - "Set dispatched_quantity = allocated_quantity"
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /epi/dispatches/{id}/deliver"
        actor: SupplyManager
        preconditions:
          - "Linked Dispatch.status == IN_TRANSIT"
        side_effects:
          - "Set Dispatch.status = DELIVERED"
          - "Set Dispatch.delivered_at = now()"
      - from: DELIVERED
        to: CONSUMED
        trigger: "POST /epi/supply-requests/{id}/consume"
        actor: HospitalReporter
        preconditions:
          - "SupplyRequest.status == DELIVERED"
          - "consumed_quantity in request body <= dispatched_quantity"
        side_effects:
          - "Set consumed_quantity"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /epi/supply-requests/{id}/cancel"
        actor: SupplyManager
        preconditions:
          - "SupplyRequest.status == PENDING"
        side_effects: []
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /epi/supply-requests/{id}/cancel"
        actor: SupplyManager
        preconditions:
          - "SupplyRequest.status == ALLOCATED"
        side_effects:
          - "Decrement SupplyItem.allocated_quantity by allocated_quantity"

  - entity: Bulletin
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /epi/bulletins/{id}/publish"
        actor: PressOfficer
        preconditions:
          - "Bulletin.status == DRAFT"
          - "channels list is non-empty"
        side_effects:
          - "Snapshot total_new_cases and tier_summary at publish time"
      - from: PUBLISHED
        to: RETRACTED
        trigger: "POST /epi/bulletins/{id}/retract"
        actor: PressOfficer
        preconditions:
          - "Bulletin.status == PUBLISHED"
        side_effects:
          - "Append rumor-correction stub if reason supplied"
      - from: RETRACTED
        to: PUBLISHED
        trigger: "POST /epi/bulletins/{id}/publish"
        actor: PressOfficer
        preconditions:
          - "Bulletin.status == RETRACTED"
          - "channels list is non-empty"
        side_effects: []
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST /epi/bulletins/{id}/archive"
        actor: PressOfficer
        preconditions:
          - "Bulletin.status == PUBLISHED"
          - "now() >= bulletin_date + BULLETIN_ARCHIVE_DAYS"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two ReportingInstitutions file a Case for the same Person and case_type at the same time"
    guarantee: "At most one Case is in non-terminal status per (person_id, case_type); the loser is auto-marked DEDUPLICATED with superseded_by_case_id pointing at the winner."
    error_id: ERR_DUPLICATE_CASE
    http_status: 409
    serialization: "First-writer-wins on the (person_id, case_type) tuple, ordered by reported_at ascending; ties broken by Case.id lexicographic ascending."

  - scenario: "Two CDC tracers simultaneously confirm release for the same Isolation"
    guarantee: "Exactly one transition to RELEASED succeeds; the loser sees ERR_INVALID_STATE."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Isolation.status."

  - scenario: "Two SupplyRequest allocations race over the same SupplyItem and would jointly exceed reserve_quantity"
    guarantee: "Allocations are serialized; whichever request lands second and cannot satisfy its requested_quantity from remaining reserve gets ERR_SUPPLY_INSUFFICIENT."
    error_id: ERR_SUPPLY_INSUFFICIENT
    http_status: 409
    serialization: "First-writer-wins on SupplyItem.allocated_quantity field."

  - scenario: "Two centralized Isolations admitted to the same IsolationFacility while only one bed remains"
    guarantee: "At most occupied <= capacity at all times; second admission rejected."
    error_id: ERR_FACILITY_AT_CAPACITY
    http_status: 409
    serialization: "First-writer-wins on IsolationFacility.occupied."

  - scenario: "RiskExpert approves and supervisor rejects the same RiskTierDecision concurrently"
    guarantee: "Exactly one terminal review action wins; loser sees ERR_INVALID_STATE."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on RiskTierDecision.status."

  - scenario: "Two Bulletin publish requests race on the same bulletin_date"
    guarantee: "At most one Bulletin exists per bulletin_date; second publish creation rejected."
    error_id: ERR_DUPLICATE_BULLETIN
    http_status: 409
    serialization: "First-writer-wins on Bulletin.bulletin_date uniqueness."

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: case_density_risk_score
    trigger: "On Case status advance to CONFIRMED, on TracingTask completion that adds CLOSE contact ContactEvents, and on POST /epi/regions/{id}/recompute-risk"
    algorithm: weighted_scoring
    formula: |
      # Inputs (all scoped to Region.district_code, time window = trailing TIER_WINDOW_DAYS days from now()):
      #   confirmed_count = COUNT(Case where status IN {CONFIRMED, UNDER_TRACING} and Person.district_code == Region.district_code
      #                            and reported_at in (now()-TIER_WINDOW_DAYS, now()])
      #   asymptomatic_count = COUNT(Case where case_type == ASYMPTOMATIC and status != DEDUPLICATED and Person.district_code == Region.district_code
      #                               and reported_at in (now()-TIER_WINDOW_DAYS, now()])
      #   chain_count = COUNT(distinct connected components in ContactEvent graph restricted to Persons in Region with at least one Case in window)
      #   pop = Region.population
      #
      # density_per_100k = (confirmed_count * W_CONFIRMED + asymptomatic_count * W_ASYMPTOMATIC) / pop * 100000
      # score = density_per_100k + chain_count * W_CHAIN
      #
      # Tier mapping (closed intervals, evaluate top-down — first match wins):
      #   score >= TIER_HIGH_THRESHOLD       -> HIGH
      #   score >= TIER_MEDIUM_THRESHOLD     -> MEDIUM
      #   otherwise                          -> LOW
      #
      # Rounding: density_per_100k rounded to 2 decimals using ROUND_HALF_UP before adding W_CHAIN*chain_count.
      # Final score rounded to 2 decimals after the sum.
    input_set: |
      Cases with status IN {CONFIRMED, UNDER_TRACING, ASYMPTOMATIC-typed regardless of status}, reported_at in (now()-TIER_WINDOW_DAYS, now()].
      DEDUPLICATED Cases are excluded. ContactEvents with event_time > now() excluded.
    constants:
      TIER_WINDOW_DAYS: 14
      W_CONFIRMED: 3
      W_ASYMPTOMATIC: 1
      W_CHAIN: 5
      TIER_HIGH_THRESHOLD: 50.00
      TIER_MEDIUM_THRESHOLD: 10.00
    precision: "2 decimal places, ROUND_HALF_UP, applied per the order pinned in formula (density rounded before adding chain contribution; final sum re-rounded)."
    variants:
      - name: provisional_auto
        when: "Set RiskTierDecision.provisional_tier whenever recompute is triggered automatically."
        difference: "Writes to Region.provisional_risk_tier only; does NOT update Region.current_risk_tier."
      - name: final_expert_override
        when: "RiskExpert supplies final_tier on approval; when publish runs, Region.current_risk_tier := final_tier."
        difference: "Bypasses the score-to-tier mapping; final_tier may diverge from provisional_tier. The two variants produce different Region.current_risk_tier for the same Case/ContactEvent inputs."

  - name: contact_exposure_score
    trigger: "On ContactEvent ingestion via POST /epi/contact-events; on TracingTask completion; on GET /epi/persons/{id}/exposure-score read."
    algorithm: chronological
    formula: |
      # For target Person P, gather ContactEvents where target_person_id == P.id and event_time in (now()-EXPOSURE_WINDOW_DAYS, now()].
      # Replay in event_time ASCENDING order, tie-break by ContactEvent.id ASC.
      #
      # For each event e in replay order:
      #   base_weight = EVENT_WEIGHT[e.event_type]   # HOUSEHOLD=10, COWORKER=6, VENUE=4, TRANSIT=2
      #   proximity_factor = 1.0 if e.distance_meters <= CLOSE_DISTANCE else 0.5
      #   duration_factor  = min( e.duration_minutes / DURATION_DENOM , DURATION_CAP )
      #   raw = base_weight * proximity_factor * duration_factor
      #   decay = max(0, 1 - days_since(e.event_time) / EXPOSURE_WINDOW_DAYS)
      #   score += raw * decay
      #
      # Tier classification of edge e (writes ContactEvent.tier):
      #   tier = CLOSE if raw >= CLOSE_RAW_THRESHOLD else SUB_CLOSE
      #
      # Final Person.contact_exposure_score = round(score, 2) using ROUND_HALF_UP.
    input_set: |
      ContactEvents with event_time in (now()-EXPOSURE_WINDOW_DAYS, now()], target_person_id == P.id.
      Source Person whose Case.status == DEDUPLICATED is excluded.
    constants:
      EXPOSURE_WINDOW_DAYS: 14
      CLOSE_DISTANCE: 1.5
      DURATION_DENOM: 60
      DURATION_CAP: 4
      CLOSE_RAW_THRESHOLD: 5.0
      EVENT_WEIGHT: { HOUSEHOLD: 10, COWORKER: 6, VENUE: 4, TRANSIT: 2 }
    precision: "Per-event raw kept full precision; final score rounded to 2 decimals ROUND_HALF_UP. Rounding occurs once at the end (sum-then-round)."
    variants:
      - name: chronological_replay
        when: "Default read path and tier assignment."
        difference: "Process events in event_time ASC; produces canonical Person.contact_exposure_score used for downstream gating."
      - name: forward_looking_projection
        when: "POST /epi/persons/{id}/exposure-score?projection=true — projects what score would be if all PENDING ContactEvent ingestion from external HIS/LIS feeds were applied immediately, without applying decay aging (uses event_time clamped to now() for the projection sample)."
        difference: "Same input ContactEvents but decay uses days_since=0 for events whose event_time > now() - 1 day, producing a different (typically higher) numeric score for identical inputs."

  - name: supply_allocation_distribution
    trigger: "POST /epi/supply/allocate-batch (allocate across all PENDING SupplyRequests for a given sku)"
    algorithm: waterfall_allocation
    formula: |
      # Inputs: sku, available = SupplyItem.reserve_quantity - SupplyItem.allocated_quantity
      # Eligible = PENDING SupplyRequest rows for sku, sorted by:
      #   1. priority_score DESC  (priority_score itself: see priority_score formula below)
      #   2. created_at ASC
      #   3. id ASC
      #
      # priority_score = TIER_WEIGHT[Region.current_risk_tier of requesting_institution.district_code]
      #                + CATEGORY_WEIGHT[SupplyItem.category]
      # TIER_WEIGHT = { HIGH: 100, MEDIUM: 30, LOW: 0 }
      # CATEGORY_WEIGHT = { PPE: 5, TEST_KIT: 3, MEDICATION: 8, VACCINE: 6 }
      #
      # Waterfall: walk eligible in sort order, allocate min(remaining_available, request.requested_quantity).
      #
      # Pinned rounding rule (combinatorial mode b): allocations are integer units; no fractional units.
      # When available < total requested AND ties exist on priority_score+created_at+id (impossible by strict sort), no rounding redistribution occurs.
      # When the LAST request can only be partially satisfied, it is allocated the entire remaining_available (not split across multiple requests).
      # No proportional allocation; this is strict waterfall (priority order, integer units, no fractional remainder redistribution).
    input_set: |
      SupplyRequest rows with status==PENDING, sku == input sku.
      Region.current_risk_tier read at the moment of allocation (no caching).
    constants:
      TIER_WEIGHT_HIGH: 100
      TIER_WEIGHT_MEDIUM: 30
      TIER_WEIGHT_LOW: 0
      CATEGORY_WEIGHT_PPE: 5
      CATEGORY_WEIGHT_TEST_KIT: 3
      CATEGORY_WEIGHT_MEDICATION: 8
      CATEGORY_WEIGHT_VACCINE: 6
    precision: "Integer units. Strict waterfall — no rounding, no proportional split. Sort order pinned as (priority_score DESC, created_at ASC, id ASC)."
    variants:
      - name: greedy_waterfall
        when: "Default allocate-batch path."
        difference: "Sequential greedy from top of sorted list; later requests starved when reserve runs out."

  - name: isolation_release_eligibility
    trigger: "POST /epi/isolations/{id}/check-release"
    algorithm: threshold
    formula: |
      # Inputs:
      #   minimum_days_elapsed   = (now() - Isolation.start_date) in whole days
      #   min_required           = ISOLATION_MIN_DAYS[mode]
      #   negative_tests         = COUNT(TestOrder where person_id==Isolation.person_id, status==RESULTED,
      #                                  result==NEGATIVE, test_type==PCR, collected_at > Isolation.start_date)
      #   distinct_collection_dates = number of distinct UTC dates of collected_at across the above tests
      #   abnormal_recent_reports = COUNT(DailyHealthReport where isolation_id==this.id, is_abnormal==true,
      #                                   report_date in (now()-ABNORMAL_WINDOW_DAYS, now()])
      #
      # Decision (evaluate top-down — first match wins; this is the pinned evaluation order):
      #   if minimum_days_elapsed < min_required                                  -> NOT_ELIGIBLE
      #   else if abnormal_recent_reports > 0                                     -> EXTEND
      #   else if negative_tests < REQUIRED_NEGATIVE_TESTS                        -> EXTEND
      #   else if distinct_collection_dates < REQUIRED_NEGATIVE_TESTS             -> EXTEND
      #   else                                                                    -> RELEASE
      #
      # Note: EXTEND decisions add EXTENSION_DAYS to planned_end_date; subsequent calls re-evaluate with shifted clock.
    input_set: |
      TestOrders with status==RESULTED AND result==NEGATIVE AND test_type==PCR AND collected_at > Isolation.start_date.
      DailyHealthReports linked to this isolation_id in trailing ABNORMAL_WINDOW_DAYS window.
    constants:
      ISOLATION_MIN_DAYS_CENTRALIZED: 14
      ISOLATION_MIN_DAYS_HOME: 10
      ISOLATION_MIN_DAYS_MEDICAL_OBSERVATION: 7
      REQUIRED_NEGATIVE_TESTS: 2
      ABNORMAL_WINDOW_DAYS: 3
      EXTENSION_DAYS: 7
    precision: "Day-granular comparisons; days computed as floor((now() - start_date).total_seconds() / 86400)."
    variants:
      - name: strict_check
        when: "Default; used by ACTIVE -> RELEASED and EXTENDED -> RELEASED."
        difference: "All four checks applied in pinned order; first non-RELEASE outcome wins."

  - name: tracing_sla_breach
    trigger: "Computed-on-read on GET /epi/tracing-tasks/{id} and on GET /epi/tracing-tasks list endpoint."
    algorithm: threshold
    formula: |
      # is_overdue = (status IN {DISPATCHED, IN_PROGRESS, NEEDS_REVISION}) AND (now() > due_at)
      # severity:
      #   if not is_overdue                          -> NONE
      #   elif now() - due_at <= SLA_SOFT_OVERDUE     -> SOFT
      #   else                                        -> HARD
    input_set: "Single TracingTask row."
    constants:
      SLA_SOFT_OVERDUE_HOURS: 12
    precision: "Hour-granular; SOFT vs HARD boundary uses '<=' (not '<')."
    variants:
      - name: read_time_eval
        when: "Default."
        difference: "No persisted field; recomputed each read."

  - name: case_report_lateness
    trigger: "POST /epi/cases (case creation)"
    algorithm: threshold
    formula: |
      # report_deadline_at = onset_date + REPORT_LIMIT_HOURS (treat onset_date as 00:00:00.000Z)
      # is_late_report = reported_at > report_deadline_at  (strict >)
    input_set: "Single Case row."
    constants:
      REPORT_LIMIT_HOURS: 24
    precision: "Strict '>'. Equality treated as on-time."
    variants:
      - name: persisted_flag
        when: "Computed once on POST and persisted to is_late_report."
        difference: "Stable across reads; not recomputed."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-parameter resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Foreign keys in body resolve (e.g., person_id, sku, facility_id, request_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all mutating endpoints with FK body fields"

  - priority: 5
    category: state
    check: "Target resource is in a state where this transition is permitted"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "ReportingInstitution.status == ACTIVE for the acting institution"
    error_id: ERR_INSTITUTION_INACTIVE
    http_status: 403
    applies_to: "POST /epi/cases, POST /epi/test-orders, POST /epi/test-orders/{id}/result, POST /epi/contact-events"

  - priority: 7
    category: business_safety
    check: "Isolation violations cannot be recorded against terminal-status Isolations"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /epi/isolations/{id}/violation"

  - priority: 8
    category: business_referential
    check: "Case deduplication: another non-terminal Case for same (person_id, case_type) — server auto-marks loser DEDUPLICATED rather than rejecting; surfaces ERR_DUPLICATE_CASE only on concurrent insert race"
    error_id: ERR_DUPLICATE_CASE
    http_status: 409
    applies_to: "POST /epi/cases"

  - priority: 9
    category: business_referential
    check: "Bulletin uniqueness per bulletin_date"
    error_id: ERR_DUPLICATE_BULLETIN
    http_status: 409
    applies_to: "POST /epi/bulletins"

  - priority: 10
    category: business_temporal
    check: "TestOrder result must be ingested within TEST_VALIDITY_HOURS[test_type] of collected_at"
    error_id: ERR_TEST_RESULT_EXPIRED
    http_status: 422
    applies_to: "POST /epi/test-orders/{id}/result"

  - priority: 11
    category: business_temporal
    check: "Isolation start_date must be onset_date or later when an index Case exists; start_date cannot be in the future"
    error_id: ERR_ISOLATION_DATE_INVALID
    http_status: 422
    applies_to: "POST /epi/isolations"

  - priority: 12
    category: business_safety
    check: "Centralized isolation requires facility with status==OPEN and occupied < capacity"
    error_id: ERR_FACILITY_AT_CAPACITY
    http_status: 409
    applies_to: "POST /epi/isolations (mode=CENTRALIZED)"

  - priority: 13
    category: business_constraint
    check: "Release check passes (isolation_release_eligibility returns RELEASE)"
    error_id: ERR_RELEASE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /epi/isolations/{id}/check-release (when client requests RELEASE-only mode)"

  - priority: 14
    category: business_constraint
    check: "ContactEvent.source_person_id != target_person_id"
    error_id: ERR_SELF_CONTACT
    http_status: 422
    applies_to: "POST /epi/contact-events"

  - priority: 15
    category: business_constraint
    check: "ContactEvent.event_time not in future"
    error_id: ERR_EVENT_TIME_INVALID
    http_status: 422
    applies_to: "POST /epi/contact-events"

  - priority: 16
    category: business_fiscal
    check: "SupplyRequest allocation amount <= remaining SupplyItem.reserve_quantity - allocated_quantity"
    error_id: ERR_SUPPLY_INSUFFICIENT
    http_status: 409
    applies_to: "POST /epi/supply-requests/{id}/allocate, POST /epi/supply/allocate-batch"

  - priority: 17
    category: business_fiscal
    check: "Dispatch.quantity must equal SupplyRequest.allocated_quantity"
    error_id: ERR_DISPATCH_QUANTITY_MISMATCH
    http_status: 422
    applies_to: "POST /epi/supply-requests/{id}/dispatch"

  - priority: 18
    category: business_fiscal
    check: "Consumed quantity cannot exceed dispatched quantity"
    error_id: ERR_CONSUMPTION_EXCEEDS_DISPATCH
    http_status: 422
    applies_to: "POST /epi/supply-requests/{id}/consume"

  - priority: 19
    category: business_constraint
    check: "RiskTierDecision.provisional_tier must equal latest case_density_risk_score-derived tier at decision creation time"
    error_id: ERR_TIER_STALE
    http_status: 422
    applies_to: "POST /epi/risk-decisions"

  - priority: 20
    category: business_constraint
    check: "Bulletin.channels must be a non-empty subset of {WEBSITE, APP, PRESS}"
    error_id: ERR_INVALID_CHANNELS
    http_status: 422
    applies_to: "POST /epi/bulletins, POST /epi/bulletins/{id}/publish"

  - priority: 21
    category: business_constraint
    check: "Version conflict on optimistic-concurrency mutating endpoints"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "any PATCH carrying version"

  - priority: 22
    category: business_constraint
    check: "Pagination params within bounds (limit in [1,100], offset >= 0)"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # Institutions / Persons / Regions / Facilities
  - method: POST
    path: "/epi/institutions"
    description: "Register a reporting institution (CDC bootstrap operation)."
    roles: [CDCSupervisor]
    code: 201
    input: [institution_code, institution_type, district_code]
    output: ReportingInstitution
    side_effects: []
  - method: GET
    path: "/epi/institutions/{id}"
    description: "Read an institution."
    roles: [CDCSupervisor, CDCDispatcher, CDCTracer, HospitalReporter, LabTechnician, SupplyManager, PressOfficer, RiskExpert]
    code: 200
    input: []
    output: ReportingInstitution
    side_effects: []
  - method: POST
    path: "/epi/regions"
    description: "Create a Region (sub-district)."
    roles: [CDCSupervisor]
    code: 201
    input: [district_code, population]
    output: Region
    side_effects: []
  - method: GET
    path: "/epi/regions/{id}"
    description: "Read a Region."
    roles: [CDCSupervisor, CDCDispatcher, CDCTracer, RiskExpert, PressOfficer]
    code: 200
    input: []
    output: Region
    side_effects: []
  - method: POST
    path: "/epi/regions/{id}/recompute-risk"
    description: "Manually trigger case_density_risk_score recompute. Creates a PROVISIONAL RiskTierDecision if the computed tier differs from current_risk_tier."
    roles: [CDCSupervisor]
    code: 200
    input: []
    output: RiskTierDecision
    side_effects:
      - "Runs case_density_risk_score (provisional_auto variant)"
      - "Writes Region.provisional_risk_tier"
      - "May create a new RiskTierDecision row in PROVISIONAL"
  - method: POST
    path: "/epi/persons"
    description: "Register a Person."
    roles: [CDCSupervisor, HospitalReporter]
    code: 201
    input: [person_hash, demographics, district_code]
    output: Person
    side_effects: []
  - method: GET
    path: "/epi/persons/{id}"
    description: "Read a Person."
    roles: [CDCSupervisor, CDCDispatcher, CDCTracer, HospitalReporter, LabTechnician]
    code: 200
    input: []
    output: Person
    side_effects: []
  - method: GET
    path: "/epi/persons/{id}/exposure-score"
    description: "Read computed contact_exposure_score. Query param projection={false,true} selects variant."
    roles: [CDCSupervisor, CDCTracer]
    code: 200
    input: ["projection?"]
    output: object
    side_effects:
      - "Runs contact_exposure_score (chronological_replay or forward_looking_projection)"
  - method: POST
    path: "/epi/facilities"
    description: "Register an IsolationFacility."
    roles: [CDCSupervisor]
    code: 201
    input: [facility_code, district_code, capacity]
    output: IsolationFacility
    side_effects: []
  - method: GET
    path: "/epi/facilities/{id}"
    description: "Read facility."
    roles: [CDCSupervisor, CDCTracer]
    code: 200
    input: []
    output: IsolationFacility
    side_effects: []

  # Cases
  - method: POST
    path: "/epi/cases"
    description: "File a Case. Auto-deduplicates losers to DEDUPLICATED on collision."
    roles: [HospitalReporter, CDCDispatcher]
    code: 201
    input: [person_id, reporting_institution_id, case_type, onset_date, symptoms, "exposure_history?"]
    output: Case
    side_effects:
      - "Sets reported_at = now()"
      - "Computes report_deadline_at and is_late_report (case_report_lateness)"
      - "Triggers case_density_risk_score recompute (provisional_auto)"
      - "Auto-dedup: if non-terminal duplicate exists, this Case enters DEDUPLICATED"
  - method: GET
    path: "/epi/cases/{id}"
    description: "Read a Case."
    roles: [CDCSupervisor, CDCDispatcher, CDCTracer, HospitalReporter]
    code: 200
    input: []
    output: Case
    side_effects: []
  - method: GET
    path: "/epi/cases"
    description: "List Cases with filters (district_code?, status?, case_type?, since?, until?, limit, offset)."
    roles: [CDCSupervisor, CDCDispatcher, CDCTracer, HospitalReporter]
    code: 200
    input: ["district_code?", "status?", "case_type?", "since?", "until?", "limit?", "offset?"]
    output: "Case[]"
    side_effects: []
  - method: POST
    path: "/epi/cases/{id}/recover"
    description: "Mark a CONFIRMED Case as RECOVERED."
    roles: [CDCDispatcher]
    code: 200
    input: []
    output: Case
    side_effects:
      - "Validates two distinct-date NEGATIVE PCR tests and RELEASED Isolation"

  # Contact Events
  - method: POST
    path: "/epi/contact-events"
    description: "Ingest a contact edge into the graph. Auto-classifies tier via contact_exposure_score thresholds."
    roles: [CDCTracer, HospitalReporter]
    code: 201
    input: [source_person_id, target_person_id, event_type, event_time, duration_minutes, distance_meters, ingested_from]
    output: ContactEvent
    side_effects:
      - "Computes per-edge raw weight; sets tier=CLOSE or SUB_CLOSE"
      - "Triggers contact_exposure_score recompute for target_person"
  - method: GET
    path: "/epi/persons/{id}/contact-graph"
    description: "Return contact-graph slice for a person (nodes + edges within EXPOSURE_WINDOW_DAYS)."
    roles: [CDCSupervisor, CDCTracer]
    code: 200
    input: ["depth?"]
    output: object
    side_effects: []

  # Tracing Tasks
  - method: POST
    path: "/epi/tracing-tasks"
    description: "Dispatch a tracing task for a Case to a local CDC."
    roles: [CDCDispatcher]
    code: 201
    input: [case_id, assigned_cdc_id]
    output: TracingTask
    side_effects:
      - "Sets dispatched_at and due_at = now() + TRACING_SLA_HOURS"
      - "Transitions Case.status REPORTED -> UNDER_TRACING"
  - method: GET
    path: "/epi/tracing-tasks/{id}"
    description: "Read a tracing task (includes computed sla_severity)."
    roles: [CDCSupervisor, CDCTracer, CDCDispatcher]
    code: 200
    input: []
    output: TracingTask
    side_effects: []
  - method: GET
    path: "/epi/tracing-tasks"
    description: "List tracing tasks with filters."
    roles: [CDCSupervisor, CDCTracer, CDCDispatcher]
    code: 200
    input: ["status?", "assigned_cdc_id?", "overdue?", "limit?", "offset?"]
    output: "TracingTask[]"
    side_effects: []
  - method: POST
    path: "/epi/tracing-tasks/{id}/accept"
    description: "Accept a dispatched task (DISPATCHED->IN_PROGRESS, NEEDS_REVISION->IN_PROGRESS)."
    roles: [CDCTracer]
    code: 200
    input: []
    output: TracingTask
    side_effects: []
  - method: POST
    path: "/epi/tracing-tasks/{id}/complete"
    description: "Confirm tracing complete (IN_PROGRESS->COMPLETED)."
    roles: [CDCTracer]
    code: 200
    input: []
    output: TracingTask
    side_effects:
      - "Auto-create Isolation in ACTIVE for each linked CLOSE-tier contact target"
      - "Recompute case_density_risk_score for Region"
  - method: POST
    path: "/epi/tracing-tasks/{id}/reject"
    description: "Supervisor rejects a COMPLETED task (COMPLETED->NEEDS_REVISION)."
    roles: [CDCSupervisor]
    code: 200
    input: []
    output: TracingTask
    side_effects:
      - "Cancel auto-created Isolations still ACTIVE with no DailyHealthReport"
  - method: POST
    path: "/epi/tracing-tasks/{id}/close"
    description: "Close a completed task."
    roles: [CDCSupervisor]
    code: 200
    input: []
    output: TracingTask
    side_effects: []

  # Isolations
  - method: POST
    path: "/epi/isolations"
    description: "Create an Isolation."
    roles: [CDCTracer]
    code: 201
    input: [person_id, mode, "facility_id?", start_date]
    output: Isolation
    side_effects:
      - "Sets planned_end_date = start_date + ISOLATION_MIN_DAYS[mode]"
      - "If mode=CENTRALIZED: increment IsolationFacility.occupied; if full -> facility.status=FULL"
      - "Sets Person.isolation_status = ACTIVE"
  - method: GET
    path: "/epi/isolations/{id}"
    description: "Read an isolation."
    roles: [CDCSupervisor, CDCTracer]
    code: 200
    input: []
    output: Isolation
    side_effects: []
  - method: POST
    path: "/epi/isolations/{id}/daily-report"
    description: "Submit a daily health report."
    roles: [CDCTracer, HospitalReporter]
    code: 201
    input: [report_date, temperature_c, symptoms]
    output: DailyHealthReport
    side_effects:
      - "Computes is_abnormal"
      - "Increments Isolation.daily_reports_received"
  - method: POST
    path: "/epi/isolations/{id}/violation"
    description: "Record a violation (geofence/access-control)."
    roles: [CDCTracer]
    code: 200
    input: [reason]
    output: Isolation
    side_effects:
      - "Increment violations_count"
      - "Transition to VIOLATED_TERMINATED"
      - "Decrement facility occupied if applicable"
  - method: POST
    path: "/epi/isolations/{id}/check-release"
    description: "Run isolation_release_eligibility and either EXTEND or RELEASE."
    roles: [CDCTracer]
    code: 200
    input: ["mode_hint?"]
    output: Isolation
    side_effects:
      - "Runs isolation_release_eligibility"
      - "On EXTEND: increments extension_count and shifts planned_end_date"
      - "On RELEASE: terminal transition; decrements facility occupied"

  # Tests
  - method: POST
    path: "/epi/test-orders"
    description: "Order a test."
    roles: [HospitalReporter, CDCTracer]
    code: 201
    input: [person_id, ordering_institution_id, test_type]
    output: TestOrder
    side_effects: []
  - method: POST
    path: "/epi/test-orders/{id}/collect"
    description: "Record sample collection."
    roles: [HospitalReporter]
    code: 200
    input: []
    output: TestOrder
    side_effects:
      - "Append chain_of_custody entry; set collected_at"
  - method: POST
    path: "/epi/test-orders/{id}/result"
    description: "Lab ingests a result."
    roles: [LabTechnician]
    code: 200
    input: [result]
    output: TestOrder
    side_effects:
      - "Validity check: now() - collected_at <= TEST_VALIDITY_HOURS[test_type]"
      - "If result=POSITIVE and Person has open Case: advance Case toward CONFIRMED"
  - method: POST
    path: "/epi/test-orders/{id}/flag-followup"
    description: "Flag for abnormal-result follow-up."
    roles: [LabTechnician]
    code: 200
    input: []
    output: TestOrder
    side_effects: []
  - method: POST
    path: "/epi/test-orders/{id}/close"
    description: "Close a test order."
    roles: [CDCTracer]
    code: 200
    input: []
    output: TestOrder
    side_effects: []
  - method: GET
    path: "/epi/test-orders/{id}"
    description: "Read one test order."
    roles: [CDCSupervisor, CDCTracer, HospitalReporter, LabTechnician]
    code: 200
    input: []
    output: TestOrder
    side_effects: []
  - method: GET
    path: "/epi/test-orders"
    description: "List/batch test orders (filters: person_id?, status?, result?, since?, until?, limit, offset)."
    roles: [CDCSupervisor, CDCTracer, HospitalReporter, LabTechnician]
    code: 200
    input: ["person_id?", "status?", "result?", "since?", "until?", "limit?", "offset?"]
    output: "TestOrder[]"
    side_effects: []

  # Risk Decisions
  - method: POST
    path: "/epi/risk-decisions"
    description: "Create a PROVISIONAL RiskTierDecision (snapshot current provisional_risk_tier)."
    roles: [CDCSupervisor]
    code: 201
    input: [region_id]
    output: RiskTierDecision
    side_effects:
      - "Runs case_density_risk_score; provisional_tier must match latest computed tier"
  - method: GET
    path: "/epi/risk-decisions/{id}"
    description: "Read."
    roles: [CDCSupervisor, RiskExpert, PressOfficer]
    code: 200
    input: []
    output: RiskTierDecision
    side_effects: []
  - method: POST
    path: "/epi/risk-decisions/{id}/submit-review"
    description: "Submit for expert review."
    roles: [CDCSupervisor]
    code: 200
    input: []
    output: RiskTierDecision
    side_effects: []
  - method: POST
    path: "/epi/risk-decisions/{id}/approve"
    description: "Expert approves with a final_tier."
    roles: [RiskExpert]
    code: 200
    input: [final_tier, expert_reviewer_id]
    output: RiskTierDecision
    side_effects: []
  - method: POST
    path: "/epi/risk-decisions/{id}/reject"
    description: "Expert rejects."
    roles: [RiskExpert]
    code: 200
    input: [expert_reviewer_id]
    output: RiskTierDecision
    side_effects: []
  - method: POST
    path: "/epi/risk-decisions/{id}/publish"
    description: "Publish: writes Region.current_risk_tier."
    roles: [PressOfficer]
    code: 200
    input: []
    output: RiskTierDecision
    side_effects:
      - "Region.current_risk_tier := final_tier"
      - "Recompute priority_score on PENDING SupplyRequests in affected Region (cascade)"

  # Supply
  - method: POST
    path: "/epi/supply-items"
    description: "Register a SupplyItem and seed reserve_quantity."
    roles: [SupplyManager]
    code: 201
    input: [sku, category, reserve_quantity]
    output: SupplyItem
    side_effects: []
  - method: GET
    path: "/epi/supply-items/{id}"
    description: "Read a SupplyItem."
    roles: [SupplyManager, CDCSupervisor]
    code: 200
    input: []
    output: SupplyItem
    side_effects: []
  - method: POST
    path: "/epi/supply-requests"
    description: "Submit a supply demand."
    roles: [HospitalReporter, CDCTracer, CDCSupervisor]
    code: 201
    input: [sku, requesting_institution_id, requested_quantity]
    output: SupplyRequest
    side_effects:
      - "priority_score computed from Region.current_risk_tier of requesting_institution + CATEGORY_WEIGHT[sku.category]"
  - method: GET
    path: "/epi/supply-requests/{id}"
    description: "Read a supply request."
    roles: [SupplyManager, CDCSupervisor, HospitalReporter, CDCTracer]
    code: 200
    input: []
    output: SupplyRequest
    side_effects: []
  - method: POST
    path: "/epi/supply-requests/{id}/allocate"
    description: "Allocate a single supply request (single-target convenience around batch)."
    roles: [SupplyManager]
    code: 200
    input: []
    output: SupplyRequest
    side_effects:
      - "Runs supply_allocation_distribution restricted to this single request"
  - method: POST
    path: "/epi/supply/allocate-batch"
    description: "Allocate all PENDING SupplyRequests for an sku via the waterfall."
    roles: [SupplyManager]
    code: 200
    input: [sku]
    output: object
    side_effects:
      - "Runs supply_allocation_distribution"
  - method: POST
    path: "/epi/supply-requests/{id}/dispatch"
    description: "Dispatch the allocated quantity."
    roles: [SupplyManager]
    code: 201
    input: [quantity]
    output: Dispatch
    side_effects:
      - "Creates Dispatch IN_TRANSIT"
      - "Decrements SupplyItem.reserve_quantity and allocated_quantity"
  - method: POST
    path: "/epi/dispatches/{id}/deliver"
    description: "Mark dispatch delivered."
    roles: [SupplyManager, HospitalReporter]
    code: 200
    input: []
    output: Dispatch
    side_effects:
      - "Transitions SupplyRequest DISPATCHED -> DELIVERED"
  - method: POST
    path: "/epi/supply-requests/{id}/consume"
    description: "Report consumption."
    roles: [HospitalReporter, CDCTracer]
    code: 200
    input: [consumed_quantity]
    output: SupplyRequest
    side_effects: []
  - method: POST
    path: "/epi/supply-requests/{id}/cancel"
    description: "Cancel."
    roles: [SupplyManager]
    code: 200
    input: []
    output: SupplyRequest
    side_effects:
      - "If ALLOCATED: release SupplyItem.allocated_quantity"

  # Bulletins
  - method: POST
    path: "/epi/bulletins"
    description: "Create a DRAFT bulletin."
    roles: [PressOfficer]
    code: 201
    input: [bulletin_date, channels]
    output: Bulletin
    side_effects:
      - "Snapshots total_new_cases and tier_summary at draft creation"
  - method: GET
    path: "/epi/bulletins/{id}"
    description: "Read a bulletin."
    roles: [CDCSupervisor, PressOfficer]
    code: 200
    input: []
    output: Bulletin
    side_effects: []
  - method: GET
    path: "/epi/bulletins"
    description: "List/archive lookup."
    roles: [CDCSupervisor, PressOfficer]
    code: 200
    input: ["status?", "since?", "until?", "limit?", "offset?"]
    output: "Bulletin[]"
    side_effects: []
  - method: POST
    path: "/epi/bulletins/{id}/publish"
    description: "Publish (DRAFT or RETRACTED -> PUBLISHED)."
    roles: [PressOfficer]
    code: 200
    input: []
    output: Bulletin
    side_effects: []
  - method: POST
    path: "/epi/bulletins/{id}/retract"
    description: "Retract a published bulletin with optional rumor-correction reason."
    roles: [PressOfficer]
    code: 200
    input: ["reason?"]
    output: Bulletin
    side_effects: []
  - method: POST
    path: "/epi/bulletins/{id}/archive"
    description: "Archive (PUBLISHED -> ARCHIVED, only after BULLETIN_ARCHIVE_DAYS)."
    roles: [PressOfficer]
    code: 200
    input: []
    output: Bulletin
    side_effects: []

  # Audit log
  - method: GET
    path: "/epi/audit-logs"
    description: "Query audit logs."
    roles: [CDCSupervisor]
    code: 200
    input: ["entity_type?", "entity_id?", "since?", "until?", "limit?", "offset?"]
    output: "AuditLog[]"
    side_effects: []

  # Test-driving endpoints (REQUIRED by §1.5 testability-completeness)
  - method: POST
    path: "/_clock/advance"
    description: "Advance the simulated wall clock for time-gated transitions (TRACING_SLA, isolation min-days, test validity, bulletin archive)."
    roles: [CDCSupervisor]
    code: 200
    input: [seconds]
    output: object
    side_effects:
      - "May expire TestOrder rows in COLLECTED via sweep"
      - "May make Isolations eligible for release check"
  - method: POST
    path: "/_sweep/run"
    description: "Run system sweeps: TestOrder validity expiry, Isolation EXTENDED->ACTIVE rollover."
    roles: [CDCSupervisor]
    code: 200
    input: []
    output: object
    side_effects:
      - "TestOrder.status COLLECTED -> VOID when expired"
      - "Isolation.status EXTENDED -> ACTIVE when now() < planned_end_date and other constraints met"
  - method: POST
    path: "/_events/emit"
    description: "Simulate inter-agency / HIS / LIS event ingestion that fans into ContactEvent or TestOrder.result."
    roles: [CDCSupervisor]
    code: 200
    input: [source, payload]
    output: object
    side_effects:
      - "Source HIS/LIS may create ContactEvent or update TestOrder result"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing X-User-Role or X-User-ID."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for endpoint."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path resource does not exist."
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Body FK references a missing entity."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state permitting this transition."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Optimistic-concurrency version mismatch on PATCH."
  - id: ERR_DUPLICATE_CASE
    http: 409
    condition: "Two concurrent inserts for same (person_id, case_type) where prior is non-terminal."
  - id: ERR_DUPLICATE_BULLETIN
    http: 409
    condition: "Bulletin already exists for bulletin_date."
  - id: ERR_INSTITUTION_INACTIVE
    http: 403
    condition: "Acting ReportingInstitution.status != ACTIVE."
  - id: ERR_TEST_RESULT_EXPIRED
    http: 422
    condition: "now() - collected_at > TEST_VALIDITY_HOURS[test_type]."
  - id: ERR_ISOLATION_DATE_INVALID
    http: 422
    condition: "Isolation.start_date in the future, or before an existing index Case.onset_date."
  - id: ERR_FACILITY_AT_CAPACITY
    http: 409
    condition: "Centralized isolation requested while facility full / not OPEN."
  - id: ERR_RELEASE_NOT_ELIGIBLE
    http: 422
    condition: "isolation_release_eligibility != RELEASE."
  - id: ERR_SELF_CONTACT
    http: 422
    condition: "ContactEvent.source_person_id == target_person_id."
  - id: ERR_EVENT_TIME_INVALID
    http: 422
    condition: "ContactEvent.event_time in the future."
  - id: ERR_SUPPLY_INSUFFICIENT
    http: 409
    condition: "SupplyItem reserve - allocated < required."
  - id: ERR_DISPATCH_QUANTITY_MISMATCH
    http: 422
    condition: "Dispatch.quantity != SupplyRequest.allocated_quantity."
  - id: ERR_CONSUMPTION_EXCEEDS_DISPATCH
    http: 422
    condition: "consumed_quantity > dispatched_quantity."
  - id: ERR_TIER_STALE
    http: 422
    condition: "RiskTierDecision.provisional_tier disagrees with latest case_density_risk_score-derived tier."
  - id: ERR_INVALID_CHANNELS
    http: 422
    condition: "Bulletin.channels empty or not a subset of {WEBSITE, APP, PRESS}."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit/offset out of allowed bounds."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HospitalReporter
    description: "Hospital staff filing cases, collecting samples, reporting consumption."
    identity: "entity_backed:ReportingInstitution"
    exclusive_operations:
      - "POST /epi/test-orders/{id}/collect"
    shared_operations:
      - "POST /epi/cases"
      - "POST /epi/persons"
      - "POST /epi/contact-events (shared with CDCTracer)"
      - "POST /epi/test-orders"
      - "POST /epi/isolations/{id}/daily-report"
      - "POST /epi/supply-requests"
      - "POST /epi/supply-requests/{id}/consume"
      - "POST /epi/dispatches/{id}/deliver"

  - name: LabTechnician
    description: "Laboratory staff ingesting test results."
    identity: "entity_backed:ReportingInstitution"
    exclusive_operations:
      - "POST /epi/test-orders/{id}/result"
      - "POST /epi/test-orders/{id}/flag-followup"
    shared_operations: []

  - name: CDCDispatcher
    description: "Dispatches tracing tasks and confirms recoveries."
    identity: "entity_backed:ReportingInstitution"
    exclusive_operations:
      - "POST /epi/tracing-tasks"
      - "POST /epi/cases/{id}/recover"
    shared_operations:
      - "POST /epi/cases (shared with HospitalReporter)"

  - name: CDCTracer
    description: "Field tracer who runs tracing tasks and isolations."
    identity: "entity_backed:ReportingInstitution"
    exclusive_operations:
      - "POST /epi/tracing-tasks/{id}/accept"
      - "POST /epi/tracing-tasks/{id}/complete"
      - "POST /epi/isolations"
      - "POST /epi/isolations/{id}/violation"
      - "POST /epi/isolations/{id}/check-release"
    shared_operations:
      - "POST /epi/contact-events"
      - "POST /epi/test-orders"
      - "POST /epi/test-orders/{id}/close"
      - "POST /epi/isolations/{id}/daily-report"
      - "POST /epi/supply-requests"
