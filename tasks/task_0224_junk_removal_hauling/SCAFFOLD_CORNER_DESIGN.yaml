          setup: ["A COMPLETED job (measured 0.10, no items, SCHEDULED, final 8100)."]
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { name: "std_policy", full_truck_cents: 60000, tier_breaks: [{upper_fraction: 0.25, marginal_multiplier: 1.0}, {upper_fraction: 0.5, marginal_multiplier: 0.9}, {upper_fraction: 1.0, marginal_multiplier: 0.8}], mattress_surcharge_cents: 3500, appliance_surcharge_cents: 2500, freon_surcharge_cents: 5000, dump_fee_per_ton_cents: 9000, full_truck_dump_cents: 12000, recycle_fee_per_ton_cents: 4000, diversion_credit_per_ton_cents: 1500 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "d2@x.com", full_name: "D2", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew D2", shift_start_utc: "2026-06-10T08:00:00.000Z", shift_end_utc: "2026-06-10T18:00:00.000Z" }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /trucks"
              payload: { name: "TD2" }
              as: PlatformAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /haul-jobs"
              payload: { customer_id: "${cust_id}", service_type: "SCHEDULED", address: "6 A St" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /haul-jobs/${job_id}/photo-estimates"
              payload: { photo_url: "http://p/d2.jpg", raw_fraction: 0.10 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { est_id: $.data.id }
            - call: "POST /haul-jobs/${job_id}/photo-estimates/${est_id}/accept"
              payload: { }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /crews/${crew_id}"
              payload: { }
              as: Dispatcher
              captures: { crew_v: $.data.version }
            - call: "POST /dispatches"
              payload: { haul_job_id: "${job_id}", crew_id: "${crew_id}", truck_id: "${truck_id}", window_start_utc: "2026-06-10T09:00:00.000Z", window_end_utc: "2026-06-10T10:00:00.000Z", expected_crew_version: "${crew_v}" }
              as: Dispatcher
              captures: { disp_id: $.data.id }
            - call: "POST /dispatches/${disp_id}/activate"
              payload: { }
              as: Dispatcher
            - call: "POST /haul-jobs/${job_id}/arrive"
              payload: { }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /haul-jobs/${job_id}/load"
              payload: { measured_truck_fraction: 0.10 }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /haul-jobs/${job_id}/complete"
              payload: { }
              as: Dispatcher
          trigger:
            - call: "POST /haul-jobs/${job_id}/cancel"
              payload: { }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_JOB_NOT_CANCELLABLE"

      - name: activate_already_active_dispatch_returns_not_reserved
        claim_type: Idempotency
        grounds:
          - state_machines.Dispatch.RESERVED_to_ACTIVE
          - "errors[ERR_DISPATCH_NOT_RESERVED]"
        distinguishing_aspect: "Activating a dispatch twice: second POST /dispatches/{dispatchId}/activate (now ACTIVE) returns ERR_DISPATCH_NOT_RESERVED (409)."
        test_recipe:
          setup: ["A SCHEDULED job whose dispatch was already activated (ACTIVE / job DISPATCHED)."]
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { name: "std_policy", full_truck_cents: 60000, tier_breaks: [{upper_fraction: 0.25, marginal_multiplier: 1.0}, {upper_fraction: 0.5, marginal_multiplier: 0.9}, {upper_fraction: 1.0, marginal_multiplier: 0.8}], mattress_surcharge_cents: 3500, appliance_surcharge_cents: 2500, freon_surcharge_cents: 5000, dump_fee_per_ton_cents: 9000, full_truck_dump_cents: 12000, recycle_fee_per_ton_cents: 4000, diversion_credit_per_ton_cents: 1500 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "d3@x.com", full_name: "D3", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew D3", shift_start_utc: "2026-06-10T08:00:00.000Z", shift_end_utc: "2026-06-10T18:00:00.000Z" }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /trucks"
              payload: { name: "TD3" }
              as: PlatformAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /haul-jobs"
              payload: { customer_id: "${cust_id}", service_type: "SCHEDULED", address: "7 A St" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /haul-jobs/${job_id}/photo-estimates"
              payload: { photo_url: "http://p/d3.jpg", raw_fraction: 0.10 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { est_id: $.data.id }
            - call: "POST /haul-jobs/${job_id}/photo-estimates/${est_id}/accept"
              payload: { }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /crews/${crew_id}"
              payload: { }
              as: Dispatcher
              captures: { crew_v: $.data.version }
            - call: "POST /dispatches"
              payload: { haul_job_id: "${job_id}", crew_id: "${crew_id}", truck_id: "${truck_id}", window_start_utc: "2026-06-10T09:00:00.000Z", window_end_utc: "2026-06-10T10:00:00.000Z", expected_crew_version: "${crew_v}" }
              as: Dispatcher
              captures: { disp_id: $.data.id }
            - call: "POST /dispatches/${disp_id}/activate"
              payload: { }
              as: Dispatcher
          trigger:
            - call: "POST /dispatches/${disp_id}/activate"
              payload: { }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DISPATCH_NOT_RESERVED"

      - name: resolve_dispute_when_not_disputed_returns_not_disputed
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Invoice.ISSUED_to_ISSUED
          - "errors[ERR_INVOICE_NOT_DISPUTED]"
        distinguishing_aspect: "POST /invoices/{invoiceId}/resolve-dispute on an invoice with dispute_status NONE returns ERR_INVOICE_NOT_DISPUTED (409)."
        test_recipe:
          setup: ["A COMPLETED job with an ISSUED, non-disputed SERVICE invoice."]
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { name: "std_policy", full_truck_cents: 60000, tier_breaks: [{upper_fraction: 0.25, marginal_multiplier: 1.0}, {upper_fraction: 0.5, marginal_multiplier: 0.9}, {upper_fraction: 1.0, marginal_multiplier: 0.8}], mattress_surcharge_cents: 3500, appliance_surcharge_cents: 2500, freon_surcharge_cents: 5000, dump_fee_per_ton_cents: 9000, full_truck_dump_cents: 12000, recycle_fee_per_ton_cents: 4000, diversion_credit_per_ton_cents: 1500 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "d4@x.com", full_name: "D4", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew D4", shift_start_utc: "2026-06-10T08:00:00.000Z", shift_end_utc: "2026-06-10T18:00:00.000Z" }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /trucks"
              payload: { name: "TD4" }
              as: PlatformAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /haul-jobs"
              payload: { customer_id: "${cust_id}", service_type: "SCHEDULED", address: "8 A St" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /haul-jobs/${job_id}/photo-estimates"
              payload: { photo_url: "http://p/d4.jpg", raw_fraction: 0.10 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { est_id: $.data.id }
            - call: "POST /haul-jobs/${job_id}/photo-estimates/${est_id}/accept"
              payload: { }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /crews/${crew_id}"
              payload: { }
              as: Dispatcher
              captures: { crew_v: $.data.version }
            - call: "POST /dispatches"
              payload: { haul_job_id: "${job_id}", crew_id: "${crew_id}", truck_id: "${truck_id}", window_start_utc: "2026-06-10T09:00:00.000Z", window_end_utc: "2026-06-10T10:00:00.000Z", expected_crew_version: "${crew_v}" }
              as: Dispatcher
              captures: { disp_id: $.data.id }
            - call: "POST /dispatches/${disp_id}/activate"
              payload: { }
              as: Dispatcher
            - call: "POST /haul-jobs/${job_id}/arrive"
              payload: { }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /haul-jobs/${job_id}/load"
              payload: { measured_truck_fraction: 0.10 }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /haul-jobs/${job_id}/complete"
              payload: { }
              as: Dispatcher
            - call: "GET /haul-jobs/${job_id}/invoices"
              payload: { }
              as: Billing
              captures: { inv_id: "$.data[0].id" }
          trigger:
            - call: "POST /invoices/${inv_id}/resolve-dispute"
