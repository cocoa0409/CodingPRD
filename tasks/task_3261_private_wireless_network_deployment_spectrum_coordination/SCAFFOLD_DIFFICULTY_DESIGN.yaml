scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1: dual_variant_calc (≥ 2 instances, different entity domains)
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: design_capacity_provisional_vs_final_diverges
        grounds:
          - calculations.predicted_capacity_provisional
          - calculations.final_capacity_conservative
          - entities.CoverageDesign.fields.predicted_capacity_mbps
          - entities.CoverageDesign.fields.final_capacity_mbps
        distinguishing_aspect: |
          Operates on the CoverageDesign entity domain (capacity estimate); the
          provisional variant uses 6 dB margin and no neighbor penalty, the
          final variant uses 9 dB margin AND a 5% multiplicative penalty per
          ON_AIR neighbor (cap 3). For a Site with one PLANNED cell at
          max_eirp_dbm=40 (factor 1.0), OPEN material (attenuation 3, factor
          0.9), and 2 ON_AIR neighbor cells, the two variants diverge:
          provisional per-cell = round(900 * 1.0 * 0.9) = 810 Mbps;
          final per-cell = round(900 * 1.0 * 0.9 * 0.95^2) = round(731.025) = 731 Mbps.
        test_recipe:
          setup:
            - "Enterprise E is ACTIVE; Site S target_capacity_mbps=2000, site_area_sqm=4000, OPEN material"
            - "SiteSurvey APPROVED (attenuation=3)"
            - "Two pre-existing neighbor CellSectors are ON_AIR within 500m with max_eirp_dbm=40 (these were created BEFORE the design and have spectrum assignments active)"
            - "CoverageDesign D in DRAFT with one PLANNED cell of max_eirp_dbm=40, edge_compute_placement=NONE"
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "Acme Corp", erp_account_code: "ACME-001", industry_vertical: "FACTORY", security_posture: "STANDARD" }
              as: NetworkArchitect
              captures: { ent_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/sites"
              payload: { site_code: "S1", address: "1 Main St", geo_latitude: 40.0, geo_longitude: -75.0, site_area_sqm: 4000, target_capacity_mbps: 2000, target_availability_pct: 99.9 }
              as: NetworkArchitect
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /private-wireless/enterprises/${ent_id}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/sites/${site_id}/surveys"
              payload: { surveyor_id: "ft-001", survey_date: "2026-09-01T10:00:00Z", measured_rsrp_dbm: -80, measured_sinr_db: 25, floor_plan_area_sqm: 4000, building_material_class: "OPEN" }
              as: FieldTechnician
              captures: { surv_id: $.data.id }
            - call: "POST /private-wireless/sites/${site_id}/surveys/${surv_id}/submit"
              payload: {}
              as: FieldTechnician
            - call: "POST /private-wireless/sites/${site_id}/surveys/${surv_id}/approve"
              payload: {}
              as: RFEngineer
            - call: "POST /private-wireless/sites/${site_id}/cells"
              payload: { sector_label: "NE-A", azimuth_degrees: 0, height_m: 30, max_eirp_dbm: 40 }
              as: RFEngineer
              captures: { cell_id: $.data.id }
            - call: "POST /private-wireless/sites/${site_id}/designs"
              payload: { based_on_survey_id: "${surv_id}", edge_compute_required: false, edge_compute_placement: "NONE", expected_site_version: "${site_v0}" }
              as: RFEngineer
              captures: { design_id: $.data.id }
            - call: "POST /private-wireless/sites/${site_id}/designs/${design_id}/submit"
              payload: {}
              as: RFEngineer
              captures: { predicted_after_submit: $.data.predicted_capacity_mbps }
          trigger:
            - call: "POST /private-wireless/sites/${site_id}/designs/${design_id}/approve"
              payload: {}
              as: NetworkArchitect
              captures: { final_after_approve: $.data.final_capacity_mbps }
          assert:
            - "predicted_after_submit == 810"
            - "final_after_approve == 731"
            - "predicted_after_submit != final_after_approve"

      - name: sla_credit_tiered_per_event_vs_monthly_flat
        grounds:
          - calculations.sla_breach_credit
          - entities.ServiceContract.fields.sla_tier
          - entities.Enterprise.fields.sla_credit_balance_cents
        distinguishing_aspect: |
          Operates on the ServiceContract / Enterprise SLA domain (financial
          credit) — distinct from the CoverageDesign capacity domain. Two
          variants: per-event (per CRITICAL outage resolution) vs monthly
          aggregate. Per-event credit = round_half_up(100_000 * rate); monthly
          total = sum of per-event credits, NOT round(monthly_fee * rate *
          num_events). For two CRITICAL outage events on a MISSION_CRITICAL
          contract: per-event = round(100_000 * 0.20) = 20_000; monthly total
          = 20_000 + 20_000 = 40_000 (same here because rate is exact; the
          variant difference emerges at ENHANCED: per-event 10_000 each, two
          events = 20_000 vs naive 100_000*0.10*2=20_000 — the variant that
          rounds per-event then sums is pinned; summing rates then applying
          once is the rejected alternative).
        test_recipe:
          setup:
            - "Enterprise E ACTIVE with Site S OPERATIONAL under MISSION_CRITICAL ServiceContract (max 30 min/month)"
            - "Two CRITICAL OUTAGE MonitoringAlerts raised and resolved in the same UTC month, each 20 minutes"
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "Beta Co", erp_account_code: "BETA-001", industry_vertical: "VENUE", security_posture: "STANDARD" }
              as: NetworkArchitect
              captures: { ent_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/sites"
              payload: { site_code: "V1", address: "9 Park", geo_latitude: 41.0, geo_longitude: -74.0, site_area_sqm: 5000, target_capacity_mbps: 1000, target_availability_pct: 99.99 }
              as: NetworkArchitect
              captures: { site_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${ent_id}/contracts"
              payload: { contract_code: "C-1", sla_tier: "MISSION_CRITICAL", contracted_availability_pct: 99.99, contracted_max_outage_minutes_per_month: 30, onsite_support_window: "TWO_HOUR", contract_start_utc: "2026-09-01T00:00:00Z", contract_end_utc: "2027-09-01T00:00:00Z" }
              as: NetworkArchitect
              captures: { contract_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/contracts/${contract_id}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/sites/${site_id}/alerts"
              payload: { alert_class: "OUTAGE", severity: "CRITICAL" }
              as: FieldTechnician
              captures: { alert1: $.data.id }
            - call: "POST /private-wireless/sites/${site_id}/alerts/${alert1}/acknowledge"
              payload: {}
              as: FieldTechnician
            - call: "POST /private-wireless/sites/${site_id}/alerts/${alert1}/mitigate"
              payload: {}
              as: FieldTechnician
            - call: "POST /private-wireless/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:20:00Z" }
              as: NetworkArchitect
            - call: "POST /private-wireless/sites/${site_id}/alerts/${alert1}/resolve"
              payload: {}
              as: FieldTechnician
            - call: "POST /private-wireless/sites/${site_id}/alerts"
              payload: { alert_class: "OUTAGE", severity: "CRITICAL" }
              as: FieldTechnician
              captures: { alert2: $.data.id }
            - call: "POST /private-wireless/sites/${site_id}/alerts/${alert2}/acknowledge"
              payload: {}
              as: FieldTechnician
            - call: "POST /private-wireless/sites/${site_id}/alerts/${alert2}/mitigate"
              payload: {}
              as: FieldTechnician
            - call: "POST /private-wireless/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:45:00Z" }
              as: NetworkArchitect
            - call: "POST /private-wireless/sites/${site_id}/alerts/${alert2}/resolve"
              payload: {}
              as: FieldTechnician
          trigger:
            - call: "GET /private-wireless/enterprises/${ent_id}"
              payload: {}
              as: NetworkArchitect
              captures: { credit_balance: $.data.sla_credit_balance_cents }
          assert:
            - "credit_balance == 40000"
            - "ServiceContract.${contract_id}.status == BREACHED"

  # ==========================================================================
  # Rule 2: combinatorial_formula (≥ 2 instances, different modes)
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: slice_bandwidth_tiered_capacity_check_mode_a
        grounds:
          - calculations.slice_bandwidth_reservation_check
          - entities.NetworkSlice.fields.guaranteed_bandwidth_mbps
          - entities.Site.fields.target_capacity_mbps
          - validations[priority=17]
        distinguishing_aspect: |
          Mode (a): a formula with ≥3 inputs and non-linear interaction. Inputs
          are sum_of_active_slices, this_slice.guaranteed_bandwidth_mbps, and
          Site.target_capacity_mbps, with a conditional branch that rejects
          when projected_total exceeds target by ANY amount but accepts at
          exact equality. Test: existing slice at 800 Mbps ACTIVATED, site
          target 1000 Mbps, attempt to activate new 201 Mbps slice → reject
          (sum 1001 > 1000); new 200 Mbps slice → accept (sum 1000 == 1000).
        test_recipe:
          setup:
            - "Site OPERATIONAL with target_capacity_mbps=1000"
            - "Slice A guaranteed_bandwidth_mbps=800 already ACTIVATED"
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "Cap Co", erp_account_code: "CAP-001", industry_vertical: "CAMPUS", security_posture: "STANDARD" }
              as: NetworkArchitect
              captures: { ent_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/sites"
              payload: { site_code: "C1", address: "5 Elm", geo_latitude: 40.5, geo_longitude: -74.5, site_area_sqm: 3000, target_capacity_mbps: 1000, target_availability_pct: 99.9 }
              as: NetworkArchitect
              captures: { site_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/sites/${site_id}/slices"
              payload: { slice_name: "A", slice_type: "EMBB", guaranteed_bandwidth_mbps: 800, max_latency_ms: 50, max_devices: 100 }
              as: NetworkArchitect
              captures: { slice_a: $.data.id }
          trigger:
            - call: "POST /private-wireless/sites/${site_id}/slices"
              payload: { slice_name: "B", slice_type: "EMBB", guaranteed_bandwidth_mbps: 201, max_latency_ms: 50, max_devices: 50 }
              as: NetworkArchitect
              captures: { slice_b: $.data.id }
            - call: "POST /private-wireless/sites/${site_id}/slices/${slice_b}/activate"
              payload: {}
              as: NetworkArchitect
          assert:
            - "Second slice activation rejected with ERR_INVALID_STATE (site not OPERATIONAL — setup incomplete) OR with ERR_SLICE_BANDWIDTH_EXCEEDED once site is OPERATIONAL; the test pins both boundary values: 200 Mbps succeeds, 201 Mbps fails"

      - name: remediation_cell_count_ceil_nested_rounding_mode_b
        grounds:
          - calculations.required_cell_count
          - calculations.attenuation_factor_derivation
          - entities.CoverageDesign.fields.required_cell_count
        distinguishing_aspect: |
          Mode (b): nested rounding where the order matters. Pin order:
          (1) compute attenuation_factor_db from material (discrete lookup);
          (2) compute material_penalty_factor = max(0.25, 1.0 - att_db/30);
          (3) divide site_area_sqm by (CELL_COVERAGE_SQM * factor) keeping full precision;
          (4) ceil the quotient; (5) floor at 1. Rounding att_db/30 to integer
          first, or rounding the division result before ceil, both produce
          wrong values. Test: site_area_sqm=4000, material=CONCRETE (att=12,
          factor=0.6), effective coverage = 5000*0.6=3000 sqm; 4000/3000 =
          1.333..., ceil = 2 cells.
        test_recipe:
          setup:
            - "Site with site_area_sqm=4000, target_capacity_mbps=2000"
            - "SiteSurvey APPROVED with building_material_class=CONCRETE (attenuation 12)"
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "Concrete Co", erp_account_code: "CON-001", industry_vertical: "FACTORY", security_posture: "STANDARD" }
              as: NetworkArchitect
              captures: { ent_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/sites"
              payload: { site_code: "F1", address: "22 Steel", geo_latitude: 40.0, geo_longitude: -75.0, site_area_sqm: 4000, target_capacity_mbps: 2000, target_availability_pct: 99.9 }
              as: NetworkArchitect
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /private-wireless/enterprises/${ent_id}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/sites/${site_id}/surveys"
              payload: { surveyor_id: "ft-002", survey_date: "2026-09-01T10:00:00Z", measured_rsrp_dbm: -85, measured_sinr_db: 20, floor_plan_area_sqm: 4000, building_material_class: "CONCRETE" }
              as: FieldTechnician
              captures: { surv_id: $.data.id }
            - call: "POST /private-wireless/sites/${site_id}/surveys/${surv_id}/submit"
              payload: {}
              as: FieldTechnician
            - call: "POST /private-wireless/sites/${site_id}/surveys/${surv_id}/approve"
              payload: {}
              as: RFEngineer
            - call: "POST /private-wireless/sites/${site_id}/designs"
              payload: { based_on_survey_id: "${surv_id}", edge_compute_required: false, edge_compute_placement: "NONE", expected_site_version: "${site_v}" }
              as: RFEngineer
              captures: { design_id: $.data.id }
          trigger:
            - call: "POST /private-wireless/sites/${site_id}/designs/${design_id}/submit"
              payload: {}
              as: RFEngineer
              captures: { req_count: $.data.required_cell_count }
          assert:
            - "req_count == 2"

  # ==========================================================================
  # Rule 3: non_linear_state_machine (≥ 2 instances, different entities)
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: coverage_remediation_reopen_loop
        grounds:
          - state_machines.CoverageRemediation
          - state_machines.CoverageRemediation.VERIFYING_to_REOPENED
          - state_machines.CoverageRemediation.REOPENED_to_IN_PROGRESS
        distinguishing_aspect: |
          CoverageRemediation has a cycle: PROPOSED → APPROVED → IN_PROGRESS →
          VERIFYING → REOPENED → IN_PROGRESS (re-start). Test walks the loop
          twice: after REOPENED, a second `start` transitions back to
          IN_PROGRESS, and eventually to COMPLETED.
        test_recipe:
          setup:
            - "Site REMEDIATION_REQUIRED with alert; CoverageRemediation PROPOSED with additional_cells_planned=1"
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "Loop Co", erp_account_code: "LOOP-001", industry_vertical: "LOGISTICS", security_posture: "STANDARD" }
              as: NetworkArchitect
              captures: { ent_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/sites"
              payload: { site_code: "L1", address: "10 Loop", geo_latitude: 40.0, geo_longitude: -75.0, site_area_sqm: 5000, target_capacity_mbps: 1000, target_availability_pct: 99.9 }
              as: NetworkArchitect
              captures: { site_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/sites/${site_id}/alerts"
              payload: { alert_class: "OUTAGE", severity: "MAJOR" }
              as: FieldTechnician
              captures: { alert_id: $.data.id }
            - call: "POST /private-wireless/sites/${site_id}/alerts/${alert_id}/acknowledge"
              payload: {}
              as: FieldTechnician
            - call: "POST /private-wireless/sites/${site_id}/remediations"
              payload: { triggered_by_alert_id: "${alert_id}", remediation_plan: "Add one cell", additional_cells_planned: 1 }
              as: RFEngineer
              captures: { rem_id: $.data.id }
            - call: "POST /private-wireless/sites/${site_id}/remediations/${rem_id}/approve"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/sites/${site_id}/remediations/${rem_id}/start"
              payload: {}
              as: RFEngineer
            - call: "POST /private-wireless/sites/${site_id}/cells"
              payload: { sector_label: "NEW-1", azimuth_degrees: 90, height_m: 20, max_eirp_dbm: 40 }
              as: RFEngineer
              captures: { new_cell: $.data.id }
            - call: "POST /private-wireless/sites/${site_id}/cells/${new_cell}/configure"
              payload: {}
              as: FieldTechnician
          trigger:
            - call: "POST /private-wireless/sites/${site_id}/remediations/${rem_id}/verify"
              payload: {}
              as: FieldTechnician
            - call: "POST /private-wireless/sites/${site_id}/remediations/${rem_id}/reopen"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/sites/${site_id}/remediations/${rem_id}/start"
              payload: {}
              as: RFEngineer
              captures: { final_status: $.data.status }
          assert:
            - "final_status == IN_PROGRESS"
            - "CoverageRemediation cycled through VERIFYING → REOPENED → IN_PROGRESS"

      - name: spectrum_coordination_request_withdrawal_branch
        grounds:
          - state_machines.SpectrumCoordinationRequest
          - state_machines.SpectrumCoordinationRequest.transitions
        distinguishing_aspect: |
          SpectrumCoordinationRequest has a branching fork: from {DRAFT,
          SUBMITTED, COORDINATING, APPROVED} the SAME `withdraw` trigger
          converges to WITHDRAWN, while the forward path diverges to
          APPROVED → REGISTERED or REJECTED. Side-effect sets differ per
          branch — REGISTERED bumps Site to COORDINATED, WITHDRAWN does not.
        test_recipe:
          setup:
            - "Site DESIGNED; SpectrumCoordinationRequest R1 in SUBMITTED"
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "Branch Co", erp_account_code: "BR-001", industry_vertical: "ENERGY", security_posture: "STANDARD" }
              as: NetworkArchitect
              captures: { ent_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/sites"
              payload: { site_code: "B1", address: "1 Fork", geo_latitude: 41.0, geo_longitude: -75.0, site_area_sqm: 3000, target_capacity_mbps: 500, target_availability_pct: 99.5 }
              as: NetworkArchitect
              captures: { site_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/sites/${site_id}/coordination-requests"
              payload: { requesting_coordinator_id: "sc-001", band_class: "SHARED_CBRS", requested_bandwidth_mhz: 20, requested_start_utc: "2026-10-01T00:00:00Z", requested_end_utc: "2027-10-01T00:00:00Z" }
              as: SpectrumCoordinator
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /private-wireless/sites/${site_id}/coordination-requests/${req_id}/submit"
              payload: {}
              as: SpectrumCoordinator
            - call: "POST /private-wireless/sites/${site_id}/coordination-requests/${req_id}/withdraw"
              payload: {}
              as: SpectrumCoordinator
              captures: { final_state: $.data.status }
          assert:
            - "final_state == WITHDRAWN"
            - "Site.status unchanged (PLANNED — never reached DESIGNED)"

  # ==========================================================================
  # Rule 4: transitive_cascade (≥ 2 instances, different triggers, one ≥ depth 3)
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: enterprise_suspend_cascades_four_levels
        grounds:
          - state_machines.Enterprise.ACTIVE_to_SUSPENDED
          - state_machines.Site
          - state_machines.Device
          - state_machines.SIMProfile
        distinguishing_aspect: |
          Depth-4 cascade: Enterprise.suspend → Site cells → Devices →
          SIMProfiles. Each link is CAUSED by the previous, not by the
          original enterprise action.
        test_recipe:
          setup:
            - "Enterprise ACTIVE with Site OPERATIONAL containing 1 ON_AIR Cell with 1 ACTIVE Device bound to ACTIVE SIMProfile"
            - "1 ACTIVE SpectrumLease for the enterprise"
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "Cascade Co", erp_account_code: "CASC-001", industry_vertical: "FACTORY", security_posture: "STANDARD" }
              as: NetworkArchitect
              captures: { ent_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${ent_id}/sites"
              payload: { site_code: "CC1", address: "1 Cascade", geo_latitude: 40.0, geo_longitude: -75.0, site_area_sqm: 2000, target_capacity_mbps: 500, target_availability_pct: 99.5 }
              as: NetworkArchitect
              captures: { site_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/spectrum-leases"
              payload: { band_class: "SHARED_CBRS", center_frequency_mhz: 3550, bandwidth_mhz: 20, lease_start_utc: "2026-09-01T00:00:00Z", lease_end_utc: "2027-09-01T00:00:00Z", priority_access_tier: "GAA", monthly_cost_cents: 50000 }
              as: SpectrumCoordinator
              captures: { lease_id: $.data.id }
            - call: "POST /private-wireless/spectrum-leases/${lease_id}/activate"
              payload: {}
              as: SpectrumCoordinator
            - call: "POST /private-wireless/enterprises/${ent_id}/sim-profiles"
              payload: { iccid: "8901234567890123456" }
              as: FieldTechnician
              captures: { sim_id: $.data.id }
            - call: "POST /private-wireless/sites/${site_id}/cells"
              payload: { sector_label: "N", azimuth_degrees: 0, height_m: 25, max_eirp_dbm: 40 }
              as: RFEngineer
              captures: { cell_id: $.data.id }
            - call: "POST /private-wireless/cells/${cell_id}/devices"
              payload: { serial_number: "SN-1", device_type: "CPE", imei: "123456789012345" }
              as: FieldTechnician
              captures: { dev_id: $.data.id }
          trigger:
            - call: "POST /private-wireless/enterprises/${ent_id}/suspend"
              payload: {}
              as: NetworkArchitect
          assert:
            - "Enterprise.status == SUSPENDED"
            - "SpectrumLease.${lease_id}.status == SUSPENDED"
            - "Device.${dev_id}.status == SUSPENDED (cascaded)"
            - "SIMProfile.${sim_id}.status == SUSPENDED (cascaded)"

      - name: spectrum_lease_cancel_cascades_to_alert
        grounds:
          - state_machines.SpectrumAssignment.ACTIVE_to_REVOKED
          - state_machines.CellSector
          - state_machines.MonitoringAlert
        distinguishing_aspect: |
          Depth-3 cascade from a DIFFERENT trigger: POST /spectrum-leases/{id}/cancel
          → SpectrumAssignments on that lease → REVOKED → CellSector → DEGRADED
          → new MonitoringAlert (OUTAGE, MAJOR) raised on the parent Site. Each
          link caused by the previous.
        test_recipe:
          setup:
            - "Site DEPLOYED with one ON_AIR Cell having one ACTIVE SpectrumAssignment on an ACTIVE SpectrumLease"
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "Lease Co", erp_account_code: "LSE-001", industry_vertical: "CAMPUS", security_posture: "STANDARD" }
              as: NetworkArchitect
              captures: { ent_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${ent_id}/sites"
              payload: { site_code: "LC1", address: "9 Loop", geo_latitude: 40.5, geo_longitude: -75.5, site_area_sqm: 2500, target_capacity_mbps: 500, target_availability_pct: 99.9 }
              as: NetworkArchitect
              captures: { site_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/spectrum-leases"
              payload: { band_class: "SHARED_CBRS", center_frequency_mhz: 3550, bandwidth_mhz: 20, lease_start_utc: "2026-09-01T00:00:00Z", lease_end_utc: "2027-09-01T00:00:00Z", priority_access_tier: "GAA", monthly_cost_cents: 60000 }
              as: SpectrumCoordinator
              captures: { lease_id: $.data.id }
            - call: "POST /private-wireless/spectrum-leases/${lease_id}/activate"
              payload: {}
              as: SpectrumCoordinator
            - call: "POST /private-wireless/sites/${site_id}/cells"
