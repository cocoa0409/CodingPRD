# =============================================================================
# Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — §1.9
# Corporate Card & Spend Management
# Breadth probe across the claim-extraction-guide sections. Every test_recipe
# uses the same structured form & §1.5 reachability gates as §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_company_returns_201_with_defaults_and_cascades
        claim_type: Creation
        grounds:
          - entities.Company
          - endpoints
        distinguishing_aspect: "POST /companies with required fields returns 201; currency defaults to USD, status=ACTIVE, available_credit_cents == credit_limit_cents; a RewardAccount and a cycle-1 OPEN Statement are auto-created."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Boot Co", credit_limit_cents: 500000, billing_model: "CREDIT" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
          trigger:
            - call: "GET /companies/${co}"
              payload: {}
              as: FinanceAdmin
              captures: { cur: "$.data.currency", st: "$.data.status", ac: "$.data.available_credit_cents" }
            - call: "GET /reward-accounts"
              payload: { company_id: "${co}" }
              as: FinanceAdmin
              captures: { ra: "$.data[0].id" }
            - call: "GET /statements"
              payload: { company_id: "${co}" }
              as: FinanceAdmin
              captures: { stmt1: "$.data[0].id", ci: "$.data[0].cycle_index", sst: "$.data[0].status" }
          assert:
            - "Company.${co}.currency == USD"
            - "Company.${co}.status == ACTIVE"
            - "Company.${co}.available_credit_cents == 500000"
            - "Statement.${stmt1}.cycle_index == 1"
            - "Statement.${stmt1}.status == OPEN"

      - name: create_company_missing_billing_model_returns_validation
        claim_type: Required Fields
        grounds:
          - entities.Company.fields.billing_model
          - validations[priority=4]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /companies without billing_model is rejected with ERR_VALIDATION (422); billing_model has source:input and no default."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /companies"
              payload: { legal_name: "No Model", credit_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "data.error_id == ERR_VALIDATION"

      - name: get_card_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Card
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /cards/{id} with a random UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /cards/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FinanceAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: system_fields_ignored_on_create_company
        claim_type: System Fields
        grounds:
          - entities.Company.fields.status
          - entities.Company.fields.available_credit_cents
        distinguishing_aspect: "Client-supplied status/available_credit_cents/version on POST /companies are ignored; server mints status=ACTIVE, available_credit_cents=credit_limit_cents, version=1."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /companies"
              payload: { legal_name: "Sys Co", credit_limit_cents: 700000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { st: "$.data.status", ac: "$.data.available_credit_cents", v: "$.data.version" }
          assert:
            - "Company.status == ACTIVE"
            - "Company.available_credit_cents == 700000"
            - "Company.version == 1"

      - name: duplicate_employee_email_among_active_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Employee.fields.email
          - errors[ERR_DUPLICATE_EMAIL]
        distinguishing_aspect: "A second ACTIVE employee with the same email in the same company is rejected with ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup:
            - "CHARGE company with one ACTIVE employee email dup@acme.com."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Dup Co", credit_limit_cents: 500000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "dup@acme.com", full_name: "First", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { e1: "$.data.id" }
          trigger:
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "dup@acme.com", full_name: "Second", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_DUPLICATE_EMAIL"

      - name: receipt_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Receipt
        distinguishing_aspect: "Receipt has common_fields:false — its GET response exposes id and created_at but no version/updated_at; there is no update endpoint."
        test_recipe:
          setup:
            - "CHARGE company; card; tx 10000 (NEEDS_RECEIPT); one receipt uploaded."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Imm Co", credit_limit_cents: 1000000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "h16@acme.com", full_name: "H", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_h: "$.data.id" }
            - call: "POST /spend-policies"
              payload: { company_id: "${co}", name: "Std", per_transaction_limit_cents: 500000, approval_threshold_cents: 1000000 }
              as: FinanceAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /cards"
              payload: { company_id: "${co}", employee_id: "${emp_h}", spend_policy_id: "${pol}", form_factor: "VIRTUAL", card_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { card: "$.data.id" }
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "M", mcc_code: "5999", amount_cents: 10000 }
              as: CardholderEmployee
              as_user_id: "${emp_h}"
              captures: { tx: "$.data.id" }
            - call: "POST /transactions/${tx}/receipts"
              payload: { amount_cents: 10000, merchant_name: "M" }
              as: CardholderEmployee
              as_user_id: "${emp_h}"
              captures: { rcpt: "$.data.id" }
          trigger:
            - call: "GET /receipts/${rcpt}"
              payload: {}
              as: FinanceAdmin
              captures: { mr: "$.data.match_result" }
          assert:
            - "Receipt.${rcpt}.match_result == MATCH"
            - "Receipt response has no `version` field"

      - name: list_companies_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.Company
        distinguishing_aspect: "GET /companies returns response_type=array with pagination fields total_count and has_more in meta/data per §1.0."
        test_recipe:
          setup:
            - "Two companies exist."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "L1", credit_limit_cents: 100000, billing_model: "CHARGE" }
              as: FinanceAdmin
            - call: "POST /companies"
              payload: { legal_name: "L2", credit_limit_cents: 100000, billing_model: "CHARGE" }
              as: FinanceAdmin
          trigger:
            - call: "GET /companies"
              payload: {}
              as: FinanceAdmin
          assert:
            - "response_type == array"
            - "data total_count >= 2"
            - "has_more is present and boolean"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: clear_already_cleared_transaction_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Transaction.auth_status=PENDING_to_auth_status=CLEARED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Clearing a transaction already in auth_status=CLEARED returns ERR_INVALID_STATE (409); idempotent re-clear is rejected."
        test_recipe:
          setup:
            - "CHARGE company; card; one PENDING tx then CLEARED."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Inv Co", credit_limit_cents: 1000000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "h17@acme.com", full_name: "H", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_h: "$.data.id" }
            - call: "POST /spend-policies"
              payload: { company_id: "${co}", name: "Std", per_transaction_limit_cents: 500000, approval_threshold_cents: 1000000 }
              as: FinanceAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /cards"
              payload: { company_id: "${co}", employee_id: "${emp_h}", spend_policy_id: "${pol}", form_factor: "VIRTUAL", card_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { card: "$.data.id" }
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "M", mcc_code: "5999", amount_cents: 5000 }
              as: FinanceAdmin
              captures: { tx: "$.data.id" }
            - call: "POST /transactions/${tx}/clear"
              payload: {}
              as: FinanceAdmin
          trigger:
            - call: "POST /transactions/${tx}/clear"
              payload: {}
              as: FinanceAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: activate_virtual_card_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Card.REQUESTED_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Activating a VIRTUAL card (already ACTIVE, not REQUESTED) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "CHARGE company; one VIRTUAL card (already ACTIVE)."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Vc Co", credit_limit_cents: 1000000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "h18@acme.com", full_name: "H", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_h: "$.data.id" }
            - call: "POST /spend-policies"
              payload: { company_id: "${co}", name: "Std", per_transaction_limit_cents: 500000, approval_threshold_cents: 1000000 }
              as: FinanceAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /cards"
              payload: { company_id: "${co}", employee_id: "${emp_h}", spend_policy_id: "${pol}", form_factor: "VIRTUAL", card_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { card: "$.data.id" }
          trigger:
            - call: "POST /cards/${card}/activate"
              payload: {}
              as: FinanceAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: terminate_card_with_pending_auth_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Card.ACTIVE_to_TERMINATED
          - errors[ERR_CARD_HAS_OPEN_AUTH]
        distinguishing_aspect: "Terminating an ACTIVE card that has a transaction with auth_status==PENDING returns ERR_CARD_HAS_OPEN_AUTH (409)."
        test_recipe:
          setup:
            - "CHARGE company; ACTIVE card with one PENDING transaction."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Term Co", credit_limit_cents: 1000000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "h19@acme.com", full_name: "H", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_h: "$.data.id" }
            - call: "POST /spend-policies"
              payload: { company_id: "${co}", name: "Std", per_transaction_limit_cents: 500000, approval_threshold_cents: 1000000 }
              as: FinanceAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /cards"
              payload: { company_id: "${co}", employee_id: "${emp_h}", spend_policy_id: "${pol}", form_factor: "VIRTUAL", card_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { card: "$.data.id" }
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "M", mcc_code: "5999", amount_cents: 5000 }
              as: FinanceAdmin
              captures: { tx: "$.data.id" }
          trigger:
            - call: "POST /cards/${card}/terminate"
              payload: {}
              as: FinanceAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_CARD_HAS_OPEN_AUTH"

      - name: statement_close_without_clock_returns_clock_not_set
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Statement.OPEN_to_CLOSED
          - errors[ERR_CLOCK_NOT_SET]
          - validations[priority=18]
        distinguishing_aspect: "Closing the OPEN statement before Company.clock_utc is set returns ERR_CLOCK_NOT_SET (409)."
        test_recipe:
          setup:
            - "CHARGE company, clock never set; the cycle-1 OPEN statement."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Clk Co", credit_limit_cents: 1000000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "GET /statements"
              payload: { company_id: "${co}" }
              as: FinanceAdmin
              captures: { stmt1: "$.data[0].id" }
          trigger:
            - call: "POST /statements/${stmt1}/close"
              payload: {}
              as: FinanceAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_CLOCK_NOT_SET"

      - name: settle_without_clear_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Transaction.auth_status=CLEARED_to_auth_status=SETTLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Settling a PENDING (not CLEARED) transaction returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "CHARGE company; one PENDING tx (never cleared)."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Stl Co", credit_limit_cents: 1000000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "h20@acme.com", full_name: "H", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_h: "$.data.id" }
            - call: "POST /spend-policies"
              payload: { company_id: "${co}", name: "Std", per_transaction_limit_cents: 500000, approval_threshold_cents: 1000000 }
              as: FinanceAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /cards"
              payload: { company_id: "${co}", employee_id: "${emp_h}", spend_policy_id: "${pol}", form_factor: "VIRTUAL", card_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { card: "$.data.id" }
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "M", mcc_code: "5999", amount_cents: 5000 }
              as: FinanceAdmin
              captures: { tx: "$.data.id" }
          trigger:
            - call: "POST /transactions/${tx}/settle"
              payload: { settled_amount_cents: 5000 }
              as: FinanceAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: erp_batch_post_twice_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ErpSyncBatch.BUILT_to_POSTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Posting an already-POSTED ErpSyncBatch (terminal) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "CHARGE company; settled+GL-coded tx; statement closed; ERP batch BUILT then POSTED."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Erp Co", credit_limit_cents: 1000000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "GET /statements"
              payload: { company_id: "${co}" }
              as: FinanceAdmin
              captures: { stmt1: "$.data[0].id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "h21@acme.com", full_name: "H", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_h: "$.data.id" }
            - call: "POST /gl-accounts"
              payload: { company_id: "${co}", gl_code: "7000", name: "Ops" }
              as: FinanceAdmin
              captures: { gl: "$.data.id" }
            - call: "POST /spend-policies"
              payload: { company_id: "${co}", name: "Std", per_transaction_limit_cents: 500000, approval_threshold_cents: 1000000 }
              as: FinanceAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /cards"
              payload: { company_id: "${co}", employee_id: "${emp_h}", spend_policy_id: "${pol}", form_factor: "VIRTUAL", card_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { card: "$.data.id" }
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "M", mcc_code: "5999", amount_cents: 5000, gl_account_id: "${gl}" }
              as: FinanceAdmin
              captures: { tx: "$.data.id" }
            - call: "POST /transactions/${tx}/clear"
              payload: {}
              as: FinanceAdmin
            - call: "POST /transactions/${tx}/settle"
              payload: { settled_amount_cents: 5000 }
              as: FinanceAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { company_id: "${co}", to_iso8601: "2026-06-30T00:00:00Z" }
              as: FinanceAdmin
            - call: "POST /statements/${stmt1}/close"
              payload: {}
              as: FinanceAdmin
            - call: "POST /erp-sync-batches"
              payload: { company_id: "${co}", statement_id: "${stmt1}" }
              as: FinanceAdmin
              captures: { batch: "$.data.id" }
            - call: "POST /erp-sync-batches/${batch}/post"
              payload: {}
              as: FinanceAdmin
          trigger:
            - call: "POST /erp-sync-batches/${batch}/post"
              payload: {}
              as: FinanceAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: erp_batch_entry_count_and_debits_computed
        claim_type: Side Effect Execution
        grounds:
          - entities.ErpSyncBatch.fields.entry_count
          - entities.ErpSyncBatch.fields.total_debits_cents
          - state_machines.ErpSyncBatch
        distinguishing_aspect: "Building an ERP batch captures entry_count and total_debits_cents from SETTLED, GL-coded transactions on the statement: one tx settled 5000 with GL gives entry_count=1, total_debits_cents=5000."
        test_recipe:
          setup:
            - "CHARGE company; one settled+GL-coded tx (5000); statement CLOSED."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Erp2 Co", credit_limit_cents: 1000000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "GET /statements"
              payload: { company_id: "${co}" }
              as: FinanceAdmin
              captures: { stmt1: "$.data[0].id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "h22@acme.com", full_name: "H", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_h: "$.data.id" }
            - call: "POST /gl-accounts"
              payload: { company_id: "${co}", gl_code: "7100", name: "Ops" }
              as: FinanceAdmin
              captures: { gl: "$.data.id" }
            - call: "POST /spend-policies"
              payload: { company_id: "${co}", name: "Std", per_transaction_limit_cents: 500000, approval_threshold_cents: 1000000 }
              as: FinanceAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /cards"
              payload: { company_id: "${co}", employee_id: "${emp_h}", spend_policy_id: "${pol}", form_factor: "VIRTUAL", card_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { card: "$.data.id" }
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "M", mcc_code: "5999", amount_cents: 5000, gl_account_id: "${gl}" }
              as: FinanceAdmin
              captures: { tx: "$.data.id" }
            - call: "POST /transactions/${tx}/clear"
              payload: {}
              as: FinanceAdmin
            - call: "POST /transactions/${tx}/settle"
              payload: { settled_amount_cents: 5000 }
              as: FinanceAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { company_id: "${co}", to_iso8601: "2026-06-30T00:00:00Z" }
              as: FinanceAdmin
            - call: "POST /statements/${stmt1}/close"
              payload: {}
              as: FinanceAdmin
          trigger:
            - call: "POST /erp-sync-batches"
              payload: { company_id: "${co}", statement_id: "${stmt1}" }
              as: FinanceAdmin
              captures: { ec: "$.data.entry_count", td: "$.data.total_debits_cents" }
          assert:
            - "ErpSyncBatch.entry_count == 1"
            - "ErpSyncBatch.total_debits_cents == 5000"

      - name: reimbursement_reject_revise_returns_to_draft
        claim_type: cyclic
        grounds:
          - state_machines.ReimbursementClaim.SUBMITTED_to_REJECTED
          - state_machines.ReimbursementClaim.REJECTED_to_DRAFT
        distinguishing_aspect: "A SUBMITTED claim rejected by an approver then revised by the claimant returns to status=DRAFT (revision cycle)."
        test_recipe:
          setup:
            - "CHARGE company; claimant + approver; GL account; a SUBMITTED claim then REJECTED."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Reim Co", credit_limit_cents: 1000000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "cl@acme.com", full_name: "CL", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_c: "$.data.id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "ap4@acme.com", full_name: "AP", employee_role: "APPROVER" }
              as: FinanceAdmin
              captures: { emp_a: "$.data.id" }
            - call: "POST /gl-accounts"
              payload: { company_id: "${co}", gl_code: "8000", name: "Travel" }
              as: FinanceAdmin
              captures: { gl: "$.data.id" }
            - call: "POST /reimbursement-claims"
              payload: { company_id: "${co}", employee_id: "${emp_c}", gl_account_id: "${gl}", merchant_name: "Taxi", amount_cents: 9000, receipt_amount_cents: 9000 }
              as: CardholderEmployee
              as_user_id: "${emp_c}"
              captures: { claim: "$.data.id" }
            - call: "POST /reimbursement-claims/${claim}/submit"
              payload: {}
              as: CardholderEmployee
              as_user_id: "${emp_c}"
            - call: "POST /reimbursement-claims/${claim}/reject"
              payload: { decision_note: "missing detail" }
              as: Approver
              as_user_id: "${emp_a}"
          trigger:
