            - "trigger call 8 (clock 2028-08-02, one day past term_end_date, agreement row still EXECUTED) → 422 with error_id ERR_AGENCY_AGREEMENT_NOT_IN_FORCE and no contract created"
            - "trigger call 10 (clock back inside the term at 2026-09-01) → 201 with PreSaleContract.${contract_id}.negotiation_status == OFFERED"

      - name: facility_approval_reads_live_contract_and_buyer_state_not_its_own_stored_collateral
        grounds:
          - validations[priority=74]
          - state_machines.BankingFacility.PROPOSED_to_APPROVED
          - entities.BankingFacility.fields.eligible_collateral_usd
          - entities.Buyer.fields.credit_rating
          - entities.PreSaleContract.fields.negotiation_status
          - errors.ERR_NO_ELIGIBLE_COLLATERAL
        distinguishing_aspect: |
          A different gating pair from the agreement instance: the approval of a BankingFacility
          depends on the live state of TWO other entities — the contract must be EXECUTED and its
          buyer must be investment grade and ACTIVE. The sharp part is facility 2, whose own stored
          eligible_collateral_usd is a positive 959671.20 when it is refused, because the buyer was
          downgraded to BBB while the facility sat in PROPOSED and PROPOSED facilities are not
          recomputed by the buyer patch. Reading the facility's own cached field instead of the
          buyer's live rating passes that probe and is the falsifier. Restoring the rating to AAA
          then lets the identical call through.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; contract MG 2000000.00 only ACCEPTED, not yet EXECUTED."
