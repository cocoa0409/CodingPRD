  # From Table 6 (Errors) — triggerability not covered elsewhere
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: attach_order_grade_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ORDER_GRADE_MISMATCH]
          - validations[priority=6]
        distinguishing_aspect: "An ACCEPTED order on grade 32C cannot attach to a run built on grade 44BC: ERR_ORDER_GRADE_MISMATCH (422) and the order stays ACCEPTED."
        test_recipe:
          setup: ["Grades 32C and 44BC; ORD-1 (32C) ACCEPTED; run on 44BC"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_32: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "44BC", liner_combo: "42/26/42/26/42", flute: "BC", ect_rating_lbs_per_in: 44, burst_rating_psi: 275, basis_weight_lbs_per_msf: 120.0 }, as: PlantAdmin, captures: { grade_44: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_32}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 100, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30, ink_colors: [] }, as: SalesRep, captures: { ord_id: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 50.00, expires_on: "2026-12-31", expected_order_version: "${ord_v}" }, as: SalesRep, captures: { quo_id: $.data.id } }
            - { call: "POST /api/price-quotes/${quo_id}/accept", payload: {}, as: SalesRep }
            - { call: "POST /api/work-shifts", payload: { machine_code: "CORRUGATOR", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_corr: $.data.id } }
            - { call: "POST /api/corrugator-runs", payload: { work_shift_id: "${sh_corr}", board_grade_id: "${grade_44}", start_minute: 480, end_minute: 720, web_width_in: 87.0 }, as: ProductionPlanner, captures: { run_id: $.data.id } }
          trigger:
            - { call: "POST /api/corrugator-runs/${run_id}/orders", payload: { box_order_id: "${ord_id}", outs: 1 }, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ORDER_GRADE_MISMATCH, HTTP 422"
            - "Order stays ACCEPTED with corrugator_run_id null; run consumed_width_in stays 0"

      - name: error_catalog_coverage_crosscheck
        claim_type: violation_to_error
        grounds:
          - errors
        excluded_because:
          difficulty_instance: freight_tier_boundary_at_exactly_150_miles
          rationale: "All 28 catalog errors are triggered across §1.8 and the other §1.9 instances (auth/not-found/state/occ/program/quote/expiry/ECT/warp/supplier/source/dup/machine/grade-match/trim/overrun/sod/discontinued/window/overlap/changeover/credit/balance); no orphan error codes remain to exercise here."

  # ---------------------------------------------------------------------------
  # From Table 7 (RBAC)
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: planner_cannot_create_box_order_forbidden
        claim_type: violation_to_error
        grounds:
          - roles.ProductionPlanner
          - roles.SalesRep
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Peer-role isolation: POST /api/box-orders is SalesRep-exclusive; ProductionPlanner gets 403 ERR_FORBIDDEN at priority 2, before existence checks on its FKs."
        test_recipe:
          setup: ["empty DB (role check fires before FK existence)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/box-orders", payload: { customer_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", board_grade_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 100, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30 }, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN, HTTP 403 (not ERR_NOT_FOUND — authorization precedes existence)"

      - name: salesrep_cannot_approve_release_forbidden
        claim_type: violation_to_error
        grounds:
          - roles.SalesRep
          - roles.PlantAdmin
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Release approval is PlantAdmin-exclusive (governance): SalesRep gets 403 ERR_FORBIDDEN even on an existing PENDING release."
        test_recipe:
          setup: ["Program stocked to 100 with a PENDING release of 10"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/inventory-programs", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", program_name: "Acme RSC program", routing_type: "SLOTTED", blank_width_in: 24.0, blank_length_in: 20.0, reorder_point: 10, replenishment_qty: 500 }, as: SalesRep, captures: { prog_id: $.data.id } }
            - { call: "POST /api/inventory-programs/${prog_id}/receipts", payload: { qty: 100 }, as: ProductionPlanner }
            - { call: "POST /api/inventory-programs/${prog_id}/release-orders", payload: { qty: 10, requested_ship_date: "2026-08-12" }, as: Customer, as_user_id: "${cust_id}", captures: { rel_id: $.data.id } }
          trigger:
            - { call: "POST /api/release-orders/${rel_id}/approve", payload: {}, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN, HTTP 403; release stays PENDING"

      - name: adjuster_cannot_file_claim_forbidden
        claim_type: violation_to_error
        grounds:
          - roles.ClaimsAdjuster
          - roles.CustomerService
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Claim intake is CustomerService-exclusive: ClaimsAdjuster gets 403 ERR_FORBIDDEN — the role split that segregation of duties builds on."
        test_recipe:
          setup: ["empty DB (role check precedes existence)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/quality-claims", payload: { box_order_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", claim_type: "TRANSIT_DAMAGE", defective_qty_claimed: 10 }, as: ClaimsAdjuster, as_user_id: "adj-200", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN, HTTP 403"

      - name: customer_cannot_release_other_customers_program
        claim_type: violation_to_error
        grounds:
          - roles.Customer
          - errors[ERR_OWNERSHIP_MISMATCH]
          - validations[priority=2]
        distinguishing_aspect: "entity_backed identity: Customer role's X-User-ID must equal the program's customer_id; customer B acting on customer A's program fails 403 ERR_OWNERSHIP_MISMATCH."
        test_recipe:
          setup: ["Programs exist for customer A (stocked 100); customer B also exists"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_a: $.data.id } }
            - { call: "POST /api/customer-accounts", payload: { account_name: "Beacon Retail", ship_to_city: "Reno", distance_miles_from_plant: 500.0, credit_limit_dollars: 100000.00 }, as: SalesRep, captures: { cust_b: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/inventory-programs", payload: { customer_id: "${cust_a}", board_grade_id: "${grade_id}", program_name: "Acme RSC program", routing_type: "SLOTTED", blank_width_in: 24.0, blank_length_in: 20.0, reorder_point: 10, replenishment_qty: 500 }, as: SalesRep, captures: { prog_id: $.data.id } }
            - { call: "POST /api/inventory-programs/${prog_id}/receipts", payload: { qty: 100 }, as: ProductionPlanner }
          trigger:
            - { call: "POST /api/inventory-programs/${prog_id}/release-orders", payload: { qty: 10, requested_ship_date: "2026-08-12" }, as: Customer, as_user_id: "${cust_b}", captures: { err: $.data.error_id } }
            - { call: "POST /api/inventory-programs/${prog_id}/release-orders", payload: { qty: 10, requested_ship_date: "2026-08-12" }, as: Customer, as_user_id: "${cust_a}", captures: { rel_id: $.data.id } }
          assert:
            - "Customer B on A's program: err == ERR_OWNERSHIP_MISMATCH, HTTP 403"
            - "Customer A (owner) succeeds: ReleaseOrder.${rel_id}.status == PENDING"

  # ---------------------------------------------------------------------------
  # From Cross-Cutting Complexity Layers
  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_on_quote_create_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[quote-create-stale-order]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on BoxOrder.version: a quote create carrying the pre-first-quote version (1) after a successful create bumped the order to 2 fails 412 ERR_STALE_VERSION; re-reading and retrying with the current version succeeds and supersedes the first quote."
        test_recipe:
          setup: ["ORD-1 created (version 1); Q1 created with expected_order_version 1 (order now version 2, Q1 OPEN)"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 100, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30, ink_colors: [] }, as: SalesRep, captures: { ord_id: $.data.id, ord_v1: $.data.version } }
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 50.00, expires_on: "2026-12-31", expected_order_version: "${ord_v1}" }, as: SalesRep, captures: { quo_1: $.data.id } }
          trigger:
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 55.00, expires_on: "2026-12-31", expected_order_version: "${ord_v1}" }, as: SalesRep, captures: { err: $.data.error_id } }
            - { call: "GET /api/box-orders/${ord_id}", as: SalesRep, captures: { ord_v2: $.data.version } }
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 55.00, expires_on: "2026-12-31", expected_order_version: "${ord_v2}" }, as: SalesRep, captures: { quo_2: $.data.id } }
          assert:
            - "Stale create (expected 1, actual 2): err == ERR_STALE_VERSION, HTTP 412; no third quote persisted"
            - "Order version after the successful first create == 2"
            - "Retry with the current version succeeds: Q2 OPEN at 55.00 and Q1 SUPERSEDED (via GET /api/box-orders/${ord_id}/quotes)"

      - name: cascading_side_effects_depth_chains
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: release_ship_to_replenishment_order_three_link_cascade
          rationale: "N-level cascade chains (depth 3 ship->program->replenishment, depth 2 shift->run->order) are asserted end-to-end in §1.8."

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: order_pricing_provisional_quote_vs_final_invoice
          rationale: "Both variants and the reconciliation delta are asserted in §1.8 for pricing and claim credit."

  # ---------------------------------------------------------------------------
  # From Consistency Model (immediate)
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: reads in the same logical instant observe the write — after quote creation, GET /api/box-orders/{id} already shows QUOTED with version 2, and GET /api/work-shifts/{id} shows the just-scheduled run's minutes."
        test_recipe:
          setup: ["Customer Acme, grade 32C; ORD-1 DRAFT; CORRUGATOR shift [480,960) with RUN-1 [480,720)"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 100, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30, ink_colors: [] }, as: SalesRep, captures: { ord_id: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/work-shifts", payload: { machine_code: "CORRUGATOR", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_corr: $.data.id } }
          trigger:
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 50.00, expires_on: "2026-12-31", expected_order_version: "${ord_v}" }, as: SalesRep }
            - { call: "GET /api/box-orders/${ord_id}", as: SalesRep, captures: { ord_st: $.data.status, ord_v2: $.data.version } }
            - { call: "POST /api/corrugator-runs", payload: { work_shift_id: "${sh_corr}", board_grade_id: "${grade_id}", start_minute: 480, end_minute: 720, web_width_in: 87.0 }, as: ProductionPlanner }
            - { call: "GET /api/work-shifts/${sh_corr}", as: ProductionPlanner, captures: { sh_sched: $.data.scheduled_minutes, sh_avail: $.data.available_minutes } }
          assert:
            - "GET order immediately after quote create: status == QUOTED, version == 2"
            - "GET shift immediately after run create: scheduled_minutes == 240, available_minutes == 240"
