          setup:
            - "Logical clock at 2026-10-08T00:00:00Z. R1 policy with cluster_watchlist_threshold 2, cluster_purge_threshold 2400 and rollup_window_days 30."
            - "One OPEN cluster dc-alpha carrying two ACTIVE driver members a1 and a2 through LINKED device links."
            - "a1 already holds a DECIDED S4 PHYSICAL_ASSAULT incident decided earlier at 2026-10-01T00:00:00Z, so clustered_actor_incident_count is 1 and the cluster sits at OPEN."
            - "a2's incident is held, fully evidenced and pending decision."
