            - call: "POST /orders/${order_id}/sessions"
              payload: { coach_id: "${coach1}", session_type: "COACHING", scheduled_start: "2026-04-01T10:00:00Z", scheduled_end: "2026-04-01T11:00:00Z", expected_order_version: "${v0}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { sess_a: $.data.id }
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CareerAdmin
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/sessions"
              payload: { coach_id: "${coach2}", session_type: "COACHING", scheduled_start: "2026-04-01T10:30:00Z", scheduled_end: "2026-04-01T11:30:00Z", expected_order_version: "${v1}" }
              as: Client
              as_user_id: "${client_id}"
