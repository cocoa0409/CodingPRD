              payload: { vendor_code: "V-2020", legal_name: "Bubbleup Brands", payment_terms_days: 30 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { v_id: $.data.id }
            - call: "POST /compliance/purchase-orders"
              payload: { vendor_id: "${v_id}", po_number: "PO-1", ordered_units: 1000, unit_cost_cents: 500, ship_window_start: "2026-08-06T00:00:00Z", ship_window_end: "2026-08-09T00:00:00Z", must_arrive_by: "2026-08-12T00:00:00Z" }
