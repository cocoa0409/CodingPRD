            - call: "POST /plans-of-services"
              payload: { annexation_case_id: "${case_ef}" }
              as: MunicipalPlanner
              as_user_id: "${muni_ef}"
              captures: { plan_ef: $.data.id, plan_ef_v0: $.data.version }
            - call: "POST /service-commitments"
              payload: { plan_of_services_id: "${plan_ef}", service_provider_id: "${prov_saf}", service_type: "POLICE", window_start_date: "2026-08-01", window_end_date: "2026-09-15", cost_cents: 500000, committed_account_count: 0, expected_plan_of_services_version: "${plan_ef_v0}" }
              as: MunicipalPlanner
              as_user_id: "${muni_ef}"
              captures: { cm_ef_pol: $.data.id }
            - call: "POST /service-commitments/${cm_ef_pol}/activate"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_ef}"
            - call: "GET /plans-of-services/${plan_ef}"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_ef}"
              captures: { plan_ef_v1: $.data.version }
            - call: "POST /service-commitments"
              payload: { plan_of_services_id: "${plan_ef}", service_provider_id: "${prov_saf}", service_type: "FIRE", window_start_date: "2026-08-01", window_end_date: "2026-09-15", cost_cents: 400000, committed_account_count: 0, expected_plan_of_services_version: "${plan_ef_v1}" }
              as: MunicipalPlanner
              as_user_id: "${muni_ef}"
              captures: { cm_ef_fire: $.data.id }
            - call: "POST /service-commitments/${cm_ef_fire}/activate"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_ef}"
            - call: "GET /plans-of-services/${plan_ef}"
              payload: {}
