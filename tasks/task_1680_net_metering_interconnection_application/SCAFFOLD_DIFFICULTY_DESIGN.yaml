            - { call: "POST /applications/${app}/withdraw", payload: {}, as: Applicant, as_user_id: "${cust}" }
          assert:
            - "Before reservation: Program.${prog}.available_capacity_watts == 1000000 with interconnected_watts == 0 and reserved_watts == 0"
            - "After decision COMPLETE: Program.${prog}.reserved_watts == 10000 and available_capacity_watts == 990000"
            - "After withdraw: Program.${prog}.reserved_watts == 0 and available_capacity_watts == 1000000 (invariant restored exactly)"
            - "InterconnectionApplication.${app}.application_status == WITHDRAWN, withdrawal_reason == APPLICANT_WITHDRAWN, capacity_reserved_watts == 0, reservation_expires_at == null"
            - "ServiceTransformer.${tx}.aggregate_der_watts == 0 and Feeder.${feed}.aggregate_der_watts == 0 after withdrawal"

      - name: ci_reading_post_void_ledger_conservation
        grounds:
          - calculations.credit_ledger_projection
          - state_machines.MeterReading.POSTED_to_VOIDED
          - entities.CreditLedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity: monetary cents in the credit ledger. Posting a reading then voiding
          it appends REVERSAL entries that exactly negate the originals — credit_balance_cents
          returns to its pre-reading value 0 and sum(amount_cents) over all entries == 0 ==
          credit_balance_cents. A different conserved quantity (money) from the capacity-watts instance.
        test_recipe:
          setup:
            - "MONETARY_CREDIT + AVOIDED_COST_PAYOUT program (cap 1000000, tum 4, COMMITTED); tariff import 30000 / export 12000 / ns 4500 effective 2026-01-01; COMMERCIAL account (usage 20000000) with 10000 W application in PTO_GRANTED."
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "CONS", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog: $.data.id } }
