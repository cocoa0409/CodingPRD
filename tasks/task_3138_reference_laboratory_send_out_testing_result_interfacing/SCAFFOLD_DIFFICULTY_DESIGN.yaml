            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: ReferenceLabOperations
            - call: "GET /reference-lab/specimens/${spD2_id}"
              payload: {}
              as: AccessioningTechnologist
              captures: { spD2_rem_after: $.data.remaining_stability_hours }
            - call: "POST /reference-lab/send-out-orders/${oD2_id}/order-add-on-test"
              payload: { test_catalog_entry_id: "${t1b_id}", line_sequence: 2, add_on_at: "2026-09-01T09:00:00Z" }
