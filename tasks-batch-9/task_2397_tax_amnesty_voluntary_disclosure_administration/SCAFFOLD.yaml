# =============================================================================
# §1.7 RBAC Table
# =============================================================================
roles:
  - name: ProgramAdministrator
    identity: opaque
    description: "Designs programs, curates the taxpayer and representative registries, ages installment schedules and reverses cash"
    exclusive_operations:
      - "POST /amnesty/programs"
      - "POST /amnesty/programs/{id}/tax-type-terms"
      - "POST /amnesty/programs/{id}/open"
      - "POST /amnesty/programs/{id}/close"
      - "POST /amnesty/programs/{id}/reconcile"
      - "POST /amnesty/programs/{id}/installment-sweep"
      - "POST /amnesty/taxpayers"
      - "POST /amnesty/representatives"
      - "POST /amnesty/representatives/{id}/suspend"
      - "POST /amnesty/payments/{id}/reverse"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /amnesty/programs"
      - "GET /amnesty/programs/{id}"
      - "GET /amnesty/programs/{id}/tax-type-terms"
      - "GET /amnesty/programs/{id}/revenue-summary"
      - "GET /amnesty/taxpayers"
      - "GET /amnesty/taxpayers/{id}"
      - "GET /amnesty/taxpayers/{id}/compliance-behavior"
      - "GET /amnesty/agreements"
      - "GET /amnesty/agreements/{id}"
      - "GET /amnesty/enforcement-actions"
  - name: DisclosureOfficer
    identity: opaque
    description: "Screens pre-clearance, negotiates terms, drafts, executes and amends agreements, assesses returns and rules on payment plans"
    exclusive_operations:
      - "POST /amnesty/pre-clearances/{id}/begin-review"
      - "POST /amnesty/pre-clearances/{id}/offer-terms"
      - "POST /amnesty/pre-clearances/{id}/reject"
      - "POST /amnesty/agreements"
      - "POST /amnesty/agreements/{id}/execute"
      - "POST /amnesty/agreements/{id}/amend"
      - "POST /amnesty/returns/{id}/assess"
      - "POST /amnesty/payment-plans/{id}/approve"
      - "POST /amnesty/payment-plans/{id}/reject"
    shared_operations:
      - "GET /amnesty/pre-clearances"
      - "GET /amnesty/pre-clearances/{id}"
      - "GET /amnesty/pre-clearances/{id}/negotiation-rounds"
      - "GET /amnesty/agreements/{id}"
      - "GET /amnesty/agreements/{id}/returns"
      - "GET /amnesty/returns/{id}"
      - "GET /amnesty/payment-plans/{id}"
      - "GET /amnesty/taxpayers/{id}/compliance-behavior"
    segregation_of_duties:
      - "The officer whose X-User-ID equals VoluntaryDisclosureAgreement.drafted_by_user_id may not call POST /amnesty/agreements/{id}/execute on that agreement"
  - name: ComplianceAuditor
    identity: opaque
    description: "Owns audit and investigation records, certifies prospective compliance, declares and rescinds breach, and runs post-program escalation"
    exclusive_operations:
      - "POST /amnesty/enforcement-cases"
      - "POST /amnesty/enforcement-cases/{id}/close"
      - "POST /amnesty/enforcement-cases/{id}/refer"
      - "POST /amnesty/agreements/{id}/certify-compliance"
      - "POST /amnesty/agreements/{id}/declare-breach"
      - "POST /amnesty/agreements/{id}/rescind-breach"
      - "POST /amnesty/payment-plans/{id}/default"
      - "POST /amnesty/enforcement-actions"
      - "POST /amnesty/enforcement-actions/{id}/issue"
      - "POST /amnesty/enforcement-actions/{id}/abate"
    shared_operations:
      - "GET /amnesty/programs/{id}/revenue-summary"
      - "GET /amnesty/taxpayers/{id}"
      - "GET /amnesty/taxpayers/{id}/compliance-behavior"
      - "GET /amnesty/taxpayers/{id}/enforcement-cases"
      - "GET /amnesty/agreements/{id}"
      - "GET /amnesty/agreements/{id}/returns"
      - "GET /amnesty/enforcement-actions"
      - "GET /amnesty/enforcement-actions/{id}"
    segregation_of_duties:
      - "The auditor whose X-User-ID equals EnforcementAction.created_by_user_id may not call POST /amnesty/enforcement-actions/{id}/issue on that action"
  - name: Representative
    identity: entity_backed:Representative
    description: "Mediates anonymous pre-clearance and may file on behalf of the clients it disclosed; X-User-ID must be a Representative.id"
    exclusive_operations:
      - "POST /amnesty/pre-clearances"
      - "POST /amnesty/pre-clearances/{id}/counter"
      - "POST /amnesty/pre-clearances/{id}/disclose-identity"
      - "POST /amnesty/pre-clearances/{id}/accept"
    shared_operations:
      - "GET /amnesty/pre-clearances"
      - "GET /amnesty/pre-clearances/{id}"
      - "GET /amnesty/pre-clearances/{id}/negotiation-rounds"
      - "POST /amnesty/agreements/{id}/returns"
      - "POST /amnesty/returns/{id}/file"
      - "GET /amnesty/agreements/{id}"
      - "GET /amnesty/agreements/{id}/returns"
      - "GET /amnesty/returns/{id}"
  - name: Taxpayer
    identity: entity_backed:Taxpayer
    description: "Files disclosure returns, proposes payment plans and remits payments on its own agreements; X-User-ID must be a Taxpayer.id"
    exclusive_operations:
      - "POST /amnesty/payment-plans"
      - "POST /amnesty/payments"
    shared_operations:
      - "POST /amnesty/agreements/{id}/returns"
      - "POST /amnesty/returns/{id}/file"
      - "GET /amnesty/agreements"
      - "GET /amnesty/agreements/{id}"
      - "GET /amnesty/agreements/{id}/returns"
      - "GET /amnesty/agreements/{id}/payment-plans"
      - "GET /amnesty/agreements/{id}/payments"
      - "GET /amnesty/returns/{id}"
      - "GET /amnesty/payment-plans/{id}"
      - "GET /amnesty/payment-plans/{id}/installments"
      - "GET /amnesty/installments/{id}"
      - "GET /amnesty/payments/{id}"
      - "GET /amnesty/taxpayers/{id}"
