scenario: |
  Generate task harder than expert level!

  2439. Work-Based Learning & Student Internship Placement (district work-based learning coordinator): employer partner recruitment with worksite safety review and agreement execution, student eligibility, training plan and learning objective documentation, child labor law compliance on hours, hazardous occupations and work permits, supervisor evaluation cycles and reflection assignments, transportation, scheduling and academic credit alignment, paid versus unpaid placement classification and wage compliance, incident reporting and insurance coverage determination, placement outcome tracking into employment or postsecondary enrollment
domain_name: work-based-learning
api_prefix: /wbl

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: EmployerPartner
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered legal name of the employer partner
      - name: naics_code
        type: string
        source: input
        description: six-digit NAICS industry code
        constraints: exactly 6 digits
      - name: industry_sector
        type: enum
        source: input
        description: CTE sector the partner is recruited for
        constraints: "one of MANUFACTURING, HEALTHCARE, CONSTRUCTION, INFORMATION_TECHNOLOGY, HOSPITALITY, PUBLIC_ADMINISTRATION"
      - name: workers_comp_carrier
        type: string
        source: input
        description: name of the workers compensation insurance carrier
      - name: workers_comp_policy_no
        type: string
        source: input
        description: workers compensation policy number on file
      - name: workers_comp_expires_on
        type: string
        source: input
        description: "date (YYYY-MM-DD) the workers compensation policy expires; compared against the logical clock date"
      - name: safety_score
        type: integer
        source: computed
        description: "weighted compliance score computed by calculations.employer_safety_score_posture; clamped to 0..100"
        default: 100
      - name: posture
        type: enum
        source: computed
        description: "gating posture derived from safety_score and open findings by calculations.employer_safety_score_posture"
        default: PROSPECT
        constraints: "one of PROSPECT, ELIGIBLE, PROBATION, SUSPENDED"
      - name: substantiated_minor_count
        type: integer
        source: computed
        description: "count of IncidentReport rows for this partner's worksites with status IN {SUBSTANTIATED, CLOSED} and severity == MINOR"
        default: 0
      - name: substantiated_moderate_count
        type: integer
        source: computed
        description: "count of IncidentReport rows for this partner's worksites with status IN {SUBSTANTIATED, CLOSED} and severity == MODERATE"
        default: 0
      - name: substantiated_critical_count
        type: integer
        source: computed
        description: "count of IncidentReport rows for this partner's worksites with status IN {SUBSTANTIATED, CLOSED} and severity == CRITICAL"
        default: 0
      - name: wage_liability_cents
        type: integer
        source: computed
        description: "conserved ledger: sum of Placement.settled_wage_cents over placements at this partner's worksites whose wage_settlement_mode == FINAL"
        default: 0

  - name: Worksite
    parent: null
    common_fields: true
    fields:
      - name: employer_partner_id
        type: string
        source: input
        description: "FK -> EmployerPartner.id; owning employer partner"
      - name: site_name
        type: string
        source: input
        description: name of the physical worksite
      - name: address_line
        type: string
        source: input
        description: street address of the worksite
      - name: hazard_class
        type: enum
        source: input
        description: "child-labor hazard classification of the work performed at this site"
        constraints: "one of NON_HAZARDOUS, LIMITED_HAZARD, PROHIBITED_HAZARD"
      - name: has_power_machinery
        type: boolean
        source: input
        description: whether power-driven machinery is operated at the site
        default: false
      - name: displaces_paid_employee
        type: boolean
        source: input
        description: whether the placement work would displace a paid employee (blocks UNPAID classification)
        default: false
      - name: max_concurrent_students
        type: integer
        source: input
        description: aggregate capacity of student placements the site may host over any overlapping date range
        constraints: ">= 1"
      - name: safety_status
        type: enum
        source: computed
        description: "derived from the latest non-SUPERSEDED WorksiteSafetyReview decision for this worksite"
        default: UNREVIEWED
        constraints: "one of UNREVIEWED, APPROVED, CONDITIONAL, FAILED"
      - name: safety_review_expires_on
        type: string
        source: computed
        description: "expires_on copied from the latest non-SUPERSEDED WorksiteSafetyReview with status IN {APPROVED, CONDITIONAL}; null when none"
      - name: corrective_actions_due_on
        type: string
        source: computed
        description: "corrective_actions_due_on copied from the latest non-SUPERSEDED WorksiteSafetyReview with status == CONDITIONAL; null otherwise"
      - name: slots_committed
        type: integer
        source: computed
        description: "conserved counter: count of Placement rows on this worksite with lifecycle_status IN {PROPOSED, ACTIVE}"
        default: 0

  - name: WorksiteSafetyReview
    parent: null
    common_fields: true
    fields:
      - name: worksite_id
        type: string
        source: input
        description: "FK -> Worksite.id; worksite inspected by this review"
      - name: reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the SafetyReviewer who filed the review (opaque operator id, not an entity id)"
      - name: machinery_guarding_ok
        type: boolean
        source: input
        description: whether machine guarding was verified adequate at inspection
      - name: hazard_findings_count
        type: integer
        source: input
        description: number of hazard findings recorded during the inspection
        constraints: ">= 0"
      - name: orientation_documented
        type: boolean
        source: input
        description: whether student safety orientation materials were documented on site
      - name: emergency_plan_on_file
        type: boolean
        source: input
        description: whether a written emergency action plan is on file at the site
      - name: status
        type: enum
        source: system
        description: review lifecycle state
        default: SUBMITTED
        constraints: "one of SUBMITTED, APPROVED, CONDITIONAL, FAILED, SUPERSEDED"
      - name: decision_on
        type: string
        source: system
        description: "logical-clock date (YYYY-MM-DD) the decision was recorded; null while SUBMITTED"
      - name: corrective_actions_due_on
        type: string
        source: system
        description: "decision_on + 30 days, set only when the decision is CONDITIONAL"
      - name: expires_on
        type: string
        source: system
        description: "decision_on + 365 days, set when the decision is APPROVED or CONDITIONAL"

  - name: Supervisor
    parent: null
    common_fields: true
    fields:
      - name: worksite_id
        type: string
        source: input
        description: "FK -> Worksite.id; worksite this supervisor oversees"
      - name: full_name
        type: string
        source: input
        description: supervisor full name
      - name: email
        type: string
        source: input
        description: supervisor contact email
      - name: training_completed_on
        type: string
        source: input
        description: "date (YYYY-MM-DD) the supervisor completed district mentor training; valid for 365 days"
      - name: max_student_load
        type: integer
        source: input
        description: maximum number of ACTIVE or PROPOSED placements this supervisor may hold
        constraints: ">= 1"
      - name: active_student_load
        type: integer
        source: computed
        description: "count of Placement rows naming this supervisor with lifecycle_status IN {PROPOSED, ACTIVE}"
        default: 0

  - name: PartnershipAgreement
    parent: null
    common_fields: true
    fields:
      - name: employer_partner_id
        type: string
        source: input
        description: "FK -> EmployerPartner.id; employer party to the agreement"
      - name: worksite_id
        type: string
        source: input
        description: "FK -> Worksite.id; worksite covered by the agreement"
      - name: employer_signer_supervisor_id
        type: string
        source: input
        description: "FK -> Supervisor.id; supervisor authorised to sign on the employer side"
      - name: effective_on
        type: string
        source: input
        description: "first date (YYYY-MM-DD) placements under this agreement may start"
      - name: expires_on
        type: string
        source: input
        description: "last date (YYYY-MM-DD) the agreement covers; must be > effective_on"
      - name: insurance_rider
        type: boolean
        source: input
        description: whether the employer added the district student-worker insurance rider
        default: false
      - name: revision_round
        type: integer
        source: computed
        description: number of employer-sign attempts consumed by district change requests
        default: 0
      - name: status
        type: enum
        source: system
        description: negotiation and execution state
        default: PENDING_EMPLOYER
        constraints: "one of PENDING_EMPLOYER, PENDING_DISTRICT, EXECUTED, TERMINATED, EXPIRED"
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the WblCoordinator who drafted the agreement (opaque operator id)"
      - name: executed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the WblCoordinator who countersigned; null until EXECUTED"
      - name: executed_on
        type: string
        source: system
        description: "logical-clock date (YYYY-MM-DD) the agreement reached EXECUTED; null otherwise"
      - name: change_request_note
        type: string
        source: system
        description: latest district change-request note recorded on the agreement
      - name: termination_reason
        type: string
        source: system
        description: reason recorded when the agreement moved to TERMINATED
  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: student full name
      - name: birth_date
        type: string
        source: input
        description: "date of birth (YYYY-MM-DD); drives permit class and child-labor hour caps"
      - name: grade_level
        type: integer
        source: input
        description: current grade level
        constraints: "9..12"
      - name: gpa
        type: number
        source: input
        description: cumulative unweighted GPA on a 4.00 scale
        constraints: "0.00..4.00, 2 decimals"
      - name: attendance_rate
        type: number
        source: input
        description: prior-term attendance rate as a fraction
        constraints: "0.00..1.00, 2 decimals"
      - name: student_learner_certificate
        type: boolean
        source: input
        description: whether a signed student-learner certificate permits the sub-minimum learner wage
        default: false
      - name: guardian_consent_on_file
        type: boolean
        source: input
        description: whether a signed guardian consent form is on file
        default: false
      - name: eligibility_status
        type: enum
        source: computed
        description: "derived by calculations.student_eligibility_status from gpa, attendance_rate and grade_level"
        default: ELIGIBLE
        constraints: "one of ELIGIBLE, INELIGIBLE_ACADEMIC, INELIGIBLE_ATTENDANCE, INELIGIBLE_GRADE"
      - name: ytd_wbl_hours
        type: number
        source: computed
        description: "sum of TimesheetEntry.hours_worked with status == LOGGED across all of this student's placements, 2 decimals"
        default: 0.00
      - name: credits_earned_wbl
        type: number
        source: computed
        description: "sum of Placement.credits_awarded across this student's placements, 2 decimals"
        default: 0.00
      - name: active_placement_count
        type: integer
        source: computed
        description: "count of this student's Placement rows with lifecycle_status IN {PROPOSED, ACTIVE}"
        default: 0

  - name: WorkPermit
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; student the permit is issued to"
      - name: permit_class
        type: enum
        source: input
        description: "age band the permit covers; must match the student's age band on the placement start date"
        constraints: "one of MINOR_14_15, MINOR_16_17, ADULT_18_PLUS"
      - name: hazardous_endorsement
        type: boolean
        source: input
        description: whether the permit carries the LIMITED_HAZARD occupation endorsement
        default: false
      - name: status
        type: enum
        source: system
        description: permit lifecycle state
        default: REQUESTED
        constraints: "one of REQUESTED, ISSUED, REVOKED, EXPIRED"
      - name: issued_on
        type: string
        source: system
        description: "logical-clock date (YYYY-MM-DD) the permit was issued; null while REQUESTED"
      - name: expires_on
        type: string
        source: system
        description: "date (YYYY-MM-DD) the permit lapses; supplied at issuance"
      - name: revoked_reason
        type: string
        source: system
        description: reason recorded when the permit moved to REVOKED
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who issued the permit (opaque operator id)"

  - name: Placement
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; placed student"
      - name: worksite_id
        type: string
        source: input
        description: "FK -> Worksite.id; host worksite"
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PartnershipAgreement.id; agreement the placement operates under"
      - name: supervisor_id
        type: string
        source: input
        description: "FK -> Supervisor.id; supervising employer contact; must belong to worksite_id"
      - name: supersedes_placement_id
        type: string
        source: input
        description: "FK -> Placement.id; self-referential link to the TERMINATED placement this one replaces; null when original"
      - name: pay_classification
        type: enum
        source: input
        description: wage treatment of the placement
        constraints: "one of PAID, UNPAID, STIPEND"
      - name: hourly_wage_cents
        type: integer
        source: input
        description: "agreed hourly wage in cents; required when pay_classification == PAID, must be 0 otherwise"
        default: 0
      - name: stipend_total_cents
        type: integer
        source: input
        description: "flat stipend in cents; required when pay_classification == STIPEND, must be 0 otherwise"
        default: 0
      - name: scheduled_weekly_hours
        type: number
        source: input
        description: "planned weekly hours, 2 decimals"
        constraints: "> 0.00"
      - name: start_on
        type: string
        source: input
        description: "first date (YYYY-MM-DD) the student may log hours"
      - name: end_on
        type: string
        source: input
        description: "last date (YYYY-MM-DD) the student may log hours; must be > start_on"
      - name: credit_target_credits
        type: number
        source: input
        description: "academic credits the placement targets, 2 decimals"
        constraints: "0.50..2.00 in 0.50 steps"
      - name: credit_award_mode
        type: enum
        source: input
        description: variant selector for calculations.academic_credit_award
        constraints: "one of HOURS_BASED, COMPETENCY_BASED"
      - name: required_evaluation_cycles
        type: integer
        source: input
        description: number of EvaluationCycle rows that must reach CLOSED before completion
        default: 2
        constraints: "1..4"
      - name: transportation_mode
        type: enum
        source: input
        description: how the student reaches the worksite; drives calculations.reimbursement_admin_fee
        constraints: "one of DISTRICT_BUS, PUBLIC_TRANSIT, SELF, GUARDIAN"
      - name: commute_round_trip_miles
        type: number
        source: input
        description: "round-trip commute distance in miles, 2 decimals"
        default: 0.00
      - name: student_age_at_start
        type: integer
        source: computed
        description: "whole years between Student.birth_date and start_on, floor"
      - name: permit_class_at_start
        type: enum
        source: computed
        description: "age band implied by student_age_at_start: 14..15 -> MINOR_14_15, 16..17 -> MINOR_16_17, >= 18 -> ADULT_18_PLUS"
        constraints: "one of MINOR_14_15, MINOR_16_17, ADULT_18_PLUS"
      - name: total_verified_hours
        type: number
        source: computed
        description: "conserved ledger: sum of TimesheetEntry.hours_worked on this placement with status == LOGGED, 2 decimals"
        default: 0.00
      - name: closed_cycle_count
        type: integer
        source: computed
        description: "count of this placement's EvaluationCycle rows with cycle_status == CLOSED"
        default: 0
      - name: credit_eligible
        type: boolean
        source: computed
        description: "true when closed_cycle_count >= required_evaluation_cycles AND TrainingPlan status == APPROVED"
        default: false
      - name: provisional_wage_cents
        type: integer
        source: computed
        description: "PROVISIONAL variant of calculations.wage_settlement, recomputed on every timesheet mutation"
        default: 0
      - name: final_wage_cents
        type: integer
        source: computed
        description: "FINAL variant of calculations.wage_settlement, recomputed on every timesheet mutation"
        default: 0
      - name: lifecycle_status
        type: enum
        source: system
        description: "first parallel state dimension: placement lifecycle"
        default: PROPOSED
        constraints: "one of PROPOSED, ACTIVE, COMPLETED, TERMINATED"
      - name: compliance_status
        type: enum
        source: system
        description: "second parallel state dimension: compliance clearance, evolves independently of lifecycle_status"
        default: PENDING_REVIEW
        constraints: "one of PENDING_REVIEW, CLEARED, FLAGGED, BLOCKED"
      - name: training_plan_approved_at
        type: datetime
        source: system
        description: "logical-clock timestamp the placement's TrainingPlan reached APPROVED; null otherwise"
      - name: settled_wage_cents
        type: integer
        source: system
        description: "wage amount frozen at settlement; 0 until settle-wages runs"
        default: 0
      - name: wage_settlement_mode
        type: enum
        source: system
        description: "which calculations.wage_settlement variant produced settled_wage_cents"
        default: NONE
        constraints: "one of NONE, PROVISIONAL, FINAL"
      - name: credits_awarded
        type: number
        source: system
        description: "credits granted by award-credit, 2 decimals; 0.00 until awarded"
        default: 0.00
      - name: credit_awarded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the WblCoordinator who awarded credit (opaque operator id); must differ from the plan approver"
      - name: completed_on
        type: string
        source: system
        description: "logical-clock date (YYYY-MM-DD) the placement reached COMPLETED; null otherwise"
      - name: termination_reason
        type: string
        source: system
        description: reason recorded when the placement reached TERMINATED
  - name: TrainingPlan
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: "FK -> Placement.id; placement this training plan documents"
      - name: course_code
        type: string
        source: input
        description: CTE course code the placement earns credit in
      - name: credit_hours_target
        type: number
        source: input
        description: "clock hours the plan schedules, 2 decimals"
        constraints: "> 0.00"
      - name: status
        type: enum
        source: system
        description: plan review state with a revision cycle
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, CHANGES_REQUESTED, APPROVED, SUPERSEDED"
      - name: revision_round
        type: integer
        source: computed
        description: number of district change requests consumed by this plan
        default: 0
      - name: objective_count
        type: integer
        source: computed
        description: "count of LearningObjective rows on this plan"
        default: 0
      - name: aligned_objective_count
        type: integer
        source: computed
        description: "count of LearningObjective rows on this plan whose aligned_course_code == TrainingPlan.course_code"
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: "logical-clock timestamp of the most recent submit; null while DRAFT"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the WblCoordinator who approved the plan (opaque operator id)"
      - name: approved_at
        type: datetime
        source: system
        description: "logical-clock timestamp the plan reached APPROVED; null otherwise"
      - name: change_request_note
        type: string
        source: system
        description: latest change-request note recorded on the plan

  - name: LearningObjective
    parent: null
    common_fields: false
    fields:
      - name: training_plan_id
        type: string
        source: input
        description: "FK -> TrainingPlan.id; plan this objective belongs to"
      - name: competency_code
        type: string
        source: input
        description: state competency code the objective maps to
      - name: description
        type: string
        source: input
        description: measurable learning objective statement
      - name: aligned_course_code
        type: string
        source: input
        description: course code this objective grants credit toward
      - name: assessment_method
        type: enum
        source: input
        description: how mastery of the objective is measured
        constraints: "one of SUPERVISOR_RATING, PORTFOLIO, EXAM, REFLECTION"

  - name: TimesheetEntry
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: "FK -> Placement.id; placement the hours belong to"
      - name: work_date
        type: string
        source: input
        description: "date (YYYY-MM-DD) the shift occurred"
      - name: start_time
        type: string
        source: input
        description: "shift start local clock time (HH:MM, 24-hour)"
      - name: end_time
        type: string
        source: input
        description: "shift end local clock time (HH:MM, 24-hour); must be > start_time"
      - name: break_minutes
        type: integer
        source: input
        description: unpaid break minutes deducted from the shift
        default: 0
        constraints: ">= 0"
      - name: is_school_day
        type: boolean
        source: input
        description: whether work_date was an instructional day (selects the school-day hour cap)
        default: true
      - name: hours_worked
        type: number
        source: computed
        description: "((end_time - start_time) minutes - break_minutes) / 60, rounded half-up to 2 decimals"
      - name: status
        type: enum
        source: system
        description: entry validity state
        default: LOGGED
        constraints: "one of LOGGED, VOIDED"
      - name: voided_reason
        type: string
        source: system
        description: reason recorded when the entry was voided
      - name: voided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the WblCoordinator who voided the entry (opaque operator id)"

  - name: EvaluationCycle
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: "FK -> Placement.id; placement being evaluated"
      - name: cycle_index
        type: integer
        source: system
        description: "1-based ordinal of the cycle within the placement"
      - name: window_start
        type: string
        source: system
        description: "first date (YYYY-MM-DD) of the 28-day evaluation window"
      - name: window_end
        type: string
        source: system
        description: "last date (YYYY-MM-DD) of the 28-day evaluation window (window_start + 27 days)"
      - name: supervisor_eval_status
        type: enum
        source: system
        description: "first parallel dimension: supervisor rating submission"
        default: PENDING
        constraints: "one of PENDING, SUBMITTED"
      - name: reflection_status
        type: enum
        source: system
        description: "second parallel dimension: student reflection assignment"
        default: PENDING
        constraints: "one of PENDING, SUBMITTED, ACCEPTED, RETURNED"
      - name: cycle_status
        type: enum
        source: computed
        description: "compound state derived from the two dimensions: CLOSED when supervisor_eval_status == SUBMITTED AND reflection_status == ACCEPTED; PARTIAL when exactly one dimension has advanced past PENDING; OPEN when both are PENDING; SUSPENDED and CANCELLED are written by cascades"
        default: OPEN
        constraints: "one of OPEN, PARTIAL, CLOSED, SUSPENDED, CANCELLED"
      - name: rating_technical
        type: integer
        source: system
        description: supervisor rating for technical skill
        constraints: "1..5"
      - name: rating_communication
        type: integer
        source: system
        description: supervisor rating for communication
        constraints: "1..5"
      - name: rating_reliability
        type: integer
        source: system
        description: supervisor rating for reliability
        constraints: "1..5"
      - name: rating_safety
        type: integer
        source: system
        description: supervisor rating for safety practice
        constraints: "1..5"
      - name: rating_initiative
        type: integer
        source: system
        description: supervisor rating for initiative
        constraints: "1..5"
      - name: competency_score
        type: number
        source: computed
        description: "weighted supervisor rating computed by calculations.academic_credit_award inputs, 2 decimals; null until the supervisor evaluation is submitted"
      - name: reflection_text
        type: string
        source: system
        description: student reflection narrative as last submitted
      - name: reflection_returned_count
        type: integer
        source: computed
        description: number of times the reflection was returned to the student
        default: 0
      - name: closed_on
        type: string
        source: system
        description: "logical-clock date (YYYY-MM-DD) the cycle reached CLOSED; null otherwise"

  - name: IncidentReport
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: "FK -> Placement.id; placement the injured student was working under"
      - name: worksite_id
        type: string
        source: input
        description: "FK -> Worksite.id; worksite where the incident occurred; must equal the placement's worksite_id"
      - name: occurred_at
        type: datetime
        source: input
        description: ISO 8601 UTC timestamp of the incident
      - name: severity
        type: enum
        source: input
        description: triage severity of the incident
        constraints: "one of MINOR, MODERATE, CRITICAL"
      - name: description
        type: string
        source: input
        description: narrative of what happened
      - name: injury_type
        type: enum
        source: input
        description: injury classification
        constraints: "one of NONE, LACERATION, FRACTURE, BURN, STRAIN, EXPOSURE"
      - name: reported_by_user_id
        type: string
        source: system
        description: "polymorphic reporter reference: the X-User-ID of the acting role, which is a Supervisor.id for EmployerSupervisor, a Student.id for Student, or an opaque operator id for WblCoordinator; deliberately NOT a foreign key"
      - name: status
        type: enum
        source: system
        description: investigation state
        default: REPORTED
        constraints: "one of REPORTED, SUBSTANTIATED, UNSUBSTANTIATED, CLOSED"
      - name: coverage_determination
        type: enum
        source: system
        description: "insurance coverage outcome from calculations.insurance_coverage_determination"
        default: PENDING
        constraints: "one of PENDING, WORKERS_COMP, DISTRICT_LIABILITY, EMPLOYER_LIABILITY_UNINSURED, NOT_COVERED"
      - name: determined_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who recorded the coverage determination (opaque operator id)"
      - name: closed_on
        type: string
        source: system
        description: "logical-clock date (YYYY-MM-DD) the incident reached CLOSED; null otherwise"
      - name: osha_recordable
        type: boolean
        source: computed
        description: "true when status IN {SUBSTANTIATED, CLOSED} AND severity IN {MODERATE, CRITICAL} AND injury_type != NONE"
        default: false

  - name: PlacementOutcome
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: input
        description: "FK -> Placement.id; completed placement whose destination is tracked"
      - name: outcome_type
        type: enum
        source: input
        description: post-placement destination
        constraints: "one of EMPLOYED_FULL_TIME, EMPLOYED_PART_TIME, POSTSECONDARY_ENROLLED, APPRENTICESHIP, MILITARY, NOT_ENGAGED, UNKNOWN"
      - name: employer_name
        type: string
        source: input
        description: "hiring employer name; required when outcome_type IN {EMPLOYED_FULL_TIME, EMPLOYED_PART_TIME, APPRENTICESHIP}"
      - name: institution_name
        type: string
        source: input
        description: "institution name; required when outcome_type == POSTSECONDARY_ENROLLED"
      - name: recorded_on
        type: string
        source: system
        description: "logical-clock date (YYYY-MM-DD) the outcome was recorded"
      - name: verification_source
        type: enum
        source: input
        description: evidence backing the outcome claim
        constraints: "one of EMPLOYER_LETTER, ENROLLMENT_RECORD, STUDENT_ATTESTATION"
      - name: status
        type: enum
        source: system
        description: verification state
        default: RECORDED
        constraints: "one of RECORDED, VERIFIED, LATE_UNVERIFIABLE"
      - name: verified_on
        type: string
        source: system
        description: "logical-clock date (YYYY-MM-DD) the outcome was verified; null otherwise"
      - name: days_since_completion
        type: integer
        source: computed
        description: "whole days between the placement's completed_on and recorded_on"
      - name: counts_positive
        type: boolean
        source: computed
        description: "true when status == VERIFIED AND outcome_type IN {EMPLOYED_FULL_TIME, EMPLOYED_PART_TIME, POSTSECONDARY_ENROLLED, APPRENTICESHIP, MILITARY}"
        default: false
state_machines:
  - entity: WorksiteSafetyReview
    initial_state: SUBMITTED
    terminal_states: [FAILED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /wbl/safety-reviews/{reviewId}/decision with decision=APPROVED"
        actor: SafetyReviewer
        preconditions:
          - "review.status == SUBMITTED"
          - "review.machinery_guarding_ok == true"
          - "review.hazard_findings_count == 0"
          - "review.orientation_documented == true"
          - "review.emergency_plan_on_file == true"
        side_effects:
          - "sets review.decision_on = clock date, review.expires_on = decision_on + 365 days"
          - "sets Worksite.safety_status = APPROVED, Worksite.safety_review_expires_on = review.expires_on, Worksite.corrective_actions_due_on = null"
          - "increments Worksite.version by 1"
          - "recomputes EmployerPartner.safety_score and EmployerPartner.posture via calculations.employer_safety_score_posture; a PROSPECT partner with score >= 70 becomes ELIGIBLE"
        note: "branch 1 of 3 — divergent side-effect set per branch"
      - from: SUBMITTED
        to: CONDITIONAL
        trigger: "POST /wbl/safety-reviews/{reviewId}/decision with decision=CONDITIONAL"
        actor: SafetyReviewer
        preconditions:
          - "review.status == SUBMITTED"
          - "review.machinery_guarding_ok == true"
          - "review.hazard_findings_count BETWEEN 1 AND 3"
        side_effects:
          - "sets review.decision_on = clock date, review.corrective_actions_due_on = decision_on + 30 days, review.expires_on = decision_on + 365 days"
          - "sets Worksite.safety_status = CONDITIONAL, Worksite.corrective_actions_due_on = review.corrective_actions_due_on, Worksite.safety_review_expires_on = review.expires_on"
          - "increments Worksite.version by 1"
          - "recomputes EmployerPartner.safety_score with a -10 penalty per CONDITIONAL worksite and re-derives posture (PROBATION when 50 <= score < 70)"
        note: "branch 2 of 3 — permits placements but applies a score penalty"
      - from: SUBMITTED
        to: FAILED
        trigger: "POST /wbl/safety-reviews/{reviewId}/decision with decision=FAILED"
        actor: SafetyReviewer
        preconditions:
          - "review.status == SUBMITTED"
          - "review.machinery_guarding_ok == false OR review.hazard_findings_count >= 4 OR review.emergency_plan_on_file == false"
        side_effects:
          - "sets review.decision_on = clock date; leaves expires_on and corrective_actions_due_on null"
          - "sets Worksite.safety_status = FAILED, Worksite.safety_review_expires_on = null"
          - "increments Worksite.version by 1"
          - "sets compliance_status = BLOCKED on every Placement of this worksite with lifecycle_status IN {PROPOSED, ACTIVE}"
          - "sets cycle_status = SUSPENDED on every EvaluationCycle of those placements whose cycle_status IN {OPEN, PARTIAL}"
        note: "branch 3 of 3 — cascade depth 3 (review -> worksite -> placements -> cycles)"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: POST /wbl/safety-reviews creates a newer review for the same worksite"
        actor: system
        preconditions:
          - "an earlier review on this worksite has status IN {APPROVED, CONDITIONAL}"
        side_effects:
          - "sets the earlier review.status = SUPERSEDED"
          - "Worksite.safety_status reverts to UNREVIEWED until the new review is decided"
      - from: CONDITIONAL
        to: SUPERSEDED
        trigger: "system: POST /wbl/safety-reviews creates a newer review for the same worksite"
        actor: system
        preconditions:
          - "an earlier review on this worksite has status IN {APPROVED, CONDITIONAL}"
        side_effects:
          - "sets the earlier review.status = SUPERSEDED"
          - "clears Worksite.corrective_actions_due_on"

  - entity: PartnershipAgreement
    initial_state: PENDING_EMPLOYER
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: PENDING_EMPLOYER
        to: PENDING_DISTRICT
        trigger: "POST /wbl/agreements/{agreementId}/employer-sign"
        actor: EmployerSupervisor
        preconditions:
          - "agreement.status == PENDING_EMPLOYER"
          - "X-User-ID == agreement.employer_signer_supervisor_id"
          - "Worksite.safety_status IN {APPROVED, CONDITIONAL}"
        side_effects:
          - "clears agreement.change_request_note"
      - from: PENDING_DISTRICT
        to: PENDING_EMPLOYER
        trigger: "POST /wbl/agreements/{agreementId}/request-changes"
        actor: WblCoordinator
        preconditions:
          - "agreement.status == PENDING_DISTRICT"
          - "agreement.revision_round < 3"
        side_effects:
          - "increments agreement.revision_round by 1"
          - "stores agreement.change_request_note"
        note: "negotiation cycle — PENDING_EMPLOYER <-> PENDING_DISTRICT, capped at 3 rounds by ERR_NEGOTIATION_ROUND_LIMIT"
      - from: PENDING_DISTRICT
        to: EXECUTED
        trigger: "POST /wbl/agreements/{agreementId}/execute"
        actor: WblCoordinator
        preconditions:
          - "agreement.status == PENDING_DISTRICT"
          - "X-User-ID != agreement.created_by_user_id (segregation of duties)"
          - "agreement.insurance_rider == true"
          - "EmployerPartner.workers_comp_expires_on >= clock date"
          - "EmployerPartner.posture != SUSPENDED"
        side_effects:
          - "sets agreement.executed_by_user_id = X-User-ID and agreement.executed_on = clock date"
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /wbl/agreements/{agreementId}/terminate"
        actor: WblCoordinator
        preconditions:
          - "agreement.status == EXECUTED"
        side_effects:
          - "stores agreement.termination_reason"
          - "sets lifecycle_status = TERMINATED on every Placement under this agreement with lifecycle_status IN {PROPOSED, ACTIVE}"
          - "decrements Worksite.slots_committed and Supervisor.active_student_load for each terminated placement"
          - "sets cycle_status = CANCELLED on every EvaluationCycle of those placements whose cycle_status IN {OPEN, PARTIAL}"
      - from: EXECUTED
        to: EXPIRED
        trigger: "system sweep on POST /wbl/_clock/set_current_utc when clock date > agreement.expires_on"
        actor: system
        preconditions:
          - "agreement.status == EXECUTED"
          - "new clock date > agreement.expires_on"
        side_effects:
          - "sets compliance_status = FLAGGED on every Placement under this agreement with lifecycle_status == ACTIVE"

  - entity: WorkPermit
    initial_state: REQUESTED
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /wbl/work-permits/{permitId}/issue"
        actor: ComplianceOfficer
        preconditions:
          - "permit.status == REQUESTED"
          - "Student.guardian_consent_on_file == true"
          - "issued_on <= expires_on"
        side_effects:
          - "sets permit.issued_on, permit.expires_on and permit.issued_by_user_id"
      - from: ISSUED
        to: REVOKED
        trigger: "POST /wbl/work-permits/{permitId}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "permit.status == ISSUED"
        side_effects:
          - "stores permit.revoked_reason"
          - "sets compliance_status = FLAGGED on every Placement of this student with lifecycle_status IN {PROPOSED, ACTIVE} and compliance_status IN {PENDING_REVIEW, CLEARED}"
        note: "revocation flags but does not BLOCK, so validation priority 28 ERR_WORK_PERMIT_INVALID stays reachable on timesheet writes"
      - from: ISSUED
        to: EXPIRED
        trigger: "system sweep on POST /wbl/_clock/set_current_utc when clock date > permit.expires_on"
        actor: system
        preconditions:
          - "permit.status == ISSUED"
          - "new clock date > permit.expires_on"
        side_effects:
          - "sets compliance_status = FLAGGED on every Placement of this student with lifecycle_status IN {PROPOSED, ACTIVE} and compliance_status IN {PENDING_REVIEW, CLEARED}"
  - entity: Placement
    initial_state: PROPOSED
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "system: POST /wbl/training-plans/{planId}/approve when the approval leaves compliance_status == CLEARED"
        actor: system
        preconditions:
          - "placement.lifecycle_status == PROPOSED"
          - "placement.compliance_status == CLEARED after the approval cascade"
          - "PartnershipAgreement.status == EXECUTED"
        side_effects:
          - "sets placement.training_plan_approved_at = clock timestamp"
          - "creates EvaluationCycle with cycle_index 1, window_start = placement.start_on, window_end = window_start + 27 days, cycle_status OPEN"
        note: "auto-activation — hop 3 of the plan-approval cascade"
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /wbl/placements/{placementId}/activate"
        actor: WblCoordinator
        preconditions:
          - "placement.lifecycle_status == PROPOSED"
          - "placement.compliance_status == CLEARED"
          - "the placement's TrainingPlan.status == APPROVED"
          - "PartnershipAgreement.status == EXECUTED"
          - "Worksite.safety_status IN {APPROVED, CONDITIONAL} AND Worksite.safety_review_expires_on >= clock date"
        side_effects:
          - "creates EvaluationCycle with cycle_index 1 when the placement has no EvaluationCycle rows yet"
        note: "manual path for placements whose compliance clearance arrived after plan approval"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /wbl/placements/{placementId}/complete"
        actor: WblCoordinator
        preconditions:
          - "placement.lifecycle_status == ACTIVE"
          - "placement.compliance_status != BLOCKED"
          - "placement.closed_cycle_count >= placement.required_evaluation_cycles"
        side_effects:
          - "sets placement.completed_on = clock date"
          - "decrements Worksite.slots_committed by 1 and Supervisor.active_student_load by 1"
          - "decrements Student.active_placement_count by 1"
          - "sets cycle_status = CANCELLED on this placement's EvaluationCycle rows whose cycle_status IN {OPEN, PARTIAL}"
      - from: PROPOSED
        to: TERMINATED
        trigger: "POST /wbl/placements/{placementId}/terminate"
        actor: WblCoordinator
        preconditions:
          - "placement.lifecycle_status == PROPOSED"
        side_effects:
          - "stores placement.termination_reason"
          - "decrements Worksite.slots_committed by 1, Supervisor.active_student_load by 1 and Student.active_placement_count by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /wbl/placements/{placementId}/terminate"
        actor: WblCoordinator
        preconditions:
          - "placement.lifecycle_status == ACTIVE"
        side_effects:
          - "stores placement.termination_reason"
          - "decrements Worksite.slots_committed by 1, Supervisor.active_student_load by 1 and Student.active_placement_count by 1"
          - "sets cycle_status = CANCELLED on this placement's EvaluationCycle rows whose cycle_status IN {OPEN, PARTIAL, SUSPENDED}"
      - from: PENDING_REVIEW
        to: CLEARED
        trigger: "system: POST /wbl/training-plans/{planId}/approve"
        actor: system
        preconditions:
          - "placement.compliance_status == PENDING_REVIEW"
          - "plan.aligned_objective_count >= 3"
          - "the student holds a WorkPermit with status == ISSUED whose permit_class == placement.permit_class_at_start"
        side_effects:
          - "hop 2 of the plan-approval cascade; enables the PROPOSED -> ACTIVE auto-activation hop"
        note: "compliance dimension — evolves independently of lifecycle_status"
      - from: CLEARED
        to: FLAGGED
        trigger: "system: WorkPermit REVOKED/EXPIRED, PartnershipAgreement EXPIRED, or IncidentReport SUBSTANTIATED with severity IN {MINOR, MODERATE}"
        actor: system
        preconditions:
          - "placement.compliance_status == CLEARED"
          - "placement.lifecycle_status IN {PROPOSED, ACTIVE}"
        side_effects:
          - "no lifecycle change — an ACTIVE placement stays ACTIVE while FLAGGED"
      - from: PENDING_REVIEW
        to: FLAGGED
        trigger: "system: WorkPermit REVOKED/EXPIRED before the training plan is approved"
        actor: system
        preconditions:
          - "placement.compliance_status == PENDING_REVIEW"
          - "placement.lifecycle_status IN {PROPOSED, ACTIVE}"
        side_effects:
          - "blocks the PENDING_REVIEW -> CLEARED hop until a ComplianceOfficer re-clears the placement"
      - from: FLAGGED
        to: CLEARED
        trigger: "POST /wbl/placements/{placementId}/compliance-decision with decision=CLEAR"
        actor: ComplianceOfficer
        preconditions:
          - "placement.compliance_status == FLAGGED"
          - "placement.lifecycle_status IN {PROPOSED, ACTIVE}"
          - "the student holds a WorkPermit with status == ISSUED whose permit_class == placement.permit_class_at_start"
        side_effects:
          - "compliance dimension cycles FLAGGED -> CLEARED -> FLAGGED without touching lifecycle_status"
      - from: CLEARED
        to: FLAGGED
        trigger: "POST /wbl/placements/{placementId}/compliance-decision with decision=FLAG"
        actor: ComplianceOfficer
        preconditions:
          - "placement.compliance_status == CLEARED"
          - "placement.lifecycle_status IN {PROPOSED, ACTIVE}"
        side_effects:
          - "stores the reviewer note; no lifecycle change"
      - from: CLEARED
        to: BLOCKED
        trigger: "system: Worksite.safety_status becomes FAILED or EmployerPartner.posture becomes SUSPENDED"
        actor: system
        preconditions:
          - "placement.compliance_status IN {PENDING_REVIEW, CLEARED, FLAGGED}"
          - "placement.lifecycle_status IN {PROPOSED, ACTIVE}"
        side_effects:
          - "sets cycle_status = SUSPENDED on this placement's EvaluationCycle rows whose cycle_status IN {OPEN, PARTIAL}"
          - "bars timesheet writes, completion, wage settlement and credit award while BLOCKED"
      - from: FLAGGED
        to: BLOCKED
        trigger: "system: Worksite.safety_status becomes FAILED or EmployerPartner.posture becomes SUSPENDED"
        actor: system
        preconditions:
          - "placement.compliance_status == FLAGGED"
          - "placement.lifecycle_status IN {PROPOSED, ACTIVE}"
        side_effects:
          - "sets cycle_status = SUSPENDED on this placement's EvaluationCycle rows whose cycle_status IN {OPEN, PARTIAL}"
      - from: BLOCKED
        to: FLAGGED
        trigger: "POST /wbl/placements/{placementId}/compliance-decision with decision=UNBLOCK"
        actor: ComplianceOfficer
        preconditions:
          - "placement.compliance_status == BLOCKED"
          - "placement.lifecycle_status IN {PROPOSED, ACTIVE}"
          - "Worksite.safety_status IN {APPROVED, CONDITIONAL}"
          - "EmployerPartner.posture != SUSPENDED"
        side_effects:
          - "restores cycle_status = PARTIAL or OPEN on this placement's SUSPENDED EvaluationCycle rows, re-derived from their two dimensions"

  - entity: TrainingPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /wbl/training-plans/{planId}/submit"
        actor: WblCoordinator
        preconditions:
          - "plan.status == DRAFT"
          - "plan.objective_count >= 3"
          - "plan.aligned_objective_count >= 3"
        side_effects:
          - "sets plan.submitted_at = clock timestamp"
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /wbl/training-plans/{planId}/request-changes"
        actor: ComplianceOfficer
        preconditions:
          - "plan.status == SUBMITTED"
          - "plan.revision_round < 3"
        side_effects:
          - "increments plan.revision_round by 1"
          - "stores plan.change_request_note"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /wbl/training-plans/{planId}/submit"
        actor: WblCoordinator
        preconditions:
          - "plan.status == CHANGES_REQUESTED"
          - "plan.objective_count >= 3"
          - "plan.aligned_objective_count >= 3"
        side_effects:
          - "refreshes plan.submitted_at = clock timestamp"
        note: "revision cycle SUBMITTED <-> CHANGES_REQUESTED, capped at 3 rounds"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /wbl/training-plans/{planId}/approve"
        actor: WblCoordinator
        preconditions:
          - "plan.status == SUBMITTED"
          - "plan.aligned_objective_count >= 3"
          - "the placement's Worksite.safety_status IN {APPROVED, CONDITIONAL}"
          - "PartnershipAgreement.status == EXECUTED"
        side_effects:
          - "sets plan.approved_by_user_id = X-User-ID and plan.approved_at = clock timestamp (hop 1 of the plan-approval cascade)"
          - "hop 2: sets Placement.compliance_status = CLEARED when it was PENDING_REVIEW"
          - "hop 3: the CLEARED compliance state auto-transitions Placement.lifecycle_status PROPOSED -> ACTIVE, which itself creates EvaluationCycle cycle_index 1"
          - "increments Placement.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: POST /wbl/training-plans creates a newer plan for the same placement"
        actor: system
        preconditions:
          - "an earlier plan on this placement has status IN {DRAFT, SUBMITTED, CHANGES_REQUESTED, APPROVED}"
        side_effects:
          - "sets the earlier plan.status = SUPERSEDED"
          - "leaves Placement.compliance_status unchanged (already-granted clearance is not revoked by re-planning)"
  - entity: EvaluationCycle
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: PARTIAL
        trigger: "POST /wbl/evaluation-cycles/{cycleId}/evaluation"
        actor: EmployerSupervisor
        preconditions:
          - "cycle.cycle_status == OPEN"
          - "cycle.supervisor_eval_status == PENDING"
          - "X-User-ID == the Placement.supervisor_id of cycle.placement_id"
          - "Placement.compliance_status != BLOCKED"
        side_effects:
          - "sets cycle.supervisor_eval_status = SUBMITTED and the five rating_* fields"
          - "computes cycle.competency_score as the weighted supervisor rating"
        note: "dimension 1 of a parallel pair; cycle_status is the compound derivation of both dimensions"
      - from: OPEN
        to: PARTIAL
        trigger: "POST /wbl/evaluation-cycles/{cycleId}/reflection"
        actor: Student
        preconditions:
          - "cycle.cycle_status == OPEN"
          - "cycle.reflection_status IN {PENDING, RETURNED}"
          - "X-User-ID == the Placement.student_id of cycle.placement_id"
          - "Placement.compliance_status != BLOCKED"
        side_effects:
          - "sets cycle.reflection_status = SUBMITTED and stores cycle.reflection_text"
        note: "dimension 2 of the parallel pair — advances independently of the supervisor dimension"
      - from: PARTIAL
        to: PARTIAL
        trigger: "POST /wbl/evaluation-cycles/{cycleId}/reflection-decision with decision=RETURN"
        actor: WblCoordinator
        preconditions:
          - "cycle.reflection_status == SUBMITTED"
          - "cycle.reflection_returned_count < 2"
        side_effects:
          - "sets cycle.reflection_status = RETURNED and increments cycle.reflection_returned_count by 1"
      - from: PARTIAL
        to: PARTIAL
        trigger: "POST /wbl/evaluation-cycles/{cycleId}/reflection"
        actor: Student
        preconditions:
          - "cycle.reflection_status == RETURNED"
        side_effects:
          - "sets cycle.reflection_status = SUBMITTED and replaces cycle.reflection_text"
        note: "reflection sub-cycle SUBMITTED <-> RETURNED, capped at 2 returns"
      - from: PARTIAL
        to: PARTIAL
        trigger: "POST /wbl/evaluation-cycles/{cycleId}/reflection-decision with decision=ACCEPT while the supervisor dimension is still PENDING"
        actor: WblCoordinator
        preconditions:
          - "cycle.reflection_status == SUBMITTED"
          - "cycle.supervisor_eval_status == PENDING"
        side_effects:
          - "sets cycle.reflection_status = ACCEPTED and leaves cycle_status = PARTIAL"
          - "leaves Placement.closed_cycle_count unchanged and creates no successor cycle"
        note: "one dimension terminal is not enough — the compound derivation keeps the cycle PARTIAL until the supervisor dimension also finishes"
      - from: PARTIAL
        to: CLOSED
        trigger: "POST /wbl/evaluation-cycles/{cycleId}/reflection-decision with decision=ACCEPT"
        actor: WblCoordinator
        preconditions:
          - "cycle.reflection_status == SUBMITTED"
          - "cycle.supervisor_eval_status == SUBMITTED"
        side_effects:
          - "sets cycle.reflection_status = ACCEPTED, cycle.cycle_status = CLOSED and cycle.closed_on = clock date"
          - "increments Placement.closed_cycle_count by 1 and re-derives Placement.credit_eligible"
          - "creates the next EvaluationCycle with cycle_index + 1, window_start = previous window_end + 1 day, window_end = window_start + 27 days, when Placement.closed_cycle_count < Placement.required_evaluation_cycles"
        note: "compound close requires BOTH parallel dimensions terminal; accepting the reflection while supervisor_eval_status == PENDING leaves the cycle PARTIAL"
      - from: PARTIAL
        to: CLOSED
        trigger: "POST /wbl/evaluation-cycles/{cycleId}/evaluation when the reflection is already ACCEPTED"
        actor: EmployerSupervisor
        preconditions:
          - "cycle.reflection_status == ACCEPTED"
          - "cycle.supervisor_eval_status == PENDING"
        side_effects:
          - "sets cycle.supervisor_eval_status = SUBMITTED, cycle.cycle_status = CLOSED and cycle.closed_on = clock date"
          - "increments Placement.closed_cycle_count by 1 and re-derives Placement.credit_eligible"
          - "creates the next EvaluationCycle when Placement.closed_cycle_count < Placement.required_evaluation_cycles"
        note: "join point reachable from either branch — the last dimension to finish closes the cycle"
      - from: OPEN
        to: SUSPENDED
        trigger: "system: Placement.compliance_status becomes BLOCKED"
        actor: system
        preconditions:
          - "cycle.cycle_status IN {OPEN, PARTIAL}"
        side_effects:
          - "freezes both dimensions; evaluation and reflection writes are rejected while SUSPENDED"
      - from: PARTIAL
        to: SUSPENDED
        trigger: "system: Placement.compliance_status becomes BLOCKED"
        actor: system
        preconditions:
          - "cycle.cycle_status == PARTIAL"
        side_effects:
          - "preserves both dimension values so the cycle can resume on unblock"
      - from: SUSPENDED
        to: PARTIAL
        trigger: "system: POST /wbl/placements/{placementId}/compliance-decision with decision=UNBLOCK"
        actor: system
        preconditions:
          - "cycle.cycle_status == SUSPENDED"
          - "exactly one of cycle.supervisor_eval_status / cycle.reflection_status has advanced past PENDING"
        side_effects:
          - "re-derives cycle_status from the two dimensions"
      - from: SUSPENDED
        to: OPEN
        trigger: "system: POST /wbl/placements/{placementId}/compliance-decision with decision=UNBLOCK"
        actor: system
        preconditions:
          - "cycle.cycle_status == SUSPENDED"
          - "cycle.supervisor_eval_status == PENDING AND cycle.reflection_status == PENDING"
        side_effects:
          - "re-derives cycle_status from the two dimensions"
      - from: OPEN
        to: CANCELLED
        trigger: "system: Placement reaches COMPLETED or TERMINATED, or PartnershipAgreement reaches TERMINATED"
        actor: system
        preconditions:
          - "cycle.cycle_status IN {OPEN, PARTIAL, SUSPENDED}"
        side_effects:
          - "cycle is excluded from Placement.closed_cycle_count permanently"
      - from: PARTIAL
        to: CANCELLED
        trigger: "system: Placement reaches COMPLETED or TERMINATED, or PartnershipAgreement reaches TERMINATED"
        actor: system
        preconditions:
          - "cycle.cycle_status IN {OPEN, PARTIAL, SUSPENDED}"
        side_effects:
          - "cycle is excluded from Placement.closed_cycle_count permanently"

  - entity: IncidentReport
    initial_state: REPORTED
    terminal_states: [UNSUBSTANTIATED, CLOSED]
    transitions:
      - from: REPORTED
        to: SUBSTANTIATED
        trigger: "POST /wbl/incident-reports/{incidentId}/finding with finding=SUBSTANTIATED"
        actor: ComplianceOfficer
        preconditions:
          - "incident.status == REPORTED"
        side_effects:
          - "re-derives incident.osha_recordable"
          - "increments the matching EmployerPartner.substantiated_<severity>_count and recomputes safety_score / posture via calculations.employer_safety_score_posture"
          - "when severity == CRITICAL: hop 1 sets Worksite.safety_status = FAILED and Worksite.safety_review_expires_on = null"
          - "when severity == CRITICAL: hop 2 the -50 critical penalty drops safety_score below 50 so EmployerPartner.posture becomes SUSPENDED"
          - "when severity == CRITICAL: hop 3 every Placement of that worksite with lifecycle_status IN {PROPOSED, ACTIVE} moves compliance_status -> BLOCKED"
          - "when severity == CRITICAL: hop 4 every EvaluationCycle of those placements with cycle_status IN {OPEN, PARTIAL} moves to SUSPENDED"
          - "when severity IN {MINOR, MODERATE}: every Placement of that worksite with lifecycle_status IN {PROPOSED, ACTIVE} and compliance_status IN {PENDING_REVIEW, CLEARED} moves to FLAGGED"
        note: "branch 1 — depth-4 transitive cascade on CRITICAL"
      - from: REPORTED
        to: UNSUBSTANTIATED
        trigger: "POST /wbl/incident-reports/{incidentId}/finding with finding=UNSUBSTANTIATED"
        actor: ComplianceOfficer
        preconditions:
          - "incident.status == REPORTED"
        side_effects:
          - "sets incident.coverage_determination = NOT_COVERED and incident.closed_on = clock date"
          - "leaves EmployerPartner.safety_score and every Placement.compliance_status unchanged"
        note: "branch 2 — divergent side-effect set: no score penalty, no cascade"
      - from: SUBSTANTIATED
        to: CLOSED
        trigger: "POST /wbl/incident-reports/{incidentId}/coverage"
        actor: ComplianceOfficer
        preconditions:
          - "incident.status == SUBSTANTIATED"
        side_effects:
          - "sets incident.coverage_determination per calculations.insurance_coverage_determination"
          - "sets incident.determined_by_user_id = X-User-ID and incident.closed_on = clock date"

  - entity: PlacementOutcome
    initial_state: RECORDED
    terminal_states: [VERIFIED, LATE_UNVERIFIABLE]
    transitions:
      - from: RECORDED
        to: VERIFIED
        trigger: "POST /wbl/placement-outcomes/{outcomeId}/verify"
        actor: WblCoordinator
        preconditions:
          - "outcome.status == RECORDED"
          - "outcome.verification_source IN {EMPLOYER_LETTER, ENROLLMENT_RECORD}"
        side_effects:
          - "sets outcome.verified_on = clock date and re-derives outcome.counts_positive"
      - from: RECORDED
        to: LATE_UNVERIFIABLE
        trigger: "system sweep on POST /wbl/_clock/set_current_utc when the new clock date is more than 180 days after Placement.completed_on"
        actor: system
        preconditions:
          - "outcome.status == RECORDED"
          - "new clock date > Placement.completed_on + 180 days"
        side_effects:
          - "outcome is excluded from the numerator of calculations.outcome_rate but stays in the denominator"

concurrency_rules:
  - rule_id: placement-create-stale-worksite
    parent_entity: Worksite
    write_endpoint: "POST /wbl/placements"
    occ_field: "expected_worksite_version"
    description: |
      Creating a Placement against a Worksite whose version has advanced since
      the coordinator last read it is rejected. The stale view is the problem:
      a safety decision, an incident cascade, or another placement creation may
      have changed the worksite's safety_status or slots_committed after the
      read, so the capacity and safety facts the request was built on no longer
      hold.
    error_id: ERR_STALE_WORKSITE_VERSION
    http_status: 412
  - rule_id: safety-review-create-stale-worksite
    parent_entity: Worksite
    write_endpoint: "POST /wbl/safety-reviews"
    occ_field: "expected_worksite_version"
    description: |
      Filing a WorksiteSafetyReview supersedes the worksite's prior decided
      review, so a reviewer whose observed worksite version is stale is
      rejected: the review they are superseding may already have been replaced
      by a newer decision recorded after their read.
    error_id: ERR_STALE_WORKSITE_VERSION
    http_status: 412
  - rule_id: training-plan-create-stale-placement
    parent_entity: Placement
    write_endpoint: "POST /wbl/training-plans"
    occ_field: "expected_placement_version"
    description: |
      Creating a TrainingPlan supersedes any existing plan on the placement, so
      a writer holding a stale placement version is rejected: the plan they
      intend to supersede may already have been approved (advancing the
      placement's compliance and lifecycle dimensions) after their read.
    error_id: ERR_STALE_PLACEMENT_VERSION
    http_status: 412
calculations:
  - name: wage_settlement
    trigger: "recomputed on POST /wbl/timesheet-entries and POST /wbl/timesheet-entries/{entryId}/void (refreshing Placement.provisional_wage_cents and Placement.final_wage_cents); frozen into Placement.settled_wage_cents by POST /wbl/placements/{placementId}/settle-wages; previewable via GET /wbl/placements/{placementId}/wage-preview"
    algorithm: aggregation
    formula: |
      effective_rate_cents =
        pay_classification == PAID     -> hourly_wage_cents
        pay_classification == STIPEND  -> 0
        pay_classification == UNPAID   -> 0

      # ordered input set: this placement's TimesheetEntry rows with status == LOGGED,
      # processed created_at ASC (order does not change either result, but is pinned
      # so the two variants are reproducible)

      # VARIANT PROVISIONAL — round per entry, then sum
      provisional_wage_cents = sum over entries of
          round_half_up(entry.hours_worked * effective_rate_cents)      # integer cents per entry
      if pay_classification == STIPEND: provisional_wage_cents = stipend_total_cents

      # VARIANT FINAL — sum hours first, then round once
      total_hours = round_half_up(sum over entries of entry.hours_worked, 2)
      final_wage_cents = round_half_up(total_hours * effective_rate_cents)
      if pay_classification == STIPEND: final_wage_cents = stipend_total_cents

      # settle-wages freezes exactly one of the two:
      settled_wage_cents = (mode == PROVISIONAL) ? provisional_wage_cents : final_wage_cents
      wage_settlement_mode = mode
      EmployerPartner.wage_liability_cents = sum of settled_wage_cents over that
          partner's placements whose wage_settlement_mode == FINAL
    input_set: "TimesheetEntry rows of the placement with status == LOGGED (VOIDED rows are excluded from both variants), ordered created_at ASC"
    constants:
      MIN_WAGE_CENTS: 1500
      LEARNER_WAGE_FLOOR_CENTS: 1275
    precision: "integer cents; round_half_up at every rounding step; nested rounding order is PINNED per variant (per-entry rounding for PROVISIONAL, single terminal rounding for FINAL)"
    variants:
      - name: PROVISIONAL
        when: "mode=PROVISIONAL supplied to POST /wbl/placements/{placementId}/settle-wages, and always for Placement.provisional_wage_cents"
        difference: "rounds each entry's hours * rate to whole cents before summing, so each entry can gain up to half a cent of rounding"
      - name: FINAL
        when: "mode=FINAL supplied to POST /wbl/placements/{placementId}/settle-wages, and always for Placement.final_wage_cents; the only mode that feeds EmployerPartner.wage_liability_cents"
        difference: "sums hours first and rounds once, so per-entry rounding gains never accumulate; diverges from PROVISIONAL whenever two or more entries have a fractional-cent product"

  - name: academic_credit_award
    trigger: "POST /wbl/placements/{placementId}/award-credit; previewable via GET /wbl/placements/{placementId}/credit-preview"
    algorithm: threshold
    formula: |
      # VARIANT HOURS_BASED (credit_award_mode == HOURS_BASED)
      credits = min(credit_target_credits,
                    floor(total_verified_hours / HOURS_PER_HALF_CREDIT) * 0.50)

      # VARIANT COMPETENCY_BASED (credit_award_mode == COMPETENCY_BASED)
      closed = this placement's EvaluationCycle rows with cycle_status == CLOSED
      mean_score = round_half_up(sum(closed.competency_score) / count(closed), 2)
      credits = min(credit_target_credits,
                    round_half_up(credit_target_credits * mean_score / MAX_RATING, 2))
      # count(closed) == 0 is unreachable: credit_eligible requires
      # closed_cycle_count >= required_evaluation_cycles >= 1

      # competency_score per cycle, written when the supervisor evaluation is submitted:
      competency_score = round_half_up(
          0.30 * rating_technical + 0.20 * rating_communication +
          0.20 * rating_reliability + 0.20 * rating_safety +
          0.10 * rating_initiative, 2)

      Placement.credits_awarded = credits
      Student.credits_earned_wbl = sum of credits_awarded over that student's placements
    input_set: "For HOURS_BASED: Placement.total_verified_hours (LOGGED TimesheetEntry rows only). For COMPETENCY_BASED: EvaluationCycle rows of the placement with cycle_status == CLOSED, ordered cycle_index ASC; SUSPENDED and CANCELLED cycles are excluded."
    constants:
      HOURS_PER_HALF_CREDIT: 45
      MAX_RATING: 5.00
    precision: "credits to 2 decimals, round_half_up; hour tiers use floor division so 44.99 hours awards 0.00"
    variants:
      - name: HOURS_BASED
        when: "Placement.credit_award_mode == HOURS_BASED"
        difference: "seat-time model — credits step in 0.50 blocks per 45 verified clock hours and ignore supervisor ratings entirely"
      - name: COMPETENCY_BASED
        when: "Placement.credit_award_mode == COMPETENCY_BASED"
        difference: "mastery model — credits scale continuously with the mean CLOSED-cycle competency_score and ignore hours entirely, so identical data yields a different credit figure than HOURS_BASED"

  - name: child_labor_hour_ledger
    trigger: "POST /wbl/timesheet-entries (pre-write gate producing ERR_DAILY_HOUR_CAP_EXCEEDED, ERR_WEEKLY_HOUR_CAP_EXCEEDED, ERR_NIGHT_WORK_PROHIBITED); recomputed on POST /wbl/timesheet-entries/{entryId}/void"
    algorithm: threshold
    formula: |
      band = Placement.permit_class_at_start
      caps[MINOR_14_15]  = { daily_school: 3.00, daily_non_school: 8.00,
                             weekly_school: 18.00, weekly_non_school: 40.00,
                             earliest: "07:00", night_cutoff: "19:00" }
      caps[MINOR_16_17]  = { daily_school: 4.00, daily_non_school: 8.00,
                             weekly_school: 28.00, weekly_non_school: 48.00,
                             earliest: "06:00", night_cutoff: "22:00" }
      caps[ADULT_18_PLUS] = none (no hour or night restriction)

      candidate_hours = round_half_up((minutes(end_time) - minutes(start_time)
                                       - break_minutes) / 60, 2)

      # 1. night / early window (band != ADULT_18_PLUS)
      if start_time < caps[band].earliest or end_time > caps[band].night_cutoff
         -> ERR_NIGHT_WORK_PROHIBITED

      # 2. daily ledger — same student, same work_date, ALL placements
      day_total = sum(TimesheetEntry.hours_worked where status == LOGGED
                      and student == this student and work_date == this work_date)
      daily_cap = is_school_day ? caps[band].daily_school : caps[band].daily_non_school
      if day_total + candidate_hours > daily_cap -> ERR_DAILY_HOUR_CAP_EXCEEDED

      # 3. weekly ledger — Sunday-start week (Sunday..Saturday) containing work_date
      week_start = work_date - weekday_index(work_date)      # Sunday == index 0
      week_total = sum(TimesheetEntry.hours_worked where status == LOGGED
                       and student == this student
                       and work_date BETWEEN week_start AND week_start + 6 days)
      weekly_cap = is_school_day ? caps[band].weekly_school : caps[band].weekly_non_school
      if week_total + candidate_hours > weekly_cap -> ERR_WEEKLY_HOUR_CAP_EXCEEDED

      # boundary semantics are STRICTLY GREATER THAN: a candidate that lands
      # exactly on the cap is accepted; cap + 0.01 is rejected
    input_set: "TimesheetEntry rows with status == LOGGED across every Placement of the same Student (cross-placement ledger); VOIDED rows are removed from both the daily and weekly totals"
    constants:
      SCHOOL_DAY_CAP_14_15: 3.00
      SCHOOL_DAY_CAP_16_17: 4.00
      NON_SCHOOL_DAY_CAP: 8.00
      SCHOOL_WEEK_CAP_14_15: 18.00
      SCHOOL_WEEK_CAP_16_17: 28.00
      NON_SCHOOL_WEEK_CAP_14_15: 40.00
      NON_SCHOOL_WEEK_CAP_16_17: 48.00
      WEEK_START_WEEKDAY: SUNDAY
    precision: "hours to 2 decimals, round_half_up; comparisons use > (not >=) against the cap"

  - name: employer_safety_score_posture
    trigger: "recomputed on POST /wbl/safety-reviews/{reviewId}/decision and POST /wbl/incident-reports/{incidentId}/finding; sets EmployerPartner.safety_score and EmployerPartner.posture"
    algorithm: weighted_scoring
    formula: |
      minor    = count(IncidentReport where worksite.employer_partner_id == partner.id
                       and status IN {SUBSTANTIATED, CLOSED} and severity == MINOR)
      moderate = same with severity == MODERATE
      critical = same with severity == CRITICAL
      conditional_sites = count(Worksite where employer_partner_id == partner.id
                                and safety_status == CONDITIONAL)

      raw = 100 - (MINOR_PENALTY * minor) - (MODERATE_PENALTY * moderate)
                - (CRITICAL_PENALTY * critical) - (CONDITIONAL_SITE_PENALTY * conditional_sites)
      safety_score = min(SCORE_CEILING, max(SCORE_FLOOR, raw))

      # posture is decided in THIS order; the first matching clause wins
      1. if any Worksite of the partner has safety_status == FAILED
         or safety_score < SUSPEND_THRESHOLD            -> SUSPENDED
      2. elif safety_score < PROBATION_THRESHOLD        -> PROBATION
      3. elif at least one Worksite has safety_status IN {APPROVED, CONDITIONAL}
                                                        -> ELIGIBLE
      4. else                                           -> PROSPECT
    input_set: "IncidentReport rows with status IN {SUBSTANTIATED, CLOSED} on any worksite of the partner (REPORTED and UNSUBSTANTIATED rows never score), plus the partner's Worksite rows by safety_status"
    constants:
      MINOR_PENALTY: 15
      MODERATE_PENALTY: 30
      CRITICAL_PENALTY: 50
      CONDITIONAL_SITE_PENALTY: 10
      SCORE_FLOOR: 0
      SCORE_CEILING: 100
      SUSPEND_THRESHOLD: 50
      PROBATION_THRESHOLD: 70
    precision: "integer score, clamped to 0..100; thresholds are strict less-than so a score of exactly 50 is not SUSPENDED on score alone and exactly 70 is not PROBATION"

  - name: reimbursement_admin_fee
    trigger: "GET /wbl/placements/{placementId}/reimbursement"
    algorithm: tiered_pricing
    formula: |
      logged_days = count(DISTINCT work_date over this placement's TimesheetEntry
                          rows with status == LOGGED)

      transport_cents =
        DISTRICT_BUS    -> 0
        PUBLIC_TRANSIT  -> TRANSIT_PASS_BLOCK_CENTS * ceil(logged_days / TRANSIT_BLOCK_DAYS)
        SELF            -> round_half_up(MILEAGE_CENTS_PER_MILE
                                         * commute_round_trip_miles * logged_days)
        GUARDIAN        -> round_half_up(MILEAGE_CENTS_PER_MILE
                                         * commute_round_trip_miles * logged_days
                                         * GUARDIAN_FACTOR)

      stipend_cents = SUPERVISOR_STIPEND_PER_CLOSED_CYCLE_CENTS
                      * Placement.closed_cycle_count

      # EVALUATION ORDER IS PINNED — the tier is keyed on the PRE-FEE subtotal only.
      # The fee is never fed back into the tier lookup, so `total` is well defined
      # even though total = subtotal + fee and the fee rate is a function of a total-like
      # quantity.
      subtotal_cents = transport_cents + stipend_cents

      tier = subtotal_cents <= TIER_1_MAX_CENTS -> { name: TIER_1, rate: 0.10 }
             subtotal_cents <= TIER_2_MAX_CENTS -> { name: TIER_2, rate: 0.075 }
             otherwise                          -> { name: TIER_3, rate: 0.05 }

      admin_fee_cents = round_half_up(subtotal_cents * tier.rate)
      total_cents     = subtotal_cents + admin_fee_cents
    input_set: "DISTINCT work_date values of the placement's TimesheetEntry rows with status == LOGGED, plus the placement's EvaluationCycle rows with cycle_status == CLOSED"
    constants:
      TRANSIT_PASS_BLOCK_CENTS: 4500
      TRANSIT_BLOCK_DAYS: 30
      MILEAGE_CENTS_PER_MILE: 50
      GUARDIAN_FACTOR: 0.65
      SUPERVISOR_STIPEND_PER_CLOSED_CYCLE_CENTS: 7500
      TIER_1_MAX_CENTS: 20000
      TIER_2_MAX_CENTS: 50000
    precision: "integer cents, round_half_up; tier boundaries are inclusive (<=), so a subtotal of exactly 20000 uses TIER_1 rate 0.10"

  - name: outcome_rate
    trigger: "GET /wbl/reports/outcome-rate"
    algorithm: aggregation
    formula: |
      cohort = Placement rows with lifecycle_status == COMPLETED and
               completed_on BETWEEN from_date AND to_date (both inclusive)
      denominator = count(cohort)
      numerator   = count(PlacementOutcome rows whose placement_id is in cohort
                          and counts_positive == true)
      # PlacementOutcome rows with status IN {RECORDED, LATE_UNVERIFIABLE} never
      # count toward the numerator but their placements stay in the denominator
      positive_rate = denominator == 0 ? 0.0000
                                       : round_half_up(numerator / denominator, 4)
    input_set: "Placement rows with lifecycle_status == COMPLETED whose completed_on falls in the inclusive request window; at most one PlacementOutcome per placement"
    constants:
      EMPTY_COHORT_RATE: 0.0000
    precision: "4 decimals, round_half_up; empty cohort returns exactly 0.0000 with denominator 0 rather than an error"

  - name: student_eligibility_status
    trigger: "POST /wbl/students and PATCH /wbl/students/{studentId}/academics; sets Student.eligibility_status"
    algorithm: threshold
    formula: |
      # first matching clause wins — order is PINNED
      1. grade_level < MIN_GRADE_LEVEL      -> INELIGIBLE_GRADE
      2. gpa < MIN_GPA                      -> INELIGIBLE_ACADEMIC
      3. attendance_rate < MIN_ATTENDANCE   -> INELIGIBLE_ATTENDANCE
      4. otherwise                          -> ELIGIBLE
    input_set: "the Student row's own grade_level, gpa and attendance_rate as last written"
    constants:
      MIN_GRADE_LEVEL: 10
      MIN_GPA: 2.00
      MIN_ATTENDANCE: 0.90
    precision: "gpa 2 decimals, attendance_rate 2 decimals; comparisons are strict less-than so gpa exactly 2.00 is ELIGIBLE"

  - name: insurance_coverage_determination
    trigger: "POST /wbl/incident-reports/{incidentId}/coverage; sets IncidentReport.coverage_determination"
    algorithm: constraint_propagation
    formula: |
      occurred_date = date part of IncidentReport.occurred_at
      comp_current  = EmployerPartner.workers_comp_expires_on >= occurred_date

      # first matching clause wins — order is PINNED
      1. comp_current AND Placement.pay_classification == PAID
                                              -> WORKERS_COMP
      2. Placement.pay_classification IN {UNPAID, STIPEND}
         AND PartnershipAgreement.insurance_rider == true
                                              -> DISTRICT_LIABILITY
      3. comp_current == false                -> EMPLOYER_LIABILITY_UNINSURED
      4. otherwise                            -> NOT_COVERED
    input_set: "the incident's Placement (pay_classification), its PartnershipAgreement (insurance_rider) and the worksite's EmployerPartner (workers_comp_expires_on)"
    constants:
      COVERAGE_DEFAULT: NOT_COVERED
    precision: "date comparison is inclusive: a policy expiring exactly on the incident date is still current"
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "for entity_backed roles, X-User-ID equals the resource's owning foreign key: EmployerSupervisor acting on an EvaluationCycle/TimesheetEntry must equal the Placement.supervisor_id, Student acting on a reflection must equal the Placement.student_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /wbl/agreements/{agreementId}/employer-sign, POST /wbl/timesheet-entries, POST /wbl/evaluation-cycles/{cycleId}/evaluation, POST /wbl/evaluation-cycles/{cycleId}/reflection"
  - priority: 4
    category: auth
    check: "the X-User-ID awarding academic credit differs from TrainingPlan.approved_by_user_id (segregation of duties between plan approval and credit award)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /wbl/placements/{placementId}/award-credit"
  - priority: 5
    category: auth
    check: "the X-User-ID executing an agreement differs from PartnershipAgreement.created_by_user_id (no self-execution of a drafted agreement)"
    error_id: ERR_SELF_EXECUTION_PROHIBITED
    http_status: 403
    applies_to: "POST /wbl/agreements/{agreementId}/execute"
  - priority: 6
    category: existence
    check: "every path-parameter resource exists, validated left to right: ERR_EMPLOYER_NOT_FOUND, ERR_WORKSITE_NOT_FOUND, ERR_REVIEW_NOT_FOUND, ERR_SUPERVISOR_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_STUDENT_NOT_FOUND, ERR_PERMIT_NOT_FOUND, ERR_PLACEMENT_NOT_FOUND, ERR_PLAN_NOT_FOUND, ERR_ENTRY_NOT_FOUND, ERR_CYCLE_NOT_FOUND, ERR_INCIDENT_NOT_FOUND, ERR_OUTCOME_NOT_FOUND"
    error_id: ERR_PLACEMENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 7
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row, validated in the order the fields are declared in §1.1"
    error_id: ERR_WORKSITE_NOT_FOUND
    http_status: 404
