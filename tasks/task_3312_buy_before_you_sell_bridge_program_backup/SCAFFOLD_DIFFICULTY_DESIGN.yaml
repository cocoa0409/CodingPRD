              as: Coordinator
              captures: { q_id: $.data.id }
            - call: "POST /knock/qualifications/${q_id}/approve"
              payload: {}
              as: Coordinator
            - call: "POST /knock/bridge-programs"
              payload: { homeowner_id: "${h_id}", qualification_id: "${q_id}", new_property_id: "${new_id}", departing_property_id: "${dep_id}", projected_carry_months: 4 }
              as: Coordinator
              captures: { bp_id: $.data.id }
          trigger:
            - call: "POST /knock/backup-offers"
              payload: { departing_property_id: "${dep_id}", bridge_program_id: "${bp_id}", offer_price_cents: 42000000, window_days: 30, window_start: "2026-09-01T00:00:00Z" }
              as: Coordinator
              captures: { e1: $.data.error_id }
          assert:
            - "response error_id == ERR_REGULATORY_PRICE_FLOOR — the priority-18 safety check fires before the priority-29 appraisal-staleness check"
            - "the floor 42500000 exceeds the offered 42000000 by 500000"
      - name: referential_over_fiscal_referral
