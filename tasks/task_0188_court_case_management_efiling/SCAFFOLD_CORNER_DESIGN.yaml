      - name: immediate_posture_visible_in_same_response
        claim_type: immediate
        grounds:
          - calculations.case_posture
          - entities.Case.fields.posture
        distinguishing_aspect: |
          After two PENDING deadlines push the case to the RESTRICTED threshold, the
          recomputed posture is visible in the very next GET /cases response (immediate
          consistency); RESTRICTED blocks new motion filing with ERR_CASE_RESTRICTED.
        test_recipe:
          setup:
            - "An OPEN case loaded with PENDING deadlines until open_deadline_count reaches the POSTURE_DEADLINE_LIMIT of 5 (status deadline on open = 1, plus 4 manual)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
