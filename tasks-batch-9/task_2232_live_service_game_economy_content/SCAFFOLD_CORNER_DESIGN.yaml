          - errors[ERR_UNAUTHORIZED]
          - endpoints["POST /offers"]
          - endpoints["POST /offers/{offer_id}/review"]
          - endpoints["POST /players/{player_id}/spend-guard"]
        distinguishing_aspect: |
          Every attempt to reach across the role boundary returns ERR_UNAUTHORIZED (403) and
          mutates nothing: ContentProducer cannot author an offer, EconomyDesigner and
          LiveOpsCommander cannot review one, ComplianceOfficer cannot open a season and a Player
          cannot operate a spend guard.
        test_recipe:
          setup:
