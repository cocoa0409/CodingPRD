              as: ContentManager
              captures: { zone_cluster_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${zone_cluster_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { zone_store_id: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
