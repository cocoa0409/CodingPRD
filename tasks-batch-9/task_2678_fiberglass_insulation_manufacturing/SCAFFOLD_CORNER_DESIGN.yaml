            - "${err_not_staged} == \"ERR_CULLET_BATCH_NOT_STAGED\" with HTTP 409: B2 exists and belongs to this plant but is REJECTED, and one bad element voids the whole charge"
            - "the first refusal is atomic: ProductionRun.${run_a}.run_status is STILL SCHEDULED, CulletBatch.${b1}.status is STILL STAGED, and Plant.${plant_id}.cullet_charged_kg_ytd is STILL 0.00 — B1 was not charged even though it was listed first and was perfectly valid"
            - "${err_no_batch} == \"ERR_CULLET_BATCH_NOT_FOUND\" with HTTP 404: an unresolvable element of cullet_batch_ids is a body-FK failure (priority 25) and is reported BEFORE any status check"
            - "the third call succeeds: run_status == MELTING, cullet_charged_kg == 1500.00, virgin_batch_kg == 8500.00, total_charge_kg == 10000.00, cullet_fraction == 0.1500, and melt_posture stays OPEN because 0.1500 < 0.28"
            - "start-cure then leaves ProductionRun.${run_a}.run_status == CURING with cure_index == 110.00"
            - "${err_window} == \"ERR_CULLET_REVERSAL_WINDOW_CLOSED\" with HTTP 409: the reversal window is keyed to the RUN, and it closed the moment the run left MELTING"
            - "after the refused reversal CulletBatch.${b1}.status is STILL CHARGED with charged_run_id == ${run_a}, Plant.${plant_id}.cullet_charged_kg_ytd is STILL 1500.00 and cullet_on_hand_kg is STILL 0.00 — the glass ledger did not drift"

