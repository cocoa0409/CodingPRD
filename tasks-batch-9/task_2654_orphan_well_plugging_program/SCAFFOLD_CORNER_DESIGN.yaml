  - section: validations
    instances:
      - name: forfeiting_a_solvent_operators_bond_is_rejected_before_the_generic_edge_check
        claim_type: Conditional validation
        grounds:
          - validations[priority 39].ERR_OPERATOR_STILL_SOLVENT
          - validations[priority 40].ERR_INVALID_STATE_TRANSITION
          - state_machines.Operator.transitions.INSOLVENT_to_REVOKED
        distinguishing_aspect: |
          FORFEIT_BOND is an edge out of INSOLVENT only, so the generic priority-40 edge check would
          answer first and make the specific error unreachable. Rule 39 is deliberately numbered
          ahead of it: the ACTIVE operator must be told ERR_OPERATOR_STILL_SOLVENT, and after
          DECLARE_INSOLVENT the very same payload succeeds and mints the forfeited-bond source.
        test_recipe:
          setup:
            - "one ACTIVE Operator holding a single 2500 ft well, bond_amount_cents exactly equal to its 250000 requirement"
            - "logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
