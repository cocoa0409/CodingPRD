      - name: admission_parallel_dimensions_move_independently
        claim_type: valid_transition
        grounds:
          - state_machines.Admission.stay_status
          - state_machines.Admission.payment_status
          - state_machines.Admission.documentation_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / admission_parallel_dimensions_advance_independently
          rationale: "The named §1.8 instance asserts the parallel-shape claim directly: discharge advances stay_status and payment_status while documentation_status stays POC_SIGNED."

      - name: screening_cycles_back_to_draft_and_reconcurs
        claim_type: valid_transition
        grounds:
          - state_machines.PreadmissionScreening.transitions.CHANGES_REQUESTED_to_DRAFT
          - endpoints[PATCH /screenings/{screeningId}]
        excluded_because:
          difficulty_instance: non_linear_state_machine / screening_revision_cycle_returns_to_draft_and_reconcurs
          rationale: "The cyclic shape, the PATCH revision transition and revision_count 1 are all asserted by the named §1.8 instance."

      - name: therapy_week_met_reverts_after_void
        claim_type: valid_transition
        grounds:
          - state_machines.TherapyWeek.transitions.MET_to_NOT_MET
        excluded_because:
          difficulty_instance: non_linear_state_machine / therapy_week_met_reverts_to_not_met_after_void
          rationale: "The MET -> NOT_MET revert and its recomputed minute totals are asserted by the named §1.8 instance."

      - name: delivered_session_void_compensates_minute_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines.TherapySession.transitions.DELIVERED_to_VOIDED
        excluded_because:
          difficulty_instance: compensating_invariant / void_after_deliver_restores_week_and_admission_minute_ledgers
          rationale: "The compensation pattern (every minute side effect of delivery reversed with no drift) is asserted by the named §1.8 instance."

      - name: discharge_cascade_reaches_facility_and_screenings
        claim_type: side_effect_execution
        grounds:
          - state_machines.Admission.transitions.ADMITTED_to_DISCHARGED
          - state_machines.PreadmissionScreening.transitions.SUBMITTED_to_ON_HOLD
        excluded_because:
          difficulty_instance: transitive_cascade / discharge_cascade_freezes_facility_and_holds_screenings
          rationale: "The five-hop cascade down to screening ON_HOLD is asserted end-to-end by the named §1.8 instance."

      - name: chain_head_reopens_when_continuation_attaches
        claim_type: valid_transition
        grounds:
          - state_machines.Admission.transitions.PRICED_to_REOPENED
          - state_machines.ComplianceReview.transitions.COMPUTED_to_STALE
        excluded_because:
          difficulty_instance: transitive_cascade / interrupted_stay_attach_reopens_head_and_stales_review
          rationale: "PRICED -> REOPENED and the COMPUTED -> STALE review cascade are asserted by the named §1.8 instance."

      - name: rescind_interruption_returns_continuation_to_not_priced
        claim_type: valid_transition
        grounds:
          - state_machines.Admission.transitions.CONSOLIDATED_to_NOT_PRICED
        excluded_because:
          difficulty_instance: compensating_invariant / rescind_interruption_restores_head_pricing_and_facility_ledger
          rationale: "The CONSOLIDATED -> NOT_PRICED transition and every reversed side effect are asserted by the named §1.8 instance."

