        claim_type: Computed read
        grounds:
          - endpoints.POST_/rail/timetables/{id}/publish
          - state_machines.Timetable.RATIFIED_to_PUBLISHED
        distinguishing_aspect: "Publishing a 1-train timetable over a 1-day range on a 2-segment corridor materializes exactly 1 SCHEDULED TrainRun and exactly 2 PLANNED SegmentPassages linked to it."
        test_recipe:
          setup: ["ACTIVE agreement; ratified 1-run timetable."]
          setup_api_calls:
            - *k_clock
            - *k_host
            - *k_corr
            - *k_seg1
            - *k_seg2
            - *k_oa
            - *k_oa_act
