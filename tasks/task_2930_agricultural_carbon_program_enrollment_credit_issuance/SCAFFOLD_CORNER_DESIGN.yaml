              as_user_id: "admin-baseline-01"
              captures: { b1_id: $.data.id }
            - call: "POST /baselines/${b1_id}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-baseline-01"
            - call: "POST /enrollments/${e1_id}/data-packets"
              payload: { crop_year: 2026, source: "FARM_RECORD", reported_acres: 1000.00, coverage_pct: 92.00 }
              as: ProgramAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /data-packets/${p1_id}/qc"
              payload: { decision: "PASS" }
              as: ProgramAdmin
            - call: "GET /enrollments/${e1_id}"
              payload: {}
              as: ProgramAdmin
              captures: { e1_v2: $.data.version }
            - call: "POST /quantification-runs"
              payload: { enrollment_id: "${e1_id}", baseline_id: "${b1_id}", crop_year: 2026, method: "MODEL", expected_enrollment_version: "${e1_v2}" }
              as: ProgramAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /quantification-runs/${r1_id}/submit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /verification-bodies"
              payload: { name: "OCC Verify", accreditation_id: "ACC-1315", accredited_practices: ["COVER_CROP"], max_concurrent_visits: 2 }
              as: ProgramAdmin
              captures: { vb1_id: $.data.id }
            - call: "POST /verifications"
              payload: { quantification_run_id: "${r1_id}", verification_body_id: "${vb1_id}", sample_pct: 10.00, site_visit_start: "2026-07-01T00:00:00Z", site_visit_end: "2026-07-03T00:00:00Z" }
              as: ProgramAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /verifications/${v1_id}/opine"
              payload: { opinion: "POSITIVE" }
              as: Verifier
              as_user_id: "${vb1_id}"
            - call: "POST /quantification-runs/${r1_id}/issue"
              payload: { vintage_year: 2026 }
              as: ProgramAdmin
              captures: { cb1_id: $.data.id, cb1_v1: $.data.version }
            - call: "POST /credit-batches/${cb1_id}/list"
              payload: { registry_account_ref: "REG-ACCT-OCC" }
              as: RegistryOfficer
          trigger:
            - call: "POST /credit-batches/${cb1_id}/cancel"
              payload: { cancellation_reason: "issued against the wrong vintage", expected_credit_batch_version: "${cb1_v1}" }
              as: RegistryOfficer
              captures: { stale_err: $.data.error_id }
            - call: "GET /credit-batches/${cb1_id}"
              payload: {}
              as: RegistryOfficer
              captures: { cb1_v2: $.data.version }
            - call: "POST /credit-batches/${cb1_id}/cancel"
              payload: { cancellation_reason: "issued against the wrong vintage", expected_credit_batch_version: "${cb1_v2}" }
              as: RegistryOfficer
            - call: "GET /buffer-accounts"
              payload: { pool_code: "PROGRAM_BUFFER" }
              as: RegistryOfficer
          assert:
            - "the cancel carrying the issuance-time version returns HTTP 412 with error_id ERR_STALE_BATCH_VERSION"
            - "the re-read batch still reports issuance_status == \"ISSUED\", registry_status == \"LISTED\" and registry_account_ref == \"REG-ACCT-OCC\", with version ${cb1_v2} == ${cb1_v1} + 1 (the listing's bump only)"
            - "the retried cancel carrying ${cb1_v2} returns HTTP 200 with data.issuance_status == \"CANCELLED\" and data.cancellation_reason == \"issued against the wrong vintage\""
            - "after the successful cancellation the buffer pool reports balance_credits == 0 and outstanding_issued_credits == 0 while next_serial_number stays 233 — the compensation releases credits but never rewinds the serial counter"

      - name: baseline_approval_cascade_reaches_three_entities_in_one_write
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.Baseline.transitions.PROPOSED_to_APPROVED
        excluded_because:
          difficulty_instance: transitive_cascade / baseline_approval_three_hop_cascade
          rationale: "The named §1.8 instance walks the full Baseline -> Enrollment -> Field -> Grower chain end-to-end with pinned acreage figures, including the ordering sensitivity of hop 3 on hop 2."
      - name: reversal_assessment_cascade_reaches_seven_entities_in_one_write
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.ReversalEvent.transitions.REPORTED_to_ASSESSED
        excluded_because:
          difficulty_instance: transitive_cascade / reversal_assessment_seven_hop_cascade
          rationale: "The named §1.8 instance drives the seven-hop assessment cascade end-to-end, including the partial-coverage waterfall and the conditional clawback hop."
      - name: baseline_variants_produce_different_uncertainty_and_tonnage
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.baseline_establishment.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / baseline_historical_vs_modeled_divergence
          rationale: "The named §1.8 instance computes both variants over identical inputs and pins the delta; the corner walk adds only the clamp boundaries, which are covered by the separate calculations-section instance."
      - name: risk_tier_thresholds_switch_the_buffer_percentage_at_the_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations.credit_issuance_split.constants.TIER_MEDIUM_MIN_CREDITS
        excluded_because:
          difficulty_instance: combinatorial_formula / issuance_split_pinned_evaluation_order
          rationale: "The named §1.8 instance pins the cumulative tier_basis boundary at 1005 credits against TIER_MEDIUM_MIN_CREDITS 1000, including the wrong-basis variant that would fall back under the threshold."

  - section: consistency_model
    instances:
      - name: approval_and_issuance_cascades_are_visible_immediately_in_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Baseline.transitions.PROPOSED_to_APPROVED
          - endpoints[POST /quantification-runs/{quantification_run_id}/issue]
          - endpoints[GET /grower-payments]
          - endpoints[GET /buffer-accounts]
        distinguishing_aspect: "Under the immediate consistency model every denormalised figure the two cascades touch — Enrollment.status, Field.status, Grower.total_enrolled_acres, Grower.lifetime_credits_issued, Enrollment.credits_issued_total, the buffer balance and the cascade-minted GrowerPayment — is already correct in the very next read, with no repeat read or delay tolerated."
        test_recipe:
          setup:
            - "one ACCEPTED PER_CREDIT enrollment (share 60.00) with a PROPOSED HISTORICAL_DATA baseline, a confirmed 1000.00-acre field and a grower whose total_enrolled_acres is 0.00"
            - "an accredited verification body ready to opine once the run is submitted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
