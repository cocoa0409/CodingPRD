# ===========================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2523 — Arena Changeover & Multipurpose Venue Operations
#
# Every literal in every `assert:` below was computed by executing the
# corresponding §1.3 formula and its `constants:` block as code. Shared fixture
# vocabulary used across instances (all values are literals, never placeholders):
#
#   VENUE            name "Lakeside Arena", rigging_capacity_kg 20000, dock_count 4,
#                    max_bowl_seats 18000, crew_headcount_cap 60,
#                    min_turnaround_buffer_minutes 45, dock_buffer_minutes 30,
#                    overnight_shift_start_local_hour 22
#   PROFILE ICE      ICE_HOCKEY        requires_ice true  ice_cover_required false
#                    FULL_BOWL      17000 seats base 240 crew 30 panels 0   dehum 120 rig 40
#   PROFILE CONCERT  CONCERT_END_STAGE requires_ice false ice_cover_required true
#                    CURTAINED_HALF  9000 seats base 300 crew 40 panels 120 dehum 0  rig 220
#   PROFILE COURT    COURT_BASKETBALL  requires_ice false ice_cover_required true
#                    RETRACTABLE_IN 15000 seats base 180 crew 24 panels 80  dehum 0  rig 60
#   PROFILE FAMILY   FAMILY_SHOW       requires_ice false ice_cover_required true
#                    FULL_BOWL      12000 seats base 200 crew 25 panels 40  dehum 0  rig 90
# ===========================================================================
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: turnaround_planned_variant_blind_to_rework_and_idle_minutes_while_actual_absorbs_them
        grounds:
          - calculations.changeover_turnaround_minutes
          - entities.ChangeoverOrder.fields.planned_turnaround_minutes
          - entities.ChangeoverOrder.fields.actual_turnaround_minutes
          - entities.ChangeoverOrder.fields.overrun_minutes
          - entities.Venue.fields.changeover_debt_minutes
          - state_machines.ChangeoverOrder.READY_FOR_SIGNOFF_to_SIGNED_OFF
        distinguishing_aspect: |
          The PLANNED variant is a forward_looking function of configuration rows only (two
          ConfigurationProfiles, Venue.ice_deck_status, crew_headcount) and is frozen at creation at
          708 minutes; the ACTUAL variant is a chronological span between two logical-clock stamps
          and reads 750 minutes on the very same order, so the two variants differ by 42 minutes on
          identical configuration inputs and only ACTUAL feeds Venue.changeover_debt_minutes.
        test_recipe:
          setup:
            - "Lakeside Arena registered with min_turnaround_buffer_minutes 45 and crew_headcount_cap 60."
            - "PROFILE ICE and PROFILE CONCERT declared on the arena; a FLOOR_PANEL_SET pool of 10 units exists."
            - "Outgoing promoter booking on PROFILE ICE runs 2026-09-10T00:00Z..03:00Z and is HELD."
            - "Incoming promoter booking on PROFILE CONCERT runs 2026-09-10T16:00Z..19:00Z and is CONFIRMED."
            - "A ChangeoverOrder exists from the ice booking to the concert booking with crew_headcount 40, so window_start_utc is 2026-09-10T03:45Z (venue-local 23:45, therefore overnight_shift true), window_end_utc is 2026-09-10T16:00Z and window_minutes is 735."
            - "3 FLOOR_PANEL_SET units are ISSUED to the order, satisfying the 120-panel (3-set) floor-protection requirement of PROFILE CONCERT."
            - "The order was driven to READY_FOR_SIGNOFF with started_at_utc 2026-09-10T04:00:00Z and completed_at_utc 2026-09-10T16:30:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "ICE_HOCKEY", requires_ice: true, ice_cover_required: false, seating_mode: "FULL_BOWL", nominal_seats: 17000, base_changeover_minutes: 240, crew_size_required: 30, floor_protection_panels_required: 0, dehumidification_required_lph: 120, rigging_points_required: 40 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_ice: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "CONCERT_END_STAGE", requires_ice: false, ice_cover_required: true, seating_mode: "CURTAINED_HALF", nominal_seats: 9000, base_changeover_minutes: 300, crew_size_required: 40, floor_protection_panels_required: 120, dehumidification_required_lph: 0, rigging_points_required: 220 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_con: $.data.id }
            - call: "POST /venues/${venue_id}/equipment-assets"
              payload: { asset_class: "FLOOR_PANEL_SET", units_total: 10, service_interval_cycles: 12 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { asset_floor: $.data.id }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Lakeside Hockey vs Riverton", promoter_name: "Lakeside Hockey Club", event_start_utc: "2026-09-10T00:00:00Z", event_end_utc: "2026-09-10T03:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: BookingManager
              captures: { b_ice: $.data.id }
            - call: "POST /event-bookings/${b_ice}/hold"
              payload: {}
              as: BookingManager
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_con}", title: "Northline Arena Tour", promoter_name: "Northline Live", event_start_utc: "2026-09-10T16:00:00Z", event_end_utc: "2026-09-10T19:00:00Z", expected_attendance: 8000, rigging_load_kg: 5000 }
              as: BookingManager
              captures: { b_con: $.data.id }
            - call: "POST /event-bookings/${b_con}/hold"
              payload: {}
              as: BookingManager
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: BookingManager
              captures: { v_before_confirm: $.data.version }
            - call: "POST /event-bookings/${b_con}/confirm"
              payload: { expected_venue_version: "${v_before_confirm}" }
              as: BookingManager
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: ChangeoverSupervisor
              captures: { v_before_order: $.data.version }
            - call: "POST /changeover-orders"
              payload: { from_booking_id: "${b_ice}", to_booking_id: "${b_con}", crew_headcount: 40, expected_venue_version: "${v_before_order}" }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
              captures: { order_id: $.data.id, planned_at_create: $.data.planned_turnaround_minutes }
            - call: "POST /equipment-issues"
              payload: { asset_id: "${asset_floor}", changeover_order_id: "${order_id}", units_issued: 3 }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
              captures: { issue_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T04:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /changeover-orders/${order_id}/progress"
              payload: { dimension: "FLOOR", to_stage: "STRIKING" }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
            - call: "POST /changeover-orders/${order_id}/progress"
              payload: { dimension: "FLOOR", to_stage: "LAYING" }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
            - call: "POST /changeover-orders/${order_id}/progress"
              payload: { dimension: "FLOOR", to_stage: "FLOOR_COMPLETE" }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
            - call: "POST /changeover-orders/${order_id}/progress"
              payload: { dimension: "SEATING", to_stage: "RETRACTING" }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
            - call: "POST /changeover-orders/${order_id}/progress"
              payload: { dimension: "SEATING", to_stage: "CURTAINING" }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
            - call: "POST /changeover-orders/${order_id}/progress"
              payload: { dimension: "SEATING", to_stage: "SEATING_COMPLETE" }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
            - call: "POST /changeover-orders/${order_id}/progress"
              payload: { dimension: "INFRA", to_stage: "UTILITY_SET" }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
            - call: "POST /changeover-orders/${order_id}/progress"
              payload: { dimension: "INFRA", to_stage: "NETWORK_SET" }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T16:30:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /changeover-orders/${order_id}/progress"
              payload: { dimension: "INFRA", to_stage: "BROADCAST_READY" }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
          trigger:
            - call: "POST /changeover-orders/${order_id}/signoff"
              payload: {}
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
          assert:
            - "ChangeoverOrder.${order_id}.window_minutes == 735"
            - "ChangeoverOrder.${order_id}.overnight_shift == true"
            - "ChangeoverOrder.${order_id}.planned_turnaround_minutes == 708"
            - "ChangeoverOrder.${order_id}.actual_turnaround_minutes == 750"
            - "ChangeoverOrder.${order_id}.actual_turnaround_minutes != ChangeoverOrder.${order_id}.planned_turnaround_minutes"
            - "ChangeoverOrder.${order_id}.overrun_minutes == 15"
            - "ChangeoverOrder.${order_id}.status == SIGNED_OFF"
            - "ChangeoverOrder.${order_id}.signed_off_by_user_id == dir-lakeside"
            - "ChangeoverOrder.${order_id}.started_at_utc == 2026-09-10T04:00:00.000Z"
            - "ChangeoverOrder.${order_id}.completed_at_utc == 2026-09-10T16:30:00.000Z"
            - "Venue.${venue_id}.changeover_debt_minutes == 15"
            - "Venue.${venue_id}.ice_deck_status == NONE"

      - name: labor_call_estimated_variant_from_scheduled_window_diverges_from_settled_variant_on_reported_hours
        grounds:
          - calculations.labor_call_cost_cents
          - entities.LaborCall.fields.estimated_cost_cents
          - entities.LaborCall.fields.settled_cost_cents
          - state_machines.LaborCall.CALLED_to_WORKED
          - calculations.overnight_shift_flag
        distinguishing_aspect: |
          The ESTIMATED variant bills max(guaranteed_hours, scheduled_hours) = 9 hours and lands on
          554040 cents; the SETTLED variant bills max(guaranteed_hours, actual_hours) = 11.5 hours
          and lands on 772740 cents, so the 2.5 unscheduled overtime hours appear ONLY in SETTLED
          and the two variants differ by exactly 218700 cents on the same LaborCall row.
        test_recipe:
          setup:
            - "Lakeside Arena registered with PROFILE CONCERT declared."
            - "A promoter booking on PROFILE CONCERT runs 2026-09-10T16:00Z..19:00Z and is HELD."
            - "A booking-scoped RIGGER labor call for 6 heads is CALLED for 2026-09-10T04:00Z..13:00Z (9 scheduled hours) with guaranteed_hours 4; call_start_utc is venue-local 00:00, so overnight is true and the 1.35 overnight multiplier applies."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "CONCERT_END_STAGE", requires_ice: false, ice_cover_required: true, seating_mode: "CURTAINED_HALF", nominal_seats: 9000, base_changeover_minutes: 300, crew_size_required: 40, floor_protection_panels_required: 120, dehumidification_required_lph: 0, rigging_points_required: 220 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_con: $.data.id }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_con}", title: "Northline Arena Tour", promoter_name: "Northline Live", event_start_utc: "2026-09-10T16:00:00Z", event_end_utc: "2026-09-10T19:00:00Z", expected_attendance: 8000, rigging_load_kg: 5000 }
              as: BookingManager
              captures: { b_con: $.data.id }
            - call: "POST /event-bookings/${b_con}/hold"
              payload: {}
              as: BookingManager
            - call: "POST /labor-calls"
              payload: { booking_id: "${b_con}", craft: "RIGGER", headcount: 6, call_start_utc: "2026-09-10T04:00:00Z", call_end_utc: "2026-09-10T13:00:00Z", guaranteed_hours: 4 }
              as: LaborCoordinator
              captures: { labor_id: $.data.id, est_at_create: $.data.estimated_cost_cents }
          trigger:
            - call: "POST /labor-calls/${labor_id}/close"
              payload: { actual_hours: 11.5 }
              as: LaborCoordinator
          assert:
            - "LaborCall.${labor_id}.overnight == true"
            - "LaborCall.${labor_id}.estimated_cost_cents == 554040"
            - "LaborCall.${labor_id}.settled_cost_cents == 772740"
            - "LaborCall.${labor_id}.settled_cost_cents - LaborCall.${labor_id}.estimated_cost_cents == 218700"
            - "LaborCall.${labor_id}.status == WORKED"
            - "LaborCall.${labor_id}.actual_hours == 11.5"
            - "LaborCall.${labor_id}.cancellation_fee_cents == 0"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: planned_turnaround_combines_ice_branch_seating_mode_panel_sets_crew_clamp_and_pinned_double_ceiling
        grounds:
          - calculations.changeover_turnaround_minutes
          - calculations.overnight_shift_flag
          - entities.ConfigurationProfile.fields.seating_mode
          - entities.ConfigurationProfile.fields.floor_protection_panels_required
          - entities.ConfigurationProfile.fields.crew_size_required
          - entities.ChangeoverOrder.fields.crew_headcount
          - entities.ChangeoverOrder.fields.planned_turnaround_minutes
          - state_machines.ChangeoverOrder.null_to_PLANNED
        distinguishing_aspect: |
          Five independent inputs interact multiplicatively rather than additively: the ice
          branch (90 for a covering strike-out), SEATING_MODE_MINUTES (180 for CURTAINED_HALF),
          the ceil(panels / 40) panel-set step (45 for 120 panels), the crew_factor divisor
          (clamped to [0.5, 2.0]) and the overnight 1.15 slowdown — and the two ceilings are
          applied in the pinned order ceil(raw / crew_factor) THEN ceil(that * 1.15), which yields
          644 for crew 44 where the single-ceiling order ceil(raw / crew_factor * 1.15) would yield
          643, and 355 for crew 200 (crew_factor clamped from 5.0 down to 2.0) where the
          single-ceiling order would yield 354 and an unclamped divisor would yield 142.
        test_recipe:
          setup:
            - "Lakeside Arena registered but with crew_headcount_cap 200 so that an over-nominal crew is legal and the crew_factor clamp at 2.0 is observable."
            - "PROFILE ICE and PROFILE CONCERT declared on the arena."
            - "First pair: promoter ice booking 2026-09-10T00:00Z..03:00Z HELD, promoter concert booking 2026-09-10T16:00Z..19:00Z HELD; the derived window is 2026-09-10T03:45Z..16:00Z = 735 minutes, venue-local 23:45 so overnight_shift is true."
            - "Second pair: promoter ice booking 2026-09-12T00:00Z..03:00Z HELD, promoter concert booking 2026-09-12T16:00Z..19:00Z HELD; the derived window is 2026-09-12T03:45Z..16:00Z = 735 minutes, also overnight, and disjoint from the first window so no changeover-window conflict arises."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 200, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "ICE_HOCKEY", requires_ice: true, ice_cover_required: false, seating_mode: "FULL_BOWL", nominal_seats: 17000, base_changeover_minutes: 240, crew_size_required: 30, floor_protection_panels_required: 0, dehumidification_required_lph: 120, rigging_points_required: 40 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_ice: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "CONCERT_END_STAGE", requires_ice: false, ice_cover_required: true, seating_mode: "CURTAINED_HALF", nominal_seats: 9000, base_changeover_minutes: 300, crew_size_required: 40, floor_protection_panels_required: 120, dehumidification_required_lph: 0, rigging_points_required: 220 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_con: $.data.id }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Hockey Sep 10", promoter_name: "Lakeside Hockey Club", event_start_utc: "2026-09-10T00:00:00Z", event_end_utc: "2026-09-10T03:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: BookingManager
              captures: { b_ice1: $.data.id }
            - call: "POST /event-bookings/${b_ice1}/hold"
              payload: {}
              as: BookingManager
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_con}", title: "Concert Sep 10", promoter_name: "Northline Live", event_start_utc: "2026-09-10T16:00:00Z", event_end_utc: "2026-09-10T19:00:00Z", expected_attendance: 8000, rigging_load_kg: 5000 }
              as: BookingManager
              captures: { b_con1: $.data.id }
            - call: "POST /event-bookings/${b_con1}/hold"
              payload: {}
              as: BookingManager
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Hockey Sep 12", promoter_name: "Lakeside Hockey Club", event_start_utc: "2026-09-12T00:00:00Z", event_end_utc: "2026-09-12T03:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: BookingManager
              captures: { b_ice2: $.data.id }
            - call: "POST /event-bookings/${b_ice2}/hold"
              payload: {}
              as: BookingManager
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_con}", title: "Concert Sep 12", promoter_name: "Northline Live", event_start_utc: "2026-09-12T16:00:00Z", event_end_utc: "2026-09-12T19:00:00Z", expected_attendance: 8000, rigging_load_kg: 5000 }
              as: BookingManager
              captures: { b_con2: $.data.id }
            - call: "POST /event-bookings/${b_con2}/hold"
              payload: {}
              as: BookingManager
          trigger:
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: ChangeoverSupervisor
              captures: { v1: $.data.version }
            - call: "POST /changeover-orders"
              payload: { from_booking_id: "${b_ice1}", to_booking_id: "${b_con1}", crew_headcount: 44, expected_venue_version: "${v1}" }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
              captures: { order_44: $.data.id, planned_44: $.data.planned_turnaround_minutes }
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: ChangeoverSupervisor
              captures: { v2: $.data.version }
            - call: "POST /changeover-orders"
              payload: { from_booking_id: "${b_ice2}", to_booking_id: "${b_con2}", crew_headcount: 200, expected_venue_version: "${v2}" }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
              captures: { order_200: $.data.id, planned_200: $.data.planned_turnaround_minutes }
          assert:
            - "ChangeoverOrder.${order_44}.window_minutes == 735"
            - "ChangeoverOrder.${order_44}.overnight_shift == true"
            - "ChangeoverOrder.${order_44}.planned_turnaround_minutes == 644"
            - "ChangeoverOrder.${order_44}.planned_turnaround_minutes != 643"
            - "ChangeoverOrder.${order_200}.window_minutes == 735"
            - "ChangeoverOrder.${order_200}.overnight_shift == true"
            - "ChangeoverOrder.${order_200}.planned_turnaround_minutes == 355"
            - "ChangeoverOrder.${order_200}.planned_turnaround_minutes != 354"
            - "ChangeoverOrder.${order_200}.planned_turnaround_minutes != 142"

      - name: displacement_settlement_admin_band_reads_subtotal_not_the_running_total
        grounds:
          - calculations.displacement_settlement_cents
          - calculations.hold_priority_delta
          - entities.EventBooking.fields.displacement_penalty_cents
          - entities.EventBooking.fields.hold_tier
          - state_machines.EventBooking.CHALLENGED_to_DISPLACED
          - state_machines.HoldChallenge.OPEN_to_UPHELD
        distinguishing_aspect: |
          Three ordered bands compose non-additively on one figure: the TIER_2 base of 650000, the
          notice_days band at exactly 30 days giving multiplier 0.60 and subtotal 390000, and the
          admin band which MUST be read off that 390000 subtotal (0.05 -> 19500) even though the fee
          is then added into it — so the answer is 409500, whereas reading the band off the running
          total 409500 (>= 400000 -> 0.08 -> 31200) would yield 421200 and dropping the admin fee
          entirely would yield 390000.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-11T00:00:00Z."
            - "Lakeside Arena registered with PROFILE ICE declared."
            - "Anchor tenant Lakeside Hockey Club at TIER_2 with 5 guaranteed holds; anchor tenant Riverton Athletics at TIER_1 with 5 guaranteed holds and the default 2 challenge credits."
            - "Incumbent booking for the TIER_2 tenant runs 2026-09-10T00:00Z..03:00Z and is HELD, so hold_tier is the TIER_2 snapshot and event_start_utc is exactly 30 days after the clock."
            - "Challenger booking for the TIER_1 tenant is DRAFT."
            - "An OPEN HoldChallenge exists from the TIER_1 tenant against the incumbent booking, so priority_delta is TIER_RANK[TIER_2] 2 minus TIER_RANK[TIER_1] 1 = 1 and the incumbent is CHALLENGED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
