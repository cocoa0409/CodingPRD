  # ===========================================================================
  - section: cross_cutting
    instances:
      - name: c_occ_price_override_success_increments_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[price-override-stale-order]", entities.Order.fields.price_override_discount_cents, entities.Order.fields.version]
        distinguishing_aspect: "A price override carrying the current expected_order_version succeeds: discount_cents becomes 1500 and Order.version increments from 1 to 2."
        test_recipe:
          setup: ["Member; product 10000; an order at version 1."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c24@x.com", full_name: "C24", state_code: "OR" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /products"
              payload: { sku: "C-OCC1", name: "OCC1", category: "GEAR", unit_price_cents: 10000, initial_stock: 3 }
              as: StoreManager
              captures: { pid: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pid}", quantity: 1 } ] }
              as: StoreManager
              captures: { oid: $.data.id, ov0: $.data.version }
          trigger:
            - call: "POST /orders/${oid}/price-overrides"
              payload: { expected_order_version: "${ov0}", override_discount_cents: 1500 }
              as: StoreManager
          assert:
            - "Order.${oid}.discount_cents == 1500"
            - "Order.${oid}.version == 2"

      - name: c_occ_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[price-override-stale-order]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second price override still carrying the pre-override expected_order_version (stale) is rejected with ERR_STALE_VERSION (412) after the first override advanced Order.version."
        test_recipe:
          setup: ["Member; product 10000; order at version 1; one successful price override applied (version now 2)."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c25@x.com", full_name: "C25", state_code: "OR" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /products"
              payload: { sku: "C-OCC2", name: "OCC2", category: "GEAR", unit_price_cents: 10000, initial_stock: 3 }
              as: StoreManager
              captures: { pid: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pid}", quantity: 1 } ] }
              as: StoreManager
              captures: { oid: $.data.id, ov0: $.data.version }
            - call: "POST /orders/${oid}/price-overrides"
              payload: { expected_order_version: "${ov0}", override_discount_cents: 1000 }
              as: StoreManager
          trigger:
            - call: "POST /orders/${oid}/price-overrides"
              payload: { expected_order_version: "${ov0}", override_discount_cents: 2000 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "response.status == 412"

