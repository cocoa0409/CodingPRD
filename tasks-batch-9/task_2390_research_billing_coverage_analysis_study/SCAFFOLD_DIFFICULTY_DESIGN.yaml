  # =========================================================================
  # RULE 6 - boundary_precision_check
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: aging_bucket_flips_at_day_31_and_is_stale_between_runs
        grounds: "§1.3 calculations.charge_aging with constants AGING_CURRENT_MAX_DAYS 30, AGING_31_60_MAX_DAYS 60, AGING_61_90_MAX_DAYS 90; §1.5 POST /research-billing/_ops/aging-run; §1.1 Charge.aging_days and aging_bucket declared stale between runs."
        distinguishing_aspect: "Metric: whole days elapsed since unbilled_since. The upper bound is inclusive, so 30 days is still CURRENT and 31 days is AGING_31_60. The endpoint is the aging run, and the second half of the boundary claim is temporal rather than numeric: advancing the clock past the boundary without running the job must leave aging_days at 30, because the bucket is an ops-run checkpoint rather than a live derivation."
        test_recipe:
          setup:
            - "One study with a qualifying determination and an approved analysis carrying a sponsor-paid item. At clock 2026-08-10T00:00:00Z one 40000-cent charge is posted and reviewed HOLD_FOR_SPONSOR, so unbilled_since is 2026-08-10T00:00:00Z and billing_state stays UNBILLED. The clock is moved to 2026-09-09 (exactly 30 days) and an aging run is executed; the clock then moves to 2026-09-10 (day 31) with no run yet."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-Q", title: "Aging boundary probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true, registry_number: "NCT10000015" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version" }
            - call: "POST /research-billing/studies/${study_id}/qct-determination"
              payload: { basis: "DEEMED_IND_IDE" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { study_v2: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v2}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "J9999", description: "Investigational infusion", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "PER_PATIENT", charge_master_unit_cents: 55000, negotiated_unit_cents: 40000, units_per_occurrence: 1, expected_occurrences: 1 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
            - call: "POST /research-billing/charges"
              payload: { study_id: "${study_id}", charge_code: "J9999", service_date: "2026-08-10", amount_cents: 40000 }
              as: StudyCoordinator
              as_user_id: "coord_1"
              captures: { charge_id: "$.data.id", unbilled_since: "$.data.unbilled_since" }
            - call: "POST /research-billing/charges/${charge_id}/review"
              payload: { decision: "HOLD_FOR_SPONSOR" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T23:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/_ops/aging-run"
              payload: { study_id: "${study_id}" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { day30_run_date: "$.data.run_date", day30_delinquent_count: "$.data.delinquent_charge_count" }
            - call: "GET /research-billing/charges/${charge_id}"
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { day30_aging_days: "$.data.aging_days", day30_bucket: "$.data.aging_bucket" }
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:30:00Z" }
              as: ResearchBillingManager
            - call: "GET /research-billing/charges/${charge_id}"
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { stale_aging_days: "$.data.aging_days", stale_bucket: "$.data.aging_bucket" }
          trigger:
            - call: "POST /research-billing/_ops/aging-run"
              payload: { study_id: "${study_id}" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
          assert:
            - "setup: unbilled_since == \"2026-08-10T00:00:00Z\"; the day-30 run returned run_date == \"2026-09-09\" and delinquent_charge_count == 0"
            - "setup: day30_aging_days == 30 and day30_bucket == \"CURRENT\" - the inclusive upper bound of AGING_CURRENT_MAX_DAYS"
            - "setup: after the clock moved to 2026-09-10 but before any run, stale_aging_days == 30 and stale_bucket == \"CURRENT\" - the checkpoint is deliberately stale"
            - "trigger response 200 with run_date == \"2026-09-10\", charges_aged_count == 1, delinquent_charge_count == 0"
            - "GET /research-billing/charges/${charge_id} after the trigger shows aging_days == 31 and aging_bucket == \"AGING_31_60\""
            - "the same run left billing_state \"UNBILLED\" and routing_state \"ROUTED_SPONSOR\" untouched, and Study.delinquent_sponsor_cents == 0"

      - name: invoice_volume_credit_threshold_met_exactly_at_gross_1000000
        grounds: "§1.3 calculations.sponsor_invoice_net_total with INVOICE_VOLUME_CREDIT_THRESHOLD_CENTS 1000000 and the comparison `gross_total_cents >= threshold`; §1.5 POST /research-billing/sponsor-invoices."
        distinguishing_aspect: "Metric: invoice gross in cents (a money threshold, not a day count), on a different endpoint from the aging run. The boundary is reached only through the indirect calculation, so the test also pins the round_half_up direction: a 757572-cent line gives indirect 242423 and gross 999995 (no credit), while a 757576-cent line gives indirect 242424 (from 242424.32) and gross exactly 1000000, which DOES earn the credit because the comparison is inclusive. One cent of rounding error in either direction moves the invoice across the tier."
        test_recipe:
          setup:
            - "One INDUSTRY_SPONSORED study at effective_indirect_rate_pct 32.0 with two sponsor-routed charges. The 757572-cent charge is invoiced first, on its own, to establish the just-below control; its invoice takes it out of the eligible pool. The 757576-cent charge is then posted and reviewed so that the triggering invoice selects exactly that one line."
