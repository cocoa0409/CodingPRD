# =============================================================================
# Campus Recreation & Intramural Leagues — benchmark seed tables
# Flat topology, peer-role RBAC, logical-clock determinism, OCC on Member/League/Facility
# =============================================================================

scenario: |
  Campus Recreation & Intramural Leagues (campus recreation department): facility hours & membership eligibility (student/faculty/community), league registration by team/free agent & division placement, game scheduling, officials assignment & pay, forfeit/sportsmanship rating & playoff eligibility, injury reporting & waiver, equipment checkout & locker rental, group fitness class registration & instructor payroll

domain_name: campus-rec-intramurals
api_prefix: /v1

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing        # facility hours/closures, game slots, official travel buffers, class overlaps
  secondary_archetype: quota_allocation        # division capacity, roster caps, class seats + waitlist, equipment pool units, lockers
  complexity_layers:
    - optimistic_concurrency                   # OCC on Member.version (membership supersede), League.version (game scheduling), Facility.version (closures)
    - cascading_side_effects                   # closure -> game bump -> assignment cancel -> pay reversal; injury -> suspension -> registration cancel -> waitlist promotion
    - dual_variant_calculation                 # membership FULL vs PRORATED fee; official provisional vs final pay; instructor estimate vs actual
    - rate_threshold_triggers                  # sportsmanship >= 3.00, forfeit_count >= 3 suspension, <= 1 playoff eligibility, attendance bonus tiers
  entity_topology: flat                        # peer entities, FK references, no URL nesting under other business resources
  state_machine_shape: cyclic                  # Game fork-join + reschedule cycle; Team ACTIVE<->SUSPENDED; Locker AVAILABLE<->RENTED; Member ACTIVE<->SUSPENDED
  relationship_patterns:
    - many_to_many                             # RosterEntry, ClassRegistration, OfficiatingAssignment junctions
    - cross_aggregate                          # Game references League + Facility + two Teams; InjuryReport optionally references Game
    - polymorphic                              # Staff.payroll_* aggregates paid via two different rails (official assignments vs fitness classes)
  role_model: peer_roles                       # RecAdmin / LeagueCoordinator / FacilityManager / Member / Staff own disjoint write surfaces
  consistency_model: immediate                 # every mutation + cascade is atomic within the request

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities)
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique email address (case-insensitive uniqueness across all members)" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: affiliation, type: enum, source: input, description: "STUDENT | FACULTY | COMMUNITY — drives fee tables and pricing" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; initial ACTIVE; mutated only by injury-report hold/clear cascades", default: ACTIVE }
      - { name: waiver_signed_date, type: string, source: system, description: "ISO date (YYYY-MM-DD) of latest waiver signature; null until first POST waiver-sign", default: null }
      - { name: outstanding_fines_cents, type: integer, source: computed, description: "Unpaid fine balance; increased by equipment late/lost assessments, decreased by fine payments; never negative", default: 0 }
      - { name: no_show_count, type: integer, source: computed, description: "Count of ClassRegistration entries that reached NO_SHOW", default: 0 }

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owning member" }
      - { name: term, type: enum, source: input, description: "FALL_2026 | SPRING_2027 | SUMMER_2027; fixed date windows in calculations.membership_fee_cents" }
      - { name: pricing_variant, type: enum, source: computed, description: "FULL | PRORATED — which fee variant was applied at purchase" }
      - { name: fee_cents, type: integer, source: computed, description: "Fee charged, per calculations.membership_fee_cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED | CANCELLED | EXPIRED; initial ACTIVE", default: ACTIVE }
      - { name: supersedes_membership_id, type: string, source: system, description: "FK -> Membership.id; set on the new ACTIVE membership when its creation superseded a prior ACTIVE one; null otherwise", default: null }

  - name: League
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "League name" }
      - { name: sport, type: enum, source: input, description: "BASKETBALL | SOCCER | VOLLEYBALL | FLAG_FOOTBALL | DODGEBALL" }
      - { name: divisions, type: array, source: input, description: "Array of {name (unique within league), capacity (integer >= 1), skill_min, skill_max (1 <= skill_min <= skill_max <= 10)}; must be non-empty before registration opens" }
      - { name: registration_open_at, type: datetime, source: input, description: "Registration window open instant" }
      - { name: registration_close_at, type: datetime, source: input, description: "Registration window close instant; must be > registration_open_at and <= season_start_at" }
      - { name: season_start_at, type: datetime, source: input, description: "Season start; must be < season_end_at" }
      - { name: season_end_at, type: datetime, source: input, description: "Season end" }
      - { name: team_capacity, type: integer, source: input, description: "Max non-WITHDRAWN teams in the league; >= min_teams" }
      - { name: min_teams, type: integer, source: input, description: "Minimum non-WITHDRAWN teams required to close registration / start season; >= 2" }
      - { name: roster_min, type: integer, source: input, description: "Minimum ACTIVE roster entries per team at start-season; >= 1" }
      - { name: roster_max, type: integer, source: input, description: "Maximum ACTIVE roster entries per team; >= roster_min" }
      - { name: status, type: enum, source: system, description: "DRAFT | REGISTRATION_OPEN | SCHEDULING | IN_SEASON | PLAYOFFS | COMPLETED | CANCELLED; initial DRAFT", default: DRAFT }
      - { name: free_agent_pool, type: array, source: system, description: "Array of {member_id (references Member.id), preferred_division_name (null or a divisions[].name), registered_at, status POOLED | PLACED | WITHDRAWN}", default: [] }

  - name: Team
    parent: null
    common_fields: true
    fields:
      - { name: league_id, type: string, source: input, description: "FK -> League.id; league the team is registered in" }
      - { name: name, type: string, source: input, description: "Team name" }
      - { name: captain_member_id, type: string, source: input, description: "FK -> Member.id; captain; the captain's RosterEntry can never be removed" }
      - { name: skill_rating, type: integer, source: input, description: "Self-assessed skill 1..10; must fall inside division [skill_min, skill_max] at placement (both bounds inclusive)" }
      - { name: division_name, type: string, source: system, description: "Assigned division (divisions[].name of League); null until placed", default: null }
      - { name: status, type: enum, source: system, description: "REGISTERED | PLACED | ACTIVE | SUSPENDED | WITHDRAWN | COMPLETED; initial REGISTERED", default: REGISTERED }
      - { name: wins, type: integer, source: computed, description: "Finalized wins (incl. forfeit wins)", default: 0 }
      - { name: losses, type: integer, source: computed, description: "Finalized losses (incl. forfeit losses)", default: 0 }
      - { name: ties, type: integer, source: computed, description: "Finalized ties (regular season only)", default: 0 }
      - { name: points, type: integer, source: computed, description: "Standings points: win 3, tie 1, loss 0", default: 0 }
      - { name: forfeit_count, type: integer, source: computed, description: "Number of games this team forfeited", default: 0 }
      - { name: sportsmanship_points_total, type: integer, source: computed, description: "Sum of received sportsmanship ratings (1..5 each; automatic 1 per forfeited game)", default: 0 }
      - { name: sportsmanship_rating_count, type: integer, source: computed, description: "Number of received ratings", default: 0 }
      - { name: sportsmanship_rating, type: number, source: computed, description: "round_half_up(points_total / rating_count, 2); null while rating_count == 0; treated as 0.00 for playoff eligibility", default: null }
      - { name: active_roster_count, type: integer, source: computed, description: "Count of RosterEntry rows with status ACTIVE for this team", default: 0 }

  - name: RosterEntry
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: input, description: "FK -> Team.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: role, type: enum, source: system, description: "CAPTAIN | PLAYER; CAPTAIN when member_id == team's captain_member_id at creation, else PLAYER" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REMOVED; initial ACTIVE", default: ACTIVE }

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: kind, type: enum, source: input, description: "COURT | FIELD | ROOM | POOL" }
      - { name: operating_windows, type: array, source: input, description: "Recurring weekly windows [{day_of_week 0=Mon..6=Sun, open_minute, close_minute}] minutes after midnight, 0 <= open < close <= 1440; a booking must fit within ONE window of its weekday, start >= open_minute and end <= close_minute" }
      - { name: closures, type: array, source: system, description: "Closure intervals [{closure_id, start_at, end_at, reason}], half-open [start_at, end_at); created via POST closures", default: [] }

  - name: Game
    parent: null
    common_fields: true
    fields:
      - { name: league_id, type: string, source: system, description: "FK -> League.id; from path on create" }
      - { name: division_name, type: string, source: system, description: "Division of both teams at scheduling time; null for system-created playoff games" }
      - { name: home_team_id, type: string, source: input, description: "FK -> Team.id" }
      - { name: away_team_id, type: string, source: input, description: "FK -> Team.id; must differ from home_team_id" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: start_at, type: datetime, source: input, description: "Game start; must be >= logical now at creation/reschedule" }
      - { name: end_at, type: datetime, source: input, description: "Game end; must be > start_at and same local date as start_at" }
      - { name: duration_minutes, type: integer, source: computed, description: "(end_at - start_at) in minutes" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | RESCHEDULE_REQUIRED | PLAYED_PENDING_CONFIRM | DISPUTED | FINAL | FORFEITED | CANCELLED; initial SCHEDULED on POST, RESCHEDULE_REQUIRED for system-created playoff games", default: SCHEDULED }
      - { name: bracket_round, type: enum, source: system, description: "REGULAR | SEMIFINAL | CHAMPIONSHIP; REGULAR for POST-created games", default: REGULAR }
      - { name: next_game_id, type: string, source: system, description: "FK -> Game.id; on SEMIFINAL games, set by system when the championship game is created; null otherwise", default: null }
      - { name: report_home, type: object, source: system, description: "{home_score, away_score, opponent_sportsmanship, reported_at} submitted by HOME captain; null until reported", default: null }
      - { name: report_away, type: object, source: system, description: "Same shape as report_home, submitted by AWAY captain; null until reported", default: null }
      - { name: final_home_score, type: integer, source: system, description: "Authoritative home score once FINAL; null before", default: null }
      - { name: final_away_score, type: integer, source: system, description: "Authoritative away score once FINAL; null before", default: null }
      - { name: actual_duration_minutes, type: integer, source: system, description: "Actual played minutes recorded at finalize; null for report-confirmed finals and forfeits", default: null }
      - { name: forfeiting_team_id, type: string, source: system, description: "FK -> Team.id; set when status == FORFEITED", default: null }

  - name: Staff
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Staff member name" }
      - { name: staff_role, type: enum, source: input, description: "OFFICIAL | INSTRUCTOR; immutable" }
      - { name: certification_level, type: integer, source: input, description: "Required iff staff_role == OFFICIAL; integer 1..3; forbidden when staff_role == INSTRUCTOR", default: null }
      - { name: certified_class_types, type: array, source: input, description: "Required non-empty iff staff_role == INSTRUCTOR; subset of class_type enum; forbidden when staff_role == OFFICIAL", default: null }
      - { name: base_hourly_rate_cents, type: integer, source: input, description: "Hourly pay rate in cents; > 0; used by official pay formulas AND instructor payroll" }
      - { name: payroll_pending_cents, type: integer, source: computed, description: "Sum of provisional_pay_cents of OfficiatingAssignments in ASSIGNED/ACCEPTED/WORKED status (official rail only)", default: 0 }
      - { name: payroll_paid_cents, type: integer, source: computed, description: "Sum of final_pay_cents of PAID OfficiatingAssignments (official rail) PLUS instructor_pay_cents of COMPLETED FitnessClasses (instructor rail)", default: 0 }

  - name: OfficiatingAssignment
    parent: null
    common_fields: true
    fields:
      - { name: game_id, type: string, source: system, description: "FK -> Game.id; from path on create" }
      - { name: staff_id, type: string, source: input, description: "FK -> Staff.id; must be staff_role == OFFICIAL" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | ACCEPTED | DECLINED | WORKED | CANCELLED | PAID; initial ASSIGNED", default: ASSIGNED }
      - { name: provisional_pay_cents, type: integer, source: computed, description: "Estimate at creation per calculations.official_pay_provisional; added to Staff.payroll_pending_cents while ASSIGNED/ACCEPTED/WORKED" }
      - { name: final_pay_cents, type: integer, source: system, description: "Set at settle per calculations.official_pay_final; null until PAID", default: null }

  - name: InjuryReport
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; injured member" }
      - { name: game_id, type: string, source: input, description: "FK -> Game.id; optional game context; if present the member must hold an ACTIVE RosterEntry on home_team_id or away_team_id of that game", default: null }
      - { name: severity, type: enum, source: input, description: "MINOR | MODERATE | SEVERE; MODERATE and SEVERE impose a participation hold" }
      - { name: description, type: string, source: input, description: "Free-text description" }
      - { name: status, type: enum, source: system, description: "REPORTED | CLEARED; initial REPORTED", default: REPORTED }
      - { name: clearance_note, type: string, source: system, description: "Note recorded at clearance; null until CLEARED", default: null }

  - name: EquipmentPool
    parent: null
    common_fields: true
    fields:
      - { name: item_type, type: enum, source: input, description: "BASKETBALL | VOLLEYBALL | SOCCER_BALL | TENNIS_RACKET | BADMINTON_SET | YOGA_MAT; unique across pools" }
      - { name: total_qty, type: integer, source: input, description: "Total units owned; >= 1; decremented when a checkout is declared LOST" }
      - { name: daily_late_fee_cents, type: integer, source: input, description: "Per-unit per-day late fee; >= 0" }
      - { name: unit_replacement_cents, type: integer, source: input, description: "Per-unit replacement value; late fee per checkout is capped at quantity * unit_replacement_cents; >= 1" }
      - { name: available_qty, type: integer, source: computed, description: "total_qty - sum(quantity of checkouts with status OUT); invariant available_qty + sum(OUT quantity) == total_qty", default: 0 }

  - name: EquipmentCheckout
    parent: null
    common_fields: true
    fields:
      - { name: equipment_pool_id, type: string, source: input, description: "FK -> EquipmentPool.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; borrower" }
      - { name: quantity, type: integer, source: input, description: "Units checked out; >= 1" }
      - { name: due_at, type: datetime, source: input, description: "Return deadline; must be strictly after logical now at creation" }
      - { name: status, type: enum, source: system, description: "OUT | RETURNED | LOST; initial OUT", default: OUT }
      - { name: returned_at, type: datetime, source: system, description: "Logical timestamp of return; null until RETURNED", default: null }
      - { name: late_fee_cents, type: integer, source: computed, description: "Fee assessed at return per calculations.equipment_late_fee_cents; 0 for on-time returns; null until RETURNED", default: null }

  - name: Locker
    parent: null
    common_fields: true
    fields:
      - { name: locker_number, type: integer, source: input, description: "Unique locker number; >= 1" }
      - { name: size, type: enum, source: input, description: "S | M | L" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | RENTED; initial AVAILABLE", default: AVAILABLE }
      - { name: rented_by_member_id, type: string, source: system, description: "FK -> Member.id; current renter; null while AVAILABLE", default: null }
      - { name: rental_term, type: string, source: system, description: "Term enum of current rental; null while AVAILABLE", default: null }
      - { name: rental_fee_cents, type: integer, source: computed, description: "Flat per-term fee by affiliation per calculations.locker_fee_cents; null while AVAILABLE", default: null }

  - name: FitnessClass
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Class title" }
      - { name: class_type, type: enum, source: input, description: "YOGA | SPIN | PILATES | HIIT | ZUMBA" }
      - { name: instructor_staff_id, type: string, source: input, description: "FK -> Staff.id; must be staff_role == INSTRUCTOR certified for class_type" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: start_at, type: datetime, source: input, description: "Class start; >= logical now; same rules as game scheduling for facility fit" }
      - { name: end_at, type: datetime, source: input, description: "Class end; > start_at; same local date as start_at" }
      - { name: duration_minutes, type: integer, source: computed, description: "(end_at - start_at) in minutes" }
      - { name: capacity, type: integer, source: input, description: "Maximum REGISTERED registrations; >= 1" }
      - { name: registered_count, type: integer, source: computed, description: "Count of registrations with status REGISTERED", default: 0 }
      - { name: waitlist_count, type: integer, source: computed, description: "Count of registrations with status WAITLISTED", default: 0 }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED; initial SCHEDULED", default: SCHEDULED }
      - { name: attendance_count, type: integer, source: computed, description: "Registrations marked ATTENDED at completion; null until COMPLETED", default: null }
      - { name: instructor_pay_estimate_cents, type: integer, source: computed, description: "Estimate at creation: round_half_up(duration_minutes * base_hourly_rate_cents / 60) with NO attendance bonus" }
      - { name: instructor_pay_cents, type: integer, source: computed, description: "Final pay at completion per calculations.instructor_session_pay (includes attendance bonus); null until COMPLETED", default: null }

  - name: ClassRegistration
    parent: null
    common_fields: true
    fields:
      - { name: fitness_class_id, type: string, source: system, description: "FK -> FitnessClass.id; from path on create" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; registering member" }
      - { name: status, type: enum, source: system, description: "REGISTERED | WAITLISTED | CANCELLED | ATTENDED | NO_SHOW; initial REGISTERED if registered_count < capacity at creation, else WAITLISTED" }

# =============================================================================
# §1.2 State Machine Table (12 machines)
# =============================================================================
state_machines:
  - entity: Member
    field: status
    initial_state: ACTIVE
    terminal_states: []
    note: "Cyclic: ACTIVE <-> SUSPENDED, driven only by injury-report cascades (no direct status endpoint)"
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (POST /v1/injury-reports with severity MODERATE or SEVERE)"
        actor: system
        preconditions:
          - "New InjuryReport has severity IN {MODERATE, SEVERE} (a hold report)"
        side_effects:
          - "Cascade hop 2: every ClassRegistration of this member with status REGISTERED whose FitnessClass has status SCHEDULED and start_at > logical now -> CANCELLED"
          - "Cascade hop 3: each such cancellation runs calculations.waitlist_promotion on that class (may promote the head WAITLISTED entry to REGISTERED)"
          - "Cancelled registrations are NOT restored on later clearance"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (POST /v1/injury-reports/{id}/clear when no other REPORTED hold-severity report remains for the member)"
        actor: system
        preconditions:
          - "After clearing, zero InjuryReports of this member remain with status REPORTED and severity IN {MODERATE, SEVERE}"
        side_effects: []

  - entity: Membership
    field: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, CANCELLED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (POST /v1/members/{member_id}/memberships while another ACTIVE membership exists for the member)"
        actor: system
        preconditions: []
        side_effects:
          - "The newly created membership becomes the unique ACTIVE membership; its supersedes_membership_id points to this row"
          - "At most one ACTIVE membership per member at any time (invariant)"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /v1/memberships/{membership_id}/cancel"
        actor: "Member (owner) or RecAdmin"
        preconditions:
          - "Membership status == ACTIVE (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "No refund; member immediately loses membership-gated eligibility on subsequent checks"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy: evaluated on every read of the membership and on every eligibility check — if the logical current date is > term_end_date of the membership term, the membership is EXPIRED)"
        actor: system
        preconditions:
          - "logical current date > term_end_date (the term end date itself is still INCLUSIVE-active)"
        side_effects: []

  - entity: League
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: REGISTRATION_OPEN
        trigger: "POST /v1/leagues/{league_id}/open-registration"
        actor: LeagueCoordinator
        preconditions:
          - "divisions array is non-empty (ERR_LEAGUE_NOT_READY_FOR_SEASON)"
          - "registration_open_at < registration_close_at <= season_start_at < season_end_at (ERR_VALIDATION)"
        side_effects: []
      - from: REGISTRATION_OPEN
        to: SCHEDULING
        trigger: "POST /v1/leagues/{league_id}/close-registration"
        actor: LeagueCoordinator
        preconditions:
          - "count of teams with status IN {REGISTERED, PLACED} >= min_teams (ERR_TOO_FEW_TEAMS)"
        side_effects: []
      - from: SCHEDULING
        to: IN_SEASON
        trigger: "POST /v1/leagues/{league_id}/start-season"
        actor: LeagueCoordinator
        preconditions:
          - "count of teams with status IN {REGISTERED, PLACED} >= min_teams (ERR_TOO_FEW_TEAMS)"
          - "every team with status REGISTERED|PLACED has division_name != null, i.e. status PLACED (ERR_LEAGUE_NOT_READY_FOR_SEASON)"
          - "every PLACED team has active_roster_count >= roster_min (ERR_LEAGUE_NOT_READY_FOR_SEASON)"
        side_effects:
          - "All PLACED teams -> ACTIVE (rosters lock: roster add/remove require team status IN {REGISTERED, PLACED})"
      - from: IN_SEASON
        to: PLAYOFFS
        trigger: "POST /v1/leagues/{league_id}/start-playoffs"
        actor: LeagueCoordinator
        preconditions:
          - "no Game of this league in status SCHEDULED | RESCHEDULE_REQUIRED | PLAYED_PENDING_CONFIRM | DISPUTED (ERR_PLAYOFFS_NOT_READY)"
          - "league-wide eligible team count >= 2 (ERR_NO_ELIGIBLE_TEAMS); eligibility per calculations.playoff_eligibility"
        side_effects:
          - "Per division: rank eligible ACTIVE teams per calculations.playoff_seeding; if a division has >= 4 eligible teams create two SEMIFINAL games (seed1 home vs seed4 away; seed2 home vs seed3 away); if a division has 2..3 eligible teams create one CHAMPIONSHIP game (seed1 home vs seed2 away); divisions with < 2 eligible teams produce no bracket"
          - "System-created playoff games enter status RESCHEDULE_REQUIRED with facility_id null, start_at/end_at null, bracket_round SEMIFINAL|CHAMPIONSHIP; they are scheduled via POST /v1/games/{game_id}/reschedule"
          - "Both SEMIFINAL games of a division get next_game_id set when their CHAMPIONSHIP game is later auto-created"
      - from: PLAYOFFS
        to: COMPLETED
        trigger: "system (auto when every division bracket produced at start-playoffs has its CHAMPIONSHIP game in status FINAL or FORFEITED)"
        actor: system
        preconditions: []
        side_effects:
          - "All teams with status ACTIVE | SUSPENDED -> COMPLETED"
      - from: [DRAFT, REGISTRATION_OPEN, SCHEDULING, IN_SEASON]
        to: CANCELLED
        trigger: "POST /v1/leagues/{league_id}/cancel"
        actor: LeagueCoordinator
        preconditions: []
        side_effects:
          - "Games in SCHEDULED | RESCHEDULE_REQUIRED | PLAYED_PENDING_CONFIRM | DISPUTED -> CANCELLED"
          - "OfficiatingAssignments in ASSIGNED | ACCEPTED on those games -> CANCELLED; each reversal subtracts provisional_pay_cents from Staff.payroll_pending_cents"
          - "Teams in REGISTERED | PLACED | ACTIVE | SUSPENDED -> WITHDRAWN"
          - "free_agent_pool entries with status POOLED -> WITHDRAWN"

  - entity: Team
    field: status
    initial_state: REGISTERED
    terminal_states: [WITHDRAWN, COMPLETED]
    transitions:
      - from: REGISTERED
        to: PLACED
        trigger: "POST /v1/teams/{team_id}/place-division"
        actor: LeagueCoordinator
        preconditions:
          - "League status == SCHEDULING (ERR_INVALID_STATE)"
          - "division_name exists in League.divisions (ERR_DIVISION_NOT_FOUND)"
          - "skill_min <= team.skill_rating <= skill_max inclusive (ERR_DIVISION_SKILL_MISMATCH)"
          - "current teams in that division < division.capacity (ERR_DIVISION_FULL)"
        side_effects:
          - "division_name set"
      - from: PLACED
        to: ACTIVE
        trigger: "system (league start-season)"
        actor: system
        preconditions: []
        side_effects: ["Roster locked: roster add/remove rejected while team is ACTIVE|SUSPENDED"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (evaluated immediately after any game FINAL|FORFEITED that incremented this team's forfeit_count: if forfeit_count >= 3)"
        actor: system
        preconditions:
          - "team.status == ACTIVE and team.forfeit_count >= 3 (FORFEIT_SUSPENSION_THRESHOLD)"
        side_effects:
          - "Cascade: every game with status SCHEDULED | RESCHEDULE_REQUIRED involving this team -> FORFEITED with forfeiting_team_id = this team; per-game forfeit effects apply EXCEPT officiating handling: all non-terminal OfficiatingAssignments on those games -> CANCELLED with provisional pay reversed (cascade-forfeit never produces WORKED/pay, unlike manual declare-forfeit)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /v1/teams/{team_id}/reinstate"
        actor: LeagueCoordinator
        preconditions:
          - "League status == IN_SEASON (ERR_INVALID_STATE)"
          - "team.status == SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "forfeit_count is NOT reset; the team is re-suspended if a later finalize/forfeit re-evaluates the threshold while forfeit_count >= 3"
      - from: [REGISTERED, PLACED]
        to: WITHDRAWN
        trigger: "POST /v1/teams/{team_id}/withdraw"
        actor: "Member (captain) or LeagueCoordinator"
        preconditions: []
        side_effects: []
      - from: [ACTIVE, SUSPENDED]
        to: WITHDRAWN
        trigger: "POST /v1/teams/{team_id}/withdraw"
        actor: "Member (captain) or LeagueCoordinator"
        preconditions: []
        side_effects:
          - "Cascade-forfeit: every game with status SCHEDULED | RESCHEDULE_REQUIRED involving this team -> FORFEITED with forfeiting_team_id = this team; standings and sportsmanship auto-1 effects apply per game; all non-terminal OfficiatingAssignments on those games -> CANCELLED (pay reversed, no WORKED)"
      - from: [ACTIVE, SUSPENDED]
        to: COMPLETED
        trigger: "system (league -> COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RosterEntry
    field: status
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /v1/roster-entries/{roster_entry_id}/remove"
        actor: "Member (captain of the entry's team) or LeagueCoordinator"
        preconditions:
          - "Entry status == ACTIVE (ERR_INVALID_STATE)"
          - "Team status IN {REGISTERED, PLACED} (roster unlocked) (ERR_INVALID_STATE)"
          - "entry.member_id != team.captain_member_id (ERR_CAPTAIN_REMOVAL_FORBIDDEN)"
        side_effects:
          - "team.active_roster_count -= 1"

  - entity: Game
    field: status
    initial_state: SCHEDULED
    terminal_states: [FINAL, FORFEITED, CANCELLED]
    note: "System-created playoff games bypass the initial state and are born RESCHEDULE_REQUIRED. Fork-join score confirmation plus a reschedule cycle: SCHEDULED -> RESCHEDULE_REQUIRED -> SCHEDULED."
    transitions:
      - from: SCHEDULED
        to: RESCHEDULE_REQUIRED
        trigger: "system (facility closure overlapping [start_at, end_at)) OR first half of POST /v1/games/{game_id}/reschedule"
        actor: "system or LeagueCoordinator"
        preconditions: []
        side_effects:
          - "All OfficiatingAssignments of this game in ASSIGNED | ACCEPTED -> CANCELLED; each subtracts provisional_pay_cents from Staff.payroll_pending_cents"
      - from: RESCHEDULE_REQUIRED
        to: SCHEDULED
        trigger: "POST /v1/games/{game_id}/reschedule"
        actor: LeagueCoordinator
        preconditions:
          - "League status IN {SCHEDULING, IN_SEASON, PLAYOFFS} (ERR_INVALID_STATE)"
          - "New start_at >= logical now (ERR_GAME_IN_PAST); fits one operating window (ERR_FACILITY_OUTSIDE_HOURS); not inside a closure (ERR_FACILITY_CLOSED); no half-open overlap with another SCHEDULED game at the facility (ERR_FACILITY_DOUBLE_BOOKED); neither team has an overlapping SCHEDULED game (ERR_TEAM_TIME_CONFLICT)"
        side_effects:
          - "start_at/end_at/facility_id replaced; duration_minutes recomputed"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /v1/games/{game_id}/reschedule (direct move)"
        actor: LeagueCoordinator
        preconditions:
          - "Same validations as RESCHEDULE_REQUIRED -> SCHEDULED"
        side_effects:
          - "All OfficiatingAssignments in ASSIGNED | ACCEPTED -> CANCELLED with provisional pay reversal, then new time applied"
      - from: SCHEDULED
        to: PLAYED_PENDING_CONFIRM
        trigger: "POST /v1/games/{game_id}/score-reports (first of the two sides to report)"
        actor: "Member (captain of the reported side)"
        preconditions:
          - "logical now >= game.start_at (ERR_GAME_NOT_REPORTABLE)"
          - "X-User-ID == captain_member_id of the team on the reported side (ERR_FORBIDDEN)"
        side_effects:
          - "report_home or report_away (matching the side) is stored"
      - from: PLAYED_PENDING_CONFIRM
        to: FINAL
        trigger: "POST /v1/games/{game_id}/score-reports (second side) with home_score and away_score exactly matching the stored report, OR POST /v1/games/{game_id}/finalize"
        actor: "Member (opposing captain) or RecAdmin"
        preconditions:
          - "Second report: side must differ from the stored report's side (ERR_DUPLICATE_SCORE_REPORT)"
          - "Matching report on a playoff game (bracket_round != REGULAR) with home_score == away_score is rejected (ERR_TIE_NOT_ALLOWED)"
          - "finalize: RecAdmin supplies authoritative scores + actual_duration_minutes"
        side_effects:
          - "Apply calculations.game_result_effects: standings points (win 3 / tie 1 / loss 0; tie only when bracket_round == REGULAR), sportsmanship entries to each team (score-report path: each team's received rating = the opponent report's opponent_sportsmanship), OfficiatingAssignments ACCEPTED -> WORKED (ASSIGNED unchanged), then calculations.team_suspension_sweep on both teams"
          - "If this game is a SEMIFINAL and its sibling SEMIFINAL (same league + division_name) is FINAL|FORFEITED: system creates the CHAMPIONSHIP game (home = higher-seed winner, away = other winner, status RESCHEDULE_REQUIRED) and sets next_game_id on both semifinals"
          - "If this game is a CHAMPIONSHIP and every division bracket now has its championship FINAL|FORFEITED: League -> COMPLETED cascade"
      - from: PLAYED_PENDING_CONFIRM
        to: DISPUTED
        trigger: "POST /v1/games/{game_id}/score-reports (second side) whose scores do NOT exactly match the stored report"
        actor: "Member (opposing captain)"
        preconditions:
          - "Second report side differs from stored side (ERR_DUPLICATE_SCORE_REPORT)"
        side_effects:
          - "Both reports kept (report_home, report_away); no standings/sportsmanship effects yet"
      - from: DISPUTED
        to: FINAL
        trigger: "POST /v1/games/{game_id}/finalize (RecAdmin resolution)"
        actor: RecAdmin
        preconditions: []
        side_effects:
          - "Same game_result_effects as the matching-report path, using coordinator-supplied scores, sportsmanship ratings, and actual_duration_minutes"
      - from: [SCHEDULED, RESCHEDULE_REQUIRED]
        to: FORFEITED
        trigger: "POST /v1/games/{game_id}/declare-forfeit (game-time forfeit) OR system cascade (team suspension/withdrawal)"
        actor: "LeagueCoordinator or system"
        preconditions:
          - "Manual: logical now >= game.start_at (ERR_GAME_NOT_REPORTABLE); forfeiting_team_id must equal home_team_id or away_team_id (ERR_FORFEITING_TEAM_INVALID)"
          - "Manual on a RESCHEDULE_REQUIRED playoff game also allowed"
        side_effects:
          - "Forfeiting team: losses += 1, forfeit_count += 1, sportsmanship_points_total += 1, sportsmanship_rating_count += 1 (automatic 1)"
          - "Opponent: wins += 1, points += 3, no sportsmanship entry"
          - "Manual declare-forfeit ONLY: OfficiatingAssignments ACCEPTED -> WORKED (eligible for flat forfeit fee at settle); ASSIGNED -> CANCELLED (provisional reversed)"
          - "System cascade-forfeit (suspension/withdrawal): ALL non-terminal assignments -> CANCELLED (provisional reversed); nobody is WORKED"
          - "calculations.team_suspension_sweep on the forfeiting team"
          - "Playoff bracket advancement treats FORFEITED like FINAL (winner = non-forfeiting team)"
      - from: [SCHEDULED, RESCHEDULE_REQUIRED, PLAYED_PENDING_CONFIRM, DISPUTED]
        to: CANCELLED
        trigger: "system (league cancellation)"
        actor: system
        preconditions: []
        side_effects:
          - "OfficiatingAssignments ASSIGNED | ACCEPTED -> CANCELLED with provisional pay reversal; no standings or sportsmanship effects"

  - entity: OfficiatingAssignment
    field: status
    initial_state: ASSIGNED
    terminal_states: [PAID, DECLINED, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: ACCEPTED
        trigger: "POST /v1/officiating-assignments/{officiating_assignment_id}/respond {response: ACCEPT}"
        actor: "Staff (the assigned official)"
        preconditions:
          - "X-User-ID == assignment.staff_id (ERR_FORBIDDEN)"
          - "status == ASSIGNED (ERR_INVALID_STATE)"
        side_effects: []
      - from: ASSIGNED
        to: DECLINED
        trigger: "POST /v1/officiating-assignments/{officiating_assignment_id}/respond {response: DECLINE}"
        actor: "Staff (the assigned official)"
        preconditions:
          - "X-User-ID == assignment.staff_id (ERR_FORBIDDEN)"
          - "status == ASSIGNED (ERR_INVALID_STATE)"
        side_effects:
          - "Staff.payroll_pending_cents -= provisional_pay_cents"
      - from: ACCEPTED
        to: WORKED
        trigger: "system (game reaches FINAL, or manual declare-forfeit)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WORKED
        to: PAID
        trigger: "POST /v1/officiating-assignments/{officiating_assignment_id}/settle"
        actor: LeagueCoordinator
        preconditions:
          - "status == WORKED (ERR_INVALID_STATE)"
        side_effects:
          - "final_pay_cents computed per calculations.official_pay_final"
          - "Staff.payroll_pending_cents -= provisional_pay_cents; Staff.payroll_paid_cents += final_pay_cents"
      - from: [ASSIGNED, ACCEPTED]
        to: CANCELLED
        trigger: "system (game reschedule, facility closure bump, league/withdrawal/suspension cascade, or ASSIGNED-at-forfeit)"
        actor: system
        preconditions: []
        side_effects:
          - "Staff.payroll_pending_cents -= provisional_pay_cents"

  - entity: InjuryReport
    field: status
    initial_state: REPORTED
    terminal_states: [CLEARED]
    transitions:
      - from: REPORTED
        to: CLEARED
        trigger: "POST /v1/injury-reports/{injury_report_id}/clear"
        actor: RecAdmin
        preconditions:
          - "status == REPORTED (ERR_INVALID_STATE)"
        side_effects:
          - "clearance_note stored"
          - "If the member has no remaining REPORTED report with severity IN {MODERATE, SEVERE}: Member.status SUSPENDED -> ACTIVE"

  - entity: EquipmentCheckout
    field: status
    initial_state: OUT
    terminal_states: [RETURNED, LOST]
    transitions:
      - from: OUT
        to: RETURNED
        trigger: "POST /v1/equipment-checkouts/{equipment_checkout_id}/return"
        actor: FacilityManager
        preconditions:
          - "status == OUT (ERR_INVALID_STATE)"
        side_effects:
          - "returned_at = logical now; late_fee_cents computed per calculations.equipment_late_fee_cents"
          - "EquipmentPool.available_qty += quantity"
          - "Member.outstanding_fines_cents += late_fee_cents"
      - from: OUT
        to: LOST
        trigger: "POST /v1/equipment-checkouts/{equipment_checkout_id}/report-lost"
        actor: FacilityManager
        preconditions:
          - "status == OUT (ERR_INVALID_STATE)"
        side_effects:
          - "Member.outstanding_fines_cents += quantity * EquipmentPool.unit_replacement_cents"
          - "EquipmentPool.total_qty -= quantity (available_qty unchanged; units permanently leave the pool)"

  - entity: Locker
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    note: "Cyclic: AVAILABLE -> RENTED -> AVAILABLE"
    transitions:
      - from: AVAILABLE
        to: RENTED
        trigger: "POST /v1/lockers/{locker_id}/rent"
        actor: "Member (self) "
        preconditions:
          - "status == AVAILABLE (ERR_LOCKER_UNAVAILABLE)"
          - "member has no other Locker with status RENTED (ERR_RENTAL_EXISTS)"
          - "member waiver valid (ERR_WAIVER_INVALID) and membership ACTIVE (ERR_MEMBERSHIP_INACTIVE)"
        side_effects:
          - "rented_by_member_id, rental_term set; rental_fee_cents per calculations.locker_fee_cents"
      - from: RENTED
        to: AVAILABLE
        trigger: "POST /v1/lockers/{locker_id}/release"
        actor: "Member (current renter) or FacilityManager"
        preconditions:
          - "status == RENTED (ERR_INVALID_STATE)"
        side_effects:
          - "rented_by_member_id, rental_term, rental_fee_cents cleared to null"

  - entity: FitnessClass
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /v1/fitness-classes/{fitness_class_id}/complete"
        actor: "Staff (the class instructor) or RecAdmin"
        preconditions:
          - "status == SCHEDULED (ERR_INVALID_STATE)"
          - "logical now >= end_at (ERR_INVALID_STATE)"
          - "Staff caller: X-User-ID == class.instructor_staff_id (ERR_FORBIDDEN)"
        side_effects:
          - "Registrations REGISTERED -> ATTENDED unless listed in no_show_registration_ids, in which case -> NO_SHOW (member.no_show_count += 1 each); registrations WAITLISTED -> CANCELLED"
          - "attendance_count set; instructor_pay_cents computed per calculations.instructor_session_pay; Staff.payroll_paid_cents += instructor_pay_cents (instructor rail: direct to paid, never pending)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (facility closure overlapping [start_at, end_at)) — classes are never manually cancelled"
        actor: system
        preconditions: []
        side_effects:
          - "All registrations REGISTERED | WAITLISTED -> CANCELLED; NO waitlist promotion runs (the class is dead); no instructor pay"

  - entity: ClassRegistration
    field: status
    initial_state: REGISTERED
    terminal_states: [CANCELLED, ATTENDED, NO_SHOW]
    note: "Initial state is capacity-dependent: REGISTERED if registered_count < capacity at creation else WAITLISTED"
    transitions:
      - from: WAITLISTED
        to: REGISTERED
        trigger: "system (promotion: a REGISTERED registration of the same class is cancelled)"
        actor: system
        preconditions:
          - "Selector per calculations.waitlist_promotion: earliest created_at among WAITLISTED; tie -> Member.created_at ASC; empty waitlist -> no-op"
        side_effects:
          - "class.waitlist_count -= 1; class.registered_count unchanged (seat handed off — conservation invariant)"
      - from: [REGISTERED, WAITLISTED]
        to: CANCELLED
        trigger: "POST /v1/class-registrations/{class_registration_id}/cancel, or system (injury-hold cascade: REGISTERED only; class-cancel cascade: both)"
        actor: "Member (self), RecAdmin, or system"
        preconditions:
          - "status IN {REGISTERED, WAITLISTED} (ERR_INVALID_STATE)"
        side_effects:
          - "If REGISTERED: class.registered_count -= 1 THEN calculations.waitlist_promotion runs (which re-increments on promotion — net zero when a waitlist head exists)"
          - "If WAITLISTED: class.waitlist_count -= 1; no promotion"
      - from: REGISTERED
        to: ATTENDED
        trigger: "system (class completion, member not in no_show_registration_ids)"
        actor: system
        preconditions: []
        side_effects: ["class.attendance_count includes this entry"]
      - from: REGISTERED
        to: NO_SHOW
        trigger: "system (class completion, member listed in no_show_registration_ids)"
        actor: system
        preconditions: []
        side_effects: ["Member.no_show_count += 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: membership-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /v1/members/{member_id}/memberships"
    occ_field: "expected_member_version"
    description: |
      Creating a Membership for a Member supersedes any currently ACTIVE
      membership, which is legitimate product behavior (renewal). The create is
      rejected when the client's last-observed Member.version does not equal the
      current Member.version — i.e., the member aggregate changed (e.g., a
      waiver re-signature or another membership purchase) since the client
      priced the transaction.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: game-schedule-stale-league
    parent_entity: League
    write_endpoint: "POST /v1/leagues/{league_id}/games"
    occ_field: "expected_league_version"
    description: |
      Scheduling a Game against a League mutates the league aggregate
      (increments League.version). A create carrying an expected_league_version
      that no longer matches the league's current version is rejected, because
      the schedule view the client planned against (existing games, division
      loads) is stale. Two games at disjoint times are both legitimate — only
      the stale view is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: closure-create-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /v1/facilities/{facility_id}/closures"
    occ_field: "expected_facility_version"
    description: |
      Creating a FacilityClosure bumps games and classes out of the window and
      increments Facility.version. A create carrying an
      expected_facility_version that no longer matches is rejected: the set of
      bookings the closure would collide with may have changed since the
      client's observation.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (12)
# =============================================================================
calculations:
  - name: membership_fee_cents
    trigger: "POST /v1/members/{member_id}/memberships (at creation, using logical clock date as purchase_date)"
    algorithm: tiered_pricing
    input_set: "purchasing member's affiliation; membership term; logical current date"
    constants:
      TERM_WINDOWS: "FALL_2026: [2026-08-24, 2026-12-11] (110 days, 16 weeks); SPRING_2027: [2027-01-12, 2027-05-07] (116 days, 17 weeks); SUMMER_2027: [2027-05-24, 2027-08-06] (75 days, 11 weeks)"
      TERM_FEE_CENTS: "STUDENT: 6000; FACULTY: 20000; COMMUNITY: 32000"
      FULL_WINDOW_DAYS: 7
    precision: "integer cents; weekly rate round_half_up to whole cents BEFORE multiplying (pinned rounding order)"
    formula: |
      days_total = (term_end - term_start).days + 1
      weeks_total = ceil(days_total / 7)
      If purchase_date <= term_start + (FULL_WINDOW_DAYS - 1) days:   # day 1..7 inclusive -> FULL
          variant = FULL;  fee_cents = TERM_FEE_CENTS[affiliation]
      Else:                                                            # day 8+ -> PRORATED
          weekly_rate_cents = round_half_up(TERM_FEE_CENTS[affiliation] / weeks_total)   # round FIRST
          days_remaining = (term_end - purchase_date).days + 1                            # inclusive
          weeks_remaining = ceil(days_remaining / 7)
          variant = PRORATED;  fee_cents = weekly_rate_cents * weeks_remaining            # multiply SECOND
      Purchase after term_end -> ERR_VALIDATION. Purchase before term_start is allowed at FULL.
    variants:
      - name: FULL
        when: "purchase within the first FULL_WINDOW_DAYS days of the term (inclusive of day 7)"
        difference: "flat affiliation term fee regardless of remaining weeks"
      - name: PRORATED
        when: "purchase on day 8 or later"
        difference: "weekly rate rounded first then multiplied by whole remaining weeks; diverges from the naive term_fee * days_remaining / days_total interpretation"

  - name: waiver_academic_year_window
    trigger: "every eligibility check that requires a valid waiver"
    algorithm: interval_membership
    input_set: "Member.waiver_signed_date; logical current date"
    formula: |
      Academic year (AY) of a date: months Aug..Dec -> AY starts Aug 1 of that year; months Jan..Jul -> AY started Aug 1 of the previous year. AY window = [AY_start, AY_start + 1 year - 1 day] (Jul 31).
      waiver_valid == (waiver_signed_date is not null) AND (AY(waiver_signed_date) == AY(logical current date))
      # A waiver signed 2026-09-15 is valid 2026-08-01..2027-07-31 and stale from 2027-08-01.

  - name: facility_slot_fit
    trigger: "game create, game reschedule, fitness-class create"
    algorithm: interval_merge
    input_set: "facility operating_windows and closures; candidate [start_at, end_at); existing bookings"
    formula: |
      Hours fit: booking start/end land on one calendar date D; facility.operating_windows must contain a window with day_of_week == weekday(D), start_minute >= open_minute, and end_minute <= close_minute (end == close_minute is ALLOWED).
      Closure exclusion: reject if candidate overlaps any closure interval; closures are half-open [cs, ce): overlap iff start_at < ce AND cs < end_at. A booking starting exactly at closure end (start_at == ce) is ALLOWED.
      Double booking: reject if candidate overlaps another SCHEDULED game OR another SCHEDULED fitness class at the same facility; bookings are half-open [s, e): overlap iff s < e2 AND s2 < e. Adjacency (end == start) is ALLOWED — no buffer.
    variants: []

  - name: official_travel_buffer
    trigger: "POST /v1/games/{game_id}/officiating-assignments"
    algorithm: interval_merge
    input_set: "the official's OfficiatingAssignments with status IN {ASSIGNED, ACCEPTED, WORKED} whose games have status IN {SCHEDULED, PLAYED_PENDING_CONFIRM, DISPUTED, FINAL, FORFEITED}"
    constants:
      TRAVEL_BUFFER_MINUTES: 30
    formula: |
      For each such assignment's game with interval [gs, ge): the candidate game [cs, ce) conflicts unless (cs - ge) >= TRAVEL_BUFFER_MINUTES minutes OR (gs - ce) >= TRAVEL_BUFFER_MINUTES minutes.
      gap exactly == 30 minutes is ALLOWED (>=); gap 29 is rejected (ERR_OFFICIAL_DOUBLE_BOOKED).
      Games without scheduled times (RESCHEDULE_REQUIRED playoff shells) do not participate.

  - name: official_pay_provisional
    trigger: "POST /v1/games/{game_id}/officiating-assignments (creation)"
    algorithm: tiered_pricing
    input_set: "game.duration_minutes; official.base_hourly_rate_cents; official.certification_level"
    constants:
      CERT_MULTIPLIER: "1: 1.0; 2: 1.25; 3: 1.5"
    precision: "integer cents, round_half_up"
    formula: |
      provisional_pay_cents = round_half_up(duration_minutes * base_hourly_rate_cents * CERT_MULTIPLIER[certification_level] / 60)
      Staff.payroll_pending_cents += provisional_pay_cents

  - name: official_pay_final
    trigger: "POST /v1/officiating-assignments/{id}/settle"
    algorithm: tiered_pricing
    input_set: "game.status at settle (FINAL | FORFEITED); game.actual_duration_minutes (set only by finalize); official rate and certification"
    constants:
      CERT_MULTIPLIER: "1: 1.0; 2: 1.25; 3: 1.5"
      FORFEIT_FLAT_HOURS: 1
    precision: "integer cents, round_half_up"
    formula: |
      If game.status == FINAL:
          minutes = game.actual_duration_minutes if not null else game.duration_minutes
          final_pay_cents = round_half_up(minutes * base_hourly_rate_cents * CERT_MULTIPLIER[certification_level] / 60)
      If game.status == FORFEITED:
          final_pay_cents = base_hourly_rate_cents * FORFEIT_FLAT_HOURS   # flat fee, NO certification multiplier, duration ignored
      Ledger move: payroll_pending_cents -= provisional_pay_cents; payroll_paid_cents += final_pay_cents.
    variants:
      - name: provisional
        when: "assignment creation"
        difference: "scheduled duration, always multiplied"
      - name: final
        when: "settle"
        difference: "actual duration when recorded; FORFEITED pays a flat 1-hour base with NO multiplier — same assignment can settle for less than its provisional"

  - name: instructor_session_pay
    trigger: "POST /v1/fitness-classes/{id}/complete (final) and class read (estimate)"
    algorithm: threshold
    input_set: "class.duration_minutes; instructor.base_hourly_rate_cents; attendance_count vs capacity at completion"
    constants:
      BONUS_TIERS: "attendance_count/capacity >= 0.80 -> +20%; >= 0.50 -> +10%; else +0% (bounds inclusive)"
    precision: "integer cents; round_half_up PER SESSION, then term totals sum the rounded per-session values (pinned order — never sum raw values then round)"
    formula: |
      Estimate (at creation): instructor_pay_estimate_cents = round_half_up(duration_minutes * base_hourly_rate_cents / 60)   # no bonus
      Final (at completion):
        fill = attendance_count / capacity
        bonus = 0.20 if fill >= 0.80 else (0.10 if fill >= 0.50 else 0.0)
        instructor_pay_cents = round_half_up(duration_minutes * base_hourly_rate_cents * (1 + bonus) / 60)
      Instructor term payroll total = SUM of per-class instructor_pay_cents (already rounded per session).
      Boundary: capacity 10, attendance 8 -> fill 0.80 exactly -> +20%.

  - name: sportsmanship_rating
    trigger: "game finalize / matching score report / forfeit (each applies received ratings)"
    algorithm: aggregation
    input_set: "all received ratings: opponent-submitted 1..5 per finalized game, plus automatic 1 per forfeited game"
    precision: "2 decimal places, round_half_up"
    formula: |
      sportsmanship_rating = round_half_up(sportsmanship_points_total / sportsmanship_rating_count, 2)
      While sportsmanship_rating_count == 0: rating is null; playoff eligibility treats null as 0.00.

  - name: playoff_eligibility
    trigger: "POST /v1/leagues/{id}/start-playoffs"
    algorithm: threshold
    input_set: "teams of the league with status ACTIVE at start-playoffs"
    constants:
      MIN_RATING: "3.00 (inclusive)"
      MAX_FORFEITS: 1
    formula: |
      eligible(team) == team.status == ACTIVE
                         AND (team.sportsmanship_rating or 0.00) >= 3.00     # exactly 3.00 IS eligible
                         AND team.forfeit_count <= 1                          # exactly 1 forfeit IS eligible

  - name: playoff_seeding
    trigger: "POST /v1/leagues/{id}/start-playoffs"
    algorithm: weighted_scoring
    input_set: "eligible ACTIVE teams per division"
    formula: |
      Rank per division by, in order:
        1. points DESC
        2. head-to-head points DESC among tied teams (points earned in games between the tied teams only)
        3. sportsmanship_rating DESC (null treated as 0.00)
        4. forfeit_count ASC
        5. Team.created_at ASC
      Bracket: >= 4 eligible -> SEMIFINAL (seed1 home vs seed4 away) + SEMIFINAL (seed2 home vs seed3 away);
               2..3 eligible -> single CHAMPIONSHIP (seed1 home vs seed2 away); < 2 -> no bracket for that division.

  - name: game_result_effects
    trigger: "game -> FINAL (matching reports or finalize) and game -> FORFEITED"
    algorithm: aggregation
    input_set: "the two teams; authoritative scores; sportsmanship submissions"
    constants:
      WIN_POINTS: 3
      TIE_POINTS: 1
      LOSS_POINTS: 0
    formula: |
      FINAL: winner (higher score) wins += 1, points += 3; loser losses += 1. Equal scores (REGULAR only): both ties += 1, points += 1.
      Sportsmanship on FINAL: score-report path credits each team with the opponent report's opponent_sportsmanship; finalize path credits home team with finalize.home_sportsmanship and away team with finalize.away_sportsmanship (each points_total += r, rating_count += 1).
      FORFEITED: forfeiting team losses += 1, forfeit_count += 1, points_total += 1, rating_count += 1 (automatic 1); opponent wins += 1, points += 3, no rating entry.
      After applying, run team_suspension_sweep on any team whose forfeit_count changed.

  - name: team_suspension_sweep
    trigger: "after game_result_effects"
    algorithm: threshold
    constants:
      FORFEIT_SUSPENSION_THRESHOLD: 3
    formula: |
      If team.status == ACTIVE and team.forfeit_count >= 3: team -> SUSPENDED and cascade-forfeit its remaining SCHEDULED|RESCHEDULE_REQUIRED games (see Team state machine).

  - name: equipment_late_fee_cents
    trigger: "POST /v1/equipment-checkouts/{id}/return"
    algorithm: threshold
    input_set: "checkout.due_at; logical now at return; quantity; pool rates"
    precision: "integer cents; days computed by ceiling FIRST, then multiplied, then capped (pinned order)"
    formula: |
      seconds_late = max(0, now - due_at)                # return exactly AT due_at -> 0 seconds -> 0 days (on time)
      days_late = ceil(seconds_late / 86400)             # any partial day rounds UP; 1 second late = 1 day
      raw = days_late * pool.daily_late_fee_cents * quantity
      late_fee_cents = min(raw, quantity * pool.unit_replacement_cents)   # cap at replacement value
    variants: []

  - name: waitlist_promotion
    trigger: "a REGISTERED ClassRegistration is cancelled (member cancel or injury cascade)"
    algorithm: selector
    input_set: "the class's registrations with status WAITLISTED"
    formula: |
      Candidates: registrations of this class with status WAITLISTED.
      Ranking: ClassRegistration.created_at ASC; tie-break: the candidate's Member.created_at ASC.
      Promote the head to REGISTERED; empty candidate set -> no-op.
      Never runs when the class itself is CANCELLED or COMPLETED.

  - name: free_agent_placement
    trigger: "POST /v1/leagues/{id}/place-free-agent"
    algorithm: selector
    input_set: "league's teams and the target POOLED free_agent_pool entry"
    formula: |
      Candidates: teams of the league with status IN {REGISTERED, PLACED} and active_roster_count < league.roster_max.
      If pool entry preferred_division_name is not null: keep only teams with division_name == preferred_division_name (STRICT — no fallback to other divisions).
      Ranking: active_roster_count ASC; tie-break: Team.created_at ASC.
      Empty candidate set -> ERR_NO_TEAM_AVAILABLE.
      Effect: create RosterEntry (role PLAYER, ACTIVE) for the member on the selected team; pool entry -> PLACED; team.active_roster_count += 1.

  - name: locker_fee_cents
    trigger: "POST /v1/lockers/{id}/rent"
    algorithm: tiered_pricing
    constants:
      TERM_FEE_CENTS: "STUDENT: 1500; FACULTY: 1500; COMMUNITY: 3000"
    formula: |
      rental_fee_cents = TERM_FEE_CENTS[renter.affiliation]   # flat per term, no proration, no fines gate

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins on dual failure)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty; X-User-Role must be one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per §1.5 roles; ownership checks for entity-backed roles (Member: path/body member_id == X-User-ID, roster/score-report caller is the team's captain_member_id, registration/checkout/locker/fine-payment/waiver/membership self-service; Staff: assignment.staff_id or class.instructor_staff_id == X-User-ID)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path resource ids exist, evaluated left-to-right; body FK references exist; division_name refers to an entry of League.divisions"
    error_id: "ERR_NOT_FOUND | ERR_DIVISION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints"
  - priority: 4
    category: request
    check: "Required fields present; enum values valid; ranges (scores >= 0, quantity >= 1, capacity >= 1, 1 <= skill_min <= skill_max <= 10, certification_level 1..3); end_at > start_at and same local date; registration_open_at < registration_close_at <= season_start_at < season_end_at; team_capacity >= min_teams >= 2; roster_max >= roster_min >= 1; home_team_id != away_team_id; conditional staff fields (certification_level required iff OFFICIAL and forbidden iff INSTRUCTOR; certified_class_types non-empty iff INSTRUCTOR and forbidden iff OFFICIAL); fine-payment 0 < amount_cents <= outstanding_fines_cents; Staff-conditional field violations use ERR_STAFF_NOT_OFFICIAL/ERR_STAFF_NOT_INSTRUCTOR only in assignment/class contexts, raw field violations here"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: concurrency
    check: "On OCC-guarded writes, expected_<parent>_version must equal the parent's current version (checked after existence, before state)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /v1/members/{id}/memberships; POST /v1/leagues/{id}/games; POST /v1/facilities/{id}/closures"
  - priority: 6
    category: state
    check: "State preconditions, evaluated path-scope-first then body-referenced entities: league status gate (ERR_INVALID_STATE / ERR_LEAGUE_NOT_ACCEPTING_REGISTRATIONS), team status (a SUSPENDED/WITHDRAWN team cannot be scheduled — ERR_INVALID_STATE), member status (ERR_MEMBER_SUSPENDED), then the target resource's own transition legality (ERR_INVALID_STATE, ERR_GAME_NOT_REPORTABLE)"
    error_id: "ERR_INVALID_STATE | ERR_MEMBER_SUSPENDED | ERR_LEAGUE_NOT_ACCEPTING_REGISTRATIONS | ERR_GAME_NOT_REPORTABLE"
    http_status: 409
    applies_to: "state-gated endpoints"
  - priority: 7
    category: business_safety
    check: "Waiver valid for the current academic year per calculations.waiver_academic_year_window (roster add, free-agent register, class registration, equipment checkout, locker rent)"
    error_id: ERR_WAIVER_INVALID
    http_status: 422
    applies_to: "member-eligibility-gated endpoints"
  - priority: 8
    category: business_referential
    check: "Member holds a membership whose lazily-evaluated status is ACTIVE (same endpoints as waiver; membership check runs AFTER waiver check)"
    error_id: ERR_MEMBERSHIP_INACTIVE
    http_status: 409
    applies_to: "member-eligibility-gated endpoints"
  - priority: 9
    category: business_temporal
    check: "Temporal checks in this fixed sub-order: ERR_GAME_IN_PAST -> ERR_FACILITY_OUTSIDE_HOURS -> ERR_FACILITY_CLOSED -> ERR_FACILITY_DOUBLE_BOOKED -> ERR_TEAM_TIME_CONFLICT -> ERR_CLASS_TIME_CONFLICT -> ERR_OFFICIAL_DOUBLE_BOOKED"
    error_id: "ERR_GAME_IN_PAST | ERR_FACILITY_OUTSIDE_HOURS | ERR_FACILITY_CLOSED | ERR_FACILITY_DOUBLE_BOOKED | ERR_TEAM_TIME_CONFLICT | ERR_CLASS_TIME_CONFLICT | ERR_OFFICIAL_DOUBLE_BOOKED"
    http_status: "422 for ERR_GAME_IN_PAST / ERR_FACILITY_OUTSIDE_HOURS; 409 for the rest"
    applies_to: "game create/reschedule, fitness-class create, class registration, officiating assignment"
  - priority: 10
    category: business_constraint
    check: "Constraint checks: ERR_TEAM_ALREADY_IN_LEAGUE (captain already has a non-WITHDRAWN team in league), ERR_MEMBER_ALREADY_IN_LEAGUE / ERR_ALREADY_IN_POOL, ERR_CAPTAIN_REMOVAL_FORBIDDEN, ERR_DIVISION_SKILL_MISMATCH, ERR_TEAMS_NOT_IN_SAME_DIVISION, ERR_TIE_NOT_ALLOWED, ERR_FORFEITING_TEAM_INVALID, ERR_STAFF_NOT_OFFICIAL / ERR_STAFF_NOT_INSTRUCTOR, ERR_OFFICIAL_CERT_TOO_LOW, ERR_INSTRUCTOR_NOT_CERTIFIED, ERR_INJURY_GAME_MISMATCH, ERR_CLASS_ALREADY_REGISTERED, ERR_RENTAL_EXISTS, ERR_DUPLICATE_SCORE_REPORT, ERR_TOO_FEW_TEAMS, ERR_LEAGUE_NOT_READY_FOR_SEASON, ERR_PLAYOFFS_NOT_READY, ERR_NO_ELIGIBLE_TEAMS"
    error_id: "various (see §1.6)"
    http_status: "409 | 422"
    applies_to: "domain write endpoints"
  - priority: 11
    category: business_capacity
    check: "Capacity checks (run AFTER constraint checks): ERR_LEAGUE_FULL, ERR_DIVISION_FULL, ERR_ROSTER_FULL, ERR_ASSIGNMENT_LIMIT_REACHED, ERR_EQUIPMENT_INSUFFICIENT, ERR_NO_TEAM_AVAILABLE, ERR_LOCKER_UNAVAILABLE. Fitness-class full is NOT an error — it produces WAITLISTED."
    error_id: "various (see §1.6)"
    http_status: "409 | 422"
    applies_to: "allocating endpoints"
  - priority: 12
    category: business_fiscal
    check: "Member.outstanding_fines_cents == 0 required for equipment checkout (runs last; locker's rent is NOT fine-gated)"
    error_id: ERR_OUTSTANDING_FINES
    http_status: 402
    applies_to: "POST /v1/equipment-checkouts"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table (70 endpoints; all paths under /v1)
# =============================================================================
endpoints:
  # --- Members & waivers ---
  - method: POST
    path: "/v1/members"
    description: "Create a member"
    roles: [RecAdmin]
    code: 201
    input: [email, full_name, affiliation]
    output: Member
    side_effects: ["status=ACTIVE, waiver_signed_date=null, outstanding_fines_cents=0, no_show_count=0, version=1"]
  - method: GET
    path: "/v1/members/{member_id}"
    description: "Get a member"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: POST
    path: "/v1/members/{member_id}/waiver-sign"
    description: "Sign (or re-sign) the liability waiver; sets waiver_signed_date to the logical current date; bumps Member.version"
    roles: [Member]
    code: 200
    input: []
    output: Member
    side_effects: ["waiver_signed_date = logical current date", "increments Member.version by 1"]
  - method: POST
    path: "/v1/members/{member_id}/memberships"
    description: "Purchase a membership; if an ACTIVE membership exists it is superseded (create-with-supersede); OCC-guarded on Member.version; computes pricing_variant + fee_cents per calculations.membership_fee_cents"
    roles: [Member]
    code: 201
    input: [term, expected_member_version]
    output: Membership
    side_effects: ["prior ACTIVE membership -> SUPERSEDED; new row supersedes_membership_id set", "increments Member.version by 1"]
  - method: GET
    path: "/v1/memberships/{membership_id}"
    description: "Get a membership"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: []
    output: Membership
    side_effects: []
  - method: GET
    path: "/v1/memberships"
    description: "List memberships (filtered)"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: ["member_id?", "term?", "status?", "supersedes_membership_id?", "limit?", "offset?"]
    output: "Membership[]"
    side_effects: []
  - method: POST
    path: "/v1/memberships/{membership_id}/cancel"
    description: "Cancel an ACTIVE membership (no refund)"
    roles: [Member, RecAdmin]
    code: 200
    input: []
    output: Membership
    side_effects: ["status ACTIVE -> CANCELLED"]
  - method: POST
    path: "/v1/members/{member_id}/fine-payments"
    description: "Pay down outstanding fines; 0 < amount_cents <= outstanding_fines_cents"
    roles: [Member]
    code: 200
    input: [amount_cents]
    output: Member
    side_effects: ["outstanding_fines_cents -= amount_cents", "increments Member.version by 1"]
  # --- Injury reports ---
  - method: POST
    path: "/v1/injury-reports"
    description: "Report an injury; MODERATE|SEVERE imposes a participation hold (Member ACTIVE -> SUSPENDED with class-registration cancellation cascade)"
    roles: [Member, FacilityManager]
    code: 201
    input: [member_id, severity, description, "game_id?"]
    output: InjuryReport
    side_effects: ["if severity IN {MODERATE, SEVERE}: Member -> SUSPENDED; future REGISTERED class registrations -> CANCELLED; each cancellation triggers waitlist promotion"]
  - method: GET
    path: "/v1/injury-reports/{injury_report_id}"
    description: "Get an injury report"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: []
    output: InjuryReport
    side_effects: []
  - method: GET
    path: "/v1/injury-reports"
    description: "List injury reports (filtered)"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: ["member_id?", "game_id?", "status?", "limit?", "offset?"]
    output: "InjuryReport[]"
    side_effects: []
  - method: POST
    path: "/v1/injury-reports/{injury_report_id}/clear"
    description: "Clear a report; member reinstated only when no other REPORTED hold-severity report remains"
    roles: [RecAdmin]
    code: 200
    input: [clearance_note]
    output: InjuryReport
    side_effects: ["status -> CLEARED", "conditional Member SUSPENDED -> ACTIVE"]
  # --- Leagues ---
  - method: POST
    path: "/v1/leagues"
    description: "Create a league (DRAFT) with divisions array"
    roles: [RecAdmin]
    code: 201
    input: [name, sport, divisions, registration_open_at, registration_close_at, season_start_at, season_end_at, team_capacity, min_teams, roster_min, roster_max]
    output: League
    side_effects: ["status=DRAFT, free_agent_pool=[], version=1"]
  - method: GET
    path: "/v1/leagues/{league_id}"
    description: "Get a league (includes free_agent_pool and divisions)"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: []
    output: League
    side_effects: []
  - method: POST
    path: "/v1/leagues/{league_id}/open-registration"
    description: "DRAFT -> REGISTRATION_OPEN"
    roles: [LeagueCoordinator]
    code: 200
    input: []
    output: League
    side_effects: ["increments League.version by 1"]
  - method: POST
    path: "/v1/leagues/{league_id}/close-registration"
    description: "REGISTRATION_OPEN -> SCHEDULING; requires >= min_teams"
    roles: [LeagueCoordinator]
    code: 200
    input: []
    output: League
    side_effects: ["increments League.version by 1"]
  - method: POST
    path: "/v1/leagues/{league_id}/start-season"
    description: "SCHEDULING -> IN_SEASON; all teams placed; rosters >= roster_min; locks rosters"
    roles: [LeagueCoordinator]
    code: 200
    input: []
    output: League
    side_effects: ["PLACED teams -> ACTIVE", "increments League.version by 1"]
  - method: POST
    path: "/v1/leagues/{league_id}/start-playoffs"
    description: "IN_SEASON -> PLAYOFFS; computes eligibility + seeding; auto-creates bracket games in RESCHEDULE_REQUIRED"
    roles: [LeagueCoordinator]
    code: 200
    input: []
    output: League
    side_effects: ["bracket games created per calculations.playoff_seeding", "increments League.version by 1"]
  - method: POST
    path: "/v1/leagues/{league_id}/cancel"
    description: "Cancel league (from DRAFT..IN_SEASON); cascades to games, assignments, teams, free-agent pool"
    roles: [LeagueCoordinator]
    code: 200
    input: []
    output: League
    side_effects: ["non-terminal games -> CANCELLED", "non-terminal assignments on them -> CANCELLED with pay reversal", "teams -> WITHDRAWN", "pool entries -> WITHDRAWN", "increments League.version by 1"]
  - method: POST
    path: "/v1/leagues/{league_id}/free-agents"
    description: "Member self-registers into the league free-agent pool"
    roles: [Member]
    code: 201
    input: [member_id, "preferred_division_name?"]
    output: League
    side_effects: ["appends {member_id, preferred_division_name, registered_at: logical now, status: POOLED} to free_agent_pool", "increments League.version by 1"]
  - method: POST
    path: "/v1/leagues/{league_id}/place-free-agent"
    description: "Place a POOLED free agent onto a team via calculations.free_agent_placement (deterministic selector)"
    roles: [LeagueCoordinator]
    code: 200
    input: [member_id]
    output: RosterEntry
    side_effects: ["creates ACTIVE RosterEntry (role PLAYER) on selected team", "pool entry -> PLACED", "team.active_roster_count += 1", "increments League.version by 1"]
  # --- Teams & rosters ---
  - method: POST
    path: "/v1/teams"
    description: "Register a team into a league (league must be REGISTRATION_OPEN)"
    roles: [LeagueCoordinator]
    code: 201
    input: [league_id, name, captain_member_id, skill_rating]
    output: Team
    side_effects: ["status=REGISTERED, all counters 0, division_name=null"]
  - method: GET
    path: "/v1/teams/{team_id}"
    description: "Get a team"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: []
    output: Team
    side_effects: []
  - method: GET
    path: "/v1/teams"
    description: "List teams (filtered)"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: ["league_id?", "captain_member_id?", "division_name?", "status?", "limit?", "offset?"]
    output: "Team[]"
    side_effects: []
  - method: POST
    path: "/v1/teams/{team_id}/place-division"
    description: "Place a REGISTERED team into a division (league must be SCHEDULING)"
    roles: [LeagueCoordinator]
    code: 200
    input: [division_name]
    output: Team
    side_effects: ["status -> PLACED", "division_name set"]
  - method: POST
    path: "/v1/teams/{team_id}/reinstate"
    description: "SUSPENDED -> ACTIVE (league must be IN_SEASON); does not reset forfeit_count"
    roles: [LeagueCoordinator]
    code: 200
    input: []
    output: Team
    side_effects: []
  - method: POST
    path: "/v1/teams/{team_id}/withdraw"
    description: "Withdraw a team; from ACTIVE|SUSPENDED cascade-forfeits remaining scheduled games (assignments CANCELLED, no pay)"
    roles: [Member, LeagueCoordinator]
    code: 200
    input: []
    output: Team
    side_effects: ["status -> WITHDRAWN", "cascade-forfeit of SCHEDULED|RESCHEDULE_REQUIRED games when withdrawing from ACTIVE|SUSPENDED"]
  - method: POST
    path: "/v1/teams/{team_id}/roster-entries"
    description: "Captain adds a player (league REGISTRATION_OPEN, team REGISTERED|PLACED, eligibility + uniqueness + roster_max gates)"
    roles: [Member]
    code: 201
    input: [member_id]
    output: RosterEntry
    side_effects: ["status=ACTIVE; role=CAPTAIN if member is team captain else PLAYER", "team.active_roster_count += 1"]
  - method: GET
    path: "/v1/roster-entries/{roster_entry_id}"
    description: "Get a roster entry"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: []
    output: RosterEntry
    side_effects: []
  - method: GET
    path: "/v1/roster-entries"
    description: "List roster entries (filtered)"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: ["team_id?", "member_id?", "status?", "limit?", "offset?"]
    output: "RosterEntry[]"
    side_effects: []
  - method: POST
    path: "/v1/roster-entries/{roster_entry_id}/remove"
    description: "Remove an ACTIVE roster entry while the team's roster is unlocked; captain's own entry is unremovable"
    roles: [Member, LeagueCoordinator]
    code: 200
    input: []
    output: RosterEntry
    side_effects: ["status -> REMOVED", "team.active_roster_count -= 1"]
  # --- Facilities ---
  - method: POST
    path: "/v1/facilities"
    description: "Create a facility with recurring weekly operating_windows"
    roles: [RecAdmin]
    code: 201
    input: [name, kind, operating_windows]
    output: Facility
    side_effects: ["closures=[], version=1"]
  - method: GET
    path: "/v1/facilities/{facility_id}"
    description: "Get a facility (includes closures)"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: []
    output: Facility
    side_effects: []
  - method: POST
    path: "/v1/facilities/{facility_id}/closures"
    description: "Create a closure interval (half-open); OCC-guarded on Facility.version; bumps overlapping games to RESCHEDULE_REQUIRED and cancels overlapping classes (deep cascade)"
    roles: [FacilityManager]
    code: 201
    input: [start_at, end_at, reason, expected_facility_version]
    output: Facility
    side_effects:
      - "appends closure; increments Facility.version by 1"
      - "overlapping SCHEDULED games -> RESCHEDULE_REQUIRED; their ASSIGNED|ACCEPTED OfficiatingAssignments -> CANCELLED with provisional_pay_cents reversed from Staff.payroll_pending_cents"
      - "overlapping SCHEDULED FitnessClasses -> CANCELLED; their REGISTERED|WAITLISTED registrations -> CANCELLED (no promotion, no instructor pay)"
  # --- Games ---
  - method: POST
    path: "/v1/leagues/{league_id}/games"
    description: "Schedule a regular-season game; OCC-guarded on League.version; facility-hours/closure/overlap and team-conflict gates"
    roles: [LeagueCoordinator]
    code: 201
    input: [home_team_id, away_team_id, facility_id, start_at, end_at, expected_league_version]
    output: Game
    side_effects: ["status=SCHEDULED, bracket_round=REGULAR, division_name copied from teams", "increments League.version by 1"]
  - method: GET
    path: "/v1/games/{game_id}"
    description: "Get a game (includes reports and final scores)"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: []
    output: Game
    side_effects: []
  - method: GET
    path: "/v1/games"
    description: "List games (filtered)"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: ["league_id?", "facility_id?", "home_team_id?", "away_team_id?", "status?", "bracket_round?", "next_game_id?", "forfeiting_team_id?", "limit?", "offset?"]
    output: "Game[]"
    side_effects: []
  - method: POST
    path: "/v1/games/{game_id}/reschedule"
    description: "Move a SCHEDULED or RESCHEDULE_REQUIRED game to a new slot (cancels non-terminal officiating assignments); also schedules playoff shells"
    roles: [LeagueCoordinator]
    code: 200
    input: [start_at, end_at, "facility_id?"]
    output: Game
    side_effects: ["ASSIGNED|ACCEPTED assignments -> CANCELLED with pay reversal", "status -> SCHEDULED; duration_minutes recomputed"]
  - method: POST
    path: "/v1/games/{game_id}/score-reports"
    description: "Captain of one side reports score + opponent sportsmanship; matching second report finalizes; mismatching disputes"
    roles: [Member]
    code: 201
    input: [side, home_score, away_score, opponent_sportsmanship]
    output: Game
    side_effects: ["first report: SCHEDULED -> PLAYED_PENDING_CONFIRM", "second matching: -> FINAL with calculations.game_result_effects", "second mismatching: -> DISPUTED"]
  - method: POST
    path: "/v1/games/{game_id}/finalize"
    description: "RecAdmin authoritative result from PLAYED_PENDING_CONFIRM or DISPUTED; records actual_duration_minutes (drives final official pay)"
    roles: [RecAdmin]
    code: 200
    input: [home_score, away_score, home_sportsmanship, away_sportsmanship, actual_duration_minutes]
    output: Game
    side_effects: ["-> FINAL with calculations.game_result_effects", "playoff bracket advancement / league completion checks"]
  - method: POST
    path: "/v1/games/{game_id}/declare-forfeit"
    description: "Game-time forfeit (logical now >= start_at); ACCEPTED officials become WORKED (flat-fee eligible); feeds standings + automatic sportsmanship 1"
    roles: [LeagueCoordinator]
    code: 200
    input: [forfeiting_team_id]
    output: Game
    side_effects: ["-> FORFEITED with per-team forfeit effects", "ACCEPTED assignments -> WORKED; ASSIGNED -> CANCELLED", "team_suspension_sweep on forfeiting team"]
  # --- Staff & officiating ---
  - method: POST
    path: "/v1/staff"
    description: "Create a staff member (OFFICIAL or INSTRUCTOR) with role-conditional fields"
    roles: [RecAdmin]
    code: 201
    input: [full_name, staff_role, base_hourly_rate_cents, "certification_level?", "certified_class_types?"]
    output: Staff
    side_effects: ["payroll_pending_cents=0, payroll_paid_cents=0"]
  - method: GET
    path: "/v1/staff/{staff_id}"
    description: "Get a staff member (payroll aggregates)"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: []
    output: Staff
    side_effects: []
  - method: POST
    path: "/v1/games/{game_id}/officiating-assignments"
    description: "Assign an official to a SCHEDULED game; cert gate for playoff rounds; 30-minute travel buffer; per-game limit 2"
    roles: [LeagueCoordinator]
    code: 201
    input: [staff_id]
    output: OfficiatingAssignment
    side_effects: ["status=ASSIGNED", "provisional_pay_cents computed", "Staff.payroll_pending_cents += provisional_pay_cents"]
  - method: GET
    path: "/v1/officiating-assignments/{officiating_assignment_id}"
    description: "Get an officiating assignment"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: []
    output: OfficiatingAssignment
    side_effects: []
  - method: GET
    path: "/v1/officiating-assignments"
    description: "List officiating assignments (filtered)"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: ["game_id?", "staff_id?", "status?", "limit?", "offset?"]
    output: "OfficiatingAssignment[]"
    side_effects: []
  - method: POST
    path: "/v1/officiating-assignments/{officiating_assignment_id}/respond"
    description: "Assigned official accepts or declines"
    roles: [Staff]
    code: 200
    input: [response]
    output: OfficiatingAssignment
    side_effects: ["ASSIGNED -> ACCEPTED | DECLINED", "DECLINED reverses provisional from Staff.payroll_pending_cents"]
  - method: POST
    path: "/v1/officiating-assignments/{officiating_assignment_id}/settle"
    description: "Settle a WORKED assignment; computes final_pay_cents (FINAL: actual-or-scheduled duration with cert multiplier; FORFEITED: flat 1-hour base without multiplier)"
    roles: [LeagueCoordinator]
    code: 200
    input: []
    output: OfficiatingAssignment
    side_effects: ["WORKED -> PAID", "payroll_pending_cents -= provisional_pay_cents", "payroll_paid_cents += final_pay_cents"]
  # --- Equipment ---
  - method: POST
    path: "/v1/equipment-pools"
    description: "Create an equipment pool (item_type unique)"
    roles: [RecAdmin]
    code: 201
    input: [item_type, total_qty, daily_late_fee_cents, unit_replacement_cents]
    output: EquipmentPool
    side_effects: ["available_qty = total_qty"]
  - method: GET
    path: "/v1/equipment-pools/{equipment_pool_id}"
    description: "Get an equipment pool"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: []
    output: EquipmentPool
    side_effects: []
  - method: GET
    path: "/v1/equipment-pools"
    description: "List equipment pools (filtered)"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: ["item_type?", "limit?", "offset?"]
    output: "EquipmentPool[]"
    side_effects: []
  - method: POST
    path: "/v1/equipment-checkouts"
    description: "Member checks out equipment (waiver + membership + not-suspended + no outstanding fines + availability)"
    roles: [Member]
    code: 201
    input: [equipment_pool_id, member_id, quantity, due_at]
    output: EquipmentCheckout
    side_effects: ["status=OUT", "EquipmentPool.available_qty -= quantity"]
  - method: GET
    path: "/v1/equipment-checkouts/{equipment_checkout_id}"
    description: "Get a checkout"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: []
    output: EquipmentCheckout
    side_effects: []
  - method: GET
    path: "/v1/equipment-checkouts"
    description: "List checkouts (filtered)"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: ["member_id?", "equipment_pool_id?", "status?", "limit?", "offset?"]
    output: "EquipmentCheckout[]"
    side_effects: []
  - method: POST
    path: "/v1/equipment-checkouts/{equipment_checkout_id}/return"
    description: "Return a checkout; computes late fee from logical clock (ceil-days then multiply then cap) and posts it to the member's fines"
    roles: [FacilityManager]
    code: 200
    input: []
    output: EquipmentCheckout
    side_effects: ["status -> RETURNED", "EquipmentPool.available_qty += quantity", "Member.outstanding_fines_cents += late_fee_cents"]
  - method: POST
    path: "/v1/equipment-checkouts/{equipment_checkout_id}/report-lost"
    description: "Declare a checkout lost; charges full replacement; pool total_qty permanently decremented"
    roles: [FacilityManager]
    code: 200
    input: []
    output: EquipmentCheckout
    side_effects: ["status -> LOST", "Member.outstanding_fines_cents += quantity * unit_replacement_cents", "EquipmentPool.total_qty -= quantity"]
  # --- Lockers ---
  - method: POST
    path: "/v1/lockers"
    description: "Create a locker"
    roles: [RecAdmin]
    code: 201
    input: [locker_number, size]
    output: Locker
    side_effects: ["status=AVAILABLE"]
  - method: GET
    path: "/v1/lockers/{locker_id}"
    description: "Get a locker"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: []
    output: Locker
    side_effects: []
  - method: GET
    path: "/v1/lockers"
    description: "List lockers (filtered)"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: ["rented_by_member_id?", "status?", "size?", "limit?", "offset?"]
    output: "Locker[]"
    side_effects: []
  - method: POST
    path: "/v1/lockers/{locker_id}/rent"
    description: "Rent an AVAILABLE locker for a term (waiver + membership gates; NOT fine-gated); one active rental per member"
    roles: [Member]
    code: 200
    input: [member_id, term]
    output: Locker
    side_effects: ["status -> RENTED", "rental_fee_cents per calculations.locker_fee_cents"]
  - method: POST
    path: "/v1/lockers/{locker_id}/release"
    description: "Release a RENTED locker (renter self or FacilityManager)"
    roles: [Member, FacilityManager]
    code: 200
    input: []
    output: Locker
    side_effects: ["status -> AVAILABLE", "rental fields cleared"]
  # --- Fitness classes ---
  - method: POST
    path: "/v1/fitness-classes"
    description: "Create a one-off dated class; instructor role + certification gates; facility temporal gates; computes instructor_pay_estimate_cents"
    roles: [RecAdmin]
    code: 201
    input: [title, class_type, instructor_staff_id, facility_id, start_at, end_at, capacity]
    output: FitnessClass
    side_effects: ["status=SCHEDULED", "instructor_pay_estimate_cents computed (no bonus)"]
  - method: GET
    path: "/v1/fitness-classes/{fitness_class_id}"
    description: "Get a class"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: []
    output: FitnessClass
    side_effects: []
  - method: GET
    path: "/v1/fitness-classes"
    description: "List classes (filtered)"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: ["instructor_staff_id?", "facility_id?", "status?", "class_type?", "limit?", "offset?"]
    output: "FitnessClass[]"
    side_effects: []
  - method: POST
    path: "/v1/fitness-classes/{fitness_class_id}/registrations"
    description: "Member registers; REGISTERED if registered_count < capacity else WAITLISTED (full class is not an error)"
    roles: [Member]
    code: 201
    input: [member_id]
    output: ClassRegistration
    side_effects: ["registered_count or waitlist_count incremented"]
  - method: GET
    path: "/v1/class-registrations/{class_registration_id}"
    description: "Get a registration"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: []
    output: ClassRegistration
    side_effects: []
  - method: GET
    path: "/v1/class-registrations"
    description: "List registrations (filtered)"
    roles: [RecAdmin, LeagueCoordinator, FacilityManager, Member, Staff]
    code: 200
    input: ["fitness_class_id?", "member_id?", "status?", "limit?", "offset?"]
    output: "ClassRegistration[]"
    side_effects: []
  - method: POST
    path: "/v1/class-registrations/{class_registration_id}/cancel"
    description: "Cancel a REGISTERED|WAITLISTED registration; cancelling REGISTERED promotes the waitlist head"
    roles: [Member, RecAdmin]
    code: 200
    input: []
    output: ClassRegistration
    side_effects: ["-> CANCELLED", "on REGISTERED cancel: waitlist_promotion runs (seat handoff conserves registered_count)"]
  - method: POST
    path: "/v1/fitness-classes/{fitness_class_id}/complete"
    description: "Instructor (or RecAdmin) completes the class after end_at; marks attendance; computes instructor_pay_cents with attendance bonus; pays instructor rail"
    roles: [Staff, RecAdmin]
    code: 200
    input: ["no_show_registration_ids"]
    output: FitnessClass
    side_effects: ["REGISTERED -> ATTENDED | NO_SHOW (no_show_count += 1 per NO_SHOW)", "WAITLISTED -> CANCELLED", "instructor_pay_cents computed", "Staff.payroll_paid_cents += instructor_pay_cents"]
  # --- Test-driving clock ---
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601 UTC). Server startup default BEFORE any call is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time; all time-based rules (terms, waiver AY, lateness, report windows) evaluate against this logical clock."
    roles: [RecAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["re-evaluates lazy membership expiry on subsequent reads/checks"]

# =============================================================================
# §1.6 Error Code Catalog (48)
# =============================================================================
errors:
  # --- auth / request ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing/empty, or role not one of the five declared roles" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or entity-backed ownership check failed (non-self Member, non-captain roster/score action, non-assigned Staff)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path resource id or body FK reference does not exist (evaluated left-to-right)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing/invalid field, bad enum, range violation, malformed interval, home == away, purchase after term end, bad fine-payment amount, staff conditional-field violation" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic illegal transition/state precondition (wrong status for the requested operation, roster locked, assignment not respondable, game already terminal, etc.)" }
  # --- member eligibility ---
  - { id: ERR_MEMBER_SUSPENDED, http: 409, condition: "Member.status == SUSPENDED (injury hold) for an eligibility-gated operation" }
  - { id: ERR_MEMBERSHIP_INACTIVE, http: 409, condition: "No membership with (lazily evaluated) status ACTIVE for the member" }
  - { id: ERR_WAIVER_INVALID, http: 422, condition: "No waiver signed in the current academic year" }
  - { id: ERR_OUTSTANDING_FINES, http: 402, condition: "outstanding_fines_cents > 0 blocks equipment checkout (evaluated last)" }
  # --- league / team / roster ---
  - { id: ERR_LEAGUE_NOT_ACCEPTING_REGISTRATIONS, http: 409, condition: "Team create / roster add / free-agent register while league status != REGISTRATION_OPEN" }
  - { id: ERR_TOO_FEW_TEAMS, http: 409, condition: "close-registration or start-season with fewer than min_teams non-WITHDRAWN teams" }
  - { id: ERR_LEAGUE_NOT_READY_FOR_SEASON, http: 409, condition: "open-registration with empty divisions, or start-season with an unplaced team or a team below roster_min" }
  - { id: ERR_LEAGUE_FULL, http: 409, condition: "Team create would exceed league team_capacity" }
  - { id: ERR_DIVISION_NOT_FOUND, http: 404, condition: "division_name not present in League.divisions" }
  - { id: ERR_DIVISION_FULL, http: 409, condition: "Division already holds division.capacity teams" }
  - { id: ERR_DIVISION_SKILL_MISMATCH, http: 422, condition: "team.skill_rating outside [skill_min, skill_max] inclusive bounds (checked BEFORE division capacity)" }
  - { id: ERR_TEAM_ALREADY_IN_LEAGUE, http: 409, condition: "Captain already captains a non-WITHDRAWN team in this league" }
  - { id: ERR_MEMBER_ALREADY_IN_LEAGUE, http: 409, condition: "Member already holds an ACTIVE RosterEntry on a team of this league" }
  - { id: ERR_ROSTER_FULL, http: 422, condition: "Roster add / free-agent placement would exceed league.roster_max" }
  - { id: ERR_CAPTAIN_REMOVAL_FORBIDDEN, http: 422, condition: "Attempt to remove the roster entry whose member_id == team.captain_member_id" }
  - { id: ERR_ALREADY_IN_POOL, http: 409, condition: "Member already has a POOLED free-agent entry in this league" }
  - { id: ERR_NO_TEAM_AVAILABLE, http: 409, condition: "Free-agent placement selector found an empty candidate set (strict division preference honored)" }
  # --- scheduling / temporal ---
  - { id: ERR_GAME_IN_PAST, http: 422, condition: "start_at < logical now at game create/reschedule" }
  - { id: ERR_FACILITY_OUTSIDE_HOURS, http: 422, condition: "Booking does not fit within a single operating window of its weekday (start >= open_minute, end <= close_minute)" }
  - { id: ERR_FACILITY_CLOSED, http: 409, condition: "Booking overlaps a closure half-open interval [start_at, end_at)" }
  - { id: ERR_FACILITY_DOUBLE_BOOKED, http: 409, condition: "Booking half-open-overlaps another SCHEDULED game or SCHEDULED class at the facility (adjacency end == start allowed); checked BEFORE team conflicts" }
  - { id: ERR_TEAM_TIME_CONFLICT, http: 409, condition: "Home or away team already has a SCHEDULED game half-open-overlapping the candidate (any facility)" }
  - { id: ERR_TEAMS_NOT_IN_SAME_DIVISION, http: 422, condition: "Regular-season game between teams with different (or null) division_name" }
  # --- game reporting / playoffs ---
  - { id: ERR_GAME_NOT_REPORTABLE, http: 409, condition: "Score report or manual forfeit before game start_at, or game not in a reportable status" }
  - { id: ERR_DUPLICATE_SCORE_REPORT, http: 409, condition: "Second score report submitted for the same side that already reported" }
  - { id: ERR_TIE_NOT_ALLOWED, http: 422, condition: "Matching/finalized equal scores on a playoff game (bracket_round != REGULAR)" }
  - { id: ERR_FORFEITING_TEAM_INVALID, http: 422, condition: "forfeiting_team_id is neither home_team_id nor away_team_id" }
  - { id: ERR_PLAYOFFS_NOT_READY, http: 409, condition: "start-playoffs while any league game is SCHEDULED | RESCHEDULE_REQUIRED | PLAYED_PENDING_CONFIRM | DISPUTED" }
  - { id: ERR_NO_ELIGIBLE_TEAMS, http: 409, condition: "start-playoffs with fewer than 2 eligible teams league-wide" }
  # --- officials / staff ---
  - { id: ERR_STAFF_NOT_OFFICIAL, http: 422, condition: "Officiating assignment targeted at a Staff with staff_role != OFFICIAL" }
  - { id: ERR_STAFF_NOT_INSTRUCTOR, http: 422, condition: "Fitness-class instructor_staff_id references a Staff with staff_role != INSTRUCTOR" }
  - { id: ERR_OFFICIAL_CERT_TOO_LOW, http: 422, condition: "certification_level < 2 on a SEMIFINAL|CHAMPIONSHIP assignment (REGULAR requires >= 1)" }
  - { id: ERR_OFFICIAL_DOUBLE_BOOKED, http: 409, condition: "Candidate game violates the official's 30-minute travel buffer against an ASSIGNED|ACCEPTED|WORKED assignment's game" }
  - { id: ERR_ASSIGNMENT_LIMIT_REACHED, http: 422, condition: "Game already has 2 non-terminal (ASSIGNED|ACCEPTED|WORKED) officiating assignments" }
  - { id: ERR_INSTRUCTOR_NOT_CERTIFIED, http: 422, condition: "class_type not in instructor's certified_class_types" }
  # --- equipment / lockers / classes ---
  - { id: ERR_EQUIPMENT_INSUFFICIENT, http: 409, condition: "quantity > EquipmentPool.available_qty" }
  - { id: ERR_LOCKER_UNAVAILABLE, http: 409, condition: "Rent on a locker whose status != AVAILABLE" }
  - { id: ERR_RENTAL_EXISTS, http: 409, condition: "Member already has a Locker with status RENTED" }
  - { id: ERR_CLASS_ALREADY_REGISTERED, http: 409, condition: "Member already holds a REGISTERED or WAITLISTED registration for this class" }
  - { id: ERR_CLASS_TIME_CONFLICT, http: 409, condition: "Member holds a REGISTERED registration in another SCHEDULED class whose half-open interval overlaps the candidate" }
  - { id: ERR_INJURY_GAME_MISMATCH, http: 422, condition: "game_id present but the member holds no ACTIVE RosterEntry on either team of that game" }

# =============================================================================
# §1.7 RBAC Matrix (peer roles)
# =============================================================================
roles:
  - name: RecAdmin
    description: "Campus recreation department administrator; owns configuration entities (members, leagues, facilities, staff, equipment pools, lockers, classes) and authoritative dispute resolution"
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/members; POST /v1/leagues; POST /v1/facilities; POST /v1/staff; POST /v1/equipment-pools; POST /v1/lockers; POST /v1/fitness-classes"
      - "POST /v1/games/{id}/finalize — authoritative dispute/score resolution"
      - "POST /v1/injury-reports/{id}/clear — medical clearance"
      - "POST /v1/_clock/set_current_utc — logical clock control"
    shared_operations:
      - "All GET endpoints"
      - "POST /v1/memberships/{id}/cancel; POST /v1/class-registrations/{id}/cancel; POST /v1/fitness-classes/{id}/complete"
  - name: LeagueCoordinator
    description: "Intramural league operations: league lifecycle, team registration/placement, scheduling, officials, forfeits, playoffs, pay settlement"
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/leagues/{id}/open-registration | close-registration | start-season | start-playoffs | cancel"
      - "POST /v1/teams; POST /v1/teams/{id}/place-division; POST /v1/teams/{id}/reinstate"
      - "POST /v1/leagues/{id}/place-free-agent"
      - "POST /v1/leagues/{id}/games; POST /v1/games/{id}/reschedule; POST /v1/games/{id}/declare-forfeit"
      - "POST /v1/games/{id}/officiating-assignments; POST /v1/officiating-assignments/{id}/settle"
    shared_operations:
      - "All GET endpoints"
      - "POST /v1/teams/{id}/withdraw; POST /v1/roster-entries/{id}/remove"
  - name: FacilityManager
    description: "Facility and equipment operations: closures, equipment returns/loss, locker release, staff injury reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/facilities/{id}/closures"
      - "POST /v1/equipment-checkouts/{id}/return; POST /v1/equipment-checkouts/{id}/report-lost"
    shared_operations:
      - "All GET endpoints"
      - "POST /v1/injury-reports; POST /v1/lockers/{id}/release"
  - name: Member
    description: "Student/faculty/community participant; self-service eligibility artifacts and registrations; captains act on their own teams"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /v1/members/{id}/waiver-sign; POST /v1/members/{id}/memberships; POST /v1/members/{id}/fine-payments (all self only)"
      - "POST /v1/teams/{id}/roster-entries (captain of the team only)"
      - "POST /v1/leagues/{id}/free-agents (self)"
      - "POST /v1/games/{id}/score-reports (captain of the reported side only)"
      - "POST /v1/fitness-classes/{id}/registrations (self); POST /v1/equipment-checkouts (self); POST /v1/lockers/{id}/rent (self)"
    shared_operations:
      - "All GET endpoints"
      - "POST /v1/memberships/{id}/cancel; POST /v1/teams/{id}/withdraw (captain); POST /v1/roster-entries/{id}/remove (captain); POST /v1/class-registrations/{id}/cancel (self); POST /v1/injury-reports (self); POST /v1/lockers/{id}/release (current renter)"
  - name: Staff
    description: "Officials and fitness instructors; respond to officiating assignments and complete their own classes"
    identity: "entity_backed:Staff"
    exclusive_operations:
      - "POST /v1/officiating-assignments/{id}/respond (the assigned official only)"
    shared_operations:
      - "All GET endpoints"
      - "POST /v1/fitness-classes/{id}/complete (the class instructor only)"
