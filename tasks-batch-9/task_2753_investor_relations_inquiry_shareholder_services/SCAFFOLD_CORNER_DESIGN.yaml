        distinguishing_aspect: "An ESCALATED inquiry leaves ESCALATED only via a DisclosureOfficer supplying target_queue: the same call from an IRAnalyst without target_queue is refused with ERR_QUEUE_OVERRIDE_FORBIDDEN, and the officer's IR_DESK override resets the SLA to 72 hours."
