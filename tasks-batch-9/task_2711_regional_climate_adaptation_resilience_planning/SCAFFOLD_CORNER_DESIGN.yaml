              as: RegionalAdministrator
              captures: { a_cool_id: $.data.id }
            - call: "POST /resilience/mutual-aid-pacts"
              payload: { host_jurisdiction_id: "${j_harbor_id}", resource_class: "COOLING_UNITS", pledged_units: 10, window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", max_concurrent_commitments: 3 }
              as: JurisdictionDelegate
              as_user_id: "${j_harbor_id}"
              captures: { pact_id: $.data.id, pact_v1: $.data.version }
            - call: "POST /resilience/mutual-aid-pacts/${pact_id}/commitments"
              payload: { requesting_jurisdiction_id: "${j_ridge_id}", asset_id: "${a_cool_id}", committed_units: 6, window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-20T00:00:00Z", expected_mutual_aid_pact_version: "${pact_v1}" }
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
              captures: { commit1_id: $.data.id }
          trigger:
            - call: "POST /resilience/mutual-aid-pacts/${pact_id}/commitments"
              payload: { requesting_jurisdiction_id: "${j_ridge_id}", asset_id: "${a_cool_id}", committed_units: 8, window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-20T00:00:00Z", expected_mutual_aid_pact_version: "${pact_v1}" }
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
            - call: "GET /resilience/mutual-aid-pacts/${pact_id}"
              payload: {}
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
              captures: { pact_v2: $.data.version }
            - call: "POST /resilience/mutual-aid-pacts/${pact_id}/commitments"
              payload: { requesting_jurisdiction_id: "${j_ridge_id}", asset_id: "${a_cool_id}", committed_units: 8, window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-20T00:00:00Z", expected_mutual_aid_pact_version: "${pact_v2}" }
              as: JurisdictionDelegate
