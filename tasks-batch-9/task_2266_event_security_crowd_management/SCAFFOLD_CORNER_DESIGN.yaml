        tier'
      - PostAssignment.${a1} has pay_basis == EMPLOYEE_OT and night_differential_applies is false (window_start hour 12 is neither >= 22 nor < 6), so no NIGHT_DIFFERENTIAL_CENTS_PER_HOUR is added
      - PostAssignment.${a2} (15:00 -> 22:30) has scheduled_hours == 7.50, line_cost_cents == 16500 (round(2200 * 7.50), no overtime term at all) and pay_basis == EMPLOYEE_STRAIGHT
