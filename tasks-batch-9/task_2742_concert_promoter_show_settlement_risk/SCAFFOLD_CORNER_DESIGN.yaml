              as: TalentBuyer
              captures: { vt_ar_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${vt_mk_id}", name: "Walk Hall", gross_capacity: 1000, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { vt_vn_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${vt_ar_id}", venue_id: "${vt_vn_id}", event_at: "2026-09-01T02:00:00.000Z", load_in_at: "2026-08-31T14:00:00.000Z", load_out_at: "2026-09-01T08:00:00.000Z", announce_at: "2026-08-05T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 150000 }
              as: TalentBuyer
              captures: { vt_sh_id: $.data.id, vt_sh_v1: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${vt_sh_id}", expected_show_version: "${vt_sh_v1}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 500000, deposit_cents: 100000, expense_cap_cents: 1000000 }
              as: TalentBuyer
              captures: { vt_of_id: $.data.id }
            - call: "POST /ticket-tiers"
              payload: { show_id: "${vt_sh_id}", tier_name: "GA", price_cents: 5000, allocation_qty: 500 }
