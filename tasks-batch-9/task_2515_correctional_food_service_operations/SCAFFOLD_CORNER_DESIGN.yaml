            - "${fresh_cv} == ${stale_cv} + 1 while ${mid_status} == ACTIVE and ${mid_missed} == 1 - status is unchanged, only the ledger moved"
            - "${stale_error} == ERR_STALE_CONTRACT_VERSION with HTTP 412, and MealServiceRecord.${ln_record_id}.status is still OPEN"
            - "The retry with ${fresh_cv} returns HTTP 200 with ${ln_status} == CLOSED and ${ln_missed} == 1"
            - "${final_trays} == 26 and ${final_missed} == 2 - each close posted exactly once, no double count and no lost delta"

      - name: corner_contraband_threshold_flips_posture_at_two
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.facility_kitchen_posture
          - state_machines[ContrabandIncident]
          - endpoints[POST /cfs/contraband-incidents]
        distinguishing_aspect: "The posture is a pure count comparison against CONTRABAND_RESTRICT_THRESHOLD 2: one open incident leaves the kitchen OPEN, the second flips it to RESTRICTED in the same request, and dispositioning either one resets it - the trigger is the live open count, not a historical tally."
        test_recipe:
          setup:
            - "Facility FAC-C04 at posture OPEN with no incidents and one unassigned worker."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-C04", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-C04", name: "North Unit Kitchen", sharps_authorized_count: 12 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { facility_id: $.data.id, start_posture: $.data.kitchen_posture }
            - call: "POST /cfs/inmates"
              payload: { facility_id: "${facility_id}", booking_number: "BK-C04", housing_unit: "GENERAL" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { inmate_id: $.data.id }
            - call: "POST /cfs/inmate-workers"
              payload: { inmate_id: "${inmate_id}", facility_id: "${facility_id}", medical_clearance_expires_at: "2026-12-31T00:00:00Z" }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { worker_id: $.data.id }
          trigger:
            - call: "POST /cfs/contraband-incidents"
              payload: { facility_id: "${facility_id}", item_class: "YEAST_ALCOHOL", severity: "MINOR", narrative: "Sugar packets hoarded in a mop sink." }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { first_incident_id: $.data.id }
            - call: "GET /cfs/facilities/${facility_id}"
              payload: {}
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { posture_at_one: $.data.kitchen_posture, count_at_one: $.data.open_contraband_incident_count }
            - call: "POST /cfs/contraband-incidents"
              payload: { facility_id: "${facility_id}", item_class: "SHARP", severity: "MINOR", narrative: "Sharpened plastic shard on the tray line." }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { second_incident_id: $.data.id }
            - call: "GET /cfs/facilities/${facility_id}"
              payload: {}
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { posture_at_two: $.data.kitchen_posture, count_at_two: $.data.open_contraband_incident_count }
            - call: "POST /cfs/inmate-workers/${worker_id}/assign"
              payload: { work_area: "SERVING_LINE" }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { blocked_error: $.data.error_id }
            - call: "POST /cfs/contraband-incidents/${second_incident_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: CorrectionalOfficer
              as_user_id: "co-002"
              captures: { cleared_status: $.data.status }
            - call: "GET /cfs/facilities/${facility_id}"
              payload: {}
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { posture_after_reset: $.data.kitchen_posture, count_after_reset: $.data.open_contraband_incident_count }
          assert:
            - "${start_posture} == OPEN; ${posture_at_one} == OPEN with ${count_at_one} == 1 - at threshold minus one nothing changes"
            - "${posture_at_two} == RESTRICTED with ${count_at_two} == 2 - the comparison is >= 2, so the second incident flips it"
            - "${blocked_error} == ERR_KITCHEN_POSTURE_BLOCKED with HTTP 409 - the derived posture gates the assignment while RESTRICTED"
            - "${cleared_status} == CLEARED and the worker's clearance_status is untouched at CLEARED (no strike: only SANCTIONED cascades)"
            - "${posture_after_reset} == OPEN with ${count_after_reset} == 1 - the reset is driven by the live open count, and the retry of the assignment now succeeds"

      - name: corner_special_diet_census_tracks_every_source_change
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Facility.fields.active_special_diet_count
          - calculations.special_diet_census_invariant
          - state_machines[DietOrder]
        distinguishing_aspect: "The census counts only ACTIVE orders, so a single order drives it up on verification, back down on suspension and down again on revocation - and the count never double-counts the same order across a suspend / reverify / verify round trip."
        test_recipe:
          setup:
            - "Facility FAC-C05 with one inmate and one PENDING_VERIFICATION MEDICAL diet order."
