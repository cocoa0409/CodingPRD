          - entities.ProductComponent.fields.coverage_pct
        distinguishing_aspect: "A single fully covering MANUAL MAGNIFICATION run yields exactly 100 * 0.20 = 20.00 because the screen-reader and keyboard profile scores stay 0, so the component remains IN_TESTING."
