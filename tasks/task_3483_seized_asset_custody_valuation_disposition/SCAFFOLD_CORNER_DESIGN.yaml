# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3483_seized_asset_custody_valuation_disposition
#
# Breadth probe: every testable claim of SCAFFOLD.yaml §1.1-§1.7 not already
# exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml. Corners already covered by a
# §1.8 instance appear as excluded_because stubs with no test_recipe.
# Logical clock default is 2026-09-01T00:00:00Z; recipes that need a later
# "now" set the clock first via POST /_clock/set_current_utc.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: case_create_returns_declared_fields_and_zeroed_pool
        claim_type: Creation
        grounds:
          - entities.SeizureCase
          - endpoints.POST_/custody/cases
        distinguishing_aspect: "A case created with the four required inputs returns 201 with status OPEN, version 1, all eight proceeds accumulators at 0, forfeited_at null, and created_at == 2026-09-01T00:00:00Z — the pinned server-default logical clock, not wall-clock time."
        test_recipe:
          setup:
            - "Empty database; logical clock untouched at its 2026-09-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-1001", judicial_district: "S.D.N.Y.", forfeiture_type: "CIVIL", lead_agency_code: "DEA" }
              as: CaseAgent
              captures: { kc: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "SeizureCase.${kc}.status == OPEN and version == 1"
            - "SeizureCase.${kc}.created_at == 2026-09-01T00:00:00Z (pinned server default clock)"
            - "gross_proceeds_cents == auction_fees_cents == lien_payments_cents == cost_reimbursements_cents == 0"
            - "sharing_pool_gross_basis_cents == sharing_pool_net_basis_cents == equitable_shares_paid_cents == available_proceeds_cents == 0"
            - "SeizureCase.${kc}.forfeited_at is null"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: asset_get_round_trips_stored_fields
        claim_type: Retrieval
        grounds:
          - entities.Asset
          - endpoints.GET_/custody/assets/{id}
        distinguishing_aspect: "Every input field round-trips through GET /custody/assets/{id} exactly as posted, and the case sub-resource GET /custody/cases/{id}/assets lists exactly the one asset created under it."
        test_recipe:
          setup:
            - "One case; one VEHICLE asset under it."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-1002", judicial_district: "N.D. Cal.", forfeiture_type: "CRIMINAL", lead_agency_code: "FBI" }
              as: CaseAgent
              captures: { kc2: $.data.id }
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "${kc2}", asset_type: "VEHICLE", description: "armored truck", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "GOOD" }
              as: AssetCustodian
              captures: { ka2: $.data.id }
          trigger:
            - call: "GET /custody/assets/${ka2}"
              payload: {}
              as: CourtOfficial
              as_user_id: "co-reyes"
            - call: "GET /custody/cases/${kc2}/assets"
              payload: {}
              as: CourtOfficial
              as_user_id: "co-reyes"
          assert:
            - "Asset.${ka2}.asset_type == VEHICLE and description == \"armored truck\""
            - "Asset.${ka2}.seized_on == 2026-09-01T00:00:00Z and seizure_condition_grade == GOOD"
            - "Asset.${ka2}.current_condition_grade == GOOD (initialized from seizure_condition_grade)"
            - "Asset.${ka2}.seizure_case_id == ${kc2}"
            - "GET /custody/cases/${kc2}/assets returns response_type array with exactly 1 row (the asset) and total_count == 1"

      - name: custody_transfers_subresource_pagination
        claim_type: Listing
        grounds:
          - endpoints.GET_/custody/assets/{id}/custody-transfers
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three contiguous transfers scheduled, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, offset=2 returns the last row with has_more false, and the parameterless call applies the envelope defaults (limit 10, offset 0)."
        test_recipe:
          setup:
            - "One case; one asset; three contiguously-chained SCHEDULED transfers [09-01T08,09-02T08), [09-02T08,09-03T08), [09-03T08,09-04T08)."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-1003", judicial_district: "E.D. Va.", forfeiture_type: "CIVIL", lead_agency_code: "ATF" }
              as: CaseAgent
              captures: { kc3: $.data.id }
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "${kc3}", asset_type: "VESSEL", description: "fishing boat", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "FAIR" }
              as: AssetCustodian
              captures: { ka3: $.data.id }
            - call: "POST /custody/custody-transfers"
              payload: { asset_id: "${ka3}", from_location_ref: "dock-1", to_location_ref: "warehouse-1", to_location_kind: "STORAGE", window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-02T08:00:00Z" }
              as: AssetCustodian
            - call: "POST /custody/custody-transfers"
              payload: { asset_id: "${ka3}", from_location_ref: "warehouse-1", to_location_ref: "shop-1", to_location_kind: "MAINTENANCE_SHOP", window_start: "2026-09-02T08:00:00Z", window_end: "2026-09-03T08:00:00Z" }
              as: AssetCustodian
            - call: "POST /custody/custody-transfers"
              payload: { asset_id: "${ka3}", from_location_ref: "shop-1", to_location_ref: "warehouse-2", to_location_kind: "STORAGE", window_start: "2026-09-03T08:00:00Z", window_end: "2026-09-04T08:00:00Z" }
              as: AssetCustodian
          trigger:
            - call: "GET /custody/assets/${ka3}/custody-transfers"
              payload: { limit: 2, offset: 0 }
              as: AssetCustodian
              as_user_id: "ac-dana"
          assert:
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET with limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET with no query parameters returns all 3 rows (limit defaults to 10, offset to 0)"

      - name: asset_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/custody/assets/{id}
          - errors.ERR_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated UUID on the asset path yields 404 ERR_NOT_FOUND with the error envelope shape — not a 400 and not an empty 200."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /custody/assets/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AssetManager
              as_user_id: "am-priya"
              captures: { nf_err: $.data.error_id }
          assert:
            - "the response status is 404 and nf_err == ERR_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: asset_create_missing_asset_type_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Asset.fields.asset_type
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "asset_type is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST from the shape check (priority 3), which fires before any existence or state check."
        test_recipe:
          setup:
            - "One case."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-1005", judicial_district: "D. Del.", forfeiture_type: "CIVIL", lead_agency_code: "IRS" }
              as: CaseAgent
              captures: { kc5: $.data.id }
          trigger:
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "${kc5}", description: "no type given", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "GOOD" }
              as: AssetCustodian
              captures: { rf_err: $.data.error_id }
          assert:
            - "the response status is 400 and rf_err == ERR_INVALID_REQUEST"
            - "GET /custody/cases/${kc5}/assets returns 0 rows"

      - name: expense_entry_omitted_incurred_on_defaults_to_clock
        claim_type: Defaults
        grounds:
          - entities.ExpenseEntry.fields.incurred_on
          - endpoints.POST_/custody/expense-entries
        distinguishing_aspect: "incurred_on declares a default of the current logical clock; omitting it stamps 2026-09-01T00:00:00Z (the pinned default clock) rather than null or wall-clock time."
        test_recipe:
          setup:
            - "One case; one asset; clock untouched at the default."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-1006", judicial_district: "D. Or.", forfeiture_type: "CIVIL", lead_agency_code: "DEA" }
              as: CaseAgent
              captures: { kc6: $.data.id }
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "${kc6}", asset_type: "VEHICLE", description: "moped", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "FAIR" }
              as: AssetCustodian
              captures: { ka6: $.data.id }
          trigger:
            - call: "POST /custody/expense-entries"
              payload: { asset_id: "${ka6}", entry_kind: "COST", expense_type: "STORAGE", amount_cents: 5000 }
              as: AssetCustodian
              captures: { ke6: $.data.id }
          assert:
            - "the response status is 201"
            - "ExpenseEntry.${ke6}.incurred_on == 2026-09-01T00:00:00Z (defaulted to the logical clock)"
            - "ExpenseEntry.${ke6}.source == MANUAL"
            - "Asset.${ka6}.accumulated_net_holding_cost_cents == 5000"

      - name: asset_create_initializes_computed_and_state_fields
        claim_type: Computed Fields
        grounds:
          - entities.Asset.fields.appraised_value_cents
          - entities.Asset.fields.accumulated_net_holding_cost_cents
          - state_machines.Asset
        distinguishing_aspect: "A freshly-intaken asset carries the machine's initial pair (custody INTAKE, legal SEIZED), retention_decision PENDING, version 1, accumulated cost 0, and null appraised value / retention variants / return-dispute fields — none of them client-suppliable."
        test_recipe:
          setup:
            - "One case."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-1007", judicial_district: "D. Ariz.", forfeiture_type: "ADMINISTRATIVE", lead_agency_code: "CBP" }
              as: CaseAgent
              captures: { kc7: $.data.id }
          trigger:
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "${kc7}", asset_type: "REAL_PROPERTY", description: "duplex", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "GOOD" }
              as: AssetCustodian
              captures: { ka7: $.data.id }
          assert:
            - "Asset.${ka7}.custody_state == INTAKE and legal_state == SEIZED (initial state of both dimensions)"
            - "Asset.${ka7}.retention_decision == PENDING and version == 1"
            - "Asset.${ka7}.appraised_value_cents is null and appraised_at is null"
            - "Asset.${ka7}.accumulated_net_holding_cost_cents == 0"
            - "Asset.${ka7}.provisional_net_retention_value_cents is null and final_net_retention_value_cents is null"
            - "returned_at, computed_depreciation_cents, dispute_claimed_depreciation_cents, final_depreciation_cents are all null"

      - name: asset_system_fields_server_stamped
        claim_type: System Fields
        grounds:
          - entities.Asset
          - response_envelope
        distinguishing_aspect: "id, created_at, updated_at and version are server-stamped: id is a type-prefix-free UUID, created_at and updated_at both equal the logical clock at creation (2026-09-01T00:00:00Z by default), and version starts at 1."
        test_recipe:
          setup:
            - "One case; clock untouched at the default."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-1008", judicial_district: "D. Colo.", forfeiture_type: "CIVIL", lead_agency_code: "USMS" }
              as: CaseAgent
              captures: { kc8: $.data.id }
          trigger:
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "${kc8}", asset_type: "AIRCRAFT", description: "single-engine plane", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "EXCELLENT" }
              as: AssetCustodian
              captures: { ka8: $.data.id }
          assert:
            - "Asset.${ka8}.id is a non-null UUID string with no type prefix"
            - "Asset.${ka8}.created_at == 2026-09-01T00:00:00Z and updated_at == 2026-09-01T00:00:00Z"
            - "Asset.${ka8}.version == 1"

      - name: asset_type_invalid_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Asset.fields.asset_type
          - validations[priority=3]
        distinguishing_aspect: "asset_type is a closed enum; the near-miss value REAL_ESTATE (not a member — the member is REAL_PROPERTY) is rejected 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One case."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-1009", judicial_district: "E.D.N.Y.", forfeiture_type: "CIVIL", lead_agency_code: "HSI" }
              as: CaseAgent
              captures: { kc9: $.data.id }
          trigger:
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "${kc9}", asset_type: "REAL_ESTATE", description: "bad enum", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "GOOD" }
              as: AssetCustodian
              captures: { enum_err: $.data.error_id }
          assert:
            - "the response status is 400 and enum_err == ERR_INVALID_REQUEST"

      - name: asset_create_unknown_case_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Asset.fields.seizure_case_id
          - validations[priority=4]
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A well-formed asset body whose seizure_case_id FK does not resolve is a 404 ERR_NOT_FOUND — the shape check (p3) passes, the existence check (p4) fires; nothing is created."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "00000000-0000-4000-8000-000000000000", asset_type: "VEHICLE", description: "orphan", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "GOOD" }
              as: AssetCustodian
              captures: { fk_err: $.data.error_id }
          assert:
            - "the response status is 404 and fk_err == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: valuation_accept_side_effects_update_asset
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Valuation.SUBMITTED_to_ACCEPTED
          - calculations.condition_adjusted_valuation
          - calculations.retention_value_estimate
        distinguishing_aspect: "Accepting a valuation (raw 1000000, GOOD factor 9000 bps -> 900000) writes appraised_value_cents and appraised_at, advances legal VALUATION_PENDING -> VALUED, and recomputes both retention variants; a subsequent 10000 COST entry shifts provisional (740000) and final (890000) independently."
        test_recipe:
          setup:
            - "One case; one VEHICLE asset; valuation raw 1000000 GOOD submitted."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-1010", judicial_district: "W.D. Tex.", forfeiture_type: "CIVIL", lead_agency_code: "DEA" }
              as: CaseAgent
              captures: { sc: $.data.id }
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "${sc}", asset_type: "VEHICLE", description: "motorcycle", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "GOOD" }
              as: AssetCustodian
              captures: { sa10: $.data.id, sa10_v: $.data.version }
            - call: "POST /custody/valuations"
              payload: { asset_id: "${sa10}", method: "CERTIFIED_APPRAISAL", raw_value_cents: 1000000, assessed_condition_grade: "GOOD", expected_asset_version: "${sa10_v}" }
              as: Appraiser
              captures: { sv10: $.data.id }
          trigger:
            - call: "GET /custody/assets/${sa10}"
              payload: {}
              as: AssetManager
              as_user_id: "am-priya"
            - call: "POST /custody/valuations/${sv10}/adjudicate"
              payload: { outcome: "ACCEPT" }
              as: CourtOfficial
              as_user_id: "co-reyes"
            - call: "POST /custody/expense-entries"
              payload: { asset_id: "${sa10}", entry_kind: "COST", expense_type: "STORAGE", amount_cents: 10000, incurred_on: "2026-09-02T00:00:00Z" }
              as: AssetCustodian
            - call: "GET /custody/assets/${sa10}"
              payload: {}
              as: AssetManager
              as_user_id: "am-priya"
          assert:
            - "before adjudication: legal_state == VALUATION_PENDING, appraised_value_cents is null, final_net_retention_value_cents is null, provisional == 750000 (900000 - 6 x 25000, SUBMITTED base)"
            - "after ACCEPT: Asset.${sa10}.appraised_value_cents == 900000 and legal_state == VALUED and appraised_at == 2026-09-01T00:00:00Z"
            - "after the 10000 COST entry: provisional_net_retention_value_cents == 740000 (900000 - 10000 - 150000) and final_net_retention_value_cents == 890000 (900000 - 10000)"

      - name: dismiss_forfeited_case_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.SeizureCase
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "FORFEITED is terminal for the dismiss edge: the only two from-states are OPEN and FORFEITURE_PENDING, so dismissing a forfeited case is a 409 ERR_INVALID_STATE and the case stays FORFEITED."
        test_recipe:
          setup:
            - "One case filed then forfeited."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-1011", judicial_district: "D. Nev.", forfeiture_type: "CRIMINAL", lead_agency_code: "FBI" }
              as: CaseAgent
              captures: { kc11: $.data.id }
            - call: "POST /custody/cases/${kc11}/file-forfeiture"
              payload: {}
              as: CaseAgent
            - call: "POST /custody/cases/${kc11}/forfeit"
              payload: {}
              as: CourtOfficial
              as_user_id: "co-reyes"
          trigger:
            - call: "POST /custody/cases/${kc11}/dismiss"
              payload: {}
              as: CourtOfficial
              as_user_id: "co-reyes"
              captures: { dis_err: $.data.error_id }
          assert:
            - "the response status is 409 and dis_err == ERR_INVALID_STATE"
            - "GET /custody/cases/${kc11} still shows status FORFEITED with forfeited_at == 2026-09-01T00:00:00Z"

      - name: retained_asset_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Asset
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "RETAINED is terminal on the legal dimension: a second decide-retention and a fresh valuation both fail 409 ERR_INVALID_STATE, even though the asset's custody dimension remains open."
        test_recipe:
          setup:
            - "One case; VEHICLE asset appraised 2000000 (raw 2000000 EXCELLENT); no costs; RETAIN decision accepted (final 2000000 >= 500000 floor; burden 75000 < 600000)."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-1012", judicial_district: "D. Minn.", forfeiture_type: "CIVIL", lead_agency_code: "USMS" }
              as: CaseAgent
              captures: { kc12: $.data.id }
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "${kc12}", asset_type: "VEHICLE", description: "patrol car", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "EXCELLENT" }
              as: AssetCustodian
              captures: { ra12: $.data.id, ra12_v: $.data.version }
            - call: "POST /custody/valuations"
              payload: { asset_id: "${ra12}", method: "BLUE_BOOK", raw_value_cents: 2000000, assessed_condition_grade: "EXCELLENT", expected_asset_version: "${ra12_v}" }
              as: Appraiser
              captures: { rv12: $.data.id }
            - call: "POST /custody/valuations/${rv12}/adjudicate"
              payload: { outcome: "ACCEPT" }
              as: CourtOfficial
              as_user_id: "co-reyes"
            - call: "POST /custody/assets/${ra12}/decide-retention"
              payload: { decision: "RETAIN" }
              as: AssetManager
              as_user_id: "am-priya"
            - call: "GET /custody/assets/${ra12}"
              payload: {}
              as: AssetManager
              as_user_id: "am-priya"
              captures: { ra12_v2: $.data.version }
          trigger:
            - call: "POST /custody/assets/${ra12}/decide-retention"
              payload: { decision: "SELL" }
              as: AssetManager
              as_user_id: "am-priya"
              captures: { lock_err: $.data.error_id }
            - call: "POST /custody/valuations"
              payload: { asset_id: "${ra12}", method: "BLUE_BOOK", raw_value_cents: 2100000, assessed_condition_grade: "EXCELLENT", expected_asset_version: "${ra12_v2}" }
              as: Appraiser
              captures: { lock_err2: $.data.error_id }
          assert:
            - "the RETAIN decision succeeded: legal_state == RETAINED and retention_decision == RETAIN"
            - "second decide-retention: 409 lock_err == ERR_INVALID_STATE"
            - "fresh valuation on a RETAINED asset: 409 lock_err2 == ERR_INVALID_STATE (creation gate admits only SEIZED|VALUATION_PENDING|VALUED|DISPOSITION_REVIEW)"

      - name: valuation_double_adjudication_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Valuation
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Adjudicate is not replay-safe: after ACCEPT the valuation is terminal, so a second adjudicate (any outcome) is 409 ERR_INVALID_STATE and the asset's appraised value is unchanged."
        test_recipe:
          setup:
            - "One case; one asset; valuation raw 1000000 GOOD submitted and accepted."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-1013", judicial_district: "D. Idaho", forfeiture_type: "CIVIL", lead_agency_code: "ATF" }
              as: CaseAgent
              captures: { kc13: $.data.id }
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "${kc13}", asset_type: "VEHICLE", description: "scooter", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "GOOD" }
              as: AssetCustodian
              captures: { da13: $.data.id, da13_v: $.data.version }
            - call: "POST /custody/valuations"
              payload: { asset_id: "${da13}", method: "BLUE_BOOK", raw_value_cents: 1000000, assessed_condition_grade: "GOOD", expected_asset_version: "${da13_v}" }
              as: Appraiser
              captures: { dv13: $.data.id }
            - call: "POST /custody/valuations/${dv13}/adjudicate"
              payload: { outcome: "ACCEPT" }
              as: CourtOfficial
              as_user_id: "co-reyes"
          trigger:
            - call: "POST /custody/valuations/${dv13}/adjudicate"
              payload: { outcome: "REJECT" }
              as: CourtOfficial
              as_user_id: "co-reyes"
              captures: { dup_err: $.data.error_id }
          assert:
            - "the response status is 409 and dup_err == ERR_INVALID_STATE"
            - "Valuation.${dv13}.status remains ACCEPTED"
            - "Asset.${da13}.appraised_value_cents remains 900000"

      - name: complete_return_requires_physical_handover
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Asset
