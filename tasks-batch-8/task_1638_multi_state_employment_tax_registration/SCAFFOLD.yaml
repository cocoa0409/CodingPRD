    side_effects: ["Employer counters recompute"]
  - method: POST
    path: "/etax/agency-notices/{id}/close"
    description: "Close (RESOLVED -> CLOSED)"
    roles: [TaxDirector]
    code: 200
    input: []
    output: AgencyNotice
    side_effects: ["Employer counters recompute"]

  # --- AbatementRequest ---
  - method: POST
    path: "/etax/abatement-requests"
    description: "Draft an abatement request against a PENALTY_ASSESSMENT notice (eligibility computed; linked TRIAGED notice -> RESPONSE_IN_PROGRESS)"
    roles: [PayrollComplianceLead]
    code: 201
    input: [agency_notice_id, abatement_type, requested_amount_cents, reason]
    output: AbatementRequest
    side_effects: ["abatement_eligibility computed; notice {RECEIVED, TRIAGED} -> RESPONSE_IN_PROGRESS; prepared_by_user_id = X-User-ID"]
  - method: GET
    path: "/etax/abatement-requests"
    description: "List AbatementRequests"
    roles: [TaxDirector, NexusAnalyst, UISpecialist, PayrollComplianceLead, Employee, Auditor]
    code: 200
    input: ["agency_notice_id?", "status?", "limit?", "offset?"]
    output: AbatementRequest[]
    side_effects: []
  - method: GET
    path: "/etax/abatement-requests/{id}"
    description: "Get an AbatementRequest"
    roles: [TaxDirector, NexusAnalyst, UISpecialist, PayrollComplianceLead, Employee, Auditor]
    code: 200
    input: []
    output: AbatementRequest
    side_effects: []
  - method: POST
    path: "/etax/abatement-requests/{id}/submit"
    description: "Submit (DRAFT -> SUBMITTED; 60-day window + eligibility guards)"
    roles: [PayrollComplianceLead]
    code: 200
    input: []
    output: AbatementRequest
    side_effects: ["submitted_at = clock"]
  - method: POST
    path: "/etax/abatement-requests/{id}/review"
    description: "Open review (SUBMITTED -> UNDER_REVIEW; SoD vs preparer)"
    roles: [TaxDirector]
    code: 200
    input: []
    output: AbatementRequest
    side_effects: ["reviewed_by_user_id = X-User-ID"]
  - method: POST
    path: "/etax/abatement-requests/{id}/decide"
    description: "Decide (UNDER_REVIEW -> GRANTED|PARTIALLY_GRANTED|DENIED); granted amounts cascade to notice and obligation"
    roles: [TaxDirector]
    code: 200
    input: [decision, "granted_amount_cents?"]
    output: AbatementRequest
    side_effects: ["notice.abated_amount_cents += granted; linked LATE obligation -> WAIVED when outstanding hits 0; Employer counters recompute"]
  - method: POST
    path: "/etax/abatement-requests/{id}/withdraw"
    description: "Withdraw (DRAFT|SUBMITTED -> WITHDRAWN)"
    roles: [PayrollComplianceLead]
    code: 200
    input: []
    output: AbatementRequest
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not listed for the endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Employee-role caller acts on a resource whose employee_id != X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Approver/confirmer/reviewer X-User-ID equals the originator's (VC approve, obligation confirm, abatement review, location-change approve)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body reference to a non-existent resource id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, invalid enum, non-positive amount, missing required field, same-state election pair, election work state != employee location state, notice without any link, clock moved backward, inactive target work location, certificate form mismatch, decide payload shape violations" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "effective_from >= effective_to; decision_deadline not strictly future; response_due_date < received_date" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Transition not allowed from the resource's current state (incl. terminal lockdown)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version" }
  - { id: ERR_EMPLOYER_ALREADY_EXISTS, http: 409, condition: "Second POST /etax/employers" }
  - { id: ERR_DUPLICATE_AGENCY, http: 409, condition: "Active TaxAgency with same (agency_kind, state_code, locality_code) exists" }
  - { id: ERR_AGREEMENT_OVERLAP, http: 409, condition: "Closed-interval overlap with an existing agreement for the same unordered state pair" }
  - { id: ERR_EMPLOYEE_NOT_ACTIVE, http: 409, condition: "Location-change create/approve against a TERMINATED employee" }
  - { id: ERR_DUPLICATE_NEXUS_CASE, http: 409, condition: "NexusCase for the state already exists in {WATCH, THRESHOLD_MET, CONFIRMED, LAPSED}" }
  - { id: ERR_NEXUS_NOT_CONFIRMED, http: 409, condition: "Registration submit without a CONFIRMED NexusCase for the state" }
  - { id: ERR_DUPLICATE_REGISTRATION, http: 409, condition: "A non-CLOSED Registration for the same agency_id exists" }
  - { id: ERR_REGISTRATION_NOT_SETTLED, http: 409, condition: "Close with obligations in {SCHEDULED, DUE, LATE} or unresolved notices" }
  - { id: ERR_ELECTION_OVERLAP, http: 409, condition: "Half-open overlap with a same-type, same-employee election in {SUBMITTED, VALIDATED, ACTIVE} without supersede_existing" }
  - { id: ERR_RECIPROCITY_NOT_AVAILABLE, http: 422, condition: "No ACTIVE ReciprocityAgreement covers the {work, resident} pair at effective_from" }
  - { id: ERR_REGISTRATION_NOT_ACTIVE, http: 409, condition: "Courtesy election target state lacks an ACTIVE STATE_WITHHOLDING registration" }
  - { id: ERR_AGENCY_KIND_MISMATCH, http: 422, condition: "UIRate on non-UI registration; override referencing a non-LOCAL agency" }
  - { id: ERR_VC_NOT_ALLOWED_NEW_EMPLOYER, http: 422, condition: "Voluntary contribution against an experience_rated=false rate" }
  - { id: ERR_NO_NET_SAVINGS, http: 422, condition: "Voluntary contribution projection yields <= 0 net savings" }
  - { id: ERR_DEADLINE_PASSED, http: 409, condition: "Remit after decision_deadline (deadline instant itself allowed)" }
  - { id: ERR_RATE_SUPERSEDED, http: 409, condition: "VC apply when the linked UIRate is SUPERSEDED" }
  - { id: ERR_LOCATION_CHANGE_PENDING, http: 409, condition: "Employee already has a LocationChange in PENDING_REVIEW or APPROVED (also blocks terminate)" }
  - { id: ERR_ABATEMENT_WINDOW_CLOSED, http: 409, condition: "Abatement submit later than received_date + 60 days" }
  - { id: ERR_ABATEMENT_NOT_ELIGIBLE, http: 422, condition: "Abatement submit with eligible_amount_cents == 0" }
  - { id: ERR_ABATEMENT_PENDING, http: 409, condition: "Notice resolve while a linked AbatementRequest is in {DRAFT, SUBMITTED, UNDER_REVIEW}" }
  - { id: ERR_AMOUNT_EXCEEDS_PENALTY, http: 422, condition: "requested_amount_cents > notice outstanding penalty" }
  - { id: ERR_COMPANY_POSTURE_DELINQUENT, http: 409, condition: "VC approve while Employer.compliance_posture == DELINQUENT" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: TaxDirector
    description: "Employment tax director: catalog admin, nexus exemptions, VC approval, abatement review/decision, location-change reversal, registration close, clock control"
    identity: opaque
    exclusive_operations:
      - "POST /etax/employers"
      - "POST /etax/tax-agencies"
      - "POST /etax/reciprocity-agreements"
      - "POST /etax/nexus-cases/{id}/exempt"
      - "POST /etax/registrations/{id}/close"
      - "POST /etax/local-assignments/override"
      - "POST /etax/voluntary-contributions/{id}/approve"
      - "POST /etax/voluntary-contributions/{id}/decline"
      - "POST /etax/location-changes/{id}/reverse"
      - "POST /etax/agency-notices/{id}/close"
      - "POST /etax/abatement-requests/{id}/review"
      - "POST /etax/abatement-requests/{id}/decide"
      - "POST /etax/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]

  - name: NexusAnalyst
    description: "Nexus & registration analyst: employees, work locations, nexus cases, registration lifecycle, election validation, location-change review, local assignment resolution"
    identity: opaque
    exclusive_operations:
      - "POST /etax/work-locations"
      - "POST /etax/employees"
      - "POST /etax/employees/{id}/terminate"
      - "POST /etax/nexus-cases"
      - "POST /etax/nexus-cases/{id}/recompute"
      - "POST /etax/nexus-cases/{id}/confirm"
      - "POST /etax/registrations"
      - "POST /etax/registrations/{id}/submit"
      - "POST /etax/registrations/{id}/reject"
      - "POST /etax/registrations/{id}/activate"
      - "POST /etax/registrations/{id}/recompute_schedule"
      - "POST /etax/withholding-elections/{id}/validate"
      - "POST /etax/withholding-elections/{id}/reject"
      - "POST /etax/local-assignments/resolve"
      - "PATCH /etax/location-changes/{id}"
      - "POST /etax/location-changes/{id}/approve"
      - "POST /etax/location-changes/{id}/reject"
    shared_operations: ["all GET endpoints", "POST /etax/withholding-elections (on behalf of employees)", "POST /etax/withholding-elections/{id}/revoke"]

  - name: UISpecialist
    description: "Unemployment insurance specialist: rate notice intake/review/contest/effective, voluntary contribution propose/remit/apply"
    identity: opaque
    exclusive_operations:
      - "POST /etax/ui-rates"
      - "POST /etax/ui-rates/{id}/review"
      - "POST /etax/ui-rates/{id}/contest"
      - "POST /etax/ui-rates/{id}/make_effective"
      - "POST /etax/voluntary-contributions"
      - "POST /etax/voluntary-contributions/{id}/remit"
      - "POST /etax/voluntary-contributions/{id}/apply"
    shared_operations: ["all GET endpoints"]

  - name: PayrollComplianceLead
    description: "Payroll compliance: filing obligation file/confirm, agency notice intake/triage/escalation/resolution, abatement preparation/submission/withdrawal"
    identity: opaque
    exclusive_operations:
      - "POST /etax/filing-obligations/{id}/file"
      - "POST /etax/filing-obligations/{id}/confirm"
      - "POST /etax/agency-notices"
      - "POST /etax/agency-notices/{id}/triage"
      - "POST /etax/agency-notices/{id}/escalate"
      - "POST /etax/agency-notices/{id}/resolve"
      - "POST /etax/abatement-requests"
      - "POST /etax/abatement-requests/{id}/submit"
      - "POST /etax/abatement-requests/{id}/withdraw"
    shared_operations: ["all GET endpoints"]

  - name: Employee
    description: "Employee self-service: submits own location changes and withholding elections, revokes own elections, cancels own location changes, reads own records"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /etax/location-changes"
      - "POST /etax/location-changes/{id}/cancel"
    shared_operations: ["own-record GET endpoints", "POST /etax/withholding-elections", "POST /etax/withholding-elections/{id}/revoke"]

  - name: Auditor
    description: "Read-only auditor"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all GET endpoints"]
