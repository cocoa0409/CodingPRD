      - name: lease_term_closed_overlap_with_buffer
        grounds:
          - validations[priority=15]
          - entities.DocumentProject.fields.lease_property_ref
          - entities.DocumentProject.fields.lease_start_date
          - entities.DocumentProject.fields.lease_end_date
        distinguishing_aspect: |
          Resource = DocumentProject (LEASE), DIFFERENT interval semantics: closed
          [lease_start_date, lease_end_date] plus a LEASE_TURNOVER_BUFFER_DAYS=7 gap.
          A new lease starting 3 days after the prior ends falls inside the buffer
          and is rejected (whereas an 8-day gap would be allowed).
        test_recipe:
          setup:
            - "TX STANDARD ACTIVE subscription (>=2 credits). First LEASE project property P1 term [2026-01-01,2026-06-30] created"
          setup_api_calls:
