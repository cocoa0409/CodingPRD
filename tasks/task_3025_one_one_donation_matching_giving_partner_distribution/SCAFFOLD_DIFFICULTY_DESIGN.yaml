# =============================================================================
# SKILL §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Depth probe: 9 Difficulty Rules × 2 instances = 18 instances.
#
# Every `grounds:` reference resolves into SCAFFOLD.yaml §1.1–§1.6. Every
# `${var}` is bound by a `captures:` on an earlier line of the same instance.
# All numeric assertions are literals computed from §1.3's formulas.
#
# Shared fact: S is the ImpactSeason created by the first call of every chain.
# `created_at` values are distinct by construction because the logical clock is
# advanced between creations, which is what makes the pinned tie-breaks total.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: settled_and_unsettled_ledgers_disagree_by_unpaid_units
        grounds:
          - calculations.provisional_liability_accrual
          - calculations.final_liability_accrual
          - entities.DonationLiability.fields.provisional_liability_units
          - entities.DonationLiability.fields.final_liability_units
        distinguishing_aspect: "Two accrual rules read the same SalesOrderLine rows but count different order status sets, so for identical data they report 13 units and 9 units respectively; the four-unit gap is exactly the unpaid line's four units and is what the freeze snapshot later records."
        test_recipe:
          setup:
            - "S is PLANNED at 2026-09-01T00:00:00Z; the logical clock is advanced to 2026-08-15T00:00:00Z before any retail write, so S is not yet the running season."
            - "One ACTIVE DUAL_CHANNEL donation product with two ACTIVE eligible variant lines, ratio 1."
            - "One PAID order carrying the first line, and one still-CREATED order carrying the second line."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ImpactAuditor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ImpactAuditor
            - call: "POST /impact-program/impact-seasons"
              payload: { season_code: "2026-Q3", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-12-31T00:00:00Z", freezes_at: "2026-12-01T00:00:00Z" }
              as: ImpactAuditor
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /impact-program/donation-products"
              payload: { product_name: "Everyday Underlayer", product_kind: "UNDERGARMENT", design_channel: "DUAL_CHANNEL", obligation_model: "AT_SALE", approved_donation_ratio_units: 1, retail_price_cents: 1600, unit_cost_cents: 1150, is_reusable: true }
              as: ProductDesigner
              captures: { prod_id: $.data.id }
            - call: "POST /impact-program/donation-products/${prod_id}/activate"
              payload: {}
              as: ProductDesigner
            - call: "POST /impact-program/donation-products/${prod_id}/lines"
              payload: { gtin: "00000000000051", unit_size_label: "M", is_essential_good: true, donation_eligible: true }
              as: ProductDesigner
              captures: { pline_sold_id: $.data.id }
            - call: "POST /impact-program/donation-products/${prod_id}/lines"
              payload: { gtin: "00000000000052", unit_size_label: "L", is_essential_good: false, donation_eligible: true }
              as: ProductDesigner
              captures: { pline_unpaid_id: $.data.id }
            - call: "POST /impact-program/sales-orders"
              payload: { order_number: "SO-OVCA-1", channel: "RETAIL_ECOM" }
              as: CustomerService
              captures: { ord_paid_id: $.data.id }
            - call: "POST /impact-program/sales-orders/${ord_paid_id}/lines"
              payload: { donation_product_line_id: "${pline_sold_id}", quantity: 9, unit_price_cents: 1600, line_discount_cents: 0 }
              as: CustomerService
            - call: "POST /impact-program/sales-orders/${ord_paid_id}/pay"
              payload: {}
              as: CustomerService
            - call: "POST /impact-program/sales-orders"
              payload: { order_number: "SO-OVCA-2", channel: "RETAIL_POS" }
              as: CustomerService
              captures: { ord_created_id: $.data.id }
            - call: "POST /impact-program/sales-orders/${ord_created_id}/lines"
              payload: { donation_product_line_id: "${pline_unpaid_id}", quantity: 4, unit_price_cents: 1600, line_discount_cents: 0 }
              as: CustomerService
              captures: { liab_id: $.data.id }
          trigger:
            - call: "GET /impact-program/donation-products/${prod_id}"
              payload: {}
              as: ImpactAuditor
          assert:
            - "DonationLiability.row(prod_id=${prod_id}, season=2026-Q3).provisional_liability_units == 13"
            - "DonationLiability.row(prod_id=${prod_id}, season=2026-Q3).final_liability_units == 9"
            - "DonationLiability.row(prod_id=${prod_id}, season=2026-Q3).obligation_units == 13"
            - "DonationLiability.row(prod_id=${prod_id}, season=2026-Q3).status == ACCUMULATING"
            - "DonationProduct.${prod_id}.obligation_units_total == 13"

      - name: three_line_rounding_order_changes_the_ledger_by_one_cent
        grounds:
          - calculations.donation_credit_ledger
          - entities.DonationLiability.fields.donation_cost_cents
          - entities.DonationLiability.fields.donation_credit_units
        distinguishing_aspect: "Rounding each line's donation cost before summing and rounding the pooled total once are both arithmetically valid, and three APPAREL_TOP units at 1445 cents each expose the difference as exactly one cent — 7371 against 7370 — with the scaffold pinning the per-line-rounded order."
        test_recipe:
          setup:
            - "S is PLANNED at 2026-09-01T00:00:00Z; the order is created well before the season opens, so the payable season is the open segment."
            - "One ACTIVE DUAL_CHANNEL APPAREL_TOP product at unit_cost_cents 1445 and retail_price_cents 2050, with one eligible line."
            - "One PAID order with three units on that line."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ImpactAuditor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ImpactAuditor
            - call: "POST /impact-program/impact-seasons"
              payload: { season_code: "2026-Q3", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-12-31T00:00:00Z", freezes_at: "2026-12-01T00:00:00Z" }
              as: ImpactAuditor
              captures: { s_id: $.data.id }
            - call: "POST /impact-program/donation-products"
              payload: { product_name: "Ribbed Everyday Tee", product_kind: "APPAREL_TOP", design_channel: "DUAL_CHANNEL", obligation_model: "AT_SALE", approved_donation_ratio_units: 1, retail_price_cents: 2050, unit_cost_cents: 1445, is_reusable: true }
              as: ProductDesigner
              captures: { prod_id: $.data.id }
            - call: "POST /impact-program/donation-products/${prod_id}/activate"
              payload: {}
              as: ProductDesigner
            - call: "POST /impact-program/donation-products/${prod_id}/lines"
              payload: { gtin: "00000000000053", unit_size_label: "M", is_essential_good: false, donation_eligible: true }
              as: ProductDesigner
              captures: { pline_id: $.data.id }
            - call: "POST /impact-program/sales-orders"
              payload: { order_number: "SO-DVCB-1", channel: "RETAIL_ECOM" }
              as: CustomerService
              captures: { ord_id: $.data.id }
            - call: "POST /impact-program/sales-orders/${ord_id}/lines"
              payload: { donation_product_line_id: "${pline_id}", quantity: 3, unit_price_cents: 2050, line_discount_cents: 0 }
              as: CustomerService
            - call: "POST /impact-program/sales-orders/${ord_id}/pay"
              payload: {}
              as: CustomerService
          trigger:
            - call: "GET /impact-program/liabilities"
              payload: { donation_product_id: "${prod_id}", impact_season_id: "${s_id}" }
              as: ImpactAuditor
          assert:
            - "DonationLiability row has donation_cost_cents == 7371, not 7370"
            - "DonationLiability row has donation_credit_units == 3"
            - "DonationLiability row has unit_obligation_cost_cents derived as round_half_up(1445 * 1.70) == 2457"
            - "DonationLiability row has final_liability_units == 3"

  # ===========================================================================
  # Rule 2 — combinatorial_formula
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: largest_remainder_waterfall_distributes_the_floor_shortfall
        grounds:
          - calculations.weighted_allocation
          - calculations.partner_rank_score
          - entities.ImpactSeason.fields.attributed_units_total
        distinguishing_aspect: "The waterfall's exact shares are 4.929577, 3.380282 and 1.690141 against a cap of 10, so flooring alone strands two units; the largest-remainder sweep hands them to the two largest fractional parts and lands on 5/3/2, which a plain proportional split cannot reproduce."
        test_recipe:
          setup:
            - "The running season is OPEN at 2026-09-01T00:00:00Z with freezes_at far in the future."
            - "One APPROVED partner of each of three types, each with an ACTIVE capacity profile of 5000 units declared manually for the season."
            - "One claim naming all three partners for one DUAL_CHANNEL product."
            - "Clock advanced so the three partners have distinct created_at values, making the pinned tie-break total."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ImpactAuditor
            - call: "POST /impact-program/impact-seasons"
              payload: { season_code: "2026-Q3", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-12-31T00:00:00Z", freezes_at: "2026-12-01T00:00:00Z" }
              as: ImpactAuditor
              captures: { s_id: $.data.id }
            - call: "POST /impact-program/donation-products"
              payload: { product_name: "Cushion Crew Sock", product_kind: "ATHLETIC_SOCK", design_channel: "DUAL_CHANNEL", obligation_model: "AT_SALE", approved_donation_ratio_units: 1, retail_price_cents: 1900, unit_cost_cents: 1150, is_reusable: true }
              as: ProductDesigner
              captures: { prod_id: $.data.id }
            - call: "POST /impact-program/donation-products/${prod_id}/activate"
              payload: {}
              as: ProductDesigner
            - call: "POST /impact-program/donation-products/${prod_id}/lines"
              payload: { gtin: "00000000000054", unit_size_label: "M", is_essential_good: true, donation_eligible: true }
              as: ProductDesigner
              captures: { pline_id: $.data.id }
            - call: "POST /impact-program/giving-partners"
              payload: { legal_name: "Alpha Housing Bridge", partner_type: "HOMELESS_SHELTER", operating_region: "NORTHEAST", operating_state_code: "NY", service_radius_miles: 50, registry_id: "NY-CHR-100001", ein: "111222333", founded_year: 1998, unduplicated_recipients_per_facility: 5000, need_tier: "HOMELESS_SHELTER" }
              as: GivingPartnerCoordinator
              captures: { p_a_id: $.data.id, vt_a_id: $.data.latest_vetting_round_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: ImpactAuditor
            - call: "POST /impact-program/giving-partners"
              payload: { legal_name: "Beta Outreach Collective", partner_type: "YOUTH_OUTREACH", operating_region: "SOUTHWEST", operating_state_code: "TX", service_radius_miles: 75, registry_id: "TX-CHR-200002", ein: "222333444", founded_year: 2005, unduplicated_recipients_per_facility: 3000, need_tier: "YOUTH_OUTREACH" }
              as: GivingPartnerCoordinator
              captures: { p_b_id: $.data.id, vt_b_id: $.data.latest_vetting_round_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: ImpactAuditor
            - call: "POST /impact-program/giving-partners"
              payload: { legal_name: "Gamma Relief Network", partner_type: "DISASTER_RELIEF", operating_region: "MIDWEST", operating_state_code: "OH", service_radius_miles: 30, registry_id: "OH-CHR-300003", ein: "333444555", founded_year: 2011, unduplicated_recipients_per_facility: 2000, need_tier: "DISASTER_RELIEF" }
              as: GivingPartnerCoordinator
              captures: { p_c_id: $.data.id, vt_c_id: $.data.latest_vetting_round_id }
            - call: "PUT /impact-program/vetting-rounds/${vt_a_id}"
              payload: { outcome: "EVALUATING", registry_check_passed: true, tax_check_passed: true, on_site_check_passed: true, capacity_check_passed: true, need_verification_points: 1, valid_until: "2027-01-01T00:00:00Z" }
              as: GivingPartnerCoordinator
            - call: "POST /impact-program/vetting-rounds/${vt_a_id}/approve"
              payload: {}
              as: GivingPartnerCoordinator
            - call: "PUT /impact-program/vetting-rounds/${vt_b_id}"
              payload: { outcome: "EVALUATING", registry_check_passed: true, tax_check_passed: true, on_site_check_passed: true, capacity_check_passed: true, need_verification_points: 1, valid_until: "2027-01-01T00:00:00Z" }
              as: GivingPartnerCoordinator
            - call: "POST /impact-program/vetting-rounds/${vt_b_id}/approve"
              payload: {}
              as: GivingPartnerCoordinator
            - call: "PUT /impact-program/vetting-rounds/${vt_c_id}"
              payload: { outcome: "EVALUATING", registry_check_passed: true, tax_check_passed: true, on_site_check_passed: true, capacity_check_passed: true, need_verification_points: 1, valid_until: "2027-01-01T00:00:00Z" }
              as: GivingPartnerCoordinator
            - call: "POST /impact-program/vetting-rounds/${vt_c_id}/approve"
              payload: {}
              as: GivingPartnerCoordinator
            - call: "POST /impact-program/giving-partners/${p_a_id}/capacity-profiles"
              payload: { season_code: "2026-Q3", max_allocatable_units: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-31T00:00:00Z" }
              as: GivingPartnerCoordinator
              captures: { cap_a_id: $.data.id }
            - call: "POST /impact-program/giving-partners/${p_b_id}/capacity-profiles"
              payload: { season_code: "2026-Q3", max_allocatable_units: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-31T00:00:00Z" }
              as: GivingPartnerCoordinator
              captures: { cap_b_id: $.data.id }
            - call: "POST /impact-program/giving-partners/${p_c_id}/capacity-profiles"
              payload: { season_code: "2026-Q3", max_allocatable_units: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-31T00:00:00Z" }
              as: GivingPartnerCoordinator
              captures: { cap_c_id: $.data.id }
            - call: "POST /impact-program/marketing-claims"
              payload: { donation_product_id: "${prod_id}", partner_id: "${p_a_id}", stated_donation_units: 3000, stated_ratio_text: "one purchased = one donated", winback_multiplier: 1, stated_reference_period: "SEASON" }
              as: MarketingManager
              captures: { claim_id: $.data.id }
            - call: "POST /impact-program/donation-products/${prod_id}/lines"
              payload: { gtin: "00000000000055", unit_size_label: "L", is_essential_good: false, donation_eligible: true }
              as: ProductDesigner
          trigger:
            - call: "POST /impact-program/allocation-plans/${s_id}/allocate"
              payload: { claim_id: "${claim_id}", donation_product_id: "${prod_id}", liquidity_cap: 10, baseline_units: 2400, demand_units: 15000, pool_units: 4000 }
              as: AllocationPlanner
          assert:
            - "the sum of allocated_units over the created DonationAllocation rows == 10"
            - "the row against Gamma Relief Network has allocated_units == 2"
            - "the row allocated against Beta Outreach Collective has allocated_units == 5"
            - "the row allocated against Alpha Housing Bridge has allocated_units == 3"
            - "every created DonationAllocation has status PENDING_ALLOCATION and allocation_kind ALLOCATION"
            - "the response's partner_count == 3 and liquidity_cap == 10, and no fourth partner received a row"
            - "repeating the same call with identical inputs produces the same 5/3/2 split, because the tie-break chain ends at created_at and never at id"

      - name: proved_monthly_upkeep_only_residency_holds_the_promoted_tier
        grounds:
          - calculations.need_score
          - entities.GivingPartner.fields.need_score
          - entities.GivingPartnerVetting.fields.need_verification_points
        distinguishing_aspect: "need_score evaluates the base before the access component, so a clinic partner whose declared base is 20 with 20000 recipients reaches 46 on 3 points but only 41 on 5 points — both above the 40 approval gate, but the promotion is three points short of compensating the verified-tier debit, so promotion and approval are separate decisions."
        test_recipe:
          setup:
            - "The running season is OPEN at 2026-09-01T00:00:00Z."
            - "A clinic partner is created with the maximum access component, then its round carries the verification points."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ImpactAuditor
            - call: "POST /impact-program/impact-seasons"
              payload: { season_code: "2026-Q3", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-12-31T00:00:00Z", freezes_at: "2026-12-01T00:00:00Z" }
              as: ImpactAuditor
              captures: { s_id: $.data.id }
            - call: "POST /impact-program/giving-partners"
              payload: { legal_name: "Delta Community Clinic", partner_type: "COMMUNITY_HEALTH_CLINIC", operating_region: "MIDWEST", operating_state_code: "IL", service_radius_miles: 25, registry_id: "IL-CHR-400004", ein: "444555666", founded_year: 1990, unduplicated_recipients_per_facility: 20000, need_tier: "COMMUNITY_HEALTH_CLINIC" }
              as: GivingPartnerCoordinator
              captures: { p_id: $.data.id, vt_id: $.data.latest_vetting_round_id }
            - call: "PUT /impact-program/vetting-rounds/${vt_id}"
              payload: { outcome: "EVALUATING", registry_check_passed: true, tax_check_passed: true, on_site_check_passed: true, capacity_check_passed: true, need_verification_points: 3, valid_until: "2027-01-01T00:00:00Z" }
              as: GivingPartnerCoordinator
            - call: "POST /impact-program/vetting-rounds/${vt_id}/approve"
              payload: {}
              as: GivingPartnerCoordinator
          trigger:
            - call: "PUT /impact-program/vetting-rounds/${vt_id}"
              payload: { outcome: "EVALUATING", registry_check_passed: true, tax_check_passed: true, on_site_check_passed: true, capacity_check_passed: true, need_verification_points: 5, valid_until: "2027-01-01T00:00:00Z" }
              as: GivingPartnerCoordinator
          assert:
            - "before the trigger the partner's need_score is 46, computed as 20 + 6 + min(20, 20000 // 1000) == 46"
            - "the partner's status before the trigger is APPROVED"
            - "after the trigger the partner's need_score is 41, computed as 20 + 6 - 5 + 20 == 41"
            - "after the trigger the partner's status is still APPROVED, because 41 >= 40"
            - "an otherwise identical clinic partner with operating_region SOUTHEAST and the same 20000 recipients has need_score 35 at 5 points and cannot be approved"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: vetting_cycle_reopens_with_a_new_round_then_finalizes_at_two_rejections
        grounds:
          - state_machines.GivingPartnerVetting.EVALUATING_to_REQUESTED
          - state_machines.GivingPartnerVetting.REJECTED_to_REQUESTED
          - state_machines.GivingPartnerVetting.EVALUATING_to_REJECTED
          - state_machines.GivingPartner.REJECTED_to_VETTING
          - errors[ERR_PARTNER_REJECTION_FINAL]
        distinguishing_aspect: "The vetting machine cycles EVALUATING→REQUESTED→DOCUMENTS_SUBMITTED→EVALUATING and then REJECTED→REQUESTED on a second round, but the same cycle is blocked from the third round onward because total_rejections reaches 2 and the rejection becomes final — a cyclic machine with a cycle-count arrest."
        test_recipe:
          setup:
            - "The running season is OPEN at 2026-09-01T00:00:00Z; a partner CANDIDATE with round 1 REQUESTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ImpactAuditor
            - call: "POST /impact-program/impact-seasons"
              payload: { season_code: "2026-Q3", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-12-31T00:00:00Z", freezes_at: "2026-12-01T00:00:00Z" }
              as: ImpactAuditor
              captures: { s_id: $.data.id }
            - call: "POST /impact-program/giving-partners"
              payload: { legal_name: "Epsilon Bridge Shelter", partner_type: "HOMELESS_SHELTER", operating_region: "WEST", operating_state_code: "OR", service_radius_miles: 40, registry_id: "OR-CHR-500005", ein: "555666777", founded_year: 2015, unduplicated_recipients_per_facility: 1000, need_tier: "HOMELESS_SHELTER" }
              as: GivingPartnerCoordinator
              captures: { p_id: $.data.id, vt1_id: $.data.latest_vetting_round_id }
            - call: "PUT /impact-program/vetting-rounds/${vt1_id}"
              payload: { outcome: "EVALUATING", registry_check_passed: true, tax_check_passed: false, on_site_check_passed: true, capacity_check_passed: true, need_verification_points: 0, valid_until: "2027-01-01T00:00:00Z" }
              as: GivingPartnerCoordinator
            - call: "PUT /impact-program/vetting-rounds/${vt1_id}"
              payload: { outcome: "REQUESTED", outcome_message: "Tax determination letter unreadable; please resubmit" }
              as: GivingPartnerCoordinator
          trigger:
            - call: "POST /impact-program/vetting-rounds/${vt1_id}/reject"
              payload: { outcome_message: "Registry record still mismatched after resubmission" }
              as: GivingPartnerCoordinator
          assert:
            - "GivingPartner.${p_id}.total_rejections == 1 before the trigger and == 2 after it"
            - "GivingPartner.${p_id}.status == REJECTED_FINAL after the trigger"
            - "a subsequent POST /impact-program/vetting-rounds/${vt1_id}/reopen returns 409 ERR_PARTNER_REJECTION_FINAL"
            - "GivingPartner.${p_id}.vetting_round == 1 and no round 2 row exists"
            - "GET /impact-program/vetting-rounds?partner_id=${p_id} returns exactly one row at round_number 1, so the cycle never advanced past the arrest"

      - name: donation_liability_cycles_accumulating_to_frozen_back_to_accumulating
        grounds:
          - state_machines.DonationLiability.ACCUMULATING_to_FROZEN
          - state_machines.DonationLiability.FROZEN_to_ACCUMULATING
          - state_machines.ImpactSeason.OPEN_to_FROZEN
          - state_machines.ImpactSeason.FROZEN_to_OPEN
          - errors[ERR_AUDIT_LOCK_NOT_RESETTABLE]
        distinguishing_aspect: "The liability machine leaves ACCUMULATING only through a freeze and returns to ACCUMULATING through an explicit unfreeze, and the two further cycles through CARRIED and AUDIT_LOCKED are both blocked once a season audit finalizes — a cycle whose re-entry is gated by a sibling entity's terminal state."
        test_recipe:
          setup:
            - "A season is PLANNED at 2026-09-01T00:00:00Z; the order is created before the season opens so the payable season resolves to the running one."
            - "One DUAL_CHANNEL product and one PAID order carrying 5 units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ImpactAuditor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ImpactAuditor
            - call: "POST /impact-program/impact-seasons"
              payload: { season_code: "2026-Q3", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-12-31T00:00:00Z", freezes_at: "2026-12-01T00:00:00Z" }
              as: ImpactAuditor
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /impact-program/donation-products"
