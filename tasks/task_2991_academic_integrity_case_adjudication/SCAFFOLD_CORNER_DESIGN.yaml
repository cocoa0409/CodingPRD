            - call: "POST /integrity/reports"
              payload: { offering_id: "${offering_id}", student_id: "${student_id}", alleged_violation_type: "PLAGIARISM", narrative: "Essay reuses an uncited source.", incident_at: "2026-07-20T00:00:00Z", component_scores: [{ code: "ESSAY", earned_points: 156 }, { code: "MIDTERM", earned_points: 68 }, { code: "PROJECT", earned_points: 56 }, { code: "FINAL", earned_points: 113 }] }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
              captures: { report_id: $.data.id }
            - call: "POST /integrity/evidence-items"
              payload: { report_id: "${report_id}", kind: "SIMILARITY_REPORT", sha256: "1111111111111111111111111111111111111111111111111111111111111111", page_count: 4, similarity_pct: 45.00 }
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports/${report_id}/submit"
              as: FacultyReporter
              as_user_id: "${reporter_id}"
            - call: "POST /integrity/reports/${report_id}/triage"
              payload: { decision: "ACCEPT", triage_note: "Sufficient evidence." }
              as: IntegrityOfficer
            - call: "POST /integrity/cases"
              payload: { report_id: "${report_id}" }
              as: IntegrityOfficer
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /integrity/cases/${case_id}/pathway"
              payload: { pathway: "FORMAL" }
              as: IntegrityOfficer
            - call: "POST /integrity/cases/${case_id}/notifications"
              payload: { kind: "ALLEGATION_NOTICE", response_window_days: 5 }
              as: IntegrityOfficer
              captures: { notice_id: $.data.id }
            - call: "GET /integrity/cases/${case_id}/notifications"
              as: Student
              as_user_id: "${student_id}"
          assert:
            - "after the pathway call, Case.${case_id}.pathway == FORMAL while adjudication_status is STILL INTAKE_REVIEW - setting the pathway is not a notification"
            - "after the notification call, Case.${case_id}.adjudication_status == NOTIFIED"
            - "Notification.${notice_id}.kind == ALLEGATION_NOTICE, case_id == ${case_id}, sent_at == 2026-08-01T00:00:00Z, acknowledged_at == null"
            - "Notification.${notice_id}.response_window_days == 5 and response_deadline_at == 2026-08-06T00:00:00Z"
            - "Case.${case_id}.version == 3: one bump for the pathway write and one for the notification write"
            - "GET /integrity/cases/${case_id}/notifications returns total_count 1 - the sub-resource read reaches the child from the parent"

      - name: each_state_machine_rejects_the_triggers_its_current_state_does_not_admit
        claim_type: Invalid Transitions
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - validations[priority=14]
          - validations[priority=15]
          - errors.ERR_REPORT_STATE_INVALID
          - errors.ERR_CASE_ALREADY_OPENED
          - errors.ERR_CASE_PATHWAY_ALREADY_SET
          - errors.ERR_CASE_PATHWAY_NOT_SET
        distinguishing_aspect: |
          Seven refusals from four different guards, each naming its own error_id: re-submitting a
          SUBMITTED report, triaging a DRAFT report, attaching evidence to a SUBMITTED report and
          opening a case from a SUBMITTED report all yield ERR_REPORT_STATE_INVALID; a second case on
          the same report yields ERR_CASE_ALREADY_OPENED; a second pathway write yields
          ERR_CASE_PATHWAY_ALREADY_SET; and scheduling a hearing on a NOTIFIED case whose pathway is
          still UNASSIGNED yields ERR_CASE_PATHWAY_NOT_SET rather than ERR_CASE_STATE_INVALID, because
          NOTIFIED does admit hearing scheduling - only the missing pathway blocks it.
