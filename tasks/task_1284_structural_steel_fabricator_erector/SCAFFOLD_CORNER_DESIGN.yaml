            - { call: "POST /pieces/${p8}/start", as: FOREMAN }
            - { call: "POST /inspections", payload: { job_id: "${j8}", kind: "FINAL_PIECE", piece_id: "${p8}" }, as: QC_INSPECTOR, captures: { i8: $.data.id } }
