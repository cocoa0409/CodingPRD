  - section: endpoints
    instances:
      - name: the_compliance_sweep_is_an_ordered_bulk_action_and_a_second_run_is_a_no_op
        claim_type: bulk_action
        grounds:
          - endpoints["POST /commission/compliance-sweeps"]
          - state_machines.TrustAudit.REMEDIATION_ORDERED_to_ESCALATED
          - state_machines.SanctionOrder.ISSUED_to_IN_DEFAULT
          - calculations.brokerage_supervision_posture
        distinguishing_aspect: |
          One idempotent endpoint that touches three different entity families in one pass and reports a
          per-step count, with no input at all: the same request returns five zeros before anything is
          due, one escalation plus one default once the clock passes both deadlines, and five zeros
          again immediately afterwards because every row it moved has left its source state.
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with Dana Broker ACTIVE and self-supervising and Sam Reed ACTIVE"
            - "escrow account TA carries OBLIGATION_OPENED 1000000 and DEPOSIT 800000, so shortage_cents == 200000, and auditor auditor-21 issued findings with remediation_days 3, leaving the audit REMEDIATION_ORDERED with remediation_due_at 2026-08-04T00:00:00Z and TA RESTRICTED"
            - "a FINE consent order of 500000 cents against Sam Reed is ISSUED with effective_at 2026-08-01T00:00:00Z, fine_due_at 2026-08-31T00:00:00Z and fine_paid_cents 0"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
