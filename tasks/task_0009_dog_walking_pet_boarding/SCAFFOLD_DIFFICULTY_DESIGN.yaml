              as: Owner
              as_user_id: "${o11_id}"
              captures: { p11b_id: $.data.id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-13T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/meet-and-greets"
              payload: { owner_id: "${o11_id}", sitter_id: "${s11_id}", pet_id: "${p11a_id}", scheduled_at: "2026-06-13T07:30:00Z" }
              as: Owner
              as_user_id: "${o11_id}"
              captures: { mg11a_id: $.data.id }
            - call: "POST /api/v1/meet-and-greets/${mg11a_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "${o11_id}"
            - call: "POST /api/v1/meet-and-greets"
              payload: { owner_id: "${o11_id}", sitter_id: "${s11_id}", pet_id: "${p11b_id}", scheduled_at: "2026-06-13T07:35:00Z" }
              as: Owner
              as_user_id: "${o11_id}"
              captures: { mg11b_id: $.data.id }
            - call: "POST /api/v1/meet-and-greets/${mg11b_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "${o11_id}"
            - call: "POST /api/v1/bookings"
              payload: { owner_id: "${o11_id}", sitter_id: "${s11_id}", pet_id: "${p11a_id}", service_type: "WALK_60MIN", time_of_day: "STANDARD", recurring_cadence: "NONE", start_at: "2026-06-13T09:00:00Z", end_at: "2026-06-13T10:00:00Z" }
              as: Owner
              as_user_id: "${o11_id}"
              captures: { b11a_id: $.data.id }
            - call: "POST /api/v1/bookings/${b11a_id}/confirm"
              payload: {}
