            - call: "GET /lot-recalls/aaaaaaaa-0000-4000-8000-00000000000f"
              as: PracticeAdmin
              captures: { k_nf_recall: $.data.error_id }
            - call: "GET /recall-notifications/aaaaaaaa-0000-4000-8000-000000000010"
              as: ComplianceOfficer
              captures: { k_nf_notification: $.data.error_id }
          assert:
            - "${k_nf_payer} == \"ERR_PAYER_NOT_FOUND\", ${k_nf_drug} == \"ERR_DRUG_NOT_FOUND\", ${k_nf_policy} == \"ERR_POLICY_NOT_FOUND\", ${k_nf_patient} == \"ERR_PATIENT_NOT_FOUND\""
            - "${k_nf_clinician} == \"ERR_CLINICIAN_NOT_FOUND\", ${k_nf_imaging} == \"ERR_IMAGING_STUDY_NOT_FOUND\", ${k_nf_plan} == \"ERR_PLAN_NOT_FOUND\", ${k_nf_lot} == \"ERR_LOT_NOT_FOUND\""
            - "${k_nf_vial} == \"ERR_VIAL_NOT_FOUND\", ${k_nf_auth} == \"ERR_AUTHORIZATION_NOT_FOUND\", ${k_nf_encounter} == \"ERR_ENCOUNTER_NOT_FOUND\", ${k_nf_claim} == \"ERR_CLAIM_NOT_FOUND\""
            - "${k_nf_enrollment} == \"ERR_ENROLLMENT_NOT_FOUND\", ${k_nf_adverse} == \"ERR_ADVERSE_EVENT_NOT_FOUND\", ${k_nf_recall} == \"ERR_RECALL_NOT_FOUND\", ${k_nf_notification} == \"ERR_NOTIFICATION_NOT_FOUND\""
            - "every response carries HTTP 404 with response_type \"error\""

      - name: corner_body_foreign_keys_are_checked_in_declaration_order_not_found
        claim_type: cascading_validation
        grounds:
          - validations.priority_7
          - endpoints.POST_/treatment-plans
        distinguishing_aspect: "Priority 7 walks the body's foreign keys in the order §1.5 declares them, so a POST /treatment-plans whose patient_id AND drug_id are both unknown returns ERR_PATIENT_NOT_FOUND (patient_id is declared first), never ERR_DRUG_NOT_FOUND; fixing only the patient then surfaces ERR_DRUG_NOT_FOUND."
        test_recipe:
          setup:
            - "the corner prologue with patient P-NP and Drug REF on file"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
          trigger:
            - call: "POST /treatment-plans"
              payload: { patient_id: "bbbbbbbb-0000-4000-8000-000000000001", drug_id: "bbbbbbbb-0000-4000-8000-000000000002", eye: "OD", loading_doses_required: 3 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_fk_both: $.data.error_id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${k_pt_np_id}", drug_id: "bbbbbbbb-0000-4000-8000-000000000002", eye: "OD", loading_doses_required: 3 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_fk_drug: $.data.error_id }
            - call: "POST /payer-drug-policies"
              payload: { payer_id: "bbbbbbbb-0000-4000-8000-000000000003", drug_id: "${k_drug_ref_id}", coverage_tier: "PREFERRED", drug_allowed_cents_per_billing_unit: 14000, admin_allowed_cents: 10000 }
              as: PracticeAdmin
              captures: { k_fk_payer: $.data.error_id }
            - call: "POST /claims"
              payload: { injection_encounter_id: "bbbbbbbb-0000-4000-8000-000000000004" }
              as: BillingSpecialist
              captures: { k_fk_enc: $.data.error_id }
          assert:
            - "${k_fk_both} == \"ERR_PATIENT_NOT_FOUND\" with HTTP 404 (declaration order, not alphabetical or hash order)"
            - "${k_fk_drug} == \"ERR_DRUG_NOT_FOUND\""
            - "${k_fk_payer} == \"ERR_PAYER_NOT_FOUND\""
            - "${k_fk_enc} == \"ERR_ENCOUNTER_NOT_FOUND\""
            - "no TreatmentPlan, PayerDrugPolicy or Claim row is created"

      - name: corner_plan_state_gates_reject_resume_and_treatment_on_a_draft_plan
        claim_type: violation_to_error
        grounds:
          - validations.priority_13
          - errors[ERR_PLAN_STATE_INVALID]
          - errors[ERR_PLAN_NOT_TREATABLE]
        distinguishing_aspect: "A DRAFT plan fails two different gates for two different reasons: resume (and suspend) hit the transition guard ERR_PLAN_STATE_INVALID, while POST /injection-encounters hits the treatability gate ERR_PLAN_NOT_TREATABLE because DRAFT is not in {LOADING, MAINTENANCE, INTENSIFIED} — and activating twice hits ERR_PLAN_STATE_INVALID on the second call."
        test_recipe:
          setup:
            - "the corner prologue with a DRAFT plan for P-NP / OD and an ACTIVE baseline study"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
            - *k_cl2
            - *k_lot
            - *k_img_np
            - *k_plan_np
          trigger:
            - call: "POST /treatment-plans/${k_plan_np_id}/resume"
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_pg_resume: $.data.error_id }
            - call: "POST /treatment-plans/${k_plan_np_id}/suspend"
              payload: { suspension_reason: "CLINICIAN_HOLD" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_pg_suspend: $.data.error_id }
            - call: "POST /injection-encounters"
              payload: { treatment_plan_id: "${k_plan_np_id}", imaging_study_id: "${k_img_np_id}", encounter_datetime: "2026-08-01T09:00:00Z", expected_treatment_plan_version: "${k_plan_np_v1}" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_pg_treat: $.data.error_id }
            - call: "POST /treatment-plans/${k_plan_np_id}/activate"
              payload: { baseline_imaging_study_id: "${k_img_np_id}" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_pg_act1_status: $.data.status }
            - call: "POST /treatment-plans/${k_plan_np_id}/activate"
              payload: { baseline_imaging_study_id: "${k_img_np_id}" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_pg_act2: $.data.error_id }
          assert:
            - "${k_pg_resume} == \"ERR_PLAN_STATE_INVALID\" with HTTP 409"
            - "${k_pg_suspend} == \"ERR_PLAN_STATE_INVALID\" with HTTP 409"
            - "${k_pg_treat} == \"ERR_PLAN_NOT_TREATABLE\" with HTTP 409 and no vial is reserved"
            - "${k_pg_act1_status} == LOADING then ${k_pg_act2} == \"ERR_PLAN_STATE_INVALID\""
            - "TreatmentPlan.${k_plan_np_id}.version == 2 after the whole sequence (only the successful activate bumped it)"

      - name: corner_authorization_gates_reject_out_of_order_decisions_and_late_appeals
        claim_type: violation_to_error
        grounds:
          - validations.priority_13
          - validations.priority_32
          - validations.priority_34
          - errors[ERR_AUTHORIZATION_STATE_INVALID]
          - errors[ERR_APPROVED_INJECTIONS_EXCEED_POLICY]
          - errors[ERR_APPEAL_WINDOW_CLOSED]
        distinguishing_aspect: "Three independent authorization guards on one PA: a decision on a DRAFT (unsubmitted) PA is ERR_AUTHORIZATION_STATE_INVALID, an approval for 5 injections against a policy capped at pa_max_injections 3 is ERR_APPROVED_INJECTIONS_EXCEED_POLICY (422), and an appeal filed 46 days after a denial is ERR_APPEAL_WINDOW_CLOSED because the payer's appeal_window_days is 45 — the window is measured from the denial's updated_at, not from the PA's creation."
        test_recipe:
          setup:
            - "the corner prologue with an active plan for P-NP and a DRAFT PriorAuthorization on it"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
            - *k_cl2
            - *k_lot
            - *k_img_np
            - *k_plan_np
            - *k_plan_np_act
            - &k_pa_np
              call: "POST /prior-authorizations"
              payload: { treatment_plan_id: "${k_plan_np_id}", expected_treatment_plan_version: "${k_plan_np_v}" }
              as: BillingSpecialist
              captures: { k_pa_np_id: $.data.id }
          trigger:
            - call: "POST /prior-authorizations/${k_pa_np_id}/decision"
              payload: { decision: "APPROVED", auth_number: "AUTH-0001", approved_injections: 3, effective_date: "2026-08-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { k_ag_early: $.data.error_id }
            - call: "POST /prior-authorizations/${k_pa_np_id}/submit"
              payload: { clinical_justification: "Active exudative disease on OCT" }
              as: BillingSpecialist
              captures: { k_ag_submitted: $.data.status }
            - call: "POST /prior-authorizations/${k_pa_np_id}/decision"
              payload: { decision: "APPROVED", auth_number: "AUTH-0002", approved_injections: 5, effective_date: "2026-08-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { k_ag_cap: $.data.error_id }
            - call: "POST /prior-authorizations/${k_pa_np_id}/decision"
              payload: { decision: "DENIED", denial_reason: "Step therapy documentation not received" }
              as: BillingSpecialist
              captures: { k_ag_denied: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /prior-authorizations/${k_pa_np_id}/appeal"
              payload: { appeal_basis: "Prior failure records attached" }
              as: BillingSpecialist
              captures: { k_ag_late: $.data.error_id }
          assert:
            - "${k_ag_early} == \"ERR_AUTHORIZATION_STATE_INVALID\" with HTTP 409"
            - "${k_ag_submitted} == SUBMITTED"
            - "${k_ag_cap} == \"ERR_APPROVED_INJECTIONS_EXCEED_POLICY\" with HTTP 422 and the PA is still SUBMITTED"
            - "${k_ag_denied} == DENIED"
            - "${k_ag_late} == \"ERR_APPEAL_WINDOW_CLOSED\" with HTTP 409 (45-day window closed on 2026-09-15)"
            - "PriorAuthorization.${k_pa_np_id}.status is still DENIED and appeal_basis is null"

      - name: corner_claim_line_gates_reject_double_submission_early_remittance_and_a_second_claim
        claim_type: violation_to_error
        grounds:
          - validations.priority_13
          - validations.priority_37
          - errors[ERR_CLAIM_LINE_STATE_INVALID]
          - errors[ERR_DUPLICATE_CLAIM]
        distinguishing_aspect: "The claim's two line dimensions are guarded independently of the claim row: remitting before submission and appealing a line that is not DENIED both return ERR_CLAIM_LINE_STATE_INVALID, a second submit returns the same, and a second POST /claims for the same encounter returns ERR_DUPLICATE_CLAIM (409) rather than creating a parallel claim."
        test_recipe:
          setup:
            - "the corner prologue with encounter ENC-NP ATTESTED and one claim created"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
            - *k_cl2
            - *k_lot
            - *k_img_np
            - *k_plan_np
            - *k_plan_np_act
            - *k_enc_np
            - *k_enc_np_doc
            - *k_enc_np_att
            - &k_claim_np
              call: "POST /claims"
              payload: { injection_encounter_id: "${k_enc_np_id}" }
              as: BillingSpecialist
              captures: { k_claim_id: $.data.id, k_claim_drug_line: $.data.drug_line_status }
          trigger:
            - call: "POST /claims/${k_claim_id}/remittance"
              payload: { drug_line_outcome: "PAID", drug_allowed_cents: 28000, drug_paid_cents: 24200 }
              as: BillingSpecialist
              captures: { k_cg_early_remit: $.data.error_id }
            - call: "POST /claims/${k_claim_id}/appeal-drug-line"
              payload: { appeal_basis: "Wastage documentation attached" }
              as: BillingSpecialist
              captures: { k_cg_early_appeal: $.data.error_id }
            - call: "POST /claims/${k_claim_id}/submit"
              as: BillingSpecialist
              captures: { k_cg_submitted: $.data.drug_line_status }
            - call: "POST /claims/${k_claim_id}/submit"
              as: BillingSpecialist
              captures: { k_cg_double: $.data.error_id }
            - call: "POST /claims"
              payload: { injection_encounter_id: "${k_enc_np_id}" }
              as: BillingSpecialist
              captures: { k_cg_dupe: $.data.error_id }
          assert:
            - "${k_claim_drug_line} == PENDING at creation"
            - "${k_cg_early_remit} == \"ERR_CLAIM_LINE_STATE_INVALID\" with HTTP 409"
            - "${k_cg_early_appeal} == \"ERR_CLAIM_LINE_STATE_INVALID\" with HTTP 409"
            - "${k_cg_submitted} == SUBMITTED then ${k_cg_double} == \"ERR_CLAIM_LINE_STATE_INVALID\""
            - "${k_cg_dupe} == \"ERR_DUPLICATE_CLAIM\" with HTTP 409 and GET /claims?injection_encounter_id=${k_enc_np_id} still returns total_count == 1"

      - name: corner_authorization_is_required_then_exhausted_by_the_approved_injection_count
        claim_type: conditional_validation
        grounds:
          - validations.priority_22
          - validations.priority_25
          - errors[ERR_AUTHORIZATION_MISSING]
          - errors[ERR_AUTHORIZATION_EXHAUSTED]
        distinguishing_aspect: "The PA gate is conditional on PayerDrugPolicy.pa_required: on the PA-required payer the very first encounter is rejected with ERR_AUTHORIZATION_MISSING, an approval for one injection lets exactly one encounter through (flipping the PA to EXHAUSTED), and the next encounter is rejected with ERR_AUTHORIZATION_EXHAUSTED even though the authorization is still inside its 180-day window."
        test_recipe:
          setup:
            - "payer PAY-COMM with PayerDrugPolicy(COMM, REF) pa_required true and pa_max_injections 1"
