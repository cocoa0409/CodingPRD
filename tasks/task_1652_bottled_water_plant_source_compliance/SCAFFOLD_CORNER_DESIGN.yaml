# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Bottled Water Plant & Source Compliance
# Breadth coverage of every testable claim in §1.1–§1.7 not already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. All chains replay against §1.5 exactly.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: plant_created_with_computed_defaults
        claim_type: defaults
        grounds: [entities.Plant.fields.compliance_posture, entities.Plant.fields.ops_run_index]
        distinguishing_aspect: "A freshly created plant carries computed/system defaults: posture GREEN, ops_run_index 0, both bottle pools 0, version 1, and server-stamped id/created_at/updated_at."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/plants", payload: { name: "Plant EN1" }, as: PlantAdmin, captures: { plant: $.data.id, posture: $.data.compliance_posture, ops: $.data.ops_run_index, gross: $.data.bottle_gross_pool_units, san: $.data.bottle_sanitized_pool_units, ver: $.data.version } }
          assert:
            - "${posture} == GREEN"
            - "${ops} == 0"
            - "${gross} == 0 and ${san} == 0"
            - "${ver} == 1"
            - "Plant.${plant}.created_at is server-stamped ISO8601 UTC with three fractional digits"

      - name: permit_retrieval_roundtrip
        claim_type: retrieval
        grounds: [entities.WaterSourcePermit.fields.status]
        distinguishing_aspect: "GET /api/permits/{id} returns the stored permit with input fields echoed and computed aggregates initialized to 0."
        test_recipe:
          setup: ["One plant exists"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant EN2" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-EN2", source_classification: "WELL", daily_cap_gallons: 5000, monthly_cap_gallons: 100000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
          trigger:
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { num: $.data.permit_number, cls: $.data.source_classification, st: $.data.status, prov: $.data.withdrawn_month_provisional_gallons, cert: $.data.withdrawn_month_certified_gallons } }
          assert:
            - "${num} == SP-EN2"
            - "${cls} == WELL"
            - "${st} == ACTIVE"
            - "${prov} == 0 and ${cert} == 0"

      - name: withdrawal_events_listing_pagination
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "The list endpoint honors limit/offset and reports total_count and has_more: 3 events with limit=2 yield page 1 of 2 items (has_more true) and page 2 (offset=2) of 1 item (has_more false)."
        test_recipe:
          setup: ["Plant with SPRING permit (daily 10000, monthly 200000); clock at default 2026-08-01"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant EN3" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-EN3", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id, pv: $.data.version } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 1000, meter_reading_start_gallons: 0, meter_reading_end_gallons: 1000, expected_permit_version: "${pv}" }, as: SourceMonitor }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { pv2: $.data.version } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 2000, meter_reading_start_gallons: 1000, meter_reading_end_gallons: 3000, expected_permit_version: "${pv2}" }, as: SourceMonitor }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { pv3: $.data.version } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 3000, meter_reading_start_gallons: 3000, meter_reading_end_gallons: 6000, expected_permit_version: "${pv3}" }, as: SourceMonitor }
          trigger:
            - { call: "GET /api/permits/${perm}/withdrawal-events?limit=2&offset=0", as: SourceMonitor, captures: { first0: "$.data[0].id", first1: "$.data[1].id" } }
            - { call: "GET /api/permits/${perm}/withdrawal-events?limit=2&offset=2", as: SourceMonitor, captures: { second0: "$.data[0].id" } }
          assert:
            - "Page 1 returns exactly 2 items and its pagination block reports total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Page 2 returns exactly 1 item (${second0} distinct from ${first0} and ${first1}) and its pagination block reports has_more == false"

      - name: permit_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Reading a permit by a well-formed but non-existent UUID yields ERR_NOT_FOUND with http 404."
        test_recipe:
          setup: ["One plant exists (DB otherwise empty)"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant EN4" }, as: PlantAdmin, captures: { plant: $.data.id } }
          trigger:
            - { call: "GET /api/permits/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: SourceMonitor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND"
            - "http status == 404"

      - name: permit_missing_daily_cap_rejected
        claim_type: required_fields
        grounds: [entities.WaterSourcePermit.fields.daily_cap_gallons, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input field daily_cap_gallons fails input-shape validation with ERR_INVALID_REQUEST (400) before any business rule runs."
        test_recipe:
          setup: ["One plant exists"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant EN5" }, as: PlantAdmin, captures: { plant: $.data.id } }
          trigger:
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-EN5", source_classification: "SPRING", monthly_cap_gallons: 100000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "http status == 400"

      - name: permit_invalid_source_classification_rejected
        claim_type: type_constraints
        grounds: [entities.WaterSourcePermit.fields.source_classification]
        distinguishing_aspect: "An enum value outside SPRING | WELL | MUNICIPAL is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One plant exists"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant EN6" }, as: PlantAdmin, captures: { plant: $.data.id } }
          trigger:
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-EN6", source_classification: "RIVER", daily_cap_gallons: 5000, monthly_cap_gallons: 100000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: permit_cap_relation_inverted_rejected
        claim_type: type_constraints
        grounds: [entities.WaterSourcePermit.fields.monthly_cap_gallons]
        distinguishing_aspect: "monthly_cap_gallons < daily_cap_gallons violates the cross-field constraint and is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One plant exists"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant EN7" }, as: PlantAdmin, captures: { plant: $.data.id } }
          trigger:
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-EN7", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 5000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: permit_validity_window_inverted_rejected
        claim_type: type_constraints
        grounds: [entities.WaterSourcePermit.fields.valid_to]
        distinguishing_aspect: "valid_to earlier than valid_from violates the date-range constraint and is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One plant exists"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant EN8" }, as: PlantAdmin, captures: { plant: $.data.id } }
          trigger:
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-EN8", source_classification: "SPRING", daily_cap_gallons: 5000, monthly_cap_gallons: 100000, valid_from: "2026-06-01", valid_to: "2026-01-01" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: withdrawal_event_zero_gallons_rejected
        claim_type: type_constraints
        grounds: [entities.WithdrawalEvent.fields.gallons]
        distinguishing_aspect: "gallons must be > 0; a zero-gallon event is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Plant with SPRING permit"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant EN9" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-EN9", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id, pv: $.data.version } }
          trigger:
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 0, meter_reading_start_gallons: 0, meter_reading_end_gallons: 0, expected_permit_version: "${pv}" }, as: SourceMonitor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: bottle_duplicate_code_rejected
        claim_type: type_constraints
        grounds: [entities.ReturnableBottle.fields.bottle_code, "errors[ERR_BOTTLE_CODE_EXISTS]"]
        distinguishing_aspect: "bottle_code is unique per plant among non-RETIRED bottles; reusing the code fails with ERR_BOTTLE_CODE_EXISTS, while the same code on a DIFFERENT plant is accepted."
        test_recipe:
          setup: ["Two plants A and B"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant EN10A" }, as: PlantAdmin, captures: { plantA: $.data.id } }
            - { call: "POST /api/plants", payload: { name: "Plant EN10B" }, as: PlantAdmin, captures: { plantB: $.data.id } }
            - { call: "POST /api/plants/${plantA}/bottles", payload: { bottle_code: "B-DUP" }, as: SanitationLead, captures: { bA: $.data.id } }
          trigger:
            - { call: "POST /api/plants/${plantA}/bottles", payload: { bottle_code: "B-DUP" }, as: SanitationLead, captures: { err: $.data.error_id } }
            - { call: "POST /api/plants/${plantB}/bottles", payload: { bottle_code: "B-DUP" }, as: SanitationLead, captures: { bB: $.data.id } }
          assert:
            - "${err} == ERR_BOTTLE_CODE_EXISTS"
            - "Bottle.${bB}.status == SANITIZED (uniqueness is scoped to the plant)"

      - name: lot_run_cross_plant_rejected
        claim_type: parent_relationships
        grounds: ["errors[ERR_CROSS_PLANT_REFERENCE]", entities.ProductionLot.fields.treatment_run_id]
        distinguishing_aspect: "A lot created on plant A's line referencing plant B's treatment run is rejected with ERR_CROSS_PLANT_REFERENCE (referential integrity across the aggregate boundary)."
        test_recipe:
          setup:
            - "Plant A: SPRING permit + line with 1000 accepted preforms"
            - "Plant B: SPRING permit + SCHEDULED run"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant EN11A" }, as: PlantAdmin, captures: { plantA: $.data.id } }
            - { call: "POST /api/plants/${plantA}/permits", payload: { permit_number: "SP-EN11A", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { permA: $.data.id } }
            - { call: "POST /api/plants/${plantA}/bottling-lines", payload: { line_code: "LINE-A", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { lineA: $.data.id, lvA: $.data.version } }
            - { call: "POST /api/bottling-lines/${lineA}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 1000, expected_line_version: "${lvA}" }, as: ProductionLead, as_user_id: "pl-1", captures: { delA: $.data.id } }
            - { call: "POST /api/preform-deliveries/${delA}/qc-verdict", payload: { verdict: "ACCEPTED", accepted_units: 1000 }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/plants", payload: { name: "Plant EN11B" }, as: PlantAdmin, captures: { plantB: $.data.id } }
            - { call: "POST /api/plants/${plantB}/permits", payload: { permit_number: "SP-EN11B", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { permB: $.data.id } }
            - { call: "POST /api/plants/${plantB}/treatment-runs", payload: { source_permit_id: "${permB}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { runB: $.data.id } }
            - { call: "GET /api/bottling-lines/${lineA}", as: ProductionLead, captures: { lvA2: $.data.version } }
          trigger:
            - { call: "POST /api/bottling-lines/${lineA}/production-lots", payload: { treatment_run_id: "${runB}", label_classification: "SPRING", planned_units: 100, scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", expected_line_version: "${lvA2}" }, as: ProductionLead, as_user_id: "pl-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_CROSS_PLANT_REFERENCE"

      - name: preform_delivery_accepted_units_null_until_verdict
        claim_type: computed_fields
        grounds: [entities.PreformDelivery.fields.accepted_units]
        distinguishing_aspect: "accepted_units is system-set: it is null while PENDING_QC, set to the QC value on ACCEPTED, and set to 0 on REJECTED; the line ledger moves only on ACCEPTED."
        test_recipe:
          setup: ["Plant with one bottling line"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant EN12" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottling-lines", payload: { line_code: "LINE-1", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { line: $.data.id, lv: $.data.version } }
          trigger:
            - { call: "POST /api/bottling-lines/${line}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 1000, expected_line_version: "${lv}" }, as: ProductionLead, as_user_id: "pl-1", captures: { del: $.data.id, acc0: $.data.accepted_units, st0: $.data.status } }
            - { call: "POST /api/preform-deliveries/${del}/qc-verdict", payload: { verdict: "ACCEPTED", accepted_units: 600 }, as: QAOfficer, as_user_id: "qa-1", captures: { acc1: $.data.accepted_units, st1: $.data.status } }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { onhand: $.data.preform_on_hand_units } }
          assert:
            - "${st0} == PENDING_QC and ${acc0} == null"
            - "${st1} == ACCEPTED and ${acc1} == 600"
            - "${onhand} == 600 (partial acceptance books only accepted_units)"
  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: permit_suspend_reinstate_roundtrip
        claim_type: valid_transition
        grounds: [state_machines.WaterSourcePermit.ACTIVE_to_SUSPENDED, state_machines.WaterSourcePermit.SUSPENDED_to_ACTIVE]
        distinguishing_aspect: "Manual suspend sets suspension_reason MANUAL and reinstate clears it back to ACTIVE; with no overdue or failed SOURCE_RAW tests the reinstate guards pass."
        test_recipe:
          setup: ["Plant with SPRING permit"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant SM1" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-SM1", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
          trigger:
            - { call: "POST /api/permits/${perm}/suspend", as: ComplianceOfficer, captures: { st1: $.data.status, rs1: $.data.suspension_reason } }
            - { call: "POST /api/permits/${perm}/reinstate", as: ComplianceOfficer, captures: { st2: $.data.status, rs2: $.data.suspension_reason } }
          assert:
            - "${st1} == SUSPENDED and ${rs1} == MANUAL"
            - "${st2} == ACTIVE and ${rs2} == null"

      - name: permit_suspend_twice_second_rejected
        claim_type: idempotency
        grounds: [state_machines.WaterSourcePermit.ACTIVE_to_SUSPENDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Repeating the same suspend trigger against an already-SUSPENDED permit is rejected with ERR_INVALID_STATE; no side effects fire twice."
        test_recipe:
          setup: ["Plant with SPRING permit, suspended once"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant SM2" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-SM2", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/permits/${perm}/suspend", as: ComplianceOfficer }
          trigger:
            - { call: "POST /api/permits/${perm}/suspend", as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE"

      - name: permit_reinstate_blocked_after_source_fail
        claim_type: precondition_enforcement
        grounds: [state_machines.WaterSourcePermit.SUSPENDED_to_ACTIVE, "errors[ERR_REINSTATE_BLOCKED]"]
        distinguishing_aspect: "Reinstate is refused while the latest completed SOURCE_RAW test for the permit is a FAIL — the suspension that the failure caused cannot be lifted without a passing test."
        test_recipe:
          setup: ["Plant with SPRING permit; SOURCE_RAW test recorded FAIL (permit auto-suspended)"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant SM3" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-SM3", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/lab-tests", payload: { test_type: "SOURCE_RAW", subject_permit_id: "${perm}", due_date: "2026-08-05" }, as: QAOfficer, captures: { test: $.data.id } }
            - { call: "POST /api/lab-tests/${test}/record-result", payload: { result: "FAIL", collected_at: "2026-08-03T09:00:00Z" }, as: QAOfficer, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /api/permits/${perm}/reinstate", as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_REINSTATE_BLOCKED"
            - "WaterSourcePermit.${perm}.status == SUSPENDED"

      - name: permit_close_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.WaterSourcePermit.EXPIRED_to_CLOSED, state_machines.WaterSourcePermit.SUSPENDED_to_EXPIRED]
        distinguishing_aspect: "A permit past valid_to is expired by the compliance run (even from SUSPENDED), can then be closed, and from CLOSED every further transition is rejected."
        test_recipe:
          setup: ["Plant; permit with validity 2026-01-01..2026-07-31, manually suspended; clock at default 2026-08-01 (past valid_to)"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant SM4" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-SM4", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-07-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/permits/${perm}/suspend", as: ComplianceOfficer }
          trigger:
            - { call: "POST /api/plants/${plant}/compliance-runs", as: PlantAdmin, captures: { expired: $.data.permits_expired } }
            - { call: "GET /api/permits/${perm}", as: ComplianceOfficer, captures: { st1: $.data.status } }
            - { call: "POST /api/permits/${perm}/close", as: ComplianceOfficer, captures: { st2: $.data.status } }
            - { call: "POST /api/permits/${perm}/suspend", as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${expired} == 1 (SUSPENDED permits expire too)"
            - "${st1} == EXPIRED"
            - "${st2} == CLOSED"
            - "${err} == ERR_INVALID_STATE (CLOSED is terminal)"

      - name: withdrawal_event_void_of_finalized_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.WithdrawalEvent.RECORDED_to_VOIDED, "errors[ERR_EVENT_ALREADY_FINALIZED]"]
        distinguishing_aspect: "The compensating void applies only to RECORDED events; a FINALIZED event must be corrected by supersede, so plain void is rejected with ERR_EVENT_ALREADY_FINALIZED."
        test_recipe:
          setup: ["Plant with SPRING permit; one event dated 2026-08-01 finalized after clock moves to 2026-08-02"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant SM5" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-SM5", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id, pv: $.data.version } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 1000, meter_reading_start_gallons: 0, meter_reading_end_gallons: 1000, expected_permit_version: "${pv}" }, as: SourceMonitor, captures: { ev: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /api/plants/${plant}/compliance-runs", as: PlantAdmin }
          trigger:
            - { call: "POST /api/withdrawal-events/${ev}/void", as: SourceMonitor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_EVENT_ALREADY_FINALIZED"
            - "WithdrawalEvent.${ev}.status == FINALIZED"

      - name: withdrawal_event_supersede_correction_chain
        claim_type: side_effect_execution
        grounds: [state_machines.WithdrawalEvent.RECORDED_to_VOIDED, entities.WithdrawalEvent.fields.supersedes_event_id]
        distinguishing_aspect: "Superseding a RECORDED event voids the target and books the replacement in one request: the old event is VOIDED, the new event is RECORDED with 5500 gallons, the provisional month reads 5500 (not 10500), and the reverse lookup by supersedes_event_id finds the replacement."
        test_recipe:
          setup: ["Plant with SPRING permit; one RECORDED event of 5000 gallons on 2026-08-01"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant SM6" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-SM6", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id, pv: $.data.version } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 5000, meter_reading_start_gallons: 0, meter_reading_end_gallons: 5000, expected_permit_version: "${pv}" }, as: SourceMonitor, captures: { ev: $.data.id } }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { pv2: $.data.version } }
          trigger:
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 5500, meter_reading_start_gallons: 5000, meter_reading_end_gallons: 10500, expected_permit_version: "${pv2}", supersedes_event_id: "${ev}" }, as: SourceMonitor, captures: { ev2: $.data.id, ev2_status: $.data.status } }
            - { call: "GET /api/withdrawal-events/${ev}", as: SourceMonitor, captures: { ev1_status: $.data.status } }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { prov: $.data.withdrawn_month_provisional_gallons } }
            - { call: "GET /api/withdrawal-events?supersedes_event_id=${ev}", as: SourceMonitor, captures: { repl: "$.data[0].id" } }
          assert:
            - "${ev1_status} == VOIDED"
            - "${ev2_status} == RECORDED"
            - "${prov} == 5500 (the superseded target is excluded from the same-request cap check and from all sums)"
            - "${repl} == ${ev2}"

      - name: supersede_finalized_blocked_by_published_report
        claim_type: precondition_enforcement
        grounds: [state_machines.WithdrawalEvent.FINALIZED_to_VOIDED, "errors[ERR_REPORT_PERIOD_LOCKED]"]
        distinguishing_aspect: "Once a PUBLISHED community report covers the event's (plant, year-month), superseding a FINALIZED event in that period is locked with ERR_REPORT_PERIOD_LOCKED."
        test_recipe:
          setup: ["Plant with SPRING permit; event 2026-08-01 (4000 gal) FINALIZED after clock moves to 2026-08-02; report (2026, 8) created and PUBLISHED"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant SM7" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-SM7", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id, pv: $.data.version } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 4000, meter_reading_start_gallons: 0, meter_reading_end_gallons: 4000, expected_permit_version: "${pv}" }, as: SourceMonitor, captures: { ev: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /api/plants/${plant}/compliance-runs", as: PlantAdmin }
            - { call: "POST /api/plants/${plant}/community-reports", payload: { period_year: 2026, period_month: 8 }, as: ComplianceOfficer, captures: { rep: $.data.id } }
            - { call: "POST /api/community-reports/${rep}/publish", as: ComplianceOfficer }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { pv2: $.data.version } }
          trigger:
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 4500, meter_reading_start_gallons: 4000, meter_reading_end_gallons: 8500, expected_permit_version: "${pv2}", supersedes_event_id: "${ev}" }, as: SourceMonitor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_REPORT_PERIOD_LOCKED"

      - name: report_supersede_unlocks_period_correction
        claim_type: side_effect_execution
        grounds: [state_machines.CommunityWaterReport.PUBLISHED_to_SUPERSEDED, state_machines.WithdrawalEvent.FINALIZED_to_VOIDED, entities.CommunityWaterReport.fields.addendum_of_report_id]
        distinguishing_aspect: "The full correction saga: superseding the PUBLISHED report releases the period lock (old -> SUPERSEDED, successor DRAFT with addendum_of_report_id set), after which the FINALIZED event can be superseded, refinalized by a compliance run, and the successor publishes with the corrected total 4500 gallons."
        test_recipe:
          setup: ["Same as the period-locked corner: PUBLISHED report for (2026, 8) over one FINALIZED 4000-gallon event; clock 2026-08-02"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant SM8" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-SM8", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id, pv: $.data.version } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 4000, meter_reading_start_gallons: 0, meter_reading_end_gallons: 4000, expected_permit_version: "${pv}" }, as: SourceMonitor, captures: { ev: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /api/plants/${plant}/compliance-runs", as: PlantAdmin }
            - { call: "POST /api/plants/${plant}/community-reports", payload: { period_year: 2026, period_month: 8 }, as: ComplianceOfficer, captures: { rep: $.data.id } }
            - { call: "POST /api/community-reports/${rep}/publish", as: ComplianceOfficer }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { pv2: $.data.version } }
          trigger:
            - { call: "POST /api/community-reports/${rep}/supersede", as: ComplianceOfficer, captures: { rep2: $.data.id, rep2_status: $.data.status, rep2_add: $.data.addendum_of_report_id } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 4500, meter_reading_start_gallons: 4000, meter_reading_end_gallons: 8500, expected_permit_version: "${pv2}", supersedes_event_id: "${ev}" }, as: SourceMonitor, captures: { ev2: $.data.id } }
            - { call: "POST /api/plants/${plant}/compliance-runs", as: PlantAdmin, captures: { fin: $.data.events_finalized } }
            - { call: "POST /api/community-reports/${rep2}/publish", as: ComplianceOfficer, captures: { rep2_pub: $.data.status, rep2_gal: $.data.total_withdrawn_gallons } }
            - { call: "GET /api/community-reports/${rep}", as: ComplianceOfficer, captures: { rep1_status: $.data.status } }
          assert:
            - "${rep2_status} == DRAFT and ${rep2_add} == ${rep}"
            - "${fin} == 1 (the superseding 4500-gallon event finalized; the 4000-gallon original was already VOIDED and is never counted again)"
            - "${rep2_pub} == PUBLISHED and ${rep2_gal} == 4500"
            - "${rep1_status} == SUPERSEDED"

      - name: treatment_run_validated_terminal_rejects_start_and_reprocess
        claim_type: invalid_transition
        grounds: [state_machines.TreatmentRun.SCHEDULED_to_IN_PROGRESS, state_machines.TreatmentRun.FAILED_to_REPROCESSING]
        distinguishing_aspect: "VALIDATED is terminal: both start and reprocess against a VALIDATED run are rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Plant with SPRING permit; run validated to VALIDATED"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant SM9" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-SM9", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { run: $.data.id } }
            - { call: "POST /api/treatment-runs/${run}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${run}/record-parameters", payload: { uv_dose_mj_cm2: 40.0, ozone_ct_mg_min_l: 1.6, turbidity_ntu: 0.3, micro_pore_micron: 0.2 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${run}/validate", as: QAOfficer, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /api/treatment-runs/${run}/start", as: ProductionLead, as_user_id: "pl-1", captures: { err1: $.data.error_id } }
            - { call: "POST /api/treatment-runs/${run}/reprocess", as: ProductionLead, as_user_id: "pl-1", captures: { err2: $.data.error_id } }
          assert:
            - "${err1} == ERR_INVALID_STATE"
            - "${err2} == ERR_INVALID_STATE"

      - name: treatment_run_reprocess_cycle_second_round_validates
        claim_type: valid_transition
        grounds: [state_machines.TreatmentRun.FAILED_to_REPROCESSING, state_machines.TreatmentRun.REPROCESSING_to_IN_PROGRESS, entities.TreatmentRun.fields.validation_round]
        distinguishing_aspect: "The FAILED -> REPROCESSING -> IN_PROGRESS -> VALIDATED cycle works, and validation_round counts both validate attempts (2), proving the loop rather than a fresh run."
        test_recipe:
          setup: ["Plant with SPRING permit; run started with failing parameters (uv 30.0) and validated FAIL by qa-1"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant SM10" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-SM10", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { run: $.data.id } }
            - { call: "POST /api/treatment-runs/${run}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${run}/record-parameters", payload: { uv_dose_mj_cm2: 30.0, ozone_ct_mg_min_l: 1.6, turbidity_ntu: 0.3, micro_pore_micron: 0.2 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${run}/validate", as: QAOfficer, as_user_id: "qa-1", captures: { st1: $.data.status, rd1: $.data.validation_round } }
          trigger:
            - { call: "POST /api/treatment-runs/${run}/reprocess", as: ProductionLead, as_user_id: "pl-1", captures: { st2: $.data.status } }
            - { call: "POST /api/treatment-runs/${run}/start", as: ProductionLead, as_user_id: "pl-1", captures: { st3: $.data.status } }
            - { call: "POST /api/treatment-runs/${run}/record-parameters", payload: { uv_dose_mj_cm2: 42.0, ozone_ct_mg_min_l: 1.6, turbidity_ntu: 0.3, micro_pore_micron: 0.2 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${run}/validate", as: QAOfficer, as_user_id: "qa-1", captures: { st4: $.data.status, rd2: $.data.validation_round } }
          assert:
            - "${st1} == FAILED and ${rd1} == 1"
            - "${st2} == REPROCESSING"
            - "${st3} == IN_PROGRESS"
            - "${st4} == VALIDATED and ${rd2} == 2"

      - name: treatment_run_start_on_suspended_permit_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.TreatmentRun.REPROCESSING_to_IN_PROGRESS, "errors[ERR_PERMIT_NOT_ACTIVE]"]
        distinguishing_aspect: "The permit-state guard on run start is reachable only from REPROCESSING (suspension auto-cancels SCHEDULED runs but leaves FAILED ones): with the permit SUSPENDED, a reprocessed run's start is rejected ERR_PERMIT_NOT_ACTIVE, and after reinstate the same start succeeds."
        test_recipe:
          setup: ["Plant with SPRING permit; run driven to FAILED (uv 30.0), permit then suspended (the cascade cancels only SCHEDULED runs, so the FAILED run survives)"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant SM11" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-SM11", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { run: $.data.id } }
            - { call: "POST /api/treatment-runs/${run}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${run}/record-parameters", payload: { uv_dose_mj_cm2: 30.0, ozone_ct_mg_min_l: 1.6, turbidity_ntu: 0.3, micro_pore_micron: 0.2 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${run}/validate", as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/permits/${perm}/suspend", as: ComplianceOfficer }
            - { call: "POST /api/treatment-runs/${run}/reprocess", as: ProductionLead, as_user_id: "pl-1", captures: { st0: $.data.status } }
          trigger:
            - { call: "POST /api/treatment-runs/${run}/start", as: ProductionLead, as_user_id: "pl-1", captures: { err: $.data.error_id } }
            - { call: "POST /api/permits/${perm}/reinstate", as: ComplianceOfficer }
            - { call: "POST /api/treatment-runs/${run}/start", as: ProductionLead, as_user_id: "pl-1", captures: { st1: $.data.status } }
          assert:
            - "${st0} == REPROCESSING"
            - "${err} == ERR_PERMIT_NOT_ACTIVE (run in a valid from-state; the permit guard fires)"
            - "${st1} == IN_PROGRESS"

      - name: lab_test_due_window_flip
        claim_type: valid_transition
        grounds: [state_machines.LabTest.SCHEDULED_to_DUE, calculations.testing_due_schedule]
        distinguishing_aspect: "A SOURCE_RAW test due 2026-08-05 flips SCHEDULED -> DUE when the clock reaches 2026-08-03 (due within 3 days, inclusive), while a test due 2026-08-10 stays SCHEDULED through the same run — the 3-day lead window is exact."
        test_recipe:
          setup: ["Plant with SPRING permit; SOURCE_RAW tests T1 due 2026-08-05 and T2 due 2026-08-10; clock moved to 2026-08-03"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant SM12" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-SM12", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/lab-tests", payload: { test_type: "SOURCE_RAW", subject_permit_id: "${perm}", due_date: "2026-08-05" }, as: QAOfficer, captures: { t1: $.data.id } }
            - { call: "POST /api/plants/${plant}/lab-tests", payload: { test_type: "SOURCE_RAW", subject_permit_id: "${perm}", due_date: "2026-08-10" }, as: QAOfficer, captures: { t2: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlantAdmin }
          trigger:
            - { call: "POST /api/plants/${plant}/compliance-runs", as: PlantAdmin, captures: { flipped: $.data.tests_flipped } }
            - { call: "GET /api/lab-tests/${t1}", as: QAOfficer, captures: { s1: $.data.status } }
            - { call: "GET /api/lab-tests/${t2}", as: QAOfficer, captures: { s2: $.data.status } }
          assert:
            - "${s1} == DUE"
            - "${s2} == SCHEDULED"
            - "${flipped} == 1"

      - name: lab_test_overdue_grace_boundary_suspends_at_eight_days
        claim_type: side_effect_execution
        grounds: [state_machines.LabTest.DUE_to_OVERDUE, state_machines.WaterSourcePermit.ACTIVE_to_SUSPENDED, calculations.plant_compliance_posture]
        distinguishing_aspect: "The 7-day suspension grace is exact: with a SOURCE_RAW test due 2026-08-01, a compliance run at 2026-08-08 (7 days overdue) flips the test OVERDUE and the posture to BREACH but leaves the permit ACTIVE; a run at 2026-08-09 (8 days overdue) suspends it with reason TEST_OVERDUE."
        test_recipe:
          setup: ["Plant with SPRING permit; SOURCE_RAW test due 2026-08-01; clock moved to 2026-08-08"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant SM13" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-SM13", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/lab-tests", payload: { test_type: "SOURCE_RAW", subject_permit_id: "${perm}", due_date: "2026-08-01" }, as: QAOfficer, captures: { t: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: PlantAdmin }
          trigger:
            - { call: "POST /api/plants/${plant}/compliance-runs", as: PlantAdmin, captures: { susp1: $.data.permits_suspended, posture1: $.data.posture } }
            - { call: "GET /api/permits/${perm}", as: ComplianceOfficer, captures: { p1: $.data.status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /api/plants/${plant}/compliance-runs", as: PlantAdmin, captures: { susp2: $.data.permits_suspended } }
            - { call: "GET /api/permits/${perm}", as: ComplianceOfficer, captures: { p2: $.data.status, r2: $.data.suspension_reason } }
            - { call: "GET /api/lab-tests/${t}", as: QAOfficer, captures: { ts: $.data.status } }
          assert:
            - "${susp1} == 0 (7 days overdue is not more than 7)"
            - "${p1} == ACTIVE"
            - "${posture1} == BREACH (an OVERDUE SOURCE_RAW test alone already forces BREACH)"
            - "${susp2} == 1 (8 days overdue crosses the grace)"
            - "${p2} == SUSPENDED and ${r2} == TEST_OVERDUE"
            - "${ts} == OVERDUE"

      - name: lot_complete_overproduction_boundary
        claim_type: precondition_enforcement
        grounds: [state_machines.ProductionLot.IN_PRODUCTION_to_QA_HOLD, "errors[ERR_OVERPRODUCTION]"]
        distinguishing_aspect: "produced_units == planned_units completes the lot; produced_units == planned_units + 1 is rejected with ERR_OVERPRODUCTION (422) and the lot stays IN_PRODUCTION for a valid retry."
        test_recipe:
          setup: ["Plant with SPRING permit, line (1000 preforms accepted), SCHEDULED run, lot PLANNED with planned_units 500 and started"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant SM14" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-SM14", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottling-lines", payload: { line_code: "LINE-1", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { line: $.data.id, lv: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 1000, expected_line_version: "${lv}" }, as: ProductionLead, as_user_id: "pl-1", captures: { del: $.data.id } }
            - { call: "POST /api/preform-deliveries/${del}/qc-verdict", payload: { verdict: "ACCEPTED", accepted_units: 1000 }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { run: $.data.id } }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { lv2: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/production-lots", payload: { treatment_run_id: "${run}", label_classification: "SPRING", planned_units: 500, scheduled_start: "2026-08-04T08:00:00Z", scheduled_end: "2026-08-04T12:00:00Z", expected_line_version: "${lv2}" }, as: ProductionLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "POST /api/production-lots/${lot}/start", as: ProductionLead, as_user_id: "pl-1" }
          trigger:
            - { call: "POST /api/production-lots/${lot}/complete", payload: { produced_units: 501 }, as: ProductionLead, as_user_id: "pl-1", captures: { err: $.data.error_id } }
            - { call: "POST /api/production-lots/${lot}/complete", payload: { produced_units: 500 }, as: ProductionLead, as_user_id: "pl-1", captures: { st: $.data.status, pu: $.data.produced_units } }
          assert:
            - "${err} == ERR_OVERPRODUCTION"
            - "${st} == QA_HOLD and ${pu} == 500 (retry at exactly planned_units succeeds after the 422)"

      - name: lot_start_blocked_in_breach_posture
        claim_type: precondition_enforcement
        grounds: [state_machines.ProductionLot.PLANNED_to_IN_PRODUCTION, "errors[ERR_POSTURE_BREACH]", calculations.plant_compliance_posture]
        distinguishing_aspect: "The plant posture gates lot start: with a second permit suspended (posture BREACH) a PLANNED lot on a healthy permit's run cannot start (ERR_POSTURE_BREACH); after reinstate lifts the posture to GREEN the same start succeeds."
        test_recipe:
          setup: ["Plant with SPRING permits A (suspended) and B (active); VALIDATED run on B; PLANNED lot on B's run"]
