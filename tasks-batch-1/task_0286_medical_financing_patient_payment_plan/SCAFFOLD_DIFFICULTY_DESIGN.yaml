            - "PatientAccount.${acctx_id}.current_balance_cents == 0 and available_credit_cents == 500000"
            - "PatientAccount.${acctx_id}.status == ACTIVE and delinquency_strikes == 0"

      - name: promo_expiry_depth2_purchase_forfeit_account_balance
        grounds:
          - state_machines.FinancedPurchase.DEFERRED_to_INTEREST_FORFEITED
