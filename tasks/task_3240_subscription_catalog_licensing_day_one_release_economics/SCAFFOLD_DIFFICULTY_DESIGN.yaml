# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 3240 — Subscription Catalog Licensing & Day-One Release Economics
# 18 instances: every §0.5 rule with ≥ 2 instances. All chains drive empty-DB
# state through §1.5 endpoints only; every ${var} is bound by an earlier
# captures: block in the same instance. Anchors (&c_may, &r_na, …) are the
# shared organization prefix — they are plain YAML aliases, expanded inline by
# any YAML loader, so each instance's call list is self-contained once loaded.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      # ---------------------------------------------------------------- 1 of 2
      - name: day_one_cannibalization_provisional_vs_chronological
        grounds:
          - calculations.day_one_cannibalization
          - calculations.day_one_subscription_value
          - entities.AvailabilityProjection.fields.projected_cannibalized_unit_sales_cents
          - endpoints.POST_/catalog/availability-projections/{projection_id}/finalize
        distinguishing_aspect: |
          Two valid algorithms over the same projection produce different cannibalized
          figures on a DIFFERENT entity domain from the licensing-compensation pair:
          the forward-looking variant over AvailabilityProjection projects 500 units at
          the 8400.00 regional list price (1260000.00), while the chronological variant
          over actual Purchase rows accumulates only the 25200.00 actually charged (7560.00).
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z. NA region at multiplier 1.20, PREMIUM tier, publisher Nova Interactive, title Crimson Drift (list 7000.00, unit_sales_30d 25000, day-one eligible), a HYBRID deal LIVE for the title, and one published CATALOG_ADD entry in NA."
            - "AvailabilityProjection DRAFT with launch_subscriber_count 1000, tier_step_count 2, projected_unit_sales_units 500, release_class DAY_ONE, projected_cannibalized_unit_sales_cents 1260000.00."
            - "Three COMPLETED purchases of 8400.00 each against the same title and region, so the accumulator is 25200.00."
          setup_api_calls:
            - &c_may
              call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-05-25T00:00:00Z" }
              as: CatalogAdmin
            - &r_na
              call: "POST /catalog/regions"
              payload: { region_code: "NA", currency_code: "USD", price_multiplier: 1.20, availability_ceiling_titles: 4000, catalog_tier_floor: "ESSENTIAL" }
              as: CatalogAdmin
            - &t_prem
              call: "POST /catalog/tiers"
              payload: { tier_code: "PREMIUM", monthly_price_cents: 1799, console_access: true, pc_access: true, cloud_access: true, online_play_bundle: true, member_discount_pct: 0.075, discount_retention_days: 30, annual_prepay_credit_ratio: 0.25 }
              as: CatalogAdmin
            - &t_ess
              call: "POST /catalog/tiers"
              payload: { tier_code: "ESSENTIAL", monthly_price_cents: 999, console_access: true, pc_access: false, cloud_access: false, online_play_bundle: false, member_discount_pct: 0.0, discount_retention_days: 0, annual_prepay_credit_ratio: 0.25 }
              as: CatalogAdmin
            - &p_nova
              call: "POST /catalog/publishers"
              payload: { name: "Nova Interactive", home_region_code: "NA" }
              as: CatalogAdmin
              captures: { pub_id: $.data.id }
            - &ti_crimson
              call: "POST /catalog/titles"
              payload: { publisher_id: "${pub_id}", name: "Crimson Drift", platform_set: ["CONSOLE", "PC", "CLOUD"], day_one_eligible: true, list_price_cents: 7000, unit_sales_30d: 25000 }
              as: CatalogAdmin
              captures: { title_id: $.data.id, title_v: $.data.version }
            - &d_hybrid
              call: "POST /catalog/licensing-deals"
              payload: { publisher_id: "${pub_id}", title_id: "${title_id}", compensation_model: "HYBRID", guaranteed_compensation_cents: 150000, monthly_engagement_cap_cents: 300000, engagement_rate_cents_per_hour: 251, term_start_date: "2026-06-01T00:00:00Z", term_end_date: "2026-12-01T00:00:00Z", add_effective_date: "2026-06-05T00:00:00Z" }
              as: CatalogAdmin
              captures: { deal_id: $.data.id }
            - &sign_deal
              call: "POST /catalog/licensing-deals/${deal_id}/sign"
              payload: { expected_title_version: "${title_v}" }
              as: CatalogAdmin
            - &c_jun
              call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-06-02T00:00:00Z" }
              as: CatalogAdmin
            - &e_na_ca
              call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "NA", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-08-31T00:00:00Z", release_class: "CATALOG_ADD", popularity_index_cents: 6000, popularity_index_cents_30d_avg: 3000 }
              as: CatalogAdmin
              captures: { entry_id: $.data.id }
            - &pub_na_ca
              call: "POST /catalog/catalog-entries/${entry_id}/publish"
              payload: {}
              as: CatalogAdmin
            - &s_base
              call: "POST /catalog/subscribers"
              payload: { email: "mira@example.com", display_name: "Mira", home_region_code: "NA", wallet_credit_cents: 0 }
              as: Anonymous
              captures: { subr_id: $.data.id }
            - call: "POST /catalog/subscriptions"
              payload: { subscriber_id: "${subr_id}", tier_code: "PREMIUM", billing_period: "MONTHLY" }
              as: CatalogAdmin
              captures: { subscription_id: $.data.id }
            - call: "POST /catalog/subscriptions/${subscription_id}/pay"
              payload: {}
              as: Subscriber
              as_user_id: "${subr_id}"
            - call: "POST /catalog/availability-projections"
              payload: { title_id: "${title_id}", region_code: "NA", launch_subscriber_count: 1000, tier_step_count: 2, projected_unit_sales_units: 500, release_class: "DAY_ONE" }
              as: CatalogAnalyst
              captures: { proj_id: $.data.id, proj_cann_provisional: $.data.projected_cannibalized_unit_sales_cents }
            - call: "POST /catalog/purchases"
              payload: { subscriber_id: "${subr_id}", title_id: "${title_id}", entry_id: "${entry_id}", region_code: "NA", quantity: 1 }
              as: Subscriber
              as_user_id: "${subr_id}"
            - call: "POST /catalog/purchases"
              payload: { subscriber_id: "${subr_id}", title_id: "${title_id}", entry_id: "${entry_id}", region_code: "NA", quantity: 1 }
              as: Subscriber
              as_user_id: "${subr_id}"
            - call: "POST /catalog/purchases"
              payload: { subscriber_id: "${subr_id}", title_id: "${title_id}", entry_id: "${entry_id}", region_code: "NA", quantity: 1 }
              as: Subscriber
              as_user_id: "${subr_id}"
          trigger:
            - call: "POST /catalog/availability-projections/${proj_id}/finalize"
              payload: {}
              as: CatalogAnalyst
              captures: { proj_cann_final: $.data.projected_cannibalized_unit_sales_cents, proj_net_final: $.data.projected_net_value_cents }
          assert:
            - "the pre-finalize read of the same projection reports projected_cannibalized_unit_sales_cents == 1260000.00 (provisional forward-looking variant)"
            - "after finalize, projected_cannibalized_unit_sales_cents == 7560.00 (chronological variant over the 25200.00 charged)"
            - "the two variants differ by exactly 1252440.00 on identical catalog data"
            - "Purchase rows report total_charged_cents == 8400.00 each, so the accumulator is 25200.00"
            - "projected_net_value_cents == 1252440.00 and decision == APPROVE_DAY_ONE"

      # ---------------------------------------------------------------- 2 of 2
      - name: licensing_compensation_term_share_vs_monthly_share
        grounds:
          - calculations.licensing_compensation
          - entities.LicensingDeal.fields.payable_compensation_cents
          - entities.LicensingDeal.fields.compensation_floor_cents
          - endpoints.GET_/catalog/licensing-deals/{deal_id}
        distinguishing_aspect: |
          Two valid compensation algorithms over the same LIVE LicensingDeal (a different
          entity domain from the projection pair) disagree by exactly one cent: applying
          the 0.25 hybrid share once to the summed capped engagement component yields
          1235132.75, while applying and rounding it per month yields 1235132.76.
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z, then advanced to 2026-08-01T00:00:00Z so both June and July are closed."
            - "NA region, PREMIUM tier, publisher, title and a HYBRID deal LIVE with monthly_fixed_fee_cents 200000, guaranteed_compensation_cents 150000, monthly_engagement_cap_cents 300000 and engagement_rate_cents_per_hour 250.5 over a six-month term."
            - "One PREMIUM subscription paid in full, carrying one 401.0000-hour June event and one 160.0000-hour July event, so both monthly components are below the cap."
          setup_api_calls:
            - *c_may
            - *r_na
            - *t_prem
            - *t_ess
            - *p_nova
            - *ti_crimson
            - call: "POST /catalog/licensing-deals"
              payload: { publisher_id: "${pub_id}", title_id: "${title_id}", compensation_model: "HYBRID", monthly_fixed_fee_cents: 200000, guaranteed_compensation_cents: 150000, monthly_engagement_cap_cents: 300000, engagement_rate_cents_per_hour: 250.5, term_start_date: "2026-06-01T00:00:00Z", term_end_date: "2026-12-01T00:00:00Z", add_effective_date: "2026-06-05T00:00:00Z" }
              as: CatalogAdmin
              captures: { deal2_id: $.data.id }
            - call: "POST /catalog/licensing-deals/${deal2_id}/sign"
              payload: { expected_title_version: "${title_v}" }
              as: CatalogAdmin
            - *c_jun
            - *s_base
            - call: "POST /catalog/subscriptions"
              payload: { subscriber_id: "${subr_id}", tier_code: "PREMIUM", billing_period: "MONTHLY" }
              as: CatalogAdmin
              captures: { subscription_id: $.data.id }
            - call: "POST /catalog/subscriptions/${subscription_id}/pay"
              payload: {}
              as: Subscriber
              as_user_id: "${subr_id}"
            - call: "POST /catalog/subscriptions/${subscription_id}/engagement-events"
              payload: { title_id: "${title_id}", session_hours: 200.5, channel: "CONSOLE", engagement_multiplier: 2.0 }
              as: Subscriber
              as_user_id: "${subr_id}"
              captures: { event_june_id: $.data.id }
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-07-05T00:00:00Z" }
              as: CatalogAdmin
            - call: "POST /catalog/subscriptions/${subscription_id}/engagement-events"
              payload: { title_id: "${title_id}", session_hours: 80.0, channel: "PC", engagement_multiplier: 2.0 }
              as: Subscriber
              as_user_id: "${subr_id}"
              captures: { event_july_id: $.data.id }
          trigger:
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CatalogAdmin
            - call: "GET /catalog/licensing-deals/${deal2_id}"
              payload: {}
              as: CatalogAdmin
              captures: { payable_base: $.data.payable_compensation_cents }
            - call: "GET /catalog/licensing-deals/${deal2_id}"
              payload: { compensation_view: "STATEMENT" }
              as: CatalogAdmin
              captures: { payable_statement: $.data.payable_compensation_cents }
          assert:
            - "EngagementEvent.${event_june_id}.normalized_hours == 401.0000 and EngagementEvent.${event_july_id}.normalized_hours == 160.0000"
            - "the June component is 401.0000 * 250.5 == 100450.50 and the July component is 160.0000 * 250.5 == 40080.50, both below the 300000 monthly cap"
            - "payable_base == 1235132.75 (fixed 1200000.00 + round_half_up((100450.50 + 40080.50) * 0.25, 2))"
            - "payable_statement == 1235132.76 (fixed 1200000.00 + 25112.63 + 10020.13, the per-month share rounded before summing)"
            - "payable_base != payable_statement, and the difference is exactly 0.01"
            - "compensation_floor_cents == 900000.00, which both variants exceed, so the floor branch is not taken"

  - rule_id: combinatorial_formula
    instances:

      # ---------------------------------------------------------------- 1 of 2
      - name: day_one_decision_ladder_at_the_zero_boundary
        grounds:
          - calculations.day_one_subscription_value
          - calculations.day_one_cannibalization
          - entities.AvailabilityProjection.fields.decision
          - validations[priority=7]
        distinguishing_aspect: |
          Mode (a): a five-input formula with nested min/max (engagement cap over the term,
          tier-uplift cap) and a three-branch decision ladder evaluated in pinned order; at
          projected_net_value_cents exactly 0.00 the first branch matches and the release is
          APPROVE_DAY_ONE, while one unit more of projected sales drops it to HOLD_FOR_CATALOG.
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z. NA region at multiplier 1.20, PREMIUM tier, publisher, day-one-eligible title (list 7000.00, unit_sales_30d 25000), HYBRID deal LIVE with rate 251 and monthly cap 300000 over six months, one published CATALOG_ADD entry."
          setup_api_calls:
            - *c_may
            - *r_na
            - *t_prem
            - *t_ess
            - *p_nova
            - *ti_crimson
            - *d_hybrid
            - *sign_deal
            - *c_jun
            - *e_na_ca
            - *pub_na_ca
          trigger:
            - call: "POST /catalog/availability-projections"
              payload: { title_id: "${title_id}", region_code: "NA", launch_subscriber_count: 1000, tier_step_count: 2, projected_unit_sales_units: 500, release_class: "DAY_ONE" }
              as: CatalogAnalyst
              captures: { proj_at_boundary: $.data.id, proj_sub_value: $.data.projected_subscription_value_cents, proj_cann: $.data.projected_cannibalized_unit_sales_cents, proj_net: $.data.projected_net_value_cents, proj_decision: $.data.decision, proj_boundary_status: $.data.status }
            - call: "POST /catalog/availability-projections"
              payload: { title_id: "${title_id}", region_code: "NA", launch_subscriber_count: 1000, tier_step_count: 2, projected_unit_sales_units: 501, release_class: "DAY_ONE" }
              as: CatalogAnalyst
              captures: { proj_over_id: $.data.id, proj_over_net: $.data.projected_net_value_cents, proj_over_decision: $.data.decision }
          assert:
            - "the six-month engagement cap term is 300000 * 6 == 1800000, and the theoretical gross 25000 * 1.25 * 1000 * 251 == 7843750000 exceeds it, so capped_engagement_cents == 1800000"
            - "proj_sub_value == 1260000.00 (net_new 1080000.00 plus tier uplift 180000.00, itself below the 250000 cap)"
            - "proj_cann == 1260000.00 (500 * 8400.00 regional list * 0.30)"
            - "proj_net == 0.00 and proj_decision == APPROVE_DAY_ONE — the >= 0 branch matches exactly at the boundary"
            - "proj_over_net == -2520.00 and proj_over_decision == HOLD_FOR_CATALOG — 501 units is past the boundary"
            - "HOLD_FOR_CATALOG is reached because -2520.00 >= -50000, not because the first branch was skipped for an ineligible title (Title.day_one_eligible is true)"
            - "proj_boundary_status == DRAFT"

      # ---------------------------------------------------------------- 2 of 2
      - name: member_purchase_discount_rounding_order
        grounds:
          - calculations.member_purchase_discount
          - entities.Purchase.fields.total_charged_cents
          - entities.Purchase.fields.discount_pct_applied
          - endpoints.POST_/catalog/purchases
        distinguishing_aspect: |
          Mode (b): nested rounding where the order is pinned and observable — on a title
          whose regional list price is 8393.00 and whose retention discount is 0.125,
          rounding the discount first gives 7343.87 while rounding the final total in one
          step gives 7343.88.
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z. Region NA at price_multiplier 1.199 (so the 7000.00 title list price yields exactly 8393.00), PREMIUM tier with member_discount_pct 0.075, a publisher and title, a HYBRID deal LIVE, and one published BACK_CATALOG entry so the 0.05 retention bonus applies."
          setup_api_calls:
            - *c_may
            - call: "POST /catalog/regions"
              payload: { region_code: "NA", currency_code: "USD", price_multiplier: 1.199, availability_ceiling_titles: 4000, catalog_tier_floor: "ESSENTIAL" }
              as: CatalogAdmin
            - *t_prem
            - *t_ess
            - *p_nova
            - *ti_crimson
            - *d_hybrid
            - *sign_deal
            - *c_jun
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "NA", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-09-30T00:00:00Z", release_class: "BACK_CATALOG", popularity_index_cents: 4000, popularity_index_cents_30d_avg: 4000 }
              as: CatalogAdmin
              captures: { entry_backcat_id: $.data.id }
            - call: "POST /catalog/catalog-entries/${entry_backcat_id}/publish"
              payload: {}
              as: CatalogAdmin
            - *s_base
            - call: "POST /catalog/subscriptions"
              payload: { subscriber_id: "${subr_id}", tier_code: "PREMIUM", billing_period: "MONTHLY" }
              as: CatalogAdmin
              captures: { subscription_id: $.data.id }
            - call: "POST /catalog/subscriptions/${subscription_id}/pay"
              payload: {}
              as: Subscriber
              as_user_id: "${subr_id}"
          trigger:
            - call: "POST /catalog/purchases"
              payload: { subscriber_id: "${subr_id}", title_id: "${title_id}", entry_id: "${entry_backcat_id}", region_code: "NA", quantity: 1 }
              as: Subscriber
              as_user_id: "${subr_id}"
              captures: { purchase_id: $.data.id, purchase_total: $.data.total_charged_cents, purchase_list: $.data.list_price_cents_per_unit, purchase_disc_pct: $.data.discount_pct_applied, purchase_credit: $.data.unit_sales_credit_cents }
            - call: "GET /catalog/purchases"
              payload: { subscriber_id: "${subr_id}", limit: 10, offset: 0 }
              as: CatalogAdmin
          assert:
            - "purchase_list == 8393.00 (7000 * 1.199 rounded to the cent)"
            - "purchase_disc_pct == 0.13 (member_discount_pct 0.075 + the 0.05 BACK_CATALOG retention bonus, under the 0.40 cap)"
            - "purchase_total == 7343.87 — the pinned order rounds the 1049.13 discount first and subtracts it second"
            - "rounding the final total in one step instead would give round_half_up(8393.00 * 0.875, 2) == 7343.88, one cent higher"
            - "purchase_credit == 7343.87 (quantity 1)"
            - "the listed purchase row read back through GET /catalog/purchases carries the same total_charged_cents, so the discount is not recomputed on read"

  - rule_id: non_linear_state_machine
    instances:

      # ---------------------------------------------------------------- 1 of 2
      - name: catalog_entry_rotation_revert_and_terminate
        grounds:
          - state_machines.CatalogEntry
          - state_machines.CatalogEntry.ADDED_to_REMOVING
          - state_machines.CatalogEntry.REMOVING_to_ADDED
          - endpoints.POST_/catalog/catalog-entries/{entry_id}/cancel-removal
        distinguishing_aspect: |
          CatalogEntry is a genuinely cyclic machine on a different entity from the
          subscription pair: ADDED -> REMOVING -> ADDED is a legitimate loop through
          POST /cancel-removal, and only the second traversal into REMOVING may be
          terminated by POST /retire.
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z. NA region, PREMIUM tier, publisher, title, HYBRID deal LIVE, one published CATALOG_ADD entry with removal_date 2026-08-31."
          setup_api_calls:
            - *c_may
            - *r_na
            - *t_prem
            - *t_ess
            - *p_nova
            - *ti_crimson
            - *d_hybrid
            - *sign_deal
            - *c_jun
            - *e_na_ca
            - *pub_na_ca
          trigger:
            - call: "GET /catalog/catalog-entries/${entry_id}"
              payload: {}
              as: CatalogAdmin
              captures: { entry_state_after_publish: $.data.status }
            - call: "POST /catalog/catalog-entries/${entry_id}/announce-removal"
              payload: {}
              as: CatalogAdmin
              captures: { entry_state_first_removing: $.data.status, entry_notice_days: $.data.removal_notice_days }
            - call: "POST /catalog/catalog-entries/${entry_id}/cancel-removal"
              payload: {}
              as: CatalogAdmin
              captures: { entry_state_reverted: $.data.status }
            - call: "POST /catalog/catalog-entries/${entry_id}/announce-removal"
              payload: {}
              as: CatalogAdmin
              captures: { entry_state_second_removing: $.data.status }
            - call: "POST /catalog/catalog-entries/${entry_id}/retire"
              payload: {}
              as: CatalogAdmin
              captures: { entry_state_terminated: $.data.status }
          assert:
            - "entry_state_after_publish == ADDED and entry_state_first_removing == REMOVING"
            - "entry_state_reverted == ADDED — the loop back to ADDED is accepted while the clock is before 2026-08-28"
            - "entry_state_second_removing == REMOVING"
            - "entry_state_terminated == DELISTED, so the second REMOVING is terminal"
            - "entry_notice_days == 90, which clears the 7-day CATALOG_ADD minimum on both traversals"
            - "a further POST /catalog/catalog-entries/${entry_id}/retire returns 409 ERR_ENTRY_ALREADY_DELISTED"

      # ---------------------------------------------------------------- 2 of 2
      - name: subscription_billing_and_lifecycle_dimensions_evolve_independently
        grounds:
          - state_machines.Subscription
          - state_machines.Subscription.ACTIVE_to_CANCELLED
          - state_machines.Subscription.PAID_to_FAILED
          - state_machines.Subscription.GRACE_to_ACTIVE
        distinguishing_aspect: |
          Subscription carries two independent state dimensions on one row — billing_status
          (PENDING -> PAID -> FAILED -> PAID) and lifecycle_status (ACTIVE -> GRACE -> ACTIVE
          -> CANCELLED) — so the GRACE -> ACTIVE revert and a later CANCELLED can coexist with
          a billing_status still stuck at FAILED, on a different entity from the entry pair.
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z. NA region, PREMIUM tier (cloud enabled), publisher, title, HYBRID deal LIVE, one published CATALOG_ADD entry, one Subscriber, one MONTHLY PREMIUM subscription paid in full, and one resolved ACTIVE entitlement."
          setup_api_calls:
            - *c_may
            - *r_na
            - *t_prem
            - *t_ess
            - *p_nova
            - *ti_crimson
            - *d_hybrid
            - *sign_deal
            - *c_jun
            - *s_base
            - call: "POST /catalog/subscriptions"
              payload: { subscriber_id: "${subr_id}", tier_code: "PREMIUM", billing_period: "MONTHLY" }
              as: CatalogAdmin
              captures: { subscription_id: $.data.id }
            - call: "POST /catalog/subscriptions/${subscription_id}/pay"
              payload: {}
              as: Subscriber
              as_user_id: "${subr_id}"
            - *e_na_ca
            - *pub_na_ca
          trigger:
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: CatalogAdmin
            - call: "GET /catalog/subscriptions/${subscription_id}"
              payload: {}
              as: CatalogAdmin
              captures: { billing_after_failure: $.data.billing_status, life_after_failure: $.data.lifecycle_status, unpaid_after_failure: $.data.unpaid_months }
            - call: "GET /catalog/entitlements"
              payload: { subscription_id: "${subscription_id}", limit: 10, offset: 0 }
              as: CatalogAdmin
              captures: { ent_state_in_grace: "$.data[0].status" }
            - call: "POST /catalog/subscriptions/${subscription_id}/pay"
              payload: {}
              as: Subscriber
              as_user_id: "${subr_id}"
              captures: { billing_after_pay: $.data.billing_status, life_after_pay: $.data.lifecycle_status }
            - call: "POST /catalog/subscriptions/${subscription_id}/cancel"
              payload: {}
              as: Subscriber
              as_user_id: "${subr_id}"
              captures: { billing_after_cancel: $.data.billing_status, life_after_cancel: $.data.lifecycle_status, cancel_reason: $.data.cancellation_reason }
          assert:
            - "billing_after_failure == FAILED and unpaid_after_failure == 1"
            - "life_after_failure == GRACE and ent_state_in_grace == GRACE"
            - "billing_after_pay == PAID and life_after_pay == ACTIVE — the cyclic GRACE -> ACTIVE revert fired"
            - "billing_after_cancel == PAID while life_after_cancel == CANCELLED, so the two dimensions are genuinely independent"
            - "cancel_reason == USER_INITIATED"
            - "GET /catalog/entitlements?subscription_id=${subscription_id} after the cancel returns a row whose status == REVOKED, not GRACE"

  - rule_id: transitive_cascade
    instances:

      # ---------------------------------------------------------------- 1 of 2
      - name: entry_retire_cascades_through_title_entries_to_entitlements
        grounds:
          - state_machines.CatalogEntry.ADDED_to_DELISTED
          - state_machines.Title.RELEASED_to_RETIRED
          - state_machines.Entitlement.ACTIVE_to_REVOKED
          - endpoints.POST_/catalog/catalog-entries/{entry_id}/retire
        distinguishing_aspect: |
          Depth-3 chain from a different trigger than the subscription cascade: retiring one
          entry (hop 1) delists the title's other North American entries (hop 2), and that
          delisting itself revokes the entitlements resolving to those entries and recomputes
          each entry's subscriber_impact_count (hop 3).
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z. NA region, PREMIUM tier, publisher, title, HYBRID deal LIVE."
            - "Two published ADDED entries for the same title in NA, and two Subscribers each with a PAID PREMIUM subscription, so each entry carries two ACTIVE entitlements."
          setup_api_calls:
            - *c_may
            - *r_na
            - *t_prem
            - *t_ess
            - *p_nova
            - *ti_crimson
            - *d_hybrid
            - *sign_deal
            - *c_jun
            - call: "POST /catalog/subscribers"
              payload: { email: "ana@example.com", display_name: "Ana", home_region_code: "NA", wallet_credit_cents: 0 }
              as: Anonymous
              captures: { subr_ana_id: $.data.id }
            - call: "POST /catalog/subscribers"
              payload: { email: "bo@example.com", display_name: "Bo", home_region_code: "NA", wallet_credit_cents: 0 }
