            - "the screening was untouched by the refusal — the theater's subsequent report is the one that lands — ${rep_state} == SCREENED"
            - "attendance is a venue attestation, not a licensor one"

      - name: content_officer_cannot_invent_the_venue_commitment
        claim_type: role_denial
        grounds:
          - roles[ContentOfficer]
          - endpoints.POST_/bookings/{id}/lines
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "ContentOfficer shares the key and delivery surface but owns no commercial operation: proposing a venue commitment is refused 403, so the role's shared surface does not leak into negotiation."
        test_recipe:
          setup:
            - *k_clock
