          A different metric (aggregate_return_count) on a different endpoint
          (POST /ale-reporting/transmittals/{transmittal_id}/transmit): two attached forms
          plus the 1094-C give exactly 3 against electronic_filing_threshold 3, so PAPER is
          refused, and after detaching one form the rebuilt count of 2 sits below the
