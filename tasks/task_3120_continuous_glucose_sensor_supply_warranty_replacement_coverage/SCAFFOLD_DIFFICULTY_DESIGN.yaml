            - "before reverse: allowed_amount_cents == 8900; plan_paid == 7120; patient_paid+savings_card_paid == 1780"
            - "after reverse: SensorOrder.${ord}.billing_status == REVERSED"
            - "after reverse: SensorOrder.${ord}.plan_paid_cents == 0"
            - "after reverse: SensorOrder.${ord}.patient_paid_cents == 0"
            - "after reverse: SensorOrder.${ord}.savings_card_paid_cents == 0"

      - name: lot_unit_lifecycle_conserves_unit_count
        grounds:
          - state_machines.SensorUnit
          - state_machines.SensorOrder.billing_status.ADJUDICATED_to_REVERSED
        distinguishing_aspect: |
          Conserved quantity = unit count per lot:
          lot.quantity_manufactured == count(units of lot) summed across all
