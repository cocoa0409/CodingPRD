            - "A SHEET_SET linen line with total_owned_sets 20 and initial_soiled_sets 8, so the ledger starts at (on_hand 12, in_laundry 0, soiled 8)."
            - "One cycle dispatched at 08:00 with batch_sets 8 and expected_return_at 12:00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
