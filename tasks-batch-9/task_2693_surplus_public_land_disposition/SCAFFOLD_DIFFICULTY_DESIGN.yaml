            - "One custodian Agency and one HOUSING_AUTHORITY Agency registered as an AFFORDABLE_HOUSING preference entity."
            - "One Parcel with book_value_cents 70000000, a single TitleCurativeItem resolved CURED at 250000, and an ACCEPTED Appraisal at 100000000, so the AFFORDABLE_HOUSING PreferenceOffer opens with ah_minimum_price_cents 64750000 and near_band_cents 67987500."
            - "One ADOPTED SurplusDeclaration with an EXEMPT CERTIFIED EnvironmentalReview and a notice served on the housing authority which answered EXPRESS_INTEREST at clock 2026-08-01T00:00:00Z, so negotiation_deadline_at is 2026-10-30T00:00:00Z."
            - "Five NegotiationRound rows: officer 80000000 (round 1, untimely because it answers nothing), entity 60000000 (round 2, answers 1 after 4 days), officer 70000000 (round 3, answers 2 after 5 days, timely), entity 62000000 (round 4, answers 3 after 5 days), officer 66000000 (round 5, answers 4 after 5 days, timely)."
            - "The preference window is closed and the offer concluded IMPASSE at exactly negotiation_deadline_at 2026-10-30T00:00:00Z, so premature_penalty is 0; good_faith_status is still UNREVIEWED."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { name: "Riverbend Housing Authority", agency_type: "HOUSING_AUTHORITY", contact_email: "acq@rbha.gov", is_preference_entity: true, preference_category: "AFFORDABLE_HOUSING" }
              as: SystemAdministrator
              captures: { pref_agency_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { apn: "APN-2693-002", address: "14 Depot Road", acreage: 2.5, zoning_code: "R-3", book_value_cents: 70000000, custodian_agency_id: "${cust_agency_id}" }
              as: RealPropertyOfficer
              captures: { parcel_id: "$.data.id" }
            - call: "POST /parcels/${parcel_id}/title-items"
              payload: { item_type: "LIEN", description: "Recorded mechanics lien from 2019 sidewalk work", cure_cost_estimate_cents: 250000 }
              as: RealPropertyOfficer
              captures: { title_item_id: "$.data.id" }
            - call: "POST /title-items/${title_item_id}/resolve"
              payload: { resolution: "CURED", actual_cure_cost_cents: 250000 }
              as: RealPropertyOfficer
            - call: "POST /appraisers"
              payload: { name: "Dana Kirkwood MAI", license_number: "AG-44120", license_expires_on: "2028-01-01T00:00:00Z" }
              as: SystemAdministrator
              captures: { appraiser_id: "$.data.id" }
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: RealPropertyOfficer
              captures: { parcel_v: "$.data.version" }
            - call: "POST /appraisals"
              payload: { parcel_id: "${parcel_id}", appraiser_id: "${appraiser_id}", method: "SALES_COMPARISON", engagement_start_on: "2026-08-02T00:00:00Z", engagement_end_on: "2026-08-20T00:00:00Z", expected_parcel_version: "${parcel_v}" }
              as: RealPropertyOfficer
              captures: { appraisal_id: "$.data.id" }
            - call: "POST /appraisals/${appraisal_id}/report"
              payload: { appraised_value_cents: 100000000, effective_date: "2026-08-01T00:00:00Z", narrative: "Sales comparison of four infill R-3 sales." }
              as: Appraiser
              as_user_id: "${appraiser_id}"
            - call: "POST /appraisals/${appraisal_id}/accept"
              payload: {}
              as: RealPropertyOfficer
            - call: "POST /declarations"
              payload: { parcel_id: "${parcel_id}", justification: "Depot Road remnant is no longer needed for public works staging." }
              as: RealPropertyOfficer
              captures: { decl_id: "$.data.id" }
            - call: "POST /declarations/${decl_id}/adopt"
              payload: { resolution_number: "RES-2026-118" }
              as: BoardClerk
              as_user_id: "clerk-adopt-1"
            - call: "POST /declarations/${decl_id}/environmental-reviews"
              payload: { determination_class: "EXEMPT" }
              as: RealPropertyOfficer
            - call: "POST /declarations/${decl_id}/issue-notices"
