            - "second attempt: job.status == COMPLETE (${st2}); unused reservation released (reserved 130-130=0 consumed 130)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics + resources)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: press_booking_half_open_adjacency
        grounds:
          - validations[priority=8]
          - errors[ERR_PRESS_WINDOW_CONFLICT]
          - entities.PressBooking.fields.start_utc
        distinguishing_aspect: |
          Resource = Press, semantics = half-open [start,end): a new booking starting exactly at the
          existing booking's end (12:00) is ACCEPTED (touching endpoints do not intersect), while
          [11:00,13:00) is rejected — adjacency is legal under half-open arithmetic.
        test_recipe:
          setup:
            - "Job qty 3000 PRESS_READY; press P (OFFSET); booking B1 [2026-08-10T10:00,12:00)"
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Pi", brand_code: "PII" }, as: PlantAdmin, captures: { cust: $.data.id } }
            - { call: "POST /plant/color-standards", payload: { customer_id: "${cust}", ink_slot: "BRAND_RED", l_target: 5300, a_target: 6800, b_target: 3200, tolerance_delta_e_milli: 200, substrate_class: "COATED" }, as: PlantAdmin, captures: { std: $.data.id } }
