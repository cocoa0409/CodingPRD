              as: LegalOpsManager
              captures: { pa_id: $.data.id }
            - call: "POST /legal-ops/practice-areas/${pa_id}/matter-types"
              payload: { code: "LIT-C", display_name: "C" }
              as: LegalOpsManager
              captures: { mt_id: $.data.id }
            - call: "POST /legal-ops/firms"
              payload: { name: "F", tier: "TIER_1", blended_hourly_rate_cents: 25000 }
              as: LegalOpsManager
              captures: { firm_id: $.data.id }
            - call: "POST /legal-ops/in-house-counsel"
              payload: { full_name: "C", email: "c@x.com", annual_capacity_hours: 2000, loaded_hourly_cost_cents: 15000 }
              as: LegalOpsManager
              captures: { counsel_id: $.data.id }
            - call: "POST /legal-ops/budgets"
              payload: { fiscal_period_id: "${fp_id}", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", allocated_cents: 1000000 }
              as: LegalOpsManager
            - call: "POST /legal-ops/matters"
              payload: { matter_number: "LGL-2026-00001", title: "M", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", fiscal_period_id: "${fp_id}", lead_counsel_id: "${counsel_id}", primary_firm_id: "${firm_id}" }
              as: LegalOpsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /legal-ops/matters/${m_id}/assignments"
              payload: { counsel_id: "${counsel_id}", allocated_hours: 5 }
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/matters/${m_id}/activate"
              payload: {}
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/invoices"
              payload: { matter_id: "${m_id}", firm_id: "${firm_id}", fiscal_period_id: "${fp_id}", invoice_number: "I-1", amount_cents: 1200000 }
              as: LegalOpsAnalyst
              captures: { inv_id: $.data.id }
            - call: "POST /legal-ops/invoices/${inv_id}/reject"
              payload: {}
              as: LegalOpsAnalyst
          trigger:
            - call: "POST /legal-ops/invoices/${inv_id}/pay"
              payload: {}
              as: LegalOpsManager
              captures: { err: $.data.error_id }
          assert:
            - "Invoice is in REJECTED (terminal) — state precondition violated"
            - "Invoice amount 1200000 > 1100000 cap — fiscal overrun also violated"
            - "Returned error_id == ERR_INVALID_STATE (priority 4 beats priority 13)"
            - "NOT ERR_BUDGET_OVERRUN_EXCEEDED"

      - name: sod_vs_referential_conflict_on_invoice_approve
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_SOD_VIOLATION]
          - errors[ERR_ENTITY_INACTIVE]
        distinguishing_aspect: |
          Pair (business_safety, business_referential): approve an invoice that
          (a) violates SOD (same actor created it AND amount >= 100000 cents) AND
          (b) references a firm that is now SUSPENDED. SOD at priority 5 beats
          referential at priority 9; ERR_SOD_VIOLATION wins.
        test_recipe:
          setup:
            - "Department; FP OPEN; PA; MT; counsel C"
