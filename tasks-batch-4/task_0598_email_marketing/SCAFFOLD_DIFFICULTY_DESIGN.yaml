  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: send_credit_conservation_across_schedule_and_cancel
        grounds:
          - state_machines.Campaign.APPROVED_to_SCHEDULED
          - state_machines.Campaign.SENDING_to_CANCELLED
          - entities.Account.fields.granted_send_credits
          - entities.Account.fields.reserved_send_credits
          - entities.Account.fields.consumed_send_credits
        distinguishing_aspect: |
          Conserved quantity #1 -- SEND CREDITS. The named invariant is
          `Account.granted_send_credits == Account.send_credit_balance +
          Account.reserved_send_credits + Account.consumed_send_credits`, and it must
          read 100 == 100 + 0 + 0 after the forward action (schedule, which moves 4
          credits from balance to reserved) is undone by its compensating action
          (cancel), with zero drift even though 2 of the 4 sends were already
          DELIVERED.
        test_recipe:
          setup:
            - "One account granted exactly 100 send credits."
            - "One single-opt-in audience with 4 CONFIRMED subscribers."
            - "Campaign C1 is SENDING with 4 Sends; the first two are DELIVERED, the other two are QUEUED."
            - "After the schedule, send_credit_balance was 96 and reserved_send_credits was 4."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", plan_tier: "ESSENTIALS", initial_send_credits: 100, hourly_send_capacity: 100 }
              as: PlatformAdmin
              captures: { acct: $.data.id, granted: $.data.granted_send_credits }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "author@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { author: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "appr@acme.com", user_role: "COMPLIANCE_APPROVER" }
              as: PlatformAdmin
              captures: { approver: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { aud: $.data.id }
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s2@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s3@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s4@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /templates"
              payload: { account_id: "${acct}", name: "T", subject: "Spring Sale", html_body: "<p>Hi</p><a href=\"{{unsubscribe_url}}\">unsubscribe</a>" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { tpl: $.data.id }
            - call: "POST /templates/${tpl}/publish"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", audience_id: "${aud}", template_id: "${tpl}", name: "C1" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { c1: $.data.id }
            - call: "POST /campaigns/${c1}/submit-review"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /campaigns/${c1}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceApprover
              as_user_id: "${approver}"
            - call: "GET /accounts/${acct}"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { acct_v1: $.data.version }
            - call: "POST /campaigns/${c1}/schedule"
              payload: { scheduled_at: "2026-05-02T10:00:00Z", send_window_minutes: 60, expected_account_version: "${acct_v1}" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "GET /accounts/${acct}"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { bal_after_schedule: $.data.send_credit_balance, res_after_schedule: $.data.reserved_send_credits }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_ops/run"
              payload: {}
              as: PlatformAdmin
            - call: "GET /sends"
              payload: { campaign_id: "${c1}" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { sd1: "$.data[0].id", sd2: "$.data[1].id" }
            - call: "POST /_events/emit"
              payload: { send_id: "${sd1}", kind: "DELIVERED" }
              as: PlatformAdmin
            - call: "POST /_events/emit"
              payload: { send_id: "${sd2}", kind: "DELIVERED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /campaigns/${c1}/cancel"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
          assert:
            - "${granted} == 100"
            - "${bal_after_schedule} == 96 and ${res_after_schedule} == 4"
            - "Account.${acct}.granted_send_credits == 100"
            - "Account.${acct}.send_credit_balance == 100"
            - "Account.${acct}.reserved_send_credits == 0"
            - "Account.${acct}.consumed_send_credits == 0"
            - "INVARIANT: granted_send_credits == send_credit_balance + reserved_send_credits + consumed_send_credits -> 100 == 100 + 0 + 0"
            - "Campaign.${c1}.reserved_credit_count == 0"

      - name: contact_count_conservation_across_import_and_rollback
        grounds:
          - state_machines.ImportJob.PARTIAL_to_ROLLED_BACK
          - calculations.import_row_disposition
          - entities.Audience.fields.subscriber_count
          - entities.Account.fields.billable_contact_count
        distinguishing_aspect: |
          Conserved quantity #2 -- BILLABLE CONTACT COUNT (a population count, not a
          credit ledger). The named invariant is
          `Audience.subscriber_count == count(Subscriber WHERE consent_state IN
          {PENDING, CONFIRMED, UNSUBSCRIBED})` and its account-level roll-up: after the
          forward action (import, which accepts 3 of 4 rows) is undone by its
          compensating action (rollback, which archives exactly those 3), both counts
          return to their pre-import value of 2 with zero drift, and the duplicate
          row -- which created nothing -- leaves nothing to undo.
        test_recipe:
          setup:
            - "One ESSENTIALS account with one single-opt-in audience holding exactly 2 CONFIRMED subscribers, s1@x.com and s2@x.com (subscriber_count == 2, billable_contact_count == 2)."
            - "A PARTIAL ImportJob has since accepted 3 new rows and flagged 1 duplicate (s1@x.com), lifting both counts to 5."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", plan_tier: "ESSENTIALS", initial_send_credits: 0, hourly_send_capacity: 100 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "author@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { author: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { aud: $.data.id }
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s2@x.com", consent_source: "API" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "GET /audiences/${aud}"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { pre_count: $.data.subscriber_count, aud_v: $.data.version }
            - call: "POST /audiences/${aud}/import-jobs"
              payload:
                rows: [{ email: "e1@x.com" }, { email: "e2@x.com" }, { email: "e3@x.com" }, { email: "s1@x.com" }]
                expected_audience_version: "${aud_v}"
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { job: $.data.id, acc: $.data.accepted_count, dup: $.data.duplicate_count, st: $.data.status }
            - call: "GET /audiences/${aud}"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { mid_count: $.data.subscriber_count }
          trigger:
            - call: "POST /import-jobs/${job}/rollback"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${author}"
          assert:
            - "${pre_count} == 2"
            - "${acc} == 3 and ${dup} == 1 and ${st} == \"PARTIAL\""
            - "${mid_count} == 5"
            - "ImportJob.${job}.row_count == 4 and ImportJob.${job}.rejected_count == 0 and ImportJob.${job}.suppressed_count == 0"
            - "ImportJob.${job}.status == \"ROLLED_BACK\""
            - "Audience.${aud}.subscriber_count == 2   # back to the pre-import value, zero drift"
            - "Account.${acct}.billable_contact_count == 2"
            - "GET /subscribers {audience_id: ${aud}, consent_state: \"ARCHIVED\"} returns exactly 3 rows"
            - "GET /subscribers {audience_id: ${aud}, consent_state: \"CONFIRMED\"} returns exactly 2 rows"
