          setup:
            - "One custodian Agency and one challenger Agency, both REGISTERED in the notice registry."
            - "One Parcel and one Appraiser."
            - "One Appraisal REPORTED at appraised_value_cents 100000000 with reported_at 2026-08-01T00:00:00Z."
            - "An ADOPTED declaration on the parcel whose statutory notice went to the challenger Agency, so the challenger is eligible."
            - "The logical clock at 2026-08-01T00:00:00Z, inside the 30-day challenge window."
