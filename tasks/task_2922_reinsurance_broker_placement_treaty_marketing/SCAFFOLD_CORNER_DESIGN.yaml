              captures: { quiet_layer_state: $.data.status }
            - call: "GET /quotes/${q_a}"
              payload: {}
              as: BrokerPlacementLead
              captures: { q_a_state: $.data.status }
            - call: "GET /market-submissions/${ms_a}"
              payload: {}
              as: BrokerPlacementLead
              captures: { ms_a_state: $.data.status }
            - call: "GET /market-submissions/${ms_b}"
              payload: {}
              as: BrokerPlacementLead
              captures: { ms_b_state: $.data.status }
            - call: "GET /reinsurers/${alpha_id}"
