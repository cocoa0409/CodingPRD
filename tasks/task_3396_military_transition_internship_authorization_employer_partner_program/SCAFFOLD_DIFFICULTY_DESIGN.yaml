            - "first UPHELD (adjudicator auth-1 != denier cmd-1): status == DENIED — cycle edge traversed once"
            - "second appeal: status == UNDER_APPEAL, appeal_count == 2"
            - "second UPHELD (adjudicator auth-2 != auth-1): status == DENIED — cycle edge traversed twice"
