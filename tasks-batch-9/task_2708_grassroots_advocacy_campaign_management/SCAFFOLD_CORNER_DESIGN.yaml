            - "Milestone.${ms_id}.pressure_multiplier == 2.0"
            - "Milestone.${ms_id}.is_blackout == false"
            - "Milestone.${ms_id}.reschedule_count == 0"
            - "GET /advocacy/milestones?campaign_id=${camp_id} returns total_count == 1"

