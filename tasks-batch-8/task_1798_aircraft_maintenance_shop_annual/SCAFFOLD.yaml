  - { method: GET, path: "/api/work-orders/{id}/discrepancies", description: "List discrepancies of WO", roles: [ShopManager, Mechanic, Owner], code: 200, input: ["status?", "checklist_item_id?", "decided_by_owner_id?"], output: "Discrepancy[]", side_effects: [] }
