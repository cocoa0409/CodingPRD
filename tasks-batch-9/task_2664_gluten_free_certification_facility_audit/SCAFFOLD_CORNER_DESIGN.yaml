              captures: { doc_a: $.data.id, doc_a_status: $.data.status }
            - call: "POST /gfco/supplier-documents"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_b}", doc_type: "ALLERGEN_STATEMENT", issued_on: "2026-07-01T00:00:00Z", expires_on: "2028-07-01T00:00:00Z" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { doc_b: $.data.id }
          trigger:
            - call: "POST /gfco/supplier-documents/${doc_a}/verification"
              payload: { decision: "APPROVE" }
              as: CertificationReviewer
              as_user_id: "rev-1"
          assert:
            - "response.status == 200"
            - "response.data.id == ${doc_a}"
            - "response.data.supplier_id == ${sup_id}"
            - "response.data.ingredient_id == ${ing_a}"
            - "response.data.status == \"VERIFIED\""
            - "response.data.verified_by_user_id == \"rev-1\""
            - "response.data.verified_on == \"2026-08-01T00:00:00Z\""
            - "${doc_a_status} == \"PENDING\""
            - "Supplier.${sup_id}.verified_document_count == 1"
            - "Ingredient.${ing_a}.verified_doc_types == [\"ALLERGEN_STATEMENT\"]"
            - "Ingredient.${ing_b}.verified_doc_types == []"
            - "SupplierDocument.${doc_b}.status == \"PENDING\""
            - "GET /gfco/supplier-documents with supplier_id=${sup_id} returns total_count == 2"
            - "GET /gfco/supplier-documents with supplier_id=${sup_id} and status=VERIFIED returns total_count == 1"
            - "GET /gfco/supplier-documents with ingredient_id=${ing_a} returns total_count == 1"
            - "GET /gfco/supplier-documents with ingredient_id=${ing_a} returns items[0].id == ${doc_a}"
            - "GET /gfco/supplier-documents with ingredient_id=${ing_b} and status=VERIFIED returns total_count == 0"

      - name: applicant_read_reports_every_derived_posture_field_from_one_open_finding
        claim_type: computed_read
        grounds:
          - endpoints."GET /gfco/applicants/{applicantId}"
          - calculations.open_nc_penalty_points
          - calculations.applicant_compliance_posture
          - entities.Nonconformance.fields.penalty_points
        distinguishing_aspect: |
          The applicant read is a pure derived projection, and one MAJOR finding is enough to
          separate the two posture variants from each other and from the raw counters: with no
          certificate ever issued the CERTIFICATION_CYCLE window falls back to the applicant's
          created_at, so both variants coincide at 100 - 8 = 92 while every certificate counter
          stays 0 and fee_balance_cents stays 0. A SURVEILLANCE_RUN finding carries no source
          FK, which also proves penalty_points is derived from severity alone.
        test_recipe:
          setup:
            - "One applicant with no facility, product or certificate."
            - "One MAJOR SANITATION nonconformance raised directly against the applicant by rev-1 with source_type SURVEILLANCE_RUN and no source FK."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id, app_score: $.data.posture_score_cycle }
            - call: "POST /gfco/nonconformances"
              payload: { applicant_id: "${app_id}", source_type: "SURVEILLANCE_RUN", category: "SANITATION", severity: "MAJOR", description: "Swab log gap for the 2026-07 sanitation cycle" }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { nc_id: $.data.id, nc_points: $.data.penalty_points, nc_due: $.data.ca_due_on }
          trigger:
            - call: "GET /gfco/applicants/${app_id}"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "response.status == 200"
            - "response.data.id == ${app_id}"
            - "response.data.open_nc_penalty_points == 8"
            - "response.data.posture_score_rolling_12m == 92"
            - "response.data.posture_score_cycle == 92"
            - "response.data.compliance_posture == \"GOOD_STANDING\""
            - "response.data.active_certified_product_count == 0"
            - "response.data.suspended_certificate_count == 0"
            - "response.data.revoked_certificate_count == 0"
            - "response.data.substantiated_complaint_count_rolling == 0"
            - "response.data.substantiated_complaint_count_cycle == 0"
            - "response.data.current_cycle_started_on == null"
            - "response.data.fee_balance_cents == 0"
            - "${app_score} == 100"
            - "${nc_points} == 8"
            - "${nc_due} == \"2026-08-31T00:00:00Z\""
            - "Nonconformance.${nc_id}.status == \"OPEN\""
            - "Nonconformance.${nc_id}.certificate_id == null"
            - "Nonconformance.${nc_id}.audit_id == null"

      - name: reinstatement_is_a_conditional_action_gated_on_the_cleared_blocker
        claim_type: conditional_action
        excluded_because:
          difficulty_instance: suspend_reinstate_suspend_conserves_active_count_while_suspension_count_only_climbs
          rationale: |
            That instance already drives POST /gfco/certificates/{certificateId}/reinstatement
            as a conditional action: it reinstates a SUSPENDED certificate only after the
            blocking condition is cleared, asserts the restored ISSUED status, the released
            mark_usage_lock and the thawed product label, and then suspends again to show that
            active_certified_product_count returns to its prior value while suspension_count
            only climbs. The negative side of the condition is covered by the priority-ordering
            instance that shows an ISSUED certificate answering 409 ERR_CERTIFICATE_NOT_SUSPENDED,
            so a separate corner instance would only repeat one of the two halves.

  - section: errors
    instances:
      - name: suspending_a_revoked_certificate_is_rejected_as_terminal
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CERTIFICATE_TERMINAL
          - validations.priority_12
          - state_machines.Certificate.terminal_states
        distinguishing_aspect: |
          REVOKED is terminal for every certificate operation, so suspension - which would
          otherwise be the decision maker's normal reflex on a bad finding - is refused. The
          revocation reason is deliberately UNRESOLVED_NONCONFORMANCE rather than FRAUD or
          REPEAT_FAILURE so the applicant's posture is not driven into SUSPENDED by the
          revocation itself, which isolates the terminal-state error from the posture cascade,
          and revoked_certificate_count must stay 1 rather than double-counting.
        test_recipe:
          setup:
            - "The complete issuance path through to one ISSUED certificate for the STANDARD product, with the clock at 2026-08-06."
            - "The decision maker then revokes it with revocation_reason UNRESOLVED_NONCONFORMANCE."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/facilities"
              payload: { applicant_id: "${app_id}", site_name: "Plant 9", air_handling_class: "FILTERED_ZONED", shared_equipment_present: false, gluten_containing_operations: "NONE" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /gfco/facilities/${fac_id}/sanitation-validation"
              payload: { swab_ppm: 2.0, method: "G12_ELISA", validated_on: "2026-08-01T00:00:00Z" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/suppliers"
              payload: { name: "Prairie Mills", country_code: "CA", gluten_handling_disclosed: false }
              as: ProgramAdministrator
              captures: { sup_id: $.data.id }
            - call: "POST /gfco/ingredients"
              payload: { applicant_id: "${app_id}", supplier_id: "${sup_id}", name: "Brown Rice Flour", risk_class: "INHERENTLY_GF" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { ing_id: $.data.id }
            - call: "POST /gfco/supplier-documents"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_id}", doc_type: "ALLERGEN_STATEMENT", issued_on: "2026-07-01T00:00:00Z", expires_on: "2028-07-01T00:00:00Z" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /gfco/supplier-documents/${doc_id}/verification"
              payload: { decision: "APPROVE" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/ingredients/${ing_id}/submission"
              payload: {}
              as: ApplicantContact
              as_user_id: "${app_id}"
            - call: "POST /gfco/ingredients/${ing_id}/review"
              payload: { decision: "APPROVE" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/products"
              payload: { applicant_id: "${app_id}", facility_id: "${fac_id}", name: "Rice Sandwich Loaf", sku: "RSL-001", requested_mark_tier: "STANDARD" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /gfco/product-ingredients"
              payload: { product_id: "${prod_id}", ingredient_id: "${ing_id}", inclusion_pct: 55 }
              as: ApplicantContact
              as_user_id: "${app_id}"
            - call: "POST /gfco/products/${prod_id}/formula-review"
              payload: { decision: "CLEAR" }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { prod_v1: $.data.version }
            - call: "POST /gfco/products/${prod_id}/testing-plan"
              payload: { expected_product_version: "${prod_v1}" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/products/${prod_id}/label-review"
              payload: { decision: "APPROVE", mark_tier_granted: "STANDARD" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/audits"
              payload: { facility_id: "${fac_id}", audit_type: "INITIAL", onsite_start_at: "2026-08-05T09:00:00Z", onsite_end_at: "2026-08-05T17:00:00Z" }
              as: FieldAuditor
              as_user_id: "aud-1"
              captures: { aud_id: $.data.id }
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/audits/${aud_id}/start"
              payload: {}
              as: FieldAuditor
              as_user_id: "aud-1"
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T17:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/audits/${aud_id}/close"
              payload: { shared_equipment_verified: true, air_handling_verified: true, sanitation_validation_reviewed: true }
              as: FieldAuditor
              as_user_id: "aud-1"
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: ProgramAdministrator
            - call: "GET /gfco/products/${prod_id}"
              payload: {}
              as: CertificationDecisionMaker
              as_user_id: "dm-1"
              captures: { prod_v2: $.data.version }
            - call: "POST /gfco/certificates"
              payload: { product_id: "${prod_id}", expected_product_version: "${prod_v2}" }
              as: CertificationDecisionMaker
              as_user_id: "dm-1"
              captures: { cert_id: $.data.id }
            - call: "POST /gfco/certificates/${cert_id}/revocation"
              payload: { revocation_reason: "UNRESOLVED_NONCONFORMANCE" }
              as: CertificationDecisionMaker
              as_user_id: "dm-1"
              captures: { cert_status: $.data.status, cert_revoked_on: $.data.revoked_on, cert_refund: $.data.fee_refunded }
          trigger:
            - call: "POST /gfco/certificates/${cert_id}/suspension"
              payload: { suspension_reason: "CRITICAL_NONCONFORMANCE" }
              as: CertificationDecisionMaker
              as_user_id: "dm-1"
          assert:
            - "response.status == 409"
            - "response.error.code == \"ERR_CERTIFICATE_TERMINAL\""
            - "${cert_status} == \"REVOKED\""
            - "${cert_revoked_on} == \"2026-08-06T00:00:00Z\""
            - "${cert_refund} == false"
            - "Certificate.${cert_id}.status == \"REVOKED\""
            - "Certificate.${cert_id}.suspension_count == 0"
            - "Certificate.${cert_id}.suspension_reason == null"
            - "Certificate.${cert_id}.revocation_reason == \"UNRESOLVED_NONCONFORMANCE\""
            - "Applicant.${app_id}.revoked_certificate_count == 1"
            - "Applicant.${app_id}.active_certified_product_count == 0"
            - "Applicant.${app_id}.suspended_certificate_count == 0"
            - "Applicant.${app_id}.compliance_posture == \"GOOD_STANDING\""

      - name: audit_window_conflict_error_is_triggered_by_the_overlap_instance
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: audit_window_half_open_so_touching_is_free_and_one_second_overlap_is_not
          rationale: |
            ERR_AUDIT_WINDOW_CONFLICT (409) is raised there by a second audit that starts one
            second before an existing SCHEDULED audit's onsite_end_at, alongside the accepted
            exactly-touching case, so the error is triggered under the tightest possible
            condition. A corner instance could only weaken the boundary.

      - name: sampling_exclusion_window_error_is_triggered_by_the_exclusion_instance
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: scheduled_lot_sampling_exclusion_is_a_closed_interval_that_unannounced_lots_ignore
          rationale: |
            ERR_SAMPLING_EXCLUSION_WINDOW (409) is raised there by a SCHEDULED lot test on the
            last day of the closed exclusion interval, with an UNANNOUNCED test on the same day
            accepted as the control. That pairing is strictly stronger than any single-call
            corner instance.

      - name: required_supplier_docs_missing_error_is_triggered_by_the_document_set_instance
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: ingredient_approval_gated_by_verified_document_set_of_its_supplier
          rationale: |
            ERR_REQUIRED_SUPPLIER_DOCS_MISSING (422) is raised there for a HIGH_RISK_GRAIN
            ingredient that holds a VERIFIED allergen statement and process flow but no COA,
            which is the only interesting shape of the claim: the set is risk-class dependent
            and only VERIFIED documents count.

      - name: nonconformance_state_error_is_triggered_by_the_escalation_instance
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: ca_cycle_bounded_by_revision_count_then_escalation_locks_the_loop
          rationale: |
            ERR_INVALID_NONCONFORMANCE_STATE (409) is raised there by a corrective action plan
            filed against an ESCALATED record, i.e. after the revision budget is exhausted,
            which simultaneously proves the loop bound and the lockdown. Re-testing it from a
            CLOSED record would add no new information.

  - section: rbac
    instances:
      - name: request_with_no_identity_headers_is_unauthenticated
        claim_type: authentication_required
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations.priority_1
          - roles
        distinguishing_aspect: |
          Authentication precedes everything, including the FK resolution that would otherwise
          make this call a 404: the applicant_id in the payload does not exist, yet the answer
          must be 401 and not ERR_APPLICANT_NOT_FOUND. `as: NONE` is the convention in this
          design for a request sent with neither X-User-Role nor X-User-ID.
        test_recipe:
          setup:
            - "An empty system at the default clock; no applicant with the id used below has ever existed."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /gfco/facilities"
              payload: { applicant_id: "00000000-0000-4000-8000-000000000000", site_name: "Ghost Plant", air_handling_class: "FILTERED_ZONED" }
              as: NONE
          assert:
            - "response.status == 401"
            - "response.error.code == \"ERR_UNAUTHENTICATED\""
            - "GET /gfco/facilities returns total_count == 0"

      - name: lab_technician_cannot_issue_a_certificate
        claim_type: role_exclusive_operation
        grounds:
          - roles.LabTechnician.exclusive_operations
          - roles.CertificationDecisionMaker.exclusive_operations
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: |
          Issuance is exclusive to CertificationDecisionMaker, and the role check runs before
          any issuance gate, so a LabTechnician is refused with 403 ERR_FORBIDDEN_ROLE even
          though this particular product would fail six substantive gates anyway - the response
          must not leak the substantive failure.
        test_recipe:
          setup:
            - "One applicant with one facility and one bare product: no ingredients, no testing plan, no label approval and no audit."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/facilities"
              payload: { applicant_id: "${app_id}", site_name: "Plant 9", air_handling_class: "FILTERED_ZONED" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /gfco/products"
              payload: { applicant_id: "${app_id}", facility_id: "${fac_id}", name: "Rice Sandwich Loaf", sku: "RSL-001" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
          trigger:
            - call: "POST /gfco/certificates"
              payload: { product_id: "${prod_id}", expected_product_version: "${prod_v}" }
              as: LabTechnician
              as_user_id: "lab-1"
          assert:
            - "response.status == 403"
            - "response.error.code == \"ERR_FORBIDDEN_ROLE\""
            - "GET /gfco/certificates with product_id=${prod_id} returns total_count == 0"
            - "Applicant.${app_id}.active_certified_product_count == 0"

      - name: applicant_contact_cannot_read_consumer_complaints
        claim_type: role_exclusive_operation
        grounds:
          - roles.ApplicantContact.shared_operations
          - endpoints."GET /gfco/consumer-complaints/{complaintId}"
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: |
          The applicant's read access is broad but not total: complaint records are the one
          family carved out of its shared GET set, because they carry third-party consumer
          detail. The same applicant can read its own certificate in the same state of the
          world, which proves the carve-out is per-endpoint and not a blanket ownership rule.
        test_recipe:
          setup:
            - "One applicant and nothing else; no complaint has ever been filed, so the id read below is the well-formed sentinel id that no endpoint ever mints."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
          trigger:
            - call: "GET /gfco/consumer-complaints/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ApplicantContact
              as_user_id: "${app_id}"
          assert:
            - "response.status == 403"
            - "response.error.code == \"ERR_FORBIDDEN_ROLE\""

      - name: applicant_contact_cannot_run_the_surveillance_sweep
        claim_type: role_exclusive_operation
        grounds:
          - roles.ProgramAdministrator.exclusive_operations
          - endpoints."POST /gfco/surveillance-runs"
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: |
          The sweep is the only way clock-driven transitions materialise, so letting the
          regulated party trigger it would hand it control over its own surveillance clock. The
          refusal must also leave the world completely unmoved: the certificate-bearing state
          is not needed to see that, but the sweep must not even be partially applied.
        test_recipe:
          setup:
            - "One applicant with one facility whose sanitation was validated on 2026-08-01 and therefore expires 2027-08-01."
            - "The clock is advanced past that expiry to 2027-08-02, so a legitimate sweep would move the facility to EXPIRED."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/facilities"
              payload: { applicant_id: "${app_id}", site_name: "Plant 9", air_handling_class: "FILTERED_ZONED" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /gfco/facilities/${fac_id}/sanitation-validation"
              payload: { swab_ppm: 2.0, method: "G12_ELISA", validated_on: "2026-08-01T00:00:00Z" }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { fac_exp: $.data.sanitation_expires_on }
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-02T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /gfco/surveillance-runs"
              payload: {}
              as: ApplicantContact
              as_user_id: "${app_id}"
          assert:
            - "response.status == 403"
            - "response.error.code == \"ERR_FORBIDDEN_ROLE\""
            - "${fac_exp} == \"2027-08-01T00:00:00Z\""
            - "Facility.${fac_id}.sanitation_validation_status == \"VALIDATED\""

      - name: applicant_contact_cannot_declare_a_facility_for_another_applicant
        claim_type: resource_ownership
        grounds:
          - roles.ApplicantContact.identity
          - validations.priority_6
          - errors.ERR_NOT_RESOURCE_OWNER
        distinguishing_aspect: |
          ApplicantContact identity is entity_backed, so X-User-ID must equal the applicant_id
          the write names. Both applicants exist, which makes this a 403 ownership failure and
          not a 404, and the payload is otherwise perfectly valid - the identical call sent by
          the owning contact would succeed.
        test_recipe:
          setup:
            - "Two applicants, Northgate and Southbank, neither of which yet has a facility."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_n: $.data.id }
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Southbank Snacks Inc", contact_email: "qa@southbank.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_s: $.data.id }
          trigger:
            - call: "POST /gfco/facilities"
              payload: { applicant_id: "${app_s}", site_name: "Plant 12", air_handling_class: "OPEN_PLENUM", shared_equipment_present: true, gluten_containing_operations: "SAME_LINE" }
              as: ApplicantContact
              as_user_id: "${app_n}"
          assert:
            - "response.status == 403"
            - "response.error.code == \"ERR_NOT_RESOURCE_OWNER\""
            - "GET /gfco/facilities with applicant_id=${app_s} returns total_count == 0"
            - "GET /gfco/facilities with applicant_id=${app_n} returns total_count == 0"

      - name: corrective_action_decision_by_the_raiser_is_rejected_under_segregation_of_duties
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_31
          - errors.ERR_SEGREGATION_OF_DUTIES
          - roles.CertificationReviewer.exclusive_operations
          - state_machines.Nonconformance.transitions.CA_SUBMITTED_to_CA_ACCEPTED
        distinguishing_aspect: |
          The decider carries the right ROLE and the record is in the right STATE, so the only
          thing wrong is the identity: rev-1 raised the finding and may not also accept its
          remedy. Segregation is enforced on X-User-ID, not on the role, which is why the
          identical call from rev-2 would succeed - and the record must stay CA_SUBMITTED with
          ca_decided_by_user_id null and its penalty points still counted.
        test_recipe:
          setup:
            - "One applicant and one MAJOR SANITATION nonconformance raised by rev-1 with source_type SURVEILLANCE_RUN, so ca_due_on is 2026-08-31."
            - "The applicant contact has submitted a corrective action plan against the current version, moving the record to CA_SUBMITTED with ca_revision_count 0."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/nonconformances"
              payload: { applicant_id: "${app_id}", source_type: "SURVEILLANCE_RUN", category: "SANITATION", severity: "MAJOR", description: "Swab log gap for the 2026-07 sanitation cycle" }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { nc_id: $.data.id, nc_v1: $.data.version, nc_raiser: $.data.raised_by_user_id }
            - call: "POST /gfco/nonconformances/${nc_id}/corrective-action-plan"
              payload: { expected_nonconformance_version: "${nc_v1}", ca_plan_text: "Reinstate the daily swab log with a second-signature check" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { nc_status: $.data.status, nc_v2: $.data.version, nc_rev: $.data.ca_revision_count }
          trigger:
            - call: "POST /gfco/nonconformances/${nc_id}/corrective-action-decision"
              payload: { decision: "ACCEPT" }
              as: CertificationReviewer
              as_user_id: "rev-1"
          assert:
            - "response.status == 403"
            - "response.error.code == \"ERR_SEGREGATION_OF_DUTIES\""
            - "${nc_raiser} == \"rev-1\""
            - "${nc_status} == \"CA_SUBMITTED\""
            - "${nc_rev} == 0"
            - "Nonconformance.${nc_id}.status == \"CA_SUBMITTED\""
            - "Nonconformance.${nc_id}.ca_decided_by_user_id == null"
            - "Nonconformance.${nc_id}.ca_revision_count == 0"
            - "Nonconformance.${nc_id}.version == ${nc_v2}"
            - "Applicant.${app_id}.open_nc_penalty_points == 8"
            - "Applicant.${app_id}.posture_score_cycle == 92"

  - section: complexity_layers
    instances:
      - name: testing_plan_with_the_pre_label_product_version_is_rejected_as_stale
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.testing-plan-create-stale-product
          - validations.priority_7
          - errors.ERR_STALE_PRODUCT_VERSION
          - endpoints."POST /gfco/products/{productId}/testing-plan"
        distinguishing_aspect: |
          The OCC guard is on the whole Product row, not just on the formula dimension: the
          version the reviewer read at formula clearance is invalidated by a label review, a
          write on the OTHER independent dimension, so the plan activation must be refused
          412 even though nothing about the ingredient set changed. Priority 7 also beats the
          product-state gate, and nothing may be persisted - testing_plan_status stays NONE,
          threshold_ppm stays null and the version must not advance a third time.
        test_recipe:
          setup:
            - "One applicant, one facility (no shared equipment, operations NONE), one supplier and one APPROVED INHERENTLY_GF ingredient."
            - "One STANDARD product with that line at 55 pct whose formula was CLEARED by rev-1; the version returned by that clearance is captured."
            - "The reviewer then approves the label, which bumps the product version again."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/facilities"
              payload: { applicant_id: "${app_id}", site_name: "Plant 9", air_handling_class: "FILTERED_ZONED", shared_equipment_present: false, gluten_containing_operations: "NONE" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /gfco/suppliers"
              payload: { name: "Prairie Mills", country_code: "CA", gluten_handling_disclosed: false }
              as: ProgramAdministrator
              captures: { sup_id: $.data.id }
            - call: "POST /gfco/ingredients"
              payload: { applicant_id: "${app_id}", supplier_id: "${sup_id}", name: "Brown Rice Flour", risk_class: "INHERENTLY_GF" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { ing_id: $.data.id }
            - call: "POST /gfco/supplier-documents"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_id}", doc_type: "ALLERGEN_STATEMENT", issued_on: "2026-07-01T00:00:00Z", expires_on: "2028-07-01T00:00:00Z" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /gfco/supplier-documents/${doc_id}/verification"
              payload: { decision: "APPROVE" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/ingredients/${ing_id}/submission"
              payload: {}
              as: ApplicantContact
              as_user_id: "${app_id}"
            - call: "POST /gfco/ingredients/${ing_id}/review"
              payload: { decision: "APPROVE" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/products"
              payload: { applicant_id: "${app_id}", facility_id: "${fac_id}", name: "Rice Sandwich Loaf", sku: "RSL-001", requested_mark_tier: "STANDARD" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /gfco/product-ingredients"
              payload: { product_id: "${prod_id}", ingredient_id: "${ing_id}", inclusion_pct: 55 }
              as: ApplicantContact
              as_user_id: "${app_id}"
            - call: "POST /gfco/products/${prod_id}/formula-review"
