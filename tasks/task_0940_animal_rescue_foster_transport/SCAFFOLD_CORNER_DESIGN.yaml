      - name: records_freeze_gate_blocks_writes_and_lifts_cleanly
        claim_type: Precondition Enforcement
        grounds:
          - write_gates[gate_order=1]
          - validations[priority=12]
          - state_machines.Organization.UNFROZEN_to_FROZEN
          - state_machines.Organization.FROZEN_to_UNFROZEN
          - errors[ERR_RECORDS_FROZEN]
        distinguishing_aspect: "While records_freeze_active is true, creating a hold on the organization's animal returns ERR_RECORDS_FROZEN with HTTP 409 even though every ordinary precondition holds; reads keep working, and lifting the freeze lets the identical write succeed."
        test_recipe:
          setup: ["One SHELTER organization with one in-custody animal; the organization is FROZEN."]
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
