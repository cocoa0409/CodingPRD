            - "RemediationProject.${proj_id}.status == APPROVED (unchanged)"

  # =========================================================================
  # RULE 8 — resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: inspector_halfopen_window_overlap
        grounds:
          - validations[priority=13]
          - errors[ERR_INSPECTOR_DOUBLE_BOOKED]
          - entities.EnvironmentalInvestigation.fields.scheduled_start
          - entities.EnvironmentalInvestigation.fields.scheduled_end
        distinguishing_aspect: |
          Resource=Inspector, semantics=half-open [start,end): a second
          investigation whose window [11:00,13:00) overlaps the first
          [09:00,12:00) is rejected ERR_INSPECTOR_DOUBLE_BOOKED, but an ADJACENT
          window [12:00,14:00) touching at the endpoint is accepted (no overlap).
        test_recipe:
          setup:
            - "A case in INVESTIGATION with one SCHEDULED investigation for inspector I on 2026-05-05 09:00-12:00."
          setup_api_calls:
            - call: "POST /api/v1/dwellings"
              payload: { street_address: "12 Elm St", year_built: 1950, owner_name: "Acme LLC", jurisdiction: "COUNTY_A" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/v1/children"
              payload: { full_name: "Lu Child", date_of_birth: "2022-03-01", guardian_name: "G Lu", primary_dwelling_id: "${d_id}", income_tier: "LOW" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { ch_id: $.data.id }
            - call: "POST /api/v1/blood-lead-tests"
              payload: { child_id: "${ch_id}", bll_ug_dl: 22.0, specimen_type: "VENOUS", test_kind: "DIAGNOSTIC", collected_at: "2026-05-02T10:00:00Z" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { t1_id: $.data.id }
            - call: "POST /api/v1/cases"
              payload: { child_id: "${ch_id}", dwelling_id: "${d_id}", qualifying_test_id: "${t1_id}" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { case_id: $.data.id }
            - call: "POST /api/v1/inspectors"
              payload: { full_name: "Ivy Inspector", certification_id_number: "RA-001" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { insp_id: $.data.id }
            - call: "POST /api/v1/investigations"
              payload: { case_id: "${case_id}", dwelling_id: "${d_id}", inspector_id: "${insp_id}", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T12:00:00Z" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { inv1_id: $.data.id }
          trigger:
            - call: "POST /api/v1/investigations"
              payload: { case_id: "${case_id}", dwelling_id: "${d_id}", inspector_id: "${insp_id}", scheduled_start: "2026-05-05T11:00:00Z", scheduled_end: "2026-05-05T13:00:00Z" }
              as: CaseManager
              as_user_id: "cm-1"
            - call: "POST /api/v1/investigations"
              payload: { case_id: "${case_id}", dwelling_id: "${d_id}", inspector_id: "${insp_id}", scheduled_start: "2026-05-05T12:00:00Z", scheduled_end: "2026-05-05T14:00:00Z" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { inv3_id: $.data.id }
          assert:
            - "The overlapping [11:00,13:00) create fails with error_id == ERR_INSPECTOR_DOUBLE_BOOKED and HTTP 409"
            - "The adjacent [12:00,14:00) create returns 201 with EnvironmentalInvestigation.${inv3_id}.status == SCHEDULED"

      - name: relocation_unit_buffered_closed_overlap
        grounds:
          - validations[priority=14]
          - errors[ERR_RELOCATION_OVERLAP]
          - entities.RelocationPlacement.fields.start_date
          - entities.RelocationPlacement.fields.end_date
        distinguishing_aspect: |
          Resource=RelocationUnit, semantics=closed [start,end] plus a 3-day
          cleaning buffer: a placement 2026-06-07..2026-06-10 (only 2 days after
          the prior 06-01..06-05) is rejected ERR_RELOCATION_OVERLAP, while a
          placement 06-20..06-25 (15 days later, beyond the buffer) is accepted.
