            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${travel}", expenditure_type: "TRAVEL", amount_cents: 100000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e: $.data.id } }
            - { call: "POST /api/expenditures/${e}/post", payload: {}, as: GrantsAccountant }
            - { call: "GET /api/awards/${aw}", as: GrantsAccountant, captures: { v: $.data.version } }
          trigger:
            - { call: "POST /api/drawdown-requests", payload: { award_id: "${aw}", amount_cents: 50000, expected_award_version: "${v}" }, as: GrantsAccountant, captures: { d1: $.data.id } }
            - { call: "POST /api/drawdown-requests", payload: { award_id: "${aw}", amount_cents: 40000, expected_award_version: "${v}" }, as: GrantsAccountant, captures: { err: $.data.error_id } }
          assert:
            - "d1 created  (first writer at version ${v} succeeds; award version advanced by the create)"
            - "err == ERR_STALE_AWARD_VERSION  (same observed version is now stale)"

      - name: occ_modification_create_stale_award_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[modification-create-stale-award]", "errors[ERR_STALE_AWARD_VERSION]"]
        distinguishing_aspect: "Same OCC rule on a different write endpoint: two sequential NCE creates at the same expected_award_version — the second is rejected 412, so baseline-sensitive modification math is never computed from a stale award read."
        test_recipe:
          setup: ["ACTIVE award (TRAVEL 100000, obligated 150000); version captured"]
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "OC-002", title: "OCC mod", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 150000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "TRAVEL", authorized_cents: 100000 }, as: GrantCoordinator }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer, captures: { v: $.data.version } }
          trigger:
            - { call: "POST /api/modification-requests", payload: { award_id: "${aw}", mod_type: "NO_COST_EXTENSION", extension_months: 6, justification: "first extension at observed version", expected_award_version: "${v}" }, as: GrantCoordinator, captures: { m1: $.data.id } }
            - { call: "POST /api/modification-requests", payload: { award_id: "${aw}", mod_type: "NO_COST_EXTENSION", extension_months: 3, justification: "second extension at stale version", expected_award_version: "${v}" }, as: GrantCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "m1 created and err == ERR_STALE_AWARD_VERSION"

      - name: occ_certify_stale_statement_after_payroll_cascade
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[effort-certify-stale-statement]", "errors[ERR_STALE_STATEMENT_VERSION]"]
        distinguishing_aspect: "The certifier read the generated statement at version 1 (charged 3.47); a payroll posting in the window then cascades charged_effort_pct to 6.94 and bumps the version to 2 — certifying with the old token (version 1) fails 412 ERR_STALE_STATEMENT_VERSION, forcing a re-read of the new charged figure."
        test_recipe:
          setup: ["Award K4 (SAL 1000000 + FRINGE 300000, obligated 1950000), PA committed 50%; cycle CERTIFYING; one salary 416667 already posted (statement v2, charged 3.47)"]
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "P. Alpha", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 24000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pa: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pa}", award_number: "OC-003", title: "OCC certify", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 1950000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "PERSONNEL_SALARIES", authorized_cents: 1000000 }, as: GrantCoordinator, captures: { sal: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "FRINGE_BENEFITS", authorized_cents: 300000 }, as: GrantCoordinator }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/effort-commitments", payload: { award_id: "${aw}", person_id: "${pa}", committed_effort_pct: 50.0, is_key_personnel: true }, as: GrantCoordinator }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${sal}", expenditure_type: "SALARY", person_id: "${pa}", effort_pct: 25.0, period_months: 1, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /api/expenditures/${e1}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/effort-cycles", payload: { cycle_code: "2026-H1", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", cycle_months: 6 }, as: GrantsAccountant, captures: { cyc: $.data.id } }
            - { call: "POST /api/effort-cycles/${cyc}/open", payload: {}, as: GrantsAccountant }
            - { call: "GET /api/effort-statements", payload: { cycle_id: "${cyc}", award_id: "${aw}" }, as: GrantsAccountant, captures: { st: "$.data[0].id", stv: "$.data[0].version", ch1: "$.data[0].charged_effort_pct" } }
          trigger:
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${sal}", expenditure_type: "SALARY", person_id: "${pa}", effort_pct: 25.0, period_months: 1, transaction_date: "2026-04-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e2: $.data.id } }
            - { call: "POST /api/expenditures/${e2}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/effort-statements/${st}/certify", payload: { certified_effort_pct: 3.47, expected_effort_statement_version: "${stv}" }, as: PrincipalInvestigator, as_user_id: "${pa}", captures: { err: $.data.error_id } }
            - { call: "GET /api/effort-statements/${st}", as: GrantsAccountant, captures: { ch2: $.data.charged_effort_pct, v2: $.data.version } }
          assert:
            - "ch1 == 3.47  (one 416667 posting)"
            - "err == ERR_STALE_STATEMENT_VERSION  (the second posting bumped the statement under the certifier)"
            - "ch2 == 6.94 and v2 == 2  (charged recomputed: 833334/12000000 = 6.9445% -> 6.94; a single cascade bump from the generated v1)"

      - name: cascading_side_effects_post_chain
        claim_type: cascading_side_effects
        grounds: [state_machines.Expenditure.PENDING_REVIEW_to_POSTED]
        excluded_because:
          difficulty_instance: "transitive_cascade / expenditure_post_depth4_ledger_cascade"
          rationale: "Depth-4 chain asserted with literals there."

      - name: cascading_side_effects_clock_chain
        claim_type: cascading_side_effects
        grounds: [state_machines.ReportRequirement.PENDING_to_OVERDUE]
        excluded_because:
          difficulty_instance: "transitive_cascade / clock_overdue_posture_frozen_drawdown_cascade"
          rationale: "Overdue -> posture -> drawdown cancel chain asserted there."

      - name: dual_variant_drawdown_and_fringe
        claim_type: dual_variant_calculation
        grounds: [calculations.drawdown_eligible_pool, calculations.fringe_benefit_charge]
        excluded_because:
          difficulty_instance: "dual_variant_calc / loc_cash_basis_vs_invoice_accrual_basis"
          rationale: "Both variant pairs (drawdown basis; fringe provisional/actual) covered by the two rule-1 instances."

      - name: rate_threshold_boundaries_summary
        claim_type: rate_threshold_triggers
        grounds: [calculations.rebudget_significance_test, calculations.late_interest_accrual, calculations.cost_transfer_timeliness]
        excluded_because:
          difficulty_instance: "boundary_precision_check / rebudget_exactly_25pct_not_significant_vs_one_cent_over"
          rationale: "25% ratio, 60/61-day interest, and 90/91-day retroactive boundaries are asserted across the three boundary_precision_check instances plus retroactive_transfer_conditional_countersign."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_post_side_effects
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the post response itself carries POSTED + posted_at, and a GET of the budget line in the very next request already shows spent_cents 40000 — no lag, no recompute endpoint."
        test_recipe:
          setup: ["ACTIVE award IM: TRAVEL 100000 (obligated 150000)"]
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "IM-001", title: "Immediate", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 150000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "TRAVEL", authorized_cents: 100000 }, as: GrantCoordinator, captures: { travel: $.data.id } }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${travel}", expenditure_type: "TRAVEL", amount_cents: 40000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e: $.data.id } }
          trigger:
            - { call: "POST /api/expenditures/${e}/post", payload: {}, as: GrantsAccountant, captures: { st: $.data.status } }
            - { call: "GET /api/budget-lines/${travel}", as: GrantsAccountant, captures: { spent: $.data.spent_cents } }
            - { call: "GET /api/awards/${aw}", as: GrantsAccountant, captures: { pool: $.data.available_draw_pool_cents } }
          assert:
            - "st == POSTED"
            - "spent == 40000 and pool == 60000  (40000 + F&A 20000 visible immediately)"
