              as_user_id: "${p_o_id}"
              captures: { e_o4: $.data.error_id }
          assert:
            - "Trigger 1: HTTP 422 with error_id == ERR_SKU_HAS_NO_COMPONENTS and Sku.${sku_o_id}.status stays DRAFT"
            - "Trigger 2: HTTP 422 with error_id == ERR_PRODUCER_HAS_NO_ACTIVE_SKUS and Producer.${p_o_id}.status stays DRAFT"
            - "Trigger 3: HTTP 422 with error_id == ERR_OBLIGATION_NOT_DETERMINED"
            - "After the component + activate + determine chain: Sku.${sku_o_id}.status == ACTIVE, Producer.${p_o_id}.status == OBLIGATION_DETERMINED, obligated_party_role == NOT_OBLIGATED and annual_packaging_weight_kg == 1.200"
