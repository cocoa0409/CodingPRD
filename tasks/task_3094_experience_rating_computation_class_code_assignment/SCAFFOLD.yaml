# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header is missing or malformed"

  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller role is valid but not allowed for this endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource ID does not exist"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, negative amounts, missing required fields"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is in a state where the requested transition is not allowed"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_*_version does not match current parent version"

  - id: ERR_TEMPORAL_CONFLICT
    http: 409
    condition: "Date range invalid or overlapping effective dates"

  - id: ERR_CLASS_CODE_INACTIVE
    http: 409
    condition: "Referenced ClassCode is not ACTIVE"

  - id: ERR_CLASS_CODE_NOT_RATED
    http: 409
    condition: "ClassCode has no rate in the promulgated RatingTable for the state"

  - id: ERR_CARRIER_NOT_ACTIVE
    http: 409
    condition: "Referenced Carrier is not ACTIVE"

  - id: ERR_EMPLOYER_INACTIVE
    http: 409
    condition: "Referenced Employer is not ACTIVE"

  - id: ERR_STATE_MISMATCH
    http: 409
    condition: "UnitStatReport claim state_code does not match policy state"

  - id: ERR_UNVALIDATED_REPORTS
    http: 409
    condition: "ExperienceModSheet promulgation attempted with SUBMITTED reports included"

  - id: ERR_NOT_ELIGIBLE_FOR_EXPERIENCE_RATING
    http: 409
    condition: "Employer expected losses below eligibility threshold but non-unity mod attempted"

  - id: ERR_MOD_REVISION_REQUIRED
    http: 409
    condition: "A prior promulgated sheet exists and revision_reason is not set on the new sheet"

  - id: ERR_APPEAL_ALREADY_ACTIVE
    http: 409
    condition: "An active ModAppeal already exists for this sheet"

  - id: ERR_INSPECTION_REQUIRED
    http: 409
    condition: "ClassAssignment confirmation attempted with incomplete inspection"

  - id: ERR_INSPECTION_WAIVE_NOT_ALLOWED
    http: 409
    condition: "Inspection waive attempted without a prior completed inspection within 3 years"

  - id: ERR_CLASS_ASSIGNMENT_OVERLAP
    http: 409
    condition: "Another ASSIGNED/CONFIRMED ClassAssignment exists for the same employer with overlapping effective_date"

  - id: ERR_ALREADY_COMBINED
    http: 409
    condition: "Employer is already a member of an ACTIVE CombinabilityGroup"

  - id: ERR_ASSIGNED_RISK_QUOTA_EXCEEDED
    http: 409
    condition: "Carrier assigned_risk_current_load_cents + estimated_annual_premium_cents > assigned_risk_quota_cents"

  - id: ERR_UNDERWRITING_REVIEW_REQUIRED
    http: 409
    condition: "Subject exceeds underwriting threshold but no approved UnderwritingReview exists"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "Same user cannot perform both creation and approval steps"

# =============================================================================
# Table 7: RBAC Matrix (§1.7)
# =============================================================================
roles:
  - name: BureauAdmin
    description: "Bureau superuser: creates bureaus, carriers, employers, class codes, rating tables; promulgates rating tables"
    identity: opaque
    exclusive_operations:
      - "POST /bureaus — Create bureau"
      - "POST /carriers — Create carrier"
      - "POST /employers — Create employer"
      - "POST /class-codes — Create class code"
      - "POST /rating-tables — Create rating table"
      - "POST /rating-tables/{id}/promulgate — Promulgate rating table"
      - "POST /_clock/set_current_utc — Set logical clock"
    shared_operations: []

  - name: CarrierDataReporter
    description: "Carrier user who submits unit statistical reports and creates policies"
    identity: entity_backed:Carrier
    exclusive_operations:
      - "POST /policies — Create policy"
      - "POST /unit-stat-reports — Create unit stat report (including corrections)"
    shared_operations: []

  - name: BureauAnalyst
    description: "Bureau analyst: validates unit stat reports, manages class assignments and disputes, creates and promulgates experience mod sheets, decides appeals, manages ownership changes"
    identity: opaque
    exclusive_operations:
      - "POST /unit-stat-reports/{id}/validate — Validate unit stat report"
      - "POST /class-assignments — Create class assignment"
      - "POST /class-assignments/{id}/assign — Assign class code"
      - "POST /class-assignments/{id}/confirm — Confirm class assignment"
      - "POST /class-assignment-disputes/{id}/review — Review dispute"
      - "POST /class-assignment-disputes/{id}/resolve — Resolve dispute"
      - "POST /experience-mod-sheets — Create experience mod sheet"
      - "POST /experience-mod-sheets/{id}/promulgate — Promulgate mod sheet"
      - "POST /experience-mod-sheets/{id}/finalize — Finalize mod sheet"
      - "POST /mod-appeals/{id}/review — Review appeal"
      - "POST /mod-appeals/{id}/decide — Decide appeal"
      - "POST /ownership-changes — Report ownership change"
      - "POST /ownership-changes/{id}/combine — Combine employers"
      - "POST /ownership-changes/{id}/not_combined — Mark not combinable"
      - "POST /ownership-changes/{id}/reverse — Reverse combinability"
    shared_operations: []

  - name: Inspector
    description: "Field inspector who completes inspections"
    identity: opaque
    exclusive_operations:
      - "POST /inspections/{id}/complete — Complete inspection"
    shared_operations: []

  - name: EmployerRepresentative
    description: "Employer or agent who files disputes and appeals, withdraws assignments"
    identity: entity_backed:Employer
    exclusive_operations:
      - "POST /class-assignments/{id}/withdraw — Withdraw class assignment"
      - "POST /class-assignment-disputes — File class assignment dispute"
      - "POST /class-assignment-disputes/{id}/withdraw — Withdraw dispute"
      - "POST /mod-appeals — File mod appeal"
      - "POST /mod-appeals/{id}/withdraw — Withdraw appeal"
    shared_operations: []

  - name: PoolAdministrator
    description: "Assigned risk pool administrator: creates enrollments, assigns carriers, approves/rejects take-outs"
    identity: opaque
    exclusive_operations:
      - "POST /assigned-risk-enrollments — Create assigned risk enrollment"
      - "POST /assigned-risk-enrollments/{id}/assign — Assign carrier"
      - "POST /assigned-risk-enrollments/{id}/cancel — Cancel enrollment"
      - "POST /assigned-risk-take-outs/{id}/approve — Approve take-out"
      - "POST /assigned-risk-take-outs/{id}/reject — Reject take-out"
    shared_operations: []

  - name: VoluntaryCarrierRepresentative
    description: "Voluntary market carrier user who files take-out requests"
    identity: entity_backed:Carrier
    exclusive_operations:
      - "POST /assigned-risk-take-outs — File take-out"
    shared_operations: []

  - name: Underwriter
    description: "Underwriter who approves/rejects underwriting reviews"
    identity: opaque
    exclusive_operations:
      - "POST /underwriting-reviews/{id}/approve — Approve review"
      - "POST /underwriting-reviews/{id}/reject — Reject review"
    shared_operations: []

  - name: Any
    description: "Shared read access across all roles"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /bureaus/{id} — Get bureau"
      - "GET /carriers/{id} — Get carrier"
      - "GET /employers/{id} — Get employer"
      - "GET /class-codes/{id} — Get class code"
      - "GET /rating-tables/{id} — Get rating table"
      - "GET /policies/{id} — Get policy"
      - "GET /unit-stat-reports/{id} — Get unit stat report"
      - "GET /class-assignments/{id} — Get class assignment"
      - "GET /inspections/{id} — Get inspection"
      - "GET /class-assignment-disputes/{id} — Get dispute"
      - "GET /experience-mod-sheets/{id} — Get experience mod sheet"
      - "GET /mod-appeals/{id} — Get appeal"
      - "GET /ownership-changes/{id} — Get ownership change"
      - "GET /combinability-groups/{id} — Get combinability group"
      - "GET /assigned-risk-enrollments/{id} — Get enrollment"
      - "GET /assigned-risk-take-outs/{id} — Get take-out"
      - "GET /underwriting-reviews/{id} — Get review"
      - "GET /employers/{id}/policies — List employer policies"
      - "GET /policies/{id}/unit-stat-reports — List policy reports"
      - "GET /employers/{id}/class-assignments — List employer assignments"
      - "GET /class-assignments/{id}/inspections — List assignment inspections"
      - "GET /class-assignments/{id}/disputes — List assignment disputes"
      - "GET /employers/{id}/experience-mod-sheets — List employer mod sheets"
      - "GET /experience-mod-sheets/{id}/appeals — List sheet appeals"
      - "GET /employers/{id}/ownership-changes — List employer ownership changes"
      - "GET /employers/{id}/assigned-risk-enrollments — List employer enrollments"
      - "GET /assigned-risk-enrollments/{id}/take-outs — List enrollment take-outs"
      - "GET /carriers/{id}/assigned-risk-enrollments — List carrier enrollments"
      - "GET /policies — List policies"
      - "GET /unit-stat-reports — List unit stat reports"
      - "GET /experience-mod-sheets — List experience mod sheets"
      - "GET /assigned-risk-enrollments — List assigned risk enrollments"
      - "GET /class-assignments — List class assignments"
