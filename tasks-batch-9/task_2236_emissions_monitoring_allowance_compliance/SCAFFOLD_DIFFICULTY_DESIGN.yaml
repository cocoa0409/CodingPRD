            - "PATCH /emissions/units/${unit_id}/dispatch with dispatch_state=ONLINE now returns HTTP 200"
            - "the three holdings buckets sum to 40.000, exactly the opening endowment — the compensation left no drift"

  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: priority_unauthorized_role_beats_missing_facility_lookup
        grounds:
          - validations[priority=3]
          - validations[priority=100]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_FACILITY_NOT_FOUND]
          - endpoints[PATCH /emissions/facilities/{id}]
          - roles.QAAnalyst
        distinguishing_aspect: |
          Pairs the AUTHORIZATION category (priority 3) against the EXISTENCE
          category (priority 100): a QAAnalyst patching a facility id that was
          never created gets 403 ERR_UNAUTHORIZED, proving the role gate runs
          before the row is even looked up.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "exactly one facility exists, and its id is NOT the one used by the trigger"
            - "the literal uuid 00000000-0000-4000-8000-000000000000 belongs to no Facility row"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
          trigger:
            - call: "PATCH /emissions/facilities/00000000-0000-4000-8000-000000000000"
              payload: { max_concurrent_control_outages: 3 }
              as: QAAnalyst
              captures: { error_id: $.data.error_id }
            - call: "PATCH /emissions/facilities/00000000-0000-4000-8000-000000000000"
              payload: { max_concurrent_control_outages: 3 }
              as: RegulatoryReviewer
              captures: { control_error_id: $.data.error_id }
            - call: "PATCH /emissions/facilities/${fac_id}"
              payload: { max_concurrent_control_outages: 3 }
              as: RegulatoryReviewer
          assert:
            - "trigger 1 returns HTTP 403 with error_id == ERR_UNAUTHORIZED (priority 3 wins over priority 100)"
            - "trigger 1 does NOT return 404 and does NOT leak whether the id exists"
            - "trigger 2, identical except for the role, returns HTTP 404 with error_id == ERR_FACILITY_NOT_FOUND"
            - "trigger 3 returns HTTP 200 and Facility.${fac_id}.max_concurrent_control_outages == 3"
            - "Facility.${fac_id}.version == 2 after trigger 3, and no other facility row was created"

      - name: priority_stale_account_version_beats_invalid_vintage_year
        grounds:
          - validations[priority=200]
          - validations[priority=415]
          - concurrency_rules[allowance-transaction-stale-account]
          - errors[ERR_STALE_ACCOUNT_VERSION]
          - errors[ERR_VINTAGE_YEAR_INVALID]
          - endpoints[POST /emissions/allowance-transactions]
        distinguishing_aspect: |
          Pairs the CONCURRENCY/state category (priority 200) against the
          FISCAL-business category (priority 415) on one endpoint: a request
          carrying BOTH a superseded expected_allowance_account_version and
          vintage_year 2030 returns 412 ERR_STALE_ACCOUNT_VERSION, and only once
          the version is refreshed does the vintage rule surface as 422.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one facility with one OPEN AllowanceAccount (ARP_SO2, compliance_year 2026, holdings 5 / 5 / 5)"
            - "the account's version has already been advanced once by a SETTLED 5-ton PURCHASE, so the version captured at creation is stale"
            - "the legal vintage window for this account is {2025, 2026, 2027}"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/allowance-accounts"
              payload: { program: "ARP_SO2", compliance_year: 2026, holdings_current_vintage_tons: 5.0, holdings_prior_vintage_tons: 5.0, holdings_next_vintage_tons: 5.0 }
              as: RegulatoryReviewer
              captures: { acct_id: $.data.id, acct_v_stale: $.data.version }
            - call: "POST /emissions/allowance-transactions"
              payload: { expected_allowance_account_version: "${acct_v_stale}", allowance_account_id: "${acct_id}", transaction_type: "PURCHASE", quantity_tons: 5.0, vintage_year: 2026 }
              as: AllowanceTrader
              captures: { tx0_id: $.data.id, acct_v_after_create: $.data.allowance_account_version_after }
            - call: "POST /emissions/allowance-transactions/${tx0_id}/transition"
              payload: { action: "RECORD" }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
            - call: "POST /emissions/allowance-transactions/${tx0_id}/transition"
              payload: { action: "SETTLE" }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
            - call: "GET /emissions/allowance-accounts/${acct_id}"
              payload: {}
              as: AllowanceTrader
              captures: { acct_v_fresh: $.data.version }
          trigger:
            - call: "POST /emissions/allowance-transactions"
              payload: { expected_allowance_account_version: "${acct_v_stale}", allowance_account_id: "${acct_id}", transaction_type: "PURCHASE", quantity_tons: 3.0, vintage_year: 2030 }
              as: AllowanceTrader
              captures: { error_id: $.data.error_id }
            - call: "POST /emissions/allowance-transactions"
              payload: { expected_allowance_account_version: "${acct_v_fresh}", allowance_account_id: "${acct_id}", transaction_type: "PURCHASE", quantity_tons: 3.0, vintage_year: 2030 }
              as: AllowanceTrader
              captures: { control_error_id: $.data.error_id }
            - call: "POST /emissions/allowance-transactions"
              payload: { expected_allowance_account_version: "${acct_v_fresh}", allowance_account_id: "${acct_id}", transaction_type: "PURCHASE", quantity_tons: 3.0, vintage_year: 2027 }
              as: AllowanceTrader
              captures: { tx1_id: $.data.id }
          assert:
            - "AllowanceAccount.${acct_id}.holdings_current_vintage_tons == 10.000 after the setup PURCHASE settles"
            - "trigger 1 returns HTTP 412 with error_id == ERR_STALE_ACCOUNT_VERSION (priority 200 wins over priority 415)"
            - "trigger 1 creates no AllowanceTransaction row and leaves AllowanceAccount.${acct_id}.version unchanged"
            - "trigger 2, identical except for a fresh version, returns HTTP 422 with error_id == ERR_VINTAGE_YEAR_INVALID"
            - "trigger 2 also creates no AllowanceTransaction row"
            - "trigger 3 returns HTTP 201, AllowanceTransaction.${tx1_id}.status == PROPOSED and AllowanceTransaction.${tx1_id}.vintage_year == 2027"
            - "AllowanceTransaction.${tx1_id}.debited_current_tons == 0.000 and debited_prior_tons == 0.000 and debited_next_tons == 0.000 while still PROPOSED"
            - "GET /emissions/allowance-transactions?allowance_account_id=${acct_id} returns exactly 2 rows"

      - name: priority_monitor_out_of_control_beats_data_availability_floor
        grounds:
          - validations[priority=240]
          - validations[priority=245]
          - validations[priority=345]
          - errors[ERR_MONITOR_OUT_OF_CONTROL]
          - errors[ERR_DATA_AVAILABILITY_BELOW_FLOOR]
          - endpoints[POST /emissions/quarterly-reports/{id}/validate]
          - calculations.monitor_data_availability_pct
        distinguishing_aspect: |
          Pairs the QA-STATE category (priority 240) against the
          DATA-QUALITY-threshold category (priority 345) — and, as a second
          collision inside the same call, against ERR_MONITOR_NOT_CERTIFIED at
          priority 245 which the same OUT_OF_CONTROL monitor also violates; the
          75.0 % availability shortfall only becomes observable after the
          monitor is restored.
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "unit U1 with one SO2 CEM certified and CAL_CURRENT"
            - "a DRAFT 2026 Q2 report carrying 20 identical MEASURED CEMS hours from 00:00 through 19:00 (flow 8000000, co2 12.5, so2 220 ppm, nox 0.180, op 1.0)"
            - "the monitor is then declared OUT_OF_CONTROL effective 2026-04-01T15:00:00Z, flipping the last 5 hours to UNAVAILABLE and leaving availability at 15/20"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
