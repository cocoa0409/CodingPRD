# §1.8 Scaffold Difficulty Design - Test Targeting Index
# Task 2635 - Real Estate Commission Licensing & Discipline
# Nine Difficulty Rules x >= 2 instances each. Every instance grounds in
# SCAFFOLD.yaml §1.1-§1.7 only; deleting this file changes no declared behavior.
# The logical clock starts at the mandatory default 2026-08-01T00:00:00Z in
# every chain below unless a POST /commission/_clock/set_current_utc moves it.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: trust_shortage_book_basis_vs_bank_basis_diverge_on_one_ledger
        grounds:
          - calculations.trust_account_shortage
          - entities.TrustAudit.fields.computed_shortage_cents
          - entities.TrustAccount.fields.shortage_cents
          - state_machines.TrustAudit.SCHEDULED_to_FIELDWORK
        distinguishing_aspect: |
          One identical three-row ledger yields computed_shortage_cents == 200000 under the book_basis
          variant and 700000 under the bank_basis variant, because the obligation side is filtered by
          effective_date on both bases while only the cash side is filtered by cleared_date on BANK.
        test_recipe:
          setup:
            - "brokerage Harbor Realty Group is ACTIVE with designated broker Dana Broker (BROKER, ACTIVE) and one OPEN ESCROW trust account"
            - "the ledger holds exactly three rows: OBLIGATION_OPENED 500000 effective 2026-07-10, DEPOSIT 500000 effective 2026-07-10 with cleared_date null, DISBURSEMENT 200000 effective 2026-07-15 cleared 2026-07-16"
            - "two audits of that account are SCHEDULED for auditor aud-1 over the same window, one with basis BOOK and one with basis BANK (as_of_date 2026-07-31, cleared_through_date 2026-07-20 on the BANK audit)"
            - "the logical clock stands at 2026-08-05T00:00:00Z, inside both fieldwork windows"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
              payload: { score: 88, taken_on: "2026-07-01" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages"
              payload: { name: "Harbor Realty Group", designated_broker_id: "${br_id}", trust_account_required: true, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { bkg_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_id}/trust-accounts"
              payload: { bank_name: "First Harbor Bank", account_type: "ESCROW" }
              as: LicensingAnalyst
              captures: { ta_id: $.data.id, ta_v0: $.data.version }
            - call: "POST /commission/brokerages/${bkg_id}/activation"
              payload: { attestation_note: "escrow account verified" }
              as: LicensingAnalyst
              captures: { bkg_v1: $.data.version }
            - call: "POST /commission/licensees/${br_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v1}" }
              as: LicensingAnalyst
            - call: "POST /commission/trust-accounts/${ta_id}/ledger-entries"
              payload: { entry_type: "OBLIGATION_OPENED", amount_cents: 500000, effective_date: "2026-07-10", transaction_reference: "OBL-4400", memo: "earnest money held for 12 Bay St", expected_trust_account_version: "${ta_v0}" }
              as: LicensingAnalyst
            - call: "GET /commission/trust-accounts/${ta_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { ta_v1: $.data.version }
            - call: "POST /commission/trust-accounts/${ta_id}/ledger-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 500000, effective_date: "2026-07-10", transaction_reference: "DEP-4401", memo: "buyer wire, not yet cleared", expected_trust_account_version: "${ta_v1}" }
              as: LicensingAnalyst
            - call: "GET /commission/trust-accounts/${ta_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { ta_v2: $.data.version }
            - call: "POST /commission/trust-accounts/${ta_id}/ledger-entries"
              payload: { entry_type: "DISBURSEMENT", amount_cents: 200000, effective_date: "2026-07-15", cleared_date: "2026-07-16", transaction_reference: "DIS-4402", memo: "repair credit paid out", expected_trust_account_version: "${ta_v2}" }
              as: LicensingAnalyst
            - call: "POST /commission/trust-accounts/${ta_id}/audits"
              payload: { auditor_user_id: "aud-1", basis: "BOOK", as_of_date: "2026-07-31", fieldwork_start_at: "2026-08-03T09:00:00Z", fieldwork_end_at: "2026-08-07T17:00:00Z" }
              as: TrustAuditor
              as_user_id: "aud-1"
              captures: { au_book_id: $.data.id }
            - call: "POST /commission/trust-accounts/${ta_id}/audits"
              payload: { auditor_user_id: "aud-1", basis: "BANK", as_of_date: "2026-07-31", fieldwork_start_at: "2026-08-03T09:00:00Z", fieldwork_end_at: "2026-08-07T17:00:00Z" }
              as: TrustAuditor
              as_user_id: "aud-1"
              captures: { au_bank_id: $.data.id }
            - call: "POST /commission/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: TrustAuditor
          trigger:
            - call: "POST /commission/trust-audits/${au_book_id}/fieldwork"
              payload: {}
              as: TrustAuditor
              as_user_id: "aud-1"
              captures: { book_shortage: $.data.computed_shortage_cents }
            - call: "POST /commission/trust-audits/${au_bank_id}/fieldwork"
              payload: { bank_statement_balance_cents: 300000, cleared_through_date: "2026-07-20" }
              as: TrustAuditor
              as_user_id: "aud-1"
              captures: { bank_shortage: $.data.computed_shortage_cents }
          assert:
            - "TrustAudit.${au_book_id}.computed_shortage_cents == 200000"
            - "TrustAudit.${au_bank_id}.computed_shortage_cents == 700000"
            - "TrustAudit.${au_bank_id}.computed_shortage_cents - TrustAudit.${au_book_id}.computed_shortage_cents == 500000, the uncleared DEPOSIT of 500000 that the BANK variant excludes"
            - "TrustAudit.${au_book_id}.status == FIELDWORK and TrustAudit.${au_bank_id}.status == FIELDWORK"
            - "TrustAccount.${ta_id}.book_obligation_cents == 500000"
            - "TrustAccount.${ta_id}.book_available_cents == 300000"
            - "TrustAccount.${ta_id}.shortage_cents == 200000 (the account always carries the book_basis figure, never the bank one)"
      - name: complaint_priority_intake_variant_omits_posture_bump_investigation_variant_applies_it
        grounds:
          - calculations.complaint_priority_score
          - calculations.brokerage_supervision_posture
          - entities.Complaint.fields.priority_score
          - state_machines.Complaint.SUBMITTED_to_INVESTIGATION
        distinguishing_aspect: |
          The same complaint row scores 43 at intake and 48 once it reaches INVESTIGATION: the intake
          variant sums only base + harm, while the investigation variant adds prior + the WATCH
          posture bump of 5 earned by the respondent brokerage's 50000-cent book shortage.
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with designated broker Dana Broker and salesperson Sam Sales (ACTIVE) affiliated"
            - "the brokerage's ESCROW account carries a single OBLIGATION_OPENED 50000 row, so shortage_cents == 50000 and supervision_posture == WATCH (below the 100000 RESTRICTED threshold)"
            - "Sam Sales has prior_sanction_count == 0"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
              payload: { score: 88, taken_on: "2026-07-01" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages"
              payload: { name: "Harbor Realty Group", designated_broker_id: "${br_id}", trust_account_required: true, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { bkg_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_id}/trust-accounts"
              payload: { bank_name: "First Harbor Bank", account_type: "ESCROW" }
              as: LicensingAnalyst
              captures: { ta_id: $.data.id, ta_v0: $.data.version }
            - call: "POST /commission/brokerages/${bkg_id}/activation"
              payload: { attestation_note: "escrow account verified" }
              as: LicensingAnalyst
              captures: { bkg_v1: $.data.version }
            - call: "POST /commission/licensees/${br_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v1}" }
              as: LicensingAnalyst
            - call: "POST /commission/licensees"
              payload: { person_type: "SALESPERSON", full_name: "Sam Sales", prelicense_hours: 90 }
              as: LicensingAnalyst
              captures: { sp_id: $.data.id }
            - call: "POST /commission/licensees/${sp_id}/exam-results"
              payload: { score: 80, taken_on: "2026-07-05" }
              as: LicensingAnalyst
            - call: "GET /commission/brokerages/${bkg_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { bkg_v2: $.data.version }
            - call: "POST /commission/licensees/${sp_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v2}" }
              as: LicensingAnalyst
            - call: "POST /commission/trust-accounts/${ta_id}/ledger-entries"
              payload: { entry_type: "OBLIGATION_OPENED", amount_cents: 50000, effective_date: "2026-07-20", transaction_reference: "OBL-9001", memo: "small deposit held", expected_trust_account_version: "${ta_v0}" }
              as: LicensingAnalyst
            - call: "POST /commission/complaints"
              payload: { complainant_name: "Ruth Payne", respondent_licensee_id: "${sp_id}", allegation_type: "MISREPRESENTATION", alleged_loss_cents: 350000, narrative: "square footage misstated in the listing" }
              as: Public
              as_user_id: "pub-1"
              captures: { cmp_id: $.data.id, intake_score: $.data.priority_score }
          trigger:
            - call: "POST /commission/complaints/${cmp_id}/disposition"
              payload: { disposition: "INVESTIGATE", investigator_user_id: "counsel-1", note: "opening investigation" }
              as: CommissionCounsel
              as_user_id: "counsel-1"
              captures: { inv_score: $.data.priority_score }
          assert:
            - "the intake response's Complaint.${cmp_id}.priority_score == 43 (40 MISREPRESENTATION + 3 harm)"
            - "after INVESTIGATE, Complaint.${cmp_id}.priority_score == 48 (40 + 3 + 0 prior + 5 WATCH posture bump)"
            - "Brokerage.${bkg_id}.supervision_posture == WATCH"
            - "Brokerage.${bkg_id}.open_shortage_cents == 50000"
            - "Complaint.${cmp_id}.status == INVESTIGATION"
            - "Licensee.${sp_id}.discipline_status == UNDER_INVESTIGATION"
  - rule_id: combinatorial_formula
    instances:
      - name: reactivation_fee_three_modes_over_late_periods_and_excess_ce_hours
        grounds:
          - calculations.reactivation_fee_assessment
          - calculations.ce_requirement_hours
          - validations[priority=51]
          - state_machines.Licensee.INACTIVE_to_ACTIVE
        distinguishing_aspect: |
          Three reactivations of three licensees inactive since the same instant produce three
          different fees - 15000, 24078 and 66312 cents - because mode a has 0 late periods and 0
          excess CE hours, mode b has 6 late periods and 3 excess hours, and mode c has 36 elapsed
          periods clamped to the LATE_PERIOD_CAP of 24 combined with 18 excess hours.
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with designated broker Dana Broker (ACTIVE) and no trust ledger activity, so supervision_posture == COMPLIANT"
            - "education provider Coastal RE Academy is APPROVED with APPROVED instructor Tia Teach"
            - "salespersons Lee One, Lee Two and Lee Three were each issued on 2026-08-01 and went INACTIVE at 2026-08-01T00:00:00Z, so inactive_since is identical for all three"
            - "Lee One holds 12 valid CE hours, Lee Two holds 15, Lee Three holds 30, all completed on 2026-08-01 inside the CE period that started 2026-08-01"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
              payload: { score: 88, taken_on: "2026-07-01" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages"
              payload: { name: "Harbor Realty Group", designated_broker_id: "${br_id}", trust_account_required: false, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { bkg_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_id}/activation"
              payload: { attestation_note: "no trust account required" }
              as: LicensingAnalyst
              captures: { bkg_v1: $.data.version }
            - call: "POST /commission/licensees/${br_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v1}" }
              as: LicensingAnalyst
            - call: "POST /commission/education-providers"
              payload: { name: "Coastal RE Academy" }
              as: LicensingAnalyst
              captures: { ep_id: $.data.id }
            - call: "POST /commission/education-providers/${ep_id}/approval"
              payload: { approval_years: 2 }
              as: LicensingAnalyst
            - call: "POST /commission/education-providers/${ep_id}/instructors"
              payload: { full_name: "Tia Teach", credential_type: "SUBJECT_EXPERT" }
              as: LicensingAnalyst
              captures: { ins_id: $.data.id }
            - call: "POST /commission/instructors/${ins_id}/approval"
              payload: { approval_note: "credentials on file" }
              as: LicensingAnalyst
            - call: "POST /commission/licensees"
              payload: { person_type: "SALESPERSON", full_name: "Lee One", prelicense_hours: 90 }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /commission/licensees/${l1_id}/exam-results"
              payload: { score: 80, taken_on: "2026-07-05" }
              as: LicensingAnalyst
            - call: "GET /commission/brokerages/${bkg_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { bkg_v2: $.data.version }
            - call: "POST /commission/licensees/${l1_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v2}" }
              as: LicensingAnalyst
            - call: "POST /commission/licensees"
              payload: { person_type: "SALESPERSON", full_name: "Lee Two", prelicense_hours: 90 }
              as: LicensingAnalyst
              captures: { l2_id: $.data.id }
            - call: "POST /commission/licensees/${l2_id}/exam-results"
              payload: { score: 81, taken_on: "2026-07-05" }
              as: LicensingAnalyst
            - call: "GET /commission/brokerages/${bkg_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { bkg_v3: $.data.version }
            - call: "POST /commission/licensees/${l2_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v3}" }
              as: LicensingAnalyst
            - call: "POST /commission/licensees"
              payload: { person_type: "SALESPERSON", full_name: "Lee Three", prelicense_hours: 90 }
              as: LicensingAnalyst
              captures: { l3_id: $.data.id }
            - call: "POST /commission/licensees/${l3_id}/exam-results"
              payload: { score: 82, taken_on: "2026-07-05" }
              as: LicensingAnalyst
            - call: "GET /commission/brokerages/${bkg_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { bkg_v4: $.data.version }
            - call: "POST /commission/licensees/${l3_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v4}" }
              as: LicensingAnalyst
            - call: "POST /commission/licensees/${l1_id}/status-changes"
              payload: { action: "GO_INACTIVE" }
              as: Salesperson
              as_user_id: "${l1_id}"
            - call: "POST /commission/licensees/${l2_id}/status-changes"
              payload: { action: "GO_INACTIVE" }
              as: Salesperson
              as_user_id: "${l2_id}"
            - call: "POST /commission/licensees/${l3_id}/status-changes"
              payload: { action: "GO_INACTIVE" }
              as: Salesperson
              as_user_id: "${l3_id}"
            - call: "POST /commission/course-completions"
              payload: { licensee_id: "${l1_id}", instructor_id: "${ins_id}", education_provider_id: "${ep_id}", course_type: "CE_CORE", credit_hours: 12, completed_on: "2026-08-01" }
              as: LicensingAnalyst
            - call: "POST /commission/course-completions"
              payload: { licensee_id: "${l2_id}", instructor_id: "${ins_id}", education_provider_id: "${ep_id}", course_type: "CE_CORE", credit_hours: 12, completed_on: "2026-08-01" }
              as: LicensingAnalyst
            - call: "POST /commission/course-completions"
              payload: { licensee_id: "${l2_id}", instructor_id: "${ins_id}", education_provider_id: "${ep_id}", course_type: "CE_ELECTIVE", credit_hours: 3, completed_on: "2026-08-01" }
              as: LicensingAnalyst
            - call: "POST /commission/course-completions"
              payload: { licensee_id: "${l3_id}", instructor_id: "${ins_id}", education_provider_id: "${ep_id}", course_type: "CE_CORE", credit_hours: 12, completed_on: "2026-08-01" }
              as: LicensingAnalyst
            - call: "POST /commission/course-completions"
              payload: { licensee_id: "${l3_id}", instructor_id: "${ins_id}", education_provider_id: "${ep_id}", course_type: "CE_ELECTIVE", credit_hours: 12, completed_on: "2026-08-01" }
              as: LicensingAnalyst
            - call: "POST /commission/course-completions"
              payload: { licensee_id: "${l3_id}", instructor_id: "${ins_id}", education_provider_id: "${ep_id}", course_type: "CE_ELECTIVE", credit_hours: 6, completed_on: "2026-08-01" }
              as: LicensingAnalyst
          trigger:
            - call: "POST /commission/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: LicensingAnalyst
            - call: "POST /commission/licensees/${l1_id}/status-changes"
              payload: { action: "REACTIVATE", brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", reinstatement_fee_paid_cents: 15000 }
              as: Salesperson
              as_user_id: "${l1_id}"
            - call: "POST /commission/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: LicensingAnalyst
            - call: "POST /commission/licensees/${l2_id}/status-changes"
              payload: { action: "REACTIVATE", brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", reinstatement_fee_paid_cents: 24078 }
              as: Salesperson
              as_user_id: "${l2_id}"
            - call: "POST /commission/_clock/set_current_utc"
              payload: { to_iso8601: "2029-08-01T00:00:00Z" }
              as: LicensingAnalyst
            - call: "POST /commission/licensees/${l3_id}/status-changes"
              payload: { action: "REACTIVATE", brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", reinstatement_fee_paid_cents: 66312 }
              as: Salesperson
              as_user_id: "${l3_id}"
          assert:
            - "mode a: the 2026-08-20 reactivation of ${l1_id} returns 200 - 19 elapsed days give late_periods == 0 and ce_hours_required == 12, so the exact fee is 15000"
            - "mode b: the 2027-02-01 reactivation of ${l2_id} returns 200 - 184 elapsed days give late_periods == 6 and ce_hours_required == 15, so the exact fee is 15000 + 2500 x 3 + 263 x 6 == 24078"
            - "mode c: the 2029-08-01 reactivation of ${l3_id} returns 200 - 1096 elapsed days give 36 elapsed periods clamped to 24 and ce_hours_required == 30, so the exact fee is 15000 + 2500 x 18 + 263 x 24 == 66312"
            - "Licensee.${l1_id}.license_status == ACTIVE and Licensee.${l1_id}.ce_hours_valid == 0"
            - "Licensee.${l2_id}.license_status == ACTIVE and Licensee.${l2_id}.ce_hours_valid == 0"
            - "Licensee.${l3_id}.license_status == ACTIVE and Licensee.${l3_id}.ce_hours_valid == 0"
            - "the three fees are pairwise different: 15000 != 24078 != 66312"
      - name: ce_requirement_hours_four_modes_across_inactive_duration_bands
        grounds:
          - calculations.ce_requirement_hours
          - entities.Licensee.fields.ce_hours_required
          - entities.Licensee.fields.inactive_since
          - state_machines.Licensee.ACTIVE_to_INACTIVE
        distinguishing_aspect: |
          One INACTIVE licensee with a fixed inactive_since reports ce_hours_required == 12, 15, 30 and
          36 at four clock positions, because the 30-day month floor, the per-six-month increment and
          the CE_HOUR_CAP each dominate a different band; only the fourth mode is cap-bound.
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with designated broker Dana Broker"
            - "salesperson Kim Park was issued on 2026-08-01 and went INACTIVE at 2026-08-01T00:00:00Z"
            - "no compliance sweep is ever run, so the licence stays INACTIVE while the clock advances eight years"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
              payload: { score: 88, taken_on: "2026-07-01" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages"
              payload: { name: "Harbor Realty Group", designated_broker_id: "${br_id}", trust_account_required: false, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { bkg_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_id}/activation"
              payload: { attestation_note: "no trust account required" }
              as: LicensingAnalyst
              captures: { bkg_v1: $.data.version }
            - call: "POST /commission/licensees/${br_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v1}" }
              as: LicensingAnalyst
            - call: "POST /commission/licensees"
              payload: { person_type: "SALESPERSON", full_name: "Kim Park", prelicense_hours: 90 }
              as: LicensingAnalyst
              captures: { kp_id: $.data.id }
            - call: "POST /commission/licensees/${kp_id}/exam-results"
              payload: { score: 79, taken_on: "2026-07-06" }
              as: LicensingAnalyst
            - call: "GET /commission/brokerages/${bkg_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { bkg_v2: $.data.version }
            - call: "POST /commission/licensees/${kp_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v2}" }
              as: LicensingAnalyst
            - call: "POST /commission/licensees/${kp_id}/status-changes"
              payload: { action: "GO_INACTIVE" }
              as: Salesperson
              as_user_id: "${kp_id}"
          trigger:
            - call: "POST /commission/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: LicensingAnalyst
            - call: "GET /commission/licensees/${kp_id}"
              payload: {}
              as: LicensingAnalyst
