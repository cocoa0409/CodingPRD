        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[labor-rate-request-create-stale-dealer]
          - errors[ERR_STALE_DEALER_VERSION]
          - entities.Dealer.fields.version
        distinguishing_aspect: |
          The approval of the first petition is a legitimate write that advances Dealer.version, so the second
          petition's expected_dealer_version - captured before that approval - is stale even though nothing in
          the LaborRateRequest state machine would block a fresh request.
        test_recipe:
          setup:
            - "WORLD-BRAKE without a claim; D1's version was captured before any petition existed."
            - "A first petition for 17600 / 0.30 was reviewed and APPROVED, writing D1's rate to 17600 and advancing D1.version."
            - "The new ceiling is min(19500, max(19000, round_half_up(17600 * 1.25) = 22000)) == 19500, so 19000 is inside it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
