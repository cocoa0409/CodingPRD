              as: DesignEngineer
              as_user_id: "${de1_id}"
              captures: { calc_id: $.data.id }
          assert:
            - "DesignCalculation.${calc_id}.thickness_circumferential_in == 0.6073, the 4-decimal round_half_up of 350*30/(17500*1.00 - 0.6*350) = 0.607287..."
            - "DesignCalculation.${calc_id}.thickness_longitudinal_in == 0.2988, the 4-decimal round_half_up of 350*30/(2*17500*1.00 + 0.4*350) = 0.298805..."
            - "DesignCalculation.${calc_id}.thickness_required_in == 0.6698 == round_half_up(0.607287... + 0.0625, 4), so the allowance appears once and only in this field"
            - "0.6073 + 0.2988 does not appear anywhere: the two variants are alternatives, never summed"
            - "DesignCalculation.${calc_id}.governing_variant == CIRCUMFERENTIAL because the circumferential raw value exceeds the longitudinal one"

      - name: calculation_welder_continuity_lapses_only_past_one_hundred_eighty_days
