              as: CorporateAdmin
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /turf/parts-orders"
              payload: { order_type: "STOCK", lines: [{ part_id: "${p1}", qty: 0 }] }
              as: DistributorManager
