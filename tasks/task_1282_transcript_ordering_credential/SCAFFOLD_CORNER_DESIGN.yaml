        claim_type: correct_result
        grounds: [calculations.gpa_cents_recompute]
        distinguishing_aspect: "GPA is a weighted average over (grade_points * credits); for courses (4.0, 3) and (2.0, 1) the expected output is (12+2)/4 = 3.5 -> 350 cents."
        test_recipe:
          setup: ["Student exists"]
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload: { student_number: "SC001001", full_name: "G Calc", date_of_birth: "2000-01-01", email: "g@x.edu" }
              as: RegistrarAdmin
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /registrar/students/${sid}/records"
              payload:
                effective_term: "2026-SPR"
                earned_credits: 4
                courses:
                  - { grade_points: 4.0, credits: 3 }
                  - { grade_points: 2.0, credits: 1 }
              as: RegistrarAdmin
              captures: { gpa: $.data.gpa_cents }
          assert:
            - "gpa == 350"

