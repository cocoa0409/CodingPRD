  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency: two dependencies across DIFFERENT
  # entity pairs.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: workshop_payment_requires_gift_card_active_state
        grounds:
          - state_machines.WorkshopSession.DRESSED_to_PAID
          - state_machines.GiftCard.ACTIVE_to_DISABLED
          - "validations[priority=10]"
        distinguishing_aspect: |
          Pair (WorkshopSession -> GiftCard): the DRESSED -> PAID transition is
          gated on the GiftCard entity's state; a DISABLED card blocks payment
          with ERR_GIFT_CARD_INSUFFICIENT even when its balance would cover the
          session total.
        test_recipe:
          setup:
            - "Store S13; Customer C13; non-licensed model (3000); consumables/stations provisioned"
            - "Session W13 at DRESSED; GiftCard GC13 balance 10000 but DISABLED"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Card State Store", party_room_count: 1 }
              as: StoreManager
              captures: { store13: $.data.id }
            - call: "POST /customers"
              payload: { email: "c13@example.com", full_name: "Casey Thirteen" }
              as: Customer
              captures: { cust13: $.data.id }
            - call: "POST /plush-models"
              payload: { name: "Card Crane", sku: "CCR-01", base_price_cents: 3000, is_licensed: false, required_stuffing_grams: 200, sound_chip_compatible: false }
              as: StoreManager
              captures: { model13: $.data.id }
            - call: "POST /consumables"
              payload: { store_id: "${store13}", consumable_type: "STUFFING_FIBER", initial_qty: 5000 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${store13}", station_type: "STUFF", capacity: 2 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${store13}", station_type: "SOUND", capacity: 2 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${store13}", station_type: "BATHE", capacity: 2 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${store13}", station_type: "DRESS", capacity: 2 }
              as: StoreManager
            - call: "POST /gift-cards"
              payload: { code: "GC-DIS", initial_balance_cents: 10000 }
              as: StoreManager
              captures: { gc13: $.data.id }
            - call: "POST /gift-cards/${gc13}/disable"
              payload: {}
              as: StoreManager
            - call: "POST /workshops"
              payload: { store_id: "${store13}", customer_id: "${cust13}", plush_model_id: "${model13}", origin_type: "WALK_IN" }
              as: WorkshopAssociate
              captures: { w13: $.data.id }
            - call: "POST /workshops/${w13}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /workshops/${w13}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /workshops/${w13}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /workshops/${w13}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /workshops/${w13}/advance-step"
              payload: {}
              as: WorkshopAssociate
          trigger:
            - call: "POST /workshops/${w13}/payment"
              payload: { payment_amount_cents: 3000, pay_tender: "GIFT_CARD", gift_card_id: "${gc13}" }
              as: Customer
              as_user_id: "${cust13}"
              captures: { err5: $.data.error_id }
          assert:
            - "err5 == ERR_GIFT_CARD_INSUFFICIENT (WorkshopSession PAID transition gated on GiftCard.state == ACTIVE; DISABLED blocks despite 10000 >= 3000)"

      - name: party_finalize_requires_all_guest_sessions_terminal
        grounds:
          - state_machines.PartyReservation.CONFIRMED_to_COMPLETED
          - state_machines.PartyGuest.CONFIRMED_to_ATTENDED
          - state_machines.PartyGuest.CONFIRMED_to_NO_SHOW
        distinguishing_aspect: |
          Pair (PartyReservation -> PartyGuest/WorkshopSession): finalize is
          rejected while any CONFIRMED guest's session is still non-terminal
          (neither ATTENDED nor NO_SHOW). Driving the last open session to
          ABANDONED (guest -> NO_SHOW) unblocks the identical finalize call.
        test_recipe:
          setup:
            - "Store S14; Customer C14; BASIC party P14 6 guests SELF_GUIDED confirmed; guest G14 confirmed"
            - "Clock at party end; G14's session still in SELECT (not terminal)"
          setup_api_calls:
