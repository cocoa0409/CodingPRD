      - refund_offset_cents is 0 because no return has settled.
      - GET /customers/${cust_id}/ledger reports allowance_used_cents 15000 and allowance_remaining_cents 0.
  - name: claim_recomputed_after_settled_refund_offset
    grounds: §1.3 step 2 of insurance_reimbursable_cents subtracts every SETTLED return settlement from gross spend before the allowance is applied, and §1.2 return settlement writes refund_offset_cents onto DRAFT claims on the order.
    distinguishing_aspect: Applying the refund after the allowance leaves applied_allowance_cents at 15000 and reimbursable_cents at 15340; ignoring the refund entirely gives the same. Only subtracting 7359 first yields base_eligible_cents 11841, applied_allowance_cents 11841, coinsurance_cents 0, pre_fee_subtotal_cents 11841, processing_fee_cents 250 and reimbursable_cents 11591.
