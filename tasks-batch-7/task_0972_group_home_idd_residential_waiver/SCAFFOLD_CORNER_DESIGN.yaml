  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: request_missing_auth_headers_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role fails before any role or existence check (priority 1 first)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /agencies", payload: { name: "Agency A" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400)"

      - name: role_identity_mismatch_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2.5]", "errors[ERR_ROLE_IDENTITY_MISMATCH]"]
        distinguishing_aspect: "Entity-backed identity: X-User-Role DSP with the id of a StaffMember whose staff_role is CASE_MANAGER is rejected before business logic."
        test_recipe:
          setup: ["Agency with one CASE_MANAGER staff member"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
          trigger:
            - { call: "POST /incidents", payload: { individual_id: "${cm_id}", home_id: "${cm_id}", category: "INJURY", severity: "LOW", occurred_at: "2026-06-02T08:00:00Z", discovered_at: "2026-06-02T08:30:00Z", description: "Identity mismatch probe body" }, as: DSP, as_user_id: "${cm_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ROLE_IDENTITY_MISMATCH (403) — the role header and the staff record disagree, checked before existence"

      - name: authorization_span_outside_isp_year_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6.3]", "errors[ERR_OUT_OF_SPAN]"]
