    code: 201
    input: [name, home_country_code, "functional_currency?", "cost_overrun_threshold_pct?", "max_assignment_duration_days?", "per_diem_annual_day_cap?"]
    output: MobilityProgram
    side_effects: ["status=ACTIVE, total_posted_chargeback_cents=0"]
  - method: GET
    path: "/mobility/programs/{id}"
    description: "Get a program"
    roles: [MobilityAdmin, BusinessUnitApprover, MobilityApprover, PayrollSpecialist, FinanceController, VendorCoordinator, TaxVendor, Assignee, Any]
    code: 200
    input: []
    output: MobilityProgram
    side_effects: []

  # --- Employee ---
  - method: POST
    path: "/mobility/employees"
    description: "Create an employee"
    roles: [MobilityAdmin]
    code: 201
    input: [employee_ref, full_name, home_country_code, "family_size?", annual_base_salary_cents]
    output: Employee
    side_effects: []
  - method: GET
    path: "/mobility/employees/{id}"
    description: "Get an employee"
    roles: [MobilityAdmin, BusinessUnitApprover, MobilityApprover, PayrollSpecialist, FinanceController, VendorCoordinator, TaxVendor, Assignee, Any]
    code: 200
    input: []
    output: Employee
    side_effects: []

  # --- AllowancePolicy ---
  - method: POST
    path: "/mobility/allowance-policies"
    description: "Create an allowance policy; half-open [effective_from, effective_to) windows for the same host_country_code with status ACTIVE must not overlap (adjacency allowed)"
    roles: [MobilityAdmin]
    code: 201
    input: [policy_name, host_country_code, effective_from, effective_to, per_diem_daily_cents, housing_monthly_cap_cents, "cola_pct?"]
    output: AllowancePolicy
    side_effects: ["status=ACTIVE; ERR_POLICY_WINDOW_OVERLAP on half-open overlap; ERR_INVALID_REQUEST when effective_to <= effective_from"]
  - method: GET
    path: "/mobility/allowance-policies/{id}"
    description: "Get a policy"
    roles: [MobilityAdmin, BusinessUnitApprover, MobilityApprover, PayrollSpecialist, FinanceController, VendorCoordinator, TaxVendor, Assignee, Any]
    code: 200
    input: []
    output: AllowancePolicy
    side_effects: []
  - method: GET
    path: "/mobility/allowance-policies"
    description: "List policies Results ordered by created_at ascending (stable creation order)."
    roles: [MobilityAdmin, BusinessUnitApprover, MobilityApprover, PayrollSpecialist, FinanceController, VendorCoordinator, TaxVendor, Assignee, Any]
    code: 200
    input: ["host_country_code?", "limit?", "offset?"]
    output: "AllowancePolicy[]"
    side_effects: []

  # --- Assignment ---
  - method: POST
    path: "/mobility/assignments"
    description: "Create an assignment in DRAFT; same-employee closed-interval overlap with any assignment in DRAFT, PENDING_BU_APPROVAL, PENDING_MOBILITY_APPROVAL, ACTIVE, or REPATRIATION_PENDING is rejected"
    roles: [MobilityAdmin]
    code: 201
    input: [program_id, employee_id, policy_id, host_country_code, host_business_unit, assignment_type, totalization_applies, start_date, planned_end_date]
    output: Assignment
    side_effects: ["status=DRAFT, cost_posture=NORMAL, ytd counters 0; ERR_ASSIGNMENT_OVERLAP on closed-interval clash; ERR_INVALID_REQUEST when planned_end_date < start_date or duration > program.max_assignment_duration_days (ERR_MAX_DURATION_EXCEEDED, 422)"]
  - method: GET
    path: "/mobility/assignments/{id}"
    description: "Get an assignment"
    roles: [MobilityAdmin, BusinessUnitApprover, MobilityApprover, PayrollSpecialist, FinanceController, VendorCoordinator, TaxVendor, Assignee, Any]
    code: 200
    input: []
    output: Assignment
    side_effects: []
  - method: GET
    path: "/mobility/assignments"
    description: "List assignments (FK reverse-reachability for program_id, employee_id, policy_id) Results ordered by created_at ascending (stable creation order)."
    roles: [MobilityAdmin, BusinessUnitApprover, MobilityApprover, PayrollSpecialist, FinanceController, VendorCoordinator, TaxVendor, Assignee, Any]
    code: 200
    input: ["program_id?", "employee_id?", "policy_id?", "status?", "limit?", "offset?"]
    output: "Assignment[]"
    side_effects: []
  - method: POST
    path: "/mobility/assignments/{id}/submit"
    description: "Submit assignment for dual approval (DRAFT -> PENDING_BU_APPROVAL)"
    roles: [MobilityAdmin]
    code: 200
    input: []
    output: Assignment
    side_effects: ["submitted_by_user_id recorded"]
  - method: POST
    path: "/mobility/assignments/{id}/approve-bu"
    description: "Business-unit approval (step 1 of dual approval)"
    roles: [BusinessUnitApprover]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status -> PENDING_MOBILITY_APPROVAL; bu_approved_by_user_id recorded"]
  - method: POST
    path: "/mobility/assignments/{id}/reject-bu"
    description: "Business-unit rejection; reverts to DRAFT"
    roles: [BusinessUnitApprover]
    code: 200
    input: ["reason?"]
    output: Assignment
    side_effects: ["status -> DRAFT; submitted_by_user_id cleared"]
  - method: POST
    path: "/mobility/assignments/{id}/approve-mobility"
    description: "Mobility approval (step 2 of dual approval) -> ACTIVE"
    roles: [MobilityApprover]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status -> ACTIVE; enforces SoD vs bu_approved_by_user_id, package/split/CoC referential gates"]
  - method: POST
    path: "/mobility/assignments/{id}/reject-mobility"
    description: "Mobility rejection; reverts to DRAFT"
    roles: [MobilityApprover]
    code: 200
    input: ["reason?"]
    output: Assignment
    side_effects: ["status -> DRAFT; submitted_by_user_id and bu_approved_by_user_id cleared"]
  - method: POST
    path: "/mobility/assignments/{id}/initiate-repatriation"
    description: "Initiate repatriation (OCC-guarded); suspends the active split and voids DRAFT payroll records"
    roles: [MobilityAdmin]
    code: 200
    input: [expected_assignment_version]
    output: Assignment
    side_effects: ["status -> REPATRIATION_PENDING; increments Assignment.version by 1; PayrollSplit ACTIVE -> SUSPENDED; DRAFT ShadowPayrollRecord rows -> VOIDED"]
  - method: POST
    path: "/mobility/assignments/{id}/complete-repatriation"
    description: "Complete repatriation; requires all vendor engagements FILED or CLOSED"
    roles: [MobilityAdmin]
    code: 200
    input: []
