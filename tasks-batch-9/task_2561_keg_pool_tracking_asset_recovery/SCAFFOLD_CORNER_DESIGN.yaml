      - name: major_defect_quarantine_can_never_be_retested_into_float
        claim_type: triggerable
        grounds:
          - errors.ERR_QUARANTINE_RELEASE_BLOCKED
          - validations[priority=24]
          - state_machines[ServiceCycle]
        distinguishing_aspect: "The QUARANTINED -> PRESSURE_TESTED edge exists in §1.2, so priority 10 passes and the request reaches priority 24, which refuses it because quarantine_reason is INSPECTION_MAJOR_DEFECT rather than PRESSURE_TEST_FAIL. The identical retest on a keg quarantined by a FAILED pressure test is accepted, which is the only thing separating the two cases."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z. Pool HB-50L with two kegs seeded IN_SERVICE (K-BAD1, K-BAD2) so both can enter a service cycle immediately."
            - "One service centre with concurrent_cycle_capacity 4 and intake_buffer_hours 4; the two intakes are 6 hours apart (10:00 and 16:00), outside each other's closed 4-hour window."
            - "K-BAD1: CLEAN then INSPECT with MAJOR_DEFECT -> cycle QUARANTINED with quarantine_reason INSPECTION_MAJOR_DEFECT."
            - "K-BAD2: CLEAN, INSPECT PASS, then PRESSURE_TEST FAIL -> cycle QUARANTINED with quarantine_reason PRESSURE_TEST_FAIL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-BAD1", initial_custody_state: "IN_SERVICE" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-BAD2", initial_custody_state: "IN_SERVICE" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k2_id: "$.data.id" }
            - call: "POST /service-centers"
              payload: { name: "Denver Wash Line", region_code: "CO", concurrent_cycle_capacity: 4, intake_buffer_hours: 4 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { sc1_id: "$.data.id" }
            - call: "POST /service-cycles"
              payload: { keg_id: "${k1_id}", service_center_id: "${sc1_id}", received_at: "2026-08-01T10:00:00Z" }
              as: ServiceTechnician
              as_user_id: "tech-1"
              captures: { cy1_id: "$.data.id" }
            - call: "POST /service-cycles/${cy1_id}/record-step"
              payload: { step: "CLEAN", occurred_at: "2026-08-01T11:00:00Z", caustic_cycle_minutes: 14 }
              as: ServiceTechnician
              as_user_id: "tech-1"
            - call: "POST /service-cycles/${cy1_id}/record-step"
              payload: { step: "INSPECT", occurred_at: "2026-08-01T12:00:00Z", inspection_result: "MAJOR_DEFECT" }
              as: ServiceTechnician
              as_user_id: "tech-1"
            - call: "POST /service-cycles"
              payload: { keg_id: "${k2_id}", service_center_id: "${sc1_id}", received_at: "2026-08-01T16:00:00Z" }
              as: ServiceTechnician
              as_user_id: "tech-1"
              captures: { cy2_id: "$.data.id" }
            - call: "POST /service-cycles/${cy2_id}/record-step"
              payload: { step: "CLEAN", occurred_at: "2026-08-01T17:00:00Z", caustic_cycle_minutes: 14 }
              as: ServiceTechnician
              as_user_id: "tech-1"
            - call: "POST /service-cycles/${cy2_id}/record-step"
              payload: { step: "INSPECT", occurred_at: "2026-08-01T18:00:00Z", inspection_result: "PASS" }
              as: ServiceTechnician
              as_user_id: "tech-1"
            - call: "POST /service-cycles/${cy2_id}/record-step"
              payload: { step: "PRESSURE_TEST", occurred_at: "2026-08-01T19:00:00Z", pressure_test_psi: 34, pressure_test_result: "FAIL" }
              as: ServiceTechnician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /service-cycles/${cy1_id}/record-step"
              payload: { step: "PRESSURE_TEST", occurred_at: "2026-08-01T20:00:00Z", pressure_test_psi: 42, pressure_test_result: "PASS" }
              as: ServiceTechnician
              as_user_id: "tech-1"
              captures: { e_block: "$.data.error_id" }
            - call: "POST /service-cycles/${cy2_id}/record-step"
              payload: { step: "PRESSURE_TEST", occurred_at: "2026-08-01T21:00:00Z", pressure_test_psi: 42, pressure_test_result: "PASS" }
              as: ServiceTechnician
              as_user_id: "tech-2"
          assert:
            - "the retest on ${cy1_id} returns HTTP 409 with error_id == ERR_QUARANTINE_RELEASE_BLOCKED"
            - "it is not ERR_INVALID_STATE: §1.2 does declare QUARANTINED -> PRESSURE_TESTED, so priority 10 passes and only priority 24 can refuse this request"
            - "the refusal changed nothing: ServiceCycle.${cy1_id}.stage == QUARANTINED with quarantine_reason == INSPECTION_MAJOR_DEFECT, pressure_test_psi == null, pressure_test_result == null and an unchanged version"
            - "Keg.${k1_id}.custody_state == QUARANTINED with service_state == SERVICE_FAILED — the only exit left is a DAMAGED_BEYOND_REPAIR assessment that scraps it"
            - "the retest on ${cy2_id} returns HTTP 200 with stage == PRESSURE_TESTED, pressure_test_result == PASS and pressure_test_performed_by_user_id == tech-2, because its quarantine_reason was PRESSURE_TEST_FAIL"
            - "ServiceCenter.${sc1_id}.open_cycle_count == 2 throughout: neither a refused step nor a passed retest releases a slot"

      - name: a_disputed_assessment_blocks_a_second_one_while_a_proposed_one_is_superseded
