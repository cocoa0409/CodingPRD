# =============================================================================
# PRD Benchmark Seed Tables
# Domain: medicare-enrollment — Enrollment Periods, Late Enrollment Penalties &
# Premium Withholding (Medicare)
# Difficulty target: beyond expert (dense coupling, not entity sprawl)
# =============================================================================

scenario: |
  Enrollment Periods, Late Enrollment Penalties & Premium Withholding (Medicare): initial enrollment period computation from the month a person turns sixty-five with coverage start rules, special enrollment periods based on employer coverage with employment and coverage verification, late enrollment penalty calculation for medical and drug coverage with lifetime penalty attachment, premium determination including income-related adjustment amounts derived from tax return data with appeal for life-changing events, premium withholding from benefit checks versus direct billing with delinquency and termination timelines, coordination of primary and secondary payer status with employer plans, coverage election changes between original coverage and private plan alternatives during annual windows, equitable relief for enrollment errors caused by misinformation

domain_name: medicare-enrollment
api_prefix: /medicare

# =============================================================================
# Complexity Profile (§0)
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing        # IEP/SEP/GEP/AEP/OEP windows: overlapping/adjacent month intervals with gap rules
  secondary_archetype: compliance_audit        # penalty lifetime attachment, segregation of duties on appeals, equitable relief
  complexity_layers:
    - optimistic_concurrency                   # OCC on Beneficiary.version for plan elections
    - cascading_side_effects                   # relief grant → enrollment → penalty → determination → invoice reprice (depth 4)
    - dual_variant_calculation                 # provisional-vs-final premiums; LEP rounding-mode variants
    - scheduled_actions                        # month-granular effective dates, delinquency timelines, election effectivity
  entity_topology: flat                        # peer entities joined by foreign keys; no nested creation paths
  state_machine_shape: parallel                # CoverageEnrollment carries enrollment_status x collection_status; AppealCase adds a review cycle
  relationship_patterns:
    - one_to_many                              # Beneficiary 1..N most children
    - cross_aggregate                          # AppealCase -> PremiumDetermination; enrollments read EmployerCoverageRecord
  role_model: segregation_of_duties            # determination author may not adjudicate an appeal against it
  consistency_model: immediate                 # every mutation visible in the same request's response
  difficulty_target: beyond_expert
  entity_count: 14
  endpoint_count: 37
  error_code_count: 36

# =============================================================================
# Conventions (normative; bind every table below)
# =============================================================================
conventions:
  logical_clock: |
    The system runs on a logical clock, never wall-clock. Before any
    POST /_clock/set_current_utc call the clock reads exactly
    2026-09-01T00:00:00Z. "Clock month" = the UTC year-month of the current
    logical-clock reading. All monthly cycles, window statuses, effective
    dates, due dates, and delinquency counters evaluate against this clock.
  month_fields: |
    Fields suffixed `_month` are strings "YYYY-MM" (calendar month).
    add_months(ym, n) and month_diff(a, b) are exact calendar-month arithmetic.
    A month range [a, b] is INCLUSIVE of both months unless stated otherwise.
  enrollment_interval_semantics: |
    A CoverageEnrollment covers the half-open month interval
    [effective_month, end_month): end_month is the FIRST uncovered month
    (null while open-ended). Two same-part intervals touching (end == start)
    do NOT overlap.
  employer_coverage_interval_semantics: |
    An EmployerCoverageRecord covers the CLOSED month interval
    [coverage_start_month, coverage_end_month] (coverage_end_month null means
    ongoing). Two records for the same beneficiary and the same employer_name
    that share even one calendar month collide.
  money: |
    All money fields are integer cents. round_half_up(x) rounds to the cent.
    round_dime(x) rounds to the nearest 10 cents, half-up
    (e.g. round_dime(448.5) = 450, round_dime(241.5) = 240).
  identity: |
    Authentication is via headers X-User-Role and X-User-ID. Entity-backed
    roles compare X-User-ID to the resource's beneficiary id; opaque roles
    carry operator ids recorded in audit fields (created_by_user_id etc.).
  ordering: |
    Anywhere an ordering is required and not otherwise pinned, the tie-break
    is created_at ASC. Random/UUID id values never influence observable
    results, selection, or ordering.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities, flat topology)
# =============================================================================
entities:
  - name: Beneficiary
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Beneficiary legal name" }
      - { name: date_of_birth, type: string, source: input, description: "Birth date, YYYY-MM-DD" }
      - { name: attainment_month, type: string, source: computed, description: "Calendar month (YYYY-MM) of Medicare attainment: the month the person turns 65, EXCEPT when birth day == 1, in which case attainment is the month BEFORE the 65th-birthday month (calc_attainment_month)" }
      - { name: iep_start_month, type: string, source: computed, description: "attainment_month - 3 months (YYYY-MM)" }
      - { name: iep_end_month, type: string, source: computed, description: "attainment_month + 3 months (YYYY-MM)" }
      - { name: credit_cents, type: integer, source: computed, default: 0, description: "Overpayment credit produced by equitable-relief or appeal repricing; conservation invariant: sum(invoice.paid_cents) == sum(invoice.applied_cents) + credit_cents" }

  - name: RateSchedule
    parent: null
    common_fields: true
    fields:
      - { name: coverage_year, type: integer, source: input, description: "Calendar year this schedule prices; unique across RateSchedule rows" }
      - { name: part_b_standard_cents, type: integer, source: input, description: "Standard monthly Part B premium for the coverage year" }
      - { name: part_d_national_base_cents, type: integer, source: input, description: "National base beneficiary premium for Part D; also used as the Part D plan premium base in this system" }
      - { name: irmaa_brackets, type: array, source: input, description: "Array of exactly 6 objects {tier, single_floor_cents, joint_floor_cents, part_b_surcharge_cents, part_d_surcharge_cents} with tier 0..5 in ascending floor order; bracket match is lower-bound INCLUSIVE (highest tier whose floor <= MAGI)" }

  - name: EnrollmentPeriod
    parent: null
    common_fields: true
    fields:
      - { name: beneficiary_id, type: string, source: system, description: "FK -> Beneficiary.id; owner of this window" }
      - { name: window_type, type: enum, source: system, description: "IEP | SEP. Only beneficiary-anchored windows are rows; calendar windows (GEP Jan 1-Mar 31, AEP Oct 15-Dec 7, OEP_MA Jan 1-Mar 31) are computed from the logical clock and never persisted" }
      - { name: window_start_month, type: string, source: computed, description: "First month (YYYY-MM, inclusive) of the window" }
      - { name: window_end_month, type: string, source: computed, description: "Last month (YYYY-MM, inclusive) of the window" }
      - { name: status, type: enum, source: computed, description: "UPCOMING | OPEN | EXPIRED; derived from clock month vs [window_start_month, window_end_month], recomputed at creation and on every monthly cycle" }
      - { name: source_coverage_ref, type: string, source: system, description: "Informational provenance only (NOT a join key): on SEP rows, the id of the EmployerCoverageRecord whose ending opened the window; null on IEP rows" }

  - name: CoverageEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: beneficiary_id, type: string, source: input, description: "FK -> Beneficiary.id; enrollee" }
      - { name: part, type: enum, source: input, description: "PART_A | PART_B | PART_D | PART_C. PART_C (private plan alternative) rows are created only by election effectivity, never via POST /medicare/enrollments" }
      - { name: enrollment_status, type: enum, source: system, description: "PENDING | ACTIVE | TERMINATED | CANCELLED (parallel dimension 1)" }
      - { name: collection_status, type: enum, source: system, description: "PENDING_SETUP | WITHHOLDING | DIRECT_BILL | DELINQUENT | NOT_REQUIRED | CLOSED (parallel dimension 2, evolves independently of enrollment_status)" }
      - { name: effective_month, type: string, source: computed, description: "First covered month (YYYY-MM), computed by calc_coverage_effective_month at creation or set retroactively by granted equitable relief" }
      - { name: end_month, type: string, source: system, description: "First UNCOVERED month (YYYY-MM, half-open interval end); null while open-ended" }
      - { name: enrolled_via_window, type: enum, source: system, description: "IEP | SEP | GEP | AEP | OEP_MA | RELIEF" }

  - name: EmployerCoverageRecord
    parent: null
    common_fields: true
    fields:
      - { name: beneficiary_id, type: string, source: input, description: "FK -> Beneficiary.id; covered worker/spouse beneficiary" }
      - { name: employer_name, type: string, source: input, description: "Employer name (exact string; overlap scope key together with beneficiary_id)" }
      - { name: employer_size, type: integer, source: input, description: "Number of employees; payer-rule threshold is >= 20 (20 counts as large)" }
      - { name: coverage_start_month, type: string, source: input, description: "First month (YYYY-MM, inclusive) of group health coverage" }
      - { name: coverage_end_month, type: string, source: input, description: "Last month (YYYY-MM, INCLUSIVE) of group health coverage; null = ongoing" , default: null }
      - { name: employment_end_month, type: string, source: input, description: "Last month (YYYY-MM, inclusive) of employment; null = still employed", default: null }
      - { name: is_drug_coverage_creditable, type: boolean, source: input, default: false, description: "Whether the group plan's drug coverage is creditable for Part D LEP purposes" }
      - { name: verification_status, type: enum, source: system, description: "UNVERIFIED | VERIFIED | REJECTED" }
      - { name: record_status, type: enum, source: system, description: "ACTIVE_COVERAGE | ENDED" }

  - name: PenaltyAssessment
    parent: null
    common_fields: true
    fields:
      - { name: beneficiary_id, type: string, source: system, description: "FK -> Beneficiary.id; penalized beneficiary" }
      - { name: part, type: enum, source: system, description: "PART_B | PART_D" }
      - { name: gap_months, type: integer, source: computed, description: "Uncovered whole calendar months in [iep_end_month+1 .. effective_month-1] after subtracting prior same-part coverage and creditable employer coverage (calc_lep_gap_months)" }
      - { name: full_12month_periods, type: integer, source: computed, description: "floor(gap_months / 12); Part B only, null for PART_D" }
      - { name: penalty_pct, type: integer, source: computed, description: "10 x full_12month_periods; Part B only, null for PART_D. Lifetime-attached: never expires once ACTIVE unless WAIVED or VOIDED" }
      - { name: status, type: enum, source: system, description: "ACTIVE | WAIVED | VOIDED" }

  - name: TaxReturnRecord
    parent: null
    common_fields: true
    fields:
      - { name: beneficiary_id, type: string, source: input, description: "FK -> Beneficiary.id; filer" }
      - { name: tax_year, type: integer, source: input, description: "Tax year of the return; unique per beneficiary" }
      - { name: magi_cents, type: integer, source: input, description: "Modified adjusted gross income, cents; must be >= 0" }
      - { name: filing_status, type: enum, source: input, description: "SINGLE | MARRIED_JOINT" }

  - name: PremiumDetermination
    parent: null
    common_fields: true
    fields:
      - { name: beneficiary_id, type: string, source: input, description: "FK -> Beneficiary.id; subject of the determination" }
      - { name: coverage_year, type: integer, source: input, description: "Premium year being priced" }
      - { name: part, type: enum, source: input, description: "PART_B | PART_D (PART_A is premium-free, PART_C is plan-priced: both rejected with ERR_UNSUPPORTED_PART)" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINAL | SUPERSEDED" }
      - { name: tax_year_used, type: integer, source: computed, description: "coverage_year - 2 when that TaxReturnRecord exists (FINAL basis); coverage_year - 3 otherwise (PROVISIONAL basis)" }
      - { name: irmaa_tier, type: integer, source: computed, description: "0..5 per calc_irmaa_tier" }
      - { name: base_premium_cents, type: integer, source: computed, description: "Standard premium for (coverage_year, part) from RateSchedule" }
      - { name: irmaa_surcharge_cents, type: integer, source: computed, description: "Income-related adjustment for (tier, part)" }
      - { name: lep_cents, type: integer, source: computed, description: "Late-enrollment-penalty monthly amount for this coverage year; computed from the ACTIVE PenaltyAssessment and THIS year's RateSchedule (calc_part_b_lep / calc_part_d_lep)" }
      - { name: total_premium_cents, type: integer, source: computed, description: "base_premium_cents + irmaa_surcharge_cents + lep_cents (evaluation order pinned in calc_total_premium)" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the requester; segregation-of-duties anchor for appeals" }

  - name: AppealCase
    parent: null
    common_fields: true
    fields:
      - { name: beneficiary_id, type: string, source: system, description: "FK -> Beneficiary.id; appellant (derived from the appealed determination)" }
      - { name: premium_determination_id, type: string, source: input, description: "FK -> PremiumDetermination.id; the FINAL determination being appealed" }
      - { name: life_event_type, type: enum, source: input, description: "WORK_STOPPAGE | WORK_REDUCTION | MARRIAGE | DIVORCE | SPOUSE_DEATH | PENSION_LOSS | PROPERTY_LOSS" }
      - { name: event_date, type: string, source: input, description: "YYYY-MM-DD of the life-changing event" }
      - { name: claimed_magi_cents, type: integer, source: input, description: "Income the beneficiary claims for the basis tax year after the event" }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | MORE_INFO_REQUESTED | APPROVED | DENIED" }
      - { name: adjudicated_by_user_id, type: string, source: system, description: "X-User-ID of the adjudicating AppealsOfficer; null until a final decision" }

  - name: WithholdingArrangement
    parent: null
    common_fields: true
    fields:
      - { name: beneficiary_id, type: string, source: input, description: "FK -> Beneficiary.id; at most one non-STOPPED arrangement per beneficiary" }
      - { name: monthly_benefit_cents, type: integer, source: input, description: "Monthly benefit check amount available for withholding" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | STOPPED" }

  - name: PremiumInvoice
    parent: null
    common_fields: true
    fields:
      - { name: beneficiary_id, type: string, source: system, description: "FK -> Beneficiary.id; billed beneficiary" }
      - { name: part, type: enum, source: system, description: "PART_B | PART_D" }
      - { name: service_month, type: string, source: system, description: "Month (YYYY-MM) the premium pays for" }
      - { name: amount_cents, type: integer, source: computed, description: "Billed amount (calc_invoice_amount); rewritten only via cancel+reissue on repricing" }
      - { name: paid_cents, type: integer, source: system, default: 0, description: "Amount actually collected against this invoice" }
      - { name: applied_cents, type: integer, source: computed, description: "Portion of paid_cents still applied after repricing; equals paid_cents unless a relief/appeal reprice reduced the bill" }
      - { name: outstanding_cents, type: integer, source: computed, description: "amount_cents - paid_cents; never negative" }
      - { name: due_date, type: string, source: computed, description: "Last day of service_month for regular invoices; issue date + 30 days for arrears invoices (YYYY-MM-DD)" }
      - { name: is_arrears, type: boolean, source: system, default: false, description: "True when this invoice carries a withholding shortfall" }
      - { name: status, type: enum, source: system, description: "ISSUED | PAID | PAST_DUE | CANCELLED | WRITTEN_OFF" }

  - name: PayerCoordinationRecord
    parent: null
    common_fields: true
    fields:
      - { name: beneficiary_id, type: string, source: system, description: "FK -> Beneficiary.id" }
      - { name: role, type: enum, source: computed, description: "MEDICARE_PRIMARY | MEDICARE_SECONDARY" }
      - { name: basis, type: enum, source: computed, description: "NO_EMPLOYER_COVERAGE | SMALL_EMPLOYER | LARGE_EMPLOYER" }
      - { name: effective_start_month, type: string, source: computed, description: "First month (YYYY-MM, inclusive) this role holds" }
      - { name: effective_end_month, type: string, source: computed, description: "Last month (YYYY-MM, inclusive) this role holds; null = open-ended" }

  - name: PlanElection
    parent: null
    common_fields: true
    fields:
      - { name: beneficiary_id, type: string, source: input, description: "FK -> Beneficiary.id; elector" }
      - { name: election_window, type: enum, source: input, description: "AEP | OEP_MA" }
      - { name: season_key, type: string, source: computed, description: "Window identity: 'AEP-<yyyy>' for the AEP opening in year yyyy, 'OEP-<yyyy>' for the OEP of year yyyy; supersede scoping is per (beneficiary_id, season_key)" }
      - { name: current_coverage, type: enum, source: computed, description: "ORIGINAL | MA at election time (MA iff an ACTIVE/PENDING PART_C enrollment exists)" }
      - { name: target_coverage, type: enum, source: input, description: "ORIGINAL | MA" }
      - { name: effective_month, type: string, source: computed, description: "AEP: January of the year after the window opens; OEP_MA: election month + 1" }
      - { name: status, type: enum, source: system, description: "GOVERNING | SUPERSEDED | EFFECTIVE" }

  - name: EquitableReliefCase
    parent: null
    common_fields: true
    fields:
      - { name: beneficiary_id, type: string, source: input, description: "FK -> Beneficiary.id; claimant" }
      - { name: relief_type, type: enum, source: input, description: "RETROACTIVE_ENROLLMENT | PENALTY_WAIVER | BOTH" }
      - { name: part, type: enum, source: input, description: "PART_B | PART_D the relief applies to" }
      - { name: requested_effective_month, type: string, source: input, description: "YYYY-MM; required for RETROACTIVE_ENROLLMENT/BOTH, omitted for pure PENALTY_WAIVER; for an existing PENDING/ACTIVE enrollment it must be strictly earlier than the current effective_month", default: null }
      - { name: claimed_misinform_source, type: enum, source: input, description: "FEDERAL_AGENCY | PLAN_REPRESENTATIVE | EMPLOYER" }
      - { name: description, type: string, source: input, description: "Free-text account of the misinformation" }
      - { name: status, type: enum, source: system, description: "UNDER_INVESTIGATION | GRANTED | DENIED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: EnrollmentPeriod
    field: status
    initial_state: UPCOMING
    terminal_states: [EXPIRED]
    note: "Status is clock-derived: recomputed at row creation and on every POST /_ops/run_monthly_cycle. Calendar windows (GEP/AEP/OEP_MA) have no rows; their openness is computed from the clock at request time."
    transitions:
      - from: UPCOMING
        to: OPEN
        trigger: "system (monthly cycle: window_start_month <= clock month <= window_end_month)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [UPCOMING, OPEN]
        to: EXPIRED
        trigger: "system (monthly cycle: clock month > window_end_month; a clock jump may skip OPEN entirely)"
        actor: system
        preconditions: []
        side_effects: []
    note_terminal: "Window status never moves backwards: there is no OPEN -> UPCOMING or EXPIRED -> * transition."

  - entity: CoverageEnrollment
    field: enrollment_status
    initial_state: PENDING
    terminal_states: [TERMINATED, CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system (monthly cycle: effective_month <= clock month); also immediate at creation when effective_month <= clock month"
        actor: system
        preconditions: []
        side_effects:
          - "collection_status resolves from PENDING_SETUP: NOT_REQUIRED for PART_A/PART_C; WITHHOLDING if the beneficiary has an ACTIVE WithholdingArrangement, else DIRECT_BILL"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /medicare/enrollments/{id}/terminate"
        actor: "Beneficiary | FieldOfficer"
        preconditions:
          - "enrollment_status == PENDING"
        side_effects:
          - "collection_status -> CLOSED; end_month stays null"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /medicare/enrollments/{id}/terminate (voluntary) | system (monthly cycle: >= 3 PAST_DUE invoices, calc_delinquency) | system (election effectivity supersedes coverage, calc_election_effectivity)"
        actor: "Beneficiary | FieldOfficer | system"
        preconditions:
          - "voluntary: enrollment_status == ACTIVE"
        side_effects:
          - "end_month := clock month (voluntary/delinquency) or election effective_month (election cascade)"
          - "collection_status -> CLOSED"
          - "delinquency termination: all non-PAID invoices on this enrollment -> WRITTEN_OFF"
    note_terminal: "TERMINATED and CANCELLED are terminal: any further transition attempt on them fails with ERR_INVALID_STATE; no outbound transitions exist."

  - entity: CoverageEnrollment
    field: collection_status
    initial_state: PENDING_SETUP
    terminal_states: [CLOSED]
    note: "Parallel dimension: evolves independently of enrollment_status except that a terminal enrollment forces CLOSED."
    transitions:
      - from: PENDING_SETUP
        to: WITHHOLDING
        trigger: "system (activation of a billable-part enrollment while the beneficiary has an ACTIVE WithholdingArrangement)"
        actor: system
        preconditions: ["part IN {PART_B, PART_D}"]
        side_effects: []
        note: "Arrangement creation sweeps only DIRECT_BILL enrollments into WITHHOLDING; PENDING_SETUP enrollments resolve at activation time instead."
      - from: PENDING_SETUP
        to: DIRECT_BILL
        trigger: "system (activation without an ACTIVE WithholdingArrangement)"
        actor: system
        preconditions: ["part IN {PART_B, PART_D}"]
        side_effects: []
      - from: PENDING_SETUP
        to: NOT_REQUIRED
        trigger: "system (activation of PART_A or PART_C)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DIRECT_BILL
        to: WITHHOLDING
        trigger: "POST /medicare/enrollments/{id}/switch-collection-method (target WITHHOLDING)"
        actor: "Beneficiary | FieldOfficer"
        preconditions:
          - "collection_status == DIRECT_BILL (NOT DELINQUENT)"
          - "beneficiary has a WithholdingArrangement with status == ACTIVE (else ERR_NO_ACTIVE_WITHHOLDING)"
        side_effects: []
      - from: WITHHOLDING
        to: DIRECT_BILL
        trigger: "POST /medicare/enrollments/{id}/switch-collection-method (target DIRECT_BILL) | system (monthly cycle withholding shortfall cascade, calc_withholding_waterfall)"
        actor: "Beneficiary | FieldOfficer | system"
        preconditions: ["manual switch: collection_status == WITHHOLDING"]
        side_effects:
          - "shortfall cascade additionally flips every other WITHHOLDING enrollment of the same beneficiary and issues arrears invoices"
      - from: DIRECT_BILL
        to: DELINQUENT
        trigger: "system (monthly cycle: >= 1 PAST_DUE invoice exists for this enrollment)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELINQUENT
        to: DIRECT_BILL
        trigger: "system (after POST /medicare/invoices/{id}/pay or a cycle: no PAST_DUE invoices remain for this enrollment)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [PENDING_SETUP, WITHHOLDING, DIRECT_BILL, DELINQUENT, NOT_REQUIRED]
        to: CLOSED
        trigger: "system (enrollment_status became TERMINATED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EmployerCoverageRecord
    field: verification_status
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: [UNVERIFIED, REJECTED]
        to: VERIFIED
        trigger: "POST /medicare/employer-coverages/{id}/verify (decision VERIFIED)"
        actor: FieldOfficer
        preconditions:
          - "verification_status IN {UNVERIFIED, REJECTED}"
          - "closed-interval overlap check: no other VERIFIED record for the same beneficiary + employer_name sharing any month of [coverage_start_month, coverage_end_month(null=ongoing)] (else ERR_COVERAGE_PERIOD_OVERLAP)"
        side_effects:
          - "payer role recompute (calc_payer_role): may close the open PayerCoordinationRecord and open a MEDICARE_SECONDARY interval starting coverage_start_month"
      - from: UNVERIFIED
        to: REJECTED
        trigger: "POST /medicare/employer-coverages/{id}/verify (decision REJECTED)"
        actor: FieldOfficer
        preconditions: ["verification_status == UNVERIFIED"]
        side_effects: []
        note: "REJECTED -> VERIFIED resubmission makes this machine cyclic."

  - entity: EmployerCoverageRecord
    field: record_status
    initial_state: ACTIVE_COVERAGE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE_COVERAGE
        to: ENDED
        trigger: "POST /medicare/employer-coverages/{id}/end"
        actor: "Beneficiary | FieldOfficer"
        preconditions:
          - "verification_status == VERIFIED (else ERR_COVERAGE_NOT_VERIFIED)"
          - "record_status == ACTIVE_COVERAGE"
          - "coverage_start_month <= coverage_end_month <= clock month; employment_end_month <= clock month (else ERR_EFFECTIVE_DATE_INVALID)"
        side_effects:
          - "writes coverage_end_month and employment_end_month onto the record"
          - "creates an EnrollmentPeriod row window_type=SEP, [min(employment_end_month, coverage_end_month)+1 .. +8 months], status derived from clock (calc_sep_window)"
          - "payer role recompute: closes the MEDICARE_SECONDARY interval at coverage_end_month and opens MEDICARE_PRIMARY (basis NO_EMPLOYER_COVERAGE) at coverage_end_month + 1"

  - entity: PenaltyAssessment
    field: status
    initial_state: ACTIVE
    terminal_states: [WAIVED, VOIDED]
    note: "An assessment is created directly ACTIVE at enrollment time when the computed penalty is non-zero. Amounts are re-derived per coverage year inside PremiumDetermination; this row stores the basis (gap_months / full_12month_periods / penalty_pct)."
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "system (equitable-relief grant with retroactive enrollment shortens the gap but leaves a non-zero penalty: penalty_pct / gap_months updated in place)"
        actor: system
        preconditions: []
        side_effects: ["updated_at bumped; determinations repriced downstream (calc_relief_repricing)"]
      - from: ACTIVE
        to: VOIDED
        trigger: "system (equitable-relief grant recomputes the gap to fewer than 12 months for PART_B or 0 months for PART_D — penalty never should have applied)"
        actor: system
        preconditions: []
        side_effects: ["determinations repriced downstream (calc_relief_repricing)"]
      - from: ACTIVE
        to: WAIVED
        trigger: "system (equitable-relief grant with relief_type PENALTY_WAIVER or BOTH — penalty basis stands but is forgiven)"
        actor: system
        preconditions: []
        side_effects: ["determinations repriced downstream (calc_relief_repricing)"]

  - entity: PremiumDetermination
    field: status
    initial_state: PROVISIONAL
    terminal_states: [SUPERSEDED]
    note: "Created PROVISIONAL when the coverage_year-2 tax record is missing (basis coverage_year-3); created FINAL directly when coverage_year-2 data exists. At most one non-SUPERSEDED row per (beneficiary_id, coverage_year, part)."
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "system (POST /medicare/tax-records supplies the coverage_year-2 record; monthly cycle re-checks as a safety net)"
        actor: system
        preconditions: ["a TaxReturnRecord for (beneficiary_id, coverage_year - 2) now exists"]
        side_effects:
          - "row updated IN PLACE: tax_year_used := coverage_year - 2, irmaa_tier / irmaa_surcharge_cents / total_premium_cents recomputed; lep_cents unchanged"
      - from: FINAL
        to: SUPERSEDED
        trigger: "system (appeal APPROVED: calc_appeal_redetermination | equitable-relief GRANTED: calc_relief_repricing)"
        actor: system
        preconditions: []
        side_effects:
          - "a replacement FINAL row for the same (beneficiary_id, coverage_year, part) is created by the cascade; the superseded row is discoverable as the older of the two via created_at ordering"

  - entity: AppealCase
    field: status
    initial_state: UNDER_REVIEW
    terminal_states: [APPROVED, DENIED]
    note: "Non-linear: UNDER_REVIEW -> MORE_INFO_REQUESTED -> UNDER_REVIEW is an explicit cycle."
    transitions:
      - from: UNDER_REVIEW
        to: MORE_INFO_REQUESTED
        trigger: "POST /medicare/appeals/{id}/adjudicate (decision MORE_INFO_REQUESTED)"
        actor: AppealsOfficer
        preconditions:
          - "status == UNDER_REVIEW (else ERR_APPEAL_NOT_REVIEWABLE)"
          - "segregation of duties: X-User-ID != appealed determination's created_by_user_id (else ERR_SOD_SAME_ACTOR)"
        side_effects: []
      - from: MORE_INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /medicare/appeals/{id}/respond"
        actor: Beneficiary
        preconditions: ["status == MORE_INFO_REQUESTED (else ERR_APPEAL_NOT_REVIEWABLE)"]
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /medicare/appeals/{id}/adjudicate (decision APPROVED)"
        actor: AppealsOfficer
        preconditions:
          - "status == UNDER_REVIEW (else ERR_APPEAL_NOT_REVIEWABLE)"
          - "segregation of duties: X-User-ID != appealed determination's created_by_user_id (else ERR_SOD_SAME_ACTOR)"
        side_effects:
          - "calc_appeal_redetermination: appealed FINAL determination -> SUPERSEDED; a new FINAL determination is created with the IRMAA tier recomputed from claimed_magi_cents (lep_cents unchanged); affected invoices repriced; adjudicated_by_user_id recorded"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /medicare/appeals/{id}/adjudicate (decision DENIED)"
        actor: AppealsOfficer
        preconditions:
          - "status == UNDER_REVIEW (else ERR_APPEAL_NOT_REVIEWABLE)"
          - "segregation of duties: X-User-ID != appealed determination's created_by_user_id (else ERR_SOD_SAME_ACTOR)"
        side_effects: ["adjudicated_by_user_id recorded"]

  - entity: WithholdingArrangement
    field: status
    initial_state: ACTIVE
    terminal_states: [STOPPED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (monthly cycle: withholding waterfall could not cover the month's total premium, calc_withholding_waterfall)"
        actor: system
        preconditions: []
        side_effects:
          - "every WITHHOLDING CoverageEnrollment of this beneficiary -> DIRECT_BILL"
          - "one arrears PremiumInvoice per shortfall part (is_arrears = true)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /medicare/withholding-arrangements/{id}/adjust"
        actor: BenefitAdministrator
        preconditions:
          - "new monthly_benefit_cents >= sum of current monthly premiums of the beneficiary's ACTIVE billable (PART_B/PART_D) enrollments; otherwise the arrangement stays SUSPENDED"
        side_effects: []
        note: "Resume does NOT auto-flip enrollments back; an explicit switch-collection-method call is required."
      - from: [ACTIVE, SUSPENDED]
        to: STOPPED
        trigger: "system (beneficiary's last billable enrollment terminates)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PremiumInvoice
    field: status
    initial_state: ISSUED
    terminal_states: [PAID, CANCELLED, WRITTEN_OFF]
    transitions:
      - from: ISSUED
        to: PAST_DUE
        trigger: "system (monthly cycle: due_date < clock date and outstanding_cents > 0)"
        actor: system
        preconditions: []
        side_effects: ["enrollment collection_status DIRECT_BILL -> DELINQUENT when the first PAST_DUE appears"]
      - from: [ISSUED, PAST_DUE]
        to: PAID
        trigger: "POST /medicare/invoices/{id}/pay (amount_cents == outstanding_cents exactly)"
        actor: Beneficiary
        preconditions:
          - "status IN {ISSUED, PAST_DUE} (else ERR_INVOICE_NOT_PAYABLE)"
          - "amount_cents == outstanding_cents (else ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "paid_cents := amount_cents; applied_cents := amount_cents; outstanding_cents := 0"
          - "if the enrollment was DELINQUENT and no PAST_DUE invoices remain for it -> collection_status DIRECT_BILL (cure)"
      - from: [ISSUED, PAST_DUE]
        to: CANCELLED
        trigger: "system (relief/appeal repricing cancels unpaid bills and reissues them at the corrected amount)"
        actor: system
        preconditions: []
        side_effects: ["a replacement ISSUED invoice for the same (part, service_month) is created at the repriced amount"]
      - from: [ISSUED, PAST_DUE]
        to: WRITTEN_OFF
        trigger: "system (delinquency termination of the enrollment)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PlanElection
    field: status
    initial_state: GOVERNING
    terminal_states: [SUPERSEDED, EFFECTIVE]
    transitions:
      - from: GOVERNING
        to: SUPERSEDED
        trigger: "system (a new AEP election for the same beneficiary in the same season_key is created — AEP is last-in-wins; OEP_MA seasons reject the second election outright with ERR_OEP_ELECTION_ALREADY_USED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: GOVERNING
        to: EFFECTIVE
        trigger: "system (monthly cycle: clock month >= effective_month)"
        actor: system
        preconditions: []
        side_effects:
          - "target MA: create PART_C CoverageEnrollment (effective_month = election effective_month, ACTIVE, collection_status NOT_REQUIRED); terminate any ACTIVE standalone PART_D enrollment (end_month = effective_month)"
          - "target ORIGINAL: terminate the ACTIVE PART_C enrollment (end_month = effective_month)"

  - entity: EquitableReliefCase
    field: status
    initial_state: UNDER_INVESTIGATION
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: UNDER_INVESTIGATION
        to: GRANTED
        trigger: "POST /medicare/equitable-relief-cases/{id}/adjudicate (decision GRANTED)"
        actor: FieldOfficer
        preconditions: ["status == UNDER_INVESTIGATION (else ERR_INVALID_STATE)"]
        side_effects:
          - "calc_relief_repricing cascade: (1) retroactive enrollment adjust-or-create for the part; (2) PenaltyAssessment recomputed -> ACTIVE(updated) | VOIDED | WAIVED; (3) non-SUPERSEDED PremiumDeterminations for the part -> SUPERSEDED with FINAL replacements; (4) affected PremiumInvoices repriced (unpaid CANCELLED + reissued, paid -> applied_cents reduced and Beneficiary.credit_cents credited)"
      - from: UNDER_INVESTIGATION
        to: DENIED
        trigger: "POST /medicare/equitable-relief-cases/{id}/adjudicate (decision DENIED)"
        actor: FieldOfficer
        preconditions: ["status == UNDER_INVESTIGATION (else ERR_INVALID_STATE)"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: election-create-stale-beneficiary
    parent_entity: Beneficiary
    write_endpoint: "POST /medicare/elections"
    occ_field: expected_beneficiary_version
    description: |
      Creating a PlanElection against a Beneficiary whose version has advanced
      since the client last observed it is rejected with 412. This captures the
      case where another writer has just created an election for the same
      season (which legitimately supersedes the prior one under AEP
      last-in-wins) and the current writer's view of the beneficiary is
      therefore stale. The rule is evaluated purely as a version comparison:
      expected_beneficiary_version != Beneficiary.version -> reject.
    error_id: ERR_STALE_BENEFICIARY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_attainment_month
    trigger: "Beneficiary creation"
    algorithm: threshold
    formula: |
      y65 = birth_year(date_of_birth) + 65
      if birth_day(date_of_birth) == 1:
        attainment_month = add_months((y65, birth_month), -1)   # first-of-month rule
      else:
        attainment_month = (y65, birth_month)
      iep_start_month = add_months(attainment_month, -3)
      iep_end_month   = add_months(attainment_month, +3)        # inclusive; 7-month window
    input_set: "the new Beneficiary's date_of_birth"
    precision: "calendar-month arithmetic, no rounding"
    note: "First-of-month boundary: DOB 1961-12-14 -> attainment 2026-12, IEP [2026-09, 2027-03]. DOB 1961-12-01 -> attainment 2026-11, IEP [2026-08, 2027-02]."

  - name: calc_coverage_effective_month
    trigger: "POST /medicare/enrollments"
    algorithm: constraint_propagation
    formula: |
      inputs: enrolled_via_window W, attainment_month T, clock month M
      if W == IEP:
        M <  T            -> effective_month = T
        M == T            -> effective_month = add_months(M, 1)
        M == T+1          -> effective_month = add_months(M, 2)
        M IN {T+2, T+3}   -> effective_month = add_months(M, 3)
      if W == SEP:  effective_month = add_months(M, 1)
      if W == GEP:  effective_month = add_months(M, 1)
      # RELIEF-created enrollments take requested_effective_month verbatim.
    input_set: "the enrollment request; the beneficiary's IEP row"
    precision: "calendar-month arithmetic"
    note: "Combinatorial mode (a): >= 3 inputs with 4-way conditional branch for IEP. Example: T=2026-12; enroll at M=2026-12 -> eff 2027-01; enroll at M=2027-02 (T+2) -> eff 2027-05."

  - name: calc_sep_window
    trigger: "POST /medicare/employer-coverages/{id}/end"
    algorithm: interval_merge
    formula: |
      anchor = min(employment_end_month, coverage_end_month)   # whichever ended FIRST
      SEP window = [add_months(anchor, 1), add_months(anchor, 8)]   # inclusive, 8 months
      Additionally, while a VERIFIED EmployerCoverageRecord has coverage_end_month
      null or >= clock month, the beneficiary is SEP-qualified continuously
      (enrollment allowed with SEP effective rule) even before any row exists.
    input_set: "the ended EmployerCoverageRecord"
    precision: "calendar-month arithmetic"
    note: "anchor is the EARLIER of the two end months. Example: employment ends 2026-07, coverage ends 2026-10 -> anchor 2026-07 -> SEP [2026-08, 2027-03]."

  - name: calc_lep_gap_months
    trigger: "CoverageEnrollment creation for PART_B or PART_D; equitable-relief repricing"
    algorithm: aggregation
    formula: |
      span   = whole calendar months in [iep_end_month + 1 .. effective_month - 1]
      credit = months of span covered by ANY of:
                 (a) a prior same-part CoverageEnrollment interval [eff, end)
                 (b) a VERIFIED EmployerCoverageRecord month (closed interval);
                     for PART_D only records with is_drug_coverage_creditable == true
      gap_months = max(0, len(span) - len(credit))
    input_set: "beneficiary's IEP row, same-part CoverageEnrollments, VERIFIED EmployerCoverageRecords"
    precision: "integer months"
    variants:
      - name: calendar_month_count
        when: "PINNED for both parts: a month counts as uncovered iff it is a whole calendar month inside the span with no creditable coverage that month"
        difference: "month-granular counting; partial months never arise because all inputs are month-granular"
      - name: day_prorated_count
        when: "REJECTED reading: prorate by days uncovered / 30"
        difference: "would produce fractional months and different penalty periods; the scaffold pins calendar_month_count"

  - name: calc_part_b_lep
    trigger: "CoverageEnrollment creation for PART_B; PremiumDetermination for PART_B; relief repricing"
    algorithm: threshold
    formula: |
      full_12month_periods = floor(gap_months / 12)
      penalty_pct = 10 * full_12month_periods                    # lifetime-attached
      monthly_lep_cents(year) = round_half_up(RateSchedule(year).part_b_standard_cents * penalty_pct / 100)
      An assessment row is created only when penalty_pct > 0.
    input_set: "PenaltyAssessment.gap_months; RateSchedule of the determination's coverage_year"
    constants:
      PART_B_LEP_PCT_PER_PERIOD: 10
      PERIOD_MONTHS: 12
    precision: "round_half_up to the cent; the pct is fixed at assessment but the CENT amount floats with each year's standard premium"
    note: "Boundary: gap 11 months -> 0%; gap 12 months -> 10%. Example: 2026 standard 18500 -> 1850; 2027 standard 19000 -> 1900 for the same 10%."

  - name: calc_part_d_lep
    trigger: "CoverageEnrollment creation for PART_D; PremiumDetermination for PART_D; relief repricing"
    algorithm: threshold
    formula: |
      uncovered_months = gap_months (calendar-month counting)
      monthly_lep_cents(year) =
        round_dime(uncovered_months * 0.01 * RateSchedule(year).part_d_national_base_cents)
      Aggregation order is PINNED: multiply first, round ONCE at the end.
      An assessment row is created only when uncovered_months > 0.
    input_set: "PenaltyAssessment.gap_months; RateSchedule of the determination's coverage_year"
    constants:
      PART_D_LEP_PCT_PER_MONTH: 1
    precision: "round_dime = nearest 10 cents, half-up"
    variants:
      - name: aggregate_round_half_up
        when: "PINNED: round_dime(months * 1% * base) computed on the aggregate, half-up"
        difference: "13 months x 34.50 = 448.5 -> 450; 7 months x 34.50 = 241.5 -> 240"
      - name: per_month_round_then_sum
        when: "REJECTED reading: round each month's 1% to the dime, then sum"
        difference: "7 x round_dime(34.5) = 7 x 30 = 210 != 240 — rejected"
      - name: truncate_to_dime
        when: "REJECTED reading: truncate the aggregate to the dime"
        difference: "448.5 -> 440 != 450 — rejected"

  - name: calc_irmaa_tier
    trigger: "PremiumDetermination creation/finalization; appeal redetermination"
    algorithm: threshold
    formula: |
      basis_year = coverage_year - 2 if a TaxReturnRecord for it exists else coverage_year - 3
      brackets = RateSchedule(coverage_year).irmaa_brackets
      floor_of(t) = brackets[t].single_floor_cents if filing_status == SINGLE
                    else brackets[t].joint_floor_cents
      irmaa_tier = max { t in 0..5 : floor_of(t) <= magi_cents(basis_year) }
      # LOWER BOUND INCLUSIVE: magi exactly equal to a tier floor lands IN that tier.
    input_set: "TaxReturnRecord for basis_year; RateSchedule for coverage_year"
    precision: "integer cents comparison"
    note: "Boundary: SINGLE floor tier1 = 10000000 cents; MAGI 10000000 -> tier 1; MAGI 9999999 -> tier 0."

  - name: calc_total_premium
    trigger: "PremiumDetermination creation/finalization; appeal redetermination; relief repricing"
    algorithm: aggregation
    formula: |
      EVALUATION ORDER IS PINNED (circular-looking dependency resolved):
        1. base_premium_cents = RateSchedule(coverage_year).part_b_standard_cents (PART_B)
                                or .part_d_national_base_cents (PART_D)
        2. lep_cents = calc_part_b_lep(coverage_year) or calc_part_d_lep(coverage_year)
                       computed from base_premium_cents ONLY — never from base+irmaa
        3. irmaa_surcharge_cents = brackets[irmaa_tier].part_b_surcharge_cents (PART_B)
                                   or .part_d_surcharge_cents (PART_D)
        4. total_premium_cents = base_premium_cents + irmaa_surcharge_cents + lep_cents
    input_set: "RateSchedule(coverage_year); TaxReturnRecord(basis year); ACTIVE PenaltyAssessment if any"
    precision: "integer cents; no additional rounding (components already rounded)"
    variants:
      - name: final
        when: "TaxReturnRecord for coverage_year - 2 exists at determination time (or arrives later, flipping PROVISIONAL -> FINAL in place)"
        difference: "IRMAA tier computed from coverage_year - 2 MAGI"
      - name: provisional
        when: "TaxReturnRecord for coverage_year - 2 missing; basis falls back to coverage_year - 3"
        difference: "same beneficiary and same coverage_year can produce a different total than final when the two tax years' MAGI place different tiers; provisional is the lawful estimate until IRS data arrives"
    note: "Rule-1 dual-variant anchor #1 (PremiumDetermination domain): provisional vs final."

  - name: calc_payer_role
    trigger: "Beneficiary creation; employer-coverages verify; employer-coverages end; monthly cycle (time-based ends)"
    algorithm: constraint_propagation
    formula: |
      active_records(m) = EmployerCoverageRecords with verification_status == VERIFIED,
        record_status any, coverage_start_month <= m, and
        (coverage_end_month is null or coverage_end_month >= m)
      if any active record has employer_size >= 20:  role = MEDICARE_SECONDARY, basis = LARGE_EMPLOYER
      elif any active record exists:               role = MEDICARE_PRIMARY,   basis = SMALL_EMPLOYER
      else:                                        role = MEDICARE_PRIMARY,   basis = NO_EMPLOYER_COVERAGE
      On change at month m: close the open PayerCoordinationRecord
      (effective_end_month := m - 1; if that precedes its start, delete that row)
      and open a new row with effective_start_month = m.
      Verify is RETROACTIVE: the new interval starts at coverage_start_month.
      End is PROSPECTIVE: PRIMARY resumes at coverage_end_month + 1.
    input_set: "all EmployerCoverageRecords of the beneficiary"
    precision: "calendar-month arithmetic"
    note: "Boundary: employer_size exactly 20 -> SECONDARY (>=). 19 -> PRIMARY."

  - name: calc_withholding_waterfall
    trigger: "monthly cycle, for each beneficiary with an ACTIVE WithholdingArrangement and >= 1 WITHHOLDING enrollment"
    algorithm: waterfall_allocation
    formula: |
      order = [PART_B, PART_D]                      # PINNED allocation order
      total_due = sum of monthly premiums of WITHHOLDING enrollments (calc_invoice_amount basis)
      remaining = monthly_benefit_cents
      for part in order:
        pay[part]      = min(remaining, due[part])  # fill B fully before D sees a cent
        remaining     -= pay[part]
        shortfall[part] = due[part] - pay[part]
      if any shortfall > 0:
        arrangement -> SUSPENDED
        every WITHHOLDING enrollment -> DIRECT_BILL
        one arrears PremiumInvoice per shortfall part (is_arrears=true,
          amount_cents = shortfall, due_date = cycle date + 30 days)
      CONSERVATION: sum(pay) == min(monthly_benefit_cents, total_due) exactly;
      the unwithheld remainder of the check is never captured by the system.
    input_set: "ACTIVE WithholdingArrangement; WITHHOLDING enrollments; their current monthly premiums"
    precision: "integer cents; allocation is exact (no rounding)"
    note: "Example: benefit 21000, B due 18500, D due 3450 -> B 18500, D 2500, D shortfall 950 -> suspend + arrears invoice 950."

  - name: calc_invoice_amount
    trigger: "monthly cycle invoice issue; arrears invoice issue"
    algorithm: aggregation
    formula: |
      det = the unique non-SUPERSEDED PremiumDetermination for
            (beneficiary, part, year(service_month)) if one exists
      if det exists:  amount_cents = det.total_premium_cents
      else:           amount_cents = RateSchedule(year).base + lep_amount(year)   # IRMAA-free fallback
      if no RateSchedule for year(service_month) exists either: no invoice is
      issued for that enrollment this cycle (skip, do not error).
    input_set: "DIRECT_BILL ACTIVE enrollments; PremiumDeterminations; RateSchedules"
    precision: "integer cents"

  - name: calc_delinquency
    trigger: "monthly cycle; invoice payment (cure re-check)"
    algorithm: chronological
    formula: |
      per enrollment with collection_status in {DIRECT_BILL, DELINQUENT}:
        mark invoices ISSUED with due_date < clock date and outstanding_cents > 0 -> PAST_DUE
        past_due_count = number of PAST_DUE invoices for this enrollment
        if past_due_count >= 1: collection_status -> DELINQUENT
        if past_due_count >= 3: enrollment -> TERMINATED (end_month = clock month);
                                its ISSUED/PAST_DUE invoices -> WRITTEN_OFF;
                                collection_status -> CLOSED
      cure (evaluated after each successful pay): if no PAST_DUE invoices remain
        for the enrollment: DELINQUENT -> DIRECT_BILL
    input_set: "the beneficiary's PremiumInvoices and CoverageEnrollments"
    constants:
      PAST_DUE_TERMINATION_THRESHOLD: 3
    precision: "integer counts; due_date compared to clock DATE (strictly: due_date < clock date)"

  - name: calc_election_effectivity
    trigger: "POST /medicare/elections (window + effective computation); monthly cycle (effectuation)"
    algorithm: interval_merge
    formula: |
      AEP window:  [Oct 15 00:00 UTC, Dec 7 23:59:59 UTC] of year y -> effective_month = (y+1)-01
      OEP_MA window: [Jan 1, Mar 31] of year y -> effective_month = election month + 1
      season_key: AEP-yyyy (year window opens) | OEP-yyyy
      AEP: creating a second election in the same season SUPERSEDES the GOVERNING one
           (last-in-wins; cardinality of GOVERNING per season stays exactly 1)
      OEP_MA: one election per season; a second attempt -> ERR_OEP_ELECTION_ALREADY_USED
      OEP_MA precondition: an ACTIVE PART_C enrollment exists (else ERR_OEP_REQUIRES_MA)
      Effectuation at cycle with clock month >= effective_month: GOVERNING -> EFFECTIVE
      with the coverage cascade on the state machine.
    input_set: "logical clock; PlanElection rows; CoverageEnrollments"
    precision: "window bounds are timestamp-exact; effective months are calendar-month exact"

  - name: calc_relief_repricing
    trigger: "POST /medicare/equitable-relief-cases/{id}/adjudicate (GRANTED)"
    algorithm: constraint_propagation
    formula: |
      Retro path (relief_type RETROACTIVE_ENROLLMENT or BOTH):
        if a PENDING/ACTIVE same-part enrollment E exists:
          require requested_effective_month < E.effective_month (else ERR_EFFECTIVE_DATE_INVALID)
          E.effective_month := requested_effective_month
        else:
          create E with effective_month = requested_effective_month
          (status ACTIVE iff requested <= clock month else PENDING)
        recompute calc_lep_gap_months -> penalty:
          pct 0 / 0 months -> assessment VOIDED; still positive -> update in place (ACTIVE)
      Waiver path (relief_type PENALTY_WAIVER or BOTH):
        every ACTIVE PenaltyAssessment for the part -> WAIVED (basis kept, forgiven)
      Then, for every non-SUPERSEDED PremiumDetermination of (beneficiary, part):
        row -> SUPERSEDED; create replacement FINAL row (same coverage_year/part/tax basis,
        lep_cents recomputed, created_by_user_id = adjudicator id)
      Invoice repricing for service months >= the new effective_month:
        ISSUED/PAST_DUE -> CANCELLED, replacement ISSUED at corrected amount
        PAID: applied_cents := corrected amount; Beneficiary.credit_cents += paid_cents - applied_cents
      CONSERVATION INVARIANT (money): for the beneficiary,
        sum(invoice.paid_cents) == sum(invoice.applied_cents) + credit_cents
        before and after the cascade.
    input_set: "the EquitableReliefCase; enrollments; penalties; determinations; invoices of the beneficiary+part"
    precision: "integer cents; credit arithmetic exact"

  - name: calc_appeal_redetermination
    trigger: "POST /medicare/appeals/{id}/adjudicate (APPROVED)"
    algorithm: aggregation
    formula: |
      old = appealed FINAL PremiumDetermination -> SUPERSEDED
      new = FINAL row for (beneficiary, old.coverage_year, old.part):
        irmaa_tier recomputed from claimed_magi_cents against the same year's brackets
        base_premium_cents and lep_cents unchanged; created_by_user_id = adjudicator id
      invoice repricing identical to calc_relief_repricing's invoice rules
      (same conservation invariant applies)
    input_set: "the AppealCase; its determination; RateSchedule(coverage_year)"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number = checked first)
# =============================================================================
validations:
  - { priority: 1,  category: auth, check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth, check: "Role is permitted on this endpoint per §1.5 roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3,  category: auth, check: "Beneficiary role may only touch resources whose beneficiary_id == X-User-ID (path or owning entity)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "all beneficiary-scoped endpoints" }
  - { priority: 4,  category: existence, check: "Request body well-formed: required fields present, types valid, enum values in range, month strings parse as YYYY-MM, magi/money fields >= 0", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 5,  category: existence, check: "Beneficiary exists (path beneficiary_id or body beneficiary_id)", error_id: ERR_BENEFICIARY_NOT_FOUND, http_status: 404, applies_to: "beneficiary-scoped endpoints" }
  - { priority: 6,  category: existence, check: "CoverageEnrollment exists", error_id: ERR_ENROLLMENT_NOT_FOUND, http_status: 404, applies_to: "/medicare/enrollments/{id}/*" }
  - { priority: 7,  category: existence, check: "EmployerCoverageRecord exists", error_id: ERR_COVERAGE_RECORD_NOT_FOUND, http_status: 404, applies_to: "/medicare/employer-coverages/{id}/*" }
  - { priority: 8,  category: existence, check: "PremiumDetermination exists", error_id: ERR_DETERMINATION_NOT_FOUND, http_status: 404, applies_to: "/medicare/premium-determinations/{id}, /medicare/premium-determinations/{id}/appeals" }
  - { priority: 9,  category: existence, check: "AppealCase exists", error_id: ERR_APPEAL_NOT_FOUND, http_status: 404, applies_to: "/medicare/appeals/{id}/*" }
  - { priority: 10, category: existence, check: "PremiumInvoice exists", error_id: ERR_INVOICE_NOT_FOUND, http_status: 404, applies_to: "/medicare/invoices/{id}/*" }
  - { priority: 11, category: existence, check: "WithholdingArrangement exists", error_id: ERR_ARRANGEMENT_NOT_FOUND, http_status: 404, applies_to: "/medicare/withholding-arrangements/{id}/*" }
  - { priority: 12, category: existence, check: "EquitableReliefCase exists", error_id: ERR_RELIEF_CASE_NOT_FOUND, http_status: 404, applies_to: "/medicare/equitable-relief-cases/{id}/*" }
  - { priority: 13, category: auth, check: "Segregation of duties: appeal adjudicator's X-User-ID != appealed determination's created_by_user_id", error_id: ERR_SOD_SAME_ACTOR, http_status: 403, applies_to: "POST /medicare/appeals/{id}/adjudicate" }
  - { priority: 14, category: state, check: "OCC: expected_beneficiary_version == Beneficiary.version", error_id: ERR_STALE_BENEFICIARY_VERSION, http_status: 412, applies_to: "POST /medicare/elections" }
  - { priority: 15, category: state, check: "Target resource in a valid state for the requested transition (terminate non-terminal enrollment, verify non-terminal coverage record, adjust non-STOPPED arrangement, end ACTIVE_COVERAGE record, appeal only FINAL determinations, etc.)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 16, category: state, check: "AppealCase in the state the action requires (adjudicate needs UNDER_REVIEW; respond needs MORE_INFO_REQUESTED)", error_id: ERR_APPEAL_NOT_REVIEWABLE, http_status: 409, applies_to: "/medicare/appeals/{id}/adjudicate, /medicare/appeals/{id}/respond" }
  - { priority: 17, category: state, check: "Invoice is payable (ISSUED or PAST_DUE)", error_id: ERR_INVOICE_NOT_PAYABLE, http_status: 409, applies_to: "POST /medicare/invoices/{id}/pay" }
  - { priority: 18, category: business_temporal, check: "An enrollment window governs the clock month: IEP row OPEN (or clock within [iep_start, iep_end]) else SEP-qualified (open SEP row or currently VERIFIED employer coverage) else calendar GEP; precedence IEP > SEP > GEP", error_id: ERR_NO_OPEN_ENROLLMENT_WINDOW, http_status: 422, applies_to: "POST /medicare/enrollments" }
  - { priority: 19, category: business_temporal, check: "Election window open at clock time (AEP Oct 15-Dec 7; OEP_MA Jan 1-Mar 31)", error_id: ERR_ELECTION_WINDOW_CLOSED, http_status: 422, applies_to: "POST /medicare/elections" }
  - { priority: 20, category: business_temporal, check: "Temporal sanity of months: employer coverage end months >= coverage_start_month and <= clock month; relief requested_effective_month strictly earlier than the existing enrollment's effective_month", error_id: ERR_EFFECTIVE_DATE_INVALID, http_status: 422, applies_to: "POST /medicare/employer-coverages/{id}/end, POST /medicare/equitable-relief-cases (adjudicate path)" }
  - { priority: 21, category: business_constraint, check: "No other CoverageEnrollment for the same beneficiary + part in status PENDING or ACTIVE", error_id: ERR_DUPLICATE_ENROLLMENT, http_status: 422, applies_to: "POST /medicare/enrollments" }
  - { priority: 22, category: business_constraint, check: "Part is supported by the endpoint: /enrollments accepts PART_A/B/D only; /premium-determinations accepts PART_B/PART_D only", error_id: ERR_UNSUPPORTED_PART, http_status: 422, applies_to: "POST /medicare/enrollments, POST /medicare/premium-determinations" }
  - { priority: 23, category: business_constraint, check: "Employer coverage closed-interval overlap: no other non-REJECTED record for same beneficiary + employer_name sharing any month", error_id: ERR_COVERAGE_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /medicare/employer-coverages, POST /medicare/employer-coverages/{id}/verify" }
  - { priority: 24, category: business_constraint, check: "Record is VERIFIED before it can anchor an end (SEP creation, payer flip)", error_id: ERR_COVERAGE_NOT_VERIFIED, http_status: 422, applies_to: "POST /medicare/employer-coverages/{id}/end" }
  - { priority: 25, category: business_constraint, check: "No existing TaxReturnRecord for (beneficiary, tax_year)", error_id: ERR_DUPLICATE_TAX_YEAR, http_status: 409, applies_to: "POST /medicare/tax-records" }
  - { priority: 26, category: business_constraint, check: "RateSchedule exists for the requested coverage_year", error_id: ERR_RATE_SCHEDULE_MISSING, http_status: 422, applies_to: "POST /medicare/premium-determinations" }
  - { priority: 27, category: business_constraint, check: "At least one of tax years coverage_year-2 or coverage_year-3 has a TaxReturnRecord", error_id: ERR_TAX_DATA_MISSING, http_status: 422, applies_to: "POST /medicare/premium-determinations" }
  - { priority: 28, category: business_constraint, check: "A non-CANCELLED CoverageEnrollment exists for the requested part", error_id: ERR_NO_ENROLLMENT_FOR_PART, http_status: 422, applies_to: "POST /medicare/premium-determinations" }
  - { priority: 29, category: business_constraint, check: "No non-SUPERSEDED PremiumDetermination exists for (beneficiary, coverage_year, part)", error_id: ERR_DUPLICATE_DETERMINATION, http_status: 409, applies_to: "POST /medicare/premium-determinations" }
  - { priority: 30, category: business_constraint, check: "No RateSchedule already exists for coverage_year", error_id: ERR_DUPLICATE_RATE_SCHEDULE, http_status: 409, applies_to: "POST /medicare/rate-schedules" }
  - { priority: 31, category: business_constraint, check: "No non-STOPPED WithholdingArrangement exists for the beneficiary", error_id: ERR_DUPLICATE_WITHHOLDING, http_status: 409, applies_to: "POST /medicare/withholding-arrangements" }
  - { priority: 32, category: business_constraint, check: "Beneficiary has an ACTIVE WithholdingArrangement (for switch target WITHHOLDING)", error_id: ERR_NO_ACTIVE_WITHHOLDING, http_status: 422, applies_to: "POST /medicare/enrollments/{id}/switch-collection-method" }
  - { priority: 33, category: business_constraint, check: "OEP_MA election requires an ACTIVE PART_C enrollment", error_id: ERR_OEP_REQUIRES_MA, http_status: 422, applies_to: "POST /medicare/elections" }
  - { priority: 34, category: business_constraint, check: "OEP_MA season not already used (no existing election with same season_key)", error_id: ERR_OEP_ELECTION_ALREADY_USED, http_status: 422, applies_to: "POST /medicare/elections" }
  - { priority: 35, category: business_constraint, check: "target_coverage differs from current_coverage", error_id: ERR_ELECTION_TARGET_UNCHANGED, http_status: 422, applies_to: "POST /medicare/elections" }
  - { priority: 36, category: business_constraint, check: "Relief retro interval [requested_effective_month, clock month) must not overlap any existing same-part enrollment interval [effective_month, end_month) — half-open adjacency allowed. Checked at filing ONLY on the create-path (no PENDING/ACTIVE same-part enrollment exists), against TERMINATED/CANCELLED same-part intervals; the adjust-path (an existing PENDING/ACTIVE enrollment whose own start the relief moves earlier) is exempt", error_id: ERR_RELIEF_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /medicare/equitable-relief-cases" }
  - { priority: 37, category: business_fiscal, check: "Payment amount equals outstanding_cents exactly", error_id: ERR_PAYMENT_AMOUNT_MISMATCH, http_status: 422, applies_to: "POST /medicare/invoices/{id}/pay" }

# =============================================================================
# §1.5 API Endpoint Table (37 endpoints: 35 business under /medicare + 2 system)
# =============================================================================
endpoints:
  - method: POST
    path: "/medicare/beneficiaries"
    description: "Register a beneficiary; computes attainment/IEP fields, creates the IEP EnrollmentPeriod row and the opening MEDICARE_PRIMARY/NO_EMPLOYER_COVERAGE PayerCoordinationRecord"
    roles: [FieldOfficer]
    code: 201
    input: [full_name, date_of_birth]
    output: Beneficiary
    side_effects: ["calc_attainment_month", "IEP EnrollmentPeriod created", "initial PayerCoordinationRecord created"]

  - method: GET
    path: "/medicare/beneficiaries/{id}"
    description: "Read a beneficiary (source of truth for OCC version and credit_cents)"
    roles: [Beneficiary, FieldOfficer, AppealsOfficer, BenefitAdministrator]
    code: 200
    input: []
    output: Beneficiary
    side_effects: []

  - method: POST
    path: "/medicare/rate-schedules"
    description: "Publish the premium rate table for a coverage year"
    roles: [BenefitAdministrator]
    code: 201
    input: [coverage_year, part_b_standard_cents, part_d_national_base_cents, irmaa_brackets]
    output: RateSchedule
    side_effects: ["ERR_DUPLICATE_RATE_SCHEDULE if coverage_year already exists"]

  - method: GET
    path: "/medicare/beneficiaries/{id}/enrollment-periods"
    description: "List a beneficiary's EnrollmentPeriod rows (IEP and any SEPs)"
    roles: [Beneficiary, FieldOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: EnrollmentPeriod[]
    side_effects: []

  - method: POST
    path: "/medicare/enrollments"
    description: "Enroll the beneficiary in PART_A/PART_B/PART_D under the governing window (IEP > SEP > GEP precedence); computes effective_month and any late-enrollment penalty"
    roles: [Beneficiary, FieldOfficer]
    code: 201
    input: [beneficiary_id, part]
    output: CoverageEnrollment
    side_effects:
      - "calc_coverage_effective_month; enrollment_status PENDING (or ACTIVE immediately when effective_month <= clock month)"
      - "calc_lep_gap_months + calc_part_b_lep / calc_part_d_lep; PenaltyAssessment created ACTIVE when penalty non-zero"
      - "ERR_NO_OPEN_ENROLLMENT_WINDOW, ERR_DUPLICATE_ENROLLMENT, ERR_UNSUPPORTED_PART"

  - method: GET
    path: "/medicare/enrollments/{id}"
    description: "Read one enrollment (both status dimensions)"
    roles: [Beneficiary, FieldOfficer, BenefitAdministrator]
    code: 200
    input: []
    output: CoverageEnrollment
    side_effects: []

  - method: GET
    path: "/medicare/beneficiaries/{id}/enrollments"
    description: "List a beneficiary's enrollments"
    roles: [Beneficiary, FieldOfficer, BenefitAdministrator]
    code: 200
    input: ["limit?", "offset?"]
    output: CoverageEnrollment[]
    side_effects: []

  - method: POST
    path: "/medicare/enrollments/{id}/terminate"
    description: "Voluntarily end coverage: PENDING -> CANCELLED (end_month stays null), ACTIVE -> TERMINATED (end_month = clock month)"
    roles: [Beneficiary, FieldOfficer]
    code: 200
    input: []
    output: CoverageEnrollment
    side_effects: ["collection_status -> CLOSED", "ERR_INVALID_STATE when already terminal"]

  - method: POST
    path: "/medicare/enrollments/{id}/switch-collection-method"
    description: "Switch premium collection between WITHHOLDING and DIRECT_BILL (cycle); target WITHHOLDING requires an ACTIVE arrangement and non-DELINQUENT state"
    roles: [Beneficiary, FieldOfficer]
    code: 200
    input: [target_method]
    output: CoverageEnrollment
    side_effects: ["collection_status transition", "ERR_NO_ACTIVE_WITHHOLDING, ERR_INVALID_STATE"]

  - method: POST
    path: "/medicare/employer-coverages"
    description: "Register a group-health coverage record (UNVERIFIED, ACTIVE_COVERAGE); closed-interval overlap with an existing non-REJECTED record for the same employer is rejected"
    roles: [Beneficiary, FieldOfficer]
    code: 201
    input: [beneficiary_id, employer_name, employer_size, coverage_start_month, "coverage_end_month?", "employment_end_month?", "is_drug_coverage_creditable?"]
    output: EmployerCoverageRecord
    side_effects: ["ERR_COVERAGE_PERIOD_OVERLAP"]

  - method: GET
    path: "/medicare/beneficiaries/{id}/employer-coverages"
    description: "List a beneficiary's employer coverage records"
    roles: [Beneficiary, FieldOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: EmployerCoverageRecord[]
    side_effects: []

  - method: POST
    path: "/medicare/employer-coverages/{id}/verify"
    description: "Field-officer verification decision (VERIFIED | REJECTED); REJECTED records may be re-verified later (cycle); verifying recomputes payer role retroactively from coverage_start_month"
    roles: [FieldOfficer]
    code: 200
    input: [decision]
    output: EmployerCoverageRecord
    side_effects: ["calc_payer_role (SECONDARY interval from coverage_start_month when employer_size >= 20)", "ERR_COVERAGE_PERIOD_OVERLAP re-checked against VERIFIED records"]

  - method: POST
    path: "/medicare/employer-coverages/{id}/end"
    description: "Record the end of employment and/or coverage; opens the 8-month SEP and flips payer role back to MEDICARE_PRIMARY"
    roles: [Beneficiary, FieldOfficer]
    code: 200
    input: [coverage_end_month, employment_end_month]
    output: EmployerCoverageRecord
    side_effects: ["calc_sep_window (EnrollmentPeriod row created)", "calc_payer_role (interval close + PRIMARY open)", "ERR_COVERAGE_NOT_VERIFIED, ERR_EFFECTIVE_DATE_INVALID"]

  - method: POST
    path: "/medicare/tax-records"
    description: "IRS feed: submit MAGI for a tax year; finalizes any PROVISIONAL determinations waiting on this year"
    roles: [IrsDataAgent]
    code: 201
    input: [beneficiary_id, tax_year, magi_cents, filing_status]
    output: TaxReturnRecord
    side_effects: ["PROVISIONAL PremiumDeterminations whose coverage_year - 2 == tax_year flip to FINAL in place (recalculated)", "ERR_DUPLICATE_TAX_YEAR"]

  - method: GET
    path: "/medicare/beneficiaries/{id}/tax-records"
    description: "List a beneficiary's tax records"
    roles: [Beneficiary, FieldOfficer, AppealsOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: TaxReturnRecord[]
    side_effects: []

  - method: POST
    path: "/medicare/premium-determinations"
    description: "Compute the premium for (beneficiary, coverage_year, part); variant FINAL when the coverage_year-2 tax record exists else PROVISIONAL on coverage_year-3"
    roles: [Beneficiary, FieldOfficer]
    code: 201
    input: [beneficiary_id, coverage_year, part]
    output: PremiumDetermination
    side_effects:
      - "calc_irmaa_tier + calc_total_premium + calc_part_b_lep/calc_part_d_lep"
      - "records created_by_user_id (segregation-of-duties anchor)"
      - "ERR_RATE_SCHEDULE_MISSING, ERR_TAX_DATA_MISSING, ERR_NO_ENROLLMENT_FOR_PART, ERR_DUPLICATE_DETERMINATION, ERR_UNSUPPORTED_PART"

  - method: GET
    path: "/medicare/premium-determinations/{id}"
    description: "Read one determination"
    roles: [Beneficiary, FieldOfficer, AppealsOfficer]
    code: 200
    input: []
    output: PremiumDetermination
    side_effects: []

  - method: GET
    path: "/medicare/beneficiaries/{id}/premium-determinations"
    description: "List a beneficiary's determinations"
    roles: [Beneficiary, FieldOfficer, AppealsOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: PremiumDetermination[]
    side_effects: []

  - method: POST
    path: "/medicare/appeals"
    description: "File a life-changing-event appeal against a FINAL determination (IRMAA relief); created directly UNDER_REVIEW"
    roles: [Beneficiary]
    code: 201
    input: [premium_determination_id, life_event_type, event_date, claimed_magi_cents]
    output: AppealCase
    side_effects: ["ERR_INVALID_STATE when the determination is not FINAL"]

  - method: GET
    path: "/medicare/beneficiaries/{id}/appeals"
    description: "List a beneficiary's appeals"
    roles: [Beneficiary, FieldOfficer, AppealsOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: AppealCase[]
    side_effects: []

  - method: GET
    path: "/medicare/premium-determinations/{id}/appeals"
    description: "List appeals filed against one determination"
    roles: [Beneficiary, FieldOfficer, AppealsOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: AppealCase[]
    side_effects: []

  - method: POST
    path: "/medicare/appeals/{id}/adjudicate"
    description: "AppealsOfficer decision: APPROVED | DENIED | MORE_INFO_REQUESTED; segregation of duties forbids adjudicating a determination you created"
    roles: [AppealsOfficer]
    code: 200
    input: [decision]
    output: AppealCase
    side_effects: ["APPROVED runs calc_appeal_redetermination (supersede + replacement FINAL + invoice reprice)", "ERR_SOD_SAME_ACTOR, ERR_APPEAL_NOT_REVIEWABLE"]

  - method: POST
    path: "/medicare/appeals/{id}/respond"
    description: "Beneficiary answers a MORE_INFO_REQUESTED appeal, cycling it back to UNDER_REVIEW"
    roles: [Beneficiary]
    code: 200
    input: [note]
    output: AppealCase
    side_effects: ["ERR_APPEAL_NOT_REVIEWABLE unless status == MORE_INFO_REQUESTED"]

  - method: POST
    path: "/medicare/withholding-arrangements"
    description: "Establish premium withholding from the monthly benefit check; sweeps eligible PENDING_SETUP/DIRECT_BILL enrollments into WITHHOLDING"
    roles: [Beneficiary, BenefitAdministrator]
    code: 201
    input: [beneficiary_id, monthly_benefit_cents]
    output: WithholdingArrangement
    side_effects: ["eligible enrollments -> WITHHOLDING", "ERR_DUPLICATE_WITHHOLDING"]

  - method: GET
    path: "/medicare/beneficiaries/{id}/withholding-arrangements"
    description: "List a beneficiary's withholding arrangements (0 or 1 non-STOPPED)"
    roles: [Beneficiary, BenefitAdministrator]
    code: 200
    input: ["limit?", "offset?"]
    output: WithholdingArrangement[]
    side_effects: []

  - method: POST
    path: "/medicare/withholding-arrangements/{id}/adjust"
    description: "Adjust the monthly benefit amount; resumes a SUSPENDED arrangement iff the new benefit covers the current total monthly premium"
    roles: [BenefitAdministrator]
    code: 200
    input: [monthly_benefit_cents]
    output: WithholdingArrangement
    side_effects: ["SUSPENDED -> ACTIVE when sufficient; enrollments are NOT auto-flipped back"]

  - method: GET
    path: "/medicare/beneficiaries/{id}/invoices"
    description: "List a beneficiary's premium invoices"
    roles: [Beneficiary, BenefitAdministrator, FieldOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: PremiumInvoice[]
    side_effects: []

  - method: POST
    path: "/medicare/invoices/{id}/pay"
    description: "Pay an invoice in full (amount must equal outstanding_cents exactly); cures delinquency when no PAST_DUE invoices remain"
    roles: [Beneficiary]
    code: 200
    input: [amount_cents]
    output: PremiumInvoice
    side_effects: ["invoice -> PAID", "cure re-check (DELINQUENT -> DIRECT_BILL)", "ERR_INVOICE_NOT_PAYABLE, ERR_PAYMENT_AMOUNT_MISMATCH"]

  - method: GET
    path: "/medicare/beneficiaries/{id}/payer-coordination"
    description: "List a beneficiary's payer-coordination intervals (current row has effective_end_month null)"
    roles: [Beneficiary, FieldOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: PayerCoordinationRecord[]
    side_effects: []

  - method: POST
    path: "/medicare/elections"
    description: "Coverage election during AEP (last-in-wins supersede) or OEP_MA (single-use); OCC-guarded on Beneficiary.version; increments Beneficiary.version by 1 on success"
    roles: [Beneficiary]
    code: 201
    input: [beneficiary_id, election_window, target_coverage, expected_beneficiary_version]
    output: PlanElection
    side_effects:
      - "calc_election_effectivity (window check, effective_month, season_key)"
      - "AEP: prior GOVERNING election in same season -> SUPERSEDED"
      - "increments Beneficiary.version by 1"
      - "ERR_STALE_BENEFICIARY_VERSION, ERR_ELECTION_WINDOW_CLOSED, ERR_OEP_REQUIRES_MA, ERR_OEP_ELECTION_ALREADY_USED, ERR_ELECTION_TARGET_UNCHANGED"

  - method: GET
    path: "/medicare/beneficiaries/{id}/elections"
    description: "List a beneficiary's plan elections"
    roles: [Beneficiary, FieldOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: PlanElection[]
    side_effects: []

  - method: POST
    path: "/medicare/equitable-relief-cases"
    description: "File for equitable relief over enrollment errors caused by misinformation; retro intervals overlapping an existing same-part enrollment are rejected at filing"
    roles: [Beneficiary, FieldOfficer]
    code: 201
    input: [beneficiary_id, relief_type, part, claimed_misinform_source, description, "requested_effective_month?"]
    output: EquitableReliefCase
    side_effects: ["status UNDER_INVESTIGATION", "ERR_RELIEF_PERIOD_OVERLAP"]

  - method: GET
    path: "/medicare/beneficiaries/{id}/equitable-relief-cases"
    description: "List a beneficiary's equitable relief cases"
    roles: [Beneficiary, FieldOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: EquitableReliefCase[]
    side_effects: []

  - method: POST
    path: "/medicare/equitable-relief-cases/{id}/adjudicate"
    description: "FieldOfficer decision: GRANTED | DENIED; GRANTED runs the full repricing cascade (calc_relief_repricing)"
    roles: [FieldOfficer]
    code: 200
    input: [decision]
    output: EquitableReliefCase
    side_effects: ["calc_relief_repricing on GRANTED", "ERR_INVALID_STATE when not UNDER_INVESTIGATION"]

  - method: GET
    path: "/medicare/beneficiaries/{id}/penalties"
    description: "List a beneficiary's late-enrollment penalty assessments"
    roles: [Beneficiary, FieldOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: PenaltyAssessment[]
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time"
    roles: [BenefitAdministrator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  - method: POST
    path: "/_ops/run_monthly_cycle"
    description: "Test-driving ops-run checkpoint: advances the monthly batch for the current clock month — activates due enrollments, recomputes window statuses, issues invoices, runs the withholding waterfall, advances delinquency/termination, effectuates due elections, recomputes time-based payer roles"
    roles: [BenefitAdministrator]
    code: 200
    input: []
    output: { cycle_month: string, enrollments_activated: integer, invoices_issued: integer, enrollments_terminated: integer, elections_effectuated: integer }
    side_effects: ["calc_invoice_amount", "calc_withholding_waterfall", "calc_delinquency", "calc_election_effectivity", "EnrollmentPeriod status recompute", "calc_payer_role time-based ends", "PROVISIONAL -> FINAL safety-net re-check"]

# =============================================================================
# §1.6 Error Code Catalog (38 codes)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role is not in the endpoint's role list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Beneficiary role acting on a resource whose beneficiary_id != X-User-ID" }
  - { id: ERR_SOD_SAME_ACTOR, http: 403, condition: "Appeal adjudicator's X-User-ID equals the appealed determination's created_by_user_id (segregation of duties)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, bad type, unknown enum member, bad month format, negative money" }
  - { id: ERR_BENEFICIARY_NOT_FOUND, http: 404, condition: "No beneficiary with that id" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "No enrollment with that id" }
  - { id: ERR_COVERAGE_RECORD_NOT_FOUND, http: 404, condition: "No employer coverage record with that id" }
  - { id: ERR_DETERMINATION_NOT_FOUND, http: 404, condition: "No premium determination with that id" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "No appeal with that id" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "No invoice with that id" }
  - { id: ERR_ARRANGEMENT_NOT_FOUND, http: 404, condition: "No withholding arrangement with that id" }
  - { id: ERR_RELIEF_CASE_NOT_FOUND, http: 404, condition: "No equitable relief case with that id" }
  - { id: ERR_STALE_BENEFICIARY_VERSION, http: 412, condition: "OCC: expected_beneficiary_version != Beneficiary.version on election creation" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is in a state that forbids the requested transition (generic state error)" }
  - { id: ERR_APPEAL_NOT_REVIEWABLE, http: 409, condition: "Adjudicate requires UNDER_REVIEW; respond requires MORE_INFO_REQUESTED" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "Invoice is PAID, CANCELLED, or WRITTEN_OFF" }
  - { id: ERR_NO_OPEN_ENROLLMENT_WINDOW, http: 422, condition: "Clock month governed by no enrollment window (IEP expired, no SEP, not GEP season)" }
  - { id: ERR_ELECTION_WINDOW_CLOSED, http: 422, condition: "Clock outside the requested AEP/OEP_MA window" }
  - { id: ERR_EFFECTIVE_DATE_INVALID, http: 422, condition: "End months before coverage start or after the clock month; relief requested month not strictly earlier than existing effective_month" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 422, condition: "A PENDING or ACTIVE enrollment for the same part already exists" }
  - { id: ERR_UNSUPPORTED_PART, http: 422, condition: "PART_C via /enrollments, or PART_A/PART_C via /premium-determinations" }
  - { id: ERR_COVERAGE_PERIOD_OVERLAP, http: 409, condition: "Employer coverage closed-interval collision for the same beneficiary + employer_name" }
  - { id: ERR_COVERAGE_NOT_VERIFIED, http: 422, condition: "End/SEP anchoring requires verification_status == VERIFIED" }
  - { id: ERR_DUPLICATE_TAX_YEAR, http: 409, condition: "A TaxReturnRecord for (beneficiary, tax_year) already exists" }
  - { id: ERR_RATE_SCHEDULE_MISSING, http: 422, condition: "No RateSchedule published for the requested coverage_year" }
  - { id: ERR_TAX_DATA_MISSING, http: 422, condition: "Neither coverage_year-2 nor coverage_year-3 has a TaxReturnRecord" }
  - { id: ERR_NO_ENROLLMENT_FOR_PART, http: 422, condition: "Determination requested for a part with no non-CANCELLED enrollment" }
  - { id: ERR_DUPLICATE_DETERMINATION, http: 409, condition: "A non-SUPERSEDED determination already exists for (beneficiary, coverage_year, part)" }
  - { id: ERR_DUPLICATE_RATE_SCHEDULE, http: 409, condition: "A RateSchedule for coverage_year already exists" }
  - { id: ERR_DUPLICATE_WITHHOLDING, http: 409, condition: "A non-STOPPED WithholdingArrangement already exists for the beneficiary" }
  - { id: ERR_NO_ACTIVE_WITHHOLDING, http: 422, condition: "Switch to WITHHOLDING requires an ACTIVE arrangement" }
  - { id: ERR_OEP_REQUIRES_MA, http: 422, condition: "OEP_MA election without an ACTIVE PART_C enrollment" }
  - { id: ERR_OEP_ELECTION_ALREADY_USED, http: 422, condition: "Second election within the same OEP_MA season" }
  - { id: ERR_ELECTION_TARGET_UNCHANGED, http: 422, condition: "target_coverage == current_coverage" }
  - { id: ERR_RELIEF_PERIOD_OVERLAP, http: 409, condition: "Relief retro interval collides with an existing same-part enrollment interval" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "Payment amount_cents does not equal the invoice's outstanding_cents exactly" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Beneficiary
    description: "The enrolled/enrolling person; may act only on their own records (X-User-ID == beneficiary id)"
    identity: "entity_backed:Beneficiary"
    exclusive_operations:
      - "POST /medicare/appeals — file a life-change appeal"
      - "POST /medicare/appeals/{id}/respond — answer a MORE_INFO_REQUESTED appeal"
      - "POST /medicare/invoices/{id}/pay — pay an invoice"
      - "POST /medicare/elections — make AEP/OEP_MA coverage elections"
    shared_operations:
      - "POST /medicare/enrollments, POST /medicare/enrollments/{id}/terminate, POST /medicare/enrollments/{id}/switch-collection-method (shared with FieldOfficer)"
      - "POST /medicare/employer-coverages, POST /medicare/employer-coverages/{id}/end (shared with FieldOfficer)"
      - "POST /medicare/withholding-arrangements (shared with BenefitAdministrator)"
      - "POST /medicare/premium-determinations (shared with FieldOfficer)"
      - "POST /medicare/equitable-relief-cases (shared with FieldOfficer)"
      - "All beneficiary-scoped GET list/read endpoints"
  - name: FieldOfficer
    description: "Agency field-office caseworker: registers beneficiaries, verifies employer coverage, authors premium determinations, adjudicates equitable relief"
    identity: "opaque"
    exclusive_operations:
      - "POST /medicare/beneficiaries — register beneficiary"
      - "POST /medicare/employer-coverages/{id}/verify — verify/reject coverage"
      - "POST /medicare/equitable-relief-cases/{id}/adjudicate — grant/deny relief"
    shared_operations:
      - "Enrollment, termination, collection-method switch, employer-coverage registration/end, determinations, relief filing (shared with Beneficiary)"
      - "Read endpoints for beneficiaries, periods, enrollments, employer coverages, tax records, determinations, appeals, invoices, payer coordination, elections, penalties, relief cases"
  - name: AppealsOfficer
    description: "Independent adjudicator for life-change appeals; barred by segregation of duties from touching determinations they authored"
    identity: "opaque"
    exclusive_operations:
      - "POST /medicare/appeals/{id}/adjudicate — APPROVED | DENIED | MORE_INFO_REQUESTED"
    shared_operations:
      - "Read endpoints for beneficiaries, tax records, determinations, appeals"
  - name: IrsDataAgent
    description: "IRS data feed: submits tax return records"
    identity: "opaque"
    exclusive_operations:
      - "POST /medicare/tax-records — submit MAGI per tax year"
    shared_operations: []
  - name: BenefitAdministrator
    description: "Program operator: publishes rate schedules, adjusts benefit amounts, drives the logical clock and the monthly ops cycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /medicare/rate-schedules — publish yearly rate table"
      - "POST /medicare/withholding-arrangements/{id}/adjust — adjust benefit amount"
      - "POST /_clock/set_current_utc — set logical clock (default 2026-09-01T00:00:00Z)"
      - "POST /_ops/run_monthly_cycle — run monthly batch"
    shared_operations:
      - "POST /medicare/withholding-arrangements (shared with Beneficiary)"
      - "Read endpoints for beneficiaries, enrollments, invoices, withholding arrangements"
