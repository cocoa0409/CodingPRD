  - rule_id: compensating_invariant
    instances:

      - name: oven_booked_minutes_returns_to_zero_after_rejection_and_rebooks_without_drift
        grounds:
          - calculations.oven_booked_minutes_ledger
          - state_machines.StatorBuild.IMPREGNATED_to_REJECTED
          - validations[priority=52]
          - entities.CuringOven.fields.booked_minutes
          - endpoints[POST /stator-builds/{id}/disposition]
        distinguishing_aspect: |
          The invariant is that CuringOven.booked_minutes always equals the sum of
          impregnation_minutes over the builds still in {IMPREGNATED, SURGE_TESTED, ACCEPTED} — so
          a rejection must release exactly the minutes it booked, no more and no less. The test
          drives 0 -> 240 -> 0 -> 240 through a reject-and-rebuild cycle that re-uses the IDENTICAL
          oven window, which can only succeed if the release was complete: any residual booking
          would make the second impregnation collide with the first under the buffered
          conflict rule, and any over-release would drive the ledger negative.
        test_recipe:
          setup:
            - "OVEN-A with cooldown_buffer_minutes 45 and booked_minutes 0."
            - "Design D1 RELEASED; order o1 for 12 units CONFIRMED; WO1 open."
            - "sb1 on WO1 impregnated 2026-08-03T08:00:00.000Z - 12:00:00.000Z, so booked_minutes is 240."
