  # =====================================================================
  # Rule 4 — transitive_cascade (≥2 instances, different triggers, depths ≥3 and ≥2)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: suspend_cascade_household_to_card_to_transaction
        grounds:
          - state_machines.Household.ACTIVE_to_SUSPENDED
          - state_machines.EBTCard.ACTIVE_to_SUSPENDED
          - state_machines.PurchaseTransaction.AUTHORIZED_to_REVERSED
          - entities.Household.fields.status
          - entities.EBTCard.fields.status
          - entities.PurchaseTransaction.fields.status
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /snap/households/{id}/suspend.
          Link 1: Household ACTIVE→SUSPENDED (caused by the API call).
          Link 2: EBTCard ACTIVE→SUSPENDED (caused by link 1, not by the
          original API call directly — it cascades because the household
          flipped). Link 3: PurchaseTransaction AUTHORIZED→REVERSED (caused
          by link 2 — the card's own SUSPEND side-effect, not by link 1).
          Different trigger from
          approval_cascade_application_to_household_to_card (approve).
        test_recipe:
          setup:
            - "Clock: 2026-08-01T00:00:00Z"
            - "Household HH ACTIVE size=1 state_code=GA"
            - "EBTCard CARD ACTIVE for HH"
            - "EligibleItemCategory FRESH_PRODUCE (eligible=true)"
            - "PurchaseTransaction TX1 AUTHORIZED on CARD (total_cents=5000)"
            - "FraudFlag FF SUBSTANTIATED for HH (precondition for /suspend)"
          setup_api_calls:
            - call: "POST /snap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PolicyAdmin
              as_user_id: "pa_001"
            - call: "POST /snap/eligible-item-categories"
              payload: { code: "FRESH_PRODUCE", name: "Fresh Produce", eligible: true }
              as: PolicyAdmin
              as_user_id: "pa_001"
            - call: "POST /snap/households"
              payload: { case_number: "GA-700001", state_code: "GA", address_line: "7 Oak St", heap_recipient: false }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh_id: "$.data.id" }
            - call: "POST /snap/household-members"
              payload: { household_id: "${hh_id}", full_name: "Solo", date_of_birth: "1970-01-01", relationship: "HEAD", disabled: true }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications"
              payload: { household_id: "${hh_id}" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { app_id: "$.data.id" }
            - call: "POST /snap/applications/${app_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications/${app_id}/approve"
              payload: { decision_reason: "ok" }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "GET /snap/ebt-cards"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
              captures: { card_id: "$.data[0].id" }
            - call: "POST /snap/ebt-cards/${card_id}/activate"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/purchase-transactions"
              payload: { ebt_card_id: "${card_id}", merchant_id: "M001", line_items: [{category_code: "FRESH_PRODUCE", amount_cents: 5000, quantity: 1}] }
              as: Merchant
              as_user_id: "mer_001"
              captures: { tx1_id: "$.data.id" }
            - call: "POST /snap/fraud-flags"
              payload: { household_id: "${hh_id}", trigger_rule: "VELOCITY_SPIKE" }
              as: FraudInvestigator
              as_user_id: "inv_001"
              captures: { ff_id: "$.data.id" }
            - call: "POST /snap/fraud-flags/${ff_id}/claim"
              payload: {}
              as: FraudInvestigator
              as_user_id: "inv_001"
              captures: { ff_v: "$.data.version" }
            - call: "POST /snap/fraud-flags/${ff_id}/substantiate"
              payload: { resolution_note: "Confirmed", expected_fraudflag_version: "${ff_v}" }
              as: FraudInvestigator
              as_user_id: "inv_001"
          trigger:
            - call: "POST /snap/households/${hh_id}/suspend"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh_status: "$.data.status" }
            - call: "GET /snap/ebt-cards/${card_id}"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
              captures: { card_status: "$.data.status" }
            - call: "GET /snap/purchase-transactions/${tx1_id}"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
              captures: { tx_status: "$.data.status" }
          assert:
            - "Household.${hh_id}.status == 'SUSPENDED' (link 1)"
            - "EBTCard.${card_id}.status == 'SUSPENDED' (link 2, caused by link 1)"
            - "PurchaseTransaction.${tx1_id}.status == 'REVERSED' (link 3, caused by link 2's EBTCard.suspend side-effect)"

      - name: approval_cascade_application_to_household_to_card
        grounds:
          - state_machines.Application.SUBMITTED_to_APPROVED
          - state_machines.Household.PENDING_to_CERTIFIED
          - state_machines.Household.CERTIFIED_to_ACTIVE
          - entities.Household.fields.status
          - entities.Household.fields.certification_end_date
          - entities.EBTCard.fields.status
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /snap/applications/{id}/approve.
          Link 1: Application SUBMITTED→APPROVED. Link 2: Household
          PENDING→CERTIFIED→ACTIVE (auto-advance, caused by link 1). Link 3:
          EBTCard with status PENDING_ISSUE created (caused by link 2's
          Household.CERTIFIED_to_ACTIVE side-effect, not directly by the
          approve call). Different trigger from
          suspend_cascade_household_to_card_to_transaction (/suspend).
        test_recipe:
          setup:
            - "Clock: 2026-09-01T00:00:00Z"
            - "Household HH PENDING size=1 state_code=PA, heap_recipient=false"
            - "Member disabled=true earned=10000"
            - "Application APP SUBMITTED"
          setup_api_calls:
            - call: "POST /snap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PolicyAdmin
              as_user_id: "pa_001"
            - call: "POST /snap/households"
              payload: { case_number: "PA-800001", state_code: "PA", address_line: "8 Maple Ave", heap_recipient: false }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh_id: "$.data.id" }
            - call: "POST /snap/household-members"
              payload: { household_id: "${hh_id}", full_name: "Solo", date_of_birth: "1970-01-01", relationship: "HEAD", monthly_earned_income_cents: 10000, disabled: true }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications"
              payload: { household_id: "${hh_id}" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { app_id: "$.data.id" }
            - call: "POST /snap/applications/${app_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
          trigger:
            - call: "POST /snap/applications/${app_id}/approve"
              payload: { decision_reason: "Eligible" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { app_status: "$.data.status" }
            - call: "GET /snap/households/${hh_id}"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh_status: "$.data.status", cert_end: "$.data.certification_end_date" }
            - call: "GET /snap/ebt-cards"
              payload: { household_id: "${hh_id}" }
              as: Caseworker
              as_user_id: "cw_001"
              
          assert:
            - "Application.${app_id}.status == 'APPROVED' (link 1)"
            - "Household.${hh_id}.status == 'ACTIVE' (link 2: PENDING→CERTIFIED→ACTIVE auto-advance)"
            - "Household.${hh_id}.certification_end_date is set (link 2 side-effect)"
            - "EBTCard list for HH has total_count == 1 with status 'PENDING_ISSUE' (link 3: cascade from CERTIFIED_to_ACTIVE)"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (≥2 instances, different error-category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_fiscal_on_double_approve
        grounds:
          - validations[priority=6]
          - validations[priority=17]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INCOME_LIMIT_EXCEEDED]
          - state_machines.Application
        distinguishing_aspect: |
          Pair: state (ERR_INVALID_STATE, priority 6) vs business_fiscal
          (ERR_INCOME_LIMIT_EXCEEDED, priority 17). A second /approve on an
          already-APPROVED application AFTER member income was raised above
          the limit returns ERR_INVALID_STATE — state check wins over the
          business_fiscal check. Different error-category pair from
          auth_beats_state_on_wrong_role_suspend (auth vs state).
        test_recipe:
          setup:
            - "Clock: 2026-09-01T00:00:00Z"
            - "Household HH ACTIVE size=1 state_code=OH, heap_recipient=false"
            - "Member M earned=200000 (raised AFTER initial approve)"
            - "Application APP APPROVED (initial approve at low income succeeded)"
          setup_api_calls:
            - call: "POST /snap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PolicyAdmin
              as_user_id: "pa_001"
            - call: "POST /snap/households"
              payload: { case_number: "OH-900001", state_code: "OH", address_line: "9 Birch St", heap_recipient: false }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh_id: "$.data.id" }
            - call: "POST /snap/household-members"
              payload: { household_id: "${hh_id}", full_name: "Solo", date_of_birth: "1970-01-01", relationship: "HEAD", monthly_earned_income_cents: 10000, disabled: true }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { m_id: "$.data.id" }
            - call: "POST /snap/applications"
              payload: { household_id: "${hh_id}" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { app_id: "$.data.id" }
            - call: "POST /snap/applications/${app_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications/${app_id}/approve"
              payload: { decision_reason: "Initially eligible" }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "PATCH /snap/household-members/${m_id}"
              payload: { monthly_earned_income_cents: 200000 }
              as: Caseworker
              as_user_id: "cw_001"
          trigger:
            - call: "POST /snap/applications/${app_id}/approve"
              payload: { decision_reason: "Second attempt" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == 'ERR_INVALID_STATE' (state check at priority 6 wins, not ERR_INCOME_LIMIT_EXCEEDED at priority 17)"

