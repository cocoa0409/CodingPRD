      - name: advance_out_of_open_intake_is_blocked_by_an_in_flight_claim
        claim_type: Precondition Enforcement
        grounds:
          - state_machines[CompensationCycle].transitions[OPEN_INTAKE->SELF_ASSESSMENT]
