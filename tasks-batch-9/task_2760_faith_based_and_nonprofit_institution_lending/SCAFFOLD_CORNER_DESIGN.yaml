  - section: state_machines
    instances:
      - name: board_verification_forks_to_board_verified_when_denomination_must_approve
        claim_type: valid_transition
        grounds:
          - state_machines.GovernanceAuthorization.transitions[SUBMITTED -> BOARD_VERIFIED]
          - entities.GovernanceAuthorization.fields.board_quorum_pct
          - entities.GovernanceAuthorization.fields.verified_by_user_id
        distinguishing_aspect: "One trigger, two destinations: with requires_denominational_approval true the packet lands on BOARD_VERIFIED (not AUTHORIZED) and records board_quorum_pct 0.6667 plus the verifying officer's id."
        test_recipe:
          setup:
            - "An institution that owes a denominational decision, with a SUBMITTED packet naming its presbytery."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", requires_denominational_approval: true, bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667, community_program_count: 3 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
            - call: "POST /governance-authorizations"
              payload: { institution_id: "${inst}", resolution_date: "2026-06-15T00:00:00Z", bylaws_citation: "Article VII Section 3", board_votes_for: 8, board_votes_total: 12, authorized_amount_cents: 400000000, denominational_body: "Presbytery of the Southeast", expires_on: "2027-06-30T00:00:00Z" }
              as: InstitutionRepresentative
              as_user_id: "${inst}"
              captures: { gov: $.data.id }
            - call: "POST /governance-authorizations/${gov}/submit"
              payload: {}
              as: InstitutionRepresentative
              as_user_id: "${inst}"
          trigger:
            - call: "POST /governance-authorizations/${gov}/board-verification"
              payload: { minutes_reference: "MIN-2026-06-15" }
              as: GovernanceOfficer
              as_user_id: "officer-1"
          assert:
            - "HTTP 200 and data.status == \"BOARD_VERIFIED\" — NOT \"AUTHORIZED\""
            - "data.board_quorum_pct == 0.6667 (round_half_up(8/12, 4))"
            - "data.verified_by_user_id == \"officer-1\""
            - "data.revision_round == 0 and data.denominational_decision_note is null"

      - name: board_verification_forks_straight_to_authorized_without_denominational_obligation
        claim_type: valid_transition
        grounds:
          - state_machines.GovernanceAuthorization.transitions[SUBMITTED -> AUTHORIZED]
          - entities.Institution.fields.requires_denominational_approval
        distinguishing_aspect: "The identical board-verification call on an institution with requires_denominational_approval false skips BOARD_VERIFIED entirely and lands on AUTHORIZED — the destination is data-dependent, not trigger-dependent."
        test_recipe:
          setup:
            - "An institution with no denominational obligation and a SUBMITTED packet."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Mercy Ministries", institution_type: "NONPROFIT_MINISTRY", denomination_code: "INDEPENDENT", requires_denominational_approval: false, bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
            - call: "POST /governance-authorizations"
              payload: { institution_id: "${inst}", resolution_date: "2026-06-15T00:00:00Z", bylaws_citation: "Article IV Section 2", board_votes_for: 8, board_votes_total: 12, authorized_amount_cents: 400000000, expires_on: "2027-06-30T00:00:00Z" }
              as: InstitutionRepresentative
              as_user_id: "${inst}"
              captures: { gov: $.data.id }
            - call: "POST /governance-authorizations/${gov}/submit"
              payload: {}
              as: InstitutionRepresentative
              as_user_id: "${inst}"
          trigger:
            - call: "POST /governance-authorizations/${gov}/board-verification"
              payload: { minutes_reference: "MIN-2026-06-15" }
              as: GovernanceOfficer
              as_user_id: "officer-1"
          assert:
            - "HTTP 200 and data.status == \"AUTHORIZED\""
            - "data.board_quorum_pct == 0.6667 and data.verified_by_user_id == \"officer-1\" — the same side effects fire on both arms of the fork"
            - "data.denominational_body is null and data.denominational_decision_note is null"

      - name: denominational_rejection_then_return_to_draft_increments_revision_round
        claim_type: cyclic
        grounds:
          - state_machines.GovernanceAuthorization.transitions[BOARD_VERIFIED -> DENOM_REJECTED]
          - state_machines.GovernanceAuthorization.transitions[DENOM_REJECTED -> DRAFT]
          - entities.GovernanceAuthorization.fields.revision_round
        distinguishing_aspect: "The governance cycle re-enters DRAFT with revision_round 1 while verified_by_user_id and denominational_decision_note are cleared to null, and the same packet can be re-submitted without creating a new row."
        test_recipe:
          setup:
            - "A BOARD_VERIFIED packet for an institution that owes a denominational decision."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", requires_denominational_approval: true, bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
            - call: "POST /governance-authorizations"
              payload: { institution_id: "${inst}", resolution_date: "2026-06-15T00:00:00Z", bylaws_citation: "Article VII Section 3", board_votes_for: 8, board_votes_total: 12, authorized_amount_cents: 400000000, denominational_body: "Presbytery of the Southeast", expires_on: "2027-06-30T00:00:00Z" }
              as: InstitutionRepresentative
              as_user_id: "${inst}"
              captures: { gov: $.data.id }
            - call: "POST /governance-authorizations/${gov}/submit"
              payload: {}
              as: InstitutionRepresentative
              as_user_id: "${inst}"
            - call: "POST /governance-authorizations/${gov}/board-verification"
              payload: { minutes_reference: "MIN-2026-06-15" }
              as: GovernanceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /governance-authorizations/${gov}/denominational-decision"
              payload: { decision: "REJECT", note: "Presbytery wants a revised debt schedule" }
              as: GovernanceOfficer
              as_user_id: "officer-1"
            - call: "POST /governance-authorizations/${gov}/return-to-draft"
              payload: { rework_note: "Reworking the amortization schedule" }
              as: InstitutionRepresentative
              as_user_id: "${inst}"
            - call: "POST /governance-authorizations/${gov}/submit"
              payload: {}
              as: InstitutionRepresentative
              as_user_id: "${inst}"
          assert:
            - "First response: data.status == \"DENOM_REJECTED\" and data.denominational_decision_note == \"Presbytery wants a revised debt schedule\""
            - "Second response: data.status == \"DRAFT\", data.revision_round == 1, data.denominational_decision_note is null, data.verified_by_user_id is null"
            - "Third response: HTTP 200 with data.status == \"SUBMITTED\" and data.id still == ${gov} — the cycle reuses the packet"
            - "GET /governance-authorizations with institution_id == ${inst} returns total_count == 1"

      - name: board_verification_on_a_draft_packet_conflicts_with_the_declared_from_state
        claim_type: invalid_transitions
        grounds:
          - validations[priority=18]
          - errors[ERR_AUTHORIZATION_INVALID_STATE]
          - state_machines.GovernanceAuthorization.transitions[SUBMITTED -> AUTHORIZED]
        distinguishing_aspect: "Board verification is only declared from SUBMITTED; running it on a DRAFT packet is 409 ERR_AUTHORIZATION_INVALID_STATE and leaves board_quorum_pct null."
        test_recipe:
          setup:
            - "A DRAFT packet that was never submitted."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
            - call: "POST /governance-authorizations"
              payload: { institution_id: "${inst}", resolution_date: "2026-06-15T00:00:00Z", bylaws_citation: "Article VII Section 3", board_votes_for: 8, board_votes_total: 12, authorized_amount_cents: 400000000, expires_on: "2027-06-30T00:00:00Z" }
              as: InstitutionRepresentative
              as_user_id: "${inst}"
              captures: { gov: $.data.id }
          trigger:
            - call: "POST /governance-authorizations/${gov}/board-verification"
              payload: { minutes_reference: "MIN-2026-06-15" }
              as: GovernanceOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
            - call: "GET /governance-authorizations/${gov}"
              payload: {}
              as: GovernanceOfficer
          assert:
            - "First response: HTTP 409 with ${err} == \"ERR_AUTHORIZATION_INVALID_STATE\""
            - "Second response: data.status == \"DRAFT\", data.board_quorum_pct is null, data.verified_by_user_id is null"

      - name: denominational_decision_on_a_packet_with_no_body_returns_approval_required
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=32]
          - errors[ERR_DENOMINATIONAL_APPROVAL_REQUIRED]
          - state_machines.GovernanceAuthorization.transitions[BOARD_VERIFIED -> AUTHORIZED]
        distinguishing_aspect: "The packet IS in the declared from-state BOARD_VERIFIED, so priority 18 passes; the request still fails 422 ERR_DENOMINATIONAL_APPROVAL_REQUIRED because denominational_body was never supplied, stranding the packet on BOARD_VERIFIED."
        test_recipe:
          setup:
            - "An institution that requires denominational approval, whose packet omitted denominational_body and has been board-verified."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", requires_denominational_approval: true, bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
            - call: "POST /governance-authorizations"
              payload: { institution_id: "${inst}", resolution_date: "2026-06-15T00:00:00Z", bylaws_citation: "Article VII Section 3", board_votes_for: 8, board_votes_total: 12, authorized_amount_cents: 400000000, expires_on: "2027-06-30T00:00:00Z" }
              as: InstitutionRepresentative
              as_user_id: "${inst}"
              captures: { gov: $.data.id }
            - call: "POST /governance-authorizations/${gov}/submit"
              payload: {}
              as: InstitutionRepresentative
              as_user_id: "${inst}"
            - call: "POST /governance-authorizations/${gov}/board-verification"
              payload: { minutes_reference: "MIN-2026-06-15" }
              as: GovernanceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /governance-authorizations/${gov}/denominational-decision"
              payload: { decision: "APPROVE", note: "Presbytery consent on file" }
              as: GovernanceOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
            - call: "GET /governance-authorizations/${gov}"
              payload: {}
              as: GovernanceOfficer
          assert:
            - "First response: HTTP 422 with ${err} == \"ERR_DENOMINATIONAL_APPROVAL_REQUIRED\""
            - "Second response: data.status == \"BOARD_VERIFIED\" and data.denominational_decision_note is null — the packet cannot reach AUTHORIZED at all"

      - name: pledge_reaching_its_full_amount_becomes_fulfilled_and_moves_campaign_buckets
        claim_type: side_effect_execution
        grounds:
          - state_machines.Pledge.transitions[ACTIVE -> FULFILLED]
          - entities.PledgeCampaign.fields.active_pledged_cents
          - entities.PledgeCampaign.fields.fulfilled_pledged_cents
        distinguishing_aspect: "A single PAID installment covering the whole pledge drives ACTIVE -> FULFILLED and moves the full pledged amount out of active_pledged_cents into fulfilled_pledged_cents while collected_to_date_cents keeps counting it."
        test_recipe:
          setup:
            - "An OPEN campaign with one 10000000-cent GENERAL pledge."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
            - call: "POST /pledge-campaigns"
              payload: { institution_id: "${inst}", campaign_name: "Building For Generations", goal_cents: 120000000, pledge_period_months: 36, sponsor_collection_rate_bps: 9500 }
              as: InstitutionRepresentative
              as_user_id: "${inst}"
              captures: { camp: $.data.id, camp_v0: $.data.version }
            - call: "POST /pledges"
              payload: { pledge_campaign_id: "${camp}", donor_tier: "GENERAL", pledged_amount_cents: 10000000, installment_count: 12, expected_pledge_campaign_version: "${camp_v0}" }
              as: CreditAnalyst
              captures: { pledge: $.data.id }
          trigger:
            - call: "POST /pledges/${pledge}/payments"
              payload: { installment_month: 1, outcome: "PAID", amount_cents: 10000000 }
              as: LoanServicer
            - call: "GET /pledge-campaigns/${camp}"
              payload: {}
              as: CreditAnalyst
          assert:
            - "First response: data.status == \"FULFILLED\", data.collected_cents == 10000000, data.payments_made_count == 1, data.missed_payments_count == 0"
            - "Second response: data.total_pledged_cents == 10000000, data.active_pledged_cents == 0, data.fulfilled_pledged_cents == 10000000, data.lapsed_pledged_cents == 0"
            - "Second response: data.collected_to_date_cents == 10000000 and data.attrition_adjusted_value_cents == 10000000 — cash in hand is never discounted"
            - "Second response: data.status == \"OPEN\" — total_pledged_cents 10000000 is below floor(120000000 * 0.90), so the maturity gate blocks UNDERPERFORMING"

      - name: installment_recorded_on_a_fulfilled_pledge_returns_pledge_invalid_state
        claim_type: invalid_transitions
        grounds:
          - validations[priority=23]
          - errors[ERR_PLEDGE_INVALID_STATE]
          - state_machines.Pledge.terminal_states
        distinguishing_aspect: "FULFILLED is terminal: a further installment on a fully collected pledge is 409 ERR_PLEDGE_INVALID_STATE and collected_cents does not move past pledged_amount_cents."
        test_recipe:
          setup:
            - "A pledge already driven to FULFILLED by one covering installment."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
            - call: "POST /pledge-campaigns"
              payload: { institution_id: "${inst}", campaign_name: "Building For Generations", goal_cents: 120000000, pledge_period_months: 36, sponsor_collection_rate_bps: 9500 }
              as: InstitutionRepresentative
              as_user_id: "${inst}"
              captures: { camp: $.data.id, camp_v0: $.data.version }
            - call: "POST /pledges"
              payload: { pledge_campaign_id: "${camp}", donor_tier: "GENERAL", pledged_amount_cents: 10000000, installment_count: 12, expected_pledge_campaign_version: "${camp_v0}" }
              as: CreditAnalyst
              captures: { pledge: $.data.id }
            - call: "POST /pledges/${pledge}/payments"
              payload: { installment_month: 1, outcome: "PAID", amount_cents: 10000000 }
              as: LoanServicer
          trigger:
            - call: "POST /pledges/${pledge}/payments"
              payload: { installment_month: 2, outcome: "PAID", amount_cents: 500000 }
              as: LoanServicer
              captures: { err: $.data.error_id }
            - call: "GET /pledges/${pledge}"
              payload: {}
              as: LoanServicer
          assert:
            - "First response: HTTP 409 with ${err} == \"ERR_PLEDGE_INVALID_STATE\""
            - "Second response: data.collected_cents == 10000000 and data.payments_made_count == 1 — the rejected installment changed nothing"

      - name: closing_an_already_closed_campaign_returns_campaign_closed
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.PledgeCampaign.terminal_states
          - validations[priority=24]
          - errors[ERR_CAMPAIGN_CLOSED]
        distinguishing_aspect: "CLOSED is terminal for the campaign: a second close is 409 ERR_CAMPAIGN_CLOSED, and so is a pledge creation against the frozen campaign."
        test_recipe:
          setup:
            - "An OPEN campaign that has just been closed once."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
            - call: "POST /pledge-campaigns"
              payload: { institution_id: "${inst}", campaign_name: "Building For Generations", goal_cents: 120000000, pledge_period_months: 36, sponsor_collection_rate_bps: 9500 }
              as: InstitutionRepresentative
              as_user_id: "${inst}"
              captures: { camp: $.data.id }
            - call: "POST /pledge-campaigns/${camp}/close"
              payload: { close_note: "Campaign concluded" }
              as: InstitutionRepresentative
              as_user_id: "${inst}"
              captures: { camp_v1: $.data.version }
          trigger:
            - call: "POST /pledge-campaigns/${camp}/close"
              payload: { close_note: "Closing again" }
              as: InstitutionRepresentative
              as_user_id: "${inst}"
              captures: { err_close: $.data.error_id }
            - call: "POST /pledges"
              payload: { pledge_campaign_id: "${camp}", donor_tier: "LEAD", pledged_amount_cents: 5000000, installment_count: 10, expected_pledge_campaign_version: "${camp_v1}" }
              as: CreditAnalyst
