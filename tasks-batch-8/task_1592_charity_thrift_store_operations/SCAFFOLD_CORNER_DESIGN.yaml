          assert:
            - "${err} == ERR_VENDOR_RATE_MISSING"
            - "SalvageBale.${bale1}.status == ACCUMULATING"

      - name: sod_counter_cannot_approve_own_variance
        claim_type: conditional_validation
        grounds: ["validations[priority=8]", "errors[ERR_SOD_APPROVER_IS_COUNTER]"]
        distinguishing_aspect: "Segregation of duties is enforced on the opaque X-User-ID: the FinanceClerk carrying the same user id as the counting manager is rejected, while a different id approves."
        test_recipe:
          setup: ["session float 10000, one CASH sale 1600 (expected 11600), count 12200 by mgr-1 -> PENDING_APPROVAL"]
          setup_api_calls:
            - call: "POST /api/pricing-guidelines"
              payload: { category: "CLOTHING", base_cents: 2000 }
