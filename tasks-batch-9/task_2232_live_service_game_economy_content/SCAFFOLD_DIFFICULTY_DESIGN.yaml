scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: season_sink_faucet_ratio_epoch_vs_lifetime
        grounds:
          - calculations.season_sink_faucet_ratio_bp
          - entities.Season.fields.lifetime_ratio_bp
          - entities.MonitoringRun.fields.sink_faucet_ratio_bp
          - entities.EconomyLedgerEntry.fields.reversal_of_entry_id
          - state_machines.MonitoringRun.OPEN_to_COMPUTED
        distinguishing_aspect: |
          Over one identical ledger the EPOCH_WINDOWED variant drops both members of every
          compensating pair and yields 4000 bp / WATCH, while the LIFETIME_CUMULATIVE variant
          counts the reversal and the reversed row gross and yields 7273 bp / HEALTHY — the two
          variants disagree on the health band, not merely on the number.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE, window 2026-08-01 -> 2026-10-30 (90 days), target_xp_total 9000."
            - "Player p1 (NA) with a SOFT_COIN account holding an operator faucet of 1000 minor units appended at 2026-08-01T00:00:00Z."
            - "Episode 1 (soft_currency_grant_minor 1200) released at 2026-08-02T12:00:00Z then rolled back at 2026-08-02T18:00:00Z, producing an EPISODE_GRANT faucet of 1200 and its EPISODE_ROLLBACK_REVERSAL sink of 1200 (a compensating pair)."
            - "An operator sink of 400 appended at 2026-08-02T20:00:00Z."
            - "Season ledger therefore holds gross faucets 2200 and gross sinks 1600, of which 1200/1200 form a reversal pair."
            - "MonitoringRun epoch 1 opened over [2026-08-01T00:00:00Z, 2026-08-03T00:00:00Z), which spans every row including the reversal pair."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /players"
              payload: { handle: "tide_p1", region_code: "NA", active_season_id: "${season_id}" }
              as: LiveOpsCommander
              captures: { p1_id: $.data.id }
            - call: "POST /players/${p1_id}/currency-accounts"
              payload: { currency_code: "SOFT_COIN" }
              as: LiveOpsCommander
              captures: { p1_soft_id: $.data.id }
            - call: "POST /currency-accounts/${p1_soft_id}/adjustments"
              payload: { direction: "FAUCET", amount_minor: 1000, source_kind: "ADMIN_ADJUSTMENT" }
              as: LiveOpsCommander
            - call: "POST /episodes"
              payload: { season_id: "${season_id}", sequence_no: 1, title: "E1 Tidefall", planned_release_at: "2026-08-02T12:00:00Z", xp_grant: 600, soft_currency_grant_minor: 1200 }
              as: ContentProducer
              captures: { ep1_id: $.data.id }
            - call: "POST /episodes/${ep1_id}/schedule"
              payload: {}
              as: ContentProducer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T12:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /episodes/${ep1_id}/release"
              payload: {}
              as: ContentProducer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T18:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /episodes/${ep1_id}/rollback"
              payload: { reason: "Grant table shipped with the wrong multiplier" }
              as: LiveOpsCommander
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T20:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /currency-accounts/${p1_soft_id}/adjustments"
              payload: { direction: "SINK", amount_minor: 400, source_kind: "OFFER_SPEND" }
              as: LiveOpsCommander
            - call: "POST /monitoring-runs"
              payload: { season_id: "${season_id}", epoch_no: 1, window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: LiveOpsCommander
              captures: { run1_id: $.data.id }
          trigger:
            - call: "POST /monitoring-runs/${run1_id}/compute"
              payload: {}
              as: LiveOpsCommander
            - call: "GET /seasons/${season_id}/economy-summary"
              payload: { variant: "LIFETIME_CUMULATIVE" }
              as: EconomyDesigner
          assert:
            - "MonitoringRun.${run1_id}.gross_faucet_minor == 1000"
            - "MonitoringRun.${run1_id}.gross_sink_minor == 400"
            - "MonitoringRun.${run1_id}.sink_faucet_ratio_bp == 4000"
            - "MonitoringRun.${run1_id}.resulting_health == WATCH"
            - "economy-summary response data.sink_faucet_ratio_bp == 7273"
            - "economy-summary response data.gross_faucet_minor == 2200"
            - "economy-summary response data.gross_sink_minor == 1600"
            - "economy-summary response data.health_band == HEALTHY"
            - "Season.${season_id}.lifetime_ratio_bp == 7273"
            - "Season.${season_id}.economy_health == WATCH"
            - "MonitoringRun.${run1_id}.sink_faucet_ratio_bp != Season.${season_id}.lifetime_ratio_bp"

      - name: player_pacing_realized_vs_projected
        grounds:
          - calculations.player_pacing_bp
          - entities.Player.fields.pacing_bp_realized
          - entities.Player.fields.retention_band
          - entities.Episode.fields.planned_release_at
          - endpoints["GET /players/{player_id}/pacing"]
        distinguishing_aspect: |
          For one identical player the REALIZED variant divides 2400 XP by the 3000 XP expected
          to date and returns 8000 bp / AT_RISK, while the PROJECTED variant adds the 600 XP of
          the not-yet-due SCHEDULED episode (excluding the 5000 XP overdue one) and divides by
          the 9000 XP full-season target for 3333 bp / CHURN_RISK; only REALIZED is persisted.
        test_recipe:
          setup:
            - "Season S7 LIVE, 2026-08-01 -> 2026-10-30 (90 days), target_xp_total 9000."
            - "Episode 1 SCHEDULED for 2026-08-10T00:00:00Z with xp_grant 5000 — overdue at the trigger clock, so PROJECTED excludes it."
            - "Episode 2 SCHEDULED for 2026-09-05T00:00:00Z with xp_grant 600 — still in the future, so PROJECTED includes it."
            - "Clock advanced to 2026-08-31T00:00:00Z (elapsed_days 30, expected_to_date_xp 3000) before telemetry ingest."
            - "Player p3 (NA) has ingested 2400 season XP, so the persisted REALIZED band is AT_RISK."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /players"
              payload: { handle: "tide_p3", region_code: "NA", active_season_id: "${season_id}" }
              as: LiveOpsCommander
              captures: { p3_id: $.data.id }
            - call: "POST /episodes"
              payload: { season_id: "${season_id}", sequence_no: 1, title: "E1 Tidefall", planned_release_at: "2026-08-10T00:00:00Z", xp_grant: 5000, soft_currency_grant_minor: 0 }
              as: ContentProducer
              captures: { ep1_id: $.data.id }
            - call: "POST /episodes/${ep1_id}/schedule"
              payload: {}
              as: ContentProducer
            - call: "POST /episodes"
              payload: { season_id: "${season_id}", sequence_no: 2, title: "E2 Undertow", planned_release_at: "2026-09-05T00:00:00Z", xp_grant: 600, soft_currency_grant_minor: 0 }
              as: ContentProducer
              captures: { ep2_id: $.data.id }
            - call: "POST /episodes/${ep2_id}/schedule"
              payload: {}
              as: ContentProducer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /players/${p3_id}/engagement-events"
              payload: { xp_delta: 2400, sessions_delta: 12 }
              as: LiveOpsCommander
          trigger:
            - call: "GET /players/${p3_id}/pacing"
              payload: { variant: "REALIZED" }
              as: LiveOpsCommander
            - call: "GET /players/${p3_id}/pacing"
              payload: { variant: "PROJECTED" }
              as: LiveOpsCommander
          assert:
            - "REALIZED response data.elapsed_days == 30"
            - "REALIZED response data.season_total_days == 90"
            - "REALIZED response data.expected_to_date_xp == 3000"
            - "REALIZED response data.pacing_bp == 8000"
            - "REALIZED response data.retention_band == AT_RISK"
            - "PROJECTED response data.eligible_scheduled_xp == 600"
            - "PROJECTED response data.pacing_bp == 3333"
            - "PROJECTED response data.retention_band == CHURN_RISK"
            - "Player.${p3_id}.pacing_bp_realized == 8000"
            - "Player.${p3_id}.retention_band == AT_RISK"
            - "Player.${p3_id}.season_xp_total == 2400"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: bundle_quote_round_per_line_then_sum
        grounds:
          - calculations.personalized_offer_quote_minor
          - entities.Offer.fields.line_items
          - entities.Offer.fields.price_tier
          - endpoints["GET /offers/{offer_id}/quote"]
        distinguishing_aspect: |
          Rounding ORDER (mode b): the region multiplier and the tier discount are each rounded
          per line item before summation, giving 483 + 1258 = 1741, whereas collapsing the two
          multipliers onto the 1798 summed base in one expression gives 1740 — a one-unit
          divergence that only correct per-line double rounding reproduces.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE."
            - "Offer AUG_BUNDLE is a BUNDLE at price tier T3 with two line items: COIN_PACK base 499 and SKIN_A base 1299 (list_price_minor 1798)."
            - "Player p2 is in region EU (multiplier 11000 bp) with retention_band HEALTHY, so personalization contributes 0 bp."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /players"
              payload: { handle: "tide_p2_eu", region_code: "EU", active_season_id: "${season_id}" }
              as: LiveOpsCommander
              captures: { p2_id: $.data.id }
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "BUNDLE", sku: "AUG_BUNDLE", price_tier: "T3", list_price_minor: 1798, line_items: [{ sku: "COIN_PACK", base_price_minor: 499, declared_value_minor: 700, granted_currency_code: "EVENT_TOKEN", granted_amount_minor: 600 }, { sku: "SKIN_A", base_price_minor: 1299, declared_value_minor: 1700, granted_currency_code: "EVENT_TOKEN", granted_amount_minor: 600 }], personalization_discount_bp: 1500, minor_purchasable: false, window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { bundle_id: $.data.id }
          trigger:
            - call: "GET /offers/${bundle_id}/quote"
              payload: { player_id: "${p2_id}" }
              as: Player
              as_user_id: "${p2_id}"
          assert:
            - "quote response data.region_multiplier_bp == 11000"
            - "quote response data.tier_discount_bp == 1200"
            - "quote response data.applied_personalization_bp == 0"
            - "quote response data.retention_band == HEALTHY"
            - "quote response data.quote_minor == 1741"
            - "quote response data.quote_minor != 1740"
            - "Offer.${bundle_id}.fairness_index_bp == 13048"

      - name: refund_fee_tier_keyed_on_base_not_final
        grounds:
          - calculations.refund_settlement_minor
          - entities.RefundRequest.fields.refund_base_minor
          - entities.RefundRequest.fields.restock_fee_minor
          - state_machines.RefundRequest.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Evaluation ORDER (mode c): the restock tier is keyed on the Step-2 refund_base_minor
          of 5000 (tier 1000 bp -> fee 500 -> refund 4500); re-keying the tier on the Step-5
          output 4500 would select the 500 bp tier and yield fee 225 / refund 4775, so only the
          pinned step order reproduces 4500.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE."
            - "Offer STARTER_5K is a LIMITED_TIME offer at tier T1 with one line item base 5000 granting 5000 HARD_GEM; approved and LIVE."
            - "Player p4 (NA, adult) holds a HARD_GEM account and a SOFT_COIN account."
            - "Purchase of STARTER_5K settled at price_paid_minor 5000 with granted_total_minor 5000 and granted_consumed_minor 0."
            - "Refund request submitted the same day, well inside the 14-day refund window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /players"
              payload: { handle: "tide_p4", region_code: "NA", active_season_id: "${season_id}" }
              as: LiveOpsCommander
              captures: { p4_id: $.data.id }
            - call: "POST /players/${p4_id}/currency-accounts"
              payload: { currency_code: "HARD_GEM" }
              as: LiveOpsCommander
              captures: { p4_gem_id: $.data.id }
            - call: "POST /players/${p4_id}/currency-accounts"
              payload: { currency_code: "SOFT_COIN" }
              as: LiveOpsCommander
              captures: { p4_soft_id: $.data.id }
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "LIMITED_TIME", sku: "STARTER_5K", price_tier: "T1", list_price_minor: 5000, line_items: [{ sku: "STARTER_PACK", base_price_minor: 5000, declared_value_minor: 6000, granted_currency_code: "HARD_GEM", granted_amount_minor: 5000 }], personalization_discount_bp: 0, minor_purchasable: true, window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { starter_id: $.data.id }
            - call: "POST /offers/${starter_id}/submit"
              payload: {}
              as: EconomyDesigner
              as_user_id: "u_designer_1"
            - call: "POST /offers/${starter_id}/review"
              payload: { decision: "APPROVE", note: "Value ratio and window are within policy" }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: LiveOpsCommander
              captures: { season_v1: $.data.version }
            - call: "POST /offers/${starter_id}/publish"
              payload: { expected_season_version: "${season_v1}" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { starter_v1: $.data.version }
            - call: "POST /purchases"
              payload: { player_id: "${p4_id}", offer_id: "${starter_id}", expected_offer_version: "${starter_v1}" }
              as: Player
              as_user_id: "${p4_id}"
              captures: { pur4_id: $.data.id }
            - call: "POST /purchases/${pur4_id}/settlement"
              payload: { outcome: "SETTLED" }
              as: LiveOpsCommander
            - call: "POST /refund-requests"
              payload: { purchase_id: "${pur4_id}", reason_code: "ACCIDENTAL" }
              as: Player
              as_user_id: "${p4_id}"
              captures: { rr4_id: $.data.id }
          trigger:
            - call: "POST /refund-requests/${rr4_id}/decision"
              payload: { decision: "APPROVE", decision_note: "Charged within minutes of an accidental tap" }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
          assert:
            - "RefundRequest.${rr4_id}.status == APPROVED"
            - "RefundRequest.${rr4_id}.consumed_ratio_bp == 0"
            - "RefundRequest.${rr4_id}.refund_base_minor == 5000"
            - "RefundRequest.${rr4_id}.restock_fee_minor == 500"
            - "RefundRequest.${rr4_id}.refund_amount_minor == 4500"
            - "RefundRequest.${rr4_id}.refund_amount_minor != 4775"
            - "RefundRequest.${rr4_id}.goodwill_credit_minor == 250"
            - "Purchase.${pur4_id}.status == SETTLED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: episode_rollback_reschedule_relive_cycle
        grounds:
          - state_machines.Episode.LIVE_to_ROLLED_BACK
          - state_machines.Episode.ROLLED_BACK_to_SCHEDULED
          - state_machines.Episode.SCHEDULED_to_LIVE
          - entities.Episode.fields.rollback_count
          - calculations.season_cadence_debt_days
        distinguishing_aspect: |
          Episode re-enters SCHEDULED from ROLLED_BACK and reaches LIVE a second time, so the
          same entity traverses SCHEDULED -> LIVE twice; rollback_count accumulates to 1 and is
          never reset, and the cycle leaves exactly 3 cadence debt days behind.
        test_recipe:
          setup:
            - "Season S7 LIVE, 2026-08-01 -> 2026-10-30."
            - "Player p1 (NA) with a SOFT_COIN account so each release has exactly one grant recipient."
            - "Episode 1 planned for 2026-08-02T00:00:00Z with soft_currency_grant_minor 1200."
            - "Clock stepped 2026-08-01 -> 2026-08-02 (first release) -> 2026-08-03 (rollback) -> 2026-08-05 (second release, matching the rescheduled date exactly)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /players"
              payload: { handle: "tide_p1", region_code: "NA", active_season_id: "${season_id}" }
              as: LiveOpsCommander
              captures: { p1_id: $.data.id }
            - call: "POST /players/${p1_id}/currency-accounts"
              payload: { currency_code: "SOFT_COIN" }
              as: LiveOpsCommander
              captures: { p1_soft_id: $.data.id }
            - call: "POST /episodes"
              payload: { season_id: "${season_id}", sequence_no: 1, title: "E1 Tidefall", planned_release_at: "2026-08-02T00:00:00Z", xp_grant: 600, soft_currency_grant_minor: 1200 }
              as: ContentProducer
              captures: { ep1_id: $.data.id }
            - call: "POST /episodes/${ep1_id}/schedule"
              payload: {}
              as: ContentProducer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /episodes/${ep1_id}/release"
              payload: {}
              as: ContentProducer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /episodes/${ep1_id}/rollback"
              payload: { reason: "Client crash on the new zone" }
              as: LiveOpsCommander
          trigger:
            - call: "POST /episodes/${ep1_id}/schedule"
              payload: { planned_release_at: "2026-08-05T00:00:00Z" }
              as: ContentProducer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /episodes/${ep1_id}/release"
              payload: {}
              as: ContentProducer
          assert:
            - "Episode.${ep1_id}.status == LIVE"
            - "Episode.${ep1_id}.rollback_count == 1"
            - "Episode.${ep1_id}.planned_release_at == 2026-08-05T00:00:00Z"
            - "Episode.${ep1_id}.actual_release_at == 2026-08-05T00:00:00Z"
            - "Episode.${ep1_id}.grant_batch_size == 1"
            - "Season.${season_id}.scheduled_episode_count == 0"
            - "Season.${season_id}.released_episode_count == 1"
            - "Season.${season_id}.cadence_debt_days == 3"
            - "Season.${season_id}.content_posture == ON_TRACK"
            - "Season.${season_id}.gross_faucet_minor == 2400"
            - "Season.${season_id}.gross_sink_minor == 1200"
            - "CurrencyAccount.${p1_soft_id}.balance_minor == 1200"

      - name: offer_parallel_approval_and_availability_dimensions
        grounds:
          - state_machines.Offer.IN_REVIEW_to_DRAFT
          - state_machines.Offer.OFFLINE_to_LIVE
          - state_machines.Offer.LIVE_to_SUSPENDED
          - state_machines.Offer.SUSPENDED_to_LIVE
          - entities.Offer.fields.revision_count
        distinguishing_aspect: |
          Offer carries two independent state dimensions: the approval dimension loops
          DRAFT -> IN_REVIEW -> DRAFT (revision_count 1) and then parks on APPROVED, while the
          availability dimension independently cycles OFFLINE -> LIVE -> SUSPENDED -> LIVE
          without ever changing approval_status; submit from the APPROVED/LIVE combination is
          rejected because only the approval dimension is consulted.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE, economy_health HEALTHY, content_posture ON_TRACK."
            - "Offer AUG_BUNDLE (BUNDLE, T3, list 1798, two line items) authored by u_designer_1 and reviewed by u_compliance_1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
