      - name: safety_score_rounds_once_on_the_summed_decayed_charge
        claim_type: precision
        grounds:
          - calculations.cook_safety_score.precision
          - calculations.cook_safety_score.constants.DECAY_STEP_1_WEEKS
          - calculations.cook_safety_score.constants.DECAY_STEP_2_WEEKS
          - calculations.cook_safety_score.constants.SEVERITY_POINTS
        distinguishing_aspect: >
          Two MINOR incidents are chosen precisely so that per-incident rounding and
          round-once-on-the-total disagree: at the 26-week decay step each contributes 1.25 points,
          so rounding per incident gives 1 + 1 = 2 and a score of 98, while the specified
          round_half_up on the summed 2.50 gives 3 and a score of 97. The 8-week and 26-week steps
          are both landed on exactly.
        test_recipe:
          setup:
            - "StatePolicy CA exists; logical clock 2026-08-01T00:00:00Z."
            - "Cook Dara exists; two MINOR SafetyIncidents are created at that instant, triaged by so-1 and substantiated by so-2."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
