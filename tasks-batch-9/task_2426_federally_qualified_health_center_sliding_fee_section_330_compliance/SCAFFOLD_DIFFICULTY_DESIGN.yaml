          - entities.HealthCenter.fields.wraparound_receivable_cents
        distinguishing_aspect: |
          A third triggering transition — an EligibilityVerifier verifying income — reaches four
          hops deep into money that was already banked: the verification is stamped (hop 1), the
          already-PAID MEDICAID_MCO encounter is re-priced from 30000 down to 2500 and moved to
          PENDING_ADJUSTMENT (hop 2), Patient.patient_balance_cents is rewritten (hop 3), and
          wraparound_due_cents plus the grantee receivable are recomputed from 0 to 1500 (hop 4).
          Unlike the REMOVE_SITE chain nothing is voided; the rows are re-valued in place.
        test_recipe:
