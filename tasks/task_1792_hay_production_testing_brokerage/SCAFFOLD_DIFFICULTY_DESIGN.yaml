            - { call: "POST /api/quotes/${q10_id}/issue", payload: {}, as: Buyer, as_user_id: "${b10_id}", captures: { q10_v: "$.data.version" } }
            - { call: "POST /api/quotes/${q10_id}/accept", payload: { expected_quote_version: "${q10_v}" }, as: Buyer, as_user_id: "${b10_id}" }
            - { call: "GET /api/contracts?quote_id=${q10_id}", payload: {}, as: BrokerOps, captures: { ct10_id: "$.data[0].id" } }
            - { call: "POST /api/growers", payload: { name: "Grower Sixteen", region_code: "OR-WILLAMETTE" }, as: PlatformAdmin, captures: { g16_id: "$.data.id" } }
