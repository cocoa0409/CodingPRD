      - name: bulk_publish_supersedes_unlisted_open_slots
        claim_type: bulk_action
        grounds:
          - concurrency_rules[bulk-publish-stale-provider]
          - state_machines.Slot
        distinguishing_aspect: "Bulk publish with the current provider version creates the new slot and CLOSES the provider's other future OPEN slot absent from the payload (supersede semantics); Provider.version advances by exactly 1."
        test_recipe:
          setup: ["bookable practice/provider with one OPEN slot s_old at 2026-09-03T10:00"]
          setup_api_calls:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York" }
              as: OpsAdmin
              captures: { p_id: $.data.id }
            - call: "POST /marketplace/practices/${p_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers"
              payload: { practice_id: "${p_id}", display_name: "Dr A", specialty: "DERM" }
              as: PracticeStaff
              as_user_id: "${p_id}"
              captures: { prov_id: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers/${prov_id}/slots"
              payload: { start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-03T10:30:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { s_old: $.data.id }
            - call: "GET /marketplace/providers/${prov_id}"
              payload: {}
              as: Any
              captures: { prov_v: $.data.version }
          trigger:
            - call: "POST /marketplace/providers/${prov_id}/slots/bulk-publish"
              payload: { slots: [{ start_at: "2026-09-04T10:00:00Z", end_at: "2026-09-04T10:30:00Z" }], expected_provider_version: "${prov_v}" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { created: $.data.created_count, closed: $.data.closed_count }
            - call: "GET /marketplace/slots/${s_old}"
              payload: {}
              as: Any
              captures: { old_status: $.data.status, old_reason: $.data.close_reason }
          assert:
            - "created == 1 and closed == 1"
            - "old_status == CLOSED and old_reason == PROVIDER_CLOSED"
            - "Provider.${prov_id}.version == ${prov_v} + 1"

      - name: error_envelope_shape_on_failure
        claim_type: response_envelope
        grounds:
          - response_envelope
        distinguishing_aspect: "Error responses use the fixed envelope: response_type == error and data carries error_id plus message."
        test_recipe:
