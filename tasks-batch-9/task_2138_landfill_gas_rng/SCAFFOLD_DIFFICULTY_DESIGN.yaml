scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: rin_provisional_nominated_vs_settled_metered_basis
        grounds:
          - calculations.rin_d3_generation
          - entities.AttributeBatch.fields.basis
          - entities.AttributeBatch.fields.energy_basis_mmbtu
          - entities.InjectionBatch.fields.metered_mmbtu
          - state_machines.AttributeBatch.PENDING_to_GENERATED
        distinguishing_aspect: |
          The dual variant lives in the environmental-attribute domain: one and the same
          InjectionBatch yields rin_count 3988 under basis PROVISIONAL_NOMINATED (which reads
          InjectionBatch.gross_mmbtu = 340.14) and rin_count 4132 under basis SETTLED_METERED
          (which reads InjectionBatch.metered_mmbtu = 352.40).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z."
            - "One LandfillSite with host_royalty_pct 0.12 and royalty_variant GROSS_REVENUE_SHARE."
            - "One ProcessingPlant in process_mode UPGRADING, spec_status ON_SPEC, availability_factor_pct 100.00 (no DowntimeEvent has ever been closed)."
            - "Two GasWells each with a GOOD reading, so LandfillSite.collected_flow_scfm is 950.0, above the plant's min_feed_scfm of 900."
            - "One ACTIVE OfftakeContract at 5.25 USD/dth and one CONFIRMED PipelineNomination for 2400 dth on gas day 2026-08-10."
            - "One InjectionBatch with gross_mmbtu 340.14 that has reached status INJECTED against that nomination."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5, royalty_floor_usd_per_mmbtu: 0.25 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /plants"
              payload: { site_id: "${site_id}", plant_code: "P1", receipt_point_code: "RP-7", receipt_point_mdq_dth_per_day: 4800.0, min_feed_scfm: 900.0 }
              as: ProjectAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-02", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w2_id: $.data.id }
            - call: "POST /wells/${w1_id}/readings"
              payload: { taken_at: "2026-08-10T01:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 480.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
            - call: "POST /wells/${w2_id}/readings"
              payload: { taken_at: "2026-08-10T01:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 470.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
            - call: "POST /plants/${plant_id}/status"
              payload: { process_mode: "UPGRADING" }
              as: PlantOperator
            - call: "POST /offtake-contracts"
              payload: { site_id: "${site_id}", counterparty_name: "Bluewater Energy", contract_mdq_dth_per_day: 3000.0, price_usd_per_dth: 5.25, term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: CommercialScheduler
              captures: { contract_id: $.data.id }
            - call: "POST /offtake-contracts/${contract_id}/status"
              payload: { to_status: "ACTIVE" }
              as: CommercialScheduler
              captures: { ctr_v1: $.data.version }
            - call: "POST /pipeline-nominations"
              payload: { contract_id: "${contract_id}", plant_id: "${plant_id}", gas_day_start: "2026-08-10T00:00:00Z", gas_day_end: "2026-08-11T00:00:00Z", nominated_dth: 2400.0, expected_contract_version: "${ctr_v1}" }
              as: CommercialScheduler
              captures: { nom_id: $.data.id }
            - call: "POST /pipeline-nominations/${nom_id}/status"
              payload: { to_status: "CONFIRMED" }
              as: CommercialScheduler
            - call: "POST /injection-batches"
              payload: { plant_id: "${plant_id}", interval_start: "2026-08-10T02:00:00Z", interval_end: "2026-08-10T05:00:00Z", hourly_volumes_mscf: [115.0, 115.0, 115.0], methane_pct: 97.4, oxygen_pct: 0.1, co2_pct: 1.4 }
              as: PlantOperator
              captures: { b1_id: $.data.id }
            - call: "POST /injection-batches/${b1_id}/status"
              payload: { to_status: "PENDING_ANALYSIS" }
              as: PlantOperator
            - call: "POST /injection-batches/${b1_id}/status"
              payload: { to_status: "NOMINATED", nomination_id: "${nom_id}" }
              as: CommercialScheduler
            - call: "POST /injection-batches/${b1_id}/status"
              payload: { to_status: "INJECTED" }
              as: PlantOperator
          trigger:
            - call: "POST /attribute-batches"
              payload: { injection_batch_id: "${b1_id}", program: "RIN_D3", generation_period: "2026-08" }
              as: ComplianceOfficer
              as_user_id: "officer-alice"
              captures: { ab1_id: $.data.id }
            - call: "POST /injection-batches/${b1_id}/meter-trueup"
              payload: { metered_mmbtu: 352.40 }
              as: CommercialScheduler
            - call: "POST /attribute-batches/${ab1_id}/status"
              payload: { to_status: "REVERSED", reason: "BASIS_RESTATEMENT" }
              as: ComplianceOfficer
              as_user_id: "officer-alice"
            - call: "POST /attribute-batches"
              payload: { injection_batch_id: "${b1_id}", program: "RIN_D3", generation_period: "2026-08", basis: "SETTLED_METERED" }
              as: ComplianceOfficer
              as_user_id: "officer-alice"
              captures: { ab2_id: $.data.id }
          assert:
            - "InjectionBatch.${b1_id}.gross_mmbtu == 340.14"
            - "InjectionBatch.${b1_id}.metered_mmbtu == 352.40"
            - "AttributeBatch.${ab1_id}.basis == PROVISIONAL_NOMINATED"
            - "AttributeBatch.${ab1_id}.energy_basis_mmbtu == 340.14"
            - "AttributeBatch.${ab1_id}.eligibility_factor == 1.0"
            - "AttributeBatch.${ab1_id}.rin_count == 3988"
            - "AttributeBatch.${ab2_id}.basis == SETTLED_METERED"
            - "AttributeBatch.${ab2_id}.energy_basis_mmbtu == 352.40"
            - "AttributeBatch.${ab2_id}.rin_count == 4132"
            - "AttributeBatch.${ab1_id}.rin_count != AttributeBatch.${ab2_id}.rin_count"
            - "LandfillSite.${site_id}.rin_generated_total == 8120"
            - "LandfillSite.${site_id}.rin_available_count == 4132"
            - "LandfillSite.${site_id}.rin_reversed_count == 3988"

      - name: royalty_gross_revenue_share_vs_netback_share
        grounds:
          - calculations.royalty_settlement
          - entities.RoyaltyStatement.fields.variant_applied
          - entities.RoyaltyStatement.fields.allowed_deductions_usd
          - entities.LandfillSite.fields.royalty_variant
          - state_machines.RoyaltyStatement.ISSUED_to_DISPUTED
        distinguishing_aspect: |
          The second dual variant sits in a different entity domain - host-landfill royalty
          settlement on RoyaltyStatement, not attribute generation on AttributeBatch. Identical
          August production settles at royalty_amount_usd 1711.50 under GROSS_REVENUE_SHARE and
          1663.50 under NETBACK_SHARE with allowed_deductions_usd 400.00.
        test_recipe:
          setup:
            - "Same producing site as the RIN instance, with InjectionBatch gross_mmbtu 340.14 INJECTED against a 5.25 USD/dth contract inside August 2026."
            - "One RIN_D3 AttributeBatch (rin_count 3988) and one LCFS AttributeBatch (lcfs_credits 17.9190), both GENERATED."
            - "Logical clock advanced to 2026-09-05T00:00:00Z so the 2026-08 settlement period is closed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5, royalty_floor_usd_per_mmbtu: 0.25 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /plants"
              payload: { site_id: "${site_id}", plant_code: "P1", receipt_point_code: "RP-7", receipt_point_mdq_dth_per_day: 4800.0, min_feed_scfm: 900.0 }
              as: ProjectAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-02", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w2_id: $.data.id }
            - call: "POST /wells/${w1_id}/readings"
              payload: { taken_at: "2026-08-10T01:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 480.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
            - call: "POST /wells/${w2_id}/readings"
              payload: { taken_at: "2026-08-10T01:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 470.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
            - call: "POST /plants/${plant_id}/status"
              payload: { process_mode: "UPGRADING" }
              as: PlantOperator
            - call: "POST /offtake-contracts"
              payload: { site_id: "${site_id}", counterparty_name: "Bluewater Energy", contract_mdq_dth_per_day: 3000.0, price_usd_per_dth: 5.25, term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: CommercialScheduler
              captures: { contract_id: $.data.id }
            - call: "POST /offtake-contracts/${contract_id}/status"
              payload: { to_status: "ACTIVE" }
              as: CommercialScheduler
              captures: { ctr_v1: $.data.version }
            - call: "POST /pipeline-nominations"
              payload: { contract_id: "${contract_id}", plant_id: "${plant_id}", gas_day_start: "2026-08-10T00:00:00Z", gas_day_end: "2026-08-11T00:00:00Z", nominated_dth: 2400.0, expected_contract_version: "${ctr_v1}" }
              as: CommercialScheduler
              captures: { nom_id: $.data.id }
            - call: "POST /pipeline-nominations/${nom_id}/status"
              payload: { to_status: "CONFIRMED" }
              as: CommercialScheduler
            - call: "POST /injection-batches"
              payload: { plant_id: "${plant_id}", interval_start: "2026-08-10T02:00:00Z", interval_end: "2026-08-10T05:00:00Z", hourly_volumes_mscf: [115.0, 115.0, 115.0], methane_pct: 97.4, oxygen_pct: 0.1, co2_pct: 1.4 }
              as: PlantOperator
              captures: { b1_id: $.data.id }
            - call: "POST /injection-batches/${b1_id}/status"
              payload: { to_status: "PENDING_ANALYSIS" }
              as: PlantOperator
            - call: "POST /injection-batches/${b1_id}/status"
              payload: { to_status: "NOMINATED", nomination_id: "${nom_id}" }
              as: CommercialScheduler
            - call: "POST /injection-batches/${b1_id}/status"
              payload: { to_status: "INJECTED" }
              as: PlantOperator
            - call: "POST /attribute-batches"
              payload: { injection_batch_id: "${b1_id}", program: "RIN_D3", generation_period: "2026-08" }
              as: ComplianceOfficer
              as_user_id: "officer-alice"
              captures: { ab_rin_id: $.data.id }
            - call: "POST /attribute-batches"
              payload: { injection_batch_id: "${b1_id}", program: "LCFS", generation_period: "2026-08" }
              as: ComplianceOfficer
              as_user_id: "officer-alice"
              captures: { ab_lcfs_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ProjectAdmin
            - call: "GET /sites/${site_id}"
              as: ProjectAdmin
              captures: { site_v1: $.data.version }
          trigger:
            - call: "POST /royalty-statements"
              payload: { site_id: "${site_id}", period: "2026-08", expected_site_version: "${site_v1}" }
              as: ProjectAdmin
              captures: { rs1_id: $.data.id }
            - call: "POST /royalty-statements/${rs1_id}/status"
              payload: { to_status: "ISSUED" }
              as: ProjectAdmin
            - call: "POST /royalty-statements/${rs1_id}/status"
              payload: { to_status: "DISPUTED", dispute_reason: "Host disputes the deduction methodology" }
              as: HostRepresentative
              as_user_id: "${site_id}"
            - call: "GET /sites/${site_id}"
              as: ProjectAdmin
              captures: { site_v2: $.data.version }
            - call: "POST /royalty-statements"
              payload: { site_id: "${site_id}", period: "2026-08", expected_site_version: "${site_v2}", allowed_deductions_usd: 400.00, variant_override: "NETBACK_SHARE" }
              as: ProjectAdmin
              captures: { rs2_id: $.data.id }
          assert:
            - "AttributeBatch.${ab_rin_id}.rin_count == 3988"
            - "AttributeBatch.${ab_lcfs_id}.lcfs_credits == 17.9190"
            - "RoyaltyStatement.${rs1_id}.variant_applied == GROSS_REVENUE_SHARE"
            - "RoyaltyStatement.${rs1_id}.billable_mmbtu == 340.14"
            - "RoyaltyStatement.${rs1_id}.gas_revenue_usd == 1785.74"
            - "RoyaltyStatement.${rs1_id}.attribute_revenue_usd == 12476.78"
            - "RoyaltyStatement.${rs1_id}.gross_revenue_usd == 14262.52"
            - "RoyaltyStatement.${rs1_id}.calculated_amount_usd == 1711.50"
            - "RoyaltyStatement.${rs1_id}.floor_amount_usd == 85.04"
            - "RoyaltyStatement.${rs1_id}.royalty_amount_usd == 1711.50"
            - "RoyaltyStatement.${rs2_id}.variant_applied == NETBACK_SHARE"
            - "RoyaltyStatement.${rs2_id}.gross_revenue_usd == 14262.52"
            - "RoyaltyStatement.${rs2_id}.calculated_amount_usd == 1663.50"
            - "RoyaltyStatement.${rs2_id}.royalty_amount_usd == 1663.50"
            - "RoyaltyStatement.${rs1_id}.royalty_amount_usd != RoyaltyStatement.${rs2_id}.royalty_amount_usd"

  - rule_id: combinatorial_formula
    instances:
      - name: gross_mmbtu_round_each_hour_then_sum_mode_b
        grounds:
          - calculations.injection_batch_gross_mmbtu
          - entities.InjectionBatch.fields.hourly_volumes_mscf
          - entities.InjectionBatch.fields.gross_mmbtu
        distinguishing_aspect: |
          Mode (b) - nested rounding whose ORDER changes the cents. The scaffold pins
          "round each hour to 2 dp, then sum, then round to 2 dp". Batch A ([115.0, 115.0,
          115.0] at 97.4% methane) is 340.14 under the pinned order and 340.13 under
          sum-then-round; batch B ([40.0, 40.0] at 97.0%) is 78.54 pinned and 78.55
          sum-then-round, so the two batches disagree in OPPOSITE directions and no single
          off-by-one fudge can satisfy both.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z."
            - "One LandfillSite and one ProcessingPlant in its initial STARTUP / ON_SPEC state (batch creation does not require UPGRADING)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /plants"
              payload: { site_id: "${site_id}", plant_code: "P1", receipt_point_code: "RP-7", receipt_point_mdq_dth_per_day: 4800.0, min_feed_scfm: 900.0 }
              as: ProjectAdmin
              captures: { plant_id: $.data.id }
          trigger:
            - call: "POST /injection-batches"
              payload: { plant_id: "${plant_id}", interval_start: "2026-08-10T02:00:00Z", interval_end: "2026-08-10T05:00:00Z", hourly_volumes_mscf: [115.0, 115.0, 115.0], methane_pct: 97.4, oxygen_pct: 0.1, co2_pct: 1.4 }
              as: PlantOperator
              captures: { ba_id: $.data.id }
            - call: "POST /injection-batches"
              payload: { plant_id: "${plant_id}", interval_start: "2026-08-10T06:00:00Z", interval_end: "2026-08-10T08:00:00Z", hourly_volumes_mscf: [40.0, 40.0], methane_pct: 97.0, oxygen_pct: 0.1, co2_pct: 1.5 }
              as: PlantOperator
              captures: { bb_id: $.data.id }
          assert:
            - "InjectionBatch.${ba_id}.gross_mmbtu == 340.14"
            - "InjectionBatch.${ba_id}.gross_mmbtu != 340.13"
            - "InjectionBatch.${bb_id}.gross_mmbtu == 78.54"
            - "InjectionBatch.${bb_id}.gross_mmbtu != 78.55"
            - "InjectionBatch.${ba_id}.status == DRAFT"

      - name: lcfs_avoided_methane_tier_selected_from_ci_pre_mode_c
        grounds:
          - calculations.lcfs_credit_generation
          - entities.AttributeBatch.fields.ci_project_gco2e_per_mj
          - entities.AttributeBatch.fields.lcfs_credits
          - entities.LandfillSite.fields.energy_flared_mmbtu
          - state_machines.AttributeBatch.PENDING_to_GENERATED
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency with a pinned evaluation order. The avoided
          methane credit lowers the project CI, and the CI band selects the avoided methane
          credit. With a clean ledger ci_pre is 44.000, which selects AVOIDED_TIER_C 7.500 and
          yields ci_project 36.500; re-selecting the tier from the post-credit 36.500 would pick
          AVOIDED_TIER_B 15.000 and yield 29.000. The test pins 36.500 and lcfs_credits 17.9190.
        test_recipe:
          setup:
            - "The same producing site as the RIN instance, with one InjectionBatch of gross_mmbtu 340.14 in status INJECTED."
            - "LandfillSite.energy_injected_mmbtu is 340.14 and energy_flared_mmbtu is 0.00, so flare_fraction is 0.0000 and flare_penalty is 0.000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /plants"
              payload: { site_id: "${site_id}", plant_code: "P1", receipt_point_code: "RP-7", receipt_point_mdq_dth_per_day: 4800.0, min_feed_scfm: 900.0 }
              as: ProjectAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-02", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w2_id: $.data.id }
            - call: "POST /wells/${w1_id}/readings"
              payload: { taken_at: "2026-08-10T01:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 480.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
            - call: "POST /wells/${w2_id}/readings"
              payload: { taken_at: "2026-08-10T01:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 470.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
            - call: "POST /plants/${plant_id}/status"
              payload: { process_mode: "UPGRADING" }
              as: PlantOperator
            - call: "POST /offtake-contracts"
              payload: { site_id: "${site_id}", counterparty_name: "Bluewater Energy", contract_mdq_dth_per_day: 3000.0, price_usd_per_dth: 5.25, term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: CommercialScheduler
              captures: { contract_id: $.data.id }
            - call: "POST /offtake-contracts/${contract_id}/status"
              payload: { to_status: "ACTIVE" }
              as: CommercialScheduler
              captures: { ctr_v1: $.data.version }
            - call: "POST /pipeline-nominations"
              payload: { contract_id: "${contract_id}", plant_id: "${plant_id}", gas_day_start: "2026-08-10T00:00:00Z", gas_day_end: "2026-08-11T00:00:00Z", nominated_dth: 2400.0, expected_contract_version: "${ctr_v1}" }
              as: CommercialScheduler
              captures: { nom_id: $.data.id }
            - call: "POST /pipeline-nominations/${nom_id}/status"
              payload: { to_status: "CONFIRMED" }
              as: CommercialScheduler
            - call: "POST /injection-batches"
              payload: { plant_id: "${plant_id}", interval_start: "2026-08-10T02:00:00Z", interval_end: "2026-08-10T05:00:00Z", hourly_volumes_mscf: [115.0, 115.0, 115.0], methane_pct: 97.4, oxygen_pct: 0.1, co2_pct: 1.4 }
              as: PlantOperator
              captures: { b1_id: $.data.id }
            - call: "POST /injection-batches/${b1_id}/status"
              payload: { to_status: "PENDING_ANALYSIS" }
              as: PlantOperator
            - call: "POST /injection-batches/${b1_id}/status"
              payload: { to_status: "NOMINATED", nomination_id: "${nom_id}" }
              as: CommercialScheduler
            - call: "POST /injection-batches/${b1_id}/status"
              payload: { to_status: "INJECTED" }
              as: PlantOperator
          trigger:
            - call: "POST /attribute-batches"
              payload: { injection_batch_id: "${b1_id}", program: "LCFS", generation_period: "2026-08" }
              as: ComplianceOfficer
              as_user_id: "officer-alice"
              captures: { ab_lcfs_id: $.data.id }
          assert:
            - "AttributeBatch.${ab_lcfs_id}.energy_basis_mmbtu == 340.14"
            - "AttributeBatch.${ab_lcfs_id}.ci_project_gco2e_per_mj == 36.500"
            - "AttributeBatch.${ab_lcfs_id}.ci_project_gco2e_per_mj != 29.000"
            - "AttributeBatch.${ab_lcfs_id}.lcfs_credits == 17.9190"
            - "AttributeBatch.${ab_lcfs_id}.rin_count == 0"
            - "AttributeBatch.${ab_lcfs_id}.status == GENERATED"
