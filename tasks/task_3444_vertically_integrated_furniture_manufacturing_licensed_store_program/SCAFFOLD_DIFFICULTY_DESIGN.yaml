          - state_machines.Licensee.ACTIVE_to_PROBATION
          - errors.ERR_INVALID_TRANSITION
        distinguishing_aspect: |
          Boundary on a SCORE metric via the cycle-close endpoint: a closing
          cycle producing seasoned_score == 60.00 exactly does NOT probation the
          licensee (the rule is strictly below 60.00). Distinct metric and
          endpoint from the credit instance.
        test_recipe:
