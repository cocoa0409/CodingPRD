      - name: giving_period_window_overlap_is_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=36]
          - errors[ERR_GIVING_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: giving_period_closed_interval_touching_endpoint_collides
          rationale: "The difficulty instance already drives the closed-interval boundary in both directions (a period starting exactly on an existing period_end collides, one day later does not), which subsumes any coarser overlap corner."

      - name: lien_window_conflict_is_rejected_at_assignment
        claim_type: temporal_validation
        grounds:
          - validations[priority=37]
          - errors[ERR_COLLATERAL_LIEN_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: collateral_lien_window_half_open_with_thirty_day_buffer_conflicts
          rationale: "The difficulty instance already pins the half-open comparison plus the 30-day release buffer on the same lien position, including the first non-conflicting day."

      - name: draw_above_the_free_commitment_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=49]
          - errors[ERR_DRAW_EXCEEDS_COMMITMENT]
        excluded_because:
          difficulty_instance: draw_create_state_precedes_commitment_fiscal_check
          rationale: "The difficulty instance drives the free-commitment arithmetic (undrawn less reserved) at its exact boundary and additionally proves priority 20 answers before it, so a standalone over-commitment corner would add nothing."

      - name: fewer_than_four_giving_periods_blocks_underwriting
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=42]
          - errors[ERR_INSUFFICIENT_GIVING_HISTORY]
        excluded_because:
          difficulty_instance: submit_underwriting_with_three_giving_periods_rejected_four_accepted
          rationale: "The difficulty instance sits exactly on the four-period requirement from both sides on one institution."

      - name: unauthorized_packet_and_broken_collateral_link_at_referral
        claim_type: priority_ordering
        grounds:
          - validations[priority=30]
          - validations[priority=38]
          - errors[ERR_GOVERNANCE_NOT_AUTHORIZED]
          - errors[ERR_COLLATERAL_LINK_BROKEN]
        excluded_because:
          difficulty_instance: committee_referral_governance_compliance_precedes_collateral_referential
          rationale: "The difficulty instance already shows the governance-compliance guard answering before the collateral referential guard on the same referral, then each in isolation."

      - name: disburse_while_a_covenant_is_breached_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=45]
          - errors[ERR_DRAW_BLOCKED_BY_COVENANT_BREACH]
        excluded_because:
          difficulty_instance: draw_disburse_blocked_while_covenant_breached
          rationale: "The difficulty instance covers the breach block and the recovery path (waiver, then reinstatement, then a successful disbursement) on one loan."

      - name: workout_proposal_on_an_open_loan_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=25]
          - errors[ERR_WORKOUT_INVALID_STATE]
        excluded_because:
          difficulty_instance: workout_proposal_gated_by_loan_posture_derived_from_covenant
          rationale: "The difficulty instance walks the posture gate across OPEN (rejected), WATCH (admitted) and WORKOUT_GATED, which is the whole of priority 25's posture clause."

      - name: dscr_threshold_comparison_is_inclusive
        claim_type: satisfaction_to_pass
        grounds:
          - calculations.dscr_covenant_ratio
          - entities.Covenant.fields.threshold_ratio
        excluded_because:
          difficulty_instance: dscr_ratio_exactly_at_threshold_passes
          rationale: "The difficulty instance tests ratio == threshold and threshold plus one ten-thousandth on the same covenant, which is the only interesting point of the comparison."

