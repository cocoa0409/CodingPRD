  - section: calculations
    instances:
      - name: academy_hiring_signal_weights_injury_headcount_and_ceils_the_class
        claim_type: Correct Result
        grounds:
          - calculations.academy_hiring_signal
          - endpoints["GET /fire-ops/stations/{station_id}/academy-hiring-signal"]
        distinguishing_aspect: "With 5 open seats and one member on injury leave raw_need is 5 + 1*2 = 7 and the recommended class is ceil(7/4) = 2 in tier MONITOR — the injury body is weighted 2, not 1, and the division ceils rather than truncating to 1."
        test_recipe:
          setup:
            - "Station 90 with floor 1 and one company ENGINE-90 (crew 5, no required certifications)."
            - "One member ff90 (platoon C, Kelly 1, rate 4000) moved to INJURY_LEAVE effective 2026-08-01."
            - "The 2026-08-11 shift is published, so five OPEN vacancies exist and none is filled."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 90", battalion_code: "E2", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 500000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-08-31" }
              as: StaffingOfficer
              captures: { st90: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st90}", unit_designation: "ENGINE-90", apparatus_type: "ENGINE", minimum_crew_size: 5, required_certifications: [], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng90: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st90}", full_name: "H Hoyt", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 1, kelly_day_cycle_position: 1, certifications: [], hourly_rate_cents: 4000 }
              as: StaffingOfficer
              captures: { ff90: "$.data.id", ff90_v: "$.data.version" }
            - call: "POST /fire-ops/firefighters/${ff90}/availability"
              payload: { expected_firefighter_version: "${ff90_v}", effective_date: "2026-08-01", employment_status: "INJURY_LEAVE" }
              as: StaffingOfficer
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st90}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh90: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh90}/publish"
              payload: {}
              as: StaffingOfficer
          trigger:
            - call: "GET /fire-ops/stations/${st90}/academy-hiring-signal"
