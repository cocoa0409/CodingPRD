  - rule_id: cross_entity_state_dependency
    instances:
      - name: cycle_activate_gated_by_instrument_and_guide_states
        grounds:
          - state_machines.AssessmentCycle.SETUP_to_ACTIVE
          - errors[ERR_INSTRUMENT_NOT_VALIDATED]
          - errors[ERR_GUIDE_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair AssessmentCycle -> AssessmentInstrument (and, separately triggered,
          AssessmentCycle -> InterviewGuide): activate is rejected with ERR_INSTRUMENT_NOT_VALIDATED
          once the pinned instrument has aged to EXPIRED via clock, and with ERR_GUIDE_NOT_APPROVED
          when the pinned guide is only PILOT. Two distinct cross-entity gates on one transition.
        test_recipe:
          setup:
