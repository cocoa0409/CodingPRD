            - call: "POST /petfood/ingredients"
              payload: { aafco_name: "Duck Meal", ingredient_code: "DKML0020", nutrient_matrix: { CRUDE_PROTEIN: 0.60, CRUDE_FAT: 0.13, MOISTURE: 0.08 }, allergen_class: "POULTRY" }
              as: FormulationScientist
              captures: { ing_id: $.data.id }
            - call: "POST /petfood/supplier-ingredient-approvals"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_id}", coa_document_ref: "COA-V200" }
              as: QualityAnalyst
              captures: { sia_id: $.data.id }
            - call: "POST /petfood/supplier-ingredient-approvals/${sia_id}/approve"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "RV-001", product_name: "Revoke Dog", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
            - call: "POST /petfood/formulas/${f_id}/ingredients"
              payload: { ingredient_id: "${ing_id}", inclusion_pct: 100.0 }
