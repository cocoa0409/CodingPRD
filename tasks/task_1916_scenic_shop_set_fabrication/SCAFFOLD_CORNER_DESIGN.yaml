            - "Bid.${bid_2}.status == SUBMITTED   # valid_until 2026-08-31 >= clock"

      - name: auth_failure_beats_not_found
        claim_type: priority_ordering
        grounds:
          - 'validations[priority=1]'
          - 'validations[priority=3]'
        distinguishing_aspect: "A request that is both unauthenticated AND targets a nonexistent id returns ERR_UNAUTHENTICATED (401) — priority 1 always precedes existence (priority 3), so no resource-existence information leaks to anonymous callers."
