# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds in SCAFFOLD.yaml 1.1-1.7. Logical clock defaults to
# 2026-08-01T00:00:00Z at startup; recipes set it explicitly when needed.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: censored_substitution_sqrt2_over_half
        grounds:
          - calculations.censored_substitution
          - calculations.assessment_statistics
          - entities.ExposureAssessment.fields.substitution_rule
        distinguishing_aspect: |
          Entity domain = LabResult censoring. With masses 12/10/3 ug against LOD 5 ug the
          detection ratio is 2/3 >= 0.5 with n=3, so the SQRT2 variant is selected and the
          non-detect enters at 0.0037 mg/m3; the HALF counterfactual would enter at 0.0026 and
          yield ucl95 0.0296 instead of 0.0237. Asserts pin the SQRT2 selection and its literals.
        test_recipe:
          setup:
            - "Site with PB limit 0.05 mg/m3 (OSHA_PEL/TWA8), SEG with 3 members, plan required=3, APPROVED"
            - "3 PERSONAL samples (2.0 LPM pre/post, 240 min, 2026-08-03) SEALED, calibrations VALID, plan FIELD_COMPLETE"
            - "Batch LOD 5/LOQ 10, window 2026-08-10..2026-08-14, clock at 2026-08-10; results 12, 10, 3 ug entered by u_lab_1"
          setup_api_calls:
            - { call: "POST /ih/sites", payload: { name: "Apex Coating", industry_code: "332812" }, as: FirmAdmin, captures: { site: $.data.id } }
            - { call: "POST /ih/exposure-limits", payload: { analyte_code: "PB", basis: "OSHA_PEL", limit_type: "TWA8", limit_mg_m3: 0.05 }, as: FirmAdmin, captures: { lim: $.data.id } }
            - { call: "POST /ih/segs", payload: { site_id: "${site}", name: "Painters", analyte_code: "PB", exposure_limit_id: "${lim}", task_description: "spray line" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { seg: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E One", external_ref: "E1", job_title: "Painter" }, as: FirmAdmin, captures: { e1: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E Two", external_ref: "E2", job_title: "Painter" }, as: FirmAdmin, captures: { e2: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E Three", external_ref: "E3", job_title: "Painter" }, as: FirmAdmin, captures: { e3: $.data.id } }
            - { call: "POST /ih/seg-memberships", payload: { seg_id: "${seg}", employee_id: "${e1}", is_primary: true }, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/seg-memberships", payload: { seg_id: "${seg}", employee_id: "${e2}" }, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/seg-memberships", payload: { seg_id: "${seg}", employee_id: "${e3}" }, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/sampling-plans", payload: { seg_id: "${seg}", purpose: "INITIAL", planned_start_date: "2026-08-03", planned_end_date: "2026-08-14" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { plan: $.data.id } }
            - { call: "POST /ih/sampling-plans/${plan}/submit", payload: {}, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/sampling-plans/${plan}/approve", payload: {}, as: CIHDirector, as_user_id: u_cih_1 }
            - { call: "POST /ih/pumps", payload: { site_id: "${site}", serial_number: "P-001" }, as: FirmAdmin, captures: { p1: $.data.id } }
            - { call: "POST /ih/pumps", payload: { site_id: "${site}", serial_number: "P-002" }, as: FirmAdmin, captures: { p2: $.data.id } }
            - { call: "POST /ih/pumps", payload: { site_id: "${site}", serial_number: "P-003" }, as: FirmAdmin, captures: { p3: $.data.id } }
            - { call: "POST /ih/pump-calibrations", payload: { pump_id: "${p1}", pre_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { c1: $.data.id } }
            - { call: "POST /ih/pump-calibrations", payload: { pump_id: "${p2}", pre_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { c2: $.data.id } }
            - { call: "POST /ih/pump-calibrations", payload: { pump_id: "${p3}", pre_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { c3: $.data.id } }
            - { call: "POST /ih/field-samples", payload: { sampling_plan_id: "${plan}", sample_type: "PERSONAL", employee_id: "${e1}", pump_id: "${p1}", pre_calibration_id: "${c1}", collection_date: "2026-08-03", start_minute: 480, duration_minutes: 240 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { s1: $.data.id } }
            - { call: "POST /ih/field-samples", payload: { sampling_plan_id: "${plan}", sample_type: "PERSONAL", employee_id: "${e2}", pump_id: "${p2}", pre_calibration_id: "${c2}", collection_date: "2026-08-03", start_minute: 480, duration_minutes: 240 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { s2: $.data.id } }
            - { call: "POST /ih/field-samples", payload: { sampling_plan_id: "${plan}", sample_type: "PERSONAL", employee_id: "${e3}", pump_id: "${p3}", pre_calibration_id: "${c3}", collection_date: "2026-08-03", start_minute: 480, duration_minutes: 240 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { s3: $.data.id } }
            - { call: "POST /ih/field-samples/${s1}/seal", payload: {}, as: FieldTechnician, as_user_id: u_tech_1 }
            - { call: "POST /ih/field-samples/${s2}/seal", payload: {}, as: FieldTechnician, as_user_id: u_tech_1 }
            - { call: "POST /ih/field-samples/${s3}/seal", payload: {}, as: FieldTechnician, as_user_id: u_tech_1 }
            - { call: "POST /ih/pump-calibrations/${c1}/record-post", payload: { post_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1 }
            - { call: "POST /ih/pump-calibrations/${c2}/record-post", payload: { post_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1 }
            - { call: "POST /ih/pump-calibrations/${c3}/record-post", payload: { post_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1 }
            - { call: "POST /ih/sampling-plans/${plan}/complete-field", payload: {}, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/lab-batches", payload: { site_id: "${site}", analyte_code: "PB", lod_ug: 5, loq_ug: 10, window_start_date: "2026-08-10", window_end_date: "2026-08-14", max_capacity: 10 }, as: LabAnalyst, as_user_id: u_lab_1, captures: { batch: $.data.id } }
            - { call: "POST /ih/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: FirmAdmin, as_user_id: u_admin }
            - { call: "POST /ih/lab-results", payload: { field_sample_id: "${s1}", lab_batch_id: "${batch}", mass_ug: 12 }, as: LabAnalyst, as_user_id: u_lab_1 }
            - { call: "POST /ih/lab-results", payload: { field_sample_id: "${s2}", lab_batch_id: "${batch}", mass_ug: 10 }, as: LabAnalyst, as_user_id: u_lab_1 }
            - { call: "POST /ih/lab-results", payload: { field_sample_id: "${s3}", lab_batch_id: "${batch}", mass_ug: 3 }, as: LabAnalyst, as_user_id: u_lab_1, captures: { r3: $.data.id } }
            - { call: "GET /ih/segs/${seg}", payload: {}, as: IndustrialHygienist, captures: { seg_v: $.data.version } }
          trigger:
            - { call: "POST /ih/exposure-assessments", payload: { sampling_plan_id: "${plan}", expected_seg_version: "${seg_v}" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { asm: $.data.id } }
          assert:
            - "ExposureAssessment.${asm}.substitution_rule == SQRT2 (ratio 2/3 >= 0.5 and n == 3)"
            - "ExposureAssessment.${asm}.n_valid == 3"
            - "ExposureAssessment.${asm}.geo_mean == 0.0078"
            - "ExposureAssessment.${asm}.gsd == 1.9275"
            - "ExposureAssessment.${asm}.ucl95 == 0.0237"
            - "ExposureAssessment.${asm}.lcl95 == 0.0026"
            - "ExposureAssessment.${asm}.exposure_class == BELOW_PEL_MONITOR (ucl 0.0237 <= 0.05 PEL, > 0.005 action)"
            - "FieldSample.${s3}.is_detect == false and its substituted x value 0.0037 differs from the HALF counterfactual 0.0026 (HALF would have produced ucl95 0.0296)"

      - name: unsampled_time_zero_fill_vs_worst_case
        grounds:
          - calculations.sample_twa
          - calculations.air_volume_concentration
          - entities.SamplingPlan.fields.unsampled_time_rule
        distinguishing_aspect: |
          Entity domain = FieldSample TWA (different domain from the LabResult censoring instance).
          Identical physical data (mass 20 ug, 120 min < FULL_SHIFT_MIN 420, 2.0 LPM) yields
          sample_twa 0.0208 under ZERO_FILL (plan A) and 0.0833 under WORST_CASE (plan B).
        test_recipe:
          setup:
            - "One SEG with 1 member (required=3 per min clamp); plan A ZERO_FILL, plan B WORST_CASE, both APPROVED"
            - "3 short samples per plan: 2.0 LPM, 120 min, mass 20 ug; plan A collected 2026-08-03, plan B 2026-08-04 (same pump, no date collision)"
          setup_api_calls:
            - { call: "POST /ih/sites", payload: { name: "Bolt Works", industry_code: "332710" }, as: FirmAdmin, captures: { site: $.data.id } }
            - { call: "POST /ih/exposure-limits", payload: { analyte_code: "CR", basis: "OSHA_PEL", limit_type: "TWA8", limit_mg_m3: 0.05 }, as: FirmAdmin, captures: { lim: $.data.id } }
            - { call: "POST /ih/segs", payload: { site_id: "${site}", name: "Grinders", analyte_code: "CR", exposure_limit_id: "${lim}", task_description: "grinding" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { seg: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "G One", external_ref: "G1", job_title: "Grinder" }, as: FirmAdmin, captures: { e1: $.data.id } }
            - { call: "POST /ih/seg-memberships", payload: { seg_id: "${seg}", employee_id: "${e1}", is_primary: true }, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/sampling-plans", payload: { seg_id: "${seg}", purpose: "INITIAL", planned_start_date: "2026-08-03", planned_end_date: "2026-08-14", unsampled_time_rule: "ZERO_FILL" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { planA: $.data.id } }
            - { call: "POST /ih/sampling-plans/${planA}/submit", payload: {}, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/sampling-plans/${planA}/approve", payload: {}, as: CIHDirector, as_user_id: u_cih_1 }
            - { call: "POST /ih/sampling-plans", payload: { seg_id: "${seg}", purpose: "INITIAL", planned_start_date: "2026-08-03", planned_end_date: "2026-08-14", unsampled_time_rule: "WORST_CASE" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { planB: $.data.id } }
            - { call: "POST /ih/sampling-plans/${planB}/submit", payload: {}, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/sampling-plans/${planB}/approve", payload: {}, as: CIHDirector, as_user_id: u_cih_1 }
            - { call: "POST /ih/pumps", payload: { site_id: "${site}", serial_number: "P-100" }, as: FirmAdmin, captures: { p1: $.data.id } }
            - { call: "POST /ih/pump-calibrations", payload: { pump_id: "${p1}", pre_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { ca1: $.data.id } }
            - { call: "POST /ih/pump-calibrations", payload: { pump_id: "${p1}", pre_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { ca2: $.data.id } }
            - { call: "POST /ih/pump-calibrations", payload: { pump_id: "${p1}", pre_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { ca3: $.data.id } }
            - { call: "POST /ih/field-samples", payload: { sampling_plan_id: "${planA}", sample_type: "PERSONAL", employee_id: "${e1}", pump_id: "${p1}", pre_calibration_id: "${ca1}", collection_date: "2026-08-03", start_minute: 480, duration_minutes: 120 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { sa1: $.data.id } }
            - { call: "POST /ih/field-samples", payload: { sampling_plan_id: "${planA}", sample_type: "PERSONAL", employee_id: "${e1}", pump_id: "${p1}", pre_calibration_id: "${ca2}", collection_date: "2026-08-03", start_minute: 620, duration_minutes: 120 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { sa2: $.data.id } }
            - { call: "POST /ih/field-samples", payload: { sampling_plan_id: "${planA}", sample_type: "PERSONAL", employee_id: "${e1}", pump_id: "${p1}", pre_calibration_id: "${ca3}", collection_date: "2026-08-03", start_minute: 760, duration_minutes: 120 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { sa3: $.data.id } }
            - { call: "POST /ih/field-samples/${sa1}/seal", payload: {}, as: FieldTechnician, as_user_id: u_tech_1 }
            - { call: "POST /ih/field-samples/${sa2}/seal", payload: {}, as: FieldTechnician, as_user_id: u_tech_1 }
            - { call: "POST /ih/field-samples/${sa3}/seal", payload: {}, as: FieldTechnician, as_user_id: u_tech_1 }
            - { call: "POST /ih/pump-calibrations/${ca1}/record-post", payload: { post_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1 }
            - { call: "POST /ih/pump-calibrations/${ca2}/record-post", payload: { post_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1 }
            - { call: "POST /ih/pump-calibrations/${ca3}/record-post", payload: { post_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1 }
            - { call: "POST /ih/sampling-plans/${planA}/complete-field", payload: {}, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/pump-calibrations", payload: { pump_id: "${p1}", pre_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { cb1: $.data.id } }
            - { call: "POST /ih/pump-calibrations", payload: { pump_id: "${p1}", pre_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { cb2: $.data.id } }
            - { call: "POST /ih/pump-calibrations", payload: { pump_id: "${p1}", pre_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { cb3: $.data.id } }
            - { call: "POST /ih/field-samples", payload: { sampling_plan_id: "${planB}", sample_type: "PERSONAL", employee_id: "${e1}", pump_id: "${p1}", pre_calibration_id: "${cb1}", collection_date: "2026-08-04", start_minute: 480, duration_minutes: 120 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { sb1: $.data.id } }
            - { call: "POST /ih/field-samples", payload: { sampling_plan_id: "${planB}", sample_type: "PERSONAL", employee_id: "${e1}", pump_id: "${p1}", pre_calibration_id: "${cb2}", collection_date: "2026-08-04", start_minute: 620, duration_minutes: 120 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { sb2: $.data.id } }
            - { call: "POST /ih/field-samples", payload: { sampling_plan_id: "${planB}", sample_type: "PERSONAL", employee_id: "${e1}", pump_id: "${p1}", pre_calibration_id: "${cb3}", collection_date: "2026-08-04", start_minute: 760, duration_minutes: 120 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { sb3: $.data.id } }
            - { call: "POST /ih/field-samples/${sb1}/seal", payload: {}, as: FieldTechnician, as_user_id: u_tech_1 }
            - { call: "POST /ih/field-samples/${sb2}/seal", payload: {}, as: FieldTechnician, as_user_id: u_tech_1 }
            - { call: "POST /ih/field-samples/${sb3}/seal", payload: {}, as: FieldTechnician, as_user_id: u_tech_1 }
            - { call: "POST /ih/pump-calibrations/${cb1}/record-post", payload: { post_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1 }
            - { call: "POST /ih/pump-calibrations/${cb2}/record-post", payload: { post_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1 }
            - { call: "POST /ih/pump-calibrations/${cb3}/record-post", payload: { post_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1 }
            - { call: "POST /ih/sampling-plans/${planB}/complete-field", payload: {}, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/lab-batches", payload: { site_id: "${site}", analyte_code: "CR", lod_ug: 1, loq_ug: 2, window_start_date: "2026-08-10", window_end_date: "2026-08-14", max_capacity: 10 }, as: LabAnalyst, as_user_id: u_lab_1, captures: { batch: $.data.id } }
            - { call: "POST /ih/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: FirmAdmin, as_user_id: u_admin }
            - { call: "POST /ih/lab-results", payload: { field_sample_id: "${sa1}", lab_batch_id: "${batch}", mass_ug: 20 }, as: LabAnalyst, as_user_id: u_lab_1 }
            - { call: "POST /ih/lab-results", payload: { field_sample_id: "${sa2}", lab_batch_id: "${batch}", mass_ug: 20 }, as: LabAnalyst, as_user_id: u_lab_1 }
            - { call: "POST /ih/lab-results", payload: { field_sample_id: "${sa3}", lab_batch_id: "${batch}", mass_ug: 20 }, as: LabAnalyst, as_user_id: u_lab_1 }
          trigger:
            - { call: "POST /ih/lab-results", payload: { field_sample_id: "${sb1}", lab_batch_id: "${batch}", mass_ug: 20 }, as: LabAnalyst, as_user_id: u_lab_1 }
            - { call: "POST /ih/lab-results", payload: { field_sample_id: "${sb2}", lab_batch_id: "${batch}", mass_ug: 20 }, as: LabAnalyst, as_user_id: u_lab_1 }
            - { call: "POST /ih/lab-results", payload: { field_sample_id: "${sb3}", lab_batch_id: "${batch}", mass_ug: 20 }, as: LabAnalyst, as_user_id: u_lab_1 }
          assert:
            - "FieldSample.${sa1}.air_volume_liters == 240.0 and concentration_mg_m3 == 0.0833"
            - "FieldSample.${sa1}.sample_twa_mg_m3 == 0.0208 (ZERO_FILL: 0.0833 * 120/480)"
            - "FieldSample.${sb1}.concentration_mg_m3 == 0.0833 (identical chain to plan A)"
            - "FieldSample.${sb1}.sample_twa_mg_m3 == 0.0833 (WORST_CASE: full shift at measured concentration)"
            - "SamplingPlan.${planA}.status == LAB_COMPLETE and SamplingPlan.${planB}.status == LAB_COMPLETE"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: required_count_table_branch_clamp
        grounds:
          - calculations.required_sample_count
          - entities.SamplingPlan.fields.required_sample_count
        distinguishing_aspect: |
          Mode (a): >=3 inputs (headcount, prior class, purpose) with non-linear interaction —
          lookup table + conditional +3 adjustment + min-3 clamp + VERIFICATION flat bypass.
          Same SEG (H=3): INITIAL with class NONE -> 3; after a SIGNED UNCERTAIN assessment,
          FOLLOWUP -> 6; VERIFICATION -> 3 (table skipped entirely).
        test_recipe:
          setup:
            - "SEG H=3 whose first plan (required 3) is driven to a SIGNED UNCERTAIN assessment (masses 10,12,40 ug; UCL 0.0627 > PEL 0.05, LCL 0.0049)"
          setup_api_calls:
            - { call: "POST /ih/sites", payload: { name: "Apex Coating", industry_code: "332812" }, as: FirmAdmin, captures: { site: $.data.id } }
            - { call: "POST /ih/exposure-limits", payload: { analyte_code: "PB", basis: "OSHA_PEL", limit_type: "TWA8", limit_mg_m3: 0.05 }, as: FirmAdmin, captures: { lim: $.data.id } }
            - { call: "POST /ih/segs", payload: { site_id: "${site}", name: "Painters", analyte_code: "PB", exposure_limit_id: "${lim}", task_description: "spray line" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { seg: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E One", external_ref: "E1", job_title: "Painter" }, as: FirmAdmin, captures: { e1: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E Two", external_ref: "E2", job_title: "Painter" }, as: FirmAdmin, captures: { e2: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E Three", external_ref: "E3", job_title: "Painter" }, as: FirmAdmin, captures: { e3: $.data.id } }
            - { call: "POST /ih/seg-memberships", payload: { seg_id: "${seg}", employee_id: "${e1}" }, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/seg-memberships", payload: { seg_id: "${seg}", employee_id: "${e2}" }, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/seg-memberships", payload: { seg_id: "${seg}", employee_id: "${e3}" }, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/sampling-plans", payload: { seg_id: "${seg}", purpose: "INITIAL", planned_start_date: "2026-08-03", planned_end_date: "2026-08-14" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { plan1: $.data.id } }
            - { call: "POST /ih/sampling-plans/${plan1}/submit", payload: {}, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/sampling-plans/${plan1}/approve", payload: {}, as: CIHDirector, as_user_id: u_cih_1 }
            - { call: "POST /ih/pumps", payload: { site_id: "${site}", serial_number: "P-001" }, as: FirmAdmin, captures: { p1: $.data.id } }
            - { call: "POST /ih/pumps", payload: { site_id: "${site}", serial_number: "P-002" }, as: FirmAdmin, captures: { p2: $.data.id } }
            - { call: "POST /ih/pumps", payload: { site_id: "${site}", serial_number: "P-003" }, as: FirmAdmin, captures: { p3: $.data.id } }
            - { call: "POST /ih/pump-calibrations", payload: { pump_id: "${p1}", pre_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { c1: $.data.id } }
            - { call: "POST /ih/pump-calibrations", payload: { pump_id: "${p2}", pre_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { c2: $.data.id } }
