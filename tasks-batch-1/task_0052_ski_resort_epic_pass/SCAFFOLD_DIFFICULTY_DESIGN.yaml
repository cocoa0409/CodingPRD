# ==========================================================================
# 1.8 SCAFFOLD DIFFICULTY DESIGN (Test Targeting Index) — depth probe
# Task: task_0052_ski_resort_epic_pass
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# Every grounds[] ref resolves to a declared element in SCAFFOLD.yaml.
# Every setup_api_calls / trigger call resolves to a §1.5 endpoint; every ${var}
# is bound by an earlier captures: block in the same instance.
# ==========================================================================
scaffold_difficulty_design:

  # ------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: refund_injury_flat_vs_prorated_with_fee
        grounds:
          - calculations.end_of_season_refund
          - calculations.end_of_season_refund.variants.injury_flat
          - calculations.end_of_season_refund.variants.prorated_with_fee
          - entities.RefundRequest.fields.refund_amount_cents
          - entities.RefundRequest.fields.reason
          - entities.RefundRequest.fields.scan_count_at_request
          - state_machines.RefundRequest.PENDING_to_APPROVED
        distinguishing_aspect: |
          Same RefundRequest snapshot (basis=10000, used=4) yields two different
          payouts depending only on reason: INJURY -> flat round(10000*0.90)=9000;
          RELOCATION -> round(10000*(6/10)*0.90)=5400. Same entity, two valid
          algorithms, divergent cents.
        test_recipe:
          setup:
            - "Clock at 2026-01-10 (in-season). One FULL_EPIC PassProduct price_cents=10000."
            - "Two passes A and B, both ACTIVE with refund_basis_cents=10000."
            - "Pass A scanned 4 times GRANTED (scan_count=4); a PENDING RefundRequest reason=INJURY snapshots scan_count_at_request=4."
            - "Pass B scanned 4 times GRANTED (scan_count=4); a PENDING RefundRequest reason=RELOCATION snapshots scan_count_at_request=4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "FULL_EPIC", price_cents: 10000, buddy_ticket_allotment: 0, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Vail", home_network: "EPIC", gate_count: 4 }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Holder A" }
              as: ResortOps
              captures: { pass_a_id: $.data.id, tok_a: $.data.magnetic_token }
            - call: "POST /passes/${pass_a_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /passes/${pass_a_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok_a}" }
              as: ResortOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T08:10:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_a_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok_a}" }
              as: ResortOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T08:20:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_a_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok_a}" }
              as: ResortOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T08:30:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_a_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok_a}" }
              as: ResortOps
            - call: "POST /refund-requests"
              payload: { pass_id: "${pass_a_id}", reason: "INJURY" }
              as: RefundAdmin
              captures: { rr_a_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Holder B" }
              as: ResortOps
              captures: { pass_b_id: $.data.id, tok_b: $.data.magnetic_token }
            - call: "POST /passes/${pass_b_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T09:00:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_b_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok_b}" }
              as: ResortOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T09:10:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_b_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok_b}" }
              as: ResortOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T09:20:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_b_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok_b}" }
              as: ResortOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T09:30:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_b_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok_b}" }
              as: ResortOps
            - call: "POST /refund-requests"
              payload: { pass_id: "${pass_b_id}", reason: "RELOCATION" }
              as: RefundAdmin
              captures: { rr_b_id: $.data.id }
            - call: "GET /passes/${pass_a_id}"
              payload: {}
              as: RefundAdmin
              captures: { pass_a_ver: $.data.version }
            - call: "GET /passes/${pass_b_id}"
              payload: {}
              as: RefundAdmin
              captures: { pass_b_ver: $.data.version }
          trigger:
            - call: "POST /refund-requests/${rr_a_id}/approve"
              payload: { expected_pass_version: "${pass_a_ver}" }
              as: RefundAdmin
            - call: "POST /refund-requests/${rr_b_id}/approve"
              payload: { expected_pass_version: "${pass_b_ver}" }
              as: RefundAdmin
          assert:
            - "RefundRequest.${rr_a_id}.refund_amount_cents == 9000"
            - "RefundRequest.${rr_b_id}.refund_amount_cents == 5400"
            - "RefundRequest.${rr_a_id}.status == APPROVED"
            - "RefundRequest.${rr_b_id}.status == APPROVED"

      - name: refund_payout_vs_buddy_remaining_aggregation
        grounds:
          - calculations.end_of_season_refund
          - calculations.buddy_tickets_remaining
          - entities.RefundRequest.fields.refund_amount_cents
          - entities.Pass.fields.buddy_tickets_remaining
        distinguishing_aspect: |
          One calculation is monetary proration on a RefundRequest
          (refund_amount_cents over RefundRequest+Pass), the other is an integer
          allotment count on a Pass (buddy_tickets_remaining over BuddyTicket
          rows). Different entity domains and different algorithms (threshold vs
          aggregation): payout=5400 cents while buddy_tickets_remaining=1.
        test_recipe:
          setup:
            - "Clock at 2026-01-15. PassProduct price_cents=10000, buddy_ticket_allotment=2, buddy_ticket_price_cents=3000, EPIC home."
            - "One EPIC resort. One ACTIVE pass, refund_basis_cents=10000, scanned 4 times GRANTED, one RESERVED BuddyTicket (so buddy_tickets_remaining=1)."
            - "A PENDING RefundRequest reason=DISSATISFIED snapshots scan_count_at_request=4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "LOCAL", price_cents: 10000, buddy_ticket_allotment: 2, buddy_ticket_price_cents: 3000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Keystone", home_network: "EPIC", gate_count: 2 }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Holder C" }
              as: ResortOps
              captures: { pass_id: $.data.id, tok: $.data.magnetic_token }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /buddy-tickets"
              payload: { pass_id: "${pass_id}", resort_id: "${resort_id}", guest_name: "Guest 1", valid_date: "2026-01-16" }
              as: ResortOps
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T08:10:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T08:20:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T08:30:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
            - call: "POST /refund-requests"
              payload: { pass_id: "${pass_id}", reason: "DISSATISFIED" }
              as: RefundAdmin
              captures: { rr_id: $.data.id }
            - call: "GET /passes/${pass_id}"
              payload: {}
              as: RefundAdmin
              captures: { pass_ver: $.data.version }
          trigger:
            - call: "GET /passes/${pass_id}"
              payload: {}
              as: RefundAdmin
              captures: { rem_before: $.data.buddy_tickets_remaining }
            - call: "POST /refund-requests/${rr_id}/approve"
              payload: { expected_pass_version: "${pass_ver}" }
              as: RefundAdmin
          assert:
            - "Pass.${pass_id}.buddy_tickets_remaining (before approval) == 1"
            - "RefundRequest.${rr_id}.refund_amount_cents == 5400"

  # ------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: scan_decision_nonlinear_branch_ordering
        grounds:
          - calculations.scan_access_decision
          - calculations.scan_access_decision.variants.ikon_interchange_scan
          - entities.LiftScan.fields.result
          - entities.LiftScan.fields.denial_reason
          - validations[priority=9]
        distinguishing_aspect: |
          Mode (a): scan_access_decision is a >=4-input formula (presented_token,
          pass.status, resort.status, prior-grant window, resort.home_network,
          product.ikon_interchange_enabled, agreement.status, distinct interchange
          days, product.tier, blackout_dates) with conditional branches on entity
          state. Here a token-OK, ACTIVE pass at an IKON resort with interchange
          enabled but distinct_interchange_days_used==max (1) is DENIED
          NO_INTERCHANGE even though blackout would otherwise pass: branch
          ordering decides the outcome.
        test_recipe:
          setup:
            - "Clock 2026-02-01. PassProduct LOCAL, ikon_interchange_enabled=true, blackout_dates=[]."
            - "An IKON-home resort with an ACTIVE InterchangeAgreement max_interchange_days=1."
            - "One ACTIVE pass that already used its single interchange scan-day at this resort on 2026-02-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "LOCAL", price_cents: 5000, ikon_interchange_enabled: true, blackout_dates: [] }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Aspen IKON", home_network: "IKON", gate_count: 1 }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /interchange-agreements"
              payload: { resort_id: "${resort_id}", max_interchange_days: 1 }
              as: NetworkAdmin
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Holder D" }
              as: ResortOps
              captures: { pass_id: $.data.id, tok: $.data.magnetic_token }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
              captures: { first_result: $.data.result }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T08:30:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
              captures: { result2: $.data.result, reason2: $.data.denial_reason }
          assert:
            - "first_result == GRANTED"
            - "LiftScan(second).result == DENIED"
            - "LiftScan(second).denial_reason == NO_INTERCHANGE"

      - name: refund_single_rounding_order_pinned
        grounds:
          - calculations.end_of_season_refund
          - calculations.end_of_season_refund.variants.prorated_with_fee
          - entities.RefundRequest.fields.refund_amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. basis=9999, used=3,
          MAX=10. Single-rounding (pinned): round_half_up(9999*(7/10)*0.90) =
          round_half_up(6299.37) = 6299. The scaffold pins one rounding step on
          the final cents value, distinguishing it from any per-step rounding
          order.
        test_recipe:
          setup:
            - "Clock 2026-01-20. PassProduct price_cents=9999, EPIC, no blackout."
            - "ACTIVE pass refund_basis_cents=9999, scanned 3 times GRANTED."
            - "PENDING RefundRequest reason=RELOCATION snapshots scan_count_at_request=3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-20T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "EPIC_DAY", price_cents: 9999, ikon_interchange_enabled: false, blackout_dates: [] }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Breck", home_network: "EPIC", gate_count: 3 }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Holder E" }
              as: ResortOps
              captures: { pass_id: $.data.id, tok: $.data.magnetic_token }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-20T08:10:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-20T08:20:00Z" }
              as: NetworkAdmin
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
            - call: "POST /refund-requests"
              payload: { pass_id: "${pass_id}", reason: "RELOCATION" }
              as: RefundAdmin
              captures: { rr_id: $.data.id }
            - call: "GET /passes/${pass_id}"
              payload: {}
              as: RefundAdmin
              captures: { pass_ver: $.data.version }
          trigger:
            - call: "POST /refund-requests/${rr_id}/approve"
              payload: { expected_pass_version: "${pass_ver}" }
              as: RefundAdmin
          assert:
            - "RefundRequest.${rr_id}.refund_amount_cents == 6299"

  # ------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: pass_branching_active_to_suspended_refunded_expired
        grounds:
          - state_machines.Pass
          - state_machines.Pass.ISSUED_to_ACTIVE
          - state_machines.Pass.ACTIVE_to_SUSPENDED
          - state_machines.Pass.SUSPENDED_to_ACTIVE
          - state_machines.Pass.ACTIVE_to_REFUNDED
          - state_machines.Pass.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          Pass is non-linear: ACTIVE forks to {SUSPENDED, REFUNDED, EXPIRED} with
          divergent side-effect sets, and SUSPENDED->ACTIVE is a revert cycle. Here
          a pass goes ACTIVE->SUSPENDED->ACTIVE (cycle), proving it is not a linear
          A->B->C pipeline. Entity = Pass.
        test_recipe:
          setup:
            - "Clock 2026-01-05 (in-season). FULL_EPIC product. One ISSUED pass."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "FULL_EPIC", price_cents: 8000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Cycle Holder" }
              as: ResortOps
              captures: { pass_id: $.data.id }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /passes/${pass_id}/suspend"
              payload: {}
              as: ResortOps
              captures: { st_suspended: $.data.status }
          trigger:
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
              captures: { st_reactivated: $.data.status }
          assert:
            - "Pass.${pass_id}.status (after suspend) == SUSPENDED"
            - "Pass.${pass_id}.status (after re-activate) == ACTIVE"

      - name: buddy_ticket_branching_reserved_to_redeemed_or_cancelled
        grounds:
          - state_machines.BuddyTicket
          - state_machines.BuddyTicket.RESERVED_to_REDEEMED
          - state_machines.BuddyTicket.RESERVED_to_CANCELLED
          - entities.BuddyTicket.fields.status
        distinguishing_aspect: |
          BuddyTicket forks from RESERVED to either REDEEMED or CANCELLED with
          different side effects (redeem keeps the allotment consumed; cancel frees
          it and bumps Pass.buddy_tickets_remaining). Two divergent branches from
          one state on a different entity (BuddyTicket) than the Pass machine.
        test_recipe:
          setup:
            - "Clock 2026-01-06. Product allotment=2. ACTIVE pass with two RESERVED buddy tickets (different dates)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-06T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "LOCAL", price_cents: 4000, buddy_ticket_allotment: 2, buddy_ticket_price_cents: 2500, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Park City", home_network: "EPIC", gate_count: 1 }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Buddy Host" }
              as: ResortOps
              captures: { pass_id: $.data.id }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /buddy-tickets"
              payload: { pass_id: "${pass_id}", resort_id: "${resort_id}", guest_name: "G1", valid_date: "2026-01-07" }
              as: ResortOps
              captures: { bt1_id: $.data.id }
            - call: "POST /buddy-tickets"
              payload: { pass_id: "${pass_id}", resort_id: "${resort_id}", guest_name: "G2", valid_date: "2026-01-08" }
              as: ResortOps
              captures: { bt2_id: $.data.id }
          trigger:
            - call: "POST /buddy-tickets/${bt1_id}/redeem"
              payload: {}
              as: ResortOps
              captures: { bt1_status: $.data.status }
            - call: "POST /buddy-tickets/${bt2_id}/cancel"
              payload: {}
              as: ResortOps
              captures: { bt2_status: $.data.status }
          assert:
            - "BuddyTicket.${bt1_id}.status == REDEEMED"
            - "BuddyTicket.${bt2_id}.status == CANCELLED"
            - "Pass.${pass_id}.buddy_tickets_remaining == 1"

  # ------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: refund_approve_depth3_cascade
        grounds:
          - state_machines.RefundRequest.PENDING_to_APPROVED
          - state_machines.Pass.ACTIVE_to_REFUNDED
          - state_machines.BuddyTicket.RESERVED_to_CANCELLED
          - calculations.buddy_tickets_remaining
          - entities.Pass.fields.buddy_tickets_remaining
        distinguishing_aspect: |
          Depth-3 cascade from a distinct trigger (refund approve): approving the
          RefundRequest (A) transitions the referenced Pass ACTIVE->REFUNDED (B);
          that Pass transition itself cancels its RESERVED BuddyTickets
          RESERVED->CANCELLED (C); the cancel recomputes Pass.buddy_tickets_remaining
          back to the full allotment. Each link is caused by the previous link.
        test_recipe:
          setup:
            - "Clock 2026-01-12. Product allotment=2. ACTIVE pass, refund_basis_cents=6000, scan_count=1, with two RESERVED buddy tickets (buddy_tickets_remaining=0)."
            - "PENDING RefundRequest reason=INJURY snapshot scan_count_at_request=1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-12T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "LOCAL", price_cents: 6000, buddy_ticket_allotment: 2, buddy_ticket_price_cents: 2000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Heavenly", home_network: "EPIC", gate_count: 2 }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Cascade Holder" }
              as: ResortOps
              captures: { pass_id: $.data.id, tok: $.data.magnetic_token }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /buddy-tickets"
              payload: { pass_id: "${pass_id}", resort_id: "${resort_id}", guest_name: "G1", valid_date: "2026-01-13" }
              as: ResortOps
              captures: { bt1_id: $.data.id }
            - call: "POST /buddy-tickets"
              payload: { pass_id: "${pass_id}", resort_id: "${resort_id}", guest_name: "G2", valid_date: "2026-01-14" }
              as: ResortOps
              captures: { bt2_id: $.data.id }
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "${tok}" }
              as: ResortOps
            - call: "POST /refund-requests"
              payload: { pass_id: "${pass_id}", reason: "INJURY" }
              as: RefundAdmin
              captures: { rr_id: $.data.id }
            - call: "GET /passes/${pass_id}"
              payload: {}
              as: RefundAdmin
              captures: { pass_ver: $.data.version }
          trigger:
            - call: "POST /refund-requests/${rr_id}/approve"
              payload: { expected_pass_version: "${pass_ver}" }
              as: RefundAdmin
          assert:
            - "RefundRequest.${rr_id}.status == APPROVED"
            - "Pass.${pass_id}.status == REFUNDED"
            - "BuddyTicket.${bt1_id}.status == CANCELLED"
            - "BuddyTicket.${bt2_id}.status == CANCELLED"
            - "Pass.${pass_id}.buddy_tickets_remaining == 2"

      - name: clock_advance_expiry_depth2_cascade
        grounds:
          - state_machines.Pass.ACTIVE_to_EXPIRED
          - state_machines.BuddyTicket.RESERVED_to_CANCELLED
          - calculations.buddy_tickets_remaining
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (system clock advance past
          season end): advancing the clock (A) auto-transitions the ACTIVE Pass
          ACTIVE->EXPIRED (B); that expiry cancels its RESERVED BuddyTicket
          RESERVED->CANCELLED and recomputes buddy_tickets_remaining. Originates
          from a system auto-transition, not the refund-approve trigger above.
        test_recipe:
          setup:
            - "Clock 2026-04-01 (in-season). Product allotment=1. ACTIVE pass with one RESERVED buddy ticket."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "LOCAL", price_cents: 5000, buddy_ticket_allotment: 1, buddy_ticket_price_cents: 1500, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Stowe", home_network: "EPIC", gate_count: 1 }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Expiry Holder" }
              as: ResortOps
              captures: { pass_id: $.data.id }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /buddy-tickets"
              payload: { pass_id: "${pass_id}", resort_id: "${resort_id}", guest_name: "G1", valid_date: "2026-04-02" }
              as: ResortOps
              captures: { bt_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T08:00:00Z" }
              as: NetworkAdmin
          assert:
            - "Pass.${pass_id}.status == EXPIRED"
            - "BuddyTicket.${bt_id}.status == CANCELLED"
            - "Pass.${pass_id}.buddy_tickets_remaining == 1"

  # ------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_referential_on_refund_approve
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_REFUND_INELIGIBLE]
          - state_machines.RefundRequest.PENDING_to_APPROVED
        distinguishing_aspect: |
          Pair = state (priority 6, ERR_INVALID_STATE) vs business_referential
          (priority 10, ERR_REFUND_INELIGIBLE). A refund-approve on an
          already-APPROVED RefundRequest whose Pass is also REFUNDED fails both;
          the lower-priority state check wins -> ERR_INVALID_STATE, not
          ERR_REFUND_INELIGIBLE.
        test_recipe:
          setup:
            - "Clock 2026-01-18. Product price=5000, scan-light pass. A RefundRequest already APPROVED (Pass already REFUNDED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-18T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "EPIC_DAY", price_cents: 5000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Dbl Approve" }
              as: ResortOps
              captures: { pass_id: $.data.id }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /refund-requests"
              payload: { pass_id: "${pass_id}", reason: "INJURY" }
              as: RefundAdmin
              captures: { rr_id: $.data.id }
            - call: "GET /passes/${pass_id}"
              payload: {}
              as: RefundAdmin
              captures: { pass_ver: $.data.version }
            - call: "POST /refund-requests/${rr_id}/approve"
              payload: { expected_pass_version: "${pass_ver}" }
              as: RefundAdmin
          trigger:
            - call: "POST /refund-requests/${rr_id}/approve"
              payload: { expected_pass_version: "${pass_ver}" }
              as: RefundAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: state_vs_fiscal_on_buddy_reserve
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_BUDDY_ALLOTMENT_EXHAUSTED]
          - state_machines.Pass.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Pair = state (priority 6, ERR_INVALID_STATE) vs business_fiscal
          (priority 12, ERR_BUDDY_ALLOTMENT_EXHAUSTED) - a different error-category
          pair than the state-vs-referential conflict above. Reserving against a
          SUSPENDED pass whose allotment is also exhausted fails state first:
          the host pass is not ACTIVE so ERR_INVALID_STATE wins over the fiscal
          allotment check.
        test_recipe:
          setup:
            - "Clock 2026-01-19. Product allotment=1. Pass activated, one buddy ticket reserved (allotment exhausted), then pass SUSPENDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
