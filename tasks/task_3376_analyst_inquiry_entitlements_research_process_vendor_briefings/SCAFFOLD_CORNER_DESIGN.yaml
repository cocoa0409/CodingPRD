          - endpoints.POST_/research/inquiry-requests
        distinguishing_aspect: "Topic routing reports an empty candidate pool explicitly: a topic route no ACTIVE analyst lists is a 409 ERR_ANALYST_NOT_ELIGIBLE and no InquiryRequest row is written."
