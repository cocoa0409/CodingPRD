              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: VenueAdmin
              captures: { cl_ssp_id: $.data.id }
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_bb_id}", event_name: "Sunbelt Home Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-06-08", show_start_date: "2027-06-10", show_end_date: "2027-06-12", move_out_end_date: "2027-06-13" }
              as: SalesManager
              captures: { bk_id: $.data.id, bk_v1: $.data.version }
            - call: "POST /convention-center/bookings/${bk_id}/holds"
              payload: { expected_booking_version: "${bk_v1}" }
              as: SalesManager
              captures: { hold_id: $.data.id }
            - call: "POST /convention-center/maintenance-blackouts"
              payload: { space_id: "${sp_bc_id}", window_start_date: "2027-12-01", window_end_date: "2027-12-10", project_kind: "CAPITAL_PROJECT", buffer_days: 2 }
              as: FacilitiesPlanner
              captures: { bl_id: $.data.id }
            - call: "POST /convention-center/maintenance-blackouts/${bl_id}/approve"
