          - validations[priority=70]
          - errors[ERR_CARE_MANAGER_SLOT_CONFLICT]
          - entities.Touch.fields.scheduled_start_at
        distinguishing_aspect: |
          Overlap rule one occupies the CareManager calendar with buffered-exclusive geometry: the
          candidate is widened by 15 minutes on both sides against raw occupant intervals, so a touch
          starting exactly when an existing one ends (09:30 after 09:00-09:30) is REJECTED, and the
          smallest accepted gap is exactly 15 minutes (09:45 start).
