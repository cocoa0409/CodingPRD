            - "GET /mpi/downstream-systems/${sys_ack_id} returns unacked_task_count == 1"
            - "Both subsumed records are MERGED_SUBSUMED regardless of the flag: only the MergeOperation lifecycle differs"

      - name: fraud_substantiation_cascade_reaches_record_pair_and_site
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.FraudInvestigation
        excluded_because:
          difficulty_instance: substantiated_fraud_cascades_record_pair_and_site_counter
          rationale: "The difficulty instance already walks the full three-level chain (investigation SUBSTANTIATED -> record FRAUD_CONFIRMED -> every non-resolved pair referencing that record ESCALATED_FRAUD -> site flagged_record_count) and asserts each level in the same request, which is exactly the end-to-end cascade claim for this layer."

