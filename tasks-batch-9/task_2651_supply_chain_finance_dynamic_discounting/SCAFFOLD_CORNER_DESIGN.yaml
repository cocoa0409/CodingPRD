            - call: "POST /suppliers/${supplier_id}/bank-accounts"
              payload: { routing_number: "011000015", account_last4: "8899" }
              as: PlatformOps
              captures: { bank_id: "$.data.id", md_code: "$.data.micro_deposit_code" }
            - call: "POST /bank-accounts/${bank_id}/micro-deposit/confirm"
              payload: { code: "${md_code}" }
              as: PlatformOps
              captures: { bank_status: "$.data.status" }
            - call: "POST /funders/${funder_id}/commitments"
              payload: { committed_amount_cents: 60000000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-30T00:00:00Z" }
              as: PlatformOps
              captures: { commitment_status: "$.data.status" }
            - call: "POST /suppliers/${supplier_id}/idv/adjudicate"
              payload: { decision: "PASSED", identity_score: 90 }
              as: PlatformOps
              captures: { onboarding_final: "$.data.onboarding_status" }
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Back Office Programme", program_type: "SUPPLIER_NAMED", max_acceptable_apr_bps: 1200 }
              as: PlatformOps
              captures: { err_program_create: "$.data.error_id" }
          assert:
            - "onboarding_after_submit == VERIFYING"
            - "md_code == 015889 - the last three routing digits 015 followed by the first three account_last4 digits 889"
            - "bank_status == VERIFIED and Supplier.${supplier_id}.bank_status == VERIFIED"
            - "after the deposit confirmation Supplier.${supplier_id}.onboarding_status is still VERIFYING and payment_ready_at is null - the identity axis is still open"
            - "commitment_status == ACTIVE and Funder.${funder_id}.available_capital_cents == 60000000"
            - "onboarding_final == ACTIVE with payment_ready_at set - the fork-join closes on the second axis"
            - "err_program_create == ERR_UNAUTHORIZED with HTTP 403 and GET /buyers/${buyer_id}/programs returns meta.total_count == 0"

      - name: buyer_admin_of_another_buyer_cannot_read_this_program
        claim_type: unauthorized_denial
        grounds:
          - validations[priority=5]
          - errors.ERR_FORBIDDEN_RESOURCE_SCOPE
          - roles.BuyerAdmin
          - roles.Supplier
        distinguishing_aspect: |
          The caller holds a role the endpoint accepts, so the refusal is not about the role but
          about ownership: a BuyerAdmin reading another buyer's programme and a Supplier reading
          another supplier's record must both get 403 ERR_FORBIDDEN_RESOURCE_SCOPE, distinct from the
          403 ERR_UNAUTHORIZED a wrong role would get and from the 404 a non-existent id would get.
          The same read of the caller's own programme succeeds.
