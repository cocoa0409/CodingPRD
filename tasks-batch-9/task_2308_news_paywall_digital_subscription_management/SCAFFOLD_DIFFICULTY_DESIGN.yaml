              captures: { rd10: "$.data.id" }
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd10}", offer_plan_id: "${plan_p6}", expected_offer_plan_version: "${plan_p6_v2}" }
              as: SubscriptionOpsAgent
              captures: { sub10: "$.data.id" }
            - call: "GET /paywall/subscriptions/${sub10}/invoices"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { inv10: "$.data[0].id" }
            - call: "POST /paywall/invoices/${inv10}/payment-attempts"
              payload: { outcome: "SUCCEEDED", amount_cents: 999 }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/subscriptions/${sub10}/holds"
              payload: { hold_type: "VACATION_DELIVERY", start_date: "2026-09-06", end_date: "2026-09-30" }
              as: Reader
              as_user_id: "${rd10}"
              captures: { hold10: "$.data.id" }
          trigger:
            - call: "POST /paywall/subscriptions/${sub10}/holds"
              payload: { hold_type: "VACATION_DELIVERY", start_date: "2026-10-01", end_date: "2026-10-06" }
              as: Reader
              as_user_id: "${rd10}"
              captures: { err10: "$.data.error_id" }
          assert:
            - "the response status is 409 and error_id == ERR_HOLD_BUFFER_VIOLATION"
            - "error_id != ERR_VACATION_DAY_CAP_EXCEEDED"
            - "Hold rows on Subscription.${sub10} == 1"
            - "Hold.${hold10}.delivery_days_credited == 4"
            - "Hold.${hold10}.credit_cents == 900"
            - "Subscription.${sub10}.vacation_days_used_365 == 25"
            - "Subscription.${sub10}.pending_credit_cents == 900"

  - rule_id: boundary_precision_check
    instances:
      - name: meter_allowance_boundary_grants_exactly_four_distinct_articles
        grounds:
          - calculations.paywall_access_decision
          - calculations.paywall_rule_selection
          - endpoints[POST /paywall/access-decisions]
        distinguishing_aspect: |
          Boundary on the integer meter counter at POST /paywall/access-decisions:
          the 4th distinct article is the last GRANTED_METERED (>= comparison against
          effective_allowance 4), the 5th is BLOCKED_METER, and a re-read of the 1st
          article is still granted with meter_index 1 and does NOT increment the counter.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "No PaywallRule rows exist, so paywall_rule_selection falls back to METER with SITE_DEFAULT_METER_ALLOWANCE 4."
            - "A registered reader with propensity_band MEDIUM (PROPENSITY_ALLOWANCE_DELTA 0) -> effective_allowance 4."
            - "Five published METERED articles a1..a5 (published_at 2026-08-15T00:00:00Z)."
            - "Access decisions were already taken on a1, a2 and a3, so metered_distinct_article_count == 3."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/readers"
              payload: { email: "meter@mail.test", is_registered: true, propensity_band: "MEDIUM" }
              as: SubscriptionOpsAgent
              captures: { rdm: "$.data.id" }
            - call: "POST /paywall/articles"
              payload: { headline: "Article A1", section: "NEWS", content_type: "NEWS", access_class: "METERED", published_at: "2026-08-15T00:00:00Z" }
              as: RevenueManager
              captures: { a1: "$.data.id" }
            - call: "POST /paywall/articles"
              payload: { headline: "Article A2", section: "NEWS", content_type: "NEWS", access_class: "METERED", published_at: "2026-08-15T00:00:00Z" }
              as: RevenueManager
              captures: { a2: "$.data.id" }
            - call: "POST /paywall/articles"
              payload: { headline: "Article A3", section: "NEWS", content_type: "NEWS", access_class: "METERED", published_at: "2026-08-15T00:00:00Z" }
              as: RevenueManager
              captures: { a3: "$.data.id" }
            - call: "POST /paywall/articles"
              payload: { headline: "Article A4", section: "NEWS", content_type: "NEWS", access_class: "METERED", published_at: "2026-08-15T00:00:00Z" }
              as: RevenueManager
              captures: { a4: "$.data.id" }
            - call: "POST /paywall/articles"
              payload: { headline: "Article A5", section: "NEWS", content_type: "NEWS", access_class: "METERED", published_at: "2026-08-15T00:00:00Z" }
              as: RevenueManager
              captures: { a5: "$.data.id" }
            - call: "POST /paywall/access-decisions"
              payload: { reader_id: "${rdm}", article_id: "${a1}" }
              as: Reader
              as_user_id: "${rdm}"
            - call: "POST /paywall/access-decisions"
              payload: { reader_id: "${rdm}", article_id: "${a2}" }
              as: Reader
              as_user_id: "${rdm}"
            - call: "POST /paywall/access-decisions"
              payload: { reader_id: "${rdm}", article_id: "${a3}" }
              as: Reader
              as_user_id: "${rdm}"
          trigger:
            - call: "POST /paywall/access-decisions"
              payload: { reader_id: "${rdm}", article_id: "${a4}" }
              as: Reader
              as_user_id: "${rdm}"
              captures: { dec4: "$.data.decision", idx4: "$.data.meter_index" }
            - call: "POST /paywall/access-decisions"
              payload: { reader_id: "${rdm}", article_id: "${a5}" }
              as: Reader
              as_user_id: "${rdm}"
              captures: { dec5: "$.data.decision" }
            - call: "POST /paywall/access-decisions"
              payload: { reader_id: "${rdm}", article_id: "${a1}" }
              as: Reader
              as_user_id: "${rdm}"
              captures: { dec_repeat: "$.data.decision", idx_repeat: "$.data.meter_index" }
          assert:
            - "the 4th-article decision has decision == GRANTED_METERED, meter_index == 4, effective_allowance == 4, event_type == ARTICLE_VIEW_GRANTED, weight == 3"
            - "the 5th-article decision has decision == BLOCKED_METER, event_type == ARTICLE_VIEW_BLOCKED, weight == 0, effective_allowance == 4"
            - "the a1 re-read decision has decision == GRANTED_METERED and meter_index == 1"
            - "Reader.${rdm}.metered_distinct_article_count == 4"
            - "Reader.${rdm}.meter_period_started_on == 2026-09-01"
            - "ReaderEvent rows for Reader.${rdm} == 6"
            - "Reader.${rdm}.engagement_score == 15.00"
            - "Reader.${rdm}.churn_risk_band == MEDIUM"

      - name: price_notice_window_boundary_thirty_days_exactly
        grounds:
          - validations[priority=34]
          - errors[ERR_PRICE_NOTICE_WINDOW_TOO_SHORT]
          - state_machines.OfferPlan.SCHEDULED_to_NOTICE_SENT
        distinguishing_aspect: |
          Boundary on a different metric (the PRICE_NOTICE_WINDOW_DAYS calendar gap)
          at a different endpoint (POST /paywall/offer-plans/{id}/price-change/notices):
          with the clock at 2026-09-01, an effective date of 2026-09-30 is 29 days out
          and rejected, while 2026-10-01 is exactly 30 days out and accepted.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Two ACTIVE DIGITAL_ONLY plans, each with a SCHEDULED price change: plan A to 1799 effective 2026-09-30 (29 days out) and plan B to 1799 effective 2026-10-01 (30 days out)."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
