  - method: POST
    path: "/comics/production-stages/{id}/start"
    purpose: "Creator starts (or restarts after a kick-back) work on a stage."
    roles: [Creator]
    input: []
    output: ProductionStage
    side_effects:
      - "stage.status NOT_STARTED|KICKED_BACK -> IN_PROGRESS"
      - "assignment.status ACCEPTED -> ACTIVE"
      - "issue.production_status re-derived per §1.2"
      - "increments ProductionStage.version, CreativeAssignment.version and Issue.version"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_STAGE_NOT_FOUND, ERR_FORBIDDEN_RESOURCE, ERR_INVALID_STATE, ERR_ASSIGNMENT_NOT_ACCEPTED]
  - method: POST
    path: "/comics/production-stages/{id}/deliver"
    purpose: "Creator delivers pages; lateness is measured and a slip may unwind the issue's solicitation and order book."
    roles: [Creator]
    input: ["delivered_pages"]
    output: ProductionStage
    side_effects:
      - "stage.status IN_PROGRESS -> DELIVERED with actual_delivered_at = logical clock"
      - "recomputes stage.slip_days by stage_slip_days"
      - "CASCADE hop 1: issue.total_slip_days recomputed, then issue.schedule_health recomputed by schedule_health_posture"
      - "CASCADE hop 2 (caused by schedule_health becoming SLIPPED): open Solicitation rows of the issue -> WITHDRAWN (AUTO_SLIP) and issue.commercial_status -> UNSOLICITED"
      - "CASCADE hop 3 (caused by hop 2): Catalog.accepted_slot_count recomputed by catalog_slot_rollup and the issue's SUBMITTED/FOC_LOCKED orders -> CANCELLED (AUTO_SLIP)"
      - "CASCADE hop 4 (caused by hop 3): Retailer.cumulative_units_ytd / discount_tier / open_balance_cents and Issue.total_ordered_units recomputed"
      - "issue.production_status re-derived"
      - "increments ProductionStage.version and Issue.version"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_STAGE_NOT_FOUND, ERR_INVALID_REQUEST, ERR_FORBIDDEN_RESOURCE, ERR_INVALID_STATE]
  - method: POST
    path: "/comics/production-stages/{id}/kick-back"
    purpose: "Editor rejects a delivery and sends the stage back for revision, which can move the issue's production status backwards."
    roles: [ManagingEditor]
    input: ["note"]
    output: ProductionStage
    side_effects:
      - "stage.status DELIVERED -> KICKED_BACK and kickback_count incremented"
      - "issue.production_status re-derived from the child statuses (a kicked-back stage can hold the issue inside its current phase; regression across a craft boundary is only reachable by adding a further stage, see POST /comics/issues/{id}/production-stages)"
      - "increments ProductionStage.version and Issue.version"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_STAGE_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE]
  - method: POST
    path: "/comics/production-stages/{id}/approve"
    purpose: "Editor approves a delivery, freezing the page fee into the title's production cost ledger."
    roles: [ManagingEditor]
    input: []
    output: ProductionStage
    side_effects:
      - "stage.status DELIVERED -> APPROVED"
      - "freezes stage.page_fee_cents and refreshes title.production_cost_cents by stage_page_fee_ledger"
      - "assignment.status ACTIVE -> COMPLETED when every stage of that assignment is APPROVED"
      - "issue.production_status re-derived"
      - "increments ProductionStage.version, Issue.version and Title.version"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_STAGE_NOT_FOUND, ERR_INVALID_STATE]

