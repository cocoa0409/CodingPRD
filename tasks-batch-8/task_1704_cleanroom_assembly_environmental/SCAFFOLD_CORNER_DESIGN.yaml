  # ===========================================================================
  # Section: calculations — correct results, input-set filtering, constants,
  # precision, variant selection/reconciliation.
  # ===========================================================================
  - section: calculations
    instances:
      - name: action_boundary_sample_trips_action_excursion
        claim_type: correct_result
        grounds:
          - "calculations.sample_classification"
        distinguishing_aspect: "result_value exactly equal to action limit (352000) classifies ACTION_EXCEEDED (>= on action); 351999 is only ALERT_EXCEEDED."
        test_recipe:
          setup: ["Room CR-C1 ISO_7 with ACTIVE PARTICLE point SP-C1"]
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-C1", iso_class: "ISO_7", particle_alert_limit: 300000, particle_action_limit: 352000, viable_alert_limit: 50, viable_action_limit: 100, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_c1: $.data.id }
            - call: "POST /cleanroom/rooms/${room_c1}/sampling-points"
              payload: { point_code: "SP-C1", metric: "PARTICLE", zone_iso_class: "ISO_7" }
              as: QualityAssurance
              captures: { sp_c1: $.data.id }
          trigger:
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_c1}", result_value: 351999, sampled_at: "2026-08-01T09:00:00Z" }
              as: EnvironmentTech
              captures: { samp_c1a: $.data.id }
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_c1}", result_value: 352000, sampled_at: "2026-08-01T09:05:00Z" }
              as: EnvironmentTech
              captures: { samp_c1b: $.data.id }
          assert:
            - "EnvironmentalSample.${samp_c1a}.classification == ALERT_EXCEEDED  (351999 < action 352000 but >= alert 300000)"
            - "EnvironmentalSample.${samp_c1b}.classification == ACTION_EXCEEDED  (352000 >= action 352000: boundary inclusive)"
            - "Excursion triggered by ${samp_c1b} has severity == ACTION"

      - name: certification_mean_exactly_at_alert_limit_fails
        claim_type: correct_result
        grounds:
          - "calculations.certification_grade_check"
        distinguishing_aspect: "mean exactly equal to particle_alert_limit FAILS certification (strict <), unlike the per-sample >= excursion rule — the asymmetric boundary is pinned."
        test_recipe:
          setup: ["Room CR-C2 with VALIDATED cleaning, zero open excursions; location means [300000, 300000] -> mean 300000.0 == alert 300000"]
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-C2", iso_class: "ISO_7", particle_alert_limit: 300000, particle_action_limit: 352000, viable_alert_limit: 50, viable_action_limit: 100, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_c2: $.data.id, room_c2_v: $.data.version }
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_c2}", method_code: "MOP-C2", required_consecutive_passes: 1 }
              as: QualityAssurance
              captures: { prog_c2: $.data.id }
            - call: "POST /cleanroom/cleaning-programs/${prog_c2}/activate"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_c2}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_c2: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_c2}/verify"
              payload: {}
              as: QualityAssurance
          trigger:
            - call: "POST /cleanroom/rooms/${room_c2}/certifications"
              payload: { executed_at: "2026-08-01T12:00:00Z", location_mean_values: [300000, 300000], expected_room_version: "${room_c2_v}" }
              as: QualityAssurance
              captures: { err_c2: $.data.error_id }
          assert:
            - "HTTP 409 error_id == ERR_CERTIFICATION_GRADE_FAILED  (mean 300000.0 is NOT < 300000)"
            - "Cleanroom.${room_c2}.certification_status == UNCERTIFIED"

      - name: severity_recurrence_window_excludes_out_of_window
        claim_type: input_set_filtering
        grounds:
          - "calculations.excursion_severity_score"
        distinguishing_aspect: "Only CLOSED excursions at the same point with sampled_at in [now-30d, now) count; a closed excursion 31 days old is excluded, changing severity_score from 37.5 to 30.0."
        test_recipe:
          setup: ["Room CR-C3 ISO_5 with ACTIVE VIABLE point SP-C3 (zone ISO_5); one closed excursion sampled 2026-06-30T00:00:00Z (31 days before the new sample)"]
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-C3", iso_class: "ISO_5", particle_alert_limit: 100000, particle_action_limit: 352000, viable_alert_limit: 10, viable_action_limit: 20, recert_interval_days: 180 }
              as: QualityAssurance
