      - name: supplemental_band_keyed_on_base_only
        grounds:
          - calculations.per_pupil_funding_total
          - entities.FeeInvoice.fields.supplemental_cents
        distinguishing_aspect: |
          Mode (c): the supplemental band depends on total funding while supplemental feeds
          total funding — a circular-looking dependency the scaffold pins base-first. With
          base 199000000 (SMALL band, rate 0.12) the computed supplemental 3820800 pushes the
          total to 202820800, which would have been MID (0.08 -> 2547200) had the band been
          keyed on the total; the pinned order yields 3820800.
        test_recipe:
