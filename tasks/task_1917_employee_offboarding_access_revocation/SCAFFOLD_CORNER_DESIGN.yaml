  # =========================================================================
  # Section: validations
  # =========================================================================
  - section: validations
    instances:
      - name: unauthenticated_missing_headers_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Request without X-User-Role/X-User-ID -> 401 ERR_UNAUTHENTICATED on any endpoint."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /offboarding/offboarding-cases"
              payload: {}
              as: HRPartner
          assert:
            - "Server-side: omitting headers yields HTTP 401 ERR_UNAUTHENTICATED (fixture-level header removal; the call here declares the intended role for lint purposes)"
      - name: existence_precedes_state_left_to_right
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]"]
        distinguishing_aspect: "Execute on a non-existent task id -> 404 ERR_NOT_FOUND beats any state error (existence priority 3 < state priority 4)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /offboarding/access-revocation-tasks/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/execute"
              payload: { outcome: "SUCCESS" }
              as: ITOperator
              as_user_id: "it-op-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND"
      - name: temporal_end_before_start_interview_422
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_TEMPORAL_INVALID]"]
        distinguishing_aspect: "Interview scheduled_end <= scheduled_start -> ERR_TEMPORAL_INVALID."
        test_recipe:
          setup: ["CA case approved"]
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-V1", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_v1: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_v1}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
          trigger:
            - call: "POST /offboarding/exit-interviews"
              payload: { offboarding_case_id: "${case_v1}", interviewer_ref: "hr-int-1", scheduled_start: "2026-08-05T11:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }
              as: HRPartner
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_TEMPORAL_INVALID"
      - name: duplicate_sequence_rank_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "entities.AccessRevocationTask.fields.sequence_rank"]
        distinguishing_aspect: "Two tasks on same case with sequence_rank=1 -> second create 422 ERR_REFERENTIAL_INTEGRITY."
        test_recipe:
          setup: ["CA case approved; EMAIL task rank 1 exists"]
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-V2", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
              as: HRPartner
              as_user_id: "hr-intake-1"
              captures: { case_v2: $.data.id }
            - call: "POST /offboarding/offboarding-cases/${case_v2}/approve"
              payload: {}
              as: HRPartner
              as_user_id: "hr-approver-1"
            - call: "POST /offboarding/access-revocation-tasks"
              payload: { offboarding_case_id: "${case_v2}", system_name: "EMAIL", sequence_rank: 1 }
              as: ITManager
          trigger:
            - call: "POST /offboarding/access-revocation-tasks"
              payload: { offboarding_case_id: "${case_v2}", system_name: "VPN", sequence_rank: 1 }
              as: ITManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_REFERENTIAL_INTEGRITY"
      - name: duplicate_asset_tag_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "entities.AssetReturnItem.fields.asset_tag"]
        distinguishing_aspect: "Two items on same case with asset_tag=X -> second create 422 ERR_REFERENTIAL_INTEGRITY."
