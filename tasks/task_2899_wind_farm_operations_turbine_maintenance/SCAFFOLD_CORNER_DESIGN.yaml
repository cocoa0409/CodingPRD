            - call: "POST /wind-ops/farms/${farm_id}/landowner-settlements"
              payload: { parcel_code: "P-11", royalty_basis: "METERED_ONLY", period_start_utc: "2026-07-01T00:00:00Z", period_end_utc: "2026-08-01T00:00:00Z", royalty_pct: 4.0, minimum_payment_cents: 100000, energy_price_cents_per_kwh: 6, road_damage_assessment_cents: 0, expected_wind_farm_version: "${farm_v_fresh}" }
              as: CommercialManager
