      - name: packet_auto_closes_on_second_response
        claim_type: correct_result
        grounds: [calculations.calc_evidence_review_window, state_machines.EvidencePacket.RELEASED_FOR_REVIEW_to_REVIEW_CLOSED]
        distinguishing_aspect: "The review window closes at the EARLIER of both-responses-in or the 10-day deadline: after exactly one response the packet stays RELEASED_FOR_REVIEW; the second response immediately flips it to REVIEW_CLOSED without waiting for the deadline."
        test_recipe:
          setup: ["case [SEXUAL_HARASSMENT] with packet RELEASED_FOR_REVIEW at default clock"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
