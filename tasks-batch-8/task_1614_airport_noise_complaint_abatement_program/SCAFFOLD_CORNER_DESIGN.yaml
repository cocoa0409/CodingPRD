            - { call: "POST /noise-program/flight-operations", payload: { flight_number: "AP2", operator_id: "${op_id}", aircraft_type: "B738", engine_class: "STAGE_4", operation_type: "DEPARTURE", runway_code: "09L", scheduled_at: "2026-08-04T22:30:00Z", zone_code: "Z1" }, as: NoiseOfficeAdmin, captures: { f2: $.data.id } }
