scaffold_corner_design:

  # =========================================================================
  # Entities — creation, required fields, computed fields, defaults, retrieval
  # =========================================================================
  - section: entities
    instances:
      - name: create_membership_plan_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.MembershipPlan, endpoints]
        distinguishing_aspect: "POST /membership-plans with all required fields returns 201 and echoes tier, annual_service_limit, per_incident_mileage_cap_miles, overage_rate_cents_per_mile, priority_weight, covered_service_types, base_service_fee_cents; version starts at 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /membership-plans"
              payload: { tier: "PREMIER", annual_service_limit: 10, per_incident_mileage_cap_miles: 100, overage_rate_cents_per_mile: 150, priority_weight: 30, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 0 }
              as: DispatchOperator
              captures: { plan_id: $.data.id, plan_v: $.data.version }
          assert:
            - "response status == 201"
            - "MembershipPlan.${plan_id}.tier == PREMIER"
            - "MembershipPlan.${plan_id}.annual_service_limit == 10"
            - "MembershipPlan.${plan_id}.version == 1"

      - name: create_member_missing_required_plan_id_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Member.fields.plan_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /members omitting plan_id returns ERR_INVALID_REQUEST (422); plan_id has source input and no default."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { full_name: "No Plan", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_tow_call_without_dropoff_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.ServiceCall.fields.dropoff_lat, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /service-calls with service_type=TOW but no dropoff_lat/dropoff_lng returns ERR_INVALID_REQUEST (422); TOW requires drop-off coordinates."
        test_recipe:
          setup: ["A plan and an ACTIVE member."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 7500 }
              as: DispatchOperator
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", full_name: "Mia Member", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /service-calls"
              payload: { member_id: "${mem_id}", service_type: "TOW", breakdown_lat: 0.0, breakdown_lng: 0.0 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_service_call_computes_estimate_and_defaults
        claim_type: Computed Fields
        grounds: [entities.ServiceCall.fields.estimated_cost_cents, calculations.estimated_service_cost, entities.ServiceCall.fields.dispatch_attempts]
        distinguishing_aspect: "POST /service-calls for a non-TOW covered service (JUMP, covered) yields estimated_cost_cents=0, status=DISPATCHING, dispatch_attempts=0, tow_distance_miles=0 — computed fields ignore any client-supplied values."
        test_recipe:
          setup: ["A PLUS plan covering JUMP and an ACTIVE member."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 7500 }
              as: DispatchOperator
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", full_name: "Mia Member", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /service-calls"
              payload: { member_id: "${mem_id}", service_type: "JUMP", breakdown_lat: 0.0, breakdown_lng: 0.0 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { call_id: $.data.id }
          assert:
            - "response status == 201"
            - "ServiceCall.${call_id}.estimated_cost_cents == 0"
            - "ServiceCall.${call_id}.status == DISPATCHING"
            - "ServiceCall.${call_id}.dispatch_attempts == 0"
            - "ServiceCall.${call_id}.tow_distance_miles == 0"

      - name: uncovered_service_charges_base_fee_estimate
        claim_type: Computed Fields
        grounds: [calculations.estimated_service_cost, entities.MembershipPlan.fields.base_service_fee_cents]
        distinguishing_aspect: "POST /service-calls for LOCKOUT on a BASIC plan whose covered_service_types is [JUMP,TIRE] (LOCKOUT uncovered, non-tow) yields estimated_cost_cents=9000 (the plan base_service_fee_cents)."
        test_recipe:
          setup: ["A BASIC plan covering only JUMP,TIRE with base_service_fee_cents=9000; an ACTIVE member."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "BASIC", annual_service_limit: 2, per_incident_mileage_cap_miles: 3, overage_rate_cents_per_mile: 300, priority_weight: 5, covered_service_types: ["JUMP","TIRE"], base_service_fee_cents: 9000 }
              as: DispatchOperator
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", full_name: "Basic Bob", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /service-calls"
              payload: { member_id: "${mem_id}", service_type: "LOCKOUT", breakdown_lat: 0.0, breakdown_lng: 0.0 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { call_id: $.data.id }
          assert:
            - "response status == 201"
            - "ServiceCall.${call_id}.estimated_cost_cents == 9000"

      - name: get_member_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Member, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /members/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: DispatchOperator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: member_create_invalid_enum_tier_on_plan_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.MembershipPlan.fields.tier, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /membership-plans with tier='GOLD' (not in {BASIC,PLUS,PREMIER}) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /membership-plans"
              payload: { tier: "GOLD", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW"], base_service_fee_cents: 0 }
              as: DispatchOperator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

  # =========================================================================
  # State machines — invalid transitions, terminal lockdown, idempotency
  # =========================================================================
  - section: state_machines
    instances:
      - name: start_call_from_dispatching_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ServiceCall.ASSIGNED_to_EN_ROUTE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /service-calls/{id}/start on a DISPATCHING call (start requires ASSIGNED) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DISPATCHING TOW call with no accepted offer; provider exists."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 7500 }
              as: DispatchOperator
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", full_name: "Mia Member", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
            - call: "POST /service-providers"
              payload: { company_name: "Ace Tow", current_lat: 0.0, current_lng: 0.1, capabilities: ["TOW"], rating: 4.5 }
              as: DispatchOperator
              captures: { prov_id: $.data.id }
            - call: "POST /service-calls"
              payload: { member_id: "${mem_id}", service_type: "TOW", breakdown_lat: 0.0, breakdown_lng: 0.0, dropoff_lat: 0.0, dropoff_lng: 0.2 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { call_id: $.data.id }
          trigger:
            - call: "POST /service-calls/${call_id}/start"
              payload: {}
              as: ServiceProvider
              as_user_id: "${prov_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: cancel_completed_call_terminal_lockdown_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ServiceCall.DISPATCHING_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /service-calls/{id}/cancel on a COMPLETED (terminal) call returns ERR_INVALID_STATE (409); no transitions leave a terminal state."
        test_recipe:
          setup: ["A COMPLETED TOW call."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 7500 }
              as: DispatchOperator
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", full_name: "Mia Member", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
            - call: "POST /service-providers"
              payload: { company_name: "Ace Tow", current_lat: 0.0, current_lng: 0.1, capabilities: ["TOW"], rating: 4.5 }
              as: DispatchOperator
              captures: { prov_id: $.data.id }
            - call: "POST /service-calls"
              payload: { member_id: "${mem_id}", service_type: "TOW", breakdown_lat: 0.0, breakdown_lng: 0.0, dropoff_lat: 0.0, dropoff_lng: 0.2 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { call_id: $.data.id, call_v0: $.data.version }
            - call: "POST /service-calls/${call_id}/offers"
              payload: { provider_id: "${prov_id}", expected_service_call_version: "${call_v0}" }
              as: DispatchOperator
              captures: { offer_id: $.data.id }
            - call: "POST /service-calls/${call_id}/offers/${offer_id}/accept"
              payload: {}
              as: ServiceProvider
              as_user_id: "${prov_id}"
            - call: "POST /service-calls/${call_id}/start"
              payload: {}
              as: ServiceProvider
              as_user_id: "${prov_id}"
            - call: "POST /service-calls/${call_id}/complete"
              payload: { final_towed_miles: 20 }
              as: ServiceProvider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /service-calls/${call_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: accept_offer_idempotency_second_accept_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.DispatchOffer.OFFERED_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting an already-ACCEPTED offer a second time returns ERR_INVALID_STATE (409); the offer is no longer OFFERED."
        test_recipe:
          setup: ["A call with an ACCEPTED offer (provider ON_JOB)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 7500 }
              as: DispatchOperator
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", full_name: "Mia Member", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
            - call: "POST /service-providers"
              payload: { company_name: "Ace Tow", current_lat: 0.0, current_lng: 0.1, capabilities: ["TOW"], rating: 4.5 }
              as: DispatchOperator
              captures: { prov_id: $.data.id }
            - call: "POST /service-calls"
              payload: { member_id: "${mem_id}", service_type: "TOW", breakdown_lat: 0.0, breakdown_lng: 0.0, dropoff_lat: 0.0, dropoff_lng: 0.2 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { call_id: $.data.id, call_v0: $.data.version }
            - call: "POST /service-calls/${call_id}/offers"
              payload: { provider_id: "${prov_id}", expected_service_call_version: "${call_v0}" }
              as: DispatchOperator
              captures: { offer_id: $.data.id }
            - call: "POST /service-calls/${call_id}/offers/${offer_id}/accept"
              payload: {}
              as: ServiceProvider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /service-calls/${call_id}/offers/${offer_id}/accept"
              payload: {}
              as: ServiceProvider
              as_user_id: "${prov_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: offer_already_outstanding_blocks_second_dispatch
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=9]", "errors[ERR_OFFER_ALREADY_OUTSTANDING]"]
        distinguishing_aspect: "Dispatching a second offer while one is still OFFERED returns ERR_OFFER_ALREADY_OUTSTANDING (409); only one live offer at a time."
        test_recipe:
          setup: ["A DISPATCHING call with one live OFFERED offer; a second TOW provider available."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 7500 }
              as: DispatchOperator
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", full_name: "Mia Member", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
            - call: "POST /service-providers"
              payload: { company_name: "Ace Tow", current_lat: 0.0, current_lng: 0.1, capabilities: ["TOW"], rating: 4.5 }
              as: DispatchOperator
              captures: { prov1_id: $.data.id }
            - call: "POST /service-providers"
              payload: { company_name: "Bee Tow", current_lat: 0.0, current_lng: 0.05, capabilities: ["TOW"], rating: 4.6 }
              as: DispatchOperator
              captures: { prov2_id: $.data.id }
            - call: "POST /service-calls"
              payload: { member_id: "${mem_id}", service_type: "TOW", breakdown_lat: 0.0, breakdown_lng: 0.0, dropoff_lat: 0.0, dropoff_lng: 0.2 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { call_id: $.data.id, call_v0: $.data.version }
            - call: "POST /service-calls/${call_id}/offers"
              payload: { provider_id: "${prov1_id}", expected_service_call_version: "${call_v0}" }
              as: DispatchOperator
              captures: { offer1_id: $.data.id }
            - call: "GET /service-calls/${call_id}"
              payload: {}
              as: DispatchOperator
              captures: { call_v1: $.data.version }
          trigger:
            - call: "POST /service-calls/${call_id}/offers"
              payload: { provider_id: "${prov2_id}", expected_service_call_version: "${call_v1}" }
              as: DispatchOperator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_OFFER_ALREADY_OUTSTANDING"

  # =========================================================================
  # Validations — remaining error triggers, priority, business rules
  # =========================================================================
  - section: validations
    instances:
      - name: create_call_for_suspended_member_returns_membership_not_active
        claim_type: Violation -> Error
        grounds: ["validations[priority=6]", "errors[ERR_MEMBERSHIP_NOT_ACTIVE]", entities.Member.fields.status]
        distinguishing_aspect: "POST /service-calls for a SUSPENDED member returns ERR_MEMBERSHIP_NOT_ACTIVE (409)."
        test_recipe:
          setup: ["A member that has been suspended."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 7500 }
              as: DispatchOperator
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", full_name: "Sus Member", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/suspend"
              payload: {}
              as: DispatchOperator
          trigger:
            - call: "POST /service-calls"
              payload: { member_id: "${mem_id}", service_type: "JUMP", breakdown_lat: 0.0, breakdown_lng: 0.0 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_MEMBERSHIP_NOT_ACTIVE"

      - name: dispatch_limit_reached_after_max_attempts
        claim_type: Violation -> Error
        grounds: ["validations[priority=10]", "errors[ERR_DISPATCH_LIMIT_REACHED]", entities.ServiceCall.fields.dispatch_attempts]
        distinguishing_aspect: "After dispatch_attempts reaches MAX_DISPATCH_ATTEMPTS (assume 3) via repeated decline-then-reoffer, the next POST /offers returns ERR_DISPATCH_LIMIT_REACHED (409). NOTE: this corner assumes MAX_DISPATCH_ATTEMPTS=3; the PRD pins the constant and the test uses that value."
        test_recipe:
          setup: ["A DISPATCHING call; one TOW provider declines three times so dispatch_attempts==MAX_DISPATCH_ATTEMPTS."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 7500 }
              as: DispatchOperator
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", full_name: "Mia Member", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
            - call: "POST /service-providers"
              payload: { company_name: "Ace Tow", current_lat: 0.0, current_lng: 0.1, capabilities: ["TOW"], rating: 4.5 }
              as: DispatchOperator
              captures: { prov_id: $.data.id }
            - call: "POST /service-calls"
              payload: { member_id: "${mem_id}", service_type: "TOW", breakdown_lat: 0.0, breakdown_lng: 0.0, dropoff_lat: 0.0, dropoff_lng: 0.2 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { call_id: $.data.id, v0: $.data.version }
            - call: "POST /service-calls/${call_id}/offers"
              payload: { provider_id: "${prov_id}", expected_service_call_version: "${v0}" }
              as: DispatchOperator
              captures: { o1: $.data.id }
            - call: "POST /service-calls/${call_id}/offers/${o1}/decline"
              payload: {}
              as: ServiceProvider
              as_user_id: "${prov_id}"
            - call: "GET /service-calls/${call_id}"
              payload: {}
              as: DispatchOperator
              captures: { v1: $.data.version }
            - call: "POST /service-calls/${call_id}/offers"
              payload: { provider_id: "${prov_id}", expected_service_call_version: "${v1}" }
              as: DispatchOperator
              captures: { o2: $.data.id }
            - call: "POST /service-calls/${call_id}/offers/${o2}/decline"
              payload: {}
              as: ServiceProvider
              as_user_id: "${prov_id}"
            - call: "GET /service-calls/${call_id}"
              payload: {}
              as: DispatchOperator
              captures: { v2: $.data.version }
            - call: "POST /service-calls/${call_id}/offers"
              payload: { provider_id: "${prov_id}", expected_service_call_version: "${v2}" }
              as: DispatchOperator
              captures: { o3: $.data.id }
            - call: "POST /service-calls/${call_id}/offers/${o3}/decline"
              payload: {}
              as: ServiceProvider
              as_user_id: "${prov_id}"
            - call: "GET /service-calls/${call_id}"
              payload: {}
              as: DispatchOperator
              captures: { v3: $.data.version }
          trigger:
            - call: "POST /service-calls/${call_id}/offers"
              payload: { provider_id: "${prov_id}", expected_service_call_version: "${v3}" }
              as: DispatchOperator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_DISPATCH_LIMIT_REACHED"

      - name: annual_limit_exceeded_on_complete_failure_path
        claim_type: Violation -> Error
        grounds: ["validations[priority=13]", "errors[ERR_ANNUAL_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "With annual_service_limit=1 and one prior COMPLETED call, completing a second EN_ROUTE call returns ERR_ANNUAL_LIMIT_EXCEEDED (409) — the failure side of the boundary covered positively in §1.8."
        test_recipe:
          setup: ["Plan annual_limit=1; member with 1 prior COMPLETED call; a second EN_ROUTE call."]
