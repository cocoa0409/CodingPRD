          A third category pair: business_temporal (priority 23) versus business_constraint
          (priority 29) on POST /public-art/maintenance-visits. The requested window
          2026-08-11..2026-08-13 is both in the past relative to the clock 2026-08-20 and colliding
          with the still-SCHEDULED visit 2026-08-10..2026-08-12 at a site whose
