  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: cold_chain_threshold_strict_greater
        grounds:
          - calculations.cold_chain_breach
          - entities.TempLog.fields.breach_flag
        distinguishing_aspect: |
          Metric: temperature (F) on POST /glean/templogs. The threshold is a
          STRICT >: for HIGH perishability, temp_f == 41.0 exactly is NOT a
          breach while 41.1 IS. Asserted via breach_flag on the created TempLog
          and the downstream cold_chain_intact on the event's SCHEDULED
          distribution. Distinct metric and endpoint from the capacity and crew
          boundary instances.
        test_recipe:
          setup:
            - "HIGH-perishability refrigeration-required offer/event harvested 100.0 with one SCHEDULED distribution"
          setup_api_calls:
            - call: "POST /glean/farms"
              payload: { farm_name: "FB", contact_email: "fb@x.com", county_code: "BBB", donor_tin: "97-3456789" }
