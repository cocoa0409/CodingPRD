  # =========================================================================
  # Section: rbac
  # =========================================================================
  - section: rbac
    instances:

      - name: attorney_cannot_release_disbursement
        claim_type: rbac_denial
        grounds:
          - roles[Attorney]
          - roles[ManagingPartner]
          - endpoints[POST /disbursements/{id}/release]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          POST /disbursements/{id}/release is exclusive to ManagingPartner. An
          Attorney attempting it on a valid PENDING Disbursement is rejected with
          ERR_FORBIDDEN_ROLE (403). Disbursement.status remains PENDING.
        test_recipe:
          setup:
            - "A settled CA Case with one AGREED MedicalLien and a PENDING Disbursement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
