          - state_machines.TherapyEpisode.funding_state.transitions[UNFUNDED->PENDING_AUTH]
        distinguishing_aspect: "Creating a second Authorization for the same episode drives the FIRST one from DRAFT to the terminal EXPIRED state as a side effect of a write addressed to a different row, while funding_state stays PENDING_AUTH; a submit against the expired draft then returns ERR_AUTHORIZATION_STATE_INVALID."
